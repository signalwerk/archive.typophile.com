      <blockquote><p>I'd be really interested to hear what happened to this</p></blockquote>
      <p>It's currently on ice. I'm glad I stopped working on it when I did: Looking back on it now, I see I clearly lacked the skill to pull off a good sans. </p>
      <p>I'm working on a high-contrast serif Garamond now (see the "Paramond" thread), which teaches me a lot about Garamonds in general.  I might revisit the sans after that.</p>
      <p>I'm actually thinking of stealing the name "Eau de Garamond" for my serif face, and going with "Air de Garamond" for the the sans if I ever get round to it.</p>
      <p>As for Classiq, I'm rather unimpressed by it.  It does look like a Garamond at first sight, but I find its execution rather harsh upon closer inspection, especially in the italics. Looking at the posters on the website, I also suspect the spacing needs more work.</p>
