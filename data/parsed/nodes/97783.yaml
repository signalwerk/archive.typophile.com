      <p>I agree on "rum" but not sure about "estiró".<br>
      Also, worth saying that this kind of things usually happen to "print-world fonts" when used on the web. Web browsers do all kind of strange things to space and kern. Some sizes work better than other, may be due to rounding errors, hinting, and 'who knows what' other rendering variables that come into play.... Testing it in print may be a good idea. I know this font was highly prized/admired among the Argentinian type-scene, so I'm very happy that it's now available for everyone to use it.</p>
      <p>&gt; I wonder, how many hours did Gatti spend on spacing? Just for reference<br>
      I don't know. Ask Hector, or maybe Pablo Cosgaya.</p>
      <p>Even better, since the font is now libre and the source code is available, you (or anyone) can also help to improve it.</p>
