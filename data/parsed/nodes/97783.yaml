      <p>Thanks for your support, this is really helpful. Eau should be pure and essential, so sloppy strokes and stunted curves have no place in it. I'll keep distilling it until it lives up to its name.</p>
      <p>@ William: I don't have any full-time years to dedicate to this — my day job is pretty demanding, and I don't have any art background either. So I'll have to learn quickly or pick another hobby with a shorter reward cycle...  However, I feel I've learnt a lot in the past few months already, thanks to the extremely helpful advice and feedback on this forum, so while that trend continues, I'll stick with it and see how far it will take me.</p>
      <p>However, I have to make a few decisions before I invest more work:</p>
      <p>- What range of weights do I need in the end? I know I'm supposed to perfect one weight first, but the choice of that weight is tricky. Currently, I'm leaning towards focusing on very light weights, maybe even just up to the "Regular" I've shown above. So maybe I should pick the Light or even the Thin as my work weight. I don't suppose this will ever become a workhorse sans, but if it should go even halfways in that direction, it will need a few much heavier weights, and that will require completely rethinking all letter shapes as space gets crowded, which I'm currently not planning to do. Do you think there's a market for a font like this with light weights only? It seems to work for Miso at least...</p>
      <p>- Contrast: I agree that the letters should not have counter-intuitive stroke stresses. However, how much contrast is actually needed? Is it OK to aim for monolinear and just lighten up the junctions a bit for optical correction, or am I required to some contrast even in unbroken curves, such as the |o|?</p>
      <p>In the meantime, I'll focus my efforts on the |e| and maybe also the |a| of the Regular and try to tune them to "professional" quality. Hopefully that will teach me enough to do the same thing to the other letters.</p>
