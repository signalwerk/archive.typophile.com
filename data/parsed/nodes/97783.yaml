      <p>I think it’s pretty good, in general.<br>
      You should not consider spacing a separate matter: it is part of the design, no matter the destination you have thought for the typeface (es. display sizes).<br>
      Personally, I do not feel my typeface is truly designed until I add good overall spacing. Little kerning is generally needed if you try to work out spacing.</p>
      <p>Widths of the letters do not look bad, at the point you have reached I think it is mostly a matter of adjusting spacing to your best. The problem is that with an almost monotonal type like the one you have obtained, and with very light stroke witth, too, spacing defects tend to be magnified: you need to space it even better than if it was a Garamond! :-)</p>
