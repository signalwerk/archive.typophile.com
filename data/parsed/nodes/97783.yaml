      <p>Alright, I've gone over hamburgefonstiv of my rather light "Regular" weight and implemented Briem's recommendations for countering optical illusions. I've used the same weight ratio for horizontal vs vertical and straight vs round stems as does Gill Sans Light, since our fonts are pretty similar. That didn't change much, since I had already been close to those weight distributions after my first try. I regularized the thickness of tapered-down connections, though, and gave round strokes an ever so slight stress along the forward diagonal.</p>
      <p>I've also tried to make the resulting curves smooth and pretty. It sure helps to know what it is I'm trying to avoid! Not sure how well it worked, though.</p>
