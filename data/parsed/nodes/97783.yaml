      <p>Christian, quick and easy aren't adjectives associated with type design! I think you will regret releasing this prematurely, as it does have some things going for it, and it's not going to look professional if you push it out the door prematurely. </p>
      <p>It took me two years working on type constantly before my eyes learned to see what was wrong. That something was wrong I could sense from the beginning, but I couldn't see what and how to correct it, and had to just keep trying variations until I hit on something. Then one day I woke up and went down to the computer and looked at the screen, and it hit me: hey, I know how to do this! Then I could *see* what was wrong and how to correct it. I came with no art background, so it might have taken me longer than for someone with more of a background, or someone with more raw talent. But there is definitely a learning curve for the eye and brain, which ramps up pattern recognition as you keep working on it, until you get 'type eyes'.</p>
      <p>Once you get over that hump, things are a lot faster, and some type designers are astonishingly quick. But I think Matthew Carter said that watching him design type would be like watching ice freeze in the refrigerator.</p>
