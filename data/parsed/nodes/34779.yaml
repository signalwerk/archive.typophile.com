  html: |-
    <p>Sometimes (actually, all the time) in InDesign when I'm working in two spot colors, and I have it generate the  instructions, it lists four process inks too, even though, to the best of my knowledge, I haven't used any. How can I prevent this from happening? </p>
    <p>Thanks.</p>
comments:
  - id: 210810
    user: 14604
    date: 2007-06-27T06:47:00
    date_raw: 27 Jun 2007 — 6:47am
    votes: null
    html: |-
      <p>You can delete the colors you don't use from your swatches palette, manually, or by pressing the little arrow and choose 'select all unused' and delete.</p>
      <p>Chances are that it still lists CMYK colors if you for example generate a PDF of it, but since you do not use those colors, that should not matter. You can always instruct your printer to ignore those plates, if they do not already, since there is nothing on them.</p>
      <p>Also, the color 'Registration' (for crop marks and such) is built up from CMYK (or maybe the colors that are present in your document, I'm not sure).</p>
  - id: 210815
    user: 16884
    date: 2007-06-27T06:57:00
    date_raw: 27 Jun 2007 — 6:57am
    votes: null
    html: <p>Good call on deleting from the swatches palette--you can't delete black, (for which reason I hadn't tried the others), but they can apparently be axed. Thanks!</p>
  - id: 210958
    user: 16321
    date: 2007-06-27T16:45:00
    date_raw: 27 Jun 2007 — 4:45pm
    votes: null
    html: <p>The registration marks basically defined in RGB thus present on all plates, but the registration swatch is a little bit special as it is also is on all spot colour plates.</p>
  - id: 211057
    user: 14604
    date: 2007-06-28T05:51:00
    date_raw: 28 Jun 2007 — 5:51am
    votes: null
    html: <p>Ah yes, on all plates. Didn't know for sure, but that was what I was aiming at with my  <em>'or maybe the colors that are present in your document, I’m not sure'</em> part.</p>
