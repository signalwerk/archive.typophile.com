    html: "<p><i>Matha, we've been over the reality/ interpretation/opinion thing on Typophile before.</i>  <br> <br>and, so far, I've been thoroughly enjoying myself. Your posts on the subject are exellent. <br> <br><i>By 'reality' I mean that which is real, beginning with the physically real and the logically true.</i> <br> <br>I know what you mean, John.  <br>My problem is not with the physically real - I don't deny that I'm walking on solid ground or that the metro vibrates a lot while I'm on my way to work.  <br> <br>On the other hand, I am deliberately questioning the stability of the language we use to interact with these sorts of situations. William's story sums up my argument very nicely: <br> <br>If enough people are involved, calling something a 'leg', does actually make it a leg. If the Oxford English Dictionary says it's a leg, who am I to argue?  <br> <br>Language is, in my opinion, too vague and imprecise and far too unpredictable (think about the English word 'wan': it used to mean Black) to analyse what is real and what is not real in the scientific way William advocates. I'm with Gottlob Frege on that. <br> <br>Until language corresponds exactly to what is real, contradictory views can indeed be accepted as equally valid. But yes of course there are limits : we have to decide what we mean by valid and question how we act when we think we have valid viewpoints.  <br> <br>m.</p>"
