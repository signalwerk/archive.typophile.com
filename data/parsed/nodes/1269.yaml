    votes: null
    html: "<p>As people still want to talk about this, I will put in one more round.  <br> <br>Yes, language is sometimes ambiguous, a social product, and some concepts (such as justice) are interpreted differently by different cultures.  <br> <br>All this does not change the fact that there are a huge number of simple facts on which almost everyone agrees: that there many different languages, that we need food to live, and so on. It is this very broad agreement on observed facts that provides a basis for testing more general ideas, and for cross-cultural communication.  <br> <br>The reality of many ambiguities in language does not answer my, and Popper's point that these basic agreed-upon observations (including of observation of human suffering) provide a basis for common communication and for meaningful debate in science and politics. <br> <br>Matha, if you do not address the importance of cross-culturally agreed-upon observational facts, then you are not answering Popper's argument against relativism.   <br> <br>Guillaume, I think your concept of 'absolute truth' does not characterize Popper's view. He distinguishes between truth in the ordinary sense of the statement 'most dogs are born with four legs' being true, and the sense of Truth being about the meaning of life etc. Incidently, if you are interested, the logician Alfred Tarski defined this simple sense of 'truth' in formal logic. <br> <br>Your view that we cannot get closer to the truth, and therefore the concept of truth is useless, is one which Popper would contest. For example, we are closer to understanding the truth about the nature of the moon than people were a thousand years ago. <br> <br>Having already tried the patience of those not interested in philosophy, I am reluctant to go further in this thread. My article 'Skeptical Rationalism' (Inquiry, 22, p. 281-230) lays out my own views in depth.  <br> <br>The main question I would have for Matha and Guillaume is: What is gained by being a relativist? If you think the answer is a more tolerant point of view, I think you are making a serious mistake - though one that has nothing to do with type!  <br> <br>   </p>"
