    html: "<p>About the leg and the tail: <br> <br>Matha, yes we can start calling a dog's tail a leg, and if we establish the convention it might stick. But most people want language to be useful -- not perfect, not all revealing and encompassing -- just useful for talking about the reality around them. Calling a dog's tail a leg doesn't change the nature of the thing attached to a dog's arse. It remains pysically different from the other things we call leg. So by calling tails legs we've just made language less useful because we've removed the linguistic distinction between things that are distinct in reality. <br> <br>Now, and this is quite interesting, language reflects cultural priorities insofar as language embodies classification. The distinction between tail and leg is one of classification, and the fact that we have two separate words for them indicates that we consider the classification to be important. It is conceivable that there is another culture that would have a single word for 'long skinny things attached to the body of a dog', which would be used for both legs and tails. Such a word would indicate that this culture has never considered the physical or functional differences between legs and tails to be important: they have different priorities in classification. <br> <br>So language reflects priority in the classification of reality, but it does not affect the nature of that which is classified: the physical and functional distinctions between legs and tails persist whether a language defines the distinctions or not. Calling a tail a leg does not change the dog, only the language.</p>"
