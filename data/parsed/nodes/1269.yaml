    html: <p>Guillaume, you can't use logic without the concept of truth. When you throw out truth, then contradictions are permitted. And it is a basic principle of logic at anything follows from a contradiction. All fruitful debate goes out the window. The beautiful Socratic tradition is killed.   <br> <br>Testing doesn't tell you which theories are true, but it is a very good indication of which theories are false. It is up to us to invent better theories that are consistent with all the evidence, and then test them further. <br> <br>In politics, the acknowledgement of the suffering caused or not caused by policies are very important mundane truths. Refusing to be guided by them as a reality is "dangerous. Very dangerous."  <br> <br>I have continued to comment in this thread because I dislike seeing what I view as a poison in intellectual life going unchallenged. <br> <br>I wanted to make clear that there is a well-developed alternative to the fashionable relativism, and to inform people that there is third side to the story - you don't have to be either a relativist or dogmatist. And that relativism may not be a benign, tolerant philosophy.  <br> <br>By the way, Popper did point out, as Guillaume notes, that the socialist revolution taking place first in a poor country (Russia) refutes Marx. It is in fact an example of how social facts are important to testing theories in social science and politics, as well as physical science.  <br> <br></p>
