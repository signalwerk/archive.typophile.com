    html: "<p>&gt;The thing is that you really absoloutly want to judge. You don't want just to learn and build a living on a fruitful learning, which doesn't necessary evaluate. <br> <br>Guillaume, the idea that you yourself don't make judgments is a mistaken idea.  <br> <br>You make a judgment every time to decide to eat the food rather than the plate, every time you step over a hole in the road.  <br> <br>You also make judgments of other people and political judgments - such as the one you made above about bad things that went on in the Soviet Union. We all make judgments, I just think it is a better idea to make them after looking at evidence and grounding them as much in reality as possible. Using logic and reason is part of being a responsibile human being. So is being open-minded enough to accept new evidence and argument and change one's mind.  <br> <br>The relativist's claim not to make judgments is just pretense, not reality. It shows the hollowness of the philosophy.  <br> <br>I never said that Nazis or Communists were relativists. I said that Heidegger and Sartre used relativism to defend them. My point was that once you break loose your standards from evidence and reality, anything goes.  <br> <br>I see from your bio here that you are a student. If you are interested you can get Popper's works in French. I think 'Conjectures and Refutations' is his best. My own book on Popper, 'Learning from Error' is in English and a German translation (Lernen aus dem Irrtum), but not in French.  <br> <br>&gt;If enough people are involved, calling something a 'leg', does actually make it a leg. If the Oxford English Dictionary says it's a leg, who am I to argue?  <br> <br>With all due respect, Matha, you miss the point of Lincoln's story: changing language doesn't change reality. The fixing of meaning is conventional - the sound 'he' refers to a man in English and to a woman in Hebrew. But once the meanings are relatively fixed in a language community, then sentences refer to reality, and are true or false. The reality doesn't change even though we may get it wrong or fail to understand it.  <br> <br>For example once 'weapons of mass destruction' is given a clear meaning, the claim that they were in Iraq gets meaning, and the reality of whether they were there or not doesn't change no matter what George Bush or Hans Blix says. <br> <br>The idea that language determines reality is such a crock. Eating keeps us alive, sex makes babies - and you don't need talk when you are doing either one!  <br> <br>&gt;William, I see your point, but I guess we must have  <br>different tresholds, no offense. <br> <br>Yves, no offense given or taken. I noted the rudeness because don't think it should be accepted as a normal course of action, on these boards or anywhere else.   <br> <br>&gt;instead of taking advice <br> <br>Hrant, I recently accepted 100% of your typographic advice on my book project, and thanked you for your kindness. And meant it. </p>"
