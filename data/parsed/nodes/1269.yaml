    html: <p>&gt;the debate is useless as far as our basis paradigm can't be the same.  <br>&gt;Agreeing a solid rock is solid don't appear to me to drive to great discoveries. It's not that important. <br> <br>John, these are typical statements of relativism. But he thinks the only alternative to relativism is dogmatism, and that is why he mistakes me for a dogmatist.   <br> <br>Guillaume, the word 'paradigm' in the sense you are using it was introduced by Thomas Kuhn, partly in criticism of Popper. Popper's reply is in his essay 'The Myth of the Framework.'  <br> <br>According to Popper, your key mistake is to think that agreement on a rock being solid is unimportant. It is precisely such mundane agreed-upon statements are the basis for testing theories in science and indeed in politics. Particularly in science we move closer to the truth about reality through such a testing process. <br> <br>So far, our understanding of social process is much weaker, but even in politics basic truths are important. For example, the economic (as well as moral) failure of centrally planned Leninist states eventually has led to abandonment of this economic model. Acknowledgement of the failure is from observing such mundane facts as the wealth in the Leninist states vs the mixed economies of the West and East Asia.  <br> <br>The mundane facts matter because they help guide us to greater truths, if we are looking for them. Abandon the idea of truth and reality, and you abandon the search, and the fruitful collaborative debate.  <br> <br>    </p>
