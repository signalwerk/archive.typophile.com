    html: <p>Where i disagree with you, Joseph, is when you say that intention and language are two different things. The language isn't a pure system, to take out of context. The context is part of the language. The system is virtually pure, but everytime it's used, it become a more complex (and confusing) thing, made of phonems, letters, significations, voice, attitude etc. You can't separate the different elements that are a whole thing once it's used. WMD can be a specific range of real weapons, described by specific attributes; but it can be anything enough powerful to make a big damage.  <br>And if a "leg" seems clearly refer to one specific thing, the majority of the language depend on many factors for its sense to be clear. And it's never completely obvious. <br>forget "one word = one thing". It's irrelevant.</p>
