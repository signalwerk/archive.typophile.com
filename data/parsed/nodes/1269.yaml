    html: <p>William, i obviously make judgements everytime. And of course, when the question is important, logic and reason are my better friends (well, let say apart about love). <br>But i try to avoid them as much as i can when they're not needed. And, all the more, i try not to make judgements systematically. If something is pure occidental, it's that frenetic need to eveluate, to give labels. I am myself pushed to do that, as it's a main point of our culture, but i try as much as i can not to do so if the situation don't call for a judgement. Just a free look. <br>About it as a phylosophy, you know, a philosophy hasn't to be taken litteraly for living. Maybe i just have, as i want it, to try to do it more often. <br>For now i really haven't time to read anything else than what i already have to, but when i'll have such time, i'll try to get a look on your master. I think my reading of Leo Strauss make me a quite honest idea of your position ? <br>About language. Of course it doesn't determine reality itself. But it sure determines the way we see it, and so the way we analyse it, because we simply haven't any other way to think. <br>I disagree strongly that WMD has a clear sense. Planes driven by fanatic people are now supposed to be so. If any unexpected use of something potentially dangerous on a big scale, it would be added on the list. So it's not that clear. I'm just studying that for my work, so it's not a so easy question. And here, particuliarly, what Bush says change many things because he can say "they are there" without being sure</p>
