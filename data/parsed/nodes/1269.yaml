    html: "<p><i>forget \"one word = one thing\". It's irrelevant.</i> <br> <br>I never said one 'word = one thing', although Matha indicated that it is desirable (this is why I recommended Eco's history of the vain search for a perfect language). Of course words can have multiple meanings, and the clearer you want to be about your meaning the more words you need to use to clarify how you are using specific phrases. <br> <br>However, one word = anything is also irrelevant, and not only that it is dangerous. We can and should, for example, demand a specific definition of 'weapons of mass destruction' from our political leaders, and they can and should provide such a definition: it is possible to state what they mean, even if it isn't in their interests to do so. The vagueness isn't in the language, it is in the intention not to use language clearly. <br> <br>Between the vain idea of a perfect language, in which there is a one-to-one natural correspondence of word and thing, and the vain idea of total deconstruction of meaning in which there is no correspondence of word and thing other than a momentary and individual interpretive one, there is the linguistic world that most people operate in on a daily basis. There are conventional correspondences between words and things embodied in usage, and these can be explained and understood in terms of a matrix of such correspondences. So when I say 'This is a duck', I can go on to explain what a bird is, what distinguishes this duck bird from other birds, and can relate all these concepts to physical specimens. There is no one-to-one natural correspondence between the word duck and the thing duck, not least because there are different breeds of duck and the word duck is also a verb that has nothing to do with water fowl, but we have adequate functionality of language in talking about the thing we call a duck. If the functionality wasn't adequate, we would make it adequate by devising new ways of talking about the thing, which is something at which we are very adapt. <br> <br>As an aside, the fact that you call me Joseph does not make me Joseph <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
