    html: <p><i>You think there's an absolute truth discoverable</i> <br> <br>Who said that? As far as I've been able to tell, William and I are both arguing that there is such a thing as the real and the true. Neither of us has claimed that we can know the real or the true in its totality (although it isn't a logical impossibility, only an empirical improbability based on our limited perception and imperfect reason (and leaving aside for now the question of revelation)). <br> <br>Guillaume, I'm not sure that we mean the same thing by relativism. You seem to be saying that we live with doubt about many things, and need to discuss and debate these things and try to come up with reasonable and generally agreeable ways of behaving based on whatever much or little we can determine. I have no argument with that, and I don't think that constitutes relativism.</p>
