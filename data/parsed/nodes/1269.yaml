    html: "<p>Matha, 'when people's lives are at stake (if we're manipulating words in international politics, for example)' language isn't the problem: peoples' intentions are. William made the very good example above: we understand what the phrase 'weapons of mass destruction' means, and we understand what the phrase 'in Iraq' means, so we have a perfectly clear proposition which is either true or false. The problem is not the language, but the intention of men to whom the truth of falsity of the proposition is irrelevant. <br> <br>Language is never perfect -- point of information: only God is perfect --, but most of the time it is pretty darn clear. But it hardly matters how clear it is if the intent of the person speaking is not matched by his words. Well, that's original sin for you. <br> <br>This book might interest you: <br><a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0631205101/qid=1064070288/sr=8-1/ref=sr_8_1/102-5516056-5162560?v=glance&amp;s=books&amp;n=507846\" target=\"_blank\">http://www.amazon.com/exec/obidos/tg/detail/-/0631205101/qid=1064070288/sr=8-1/ref=sr_8_1/102-5516056-5162560?v=glance&amp;s=books&amp;n=507846</a> <br> <br>I don't think the word 'nation' is vague, and it isn't the fault of the word if it is much abused. I just don't think nation states turned out to be a very good idea. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
