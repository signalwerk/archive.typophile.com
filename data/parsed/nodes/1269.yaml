      <p>In an effort to bring this thread back on topic, let me quote a comment on <a href="http://www.bisso.com/ujg_archives/000060.html" target="_blank">Uncle Jazzbeau's Gallimaufrey blog</a> from the author of the research which is apparently being referred to in this whole scrambled letter hoohah.  <br><br>
      </p><blockquote>
      <hr size="0"><!---quote-!--><b>quote:</b>
      <p>Actually I am pretty sure it is my research people are talking about as it was my letter to the New Scientist. It was research for my PhD and the UNievrsity was Nottingham, PhD submission 1976, available on line I am told, title The Significance of Letter Position in Word Recognition. <b>*It shows clearly that word shape (the theory at the time) is not that significant as shuffling the letters changes the shape substantially.*</b> I did 36 or so experiments with all kinds of changes, keeping first and last in position, or first two and last two letters. Should be easy to write a programme which deos this now. For me it meant learning machine code and compressing everything to get it in. NOw I just help people invent things. <br> <br>Thanks for all the interest in my PhD after all these years. At the time I could not get publication as the reviewers were the ones whose theories my research results contradicted! <br> <br>Oh well. <br> <br>Graham <br>Posted by: Dr Graham Rawlinson on September 19, 2003 01:43 AM <!---/quote-!--><br>
      </p><hr size="0"><!--!-/quote-!--><p></p><!--!-quote-!--></blockquote>
