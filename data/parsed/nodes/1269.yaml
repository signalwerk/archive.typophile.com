nces refer to reality, and are true or false. The reality doesn't change even though we may get it wrong or fail to understand it.  <br> <br>For example once 'weapons of mass destruction' is given a clear meaning, the claim that they were in Iraq gets meaning, and the reality of whether they were there or not doesn't change no matter what George Bush or Hans Blix says. <br> <br>The idea that language determines reality is such a crock. Eating keeps us alive, sex makes babies - and you don't need talk when you are doing either one!  <br> <br>&gt;William, I see your point, but I guess we must have  <br>different tresholds, no offense. <br> <br>Yves, no offense given or taken. I noted the rudeness because don't think it should be accepted as a normal course of action, on these boards or anywhere else.   <br> <br>&gt;instead of taking advice <br> <br>Hrant, I recently accepted 100% of your typographic advice on my book project, and thanked you for your kindness. And meant it. </p>"
