    html: "<p>&gt;relativism is a way of thinking with doubt  <br> <br>I agree, but I think there are much better ways to acknowledge our fallibility and the uncertainty of all our beliefs.  <br> <br>Popper, with whom I studied, forged a third path between the Positivists - who wanted certainty or a surrogate for it - and relativists who wanted to do away with truth as a regulative idea. His idea was that we strive through collective effort and looking at evidence to improve our grasp of reality, though it is never sure.  <br> <br>The problem with the relativist way of saying that truth is relative and there is no reality is that it destroys rational argument.  <br> <br>In my view it is quite wrong to think that relativism supports tolerance and open-mindedness. In fact, tolerance of the relativist only goes so far as he or she interacts with you. It allows for no rational discussion between people who disagree, for their two viewpoints are equally valid, and there is no reality, or evidence of reality to shed light on which is best. Argument is killed.  <br> <br>Heidigger and his followers don't debate issues, they just pontificate.  <br> <br>Relativism is in fact profoundly illiberal. My mentioning Sartre and Heidigger's tolerance of totalitarean regimes was actually on point. They are greatly admired by contemporary relativists, and they illustrate that anything can be justified by relativism. Relativism seems to be humble, but in fact is a supremely arrogant philosophy. <br> <br>For a start, when you deny reality, you can deny the reality of the suffering of others.  <br> <br>Popper in fact saw the upholding of standards of rationality as key to the advancement of knowledge and to regimes that were open to listening to the people and bettering their lot. And he argued so in his famous book 'The Open Society and its Enemies', specifically against the Nazi and Communist tyranies he had seen arise during his lifetime. <br> <br>A year ago I attended the Centennial celebration of Popper's birth in Vienna, and was touched by people from all over the world for whom his ideas had been a beacon of humaneness and liberalism under oppressive regimes. <br> <br>&gt;it appears to me a little pretentious to say : i have the truth, it's this, or that.  <br> <br>I agree completely that to claim you are certain that you know the truth is pretentious and even ridiculous. And I never said or believed such a thing. But it is equally ridiculous to deny that there are such things as truths and reality.  <br> <br>And no, the first tests of reality - as I have said earlier and no one have given any counter argument - are not linguistic. A child learns the reality of objects (which yes are partly an hypothesis - a true hypothesis) before language. Animals also learn about reality of objects, other animals, food and sex without ever speaking.  <br> <br>Relativism is just an excuse to dismiss those you don't agree with, rather that having to look at facts, and search for the truth. It is the death of reason, and as Hogarth said, \"The death of reason gives birth to monsters.\" <br></p>"
