    html: <p>If the dictionary says that what used to be called a dog's <b>tail</b> is now called a <b>leg</b>, it is most definitely now a <b>leg</b>. It's shape or function or colour obviously doesn't change but the reason for calling it a tail (ie. this was it's given name) has disappeared. Would you continue to call it a 'tail' under those circumstances? When a company changes its name, do you continue to use the old name? <br> <br>Compare the way you look at a <b>tail</b> that is renamed a <b>leg</b> with someone who has never seen either a leg or a tail. Wait a generation and compare your reaction with someone who wasn't alive when a tail was a tail. In a leg you see an ex-tail. The youngsters just see a leg. The interaction with reality is different on the level of the language and the poor dog can't do anything about it. <br> <br>Take Nationalists and Unionists in Northern Ireland. They see the same geographical area completely differently. You might say we are talking about opinions here but when opinions are codified in constitutions they tend to encourage people to interpret reality in a particular way.  <br> <br>The definition of a nation is a good example of how reality (because in this case the reality of the situation is based on vague abstract principles expressed through even vaguer language) can be completely different depending on your age/religion/ethnic background. <br> <br>What is reality in a country where two groups accuse each other of oppression and claim victim status for themselves. Are they both right? both wrong ? do we support the underdog ? or the one that is most like us? <br> <br>Matha.</p>
