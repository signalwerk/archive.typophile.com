  html: <p>I'm proud to announce that MADType's first OpenType font is now available through Myfonts.com. <br> <br><a href="http://www.myfonts.com/fonts/madtype/casino-hand/" target="_blank">http://www.myfonts.com/fonts/madtype/casino-hand/</a> <br><a href="http://www.madtype.net/casino.html" target="_blank">http://www.madtype.net/casino.html</a> <br> <br>Casino Hand is a handwriting font that comes with some exciting new OpenType features*. The font comes with an alternate glyph for every uppercase letter, lowercase letter, numbers and some punctuation. These alternates are extremely easy to use with OpenType doing all of the hard work for you! Plus, you get the cross platform compatibility that OpenType provides. <br> <br>When the Contextual Ligatures feature of Casino Hand is utilized in your graphics application, the font substitutes a duplicate letter with the alternate glyph for that letter. This automatically makes the font look less like a font and more like real handwriting! <br> <br>Casino Hand also allows you to switch to use the alternate glyphs as the default by using the Stylistic Alternates feature. You can even use the two OpenType features together! This means that you can have duplicate glyph substitution with either the standard letters, or the alternates. <br> <br>You can also use the Glyph window in the Adobe CS applications to selectively choose characters. You can simply go into the glyph window and replace a letter that you don't like with its alternate. <br> <br>With Casino Hand, you essentially get two fonts in one, and a handwriting font that is much easier to use than previous designs. <br> <br>* Contextual Ligatures and Stylistic Alternates require Adobe CS applications. Many more software applications will be supporting these features soon!</p>
