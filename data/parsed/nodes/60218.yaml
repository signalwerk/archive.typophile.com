    <p>I need some newer typefaces in the spirit of Harrington. Here is Harrington if you are not familiar with this whimsical art Nouvou typeface: </p>
    <p><a href="http://www.identifont.com/show?1ND" title="http://www.identifont.com/show?1ND">http://www.identifont.com/show?1ND</a></p>
    <p>After looking at 30,000 types this is the face my client wants to go with. Unexpected? Yes. However, it does work with the identity. My issue is that the face is so terribly dated. Is there a face out there that is similar but contemporary?</p>
