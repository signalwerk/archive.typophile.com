  html: |-
    <p>At the risk of sounding like a very grumpy person indeed, I've gone on to Typophile this morning and found that all ten topics in the Newest section are type ID requests (I'm guessing this is probably not the first time that's happened). Is it just me or does anyone else get completely hacked off with that? (I have said this before but I'm pretty sure that comment also disappeared under the huge weight of type ID requests.)</p>
    <p>Can the Type ID's not have a (discretely small) section of their own? That way I can ignore them if I want to or not if I don't. I don't like the fact that ID's have such a high profile on what is an otherwise extraordinary and superb forum and I have a feeling other more noteworthy and interesting comment simply drowns in a sea of ID mediocrity.</p>
    <p>Don't get me wrong, I too have asked for ID's in the past, I admit. Nevertheless, one can bet that there are far more interesting threads that are banished from the front page (like this one is sure to be in about five minutes) and never see the light of day because people tend not to go looking for stuff that much.</p>
    <p>Sorry if I sound like I got up out of the wrong side of bed.</p>
    <p>(By the way, the challenge is for this to receive comment before it disappears due to homepage shunting by the blight that is ID requests. My guess is it probably won't. Handpicked...? I should be so lucky.)</p>
