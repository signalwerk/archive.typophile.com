      <p>May I suggest a comfort tip? I'm not much interested in TypeID threads either, but instead of checking Typophile's homepage for updates, I subscribed to a selective RSS feed that covers every topic except Type ID (and a few other topics as well). This implies using a feed reader to be notified of new threads, but it makes sure you won't miss any interesting thread because it's buried under Type IDs. It's a bit tricky to set up though, as you have to add the ID of the keywords that interest you the feed's URL. Here's mine as an example:<br>
      <a href="http://typophile.com/taxonomy/term/4" title="http://typophile.com/taxonomy/term/4">http://typophile.com/taxonomy/term/4</a> 5 6 7 9 19 20 21 22 25 26 27 28 53/0/feed</p>
      <p>I feel like I'm making this sound even more complicated than it actually is… Your suggestion is much more sensible :)</p>
