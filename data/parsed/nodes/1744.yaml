    html: "<p> Very classy, well crafted, and very readable. Your lc \"g\" is a surprising success. <br> <br>You're calling it a Bold (standard practice for a bitmap font with 2-pixel stems), but I think this is what works for on-screen reading. <br> <br>Consider: <br>1. Calling it a Regular, and making Light and Bold (3-pixel) weights. <br>2. Extending the ascenders by a pixel: it will improve readability, and lighten the color a bit. <br> <br>hhp </p>"
