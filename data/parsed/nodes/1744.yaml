    html: <p>The first inconsistencies I notice... <br> <br>- lower 'ca' <br>- cap/lower 'Co' <br>- cap/lower 'Ex' <br> <br>...are all a bit loose. <br> <br>If you've got a few hours, use the handy <a href="http://typophile.com/downloads/" target="_top">Typophile <br>kern pair list</a> to really fine-tune your kerning.</p>
