    html: <p> thanks very much for the responses.  the weight of punctuation is definitely off, as is the kerning - something I have yet to fully grasp technically, especially with serifs... <br> <br>Hrant, thanks, I agree with you regarding "bold" screen fonts seeming in reality more like regular width - Gregory's excellent kind family as an example. <br> <br>I'll post the light version shortly... I was working on a three-pixel width but it looked too rediculous! </p>
