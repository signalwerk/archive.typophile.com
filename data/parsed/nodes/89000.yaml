  html: |-
    <p>Which typeface is this on Studio Output "About Us" site section? "London/Nottingham"</p>
    <p>It is not Helvetica, it is not Univers, it is not Aktiv Grotesk (althought I thought it was, the "a"'s are very similar, but Aktiv's "i" has a squared dot while this is rounded.)</p>
    <p>So, anyone knows which typeface this is?</p>
    <p>Love that lowercase "a"!</p>
    <p><a href="http://www.studio-output.com/about" title="http://www.studio-output.com/about">http://www.studio-output.com/about</a></p>
