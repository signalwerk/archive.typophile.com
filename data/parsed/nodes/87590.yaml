      <p>Will do. Already kerned all the pairs tho. All of em. Even the special characters. aaa aba aca ada right up to the umlauts, all that. Kern classes are for poussies - the font looks dope... in the metrics window at least.</p>
      <p>Soo - there's no switch I can flick to get what I'm looking at in the FontLab metrics window to come out the same on the other end then? Snap. Spent a few minutes on this thing now. InDesign isn't set to optical, and everything previews great except for a few pieces of punctuation and the gap after the A, which is a major. </p>
      <p>There is no overkerning in this glyph-set froo, it's all about choosing the spots where they actually get to touch. ;)</p>
