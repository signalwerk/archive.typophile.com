    html: |-
      <p>It seems like you don't have the kern OT feature.</p>
      <p>Probably I am wrong, but first you should delete all kerning and organize it in groups.<br>
      Your W,H,D,1,6,! seem to have the common left side. 3,5,6,8 seem to have the same right side. You have overkerned the HU (and maybe AR) already, so it would be easier to fix such problems making all once again, but in more sufficient way.</p>
