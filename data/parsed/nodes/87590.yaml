  html: |-
    <p>Hi, </p>
    <p>As I was putting the finishing touches on this font I noticed it was displaying differently between Fontlab Studio 5's metrics window and InDesign. In the image below the first type samples are from InDesign, with a screengrab from Fontlab pasted beneath to show how the font appears in it's metrics window. The yellow dots indicate the frustrating bits.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/y4uBroken_6133.gif"></div><p></p>
    <p>I'm stumped, this is my first font and I have been teaching myself the application as I go, any ideas? Assistance devoid of unfamiliar terminology will could most valuable. ;D</p>
    <p>Two things which might be relevant - first, being unsure of all the kerning rules (and slightly masochistic) I kerned the font character by character. There are a lot of rules. Thousands. Also, when generating the font I noticed Binary was giving me a Stack error, so I used the Compiled option.</p>
    <p>Additional info on the font's design is available here:<br>
    <a href="http://www.behance.net/gallery/Broken-Straights-%28font%29/808686" title="http://www.behance.net/gallery/Broken-Straights-%28font%29/808686">http://www.behance.net/gallery/Broken-Straights-%28font%29/808686</a></p>
    <p>Criticism welcomed. </p>
    <p>Thanx</p>
