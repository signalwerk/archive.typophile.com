      <p>Those guys are talking about an old version of a different program (Fontographer). </p>
      <p>Have you tried reading the "Editing Metrics" section of the FontLab manual? Everything you need to know about spacing fonts is there. Just a guess, but it seems like you're trying to learn FontLab without reading the manual. You really kind of need to do that if you value your time and sanity. (Apologies if you have read it. Also, apologies to those who have read it and <em>have</em> gone insane.) </p>
      <p>Also, you seem to be trying to control the spacing almost entirely with kerning. That's not how it's supposed to work and you'll go crazy trying to do it like that.</p>
