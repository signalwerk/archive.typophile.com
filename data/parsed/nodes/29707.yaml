      <p>Fette Fraktur on anything, Zapfino on hip hop or anything low-budget that wants to look nice, Papyrus why won't you die?, anything rounded, slabs used on fake gourmet food, Trajan: It's not just for movies anymore, etc. </p>
      <p>If you really want to know what's in, go to the mall. See what's on book covers, in magazines, on posters in shop windows, and screened onto t-shirts. Keep in mind that font trends vary by region. I just flew back in from Arizona, and I think about half the type in local magazines had been set in script faces—mostly Zapfino—and people out there are still carving new metal letters in Papyrus, as opposed to here in DC where it's just the font for the bottom feeders lately.</p>
