      <p>Rounded type is coming back slowly, but for it to work it has to sneak it's way via general use as an alternative to sticking Helvetica on everything. I don't think that we'll see it make a big comeback as a large-size display face like it was in the 60s and 70s, and I think it will be confined to AG, Arial, and Helvetica rounded. Frankfurter is just too over the top to get really big, and VAG Rounded seems likely to be avoided because of its connection to Volkswagen advertising.</p>
      <p>And why is Volkswagen in the Firefox dictionary but not ebook?</p>
