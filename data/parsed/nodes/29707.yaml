  html: <p>are decorative fonts like Rosewood Regular in at the moment? or does type not have that fashion phase that comes around every 10-20 yrs? please let me know what is in at the moment and what would appeal to 16 to 25 yr olds? is Princetown LET a big hit at the moemnt with thsi age group? i think it was in the 80's that it was much more used on sweatshirts, track suits etc. is it back in? i think i have seen it on tshirts but with a more contemporary feel. any ideas? thanks, look forward to reading your replies.</p>
