    html: <p>Needless to say that some things never go out of style. I've seen a lot of "Helvetica bashing" on this site, but in all honesty I admire it for what it is. Its timeless design, legibility &amp; many styles make it the perfect font. While having been designed in 1957 (if I'm not mistaking), it still works in modern advertisements. For anyone in the designing business it might look a bit out of date, but I think that's mainly due to overuse &amp; not to its appearance. Its a multifunctional font &amp; that's something to admire regards of whether you like it or not.</p>
