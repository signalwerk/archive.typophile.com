      <p>But it's not a halftone in the typical sense, requiring line screens and all that jazz. The printer is still going to have to separate the images into their own halftone, which I suppose might introduce that wavy effect (can't recall the specific name), but that's still on the RIP end.</p>
      <p>Being able to design a vector graphic at 1/100th size is going to be much smoother than designing a bitmap at 100 feet by whatever for a giant poster, and I'm sure the RIP will appreciate it even more.</p>
