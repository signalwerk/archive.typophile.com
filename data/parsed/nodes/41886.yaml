    html: |-
      <p>Moire. Very possibly that might happen with these images. Another reason it would be scary to be designing to scale and then have it output much larger - very unpredictable.</p>
      <p>True about the vector - I wish that was the case but I need photos. My criteria is if I have a choice and the entire background is raster, or the printer requests it, I deliver PS files. They're going to be just as large in an Illy or ID file. They're also going to be just as large no matter what scale you are designing at. PS completely supports vector if you know what kind of file to deliver the type remains sharp, even at 3000 plus points.</p>
      <p>If you make an impossibly complex vector file, then the RIP will reject it, doesn't matter if it's 1" x 1". This used to happen all the time to people that had created a selection in PS and made it into a clipping path without knowing what tolerances were allowed in the dialogue.</p>
      <p>You can also have fun with this type of effect in PS by printing with different line screens. You have a lot of control over the shape and frequency in PS (just don't try sending it to a printer) and most laser printers will print anything thrown at them. So I used to<br>
      print out photos (my base was 35lpi with a 45 degree angle line), resample them with a scanner and assemble. Fun.</p>
      <p>Don't get me wrong - I like this link for special effects…</p>
      <p>pbc</p>
