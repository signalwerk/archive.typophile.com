    html: |-
      <p>I think you can use two serifs on a page if there is a big enough size difference. Like a 30+ point Didot chapter number (as a figure, maybe screened back, whatever) paired with any agreeable serif font for the text.</p>
      <p>Unless I'm designing a text for the sciences, I rarely set the subheads in a font different from the text face anymore.  Even with the chapter titles, I'll tend to stick to the same typeface, though truth to tell, I (try to) use spacing arrangements to frame the page, not type size or boldface.</p>
      <p>There is always a temptation to set the running heads in a different font, to avoid any confusion with a subhead falling at the head of a page, but there are other solutions for that too, and I usually employ them. </p>
      <p>A lot of well-designed books are set using one type family only, with any bold coming in only when an author employs it as a textual device.</p>
      <p>FWIW</p>
