      <p>For a book printed offset, also take a look at Miller. Hard to find any Walbaum or Didot-based fonts that have been redrawn to print well at text size with current technology. Maybe Kepler will, haven't used it yet. </p>
      <p>BTW, If you get Miller, harass (either Carter &amp; Cone or Font Bureau) to include the old-style numbers.</p>
      <p>Edit: Not what you asked, but most book designers start by selecting the text font, then finding a display that works with it. This on the assumption that unlike advertising, it is the text that is more important...</p>
