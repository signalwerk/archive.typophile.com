      <p>Well, the fact is that I have to use a serif because is a book on philosophy, so a Berthold Futura Serie for the body could look strange. </p>
      <p>As you say the serif has to be really different, and the strategy of the size is there. The problem when you use running heads is that there is the tempation of using a different font, and is very difficult to avoid that.</p>
      <p>In my case I have to use an HTF Didot in the covers, but inside I can use whatever I want. My idea was to use the Didot HTF for running heads and page numbers and another serif for body, but as you say, if the HTF Didot font is not much bigger than the body font, maybe will look strange, whatever the serif font used in the body.</p>
      <p>Maybe the solution could be a transition in the title page and the index with the HTF Didot and only one serif in the rest of the book: running heads, body and page numbers. All of you said fonts like Kepler, Storm's Baskerville, Caledonia, Georgia and ITC Bodoni. I'll give it a try… </p>
      <p>To pair a Didot with a body font is a difficult challenge…</p>
      <p>MarcelG.</p>
