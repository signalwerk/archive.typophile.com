      <p>It seems you don’t like the look of didone/modern faces in book text.<br>
      But if you’re concerned with matching Didot, you need something classic with a bit of ﬁnesse.<br>
      And it should have a vertical axis.<br>
      I would recommend Storm’s Baskerville.<br>
      <a href="http://www.myfonts.com/fonts/storm/baskerville-original-pro/" title="http://www.myfonts.com/fonts/storm/baskerville-original-pro/">http://www.myfonts.com/fonts/storm/baskerville-original-pro/</a></p>
      <p>Alternatively, if the Didot is to connote fashion, there’s always Times/Starling.<br>
      <a href="http://www.fontbureau.com/fonts/starling/" title="http://www.fontbureau.com/fonts/starling/">http://www.fontbureau.com/fonts/starling/</a></p>
