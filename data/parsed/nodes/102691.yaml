      <p>I too have always had difficulties setting body copy in a <a href="http://en.wikipedia.org/wiki/Didot_(typeface)" rel="nofollow">Didone</a>. Bit of an aside, from day one of my typographic education (c 1992) we were instructed to <strong>never</strong> use two serifs on a page, save for contexts when one was used for display purposes with extreme differences in size &amp;c compared to to the body copy. I believe this context qualifies as such. </p>
      <p>In those days, the traditional pair was Futura. I am personally quite fond of <a href="http://berthold.forest.net/bq_library/090200000.html" rel="nofollow">Berthold Futura Serie</a> as it has small caps and old-style figures. It’s pricey, but worth it.</p>
      <p>Perhaps you could give Futura shot just to see what it looks like?</p>
    html_clean: |-
