      <p>"only one serif in the rest of the book: running heads, body and page numbers". (and index too, may I add)</p>
      <p>That is the way. I don't see any necessity to feature the cover font inside the book; except, if you wish, in the title-page, where you could set the title in the same font used in the cover. Everything else should be set in one typeface only.</p>
      <p>As for the fonts mentioned:<br>
      - (New) Caledonia doesn't seem to be a great digital revival;<br>
      - Kepler is great but probably a hard beast to tame;<br>
      - Storm's Baskerville is nice if you want a "retro" look;<br>
      - ITC Bodoni could work well if you don't mind having a book set in Bodoni (not the best choice for extended reading, in my opinion);<br>
      - Georgia - go with Miller instead (the former was designed for screen reading).</p>
      <p>That said, any well done serifs, planned for text settings, and with the appropriate features (old style figures, small caps, superiors) will work for your book. In Europe there's a long XX century tradition of Academic and Humanistic literature (and Philosophy books) set in Garamonds / Renaissance typefaces - you could have a look at some stuff in that lineage.</p>
