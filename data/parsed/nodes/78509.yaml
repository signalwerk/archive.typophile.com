    html: |-
      <p>@Nick Shinn<br>
      Thanks! In my newbie head a font should only be worth more when it came with more OT features and more characters – which I now know it's totally not the case.</p>
      <p>I might review that in the near future and as more weights become available and the family gets more substantial. I was always bummed to release a font with only one weight. But I'm also learning as I go, and wanted to put it out there and see the reaction in terms of people noticing it or even buying it. I for one am too anxious to see how it goes, and maybe that's not the right approach :)</p>
      <p>Quick update on Avos' logo: the A and V are Brandon Grotesque's Vs and OS are Plau (O having a modified with).</p>
