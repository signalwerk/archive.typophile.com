  html: |-
    <p>Hey everyone, I'd like to introduce a fresh new face from Niramekko. Plau is the name and it's available at MyFonts: <a href="http://new.myfonts.com/fonts/niramekko/plau/" title="http://new.myfonts.com/fonts/niramekko/plau/">http://new.myfonts.com/fonts/niramekko/plau/</a></p>
    <p>The description:<br>
    Futurist typeface from the programming era, Plau is a sans-serif with rounded corner personality and interestingly deliberate lettershapes. Comfortable in headlines, reads surprisingly well in longer passages of text.</p>
    <p>Also looks quite interesting on the screen.</p>
    <p>Hope you guys like it.<br>
    Cheers<br>
    Rodrigo</p>
