    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 20.Oct.2008 11.12am </div>
      <p>Glasgow 501: Out of Print<br>
    Steve Rigley and Edwin Pickstone<br>
    ================================</p>
    <p>* An illustrated talk at St Bride Library, Tuesday 21 October 2008 at 7pm<br>
    * In the Bridewell Hall, St Bride Foundation<br>
    * Admission £7 ; concessions £5 ; Friends of St Bride £3<br>
    * Pay on the door</p>
    <p>Set within the context of recent celebrations to mark 500 years of printing in Scotland, Steve Rigley will discuss the aims and ambitions of the newly formed Out of Print research cluster. Based in the Visual Communication Department at the Glasgow School of Art the work of the five members moves from the typographic elements and traditions of letterpress through comic books, landscape photography, international graphic foraging, through to the interface between digital media and colour perception. In the second half of the talk Out of Print member Edwin Pickstone will introduce his own work, in which he seeks to find value in, and evaluate the position of, the now commercially redundant process of letterpress.</p>
    <p>Steve Rigley is the Programme Leader for Graphic Design, whilst Edwin Pickstone works as Artist / Designer in Residence, spending the majority of his time caring for and working within the School’s sizeable letterpress facility.</p>
