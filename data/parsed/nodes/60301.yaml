  html: <p>I am planning on setting a small book with Monotype Garamond. I’d like to lay it out digitally —what digital Garamond most closely replicates MT Garamond?</p>
  html_clean: <p>I am planning on setting a small book with Monotype Garamond. I’d like to lay it out digitally —what digital Garamond most closely replicates MT Garamond?</p>
