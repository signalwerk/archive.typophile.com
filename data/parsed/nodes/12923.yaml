    <p>Many of you probably already know this, but real estate agents like to have their own logos even when though they are affiliated with existing brokerages. Their line of work is inherently independent. As they establish themselves and their client bases, they like to create a logo to use alongside the brokerage logo so they can differentiate themselves from other agents.</p>
    <p>My sister-in-law is reaching the point in her professional development where her own “brand” starts to make sense. I asked her about some of the things she’d like to communicate with her logo and I tried to deliver those messages. (I’ll keep them to myself for now… if your impressions don’t jibe, I’ll now I have more work to do!)</p>
    <p>I’ve presented four logo/logotype lockups and two all-text lockups for analysis. I’ll be excited to read any and all feedback you care to share!</p>
    <p>Mike</p>
