      <p>Tim,</p>
      <p>Thanks for taking the time to reply. Regardless of what happens with the logo, I want the logotype to be of the highest quality I can muster. Your comments will really help with that.<br>
      </p><dl>
      <dt>The Crossbar on ‘t’</dt>
      <dd>I slightly modified the left terminus to parallel what the ‘S’ is doing. It’s very subtle and hard to see at the size I posted, but that was my attempt at harmonizing where those strokes approach each other. On the other side of the crossbar, I can see what you are saying… the fact that it sends below the serifs on the ‘I’ makes that area a little rough. I will take a close look at it.</dd><p></p>
      <p></p><dt>Regarding Lowercase Letter Weight</dt>
      <dd>I was worried they were actually too light. I strove for optical balance, but I may need to work on it some more if you feel they are too heavy.</dd><p></p>
      <p></p><dt>Regarding Glyph “Character”</dt>
      <dd>I built the logotype from two existing faces. Swash characters are available, but I found them to be a bit too much. The swash ‘a’ is unusable because it’s only appropriate when that letter is the last one in the word. The swash ‘e’ has a neat spur extending from the crossbar, but I felt it was too “swooshy” and out-of-place considering I wasn’t able to incorprate any other dramatic swashes.</dd><p></p>
      <p></p></dl><p></p>
      <p>Thanks so much for taking the time to comment!</p>
