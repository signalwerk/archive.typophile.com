      <p>Dan,</p>
      <p>Thanks for the feedback!</p>
      <p></p><dl>
      <dt>Regarding the Slogan</dt>
      <dd>“Real Estate for Real People” is meant to convey that she caters not just to affluent people, but to “ordinary” people. (Real estate agents <em>love</em> to market themselves as being focused on the individual.) It didn’t occur to me at all that it could be read the way you read it, but that’s why I posted to this forum!</dd><p></p>
      <p></p><dt>Regarding Color</dt>
      <dd>As is, the logo is only 2 color. The shading is acheived through tinting. I also prepared grayscale and 1-color versions of these logos, knowing that 2 color tint printing has to be of good quality to work.</dd><p></p>
      <p></p><dt>Regarding Her Market Focus</dt>
      <dd>She is mainly focused on residential markets, but we talked about that before I started designing. I felt the house mark could be used when she was marketing to homebuyers and the wordmark could stand on its own for commercial properties.</dd><p></p>
      <p></p></dl><p></p>
      <p>Thanks, Dan, for taking the time to comment on this design. I’ve read some of your comments on other logos and I really appreciate the quality of your critiques.</p>
