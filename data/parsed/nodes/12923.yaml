      <p>The wordmark is great. I don’t know if it’s the most appropriate to real estate, with all of its quirk, but it has a personal touch to it that sounds like something the client really wants.</p>
      <p>I don’t like the font choice for the tagline. The bold italic Optima feels out of place to me. Also, I don’t like Optima in most instances I’ve seen it in. (It gets abused too often and now I associate it with amateur work.) It seems incongruous to the script font. Perhaps a sturdy old-style serif? As for the tagline, I kind of like it, in spite of its cheesiness. I mean, 99% of real estate agents have horribly cheesy indentities with bad photos of themselves anyway, so it’s better than the norm.</p>
      <p>Get rid of the house. It makes the whole thing feel ‘country cottage cute’ to me. I’d go with something much simpler and more elegant, or nothing at all.</p>
      <p>The color doesn’t click for me, either. It doesn’t say real estate to me. That pale lime green might be a bit light for the tagline, as well.</p>
      <p>Keep at it!</p>
