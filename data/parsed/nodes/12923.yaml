    html: |-
      <p>Chris,<br>
      </p><dl><dt>Regarding the Wordmark</dt>
      <dd>I was trying to make something a little different than what you normally see in real estate logos, so I am glad that resonates. (Of all the many examples I looked at, every single one is <em>bad.</em> Hopefully my attempt doesn’t add to the bad pile!)</dd><p></p>
      <p></p><dt>Regarding Optima</dt>
      <dd>I specifically chose Optima (aka Zapf Humanist) because it has caligraphic strokes. I thought it contrasted nicely with Cataneo (the font family used to build the wordmark) but I might try out a few other sans serifs. I plan to avoid using a serif for the slogan because I think it will clash. It will be challenging to find a serif that harmonizes with the serifs in the wordmark.</dd><p></p>
      <p></p><dt>Regarding “Get rid of the house.”</dt>
      <dd>Nobody likes the house! :-(  Oh well, I am going to have to face reality on that one.</dd><p></p>
      <p></p><dt>Regarding Colors</dt>
      <dd>They come out a little pale in the exported gif. Some sort of green and some sort of orange are what we’re thinking, though. We’ll sit down with a swatch book once we make something that’s going to go to press. These colors are definately a departure from the rediculous abuse of color in other agent logos I’ve seen. We’re trying select colors that are energetic and sophisticated as well as warm and welcoming.</dd><p></p>
      <p></p></dl><p></p>
      <p>Thanks so much for the feedback!</p>
      <p>Mike</p>
