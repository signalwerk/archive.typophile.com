    html: <p>Approaching this the way a consumer would, I think the house, even though hand drawn, is like others have said too much and looks like clip art. That doesn’t mean you have to lose some sort of graphic, just try something more custom made depending on what kind or property and clintale your sister is trying to attract. To me the font gives off a quaint, domestic-type feeling. So depending on what you’re going for, those might not be the adjectives you were looking for. I also don’t like the up and down style in the name. I think a one or two color logo would be punchy in addition to being more affordable.</p>
