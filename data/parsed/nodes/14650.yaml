    html: |-
      <p>Sorry, but I doubt you'll get much cooperation when looking for free fonts here. The only thing I recommend is checking out some of the free fonts distributed by foundries and/or the designers that make them (versus a site whose content may be pirated or poorly rendered rip-offs). Here are a couple foundries/distrib. that are worth looking into*:</p>
      <p><a href="http://www.macrhino.com" rel="nofollow">Mac Rhino</a><br>
      <a href="http://www.fontshop.com/features/free.cfm" rel="nofollow">FontShop</a><br>
      <a href="http://www.stormtype.com/free.html" rel="nofollow">Storm Type</a></p>
      <p>*Please be aware that when using these free fonts, that they are still under protection of copyright and license agreements. Each font may have a unique set of restrictions (almost always for non-commercial use), so please read them carefully.</p>
      <p>(I also realize that my definition of cool might not be the type of <cite>cool</cite> you are referring to. :) )</p>
