      <p>Titling Gothic, like Alternate Gothic and Knockout, is similar but not the same. Some letters look identical but others, especially the "G" and the "K," are very different. </p>
      <p>Also, overall his letters look a bit more boxy, or squarish, than any of the fonts mentioned here.</p>
      <p>These are a good start, nonetheless. So thanks a lot!</p>
