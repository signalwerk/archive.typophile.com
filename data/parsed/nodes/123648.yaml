      <p>This appears to be a mix of several typefaces:</p>
      <p>Avant Garde certainly works for |RIUS|, maybe with some mixing of widths to get that narrow |S|.</p>
      <p>The |M| could be from one of the following:<br>
      <a href="http://www.myfonts.com/fonts/nootype/radikal/" title="http://www.myfonts.com/fonts/nootype/radikal/">http://www.myfonts.com/fonts/nootype/radikal/</a><br>
