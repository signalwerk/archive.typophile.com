  html: |-
    <p>The extension allows drawing letters with a centerline – skeleton. The stroke is literary drawn by a nib led according to a skeleton. Letterink advantage is the ability to vary nib width and angle on the same skeleton and keep those variations while changing general nib preset for a master. Moreover, the stroke is rendered into a glyph as if it was an outline. This allows the designer to use strokes without the direct necessity to expand strokes to outlines.</p>
    <p>Expanding to outlines generates clean vectors without messy points. Or, at least in most cases, it does so. The remaining cases are going to be fixed.</p>
    <p>Currently, its possibility is narrowed to the simple pen simulated by abscissa. But, the results are more than promising.</p>
    <p>Try it here<br>
    <a href="http://letterinkapp.com">http://letterinkapp.com</a></p>
