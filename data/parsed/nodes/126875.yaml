    html: |-
      <p>FontLab VI also has this capability, with the live Brush tool.<br>
      I have enjoyed working with it, but I will caution that adjusting the weight live on a skeleton has some significant limitations, which are present on any existing tools I have seen so far.<br>
      Notably, when increasing weight from a skeleton it is not ideal to add that weight equally on all sides. So for example, one wants to add about 2/3 or 3/5 of the increased weight on the outside of an H, less than half on the inside. Or with an O, it can differ from one design to the next as to what proportion of the added weight should be on the outside or the inside on the sides, and at the same time the top and bottom should only grow inwards.</p>
