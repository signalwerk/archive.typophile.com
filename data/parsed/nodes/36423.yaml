      <p>I think the lower case letters are pretty much all home runs. The only ones I would question are the k and x. I would like to see them in text. </p>
      <p>The diagonals are the most difficult thing to deal with here. I like your solutions on the VWY.</p>
      <p>For me the most problematic letters are the KMN. The K isn't bad, but isn't as great as the others.  The M looks awkward. I think part of the problem is that the middle stroke is thicker than the two outside ones. Maybe try making this thinner, rather than thicker, if you haven't already tried this. The N doesn't work, whereas the Z does. As Tiffany said, maybe with shorter cut in strokes?</p>
      <p>Have you considered also rounding the outside corners of the spurs on the EFT? The top inside corners on the M? </p>
      <p>The 1 needs a new solution; it looks out of place. Should the right stroke on the 4 go to the top? Should the spur on the 7 be bigger? </p>
      <p>Great Work!</p>
