    html: "<p>I had been wondering for months what it was that bugged me about this and I think I finally figured it out. These glyphs seem just a little too simplified. They have been denuded of some small details that would help you to identify glyphs more rapidly despite heir enormous girth. Let begin with a positive example : the lc t retains it's tail. That makes the letter for me. The z too has great detail &amp; feeling. But the lc a in contrast seems to me to be in need of a notch cut out of it so it can have a tail again too. Similar things might be done to the u &amp; n. It may be that this kind of thing is besides the point or takes you in a direction you don't want; in which case that's fine. But that's what occurs to me. Add in some small identifying detail to joust with the mechanical/modular heaviness.</p>"
    html_clean: "<p>I had been wondering for months what it was that bugged me about this and I think I finally figured it out. These glyphs seem just a little too simplified. They have been denuded of some small details that would help you to identify glyphs more rapidly despite heir enormous girth. Let begin with a positive example : the lc t retains it's tail. That makes the letter for me. The z too has great detail &amp; feeling. But the lc a in contrast seems to me to be in need of a notch cut out of it so it can have a tail again too. Similar things might be done to the u &amp; n. It may be that this kind of thing is besides the point or takes you in a direction you don't want; in which case that's fine. But that's what occurs to me. Add in some small identifying detail to joust with the mechanical/modular heaviness.</p>"
