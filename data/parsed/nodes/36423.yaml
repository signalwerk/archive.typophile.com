      <p>I like Randy's idea of thinning the middle stroke of the EF. There is something clunky there compared to the rest, and he may have put his finger on it. That's why I was suggesting trying the curves on the outside corners, which you said doesn't work. </p>
      <p>When I look at the whole alphabet, the N really stands out as discordant, and the M as clunky. I'm wondering if you don't find another better solution, whether the best thing is to use taller versions of the lower case MN--or at least have them as alternatives. This is the kind of unicase thing Tiffany was suggesting. This would harmonize better than anything so far. </p>
