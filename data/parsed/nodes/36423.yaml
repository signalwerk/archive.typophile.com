      <p>The dilemma I was running into was that I needed more units between glyphs to differentiate between spacing variations (curve to curve/curve to straight/angle to straight) and the only way I could get it was by opening up counter space. David Berlow's comments helped me to see that. His exercise really helped me see limitations. After much trial and error--a zillion revisions later, I settled on adding 6 units of space to the counters. This may move the sweet spot of the type size down a few points for high rez printing and allow better results for poor conditions like newsprint where spread is an issue. The only other out is an optical sizing structure. I will also double the UPM to 2000 to give me what I need for better kerning. At this point, I really need some 2400 dpi output to really see what I have to do.</p>
      <p>ChrisL</p>
