    html: |-
      <p>The dots as they are don't bother me, but I thought it was worth trying alternatives, as you already did. </p>
      <p>I think Tiffany was talking about how far the cuts slice into the stem of the N. The idea I think was to make them less deep. </p>
      <p>On your new M's, #2 seems to work with the rest of the face best. But I still worry about those diagonal cuts on the new M's and N being a little out of character with the rest of the face, and thus distracting. </p>
      <p>I would try thinning the diagonal of the N and having no cut, and thinning the middle stroke of the original M--you'd probably have to adjust the depth of the 'v' cut at the top, too. Another way would be to go with #2 and shorten the diagonal cuts in both. Wow, the M and N are tough!</p>
      <p>Randy's y idea is a definite improvement. I'm not sure about the W--did you also try the bottom of both cuts falling from the center to the outside, paralleling the notch at the bottom?</p>
