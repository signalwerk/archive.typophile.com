    html: |-
      <p>Fat Squeeze looks pretty well thought out. The y is an especially nice (and unique) touch for this genre. The left side join looks a little week though. maybe a more abrupt curve in to add weight? The W used he same solution, but less succesfully for me. What if the two counters angled the same way instead of both pulling to the center (more like 2 V's)?</p>
      <p>The dot on the i and explamation seems out of place. Seems like it should be either a rectangular, or rounded rectangular, or fully rounded.</p>
      <p>I also wonder if the cap height shouldn't be the same as the assenders for something like this which will be used 100% (hopefully) in display settings. I'd lower the ascenders rather than raising the caps.</p>
      <p>The trouble with dense and tight fonts like this (to me at least) is the varying density inherent in roman letters. Some letters present a very dense presence like the HIME, but letters like T and L break that up and look weak. It's a constant battle between desity and conistency.</p>
      <p>What do the A. Xx and Jj look like?</p>
      <p>Randy</p>
