    html: |-
      <p>One last time!<br>
      I changed the UPM to 2,000 giving me some more wiggle room. I narrowed the counters 2 old units and tightened the letterspacing some so that now,the sum of any 2 sidebearings is less than the narrowest counter. This is not a huge amount and will go unnoticed at smaller sizes but I think it gets closer to what David was trying to tell me. I can "feel" the difference--like when you tune a piano an infinitesimal amount. This setting will allow tracking with less re-kerning for the enduser because the spacing increments are closer together.<br>
      This final revision is between the last one and the earlier ones (about 1/3 of the way between. To me, it just seems to "sit" better here. My 600 dpi laser doesn't do the job at anything but bigger sizes so I will have to get some Lino output to check for sure.</p>
      <p><a href="http://dezcom.com/fatsqueeze/Squeeze_Text2000.pdf" title="http://dezcom.com/fatsqueeze/Squeeze_Text2000.pdf">http://dezcom.com/fatsqueeze/Squeeze_Text2000.pdf</a></p>
      <p>ChrisL</p>
