    html: |-
      <p>Chris:</p>
      <ul>
      <li>addiction is pushing those deadlines further and further because “hey, I can make this into a display version!”;</li>
      <li>addiction is getting back from the pub at 2 AM and firing up FontLab;</li>
      <li>addiction is having dozens of Ebay RSS feeds for obscure type items;</li>
      <li>addiction is getting back from work, eating something quick then spending the rest of the evening reading dissertations from Reading;</li>
      <li>addiction is your notebook always at hand with a couple of thousands versions of the same darn glyph!</li>
      <li>addiction is having your Typophile track page at the center of your web browsing habits, which means ALL DAY LONG;</li>
      <li>addiction is flipping constantly between your own track page and the global <a href="http://typophile.com/tracker" rel="nofollow">tracker</a>, too, to see if you’re missing out;</li>
      <li>addiction is knowing what the hell a frisket is;</li>
      <li>addiction is wondering why this curve isn’t smooth enough, then smoothing it, then realising it was smoother before smoothing. Or was it maybe in last month’s version?</li>
      <li>addiction is spending ages in the TypeID board then checking how fast your reply was vs. the original query;</li>
      </ul>
      <p>I could add more, but it would probably hijack the thread when in fact Fat Squeeze looks darn fine and when will it be out anyway?</p>
    html_clean: |-
