      <p>James, look at the u and n--even better next to each other. Much of the lower case (see i m q r h, etc.) has this theme of a curve corner and a sharp corner.<br>
      This was my building concept, mixing soft and hard with very linear counters the sharpest feature. I was trying to find a way to make it a current design that was not just another old one--thanks, Edward (Spire) and James, for noticing exactly what I was doing! </p>
      <p>The M and N were always my problem children! I will revisit them.</p>
      <p>ChrisL</p>
