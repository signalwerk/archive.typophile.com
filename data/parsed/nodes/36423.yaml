      <p>It’s great to see a face this fat with a design that doesn’t feel dated. Most faces I see in this category, regardless of how new they are, scream of some past era, usually in the vein of late 70s-early 80s arcade cabinet letting. </p>
      <p>There’s something about the dots on i and ! that distract me every time I see this face. I don’t see a similar juxtaposition of squared and rounded corners in the letters, so I just can’t keep my eyes off of the dots. In the second same, the strings of majuscules without round corners look like they’re part of a different font than the minuscules. Being really nitpicky, the horizontal part of the counter in e looks wider than all of the other counters, which appear to be the same size.</p>
