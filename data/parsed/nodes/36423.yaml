      <p>This look great for a bunch of purposes I can think of, all of them good, :-). Knitting little whites is one of the best learning experiences I've had. </p>
      <p>My largest concern in designing a face so fat as to challenge the very existence of certain features, is to be very hierarchical in determining the size of the tiny little "white" spaces. The micro-counters of "a" and "e" must be finely balanced by slight variation to "equal" those of "p" and "d", which must be finely balanced by slight variation to "equal" those of "hnmu" and so on, so that all, and their inter-letter spaces create the proper clicketty-clack amongst themselves (lowercase), and then with all the rest...</p>
      <p>Additionally! in a dangerously fat "some-sans" like this, one introduces in the "F", "J" and "L", "vast" spaces relatively, and though you've managed to minimize these in the "VWXY" there is still a relatively vast (and unkernable) white space left. Where this and the slightly varying counters leaves one is with a need to space very precisely, to ensure less space between a character under spacing consideration and any other, than there is in the counter of the character under consideration, on both sides, always!</p>
      <p>This whole area of style, naturally, is a serious challenge in a one-size fits all outline...but again this looks really good so far.</p>
      <p>Cheers!</p>
    html_clean: |-
