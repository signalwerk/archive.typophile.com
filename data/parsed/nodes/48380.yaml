      <p>As I understand it, any LCD-optimized imaging method is going to have a trade-off between color fringing and sharpness. There are schemes to try to optimize this, which I suspect are mostly highly proprietary - as David alludes to - so it will be tough to get people to tell you about them in detail. (In fact, I've just said about as much as I can comfortably say on the subject.)</p>
      <p>Note that Microsoft has sponsored research showing that there is considerable individual variation in perception/sensitivity to color fringing. So you can't necessarily assume that your own perception is typical in this area. MS's findings were that something like 10-15% (IIRC) of people were extra-sensitive. The percentage was higher among computer geeks.</p>
      <p>Cheers,</p>
      <p>T</p>
