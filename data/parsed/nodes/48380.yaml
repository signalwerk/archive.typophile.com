      <p>This particular approach to LCD-specific rendering has the virtue of being very simple. It has the defect of having much worse color-fringing artifacts than the approaches used by Microsoft and Adobe, and being less flexible in its use of the sub-pixels.</p>
      <p>Regards,</p>
      <p>T</p>
