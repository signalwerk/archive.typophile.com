      <p>" I assumed that I would get more feedback from a typography site."<br>
      The fact is your work is little better or worse than what Apple did fairly quickly and with little fanfare, or what MS did very slowly and with much chest pounding and self-back slapping ballyhoo. In low resolutions, there is no solution that 'works for every font' without either destroying the letters, or the reader. Except for careful hinting, which was never tested, and which is not allowed in OS's, there are no good solutions, except, not to play. Apple strips most of the hints, and MS... some (try finding out which), leaving the traditional access between type designer and user, denied. We've discussed this for several years, and are not exactly freshly leaping to the topic any longer, for very good reason.</p>
      <p>Cheers!</p>
