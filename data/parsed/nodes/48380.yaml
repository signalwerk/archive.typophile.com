      <p>Thanks for your input Thomas.</p>
      <p> From your comment and from the lack of responses I get that the only positive thing about this subpixel rendering approach is its simplicity. </p>
      <p> As you did not comment at all on the result obtained (img 2) I suspect that for a typographer's eye the fonts look really bad. </p>
      <p> I am certainly aware of the color fringing problem. I can also see myself that img2 has a lot of other problems, e.g. distortion on the Y axis (due to a very elementary resizing algorithm on this axis).</p>
      <p> I am currently trying to find a way to get read of the color fringing.<br>
      First,however, I wanted to find out if this is really worth the effort.</p>
      <p> The main reason I started the thread is that I would like to find out if in addition to color fringing, for a typographer's eye font rendered using this approach have some other major flaws that I cannot see.</p>
      <p> <em>In other words, let's assume that I can get rid of the color problem (without losing sharpness): do you still see other major problems with this approach? Also take into account that the overall result depends on the quality of the input 2X-sized font. As you can see some stem do not have equal widths, but I think this can be improved.</em>  </p>
      <p>In addition, I would not compare yet this crude SubLCD implementation with the optimized Cleartype or Cooltype. Both Cleartype and Cooltype are optimized to avoid color fringing. This however, it seems to me it is done at the expense of font shape and crispness. </p>
      <p>I have tried to apply a Cleartype-like algorithm for correcting color fringes, as described by Steve Gibson in his subpixel rendering page, on top of SubLCD, however, this obviously results in loss of sharpness.</p>
      <p>In any case thanks again for the comment.</p>
      <p>P.S. I assumed that I would get more feedback from a typography site. As it did not happen (I cannot exclude that this is due to low quality  of the approach compared to the professional standards...), I would be curious if you know about other possible groups where I could get more feedback on this kind of problems.</p>
