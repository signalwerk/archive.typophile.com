    html: <p>Hmm, perhaps I expressed myself poorly. What I meant with «different base structures» between blackletter and whiteletter was not supposed to relate to pen construction (which the LetterModeler indeed does a great job of illustrating) as much as to the differing underlying architecture / «skeleton» forms of the letters, as can be seen in features like the descending leg of the "h", the prevalence of the descending/long "z", minuscule forms for caps like "M" or "N" (and quite diverging forms for other caps as well), possibly even the round "r"… in brief, the sort of diverse structural characteristics typical of the various forms of blackletter script that may largely seem alien if mimicked in a Roman type. I would presume that such structural/architectural parameters reach even deeper into the DNA of a given font than how those structures are executed (pen-wise or otherwise).</p>
