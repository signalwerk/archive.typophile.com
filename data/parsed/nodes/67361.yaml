      <p>I agree that typefaces are (near) impossible to classify, but not of course because «their morphological properties are too close to each other», but because the field is too multi-dimensional. The problem with your list is that it is linear and hierarchical, which type is not. And way too simplistic.</p>
      <p>For example «pixel» is not by any means a subcategory of «display». There are a whole bunch of pixel fonts that are text fonts, made for the screen. That's on a different «axis» so to speak (maybe in terms of what letters are «made of» – strokes? areas? modules?).<br>
      And blackletter isn't = display either. Still a different axis (as blackletter and whiteletter have different base structures).</p>
      <p>It's not quite as bad as <a href="http://www.multicians.org/thvv/borges-animals.html" rel="nofollow">Borges's wonderful taxonomy of animals</a>, but pardon me if I suggest it does suffer from a bit of that syndrome.</p>
