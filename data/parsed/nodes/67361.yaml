      <p>Nina: <em>What I meant with [...] was not supposed to relate to pen construction [...] as much as to the differing underlying architecture / «skeleton» forms of the letters [...]</em></p>
      <p>Although details may differ (variants are easy to make with a pen), in my opinion the underlying construction <strong>is</strong> the pen construction. These letters find their form in the broad nib and although a ‘skeleton’ line can be derived for further processing, like adding ‘expansion’ (which happened in the 18th century), these letters were originally not written as a skeleton line. I show some examples of this theory in the PDFs which come with LeMo. </p>
      <p>The majuscules that accompany the ‘Gothic’ minuscules find their origin in the Uncials, and although these developed from capitals, they clearly form a different group. As you probably know, the round ‘r’ finds its origin in (the right part of) an OR ligature, which was separated eventually and was used only after a letter which was originally round, like an ‘o’.</p>
      <p>Just to illustrate how much details can differ per scribe, I show below two scans from my collection of photo’s of mediaeval hands (from the Museum Meermanno in The Hague). Both are Dutch and date from the 15th century.<br>
      &nbsp;<br>
      &nbsp;<br>
      <em>Christian, thank you very much for your compliments.</em><br>
      &nbsp;<br>
      &nbsp;<br>
