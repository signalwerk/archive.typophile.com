    html: |-
      <p>Dan: <em>What is appropriate for your intended audience or community?</em></p>
      <p>This depends on what one wants to achieve. If one wants to educate the intended audience, one’s approach will probably differ from the one in case the ignorance of the intended audience is (mis)used as a fig leave for concealing the lack of depth in the information provided (I am not implying that this is the case here though).</p>
      <p>James: <em>It's not very often [...] someone will come up to you like blokland has to others stating that the eras of two typefaces used in a piece are completely different and shouldn’t be used together.</em></p>
      <p>The different style periods can be identified by for instance architecture, sculptures, paintings, music, cars, clothes... and by type and typography. One only knows one’s position in time by having some knowledge of history. Lots of things which are presented as ‘new’ nowadays have been done in some way or another in the past, but it is easy and often much more convenient to simply ignore this fact. </p>
      <p>The 21th century typographer can make use (with or without being aware of this fact) of typefaces which origin date back to the Italian Renaissance (like for instance <em>Bembo</em>) or even further back in history. Until roughly the end of the 19th century the typography of every style period was dominated by its own typefaces. The revivals of historical typefaces have made access to and use of historical material to a commonly accepted practice in our time. Also in the world of music there is more access to historical (‘classical’) music than there has ever been before. Still most of my students of the Royal Academy in The Hague consider the music by for instance George Frideric Handel (1685–1759) as something really from the past, but have no problems at all with using the revivals based on work by William Caslon (1692–1766). This difference in appreciation is in my opinion not a matter of taste, but of conditioning.</p>
      <p>It is interesting that you distilled the second half of your conclusion from my statement concerning a fellow lecturer, who ‘did not have any knowledge of (the expressions of) the style periods she was combining’. My point is not that one should not combine typefaces from different style periods (this inevitable in an eclectic era anyway, I reckon), but that a professional designer should have a thorough knowledge of the ingredients he/she is using. That knowledge sets the professional apart from the amateur, who has access to the same base material, i.e., fonts and software.</p>
      <p>Compare this with cooking: by definition this is just combining ingredients, but a michelin star chef will know the details and secrets of the ingredients and will use this knowledge to come to unique recipes/dishes. Refinement and sophistication require a solid basis after all.</p>
