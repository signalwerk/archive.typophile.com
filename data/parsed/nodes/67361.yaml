    <p>Hey there!</p>
    <p>I'm working on an article for my company's blog on typography and classification systems, and wanted to hear from some typographers and hear their take on it.</p>
    <p>Without showing you the entire thing before launch (as it's a beast), I am arguing the idea that typefaces can't be classified, as their morphological properties are too close to each other. I go into the argument that as designers (that's my background - mainly web design, so shoot me) it saves us time, and I go into what different classes are good for.</p>
    <p>Essentially, I propose a completely new classification system named after my company "The Phuse". So, it would be idiotic for me not to weigh in the opinions of the type community. What am I hoping to get from here? Hoping not to be flamed, but hopefully to get some constructive criticism on how it can be improved (e.g. classes that should be removed, added, changed).</p>
    <p>Without further adieu, here are the classes that I am proposing:</p>
    <ul>
    <li>Serif
    <ul>
    <li>Slab-serif</li>
    </ul>
    </li>
    <li>Sans-serif</li>
    <li>Display
    <ul>
    <li>Blackletter</li>
    <li>Comic</li>
    <li>Dingbats</li>
    <li>Handwritten</li>
    <li>Monospaced</li>
    <li>Pixel</li>
    <li>Script</li>
    </ul>
    </li>
    </ul>
    <p>Thanks in advance! I'm hoping to launch the post early next week and align it with some other events, and offer some prizes to readers. The article will explain each class, show it's distinctions, etc.</p>
    <p>-- James</p>
    <p><strong>Edit:</strong> I'd like to propose that I refer to this classification hierarchy I've created as a taxonomy, and I will refer to the two branches (broad and narrow) as <em>genus</em> and <em>species</em>, accordingly (as a little joke and stab to the scientific community, and to seem a little more professional).</p>
