    html: "<p>Classification is a mental tool: it is a way not of ordering things but of ordering your thinking about things. So the first question you should ask whenever you set out to classify things should be ‘How do I want to think about these things?’ Failure to ask this question is what makes many classification systems, including most typeface classification systems, internally inconsistent.</p>"
