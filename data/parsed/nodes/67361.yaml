      <p>James: <em>[...] I am arguing the idea that typefaces can’t be classified, as their morphological properties are too close to each other [...]</em></p>
      <p>Extrapolating this statement, there is basically no need to design type any further, because it all looks the same. Classification on <em>contrast sort</em>, <em>contrast flow</em> and <em>contrast</em> (Noordzij) or on characteristics (Vox) or on style periods (which I tend to do in combination with a classification on proportions, plus Noordzij’s classification) is according to your statement also obsolete. </p>
      <p>If I understand your approach correctly, according to the logics of your classification there are no display versions of <em>serif</em> or <em>slab serif</em> or <em>sans serif</em> typefaces and for instance monospaced typefaces cannot contain serifs or the lack of serifs. </p>
      <p>So, let’s focus on your classification on serifs and add some info:</p>
      <p>•&nbsp;<strong>Serif</strong><br>
      &nbsp;&nbsp;—Translation (broad nib):<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;–<em>Italian Renaissance</em><br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;–<em>French Renaissance</em><br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;–<em>Baroque</em><br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;–<em>Eclecticism*</em><br>
      &nbsp;&nbsp;—Hybrid (broad nib and pointed pen):<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;–<em>Rococo (style galant)</em><br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;–<em>Eclecticism*</em><br>
      &nbsp;&nbsp;—Expansion (pointed pen):<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;–<em>Classicism</em><br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;–<em>Romantic</em><br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;–<em>Eclecticism*</em></p>
      <p>(* Eclecticism is my naming for the current style period)</p>
      <p>The classification above is a gross simplification still, because the proportions of for instance the Italian Renaissance typefaces by Nicolas Jenson and Francesco Griffo are quite different. One could argue, as you do, that ‘[...] as designers [...] it [a simplified classification –FEB] saves us time [...]’, but one can also argue the knowledge and capacities of any designer who does not know the background and (the origin of) the details of the elements he or she is applying. </p>
      <p>Recently I asked a colleague-lecturer, who is well known for her ‘modern’ designs, why she was mixing (revivals of) historical typefaces in her ‘modern’ designs and she actually did not have any knowledge of (the expressions of) the style periods she was combining. Luckily for her, her audience does not have a clue either.</p>
