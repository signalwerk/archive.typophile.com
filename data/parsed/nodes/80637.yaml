    <p>A while back I bought Alinea Sans (Présence Typo) and am quite happy with it. But one thing irritates me: the weirdly spaced numerals.</p>
    <p>I mean the spacing isn't supposed to like this, is it?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/alinea_5570.jpg"></div><p></p>
    <p>For comparison this is what the Monotype version of Alinea Sans looks like (which I didn't buy):<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/alinea_monotype_3664.jpg"></div><p></p>
    <p>Any idea how to fix the spacing? (I use LaTeX and typography is only a hobby of mine.)</p>
