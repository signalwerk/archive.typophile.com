    html: |-
      <p>@ Trevor: <em> … lining figures, which are an update on old-style figures, and are proportionally spaced. … </em></p>
      <p>Actually, lining figures may be have either proportional or tabular (monowidth) widths. So may oldstyle (lower case) figures.</p>
      <p>Tabular figures have traditionally been the default figures, and many foundries still follow this practice. One reason is that many applications do not support OpenType figure alternates, in which case tabular figures have a lesser chance of "failure", as they will not fail quite so catastrophically in a situation where proportional figures would be better, as proportional figures will fail when tabular figures are called for.</p>
      <p>I don't know what the overall default situation is for OpenType fonts with multiple figure styles, but in my recent OpenType fonts I've made the default proportional, unless the figure style is particularly suited to being tabular (e.g. in the Modern Suite, a 19th century revival).</p>
      <p>I don't know LaTeX, but would imagine there is some clever way to solve your problem by custom kerning.</p>
