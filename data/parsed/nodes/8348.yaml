    html: <p>Hello, <br> <br>That will require quite a delicate stencil, I think it might actually be a better idea (if this is possible) to create 5 different stencilings, scan them, and have them printed in black. That would mean that however many you print (a few hundred I suppose)  <br>any two people are likely to have different ones. <br> <br>As for the red, I think that should be the part you actually stencil. There is alot more emphasis on it anyway. <br> <br>I'm a little skeptical as to how paint will affect the pages of books - will it rub off? This is why i suggest having less paint (while having some printed variation). Also, having to do less stenciling will cut down your workload. <br> <br>I really like the Idea that every one has had a human handling and producing it, rather than being printed and cut entirely by machine, but I think there are some ways you could make your job easier, more efficient and equally effective. <br> <br>All the best, <br> <br>- Chris</p>
