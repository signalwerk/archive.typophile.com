    html: <p>Ah right. <br> <br>I somehow got the impression you wanted to ACTUALLY spraypaint the bookmarks themselves. <br> <br>I assume the title of the actual event (or whatever) is "Week of Peace, Hope and Justice". Is this correct? <br> <br>What might be interesting is a design that uses the ampersand (&amp;) as well. <br> <br>Here's a tip for stenciling; if you want to include the interior spaces of the P and A, then get a gluestick or some spray glue and make the parts that mask the interior spaces slightly adhesive. This allows you to avoid having very heavy parts in the composition. You can also make the rest of the stencil adhesive to avoid having it bend and warp away from your canvas. Make sure you don't get glue on your scanner though! <br> <br>Have you experimented with angling your composition? I don't know how far you want to stretch towards protest signage though... this may have a negative affect on your message. <br> <br>- Chris</p>
