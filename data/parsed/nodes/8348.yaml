    html: <p>because time is an issue here as well as distance, (across the country), my plan was to cut the stencils at a larger size, spraypaint them, then scan them back in and resize them etc.  <br>Also, only peace, hope, justice, and the dove will be stencils, the rest will be from the computer.  I would love to do all of them by hand, but unfortunately this isn't possible.</p>
