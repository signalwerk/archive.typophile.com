  html: <p>Hi there,  <br>I am doing a bookmark for a friend who heads Amnesty International at her campus. The event is to promote 'The week of Peace, Hope and Justice" I have been asked to use black and only one other color.  <br> <br>What I plan on doing is cutting a stencil for the Peace Hope Justice part and spray painting that part. The sans font is News Gothic Bold, and the serif font is Adobe Jenson Pro Regular. I'm working on no budget, so I have to use the fonts available on Illustrator. The gradient with the dove as well as the deleted counters is just a representation of how the words will look after spraypainted (shown a little cleaner here, obviously) The reason I plan on stencilling the letters is to represent protest, petition and democratic forms of communication. Any input would be appreciated. Thanks.<img src="http://www.typophile.com/forums/messages/29/56637.gif" alt=""></p>
