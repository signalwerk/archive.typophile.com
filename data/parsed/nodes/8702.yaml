    html: <p>Christ, sorry for the typos in that last post. I forgot to mention that Berlin and Kay, after <i>Basic Color Terms</i> came out it 1969, set about extending their database of 98 languages. I’m not sure what the count is up to, but I’m pretty sure that all (or <i>almost</i> all) of them conform to the seven level model. It might also be noted that Berlin and Kay aren’t without their detractors. Nor is Benjamin Whorf and his linguistic relativism, for that matter. <br><br>And one more person worth looking into along this same methodology might be Eleanor Rosch. I know she did some work with the Dani culture — who have only <i>two</i> color terms (one for dark/cool and one for light/warm). <br><br>Nate</p>
