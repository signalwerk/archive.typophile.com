    html: <p>Rodolfo, <br> <br>I don't have a lot of references on hand re. the use of colour in Ethiopic, but I have certainly seen a lot of examples. As I indicated, pretty much every Ethiopic manuscript was written in both black and red. Here is an image of the <a href="http://www.ibiblio.org/expo/vatican.exhibit/exhibit/h-orient_to_rome/images/orient06.jpg">first printed book in Ethiopic</a> and here is the <a href="http://www.ibiblio.org/expo/vatican.exhibit/exhibit/h-orient_to_rome/images/orient05.jpg">manuscript on which it was probably based</a>. Note, in the latter, the punctuation marks that include both black and red; these bi-chromatic glyphs are normative for the Ethiopic script. <br> <br>By the way, Ethiopic is not an alphabetic script. It derives from the Sabean abjad (consonant alphabet, e.g. Arabic and Hebrew) of Yemen, but developed into a syllabic writing system in which most signs represent a consonant+vowel combination.</p>
