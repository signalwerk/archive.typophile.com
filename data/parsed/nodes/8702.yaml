    html: <p><i>I believe it’s Brent Berlin and Paul Kay, in Basic Color Terms, who say that the third color term in the development of natural languages is the one for red.</i> <br><br>I’ve heard something of the kind from other sources.  And I believe (going from memory here), red is followed by blue, and then yellow, and then green in language development.  (and then colours like orange, brown, purple, and so on) <br><br>That’s responsible for part of the in-born misconception that yellow is a primary colour. <br><br>Not only “primitive” languages show this phenomenon.  Japanese people still call many green things blue (<i>aoi</i>, and in fact they had no common word for green until Crayola needed one for their green (<i>midori</i>) crayon. <br><br>And in English, we say people have red hair, even when it’s clearly a shade of orange or amber. <br><br>What this has to do with typography, I have no idea. <br><br>Paul</p>
