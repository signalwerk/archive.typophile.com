      <p>Well, I couldn't find my copy of Berlin &amp; Kay last night, but I found a study by Sarah Harkness ("Universal Aspects of Learning Color Codes: A Study in Two Cultures" from (I think) an early 70s issue of <i>Ethos</i>). <br> <br><br>
      </p><blockquote>In addition to finding universal focal points, Berlin and Kay also produced a hypothesis based on a survey of color lexicons in 98 languages, as described by the ethnographic literature. They found that th eoccurence of "basic color terms" (which they defined as monolexemic, salient terms of general usage, whose meaning is not contained within any other term) was ordered and predictable. Specifically, <i>which</i> basic color terms a language encoded could be predicted from their number, and the presence of any given color term in a language predicted the presence of certain other terms. They found a total of eleven basic color terms, ordered cross-culturally as follows: [see below]</blockquote><p></p>
      <p> <br> <br>Harkness also speculated that the "cognitive ordering of basic color terms...may be found in the shape of the color solid, combined with current knowledge of human color perception." Basically, red and yellow are more highly saturated than blue and green and, hence, hore highly salient in the mind. <br> <br>There's also a study by Kay &amp; Kempton from the early 80s (sorry, I'm awful with references) in which they determined that linguistic knowledge (e.g., color terms) informed cognitive operations. From George Lakoff's <i>Women, Fire, and Dangerous Things</i>, University of Chicago Press, 1987: <br> <br><br>
      </p><blockquote>Beyond confirming one of [Benjamin] Whorf's claimes, the Kay-Kempton experiment has an additional important consequence. It counters an all-too-common view in cognitive psychology that language plays no cognitive role other than to provide labels for concepts - labels that stand outside of "real cognition." The Kay-Kempton experiment has shown experimentally, if only for one small case, that language is part of real cognition. this is true not just for grammar, but for the lexicon as well.</blockquote><p></p>
      <p> <br> <br>Not so related is the fact that "red" ("rogue," "rot," etc.) are derived from the Sanskrit <i>rudhira</i> or "blood." Perhaps that makes red cognitively more salient in some cultures. <br> <br>You might also check out Wilhelm Ostwald's color model that the de Stijl painters were ever so fond of. Ostwald was a retired chemist who set about attempting to psychologically, as well as physically, quntify color relationships based on geometry. Oddly, though, green outnumbers the primaries in his formulation. <br> <br>Anyhow, that's what I found. <br> <br><img src="http://www.typophile.com/forums/messages/4100/6407.gif" alt=""></p>
