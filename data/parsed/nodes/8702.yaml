    html: "<p>Feel free to tell me to shut up at any time, but I thought of something else on the bus just now. Red seems to be the only basic color term in Berlin &amp; Kay's model that has a \"secondary\" term: pink (i.e., light-red). I remember Jim McCawley bringing this up during my semantics work in grad school, so maybe I'll look through my old notebooks and see if I can't find out what he had to say about red and pink. In Spanish, or in some dialects, there's a word <i>celeste</i> that means \"light blue.\" Why it doesn't count as a basic term, I'm not sure. And I also recall hearing (perhaps from Jim) that some Japanese dialects have a word for Wittgenstein's supposedly absurd \"reddish green.\" Although this has precious little to do with red. Cheers.</p>"
