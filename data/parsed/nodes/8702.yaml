    html: '<p>Mary Kay Duggan has written some interesting articles related to the use of the colour red in European manuscripts and early printing. See, for example, her essay on early printed Missals in the journal of the Printing Historical Society No.22 (1993). She has some beautiful <a href="http://sheetmusic.berkeley.edu/205list.html">images</a> online. <br><br>Of course, the use of red for instructions in the Missale Romanum has given us the word <i>rubric</i>, which in one meaning is a law or unbreakable rule. <br><br>The use of black and red in Ethiopic manuscripts is <i>extremely</i> important. Although an exact parallel cannot be made, one can think of red being used in Ethiopic texts in the same way that italics or smallcaps are used in European typography: as an articulating, semi-semantic element. Arguably, religious texts in the ancient Ge’ez language cannot be correctly written without both red and&nbsp;black.</p>'
