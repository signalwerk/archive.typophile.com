    <p>First of all, can anyone suggest some similar fonts to this book cover for American Born Chinese?<br>
    Second, the reason I'm asking is because I'm looking for a fat, graphic novel style font with a low center of gravity -- i.e., the vertical cross in the A or the H is low-down, below the middle of the letter -- so my second question is, is there a design name for that low-gravity quality in a font?  SO grateful for answers or even suggestions -- thanks!  Sossabell </p><div class="imageWrap"><img src="http://typophile.com/files/americanborn_4066.png"></div><p></p>
