    <div class="info">Submitted by <a href="/user/1085" title="View user profile.">dan_reynolds</a> : 10.Nov.2005 1.54am </div>
      <p><strong>Linotype’s LinoLetter for November 2005 – Trendy Script and Sci-Fi Fonts</strong></p>
    <p>Check out the full version of this month’s newsletter at the Linotype website: <a href="http://www.linotype.com/8-38-8-19032/issue200511.html" title="http://www.linotype.com/8-38-8-19032/issue200511.html">http://www.linotype.com/8-38-8-19032/issue200511.html</a>.</p>
    <p><em>Content Preview:</em> Our newest issue of the LinoLetter is stuffed once more with ideas and solutions for typographic and type design matters. Notably, we’d like to introduce you to the thrilling script face Ex Ponto, as well as our new Sci-Fi font package. Two new web features, one on Cyrillic Fonts and another on type systems, offer exciting views of professional typesetting to any ambitious designer. And rounding out this month’s news is a spotlight on today’s most up-to-date favorite fonts for text and headlines.</p>
    <p><a href="http://www.linotype.com/8-38-8-19032/issue200511.html">Read the rest of the Linoletter at Linotype.com!</a> </p>
    <p>Or, <a href="http://www.linotype.com/webshop/newsletter.php">subscribe to the Linoletter</a>, and get the information delivered every month directly to your mailbox.</p>
