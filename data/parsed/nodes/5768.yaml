    html: "<p>&gt; Japanese is probably the coolest writing system in the world. <br> <br>Yeah, it's so \"layered\"! Many westerners think it's too complicated, the typographic color is messy, etc., but it turns out there are advantages to it. And I happen to believe the human mind can handle <i>way</i> more complexity than that, in fact it relishes information overloading. <br> <br>But I have to maintain, there is one writing system on top, and everything else below it: Korean Hangul. Grasping its power is really a humbling experience, not least because it was <i>consciously designed</i>. <br> <br>&gt; How does one give Latin text an Armenian flavour? <br> <br>I don't know, man... If I did, I could control it better. Maybe it's what you eat, like lamb shish kebab with lard, and panjar tchga: literally \"there is no panjar\", a soup made when panjar -a funny green vegetable- is out of season... <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; Japanese is probably the coolest writing system in the world. <br> <br>Yeah, it's so \"layered\"! Many westerners think it's too complicated, the typographic color is messy, etc., but it turns out there are advantages to it. And I happen to believe the human mind can handle <i>way</i> more complexity than that, in fact it relishes information overloading. <br> <br>But I have to maintain, there is one writing system on top, and everything else below it: Korean Hangul. Grasping its power is really a humbling experience, not least because it was <i>consciously designed</i>. <br> <br>&gt; How does one give Latin text an Armenian flavour? <br> <br>I don't know, man... If I did, I could control it better. Maybe it's what you eat, like lamb shish kebab with lard, and panjar tchga: literally \"there is no panjar\", a soup made when panjar -a funny green vegetable- is out of season... <br> <br>hhp <br></p>"
