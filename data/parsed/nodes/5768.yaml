    html: "<p>Tanya wrote: <i>Nanuvut [sic] is very geometrical - hardly any curves: so I wonder if someone was to design a new font for that culture and if they introduced curves into the glyphs how it would be received. Their typographic features seem to emulate their arts and lifestyle, even landscape, could that be why the glyphs were forms that way? who knows.</i> <br> <br>The Inuktitut syllabic writing system is directly derived from the Cree/Ojibwe system, originally conceived by the Methodist missionary James Evans. The Anglican missionary Edmund Peck introduced the successful writing system to the Inuit. It is not a script that originates in or has any connection to pre-Christian Inuit culture, but the Inuit have since made it their own and are very proud of it. [It is also worth noting that most Inuit art you see is not traditional: soapstone carving was introduced to the Inuit only in the later 20th century.] <br> <br>The geometry of the Canadian syllabics derives from the very crude type making methods developed by James Evans in the far north of Manitoba. He carved matrices in the endgrain of wood, and found straight lines easier to work with. The difficulties of making type under such conditions also led to the most distinctive aspect of the script: the rotation of symbols to indicate different vowel sounds. <br> <br>When my colleague Ross Mills was designing the Pigiarniq and Uqammaq typefaces for the government and land use corporation in Nunavut, he found the Inuit to be quite open to novelties such as an increased number of rounded forms. This is a healthy sign: people are more conservative and protective of their writing system when they feel their culture to be under threat. When people are confident in their culture, they can afford to take a <i>laissez-faire</i> attitude and allow experiment. <br> <br>For more information on Inuktitut syllabics, see Ross' <a href=\"http://www.tiro.com/syllabics/\">website.</a> The section 'Typefounding on the Frontier' has photos of Ross' recreation of Evans's type making technology.</p>"
