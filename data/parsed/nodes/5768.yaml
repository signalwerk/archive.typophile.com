    html: <p>To get back to the original (very interesting) question about culture-specific type features, I've been meditating on the case of Ireland and I have a few ideas to throw out at you. <br> <br>Having abandoned the use of a distinct Gaelic alphabet, we've been using Times and Helvetica and whatever else we can get our hands since the 1960s, but I think there are still a few things that set us apart. <br> <br>As Gaelic typefaces were never accompanied by matching italics, which had no cultural significance or practical use in Ireland at all, you can perhaps distinguish a historical tendancy to use punctuation (common) and obliques (rare) instead.  <br> <br>A font that doesn't have a corresponding italic is already, for me, very slightly more Gaelic than one that does.  <br> <br>A font that doesn't have distinct uppercase letterforms and simply uses a larger version of its lowercase (and is as a result generally more rounded) is also more Gaelic. It is not however always very readable. <br> <br>A font designed with no dots on its i or j is also a contender.  <br> <br>Anything that corresponds to all that is the winner. <br> <br>Matha. <br> <br> <br> <br> <br> <br></p>
