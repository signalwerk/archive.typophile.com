    html: <p>This is a very interesting question. Typeface nationality/ethnicity is seen by some as too subjective to bother with. Gerard Unger recently gave an entertaining talk in Thessaloniki showing how "Dutch type design" isn't such a clear-cut thing. Suburban and Collis couldn't be further apart, even though their designers had the same teacher. <br> <br>But there <i>is</i> something there. And sometimes (although rarely) it's pretty clear, like when Adam Twardoch points out that Polish diacritics should tilt more. Other times is highly contentious, like when Ladislas Mandel insists that French fonts must have smaller x-heights. I'd say that usually it's a matter of getting enough people to agree, like that Czech fonts have a certain "fauve" aspect... maybe? <br> <br>What would be killer is if somebody sat down and did a serious paper on this, collecting historic and contemporary samples, asking opinions, distilling the whole, and giving us a set of sufficiently usable conclusions for each culture, while noting how tenable each given "conclusion" really is. <br> <br>hhp <br></p>
    html_clean: <p>This is a very interesting question. Typeface nationality/ethnicity is seen by some as too subjective to bother with. Gerard Unger recently gave an entertaining talk in Thessaloniki showing how "Dutch type design" isn't such a clear-cut thing. Suburban and Collis couldn't be further apart, even though their designers had the same teacher. <br> <br>But there <i>is</i> something there. And sometimes (although rarely) it's pretty clear, like when Adam Twardoch points out that Polish diacritics should tilt more. Other times is highly contentious, like when Ladislas Mandel insists that French fonts must have smaller x-heights. I'd say that usually it's a matter of getting enough people to agree, like that Czech fonts have a certain "fauve" aspect... maybe? <br> <br>What would be killer is if somebody sat down and did a serious paper on this, collecting historic and contemporary samples, asking opinions, distilling the whole, and giving us a set of sufficiently usable conclusions for each culture, while noting how tenable each given "conclusion" really is. <br> <br>hhp <br></p>
