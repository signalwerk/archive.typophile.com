    html: "<p>&gt; For example, extra leading is not a German cultural preference, <br>&gt; it simply makes text with lots of capitals look nicer. <br> <br>I think this type of distinction is problematic. On the other hand, it might be smart to limit things (see below), and getting into cultural preferences of page layout is pretty scary. So what, do you only consider \"internal\" leading, maybe?  :-/ <br> <br>&gt; That's ALOT of culture specific data lost out on. <br> <br>I think it's useful here to limit the scope to Latin (and that's me saying it). Maybe other scripts can be done subsequently - but Paul might choke if he bit off too much. <br> <br>&gt; I wouldn't think that any written system that <br>&gt; adapted Latin letterforms has much culture <br>&gt; left in them <br> <br>That's a good point - look at Turkish. <br>A related thing that <i>would</i> be interesting though: analyzing the Latin designs of people for whom it's not native (or for whom it was a writing-system switch). Like my Latin fonts <i>still</i> seem to have a certain Armenian flavor, as hard as I try to subdue that (important for text designs).</p>"
