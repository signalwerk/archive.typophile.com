    html: <p>Paul, <br> <br>You should look at a copy of D.B. Updike's <i>Printing Types,</i> which shows a country-by-country history of Western typeface design from the earliest printing in the 1400s up to the time the book was written (I have the two-volume 1937 edition). Here's the <a href="http://www.amazon.com/exec/obidos/tg/detail/-/1584560568/qid=1042073777/sr=8-1/ref=sr_8_1/103-4063219-9562230?v=glance&amp;s=books&amp;n=507846">current edition</a>. You can also find used copies, but this tends to be an expensive book (or books). <br> <br>The first edition was written in the 1920s, then revised in 1937. I believe it was revised a couple of times later, but to me the most valuable information is the early history of printing and type design. The book includes numerous reproductions of book pages and type specimen sheets. <br> <br>William Morris' Kelmscott Press books in the 1890s started a revival of interest in historical printing types. However, little was known of the history of type design, and one of the only ways to learn about it at the time was to look at antique books; little scholarship had been done. This is one of the earliest and is still the most exhaustive survey of printing history that I'm aware of. Updike can be opinionated and a little cranky at times - for instance, he obviously dislikes Baskerville's type, even though he used a very similar typeface for his own book. <br> <br>I'm not sure how much you know about the history of typography (so forgive me if I'm talking down to you), but you may be surprised at how old some of the typefaces we commonly use today are. The various versions of Garamond are based on French typefaces from the 1600s, and Baskerville and Caslon, two very popular English typefaces for modern book design, date from the 1700s (and were both used by Benjamin Franklin). Centaur and the various versions of Jenson are based on Italian designs from the 1400s. <br> <br>Early Roman typefaces fell into rough groups that could be generally classified as Italian, French and Dutch/English, and modern revivals based on them still retain many of these characteristics. The best type designers are very aware of the characteristics across both time and place, and generally don't mix incompatible features from different traditions or eras. For instance, the modern Minion typeface looks very French. <br> <br>The early European printers used blacketter typefaces (examples are Old English and the German Frakturs), which each had distinctive national characteristics. Roman type originated in Italy in the late 1400s. Originally used mostly for setting texts in Latin, it replaced blackletter for almost all printing within about 100 years. German-speaking countries were the main exception, and continued to use Fraktur (the German version of blackletter) up until the end of WWII. The Nazis decided that san-serif typefaces undermined German culture; in all seriousness, some designers who used san-serif type actually attracted the attention of the Gestapo. <br> <br>It makes sense to be aware of the history of the typeface that you use for a particular project, to avoid making unintentional typographic jokes. For instance, it would look odd to use an classic English or Italian typeface for a book about Rennaisance French history when there are a large number of excellent Rennaisance French text typefaces to choose from. The same is true of things like menus and signage; you can often use type to reinforce a national or ethnic theme. <br> <br>Take care, <br> <br>- Paul</p>
