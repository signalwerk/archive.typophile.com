  html: <p>I was wondering if some of the knowledgable Typophiles around here could help me out. <br> <br>Aside from culture-specific writing systems (Korean, Thai, etc.), what kind of type features can be demonstrated as being culture specific? <br> <br>Are there modern typefaces (as opposed to historical Gothic, Carolingina, etc.) that one can point out as being distinctly French, German, Dutch, etc? <br> <br>I was thinking about the subject after seeing some of the work Kontrapunkt has done for DSB, designing sans-serif typefaces based on uniquely Danish letterforms. <br> <br>Paul</p>
  html_clean: <p>I was wondering if some of the knowledgable Typophiles around here could help me out. <br> <br>Aside from culture-specific writing systems (Korean, Thai, etc.), what kind of type features can be demonstrated as being culture specific? <br> <br>Are there modern typefaces (as opposed to historical Gothic, Carolingina, etc.) that one can point out as being distinctly French, German, Dutch, etc? <br> <br>I was thinking about the subject after seeing some of the work Kontrapunkt has done for DSB, designing sans-serif typefaces based on uniquely Danish letterforms. <br> <br>Paul</p>
