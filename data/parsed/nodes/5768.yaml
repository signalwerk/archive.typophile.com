    html: "<p>Paul Schliesser writes: <br><i>The Nazis decided that san-serif typefaces undermined German culture; in all seriousness, some designers who used san-serif type actually attracted the attention of the Gestapo.</i> <br> <br>Many of the sans designs appearing in Germany around that time were associated rather correctly with the Nazi's ideological competitors, the communists. Look at lots of the avant-garde designs and New Typography material from that time. The modern aesthetic was adopted first in service of socialism, then national socialism, two sides of the same coin. <br> <br>..... <br> <br>There is indeed a connection between Nazism and blackletter: the NS outlawed it in 1941, calling the letters \"Judenlettern.\" The lingering misconception that blackletter implies sympathy for National Socialism is one of the many tragic myths that continue to cripple modern German culture (and modern Western culture in general.)</p>"
    html_clean: "<p>Paul Schliesser writes: <br><i>The Nazis decided that san-serif typefaces undermined German culture; in all seriousness, some designers who used san-serif type actually attracted the attention of the Gestapo.</i> <br> <br>Many of the sans designs appearing in Germany around that time were associated rather correctly with the Nazi's ideological competitors, the communists. Look at lots of the avant-garde designs and New Typography material from that time. The modern aesthetic was adopted first in service of socialism, then national socialism, two sides of the same coin. <br> <br>..... <br> <br>There is indeed a connection between Nazism and blackletter: the NS outlawed it in 1941, calling the letters \"Judenlettern.\" The lingering misconception that blackletter implies sympathy for National Socialism is one of the many tragic myths that continue to cripple modern German culture (and modern Western culture in general.)</p>"
  - id: 41017
    user: 1258
    date: 2003-01-18T14:51:00
    date_raw: 18 Jan 2003 — 2:51pm
    votes: null
    html: <p><i>The lingering misconception that blackletter implies sympathy for National Socialism is one of the many tragic myths that continue to cripple modern German culture (and modern Western culture in general.)</i> <br> <br>Interesting, though, is that the Amish and Mennonites continued to practice this element of German culture when the Germans didn't. <br> <br>My mother was born at the end of the war to German-speaking Mennonite parents in southern British Columbia.  Many of the Canadian Mennonites at that time had (and still do have, I think) their own German schools and churches, and all the books my mom grew up with were typeset in blackletter (fraktur). <br> <br>As such, as a child I was familiar with fraktur and even sang along from the German/fraktur hymnal at my grandpa's church; so frakture doesn't have the "Nazi" connotations for me that it has for most Westerners. <br> <br>Paul</p>
    html_clean: <p><i>The lingering misconception that blackletter implies sympathy for National Socialism is one of the many tragic myths that continue to cripple modern German culture (and modern Western culture in general.)</i> <br> <br>Interesting, though, is that the Amish and Mennonites continued to practice this element of German culture when the Germans didn't. <br> <br>My mother was born at the end of the war to German-speaking Mennonite parents in southern British Columbia.  Many of the Canadian Mennonites at that time had (and still do have, I think) their own German schools and churches, and all the books my mom grew up with were typeset in blackletter (fraktur). <br> <br>As such, as a child I was familiar with fraktur and even sang along from the German/fraktur hymnal at my grandpa's church; so frakture doesn't have the "Nazi" connotations for me that it has for most Westerners. <br> <br>Paul</p>
