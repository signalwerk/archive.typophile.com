    html: "<p>That's a little weird that you would want to cancel out every other written language simply because it dosen't follow Latin letterforms.  <br>  <br>That's ALOT of culture specific data lost out on. And if your only going to include the G20, globalization will take care and melt away any specific features within them before long. Forget the fact that the written language looks different...its still an interesting \"culture specific typographic feature\" i.e. Nanuvut is very geometrical - hardly any curves: so I wonder if someone was to design a new font for that culture and if they introduced curves into the glyphs how it would be received. Their typographic features seem to emulate their arts and lifestyle, even landscape, could that be why the glyphs were forms that way? who knows.   <br>  <br>I wouldn't think that any written system that adapted Latin letterforms has much culture left in them for there to be enough data to write anything about. (tanya steps down from soap box)  <br>  <br>how about Quebe</p>"
    html_clean: "<p>That's a little weird that you would want to cancel out every other written language simply because it dosen't follow Latin letterforms.  <br>  <br>That's ALOT of culture specific data lost out on. And if your only going to include the G20, globalization will take care and melt away any specific features within them before long. Forget the fact that the written language looks different...its still an interesting \"culture specific typographic feature\" i.e. Nanuvut is very geometrical - hardly any curves: so I wonder if someone was to design a new font for that culture and if they introduced curves into the glyphs how it would be received. Their typographic features seem to emulate their arts and lifestyle, even landscape, could that be why the glyphs were forms that way? who knows.   <br>  <br>I wouldn't think that any written system that adapted Latin letterforms has much culture left in them for there to be enough data to write anything about. (tanya steps down from soap box)  <br>  <br>how about Quebe</p>"
