    html: "<p>Tanya: <br> <br><i>That's a little weird that you would want to cancel out every other written language simply because it dosen't follow Latin letterforms. </i> <br> <br>No such exclusion is meant.  Examining why <i>different</i> scripts look different is just a much broader subject, whereas I was more curious about variation <i>within</i> scripts (for a specific reason which is my own).  I'm certainly no Latin-centrist - in fact, I'm currently learning Japanese <i>and</i> Thai.  Japanese is probably the coolest writing system in the world. <br> <br><i>Nanuvut is very geometrical - hardly any curves: so I wonder if someone was to design a new font for that culture and if they introduced curves into the glyphs how it would be received. Their typographic features seem to emulate their arts and lifestyle, even landscape, could that be why the glyphs were forms that way? who knows. </i> <br> <br>Great subject, and if that's the direction this thread takes, no problem.  Being Canadian, I intend to try incorporating suitable interpretations of Inuktitut (the language of Nunavut and northern Canada) into future typefaces I design.  How would one reconcile those nifty geometric shapes with a serif face?  Hmm... <br> <br><i>I wouldn't think that any written system that adapted Latin letterforms has much culture left in them for there to be enough data to write anything about. (tanya steps down from soap box) </i> <br> <br>I agree whole-heartedly!  This topic was partially an attempt to see if typographers can detect any vestiges of culture remaining in the Latin alphabet.  Don't get off your soap box. <br> <br>Paul S: <br> <br>Sounds like a terrific book.  In fact, I found a similar old tome at the library today about hand-lettering type, and about a third of it is on historical letterforms.  Probably not as exhaustive or scholarly as Updike, though. <br> <br>Hrant: <br> <br>How does one give Latin text an Armenian flavour? <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br> <br>Paul <br></p>"
