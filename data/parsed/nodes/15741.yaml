  html: |-
    <p>Has anyone got any ideas or info on a set of lower case characters to suit the font:<br>
    Dirty Headline by S. John Ross - on dafont.com /in Fancy &gt; Eroded? Or indeed another face that is as clean with both character sets?</p>
    <p>I need a set and nothing available that I can see in my searches through most supplliers and foundries. Most "grunge" fonts are pretty bad and not a patch on this one. This face looks like it was taken from an old letterpress or woodtype and has all the characteristics of one and is "clean" in its ink spread, etc. Only thing is, it has no lower case characters.</p>
    <p>Any suggestions or help would be appreciated.</p>
    <p>cheers</p>
