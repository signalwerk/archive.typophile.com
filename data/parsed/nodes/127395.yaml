    <p>I found this type specimen in E. C. Matthews Sign Painting Course 1954. His instruction was for hand painted lettering — I’m curious if anyone knows what font this is based on or if there is any existing font family that is similar?</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/font-id/Screen%20Shot%202017-12-19%20at%209.31.24%20AM.png" width="649" height="797" alt="">
