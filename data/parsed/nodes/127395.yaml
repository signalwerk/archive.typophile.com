    html: |-
      <p>Hand lettered alphabets were typically creatures unto themselves, and were not directly based on fonts used for printing.</p>
      <p>Letterhead Fonts has an all caps face called Thick and Thin Sans that is very similar to the capital letters in your sample:<br><a href="http://www.letterheadfonts.com/fonts/thickandthin">http://www.letterheadfonts.com/fonts/thickandthin</a></p>
