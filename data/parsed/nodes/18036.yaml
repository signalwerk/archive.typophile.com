    date_raw: 20 February 2006 - 10:48am
    votes: 0
    html: |-
      <p>This is a good start, but some of your curves are letting you down, espcially the top bout of the a, the tail of the g, the c and e, and the s, which looks like it's falling over to the left. The uppercase has fewer such issues, and C and G are pretty good, but the J needs help, and the S also looks like it's falling over. </p>
      <p>As has been pointed out, the dots should be consistent, and if you do go with squares, they should be @20% larger, otherwise they look too small.</p>
      <p>The æ shouldn't have a the stick up its butt. </p>
      <p>The top diagonal of the k is a little too far to the right.</p>
      <p>The two components of the m should be a little bit narrower. It needn't be a lot.</p>
      <p>The accents don't match terribly well; they are a little thin, and taper a little too much; they should match the design of the font. The cedilla looks like it's from a completely different font.</p>
      <p>You might want to look at the way many people design w; in my opinion, the outside strokes should be brought in at the top. (It's a little hard to explain, but have a look at this:</p>
      <p><img src="/sites/default/files/old-images/GalPol_w.png"></p>
      <p>See what I mean?</p>
      <p>You have done a good job making sure that the places where your strokes intercept don't get too thick, which is a hard trick to learn. On the whole, I think this is pretty solid work. Not amazingly original, but it has potential and will serve you well.</p>
