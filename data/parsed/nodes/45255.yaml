  html: <p>I recently noticed that everywhere I want to use a straight quote (because no fonts I use contain real tick marks) I was getting left quotes instead. Eventually I realized that in Preferences &gt;&gt; Type "Use Typographer’s Quotes" was checked. I keep disabling it, and it keeps coming back. Is this a per-file setting that will keep coming back in old files? Is it supposed to be on by default? Is there a way to make sure that it never, ever comes on?</p>
