    html: |-
      <p>So says everyone. Then again, this is a German book. When in Germany ...</p>
      <p>Coming from Holland, I can see why. The traditional Dutch quotes are low single and double 99, high single and double 99:</p>
      <p><cite>Jan zei: „An zei ‚Hallo’.” </cite></p>
      <p>(from the <a class="freelinking external" href="http://nl.wikipedia.org/wiki/Aanhalingsteken" rel="nofollow">Dutch wiki</a>)</p>
      <p>-- but (a) not too many people seem to know or care, (b) most fonts only have English style quotes, and -- perhaps the most important factor -- (c) most programs default to English quotes, if they provide automatic translation.</p>
      <p>Perhaps that should even be (c) most people don't know how to change the default setting. :-)</p>
