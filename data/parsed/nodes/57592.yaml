      <p>The standard asterisk &amp;c. in fonts I've seen are usually not quite at the height you’d expect from footnote characters. Compare: ¹*²†³‡⁴ <em>vs.</em> 1*2†3‡4; Georgia puts them at an in-between height, but other fonts have full-height versions.  Probably it helps that programming languages use * for multiplication in place of × (or better, U+2217 ∗).</p>
      <p>—Joel</p>
