      <p>Wow, thanks much for the replies.</p>
      <p>Jason, yes it is a text font. For shortish text (not books), but text alright. Though a display version may follow.<br>
      I'm currently trying to think of what kind of glyphs I'd want in there (and usually miss), which among others (like a number of arrows) brought up the issue of the "superscript" dagger, which I've only found in one or two fonts so far.</p>
      <p>Eben, thanks for pointing out more "full-height" uses of the dagger. (Unfortunately I can't access the first [image] link you posted*, but I'll just believe you ;-).)<br>
      So in that case I guess it would make the most sense to make a full-height dagger, and probably even make it the default? But I'd definitely like to include the other one too; the SUPS sounds like a good idea. (Is that activated when somebody presses the "Superscript" button in InDesign, or would they have to access some obscure OT feature?)<br>
      Well at the very least, I'd like to make it accessible as an alternate form in the glyph palette, via that little triangular arrow. (That's made via SALT I believe?) </p>
      <p>* Although it would be interesting to know if cricket (which I know absolutely nothing about) has a preference for cross-shaped daggers, or if dagger-shaped daggers would work as well? ;)</p>
      <p>I just ran across another point that might be justifying a full-height dagger, on the decode-unicode site: When the dagger is used as a footnote reference, these people say it will only be superscripted in the text, but then in the footnote itself (much like with numeric footnote references) it will be full-height. Which I'd expect would make the asterisk look really weird, though, because I have never in my life seen a full-height asterisk, so it can't follow the same treatment.</p>
      <p>Ben: That is interesting – I didn't know there's a separate codepoint for the cross. I'm kind of reluctant to make that one though, at least not if I don't also make U+2670 West Syriac Cross, U+2626 Orthodox Cross, U+262A Star and Crescent, U+2721 Star of David &amp;c.! There <em>are</em> limits to my glyph-lust. ;-)<br>
      I guess it's going to be an agnostic font.</p>
