    html: |-
      <p>The reason is that sometimes the dagger is not used in it's super script form. For example if you use a dagger in tables you probabaly wouldn't - for the same reason you usually don't use old style figures in a table. You also would not want to superscript at very small sizes. </p>
      <p>If you did design your unicode glyph dagger for superscript then undoing that so that the dagger can be used like a lining figure would be much harder than making it super script either manually or by using included super script functions that many programs offer. So unless you have a client that specifically uses their dagger in just one way I don't think deciding to make your dagger in a superscript size is a good idea. </p>
      <p>Thinking about the case of numbers numerals (or ciphers as I discovered they are sometimes called) as an example, ideally you do have real superscript numbers in a font. And some fonts do. Also, there are unicode positions for superior 12 &amp; 3, and for inferior points for all (1234567890), So similarly there could theoretically be a a unicode point for a super script dagger but because the dagger is rarely used it suspect it isn't enough of a burning issue for anyone for such a unicode code point to be added. </p>
      <p>That doesn't have to stop you however. On the contrary! If a user wanted a quickly accessed and specifically designed dagger that was optically correct in it's details rather than one that was scaled, then when you build the font you could add the dagger unicode point to the set of glyphs normally included (unicode numbers) when you use the ORDN (Ordinals) feature, and/or SUPS ( Superscript) feature. This would give you fast access. This is not the only way to do it but it is the way that makes the most sense to me at this point. This is how some fonts let you type unlikely fractions such as 4/8. </p>
      <p>If you wanted access in a program that doesn't have ORDN etc, but does support another feature then you could misuse a feature like CALT and type † and a code like 'su' (†su) and, hey presto! Then again to save time it would actually it would be easier to type '*t' or some combination on the keyboard.</p>
      <p>A bit of trivia coutesy of Phil Baines’ Typo Quiz at St. Brides I attended recently: </p>
      <p>On a cricket scorecard or team list, the dagger indicates the team's wicket-keeper. Notice that it is full height:<br>
      <a href="http://arunan.50webs.com/scores2.png" title="http://arunan.50webs.com/scores2.png">http://arunan.50webs.com/scores2.png</a><br>
      Also<br>
      <a href="http://en.wikipedia.org/wiki/Wicket-keeper" title="http://en.wikipedia.org/wiki/Wicket-keeper">http://en.wikipedia.org/wiki/Wicket-keeper</a></p>
