    html: <p>A puzzling conundrum indeed. Certainly in a text font you'd want to superscript the daggers. The total height would probably be more than an asterisk since there is less to them visually. But for a display font, pretty much anything goes. Like so many things, it comes down to what the font is meant to be used for.</p>
