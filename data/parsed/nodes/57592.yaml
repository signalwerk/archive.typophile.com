      <p>Sometimes you can add modular functionality as well but I wouldn't insist on it. If you can show yourself ( and others!) how it would be used &amp; why it is useful then go for it. But this idea is definitely not a standard by any means. </p>
      <p>It is also true that for tables sometime people modify fonts so that they have zero em width %, *, ⁂ etc that don't reflow the table. That may be a better model for tables than half tabular widths. And that is a custom rather than off the shelf font market. And yes those custom fonts do use half tabular width spaces and half tabular dollar and other monetary symbols. You are thinking in the right way. Notice too though what a specific use such a font must have. It is really only useful in specific places.</p>
      <p>But all of this is just a long way of saying - Chris is right about making things look right first.</p>
