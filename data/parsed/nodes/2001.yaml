    html: '<p>Those slots you refer to are part of the MacRoman character set. You can access them from the Mac keyboard using with the following keys combinations (U.S. English keyboard):  <br> <br>tilde = shift-option-n <br>macron = shift-option-comma <br>breve = shift-option-period <br>dotaccent = option-h <br>ring = option-k <br>cedilla = shift-option-z <br>hungarianumlaut = shift-option-g <br>ogonek = shift-option-x <br>caron = shift-option-t <br> <br>Other accents can be accessed using the "dead" keys that are normally used to type standard accented characters. But, instead of typing the dead key followed by a letter, you type the dead key twice. <br> <br>By using negative kerning or other tricks, you can make custom accented characters in standard graphics or page layout programs.</p>'
    html_clean: '<p>Those slots you refer to are part of the MacRoman character set. You can access them from the Mac keyboard using with the following keys combinations (U.S. English keyboard):  <br> <br>tilde = shift-option-n <br>macron = shift-option-comma <br>breve = shift-option-period <br>dotaccent = option-h <br>ring = option-k <br>cedilla = shift-option-z <br>hungarianumlaut = shift-option-g <br>ogonek = shift-option-x <br>caron = shift-option-t <br> <br>Other accents can be accessed using the "dead" keys that are normally used to type standard accented characters. But, instead of typing the dead key followed by a letter, you type the dead key twice. <br> <br>By using negative kerning or other tricks, you can make custom accented characters in standard graphics or page layout programs.</p>'
