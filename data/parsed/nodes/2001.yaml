  html: <p>Hi, <br> <br>How do the seperate accent signs in the slots 246-255 function (circumflex, tilde, macron, etc.)? <br>I use them as a ghost (Copy Reference) and past them in the appropriate character. But is there also an other way to use them? Perhaps in a certain keyboard combination? I could until now never find out how they work. <br>I never use them seperately, but I see they have a certain spacing that looks like they *could* be used normally. <br> <br>Where do you use them? <br> <br>Thanx, <br>Ren�</p>
