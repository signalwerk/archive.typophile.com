    html: <p>Tom, If you want to use something like this, I recommend <br>Frutiger's <a href="http://www.myfonts.com/fonts/bitstream/serifa/black/" target="_blank">Serifa</a>. It's much cleaner and more well-proportioned.  <br>And why round dots on Rockwell? Senseless and ugly. <br> <br>Incidently, Serifa Black looks great at 72 dpi too.  <br>See <a href="http://www.coudal.com/" target="_blank">Coudal Partners</a>.</p>
