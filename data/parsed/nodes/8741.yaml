    <p>Has anyone ever heard of B&amp;P Graphics? This font came from one of our sales reps and my boss wants to use it on the uniforms we manufacture. I have been trying to find out where it came from but I don't find B&amp;P Graphics or the name Stafford Extra bold on the MyFonts.com. <br> <br>It looks similar to Egyptienne and some others so I am a little wary. But it seems to vary in the details (see lc 'x'). But I don't have a copy of Egyptienne to readily compare it with up close. I've attached a .swf so that you can examine the specimen more precisely. <br> <br>Thanks in advance. <br>Tom<!--attachment: stafford-6332.swf*attachment_icon.gif*application/x-shockwave-flash*9.2*Stafford+Extra+Bold*stafford%2eswf --></p><center><br>
