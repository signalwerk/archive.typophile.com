    html: <p>I know about the UC 'X', Roger, that's why I wrote "Looks like it" ;) Also, it's nice how the arms are offset in relation to each other. Tom, maybe try Rockwell Extra Bold from other foundries at MyFonts? Sometimes there are crucial details that are quite different between versions.  <br>I did a quick research, and that's the closest I could get without spending too much time on this ID (I'm in the middle of two urgent newsletter redesigns). Stymie Black is also similar, but the lowercase is more off.  <br>  <br>Yaknow, Karen, I'm actually desperately trying to get <i>off</i> that friggin' roll. =D No, just kidding, I want to cram in as much fun as possible before I sign off at work (in ten minutes or so), because after that I'm pretty much out of the loop. I'm not sitting at my computer all night too! I can only spend an hour or so with my kids before they're off to bed, and most of that time is spent cooking.</p>
