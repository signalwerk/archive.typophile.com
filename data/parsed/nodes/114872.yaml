    <p>The word VENICE on the cover of a recent Penguin book is in a Tuscan style that I can perhaps describe as "wrought iron" because of the curls that look like twisted iron strips.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/UnknownAsVeniceSM_3942.jpg"></div><br>
    The letters are obviously decorated by hand with painted blue and gold trim plus  shadow outlines. But are the letters based on a font, digital or ancient, or are they a creative exercise?<br>
    The closest I could find as a font is Jeff Levine's Saddle Hitch JNL, "inspired by a few words set in a decorative typeface from an 1887 publication." <a href="http://www.myfonts.com/fonts/jnlevine/saddle-hitch/" title="http://www.myfonts.com/fonts/jnlevine/saddle-hitch/">http://www.myfonts.com/fonts/jnlevine/saddle-hitch/</a><br>
    But Saddle Hitch JNL is a long way from being a match.<br>
    Any suggestions would be very much appreciated.<br>
    Don<p></p>
