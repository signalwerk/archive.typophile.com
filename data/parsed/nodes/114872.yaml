      <p>The showing of Old Vic in the Solotype Catalog:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/OldVic_5041.jpg"></div><p></p>
      <p>Note that Dan Solo changed the decoration on the E's crossbar when he digitized it. Also, I just realized that Old Vic 2 (which he made his font from) looks to be a fill for Old Vic 1.</p>
      <p>Mr Solo was apparently a master of film font alteration and special effects - and, indeed, states in the Catalog that his printing company invented several optical manipulation machines. Surely the Old Vic series reflects those effects.</p>
      <p>Don - excuse my ignorance, but there must have been a way to create film fonts from metal type, right?</p>
