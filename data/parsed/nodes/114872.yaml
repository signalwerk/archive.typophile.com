    html: |-
      <p>Hi Mike, I'm as much in the dark as you are about the specific methods used to create film fonts from metal type. But seems logical that they would have done it from a printed specimen rather than direct from the metal type. No doubt there is proper guidance on this somewhere on the web.<br>
      Looking at the Solocat image I agree that Dan X. Solo may have played fast and loose with his metal type in making this version. And thanks for pointing out his transformation of the E crossbar. Still digging through my old images without finding a source. A present I don't even know if this was American, British or Continental European. Tuscans were everywhere in the 1850s and 1860s with many variations. I find the treatment in VENICE to be much more appealing to the modern reader as titling letters than most of the Tuscans. Which is the reason I became interested in tracking down its roots.<br>
      Don</p>
