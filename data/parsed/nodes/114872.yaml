      <p>Many thanks Mike! I do believe this might point to the source of the lettering. Dan X. Solo bought old metal typefaces and Old Vic is his digital version of one of them. The differences between Old Vic and Venice might well be the application of of a different design philosophy to the same source. Anyway the ID works for me.<br>
      Don</p>
