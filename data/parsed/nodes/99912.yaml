      <p>Hrant... the fact that corporations keep selling licenses of old fonts by defunct foundries, does not imply that the designers are getting paid. For example: <a href="http://typophile.com/node/91696" title="http://typophile.com/node/91696">http://typophile.com/node/91696</a><br>
      In many of similar cases, the "Corporations" are screwing the designers.</p>
      <p>The original designer of Triplet is surely not making any money out of the Mt or Cg sales. So "in this particular case" I couldn't care less if they lose a sale of the Triplet license. (*Note that I've said "In this particular case", so please don't assume that this as my general view about this matter.)</p>
      <blockquote><p>Pablo, are you confident that Triplett is a legitimate design?</p></blockquote>
      <p>Again, "In this particular case only", I'm pretty confident that getting Triplett from any free-font site is "more" legitimate and "more" ethic that buying it from a corporation that does not even know the name of the designer.</p>
