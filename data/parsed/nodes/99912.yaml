      <blockquote><p>At the very least a site offering such a tainted font for free should have an explanation, and ideally a way to donate to the designer.</p></blockquote>
      <p>Agree. But what about a site offering such a tainted font for $$$? It's even worst.</p>
      <blockquote><p>I assume Monotype don't sell forgeries?</p></blockquote>
      <p>Atwe, I'm not so sure about that ;)</p>
      <p>Hrant, I pretty much agree with your crusade to stop the "Id-&gt;Piracy" workflow, in particular when the fonts are from Independent Foundries and living designers. But I also detest when it's the other way around: When the big foundries take advantage of the users. Because users may lack the knowledge, but big foundries does not. For example: Repackaging the same old fonts and reselling it again as webfonts is a clear sample of that abuse, as discussed here: <a href="http://typophile.com/node/98263" title="http://typophile.com/node/98263">http://typophile.com/node/98263</a>.<br>
      Quoting Mathew Carter: "The Type business, historically, has made his money by re-selling the same typefaces over and over again as different fonts" (<a href="https://vimeo.com/35382795" title="https://vimeo.com/35382795">https://vimeo.com/35382795</a> around 10'10'')</p>
