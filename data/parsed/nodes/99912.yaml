    html: |-
      <p>With the benefit of your research, I have to agree. But I would add: if the original designer is known -or even knowable- I don't think jumping on the designer-screwing bandwagon is OK. There is rarely a life-or-death situation requiring the use of one particular font; in fact it's usually possible to find an alternative that's not "tainted" (like the ones Ryuk recommended). At the very least a site offering such a tainted font for free should have an explanation, and ideally a way to donate to the designer. So in rare cases like this, unless it's pretty impossible to reward the original designer I guess I just wouldn't mention the font.  :-/</p>
      <p>BTW I think I now understand why you didn't provide a link to a free source... It's a dilemma, because those sites contain so much stuff that actually is unethical. So I think you did the right thing there.</p>
      <p>hhp</p>
