    <p>I've hit a dead-end trying to identify these two fonts — I've consulted WhatTheFont and more than a few Google queries (I've tried searching the forum boards, but I get a missing page error every time that I do).</p>
    <p>The first is the slab serif from the headline in the "End of the Air War" article on page 102 (in case you have a copy to consult)<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/wiredheadline_3730.gif"></div><p></p>
    <p>The second is the body text from the same article (and what looks like most of the body from the rest of the magazine).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/wired2010body_4354.gif"></div><p></p>
    <p>Thanks so much!<br>
    -JD</p>
