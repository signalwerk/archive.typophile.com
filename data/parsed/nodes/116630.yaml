      <p>The latin is nice and creative. I don't know enough about hiragana, but you clearly have two different styles based on different stroke-rounding methods, and the second looks very ragged. Maybe this is of necessity. But consider making another version in which the numerals and symbols are sized and styled to match the latin.</p>
      <p>You seem to have mistakenly filled Ľľ with a copy of Ĺĺ.</p>
