    <p>I know this isn’t the right place, but perhaps somebody can point me to a place that can help.</p>
    <p>In CS3, if you are using a document dictionary and add a word, the new hyphenation points are honored—unless that word is preceded by a closed-up emdash, in which case, hyphenation reverts to the hyphenation in the proximity dictionary. This behavior holds true for hyphens, en-dashes, and emdashes, whenever the the character preceding the dash/hyphen is not a space—or perhaps not one ID takes as a word boundary.</p>
    <p>For example, if you add</p>
    <p>part~ic~ular </p>
    <p>and </p>
    <p>hyph~enat~ion</p>
    <p>to the user dictionary, the single words are hyphenated according to the new break points, but</p>
    <p>but both </p>
    <p>paricular-hyphenation, </p>
    <p>and</p>
    <p>particular—hyphenation</p>
    <p>revert to the proximity dictionary break points.</p>
    <p>For the compound words, you can add them to the dictionary treating the hyphen ac a character, and it works. e.g.</p>
    <p>par~~ic~~ular-~hyph~~enat~~ion</p>
    <p>but that is a lot of work, and em-dashes can occur with just about any  words, and in any proof stage.</p>
    <p>Any suggestions appreciated,</p>
    <p>Charles</p>
