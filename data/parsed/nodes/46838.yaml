    html: |-
      <p>Insert a miniscule space, perhaps? The hair space, for example. You can also try the non-joiner character (if I remember correctly). But chances are you can’t do that on either side of the hyphen, because it might lead to the hyphen ending up on the wrong side if it’s used in a line break. And, logically (following Adobe’s logic), “particular-” is not the same word as “particular”, so that would only halve the problem.</p>
      <p>One would expect a hyphenated compound to honour the hyphenation of its compounds; I can’t think of a reason why <em>not</em>.</p>
