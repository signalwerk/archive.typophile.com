      <p>Look what I found! Except for the A, the font <a class="freelinking external" href="http://www.myfonts.com/fonts/hallmark/butch/reqular/?refby=bowfin" rel="nofollow">Butch HMK</a>, a Hallmark font, looks just like "Riverside". Interestingly, the design date is given as 2008, but my page for Riverside was made in 2004. Draw your own conclusions.  At least the Hallmark version is spaced better.</p>
      <p>- Mike Yanega</p>
