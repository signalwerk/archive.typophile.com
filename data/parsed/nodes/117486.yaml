      <p>Fivos, I honestly don't know if the original name is Riverside. All I know is that was the name of the font I used to make the sample for the Script Guide. It was obviously an amateur effort, in my opinion, because the spacing was terrible. That was the reason I had to adjust the tracking to get my sample.</p>
      <p>- Mike Yanega</p>
