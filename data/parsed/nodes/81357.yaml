  html: |-
    <p>I <em>think</em> I hit a random keystroke, my page refreshed, and <strong>POOF</strong>! All pictures, avatars included, disappeared. I quit, restarted, no dice. I run:</p>
    <p>OS X 10.6.7 &amp; Firefox 3.6.16</p>
    <p>A strange thing I also noticed was that the bullets next to My account, My blog &amp;c changed from a triangle and empty circles to a solid square and empty squares.</p>
    <p>I cleared all the history, cookies &amp;c and the problem seemed to fix itself. The fire is out, but in four years, that’s one of the stranger things I have seen.</p>
    <p>Has anyone seen this before?</p>
