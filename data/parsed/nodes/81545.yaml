    html: <p>Yeah, they’re supposed to be spacing versions of the combining diacritics as well as a few things that don’t have combining versions. So what Chris Harvey said. They should look exactly like the combining versions but should have an intrinsic width, perhaps something like a plain space (U+0020). If you have uppercase variants of diacritics you should only use the lowercase versions for the spacing modifiers, since that’s what people expect the defaults to be. I suppose you could go to the effort of making them case sensitive, but I don’t think people would ever use that feature much.</p>
