  html: <p>I'm trying to figure out what the 'Modifier Letters' are about. I've created spacing variants of grave and acute at 0060 and 00B4, and then created zero-width combining diacritics at 0300 and 0301. These latter two have anchors and I've used them to build the accented Latin glyphs from composites. Now I find there are two more codepoints called Modifier Letters at 02CA and 02CB. Who can tell me what they're for and what I should put in there?</p>
