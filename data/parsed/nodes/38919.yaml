    <p>Hello, I’m new here, but can anyone tell me what type faces are currently used in Rolling Stone Magazine? I know Parkinson is used. I’ve read Proxima mentioned in another thread on this site, but I can’t find a solid answer for the body text. Any assistance is greatly appreciated.<br>
    Steve</p>
