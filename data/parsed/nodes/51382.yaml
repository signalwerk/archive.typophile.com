    html: |-
      <p>This looks good. My only critique would be that the two 'N's have the same grunge effect, which makes it look like you used some free grunge font off of the internet. Use a regular font and grunge it up yourself to get a unique look for each repeating letter.</p>
      <p> - Lex</p>
      <p>P.S. The kerning sucks, but I assume this was part of the grunge look.</p>
