    <p>In case if you guys haven't seen this lovely story yet:</p>
    <p><a href="http://www.jonengle.com.nyud.net/2009/04/accused" title="http://www.jonengle.com.nyud.net/2009/04/accused">http://www.jonengle.com.nyud.net/2009/04/accused</a></p>
    <p>Someone rips the work of a logo designer, posts it on stockart and then stockart sends a bill for 18K to the designer, calls him a fraud and tries to extort the money by calling up his clients and badmouthing him. </p>
    <p>Beautiful business model.</p>
    <p>PS. Jon is an active and visible member of LogoPond community. There's a lot of people who can vouch for him and his work. It is <em>extremely</em> unlikely that he was ripping other people's work.</p>
    <p>PPS. In the light of recent news I edited the subject of the topic.</p>
