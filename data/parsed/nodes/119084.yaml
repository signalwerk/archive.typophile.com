      <p>Thank you, gentlemen. Considering it could be based on Nobel, then it seems they also modified the "N", which looks close to Futura.</p>
      <p>What is your opinion on modifying a font this way, with elements that are clearly typical from another font? Personally, I do like the overall result. But for a true typophile, wouldn't this approach lack consistency?</p>
