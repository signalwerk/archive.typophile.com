    html: |-
      <p>According to Landor, it's based on a 1920s typeface (unnamed) that they then modified:</p>
      <p>http://landor.com/#!/work/case-studies/council-on-foreign-relations/</p>
      <p>Futura (designed in 1927) comes very close, save for the angle of the stroke terminals on the C.</p>
      <p>There is a companion CRF monogram that appears to be based on Bernhard Script and/or Baskerville.</p>
