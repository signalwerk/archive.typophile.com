    html: |-
      <p>I agree that the overall result is quite pleasing. As long as it holds together visually, I don't mind the Dr. Frankenstein approach--provided the stitches and bolts aren't visible.</p>
      <p>Too many times I've tried to help someone ID a logo typeface on this forum, and they've expressed disappointment that it wasn't a readily available typeface without alterations. Landor always does very subtle work (some may call it boring), but making the complex look simple and effortless is a real talent.</p>
      <p>Better than the alternative: <a href="http://cuttingedgelogos.tumblr.com/" title="http://cuttingedgelogos.tumblr.com/">http://cuttingedgelogos.tumblr.com/</a></p>
