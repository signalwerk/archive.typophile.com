    html: <p>I like the way it's heading; I think less curves would reflect the company better - heavy industrial, architectural and engineering don't really fit with the curves in my view. I like the heaviness of the weight of the 'db' marque, I would be tempted to square it up - still have some curves (on the corners) so it's not so austere, it kind of looks a bit too soft to me at the moment.</p>
