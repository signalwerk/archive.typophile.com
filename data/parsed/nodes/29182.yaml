    html: |-
      <p>Thanks guys,</p>
      <p>Glad that others agree on squaring it up - definitely prefer that direction as opposed to a rounder look.  I think it might work if square off the bottom outside edges, this should give some flow at 45degrees across the bowls.</p>
      <p>Client doesnt want it too blocky - in fact, they've accepted this logo and really like it, so probably best to just keep it as is, short of any  critical shortcomings.</p>
      <p>Thanks again,</p>
      <p>Jonny</p>
