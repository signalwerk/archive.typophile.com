    html: "<p>I think I got exactly the answers you need. The fonts you are looking for are often overlooked because they are just so common and not considered \"high design\" anyway, here is my list (I design athletic apparel): <br> <br>Slab Serif <br> <br>Athletic (cheap looking....very block like) Be sure to space this one manually) <br>Collegiate (complicated outlined font) <br> <br>The following are thinner and almost identical (I use Yearbook the most) <br>Ivy League: the only one without the \"middle V\" on the \"M\" touching the baseline (this is great for designs with outlines or strokes as the outline won't descend beneath the baseline) <br>Princetown <br>Yearbook <br>College <br>Letterman (roughened version) <br> <br>Sans Serif: <br>ITC Machine (I use this one a lot) <br>ITC Flat Iron <br> <br>Related, but not exactly athletic: <br> <br>City <br>Aachen <br> <br>For scripts, I recommend: <br> <br>Formal <br>Brush Script is the more common script <br> <br>Obscure, but worth it: <br>Hoboken High (two faces, serif and non-serif; can be found at lineto.com: expensive) <br> <br>This is about all I know in terms of these fonts. There could be more, but this is what I use. <br> <br>If you need anymore help, email me <a href=\"mailto:Kmond@hotmail.com\">Kmond@hotmail.com</a>. Put something in the subject that let's me know it's not spam</p>"
