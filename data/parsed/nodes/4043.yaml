    html: "<p>Distressed patterns are usually created by overlaying  <br>a pattern on your final design. If you're working in <br> FreeHand, for example, you import a bitmap or <br> greyscale tiff, make it transparent and voila, you're <br> distressed. <br> <br>Here's a link to a few distressed files: <br><a href=\"http://www.screenprinters.net/downloads/\" target=\"_blank\">http://www.screenprinters.net/downloads/</a> <br>(scroll down about 1/2 or 3/4 of the way down <br>the page.)</p>"
