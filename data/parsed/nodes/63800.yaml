  html: |-
    <p>Good day,<br>
    I am currently investigating split serif typefaces and I am eager to find as many as I can. Currently I have found these three.</p>
    <p>1. Buckeroo ITC<br>
    <a href="http://img249.imageshack.us/img249/6948/picture1om.png" title="http://img249.imageshack.us/img249/6948/picture1om.png">http://img249.imageshack.us/img249/6948/picture1om.png</a></p>
    <p>2. Bujardet Freres<br>
    <a href="http://img689.imageshack.us/img689/2114/picture3b.png" title="http://img689.imageshack.us/img689/2114/picture3b.png">http://img689.imageshack.us/img689/2114/picture3b.png</a></p>
    <p>3. Captain Howdy<br>
    <a href="http://img39.imageshack.us/img39/5139/picture4fb.png" title="http://img39.imageshack.us/img39/5139/picture4fb.png">http://img39.imageshack.us/img39/5139/picture4fb.png</a></p>
    <p>I have also noticed that the biker gang Hells Angels use a split serif font on their vests. </p>
    <p>In which ways have you seen this unlikely kind of serif used?</p>
    <p>Thanks for your feedback,<br>
    William</p>
