    <p>There is a job opening for a Font Administrator at the Penguin Group USA, based in New York. Below is a link to the information on their website and an overview of the requirements:</p>
    <p><a href="http://us.penguingroup.com/static/pages/aboutus/jobopportunities.html#job05" title="http://us.penguingroup.com/static/pages/aboutus/jobopportunities.html#job05">http://us.penguingroup.com/static/pages/aboutus/jobopportunities.html#job05</a></p>
    <p>We are currently seeking a Font Administrator to support the design, marketing and managing editorial communities throughout the company by managing the processes for procurement, accessing and archiving all licensed fonts.</p>
    <p>Specifically, the Font Administrator:</p>
    <p>1. Negotiates agreements and interacts with our contracts department to ensure their compliance with our requirements.<br>
    2. Uploads and activates fonts on our corporate server and grants access as per the licensing agreements.<br>
    3. Works with all design departments to assess the need for new fonts.<br>
    4. Ensures compliance with corporate policy specific to font management.</p>
    <p>Please apply if you meet the following requirements:</p>
    <p>* Graphic Design degree or equivalent work experience<br>
    * Experience with license agreements (software, stock photography, or fonts)<br>
    * Experience with and clear understanding of font software<br>
    * Thorough understanding of the book publishing process, especially in the areas of book jacket and interior design<br>
    * Excellent communication skills<br>
    * Strong organizational skills<br>
    * Proficiency with Microsoft Office and Adobe Creative Suite<br>
    * Proficiency with both MAC and PC<br>
    * Negotiation skills a plus<br>
    * Experience building new fonts a plus</p>
