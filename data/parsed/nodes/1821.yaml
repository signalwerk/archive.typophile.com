    html: "<p><i>Full justification is a primitive Enlightenment fetish that Modernism has now carved into our brains.</i> <br> <br>Well, which is it Hrant? Is it classical Roman absolutism? Is it mediaeval manuscript practice and incunabula printing? Is it enlightenment fetishism and modernist ideology? <br> <br>Most of the surviving Roman manuscripts I've seen are not justified; in fact, they are often models of the kind of soft rag you speak of so admiringly. So maybe you shouldn't blame the Romans. <br> <br>How about the scriptorium monks of the Middle Ages? Yes, they're probably the guilty party, but they didn't abuse letter or word spacing to achieve their justification: they broke words with delightful lack of concern for 'hyphenation rules', and widened and compressed letterforms often with great sensitivity. So, yes, they justified text but they did it bloody well. And before you get hot under the collar about readability, please remember that reading in the Middle Ages meant reading <i>aloud</i>, not silent, immersive reading. Gutenberg also did justification with great sensitivity, and if you think the 42-line Bible is 'a painting, not a book' I suggest you find someone who will let you sit down and leaf through a copy: that, sir, is most definitely a book. <br> <br>The so-called Enlightenment? Okay, now we're beginning to see some pretty bad justification, but we're also seeing looser letterspacing generally, and other problems. So perhaps this is indeed where your scorn should land. <br> <br>Modernism? Oh, the irony: modernists, the ideological champions of ragged-right typography, the scourge of the justified text, blamed for making justified texts the norm. <br> <br> <br><i>who cares about actual</i> reading... <br> <br>In case you havn't noticed, Hrant, people have been reading fully justified texts fully well for <i>hundreds of years</i>. You continue to treat reading as if it were some incredibly fragile, difficult to achieve thing. It's not: it's incredibly robust and ready for just about anything that bad typographers can throw at it. This is not to say that we should accept bad typography and not try to do better, but suggesting that justified text is somehow unreadable is irrational in the face of so many centuries of reading.</p>"
    html_clean: "<p><i>Full justification is a primitive Enlightenment fetish that Modernism has now carved into our brains.</i> <br> <br>Well, which is it Hrant? Is it classical Roman absolutism? Is it mediaeval manuscript practice and incunabula printing? Is it enlightenment fetishism and modernist ideology? <br> <br>Most of the surviving Roman manuscripts I've seen are not justified; in fact, they are often models of the kind of soft rag you speak of so admiringly. So maybe you shouldn't blame the Romans. <br> <br>How about the scriptorium monks of the Middle Ages? Yes, they're probably the guilty party, but they didn't abuse letter or word spacing to achieve their justification: they broke words with delightful lack of concern for 'hyphenation rules', and widened and compressed letterforms often with great sensitivity. So, yes, they justified text but they did it bloody well. And before you get hot under the collar about readability, please remember that reading in the Middle Ages meant reading <i>aloud</i>, not silent, immersive reading. Gutenberg also did justification with great sensitivity, and if you think the 42-line Bible is 'a painting, not a book' I suggest you find someone who will let you sit down and leaf through a copy: that, sir, is most definitely a book. <br> <br>The so-called Enlightenment? Okay, now we're beginning to see some pretty bad justification, but we're also seeing looser letterspacing generally, and other problems. So perhaps this is indeed where your scorn should land. <br> <br>Modernism? Oh, the irony: modernists, the ideological champions of ragged-right typography, the scourge of the justified text, blamed for making justified texts the norm. <br> <br> <br><i>who cares about actual</i> reading... <br> <br>In case you havn't noticed, Hrant, people have been reading fully justified texts fully well for <i>hundreds of years</i>. You continue to treat reading as if it were some incredibly fragile, difficult to achieve thing. It's not: it's incredibly robust and ready for just about anything that bad typographers can throw at it. This is not to say that we should accept bad typography and not try to do better, but suggesting that justified text is somehow unreadable is irrational in the face of so many centuries of reading.</p>"
