    html: <p>If by a short line you mean Indented (sangrada) it depends on the spacing before the paragraph so it can be easily distinguished from the previous one. The custom here is to separate ragged paragraphs and to indent justified ones. <br> <br>If by a short line you mean to break it soon, it sounds like a good strategy for marking the paragraph beginning.</p>
