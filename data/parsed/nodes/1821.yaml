    html: "<p>&gt; There are many examples of soft rag in the ... print traditions of Western Europe <br> <br>Let's see some. <br>Gutenberg's B42 was fully justified - a painting, not a book. <br> <br>Anyway, exceptions can be great, but I'm talking about the big picture: <br>Full justification is a primitive Enlightenment fetish that Modernism has now carved into our brains. Making nice, rigid rectangular blocks for their own sake (who cares about actual <i>reading</i>...) is the norm in the West now. And even though we have the technology to make wonderful soft rags (<i>without</i> breaking words, but instead by using a pragmatic combination of word spacing, letterspacing, horizontal letterform scaling, ligatures and intelligent linebreaking) but instead we choose one or the other of the two extremes. Design fascism. <br> <br>&gt; it was abandoned in favour of efficiency. <br> <br>Yes, the same efficiency which desecrated the Arabic <br>script when it came time to print Arabic newspapers... <br> <br>-- <br> <br>&gt; Bringhurst says that combining word spacing with ragged paragraphs puts the worst of both systems in a single text. <br> <br>Which is why Bringhurst is a poet. <br> <br>hhp <br></p>"
