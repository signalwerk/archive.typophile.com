    html: <p>I'm not poking fun of anyone. I'm saying that there are different kinds of rags -- basically, tidy rags and messy rags -- and that there are several possible approaches to making a tidy rag. A messy rag is one in which you have some lines that are much shorter or longer than average. A tidy rag is one in which all the lines fall within a fairly narrow range. <br> <br>As regards 'rubber type', you're saying that Gutenberg and Zapf belong in rubber rooms? You may be right, but I'm interested enough in their results to give them the benefit of the doubt.</p>
