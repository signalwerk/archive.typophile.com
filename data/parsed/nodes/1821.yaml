    html: "<p>Yes, Eric Menninga explained some of this to me in Vancouver. To expand a little on what Thomas described, for those who didn't immediately catch the implications (as I didn't at first): <br> <br>Any given glyph will vary by a different amount when widened according to an intelligent, MM-based scheme (as opposed to wholesale percentage scaling) -- for instance, the change in an 'm' is going to be proportionately greater than that of an 'i' (which wouldn't really widen much, if at all).  <br> <br>You can't simply determine that a given line is 96% of the full line length and then just expand it 104.1667% (as you would with brute, horizontal scaling). (Which, by the way, I think was a foolish, misleading, and mistaken feature to include in InDesign.) <br> <br>A change in width axis will have a greater effect on a seven-letter word like \"mammals\" than, say, \"fillies.\" When attempting to justify a line with intelligent width expansion, the amount of adjustment will be highly dependent upon the specific individual characters in each line.  <br> <br>Calculating the overall width setting on an MM axis for any given line, determined by all the interrelated variations of each of the characters in the line, would, as Thomas says, take too much of a toll on performance.  <br> <br>I hope this explanation makes sense and is helpful. <br> <br>-- K.</p>"
