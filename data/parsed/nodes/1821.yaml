  html: <p>First of all sorry for my english.  <br>I'm not very familar with the english typo-terms. <br> <br>We have a discussion of "ragged type" (Flattersatz) in our firm.  <br>A collegue of mine insist, that a good "ragged type" starts with a short line. <br> <br>I can't find a rule in my german typo-books. What to you think of it? <br> <br></p>
