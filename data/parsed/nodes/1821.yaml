    html: <p>Bill, <br> <br>Adobe certainly considered using MM technology in this fashion. There are a couple of key problems with it, however. First, the width axis setting of an MM font is not predictably deterministic in its effect on the width of a line. The programming difficulty and performance penalty of having to deal with each glyph's continuously variable degrees of expansion/contraction would have both been huge. Performance in interaction with the paragraph composer would have been a real problem. <br> <br>Technical difficulties aside, how many MM serifed text typefaces were made with a width axis? Kepler was one. Minion had a mild width axis, but only in one direction (more condensed than regular). There were probably others, but I can't think of them offhand. <br> <br>All of this is sort of moot, of course, since Adobe made the decision to stop doing MMs around the same time that InDesign 1.0 was finishing development. <br> <br>Regards, <br> <br>T</p>
    html_clean: <p>Bill, <br> <br>Adobe certainly considered using MM technology in this fashion. There are a couple of key problems with it, however. First, the width axis setting of an MM font is not predictably deterministic in its effect on the width of a line. The programming difficulty and performance penalty of having to deal with each glyph's continuously variable degrees of expansion/contraction would have both been huge. Performance in interaction with the paragraph composer would have been a real problem. <br> <br>Technical difficulties aside, how many MM serifed text typefaces were made with a width axis? Kepler was one. Minion had a mild width axis, but only in one direction (more condensed than regular). There were probably others, but I can't think of them offhand. <br> <br>All of this is sort of moot, of course, since Adobe made the decision to stop doing MMs around the same time that InDesign 1.0 was finishing development. <br> <br>Regards, <br> <br>T</p>
