    html: "<p><i>Why would anyone wish to modify a letterform in order to rag right type? </i> <br> <br>To improve the rag without resorting to hyphenation? <br> <br>Most people think of text as either justified or unjustified, but in a different conceptual and potential software model ragged right text could also be considered justified. What we typically think of as fully justified text is text that is justified to a fixed margin. If you care about what the rag of 'unjustified' text looks like, then I would argue that you are interested in justifying it, but justifying it <i>to a variable margin</i>. In effect, you are saying, 'I want a rag, but I don't want the rag to fall outside this range, i.e. no lines should be shorter than the distance X from the story margin'. This is justified text, because you are not simply lining up the letters one after another and letting the rag fall where it will: you are doing the work of deciding what the rag should look like. Justification by works <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
