    html: <p>Golly, Hrant, you're never one to dwell on the subtleties, nuances and counter-evidential examples are you? Why look at books when you can just make broad general assertions! There are many examples of soft rag in the manuscript and print traditions of Western Europe, but the dominant model in the Western formal book manuscript was justification by letter expansion and contraction, which is itself a very fluid technique, not remotely 'absolutist'. Gutenberg emulated this technique in the 42-line Bible, but within a few years it was abandoned in favour of efficiency.</p>
