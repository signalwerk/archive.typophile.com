    html: <p>A short or long first line is really dependent on the copy and the set width. Either one can work. But a quality rag setting, either left or right, should have the natural organic quality of a gentle coastline. Not too craggy and not too even. And should avoid any forced mechanical short-long-short-long solution.  <br> <br>Setting a good rag is one of the most difficult things to do in typography.</p>
