    html: "<p>&gt; Well, which is it Hrant? <br> <br>It's convenient being so literal, isn't it? <br> <br>I'm talking about the undercurrent, not exactly how the Romans justified their paragraphs, not what Copernicus discovered, and not what Bayer [thought he] liked. There's a consistent stream running through history since the Romans: <br> <br>The Romans \"borrowed\" the Greek culture to create the bulk of their own, but they didn't inherit any of their wonderful pragmatism*. The Romans -being imperialists- were driven by Order and Formality, a desire to <i>control</i> (as opposed to the Greek desire to <i>understand</i>). This translated to the desire to control Nature during the Enlightenment, and in the microcosm of typography Modernism turned this into nice rectangular blocks. <br> <br>* That's why Rome is when Western Culture really started - Greece was a hybrid/transit between East and West. The Ancient Greeks would cry laughing at the way the cornerstone they laid was used to bludgeon instead of build. <br> <br>The point isn't how little justified or ragged paragraphs affect readability (I agree it's not qualitatively very relevant), it's what's <i>under</i> them: the desire for superficial control, versus the desire for true harmony, which is never absolute. This is paralleled for example in the thought that all single letters are critical in reading (because that makes it more controlled), versus the reality that reading is an extremely heurtistic, nebulous activity. It is also paralleled in the imposition of identical vertical proportions in Latin/Cyrillic type design: it <i>looks</i> better on the surface, but in truth it is a violation of functionality. And it is also paralleled in religious fundamentalism; the Talibaan are much more Western than they think! <br> <br>The Romans were much more superficial than the Greeks, and we're still paying for it, in typography, politics, and everything in between. <br> <br>-- <br> <br>&gt; If you don't like ragged type</p>"
