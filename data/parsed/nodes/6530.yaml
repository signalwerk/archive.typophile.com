  html: <p>i've been racking my brain forever trying to find a font that has what we call a 'tail' in it (see right image below)...i have one font with it, but the font is also distorted; therefore, the tail will not work. <br> <br>does anyone know of any fonts that have tails built in? otherwise i'm relegated to have someone do some pen drawing in illustrator (i'm a photoshop guy) or to buying some athletic logo software. i'd rather just have a font. <br> <br>any help would be greatly appreciated. thanks! <br> <br><img src="http://www.typophile.com/forums/messages/83/48220.jpg" alt="tail"></p>
