    date: 2004-09-06T20:22:00
    date_raw: 6 Sep 2004 — 8:22pm
    votes: null
    html: <p>The other one I know besides Letterhead's Pilsner &amp; Ephemera is Leslie Cabarga's <a href="http://www.flashfonts.com/flashsite/fontspage.htm" target="_blank">'Casey'</a> family. <br> <br>However, the fact is that when you use 'tails' you really need to be prepared to draw your own.  You can always use the pre-drawn ones from the Letterhead fonts, but even with those it helps to maneuver the swashes around to achieve the best underlining. They need to be stretched for word lengths, and positioned for good connection. You don't just type them on, like any other font character. <br> <br>I'm not trying to be discouraging, but there are limits to what you can expect a font to do.</p>
    html_clean: <p>The other one I know besides Letterhead's Pilsner &amp; Ephemera is Leslie Cabarga's <a href="http://www.flashfonts.com/flashsite/fontspage.htm" target="_blank" class="link-external">'Casey'</a> family. <br> <br>However, the fact is that when you use 'tails' you really need to be prepared to draw your own.  You can always use the pre-drawn ones from the Letterhead fonts, but even with those it helps to maneuver the swashes around to achieve the best underlining. They need to be stretched for word lengths, and positioned for good connection. You don't just type them on, like any other font character. <br> <br>I'm not trying to be discouraging, but there are limits to what you can expect a font to do.</p>
