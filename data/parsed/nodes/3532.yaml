  html: <p>I was looking through an old RS from 2001 and came across these gorgeous fonts. I did a search on all the old "Rolling Stone" fonts so I don't think this was covered before. If it was forgive me. Here's a sample. The type in question is the calligraphically inspired typeface that's used in an italic (?) and in all caps. I've also included a sample of their text face. This looks like FB's Parkinson but I wanted to be sure. I sincerely hope this is not custom. They're gorgeous. Thanks for the help. <br> <br><img src="http://www.typophile.com/forums/messages/83/28295.jpg" alt=""></p>
