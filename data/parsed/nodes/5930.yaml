  html: "<p>I've done my best to buy my own software for home use and not \"borrow\" things from work, so the software titles I use most at home are PageSpinner, PhotoLine 32, and CorelDraw--mostly shareware and a cheap (but surprisingly nice) Corel package. <br> <br>I've known for a while (and submitted the problem to the creator) that PhotoLine 32 doesn't support kerning pairs, even though it's supposed to. They've kindly emailed me back and said they're trying to fix it. Well, just recently I discovered CorelDraw has the same problem. Here's the final response I got from their support: <br> <br>&lt;blockquote&gt;It turns out this is a known problem with Draw 11 for the Mac, you will have to workaround the problem.&lt;/blockquote&gt; <br> <br>I realize all I can do is change software, but I received a much kinder response from a German shareware developer. <br> <br>Anyway--just in case--is there any such workaround, or does this just suck for me? <br> <br>-Addison</p>"
