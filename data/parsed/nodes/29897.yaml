    <p>Hello. I have a friend in Spain that started working for a new company there called Ip2-TV<br>
    which provides broadband services, telephone service and cable. She suggested I help them<br>
    by providing a visual / creative analysis of their branding and I thought perhaps posting the<br>
    current logo here could be a good start. The work that is posted was created by their designer<br>
    in Spain, whose name I do not know.<br>
    A thorough honest critique would be much appreciated.<br>
    Linked are two versions of their logo.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Ip2-TV-Logo_6640.jpg"></div><p></p>
    <p>ole</p>
