      <p>The orbital swoosh (I forget the technical term) is really out-of-date and cliche. The mouse on the end doesn't help either. I'm not sure I get the symbolism of the two interlocking TV screens - it would be clever if they spelled out the name of the company, but I can't see anything in them. What are they supposed to represent?</p>
      <p>Overall, the logo looks very "Year 2000".</p>
      <p> - Lex</p>
