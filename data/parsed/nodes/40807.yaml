    html: <p>Nathanael (number3pencils) already answered this on the album thread, but I’ll repeat the answer here for the sake of reference. The font is his own creation Newt, former called Salamander. The light weight is used here. Newt is yet to be released (arrangements are being made with Veer according to Nathanael), but you can follow its development in the <a href="http://typophile.com/Salamander">Typophile critique section</a>.</p>
    html_clean: <p>Nathanael (number3pencils) already answered this on the album thread, but I’ll repeat the answer here for the sake of reference. The font is his own creation Newt, former called Salamander. The light weight is used here. Newt is yet to be released (arrangements are being made with Veer according to Nathanael), but you can follow its development in the <a href="http://typophile.com/Salamander" class="link-lost">Typophile critique section</a>.</p>
