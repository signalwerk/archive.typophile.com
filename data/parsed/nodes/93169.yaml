      <p>Hrant,<br>
      Figural would be lovely but I swore myself to stop using Menhart's types unless I had to set something in Czech!</p>
      <p>James &amp; Hrant,<br>
      Thank you for the suggestions but in this case I would like to focus on making a piece of nice paper with letters pressed on one size and varnish on the other. I think Neil Caldwell's "trivial tokens" comment was right on point, every graphic translation of a violin's top plate into printed matter will somehow look ridiculous next to an instrument, where the cards will be exchanged most of the time.</p>
      <p>I tried something without the f-hole, clearer lines of text and a less literal translation of the wood's texture but it could maybe still be simpler.</p>
