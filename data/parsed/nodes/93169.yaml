    <p>Hi,<br>
    Long time lurker, I finally have a request to post here: I would very much appreciate a critique of a business card I’m designing for a violin maker.<br>
    The typography is loosely inspired by the stamps used to make violin labels in late 17th, early 18th century Italy. Janson, Kis and the like didn't feel quite right so I treated myself to Lexicon, so far this is the only irrevocable decision.</p>
    <p><img src="http://typophile.com/files/A_7.jpg"><br>
    <img src="http://typophile.com/files/B_16.jpg"></p>
    <p>The frontside of the business cards would be letterpress’d from polymere plates (the tryouts I made look fairly good). Everything inked except the f-hole which would only be embossed. The backside printed with varnish on a paper similar to Royal Print containing wood so it gets colored by daylight rather quickly.</p>
    <p><img src="http://typophile.com/files/card1_0.jpg"><br>
    <img src="http://typophile.com/files/card2.jpg"></p>
    <p>Any feedback would be greatly appreciated!</p>
