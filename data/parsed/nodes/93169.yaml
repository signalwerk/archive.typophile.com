      <p>Nice concept and layout. Here's my two cents:</p>
      <p>- The last two bottom lines with phone numbers and contact info should be set in a smaller size, say 2 points less than the luthier's name line of text.<br>
      - I would increase a little, in general, the word spacing (around +10%)<br>
      - by my point of view, the motto ("bonifie avec l'age") should stand on its own, either on top or on the recto of the card.</p>
      <p>If you find a printer able to letterpress it - using a cliché - , it will look very nice.</p>
