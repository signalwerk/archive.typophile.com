      <p>Or: have a black background and make <em>only the f-hole</em> a wood texture!</p>
      <p>BTW, that particular f-hole design has an interesting abrupt angle at the ends of the inside curves (I'm guessing to reduce the risk of breakage). More suitable than Lexicon might be a font that exhibits that characteristic. Maybe something by Menhart, or Dwiggins.</p>
      <p>If an f-hole glyph needs to be made, the integral sign is a great place to start (assuming it's not merely a generic math dump-in, like many type designers do). And the Florin might be an alternative, depending.</p>
      <p>Oh, and anybody who doesn't know what luthier means is quite unlikely to need one anyway.</p>
      <p>hhp</p>
