    <p>Hello,</p>
    <p>The company I work at owns a copy of the ITC Full Library (840 typefaces). They bought it in 2000/2001. The disc contains TT and PS files and seems to work fine on all machines. We also have a ITC-officina sans/serif bought separately.</p>
    <p>One minor problem is that the  ITC library does not contain any Euro-symbols.</p>
    <p>Now we have a unique offer to buy the Adobe Type Collection with a 1500 euro discount.<br>
    My question: should we buy the Adobe Type Collection?</p>
