    date: 2008-03-27T12:55:00
    votes: null
    html: <p>Poms, the OT fonts from Linotype in the Adobe Collection should be the same as (or really close to) the versions you'd get directly from Linotype. But the OT fonts from ITC and Monotype are not the same. If you buy them from Adobe, you get fonts with less features than if you buy them from ITC or Monotype. If you want Monotype or ITC OT fonts with features, etc., you need to go to one of their sites (ITCfonts.com, Fonts.com, Faces.co.uk, Linotype.com, etc…).</p>
  - id: 269154
