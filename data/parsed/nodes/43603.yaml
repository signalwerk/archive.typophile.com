    votes: null
    html: |-
      <p>In a word, NO! As discussed on other threads, the Adobe OpenType collection contains a surprising number of text families that offer no more glyphs than their old type-one PS versions. This means, especially, there are no oldstyle figures where you would most expect/want them. </p>
      <p>After being razzed here for implying that all their new OTs now had full glyphs, Adobe made the bare minimal qualification in their sales copy for the OT collection: now "many" but not all families have full glyphs. You have the burden of researching 2,300 fonts! So, it pays to shop around and not spend such a bundle in one place. </p>
      <p>If, for example, you like Galliard but want to use oldstyle figures with all its fonts, you must acquire the new ITC OT version, which gives you all that, instead of the Adobe OT version, which does not. Or Plantin, which comes with full glyphs only in the Monotype OT version, not the Adobe. When buying from Adobe, favor the families Adobe originated, like Arno, Warnock, Minion, etc. For these, their own children, Adobe made all the right moves. It's easy to get screwed buying the wrong version...caveat emptor!</p>
