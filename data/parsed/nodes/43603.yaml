    date: 2008-09-14T17:40:00
    votes: null
    html: <p>I'm also considering recommending purchasing Font Folio 11 for our clearing/Publishing house. One of the strongest reasons in its favour, in my opinion, is that Adobe seem to make embedding really uncomplicated in terms of the EULA. Thomas Phinney has claimed elsewhere that Adobe don't require any additional licensing fee for use of a font for an ebook or PDF publication. This will make a big difference to us. I hope I haven't misunderstood.</p>
