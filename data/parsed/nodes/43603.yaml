    html: <p>I purchased the Adobe OpenType Collection a couple of years ago. Even though I got a $1000 discount, as a designer, I'd prefer to buy select type families from various foundries, though I don't regret the versatility and classics that the collection provides. If your company deals with common typefaces with your clients, I'd recommend the purchase.</p>
