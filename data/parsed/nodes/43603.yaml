    date_raw: 29 Mar 2008 — 9:38am
    date: 2008-03-29T09:38:00
    votes: null
    html: <p>If you spot-check Adobe STD packages, you'll find that some have and some do not have more glyphs. With oldstyle figures, it mainly depends on whether Adobe offered expert sets in the old type-one PS version (that's where OSFs were parked); those would usually get folded into the OpenType version but the result would still be labelled STD as distinct from "Pro" which indicated more bells and whistles, like optical weights. So the purchaser must still research Adobe's glyph coverage symbols before he buys. I also like to e-mail customer service and get an unambiguous answer, because if the fonts lack what they promised, you can claim a refund...otherwise, goom-bye!!</p>
  - id: 269367
    user_id: 909
    user_name: Thomas Phinney
    user_path: null
    date_raw: 30 Mar 2008 — 11:18am
    date: 2008-03-30T11:18:00
    votes: null
    html: |-
      <p>In Adobe's fonts, the Standard vs Pro nomenclature is about language coverage, not typographic features. For example, Kepler, which has a boatload of typographic goodies, is a "Standard" family.</p>
      <p>However, I'm a little confused by this reference to "the Adobe Type Collection" and "the Adobe OpenType Collection" and people then talking about Adobe's info/PR for same.</p>
      <p><strong>Adobe</strong> has a product called Font Folio (or Adobe Font Folio), which has lots of OpenType fonts. The latest version is Font Folio 11, replacing the older Font Folio OpenType Edition (a.k.a. Font Folio 10).</p>
      <p><strong>Monotype</strong> has created a product called "the Adobe Type Collection, OpenType edition," which has lots of Adobe fonts which they are authorized to resell. Adobe did not create and does not sell this bundle of fonts, and is certainly not responsible for disseminating info about it.</p>
      <p>Regards,</p>
      <p>T</p>
