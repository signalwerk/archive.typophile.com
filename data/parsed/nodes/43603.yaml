      <p>That is correct. Adobe's licensing does not charge anything extra for "commercial PDF" usage or the like. All the fonts that are entirely Adobe-owned are even set for "editable" embedding. The license even allows for user modifications, which hardly anybody else does any more (it used to be more common).</p>
