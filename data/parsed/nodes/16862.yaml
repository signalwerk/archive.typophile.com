      <p>Well said! Where would our economy be without an annual gift-giving day?</p>
      <p>I heard a lawyer on the radio the other day say that it is within the prerogative of local governments to set up [insert-favorite-holiday-name-here] decoration in the public space, because it is permissible for local governments to encourage an increase in local consumer spending—which leads to higher tax revenues. [This, at least in theory, is good for everybody. Now how far apart from the true meaning of Christmas is that <em>really</em> ;-) ]</p>
      <p>I will also be celebrating “Christmas” this year (well, <em>Weihnachten</em>, actually…), but my Christmas cards say “happy holidays” on them, too. I may believe in my beliefs, but I certainly don’t want to offend anyone with them. That’s my beef with the Christian Right, I guess… and probably most other <em>“listen to us, we are ’right’s’,” too!</em> How are you ever going to convince someone that you are right when you starting right off by offending them? That isn’t real conservatism. Real conservatism (and real Republican-ism, I thought) is minding your own business, and expecting everyone else to mind theirs as well.</p>
