      <p>That’s bizarre. Especially since Christmas is all over the place. It’s like this debate over the ’War’ has gotten everyone to think that this is a bigger issue than it is.</p>
      <p>On a related note, the House of Representatives <a href="http://blogs.washingtonpost.com/thedebate/2005/12/war_on_christma.html">passed a bill to “protect” Christmas</a>. The ensuing debate is pretty funny and pretty indicative of how ludicrous it is for the U.S. government to pass bills to protect a specific religion.</p>
      <p>Wish people a Merry Christmas! Who cares!? Focus on something that <em>matters</em>, like any of the laundry list of problems in this country, let alone the world. Christmas isn’t suffering because of “secular” activities, it’s suffering because its practitioners are missing the point. Heck, even <a href="http://www.cnn.com/2005/US/12/06/churches.closed.christmas.ap/index.html">megachurches</a> are closing on Christmas because of anticipated low turnout due to Christmas falling on Sunday. Who would have guessed that churches themselves would be fighting the war against “the reason behind the season”? Even Fox had ’Happy Holidays’ ornaments for sale on its site before this B.S. crusade started.</p>
      <p>As was pointed out by Rep. Gary Ackerman: “Is this another war we fight for reasons that do not exist?” This is not a war against Christmas, it’s the plurality of the United States expressing itself through the democracy of the governing institutions. Welcome to freedom, people. It’s not that you can’t celebrate Christmas, it’s that there are other celebrations going on and people want to acknowledge them. Christians are the overwhelming majority in the U.S. Self-centered individuals are trying to set up the majority as the minority to curry support and money from them. It’s a con, and an old one.</p>
    html_clean: |-
