    votes: null
    html: "<p>Well, Hrant, I can't argue with any of that, you're obviously right.  Part of the difficulty in this discussion depends on which aspect (or, perhaps more accurately, which argument) we're going after.  If we're talking about copyright protection then the points you brought up are major issues (not that they aren't otherwise).  I would venture to say that type design is the most difficult copyright question to answer...  it may be obvious to you and I, but it's clear that more than a few political types don't see it our way.  Most of them can't see past the notion that we're not trying to claim the alphabet itself*, but our own interpretations of it; with that in mind, can you imagine the smoke that'd spout from their ears if they even heard the points we just discussed? <br> <br>Of course other factors play here, too.  What amount of work has to be performed on a (pre)existing object before that work itself is protected as a new object?  Perhaps a lessen can be taken from the field of translation:  Translations are only granted a \"derivational copyright\" because they are considered derivative works, and the translator must still gain permission from the original copyright owner to do anything to it.  (This is all keeping in mind that, oftentimes, the translator will put in almost three times as much work as the original author.) <br> <br>This and other issues need to be resolved before most policy-makers are ever going to take the matter seriously. <br> <br> <br>*I read an article a few years ago about a visual poet (was it Richard Kostelanetz?) who had given the copyright office so much trouble that he was actually assigned a personal copyright caseworker.  This poet's work consisted of a lot of typographical work (the one I remember was three sizes of the lowercase a arranged on various parts of the page).  The caseworker argued that the copyright office wasn't going to offer protection to a pre-existing system, and that any modification of the forms involved was \"of a supernatural nature.\"  Whatever that means.</p>"
