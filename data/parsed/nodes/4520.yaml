    votes: null
    html: "<p>Hrant, the whole point of ClearType is to reduce the need for extensive hinting in the x-direction. The ClearType renderer actually <i>ignores</i> x-direction delta hints. Ross and I have done extensive work with ClearType, and there is no gain in trying to control x-direction stems or proportions: the ClearType resolution gain allows greater fidelity to the glyph form, so optimal screen readability can be addressed in the design process rather than in the hinting. Indeed, if a font does contain x-direction stem hints -- e.g. for the benefit of 300 dpi laser printers -- it is often beneficial to turn them off for the CT renderer, which produces better results without them. <br> <br>Note that these comments, while generally true of ClearType in its currently shipping incarnation, are even more pertinent to recent improvements that will ship with future MS software.</p>"
    html_clean: "<p>Hrant, the whole point of ClearType is to reduce the need for extensive hinting in the x-direction. The ClearType renderer actually <i>ignores</i> x-direction delta hints. Ross and I have done extensive work with ClearType, and there is no gain in trying to control x-direction stems or proportions: the ClearType resolution gain allows greater fidelity to the glyph form, so optimal screen readability can be addressed in the design process rather than in the hinting. Indeed, if a font does contain x-direction stem hints -- e.g. for the benefit of 300 dpi laser printers -- it is often beneficial to turn them off for the CT renderer, which produces better results without them. <br> <br>Note that these comments, while generally true of ClearType in its currently shipping incarnation, are even more pertinent to recent improvements that will ship with future MS software.</p>"
