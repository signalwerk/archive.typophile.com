    html: "<p><i>Stone Sans? I think it's way different, and in fact pretty distinctive...</i> <br> <br>Put Frutiger, Myriad and Stone Sans side by side and you will see relationships between them. Myriad is closer to Frutiger than Stone Sans, to be sure, but they do form a kind of sub-genre: there is a familial relationship. If Myriad is the direct descendant of Frutiger, Stone Sans is a kind of grandchild. In any case, my main point is that Myriad has both novelty and originality, whereas Segoe does not.</p>"
