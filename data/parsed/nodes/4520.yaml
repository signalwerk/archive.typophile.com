    html: <p><i>And significantly here, it might introduce the color filtering/balancing between the three channels, which I'm pretty sure is proprietary.</i> <br> <br>When MS first shipped a product with the CT renderer -- the first version of the MS Reader -- they went to great lengths to try to hint the Reader fonts -- ironically, including Frutiger Linotype -- so that stem edges would fall on the same subpixel boundaries, but this was because the first version of the renderer was not as good as it has since become. It is now possible to achieve excellent, consistent, high contrast bitmaps with greater fidelity to the outline width and weight. Again, this means that screen readability can be optimised in glyph design.</p>
