    votes: null
    html: "<p>Since I first saw Segoe, I've looked a lot at it, and at Frutiger and Myriad, and also at Stone Sans. The latter three constitute what I consider a sub-genre of humanist sans -- the Frutiger Line --, although Stone Sans also owes something to Meier's Syntax. It is a narrow sub-genre, clearly defined by Frutiger, but within it Myriad and Stone Sans manage to present novelty and originality: I don't consider Myriad a clone of Frutiger. Whatever the intent of the designer of Segoe, and whatever his design process/method, the simple fact is that there is neither novelty nor originality in the result: it just looks like Frutiger. <br> <br><i>- Agfa/Monotype, Linotype and MS are in contact to try to resolve the issue.</i> <br> <br>And I think we should let them get on with it. They all know the issues, Microsoft most of all, and hardly need to hear our opinions.</p>"
