    votes: null
    html: "<p>John: your points about ClearType make sense to some extent, but I think not totally. You say ClearType makes superhinting less necessary. I agree. But it can't totally get rid of the need (not at current screen resolutions - not everybody is using your settings :-). You say that ClearType ignores x-hints. Sure. But I can think of two reasons for that, both temporary: hinting at triple the resolution with the color filtering trickery thrown in is much harder, and they didn't want to hold up the other MS products waiting for a first iteration of CT; and they wanted to leave room for improvement*, and could afford to since even a \"low-tech\" incarnation of subpixel rendering is still a big improvement. <br> <br>* Leaving room for improvement has in fact become standard practice in the software industry, because you can charge for upgrades. <br> <br>Basically what I'm getting at is that even with triple the resolution and anti-aliasing, there's some room left for improvement, and that would come from superhinting. But I admit it's possible that the gain is small enough not to warrant the effort. <br> <br>hhp <br></p>"
