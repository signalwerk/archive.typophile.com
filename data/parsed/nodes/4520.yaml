    date: null
    date_raw: null
    votes: null
    html: "<p>I think this whole issue brings about new issues that need to be addressed, especially in the realm of copyright protection, which I know may be a point falling on deaf ears in the US.  (I've seen some really crazy stuff in my day, but the treatment of type design in the US is one of the most astounding slaps in the face I've ever experienced--I know I'm preaching to the choir.) <br> <br>I guess the biggest question I'd pose on this matter is:  Does adding special treatment to an existing face (in this case, hinting, or specifically, \"ClearTyping\" [which is a phrase that I believe WILL be necessary in the near future, if it isn't already--so I'll take full credit for coining it when a definitive dictionary of type design emerges]) give it credibility as a new face?  It obviously doesn't, or it shouldn't anyway.  If that were the case then everyone would need to learn ClearTyping (which, frankly, I'm not prepared to do at this point); if you don't ClearType your face at the onset, \"someone\" else might do it in the future, which from what I can see in the comparison is what happened here. <br> <br>I agree that to make a more accurate judgement I'd have to see some higher resolution; regardless, at this point I can see only a few minor differences...  and those appear to be the result of hinting variation.  Doesn't make it a different face, though.</p>"
