    votes: null
    html: "<p>The thing is, \"technologies\" such as ClearType affect the way the type is <i>seen</i>, and that's the most important thing. An outline font isn't necessarily the be-all and end-all of what the font really is. In fact sometimes it's merely an awkward vehicle: think of pixelfonts - especially grayscale ones, where the outlines are basically unusable as such. <br> <br>hhp <br></p>"
    html_clean: "<p>The thing is, \"technologies\" such as ClearType affect the way the type is <i>seen</i>, and that's the most important thing. An outline font isn't necessarily the be-all and end-all of what the font really is. In fact sometimes it's merely an awkward vehicle: think of pixelfonts - especially grayscale ones, where the outlines are basically unusable as such. <br> <br>hhp <br></p>"
  - id: 33195
    user: null
    date: null
    date_raw: null
    votes: null
    html: "<p>In fact, come to think of it, even outline fonts aren't always what they seem to be. Consider the necessity for optical scaling: the same outline font looks very different at different sizes, and people make multiple size-versions of a font (or a MM optical axis)  to counteract optical effects. <br> <br>The true nature of a typeface isn't entirely expressed in the actual outlines. <br> <br>hhp <br></p>"
