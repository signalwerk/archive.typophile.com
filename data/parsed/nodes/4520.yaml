    html: "<p>In order to know whether Segoe is a rip-off of Frutiger, one would need to know the mind of the person who made it. A more reasonable question to ask is: <i>Does Segoe look too much like Frutiger?</i> (regardless of intent). <br> <br>I think it does, and I have had occasion to see a lot more Segoe than most other people outside of Microsoft and Agfa Monotype. I don't know whether Segoe is an intentional rip-off -- and to a large extent I think the question is irrelevant --: the similarity between the two faces is too great not to cause scandal, and MS should be concerned about this.</p>"
