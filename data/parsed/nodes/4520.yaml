    html: <p>I think there could be, in some instances, a very small gain in the contrast of some bowl shapes by hinting to specific subpixels; however, now that the colour filtering is doing such a good job there is a much karger benefit to be had in using subpixels for <i>spacing and kerning</i>, which so far has not been done. Once you start allowing the glyphs to fall on subpixel widths and to be kerned to subpixels, you lose the ability to predict on which subpixel boundary a stem will fall, but you gain a huge amount typographically.</p>
