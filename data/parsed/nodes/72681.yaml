  - id: 477217
    user: 32182
    date: 2011-09-13T06:52:00
    date_raw: 13 Sep 2011 — 6:52am
    votes: null
    html: |-
      <p>Thanks for all your advice!  </p>
      <p>I took Nick's advice and did not try alter the original map with any overset text.  Instead I worked with the map graphic in illustrator to try to make the text as rounded and legible as possible.  Anything else would have not preserved the hand crafted character of the original graphic.  The trickiest part was working with Live Trace.  I had to make sure that the graphic got simplified but not overly abstracted.</p>
      <p>The map will be approximately 16' x 16'.  We were pretty excited to see the mock up sample.</p>
