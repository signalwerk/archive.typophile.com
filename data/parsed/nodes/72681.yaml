      <p>I was worried somebody would tell me that I had to do this all by hand!  I definitely see how tracing the letters will result in a final design that feels more like the original.  And the more I researched fonts, the more I realized that an exact match does not exist.</p>
      <p>I had thought about using a font like Gotham Rounded or something like that and scaling / hand placing each letter individually, on top of the map graphic, to preserve scale and spacing.  Still thinking it all over. And will share the final results...</p>
      <p> I appreciate everybody's input!</p>
