    <p>I am not a graphic designer here... So I was hoping to ask for help from the experts!</p>
    <p>This isn't so much as an font identification question, but a request for a font recommendation. I've been able to trace this image in Illustrator for use in a 15' map graphic that will be inscribed in granite. I like the historic handwritten look of the lettering. However but when I trace the text the font shapes look terrible. I've been thinking about replacing the text outlines with an actual font, which would save me from having to shape the curves to something pleasing to the eye?</p>
    <p>Do you have any recommendations? Map was drawn in 1850.</p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/darmap0203-Edit2_1000x915_4760.shkl.jpg"></div><p></p>
