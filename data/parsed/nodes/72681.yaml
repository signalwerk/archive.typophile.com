    html: <p>Nice suggestions here. Nick, is right of course. But if you want to start with type, do think irregular. Gotham Rounded is too consistent. Even tho it's more early 1900s and German, <a href="http://www.fontshop.com/fonts/singles/scangraphic/din_17_sb_regular_ot/" rel="nofollow">DIN 17</a> (derived from template-assisted hand-lettering) might be more appropriate with some adjustments.</p>
