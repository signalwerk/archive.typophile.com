    html: |-
      <p>Type won't capture the charming irregular quality of words like LIBERTY, or GREENSBURG's bend.<br>
      Your best bet is to draw the letters as paths in Illustrator, and then stroke those paths.<br>
      That will also provide consistency of line in different sizes (e.g. FIFTH and VIRGIN).<br>
      It will be meticulous and time-consuming work, but will produce far better results than auto-tracing letter outlines.<br>
      The effect will still be a somewhat unnatural, compared to the original engraved script, but that should be mitigated by the medium of granite etching.</p>
