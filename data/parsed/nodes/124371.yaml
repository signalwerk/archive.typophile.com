    html: <p>What Nick used is <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#5.e">Contextual substitutions</a> i.e. substitutions that occur only in a specified context (for example substitute an s only when followed by a letter).  LuaTeX allows using <code>.fea</code> (Adobe feature) files to do that so as to get the functionality without modifying the font.</p>
