      <p>@riccard0</p>
      <p>I can see two reasons against encoding this in the font files. First, is it acceptable/legal for users like me to edit the font files if a font doesn't have the feature I need? Second, I'm not sure that the rules for handling longs are set -- they may vary from language to language or era to era. Having several features in every font file may be an option, but using the human-readable (albeit with unicode code point) 'text-transform' property seems like a more compact and editable solution?</p>
