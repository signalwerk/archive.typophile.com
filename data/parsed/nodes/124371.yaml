    html: |-
      <p>I’ve put an OpenType feature which follows the 18th century English language convention for long s, in several of my typefaces—but none of them are revivals from that era.<br><code><br>
          sub longs' f by s;<br>
          sub longs longs' by s;<br>
          sub f longs' by s;<br>
          ignore sub longs' @hist1;<br>
          sub longs' by s; </code></p>
      <p>(@hist1 = lower case characters)</p>
