    <p>I’m working on a project which other may find interesting. I’m trying to replicate a publication from 1798 (Malthus’ Essay on the Principle of Population as it affects the future improvement of society). The source files are <span class="caps">HTML</span> (from Project Gutenberg) and I’ve added a <span class="caps">CSS</span> style sheet to produce a <span class="caps">PDF</span> file as close to the printed edition as possible, while still keeping the <span class="caps">HTML</span> in a browsable form. Here are links to my&nbsp;edition:</p>
    <p><a href="http://css4.pub/2015/malthus/essay.html">http://css4.pub/2015/malthus/essay.html</a><br><a href="http://css4.pub/2015/malthus/essay.pdf">http://css4.pub/2015/malthus/essay.pdf</a></p>
    <p>And here’s the original from&nbsp;1798:</p>
    <p><a href="https://archive.org/details/essayonprincipl00malt">https://archive.org/details/essayonprincipl00malt</a></p>
    <p>The <span class="caps">PDF</span> is produced with <a href="http://www.princexml.com">Prince</a>.</p>
    <p>The printed first edition uses long s. I didn’t feel like changing the <span class="caps">HTML</span> source files for this purpose and instead uses the ‘text-replace’ property in <span class="caps">CSS</span> to achieve&nbsp;this:</p>
    <p>  text-replace: “s”&nbsp;“\017F”</p>
    <p>Now, the long s should not be used at the end of a word, so exceptions must also be&nbsp;coded:</p>
    <p>  text-replace: “\017F\20”&nbsp;“s\20”    </p>
    <p>There are more such exceptions, see the <span class="caps">HTML</span> source for the set I’ve been using. I know that some fonts also encode these substitutions. However, I believe it is easier for authors/replicators to edit the <span class="caps">CSS</span> source. Changing font files is frowned upon, no? Also, some other interesting substitutions are encoded. For example, to change “etc.” to “&amp;c.”, one can&nbsp;use:</p>
    <p>  text-replace: “etc.” “\26&nbsp;c.” </p>
    <p>And “economist” to&nbsp;“œconomist”:</p>
    <p>  text-replace: “economist” “\153&nbsp;conomist”  </p>
    <p>The ‘text-replace’ property is described&nbsp;here:</p>
    <p><a href="https://books.spec.whatwg.org/#character-substitution" title="Click to visit an external secure URL." class="freelink freelink-external_ssl freelink-external">https://books.spec.whatwg.org/#character-substitution</a></p>
    <p>It would be interesting to hear of similar projects and how presentational substitutions are&nbsp;encoded. </p>
    <p>In the past, I’ve also replicated Henrik Ibsen’s poems from 1871 in the same manner, it’s linked from&nbsp;here:</p>
    <p><a href="http://css4.pub" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://css4.pub</a></p>
    <p>Cheers,&nbsp;Håkon</p>
