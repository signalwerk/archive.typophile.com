      <blockquote><p>First, is it acceptable/legal for users like me to edit the font files if a font doesn't have the feature I need?</p></blockquote>
      <p>Not unless the license allows it, but you can select an appropriate font and serve it as webfont.</p>
      <blockquote><p>the rules for handling longs [...] may vary from language to language or era to era</p></blockquote>
      <p>They do. That's why you have both language and historical related features.<br>
      As I said, that would be the right solution for the user in a perfect word, where copying the text and pasting it using a different font would not end up with characters either missing or rendered with yet another different font.<br>
      Today, especially for the creator, your solution is probably the best, and indubitably a very clever one.</p>
