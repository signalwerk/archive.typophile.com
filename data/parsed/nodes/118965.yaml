    html: |-
      <p>There were many typefaces designed in this style in late Sixties/early Seventies, such as Strada (<a href="http://opera78.livejournal.com/254275.html">http://opera78.livejournal.com/254275.html</a>), Beat Star (<a href="http://fontsinuse.com/typefaces/32135/beat-star">http://fontsinuse.com/typefaces/32135/beat-star</a>), and Sintex (<a href="http://fontsinuse.com/typefaces/31801/sintex">http://fontsinuse.com/typefaces/31801/sintex</a>).<br>
      But even the precursor of them all, 1889’s Gothic Bold (<a href="http://www.flickr.com/photos/hithro/7753073390/in/set-72157631002519134">http://www.flickr.com/photos/hithro/7753073390/in/set-72157631002519134</a>) sports a curved leg on |R|.<br>
      My guess is that the sample is from a knock-off font specifically designed for sign-cutting machines.<br>
      (or maybe done with FontStruct, like Cowboy Hippie: <a href="http://www.cheapprofonts.com/Cowboy_Hippie_Pro.php">http://www.cheapprofonts.com/Cowboy_Hippie_Pro.php</a> ;)</p>
      <p>Of note, the sample shows two different widths, unlike any of the above.</p>
