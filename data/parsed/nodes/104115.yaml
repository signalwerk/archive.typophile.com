    html: "<p>A bit less lively and individual, overall. The h is less cramped, but less interesting. And I prefer the original M, it was more easy-going, less school-like. I do like the way the loops have been opened up, though. But now it’s ambivalent: is it one word with an intercap or two words? The obvious question is: Was it necessary? I don’t see the point, myself.</p>"
