    votes: null
    html: |-
      <p>Hey, I’m not knocking the redesign, just pimping my font :-)<br>
      It’s a comparison for consideration.</p>
      <p>Among other things, I like the way Ms Hische has made the ascender of /h longer.<br>
      I made all Handsome’s extenders and caps pretty much the same height, to clean up paragraph setting with no or minimal leading.</p>
      <p>She opened up the loop of /p, whereas my philosophy was to not worry, again targeting longer text settings where various thickening of stems occurs.</p>
      <p>I also like the way she has differentiated the counters of the capitals from those of the lower case, and harmonized the proportions of the capitals with one another.</p>
      <p>The nuances are tuned to the particular letter sequence in the wordmark, which doesn’t happen in a typeface.</p>
