      <p><a href="http://brand.abudhabi.ae/en/brand-elements/font/" title="http://brand.abudhabi.ae/en/brand-elements/font/">http://brand.abudhabi.ae/en/brand-elements/font/</a></p>
      <p>"Usage:</p>
      <p>As with the Brandmark, use of the Abu Dhabi typeface is only given to selected organizations mandated with the promotion of Abu Dhabi as a tourist or investment destination, to entities that act as the gateway to the Emirate of Abu Dhabi, or to foundations and associations specifically established to promote the cultural identity of Abu Dhabi.</p>
      <p>To encourage alignment with the brand, permission to use the secondary typefaces is granted to all government departments, private businesses, associations, and foundations. Organizations must apply for their own software licences if they use these typefaces."</p>
