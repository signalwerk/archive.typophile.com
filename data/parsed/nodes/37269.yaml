    html: |-
      <p>I'd wager that somewhere there is a tale of a pay font hanging up someone's system too.</p>
      <p>I have always worked mainly with free fonts, and never had a hang-up I could trace to a font. Well maybe before XP; anything could happen back then with Windows. The boogey-man was always just around the corner.</p>
      <p>The real frustration with free fonts for me is suddenly realizing you need some characters that aren't there. Or odd behavior when put on vector curves. Or real bad spacing that requires some time spent adjusting. Or something is just 'off' when you are finished, and you can't seem to make it fly.</p>
      <p>Sometimes I actually enjoy the challenge of making a quality-challenged font look its best, but then I realize it is a kind of false advertising, so I won't go too far with this.</p>
      <p>Given the choice, and the ability to charge it to someone, I'd go with pay fonts most of the time. Just less surprises, on the whole. </p>
      <p>I imagine, if a font is well made, you might never realize the quality. It is lack of quality that is easy to focus in on, as a rule. And I get to see plenty of that. But for free, I can't complain (too much, anyway).</p>
      <p>And occasionally I have worked with a font that made me ooh and aah when using it. Now that is worth money.</p>
