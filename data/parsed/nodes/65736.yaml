    <p>Wouldn’t it be wonderful if FontLab allowed selective locking of global and local guidelines – so that one could leave the global ones locked, but still edit the local ones? Or am I the only one who’d find that handy?<br>
    (Or maybe it’s actually possible and I just don’t know how?)</p>
