      <p><cite>Why, specifically, were they viewed as failures?</cite></p>
      <p>None of the entrants liked them, the judges hated them, and we quickly realized allowing submissions to be fine-tuned by those entering would provide a better result.</p>
      <p><cite>Might they be floating around the tdc.org website somewhere?</cite><br>
      The first competition was held before the TDC had a web site. The templates may be floating around, but not on the web site.</p>
      <p>Essentially the templates were made up of different sizes of text blocks on a 11 x 17 portrait page. For text submissions I think it went from 6 point up to 24 or so. For display entries it might have had a range of 14 to 96. With a character showing at the bottom. And a pangram headline at the top.</p>
