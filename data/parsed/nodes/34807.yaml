    <p><a href="http://www.thisdayintype.com" rel="nofollow">This Day in Type</a> has teamed up with <a href="http://www.wearecampfire.com" rel="nofollow">Campfire T-Shirts</a> to provide five lucky typographers with the T-Shirt of their choice. To be entered to win, all you have to do is submit a date to This Day in Type for July 1-31. I will be drawing a name for each week, so each person can enter up to five times. This is my way of saying thank you to the people who have helped make the site better through their contributions!</p>
