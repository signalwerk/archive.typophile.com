  html: |-
    <p>There is a font that we are using for all of a clients communications. It is a very thin hairline, so has been used with a fine stroke added to increase thickness. </p>
    <p>I now want to recreate this font with the increased thickness so others can use it without needing to add the stroke. Is there any easy way to adjust the font in FL5?</p>
    <p>Thanks for your help.</p>
