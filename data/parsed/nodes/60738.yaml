      <p>On their own, I don't think fonts have much cultural value. They're pleasant to look at in catalogs or font websites. A designers/typographer's choice of font has more cultural impact than fonts themselves could ever have. A font designer can design provocative fonts but if designers don't use it, the cultural impact is nothing.</p>
      <p>Type makes the world better? It's nice to have good tools available so, yes. A good choice of hammers and nails makes the world a better place too. Having a richer palette of tools helps designers make the world more interesting. Unsold type doesn't make the world better or worse. People talk about the cultural impact of fonts like Helvetica but it's wasn't the font itself that had impact. The same thing could have happened with Univers. The cultural impact of Helvetica was that one particular, neutral sans-serif attained ubiquity. If you could go back in history, swap Univers and Helvetica designs, I don't think it would have any cultural impact. The world would look almost the same as it does now. If designers had, instead decided to embrace a slab serif font instead of a sans, if would have some impact.</p>
      <p>However, you won't find a shortage of people who think fonts themselves have rich cultural value. I don't really see it that way. If you're a painter, a good font is like finding your perfect brush and tube of paint with the perfect shade of green. If you want to endow the tools with mystical powers, go right ahead.</p>
