      <p>hello guys.</p>
      <p>Christopher, thank you for the recommendation. This article is definitely Worth a read. Nice to see this kind of things measured.</p>
      <p>Ray, I agree with you that the cultural impact of the fonts depend on the designers choices and preferences, and their general acceptance, and also that a font is a tool. What I have to disagree is that tools don't have a cultural impact by them selves. Surely if a font seats unused it attains no visibility and provides no impact. However it is a broadly agreed notion that the advent of new tools influences contents, it has always been like this with every technology.</p>
      <p>I'm saying this without elaborating about what might be <em>cultural impact</em>. I guess what I am referring to is the aesthetics of the written contents. Like the aesthetics studied in "The aesthetics of reading" by Kevin Larson and Rosalind Picard that Christopher recommended.</p>
      <p>Victor and Theunis, thank you for you for your kindness.</p>
