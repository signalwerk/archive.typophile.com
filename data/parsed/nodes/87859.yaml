    date: 2012-01-05T11:42:00
    date_raw: 5 Jan 2012 — 11:42am
    votes: null
    html: |-
      <p>So I've done more work on this and "rationalized" the swashes:<br>
      -Uppercase letters get a swash on the entry stroke, except letters with diagonals:  R, K, X<br>
      -lowercase letters get a swash on the exit stroke, except m, n, p, u, y, r, v &amp; w that get a subtle curve on the entry stroke.</p>
      <p>I also opened up the swashes on the caps, redeigned lowercase g and y and tweaked many other letterforms. I'm still unhappy with N and J. Disregard spacing and kerning as I've done nothing on that front yet.</p>
      <p>Looking forward to hearing more feedback!</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bellota_text2_4997.jpg"></div><p></p>
      <p><a class="freelinking external" href="http://pixilate.com/dreamless/bellota_text2.pdf pixilate.com/dreamless/bellota_text2.pdf" rel="nofollow"> Sample PDF</a></p>
