      <p>Hi Kemie,<br>
      I'm a fan of your work since the days of Flash 4 :)<br>
      Will love to help. Here are a few suggestions.</p>
      <p>On the lowercase:<br>
      - I will only remove the swashes only on the "v" and "w".</p>
      <p>- On the top part of the "u" and the "y", you can make it more like the ones on the "m,n,p,r".</p>
      <p>- On the bottom of the "u", like the one on the "a,d,h,i,l,m,n". Or you can test how they look if you make it all like the ones at the top of the "m,n,p,r" (but inverted).</p>
      <p>- Add a just a little bit more of white space on the sidebearing. So the letters has more room to breath.</p>
      <p>On the Caps:<br>
      - I will remove the bottom swashes of the A, H, K, M, R, X.<br>
      - Increase the with of the swashes on the top of the B, D, P, R. They are too close to the stem.</p>
