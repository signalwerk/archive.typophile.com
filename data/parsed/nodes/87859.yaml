      <p>You're right, the "f" is jarring, but I think it's<br>
      only because the loop and the bar are too close.</p>
      <p>Also, a slightly "aggressive" shape usually causes<br>
      real trouble when doubled (this happens often with<br>
      the binocular "g") so you might want alternates.</p>
      <p>hhp</p>
