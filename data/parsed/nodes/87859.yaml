    <p>This is my first attempt at creating a "serious" typeface, so I set out to create a customized version of <a class="freelinking external" href="http://www.google.com/webfonts/specimen/Snippet " rel="nofollow"> Snippet</a> which I have called Bellota.</p>
    <p>I ended up changing quite a few of the letterforms, more than I expected.<br>
    I am still at an early stage, so no spacing, kerning or punctuation is done. But I'd like to get feedback on the letterforms. There are a few characters which I'm not sure if they work, like M.<br>
    Any feedback will be appreciated<br>
    <img src="http://screensnapr.com/e/L1eRYI.png" alt="bellota"><br>
    Can't upload a pdf, so here it is:<br>
    <a href="http://pixilate.com/dreamless/bellota_text.pdf" rel="nofollow">bellota sample</a></p>
