    html: |-
      <p>I like it. Bellota has a lovely overall result. But I see some improvements to do.</p>
      <p>I don't know which elements Jasper call swashes and which may be understood as terminals. But for me the fancy terminals used in lowercase work well in most pairs (but definetively not when v or w are inside a word).</p>
      <p>For the uppercase set, the terminals at right side produce so much spacing to the next letter (especially M). They may work as alternates or swash endings. In other hand, terminals at left would work well most of times <em>if</em> the letter is beginning a word. For continuous uppercase, these terminals also cause excessive spacing.</p>
      <p>Other small points: C and G seem distorted for me. Left swash in A and K seen unnecessary. The loops in f and y are almost touching the other elements and need correction. Bottom of g is very large. J does not work, it is very small and weak besides other letters (what about try a larger, open, descending one)?</p>
      <p>Anyway, a nice project. Keep it going.</p>
