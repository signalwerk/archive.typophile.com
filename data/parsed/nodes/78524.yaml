    <p>Hello everyone.</p>
    <p>I found a quote where an anonymous user says that Sony can't use a (FF Blur) font because it's commercial:</p>
    <p><cite>Probably Sony reworked it... They can't use a commercial font, of course, they must have their own font</cite></p>
    <p>in <a href="http://typophile.com/node/5250" rel="nofollow">this</a> thread.</p>
    <p>I was wondering if it is so, why can't some brand use a commercial font?</p>
    <p>Thank you.</p>
