      <p>Looks similar to<br>
      <a href="//www.myfonts.com/fonts/fontbureau/fb-nobel/" rel="nofollow">Nobel Bold</a> designed by Tobias Frere-Jones, Sjoerd Hendrik de Roos and published by Font Bureau.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/NobelBoldByFontBureau_3722.jpg"></div><br>
      The magazine logo seems to be slightly heavier and wider.<br>
      MyFonts Blurb:<br>
      "Nobel offers personal variations on strict Bauhaus geometry.<br>
      In 1929, three years after the Futura release, Sjoerd Henrik de Roos at Amsterdam explored alternative character sets to enliven basic Futura forms.<br>
      The Nobel series was designed for Font Bureau by Tobias Frere-Jones, who fondly views Nobel as ‘Futura cooked in dirty pots &amp; pans’"<br>
      Don<p></p>
