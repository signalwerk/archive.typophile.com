    <p><em>Dear All,</em></p>
    <p><a href="http://www.eurographicus.com/archivio_en.asp?L=2" rel="nofollow">Graphicus magazine</a> invites you all to take part in the project “A Library In The Forest” (“Una Biblioteca Nella Foresta”).</p>
    <p>In Congo-Brazzaville, in the hearth of the equatorial forest, there’s a village name Zanagà ; the inhabitants, thank to the wise guidance of young priest Don Rufin, expressed the wish of reading.<br>
    No food, no clothes or money, our African friends need books.</p>
    <p>Who better than us, people who deal with prints and designs, can understand such a noble demand ?</p>
    <p>If you want to contribute to the growth of “A Library In The Forest” in Congo-Brazzaville please send one or more books (secondhand texts are welcome as well) to the address underneath. The only limitation is that <em>the books must be in French</em> with the exception of picture/children`s books.</p>
    <p>The books will be directly posted to Zanagà by the volunteers who take care of the project.</p>
    <p>Thanking you all for your solidarity, we wish you a Merry Christmas and a Happy New Year.</p>
    <p><em>The Graphicus Staff.</em></p>
    <p>GRAPHICUS<br>
    PROGETTO UNA BIBLIOTECA NELLA FORESTA<br>
    Via Salvator Rosa 14<br>
    20156 Milano<br>
    Italy</p>
    <p>For more informations contact Alexia Rizzi, Editor.<br>
    Email: graphicus.age (at) gruppodg (dot) com<br>
    Voice: 0039 02 30039310</p>
