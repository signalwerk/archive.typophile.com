      <p>In the <a href="http://typophile.com/node/9245" rel="nofollow">Christian Gothic</a> (Imprimerie Nationale, 1902), I'm working on, the complete set of ligatures is:</p>
      <p>ff, fi, ffi, ct, tt, ll</p>
      <p>Note that fl, in particular, is not ligated. Obviously, fj is uncommon in French, but presumably it would follow the same rules as fi.</p>
      <p>Additional variants include: final s, final n, initial v. There are also final-swash e, t, r.</p>
      <p>When I release the font, all these ligatures and variants will be included. I'm still undecided which ones to make optional, though - I think that'll take more experience using the type in present-day settings.</p>
