  html: <p>Why do i have such a thing for <a href="/wiki/ligature" class="freelinking" rel="nofollow">ligatures</a>? I don't know. Anyhow, i'm wondering if we have an expert on <a href="/wiki/blackletter" class="freelinking" rel="nofollow">blackletter</a> ligatures in the house. I know that the <a href="/wiki/half%20r" class="freelinking" rel="nofollow">half r</a> can follow "round" letters (b d o p) to form ligatures. I know that the "e" can be attached to these round letters as well. i'm familiar with the double-p ligature. and then there are always your f-ligs and longs-ligs. then you have your historical German ck and ch ligs, which i'm informed are no longer relevant. And then there's tz, which is used in German. Are there more? I know that potentially <em>everything</em> could be a ligature, but i'm talking about fairly standard blackletter ligature conventions here. anyhow, if anyone knows of any other interesting combinations, pipe up!</p>
  html_clean: <p>Why do i have such a thing for <a href="/wiki/ligature" class="freelinking link-lost" rel="nofollow">ligatures</a>? I don't know. Anyhow, i'm wondering if we have an expert on <a href="/wiki/blackletter" class="freelinking link-lost" rel="nofollow">blackletter</a> ligatures in the house. I know that the <a href="/wiki/half%20r" class="freelinking link-lost" rel="nofollow">half r</a> can follow "round" letters (b d o p) to form ligatures. I know that the "e" can be attached to these round letters as well. i'm familiar with the double-p ligature. and then there are always your f-ligs and longs-ligs. then you have your historical German ck and ch ligs, which i'm informed are no longer relevant. And then there's tz, which is used in German. Are there more? I know that potentially <em>everything</em> could be a ligature, but i'm talking about fairly standard blackletter ligature conventions here. anyhow, if anyone knows of any other interesting combinations, pipe up!</p>
