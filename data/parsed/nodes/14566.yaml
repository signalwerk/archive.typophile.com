      <p>John, the <em>Dizionario di Abbreviature...</em> is by Cappelli; Hoepli was just the publisher. It is often referred to simply as 'Cappelli'. Another good reference book for scribal contractions is <em>The Record Interpreter</em> by Charles Trice-Martin. This is more specifically British in its focus, being intended as an aid to deciphering public rolls, parish records, etc.</p>
      <p>[The equivalent volume for Greek is T.W. Allen's <em>Abbreviations in Greek Manuscripts</em>, which is helpfully included in the more recent collection <em>Abbreviations in Greek inscriptions, papyri, manuscripts and early printed books</em> edited by Oikonomides.]</p>
      <p>There is also what looks like a really useful electronic dictionary, <a href="http://www.ruhr-uni-bochum.de/philosophy/projects/abbrev.htm" rel="nofollow">Abbreviationes</a>. I have not used this, largely because it is only available for the Mac, but it seems very promising.</p>
