      <p>"historical German ck and ch ligs, which i’m informed are no longer relevant!"</p>
      <p>Ahm no sir! If you set German texts in Fraktur or any black letter typeface, you have to stuck to the old traditional rules since no one has change it. This means at least the long_s and hopefully the common ligatures. The round r is outdated since the time of Fleischmann.<br>
      Common ligatures are:<br>
      c_h<br>
      c_k<br>
      longs_c_h<br>
      longs_longs<br>
      longs_i<br>
      longs_t<br>
      longs_z (germandbls)<br>
      f_f<br>
      f_i<br>
      f_l<br>
      f_t<br>
      t_z<br>
      l_l<br>
      Even more ligatures are possible. Have a look at the original lead typeface of Klingspor Gotisch (not the Linotype digi version).</p>
      <p>But anyway, dump, naive people set even German texts like common texts today - and it looks awful. But were is no standard of a Fraktur codepage or a Fraktur keyboard layout. Only a pseudo standard "Dfr" (Deutsche Frakur) is available - setting up the long_s and its ligatures on false glyphs on a standard codepage.</p>
      <p>John, how is the status of the Fraktron project?<br>
      <a href="http://fraktron.sourceforge.net/" title="http://fraktron.sourceforge.net/">http://fraktron.sourceforge.net/</a></p>
      <p>--<a href="http://www.astype.de" target="_blank" rel="nofollow">astype.de</a>--</p>
