      <p>Paul, there are literally thousands of scribal ligatures used in the original blackletter calligraphy and in Gutenberg's own B42 type. The most common is any letter with a bar over it indicating a doubled letter. For an exhaustive survey see Ulrico Hoepli's <em>Lexicon Abbreviaturarum</em>. Horrible cameraphone pictures of it here: <a href="http://eccentrifuge.com/hoepli/hoepli1.jpg" rel="nofollow">1</a> <a href="http://eccentrifuge.com/hoepli/hoepli2.jpg" rel="nofollow">2</a> <a href="http://eccentrifuge.com/hoepli/hoepli3.jpg" rel="nofollow">3</a>. (Bottle shown for size comparison purposes. Urp.)</p>
      <p>You should also give <a href="http://carterandcone.com/" rel="nofollow">Carter &amp; Cone</a> a call and buy Flammande and Flammande Archaic.</p>
