      <p>As well as intertitles, Murnau used pages from old books (in blackletter) and letters written by the characters, in Nosferatu (1921), to advance the plot.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/nos_dttitel_3613.jpg"></div><br>
      The monoline art-deco round-nib script for the intertitles contrasts nicely with the archaic fraktur in the pages of the old Book of Vampires, and with Hutter's letter to his fiancée. <p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/nosferatu02_4832.jpg"></div><br>
      In this scene Knock, one of Orlok's (Dracula) minions has received a cryptic letter from the Master. <p></p>
      <p>NB the Kino version has the original German graphics.</p>
