      <p>Hi,</p>
      <p>I'm not a type expert, but Stewf sent me this thread for my film expertise.</p>
      <p>The most expressionistic intertitles are probably found in, appropriately, German Expressionism. This can be seen in Hollywood productions like "Sunrise," by the movement's greatest director, F.W. Murnau. In "Sunrise," the intertitles are in many instances animated, alternating size or at one point taking on the form of water. (Guy Maddin, mentioned and linked above, obviously took inspiration from these styles in his intertitles.) Among silent film scholars, these intertitles are a point of contention with purists, who prefer them stationary, and there is debate over whether or not Murnau was actually involved in those titles since he generally made an effort to use little to no intertitles in films like "The Last Laugh."</p>
      <p>A restoration of "The Cabinet of Dr. Caligari" from a few years ago tried to make titles in the same distorted type (or at least the spirit of it) as the German original. I don't know if you can get your hands on the original German, as I've only seen English versions, but you might be able to get the feel for it if you find the quality transfer. Many films don't have their original intertitles because their only surviving copies were found in other countries, where they were re-shot in a different language, but those are generally easy to detect, especially for typophiles.</p>
      <p>Also, due to problems with copyrighting early films, a monogram was often used in the intertitles (and in some films, especially Biograph productions, built into the sets). This tradition continued after some of the legal issues were resolved.</p>
