    <p>so i'm currently trying to complete on essay on intertitles.</p>
    <p>mainly on intertitles in silent films. i know that for the most part they were there for communication purposes, but does anyone know of any 20s films that used intertitles/type in a more expressive manner? i was thinking along the lines of un chien andalou...though i'm not sure how expressive that really is.</p>
    <p>also if anyone can think of any good modern examples...i know kubrick liked his intertitles to be futura extra bold.</p>
    <p>anyway, if theres any experts...speak up!</p>
    <p>ps sorry to make a "HELP ME WITH MY HOMEWORK" type topic. i hate those.</p>
