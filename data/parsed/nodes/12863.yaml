      <p>&gt; I think each studio had its own staff or hired from the foundries</p>
      <p>Not directly related to "bringing the dialog from the screen to the user via type"*, but Gerald Lange once told me that some TV shows -notably The Twilight Zone- used actual metal type for their titles:  they'd directly photograph the type in a special way (apparently by sticking some sort of film to the face) to get "lettering" out of it.</p>
      <p>* More related to the technical dimension of the issue (that I suspect Joe is concentrating on - maybe indeed too much though).</p>
      <p>hhp</p>
