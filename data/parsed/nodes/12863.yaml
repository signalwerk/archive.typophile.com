      <p>Most silent movies have pretty typical hand lettering ranging from restrained to ornate deco. I've seen a number with pretty fancy ornaments and borders. I'm not sure how expressive any of that was in regard to the plot and themes in the actual movie. I can't think of any good examples off the top of my head.</p>
