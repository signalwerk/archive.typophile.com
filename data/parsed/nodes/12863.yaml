      <p>&gt;but does anyone know of any 20s films that used<br>
      &gt; intertitles/type in a more expressive manner?<br>
      See "The Thief of Baghdad" (1924, as opposed to the 1940 or 1978 versions), for something expressive, ((and <a href="http://www.silentera.com" title="www.silentera.com">www.silentera.com</a> specializes (indirectly) in film fonts, if you're reeeally interested;))). The type think I am working on, as encapsulated in the presentation I gave at ATypI in Rome, is ongoing and has expanded, but the font based on the font in this film is still part of it. </p>
      <p><a href="http://www.fontbureau.com/fonts/MeyerTwo" title="http://www.fontbureau.com/fonts/MeyerTwo">http://www.fontbureau.com/fonts/MeyerTwo</a> is based on this era as well. . . </p>
      <p>I think each studio had its own staff or hired from the foundries, to create fonts on film for film. I wish someone would catalog them all but... </p>
      <p>There's also this guy named Joe Clark(.org), but you might need some help figuring out what's goin' on there, or at least I did. He's primarily interested in Captioning fonts, which he seems to think are "totally different" from intertitles, or to come to my extreme, screen fonts. I think, they are all the same because of their intent, which is to bring the dialog from the screen to the user via type. . .</p>
