      <p>@Frank</p>
      <p><cite>Looking at the development costs for OTM and the potential market for such an advanced and specialistic tool, the Euro 255 we ask for it is actually unrealistically low.</cite></p>
      <p>But you probably would say the same about the DTL fonts, wouldn’t you? No doubt, that a font like DTL Fleischmann is excellent, but in my opinion fonts like Feliciano’s Merlo or Santos’ Capsa or Kobayashi’s Clifford are on a comparable quality level, if not on the same one. However, you are obviously successful with your calculations.</p>
      <p>I am primary interested in a decompiler/compiler, that comments the XML tags and that checks the consistency. And it should be possible to personalize both, the consistency check and the comments. The naming system, that Adobe uses, violates the OT specification, but it works. So the consistency check reports errors, as far as I remember. In this context I would like to know, how fast you can update the OTMaster, when Adobe updates the AFDKO and how much updates/upgrades of the OTMaster will cost.</p>
      <p>I would be interested in a light version (not the test version) without the glyph editor. I assume, that it would be easy to remove it. Can you imagine to provide such a version for less money?</p>
