      <p>Arno: <em>But in this context I would like to know, how much you would like to have for Merlo, Rongel, Capsa or Clifford, if these fonts came from DTL.</em></p>
      <p>The Dutch Type Library is not a retailer of fonts as such, but a font (-software) producing and publishing company. More than twenty years ago I set up a font (production) program for DTL, which expresses my personal ideas about type and typography, and in which both high quality historical and newly to design typefaces got a place. The historical typefaces had and have to cover the different style periods and all typefaces should not overlap but support each other. This means for instance that the different contrast sorts and contrast variants are covered. Normally type designers are invited to make a certain typeface that fits the program, like Erhard Kaiser was in 1992 for DTL Fleischmann.</p>
      <p>The complete DTL library will contain not more than roughly 25 typefaces at the end and each typeface will at least support Cyrillic and Greek besides Latin then.</p>
