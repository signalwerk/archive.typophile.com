      <p>Arno: <em>But you probably would say the same about the DTL fonts, wouldn’t you? No doubt, that a font like DTL Fleischmann is excellent, but [...]</em><br>
      &nbsp;<br>
      Looking at the man years put into the production of DTL Fleischmann, the pricing of the fonts is realistic. After an intensive study a large range of photographs were taken (ordered) of historical Fleischmann material and enlargements were made. Subsequently new drawings of <strong>all</strong> characters were made by hand. These were enlarged and served as the basis for the working drawings, which were all marked and manually digitized in the IKARUS format. The generated Bezier data was checked against the IK data for conversion errors and all contours were ‘cleaned’, i.e., unnecessary contour points were removed.<br>
      This production method was chosen to preserve the most tiny details in the design and it paid out when one looks at the quality of the final digital results.<br>
      &nbsp;<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Fleischm_prod_1_3990.jpg"></div><br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Fleischm_prod_2_5119.jpg"></div><br>
      &nbsp;<br>
