      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Fleischm_prod_9_4551.jpg"></div><br>
      &nbsp;<br>
      <em>The naming system, that Adobe uses, violates the OT specification, but it works. So the consistency check reports errors, as far as I remember.</em><br>
      &nbsp;<br>
      It is unclear to me what you mean; the <em>Consistency Checker</em> in DTL OTMaster checks the naming against the OT specs, it even summarizes the specs.<br>
      &nbsp;<br>
      <em>how fast you can update the OTMaster, when Adobe updates the AFDKO</em><br>
      &nbsp;<br>
      OTM is used internally at URW++ and DTL for the daily production. When a new version of the AFDKO becomes available, it is built in almost immediately.<br>
      &nbsp;<br>
      <em>I would be interested in a light version (not the test version) without the glyph editor. I assume, that it would be easy to remove it. Can you imagine to provide such a version for less money?</em><br>
      &nbsp;<br>
      Nope, tailor made versions are actually more expensive.<br>
      &nbsp;<br>
      The simple thing with pricing is, that if one considers a product to be too expensive, one should not buy it.<p></p>
