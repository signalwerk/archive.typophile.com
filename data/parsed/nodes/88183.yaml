    html: |-
      <p>Hi Brian,<br>
        Your Hebrew looks good alongside Neuton. However the Latin font is so much more dominating. This is a problem with most Hebrew fonts - those Romans were very much into domination!<br>
      What's to do? Maybe the serifs on the Hebrew could have fewer curves. Look how cleanly 'chiseled' are the upper serifs in Neuton. The serifs in the Hebrew look as if they were done with a brush or quill but the Neuton serifs were hammered into stone.</p>
      <p>You might study the shin in other fonts. Nueton is a STRONG font with no nonsense and you need a strong shin to go with it. If it's going to lean, it should lean like someone striding (from right to left) with a heavy backpack.</p>
      <p>The vertical of the bet has bend and might be better straight.</p>
      <p>Mike</p>
