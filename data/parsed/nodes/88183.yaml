    html: |-
      <p>Unfortunately  I don't have a lot of time, so I'll be short &amp; simple...</p>
      <p>1. I think that the main issue is the proportion (and the optical iIllusion); e.g. the kof vs. lamed ; the he vs. dalet -- the dalet looks too wide.</p>
      <p>2. The yod, or the lower part is too short! see for example the work by Zvi Narkis -- Narkisim.</p>
      <p>3. The shin is not just too small/condensed -- as Bill said --  but also too symmetrical; moreover, compare your shin, ayin, tzadi to Hadasa.</p>
