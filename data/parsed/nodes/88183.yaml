    html: |-
      <p>FYI, I'm not an expert in Hebrew, but I have done a lot<br>
      of multi-script type design. I agree that the Hebrew is<br>
      too tight. But I'm happy to see you're paying attention<br>
      to the relationship between the two scripts in terms of<br>
      vertical proportions. However the Latin caps are too tall<br>
      compared to the ascenders; and the ascenders are too short<br>
      compared to the descenders. So I would make the ascenders<br>
      at least as tall as the caps. Also, again as you suspect, the<br>
      Hebrew has more contrast than the Latin; I would try to<br>
      make the thins less thin. Lastly, the "w" is too narrow.</p>
      <p>hhp</p>
