    <p>I've been working on a Hebrew companion for Neuton...</p>
    <p><img src="http://21326.info/work/test-8dec2011.png"></p>
    <p>Any critique would be helpful... Looking at it now, I'm think the Hebrew might be a little too condensed, or at the very least my spacing is too tight. (Which is at least part of it.) Some of the thins also might be too thin also. I'll have to work on that. Anything else appreciated!</p>
