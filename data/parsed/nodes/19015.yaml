    html: <p>I don’t know why you mentioned the “.afm” file unless it was to note that the font designer created kerning pairs; neither Word nor Mac OS X uses “.afm” files.  If you insist on using fonts only in the old LWFN/Suitcase paired format, the kerning information would have to be in the suitcase’s ‘FOND’ resource.</p>
