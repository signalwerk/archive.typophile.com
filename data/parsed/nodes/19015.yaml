  html: |-
    <p>A new imac core duo, a copy of MS Office for Mac 2004, and a freshly-bought mac (postscript-only) version of Underware’s Dolly.</p>
    <p>I fire up Word 2004 for Mac, get all the updates, and proceed to type a document with Dolly. Unfortunately, it seems that Word doesn’t want to kern Dolly Roman, kerning is basically non-existent, at least for this font. The italic flavour kerns a little better, but that’s of no real comfort. Is it the font or this version of Office for Mac that is the culprit? “To”, “WA”, “Wa” for example, are all left unkerned. Yet, Dolly’s .afm files have full kerning info in them. </p>
    <p>What gives? Anyone else experience this with MS Office(Word)2004?</p>
    <p>(by the way, my earlier complaint about HP printing quality problems has been remedied, more or less.)</p>
