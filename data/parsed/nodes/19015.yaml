    html: "<p>I did turn kerning on. I highlighted the whole document (or even just parts of it), and then: Format —&gt; Font —-&gt; Character Spacing —&gt; Kerning for fonts __ points (in this case 12) and above, checkmarked. I turned it off an on repeatedly, and nothing.</p>"
