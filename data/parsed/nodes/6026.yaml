    html: "<p>&gt; explain the \"why\" aspect. <br> <br>Chris, that's what I've been working on (essentially using Juan Pablo's method, actually) for 6 years now. <br> <br>The \"point of immersion\"? It depends. :-/ <br>But the important thing is: it exists. That's enough reason for a type designer aiming for the top to worry about it. <br> <br>-- <br> <br>&gt; In general I analyze the Dutch types <br> <br>Except for the notable exception of Unger, these tend to be too chirographic to really push the limits of readability. Notan is the key, and the pen is anti-notan. <br> <br>-- <br> <br>Tom, legibility/readability studies shouldn't try to prove that any single font is \"the best\" - that would be ludicrous. But what they can do -of you listen carefully- is tell you what can be better, in what contexts. <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; explain the \"why\" aspect. <br> <br>Chris, that's what I've been working on (essentially using Juan Pablo's method, actually) for 6 years now. <br> <br>The \"point of immersion\"? It depends. :-/ <br>But the important thing is: it exists. That's enough reason for a type designer aiming for the top to worry about it. <br> <br>-- <br> <br>&gt; In general I analyze the Dutch types <br> <br>Except for the notable exception of Unger, these tend to be too chirographic to really push the limits of readability. Notan is the key, and the pen is anti-notan. <br> <br>-- <br> <br>Tom, legibility/readability studies shouldn't try to prove that any single font is \"the best\" - that would be ludicrous. But what they can do -of you listen carefully- is tell you what can be better, in what contexts. <br> <br>hhp <br></p>"
