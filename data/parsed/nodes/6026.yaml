    html: <p>When I invent some hypothesis of legibility, generally it is based on the analyses that I make to other typographies, and not in books. In books one i can find contradictory and not very believable theories. I prefer to analyze the phenomenons for myself, and later I investigate to see who is supporting my theories. But I prefer speak it with other colleagues typographers instead of professing theory of books. <br> <br>Constantly I am making operation tests and graphic analysis that can supplement my proposals.   <br>In general I analyze the Dutch types, especially fonts of Gerard Unger, DTL, Ensched</p>
