    html: <p>The problem with legibility studies is that there are too many variables to draw definitive conclusions. <br> <br>Especially problematic are the cultural factors. To take an extreme example, suppose you have grown up in the West and are ignorant of Asian languages. Say you want to learn Korean. The fonts that will work best for you are not likely to be the same ones that work best for an adept in the eastern literati tradition. <br> <br>Next, how do you scientifically measure the artfulness of the designer? If you are like me, there are some typefaces that you have gotten to know and can use pretty well, whereas others are like foreign tongues. To truly compare the legibility of typefaces you would need a sort of </p>
