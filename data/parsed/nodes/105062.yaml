    html: |-
      <p>Can't find a match and really doubt there's one actually. Gatorade owns Propel and use <a class="freelinking external" href="http://answers.yahoo.com/question/index?qid=20081101164312AABRpUF" rel="nofollow">custom-made fonts</a>. As the 2 logos look blatantly connected, we could easily imagine Propel is also a custom job. Previous logo version could give some track though.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/PropelZeroLogo_5970.png"></div><br>
      For what it's worth, if I had to reproduce it, I'd probably start with one among <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/helvetica" rel="nofollow">Helvetica</a> (Black Condensed or any of the Compressed)/<a class="freelinking external" href="http://www.myfonts.com/search/inserat" rel="nofollow">Inserat</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/impact" rel="nofollow">Impact</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/mti/smart-sans" rel="nofollow">Smart Sans</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/ef-typeshop/plakette" rel="nofollow">Plakette</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/urw/folio" rel="nofollow">Folio</a> Condensed Bold/<a class="freelinking external" href="http://www.fonts.com/font/monotype-imaging/loft" rel="nofollow">Loft</a>, shear it and rework all counters "à-la-<a class="freelinking external" href="http://typophile.com/node/102242" rel="nofollow">Inverserif</a>".<br>
      And if you only need this logo as vector, it is freely available to download <a class="freelinking external" href="http://www.brandsoftheworld.com/logo/propel-fitness-water" rel="nofollow">here</a>.<p></p>
