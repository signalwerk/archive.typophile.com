  html: <p>Hi guys, <br> <br>I have a font which is condensed and want to create an extended out of it. Is there anyone that could help me out with a solid way on how to do this best? <br>I think just scaling it doesn't do it, because the verticals become wider, making the font heavier. Any other suggestions besides redrawing the font by hand ;-) <br> <br>Thanks, <br></p>
