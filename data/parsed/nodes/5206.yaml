    html: <p>&gt;I think just scaling it doesn't do it, because the  <br>&gt;verticals become wider, <br> <br>To maintain a similar "color" to your condensed version you'd have to end up with wider vertical strokes. I don't think there's an easy way to do this. <br> <br>What you could try it scaling it, then even out the differences between the horizonatal and vertical strokes by hand - ie the horizontals would become heavier, and the verticals lighter. <br> <br>If you want to try some scaling effect, for characters with simple counters ("O") that might mean scaling horizontally the whole character, then scaling the counter "down" vertically and "up" horizontally (ie 95% * 105%).</p>
