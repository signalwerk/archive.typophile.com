    html: <p>&gt; try combining the scaling with a lopsided (horizontal-only)  <br>&gt; "automatic" weight reduction of the stems  <br> <br>I have tried this a few times and find that there is still so much cleanup afterward that it is of little use.  The best use of this technique for me was to put the resulting stretched glyph on the mask layer and use it as a rough guide.  Then copy pieces of your orginal font (mostly the joins) and position them over the joins on the stretched mask.  You then have to draw new connecting lines or curves.  I realize this is no big time saver but designing type isn't really ever a fast-food kind of experience.  My advice is to just roll up your sleeves and do the work.  What you gain in experience from doing it will only help you later.  In type design, it is about the work so just enjoy it.</p>
