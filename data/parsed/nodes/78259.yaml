    html: <p>It’s not only the lettering. It is the <a href="https://web.archive.org/web/20150123152809/http://www.freiepresse.de/DYNIMG/66/54/3726654_W460.jpg" rel="nofollow">“mity” plastering</a> with the shadows of bars or the smut of old flown tears, the cold smoke of non and never known court-martialled shots, the menu boxes, the small dark windows, the patinated brass. It is a Warsteiner restaurant. It is the typical German kind of glumness (even if this Kustunienhof is not in Germany), “stuffyness” and fatuity. It is the place, where grey Eau de Cologned ramblers revive – with single wrapped towelettes in fear-sweated faux leathern driver licence pouches.</p>
