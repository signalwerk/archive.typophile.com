      <p>Last year I had to get some stick-on letters for a licence number to go on a boat.<br>
      Went to the Canadian Tire (hardware) store, but they didn't have all the letters I need in the size required.<br>
      I was tempted to improvise.<br>
      So I can imagine Freddy and Fritz wanted to get the job done, but the sign store was out of "a"s (hey, it's a popular letter) — no problemo! — being the creative chaps they are, their design solution was to get the available '"u"s and rotate them, and to disguise this shortcoming, they f*cked up the "s" and "e", and the positioning of the word (non-centred), to complete the drunk punk aesthetic.</p>
