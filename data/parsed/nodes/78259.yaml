    html: <p>I think both of these were caused by untrained installers--something like Fritz and Freddie work at the mall as floor sweepers, Sam Smashed, the sign guy didn't make it to work because he was, well, smashed. Sam's boss was in a pickle so he asked Fritz and Freddie if they wanted to make a few extra Pounds or Euros and they said sure! Sam's boss drew a nice straight line on the wall and told them "the bottom of the letter sits on the line." Fritz did the German, and by god, he followed directions on EVERY letter. Freddie did the English but Freddie was actually Sam Smashed's nephew so he got, well, smashed, too. He thought the difference between uppercase and lower case was a question of how high the beer cases were stacked.  The rest is history ;-)</p>
