    html: <p>Did you investigate using more of a blueprint look? As for the type while well set, its boring. You also don't have anything unified. The top of the house looks like clip art, the Initials don't mean anything. Look at a typeface like Eaglefeather based on Frank Lloyd Wrights handwriting. Make the house graphic more abstract and make the contact info part of your schematic. A large part of custom home design is on interior elements (windows, beamed ceilings etc) maybe that imagery would help you. Good start, keep working.</p>
