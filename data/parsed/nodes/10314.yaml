    html: <p>In your latest version loose the halftone in the dream balloon it will cause problems in smaller sizes (fill in). My problem with your house is it is a specific style of house. If I'm right your client will design any "Dream" house. That said look into making the image in the balloon abstract, like a piece of a blue print. You don't need a lot of detail to get the point across. I would loose the date and everything but the name. Those are elements that can be put in different places based on the layout. You could put the address phone etc at the bottom of a letterhead but you will always want the name and the illustration to stay together. Keep going!</p>
