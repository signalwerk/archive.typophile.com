    <p>Pincoya Black Pro is the new typeface of Latinotype designed by <a class="freelinking external" href="http://new.myfonts.com/person/Daniel_Hernandez/" rel="nofollow">Daniel Hernández</a><br>
    Is a font based on the lettering of a poster from the Spanish Civil War and complemented with graphics developed in the Chilean Popular Unity during the seventies.Pincoya has a lot of alternate characters in Opentype format that provide multiple options when composing a text. It is an ideal source for high impact sentences for logotypes, magazine layouts, poster designs, etc.<br>
    ___________________<br>
