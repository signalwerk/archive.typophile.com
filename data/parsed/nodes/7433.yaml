    votes: null
    html: "<p>I must agree with darrel. I don't think immediacy of reading a \"C\" is very significant. <br> <br>What I find so powerful in the second version of the mark (the first orange version) is the fundamental meaning of trucking company you have managed to capture so simply and powerfully. The line leading to the inner counter space suggests the idea or path of loading things into the truck, and then the space inside--while roomy enough--is secured by solid walls. Very much like the dynamics the Chase logo is playing with. Inviting but also secure.  <br> <br>Then you create this powerful sense of motion allowing a line of space to cut through the truck, emphasizing the urgency/importance of delivering with speed. You really nailed the essence of trucking: security + speed. It's stunning really. <br> <br>The newer versions of the truck not only loses the sense of security within the hold, but the horizontal rush dissolves with the upward curve of the line. <br> <br>I would try going back to the first orange C truck and replacing the wheel line with the word \"Calhoun.\" You will retain the horizontal line in the space between the mark and the letterforms, and it could ultimately resolve the relation between the mark and the logotype.  This also reduces the elements you are asking people to interact with. <br> <br>I understand shying away from the subject as logo, and I acknowledge the worry of truck image on truck redundancy, but I think your symbol moves far enough from the world of illustration to not feel awkward (especially without wheels).</p>"
    html_clean: "<p>I must agree with darrel. I don't think immediacy of reading a \"C\" is very significant. <br> <br>What I find so powerful in the second version of the mark (the first orange version) is the fundamental meaning of trucking company you have managed to capture so simply and powerfully. The line leading to the inner counter space suggests the idea or path of loading things into the truck, and then the space inside--while roomy enough--is secured by solid walls. Very much like the dynamics the Chase logo is playing with. Inviting but also secure.  <br> <br>Then you create this powerful sense of motion allowing a line of space to cut through the truck, emphasizing the urgency/importance of delivering with speed. You really nailed the essence of trucking: security + speed. It's stunning really. <br> <br>The newer versions of the truck not only loses the sense of security within the hold, but the horizontal rush dissolves with the upward curve of the line. <br> <br>I would try going back to the first orange C truck and replacing the wheel line with the word \"Calhoun.\" You will retain the horizontal line in the space between the mark and the letterforms, and it could ultimately resolve the relation between the mark and the logotype.  This also reduces the elements you are asking people to interact with. <br> <br>I understand shying away from the subject as logo, and I acknowledge the worry of truck image on truck redundancy, but I think your symbol moves far enough from the world of illustration to not feel awkward (especially without wheels).</p>"
