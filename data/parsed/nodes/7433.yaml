    html: <p>i like the truck icon, however, as said, the hole in the truck could represent something negative.  the style seems to flow nicely with the truck industry, and i think you should stay somewhere in that region.  if you stray to far design-wise, people won't like it and will not associate it with trucking. <br> <br>i think the rigid truck icon is a good direction--a hand-drawn approach would not be strong enough. <br> <br>the gaps in the first few letters of CALHOUN bother me... i mean, i wish there were gaps in the last 4 letters as well.  it's so tight around the HOUN.  also, i think the letters should be altered to have a more unique quality.  and i would try them non-oblique.</p>
