    html: <p>Thanks everyone for their advice. I should have said more about what I am going for. The big thing with this logo was I wanted the icon to be strong, reliable, but fast. I realize the icon was rigid, so I have made modifications. I think it is greatly improved! <br> <br><img src="http://www.typophile.com/forums/messages/29/52598.gif" alt=""> <br> <br> <br>Something bothered me about the icon before I posted it Sunday. I didn't have the same confident feeling I normaly do about my logos, but I have to stay with the general idea of the c in the truck. When I initially sat down with the client I started sketching and playing while I waited for him to arrive. He saw the sketches and just loved the idea.  <br> <br><img src="http://www.typophile.com/forums/messages/29/52599.jpg" alt=""> <br> <br>Randy- they are large trucks. I also should have stated that in the beginning. On this icon I didn't want to get too specific on the truck since I don't want the logo to get too outdated. I didn't even want to use a truck in the beginning, but the client wanted that. My original idea was to use a bull as the icon. I don't like directly using the subject in the logo (usually). <br> <br><img src="http://www.typophile.com/forums/messages/29/52600.jpg" alt=""> <br><img src="http://www.typophile.com/forums/messages/29/52601.jpg" alt=""> <br> <br>Scott- I have tried to make it less rigid. Also, I presented them with more illustrative, softer sketches. He and his wife were more interested in the bulkier sharper idea. Below is one of the sketches I showed him. <br> <br><img src="http://www.typophile.com/forums/messages/29/52602.jpg" alt=""> <br> <br>I would love to have further criticism on my new version. Let me know if the negative space is still a problem. The space in the middle still bothers me, but not as much. I agree that it could be negative, but does the new logo help that?</p>
