    <p>Over at FontStruct I've recently completed the remaining two faces in the Becker family as used in the Becker Cascade/Traffic Pro in-car navigation units. They are: the Large typeface used on the media playback screens and the Regular typeface used on unselected menus or out of the way text.</p>
