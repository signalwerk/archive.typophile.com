      <p>Alright so I am a little unclear about what is appropriate...</p>
      <p>I have no intention in selling this typeface, rather it was a solution to a problem presented during the design process. Times New Roman is clunky so I made it not that or at least curbed it a bit. This is purely for the design of a book that maybe distributed commercially. Again I have no intentions in selling or distributing the font software, but merely to use what I created in an academic project, nonetheless I have sent monotype an email. </p>
      <p>Does anyone know how URW++ and their numerous derivatives are able to be sold commercially?</p>
      <p>Thanks,<br>
      David</p>
