    html: |-
      <p>First, you need to read the source license for the font to see if it allows modifications.</p>
      <p>Second, if it does allow modification, contact the original vendor and ask them for permission.</p>
      <p>Otherwise you are probably not legal, but that is just my opinion, not that of a lawyer.</p>
