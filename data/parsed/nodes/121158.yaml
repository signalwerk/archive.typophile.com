  html: |-
    <p>I am working on a book proposal that involves the use of a Completely modified version of Times New Roman to be more Appropriate for Display or at Larger Sizes. This is a commercial project with the potential for Wide Distribution so I want to as clear about the legality as possible. Otherwise, I (with a bit of shame) would not really worry about it, but agin this is not that...</p>
    <p>I Heavily modified the font, not just computationally through interpolation, but also in more nuanced and pre-meditated ways that literally alter the letter forms at a fundemental level i.e. serifs, bowls, shoulders, etc.</p>
    <p>I have attached sample of the original I used and then the altered version(at 3/4 complete).</p>
    <p>Original</p>
    <p><img src="/sites/default/files/old-images/TNR_4978.png"></p>
    <p>Display<br><img src="/sites/default/files/old-images/NTNR_3854.png"></p>
