    <p>At the flea market in Brighton I found some orphans in a basket. I bought the whole lot and am uploading a picture of some of them - mirrored for your convenience.</p>
    <p>Of course I want to see them in action. What technique should I use? I do not know a print shop that uses wood type and have no press of my own.</p>
    <p>Perhaps you can recommend a website?</p>
    <p>Thanks!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Woodtype_5917.jpg"></div><p></p>
