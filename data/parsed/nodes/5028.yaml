    html: '<p>I apologie for not providing any explanation. The ﬁle is rar compressed, and it can be uncompressed with Winrar, Winzip, WinAce, Total Commander (Alt+<span class="caps">F9</span>, this is ex Windows Commander thnxs to M$).  <br>Here are some links: <br><a href="http://www.rarlab.com" target="_blank">http://www.rarlab.com</a> <br><a href="http://www.winzip.com" target="_blank">http://www.winzip.com</a> <br><a href="http://www.winace.com" target="_blank">http://www.winace.com</a> <br><a href="http://www.ghisler.com" target="_blank">http://www.ghisler.com</a> (generally this is a musthave) <br><br>The app needs no <span class="caps">FL</span>, and I believe it will work ﬁne with any Python 2.x version, but be shure to have the adequate version of wxPython and PythonCard (must have both). Theese are free for use and download: <br><a href="http://www.wxpython.org/download.php#binaries" target="_blank">http://www.wxpython.org/download.php#binaries</a>  <br>(Windows, Mac <span class="caps">OS</span> X, Linux…) <br><a href="http://pythoncard.sourceforge.net/installation.html" target="_blank">http://pythoncard.sourceforge.net/installation.html</a> <br>(Windows, Mac <span class="caps">OS</span> X, Linux) <br><br>Finally there are two ﬁles in the rar archive: obid_06.py and obid_06.rsc.py. Double click on <b>obid_06.py</b> and after a few seconds (or minutes&nbsp;:^) the app will launch a window that imitates Brendans calculator, with lot of not-working-at-the-moment text-ﬁelds, radiobuttons and checkboxes, except the really important one — the big input text-ﬁeld. Actually i blindly copied his calculator, but didn’t ﬁgured all the meanings of his parameters (ie frequency), and added a codepage selection list wich is probably unnecessary. <br><br>Now grab some text and paste it in, click&nbsp;the </p>'
