    html: "<p>I apologie for not providing any explanation. The file is rar compressed, and it can be uncompressed with Winrar, Winzip, WinAce, Total Commander (Alt+F9, this is ex Windows Commander thnxs to M$).  <br>Here are some links: <br><a href=\"http://www.rarlab.com\" target=\"_blank\">http://www.rarlab.com</a> <br><a href=\"http://www.winzip.com\" target=\"_blank\">http://www.winzip.com</a> <br><a href=\"http://www.winace.com\" target=\"_blank\">http://www.winace.com</a> <br><a href=\"http://www.ghisler.com\" target=\"_blank\">http://www.ghisler.com</a> (generally this is a musthave) <br> <br>The app needs no FL, and I believe it will work fine with any Python 2.x version, but be shure to have the adequate version of wxPython and PythonCard (must have both). Theese are free for use and download: <br><a href=\"http://www.wxpython.org/download.php#binaries\" target=\"_blank\">http://www.wxpython.org/download.php#binaries</a>  <br>(Windows, Mac OS X, Linux...) <br><a href=\"http://pythoncard.sourceforge.net/installation.html\" target=\"_blank\">http://pythoncard.sourceforge.net/installation.html</a> <br>(Windows, Mac OS X, Linux) <br> <br>Finally there are two files in the rar archive: obid_06.py and obid_06.rsc.py. Double click on <b>obid_06.py</b> and after a few seconds (or minutes :^) the app will launch a window that imitates Brendans calculator, with lot of not-working-at-the-moment text-fields, radiobuttons and checkboxes, except the really important one - the big input text-field. Actually i blindly copied his calculator, but didn't figured all the meanings of his parameters (ie frequency), and added a codepage selection list wich is probably unnecessary. <br> <br>Now grab some text and paste it in, click the </p>"
    html_clean: "<p>I apologie for not providing any explanation. The file is rar compressed, and it can be uncompressed with Winrar, Winzip, WinAce, Total Commander (Alt+F9, this is ex Windows Commander thnxs to M$).  <br>Here are some links: <br><a href=\"http://www.rarlab.com\" target=\"_blank\">http://www.rarlab.com</a> <br><a href=\"http://www.winzip.com\" target=\"_blank\">http://www.winzip.com</a> <br><a href=\"http://www.winace.com\" target=\"_blank\">http://www.winace.com</a> <br><a href=\"http://www.ghisler.com\" target=\"_blank\">http://www.ghisler.com</a> (generally this is a musthave) <br> <br>The app needs no FL, and I believe it will work fine with any Python 2.x version, but be shure to have the adequate version of wxPython and PythonCard (must have both). Theese are free for use and download: <br><a href=\"http://www.wxpython.org/download.php#binaries\" target=\"_blank\">http://www.wxpython.org/download.php#binaries</a>  <br>(Windows, Mac OS X, Linux...) <br><a href=\"http://pythoncard.sourceforge.net/installation.html\" target=\"_blank\">http://pythoncard.sourceforge.net/installation.html</a> <br>(Windows, Mac OS X, Linux) <br> <br>Finally there are two files in the rar archive: obid_06.py and obid_06.rsc.py. Double click on <b>obid_06.py</b> and after a few seconds (or minutes :^) the app will launch a window that imitates Brendans calculator, with lot of not-working-at-the-moment text-fields, radiobuttons and checkboxes, except the really important one - the big input text-field. Actually i blindly copied his calculator, but didn't figured all the meanings of his parameters (ie frequency), and added a codepage selection list wich is probably unnecessary. <br> <br>Now grab some text and paste it in, click the </p>"
