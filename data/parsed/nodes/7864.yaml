    html: <p>When you open a font in FontLab, the metrical data is read in at the same time -- you can check this by opening the metrics/kerning window. <br> <br>But this *file* isn't a font -- its extension is .vfb. You only have a *font* when you *generate fonts*. So I suppose you could say that technically, the kerning data is put in a font when it is (re)generated, but the data is read into FontLab when the file is opened. <br> <br>A small point. <br> <br>Charles</p>
