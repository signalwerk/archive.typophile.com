  html: "<p>Hi, <br>when a font has a confusing menu/font/file name, a colleague of mine opens the pfb file with FontLab 4.6, changes the font infos and generate again the font, with new afm, inf, pfb and pfm files. <br> <br>Since kerning data are stored in afm and pfm files and FontLab opens only the pfb file, I fear this process can lead to a loss in the original kerning infos. <br> <br>My colleague says FontLab automatically search for metric files in the same folder where the pfb files are: so when he generate the font FontLab use the original metric files to create the new afm and pfm files.  <br> <br>What do you think about it?</p>"
  html_clean: "<p>Hi, <br>when a font has a confusing menu/font/file name, a colleague of mine opens the pfb file with FontLab 4.6, changes the font infos and generate again the font, with new afm, inf, pfb and pfm files. <br> <br>Since kerning data are stored in afm and pfm files and FontLab opens only the pfb file, I fear this process can lead to a loss in the original kerning infos. <br> <br>My colleague says FontLab automatically search for metric files in the same folder where the pfb files are: so when he generate the font FontLab use the original metric files to create the new afm and pfm files.  <br> <br>What do you think about it?</p>"
