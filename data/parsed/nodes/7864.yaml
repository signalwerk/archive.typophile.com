    html: <p>&gt;&gt;Only if none of these files are found in the same folder, FontLab will drop the kerning. &gt;&gt; <br> <br>True. However, you can always manually read in a .afm file (dunno about mac formats). A good check would be to open the metrics/kerning window  to make sure the kerning data is there. If the kerning data isn't there, find the .afm file and manually import it. <br> <br>FWIW</p>
