    html: <p>Hi John <br>So my colleague is right? <br>Can you tell me when FontLab acquire the kerning infos from the afm/pfm files placed in the same directory as the pfb file? When the user opens the file or when he (re)generate the font? <br> <br>Many thanks</p>
