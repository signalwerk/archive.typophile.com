    html: "<p>Alberto,  <br> <br>you don't need to worry. For Win Type 1 fonts, if you open a .pfb file, FontLab automatically looks for a corresponding .afm file in the same folder, and if not found, for a .pfm file. Only if none of these files are found in the same folder, FontLab will drop the kerning.  <br> <br>BTW, for Mac Type 1 fonts, kerning will get imported if you open the font suitcase, but will be dropped if you directly open the LWFN printer font file -- so you need to be careful which file you open.  <br> <br>Your trick is fine, but remember that some font names are written in the .afm/.inf and .pfm files, e.g. MS Menu Name, or Family Name. So if you modify font naming and generate a .pfb file, but you use the old .afm or .pfm, your font names may be out of sync. Actually, Microsoft Windows really reads the font names from the .pfm file, NOT from the .pfb file, when accessing the font. So it is always a good idea to re-make all Type 1 files: .pfb, .afm, .inf and .pfm.  <br> <br>Regards, <br>Adam Twadoch <br>Fontlab Ltd.</p>"
    html_clean: "<p>Alberto,  <br> <br>you don't need to worry. For Win Type 1 fonts, if you open a .pfb file, FontLab automatically looks for a corresponding .afm file in the same folder, and if not found, for a .pfm file. Only if none of these files are found in the same folder, FontLab will drop the kerning.  <br> <br>BTW, for Mac Type 1 fonts, kerning will get imported if you open the font suitcase, but will be dropped if you directly open the LWFN printer font file -- so you need to be careful which file you open.  <br> <br>Your trick is fine, but remember that some font names are written in the .afm/.inf and .pfm files, e.g. MS Menu Name, or Family Name. So if you modify font naming and generate a .pfb file, but you use the old .afm or .pfm, your font names may be out of sync. Actually, Microsoft Windows really reads the font names from the .pfm file, NOT from the .pfb file, when accessing the font. So it is always a good idea to re-make all Type 1 files: .pfb, .afm, .inf and .pfm.  <br> <br>Regards, <br>Adam Twadoch <br>Fontlab Ltd.</p>"
