    <p>I am getting this error when i try to compile a simple opentype subs feature. i copied and pasted the code from another font i made and it works fine there. </p>
    <p> cmap{plat=3,script=1,lang=0}: multiple glyphs macron overscore mapped to code </p>
    <p>double checked the sub characters they all have the same naming conventions. </p>
    <p>any ideas? </p>
    <p>thanks you in advance, </p>
    <p>-dan</p>
