  html: |-
    <p>Dear typophiles,</p>
    <p>I would like to ask for some suggestions about font management tools for Mac OS X. It might sound rude for someone but I find Suitcase slow (not to mention its constant intension to freeze), Fontbook quite useless (If I deactivate the font I would like to have it deactivated, right?). I've also heard that Adobe canceled ATM's further development. </p>
    <p>Do you have any other suggestions?</p>
    <p>Thanks,</p>
    <p>Matjaz</p>
    <p>BTW<br>
    Has anyone experienced Linotype FontExplorer X already?</p>
