    <p>Hey, </p>
    <p>In terms of older novels, small paperbacks like bantam house books or something along those lines, does anyone know what font they use? I know very little about all this, so it may well simply be Times New Roman and I just can’t tell.</p>
    <p>Also, how does everyone feel about papyrus? I feel like it’s the most horrendous thing available, but I see it everywhere, even on professionally designed things like major motion pictures and packaging. Am I wrong, or are there a lot of bad designers out there?</p>
    <p>Thanks.</p>
