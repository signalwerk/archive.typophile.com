      <p>You’re not wrong.</p>
      <p>And my type-ID-fu isn’t strong enough to identify text faces outside of the big guns, most of the time. But out of 4 older novels from the 40s to 70s lying nearby (2 Bantam, 1 Ballantine and 1 Lancer) 3 appear to be Baskerville and one (the Ballantine) is definitely Bembo.</p>
