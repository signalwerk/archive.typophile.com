    html: |-
      <p>There have been other posts about this company who makes these hand-drawn rubber stamps. My opinion is that this work is not a font, but that these stamps are made from a hand-drawn original. I think this is at least very similar to the script fonts sold by Emily Lime foundry, which are drawn by Emily Connors. </p>
      <p>You can find her work at MyFonts.com. Carolyna is one that shows many similarities, I think.</p>
      <p>- Mike Yanega</p>
