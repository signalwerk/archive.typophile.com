      <p>Brook, I assume you realize that an x-height can be <em>too</em> big. So if you really want to save space with no regard to readability you might as well just use all-caps!</p>
      <p>However, trying to satisfy your criteria, I would recommend this:<br>
      <a href="https://www.fontfont.com/fonts/quadraat-headliner" title="https://www.fontfont.com/fonts/quadraat-headliner">https://www.fontfont.com/fonts/quadraat-headliner</a> *<br>
      If that's too condensed, maybe this old thing from 1959:<br>
      <a href="http://www.myfonts.com/fonts/wordshape/adora/" title="http://www.myfonts.com/fonts/wordshape/adora/">http://www.myfonts.com/fonts/wordshape/adora/</a></p>
      <p>* Although you'll have to track it looser for small setting.</p>
      <p>Also consider Bell Centennial* and H&amp;FJ's elusive Retina.</p>
      <p>* <a href="http://www.myfonts.com/fonts/bitstream/bell-centennial/" title="http://www.myfonts.com/fonts/bitstream/bell-centennial/">http://www.myfonts.com/fonts/bitstream/bell-centennial/</a></p>
      <p>hhp</p>
