  html: <p>We are looking for sans sefic faces that are really spacially economical with as large an x-height as possible for setting the nutritional info on some food packaging we are designing. The packaging is subject to some very tight guidelines and we are looking for a face that has a large x-height, is spacially economical but is not a condensed face. Any suggestions are very welcome.</p>
