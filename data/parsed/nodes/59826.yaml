    <p>hello,</p>
    <p>is there a posibility to make different glyphs for the same character in the same word if a character repeats? for example if there's a word - Weezer. when first e comes, then second e goes from another glyph. how to make it? and if there's a word WIDOW - how to make the second w in the word to be different?</p>
