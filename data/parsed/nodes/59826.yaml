      <p>Your first example is the most simple one, so here it goes:</p>
      <p>feature calt {<br>
        sub e e' by e.calt;<br>
      } calt;</p>
      <p>This swithces the second e to e.calt whenever it comes after e.</p>
      <p>That other one is a little bit more complicated, and cant write it out directly now... sorry.</p>
