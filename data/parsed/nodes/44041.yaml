    <p>Here's your chance to stretch your type muscles on a weekly basis. We are posting a day late, but you still have one week to create and submit your entry. Anyone may submit a design response to the challenge. You may enter as often as you wish. Post anytime. Critiques and comments are welcome throughout the game, from participants and spectators alike. Smack talk is encouraged.</p>
    <p>As with any street battle, there is no panel of judges and no prize — only the ability to call yourself the best on the block.</p>
    <p>Link directly to this thread: <a href="http://www.typophile.com/battle21" title="http://www.typophile.com/battle21">http://www.typophile.com/battle21</a></p>
    <p>// REQUIREMENTS</p>
    <p>- Image size: 550 width x 400 height. 72 dpi<br>
    - Color: Black and white only<br>
    - Format: Please save your graphics as PNG</p>
    <p> <strong>// THIS WEEK'S CHALLENGE:<br>
    // Utilizing the free, online font-building tool, <a href="http://fontstruct.fontshop.com/" rel="nofollow">FontStruct</a>, complete at a minimum, a lower case typeface that will look great in a paragraph of text. Post your results in the form of a PNG, and include a link to your FontStruction.</strong></p>
    <p><a href="http://www.fontstruct.com" title="http://www.fontstruct.com">http://www.fontstruct.com</a></p>
    <p>Winner take all, no holds barred. May be the best designer win.</p>
