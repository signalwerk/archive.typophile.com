      <p>"Would you have made it better if it were not free?" seems backwards. I'm also slightly skeptical about to which extent there is a correlation between quality and price. It's certainly an implied correlation, but you have many deviations in practice. Hrant, I think finck was right to correct you when you said the main reason it doesn't render well is because it's free. I suppose in most cases one would ask money for a font which has been properly hinted and optimized, but this isn't always the case and it doesn't make your statement inherently true.</p>
      <p>I also wouldn't necessarily say a font is poorly made when it doesn't render well on the web. Many fonts are simply not optimized for the web. People love Helvetica, but if there is one font which renders horribly on the web in a Windows environment...</p>
