      <p><cite>Charles, I'm also not following your logic.</cite></p>
      <p><cite>The main reason it doesn't render well is that it's free.</cite></p>
      <p>Basic principles of any system of logic. (1) It must be sound. It's sound if, and only if, everything provable in the system is also true. (2) It must be complete. A system is complete if, and only if, everything that is true is provable in the system.</p>
      <p>So, either way, counterexamples have weight. I guess the Wikipedia account of Paul Farmer doesn't give any hint of how much he's given without any monetary compensation, but the expertise is surely chronicled. <cite>Mountains Beyond Mountains</cite> is worth reading, not only for how much Farmer's given without financial motivation, but how, amongst other things, he changed WHO doctrine on treating resistant TB. And AIDS. The Wikipedia entry on the book, perhaps paradoxically, gives a better hint about the man: <a href="http://en.wikipedia.org/wiki/Mountains_Beyond_Mountains">http://en.wikipedia.org/wiki/Mountains_Beyond_Mountains</a></p>
      <p>If Dr. Farmer has a net worth of only $10,000 after 40 years of work, I wouldn't be surprised.</p>
      <p>Well, maybe Hrant's <cite>logic</cite> is that the only successful motivation for good work amongst <strong>font designers</strong> is money. Perhaps, in his system, other people can  have acceptable non-financial motivations, and be successful. That didn't come through, though.</p>
      <p>Even if that is the system: Now, Hrant, when informed that there was soon to be a new book by Rich Hendel, with a chapter by Kent Lew, remarked that he would not buy it. If he read it, he'd check it out from the library. So the author -- Hendel, in this case -- isn't going to get any payment, even if Hrant reads it. No "advances against royalties" for most academic work, you know. </p>
      <p>QED, Hendel &amp; Lew have done bad work, so judged by the monetary decision, before reading. Or perhaps because Hendel is a book rather than font designer, he's allowed the exception. Poor Kent.</p>
      <p>It probably will come as no surprise that I admire Farmer more than Papazian. But I also believe there is good work done with open source fonts, and that the motivations for such are not always misplaced.</p>
