      <p>This is a great concept! Loved seeing your process and the evolution of this design!</p>
      <p>I agree with ill sans about the wavy beginning &amp; end strokes as well as the "t" being hard to read. I also agree with penn&amp;ink, you need to do a version without the buttons and needle. The buttons make the letter forms seem geometric...and they shouldn't be in my opinion, they should look more 'natural' like it was made with real thread, exactly like you did. Maybe have the needle at the end of the last "p". The colorful buttons are playful and definitely say pop art but not high end fashion. Maybe finding a middle ground between playful and serious will help you balance out the look and feel your going for and will simplify the logos readability and practicality in regards to production for labels and such.</p>
      <p>Hope to see the next steps. Great work!</p>
