    <p>This is the logo I'm working on for my final project this semester, and it's for a fashion designer friend of mine as well.<br>
    Proto-Pop Art originally preceded Pop Art back in the 1950s, so my friend chose that as the name since his style isn't classical, it's a bit experimental and consists on using many objects from popular culture in his dresses and creations.</p>
    <p>I first began with some sketches, and came out with the idea of using common sewing materials to create the logo since that's basically what Proto-Pop Art was about. Below is one of the final sketches:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Sketch_6236.jpg"></div><p></p>
    <p>After the sketches, I tried tracing it digitally but was very unhappy with the results, even after experimenting with one letter for the logo or the whole word, like:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/protopop1213_5593.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/charbelsaaaaaad_6707.jpg"></div> <div class="imageWrap"><img src="http://typophile.com/files/charbelsaaaaaaaaaaaad_5576.jpg"></div><p></p>
    <p>then I created using wool and glue, the word "protopop", since I felt it would be best to trace over something that's done manually:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/wool_4930.jpg"></div><p></p>
    <p>I scanned it and traced it digitally, and was able to get to the final logo here:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/jqehfjnsjnfjsndada_6015.jpg"></div><p></p>
    <p>But I still find it kinda off and unbalanced, and a bit too complex for a logo, which is why I created a second option.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/omgomgomgomg_3599.jpg"></div><p></p>
    <p>Finally, what I need is informative critique by other people on how I can fix the first final logo, or maybe join the two or just any constructive feedback, because I already like the concept I begun with.</p>
