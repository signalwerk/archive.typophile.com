    html: |-
      <p>I love the 2nd to last logo as well: great colours, cute buttons, playful concept &amp; an overall good execution.</p>
      <p>Just a few remarks:</p>
      <p>- I'm not sure about the wavy beginning &amp; end strokes, I'd try keeping those curvy as the ascenders (just smaller &amp; open)</p>
      <p>- The t is kind of lost on me as the crossbar doesn't really come across well. You might want to try making the space between them equal to the thickness of the needle and perhaps making them slightly thicker (they seem a tad bit thinner than the thread &amp; needle outlines) so that it'll look more like a whole alltogether.</p>
      <p>- This could raise problems for labels depending on what kind your friend is planning to use. You could try placing pop underneath connecting the thread by the o &amp; last p so that the end stroke on the first p of pop can be the same as the proto-p.</p>
      <p>As for Aluminum's concerns about it not being very high fashion, I have to agree, but with a name like proto-pop I'm guessing the emphasis will be on fun, colourfull fashion...<br>
      Great job so far &amp; thanks for posting the different steps in your progress. It's always nice to see how something evolves from sketch to finished product (assuming we'll get to see that too later) ;-)</p>
    html_clean: |-
