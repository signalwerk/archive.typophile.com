      <p>Hi Ken<br>
      I get my paper samples directly from the paper manufacturer. Usually printers use<br>
      their preferred stocks (bulk orders, good deals). But if you are after a certain stock<br>
      it shouldn't be a problem to get the printer to order it in. It will most likely increase<br>
      the cost for the paper, depending on the quantity needed. If the printer can't order<br>
      it in, they will usually show you some similar paper stocks which will match your<br>
      sample as close as possible.</p>
      <p>Of course this doesn't apply for any online printing facilities (vistaprint etc.).</p>
      <p>I think best is if you meet with your printer and discuss your project, this will also<br>
      help with any specs you have to follow, colour profiles etc.</p>
      <p>Hope this helps.</p>
