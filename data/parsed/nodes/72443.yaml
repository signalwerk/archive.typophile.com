    <p>I recently graduated from school, but also have a client.</p>
    <p>Client wants printed stationary set and other materials.  We want really nice recycled stock, will be professionally printed.</p>
    <p>I'm looking to get paper samples and collecting those, but kinda confused.</p>
    <p>I think this is a stupid question, but if I find paper thats a good fit, will I tell my printer?  Can I use most printers and specify the stock even if they don't usually use it?  Whats the best way to find paper samples or things like envelopes?</p>
    <p>Answers would be very appreciated.</p>
