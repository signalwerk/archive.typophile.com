      <p>Printers can print on pretty much any paper (depending on what kind of press they're using), and whoever their paper supplier is can usually get almost anything you want (or a very close equivalent). If they don;t carry the brand you want, you can get it yourself, and the printer will print on it.</p>
      <p>Your profile says you're in NYC. There's got to be a paper supplier like Xpedx there that has a showroom with samples.</p>
