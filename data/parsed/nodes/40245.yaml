    html: |-
      <p>Marosi dude, for a graphic desing firm your new logo lacks the following:<br>
      * a clever design idea<br>
      * a cleverly-designed, contemporary typeface<br>
      * the current zeitgeist<br>
      * coolness<br>
      * subtlety</p>
      <p>All of these qualities are essential to the logo of a graphic design firm to show potential customers the brilliant and appealing nature of what you are going to do for them. The red squiggle looks just like the meaningless scribble used in the logos of sign-making companies employing tradesmen as ersatz designers. If you must include a hand-scrawled element, abstract is okay but make it an <em>artful</em> abstract squiggle suggesting something specific.</p>
      <p>The whole thing might work better if the type is colored and the abstract part in black.</p>
      <p>j a m e s</p>
