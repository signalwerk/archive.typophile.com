  html: <p>Hi, <br> <br>Anybody know where I could find a full character set for Victorian Stencil? <br> <br><img src="http://www.typophile.com/forums/messages/83/67094.gif" alt=""> <br> <br>This sample was found from the Solotype Catalog (page 116).  And unfortunately I don't have access to the full character set.  I know of a freeware font named Maverick (by Jeff Levine) this is based on Victorian Stencil, and a grunged up version named Clint (by Nerfect) that is obviously based on Maverick.  So anybody know where I could find out more information about this typeface.  Maybe in a book somewhere (or maybe even in some other Solotype catalog), or if someone happens to have any scans that would be really great.  Thanks!</p>
  html_clean: <p>Hi, <br> <br>Anybody know where I could find a full character set for Victorian Stencil? <br> <br><img src="http://www.typophile.com/forums/messages/83/67094.gif" alt=""> <br> <br>This sample was found from the Solotype Catalog (page 116).  And unfortunately I don't have access to the full character set.  I know of a freeware font named Maverick (by Jeff Levine) this is based on Victorian Stencil, and a grunged up version named Clint (by Nerfect) that is obviously based on Maverick.  So anybody know where I could find out more information about this typeface.  Maybe in a book somewhere (or maybe even in some other Solotype catalog), or if someone happens to have any scans that would be really great.  Thanks!</p>
