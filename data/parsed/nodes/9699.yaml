    html: <p>I've got the Solotype <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0486233022/qid=1110504816/sr=8-4/ref=sr_8_xs_ap_i4_xgl14/102-3821586-5648153?v=glance&amp;s=books&amp;n=507846">"100 Victorian Display Alphabets"</a> book, but Victorian Stencil is not there. It does have plenty of similar Tuscan-style alphabets, and so might be worth picking up for inspiration. <br> <br>Do you know if the Maverick font was based on a more complete specimen? I understand you want to avoid copying it too closely, but perhaps it could still be useful as a reference.</p>
