    html: <p>I've not been precisely informed of what the budget is.  I have been sent on a fact finding mission by my superior. <br> <br>Anyway, in this office we do a quarterly alumni magazine, sports publications (media guides), mailings for fundraising initiatives, president's report, advertising, recruitment, etc.  We design all the propaganda that you can think of that might come from a University. <br> <br>It seems that some of my predecessors have not been good stewards of the assets here.  It is difficult to tell what we legitimately own and what has been provided with outsourced jobs or by students needing a specific something-or-other etc. <br> <br>The fonts that we do own are old and on 3.5" floppies (which no one in our dept can access anymore).  So, to legitimize our collection and get things back in order, we'd like to more or less start fresh with a nice, general and adaptable collection. <br> <br>thanks <br> <br>-j</p>
    html_clean: <p>I've not been precisely informed of what the budget is.  I have been sent on a fact finding mission by my superior. <br> <br>Anyway, in this office we do a quarterly alumni magazine, sports publications (media guides), mailings for fundraising initiatives, president's report, advertising, recruitment, etc.  We design all the propaganda that you can think of that might come from a University. <br> <br>It seems that some of my predecessors have not been good stewards of the assets here.  It is difficult to tell what we legitimately own and what has been provided with outsourced jobs or by students needing a specific something-or-other etc. <br> <br>The fonts that we do own are old and on 3.5" floppies (which no one in our dept can access anymore).  So, to legitimize our collection and get things back in order, we'd like to more or less start fresh with a nice, general and adaptable collection. <br> <br>thanks <br> <br>-j</p>
