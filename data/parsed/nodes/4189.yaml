  html: <p>I'm a graphic artist for the publications department at a small university.  I've been here just over a year.  <br> <br>The font situation here is a hodge-podge of image club fonts from eons ago and whatever has acumulated over the years.  We've identified fonts as a priority for this fiscal year and we're looking for a good bundle that would lend itself to broad applications in order to update our fonts and make our collection more stable. <br> <br>Just like everybody out there, we need to maximize cost to benefit ratio (in other words, no money to waste). <br> <br>No doubt, this question has been asked before.  Could you please offer advice or direct me to the appropriate thread. <br> <br>Thanks much <br> <br>jason</p>
