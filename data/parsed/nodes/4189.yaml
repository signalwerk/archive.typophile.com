    html: <p>The $99 is the price for a single user for Type Classics for Learning (unlike most Adobe font products, it's not a 5-user license). However, if you're licensing for multiple users, I think it goes down to $50 per user after the first. You'd have to contact your educational software purchasing folks for details. <br> <br>I believe Victor's right about Kepler and Brioso not being on Type Classics; they were released after Type Classics shipped. <br> <br>Regards, <br> <br>T</p>
