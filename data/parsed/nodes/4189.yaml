    html: "<p>Don't know if it's too basic for your needs, but at an educational price of 99 USD, the Adobe Type Classics for Learning CD would be hard to beat.  <br> <br>About 400 fonts in all, including all of Adobe's Pro families, including \"Opticals\", except, I think, Kepler and Brioso. (Might be wrong about that.) So: Minion, Adobe Jenson, Cronos, Warnock, Utopia, Sanvito, Chapparral. Also includes the non-optical Pro families, including Adobe Caslon and Adobe Garamond, Myriad, Lithos, Trajan. And quite a few others. <br> <br>There's a fair amount of overlap with the fonts bundled with the Creative Suite package (which does include Brioso Pro). The educational price for the \"Premium Suite\" is just under 400 USD. <br> <br> <br>vc</p>"
    html_clean: "<p>Don't know if it's too basic for your needs, but at an educational price of 99 USD, the Adobe Type Classics for Learning CD would be hard to beat.  <br> <br>About 400 fonts in all, including all of Adobe's Pro families, including \"Opticals\", except, I think, Kepler and Brioso. (Might be wrong about that.) So: Minion, Adobe Jenson, Cronos, Warnock, Utopia, Sanvito, Chapparral. Also includes the non-optical Pro families, including Adobe Caslon and Adobe Garamond, Myriad, Lithos, Trajan. And quite a few others. <br> <br>There's a fair amount of overlap with the fonts bundled with the Creative Suite package (which does include Brioso Pro). The educational price for the \"Premium Suite\" is just under 400 USD. <br> <br> <br>vc</p>"
