      <p><a class="freelinking external" href="http://en.wikipedia.org/wiki/List_of_pangrams" rel="nofollow">Wikipedia's list</a> includes these in Spanish:</p>
      <p>(with ñ and diacritics)<br>
      El veloz murciélago hindú comía feliz cardillo y kiwi. La cigüeña tocaba el saxofón detrás del palenque de paja.<br>
      &gt; (Used in Windows as sample text)<br>
      &gt; The quick Hindu bat was happily eating golden thistle and kiwi. The stork was playing the saxophone behind the straw arena.</p>
      <p>(with ch, ñ and ll)<br>
      El pingüino Wenceslao hizo kilómetros bajo exhaustiva lluvia y frío; añoraba a su querido cachorro.<br>
      &gt;The penguin Wenceslao did kilometres under exhaustive rain and cold; he longed for its dear puppy.</p>
      <p>Jovencillo emponzoñado de whisky: ¡qué figurota exhibe!<br>
      &gt;Whisky-intoxicated youngster — what a figure he's showing!</p>
      <p>Ese libro explica en su epígrafe las hazañas y aventuras de Don Quijote de la Mancha en Kuwait.<br>
      &gt;That book explains in its epigraph the deeds and adventures of Don Quijote de la Mancha in Kuwait.</p>
      <p>Queda gazpacho, fibra, látex, jamón, kiwi y viñas.<br>
      &gt;There is still gazpacho, fibre, latex, ham, kiwi and vineyards.</p>
      <p>Whisky bueno: ¡excitad mi frágil pequeña vejez!<br>
      &gt;Good whisky, excite my frail, little old age!</p>
      <p>And <a class="freelinking external" href="http://es.wikipedia.org/wiki/Pangrama" rel="nofollow">Spanish Wikipedia</a> has more and better ones, though you'll need to translate them yourself:</p>
      <p>Quiere la boca exhausta vid, kiwi, piña y fugaz jamón. (42 letras)<br>
      Fabio me exige, sin tapujos, que añada cerveza al whisky. (45 letras)<br>
      Jovencillo emponzoñado de whisky, ¡qué figurota exhibe! (46 letras)<br>
      David exige plazo fijo embarque truchas y niños New York (47 letras)<br>
      La cigüeña tocaba cada vez mejor el saxofón y el búho pedía kiwi y queso. (58 letras)<br>
      El jefe buscó el éxtasis en un imprevisto baño de whisky y gozó como un duque (62 letras)<br>
      Exhíbanse politiquillos zafios, con orejas kilométricas y uñas de gavilán. (63 letras)<br>
      El cadáver de Wamba, rey godo de España, fue exhumado y trasladado en una caja de zinc que pesó un kilo (81 letras)<br>
      El pingüino Wenceslao hizo kilómetros bajo exhaustiva lluvia y frío, añoraba a su querido cachorro.(83 letras)<br>
      El veloz murciélago hindú comía feliz cardillo y kiwi. La cigüeña tocaba el saxofón detrás del palenque de paja. (92 letras) Usada para ver la tipografía en las Fuentes de Windows en idioma Español</p>
