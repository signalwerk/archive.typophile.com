      <p>Stephen -- </p>
      <p>The masthead went through many, many variations. The original type inspiration derived from an old mid-50's berthold wolpe masthead with strong, triangular serifs that I pushed very hard for. It was felt too 'masculine', and the lack of brackets caused much consternation. We tried everything from the delicate curve to the bracketless wedge, and in true committee style, it ended in middle-ground, and with the serifs reduced in weight. The masthead is based on the headline font, but is significantly different in detailing.</p>
