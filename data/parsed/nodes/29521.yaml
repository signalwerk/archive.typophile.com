      <p>So it is only the heading face that has changed. I think that's good news, because the existing one is great, and it's not nice seeing a body face replaced <cite>that</cite> often. That "after 221 years" bit is just more spin of course. I did enjoy Ellis's elaboration on the coat of arms though. Plus it's nice to see mention of logography - the idea only failed because the compositor's union sabotaged it. With logography Latin might have become something richer, since it's an idea that naturally lends itself to ligation.</p>
      <p>Coming to the design itself, I actually rather like the masthead. It has a nice newsy edge to it. On the other hand I confess to being a sucker for the wedge serif! As for the headline face itself, I'd really like to see a PDF. Luke, tell them to submit to newseum.org! From the onscreen renditions it looks maybe a bit too "emotional", with the high contrast and cupped serifs - but I guess that's what a newspaper needs to be these days. BTW, it also seems to have a certain Dutch flavor, which is both good and bad I guess.</p>
      <p>&gt; I see Luke gets a nod at the banner.</p>
      <p>And a slightly better mention in this new article.</p>
      <p>hhp</p>
