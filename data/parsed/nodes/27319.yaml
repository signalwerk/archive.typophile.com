      <p>Very pleasurable thread. Does anyone know who designed this logo for Eaton back in the 60s? I saw it as a teen and it was one of the first things that really stirred me to think about lettering and graphic design. Although some of the letter shapes are not as graceful as I might like, the back-and-forth from pos to neg is brilliant. (And I'd venture the designers of the "usa" logo shown earlier were inspired by this, is that fair to say?")</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/eaton_5140.gif"></div><p></p>
      <p>A couple of other points. The mention of Shell and Esso reminds me of a fantastic article in the New Yorker from perhaps 1972 about the creation of the EXXON brand and all the research done to make sure the name meant absolutly nothing (they didn't want it to mean "Your mother eats army boots" in Hungarian or something like that). Much discussion about the development of the logo, too, by was it Chermayeff and Geismar?</p>
      <p>If there are still UPS trucks where you live that have the globe symbol on them (instead of just the shield) next time you see one, note the position of the equator relative to South America! I miss the  utter simplicity of the original paul Rand logo, but I suppose companies feel they must change (and then designers get work). Interestingly, the Eaton logo is unchanged after more than 40 years . . .</p>
    html_clean: |-
      <p>Very pleasurable thread. Does anyone know who designed this logo for Eaton back in the 60s? I saw it as a teen and it was one of the first things that really stirred me to think about lettering and graphic design. Although some of the letter shapes are not as graceful as I might like, the back-and-forth from pos to neg is brilliant. (And I'd venture the designers of the "usa" logo shown earlier were inspired by this, is that fair to say?")</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/eaton_5140.gif"></div><p></p>
      <p>A couple of other points. The mention of Shell and Esso reminds me of a fantastic article in the New Yorker from perhaps 1972 about the creation of the EXXON brand and all the research done to make sure the name meant absolutly nothing (they didn't want it to mean "Your mother eats army boots" in Hungarian or something like that). Much discussion about the development of the logo, too, by was it Chermayeff and Geismar?</p>
      <p>If there are still UPS trucks where you live that have the globe symbol on them (instead of just the shield) next time you see one, note the position of the equator relative to South America! I miss the  utter simplicity of the original paul Rand logo, but I suppose companies feel they must change (and then designers get work). Interestingly, the Eaton logo is unchanged after more than 40 years . . .</p>
