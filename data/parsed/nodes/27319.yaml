      <p>I know it's going to sound BORING, and I really hate to admit it. But....</p>
      <p>....McDonalds.</p>
      <p>Give me a break. I design electrical signs for a living. I defy anyone anywhere to give me a more effective example of long distance legibility than those damned golden arches.</p>
      <p>McDonalds signs in construction and design are garbage. One reasonably good thunderstorm and our sign company's service crews are out replacing lots and lots of modules in those freaking things. They're junk. But they are extremely effective.</p>
      <p>You can be 3 or more miles up the Interstate and just by that glowing shade of yellow you know it is indeed McDonalds. Just from impulse buys based on the sign by itself it is estimated the average McDonalds makes more than $600,000 per year just on people seeing those arches in the distance and deciding to hit that place rather than another restaurant whose sign is not quite so legible at very long distances.</p><div class="imageWrap"><img src="http://typophile.com/files/McDeesFromHell_4664.jpg"></div><p></p>
