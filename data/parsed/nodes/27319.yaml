      <p>Well, I was waiting for others to add additional replies, so as not to appear like I was monopolizing the thread. But I couldn't wait. There's a few things that I wanted to get out there in response to some stuff previously posted.</p>
      <p>Jem and Terry Biddle offered the excellent BP logo redesign. Here's a couple images of that logo made REALLY BIG on the side of a fuel storage tank in Cushing, Oklahoma:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/BPtank2_4427.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/BPtank1_3519.jpg"></div><p></p>
      <p>Samadam posted an example of the US Air Force's new logo. Although that example appeared to use something different from the Arial type we were mandated to use in putting together this sign:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AirForceAltusAFB_3898.jpg"></div><p></p>
      <p>IMHO, Arial never looked any better than in stainless steel chrome type like this. Normally I really hate Arial, but this isn't all that bad. Note, this photo was taken when the sign was finshed and loaded on the beat up trailer and headed to the job site. If I can get around to taking a picture of the finished sign in its installed state I'll do it and post it here.</p>
