      <p>Well, like i said earlier in the thread, obviously Esso and Shell have the same kind of hypocritcal branding and there must be lots of others. I would think the designers don't feel too much at all. Just think of the cash and the prestige.</p>
      <p>The Unilever logo everyone seems to love so much is one of the worst examples. I would like to have been at the design meeting for that one...</p>
      <p>Unilever: <em> "We want something soft and friendly and fluffy, maybe with natural things in it, like birds and flowers and splashes and shells and fish." </em></p>
      <p>Designer: <em> "Why the hell would you want that? You're a massive international corporation that make chemical cleaning products which end up down the sink and pollute the rivers and oceans. And on top of that you actively promote a climate of hygienic fear so more people will use your products unnecessarily. Oh, and don't you produce nutritionally dubious processed and frozen foods too?" </em></p>
      <p>Unilever: <em> "Yes, true enough. But we don't want the public realising that. And there's $100,000 in it for you, if you do an extra smokey new smokescreen for us" </em></p>
      <p>Designer: <em> "Oh. OK then. Eerrr, one or two palm trees?" </em></p>
      <p>Unilever: <em> "Just the one thanks." </em></p>
      <p>Can i be sued for posting that?</p>
