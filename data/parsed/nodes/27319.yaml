      <p>I have always liked this design, done by Norman Litman, for the Mead Paper Library of Ideas back in the 60s. The original is all on one long line but I chopped it up this way for easier posting. It's fun to see how really memorable and distinct in personality so many of these logos are, isn't it? And overall, a very expressive design by Litman. (There I go again, starting a sentence with a conjunction . . .) I shot this out of a book -- didn't want to hurt it in the scanner -- so there is some gutter artifact between the B and the LI. </p>
      <p>Incidentally, I took this from a wonderful book that I'm sure many of you know, but those who don't should really try to find it (out of print for many years). Ray daBoll's <em>Recollections of the Lyceum and Chatauqua Circuits</em> (Freeport, Maine, Bond Wheelwright, 1969). The <strong>entire</strong> book is handlettered in his beautiful and unique italic hand. The front section is his wife's memoir of her times traveling as a singer and actress all over the American heartland, and the back is Ray's look at letter forms, handwriting, graphic design, and so forth. A most inspiring book from a warm, caring, not-at-all-corporate artist.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/CorpPubExhibit_sm_4157.gif"></div><p></p>
