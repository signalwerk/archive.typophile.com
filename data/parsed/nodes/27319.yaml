      <p>Honestly, the Milwaukee Power Tools logo is one of my favorites. I have a place in my heart for the old school charm, simplicity, and honesty. Although, I may be biased just because I'm from Wisconsin.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_5541.gif"></div><p></p>
      <p>Here are a couple of other little goodies.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/iplogo_blue_corp_27547D_4481.gif"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/VW_Logo_r_small_4385.jpg"></div><p></p>
      <p>Here’s a recent one of my own for a political candidate last fall. Simple enough to do the job. I'm almost positive this was the first time a candidate had been represented by a letter mark in this area. As it turned out, she did end up winning the race.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/stubbs_200_3486.jpg"></div><p></p>
      <p>And finally, here’s the logo I want to love, but just can’t. Something doesn’t “seem right” about that ligature. Always irked me, but I love their bikes anyway.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo-triumph_4185.gif"></div><p></p>
      <p>DOGG : : :</p>
