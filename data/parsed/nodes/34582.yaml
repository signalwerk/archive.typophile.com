      <p>Traps are in did very shallow and "sharp" in a way. They are definitely not subtle. And there's also some strange stroke variation going on.</p>
      <p>To my taste "v" is a bit too narrow. "v" and "w" have to long serifs on the top.</p>
      <p>"a" looks as if it would be set a bit lower than other letters. It's probably also smaller than other letters.</p>
      <p>The shape of "c" is ok but has much less stroke contrast as other letters.</p>
      <p>But continue. With refinement you may get a nice body font.</p>
