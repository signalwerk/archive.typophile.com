      <p>Graham,</p>
      <p>My first thought was that this design is not attractive but sturdy. There are plenty of examples of excellent types that also fit that description, so don't be insulted. You expressed an interest in designing something modern rather than traditional, but I think the shapes are still pretty traditional. </p>
      <p>There are some features you might enlarge or darken to strengthen the visual identity of the letters, but overall this should perform very well in small sizes for reading. Your spacing seems right for about 9 points (check m right sidebearing). At small sizes certain features visually shrivel, making them look thin or weak. The tail, the top of the bowl and the top of a could be heavier to strengthen it, the beak of r can be quite a bit heavier and the curves of hmnu could be slightly heavier. Another feature that visually fades is the serifs. I agree they are too long on v and w, but they could be larger on the tops of m and n, and especially the tails of u and a. When text is reduced or set small, those look too light. I don't necessarily think the serifs should all be heavier or longer, because the short ones on the bottoms of hmn might give an excellent readable feel in text, but do strengthen the serifs that are essential to the identity or structure of the letter. The spur on the left of t is an example of a structural or essential serif, and it's the appropriate size. There is some extra weight in the various strokes of w and v, you might taper some strokes and thin others. </p>
      <p>The subtle ink traps you've added will probably help the face look crisp in reproduction, but the overall low contrast still give the face a smooth, possibly dull flavor. Larger triangular cuts in crotches of hmnuar would add sparkle on a visible level that will be useful and attractive in text, while the more subliminal tiny cuts help the shapes retain their crispness through the printing process. There are places that connections or joints can be surprisingly thin and still hold the letter together: joint of k, bottom of bowl of a, joints of arches of hmnu to main stem, and elsewhere. To see an extreme example of this, look at Lexicon (<a href="http://www.teff.nl" title="www.teff.nl">www.teff.nl</a>). The overall stroke contrast is not high; for example s, o and z exhibit very little contrast. Most of the main strokes are similar weight. But see how thin it gets at the various joints (like k, a, g, h etc.) and how this still does not weaken the letter in text (Lexicon is excellent for extended reading). There are parts of letters that are like main identifying features, and other parts that are nearly vestigial, which have much less visual importance. </p>
      <p>You are well on your way to having a readable and sturdy text face. Nice details, too; the variation might prove very interesting in a display version.</p>
