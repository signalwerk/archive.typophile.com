    html: <p>No attitude, Jeremy. It's just that you refer to the ink traps of Bell Centennial as decorative. Sure, since a lot of graphic designers have noticed them and made a fetish of showing them off at large sizes, I guess you can see them as decorative, but my opinion is that it's a misguided thing to draw a lot of attention to. It's like the 80's trend of "High Tech", Centre Pompidou, exposed beams and rivets, concrete, etc. Making a style out of industrial techniques just doesn't interest me.</p>
