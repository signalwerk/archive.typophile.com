    html: "<p>Paul, I am a HUGE fan of Volgare. There is little information about it on the web. Here is the best and only page that describes Volgare: <a href=\"http://www.altx.com/ebr/ads/ebr6/farrell/page3.htm\" target=\"_blank\">http://www.altx.com/ebr/ads/ebr6/farrell/page3.htm</a> (it's a pain in the ••• to navigate though). <br> <br>Volgare took Stephen 4 years to make and you can tell in its detailed construction. All the information I know about it is in that link above, so I encourage you to read that. If you want a copy of the font you have to call Stephen and ask him to send you a CD with the font, it costs $75. It is well worth the price. <br> <br>He is also mentioned in this article on Design Observer <a href=\"http://www.designobserver.com/archives/000021.html\" target=\"_blank\">http://www.designobserver.com/archives/000021.html</a> <br> <br>As mentioned there, Volgare was on display at the Cooper Hewitt's original design triennial <a href=\"http://ndm.si.edu/triennial/animation.html\" target=\"_blank\">http://ndm.si.edu/triennial/animation.html</a></p>"
    html_clean: "<p>Paul, I am a HUGE fan of Volgare. There is little information about it on the web. Here is the best and only page that describes Volgare: <a href=\"http://www.altx.com/ebr/ads/ebr6/farrell/page3.htm\" target=\"_blank\" class=\"link-external\">http://www.altx.com/ebr/ads/ebr6/farrell/page3.htm</a> (it's a pain in the ••• to navigate though). <br> <br>Volgare took Stephen 4 years to make and you can tell in its detailed construction. All the information I know about it is in that link above, so I encourage you to read that. If you want a copy of the font you have to call Stephen and ask him to send you a CD with the font, it costs $75. It is well worth the price. <br> <br>He is also mentioned in this article on Design Observer <a href=\"http://www.designobserver.com/archives/000021.html\" target=\"_blank\" class=\"link-external\">http://www.designobserver.com/archives/000021.html</a> <br> <br>As mentioned there, Volgare was on display at the Cooper Hewitt's original design triennial <a href=\"http://ndm.si.edu/triennial/animation.html\" target=\"_blank\" class=\"link-external\">http://ndm.si.edu/triennial/animation.html</a></p>"
