  html: <p>Hello folks, <br>I have been asked to track down a typeface called Volgare. I've done some research on the net and found out it was developed by Stephen Farrell from Slip Studios. Most of his fonts are licenced through [T-26] but not this one. Does anyone know the font and if it is commercially available?</p>
