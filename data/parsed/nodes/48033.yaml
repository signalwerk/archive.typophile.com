    <p>Hello everyone.</p>
    <p>I’m starting work on a small annual report for a nonprofit focused on education in North America. For the past few years, I’ve used the fantastic <a class="freelinking-external" href="https://web.archive.org/web/20081122041217/http://www.processtypefoundry.com/typefaces/locator/index.html "> Locator</a> and Locator Display by Process. This year, I’d like to use the Display face again but invest in a nice serifed font for text. It would be great if the new font will belong to a larger family of typefaces, but it’s not necessary. The primary goal is to have a text face that will be friendly and super legible but will also share some of the modern quirks of Locator in a very gentle way. It should not call overt attention to itself and it should be a bit of a workhorse.</p>
    <p>I’ve somewhat ruled out Meta Serif but I’m considering <a class="freelinking-external" href="https://web.archive.org/web/20081122041217/http://www.fontshop.com/fonts/downloads/itc/itc_mendoza_roman_complete_vp/ "> Mendoza </a> and <a class="freelinking-external" href="https://web.archive.org/web/20081122041217/http://www.myfonts.com/fonts/ludwiguebele/mokka/ "> Mokka</a> as these are smartly crafted transitional faces. There’s also <a class="freelinking-external" href="https://web.archive.org/web/20081122041217/http://typography.com/fonts/font_overview.php?productLineID=100032 "> Chronicle</a>, which is lovely.</p>
    <p>Any suggestions would be welcome! Thanks, in advance.</p>
