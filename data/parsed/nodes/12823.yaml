    <p>Hello All,</p>
    <p>I was given <a href="http://www.imageshack.us">this</a> recently by a client who wants the same font on his project as Maxim uses in it’s “Circus Maximus” page. When I couldn’t find the exact same font I suggested very similar alternatives (CC Dave Gibbons, CC Wild Words, or Blambot’s Jack Armstrong came to mind). He insists, however, on trying to get the exact same font if possible. </p>
    <p>I’ve even tried contacting Maxim directly but alas did not have my calls returned.  </p>
    <p>I was hoping some fresh eyes here could help out as maybe I missed the obvious. As always, any help is appreciated. </p>
    <p>Here again is the link to the image:<br>
    <a href="http://img158.echo.cx/img158/8245/cmc31ae.jpg"> Click here for Image </a></p>
