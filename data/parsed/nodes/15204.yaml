    <p>There's something I've wondered aloud about for a while now, although<br>
    apparently never in the right place; but now that David Berlow seems<br>
    to hang out here, this might be my best chance yet:</p>
    <p>With the introduction of the Poynter typeface a few years ago, FontBureau<br>
    applied the idea of weight "grading", although they graciously credited past<br>
    designers for the idea (too much credit deferred, as far as I'm concerned).<br>
    The idea is to provide very gentle weight variations to allow fine-tuning,<br>
    depending on printing conditions, specifically in terms of gain, which can<br>
    happen even within a single newspaper, for example when type is next to<br>
    an image or not.</p>
    <p>What I'm wondering about is how this idea relates to the "traditional"<br>
    scaling of vertical &amp; horizontal proportions within a family of weights,<br>
    since the intent is really different here. Most tellingly, at FB itself there<br>
    seems to have been a bit of inconstance about this. Here are a couple of<br>
    overlays, based on scans from their super specimen book:</p>
    <p><a href="http://themicrofoundry.com/other/fb/poynter_1vs4.gif" title="http://themicrofoundry.com/other/fb/poynter_1vs4.gif">http://themicrofoundry.com/other/fb/poynter_1vs4.gif</a></p>
    <p><a href="http://themicrofoundry.com/other/fb/bureau_0vs4.gif" title="http://themicrofoundry.com/other/fb/bureau_0vs4.gif">http://themicrofoundry.com/other/fb/bureau_0vs4.gif</a></p>
    <p>Note how the height changes in one, but not the other.<br>
    My guess is that -since Bureau came later, and I think<br>
    more under the hand of Berlow as opposed to TFJ- the<br>
    second attempt was an improvement. But all ears are<br>
    tuned to the horse's mouth of course!  :-)</p>
    <p>hhp</p>
