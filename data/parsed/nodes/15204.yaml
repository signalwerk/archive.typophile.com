      <p>Grades started for me with the development of a Playboy Baskerville. There was a man there who wanted the type to look the same regardless of where the flesh lay, so to speak. I.E. they use offset for non-naked people pages and gravure for those rich skin tone we've all come to know and dismiss in favor of reading. When Poynter began, we had lots of discussions about grades and what they meant in execution. If you are combating weight gain or weight loss in the production process you could think to erode or accrete in all directions, including below the baseline. But tests showed this not to be effective. In the end, Tobias and I had two different approaches to x-height but they are not "That" different that either of us went too far, or not far enough. I decided to keep all the heights the same because that ht. makes such a huge impact, he allowed a slight rise...</p>
      <p>P.S. after 3-4 months of truly minute changes to PB Baskerville that did not seem to be making the hutch happy, I got a letter that said "I'm sorry to take so long, but I finally realized the fonts are fine, I needed new glasses — Hef"</p>
