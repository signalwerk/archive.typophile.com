      <p>I don't think it's a bad idea to increase the x-height as a font gets bolder. I noticed a long time ago that some font families are designed this way and I've done it myself on some of mine.</p>
      <p>It's one of those typographic optical illusions to compensate for, though it seems less universally done than, say, using the visual center or overshooting curves.</p>
      <p>As you make a font bolder, the lowercase will appear smaller relative to the caps, probably because the counters get smaller faster in the lowercase than in the caps as you add weight. If you increase the x-height a little, you can compensate for this. The main drawback is if you want to set two lowercase characters of different weights right next to each other, and they don't line up. For this reason, I think it's up to the type designer to decided whether or not to do it, depending on how the font is expected to be used.</p>
