    html: |-
      <p>Hey all,</p>
      <p>FWIW, Birds of Fire was a pen drawing, I was into printing at the time as well, so I used 4 Rapidiograph pens with each of the 4-color process colors, cyan, magenta, yellow and black. That's it. I took me about a month and a half to draw. </p>
      <p>Funny story, CBS printed several hundred thousand on them on glossy stock and it looked horrible, John and I went down to their office and told John Berg, the executive art director they were not acceptable, So they did a re-print on a textured matte stock, which looked great. John Berg had a hissy fit when we regected the first batch, he actually kicked the wall!</p>
