    html: |-
      <p>Interesting hand-illustrated cover originally designed for 1973 release of <em>Birds of Fire</em>.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/mahavish_logo.gif"></div><br>
      The whole cover seems to have the look of a transparent watercolor with Primacolor pencil added. If you look closely at the letters, they seemed to have been traced and colored from a source typeface but modified. A model for MAHAVISHNU ORCHESTRA could have been Hobo with lumpy serifs added on the fly.<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/maha_hobo.png"></div><p></p>
      <p>"Birds of Fire" is also part of the cover painting and has the same feeling of a typeface that was used as a model for loosely copying or tracing.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Maha_cover.gif"></div><br>
      Remember, this was designed in 1973 or earlier, so the faces may have been loosely traced from press-type or phototypesetting. Both ITC Bookman and Cooper Black had very similar swash characters to the "f" and "r" available in photo headliners.<p></p>
    html_clean: |-
