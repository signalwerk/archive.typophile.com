      <p>With "on the fly" (an old expression), I meant 'as you go along' or spur of the moment thinking or creativeness.</p>
      <p>Again, these are only guesses of mine, and the source material for the album cover may have been different or just invented. But the similarities to type designs that were prominently available during the early 70s can't be denied.</p>
      <p>But if you are asking if the lettering was hand drawn, my assessment would be yes, but copied and modified from existing type designs.</p>
