    html: |-
      <p>Hey there all,</p>
      <p>Well, you're gonna get it straight from the horses mouth, I'm just flattered that after all these years there seems to be more interest in my work than way back when. I guess that's just the way it goes. </p>
      <p>There are some very astute observations about how I designed this font, Hobo, Windsor and Bookman were some of the influences. Although, I really tried to put some subtle changes into it. Norbert, yes, Hobo was a strong influence, and the "lumpy serifs" were my principle contribution! Funny, since I always then and now hated Hobo.</p>
      <p>This was designed in late 1972 as I recall, I was in the same spiritual movement as John, and actually lived in his home as a renter for about 3 years. </p>
      <p>I was a very young designer at the time, about 22, and I was most concerned with designing something that the Mashavishnu brand could own, so that was why I designed it.</p>
      <p>Unfortunately, I never finished the whole alphabet, much to my regret, and still would like to finish it today. Although I still have no idea how to use any of the font creation programs, so feel free to chime in.</p>
      <p>Coincidentally, this past year I was approached over the internet by Walter Kowlosky, a Boston writer who is putting together a great book on the MO, and I was privilidged to do the cover design for it. </p>
      <p>So anyway, if any of you want to discuss this or see what I'm doing now, I can be reached at <a href="mailto:poissonsaz@qwest.net">poissonsaz@qwest.net</a>.</p>
    html_clean: |-
