      <p>I always wondered what Luc de Groot's "Nebulae" would look like animated, and did something kind of in the same vein with my present website logo. I applied the "noise" filter 40 times, and as it's random (or more random than most Photoshop filters, IYKWIM), the results are all different, and these comprise the frames, cycled. Being a McLaughlin fan from way back, I spent a lot of time looking at the album covers and listening to the music in vartious mental states, so Chris' atomism may be responsible for this.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/STf.gif"></div><p></p>
