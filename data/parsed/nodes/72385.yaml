    <p><a href="http://www.flickr.com/photos/fontfont/4809103852/" title="FF Suhmo by FontFont, on Flickr" rel="nofollow"><img src="http://farm5.static.flickr.com/4116/4809103852_4aa1a5afa1.jpg" width="500" height="360" alt="FF Suhmo"></a><br>
    <a href="http://www.fontshop.com/fontlist/families/ff_suhmo" rel="nofollow"><strong>FF Suhmo</strong></a> is inspired by classic Egyptian and typewriter fonts such as Courier and American Typewriter, which feature headline and text use. This impressive duality was a guideline for the concept of <a href="http://www.fontshop.com/fonts/designer/alex_rutten/" rel="nofollow">Alex Rütten</a>.</p>
    <p>At the same time, many formal details were derived from the typical neon-lettering you can find on aged Italian restaurants in Germany. Suhmo has short ascenders and descenders and a generous x-height, making it a good choice for editorial design. It combines simplicity and functionality with playfulness, offering interesting details such as loops and swashes and a slight stroke contrast. Its varied details are unobtrusive in text sizes while developing character and sparkle in headlines. FF Suhmo’s extensive character set includes numerous special characters and ligatures, several figure sets and small caps throughout all styles. The Suhmo family consists of 4 weights: Light, Regular, Bold and Black, each with an Italic. The weights were staggered to complement each other within a layout, the Black corresponding to the Regular and the Light corresponding to the Bold weight, allowing words or phrases to be clearly stressed within a text. The Italics are lighter than the Roman and have a relatively slight angle of slope. The forms are derived from a manual writing process and often cross the base-line or the x-height.<br>
    <a href="http://www.flickr.com/photos/fontfont/4809103768/" title="FF Suhmo by FontFont, on Flickr" rel="nofollow"><img src="http://farm5.static.flickr.com/4081/4809103768_de4bc89f10.jpg" width="500" height="250" alt="FF Suhmo"></a></p>
