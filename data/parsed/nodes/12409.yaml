    <p>A printing method where type, in the form of metal or wood letters, or more widely since the end of the 1990s, <a href="/wiki/photopolymer" class="freelinking" rel="nofollow">photopolymer</a> plates, and optionally graphics are placed on a press  or another stable platform to accept weight and pressure, locked tight in place, with a <a href="/wiki/quoin" class="freelinking" rel="nofollow">quoin</a> (specialized wedges), inked, typically with a rubber roller, covered with paper, or other impressionable and portable material, subjected to pressure and release within a press, after which the ink remains on the paper, and the process may be repeated.</p>
    <p>There's a pretty good entry on letterpress at wikipedia.com</p>
