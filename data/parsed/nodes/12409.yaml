  html: |-
    <p>A printing method where type, in the form of metal or wood letters, or more widely since the end of the 1990s, <a href="/node/13649" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">photopolymer</a> plates, and optionally graphics are placed on a press  or another stable platform to accept weight and pressure, locked tight in place, with a <a href="/node/add/wiki?edit%5Btitle%5D=quoin" title="Create node &quot;quoin&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">quoin</a> (specialized wedges), inked, typically with a rubber roller, covered with paper, or other impressionable and portable material, subjected to pressure and release within a press, after which the ink remains on the paper, and the process may be&nbsp;repeated.</p>
    <p>There’s a pretty good entry on letterpress at&nbsp;wikipedia.com</p>
