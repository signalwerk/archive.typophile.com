    <p>Hello,</p>
    <p>We are a small(very small) font studio from Georgia(If you heard of it). Mostly we develop fonts georgian fonts for corporations like banks or insurance companies. The problem is that, we don't have the name. </p>
    <p>So, please help us to choose which name for font studio is the best. You can mark names you like on our poll(<a href="http://goo.gl/iPOG3x">http://goo.gl/iPOG3x</a>) or you can post it in comments. Thanks a lot!</p>
