    <p>I think this is technical enough for Build...</p>
    <p>I tossed this little conversion script together today to brush up on my (rather feeble) <code>awk</code> skills. All it does is convert points to mm and spew out some CSS classes. Might be useful for someone...</p>
    <pre>#! /bin/sh

    # Only tested on ash and bash and with GNU awk.

    unset Pts
    while getopts pt: f
    do
     case $f in
      t) Pts="pt=$OPTARG" ;;
     esac
    done
    shift `expr $OPTIND - 1`

    LC_ALL=C awk '
    BEGIN            { pts=0.352778 }
    pt=="DTP"        { pts=0.352778 }
    pt=="Postscript" { pts=0.352778 }
    pt=="TeX"        { pts=0.351460 }
    pt=="Pica"       { pts=0.351460 }
    pt=="Didot"      { pts=0.375972 }
    pt=="Cicero"     { pts=0.376065 }
    pt=="Berthold"   { pts=0.376000 }
    pt=="Imprimerie" { pts=0.400000 }

    NF==0 { print }
    NF&gt;0 {
     if ($3=="pt") { printf ".%-12s { font-size: %6.3fmm; }\n", $1, $2*pts } ;
     if ($3=="mm") { printf ".%-12s { font-size: %6.3fmm; }\n", $1, $2 }
    }
    ' "$Pts" &lt;&lt;_E_O_F_ &gt;$1
    Kvartpetit   2 pt
    Brillant     3 pt
    Diamant      4 pt
    Perl         5 pt
    Nonpareille  6 pt
    Insertio     6.5 pt
    Kolonell     7 pt
    Petit        8 pt
    Borgis       9 pt
    Korpus       10 pt
    Brevier      11 pt
    Cicero       12 pt
    StorCicero   13 pt
    Mittel       14 pt
    LitenTertia  15 pt
    Tertia       16 pt
    Paragon      18 pt
    Tekst        20 pt
    DobbelCicero 24 pt
    DobbelMittel 28 pt
    LitenKanon   32 pt
    Kanon        36 pt
    StorKanon    42 pt
    LitenMissal  48 pt
    Missal       54 pt
    StorMissal   60 pt
    LitenSabon   72 pt
    Sabon        76 pt
    StorSabon    84 pt
    Real         96 pt
    Imperial     108 pt

    Perle        1.75 mm
    Fussnote     2.25 mm
    Tabelle      2.50 mm
    Legende      2.75 mm
    Zeitung      3.00 mm
    KleinBuch    3.25 mm
    GrossBuch    3.50 mm
