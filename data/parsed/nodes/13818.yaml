    html: <p>Amazing stuff. Tangentially, this raises a question I've had for some time. Pricing. The very attractive <em>Litteratra</em> has a price tag of $135 per license. While I'm sure it is worth every penny, there are equally amazing fonts sold for prices in the $20-40 range. I read the license and it seems very user friendly. So, how do they arrive at this number? I mean, if a foundry produces an excellent text face and lets it go for $30/weight and BigPublishingCo. purchases two or three licenses and sets the next Harry Potter book in that face, shouldn't the foundry be paid more than say TheLittleGuyCo who uses it to print a run of 1000 pamphlets? Likewise, if MassiveRetailCo hires a hip new firm to handle there next international ad campaign, and the hip new firm purchases a hip new display face on MyFonts for $29.95, isn't the designer/foundry being ripped off? The whole workstations model of licensing seems flawed. That $135 buys you the right to have 4 copies of <em>Litteratra</em> installed but says nothing about how many eyeballs see it. If it's used for a local marketing strategy and 100,000 people see it or if it's used for a national campaign and 1,000,000 people see it the price is the same? That doesn't seem right. So how does this stuff work?</p>
