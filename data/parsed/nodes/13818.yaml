    html: |-
      <p>Litteratra has about 1900 glyphs, so I think it is worth the price.</p>
      <p>Consider this against some other fonts with enormous character sets. Linotype's <a href="http://www.linotype.com/57056/palatinolinotype-family.html" rel="nofollow">Palatino Linotype</a> has 1325 glyphs per weight. Each wight costs 99 dollars (or Euros), before taxes. <a href="http://www.linotype.com/48344/helveticalinotype-family.html" rel="nofollow">Helvetica Linotype's</a> weights cost the same, but have 1866 glyphs per weight.</p>
      <p>A "normal" font has 256 characters, and costs about $25. Maybe $21 at MyFonts.com.</p>
      <p>1900 divided by 256 is almost 7.5 (and just 7 x $20 would be $140).</p>
      <p>If Karsten were working with old "expert fonts," you'd have to buy at least seven fonts to get what you get in just one now. And just one font is way more convenient for the user than seven. So actually, I think that the price for Litteratra is fair, considering what you get!</p>
      <p>Plus, Karsten <em>is</em> the "little guy." He doesn't have a team of glyph drawers or OpenType programmers to help him out. If I remember correctly, this typeface has been in production for at least five years! I don't think it would be fair to expect him to sell a font—which very few fonts on the market can match in terms of capabilities, BTW—for just around $30. That isn't the direction that other "real" OpenType fonts are going in either.</p>
      <p>__<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
