      <p>Beautiful! I'll be browsing often...and hopefully licensing soon.</p>
      <p>My thoughts on font pricing: I agree that it doesn't seem logical, but I don't think anyone would be able to adequately control the licenses, audit their use, or apply accountability very well. Print runs are often client-driven, not designer-driven. If the client bumps the print quantity up, but doesn't tell the designer (the license purchaser), that puts everyone in an awkward position financially and legally. Plus, people are accustomed to the current model, which favors their convenience, so I don't think a change would work too well. Isn't there a foundry that's testing a per-word traditional typesetting model where you pay a much lower per-character fee for an EPS of a headline or word set in their font? That seems like a more reasonable approach to making font commerce easier/more affordable for everyone. In the case of Literatra, imaybe it has to do with expected sales? Lower, more rarified demand means less repeats of per-unit profit, so they bump up the price to compensate? Text fonts don't really work individually, they require italics, etc., whereas Literatra is complete as-is? Maybe? Dunno.</p>
      <p>Of course, I write all of this as a type consumer, not a producer/retailer.</p>
