    <p>An exciting new type collective, <a href="http://vllg.com" target="new" rel="nofollow">Village</a>, opened its virtual doors today:</p>
    <p>"Village is a type co-op. We are the union of nine (soon to be twelve) young type foundries who have decided to go it alone, together. vllg.com is the information channel and boutique storefront for this group of equals."</p>
    <p>The nine foundries are: Feliciano Type Foundry (Mário Feliciano), Joshua Darden, KLTF (Karsten Lücke), Lux Typographics (Michael Rey, Greg Lindy), Orange Italic (Christian Schwartz), Thirstype (founded by Rick Valicenti, with contributions from Barry Deck, Magnus Rakeng, Patric King, chester, Frank Ford, Patrick Giasson, Claudio Piccinini, and soon Hugo d’Alte), Type Initiative (Michail Semoglou, Keith Chi-hang Tam), Underware (Akiem Helmling, Bas Jacobs, Sami Kortemäki) and Village (chester, Tracy Jenkins). According to the site, "Village is the 'house brand' and founding member of the type collective."</p>
    <p>Some <em>beautiful</em> typefaces are or soon will be available, some of them for the first time to the type community at large, including <a href="http://vllg.com/OrangeItalic/" target="new" rel="nofollow">Local Gothic</a> by Orange Italic (first conceived in 1999 and used in the TypeCon 2005 identity) and the long-awaited <a href="http://vllg.com/Lux/Crank8/Example+About/" target="new" rel="nofollow">Crank 8</a> by Lux Typographics (seen originally in <em>Esquire</em> magazine). Wow.</p>
    <p>Edit: I just took a closer look at <a href="http://vllg.com/KLTF/Litteratra/mudTyper+Weights/" target="new" rel="nofollow">Litteratra</a>, by Karsten Lücke. It has to be seen to be believed!</p>
