    <p>I think I already know the answer to this but just wanted to double check with you fine folk. :) And due to disclosures I apologise for the secretive nature of this post..</p>
    <p>I've used two typefaces designed by a well-known foundry, for a well-known brand's new logo redesign (which will appear internationally in a fairly large public scale)..</p>
    <p>The client is aware that they'll need to license both typefaces. Typeface 1 appears in the logotype with minimal modifications in two characters (arms/bar extended 5%, counter opened 25%, roughly). Typeface 2 appears in the logotype too of which three characters are minimally modified (bar extended to match arms, terminal altered).</p>
    <p>(Additional info, though might be irrelevant..) Typeface 2 may also be used, unmodified, for headline use in all of the brand's comms materials (I haven't made a final decision on this yet).</p>
    <p>Just wondering what is the rule for a situation like this? Does etiquette call for giving a courtesy notice to the foundry regarding the type modifications made for the logotype? I'd like to stress that the modifications are almost negligible.. Well at least based on rebrand projects I've done in the past, this one's pretty negligible. ;)</p>
    <p>Sorry for the long-winded post!</p>
