      <p>The EULA doesn't mention logotype use specifically.. So okay, once my client purchases the appropriate licenses, no notification is needed to let the foundry know about the slight character modifications? Just confused because the EULA states typefaces cannot be modified.. Oh crap, just found this in the EULA..</p>
      <p>"You agree not to make, or authorize or commission others to make, any additions, deletions or modifications to, or derivative works or fonts based on or substantially similar to, the Typefaces without the prior written consent of.."</p>
      <p>Hm, I guess I found my answer. Crap. :(</p>
      <p>..Or does that only apply only to the typeface as a whole? And not to an application of the typeface (if that makes sense)?</p>
      <p>I once worked with a typographer to make a proprietary cut of DIN for a client (for their exclusive corporate use). We contacted the foundry as a courtesy and they laughed us off saying of course it's fine.. I was hoping it's the same for this foundry. :/</p>
