      <p>Such no-mod clauses* only apply to the making of actual modified fonts, not the modification of converted-to-outline letterforms.</p>
      <p>* Which are a relatively new -and to me deplorable- practice.</p>
      <p>And: What Frode said about having a bona fide type designer doing the mods.</p>
      <p>hhp</p>
