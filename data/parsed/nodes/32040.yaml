    html: |-
      <p>Conor, I don't think it is a union symbol since<br>
      that was only introduced in 1888 (by Peano) and<br>
      was without ductus, rather like the modern form.</p>
      <p>-j<br>
      --<br>
      <a href="http://pdfb.wiredworkplace.net/pub/jjg/" title="http://pdfb.wiredworkplace.net/pub/jjg/">http://pdfb.wiredworkplace.net/pub/jjg/</a></p>
