    <p>Hi all</p>
    <p>The attached are taken from Frege's Grundgesetze der Arithmetik<br>
    (Jenna, Germany 1893). Athough the symbol on the middle of the<br>
    second line looks like a U, the vertical strokes seem to me to<br>
    be too close together; I thought it might be a commercial sign<br>
    like the "per" symbol (unicode U-214C).</p>
    <p>I'd be most grateful if anyone could tell me more about it.</p>
    <p>Thanks in advance</p>
    <p>Jim</p>
