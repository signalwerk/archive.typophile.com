    html: |-
      <p>I agree that the "new" indicator is the most important element to add.<br>
      Some more notes:</p>
      <p>a) The last poster (which were shown in the old id forum) is also a convenient piece of info.<br>
      Example 1: If a request has 1 reply and the last post is the original author the request is probably not yet solved (I know that this is supposed to be replaced by the "solved" flag, but I'm afraid this will not be updated until a request reach the 2nd page of requests)<br>
      Example 2: Even if a request is solved I'm personally interested in following and reading comments of specific posters.</p>
      <p>b) I notice that the messages I post by replying to an id request, do not show now in "My Profile-&gt;My Posts".<br>
      As there is no other method (email notification, etc) to know that a new message has been posted in a thread I participated, I used a refresh on ""My Profile-&gt;My Posts" page to check if there any responses to my messages.<br>
      Is there any alternative?<br>
      If not, is it possible to enable the posts to be shown in "My Profile-&gt;My Posts"?</p>
      <p>Thanks for all the effort to make the font-id section better ;)<br>
      Fivos</p>
