    <p>Hello,</p>
    <p>I have been searching for some elegant slightly informal brush drawn script fonts, but with the unusual specificity of being non-slanted, like the tradition wants.<br>
    A good example of the "looks" I'm searching for is linotype's pepita, but in a less right-slant-look concept. Sadly, for some reason all "vertical-looking" brushscript fonts I was given to see looked uneasy and quite in-elegant.(Most probably because they get less  curves to express their character).</p>
    <p>Thanks for any suggestions,</p>
    <p>Paul-Kenji Cahier</p>
