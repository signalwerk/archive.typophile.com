    html: |-
      <p>Thanks all for the suggestions.<br>
      There is this smoothness, clarity yet hand-made brush feeling in pepita that is so hard to find around. The variations in width/alignement are for a good part of that. That and some non-typical forms.</p>
      <p>The one matching the most from what was suggested would be Mr Rafkin:<br>
      <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000080" title="http://www.veer.com/products/typedetail.aspx?image=UMT0000080">http://www.veer.com/products/typedetail.aspx?image=UMT0000080</a></p>
      <p>I'm particularly fond(in this case) of the caps of pepita, like the 'P'.</p>
      <p>Anyway, all suggestions are still welcome.</p>
      <p>Edit:<br>
      On a side note, I'm liking a lot the looks of gizmo(even if not what I need in this case), it's really nice to see such an informal yet elegant face.</p>
