    html: |-
      <p>The question of typographic "color" is complicated because it is affected by what size you want to set the type, and the leading. If you have a dark type like Quadraat, and set it relatively small with generous leading, then it won't be too dark. The best thing is to see printed examples, and then you can really judge. If someone here has used Capsa they could tell you better.   </p>
      <p>Also the texture on the page is a matter of how the contrast of thick and thin, horizontal and vertical are handled. For example, my Williams Caslon looks dark but has stems that are not thick—you can see the effect in <a class="freelinking external" href="http://typophile.com/node/65216" rel="nofollow">this thread</a>.</p>
