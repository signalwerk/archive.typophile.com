      <p>Hi everybody again!</p>
      <p>As the project is getting on the way, the question is still current. In the meanwhile I came across a beautiful wedge serif with cyrillic and latis script! It seems to be a right mix between a classic "skeleton" and a contemporary wedge finish in details/terminals/curves. </p>
      <p>The only problem, this font is not completed yet, here is a preview of "Florian": <a href="http://www.behance.net/gallery/Florian-Family/548744" title="http://www.behance.net/gallery/Florian-Family/548744">http://www.behance.net/gallery/Florian-Family/548744</a></p>
      <p>It looks amazing to me, but I was wandering if anybody knows something similar, at least for the latin script. No matter which font will be used in the end, I would just like to know some similar alternatives. </p>
      <p>Thanks to everybody!</p>
