      <p>Peter, you can contact <a class="freelinking external" href="http://typophile.com/user/50217" rel="nofollow">Alexei Vanyashin</a>, Florian's author, to know about a release schedule. Some other fonts which may interest you:<br>
      <a class="freelinking external" href="http://www.terminaldesign.com/Fonts/#/Enclave" rel="nofollow">Enclave</a><br>
      <a class="freelinking external" href="http://www.typotheque.com/fonts/greta_text" rel="nofollow">Greta Text</a><br>
      <a class="freelinking external" href="http://commercialtype.com/typefaces/guardian" rel="nofollow">Guardian Text</a><br>
      <a class="freelinking external" href="http://www.typeculture.com/foundry/font_collection/font.php?ID=FNT09" rel="nofollow">Expo Serif</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/nonpareille/stuart-pro" rel="nofollow">Stuart</a><br>
      <a class="freelinking external" href="http://www.type-together.com/sirba" rel="nofollow">Sirba</a><br>
      <a class="freelinking external" href="http://www.type-together.com/Karmina" rel="nofollow">Karmina</a></p>
      <p>About Capsa, maybe <a class="freelinking external" href="http://www.dstype.com/profile.php" rel="nofollow">Dino dos Santos</a> know some publishings where his font was used. I think Capsa is really beautiful, but is darker than most text faces and would work well just in quality prints and when properly typeset.</p>
      <p>Recently I decided to add Cyrillic support to my under-development <a class="freelinking external" href="http://www.typophile.com/node/67787" rel="nofollow">font</a>, but I believe its design is very orthodox to the kind of typefaces you look for.</p>
