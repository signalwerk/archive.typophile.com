      <p>Thanks for the input so far. The question of publishing in Russian is still in the future though. </p>
      <p>Therefore for now, out of practical curiosity, I really would appreciate an educated estimation of one of you professionals how a font like Capsa would look on paper. Again it is the darkest typeface I saw in the tradition of Old-Style serif font made for body text! Is it too dark? I like it because it is very similar to Sabon actually, but a bit more "organic" meaning less straight cut, if that makes sense. So it seems warmer than Sabon, without being to playful. Just the color puzzles me. Please type-professionals, your opinion! </p>
      <p><a class="freelinking external" href="http://www.dstype.com/public/specimens/Capsa.pdf" rel="nofollow">Capsa Specimen PDF</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/sabon/?testdrive=dock%3Dfalse%26size%3D76%26w%3D720%26src%3Dcustom%26text%3DHamburgefonsivt%26fg%3D000000%26bg%3Dffffff%26goodies%3Dot.liga%26seed%3D19" rel="nofollow">Sabon</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/dstype/capsa/?testdrive=dock%3Dfalse%26size%3D76%26w%3D720%26src%3Dcustom%26text%3DHamburgefonsivt%26fg%3D000000%26bg%3Dffffff%26goodies%3Dot.liga%26seed%3D20" rel="nofollow">Capsa</a> in comparison.</p>
