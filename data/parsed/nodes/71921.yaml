    <p>Hi everybody!</p>
    <p>[EDIT]<br>
    New question below, a bit related, but actually independent from the initial post<br>
    [/EDIT]</p>
    <p><strong>short version</strong><br>
    I need a font for a novel. Genre Distopia (like Fahrenheit 451, 1984, you get the genre). I must not be expensive. Would like to avid bundled and be individual. Thought about <a class="freelinking external" href="http://new.myfonts.com/fonts/dstype/capsa/" rel="nofollow">Capsa</a>, because it is a book-font and price is right. It is darker though than any other text-font I know. Is it too dark; for which printing conditions? How would you rate it's quality (low on myfonts, why?)</p>
    <p>Then: Different suggestions, different style recommended? Suggestions for a cyrillic font as well?</p>
    <p><strong>initial post</strong></p>
    <p>I am looking for a font for the small scale publishing of a novel. The book is a distopia about a future world of consumerism, about a dictator brought to life again and controlled as a puppet. I am not connected with writing it, so please forgive I can't explain the plot better, as I don't have too much insight in the writing process. </p>
    <p>Anyhow the budget is limited, I am basically looking for a classic looking text font, easy to read. I thought it would be nice to have something which is classic, and somehow in contrast to a futuristic topic, as it reminds of the time before the novel sets place and how the society in the novel could develop in this direction. Maybe that is a misleading though, maybe something more edgy and modern would be better, I am open for suggestions.</p>
    <p>I was interested in <strong>Capsa</strong> by DStype <a class="freelinking external" href="http://new.myfonts.com/fonts/dstype/capsa/" rel="nofollow">on <strong>myfonts</strong> for example</a>, but I hesitate a bit. </p>
    <p>The price for roman and italics with 26$ each is quite right, that's why I consider it. My concerns are firstly I don't know if it suits the function as a book face. I know book faces are supposed to be darker, but this particular one is quite dark, even compared to Arno Pro, MVB Verdigris and similar darker faces. Isn't it too dark almost for the contemporary reader out there?<br>
    Is there any advise why the font per se would be not a good font, as the rating is quite low? It seems to be a quality product, but I am not an expert, what is your opinion?</p>
    <p>Or any other proposals? Anything more modern or a different classic book font?</p>
    <p>And a second question, for this project we would need as well a fitting cyrillic font, classical or modern, I don't know as I am not a native cyrillic reader. I thought about <a class="freelinking external" href="http://new.myfonts.com/fonts/fontfont/maiola/regular/?testdrive=seed%3D31%26dock%3Dfalse%26size%3D72%26w%3D720%26src%3Dpangram.7%26text%3D%255B%25D0%25A0%25D1%2583%25D1%2581%25D1%2581%25D0%25BA%25D0%25B8%25D0%25B9%2520(Russian)%255D%26fg%3D000000%26bg%3Dffffff%26goodies%3Dot.liga" rel="nofollow"><strong>Maiola</strong></a> or <a class="freelinking external" href="http://new.myfonts.com/fonts/alexandra-korolkova/leksa/regular/?testdrive=dock%3Dfalse%26size%3D72%26w%3D720%26src%3Dpangram.7%26text%3D%255B%25D0%25A0%25D1%2583%25D1%2581%25D1%2581%25D0%25BA%25D0%25B8%25D0%25B9%2520(Russian)%255D%26fg%3D000000%26bg%3Dffffff%26goodies%3Dot.liga%26seed%3D41" rel="nofollow"><strong>Leksa</strong></a> maybe, but I would appreciate some help here, as I really don't know a lot about cyrillic type design.</p>
