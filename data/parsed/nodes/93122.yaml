    html: |-
      <p>.notdef is the character that is used to represent a character that is not encoded in the font you are using (if, for example, you attempted to type a Cyrillic character in a font that didn't support Cyrillic), it is normally a question mark or an x enclosed in a rectangle.</p>
      <p>I don't know if excluding this character would cause any issues with generating the .OTF.</p>
