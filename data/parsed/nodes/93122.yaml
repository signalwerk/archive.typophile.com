    votes: null
    html: <p>Try repeating your import process, but with only a few glyphs at a time. That should isolate the problem to a specific subset of glyphs.</p>
  - id: 512325
    user: 6470
    date: 2012-06-07T10:20:00
    date_raw: 7 Jun 2012 — 10:20am
    votes: null
    html: |-
      <p>Two other options to consider when indeterminate voodoo is afoot in the FontLab file: a) Generate a Type 1 version, then open it up in FontLab to see if the problem disappears; or 2) Generate a TTF font and check to see that all of the characters are present (in Windows Font Viewer—double-click on font file—or FontBook).</p>
      <p>The latter option will show if there is a particular character that is causing problems: I had a case where none of the characters after the zero showed up. I rebuilt the zero from scratch, and everything worked fine after that.</p>
      <p>May or may not help; can't hurt…</p>
