    html: |-
      <p>Here is my very unsophisticated take on the subject:</p>
      <p>I have found that particular FontLab error message to be quite frustrating, not the least because the message is very easy to miss. Here are a few of the things that have sometimes gotten around it for me:</p>
      <p>Making sure that all the name fields in FontInfo are filled in<br>
      Shortening the name(s)<br>
      Ensuring that the encoding fields in FontInfo aren't blank<br>
      Generating the font as a TTF and then generating it as OTF (the software equivalent of kicking it)</p>
