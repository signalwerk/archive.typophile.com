      @lowercase = [a b c d e f g h i j k l m n o p q r s t u v w x y z];<br>
      @small_cap = [a.smcp b.smcp c.smcp d.smcp e.smcp f.smcp g.smcp h.smcp i.smcp j.smcp k.smcp l.smcp m.smcp n.smcp o.smcp p.smcp q.smcp r.smcp s.smcp t.smcp u.smcp v.smcp w.smcp x.smcp y.smcp z.smcp];</p>
      <p>When I exported earlier though, I deleted all this code and I still got that error message.</p>
