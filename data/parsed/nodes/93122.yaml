    html: |-
      <p>This error seems to be the catch-all when something interrupts the OTF file creation (regardless of whether the problem is actually related to the features). </p>
      <p>Some things to check:<br>
      Do you have any glyphs which are referenced in the Opentype features or classes which are empty (no character or composite in the glyph)?</p>
      <p>Are they any open contours anywhere? I've had a few instances where a single, unconnected node point showed up in a random glyph.</p>
