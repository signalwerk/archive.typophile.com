  html: '<p>Working on generating an OpenType PS font. Been troubleshooting this for over a week. Tried deleting all the classes and features then generating an OpenType PS font. It still gives me, "ERROR: There was a problem while compiling OpenType font. Final .otf font is not saved. Please, check OpenType features definition for errors." Reading through the manual, but still sure of the best way to proceed with troubleshooting –&nbsp;not clear on what to check or where the problem might lie. Thank you for any help.</p>'
comments:
  - id: 510125
    user: 6470
    date: 2012-05-17T08:52:00
    date_raw: 17 May 2012 — 8:52am
    votes: null
    html: <p>When I have gotten this error message in the past, it was usually because of syntax errors in the feature code. So, as a sensible first step, check your braces and semicolons.</p>
