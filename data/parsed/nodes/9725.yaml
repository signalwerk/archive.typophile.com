    html: "<p>Pro: No salary cap. Ability to use unstructured time efficiently. <br> <br>Con: No salary cap. Isolation. Accounting. Elevated taxes. <br> <br>As one person, you really don't have the hours to implement a complex campaign. You need small companies that have growth prospects. Don't burn bridges, even the low traffic ones.</p>"
