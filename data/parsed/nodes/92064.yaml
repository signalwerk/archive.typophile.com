  html: |-
    <p>I'm putting a new shirt up on <a class="freelinking external" href="http://www.typographyshop.com" rel="nofollow">TypographyShop</a><br>
     for the first time in awhile. I'd love this community's opinion on it and the choice of sizes for the word "counter." </p>
    <p>As I noted in a string of comments on our  <a class="freelinking external" href="http://www.facebook.com/TypographyShop" rel="nofollow">Facebook page</a>, the word "counter" has more than a couple of meanings. The O? Is it Oprah? The big O? Then the type geek wearer gets to explain what it really means.</p>
    <p>Thanks in advance for your opinions.</p>
    <p>Patrick<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/countercomparison_5787.jpg"></div><p></p>
