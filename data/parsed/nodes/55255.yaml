  html: |-
    <p>For my client, a small type foundry, I need to export TrueType version of an Type 1 OpenType font. Could you please help me to set the export options to achieve the best results?</p>
    <p>The font will be used exclusively in an office environment (there will be special OpenType "Pro" version for contracted printers and design studios). It will be used on Windows only (XP and Vista) in MS Office (Word, PowerPoint, Excel) and displayed on notebook screens or cheap LCD displays connected by VGA cable. The screen is usually 1024 px wide. All the computers have ClearType turned on.</p>
    <p>There is no time and money form proper TrueType hinting. Therefore I need help with automatic features of Fontlab Studio 5. </p>
    <p>My problem is, the font looks quite OK in basic sizes between 8 and 14. The 16-point size looks horrible. Then again, 24 point and higher looks cool. I tried to follow Victor Gaultney FontLab hinting recommendation but it didn't help much to improve the font.</p>
    <p>Should I care about the hinting at all? How would you set the values of "Font Smoothing" in Font Info? What is your advice?</p>
    <p>Thank you all for your help, I really apreciate it.</p>
