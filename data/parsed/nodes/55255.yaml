    html: |-
      <p>FontLab TT autohinting is derived directly from the PS hint model: blue zones serve as alignment zones, which can be delta's up or down to pop the e.g. the x-height or cap height at specific ppem sizes, and standard stem weights serve as link distances. So one of the best ways to improve TT autohinting results is to ensure that you have good blue-zones and stem values to begin with.</p>
      <p>Since ClearType will be turned on in all your target environments, you don't need to worry about the Font Smoothing (GASP table) settings, since these do not apply to CT rendering.</p>
      <p>The main things you will need to worry about are alignment zones and y-direction thicknesses. Again, if you have good blue zones -- i.e. that catch all the elements you want aligned at smaller sizes -- and a reasonable set of y-direction standard stems (not too many but not too crude), you should get pretty good results without too much work.</p>
