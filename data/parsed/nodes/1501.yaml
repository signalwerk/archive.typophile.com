  html: "<p>Hey all you Seattle people, I am curating a local event called BD4D - By Designers for Designers. BD4D seeks to create an atmosphere where designers can share their work in a fun and relaxed atmosphere. But what's even more important, it's FREE. Previous events have been held in London, Manchester, Sydney, Paris, LA, and New York, establishing BD4D as one of the world's foremost designer gatherings. <br> <br>BD4D is broken up into two segments. The first is 3MM (three minute madness) where a designer or studio is invited to present their work in around three minutes. Usually, this consists of focusing in on one specific piece or site. The Featured presenters have roughly 30 minutes on the stage to display and discuss a broad range of their work. Each presentations is followed by a QA session where audience members have the opportunity to question the designers on their presentations, or <br>work in general.  <br> <br>The Seattle event will be hosted at the Henry Art Gallery (<a href=\"http://www.henryart.org\" target=\"_blank\">http://www.henryart.org</a>) on Friday, October 3. Doors open at 6:30pm, but I encourage everyone to arrive early, as space is limited, and we have no idea how many people will be attending. <br> <br>I want to invite you to come see/meet the great speakers we have lined up, as well as other creatives in attendance. The speakers are: <br> <br>Featured Presenters: <br>*Gabe Kean - Born Magazine (<a href=\"http://www.bornmag.com\" target=\"_blank\">http://www.bornmag.com</a>) &amp; Second Story <br>Studios (<a href=\"http://www.secondstory.com\" target=\"_blank\">http://www.secondstory.com</a>) <br>*CrashShop - <a href=\"http://www.crashshop.com\" target=\"_blank\">http://www.crashshop.com</a> <br>*Paul Matthaeus - CEO/CCO/Founder of Digital Kitchen <br>(<a href=\"http://www.d-kitchen.com\" target=\"_blank\">http://www.d-kitchen.com</a>) <br> <br>3MM Presenters: <br>*Asterik Studio - <a href=\"http://www.asterikstudio.com\" target=\"_blank\">http://www.asterikstudio.com</a> <br>*Red October Industrie - <a href=\"http://www.redoctober.com\" target=\"_blank\">http://www.redoctober.com</a> <br>*Chris Papasadero - <a href=\"http://www.fwis.com\" target=\"_blank\">http://www.fwis.com</a> <br>*Oculart &amp; Not So Simpleton - <a href=\"http://www.oculart.com\" target=\"_blank\">http://www.oculart.com</a> &amp; <br><a href=\"http://www.notsosimpleton.com\" target=\"_blank\">http://www.notsosimpleton.com</a> <br> <br>For more information regarding the Seattle event, please refer to the promotional website at: <br><a href=\"http://www.protoculture.ws/bd4d/\" target=\"_blank\">http://www.protoculture.ws/bd4d/</a> <br> <br>or contact me at: <a href=\"mailto:nate@protoculture.ws\">nate@protoculture.ws</a> <br> <br>For other inquiries, please contact: <br><a href=\"mailto:team@bd4d.com\">team@bd4d.com</a> <br> <br>thanks, <br>Nathan Young <br>BD4D Seattle Curator <br> <br>BD4D Seattle <br>Henry Art Gallery <br>Friday, October 3, 2003 <br>6:30-9:30pm <br> <br> <br></p>"
