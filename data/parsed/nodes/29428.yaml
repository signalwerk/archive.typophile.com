    <p>The evening of November 9, <a href="/wiki/Paul%20Duensing" class="freelinking" rel="nofollow">Paul Hayden Duensing</a> lost a length battle with ill health.</p>
    <p>Without setting out to do so, he was one of the finest teachers in both the private press and avocational typefounding fields.</p>
    <p>In an act characteristic of his great generosity, he had in the last year of his life made gifts of his typefounding machines, matrices and effects to promising young people.</p>
    <p>All who knew him will miss him greatly.</p>
    <p>He is survived by his wife, Ginger.</p>
    <p>Jim </p>
