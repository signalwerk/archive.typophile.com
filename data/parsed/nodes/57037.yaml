      <p>Some really good thoughts here, thanks everyone.</p>
      <p>To me, those inconsistencies I created by joining the letters don’t jump out or anything. But that could just be because I am looking at it too long.</p>
      <p>Like the c-h connection actually feels like a good solid chunk to me. And cutting away that thick connection I made makes it feel awkward as a mark, though more accurate if you are thinking of the font.</p>
      <p>I like adding the ball to the end of the “s” though. I think that would be a good improvement as well. And separating the “i” could work. </p>
      <p>I’ll work with some of this stuff and get back to you all. Thanks for the advice, very nice to get feedback like this...</p>
      <p>-Chris</p>
