    <p>Hi everyone,</p>
    <p>I know the font-choice as the base for my personal word-mark is not extraordinarily original or anything. But I actually made the mark for use on my website. With that in mind, I felt Georgia Bold was a safe way to tie a thread between easy web-fonts and the logo itself.</p>
    <p>With a name like “Chris” I know it doesn’t stand out much. But all attempts at my last name “Meeks” were coming up empty.</p>
    <p>Feel free to rip it apart if you like. </p>
    <p>Thanks!</p><div class="imageWrap"><img src="/files/c_logo_5898.jpg"></div><p></p>
