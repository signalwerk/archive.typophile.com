      <p>Chris</p>
      <p>This is fast and furious, down and dirty,  etc...</p>
      <p>I think you need to slim the joins, separate the i from the h and knock out the serif and I really think the ball serif needs to be incorporated into the s. Raise the branch of the r and heighten the i. </p>
      <p>Remember advice is free, that tells you the value of it.</p>
      <p></p><div class="imageWrap"><img src="/files/chris_6121.png"></div><p></p>
      <p>Just keep refining until you are pleased.</p>
      <p>Edit: yes I know all the balls are different. What do you expect after a whole day with a cardiologist : )</p>
      <p>Michael</p>
