      <p>“the c-h connection actually feels like a good solid chunk to me”</p>
      <p>Yes it does, but it also creates a hot spot, a dark spot that draws the eye away from the “word.” You want the viewer to digest the mark without be drawn to 1 particular facet of the mark/design. That is the reason that I suggested cutting the serifs... minimize.</p>
      <p>When working on a word project like this I always think in terms of the pen... keep thicks from joining thicks, unless of course it is monoline.</p>
      <p>Michael</p>
