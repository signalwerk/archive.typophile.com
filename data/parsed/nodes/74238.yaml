    <p>Hi everyone.</p>
    <p>In creating my first personal identity, I've also ventured into creating my first letters. I'm very new at this so once again I'm asking for advice. I've posted information on this project a while ago and have since been heading in a different direction. Here is the <a href="http://typophile.com/node/73336" rel="nofollow">original post.</a></p>
    <p>If there are any ways to improve the wordmark, please share your thoughts.</p>
    <p>I also need to choose a primary font to go with this, and so far I've been looking at large x-heights like Axel, Info, Unit, Meta. Any suggestions?</p>
    <p>Thanks in advance. </p>
