    <p><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Online%20Translators" class="freelinking" rel="nofollow">Online Translators</a></p>
    <p><a class="freelinking external" href="http://translate.google.com" rel="nofollow">Google Translate</a>: Afrikaans, Albanian, Arabic, Armenian, Azerbaijani, Belarusian, Bulgarian, Catalan, Chinese, Croatian, Czech, Danish, Dutch, Esperanto, Estonian, Filipino, Finnish, French, Galician, German, Greek, Haitian Creole, Hebrew, Hindi, Hungarian, Icelandic, Indonesian, Irish, Italian, Japanese, Korean, Lao, Latin, Latvian, Lithuanian, Macedonian, Malay, Maltese, Norwegian, Persian, Polish, Portuguese, Romanian, Russian, Serbian, Slovak, Slovenian, Spanish, Swahili, Swedish, Thai, Turkish, Ukrainian, Urdu, Vietnamese, Welsh, Yiddish. Warning: Korean puts spaces after the colon and new languages are added every time. For example, by combining Midnight Synergy's The Wonderland Archive you can get a Slovenian version of the Wonderland Archive. Puts spaces between several punctuation marks including percentage, ellipsis, slash etc. and many other symbols that are not punctuation marks.</p>
    <p><a class="freelinking external" href="http://internettolken.se" rel="nofollow">Internet Tolken</a>: English, Swedish, German, <strong>Norwegian</strong>, <strong>Danish</strong>, <strong>Icelandic</strong>, <strong>Finnish</strong>, French, Spanish, Italian, Portuguese, Dutch, <strong>Russian</strong>, <strong>Hungarian</strong>. Coming soon: Greek. If not available, clear cache to continue translating. Note: Can use spaces between words, after end-of-sentence characters, several punctuation and many others, but it can login using an wrong password without getting alerts. If you type https on the address bar and click the flag, it will open up in a new window after translated.</p>
    <p><a class="freelinking external" href="http://www.tranexp.com:2000/Translate/result.shtml" rel="nofollow">InterTran</a>: Arabic, Chinese, Czech, Dutch, French, German, Greek, Italian, Japanese, Korean, Polish, Portuguese, Russian, Spanish, Swedish. More languages available. </p>
    <p><a class="freelinking external" href="http://www.freetranslation.com/" rel="nofollow">SDL Free Translation</a>: Arabic, Bulgarian, Chinese, Czech, Danish, Dutch, Finnish, French, German, Greek, Hausa, Hebrew, Hindi, Hungarian, Italian, Japanese, Korean, Norwegian, Pashto, Persian, Polish, Portuguese, Romanian, Russian, Serbian, Spanish, Swedish, Thai, Turkish, Urdu. Notice: Norwegian puts spaces before punctuation: ! ? : ; and others. New languages (Bulgarian, Czech, Danish, Finnish, Hebrew, Hindi, Hungarian, Norwegian, Persian, Polish, Romanian, Serbian, Swedish, Thai, Turkish) are available in Google Translate.</p>
    <p><a class="freelinking external" href="http://translation.babylon.com/" rel="nofollow">Babylon</a>: Arabic, Chinese, Czech, Danish, Dutch, French, German, Greek, Hebrew, Hindi, Hungarian, Italian, Japanese, Korean, Norwegian, Persian, Polish, Portuguese, Romanian, Russian, Spanish, Swedish, Turkish, Ukrainian, Urdu.</p>
    <p><a class="freelinking external" href="http://etranslator.dyndns.org" rel="nofollow">Millennium Computers SRL</a>: Romanian only <strong>(site down)</strong></p>
    <p><a class="freelinking external" href="http://traduku.net/" rel="nofollow">Traduku</a>: Esperanto.</p>
