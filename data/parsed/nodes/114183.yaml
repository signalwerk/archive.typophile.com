    <p>Hi there.</p>
    <p>I have to add three custom characters in Garamond Pro for the Yukagir language. It's standard Russian cyrillic, other than the three new glyphs, and I don't know how to map the characters (which I built already) so they can easily be typed with?</p>
    <p>Do I have to assign them a Unicode? How do I that as well?</p>
    <p>Thanks a lot for the help!</p>
