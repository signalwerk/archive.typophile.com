      <p>Johnny: ‘<em>Oh, and I'm doing it in Fontlab of course!</em>’</p>
      <p>Because this requires decompiling and recompiling the Garamond Pro font, an alternative –and IMHO more elegant– route would be to add the glyphs (from an .otf generated in FLS) directly in DTL OTMaster. </p>
      <p>The latest version of OTM contains an autohinter for newly added glyphs. The Unicode code points can be assigned during import (or later, of course). If necessary, the OT Layout features can be exported, altered, and recompiled in OTM.</p>
      <p>FEB</p>
