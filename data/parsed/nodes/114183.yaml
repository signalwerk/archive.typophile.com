    html: |-
      <p>To add the Unicode code points to the characters you have created in FontLab you will need to right click on the character, select Properties from the menu and put the relevant information in the upper and lower boxes. In the case of <a class="freelinking external" href="http://www.fileformat.info/info/unicode/char/51c/index.htm" rel="nofollow">Cyrillic Capital Letter We</a> you would put "uni051C" in the top (name) field and 051C in the bottom (Unicode) field.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AddingUnicodeValueFL1_4588.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AddingUnicodeValueFL2_5106.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AddingUnicodeValueFL3_5710.jpg"></div><p></p>
