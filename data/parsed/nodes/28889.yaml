    html: |-
      <p>There are some fonts that imitate Arabic, but so far I haven't found an exact match. <a href="http://www.dafont.com/catharsis-bedouin.font?nb_ppp=20&amp;text=Lupe+Fiasco" rel="nofollow">Catharsis Bedouin</a> is one that's free. Linotype has one called <a href="http://www.myfonts.com/fonts/linotype/pide-nashi/" rel="nofollow">Pide Nashi</a> that also has a similar feel, and I think Scriptorium also has several faux Arabic fonts, with <a href="http://www.myfonts.com/fonts/scriptorium/serendib/" rel="nofollow">Serendib</a> as the closest style in their collection to your sample.</p>
      <p>- Mike Yanega</p>
