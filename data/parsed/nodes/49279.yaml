    <p>Hi all, wanted to post what I think is the final mark for a jewelry designer I'm working with. Her studio is called Aubrey Ellen, she creates handmade pieces from semi-precious and precious stones and is looking at moving into doing custom design for bridal parties. </p>
    <p>I explored tons of different directions and this is the final iteration of my script-y explorations, which are very much [b]not[/b] my strong suit. I tried a variety of hand-lettered forms, none of which had the refinement needed, and then started looking for typefaces that had some of the forms I was looking for. The working name is Aubrey Ellen, this is a slight reworking and connection of a font called Jeffriana into a sort of A and e ligature. Very open to any feedback you have, as well as ideas for a typeface to pair with this for the name (which I think will be Aubrey Ellen Fine Jewelry, still finalizing that). Thanks.</p>
