      <p>Ok, I'm alive with things more or less intact, have power back and no real damage. It's been a bit of a crazy week to say the least.</p>
      <p>Joel, if I get what you're saying you want it to be one continuous stroke? I don't disagree, I'm working on that with the (hopefully) final version).</p>
      <p>Joshua, I've noticed the resemblance as well but I don't think I'm worried as it's a totally different application and really a fairly abstract form to start with. I do realize the type is a major part of the identity but wanted to develop the mark first before letting the type influence it. I am looking to see how i'd like to use the name with it and hope to have some ideas with that in the next day or two. Thanks for the feedback.</p>
