    <p>A somewhat funny headline,  I know.</p>
    <p>This is the story however, I cant seem to understand why fonts that I built in FontLab and made OTF-fonts of, show themselves in Suitcase Fusion as "Foundry: Adobe Systems".</p>
    <p>I havent provided this information any where in the font...</p>
    <p>?</p>
