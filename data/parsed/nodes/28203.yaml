    html: |-
      <p>I'm sorry Goran, didn't mean to baffle you. TTX is well explained over <a href="http://www.letterror.com/code/ttx/index.html" rel="nofollow">here</a>, but in brief: ttx wil decompile your OTF file to a xml file so you can check, modify or debug your font in a plain text environment. TTX allows for roundtripping so you can recompile your ttx file to an Open Type font file. I heard some people struggling with it, but it works perfectly for me.</p>
      <p>Paul</p>
    html_clean: |-
      <p>I'm sorry Goran, didn't mean to baffle you. TTX is well explained over <a href="http://www.letterror.com/code/ttx/index.html" rel="nofollow" class="link-external">here</a>, but in brief: ttx wil decompile your OTF file to a xml file so you can check, modify or debug your font in a plain text environment. TTX allows for roundtripping so you can recompile your ttx file to an Open Type font file. I heard some people struggling with it, but it works perfectly for me.</p>
