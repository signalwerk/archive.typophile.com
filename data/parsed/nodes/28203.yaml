    html: |-
      <p>You can find it under Font Info -&gt; Version and Identification -&gt; Identification settings. Your TrueType vendor code will be set at ADBE, which is Adobe's. This vendor code will end up in the OS/2 table of your OT font and therefore will be identified as an Adobe font.</p>
      <p>Paul</p>
    html_clean: |-
