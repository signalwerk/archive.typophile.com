      <p>It reminds me of an old dot matrix printer I had.. (something like "STAR XXX").<br>
      You can try  <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/screener/" rel="nofollow">Screener Condensed</a></strong> by  Patrick Griffin (Canada Type, 2006) or maybe <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Typodermic&amp;ffam=Telidon%20Hv%20-%20Regular&amp;fid=6d2a14fc5a7a04f51a9ef28cc2b6df11&amp;fsize=60&amp;text=ABCDEFGHIJKLMNOPQRSTUVWXYZ%2001234567890&amp;wrap=2" rel="nofollow">Telidon</a></strong> by  Ray Larabie (Typodermic, 2001) if you want the dots to be visible ;)</p>
      <p>------------------<br>
      I found them using "Find my Font": <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
