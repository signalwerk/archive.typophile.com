    html: |-
      <p>So the weird urls are because there is an open wildcard dns entry on typophile.com (<a href="http://ma.tt/2003/10/wildcard-dns-and-sub-domains/" title="http://ma.tt/2003/10/wildcard-dns-and-sub-domains/">http://ma.tt/2003/10/wildcard-dns-and-sub-domains/</a> if you geek out on internet routing and dns, not jut type ;). What is worrisome is that they don't have a canonical url setup so if google indexes any other weird domains then they will be seen as duplicate content which will tank rankings.</p>
      <p>This shouldn't be difficult to fix. If a site admin sees this feel free to get in touch.</p>
