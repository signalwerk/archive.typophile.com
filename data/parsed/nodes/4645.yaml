    html: <p>Shall I assume that the recent onslaught of restaurant logos are all from the same school assignment? <br> <br>Roh, in contrast to some of the other commentary on this thread, I kind of like the concept of a kitch restaurant, and further, I think the name is clever. Some restaurants have been bold enough to take the risk of exposing themselves for what they really are (eg. Fat Burger). I don't see any problem, or deterent, for a restaurant to serve ordinary, regular, uninteresting, "cliche" or "kitche" food, on kitche dishes in a kitche environment. I might even visit a few times on those days when I'm tired of everyone trying to keep up with the really cool trends and fads. It might be refreshing to experience honest poor quality</p>
