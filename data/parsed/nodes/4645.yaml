  html: <p>Hi. This is a logo Im working on for a local restaurant. It specialises in dishes that seem a bit cliche and kitsch (hence the name), but are given a modern twist. To reflect this I am trying to create a 1950's reference in the identity i'm creating, but I don't really know if the logo is working at the moment... any suggestions? what do you make of it? <img src="http://www.typophile.com/forums/messages/29/35329.gif" alt="kitschen logo"></p>
