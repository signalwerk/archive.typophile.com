    <p>Hello everyone.</p>
    <p>I am writing a technical book about web development, and it will include a considerable amount of CSS and HTML code examples. What are some good typefaces to set this text in?<br>
    The basic requirements here are that it be monospaced and readable.<br>
    I noticed that some popular choices are Monaco and Andale Mono. What other alternatives are there?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/40478" class="topic-previous" title="Go to previous forum topic">‹ Segmented fonts?</a> <a href="/node/40296" class="topic-next" title="Go to next forum topic">Help with Poster Design ›</a></div>
