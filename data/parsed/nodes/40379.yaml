      <p>Thank you for your suggestions! I will look them through.<br>
      @aluminum: I am pretty sure Wrox doesn’t have a local branch in Romania :) And indeed, their books can sometimes look rather uninspiring.</p>
      <p>I am trying to do most of the work by myself, including typesetting and illustration, partly because I enjoy doing it, and partly because it’s an opportunity for me to develop some new skills.</p>
      <p>After searching the web for additional information, I found this <a class="freelinking-external" href="http://typographica.org/000744.php">thread</a> over at Typographica. Lots of great information!</p>
      <p>I’m also considering TheSans Mono by Luc(as) de Groot. Seems a pretty nice typeface.</p>
