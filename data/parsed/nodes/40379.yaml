      <p>Andale Mono is excellent. Here a few others that I highly recommend: <a href="http://dejavu.sourceforge.net/wiki/index.php/Main_Page">DejaVu Sans Mono</a> (which is an improved version of  <a href="http://www.bitstream.com/font_rendering/products/dev_fonts/vera.html">Bitstream Vera Sans Mono</a>), <a href="http://www.ascendercorp.com/pr/pr2007_11_12.html">Droid Sans Mono</a>, and <a href="http://www.ascendercorp.com/msfonts/consolas.html">Consolas</a>.</p>
      <p>(I am a coder who spends many hours a day staring at code, both on screen and in print, so I have strong opinions about which fonts are good.)</p>
