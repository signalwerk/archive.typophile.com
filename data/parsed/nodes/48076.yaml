  html: |-
    <p>Hi all, </p>
    <p>I am working on a brand for a charity. I have a concept in place for imagery, I plan to use Nautical style imagery, nice black and white images of lighthouses, waves crashing against the rocks etc. </p>
    <p>As part of the brand, I am working on the logo, I was wondering if somebody can help me with font ideas that would work well with this style of imagery, a font that has a gentle nod to the nautical side of things, yet strong enough to stand on its own. The style of imagery may change in the future, therefore, the font needs to have a timeless feel.</p>
    <p>I am currently working with Adobe Garamond Pro, but would love some more creative variations.</p>
    <p>Appreciate any help.</p>
