    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Organizations" class="freelinking" rel="nofollow">Organizations</a> : The American Printing History Association</strong></p>
    <p>The <strong>American Printing History Association</strong> (APHA) was founded in 1974 to encourage the study of printing history and its related arts and skills, including calligraphy, typefounding, typography, papermaking, bookbinding, illustration, and publishing. APHA is especially, but by no means exclusively, interested in American printing history.</p>
    <p>APHA publishes an journal called <a href="/wiki/Printing%20History" class="freelinking" rel="nofollow">Printing History</a> which is only available to members.</p>
    <p><a href="http://www.printinghistory.org/" title="http://www.printinghistory.org/">http://www.printinghistory.org/</a></p>
