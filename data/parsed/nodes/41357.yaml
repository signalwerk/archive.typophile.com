    <p>Current <span class="caps">URL</span>:<br><a href="http://www.lineto.com/The+Fonts/Font+Categories/Text+Fonts/Gravur+Condensed/">http://www.lineto.com/The+Fonts/Font+Categories/Text+Fonts/Gravur+Conden…</a></p>
    <p>Designed by <a href="/node/add/wiki?edit%5Btitle%5D=Cornel%20Windlin" title="Create node &quot;Cornel Windlin&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Cornel Windlin</a> <span class="amp">&amp;</span> <a href="/node/add/wiki?edit%5Btitle%5D=Gilles%20Gavillet" title="Create node &quot;Gilles Gavillet&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Gilles Gavillet</a> 1996-2001</p>
    <p>Published by <a href="/node/14102" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Lineto</a></p>
    <p>One of the key features of everyday life in switzerland is standardisation, ranging from the look of waste bags to the design of letterboxes. interestingly, and maybe perversely, 99% of all swiss letterboxes and door bells are inscribed in exactly the same way. there must be a whole army of name plate engravers all over the country, all using exactly the type style. i redraw the font together with gilles gavillet, generating 5 different weights (and an unpublished set of 5 alternate&nbsp;fonts).</p>
