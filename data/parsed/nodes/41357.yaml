    <p>Current URL:<br>
    <a href="http://www.lineto.com/The+Fonts/Font+Categories/Text+Fonts/Gravur+Condensed/" title="http://www.lineto.com/The+Fonts/Font+Categories/Text+Fonts/Gravur+Condensed/">http://www.lineto.com/The+Fonts/Font+Categories/Text+Fonts/Gravur+Conden...</a></p>
    <p>Designed by <a href="/wiki/Cornel%20Windlin" class="freelinking" rel="nofollow">Cornel Windlin</a> &amp; <a href="/wiki/Gilles%20Gavillet" class="freelinking" rel="nofollow">Gilles Gavillet</a> 1996-2001</p>
    <p>Published by <a href="/wiki/Lineto" class="freelinking" rel="nofollow">Lineto</a></p>
    <p>One of the key features of everyday life in switzerland is standardisation, ranging from the look of waste bags to the design of letterboxes. interestingly, and maybe perversely, 99% of all swiss letterboxes and door bells are inscribed in exactly the same way. there must be a whole army of name plate engravers all over the country, all using exactly the type style. i redraw the font together with gilles gavillet, generating 5 different weights (and an unpublished set of 5 alternate fonts).</p>
