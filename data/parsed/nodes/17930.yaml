    html: <p>Rather than start on the computer you should really get out a pencil and paper. Think about the many different variations of style that the letterforms can take. Look at other lettering artists and ambigram artists to see how they do things. In the end you may have to pay someone to do this if it’s really what you want. What you have right now is rather ’mish-mashy’, keep trying...don’t be content until it’s perfect.</p>
