      <p>I agree with cerulean that the “r” is getting a bit lost. I know that it is difficult to work around but the flourish at the end of Karin is a bit confusing. I know that you need it for Francois. I recently designed a tattoo for myself using my two daughters names. It is a bit different because the names are stacked. Each name is an ambigram, so you read it one way it says Kendall/Kylie. The other way it says Kylie Kendall. Just another way to think about it. Good Luck! </p>
