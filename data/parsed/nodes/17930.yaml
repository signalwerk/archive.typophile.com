      <p>John’s book doesn’t really tell much more than what he gives here on this part of his webpage: <a href="http://johnlangdon.net/ambigrams.html" title="http://johnlangdon.net/ambigrams.html">http://johnlangdon.net/ambigrams.html</a> In the book he dives a bit further into his process, but again it’s an artform and you can’t really spell it out. It’s easiest to experiment over and over and over until you find something that works, learning what corners you can cut so letters are still recognizable.</p>
      <p>On the other hand...go buy his book. John is an amazing artist, wonderful professor and basically my mentor at school/inspiration for love of type. You’ll enjoy it even if you don’t end up with a finish of this project!</p>
