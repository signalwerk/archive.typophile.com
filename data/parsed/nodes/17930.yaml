      <p>I think your basic approach is sound and some of the letter combinations are working well, as you say patience and perserverance are going to be required, you could look at <a href="http://typophile.com/node/1516?from=0&amp;comments_per_page=50">this thread</a> for some ideas. The approach I take is to draw the letters from one direction, turn the page and amend to work the letters from another direction, trace it and start the process again, whether I am working on paper or direct on the computer. Combining letters or using swashes to create a letter* from the opposite direction can be productive, especially when you have different number of characters in the two words.</p>
      <p>Keep at it,<br>
      Tim</p>
      <p>*or indeed the way you created the cedilla</p>
