      <p>I think you’re onto something with your ’k’ becoming an ’is’. Just needs a little straightening out to make it work with the other characters.</p>
      <p>I think you could eliminate the stroke leading into the a in Francois and bend the bowl of the a back to the right a bit to make the a more obviously an a without compromising the n. I believe the o in Francois could also get rounder as long as you keep that incoming stroke that makes it an a. Finally, the F might read better both as F and E if the top horizontal was not detached from the stem.</p>
      <p>It’s very cool to see sketches in progress - save these when you’ve arrived at a result, they’re great. And don’t give up hope, you’re almost there.</p>
