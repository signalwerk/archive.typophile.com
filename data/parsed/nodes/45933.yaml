    <p>I am using Eurostile extended two.</p>
    <p>It s perfect but I need to make it a little thicker. I already used the "faux bold " option in photoshop and the "strong" option as well.</p>
    <p>Is there any trick to make it thicker, like a 2X faux bold for example? </p>
    <p>Is it safe to Magic Wand it and expand the selection?</p>
    <p>Thanks a lot!</p>
