    html: |-
      <p>If you're type is already rasterized it's easy. There are two methods.</p>
      <p>Method 1. Make a loose selection with the lasso tool and then (holding option or alt) deselect the white surrounding the letters. Make sure your tolerance is set low for the magic wand. Go Edit/Stroke. Select 1 pixel (Black) on Outside. This will add just a tiny bit of weight. If not enough undo and try more.</p>
      <p>Method 2. Select around letters again with the lasso tool. Go Filter/Other/Minimum. A window will pop up with a preview. Again, try 1 first and see if it's enough. </p>
      <p>The Minimum command tends to be a little heavier in adding weight, but is usually smooth. I think if your type remains vector you might also be able to convert it to a path and stroke that path in the paths menu. I haven't tried that so can't help you there.</p>
      <p>Stephen</p>
