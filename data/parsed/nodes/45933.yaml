    html: |-
      <p>Although this is not a reccomendable way to make something bolder,<br>
      you may try this:</p>
      <p>+ Type something in your Photoshop<br>
      + Select the text layer<br>
      + From the top menu, go to &gt; Layer &gt; Layer Style &gt; Stroke...<br>
      + Now you can decide the stroke thickness and also can change the color of the stroke as same as your text.</p>
      <p>I hope this will help.</p>
