    html: |-
      <p>This is the reaction directly from Quentin about how he made the chart:</p>
      <p>====================<br>
      Hi,</p>
      <p>This is really funny to see some people debatting on something I didn't sleep because of.</p>
      <p>So, here is my "hard" way (you found the solution on the forum):</p>
      <p>1- draw one line, and then rotate with the angle you want.<br>
      2- pathfind the lines with one circle to have the size you want.<br>
      3- ungroup.<br>
      4- link the lines with the threated text option (CS4, CS3?)<br>
      	Sometime, the links between the text field are not really good. Try linking only 5 to 7 lines, after that you link the blocs each other. If it really doesn't work, try making it one by one (I did it :-S).<br>
      5- You can now import your text.</p>
      <p>Problems:<br>
      - no hyphenate (hand made in my case),<br>
      - sometimes when you press "enter", the next line will jump 3 or 4 lines. To correct: double enter + apple (ctrl) Z</p>
      <p>I know it's quite complicated and not really quick. But I didn't find other way. So if you find something better?</p>
      <p>Regards,<br>
      Quentin<br>
      ====================</p>
      <p>Thanks a lot for your input.<br>
      ®</p>
