    html: |-
      <p>The closest i get to that in illustrator is:</p>
      <p>1) made 2 circles, align them (easier to find the center in the small one)<br>
      2) Use smart Guides to find the exact center<br>
      3) make a path line, select it use rotate<br>
      4) move the rotate point to the center of the small circle<br>
      5) when u realese the button you choose your deggres, i made 2 for example<br>
      6) After Command + D repear your last step, so keep pressing to make the pattern.<br>
      7) type in each line your text (use Type on path option to find exact what you want)<br>
      in my fast example i used on center (rainbow)</p>
      <p><a href="http://img16.imageshack.us/my.php?image=circle.tif" title="http://img16.imageshack.us/my.php?image=circle.tif">http://img16.imageshack.us/my.php?image=circle.tif</a></p>
