      <p>I suppose you would have to do it "the hard way":<br>
      1) Draw a line in Illustrator,<br>
      2) Rotate it 5 degrees, say, and copy,<br>
      3) Repeat #2 until you have enough lines. At this point they will begin to look like the spokes in a wheel.<br>
      4) Start typing on each line. :-)</p>
      <p>Maybe someone else knows an easier way. But that's how I would do it.</p>
