  html: |-
    <p>Tightly kerning a modified Swift small caps for a heading and ran into a problematic space between the "R" and "A" perhaps caused by the combo of a conservative shoulder and long leg of the "R". I've actually extended the shoulder a bit and taken some of the lean out of the "A" to try to tighten this up.</p>
    <p>Was curious what you typographic experts recommend in terms of kerning for this pair.</p>
    <p>From top to bottom:</p>
    <p>1. Spaced so bottom of characters are spaced consistently<br>
    2. Joined legs to create a bowl<br>
    3. Shared serif...air between letters looks good but creates tension at the join<br>
    4. Clip left serif of "A"..."R" serif takes precedence and reads well, but too close for comfort</p>
    <p><img src="http://i.imgur.com/YNGVG.png"></p>
    <p>Providing the smaller sample b/c sometimes viewing from a "distance" helps...</p>
    <p><img src="http://i.imgur.com/8QWhj.png"></p>
    <p>Thanks!</p>
