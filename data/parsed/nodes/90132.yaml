  html: |-
    <p>Hello folks,</p>
    <p>Having done some Arabic typesetting in the past, I now need to set a few pages in Persian for a book. This has made me realise the many subtle differences between Arabic and Persian typesetting (bit slow, I know). Apparently it is difficult to find information on this in English on the web, and I have this particularly nagging (because visually prominent) question:</p>
    <p>in Persian, should there always be a space between a conjunctive waw and the following word?<br>
    is this space (if mandatory) breakable, or no line breaks are allowed after it?</p>
    <p>For example:<br>
    in Arabic you would write "wasalAm"<br>
    وسلام</p>
    <p>in Persian, do you write "wa salAm"?<br>
    و سلام</p>
    <p>is that an optional thing?</p>
    <p>Many thanks in advance for your help,<br>
    Juan</p>
