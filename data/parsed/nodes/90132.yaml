    date_raw: 17 Feb 2012 — 12:26pm
    votes: null
    html: <p>BTW, in Arabic both forms are permitted depending on the preference of the author (it is partly regional), I myself use a thin non-breaking space for typeset material, otherwise no space at all to avoid a waw by itself at the end of the line (which is as bad as a comma at the beginning of a line). No idea about Persian, though.</p>
