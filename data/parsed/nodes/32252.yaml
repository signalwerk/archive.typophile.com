      <p>Thank you MT!!! You know, I downloaded that [garamond premier pro] when I purchased CS2 as it was a freebie, and I have been guilty of overlooking this typeface. The K swash is just right, as it's the first  character in the logotype. </p>
      <p>So there's the easy bit...  now I have to win them over with some convincing designerbabble to avoid publishing something that will be spoiled by a bad typeface choice!</p>
      <p>I guess a designer's opinion doesn't count for much until he/she hits the big time... moan, gripe, winge...</p>
