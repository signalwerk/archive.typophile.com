  html: |-
    <p>Some time ago I developed a logo for a customer using Galahad. I am working on a project where I am being pressured to use Garamond Pro as the logo type and I think it looks awful... Due to the business of the customer having changed in recent times toward the elegant, I am looking for something with mild swashes, that isn't too far departed from Garamond in an attempt to save my project turning into a design nightmare...</p>
    <p>Maybe the most important question I am asking is - what arguments do you guys employ when you are trying to win over a marketing person from the dark side?</p>
    <p>Thanks, and be gentle, it's my first post (having enjoyed reading the forums here for a few weeks)...</p>
    <p>Steve</p>
