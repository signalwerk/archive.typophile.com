    <p>The Double Acute accent, or Hungarumlaut, is a character that practically only occurs in the Hungarian language. Months back I posted a thread about it, because I feel there's a basic problem with the way the glyphs /ő/ and /ű/ are normally drawn, based on what I percieve to be a set of faulty guidelines for how to draw it. Not sure it matters immensely, but this site is for detail fanatics, isn't it? :D</p>
    <p>The <a class="freelinking external" href="http://diacritics.typo.cz/index.php?id=24" rel="nofollow">Diacritics Project</a> claims, in line with how most faces are drawn, that the double acute is meant to be <strong>optically centred</strong> over the character. Quite a common practice is also to set the accents <strong>tight</strong> next to each other, see for instance in <a class="freelinking external" href="http://new.myfonts.com/fonts/marksimonson/proxima-nova/thin/characters.html" rel="nofollow">Proxima Nova</a>. I percieve both these aspects as "wrong" - I admit from the start - because the diacritic is used as a "long" version of the umlaut, and should therefore as far as possible be <strong>spaced apart</strong> as much as a diaresis, and also (because it's "rooted" in the umlaut) <strong>lean significantly to the right</strong>, <em>not</em> optically centred but right of optical centre.</p>
    <p>I was on holiday in Hungary recently and took the opportunity to photograph some signs around town with double acutes on them. I decided to focus mainly on lettering, because this I think gives a good impression of how people "instinctually" draw the glyphs. But let me start with a stickerier tale of two /ő/s: </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Budapesty-4030_5784.jpg"></div><p></p>
    <p>Now, this is clearly not lettering, but I think it reflects the dilemma quite well: In the top row, the sign maker has put the diacritics off the stickers as originally intended in the typeface, close to each other and optically centred; in the bottom row their feel for the writing has slippd in and they've spaced the diacritics wider than intended and put them futher right. I saw plenty of other examples of this "mis-stickering":</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Budapesty-4031_4901.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Budapesty-4029_5562.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Budapesty-4032_5807.jpg"></div><p></p>
    <p>The last one is tight but still "too far right" by convention.</p>
    <p>Most extreme right-misstickering I saw all trip:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Budapesty-2571_5378.jpg"></div><p></p>
    <p>Thing is. When taking pictures of signs my original impression of what was "right" or "wrong" got several more complications. To be fair, there are examples of several kinds below - pure lettering examples, some draughtsman's lettering, some engraved, some digital, some hand-painted:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Budapesty-4025_4009.jpg"></div><p></p>
    <p>Traditional Budapest street signage. BIG accents, right-leaning.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Budapesty-4027_5960.jpg"></div><p></p>
    <p>Sort of a counterexample, but still clearly derived from and related to umlaut - low, flat, centred.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Budapesty-4026_3884.jpg"></div><p></p>
    <p>Another sort of counterexample, but again clearly related to umlaut in shape and placement as before. This one is actually left of optical centre!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Budapesty-3796_4439.jpg"></div><p></p>
    <p>Some ****-off accents right there!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Budapesty-4028_6451.jpg"></div><p></p>
    <p>Sort of centred, but <em>very</em> widely spaced apart.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Budapesty-3427_5966.jpg"></div><p></p>
    <p>I realise it's script, but look how far right it goes compared to convetion! It also introduces <em>another</em> (still, I want to point out, umlaut-derived and related) variation I saw quite a bit on the hungarumlaut theme:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Budapesty-3487_5249.jpg"></div><p></p>
    <p>Long, tall, vertical lines for accents. The idea is similar to how they're drawn in hungarian handwriting.</p>
    <p>(I also had this great example of DIN-Engschrift-like draughtsman's lettering with entirely vertical lines for accents, which I think worked quite well. Seem to have lost it in my directory though, can't seem to find it alas.)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Budapesty-3959_3784.jpg"></div><p></p>
    <p>Off a gravestone. Mostly still the "enlongated style" - very relatable to the umlaut!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Budapesty-3960_6077.jpg"></div><p></p>
    <p>Part of a memorial wall in the cemetary. Right-leaner.</p>
    <p>-------------------------------------------------------------------</p>
    <p>So. What do you think? If I've learned anything it is to clearly relate the double acute to the umlaut. Am I right in thinking that?</p>
