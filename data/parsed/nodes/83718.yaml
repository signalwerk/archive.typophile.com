    html: |-
      <p>To a certain extent, I guess. Though considering the number of Hungarian type designers today (we're not talking Kis Miklós here) it's worth remembering that the vast majority of typefaces are designed by people who don't read or use Hungarian.</p>
      <p>What I'm trying to suggest here is that Hungarians who do read the language largely see contemporary design practice as "wrong" - in feel, if nothing else - compared to how they understand the symbol to be. It would be interesting to do a survey among typography-aware Hungarians but this is as close as I've got right now, that and my own instinct. :)</p>
      <p>What problems would arise typographically - besides I guess kerning ones - from spacing out the accents more loosely and allowing a slight rightward overhang?</p>
