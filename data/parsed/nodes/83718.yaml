      <p>Some typefaces shown here didn't have right diacritrics or didn't have diacritics at all. So they were added - as you can see on pictures 2,3,4,9,12 - later. This situation: misstickering, adding accents reflecting handwriting (or just imaginary ones), is typical for small "adveritsing" business in probably all postcommunistic countries. </p>
      <p>For me, the best examples are: the first row of 1, then 6,7,8.</p>
