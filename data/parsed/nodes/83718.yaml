    html: <p>Personally, I think that "we" (I mean people using acutes), prefer when they lean a bit more to the right from the optical axis, because this kind of accent has a strong "vector". When the stroke leans to the right, it seems to refer to the inside part of a given, not preceding, letter.</p>
