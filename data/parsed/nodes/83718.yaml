      <p>It always is interesting and sometimes - refreshing.<br>
      But it's contemporary type designers, who dictate the rules (or the typefaces dictate rules to the type designers), and vernacular solutions wouldn't work well in a font.</p>
      <p>(Many Poles, including me, write a- and eogonek with the tail turned leftwards, what is opposite to the norm, but I can't imagine the use of such form in [even a script] typeface - that would cause both readability- and typedesign-specific problems.)</p>
