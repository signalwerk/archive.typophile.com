      <p>I've just taken a look at a specimen of ITC Garamond, and in some searches, I noticed some comments here criticising ITC Garamond as not being a particularly good or authentic Garamond. It turns out that ITC Garamond, like Linotype Garamond Bold No. 3, closely resembles the font in the book I have that I think is actually Journal Roman.</p>
      <p>So this ends up tying into the original poster's query. I do know that there are fonts which differ in appearance that are called Garamond - looking at fonts that came with a word processing program, and fonts that come in various collections of inexpensive fonts has led me to that.</p>
      <p>Of course, I also know what Garamond should look like; Grillot de Givry's book about witchcraft and the like is one recent example of a book set in a... standard... version of the face.</p>
