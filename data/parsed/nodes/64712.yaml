      <p>Yes, the Composer did have a Garamond typeface, but I don't believe it was ITC Garamond.</p>
      <p>They had Press Roman, which was an imitation of Times, they had Aldine Roman, which belonged to the same general family as Bembo, and they had Bodoni and Garamond and Baskerville and, I think, Schoolbook. The only licensed font that they had was Univers, if I remember correctly.</p>
      <p>As it happens, though, one of their monospaced fonts for the Selectric Typewriter, Adjutant (and its corresponding 12 pitch font, which is under another name), except for having round dots, was clearly designed to resemble... Goudy Old Style.</p>
    html_clean: |-
