      <p>I'm afraid you are right, and I was mistaken. I have a copy of a book that was clearly typeset on a Selectric Composer, "Modern Computer Concepts: The IBM 360 Series" by Edward J. Laurie (South-Western Publishing Company), and the font in which it was chiefly set looked to me like Garamond Bold - but it was actually Journal Roman.</p>
      <p>Originally, the Composer had the following five fonts available for it: Press Roman, Univers, Aldine Roman, Bodoni Book, Pyramid. The others - Theme, Journal Roman, Classified News, Baskerville, and Copperplate Gothic - were added later.</p>
