      <p>I was unable to find a list of composer fonts after a web search, but I remember another of its fonts: Pyramid. This font was an Egyptian, that is, it resembled Stymie.</p>
      <p>Although its unit system was not as fine as that of Monotype equipment, I think the resolution of the system was probably satisfactory. Although the Selectric mechanism was a high-quality typewriter mechanism, though, typed characters would often be out of alignment, and that is usually the easiest way to distinguish texts composed in this way.</p>
      <p>Instead of the resolution of the unit system, and in addition to the physical limit noted above, the most significant limitations of the Selectric Composer, in my opinion, were:</p>
      <p>- It used one unit arrangement for all typefaces. Later electronic models allowed one to use a two-digit code to select different spacings, so as to use a Copperplate Gothic element with two sizes of capitals, or a Cyrillic element, but the first model was mechanical.</p>
      <p>- In order to be able to handle type sizes up to 11 points on the existing Selectric typeball, the widest characters (capital M, W) were not as wide as they should have been relative to other characters in the same font. Instead of 9 units, they should have been 11 units, it seems, as can be seen by comparing the ratio between Monotype width and Selectric Composer width.</p>
      <p>Oh, yes: I had a good laugh when in my Google searches I found that IBM had issued a system of font classification in which Times Roman was given as the canonical example of one class of type, and Press Roman, basically their copy of Times Roman for the Composer, was given as the example for a related, but distinct type classification.</p>
