    html: <p>On page 16 of <a href="http://www.google.com/url?sa=t&amp;source=web&amp;ct=res&amp;cd=1&amp;ved=0CAcQFjAA&amp;url=http%3A%2F%2Fwwwimage.cbsnews.com%2Fhtdocs%2Fpdf%2Fcomplete_report%2Fappendix_4.pdf&amp;ei=3cQNS7TCLcWTlAer2rCPBA&amp;usg=AFQjCNHbx12wvlwaSAzv8YRCrQ0P0IWg-w">this 18-page document</a> you can find the showing of some proportional fonts for the IBM Selectric Composer. They came in several point sizes. I loved using Journal Roman; that was a simplified version of Janson (Kis). However, I do not recall any version of Garamond that was developed for the Composer.</p>
