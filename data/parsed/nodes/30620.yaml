      <p>BTW, I’m very interested in “progressive” fonts in scripts I don’t have nativity in (which is, like, all of them except three) and the Glendale area happens to have a huge Korean community, with their video rental stores exhibiting a dazzling spectrum of liberated letterforms. The other day I saw a pretty amazing rendition of Hangul - it almost looked like a totally different script - and I went back to take a photo... Well, that poster is gone, but I took the following four photos, and would be very interested in learning of how a native sees the type.</p>
      <p>Seeing as what day it is...<br>
      </p><div class="imageWrap"><img src="/files/HangulPoster1_5651.jpg"></div><p></p>
      <p>—</p>
      <p>Tibetanized? Or just Euro-medieval?<br>
      </p><div class="imageWrap"><img src="/files/HangulPoster2_5408.jpg"></div><p></p>
      <p>—</p>
      <p>Couldn’t bear to chop off that pretty scalp.<br>
      </p><div class="imageWrap"><img src="/files/HangulPoster3_4251.jpg"></div><p></p>
      <p>—</p>
      <p></p><div class="imageWrap"><img src="/files/HangulPoster4_3873.jpg"></div><br>
      Is this last one easily readable? That would a pleasant shock.<p></p>
      <p>hhp</p>
