    html: |-
      <p>Hrant, that last one is indeed easily readable. (It says, literally, “salt doll”. I was intrigued by this title, which I haven’t seen before, and a quick bit of googling tells me it’s the name of a TV drama series.) Informal lettering written with a brush is all the rage these days in South Korea, appearing on everything from food packaging, signs on restaurants, and TV titles.</p>
      <p>It’s fascinating for me to imagine how Korean lettering and fonts must look to those who don’t read Korean. Being a native reader, it’s not something I have had a chance to think about very often. I wouldn’t have stopped to think that yes, it makes sense that someone who doesn’t read Korean would wonder whether an example like the one above would be easily readable. I can’t be completely objective in judging how my own familiarity affects how I read different scripts, but I think it’s a credit to Hangul (and good news for Korean lettering artists) that the glyphs can be so playful and informal without hurting readability.</p>
      <p>By the way, ugh on that first example with all the pink and all the hearts. Though I just possibly may be bitter about having to do an all-night shift on St. Valentine’s Day.</p>
