    html: <p>Missgiggles, most clock fonts here in Sweden are set in Exocet, but instead of the number 7 we use the symbol Æ because of a treaty signed with Denmark in 1974.  My brother Erik lives in glorious Nippon (Japan) and there they use Roman numbers on their wall clocks as well as their digital wristwatches.  But don't be confused, lol, their clocks read counterclockwise because their language reads in a different way than English.</p>
    html_clean: <p>Missgiggles, most clock fonts here in Sweden are set in Exocet, but instead of the number 7 we use the symbol Æ because of a treaty signed with Denmark in 1974.  My brother Erik lives in glorious Nippon (Japan) and there they use Roman numbers on their wall clocks as well as their digital wristwatches.  But don't be confused, lol, their clocks read counterclockwise because their language reads in a different way than English.</p>
