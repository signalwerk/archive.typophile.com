    html: |-
      <p>Pavel,</p>
      <p>why Light Display (I guess you mean Regular Display)?</p>
      <p>What is "garamondiest"?</p>
      <p>You may want to have a look at the specimen section at the end of <a class="freelinking external" href="http://www.atypi.org/eventfiles/StPetersburg_Ahrens_OpticalSizes_paper.pdf" rel="nofollow">the paper for my presentation in St Petersburg</a> and decide for yourself.</p>
      <p>I am pretty sure you can't get more faithful than Garamond Premier – all sizes are equally faithful because each is true to a certain size of Garamond's original.</p>
      <p>Stempel Garamond is great but it's certainly not the most faithful.</p>
