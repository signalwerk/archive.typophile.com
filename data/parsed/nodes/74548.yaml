  html: <p>Which of the many Garamond fonts out there right now is closest to the original fonts cut by Claude Garamond? It seems to me that Garamond Premier Pro (especially the Light Display) is the garamondiest, but I've heard some praise for Stempel Garamond among others.</p>
  html_clean: <p>Which of the many Garamond fonts out there right now is closest to the original fonts cut by Claude Garamond? It seems to me that Garamond Premier Pro (especially the Light Display) is the garamondiest, but I've heard some praise for Stempel Garamond among others.</p>
