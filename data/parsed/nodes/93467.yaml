    <p>Hi. I'm looking for helpful feedback about my direction, both in choosing and adapting Freehand521 for a start-up clothing company.</p>
    <p>Basically, I'm driving towards a clever, whimsical, slightly nostalgic feel (think letterman jackets, patches, or baseball uniforms –&nbsp;but with a hip, perhaps sexy, modern twist) – particularly agreeable to women primarily both for themselves and their children (infants to kids), very appealing to teen girls and slumber parties and their boyfriends (the dynamic that draws boys into cute and fun interactions with their first high-school and college crushes)...but ultimately a sexy "cute" for couples who define themselves young at heart...and not entirely beyond the reach of an adult man who too might have a playful demeanor or a father to daughters or neices.</p>
    <p>The name "Zip**" (I'M REQUESTING NOT TO BE TYPED HERE, SO HIDDEN FROM SEARCH ENGINES) cannot be altered and has a lot of meaning, based on the design of the garments (which employ a new zipper technology).</p>
    <p>The capital "Z" of the font was not a clearly, legible design so I worked out one that didn't curl but was more instantly recognizable. I also added a little wispy curl to the lower-case "z".  "Zip" I wanted together, and "zi" separate but together, the latter to be added to product names (think Citi of Citibank, Citigroup, etc.).</p>
    <p>Hope this makes sense.  I'm just curious if other professionals agree this hits the marks I've described, or have suggestions to confirm a better font selection or adaptation.</p>
    <p>Cheers, in advance. </p>
    <p>PS: Color and pattern treatments available upon request, along with product naming conventions I've explored</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Zip**LogoBW_6546.png"></div><p></p>
