  html: |-
    <p>I've just brought in a redesign of a student newspaper and would be interested in your thoughts on it. Next issue goes to print next week and we want to make it (even) better :)</p>
    <p>You may particularly like/dislike my article on fonts on page 7... used throughout is Utopia, with Gotham Bold signposting/pagenumbering. The main logo on the front page is Futura Bold.</p>
    <p><a href="http://glasgowguardian.co.uk/featured/2011-09-13/" title="http://glasgowguardian.co.uk/featured/2011-09-13/">http://glasgowguardian.co.uk/featured/2011-09-13/</a></p>
