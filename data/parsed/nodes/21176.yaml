      <p>Hi Joseph</p>
      <p>Well did you want <a href="https://web.archive.org/web/20080905061547/http://www.linotype.com/580/itcberkeleyoldstyle-family.html">Berkeley,</a> which is just a rather pale ITC imitation of Fred Goudy’s University of California Oldstyle, or did you want the <a href="https://web.archive.org/web/20080905061547/http://www.p22.com/lanston/products/californian.html">real thing?</a></p>
      <p>As the Lanston site will tell you, this one was commissioned for a book by Goudy called <a href="https://web.archive.org/web/20080905061547/http://www.typeart.com/reference-books/typologia/typo-contents.html">Typologia.</a> As I happen to own a copy, I can tell you that it appears very differently on paper than it does on the screen. Goudy set it large as a text face, about 14pt, with only an extra point of leading and a 27 pica column width.</p>
      <p>Gosh but it’s beautiful. I’<!--
