    <p>Does anybody here know anything about doing that?  I used my own handwriting for a job and the client loves it, problem is they keep editing the text and I'm getting tired of rewriting it.</p>
    <p>Is there a relatively inexpensive software that easily digitize handwriting? I don't need a full character set, just upper and lower case and punctuation. </p>
    <p>Or is there someone here who has experience doing this? If you are interested, contact me through my page here. I'd need this done fairly quickly, as in the next week or so.</p>
    <p>I'm also attaching a jpeg of my writing if anybody can think of a font that could reasonably approximate it and is not wildly expensive.</p>
