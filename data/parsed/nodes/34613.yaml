    html: <p>I have a font that was made from the AD's handwriting for a mutual client by a Finnish type designer (I heard her name once, but forgot it, typical!). It's an Open type font, with alternates like Hj, kk, os, st, aa, ta, ll, etc. I don't know how long it took her to design it, but it works very nicely and looks quite realistic.</p>
