      <p>Well, I bought "Eigen Handschrift Lettertype" (My own handwriting) for €10,-, but it demands a lot of finetuning afterwards.</p>
      <p>Another option might be "My Font Tool for Tablet PC" although it's said it only works on Tablet PC's, once extracted from the *.MSI file (using 'LessMSIerables') you can run the programm and create a font by using a tablet... No OpenType in theze lowbudget-solutions.<br>
