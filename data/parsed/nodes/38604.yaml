    <p>I am currently writing a  short dissertation about if / how Blackletter and especially Fraktur gains back importance to current design and typography, and whether or not Fraktur can leave its poor national-socialistic associations behind. Now I am looking for contemporary sources whether Blackletter has been used in advertising, branding, fashion, music or modern typefaces <a href="http://www.typetype.com/cat/neutrum.html" title="http://www.typetype.com/cat/neutrum.html">http://www.typetype.com/cat/neutrum.html</a> ; basically in anything that has been created in the last 10 years.<br>
    Generally I am looking for some more 'mainstream' examples and I remember that for example Nike did some ads using Fraktur a few years ago.<br>
    Does anybody know of further examples?</p>
    <p>Jo.</p>
