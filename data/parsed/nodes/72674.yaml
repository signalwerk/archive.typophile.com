  - id: 422346
    user: 14133
    date: 2010-07-27T18:32:00
    date_raw: 27 Jul 2010 — 6:32pm
    votes: null
    html: <p>I've investigated this one along with a few other Doors sleuths over the years. I think it's most likely that the logo was designed for a poster and then later used on the album cover. If anyone knows better, please let me know. I think it was drawn with rules/compass and not from an actual typeface with obvious influence from Braggadocio/Futura Black. I extrapolated the logo into a font called <a href="http://new.myfonts.com/fonts/typodermic/densmore/" rel="nofollow">Densmore</a>.</p>
