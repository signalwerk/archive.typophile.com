      <p>The logo could be a customized Braggadocio (<a href="http://new.myfonts.com/fonts/itfmecanorma/braggadocio/" title="http://new.myfonts.com/fonts/itfmecanorma/braggadocio/">http://new.myfonts.com/fonts/itfmecanorma/braggadocio/</a>) or Futura Black (<a href="http://new.myfonts.com/search/futura+black/" title="http://new.myfonts.com/search/futura+black/">http://new.myfonts.com/search/futura+black/</a>).</p>
      <p>The other one seems a super-thin version of Futura.</p>
