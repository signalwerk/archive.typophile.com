      <p>You could look into Equity, a typeface designed for legal document by type designer and attorney Matthew Butterick. <a href="http://www.typographyforlawyers.com/?page_id=3047/" title="http://www.typographyforlawyers.com/?page_id=3047/">http://www.typographyforlawyers.com/?page_id=3047/</a></p>
      <p>I think, setting the whole thing in a geometric typeface won’t be readable enough. Better combine a serif for body text with something like Stag or Amplitude for headlines.</p>
