    <p>Hi</p>
    <p>I've been tasked with (re)designing a journal/magazine for Patent lawyers (the legal eagles who fight over copyright, trademarks, and intellectual properties). They're a fairly conservative bunch, but I think they could handle a contemporary makeover.</p>
    <p>I'm looking for suggestions for body copy and display faces. My initial thoughts are a slab perhaps Stag for headers, a neutral clean sans such as Whitney and a modern take on a serif for body - perhaps Chronicle. I'm aware these are all H&amp;F fonts (but they are ones I'm well versed in using). The other school of thought is something a bit more retro a la Gotham or Neutraface, but to be honest I'm getting a little tired of those...</p>
    <p>So can anyone suggest some alternatives? Bearing in mind as it's predominantly a journal there will be a lot of reading matter and not much imagery, so I need the fonts to vary and produce texture, but be complementary and not too edgy.</p>
    <p>Thanks!</p>
