      <p>Equity looks nice, but for the price tag I'd need to use across multiple publications and I'm also wary of using a 'new' font. I do love amplitude and there's something a bit more fitting, so would think Farnham or Miller might work well as body and have a contemporary yet established feel - also a bit more sophisticated. They also work well alongside Stag.</p>
      <p>If anyone has recommendations to alternatives feel free to add...</p>
