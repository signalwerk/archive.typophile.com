    <div class="info">Submitted by <a href="/user/7543" title="View user profile.">fontshopmichael</a> : 23.Jan.2008 12.07pm </div>
      <p>FontShop experts selected 29 new OpenType fonts from 14 international foundries for an unprecedented collection: <a href="http://www.fontshop.com/products/fontcds/fontstars/">FontStars™ 2007</a>.</p>
    <p><a href="http://www.fontshop.com/products/fontcds/fontstars/"></a></p><div class="imageWrap"><a href="http://www.fontshop.com/products/fontcds/fontstars/"><img src="/files/FontStars-2007-webNotched_5960.jpg"></a></div><p></p>
    <p>January 15, 2008, Berlin — FontShop International rang in the new year with a digital type industry first: FontStars™ 2007, the year’s best typefaces on CD. The digital type retailer worked with 14 international foundries to compile 29 brand new OpenType fonts and offer them on a single disc. Never before have the world’s most successful new releases been available in one foundry-independent product. </p>
    <p>Lead by German type expert Jürgen Siebert, FontShop sought to create a compilation with no filler fonts. Only useful, relevant typefaces of the highest technical quality were considered. Versatility was also a key goal in selecting fonts for the product. FontStars 2007 includes multiple styles from three sans serif families, including FF Clan™ and Seravek™; three serif families, including Amalia™ and the TDC2 Award winning Greta™ Text by Peter Bil’ak; and several scripts and display fonts for creating dynamic headlines and advertising.</p>
    <p>Thanks to their relationships with the foundries involved, FontShop was able to negotiate licensing fees that are far lower than the standard price per font. This makes the FontStars collection a very affordable way to add several new fonts to a type library.</p>
    <p>Every typeface on the FontStars 2007 CD comes in OpenType® format for portability and ease of use. Each font’s single file works on both Mac® and Windows® machines. The license for each font varies according to the foundry that manufactured it. The fonts in FontStars 2007 are licensed for 1-5 users, varying by foundries represented on the CD. Contact FontShop for information on extending any license for more users.</p>
    <p>FontStars 2007 is available for purchase at <a href="http://www.fontshop.com/products/fontcds/fontstars/">www.fontshop.com</a>. The collection includes the following fonts. A printable PDF sample sheet is available. </p>
    <p></p><div class="imageWrap"><img src="/files/FontStars-fonts_6441.gif"></div><p></p>
    <p><strong>About FontShop</strong><br>
    Founded by Erik Spiekermann and Neville Brody in 1990, FontShop is the original independent retailer of digital type with locations around the world. FontShop carries over 100,000 fonts from more than 50 international foundries, and offers complete typographic services ranging from typeface selection to custom font creation.</p>
