      <p>By "disappeared", do you mean that they appear as blank spaces?</p>
      <p>I run into this problem occasionally, and it can usually be resolved by simply changing the start points of the affected glyphs. Exactly what causes it is something I've never managed to figure out, though I have noticed that it doesn't occur if you turn off all autohinting options, so presumably it involves some interaction between hints and startpoints.</p>
      <p>André</p>
