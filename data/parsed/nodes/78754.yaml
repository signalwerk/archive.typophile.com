    html: <p>When I've encountered this problem, the solution usually has something to do with the way those characters are named. For example, I can call the space, "blankspace" and it will show up as a missing glyph symbol in Adobe apps. Glyphs with no unicode can be a problem but that doesn't seem to fit what you described.</p>
