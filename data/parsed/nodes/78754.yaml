    html: |-
      <p>Another thing worth checking in FontLab Studio is Preferences / Generating OpenType &amp; TrueType, and the Kerning subsection. </p>
      <p>In the first page, make sure that you have "Export OpenType layout tables" and "Compile feature definitions" enabled. In the Kerning page, make sure "Generate OpenType kern feature..." is enabled. For TrueType-flavored fonts, it's also definitely recommended to enable "Export old-style..." and "Expand class kerning...". For OpenType PS (.otf) fonts, this also won't hurt. </p>
      <p>Best,<br>
      Adam</p>
