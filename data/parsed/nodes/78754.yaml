      <p>No, the startpoint in this example is the node on the top right of the glyph, with a little right-pointing arrow. What you're showing is the reference point, which does not affect anything in the font. </p>
      <p>Some other recommended techniques to try:<br>
      * disable compression using subroutines in OpenType PS export<br>
      * correct the path direction to "PS" for all glyphs<br>
      * decompose all composites<br>
      * perform Glyph / Glyph Names / Generate Unicode</p>
      <p>A.</p>
    html_clean: |-
