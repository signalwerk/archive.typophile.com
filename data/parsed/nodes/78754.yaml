    html: |-
      <p>Older InDesign versions tend to ignore kerning if it's the only OpenType Layout feature in the font. Add any substitution feature such as</p>
      <p><code>feature liga {<br>
        sub f i by f_i;<br>
      } liga;</code></p>
      <p>A.</p>
