    <p>Hi!<br>
    I am a rookie at fontlab - and i have run into a problem.<br>
    I made a otf with some kerning pairs. But when I try to use it in Indesign or Illustrator three characters are missing. Its really strange because I can use the font in Pages without problems.<br>
    I have no clue how this happened or how to fix it  - so advice is much appreciated! (help!)</p>
    <p>Thanks in advance :)</p>
