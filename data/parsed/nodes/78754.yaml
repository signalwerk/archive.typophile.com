    votes: null
    html: |-
      <p>You don't need to redraw the characters to set a new startpoint. Just control-click on a point and select 'make node first'.</p>
      <p>For composite decomposition and compression, go to preferences-&gt;Generating OpenType and TrueType-&gt;OpenType PS (.otf) and set the relevant options (alternately, you can decompose composited manually from the glyph menu but it's generally a good idea to keep things as composites within the .vfb file so I'd use the preference setting instead).</p>
      <p>André</p>
