      <p>You know, I always find it amusing, when people have difficulties grasping an issue at the high level of complexity, then figure that, clearly, I must be nuts, which I suppose is a valid point of view if you have a small mind…which, unfortunately, most people do. Me, I'm kind of a big picture kind of guy who thinks, perhaps naively, that there are VERY FEW which are, strictly speaking, impossible. What if? Why the hell not?</p>
      <p>A radical new approach to font marketing? A uniform, enforceable system of Digital Rights Management? A Global Internet Currency? A system which will revolutionize heating and cooling, and lower energy costs by 75% or more? World Peace? All doable, IMHO…</p>
