      <p>No, Ryan—not that stupid shit. A currency that has a fixed value and is NOT traded on any currency exchange, and hence is not subject to fluctuation nor speculation and IS NOT the U.S. dollar. Given that virtually every currency in the world is fiat currency, all it would take is some bold soul to proclaim,“Let there be One Trillion Simoleons (or whatever), and there would be.</p>
      <p>Google “vehicle currency”; global interest sales OUTSIDE the U.S. are projected to hit ONE TRILLION DOLLARS this year; effectively managed (automatically, at point-of-sale. just like a Digital Rights Mangement system), the Chancellor of the Exchequer could levy a 1% transaction fee on both buyer and seller (bye-bye, PayPal; hello, $20 billion). For coming up with this brilliant scheme, I ought to be able to collect a measly one percent of THAT two percent—or $200 million a year, give or take. If you wish, you may call me Your Worship.</p>
      <p>But that's just crazy talk, right?</p>
