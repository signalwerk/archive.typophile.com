    <p>This is my first attempt at a body face, and I'd love to get some external feedback on it. I know the lowercase 'e' and 'c' aren't right yet, and the upper-case 'T' still needs work on the serifs. Other than that, please critique the hell out of it!</p>
    <p>Darrin Crescenzi</p>
    <p>Also, thus far the poor face has no name. If anybody can think of anything more interesting than using my last name, which everyone besides me seems to think is a good idea, I'm all ears.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/darrin_type.jpg" width="868" height="562" alt="">
