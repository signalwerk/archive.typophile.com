      <p>It's looking crisp.<br>
      Only things I notice at the moment, is that I think that the top curves of the C, O, Q, G and S are a bit thick, compared to the thinnest parts of the other glyphs.<br>
      And keep an eye at the serifs, at some places the serifs shouldn't be the same length on both sides, to even the balance and prevent chars from topping over.<br><a href="http://briem.ismennt.is/2/2.3.2a/2.3.2.06.illusion.htm">Check Gunnlauger SE Briem's Notes on Type, Handwriting and Lettering</a> how-to site for what I mean, under 'Stretched serifs' (scroll down).</p>
