      <p>Hi Darrin,</p>
      <p>I, too, am working on my first text face, so don't consider this an expert critique. That said, this looks like its off to a good start. It's getting late, though, so this won't be an exhaustive critique. Just a few nitpicky things on the uppercase:</p>
      <p>A, V, U, W: could all be significantly wider. That spade-shaped counterform really stands out to me (like in Times New Roman), which is nice. It might just be from the JPG export or the fact that they're not perfectly lined up, but they look to be a bit tall as well.<br>
      B: The counters are a bit boxy. Round them out a bit (especially that bottom one).<br>
      C: Looks small. Have you thought about overshoot?<br>
      E, F: serifs on crossbar look chopped off.<br>
      G: Too dark<br>
      K: I think this is your strongest letter.<br>
      M: top serifs feel chopped off<br>
      P,R: the bowl should be a little thicker, maybe?<br>
      Q: nice tail, I think.<br>
      S: A little funky.<br>
      T: I kind of like the serifs on the T, actually.</p>
      <p>The lowercase looks a bit patched together. I have the tendency to patch things together too, and for me, forcing myself to draw the letter by hand will help me consider the letter as a whole and how it will harmonize with other types of letters. I think that might help in bringing a little more unity to the design, and also giving it a little more of your "voice."</p>
      <p>As far as the name goes: I say hold off on the last name until you're really accomplished, knowing that Crescenzi could be a damned good for a font and you always have it in your deck. I'm stuck with Ross...</p>
      <p>Good luck, and hope that helped,<br>
      David</p>
