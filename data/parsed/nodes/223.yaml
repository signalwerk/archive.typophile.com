    html: "<p> The Arabic language isn't as complex as the script - except for the fact that in some countries (like Lebanon) the spoken language is somewhat different than the \"formal\" stuff everybody learns/teaches.  <br>The thing with Arabic is the repertoire of sounds: it's so different than Indo-European languages that it can be pretty discouraging to learn. You think it sounds funny when an Arab speaks English? You should hear it the other way around! :-)  Even Armenians (we have some of the same sounds, but notably not the really guttural ones) have trouble with it. There used to be this stand-up comedian in Beirut, and his whole act for many successful years was talking Arabic like an Armenian. <br> <br>BTW, I'll be taking a Mandarin Chinese class one night a week, starting April 22 - it's just \"conversation\", without getting into their daunting logography - but wish me luck anyway! <br> <br>&gt; The Pillow Book <br> <br>I *still* haven't managed to see that movie.  :-( <br>But I think I'd vote for it anyway... <br> <br>hhp </p>"
