    html: "<p>You've come to the right place!  :-) <br> <br>Arabic is a script I hold in great admiration. I consider Tibetan as the most beautiful, but Arabic is glorious, in the true sense of the word. And the language has a euphony unrivaled. <br> <br>The book you've pointed to has a good reputation, and I'm actually waiting for UCLA to get the copy they recently ordered - I'll report back here. <br> <br>Last year I bought this other book (from the wonderful \"Builders Bookstore\" in SF's chocorgiastic Ghirardelli Square), and it's *wonderful*: <br> <br><a href=\"http://www.amazon.com/exec/obidos/ASIN/0789207109/qid=1018388660/sr=2-2/ref=sr_2_2/104-9962888-5644764\" target=\"_top\">http://www.amazon.com/exec/obidos/ASIN/0789207109/qid=1018388660/sr=2-2/ref=sr_2_2/104-9962888-5644764</a> <br> <br>Also, you might be interested in visiting the acclaimed <a href=\"http://www.arabictypography.com\" target=\"_top\">http://www.arabictypography.com</a> site. But note that it's part of a \"reformist\" platform - don't expect to find a view into Arabic's hallmark glory there. <br> <br>hhp</p>"
