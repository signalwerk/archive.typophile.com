      <p>I sought out a 1024x768 format screen to view the site on, and have to say that things did indeed look mightily large when compared to my 24" screen at home. I decided to take up mk2 suggestion of having two layouts controlled with CSS that the user can choose between. Here is the new reduced-size version of the site.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/disc_scr_2_5537.jpg"></div><br>
      EDIT** Hmm, I seem to be having some problem with uploading the image. Sorry to followers of the thread... **EDIT<p></p>
      <p><a class="freelinking external" href="http://www.discretised.com" rel="nofollow">http://www.discretised.com</a></p>
      <p>One can toggle the two layouts using the link in the top-right (this will probably be changed to something nicer). I also added a small thumbnail viewer to the top of each post so that one can quickly jump to photos as penn recommended. This also shows up on the archive pages.</p>
      <p>There's still a bit more to be done, but I'd appreciate any new feedback.</p>
      <p>Thanks again for the helpful comments!</p>
