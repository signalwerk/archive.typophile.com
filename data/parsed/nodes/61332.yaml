    html: |-
      <p>I guess I can understand the desire to have large images for a photoblog, but I still don't get the large text. It makes everything seem like a headline and therefore loses hierarchy of importance. It also will help most people viewing your page who don't have giant widescreen flat panel graphics displays. It's better to let your pictures speak for themselves rather than make them do battle with the text around them.</p>
      <p>*edit* Having the pictures this big also forces people to do a ton of scrolling. I think that even if it isn't the main page, there should be a link to an index page that allows you to look over the entire collection on one page. I think you'll find that once you get enough pictures on there, it'll be a pain to have to find certain ones through clicking to certain dates then scrolling.</p>
      <p>penn</p>
