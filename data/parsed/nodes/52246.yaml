      <p>Here's my Slasher.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/slasher-logo-nina_4398.png"></div><p></p>
      <p>Slasher is aimed at the ever growing, design conscious and stylish populace living during the so-called New Century – a time in the (hopefully) distant future — whose biggest passion in life is taking life. Preferably with knives, but they are aiming beyond that and always willing to explore new possibilities and fascinating workflows. I am very proud to present to you below some previously unreleased rough drafts of Slasher covers due to appear in approx. 2152 AD (given that the editors are still alive then).</p>
      <p>Appypollyloggies if anyone is offended by this. The tone is supposed to lie somewhere between Monty Python, Clockwork Orange, and some dystopian sci-fi flicks.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/slasher_1_5363.jpg"></div><p></p>
      <p><a href="http://www.altaira.de/posted/slasher_covers.pdf" rel="nofollow">Special Offer: Download four exclusive Slasher covers!</a></p>
    html_clean: |-
      <p>Here's my Slasher.</p>
      <p></p><div class="imageWrap"><img src="/files/slasher-logo-nina_4398.png"></div><p></p>
      <p>Slasher is aimed at the ever growing, design conscious and stylish populace living during the so-called New Century – a time in the (hopefully) distant future — whose biggest passion in life is taking life. Preferably with knives, but they are aiming beyond that and always willing to explore new possibilities and fascinating workflows. I am very proud to present to you below some previously unreleased rough drafts of Slasher covers due to appear in approx. 2152 AD (given that the editors are still alive then).</p>
      <p>Appypollyloggies if anyone is offended by this. The tone is supposed to lie somewhere between Monty Python, Clockwork Orange, and some dystopian sci-fi flicks.</p>
