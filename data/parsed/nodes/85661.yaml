  html: |-
    <p>I don't know if people here will consider this to be a valuable resource or not, but I had been looking for something like this online before and could not find it:</p>
    <p>On <a class="freelinking external" href="http://ibmcomposer.org/joomla/index.php?option=com_content&amp;view=article&amp;id=54&amp;Itemid=56" rel="nofollow">this page</a> just click on "here", and you can download the complete portfolio of typestyles for the IBM Selectric Composer.</p>
    <p>These include Aldine Roman, similar to Bembo; Journal Roman, similar to Garamond; and of course Press Roman, similar to Times Roman.</p>
    <p>Thus, one has a list of the most "essential typefaces" from at least one perspective:</p>
    <p>Bembo (imitated by Aldine Roman)<br>
    Baskerville<br>
    Bodoni<br>
    Century Expanded (called Century here)<br>
    News Gothic (sort of imitated by Classified News)<br>
    Copperplate Gothic<br>
    Garamond (imitated by Journal Roman)<br>
    Times Roman (imitated by Press Roman)<br>
    Memphis (imitated by Pyramid)<br>
    Optima (imitated by Theme)<br>
    Univers</p>
    <p>Of course, the Selectric Composer could only set text, not headlines - for that, you could always use Letraset.</p>
