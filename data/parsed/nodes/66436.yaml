      <p>I would call it wide and narrow.<br>
      In Italy, prior of the relatively recent creation of a few big groups, it was a style pretty common for bank logos (presumably because of the logo of the state bank):<br>
      <a href="http://www.centroservizileasing.it/site/images/logo%20banca%20italia.jpg" title="http://www.centroservizileasing.it/site/images/logo%20banca%20italia.jpg">http://www.centroservizileasing.it/site/images/logo%20banca%20italia.jpg</a></p>
      <p>Two examples:<br>
      <a href="http://www.noicomit.altervista.org/index_files/nuovapagina/ComitLogo%5B1%5D.jpg" title="http://www.noicomit.altervista.org/index_files/nuovapagina/ComitLogo%5B1%5D.jpg">http://www.noicomit.altervista.org/index_files/nuovapagina/ComitLogo%5B1...</a><br>
      <a href="http://www.piazzascala.altervista.org/pagineinterne/ponnnnn/logo.jpg" title="http://www.piazzascala.altervista.org/pagineinterne/ponnnnn/logo.jpg">http://www.piazzascala.altervista.org/pagineinterne/ponnnnn/logo.jpg</a></p>
      <p>There are some modern interpretations too:<br>
      <a href="http://www.seeklogo.com/images/C/credito_cooperativo-logo-AACAC68867-seeklogo.com.gif" title="http://www.seeklogo.com/images/C/credito_cooperativo-logo-AACAC68867-seeklogo.com.gif">http://www.seeklogo.com/images/C/credito_cooperativo-logo-AACAC68867-see...</a><br>
      <a href="http://www.ccr.bcc.it/img/immagini/Logo%20Credito%20Cooperativo%2001.gif" title="http://www.ccr.bcc.it/img/immagini/Logo%20Credito%20Cooperativo%2001.gif">http://www.ccr.bcc.it/img/immagini/Logo%20Credito%20Cooperativo%2001.gif</a></p>
