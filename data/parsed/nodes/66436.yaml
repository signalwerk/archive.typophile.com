  html: |-
    <p>So I'm looking for logo work circa 1870-1900 which has a narrow letter and a wide letter stacked on top of each other. (see small image below)<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/cc_4393.png"></div><p></p>
    <p>I'm interested in specifically this style as well as general type work from this era, if you guys know of anything off the top of your head that is related, I'd really like to see it! or a link to a previous thread, specific style names, etc..</p>
    <p>Thanks!</p>
  html_clean: |-
