    <p>Hello, </p>
    <p>For my portfolio site I will make use of <a class="freelinking external" href="http://en.wikipedia.org/wiki/File:Formschneider.jpg" rel="nofollow">a woodcut image</a>. I want to find a serif typeface that would be historically appropriate for it and/or an interesting choice (for whatever reason you find it to be so; but please explain that reason). I can't give too much information about the site, but I'll just mention this: I plan on designing custom blogs for Protestant Christian writers, so a typeface that references the Reformation period (or is in any way relevant to the Reformation) would be a bonus.</p>
    <p>Requirements for the typeface:<br>
    * It must be available as a webfont, preferably through Typekit or Google Webfonts. But I'm open to other suggestions as long as I don't have to host the file(s) myself.<br>
    * It must have both a regular and italic style. (I'll be loading only these two styles of the typeface on the page.)<br>
    * It must be suitable for both display and text use. I know, it's not ideal, but since this is for the web, I can't load too many fonts on the same page. However, text size in this case will be somewhere between 16-20px.</p>
    <p>Here's what I've played with so far. My favorite for the big text is Adobe Garamond, but I'm having a hard time making it work at smaller sizes, as it looks rather fragile even at 18-20px. (Please check out the links for a full view.)</p>
