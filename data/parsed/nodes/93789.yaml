      <p>You have the Minion image twice.</p>
      <p>How about something a little distressed, like Founders Caslon, Old Claude, Celestia Antiqua … ? (I don't know if these are available for web licensing, but you should be able to find something similar.) Maybe too much for the text size, but you do specify a rather large text size, so it might work. </p>
      <p>If you like A Garamond, have you tried Garamond Premier? What about a Jensen? Or Centaur/Arrighi?</p>
      <p>EDIT: I see, you've tried the Fell type, but it didn't show up in the main post. I really like this choice. The question is whether you want to have a kind of sleek, polished aesthetic that makes some subtle references to craftsmanship and woodcut style (as in, for instance, much of the branding on  <a class="freelinking external" href="http://www.lulu.com/publish/?cid=en_tab_publish" rel="nofollow">Lulu</a>), or whether you want your own words to embody the spirit of the woodcut. So — contrast or concord?</p>
