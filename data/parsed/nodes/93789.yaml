      <p>Well, of the ones you have, I think Arno works best. Arno is available in several optical sizes, but those would probably count as different fonts for your purposes. I like it because it references classical renaissance faces, but is a bit modern and sleek. It's also not too stylized or flamboyant. </p>
      <p>Minion in this context looks to me absolutely like the "welcome to the exhibition" sign at a museum of printing history. In general, paragraphs of text, set FL in a large size of a clean text typeface (and overlaid on a rough, muted illustration) feel like museum signage. I think.</p>
