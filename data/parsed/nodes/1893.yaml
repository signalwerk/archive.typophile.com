  html: <p>Are faces like those of Hoefler Type Foundry's Proteus Project (esp. Leviathan) appropriate choices for poster size printing and larger - up to say 8x4 foot signage? Do gothic display faces generally perform well at larger sizes or are there more appropriate type classifications for such applications? I wonder about this because of the small counters and eyes. <br> <br> -t</p>
