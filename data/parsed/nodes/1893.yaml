    html: <p>TIM -- <br> <br>It has been my experience that it doesnt really matter. If you have, say a text face, something like Warnock Pro, for example, that face comes with to 'versions' if you will. One, is a text version; the other is for display (or basically larger sizes). Either will work, but the later is designed for larger purposes, and asually has more defined serifs, and such. <br> <br>In the arena of a gothic face, something of the sans family, I would say it doesnt really matter. <br>The only thing you might come across in a face like this is 'ink traps', and if the face is designed such, they might look quite funny at very large sizes. <br> <br>In regards to Dan's comments, I would think something this size would probably be cut from vinyl, then applied to the substrate (unless it is digitally printed of course), so in this case you dont have the 'pixels' to deal with. <br> <br>More info on your output process might better define an answer. <br> <br>Hope this helps. <br> <br>Hildebrant.</p>
