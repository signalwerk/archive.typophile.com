  - id: 15010
    user: 1947
    date: 2003-11-05T05:23:00
    date_raw: 5 Nov 2003 — 5:23am
    votes: null
    html: <p>Contrary to Kyle's comments, don't be fooled into thinking that a display cut of a design will function correctly as a signage typeface. It has been my experience that the exact opposite is true. If both a text and display cut exist in a design you are considering, you will most likely get a better performance from the text cut. <br> <br>The finely wrought details that Kyle refers to act as a hinderance to readability and legibility. <br> <br>That said it all depends on the signage you are creating. What are the visual thresholds you expect it to function at? <br>What materials are being used to construct the sign? Retro-reflective, backlight, etc.</p>
