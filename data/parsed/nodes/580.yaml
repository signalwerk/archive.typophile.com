  html: <p>Recently, Dan Bailey of <a href="http://www.fontosaurus.com">Fontosaurus</a> teamed up with Michael Jantze, creator of the nationally-syndicated (U.S.) comic strip, <a href="http://www.thenorm.com">The Norm</a> to create a font based on Michael's comic lettering.  Not unusual, in and of itself, but instead of profiting from this, we're giving 100% of the proceeds to the <a href="http://www.laf.org">Lance Armstrong Foundation</a>.  The LAF provides financial grants to research groups studying the disease and to non-profit organizations that assist people fighting the disease.  If our wildest hopes came true, the proceeds from <a href="http://www.fontosaurus.com/fonts.php?target=136&amp;display=single">this font</a> would fund the lab that found the cure, but we'd just be happy if we could help one person fighting the disease make it through one more day. <br> <br>(That said, anyone else have any ideas of who I should contact to help spread the word?)</p>
  html_clean: <p>Recently, Dan Bailey of <a href="http://www.fontosaurus.com" class="link-external">Fontosaurus</a> teamed up with Michael Jantze, creator of the nationally-syndicated (U.S.) comic strip, <a href="http://www.thenorm.com" class="link-external">The Norm</a> to create a font based on Michael's comic lettering.  Not unusual, in and of itself, but instead of profiting from this, we're giving 100% of the proceeds to the <a href="http://www.laf.org" class="link-external">Lance Armstrong Foundation</a>.  The LAF provides financial grants to research groups studying the disease and to non-profit organizations that assist people fighting the disease.  If our wildest hopes came true, the proceeds from <a href="http://www.fontosaurus.com/fonts.php?target=136&amp;display=single" class="link-external">this font</a> would fund the lab that found the cure, but we'd just be happy if we could help one person fighting the disease make it through one more day. <br> <br>(That said, anyone else have any ideas of who I should contact to help spread the word?)</p>
