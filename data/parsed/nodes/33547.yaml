    <p>Hello all, I am new to all this and am in need of identifying three fonts. One seems to be Parsons as a nice fellow assisted me with that ID. Here are the samples:</p>
    <p><a href="http://hamgallery.com/qsl/country/Canada/3qs.htm" title="http://hamgallery.com/qsl/country/Canada/3qs.htm">http://hamgallery.com/qsl/country/Canada/3qs.htm</a></p>
    <p><a href="http://hamgallery.com/qsl/country/Canada/3du2.htm" title="http://hamgallery.com/qsl/country/Canada/3du2.htm">http://hamgallery.com/qsl/country/Canada/3du2.htm</a></p>
    <p><a href="http://www.schmarder.com/qsl/wbt.jpg" title="http://www.schmarder.com/qsl/wbt.jpg">http://www.schmarder.com/qsl/wbt.jpg</a></p>
    <p>The third one here appears extremely close to parsons. At <a href="http://www.myfonts.com/fonts/barnhartbrother/parsons/" title="http://www.myfonts.com/fonts/barnhartbrother/parsons/">http://www.myfonts.com/fonts/barnhartbrother/parsons/</a> I wonder how “modernized” this version of Parsons is from the sample link above? I know old fonts like cheltenham have been modernized into things like ITC Cheltenham, but are the older original versions available?  Also, the kerning today is very different than what they could do with lead, hot or cold.</p>
    <p>In any case, thanks in advance for any help identifying the other two fonts above!<br>
    Many regards and thanks<br>
    Eugene</p>
