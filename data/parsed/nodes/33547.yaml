      <p>The small type in the 3qs example is <a href="http://www.myfonts.com/fonts/bitstream/cheltenham/">Cheltenham Old Style</a> and Cheltenham Wide (don’t know of a digital version). The large type is a typical wood type grotesque. The word “CANADIAN” is <a href="http://www.myfonts.com/fonts/linotype/copperplate-gothic/">Copperplate Gothic</a>.</p>
      <p>Some of the small type near the top in the 3DU sample is DeVinne. The only digital version I could find is <a href="http://www.myfonts.com/fonts/woodentypefonts/de-vinne/">this one</a>, but it’s apparently based on a large wood type cut, not the small metal cut in your sample. I’m pretty sure the rest of the small type is an old metal font called Grasset. “A.R.R.L.” is <a href="http://www.myfonts.com/fonts/linotype/copperplate-gothic/">Copperplate Gothic</a>.</p>
      <p>Regarding the last one, I’m also the one who identified it for you on the [T-D] list. This is about as close as you’re going to get to the original metal Parsons. There doesn’t appear to be any ITC-style design modernization.</p>
