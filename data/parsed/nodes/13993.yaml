    html: <p>Most <strong>working</strong> people build their portfolios while working for someone, whether clients or a boss. As long as you (and your wife) actually <strong>did</strong> the work you are claiming to have done, there shouldn’t be a problem. And, if you worked as a member of a team, be honest about that.</p>
