      <p>Thanks guys. I like Norberts take and specific wording. I have a tendency to get a bit too technical, which can make me seem a bit wobbly.</p>
      <p>Oldnick. Not sure about your bold usage. Hope I’ve not done anything to make myself seem suspicious. I have never and would never misrepresent myself, although I can see from posts on Typophile that this is more common than I might suspect.</p>
      <p>Here’s an example. My wife just finished editing a catalogue for an upcoming exhibition of the work of Anselm Kiefer. I’m not the designer on the project. If I show the book I’ll be very clear about what’s what. My question would be whether to show an image of the book or not?</p>
