    html: |-
      <p>Honest is crucial and your reputation is affected by credibility.</p>
      <p>In my CV, I have a section called: <em>Summary of Projects, Collaborations and Consultancies</em></p>
      <p>My own guidelines for wording:<br>
      For projects I did — <em>created, developed</em> at or for<br>
      projects I directed — <em>directed</em><br>
      Part of project team — <em>collaborated with, contributed to</em><br>
      Consulting — depends on level — <em>consulted, contributed, directed</em></p>
      <p>—————————————————————————————————————————<br>
      Yes, I’m old, but consult my creative consultants when collaborating!</p>
