    <p>What is ethical to include in self-promotion? Specifically, can you include work you created while working at other shops? How do you deal with collaborative work? Too many details about what you’ve contributed can start to sound a little crazy.</p>
    <p>Also, my wife is an editor, and I’m working with ideas to incorporate what she does and market ourselves as a package. How do I handle work she is involved with currently since she is employed by an institution?</p>
