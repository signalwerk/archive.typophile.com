    html: <p>Is this your name, or was it provided by the professor? I remember these projects in school...they'd give you an odd company name and you'd have to design a logo around it. One of ours was dietrim (diet trim? die trim?).  <br> <br>I can appreciate the challenge, but in hindsight, these were bigger branding issues than merely a logo...they realy needed a renaming. ;o) <br> <br>Anyways, I digress. <br> <br>Looking at the mark, you explicitly say 'zero erosion' below it. So I'm thinking that perhaps you just make the entire word one color. Maybe even lowercase the Z to de-emphasize 'erosion'.</p>
