    date_raw: 27 Jan 2005 — 12:57pm
    votes: null
    html: <p>The thing with retaining walls is that it's largely a commodity product. As a consumer, I simply shopped around for the cheapest block of concrete that I felt looked OK. The logo (or even brand) had little to nothing to do with my decision. <br> <br>Granted, I'm guessing their primary target would be other contractors. As such, you'd want to pitch the benefits of the product at them. 'erosion control' unfortunately, is a defacto feature of any retaining wall system, so that's not terribly unique.  <br> <br>Since this is a student project, I'd suggest doing the opposite. Come up with a nice logo that you like (I like this one), and then design the project brief around that to fit your particular solution. ;o)</p>
