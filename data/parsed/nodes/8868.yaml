    html: "<p>Good point Darrel.  Thats something I've been considering. The name of the company is Zerosion not Z-erosion.  Here are my thoughts and concern about the possibilities: <br> <br>Zerosion: Are people going to pronounce it correctly?  I've heard someone say something like zerahscion. <br> <br>Z-erosion: This empahasizes \"erosion\" too much for sure.  I thought a compromise might be to leave out the dash and just change the color (like my posts above) <br> <br>Zerosion: with \"Zero\" in one color and \"sion\" in the other.  Here \"Zero\" reads well, but what does \"sion\" mean?  And again, will it be pronounced correctly?  <br> <br>Later this evening I'll post the different possibilities and let you guys be the judge. I'll also work on the tagline and colors.</p>"
    html_clean: "<p>Good point Darrel.  Thats something I've been considering. The name of the company is Zerosion not Z-erosion.  Here are my thoughts and concern about the possibilities: <br> <br>Zerosion: Are people going to pronounce it correctly?  I've heard someone say something like zerahscion. <br> <br>Z-erosion: This empahasizes \"erosion\" too much for sure.  I thought a compromise might be to leave out the dash and just change the color (like my posts above) <br> <br>Zerosion: with \"Zero\" in one color and \"sion\" in the other.  Here \"Zero\" reads well, but what does \"sion\" mean?  And again, will it be pronounced correctly?  <br> <br>Later this evening I'll post the different possibilities and let you guys be the judge. I'll also work on the tagline and colors.</p>"
