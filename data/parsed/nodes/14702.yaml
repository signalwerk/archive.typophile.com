    html: |-
      <p>WIll the Linotype software handle auto-activation? Will it use a plug-in/XTension for InDesign and Quark XPress? If so, that’s a pretty ambitious move into the software business. Software engineers don’t come cheap.<br>
      One would assume that if the product will be free, it’s main purpose is to *encourage* people to purchase Linotype’s fonts.<br>
      It would seem that there is at least a little room there for conflicts of interest. For example, managing OpenType fonts is much easier since most OpenType fonts on the market have been recently released and are from major vendors. It could be that support for Postscript and Mac TrueType might be lacking in the hope of selling people new editions of typefaces they already own.  There was some similar discussion around this topic concerning Adobe’s Garamond Premier Pro.  There are some nice features in those products, but it’s really a tough sell for people who already have a licensed version of Garamond.<br>
      That said, Adobe used to sell both type and manager. But then, Adobe was also selling PageMaker and Illustrator.</p>
