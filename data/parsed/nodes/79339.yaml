    <p>Hello, </p>
    <p>I have recently concluded my first font on Fontlab. It is a Latin base character. I have been testing out the font on programs, like Illustrator, and I have noticed a problem when I write the diacritics. Everytime I write the diacritic Illustrator automatically changes the font to Myriad. I have tried fixing the problem on Fontlab by going on the Glyph Properties window and assinging the OT to simple or ligatures, nothing works. </p>
    <p>I have inserted an image into this post to better illustrate my problem. </p>
    <p>Thank you.</p>
