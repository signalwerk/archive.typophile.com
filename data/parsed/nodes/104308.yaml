    <p>Recently, I've been toying with the idea of returning to the project that brought me to Typophile in the first place: To make a characterful text font. My <a href="http://www.typophile.com/node/91743">first attempt</a> failed almost immediately, but I've learned a lot about type design in the meantime. </p>
    <p>I'd like to make <strong>Traction</strong> the female hiking boot of oldstyle fonts: Sturdy and functional, a grippy all-terrain profile, yet organic and human, and within the constraints of practicality as elegant and sexy as possible. The main "bite" should come from bold, almost exaggerated serifs, reminiscent of slab serifs, and broken strokes that reinforce the glyph where it is most needed.</p>
    <p>My main inspirations are Quadraat, Marlene, and most importantly, Satyr. I'm avoiding looking at those typefaces now in order not to plagiarize them too much. Hopefully my own take will ultimately stand on its own rather than look like an obvious derivative.</p>
    <p>Here are my first two letters:</p>
    <p><img src="/sites/default/files/old-images/T_3763.png"></p>
    <p>Whaddya think?  Does it have promise?</p>
