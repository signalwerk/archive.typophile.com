      <p>Alright, I finished my first weight, including small caps, figure sets, arrows, kerning, ligatures, contextual alternates; the works.</p>
      <p>However, I'm a bit disappointed at what the font looks like when used for text.  It strikes me as too black and too vertical.  I might have accidentally made the display companion to the Traction text face!  :\  I'm hoping this might get better once I have a spectrum of weights.  I might then declare the current weight Medium and have a Regular, Book, and Light to make for nicer text setting.  Maybe I should also make a dedicated text cut with wider rounds and looser spacing.</p>
      <p>First of all, though, I plan to build an italic for my current weight.  I have some unconventional ideas already.  ;)</p>
      <p>@ Hrant: I disagree about the corner in the capital Eszett; it reads as a TZ ligature for me.  However, I gave mine a "shoulder" on the upper left, which considerably improves its looks as a capital letter.  Thanks!</p>
