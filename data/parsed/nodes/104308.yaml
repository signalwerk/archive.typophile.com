    html: |-
      <p>Thanks for the feedback, everyone!</p>
      <p>@ Joshua: I've given the outstroke-type serif on {n} a chance, but didn't like it. I feel like the glyph is tap-dancing (see below). Not at all what I'm going for...  I think I'll stick to my merely moderately unusual {n} for now.  ;o)</p>
      <p>And while I love ligatures, I'm not sure this it the right font for going crazy with them.  I'll certainly have some non-standard ones like {tt, Th, Qu} and the like, but apart from that? Do you have an example of what you're thinking about?</p>
      <p>@ Craig: I gave the top of the {t} just a little nudge upwards... wouldn't want to go farther than that; I'm a big fan of low and wide {t} designs.  Added weight to the bottoms of {e} and {c}; looks better indeed. </p>
      <p>Yes, the top serif of {n m r} exemplifies this rubber sole grip feeling I'm trying to evoke. Added two units to the thickness of the top serif in ; tried more but it started to look out of place.</p>
      <p>@ Sindre: I haven't really thought about the {s} yet; I'll see when I get there.  ;o)  </p>
      <p>I made the {a} wider by 10 units and broke the foot away from the bowl. Yep, big improvement. {d} was a lot airier than my previous {a}, though, so I left it unchanged for now.</p>
      <p>I tried reducing the inside serifs on {n}, but didn't like the resulting feel of {nn} sequences. Reducing serifs in a grippy font just seems off anyway.  ;o) </p>
      <p><img src="/sites/default/files/old-images/T4_5234.png"></p>
      <p>Oh, and this will totally need a higher-contrast display cut sooner or later.</p>
