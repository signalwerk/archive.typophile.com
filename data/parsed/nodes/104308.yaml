      <p>I'm glad to see that the "chunkiness" and "gnarliness" that the default weight of the text cut suffered from when set in multi-line text blocks is amended by interpolating down to lighter weights. I still think it needs to become a bit sleeker and lighter for comfortable reading, but for that I'm planning to widen the sidebearings. Maybe I should also tone down the fat terminals a bit in the text version...?<br><img src="/sites/default/files/old-images/textblock_6626.jpg"></p>
