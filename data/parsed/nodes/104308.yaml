      <p>@ AL: Good point about the "beards" — they don't have exactly straight sides, but they look like that in comparison with the more pronounced curves everywhere else.  I'll give them a bit of concavity.</p>
      <p>How is the {ß} forced? It's the same architecture that Garamond and Palatino use, for instance. I much prefer this over the Sulzbacher form, and it's nicely "grippy", too.</p>
      <p>As for Satyr: Sindre himself told me not to worry about the similarity...  and seeing the two fonts side-by-side, I find them very distinct from each other. I suspect Satyr might end up begetting an entire generation of new fonts in this style, as did Frutiger...  I'd like to christen this kind of fonts "organic serifs", while I'm at it.  ;o)  The non-straight stroke boundaries remind me of how trees grow additional material wherever the mechanical strain is greatest, rather than just following a geometric ideal.</p>
      <p>@ Hrant: I haven't yet seen a talus feature in Glyphs... though I'm sure it must be around somewhere. I'll ask.</p>
