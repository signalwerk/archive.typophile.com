      <p>Thanks for the comments!  I think I acted on most of them.</p>
      <p>@ Joshua: Textura has been a strong influence on most of my fonts so far, so I'm not surprised to see it seep into this one as well. It's certainly welcome.  :)</p>
      <p>@ Hrant: Yeah, you're right about the descenders. I expanded them a bit. The font is now 1050 ems tall; that's no problem these days, right?</p>
      <p><img src="/sites/default/files/old-images/T6_4959.png"></p>
      <p>I'm getting a bit of a "sloppy" vibe off the last few characters. I guess I shouldn't have finished them at night... maybe I should make some of those strokes straighter after all?</p>
      <p>After some more experimentation, I abandoned that bearded {f} design for a pretty Garalde banner. I think I can get away with it, especially since it also appears in {y}, where the "beard" just looked really stupid. I'm wondering whether I should also turn {j}'s descender into a banner...?  I do like the current look, though.</p>
      <p>Hmmm... is {b} a bit too rotund?</p>
