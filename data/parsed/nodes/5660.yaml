  html: <p>Hello, fellow typophiles - <br> <br>I've been trying for some time now to identify the typeface the New Yorker uses in their small headings (not the titles of pieces, but titles of plays and movies, for instance, in the "goings on about town" section) - <br> <br>I've seen it a couple other places, too, and would love to know what it is - <br> <br>See the attached image for a sample I pulled from a PDF from the New Yorker -  <br> <br>Thanks for any help! <br> <br>A. <br> <br><img src="http://www.typophile.com/forums/messages/83/40847.jpg" alt="Type sample"></p>
  html_clean: <p>Hello, fellow typophiles - <br> <br>I've been trying for some time now to identify the typeface the New Yorker uses in their small headings (not the titles of pieces, but titles of plays and movies, for instance, in the "goings on about town" section) - <br> <br>I've seen it a couple other places, too, and would love to know what it is - <br> <br>See the attached image for a sample I pulled from a PDF from the New Yorker -  <br> <br>Thanks for any help! <br> <br>A. <br> <br><img src="http://www.typophile.com/forums/messages/83/40847.jpg" alt="Type sample"></p>
