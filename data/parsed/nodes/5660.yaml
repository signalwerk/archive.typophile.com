    date: null
    date_raw: null
    votes: null
    html: <p>It's probably James Montalbano's <a href="http://www.terminaldesign.com/custom_mag_vanFair_01.shtml" target="_blank">VF Sans</a> which was done for Vanity Fair. The New Yorker is published by the same company, Conde Nast. Unfortunately, this font is not available to the general public. <br> <br>The old metal face Vogue is also very similar to this.</p>
    html_clean: <p>It's probably James Montalbano's <a href="http://www.terminaldesign.com/custom_mag_vanFair_01.shtml" target="_blank" class="link-external">VF Sans</a> which was done for Vanity Fair. The New Yorker is published by the same company, Conde Nast. Unfortunately, this font is not available to the general public. <br> <br>The old metal face Vogue is also very similar to this.</p>
