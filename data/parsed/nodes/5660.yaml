    html: <p>It's neither of those - the middle horizontal stroke on the E and H in this typeface is vertically centered - also the center point of the M is on the baseline - <br> <br>Any other ideas?</p>
    html_clean: <p>It's neither of those - the middle horizontal stroke on the E and H in this typeface is vertically centered - also the center point of the M is on the baseline - <br> <br>Any other ideas?</p>
  - id: 40316
