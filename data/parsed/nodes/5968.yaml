    html: "<p>---By this, do you mean a single typeface that covers all the world's languages? <br> <br>Yes, as a resume, in a simple way. Not a font with a hundred versions and gliphs for every language. Less is more is law in visual communication, or not? <br>I was thinking in the possibility of a tecnical advantage of this, an investigation from a the mind of a group of typographers. <br> <br>---It's a valiant cause, but Humanity is just too culturally compartmentalized for the idea to ever really work. And world leaders just don't respect it or know enough about it at this point for anything to take hold... <br> <br>I mean, a typeface proyect who covers the most used and common vocal sounds from the most functional languages, is not necesary connected with cultural democracy of languages. <br>I was thinking is a proyect of a universal typography in this way: <br> <br>An alphabet as a universal tool, more in a cience way, more related to a traslation of the voice and body language. <br>If one day we need to create a language with artificial intelligence, or with some unknown or extraterrestrial intelligence, as a non fiction example (Carl Sagan Setti proyects, human capsule thing), dont we need such a tool?  <br> <br> <br>mh.</p>"
