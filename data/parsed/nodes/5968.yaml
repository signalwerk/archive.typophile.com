    html: <p>This is one of my favorite topics ever! <br> <br>Herbert Bayer designed a context-sensitive alphabet called the "basic alfabet", which can be found in the April 1964 issue of Print. Interestingly enough, there was an article called "Towards an International Language" that shared many of the same ideas in a Print from just a couple months earlier (also 1964), and these ideas were eventually formed into the IPA, or International Phonetic Alphabet (I think Hermann Zapf was involved in this). <br> <br>Jan Tschichold (Universal), Herbert Bayer (universal), Bradbury Thompson (Alphabet 26), Brigham Young (Deseret alphabet), and many others developed single case "universal" alphabets that sought to further some purpose in their day, all of which are fascinating, but limited. Bayer went from advocating a limited-character system (universal) to a more complex, vocal-inflection oriented system (basic alfabet), and I think most of the old modernists (Tschichold most famously, in the same early-1964 issue of Print as "Towards a Universal Language") backed away from their earlier claims as being inconsistent with humanistic principles.  <br> <br>That said, there's a certain "flattening effect" with computers, where at the root of all programs are Roman characters (Jon Wozencroft wrote about this in a great article called "It May Be Wrapped but Will It Warp?" -- the line went something like "We all use electronumeric US English now... Ours is a translation game"), and of course all airports use English. If you really want a single alphabet, of the "less is more variety", working to crush all non-English (or at least, Roman-based) languages is probably your best bet, even if it is a distressing enterprise. Many countries - <a href="http://tinyurl.com/3vd6j">like Azerbaijan</a> - are choosing to ditch their historical alphabets in favor of romans.</p>
