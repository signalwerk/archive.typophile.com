    html: <p>The trend towards the Latin alphabet for Azeri and other Turkic languages, which began in the 1920s and was derailed during the 1930s and 40s when Stalin insisted that all Soviet languages be written in the Cyrillic script, is a function of pan-Turkism. So while it follows Ataturk's desire to move the Turks culturally and politically toward the West, it is not so simple as 'catering to the current powers that be'. It also represents the desire of disparate Turkic peoples spread through several nations to band together and seek strength in numbers.</p>
