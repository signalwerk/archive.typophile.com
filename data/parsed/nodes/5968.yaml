    html: <p>&gt;Unfortunately, Unicode is a moving target.  <br> <br>Is this because languages keep evolving, with new characters constantly being invented, and new glyphs? <br> <br>(So only "unfortunately" in that it precludes against the Once-And-For-All-Megafont.) <br> <br>*** <br> <br>Miguel -- the underlying principle of the Knuth Metafont suggests that a universal "base" typeface may be defined, one that can be adapted to accomodate any character in Unicode, past, present or future -- in a range of styles. <br> <br>*** <br> <br>Perhaps the first universal typeface project, which catalogued all existing alphabets at the time, was Edmund Fry's "Pantographia" (1799). <br> <br>*** <br> <br>Where does shorthand (eg Pitman) fit into the scheme of things? Can it "code" all vocal sounds, and therefore any language?</p>
