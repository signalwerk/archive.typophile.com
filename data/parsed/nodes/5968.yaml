    html: <p>Can you elaborate on your question a bit more, Miguel?  Do you mean what Thomas was speaking about, or do you simply mean "a typeface that embodies the spirit of the Esperanto language and movement"? <br> <br>Esperanto is an interesting phenomenon--with some substantial drawbacks... <br> <br>1) It claims to have no ties to any particular language or language family--but it is clearly a Romance language. <br> <br>2) Esperanto isn't as free from particular cultures as its speakers would have you think.  The language is prone to dialectization, and adherents in Brazil, for example, have been known to have substantial difficulty communicating with Japanese Esperanto speakers. <br> <br>It's a valiant cause, but Hamanity is just too culturally compartmentalized for the idea to ever really work.  And world leaders just don't respect it or know enough about it at this point for anything to take hold.</p>
