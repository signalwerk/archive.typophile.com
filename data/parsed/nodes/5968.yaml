    html: <p>As far as I know, Azeri has never had its own writing system. It seems to have been unwritten before conversion to Islam and adoption of the Arabic script. Later, when the Turks dropped the Arabic script and adopted the Latin alphabet, the majority of Turkic peoples followed suit. The Turkic peoples who found themselves in the Soviet Union used the Latin script for 10-15 years, and were then obliged to switch to a new Cyrillic orthography. Following the collapse of the Soviet Union, the Turkic successor states announced an official change to the Latin script, typically picking up where they left off in the 1930s. The changeover has been difficult, and in Azerbaijan many older people can only read the Cyrillic orthography. When Ataturk made the switch from Arabic to Latin in the 1920s he had the advantage of 80% of the Turkish population being illiterate. In Azerbaijan, literacy in the Cyrillic orthography was very high, and many people have objected to having to learn the new-old Latin orthography. Complete change will come only with the passing of the older generations. <br> <br>A similar situation persists in Mongolia, but unlike the Turkic peoples the Mongolians did have and are trying to restore their own, indigenous writing system. Interestingly, having rejected the Cyrillic script, and with still poor support for the Mongolian script in computer systems, the middle generation of educated Mongolians who grew up with the Cyrillic script, find it hard to learn the traditional script, and need to write e-mails, have adopted a Latin-transliteration that has become a kind of de facto third script option.</p>
