    html: "<p>Dan: the ideal balance between cultural exchange and cultural preservation for a given group depends on their long-term security. Arabs for example (even though they're currently threatened by the West) don't really have to worry much about assimilation; but Armenians very much do, especially since Turkish \"policies\" have resulted in more than half of us living outside Armenian land. <br> <br>&gt; What about cultural groups that never had their own writing systems? <br> <br>I think there's much to be said for inventing a new script to serve a budding -or threatened- nation. In fact, the invention of the Armenian alphabet for example was in part a result of nationalism: it came at a time when Armenians were being assimilated both into the Byzantine and the Persian empires, and the desire for a new, <i>Armenian</i> writing system to translate the bible is documented. <br> <br>&gt; what is so bad about their ditching it several centuries later for Roman? <br> <br>Certainly, switching to Roman made sense in terms of linguistics (since Turkish, being an Altaic language relies on vowels - something not in tune with heavily consonantal Arabic), but the \"bad thing\" is simply an issue of intentions: when you switch to the writing system of the former enemy (Turkey was on the side of Germany in WWI), you weaken your national identity. The current turmoil of religion versus capitalism that's going on in Turkey can be said to be a result of Ataturk's reforms. <br> <br>-- <br> <br>&gt; they didn't switch at different times. <br> <br>Didn't you once mention that Azerbaijan actually switched to Latin before Turkey (only to later have Cyrillic imposed)? And anyway, there still can never be a guarantee that all Turkic nations would syncronize the switch (or make it at all), so simply keeping Arabic would have been more pan-Turkic. Plus don't forget that Turks are generally Muslim and Arabic is the script of Islam, so switching to Roman seems to be anti-Turkic on that front as well. Ataturk was a secularist, but I think his utopia of a single, large, but secular pan-Turkic state was too ambitious - and the cracks in just Turkey itself are showing more prominently with each passing day: Turkey's Islamism is increasingly straining its historic relationship both with the US and Israel. <br> <br>hhp <br></p>"
    html_clean: "<p>Dan: the ideal balance between cultural exchange and cultural preservation for a given group depends on their long-term security. Arabs for example (even though they're currently threatened by the West) don't really have to worry much about assimilation; but Armenians very much do, especially since Turkish \"policies\" have resulted in more than half of us living outside Armenian land. <br> <br>&gt; What about cultural groups that never had their own writing systems? <br> <br>I think there's much to be said for inventing a new script to serve a budding -or threatened- nation. In fact, the invention of the Armenian alphabet for example was in part a result of nationalism: it came at a time when Armenians were being assimilated both into the Byzantine and the Persian empires, and the desire for a new, <i>Armenian</i> writing system to translate the bible is documented. <br> <br>&gt; what is so bad about their ditching it several centuries later for Roman? <br> <br>Certainly, switching to Roman made sense in terms of linguistics (since Turkish, being an Altaic language relies on vowels - something not in tune with heavily consonantal Arabic), but the \"bad thing\" is simply an issue of intentions: when you switch to the writing system of the former enemy (Turkey was on the side of Germany in WWI), you weaken your national identity. The current turmoil of religion versus capitalism that's going on in Turkey can be said to be a result of Ataturk's reforms. <br> <br>-- <br> <br>&gt; they didn't switch at different times. <br> <br>Didn't you once mention that Azerbaijan actually switched to Latin before Turkey (only to later have Cyrillic imposed)? And anyway, there still can never be a guarantee that all Turkic nations would syncronize the switch (or make it at all), so simply keeping Arabic would have been more pan-Turkic. Plus don't forget that Turks are generally Muslim and Arabic is the script of Islam, so switching to Roman seems to be anti-Turkic on that front as well. Ataturk was a secularist, but I think his utopia of a single, large, but secular pan-Turkic state was too ambitious - and the cracks in just Turkey itself are showing more prominently with each passing day: Turkey's Islamism is increasingly straining its historic relationship both with the US and Israel. <br> <br>hhp <br></p>"
