    html: <p>&gt; The trend towards the Latin alphabet ... is a function of pan-Turkism. <br> <br>That doesn't make sense, because they could have just kept using Arabic. Switching to Latin, especially at different times, with no assurance that other Turkic countries would follow only weakens pan-Turkism. <br> <br>As you say, illiteracy helped a lot, but the main reason the Turks switched, and continue to switch, to Latin is simply to make powerful friends. One day Georgia (a country already selling its soul to the god Money) might suffer the same fate. <br> <br>&gt; It also represents the desire of disparate Turkic peoples spread through <br>&gt; several nations to band together and seek strength in numbers. <br> <br>And of course "cleanse" the land of peoples who might happen to be in the middle... Which can only really take hold if you have the only remaining <i>super-power</i> on your side, partly because you've adopted that power's alphabet. Don't underestimate the favors one can win through emulation. Why do you think the NBC commentators favor athletes from countries more similar (in whatever way) to the US? <br> <br>-- <br> <br>&gt; Hrant, you are going to refute my hypothesis with some witty anecdote about how <br>&gt; some yet unnamed country has adopted the latin alphabet only to then forget its <br>&gt; entire history, aren't you</p>
