    html: <p><i>That doesn't make sense, because they could have just kept using Arabic. Switching to Latin, especially at different times, with no assurance that other Turkic countries would follow only weakens pan-Turkism. </i> <br> <br>But they didn't switch at different times. Ataturk's reform inspired an attempt to create a pan-Turkic Latin orthography in the 1920s. This was largely a success and widely implemented. It was initially accepted by the Soviet authorities, who doubtless approved of the secularism that helped make a break with the Arabic script desirable. There are dozens of Latin orthographies for southern Soviet minority languages from this period. Then, in the later 1930s and 1940s all Latin orthographies in the Soviet Union were supressed (probably on Stalin's personal order, since he had an interest in linguistics). Undermining pan-Turkism was doubtless one of the goals of this supression and the forced introduction of Cyrillic orthographies. Since the collapse of the Soviet Union, many of the Latin orthographies of the 1920s have been brought back. There tends to be only minor variation among them, and they constitute a pan-Turkic alphabet, much as was envisaged in the 1920s.</p>
