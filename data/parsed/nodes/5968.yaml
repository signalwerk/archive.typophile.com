    html: "<p>Heya, Hrant -- <br> <br>Believe me, I think the trend towards English-and Roman-ization is a distressing one, but I wrote the post above because designers have been obsessed with the \"universal alphabet\" thing for generations -- and most seem to wind up embracing greater complexity later in their lives. I think it's pretty interesting to hear that it's still an engaging project for some. (And, I thought I was being tongue in cheek talking about \"crushing\" other languages...) <br> <br>The article I linked supports what you say about the Azeri peoples' language, and it's an interesting choice... go back to the historical alphabet (Arabic, which doesn't particularly suit the phonetic range of the language), keep the recently-imposed one (Cyrillic, which fits well but reminds many of the \"powers that be\"), or switch to the Roman alphabet? You're right that it smacks a little of \"the powers that be\" (Be original! Rebel! Drink Pepsi!), but which would you have chosen? <br> <br>The article also mentioned that UCLA was the first to teach Azeri in Romans.... do you have any sense of how that's worked? <br> <br>Edit: Peignot was a unicase with large and small letters, (mostly) just like Deseret... one set of forms, two sizes. Dag, that was the one I forgot!</p>"
