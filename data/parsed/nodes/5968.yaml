    html: "<p>By this, do you mean a single typeface that covers all the world's languages? <br> <br>There have been several attempts at this. Arial Unicode and Cyberbit come to mind. Lucida Grande I don't think covers quite as many languages. <br> <br>But the really \"universal\" fonts typically suffer from several problems: <br> <br>1) The styles of the source glyphs often vary widely for the different language sections, so the different languages don't necessarily match all that well. <br> <br>2) The immense number of characters involved means that it's generally only practical to do a single font. One weight, one style. But to do even basic typography in most languages one needs at least two weights and/or italics. (Which leads to another problem, that italics are critical to some languages and meaningless to others.) <br> <br>Some people think of a universal typeface as covering all the codepoints in Unicode. Unfortunately, Unicode is a moving target. Arial Unicode does all of Unicode 2.1, but Unicode 4.1 has more than twice as many characters. <br> <br>Even if somebody wanted to do a single font that covered all of Unicode, they'd have the problem that no existing font format can handle more than 64K glyphs, while Unicode has about half again that many characters. <br> <br>So, if that's what you were thinking about, it's an interesting idea, but sadly of limited utility, and impractical to make as well. <br> <br>That being said, the main use of such a font is as a fallback to display characters that are not present in a given font. Here, it could be useful to have a universal font, even if it is of limited practicality in general. For this purpose, you only need one such font on a given operating system, and it doesn't have to be attractive or part of a full type family. <br> <br>My two cents, for what it's worth. <br> <br>Regards, <br> <br>T</p>"
