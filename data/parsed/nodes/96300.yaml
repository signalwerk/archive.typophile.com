      <p>I don't know if there is an exact font, but it looks like <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-1&amp;ffam=Beast%20Machines%20-%20Normal&amp;fid=aef32d68bf9dc2b5dcbc2e89ef9bd0ab&amp;fstyle=i&amp;fsize=36&amp;text=M%20U%20S%20C%20L%20E%20%20%20P%20H%20A%20R%20M&amp;wrap=2" rel="nofollow">Beast Machines</a></strong>, similar to <strong><a class="freelinking external" href="http://www.dafont.com/search.php?text=MUSCLE+PHARM&amp;q=Beast+Machines" rel="nofollow">Skir</a></strong> both by Neale Davidson + some manipulation to remove all left protruding bars from /E/P/H/A/R/</p>
      <p>-----------------------------------------------<br>
      I found it using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
