    html: |-
      <p>Thanks Stephen,</p>
      <p>Just for the record Soho was well under way in mid 2004.<br>
      Soho is in many respects Neo Slab. As early as 2003 it<br>
      was clear that slabs were gaining momentum in the UK in<br>
      a big way and I wanted to try to capitalise on that. </p>
      <p>I showed the design as a 'coming soon' design in May 2005<br>
      at a presentation for Faces in the UK. I showed slides of the<br>
      unreleased sans and the slab serif versions. It didn't arrive<br>
      until nearly two years later because I bit off more than I could<br>
      chew in my spare time. It was originally a much bigger project<br>
      and if I'd stuck to the original plan it wouldn't have got<br>
      released until 2037.</p>
      <p>I personally like the fullness and openness of the g you mention.<br>
      I don't personally think there is a problem until you go under 10pt.<br>
      With 3 g's to choose from I'm hoping there's one for every occasion.</p>
