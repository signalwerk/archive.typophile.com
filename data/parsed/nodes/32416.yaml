    html: |-
      <p>I am very fond of the Guardian Egyptian, and to my eyes Soho is a very different animal. The Guardian Egyptian is for a start not a true slab serif as it has angled serifs, rather than square ones, as this does. Its starting point is the proportions of traditional serifed faces, whereas Soho is much wider. It also has more prominent 'slabs'. </p>
      <p>Looking at the 'influences' I can definitely see the influence of Chachet on Neo Sans, but I don't see where the Argo comes in...</p>
