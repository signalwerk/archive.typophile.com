      <p>Thanks for the background, Sebastian. It's easy for us critics and users to forget how many years can pass from initial concept to release. Don't be afraid of revealing what inspired you along the way, be it Guardian Egyptian or otherwise.</p>
      <p>And thank you for the 3 'g's! I contend that the huge counters of your 2-story 'g' create a distracting heaviness in the center of the letter. But one of the great benefits of the OpenType era is that type makers are incorporating alternate forms where they might not have before.</p>
