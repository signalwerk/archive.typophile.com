    html: |-
      <p>Hello Stephen,</p>
      <p>In terms of influences I guess a nod to Dispatch by<br>
      Cyrus Highsmith which must have influenced my decision<br>
      making on some level as the only 'modern' slab serif<br>
      design with multiple widths I was aware of at the time. </p>
      <p>Definitely a nod to the open nature of Gerard Unger's<br>
      typefaces like Argo and Dave Farey's Cachet which informed<br>
      the design of Neo, the starting point for Soho. I've<br>
      always liked both a great deal.</p>
      <p>The Guardian typeface is excellent and may well have<br>
      had an influence on some level since it's appearance<br>
      but I've been working on this slab design for a long time. </p>
      <p>I actually dug out a slide from that May 05 presentation<br>
      which I'm attaching. The designs obviously matured since<br>
      then and become more conservative but you can see where<br>
      it's heading.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/28_6326.jpg"></div><p></p>
