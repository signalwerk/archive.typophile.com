      <p>Like in Latin typefaces, there's always more than one (correct) way to do it. Greek has various regional preferences, epoch preferences, and traditions, so it will be impossible to please everyone.</p>
      <p>Here's how Garamond Premier Pro (left) and Arno Pro (right) were done:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/gpp_arno1_4409.png"></div><br>
      Iota adscript (prosgegrammeni) is the default, and iota subscript (ypogegrammeni) is implemented via a Stylistic Set.<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/gpp_arno2_4279.png"></div><br>
      All are Stylistic Alternates (salt). In Garamond Premier, the theta, kappa and phi alternates are also grouped in a Stylistic Set. In Arno, theta and kappa alternates are in the same Stylistic Set, and pi and phi alternates have their own Stylistic Set each.<p></p>
      <p>Notice how the default form and the alternate form of some letters differs, depending on the style (upright vs. italic) and the typeface. These decisions — design and implementation — were made by Robert Slimbach.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/gpp_arno3_4873.png"></div><br>
      The kai alternate is only present in 'salt'.<p></p>
