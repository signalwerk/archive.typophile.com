    html: "<p>Yes, I think your approach is correct Nick: the more cursive form should be default for U+03D1 regardless of what the default form of U+-0B8 for the particular typeface is. In the CT fonts, we didn't do this, because we were maintaining a largely identical glyph set between the styles, but probably should have; on the other hand, I'm not expecting people to use the U+03D1 codepoint. If one follows Adobe's one-glyph-per-character rule, then your approach may require the addition of an extra redundant glyph in italic fonts, if you want to provide the oval theta as a variant.</p>"
