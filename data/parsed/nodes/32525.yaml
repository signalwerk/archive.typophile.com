      <p>The question of whether the adscript or subscript mute iota should be the default depends on who your primary market is. Most publishers outside of Greece will be dealing with classical and Biblical texts, and the preference in the user communities is for the adscript. Within Greece, there seems to be a preference for the subscript form.</p>
      <p>I agree with Archaica's observations about the archaic variant forms, the lunate sigma and scribal pi.</p>
      <p>I might put the lowercase stigma in the dlig feature, but not the uppercase. The uppercase Stigma is a recently invented casing form for the lowercase, without historical basis. It exists to fill a hole in the use of Greek letters as numerals, but other than that it should be avoided.</p>
      <p>No, I don't think the kai should be substituted for the Latin ampersand. For better or worse it has its own Unicode codepoint.</p>
      <p>Yes, if you're going to include stigma in the dlig feature then omicron-upsilon would be a reasonable addition. These two are the longest lingering of the once extensive Greek ligature set. I've even seen them in graffiti in Thessaloniki. Regarding the application of accents to the omicron-upsilon, yes this certainly can be done (Granjon did). The assumption has to be that this ligature always represents the diphthong, so the accent is always on the upsilon, not the omicron.</p>
