    <p>I've completed the main <a href="/wiki/Greek" class="freelinking" rel="nofollow">Greek</a> Unicode block, and the Extended Greek block, for a couple of types.<br>
    (Actually, I've skipped the Coptic characters.)<br>
    Now I'm wondering how to implement the "extra" characters (variants, archaic, etc.) -- and not just leave them in the glyph palette.<br>
    Here's what I'm proposing at the moment, with several questions.<br>
    Default characters are in the left column, the alternates in the right.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/GreekOT_4644.jpg"></div><p></p>
