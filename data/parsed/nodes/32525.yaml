      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GrAlts1_6199.jpg"></div><p></p>
      <p>I'm puzzled by this.<br>
      According to Unicode,<br>
      03B8 = GREEK SMALL LETTER THETA<br>
      03D1 = GREEK THETA SYMBOL: script theta, used as a technical symbol</p>
      <p>And yet in the Italic of some fonts, 03D1 is less scripty than 03B8 (see above).<br>
      This toggling of style seems to be putting a stylistic alternate at odds with Unicode.<br>
      Looking at both Adobe Pro and Cleartype fonts, the treatment of italics appears to be inconsistent by both companies, with some typefaces having the closed forms of alternates such as theta as 03B8, and the script variants as 03D1, and some the other way around -- which is more consistent with Unicode, IMO (the same applies to phi, beta with descender, and the "latin" kappa). Like this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GrAlts1b_3755.jpg"></div><p></p>
      <p>However, it occurs to me that in the upright font, perhaps 03D1 could be oblique, as the technical symbol could be full script (like the litre symbol), and the variant, <em>upright </em>open form designated as 03B8.alt. Does that make sense?</p>
      <p>In my own italic fonts, I am considering making the default in the open script form, as I prefer that for those faces, and making the "variant" character the same glyph, as that seems to be more consistent with Unicode (see below). After all, if the technical symbol is called for in the italic font, and it doesn't look scripty, surely that is wrong.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GrAlts2_3869.jpg"></div><p></p>
    html_clean: |-
