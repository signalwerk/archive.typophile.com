      <p>My $0.02, based in part on having followed some of the debates about various Unicode proposals relating to some of these glyphs:</p>
      <p>2. Lunate (C-shaped) Sigma/sigma is specifically an ancient/medieval form, so as you say it is beyond merely "quaint" - it could be put in "hist" in addition to "salt" if you wanted, but there are so many different historical periods represented in Greek type that OT's simple "present vs. past" distinction is too simple, perhaps. Curly (omega-shaped) pi is also defunct (medieval/early modern) and probably belongs in "hist" if you create that feature.</p>
      <p>3. Your uppercase Stigma there is really more of a cursive Digamma, but it hardly matters, because the only place where Stigma is needed in uppercase is for numerals, where stigma and digamma merged long ago anyway. You could make it a quaint "dlig" in lowercase if you want, but I wouldn't do it in uppercase.</p>
      <p>5. The kai ligature doesn't need a grave accent because that's sort of assumed in the ligature.</p>
      <p>6/7. The omicron-upsilon ligature is still found occasionally in casual handwriting, more than stigma as a ligature certainly, but it's more like Comic Sans rather than polytonic in its modern usage.</p>
      <p>Also, I might be inclined to swap the tall phi for the script phi. The tall form is not standard in modern Greek, but to my eye, it looks less out of place in such a plain sans font than the script form does, especially when the rest of the stylistic set is script forms. This may just be my Porson-trained bias, though; I'd be curious to know what native Greek speakers think about this.</p>
