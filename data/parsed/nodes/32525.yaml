      <p>There is no requirement to use the "scripty" theta as the italic default form. My understanding is that it depends on the typeface. Garamond Premier Pro has the "scripty" theta as the default form in the italic, but Arno Pro does not. This was the designer's deliberate decision.</p>
      <p>On the other hand, the (default) form for U+03D1 needs to be the "scripty" one, as it was decided by Unicode. This should apply to both the roman and italic styles, . Arno Pro follows this convention.</p>
