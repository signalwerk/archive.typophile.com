    html: <p>BTW, we stopped putting the final sigma (ς U+03C2) in the 'fina' feature, as it confused/annoyed people every time they had to type a word containing a sigma (σ U+03C3) in the middle. And that didn't help the users anyway, because the final sigma has its own keyboard key, which they use.</p>
