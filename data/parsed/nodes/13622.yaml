    <p>Hi Everyone!</p>
    <p>I’m new here. I’ve been really into type these days, so I decided to join! Hope to get to know people here. Fun!</p>
    <p>I just designed a logo for an interior design company which also provides graphics (all graphics go to me), and here is the final logo. I’m a very minimalist and simplistic designer (which I am trying to break out of) and so are the owners of the company, so the relationship was great. </p>
    <p>Let me know what you think. I created the lettering myself on illustrator. Let me know if it looks too much like another popular logo that I might not know. I’m very new in graphics (graduated last year), so I want to know if this stacks up to the industry standards. Corporate ID is by far my favorite and what I’m best at.</p>
    <p>I’m very nervous about reading your opinions!<br>
    There probably wont be any changes, but let me know what you think.</p>
    <p>Thanks<br>
    Davide :)</p>
