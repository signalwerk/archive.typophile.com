      <p>I like it a lot. The only change I’d recommend is making the ‘i’ just a hint shorter, bring the legs of the ‘n’ up a hint, and do the same with the ‘l’. The bowls of letters such as ‘o’, ‘g’, and ‘n’ should be slightly above/below the baseline and x-height to compensate for the visual trick of the eye caused by their form. Otherwise, it’ll look like the circular forms aren’t aligning properly with the x-height and baseline, and appear too small. It’s very subtle, because you have so many circular forms. I notice it most on the ‘i’.</p>
      <p>You will run into trouble if this logo has to be faxed. ‘dgn.’ may drop out entirely. You may want to come up with a design that accounts for the essentially 100% black-only conditions of a fax machine.</p>
      <p>Again, other than that, I think it’s great.</p>
