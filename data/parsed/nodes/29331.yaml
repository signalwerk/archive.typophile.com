  html: |-
    <p>Can anyone suggest some possible substitutions I can use to get a take on the Psycho movie poster?</p>
    <p>I need both a version of the thinline movie typeface and a block lettering I can use to somewhat recreate this.  The tear through the lettering of course is not important.</p>
    <p>This is a pretty informal thing I need to design quickly though--reasonably close approximations of what I can use for this is more than fine.</p>
    <p>Thanks!</p>
