      <p>If you make it too literal it's going to look like a joke. But it's not impossible to –mildly– evoke a place with a font.* First question: who is the audience, and what do you want them to feel about the place?</p>
      <p>* See Lisboa here: <a href="http://typographica.org/on-typography/our-favorite-typefaces-of-2005/" title="http://typographica.org/on-typography/our-favorite-typefaces-of-2005/">http://typographica.org/on-typography/our-favorite-typefaces-of-2005/</a></p>
      <p>hhp</p>
