      <p>I hear you on being too literal. The audience is fans of pop jam bands i.e. Dave Matthews Band and Phish. The weather/sunshine would be a nice thing to evoke. Thanks for the recommendation of Lisboa, but think I need something that's display and decorative. Something that looks hand-lettered would be great, along the lines of what Methane Studios does:</p>
      <p><a href="http://methanestudios.com/category/dave-matthews?item=6141" title="http://methanestudios.com/category/dave-matthews?item=6141">http://methanestudios.com/category/dave-matthews?item=6141</a></p>
      <p>Thanks very much for your reply. It's also helping me to hone in on what I'm really going for!</p>
