  html: |-
    <p>Hi, </p>
    <p>I'm designing a poster for a concert taking place in Sydney, Australia and wonder if there is a typeface or font that feels representative of the city or whole country. Something whose shape could work with those of the Sydney Opera House (egg shapes, with curves) would be ideal. So far I've tried Sydney 2ooo and Merrivale, which was based on a late Victorian shopsign in Melbourne. However, I'm not in love with either of them. </p>
    <p>Suggestions would be greatly appreciated. </p>
    <p>Thanks!</p>
