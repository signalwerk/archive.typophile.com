    date_raw: 21 Oct 2005 — 9:22am
    votes: null
    html: '<p>If you want something a little different try "The Skilled Compositor, 1850-1914: An Aristocrat Among Working Men", by Patrick Duffy. Or, "The Swifts: Printers in the Age of Typesettig Races" by Walker Rumble. Some really great stories in both volumes.</p>'
