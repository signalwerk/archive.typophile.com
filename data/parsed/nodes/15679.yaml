      <p>Sounds like you need something obscure to rekindle the romance? Two of my favorite exotics: "Dimensional Typography" by Abbott Miller; and "Types Best Remembered / Types Best Forgotten", Robert Norton ed.</p>
      <p>hhp</p>
  - id: 91461
