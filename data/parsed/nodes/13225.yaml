      <p>I like writing on paper, too. If I had some kind of magic paper with undo, cut and paste, and spell checking, that would be ideal. It would have to look and feel just like pen and paper. Electronic tablets and styluses don't feel right to me (so far). Too slippery, too disconnected, and handwriting recognition is too unreliable..</p>
      <p>I used typewriters when I was young (thank goodness I learned how to type), but they were not very conducive to writing for me. I loved the tactile qualities, though.</p>
