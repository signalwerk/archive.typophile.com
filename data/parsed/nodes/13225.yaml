    <p>Hi,</p>
    <p>I was reading an existential article about typewriters the other day. Typewriters are dedicated writing machines, whereas computers do many different things.  I was wondering what kind of software autors use, more specificaly if there is some kind of software that lends itself particularly well to actual writing with a keyboard.  This is basically a question of interface. I was thinking of a few ways of creatng an interface that is suited to writing.</p>
    <p>- Chris</p>
