    html: <p>Post-modern type is ill defined, and usually an abused term. On the other hand, the valuable core of the movement does contain a lot of promise - but people are not letting it grow beyond childhood. <br> <br>The me that core is the truism that a system can never understand itself. It rejects the naive control-mania of Modernism, and moves to the East, for fuzzier -but much more human- communication. <br> <br>hhp <br></p>
