    html: "<p>Hmmm :/ I didn't <i>really</i> answer your question, did I? <br>Here goes nothing: <br> <br>As far as type design is concerned, I think a  <br>post-modern typeface is one that borrows traits  <br>of typical period faces and reconfigures them in a  <br>contemporary way, for example Neville Brody's  <br><a href=\"http://www.myfonts.com/fonts/linotype/industria/\" target=\"_blank\"> Industria</a> or <a href=\"http://www.myfonts.com/fonts/linotype/arcadia/\" target=\"_blank\"> Arcadia</a> which refer to the 30s and  <br>Quay's <a href=\"http://www.myfonts.com/fonts/letraset/bordeaux-roman/\" target=\"_blank\"> Bordeaux Roman</a> which is a narrow redesign  <br>of a Bodoni-style modern face.</p>"
