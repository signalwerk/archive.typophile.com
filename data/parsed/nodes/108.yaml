    html: "<p>Robert Bringhurst discusses postmodernism in \"The Elements of Typographic Style\". <br> <br>He classifies such faces as ITC Esprit (<a href=\"http://www.myfonts.com/fonts/linotype/itc-esprit/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/itc-esprit/</a>) and Nofret (<a href=\"http://www.bertholdtypes.com/bq_library/90082.html\" target=\"_blank\">http://www.bertholdtypes.com/bq_library/90082.html</a>) as \"Elegiac Postmodern\", and he classifies such faces as Emigre's Triplex (<a href=\"http://www.myfonts.com/fonts/emigre/packages/144211/\" target=\"_blank\">http://www.myfonts.com/fonts/emigre/packages/144211/</a>) and ITC's Officina (<a href=\"http://www.myfonts.com/Search?searchtext=Officina\" target=\"_blank\">http://www.myfonts.com/Search?searchtext=Officina</a>) as \"Geometric Postmodern\". <br> <br>He also lists Photina (<a href=\"http://www.myfonts.com/fonts/linotype/photina/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/photina/</a>) and ITC Veljovic (<a href=\"http://www.myfonts.com/fonts/linotype/itc-veljovic/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/itc-veljovic/</a>) as examples of postmodernist faces. <br> <br>He also discusses such faces as Electra (<a href=\"http://www.myfonts.com/fonts/linotype/electra/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/electra/</a>), Fairfield (<a href=\"http://www.myfonts.com/fonts/linotype/fairfield/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/fairfield/</a>) and Caledonia (<a href=\"http://www.myfonts.com/fonts/linotype/caledonia/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/caledonia/</a>, <a href=\"http://www.myfonts.com/fonts/linotype/new-caledonia/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/new-caledonia/</a>) as being precursors to (and, in the case of the digitization of Fairfield specifically, a transition to) postmodern type design. <br> <br>As a sort of definition or list of qualifying characteristics, he offers this: <br> <br>\"POSTMODERNIST (late 20th century): frequent parody of Neoclassical and Romantic form: rationalist axis; sharply modelled serifs and terminals; moderate aperture; italic subjugated to roman. (There are many kinds of Postmodernist letter....)\" <br> <br>I might also suggest the books, \"A History of Graphic Design\", \"Typology\", \"Typography Now\", Typography Now Two\", \"Twentieth Century Type Designers\" and \"Twentieth Century Type\", as possibly helpful resources. <br> <br>Good luck! <br> <br>David</p>"
