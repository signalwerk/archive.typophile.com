    html: "<p>&gt; Emigre <br> <br>Emigre -the old Emigre- is in fact the bastion of that laziness/hooliganism: countering the \"rules\" just for the hell of it, as a juvenile reaction, at most hoping there's something on the other side, sans real insight, sans real commitment. That's why it didn't really catch on - it refused to grow up, through critical introspection and objective analysis. A new movement can start chaotically, but can only sustain itself through discipline. <br> <br>The good news is that there's a new Emigre now, and looking at some recent font releases, maybe, just maybe they're on the golden PoMo track now (although all I for one really see so far is faint signals). If that's the case, it sure would be nice for them to admit -and analyze- their confused past. What's scary of course is that intelligent PoMo wouldn't sell very well at the moment. Well, intelligent <i>anything</i>, really... <br> <br>&gt; humanity is key <br> <br>One thing I would elaborate on that though is this: humanity isn't just formal humanism. The heart of any merit PoMo has (or could have) is the acceptance that humans are only half conscious. A serious, selfless perspective on communication is severely limited by restricting \"humanity\" to chirography, base animal emotions, or anything else: as much as possible needs to be considered, although necessarily imperfectly. And that's where Modernism implodes: it suffers from the classic Western chimera of Total Control. Give it up, people - it'll never work. <br> <br>&gt; Bringhurst <br> <br>Like most any other scheme, I find his classification useful, but imperfect. Two places it fails: <br>1) It treats type design as an Art, and that's less than half the picture. <br>2) Being based on existing culture, it cannot really cover anything <i>new</i>. <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; Emigre <br> <br>Emigre -the old Emigre- is in fact the bastion of that laziness/hooliganism: countering the \"rules\" just for the hell of it, as a juvenile reaction, at most hoping there's something on the other side, sans real insight, sans real commitment. That's why it didn't really catch on - it refused to grow up, through critical introspection and objective analysis. A new movement can start chaotically, but can only sustain itself through discipline. <br> <br>The good news is that there's a new Emigre now, and looking at some recent font releases, maybe, just maybe they're on the golden PoMo track now (although all I for one really see so far is faint signals). If that's the case, it sure would be nice for them to admit -and analyze- their confused past. What's scary of course is that intelligent PoMo wouldn't sell very well at the moment. Well, intelligent <i>anything</i>, really... <br> <br>&gt; humanity is key <br> <br>One thing I would elaborate on that though is this: humanity isn't just formal humanism. The heart of any merit PoMo has (or could have) is the acceptance that humans are only half conscious. A serious, selfless perspective on communication is severely limited by restricting \"humanity\" to chirography, base animal emotions, or anything else: as much as possible needs to be considered, although necessarily imperfectly. And that's where Modernism implodes: it suffers from the classic Western chimera of Total Control. Give it up, people - it'll never work. <br> <br>&gt; Bringhurst <br> <br>Like most any other scheme, I find his classification useful, but imperfect. Two places it fails: <br>1) It treats type design as an Art, and that's less than half the picture. <br>2) Being based on existing culture, it cannot really cover anything <i>new</i>. <br> <br>hhp <br></p>"
