yfonts.com/fonts/linotype/new-caledonia/</a>) as being precursors to (and, in the case of the digitization of Fairfield specifically, a transition to) postmodern type design. <br> <br>As a sort of definition or list of qualifying characteristics, he offers this: <br> <br>\"POSTMODERNIST (late 20th century): frequent parody of Neoclassical and Romantic form: rationalist axis; sharply modelled serifs and terminals; moderate aperture; italic subjugated to roman. (There are many kinds of Postmodernist letter....)\" <br> <br>I might also suggest the books, \"A History of Graphic Design\", \"Typology\", \"Typography Now\", Typography Now Two\", \"Twentieth Century Type Designers\" and \"Twentieth Century Type\", as possibly helpful resources. <br> <br>Good luck! <br> <br>David</p>"
