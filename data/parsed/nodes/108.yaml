    html: "<p>OK, I don't want to drag this back to politics again, but as postmodernism has been debated to death in that arena, some lessons from those debates might inform a discussion of postmodernism in typography, so here goes... <br> <br>&gt;&gt;I'm definitely a post-modernist <br> <br>When you say something like this in a philosophical context it can have 2 meanings: <br>1.'I believe in the principles I understand to be encompassed by the term post-modernism' <br>or <br>2.'I think we live in a post-modern age' <br> <br>You can hold both of these beliefs at the same time, or neither, or agree with either one while refuting the other. <br> <br>Would clarifying your position advance this discussion? <br>Has typography reached a post-modern stage? <br>If the world we live in is post-modern, what are the implications for typography and design in general? <br>(Perhaps the idea of a buch of plumped-up, self-serving graphic designers charging a fortune for their work is a thing of the modern era - you may scoff at bright yellow TNR on a royal blue background, accompanied by a selection of crappily cut-out clipart, or at arial and comic sans, but perhaps the democratisation of design and the stripping away of modern ideas of taste and composition are an inevitable feature of our post-modern future.   <br>'Employ someone? To create a logo? Oh that's soooo [pre-post-]modern!') <br>  <br></p>"
