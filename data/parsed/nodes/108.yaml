    votes: null
    html: "<p>The Eighties are back! <br> <br>I'll have to think about that one, Jonathan. As  <br>far as I understand it, basically Postmodernism  <br>was a reaction against the overly clean and  <br>neutral Modernist style with it's all-Helvetica  <br>(or similar 'neutral' sans serif) typography and  <br>subdued 'less-is-more' composition and graphic  <br>design. <br> <br>Postmodernism proclamed 'less-is-a-bore' and  <br>reintroduced classicist elements with added  <br>extravaganza: combining typefaces and distinctive  <br>period-styles (Ahhh... Bodoni mixed with VERY  <br>loosely tracked Futura all-caps <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> ). <br> <br>Typography-wise the most visible and well-known  <br>examples might be the 'typefaces' <a href=\"http://www.myfonts.com/Search?searchtext=neville%2Bbrody\" target=\"_blank\"> Neville Brody</a>  <br>originally designed for The Face (and those of his  <br>copycat <a href=\"http://www.myfonts.com/Search?searchtext=david%2Bquay\" target=\"_blank\"> David Quay</a>) and stuff found in the first  <br>issues of <a href=\"http://www.emigre.com/EMagView.php\" target=\"_blank\"> Emigre Magazine</a>. <br> <br>I hope I'm not making a fool of myself because  <br>this is all at the top of my (bald) head, yaknow.  <br>If you need other examples, I can do some research.</p>"
