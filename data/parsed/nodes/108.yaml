    html: <p>&gt;&gt;It's just that I immediately associate post-modernism with the eighties post-modernism which I grew up with <br> <br>One of the problems with post-modernism is that it means different things in different contexts (which could itself be a very post-modern thing) <br>In most cases it is a reaction against modernism, but modernism as a movement in the arts, for example, might be a well defined and relatively recent thing, whereas social and political historians talk of modernism as the whole shift towards rationalism following the enlightenment. <br>Someone might say, for example, that Marx's attempt to uncover patterns in historical development was a typically modernist activity, part of the modernist project to understand the world from a rationalist perspective and to set all knowledge into a grand scheme of life, the universe and everything. <br>A post-modernist might criticise this percieved approach, arguing that reality can't be shoe-horned into neat theoretical patterns. A post-modernist approach might be to argue that the world is (as hhp says) too fuzzy to fit into the modernist perspective. <br>One of the problems with post-modernism is its natural position hiding behind the coat-tails of the king's new clothes.  I'm sure it would be possible to say worthwhile things from a post-modern perspective, but too often its a cover for lazy thinking, which is immune to criticism because any complaints are obviously from a rationalist, modernist angle, which is just incapable of understanding the post-modern view. <br></p>
