      <p>Under <em>Software Use</em> it states: <em>2.1 General Use. You may install and Use a copy of the Software on your compatible computer, up to the Permitted Number of computers.</em></p>
      <p>I would take <em>use</em> in this instance to allow for graphic design work.</p>
      <p>Under <em>Definitions</em> it states: <em>"Use" or "Using" means to access, install, download, copy or otherwise benefit from using the functionality of the Software in accordance with the Documentation.</em></p>
      <p>I would find the word benefit to include design work.</p>
