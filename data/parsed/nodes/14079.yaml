    html: '<p>This topic has come up before. The problem I have with understanding the EULA is that it is difficult to interpret the rest of the agreement in terms of using the fonts as such. For example, the paragraph about "No Modification" puts restrictions on how other software may interface with the Software, but these only make sense when talking about interfacing with Acrobat Reader: i.e. creating plug-ins for it, or integrating it into other applications. You really have to stretch the meaning to understand such "interfacing" in terms of the fonts.</p>'
