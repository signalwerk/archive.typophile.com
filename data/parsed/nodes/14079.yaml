      <p>As far as I understand it the use of Adobe's bundled fonts is governed by the EULA for the software, of which the font is a part. <a href="http://www.adobe.com/products/acrobat/acrreula.html" rel="nofollow">see Section 1 subsection iii</a> <cite><strong>1. Definitions.</strong> "Software" means (a) all of the contents of the files, disk(s), CD-ROM(s) or other media with which this Agreement is provided, including but not limited to (i) Adobe or third party computer information or software; (ii) related explanatory written materials or files ("Documentation"); and (iii) fonts; and (b) upgrades, modified versions, updates, additions, and copies of the Software, if any, licensed to you by Adobe (collectively, "Updates"). ... </cite><br>
      So the font is governed by the same EULA as Acrobat Reader.</p>
