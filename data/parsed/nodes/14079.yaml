    <p>Dear typophiles,<br>
    I've just downloaded the latest version of Adobe Reader for Windows. After installing this free software I can see a new folder on my hard disk with some Adobe OpenType fonts (Myriad Pro, Minion Pro and Courier Std). Since Adobe Reader is a free software I suppose these great fonts are a free gift from Adobe. Am I right? Can I use these fonts for commercial projects? Where can I get the license agreement?</p>
    <p>Many thanks<br>
    albertoxic</p>
