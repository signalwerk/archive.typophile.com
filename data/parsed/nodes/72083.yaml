      <p><strong><a href="http://www.lucasfonts.com/fonts/thesansmono/thesans-typewriter/" rel="nofollow">TheSans Typewriter</a></strong> does not have multiple letter alternatives,that vary in their level of distress, but it is less distressed than Trixie.</p>
      <p>With regard to Trixie I would ask Fontshop for a sample PDF. I think, it looks more distressed on screen than in print and especially the light weights could profit from an inkjet printer.</p>
