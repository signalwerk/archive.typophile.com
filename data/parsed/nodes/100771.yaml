    <p>One of my favorite typefaces is Tanger Serif by Typolar. To me, it seems formal enough for business essays and articles, etc... but also adds a mild touch of unique style...</p>
    <p>But googling Tanger Serif doesn't bring up the various reviews normally found regarding other main stream typefaces...</p>
    <p>Was curious is anyone has had any publishing/design experience with Tanger Serif... and what their opinions might be...</p>
