      <p>One thing to note here is that Typographica failed to compile a "best of" for 2009 and 2010...</p>
      <blockquote><p>some foundries pays extra $ to get featured in the distributor's email newsletters.</p></blockquote>
      <p>Is this based on hearsay or could you offer some concrete details about this?</p>
      <blockquote><p>As soon as you see a tf used in a major publication or ad campaign you know it is a *good* one.</p></blockquote>
      <p>That's not my own world view. :-)  Exhibit #1: Mrs Eaves. Used by everybody and their neighbor's dog's groomer in the 90s. But seriously flawed. Exhibit #2: The "typography" (using the term quite loosely) of Avatar. I could go on until Pangaea reforms.</p>
      <p>hhp</p>
