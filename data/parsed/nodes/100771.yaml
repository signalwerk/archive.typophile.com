      <p>Thanks for the comments thus far... but maybe my question was mis-worded. What I was attempting to ask was NOT 'general information' about the Tanger Serif typeface (mostly what is found is written by the designer or Typolar corporately). </p>
      <p>But rather, my question was about how other professionals rated or viewed the typeface. To my novice eye, it is an interesting typeface with a bit of character that mainstream formal typefaces do not seem to have. I tend to like unconventional serifs such as Mamontov by omtype or in this case Tanger Serif, even for formal corporate business reports, etc.</p>
      <p>So... with the various typography blogs out there, I haven't seen much (if any) written about Tanger Serif, and was curious why this might be. Is it due to bad design of the typeface? Or bad marketing by Typolar? Or perhaps even that design professionals tend to remain loyal to 'safe' or 'mainstream' alternatives (such as something from Adobe, Linotype, et. al.) ?</p>
      <p>Hope that clarifies my question. Thanks.</p>
