      <p>Do you read French, Davide? <em>Le Romain du Roi: la typographie au service de l'Etat, 1702–2002,</em> edit by James Mosley, is the best work on the subject. It introduces all the elements that contributed to or influence the design of the new type, including the lettering or royal medals, Jarry's calligraphy, and of course Grandjean's role as punchcutter. In this larger context, the famous plates showing the rationalised design of the committee seem to me a product unto themselves, largely leapt over by Grandjean's interpretation, which refers back much more directly to Jarry's writing and to other existing models.</p>
      <p>The book includes a nice reproduction of a page of formal writing most probably by Jarry. Interestingly, the style of italic shown is closer to Fournier's type than that of the Italique du Roi.</p>
