      <p>James, I don’t know where in Paris you could rely on picking up a copy of the <em>Romain du roi</em> catalogue of 2002.</p>
      <p>I know that Frits Knuf Antiquarian Books, specialists in printing history with a big stock, have some copies. They are in Vendôme. (Vendôme is not very near Paris, but I’m told it is a nice town in some splendid countryside – and that name Vendôme has irresistible echoes of Excoffon and the Fonderie Olive. Maybe a trip for another time. They would certainly supply it by post.) I think that the Musée de l’imprimerie in Lyon, where the exhibition took place, still has copies available, too.</p>
      <p>As for the type itself, it is surrounded by myths. (No, Phil Meggs, it was not a crime punishable by death to copy it.) But it is certainly the first known type for which a separate ‘design’ was made. In fact the design seems to have begun simply as a rational way of making letters, before the idea for the making of a new type was launched. But then the two projects seem to have developed together. One of the other myths is that it was the punchcutter, Grandjean, who took the ideas of a set of non-practical technicians and made the design work in typographical terms. But it was Fournier le jeune, a professional punchcutter, who started that one. From what we have of the written record, it is clear that Jaugeon, one of the technicians directing the process, was frustrated by Grandjean’s inability to work accurately from the model in front of him, and in fact they dumped his first punches as unusable. The later ones were better.</p>
      <p>The calligrapher who comes into the story was not Jarry (who was certainly one of the great names of the century) but Allais. Gerrit got that wrong. Jean-Baptiste Allais published a writing book in about 1680, and the committee looking after the project agreed to follow some of his designs for specific italic characters. One of the distinctive things about French calligraphy of this time is that the lead-in stroke of letters like i, m, n and so on have flat, rather ‘roman’, serifs, making them look a bit like a ‘sloped roman’. That feature did not get into type with the romain du roi, but Fournier used it fifty years later in his ‘new style’ italics, and later so did Firmin Didot. And that French flat serif also turns up in, of all places (it’s a complicated story), the italic to Times New Roman. I have a feeling that I have written about this in an earlier thread (maybe someone can find it) so I will stop here.</p>
