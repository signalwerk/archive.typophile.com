      <p>In <em>The Stroke</em> Gerrit Noordzij states that “The minutes of the commission confirm what anyone can ascertain: the designs follow in detail the handwriting of Nicholas Jarry, who worked around 1650 as the calligrapher for the Cabinet du Roi. This history leaves us no other choice than to view the ‘romain du roi‘–the type–in terms of the handwriting of Jarry.” (page 17 of the English edition)</p>
      <p>IMHO design histories that try to insert specific breaks between type design are writing are dumbing things down for the sake of creating a simple timeline. The real history of type and writing is more like dozens of threads that weave through each other as type design and writing influence each other. The more time you spend studying it the more confused you’ll get.</p>
