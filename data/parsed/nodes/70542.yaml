    <p>Hi, i'm a new user of Typophile. I'm studying typography and print history. I have a question about Romain Du Roi typeface. Which was the relation between Romain Du Roi typeface and the calligraphy of that period? i read on some books that Romain Du Roi departed typography and calligraphy. i want to know more about this argoment.<br>
    Thanks for the answers!!</p>
