    html: <p>Hrant, you seem in danger of arguing against yourself, since what readers find legible 'these days' is a matter of familiarity, and if not necessarily of reading best what they read most, of reading well what they have learned to read. In my experience, learning to recognise the letters of a particular style in a writing system that you already know is one of the easiest of things. I don't think this is any kind of professional advantage that a 'layman' lacks, but is rather a core human ability that we have harnessed to the purpose of reading for a very, very long time. True illegibility is only found when there is no consistency within the style.</p>
