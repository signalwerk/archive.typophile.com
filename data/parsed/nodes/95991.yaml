      <p>Thinking about this, as it seems to me that bouma plays less of a role for Latin-alphabet readers than others, due to the high legibility of their letterforms, perhaps the soul of the Carolingian alphabet would be better captured... by a font which used Trajanus for its upper case and American Uncial for its lower case, or something like that.</p>
      <p>While that would, properly enough, cause howls of outrage and disgust from lovers of type, given the success of faces like Corona with what should be, one might think, an ugly and disfiguring x-height (and then there's Antique Olive) it might not be an obstacle to efficient reading.</p>
