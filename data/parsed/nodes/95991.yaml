      <div class="comment-spam-body"><p>I just came across this old thread when it was revived yesterday.<br>
      Here are a few observations on aspects not raised in the discussion.<br>
      Fraktur -- the most common typeface for books printed in blackletter before WWII -- was incomprehensible to me when I started to learn it in 1990. Most of the lowercase was understandable although a few letters like _k_ and _x_ were a challenge. However much of the uppercase was impossible. It took months before I could confidently tell the difference between letters like _V_ and _B_. As for the circularized _K_ and broken backed _H_... I have no doubt that my experience is typical of the few people who have attempted to learn how to read Fraktur in recent decades.<br>
      For over a century type designers have reformulated blackletter to make it legible without a special course of instruction. Some of the best efforts were done before WW I, notably by people like Behrens &amp; Koch.<br>
      The expressiveness of blackletter is a strong motivation for continued attempts to bridge the legibility gap.<br>
      I do notice a resurgence of blackletter in the most unexpected places. For many years non-German readers accepted blackletter in the context of religious texts. Then came rock music, particularly the heavy metal genre. Bikers. Tatoo aficionados. Today blackletter simplified Old English  is the signature of a Los Angeles street scene clothing created by a Latino company _Born + Raised_. Blackletter as the means of protest against the Man. Go figure!<br>
      Don</p>
      </div>
