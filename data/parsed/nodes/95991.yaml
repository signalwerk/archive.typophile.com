      <p>Nick, thanks for the Tulpe Fraktur link. Yes, it is consistent in the sense I meant, i.e. the form of each occurrence of a letter is easily identifiable.</p>
      <p>It's a display type, of course, and exhibits all sorts of things that are inconsistent with fraktur-proper, which is a particular historical text style of blackletter characterised by certain normative constructions and consistent variations. But that isn't the sense in which I used the term 'consistent' in my exchange with Hrant.</p>
      <p>I like it.</p>
