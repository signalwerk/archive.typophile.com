      <p>Zeno, your taste in blackletter, at least as so far indicated in your posts here, seems solidly confined to Victorian display types. I suppose these have a particular charm of their own, and certainly evoke particular periods and styles of typography very well, but I wonder how deeply you have explored other and older branches of the blackletter family tree? There are, for example, whole styles of blackletter that were developed for continuous text and that more fully integrate straight and round forms, making for less stiffness.</p>
      <p>And then there is this, which not many people have seen: the fraktur symbol glyphs from my Brill types, which I commissioned Karsten Luecke to design. This is not a fully functioning fraktur font, as the glyphs are encoded as math alphanumerics and spaced as symbols for use with roman text in <em>apparatus critici,</em> but I think it is a very fine design that I hope Karsten will complete and release as stand-alone fonts. It harmonises extremely well with the Brill roman, on account of mirroring the swelled stroke constuction, which is unusual in blackletter types although found in 18th Century German scribal exemplars.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/BrillFraktur_4395.png"></div><p></p>
