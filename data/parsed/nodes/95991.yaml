      <p>Ok. Just to throw the proverbial spanner in the works. Although black letter would not be my favourite script, I can see the attraction in black letter as a pen-written script, but black letter as a typeface is always a failure for me.</p>
      <p>Look at Gutenburg's black letter and there is clear evidence of it's pen-written origins. Having practised and studied calligraphy a little, I was always taught that, in black letter, the vertical spaces between the strokes should be visually equal to the strokes themselves; it is this basic vertical rhythm that gives it its name and its strength, its very blackness in fact.</p>
      <p>I have yet to see (could be famous last words here I fear, but that's ok) a typeface that demonstrates this rhythm and pattern successfully. The fraktur example above almost gets there in the bold variant, but still, like all the rest, just fails for me; sorry John.</p>
      <p>My absolute pet-hate in this area is the (usually) home-made signs, tee-shirts etc. using black letter, all caps. I feel I want to grab the offending person by the collar and shout in their face "What's the matter with you? Can't you see it just doesn't work? Can't you see it's just UGLY?" But I don't because many of them are bikers and a lot bigger than me so I just let cowardice be the better part of valour.</p>
      <p>Is there a black letter typeface that is true to the scripts origins?</p>
