      <p>Hrant: <em>In the terminology I use (which is pretty widespread) illegibility arises when an individual symbol is closer to some familiar character than it is to what it's supposed to be (or so far from the intended character that it's hopeless)</em></p>
      <p>Confusability -- when one letter is easily mistaken for another -- is only one form of illegibility, and I doubt if many people would consider it the most obvious. The other form of illegibility is simply inability to identify the signs at all, and my point is that this occurs if the forms are inconsistent within a style such that the style cannot be learned. As long as letterforms are consistent, it is remarkably easy to learn to read a new style of writing or typography within a familiar script system; this is even the case where the system itself permits of what I would call consistent variation, e.g. Arabic. People do this to one degree or another all the time, often without even realising that they are learning something new (and notoriously, sometimes without even being conscious of the differences, as in the case of people who'd never noticed 'the little feet').</p>
      <p><em>...you can't throw a classical blackletter at a general readership and say "deal with it"</em></p>
      <p>I think this is a matter of will rather than ability. It isn't that general readers couldn't easily figure out the identities of the letters and become proficient in reading the style in short order, but that their reading experience had been shaped by a fairly narrow set of styles and they are not used to being asked to learn new things in the sphere of reading, so are likely to be unwilling to try. But in the area of text typography, I think this is almost as true for the kind of new blackletter you promote as for any of the traditional styles. If you set a book or a magazine in Fraktoer, the likelihood of a general readership accepting it, buying it and reading it seems to me about the same as if you set it in the Brill fraktur. This has nothing to do with readability, but only with convention and perceived effort.</p>
