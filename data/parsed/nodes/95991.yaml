      <p><em>Look at Gutenburg's black letter and there is clear evidence of it's pen-written origins. Having practised and studied calligraphy a little, I was always taught that, in black letter, the vertical spaces between the strokes should be visually equal to the strokes themselves; it is this basic vertical rhythm that gives it its name and its strength, its very blackness in fact.</em></p>
      <p>This is typical of the textura style, but not of fraktur or other later blackletter styles that involve rounded forms and greater variation in letter width. It should also be noted that the term 'blackletter' does not always imply blackness or heaviness, only that the styles in this category are related in their develoment to styles such as textura and rotunda in which blackness was a feature. There are numerous remarkably light fraktur styles, in both written and engraved exemplars as well as type.</p>
