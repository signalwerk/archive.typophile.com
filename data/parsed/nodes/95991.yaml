      <p>John, it's certainly possible to learn variant (and even totally new) structures - as you imply I'm a big fan of that sort of thing. However it has to be done subtly/gradually and with intent - you can't throw a classical blackletter at a general readership and say "deal with it". The good news is that the real value of blackletter doesn't depend on a handful of archaic structures.</p>
      <blockquote><p>True illegibility is only found when there is no consistency within the style.</p></blockquote>
      <p>To me that's <em>unreadability</em>. In the terminology I use (which is pretty widespread) illegibility arises when an individual symbol is closer to some familiar character than it is to what it's supposed to be (or so far from the intended character that it's hopeless). For example the "A" and "S" in Brill will be confused for "U" and "G" respectively; probably not by people for whom the font was designed, but people in general. This idea is of course not my invention - it's presented quite explicitly in Bain &amp; Shaw's "Blackletter: Type and National Identity".</p>
      <p>hhp</p>
