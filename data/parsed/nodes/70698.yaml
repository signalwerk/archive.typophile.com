    html: |-
      <p>Hey Travis,</p>
      <p>don’t wanna be a killjoy but when I saw this, my first thought was these are FF Unit outlines, slightly blended with those of another font, e.g. Meta (Condensed) and adjusted in details.<br>
      The reason for my ‘suspicion’ might be the fact that there are a lot of ‘newbie’ fonts out there these days that share significant similarities with existing fonts, mainly differing in some ‘unusual’ characters or in details (most often at the end of strokes, since this is the quickest way to change the overall appearance of a font).<br>
      On the other hand, if you did this from scratch you could take my comment as a hint that your font might look too similar to an existing one.</p>
      <p>Cheers!</p>
      <p>J.</p>
