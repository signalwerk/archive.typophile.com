  html: |-
    <p>I've been working on this for a few weeks now, and it's about time to get some outside thoughts. </p>
    <p>I started off wanting to do something futuristic but classy, but may have strayed from that a bit, which is probably for the best. I see this as more of a headline font, especially in this weight, shooting for sizes 18+. Eventually, I might try to get the lighter weights to work in smaller sizes. </p>
    <p>Any thoughts would be greatly appreciated. I think what I'm struggling with most is the widths and proportions of the caps. The semi-double-story g will have to be an alternate, if included at all. </p>
    <p>No kerning yet, by the way.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/saloscreen_3615.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/saloscreen2_4638.png"></div><p></p>
