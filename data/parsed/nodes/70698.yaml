      <p>This looks very nice!<br>
      I think widening the glyphs a bit to let a little more white into those narrow counters might be good to try (unless narrowness is a priority purpose of this font). The counters look cramped, and consequently the whiteness of letters like /C/, /c/ and /r/ may jump out.<br>
      /W/ looks exceedingly wide; /T/ and /L/ might be a bit too wide too. Maybe /S/ too, which also leans backwards a bit, like /s/.<br>
      I like the /t/, and the shape of the lowercase ascenders. That's a nice /h/!</p>
