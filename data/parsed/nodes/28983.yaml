    html: |-
      <p>Being that this is a personal project my budge can increase with desire. I want to make a nice book so if I love a font and feel it as the right one, I will spend what I need. All within reason though. </p>
      <p>As for oldschool or newschool, I feel as if my photography in the book is very modern and personal, so maybe a more oldschool font will help to bring a balance to the book? </p>
      <p>i looked at Mendoza and feel that it could be a good font for my use. So maybe if there is a good font from the Netherlands that would compliment it, I would love to know what it would be. The font has to work as a display size, and will be used more for short headlines that will included numerals. </p>
      <p>Thanks so much for your expertise</p>
      <p>-Joe</p>
