  html: |-
    <p>Hello,<br>
    I am doing a book on my recent travels to Europe. We went through Amsterdam and Paris, and I would like for the sans serif to be from one country and the serif to be from the other, but I am not sure where to start. The two fonts need to work with each other, but if possible, keep a characteristic from that region. If anyone knows any good fonts from these countries please let me know. THANKS.</p>
