      <p>Would you use Mendoza for the text or for display? That would depend on things like the amount of text. In any case, I can’t immediately think of a Dutch face (old or new) that would nicely match Mendoza. Maybe FB Proforma*? Anyway, a very oldschool Dutch font is Fleischmann (even though the guy was actually German).</p>
