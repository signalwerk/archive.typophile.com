      <p>If you look at <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/itc-avant-garde-gothic/" rel="nofollow">Avant Garde Gothic Condensed</a> in the heavier weights, it is pretty close, except the R would need a bit of work.</p>
      <p>This seems like a faux-stencil, but in the 60's such a thing may have been created from an existing Sans (of which there were literally hundreds of variations of weight, width, and design details).</p>
      <p>- Mike Yanega</p>
