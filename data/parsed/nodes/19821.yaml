    <p>Are there any Fontlab experts out there that would have time/be generous enough to look at three Fontlab .vfb files and do what’s needed to make all 40 new generated characters work in Mac Type 1 — at present there are 5 that aren’t printing as they should.<br>
    We have done all the necessary design work in Fontlab 4.6 on the PC and everything works fine on the PC; then convert via TransType.<br>
    Very many TIA for any help.<br>
    Best wishes<br>
    John<br>
    Bookcraft Ltd</p>
