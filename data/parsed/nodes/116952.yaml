    votes: null
    html: |-
      <p>Where the thins branch off the stems, they look too thick, as if they thicken as they go in. This may be an optical illusion, but to counter it you may want to make them taper thinner as they join.<br>
      The horizontal terminal on /r/'s arm is awkward and doesn't really fit with the rest of the font (e.g. descender of /g/). Perhaps it should also be narrower.<br>
      Thick/thin pattern of /v/w/y/ feels backwards.<br>
      Crossbar of /f/t/ might be too thick.<br>
      /e/ looks too wide.<br>
      Are the right stems of h/m/n/u/ the same width as the left?<br>
      Lots of awkward curves but if you can work that stuff out there's promise in this.</p>
