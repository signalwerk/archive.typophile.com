  html: |-
    <p>Pretty much new to the forums here, but I've been lurking on and off for years.</p>
    <p>In that time, much of the stuff I've seen here has inspired me to finally chase the dream of putting my own font together. Over this weekend, I had a few sketches that stood out and I decided to run with them. The attached image is the lower-case result of those.</p>
    <p>I know I'm still a bit early in the process, but I really wanted to get feedback right off the bat. I'm still trying to grasp the technical details of font design and would appreciate input in that regard. I'm sure there's at least a few faux paus here.</p>
    <p>Overall, the style started its inspiration from the <a class="freelinking external" href="http://www.myfonts.com/fonts/yellow-design/verb/" rel="nofollow">Verb font family</a>. I liked the more angular feel it had to it, but wanted my own spin and something that leaned toward a serif rather than a sans.</p>
    <p>So, with that, I'm excited to hear everyone's thoughts and input.</p>
