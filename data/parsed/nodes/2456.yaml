    html: <p> Is it just me, or is the Nonlinear form considerably more readable than the Linear form? <br> <br>Both are great designs, but the Nonlinear characters seem to coalesce into words much more readily than the heavier, blockier Linear characters. <br> <br>I suppose they could be used as companions, but if it were me, I would use the Nonlinear much more than the Linear, I think. <br> <br>Regarding the punctuation, I think I'd like to see both the exclamation mark and the question mark extended by a pixel, even though it sacrifices the elegeance of the caps-height punctuation. (Perhaps making two sets -- a font with caps-height punctuation, and one with ascender-height punctuation?) </p>
