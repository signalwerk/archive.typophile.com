    html: <p> I was asking why design this face, but I can imagine it could well work on LCD devices like cell phones. <br>I totally disagree about it being good for web pages though. I have exceptionally good eyesight, something like 40-20, (or should that be 20-40?), and I have difficulty with it on screen. I think that has nothing to do with the traditional reasons that a font is not legible, but to do with the normal tendency of the brain to seek out familiar pattern - and the fact that at this size that just isn't happening. At least not for my brain! The type is so small that a kind of anti-anti-aliasing seems to taking effect. </p>
