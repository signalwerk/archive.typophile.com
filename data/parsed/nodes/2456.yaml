    html: "<p> Why, why, why, what, what, what? <br> <br>Why not align things as much as possible? <br>Conscious appreciation of display typography does admittedly give alignment some merit, but in the largely subconscious act of reading, alignment (of letterform components) is about as useful as compass to a dancer. <br> <br>I even doubt the value of the baseline itself (the Ancient Greeks for one didn't use it nearly as much as those regularity-freak Romans). But: This does not mean I doubt the value of interlinear space - it's crucial for guiding saccades. <br> <br>hhp </p>"
