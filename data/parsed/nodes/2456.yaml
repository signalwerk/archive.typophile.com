    html: "<p> &gt; It would seem odd to have the exclamation mark ascend higher [than the question mark]. <br> <br>It would, but I don't think it is!  :-) <br>And if it applies to bitmap fonts (where the unit is so huge), it certainly applies to outline fonts too! In my current design (my first Latin text face, I admit) I have the exclamation higher than the question mark (even though the reversed Spanish ones have the same span/location). <br> <br>It's tempting to align the excalamation (and question) marks with the UC and/or ascender height, but in actual text setting, where does the mark usually end up? After a string of mostly x-height glyphs. In text setting apparent size is much more important than alignment (which I feel is generally a very superficial merit in a text face). Since the question mark has a much stronger top than the exclamation, it only makes sense for the latter to go taller. <br> <br>Note: Thanks to OpenType you can now make exclamation marks of varying height, and specify which one to use when. <br> <br>hhp </p>"
    html_clean: "<p> &gt; It would seem odd to have the exclamation mark ascend higher [than the question mark]. <br> <br>It would, but I don't think it is!  :-) <br>And if it applies to bitmap fonts (where the unit is so huge), it certainly applies to outline fonts too! In my current design (my first Latin text face, I admit) I have the exclamation higher than the question mark (even though the reversed Spanish ones have the same span/location). <br> <br>It's tempting to align the excalamation (and question) marks with the UC and/or ascender height, but in actual text setting, where does the mark usually end up? After a string of mostly x-height glyphs. In text setting apparent size is much more important than alignment (which I feel is generally a very superficial merit in a text face). Since the question mark has a much stronger top than the exclamation, it only makes sense for the latter to go taller. <br> <br>Note: Thanks to OpenType you can now make exclamation marks of varying height, and specify which one to use when. <br> <br>hhp </p>"
