    html: <p> For the design constraints, it's pretty good! <br>At that size you'd normally use caps, but you never know what could be useful, so... <br> <br>Very smart to sacrifice some x-height discrimination in favor of boumas (word shapes). But the clogging in "e" and "g" (and in "a", "s" and "z" to a lesser extent) is a problem. <br> <br>Even in a 4pix x-height there are ways to avoid clogging, although it leads to some unconventional forms. For example, a 4pix bicameral "a" is one where the bottom row of a conventional 5-pix bicameral "a" is dumped (and the same could be done for the "e", but at the top). For the "g", I'd go with the Koch form (again). <br> <br>It's tempting to fall back on mono forms for "a" and "g", but the bi forms are what would make Benson Linear unique, and I'm glad to see you going for them. <br> <br>As for the caps, I think there are some legibility issues (like the "B"). BTW, since you have 2 pixels of descender, have you considered taking the caps one pixel lower than the lc baseline? I think they can afford to be bigger anyway. <br> <br>Anyways, keep it up! <br> <br>hhp </p>
