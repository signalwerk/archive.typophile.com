    html: "<p>&gt; 20-40 <br> <br>I think the first number has to be 20, and the second number is better lower. At my most recent eye test (about 3 years ago) I was 20/15. Maybe 40/20 is [somewhat] like saying 20/10, which is actually suspiciously exceptional! :-) <br> <br>Here's something via Google: <br><a href=\"http://www.milfordeye.com/vtest.htm\" target=\"_top\">http://www.milfordeye.com/vtest.htm</a> <br> <br>But note that those numbers refer to *feet*, and people have very different ranges. My range for example is extremely close: freeway signs are a little blurry to me, but during my eye test I undershot the equipment's minimum range! Probably from using computers for 23+ years now... Or maybe it was painting D&amp;D miniatures by candle-light: the bombs would cut our electricity...  :-/ <br> <br>Back to the font: <br>On the other hand, I think you're right that the font is too small for any normal definition of \"comfort\". But I also think that sometimes space is expensive enough to warrant using it (like the things Joe mentioned). It's a niche thing, which *does* make it valuable. <br> <br>hhp</p>"
