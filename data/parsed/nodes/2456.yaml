    html: <p> That's an interesting thought.... Which should be wider, though, the unemphasized "roman" or the emphasized "italic"? <br> <br>The reason I ask is because an italic is typically more narrow than a roman, but to achieve emphasis in this font, perhaps wider would be more effective? This might make it closer to a "bold", though. <br> <br>Perhaps, on the other hand, the emphasized text should be set in the narrower width for consistency with commonly recognized characteristics of italics, and not to be confused with a bold. <br> <br>(Musing out loud... or whatever one calls musing while typing... <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> ) <br> <br>David </p>
