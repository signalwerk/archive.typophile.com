  html: <p>In the spirit of dusting off work in progress, here's a specimen of a face I'm working on. This is an early port I made to the Mac several months ago to see how it looks on screen- The actual font is being designed on my Palm Vx, and I can already notice changes from this specimen.  <br> <br>How small can you go and maintain legibility? By allowing the ascenders and descenders to define the word shape, the 4px x-height is surprisingly readable. I'm curious to hear your thoughts. <br> <br><img src="http://www.typophile.com/forums/messages/29/227.gif" alt="benson linear"></p>
  html_clean: <p>In the spirit of dusting off work in progress, here's a specimen of a face I'm working on. This is an early port I made to the Mac several months ago to see how it looks on screen- The actual font is being designed on my Palm Vx, and I can already notice changes from this specimen.  <br> <br>How small can you go and maintain legibility? By allowing the ascenders and descenders to define the word shape, the 4px x-height is surprisingly readable. I'm curious to hear your thoughts. <br> <br><img src="http://www.typophile.com/forums/messages/29/227.gif" alt="benson linear"></p>
