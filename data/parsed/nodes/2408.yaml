  html: <p>Ok, it happend again. <br><img src="http://www.typophile.com/forums/messages/29/22389.gif" alt=""> <br> <br>I did a logo for a client which I think turned out very good, but now the company name was refused so they had to stick with CAPA and drops the &amp; ASSOCIADOS for legal issues. This laywer company is named CAPA that stands for the K word in Portuguese. Now I have some problems on the original concept. Tell me where makes more sense to you the type position. Should I only stick with the SERIF and drops Avenir for the description? Please be free to try other positions <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Thanks, I'll show the full ID after finish the logo. <br> <br><img src="http://www.typophile.com/forums/messages/29/22390.gif" alt=""> <img src="http://www.typophile.com/forums/messages/29/22391.gif" alt=""> <img src="http://www.typophile.com/forums/messages/29/22392.gif" alt=""> <img src="http://www.typophile.com/forums/messages/29/22393.gif" alt=""> <img src="http://www.typophile.com/forums/messages/29/22394.gif" alt=""></p>
