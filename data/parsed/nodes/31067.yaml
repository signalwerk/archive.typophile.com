    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Bold</strong></p>
    <p>A <a href="/wiki/weight" class="freelinking" rel="nofollow">weight</a> variation of a typeface which is heavier than the regular (often called <a href="/wiki/roman" class="freelinking" rel="nofollow">roman</a>) weight of a typeface. A bold typeface is often used to emphasize portions of text instead of <a href="/wiki/italic" class="freelinking" rel="nofollow">italics</a>.</p>
