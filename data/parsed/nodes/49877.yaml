    <p>When testing font families in ADFKO's Compare Family I get a long list of errors concerning the Blue Values.</p>
    <p>Can anyone explain whats the problem, if I need to fix it, and if so, how ?</p>
    <p><code><br>
    Blue Values Single Face Test 5: Check that the difference between numbers in blue value pairs meet the requirement.</code></p>
    <p>Error: The BlueValues pair have distance greater than the maximum limit.<br>
            Font: Heso-Light<br>
            Pairs: -13 0<br>
            Distance (13) is greater than 1/BlueScale ( 2.75)<br>
            BlueValues: [-13, 0, 511, 524, 676, 689]</p>
    <p>Error: The BlueValues pair have distance greater than the maximum limit.<br>
            Font: Heso-Light<br>
            Pairs: 511 524<br>
            Distance (13) is greater than 1/BlueScale ( 2.75)<br>
            BlueValues: [-13, 0, 511, 524, 676, 689]</p>
    <p>Error: The BlueValues pair have distance greater than the maximum limit.<br>
            Font: Heso-Light<br>
            Pairs: 676 689<br>
            Distance (13) is greater than 1/BlueScale ( 2.75)<br>
            BlueValues: [-13, 0, 511, 524, 676, 689]</p>
    <p></p>
