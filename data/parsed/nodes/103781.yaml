    html: |-
      <p>The Perpetua serifs are a conventional rendering of the old metal type.<br>
      The serifs in your image -- which have a sharp join to the stem rather than a smooth transition -- suggest a relatively recent redesign of Perpetua to give it additional crispness for display purposes.  I don't know if this is an actual new font, perhaps under a different name,  or a designer's word-smithing.<br>
      Don</p>
