      <p>I think that the accepted meaning of the term widow has changed over time to refer to the one word last line, and you have to accept that. Or else be the annoying designer who lectures all the editors who mark them as “widows”. Therefore becoming someone else’s pet peeve.</p>
      <p>MY pet peeve is when you call someone on a cell phone instead of just the message and the beep you get: “to leave a message just wait for the tone (yup, got that). When you have finished recording you may hang up (um... we know that too) or press 1 for more options (does anybody ever do that?). To leave a callback number press 5 (um... isn’t our number already stored under received calls?) To page this person press pound (anybody EVER do that???)” Meanwhile wasting our precious minutes.</p>
      <p>Another pet peeve? Friends who sit across from each other on the subway instead of next to each other, meaning they have to talk very loudly to communicate.</p>
      <p>And... people who don’t use bcc for all the names in the email, instead putting them all in the To line, which results in lots of unwanted emails from people hitting “reply all”.</p>
