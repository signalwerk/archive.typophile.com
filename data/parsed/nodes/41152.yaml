      <p>Like I said, I think it’s simpler to just accept that editors will mark short last lines (whether just at the end of a paragraph or at the top of a new page) as widows than to try to re-educate them all. </p>
      <p>FWIW Dictionary.com lists both meanings:</p>
      <p>3.	Printing.<br>
      a.	a short last line of a paragraph, esp. one less than half of the full measure or one consisting of only a single word.<br>
      b.	the last line of a paragraph when it is carried over to the top of the following page away from the rest of the paragraph. Compare orphan (def. 4).</p>
      <p>American Heritage Dictionary:</p>
      <p>Printing<br>
      a. A single, usually short line of type, as one ending a paragraph, carried over to the top of the next page or column.<br>
      b. A short line at the bottom of a page, column, or paragraph.</p>
