    html: |-
      <p>Hi Christine! :)</p>
      <p>Do you have huge alignment zones in your font? Try getting rid of them for now. Also, hints (as Nick said) could be a problem.</p>
  - id: 461881
    user: 112023
    date: 2011-04-26T00:50:00
    date_raw: 26 Apr 2011 — 12:50am
    votes: null
    html: |-
      <p>Cool, it works now! I got rid of the autohinting as well as the alignment zones.<br>
      (I never tried postscript and truetype, but exported it to the woff format, there were no problems).</p>
      <p>thank you!</p>
  - id: 461922
    user: 45774
    date: 2011-04-26T07:44:00
    date_raw: 26 Apr 2011 — 7:44am
    votes: null
    html: |-
      <p>Nevertheless your font looks like it would be easy to hint it. There seems to be something wrong with the rounded corners. Maybe the pathes have to be cleaned up there. And if the hinting causes this terrible effect even in such a big point size, I would also check the blue values. And maybe you have to add some ghost hints.</p>
      <p>More about PS hinting, alignment zones, ghost hints and so on: <a href="http://typophile.com/files/hinting.pdf" title="http://typophile.com/files/hinting.pdf">http://typophile.com/files/hinting.pdf</a></p>
