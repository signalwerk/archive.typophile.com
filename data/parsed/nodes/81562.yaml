    <p>Hi,<br>
    I am having an anoying problem generating an opentype font in fontlab:<br>
    After merging contours and generating the otf-file, my font looks fine in the preview and in fontexplorer, but when I want to use it e.g. in indesign or illustrator, some of the contours are distorted (in Textedit it works alright though). When I create outlines, all the contours look fine again.<br>
    see in the picture how it should be and how some letters are rendered.</p>
    <p>this happened in two completely different fonts I drew.<br>
    I am using font nuke, so it does not seem to be a cache problem.</p>
    <p>Does anyone have an idea why this happens?</p>
    <p>Christine</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/errors_4488.jpg"></div><p></p>
