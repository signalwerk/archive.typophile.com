      <p><em>And type designers *like* this model and want to pursue it?</em></p>
      <p>My point in response to your first message is that type designers <em>don't know</em> whether they like this model, because they don't know if it will work in terms of revenue, in terms of customer loyalty, etc. or how these things will balance out. People are experimenting with different models. Your response to FontShop's model is an important one, but its too soon to expect them or anyone else to just change their model because you say they should. What if the revenue from this model turns out to be significantly better than that from e.g. Typotheque's model or the various subscription models?<br>
      _____</p>
      <p>To me, the problem with basing pricing on number of page hits is that it assumes some kind of correlation between the quantity of hits and the commercial value of the site, and hence the added value contributed by the fonts. This is problematic, because I don't think it is reliably the case. It also assumes that high traffic is an intentional goal of every web publisher, i.e. something that they want and hence are willing to pay for. But of course the amount of traffic a website gets is determined by the visitors, not by the publishers, so one is faced with the awkward situation of e.g. non-profit, non-commercial blogs generating more traffic than the bloggers can afford to license fonts for.</p>
      <p>I'm also not generally happy with banded pricing models which, like tax brackets, have built in inequities. A licensee whose site receives 499,000 page hits per month pays the same amount as one whose site receives only 5,000 page hits per month, but another whose site receives 501,000 page hits pays almost four times as much.</p>
