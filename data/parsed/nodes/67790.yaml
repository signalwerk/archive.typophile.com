      <p>I am looking at the screenshots on Mac OSX. But I see colors every time I look at ClearType on Windows, too. I find it more disturbing than Quartz, even though I dislike Quartz subpixel rendering for the same reason (colors). My favorite setting is simple greyscale anti-alias, if possible gridfitted. Maybe I'm just hypersensitive to colors?</p>
      <p>The point I am trying to make is that many of the recent ‘problems’ with font rendering on the web come from using fonts and conventions from print (<a href="http://en.wikipedia.org/wiki/WYSIWYG" rel="nofollow">wysiwyg</a>). From my (very peculiar) point-of-view, the issue of sharp screen type has been solved several years ago with bitmap fonts and pixel fonts for Flash. Such fonts don't look good on print, but with html/css one can easily specify a proper stylesheet for printed media, with proper print fonts.</p>
