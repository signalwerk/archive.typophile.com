      <p><cite>you either pay for a license granting you unrestricted use of that image, or you pay per use.</cite></p>
      <p>Aaron, perhaps you should stay off the analogies for a while, they don’t make your arguments any clearer.<br>
      If you license an image, there are plenty of libraries that license for an exact print run – one fee up to a given number, another beyond that until the next number – just like the proposed webfonts license fee.</p>
      <p>And, just as with images, there is a choice of libraries. If you don’t like one model, look for another one. They may not have the perfect image for your purpose, but you have to choose between your ambitions as a designer and what the budget allows. So, if Rahim loves FF Milo and thinks it is perfect for the project on hand, he’ll either get budget from the client – as you would with an image – or go for another typeface if the budget doesn’t allow for a few hundred additional dollars. We all know that you cannot design a decent website that expects a few hundred thousand page views for anything less than five figures, so the webfont license is but a very small portion of that. As you would not use more than four weights of a family on a website, we are talking about $142 for a font that will make this website look beautiful, be on-brand, legible, unique. If that is too much, then there are plenty of choices. Luckily, using less-than-perfect fonts on a website is not a matter of life and death, and nobody will get fined, punished or excommunicated for sticking with Georgia. </p>
      <p>You can also rent FontFonts if you don’t mind them being served by someone else. </p>
      <p>I am not sure what Rahim means by “social implications”. Do typedesigners have a particular responsibility towards webdesigners? Like making sure they can indulge their typographic phantasies without being disturbed by mundane issues like paying for fonts? What if FontShop International told their 30 or so employees that wages needed to be cut because they were now delivering a social service to the community? Which will love them in return? Will webdesigners starve because of the price of fonts? Does FSI have a monopoly like Microsoft, Apple or Adobe who are all well-known for giving away software? </p>
      <p>And to venture an analogy myself: I love buying hardback books. Now and again I will also buy the paperback version of a book, to take it on a trip, to give it away or because I’ve misplaced the original version. Do the publishers give me a break? After all, they only have to take the same data and print it again.<br>
      Do they heck.</p>
      <p>Finally: who says that volume is the only business model? Ten fonts @ 100 is the same as 100 fonts @ ten, but a lot less hassle with updates, complaints and invoicing. The iTunes model is not the only one. Fonts are not sold by the thousands, let alone millions, and to my knowledge there are no millionaire typedesigners. And if there were: do you expect Steve Jobs to lower the price of Apple products just because he is a millionaire?</p>
