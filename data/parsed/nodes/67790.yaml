      <p>I know analogies are bad and quite flawed when comparing...but Jens post got me thinking about cup holders.</p>
      <p>Cup holder are likely the least important aspect in terms of judging a car's quality overall, but it's what people focus on. Hinting is the core indicator of quality for on-screen type but most folks are likely just going to be looking at price or ease of implementation (ie, the cup holder) and "yea, that looks good enough".</p>
      <p>I appreciate all the samples being posted...it's really useful to see the differences.</p>
