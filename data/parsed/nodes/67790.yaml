      <p>Aaron: <em>OK, bad analogy - what about MP3's? no wear and tear there ... an how would you feel if you had to pay the record companies if you played it over a certain amount of times after you'd bought it from iTunes (or where ever)?</em></p>
      <p>Digital music is the perrenially bad analogy to digital type, trotted out reliably every few months. Font are not consumer products; fonts are professional tools that add value to publishing. Fonts are not something licensed for private enjoyment by the person who buys the license; fonts are incorporated into published material. So, if you want to find an analogy in the music world, you have to look at something like broadcast rights, which is actually a pretty close analogy to served typography. And what do you find? Radio and television stations do indeed pay by play: they don't buy a CD for $9.99 and with it the rights to broadcast a tune as many times as they like. And why look to music anyway? There are plenty of direct analogies to be found in the rights licensing of other aspects of design: photography and illustration being obvious examples.</p>
