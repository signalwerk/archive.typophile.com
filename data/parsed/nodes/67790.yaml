      <p>Aaron: <em>Just so we're on the same page, can you explain for me your view/understanding of the 'different piece of font software' that the designer would be paying extra for?</em></p>
      <p>In addition to what others have written:</p>
      <p>The level of technical differentiation of web fonts from desktop fonts will vary. Obviously if a desktop font is in TrueType format and has been designed and produced with screen readability in mind, then it is going to be more directly converted to an .EOT or .WOFF web-servable font. If a font was originally licensed as a PostScript font, it will need to have been converted to TrueType format, both in order to be made to work as a .EOT -- due to a bug in IE's web font support -- and in order to improve screen rendering on Windows in both .EOT and .WOFF.</p>
      <p>I've not seen the FontShop web fonts, so can't comment on the degree of work that would have been required to make them as distinct from the desktop versions of the same typefaces. But in terms of constituting a separate product under a separate license, it doesn't really matter.</p>
