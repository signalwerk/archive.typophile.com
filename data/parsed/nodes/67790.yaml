    html: |-
      <p>Just saw <a class="freelinking external" href="http://www.typotheque.com/webfonts" rel="nofollow">Typotheque's</a> pricing for web fonts:</p>
      <p>OTF<br>
      Brioni Text Std (bundle)<br>
      8 fonts (60.00 per font)<br>
      480.00 EUR<br>
      (this is the full license which includes print and web)</p>
      <p>WEB<br>
      Brioni Text Std (bundle)<br>
      8 fonts (12.00 per font)<br>
      96.00 EUR<br>
      (this is just web)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/TypothequeWebFonts_5046.png"></div><p></p>
      <p>One time license cost, unlimited domains. As a potential buyer, I feel a bit appreciated seeing that.</p>
      <p>As for others: just because you can set high prices for something doesn't mean you should and it definitely doesn't mean it's good business. It's not just economics. It's also customer relationship. Are you building trust? Isn't that how we think about business in 2010 or is the type industry still following some "rake in as much money as you can, boys" model?</p>
      <p>And I'm sorry, just because you are a type designer it doesn't mean money will instantly roll into your lap. It's the same for musicians, painters, songwriters, etc, anyone who does anything for a living. You get paid well when you create lots of value for somebody. You don't get paid just for putting in the hours to create your art. I know you know this, but I think you forget and wish it was otherwise.</p>
      <p>Just because you spend years working on something doesn't mean you deserve a million dollars. There are plenty of people who spend years working on 10 songs and have to charge $13.99 for a CD and HOPE they can pay the bills through volume sales. There are people who stayed up all night for 18 months straight to write that iPhone app that now sells for $0.99 and have only 100 people buy it so far.</p>
      <p>You can't just create a tool, put it out there, and say, now pay me what I deserve. Are you kidding me? What kind of entitlement mentality is that? "Oh you're going to use my font on your server, I guess I'll charge you for every pageview. I gots to gets whats mine! I have the power, you know. It's a different industry than print. I can change the rules. Yes, I can. Watch me."</p>
      <p>You have to create value for lots of people if you want lots of money and attention and praise. Create value, please. Stop thinking like Microsoft who charges us for every last bit of using their stuff when they can, however they can, however they can get away with it. If every software designer charged you for every time you used their software on your computer, you would be broke, bankrupt, and in massive debt collection proceedings. And type designers *like* this model and want to pursue it?</p>
      <p>Trust and reputation go very far. Please focus on that. The rest is just bluster.</p>
