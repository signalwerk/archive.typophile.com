      <p>@frode frank</p>
      <p>&gt;I too would love to see some real life comparisons of what the hinting involves.<br>
      &gt;Typoteque’s fonts are very variable in preformance in different systems and browsers.</p>
      <p>We're moving OT here, but....</p>
      <p>That's a question you should put to Paul B, of Typotheque. (Or maybe I will.)<br>
      In Windows, at least, it seems TrueType hinting can homogenize - there are still differences, but they are less apparent, from browser to browser.<br>
      It's interesting that the variations in font rendering within browsers has only now fallen under scrutiny with @font-face. It happens with the "web safe" fonts, too, you know.<br>
      Perhaps when you are powerless and have to accept a thing you cannot change, there is a willing suspension of discernment.<br>
      What we have managed to milk out of the web safe fonts for fifteen years is unbelievable.<br>
      @font-face is one way to tackle the lack of variety. But there are technical and learning barriers to overcome. The other way would be to add to the web safe fonts.<br>
      In 2005, Joe Clark wrote a blog post urging Apple to license the ClearType fonts from Microsoft for inclusion on the Mac.<br>
      <a href="http://blog.fawny.org/2005/01/21/ccccccm/" title="http://blog.fawny.org/2005/01/21/ccccccm/">http://blog.fawny.org/2005/01/21/ccccccm/</a><br>
      This would have, at least, doubled the typographic palette that web designers had to work with and, considering how much mileage has been gotten out of Verdana, Georgia, et al, this would have been no small thing. It's not too late for this, either.<br>
      Here's a great survey question:<br>
      Where do the web safe fonts on the Mac come from?<br>
      1) They've been there since the beginning. (circa 1995, when the world began)<br>
      2) Steve Jobs won the rights to use them in a card game with Bill Gates.<br>
      3) Steve Jobs invented them.<br>
      4) Apple licenses them from Microsoft.<br>
      5) The web safe fonts are public domain, free for anybody to use.</p>
      <p>Apple users would most probably pick number three (just joking, I'm buying a Mac in a couple of months) but I'm betting number 5 would get selected the most.</p>
      <p>Lastly - when you get charged monthly by the number of page views, what happens if you fall behind in your payments? Does the font company stop by like the electric company does and give you one last chance to cough up before turning off the fonts?</p>
      <p>"Hey man, don't turn off the fonts, please. I got kids."</p>
      <p>Later frode,</p>
      <p>rich</p>
