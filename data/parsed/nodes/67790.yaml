      <p>I think if you want to judge hinting quality, you have to learn to look at rendered fonts the right way. Just like you need to develop an eye for proportion and rhythm if you want to design type. It helps to know what hinting can and cannot do in order to judge its quality. Differences may not be visible at a glance, but remember that letters will be repeated over and over when fonts are used, and small faults can really become annoying over time. All the little details add up.</p>
      <p>It's true that autohinting works well for some sizes. Unfortunately which sizes are affected is always different. And if you do the hints right in one size, that usually also fixes the other sizes.</p>
      <p>Here are some more samples, using <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_kievit_web_pro/" rel="nofollow">FF Kievit</a>. I made these using Word 2007, which switches between ClearType and Greyscale smoothing at a certain size, so don't be confused :) I've added a grey dot to the lines that use Greyscale ("Windows Standard") smoothing.</p>
      <p>-<br>
      FF Kievit Thin Italic. First line is Autohinting, second line FSI hinting. Look for inconsistent stem widths.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/kievit-thinitalic_5885.png"></div><p></p>
      <p>-<br>
      FF Kievit Light. Lines 1 &amp; 3: Autohinting, 2 &amp; 4: FSI hinting. First two lines: Autohinted CDO are flat on the bottom, vertical proportions of a are off, g has a black spot, pq have kinks in the bottom, u looks rectangular.</p>
      <p>Second two lines: inconsistent pixel widths of stems.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/kievit-light_5385.png"></div><p></p>
      <p>-<br>
      FF Kievit BoldItalic: In the first line (Autohinting), inner stem of B is too thin. Upper right corner of PR is too dark. Stem widths are inconsistent between top and bottom of bowls in abdgop, also visible in the bigger size.</p>
      <p>Third line: stem of B gets wider from bottom to top, bottom bowl is too dark on the right curve. Q is too thin where it touches the baseline. Spine of S is too thin.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/kievit-bolditalic_6699.png"></div><p></p>
      <p>-<br>
      FF Kievit Black: First line (autohinted) is barely readable. I've marked some more of the problems I'd correct manually. The fifth line shows some errors that are apparent in Greyscale mode but not in ClearType: The top bowl of B is farther right than the bottom one, but in the actual design it's of course the other way round. S leans to the right. Left curve of e doesn't follow through. Dot of i is misplaced.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/kievit-black_4619.png"></div><p></p>
      <p>-<br>
      I'm not so sure any of these comparisons should be used in marketing. It's too complicated, I doubt a non-typedesigner person will even have an idea what this is all about. And if you take the effort to explain this to your font-buying customers, keep in mind they are not the ones who will be reading the fonts most. Especially with regard to web fonts. Web site visitors will not care what effort went into hinting, they just see (hopefully) if a font looks good or not on the whole.</p>
    html_clean: |-
