      <p>I agree. This model isn't going to work for me. Even though our site (<a href="http://www.hexanine.com" title="www.hexanine.com">www.hexanine.com</a>) isn't yet busting the boundaries of pageviews at the lowest level, this seems like a silly way to define the license. This is far too expensive for what you receive and as has been said earlier in the thread, I want a reasonable upgrade path from fonts I've already purchased, for use on the Web.</p>
      <p>While it's true that these are uncharted waters, the licensing seems out of whack with demand. I'm not a type designer (and sympathize with how little compensation you type creators receive) I don't think Web fonts are going to solve that problem in one fell swoop. That's what it feels like these licenses are trying to accomplish for the foundaries. I would advise FontFonts to think about the "long tail" of this and reduce pricing so that ubiquity is the goal--and they will make much more money in selling relatively inexpensive web fonts to *many* people for use, rather than moderately expensive type to a handful. In many ways, getting to the ubiquitous stage could mean the survival/continued relevancy for foundaries in the future Web-enabled age.</p>
