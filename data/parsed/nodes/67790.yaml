      <p>Also: I am not demonizing type designers. Demonize is a pretty strong word for these same type designers that I admire. All I'm trying to do is point out that some artists (including type designers) have a cognitive disconnect in their minds between doing their art and wanting to be financially recognized for it and creating value for their future customers.</p>
