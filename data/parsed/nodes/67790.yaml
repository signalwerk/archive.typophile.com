      <p>Aaron:<br>
      the hardback book is the .otf font and the paperback the .woff. You pay separately for those two types of book which have the same content, as you will have to do for a print font and a webfont. If you design a brochure for a client, you need the font and you can send a pdf to the printers. As soon as the client or the printer makes any changes to the document, they also need a license. And if a client has chosen a typeface for their communication, it is very likely that they will want to use it in-house, for Powerpoint, for Word documents, even for design work. Over the life of a typeface, a license fee of a few hundred $, £ or € is negligible. One image from a professional photographer will cost more and can only be used once.</p>
      <p>I also buy fonts because I like them but have no instant use for them. Like I buy books that I’ll read later (or not), have more than one bicycle although I can only ride one at the same time. (Disclaimer: we have access to fonts on our server by special arrangement with several foundries, but as soon as we use one of them for client work, we buy a license.) If type is a tool that you use, you need to buy it. If you build websites for less than 10k of whatever currency, then you cannot be expected to invest and will have to do with system fonts. But then those brands cannot expect to look different from others. An expensive way to avoid paying for adequate typography.</p>
