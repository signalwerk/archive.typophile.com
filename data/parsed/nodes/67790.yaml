      <p>&gt;But there are one-size, one-platform benchmarks for comparing different text fonts at the same size on the same platform, </p>
      <p>I think this is a thin slice of bench and not much of a mark. </p>
      <p>For example, what if the comparison font is designed based on the ppm grid at which you want to compare a perfectly good text font designed based on another ppm grid? The benchmark font could look GREAT on its grid but CraPola on the grid of the font you want to compare it to... Is your font better than the benchmark, or worse? Or.... should all fonts be drawn to the grid of the benchmark? Are fonts with built-in leading of any amount, forever inferior at all text sizes?</p>
      <p>And once you've seen these fonts on one platform at one size, and determined that they are equally brilliant or mediocre, What do you know about them as web text fonts?</p>
      <p>&gt;... which so far has not happened...</p>
      <p>I think a number of people have lent little voices all along, and others have been making more noise based on tests such as this but older. The results then were that we need all the great digital font technologies we've ever had ('cept for maybe 1), not a lowest common denominator of two, to really solve the issues of web typography.</p>
      <p>I needed most of these technologies to design a puny-human web-font-format bench, before I could begin to mark it ;)</p>
      <p>Cheers!</p>
