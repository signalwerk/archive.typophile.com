      <p>In the case of many of these new Web FontFonts, it is probably much more practical for smaller-scale licensees to go with a Typekit subscription. For instance, consider the following…</p>
      <p>Cost to license the FF Meta Web Pro Basic Set of 4 styles via FontShop = <strong>$197</strong><br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_meta_web_pro_basic_set/" title="http://www.fontshop.com/fonts/downloads/fontfont/ff_meta_web_pro_basic_set/">http://www.fontshop.com/fonts/downloads/fontfont/ff_meta_web_pro_basic_set/</a></p>
      <p>Cost for use of the full Typekit library of 400+ fonts for 1 year, including those same 4 styles of Meta Web Pro = <strong>$49</strong><br>
      <a href="http://typekit.com/fonts/512" title="http://typekit.com/fonts/512">http://typekit.com/fonts/512</a><br>
      <a href="https://typekit.com/plans" title="https://typekit.com/plans">https://typekit.com/plans</a></p>
      <p>There are of course cases, like with Milo, where the option to get the fonts via a Typekit subscription doesn't exist and you would be forced to license via FontShop.</p>
      <p>There is also the argument of people who would rather host the FontFonts themselves, but in many ways that notion is still invalid for anyone who aims to cover all their bases browser-compatibility-wise: the FontShop option uses Typekit for Safari and Chrome support.</p>
