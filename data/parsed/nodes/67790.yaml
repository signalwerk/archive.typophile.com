      <p>Rahim: I did not express or imply any support for any licensing model. So I don't know why you are being so defensive.  So far you are coming across (to me) as hotheaded. Your language is very strong, and "demonize" isn't too far off from the portrayal you've made of this mythical greedy designer. I don't know any type designer who is that greedy or entitled. </p>
