      <p>Mr Berlow: <em>Mr. Hudson's 'benchmarks' e.g. do not show this because they are chosen fortuitously, or something.&lt;.em&gt;</em></p>
      <p>Or because they're Georgia and Verdana, and are designed to be close to grid-fitted stems and spacing -- at or somewhere close to the ppem size I show --, so don't vary in width horizontally between aliased and antialised as much as a lot of other fonts will.</p>
      <p>Mr Berlow again: <em>And once you've seen these fonts on one platform at one size, and determined that they are equally brilliant or mediocre, What do you know about them as web text fonts?</em></p>
      <p>So far, you'll know that most of them are crap, and that the web is going to become a very ugly and difficult thing to read in the next couple of years.</p>
      <p>Re. fonts designed for specific ppem sizes: a) obviously they should be compared at the size at which they look best and b) they don't worry me, especially not if you are making them.</p>
      <p>Can I go back to calling you David now?</p>
