      <p>@ Stephen For me, the main issue in all of this is that what is being propose is selling a licence, <strong>PLUS</strong> charging for a service. By definition, a licence gives 'excessive freedom' and 'lack of due restraint'. Exactly what is being proposed does <strong>not</strong> do. </p>
      <p>If foundries want to distribute fonts as a service, rather than a product, then by all means do that. But you can't have your cake and eat it. If this model was put into practice elsewhere, then we'd be paying Adobe not only to licence their software, but also additional fees once we'd produced X amount of documents.  </p>
      <p>In my opinion, services like Typekit are great. I pay a certain amount for a defined amount of access, <em>without</em> an upfront cost. If I want more access, I pay more. I really think it would be in Foundries best interest to look at rolling out a service like this for print as well as the web.</p>
