    html: |-
      <p><cite>Is it true that: The client (organization that runs the web site in question) licenses the fonts, and then the fonts can be used on all domains this client owns/runs; but I, as a web designer in this case, do not have to license the fonts in my name as well in order to do work on the web sites on these domains?</cite></p>
      <p>This is true (as it is also for ‘print fonts’ when you have to do a project with your client’s corporate font), but you as a designer may transfer your license to your client after you have finished the work on the website (provided that you delete all your copies of the fonts and the transferee accepts and agrees in writing [with copy to FSI] to be bound by the EULA).</p>
      <p><cite>And if the client uses the font on multiple domains, the average page views from each domain are just added together?</cite></p>
      <p>Yes.</p>
