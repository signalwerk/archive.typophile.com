      <p>Eriks point above is completely valid, and yes, If I was working on 5 figure websites then it wouldn't be an issue, but this isn't always the case.  I know a lot of designers who buy fonts not specifically for a job, but because they love the typeface. I do this, and I love it. It's great to be able to play around with it, knowing that you can use it down the track on a job.</p>
      <p>But under the web font licensing agreement, if i purchase a normal .otf font I'm not able to use it online, and then if I turned around and bought the webfont, I wouldn't be allowed to use it on a clients website unless the client themselves purchased a separate license - "each of your clients will need their own licensing for use on their websites" - as mentioned by Ivan here <a class="freelinking external" href="http://www.fontshop.com/blog/?p=1661" rel="nofollow">http://www.fontshop.com/blog/?p=1661</a> (18th comment)</p>
      <p>I just find this disappointing because at present, most sites I work on are mid 4 figures (at most), which means there isn't going to be much room for additional budget for type, and even if I buy a webfont family license for the studio, they are not permitted to be used on external sites for clients.</p>
