      <p>"Web FontFonts are licensed by the average pageviews per month "</p>
      <p>Well, I see two ways to think about this:</p>
      <p>1) Lots of stock photography is licensed this way. So there is precedent in terms of it being a model.</p>
      <p>2) Man, what a pain. A licensed based on legal wording that doesn't necessarily match with the technology's use in the real world. I might as well just use Georgia.</p>
      <p>I have a hunch #2 is the bigger issue in terms of sales. FF is certainly free to charge what they want in any license they want, and perhaps there will be folks that want to pay those prices for a font for their web site. But the alternatives are so plentiful and cheap that it might not be much of a market. </p>
      <p>I can see why Ikea switched to Verdana.</p>
