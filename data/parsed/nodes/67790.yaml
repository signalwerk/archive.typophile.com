      <p>Here's another way to think of the issue of how web and print use differ. To create thousands of impressions of a newspaper, the font is used once (basically) and those impressions are made by a plate that prints the newspaper - the fonts are no longer used. The web is different because for each impression, the fonts software is used over and over again to serve each page. Arguably, different use than if it were on someone's computer, but distinctions can be made.</p>
      <p>I don't agree or disagree with the pricing scheme, but there's certainly something to be said for putting schemes in place. That's a start.</p>
