      <p><cite>This makes about as much sense as paying car companies for every kilometer you drive, even after you have bought the car.</cite></p>
      <p>I cannot believe anybody would bring cars into the argument. You buy a car for $30,000. The minute you drive it off the yard, it’s worth 3000 less. A year later, you’ve lost 10,000. A cheap car will last perhaps 160,000 km or 100,000 miles; a more expensive one as long as 300,000 km. And a car costs money even when it’s just sitting in your garage. </p>
      <p>A font has no wear and tear. I am still using fonts I bought in the late 80s. More expensive fonts last longer because they get upgraded, to OT for example. Designers will specify a typeface because it communicates better than a generic one. Just because type got undervalued in the 80s when they were considered an easy way to sell filmsetters and the PostScript standard doesn’t mean it shouldn’t go back to being considered for its real value.</p>
      <p>The good thing: nobody will stop anybody from using Arial. It’s still free, and for good reason: nobody would pay for it.</p>
