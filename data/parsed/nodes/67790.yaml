      <p>Just a point of clarification on the licensing structure. FSI's goal was to create pricing levels that were most equitable for a broad range of uses. With the three tiers at 500k, 5mil, and 50mil pageviews/month they’re dividing Web FontFont use into broad categories so that a large international corporation isn’t paying the same rate as a personal blog. They chose pageviews because they feel metrics like number of domains and bandwidth aren’t accurate representations of an organization’s popularity on the web, and would often be unfair to the licensee. FSI doesn’t want anyone to feel overwhelmed about “tracking their traffic”, and will only spot-check Web FontFont use from time to time. They simply want to be sure the fonts are licensed properly and fairly. They do not intend to monitor every pageview on every domain. In fact, they don’t even require a domain name when you license. Choosing a webfont license is the same as it has always been for desktop fonts: pick the license that best fits you. Extend when you need to.</p>
      <p>&gt; I'm also not generally happy with banded pricing models which, like tax brackets, have built in inequities. </p>
      <p>I'm not sure how you get around that unless you have lots of levels (adding confusion) or monitor use systematically.</p>
