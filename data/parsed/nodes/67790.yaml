      <p>Just to throw another wrench into the pricing debate, I remember back in the 80s, when fonts were profitable. That was when they were only purchased by type shops and newspapers. It cost hundreds for each font, which would be a physical disk, filmstrip, or other tangible device. </p>
      <p>The way that the companies made money was by changing the format every time they upgraded the machine that used it. Thus the font that works on the Compugraphic II didn't work on the IV (was there a III?). And then when the 7500 came out, another new font library was required.</p>
      <p>Perhaps the solution would be to make digital fonts dependent on the OS, so that when you change from WinXP to Win7 you need a new font library.</p>
      <p>:)</p>
