      <p>I've been trying to find out who determines these average monthly page views. Take <a href="http://welovetypography.com" title="http://welovetypography.com">http://welovetypography.com</a> for example: Alexa claims we get over four times the pageviews we actually get.</p>
      <p>This also puts some limitations to how a high-traffic site using webfonts might be built. The current WLT loads a page every time a user clicks on something. The version I'm working on loads content dynamically. That means it only loads the site once, populating the views asynchronously and resulting in a single page view instead of the average 4.5 per user.</p>
