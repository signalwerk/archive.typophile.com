      <p>There seems to be some confusion.</p>
      <p>A designer has purchased a license to use a piece of font software in ways that do <em>not</em> include serving that font on the Internet. He has not bought ‘unrestricted rights’.</p>
      <p>Now he is being offered a different license <em>for a different piece of font software</em> that allows him to serve that font on the Internet.</p>
      <p>The first license for the first piece of font software is a per user or per device license. The second license for the second piece of font software is a pay per use license.</p>
