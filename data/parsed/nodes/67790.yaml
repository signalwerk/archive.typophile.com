      <p>After giving this some thought, I believe FontFont made the correct choice going with WOFF.</p>
      <p>If the only browsers lacking support are Chrome and Safari, they have very little to worry in the long run. The pageview-based pricing also makes the most sense for them and their type designers. Never mind the complexities of tracking the number of views or the seemingly high prices.</p>
      <p> Their distribution model, and this is the big deal in my opinion, takes large sites into consideration. Hosting your site's assets on a 3rd party server makes absolutely no sense unless they offer performance parallel to a major content delivery network. Where I'm from, Finland, I pay a penalty even when I choose to load jQuery from <em>Google</em> instead of a local server. Just downloading the 1x1 pixel image required for Google Analytics makes for 10% of the total load time of my company's website. My point being, no sensible administrator is going to use TypeKit on a large scale.</p>
      <p>Here's my prediction: FontFont will either set the future standard, or fail gloriously, should the industry fail to understand what they're trying to set in motion.</p>
