      <p><cite>If we changed OTF licensing to reflect how many readers you have, would that make any sense? Why does it suddenly make sense for the web?</cite></p>
      <p>Royalty-free digital font licensing was a mistake made in the 1980s that has been perpetuated far too long. Creators of great photos, illustrations, writing, video, music, etc. are all paid royalties. Great type should be the same way. People who don’t think that they should have to pay royalties for great web type do not deserve great web type and need to suck it up and stick to the same old Microsoft font stacks. </p>
      <p>And if you don’t think that type designers have the right to just compensation for their work, stop charging by the hour. Just charge every client $780 up front for whatever work they want you to do. Or try actually creating a big font family, and if you ever finish it, see how you feel about giving it up with no limits to every designer who feels he’s entitled to cheap type because actually spending fifteen minutes discussing the cost of fonts with a client is an inconvenience.</p>
