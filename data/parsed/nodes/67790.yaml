      <p>Okay, so this is a showstopper for you; it may not be for other FF customers. Remember, this is a new medium for font licensing, a new market, a new business model, and, so far, very little experience on anyone's part. It seems to me that FontShop are testing the waters, and I expect their eye is on what the response will be from larger, corporate, government and media customers will be. Which is not to say that they don't care about your opinion or your custom, but that they are sensibly trying out a model that they think will maximise their financial return. If this kind of licensing turns out to be a showstopper for too many customers, then that implies the market is different from what the font vendor thinks/hopes it is, and the licensing and pricing model will alter appropriately. That's how the market for creative works operates: you take a best guess at what you think you will be able to charge and what rights you will be able to grant or withhold, and you see how it pans out.</p>
      <p>The per-computer or per-user licensing model of fonts was forced on the digital type business because there was no realistic way to monitor use in print media. The web is a different medium, and it makes possible different licensing models. Over the next couple of years, I think we'll see a lot of different approaches taken by various font vendors, and even if one model today is a showstopper for you personally, I think it is too early to be asking vendors to change that model before it has been seriously tested in the market.</p>
