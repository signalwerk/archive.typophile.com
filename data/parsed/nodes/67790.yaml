      <p>I really like John’s comments on this discussion. I second them, especially his first one.</p>
      <p>What we (FSI) already have learned from web designers is that most of them won’t buy licenses for a complete family like FF Milo anyway, since they are way familiar to work with just the standard weights Regular, Italic, Bold, and Bold Italic. That’s why we offer <a href="http://www.fontshop.com/search/?q=%22Web+Basic+Set%22&amp;x=0&amp;y=0&amp;num=100" rel="nofollow">Basic Sets</a> consisting of these weights (if they are available) and single weights only to allow for the greatest possible flexibility. Of course you can also license the entire family, but we don’t expect many Web FontFont customers who need complete super families. <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_milo_web_basic_set/" rel="nofollow">FF Milo Web Basic Set</a> is $142 only, which should be okay for a website with less than 500k pv/m for an unlimited time (You can even use it on all of your websites). It’s not by chance that Web FontFonts are less expensive than their OpenType companions. Actually we discussed our prices also with a lot of web designers and already licensed some in the last months. Believe it or not, all of them considered our pricing scheme fair and comprehensible. Far from it! Some expected way more expensive fees.</p>
