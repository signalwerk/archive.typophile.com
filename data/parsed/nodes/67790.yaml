      <p>@sii<br>
      <em>The other reason for additional fees is to cover the engineering investment needed for Web-ready fonts - primarily hinting, but also additional engineering and testing work.</em></p>
      <p>sii, I didn't know you wrote fiction!<br>
      The plot needs some work. Too clichéd.<br>
      I have seen claims of fonts "optimized" for screen but I have yet to see a single side-by-side before-and-after comparison. Are you aware of any? I'm not. When I see it with my own eyes I'll believe it.<br>
      This sounds like a recycling of the usual BS you hear from all kinds of companies in all kinds of industries about how so much of the purchase price is going to be re-channeled into great products for the future and wait, you'll see. Just wait.</p>
      <p>I've heard and sensed nothing but reluctance from font designers about this. And this skepticism has a foundation.<br>
      Here is what one fairly high-profile font designer had to say on the issue:</p>
      <p><em>...TTF versions of fonts is complicated, labor intensive and expensive. It's that there are very few people who are knowledgeable about the antiquated craft of TrueType hinting. It's that the demand for hand-hinted TTF outlines is low despite the current "Web Fonts Now!" meme. It's that there is no reason to rush because most of the browser makers are too bored and/or antagonistic to make up their minds on a web font format.</em><br>
      <em>...this is one of the main reasons why I think WOFF is a good format. It's a clean start. Microsoft will switch it's type rendering in the next IE in Windows 7 to DirectWrite. Firefox is working on the same thing. DirectWrite renders CFF fonts much, much better than GDI. Foundries can pick which format (TTF or CFF) best suits each font by weighing lots of variables—file size, intended point size range, browser targets, financial feasibility of hand hinting and so on.</em></p>
      <p>Nobody is <em>obliged</em> to put in the work necessary to provide fonts suitable for use in browsers. I don't care if they do or they don't. The demand will be filled.<br>
      But publicly declining to do so is a bit of a public relations problem because nobody wants to appear as a naysayer or an obstructionist, or as out of step with the times.</p>
      <p>Engage with the web or not, just don't piss on my leg and tell me it's raining, is all I ask.<br>
      Or feed me pablum.</p>
