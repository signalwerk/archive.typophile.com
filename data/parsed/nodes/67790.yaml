      <p>Erik:</p>
      <p>I'm not sure if the book analogy really works for me. As you pointed out before, a font has no wear and tear. Its digital not physical. But I understand what you're getting at. </p>
      <p>What concerns me is how type is perceived to be 'used' on a website. It's true that the physical type file needs to be present in order to use @font-face, but if the site is hosted on my server (or even the .woff for that matter), is the client able to produce another site with that typeface? No more than then they are able to scan in the printed typeface on their flyer to use in a poster. </p>
      <p>If you transfered this thinking to the print world, then I would be buying a new license for a typeface every time I used it on a different flyer, business card or poster, and then I would have to pay additional if greater than x amount of people were going to see that product. </p>
      <p>Should clients purchase a license to use a typeface in Powerpoint, Word or other documents? Yes, as they can <em>produce</em> material with that typeface.</p>
      <p>From my perspective (and in my situation), clients and public would have no more access to my .woff files than they do any other typefaces on my machine. If a font file is duplicated, by all means, buy a new license. But If I'm just using the one file as I would for print, then I don't see how these two situations are different.</p>
