      <p>@jh</p>
      <p><em>So whatever the current rendering environment, whether with no antialiasing, greyscale antialiasing or sub-pixel antialiasing, these fonts are still going to perform better than the vast majority of other fonts.</em></p>
      <p>OK. So, Frode, you still there? Take a grab of Georgia and Verdana in that same environment and let's see how much better, if at all measurable, those fonts look.<br>
      Seeing is believing.</p>
      <p>(Frode, frankly, I don't really have the time right now to boot my XP SP2 machine with IE6 and start playing with settings, let alone displays. Help me out, willya?)</p>
      <p><em>Congruence</em> is the issue, not some system settings.<br>
      Do you think computer users with older systems running older browsers are unaware that what they are getting is a degraded version of what they could get with a newer system running the latest version of an A-list browser? I don't.</p>
      <p><em>If one is comparing display faces, okay, show them as large as you like, but what fundamentally matters is not whether big type looks pretty or ugly but whether small type is readable.</em></p>
      <p>Not if it never gets small. I really don't think anybody is going to use a font like Tagesschrift for paragraph text. Fonts have "sweet spots". Certain sizes, measures, just <em>work</em> better than others. (Telling <em>you</em> that is absurd, but a lot of people don't know.) </p>
      <p>Play the song "Begin The Beguine" in the key of C and then play it in the key of A Flat and there will be a very discernible difference you can <em>feel</em>, even though all the internal relationships - that is, the harmonic intervals, melody, et al - remain exactly the same. (Sorry to non-musicians for the analogy, but I assure you it's on the money.)</p>
      <p>Computer screens, as a medium, would appear to make a strange demand on typefaces as opposed to print - the demand to look equally "good" at any size. I think this is unattainable. In fact, I don't even think it's worth the try. What to do about it, I don't know.</p>
      <p>So anyway, to cap off, it seems to me you're saying that what type designers looking to cater to web designers should strive for is as close as they can come to the construction of the web safe fonts.<br>
      Sounds good to me.<br>
      After all the sturm and drang of last year over EOT/CWT and its main advantage being backwards compatibility with IE 6, 7, and 8, I would assume type designers would want to take advantage of that.</p>
      <p>Frode?</p>
      <p>Rich</p>
