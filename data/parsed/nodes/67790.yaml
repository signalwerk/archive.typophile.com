    html: |-
      <p>Rich: ‘Arial and Georgia and Verdana’ were all heavily hinted for <em>aliased</em> text rendering (i.e. no font smoothing at all, just square, monochrome pixels). In addition, Georgia and Verdana were expressly designed for screen reading in aliased and greyscale rendering (grid fitted, hinted, and spaced for screen). ClearType rendering ignores the whole pixel x-direction delta hints in such fonts, but retains all other aspects that make these fonts well-suited to text on screen. So whatever the current rendering environment, whether with no antialiasing, greyscale antialiasing or sub-pixel antialiasing, these fonts are still going to perform better than the vast majority of other fonts.</p>
      <p>Further, as I demonstrated earlier in response to your ‘Ten Great Free Fonts Cross-Browser’ TT conversions, comparisons of potential web <em>text</em> faces need to be made at text sizes, not looking at half-inch high glyphs. If one is comparing display faces, okay, show them as large as you like, but what fundamentally matters is not whether big type looks pretty or ugly but whether small type is readable.</p>
    html_clean: |-
