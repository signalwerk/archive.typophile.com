    html: <p>Ah, Chris, a man after my own heart. Everyone is so keen on bringing up Plato's banishment of the artists (which incidentally doesn't bother me in the least, especially since I <i>am</i> one and could probably use a good banishment or two) that they forget this cruicial point about the seeing of forms (which I am going to rush back out and reread). If only he had known of typesetting, the whole of western thought might have been drastically altered... <br> <br>Of course, when the printing press was invented, western thought <i> was</i> drastically altered...or at least affected. We might have even had Aristotle's second book of poetics preserved. Then again, there's only 250 First Folios in existence, so the odds would still have been rather slim... <br> <br>~h</p>
