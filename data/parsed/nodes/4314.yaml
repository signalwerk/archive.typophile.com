    html: "<p>h, <br>Vert insightful. As a young man, at the time in my life when I was most enthralled with the mathematics of form, my most treasured book was \"Portrait of the Artist as a Young Man.\" <br> <br>Music and painting follows the same pattern as the poetry you mentioned. Composers worked for centuries to evolve the formal rules of counterpoint and sonata style only for later composers to break from these rules to create music which has a structure based on \"unstructure\".  Painters perfected naturalistic works to later have art move to total abstraction.  It seems humankind repeatedly devlops a very sophisticated structure which then evolves into what appears to be its antithesis (unless you can \"see forms\"). <br> <br>As for \"... and my post would probably have been a lot shorter if I had just thought of these two sentences first. \" <br>Perhaps if you had just been reading Hemingway's sentences instead of Joyce's, it would have been easier to write a shorter post?  :-) <br> <br>Your post, particularly the remark: \"But if you speak to old poets (and lucky you are if the opportunity arises)\" made me think about \"The allegory of the cave\" in Plato's Republic.  Plato confines the ability to \"see forms\" to the Philosopher King. Using the entire book's length of Socratic dialogue to convince the reader, Plato ascribes the Philosopher King as the only type of person worthy of ruling a society. <br> <br>Perhaps as typgraphers, we seek to \"see forms\" in their purest state and become worthy of ruling society's image of the printed page?  <br> <br>Chris</p>"
    html_clean: "<p>h, <br>Vert insightful. As a young man, at the time in my life when I was most enthralled with the mathematics of form, my most treasured book was \"Portrait of the Artist as a Young Man.\" <br> <br>Music and painting follows the same pattern as the poetry you mentioned. Composers worked for centuries to evolve the formal rules of counterpoint and sonata style only for later composers to break from these rules to create music which has a structure based on \"unstructure\".  Painters perfected naturalistic works to later have art move to total abstraction.  It seems humankind repeatedly devlops a very sophisticated structure which then evolves into what appears to be its antithesis (unless you can \"see forms\"). <br> <br>As for \"... and my post would probably have been a lot shorter if I had just thought of these two sentences first. \" <br>Perhaps if you had just been reading Hemingway's sentences instead of Joyce's, it would have been easier to write a shorter post?  :-) <br> <br>Your post, particularly the remark: \"But if you speak to old poets (and lucky you are if the opportunity arises)\" made me think about \"The allegory of the cave\" in Plato's Republic.  Plato confines the ability to \"see forms\" to the Philosopher King. Using the entire book's length of Socratic dialogue to convince the reader, Plato ascribes the Philosopher King as the only type of person worthy of ruling a society. <br> <br>Perhaps as typgraphers, we seek to \"see forms\" in their purest state and become worthy of ruling society's image of the printed page?  <br> <br>Chris</p>"
