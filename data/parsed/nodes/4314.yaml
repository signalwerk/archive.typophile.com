    html: <p>Forty years ago, when I was younger (especially just after graduate school when I was full of philosophical notions), I frequently applied mathmatical structure to my work.  It was very rewarding to me as a person.  I was attempting to resolve the "unified fields" theory in design and typography.  My clients were, perhaps rightfully, merely concerned with their communication issues and were at best tolerant of my structuralist escapades. <br>What I discovered was that the human eye and the mind behind it a far better at finding inherant structural solutions than books full of mathmatical expressions.  I have now completely abandoned forced application of known-to-be-sound ratios.  I trust my eyes to know what is best.  Type design is a prime example.  There is so much optical correction in defining a font that you find yourself fudging anyway.  Imagine the great type designers of centuries past cutting punches by hand.  They had nothingcapable of measuring precisely enough so they just used their eyes and their talent.  After the fact, critics write books analizing their fonts and ascribing great mathematical logic to the forms they created.  Who knows what Claude Garamond used or how he really designed his type.  I would bet that it is more hand and eye than anything else. <br>This week I began work on a new typeface (it has been a few years since the last one). This time I decided to abandon all measurement, all rules, all comparison to existing faces, all "school knowlege" and just let my human faculties determine everything.  This is not an "Arty" face or even a Humanistic face.  It is a pretty straight forward workhorse sans serif that I intend to have broad usability</p>
