    html: <p>The cool mathematical stuff can work pretty well. But the combination of the eye and logic is the best. <br> <br>Chris is particularly right about the differences between pure math and optically correct design when it comes to type design. I found it very instructional to look at reproductions of Paul Renner's original drawings for Futura and compare them to what Bauer issues. Renner's original design was based on pure geometry, and would have been an absolute failure as a typeface. The Bauer design staff corrected and fixed Renner's design to make it actually work as a typeface. If his original drawings had been cut as type, Futura would have been a complete failure. <br> <br>Regards, <br> <br>T</p>
