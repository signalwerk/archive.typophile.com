    html: |-
      <p>WARBY PARKER: can't find a perfect match and even with a <a class="freelinking external" href="http://myfonts-wtf.s3.amazonaws.com/33/3315c6e0d665d87a66154cc7c66758bf.33234.png" rel="nofollow">better sample</a>; it's something close to <a class="freelinking external" href="http://www.typography.com/fonts/gotham/overview" rel="nofollow">Gotham</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/proxima-nova" rel="nofollow">Proxima Nova</a> (used on their website)/<a class="freelinking external" href="http://www.houseind.com/fonts/neutraface2" rel="nofollow">Neutraface No.2</a> (<a class="freelinking external" href="http://www.houseind.com/fonts/neutraface" rel="nofollow">Neutraface</a> used in shops) but slightly rounded; I'm aware of <a class="freelinking external" href="http://www.typography.com/fonts/gotham-rounded/overview" rel="nofollow">Gotham Rounded</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/proxima-nova-soft" rel="nofollow">Proxima Nova Soft</a> but they don't match either... More alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/latinotype/arquitecta" rel="nofollow">Arquitecta</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typedynamic/celias" rel="nofollow">Celias</a><br>
      eyewear: sorry but really too small for my eyes... I know they're using <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/utopia" rel="nofollow">Utopia</a> Display (and Proxima Nova) on their website. At this size, it could the job even if I'm quite convinced it's not the right one.</p>
