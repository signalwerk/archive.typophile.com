    html: |-
      <p>Thanks Andrej and Tristan! Nice to get positive feedback!</p>
      <p>Perhaps not to everybody's taste, but hey, you can't please them all!</p>
      <p>There's no convention on /J/, it's just me ;-) Although it sticks out, it sticks out if you know what I mean. Not sure I want to change that.<br>
      I'll take another look at /M/N/V/W/, lighten them up a bit (and put them in some text).<br>
      I'll also make a ligture for ff, I've already got some ideas. /%/ and other less used glyphs like it need some more attention anyway.</p>
      <p>Thanks again, I'll update soon.</p>
