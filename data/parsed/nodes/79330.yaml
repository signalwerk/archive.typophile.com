    date_raw: 22 Feb 2011 — 6:09am
    votes: null
    html: |-
      <p>It's very distinctive. I'm getting an Emigre vibe from some of it. I don't get the straight /J/. If you cut the serif off the right side, sure, but... It that a regional convention somewhere? I think the /j/ works alright, though it's still a bit strange.</p>
      <p>The color seems consistent, except that /M/N/W/ appear a little bit heavy in text (just assuming on the W since I couldn't find any in the test paragraphs.</p>
      <p>I find double /f/s to be distracting in text (on page 4, my eye is drawn straight to "souffle" and "effet"). Maybe you should make it a ligature with one of them on the baseline. Having single /f/s go to the descender line is fine.</p>
      <p>The last little thing I see is that /%/ looks light.</p>
      <p>It looks great though, overall. I could definitely see using it.</p>
    html_clean: |-
      <p>It's very distinctive. I'm getting an Emigre vibe from some of it. I don't get the straight /J/. If you cut the serif off the right side, sure, but... It that a regional convention somewhere? I think the /j/ works alright, though it's still a bit strange.</p>
