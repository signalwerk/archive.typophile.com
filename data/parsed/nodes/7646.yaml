    html: <p><i>&gt;surely the most straightforward option would be to talk linotype/bitstream into an opentype version with the alternates...</i> <br> <br>Geraint, unfortunately we won't be able to release an OpenType version of Metro anytime soon, unless someone were to commission the change directly. I have e-mailed Tiffany and Steve about the details that such a commission would require. <br> <br>I don't know what Bitstream's procedure is for handling these sorts of things, or how they choose which fonts to re-issure in OpenType updates. <br> <br>If anyone has further questions about Linotype's OpenType re-issues, Metro, or custom design work, I'd be happy to answer your questions personally offline. Feel free to contact me via my Typophile user profile.</p>
