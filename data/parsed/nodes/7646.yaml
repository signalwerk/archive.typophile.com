    html: <p>Hrant, creating new glyphs and adding them into the Metro font file is a modification. Making new glyphs and putting them in a separate font, which isn't called Metro but which you use along side of Metro is NOT a modification! <br> <br>Can InDesign pull alternates from a different font? I'm thinking no, right? Could you do some sort of search and replace? <br> <br>Tiffany, I'll ask about getting those alternate glyphs into Metro tomorrow, but it would probably take a while, even if they do opt to do it. Keep on me about it, and I'll keep on it!</p>
