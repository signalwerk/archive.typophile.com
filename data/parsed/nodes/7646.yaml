  html: <p>Is there a digital version of Metro available with the two-storey 'a'? <br> <br>I have a few printed samples of the face (One in  a 1962 HMSO Handbook called <i>The Design of Forms in Government Departments</i> and one in <i>20th Century Type Designers</i>) which both show a two-storey 'a'. The only digital version I can find is Linotype's, which has the single-storey 'a', and I can't find any sign of an alternative character. <br> <br> <br>A quick search turned up this thread <a href="http://www.typophile.com/cgibin/discus.pl?pg=next&amp;topic=83&amp;page=12656" target="_blank">http://www.typophile.com/cgibin/discus.pl?pg=next&amp;topic=83&amp;page=12656</a> but the consensus there appears to view the two-storey 'a' as the alternative, rather than the standard. <br> <br>Any ideas?</p>
  html_clean: <p>Is there a digital version of Metro available with the two-storey 'a'? <br> <br>I have a few printed samples of the face (One in  a 1962 HMSO Handbook called <i>The Design of Forms in Government Departments</i> and one in <i>20th Century Type Designers</i>) which both show a two-storey 'a'. The only digital version I can find is Linotype's, which has the single-storey 'a', and I can't find any sign of an alternative character. <br> <br> <br>A quick search turned up this thread <a href="http://www.typophile.com/cgibin/discus.pl?pg=next&amp;topic=83&amp;page=12656" target="_blank" class="link-lost">http://www.typophile.com/cgibin/discus.pl?pg=next&amp;topic=83&amp;page=12656</a> but the consensus there appears to view the two-storey 'a' as the alternative, rather than the standard. <br> <br>Any ideas?</p>
