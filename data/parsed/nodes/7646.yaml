    html: <p>&gt;&gt;Are you only going to add the a and g, or are you going to do the entire typeface proper justice? <br> <br>Whoah there! <br>I'm not going to do anything - I'm no type designer. I just thought that if the consensus was that ths kind of thing would be ethical, legal and practical, someone who <i>is</i> a type designer might be tempted by the prospect of an interesting and small set of glyphs. Either out of interest or as a commercial project with a potentially reasonable return. (There's one customer here, and it sounds like there might be some more if the interest in Dwiggins' work is anything to go by). This would be much less work than a full character set, and might provide a useful project for an independent designer. <br>(I wouldn't rule mself out of considering some kind of financial support or partnership for such a project, though). <br> <br>I would really like to see someone do justice to the face as a whole, but maybe that's too much to ask - adding the more interesting glyphs to the existing faces seems a more likely prospect. <br> <br>BTW, I would agree with Hrant - I don't think this would be seen as <i>modification</i></p>
