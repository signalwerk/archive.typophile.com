    html: <p><i>&gt;veering off-topic, but i am suprised that more big foundaries haven't generated feature-rich OT versions of their best-selling fonts.</i> <br> <br>Trust me, Geraint, this is something that we ARE working on. These things take a lot of time though; at the same time that we want to ree-release old favorites, we also want to keep bringing new fonts to the market (plus all old AND new fonts need to get up to speed on supporting broader character sets, meaning exponentially more glyphs and potential bugs). I mean, the great old type designers aren't going to live forever�we all need *new* faces (or at least we all seem to *want* them)! <br> <br>Unfortunately "our" favorite type designs might be your favorite ones, or even mine :-D. A foundry's favorites are usually the one that sell the most. Sadly, Linotype's updates to Helvetica, Univers, and Frutiger were all made before any applications could support OpenType features, or in the Helvetica's case, even before OpenType. We did just remake Optima and Avenir though. Zapf's newest revisions, when they come to market, will make more use of OpenType, too, I promise! <br> <br>Now, Gill is another matter. Perpetua�my favorite typeface�as well of all other digital Gills (well, almost all of them�) are managed by Monotype Imaging. So, you'll have to ask them about those. I wouldn't be surprised to see even more of Gill Sans in the near future though� Monotype must of gotten a kick out of its being used for the Olympic Games in Athens.</p>
