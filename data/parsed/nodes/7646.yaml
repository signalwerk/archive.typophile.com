    html: <p>Steve, if you view my last post, you'll see that it isn't a modification if you do it right ;-). Anytime you open up an existing font and do anything to it, you ARE modifying it. But making a new font, comprised entirely of new glyphs which could be used together with an old font isn't modifying anything, because you aren't touching the original font data. Thanks for bringing this up though! Metro is a great face.</p>
