    html: <p>So what would be the legal, moral and technical situation if some imaginative independent designer were to make a set of five or six glyphs to address an issue like this. So one could purchase Linotype's Metro (or G 415) and then spend �10 or so on the extras. <br> <br>Obviously if that designer were to work in partnership with the original foundry, that would help the consistency of the face, and also aid the marketing. But if the foundry refused to co-operate, could they stop someone from addressing this? <br> <br>Is there any precedent? <br> <br>I assume that Indy CS and the like would be able to handle the situation fairly easily.</p>
