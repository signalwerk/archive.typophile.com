    html: "<p>Unless you re-use actual outline data, there can be no legal obstacle to making new glyphs. Ethically, many people will tell you the \"Design\" belongs to the original creator. Some even extend this to cover non-Latin scripts! To me this holds no water, because abstract things belong to society more than individuals (nothing is created in a vacuum), and the more people end up working on something needed, the more <i>users</i> benefit. <br> <br>What I would do however is contact the makers of the original, and tell them of your plans; give them an opportunity to help, or convince you not to do it. But you decide in the end. Also: give proper credit for the original of course - although I guess in this case you'd <i>have</i> to do that to make the result useful! <br> <br>hhp</p>"
