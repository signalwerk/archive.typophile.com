    <p>This is a logo for a Bistro.<br>
    Food is served there in a sophisticated/elegant way.<br>
    It has down to earth prices.<br>
    Has a clean feeling along with a home-like feeling. (famous for their fresh baked bread).<br>
    The place has warm colors.</p>
    <p>Am I on the right direction?</p>
    <p>Thanks,<br>
    Elsi.</p>
