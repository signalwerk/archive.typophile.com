      <p>A very preliminary impression, comparing Lino/Adobe Frutiger to Segoe UI. Steps are 1, open Segoe UI in Fontlab, 2, convert to PS, 3, open in Fog 5, 4, place Lino Frutiger in background, 5, scale 98.04% to match x-height. Frutiger is slightly wider and slightly heavier, making a direct comparison difficult without adjusting weight and horizontal scale. Even so, several lowercase glyphs are, in what seems to be the common consensus, too close, but there are some differences and it is clear that there is not the intention, here, to make an absolutely literal copy. However, this is Segoe UI, not Segoe, and has been further altered for UI purposes. There are many, many similarities, and there are differences. It seems hardly conceivable that the font was drawn without reference to Frutiger, but how and to what extent, I can't conclude at this early date. I would appreciate hearing the impressions of someone more skilled in font forensics. The last time I checked a font for signs of literal pilfery was several years ago when I checked Le Monde against several cuts of Times New Roman and discovered and published indisputable evidence of point pilfering from a specific cut of Times New Roman that Adobe shipped with Illustrator 6. I see no evidence of point pilfering with Segoe, but then, it would be hard to do that given that one is in PS format and the other in TT, and I am comparing PS to a TT conversion whose quality I have not tested. However, the difference in design between Times and Le Monde is far greater than the difference between Segoe UI and Lino/Adobe Frutiger. The purpose of the Le Monde analysis was to discover if Porchez was telling the truth when he first asserted that he had point pirated, or whether he was telling the truth when he later denied it. I concluded and illustrated that the first statement was the true one. In either case, it was indisputable that the designs were substantially different. Here, the purpose is not to discover if point piracy exists, since it is beyond my skill to do that cross-format, but to discover if design piracy exists. Between these two fonts I will only for the time being adopt the phrase used I think by both John and Adam, that the fonts are too close. I can't find my other Segoe fonts, so the rest will have to wait until tomorrow. I also don't know what the differences are in the base weights of Lino/Adobe Frutiger and Linotype Frutiger Next, so those comparisons have to be made too.</p>
      <p>By the way, I'd like further to point out that when I sent my Didot to David years ago, that was in the days when we still sent paper samples only. David's eyes detected its digital derivation from Fairfield without the benefit of computer software. That guy doesn't need to look at points to figure out what's going on! </p>
      <p>Speaking only for myself: if I had to take the idea I have in my head of Frutiger, and draw something to it as close as I could, without being permitted to consult large printouts of Frutiger or anything I could trace over, I don't think I could come up with something that was as close to Frutiger as Segoe UI is. But that's all I can say. Others have completely different skill sets and I am sure there are many who could do a better job of this hypothetical task than me.</p>
      <p>Again, there are some German display types of the 1920s that have some  pre-Frutiger features. Were I to adapt one of these bold and compressed fonts to a normal weight, as I have sometimes thought of doing, I doubt that the result would be considered to be a Frutiger clone. But that's just me.</p>
