      <p><em>But, if they were all told that the A had to be on 37/54ths of an em, and that 100 unit stems would be required to produce a proper “book” face, then they would all be extremely close, and some, if enough we solicited, would be exactly the same.</em></p>
      <p>Good point David. If a type designer is asked to better the performance of a particular font (with quite specific parameters of usage), wherever he/she starts, the result is going to be, to all intents and purposes, the same typeface -- if not the same font. It's a testimony to the virtue of the original typeface. I've done that, started with a different font, massaged it to the client's needs, and even though no point piracy was involved, it ended up in a state where a forensic typographer could probably have proved that some piracy was involved. But the typeface was the "open source" Century (much of it indistinguishable from Bodoni), and in a display usage that Benton or Bodoni could not have envisaged. I wouldn't have attempted the same kind of thing with Frutiger.</p>
      <p>So a lot of responsibility falls on the creative director of the vehicle for which the typeface is intended, and the brief given to the type designer. If a brand's typography is predicated on a certain type of layout that demands a Frutiger-ish typeface, that's asking for trouble. To avoid trouble, an older typeface should be used, or a genre with more flexibility, or best of all, a fresh kind of layout that prompts an original type design.</p>
      <p>Why does an OS typography have to be generically bland? Apple has consistently pointed the way in terms of GUI style, and MS has followed. But the types (with the exception of Chicago) have dragged up the rear. Apple's present OS face is a bit Optima-ish and slightly old-fashioned. The door is wide open for a new "square" or techno OS face, surely the widespread use of pixel-fonts on web sites has paved the way. Companies whose software products are up-to-date end up using vintage typefaces. The pride-of-place given to type revivals and the millstone of traditionalism drag down typography, and have a lot to answer for.</p>
