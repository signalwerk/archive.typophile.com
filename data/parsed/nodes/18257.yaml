      <p><em>While I think what matters is the intent.</em></p>
      <p>The only intent that matters when a typeface is published, i.e. made licenseable, is the <em>intent to publish.</em> The thought process that went into producing the typeface is irrelevant, the intent of the designer(s) in producing the typeface is irrelevant, because the decision to publish is in no way dependent on those creative intentions. The creative intentions are part of the process of creating the typeface, not the process of publishing it.</p>
      <p>Even more so, such intentions are irrelevant to the decision to license a typeface. You do not license an intention, you license a <em>thing</em>, a product, a result. And the decision to license a typeface must be based on the nature of that thing, not on the real or stated intent of the person who made it. You have to look at the result, the thing. You have to forget all the claims about how it was made, whether they are true or not, and ignore the all explications of the ways in which it is different from other typefaces, and really <em>look</em> at the bloody thing with an honest eye -- and sometimes with a microscope -- and ask 'Is this thing original enough?' And sometimes the answer is no -- sometimes despite the best intentions to create something original and non-derivative -- and then you just have to set that thing aside and go look elsewhere. You have to, because the best intentions don't change the fact that the thing is a clone.</p>
      <p>If Dolly the sheep were created by accident, every cell in her body would still tell you that she's a clone. The intent is irrelevant to what the thing <em>is.</em></p>
