      <p>OK, here's a progress report. Let me tell you one thing, Fontlab 5 works like a dream for this kind of examination. The base weight of Segoe (not Segoe UI) is, as I pointed out for Segoe UI, a little narrower and a little lighter than Lino/Adobe Frutiger. The same is true for Segoe. How to arrive at a true picture of what might and might not have been manipulated? </p>
      <p>I took unconverted PS files of Segoe, Segoe Bold, Segoe condensed, and Segoe Bold condensed, and in less time than it takes to describe, I had a multiple master. I put Frutiger in the Mask layer and then scaled it 98.04% as before, hz and vt. With Fontlab, it's a cinch to slide until you get one of several possible good matches to Frutiger, which here is about 146 for weight and 1157 for width. </p>
      <p>In the screen shot, the red outline represents Frutiger, the dark green outline represents Segoe, and the grey fill represents the interpolation/extrapolation between the four Segoe weights which constitute the MM. </p>
      <p>What relevance does this have? What conclusions can we come to? I have no idea. Here's the screen shot. More to come if anyone's interested.</p>
