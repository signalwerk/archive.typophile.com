      <p>1. New development concerning my message of 15th March 2006</p>
      <p>In my message of 15th March (scroll up to this message in this thread) I mentioned that Microsoft as a monopolist has repeatedly ignored the EU anti-trust laws and that at that time in March the European Anti-Trust Commission instituted a new lawcourt action against the illegal behaviour of Microsoft.</p>
      <p>Today, 12th July 2006, Microsoft was sentenced to a compulsory monetary fine of 280,000,000 Euros (roughly 350,000,000 Dollars) due to the fact that Microsoft refused to comply with the European laws. The supreme anti-trust commissioner Mrs. Neelie Kroes clearly (and with a grain of sarcasm) stated in the decision that even the huge company Microsoft is not permitted to ignore the laws and is not allowed to rise above the laws.</p>
      <p>2. New development concerning my message of 13th March 2006</p>
      <p>In my message of 13th March (scroll up to this message in this thread) I stated that the decision of 6th February 2006 of the EU invalidity division against Microsoft concerning the illegal font Segoe was eligible for court appeal by Microsoft within the next two months.</p>
      <p>  For legal details on appeals see <a href="http://www.sanskritweb.net/forgers/segoe.pdf" title="http://www.sanskritweb.net/forgers/segoe.pdf">http://www.sanskritweb.net/forgers/segoe.pdf</a> etc.<br>
        Especially read law file <a href="http://www.sanskritweb.net/forgers/segoe4.pdf" title="http://www.sanskritweb.net/forgers/segoe4.pdf">http://www.sanskritweb.net/forgers/segoe4.pdf</a>, page 23</p>
      <p>Microsoft which seems to have recognized and accepted that Segoe is an illegal font, did NOT make such a court appeal against the EU decision.</p>
      <p>This non-appeal has the legal consequence that the font Segoe is illegal and remains illegal, at least in the European Union. And this means that selling the illegal font Segoe as component of the forthcoming new version of Windows ("Windows Vista") will be illegal, at least in Europe.</p>
