      <p>&gt; Before commissioning Segoe, Microsoft did, Le Times has heard from Linotype, try to license Frutiger, but baulked at Linotype’s price: one penny per OS sold. Kudos to Microsoft for realizing that pennies add up to an unacceptable and unfair shareholder burden.<br>
      &gt; I got this information in 2004 from a source at Linotype. I have the interview on tape. I will not disclose my source.</p>
      <p>Mr. Steinert's statement:</p>
      <p>&gt; The 1-cent story is entirely fabricated and totally unfounded. It is regrettable that such lies are enthusiatically promulgated on the web without any examination. (Die 1 cent-Geschichte ist frei erfunden und entbehrt jeglicher Grundlage. Es ist bedauernswert, daß solche Lügen ohne weiteres Hinterfragen mit Begeisterung im Web weiter werbreitet werden.)</p>
      <p>Either Mr. Troop's statement is a lie or Mr. Steinert's statement is a lie.<br>
      Therefore, either Mr. Bill Troop is a lier or Mr. Bruno Steinert is a lier.</p>
      <p>FontShop quoted Mr. Troop, and Mr. Steinert at the FontShop blog therefore implicitly declared that Mr. Troop is a lier. Conversely, Mr. Troop implicitly declared that Mr. Steinert is a lier, because the alleged "penny-deal" would have been negotiated by Mr. Steinert himself, because, as I said in my previous posting to this thread, Linotype GmbH is a very very tiny font outfit with only circa twenty full-time employees plus a couple of occasional free-lancers, for instance the students Mr. Adam Twardoch and Mr. Daniel Reynolds and for instance the apprentice and presumed lier Mr. Erik Faulhaber, who claims to be the designer of "Frutiger Next", which is considered a lie by Mr. Steinert. The majority of these circa twenty full-time employees are simple clerks who do not make an "interview on tape". Therefore, in view of this tiny outfit, there remains only Mr. Bruno Steinert himself who could have given an "interview on tape", provided that Mr. Troop is not a lier who is telling us lies.</p>
      <p>By using the expression "entirely fabricated and totally unfounded", Mr. Steinert declares that he did not negotiate at all with Microsoft concerning Segoe, thus by his unequivocal statement Mr. Steinert declares that he made neither a 1-cent licence offer nor a 1-penny licence offer nor a 2-cent licence offer nor a 3-cent licence offer nor any other licence offer. Provided that Mr. Steinert is not a lier, this would be in accord with German laws, because by German laws, the Linotype GmbH would not be allowed to negotiate a "licence" in view of the illegal forgery Segoe. If someone forges banknotes, you are not allowed to "negotiate" with the forger a "licence" for the "right" to distribute the forged banknotes. Likewise, if someone forges a painting, the author of the original painting is not allowed to "negotiate" with the forger a "licence" for the "right" to distribute the forgery of his original painting. Likewise, if someone forges a font, the author of the original font is not allowed to "negotiate" with the forger a "licence" for the "right" to distribute the forgery of the original font. But the author of the original font (in this case Mr. Adrian Frutiger) may try to claim damages and may try to claim that the forged font (in this case the forgery "Segoe") is not distributed.</p>
