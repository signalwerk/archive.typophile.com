      <p>Uli, Hrant is right, I have some literary German, but my practical and legal German is almost hopeless. I am still trying to figure out exactly what the possible implications of Uli's coinage Heideldruck might be. Druck can mean many things, including printing, being under pressure, browbeating, etc. Uli, give us a hand.</p>
      <p>I see here two great summations of the issues here. Uli's </p>
      <p>'The decision of the invalidity division only has the effect that Heideldruck, which was not allowed to register the fonts Frutiger and Frutiger Next as design, could achieve the annulment of the illegal registration made by Microsoft which had deliberately deceived the registration office when it registered its forgery “Segoe” as “new” and “novel” design.'</p>
      <p>and David's</p>
      <p>'Too bad, it might require chemical sampling of the brain to know for sure if a font is a forgery.'</p>
      <p>'What oft was thought but n'er so well expres't'. What can we really know about what happened here without being inside the heads of the principal actors? Do they themselves any longer know what they did, or why? We only have their actions, and what we can deduce from their actions, which is something but not everything. </p>
      <p>Finally, a bit of literary criticism. Hofmannstahl has Klytemnästra memorably speak, 'Was die Warheit ist, das bringt kein Mensch heraus' which I would loosely translate as, 'What truth is, mere mankind cannot know, only the Gods can.' I'm adding the glosses 'mere' and the phrase about the Gods because I think the context demands it. But the question arises, is K speaking the truth when she says we cannot know it?</p>
      <p>We have all the elements of a 21st style Greek tragedy here. The clock's ticking for Adrian, whose font is the improbable subject of our drama, and we are still in considerable suspense as to what the other actors have done, will do, and why. </p>
      <p>Funny thing, though, as it plays out: the Dreyfusard is not normally a silent crittur.</p>
