      <p>It should be noted, for the sake of clarity, that Segoe UI was commissioned from Monotype by the Microsoft Typography group, while the ClearType Collection fonts were commissioned, from various designers, by the Advanced Reading Technologies group (who were also responsible for the eBook software and the earlier licensing of Frutiger). These two groups at Microsoft operate independently, with entirely separate budgets and mandates. If there are feathers to be tarred, watch where you are flinging the brush about.</p>
      <p>Of course, what corporate lawyers decide is the best strategy to pursue in a patent challenge doesn't necessarily reflect the personal views of people in either the MS Typography or ART groups.</p>
      <p>The only thing to add is that I that I think Jeremy Tankard's Corbel, from the CT collection, would make a very nice UI and corporate identity font :)</p>
