      <p>OK. After - how many is it now? literally half a million glyphs? after so many, you're entitled to say, Enough! You earned the right. But would you also decline the opportunity to design a corporate ID for MS? Wouldn't that be an interesting enough challenge? On the other hand, it would be a very muddy issue if the brief were to devise both a corporate ID and a UI. That seems to me insane, something only either a clueless executive could dream up - - or is it in reality a brilliant requirement? </p>
      <p>'This whole issue seems to be a good example of the old saying that “all corruption empowers.”'</p>
      <p>I blush to say I never heard that one, but I really like it. </p>
      <p>By the way, to set the record straight. Segoe is named after Bill Davis's great-great-grandmother, Amalie von und zu Segoe, who was the cousin of Gräfin Sophie zu [but not von] Segoe, familiar to type historians for her role in preserving the Auerbach matrices in the cellar of her manse during the Franco-Prussian war. This information is well known to <em>anyone</em> who has perused the pages of the Almanach de Thypa of 1894. There is a copy at Yale.</p>
      <p>Back to the topic, I really like the way Nick is trying to express, through the static, the fundamental point that type is intellectual property to be respected. When put this way, it seems so utterly shocking that it's the American habit not to respect it. I like too Uli's expression of the old world attitude: 'nobody in Europe can be expected to accept forged fonts as part of an operating system, in the same way as nobody can be expected to accept forged bank notes as part of the monthly salary.'</p>
      <p>When you think about it, there is nothing more painful than for a type designer to be told, after years of work on something - - 'this is not yours, it is mine'. It is an issue that must be addressed. And I think we are, slowly, seeing it be addressed. The attention Matthew Carter got in the New Yorker is one example. The attention that Segoe is getting is another. Something is shifting in the wind.</p>
