      <p><em>The term “forgery” as it is use by me is a legal term in (German) law books defined as follows: “forgery” = “a copy made in order to deceive”</em></p>
      <p>But you are translating this German legal definition into English and using the term in an English-language discussion in an English-language forum, and I think in this context the normal English usage of the term has to be acknowledged. Art or literary forgery provides the typical model: a copy (or work in a recognisable style) passed off as an original of the copied artist. Copying something and passing it off as your own invention is not usually called forgery: it is called plagiarism.</p>
