      <p>I wonder who made the earliest Frutiger forgeries.</p>
      <p>My guess for the photo-composition era is the forgery "Frontiera" made by the bankrupt Compugraphic corporation, but I do not know in which year "CG Frontiera" was published.</p>
      <p>My guess for the digital era is the forgery "Quebec" by Walter Florenz Brendel, who is said to have been one of the first users of the Ikarus system in the 1970s. Brendel, who died in 1992, was an economical font forger who used to forge only three or four letters per font. See <a href="http://www.sanskritweb.net/temporary/quebec.pdf" title="http://www.sanskritweb.net/temporary/quebec.pdf">http://www.sanskritweb.net/temporary/quebec.pdf</a></p>
