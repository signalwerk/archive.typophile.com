      <p>&gt; scale to match, and examined at 800%, 3200%, whatever?<br>
      &gt; I really wish someone else would do that (Mr. Troop)</p>
      <p>I wonder why you do not that yourself, if you think it is that important.</p>
      <p>In the UPS case, a reduction to 95.3 % (= a reduction by 4.7 %) of the glyph coordinates of the forgery "UPS Sans" yielded the glyphs of the font "FF Dax". But this reduction was only the first "crude task" performed by the font forgers who had been commissioned by United Parcel Service to forge the FF Dax font. Thereafter, as a second "refined task", these professional font forgers were ordered by UPS to make a few conspicuous modifications to a small selection of glyphs, as has been demonstrated by me on pages 9 and 15 in my documentation <a href="http://www.sanskritweb.net/forgers/barmen.pdf" title="http://www.sanskritweb.net/forgers/barmen.pdf">http://www.sanskritweb.net/forgers/barmen.pdf</a></p>
      <p>&gt; and sometimes with a microscope (Mr. Hudson)</p>
      <p>No court judge in Europe would examine a font with a microscope. The decision of the invalidity division of the sixth of February 2006 has clearly shown that fonts are compared by the invalidity division (and by European law courts, for that matter) with the naked eye, not with microscopes and similar tools. Such tools (microscopes, X-ray, chemicals etc.) are applied in art forgery cases, but not in font forgery cases, where ordinary printed alphabets typeset in ordinary point sizes and viewed with the ordinary human eye is all that is required in order to arrive at the conclusion that two different fonts "should be considered identical" (see invalidity decision). </p>
      <p>PS: Here is an example of cryptomnesia. I have just wondered why I write "naked eye". Did I "create" this expression? Apparently not. I now think that I once seem to have read this saying: "Neither the sun nor death can be looked at with the naked eye". But did this saying really have this wording? Was it "...with the steady eye"?</p>
