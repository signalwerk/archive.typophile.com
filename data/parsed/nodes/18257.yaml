      <p><em>Something like the Morisawa?</em></p>
      <p>Er, no, it would have to be a group of people who would recognise a Lexicon clone. :)</p>
      <p>Morisawa is a competition, and the judging of a large number of entries takes place in a short period of time, in conditions of at least semi-secrecy regarding the identity of the submitted designs and their creators. What I'm talking about is a process of examination of individual designs that a company is considering licensing, with reference to outside experts as necessary, capable of judging whether a design is sufficiently original or otherwise kosher (e.g. appropriately licensed, public domain, etc.) It's a process that could take several days, involving research, detailed comparisons, and submission of a written report and recommendations.</p>
      <p>I'm very much of the opinion that one of the ways to stop people doing the wrong thing is to make it easier for them to do the right thing. If the problem is a software company licensing typeface designs that are too similar to existing designs from other parties -- <em>regardless of  the intent or deliberativeness</em> -- then I want to ask what process would prevent that from happening.</p>
