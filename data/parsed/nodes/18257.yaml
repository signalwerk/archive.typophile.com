      <p>Adam: <em>Altogether, such decisions are made on a per-project basis, and surely depend on the actual creative input of “the other” designer.</em></p>
      <p>And on the marketability of the co-designer's name. Crediting a design to Adrian Frutiger and Akira Kobayashi, is a double-whammy for Linotype, linking to typeface to two very talented designers whose work is widely, and rightly, regarded.</p>
      <p><em>He has seemingly agreed to hide his name behind the “Linotype Design Studio” label but now is trying to change reality retroactively.</em></p>
      <p>I have to admit that I sometimes find the attribution to 'Linotype Design Studio' troublesome, not least because it is occasionally applied retroactively. What is the 'Linotype Design Studio'? It suggests a room with a group of people drawing glyphs, filling in character sets, something like the drawing departments of old. But the reality is that 'Linotype Design Studio' might refer to Linotype employees, or to freelance designers, or to other companies hired by Linotype. I understand why Linotype choose to use this attribution and, frankly, it is their privilege since they own the results and the contracts allow them to do this. As you note, Adam, the correct time to establish how a project will be credited is during contract negotiations. But as someone with an interest in history, I'm disappointed to see some interesting stories disappear behind this generic attribution. Sometimes these stories are interesting cases of international collaboration. Sometimes they involve designers of the calibre of Tim Holloway, who is in no way a lesser designer than Adrian Frutiger or Akira Kobayashi, but whose name lacks their marketing cachet.</p>
