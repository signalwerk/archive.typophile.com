    html: <p>Hmm. You think I have overstated MS's position? Perhaps I have. I will have to reread the material. In any case, in common law, you can't appeal factual findings, roughly speaking, but only the application of law to those findings -- I think. How this works for the EU I have no idea. There is also only so much we can learn from the rather sparse material on display here. We have not seen any of the briefs, we have not heard any of the arguments. Whatever the case, I have the feeling that MS's statement, or acquiescence in Lino's position, whichever it is, has made the case irretrievable for MS. I can't wait for the next installment! Whatever happens, I get the feeling that this is an important event in the development of practical type law and type ethics. Why it should so have touched a nerve, why it should continue to interest, I have no idea. But it does. It is different from a lot of similar cases in the past, perhaps because of the stature of the typeface, the designer, and the corporations involved; perhaps it is just the world historical mood. Perhaps it is just that there has simply been too much of this. This seems to be the one moment when everyone rose up with one voice to say 'Enough!'</p>
