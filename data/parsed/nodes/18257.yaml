      <p>What I would like to say is that your remarks connect with something that has been going on in my head over the last few days, and that is that I constantly find myself looking for an easy way to solve some type problem and get something out there that is good and doesn't take much effort. And I am constantly finding that every time I try to do this, it doesn't work. But I can't stop myself from looking for an easy way out. You would think, after all this time, I would have learnt my lesson. And I am just thinking in the realm of pretty ordinary text type. I can imagine that a charming, daffy, and quite original display typeface like your Fontesque might have sprung out pretty quickly and effortlessly. On the other hand, it would not surprise me if a lot of long and grueling work went into it. Which way was it for you, Nick? </p>
      <p>Finally, and getting further off topic, John, I would not be surprised if Corbel would make a great UI and corporate font, but you really ought to make an effort to show it better than you have done in the past! Speaking of which, we are very busy here defending the Frutiger typeface, as it is right for us to do. But I quite agree that almost anything else would have been a better choice for Microsoft. Especially given Apple's extensive use of Myriad. Isn't it amazing how  exceptionally staid and rigid technology companies are in their corporate ID schemata? I sometimes find myself thinking that I would be happy never to see Frutiger again. It needs a rest. Yet on the other hand, it <em>has</em> had a rest. Here we are seeing its second period of triumph. And maybe the reason both Apple and Microsoft are using Frutiger so extensively is that the matter is, somehow, not really in their control? That Frutiger is, somehow, the typographic language such a company <em>has</em> to speak at this point in time? The more I learn about Frutiger, the more powerful it seems. </p>
      <p>Be that as it may, the ethical issue does not change. It doesn't matter if you like Frutiger or dislike Frutiger. It doesn't matter if you want to use it, or don't want to use it, or are compelled by inscrutable forces to use just this Weltbild/design against your will: if you do actually use Frutiger, you must pay Linotype, its owner, for it.</p>
