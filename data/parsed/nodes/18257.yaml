      <p>Thank you, Uli, for clarifying these matters quite satisfactorily. I am interested in the detail you give as to the possible action against Microsoft for fraud that would appear to lie open to Linotype were Segoe to be sold or licensed in the EU. I had assumed that Linotype would have such an action open to them, since it is incontestable that Microsoft knew in enormous detail about the existence of Frutiger before they decided to forge it, to use the terminology you suggest: (a) MS had already licensed Frutiger for eBooks, not something Microsoft likes to do but in this case it evidently realised the induplicable benefits that would accrue from using Frutiger in eBooks and (b) Microsoft later attempted to license Frutiger Next for Vista, but refused to accept Linotype's terms of a penny (US) per OS unit sold/licensed.</p>
      <p>But wouldn't that action technically lie open now, as a consequence of Segoe's exceptionally wide distribution to graphic designers and beta testers? We have to consider that Segoe is not only said by Microsoft to be an essential part of the UI in Vista. It has also been stated to be Microsoft's new corporate identity typeface and has been distributed as such.</p>
      <p>What I cannot quite understand is why Microsoft caused so many statements to be published online and elsewhere concerning the 'originality' of Segoe. This apparently was done in the full knowledge that these statements were not true. </p>
      <p>This raises the question why such publication was made and when. Some of these publications appeared to be spontaneous 'comments' on blogs such as this one. It would now appear that such apparently spontaneous comments were in reality part of a carefully orchestrated propoganda campaign. I hate to use that politically charged word propoganda, but what else is there? From a practical standpoint, one would also be interested to learn how the parties to the forgery agreed to indemnify themselves. </p>
      <p>Sadly, now that the issue has come to litigation, I expect it will be some time before we see any Microsoft employee publishing or posting any (dis)information about Segoe, for obvious legal reasons. Maybe I'm misreading the situation? In that case  . . . </p>
      <p>              Hey guys! The floor is open to you! . . . . .</p>
