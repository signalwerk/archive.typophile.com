      <p>John, </p>
      <p>I know that the entire Segoe family includes branding fonts. In the graphics shown at <a href="http://www.microsoft.com/" title="http://www.microsoft.com/">http://www.microsoft.com/</a> or in the Microsoft printed ads, the typeface surely does look a bit like Frutiger. But I was specifically wondering about Segoe UI. </p>
      <p>Uli, </p>
      <p>no doubt, Erik Faulhaber has worked on the Frutiger Next project but the extent of that work is disputable. This is a typical case of "getting credit". Type design only recently became an individual effort -- previously, a large team of people worked on a particular type, and yet typically, only one person got the credit as the "designer". </p>
      <p>Even today, when FF Meta Pro is published, the credited designer is Erik Spiekermann and not "Spiekermann, van Rossum, de Groot, Schäfer, Lipton, Schwartz, Safayev, Chayeva, Haratzopoulos et al." If it were so, it would be quite ridiculous anyway.  </p>
      <p>If you want personal credit, you need to negotiate it upfront in the contract. </p>
      <p>Christian Schwartz and Erik Spiekermann collaborated on FF Unit and on FF Meta Headline. Schwartz does get personal credit for FF Meta Headline but not for FF Unit -- this is obviously result of different negotiations in different projects. </p>
      <p>The credited designer for Frutiger Next is "Adrian Frutiger / Linotype Design Studio". This means that Linotype chose not to personally credit the other designers who worked on the project, including Erik Faulhaber. This is similar for Linotype Univers. This is different for other projects, e.g. Avenir Next is credited as "Adrian Frutiger / Akira Kobayashi", just like Palatino Nova and Optima Nova are credited "Hermann Zapf / Akira Kobayashi". </p>
      <p>Altogether, such decisions are made on a per-project basis, and surely depend on the actual creative input of "the other" designer. Sometimes, designers arrange collaborations by themselves -- they might hire a collague to draw the small caps or florins in their own typeface if there is a tight deadline. </p>
      <p>Whenever you're a "junior designer" and embark on such a project, make sure to clarify issues such as personal credit *upfront*. Erik Faulhaber seemingly has not. He has seemingly agreed to hide his name behind the "Linotype Design Studio" label but now is trying to change reality retroactively. This is not how you work with other people. </p>
      <p>A.</p>
