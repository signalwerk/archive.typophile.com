      <p>Uli's discussion of Cryptomnesia and double creation helps us deepen our thought and hone in more sharply on the issues. Others will correct me if I am wrong here, but I don't think it is conceivable that either crytomnesia or double creation are viable defenses either in the cases of Myriad or Segoe, since it is obvious that the designers were consciously and intimately familiar with Frutiger. Not only that, but their colleagues, managers and associates were consciously and intimately familiar with Frutiger. </p>
      <p>There is no one in the entire type industry who is not consciously and intimately familiar with the design of Frutiger.</p>
      <p>On the contrary. What we are seeing here is that intellectual property ethics and law are moving faster than we are. Many of us may have some painful adjustments to make in the years to come. I think much of what John had to say, for example, is beautifully worked out in and of itself, but doesn't take into account the context of what is legally and ethically happening in the rest of the world.</p>
      <p>Again, this only comes into focus so acutely in the case of Frutiger/Segoe because it is so intimate a part both of Microsoft's corporate image and so intimate and critical a part of the highly evolved, highly complex product on which it is staking its success for the next decade. Microsoft's dilemma is that it cannot succeed if its product cannot legally be sold within the European Union. </p>
      <p>And again: were this a matter of a knockoff used for corporate ID (for a company somewhat less prominent than MS), one that was never registered as an original design or trademarked, no issue would arise because nobody would know about it. </p>
      <p>Microsoft is in a mess. Its legal strategy is in shambles. I don't see what ultimate choice they have but to settle with Linotype and I predict this will quietly happen, as it nearly did last year.</p>
      <p>And that will be good. Linotype deserves the money. Frutiger deserves the money. I only hope he gets it before he dies. Given how bad Microsoft will look if they drag this out until Frutiger is no longer alive, I encourage Microsoft to move towards a very rapid settlement.</p>
      <p>To be blunt, Si, and all the rest of you at Microsoft, if you get Frutiger on board now, he's an asset and you'll be heroes, although you'll be poorer heroes: by a penny per OS you sell. But if you wait until he's gone, you'll always be seen as Pontius Pilate. Is that the outcome you desire? Can you live with that outcome on both the personal and corporate levels? </p>
      <p>The question isn't whether you will settle, but when.</p>
