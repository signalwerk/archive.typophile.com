      <p>'While I would offer the following paradox:<br>
      When you digitize it, you lose it. Because no digitization technology<br>
      can be perfect - '</p>
      <p>Honestly, I see nothing wrong with Fog 4/5's floating point points - that gives you pretty infinite flexibility, and FontLab can deal with floating points, no doubt more in the future. And that's just talking about classic Postscript limitations. Furthermore, you are assuming that the designer's idea is greater than conventional digitisation allows, which is pretty unlikely. </p>
      <p>'like think of Raph’s and others’ issues with beziers.'</p>
      <p>The issue isn't what you can achieve, but how easily. You can draw with Raph's techniques and convert to Bezier, and vice versa. As long as you have the patience to deal with the technical demands of the drawing system you are using, you can accomplish anything you want - it's just that there's a bit more labour involved. But I think that's true of every system. </p>
      <p>I don't think the problem is digital per se, but the specific limitations of 1,000 em traditional postscript. There are plenty of ways to get round that, even now.</p>
      <p>When you say no digitisation process is perfect you might just as well say no printing process is perfect, no rasteriser is perfect, no eye is perfect, no art, no soul. </p>
      <p>When Edith Wharton lay on her deathbed, she discussed Balzac with her friend Elsina Tyler, who asked how she could possibly admire Balzac so much, as he was such a poor stylist. Wharton replied, 'You might just as well say that the streets are paved with cobblestones.'</p>
      <p>But do these issues belong here? And would someone besides me please volunteer to do some Frutiger Next/Segoe Italic comparisons? Or can it be conceded that we don't need them? Can anyone suggest predecessor designs that might be of interest? I am still not entirely confident I have got my head around David Berlow's discussion of sans italics in TBR/TBF, with the interesting observations about teardrops and male and female something or others. One of the things that is valuable about that small essay is that it provides some new and useful analytical terminology for type taxonomy.</p>
