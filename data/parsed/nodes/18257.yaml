      <p>As I mentioned earlier, I don't think cryptomnesia is possible in type design.<br>
      For instance, if a dozen type designers were asked to recreate the Frutiger A, it's unlikely that any would match the exact angles, overshoot, stem taper, height of the crossbar, and stem thicknesses. And to do the same thing for the whole alphabet would be impossible.</p>
      <p>No, the nature of the game is direct reference: copying and modifying outlines, or tracing.</p>
