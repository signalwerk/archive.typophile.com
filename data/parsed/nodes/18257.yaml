  html: "<p>LETIMES has the latest installment of the Segoe Saga!!!!</p>

    <p>We're so excited about it that we're posting to Typophile before doing anything else.</p>

    <p>Breathtaking new heights have been scaled in design piracy, which will shortly be the subject of new content at letimes.com, which as you know is the site that <em>celebrates</em> type piracy (though it sure doesn't update its website too often).</p>

    <p>When Adobe pirated Frutiger in 1993, the designer complained, and Adobe sent Frutiger a letter explaining in seven dense pages, all the <em>true differences</em> there were between Myriad and Frutiger.</p>

    <p>But Microsoft's new corporate typeface, Segoe, will cause less trouble. This masterpiece of fidelity is so hard to distinguish from Frutiger that, as we learnt in the EU ruling today, <em>Microsoft now takes the official position that there is no difference between the two designs.</em></p>

    <p>See the EU trademark and design authority decision <a href=\"https://web.archive.org/web/20150123102714/http://oami.eu.int/PDF/design/invaldec/ICD%20000000743%20decision%20(EN).pdf\" rel=\"nofollow\">here</a>:</p>

    <p>The latest news in this saga is that the EU trademark and design registration office has declared Linotype the winner and invalidated Microsoft's registration of Segoe as an original typeface, which just proves our point. </p>

    <p>However, though Microsoft may have lost at the EU, we at Le Times congratulate Microsoft for doing an even better job than Adobe in getting to the <em>true essense</em> of Frutiger. Can anything rival the fidelity and sensitivity with which this princely project of piracy has been realised? Can a Peignot award be beckoning for its gifted designers? </p>

    <p>Sadly, Le Times must note that Frutiger won't be able to discuss his typeface with Microsoft this time around. Now seventy-five, and ill with lung disease, it seems he doesn't have the strength to concern himself with the matter. </p>

    <p>But there is good news too!!!! We expect that Microsoft's shareholders will be grateful to Microsoft for hitting upon this delightful method of saving money. Before commissioning Segoe, Microsoft <em>did</em>, Le Times has heard from Linotype, try to license Frutiger, but baulked at Linotype's price: one penny per OS sold. Kudos to Microsoft for realizing that <em>pennies</em> add up to an <em>unacceptable</em> and <em>unfair</em> shareholder <em>burden</em>. </p>

    <p>We expect there will be some <em>carpers</em> out there who fancy it unfair that Frutiger will be deprived of substantial royalties for his work. We can allay their anxiety by advising them to consider the practical, shareholder-driven view: Frutiger will soon no longer be with us.</p>

    <p>We ask everyone in the design community to join us in endorsing Microsoft on this felicitous occasion. It takes an entity of Microsoft's <em>philanthropic</em> resources to be able to deliver this final tribute to a great designer on his sickbed. </p>

    <p>(Personally, I would have sent flowers instead.)\x1a</p>"
