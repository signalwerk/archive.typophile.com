      <p>Thank you John for (I would judge) going out on a bit of a limb to make this point clear: the Segoe story has nothing (as far as I know or can imagine) to do with the ClearType story. It is important not to get the points confused. If Nick can get the two issues confused, anyone can get them confused, and they should not be confused. The fault may be mine, perhaps for having been unable to resist a cautious if slightly Menckenian dig (which I hope will have a brought a reluctant smile) at the CT project that I thought was so vague it would sail over everyone's head. My touch is clumsier than I thought and the remark should not have been made.</p>
      <p>Nick, you raise some good points which I would like to address. You suggest that the old guys may have been invited to participate in the CT project but declined on political grounds. That is not the case, I happen to know. None of them was asked. Clearly, there was a desire to bring some new and younger faces on the scene. That is inherently laudable, extremely so. In this case, there were overriding practical reasons why it should not have been done, or not have been done to quite the extent it was done, but that has all been gone into on this forum and presumably forgotten. I wish it were quite off topic but it isn't. To continue with your train of speculation, since the 'Four Kings' weren't asked, we can't know how they would have responded. But I think I can safely guess that they would have accepted, and for two reasons. The first is that almost no type designer can afford to turn down a commission, and to go further, there is scarcely, I think, any artist or craftsman who is not eager to make the Faustian compact, if only he is given the chance. </p>
      <p>The second reason is that the designer/artist/craftsman who is dealing with the devil always thinks he can do something to correct the devil's ill deeds. The latter of these factors operated for Zapf when he consented to design Linotype Palatino for Microsoft. I don't think he needs the money, but I do know that he ardently hoped, and was led to believe, that 'Book Antiqua' - as great an affront to him as Segoe is to Frutiger - would disappear from the Microsoft OS. And it did. But not from Microsoft apps. Apparently, Book Antiqua is too entrenched to enjoy the death that Zapf was led to expect would befall it when he consented to build Linotype Palatino for Microsoft. I believe that the deed could have been done with some sort of substitution tables and perhaps some explanatory information, but Microsoft, undoubtedly for what it saw as overwhelming practical reasons, chose not to go that way. At least as I understand what transpired. Furthermore, though Book Antiqua was designed to have metrics identical to Postscript 35 Palatino, what if the new Linotype Palatino metrics were not identical? And wouldn't that have been an unfair burden to place on the designer?</p>
      <p>'So if push came to shove, and MS offered to pay you big bicks for a commission, would you accept?'</p>
      <p>I would like to say 'indubitably yes', but I am so unaccountable, there's no telling what I would do. And I very much doubt I will ever have the opportunity to find out.</p>
      <p>What I would like to say is that your remarks connect with something that has been going on in my head over the last few days, and that is that I constantly find myself looking for an easy way to solve some type problem and get something out there that is good and doesn't take much effort. And I am constantly finding that every time I try to do this, it doesn't work. But I can't stop myself from looking for an easy way out. You would think, after all this time, I would have learnt my lesson. And I am just thinking in the realm of pretty ordinary text type. I can imagine that a charming, daffy, and quite original display typeface like your Fontesque might have sprung out pretty quickly and effortlessly. On the other hand, it would not surprise me if a lot of long and grueling work went into it. Which way was it for you, Nick? </p>
      <p>Finally, and getting further off topic, John, I would not be surprised if Corbel would make a great UI and corporate font, but you really ought to make an effort to show it better than you have done in the past! Speaking of which, we are very busy here defending the Frutiger typeface, as it is right for us to do. But I quite agree that almost anything else would have been a better choice for Microsoft. Especially given Apple's extensive use of Myriad. Isn't it amazing how  exceptionally staid and rigid technology companies are in their corporate ID schemata? I sometimes find myself thinking that I would be happy never to see Frutiger again. It needs a rest. Yet on the other hand, it <em>has</em> had a rest. Here we are seeing its second period of triumph. And maybe the reason both Apple and Microsoft are using Frutiger so extensively is that the matter is, somehow, not really in their control? That Frutiger is, somehow, the typographic language such a company <em>has</em> to speak at this point in time? The more I learn about Frutiger, the more powerful it seems. </p>
      <p>Be that as it may, the ethical issue does not change. It doesn't matter if you like Frutiger or dislike Frutiger. It doesn't matter if you want to use it, or don't want to use it, or are compelled by inscrutable forces to use just this Weltbild/design against your will: if you do actually use Frutiger, you must pay Linotype, its owner, for it.</p>
