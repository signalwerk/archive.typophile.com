    html: <p>Nick, thanks for your further comments about Fontesque, which I think is one of the finest of all fantasy fonts, as one might call them. What you say confirms my feeling that it had to have come out of some substantial backlog of skill and experience. I apparently fibbed, by the way, when I said somewhere that I had written about it in the mid-90s. I looked through all my files and saw that though it was illustrated and captioned in a story I did on FontFonts for Publish or DTPJournal, or something like that, there wasn't enough room to actually say anything about it. Of course the story could have been changed at some point, and I don't have a print copy anymore. Oh let me stop blathering, nothing I wrote about fonts in the mid-90s is worth the bandwidth even at today's prices.</p>
