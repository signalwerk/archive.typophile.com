      <p>I think it's a mistake to attach too much importance to "point piracy".</p>
      <p>On the one hand, a good principle, because it really is a huge time-saving cheat to take someone else's outlines and tweak them.</p>
      <p>On the other hand, in my own work, almost all my fonts (in widely differing styles -- way further apart than Gill Sans and Futura) were made by modifying one of my other fonts, self-piracy.</p>
      <p>By saying that point-piracy is theft, it kind of absolves "mere" analog imitation and tracing, and dubious bad intent and convenient self-deception, from that stigma and responsibility.</p>
