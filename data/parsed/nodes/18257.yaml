      <p>'Why does an OS typography have to be generically bland?'</p>
      <p>Because we are all using the computer to express our thoughts and from the OS we want the closest thing to transparency we can attain? </p>
      <p>I actually don't think Frutiger is a good choice for the interface. Frankly, nothing beats Helvetica/Arial for me -- except Geneva. I don't want the interface font doing <em>anything</em> to distract me. </p>
      <p>For my DOS word processor, XyWrite, I like but don't love Lucida Console at 28 points on a 1920x1200 screen, which gives me about 40 lines of text. So many more wonderfully transparent text fonts seemed to exist in the bitmap, monospace days, real triumphs of style and getting the most out of the least. There was real creativity when you were confined to an 8x10 grid or whatever it was. And now . . . creativity . . . reach for what - - - Frutiger? ? ? </p>
      <p>How about this goal: the font that places the minimum distance between me and the machine? I have a feeling that wouldn't look much like Frutiger or any of the other sans serifs we think we know and understand. There's a problem here: we're approaching the screen from too much of a print perspective. We need a clean slate with a clean screen perspective that doesn't owe anything to print.</p>
