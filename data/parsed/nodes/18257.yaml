      <p>I cannot entirely agree with this without further information, as I am not convinced that in common law argument forgery is anything more than a particular kind, or subset, of theft. </p>
      <p>OED defines theft as 'The action of a thief; the felonious taking away of the personal goods of another; larceny; also, with a and pl., an instance of this. Forgery, by contrast, is '3. The making of a thing in fraudulent imitation of something; also, esp. the forging, counterfeiting, or falsifying of a document. For the use in Law see quot. 1769.' That quote, from no less than Blackstone is:</p>
      <p>1769 Blackstone Comm. IV. 245 Forgery, or the crimen falsi..‘the fraudulent making or alteration of a writing to the prejudice of another man’s right.’</p>
      <p>I am certainly willing to accept your position that the proper term to be used here is forgery, but I would want German, British and American legal opinions on that before coming to a firm opinion of my own. Well, and I would also, since I was quoting from the Bible, want to hear a Biblical law opinion as well. </p>
      <p>I have a question. You write, in the referenced webpage,</p>
      <p>'By the same token, "Frutiger" and "Myriad" are regarded<br>
      as "identical". Therefore, Adobe Inc. is not allowed to<br>
      register its forgery "Myriad" as "new" and "individual"<br>
      design in the European Community.'</p>
      <p>This implies that Adobe has attempted to register Myriad and that the EU has determined that it is identical to Frutiger. I have not heard of this actually occurring. Has it? If so, could you document it? Or were you stating a hypothetical case? If so, I think it would have been helpful to have stated that.</p>
      <p>You point out that Microsoft has a right of appeal, but I suspect that the position enunciated by its own lawyers - that the typefaces are identical - cuts off any possibility for Microsoft to prevail in future actions of any kind with regard to this typeface. Who, by the way, is Graf von so and so? Do you happen to know, Uli?</p>
