      <p><em>Can one really argue that at those small sizes, a typeface is a knock-off of something else?</em></p>
      <p>With ClearType or without ClearType? :)</p>
      <p>The small size bitmaps are a product of the outline font and its hinting, so even if the bitmaps themselves are not considered knock-offs, they are a product of an outline font that may be. If MS had made a bitmap font, I doubt there would be this kind of controversy, even if the bitmaps were identical to those generated by an existing TT version of Frutiger (such as that made for MS's eBook reader).</p>
      <p>In the case of Segoe, though, the project includes not only the UI fonts but also the use of the design in MS corporate branding. So clearly this typeface is not only going to be seen at 20ppm or less. Indeed, I first saw it in banners at about 600pt.</p>
