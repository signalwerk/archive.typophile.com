      <p>Also, when Nick wrote 'I don’t think you need a panel of experts', I should have responded immediately that I'm not talkimg about a panel of <em>experts</em> per se. Indeed, a process that relies on individual expertise is generally not a robust process. What is important is a process of review, of exploration, consideration and recommendation. Consultation with experts might form part of the process especially, for instance, where non-Latin fonts are concerned where the provenance of designs can be quite, um, complicated. But the process shouldn't rely on experts. For most cases, all you need is decent research skills and a reasonable amount of time. Cases like Segoe would be the easy ones, where the resemblance is obvious to anyone whose been typographically awake for the past thirty years. Determining whether, for instance, a Bengali typeface is or is not a clone of another is much trickier and needs forensic examination by an expert.</p>
      <p><em>One sad thing about this story is that people’s names get indirectly linked to this issue, and are assumed to be associated with the crucial decisions behind the process, when in fact they might even be against it.</em></p>
      <p>Indeed. I was trying to find the right words to make this very point, Miguel. One shouldn't assume that everyone as Microsoft thought that Segoe was a good idea.</p>
