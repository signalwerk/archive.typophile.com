      <p>Thank you John for your remarks on the Almanach. I wonder if Uli caught the rather cheesy reference to Faust? Albert de Frayne, a Monegasque chess player of great talent and undeserved obscurity who lurks here but sometimes corresponds with me privately, was completely deceived. </p>
      <p>Now to our vocabulary:</p>
      <p>'Copying something and passing it off as your own invention is not usually called forgery: it is called plagiarism.'</p>
      <p>Which of course is not often considered an indictable offense, though it is frightfully bad manners. Good try, John! (In England, Uli, plagiarists are sometimes sent to Coventry, and if you know that expression, now verging on the archaic, your English is superb. I imagine most reasonably well-educated Americans are unfamiliar with it.)</p>
      <p>However, John, I think you are spinning the English definition too far away from OED: <em>The making of a thing in fraudulent imitation of something; also, esp. the forging, counterfeiting, or falsifying of a document.</em></p>
      <p>The making of a thing in fraudulent imitation of something - that seems just about to fit the case of Segoe, and it is the primary sense of the word; the sense you and I use most comfortably is secondary though not secondary enough to be considered distinct. I admit that I too was uncomfortable with 'forgery' at first. But I now accept that was only because I didn't know what the word meant. It's very trying for a competent English writer to be corrected on a simple word usage by a German, but one sometimes has to submit to these indignities with as much grace as one can summon. </p>
      <p>Yes, we all mostly know a popular, common sense of the word, which we often apply to paintings and documents. But that is not the exclusive sense. The larger sense in OED seems to fit this crime perfectly, and I can't think of a better term in English. </p>
      <p>'fraudulent imitation' is the key basic sense we have to grasp here. </p>
      <p>What does fraud mean? Again, in OED, the key sense is 'Criminal deception; the using of false representations to obtain an unjust advantage or to injure the rights or interests of another.'</p>
      <p>That is absolutely on target here. Microsoft falsely represented to the EU that Segoe was an original typeface. It was indisputably their intention to injure the rights and interests of Linotype and Frutiger by doing so. I can't see any way round that.</p>
      <p>'Imitate' is too richly defined to quote here, but some key extracts are, 'to mimic, counterfeit', 'to copy, reproduce'. </p>
      <p>So: I accept 'fraudulent imitation' as an exact description of Segoe. </p>
      <p>In that case, why not accept 'forgery' since that is exactly what 'fraudulent imitation' means? </p>
      <p>That fraud was intended, and achieved here, cannot I think be gainsaid, can it? </p>
      <p>Over the weekend I'm going to try and run the whole question by a couple of senior American federal judges I know; it will be interesting to see if they can provide any additional illumination. That's always supposing I can get them to understand what a digital typeface actually is. They are both getting on in years. But one is a real expert in derivative artworks, so his opinion should be worth having if he will give it.</p>
