      <p>1)</p>
      <p>&gt; OED defines theft as ‘The action of a thief; the felonious taking away of the personal </p>
      <p>It is okay to speak of "theft" in the Segoe case, provided this term is used metaphorically. But from the legal point of view, the word "theft" should be avoided here, because most states of Europa and also most states of America restrict "theft" to "movable property", for example:</p>
      <p>"Whoever intentionally and without claim of right takes, uses, transfers, conceals or retains possession of movable property of another without the other's consent and with intent to deprive the owner permanently of possession of the property..." (definition of theft in Minnesota penal code).</p>
      <p>According to the above Minnesota statute definition of "theft", one can e.g. steal a CD containing fonts (because CDs are "movable"), but one cannot e.g. steal the design of a font (because the design is "intangible"). </p>
      <p>2)</p>
      <p>&gt; This implies that Adobe has attempted to register Myriad and that the EU has </p>
      <p>The forgery Myriad contains the legal declaration "U.S. Patent Des. pending", but it is unknown to me, whether Adobe Inc. registered Myriad in Europe. This would be illegal in Europe, since Myriad is a forgery of Frutiger. Registering a forgery of Frutiger in Europe constitutes the crime of fraud, if the sale of the forgery takes place. In the Segoe case, the crime of fraud did not yet take place, since the sale of this Frutiger forgery (or rather the sale of Windows Vista containing the forgery) does not yet take place in Europe.</p>
      <p>Note: The invalidity division stated that "the prior design and the RCD are to be considered identical". The prior design is the original, and the RCD is the forgery. In the Myriad case, the invalidity division would certainly arrive at the same conclusion as in the Segoe case. </p>
      <p>3)</p>
      <p>&gt; Who, by the way, is Graf von so and so? </p>
      <p>"Bosch, Graf von Stosch, Jehle" (note the commas) are the names of lawyers of a law firm in the city of Munich in Germany representing the Microsoft Corporation in patent law matters.</p>
      <p>see <a href="https://web.archive.org/web/20150123102714/http://www.bgsj.de/" title="http://www.bgsj.de">http://www.bgsj.de</a></p>
      <p>4)</p>
      <p>&gt; The judgement states that Linotype’s observation that the Segoe and Frutiger are<br>
      &gt; identical is uncontested by Microsoft. That seems to me something less than a<br>
      &gt; positive statement by Microsoft: it may simply mean that they did not elect to<br>
      &gt; answer this observation at all. Could they choose to address it in an appeal? </p>
      <p>It should be emphasized that the invalidity decision is not a "judgement" by a law court, but a decision by a non-judiciary administative office. For those who want to know to what extent the design of fonts may be protected in Europe, I uploaded the full text of the "Council Regulation No 6/2002 of 12 December 2001 on Community designs" as document Segoe4.pdf to my website</p>
      <p>see <a href="https://web.archive.org/web/20150123102714/http://www.sanskritweb.net/forgers/index.htm#Monotype" title="http://www.sanskritweb.net/forgers/index.htm#Monotype">http://www.sanskritweb.net/forgers/index.htm#Monotype</a></p>
      <p>Microsoft of course is permitted to appeal (see the invalidity decision shown in file Segoe1.pdf and see also page 23 of file Segoe4.pdf). But what is more important, should Microsoft not win this appeal, it can institute legal proceedings at a real law court (see page 24 of file Segoe4.pdf). This means that the invalidity decision of the administrative invalidity division is not yet final, although the invalidity decision would become final, if Microsoft did not lodge an appeal.</p>
      <p>Nevertheless, despite all these various legal remedies available to Microsoft, in my view it is practically impossible that Microsoft will win for two reasons:</p>
      <p>a) From the procedural point of view, the fact that Microsoft did not contest ("As rightfully observed by the Applicant and uncontested by the Holder, the prior design and the RCD are to be considered identical.") has the procedural consequence that any later contestation will not be accepted by a law court on account of the legal principle called "venire contra factum proprium". Therefore to assume "it may simply mean that they did not elect to answer this observation at all" would mean, at least by European procedural law, that the Microsoft lawyers Bosch, Graf von Stosch, Jehle made an unpardonable procedural mistake which is difficult or even impossible to remedy later by another law firm.</p>
      <p>b) However, even if Microsoft's belated contestation would be accepted by a law court, such a contestation is useless, because Microsoft cannot to prove that Segoe is *not* identical with Frutiger ("identical" in the sense used by the invalidity division). Therefore, in my view, the Microsoft lawyers Bosch, Graf von Stosch, Jehle did not make a procedural mistake, but instead came to the conclusion that would be futile to contest that Segoe is not a forgery of Frutiger.</p>
      <p>5)</p>
      <p>The real trouble will start for Microsoft, as so as Microsoft starts selling Windows Vista including the forgery Segoe to customers in Europe. In strict legal parlance, Microsoft does not "sell" Windows in the same way a baker sells pancakes, but Microsoft "grants licences" via EULA contracts, i.e. it "sells" rights. But Microsoft does not own the rights to Segoe, since nobody can legally own the rights to any forgery of Frutiger. And since it constitutes the crime of fraud, if someone "sells" rights which do not exist, any European customer can request that the monopolist Microsoft sells Windows Vista without the forgery Segoe. And this means that Microsoft will have to offer two versions of Windows Vista: One version including the Frutiger forgery Segoe designed for Americans and one version without the Frutiger forgery Segoe designed for Europeans.</p>
