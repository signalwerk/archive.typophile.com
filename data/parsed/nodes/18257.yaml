      <p>Hrant, can't you stay on topic? I didn't even mention Lexicon. But if there is a story to tell about that font and Roy, why don't you do everyone a favour and tell it? Somewhere else? Do a little webpage or a Wikipedia entry. It would interest a lot of people and would one hopes be a more permanent record than a blog posting.</p>
      <p>It's a little interesting that Faul(es)haber has succeeded for quite some months now in imposing the impression, now revealed by Bruno Steinert to be false, that he is the 'designer' of Frutiger Next. Of course he isn't. At Linotype, even Zapf has an art director. There is someone on this thread who could tell us some stories about designing for Linotype with one of their art directors in charge. ( A Lino art director is not necessarily someone on staff, either; distinguished consultants are sometimes brought in.) It isn't necessary to go into details; suffice it to say that it can be a painful experience and may allow the designer almost no latitude for creativity. This may indeed be something of a corporate psychological holdover from Lino's old days when the designer was but a very small cog in a huge manufacturing process. The type designer as star is a recent phenomenon. Working for Lino could be an ego-bruising, but nevertheless a highly instructive experience.</p>
      <p>Of course, one of the pleasures of working on a clone is that an art director is not needed; technical fidelity is the only requisite. That leads to a question: We seem to have established that Segoe is an exact duplication of Frutiger with the exception of one or two exceedingly minor details. I would be curious to know if anyone has looked at the spacing. Does that correspond to the data in hitherto released versions of Frutiger? It would be something, not much, if we knew that Segoe's designers had at least done their own spacing. It would say something, again not much, about intent. If the spacing is identical, for example, to Linotype's, that would enhance  the impression that the font was expected to behave identically to Frutiger at a very deep level.</p>
