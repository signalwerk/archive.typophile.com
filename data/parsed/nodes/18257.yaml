      <p>Well, John, certainly the two OED2 definitions of plagiarism, </p>
      <p>1. ... the wrongful appropriation or purloining, and publication as one’s own, of the ideas, or the expression of the ideas (literary, artistic, musical, mechanical, etc.) of another.</p>
      <p>and </p>
      <p>2. A purloined idea, design, passage, or work.</p>
      <p>also fit the bill nicely. </p>
      <p>So having exhausted our literary and amateur legal resources, I think it is time for some expert legal opinion. I realise that by now you probably consider yourself an expert in the field, but lawyers, especially judges, often hold rather shockingly different opinions from the rest of us. </p>
      <p>You are not exaggerating when you say that you have always been disclosive about the Segoe matter, going back about two years to when the story first broke. Recklessly so, was the opinion in high places. I find that interesting.</p>
