      <p>One more comment about that e. What would it now take to turn Frutiger into an exact duplicate of Segoe? Not much. I got a pretty exact match by moving a few handles exactly 10 or exactly 20 units, and by moving one point exactly 10 units. Two things make me uncomfortable: (1) how easy it is to move handles 1 and 10 unit increments in Fontlab with the cursor keys--a feature suggestion for which I am responsible; (2) that it is possible to get from here to there with just a few 10 or 20 unit pushes of the arrows via the cursor keys -- in other words, less than ten keystrokes altogether. Again, what does this mean, if anything? Again, I have no idea. 'Je n'impose rien; je ne propose rien: j'expose' -- if I may make use of a rather mischievous bit of imposture. </p>
      <p>Have I just succeeded in reverse-engineering Segoe? I don't know. I doubt it. </p>
      <p>For one thing, I suspect that other characters would require different interpolation/extrapolation settings to get a good match -- and for evidence of a purely mechanical or purely cynical copy we need to see global manipulations at work. For another, I am not experienced in this kind of analysis, so I can't tell how significant any of my findings, so far, are. For example, I have discovered that it is quite easy to match the Frutiger and Segoe e. But I have not tried the same experiment with 30 or 40 other fonts and with other characters. What if it were nearly as easy with some of those? Then what I have shown here would have little significance. On the other hand, if it were very difficult to accomplish the transformation with many other fonts, then I think I would (might) have found out something that was at least a factor worth considering within a larger frame. Finally, let's not forget the astonishing passage in one of Walter Tracy's books where he shows how Monotype in the 1930s only had to change a few characters in Gill Sans to come up with an effective lookalike for Futura. That's important for two reasons: because Gill and Futura are supposed to be so different philosophically and practically (the one 'geometric', the other 'humanist' -- that latter being a word I would like to see excised from the type vocabulary as it is so value laden that it will inevitably be misused); and because it shows - shucks! - that Mono was already doing this way back when. </p>
      <p>I wonder if it's possible to say that Linotype was always the more successful company, and that Monotype was always looking for ways to get a piece of Lino's cake? I don't know enough about the financial and competitive history of the companies to hazard a guess there.</p>
      <p>So after all of this, I'm left with what we started out: (1) the feeling clearly articulated by John and Adam, and shared by most others, that the fonts are too close; (2) Linotype's victory with the EU; (3) Microsoft's legal acknowledgement that the fonts are identical -- at least within the terms of that tribunal.</p>
      <p>I guess I should have a look at the italic of Segoe and Frutiger Next, but I'm not looking forward to it. I do have work to do!</p>
