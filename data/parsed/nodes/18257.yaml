      <p>Uli: <em>No court judge in Europe would examine a font with a microscope.</em></p>
      <p>I wasn't talking about a court, I was talking about a process for prevention at the pre-licensing stage. I don't see much point in me stating legal opinions because I'm neither a lawyer nor a judge. So I'm focusing on the question 'What can be done, practically, to prevent this kind of thing from happening?' Of course, this presumes goodwill, i.e. that a company like Microsoft wants to do the right thing or, at least, wants to avoid getting into this sort of mess, being accused of these kinds of things, paying lots of money to lawyers, and having judges in important foreign markets decide against them.</p>
      <p>When I made reference to a microscope, I was alluding to the kind of forensic analysis that is sometimes necessary to detect a process of deliberate, concealed derivation. Any moderately experienced typographer can look at Segoe and Frutiger side-by-side and come to the conclusion that the former looks very much like the latter, even if some may disagree about whether it looks <em>too much</em> like the latter, or whether the coincidence of the outlines is significant in a type designed primarily for screen, or whether the intent to copy is deliberate, or whether the licensing is evidence of deliberate intent or negligence.</p>
      <p>But the number of people who can authoritatively say, for instance, that Bengali typeface X is derived from Bengali typeface Y is quite small, and the if the derivation is concealed by changes to some details or proportions a close forensic analysis is necessary to determine the relationship of the two designs. A court might not look closely enough. The typographic community that is discussing Segoe at such length might not know or care enough about Bengali typography to interest itself. But the questions of originality, derivation, intent and negligence are the same, and should be addressed <em>at the typeface selection stage,</em> before the licensing contracts are signed, before the fonts are shipped in beta products, before the lawyers get involved.</p>
