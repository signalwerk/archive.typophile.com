      <p>&gt; Thank you, Uli, for clarifying these matters quite satisfactorily.<br>
      &gt; I am interested in the detail you give as to the possible action<br>
      &gt; against Microsoft for fraud that would appear to lie open to<br>
      &gt; Linotype were Segoe to be sold or licensed in the EU.</p>
      <p>As already stated by me, the real trouble does not start now, but will start in the near future, e.g. by the end of 2006 or later, when Windows Vista is sold by Microsoft in Europe. There are three different legal scenarios, namely these:</p>
      <p>1) Segoe as ordinary fraud crime</p>
      <p>This legal scenario cannot be specified presently, because it is not yet known, whether e.g. Ascender will sell the Frutiger forgery Segoe in the near or far future.</p>
      <p>2) Segoe as "branding" case</p>
      <p>This legal situation already exists today, because Microsoft and its advertising and promotion agencies already today use Segoe as "branding" font for typesetting of Microsoft advertisements etc. See the publicity PDF files at the <a href="https://web.archive.org/web/20150123102714/http://www.microsoft.com/" title="www.Microsoft.com">www.Microsoft.com</a> website.</p>
      <p>In the Segoe "branding" case, the legal situation is completely identical to the legal situation in the United Parcel Service case (UPS Sans vs. FF Dax alias Barmen). This latter case has already been described by me in a 16-page German-language document:</p>
      <p><a href="https://web.archive.org/web/20150123102714/http://www.sanskritweb.net/forgers/barmen.pdf" title="http://www.sanskritweb.net/forgers/barmen.pdf">http://www.sanskritweb.net/forgers/barmen.pdf</a></p>
      <p>Whatever was said in this document concerning the UPS Sans "branding" case also applies to the Segoe "branding" case so that there is no need to repeat here what was said there.</p>
      <p>3) Segoe as EC anti-trust case</p>
      <p>The legal scenario for this case cannot be specified presently, because everything depends on whether or not Microsoft will include Segoe into the Windows Vista version distributed in future in the European Community.</p>
      <p>Microsoft as a monopolist has repeatedly ignored the European anti-trust laws, notably in the "500 million Euro fine" case two years ago:</p>
      <p><a href="https://web.archive.org/web/20150123102714/http://www.dw-world.de/dw/article/0,2144,1149791,00.html" title="http://www.dw-world.de/dw/article/0,2144,1149791,00.html">http://www.dw-world.de/dw/article/0,2144,1149791,00.html</a></p>
      <p>For the current EU vs. Microsoft situation see the official website here</p>
      <p><a href="https://web.archive.org/web/20150123102714/http://www.eurunion.org/News/press/2006/20060016.htm" title="http://www.eurunion.org/News/press/2006/20060016.htm">http://www.eurunion.org/News/press/2006/20060016.htm</a></p>
      <p>From this official website, it becomes apparent that the European Anti-Trust Commission does not accept the illegal "bundling" behaviour of Microsoft concerning the Windows operating system components.</p>
      <p>Let us assume, Microsoft will sell Windows Vista "bundling" the Frutiger forgery Segoe in Europe, then it is likely that the monopolist Microsoft will be forced by the European Commission to "unbundle" Windows Vista, i.e. to sell it without this forgery, because nobody in Europe can be expected to accept forged fonts as part of an operating system, in the same way as nobody can be expected to accept forged bank notes as part of the monthly salary.</p>
