      <p>&gt; Copying something and passing it off as your own invention<br>
      &gt; is not usually called forgery: it is called plagiarism.</p>
      <p>Since my "Font Forging Industry" website (<a href="https://web.archive.org/web/20150123102714/http://www.sanskritweb.net/forgers" title="http://www.sanskritweb.net/forgers">http://www.sanskritweb.net/forgers</a>) is visited daily by hundreds of visitors from all over the world, I selected the very broad generic legal term "forgery", because I could not find a better generic legal term which could be understood by visitors from Netherlands, Brazil, Italy, Canada, Romania etc. (just to quote a few countries from my today's website statistics), who live in different countries with different laws. Of course, in my German-language documents on the "Font Forging Industry", I use other very special German legal terms, but these much more specialized German legal terms cannot be generalized for all other countries.</p>
      <p>The term "plagiarism" (in German and in French: "Plagiat") suggested by Mr. Hudson has the disadvantage that it is a term, which does not occur in the laws of the countries which I know. For instance, "plagiarism" does not occur in German laws, nor does "plagiarism" occur in the American nor in the British nor in the French copyright act. For instance, when you download the entire "Copyright Law of the United States" contained in the PDF file</p>
      <p><a href="https://web.archive.org/web/20150123102714/http://www.copyright.gov/title17/circ92.pdf" title="http://www.copyright.gov/title17/circ92.pdf">http://www.copyright.gov/title17/circ92.pdf</a></p>
      <p>and when you, after downloading, search via Adobe Acrobat for the term "plagiarism" in this PDF file, you will not find any occurrence of this term "plagiarism". I also checked the British "Copyright, Designs and Patents Act" and also checked the French copyright code, and as regards Germany, I can say with conviction that the term "Plagiat" is never used in any of the many German civil and penal laws.</p>
      <p>The term "plagiarism" is a literary term, which may be used in the New York Times Literary Supplement, but it is not a legal term, because it does not occur in American laws and hence does not have a legal definition.</p>
