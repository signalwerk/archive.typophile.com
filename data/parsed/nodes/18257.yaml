      <p>This is really a long-winded thing. There are two issues John's brought up that are interesting though. When Steve worked on this face he did not copy anything, I'm sure of that 'cause I know Steve and that's just not what he's about. The other point is the one where we say, well, what was Frutiger, (the face). It was a typeface family originally designed to work only on Linotype machines. </p>
      <p>As such, the contours would have been placed, in each and every detail, to work perfectly with a specific appearance on Linotype machines. What happened subsequently, with Frutiger output to any and all devices that'd take it, with no design compensation in the ps upgrading, means that Frutiger output in 1994, looks a whole lot different and with multiple appearances than Frutiger 1984, rather stable type.</p>
      <p>So now, if you take an outline that's a 1984 Frutiger clone, add a new rasterizer, hints, and modifications to the outline for those technical "upgrades", now what have you got? How does Frutiger at 14pt 96 dpi CT, compare to Segoe at 14pt 96 dpi CT? Still the same face? Still a knockoff? Win in court? Stop. Bill, remember how sorry you were when you did this "you stole a font" to me?</p>
