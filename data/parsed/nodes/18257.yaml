      <p>That's hilarious, Bill. I think you should write a history of German typography in this manner.</p>
      <p>Segoe is actually named, indirectly, for Ladislas Segoe (1894-1983), an important figure in mid-century American urban planning who largely defined the role of urban planner as it is practised today (see. 'Ladislas Segoe and the Emergence of the Professional Planning Consultant' in the <em>Journal Of Planning History</em>, 2003, VOL 2; PART 1, pages 47-78). He is primarily associated with the city of Cincinatti, but also contributed to the planning of Madison Wisconsin, where there is indeed a road named after him on which Tom Rickner may or may not live.</p>
