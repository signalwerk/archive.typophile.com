      <p>Uli, thank you so much for this! My God, I had no idea Steve had so totally cloned the italic as well.</p>
      <p>And what is Microsoft saying in the pdf you link to? Essentially this: <em>We do not dispute that the designs are identical. We dispute that Linotype sold this data before 2004.</em></p>
      <p>What a crock of S-C-H-E-I-S-S-E. We all know that Frutiger Next has been sold by Linotype for several years now.</p>
      <p>Sorry, Steve Matteson - I love you but you should have wiped your ---- before you consented to get involved in this really filthy project.</p>
      <p>I'm sorry to be so crude, but even Goethe was when the occasion demanded, and I think this occasion demands it.</p>
      <p>A lot of people need to wipe their ---- here and this is what I suggest to the Microsoft corporate people:</p>
      <p>Let MS pay off Frutiger and Linotype.</p>
      <p>Let MS in future describe the typeface as a specially designed tribute to the great Adrian Frutiger by his great admirer Steve Matteson.</p>
      <p>That is it. End of story. Nobody will ever talk about it again.</p>
      <p>And as for you font people at MS, I have this to say. The next time you need a new typeface, whether it's for corporate ID or for something else, do not go to a slippery autodidact, a professional cloner, or a hinting technician. Go to one of the acknowledged masters now in productive late middle age. You have four good choices: Unger, Carter, Berlow, Stone. All four are at the height of their powers, and all four are hungry. These are the designers who can do the work you need done, <em>and do it without disgracing you</em>. And do it cheap. Guys --- have you thought about your futures? Do you really think Microsoft is going to keep on retaining you if you continue to get it into these endless PR, technical, and legal messes? Do you really think you are serving your company well by embarassing it as much as you have in the past two years? And this at the point when Microsoft most needs you to be making superb decisions? When there is so much at stake?</p>
      <p>Guys, do you think Microsoft likes being the loser in a legal dispute?</p>
