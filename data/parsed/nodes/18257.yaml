      <p>&gt; The only intent that matters when a typeface is published, i.e. made licenseable, is the intent to publish. The thought process that went into producing the typeface is irrelevant</p>
      <p>Mr. Hudson's view of American law is in conformity with my view of European law concerning font forgeries. Although there are certain types of forgeries, where also the intent or deliberateness to produce is relevant, e.g. the producing of forged bank notes (which is a crime even if they are not published, i.e. circulated), this deliberateness to produce is not relevant as far as art forgeries and font forgeries are concerned. This, of course, only applies to criminal law. In civil law, e.g. with regard to the decision of the invalidity division about Segoe, no intent is required by Bill Gates and all other Microsoft people. Here negligence is sufficient. Negligence means: "Bill Gates should have known that Segoe is a forgery", while deliberateness means: "Bill Gates knows that Segoe is a forgery".</p>
