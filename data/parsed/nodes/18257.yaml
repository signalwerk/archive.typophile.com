      <p>There also exist invalidity decisions concerning the italic styles,</p>
      <p>e.g. this decision <a href="https://web.archive.org/web/20150123102714/http://www.sanskritweb.de/files/segoe3.pdf" title="http://www.sanskritweb.de/files/segoe3.pdf">http://www.sanskritweb.de/files/segoe3.pdf</a></p>
