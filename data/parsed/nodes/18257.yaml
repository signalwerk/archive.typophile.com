      <p>John, I really like your discussion with regard to intent. It is excellent but it seems to be situated outside the substantial legal issue of intent. I see it more as an ethical view than a legal view. I really wish I could get more into this, and the whole derivative art issue as well. Uli, I haven't had any time to talk to anyone, I hope I will in the next few days.</p>
      <p>David, you raise issues that could turn some of our assumptions upside down. What you say about Steve has resonance and is exactly what I would have said - before this. </p>
      <p>Your points about original design versus later adaptation are also exceptionally well-taken, as are those about me and hastiness. Moreover, would you agree that it is possible to take two identical fonts, space them differently, and come up with two equally valid products that look quite different in print? But that's a red herring.</p>
      <p>Yes, it is important to consider the technological evolution of a typeface. However, here, our assumption is that all Frutiger clones, from Bitstream on downwards, are fairly rigidly based on Linotype's photo masters. All the adaptation that is going to be done has already been done, or nearly so, for photo. Here, also, to be specific, we are talking about Segoe in print, not about Segoe in CT2, and not about Segoe UI, except as it is a clearly derivative product of Segoe.</p>
      <p>One thing which might help to clarify the issue would be the answer to these questions: </p>
      <p>Did Monotype have a specific Frutiger and/or Frutiger Next clone in its OEM library? Who 'designed' it? </p>
      <p>Did Monotype have other specific Linotype clones in its OEM library? Who designed them? </p>
      <p>Micromillimetre for micromillimetre, how close are Segoe and Frutiger?  </p>
      <p>I think what you are touching on here is fair use. This is an area in which your thinking is highly evolved, since a lot of your library is based on well-thought out and impeccably provenanced fair use adaptations of earlier designs. I could not possibly overstate my admiration for the absolutely above-board manner in which you have always done this. But isn't it perhaps just a bit too much of a stretch to postulate that others think as you do and do as you do? You have provided the exactly correct model for how to do this. I need to be convinced that Monotype is following your pattern here. Are they? We have asked Microsoft and Monotype/Ascender to speak up. Where are they? </p>
      <p>As a postscript, let me give a small illustration of Font Bureau's modus operandi in this respect, from my own experience. In 1993 or 1994, I made my second baby font, a fairly literal adaptation of an 18th century early Didot. As I didn't know then how to draw digitally, I used Linotype Fairfield as my digital basis - with its designer's (Kazcun's) knowledge and informal consent - he was an early mentor. It wasn't Fairfield, far from it. But it had enough of Fairfield remaining for David to say, sorry, we love it, but it's too close to Fairfield. </p>
      <p>Believe me, guys, it would have taken a real expert to know that Fairfield was involved in this substantial redesign. But David saw through it at once. And no, that wasn't the kind of thing that he would put in his library. </p>
      <p>So I learned how to digitise from scratch. Nothing could be easier, really, once you catch on to it. And I developed the font a lot further, in many directions. It now has nothing whatever to do with Fairfield. Hey David, wanna see it? </p>
      <p>And David, on a serious note, do you think that any of the kind of rigorous aesthetic and ethical thought you put into your work has anything to do with the production of Segoe?</p>
