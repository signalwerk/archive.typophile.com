      <p>&gt; So after all of this, I’m left with what we started out: (1) the feeling clearly articulated by John and Adam, and shared by most others, that the fonts are too close; (2) Linotype’s victory with the EU; (3) Microsoft’s legal acknowledgement that the fonts are identical — at least within the terms of that tribunal.</p>
      <p>In this thread, there have been used so many inappropriate law terms (pilfery, piracy, plagiarism, theft etc.) that it was not possible for me to comment them all. Since Mr. Troop quoted Goethe, I assume that he can read my German documents at my website, so that he can read the full legal details in German language.</p>
      <p>For those who cannot read my German documents concerning the legal situation of fonts in Germany (e.g. my documents kunstwerke.pdf, computerprogramme.pdf etc.), I mention here briefly that "on principle" ("grundsätzlich", i.e. in most cases) fonts are NOT copyrightable in Germany. Therefore, with regard to the Segoe case, I always used the legal term "forgery" and never used the legal term "infringement" ("copyright infringement" or "design infringement"), because Frutiger and Frutiger Next are neither protected by the German copyright law (UrhG) nor protected by the German design law, for different legal reasons. Therefore, Frutiger Next could not be registered as a design by the German Heidelberger Druckmaschinen AG (aka "Heideldruck") which is the owner of the subsidiary Linotype GmbH.</p>
      <p>1) If Frutiger and Frutiger Next were protected by the German copyright law (Urheberrechtsgesetz), then Heideldruck could sue Microsoft for damages (which would be much much higher than "one penny per OS sold ") on the grounds of copyright infringement (§ 97 UrhG) and in addition could enforce by court that Microsoft does not sell Windows Vista with Segoe.</p>
      <p>2) If Frutiger and Frutiger Next were protected by the German design law (Geschmacksmustergesetz), then Heideldruck could sue Microsoft for damages on the grounds of design infringement (§ 41 GeschmMG) and in addition could enforce by court that Microsoft does not sell Windows Vista with Segoe.</p>
      <p>The decision of the invalidity division only has the effect that Heideldruck, which was not allowed to register the fonts Frutiger and Frutiger Next as design, could achieve the annulment of the illegal registration made by Microsoft which had deliberately deceived the registration office when it registered its forgery "Segoe" as "new" and "novel" design.</p>
