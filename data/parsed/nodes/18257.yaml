      <p>&gt; By the wyay, forgery seems an inappropriate term to this English speaker,<br>
      &gt; because it usually implies something fake passed off as something real,<br>
      &gt; i.e. something not Frutiger passed off as Frutiger. In this case, we have<br>
      &gt; something like Frutiger claimed as not Frutiger. If an intentional copy,<br>
      &gt; it would be an example of plagiarism not forgery.</p>
      <p>Thank you for your explanations.</p>
      <p>The term "forgery" as it is use by me is a legal term in (German) law books defined as follows:</p>
      <p>"forgery" = "a copy made in order to deceive"</p>
      <p>- As a first step, a copy (or imitation or replica or clone) is made.<br>
      - As a second step, an act of deception (or of fraud) takes place.</p>
      <p>Your description "we have something like Frutiger claimed as not Frutiger" exactly fits my definition:</p>
      <p>- "something like Frutiger" is the "copy" of Frutiger.<br>
      - "claimed as not Frutiger" is the "deception".</p>
      <p>Today, I perused the German book "Schriftstatistik" (Typeface Statistics) by Peter Karow published in Hamburg in 1992. On page 25 of his book, Peter Karow publicly declared that he made a copy (or clone or reproduction) of the font "Frutiger" and labeled it "Frutus". Thereafter I looked up the 1000-page manual to Peter Karow's "TypeWorks" collection, wherein he publicly declared in the preface that his copy or his clone "Frutus" is the font "Frutiger". Therefore no deception took place, because here we do not have "something like Frutiger claimed as not Frutiger", but on the contrary Peter Karow claimed that "Frutus" is "Frutiger", i.e. a copy or clone of "Frutiger". Therefore, "Frutus" is not a forgery, because Karow did not deceive anybody concerning his copy or clone "Frutus". We may describe Peter Karow as a "copyist" or as a "cloner", but not as a "forger".</p>
      <p>Now let us compare Peter Karow to the forgers at Monotype and Microsoft. Did Steve Matteson at Monotype or Simon Daniels at Microsoft publicly and frankly declare that "Segoe" is a copy or a clone of "Frutiger"? No, they did not. On the contrary, they deceived Windows users concerning Segoe. For instance, the font forger Steve Matteson declares at his website</p>
      <p><a href="https://web.archive.org/web/20150123102714/http://www.ascendercorp.com/portfolio_custom.html" title="http://www.ascendercorp.com/portfolio_custom.html">http://www.ascendercorp.com/portfolio_custom.html</a></p>
      <p>the following: "Segoe is Microsoft's new branding typeface... Steve Matteson started this project...". No mention of Frutiger, see? That is why "Segoe" is a forgery.</p>
