      <p>On the subject of the modern legal movement towards rewarding the originator of all derivative art, the New York Times has an instructive front page story today, entitled 'In the Jungle, the Unjust Jungle, a Small Victory'. Were these principles to be applied to typefaces, a high bar would be set, far higher than what most of us think 'fair use' constitutes.</p>
      <p>Here's the link: <a href="http://www.nytimes.com/2006/03/22/international/africa/22lion.html?ei=5094&amp;en=59afa9b6ff2ce677&amp;hp=&amp;ex=1143090000&amp;partner=homepage&amp;pagewanted=print" title="http://www.nytimes.com/2006/03/22/international/africa/22lion.html?ei=5094&amp;en=59afa9b6ff2ce677&amp;hp=&amp;ex=1143090000&amp;partner=homepage&amp;pagewanted=print">http://www.nytimes.com/2006/03/22/international/africa/22lion.html?ei=50...</a></p>
      <p>This could be where typeface law will some day evolve. It is easy to see that that might not be in the best interests of the industry.</p>
