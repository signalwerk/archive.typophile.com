      <p>Hrant: <em>Apparently you don’t know the details.</em></p>
      <p>Actually, I do know most of the details: enough to give Roy Preston the benefit of the doubt regarding both his intentions and his methods. However, the fact remains the <em>result</em>, the typeface he submitted to Morisawa, is too close to Lexicon for comfort. As I've written elsewhere, I've been willing to give Steve Mattheson the benefit of the doubt to: maybe he didn't set out to create a clone of Frutiger, but what matters is the result and how closely it resembles another typeface. In the typical circumstances of judging a competition, these things may slip through from time to time; they should not slip through the process of selecting typefaces to license for major software products, which must be made more rigourous.</p>
