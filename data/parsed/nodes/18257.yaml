      <p>Uli, creation dates are notoriously unreliable indicators. They vary in accuracy depending on both the tool used and the attention of the manufacturer. And what is the creation date? The date on which the font source file was first created? The date on which the first shipping version was produced? People interpret it differently, and some people pretty much ignore it. The existence of fonts with older creation dates does not indicate much at all. I've seen fonts made last year that claim to have been made in 1969, because they were made with a tool that had a default setting for 1969 that needed to be changed by the font developer.</p>
      <p>However, in reference to the pre-Microsoft history of Segoe, <a fef="http://blogs.msdn.com/jensenh/archive/2005/11/28/497441.aspx" rel="nofollow">this comment</a> from Si Daniels at MST is worth rereading:</p>
      <p><em>'The original Segoe fonts were not created for or by Microsoft. It was an existing Monotype design which we licensed and extensively extended and customized to meet the requirements of different processes, apps and devices.'</em></p>
      <p>By the wyay, forgery seems an inappropriate term to this English speaker, because it usually implies something fake passed off as something real, i.e. something not Frutiger passed off as Frutiger. In this case, we have something like Frutiger claimed as not Frutiger. If an intentional copy, it would be an example of plagiarism not forgery.</p>
