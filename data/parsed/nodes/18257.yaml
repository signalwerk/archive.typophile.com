    html: <p>Great point, Nick. I have always distinguished between point piracy, which is unimportant unless you make an issue out of it by fibbing about it, and design piracy, which annoys me much more. The two are completely different. I too have sometimes point pirated from myself. However, entirely philosophically, I would propose that where possible, fresh digitisations should be made. I think you are more likely to get into a design's skin when you digitise it afresh. Obviously, however, time does not always allow that, and not every project is so important. That said, I have wasted an awful lot of time in the past by drawing individual serifs, etc. etc. etc. What a waste of time. Missing the forest for the trees. But hey, I wasn't, like many of us, ready to see the forest at first.</p>
