    html: |-
      <p><em>In that case, why not accept ‘forgery’ since that is exactly what ‘fraudulent imitation’ means?</em></p>
      <p>Again, the usual model of fraudulent imitation in a case of forgery is the passing off of the imitation as the original that it imitates, and that is what most people will think of when they hear the word forgery. In this case, the apparent imitation is being passed off as <em>not</em> the original that it imitates, for which we have the very serviceable term plagiarism. Plagiarism is not in itself an indictable offence, as you note, but individual cases of plagiarism may certainly constitute fraud.</p>
      <p>Both Linotype and Microsoft are my clients, so I'm not inspired to get into a discussion about intentions. Sorry. I have been frank all along, though, to anyone who cared to ask, that I believe Segoe to be too close to Frutiger. Even cutting Monotype the maximum slack and imagining that they could have produced this design without deliberately referencing Frutiger and Frutiger Next, the result is unacceptably close. Stupidly so, in fact, and I'm amazed anyone thought it was a good idea to license it. Even with the best of intentions to produce a new design in this style, I think that this subgenre of humanist sans serifs is too narrow a field to support much more than already exists without the whiff of plagiarism: between them, Frutiger, Myriad and Stone Sans have pretty much covered all the bases.</p>
