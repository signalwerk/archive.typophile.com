      <p>For those who cannot read German, I should like to mention that the German Erik Faulhaber, who was an apprentice at the Linotype Library GmbH, claims to be the designer of "Frutiger Next". At his <a href="http://www.erikfaulhaber.de" title="http://www.erikfaulhaber.de">http://www.erikfaulhaber.de</a> Mr. Faulhaber declares under the header "Typedesign: Frutiger Next":</p>
      <p>"Revision and completely new conception of the Frutiger typeface family. 18 font weights commissioned by the Linotype Library" (in German: "Überarbeitung der Schriftfamilie Frutiger mit komplett neuer Konzeption. 18 Schnitte im Auftrag der Linotype Library")</p>
      <p>Mr. Bruno Steinert contests that the apprentice Mr. Faulhaber was the designer of "Frutiger Next". See Mr. Steinert's statement at the end of Mr. Faulhaber's German interview at <a href="http://www.typeforum.de/news_254.htm" title="http://www.typeforum.de/news_254.htm">http://www.typeforum.de/news_254.htm</a></p>
      <p>In order to describe this bizarre Faulhaber case, may we use the term "plagiarism", or is the term "imposture" more appropriate?</p>
