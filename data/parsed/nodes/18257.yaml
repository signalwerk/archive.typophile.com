      <p>"David: If someone had come up to you — let’s say 5 years ago, or at least long before this story had become an issue — with an unidentified printout of Segoe, asking for your comments on his/her original type design, what do you think you would have said?"</p>
      <p>It's too close to Frutiger for our "print" library, why don't you do an online face:)"</p>
      <p>"Hey David, wanna see it?"<br>
      Sure!</p>
      <p>"And David, on a serious note, do you think that any of the kind of rigorous aesthetic and ethical thought you put into your work has anything to do with the production of Segoe?"</p>
      <p>Oh, that wasn't serious?  Yes, I do believe that as far as resolution resistant designs go, Madison and Co. do as much work in figuring out the right design as we do in our print fonts.</p>
      <p>"For instance, if a dozen type designers were asked to recreate the Frutiger A, it’s unlikely that any would match the exact angles, overshoot, stem taper, height of the crossbar, and stem thicknesses. "</p>
      <p>I think that question is clear, and the answer is no, they would not make the same A.    But, if they were all told that the A had to be on 37/54ths of an em, and that 100 unit stems would be required to produce a proper "book" face, then they would all be extremely close, and some, if enough we solicited, would be exactly the same. That, in a technologically constricted world, is what happens.</p>
      <p>I've been on all sides and the middle of these arguments time and time again, and I tell you, nothing anyone says, (besides me of course), makes sense, until you've got them both on a light table and you can trace the differences and similarities to genuine typographic motives, (not including of course, "can you make me a copy?"), or you can't.</p>
