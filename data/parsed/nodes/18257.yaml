      <p><em>to what extent did years of previous training and work make it possible for it all to come out relatively fluently?</em></p>
      <p>I was originally a fine artist, though more of a print-maker than a painter. I'm self-taught as a typographer (no training), although I did take a course in calligraphy. I worked as an art director from 1977, doing marker comps of headline type for hours every day until the Mac obviated that (for me) in 1988, so type drawing fluency was well practised. Also by the time I did Fontesque, I had been using Illustrator for 5 years, so I was familiar with BCPs. Having said that, I think a lot of type designers have a "natural" casual script typeface within themself -- I was fortunate that mine came out in 1994.</p>
