      <p>'Such tools (microscopes, X-ray, chemicals etc.) are applied in art forgery cases, but not in font forgery cases, where ordinary printed alphabets typeset in ordinary point sizes and viewed with the ordinary human eye is all that is required in order to arrive at the conclusion that two different fonts “should be considered identical” (see invalidity decision).'</p>
      <p>Of course everything I have just written about my preliminary but time-consuming comparison is more or less invalidated by this . . . </p>
      <p>As I have suggested before, many of us in the font industry have some catching up to do. The EU needs to have common IP laws to the greatest extent possible; in practice that means that the laws most favourable to artists/creators will be adopted. Corporations with international product lines will have to comply with EU standards (just as DVD-burner manufacturers have just had quite painfully to retool to comply with EU standards), and eventually, US and British laws will probably follow suit, long after US and British manufacturers have had to. The ethics many of us have spent a long time working out are not likely to meet the standards Uli has described above. I can imagine this having some good effects and some bad effects for the type industry.</p>
