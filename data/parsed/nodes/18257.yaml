      <p>Hrant has drawn to my attention that the following paragraph may convey a message very different from what I meant:</p>
      <p>'When you think about it, there is nothing more painful than for a type designer to be told, after years of work on something - - ‘this is not yours, it is mine’. It is an issue that must be addressed. And I think we are, slowly, seeing it be addressed. The attention Matthew Carter got in the New Yorker is one example. The attention that Segoe is getting is another. Something is shifting in the wind.'</p>
      <p>What I meant is that one of the good things that is happening today is the positive attention that MC got in the New Yorker profile. Equally valuable, I think, is the negative attention that the Segoe forgery (to use Uli's uncomfortable but apparently absolutely accurate terminology) is getting. Both increase the public's awareness that type is valuable intellectual property which a few people really do try to make a living from. It is not something that magically appears from nothing, as a gift from history. Probably the type industry has been guilty of an enormous amount of negligence in failing to educate the public about the difficulties of making digital type today, about the enormous strides that have been made, and more importantly, about the enormous strides the <em>remain</em> to be made. It's elementary marketing psychology: once you give people the feeling they ought to have something they don't have or that doesn't yet exist but may in the future, they want it. You're educating them into an expectation. From this point of view - basic customer education - the marketing of type in the US over the past twenty years has been unbearably inept. </p>
      <p>Anyway, Hrant feels that I was implying that there was something negative in MC's profile. Of course there isn't and I don't want anyone to think I was hinting at that. I think we are all unreservedly thrilled that Carter is getting this well-deserved attention. </p>
      <p>John, of course I knew quite well that the redesign of the Meiryo variant of Verdana was part of CT2 but I didn't count it as it was after all just a redesign of perhaps the most well-known constituent of CT1. However, you are right to remind people of this for the record. I think we would all be interested to hear more from you on the differences you speak of and would be grateful to have you post something about it, if you have the energy to start a new thread. </p>
      <p>I have one more off-topic question for Nick. OK. Fontesque was an easy birth and a slightly more difficult upbringing, but not too bad. But you were already a fairly experienced graphic artist at that point, weren't you? My last question then, would be, to what extent did years of previous training and work make it possible for it all to come out relatively fluently? Or was it just a kind of effortless gift? </p>
      <p>Oh and finally, John, I don't think that it's very rigorous to argue that Corbel would suit MS as a corporate ID font on the grounds that at the very least, it isn't a Frutiger clone. I would have thought that a corporate ID font should be designed or chosen with a really thoughtful insight into what a company is and what it wants to convey. But then, in a perverse way, Segoe does penetrate to the historical soul of MS, doesn't it? Didn't Microsoft start out roughly as follows? IBM needed an OS for the 8088-based PC. So MS bought Seattle Computer's clone of Digital Research's CP/M (the standard for 8080-based pre-IBM PCs) for $25,000. Of course, as is well known, the only reason DR lost out to MS was that DR's founder kept IBM's executives waiting for so many hours they were literally forced into MS's arms . . . . Anyway, buying a clone is nothing new for MS. On the other hand, perhaps buying a forgery is? It will be interesting to see how this all pans out. </p>
      <p>Microsoft seems to have some real difficulty dealing with the EU. Indeed, MS's difficulty in grasping the EU rather reminds me of IBM's difficulty in grasping Microsoft. IBM simply didn't have a clue, and one really must give MS credit for screwing those clueless suits again and again and again. Now, with the EU, you get the feeling that it's MS which has turned into the clueless suits. Uli keeps on harping on MS's status as a monopolist. And that of course is what IBM was so often accused of before Microsoft defanged it. Let us please remember that Microsoft deserves the credit for this historic deed! </p>
      <p>Of course it is unhealthy and ultimately deadly to progress for any company to enjoy a monopoly. But there is also a simple reality here: most of the world does not want to live with 30 different OSs, 3000 incompatible productivity apps with incompatible formats, and more incompatible documents than anyone could count this little world over. </p>
      <p>Apologies for this overlong rant. I must really not want to work on my font this week.</p>
