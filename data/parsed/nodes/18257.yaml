      <p>I was ignoring the whole one-cent per OS story because it seemed so improbable as to be irrelevant. Microsoft only ever pay a one-time fee for a font license, and everyone in the business knows that. Certainly Linotype know it because they had already licensed Frutiger to MS for the eBook reader. I don't know what the terms of that license were, but knowing that MS like to leave the door open, I would be very surprised if it didn't contain provisions for extension of the license. The strangest thing about Segoe is just how unnecessary it was <em>if MS wanted Frutiger.</em> I have little doubt that they could have had Frutiger, and it wouldn't have cost them an unreasonable amount.</p>
      <p>I think the only way to make sense of that is to consider that MS did <em>not</em> want Frutiger, and actually wanted something new and fresh and original to be the flagship typeface of their new operating system. Splendid as Frutiger is, it is a design three decades old. How do you make a marketing splash about that? No, I think MS really wanted a new typeface, and maybe the people making the decisions there thought they were getting one. That Monotype delivered a Frutiger-look-alike doesn't necessarily mean that this is what Microsoft asked for. They could have asked for nothing more controversial, or more precise, than 'a new sans serif design suitable for use as a UI font'.</p>
