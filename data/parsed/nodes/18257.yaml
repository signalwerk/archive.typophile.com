      <p>&gt; ... intent</p>
      <p>As regards Mr. Troop's interesting motivational hypotheses about the making of Segoe and Myriad, it might be also of interest for Mr. Troop to learn that in European copyright handbooks the following two psychological theories concerning "innocent" copyists are discussed by law experts:</p>
      <p>1) Cryptomnesia</p>
      <p>The term cryptomnesia (which was also contained in the old Webster's Third New International Dictionary) is defined as "the appearance of memory images, which are not recognized as such, but which appear as original creations".</p>
      <p>With regard to a hypothetical "innocent" copyist of the font Frutiger, cryptomnesia would mean that the "innocent" copyist studied and memorized the letter forms of Frutiger a long time ago, e.g. by repeatedly using this font for typesetting advertising headlines. Now much later when he starts to design a "new" font, the "innocent" copyist "automatically" draws these Frutiger letter forms from memory, because he does no longer remember that he once used and memorized the Frutiger letter forms. In other words, the "innocent" copyist thinks that he is creating "new" letter forms, while in fact he is only reproducing existing letter forms memorized long ago.</p>
      <p>Some psychologists and law experts claim that the phenomenon of cryptomnesia may happen, whereas others reject this as psychological nonsense.</p>
      <p>2) Double Creation</p>
      <p>Whereas patent law is based on the principle of priority with the consequence that two identical patents are not allowed, copyright law does not know this principle of priority. Therefore, at least theoretically, two different persons, if they do not know each other's works and provided they (completely independently from one another) both create exactly the same work, they will both become copyright owners of the same identical work.</p>
      <p>For very short and simple works, e.g. for TV and radio jingles (technically musical works consisting of a few notes only) double creation has been regarded as possible, although I do deny that. For instance, for jingles consisting of 8 tones out of 12 different musical-scale tones (c, cis, d, es ... h) there are, mathematically speaking, nearly 20 million (exactly 19,958,400) different combinations of 8-tone jingles.</p>
      <p>In any case, the German copyright law requires in the rare hypothetical cases of double creations that the "innocent" double creator proves that he really made a completely independent double creation (onus of proof).</p>
