      <p><em>I realise that by now you probably consider yourself an expert in the field, but lawyers, especially judges, often hold rather shockingly different opinions from the rest of us.</em></p>
      <p>I certainly don't consider myself an expert in any kind of law. I generally avoid legal discussions precisely because I don't think one can make reliable statements, for the reasons you cite. This is part of the reason why I queried the term forgery. Uli explains that he has deliberately chosen this word because of its legal meaning in various countries; that is, he has sought out a word with legal implications to make, I presume, the point that he considers the actions of various companies to be <em>illegal.</em> That's his prerogative, but to me it looks like begging the question: by describing the actions as forgery, he is making a legal judgement on the action and, as you point out, matters of law should be argued by lawyers and decided by judges. Uli chooses a word <em>because it has legal implications</em>, whereas I choose a word that, as you note from the OED, 'fits the bill nicely', but does not necessarily have legal implications. A difference in personality, I suspect, as much as anything else.</p>
      <p>A legal process is already underway regarding Segoe, and I think Linotype are right to take a stand on this. Over the years, Linotype seems to have been the victim of more acts of font plagiarism than any other foundry, and certainly of more blatant and financially significant plagiarism, with Bitstream and Monotype being the worst culprits. Microsoft's primary fault in all this is trusting Monotype to provide original designs. I think the trouble is that by the time these kind of things come to the attention of people who can address them, a massive software product like Vista is in code lock down, with UI font dependencies embedded in the system. At that stage, the cost of removing a font becomes prohibitively high.</p>
      <p>The obvious solution is to do a better job on examining the originality and provenance of fonts at the licensing stage. This means having, for instance, a panel of knowledgeable and experienced people who can review proposed typefaces and advise if they are uncomfortably close to other designs.</p>
      <p><em>Recklessly so, was the opinion in high places.</em></p>
      <p>I wasn't aware that there were any high places left. :)</p>
