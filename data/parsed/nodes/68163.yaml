    <p>Hey everyone, well I've got this project and I'd really appreciate your input.</p>
    <p>I'm having difficulty finding a suitable font for a men's clothing line. The name is "ALEIXANDRE KORTABERRIA"</p>
    <p>I'd really rather avoid any Didot because I think it's too common and feminine. I've included some examples of what I may be looking for below.</p>
    <p><a href="http://starworksny.com/blog/wp-content/uploads/2009/07/Alexander-Wang-Sa" title="http://starworksny.com/blog/wp-content/uploads/2009/07/Alexander-Wang-Sa">http://starworksny.com/blog/wp-content/uploads/2009/07/Alexander-Wang-Sa</a>...</p>
    <p><a href="http://blog.iso50.com/wp-content/uploads/2009/09/img014-450x82.jpg" title="http://blog.iso50.com/wp-content/uploads/2009/09/img014-450x82.jpg">http://blog.iso50.com/wp-content/uploads/2009/09/img014-450x82.jpg</a></p>
    <p>I like these sans serifs but the name I'm working with has so many letters that a plain font like that may just look boring and uninspired.</p>
    <p>Well I'm open to any suggestions you might have.</p>
    <p>Thanks in advance</p>
  html_clean: |-
    <p>Hey everyone, well I've got this project and I'd really appreciate your input.</p>
    <p>I'm having difficulty finding a suitable font for a men's clothing line. The name is "ALEIXANDRE KORTABERRIA"</p>
    <p>I'd really rather avoid any Didot because I think it's too common and feminine. I've included some examples of what I may be looking for below.</p>
    <p><a href="http://starworksny.com/blog/wp-content/uploads/2009/07/Alexander-Wang-Sa" title="http://starworksny.com/blog/wp-content/uploads/2009/07/Alexander-Wang-Sa" class="link-external">http://starworksny.com/blog/wp-content/uploads/2009/07/Alexander-Wang-Sa</a>...</p>
    <p><a href="http://blog.iso50.com/wp-content/uploads/2009/09/img014-450x82.jpg" title="http://blog.iso50.com/wp-content/uploads/2009/09/img014-450x82.jpg" class="link-external">http://blog.iso50.com/wp-content/uploads/2009/09/img014-450x82.jpg</a></p>
    <p>I like these sans serifs but the name I'm working with has so many letters that a plain font like that may just look boring and uninspired.</p>
    <p>Well I'm open to any suggestions you might have.</p>
    <p>Thanks in advance</p>
