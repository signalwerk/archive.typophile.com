      <p>With a name that long, I'd consider avoiding all caps. Initial caps will probably be more legible and distinctive. </p>
      <p>As for typefaces, have you considered slab serifs (Serifa, Rockwell, Stymie), or squarish (Eurostile, Breuer, Geogrotesque, Bank Gothic, Microgramma)?</p>
      <p>BTW, the first link is dead.</p>
