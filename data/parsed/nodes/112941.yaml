    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2014-01-21 at 14_4761.57.56.jpg"></div><p></p>
    <p>Can anyone help me with identifying this typeface pleaseeee?</p>
    <p>I have recently started a new job and I am trying to develop their Corporate Guidelines, however, no one seems to know what typeface is used in their logo!</p>
    <p>It may be based on an existing typeface and has been edited for the logotype but any help would be greatly appreciated.</p>
    <p>Thanks in advance!</p>
    <p>Sam</p>
