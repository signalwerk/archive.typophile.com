    html: <p>I don't completely get the point why it have to be this font but you could use <a class="freelinking external" href="http://www.whatfontis.com" rel="nofollow">WhatFontiS</a> to get alternatives to NatWest and if you tick the "Display only free fonts or free alternative fonts", it should give you "only free alternatives". But be careful with this online identification tool as it (sometimes) suggest illegal copies. My advice would be to run it, collect the ones you like and drop their names here and wait for an answer on their legitimacy.</p>
