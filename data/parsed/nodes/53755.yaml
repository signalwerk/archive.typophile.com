    <p>I really like the feel of the hand painted signs around the city, they just add so much character. The signs painted on the exterior of buildings tend to stay there as the city grows. Its not too often that they get erased, but they are actually embraced and not easily let go. Handwritten signs are also so unique, and you will never see a duplicate in exactly the same way anywhere else. </p>
    <p>I feel as  if these sigsn are unique to New Orleans. Many of them hang right next to each other on the tightly nit shops along the street. Space is so precious here as more and more people move into the city. They are a part of the city, part of what makes it vibrant and cultural.</p>
