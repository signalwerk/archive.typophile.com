    <p></p><div class="imageWrap"><img src="http://typophile.com/files/barber_4874.jpg"></div><br>
    I know this picture is a bit skewed, but in my defense I was afraid to get out of my car...or stop, so this picture was taken while in motion.<br>
    <div class="imageWrap"><img src="http://typophile.com/files/3315B_5887.jpg"></div><br>
    This reminded me of the exercises that we had to do in class.<br>
    <div class="imageWrap"><img src="http://typophile.com/files/breaux_5096.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/bulldog_6617.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/music_3523.jpg"></div><br>
    Again blurred, and again it was night and I was not stopping, but I really like this sign and hope to get a better image of it. So to make up for this I put up 6 pictures :)<br>
    <div class="imageWrap"><img src="http://typophile.com/files/nachos_6012.jpg"></div><p></p>
    <p>I really like the feel of the hand painted signs around the city, they just add so much character. The signs painted on the exterior of buildings tend to stay there as the city grows. Its not too often that they get erased, but they are actually embraced and not easily let go. Handwritten signs are also so unique, and you will never see a duplicate in exactly the same way anywhere else. </p>
    <p>I feel as  if these sigsn are unique to New Orleans. Many of them hang right next to each other on the tightly nit shops along the street. Space is so precious here as more and more people move into the city. They are a part of the city, part of what makes it vibrant and cultural.</p>
