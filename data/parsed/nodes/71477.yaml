    date: 2010-06-18T10:47:00
    date_raw: 18 Jun 2010 — 10:47am
    votes: null
    html: |-
      <p>Try the Contextual Alternates 'calt' feature.</p>
      <p>First, I suggest you make all the default characters right feet glyphs, so that regardless of whether the user types upper or lowercase characters the text always begins on a right foot. Then make a 'calt' contextual lookup that replaces a right foot glyph with a left foot glyph when preceded by a right foot.</p>
      <p>You need to think about what you want to happen across wordspace boundaries. Using L and R as foot indicators, do you want</p>
      <p>RLRLR LRLRL RLRLR...</p>
      <p>or</p>
      <p>RLRLR RLRLR RLRLR...</p>
      <p>If you want the first option, then your contextual substitution needs to have two contexts: when preceded by right foot and when preceded by right foot + space.</p>
