  html: |-
    <p>I created a font for a school assignment a while ago, and I'm having a little trouble with Open-Type in order to make it work properly.see the font here: <a href="http://www.behance.net/gallery/Shoelace-Typefeet/465085" title="http://www.behance.net/gallery/Shoelace-Typefeet/465085">http://www.behance.net/gallery/Shoelace-Typefeet/465085</a><br>
    Since the typeface uses shoes as characters, I needed it to be like this:<br>
    Right foot, Left foot,Right foot, Left foot,Right foot, Left foot,</p>
    <p>At first I just put all the right feet in uppercase glyphs and left feet in lowercase glyphs, so you needed to type ThIs WaY to make it work (not the best solution, but I had a tight deadline). Now I am trying to find an open-type solution to make it look right regardless of how you write, but I'm not sure about which open-type feature I should use.<br>
    I am a bit of a noob at Font Lab, so any help would be appreciated.<br>
    (and sorry if my english is a bit confusing)</p>
    <p>Thanks a lot!</p>
