      <p>So, let me see if I got it:</p>
      <p>1-Put Right Foot (R) on all regular glyphs<br>
      2-Create alternate glyphs (calt) for every regular glyph with the Left Foot (L) in it<br>
      3-Add a rule to replace RR by RL</p>
      <p>Is that it?</p>
