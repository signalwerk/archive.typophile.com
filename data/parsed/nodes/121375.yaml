  html: |-
    <p>I saw a 40th anniversary title card for Saturday Night Live on the Hulu website today, and I couldn't figure out which condensed (or compressed) industrial typeface it is. It's not quite Knockout from Hoefler &amp; Co. or Helvetica Ultra Compressed. The telltale letters are "S," "A," "R," and "G."</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/snl-40_5952.jpg"></div><p></p>
