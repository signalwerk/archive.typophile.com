    <div class="info">Submitted by <a href="/web/20080906232137/http://typophile.com/user/108" title="View user profile.">Miss Tiffany</a> : 5.Jul.2005 8.35am </div>
      <p>——————————<br>
    P22 is pleased to announce the latest selection of fonts from Lanston Type<br>
    Company. These designs compliment the existing selection and feature a few<br>
    brand new releases.</p>
    <p>The following titles are being offered to those on the P22 mailing list at a<br>
    special 25% off for the month of July. To get 25% off regular prices on<br>
    these titles Enter the code: JULY05 into the “pricing category” field in the<br>
    online shopping cart.</p>
    <p>——————————<br>
    NEW TITLES AVAILABLE</p>
    <p>LTC Caslon - a new rendering of this famous face based on the Lanston<br>
    versions most accurately attributed to the original Caslon. This 12 font<br>
    family includes long and short descenders, Swash Italics, small caps and a<br>
    full range of western and central European characters. LTC Caslon also<br>
    includes 8 open type versions<br>
    <a href="https://web.archive.org/web/20080906232137/http://www.p22.com/lanston/products/caslon.html" title="http://www.p22.com/lanston/products/caslon.html">http://www.p22.com/lanston/products/caslon.html</a></p>
    <p>LTC Hadriano - Another familiar face but now with the first ever release of<br>
    the original rare lower case as designed by Fredric Goudy.<br>
    <a href="https://web.archive.org/web/20080906232137/http://www.p22.com/lanston/products/hadriano.html" title="http://www.p22.com/lanston/products/hadriano.html">http://www.p22.com/lanston/products/hadriano.ht<!--
