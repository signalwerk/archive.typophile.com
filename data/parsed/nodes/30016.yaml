  html: |-
    <p>I want to import and side bearings from a base font, and apply those bearings to a variant version. I tried generating the font as PS1 and then used the file/import/metrics path to import an afm and apply it. But it doesn’t seem to change side bearings to those of the base font. What am I doing wrong?</p>
