    html: <p>With regard to the logo, I'd make the whole darn thing shorter. Normal houses aren't that tall relative to their width, and excepting a ski chalet, you won't see that acute pitch on a real roof. <br> <br>What if you used a 'real' lc M from the same face as the caption line, and suggested houses in the negative space with a door, knob, and window? You'll have more unity in the design and it might be more obvious that the spaces are houses. <br> <br>As for the logo text itself, using all-lc in black and ocean blue is reminiscent of AT&amp;T's mmode/mlife thing. What about normal capitalization</p>
