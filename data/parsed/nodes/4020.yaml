    html: '<p>I made some changes to the design <br> <br>1.) I raised the house-shaped counters higher to reduce any optical weight at the top. <br> <br>2.) The "doorknobs" have been reduced in size yet still maintain its intended impact <br> <br>3.) The typeface size has been increased dramatically to balance out the two forms. <br> <br>Q.) How does one feel about the way I positioned the typography? <br> <br>-Frank <br> <br> <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/32310.gif" alt="id: the mplace"></p>'
