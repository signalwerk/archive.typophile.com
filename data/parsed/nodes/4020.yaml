    html: <p>Never use quotes in a tagline. There's no reason to do so and, if anything, hints at it being not literal. (BTW, that is a poor tagline...it's way too generic to really have any weight.) <br> <br>I agree with Kyle. It's hard to look at the micro until the macro issue of scale and balance is addressed. I'd suggest leaving the type as-is and shrink the logo down to 10/20% of its current size. <br></p>
