  html: <p>This is a recent identity project I am doing for a client.  Rather than leaving it at default, I adjusted the kerning until it looked to my satisfaction.  I just wanted to get some feedback from this forum, since most design forums focus more on layout and the macro-aesthetics and I am trying to fine tune the micro. <br> <br>btw, this identity is for a mortgage company <br>-Frank <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/32285.gif" alt=""></p>
