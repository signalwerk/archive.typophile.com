    html: <p>Hey I almost forgot about this post...I just wanted to thank everybody for commenting and giving their two cents. <br> <br>Well the client liked one of my latest incarnations and thus the project is finished... <br> <br>(In hindsight I think I should have posted the logo at a smaller size so one could gage the macro-aesthetic character...it seemed like everybody was looking at it realll close and only then would different interpretations come up...at work when I had printed out the piece in regular/smaller size, there seemed to be no confusion....) <br> <br>Again, thanks for all the help and feedback <br> <br>-Frank</p>
