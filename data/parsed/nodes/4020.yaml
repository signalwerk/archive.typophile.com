    html: <p>Silos... The blue shapes have to be something. <br> <br>IF you make a house out of negative space, I am going to want to make the positive shape into something too. I made it a silo. <br> <br>I came into this discussion late, so excuse me if I am repeating. <br> <br>The houses are very elongated. Are you trying too hard to force the houses into an M? <br> <br>If you put a rectangle on the house, I would instantly know its a door. If you put a dot, it could be an eye, as many have said. If you put a dot on a door, it would be a doorknob. <br> <br> <br></p>
