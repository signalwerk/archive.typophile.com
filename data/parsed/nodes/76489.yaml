      <p>Now that the argument has settled, I will mention something that surprised me a bit. I was doing some web searches concerning the Mikra'ot Gedolot, that is, the Tanakh together with its major commentaries.</p>
      <p>There was a web result for the Haketer Mikraot published in Israel, which, among other departures with tradition, is using a conventional typeface instead of a Rashi typeface for the commentaries, trusting that a smaller type size is enough so that readers can tell which is which.</p>
      <p>In the United States, the Jewish Publication Society it producing "The Commentators' Bible", as the first of its kind, something that I would have thought would have been done long ago. But perhaps I misunderstood.</p>
      <p>What I thought someone would have done long ago is prepared an edition of the Mikra'ot Gedolot in which the Tanakh itself remained, as in any other edition, in the original Hebrew with vowel points - but the Targums, the commentaries, would all be translated from Aramaic, whether into Yiddish or into English. (I didn't look carefully at the result for The Commentators' Bible to find out if it also contained the Tanakh only in an English translation: EDIT - I have checked now; it includes the Hebrew text flanked by their own two English translations).</p>
      <p>Also, since some parts of Daniel are in Aramaic rather than Hebrew, which is why Christians have reference books with titles like "A Hebrew and Chaldee Lexicon of the Old Testament", Aramaic being known as Chaldaean as well as Syriac, it may be that I am underestimating the level of knowledge of Aramaic in the Jewish community (but none of the Torah is in Aramaic, and that is what is used in the <em>bar mitzvah</em>...).</p>
      <p>After all, not avoiding the sages and commentators is surely asked of all the faithful, not merely those who minister to them.</p>
