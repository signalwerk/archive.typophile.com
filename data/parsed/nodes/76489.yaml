      <p>The famous treatise is Kitab al-Khlif: hillufim, differences between ben Naphtali &amp; ben Asher.<br>
      The hillufim refer mainly to the placing of raphe &amp; dagesh; in some cases to the vocalization &amp; ta'amim; the placing of the ga'ya.  The differences between ben Naphtali &amp; ben Asher were only of minor significance!!!  They agreed in many things.<br>
      ben Uzziel, the author of   Kitab al-Khlif, does not mention whose reading deserves priority. For example, he wrote:</p>
      <p>אמא אן יקרא קראה בן נפתלי פילזמה אן יקרא מן<br>
      מסתחסנאת ומסתתקלאת. ואמא אן יקרא קראה בן אשר ודלך איצא חכמה........</p>
      <p>If he [the reader] follows the reading of ben Naphtali, it obligates him to read all of them with raphe and dagesh as he, ben Naphtali, does. If he, however, follows the reading of ben Asher, then it is also correct....</p>
      <p>A sample, MS:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/BA-BN2_4826.jpg"></div><p></p>
