      <p>John S., Raphael,</p>
      <p>If I may summarize:</p>
      <p>There are four typefaces by Masterfont.<br>
      1. Koreen - in Regular and Bold<br>
      2. Koren - exactly the same as Koreen Regular, but the hei is wider in Koreen, perhaps others, perhaps none at all<br>
      3. Koren Tanakh - exactly the same as Koreen Bold</p>
      <p>There are two typefaces by Guttman, somewhat like Koreen Regular and Bold, or Koren and Koren Tanakh. Guttman's typefaces have many design differences than those by Eliyahu Koren and Masterfont, perceived by many as improvements to the original designs.</p>
      <p>When John Baskerville tried to improve upon William Caslon's design, and later a whole slew resulted. Did Caslon's descendants sue Baskerville for creating an "improvement" or "annoyed" version of Caslon's original work? </p>
      <p>After Goudy made Garamond, based upon others typeface designs before him, did Goudy's descendants sue about the various versions of Garamond?</p>
      <p>Perhaps, the same applies to Paul Renner's Futura versus Linotype's version, called Spartan - I haven't compared them. </p>
      <p>How is this Koren (aka Koreen) versus Keren issue anything different?</p>
      <p>Ethical issues? How was Baskerville's work ethical? How were Goudy's successors ethical? How is Monotype's (Boruch Gorkin) Arial-Hebrew ethical? etc. etc.</p>
      <p>Ethical in my view pertains to ethics, not creativity.</p>
      <p>In the State of Israel, there is law against incitement, which in the United States we would insist that Israel's law against incitement violates 1st Amendment rights of Freedom of Speech. </p>
      <p>Perhaps, in Israel we need such a law against incitement, because of volatility of that region. But it is misused.</p>
      <p>But, really isn't the same: such a law against incitement stifles freedom of speech, just as the Israeli typeface design rights stifle creativity in typeface design?</p>
