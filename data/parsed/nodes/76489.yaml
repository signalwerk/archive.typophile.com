      <p>There is a distinction as to how a person should learn Torah and how it should be printed. For example, originally, when the Torah was taught (before there were books), a Sefer Torah would be brought down do the lecture hall and Torah was taught. Obviously, in the holy scroll, there were no commentaries written, but just the 5 books of Moses.</p>
      <p>Today, a wide variety of different sources are available to be learned and not all of them can fit into one volume. For this reason, it is traditional to own a Tanakh WITH NO COMMENTARY and then this can be used either as a base text or as a reference. For example, the Talmud scholar may want to look up a quoted text to see the context that the Talmud is trying to explain from that one fragment.</p>
      <p>We at Koren have a very nice project underway (details will be available in about 5.5 years hopefully) which will provide a very compelling volume, but for that Talmud scholar, he won't want a huge volume to look up one pasuk.</p>
      <p>I find in my work at Koren, that I'm constantly referencing the Tanakh. I like to use a large volume (fortunately we have lots at my work :-) ), but I just need the pasuk, not the Rashi or the Onkelus or anything else.</p>
      <p>It should also be noted that in Israel where learning Tanakh is compulsory for all students, that a Tanakh with any sort of commentary is not allowed. Also in the Haredi (not an "e" but an "a") cheder system, they teach the kids with a separate volume for Torah and then different volumes for the various mefarshim. It's their system of learning which is NOT the same as the general Israeli curriculum. I know you don't believe me, but it's still true nevertheless :-)</p>
