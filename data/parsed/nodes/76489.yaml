      <p>What has me confused is this quotation: "If he [the reader] follows the reading of ben Naphtali, it obligates him to read all of them with raphe and dagesh as he, ben Naphtali, does." I would have thought that if we're talking about rules for placing vowel points and accents, it doesn't matter <strong>what</strong> rules the reader prefers, if he is reading something written by a follower of ben Napthali's rules, he should interpret the points according to those rules, and if he is reading something written by a follower of ben Asher's rules, the pointing should be read according to those rules - because the goal, when reading a text, is to arrive at the vocalization of that text which was intended by the scribe.</p>
      <p>Which can, of course, be accepted or rejected as an accurate depiction of the vocalization intended by the <em>author</em> depending on which school of <em>textual criticism</em> one follows. But one doesn't try applying a set of vowel pointing rules to a written text which don't match the ones it was written with.</p>
      <p>I would have thought that this would be obvious even to people who didn't look at things with the "modern perspective".</p>
