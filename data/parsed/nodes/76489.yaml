      <p>It looked to me like many of the specific changes you pointed out in "Shmuel Guttman - the Type Designer Down to the Small Details" were of the form of reintroducing elements found in a classic Hebrew typeface to a sans-serif (like Miriam) or a lapidary (like Koren) to which those elements didn't necessarily belong naturally.</p>
      <p>I'm not trying to criticize him, though. My point was that your posts in that thread indicated to me that you were looking at type designers purely from the point of view of being "craftsmen" and not "artists".</p>
      <p>I chose Picasso, Jackson Pollock, and Piet Mondrian as my examples of "artists" with malice aforethought - I was trying to avoid having to explain a bunch of context here.</p>
      <p>Basically, an "artist" might do something as trivial as squirting paint on a canvas - but he might be temperamental and egotistical, even so, and seek the glory for himself as a creator.</p>
      <p>A "craftsman", on the other hand, patiently toils in a humble fashion - and leaves the glory for the Creator.</p>
      <p>Given your view, expressed in yet another thread, that the Hebrew square script is of Divine origin, it seems to me that you may be inclined to view the appropriate role of a designer of typefaces for the Hebrew language as that of a craftsman to the exclusion of that of an artist.</p>
      <p>As a result, I think that there may not have been a clear understanding on your part of why some people have taken issue with some of your statements, and this has led to a needless exchange of harsh words that could be avoided with better understanding on both sides of how the other person is thinking.</p>
