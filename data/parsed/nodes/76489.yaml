      <p>Guttman's Keren vs JNF's Koren used by KPJ</p>
      <p>David,</p>
      <p>Besides introducing new dimensions to all letters, Shmuel Guttmann also created a new lamed, which is graphically correct, and a new ayin, to allow better placement of diacritic marks, as shown above, and demonstrated again below.</p>
      <p>Here, Guttmann raised the lower vertical bar on the left side, to allow better placement of diacritic marks.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ayins3_3554.jpg"></div><p></p>
      <p>Here, Guttman added a notch on the end of the lower vertical bar, creating better balance and adhering to a principle taught in art school.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/lameds3_6731.jpg"></div><p></p>
      <p>In the context or a comparison of words, see this example.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/sample_ayin_lamed_4539.jpg"></div><p></p>
