      <p>Significance of a Large Graphic Element at the Top of an Image and a Smaller Graphic Element at the Bottom of an Image</p>
      <p>The eye of every viewer moves from top to bottom. This is known as "eye movement". It starts naturally at the top of an image, and moves down to the bottom of the image. Without an unusual additional graphic image at the bottom of the image, the artist risks losing the viewers interest before they reach the the bottom of the image. This is a basic concept taught in art school. Guttmann applied it to the graphic form of the lamed; Koren did not.</p>
      <p>If we look in very old Hebrew manuscripts, early scribes failed to include this feature, because of either the nature of scribal arts, or because the issue of expedience. Yet, we see in all later letter form designs, type designers included this feature. The only exceptions to these rules are sans serif mono-lined letter-forms, like those of Tzvi Narkiss.</p>
