      <p>I have found a Hebrew manuscript the writing in which suggests some features of Koren. It is... somewhat "hidden in plain sight". I may have noted it in passing, while looking about for a closer match.</p>
      <p>The Aleppo Codex.</p>
      <p>I agree that Shmuel Guttman's Keren has features which are not present in Koren. But even if I preferred that typeface because of those features, I would be very hesitant in characterizing those features as "design improvements", or otherwise implying that they made the face <em>objectively better</em>.</p>
      <p>To me, that seems like pointing at the letter "h" in Times Roman, indicating the serifs, and comparing it with Helvetica, and then concluding that Times Roman is much better than Helvetica, because the people who designed Helvetica left out this important feature.</p>
      <p>Yes, Koren is missing features you would find in Drugulin or Frank-Ruehl. But that was an intentional result of the kind of typeface it was intended to be. Keren was perhaps less daring, and put back subtle vestiges of the more conventional faces. That doesn't seem to be a design mistake <em>either</em> way, but a matter of taste in both cases.</p>
