      <p>If I understand correctly your words, John S., and those implied by David, the content of the manuscript is about the different approaches of ben Asher and ben Naftali, and were scribed by the sample person, Mishael ben Uzziel, who is the author as well.</p>
      <p>These two manuscripts,  Kitab al-Khlif and Kitab al-Halaf, are not visual examples of the handwriting of ben Asher and ben Naftali. This does not concern us. Rather, they have descriptions of their different approaches. These descriptions then define for use the differences between ben Asher and ben Naftali.</p>
      <p>Davis says that these differences between ben Asher and ben Naftali are minor.</p>
      <p>David wrote:<br>
      "The hillufim refer mainly to the placing of raphe &amp; dagesh; in some cases to the vocalization &amp; ta'amim; the placing of the ga'ya. The differences between ben Naphtali &amp; ben Asher were only of minor significance!!! They agreed in many things.<br>
      ben Uzziel, the author of Kitab al-Khlif, does not mention whose reading deserves priority." </p>
      <p>ben Uzziel had no preference to either one's approach, said David. Though Saadia Gaon preferred ben Naftali.</p>
      <p>Futher, only some scholars believe that ben Asher was a Karaite. Hence, Saadia Gaon objection to ben Asher's approach may regard a technical issue, and not because he viewed him as a Karaite, which he likely did not.</p>
      <p>Is this correct?</p>
