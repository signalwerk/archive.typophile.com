      <p>Thank you for your comments and observations. They are always thoughtful and reflect much perception.</p>
      <p>I am curious about which document you found, and why it is "hidden in plain sight". Are you referring to the Aleppo Codex, found at <a href="http://www.aleppocodex.org/aleppocodex.html" title="http://www.aleppocodex.org/aleppocodex.html">http://www.aleppocodex.org/aleppocodex.html</a>.</p>
