      <p>GoHebrew: I haven't been able to find anything out about the circumstances surrounding Shmuel Guttman's type design work to know what, if any, issues there may actually be as regards licensing. Apparently, he worked for a software company, Galiad Computers, in Jerusalem.</p>
      <p>But the evidence you have shown of his craftsmanship in his versions of Miriam and David and Frank-Ruehl, in addition to Keren, is of such a nature that, while it supports your praise of him for good craftsmanship, could also make a case for him engaging in bad art.</p>
      <p>Making a new typeface that is similar to an old one, but better, is of course entirely legitimate; as you point out, Baskerville, as a roman type of its period, shares a lot with Caslon, but it was an attempt at an improvement. Still, though, Baskerville is a different typeface from start to finish from Caslon - it has a "feel" all its own.</p>
      <p>Here, we are talking about faces that are intended as replacements for existing designs, but which comply with Israeli law, which gives more protection for typeface designs than American law, by having changes to several characters - changes that tend to go in the direction of returning subtleties from classic typefaces (i.e. the Siddur typefaces) back into the face.</p>
      <p>If one views a typeface designer as primarily a craftsman working on how best to express the pre-existing alphabet in a typeface, there is nothing problematic.</p>
      <p>If, however, one views a typeface designer as a creative artist - in the same sense that Pablo Picasso, Jackson Pollock, and Piet Mondrian are viewed as creative artists - then from that point of view, taking more than inspiration, but closely following the outlines in one's own drawing, so that the result feels like the "same" face, but making little improvements of such a nature as to go directly against the creative vision embodied in the face... is something that is generally disapproved of strongly from that standpoint.</p>
      <p>Salvador Dali painting a moustache on a reproduction of the Mona Lisa made sense in the context of surrealism, but in general that is considered disrespectful to an artist's "moral rights". I could be mistaken in thinking this is really the case for Shmuel Guttman's work, but I have to note that the very facts you cite in his praise at least <em>appear</em> to hint towards such an indictment of him.</p>
      <p>Someone else, with considerably more knowledge of these matters than I, would have to comment one way or another, though, as to whether this creative issue of which I am apprehensive is actually present.</p>
      <p>RaphaelFreeman: Oh, I think you should not make Koren MF unavailable, but perhaps you should change its name back to Koreen MF to get rid of the confusion! (Unfortunately, that might cause new confusion when people buy Koren Tanakh as an exact replacement for Koren MF by mistake.)</p>
    html_clean: |-
      <p>GoHebrew: I haven't been able to find anything out about the circumstances surrounding Shmuel Guttman's type design work to know what, if any, issues there may actually be as regards licensing. Apparently, he worked for a software company, Galiad Computers, in Jerusalem.</p>
      <p>But the evidence you have shown of his craftsmanship in his versions of Miriam and David and Frank-Ruehl, in addition to Keren, is of such a nature that, while it supports your praise of him for good craftsmanship, could also make a case for him engaging in bad art.</p>
      <p>Making a new typeface that is similar to an old one, but better, is of course entirely legitimate; as you point out, Baskerville, as a roman type of its period, shares a lot with Caslon, but it was an attempt at an improvement. Still, though, Baskerville is a different typeface from start to finish from Caslon - it has a "feel" all its own.</p>
      <p>Here, we are talking about faces that are intended as replacements for existing designs, but which comply with Israeli law, which gives more protection for typeface designs than American law, by having changes to several characters - changes that tend to go in the direction of returning subtleties from classic typefaces (i.e. the Siddur typefaces) back into the face.</p>
      <p>If one views a typeface designer as primarily a craftsman working on how best to express the pre-existing alphabet in a typeface, there is nothing problematic.</p>
      <p>If, however, one views a typeface designer as a creative artist - in the same sense that Pablo Picasso, Jackson Pollock, and Piet Mondrian are viewed as creative artists - then from that point of view, taking more than inspiration, but closely following the outlines in one's own drawing, so that the result feels like the "same" face, but making little improvements of such a nature as to go directly against the creative vision embodied in the face... is something that is generally disapproved of strongly from that standpoint.</p>
      <p>Salvador Dali painting a moustache on a reproduction of the Mona Lisa made sense in the context of surrealism, but in general that is considered disrespectful to an artist's "moral rights". I could be mistaken in thinking this is really the case for Shmuel Guttman's work, but I have to note that the very facts you cite in his praise at least <em>appear</em> to hint towards such an indictment of him.</p>
      <p>Someone else, with considerably more knowledge of these matters than I, would have to comment one way or another, though, as to whether this creative issue of which I am apprehensive is actually present.</p>
      <p>RaphaelFreeman: Oh, I think you should not make Koren MF unavailable, but perhaps you should change its name back to Koreen MF to get rid of the confusion! (Unfortunately, that might cause new confusion when people buy Koren Tanakh as an exact replacement for Koren MF by mistake.)</p>
