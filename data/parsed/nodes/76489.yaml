    <p>Eliyahu Korngold, later Koren, was considered one of the greatest Hebrew type designers during the mid 20th century.</p>
    <p>Koren's landmark work, named after his Israelized surname, was initially created in the 1950s. The design was based upon a hand-written document of the section of the Prophets, attributed to the Moshe ben Asher geneza, of scrolls belonging to the Karaite community, a pariah sect to normative Judaism.</p>
    <p>This design was drawn and redrawn many times, both before and after his employment by the Koren Publishers Jerusalem Ltd., which he founded in 1961. Koren spent most of his career at the Jewish National Fund, where most of this typeface design was created, under the JNF's auspices.</p>
    <p>The design was finally used in the Koren Bible in 1962, but was never created as an outline typeface. Koren printed his siddur in 1981 at the age of 74. Instead, a digital type company in Israel used its software code for two products: the Koren Bible typeface, and its own identical typeface. Later, the Israeli company called 'Koreen' (and widened one letter). Koren approved the design.</p>
    <p>Shmuel Guttman created another typeface, called 'Keren', in digital form in 1993, prior to the Koren Bible digital typeface. His typeface features many significant differences, but maintains the basic look-and-feel of the Koren Bible design. Koren never approved Guttman's design.</p>
    <p>I also created a set of typeface software, which I called 'Crown'. They are based upon large drawings created by an unnamed talented graphic artist, perhaps from the former USSR. The software was created in the United States, where it was registered for US Copyright at the Library of Congress in Washington, DC, in 1989. My design is based upon ancient manuscripts as well, and modified to comply with the various instructions, as expressed in <a href="http://en.wikipedia.org/wiki/Eliyahu_Koren" title="http://en.wikipedia.org/wiki/Eliyahu_Koren">http://en.wikipedia.org/wiki/Eliyahu_Koren</a>, regarding legibility and readability.</p>
