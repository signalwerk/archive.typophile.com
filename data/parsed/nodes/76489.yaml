      <p>I am going to quote a couple of Rabbis that perhaps will allay any halakhic concerns.</p>
      <p>"To my rabbincal colleagues and students throughout the world,<br>
      I hereby recommend the publications of Eliyahu Koren, who has performed a great service in publishing the Holy Scriptures according to Jewish tradition, with careful regard for accuracy in spelling, vowels and accentuation, open and closed Portions, and the like.<br>
      I call upon my friends and students to assist the representatives of Koren Publishers Jerusalem by distributing the Tanakh in synagogues and Batei Midrash, in schools and in private homes. This crucial initiative is worthy of our added encouragement and assistance.<br>
      "...and joyous are those who hold her fast!"<br>
      Respectfully, Joseph B. Soloveitchik, Thursday, 26 Tammuz, 5726</p>
      <p>And if The Rav isn't enough for you, here's Rav Moshe Feinstein on the Koren Bible:</p>
      <p>"I have just viewed the full Koren Bible printed in Jerusalem. I was impressed by the great meticulousness with which the parshiyot in Prophets and Ketuvim are distributed, according to traditoin and the Talmud. The Book of Prophets, too, is divided into parshiyot as well as sdarim symbols which have never been printed until this day. In addition, Koren's editors were very scrupulous regarding vowels and vocalization (taamey mikra), pleasing to the eyes of the great Rabbis of Israel. I consider it of great importance that every Jewish home possesses this comprehensive Tanakh... Most Tanakhim include mistakes and typographic error which may have become embedded in many editions. Yet the Koren Tanakh is well proofread and very reliable, as testified by its users. Therefore it is advisable that such a Tanakh be found in every house as well as each synagogue and Beit Midrash, all the more since it was printed by a Jewish concern.<br>
      26th of Tevvet, 5726, New York.</p>
      <p>For those who are not familiar with the Jewish world, these two Rabbis, Rabbi Soloveitchic and Rabbi Feinstein represent two of the greatest halakhic authorities of the 20th century in the United States and perhaps in the entire world. (There are of course others)</p>
      <p>To my knowledge, no other Bible has ever received such praise and in such a manner.</p>
