      <p><cite>E. Koren seems the unlikely designer of the Koren type design. If it were totally new, why did he not create others afterwards? But if it was a refinement, improvement, of an ancient design, the question disappears.</cite></p>
      <p>Firstly, who said he didn't create other type designs other than the Koren Tanakh font? Just for the public record, he created the Koren Tanakh and the Koren Siddur font both of which are digitised and available. He created no few than 3 Rashi fonts, one of which is currently being digitised and he created a sans serif font. He also did work on other faces, but they are no more than a few letters here and there.</p>
      <p>Secondly, E. Koren wasn't just a font designer. His ambition was to create a Bible, he cared as much about the letter, the page and the paper it was printed on. It wasn't just a work of creating a typeface, but the whole finished product.</p>
      <p>His siddur that he made in the early '80s wasn't just about a typeface, but about how to pray. The fact that he designed typefaces is primary to this forum, but secondary to his life work. He spent many more years making sure that the Tanakh was perfect from a nusach point of view than on the typeface itself. </p>
      <p>So you must not think of him of just a type designer and then that answers your question as to why he didn't spend his life design 100s of typefaces.</p>
