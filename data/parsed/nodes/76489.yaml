      <p>I don't have specific examples: I have seen intense exchanges in these discussions, and I simply had a sense that part of the cause might be that the parties to the discussion were arguing from different premises, and thus failing to see one another's point of view.</p>
      <p>As you point out, it is appropriate for those involved in type design to be both artists and craftsmen. Because, though, the "artist" role can degenerate into that of the <em>poseur</em>, because the "craftsman" role leaves less room for the individual's ego, that it appeared to me that the latter role might seem more appropriate when one is working on sacred ground. </p>
      <p>Which was reasonable in itself, but since the exchanges here concerned issues of what makes a design original, issues of defining respect for intellectual property, I had suspected, perhaps wrongly, that if both sides had opposing visions of the type designer's proper role, they might also have different visions of the boundaries of the designer's rights.</p>
      <p>It doesn't help, either, that apparently Israeli law is the exact opposite of U.S. law when it comes to creating typefaces! In the U.S., type designs historically (this has recently changed) had no protection, but the trademark on the name of the face was protected. In two of your examples, we see that the design was significantly changed - but the results could still be called GuttmanDavid or GuttmanMiriam.</p>
      <p>Given this, I'm not sure <em>what</em> is considered acceptable in Israel as homage versus plagiarism, since attitudes on what is acceptable are often influenced by what is legal.</p>
