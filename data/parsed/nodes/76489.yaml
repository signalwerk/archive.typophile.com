      <p>I have been poking around on the Internet to get some background to this.</p>
      <p>One reference noted that a distinctive feature of the Haredim is that unlike more secular but still believing Jews, they place the Oral Law, the Mishnah and the Talmud which contains the Mishnah and commentaries on it, in a central role, as containing the authoritative interpretation of the Written Law.</p>
      <p>When it comes to a Tanakh with commentary, though, it isn't the Talmud, or even the Mishnah that is in the margins; instead, it is the Targums that are in the margins.</p>
      <p>The Talmud notes that only Targum Onkelos and Targum Jonathen ben Uzziel are authoritative. But the Rabbinic Bible, and similar works, also include other Targums as well.</p>
      <p>Of course, Wikipedia may be misleading; it seems to use a different definition of Haredim, which lumps the Hasidim in as a kind of Haredim.</p>
