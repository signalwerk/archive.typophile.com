      <p>We agree to disagree abput whether Shmuel Gutmann's contributions to Keren, a derivative work of Eliyahu Koren's Koren, were in deed "design improvements".</p>
      <p>Clear, in my opinion, they are not comparable to the differences in Times-Roman and in Helvetica, for they are not radical, but very subtle.</p>
      <p>As David pointed out, the dimensions of Keren are better suiting to typesetting that those of Koren. Remember, Koren worked from sketches of hand-scribed letters of ancient documents; they were not typeset documents.</p>
      <p>As I pointed out, the letter forms feature minor details that enhance the letter forms and are in tune with good rules of graphic design from any proper art school. Eliyahu Koren was not interested in enhancing the shapes of the Koren letter form, or adhering to good rules of graphic design from any proper art school. He want to recreate an ancient design for modern typesetting of the Bible.</p>
      <p>In my view, his creation is either the property of his first employee, the Jewish National Fund, under whom he created most of what we know as Koren, or to his direct descendants - according to Jewish law only. Yet, since the JNF has clearly forfeited its rights, the rights to the Koren design are in the public domain, as it the text of the Bible. </p>
      <p>Certainly, Shmuel Gutmann's design enhancements are significant enough to render his version, called Keren, a creative work, just as Goudy's Garamond has been usurped by Adobe Garamond for the latter's creative work.</p>
