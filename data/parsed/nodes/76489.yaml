      <p>Without asking my experts, I recall as a yeshiva bachur young man in rabbinical studies that it was forbidden to study either a Biblical text by itself, or even the main body of the Talmud, known as the Gemara.</p>
      <p>For example, Shir HaShirim by King Solomon is, according to Rashi, a beautiful dialogue between G-d and His People. Yet, without a commentary, it could be understood a mere love song between a man and a woman.</p>
      <p>Similarly, the surface meaning of words is deceiving. In the case of King David's affair with Batsheva, many non-Orthodox Jewish people insist that this episodes shows that King David sinned.</p>
      <p>Yet, the Talmud argues that this isn't so. "Anyone who says that David sinned is mistaken", says the Talmud.</p>
      <p>In fact, Psalm 51 was included in "Seder Kriat Shmah Al HaMitah", "the prayers to recited before going to bed", in order to guide us to do teshuva.</p>
      <p>This is why Scripture with Commentary is misleading.</p>
