      <p>Every Bible is <a href="http://www.aleppocodex.org/links/8.html" rel="nofollow">Ben Asher</a> :</p>
      <p>"Aharon Ben Moshe Ben Asher was the Masorete and vocalizer of the Aleppo Codex, as stated in the dedication of the manuscript, which was written several decades after his death: This is the complete codex of the twenty-four books, written by our teacher the rabbi Shlomo known as Ben Boya’a the swift scribe, and the spirit of the Lord guided him, and it was vocalized and transmitted with great meticulousness by the great scholar and wise sage, the lord of scribes and the father of sages, the chief of scholars, swift in his deeds, whose understanding of the work was unique in his generation, master Rabbi Aharon the son of master Rabbi Asher, may his soul be bound in life with the prophets and righteous and pious.</p>
      <p>For generations the name Ben Asher signified the most precise and reliable text of the Bible, and many Masoretes and printers sought to emulate the text he had established. Here are the words of Rabbi Menahem De Lonzano of the sixteenth century in the beginning of his book, “The Light of the Torah”: And all the Jews in those lands relied upon the reading of Ben Asher, as though a divine voice had proclaimed: “Ben Asher and Ben Naphtali – the Halakhah is according to Ben Asher.” In the nineteenth century, certain scholars suggested that Aharon Ben Asher might have been a Karaite and not a rabbinic Jew. Aharon Dothan has examined this issue from many angles, and his conclusion is that Ben Asher was a rabbinic Jew. Recently, Raphael Zer has raised this issue again and presented new evidence."</p>
