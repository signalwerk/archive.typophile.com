      <p>@raphaelfreeman: After your most recent post, I think I understand you now, even though your previous post had me confused.</p>
      <p>Masterfont sells two products including Koren in their names. One is "Koren MF", and the other is "Koren Tanakh".</p>
      <p>"Koren MF" is just Koreen, which is similar to Koren, but which differs because a couple of letters are wider.</p>
      <p>"Koren Tanakh" is, however the real original typeface designed by Eliyahu Koren.</p>
      <p>I hope I understand you correctly now.</p>
      <p>Meanwhile, "Keren" is the name of a sans-serif typeface, and the Keren being discussed here is sold as GuttmanKeren, and was bundled along with other faces by Shmuel Guttman with some applications for preparing Hebrew documents, such as DavkaWriter.</p>
      <p>His faces based on Keren, Miriam, David, and other popular Hebrew faces <em>do</em> appear to be more pleasing than the originals in some aspects, but this appears to have been achieved by compromising the original artistic intent of those faces by incorporating into his designs more elements of traditional Hebrew faces.</p>
      <p>The guy who designed Spartan for Intertype wasn't breaking any laws in the U.S. at the time - and given the price of a big, heavy typecasting machine, forcing people to choose one based on the availability of faces instead of its own technical merits was such a problem that I can't really criticize the ethics of the copying of font designs that went on in the era of hot metal or film phototypesetting. Today, with fonts sold in standard formats for use on standardized computer platforms, the situation is different, but I do not know enough about the history of the sale of Shmuel Guttman's faces to make any comment on whether or not there are ethical issues there or not.</p>
      <p>Even if there are no ethical issues, though, I can understand that some people will feel themselves justified in perceiving his activities as... <em>annoying</em>. Despite it being entirely possible that his faces are preferable to the originals!</p>
