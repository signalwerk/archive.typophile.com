      <p>The Bible Unauthorized</p>
      <p>In 1942 A. H. Moose published a volume titled The Bible Unauthorized that included a translation of the first few chapters of Bereshit (Genesis) and a "treatise" that "proved" the existence of God, the Biblical account of creation, and other parts of the Bible. Moose claimed that "the real content of the Bible differs greatly from the many erroneous translations" that preceded his, and that his was "likely the first accurate translation".[29]</p>
      <p>According to the correspondence of Rabbi Yosef Yitzchok Schneersohn Moose was the pseudonym of Rabbi Aaron Hirsh Levitt, who had worked with Schneersohn.[30][31]<br>
