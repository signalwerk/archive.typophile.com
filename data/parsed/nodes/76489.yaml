      <p>The question of digitising the Koren Tanakh font was a big deal for Eliyahu Koren. He didn't want anybody else in the world to use his typeface (in any way shape or form). </p>
      <p>When we wanted to digitise the typeface for internal use 3.5 years ago, we debated whether to keep it propreitary or to make it generally available. Personally I fought for this to become commercially available since in any case there were other "interpretations" out there. Rather than people having to rely on these versions of the font, whether done with permission of Koren like Masterfont, or without, like Keren and Crown, was irrelevant. Let the people have the real thing and not some poor "interpretation". I succeeded in convincing the owner of Koren and he agreed (as long as the typeface isn't used to typeset a Tanakh). </p>
      <p>In reality the Koren Tanakh font was supposed to replace KoreenMF (KorenMF), but to be fair to other typesetters and companies out there that have been using KoreenMF for years for logos and books, in the meantime, we haven't insisted on the deceasing of the selling of the KoreenMF (KorenMF) interpretations. Perhaps this is a mistake and this forum is beginning to change my mind :-)</p>
