      <p>from: <a href="http://en.wikipedia.org/wiki/Jewish_commentaries_on_the_Bible" title="http://en.wikipedia.org/wiki/Jewish_commentaries_on_the_Bible">http://en.wikipedia.org/wiki/Jewish_commentaries_on_the_Bible</a></p>
      <p>Who was Onkelos?</p>
      <p>Onkelos wrote the most literal translation of the Bible.[5] with a few exceptions. Figurative language, is usually not translated literally but is explained (e.g., Gen. 49:25; Ex. 15:3, 8, 10; 29:35). Geographical names are often replaced by those current at a later time (e.g., Gen. 10:10; Deut. 3:17).<br>
      According to the Talmud,[6] the Torah and its translation into Aramaic were given to Moses on Mount Sinai, because Egyptian slaves spoke Aramaic. After the Babylonian exile, the Targum was completely forgotten. Onkelos, a Roman convert to Judaism, was able to reconstruct the original Aramaic. Saadiah Gaon disagrees and says the Aramaic of Onkelos was never a spoken language. He believed that Onkelos's Aramaic was an artificial construct, i.e. it was a combination of Eastern and Western dialects of Aramaic.[7]<br>
      [edit]</p>
