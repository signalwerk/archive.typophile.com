    html: |-
      <p>The difference that stands out is the slope of the lower leftwards bar of the Ayin.<br>
      Koren's slope is way too low, and will collide into taam combined with nikud.<br>
      The angle of Guttman's slope is less degrees, and will collide much less.<br>
      For this reason, more than any other, Koren had to set his so-called "classic" Koren Bible with the nikud, taam, and meteg so far below the Hebrew text.</p>
