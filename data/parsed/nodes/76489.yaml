      <p>I had not heard of that book.</p>
      <p>I had noticed the historical controversy about Matthew 1:22-23 quoting from Isaiah 7:14.</p>
      <p>I was astonished at this. Since Isaiah 7:14 was known to be a prophecy concerning events to take place in the time of King Ahaz, while the prophecy could also have referred to the Virgin Mary, with the other woman being what Christian Bible scholars call a "type" of Mary, since this other event did not involve a virgin birth, clearly the "young woman" translation is appropriate - in <em>both</em> Testaments.</p>
      <p>The word "parthenos" in the Septuagint is also ambiguous; it's only the Old Latin translation that turned it into an unambiguous "virgin". Given the orthodox Christian belief in the plenary inspiration of Scripture, including the New Testament, Matthew could not have put an incorrect quotation of Isaiah 7:14 in Scripture, and one with "virgin" would have to have been incorrect from the original context of that passage.</p>
      <p>Thus, this is not a question of modernism versus traditional belief, but rather how false tradition, ignorance, and bigotry have led people into error. The Virgin Birth is unequivocally stated elsewhere in the Gospels, there is no need to create a false controversy in order to add another reference.</p>
