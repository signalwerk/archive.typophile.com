      <p>Thanks James. I have not tried that because I don't want to make the type stack taller than it already is, although I will now go back and play with it. In addition, there is the potential for a named race sponsor being added, further expanding the length of the name to " Annapolis Bermuda Ocean Race".</p>
      <p>I'm fine with making the year light/thin, and was headed in that direction to make it less dominant. I guess what it comes down to is how to treat "ocean race" so it is of equal or less dominance than Annapolis Bermuda.</p>
