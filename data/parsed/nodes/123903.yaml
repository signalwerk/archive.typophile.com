    <p>I'm struggling with a typeface choice and weight/size/spacing issue. The logo below needs to function across a broad range of uses, from relatively small in a web site header all the way up to banner size. I initially used Helvetica Neue condensed black for its strength, compactness, and classic qualities, but am having doubts. The top line in the image is Helvetica, the bottom line Myriad, which is more "modern" or lack of a better adjective. However, Myriad is not as compact and I don't want to horizontally scale to made it more so.</p>
    <p>My primary struggle is with the treatment for "ocean race". It's essentially a modifier and "Annapolis Bermuda" needs to be dominant, or at worst they need to be equal in prominence. The logo needs to be able to stand alone without the date year, and as a result I'm not comfortable with aligning "ocean race" left or right and reducing the spacing.</p>
    <p>Any and all feedback and suggestions on how to treat "ocean race" and 2016 are welcome, and feel free to suggest alternate faces for the the entire logotype.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/A2B_logos_types.png" width="850" height="600" alt="">
