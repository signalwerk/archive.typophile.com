  html: |-
    <p>Making a specimen. What's the easiest way to paste every glyph in a font to InDesign or the like? The closest I've come is:<br>
    - Select all glyphs in Fontlab<br>
    - Open a metrics window<br>
    - Select all in that main metrics window pane and Copy<br>
    - Paste into InD</p>
    <p>This gets me most of the way there but some glyphs don't appear (replaced by a colored box) - I think it's the ones that don't have Unicode assignments (alternate characters, small caps, etc.)</p>
    <p>What am I missing?</p>
