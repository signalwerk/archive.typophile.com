    html: |-
      <p>I did something similar to what James did... I set up a document in InDesign and opened the Glyphs palette... That will show you every character in your typeface, allowing you to double-click on the ones that haven't been showing up and pasting them into a textbox. You can also choose different Unicode sets, like Basic Latin and Latin 1, Extended Latin A, etc. It's time-consuming the first time, then you just add to it or tweak it, as James says.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/glyphs_6436.png"></div><p></p>
