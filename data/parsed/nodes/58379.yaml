    html: <p>I'll assume you always generate and install the font before trying this. To easily grab the full set. Do an OT or TT test. Tools/Quick Test As. In the test window, display all characters, select all copy/paste in to Photoshop or whatever. That's how I make the samples on Typodermic.com give or take a few redundant glyphs.</p>
