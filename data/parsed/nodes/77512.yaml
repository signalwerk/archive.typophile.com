    <p></p><div class="imageWrap"><img src="http://typophile.com/files/letterchop_livin_colour_5584.gif"></div><p></p>
    <p>So really, ...is the canvas / paper's edge a finality to a letter shape - a word - or even a phrase? I don't think so!! I think acknowledging and defeating a barrier can strengthen the message's intent. </p>
    <p>My fresh new method of chopping a letter shape and then continuing with the chopped off letter's shape below on a perceived following line has a undefeated quality.</p>
    <p>Challenge the limit!</p>
    <p>.<br>
    .<br>
    .</p>
    <p>I really want to get this up on a canvas asap, and then onto posters :)</p>
    <p>Merry Christmas!!!</p>
