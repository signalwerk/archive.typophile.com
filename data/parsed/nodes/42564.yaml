  html: |-
    <p>I'm trying to build a font with makeOTF, but I can't get past this error message:<br><strong>makeotfexe [FATAL] line too long [../../GlyphOrderAndAliasDB 3]</strong></p>
    <p>Any ideas?</p>
    <p>+++++</p>
    <p><img src="/sites/default/files/old-images/scrn_4668.png"></p>
    <p><cite> </cite><br><strong>The text of "current.fpr"</strong><br>
    DoAliasAndOrder	true<br>
    InputFontPath	MUSEO2_100.otf<br>
    GlyphAliasDBPath	../../GlyphOrderAndAliasDB<br>
    FeaturePath	features<br>
    FontMenuDBPath	../../FontMenuNameDB<br>
    kSetfsSelectionBitsOn	[7]</p>
    <p><strong>terminal output (on "makeOTF -fp")</strong><br>
    makeotf [NOTE] Running makeotfexe with command string:<br>
       makeotfexe "-f" "MUSEO2_100.otf.tmp" -ga -ff "features" -osbOn "7" -gf "../../GlyphOrderAndAliasDB" -osv "4" -mf "../../FontMenuNameDB"<br>
    makeotfexe [FATAL] line too long [../../GlyphOrderAndAliasDB 3]</p>
    <p>+++++</p>
