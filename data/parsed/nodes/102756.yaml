    html: |-
      <p>This is not a font as it, more custom job. You could easily redo the same by picking any gothic condensed of your choice and some slab serifs (strokes) to terminals.<br>
      If you still need a close base font (possibly even matching), you can use <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/steelfish" rel="nofollow">Steelfish</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/trump-gothic" rel="nofollow">Trump Gothic</a>.</p>
