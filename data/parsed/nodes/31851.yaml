  html: |-
    <p>For all you type designers - I often shortcut to a font by starting to type its name into the “character” window and letting the computer fill in the rest, rather than scrolling down the list of activated fonts. I’m currently using Klavika for a project and the computer jumps to fill in “Arrows” rather than Plain or Plain OSF or something I might actually be using. I mean... does anyone actually use those arrows? But Klavika isn’t the only font that does this. Mrs. Eaves jumps to Fractions for example. Is there a way, when constructing a font, for you to take into account the weight or style that the average user would be most likely to want (the plain) and then name the font or its weights in such a way that it becomes the default? And then if we want the caps or fractions or the... arrows... we can scroll to it manually.</p>
    <p>Or is this a font management software question? I should add that the same thing happens in both Quark and InDesign. It’s a small annoyance of course but the time spent scrolling needlessly through font menus does add up.</p>
