  html: '<p><span class="caps">RARE</span> <span class="caps">BOOK</span> <span class="caps">SCHOOL</span> (<span class="caps">RBS</span>) is pleased to announce its Winter and Early Spring Sessions 2004, a collection of ﬁve-day, non-credit courses on topics concerning rare books, manuscripts, the history of books and printing, and special collections to be held at the University of Virginia. <br><br><span class="caps">FOR</span> <span class="caps">AN</span> <span class="caps">APPLICATION</span> <span class="caps">FORM</span> and electronic copies of the complete brochure and the <span class="caps">RBS</span> Expanded Course Descriptions, providing additional details about the courses oﬀered and other information about <span class="caps">RBS</span>, visit our Web site at: <br><br><a href="http://www.rarebookschool.org" target="_blank">http://www.rarebookschool.org</a> <br><br>Subscribers to the list may ﬁnd the following Rare Book School course to be of particular interest: <br><br>14 (T-10). <span class="caps">INTRODUCTION</span> <span class="caps">TO</span> <span class="caps">THE</span> <span class="caps">HISTORY</span> <span class="caps">OF</span> <span class="caps">TYPOGRAPHY</span>. (<span class="caps">MONDAY</span>-<span class="caps">FRIDAY</span>, 5-9 <span class="caps">JANUARY</span>). A survey of European and American typographic history from 1450 to the present, but concentrating on the period 1480-1950. Topics will include: the development of Roman and italic; from Old Style to Transitional to Modern (Italian, French, Dutch, and English developments); display types; the coming of machine composition and the historic revivals; typeface nomenclature; and techniques for dating pre-1885 hand-set typefaces and for naming post-1885 machine-set typefaces. In laboratory sessions, students will have a chance to set type by hand, proof, and print. Instructor: Stanley Nelson. <br><br><span class="caps">STANLEY</span> <span class="caps">NELSON</span> has been a specialist for many years in the Graphic Arts Collection of the National Museum of American History, Smithsonian Institution, and he has given many demonstrations and lectured widely on various aspects of typographic history. He is both author and presenter in the 1985 Book Arts Press videotape, From Punch to Printing Type: The Art and Craft of Hand Punchcutting and&nbsp;Typecasting.</p>'
  html_clean: '<p><span class="caps">RARE</span> <span class="caps">BOOK</span> <span class="caps">SCHOOL</span> (<span class="caps">RBS</span>) is pleased to announce its Winter and Early Spring Sessions 2004, a collection of ﬁve-day, non-credit courses on topics concerning rare books, manuscripts, the history of books and printing, and special collections to be held at the University of Virginia. <br><br><span class="caps">FOR</span> <span class="caps">AN</span> <span class="caps">APPLICATION</span> <span class="caps">FORM</span> and electronic copies of the complete brochure and the <span class="caps">RBS</span> Expanded Course Descriptions, providing additional details about the courses oﬀered and other information about <span class="caps">RBS</span>, visit our Web site at: <br><br><a href="http://www.rarebookschool.org" target="_blank" class="link-external">http://www.rarebookschool.org</a> <br><br>Subscribers to the list may ﬁnd the following Rare Book School course to be of particular interest: <br><br>14 (T-10). <span class="caps">INTRODUCTION</span> <span class="caps">TO</span> <span class="caps">THE</span> <span class="caps">HISTORY</span> <span class="caps">OF</span> <span class="caps">TYPOGRAPHY</span>. (<span class="caps">MONDAY</span>-<span class="caps">FRIDAY</span>, 5-9 <span class="caps">JANUARY</span>). A survey of European and American typographic history from 1450 to the present, but concentrating on the period 1480-1950. Topics will include: the development of Roman and italic; from Old Style to Transitional to Modern (Italian, French, Dutch, and English developments); display types; the coming of machine composition and the historic revivals; typeface nomenclature; and techniques for dating pre-1885 hand-set typefaces and for naming post-1885 machine-set typefaces. In laboratory sessions, students will have a chance to set type by hand, proof, and print. Instructor: Stanley Nelson. <br><br><span class="caps">STANLEY</span> <span class="caps">NELSON</span> has been a specialist for many years in the Graphic Arts Collection of the National Museum of American History, Smithsonian Institution, and he has given many demonstrations and lectured widely on various aspects of typographic history. He is both author and presenter in the 1985 Book Arts Press videotape, From Punch to Printing Type: The Art and Craft of Hand Punchcutting and&nbsp;Typecasting.</p>'
