      <p>"Corbis is focussed too much on profits and loss"</p>
      <p>A not too uncommon problem...specifically, short term P&amp;L is often too much of a focus...or as I suspect this case may be...to narrow of a focus on one particular part of the business at the sacrifice of the overall brand image. </p>
      <p>"Now if distributors could just standardize on a common size for specimens/banners, then foundries could do all the work of producing specimens"</p>
      <p>With all the due respect I can muster for the highly talented type designers out there (seriously and sincerely)...I do have to say that more often than not, it seems, they aren't necessarily good graphic designers. There's a LOT of ugly on MyFonts. Some great fonts, but uglified in their little banner/specimen designs*. Veer definitely had one of the finer specimen catalog layouts IMHO. </p>
      <p>* and that's not to say it's a universal truth...as many great foundries, like House are both incredibly talented type foundries as well as graphic design houses and make stunningly beautiful specimen catalogs.</p>
