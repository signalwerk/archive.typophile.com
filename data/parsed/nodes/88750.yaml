    <p>According to <a class="freelinking external" href="http://imprint.printmag.com/typography/veer-shifts-sights/" rel="nofollow">this article in Imprint</a>, Veer will not be acquiring and selling licences for new typefaces. "The many tasty typefaces former “Head of Type” Joe Newton curated over the last three years will remain intact; but the collection will be frozen in time—at least for now—with no new additions on the [near] horizon."</p>
    <p>This news about Veer seems sad and unexpected to me. Its predecessor, Image Club Graphics, was the first place I ever purchased fonts. It happens to be the most recent place I purchased a font, too. Their current collection will remain, but it won't grow, and that seems tragic. An initial urge is to jump to the conclusion that Corbis is focussed too much on profits and loss, and should allow Veer to do what it does so well, despite the current bottom line. But I suppose that would be naïve, uninformed and maybe both.</p>
    <p>Anyway, it seems like a sad time for type. Then there's that phrase, "at least for now." Does that mean there may be a shift back? Living in hope …</p>
