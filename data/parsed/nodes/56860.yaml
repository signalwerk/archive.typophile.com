    <h2><a href="/battle37" title="Type Battle 37 // Food Font!">Type Battle 37 // Food Font!</a></h2>   <p>/ THE CHALLENGE</p>
    <p>Food is great. Fonts are great. Together they could be really really tasty. Craft the name of any food out of the food itself.</p>
    <p>Winner take all, no holds barred. May the best designer win.</p>
