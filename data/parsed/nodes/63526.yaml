    <p>Hi Everybody...<br>
    This is my first post, so I'm looking forward to seeing how useful this site can be. </p>
    <p>I have a pretty specific question.<br>
    I'm looking to download the font "Nasty" by misprintedtype free for a MAC. I have a link for it (<a href="http://www.misprintedtype.com/v3/fonts/popup.php?tipo=free&amp;font=13" title="http://www.misprintedtype.com/v3/fonts/popup.php?tipo=free&amp;font=13">http://www.misprintedtype.com/v3/fonts/popup.php?tipo=free&amp;font=13</a>) but for some reason the download is coming up as an error. Does anyone know how I can fix this, and/or another place I can find this font as a free MAC download?</p>
    <p>Thanks ahead of time for any help or suggestions!<br>
    ~ff</p>
