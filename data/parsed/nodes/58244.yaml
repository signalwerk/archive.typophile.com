    <p>Hey everyone,</p>
    <p>Just a quick note to let you all know that the Occidental family is now available through Myfonts.</p>
    <p><a href="http://new.myfonts.com/fonts/ryancorey/occidental/" title="http://new.myfonts.com/fonts/ryancorey/occidental/">http://new.myfonts.com/fonts/ryancorey/occidental/</a></p>
    <p>The Occidental family is a geometric, sans-serif text face marked by its angular construction.</p>
    <p>Occidental is suitable and economical enough to set large blocks of copy, but at display sizes Occidental’s inherent character takes over making it useful for headline setting as well.</p>
    <p>The family includes four weights, each with corresponding italics (excepting Display) for a total of seven fonts.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/25625_5531.png"></div><p></p>
