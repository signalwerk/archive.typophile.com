    html: |-
      <p>An offhand suggestion:</p>
      <p>1. Draw the black box to size vertically in a not-often-used slot, like "bar," and set the path to PS direction.</p>
      <p>2. Select all the other glyphs and set paths to TT direction.</p>
      <p>3. Character by character, use the Get Component command to insert the block.</p>
      <p>4. Decompose the block and correct the width; use Tools &gt; Metrics to set sidebearings to zero; Cut block; use Tools &gt; Metrics to Center Glyph; Paste block, then decompose all.</p>
      <p>5. Create "ligatures" or Contextual Alternates for letter combinations like AV.</p>
      <p>6. Create the OpenType features to support these swaps.</p>
