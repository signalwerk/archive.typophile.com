  html: |-
    <p>Hey Everybody,<br>
    I am trying to have something like a black block underneath every Letter of the typeface . So basically an inverted version of the typeface on a black Background. Is it possible to automtically generate an effect like that in fontlab or give the typeface a feature to do so? The propblem is that the Typeface is not a monospacetypeface so if i would set up the letters  on a black background in the glyphsheet , once two letter would overlap like AV something would be cut away from the A or V.  It also needs to work witout doing anything manually afterwards ( like changing underline options in indesing for example)! Would be great if anybody could help me!<br>
    All the best<br>
    Timm</p>
