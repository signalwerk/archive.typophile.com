    <p>Hello,</p>
    <p>I'm a new member to the site. I would like to enlist help in IDing the logotype for Victoria's Secret. I usually go to <a href="http://www.brandsoftheworld.com" title="www.brandsoftheworld.com">www.brandsoftheworld.com</a> for the logo eps files. But VS isn't listed on that site. My friends thought VS logotype is in Trajan but it's not. If anyone can shed light on this, I'd appreciate your help!</p>
    <p>Also, by any chance, does anyone know the typeface used for Banana Republic's logotype?</p>
    <p>Thanks a bunch!</p>
