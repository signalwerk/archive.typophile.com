    <p>Hi folks, </p>
    <p>I’m doing this typeface in fonlab build from components. I’m having 2 components which are overlapping eachother. I have a question cause when I do the fill out (presing “&lt;” button)  I can se som lines which looks “smoothered” - Tjek out img’s - marked with a red circle.</p>
    <p>My q’tion goes like this: Is the smootheredness a problem when I generate the typeface?</p><div class="imageWrap"><img src="/files/fontlab01_4665.gif"></div><div class="imageWrap"><img src="/files/fontlab02_5812.gif"></div><p></p>
