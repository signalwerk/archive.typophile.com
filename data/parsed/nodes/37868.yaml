    html: |-
      <p>The little bumps you are seeing are the result of the way FontLab previews outlines when paths overlap. </p>
      <p>You <em>can</em> generate a font like that, and it will work with some programs (InDesign, for one), but other programs (Illustrator, for example) will refuse to print a document containing such fonts. Even when they work, they sometimes look weird on screen (InDesign makes holes appear at the overlaps at some zoom levels). In any case, overlapping paths are not allowed in the PostScript Type 1 spec, so you don’t want them in your finished fonts.</p>
      <p>However, it’s okay to have overlaps while you’re working on a font. It’s hard to make some kinds of letter shapes to look right (scripts, for instance) without overlapping paths. And if the design is still in flux, it makes it easier to play with the design.</p>
      <p>In the end, before you generate a font, you will need to remove the overlaps. Be sure to check the results when removing the overlaps. Because the resolution of the em square is limited, you may get a little distortion due to the fact that the new control points that are created where lines intersect have to fall on a whole-unit coordinates.</p>
