      <p>Alle Schriftformen, deren Wesen durch zum Skelett hinzutretende Ornamente (Schraffuren bei der Antiqua, Rauten und Rüssel bei der Fraktur) entstellt ist, entsprechen nicht unserem Streben nach Klarheit und Reinheit. Unter allen vorhanden Schriftarten ist die sogennante „Grotesk“ oder Blockschrift (die richtige Bezeichnung wäre „Skelettschrift“) die einzige, die unserer Zeit geistig gemäß ist.<br>
      Jan Tschichold, <em>Die neue Typographie</em> (Berlin, 1928), page 75</p>
      <p>Ruari McLean’s translation reads well, and his knowledge of German was certainly better than mine is, but I have never been happy with the way he handled that famous passage on the sanserif. It seems to me to soften some key words in a passage of which the language is quite strong and powerful. McLean’s version is:</p>
      <p>None of the typefaces to whose basic form some kind of ornament has been added (serifs in roman type, lozenges and curlicues in fraktur) meet our requirements for clarity and purity. Among all the types that are available, the so-called ‘Grotesque’ (sanserif) or ‘block letter’ (‘skeleton letters’ would be a better name) is the only one in spiritual accordance with our time.</p>
      <p>I would suggest something more like this:<br>
      Types of which the essential form is degraded by added ornaments – like serifs in roman type, the points and snouts of Fraktur – fail to satisfy our striving for clarity and purity. Of all the types that are currently available, the so-called ‘grotesque’ or ‘block letter’ (the right name would be ‘skeleton letter’) is the only one that adequately meets the spirit of our time.</p>
      <p>It seems to me that <em>Wesen</em> is a far more powerful and elemental term than McLean’s bland “basic form”. And the <em>ent</em> prefix in <em>entstellt</em> suggests deviation, even perversion – so the essential meaning is “degraded”. Think of the modern paintings that the Nazis hated and destroyed. McLean’s reference to “added” ornament is quite neutral. And “requirements” seems an equally flat term for Tschichold’s <em>Streben</em> – “striving” for purity and clarity. And if you think, as I do, that such “striving for purity” has slightly sinister political and even racial overtones, then remember when and where this was written. It seems to me that, as a piece of writing, it inevitably reflects the spirit of his time, but it is also characteristic of the writer. Even in his later essays, the “classical” Tschichold could be very loud in denouncing tiny points of typographic detail that he thought were “wrong”.</p>
      <p>As for the “art typefaces” (<em>Künstlerschriften</em>) some lines further on, the translator’s problem here is that they did not really happen in Britain or the USA, so there is no word for them. At least one can’t find easily find a type made with the same kind of intention as the one that the young Klingspor brothers commissioned from Otto Eckmann, and for which they gave him two closely-packed pages in the specimen to say what he was trying to do, which was to make a type than was neither as illegible as, so he claims, the types based on older models were (I think he had Jenson-style types like Morris’s Golden in mind) nor as ugly and banal as the more modern ones, presumably the English-style “modern” faces that were then used for some German technical and scientific printing.</p>
      <p>Tschichold dismisses the “artists’ types” as self-indulgent exercises, which in many cases may have been true but is unfair on Eckmann, who had given up painting to turn to the design of handmade objects, and who complains of the unsoundness of furniture made from the sketches of designers who lack a sense of construction. Is there an English translation of his piece? Maybe someone should attempt one.</p>
      <p>At any rate, can someone improve on my attempt at Tschichold’s paragraph.</p>
