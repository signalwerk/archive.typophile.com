      <p>&gt; If you want to understand Tschichold’s ideological position, you need to have a look at this one as well: ‚Sonderheft elementare typographie / typographische mitteilungen‘ (October 1925)</p>
      <p>I agree. (I’ve got the reprint.) That’s where he calls the Grotesk, with its light, semibold, bold, and condensed to wide versions, the ‘elemental letterform’ (<em>elementare Schriftform</em>). Or does he just mean ‘basic’?</p>
      <p>Another relevant text (although I don’t think he concerns himself with the choice of type) is of course Moholy Nagy’s essay in the Bauhaus catalogue of 1923, which used the title <em>The New Typography</em> before Tschichold did. (Although you can’t see the detail in this low-res image, I love the way in which the fourth E in the title is made up of thick rules. Presumably there were only three cap E’s in the fount. You couldn’t do that with roman or gothic types. Another plus for the sanserif.)</p>
      <p></p><div class="imageWrap"><img src="/files/Moholy Nagy - Neue Typ a sm a 500_5688.jpg"></div><br>
      Luckily there is an English version, in his collected essays.<p></p>
      <p>In the context of <em>Künstlerschriften</em> I cited Eckmann’s sober defence of attention to legibility and respect for function. However I’ve been trying to keep up my German with the 1908 printing of <em>Die Nibelungen</em> in the 1908 edition with illustrations by Czeschka and set in the Eckmann type (Insel Verlag pocket version). Looks stunning, but for reading, I’ll take Tschichold’s lucid pages any day.</p>
      <p></p><div class="imageWrap"><img src="/files/Nibelungen - ill Czeschka - 1908 - typ Eckmann 2 500_4642.jpg"></div><p></p>
