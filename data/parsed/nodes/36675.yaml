      <p>&gt; political overtones<br>
      for sure</p>
      <p>&gt; racial overtones<br>
      I dont‘t think he had these in mind when he wrote this. Back then, Tschichold took a strong internationalist stance.</p>
      <p>&gt; remember when and where this was written</p>
      <p>If you want to understand Tschichold’s ideological position, you need to have a look at this one as well:<br>
      ‚Sonderheft elementare typographie / typographische mitteilungen‘ (October 1925)<br>
      There was also a reprint in 1986, but it‘s out of print again:<br>
      Iwan Tschichold: Elementare Typographie. Sonderheft der Typographischen Mitteilungen 1925 | Reprint<br>
      ISBN 978-3-87439-129-9</p>
      <p></p><div class="imageWrap"><img src="/files/typograph_mitteil_5088.jpg"></div><p></p>
      <p>Tschichold was editor of this special edition of Typographische Mitteilungen. On 24 pages, Tschichold gave a concise overview of the ‚new typography‘, as it was developed by Russian Constructivist artists and adopted in the Netherlands by De Stijl and in Germany by the Bauhaus. He showed samples of work by Lissitzky, Moholy-Nagy and others, and he compiled a few short articles. Because of its compactness it has almost the characteristics of a manifesto, and in its style and language it is much stronger (and rougher) than ‚Die neue Typographie‘. ‚Elementare Typographie‘ was the rough sketch that shows the sources of its ideas clearer than ‚Die neue Typographie‘. It‘s a pity that it got somehow a bit forgotten and that there is no English translation available.</p>
      <p>In his introductory article, Tschichold devoted a whole paragraph to a quote by Trotzky (from ‚Literature and art‘):</p>
      <p>‚The wall between art and industry will come down. The great style of the future will be formative, not ornamental. (...) But it would be wrong to look at this as a liquidating of art, as a voluntary giving way to technique. (...) In accord with the entire tendency of industrial culture, we think that the artistic imagination in creating material objects will be directed towards working out the ideal form of a thing, as a thing, and not towards the embellishment of the thing as an aesthetic premium to itself.‘</p>
      <p>Probably this quote helps to see the context Tschichold had (in my opinion) in mind when he wrote about the ‚Streben nach Klarheit und Reinheit‘.</p>
