    <p>For type history research I am undertaking, I am interested in finding the original German of a passage from Jan Tchichold’s <em>Die neue Typographie</em>. It’s just a select bit, so I thought I’d see if any typophiles had a German version at hand before I try to have one delivered to me.</p>
    <p>The passage in question appears on p73-74 of the Ruari McLean translation, under the heading “Type”:</p>
    <p><cite>None of the typefaces to whose basic form some kind of ornament has been added (serifs in roman type, lozenge shapes and curlicues in fraktur) meet our requirements for clarity and purity. Among all the types that are available, the so-called “Grotesque” (sanserif) or “block letter” (“<strong>skeleton letters</strong>” would be a better name) is the only one in spiritual accordance with our time.</cite></p>
    <p><cite>To proclaim sanserif as the typeface of our time is not a question of being fashionable, it really does express the same tendencies to be seen in our architecture. It will not be long before not only the <strong>“art” typefaces</strong>, as they are sometimes called today, but also the classical typefaces, disappear, as completely as the contorted furniture of the eighties.</cite></p>
    <p><cite>There is no doubt that the sanserif types available today are not yet wholly satisfactory as all-purpose faces. The essential characteristics of this type have not been fully worked out: the lower-case letters especially are still <strong>too like their “humanistic” counterparts</strong>. Most of them, in particular the newest designs such as Erbar and Kabel, are inferior to the old anonymous sanserifs, and have <strong>modifications</strong> which place them basically in line with the rest of the “art” faces. As <strong>bread-and-butter faces</strong> they are less good than the old sans faces. Paul Renner’s Futura makes a significant step in the right direction.</cite></p>
    <p><cite>But all the attempts up to now to produce a type for our time are merely “improvements” on the previous sanserifs: they are all still <strong>too artistic, too artificial, in the old sense</strong>, to fulfil what we need today.</cite></p>
    <p><cite>Personally I believe that no single designer can produce the typeface we need, which must be <strong>free from all personal characteristics</strong>: it will be the work of a group, among whom I think there must be an engineer.</cite></p>
    <p>I’d love to have the German original for this whole passage, but I’d also be grateful for any clues about what the German original of the phrases I have emphasized was.</p>
    <p>Thanks!</p>
