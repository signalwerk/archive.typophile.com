      <p>Craig, I’ll e-mail this text to you, and send you a scan of the relevant pages offline. But here is German text for your passages.</p>
      <p>Jan Tschichold, <em>Die Neue Typographie: Ein Handbuch für zeitgemäß Schaffende</em>, 1928. Berlin: Verlag des Bildungsverbandes der deutschen Buchdrucker. Pages 75–76.</p>
      <p><strong>Schrift</strong><br>
      Alle Schriftformen, deren Wesen durch zum Skelett hinzutretende Ornamente (Schraffuren bei der Antiqua, Rauten und Rüssel bei der Fraktur) entstellt ist, entsprechen nicht unserem Streben nach Klarheit und Reinheit. Unter allen vorhandenen Schriftarten ist die sogenannte „Grotesk“ oder Blockschrift (die richtige Bezeichnung wäre „Skelettschrift“) die einzige, die unserer Zeit geistig gemäß ist.<br>
      Die Proklamierung der Grotesk als der Schrift unserer Zeit ist nicht etwa eine Modeangelegenheit, sie entspricht durchaus den allgemeinen Tendenzen, z.B. denen in der Architektur. Die Zeit ist nicht mehr fern, wo nicht nur die Künstlerschriften (die dieses Los zum Teil schon heute trifft), sondern auch die „klassischen“ Schriften allgemein dieselbe Ablehnung erfahren werden, die heute etwa den Muschelmöbeln der achtziger Jahre zuteil wird.<br>
      Es ist keine Frage, daß die heute vorhandenen Groteskschriften den Ansprüchen, die an eine vollkommene Schrift gestellt werden müssen, noch nicht ganz genügen. Die spezifischen Eigentümlichkeiten dieser Schrift sind noch kaum herausgearbeitet, die Formen insbesondere der Kleinbuchstaben sind noch zu sehr von der humanistischen Minuskel abhängig. Die meisten, und gerade die neuesten künstlerischen Groteskschriften (z.B. Erbar-Grotesk und Kabel) zeigen, zu ihrem Nachteil gegenüber den namenlosen älteren Grotesken, individuell modifizierte Bewegungen, die sie grundsätzlich in eine Linie mit den andern Künstlerschriften stellen. Als Brotschriften sind sie weniger gut als die alten Grotesken. Einen wesentlichen Schritt nach vorwärts bedeutet die Futura von Paul Renner.<br>
      Aber alle bisherigen Bemühungen, die Schrift der neuen Zeit zu schaffen, gehen nur um eine „Verbesserung“ der bisherigen Grotesk; es fehlt allen diesen Versuchen, die noch viel zu artistisch, zu „künstlerisch“ im früheren Sinne sind, die notwendige grundsätzliche Einstellung.<br>
      Ich persönlich glaube, daß es nicht einem einzelnen vorbehalten sein kann, die Schrift unseres Zeitalters zu schaffen, die von jeder persönlichen Linienführung frei sein müßte. Sie wird das Werk mehrerer sein, unter denen sich wohl auch ein Ingenieur befinden müsste.</p>
