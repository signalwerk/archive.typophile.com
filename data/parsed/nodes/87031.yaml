  html: |-
    <p>Typomapp features 430 typographers from Gutenberg to the present day and about 1000 typeface samples to illustrate their work.</p>
    <p>You can access it <a href="http://typomapp.com/webapp" target="_blank" rel="nofollow">here</a>.</p>
    <p>Key features:</p>
    <p>- toggle on and off the Points of Interest (adjusting the time slider or by category: typographers, places, events, foundries, favorites)<br>
    - suggestive search function<br>
    - full index<br>
    - save favorites</p>
    <p>We hope you'll find it useful.</p>
