      <p><cite>Despite the fact that Apple is as dirty and back handed in the way it deals with other businesses as Microsoft, it still has a pristinely clean public image. In the minds of most people, the other PC manufacturers are all nameless, faceless industrial plants that shoot out box after box of blah. But Apple is cool.</cite></p>
      <p>Apple's positive reputation is a result of Apple very carefully making itself seem small. If you study attacks on American business over the last two centuries, you'll see that the insults appearing most often attack the size of the corporation above all else–big tobacco, big oil, etc. It's a nearly perfect attack, because the size of corporations is incredibly elastic, so the true size at which a big company is a bad company never needs to be defined. </p>
      <p>By carefully pitching itself as an underdog Apple has made itself the sweetheart of the American public, the Yin to the Wintel yang. Target handles itself similarly, by avoiding the over-the-top behavior of Wal-Mart and donating profits to communities, it pitches iself as a good smaller alternative to big evil Wal-Mart. </p>
      <p>This is why Greenpeace's attacks will ultimately have little impact. Apple need only make a few small changes and mention them at press conferences to convince people that it remains a valiant underdog. And because Apple still has relatively little real competition for products other than the iPod, it is unlikely that any changes Apple makes will spread to other companies.</p>
      <p>Going after a larger PC maker, one without and underdog reputation—perhaps Dell—, would likely result in more changes being made to satisfy consumers, and due to Dell's size, large competitors may have reciprocated to avoid being the next target.</p>
