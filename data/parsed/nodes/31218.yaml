      <p>the sad truth is that all electronics are a massive environmental problem, both in manufacture and disposal.  i say bravo to greenpeace and anyone who points to the problem and even better if they try to deal with it. i'm not sure if singling out apple<br>
      makes any sense. we are all responsible.</p>
      <p>most of my hi-tech friends in the usa seem to consider themselves "progressive" but we all throw our hardware and media in the trash. flat screens are somewhat less toxic than the old cathode ray tubes, but there are still issues. do you know where the tin in your cellphone came from ?</p>
      <p>i've worked in broadcast design for years and the volme of media discarded is shocking. when dvd's replaced 3/4" tapes as standard house media, truckloads of tape libraries were discarded by so many production companies, and even before that the short tapes used for in-house and client review were discarded daily in huge numbers.</p>
      <p>germany is way ahead in the recycling effort. there are companies sprouting up in the usa that handle discarded hardware and media for small fees. greendisk is the one i use.<br>
      it's worth searching in your local area for drop-offs or recycling programs.</p>
