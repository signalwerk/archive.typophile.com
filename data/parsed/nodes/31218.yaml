      <p>&gt;&gt; The computer sure has done a lot to reduce *my*<br>
      &gt;&gt; dependance on paper.<br>
      &gt; And a lot to expand your dependence on electricity,<br>
      &gt; which during the generation process damages the<br>
      &gt; environment.</p>
      <p>Especially that instead of a TV, a VCR, a stereo, and possibly a few other devices, I just use one notebook connected to just one socket. </p>
      <p>I don't need my newspaper delivered to me every morning, so the printing presses consume less energy when producing the newspapers, less couriers drive through the city distributing the papers and burning fuel. Computers allow logistics to be smoother and more streamlined: less empty runs, less redundant runs, that again, burn fuel. IT-aided public transportation allows people to move around more economically and to actually consume less energy than if every single person drives around a huge SUV. </p>
      <p>By saying "Things are interconnected. Looking at them in isolation makes no sense," I did not mean looking at things as an isolated person, but looking at isolated things, without seeing how they affect other things. Of course computers consume energy, produce waste, and harm the environment, but they also help reduce energy consumption and pollution elsewhere. </p>
      <p>Doing some computations that are limited only to computers by themselves, and then arriving at the conclusion that computers are "only harmful" makes no sense. </p>
      <p>After all, I bet Greenpeace's report was not handwritten and distributed only by traditional post in envelopes made of recycled paper. Wait... imagine how many sheets of paper would they have to mail out if e-mail did not exist. </p>
      <p>A.</p>
