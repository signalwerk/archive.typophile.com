      <p>I'm with sii and Ch on this one. Hey, if recycling technology in your city is big pain in the ass (like it is for me), then try a site like <a href="http://freecycle.com/" rel="nofollow">Freecycle</a>. There's always someone who can use our so-called obsolete hardware. Post your stuff, leave it out for pickup once someone says "I want that", then it goes to a new home with almost no effort on your part. That Greendisk service is pretty darn cool, too. I'm going to check that out. But technology recycling will not catch on with the public as long as it costs them money. Easier just to junk it.</p>
      <p>Hardware (and often software) companies all benefit immensely from the high-speed obsolescence of technology, and we as consumers generally clamor for it. Are Macs damaging the environment? Sure. Along with every other piece of technology we buy and dispose of. Plus, there's a layer of security concerns here that's important to note. Some people don't want to donate old tech, for fear of old data being exposed to abuse. I suppose it's not that hard to fix that, but we all know how people are with unfamiliar technical challenges.</p>
