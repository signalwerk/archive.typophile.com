    <p>Greenpeace has a campaign to try to pressure Apple into removing some toxic chemicals from their products and adopting a take-back system to encourage recycling of computers, ipods, etc. It sounds like they're not any worse than any computer company, but people think that Apple is the most likely to adopt new policies. </p>
    <p>Here is a story about the campaign:<br>
    <a href="http://designdrivethru.typepad.com/design_drivethru/2007/02/green_apple_vs_.html" title="http://designdrivethru.typepad.com/design_drivethru/2007/02/green_apple_vs_.html">http://designdrivethru.typepad.com/design_drivethru/2007/02/green_apple_...</a></p>
