      <p>A fee? That might be what's keeping the majority of America from making the effort to recycle their electronics properly. A service needs to be in place that will either take it for free, offer some sort of tax deduction, or actually give you money back. </p>
      <p>Maybe an up-front fee, similar to when you purchase a new car battery. The store assumes you're replacing your old hardware with new hardware and charges you a few dollars until you bring your old hardware back in, then they refund that up-front fee. Maybe they could give you a discount on your purchase if you bring your equipment in and have the upgrades preformed by their technicians.</p>
