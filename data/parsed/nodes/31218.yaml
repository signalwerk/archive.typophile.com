      <p>typequake: i'm not questioning your right to any opinion - i've got plenty of maverick views that would start a flame torrent even among my friends. i was questioning the meaning of your ambiguous post, and it's still not entirely clear to me. </p>
      <p>WHOSE effort is a waste of time and money ? greenpeace's ? our discussion ? my advocacy of recycling ? a general advocacy of awareness ? </p>
      <p>and after that's clarified: WHY is the effort a waste of time and money ?</p>
      <p>i think general advocacy of awarenesss is primarily what greenpeace is doing,<br>
      and i support that, no matter how unlikely the odds of immediate change.<br>
      change is slow, competing with the inertia of markets, business plans, consumer trends, and shareholder majorities. </p>
      <p>but it all starts with awareness.</p>
      <p>the most remarkable example recently was the report issued by the CEO's of 10 major corporations advocating greater action on global warming. who saw that coming ?</p>
      <p><a href="http://www.us-cap.org/ClimateReport.pdf" title="http://www.us-cap.org/ClimateReport.pdf">http://www.us-cap.org/ClimateReport.pdf</a></p>
      <p>this very discussion is proof to me that the greenpeace campaign has had some effect, however trivial it might seem to you. very small effect is the beginning of very large change. it happens slowly, almost imperceptibly. examples are all around us, including global warming. </p>
      <p>the i Ching calls it "the triumph of the very small". thats how trees grow through stone walls and water wears down canyons - cell by cell and drop by drop. and accumulating trash landfills gradually leach more heavy metals, and water supplies become toxic. </p>
      <p>the small begets the large. apathy breeds disaster, awareness breeds change.</p>
