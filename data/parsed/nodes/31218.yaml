      <p><cite>new Macs may be cheap compared to old Macs, but they are considerably more expensive than comparable Wintel machines</cite></p>
      <p>That is really dependent on what Wintel machine you buy from a vendor, you might get a machine that stands good processor-wise but the vendor may have cut other corners such as embedding modem chipsets and soundcards together or going with less cache.</p>
      <p>Also, the amount of time you wind up spending maintaining that machine vs. its Mac equivalent needs to be considered... if you value that time.</p>
      <p>I am by no means anti-PC. I have 2 PCs and 2 Macs in my studio right now. The PCs were cheaper than their closest Mac equivalents because I bought the parts for them over the internet and I built the machines myself. They are my fastest machines, but that is only because I spent a lot of time on R&amp;D and then used that info to customize the bejeezus out of them. That took time. </p>
      <p>When I buy an Apple, I get it in the mail, it works right out of the box. I spend a fraction of the time maintaining it compared to the PCs in my studio. I'd rather pay a little more (and that amount has indeed shrunk in the past few years) and not have the headache.</p>
      <p>Getting back on subject, I think Greenpeace is targeting Apple because they are likely to comply with what's being asked... and as Apple is in the spotlight so much I think a lot of other manufacturers would take notice and follow suit.</p>
