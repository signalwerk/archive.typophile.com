      <p>I think it's a genius move to go after Apple. They're a small enough company with a vise-like grip on their hardware that implementation <em>could</em> actually happen. The fact that they are so prominent in the media despite their world market share plays a significant part as well. In fact, it's almost perfect.</p>
      <p>Despite the fact that Apple is as dirty and back handed in the way it deals with other businesses as Microsoft, it still has a pristinely clean public image. In the minds of most people, the other PC manufacturers are all nameless, faceless industrial plants that shoot out box after box of blah. But Apple is <em>cool</em>. They're the cool kid who dares not lose face in front of all of his friends and girlfriends.</p><div class="imageWrap"><img src="http://typophile.com/files/ice_broch_fc_5001.jpg"></div><p></p>
      <p>Do they deserve the finger-pointing-at any more than the other companies? Who cares? If you can get Apple to do it, others might play along because they have no choice.</p>
