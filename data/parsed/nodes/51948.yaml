      <p>Hrant: <em>But we also do kerning after/during -what I call- “spacing”, which is not just adjusting, but determining, sidebearings.</em></p>
      <p>Spacing, following the typical font model that we've inherited from previous technologies, is a two-stage process involving, first, the default spacing of individual glyphs for arbitrary glyph sequences (sidebearing setting) and, second, the spacing of pairs of letters for specific glyph sequences* (kerning).</p>
      <p>* OpenType extends this model by permitting contexts spacing that extend beyond the pair, but few non- 'complex script' fonts take advantage of this and, if I recall, the Adobe FDK and hence FontLab do not support this yet. I use it in Arabic fonts.</p>
    html_clean: |-
