      <p>"Kerning" is the manual adjustment of space between two individual letters. The overall spacing of a word or title or whatever is, well, the overall "spacing." </p>
      <p>So, for instance, in the comment Bruce just made (and not to pick on Bruce in particular, just by way of example), I would say, "<em>spacing</em> for an outdoor board must be wider than for a brochure you're holding two feet from your face."</p>
      <p>So, what is good kerning? Good kerning is that kerning which makes spacing visually consistent (as Bruce also said, basically). Wat is "visually consistent"? Ahh, well now, there you get into the realm of some subjectivity.</p>
      <p>If a typeface is spaced well, and depending upon the combination of letters under examination, a title setting might not need any "kerning" at all. If the spacing of the face is overall consistent and even, but too loose or too tight for the particular application, then that setting might need overall "tracking" or "letterspacing," positive or negative (i.e., adding or subtracting, overall) but no individual futzing (i.e., "kerning").</p>
      <p>-- K.</p>
