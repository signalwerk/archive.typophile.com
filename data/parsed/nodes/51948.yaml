      <p>The fact that there are conditions in which the desired spacing between a pair of letters might differ from that in other conditions is beside the point. That is already the case, and yet we still find it worthwhile to put kerning in fonts. What I described is what seems to me the best approach to automating aspects of what currently requires considerable man-hours while not obviating all the experience and knowledge that a good kerner brings to the job. I know, when I am kerning, that the decisions I make for some pairs have direct implications for other pairs; ergo, it makes sense that if a program can capture those implications and apply them, it can save a lot of time.</p>
      <p>Of course, all this still presumes the current, inherited sidebearing/kerning model.</p>
