      <p>PLEASE IGNORE MY PREVIOUS POST, WHICH DOESN'T MAKE MUCH SENSE UNLESS CLARIFIED WITH SOME ADDITIONAL THOUGHTS THAT I HAD IN MY MIND, BUT FAILED TO SPELL OUT IN THE TEXT. HERE IS A REVISED (A SLIGHTLY EXPLADED VERSION):</p>
      <p>Kerning/letter-spacing is something that conscientious typographers &amp; designers, as well as type designers &amp; typesetting system programmers will always struggle over, because there are various approaches that can be taken.</p>
      <p>When a typographer/designer is working with a line or two of display copy and is using typefaces that have relatively heavy thin-strokes, it generally works well to try to visually balance the space on each side of the characters and to try to have the inter-character space throughout the text to appear more-or-less even.</p>
      <p>On the other hand, when fonts have very light thin-strokes (as in the Sienna Italy sample above), it becomes necessary to also take into account the visual space WITHIN the characters, as well as the space on either side of them.</p>
      <p>What to do with the vast array of fonts that fall in the middle, is where the art of kerning, and the individual taste of the typographers/designer comes in.</p>
      <p>Somewhat congruently, when a type designer is setting up the overall kerning for a font, or a typesetting system programmer is devising the kerning algorithm that will output large blocks of text, he or she can choose either to focus primarily on the negative space around the characters or to draw an imaginary line down the center of each character and try to visually balance the space on each side of the character (sometimes called “optical letter-spacing”). Both approaches produce text that appears fairly evenly spaced, even though the resulting spacing is somewhat different — and those who prefer one approach will generally not care for the results of the other.</p>
      <p>The end result of all this is that even when you try to carefully kern your type, you can be never be certain of satisfying everyone — but that doesn’t mean that we shouldn’t make every effort to do so.</p>
