      <p>Kerning/letter-spacing is something that conscientious typographers/designers will always struggle over, because there are multiple approaches that can be taken.</p>
      <p>With typefaces that have relatively heavy thin-strokes, it generally works well to try to visually balance the space on each side of the characters and to try to have the inter-character space throughout the text to appear more-or-less even.</p>
      <p>On the other hand, when fonts have very light thin-strokes (as in the Sienna Italy sample above), it becomes necessary to also take into account the visual space WITHIN the characters, as well as the space on either side of them.</p>
      <p>To further complicate things, you can choose to focus primarily on the negative space around the characters or you can draw an imaginary line down the center of each character and try to visually balance the space on each side of the character (sometimes called "optical letter-spacing"). Strange to say, both approaches produce text that appears even spaced, but with difference spacing -- and those who prefer one approach will generally not care for the results of the other approach.</p>
      <p>The result of all this is that even when you try to carefully kern your type, you can be certain of never satisfying everyone -- but that doesn't mean that we shouldn't make every effort to do so.</p>
