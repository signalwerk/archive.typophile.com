      <p>I don't think the terminology for spacing is totally fixed. There are different things you can do in different applications to adjust the space between letters. In FontLab you can set the side bearings--their distance from the extreme left and right of the black. You can also specify kerning: the further adjustment of specific pairs. In InDesign you can globally increase or decrease space between letters--tracking. And you can adjust spacing between specific letters--kerning. As I understand it, in Quark Express, you can also globally adjust pairs, such as AV. </p>
      <p>In adjusting the spacing of a title people usually say 'kerning' but whichever way you slice it it's a species of spacing.</p>
