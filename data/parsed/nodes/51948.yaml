      <p>What makes kerning good is that it is <em>visually consistent</em>, be it tight, wide, or in between. It should also be <em>appropriate to the application</em>--kerning for an outdoor board must be wider than for a brochure you're holding two feet from you face.</p>
      <p>Ron Arnholm (studied under Rand at Yale), designer of Legacy and Legacy Sans was my typography teacher at the University of Georgia. Not only did he have us squint, but he had us look at the type upside, backward, and upside down and backward. That practice has served me well.</p>
