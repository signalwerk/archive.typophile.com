      <p>Your definition of kerning is too broad and at odds with its traditional meaning. In developing fonts, kerning is used to correct pairs of characters for which the standard spacing is not sufficient. These pairs are <em>exceptions</em> to the normal spacing of a font. </p>
      <p>Check out these screen snaps from Adobe Illustrator:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/tracking_3802.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/kerning_6352.jpg"></div><p></p>
      <p>The first image shows that this text is <em>tracked</em> 60 units and that the kerning is set to "auto", meaning that the font's built-in kerning pairs will be used. The second image shows that the "T" and "e" are kerned -71 units. In other words, this text has both tracking and kerning applied. If you call them both kerning, you'll go crazy trying to figure out what's going on.</p>
      <p>Spacing is simply the normal spacing of a font.</p>
      <p>Kerning is an exception to normal spacing between two characters.</p>
      <p>Tracking alters the spacing of a range of characters, separate from and in addition to any kerning between pairs in that range.</p>
