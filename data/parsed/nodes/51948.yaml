      <p>All analogies break down under close comparison, because they’re analogies.<br>
      I wasn’t suggesting a close correspondence across the board, merely one common principle!</p>
      <p>The classical score is ﬁxed, just as letter shapes are.<br>
      Notes are like letters, spaced in time.<br>
      In that respect, performance corresponds to setting type.<br>
      That’s all.</p>
      <p>One doesn’t expect the music maestro to imitate a player piano, so why should the type maestro use default “Metrics” or InDesign’s “Optical” spacing for display when manual kerning is available?</p>
      <p>There is even the option of custom kerning a font in Quark XPress. </p>
      <p><em>…there are hardly any unique creative approaches to kerning.</em></p>
      <p>Manual kerning is always unique to the individual doing it.<br>
      It doesn’t have to follow a deﬁned methodology, it’s more a matter of individual taste and expression. </p>
      <p>(However, as an exception to the rule, I have managed to employ one completely brain-dead method, in <a href="http://www.myfonts.com/fonts/shinn/softmachine/" rel="nofollow">Softmachine</a>, in which the closest proximity between every glyph combination is equalized.)</p>
