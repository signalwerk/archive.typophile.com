      <p>@Nick Shinn:<br>
      <cite>You might just as well say there is an ideal way to play a classical music composition.</cite></p>
      <p>While this is an important point, and it is applicable to font design in general and kerning in particular too, I'm not so sure <em>how</em> applicable it is in the current situation.</p>
      <p>There is too much bad kerning out there, and there are hardly any unique creative approaches to kerning. Type design and typography are arts as well as crafts, but they do lie on a different point in this continuum than musical performance.</p>
