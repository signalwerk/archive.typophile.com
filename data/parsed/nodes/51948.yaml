      <p>In the example of the E and A, a problem here is that the 'falling over' italic A of Caslon (and other faces?) often works very nicely with lower case, but is generally problematic in all caps. You end up having to do compromises, as Charles writes--but they never really work as well as you would hope.  </p>
      <p>In my new Caslon revival (soon, soon!) there is an alternative italic A that works better with all caps, and automatically substitutes when choosing open type "all caps". </p>
      <p>This is illustrative of a general point that glyphs need to be designed to space well; it doesn't just happen. </p>
      <p>And yes, my experience is also that going away, and coming back later for a fresh look helps.</p>
