      <p><em>Maybe kerning could be reduced to programmable numbers, if we only knew enough.</em></p>
      <p>The tricky aspect of automating kerning is determining how much knowledge is enough, given that the amount of knowledge required is likely to vary from design to design. A few years ago, at dinner with some of the clever folk from URW, I outlined how I thought an automatic kerning tool should work: it would accept iterative 'knowledge' from the designer, starting from a set of spacing for key glyphs that are determined by the designer not to need kerning. Then the program runs and presents the designer with a proposed set of kerning, at which point the designer can look at individual pairs and say 'No, this kind of combination should be more like this...'; then that adjustment becomes additional knowledge in the next pass of the program. In other words, the program doesn't seek to replace the informed eye of the designer, but to capture what the designer thinks is appropriate to the design and apply it across the glyph set. To my knowledge, no one has built this yet.</p>
    html_clean: |-
