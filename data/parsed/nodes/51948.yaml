      <p>Eric, your eye is right on. </p>
      <p>I agree with all the issues you've pointed out on these samples.</p>
      <p>I think kerning is overlooked by many designers, and sometimes it slips by me as well. But, I'm not surprised by this, I've seen poor kerning on book covers, logos, etc. I guess it's something that younger designers aren't trained to pay attention to. Maybe there's an assumption that the computer will do it correctly. </p>
      <p>As far as working on kerning, it's easy to get lost after a while, since you can adjust between two letters, which affects another pair, and so on. I think the best thing is to work on it for a bit, then step away. In my earlier days I remember working with an art director who had me kern a headline for an entire afternoon.</p>
