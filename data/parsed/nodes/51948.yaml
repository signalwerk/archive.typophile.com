      <p><cite> &gt; if you use “kerning” to mean the spacing between glyphs that a typographer does in a setting, what do you call the activity that a type designer does in a font?</cite></p>
      <p>Hrant, in my opinion, they are essentially the same thing. Both are kerning. Both activities, whether by type designer in the course of developing the font or by the typographer in the course of fine-tuning a particular setting, are "kerning" -- that is, they are creating pair-specific exceptions/overrides to the basic spacing of the glyphs.</p>
      <p>The only significant difference is that one is done at a systemic level, the other is situational.</p>
      <p>When the type designer does it, the result is the set of kerning pairs built into the font. When the typographer does it, then you could call it "manual kerning."</p>
      <p>-- K.</p>
