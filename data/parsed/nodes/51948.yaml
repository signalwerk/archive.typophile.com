      <p>I'm obviously young, but when I hear letterspacing, I think of the equidistant value of space between the letters.</p>
      <p>When I hear kerning, I think of the individual space between two specific letters.</p>
      <p>For me to adjust letterspacing, would make all the letters closer or farther apart at once, but kerning is the manual manipulation of the space between 2 letters, while leaving the other untouched.</p>
      <p>Am I wrong?  These definitions seem to be in line with what I read, and they certainly aren't interchangeable in my eyes, they represent two very different concepts...</p>
