    html: <p>In the case of Perpetua, I’d ask Monotype’s British office because that’s the foundry where Perpetua actually comes from. I’ve had several students who wanted to have certain typeface families for their student projects. In most (if not all) cases they got a kind of student license from the foundry. Some of the foundries wanted to see something of the project in advance. Others came up with a licence agreement which allowed the student to use the typeface for the time they were a student only.</p>
