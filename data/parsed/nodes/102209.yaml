      <p>I don't think any Kubrick film has generated as many theories about hidden meanings as The Shining did. </p>
      <p>Most of them, in my opinion, are rather wacky, and in some cases try to draw meaning from continuity bloopers and other normal oddities of filmmaking (like interiors not matching exteriors), but they are interesting none the less. </p>
      <p>Matt, you've probably seen this already, but there's an interesting video shot by Kubrick's daughter about the making of the movie. I think it's also available on YouTube.<br>
