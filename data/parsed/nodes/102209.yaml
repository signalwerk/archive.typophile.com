      <p>I've never seen the shorter version, but I've read that Kubrick tightened up the film after its initial release in the U.S. and considered the shorter version to be better.</p>
      <p>He did something similar with 2001, making it shorter after seeing audience reaction to the first few showings, but I don't think the original, longer version of 2001 is available anywhere.</p>
