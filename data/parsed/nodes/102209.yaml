      <p>Thanks so much for all the input everyone.<br>
      Special thanks to Chris Dean for the contact information I will get on that first thing tmrw!</p>
      <p>@hrant The theme of Freud's 'The Uncanny' places a lot of emphasis on mirror images, symmetry and body doubles, as far as my limited knowledge goes I had a good think about how I could make fonts relate to both the subject matter of Stanley Kubrick and his films and also Freud's essay. I chose Futura because not only is it Kubrick's favourite font but it also has a lot of symmetry in the letterforms. I was reluctant to say because I'm sure someone's going to tear me a new one for stating that my tutors have encouraged me to pick recognisable 'common' fonts and distort them slightly in fontographer to create and Uncanny effect (ie recognisable but something is not quite right). As far as Perpetua goes, (I've always been slightly entertained by the story of Eric Gill's debauchery) but the addition that the typeface was designed in the year of Stanley Kubrick's birth was a coincidence I was rather proud of stumbling across. I must say part of what influenced my decision also was meeting the RCA grads Murray &amp; Sorrell of Fuel design and seeing how they had put Purpetua to use for their work on the Chapman Bros publication Bedtime Tales for Sleepless Nights. In my own opinion theres a sorted of a twisted logic to the use there and it always stuck in my mind as looking fantastic in that book: <a href="http://fuel-design.com/media/uploads/thumbs/uploads/homepage/10-11_jpg_460x306_q95.jpg" title="http://fuel-design.com/media/uploads/thumbs/uploads/homepage/10-11_jpg_460x306_q95.jpg">http://fuel-design.com/media/uploads/thumbs/uploads/homepage/10-11_jpg_4...</a></p>
      <p>Having said all this, I do of course value the opinions of everybody here so if you have any other suggestions I am very open to hearing them at this stage!</p>
      <p>Also I agree with this "I love systems and despise happenstance." Hence my choices, I always make an effort to make as many connections as I can when choosing typefaces :)</p>
