    <p>Hello I'm new to the forum, long time reader, first time poster.<br>
    I'm a Graphic Design student producing a publication about The Shining, in relation to Sigmund Freud's seminal paper The Uncanny, as my end of degree project. I've thought long and hard about what typefaces are most appropriate to produce the book and concluded that Futura [Kubrick's favourite font] and Perpetua [designed the year he was born] would work really well for this project. Obviously I want to utilise Perpetua's wonderful open type features, discretionary ligatures, small caps etc but I'm finding the family package price range a little out of my budget. Can anybody here please tell me if Linotype offers a student licensing discount?<br>
    Thanks in advance, all the best<br>
    Matt</p>
  html_clean: |-
