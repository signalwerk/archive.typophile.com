      <p>Design</p>
      <p>Throughout our creative lives we [Lella, my wife and professional partner, and I] have sifted through everything to select what we thought best. We sifted through materials to find those for which we have the closest affinity. We sifted through colors, textures, typefaces, images, and gradually we built a vocabulary of materials and experiences that enable us to express our solutions to given problems—our interpretations of reality.</p>
      <p>It is imperative to develop your own vocabulary of your own language—a language that attempts to be as objective as possible, knowing very well that even objectivity is subjective.</p>
      <p>I love systems and despise happenstance.</p>
      <p>I love ambiguity because, for me, ambiguity means plurality of meanings. I love contradiction because it keeps things moving, preventing them from assuming a frozen meaning, or becoming a monument to immobility.</p>
      <p>As much as I love things in flux, I love them within a frame of reference—a consistent reassurance that at least and at last I am the one responsible for every detail.</p>
      <p>And that is why I love Design.</p>
      <p>Massimo Vignelli, “Conclusion,” The Vignelli Canon<br>
      <a href="http://www.vignelli.com/canon.pdf" title="www.vignelli.com/canon.pdf">www.vignelli.com/canon.pdf</a></p>
