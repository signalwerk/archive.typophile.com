      <p>Can be wrong but, even if most of modern fonts have alternates letters available through OpenType features, I really doubt  it could be a font, more a handwriting. When looking closely to all repeating letters, none appear to be perfectly identical.<br>
      Some in the same vein: <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/bickham-script-mm/" rel="nofollow">Bickham Script</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/parachute/pf-champion-script-pro/" rel="nofollow">Champion Script</a>, <a class="freelinking external" href="http://www.myfonts.com/search/Sackers+script" rel="nofollow">Sackers Scripts</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/pansy-bo/" rel="nofollow">Pansy Bo</a></p>
