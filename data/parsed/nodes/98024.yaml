    html: <p>Agreed. You shouldn’t be thinking about design and fonts before you settle on a name. Asking typographers to name your studio is misguided. I would stop designing and simply make a list of names bassed on your context and their semantic associations. Once you have gotten that nailed down, produce a few concepts. <em>Then</em> it would be be appropriate time to ask for feedback and guidance. The more legwork you do in advance, the better the feedback you will receive.</p>
