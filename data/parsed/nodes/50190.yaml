    <p><a href="http://web.me.com/laurentbrett/FILMS/HOSTAGE.html" title="http://web.me.com/laurentbrett/FILMS/HOSTAGE.html">http://web.me.com/laurentbrett/FILMS/HOSTAGE.html</a></p>
    <p>What is the typeface of the actors’ names?</p>
    <p></p><div class="imageWrap"><img src="/files/hostage_4959.gif"></div><p></p>
    <p>Type Navigator gave me David Berlow’s Rhode Black Extended and Titled Gothic Extended Black. Close, but not it — the mystery font’s diagonal legs of the K and R curve up.</p>
    <p>I just saw this and 20 other choice title sequences at the Mill Valley Film Festival’s presentation, “Typecast,” with designer David Peters. He couldn’t recall the name of this typeface.</p>
    <p>Thanks.</p>
