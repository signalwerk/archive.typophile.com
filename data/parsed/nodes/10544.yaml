  - id: 66413
    user: 1014
    date: 2002-01-25T19:37:00
    date_raw: 25 Jan 2002 — 7:37pm
    votes: null
    html: "<p> I'm not a pro designer per se, though I did study at the Royal Academy of Barnes and Noble.** <br> <br>Soren's probably right about these guys, that they're trouble because they don't get it. That's the challenge for somebody: to communicate to them the power of proper identity. If they keep saying 'hint, hint' to you, then blow 'em off. <br> <br>But not for me. I design T-shirts, among other things. My wife and I own our own company in the apparel business. <br> <br> <br>Also, I wasn't suggesting a complete identity package for $500.00. But if you can knock out a LOGO in an hour, would you take $500.00 for it? <br> <br> <br>Mart, aren't you in the restaurant biz <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br> <br> <br>bj <br> <br>** No longer an accredited school. </p>"
