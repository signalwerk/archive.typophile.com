    html: "<p> My personal rule: never participate in design  <br>'contests,' unless you enjoy being exploited.  <br>(I'm not talking about awards shows, these  <br>are two different things.) <br> <br>BJ says: <br>\"Maybe some enterprising typophile can  <br>contact them and pitch an identity package.\" <br> <br>Forgive my pessimism, but your first clue  <br>should be their line: \"and we're willing to pay  <br>for it.\" When they call the plumber do they say,  <br>\"Congratulations! You have the distinct  <br>pleasure of fixing my clogged drain. And if you  <br>do it right I'll give you a plaque and a cash  <br>bonus worth a third of your normal fee.\" <br> <br>Based on their 'call for entries,' they don't  <br>understand the value (nor the price) of design.  <br>Do you really want to work with a client like  <br>that? <br> <br>//joe </p>"
    html_clean: "<p> My personal rule: never participate in design  <br>'contests,' unless you enjoy being exploited.  <br>(I'm not talking about awards shows, these  <br>are two different things.) <br> <br>BJ says: <br>\"Maybe some enterprising typophile can  <br>contact them and pitch an identity package.\" <br> <br>Forgive my pessimism, but your first clue  <br>should be their line: \"and we're willing to pay  <br>for it.\" When they call the plumber do they say,  <br>\"Congratulations! You have the distinct  <br>pleasure of fixing my clogged drain. And if you  <br>do it right I'll give you a plaque and a cash  <br>bonus worth a third of your normal fee.\" <br> <br>Based on their 'call for entries,' they don't  <br>understand the value (nor the price) of design.  <br>Do you really want to work with a client like  <br>that? <br> <br>//joe </p>"
