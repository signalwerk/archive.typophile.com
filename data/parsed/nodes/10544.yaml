    html: '<p> You guys are right. <br>The only way to get anything out of this is to: <br>1. Do the entire identity system, not just the logo. <br>2. Do it for free. <br>3. Milk the fact that you were "commissioned" to do the identity design for a company... <br> <br>But this *only* makes sense for somebody who has yet to make a name for himself in identity design - a very different animal than type design and multi-media design (in my case). <br> <br>hhp </p>'
