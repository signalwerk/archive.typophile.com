      03AE	GREEK SMALL LETTER ETA WITH TONOS<br>
      1F75	GREEK SMALL LETTER ETA WITH OXIA<br>
      </code><br>
      The character 1F75 is in a block containing precomposed polytonic Greek characters. Maybe one of those two characters is missing from your font.<p></p>
