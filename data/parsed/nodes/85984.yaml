  html: |-
    <p>I use a greek polytonic font without latin glyphs. During adding (in MS-Word) an accented vowel in a preformated (in the above font) text, font changes to Courier or Times New Roman. Is there something wrong with the font or the OS (Windows/MacOSX)?<br>
    Kostas Siskakis</p>
    <p>Anagrafi</p><div class="imageWrap"><img src="http://typophile.com/files/KSBouletee_problem_6041.png"></div><p></p>
