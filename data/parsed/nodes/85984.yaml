    html: |-
      <p>If something is missing from the font that is generated, you should be able to know from the .ttx file generated by ttx. Here is a rudimentary script that I wrote to find some attribute values and their paths:</p>
      <pre>import sys, xml.parsers.expat

      path = []
      def disp(path):
        indent= ''
        for a in path:
          print "%s%s" % (indent, a)
          indent = indent + '&gt; '
        print ''

      def start_element(name, attrs):
        global path
        found=False
        entry=[name]
        for a in attrs:
          entry=entry+[ [a, attrs[a]]]
          if attrs[a] in search:
            found=True
        path=path+[entry]
        if found:
          disp(path[1:])
      def end_element(name):
        global path
        path.pop()

      p = xml.parsers.expat.ParserCreate()
      p.returns_unicode=0
      p.StartElementHandler = start_element
      p.EndElementHandler = end_element

      file=open(sys.argv[1])
      search=sys.argv[2:]
      p.ParseFile(file)
      </pre><p>If the text above is copied and put in a file named <code>pathatt.py</code> and if you have some .ttx file, say DejaVuSans.ttx, then </p>
      <pre>python pathatt.py DejaVuSans.ttx etatonos 0x3ae 0x1f75 uni03AE uni1F75
      </pre><p>will search the .ttx for occurrences of etatonos, 0x3ae, etc. You need to know exactly the attribute strings that should be in the file: for instance, there is no leading zeros for hex numbers and they are lower case.</p>
      <p>By comparing the output with the output from a font that is working fine, maybe you can locate the problem.</p>
      <p>Michel</p>
