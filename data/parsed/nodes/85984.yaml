      <p>There are two very similar looking characters in the unicode charts, 03AE and 1F75:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/tonos-oxia_5634.jpg"></div><br>
      <code><br>
      03AE	GREEK SMALL LETTER ETA WITH TONOS<br>
      1F75	GREEK SMALL LETTER ETA WITH OXIA<br>
      </code><br>
      The character 1F75 is in a block containing precomposed polytonic Greek characters. Maybe one of those two characters is missing from your font.<p></p>
    html_clean: |-
      <p>There are two very similar looking characters in the unicode charts, 03AE and 1F75:<br>
      </p><div class="imageWrap"><img src="/files/tonos-oxia_5634.jpg"></div><br>
