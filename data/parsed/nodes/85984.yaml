    html: <p>A similar problem with U+0162 and U+0163 was reported in 2007 with Myriad pro (<a href="http://typophile.com/node/36473#comment-222688" title="http://typophile.com/node/36473#comment-222688">http://typophile.com/node/36473#comment-222688</a>) on the Macintosh. I don't know if such things can still occur but the solution was to rename the characters as uni0162 and uni0163.</p>
    html_clean: <p>A similar problem with U+0162 and U+0163 was reported in 2007 with Myriad pro (<a href="/node/36473/#comment-222688" title="http://typophile.com/node/36473#comment-222688" class="link-kept">http://typophile.com/node/36473#comment-222688</a>) on the Macintosh. I don't know if such things can still occur but the solution was to rename the characters as uni0162 and uni0163.</p>
