  html: |-
    <p>I’m looking for some opinion on a choice of font for a book of poems. The mood of the book is somewhat despondent; poems of death, holocaust, graveyards, historical references to gruesome battles and struggles of faith. I’m thinking along the lines of Vendetta. Minion is too generic, Warnock is too happy. Fairfield is nice but it feels too much like old literature.</p>
    <p>I guess I want something with a just bit of an edge to it, but not so much as to distract from the reading.</p>
    <p>It’s a book of poems, not a novel, so pure function isn’t so important.</p>
    <p>Tell me if you think Vendetta, or someting like it might work. Any other suggestions are welcome!</p>
    <p>Thanks</p>
