      <p>Vendetta seems like quite a good choice. But I’m also getting this feeling that you need two distinct voices: something coarse but well-proportioned like Vendetta; but also something clinical and austere, like a Didone, an old-fashioned one, somewhat archaic, maybe turn-of-the-century French. As G W Ovink said*, “Bodoni is an admirable letter for a death notice!” The trick though would be choose two fonts that both contrast and match.</p>
      <p>* Actually, that’s a collage of two of his phrases.</p>
      <p>hhp</p>
