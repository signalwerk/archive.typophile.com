      <p>It’s hard so say what genre not knowing a great deal about poetry. From what I’ve read so far, it’s not gothic, or dark really, yet the poems are about death and stuff. It’s more like he’s writing about these things from a distance, honestly, but with a certain degree of animosity. </p>
