    votes: null
    html: "<p>Uh, uh, depression is such an ambigue word. Step out of \"psychoanalitic\" language and in general you'll see it's a signal of needed internal growth. <br> <br>I don't want to sound superficial: almost all the few typefaces I have on sale (except the initial Ottomat, in part, and the latter Ogilve) were designed in a constant state of disgust and continuous doubt. As I was working of them (and in many moments I gave up) they seemed just worthless and ugly. <br>Only after regaining balance I became able to look at them objectively, and see what was good in them. <br> <br>My only advice (which is probably the best I always received from many people) is to finish each thing you start, no matter how ugly or senseless it may seem. <br>It's not easy (I'm rarely able to do so myself) but it's the only way to reacquire a critical perspective.</p>"
    html_clean: "<p>Uh, uh, depression is such an ambigue word. Step out of \"psychoanalitic\" language and in general you'll see it's a signal of needed internal growth. <br> <br>I don't want to sound superficial: almost all the few typefaces I have on sale (except the initial Ottomat, in part, and the latter Ogilve) were designed in a constant state of disgust and continuous doubt. As I was working of them (and in many moments I gave up) they seemed just worthless and ugly. <br>Only after regaining balance I became able to look at them objectively, and see what was good in them. <br> <br>My only advice (which is probably the best I always received from many people) is to finish each thing you start, no matter how ugly or senseless it may seem. <br>It's not easy (I'm rarely able to do so myself) but it's the only way to reacquire a critical perspective.</p>"
