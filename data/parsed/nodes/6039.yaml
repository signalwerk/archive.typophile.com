    html: "<p>Mr. Alessandro Segalini: <br> <br><i> &gt; would you dare to say that God is not perfect?</i> <br> <br>Perfect in the sense that the distinction between perfection and imperfection is ultimately meaningless, which is not the sense I was employing. Of course before there were yin and yang there was the undifferentiated tao, and ji pervades all. <br> <br>On the subject of whether God is perfect, consider this passage from the NY Times, which suggests that we may in fact be inhabiting a universe of one of the lesser gods (sorry to sidetrack the conversation, but this is too remarkable a quote to pass up). The context is a campaign appearance by Bush in Florida: <br> <br><i>In Niceville, Mr. Bush's appearance took on the air of a revival meeting as the audience chanted affirmation to his description of the rationale for his antiterror efforts and roared at any religious reference. Gary Walby, a resident of nearby Destin, told the president during a question-and-answer session that though he always voted Republican, \"this is the very first time I felt God was in the White House.\"</i> <br> <br>(But don't get depressed. Really.)</p>"
