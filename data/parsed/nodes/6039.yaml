    html: "<p>&gt; what was a lowpoint? <br> <br>Losing electricity halfway into writing a program on my C64? I guess not. Worse still was when the fighting was so bad around our building that we'd have to go down to the bomb shelter. Usually I could convince my parents that we were essentially safe in this central room in our 6th floor apartment*, but I remember the time my mother went to the kitchen to get some hot water for tea, and the light from the candle she was holding attracted an RPG straight into the laundry room next to the kitchen. We all ran to her, she was OK, but then a second one hit the division between our floor and the lower floor - basically half a meter higher and we would of all been toast. We were all deaf for a few minutes. Then my father glared at me and said \"We're going down to the shelter now\"... But that was just a bit frightening, not a \"lowpoint\". The major lowpoint was when a close uncle got assasinated. His son recently wrote a great book, though - I highly recommend it: <br><a href=\"http://images-eu.amazon.com/images/P/0743222830.01.LZZZZZZZ.jpg\" target=\"_blank\">http://images-eu.amazon.com/images/P/0743222830.01.LZZZZZZZ.jpg</a> <br> <br>* Some of my best work painting D&amp;D miniatures was done by candle-light in that room, with Kalashnikovs and mortars raging in the neighborhood, with the beautiful, primordial prayers from the mosques blasting to encourage the fighters. <br> <br>My theory is that you miss <i>anything</i> that happened during your childhood. And if your childhood was messed up, that simply results in you having a messed up sense of what's healthy. <br> <br>hhp <br></p>"
