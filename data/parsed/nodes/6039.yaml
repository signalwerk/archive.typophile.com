    html: <p>Mr. Tom Christensen, grazie, writing that "nothing is perfect" <br>you made me think that the problem is not if there's or not <br>something perfect -- in typographic design as well as under <br>other human perspectives &amp; relations. <br>This link is interesting <a href="http://seeing.nypl.org/" target="_blank">http://seeing.nypl.org/</a> <br>but would you dare to say that God is not perfect? <br>It is also interesting to note that the actual Greek root <br>of the word 'problem,' namely, 'probalein,' means 'to throw' <br>or 'to thrust forward.'  <br>Problems are the very means by which God drives us forward. <br>Without problems, there would be no growth. <br>So, the problem is not if something is "not perfect:" <br>I'd advice to try hard to seek for where and when to act. <br>I'm saying that if you love a flower which is upon a star <br>then the night is gonna be sweet, looking at the sky. <br>AS <br><img src="http://www.typophile.com/forums/messages/30/42688.jpg" alt=""></p>
