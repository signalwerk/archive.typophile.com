    html: "<p>Ivan -- some words of advice from an abuelo who has been involved in every way to get ink and color on paper for 55 years. My late colleague and fellow member of the National Cartoonists Society, Charles Schulz, suffered from severe depression despite the fact that he made the Forbes list of the richest people in the world. Clinical depression is a medical condition that should be treated.  Occasional depression is something else. Perhaps we take ourselves too seriously at times and that we should find ways to lighten up. I'm sure Mr. Lozos, who was in Vietnam would agree, that there are so many more opportunities to enjoy life when one isn't being shot at. Even then, things could always be worse, no matter the present situation. Descartes, a brilliant mind of the enlightened 17th century, said: I think,  therefore I am. It may sound trite to you but it works. I hope this helps. Good luck. <br>PG <br><a href=\"http://giam.typepad.com/the_branding_of_polaroid_/\" target=\"_blank\">http://giam.typepad.com/the_branding_of_polaroid_/</a></p>"
