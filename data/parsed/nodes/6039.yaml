    html: <p>I myself have gone through a major depression due to my obssesive nature about design,typography and life. So much so, that all sense of rationale and logic was lost in my wee little brain. I was forced, by my own mind, to stop designing all together(and go fishing <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> ). Once I did that, the design bug came back to bite me in the ••• a year later. I learned a great deal about myself when I was depressed. The main thing I realized is that I am sad some days and happy others. As I have gotten  a little older I have learned to embrace the depression. I feel sad when I am sad. I feel happy when I am happy. Don't suppress your feelings. Breathing (and Design) ultimatey will make you feel alive. Alive doesn't have to be happy or sad it can be both....Enjoy both. This is just my personal expierience. Everyone is different, but judging from this thread, alot of us are the same. Let pain and joy guide you simultaniously.  All the best <br> <br>DG</p>
