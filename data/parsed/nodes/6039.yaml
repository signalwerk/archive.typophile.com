    html: <p>&gt;&gt;I get obsessive about details and then wonder if anyone will ever nottice them.  <br> <br>Yep. <br> <br>&gt;&gt;almost all the few typefaces I have on sale (except the initial Ottomat, in part, and the latter Ogilve) were designed in a constant state of disgust and continuous doubt. <br> <br>Agreed. <br> <br>I am in an interesting place. People come in wanting "business cards printed". Totally unaware of design. I could just slap something up, shudder and print it. But it is much more exciting trying to explain in 5 mins or less what I can do that is much better. It might cost a little more, but the business card will be better for it. I feel like this is the front line, as it were. Sometimes I get waverings of depression thinking "Garrgh, no-one cares!" but choose to ignore it and get stuck in. I like the challenge of severe time restraints now, quoting and charging accurately are very interesting. I was also afraid that my type desiging time will get eaten into, but have decided to do some of my proofs on small signage jobs! Pretty cheeky, but I reckon it will be effective. </p>
