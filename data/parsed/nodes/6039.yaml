    html: "<p>Question: what do you do when you have creative block or are depressed?  <br> <br>When I'm particuIarly happy with something, I have a tendency to let criticism put me in such a black mood that I'm unable to continue. And blocks happen all the time! <br> <br>The old standbys help: mow the lawn, wash the dishes, go for a drive or a walk, putter aimlessly with a personal, pet project. Ideas seem to come best when you're not trying, not trying to \"work.\" <br> <br>I know what you mean by not being satisfied. I tend to think that nothing is ever finished and that there's always room for improvement. Thank god for deadlines. <br> <br>yes, good luck, don't settle but don't give up, either. <br> <br></p>"
