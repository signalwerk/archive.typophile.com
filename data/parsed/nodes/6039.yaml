    html: <p>I tend to doubt about myself when facing a challenging project. I start to digress between design books and magazines, look at some top design studios portfolios and to repeat my ideas over and over again in sketches. I get obsessive about details and then wonder if anyone will ever nottice them. <br> <br>I know that if I were more self confident I could have much better ideas and feel satisfied by my work. But I could go forever with a design project and never feel satisfied with it so then I complete the work when I realize the deadline is getting close. Ego is so compromised in design. <br> <br>I liked both Oglivy�s and Luke�s phrases.</p>
