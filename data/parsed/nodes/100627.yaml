  html: |-
    <p>We've put some automated anti-spam measures into Typophile recently, and the good news is that it is really helping keep the spammers at bay. </p>
    <p>However, a lot of you seasoned Typophiles are getting legitimate posts flagged by the spam engine. As frustrating as this is, we're going through an essential period of training the engine to know which comments are legitimate and which are not. Bear with us, and this will soon be behind us. </p>
    <p>If you are seeing specific patterns about why your posts are being flagged, please share them below.</p>
    <p>Thanks-</p>
  html_clean: |-
