      <p>&gt; new users will post multiple times, not<br>
      &gt; understanding what is happening</p>
      <p>Yes that can happen, but you can reduce it by explaining the delay clearly to the poster. I've posted at sites where you get an automatic message like: "Your post will appear after it's approved by a moderator (usually within 24 hours)". But posts from whitelisted accounts actually appear immediately, it's only the new member posts that get reviewed.</p>
