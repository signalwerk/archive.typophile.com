    <p>Hello, this is my first post in here, and let me tell you that I'm from Argentina and I'm a huge fan of typefaces. Sorry for my english, is not that strong sometimes.</p>
    <p>I look into the Hoefler &amp; Frere-Jones website (by the way, I sent an email about this thread to them too) and I saw them recommendation for the use of their fonts.</p>
    <p>I tried myself on photoshop, but my example doesn't look with that well-finished as H&amp;F example, mine looks blurred or with more smooth than the H&amp;F example. </p>
    <p>Check in here:<br>
    <a href="http://farm4.static.flickr.com/3524/3286395821_f762c90201_o.jpg" title="http://farm4.static.flickr.com/3524/3286395821_f762c90201_o.jpg">http://farm4.static.flickr.com/3524/3286395821_f762c90201_o.jpg</a></p>
    <p>I tried with unsharp features, high-pass filters, inner shadows, I can do something very similar, but not with that high well-finished, I'm sure that there should be a good technique or I'm missing something in the way, so if anyone can send me some tips about this, it could be great.</p>
    <p>Thanks in advance.</p>
