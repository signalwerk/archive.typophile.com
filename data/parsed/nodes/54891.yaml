      <p>As Kent mentions, if you want crisp looking text in Photoshop, make sure you select either "Sharp" or "Crisp" from the anti-aliasing options. Sharp is sharpest, but will distort the letters' geomteries more than Crisp will.</p>
      <p>As for sharpening, "unsharp mask" is a very old sharpening technology that is not very good. I recommend you play around with the "smart sharpen" filter instead to achieve best results. For text at the sizes you are looking at you might try setting it to remove gaussian blur, .8px radius, 30% strength, and "more accurate" enabled.</p>
