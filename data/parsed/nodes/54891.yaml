      <p>The type in the H&amp;FJ samples may not have been set in Photoshop to begin with, but rather in InDesign and then rasterized into Photoshop, either via a PDF or possible even a screen shot. Then perhaps a touch of unsharp mask, as Nick suggests.</p>
      <p>You may also want to experiment with different anti-alias settings in Photoshop -- i.e., 'sharp', 'crisp', 'strong', etc.</p>
      <p>Also, in your sample the color contrast is not as strong, which could also contribute to less distinct edges.</p>
