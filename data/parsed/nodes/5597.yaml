    html: <p>y’know there is a popular New Orleans style restaurant out there called Copelands you should check out. I think they do a great job of design and branding. <br><br>Don’t get sucked into using really over the top display fonts to wrap your brand around. I’ve seen too many Mexican restaurants that use Fajita as their headline … <br><br>I think a nice Jill Bell hand lettering job would be called for. Send her an e-mail … <br><br>My&nbsp;2</p>
