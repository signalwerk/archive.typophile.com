    html: <p>The interior is the older French Quarter baroque/rococo style with a funky twist--ornate furniture, rich textures, and deep colors (at least that's what I'm told). I'm offering help to the designer working on this, and I think he's wanting to incorporate a mask or some other ornamental elements with the type. I feel like he's going for something more sophisticated... <br> <br>As far as I know, the client hasn't offered any demographics.</p>
