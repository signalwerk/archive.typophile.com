  html: <p>Our ﬁrm is working on an id for a restaurant/nightclub with a New Orleans + Mardi Gras theme. While doing research, we were curious about any fonts that may have that feel or be of that location (authentic?). In other words, are there any fonts more speciﬁc to New Orleans and/or the French Quarter? Would something French be appropriate? Any help or ideas would be appreciated. <br><br>Thanks, <br>Addison</p>
