    votes: 0
    html: '<p>Modern typography in the French Quarter is about as easy as ﬁnding type consistency in Times Square. If you want the nostalgic French Quarter look, I’d recommend something hand-lettered with lots of swashes. Ancienne and the Copeland’s  restaurant (<a href="http://www.copelands.net/copelands/copeland.asp" target="_blank">http://www.copelands.net/copelands/copeland.asp</a>) are nice suggestions. Think Herb Lubalin’s serif logotypes with a little less structure. Regardless, those are good suggestions up top. As for logos, here’s the usual fare for the city: Fleur de Lis, crescent, and Mardi Gras&nbsp;masks</p>'
    html_clean: '<p>Modern typography in the French Quarter is about as easy as ﬁnding type consistency in Times Square. If you want the nostalgic French Quarter look, I’d recommend something hand-lettered with lots of swashes. Ancienne and the Copeland’s  restaurant (<a href="http://www.copelands.net/copelands/copeland.asp" target="_blank" class="link-external">http://www.copelands.net/copelands/copeland.asp</a>) are nice suggestions. Think Herb Lubalin’s serif logotypes with a little less structure. Regardless, those are good suggestions up top. As for logos, here’s the usual fare for the city: Fleur de Lis, crescent, and Mardi Gras&nbsp;masks</p>'
