    html: <p>The most commonly seen "Greetings from" fonts on old American postcards like this are <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LH.107913.0.1&amp;attributes.sampleSize=48&amp;sampleText=Greetings+from&amp;sampleSize=48">Brush Script</a>, <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=UR.109890.0.0&amp;attributes.sampleSize=48&amp;sampleText=Greetings+from&amp;sampleSize=48">Kaufmann</a>, and <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=C.106300.0.0&amp;attributes.sampleSize=48&amp;sampleText=Greetings+from&amp;sampleSize=48">Gillies Gothic</a>. The one you have uses Brush Script.</p>
    html_clean: <p>The most commonly seen "Greetings from" fonts on old American postcards like this are <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LH.107913.0.1&amp;attributes.sampleSize=48&amp;sampleText=Greetings+from&amp;sampleSize=48" class="link-external">Brush Script</a>, <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=UR.109890.0.0&amp;attributes.sampleSize=48&amp;sampleText=Greetings+from&amp;sampleSize=48" class="link-external">Kaufmann</a>, and <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=C.106300.0.0&amp;attributes.sampleSize=48&amp;sampleText=Greetings+from&amp;sampleSize=48" class="link-external">Gillies Gothic</a>. The one you have uses Brush Script.</p>
