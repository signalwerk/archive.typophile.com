      <p>@Lynx:</p>
      <p>As for optical vs. metrics kerning, use whatever works best, and don't sweat it. Your font simply has a kerning table that is optimized for a given point size (or, if you aren't charitable, it has a bad kerning table), and InDesign's algorithm does a better job. If the result looks good, it <em>is </em>good. If you want to, you can tweak the kerning yourself, but that takes a lot of work and your font license might not permit doing so.</p>
