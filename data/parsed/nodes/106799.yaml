      <p><cite>I still have a lot to learn here.</cite></p>
      <p>Me too, and I've been at it over 30 years.</p>
      <p>While not an answer based on exhaustive searching (I don't know, for example, what ShinnType offers in a Venetian revivalist mode), take a look at Espinosa Nova.</p>
      <p><a href="http://www.myfonts.com/fonts/estudio-ch/espinosa-nova/" title="http://www.myfonts.com/fonts/estudio-ch/espinosa-nova/">http://www.myfonts.com/fonts/estudio-ch/espinosa-nova/</a></p>
      <p>It appears the roman is still free and the italic $50; you can go a long way with them. To go beyond is essentially the full $400 package, perhaps a bit pricy for a beginner, but we in fact have the entire offering, so I'm familiar with it. Both my company and my wife's have set several books with the fonts; they worked well.</p>
      <p>Yes, it is a modernization of the work of a Spanish priest in the New World. Call it an oldface if you want, but to my eye, the influences are more Venetian than French.</p>
      <p>And Christóbal Henestrosa took the pains to test the fonts with high-resolution offset printing as well as laser printing before publishing them, an important but usually overlooked step.</p>
      <p>The thing that attracted me in the first place was the EULA -- Christóbal allows the end user to modify the fonts, without prior permission, though he does ask to be notified if/when modification work is done. </p>
      <p>Not to say they are bad as published. The x-height is a little taller than with Bembo, but that is in keeping with a 2013 fashion. I think they still need a little more weight, but unlike with Bembo, that is at least arguable. A couple of the characters need work, to my eye, perhaps not to yours.</p>
      <p>All in all, if Bembo (Standard) is an appropriate choice for your book, Espinosa Nova will be better. Whether it is better than Bembo Book, I can't really say. At $50 for the roman and italic, it is certainly cheaper.</p>
