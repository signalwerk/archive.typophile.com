    <p>Hi everyone, first post here.</p>
    <p>I found typophile while looking for some infos about Bembo Std (picked up from the Adobe shop) which I'm using for a book.<br>
    First of all in the Adobe page there's the following statement:<br>
    "Bembo Std family is designed to be used at a text size of 8.0 points"<br>
    So, is it a problem if I set size to 11pt ?</p>
    <p>I also have a little problem with kerning (I'm using InDesign).<br>
    I set "Metric" in the paragraph style (I read "Optical" is not the best choice for text ) but the result is not so good.<br>
    Especially for the "V". The kerning is automatically set to -175 with the result that there's almost no space between the "V" and previous character. </p><div class="imageWrap"><img src="http://typophile.com/files/kerning_4368.jpg"></div><br>
    If I set kerning to "Optical" everything looks better so I'm thinking to switch to that but I'm curious about this strange behaviour.<p></p>
    <p>Any guess?<br>
    Thanks in advance (and forgive my dodgy english!)</p>
