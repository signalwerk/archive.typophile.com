      <p>@ Michael:</p>
      <p>Hmm. Garamonds seem popular. We get in a number of books specified in Adobe Garamond Premier -- you know, the "historical" version of Adobe Garamond.</p>
      <p>I've always found French typefaces like French cars. "Interesting, very Interesting," spoken in your best Arte Johnson voice. Take the Citroën. Now maybe if I were being chauffeured around, I'd think it delightful. But not as a driver. I'd prefer an Italian car. And I prefer Italian type, too, when I'm driving...</p>
      <p>If Bembo is just too tutu, There is always John Downer's Iowan Old Style. Great big honking x-height, and with a little work, wonderful character fit. A little light for text, but they all are, to my eye, so maybe I'm wrong. Intermediate on the x-height is Espinosa Nova.</p>
      <p>Having said all that do you care to show it? (&amp; allowing that "Garalde" can have a lot of different visual interpretations - are you using the term to mean "between humanist &amp; modern"?)  If you can post a link where I can see it, I'd like to take a look. Esp. if it's flavor is more Manutius than Garamond.</p>
      <p>If you were too true to letterpress &amp; wetted paper, it will likely be of no use to us modern folk -- e.g., offset printing on Glatfelter 55 uncoated papers. But if you've reinterpreted it a certain way, it might be interesting, esp to those in scholarly publishing who don't favor the currently fashionable "chunky" letterforms.</p>
      <p>Charles</p>
