    <p>Pilar Cano is a graphic and typeface designer from Barcelona, where she gained her first degree in Graphic Design. During this degree she studied for 6 months at Lahti Polytechnic (Lahti, Finland), where she started to think of the possibility of studying type design.</p>
    <p>In 2006 she graduated from the MA in typeface design at the University of Reading, UK. The same year she co-founded Mídori, a graphic design studio specialised in editorial design. Currently she works on her own as graphic and typeface designer as well as teaching typography at BA level.</p>
    <p>Pilar partially edited and wrote the book typosphere, and has developed custom typeface design projects.</p>
