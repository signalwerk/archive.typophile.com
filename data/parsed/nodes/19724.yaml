      <p>Sebilar&gt; I have to disagree. It depends if the designer has the mental fortitude not to rush through a large undertaking, not to cut corners. I do wish someday I have the brains to make my own typeface though ;O)</p>
      <p>Fredo&gt; um... err, sorry not getting married but I get your point though. Poetica would be appropriate for such an occasion although I tend to prefer Bickham Script for nuptials. However, it does make a nice companion for other texts.</p>
      <p>Conor&gt; This I know. ; ) Linotype has similar advice for Zapfino. Another typeface that I'm just goo-goo-gaga about. Nice quote from da Vinci too.</p>
      <p>My pedantic filibuster on the virtues Poetica are largely rhetorical so back to my original question does anyone have any fonts that they have purchased that they found to be a good 'deal'? You know, bang for your buck!!! Did it have features you were expecting yet delighted you with the bells and whistles of a comprehensive feature set? Tell me about the fonts that made you say "money well spent". You got a lot for what you put out.</p>
      <p>Another for instance... I purchased the entire FontDiner collection for about $130 and I got over 50 fonts to play with- all fun display stuff. Yum! Tell me about things like this... mention foundry's too.</p>
