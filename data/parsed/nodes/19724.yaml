      <p>It is worth it to buy a font from Storm just to get his catalog. I was just told he changes it each year. How cool is that? I'd like to collect the whole set if anyone wants to put them up for bid.</p>
      <p><a href="http://www.haroldsfonts.com/" target="_blank" rel="nofollow">Harold Lohner's CDs are one of the best bargains I've come across</a><br>
      Very nice quality for the buck. Mostly display fonts with full character sets.</p>
      <p>Also what you get for $6 is amazing with <a href="http://www.myfonts.com/fonts/typotheticals/koster/" target="_blank" rel="nofollow">Graham Meade's hot-selling Koster</a><br>
      In fact, most of Graham's Typothetical Fonts are good deals. Make sure you hit "purchase options", since often the price listed is really the price for the family. A nice casual font called Flute says $8, but it is regular and expanded versions, both for $8. Again, you'll find full character sets.</p>
      <p>Some of the <a href="http://www.blambot.com/fonts.shtml" target="_blank" rel="nofollow">Blambot commercial fonts</a> are great. For instance Blambot Pro has Caps Regular · Caps Bold · Caps Italic · Lite Regular · Lite Bold · Lite Italic, all with complete char. sets, and all for $40. </p>
      <p>I'll add more to this as it comes to me.</p>
