    <p>I don't know about you but I love a deal! So when I happen to snatch up a font that is... </p>
    <p>A) Gorgeous - well crafted, excellent attention to detail technically and aesthetically </p>
    <p>B) Extensive - character sets that rock your little typographic socks- we're talking ornaments, swashes, ligatures, and enough alternates to make your mouse spin</p>
    <p>C) Cheap- hello! under a hundred clams- thankyouverymuch!</p>
    <p>I flip-out with glee!!! I recently purchased Adobe Poetica and this font is love-li-si-mo. (yes I know- I'm late) Its elegant, its classic, light and feminine. Hello! its by Robert Slimbach. It has so many typographic extras. 11 stylistic alternates, beginnings, endings, and my favorite are these juicey swashes under the "Alternate Latin small capitals" subheading in the Adobe specimen sheets. Notice the capitals 'N' and the 'X'. Don't you just LOVE that?! Oh and another thing... in the book we all have " The Elements of Typographic Style" the author states Poetica pairs nicely with Minion- another genius typeface by Mr. Slimbach. So even though you can't use it everywhere, its versatility is empowering in your chosen application.</p>
    <p>And you wanna know the best part? ITS ONLY $29 SMACKERS!!! You can't beat that fo' nuthin. Its OpenType too so you get all this typographic goodness automatically.</p>
    <p>Here is the link so you can geek out about it too:<br>
    <a href="http://store.adobe.com/type/browser/pdfs/POEQ/PoeticaStd.pdf" title="http://store.adobe.com/type/browser/pdfs/POEQ/PoeticaStd.pdf">http://store.adobe.com/type/browser/pdfs/POEQ/PoeticaStd.pdf</a></p>
    <p>Anyhow you heard me blab about my sweet little purchase so I would like to hear from you. Tell me about the fonts that you bought that didn't cost a lot of money (relatively), came loaded with many features, and were of course- gorgeous. Many fonts are not even close to $29 mark like my Poetica so you can mention significantly more expensive faces- but remember value, looks, and features are the key to this discussion!</p>
    <p>Can I get a "What, What",</p>
    <p>Mikey</p>
