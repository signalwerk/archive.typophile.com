      <p>fontplayer&gt; I have a special "collection" in FontBook dedicated to Harold's fonts. Love his stuff. His crappy website masks the fact that his fonts are pretty good. Kerning and some harmony issues aside, he has wonderful things! I love Pharmacy!!! Just say unicase and I'm all over it!<br>
      I like Koster but I think Melico is much better. Flute is nice too. In fact there are several fonts I like from them. Though it does not look like the highest quality but some of the forms would have a place in my collection... I will them a closer look. </p>
      <p>As for Blambot... my brain does not respond to Blambot at all ;( Post more goodies though :)</p>
      <p>Conor&gt; Bello pro is the bomb!!! I have seen it a dozen times and have never looked at the price. 75 euros...  not bad- and you can get the pro version for the same price!!! Dalliance is lovely indeed. Great price too... and you do get a lot for the money. I have yet buy anything from Emigre- Dalliance is a good start. This one of those fonts - like Poetica- you can't use it everywhere but in the places that you do- it adds the nice, if not unusual touch.</p>
      <p>Smarks&gt; Yes I remember that. In fact I remember when Poetica first came out. I was a little kid then and I remember reading all about Poetica and Cronos in Adobe's now defunct Font&amp;Function catalog. Those were the days.</p>
