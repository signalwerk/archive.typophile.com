      <p><em>Of course</em> "the marketplace" will "resolve all" of the "issues discussed in the article".</p>
      <p>The marketplace will also resolve what stock prices will be a week from today, but that doesn't mean the Wall Street Journal should cease publication. So, while it certainly is true that if new typefaces have value, the marketplace will pick them up... some helpful advice to people that will help them avoid <em>wasting their time</em> is not a bad thing.</p>
      <p>Of course, "we don't need X" is not the same thing as "there is no money to be made by providing X". Britney Spears, after all, has made quite a bit of money through her singing career.</p>
      <p>Also, the article is focused on originality as a criterion for the value of a new typeface. There are other figures of merit to be considered as well, such as craftsmanship. But maybe the problem is that I'm unable to tell how its author <em>defines</em> originality.</p>
      <p>I think, for example, that Williams Caslon is a <em>very</em> valuable typeface, and I'm very glad it exists. The same is true of Starling - which <em>was</em> original when it first came out in obscurity, but is Font Bureau's revival of it "original"?</p>
      <p>It's the wild and crazy display fonts that clutter up sites like dafont that are often of little value; maybe version #10001 of a child's scrawled handprinting is not <em>really</em> original, but it's likely to be graphically unique. Distressed typewriter faces are also available in excessive number, but again, each one is as unique as a fingerprint.</p>
      <p>Maybe the problem is the distinction between real and apparent originality - the writer was writing for a typographically (and <em>artistically</em>) sophisticated audience that was in no danger of falling into the trap I've outlined. An innocent like myself would use terms like "utility" and "craftsmanship" to make things clearer, or in some other way distinguish genuine creativity from mere novelty.</p>
      <p>But on the general issue, rather than the article itself:</p>
      <p>We have Baskerville and Caledonia and Century Expanded and Times Roman and Garamond. And Imprint and Adobe Caslon too! I could indeed say on the one hand that with all those choices, one hardly needs a "new" typeface for workhorse text usage - these all are highly readable.</p>
      <p>And, of course, on top of those, we <em>also</em> have Bembo, Optima, and Palatino and Bodoni Book - so it's not as if the palette of existing typefaces is a Spartan one without variety.</p>
      <p>We - that is, the speakers of Latin-alphabet languages without exotic accents - probably don't "need" new typefaces. Others are less fortunate. But then, we don't <em>need</em> new ladies' fashions either, but the market <strong>will</strong> continue to inflict them on us, whatever those dedicated to rationality might desire.</p>
      <p>Seeing the world in a new way, even if that means perfectly legible and readable typefaces will start to look dated, and thus increase the cost of printing due to the need to purchase replacements (so that what one prints will appeal to its target audience or market, so "need" it is)... is not a wholly bad thing. We have a rich selection of typefaces today to choose from partly <em>because</em> of the cycle of fashion from Caslon to Scotch Roman to the "standard" text faces listed earlier.</p>
      <p>So, even if the last half of the nineteenth century was largely a dismal era of typography, it still contributed to the era that followed being richer than the era that went before.</p>
