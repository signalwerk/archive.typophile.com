    html: |-
      <p>@Dunwich Type:<br>
      <cite>Of course one could argue that the market is only addressing the needs and desires of the Latin alphabet. But it could also be that the lack of a market for many non-Latin fonts suggests readers of those scripts have more pressing concerns than type. Just because there are thousands fewer good typefaces for Devanagari than Latin does not mean that Indians are clamoring to stop worrying about drinking water and start setting books with new fonts.</cite></p>
      <p>That is a good point. Currently, in my country, there is a big controversy over our exports of asbestos to the Third World. While asbestos has health risks, these pale in comparison to the danger from fire. Telling Third World countries they have to do without industrial development unless they do it to our very expensive safety standards shows a lack of awareness of their conditions.</p>
      <p>Obviously, though, the market won't create much in the way of typefaces for people who don't have a lot of money to spend on font purchases. For people to have a basic set of different styles of printing in which to express themselves is of value because it helps people maintain their language and culture. So I praise the efforts of those working on various open-source typeface projects to cover more of Unicode.</p>
      <p>@Christopher Dean:<br>
      <cite>I understand the difference between ' &amp; ’ but is that really enough to cause a glitch?</cite></p>
      <p>Believe it. There is the typewriter quote, ', and there is the opening single quote, `, which are both part of ASCII, but the true apostrophe and closing single quote are outside the standard 7-bit subset on the U.S. computer keyboard.</p>
      <p>At U+00B4, there is a candidate for the closing single quote. That's in the 8-bit ISO 8859-1 set, and so it shouldn't be enough to cause a glitch with most systems or typefaces.</p>
      <p>But if you go to U+2018 and U+2019 in the "General Punctuation" area of Unicode, I fear you are asking for trouble. Instead of the capacity required for accented letters in French words - 8-bit ISO 8859-1 - what is required is the 16-bit Basic Multilingual Plane of Unicode, that is, the big guns that can also handle Chinese characters.</p>
      <p>Would you have been as surprised if Chinese text had caused a glitch?</p>
