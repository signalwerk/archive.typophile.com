      <p>The "that's not type design" argument doesn't go over well at Typophile, where a number of frequent contributors are heavily invested in revivals. Hence the can of worms, no doubt. (BTW Christopher, are Typophile readers really so visually illiterate you have to spell it out for them?)</p>
      <p>Having fought that battle, I've moved on to "that's not science"!</p>
      <p>However, I will say that EVB's statement "If an existing typeface does the job, there is no reason to make a new one" is incorrect.<br>
      There is plenty of reason if people will buy your revival, me-too, or knock-off, and they may be persuaded to do so by extra-typographic, marketing factors such as:<br>
      - Price<br>
      - Branding<br>
      - Advertising, promotion and collateral<br>
      - Buying experience<br>
      - Support<br>
      - Licensing terms</p>
      <p>The present situation may be compared to that prior to the ATF consolidation, when there were many foundries in the USA, and each had its version of the popular genres.</p>
