      <p>There was no link. I think that I just incorrectly coded an cite tag.</p>
      <p>What I meant was that the font market seems to prefer a gradual evolution based on existing styles. Designers Peter seems to consider original—“Peter Verheul, Cyrus Highsmith, Fred Smeijers, or Underware”—are not dominating font sales or use. Design criticism has had plenty of calls to abandon slow advancement in favor of more sudden change in both typography and type design. While Peter's call for originality does not echo this desire to such an extreme as 1990s writing—Peter is not asking for more Dead History and David Carson—the sentiment is still just as familiar as the types he complains about.</p>
      <p>Of course one could argue that the market is only addressing the needs and desires of the Latin alphabet. But it could also be that the lack of a market for many non-Latin fonts suggests readers of those scripts have more pressing concerns than type. Just because there are thousands fewer good typefaces for Devanagari than Latin does not mean that Indians are clamoring to stop worrying about drinking water and start setting books with new fonts.</p>
