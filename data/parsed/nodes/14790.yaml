    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Rick Valicenti</strong></p>
    <p>Born in Pittsburgh PA 1951/10/20. Degrees in photography and painting. Founder of the Chicago-based graphic design firm Thirst (1981) and the digital type foundry <a href="/wiki/Thirstype" class="freelinking" rel="nofollow">Thirstype</a> (1994). Designer of the typefaces Bronzo (aka UltraBronzo) and Ooga Booga, and co-designer of Commerce (with Greg Thompson), and Infinity, Apex Sans, and Apex Serif (with Chester).</p>
