    html: |-
      <p>Justin,</p>
      <p>maybe I did not understood your question, but IL always show what you are drawing while you click and hold down the mouse button (I mean, while placing a new anchor but before the button release).</p>
      <p>But it shows just the resulting object. Thus, if you are drawing with no stroke/fill, IL will show just the segment under edition using the color of the layer active.</p>
      <p>Maybe you want to see the resulting object while moving the cursor and before a mouse click. This is not done by IL as the app does not know if the user plan to make the segment straight or curve. When working with a <em>specific</em> tool (as arc) this is shown as the resulting path is determined by the mouse position.</p>
