  - id: 425498
    user: 50554
    date: 2010-08-17T20:21:00
    date_raw: 17 Aug 2010 — 8:21pm
    votes: null
    html: |-
      <p>Not being a typographer, my first guess would have been to use Bodoni Book with Modern No. 20.</p>
      <p>But that would not look good - they aren't the same typeface, and so if one uses two different typefaces, one wants contrast.</p>
      <p>So, I would then consider the suggestion that a real typographer made above, News Gothic. But when I look at it, I think that it's not quite right.</p>
      <p>Times Roman? No. Almost as bad as Bodoni Book.</p>
      <p>A slab serif, like Memphis or Cairo or Stymie? That seems to me to be what would work, supplying what News Gothic lacks (serifs, so important for the readability of body copy) and yet contrasting strongly with Modern No. 20 in about the same way that News Gothic would. (Being short and squat instead of tall and thin, the contrast is doubled. This may be a bad thing, though, and if so it explains the choice of News Gothic.)</p>
      <p>As an alternate suggestion, one could try Optima, but I think that would be pretty iffy as well.</p>
