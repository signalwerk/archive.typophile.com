    votes: null
    html: <p>As a foil to Modern's high contrast and sensuous curves, why not look as faces with even type color and clean lines?</p>
    html_clean: <p>As a foil to Modern's high contrast and sensuous curves, why not look as faces with even type color and clean lines?</p>
