    html: "<p>Actually that's two different faces: the <a href=\"http://www.myfonts.com/fonts/bitstream/itc-garamond/narrow-book/testdrive.html?s=because%20urgent%20means%20now&amp;p=48\" target=\"_blank\"> because urgent means now</a>  <br>line is indeed ITC Garamond Narrow Book, but the <a href=\"http://www.myfonts.com/fonts/linotype/adobe-garamond/regular/testdrive.html?s=welcome%20to%20williams%2Fintegracare&amp;p=36\" target=\"_blank\"> welcome to</a>  <br><a href=\"http://www.myfonts.com/fonts/linotype/adobe-garamond/regular/testdrive.html?s=welcome%20to%20williams%2Fintegracare&amp;p=36\" target=\"_blank\"> williams/integracare</a> line is set in Adobe Garamond. All other  <br>headers are <a href=\"http://www.myfonts.com/fonts/linotype/itc-garamond/book/testdrive.html?s=one%20body%2C%20one%20solution&amp;p=24\" target=\"_blank\"> ITC Garamond Book</a>. <br> <br>Sorry to have kept you waiting: I've been busy.</p>"
