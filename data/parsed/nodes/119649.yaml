      <p>Hi Stefan &amp; James</p>
      <p>Thank you very much for replying and for your comments.</p>
      <p>I have looked at implementing your suggestions. Completely agree with all points, as you'll see in the quick updates I've been looking at. I've tweaked a number of the letters too.</p>
      <p>I feel the ampersand should be a little smaller, to help create some visual contrast with the letterforms, so seems to work well being about the size of the largest counter, it was far too small before - and would impede my ability to use at very small sizes legibly.</p>
      <p>Thanks again!</p>
