    html: |-
      <p>Hi there,</p>
      <p>type looks good – although it might be a little too loose, especially around the "I". But maybe that's just me.</p>
      <p>I think the small ampersand lets the brand appear really big. It looks like Bird &amp; Co is a large company and/or institution that has many subsidiaries. If that's what you want, I'd keep the ampersand smaller than the rest of the letters, because it visually separates "Bird" from "Co", by introducing a second font size, which makes it two instead of one, thus provoking the feeling of "many" (at least to me and maybe only very subtle).</p>
      <p>I don't know how you want your clients to perceive your business. Maybe you want them to believe you are a big company. Maybe you don't. In the latter case, I suggest you make the ampersand the same size as the other letters to achieve a somewhat uniformed look. Why? I think it communicates integrity. It looks like you are working so closely with your partner specialists that your clients don't even realize there are so many different parties involved.</p>
      <p>It really depends on how you want your clients to perceive your business. One more question regarding this: will you be the only one who invoices your client or will your partners send their own invoices?</p>
      <p>If you are the only one who handles payment, I suggest you decide whether you want to appear big (small ampersand) or small (normal ampersand).</p>
      <p>If your client will receive several invoices, I suggest you clearly separate yourself from your partners by getting rid of "&amp; CO". If you are only invoicing your own services, there's no need to mention other working partners in your company name.</p>
      <p>Anyway, it looks good :)</p>
