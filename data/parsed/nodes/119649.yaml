    html: |-
      <p>&gt; you decide whether you want to appear big ... or small </p>
      <p>Normally businesses prefer to look big, but you bring up a good point. It's common for designers to be part of a team but I would only use "&amp; Co" unless you have at least one employee besides yourself, or if the other folks are billed through you. </p>
      <p>If the copywriters, photographers, etc have their own businesses and do their own billing, your clients will figure that out pretty quickly anyway. And there's nothing wrong with that, but you don't want clients to feel you're giving a false impression of  your company.</p>
