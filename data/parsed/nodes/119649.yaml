    <p>Hi everyone</p>
    <p>I have just signed up to Typophile, finally, after years of casual browsing and checking in on the forums.</p>
    <p>I am working on a logo for my company, 'Bird &amp; Co', the name I use for small freelance jobs outside of my usual day-to-day. I usually team up with specialists such as copywriters etc, hence 'Co'.</p>
    <p>My thoughts for the overall branding is to keep things clean and simple, discretely, so that the work speaks for itself. I have been a long admired Caslon IV's Two Line English Egyptian, so used this as a base (and to indulge in personal taste). </p>
    <p>Logo needs to work at small and large sizes, positive and negative</p>
    <p>I have developed something I am largely happy with, but know the details are not there yet. I am hoping for input to help make this 'sing'!</p>
    <p>Weight, kerning, proportions, letterforms, all up for any / all comments</p>
    <p>Thanks very much<br>
    Christian</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/LogoDraft1_6573.png"></div><p></p>
