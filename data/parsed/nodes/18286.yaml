    <p>Hi all,</p>
    <p>I'm using lines of prose in a design and wondered what people thought of Zapfino. I sometimes get the feeling it's can be hard to read. the point size is set at 23, what leading should it be subsequently?</p>
    <p>any other suggestions of typeface are very welcome.</p>
