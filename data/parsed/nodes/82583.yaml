      <p>Thanks for the suggestions. Will consider buying.</p>
      <p>My only gripe with the web-enabled fonts at MyFonts is I'd like something where I make a one off payment not a recurring thing. If you can download then host the font yourself how on earth do you they enforce that policy, and how do they know how many pageviews you get?</p>
      <p>Anyone know of anywhere that sells for a one-off payment or is this impossible due to the licenses on commercial fonts?</p>
      <p>Thanks again!</p>
