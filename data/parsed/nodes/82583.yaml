    <p>Hi all,</p>
    <p>Apologies if this is in the wrong section.</p>
    <p>I'm desperately looking for a non-commercial alternative to ITC Conduit, one that I can then use on the web with fontface.</p>
    <p>Would be happy to buy the font but that still wouldn't allow me the web licensing and don't want it hosted by anyone else.</p>
    <p>So, if anyone can suggest something close would be really appreciated.</p>
    <p>Thanks!</p>
