    html: <p>Matteo, any licensed software is based on some sort of use-based measurement —&nbsp;whether its pageviews or users or time. They don't <em>know</em> how many pageviews you get, but you give an honest estimate if you want to be lawful. The point is to charge a large corporation more than they would charge an individual hobbiest.</p>
