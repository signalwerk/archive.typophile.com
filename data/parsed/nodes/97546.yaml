    <p>Hi</p>
    <p>The last time I created a font it was on an Amiga, so please understand I'm not fully up to speed with Ascent / Descent / Line Gap etc.</p>
    <p>I need to create TTF versions (iOS compatible for iPhone &amp; iPad) of pre-existing fonts but with adjusted 'line spacing' so that when displayed the fonts will appear to have a line spacing that differs from 1.0.  So I'll start with 'arial.ttf' and end up with 'arial_linespace_large.ttf' for example. Yes I know it's a hack but when working on iOS software you get used to these sort of hacks.</p>
    <p>I'm assuming I can do this using a tool such as FontLab? Is this 'simple' enough that a more basic package will do just as good a job? Mac software would be idea, PC I can do too.</p>
    <p>Can someone either point me in the direction of what settings I need to adjust to create  font variations like this? Or point me in the direction of where I should go to learn this? I posted here as it looked like an active forum, but if there's better places to ask this sort of thing I'm happy to move.</p>
    <p>I want to test out this ASAP to check it'll work in practice as while this is all due to an apple bug where they 'forget' line spacing settings if you set the font value (crazy but true).</p>
    <p>Anyone generous enough to help steer me in the right direction?</p>
    <p>Thanks in advance.</p>
    <p>Jen</p>
