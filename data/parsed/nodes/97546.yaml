    html: |-
      <p>First check that the license agreement for the fonts permits you to make this kind of modification. You mention Arial, and I think you will find that this kind of modification is prohibited by the license agreement.</p>
      <p>If you have a license that does permit this kind of modification, and this is the only thing you need to do, you don't need a full font tool such as FontLab, but only a table editor. You will need to adjust the OS/2 and hhea table vertical metrics settings. You can do it for free using the TTX dump/fuse tool, or can pay for a tool with an easy user interface such as DTL OTMaster.</p>
