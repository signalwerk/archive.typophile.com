    html: |-
      <p>Stefan and Yves -</p>
      <p>Thanks, yes, I wondered about the Novarese/Nebiolo possibilities, but could find nothing that corresponded exactly, or that even corresponded with the dates. I'm prepared to go with Yves' suggestion that the logos were custom designed. There was a stretch of Domus in the very late 30s and early 40s when the logo changed with nearly each issue, and was very much "handmade" or even "handcrafted". Yet the editor of the magazine remained constant. I am wondering what contributed to the radical changes—fashion, yes, but there must be more to it.</p>
