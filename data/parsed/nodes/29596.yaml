    <p>I am trying to determine the various typefaces used by Domus magazine on its cover throughout its history and would appreciate any help you folks can offer.<br>
    The first one was introduced in 1947 and has remained constant since. It looks like Akzidenz Grotesk bold condensed to me, but I'm certainly no expert. The image is from 1950.</p>
    <p>The second is from earlier, from 1944.</p>
    <p>The third is from earlier still, from 1933. In that one, I'm paricularly interested in the typeface used for the subtitle, Arte nella casa.</p>
    <p>These may well be easy identifications for you, but I'm giving a talk about cover design of architectural periodicals, and want to avoid slipping up on this particular element of it!</p>
    <p>many thanks-Linda</p>
