  - id: 429960
    user: 8181
    date: 2010-09-17T05:39:00
    date_raw: 17 Sep 2010 — 5:39am
    votes: null
    html: |-
      <p>Hi Dave,</p>
      <p>See below "Security" tab from Acrobat's Properties dialog. In Acrobat you can disallow any of those listed actions. I think you can also restrict printing to low-res. And you can set a password to get into the dialog that changes the security settings (so that people can't just un-set them). For your purposes you'd want to disallow "Content Copying or Exctraction" and possibly "Changing the Document".<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/acrosets_5421.JPG"></div><p></p>
  - id: 429996
    user: 2289
    date: 2010-09-17T10:09:00
    date_raw: 17 Sep 2010 — 10:09am
    votes: null
    html: |-
      <p>When you ‘save as’ the Illustrator file as a pdf, to the left is a menu, go to Security and select use a password to restrict editing Security and Permissions, then select what you want to restrict or allow. Be aware though that this will not work with all pdf readers and, further, that if you allow printing one could create another pdf and extract from that –&nbsp;and don’t use “password” as your password.</p>
      <p>Tim</p>
