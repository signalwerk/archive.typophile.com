      <p>Hm, it is all a bit haphazard isn't it?<br>
      Just tried an experiment (all on PC, don't have access to a Mac): distilled a Word file using Acrobat 7 Pro, and set security settings of printing ALLOWED but all changing of the document DISALLOWED. Then opened the resultant PDF in Acrobat and tried to print it to PDF995: wouldn't do it; threw an error.<br>
      Open the PDF in some other 3rd party application and try to print to either PDF995 or Acrobat Distiller: in eaither case it now prints successfully, and the new PDF claims to have no security, but I seem to be unable to select and edit text. Quite random.</p>
