    html: "<p>Tim: I remember that you certainly <em>used to</em> be able to bypass edit restrictions by printing to the distiller and creating a new PDF without the security settings, but I think they've fixed that in recent years (both discovered through necessary work-related attempts to do just that!). Mind you, I haven't tried re-printing these recent PDFs via a 3rd-party app, like PDF995, so don't know whether the protections are now strong enough to withstand them...</p>"
