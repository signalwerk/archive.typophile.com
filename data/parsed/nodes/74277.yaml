    html: |-
      <p>Unintuitive? Surely not?</p>
      <p>I just tried -- typed "Hi!", applied "French:Canadian" (picked at random). Exported to Illy without "Editing Caps" selected. It opens the PDF without complaining, but the language was reset to the default. Exporting <em>with</em> "Editing Caps" got the original text &amp; language back.</p>
      <p>As I said, Illustrator can open almost any PDF and edit it. Unchecking "Preserve Editing Capabilities" does <em>not</em> prevent Illy from being able to open it.</p>
      <p>I've never seen layers in a PDF and wouldn't know where to look for them, but I imagine it works in a similar way -- "flattening" the PDF without, preserving layers with the option checked.</p>
