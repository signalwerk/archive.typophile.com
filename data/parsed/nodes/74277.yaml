  html: <p>Ok, so I just realized all the "non-editable" PDFs I've been exporting from Illustrator (custom type work) are in fact EDITABLE? Even after unchecking the "Preserve Illustrator Editing Capabilities" option &amp; "Create Acrobat Layers from Top-Level Layers" just in case. Am I missing something here? I tried looking it up, but people seemed confused or believe that the tick box actually does something. What's the deal?</p>
comments:
  - id: 429873
    user: 29994
    date: 2010-09-16T13:35:00
    date_raw: 16 Sep 2010 — 1:35pm
    votes: null
    html: |-
      <p>You can edit almost any PDF with Illustrator, and presumably, the ones created by it are most compatible with itself.</p>
      <p>The "Editing Caps" checkbox might add private info to some objects, such as the 'language' attribute of text, which isn't carried over in a regular PDF.</p>
