      <p>Dave: I just had a situation with a pdf, checked it on a PC – various options were not allowed, opened the same file on a Mac – no security at all. As I recall it is sometimes possible to use an older version of Acrobat to get round security and my night staff colleague has been able to crack passwords on recent files (don’t know the details).</p>
