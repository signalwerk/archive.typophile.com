      <p>Anna Giedryś' <a class="freelinking external" href="http://www.fontsquirrel.com/fonts/signika" rel="nofollow">Signika</a><br>
      Quoting R. from <a class="freelinking external" href="http://typophile.com/node/117175#comment-580410" rel="nofollow">thos post</a></p>
      <blockquote><p>Here’s one handy thing to know: If you want to identify a webfont, you can select the text that uses it, right-click on your selection and then select ‘Inspect Element’ from the context menu (in Firefox and Chrome). The font name will be shown on the right-hand side in the panel at the bottom of the screen. You might want to click on the tab ‘Fonts’ in Firefox or ‘Computed’ in Chrome for a neater overview.</p></blockquote>
      <p>Other handy option for Chrome user only: Chrome <a class="freelinking external" href="http://chengyinliu.com/whatfont.html" rel="nofollow">WhatFont</a> app by Chengyin Liu. Click the toolbar app icon and simply hover html text to reveal the webfont name.</p>
