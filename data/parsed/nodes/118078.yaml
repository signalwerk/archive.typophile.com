  - id: 583366
    user_id: 205259
    user_name: donshottype
    user_path: null
    user_image: /files/pictures/picture-205259.jpg
    date_raw: 18 Jul 2014 — 11:46am
    date: 2014-07-18T11:46:00
    votes: null
    html: |-
      <p>Other names and versions of Ionic  include Aurora BT (also called News 706 BT by Jackson Burke, Bitstream), Imperial BT, Corona LT, News 705 BT (which is Bitstream's Corona), Nimrod MT, Clarion MT. Source: Luc Devroye's Ionic (newspaper) typefaces page. <a href="http://luc.devroye.org/fonts-50774.html" title="http://luc.devroye.org/fonts-50774.html">http://luc.devroye.org/fonts-50774.html</a> which is based on a comparison by Uli Stiehl.<br>
      Don</p>
