      <div class="comment-spam-body"><p>Ionic No. 5 designed by  Chauncey H. Griffith for Linotype in 1922 </p><div class="imageWrap"><img src="http://typophile.com/files/IonicNo5-MergenthalerLinotype1950_6555.jpg"></div><br>
