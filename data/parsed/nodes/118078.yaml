      <p>Previous specimen Ionic No. 5 looks thicker than it should for the font. Try this </p><div class="imageWrap"><img src="http://typophile.com/files/Ionic_6509.jpg"></div><br>
      _Darby's_ looks like a heavier version of Ionic.<br>
      Anyway I have not found a font with an exact match to the center stroke on the _a_ of _Darby's_. However you could use News 701 BT and most people would not notice the difference.<br>
      Don<p></p>
