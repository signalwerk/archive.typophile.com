    <p><strong>Letterbox</strong><br>
    Melbourne, Australia</p>
    <p>Established in 1991, Letterbox undertakes typographic projects. Some of these are commissioned by clients (identity systems, signage systems, external publishing and font customisation) whilst others are initiated by the studio (such as  lectures, publications, forums and exhibitions). Letterbox have self-published 12 publications commenting on typography and design culture including the <em>Qwerty</em> series, the <em>Ampersand</em> series, and recently <em>Fancy</em>.</p>
    <p>Letterbox is headed by Stephen Banham, Lecturer in Typography at the Royal Melbourne Institute of Technology (RMIT), and regular contributor to international type-culture. Other contributors the studio's output have included Niels Oeltjen, Wendy Ellerton, Morice Kastoun and Sarah Findlay.</p>
    <p>Recent developments include opening an e-store selling fonts, tshirts and publications. Fonts released include <em>Berber, Terital, Kevlar, Morice</em> and <em>Bisque</em>. Letterbox remains one of the leading independent type foundries in Australia, and continues to expand its collection. </p>
    <p><a href="http://www.letterbox.net.au" title="www.letterbox.net.au">www.letterbox.net.au</a></p>
