    <p>Hi guys,</p>
    <p>Never asked for a font ID before, but to be honest I have no idea how else to find this out. While in St. Prex, Switzerland, we visited a gallery which had this poster outside. The typeface is beautiful! I'd love to know what it is - can anyone help?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/andi_id_1_4281.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/andi_id_2_5559.jpg"></div><p></p>
    <p>Thanks in advance - sorry if it's something really obvious. Both me and my girlfriend thought it looked familiar, but couldn't place it.</p>
    <p>Andi [<a href="http://www.semibad.com" rel="nofollow">semibad</a>]</p>
