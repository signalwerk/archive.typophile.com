    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Göran&nbsp;Söderström</strong></p>
    <p>Göran Söderström is the founder of Letters from Sweden. He has previously published his work through Fountain and FontFont. He has designed custom typefaces for Acne Studios, Tele2, Tictail, <span class="caps">C&amp;A</span>, Zeta, Posten Frimärken, Expressen, Ulf Rollof, <span class="caps">ATG</span>, <span class="caps">ICA</span>, <span class="caps">SEB</span>, WyWallet and others. His retail fonts are used by the likes of Red Bull, <span class="caps">SVT</span>, Expressen, The New Republic, Pitchfork Music Festival, Helsingborgs Dagblad, Lassila <span class="amp">&amp;</span> Tikanoja, Rodeo Magazine and others. One of Göran’s typefaces has been carved in&nbsp;stone.</p>
    <p><strong>Website <span class="amp">&amp;</span> Social media:</strong><br><a href="http://www.lettersfromsweden.se">http://www.lettersfromsweden.se</a><br><a href="http://www.autodidakt.se">http://www.autodidakt.se</a><br><a href="http://twitter.com/lettersfromswe">http://twitter.com/lettersfromswe</a></p>
