    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Göran Söderström</strong></p>
    <p>Göran Söderström is the founder of Letters from Sweden. He has previously published his work through Fountain and FontFont. He has designed custom typefaces for Acne Studios, Tele2, Tictail, C&amp;A, Zeta, Posten Frimärken, Expressen, Ulf Rollof, ATG, ICA, SEB, WyWallet and others. His retail fonts are used by the likes of Red Bull, SVT, Expressen, The New Republic, Pitchfork Music Festival, Helsingborgs Dagblad, Lassila &amp; Tikanoja, Rodeo Magazine and others. One of Göran’s typefaces has been carved in stone.</p>
