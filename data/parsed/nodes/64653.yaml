      <p>Typically, in typography, horizontal forms are less high than the vertical forms are large. Have a look at the horizontal part at the top of the R and try to emulate that height. That is one of the issues.<br>
      Secondly, if you close a V, you typically have to enlarge it at the top to give it the same optical weight as the other letters. Check the difference in width between V and A to understand that. Also take an A, put it upside down and make the bar slide up towards the opening, you'll see that you want to open the A to keep the correct weight.<br>
      Thirdly, the diagonals always darken upon meeting the horizontals. You need to cheat a bit. As you cannot create inkgaps, you would need to work on the shape of the diagonals so they narrow down slightly when they meet the horizontal. (Think about your lines as a sausage: if you cut perpendicular, you have a slice the width of the sausage; if you cut diagonally, you have a slice larger than the sausage, right? Hence why the joint looks darker.<br>
      Lastly, to make the V more prominent, you can use a V from a larger font size but then you will have to thin it down in order to give it the right optical weight!</p>
      <p>IMVHO all of this should explain why letters are not purely geometrical! </p>
      <p>PS. Remember TV screens are v low resolution and that everything done for TV must be checked on a TV!</p>
