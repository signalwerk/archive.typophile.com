    <p>I have converted the V in both typefaces to triangles, by copying the 'I' and forming a line at the top of the V to create the shape. </p>
    <p>This triangle is the 'virus', and will be used in TV indents and so forth. </p>
    <p>I personally prefer the Neutraface typeface, as I like the R within it. But the V is the most important character, and it is not very geometrical, as it has slight curves within it. My tutor also pointed out that the V seemed quite thin compared to the letters R, U and S, where as it should be the most prominent letter within the word.</p>
    <p>When I have tried to make the currently flat bottom of the V into a point I have found that both typefaces are not symmetrical. Do any of you have any ideas?</p>
