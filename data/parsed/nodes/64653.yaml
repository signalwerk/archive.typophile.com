      <p>Well, reading the brief (which was really enlightening) I can understand the name a bit better, as it is kind of dangerous and spreading...</p>
      <p>I'm just gonna give you my verdict on what you have in combination the brief, I hope this will help you:</p>
      <p>I think it's all way to generic and, frankly, boring. In the brief they're talking about being 'gutsy', 'escapist' and 'gritty'. I see none of that in the stuff you presented. TV is a very competitive market, and the channel has to really stand out, this just doesn't. I think the idea you sketched is still short of 'meat'. It's just one idea with vague notions of what you want to do. I think you have to come up with a far more elaborate 'story'. It needs to be coherent and it needs to stick. As I said before I would work on this first, look for, or make images that fit with the story, and try to find out why. A logo is just a logo, to have an on screen identity a wholly different thing. I would advise you to develop the logo as part of the identity, not as a seperate part. I also would advise you to drop what you've made until now, as it limits your research and explorations. Try to sketch more and be much bolder and crazy before you start fiddling with the details, like the point of the V. And try to surprise yourself, it has to excite you at least, otherwise no one else is gonna get excited over it.</p>
      <p>Good luck and I hope you show us your new stuff here!</p>
      <p>greetings Jeffrey<br>
      <a class="freelinking external" href="http://www.infraordinaire.com/wordpress" rel="nofollow">infraordinaire</a></p>
