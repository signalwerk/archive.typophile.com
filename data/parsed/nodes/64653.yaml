      <p>Neutra is always nice, but does it fit?<br>
      And yes, you need to widen the "V" if you want to close it. But I'd agree with Eric that it's not necessarily a good idea. For one thing, it can easily be read as an arrow pointing downwards. And as for "this is the virus", how so? When I search for pictures of viruses, I get no triangles, but mostly nicely complex shapes that look like balls with points protruding from them in all directions – kinda like 3D stars. Those might be interesting to work with/from.</p>
      <p><cite>"I have lots of ideas of what to do with the identity visually"</cite><br>
      Like what? Maybe you can work towards a logo solution from there.</p>
