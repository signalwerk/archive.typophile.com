      <p>I don't know if you have made a profile of the channel, like who's the audience, what kind of programs they will show, etc? This could be useful as I have the feeling that both the choice of the word virus as well as the typeface choice seem a bit, um, arbitrary. Try to make a coherent picture of the how and why, with words and images you would associate with your ideas, and then come back to creating a logo and all the rest. I think this will give you more direction.</p>
      <p>To come back to what you've shown: I agree with the others here: though I like Neutraface, I feel like there is no particular connection with the word virus. Not that you have to visually translate the word, but I think a virus is more complex and also more 'dirty' ;) I would look at typefaces that are more irregular. Or alternatively, I would try to establish more contrast between the cleanness of the typeface to the logomark.</p>
      <p>I also think that the triangle as logo used seperately is not distinguishable enough. It's good to keep a certain simplicity when working for the screen, but try finding something a bit more 'dangerous' or 'infecting', if you catch my drift. Something more memorable too.</p>
      <p>greetings Jeffrey<br>
      <a class="freelinking external" href="http://www.infraordinaire.com/wordpress" rel="nofollow">infraordinaire</a></p>
