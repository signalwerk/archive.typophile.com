      <p>I forgot to mention that you have two main ways of widening the top of your closed V:<br>
      a. you simply change the angles of the two sides (arms) - that is paradoxically the tricky way<br>
      b. you slide down the V and lengthen the two sides (arms) - easier, but you need to shift slightly the optical corrections so your arms don't look too bent or too dark! With the 'arrow' of the V further below baseline, it will take prominence, too.</p>
      <p>Let us know how you get on.</p>
