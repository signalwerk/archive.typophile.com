    html: |-
      <p>Round and pointed parts need to go "over the limit", otherwise they look like they're not reaching the limit; see how the "V" seems to be sitting higher than the rest. The "U" needs overshoot too, just not as much.</p>
      <p>The necessity for this decreases with size, but it's always there.</p>
      <p>If there's a good reason not to have overshoots, what you'd have to do is give sizable flat segments to the bottoms of those two letters.</p>
      <p>hhp</p>
