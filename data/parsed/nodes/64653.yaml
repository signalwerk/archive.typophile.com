      <p>This is nice. But make it more custom if you can.. The "i" is too wide, especially in your 3D version. Thinning that 'i' will help add some modularity.</p>
      <p>Have you tried to stack letters? Lock up? Is there a way to rotate some or something like that?</p>
      <p>Here is what I would do now... Print them out large on heavy card and cut them out so you have solid black forms to work with. Have your scissors/exact-o handy and don't be afraid to slash em up to get what you are looking for! You may print them a couple times. Print some out backwards and try some of that... (I think reversing the u <em>or</em> the v would add some variety in notches) Take pictures of your "compositions" and then use those to help you narrow it down.</p>
      <p>Get far, far away from your computer. And play some good background music... Animal Collective or The Books.</p>
      <p>cheers</p>
