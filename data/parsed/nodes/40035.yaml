    <p>I recently saw the logo for a new condo going up in Seattle, and given that I was standing 3 feet away from it, I couldn’t read it. When I stepped back a bit, I glimpsed this little fellow:<br>
    </p><div class="imageWrap"><img src="/web/20080905135355im_/http://www.typophile.com/files/untitled_6660.JPG"></div><p></p>
    <p>The letterspacing is hugemungously wide, too the point that I couldn’t read it on the fence I was walking by. (Interesting name, considering the topic though...)</p>
    <p>Is there any kind of rule, other than the Mach 1 Eyeball, for how wide is too wide? I mean, seriously, an EM space is too much.</p>
    <p>What do you think?</p>
