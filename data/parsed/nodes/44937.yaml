    <p>Hi everyone, </p>
    <p>So Im new to all this.<br>
    Joined about 17mins ago.<br>
    I have a quick question hopefully a topshot typographer expert can get back to me asap.</p>
    <p>Can anyone give me some examples of typical fonts from the 1920's?<br>
    Ive been searching about, but they're very broad, and I'm finding it difficult in narrowing it down to about 5, or so.</p>
    <p>Please help!</p>
    <p>Thanks.</p>
