      <p>Hi Deanna,</p>
      <p>welcome to Typophile!</p>
      <p>First of all: you posted in the ‘Typographic Education’ forum. On typophile, there are several <a href="http://www.typophile.com/forums" rel="nofollow">forums</a>. I think this topic would rather fit into the <a href="http://www.typophile.com/forum/5" rel="nofollow">Design board</a>, as it doesn’t deal with educational concerns. </p>
      <p>What kind of application are you looking for? Newspaper fonts, (urban) display fonts, book typography?<br>
      What place and culture, United States? Prohibition and Al Capone? Jazz, Swing, Broadway? Art Deco, Art Nouveau or expressionism?<br>
      Narrowing this down might help us.</p>
      <p>You can always browse font vendor sites for keywords, like:<br>
      <a href="http://www.myfonts.com/browse/keyword/1920s/" title="http://www.myfonts.com/browse/keyword/1920s/">http://www.myfonts.com/browse/keyword/1920s/</a></p>
      <p>F</p>
