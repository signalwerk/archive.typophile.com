    html: |-
      <p>wikipedia will prove useful.</p>
      <p>Many of our modern typefaces were designed earlier than we thought they were.</p>
      <p>I believe:</p>
      <p>Gill Sans<br>
      Futura<br>
       *possibly* Cooper</p>
      <p>were designed in the 1920's, although they didn't gain momentum till they were used for a while.</p>
      <p>If you're looking for typefaces that were popular in the 1920's, you'd have to look for typefaces that were designed much much earlier.  Due to the technology of the time, they could make for quick and easy distribution like we can with digital downloads the day after they're created.</p>
