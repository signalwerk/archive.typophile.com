    <p><a href="http://www.fontfont.com/fonts/tisa-sans" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.fontfont.com/fonts/tisa-sans" rel="nofollow"><img src="http://typophile.com/files/Tisa_Teaser3_5636.jpg"></a></div><p></p>
    <p><a href="http://www.fontfont.com/fonts/tisa-sans" rel="nofollow">FF Tisa Sans</a> is Slovenian designer <a href="https://www.fontfont.com/designers/mitja-miklavčič" rel="nofollow">Mitja Miklavčič</a>’s follow-up typeface to <a href="http://www.fontfont.com/fonts/tisa" rel="nofollow">FF Tisa</a>. Whether used together or separately, both of his families are excellent choices for branding projects and complex editorial applications. The original FF Tisa is one of the new-millennium favorites in the <a href="http://www.fontfont.com" rel="nofollow">FontFont library</a>—known for its sturdy and friendly forms, hence its common use in newspapers and magazines.</p>
    <p>In all important details, FF Tisa Sans matches FF Tisa perfectly. Aside from the lack of serifs, the Sans features slightly reduced ink traps. Necessary system elements have been fine-tuned to one another, including  the color density of blocks of text, the proportions of the letterforms and their distinctive stroke endings, and even the eye-catching Italics. Of course, the FF Tisa Sans character set contains the same range of characters and typographic features as the original FF Tisa, too. Since FF Tisa Sans should prove quite suitable for signage and information design projects, Miklavčič included a range of specially designed arrows in each font as well.</p>
    <p><a href="http://www.fontfont.com/fonts/tisa-sans" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.fontfont.com/fonts/tisa-sans" rel="nofollow"><img src="http://typophile.com/files/feature_3_650_4781.png"></a></div><br>
    <em>FF Tisa Sans’s italics have FF Tisa’s same weight, structure, and refined “bell-bottom” construction, but without its top-half serifs.</em><p></p>
    <p><a href="http://www.fontfont.com/fonts/tisa-sans" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.fontfont.com/fonts/tisa-sans" rel="nofollow"><img src="http://typophile.com/files/feature_4_650_3914.png"></a></div><br>
    <em>The sans version’s color density was fine-tuned to perfectly match FF Tisa’s original grey value. The proportions of the small caps, the x-height as well as the lengths of ascenders and descenders, were harmonized as well.</em><p></p>
    <p><a href="http://www.fontfont.com/fonts/tisa-sans" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.fontfont.com/fonts/tisa-sans" rel="nofollow"><img src="http://typophile.com/files/feature_5_650_5254.png"></a></div><br>
    <em>Subtle variations in slant lend the eye-catching italics their friendly and dynamic appearance.</em><p></p>
    <p><a href="http://www.fontfont.com/fonts/tisa-sans" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.fontfont.com/fonts/tisa-sans" rel="nofollow"><img src="http://typophile.com/files/feature_1_650_3912.png"></a></div><br>
    <em>Necessary system elements have been fine-tuned to one another, including the proportions of the letterforms and their distinctive bulging stroke endings.</em><p></p>
    <p><a href="http://www.fontfont.com/fonts/tisa-sans" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.fontfont.com/fonts/tisa-sans" rel="nofollow"><img src="http://typophile.com/files/feature_2_650_6403.png"></a></div><br>
    <em>FF Tisa Sans features slightly reduced ink traps.</em><p></p>
    <p><a href="http://www.fontfont.com/fonts/tisa-sans" rel="nofollow">FF Tisa Sans is available through FontFont.</a></p>
