    <p>I've been really enamored by Google Trends lately, so I thought I'd share a few type-related graphs of online searching patterns:</p>
    <p><a class="freelinking external link-external" href="http://www.google.com/trends?q=fonts" rel="nofollow">Fonts</a><br>
    <a class="freelinking external link-external" href="http://www.google.com/trends?q=typography&amp;ctab=0&amp;geo=all&amp;date=all&amp;sort=0" rel="nofollow">Typography</a><br>
    <a class="freelinking external link-external" href="http://www.google.com/trends?q=type+design&amp;ctab=0&amp;geo=all&amp;date=all&amp;sort=0" rel="nofollow">Type Design</a><br>
    <a class="freelinking external link-external" href="http://www.google.com/trends?q=typefaces&amp;ctab=0&amp;geo=all&amp;date=all&amp;sort=0" rel="nofollow">Typefaces</a></p>
    <p>My guess is the downward slide of terms like "fonts" (in particular) and "typefaces" are due to the siren song of free fonts wearing off on the general population. I'm guessing that "typography" follows patterns in the school year, too.</p>
