    <p>Hi everyone, I got into this movie project a few weeks ago and I was wondering if anyone could suggest me a typeface for the title signature.<br>
    The movie is about the ‘70s Black Rio soul and funk movement in Brazil.</p>
    <p>The Black Rio movement had to battle the odds – black soul was perceived as not being authentically Brazilian and the country was under the rule of General Emilio Garrastazu Medici’s oppressive dictatorship which effectively suffocated cultural expression between 1969 and 1974. Still, the movement took hold as disenchanted black Brazilian youth mirrored the struggles of their contemporaries in the US with their own potent brew of samba, soul and funk. Black Rio parties attracted thousands, bands including Banda Black Rio and Uniao Black were created from the scene and music figureheads like Jorge Ben began exploring more dense, Afro directions on albums including ‘Africa Brasil’.</p>
    <p>I was thinking of using something super bold like Facebuster, but I can't make my mind up.</p>
    <p>You can see a tiny trailer of the movie <a class="freelinking external" href="http://vimeo.com/4141936" rel="nofollow">here</a>.<br>
    I had nothing to do with the titles on this trailer.</p>
    <p>Guerapá(the name of the movie) means "get up" as it is pronounced with a heavy brazilian accent when singing Sex Machine by James Brown.</p>
