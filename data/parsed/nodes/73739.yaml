    html: <p>Oxbodkins –&nbsp;terrific replies! What I wanted to say is that there probably aren’t any proper (and common) animal names starting with umlauts. <a href="http://www.aeffleundpferdle.de/" rel="nofollow">Äffle</a> is a little ape, Öchsle – as Nina explained – a little Ox. <em>The</em> <a href="http://de.wikipedia.org/wiki/Öchsle_(Bahn)" rel="nofollow">Öchsle</a> is a narrow gauge railway that ends in Ochsenhausen. Überich is a German word, but it is neither an animal nor masculine. Although I can imagine it to be one, some creature living in the forest around Überlingen.</p>
    html_clean: <p>Oxbodkins –&nbsp;terrific replies! What I wanted to say is that there probably aren’t any proper (and common) animal names starting with umlauts. <a href="http://www.aeffleundpferdle.de/" rel="nofollow" class="link-external">Äffle</a> is a little ape, Öchsle – as Nina explained – a little Ox. <em>The</em> <a href="http://de.wikipedia.org/wiki/Öchsle_(Bahn)" rel="nofollow" class="link-external">Öchsle</a> is a narrow gauge railway that ends in Ochsenhausen. Überich is a German word, but it is neither an animal nor masculine. Although I can imagine it to be one, some creature living in the forest around Überlingen.</p>
