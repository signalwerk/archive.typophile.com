    html: |-
      <p>If you only need the font for a few characters, I would just modify one of the available fonts. You might spend more time looking for the exact font than it would take to just modify one that you have.</p>
      <p>You can use Illustrator to do this:</p>
      <p>1) Place your graphic on a background layer<br>
      2) Set your text using an existing font<br>
      3) Convert the text to outlines<br>
      4) Adjust as necessary</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/screen-capture_4149.jpg"></div><p></p>
