      <p>Thanks.</p>
      <p>I spotted Titling Gothic, as well as <a href="http://www.fontshop.com/fonts/singles/monotype/placard_condensed" rel="nofollow">Placard Condensed</a> yesterday.  Placard Condensed seemed to have the low riding crossbar on the "A" as well as the angled "M" legs, but missed in a few other areas like the "J" and the corner radii of some of the other characters.</p>
      <p>The font I'm looking for may have come from an Apple Mac in the late 80's, possibly with Adobe Illustrator.</p>
      <p>I like to match this font more closely for a graphic.  I'm sort of new at font matching; what is the likelyhood of me finding a more accurate match?  Should I just take one of the above fonts and start modifying it?</p>
      <p>I haven't modified a font in 15 years.  If that's the route I have to go, is there an editor that I can bring a background graphic into and sort of trace over it for accuracy?</p>
      <p>Thanks again,</p>
      <p>Chris</p>
