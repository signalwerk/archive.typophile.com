      <p>Except for a couple of characters, it looks very similar to Raleigh Gothic: <a href="http://www.myfonts.com/fonts/grouptype/raleigh-gothic/" title="http://www.myfonts.com/fonts/grouptype/raleigh-gothic/">http://www.myfonts.com/fonts/grouptype/raleigh-gothic/</a><br>
      <a href="http://www.myfonts.com/fonts/redrooster/raleigh-gothic-rr/" title="http://www.myfonts.com/fonts/redrooster/raleigh-gothic-rr/">http://www.myfonts.com/fonts/redrooster/raleigh-gothic-rr/</a></p>
      <p>Modern releases of this font are based on the original by Morris Fuller Benton, done in the 1930s. Perhaps what you're looking at is from an older specimen.</p>
      <p>That may not be correct, but at least it's a starting point.</p>
      <p>Best of luck.</p>
