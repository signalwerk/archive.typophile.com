    html: |-
      <p>The problem might be caused by the entries in the <em>‘name’ table</em>. At the other hand, if the TTF variant(s) work(s) properly, this is less likely.</p>
      <p>For checking the ‘name’ records, you can download the free Light version of <em>DTL OTMaster</em> at <a href="http://www.apple.com/downloads/macosx/development_tools/dtlotmaster.html" title="http://www.apple.com/downloads/macosx/development_tools/dtlotmaster.html">http://www.apple.com/downloads/macosx/development_tools/dtlotmaster.html</a> and run the <em>OTF Consistency Checker</em> on the name entries. Furthermore, you can use the <em>OTF Consistency Checker</em> to diagnose some other table entries also.</p>
      <p>FEB</p>
    html_clean: |-
