    <p>Hi There!</p>
    <p>I’ve designed a Typeface in Fontlab (5.0.4) and generated it as Win TrueType/OpenType TT and as OTF.</p>
    <p>Both work well on a Mac, but client says OTF does not work on a PC. ("Font can not be activated on a PC")</p>
    <p>I thought that OTF works on both systems Mac and PC. Or am I wrong here?</p>
    <p>Is there a "special" adjustment in the preferences I have to make to get a OTF font that will work proper on a PC.</p>
    <p>Unfortunately I don’t have a PC to test : /</p>
    <p>Thanks!</p>
