    html: |-
      <p>It's a bit more complicated than that.... A *properly made* OpenType CFF (.otf) font works fine on Mac and Windows. But fundamentally, you can't be sure you have reliable cross-platform fonts without all the relevant platforms to test on. There are some fields in the font that are only relevant on one platform or the other.</p>
      <p>Is it just one font, or an entire family?</p>
      <p>On a good day, I might offer to take a look, but I'm moving this week, so that would be foolish of me.</p>
      <p>Cheers,</p>
      <p>T</p>
