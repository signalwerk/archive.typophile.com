      <p>Shivat,<br>
      by historical reasons members of this forum are somewhat sensitive when postings like yours (the 1st one) appear. Look what you’ve written:<br>
      “the topic i had in mind was about history of newspaper typography, any suggestion?”</p>
      <p>You state that you have something in mind and then you ask for *any suggestion*.<br>
      This is not the same as describing one’s work (!) and asking for help with *that*.</p>
      <p>Do your own work yourself first an then you’ll find lots of friends here to help you. You’ll also find out by time that, the more specifically you ask, the more substancial responses you may get.</p>
      <p>Anyway, *welcome to Typophile.</p>
