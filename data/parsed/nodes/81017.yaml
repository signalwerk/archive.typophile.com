      <p>My opinion is that Fritz resembles Kina mainly because of similar glyph proportions and especially weight which seems to be spot on.</p>
      <p>But shapes are different even though at this weight they diminish. If Fritz comes out not only as thin but also as light, regular bold and black it will become more distinctive from Kina.</p>
      <p>Regular weights usually set shape differentiator.</p>
      <p>P.S. Even though Kina is more uniform compared to the current state of Fritz I don't like it's ball terminals. Seem odd on those letters. I see lots of dots because of them.</p>
