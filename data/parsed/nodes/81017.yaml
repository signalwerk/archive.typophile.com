    <p>Hi all,<br>
    just wanted to get some professional words from everyone.<br>
    This is Fitz, an old style, single stroke width slab serif.<br>
    Its a single stroke width throughout - and I'd like to keep it that way - unless I add little ink traps or feel the need to optically modify some strokes.</p>
    <p>I've actually finished all the upper &amp; lowercase characters but I've only set up this png.<br>
    I want to include some alternative glyphs but at the same time I want some good default characters - the Q &amp; K come to mind as having swashes or alternates.<br>
    I'm also curious about your thoughts on the variations of b/f/m/s &amp; the single serif of v &amp; x.<br>
    Ignore the earless g and first t, I don't like them at all.<br><img src="/sites/default/files/old-images/typeface_5634.png"></p>
    <p>I'll post more soon.</p>
    <p>Thanks in advance</p>
