      <p>No, it seems it was published as a standalone Italic. Try this (English language) link: <a href="http://www.global-type.org/Searching.743.0.html" title="http://www.global-type.org/Searching.743.0.html">http://www.global-type.org/Searching.743.0.html</a><br>
      Alas, Global Type doesn’t allow direct links. You have to enter ‘Recta’ into the ‘Name’ field, it’s the only hit that has an image. Not much information, though.</p>
      <p>The <a href="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftgiessereien/Berthold/BertholdAG.pdf">pdf on H. Berthold types</a> by Klingspor Museum confirms that there was a Recta-Kursiv published in 1926 – but it has no sample.<br>
      F</p>
