    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 4.Dec.2003 1.23pm </div>
      <p>For those inspired by the poster designs of yesteryear, this is something not to be missed. Some samples from this exhibit can be viewed online. <br> <br>Posted in behalf of the International Poster Gallery <br> <br>"This year’s holiday show beckons viewers to the mountains with a richly diverse selection of ski posters from 1908 through the 1970s. More than 100 rare, original vintage posters tell the tale of the fascinating transformation of skiing from a sport into a global industry, showing changes in equipment, technique, competitions, and facilities over the years. <br>     One of the most sought-after poster collectibles today, ski posters capture the joy of fresh mountain air and the exhilarating rush of a downhill run through tree-lined glades. Combining travel, sports and fashion, the ski poster has achieved immense popularity, rivaling the traditional blue chip categories of ocean liners and luxury trains." <br> <br>December 5, 2003 through January 5, 2004 <br>International Poster Gallery <br>205 Newbury Street, Boston, Massachusetts <br><a href="http://www.internationalposter.com/exhibits.cfm" target="_blank">http://www.internationalposter.com/</a> <br> <br></p>
