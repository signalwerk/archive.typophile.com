    html: |-
      <p>Welcome. But first things first and it will be harsh:</p>
      <p>Another neutral text sans serif...<br>
      Go to whatfontis.com and run the search. You'll get a ton of similar typefaces. Because even a decade ago there already was an over-saturation for such style.<br>
      Then ask yourself: what can help your font stand out from the sea of others? Is it design (not the case yet), language support, opentype features, ornaments. Maybe being free? But then again, browse fontsquirrel.com for a bit.</p>
      <p>That was only one part. Here's the other:<br>
      To design a working text typeface, you need a lot of experience. To make it a stand-out takes even more. On top of that, they take the longest to finish. Plus, you'll need bold and italic styles too.</p>
      <p>What I'm trying to say is:<br>
      No one can forbid you to do it, but you'll be spending a lot of your time on a project that will be lost between typefaces having more original designs done by more experienced professionals (I'm no professional myself ). It's too steep learning curve. On the other hand, there are too much geometrical "circle + line" typefaces too.</p>
      <p>Be original.</p>
      <p>P.S. Capitals are too narrow...</p>
