    <p>All hail wise experts</p>
    <p>I'm new to this site so... Hi there.<br>
    I'm working on this typeface (I've never finished one) and I could need some advice from more skilled eyes than mine. I don't have all the characters and havent done the kerning yet (because I suck at kerning).</p>
    <p>Thanks for your constructive criticism.</p>
    <p>(EDIT) To boring? you can tell me that as well. Please talk to me :)</p>
    <p>(EDIT2) Do you need more information? This font is mainly inspired by the classic American Gothic fonts. I didn't really have a sertain goal in mind, I just combined elements I like (Though I heard thats the wrong way to do it)</p>
