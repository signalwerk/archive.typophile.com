  html: |-
    <p>Ascender is pleased to announce the release of <a class="freelinking external" href="http://www.ascenderfonts.com/font/bertham-pro-family-4-fonts.aspx" rel="nofollow">Bertham Pro</a>, another Goudy revival from the Ascender team. </p>
    <p>This classic face has been digitally remastered and brought back to life in all its OpenType glory by Steve Matteson. The Bertham Pro family includes 4 fonts: the original roman weight designed by Frederic W. Goudy’s Bertham and three new styles (bold, italic and openface) created by Steve Matteson.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bertham_3912.png"></div><br>
    The Bertham Pro fonts include a variety of OpenType features including swash capitals, small capitals and old style figures. Bertham Pro has a distinctive quality that is unmistakably American in appearance recalling a day of quality craftsmanship and hard work.<p></p>
    <p>View the fonts at <a class="freelinking external" href="http://www.ascenderfonts.com/font/bertham-pro-family-4-fonts.aspx" rel="nofollow">www.AscenderFonts.com</a></p>
