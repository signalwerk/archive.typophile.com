      <p>In case you are looking for typefaces similar to the one in the sample you linked to:<br>
      Try a no-nonsense Grotesque that has an R with a straight leg, like <a href="http://www.fontshop.com/fonts/singles/linotype/news_gothic_no_2_com_bold/?sample_text=RUE%20DE%20RIVOLI%201e%20Arr" rel="nofollow">News Gothic</a>, <a href="http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-bq/familytree.html" rel="nofollow">Akzidenz-Grotesk</a>, <a href="http://www.fontshop.com/fonts/singles/linotype/neuzeit_s_std_book_heavy/?sample_text=RUE%20DE%20RIVOLI%201e%20Arr" rel="nofollow">Neuzeit Grotesk</a>, maybe <a href="http://www.fontshop.com/fonts/singles/linotype/avenir_std_85_heavy/?sample_text=RUE%20DE%20RIVOLI%201e%20Arr" rel="nofollow">Avenir</a>. More recent takes on this field: <a href="http://www.lineto.com/The+Fonts/Font+Categories/Text+Fonts/Akkurat/Fett/" rel="nofollow">Akkurat</a>, or, more in the geometric line, <a href="http://www.fontshop.com/fonts/singles/mark_simonson/proxima_nova_semibold/?sample_text=RUE%20DE%20RIVOLI%201e%20Arr" rel="nofollow">Proxima Nova</a>.</p>
