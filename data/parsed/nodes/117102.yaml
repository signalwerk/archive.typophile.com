      <p>During that era, I think that the replacement of hand lettering in process graphics, for headlines, by pre-made lettering, offered the major opportunity for the top lettering artists to become type designers—in as much as they were working with the medium of phot0-typositor. </p>
      <p>My take on the subject:<br>
      <a href="http://www.shinntype.com/Writing/GoldenAge.pdf" title="www.shinntype.com/Writing/GoldenAge.pdf">www.shinntype.com/Writing/GoldenAge.pdf</a></p>
