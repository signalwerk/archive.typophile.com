      <p>There are probably folks around here who know more about that period than I do. But I will share a few thoughts.</p>
      <p>There were definitely no degree programs or schools actively teaching type design as a degree program at that time, and AFAIK there were no college or university courses available in type design at that time. It was very much an on-the-job apprenticeship kind of thing. It was its own specialty/profession, although type designers often came from the larger field of graphic design, especially book design and the like.</p>
      <p>The short-lived Master's program at Stanford didn't happen until the early or mid-80s. It only graduated five students (one of them being Carol Twombly). The next such thing anywhere in the west was the MA Typeface Design at Reading, which started around 1995. Then the Type &amp; Media program at the Hague in 2002....</p>
      <p>Type design was a very male-dominated profession back then. The only female type designer of that period that springs to mind for me is Margaret Calvert. One started seeing more women in type design toward the end of the phototype period, in the late 1970s and early 1980s, with Fiona Ross, Veronika Elsner, Freda Sack and others.</p>
