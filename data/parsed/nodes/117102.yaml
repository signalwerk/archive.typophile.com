    <p>Hi there, </p>
    <p>I'm doing research for a project involving the type design profession during the mid-20th century (40s – 60s)</p>
    <p>Specifically, I'd like to read personal accounts and/or descriptions of what the industry was like for type designers during that period. Subjects I'm especially interested in are: </p>
    <p>- What were the big foundries in the US at that time (ie, where did type designers want to work)</p>
    <p>- How did people go into type design—were there colleges that taught that subject at that time or was it more of an apprenticeship path?</p>
    <p>- What schools, if any, offered courses and studies in type design during that period?</p>
    <p>- Was type design considered its own specialty/profession back then, or did it emerge out of a larger field?</p>
    <p>- What was the percentage of young women going into type design during that period? Was it rare/unheard of? (ideally, I'd love to read personal stories by women who did become type designers during that time.)</p>
    <p>So far it's been hard trying to find specifics as most resources seem to focus more on the history of typefaces and typography itself, rather than the history of the type designers' profession. Any info, links, or book/doc recommendations would be most appreciated!</p>
