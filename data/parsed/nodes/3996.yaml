    html: <p> We don't call it casserole in these parts, it's hot dish. The tatortot variety is as tasty as you may expect. the formula I believe is one part cheese/sour cream with one part meat with one part carb party (tatortots, macaroni, mashed potatoes) <br> <br>The combinations are endless and usually flavorless. <br> <br>I am a fan of the Jello molds though, I have a nice 50s recipe of one made with chicken broth that suspends radish slivers, carrots, and contains a liver paté it's really quite scrumptious looking as well. <br> <br>I can only imagine being invited to a dinner party where that concoction is wheeled out on a serving cart and unveilied beneath a silver dome - I can hear the "Ahhhh's" of the dinner guests now! <br> <br>:D </p>
