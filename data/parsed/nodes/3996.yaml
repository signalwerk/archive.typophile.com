    html: "<p>You're probably not going to find a match: you need a perfectly monoline connected script, and there aren't that many. Even the one called <a href=\"http://www.myfonts.com/fonts/agfa/monoline-script-mt/\" target=\"_blank\"> Monoline Script</a> from Monotype isn't exactly Monoline... :/ What you might try is go over to MyFonts.com where I made you a link with <a href=\"http://www.myfonts.com/Search?searchtext=connected script&amp;x=28&amp;y=9\" target=\"_blank\"> connected scripts</a>. Browse through the list and testdrive a couple of them. This is for example what you get when you set it in <a href=\"http://www.myfonts.com/fonts/shinn/handsome/bold/testdrive.html?s=Titleist&amp;p=48\" target=\"_blank\"> Handsome Bold</a> by Nick Shinn. See what else you can find. Good luck... you'll need it.</p>"
