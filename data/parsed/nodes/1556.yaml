  - id: 12606
    user: 1832
    date: 2003-10-16T09:33:00
    date_raw: 16 Oct 2003 — 9:33am
    votes: null
    html: "<p>Merde indeed: it looks like FontBook won't be my savior after all. I can live without auto-activation (like Jean, I prefer to know what's happening behind the scenes), but this report showed up this morning on <a href=\"http://www.macintouch.com/panreader.html#oct16\" target=\"_blank\">MacInTouch</a>: <br> <br> <br><b>Font Book warning</b>   <br> <br>I was eagerly looking forward to replacing Extensis' Suitcase 10 with Panther's  built-in Font Book to manage my 9000 fonts. Tonight I installed Panther and immediately  started importing type.  <br> <br>I dragged a folder of about 2000 fonts into the sets pane as I would in Suitcase  10. What took Suitcase 30 seconds to process took Font Book about 10 minutes.  When it was done, I realized it had activated all 2000 fonts. There does not appear  to be a way to disable this activate at addition behavior, which would make the  job of importing 9000 fonts extremely unpleasant.  <br> <br>Fortunately, it was instantly clear that Font Book was not going to work for  me. Activating and deactivating was very slow, and opening the application with  just 500 fonts took a very long time. I began removing my fonts from Font Book.  <br> <br>Here's where I discovered the worst of Font Book's bad behavior: it had added  each of the fonts to a single Fonts folder, DELETING them without warning from  the alphabetical and foundry-sorted folders that they have lived in for years.  Had I installed all of my fonts, fixing this would have taken much longer than  the half hour I just spent on it. Again, there's no obvious way to disable this  default behavior.  <br> <br>I wanted to love Font Book, but it has miles to go before it's any competition  for Suitcase or Font Reserve. I have a hard time understanding why Apple hyped  this application; getting designers excited about built-in font management software  and delivering a tool that definitely won't address their needs is counter-productive.  The upside is that it convinced me to download the Suitcase X1 demo; and I'm extremely  impressed with the progress Extensis has made with this application. </p>"
