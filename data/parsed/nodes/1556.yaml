    html: "<p>*bounce* *bounce* *bounce*  <br>That's me being happy about the Oct.24 release of Panther, and with it the release from servitude to crappy 3rd-party OS X font-management apps. (ATM Deluxe, I pine for thee. *sob*) <br> <br>Uh, what was the question? Oh yes... The nearest answer I could find was this: \"Font Book enables and disables fonts dynamically, allowing you to switch between different font sets without restarting applications.\" Granted, that's not necessarily auto-activation -- depends what they mean by \"dynamically.\" <br> <br>A recent post asked about font-previewing utilities for OS X. Looks like Font Book does have that feature: \"Double-clicking a font file (or a group of them) in the Finder opens a preview of the font, with the option to install it in just one click.\" <br> <br>There's a decent PDF showing the features of FontBook here: <a href=\"http://www.apple.com/macosx/features/fontbook/\" target=\"_blank\">http://www.apple.com/macosx/features/fontbook/</a>.  (Click on \"Fonts in Mac OS X Technology Brief.\")</p>"
