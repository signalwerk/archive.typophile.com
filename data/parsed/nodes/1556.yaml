    html: <p>I wasn't suggesting anybody should wait for QuarkXPress 7 for anything. I just thought it was interesting news, and that people would want to know. <br> <br>It's an interesting question as to how long it will take them to get QXP 7 to the market. They managed version 6 in 18 months (standard for the industry, but lighting-fast for Quark). But they've also just transitioned their development to India. they now have much less experienced but perhaps many more engineers to throw at the application. <br> <br>I have no idea how long it will take, but my guess is that the engineering changeover will significantly increase the bugs in the application.  <br> <br>Anyway, regardless, I am of course not encouraging anybody to wait. InDesign is a wonderful application and everyone should buy it.  <br> The new CS version shows all the signs of an increasingly mature application, with increasing attention to workflow issues and performance as well as continuing to add innovative new features like nested styles. <br> <br>Of course, seeing as I work at Adobe, you may not expect me to be unbiased in this matter. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Regards, <br> <br>T</p>
