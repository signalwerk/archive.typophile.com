    html: "<p>Found this today on <a href=\"http://www.macintouch.com/panreader.html#oct13\" target=\"_blank\">MacInTouch</a>: <br> <br> <br>Julian Hearne writes: <br><i>I saw no mention in the new Panther Font Management description that indicates  it supports auto-activation.</i> <br> <br>It does not. Apple representatives at Seybold and other venues have been quite  upfront that, for professional design/prepress/print work, Font Book will probably  not cut it for many users.  <br> <br>This is OK, as Font Book does many things that average users will appreciate,  and one thing that pros will REALLY appreciate: it lets us deactivate those pesky  system dfonts (Helvetica, Times, etc.) easily and without any dire consequences,  unlike in Jaguar.  <br> <br>Certainly in a prepress environment Julian will still need a font manager.  I think the combination of Suitcase and Font Reserve will yield a very functional  and robust product, as both approaches have their merits. And there are other  font managers around if you don't like that approach. But for auto-activation,  Font Book will not do the job.  <br> <br>Chuck Wege</p>"
