    html: <p>QuarkXPress 6 does not support Unicode. <br> <br>In direct conversation, Juergen Kurz says that QuarkXPress 7 will support Unicode (as well as OpenType layout features). He claims they're allocating 18 engineers for 9 months to add Unicode support, which seems like a plausible amount of work. <br> <br>(Of course, among our applications, InDesign has been Unicode based since 1.0., Photoshop since 5.5 or so, and the about-to-ship Illustrator CS speaks Unicode as well. Current versions of Premiere and AfterEffects also have Unicode text engines.) <br> <br>Regards, <br> <br>T</p>
