      ...And that Typophile is not a job board.</em></p>
      <p>I'm sorry for the misleading statement. I know that what he got isn't going to get him far. I've seen CD art layed out for printing, and in essence, all he got was an idea. (Probably too tasteful of one for a high school rock band to recognize the value of).</p>
      <p>I was just making the point that Hamilton make something cool.</p>
      <p>Some people will do something for the fun and joy of doing it. Should they be banned from creating things just for the fun of it? </p>
      <p>Trying to be fair, in a forum attended heavily by pro designers, maybe...but a high-shooler wouldn't have thought it through, certainly.</p>
