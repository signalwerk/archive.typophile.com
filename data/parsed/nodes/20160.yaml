    html: <p>Lawyers on a whole respect their own work more than many designers. I can’t imagine a lawyer simply giving away his/her service for little to nothing to the same extent designers do. Sadly people feel justified in asking for design for nothing.. and even more sadly there are designers willing to ablige, which only perpetuates the myth that what we do is nothing more than fun and therefor we should be willing to design for little to nothing:(</p>
