    date: 2006-05-23T02:46:00
    date_raw: 23.May.2006 2.46am
    votes: null
    html: "<p>A few of the other forums I belong to take pride in the fact the each user has at least 10 different fake accounts for silly things like this. I am not so sure that that brand of humor is well tolerated here though. Regardless, I find this humorous, while at the same time I sit and shake my head wondering how someone would think anyone would just freely give something to someone else. I suppose it is possible, but isn’t it always interesting to see how the creative professionals are the ones that are the most likely targets. As if this person were saying: “oh yeah, this is easy stuff, just whip me up a logotype, ti won’t take you but 5 minutes.” You wouldn’t ask a lawyer to give you a freebie, unless your the next OJ Simpson, and I think that the presumptive nature of many individuals is rather obtuse.</p>"
    html_clean: "<p>A few of the other forums I belong to take pride in the fact the each user has at least 10 different fake accounts for silly things like this. I am not so sure that that brand of humor is well tolerated here though. Regardless, I find this humorous, while at the same time I sit and shake my head wondering how someone would think anyone would just freely give something to someone else. I suppose it is possible, but isn’t it always interesting to see how the creative professionals are the ones that are the most likely targets. As if this person were saying: “oh yeah, this is easy stuff, just whip me up a logotype, ti won’t take you but 5 minutes.” You wouldn’t ask a lawyer to give you a freebie, unless your the next OJ Simpson, and I think that the presumptive nature of many individuals is rather obtuse.</p>"
