      <p><em>And better than you probably would have got even if you had paid money</em></p>
      <p>There is something that greatly troubles me about this comment...</p>
      <p>...........</p>
      <p>I guess Typophile's Design forum is all set to become the new Craigslist job board, where bands ask for logos, promising all kinds of work for the logo designer if they "make it big". And if they don't, well, the designer has a nice portfolio piece, right? Right?</p>
      <p>Having said that, it seems that the members of Dratakis <em>really are</em> in high school...</p>
      <p><a href="http://www.myspace.com/rockmaniac" title="http://www.myspace.com/rockmaniac">http://www.myspace.com/rockmaniac</a></p>
      <p>But in my humble opinion, that doesn't excuse them from finding out that designers need to make a living, just like everybody else.</p>
      <p>And that Typophile is not a job board.</p>
