      <p>We humans are social animals, and we all desire the positive regard of others. This factor of 'ego' or pride is an important motivator, and can take positive and negative forms. </p>
      <p>The positive form of pride is that the person is aware of his or her gifts, and wants to use them to benefit others, and enjoy the process of doing the work. And they will enjoy the honor that comes from their contribution.  </p>
      <p>Einstein put it beautifully when he wrote: "The most important motive for work in the school and in life is the pleasure in work, pleasure in its result, and the knowledge of the value of the result to the community."</p>
      <p>The negative form of pride is arrogance, when one tries to build one's self up by not listening to others, tearing them down and dominating them. </p>
      <p>Added:</p>
      <p>Tom, I think you are confusing criticism of one's own work and running one's self down as a person. On the latter many are their own worst enemies, yes, and that is no good. </p>
      <p>But on criticism of one's own work, that it is rarely the case. First of all most people will be totally indifferent to your work, which is the worst criticism. Second, those with greater or even equal experience and expertise will see things you don't. </p>
      <p>I completely agree with Kris on the benefit of an outside editor, particularly when you are starting out. I certainly have followed that principle, and have recommended it to others. And I am delighted to see that with that with that additional input Kris is going 'from strength to strength' as a type designer.</p>
