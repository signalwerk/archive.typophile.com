      <p>&gt; who here doesn’t like to see their own letters on screen when typing?</p>
      <p>This is actually a very interesting paradox, and one that some desginers never experience; some of them have even reacted a bit violently when I've suggested it myself: when you use a font, in a way you're violating it. Not because of some virginity envy, but because a font is really an abstract thing that's qualitatively greater than any instance of its usage.</p>
      <p>On the other hand, even though I do occasionally feel the above, I do also generally feel very good when I hit some keystrokes in a new font! And that's in fact the norm with type designers as far as I can tell.</p>
