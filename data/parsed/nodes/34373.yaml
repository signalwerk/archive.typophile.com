      <p><em>Arrogance and vanity. Possibly.</em></p>
      <p>Hmmm. You, know, George Orwell once wrote down what he considered the four motivations for writing, and numero uno on his list was...</p>
      <p>"1. Sheer egoism. Desire to seem clever, to be talked about, to be remembered after death, to get your own back on grown-ups who snubbed you in childhood, etc. etc. It is humbug to pretend that this is not a motive, and a strong one. Writers share this characteristic with scientists, artists, politicians, lawyers, soldiers, successful businessmen -- in short, with the whole top crust of humanity."</p>
      <p>He goes on to list the other motives: aesthetic enthusiasm, historical impulse and political purpose... in that order. And then he adds,</p>
      <p>"It can be seen how these various impulses must war against one another, and how they must fluctuate from person to person and from time to time."</p>
      <p>(Taken from "Why I Write," first published in 1946.)</p>
