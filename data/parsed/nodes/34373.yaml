      <p>The concept of "classic" not as an object but as a relation.<br>
      Indeed, it’s not the apple (Newton’s, but you may associate it to the computer tool as well) or the magic moment that matters much, it’s the <a href="http://typophile.com/comment/reply/34183/206219" rel="nofollow">work</a> before and after. Big thoughts are fun to romanticize, but it’s many small insights coming together that bring big ideas into the world.<br>
      It’s no accident that type designers study type.<br>
      Part of the challenge of innovation is coming up with the problem to solve, not just its solution ; according to <a href="http://en.wikipedia.org/wiki/Freeman_Dyson" rel="nofollow">Dyson</a> <em>“it’s very important to be idle... people who keeps themself busy all the time are generally not creative.”</em><br>
      A typeface is like a fact, and a fact is like a sack——it won’t stand up till you’ve put something in it. So, evolution in type design probably means only that what’s on top is fit for the current environment, not that it’s “better.”</p>
