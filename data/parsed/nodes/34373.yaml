      <p>Well, to give you another paradox, I strongly believe modesty &amp; pride can go hand in hand. It's a question of being able to objectively judge yourself which -I know- sounds like a complete contradiction. I can only speak for myself when I say I'm probably my best (or worse, depends on how you interprete it) criticist &amp; I'm sure there are more people out there like me. Being your own judge has the adventage that you can take everything into account which is something an outsider can't do. You know where you're coming from, where you wanted to go (and your limits as to how far you can go at a certain point) &amp; where you ended up &amp; how you got there. So even a modest person can be openly proud when he has achieved something in his own best potential. This obviously often gets confused with arrogance, but for that I refer to a previous post of mine in this thread ;-)</p>
