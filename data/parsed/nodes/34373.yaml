      <p>Besides the "two obvious ones" (which they are) there's a distinct third one in non-Latin type design: politics (if in the loose sense). Certainly not every non-Latin type designer thinks in those terms - in fact some try hard not to! But whenever you see something like Nour&amp;Patria, or even something like a Hellenicized Latin (Carter's Skia; Michail Semoglu's work) you can safely assume there's some "culture-clash" undercurrent at work there.</p>
      <p>And then there's the "ideological" motivation, which is not as rare as one might suspect. Think of the 20th century's penchant for making type "rational" = sans. But think also of Legato, which embodies what Evert (and I as well to a good extent) thinks type <cite>should</cite> be, irrespective of sales, personal expression, etc.</p>
      <p>hhp</p>
