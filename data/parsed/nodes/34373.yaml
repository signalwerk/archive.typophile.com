    <p>I've started a series of articles on <a href="http://www.fontshop.be/" rel="nofollow">Unzipped</a> about type design. These are intended to be an introduction, to explain to novices what type design is. In the <a href="http://www.fontshop.be/details.php?entry=161" rel="nofollow">first episode</a>, I dwell a little on the motivation of designers to start on a new typeface.</p>
    <p><a href="/wiki/Peter%20Bilak" class="freelinking" rel="nofollow">Peter Bilak</a> reacted in an e-mail, and this comment had me particularly intrigued:</p>
    <p><em>“(...) to explore other motivations for designing type. I am sure there is more than craft/technology versus art. (...) I am wondering myself what are the motivations to create type, besides the two obvious ones: problem solving, and urge to express oneself artistically. I used peculiarities of language as inspiration for making Eureka and Greta. A new Typotheque project embraces entire typographic history as a single source of inspiration, so the result is poly-historical. But again, these are personal stands, and I am wondering what else can serve as inspiration; these are the issues I discuss with my students when they are starting their type projects."</em></p>
    <p>So I thought it would be interesting to post his question here and listen what other motivations might be a reason to start on a new type design.</p>
  html_clean: |-
    <p>I've started a series of articles on <a href="http://www.fontshop.be/" rel="nofollow" class="link-external">Unzipped</a> about type design. These are intended to be an introduction, to explain to novices what type design is. In the <a href="http://www.fontshop.be/details.php?entry=161" rel="nofollow" class="link-external">first episode</a>, I dwell a little on the motivation of designers to start on a new typeface.</p>
    <p><a href="/wiki/Peter%20Bilak" class="freelinking link-lost" rel="nofollow">Peter Bilak</a> reacted in an e-mail, and this comment had me particularly intrigued:</p>
    <p><em>“(...) to explore other motivations for designing type. I am sure there is more than craft/technology versus art. (...) I am wondering myself what are the motivations to create type, besides the two obvious ones: problem solving, and urge to express oneself artistically. I used peculiarities of language as inspiration for making Eureka and Greta. A new Typotheque project embraces entire typographic history as a single source of inspiration, so the result is poly-historical. But again, these are personal stands, and I am wondering what else can serve as inspiration; these are the issues I discuss with my students when they are starting their type projects."</em></p>
    <p>So I thought it would be interesting to post his question here and listen what other motivations might be a reason to start on a new type design.</p>
