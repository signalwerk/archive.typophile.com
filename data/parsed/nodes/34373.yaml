      <p>Almost all of the typefaces I have started (I have yet to see when I will <em>finish</em> one to my satisfaction) have come about by making custom type for some particular thing, and then later thinking "perhaps I could make a whole face from that."</p>
      <p>Bilak says "problem solving" but I would add "puzzle solving" and stress that they are different things. The former is in service of a need, a use; the latter is compulsive play. The initial concept of a typeface is an open-ended puzzle that begs to be solved just "because it's there".</p>
    html_clean: |-
