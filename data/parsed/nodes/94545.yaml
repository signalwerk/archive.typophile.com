    date_raw: 9 Jul 2012 — 10:41am
    votes: null
    html: <p>The problem is not in the font. OpenType Arabic relies on script shaping engines, e.g. Microsoft's Uniscribe, to analyse character strings and determine which OTL substitution features to apply to each character. The shaping engine makes this determination based on Unicode character properties. So for any Arabic character that the shaping engine knows about, is has a record of whether it is non-joining, dual-joining or right-joining, and then applies the appropriate layout features depending on the position of that character in the text string. The problem you are observing with U+0620 is almost certainly because the shaping engine does <em>not</em> know about this character because it is a new addition to Unicode and the shaping engine has not been updated to include a record of its properties and how to handle the layout.</p>
