    html: <p>I have not done this recently, but if you have an updated Uniscribe and can locate the one used by Office on your system you can simply replace the usp10.dll file. However, I don't know if this still works (there were concerns about usp10.dll as a possible security risk some time ago, so access to it might be more restricted), and it probably voids your warranty and may be contrary to the Office license agreement.</p>
