    html: |-
      <p>Microsoft Office and Windows both ship with versions of the Uniscribe shaping engine. Word will use the Office version of Uniscribe.</p>
      <p>Try testing your font in Notepad, which will use the Windows version of Notepad. This will reveal whether U+0620 is supported in that version, although I doubt it since the character was added in 2010. That was probably too late for Windows 7 and probably even or Office 2010.</p>
      <p>I will write to some colleagues at Microsoft to find out whether U+0620 is supported in the upcoming Windows 8 version of Uniscribe.</p>
