    html: |-
      <p>Without the sharp edge provided by the letterpress imprint (or an embossing), metallic on uncoated, especially rag, looks blurry. I believe this is because the fibre disperses what little light is reflected off the ink in different directions, breaking down the sharpness of the edge.</p>
      <p>For your design, I would recommend foil stamping, possibly with a separate hit of embossing (either down or up) to sharpen up the edge.<br>
      But the design doesn't have fine detail (e.g. as in type), so even a little bit of roughness at the foil edge wouldn't be too bad.</p>
      <p>However, don't go on my recommendation alone, the best thing to do is to look at printed samples that you are holding and shifting to see the effect.</p>
