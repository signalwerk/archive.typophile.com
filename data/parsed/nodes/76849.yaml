      <p>IMO silver ink does indeed look like crap on uncoated stock.<br>
      It doesn't shine and looks kind of green and dirty and granular.<br>
      This is my unfortunate experience.<br>
      Only the exaggerated letterpress impression redeems the sample you link to.<br>
      A smooth grey ink would have been better.</p>
      <p>I would recommend a matte coated stock for silver ink.<br>
      That would be a lot safer.<br>
      I mean, why bother with a metallic if you don't let it shine?</p>
