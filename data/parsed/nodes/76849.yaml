    <p>Hi,<br>
    I plan to letterpress-print a Xmas card and have a difficulty deciding on the colour. I thought about using Pantone 877U or Black 7U.</p>
    <p>The card will be printed on a 100% cotton stock and printer claims silver (PMS 877) doesn't look silver but greyish due to the paper high absorbability factor. However, I've found an <a class="freelinking external" href="http://cloudery.wordpress.com/2009/02/21/spiderling-cloud-letterpress-edition" rel="nofollow">example</a> online that looks quite good...</p>
    <p>I haven't seen any sample myself and don't have time to organise one so I have to trust someone... Anyone have an opinion on how silvery the uncoated silver is? Anyone used 877 or Black 7 on 100% cotton paper? Does it look different form normal grey/black? Would you recommend using it?</p>
    <p>Thanks in advance!<br>
    Aleksander</p>
