      <p>Generally, metallic letterpress inks lose most of their sheen on uncoated stock. A "silver" will simply look grey unless it's on glossy/coated stock (I've made this mistake). Have you considered foil stamping? Otherwise, I would go with the black.</p>
      <p>Josh</p>
