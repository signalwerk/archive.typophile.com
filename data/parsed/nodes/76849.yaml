    html: "<p>I kind of bumped into a similar issue, with printing black and silver ink on uncoated paper. My advice: go for a paper stock with its structure as closed as possible — so the paper absorbs the least. And, always best, do a test run: throw a dozen or so different papers through the letterpress to see which one works out best.</p>"
