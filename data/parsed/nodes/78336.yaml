    <p>I'm looking at using Fedra Serif-A Book for all the body text on varying publications at the church I work at. I was wondering what sans you would pair with it for headings. Obviously other than Fedra Sans which I'm not a fan of. I'm looking for something very neutral.</p>
    <p>Also, a more open question, how do you go about pairing two typefaces? What technical things do you look for? And any particularly successful examples of this would be appreciated.</p>
    <p>thanks,<br>
    Samuel</p>
