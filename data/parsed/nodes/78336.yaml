      <p>I quite like chalet but it lacks small caps and text figures which I love using.</p>
      <p>Just looked at fago and unit and I noticed they are very similar in design to fedra, as in they both look like modern humanist faces. I've always been under the impression that you don't pair similar typefaces.</p>
      <p>Just thinking now and after reading the link I want quite a bit of contrast in the styles.</p>
      <p>I attached some examples below</p>
      <p>Avenir Next SC<br>
      Fago<br>
      Fedra Sans (don't have alt for now)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Borchure Heading Variations_5980.jpg"></div><p></p>
