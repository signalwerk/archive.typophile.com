      <p>As mentioned above, there are different approaches.</p>
      <p>But looking at your example, I see your point.<br>
      I think the wider Fago would work better.<br>
      Also, de Groot’s Corpid comes to mind, it shares the more fluid feel without beeing too playful (as Fedra Sans).</p>
      <p>Edit:<br>
      As you’re looking for more contrast, have a look at FF Kievit:<br>
