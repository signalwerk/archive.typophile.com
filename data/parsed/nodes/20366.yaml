    <p>i need help. are any of these directions working for anyone?</p>
    <p>i'm having a heck of a time finding a visual that embodies the word champfactory--at least a visual that is uncluttered, and holds its color well. think either addidas logo, nike or apple--simple, curvy blocks of color.</p>
    <p>the product is a card game based on motorcycle racing that has been developed over time to embody many different types of racing, although its still motor-sport based as opposed to say, track and field.</p>
    <p>so, i can try to create something illustrative of an actual factory that pumps out winners, or i can simply go for an illustration of winning, or speed, or strength, or other attributes of a champion.</p>
    <p>this graphic is not coming easily to me, and i've ruled out trying to make a wordmark due to the sheer length of the name. it may be time for me to put it down and come back later with a clean slate.</p>
    <p>any ideas, anyone?</p>
