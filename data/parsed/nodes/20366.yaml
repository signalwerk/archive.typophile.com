    html: <p>The Id needs alot more than a logo. You could do anything with a mark like that and it would mean nothing. I think your client needs to  think about branding not just a mark. What is it that they are selling or bringing to market? Get a marketing report or make them generate one for you. You need a point of reference to start from, like who are you talking to!</p>
