      <p>I think 7 and 8 have speed but the winning is a bit obscured by the 1, I think if you are going to distort a character you should begin with a more usual* one. I might try using a non-oblique wordmark, because the impression of speed in photography is increased by having a stationary object in the foreground. Further to Hrant's suggestions you might think of a chequered flag which is probably more universal and can be made into a powerful graphic, along the lines of the simple logos you mentioned.<br>
      Tim</p>
      <p>*bit subjective but I hope you take my point</p>
