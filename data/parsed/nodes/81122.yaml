  html: |-
    <p>Back in the OS9 days, there was this brilliant little utility which allowed you to just drag a bunch of non-installed fonts onto it, and it would give you an instant preview of the families. Since this utility (I think it was called Font Gander) hasn’t been around for at least 10 years, I was just wondering whether someone here knew of something equal in functionality. I know I haven’t found anything as of yet.</p>
    <p>On a sidenote, I find it really odd that an app like FontExplorerPro doesn’t support this functionality (without adding the scanned/opened fonts to its database, that is).</p>
    <p>Any suggestion would be much appreciated,</p>
    <p>yoshi</p>
