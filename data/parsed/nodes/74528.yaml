    <p>Anyone know about any physical (not web) places in the US where someone could do typographic research? I'm not referring to classes, but rather archives and like places where someone could see, hold, and research actual type examples.</p>
    <p>Washington University in St. Louis has a great facility for this, but I was wondering if anyone here knew about other places.</p>
    <p>Thanks in advance.</p>
    <p>Chuck</p>
