      <p>I had the great fortune in the spring of researching specimen books at the <a class="freelinking external" href="http://hcl.harvard.edu/info/special_collections/" rel="nofollow">Houghton Library</a> at Harvard and the <a class="freelinking external" href="http://www.hrc.utexas.edu/research/info/" rel="nofollow">Harry Ransom Center</a> at U. Texas-Austin. Spent a month solid in each place and didn't get through all their materials. Both are open to any adult researchers. The Newberry Library in Chicago, I have heard, also has an outstanding collection and is likewise open.</p>
      <p>I didn't get to the <a class="freelinking external" href="http://www.museumofprinting.org/" rel="nofollow">Museum of Printing</a> while in Massachusetts, but I sense they may have more of the archival objects you're talking about.</p>
    html_clean: |-
