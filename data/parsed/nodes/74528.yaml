    html: |-
      <p>The Newberry Library in Chicago has a world class collection on printing and typography. Ask for Paul Gehl, he will be happy to show you what they have. This includes the largest collection of Bodoni material outside of Parma, Italy and one-of-a-kind things like Bruce Rogers drawings fro the Centaur face. They only lack a Gutenberg bible but there is one close by at Indiana University in Bloomington.</p>
      <p>It is private, just tell them you're there for typographic research and get a user card.</p>
      <p>George</p>
