      <p>Maxim,</p>
      <p>Actually, I misstyped.  The Gutenberg is in the Library of Congress, 12 blocks away from the Archives.<br>
      <a href="http://www.rarebookroom.org/Control/gtnbbl/index.html" title="http://www.rarebookroom.org/Control/gtnbbl/index.html">http://www.rarebookroom.org/Control/gtnbbl/index.html</a></p>
      <p>Also, here are a few of the other collections at LOC. You could spend your life there!</p>
      <p><a href="http://www.loc.gov/rr/rarebook/coll/099.html" title="http://www.loc.gov/rr/rarebook/coll/099.html">http://www.loc.gov/rr/rarebook/coll/099.html</a><br>
      Incunabula Collection: Books printed between 1455 and 1501, (3,797 titles).<br>
      Hans P. and Hanni Kraus Collection: Early books, manuscripts, maps, and memorabilia related to the explorations of Sir Francis Drake.: <a href="http://www.loc.gov/rr/rarebook/coll/kraus.html" title="http://www.loc.gov/rr/rarebook/coll/kraus.html">http://www.loc.gov/rr/rarebook/coll/kraus.html</a><br>
      William Morris and Kelmscott Press Collection: Imprints from the Kelmscott Press printed by William Morris, (170 titles).<br>
      Bruce Rogers Collection: Books designed by Bruce Rogers and his personal papers<br>
      Russian Imperial Collection: Books from the libraries of the Russian imperial family<br>
      Yudin Collection: Publications relating to Russian history, bibliography, and literature, eighteenth and nineteenth centuries; pictorial material; papers of the Russian American Company<br>
      John Boyd Thacher Collection: Incunabula, early Americana, material pertaining to the French Revolution, autographs<br>
      Theater Playbills Collection: Nineteenth-century English-language playbills, (3,253 items).<br>
      Shakespeare Folio Collection: Shakespeare's First, Second, Third, and Fourth Folios, (6 titles).<br>
      Accademia Della Crusca Collection: Italian-language publications representing the best usage of Italian in the humanities and sciences<br>
      American and Foreign Magazines Collection: American and European magazines from the seventeenth to the early twentieth century, (3,872 titles).<br>
      American Imprints, 1640-1800: Books and pamphlets printed in the United States between 1640 and 1800, (16,990 titles).<br>
      Archive of French Publishing Prospectuses Collection: Nineteenth-century prospectuses from European publishing firms (chiefly from France and Belgium, 1830-1870), (1,000 items).<br>
      Bookplate Collection: Bookplates designed by twentieth-century Russian artists, (130 bookplates).<br>
      Broadside Collection: Mostly single-sheet publications from Europe and the Americas (with the vast majority from the United States) dating from the sixteenth to the twentieth centuries.</p>
