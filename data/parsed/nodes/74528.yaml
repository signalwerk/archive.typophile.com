    html: <p>The Museum of Printing has a lot of old presses and other machines, but for type itself their big treasure is the library of 300,000 drawings of type from the Mergenthaler Linotype company. This isn't handling the type, but for the pantographic punch cut era 1885-1970 roughly it's the drawings that tell most of the story.</p>
