    html: "<p>Chris I think that you should concetrate on the font choice. On each logo you posted it seems as though you used typefaces haphazardly. <br>  On the garage logo it seems like you used \"ITC Anna Std\" by Daniel Pelavin, which in fact was designed for his wedding invitation and also was used on the birth announcement of his first child, Anna. It has no usage on garage stuff. <br>The proper usage for this font would be any special occasion. (The font is Daniel's view of art deco). <br>  The second logo seems to be completely frivolous. No connection between your elements. I am not going to comment on the color choice. Could you think of better colors that contribute to the words \"design\"(since it is a web application design) and \"pulse\". <br>Q : Is green your favorite color? <br>  The third logo seems to be based on the font Haettenschweiler, which is frequently used by inexperienced designers. You should use this font very carefully. I felt confused by your 3rd logo. The reasons for the this was firstly for the tagline and secondly for the curverd arrow(which symbolizes what?). <br> <br>I hope this will be helpful.  <br>In general, I suggest you do some conceptualization before doing anything on the screen and avoid the pitfalls of erroneous font choice.</p>"
    html_clean: "<p>Chris I think that you should concetrate on the font choice. On each logo you posted it seems as though you used typefaces haphazardly. <br>  On the garage logo it seems like you used \"ITC Anna Std\" by Daniel Pelavin, which in fact was designed for his wedding invitation and also was used on the birth announcement of his first child, Anna. It has no usage on garage stuff. <br>The proper usage for this font would be any special occasion. (The font is Daniel's view of art deco). <br>  The second logo seems to be completely frivolous. No connection between your elements. I am not going to comment on the color choice. Could you think of better colors that contribute to the words \"design\"(since it is a web application design) and \"pulse\". <br>Q : Is green your favorite color? <br>  The third logo seems to be based on the font Haettenschweiler, which is frequently used by inexperienced designers. You should use this font very carefully. I felt confused by your 3rd logo. The reasons for the this was firstly for the tagline and secondly for the curverd arrow(which symbolizes what?). <br> <br>I hope this will be helpful.  <br>In general, I suggest you do some conceptualization before doing anything on the screen and avoid the pitfalls of erroneous font choice.</p>"
  - id: 51799
