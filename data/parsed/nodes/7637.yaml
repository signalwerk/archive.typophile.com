    date_raw: 11 Nov 2004 — 1:50am
    votes: null
    html: <p>Let me begin by saying that I am not an expert myself and I'm learning myself as we speak. The only way of becoming better is by knowing - and avoiding - our mistakes in the future. <br> <br>Galin had some good points with regards to the font choice. Despite that, I do think that the first logo gives you that retro look that you wanted to create. <br> <br>The second logo certainly doesn't invoke the idea of a web application company. I would have guessed something in the medical field. It probably doesn't help that you have picked those colours either. I don't know where you live, but in my country all surgeons have this green-ish colour for their outfits ;-) <br> <br>Compared to the font, your pulse line looks too edgy. It doesn't harmonise very well with the round edges. It also needs more vertical and horizontal space to the wordmark - especially if printed smaller. (But that's only assuming that you have to have a pulse line there at all in the first place!) Galin mentioned it; take a piece of paper and conceptualise some ideas before touching your computer. <br> <br>The third logo - afraid to say this - is my least favourite. It is way too cluttered and needs a lot of simplification. That square behind the CAT must go. why the empasis on "CAT" and not on the M (for Malicious) as well? Why the arrow? It doesn't seem to contribute anything to the idea. Are you trying to send a secret visual message that I'm too ignorant to understand? :-) <br> <br>I understand your choice of "Impact" - you wanted to make a bold and dominant statement which probably fits to a security company quite well. So, well done on the thinking!  <br> <br>It just needs a little more refinement and work (see above...) <br> <br> <br>Well done on your designs - keep 'em coming!</p>
