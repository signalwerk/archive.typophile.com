    html: <p>Joes Garage. Humm. Where to start critique. Well the type style + the words "Joe's" automatically makes me think of a Diner, and the car looks more like fish bones than a car. Automotive repair is to hard to read on a fast take. Make it a simple sans, this also brings hierchy to the information you are trying to convey. <br> <br>Pulse Micro. Why is it green?, Not exactly the first colors that come to mind for web/coding. Spacing between letters needs work- think of spacing as volume not distance. Rounded forms with a jagged "pulse line" a harsh mix.  <br>mcat- no comment. <img src="http://www.typophile.com/forums/messages/29/53939.jpg" alt="pulse"></p>
