    html: <p>Thanks, for the responses Samann and  Galin. Yes, I will in the future be more careful with font selection. Like I said some of these are old specifically pulse and mcat. The car graphic is one thing that I did on paper first. However the other font selections I had for it originally, the customer did not like. I'm guessing he likes art deco? In any-case I appreciate your input.  <br> <br>The mcat design was based on how code can get manipulated and inserted into applications that it was not designed for causing compromise of a system. I'm sure though I could have come up with something better to convey that. <br> <br>Just out of curiosity, do you use any stock fonts or do you create them all yourself, or just modify existing fonts enough that they are not recognizable and fit your design?</p>
