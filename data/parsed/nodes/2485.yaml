    html: "<p>Re. Sylfaen Armenian: Geraldine Wade drew the Armenian, Georgian and Greek. I was only responsible for the massive extended Latin set (most of which is not included in the current release) and the Cyrillic. It's important to remember when looking at Sylfaen that it was originally intended only for an internal MS glyph database, and not as a release font. I was rather shocked when they released it, because neither Geraldine nor I considered it finished and only some parts were properly polished.</p>"
