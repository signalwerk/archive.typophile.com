    html: <p><i>I would be interested to find out if folks here know of existing guidelines or in-house standards for designers or foundry employees concerning point usage in the digitization process.</i> <br> <br>The <i>Adobe Type 1 Font Format</i>* is available as a PDF from the <a href="http://partners.adobe.com/asn/tech/type/ftechnotes.jsp">Adobe developer site</a>. See the section on 'Technical Design Considerations' starting on page 29 for Adobe's advice on point placement in PS fonts. <br> <br>* This specification is commonly known as 'The Black Book', in reference to the top part of the cover of the original print edition and to distinguish it from <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0201379228/002-6544174-0751247?v=glance">'The Red Book'</a>.</p>
