    html: "<p>Usually but not always more points means sloppiness. And in this case I think that's what it is, unfortunately. Sometimes though more points means greater fidelity. It depends on the design too, like a highly geometric sans will be more in tune with bezier-ness, so to speak. <br> <br>And other times too few points are a problem as well. For example in that Adobe \"a\" there are a couple of missing inflection points: usually this doesn't matter, but for conversion to TT for example it can matter bigtime (especially in Fog). Other cases of extra points being good is for stroke modulation and trapping. <br> <br>On the other hand, when you apply transformations to outline, the fewer the points the better, usually - because the bezier math will take care of it more elegantly than explicit points. <br> <br>hhp <br></p>"
