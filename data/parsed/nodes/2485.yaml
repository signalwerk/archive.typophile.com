    html: <p>Wow, lots of good information in this thread, thanks everyone. <br> <br>&gt;However, there are some situations where it's necessary, and one of them was the top of my Jenson (Goodchild) "a", where I found it impossible to get close to the old master's form without plenty of points.  <br> <br>Well, obviously you have to use whatever number of points it takes to achieve the degree of fidelity you are after, so while it has become clear in this thread that less points mean smaller files and better performance, I was by no means trying to suggest a general minimalist imperative. <br> <br>However, the initial question was about a direct comparison of pretty-damn-near-identical glyph shapes with a significant difference in the amount of points used. As it turns out, this appears to be the result of an automatic conversion process, which may in turn adversely affect performance. <br> <br>I would be interested to find out if folks here know of existing guidelines or in-house standards for designers or foundry employees concerning point usage in the digitization process. <br> <br>Has it happened to anyone, that a large open type file had to be tidied up afterwards in order to improve performance, or is this not a big deal? When is a font file too big?</p>
