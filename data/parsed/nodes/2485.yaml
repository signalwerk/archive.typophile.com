    html: <p><i>Has it happened to anyone, that a large open type file had to be tidied up afterwards in order to improve performance, or is this not a big deal? When is a font file too big?</i> <br> <br>This is more of an issue in East Asian fonts, where conscientious developers tend to do everything they can to keep the file size down (subroutines, small em size, minimum number of points, etc.) <br> <br>When MS released my Sylfaen font, they ran it through a tool called SplineLab (originally from Project Solutions, not sure if it is available from anywhere; was expensive) which can automatically clean up excessive points within parameters set by the user. I have to say, I'm not very happy with the results, and some of my curve quality was lost. Now when I'm developing TT fonts, I usually clean up the converted PS-&gt;TT outlines manually and leave points if they are necessary to maintain the curve quality. In a longish curve, e.g. a quadrant of the O, I can usually reduce the number of FL inserted points from 4 to 2, and on short segments from 2 to 1, without a major problem. The longer curves won't be a true match to the original cubic PS outline, but I can control the result and it is better than what SplineLab does. Once you get into the habit of doing this, it doesn't take long for each glyph, and I consider it part of the design process. <br> <br>A bigger concern in developing OpenType fonts is optimising performance in the OTL GSUB and GPOS tables. Things like contextual mark positioning can slow down processing speeds significantly, so it pays to have a good strategy for minimising the number of lookups. Also, GSUB is more efficient than GPOS, so it makes sense to try to strike a balance between the efficient development and flexibility of GPOS and the faster processing of glyph composition with GSUB. In future versions of my Biblical Hebrew font, I'm considering making a few hundred of the most commonly occuring letter + mark(s) combinations into precomposed glyphs, as this should speed up overall processing.</p>
