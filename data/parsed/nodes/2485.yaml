    html: <p>I've created fonts in many different genres (using Fontographer, 1000 unit em), and I've found that it's rarely necessary to insert more than one point (if that) between the horizontal and vertical extrema of a curve, in order to sufficiently define that curve for aesthetic accuracy.  <br> <br>However, there are some situations where it's necessary, and one of them was the top of my Jenson (Goodchild) "a", where I found it impossible to get close to the old master's form without  plenty of points. <br><img src="http://www.typophile.com/forums/messages/30/22780.jpg" alt="JenA"></p>
