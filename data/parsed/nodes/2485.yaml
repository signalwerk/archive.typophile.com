    html: <p>Yes. The more points there are, the more work the computer has to do to image the letter. <br> <br>They are different means of mathematically describing curves, but not quite in the way you're thinking. You can convert from TrueType style quadratic curves to PostScript style cubic beziers without loss of information, but not the other way. (A really high-fidelity conversion in the second case will require a fair number of added points.) <br> <br>Additionally, it is common, though not required, to change the em-square scale between 1000 and 2048 when going between the two styles of curves. This can add slight rounding errors and further loss of fidelity. <br> <br>Regards, <br> <br>T</p>
    html_clean: <p>Yes. The more points there are, the more work the computer has to do to image the letter. <br> <br>They are different means of mathematically describing curves, but not quite in the way you're thinking. You can convert from TrueType style quadratic curves to PostScript style cubic beziers without loss of information, but not the other way. (A really high-fidelity conversion in the second case will require a fair number of added points.) <br> <br>Additionally, it is common, though not required, to change the em-square scale between 1000 and 2048 when going between the two styles of curves. This can add slight rounding errors and further loss of fidelity. <br> <br>Regards, <br> <br>T</p>
