    html: "<p>There are two concerns with large numbers of unnecessary points. The first is font size: every point is a certain number of bytes. The more points you have, the bigger the font. This may not be a significant factor in 8-bit fonts, but when you start including a few thousand glyphs in an OpenType font, the impact can be quite considerable. <br> <br>The second concern is in TrueType fonts in which stray points can cause spikes in delta hinting. If you want to delta a small detail to turn a pixel on or off at particular sizes, you ideally want to touch only one point, not have to delta three separate points.</p>"
    html_clean: "<p>There are two concerns with large numbers of unnecessary points. The first is font size: every point is a certain number of bytes. The more points you have, the bigger the font. This may not be a significant factor in 8-bit fonts, but when you start including a few thousand glyphs in an OpenType font, the impact can be quite considerable. <br> <br>The second concern is in TrueType fonts in which stray points can cause spikes in delta hinting. If you want to delta a small detail to turn a pixel on or off at particular sizes, you ideally want to touch only one point, not have to delta three separate points.</p>"
