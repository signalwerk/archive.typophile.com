  html: <p>I've been comparing differing versions of a font from two different foundry sources, Folio from Adobe in Open Type format and Folio BQ from Berthold in Type 1 format. <br> <br>After converting some letters in each font to outlines, I noticed that while the overall shapes are near identical the amount of points used to define each glyph is significantly greater in Folio BQ than it is in the Adobe version, even on seemingly simple glyph shapes. <br> <br>How does this information correlate to quality, i.e. how well will each typeface stand up to different printing/viewing conditions? My (layman's) guess would be that a greater number of points suggests a sloppier digitization process but I'd appreciate the opinions of the cognoscenti. Thanks... <br> <br><img src="http://www.typophile.com/forums/messages/30/22731.gif" alt="Folio - Adobe and Berthold"></p>
  html_clean: <p>I've been comparing differing versions of a font from two different foundry sources, Folio from Adobe in Open Type format and Folio BQ from Berthold in Type 1 format. <br> <br>After converting some letters in each font to outlines, I noticed that while the overall shapes are near identical the amount of points used to define each glyph is significantly greater in Folio BQ than it is in the Adobe version, even on seemingly simple glyph shapes. <br> <br>How does this information correlate to quality, i.e. how well will each typeface stand up to different printing/viewing conditions? My (layman's) guess would be that a greater number of points suggests a sloppier digitization process but I'd appreciate the opinions of the cognoscenti. Thanks... <br> <br><img src="http://www.typophile.com/forums/messages/30/22731.gif" alt="Folio - Adobe and Berthold"></p>
