      <p>It’s not every post that goes offline when it’s edited. Just some that the Antispam engine is confused about. </p>
      <p>For whatever reason, it keeps thinking that this post is spam. So every time the post gets updated, it gets re-submitted to the spam checker; and each time, the checker thinks it’s spam (even though I’ve approved it several times before) and the post gets taken offline and put into a moderation queue for review/approval.</p>
      <p>I don’t know why it thinks this post is spam. Doesn’t happen to everyone or every post. But it is happening to this one.</p>
