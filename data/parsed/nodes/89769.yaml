    <p>I've been working on redrawing type from a 1937 calligraphic course book, but as I am not a type designer I'm looking for someone interested in some way of collaboration or taking over the project.</p>
    <p>If you're interested, let me know, so we can talk it over.</p>
    <p>P.S. a guy named Erik Spiekermann thinks this is quite interesting specimen.</p>
    <p><img src="http://typophile.com/files/barscript.png"></p>
