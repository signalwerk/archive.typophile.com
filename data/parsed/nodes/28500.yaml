      <p>Another update. This time I did the 'Q, N, 7', and some other small things you propably won't see.<br>
      I think the 'Q' is a mega improvement, so a big THANKS goes out to Hrant for seeing that. </p>
      <p>I kept the 'N' as close to the original as possible, but optimized the diagonal. Is this enough or should it be even more 'classical'? I think it should harmonize with the M, that's why I kept the bent diagonal.<br>
      I tried taking the lower right serif out, but that suddenly reminded me of captain Hooks wooden leg. Very strange, so I descided to keep it in and just made it smaller for optical proportion.</p>
      <p>I've changed the 'r' before, but I just wanted to point it out. It's also much better, so my thumbs up again for Hrant. This looks very sweet it the text, and I think it should not have more hanging at his nose.</p>
      <p>What do you think about the serif on the '5'? Inside or outside? I see them normally more outside, but I spontaniously put mine inside. I feel it's alright there, but what do you think?</p>
      <p>I'm not so sure about the '7', because I can't seem to get the contrast right. I will have a closer look at it later. Option 3 is the old version. Option 2 is also not bad, but for now I'd go for option 1.</p>
      <p>On to the next level...</p>
      <p>®</p>
