      <p>I did some changes to a few characters (see ReethiRah2.pdf above). One step at a time.</p>
      <p>I totally agree with the N and the new one looks also much better. Together with this N I also changed the M, because it felt a bit out of tune. I'm not sure if I should keep the old or new M, what do you think?</p>
      <p>The new 't' fits like a glove to the rest of the font, so that's a done deal. I'm still fiddling with the 'f'. I made one with a small serif in the upper curve, and one without. I don't know which one is better. To me the one with the serifs feels better, but I like the other one too. On page 6 of the pdf you can see the difference. </p>
      <p>Sebastian, I like the leg of the R. My only consideration would be if it's not to edgy for the font? All serifs are soft and curved and this leg is sharp and edgy. But I definitely will give it a spin.</p>
      <p>For your information, I drew this font with a regular pencil. No nibbed pen or any other tool. Like I said it's a very intuitive font, so it's even more important to get the consistancy in the details right.</p>
      <p>Hrant, I'll kill all my darlings if it works for the font, but don't ask me to kill my memory of the honeymoon.  ;-)</p>
      <p>®</p>
