      <p>This is quite amazing - it's clear you were inspired by your circumstances.<br>
      In fact I'm envious... I mean of the font.  :-)</p>
      <p>This is what PoMo was supposed to mature into. Serious mannerism. Very nice the way the serifs do indeed seem to have a dual personality, as you claim. And some of your stroke weight distribution (like in the "w") and termination (like in the "c"/"e") is genial.</p>
      <p>I'll try to find the time to do a full critique (I haven't succeeded in doing that lately) but for the time being I'd like to point out the following:<br>
      1) Vertical proportions: good. Somewhat generous x-height.<br>
      2) Nice and darkish.<br>
      3) 1 &amp; 2 combine to make this ideal for ~9 point text... assuming you get the spacing right: on the loose side.<br>
      4) Trapping: great idea (especially considering your color and -presumed- target size) but don't actually put it in until the end.<br>
      5) The bottom-left link of the "g" is too much.<br>
      6) Some lc letters could be less timid: "f" (narrow), "r" (why castrated?), "t" (blah) and "x" (narrow).<br>
      7) Numerals: "7" is a bit too curvy; "8" is out of character. And why not hybrid nums? They work best overall (even though your x-height is big enough to make traditional OS nums OK).<br>
      8) UC: "G" not working; "K" high waist out of character; "N" not working; "Q" lousy - give it a TAIL dude - what is this, Minion?!; "T" top too symmetrical.</p>
      <p>&gt; I want to go all the way with this font.</p>
      <p>&gt; It’s a love or hate thing…</p>
      <p>Sounds like a honeymoon font for sure. :-)  BTW, definitely use "optically and emotionally balanced" in your promotional text.</p>
      <p>Oh, and if you don't finish this, I'm coming after you.<br>
      Maldives, Upper Waziristan, doesn't matter - I'll hunt you down.</p>
      <p>hhp</p>
