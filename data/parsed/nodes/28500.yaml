      <p>Hi Rene,</p>
      <p>This is a great font, definetely a lot of character! </p>
      <p>It looks like the way the characters are 'drawn' is by nib based pen mainly. Bearing this in mind, some of the characters feel a bit off. For instance the legs of the K and R, don't have that characteristic 'nib' ending as is present in the other letters / nums. </p>
      <p>I played around with your R and gave it a nib-ending. </p>
      <p>I think this may be a slightly better fit, the same can be done on the K, and maybe on the J / j as well. </p>
      <p>Also the lower beak of the S / s, seem to have a brush type ending, which is not apparent in the other characters. Here a nib ending may provide a better fit as well. </p>
      <p>I agree with hrant on the 8, the 'crossing' in the center feels a bit blocky, which is a bit out of tune with the rest. </p>
      <p>My comments are based on the reflection of the 'writing tool' in the final shape of the letters (nib pen, brush etc.). This may be a too rigid of a viewpoint, but as I am learning type design myself, this forms a good reference.</p>
      <p>Btw, great specimen, I like the text as well (I am Dutch as well...).</p>
      <p>Sebastian</p><div class="imageWrap"><img src="http://typophile.com/files/R_5521.jpg"></div><p></p>
