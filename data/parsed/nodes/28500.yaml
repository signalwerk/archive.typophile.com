      <p>Old "M" for sure. And the new "N" is pulled back a little bit too much I think. The new "t" is nice, but if you can make it exhibit more stroke contrast (without making it too wide - the narrowness of the "t" is one of its major defining attributes) that would be good. For the "f", the rightmost one is the safest, but you only need it if the middle one is too distracting in text[ure], which I don't think it is (thanks to all the other funkiness). Your texture, btw, I forgot to mention before, is what's most encouraging about this (which is of course what a text font is all about).</p>
