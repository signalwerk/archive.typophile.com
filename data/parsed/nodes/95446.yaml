  html: |-
    <p>Hi,<br>
    How do I create multiple alternates with salt code?<br>
    Right now I've got:</p>
    <p>	feature salt { # my Stylistic Alternates<br>
    		sub a by a.1;<br>
    	} salt;</p>
    <p>I've got four stylistic alternates for the letter a. When I try to add them to the code FontLab says "Multiple substitution not yet supported"</p>
    <p>Is there a way around that? The result I'm looking for is to view all versions of letter a in InDesign glyph window "Show alternates for selection".</p>
    <p>Any help with this is appreciated!<br>
    Agata</p>
