  - id: 377987
    user: 13487
    date: 2009-11-11T09:39:00
    date_raw: 11 Nov 2009 — 9:39am
    votes: null
    html: |-
      <p>I'm not sure why, but it looks a bit like a logo for a new bank trying to look very serious. :-\</p>
      <p>Colors: I think their difference in darkness/saturation can work for the mark, but not so well in the type – GRUPA seems too active/strong compared to INTERAKTYWNI.</p>
      <p>Spacing: Can anything be done about the holes in there (look at "KTY"!)? You should at least *try* loosening the rest of the spacing to get it more-or-less even. But maybe it's too loose then. I guess a higher-class thing to attempt would be a T_Y ligature.</p>
      <p>Glyphs: Some seem too dark. The "W" needs help, and the "K". But that sort of stuff is hard to tell at this size. What font is that anyway?</p>
