    html: |-
      <p>strategy, I'm obviously not as wise or experienced as some of these professionals here, and that's why I have to have a unwavering dedication to the creative problem solving process in order to make sure I get the results I need!</p>
      <p>before I start a project I go through a cycle kind of like this.</p>
      <p>Strategy, Concept, Development, Review, Production.</p>
      <p>Stragegy would be knowing you need to make a logo, and also knowing what you need to communicate with it.  If you could use your logo to communicate 3 words, what would those words be?  How can either font choice, layout r imagery help communicate those words?</p>
      <p>Concept would be yur sketches, development your computer roughs, review is what you're asking for here - a critique of your work, and then production is the final.</p>
      <p>in order that we can better help critique your work, can you tell us more about your strategy please?</p>
