  html: |-
    <p>Hi everybody,<br>
    I've got a question for you. You know that, for print, we should hyphenate a sentence like:</p>
    <p>"the black cat is still around, playing with the<br>
    blue ball"</p>
    <p>this way:</p>
    <p>"the black cat is still around,<br>
    playing with the blue ball"</p>
    <p>or</p>
    <p>"the black cat is still around, playing<br>
    with the blue ball"</p>
    <p>To avoid separating words, and keeping together words that go "together".  But on web sites, is it really important to follow this kind of rule, if you know that the user can change the size of the font as he wants ?</p>
    <p>thanks !</p>
