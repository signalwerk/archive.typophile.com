    html: |-
      <p>James and Alessandro silently let pass by, the term is not "hyphenation" for words. Hyphenation is when a word itself breaks.</p>
      <p><cite>“the black cat is still around,<br>
      playing with the blue ball”</cite></p>
      <p>or</p>
      <p>“the black cat is still around, playing<br>
      with the blue ball”</p>
      <p>I come across this problem a lot (in typesetting, that is) with the large font size I use for chapter titles. I prefer personally to set the top line longer than any subsequent lines, hold "the"'s together with the next word, and ... well ... whatever looks best. (Sometimes it takes several tries).</p>
      <p>For a web page, I don't think I could be bothered :-)</p>
      <p>You can tack words together with &amp; nbsp; -- the non-breakable space (for example, "the blue"), or use the HTML &lt; nobr &gt; .. &lt; /nobr &gt; tags, which work just like InDesign's "No Break" feature. But you have to consider that with all different browsers, font sizes, and window widths, virtually everyone will get to see a different broken paragraph. Imagine doing this for every <em>possible</em> bad break ...</p>
      <p>Besides, as current browsers do not use any intelligence at all, breaking paragraphs comes down to "Oi, the line is full. Go to next line." SO, if you use one of these tricks, the text will look <em>worse</em> instead of better.</p>
