    html: <p>If you can dynamically justify a paragraph on the screen, the most common use of the hyphen is to divide words that do not fit on a justified line of type. Usual texts are treated different than poetry, anyhow, we use the <em>hyphen</em> ‘-’ to separate words (not sentences) and/or to create compound words, write numbers, adding certain prefixes, etc.</p>
