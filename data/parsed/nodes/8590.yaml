  html: <p>Has anyone come across any type rendering oddities in Photoshop 7 for Windows? In the sample below, a font provided in a corp id manual rendered very oddly depending on the type size - it appears the turning point (pardon the pun) is 101, at which point it develops odd outlines etc.  <br> <br><img src="http://www.typophile.com/forums/messages/30/62748.gif" alt="type sample"> <br> <br>The 3rd sample provided to show whats happening up close. <br> <br>Has anyone come across this, or know of a way within Photoshop to get around it? (I'd rather not have to set type in Freehand and bring it across as the extra accuracy isn't entirely necessary for screen-based work, before someone points this out <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> )</p>
  html_clean: <p>Has anyone come across any type rendering oddities in Photoshop 7 for Windows? In the sample below, a font provided in a corp id manual rendered very oddly depending on the type size - it appears the turning point (pardon the pun) is 101, at which point it develops odd outlines etc.  <br> <br><img src="http://www.typophile.com/forums/messages/30/62748.gif" alt="type sample"> <br> <br>The 3rd sample provided to show whats happening up close. <br> <br>Has anyone come across this, or know of a way within Photoshop to get around it? (I'd rather not have to set type in Freehand and bring it across as the extra accuracy isn't entirely necessary for screen-based work, before someone points this out <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> )</p>
