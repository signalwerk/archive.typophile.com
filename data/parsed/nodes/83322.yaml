      <p>Thanks everyone for your support, I apologize for the delay it seems typophile was down for a few days so I'm just now following up:</p>
      <p>Frank: thanks for the suggestions not sure if those fonts will work for the look we are going after though.</p>
      <p>John: thanks for your suggestions, I really like sensibility it does offer a modern design blend with the "organic" feel we're going after.</p>
      <p>Hrant: thanks for the suggestion on Rosetta, I wasn't even aware of their foundry until you recommended it. I do really like their Skolar type but not quite sure if this is the look we're going for. I can see this working very well if we wanted to produce our publication in multiple languages.</p>
      <p>Nick: Great job on Fontesque, that is an amazing font. I could see us using that in some featured articles for edible recipes, and such.</p>
      <p>J. Tillman: Thanks yes that is great SN&amp;R did that section I'd like to see that! On FF Tisa, that is great you recommended that that is one of the few we are highly considering.</p>
      <p>Here is the list of the top fonts we are considering now:</p>
      <p>Ideal Sans:  <a href="http://www.typography.com/fonts/font_overview.php?productLineID=100042&amp;path=head" title="http://www.typography.com/fonts/font_overview.php?productLineID=100042&amp;path=head">http://www.typography.com/fonts/font_overview.php?productLineID=100042&amp;p...</a></p>
      <p>Mercury Text G2:  <a href="http://www.typography.com/fonts/font_overview.php?productLineID=100017&amp;path=head" title="http://www.typography.com/fonts/font_overview.php?productLineID=100017&amp;path=head">http://www.typography.com/fonts/font_overview.php?productLineID=100017&amp;p...</a></p>
      <p>Amplitude:  <a href="http://www.fontbureau.com/magazine/fonts/sans/listing/Amplitude/" title="http://www.fontbureau.com/magazine/fonts/sans/listing/Amplitude/">http://www.fontbureau.com/magazine/fonts/sans/listing/Amplitude/</a></p>
      <p>Antenna:  <a href="http://www.fontbureau.com/fonts/Antenna/" title="http://www.fontbureau.com/fonts/Antenna/">http://www.fontbureau.com/fonts/Antenna/</a>  (We really like this one for headlines but now we're looking for a compatible serif font for body copy)</p>
      <p>FF Tisa:  <a href="http://www.fontshop.com/search/?q=ff+tisa" title="http://www.fontshop.com/search/?q=ff+tisa">http://www.fontshop.com/search/?q=ff+tisa</a></p>
      <p>Akagi:  <a href="http://www.typetrust.com/fonts/font.php?id=Nzkw" title="http://www.typetrust.com/fonts/font.php?id=Nzkw">http://www.typetrust.com/fonts/font.php?id=Nzkw</a></p>
      <p>Stag:  <a href="http://commercialtype.com/" title="http://commercialtype.com/">http://commercialtype.com/</a></p>
      <p>Parisine Plus:  <a href="http://new.myfonts.com/fonts/typofonderie/parisine-plus-std/regular/" title="http://new.myfonts.com/fonts/typofonderie/parisine-plus-std/regular/">http://new.myfonts.com/fonts/typofonderie/parisine-plus-std/regular/</a></p>
      <p>I hope this helps to understand direction we are in. A lot of these are great fonts but selecting which ones work best together is the challenge. We'd like a modern sans-serif font and the body copy type to be serif.</p>
      <p>From the magazines we've found that share the design goals we have are:</p>
      <p>.net magazine<br>
      Real Simple<br>
      Food network<br>
      Wallpaper<br>
      whole living<br>
      Living etc<br>
      Rolling Stone<br>
      O magazine<br>
      Q magazine<br>
      vegetarian living</p>
      <p>Thanks again for your expert advice, I really, really appreciate it very much.</p>
