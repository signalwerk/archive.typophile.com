    <p>Hi I'm looking for expert advice on fonts to use in magazine design.</p>
    <p>Here are details:</p>
    <p>Target market: Medical marijuana patients and related businesses</p>
    <p>Readership:</p>
    <p>Age Range:<br>
    18-19 8%<br>
    20-29 38%<br>
    30-39 20%<br>
    40-49 9%<br>
    50-59 24%<br>
    60+ 4%</p>
    <p>60% Male<br>
    40% Female</p>
    <p>Household income: $85,000</p>
    <p>Publication in Phoenix</p>
    <p>We are going for a minimalist / organic design and would like it to have a modern edge.</p>
    <p>Some fonts we like so far for headings are:</p>
    <p>Gotham Condensed, Antenna Condensed, Sentinel Bold, Tungsten Bold (just not too sure these are too bold and masculine)</p>
    <p>We're looking for a set of fonts that will work very well aesthetically together. For the body type we want a font that is easily readable.</p>
    <p>Please post your suggestions and I appreciate your expert advice.</p>
    <p>Sincerely- Chris</p>
