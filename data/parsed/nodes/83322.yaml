      <p>The Sacramento News and Review (SN&amp;R), a free alternative weekly, has in the latest edition a 28 page (!) pullout section full of color ads by medical marijuana retailers. This is serious stuff and there is money to be made for those in the print business supplying support.</p>
      <p>Relevant Logo, a nice, clean, and up-to-date looking font for text might be FF Tisa. <a href="http://www.fontshop.com/search/?q=ff+tisa" title="http://www.fontshop.com/search/?q=ff+tisa">http://www.fontshop.com/search/?q=ff+tisa</a> Just be sure to not get a too traditional looking font. Good luck.</p>
      <p>And speaking generally, "organic" is becoming more used and harder to define all the time.</p>
