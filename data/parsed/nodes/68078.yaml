    <p>Hi,</p>
    <p>I have obtained a file from a client which on opening in indesign says "Fonts missing: Futura (T1) in varying weights and faces...</p>
    <p>I have Futura installed on my PC, but I am now searching for this (T1) version. Is this version from a particullary foundry?</p>
    <p>Help?! Please!?</p>
    <p>Thanks,<br>
    Ian</p>
