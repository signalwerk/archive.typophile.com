    html: |-
      <p>Being European, but having spent a good year in the US*, I spontaneously think of [this is a very unordered list]:</p>
      <p>Cream Soda, Root Beer, Reese's Peanut Butter Cups (yum), oversized servings of ice cream – actually oversized everything (like cars and trucks, or people).</p>
      <p>Total consumerism.<br>
      The constant promise (and expectation) of instant gratification.<br>
      Loads of avoidable trash, like heaps of plastic bags at the supermarket.</p>
      <p>Simple interfaces, like washing machines that have "hot", "warm", and "cold";<br>
      over here you might just need that 50-page manual to operate a washing machine. </p>
      <p>A (perceived) strange contrast between a general self-image of total individual independence and a somewhat lemming-like social behavior (like everywhere else, but at least seeming exaggerated).</p>
      <p>* My impressions are from uh, 7–8 years ago, and I bet some things have changed.<br>
      I haven't been back since, sadly.</p>
