    <p>Not necessarily in the historical context...more like objects we use daily that are indicative of our culture, lifestyle, etc.</p>
    <p>Fast food (McD, wendys, burger king, pizza, etc)<br>
    iPod (not necessarily indicative of just US culture, but more generational)<br>
    Harley Davidson<br>
    Sneakers<br>
    Baseball hats<br>
    Jeans<br>
    Soda</p>
    <p>What else? Would love input from someone who is American, as well as any outside perspective on American culture from the international Typophile contingent.</p>
