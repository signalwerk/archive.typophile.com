      <p>I grew up in the inner city of Pittsburgh in the late 40s and beyond. The city was always full of immigrants, including my family. I guess what has always struck me as American is the mishmash of everything. There are not thousands of years of heritage like Europe so there is this eclectic chaos with no order to it. Today, immigrants are from different places than when I was young. Instead of Poland and Italy, they come from East Africa, the Middle East, and Southeast Asia and Latin America. I wouldn't call it a melting pot but a mixing bowl. This can cause both friction and embracing each-other's culture. It is what you make of it. If you want to think only evil and accept the media's exaggeration, go ahead. The truth is, we are no better or no worse than anywhere else.</p>
      <p>ChrisL</p>
