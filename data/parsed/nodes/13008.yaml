  html: |-
    <p>Operated by volunteers of the Two Rivers Historical Society, the <a class="freelinking external" href="http://www.woodtype.org/" rel="nofollow">Hamilton Wood Type and Printing Museum</a> is the only museum dedicated to the preservation, study, production and printing of wood type. With 1.5 million pieces of wood type and more than 1,000 styles and sizes of patterns, Hamilton's collection is one of the premier wood type collections in the world.</p>
    <p>The museum is arranged as a fully functional workshop and educational venue. In addition to its massive collection of 19th, 20th and soon-to-be-added 21st Century wood type, the museum also illustrates antique printing technologies including the production of hot metal type, hand operated printing presses, tools of the craft and rare type specimen catalogs.</p>
    <p>1619 Jefferson Street<br>
    Two Rivers, Wisconsin 54241</p>
