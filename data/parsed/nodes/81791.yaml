    html: |-
      <p>I like to see PDFs and/or have a type tester that goes large. (And agree with Hrant about squiggly patterns.)</p>
      <p>I like to be able to buy just the weights I need. I like an assortment of bundles.</p>
      <p>I like clear, straightforward web design.</p>
      <p>I like to see who designed something, what their rationale was, and how they realised their concept.</p>
      <p>I like tags rather than categories. And the facility to view similar fonts (though I've never seen this implemented very intelligently).</p>
      <p>I like ones where you can send a question to a real person.</p>
      <p>I don't like having to wade through hundreds of rubbish offerings that are not really commercial quality. Apart from getting in the way, they also make you wonder whether the stuff you're interested in is actually good enough quality (spacing, kerning, glyph sets, hinting, opentype features).</p>
