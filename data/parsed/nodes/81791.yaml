    <p>My approach is not scientific. I am appealing to your experience. I would like to know, briefly, what do you like and what you dislike from the typeface sales website. In fact, in your opinion what are the strengths and weaknesses of the sites you visit. The site name is not required, simply indicate, for example: “I love when I can test several character heights” or “I hate if I have to go through another site to buy a font or I should wait one to two days before receiving the family bought”.</p>
    <p>Again, the site name is not required. Thank you in advance.</p>
    <p>André</p>
  html_clean: |-
