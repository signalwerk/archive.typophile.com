    <p>Hi All</p>
    <p>After giving a lecture on the unique typography used by Victorian Manchester textile merchants at Typecon, I finally got around to producing an ebook of one of my sample books.<br>
    <a href="http://www.textiletrademarks.com" title="www.textiletrademarks.com">www.textiletrademarks.com</a></p>
    <p>I hope you enjoy it, and the other examples of typography on the site</p>
    <p>Best regards</p>
    <p>Adrian Wilson</p>
