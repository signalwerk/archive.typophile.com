      <p>The RoboFab line tool is in the dropdown menu to the left of the macro subfolders dropdown. It comes with others, tool, but I haven't figured them out.</p>
      <p>My impression is that the drawing tool probably works better for Illustrator users who just want to draw shapes without being too anal about the details. Not so great for type designers who want to view in and worry about absolute control of details down to 1/1000th of an em.</p>
