  html: |-
    <p>In FontLab, using the "Drawing Tool" (the button with the pen icon and plus sign) results in superfluous BCPs created on straight line corner nodes. Anyone know how to prevent the extra handles from being created?</p>
    <p>For example, reading the FontLab manual, for drawing lines using the Drawing Tool: "add a point, just click... to create a line point, just release the button"... this produces corner points with BCPs included. Other tools (Add Corner Tool, Rectangle Tool) don't make this mistake.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/draw-tool2_4625.png"></div><p></p>
    <p>Here the "Drawing Tool" example has yellow BCP indicators on top of the corner nodes. How can this be prevented?</p>
