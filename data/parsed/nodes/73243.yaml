      <p>@Dunwich - Interesting tip on using the Add Corner Tool exclusively, then pulling curves later. I looked in my bag of RoboFab scripts that come with the current version, but couldn't find the "line macro" you mentioned. I'd like to try it out, where does it live and what's the file name on the script? Thanks.</p>
      <p>While using FontLab's tools I always have the feeling that there must be a more intuitive method, or that I'm missing a preference setting, or perhaps I'm just not holding down the correct option-shift-command sequence.</p>
      <p>The main concern I have with the Drawing Tool, as shown above, is the extra (yet zero length) handles that are added to every straight line corner. Also shown in the example are indicators for closepath (blue node) and startpoint (grey arrow). These indicators are absent on the contour created with the Drawing Tool. Another reason to avoid using the Drawing Tool?</p>
      <p>I would love to hear from anyone who wants to share their "best practice" method for drawing contours, Drawing Tool or otherwise.</p>
