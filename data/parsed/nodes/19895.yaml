      <p>The more "secure" the users of a script are (and the West is certainly no wilting lily) the more it's OK to infuse that script with attributes of another. Plus English is the current lingua franca*, so it's used for almost everything, including tons published outside the West, so it's almost unavoidable. I would in fact suggest a "Hellenized" font for this, as long as style doesn't totally overpower functionality. But I can only think of two good ones: Skia; and something once shown to me by Michail Semoglou with elegant, well-crafted forms.</p>
      <p>* Next up: Mandarin. South Americans being ahead of the curve in that.</p>
      <p>hhp</p>
