      <p>If that is for a poster, I think that this is an eyecatching, fun design.</p>
      <p>Not claiming to have any expertise in Brazillian Portugese, my sense is that a Brazillian will see Quinta rather than Quinto and Postulado rather than Postelado, but I'm a little less sure of the latter. Anyway, you are the expert on Brazillian clarity.</p>
      <p>If my assumption that the film focuses on the fifth postulate is correct, the way that the two words are balanced is cool. I love the relationship between the Q amd P and the placement of the circle over the i.</p>
      <p>it strikes me as very Latin American, which I say as a compliment. </p>
      <p>Is the poster strictly type or is there also an image element?  This might have a bearing on the vertical spacing between the two words and their horizontal placement. </p>
      <p>I think that you can get this to the point where the producer wants to use it for the title on screen. </p>
      <p>This is a big improvement on the original sketch. I'd love to see the final design.  </p>
      <p>Very curious to know what other people think and to see their suggestions. </p>
      <p>What do you mean you can't find Code 46? Given where you are going, it is pretty much irrelevant, but even so, like several of Winterbottom's films, it is a cult film, and ought to be available at your local cult film video store :)</p>
