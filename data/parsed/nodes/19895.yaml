      <p>One thing one should be aware of when alluding to Greek is false friends, i.e. glyphs that look identical to Latin characters but linguistically have nothing to do with them. This especially concerns P and X. For example, I always get annoyed when I see <a href="http://www.parkhaus-kenzingen.de/index.php" rel="nofollow">this pseudo-Greek logo</a> used by a local club in Southern Germany (logo is in the upper right-hand corner). It's obviously supposed to spell "EXODUS", but it really reads something like "echodths". It looks mixed-up and silly.</p>
      <p>As a completely unrelated piece of trivia, my impression from holidaying in Greece is that the number plates of Greek cars only use glyphs which are shared by both scripts. This means that they are limited to the fourteen letters ABEHIKMNOPTXYZ. (I suppose C would also qualify if one is prepared to stretch the rules a little, but it does not seem to be used.) Presumably the Greek traffic authorities don't expect foreign police officers to be able to deal with a xi or an omega in a Greek registration, while Cyrillic countries seem to have no qualms about using their characters.</p>
