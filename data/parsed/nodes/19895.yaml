      <p>You have probably considered these issues, but here are some things that I would be thinking about in relation to this design, which I assume is the title of the film:</p>
      <p>Will the film be seen on a large theatre screen or a relatively small television screen?  If the former, does it nevertheless need to be made in a way that is consistent with television viewing?</p>
      <p>What is the aspect ratio of the frame and how does this affect the design of the credits?  If it is 16x9 (widescreen), is it nevertheless necessary to protect for 4x3 (the aspect ratio of the vast majority of television screens)?  Or, if you are shooting 16x9, will it be letterboxed for TV?</p>
      <p>Will the credits be computer generated using, eg., Adobe AfterEffects, or will they be photographed? If photographed, are you concerned that a white/light background may show dust/dirt when projected/broadcast at viewing size?  If photographed with a film camera, what is the emulsion's grain/resolution like at the anticipated enlargement(s)?  If photographed with a video camera, what quality/resolution?</p>
      <p>As a rough benchmark, it is useful to know that super 16 film and high definition video have similar resolution.  Thirty-five mm is better and super 8, standard 16 and standard definition video are worse.  If the credits are going to be photographed with a consumer video camera, it might be a good idea to do a test before going further down this road.  You might or might not be satisfied with the results. </p>
      <p>Will the credits be run on their own against a solid screen (what colour?) or superimposed over or beside photographic images?  In other words, will there be something on the screen, other than type, competing for attention?</p>
      <p>How many seconds will the audience have to grasp the title of the film?</p>
      <p>Do you plan to do all of the credits this ornately?  If so, how many credits are there and how long will each of them be on screen?  If not, what kind of type will be used for the balance of the credits/end credits? </p>
      <p>Have you considered making overt use of Euclid's postulates in the credits?</p>
      <p>I still think that you should have a look at the credits for Michael Winterbottom's Code 46 :). In your case, the Code 46 approach would involve doing all or most of your credits in Greek and resolving each credit, directly or perhaps using other languages along the way, to Portugese. If I have translated the text correctly, and the film focuses on the fifth postulate, it might be fun to go from Greek to Portugese via the languages of prominent mathematicians who challenged the postulate. This kind of thing would be more work than static credits.  However, this is, after all, a motion picture, in which type, if desired, gets to move.</p>
    html_clean: |-
