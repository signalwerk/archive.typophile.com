      <p>Dblanco,</p>
      <p>You might find it useful to look at Robert Bringhurst's The Elements of Typographic Style (3rd ed.), especially pp. 106-113 and 273-278. </p>
      <p>Also, have a look at the opening credits for the film Code 46.  They are typographically very clever and the approach might work very well for your project.</p>
      <p>If you like what you see in Code 46, or otherwise choose to use Greek as well as Latin characters, Bringhurst has useful suggestions on choosing complementary typefaces.</p>
