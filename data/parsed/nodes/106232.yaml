    <p><a href="http://www.beelinereader.com/" title="http://www.beelinereader.com/">http://www.beelinereader.com/</a></p>
    <p>I was surprised to note that the colors didn't seem to bother my reading process.</p>
    <p>Basically I see it as a way to save space and/or page transitions and/or scrolling via a reduction in leading.</p>
    <p>What do you guys think?</p>
    <p>hhp</p>
