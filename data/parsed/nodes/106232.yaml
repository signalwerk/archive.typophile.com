    html: <p>Functionally, it seems pretty solid, and I'm only a little surprised by how good the results in the Stanford study were. Practically, there's the problem that we already have a well established convention for the use of colour on the Web as signalling hypertext links. I notice that in their homepage demonstration they nowhere have a link embedded in Beeline-styled text; the one place where they do have a text link on the page is the one place where they've not applied the gradient styling.</p>
