      <p>Clever idea. Don't think I'd use it myself, but if some folks find it useful then that's great.</p>
      <p>I noticed that in their "Reading Challenge" they used longer line lengths than I usually see on modern web pages or in e-readers (iPad, etc).  I wonder what line lengths were used in the Stanford study.</p>
