    html: <p>I like mix. It sounds less 'short but tall'. On the other hand, Mix sounds a bit like a machine made halfway point. Semi-serif sounds more deliberate. Maybe we need a french word to be invented. Maybe faux french like 'serifette'? But I don't know that you can have (or would want ) a blanket term. In type world names for things only settle out ( if they do at all ) after the fact. And there are so many ways to make something which is inbetween a serif and a gothic! In the end I guess I think it depends on the forms themselves. So maybe we need all the descriptive terms we can get. And maybe the trick is to match the term with what's happening in your font.  So a font with serif on one side of the stem would be one thing &amp; a font with mini serifs another and one which almost suggests serifs like Beorcanna another &amp; so on. Will you show us an example?</p>
