    html: |-
      <p>Because people have new ideas all the time, any classification is going to be problematic. Currently, I find semi-serif (that of Rotis and eg Froggy) and stressed sans (such as Optima and eg Beorcana) useful. </p>
      <p>But Meta, for example has bent stems in places that act sort of like serifs. And Beorcana's heavier weights--which I really like--are such that you could argue that the ends act like serifs. </p>
      <p>So I would say that for discussion just take terms currently useful, if imperfect, and expect them to be flawed, and outdated in 10 years.</p>
    html_clean: |-
