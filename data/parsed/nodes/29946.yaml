      <p>Maybe it's me, but "semi-serif" is something I always associate with Stone's eponymous Serif/Semi/Sans family, and intermediate incidents of MM Penumbra.</p>
      <p>If you cross a donkey with a horse, it's a hybrid called "mule."  (I promise not to get into what you get when you cross a lion with a tiger, because it depends on which is the mother and which is the father.)</p>
      <p>As defined in the dictionary, a hybrid is "a thing made by combining two different elements; a  mixture." If that's not what you'd call the offspring of a serif and a sans, I don't know what is.</p>
    html_clean: |-
