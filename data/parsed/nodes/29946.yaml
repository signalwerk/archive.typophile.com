    html: |-
      <p>Depends which elements of the 2 genres it has. Is it serifs, contrast, some combination? Beorcana, Optima, Amira have no serifs at all, so they can't be called semi-serif. H. Zapf called Optima a "serifless roman", which I still think is awkward, and refers too much to a different category (although Sans Serif itself refers to serifs). </p>
      <p>If there are partial serifs, half serifs or only a few, like with Areplos or Rotis Semi-Serif, then that term fits. If there are none, but there's contrast, I'd like to come up with a more graceful term than "serifless roman" or "high-contrast sans" or "modulated sans". Those are wordy, and though it's true we won't save trees shortening the name of this category, I predict the category will fill up, and then we'll want a snappier name to go alongside Serif, Sans, Grotesque, Fat Face, Script, etc. The reason I don't go for 'hybrid" is that it could mean hybrid between any 2 (or more) styles or classes. That could mean modern/sans, or script/sans or script/typewriter, or brush/modern (it exists!). </p>
      <p>Does anyone have a single word from any language that describes any of these categories gracefully?</p>
      <p>[edit] OOH serifette! Is that like Penumbra with those teeny serif-ettes?</p>
