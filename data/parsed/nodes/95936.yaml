    <p>I'm currently working on the branding for a new organisation and I was helping someone could help me pair up a typeface.</p>
    <p>We're under fairly strict confidentiality restrictions with this client, but what I can tell you is that the business will be operating in the student market throughout Europe. At the heart of the brand is a sense of functional simplicity. Nothing is superflous with their products; everything is considered, intelligently designed and included for a reason. Style is important as well but it's very much a brand that is not consciously trying to be cool. As you can see, we're hardly talking distressed/grungy typefaces here.</p>
    <p>The primary headline font is Century Gothic Bold, and we're after a complementary sans serif that can be used for body copy, captioning, etc. We've been working with Myriad Pro up until now, so I'd welcome your opinion on that as well as any other suggestions you can throw up.</p>
    <p>Many thanks.</p>
    <p>Scott</p>
