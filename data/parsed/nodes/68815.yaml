    votes: null
    html: '<p>FontLab Studio renders PostScript paths in the direction recommended by the Adobe Type 1 font format specification: the outer path runs counterclockwise. See <a href="http://www.adobe.com/devnet/font/pdfs/T1_SPEC.PDF" title="http://www.adobe.com/devnet/font/pdfs/T1_SPEC.PDF">http://www.adobe.com/devnet/font/pdfs/T1_SPEC.PDF</a> pages 27-28.</p>'
    html_clean: '<p>FontLab Studio renders PostScript paths in the direction recommended by the Adobe Type 1 font format specification: the outer path runs counterclockwise. See <a href="http://www.adobe.com/devnet/font/pdfs/T1_SPEC.PDF" title="http://www.adobe.com/devnet/font/pdfs/T1_SPEC.PDF" class="link-external">http://www.adobe.com/devnet/font/pdfs/T1_SPEC.PDF</a> pages 27-28.</p>'
