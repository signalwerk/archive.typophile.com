      <p><em>Checking/fixing this is something FontLab can do for you!</em></p>
      <p>Yes, but it's something FontLab does oddly, at least for me. If I select all characters and then select Contours &gt; Paths &gt; Set PS Direction, the contours which have changed are indicated by a black bar at the top of the affected glyph box. When I save the changes, the black bars disappear, as they are supposed to. But if I perform the same operation later, several of the previously-corrected glyphs show the black bar AGAIN, even though nothing has been done to the highlighted outlines in the interim. As I said: rather odd...</p>
