  html: |-
    <p>I have been converting fonts from PostScript / TrueType that I originally designed in Fontographer to OpenType fonts using Font Lab 5.0.4 MAC version. </p>
    <p>In Fontographer, a CORRECT path direction is defined as having the outer contour or path of a glyph running clockwise, and the inside counters of a glyph running counter-clockwise. An INCORRECT path direction will result in the character looking heavy. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/pathdirection_6532.jpg"></div><p></p>
    <p>It appears to me that FONT LAB has the paths running in the opposite direction from Fontographer. Is this true, or am I reading it incorrectly?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/pathdirections1_4611.jpg"></div><p></p>
    <p>Does it matter which direction the paths are created so long as the counters run opposite to the outer contours? If so, which is correct... the way FONTLAB defaults, or the way FONTOGRAPHER says paths are correct?</p>
    <p>This is a matter of curiosity AND I need to know before I go into over 700 glyphs to make sure they have correct paths.</p>
    <p>Thanks in advance.</p>
    <p>RL</p>
