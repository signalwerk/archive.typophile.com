      <p>Hi Christian... I'll experiment with the line length.   </p>
      <p>I really like the underlined /Omega/ even though, outside of handwritten text, the 'open /Omicrom/' style is much more prevalent - in fact, I couldn't find a single example of the underlined /Omega/ on fileformat:</p>
      <p><a href="http://www.fileformat.info/info/unicode/char/03a9/fontsupport.htm">http://www.fileformat.info/info/unicode/char/03a9/fontsupport.htm</a></p>
      <p>I suspect I'm going to ultimately have to offer the underlined form as an alt, but I'd love to be persuaded otherwise! :)</p>
      <p>As for ligatures, I've been debating what to do about them.  I was researching the subject a few days ago and came across an interesting article by William H Ingram.  It includes a great many historical ligature forms, some of which are quite extraordinary.  Check out, for example, the ligatures for 'υπερσυντελικος' and 'παρακειμενος' at the top of page 3 (which is numbered 373 in the document)!</p>
      <p>Obviously, very few of these are appropriate for this font, but I think it would be interesting to include them as part of a handwritten font project.</p>
      <p><a href="http://grbs.library.duke.edu/article/viewFile/11391/4169">http://grbs.library.duke.edu/article/viewFile/11391/4169</a></p>
