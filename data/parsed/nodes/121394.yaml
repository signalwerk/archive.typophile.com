    <p>I'm currently working on a font, the origins and development of which can be found at <a href="http://typophile.com/node/120859">http://typophile.com/node/120859</a>.  </p>
    <p>During the course of that discussion, Vladimir commented that the font had a "<em>dynamic quality... as if a breeze is blowing through the letters...</em>".  Separately, I've been quietly following the conversation about Gill Sans Arabic (<a href="http://typophile.com/node/92658">http://typophile.com/node/92658</a>), as well as other threads here, which touch upon the tendency by some designers to Latinise non-Latin scripts.  Chris Lozos posted the following comment in a thread about the correct way to draw the Greek letter /Mu/:</p>
    <blockquote><p>My opinion is that Greek text should dance more than say Times Roman Latin. Many Latin faces have glyphs which appear as a single gestalt on the page and group together as words with a single gestalt. I feel Greek text swings together as a flowing, undulating tango rather than marching lockstep in very even time.</p></blockquote>
    <p>Everything I'd read made me wonder if it was possible to develop a worthy Greek character set for my new font, notwithstanding it's more jitterbug than tango.   This is the first draft; it includes only lower case characters at this stage and I'd welcome any feedback (please ignore the accented characters for now).</p>
    <p><a href="http://freepdfhosting.com/f949b115fe.pdf">http://freepdfhosting.com/f949b115fe.pdf</a></p>
    <p>For a comparison with the current Latin characters set, please view <a href="http://freepdfhosting.com/0ff63ba208.pdf">http://freepdfhosting.com/0ff63ba208.pdf</a></p>
    <p>Thanks so much in advance.</p>
