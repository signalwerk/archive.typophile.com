      <p>Hi Joshua, and thanks for your feedback.</p>
      <p>I totally agree with you about the kappa and will change it.  However, I'm less enthusiastic about changing the others at this time.  The loops on the zeta and xi seem to me to be a very typical feature of both Greek handwriting and Greek fonts.  These loops also tie in well with the loops I have on the beta, gamma, epsilon and omega.  And, on the xi in particular, I can't help thinking the removal of the top loop will leave the middle loop looking a bit out of place.</p>
      <p>As for the lambda, if anything, I was concerned mine wasn't curved enough.</p>
      <p>None of this is to say I'm opposed to change, and I'd welcome your further thoughts on this.</p>
