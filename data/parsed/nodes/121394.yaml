      <p>I've tackled a couple of things that were bothering me.  </p>
      <p>The 'sober' /epsilon/ from my earlier update remains unchanged, but the revised /gamma/ has since been re-revised and is now harmonious with a similarly revised /nu/.  Is it appropriate for these two letters to share the same structure?</p>
      <p>Also, the /lambda/ has been made more upright (with a general shape also in keeping with the /gamma/ and /nu/), but the top more curved.  This seems to me to be very much in keeping with Greek handwriting styles.</p>
      <p>Finally, for now, I've experimented with a new form of /phi/.  I saw this looped transition in a calligraphic font and thought something along those lines might complement the loops in some of my existing characters.  Is it an acceptable form?</p>
