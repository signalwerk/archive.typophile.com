      <p>Thanks, Christian... I've straightened /gamma/ and partially de-Elvised /lambda/! :)  Nice catch on the /eta/... I've corrected the stroke ending.  The 'error' on the /xi/ (and also on the /kappa/), however, was deliberate.  I didn't see a good way to have the NE/SW diagonal strokes agree with the pen without making them either very curly or very thin.  I justify this by telling myself that Greek is full of these anomalies but, if you could suggest a workable solution, I'm more than happy to explore it.</p>
      <p><a href="http://freepdfhosting.com/79f4f73561.pdf">http://freepdfhosting.com/79f4f73561.pdf</a></p>
