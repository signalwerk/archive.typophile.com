      <p>I do not think that greek characters should dance tango on the page.  Ancient greek inscriptional letters had very simple forms, similar to modern sans serif typefaces, before the roman alphabet even existed.  Thus, I think it is a misconception that simple, rationalized forms are in any way unsuitable for a greek typeface.</p>
      <p>I really like your greek characters, and they match the roman characters nicely.  However, I would remove the little top-right loops on zeta and xi, I think they are too much.  I would also try less curved kappa and lambda forms.</p>
      <p><cite>Most of these caps are copies of the Latin characters set - is this correct for Greek</cite><br>
      Yes.</p>
    html_clean: |-
