      <p>cursusductus,<br>
      Great name! I don't know your setup, so apologies if you know this already…</p>
      <p>You can create your own images of GX variations fonts in the drawing program Intaglio. Set some text and choose Skia from the fonts pallette. Instances and variations sliders appear in the Typography Panel, which is accessed from the 'gear' icon. MM fonts work in the same way as GX Variations—just drag the sliders.</p>
      <p>Alternatively, install the X-Code tools and go to Developer&gt;Examples&gt;ATSUI&gt;Font Panel Support and compile the sample program 'ATSUIFontPanelDemo'. Several other example apps also display GX Features and Variations.</p>
      <p>If you have the OSX 'Classic' environment installed, or you have a pre-OSX Mac with System 7, OS8 or OS9, download LightningDraw Lite. The GXGraphics extension, which supplies the GX Variations functionality, is installed with LightningDraw (it's part of the installer).<br>
      ____________________________</p>
      <p>About Incubator GX (I've not used it as haven't been able to find it, legally or otherwise); </p>
      <p><a href="http://www.truetype.demon.co.uk/truetype/sampo.htm">http://www.truetype.demon.co.uk/truetype/sampo.htm</a><br>
      This page says Sampo Kaasila of Type Solutions created Incubator GX and TypeMan GX (a hinting tool), but they were later discontinued due to a lack of interest from the market. This is bizarre; the first GX applications didn't arrive until 1995!<br>
      ____________________________</p>
      <p><a href="http://web.archive.org/web/20010104101800/webcom.net/~nfhome/fontgen.htm">http://web.archive.org/web/20010104101800/webcom.net/~nfhome/fontgen.htm</a><br>
      This page says that Incubator did things that Font Chameleon could not do. At the end of the piece it says that Bitstream bought Type Solutions in December 1998.<br>
      ____________________________</p>
      <p>According to a Seybold Report from 1993, Incubator GX could automatically produce multiple axis GX fonts from a single input—in other words, GX Variations fonts.<br>
      ____________________________</p>
      <p>David: </p>
      <p>Could you expand on this? Did Incubator work? Was it able to create Variations? How were the Skia variations created?</p>
