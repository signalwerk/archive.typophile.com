      <p>WorldText does work with OSX 10.4, but it requires the PowerPlant.framework. This wasn't suppled with 10.4, but it was with previous versions of OSX. The framework goes in;<br>
      Macintosh HD&gt;System&gt;Library&gt;PrivateFrameworks&gt;PowerPlant.framework</p>
      <p>The OSX drawing app Intaglio supports GX/MM Variations and Instances via two extra features in the Typography Panel. </p>
      <p>Intaglio, WorldText and the X-code example ATSUIFontPanelDemo, also display an extra menu, 'Extra Position Controls', which consists of three features; 'Add Space Before Characters', Add Space After Characters' and 'Shift Text Baseline'. The first two features enable letterspacing and leading to be changed either by moving a slider or by typing a numeral in a box. This works with letters, words, lines or paragraphs. </p>
      <p>How 'Shift Text Baseline' works depends on the font. With most fonts, space is added between each line and between paragraphs, but with Skia, the space is added between paragraphs and the last line in paragraphs is also changed. Something is wrong here—maybe this was corrected in OS 10.4.6? </p>
      <p>The Font Panel doesn't always work properly. If you choose a different font, WorldText ignores the change. This can be solved by opening a new document.</p>
      <p>Several more X-code samples (including MLTE Showcase and TypeServicesForUnicode) also support Variations to one degree or another, but their implementations and interfaces are different from Text Edit.</p>
