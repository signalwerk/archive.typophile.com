      <p>David, </p>
      <p>GX variations are "dying supported". You can't get them in a normal Cocoa application such as Keynote, Pages or TextEdit. You need to make direct ATSUI calls from a Mac OS X applications, which almost nobody – most people use the Cocoa text framework. There is a demo ATSUI application on the Mac OS X developers pack which allows you to see the Skia GX variations but that's about it. There used to be a small text editor called WorldText that supported the variations. It was included in the developers pack of Mac OS X but I was not able to find it in OS X 10.4. I tried running an older copy of WorldText on my 10.4 system but it crashed. So the support for GX variations is practically non-existent, from the user point of view. </p>
      <p>A.</p>
