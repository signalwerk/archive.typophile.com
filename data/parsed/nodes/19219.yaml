      <p>All the technologies you mention use(d) interpolation (and in one case, extrapolation), which is sort of the oxygen of computer assisted style manipulation, grid fitting and things beyond. </p>
      <p>Cameleon worked by having a small set of very complex contours, masters took up 50-100k per font (I think), and there were several of these; for serif, sans, italic, etc., and then a 5k descriptor file for each discrete style from a particular master. You could, of course, interpolate to anywhere within, (but not between) the masters, and create your own 5k style descriptor.</p>
      <p>Incubator Pro, I don't remember that much as it was a quick quack between MM and GX, before GX "won." </p>
      <p>"Can we get some images..."<br>
      ¿How do you "Insert" movies here?</p>
