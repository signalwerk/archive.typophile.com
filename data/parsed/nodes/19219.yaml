    <p>Hi,<br>
    I've been searching information about these cute programs, but they have disapeared and there's almost no data on the net.<br>
    Here you can read a bit:<br><a href="http://www.savetz.com/ku/ku/meaden_incubator_pro_for_font_mangling_august_1993.html">http://www.savetz.com/ku/ku/meaden_incubator_pro_for_font_mangling_augus...</a></p>
    <p>They were able to open an existing PS or TT font and make versions of them, applying Deltas (hinting operation). Something like a Multiple Master, but Single Master.<br>
    It would be nice to get some demo or screen shots for my PHD thesis.<br>
    Thanks,</p>
    <p>Daniel</p>
