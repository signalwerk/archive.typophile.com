      <p>"Incubator GX could automatically produce multiple axis GX fonts from a single input—in other words, GX Variations fonts."</p>
      <p>"Was it able to create Variations? How were the Skia variations created?"</p>
      <p>Incubator made gx fonts with a narrow axis. I.E. it could get from roman, to light and bold, not thin and black. I don't remember how well widths worked...</p>
      <p>Skia was made by hand. Matthew drew four corners, I made gx and pushed the narrow corners narrower and then Tom Rickner and Matt made it nicey nice and then Tom hinted it :-o.</p>
