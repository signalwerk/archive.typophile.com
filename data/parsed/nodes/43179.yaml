      <p>I don't think you'll find too many common threads in the areas you mentioned, although they are connected to the medical profession.<br>
      In the US, hospital signs (as far as room identification and wayfinding) will need to conform to the ADA. The main identification for the hospitals is of course at the discretion of whatever designer the architectural firm contracted.<br>
      Reports and research probably have common typefaces, but they'll be more related to the most common software used to produce and read them (TNR, Courier, Helvetica, Verdana, etc.)</p>
      <p>OK, so that wasn't particularly helpful, but maybe it's a warning?<br>
      For info on Signs, you can search the articles on SignWeb, from Sign of the Times (sign industry) magazine here:<br>
      <a class="freelinking external" href="http://www.signweb.com/search.php" rel="nofollow">http://www.signweb.com/search.php</a></p>
      <p>Jason C</p>
