      <p>To be honest, sometimes those monospaced dot matrix printer types makes me feel good, but sure, there is placement, composition, tables, &amp;c.</p>
      <p>George, you can browse <a href="http://www.abacusrx.com/images/pics/Forms/Rx%20Label.JPG" rel="nofollow">similar</a> typefaces in “<a href="http://www.myfonts.com/browse/category/myfonts/computer/" rel="nofollow">computer related</a>,” Telidon by Ray Larabie is one. This story/style finds a related start in 1968 when ATF produced <a href="http://www.myfonts.com/fonts/adobe/ocra/" rel="nofollow">OCR-A</a>, one of the first optical character recognition typefaces. John Scheppler’s Orator for IBM typewriters is another interesting case ; Anuthin Wongsunkakon’ Carbon (T-26) is interesting, too, in my opinion.</p>
      <p>A student of mine is graduating with a thesis on this (your post) topic, the title will be something like “Medical Point of Purchase.” If you want to share some information I can put you in touch with him.</p>
