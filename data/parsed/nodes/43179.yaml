      <p>Basically I'm just putting together a series of posters (the theme being "sickness"), and I'm try to see if I can find any typefaces that might easily trigger a "medical" association.</p>
      <p>Didn't really require an astounding amount of research, but obviously lots of humanist sans-serifs for hospital signage, etc ...</p>
      <p>Also, probably not a font, but I was also looking at some prescription labels like this one: <a href="http://www.abacusrx.com/images/pics/Forms/Rx%20Label.JPG" title="http://www.abacusrx.com/images/pics/Forms/Rx%20Label.JPG">http://www.abacusrx.com/images/pics/Forms/Rx%20Label.JPG</a></p>
      <p>Does anyone know of any typeface that recalls this sort of lettering?</p>
      <p>Thanks for your help.</p>
