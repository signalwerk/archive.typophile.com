      <p>Are these proposed font spec extensions specific to – or mostly useful just for – emoji? I think that’s a question I’m hearing in some of the discussion above.</p>
      <p>The answer, in my opinion, is a clear No. All the examples on <a href="http://www.photolettering.com" title="http://www.photolettering.com">http://www.photolettering.com</a> are of Latin text. That website was one of the major inspirations behind the SVG OT project’s “color-by-numbers” or color palettes facility (as discussed <a class="freelinking external" href="http://lists.w3.org/Archives/Public/public-svgopentype/2012Aug/0000.html" rel="nofollow">a full year ago</a> on svgopentype).</p>
      <p>The potential uses of color, gradients, or animation in fonts are much larger than just for emoji.</p>
      <p>Yes, we must continue to wrestle with questions of “what really constitutes text.” These questions are not new to OpenType. For example:</p>
      <ul>
      <li> I have a sense that predictability or repeatability is a core property of text. However, OpenType’s contextual alternates, CFF’s random operator, and the tricks one can play with TT hinting – e.g. a three morphs into what looks like a four at a certain ppem – may push the limits of one’s comfortable understanding of the predictable display of text.
      </li><li>I can’t make up my mind what pummels my concept of text more: the encoding of symbols in Unicode (e.g. Zapf Dingbats, emoji), or the use of Unicode’s Private Use Area in fonts, e.g. as blessed by MS’ cmap symbol encoding. And on the OFF list it has even been suggested that since all car dashboard symbols have already been standardized, getting them into Unicode should be a trivial task. While I’m not involved in Unicode standardization efforts, I would probably strongly question any effort to significantly extend OpenType primarily for the benefit of symbols or icons, whether they were blessed by Unicode or not.
      </li></ul>
