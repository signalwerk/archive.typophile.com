      <p>John, " So I see a couple of different options for animating something like a countdown, as shown in David's video:"</p>
      <p>I know how to animate it... I want to store it. "It" being a discrete place or range in an otherwise indiscrete range. In that place is a "something" the user needs to know. </p>
      <p>"1...."<br>
      Forgetting about PUA, and this 1995 demo video, or probablies — Any unicode glyph, via animation, can become any other(s). Store it how?</p>
      <p>"2...." </p>
      <p>John, I think you'd agree then, coordinating the timing in animation, is pretty much, animation. </p>
      <p>So, if there is anything in the animated font that crosses any bound as defined by the current format the font is within, (and the user needs to know where), then shouldn't the format know how to store it?</p>
      <p>With only Adam talking of sourcing all this, bless his heart, we're all pretty busy I'm sure, but one more question?</p>
      <p>If we are talking about fonts for the next decade, size 'n time tables for all, or not, don't things that are scaleable, rotatable, skew-enabled and responsive in the way outlines are, need a separate format from bitmaps?</p>
      <p>I see why this neandering font format society persists at apple and on the web. Can't they take what they need 'n make the best gosh darn OBFF on planet earth, including links to OFFs, and leave the future of OFF without bitmaps, but with links to them, so OFF can see it's responsive responsibilities more clearly, which clearly it hasn't and don't at this time. </p>
      <p>Part of that, of course, is in the standards process, where it is the biggest pile of fonts that stops the progress. This time, perhaps it should be the fastest pile that the progress stops at, instead... just for variety ;)</p>
