    html: |-
      <p><em>The emoji on the sample page, and the other samples we hope to post soon, are all Unicode characters.</em></p>
      <p>Right, but that's because of pressure to handle those little pictures in the existing text encoding and interchange architecture, including pressure to be able to handle them in fonts, in the absence of a dedicated Little Picture Encoding and Interchange architecture.</p>
      <p><em>And while typography is certainly linguistic, it's also massively visual.</em></p>
      <p>But we were talking about communication, and the communicative content of typography is massively linguistic. The visual aspect of typography is simply the nature of writing as a visual representation of language, and what type <em>communicates</em> visually independent of that linguistic content -- the ideas conveyed by the particular visual representation of the text -- is mostly superficial and crude, expressible in simplistic adjectival terms: 'elegant', 'clear', 'friendly', 'grunge', etc.. That seems to me barely communicative.</p>
      <p>It's a first-year design school adage that typography exists to serve text, one implication of which is that font formats exist to serve text too. Colour, gradations and animations only need to become part of the font format because things are being treated as text that were not previously treated as text. And I understand and accept this need -- somewhat grudgingly, it is true, but then I was one of the people who made the case against the encoding of emoji in Unicode --, but I think we should be clear about why we're now looking at things like SVG in OpenType and other mechanisms. It isn't because there is a use for such things in fonts or typography, but because we're trying to make fonts useful for pseudo-textual content that includes things that no one ever considered text before. I think it is important to be clear about this, because that's the only way we can understand and anticipate the pressures that may result in further expansions of our concept of what constitutes 'text'. Simply defining text as 'anything encoded in Unicode' is begging the question, because one of the things at issue is what should be encoded in Unicode.</p>
