    html: |-
      <p><em>no end-user scaling offered at this time.</em></p>
      <p>Other than that provided by browsers, I presume you mean.</p>
      <p><em>to demonstrate that gradations and animation are useful in some font contexts</em></p>
      <p>Hmm. Fonts have been, since Gutenberg, a convenient format in which to store some kinds of little graphics to be published in the same medium as text; hence renaissance ornament fonts, 19th Century cartoon slugs, etc.. What you really seem to be saying, David, is that you want fonts to be convenient for other kinds of little graphics, such as those with gradations and animation. This seems to be quite different from saying that these things are useful in some font contexts: rather, you want to make fonts useful for these things. The trouble I have with the whole notion of graphics in fonts is that, in fact, digital fonts are much less convenient as storage mechanisms for any kinds of non-text graphics than old trays of metal used to be; this is because accessing sorts in digital fonts relies on character encoding and text processing. So when people want to display little graphics with digital fonts, they first need to encode those little graphics as if they are text. This leads inevitably to either a bunch of stuff in fonts that is not reliably interchangeable in documents, or to pressure on text encoding standards to accept little graphics into their character sets.</p>
      <p>Personally, I'd like to see little graphics given their own interchange architecture, suited to their characteristics, rather than bolting them into fonts and then determining that font formats are lacking if they don't support dancing penguins. But I understand that this would be more work than adding yet another outline format table to OFF.</p>
      <p>_____</p>
      <p>PS. I also take issue with the idea that 'typography is about visual communication'. Typography is about textual communication; it's communicative content is massively linguistic.</p>
