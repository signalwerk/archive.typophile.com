      <p>The answer to that question depends on how the animation is triggered. I think we have to take it as read that character encoding drives glyph display, and not the other way round. Introducing animation is unlikely to turn this on its head. So I see a couple of different options for animating something like a countdown, as shown in David's video:</p>
      <p>1. A single glyph level animation representing a single 'countdown) character (probably PUA, possibly culminating in an explosion or rocket launch animation) ;</p>
      <p>2. Multiple glyph level animations, one for each numeral transform, responding to a multiple digit character countdown driven by software; i.e. the software counts down, changing the digit Unicode at each step, and the font provides a different glyph animation for each digit (coordinating the timing of the character changes and the animations will be the tricky bit).</p>
    html_clean: |-
