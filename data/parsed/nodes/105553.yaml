      <div class="comment-spam-body"><p>@ John Hudson  I remember your opposition to adding emoji to Unicode. I'm still a bit surprised, because what you're dismissing as not linguistic or textual is a set of symbols that communicate well-understood meanings. Language is not just what is spoken, but what is communicated, and has had a visual dimension from the beginning. Emoji are simply one mechanism for restoring a bit of the bandwidth that is lost when language is reduced to written text.</p>
      <p>As for graphic communication being crude compared to written text, I think that's true in some cases and not others; it depends largely on the purpose of the communication. People are paying far more to fine-tune the appearance of ads than to fine-tune their text.</p>
      <p>I am also surprised at what seems to be a concern about the potential of expanding what "text" constitutes. Nobody's forcing anyone else to use emoji or other more expressive attributes of type, but the world sees a need for them. As you know, communication is enhanced when it incorporates standardized systems (such as Unicode and SVG).</p>
      <p>thanks,<br>
      David L</p>
