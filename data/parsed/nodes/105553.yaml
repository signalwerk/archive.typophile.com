    html: |-
      <p>Speaking of massively linguistic, I was asked to make a type that wrote itself. Any folks done this know, when <em>time</em> is part of typography, as opposed to penguins, the expected behaviors are not so simple to achieve. Unicode, for example, while containing an unclear number of strokes, (like a "sans 'I' has just one!'), has no information about how much <em>time</em> each stroke takes, nor the <em>time</em> there is between, if there is any, or relates some <em>time</em> to the word space. 1 entire unicode font that drew itself would take one of the younger of us the rest of our life to figure out the timing of. Should that deter the standard, I'd not be surprised;)</p>
      <p>But the alternative, storing the definitive drawing of a letter in the application that makes the animation, and copying that every time one needs the letter drawn, is not going to work, like it did for us back in 1994. </p>
      <p>The relation of the glyph's contours to the clock are only one aspect of type time. So, where is the time table? </p>
      <p>I would also like to say...from<br>
      <a href="http://lists.w3.org/Archives/Public/public-svgopentype/2013Jul/0004.html" title="http://lists.w3.org/Archives/Public/public-svgopentype/2013Jul/0004.html">http://lists.w3.org/Archives/Public/public-svgopentype/2013Jul/0004.html</a>.</p>
      <p>The analogy to surgery in this link is inappropriate. It is indicative of the attitude towards the OT format — designed, like a human chest, not to be cracked open at all. </p>
      <p>Adobe wants to get it over with once? and for decade! time, size, gvar, cvar, fvar, krn2!, "improvement" to OS/2 width and weight, and the new MS color tables should do all you need.</p>
      <p>And someone! please show how color gradations are going to scale in low resolution Cleartype.</p>
