      <p>For those who don’t know me, I’m the Core Type Technology and OFF/OpenType spec lead at Adobe. I look forward to meeting many of you next week at TypeCon and pondering where these various moves to incorporate color and/or animation could take –&nbsp;and have taken! – the type and design communities.</p>
      <p>If you’d like to see <strong>SVG OT in action in Firefox</strong> right now, follow the instructions below. Then go to <a href="http://people.mozilla.org/~jkew/opentype-svg/GeckoEmoji.html" title="http://people.mozilla.org/~jkew/opentype-svg/GeckoEmoji.html">http://people.mozilla.org/~jkew/opentype-svg/GeckoEmoji.html</a> and you should see the emoji spring to color life. Note that these colored glyphs are specified in the ‘SVG ’ table in the OT font embedded on that web page and that what you’re seeing is Firefox’s implementation of this OT spec extension in action.</p>
      <ul>
      <li>Firefox v24 and up (download at <a href="http://nightly.mozilla.org" title="http://nightly.mozilla.org">http://nightly.mozilla.org</a> if needed).
      </li><li>Type about:config in the address bar to bring up Firefox's config prefs.
      </li><li>Narrow the prefs by searching for ‘svg’. Then change the values of gfx.font_rendering.opentype_svg.enabled to true and svg.display-lists.painting.enabled  to false (the latter may not be needed after a particular bug is fixed).
      </li></ul>
      <p>The latest <strong>technical spec for SVG OT</strong> is at the bottom of <a href="http://lists.w3.org/Archives/Public/public-svgopentype/2013Jul/0003.html" title="http://lists.w3.org/Archives/Public/public-svgopentype/2013Jul/0003.html">http://lists.w3.org/Archives/Public/public-svgopentype/2013Jul/0003.html</a> in case you’re interested.</p>
      <p>Best,<br>
      Sairus</p>
