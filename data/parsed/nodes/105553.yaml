      <p>I didn't say that graphic communication was crude compared to written text, I said that what typography communicates <em>independent of the linguistic content of the text</em> is crude in comparison. My point is that typography is a technology that developed around the massively linguistic communicative content of text, and changing that technology to accommodate non-textual content should be done with eyes wide open and not passed as somehow just business as usual.</p>
      <p>Please, please, note that I am not opposed to SVG in OT and related proposals, and I am not concerned about expanding notions of text. I am saying that we should try to be clear in our understanding of what is happening and what it means, and I found some of the initial statements in this thread a bit woolly. 'Visual communication' is a red flag phrase for me, because no one has ever been able to explain to me exactly what it is or how it works.</p>
