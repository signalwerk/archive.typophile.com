      <p>Steve,</p>
      <p>The name of the original typeface is Glenmoy. I haven't heard of any other digital version except for Mousse script by Alejandro Paul. His interpritation is to be found at Veer, <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000162#specimen" title="http://www.veer.com/products/typedetail.aspx?image=UMT0000162#specimen">http://www.veer.com/products/typedetail.aspx?image=UMT0000162#specimen</a></p>
