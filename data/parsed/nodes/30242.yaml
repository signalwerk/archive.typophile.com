    <p>Wondered if anyone could help identify this sample. I have tried What the Font and looked through the foundries and places I suspected, including the casual script section of the Bowfin site, but no luck. It is a subtitle font used by Food and Wine Magazine fairly extensively throughout their issues. I don't believe it was used by them until the last year or two.</p>
    <p>Thanks for any help. It is my first post, couldn't seem to be able to get the image to show up inline as anyting except a question mark, sorry if I mess anything up.</p>
    <p>Steve</p>
