    html: <p>As I said Alejandro's version is not 100% identical with the original Glenmoy. But still close enough. Judging from the showings at Veer. It seems that the uppercases do carry alternates. I see two "W" The rounded one is very close to the one from the magazine, except for angle on the side stroke to the left.</p>
