      <p>Hi,</p>
      <p>Ok, been thinking about it a while, and now I know what I need:</p>
      <p>- a humanist sans<br>
      - open forms ('c' and 's' for example)<br>
      - curved serifs in 'a'<br>
      - a beautiful italic</p>
      <p>So yes, Franklin, Spiegel and Bulldog would be too 'rigid'. <a ref="" rel="nofollow">Mundo Sans</a> fits the description perfectly (but does not have the condensed bold).</p>
      <p>But – with these specifications I am not likely to find a font with a condensed bold and/or the kind of closed forms as in <a ref="" rel="nofollow">Trade Gothic Bold Condensed no 20</a> or <a ref="" rel="nofollow">Franklin Gothic Extra Condensed</a>, am I?</p>
      <p>Do you think that it would be too much to mix 4 different fonts in one magazine? I have always preferred to keep the number down to 2-3 so I hesitate.</p>
      <p>If I go for 4 different fonts, Mundo Sans is on the top of my list. Any other suggestions with these specifications?</p>
