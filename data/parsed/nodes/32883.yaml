    <p>Hi,</p>
    <p>I am new to the forum, and very impressed of the quality and amount of information on this site. I am hoping for your help on finding a contemporary sans serif, that has readability in long text settings and large enough family to include condensed styles.</p>
    <p>This is for a minor redesign of a magazine on culture and society. The magazine uses a lot of illustration and it's printed with just two spot colors on an uncoated paper. The overall feel is quite airy, graphic and a bit experimental. Current fonts for body text and headlines are ITC Franklin Gothic and Arnhem Blond, with occasional SerifedSans headlines and some flourishes to spice it up. I will keep the flourishes, and the basic layout, but I will change the text fonts and redesign some of the details.</p>
    <p>The reason why I am looking for something contemporary and new instead of, say Frutiger, is quite vain - it's just to keep it fun for me. I already have some good candidates, but I would love to hear of any new ideas. I'm sure there are still some treasures to be found.</p>
    <p>This is what the new font set should consist of:</p>
    <p>2 headline fonts<br>
    - Farnham Display Swash Italic / this is decided &amp; bought already<br>
    - a condensed sans serif - like Trade Gothic Bold Condensed No. 20, but Trade Gothic doesn't cut it for the body text</p>
    <p>2 body text fonts<br>
    - modern, light sans serif with readability (even for long finnish words) with a family that has the condensed style needed for the headline. I'm thinking maybe Fresco Sans?<br>
    - a serif that's something like ITC Charter - and has a 'b' similar to Charter. Arnhem is beautiful, but starting to be a bit overused here and lacks the lightness and modern feel of Charter. Any ideas for this are also welcome.</p>
    <p>Both the sans and the serif need to have a light, modern feel, but also some warmth. For sans I would love to use Bliss, or maybe even Mundo Sans, but both lack the condensed style.</p>
    <p>I might be getting my terms wrong, or explain myself poorly, so let me know if this doesn't make any sense to you. Attached are some pictures of the magazine to give you an idea of the design. Thanks in advance for your help!</p>
