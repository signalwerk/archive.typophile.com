      <p>I highly recommend <a href="http://www.fontshop.com/search/?q=brown+gothic" rel="nofollow">Brown Gothic</a> to replace Trade Gothic. It works well in text sizes, but is even better for display as it has more character than Trade. <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/bulldog/" rel="nofollow">Bulldog</a> is also a good alternative for the same reasons. Its true italic makes it an even better candidate for text. It could be used along with Brown Gothic Condensed for headlines.</p>
      <p>I'm surprised to hear that Arnhem is overused. Things must be looking beautiful in Finland. Have you considered <a href="http://www.ourtype.be/" rel="nofollow">OurType</a>'s newest text serif Amalia? <a href="http://www.ourtype.be/pdf/OT-Amalia.pdf" rel="nofollow">Download the PDF</a> for a decent look.</p>
