    html: <p>It is similar to a number of fonts from the Art Deco  era, but I can't find an exact match. Leslie Cabarga has done a number of these connected 'machined' scripts, but Nick Curtis's <a href="http://bowfinprintworks.com/Script07Pg5.html" target="_blank">"Lakeshore Drive"</a> is the closest I know to this style. You can see the others I've collected, in that section of the Script Guide.</p>
