      <p>hey shielddesign,</p>
      <p>I posted on this thread last week, but have no idea where it went. Anyway...</p>
      <p>Stormbind's snow suggestion is spot-on. If done with light blue, it will definitely look like snow just using one color. </p>
      <p>If you have the option of 2-color printing, I suggest a blue tree/snow and a red bird - cardinals are one of the few bird species that sticks around in the winter. </p>
