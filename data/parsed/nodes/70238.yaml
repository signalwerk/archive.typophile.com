      <p>Firstly, DIN was designed long ago and was always public domain.<br>
      FF DIN is a particular iteration of it.</p>
      <p>So there is nothing to stop anybody else doing their version, even though the digital FF DIN has become so well known and much used.</p>
      <p>However, other copies must not use FF DIN's digital data as a starting point.</p>
      <p>Secondly, plagiarism means copying without recognition of the source, so if there is no mention in the collateral literature of CPD Sans that it is a version of DIN, then that would indeed be plagiarism.</p>
      <p>Thirdly, because FF DIN is such a subtle and extensive iteration of DIN, if CPD sans takes a lot of its form from Pool's work, rather than the original of the 1930s, then that too could be seen as plagiarism, even if there is no "point piracy".</p>
