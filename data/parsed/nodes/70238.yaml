    <p>Hello fellow typophiles!</p>
    <p>With my first post I come to present you the new corporate font of the Centro Portugues de Design (Portuguese Design Center). It`s not a Design ruling body per se, but it`s probably the most important organization for design in Portugal.</p>
    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150123040216im_/http://typophile.com/files/Untitled-1-01_4890.jpg"></div><p></p>
    <p>In the attached image you can see their new sans serif corporate font, CPD Sans, designed by Hugo d`Alte in 2009 or 2010.</p>
    <p>They presented this font on their Facebook page and I immediately recognized it and made a little comparison with FF DIN, which i`m sure everyone here knows.</p>
    <p>I pasted their image and wrote the same set of characters on top of it, using FF DIN, size 34pt. The kerning is exactly the same.</p>
    <p>Your opinion? Is this blatant plagiarism? Could they have had permission to make subtle alterations to the font and release it as their own?</p>
    <p>Coming from such a reputable organization and with considerable resources I would have at least expected something new... original!</p>
    <p>Cheers</p>
