      <p>1. CPD Sans &amp; CPD Serif are not custom original designs for CPD (Centro Português de Design).<br>
      These typefaces were developed as part of an identity update. These typefaces were developed<br>
      from previous work as agreed with CPD (Centro Português de Design). </p>
      <p>2. CPD Sans is based on DIN, it's in fact a development of an earlier (experimental) work done internally<br>
      at the biggest advertising agency in Finland (SEK from the GREY Group), a rounded version of DIN (some<br>
      time before DIN rounded was published). This earlier work was never used. This was known in advance.</p>
      <p>3. CPD Sans was develop primarily to replace Futura typeface on CPD's logotype. Nothing else.</p>
      <p>4. CPD Serif is in fact CPD's  corporate typeface - to be used in it's stationary and internal/ external communications. </p>
      <p>5. CPD Serif is a customized version of a typeface designed by me and currently being developed<br>
      for it's commercial release (this typeface known as  Rolland). Also CPD Serif was chosen by CPD<br>
      to be customized for their internal use: <a href="https://web.archive.org/web/20150123040216/http://cargocollective.com/hugoalte/13224/Rolland" title="http://cargocollective.com/hugoalte/13224/Rolland">http://cargocollective.com/hugoalte/13224/Rolland</a></p>
