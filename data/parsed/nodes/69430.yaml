      <p>Here are a few observations:</p>
      <p>ae and OE seem clogged in the middle.</p>
      <p>The curly-legged R variant seems out of place. </p>
      <p>5 looks bottom heavy. </p>
      <p>oslash and Oslash need some adjustment for the optical illusion at the intersections.</p>
      <p>@ is interesting!</p>
      <p>bottom terminal of e might get too thin in some weights.</p>
      <p>is there a different in those italic Ms?</p>
