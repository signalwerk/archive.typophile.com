  html: |-
    <p>Dear Everybody Who Loves Font,</p>
    <p>This is my first - quite serious - attempt to draw a font family. </p>
    <p>Basic concept was/is to draw a Thin and Black weights and blend<br>
    and carefully review all the weights in between.</p>
    <p>Now I like this - and would be glad to have any critique.</p>
    <p>Thanks!</p>
    <p>B.</p>
    <p>P.S.: Numerals look still something ugly for me - I'm working on it.</p>
    <p>P.S.2.: Italic is mainly oblique for now - except 'f' and 'f-ligas' - but<br>
    a few glyphs are planned to be redrawn.</p>
