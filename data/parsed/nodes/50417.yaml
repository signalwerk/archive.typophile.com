      <p>I know what he means. I have instructed TrueType fonts using Visual TrueType and FontLab. The interfaces are a joke, and the process is backwards.</p>
      <p>The GUI for writing instructions should be nothing more than a pixel grid —  a simple point-and-click bitmap editor. So all you have to do is place the pixels where you want them, and the software writes TrueType instructions and places deltas which ensure that the rendered type exactly matches the bitmap you drew. This would be good software.</p>
      <p>Nobody makes good software anymore because it's too hard.</p>
