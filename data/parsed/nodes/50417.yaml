  html: <p>The whole thing is just too deliberately arcane for me. You know what I would like? A program that lets me pixel-edit a font at key sizes -- or even as many sizes as the information will match up for -- and adjusts the font's hinting so that it will look like that. Surely someone is clever enough to write such a thing.</p>
