      <p>"Will hinting die before it kills me?"<br>
      Funny, I have wondered about this at roughly ten year intervals, but only three times, so it's not a great sampling. </p>
      <p>"The whole thing is just too deliberately arcane for me."<br>
       I am curious as to what parts of this underused cutting edge you consider deliberately arcane?</p>
      <p>"...if hinting were automated to match a user-provided bitmap at one or two sizes, the hinting results would be greatly improved..."<br>
      I guess you mean the results would be the same, but that the abilities of bitmap designers would be enhanced.</p>
      <p>Auto-tracing your bitmap would be easier than trying to write a bitmap to hinted outline machine, I think.<br>
      But if one has a "captive grid" i.e. a single, size/resolution/device/rendering combination, then why not draw an outline, or redrawn "the outline" to fit it?</p>
      <p>Cheers!</p>
