      <p>I can't help but feel that if hinting were automated to match a user-provided bitmap at one or two sizes, the hinting results would be greatly improved for most other sizes as well, with far less work.</p>
      <p>Also, some display rasterizers appear to use hinting data for "smooth" greyscale rendering, which of course wouldn't be influenced by embedded bitmaps.</p>
