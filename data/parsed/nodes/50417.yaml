      <p>cerulean. I know how frustrated you feel. I felt the same when I first started looking at hinting with VTT. But you really don't want to start pixel popping to define TT instructions. If you have a Light serif font that has a single pixel weight up to say 24ppm, the last thing you want to do is have to pop pixels for all those sizes in each glyph.</p>
      <p>VTT is great at allowing you to play with instructions visually to find the best compromise for a range of sizes, just leaving you to fix a few problem sizes with deltas.</p>
      <p>Yes - hinting can be both complicated but also repetitively boring. When I do it, I make sure I hit it without being disturbed and with my iPod turned up.</p>
      <p>m</p>
