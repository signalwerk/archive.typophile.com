      <p>I think I see a middle path on this:</p>
      <ul>
      <li>Automated hinting generates initial hints
      </li><li>this in turn generates bitmaps of a specified size
      </li><li>Bitmaps would then be manually adjusted,which would modify the hinting instructions such that the adjusted bitmap is produced by the hints.
      </li></ul>
      <p>Conceptually, it makes sense to do the hinting interface in this way, but I have no idea what kind of monster it would be to program.</p>
