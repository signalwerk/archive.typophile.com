    html: <p>The whole point of TrueType hinting is to use an instruction set to control rasterisation because editing bitmaps by one-by-one takes too long. A hinted font is a little machine for automating bitmap production. So a hinting UI that is basically a bitmap editor would defeat the purpose for which TT hinting was invented.</p>
    html_clean: <p>The whole point of TrueType hinting is to use an instruction set to control rasterisation because editing bitmaps by one-by-one takes too long. A hinted font is a little machine for automating bitmap production. So a hinting UI that is basically a bitmap editor would defeat the purpose for which TT hinting was invented.</p>
