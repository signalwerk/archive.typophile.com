    html: |-
      <p>Yes, hinting is defining repetitive rules so that most individual cases are solved automatically, plus adding some exceptions to precisely control how some (few) individual cases are solved. Editing bitmaps is solving all the individual cases one-by-one. You can still do it — right there, in FontLab Studio, by editing the embedded bitmaps. </p>
      <p>But if you edit the bitmaps, you just do this: edit a black-and-white pixel matrix for monochrome rendering devices. With hinting, you do much more: you establish rules how a glyph should behave in various rendering situations: different color modes, different point sizes, different resolutions. </p>
      <p>In other words, when you're hinting, you're making decisions about multiple outputs for each glyph at once. A user interface where you turn pixels on and off would not work because in such a user interface, you only make decisions for one output at a time. But again, you can do this — through embedded bitmaps. </p>
      <p>Best,<br>
      Adam</p>
