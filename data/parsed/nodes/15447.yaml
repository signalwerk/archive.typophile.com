      <p>The classification explanations are wrong in relation to their headings. (The actual explanations are right but, for example, the transitional explanation comes under the title ’slab serif’). One error in the sans serif classification where you seem to imply that sans serifs didn’t exist untill the Bauhaus. </p>
      <p>The site in general looks good and useful, but I don’t like the into. But that is not just your intro as i hate all flash intros. </p>
      <p>Phil</p>
