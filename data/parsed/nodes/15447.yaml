    <p>Anyone know who’s in charge of <a href="http://counterspace.motivo.com/">Counterspace</a> (<a href="http://counterspace.motivo.com" title="http://counterspace.motivo.com">http://counterspace.motivo.com</a>)? The site seems to be down right now, just as we’ve reached the “Intro to Typography” portion of the class I teach. I’ve meant for a while to contact the Counterspace folks to see if I could host a mirror of the site as I know it goes down from time to time. It’s a great site for my students, but I’m at a bit of loss at the moment as I’ve directed them to use Counterspace as a study tool and, well, it’s suddenly unavailable.</p>
    <p>So, back to my question. Anyone know who runs Counterspace?</p>
    <p>Jason</p>
