    <p>I'm looking for any recommendations on what type I should use for a personal blog logo. The logo should give the impression of a thought leader within the business sector and be able to build instant credibility. I need my name and tagline as the main focus of the logo. I want something that is simple yet powerful and can be used on my blog and social media profiles.</p>
    <p>Here is a rough concept I've done just to work out a layout. If I can get some thoughts on type I can then play around with it some more and get the spacing of everything right. I'm not a graphic designer but typography interests me and it's something I've been reading about and learning lately.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/SMlogo_5233.png"></div><p></p>
