      <p>@shanemackintosh: Good design is about making informed decisions and fitness for purpose. To assist people in providing you with more insightful feedback as opposed to subjective aesthetics, some questions:</p>
      <p>1. What do you do?<br>
      2. Who are your clients?<br>
      3. Who would you <em>like</em> your clients to eventually be?<br>
      4. Who is your competition?<br>
      5. What is your hourly rate? (a designer with 20 years of experience will probably go for about $100/hr+)</p>
      <p>From an aesthetic perspective, if you can get your hands on a copy of Robert Bringhurst’s “The Elements of Typographic Style” you’ll find yourself way ahead of the pack.</p>
