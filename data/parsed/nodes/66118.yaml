      <p>Hi, Rickard. I joined typophile about a year ago but I don't usually post, I lurk and keep my opinions to myself, but welcome.</p>
      <p>Looking at your mark, I do enjoy the RL ligature in both the red and the gray. However, the rest of your name is awkwardly placed. There is a huge disconnect between the first letter and the rest of your name, so that you can't read it. If I were you I would take it out completely or set it beneath the mark. I don't think the logotype is too simple, nor does it need a background.</p>
