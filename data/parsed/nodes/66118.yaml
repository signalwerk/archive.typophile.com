    <p>Hello! My name is Rickard and this is my first post here at typohile. I'm excited to join this forum, not only to observe but also to learn more about the world of typography! </p>
    <p>I am from Sweden so please bare in mind my fairly incomplete language skills.</p>
    <p>I this a good start on the forum is to show a thing that I have done and with some luck get one good thought or two from you guys. I am talking about my very own logotype for my name, also soon to be my website and all-around self-brand. </p>
    <p>Take a look and tell me what you think. I was aiming for a sleek and rather elegant feel. Also I tried to have complexity in mind and avoid to advanced techniques. As you see it's rather simple. Too simple maybe? Does it need a background?</p>
    <p>Thanks in Advance!</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/geo%20sans%20logotyp%20RL_0.jpg" width="400" height="245" alt="">
