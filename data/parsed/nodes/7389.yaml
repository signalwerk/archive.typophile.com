    html: <p>Erik, <br> <br>It's always great to see a real pro chiming in here from time to time! <br> <br>I'm a sucker for the rounded terminals, although I wonder if it's almost too cute at times. We'll have to see what the eventual shelf life of it is.  <br> <br>Great work, as usual, on the Bosch typface...</p>
