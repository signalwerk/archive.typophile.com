    date_raw: 30 Oct 2004 — 7:02am
    date: 2004-10-30T07:02:00
    votes: null
    html: "<p>I don't care for rounded terminals at all. And I find the GE-font rather too \"artsy\" and fashionable. Reading longer texts in smaller sizes will make you feel that you need to visit an optician. <br>On the other hand, I think Mr Spiekerman's new creation is an an excellent take on the classic Grotesk. I'd use it in a whif instead of the poor digitizations of Franklin and Akzidenz that are commonly available. <br>BTW: the imagination3 site is wonderful!</p>"
