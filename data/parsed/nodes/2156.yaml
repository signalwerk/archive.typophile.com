    votes: null
    html: <p>Mark,  <br>I just  found a site (<a href="http://www.incipit.com/typefaces.html" target="_blank"> Incipit</a>) that says they have a photocomposition (film type) library of 3,500 faces, including the 4 Pistilli faces. A quick glance at their type catalog listing shows a lot of the Phil's Photo typefaces alive and well in that collection. Makes you wish you had your own Typositor doesn't it?</p>
