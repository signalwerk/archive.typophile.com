    html: <p>I don’t know much about it, but I don’t think it’s from any  <br>earlier than the late 1960s. I can tell you that it was a <span class="caps">VGC</span>  <br>font designed by John Pistilli and that it came in three basic  <br>weights—normal, bold, and black. The weights appear to  <br>refer mainly to the thickness of the hairlines, sort of like  <br>optical scaling. There were two other styles—Open No. 1  <br>and Open No. 2—which only diﬀered in stroke&nbsp;thickness.</p>
    html_clean: <p>I don’t know much about it, but I don’t think it’s from any  <br>earlier than the late 1960s. I can tell you that it was a <span class="caps">VGC</span>  <br>font designed by John Pistilli and that it came in three basic  <br>weights—normal, bold, and black. The weights appear to  <br>refer mainly to the thickness of the hairlines, sort of like  <br>optical scaling. There were two other styles—Open No. 1  <br>and Open No. 2—which only diﬀered in stroke&nbsp;thickness.</p>
