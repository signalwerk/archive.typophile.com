    user_image: /files/pictures/picture-1043.jpg
    date_raw: 25 Nov 2003 — 7:28am
    date: 2003-11-25T07:28:00
    votes: null
    html: <p>I've always thought those dividers were a nice touch.  <br> <br>There's one photo in there that gets to me now. It's the one  <br>for "T" which is from the giant letters for The Big Kitchen  <br>which used to be at the top of one of the WTC towers. It  <br>was designed by Milton Glaser and I always thought it was a  <br>neat thing. I'm sure it was long gone by the time of the  <br>attacks, but seeing it now reminds me of everthing thing  <br>that's happened since. You never know what you'll find in a  <br>type specimen book.</p>
