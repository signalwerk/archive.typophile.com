    html: <p>Yeah, I found that site a while back, too. Looks like they  <br>have all of them. <br> <br>I actually have a dozen old Typositor reels with 60 or so <br>faces on them. They used to belong to the University of  <br>Minnesota's Journalism School. I grabbed them when they  <br>were going to be thrown out. No Typositor, though. <br> <br>I wanted very badly for a while to have a Typositor in-house  <br>when I was a magazine art director early in my career, but  <br>they were not cheap and we could never justify the cost. </p>
