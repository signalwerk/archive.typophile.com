  html: <p>Hi all, <br> <br>Here's a font that's been vexing me for ages. I only have a scan from a fax copy and want to improve it somewhat. <br> <br>Looks like a form of Bodoni or Century 725 Black from the Corel disk... but the killer is the ampersand (the &amp;). <br> <br>Any ideas? Thanks in advance.<img src="http://www.typophile.com/forums/messages/83/20934.gif" alt="House &amp; Garden logo"></p>
