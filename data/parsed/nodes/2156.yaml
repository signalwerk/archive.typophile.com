    html: <p>Huh! I didn't realize it was published as a book. I always  <br>assumed that everyone had a copy like mine. In addition to  <br>the coupon and receipt in the back pocket, it also has a  <br>credit application and price list. It's loose-bound in a  <br>three-ring binder, so it's easy to take the pages out. The  <br>three indexes in the front are saddle-stitched separately  <br>and bound in with the other pages. A fairly elaborate  <br>package, actually.</p>
