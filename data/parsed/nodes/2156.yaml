    html: <p>The Phil’s Photo “Homage to the Alphabet” is indeed a treasure. The ﬁrst edition in a 3-ring binder is beautiful, and is deﬁnitely a collector’s item. When I still worked at Phil’s a couple of years go, they had a small stash left of the ﬁrst edition. If I recall correctly, they were selling for around $150 each, and there may be a few copies left. Yes, it’s more than the later paperback editions you can ﬁnd second-hand, but the original is just wonderful. I highly recommend it as a Christmas gift (to yourself). <br><br><a href="https://web.archive.org/web/20191001185933/http://www.philsfonts.com/" target="_blank">www.philsfonts.com</a> <br><br>And no, I am no longer aﬃliated with Phil’s Fonts in any way, I just want everyone to have the joy of owning this book if&nbsp;possible.</p>
    html_clean: <p>The Phil’s Photo “Homage to the Alphabet” is indeed a treasure. The ﬁrst edition in a 3-ring binder is beautiful, and is deﬁnitely a collector’s item. When I still worked at Phil’s a couple of years go, they had a small stash left of the ﬁrst edition. If I recall correctly, they were selling for around $150 each, and there may be a few copies left. Yes, it’s more than the later paperback editions you can ﬁnd second-hand, but the original is just wonderful. I highly recommend it as a Christmas gift (to yourself). <br><br><a href="https://web.archive.org/web/20191001185933/http://www.philsfonts.com/" target="_blank" class="link-external">www.philsfonts.com</a> <br><br>And no, I am no longer aﬃliated with Phil’s Fonts in any way, I just want everyone to have the joy of owning this book if&nbsp;possible.</p>
