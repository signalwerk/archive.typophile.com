    html: "<p>Hey, I don't pick 'em. The fact is, the Phil's book has some  <br>of the best samples, and it's fairly comprehensive as of  <br>about 1980 for old film fonts. Other books have a broader  <br>sampling, but poorer showings. Mine is #573. I still have  <br>the receipt for $48 (plus $3 shipping).</p>"
  - id: 17048
    user_id: 2088
    user_name: bowfinpw
    user_path: null
    user_image: /files/pictures/picture-2088.gif
    date_raw: 21 Nov 2003 — 6:38am
    date: 2003-11-21T06:38:00
    votes: null
    html: "<p>What I find most useful is having the groupings of fonts by Categories, such as Ultra Bold (where Pistilli showed up &amp; Egiziano too, from another post), and especially by Serif type. Very Handy. I have a Second Edition version with a $39.95  sticker still on the back. What do you mean that yours is #573?</p>"
