    user_path: null
    user_image: /files/pictures/picture-1043.jpg
    date_raw: 21 Nov 2003 — 1:28pm
    date: 2003-11-21T13:28:00
    votes: null
    html: <p>The inside front cover (it's in a 3-ring binder) has a sticker  <br>with my name written in and the number "573/2500" which  <br>(I assume) means it's number 573 of a run of 2500. There's  <br>also a coupon in the back to put the cost of the book  <br>toward the first job I might send to them. I don't know if  <br>you remember, but typesetters usually kept track of who  <br>had their catalogs for marketing purposes. Those things  <br>weren't cheap to produce, I'm sure.</p>
