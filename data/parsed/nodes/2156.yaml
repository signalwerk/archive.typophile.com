    user_image: /files/pictures/picture-107.png
    date_raw: 21 Nov 2003 — 7:36pm
    date: 2003-11-21T19:36:00
    votes: null
    html: <p>The Phil's Photo "Homage to the Alphabet" is indeed a treasure. The first edition in a 3-ring binder is beautiful, and is definitely a collector's item. When I still worked at Phil's a couple of years go, they had a small stash left of the first edition. If I recall correctly, they were selling for around $150 each, and there may be a few copies left. Yes, it's more than the later paperback editions you can find second-hand, but the original is just wonderful. I highly recommend it as a Christmas gift (to yourself). <br> <br><a href="http://www.philsfonts.com" target="_blank">www.philsfonts.com</a> <br> <br>And no, I am no longer affiliated with Phil's Fonts in any way, I just want everyone to have the joy of owning this book if possible.</p>
