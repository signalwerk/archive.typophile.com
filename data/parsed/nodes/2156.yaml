    html: <p>The designer was indeed James Hellmuth. He did 99% of the design work for Phil's Photo. Very talanted guy. I've been out of touch with him for years.  <br> <br>By the way the catalog ,"Homage", is the first instance I can recall that has a "found typography" or what ever you want to call it. Photos of type in everyday use separate each alphabetical section.  <br> <br></p>
