      <p>Hi Titus,</p>
      <p>Martin Tiefenthaler mentioned that one of his students<br>
      is considering to do an MA in Typeface design in Reading<br>
      – I suppose you’re that guy. I did the course in 2003–04.<br>
      If you want to contact me, please feel free to do so:<br>
      <a href="mailto:w.homola@gmx.net">w.homola@gmx.net</a></p>
      <p>I stayed in Hillside – it was ok.<br>
      Try to avoid the undergraduate student halls.<br>
      Sadly, life in UK isn’t as cheap as in Austria:<br>
      You should multiply your living costs in Vienna by 2 or 2.5<br>
      to get a realistic idea.</p>
      <p>As for the reading list: There are titles<br>
      which are important for the academic writing part<br>
      and some which may actually help you for your practical.</p>
      <p>I would suggest that you start with Walter Tracy: Letters of credit,<br>
      carry on with Fred Smeijers: Counterpunch<br>
      and Richard Southall: Printer’s type in the twentieth century.<br>
      Read also John D. Berry: Language Culture Type.<br>
      If you want some advice on academic writing, have a look at<br>
      Umberto Eco: Wie man eine wissenschaftliche Abschlussarbeit schreibt.</p>
      <p>Other books that might be useful are<br>
      Noordzij: The stroke of the pen<br>
      Harry Carter: A view of early typography<br>
      If you’re interested in Arabic type, probably also:<br>
      Huda Smitshuijzen AbiFaries: Arabic typography</p>
      <p>Have also a look at:<br>
      John Hudson: Windows Glyph Processing. An OpenType Primer<br>
      at<br>
      <a href="http://www.microsoft.com/typography/Glyph%20Processing/intro.mspx" title="http://www.microsoft.com/typography/Glyph%20Processing/intro.mspx">http://www.microsoft.com/typography/Glyph%20Processing/intro.mspx</a></p>
      <p>And: enjoy the course! I am sure you’ll like it.</p>
      <p>Wolfgang</p>
