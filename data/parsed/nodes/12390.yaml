      <p>If you decide for one of the University's Halls, don't make the mistake of choosing a fully-catered room. Not only it is twice the price of a self-catered one, but also because the food choice is not worth of the difference (too much fried food for someone used to good fresh fish, like me).<br>
      Besides, you would have to follow their very strickt mealtimes, and find yourself wasting money on meals that you couldn't "attend", or running back and forth to the department/hall to be on time for lectures/meals (and I'm not even accounting the queueing time...).</p>
      <p>I'm staying in Bridges, right next to the department, in a self-catered room and I quite like it. The JCR (Junior Common Room) fee, that every student has to pay (40 pounds/year), covers for lots of things you can use and do, including tennis court, pool table, TV room with cable channels, music room, computer room, newspappers, DVD movie nights, bar quiz, karaoke, etc.<br>
      ASDA, a big supermarket, is not far. It's also very cheap, and groceries for a whole week (breakfast, lunch and supper everyday) hardly cost over 25 pounds.<br>
      The kitchen is fully equipped with 2 stoves (with oven), fridge, freezer, microwave, toaster, boiler, cutlery, crockery and individual cupboards.<br>
      The floor is shared by 12 students, mainly post-graduates. We also have a (very nice and friendly) cleaning lady that comes 4 times a week, to do the kitchen and bathroom.</p>
      <p>That's about it!</p>
      <p>PS: In addition, this year's students are leaving a pair of top-notch tennis rackets as the legacy ;)</p>
