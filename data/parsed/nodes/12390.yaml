      <p>I stayed in Sherfield and it was great. It is generally accepted as the best at Reading but the priciest. Still, I found it worth the extra money. It is self catering, and it has a computer room (you won't find internet connection in the rooms except via dial up).  The Junior Common Room is great with lots of nice activities (quiz night, pub crawl, xmas dinners...) and the rooms are ok. Also, we had cleaners come and clean our rooms once a week, and the kitchen everry weekday. Seeing the long reading list you have to go through, you wouldn't want to waste time cleaning your room.</p>
      <p>Also, the way it is situated, you get lots of socializing happening in the kitchen that you share with 7 other people. I had amazing friends there...</p>
      <p>It is 25 minutes walk away from the typography department. 40 minutes from the town center. Not so convenient but it's worth it. Still, it was close to the sports center on campus (8 minutes). It is around 1.5 hours away from St. Brides in London where you will be spending a lot of time...</p>
      <p>A very popular restaurant is Katmandu Kitchen on Christchurch. Ask for the Chicken Dry Fry with Pilau rice and Pashwari naan. mmmm.</p>
      <p>Since you are staying for 2 years, you might want to first stay in a Hall (definitely self catering though) and to move out later. </p>
      <p>Best of luck for next year... I am jealous :)</p>
      <p>By the way, an amazing book is Creative Lettering Today by Michael Harvey. I would start reading there. Type Sign Symbol is a good start. Also, Gerry's recommendation to me as a first book to read was Counterpunch. All good books. Enjoy... Last time I checked the list was 7 pages long.</p>
      <p>Hint: learn how to properly type set a bibliography, it will come in handy. Also, would be good to start practicing with a broad nib to get the feel of letters.</p>
