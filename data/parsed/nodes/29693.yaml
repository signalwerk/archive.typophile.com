      <p>That Bobby Mcferrin cover certainly looks like a golden section grid in the background although the elements of type don't seem to bear much relation to the grid. From the samples you posted I thought you might enjoy this gallery of <a href="http://www.fedge.net/~desiderata/4ad20.html">4AD covers</a>. My opinion is that the golden section doesn't fit in with the format of a cd cover too well and that you are probably best developing your own grid and creating a hierarchy for the information.<br>
      Tim</p>
