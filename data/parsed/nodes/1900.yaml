    html: '<p>For period reference and inspiration try:  <br> <br>AD Access (over 7,000 advertisements printed in U.S. and Canadian newspapers and magazines between 1911 and 1955) at <a href="http://scriptorium.lib.duke.edu/adaccess/" target="_blank">http://scriptorium.lib.duke.edu/adaccess/</a>  <br> <br>or  <br> <br>The Emergence of Advertising in America: 1850 - 1920 (Presents over 9,000 images, with database information, relating to the early history of advertising in the United States) at <a href="http://scriptorium.lib.duke.edu/eaa/" target="_blank">http://scriptorium.lib.duke.edu/eaa/</a>  <br></p>'
