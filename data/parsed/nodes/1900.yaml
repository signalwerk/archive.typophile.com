    html: <p>I don't know where you are situated Troy, but here in Toronto (pop. 2 mil.) we have a number of stores that trade and sell old magazines, comic-books, paper ephemera. And a sub-culture of collectors and dealers, with bi-annual "Old Paper Show and Sale". Antique stores often have old magazines. The magazines are not expensive. <br> <br>I would imagine that things are the same in most big cities. <br> <br>So I would recommend rummaging, with a copy of McGrew's "American Metal typefaces of the Twentieth century" (Oak Knoll) to identify the faces in the publications.</p>
