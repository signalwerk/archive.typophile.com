    html: "<p>Troy <br> <br>Probably the best place to look would be the various trade journals (on printing) that were available at about this time: Inland Printer, British Printer, The Graphic Arts, The American Printer, etc. Most major University library collections would carry these. <br> <br>These are very useful in seeing how things changed from decade to decade, especially in regard to typeface offerings. The late 20s and the early 30s are the heydays typographically,but some very interesting, and unsual, typeface entries can be found from the late 1890s up into the 20s. <br> <br>Gerald</p>"
