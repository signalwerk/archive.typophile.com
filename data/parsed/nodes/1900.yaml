  html: "<p>I am interested in design / type styles of the first two decades of the twentieth century: 1900-1919. What I'm looking for, specifically, are designs that are not Arts &amp; Crafts or Art Nouveau, but more of a general commercial vernacular from this era (advertisements, logos, signage, package designs, etc.) <br> <br>It seems that the design history books I have are pretty thin on this period, especially regarding things that don't fit into a larger movement (such as Arts &amp; Crafts, Deco--which I know came later, and so on). <br> <br>I've done a search on MyFonts.com, and found some good type examples, but I'd also like to see more full-blown designs of type in use.  <br> <br>Does anyone have any suggestions of books or other resources I could try? <br> <br>Thanks for any help, <br> <br>Troy</p>"
  html_clean: "<p>I am interested in design / type styles of the first two decades of the twentieth century: 1900-1919. What I'm looking for, specifically, are designs that are not Arts &amp; Crafts or Art Nouveau, but more of a general commercial vernacular from this era (advertisements, logos, signage, package designs, etc.) <br> <br>It seems that the design history books I have are pretty thin on this period, especially regarding things that don't fit into a larger movement (such as Arts &amp; Crafts, Deco--which I know came later, and so on). <br> <br>I've done a search on MyFonts.com, and found some good type examples, but I'd also like to see more full-blown designs of type in use.  <br> <br>Does anyone have any suggestions of books or other resources I could try? <br> <br>Thanks for any help, <br> <br>Troy</p>"
