      <p>FWIW, according to Ladislas Mandel a smallish x-height leads to more authentic French text.</p>
      <p>As Joshua says it's tricky to find two serif fonts that harmonize. So this is actually a good opportunity to plug one of mine! Nour&amp;Patria, a "two-pronged" system with all its components in visual harmony:<br>
      <a href="http://granshan.org/works/2008/hrant.pdf" title="http://granshan.org/works/2008/hrant.pdf">http://granshan.org/works/2008/hrant.pdf</a><br>
      You could use Patria's Italic (or Roman) for the English and Nour's Latin subordinate for the French.<br>
      <a href="http://www.themicrofoundry.com/other/nour&amp;patria/dev/patria-italic.gif" title="http://www.themicrofoundry.com/other/nour&amp;patria/dev/patria-italic.gif">http://www.themicrofoundry.com/other/nour&amp;patria/dev/patria-italic.gif</a><br>
      <a href="http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif" title="http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif">http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif</a></p>
      <p>hhp</p>
