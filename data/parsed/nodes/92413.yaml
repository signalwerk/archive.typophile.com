    <p>Hi Everyone,</p>
    <p>Im looking to buy 2 new typefaces for this project i'm working on.<br>
    Its an 18 page pocket poetry book, eacht poem is set in 2 languages, one is English the other is French.</p>
    <p>The period when the poems were originally written in was between 1914 and 1922. I was looking for a separate font for the titles and for the poem itself.</p>
    <p>Preferably i'd like to go for a serif. </p>
    <p>All tips...suggestions are more than welcome. i'd really appreciate all help lady's and gents.</p>
