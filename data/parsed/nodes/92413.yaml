      <p>Hi Joshua, thank you for replying,</p>
      <p>The poems are written by James Joyce, its hard to pin down to a unifying theme, but i guess it all boils down to "life and death, emotion or the lack of emotion"</p>
      <p>Poems are between 9 and 15 lines, and approximately 4-6 words on a line </p>
      <p>I would like to have it a bit contemporary but with a bit of a twist (no Caslon...etc.</p>
      <p>Mixing two serifs is not a must, at first i thought about giving the titles a different face, or maybe give the French translation of the poem a different face than the English version.</p>
      <p>When the book is open, left page has the English version on it, right page has the French version so its important that they work nice next to each other.</p>
      <p>It must not be a serif but for the french i'd prefer a serif. But i'm open for all suggestions</p>
      <p>Hope this info helps a bit.</p>
