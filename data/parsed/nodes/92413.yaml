      <p>I'll start with my standard response to "what's a good font for a poem/resume/invitation/article?" — which is, "What's it about?"</p>
      <p>Is there any unifying theme other than the date range? Who are the poems by? What kind of mood do you want to set? How long are the poems?</p>
      <p>Mixing two serifs is a bit tricky. Must the titles use a different face? Must that face be a serif?</p>
