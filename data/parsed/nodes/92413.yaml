      <p>Evie – The appropriate typeface will depend on the poems themselves. I wouldn't worry too much about the historical period (either of the poems or of the type) but I would give a lot of thought to what you'd want the poems to look like when you read them yourself. Any book design grows out the experience of being a book reader.</p>
      <p>One typeface I've used a lot (and which is now available in OpenType format with an extended range) is Mark van Bronkhorst's MVB Verdigris. The italic is very distinctive and readable in its own right, and at large sizes can make an excellent title face. (Mark has recently released a new display version, in roman only, for large sizes; that would be another possible approach.) I've used the roman for several books. I don't think it would be inappropriate for Joyce, though that is a judgment call that you'll have to make for yourself.</p>
