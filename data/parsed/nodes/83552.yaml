    <p>New to this forum and generally a neophyte when it comes to typeface. (I understand and agree with the general rule against Comic Sans; I also cringe at the commercial use of Tempus Sans and Papyrus.) I'm looking for advice for a tattoo I'm planning on getting. It's a quotation from Dickens' "Great Expectations." I'm trying to decide whether to use a typeface similar to whatever was in use at the time of the book's publication in serial form, or go in another direction.</p>
    <p>The full quote: "We changed again, and yet again, and it was now too late and too far to go back, and I went on. And the mists had all solemnly risen now, and the world lay spread before me." I'll probably only use the last bit, "and the world lay spread before me".</p>
    <p>Any thoughts (keeping in mind, of course, that this will be tattooed on my body)?</p>
