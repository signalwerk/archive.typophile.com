      <p>I think it's important to determine which body part it will end up on. Concerning which, I have an idea: instead of laying down only the last few words, find a body part that can show those last words to good effect, but can somehow "open up" to reveal the complete quote, for those interested.</p>
      <p>And about historical accuracy: it depends how important it is to secretly satisfy yourself with such "inside information", because virtually nobody will be able to make the connection.</p>
      <p>hhp</p>
