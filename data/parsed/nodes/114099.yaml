    votes: null
    html: |-
      <p>What kind of project is it? A book, a magazine, a poster, a website, Powerpoint slides? Are you looking for a text font that would work with Goudy Old Style headers, or are you picking type for other kinds of headers, captions, tables, lists, etc.?<br>
      90 of Frederic Goudy’s typefaces were issued, and many have been digitized. You might start by looking at other Goudy faces.</p>
  - id: 571218
    user: 217579
    date: 2014-02-11T19:00:00
    date_raw: 11 Feb 2014 — 7:00pm
    votes: null
    html: <p>Im actually redesigning my resume. Goudy Old Style is the main header font, and the body font. I was looking for another font to head the sub categories, right now I am going with Antonio. I perused the myriad of other Goudy fonts but didn't fall in love with any for the look I am going for. Thank you for the good advice though.</p>
