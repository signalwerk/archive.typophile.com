      <p>Omar,<br>
      Use the rotate feature and type in whatever number of degrees you want. You can also make some components that are triangles of the desired degrees and mirror and rotate them as needed. You can copy and paste the parts from glyph to glyph.</p>
      <p>ChrisL</p>
