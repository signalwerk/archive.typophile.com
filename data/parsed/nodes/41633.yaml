    <p>hello everybody, </p>
    <p>i'm just starting out using fontlab, on the recomandation of a few nice people here i ordered the "lessie cabarga / learn fontlab fast" book but haven't received it yet.</p>
    <p>in the meantime i'm hoping someone here can help me out with a lilt problem i'm having in fontlab, maybe its a stupid question but i can't seem to figure it out for myself.</p>
    <p>problem 1: </p>
    <p>the font i'm making has lots of slant lines, but how do i make every slant line have the exact same angle degree? what function in font lab do i use to make sure everything has the exact same angle degree..width..</p>
    <p>i have posted a screenshot maybe that clears out my question a bit.</p>
