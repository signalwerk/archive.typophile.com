    html: |-
      <p>First and most important — as it has been pointed out e.g. <a href="http://typophile.com/node/57993" rel="nofollow">here on Typophile</a> — the two main Apple patents on TrueType hinting expired six months ago. </p>
      <p>The U.S. patent <a href="http://www.google.com/patents/about?id=B58bAAAAEBAJ" rel="nofollow">5155805</a> (“Method and apparatus for moving control points in displaying digital typeface on raster output devices”) was filed on May 8, 1989 and issued on October 13, 1992, and it expired on October 13, 2009. </p>
      <p>The U.S. patent <a href="http://www.google.com/patents/about?id=lk4hAAAAEBAJ" rel="nofollow">5159668</a> (same title) was filed on May 8, 1989 and issued on October 27, 1992, and it expired on October 27, 2009. </p>
      <p>The U.S. patent <a href="http://www.google.com/patents/about?id=rTEhAAAAEBAJ" rel="nofollow">5325479</a> was filed on May 28, 1992 and issued on June 28, 1994. It is likely to expire on May 28, 2012. However, this was the second filing of the same patent as 5155805, and the first one was granted only after the second filing was done. As far as I understand, the term of expiration of the very first (oldest) filing counts. </p>
      <p>So it can be assumed that all the relevant patents have expired now. </p>
      <p>Second, patents typically describe a “method and apparatus for something”. The patents in question did not describe a particular arrangement of software programming instructions that would be the “method and apparatus”. The patented “method and apparatus” was, simply speaking, the TrueType instructions programming language (or aspects of how it works). In other words, the interpreter, not any particular code that should be interpreted, was patented. </p>
      <p>Writing instructions for the interpreter did not infringe the patents. Writing an interpreter that would execute those instructions did. </p>
      <p>But as I said, those patents expired now, so the discussion about myths is kind of moot :)</p>
      <p>Best,<br>
      Adam</p>
