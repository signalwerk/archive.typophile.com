    html: |-
      <p>Hello Tim,</p>
      <p>FontLab can't decompile TT instructions from generated TTF fonts. If you do TrueType hinting in FontLab you destroy the existing (binary) instructions. If you want to see something like the picture above you have to apply (PostScript) autohinting and convert this to TT instructions.</p>
      <p>The kind of TT instructions is indicated as icon in the font window. If you see a blue 'T' in the lower left corner you have binary instructions which can't be edited. A yellow 'T' indicates visible and editable TT instructions.</p>
      <p>Eigi</p>
