      <p>That would be 20 year-old hinting.</p>
      <p>&gt;...it's all just numbers</p>
      <p>True, but there is no choice in a binary program;) </p>
      <p>The tricks are really to know first how the tables interact, technically, that you are looking at a well-maintained graphics state and a good stack of glyph instructions, and finally knowing what the instructions are trying generally to do typographically. That helps a lot to make the numbers go away.</p>
      <p>You can decompile TT and find out which value, e.g. in the cvt table, stands for what, if you have a font that you know works, as opposed perhaps to absolutely, like if you gave it garbage to figure out.</p>
      <p>Cheers!</p>
