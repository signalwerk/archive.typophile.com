    html: |-
      <p>The visual TrueType instructions in FontLab Studio (or VTT) are kind of like source code, while the binary TrueType instructions in a TTF font are, well, like binary code. You can decompile the binary into assembly code (e.g. using TTX) but it's not at all trivial to decompile into the visual source code, especially since the source code in FontLab Studio provides a particular set of functions that does not necessarily represent all of situations that you can code using the TrueType assembly. </p>
      <p>Unlike, say, the syntax that is used in OpenType Layout tables (GPOS, GSUB) -- which is a very simple language and is actually more like data than like programming code -- the TrueType assembly language is a real programming language in which, for example, you have GOTO-like jumps. </p>
      <p>FontForge has a TrueType instruction debugger that lets you step through the native TrueType instructions and watch how the outline gets modified by the TT instruction code.</p>
