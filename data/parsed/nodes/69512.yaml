      <p>With <a href="http://www.macports.org/" rel="nofollow"><strong>Macports</strong></a> you can install a version of fontforge with the truetype instruction debugger by typing the following commands in a terminal window (the % being the prompt, they are not part of the command)</p>
      <p><code>% sudo port install freetype +bytecode<br>
      % sudo port install fontforge +with_freetype_bytecode</code></p>
      <p>The installation took about 8 minutes on my MacBook pro since I already have all the libraries on which fontforge depends. Else those libraries will be fetched, compiled and installed, and  that requires much more time (and patience).</p>
