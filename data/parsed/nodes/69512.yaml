      <p>@Richard Fink</p>
      <p>The Fontforge executable from the <a href="http://fontforge.sourceforge.net/" rel="nofollow"><strong>Fontforge site</strong></a> installed in seconds on my mini with OS X 10.6 but it is without the truetype debugger. </p>
      <p>The <a href="http://www.geocities.jp/meir000/fontforge/" rel="nofollow"><strong>Unofficial FontForge-mingw</strong></a> also installed in seconds on a version of Windows without frills (no cygwin, nothing) and <strong>has</strong> the debugger.</p>
      <p>To get a mac version with the debugger, you need to compile from the Fontforge and Freetype sources. For the freetype sources, you follow the instructions in the file <code>freetype-2.3.12/docs/TRUETYPE</code>, compile and install. Then you <a href="http://fontforge.sourceforge.net/source-build.html" rel="nofollow"><strong>build from the FontForge sources</strong></a> (better use the --with-freetype-src=dir configure option, else configure wastes a lot of time searching for the freetype sources) and install. That takes about fifteen minutes, provided pango, cairo etc are already installed. So, for someone that just wants to look at the debugger, fontforge-mingw looks like the best choice.</p>
      <p>As for the more general question concerning the "Linux box", to avoid disturbing too much the mood of this thread I started a new one <a href="http://typophile.com/node/69653" rel="nofollow"><strong>here</strong></a>.</p>
      <p>Michel</p>
