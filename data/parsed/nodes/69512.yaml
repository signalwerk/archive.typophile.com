      <p>John Hudson, </p>
      <p>I have read Freetype's wail several times now. It says incorrectly among many misrepresentations, "It is important to understand that the patents do not prevent anyone from reading, converting or generating TrueType fonts. <strong>As they only concern the subtle art of hinting TrueType glyphs."</strong></p>
      <p>And I said: Academic myth. Professionally, I have never licensed anything from Apple and I've written any kind of instruction for anyone I've wanted, and that situation just turned 21.</p>
      <p>Then you said: "As I understand it, the concern about the Apple patents relates to the FreeType rasteriser, not to fonts."</p>
      <p>Then I said: "There are no patents or legal issues stopping me from writing a TrueType rasteriser, which I'm not saying I've done or not done."</p>
      <p>Then you pointed back to the BS myth making at Freetype. </p>
      <p>There, the image of the ugly diagonals in a font hinted by mistake, according to legend, gets trotted out to scare the bejeezus out of anyone wanting to make web fonts that swing. It's myth. </p>
      <p>Then TerminalDesign came and sang the plague song. Then Vinnie came to save us all from darkness.</p>
      <p>And now the future happened.</p>
      <p>Cheers!</p>
