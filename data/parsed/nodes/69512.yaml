      <p>Let me add to what Eigi wrote that there are probably two reasons why existing TT instructions cannot be imported and edited in FLS:</p>
      <ol>
      <li>FontLab Studio supports only a subset of the TT instruction set</li>
      <li>It's not trivial (or possible at all) to decompile TT instruction programs and find out which value, e.g. in the cvt table, stands for what, because it's all just numbers ;)</li>
      </ol>
      <p>You can however decompile TT instructions using ttx on a font, but then you would see the raw instruction code and not a visual representation like in FLS.</p>
    html_clean: |-
