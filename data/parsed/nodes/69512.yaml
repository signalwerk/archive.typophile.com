    html: |-
      <p>The TT instructions you are looking at is just like a stack crawl. </p>
      <p>The numbers you see are the point numbers, cvts, or other numeric values that are pushed onto the stack first then what follows are the instructions that use (or pop) these values. The MDAP is what is commonly called an Anchor and the MIRP is what could be called a link. </p>
      <p>If the MDAP is the first instruction that pops values it will take the first value (which is probably a 1 for 'round the value'). It also pops the next value which will be the outline point number. It does not push anything back on the stack so the third value is now at the top of the stack.</p>
      <p>The TrueType specification (originally from Apple) explains what each instructions does and what the Boolean values are for.</p>
