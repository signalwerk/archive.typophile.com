      <p>Note that while FontForge gives you a visual representation of what's happening due to hinting, it is still decompiling into assembly code. Those MIRPs and MDAPs are the native TrueType instructions.</p>
      <p>Of the people in the world who do serious, high-end TrueType hinting, I'll bet less than 10% are at all fluent in TT assembly code. Sure, folks like Rickner or Bosma are, but most... not so much.</p>
      <p>I would expect that learning TT assembly code is likely easier if one starts with a tool that works in a higher-level language, and compiles that to TT assembly which you can then inspect. Microsoft's Visual TrueType, for example, will show you those MIRPs and MDAPs, but allows you to work at a higher level as well. Maybe it's because I already know a couple of higher-level TT hinting tools, but it seems to me that would be a much easier approach to learning the low level stuff.</p>
      <p>Regards,</p>
      <p>T</p>
