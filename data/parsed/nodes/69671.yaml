      <p>All the above. But I'll especially reiterate the advice to finish the spacing before you start kerning. And after you *think* you've finished, work with it for at least several weeks before you let yourself kern. Seriously, this is probably the advice that will save you the second greatest amount of grief ever in type design.</p>
      <p>(The greatest amount of grief to be saved is by never even attempting type design in the first place. It is simply a craft that is full of frustrations. But of much job as well.)</p>
      <p>Cheers,</p>
      <p>T</p>
