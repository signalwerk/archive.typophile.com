      <p>I accidentally bumped this old thread. Sorry. I do know how to space and kern, and at least the Roman Regular looks acceptable today (unkerned). The other five weights I'll take care of this week.</p>
      <p>And for the record, iKern doesn't do kerning without spacing (how would an algorithm do that, anyway?). AFAIK it finds good letter-to-letter distances, sets the side bearings and then fills in kerning values for the combinations that don't fit.</p>
      <p>Of course, it's hard to judge the quality of the letters in an unspaced font. Point taken.</p>
      <p><em>Or is this one of those open-source things where if the users want it finished they have to do it themselves?</em></p>
      <p>That hurt. I hope not.</p>
      <p>Jan, thanks for that! I'll put in on my to-read list!</p>
