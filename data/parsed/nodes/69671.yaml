    <p>So how do you do it right—and I mean right from the start? Is there a special order in which you start spacing? Are there percentage guidelines for average space between stems/bowls? Can you point me to software to help me do it (I'm running FontForge on Ubuntu)?</p>
    <p>I appreciate your support!</p>
