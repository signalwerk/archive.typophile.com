    <p>Good evening,</p>
    <p>I'm finally working on my first typeface! Yay. It's a conservative, old-style text serif and it will look like <a href="http://aldusleaf.org/" rel="nofollow">this</a>. It'll be an open source project that I work on in my free time.</p>
    <p>Since I have no typographic education whatsoever (I'm an engineering freshman straight out of highschool with a type addiction), I need some help: how do I space letters horizontally? I just finished the lowercase letters and I already spend most of my time changing side bearings and kernings instead of drawing letters. That is annoying and frustrating. It's a constant shifting of letters back and forth, and I never seem to get the spacing quite even.</p>
    <p>So how do you do it right—and I mean right from the start? Is there a special order in which you start spacing? Are there percentage guidelines for average space between stems/bowls? Can you point me to software to help me do it (I'm running FontForge on Ubuntu)?</p>
    <p>I appreciate your support!</p>
    <p>Sebastian</p>
