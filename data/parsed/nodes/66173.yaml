    <p>Sweet noble heart, pretty lady,<br>
    I am wounded by love<br>
    so that I am sad and pensive,<br>
    and have no joy or mirth,<br>
    for to you, my sweet companion,<br>
    I have thus given my heart.</p>
    <p>P.S. - Take this font as a part of my heart.</p>
