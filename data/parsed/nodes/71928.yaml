  html: |-
    <p>Has anyone on Typophile ever proposed a proper smackdown between the complete Baskerville systems of Emigre and StormType?</p>
    <p>(It has only come onto my radar because of a small upcoming identity project for an English antiques gallery for whom Baskerville would be an obvious choice. They have a small range of print, web, and signage materials to recreate...)</p>
    <p>Anyone want to weigh in on the pros/cons of using both complete systems for print, 3D, and web applications?</p>
    <p>***************************************************<br>
    SMACKDOWN CONTESTANTS:</p>
    <p>In the Emigre corner, we have four challengers:<br>
    1. <a href="http://www.emigre.com/ot.php?id=109" rel="nofollow">Mrs Eaves OpenType</a><br>
    2. <a href="http://www.emigre.com/ot.php?id=212" rel="nofollow">Mrs Eaves XL OpenType</a><br>
    3. <a href="http://www.emigre.com/ot.php?id=213" rel="nofollow">Mr Eaves Sans OpenType</a><br>
    4. <a href="http://www.emigre.com/ot.php?id=215" rel="nofollow">Mr Eaves XL Sans OpenType</a></p>
    <p>In the StormType corner, we have two challengers:<br>
    1. Baskerville Original Pro (includes 120 and 10 sizes)<br>
    2. John Sans 2009<br>
    Both are contained in the <a href="http://www.stormtype.com/typefaces-fonts-shop/libraries-31-baskerville-sans-amp-serif" rel="nofollow">Baskerville Sans &amp; Serif Package</a><br>
    *****************************************************<br>
    Now, we only want a <strong>clean fight</strong>......and......DING!</p>
