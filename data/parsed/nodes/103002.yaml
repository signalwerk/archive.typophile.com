      <p>It's ancient in Internet years, but I found the advice at Gunnlaugur Briem's site very useful as I designed my first (and only, to date) typeface.</p>
      <p><a href="http://briem.net" title="http://briem.net">http://briem.net</a></p>
      <p>Briem is a veteran designer, and the site is essentially the syllabus and notes from a type design course he taught.</p>
