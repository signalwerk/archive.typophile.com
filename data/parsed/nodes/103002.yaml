    <p>Hello,</p>
    <p>I am new here and typedesign in general.</p>
    <p>I have been sketching characters in trying to create my own typeface and been researching on various websites and books.</p>
    <p>I was just wondering what all of you do in starting to design a typeface as books and resources i have found all have different ideas which has just left me a bit stuck on how i should progress and what typeface i should design.</p>
    <p>So far i have just been sketching i started of with the lowercase n and liked the look so have started to progress to other characters in no particular order or fashion.</p>
    <p>Is there certain characters that use the same elements e.g n and h (should i start with these?)</p>
    <p>Also i just started sketching without thinking if the typeface would lend itself to display, text etc is this a bad idea and should you think of its purpose first before starting to design a font?</p>
    <p>Thanks</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sketchbook_5419.1.png"></div><p></p>
