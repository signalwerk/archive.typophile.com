      <p>BTW- you can always show them samples of Herb Lubalin’s work if you haven’t done so already.</p>
      <p><a href="http://www.linotype.com/7-29-7-12333/worksandsamples.html">Linotype - Lubalin</a></p>
      <p>Also, a very nice compilation of typographic designs done by a student at UCLA. Particularly note timeline samples from 60s — 90s.<br>
      <a href="http://users.design.ucla.edu/~cariesta/designhistory/" target="new">Design for Print &amp; Digital Media</a> by Silvia Rigon</p>
      <p>Yet another link — not sure if you are plugged-in to the <a href="http://tdn.freie-hochschule-freiburg.de/tdn.php" target="new">Teaching Designers Network</a>,  an international group of teaching designer which you can join.</p>
      <p>Hope this helps. Also, I would be very interested in viewing any samples of your students’ projects.</p>
