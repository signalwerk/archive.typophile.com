      <p>Hello Nadine,<br>
      It is difficult to find sites where only typographic posters have been created.  There would be many more with images.  My guess would be that design schools, probably European ones like the Netherlands, would be the most likely resource.  I will look at my bookmarks when I get home.</p>
      <p>ChrisL</p>
