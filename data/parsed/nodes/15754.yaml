      <p>There are several sites that I have used as reference on period display typography. Most are bookmarked at home, but here are a few right now:</p>
      <p>Contemporary posters divided into categories: <a href="http://www.allposters.com" target="new">AllPosters.com</a><br>
      A great resource on <a href="http://scriptorium.lib.duke.edu/eaa/" target="nes">Advertising in America 1850-1920</a><br>
      No posters, but great for vintage ads in magazines <a href="http://scriptorium.lib.duke.edu/adaccess/" target="new">Ad*Access</a></p>
      <p>If you browse through some of the galleries presented on LetterheadFonts.com, you can see contermporary designs using “antique-styled” typefaces.<br>
      - <a href="http://www.letterheadfonts.com/gallery/" target="new">Main Gallery</a><br>
      - <a href="http://www.letterheadfonts.com/gallery/thumbnails.php?album=8" target="new"> Portfolio 5</a></p>
