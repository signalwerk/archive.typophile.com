  html: |-
    <p>Hi, I’m working on some packaging design for a food company. I need a find a font which will be used for all product names (varying from diary, meat and fruit) to make it consistent. The concept is healthy low fat products. I am currently thinking of semi sans or a rounded sans, brush scripts or maybe a soft serif with swash caps. Any suggestions to what might fit? </p>
    <p>Oystein</p>
