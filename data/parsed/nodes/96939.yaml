    html: |-
      <p>This is the kind of type design I like! Setting up a system and then getting stuck in to the problem solving. I think you have a good start. I see the /n/ as the key glyph to get the others working. For example, using the n structure as a starting point for /b/ it seems to me that at the moment the bowl is upside-down (same goes for d and p). The left stem of /n/ can also be used to make a pretty cool /i/ by extending the thin bit up into the tittle, and an /f/ by using it to form the crossbar. I'm sure none of this makes much sense so I did a quick sketch to show you what I mean:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/inbfd_4517.JPG"></div><br>
      Would the /y/ shape with the bottom chopped off make a more interesting /v/? Which would then help make a better /w/. Before seeing the whole alphabet in words, I thought your /w/ was an /n/.<br>
      The letters I think needing most work are the broken ones - t, f, s, z, and perhaps e (which is a bit too close to a Euro symbol at the moment IMO). I'm certain you can find a better solution for the /g/ too, and maybe the /o/ would be better left without the detail in the counter?<p></p>
