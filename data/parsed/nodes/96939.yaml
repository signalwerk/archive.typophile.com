      <p>Looking at the "c" I see the big, central decision you'll have to make ASAP: figure out whether any glyph should be conventional. If you're going to have a mix, spend a good amount of time determining which letter should go to which side (preferably relying partly on letter frequencies). Or if you're ambitious implement OT code to give the user choices.</p>
      <p>Maybe don't fully connect the bowl of the "a". Or even have the bowl totally separated.</p>
      <p>Try to avoid symmetry like in the "b" and "d".</p>
      <p>Try an "e" with a split like in the "f".</p>
      <p>hhp</p>
