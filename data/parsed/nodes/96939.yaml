      <p>Sure, give out a beta version (which means it has known flaws that you intend to fix; alpha means it's known to fail spectacularly :-) for free, and even ask for feedback on it. When you finish it, sell it (maybe giving a discount to people who gave you valuable or at least non-trivial feedback).</p>
      <p>Being copied is an honor, especially if you get the credit (which is not assured). But you have to balance that against income. If you don't expect income then being copied can only been good (even if you don't get explicit credit). However: you'd be harming type designers who do want to make money (which can even by a symbolic valuation of something you value - it doesn't have to make one's life much easier). Ergo: it's a social responsibility.</p>
      <p>Also, can you predict the future? I can't. You don't know where a casual interest in something might lead, especially if life changes from under your feet.</p>
      <p>At the very least you should charge a nominal amount just to erect a barrier against parasitic freeloading.</p>
      <p>hhp</p>
