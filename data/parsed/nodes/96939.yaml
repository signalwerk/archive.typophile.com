      <p>@ hrant: Yeah, I was planning on leaving a few glyphs conventional. Judging from my sketches, I expect |c i j l o s v z| to remain standard Garalde style simply because I can't seem to think of a satisfying way of introducing that fine-line substructure. They're just so inherently simple characters...  do tell me if you have any lightbulbs on those.</p>
      <p>On the |a|: I tried that on paper and wasn't satisfied with it, but maybe I just didn't try enough. I do like the current |a|, though; it's a bit of a defining character for this font idea.</p>
      <p>On |b| vs |d|: Well, they're not entirely symmetrical. I also just noticed my sketched |d| had the gap in its bowl on the top while the electronic one has it on the bottom; I guess I could change that, though it would just be a different kind of symmetry.  Just how much asymmetry are you suggesting? Making the |d| narrower than the |b|, for instance (apparently Garamond does that)? Or making up an entirely different alternate anatomy for |d|? I kinda like the bowl shape I have for |b| and was going to use it for |b p d| (and maybe go a little crazy on the |q|). If I have to make up a completely fresh design for |d| and |p|, I suspect they're going to turn out less pretty.</p>
      <p>On the gapped |e|: I already tried that (see image), and I'm not quite sure how I feel about it. Incidentally, I'm not too fond of the gapped |f t| to begin with.  I might still change those.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/de_4838.png"></div><p></p>
