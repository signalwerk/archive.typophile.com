      <p>Repay whom? The people who make free fonts are not the ones who will benefit. And you will virtually never get a donation. Magnanimity is wonderful, but not if it stunts a promising future in type design; it's not like you'll get rich from it, but all humans are material creatures to some extent.</p>
      <p>In retail, "release" means letting total strangers use it. BTW if you do it on MyFonts (which is easy) and somebody copies you and ends up on MyFonts too (which is statistically the most likely) you can ask MyFonts to take it down and they usually oblige. In the past year or so there have been 2-3 such cases thanks to Typophile. A drop in the bucket maybe, but: we've got your back.  :-)</p>
      <p>Character coverage: you can release a font with only alphanumerics, but try to complete at least one basic Unicode table.</p>
      <p>hhp</p>
