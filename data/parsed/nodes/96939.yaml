    html: |-
      <p>Interesting! Thanks for the feedback.</p>
      <p>@ Dave: I can't say I like the |i| and |f| you propose. :\  My goal is not to shoehorn a double stem into every letter; that would somewhat trivialize the overall concept of the font. </p>
      <p>Your proposals for |d b| are interesting; I'll definitely look into replacing some of those angled serifs with flat-footed ones. However, I liked the treatment of the bowls in those letters better in my version. Your proportions feel sleek and remind me of something contemporary like Quadraat, while I'm rather aiming at the generous, almost pompous, circle-based proportions I associate with compasses, naval steering wheels, and wood-and-brass engineering in general.  The unconventional architecture of my bowls also lend themselves better to the humanist diagonal stress, while yours rather feel modern to me.</p>
      <p>I agree that the broken |s z| feel contrived.  I might end up with regular Garalde designs for those letters. Likewise, I might return to the simple epsilon-style |e| that I had earlier. I do like my current |f t| designs, though, especially the fact that they have their crossbars on the same height but approach that height from opposite sides.</p>
      <p>@ Riccardo: I can see a certain similarity, but the overall feel of the font is extremely different from mine. Isadora is downright... frilly. I do intend to give double stems to my capitals, though, to mimic fraktur-style capitals, so at least that's the same in Isadora.</p>
