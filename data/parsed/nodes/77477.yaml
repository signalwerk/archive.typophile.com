  html: |-
    <p>Does anyone know the typeface used for these intertitles from Godard's <em>Masculin Féminin</em>?</p>
    <p>I'm pretty sure the dotted upper case "I"s were done by Godard himself because in other films he used Antique Olive with a dotted "I" which as far I know does not have a dotted "I".</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/11-450x337_4102.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/71-450x337_4107.png"></div><p></p>
