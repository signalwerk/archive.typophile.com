  html: |-
    <p>HELP!</p>
    <p>I am designing a brand that will rarely, if ever, be used in print. Screen legibility is crucial. It's hard to explain the context but think "Audi meets The Economist" or something like that.</p>
    <p>Web-fonts in high volume destroy loading time to a degree that I can't tolerate, so keep in mind that I need a body font that is a system font and doesn't kill the branding. </p>
    <p>Originally I had almost decided on Bodoni and Gotham in various weights (Helvetica as a body font) which was a nice pair, on paper. I have since arrived at Gotham Narrow with Times.</p>
    <p>Bodoni Bold had caps, punctuation, and numbers that I loved, but as an on-screen font it made me lose sleep. Gotham Narrow/Times is amazingly legible, but seems a little dry as a brand pair. Or does it?</p>
    <p>Please offer your opinions so I can make a choice! Was I better off with Bodoni/Gotham, am I fine now with Gotham/Times, or would a third font spice up my safe pairing?</p>
    <p>Thanks!</p>
