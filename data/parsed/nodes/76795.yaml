    html: |-
      <p>Unless your audience is typographers, I doubt they will feel one way or the other about whether the fonts you mention are dull, but will be more receptive to the way they are speced.</p>
      <p>So using those well-tried fonts will be safe.</p>
      <p>However, if you are trying to impress your peers or stave off your own ennui, you might consider something off the beaten path.</p>
      <p>I for one am most impressed by people who use fonts I am unfamiliar with in novel ways.</p>
      <p>The challenge is to invest the effort in making them work on the job in hand, because there is no easy template, of what others have done, to follow.</p>
      <p>Many designers feel that fonts which have not been assimilated into the collective by wide usage have too much personality.<br>
      You will have to draw the balance for yourself, between the personality of the font and that of your layout. That's style.</p>
