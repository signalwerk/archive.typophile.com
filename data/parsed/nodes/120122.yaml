    html: |-
      <p>Really like these ones.<br>
      First looks reminds me of <a class="freelinking external" href="http://luc.devroye.org/fonts-26218.html" rel="nofollow">Georg Trump's Amati</a>, some sort of cross-over between <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/fenice" rel="nofollow">Fenice</a> (hemi-arrowheads serifs) and <a class="freelinking external" href="http://www.myfonts.com/search/corvinus" rel="nofollow">Corvinus</a> (geometric and squarish).<br>
      Some alternatives: <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/rmu/amati-pro" rel="nofollow">Amati RMU</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/artypes/amati-ar" rel="nofollow">Amati AR</a></strong> (Fenice = Corvinus, main difference on /R leg), <a class="freelinking external" href="http://www.myfonts.com/fonts/castletype/vincenzo" rel="nofollow">Vincenzo</a> (Fenice &gt;&gt; Corvinus), <a class="freelinking external" href="http://www.myfonts.com/fonts/stereotypes/flenja" rel="nofollow">Flenja</a> (Fenice &gt; Corvinus), <a class="freelinking external" href="http://www.myfonts.com/fonts/aboutype/elongated-roman" rel="nofollow">Elongated Roman</a> (almost perfect but really too thin), <a class="freelinking external" href="http://www.ffonts.net/LatinSmall.font" rel="nofollow">Latin Small MK</a> (Latin &gt;&gt; Fenice &gt;&gt; Corvinus), <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/latino-elongated" rel="nofollow">Latino Elongated</a> (Latin &gt;&gt; Fenice &gt;&gt; Corvinus)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Amati-CEWeber-1952-GeorgTrump_5265.jpg"></div><p></p>
      <p>Second looks very modern. Alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/bomparte/seagrass-bf" rel="nofollow">Seagrass</a> BF, Sudtipos <a class="freelinking external" href="http://www.myfonts.com/fonts/sudtipos/storefront-pro" rel="nofollow">Storefront</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/sudtipos/buffet-script" rel="nofollow">Buffet</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/mawns/stainy" rel="nofollow">Stainy</a>, CBdO <a class="freelinking external" href="http://www.myfonts.com/fonts/charlesborges/sarah-script" rel="nofollow">Sarah</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/charlesborges/alpine-script" rel="nofollow">Alpine</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/mawns/hemmet" rel="nofollow">Hemmet</a>, <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/typeart/dream-lover" rel="nofollow">Dream Lover</a></strong> (very close)</p>
    html_clean: |-
