    <p>Hi genius typeheads -</p>
    <p>I'm trying to identify the FOR WHOM THE BELL TOLLS font used on this book cover - looks like a condensed Bodoni, but the R is very different...<br>
    Any ideas?</p>
    <p>Also, the script for ERNEST HEMINGWAY.</p>
    <p>Thanks so much!<br>
    A.</p>
