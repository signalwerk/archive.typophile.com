    html: |-
      <p>Book covers of this era generally used hand lettered titles rather than direct application of fonts.<br>
      There is a font with the almost identical letter-forms, but a narrower aspect created by Sol Hess in 1938 as Spire. There are digital versions by Ann Pomeroy that could be expanded in width. Use the regular version and substitute some letters, such as _R_ from the expert version.<br>
      Regular<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/SpireRegInUseAsBells_4149.gif"></div><br>
      Expert<br>
      <div class="imageWrap"><img src="http://typophile.com/files/SpireExpertInUseAsBells_5208.gif"></div><br>
      <a href="http://www.myfonts.com/fonts/grouptype/spire/" title="http://www.myfonts.com/fonts/grouptype/spire/">http://www.myfonts.com/fonts/grouptype/spire/</a><br>
      Don<p></p>
