    <p>Hi,</p>
    <p>Following the responses on my earlier "Primus" post (see "Primus: Please critique this font under construction"), I made some major edits on this typeface.</p>
    <p>One of the main edits was around using a more curvy flairing of the lower stems (following crossgrove and dezcom's feedback). </p>
    <p>Also I updated all all the 'bowled' letters of the lower case (b, d, p, q, e, c) as well as all the upper case.</p>
    <p>The input I got was very helpfull and I would appreciate any further pointers!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Primus v2_4097.jpg"></div><p></p>
    <p>(PDF test text from WikiPedia: Punchcutting)</p>
