    votes: null
    html: |-
      <p>Hey Sebastian,</p>
      <p>I like the changes you've made, and I do see your point about keeping the brushy terminals as a special characteristic; overdoing it would take away some of the seriousness that you mentioned. I think that the c and the e are much better related now, and the terminal on the c matches the rest of the font.</p>
      <p>The lc s is improved, I think, but I think it's lost some of its openness. Is there a way to keep the added weight on those terminals, but not close of the counterspace so much? It also feels like it's tilting backwards now; you can see that especially in the detail image you posted. The original s leans slightly forward (like your e and g) and your new one tilts the other way. I'd try to go back to the original slant where the bottom terminal sticks out to the left of the top stroke. </p>
      <p>That's all for now, I think.</p>
      <p>David</p>
