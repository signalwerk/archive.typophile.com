      <p>ChrisL,</p>
      <p>Thanks for the comments. I wasn't sure about the U either... One the one hand, it adds some quirkyness, but on the other hand, it may be inappropriately over the top. I think I may hold on to the flare on the right stem and make the left stem straight.</p>
      <p>Good points on the j and y, I will give those tails a massage and a joint-crack. </p>
      <p>I think the v and w need some balancing as you indicated. Their 'bottoms' are offset to the left after operation flare.</p>
      <p>Any suggestions on the lc s terminal? Originally, I had straight, i.e. pen-nib style serifs (see image), and after reading the thread on the development of 'Fejoia', I went for the 'brushy' kind of serifs. </p>
      <p>Sebastian<br>
