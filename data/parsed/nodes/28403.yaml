    html: |-
      <p>Hi David,</p>
      <p>I appreciate you feedback!</p>
      <p>You're right, I think I settled on the coexsistence of the pen and brush type terminals. This is also used in a number of other typefaces as well ("Quadraat" is one that inspired me). I think that it may also be 'historical correct' as I can imagine that in medieval times letters may have been drafted with a combination of media... (I am speculating here).</p>
      <p>I have to play with some of the caps. One reason I limited it to lc is that I am affraid that things be become 'too playfull', and I want this face to have a 'classy', 'down to earth' but open and energetic quality. Using the brushy terminals on the uc may take some 'seriousness' away.</p>
      <p>The hybrid s you drew is interesting. I see your point that the terminals are too light, so I made them larger and checked with the a, c, j, y etc. to see if they balance. </p>
      <p>(Old / 'light' s on the right)</p>
      <p>Also the e got some straightening, although it still has a bit of the 'forward looking' aspect. Also the c got some massage. </p>
      <p>Here a test with some the touched letters.</p>
      <p>Sebastian</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/test_4883.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/s_3437.jpg"></div><p></p>
  - id: 159858
