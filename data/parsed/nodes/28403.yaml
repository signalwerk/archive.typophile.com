      <p>Hi Sebastian,</p>
      <p>I've been so busy thinking about your feedback on my own design that I didn't realize you had one up here as well. I figured I'd give it a shot. Remember that I, too, am a beginner, and you shouldn't necessarily trust anything I say.</p>
      <p>I think that one of the biggest sources of your lowercase's character (and I could be very wrong) is the juxtaposition of the the constructed pen-formed serifs and the swooshy, brushy terminals. To me, that's what gives your letters like k and x such a distinctive look. Because the brushy terminals are consistent throughout the lowercase (a c f j y, and to an extent the legs on k and x), I don't see a problem with them on the s, but I do think that they should be thickened up a bit, they look weak next to that r. </p>
      <p>If you're going to fully commit to the brushyness, I might start to miss it in the uppercase. I only see it on the tails of the J and Q, but it has potential to be on the C, G, K, R, S, and the X. Maybe the reason that others want the brushy s to go is because it's not present enough in the other characters.</p>
      <p>And, just for fun, I tried a little mixing and matching of your two s designs to echo the mixing of pen and brush that you do elsewhere. A little too weird, though.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/pixion_s_5446.png"></div><p></p>
      <p>A few other notes:</p>
      <p>c: the terminal on your c is too ball-shaped; I want it to be more like the one on on your a</p>
      <p>e: this seems to tilt to the right because the bottom portion doesn't extend past the top. I know that your g leans to an extent too, but your c doesn't and I really want the c and the e to be consistent.</p>
      <p>f: I love it, it creates such an interesting countershape over the following letter.</p>
      <p>I hope that at least some of this was helpful.</p>
      <p>David</p>
