      <p>Mark,</p>
      <p>What I do know is that he made a big impression here, several of the old timers whose oral history we have taken, refer to Herb Lubalin's visit here.</p>
      <p>More usually the talent brought in for lectures here or for judging design competitions were commercial artists or folk such as Arthur Paul, Vice President and Art Director of Playboy magazine (1968.)</p>
      <p>What is really interesting is that Lubalin was about type, and many people don't think of "typography" and "New Orleans" (or the South) in the same breath.</p>
      <p>See ya 'all here in New Orleans at TypeCon 2011!</p>
