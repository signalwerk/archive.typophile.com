      <p>This is wonderful, Nancy, thank you for this. What other typographic treasures have you unearthed?</p>
      <p>I remember delivering U&amp;lc layouts to Herb at his home in the Village when he was ill, but unfortunately never got to work with him directly as U&amp;lc was done completely at his studio until his passing, when it was moved to the ITC office.</p>
