    html: |-
      <p>Hi Ilene,</p>
      <p>Post WWII the boys coming home from was in the European theatre brought with them an eye for the International style—we know this from what little graphic design history has yet been published here in the US. This holds true for little markets, such as South Louisiana.</p>
      <p>The typographic tradition local to New Orleans goes back centuries, there have been type foundries here for quite some time. Come to TypeCon 2011 in New Orleans and experience first hand this great legacy.</p>
