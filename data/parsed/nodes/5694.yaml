  html: <p>We launched Spaces magazine last July on a wing &amp; a prayer and very little knowledge of typography. We're at the stage now where we really need to focus on getting the design &amp; typography to work together to give the mag a clearer identity. It's a contemporary interiors and design mag, with a slightly quirky streak, for people who are passionate about their homes. <br> <br>We currently use Adrenalin for the title, FF DIN Light for text, DIN Regular, Medium &amp; Bold for captions etc, and OcrA for subheads and quotes. Helvetica neue and American Typewriter for heads. <br> <br><img src="http://www.typophile.com/forums/messages/29/41042.jpg" alt="spaces-pages"> <br> <br>I don't know much about typography, but I'm not 100% convinced by the combination &amp; I'm desperately looking for some advice on alternatives - any ideas?</p>
  html_clean: <p>We launched Spaces magazine last July on a wing &amp; a prayer and very little knowledge of typography. We're at the stage now where we really need to focus on getting the design &amp; typography to work together to give the mag a clearer identity. It's a contemporary interiors and design mag, with a slightly quirky streak, for people who are passionate about their homes. <br> <br>We currently use Adrenalin for the title, FF DIN Light for text, DIN Regular, Medium &amp; Bold for captions etc, and OcrA for subheads and quotes. Helvetica neue and American Typewriter for heads. <br> <br><img src="http://www.typophile.com/forums/messages/29/41042.jpg" alt="spaces-pages"> <br> <br>I don't know much about typography, but I'm not 100% convinced by the combination &amp; I'm desperately looking for some advice on alternatives - any ideas?</p>
