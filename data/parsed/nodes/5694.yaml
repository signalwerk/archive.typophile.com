    html: <p>I think the layout looks nice and clean and appropriate to its subject matter. I like the small gutters between images (reminds me a little of <a href="http://www.selfservicemagazine.com" target="_blank">Self Service</a>). <br> <br>The type that's been chosen is a little over-familiar -- you might want to think about, for each typeface, choosing something similar but less common; similar enough to keep the feel (I agree with Chris L about not messing too much with the overall ID right at the start) but different enough to make it your own. <br> <br>I'm sure you could find good alternates by poking about the board a little -- I'm on my first coffee and have to go to work in 5 mins so can't think right now. <br> <br>Best <br> <br>R <br> <br></p>
