    html: <p>It looks to me like you did hire a designer. <br>Other than "...not 100% convinced by the combination," what do you specifically object to?  The type is too small to see very well so I can't comment on the interaction of fonts. <br>Personally, I rather like what I can see of it.  It is modern and eccentric (much like my own tastes).  <br>For me, it is not so important what you or I think but what your target audience thinks.  Why don't you do a letter from the editor asking your subscribers what they think of the design of your publication? Don't ask them about type faces or try to skew their thinking, just ask them to comment on the design.  If most comments hate your type, that is one story.  My guess is most won't even mention type face combinations.  Remember, it is not your magazine, it is your subscribers'. <br> <br>IMHO, leave it as it is for at least a couple of years. It is hard enough to create an identity without changing it every few months.  If you do change it, have a good reason.  A good reason is NOT, "I am not sure about this anymore." <br> <br>ChrisL</p>
