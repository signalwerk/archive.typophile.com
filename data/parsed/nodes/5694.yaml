    votes: null
    html: "<p>OK - here are my concerns: <br> <br>DIN for body copy looks a bit 'lightweight' to me &amp; is not easy to read. We've played with serifs but they change the feel too much. <br> <br>Helvetica neue - we started using Thin Extended for a couple of big headlines etc. but I'd really like to see something which is less cliched before we get stuck on using it regularly. We'd also use for big coverlines. <br> <br>American Typewriter - as I said, we started using rather thoughtlessly. Should we be checking out some other typewriter fonts? <br> <br>I'd really like to choose a serif display font for some heads &amp; subheads to add a little 'colour' where appropriate. <br> <br>OCRA is a bit painful at times, but I like it! The mag is contemporary but not particularly aloof - we like a touch of trashy too! <br> <br>Most of the feedback we get suggests that we are seen as standing out from the crowd (Elle Decoration &amp; LivingEtc). Because the mag content is percieved as being innovative, I think it's very important to gently refine/evolve the design &amp; typography to keep our readers hooked.</p>"
    html_clean: "<p>OK - here are my concerns: <br> <br>DIN for body copy looks a bit 'lightweight' to me &amp; is not easy to read. We've played with serifs but they change the feel too much. <br> <br>Helvetica neue - we started using Thin Extended for a couple of big headlines etc. but I'd really like to see something which is less cliched before we get stuck on using it regularly. We'd also use for big coverlines. <br> <br>American Typewriter - as I said, we started using rather thoughtlessly. Should we be checking out some other typewriter fonts? <br> <br>I'd really like to choose a serif display font for some heads &amp; subheads to add a little 'colour' where appropriate. <br> <br>OCRA is a bit painful at times, but I like it! The mag is contemporary but not particularly aloof - we like a touch of trashy too! <br> <br>Most of the feedback we get suggests that we are seen as standing out from the crowd (Elle Decoration &amp; LivingEtc). Because the mag content is percieved as being innovative, I think it's very important to gently refine/evolve the design &amp; typography to keep our readers hooked.</p>"
  - id: 40595
