    html: <p>i was just giving you a hard time before. i think everyone who could best answer your questions is away at Typecon this week... so you might hafta wait a while until they can get back from San Fran. <br>What is it about your current shemata that isn't working for you? what kind of look are you wanting to zero in on better? Everything depends on how YOU want your magazine to look and without more information about what you want, i dunno if anyone here can properly guide you where you want to go. So far I've got contemporary and quirky... anything else someone making suggestions should know about? <br> <br>One thing I would change is that I wouldn't use a san serif for long blocks of text, ie articles. </p>
