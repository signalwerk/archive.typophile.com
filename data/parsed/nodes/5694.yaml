    html: "<p><i>We've played with serifs but they change the feel too much</i> <br> <br>They say sans are more legible, while serifed faces are more readable. This is why most reading material you see is in a serifed font with sans headings. <br>They say one's eyes tire after reading a large block of text in a san serif face, and I'd have to agree. <br>These are two reasons i suggested switching to a serifed face. <br>A third reason is more personal, i guess: if i were to pick up a magazine and see all the articles were in a sans face, i would get the impression that the articles were more for filler than the actual meat of the publication. i'd view such text as big captions for the pictures... but that's just me. </p>"
