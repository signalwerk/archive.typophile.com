    html: <p>Since we are taking type here, I would suggest focusing on adapting font families that are extensive with wide range in weights, sans and serif versions as well as multiple numeral systems and ligatures. If you find your competitors use similar choices I would suggest not using the same. A custom face would be ideal but perhaps funding and time constraints does not allow for such. <br></p>
