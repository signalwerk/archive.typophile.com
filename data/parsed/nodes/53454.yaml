      <p>Typedog, you might need to be quick. According to the online edition<br>
      of <a href="http://www.spiegel.de/kultur/gesellschaft/0,1518,601693,00.html" rel="nofollow">Der Spiegel</a> (sorry, the article looks like it's available in German only),<br>
      they're already facing a lawsuit; the State of Bavaria is pressing even<br>
      for a recall of the issue already published over a (contested) copyright violation.<br>
      They claim to hold the rights to those newspapers originally published by<br>
      the Eher publishing house, such as "Der Angriff" reprinted in the first issue.</p>
      <p>Fortunately, one exponent of the "Zeitungszeugen" team is quoted as saying<br>
      that even if they are not granted access to the newspapers published by Eher<br>
      any more, they will still be able to continue with the project – though of course<br>
      with a more limited selection of material.</p>
      <p>My favorite line of argumentation used by the Bavarians (not surprisingly):<br>
      That material is <em>dangerous</em> and can't just be reprinted &amp; sold. And if some researchers really are that interested in it, they can always visit a library!<br>
      (I'm sure those "endangered" wouldn't know how to use a library.)</p>
