      <p>The nearest I could find (and they are pretty close) are Shelley Allegro, Shelley Andante &amp; Shelley Volante;</p>
      <p><a href="http://www.myfonts.com/fonts/linotype/shelley-script/shelley-allegro-script/">http://www.myfonts.com/fonts/linotype/shelley-script/shelley-allegro-scr...</a></p>
      <p>alternatively, you could try Edwardian Script, which is also fairly close;</p>
