    html: <p>OK, <br> <br>This is encouraging. Sorry it was late last night and that is why you lost me. But your encouragements led the customer to successfully set type. <br> <br>The problem with this font, <i>cough, cough,</i> the good  thing about this font is that it is multi-coloured. <br> <br><a href="http://www.lanstontype.com/JacobeanInitials.html" target="_blank">http://www.lanstontype.com/JacobeanInitials.html</a> <br> <br>So the fellow needs to be able to set, copy, and then layer the colours on top of each other. <br> <br>First, can the fellow colour the font? I imagine the answer is yes. <br> <br>Second question is, can the fellow accurately layer  the fonts on top of each other?  Or is  it visual placement only? <br> <br>This fellow is most brave. It is his first font purchase, and first font installation. Frankly I need half a pot of coffee before thinking about working with this <i>user friendly font.</i> I just like to be prepared for the beauty of the results. <br> <br>Alright, it is hard for me to say bad things about a font that does nice things. I think you understand. <br> <br>Probably I should write a manual for this font. Maybe I should spend some time with fringe software. I am so bare bones here. There is no toys or nice things for me to work with. <br> <br>Keep thinking about boats. <br> <br> <br> <br></p>
