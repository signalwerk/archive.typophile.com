    html: <p>Providing the font was installed correctly (perhaps see if it appears in the font menu of any other program the person has on their computer) it will appear in AppleWorks (previously called ClarisWorks, by the way). <br> <br>There are basically two ways to set type in AppleWorks. One is using the word processor (which, like Tiffany mentions, is similar to Word) and the second is within a text block as part of the drawing module. The drawing module allows you to scale, stretch, rotate, etc. the block of text (which can still be edited, of course.) <br> <br>I am guessing that if the person cannot "set" the typeface, it's because it is not installed properly. The first thing I would ask them is if the font appears in the AppleWorks font menu.</p>
    html_clean: <p>Providing the font was installed correctly (perhaps see if it appears in the font menu of any other program the person has on their computer) it will appear in AppleWorks (previously called ClarisWorks, by the way). <br> <br>There are basically two ways to set type in AppleWorks. One is using the word processor (which, like Tiffany mentions, is similar to Word) and the second is within a text block as part of the drawing module. The drawing module allows you to scale, stretch, rotate, etc. the block of text (which can still be edited, of course.) <br> <br>I am guessing that if the person cannot "set" the typeface, it's because it is not installed properly. The first thing I would ask them is if the font appears in the AppleWorks font menu.</p>
