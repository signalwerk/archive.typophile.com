    html: <p>I use the database part of Appleworks 6 on Mac OS 9 for student grades. Darren Wilson, who taught the course with me at one time, set up the templates which I use for this. It's great, and I wouldn't say that an alternative to the incredibly bloated Word is dumb, quite the oposite in fact. <br> <br>I've never had a problem with being able to set fonts in the database part of Appleworks. If a poorly-manufactured student font shows up when double-clicked in ATM, it sets in Appleworks.</p>
