      <p>Other source of possible problems:<br>
      If you have the option <em>"Generating OpenType &amp; TrueType/Kerning/Generate OpenType 'kern' feature if undefined or outdated"</em> activated. Malformed kernig classes may produce invalid code for the kern feature.</p>
      <p>You can make a dry run with <em>"Tools/Kernig Assistance/update [kern] feature"</em>. This adds kern feature code in your OpenType feature panel. Try to compile again. If it fails the problem is in your kern class definition.</p>
      <p>Eigi</p>
