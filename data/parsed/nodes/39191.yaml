      <p>Here is what I would do . . .</p>
      <p>Take an old Type 1 font you've used for years.</p>
      <p>Read it into FontLab.</p>
      <p>See if you can make an OpenType font from it -- just read it in (make sure there are no parens in the copyright line) and see if you can generate an OT font.</p>
      <p>If not, likely there is some problem with your installation of FontLab.</p>
      <p>If so, the problems is likely with your font.</p>
      <p>If it seems to be in your font, make a copy &amp; throw away everything but  two letters -- the space and something else, say "A". See if you can make an OTF font. If not, remove the "A" and try a "B".</p>
      <p>If this initial test doesn't work, you need a guru beyond me, but likely someone here can help.</p>
      <p>If this test does work, make another copy of the and remove half the lettes, &amp; see if you can generate the otf font.. If not, keep removing half the letters until you can. If it is a single letter, pretty soon, you will have it isolated. If it is more than one letter it will take longer; I'd use an "addition" rather than a "subtraction" procedure (i.e., keep adding to what works). </p>
      <p>One thing you might try first is to make the OT-TTF font, read it back in, change the curves to PostScript, and see if THAT will let you generate an OT-CCF font. But my guess is it won't.</p>
      <p>Good luck</p>
