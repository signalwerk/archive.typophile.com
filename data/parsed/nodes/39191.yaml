      <p>!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!</p>
      <p>I got this same error over and over, but found a quick fix. </p>
      <p>You MUST define a name for your font in File &gt; Font Info before generating.<br>
      Once I did that, it generated just fine.</p>
      <p>You can save the font as a "file" aka myFont.vfb and that's great, but you have to actually define the font name in Font Info to avoid this error, which BTW has nothing to do with the features as it says in the error.</p>
      <p>I am having problems with some of my kerning not working, but that it unrelated.</p>
      <p>Hope this helps.</p>
      <p>Jay</p>
