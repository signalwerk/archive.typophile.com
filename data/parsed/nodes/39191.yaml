    <p>I'm working right now on a rather simple, stylized font using FontLab 5.0.0 on WinXP. These are the only real specs:</p>
    <p>- No metrics classes<br>
    - No kerning classes<br>
    - 2 kerning pairs only<br>
    - dnom / numr feature</p>
    <p>Here's the code for the dnom/numr features:</p>
    <p>feature dnom {<br>
        sub @dnom_normal by @dnom_ot;<br>
    } dnom;</p>
    <p>feature numr {<br>
        sub @numr_normal by @numr_ot;<br>
    } numr;</p>
    <p>Everything compiles and previews just fine in FontLab, but when I try to generate the font, I get this:</p>
    <p>ERROR: There was a problem while compiling OpenType font. Final .otf font is not saved. Please, check OpenType features definition for errors</p>
    <p>I can't seem to get any additional info on what's actually wrong, and the problem doesn't seem to be budging. The font is comlpetely finished at this point, so it's frustrating to not be able to build it.</p>
    <p>Any help would be appreciated!</p>
