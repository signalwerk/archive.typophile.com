    html: |-
      <p>This is not a feature file problem - note that Andy tried removing all features and had the same problem.</p>
      <p>All that CFF subroutinization does is make the font file smaller. It does this by finding bits of contours that are common to several glyphs, and sharing that bit between them. Think composite glyphs, but sharing just parts of an outlines. With some fonts, this can make the CFF table as much as 50% smaller, although it is more common to see size decreases of around 20-30%. It is rare to have a problem because of this; the bugs I know of happen when there are &gt; 32K subroutines, and you usually run into this when you have &gt; 10,000 glyphs. However, it does no harm to turn subroutinization off. The size difference of the final OTF font is usually don't matter on modern systems, unless you are targeting mobile device.</p>
      <p>The approach suggested above by charles_e on 2.Nov.2007 6.13am seems the most practical. to me, although I'd do it the other way around; make a new font, then add the letters in gradually, then fix the FontInfo and other meta info to match the original, then add features.</p>
      <p>- Read Roberts</p>
