      <p>No guarantees, but maybe this will help: snoop around at the location (folder or subfolder, directory or subdirectory - call it what you will) where you expect the generated OT font to be built. There may be an uncompleted build residing there with a goofball extension (look for something like "[<em>name of your font</em>]._tf"). If so, remove it or rename the extension (try "[<em>name of your font</em>]._tf_fail") and then retry your generation effort.</p>
      <p>Such quirky behavior struck me thrice only when using FLS 5.0.0 on Win2K and the above procedure cleared the problem. Even though your difficulty may finally be different, I hope this helps.</p>
      <p>Regards,<br>
      Ernie</p>
