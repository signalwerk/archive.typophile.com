      <p>As I argued <a class="freelinking external" href="http://ilovetypography.com/2010/07/26/reviving-caslon-the-snare-of-authenticity/" rel="nofollow">here</a>, I think the pursuit of 'authenticity' is a snare. You can try to capture features of any of the old types, but trying to mimic the look you end up with a type that is only of antiquarian interest. Jenson is one of the greatest types, and people keep trying to capture its magic in different ways and with varying success. </p>
      <p>My own view is that they need to be evaluated each on their own merits, whether it's Centaur, Goodchild, Adobe Jenson, Eusebius, or whatever.</p>
