    html: |-
      <p>@Jens Kutilek:<br>
      <cite>I'm not sure what's your definition of a "true" revival – one that's adapted to current standards, usability requirements or one that's as close to the original as possible?</cite></p>
      <p>Both!</p>
      <p>One that's adapted to current standards enough to be usable - but which is very close to the original in all respects not constrained by that, so that it keeps the feel of the original!</p>
      <p>Of course, that isn't quite clear enough yet. Doesn't Cloister Oldstyle capture the "feel" of Jenson's typeface?</p>
      <p>So perhaps what I'm praising is what others would esteem less. To be a revival of a previous typeface, and not simply a new typeface taking inspiration from that typeface, instead of striving for an original creation, after doing what is necessary to avoid the type being unfit for its intended purpose, the type designer needs to be imitative rather than creative.</p>
      <p>Art will still be present, as there's no mechanical way to "true up" an incunabular typeface, but we move on the spectrum towards craftsmanship and away from fine art.</p>
      <p>Oh, and to avoid confusion: among modern digital faces, what I'm thinking of is Nicolas Jenson SG, <em>not</em> Jenson Eusebius.</p>
