      <p>I note that, in <em>The Centaur Types</em>, no less an authority than Bruce Rogers has this to say of Eusebius: "It was a much more faithful reproduction of Jenson's letter than Centaur or Cloister." </p>
      <p>Though he was of course writing long before some of the other modern 'revivals' came into being... I do think you'd be hard pressed to find a more strictly faithful recreation than Eusebius.</p>
      <p>I'd venture to suggest that the Doves Press Roman might have earned a similar distinction... if it had survived, at least. :(</p>
