  html: |-
    <p>I'm happy to see that Spiece Graphics has its typeface Nicolas Jenson SG available.</p>
    <p>In my opinion - and is this perhaps just me, or is there some validity - nearly all the "Jenson" typefaces seemed to me to be typefaces very distinct from Jenson's original typeface; whether those named "Jenson", or Centaur, Cloister Old Style, Jenson Old Style, and so on. Even though they were all good typefaces, they belonged in the larger category of Italian Old Styles - none seemed to me to really be a "revival" of Jenson, if one applied the same standard to them as one would to a revival of Garamond, Baskerville, or Caslon.</p>
    <p>The only one that seemed to me to be a version - yes, "trued up", but otherwise it wouldn't have been usable - of Jenson's actual original typeface was Eusebius, by Robert H. Middleton and Ernst Detterer for Ludlow.</p>
