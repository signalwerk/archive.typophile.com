  - id: 482427
    user: 1133
    date: 2011-10-29T10:21:00
    date_raw: 29 Oct 2011 — 10:21am
    votes: null
    html: "<p>BTW, I just wanted to point out that, if you decide to store your PNGs outside of the PHF file (BitFonter: Preferences / Export / Photofont / Put glyph data: Outside of font file), you'll get a regular PNG which you can then post-process in any PNG editor (my preferred one in this case is Adobe Fireworks as it uses PNG natively). Any photofont will then \"instantly update\". No need to open and re-save in BitFonter.</p>"
