    <p>Hi there, I came across a subject that is a little riddle for me: </p>
    <p><strong>BitFonter 3.0</strong> for Mac won’t export <em>transparent PNGs</em> as Images. </p>
    <p>Since there is almost no point to export them like this, if there is no option of making them transparent – i’m maybe doing something wrong here? </p>
    <p><em>Tools/Filter/Remove Background</em> and the <em>Glyph Preview Windows</em> or even <em>View/Transparency</em> let you assume, that the data itself is layered on a transparent background. </p>
    <p>Any suggestions would be helpful ’cause I’m really stuck here. Thanks!</p>
