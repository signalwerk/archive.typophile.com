      <p>PDP-1 MOTION</p>
      <p>Flip Switch. ON. Retrieve file. List. Result on screen in black and white. Take notes. Ponder. Course of action. Return . . . Result. Locate printing device. Printing device online. Hummm... hummm... Printing head routine done. Print. Return. Tek-tek-tek-tek-tek . . .<br>
      Locate main application. Run. Window pops up. Black and white. Load film cartridge; first, shut light bulbs. Loaded.<br>
      Reload previous file. Hover pointer to the beginning. Ponder. Click. Imaging . . . . . . . . . Elapsed time... 00H00H00 24H11M58S. Blinking. End run.<br>
      Flip Switch. Bulbs ON. Check resulting celluloid against light background... Follow thru checklist. All checked. "Positive". Secure run.<br>
      Time check. 4:56pm. Remove armor. Flip switch. Bulbs OFF.</p>
      <p>Next morning.<br>
      Flip switch. Bulbs ON. Locate celluloid. Load onto device. Unlock safe pin. Pull lever slowly to engage. ON... Flip switch. Bulbs OFF.</p>
      <p><a href="http://www.photoblog.com/storage001/2008/06/10/" rel="nofollow">Projection . . .</a></p>
