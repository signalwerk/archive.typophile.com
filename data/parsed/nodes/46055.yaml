      <p>Thanks Concrete for the extra info on PDP-1, and for you guys for 'dropping' by.</p>
      <p>The idea behind PDP-1, MAC and PC is that it is designed so that it conceals its real meaning, or the real names they (mis)represent.</p>
      <p>PDP-1 is the idea of a dinosauric ideology;<br>
      MAC is the fresh look it inspire and also a model that most of the 'computer word' would give anything to duplicate;<br>
      PC is the paradigm of a failed attempt to capitalize on the ignorance of non-computer users.</p>
      <p>When this first come to consideration, I researched for five minutes, looking for the desired hardware. My first option was:</p>
      <p>ATARI - PC - MAC</p>
      <p>But, the experiment required the use of only domestic brands, to be represented as 'icons' or pictograms. I also considered it would be best served as images, but that would take precious time to accomplish. That left me with a option which would make the experiment as fast as fast could be. Living me to the minimal approach: Georgia and Align to the left.</p>
      <p>That has proven to be the fastest approach.</p>
      <p>André</p>
      <p>* The above description may change at any time with the reserved option to add a picture and color that could shine some light on this puzzle.</p>
