      <p>I notice that the visual manifestations of these various iconographies are mere shells of their connotative meanings. Each has a similar denotative meaning, that being a computational device meant to increase productivity, but as you mention above, the connotative meanings are greatly different.</p>
      <p>This visual representation of reality is an interesting exploration of the postmodernist question of media; we see reality through various media, but reality in and of itself is a medium. The problem then becomes, what is "real" and what is real? How can we define reality, if we can never be sure what is real?</p>
      <p>This brings us back to the idea of connotative and denotative meanings. In postmodernism, the denotative meaning of reality is void; we must rely on a connotative meaning. The problem with connotative definitions, however, is that each of us views reality from our own perspective and create our own connotative meanings, which are further distorted because of what we can call the "frame of reference."</p>
      <p>We then have to decide what we can define as absolute. Reality clearly is not; is truth? The answer is no; truth defines itself as the generally accepted happening. Truth and reality, then, are completely separate entities. But what about happening, or "occurrence?" We can agree that there is a such thing as absolute occurrence, though we may not agree upon that absolute.</p>
      <p>In examining this enigmatic esoteric representation of a reality distinct from our own, we view it through different frames of reality. There is a visual element, but some instead may see (hear?) the auditory representation. The harsh consonant tones suggest a certain absoluteness and frankness in this expression, but then again almost nothing is absolute.</p>
