      <p></p><div class="imageWrap"><img src="http://typophile.com/files/3_4469.png"></div><p></p>
      <p>Well, "if this make any sense" is still to be determined by the imput-output<br>
      PDP-1, MAC and PC may or may not generate.<br>
      I would propose that the nuclear point or question is to determine what really happen to P* (PC) and for that I made a picture to depict the trajectory of</p>
      <p><a href="http://en.wikipedia.org/wiki/PDP-1" rel="nofollow">PDP-1</a> <a href="http://en.wikipedia.org/wiki/IMac" rel="nofollow">MAC</a> <a href="http://en.wikipedia.org/wiki/IBM_PC" rel="nofollow">PC</a></p>
      <p>I have to point out that the order of appearance starts with PDP-1 and somewhat influences the implosion / disappearance or annihilation of PC, which from that point on becomes only a mirage of itself, which, on a attempt to represent and also with great use of XXI Century instrumentation I was able to magnify, the exact moment of the event, which is now known as</p>
      <p>P*</p>
      <p>Yet the image or depiction is still too dimmed as to say with certainty what is going to happen in the near future.</p>
      <p>Note: * I guess I shouldn't have used the word "Experiment" because the word in itself would cause "chills", and for that I ask you to look at the word "Experiment" as if it was/is only a group of letters and not as secondary or tertiary meanings.</p>
      <p>Few free to ad more questions or comments. Please, I just ask of you to think in terms of PDP-1 MAC P*(PC) as elements composed of characters, refraining from connections to facts e/or persons.</p>
      <p>ps.: I used familiar colors as to keep it in a domestic perspective</p>
