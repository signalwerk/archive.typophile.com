  html: |-
    <p>Hi Everybody.</p>
    <p>I just uploaded some Pics of my new Project.<br>
    I'm really interested in your Opinion. Right now it was like one complete Week ok Work an i think i want to finish it in one month.<br>
    Lower and Uppercase follow different Rules. The lowercase is much more »scriptlike« than the uppercase.<br>
    I really like this difference but wanted titling-featues for some of the uppercase characters. I think there will be an titl and a final version for every lowercase letter plus a bunch of ligatures.</p>
    <p>Feel free to coment. Thanks.</p>
