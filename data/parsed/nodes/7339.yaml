    html: "<p>Dan,  <br> <br>using Poltawski in large size is what I would consider a rather experimental approach. I think Poltawski is a naiive and actually rather bad typeface which is not at all suitable for most of typesetting -- except some very particular texts with special flair.  <br> <br>I would actually go for typefaces that simply have well-designed Polish diacritics. Unfortunately, most of the Polish characters in fonts from large libraries are mediocre, bad or awful: Elsner+Flake, FontFont, Linotype, ParaType, URW++. I mean, that's nice that they make the effort -- other companies don't care about adding CE characters at all.  <br> <br>The noble exceptions are few: the OpenType TT \"Helvetica Linotype\" font is overall a well-researched design.  <br> <br>The Polish diacritics in FF Seria that Martin Majoor had made are actually pretty damn good, maybe even excellent! I think he said something of not caring about accents, but I think he just wasn't serious, just making fung. Or maybe, he meant that he doesn't especially \"care for accents\" but still gets them right.  <br> <br>Many of Adobe's OpenType \"Pro\" typefaces have reasonably done Polish diacritics (Myriad Pro, Minion Pro, Jenson Pro). Jovica Veljovic's designs (Sava, Silentium) are particularly good, the diacritics in Brioso Pro are also excellent.  <br> <br>Tiro Typeworks' recent fonts also have well-done diacritics but they aren't really currently available for retail sale. Gentium by Victor Gaultney, FF Maiola by Vik Burian, most of the OpenType typefaces by Andreas Seidel, Bliss by Jeremy Tankard -- all of them have reliable, good quality.  <br> <br>Most recent fonts from some selected smaller foundries have generally good Polish diacritics: House Industries, Thirstype, Lucas Fonts, Munch Fonts, Porchez, Typotheque. Storm's Polish diacritics are mostly OK, although some are not.  <br> <br>My personal favourites include: Helvetica Linotype (but, well, I designed the Polish letters so I'm biased ;) ), Valetta by John Hudson (unreleased), Fenway by Matthew Carter (available from C&amp;C I think), Zapfino Extra LT Pro. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  <br> <br>Regards,  <br>Adam Twardoch</p>"
