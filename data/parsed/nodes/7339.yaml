    html: <p>Thanks for the reply. <br> <br>I do clearly remember reading something about one of your type designs being a result of your living in/between two societies. I guess it wasn't Nexus, although both its name and my memory maintain at least a small doubt in me. It seems you're not the source of the confusion, but have you perhaps noted somebody who recently interviewed you or something make that "ideological" claim? I might have to backtrack my steps to get to the bottom of this... unless other Typophiles who have read about Nexus (or the other "mystery" font) can help out. <br> <br>As for the bit about "not liking accents", let me just play nice and say that we [probably] have very different ideas about how different languages/scripts should relate. It's OK, I have that problem with many people. :-) However please know that I base this not on "rumors", but on what I've read of/by you. <br> <br>hhp</p>
