    date_raw: 2 Nov 2004 — 4:35pm
    votes: null
    html: "<p>Hello gossip mongers, this is my first time to write a personal reaction on this typo site.  <br> <br> <br>&gt;Hmmm. And this is a font inspired by the relationship between eastern and western Europe?&lt;  <br> <br>Who said Nexus was inspired by the relationship between eastern and western Europe? I didn't. It is the biggest nonsense I have heard about my type designs. And then to think that I don't even like accents. The fact that I live in two countries (Holland and Poland) has not anything to do with this. <br> <br>The truth about Nexus is that it is based on Seria. However the proportions within the typeface are 'n\x03ormalized', that is to say that the x-height isn't that small as Seria, the ascenders and descenders are not that long as Seria, and there is a slanted italic instead of an  upright italic. Besides the for me obvious combination of seriffed font and sans seriffed font, I augmented a third version, a slab serif that I called Nexus Mix (the word 'slab' is such a stupid name, it reminds me of a slab of bread with a slab of dutch cheese). <br> <br>Nexus is much more easy to use than Seria (Seria works fine for people who understand typography, it is not a font that you can automatically set in 10 to 12 point). And the third member, Nexus Mix, gives a lot of extra possibilities for complex or scientific typography. <br> <br>During ATypI Prague 2004 I handed out a mini typespecimen of the Nexus family, explaining about it's idea. The text was as follows: <br> <br> <br> <br>Between 1988 and 1994 Martin Majoor designed Scala and Scala Sans. The idea behind Scala was to design a seriffed, humanistic typeface from which a sans serif version would be derived. Majoor called it: Two typefaces, one form principal, and it would become the basis of his type design philosophy. <br> <br>Scala is a large family, and in the more than ten years of its existance especially the combination of a seriffed version and a sans seriffed version has proven to be highly succesfull in corporate design, in book design and in newspaper design. Now, 10 years later, Majoor has changed his idea of Two typefaces, one form principal into Three typefaces, one form principal, with a new family of typefaces as a result. <br> <br>FF Nexus</p>"
    html_clean: "<p>Hello gossip mongers, this is my first time to write a personal reaction on this typo site.  <br> <br> <br>&gt;Hmmm. And this is a font inspired by the relationship between eastern and western Europe?&lt;  <br> <br>Who said Nexus was inspired by the relationship between eastern and western Europe? I didn't. It is the biggest nonsense I have heard about my type designs. And then to think that I don't even like accents. The fact that I live in two countries (Holland and Poland) has not anything to do with this. <br> <br>The truth about Nexus is that it is based on Seria. However the proportions within the typeface are 'n\x03ormalized', that is to say that the x-height isn't that small as Seria, the ascenders and descenders are not that long as Seria, and there is a slanted italic instead of an  upright italic. Besides the for me obvious combination of seriffed font and sans seriffed font, I augmented a third version, a slab serif that I called Nexus Mix (the word 'slab' is such a stupid name, it reminds me of a slab of bread with a slab of dutch cheese). <br> <br>Nexus is much more easy to use than Seria (Seria works fine for people who understand typography, it is not a font that you can automatically set in 10 to 12 point). And the third member, Nexus Mix, gives a lot of extra possibilities for complex or scientific typography. <br> <br>During ATypI Prague 2004 I handed out a mini typespecimen of the Nexus family, explaining about it's idea. The text was as follows: <br> <br> <br> <br>Between 1988 and 1994 Martin Majoor designed Scala and Scala Sans. The idea behind Scala was to design a seriffed, humanistic typeface from which a sans serif version would be derived. Majoor called it: Two typefaces, one form principal, and it would become the basis of his type design philosophy. <br> <br>Scala is a large family, and in the more than ten years of its existance especially the combination of a seriffed version and a sans seriffed version has proven to be highly succesfull in corporate design, in book design and in newspaper design. Now, 10 years later, Majoor has changed his idea of Two typefaces, one form principal into Three typefaces, one form principal, with a new family of typefaces as a result. <br> <br>FF Nexus</p>"
