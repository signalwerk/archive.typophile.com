    html: <p>At first I thought this might be one of the several Bodoni italics without a serif on the bottom of the C. But then the upper part of that C makes me think that this is just a manually slanted roman - which could put this into the hundreds of Century-style fonts. Add to that the very different lower part of the two low-res G's. Yikes ... I'm afraid I give up, Tom.</p>
