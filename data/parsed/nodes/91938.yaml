      <p>My approach when creating compound shapes like this in Illustrator is not to rely on what I see on the screen but to do some thinking first and work out some dimensions and create objects to these precise dimensions. Rounding off the dimensions makes it easier to do the sums (52mm rather than 52.84mm for example).</p>
      <p>Then I can use the Move function and/or x and y co-ordinates to position things accurately. In very complex shapes I also position the first shape in this way so that I know exactly where it is located within the artboard.</p>
