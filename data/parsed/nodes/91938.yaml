    html: |-
      <p>First thing to add, you can scale up your vector graphic, making it easier to see the small joins etc. and then scale it back down.</p>
      <p>Use align pallet and groups- i.e. first two circles, group, second two (bigger circles) align and group. Align the two groups, make your shape from the centre using the pathfinder (divide, for example) and then use either the Effect&gt;Stylize&gt;Round Corners or the slightly more precise script "Round Any Corner" that can be found here:</p>
      <p><a href="http://vector.tutsplus.com/articles/web-roundups/20-free-and-useful-adobe-illustrator-scripts/" title="http://vector.tutsplus.com/articles/web-roundups/20-free-and-useful-adobe-illustrator-scripts/">http://vector.tutsplus.com/articles/web-roundups/20-free-and-useful-adob...</a></p>
