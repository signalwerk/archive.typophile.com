      <p>Maybe you have activated Align to grid (View menu) or the hideous Align to pixel grid (Transform panel options).</p>
      <p>Now, vector drawing is not a lot like geometrical construction. I would rather do that by drawing a straight corner outline and then rouding the corners with the software.</p>
