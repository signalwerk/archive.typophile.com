    <p>Hello everyone,</p>
    <p>I am trying to get more comfortable with vector editing software these days (Adobe Illustrator in particular) and I have sort of a workflow question.</p>
    <p>Let's say I'm trying to achieve a kinda extended letter "o" shape.</p>
    <p><img src="http://typophile.com/files/0.jpg" alt="extended_letter_shape"></p>
    <p>I would start with the outer vector path.</p>
    <p><img src="http://typophile.com/files/1_61.jpg" alt="extended_letter_shape"></p>
    <p>I have seen some people combining a shape out of several other ones.</p>
    <p><img src="http://typophile.com/files/2_49.jpg" alt="extended_letter_shape"></p>
    <p>But when I have to place every part in it's exact place, I can't put them in exact spots where they need to be. As a result I end up with tiny overlappings and vector imperfections. This is what I roughly get:</p>
    <p><img src="http://typophile.com/files/3_27.jpg" alt="extended_letter_shape"></p>
    <p>It would be nice to know what would be your approach to such a task.<br>
    What's the fastest way?</p>
    <p>Thanks.</p>
