      <p>I guess this is an old thread, but—</p>
      <p>I very rarely construct shapes out of primitives. I'll use primitives to make guides (View&gt;Guides&gt;Make Guides), and then I'll just draw my shape with the pen tool. If I really want it to be perfectly symmetrical, I'll draw half or a quarter of it and then flip it along its edge and combine using the Pathfinder.</p>
      <p>Basically what I'm saying is, don't be afraid of actually drawing.</p>
