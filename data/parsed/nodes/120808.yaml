    <p>Hello,</p>
    <p>I have an art project where I want to print a whole bunch of tiny text onto paper. </p>
    <p>The idea is to give out magnifying glasses to patrons so that people can read the tiny text. I want the text to be as small as possible, but still legible using a visual aid like a magnifying glass. It is fine to have the text not legible without a magnifying glass though.</p>
    <p>I suspect that a printer's DPI would be important in figuring out the smallest size since you need to fill a character's stroke with sufficient number of dots (ie. ink). For sake of discussion, let's assume the printer is a commercial printer who mass prints books.</p>
    <p>How small in pts can I print the text?</p>
    <p>Any help is appreciated. Thanks.</p>
  html_clean: |-
