      <p>Since you need to be able to give the magnifying glasses away, that lets out using a Scanning Tunneling Electron Microscope for the instrument of magnification... looking into microfilm, microfiche, and "microcard", as well, shows that the lower limit is rather vague. Microprinting as a security feature on currency is another thing to examine (ah, that's been mentioned).</p>
      <p>With even a 300 dpi laser printer, one can go rather small - on a good one, one could actually read text in a 5x7 dot matrix style.</p>
      <p>And a while back I had been seeing ads for a version of Ian Fleming's novel <em>Casino Royale</em> in small printing that was a poster you could put on your wall.</p>
