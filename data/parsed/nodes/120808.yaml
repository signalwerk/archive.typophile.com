      <p>Note that at sizes smaller than -- guestimating here -- around 4 pts some additional factors come into play: the roughness of the paper, and the thickness of the ink or toner. Even with super-smooth paper, ink may spread out (the same problem as when trying to accurately produce an exact level of gray, where it is called "dot gain") and toner may not be delineated sharply.</p>
      <p>Once, while retouching small faults in a bitmap image -- which, by all rights, should have reproduced faithfully -- I inserted my initials in it with 5 pixel high characters into the dot of an 'i'. Unfortunately, after offset printing, the ink had run ever so slightly. The dot was visibly not 'sharp' anymore, but that was about it.</p>
