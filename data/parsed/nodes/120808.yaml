      <p>Typonaut wrote:</p>
      <blockquote><p>Nobody has mentioned DPI yet. Is everyone making an assumption on the DPI? I may be missing out on something significant, but is everyone assuming a DPI of 300? Aren't there commercial book printers who can print at higher DPI than 300?</p></blockquote>
      <p>There are very few printers that output at resolutions of 300 dpi. I think you're confusing the 300 ppi that's a common resolution of photos and scanned imagery intended for printing at about 150 lpi.</p>
      <p>Type is typically vector-based, so resolution is irrelevant. Unless the typography is printed with a screen tint, the 150 lpi is also irrelevant.</p>
      <p>What is relevant is the resolution of the output device. An inexpensive B&amp;W laser printer typically prints at least at 600 dpi. The output resolution of a typical commercial-quality imagesetter or platesetter typically varies between 1200 and 4800 dpi. The resolution of microprinting used for anti-counterfeiting purposes on currency is even higher than that.</p>
