      <p>Interesting previous thread <a href="http://typophile.com/node/7941">http://typophile.com/node/7941</a> which chose Meta, Bell Gothic, Galfra, Clottes, Nomina, Asphalt, Bell Centennial, Retina, Yellow, Adsans, Colorado, Delia, Amplitude, Rialto Pressa<br>
      Another previous thread <a href="http://typophile.com/node/83492">http://typophile.com/node/83492</a><br>
      The fonts designed for tiny printing, size agate and below, often have relatively huge ink traps and look truly strange when magnified.<br>
      One of the places where printers pushed the size of fonts to the tiny is telephone directories. See some comments on Luc Devroye's phone page <a href="http://luc.devroye.org/phone.html">http://luc.devroye.org/phone.html</a><br>
      Also <a href="http://www.martinmajoor.com/2.2_telefont_article_eye.html">http://www.martinmajoor.com/2.2_telefont_article_eye.html</a><br>
      And on the magnifying glass issue <a href="http://pressf1.pcworld.co.nz/showthread.php?124832-Small-font-in-new-telephone-book">http://pressf1.pcworld.co.nz/showthread.php?124832-Small-font-in-new-tel...</a><br>
      Other places where printing is too small for reasonable reading, even with a magnifying glass are the credits on DVD covers and the leaflets of legalese sometimes stuffed in product packages. What's the point of printing it if almost no one can read it?<br>
      Don</p>
