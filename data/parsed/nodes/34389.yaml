  - id: 209208
    user: 18019
    date: 2007-06-15T23:31:00
    date_raw: 15 Jun 2007 — 11:31pm
    votes: null
    html: |-
      <p>I went back through my original working files for several of the fonts I've done. Each one started at a different size, from less than an inch to several inches high. I don't remember any of them giving me trouble as far as drawing accurately. Unless you use the arrow keys to nudge points alot, I can't see where it would matter in the drawing.</p>
      <p>On the other hand, 700 UPM in FontLab = 700 points in Illustrator, or 9.722 inches. If you know your caps are going to be 700 UPM in FontLab, you could begin at that size in Illustrator. Then the glyphs paste perfectly into FontLab with no resizing required.</p>
