    <p>I am having problems with sizes when I am pasting into fontlab. I know there is a certain size you should set up your illustrator file, something to do with the em square? I couldn't find it in the wiki. Would that be in points? Death to inches.</p>
    <p>Also, I was wondering what common ways of setting up guides were. Some people draw straight into fontlab, but I have a shit-ton of guides set up in my illustrator file, with layers and such. It doesn't seem to be very efficient, or accurate.</p>
    <p>Thanks for your input and secret guide techniques.</p>
    <p>Terrance<br>
    <a href="http://www.typeterrance.com" title="www.typeterrance.com">www.typeterrance.com</a></p>
