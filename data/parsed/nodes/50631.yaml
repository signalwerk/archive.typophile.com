    <p>The Adobe Media Player came bundled with the Adobe Reader 9 download recently. Having taken it for a spin, it appears to replicate what’s available at <a href="http://tv.adobe.com" title="http://tv.adobe.com">http://tv.adobe.com</a>, only in an Adobe AIR wrapper so as to masquerade as a desktop application, apparently. </p>
    <p>I was struck by the typeface used in the Media Player, and at Adobe TV—it’s not Cronos, or even Thomas Phinney’s Hypatia Sans, the most-recent sans serif from Adobe. What could it be? </p>
    <p>I took a look at the lower-case “l,” and it appears to match up with the lower-case “l” in the “Fl” CS3/CS4 icon for Flash. I think that the font in question must be Robert Slimbach’s forthcoming tentatively-titled Gauge.</p>
    <p>I rather like it—and can’t wait to see what the entire family looks like.</p>
    <p>Another usage of the purported Gauge appears on Adobe’s Experience Design Team’s blog, at <a class="freelinking-external" href="http://xd.adobe.com">http://xd.adobe.com</a>. That site, like Adobe TV, is constructed in Flex, and uses Flash to render on-screen. (Viewing the site with the Flash 10 player shows off the enhanced anti-aliasing as compared with Flash 9, BTW.) Some folks have quibbled with the site’s usability—creating it in Flex/Flash takes away some HTML/browser usefulness with regards to navigation and accessibility—but the visual effect is wonderful (especially being able to embed all the fonts, and not resorting to using the SiFR workaround with HTML for setting headlines, for instance).</p>
    <p>So—do you think the typeface is Slimbach’s forthcoming Gauge?</p>
    <p>—Kent</p>
