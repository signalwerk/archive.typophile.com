      <p>Well, I’ll bet he didn’t want people *exactly* to know how he did it, but he wanted them to know it was something new. The Church was very interesting in printing, because you could certify a master translation, and only print that. And Gutenberg must have been very interested in the Church. Whatta market!</p>
      <p>Gutenberg’s acutal printing career only lasted about 10 or 15 years, I think (it depends on whether you think he invented printing earlier, while living in Strasbourg, or after he had already returned home to Mainz). Didn’t the colophon of one of his later books attribute its production to the magical art of printing, or something like that?</p>
