    <p>Hello! </p>
    <p>I'm looking for a typeface to use in big quotations (like 40 pt) for a text about food, supermarket, packaging, etc.</p>
    <p>For the current text I'm using Sentinel ( <a href="http://www.typography.com/fonts/font_overview.php?productLineID=100034" title="http://www.typography.com/fonts/font_overview.php?productLineID=100034">http://www.typography.com/fonts/font_overview.php?productLineID=100034</a> )</p>
    <p>I thought about:</p>
    <p>Brothers ( <a href="http://www.emigre.com/EF.php?fid=83" title="http://www.emigre.com/EF.php?fid=83">http://www.emigre.com/EF.php?fid=83</a>)</p>
    <p>Cooper</p>
    <p>Los Feliz ( <a href="http://www.emigre.com/EF.php?fid=102" title="http://www.emigre.com/EF.php?fid=102">http://www.emigre.com/EF.php?fid=102</a> ) </p>
    <p>Tomate ( <a href="http://new.myfonts.com/fonts/jazzfonts/tomate/" title="http://new.myfonts.com/fonts/jazzfonts/tomate/">http://new.myfonts.com/fonts/jazzfonts/tomate/</a> )</p>
    <p>What do you suggest?</p>
    <p>Thank you!</p>
