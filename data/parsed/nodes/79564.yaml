      <p><a href="http://www.daltonmaag.com/browse/custom/clients/tesco" title="http://www.daltonmaag.com/browse/custom/clients/tesco">http://www.daltonmaag.com/browse/custom/clients/tesco</a></p>
      <p>Especially the bold. It has micro detailing which looks good big in the store, interesting not "clean" (reductive) and cold, with a suggestion of the nostalgic touch of hand lettering -- from a time (false memory) when food when simpler, purer and more natural.</p>
      <p>I'm sure there are similar fonts commercially available.</p>
