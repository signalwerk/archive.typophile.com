  html: "<p><b>Announcing the first annual <br>Typophile t-shirt design contest.</b> <br> <br>Through August 30th, Typophile is holding open submissions for our first annual Typophile t-shirt design contest.  <br> <br>Design submissions will be posted daily to the forums for public review and critique. Tune in daily and root on your favorite design. The final design will be decided by our guest panel of judges, who will judge the shirts on overall design, originality, and feasibility. <br> <br><b>Say hello to our guest panel of judges: </b> <br>Cyrus Highsmith (Font Bureau) <br>Jonathan Hoefler (The Hoefler Type Foundry) <br>Carlos Segura (T26) <br>Rich Roat (House) <br>Erik van Blokland (Letterror) <br> <br>The winning design will be printed and made available to all via Typophile. If your design is chosen, we'll send you three free shirts as thanks for your contribution, and make sure that you get proper credit for a job well done. <br> <br>Once you've downloaded the EPS template, submit your finished designs to <b>tee@typophile.com</b>. You many enter as many times as you wish. All work submitted will be posted to the forums anonymously for fair, impartial judgement and critique by your peers. <br> <br><b>Guidelines:</b> <br>_ Use the EPS template provided for download at <a href=\"http://www.typophile.com/downloads/\" target=\"_top\">http://www.typophile.com/downloads/</a> <br>_ The word </p>"
