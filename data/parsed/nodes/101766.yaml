    html: |-
      <p>It depends on what one considers a rip-off vs. legitimate revivals. While Phil Martin designed Polonaise as photo lettering in the early 1970's , there is a Type Revivals digitization named Chopin Script TR with an internal creation date of 1992. The earliest digitization named Polonaise I can find is URW's from 1999.</p>
      <p>AFAIK, Claude Pelletier's Chopin Script (1999?) is based on the original printed design.</p>
      <p>I know that the 1992 date is accurate, because Soft Horizons/Vertisoft cloned the TR version as ChaseCallas in 1993.</p>
      <p>If it's Phil Martin that was ripped off, who's to say that the digitized Polonaise is any less a rip-off than Chopin? Unless somebody KNOWS whether he gave permission, sold rights, or has an interest in any of these.</p>
      <p> - Herb</p>
