      <p>Thanks André,</p>
      <p>Hm... that may be an option for designing for the future, it would require obviously re-setting existing work. And isn't it quite difficult to predict a font that everyone will have on their computers? Perhaps Times New Roman? I can imagine there are fonts that most people using PCs running Windows will have but what about mac users or Linux users? Web designers get away with it by specifying families of fonts and by the web page's ability to re-size to cope with differences in fonts. But academic journals have footnotes and index entries and so on which rely on things being really tied down.</p>
      <p>Thanks for those links John,  I think that almost solves my current problem. It's interesting to note, though, that there is a difference between fonts Adobe creates and fonts Adobe licenses from other foundries in questions of embedding. For example my versions of Univers have a copyright which rests with Adobe but a trademark which goes back to Linotype/Monotype. Our company, which produces a journal which is sold online, have taken out an commercial product embedding license with Monotype for this (and another font) even though we probably initially licensed it in some way from Adobe. I find this kind of stuff really confusing.</p>
      <p><cite> Copyright (c) 1987, 1991, 1993, 1994 Adobe Systems Incorporated.  All Rights Reserved.Univers is a trademark of Linotype-Hell AG and/or its subsidiaries. </cite></p>
