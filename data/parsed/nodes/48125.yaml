    <p>G'day folks,</p>
    <p>I've just been asked today about supplying a pdf of a historical journal which I produce so that it can be placed online on an academic database. I wonder if any of you have come across this in your line of work. First a bit of background: from what I understand, most foundries are OK with font embedding in pdfs which are publicly distributed as long as they are set to print and preview and are not editable. However, if they are being offered for sale they become a commercial product and an additional embedding license needs to be purchased. Three questions:</p>
    <p>1. Are my assumptions about pdfs correct, (I guess most of my fonts are from ITC, Monotype and Adobe)?<br>
    2. From what I can tell, someone is not able to edit a pdf unless they have the fonts installed locally on their systems, do I need to apply additional security settings to pdf articles to prevent changing the document? In the past this has caused headaches with uploading content to the web.<br>
    3. Do articles or journals which are placed on academic databases like EBSCO or Informit count as commercial products? As far as I know the person submitting the journal isn't so much selling their journal as getting a small royalty (or copyright fee?) for each journal downloaded.</p>
    <p>thanks, in advance for any help</p>
