      <p>The thing is I'm not shopping anywhere, I already have the fonts,  but no real record of how the fonts were bought and at what date, so I really only have the font info in suitcase to go off; current EULAs for the relevant companies, and an assurance from my previous boss that a font audit was carried out in the past. If I find myself in any kind of position to buy fonts in the future I will undoubtedly be buying the fonts with the friendliest EULAs I can find.</p>
      <p>But, you're right, that commercial product reference does seem reasonably clear on distributing pdfs for a fee, but it just does seem like a different case with the academic database, where people aren't so much paying for the individual articles but paying a much smaller copyright/royalty fee that doesn't really reflect the cost of the publication. Perhaps this is splitting hairs.</p>
      <p>I also have trouble deciphering the table at fontembedding.com: does this mean that Adobe don't make the same stipulation between internal/business and commercial products? This may just solve the problem as the journal in question is set in Adobe Garamond from memory.</p>
