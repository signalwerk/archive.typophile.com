      <p>EULAs are what is known as adhesion contracts. Non-negotiable contracts that are largely punitive without providing the second party any benefit except to "take it or leave it" can be considered a violation of consumer statutory rights. Courts tend not to favor contracts seen as contra proferentem and most EULAs certainly fit the bill. It might benefit members here if the powers that be at Typophile take a pro-consumer stand on EULAs.</p>
      <p>Gerald</p>
