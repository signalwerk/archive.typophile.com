      <p>Software manufacturers, including font foundries, could resolve a LOT of the mystery of the EULA, by NOT marketing their wares as purchasable items as opposed to licensed items. I don't recall ever seeing "license now" in regard to the point of sale. But I just did leave the Adobe web site where it says "Buy." I think most folks don't realize they are only licensing software rather than owning. Most don't bother to read the EULA and don't understand there are restrictions on their "purchase." The BSA has done a remarkable job in protecting the rights of its members but I cannot find on their site anything about the problem of the uninformed or misinformed "licenser." Probably best kept under the rug. </p>
      <p>I asked three students about this tonight and none of them realized that they did not own the software they "bought." Though manufacturers are quite righteous in their EULA policy, it is somewhat mystifying why they are reluctant to inform the "buying" public about it up front. Likely, because they prefer the sale, and the sale might be hampered if the buyer thought twice about the idea of licensing. Disagree or Agree. Click the right button to proceed with "installation." Often though, especially when there is a physical product, this is after the "buyer" has submitted payment. It is not the consumer's fault that digital material cannot be adequately protected, and licensing is a deceptive practice to get around this problem.</p>
      <p>Gerald</p>
