    html: |-
      <p>Adobe's license terms for fonts wholly owned by Adobe (plus those licensed from Bauer), versus fonts sub-licensed from other foundries, differ only in whether they one can use them for "editable embedding."</p>
      <p>That is, fonts licensed from Adobe - including those Adobe sublicensed from Linotype and Monotype - do NOT require some additional license for "commercial embedding" or anything like that.</p>
      <p>So, if you licensed the original font(s) from Adobe, you wouldn't need to pay more money. If you licensed them from one of the foundries that has "commercial embedding" clauses in their EULA, then you'll have to see if what you want to do qualifies as "commercial embedding."</p>
      <p>(I write this wearing my official Adobe hat.)</p>
      <p>Regards,</p>
      <p>T</p>
