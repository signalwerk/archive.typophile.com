      <p>Thomas</p>
      <p>Yes, but you are assuming folks read the EULA, most don't. Last one I read was 60 some pages long, and when I was finished I had no idea what my rights were. Manufacturers know, and some probably count on the fact, that no one is going to read the EULA in detail if at all. See the following reference (from Google, search EULA $1,000):</p>
      <p>[When Doug Heckman was installing a PC Pitstop program, he actually read the EULA. In it, he found a clause stating that he could get financial compensation if he emailed PC Pitstop. The result: a $1,000 check, and proof that people don't read EULAs (3,000 people before him didn't notice it).]</p>
      <p>It's quite apparent that most folks don't know they are leasing because manufacturers are not up front about it. If they were folks just might not "buy" that proffered font.</p>
      <p>I just got an advertisement from a distributor of Adobe's offering a product with a Buy Now click button. I replied to the email asking if they were indeed selling the product or just a restrictive leasing arrangement. I think I am going to do that with every email solicitation I receive from now on.</p>
      <p>It's not hard to resolve the problem folks are having, or to prevent the problems they might encounter. Write EULAs in plain language and inform the consumer prior to purchasing just what it is they are being sold.</p>
      <p>Gerald</p>
      <p>Interesting tidbit: Anyone under the age of 18 is exempt from the contractual obligations of an EULA because they are not of legal age to enter into a binding contract. Which age group is responsible for most illegal copying of software?</p>
