      <p>charles_e raised precisely this problem a couple of weeks ago in a discussion of web fonts (<a href="/wiki/www.typophile.com/node/46896" class="freelinking" rel="nofollow">www.typophile.com/node/46896</a>).  There he described his having "recommended to publishers in the past that they not use certain foundries' fonts" based on strictures in their EULAs.</p>
      <p>I'd love to be corrected, but it seems to me that the "Internal/Business" embedding in fontembedding.com's chart, at least under the terms of Monotype's current license (and Linotype's now-similar version), precludes publishing in an online academic database without a "special" license.</p>
      <p>The powers that be apparently prefer to ignore the issue.  For example, the National Endowment for the Humanities convened a conference on "Supporting Digital Scholarly Editions" whose report manages nothing more useful than "there seemed to be a consensus in one group at least that ... digital and print editions would look identical" (<a href="/wiki/www.virginiafoundation.org/NEH%2520Workshop%2520Report%2520FINAL-3.pdf" class="freelinking" rel="nofollow">www.virginiafoundation.org/NEH%20Workshop%20Report%20FINAL-3.pdf</a>, p. 6).  Equally futile is searching for "typeface" or "font" in blogs on electronic publishing such as <a href="/wiki/www.futureofthebook.org/blog/" class="freelinking" rel="nofollow">www.futureofthebook.org/blog/</a> and <a href="/wiki/www.escholarlypub.com/digitalkoans/" class="freelinking" rel="nofollow">www.escholarlypub.com/digitalkoans/</a>.  Or check out the "Publisher Guidelines" PDF for Project Muse, whose mission is to put scholarly journals online.</p>
      <p>It is not hard to imagine scholarly articles becoming hostage to the EULAs for the typeface in which their initial publication was set, either to retain page breaks (thus ensuring that citations by page number remain valid) or to preserve slightly unusual diacritics.  All in all, not a happy situation.</p>
      <p>David</p>
