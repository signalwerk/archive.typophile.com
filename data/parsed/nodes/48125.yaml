      <p>Nicholas: The copyright and trademark info in the font is not important here. The question is, who did you license the font from, and under what EULA? That exact same font (with the same copyright and trademark info) can be licensed from either Adobe or Linotype, under quite different license terms. And yes, Adobe's license terms are essentially the same for fonts bundled with applications, except for the number of computers you can use the font on.</p>
      <p>Gerald: I'm not a lawyer, but the benefit of having and using the font seems like it is worth the restrictions placed by the license. If the user wasn't getting something out of the deal, I would think they wouldn't be willing to pay money for the privilege of agreeing to the EULA.</p>
      <p>Cheers,</p>
      <p>T</p>
