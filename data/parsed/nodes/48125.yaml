      <p>The best thing to do is to read the EULA of the fonts you're planning to use.</p>
      <p>On the technical side, the security settings of a PDF document are a separate matter from the embedding permissions of the fonts you may use in it.</p>
      <p>If a font has Preview &amp; Print embedding, it will be possible to embedded it in a document, but it won't be possible to edit the text of that document. You can, however, change other aspects of the document (e.g. page size, number of pages) if the security settings of the document so allow.</p>
      <p>If a font has Editable embedding, it will be possible to embedded it in a document and it will be possible to edit the text of that document. Depending on how the document was created, you may or may not need to have the font installed in the system to edit the document and maintain its fidelity re. fonts. The ability of editing the document will still be dependent on its security settings. If the document only allows printing, you won't be able to change it, even if the fonts used in it have Editable embedding permissions.</p>
