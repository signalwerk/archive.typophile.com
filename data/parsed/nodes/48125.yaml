      <p>True.</p>
      <p>It really does seem to be an obscure part of publishing knowledge, I get blank looks and/or disbelief that it could actually be that way when I bring it up, even from an expert in copyright. What I'd like in a EULA is instead of, or in addition to, obscure language buried in a long long document is upfront simple language guidelines when you buy, or if you've inherited a bunch of fonts like I have, prominently displayed on a website for example in a FAQ, instead of being buried in the legal or terms and conditions section</p>
      <p>I have to say I just don't understand and have never understood the internal/business thing. Does that preclude putting pdfs up on the web for free download? In my experience and my email conversations with folks at Monotype, it seems that the issue is if you charge for your electronic document; if it's a commercial product but I'm still not sure. But it seems strange to deem an academic article a commercial product. From Monotype:</p>
      <p> <cite> “Personal or Internal Business Use” shall mean Use of the Font Software for your customary personal or internal business purposes and shall not mean any distribution whatsoever of the Font Software or any component or Derivative Work thereof. “Personal or Internal Business Use” shall not include any Use of the Font Software by persons that are not members of your immediate household, your authorized employees, or your authorized agents. All such household members, employees and agents shall be notified by you as to the terms and conditions of the Agreement and shall agree to be bound by it before they can have Use of the Font Software </cite></p>
      <p><cite> 6.  “Derivative Work” shall mean binary data based upon or derived from Font Software (or any portion of Font Software) in any form in which such binary data may be recast, transformed, or adapted including, but not limited to, binary data in any format into which Font Software may be converted. </cite></p>
      <p><cite> 9.  “Commercial Product” as used herein shall mean an electronic document or data file created by Use of the Font Software which is offered for distribution to the general public (or to some subset of the general public) as a commercial product in exchange for a separate fee or other consideration. By way of illustration and not by way of limitation, an electronic book or magazine distributed for a fee shall be considered a Commercial Product; a document distributed in connection with a commercial transaction in which the consideration is unrelated to such document (for example, a business letter, a ticket for an event, or a receipt for purchase of tangible goods such as clothing) shall not be considered a Commercial Product </cite></p>
      <p>Is a pdf a component or a derivative work? Is a free pdf newsletter on a website internal/business? Is a pdf academic article which attracts a copyright royalty fee a commercial product?</p>
      <p>thanks for your thoughts guys.</p>
