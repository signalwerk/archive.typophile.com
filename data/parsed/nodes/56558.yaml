      <p>It's worth keeping in mind that those are *recommendations*, not necessarily requirements. I'm not sure who or what dreamed up the "first four glyphs" thing; I remember that making its way into the spec some years back but I also remember having made and used many fonts that don't meet that recommendation.</p>
      <p>The OpenType specification is fairly conservative; there are many things in there that are well out of date now that Windows 3.1, Mac OS 9, and other systems are officially or effectively dead.</p>
