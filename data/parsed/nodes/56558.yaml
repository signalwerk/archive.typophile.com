      <p>You'll have to ask someone who maintains the OpenType spec, or the MS Recommendations, about that. I'm just reporting what I know. The Adobe specs for glyphnames make it pretty clear that ".null" is not a legal name: <a href="http://www.adobe.com/devnet/opentype/archives/glyphnamelimits.html" title="http://www.adobe.com/devnet/opentype/archives/glyphnamelimits.html">http://www.adobe.com/devnet/opentype/archives/glyphnamelimits.html</a> (see #4, Length and Character Set Limitations on Names).</p>
      <p>But again, there are many, many fonts with glyphs named ".null" which work just fine in many different implementations.</p>
