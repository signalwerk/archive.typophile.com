      <p><strong>cuttlefish</strong></p>
      <p>Indeed, FontForge doesn't allow to set the glyph name to ".null". I think this might be a bug. However there is no reason to do that manually, as FontForge just automatically adds the first 3 glyphs (if they are missing) when outputting a TTF font. Of course, one would normally design the .notdef glyph manually and allow FontForge to create other two.</p>
      <p>Thus fonts generated with FontForge perfectly comply the recommendation at this point. You can check this by opening a TTF font file you have just generated and switching the encoding to "Glyph Order".</p>
