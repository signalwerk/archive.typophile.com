      <p><em>It won’t even allow me to set the name of uni0000 to “.null”</em></p>
      <p>That's a good thing, actually. ".null" is not a legal glyph name (cannot begin with ".", except for ".notdef"). uni0000 is fine...maybe try "null" if you're really bored.</p>
      <p><em>the only encoding that puts “.notdef” at glyph position 0 is Adobe Standard</em></p>
      <p>Are you sure you're looking at glyph order and not character code order when you view the other encodings? That seems really odd that it would not let you put .notdef as glyph 0 for other encodings.</p>
