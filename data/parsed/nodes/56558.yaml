    html: <p>Most apps/systems expect to see the missing glyph at id 0. Some also expect the space at id 3. Some things do actually use CR and .null but in many cases they're just filler so that 'space' ends up at id 3 :-)  Most apps don't actually use glyph data stored in CR, but I've seen some that do. I guess this is related to the glyph order thread; in this case I would say it's not a bad idea to follow the recommendation that Paul pointed out; though it's not hard to find fonts that don't follow this recommendation and still function just fine.</p>
