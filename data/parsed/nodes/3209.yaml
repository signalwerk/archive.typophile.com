    html: <p>Greetings Ferdinand, <br> <br>For anything multilingual I recommend you abandon Quark altogether. To use Cyrillic fonts you need the Passport version, and the fonts themselves have to be the old 8-bit versions (Adobe Cyrillic encoding or Windows codepage 1250, and I don't think the modes are interchangeable across platforms.) The encoding discrepancies end up being a nightmare. Even established type designers have difficulties making their fonts work for these non-Latin-1 environments, especially if their main font-building tool is still Fontographer. But this nightmare is easily solved by Unicode. If you have a Quark license already, I believe Adobe offers a reasonable competetive upgrade to InDesign 2.0. Try to look at this project of yours as an opportunity to get into InDesign. Personally I've grown to love the app and wouldn't use anything else. <br> <br>I really wish Quark <i>would</i> get on the Unicode bandwagon and adopt either OpenType or AAT support. The resulting competition might give Adobe an incentive to accelerate and refine their own OT support in their own applications. InDesign was at a disadvantage (in terms of its ability to sell OpenType) from the beginning since it's a brand new underdog. Illustrator, on the other hand, is arguably the vector-drawing market leader, so its upcoming OT support (if any) should prompt more OT font sales and perhaps give users further incentive to switch from Quark. But if you're dealing with Unicode, you already have all the incentive you need.</p>
