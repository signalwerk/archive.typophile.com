    html: <p> If your license is a typical 5-user one (like Adobe's), you just have to buy one OpenType font and install it on both machines. <br> <br>However, the regular version of QuarkXPress won't handle Cyrillic. On the Mac, even the Passport version of QXP can't use the Cyrillic characters in a Unicode font. However, importing a Windows Word doc with Cyrillic text into Mac InDesign, and setting it in an OpenType font, works just fine. That's how we did the Cyrillic text in our specimen books, as I recall. <br> <br>John Hudson did the book "Language Culture Type" in InDesign, but presumably on Windows. <br> <br>Of course, you're welcome to get somebody who doesn't work at Adobe to confirm this.  <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> </p>
