  html: "<p> hallo, <br>i have the following problem: a customer of me will send me word-documents (from a windows machine with cyrillic fonts) and I should use the texts of the word-docuemts to make a booklet in quark xpress (or indesign) with cyrillic fonts. <br> <br>I would like to know, if I would buy 2 opentype-fonts, then install one on the windows machine and the second on my mac, can I open the cyrillic texts without problems and import them into quark or indesign? <br>I read a lot on adobes website, but I would like to have somebody, whe can approve that from his experiences. <br>thanks for your help in advance! <br>yours sincerely <br>ferdinand </p>"
