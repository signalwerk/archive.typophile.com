    html: "<p> John: <br> <br>Interesting to me that you say \"either OpenType or AAT support.\" What do you think AAT's chance of survival or widespread adoption is, and why? <br> <br>Regards, <br> <br>T <br> <br>(Disclaimer: I work at Adobe, and have rather strong opinions in this area.) </p>"
    html_clean: "<p> John: <br> <br>Interesting to me that you say \"either OpenType or AAT support.\" What do you think AAT's chance of survival or widespread adoption is, and why? <br> <br>Regards, <br> <br>T <br> <br>(Disclaimer: I work at Adobe, and have rather strong opinions in this area.) </p>"
  - id: 25135
    user: 851
    date: 2002-09-12T13:15:00
    date_raw: 12 Sep 2002 — 1:15pm
    votes: null
    html: "<p>(Note that in the context of this post, the term \"AAT\" refers to the use of advanced AAT layout features in Latin-based fonts. Its more compelling features center around non-Latin international support, which is outside the scope of my work, though it does interest me.) <br> <br>I think AAT's chances are very slim. I think it will actually die out if Apple keeps it as an Apple-only format. Certainly there are very few compelling reasons to develop an AAT font. For better or worse, I seem to have stumbled onto one such reason. (See below...) <br> <br>However, if some company like Quark, Macromedia, Corel, or any other non-OS-selling non-competitor to Apple approached Apple and said \"we'd like to develop the next version of our app to include AAT support, provided you give us an AAT port to Windows,\" I think Apple would be more receptive than they were when Microsoft asked for it. My understanding is that it was an issue of money at the time, not just \"ewww yer Microsoft, no way.\" Keeping in mind, of course, that Microsoft worked with Apple on Truetype way back when. <br> <br>AAT has one main advantage over OT right now. It's fairly easy to build an AAT-savvy app for a Mac. In fact the tools to do it come in the box with Mac OS. I was able to do it myself in a single afternoon, and I happen to consider myself fairly crappy when it comes to coding Objective C. The case is not the same for OT. I don't know where I can get a stable, shipping OT support library that works pretty seamlessly with Mac OS just yet. ICU, Pango, and Sun's new Java-based library look promising, but they're not all really finished yet (at least when I last checked) and their open-source, Linux-heavy roots suggest that they likely won't include specific code that makes them easier to integrate with Aqua. X11, yes, but I'm not going to waste time struggling with a cruft-encrufted 20-year-old GUI environment with a million different ways to do the same thing, all poorly documented. X11 is the only piece of code that keeps Linux off the desktop. But that's another discussion. <br> <br>Now I keep hearing that Apple is working on adding OT feature support to the AAT Cocoa libraries, which would be a godsend. Strangely, Apple doesn't seem as averse to OT as you Adobe folks are to AAT. And I'd personally prefer OT support inside AAT, cos right now I'm working on a project for a customer, and we just finished the OT features, and I'm \"porting\" them to <a href=\"http://fieldworks.sil.org\" target=\"_top\">Graphite</a> so Windows users can get to them without spending $700 on InDesign. I hope that the XML-based AAT tools that Apple unveils at the upcoming ATypI will let me do the same for AAT, so users of this font who own Macs can use it in WorldText instead of buying InDesign. <br> <br>Not that I have anything against InDesign, it's just hard to convince the home user market to fork out $700 to use a font, especially when they only need it rendered in a simple text-editor way. <br> <br>So OT has almost every piece of the puzzle: a shipping app, more apps on the way, shipping fonts, font feature development tools, and pretty good support from Windows. AAT has the one missing piece I need, which is support for developing feature-savvy <i>applications</i> for MacOS. <br> <br>If Adobe suddenly released an SDK that let app developers use OT features on MacOS (essentially CoolType or a subset thereof) then I would see no reason for AAT's continued existence. <br> <br>If Adobe suddenly released a simple OT-savvy text editor (with printing enabled) for MacOS and Windows, I wouldn't have to mess with AAT <i>or</i> Graphite. I'm dealing with these technologies because they come with free feature-savvy text editors. Conclude for yourself how silly I feel about this. <br> <br>--John <br> <br>P.S. Graphite does some pretty cool stuff, if you haven't checked it out yet. John Hudson suggested it to me a while back. I wish they had a Mac version.</p>"
