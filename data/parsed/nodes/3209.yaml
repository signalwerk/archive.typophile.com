    html: <p>I don't think there's any major part of this analysis I'd disagree with, except that I'm dubious as to whether Apple would port AAT in exchange for a single developer's support. I'm also dubious as to whether any single app developer (other than Microsoft and Adobe) could release a new AAT-friendly app and generate sufficient demand for AAT fonts. I suppose one could argue that Quark could do it. However, if they weren't doing it for version 6, I think it would be far too late for them to change the direction of the type industry by version 7. <br> <br>Cheers, <br> <br>T</p>
