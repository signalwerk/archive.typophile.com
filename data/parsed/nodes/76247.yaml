    <p>Minority Language in Today's Global Society: Alive and Digital</p>
    <p>Saturday, Nov. 20th, 10:00 am- 5:00 pm<br>
    Sunday, Nov. 21st, 10:00 am – 5:00 pm</p>
    <p>Location: Trace Foundation's Latse Library, 132 Perry Street, 2nd Floor, NY, NY 10014</p>
    <p>More info and registration: <a href="http://www.trace.org/events/events.html#digital" title="http://www.trace.org/events/events.html#digital">http://www.trace.org/events/events.html#digital</a></p>
    <p>In this digital age, technology is playing an increasingly important role in both the preservation and development of minority languages. From blogs and video sharing to text messaging and social media, powerful technologies are shaping the future of minority languages. This movement is stretching the boundaries of minority language communities beyond “geographical place” into a “digital place,” bringing together communities from all regions of the world.</p>
    <p>What technological breakthroughs lie ahead and how is technology impacting linguistic minorities worldwide? Alive &amp; Digital, the sixth and final event in Trace Foundation’s first lecture series, Minority Language in Today’s Global Society, will bring together scholars and experts who have worked extensively on minority language preservation and new technologies.</p>
    <p>On Saturday, November 20th, a diverse group of speakers will discuss past and present trends in the relationship between technology and language, providing insightful, cross-cultural perspectives. On Sunday, November 21st, we will explore technological issues specific to the Tibetan language including, the Tibetan font converter, Unicode, and i-phone applications.</p>
    <p>Through engaging lectures and discussion, Alive &amp; Digital aims to draw attention to the ongoing developments in technologies and the corresponding benefits they bring to the vitality and viability of minority language in our digital future.</p>
    <p>Speakers:</p>
    <p>David Nathan, Director, Endangered Languages Archive, SOAS</p>
    <p>Lobsang Monlam, Developer of Monlam Tibetan font</p>
    <p>Christopher Walker, Northwestern University</p>
    <p>Christopher Fynn, Dzongkha Development Commission</p>
    <p>Sonam Chusang, Developer of iPhone applications for the Tibetan Language</p>
    <p>Jeff Wallman, Tibetan Buddhist Resource Center</p>
    <p>additional speakers to be announced</p>
