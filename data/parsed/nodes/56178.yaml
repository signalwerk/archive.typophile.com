  - id: 337877
    user: 1133
    date: 2009-03-25T22:28:00
    date_raw: 25 Mar 2009 — 10:28pm
    votes: null
    html: |-
      <p>Mike, </p>
      <p>if you leave it unchecked at all times, all your fonts will be slightly larger, and they will generate faster, but there will be no other impact on the functionality. In general, it is allright to leave the compression enabled. But in case of highly modularized fonts which are made of repetitive elements, you'll need to turn the compression off -- because of the bug. </p>
      <p>The next version, FontLab Studio 6 (no release date yet) will use the new Adobe FDK for OpenType 2.5 which no longer has this problem so people will be able to leave compression enabled at all times. </p>
      <p>Cheers,<br>
      Adam</p>
