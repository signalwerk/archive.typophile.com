    date_raw: 25 Mar 2009 — 7:19pm
    votes: null
    html: |-
      <p>There is a shared problem of Apple, Adobe FDK for OpenType and FontLab when it comes to subroutine compression of highly modularized fonts. Disable the subroutine compression in OpenType PS generation preferences in FontLab Studio and you should be good to go. </p>
      <p>Cheers,<br>
      Adam</p>
    html_clean: |-
      <p>There is a shared problem of Apple, Adobe FDK for OpenType and FontLab when it comes to subroutine compression of highly modularized fonts. Disable the subroutine compression in OpenType PS generation preferences in FontLab Studio and you should be good to go. </p>
      <p>Cheers,<br>
      Adam</p>
