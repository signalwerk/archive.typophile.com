      <p><em>Kleck, whose methodology has been severely criticised by others—though the NRA quotes him often.</em></p>
      <p>I guess it comes down to being a case where statistics can prove any point, depending on what you want your outcome to be. Here’s what the NRA says about one study refuting Kleck:</p>
      <p>To produce the misleading ratio from the study, the only defensive or protective uses of firearms that were counted were those in which criminals were killed by would-be crime victims. This is the most serious of the study’s flaws, since fatal shootings of criminals occur in only a fraction of 1% of protective firearm uses nationwide.<br>
      ———<br>
      But to go in another direction, this is from Wikipedia:</p>
      <p>In Florida, which first introduced “shall-issue” concealed carry laws, crimes committed against residents dropped markedly upon the general issuance of concealed-carry licenses, which had the unintended consequence of putting tourists in Florida driving marked rental cars at risk from criminals (since tourists may be readily presumed unarmed.) Florida responded by enacting laws prohibiting the obvious marking of rental cars. With this change, crime rates continued to fall alongside the issuance of concealed weapons licenses.<br>
      ——————-<br>
      In the end, I believe you will believe what you want to believe.<br>
      : )</p>
