      <p>Pointing out an egregious instance of ignorance is not name-calling; it is pointing out an egregious instance of ignorance. Ignorance is no crime: we are all born ignorant, and we overcome it to greater or lesser degrees as we grow older. The title of this particular forum is “General Discussions,” which would seem to imply that give-and-take are the order of the day here. Persons who believe themselves to be in possession of Absolute Truth (that is, the Ignorant Militant) do not, by definition, allow much latitude for discussion: they wish to state their “considerable opinion” (thank you, William Golding) and have it affirmed, praised, perhaps even worshipped. That is <strong>not</strong> a discussion: it’s a sermon.</p>
      <p>People who think they have all the answers aren’t asking the right questions.</p>
