    <p>Hello,</p>
    <p>Im working on my first typeface, a condensed slab serif. I haven't any direct influences, I just thought it would be fun to make a really condensed slab serif.  It's the first time I do something like this and the main goal is to learn as much as possible. I realized that making a condensed typeface may not be the best thing to start out with if you want to learn all the classic proportions, but I went for it anyways. </p>
    <p>It's all done from scratch and it's meant to be used in sizes 16-48pt. I haven´t worked anything with the kerning och spacing yet.</p>
    <p>I appreciate all the input that I can get!</p>
