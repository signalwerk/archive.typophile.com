      <p>Good curve shapes.<br>
      The thinning of the tails of Q, y, j are definitely out of place; get them up to slab weight.<br>
      Bottom half of S is looking comparatively heavy.<br>
      Consider making the bowl of P taller.<br>
      Maybe restructure the M to ameliorate the clotting of the top corners.<br>
      6 and 9 could stand to be a little less square.</p>
