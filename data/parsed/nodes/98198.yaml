      <p>I would:<br>
      - Shorten the descenders.<br>
      - Give the "f", "j" and "r" full curls. Not sure about the "y".<br>
      - Have full double serifs at the top of the "A".<br>
      - Give the "J" a full curl, and maybe not make it descend.<br>
      - Make the "Q" not so wimpy.</p>
      <p>hhp</p>
