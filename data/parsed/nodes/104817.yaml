      <p>Several very similar fonts would fit with varying degrees of closeness. Don't know when the Hermès Logo was designed, but it seems a good prospect that the designer based it on <a href="http://www.myfonts.com/fonts/linotype/memphis/" rel="nofollow">Memphis</a>, designed by Rudopf Wolf for Stempel in 1929.<br>
      Don</p>
