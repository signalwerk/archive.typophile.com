    html: |-
      <div class="comment-spam-body"><p>More info:<br>
      ---start quote---</p>
      <p>Hermès font here refers to the font used in the logo of Hermès, which is a French high fashion house specialized in manufacturing leather products, perfumes and apparel.</p>
      <p>The logo of Hermès that has been used since 1950s features a Duc carriage with horse, which represents Hermès’ beginning as a harness workshop. Beneath the carriage with horse is the logotype of Hermès as well as the lettering of “Paris”, where Hermès was established and has been headquartered. The font used for the lettering of Hermè is very similar to a font called Memphis Medium.</p>
      <p>---end quote---<br>
      source: <a href="http://fontmeme.com/hermes-font/" title="http://fontmeme.com/hermes-font/">http://fontmeme.com/hermes-font/</a><br>
      Don</p>
      </div>
