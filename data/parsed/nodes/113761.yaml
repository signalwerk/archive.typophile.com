  html: |-
    <p>I've got this In my CSS.</p>
    <p><code>@font-face {<br>
     font-family: '20th Century Font';<br>
      src: url(<a href="ftp://www.mysite.com/forum/fonts/20THBOLD.TTF" title="ftp://www.mysite.com/forum/fonts/20THBOLD.TTF">ftp://www.mysite.com/forum/fonts/20THBOLD.TTF</a>);<br>
    }</code></p>
    <p>Have tried calling it with all different names, but it refuses to show. How do I find the name I need to call in CSS. NexusFont tells me the postscriptname is 20thCenturyFontBold, but that doesn't work. I've tried many combinations... </p>
    <p>Do I need to add something to the header as well to force the remote computer to download it?</p>
