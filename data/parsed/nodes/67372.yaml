    <p>Found this type sample in a book called "The Type Specimen Book, 544 Different Typefaces with over 3000 sizes shown in complete alphabets"</p>
    <p>In the book its labeled as Standard (Foundry). </p>
    <p>I have found digital version however neither seem to match. Can anyone suggest a closer match.</p>
    <p>I have convinced the client into using the font, now I have to deliver a digital version of this rare sample, so I would greatly appreciate any ideas. It is a beautiful font and is definitely markedly different from Helvetica for example.</p>
