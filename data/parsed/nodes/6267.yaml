    date_raw: 3 Feb 2003 — 11:44pm
    votes: null
    html: "<p>I would make the top part of the t even just a little bit shorter. Not too much, but just enough to really distinguish it from the ascender of the l very clearly. <br> <br>The g is a real problem. I don't think you can make that left side so weak: not along the whole length at least. Try keeping the narrowing on the lower right, but strengthen the stroke again as it comes through the lower left. The transition you probably need is similar to what you have in the c. Also, you might try a version with a hook descender, but without the complete loop. <br> <br>By the way, the recent change to the y is excellent: exactly what I would have recommended.</p>"
