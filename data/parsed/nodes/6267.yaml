    html: "<p>Mauro, there are some very nice things happening in this design. A few comments: <br> <br>The g might be a little weak, but it is hard to tell without seeing it in the middle of a word. Certainly, it looks weak at the beginning of a word. <br> <br>The j is too heavy. <br> <br>As others have noted, the e is probably too ornate. More to the point, the flourish is actually out-of-style with the rest of the letters, which are very direct and gestural. <br> <br>The t may be a problem because it is so similar to the l. Try making it shorter? It looks good in the tz ligature, but not so good next to the l at the end of Quetzalcoatl.</p>"
    html_clean: "<p>Mauro, there are some very nice things happening in this design. A few comments: <br> <br>The g might be a little weak, but it is hard to tell without seeing it in the middle of a word. Certainly, it looks weak at the beginning of a word. <br> <br>The j is too heavy. <br> <br>As others have noted, the e is probably too ornate. More to the point, the flourish is actually out-of-style with the rest of the letters, which are very direct and gestural. <br> <br>The t may be a problem because it is so similar to the l. Try making it shorter? It looks good in the tz ligature, but not so good next to the l at the end of Quetzalcoatl.</p>"
