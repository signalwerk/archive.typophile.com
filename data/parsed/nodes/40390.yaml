  html: <p>Horizontal and in most instances linear <a href="/node/add/wiki?edit%5Btitle%5D=stroke" title="Create node &quot;stroke&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">stroke</a> connecting two halves of a capital such as <a href="/node/add/wiki?edit%5Btitle%5D=A" title="Create node &quot;A&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">A</a>, <a href="/node/add/wiki?edit%5Btitle%5D=H" title="Create node &quot;H&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">H</a>, or that bisecting <a href="/node/add/wiki?edit%5Btitle%5D=E" title="Create node &quot;E&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">E</a> and <a href="/node/add/wiki?edit%5Btitle%5D=F" title="Create node &quot;F&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">F</a>. Cross strokes also occur as the projecting stroke of <a href="/node/17241" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Lower Case</a> letters <a href="/node/add/wiki?edit%5Btitle%5D=f" title="Create node &quot;f&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">f</a> and <a href="/node/add/wiki?edit%5Btitle%5D=t" title="Create node &quot;t&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">t</a> going across the stem horizontally, as well as the spanning stroke of <a href="/node/add/wiki?edit%5Btitle%5D=e" title="Create node &quot;e&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">e</a>.</p>
  html_clean: <p>Horizontal and in most instances linear <a href="/node/add/wiki?edit%5Btitle%5D=stroke" title="Create node &quot;stroke&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">stroke</a> connecting two halves of a capital such as <a href="/node/add/wiki?edit%5Btitle%5D=A" title="Create node &quot;A&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">A</a>, <a href="/node/add/wiki?edit%5Btitle%5D=H" title="Create node &quot;H&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">H</a>, or that bisecting <a href="/node/add/wiki?edit%5Btitle%5D=E" title="Create node &quot;E&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">E</a> and <a href="/node/add/wiki?edit%5Btitle%5D=F" title="Create node &quot;F&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">F</a>. Cross strokes also occur as the projecting stroke of <a href="/node/17241/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Lower Case</a> letters <a href="/node/add/wiki?edit%5Btitle%5D=f" title="Create node &quot;f&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">f</a> and <a href="/node/add/wiki?edit%5Btitle%5D=t" title="Create node &quot;t&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">t</a> going across the stem horizontally, as well as the spanning stroke of <a href="/node/add/wiki?edit%5Btitle%5D=e" title="Create node &quot;e&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">e</a>.</p>
