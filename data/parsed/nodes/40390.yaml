  html: <p>Horizontal and in most instances linear <a href="/wiki/stroke" class="freelinking" rel="nofollow">stroke</a> connecting two halves of a capital such as <a href="/wiki/A" class="freelinking" rel="nofollow">A</a>, <a href="/wiki/H" class="freelinking" rel="nofollow">H</a>, or that bisecting <a href="/wiki/E" class="freelinking" rel="nofollow">E</a> and <a href="/wiki/F" class="freelinking" rel="nofollow">F</a>. Cross strokes also occur as the projecting stroke of <a href="/wiki/lower%20case" class="freelinking" rel="nofollow">lower case</a> letters <a href="/wiki/f" class="freelinking" rel="nofollow">f</a> and <a href="/wiki/t" class="freelinking" rel="nofollow">t</a> going across the stem horizontally, as well as the spanning stroke of <a href="/wiki/e" class="freelinking" rel="nofollow">e</a>.</p>
