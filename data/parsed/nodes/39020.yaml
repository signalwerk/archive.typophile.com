    <p>I want to insert an Arabic text in Indesign cs2, from a msword 2004 text file.<br>
    The text file i already got from the client.<br>
    Does Msword support Arabic text?( my own hunch says no)<br>
    How can i insert the text in a Indesign document, without loosing its nature?<br>
    Does anyone have a backdoor trick?<br>
    Greetings base</p>
