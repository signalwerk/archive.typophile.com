      <p>I think the criticisms of the initial proposal are sound, but the recent assertions that 'design by committee' necessarily results in compromise or that the results of voting are 'random' seem to be to overstate the case and ignore the possibilities of a well designed process.</p>
      <p>If there are established design principles and directions, agreed upon by consensus of participants at the beginning of the project, then this kind of collaborative design approach doesn't need to end up in compromise or a Frankenfont. 'Crowd-sourcing' is probably the wrong term to use, in that it implies little or no active coordination, but in the same way as an individual designer decides upon a set of criteria by which to judge the success or failure of individual glyphs -- within what Nick rightly identifies as a system within which the parts must work together --, a group of people can come to the same kinds of criteria and make collective judgements through discussion, consensus and, if necessary, voting. In such a situation, I would consider voting to be something of a last resort, when there are two or more proposed designs that appear to equally meet the criteria, in which case majority preference is a legitimate basis for deciding which to adopt. I would not set up the process to be based on voting as a default or initial decision making process: a discussion/consensus approach, while time consuming, will produce much better results.</p>
      <p>I did a workshop with the MA students at Reading earlier this year in which they designed and built an 8-bit display font in two days. I provided them with five key glyphs by way of establishing the characteristics of the design (obviously in a longer time frame this too could be arrived at by group decision): H O i o n. Responsibility for individual glyphs was determined by drawing cards, and this happened three times during the two days, each set of cards building on what had been accomplished in the previous round (e.g. there was no point in having two people independently designing left and right quote marks whole someone else designed the comma, since these are all related marks, so the first round included the comma, the second the left quote, and the third the right quote). Key roles in the project were those of Curator, also chosen by card draw and responsible for collating the glyphs and updating the master FontLab source file, and, in the later rounds, Consistency Checker, who would check alignments, overshoots, stem widths, etc..</p>
      <p><a href="http://ohbendy.tumblr.com/post/17089158534/font-workshop-with-john-hudson" rel="nofollow">Ben Mitchell wrote blog post about the workshop.</a></p>
      <p>The most important aspect of the project was the group crit halfway through in which the design was discussed and, for instance, the b d p q glyphs compared and decision made, by the group, as to which bowl shape worked best and what approach to take to harmonising them.</p>
