      <p>A student I was at art school with made ﬁlms by picking up scraps from the editing room ﬂoor and splicing them together randomly. You could get a similar effect by tipping many type trays (same size, different typefaces) on the composing room ﬂoor and then sorting them all into one tray; similar to the OP’s suggestion, then taking one glyph from each section of the tray, to represent the composite font. Floor-sourced. </p>
      <p>With or without voting, the effect is random, because the process does not address the fact that type is a system where the parts are supposed to work together.</p>
      <p>It would be a <a href="http://fathom.info/frankenfont/" rel="nofollow">Frankenfont</a>.</p>
