    <p>Hello there, everyone.</p>
    <p>I am interested in Fonts for quite some time now. A few days ago I was searching on the Internet for a good(i.e., nearly complete), free Unicode font. I was amazed how hard it was to find fonts which had a big amount of glyphs and were free(and most of the 'free' ones had strings attached like being only free for private use on one computer, etc). </p>
    <p>Now I had an idea. What if a website would be made, where people can pick one of the 100.000+ glyphs that Unicode has nowadays, and draw it, with their mouse, on a simple white with black canvas, with an undo and a clear button. The style will of course be a bit hand-drawn, shoddy-ish. That's a consequence of this technique but I don't think that it's a bad thing, because it will be uniform through the whole font:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/drawingd_6329.png"></div><p></p>
    <p>Multiple people can draw the same glyph, and then votes will  decide which one looks best. </p>
    <p>I believe that in this way, with a large group of people, it might be possible to create a big unicode font which covers one or multiple of the unicode planes.</p>
    <p>What do you, experts of typefaces, think? Is this idea viable?</p>
