    html: |-
      <p><em>there is no free font that provides all of Unicode</em></p>
      <p>The Unicode character set now greatly exceeds the 65,536 glyph limit that is built into the sfnt font format (TrueType and OpenType). Considering also that a fully functional font will need more than one glyph per character for many scripts, it is clearly impossible to create a single font that supports all of Unicode in today's principal font formats.</p>
      <p>One could, however, use a composite font format to bundle multiple fonts into a single pseudo-font.</p>
