      <p>No, OpenType is not a composite font format; it's a discreet font format. I'm talking about things like the 'composite font representation' in ISO/IEC 14496-28:2012, i.e. a wrapper around multiple fonts that present them as if they were a single font, with metadata indicating which cmap ranges of each component font take precedence.</p>
      <p>Each sfnt font can only contain a maximum of 65,536 glyphs (with functional limits on other tables in the font based on the same architectural restrictions). But multiple sfnt fonts could be packaged within a composite font representation to cover all of Unicode.</p>
