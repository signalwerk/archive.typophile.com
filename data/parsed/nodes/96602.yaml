      <p>I'm not sure this could work. What use is a font where every glyph is drawn by someone else? The whole point of a useable typeface is that the characters work together. And a hand-drawn 'shoddyish' font? I don't understand the need or use for that. The demands of even one complex script are a difficult thing for even a professional designer, so I wouldn't have faith in a crowd-sourced version. Key dimensions and positioning have to be shared among the designers, just to make the orthography correct, never mind about aesthetics. And someone would have to do the VOLT production, just to make the thing work. </p>
      <p>John's right, the most important thing is the curating, or regulating, of the design. In the Reading project this wasn't too difficult, as we were dealing with basically an extended Latin character set, but a lot more questions would arise in the scope of a full Unicode project. (It would be interesting to see how far a group of Reading students could go with broader script support!)</p>
