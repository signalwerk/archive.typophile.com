      <p><em>…recent assertions that 'design by committee' necessarily results in compromise or that the results of voting are 'random' seem to be to overstate the case…</em></p>
      <p>My comment that the OP’s process was random stemmed from the statement “Multiple people can draw the same glyph, and then votes will decide which one looks best.” I assumed that voters would be choosing glyphs by comparing each glyph of a Unicode character with all other glyphs of the same character, irrespective of what the other characters looked like. Hence the selections would be random in relation to one another. </p>
      <p>However, on further consideration, it would be possible to create a live, interactive decision process, in which a block of multi-character text is displayed online, using all the currrent selections, continually updated. Then the voter could insert different glyphs for a particular character in the text, and see how well they worked in context. Rather like the Metrics window in FontLab.</p>
      <p>Mind you, it would be a lot of work.</p>
