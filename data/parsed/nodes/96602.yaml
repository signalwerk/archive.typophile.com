      <p>True. I think 'amazed' was a bad choice of words. Rather, I am astonished how many of the 'better' unicode-fonts have all kinds of restrictions placed on them.</p>
      <blockquote><p>And voting? Hopeless.</p></blockquote>
      <p>Could you elaborate this? Certainly, the font won't win a beautyprize, but that's not the purpose of the font. </p>
      <p>Basically, my goals of the project are the following:<br>
      -An interesting experiment, to see how well it works to create a font together.<br>
      -Creating a font that covers all(or as much as possible) of the unicode planes, to create one font that is able to display all characters when you don't have another font that has them installed.<br>
      -Creating a simple unicode-font that can be used by anyone for any project without being restricted by any weird licensing.</p>
      <p>I realize that one TTF/OTF has a 65.535 cap, but indeed as pointed out, using multiple fonts is a solution. Composite fonts are something I didn't know of yet, interesting.</p>
      <p>@hrant: Do you have any source about earlier crowd type design projects? I'd love to read about them. The only thing I know of right now is the <a href="/wiki/%27GNU%20unifont%27" class="freelinking" rel="nofollow">http://czyborra.com/unifont/</a>, which in fact is one of the most complete, free unicode-typefaces right now. The big problem of it is that each of its characters consists of blocks in a 16x16 grid and glyphs were made with editing the ascii representation of a glyph. This means that the font looks 'pixelated' and doesn't looks nice on any size bigger than 16px.</p>
      <p>Have a nice day,</p>
      <p>~Accident</p>
