    <p>Okay, I'm sure I know this one, but it has gotten lost somewhere in my memory... It's the italic sans used in ReadyMade, and it has a double-story a, a semi-slab on the i, and the f drops below the baseline. It's <em>almost</em> like Officina Sans Italic or Corpid Office Italic, except for that a. Anyone?</p>
    <p>Thanks!</p>
