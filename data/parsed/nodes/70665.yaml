    <p>Hi everybody, this is my first thread here in Typophile forum, and Sorry if my English is not good... ;)</p>
    <p>So here's the story: Maybe about last year, I've done a type design for my senior project. Actually it is not a type-designing but maybe it's more like a modification. I modified Myriad into a display font named Wastra. Personally, I like what I've done so far. But when I did a presentation to the lecturers, their reaction was unexpected_they were kind of humiliate my work. Well, since that time I become not so confident anymore in designing a typeface. But year passed, now I encourage myself to share my work widely, so I could hear more comments on the work. </p>
    <p>Here are the details about my work:</p>
    <p>Wastra, is actually a loan word from Sanskrit which means a piece of cloth that is made traditionally. Batik, is also considered as wastra. In Indonesia, especially Java, you would find thousands of batik patterns. But among the thousands of such patterns, there is one pattern that is quite famous, Parang Curiga. So, I deconstruct the elements of Parang Curiga and then applied it into Myriad to make a new designed typeface.</p>
