      <p>Hello Novandito,</p>
      <p>I second riccard0. When making a derivative work, make sure you're starting from an open source or Creative Commons licensed typeface. You're lucky Adobe didn't sue you. :-)</p>
      <p>When diving into type design, try to come up with your own, even when it's not so sophisticated. Just do it for fun! You'll get improved sooner or later that way. I'm really sure you can do another type design from scratch based on Batik.</p>
      <p>Greetings from Surabaya, Indonesia.<br>
      Cheers!</p>
