    <p>This spring Type@Cooper's public workshops offerings have some new classes in Cooper Union's Letterpress studio. </p>
    <p>Beginning February 3rd, Nick Sherman will teach a 5 week evening course<br>
    <a href="http://coopertype.org/curriculum/workshops/chromatic-wood-type-design-printing-and-history" title="http://coopertype.org/curriculum/workshops/chromatic-wood-type-design-printing-and-history">http://coopertype.org/curriculum/workshops/chromatic-wood-type-design-pr...</a><br>
    Students will look at historical examples, analyse forms, design a some letters, and print their designs from laser cut wood type on a Vandercook press. If you love type, color and printing this will be very fun. </p>
    <p>Beginning March 17th, Sumner Stone will teach a 5 week evening course<br>
     <a href="http://coopertype.org/curriculum/workshops/designing-printing-modern-letters" title="http://coopertype.org/curriculum/workshops/designing-printing-modern-letters">http://coopertype.org/curriculum/workshops/designing-printing-modern-let...</a><br>
    which follows a similar model. Students will look at historical examples, analyse what makes a Modern typeface design tick and design their own type using these parameters. Printing will be done from polymer plates on the Vandercook presses...also very fun and potentially colorful. </p>
    <p>Later in April Ken Barber and John Downer return to teach some brush lettering and sign painting techniques. More on those later. </p><div class="imageWrap"><img src="http://typophile.com/files/Chromatic_Wood_Type_6180.jpg"></div><p></p>
