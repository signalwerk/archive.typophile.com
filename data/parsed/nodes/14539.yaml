      <p>in one of our first classes on my degree we were told to "stop drawing our way out of things" and instead to work out what needed to be done and then simply lay it out on the computer. now i have real trouble doing this - what i see in my head looks nothing like what ends up on the screen. i <em>have</em> to sketch things in order to visualise them properly and to see any problems that might come up. </p>
      <p>in my end of year tutorial, when i mentioned my problems translating designs a different tutor suggested scanning my sketches onto the computer and doing the layouts directly over the top. this works much better for me.</p>
      <p>the most useful things so far have been the workshops we have had - one was comping up posters for an exhibition, with emphasis on 'who'. others had 'where', 'when' etc. this was done purely from copy spec sheets blown up/reversed out/etc on the photocopiers and sellotaped onto a2 paper. this was much more useful, for me at least, than sitting down on a computer and moving boxes around with the mouse.<br>
      and then in the last week of term we had a letterpress workshop. again, i learnt more about kerning and leading from <em>physically working</em> with type in that one week than i had over the course of the last three terms. </p>
      <p>to me, drawing is an essential part of design.</p>
