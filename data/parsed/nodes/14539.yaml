    html: |-
      <p>I agree with many points here, but specifically Carl's advice. I actually came from a fine arts background before I was a designer so I had the benefit of art school training. The illustrator side of me always draws everything I do FIRST on paper, before I ever touch the computer. Doing this first really helps me see the big picture before I start doing the fine details. I think many designers use the computer "only" which I think can really limit creativity. This is not to say that everyone is the same, there are many desginers who can go straight to the computer...but as a recent student myself, I've seen quite a bit of the former. </p>
      <p>David's onto something too, while I don't think its completely necessary to follow the drawing exercises-studying the typefaces is certainly a good idea. Designing with Type by James Craig or Elements of Typographic Style by Bringhurst might be good places to start learning. I also can't stress life/figure drawing classes enough. This will also teach you a lot about form.</p>
