      <p>Hand skills are essential to any kind of design work. Graphic designers working without them are impoverished. </p>
      <p>Frank, any kind of drawing practice or training will improve your sketches: Life drawing classes, while they don't focus on type or grids, help anyone to SEE in several different ways, and also to develop abilities in your hand to convey ideas. "Hand-eye coordination" they used to call it. You can discover much about shape, line quality, balance, composition, contrast, materials and techniques from life drawing. All of this is acutely relevant to graphic design. I recommend it to anyone who spends too much time on the computer. You can do it at home if you have a lazy partner, roommate, dog or child, though instruction helps a lot.</p>
      <p>Hand skills work well in combination with digital tools. The tools alone won't get you as far.</p>
