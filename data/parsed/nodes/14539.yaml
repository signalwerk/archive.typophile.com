      <p>We are not old--we are BOOMERS.  Our first day in art school lettering involved "sidling" a lower case "f" in Franklin Gothic from our type books through parchment paper with a soft pencil.  Of course, few passed the test because we were all lunkheads incapable of seeing the delicate ambiance of the font. This seems like necessary work to learn type, but it seems unnecessary to prepare a comp with the availability of computers.  Clients understand finished comps much better than sketching.  This reminds me of an illustrator I once met who refused to give up marker comps; destined to be left behind because he only used his computer for billing.</p>
