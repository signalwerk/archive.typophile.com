    html: <p>As a student I've been doing a lot of sketching myself. I find that just sitting down  and blocking out time to open up Font Book and choose a few letters then draw those letters to the best of my ability for a few different faces. Repeat this exercise as often as possible and soon enough you'll be able to draw many faces without even looking at them. These drawings have also been a huge help in my knowledge of the 'flow' of letter forms and the different weights too! Good luck!</p>
