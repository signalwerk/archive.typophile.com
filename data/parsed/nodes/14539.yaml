    <p>There are times when I need to sketch out<br>
    a name, acroynm, or phrase in a particular<br>
    typeface during the conceptual stage.</p>
    <p>Usually, I just write out the name with<br>
    a thick marker.  However, this technique best<br>
    conveys form, direction, etc..but NOT the<br>
    subtleties of <a href="/wiki/weight" class="freelinking" rel="nofollow">weight</a>, <a href="/wiki/contrast" class="freelinking" rel="nofollow">contrast</a> -- especially<br>
    with <a href="/wiki/serif" class="freelinking" rel="nofollow">serif</a> faces.</p>
    <p>My attempts to "draw" out the typefaces more<br>
    clearly seem rather dissappointing.</p>
    <p>For those who may know, are there any helpful<br>
    methodologies or advice to be given as to how to<br>
    sketch out letters more clearly?</p>
    <p>Note, I am a graphic designer not an illustrator,<br>
    nor have I designed type before, thus my drawing<br>
    skills lack savvy.</p>
    <p>p.s. the technique known as "<a href="/wiki/building-up" class="freelinking" rel="nofollow">building-up</a>" the letter,<br>
    is one that has merit, but takes too much time with the<br>
    filling in...I need something more efficient yet<br>
    visually clear.</p>
