      <p>Unless you work for a larger studio or agency that has a large budget for purchasing fonts, most designers need to justify their purchases.</p>
      <p>If you are presenting two, three or more concepts to a client, each using a different typeface, either you draw (by hand or Illustrator) the design or purchase the fonts. It can get very expensive buying fonts for no reason other than just having them.</p>
      <p>Again, concepts need not be finished work to be approved. Most clients will give you feedback without seeing a finished printed piece.</p>
      <p>------------------------------------<br>
      Yes, I'm old, but I'm not that rich!</p>
