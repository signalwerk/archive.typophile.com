      <p>Frank,</p>
      <p>for our own disciplines we should never give up how we process ideas and discover the world around us.</p>
      <p>Part of the current problem of not being able to "see" anything that is not fully rendered, is plaguing our industry as well as culture.</p>
      <p>Not long ago, writers and filmmakers could produce works without getting absolutely detailed, leaving areas "unresolved" and leaving it to the imagination of the public. (For some reason, they nicknamed open-ended film endings "European endings.")</p>
      <p>Now, audiences go ballistic, demanding their money back if they don't SEE a completely wrapped up neat and tidy ending. Kinda sad, huh?</p>
      <p>Thankfully, creatives themselves do not need any more than a few scribbles to develop concepts, even incredibly complex ones. Take <a href="http://www.nga.gov/exhibitions/20th_design.htm" target="new" rel="nofollow">I.M. Pei's sketches</a>, for instance.</p>
      <p>My experience with shortsighted clients is to get something approved with as little rendering time as possible. Chances are it's only the concept you need to "sell" and not the subtleties or refinements you can make AFTER the initial "go-ahead" from the client.</p>
      <p>--------------------------------------------<br>
      Yes, I'm old, but please call me Norbert!</p>
