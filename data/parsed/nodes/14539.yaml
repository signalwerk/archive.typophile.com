      <p>All of your comments are very interesting and helpful.</p>
      <p>I found some helpful tutorials in the Wiki section which<br>
      includes this scribbling technique which is just perfect<br>
      for fast, effective sketching.</p>
      <p>...<br>
      If I may draw upon some of my observations:</p>
      <p>The idea of a "finished" or tight pencil sketch is<br>
      something of a relic from a previous era.  Designers of the<br>
      past usually had great drawing skills, but the designers of<br>
      today need only use the sketch as a rough conceptual guide<br>
      before refining the idea for presentation on the computer.</p>
      <p>Like it or not, this is the most practical way of doing<br>
      things in a world where deadlines become shorter, clients<br>
      are less imaginative, and where everybody is accustomed<br>
      to seeing crisp shapes with gradients and drop shadows.</p>
      <p>(Yeah, it sucks. But what can we do?)</p>
      <p>With that said, this is why I started this thread --<br>
      because I see the need for designers to spend more time<br>
      practicing the art of sketching.</p>
