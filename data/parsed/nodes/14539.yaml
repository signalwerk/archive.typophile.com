    html: <p>I'm surprised anyone has learned design without having to draw. Frankly, I would have loved to go to one of these schools where they teach current methods at all, let alone to the exclusion of ancient methods. My teachers made us do a pile of thumbnails, a rough half-size marker comp, a tight half-size marker comp, a tight full-size marker comp that looks exactly the same as the tight half-size marker comp because all the demanded changes have been made already, and then for the final comp we had to spec type on film negative to make rub-on transfers with an accursed Omnicrom toaster thing. I once chose Kabel Extra Bold for a headline solely because I knew I was expected to cut 24pt letters out of colored paper with a blade. This was in the 1990s, when all design jobs were already advertised entirely in terms of what software you knew. You can see why I never became a fixture of the industry.</p>
