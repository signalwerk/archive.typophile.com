      <p>Hrant, I am very impressed by your napkins as you didn't even spill wasabe or sake on them.</p>
      <p>Mr. Lin,<br>
      I am more graphic designer and typographer than type designer (I have never designed a face, only edited them). For me, "sketching" and "drawing" are two completely different experiences, or areas of engaged processing.</p>
      <p><em>Sketching</em> is more like brainstorming by eye &amp; hand.<br>
      In some instances I have a concept in my mind's eye that I need to materialize on paper or screen in order to expand, refine or reject.<br>
      In other instances, my hand is governed by no preconception and is allowed to freely explore, wander, and conjur hoping that it triggers visual clues to explore, teasing ideas out of the subconcious.</p>
      <p><em>Drawing</em>, by my own discipline, is setting aside the "mind" and letting the EYE guide what my hand should follow. Looking, looking, drawing, erasing, looking and drawing... in this way my mind develops an awareness of shape, form, and space by witnessing this process. One of my drawing teachers always told us to draw the <em>other side</em> of the figure or apple, the part unseen. This was hard to fathom at first (and even harder to draw once you understood). But eventually you begin to <em>see</em> not what your mind tells you, but subtleties that only your eyes can pick up.</p>
      <p>So, for me, I can <em>draw</em> a typeface by observation, and can <em>sketch</em> an idea for review.</p>
