      <p>Hmmm. I think there are several kinds of drawing going on here. </p>
      <p>“Building up” refers to a technique letterers would<br>
      use in which they first drew a stick outline of the shape,<br>
      then proceeded to color or “build up” the letter until<br>
      the form matured."</p>
      <p>This is from the old days and no one does it much anymore because the accuracy of the result is so distant from the type that really happens, that it's useless. I tell young designers and old ones too, that type sketche, even the really  nice ones on napkins, are about the same worth: draw it for real if you're gonna take that much time, or buy the damn typeface for a fraction of the cost of drawing even  one  headline...</p>
      <p>Another letterdrawing is all and only about the contour, so there is no "build up." The letterdrawer concentrates all of her efforts on the contour by shifting back and forth on the two sides of the paper, using a light table to compare the results, erasing and shaving until the form is PerFect, all on one side or the other, and then transferring the contour to its final place and filling in a separate operation. </p>
      <p>Also, watch your wrist! I learned as a child, to draw tiny little segments of lines in a nervous motion, rotating the paper for the optimal angle and generally using the hand as a stationary compass attached to the wrist. Then, I went to Aaahhrt School, and they unlearned me from this, teaching me that the wrist should be free! and the paper should be bound. This is fine for nak'd body drawing, but since very few people are shaped like letters...Well, then I went Linotype, and learned that my child'ood method was what was required, except, with a light table you can use both sides of the paper. </p>
      <p>Even later, Ed B. Nuts taught me that due to the need to prove to skeptical people that you do in fact have a job, you'd better also learn to make credible letters with a fork, on a napkin or table cloth. This too has served me well, and works especially nicely with a smaller, 3-tined salad fork, a padded table with a nice white cloth.</p>
