      <p>Frank,</p>
      <p>you're right. I need to get away from the screen once in a while as well.</p>
      <p>The other truth of the matter is that one (depending on the individual) thinks, creates and processes diffently based on the tools they use.</p>
      <p>When I sketch, I use visual "shorthand" for myself... just enough imagery for me to make decisions or experiment more. I can also process several concepts simultaneously on the same sheet of paper.</p>
      <p>On the computer screen, I tend to want to see ideas more "finished" which means I generally go with the first few series of designs. On paper I throw a lot more in the trash (which also means I process many more ideas in the long run).</p>
