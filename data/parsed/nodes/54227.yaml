    <p>I've had good results with FontForge but would still like to clarify some issues. With some fonts, I've seen the empty space for the glyphs (ccaron, Ccaron) and it was easy to add them. But with others, those glyphs weren't defined. When I told FontForge to generate fonts (otf), they appeared. Now I'd like to know if this is the correct procedure and whether the quality is compromised in the process.</p>
