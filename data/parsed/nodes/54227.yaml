      <p>There is no simple answer. Some layout engines have a "floating accent" routine, but as far as I know, InDesign isn't one of them. Maybe an ID expert will chime in here.</p>
      <p>The other way is to add the character to the font, wich constitutes "modifying" the font. There are both legal and technical matters with this. </p>
      <p>To the legal issue: I believe the laws in the EU are different than the States, and I believe I've seen posts that stated some European countries have laws which supercede the foundry EULA in some situations. I'm not a lawyer, and have no idea. Moreover, several foundries (including Adobe) allow modifying fonts for this purpose, for your own use.</p>
      <p>Technically, making up Ccaron and ccaron is easy. They are both precomposed characters in Unicode (in Latin Extended A), so there is no need to use any special OpenType feature such as ccmp or mark. I would simply copy and paste the C,c in the correct spots, then copy the caron and paste it over the c. If the caps have flatter accents than the lower case, a caron is usually the same a horizontally and vertically flipped circumflex, so the circumflex from a any cap letter can be copied &amp; used after the double-flip. (If that isn't to your taste, modify as you want.) Center the accents over the C,c as desired, and write off the font. If you want/need to add the Ccaron/ccaron to the kerning, that is a separate step, and you will have to understand how the kerning in the font is presently constituted.</p>
      <p>If you use type a lot, for your own projects, understanding how to make this simple kind of modification is worth the time it takes to learn the ins and outs. The hardest part will probably be dealing with existing class kerning and OT features. Even if InDesign has a floating accent feature (or comes out with one in a future release), you will run across situations where you have to modify the font -- for example, any accent over a lower-case "h" that has to center on the stem will defeat a simple "floating accent" routine.</p>
      <p>Good luck to you</p>
