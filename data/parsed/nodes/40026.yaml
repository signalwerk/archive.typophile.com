      <p>I don't know. Minion doesn't look right. I assumed it would look like Minion pushed into an environment in which it doesn't feel comfortable. And that's how I perceive it. I wonder whether this is because I'm so accustomed to seeing Georgia work well, or if I'm just used to seeing Minion on paper.</p>
      <p>There should be more Georgias in the world. I'm curious to see those MS faces in my browser...</p>
