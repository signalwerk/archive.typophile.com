  html: |-
    <p>Looking for suggestions as alternatives to Georgia, for use on da web. I like Georgia for body text. But I'm wondering if there are any other serif typefaces that, like Georgia, are excellent for body text on screen. </p>
    <p>My plan would be to specify Georgia as a value of my font properties, but also include some unique serif typefaces that some folks just might have installed on their system... Just for fun.</p>
    <p>Additionally, I assume that if one were to install Vista on one's Mac, one would be installing the new Vista typefaces. True?</p>
