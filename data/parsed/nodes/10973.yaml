    html: <p> the style of the paintings lends itself very easily to this picasso-looking montage, where the book clipping and label for tupper look like found objects. however i want to see more of that interesting type treatment- but i guess thats because im a typophile. </p>
  - id: 69356
    user: 1680
    date: 2003-03-26T09:51:00
    date_raw: 26 Mar 2003 — 9:51am
    votes: null
    html: <p>I am really enjoying the layering of your imagery as well; especially with the vibrant colors you have selected, but I think that the composition is quite heavy on the right side. I think this might be solved if you moved your vertical type along with the beige form (with David Tupper) over to the left. Plus, I am not sure if you wanted the viewer to automatically read the text first. If this is what you want then the text in the middle is fine. But when I first viewed it, my eyes were stuck on the text and it was very hard for my eye to focus on the imagery. What I am saying is, the text does not move my eye around your composition. If the text was moved to the left, the curvature of the form (with David Tupper) would lead my eye into the right side of the piece a little more. But, I really enjoyed your piece! Lovely.</p>
