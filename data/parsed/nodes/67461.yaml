    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Turner_5338.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Turner-Logo_5596.jpg"></div><p></p>
    <p>I'm searching for the font used in the 'Turner Prize' Logo,<br>
    at first I thought it kind of looked like the (wonderful)  <a class="freelinking external" href="http://www.fontshop.com/search/?&amp;q=Estilo&amp;x=0&amp;y=0&amp;sample_text=TURNER%20PRIZE%20%2008%20%2F%20o8&amp;update=0" rel="nofollow">Estilo</a>, as it's soft and Round and has a Swashed 'R' which in this case is done custom (or at least I think so,...) and after searching it resembles <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/creative_alliance/ulissa_rounded_vp/?&amp;sample_text=TURNER%20PRIZE%20%2008%20%2F%20o8&amp;update=0" rel="nofollow">the Ulissa</a><br>
    Maybe someone does know what 'is' used in this case?<br>
    Thanks, A+</p>
