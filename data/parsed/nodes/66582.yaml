  html: |-
    <p>If a post or something else gets deleted, the page you see should <em>state</em> the content was deleted. (As done on MetaFilter. In fact, there’s a <a href="http://deletedthread.blogspot.com/" title="Deleted Thread" rel="nofollow">blog</a> of nothing but deleted MetaFilter [blue] threads.) If necessary, a customized 404 page could be displayed, but that wouldn’t tell enough of the story.</p>
    <p>Presently, a deleted page leads you to <em>some other</em> page, usually a calendar of events. In essence, the site lies to you: You wanted one page, but we deleted that one without telling you and have decided to show you something you didn’t want instead. It’s misleading and anti-Web.</p>
