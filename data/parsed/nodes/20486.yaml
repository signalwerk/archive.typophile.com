    html: |-
      <p>It looks like a condensed version of an old, predigital typeface called Romany was used. I know of no digital version.</p>
      <p>Pretorian is DTP’s revival of Pretoria. Seeing as to how they have no claim to the rights for Pretoria, I’ll point you to Dieter Steffmann’s version. He calls it <a href="http://www.moorstation.org/typoasis/designers/steffmann/samples/v/vivian.htm" target="_blank">Vivian</a>. No promises as to relative quality.</p>
