    date_raw: 1 Jan 2011 — 9:37pm
    votes: null
    html: "<p>Just saw the movie. The fonts in the credits are: <a href=\"http://new.myfonts.com/fonts/bitstream/engravers-roman/\" rel=\"nofollow\">Engraver's Roman Bold</a>, <a href=\"http://new.myfonts.com/search/nicolas+cochin/fonts/\" rel=\"nofollow\">Nicolas Cochin</a>, <a href=\"http://new.myfonts.com/fonts/adobe/caslon-open-face/\" rel=\"nofollow\">Caslon Open Face</a>, and (in the closing credit roll) either <a href=\"http://new.myfonts.com/fonts/bitstream/della-robbia/\" rel=\"nofollow\">Della Robbia</a> or <a href=\"http://new.myfonts.com/fonts/adobe/cantoria/\" rel=\"nofollow\">Cantoria</a>.</p>"
    html_clean: "<p>Just saw the movie. The fonts in the credits are: <a href=\"http://new.myfonts.com/fonts/bitstream/engravers-roman/\" rel=\"nofollow\">Engraver's Roman Bold</a>, <a href=\"http://new.myfonts.com/search/nicolas+cochin/fonts/\" rel=\"nofollow\">Nicolas Cochin</a>, <a href=\"http://new.myfonts.com/fonts/adobe/caslon-open-face/\" rel=\"nofollow\">Caslon Open Face</a>, and (in the closing credit roll) either <a href=\"http://new.myfonts.com/fonts/bitstream/della-robbia/\" rel=\"nofollow\">Della Robbia</a> or <a href=\"http://new.myfonts.com/fonts/adobe/cantoria/\" rel=\"nofollow\">Cantoria</a>.</p>"
