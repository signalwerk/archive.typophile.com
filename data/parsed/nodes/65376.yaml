    <p>TypographyShop is expanding its line into hoodies. We've just released <a class="freelinking external" href="http://typographyshop.com/helvetica-unisex-hoodie.html" rel="nofollow">Helvetica Neue Descending an Eco-Friendly Hoodie</a> just in time for the holidays.  We wanted to find a very special hoodie and were happy to find this blend of organic cotton and recycled polyester.  The polyester started life as plastic bottles and even the dye used in the process is low impact.</p>
    <p>We've got a new t-shirt up as well: <a class="freelinking external" href="http://typographyshop.com/letterpress_mens_t-shirt.html " rel="nofollow">Letterpress</a>.  Set in Berthold Akzidenz-Grotesk bold in reverse, a very simple homage to everyone's favorite printing process.  Or at least it seems like it these days. </p>
    <p>We're also proud to have been part of the Typophile film fest in Portland a couple of months back.  We gave away 5 t-shirts to winners of a quiz preceding the films. Thanks to Zara from Typophile for all her help.</p>
    <p>In other news, since our inception, TypographyShop has stated that a portion of all our sales would be donated to Design Education Programs. </p>
    <p>We're pleased to announce that the AIGA Education Fund is the first recipient of our donations. The fund supports AIGA's education and scholarship programs which help students, usually from inner cities, who demonstrate talent and are willing to serve a social purpose as well as a personal goal. </p>
    <p>Learn more about the fund <a class="freelinking external" href="http://www.aiga.org/content.cfm/worldstudio-scholarship" rel="nofollow">here</a>.</p>
    <p>Happy Holidays<br>
    Patrick King<br>
    TypographyShop</p><div class="imageWrap"><img src="http://typophile.com/files/suhoodie_3799.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/letterpress_su_4918.jpg"></div><p></p>
