      <p>I think the entry strokes are simply an interpretation of the way in which x-height entry serifs on italic letters mirrors the baseline exit serifs, a convention already long established in oldstyle italics. If you compare the Caslon and Scotch Modern italics in your specimen, you will see that the pattern is basically the same.</p>
      <p>Bodoni’s model is consistently different.</p>
