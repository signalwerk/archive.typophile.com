      <p>Since the pothooked characters seem to reference scripts that were engraved into copper plates; thus the name copperplate; would this account to some degree for the piecemeal implementation that you mentioned? The punchcutter referencing a technique that comes from an engraver seems a substantial break from the norm. </p>
      <p>The Caslon references the Italic broad-edged pen, but the Bodoni Italic strives for a more geometrical balance. Not sure if the Didot fonts of that time came up with their proportions as seen in the rounded strokes by seeking that kind of balance or if their was reference made to engraved scripts.</p>
