    html: |-
      <p>Egyptians were originally (early 19th century) the bold for Scotch, which makes sense as a pairing, because unless your accompanying serif has high contrast, there isn’t sufﬁcient distinction between one serif face and the other.</p>
      <p>However, if your display face is a bold Egyptian, you can use just about any serif style for body text.</p>
