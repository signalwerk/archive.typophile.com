    html: <p>Are you familiar with the US clothing retailer American Eagle? They can be found at <a href="http://www.ae.com" target="_blank">www.ae.com</a>  Although I don't see the mark on their site, they have very frequently used an "ae" mark very similar to the gestalt you posted. I think combining an "a" and an "e" like this is fairly common. I even did it myself once for a company named "Peak". So, even if your "ae" mark doesn't infringe upon anyone elses, I'd suggest creating something more original.</p>
