    html: <p>Tiffany_  <br> <br>nice analysis; I have started to produce some prints for our company, and it has become an alignment reference. I find it interesting to have a graphic element to play with.. that can be expressif and serve as a simple alignment.  <br> <br>Furthermore, I never liked the idea of a fixed logo. I have used the type alone... and it was interesting, but in a contrast within a dynamic page. And the contrary with the brackets .. but in a sobre background. I don't think that a logo has to be integral, 100 % of the time.  <br> <br>Thanx for all the comments everyone.. it has helped grow our image concept!</p>
