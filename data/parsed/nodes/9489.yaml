  - id: 60940
    user: 2172
    date: 2005-03-02T08:38:00
    date_raw: 2 Mar 2005 — 8:38am
    votes: null
    html: <p>I like the idea of the different marks for different divisions, but it seems like a lot of marks for one group. Will they be used separately that much? I agree with darrel that they'd all probably work without the extra marks. <br> <br>Anyway, if you do need/want the variations, then you should make them either more distinct from each other or more uniform. At a glance, 'mouvement' and 'interactif' are very different from the others, which all read as nearly the same. Also, the 'm' is so different that it feels out of place. It's so strong and stylized that it overpowers the words. But on the other logos, the letters are much simpler and don't add much. <br> <br>I think you should either make the bracketed letters all very strong, or all the same as the logotype, or just remove them altogether.</p>
    html_clean: <p>I like the idea of the different marks for different divisions, but it seems like a lot of marks for one group. Will they be used separately that much? I agree with darrel that they'd all probably work without the extra marks. <br> <br>Anyway, if you do need/want the variations, then you should make them either more distinct from each other or more uniform. At a glance, 'mouvement' and 'interactif' are very different from the others, which all read as nearly the same. Also, the 'm' is so different that it feels out of place. It's so strong and stylized that it overpowers the words. But on the other logos, the letters are much simpler and don't add much. <br> <br>I think you should either make the bracketed letters all very strong, or all the same as the logotype, or just remove them altogether.</p>
