    html: <p>ok .. thanks for the comments  <br> <br>in fact, the different variations were more to value the evolution capabilities of the original logo (the "AE") They are not to be used unilateraly. We didn't work as much on the different variations, but i like the possibility that an original logo can be developped into other long term possibilities... maybe I shouldn't have posted them first  <br> <br>The brackets were added to stylise the too straight and boring lines of type. It sort of humanises it. By the way, the type is Interstate. But i'll try other possibilities besides the brackets.</p>
