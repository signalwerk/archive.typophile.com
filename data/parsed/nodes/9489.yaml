    html: <p>I like the type by itself. The bracketed character seems to just distract from the logotype. It also seems a bit cliche (ie, bitmapped type for interactive...way overdone...) <br> <br>If anything, I'd stick with the 'ae' or just get rid of it all together. Let the logotype do the talking.</p>
