  html: <p>Hi! <br> <br>So i'm risking my head on this chopping block. I am submitting the new identity for our Design firm. It's a new company, a subsidiary from another. We're situated in Montreal, so it's in french. So those who don't understand, on the first image, the official logo is at the bottom, and the others above are variations for the differents services. By lack of time, we didn't create the typography for the logo.  <br>And on the other image, it is the business card, for the 3 associates. The format of the card is credit card size.  <br> <br>So tell me what you think.  <br> <br><img src="http://www.typophile.com/forums/messages/29/66310.jpg" alt="logo"> <br><img src="http://www.typophile.com/forums/messages/29/66311.jpg" alt="card"></p>
