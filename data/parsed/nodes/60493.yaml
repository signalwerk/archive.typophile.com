    <p>Hi all, this is an identity in progress for a non-profit based here in Houston. The basic idea is an organization that exists simply to try to help people have a better day and remind them that someone does care. It’s started with small gives just to put a smile on people’s faces (like buying coffee for everyone in the drive-thru at Starbucks) and is moving into doing bigger projects for people in need as funds permit.</p>
    <p>I’ve been playing with a variety of ideas for the identity and have arrived at these variations of a mark and type, I don’t love them but I like the direction. I feel like the angled version has the idea of a bit more movement and progress associated with it and like the idea of both, but I’m not opposed to going an entirely different direction if the idea presents itself. Fire away :)</p>
    <p></p><div class="imageWrap"><img src="/files/ep_logo_bw_4927.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="/files/ep_sketch05_3606.jpg"></div><p></p>
