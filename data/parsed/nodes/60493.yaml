      <p>It’s probably a little bit of both. There are too many angles and sharp bits all over the place :-)</p>
      <p>You don’t have to go too casual with it. For a typeface, try something like <a href="http://sudtipos.com/fonts/9" target="_blank">Grover</a> from Sudtipos. I’m not saying it has to be a rounded font, but I’d suggest something a little quirkier than what you’re using. Then, make the mark fit with whatever type you’re going with.</p>
      <p> - Lex</p>
