  html: |-
    <p>I’m looking for interesting/unusual RSS feeds for an experimental type-related project. I want feeds that have random but interesting words or phrases as the title of each entry.</p>
    <p>This one works pretty well for my purposes (and it’s funny too).<br>
    <a href="//www.overheardinnewyork.com/index.xml">feed://www.overheardinnewyork.com/index.xml</a></p>
    <p>I don’t want things that sound like news headlines or have the name of the feed in all of the titles.</p>
    <p>Maybe a feed of famous one-liners? Or a good “word of the day” feed? (all the ones I’ve found so far have the name of the dictionary or some other additional text placed in the title)</p>
    <p>It’d be an added bonus if the feed uses proper punctuation… smart quotes, etc</p>
    <p>Any suggestions?</p>
