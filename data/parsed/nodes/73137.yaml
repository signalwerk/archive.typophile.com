    <p>I want to ligate the bejeezus out of a font, or find a font out of which the bejeezus has already been ligated.</p>
    <p>What I'm thinking of is mechanical single-line lettering like the inside line of the CNN logo (the "cable" in the Cable News Network), something you could theoretically craft out of neon tubing or engrave with a rotary tool.</p>
    <p>The caps in <a href="http://new.myfonts.com/fonts/processtype/bryant/" rel="nofollow">Bryant</a> are close to workable, except for letters like "C", which would need to terminate horizontally to be connected to, say, a "T." I'm sure I'll end up creating these letters myself, but it would be nice to see how others have done it, to get a sense of what I want to emulate or do differently.</p>
