    html: |-
      <p>Heh, worth a shot.</p>
      <p>It's an interesting proposition. There are plenty of sans faces now including ligatures in their character sets, but they tend to be just for standard letter combinations or just alternative presentations of characters (for example, an LL lig where the second l is shorter and sits inside the first).</p>
      <p>The new(ish) ITC Avant Garde Gothic Pro restores all the classic ligatures, in OpenType, that have been unavailable for years. There are ligs of both the above types in the mix, but perhaps they will prove useful. I fear that you may have to bite the bullet and create your own type, or heavily customise an existing one. Remember that, short of using a script face (like the ones I post above), typographers cannot logistically create ligs for every conceivable combination of characters.</p>
      <p><a href="http://www.fontshop.com/search/?q=itc+avant+garde+gothic+pro" title="http://www.fontshop.com/search/?q=itc+avant+garde+gothic+pro">http://www.fontshop.com/search/?q=itc+avant+garde+gothic+pro</a></p>
      <p>Good luck!</p>
      <p>-NJ</p>
