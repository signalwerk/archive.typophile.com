    <p>Hi typophiles, I've been lurking here for a while, and finally made the leap and got an account. Don't hurt me too badly, please...</p>
    <p>I'm working on a graphics package for a "butterfly exhibit" at a botanical center, consisting of graphics for both informational and identification purposes. I have a few ideas of what I think might and might not work for a title font throughout, but was wondering if anyone else had any thoughts. </p>
    <p>Some background on the exhibit: It is a large greenhouse filled with flowering nectar plants and butterflies. Visitors are of all ages, and the graphic panels are probably no smaller than 18" x 24". </p>
    <p>Any ideas on a font that goes well with butterflies? I'm thinking something that addresses their symmetry, and lightweight frame...</p>
    <p>(One of my concerns is keeping this from looking too much like a wedding invitation. Script fonts are out, unless someone has the audacity to convince me otherwise...)</p>
    <p>-Thanks for your help</p>
