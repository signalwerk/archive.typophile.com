      <p><cite>Thesis Sans (everybody thinks it’s TheSans) was used</cite></p>
      <p>Thesis is the name for the total of Luc[as] de Groot's typefamilies of TheSans, TheSerif and TheMix. In his words:<br>
      <cite>Thesis was designed to be the definitive font for every aspect of a corporate identity campaign. The font is so carefully drawn, that it maintains its form in sizes ranging from business card text to lettering on the side of a building.</cite></p>
      <p><a href="http://www.lucasfonts.com/index_neu.html" title="http://www.lucasfonts.com/index_neu.html">http://www.lucasfonts.com/index_neu.html</a></p>
      <p>(I think the Thesis Sans nomer was used in the beginning when it was 'just' a corporate font.)</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
