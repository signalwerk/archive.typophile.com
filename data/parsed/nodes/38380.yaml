      <p>**Gets ready to be shouted down**</p>
      <p>I must say I felt exactly the same way about script fonts (and I have done my fair share of wedding work when starting out) and they just scream "no" at me for myriad reasons because of that.</p>
      <p>I did however recently "discover" <a class="freelinking external" href="http://misprintedtype.com/v3/fonts.php" rel="nofollow">misprintedtype.com</a>, and two faces there, Selfish and Porcelain might be worth you having a quick look at. </p>
      <p>They're both, I would suppose "grunge" scripts, but they do convey movement (and possibly the slight otherworldliness of the butterfly's directions), and I got away with sparse use of Selfish as a drop cap in a horticultural piece.</p>
      <p>Like I said, I'm ready to be shouted down here. :)</p>
      <p>And Mike, just like to add what a gorgeous piece of work that is. And envy is no good at this time in the morning...</p><div class="imageWrap"><img src="http://typophile.com/files/selfish_4087.jpg"></div><p></p>
