  html: |-
    <p>Greater Albion has just launched Admiral on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/admiral/ " rel="nofollow"> Myfonts</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/admiral/ " rel="nofollow"> Fontspring</a>.</p>
    <p>Admiral was inspired by and extrapolated from the Art Nouveau lettering incised into the facade of a local hostelry.  This gave us some inspiration for the capitals 'A', 'B', 'C', 'E', 'H', 'I', 'L', 'O', 'S', 'T' and 'U'; we then had great fun extrapolating the rest!  The source of the name Admiral can be spotted if you look at characters such as 'A', 'H' and 'N'.  Admiral's distinctive charm and humour lends it to projects with a 1900s Art Nouveau theme, be they book covers, posters, signage, invitations, cards, or anything else you enjoy!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Admiral_5585.png"></div><p></p>
