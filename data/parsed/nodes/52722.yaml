    <p>Hello,</p>
    <p>I was just wondering if anyone knows what this is called - a frame such as a baroque or rococo frame found on inner covers of old books which encloses the title - a frame around the title.  Does anyone know what the technical word for these pesky things is as I'd like to find some examples on the internet.  Many thanks.</p>
