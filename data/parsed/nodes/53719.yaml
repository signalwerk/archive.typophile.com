    html: |-
      <p>A book printer is, more or less by definition, a printer whose equipment and workflow are optimized so pages collate sequentially. A book printer can do what you want, but it won't save you any time or money.</p>
      <p>If you're printing 1000 or fewer of each page, and the pages don't require high-quality color or subtle halftones, any reliable copy shop can do the job.</p>
      <p>If you want the pages to look like keepsakes rather than lecture notes, specify an off-white sheet with a soft finish instead of the copy shop's default paper.</p>
      <p>Trying to replicate the hyperlinks on the printed page seems contrary to the spirit of the enterprise. Is the original blog still accessible somewhere, so folks can have the full-on interactive experience if they like what they read on paper? If so, you can ignore the hyperlinks and give them the URL of the blog, maybe as a footer on the printed pages.</p>
