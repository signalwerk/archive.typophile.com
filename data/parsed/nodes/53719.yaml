    <p>Hi all,</p>
    <p>I've been approached by a friend to design a print version of a blog he kept as part of an art/research project on the culture/dynamics of his suburb a while back.</p>
    <p>The idea is to not produce a finished, bound book, but to display a stacks of individual pages (up to 200) on a long bench in a gallery space, for people to collect, assemble, and take home their own copy.</p>
    <p>(<a href="http://flickr.com/photos/bilateral/519319338/in/set-72157600285523082/" rel="nofollow">Here are some photos from a previous showing of the project</a>, in which the blog was just copied, unstyled, into an MS Word doc)</p>
    <p>Does anyone know of any similar projects (insofar as adapting online content to print)? I haven't sat down to plan this out properly, but issues of how to deal with hyperlinks, post metadata, comments etc immediately come to mind.</p>
    <p>Also, does anyone know if it might be possible to convince a book printer to deliver stacks of unbound pages instead of finished bound copies?</p>
