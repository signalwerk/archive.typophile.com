    html: <p>The color of the text is too dark! Think contrast. If you want a second typeface i would pair Brauer with a Serif, Helvetica looks dull in this combination. Think contrast. BTW Brauer is not that bad, instead of messing around with a second typeface go with Brauer and try to improve the reading comfort. Color contrast, line-length, eventually spacing, rendering options inside Flash for dynamic text, etc.</p>
