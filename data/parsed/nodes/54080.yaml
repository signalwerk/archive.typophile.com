  html: <p>Hi everyone, hope this is the correct place to post this (the typography/composition forum seems inactive). I am involved in creating a flash website for a client and am trying to pair a header font with a good legible choice for body text. The header is set at 18pt Brauer Neue Bold. The client likes the body set in Brauer also but I find it is somewhat hard to read. I have made a mockup below with it set in 14pt Brauer Neue and also in 12pt Helvetica Neue. I was wondering if anyone has a favorite or maybe even a suggestion for another font that would pair nice with the Brauer header. Thanks so much!</p><div class="imageWrap"><img src="http://typophile.com/files/test_3414.jpg"></div><p></p>
  html_clean: <p>Hi everyone, hope this is the correct place to post this (the typography/composition forum seems inactive). I am involved in creating a flash website for a client and am trying to pair a header font with a good legible choice for body text. The header is set at 18pt Brauer Neue Bold. The client likes the body set in Brauer also but I find it is somewhat hard to read. I have made a mockup below with it set in 14pt Brauer Neue and also in 12pt Helvetica Neue. I was wondering if anyone has a favorite or maybe even a suggestion for another font that would pair nice with the Brauer header. Thanks so much!</p><div class="imageWrap"><img src="/files/test_3414.jpg"></div><p></p>
