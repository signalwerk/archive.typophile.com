    html: "<p>To me #3 is cute (that \"e\" is genial!) but #4, especially in that \"scuffed\" rendering is really quite nice - it would sell* well, I'm sure of it. BTW, it reminds me of Zentra**, but that was a lot less legible.  :-) <br> <br>* If you're looking for a font house to sell it through, I would recommend PsyOps. <br> <br>** <a href=\"http://www.tdc.org/news/2001Results/Zentra.html\" target=\"_blank\">http://www.tdc.org/news/2001Results/Zentra.html</a> <br> <br>hhp</p>"
