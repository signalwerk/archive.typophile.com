  html: <p>Dear Scott Keawekane, Raja Sandhu, Hrant H Papazian, Thomas Lippl, John B., darrel, Chris Rugen, and Sharon Brunson; <br>I wanna thank you all again for all your comments in my first version of this discussion. Attached is the exploration and probably final direction of my typeface at the bottom. Except for the first one which is based on the logo of Amaru Entertainments and the cross on 2pac's back, all the others are based on the two sides of him. Masculine/feminine, rough/gentle, bold/delicate basically the yin &amp; Yang side of him. Let me know what you think about it, and since i already promised I will update u with my progress, I had to keep it. <br> <br>Always, <br>Tseggai<img src="http://www.typophile.com/forums/messages/29/54397.jpg" alt="2pac Typeface"></p>
