    html: "<p>I like #1 as well, for the reasons Chris mentioned. However, it seems TOO clean. Looking at his tattoos, they were all amateurish needle-and-india-ink hack jobs. I think that handcrafted look might be \"more\" authentic. Overall I think the typefaces you've posted here are too \"techno.\" <br> <br>But again, I like #1 a lot, except that I think you should make the T more dramatic and oversized, like the S. <br> <br>Good luck!</p>"
