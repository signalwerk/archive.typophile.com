    html: <p>Harant, thanks for the tips. Especially about selling it. I never thought of it. The project includes the design of a poster to sell it, and information panel or booklet and a t-shirt. All my classmates do superb design job, but they still had the time to appreciate. My professor seems to not know about 2-pac, so i gave him "tupac resurection" and "2pac 4ever" dvd's to know him better. I sitill got to do same for some of the classmates and the rest of the professors who will be in the board. Chris, thanks for the tip on "C". I'll try to flip it vertically and see. I'll keep bringing the latest updates on it. <br> <br>Tseggai</p>
