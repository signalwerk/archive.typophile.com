      <p>I think it is a Harry Obese modified, some of the characters (R, F, N, A) are exactly the same. I just have found digitized the <a href="http://www.identifont.com/list?2+harry+2+23N+183+2WG+0+7NW+0" rel="nofollow">Squeeze</a> version but still you can see it.<br>
      There is a sample in the Phil's Homage To The Alphabet catalog (p.205).</p>
