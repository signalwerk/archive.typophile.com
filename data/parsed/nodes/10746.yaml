    html: <p>Sorry about the errors... no-one had responded to the post and I started to play around with some sneaky javascript... anyway, got rid of that now. I've been thinking of changing the fonts around... I may even go for a serif, or something like optima..  <br>Tiffany, what connect four bugs did you get? I hoped I had finally debugged everything...  <br>  <br>Randy, join me in my subtle use of flash... it seems that people expect Flash to be used in a flashy sort of way... when its used subtly people object  <br>  <br>I may change colours subtly. The green does need to be darker... <br> <br>What fonts would you recommend to describe 'play' and 'contact me'... I don't want a typorgy... <br> <br>Matthew</p>
