  html: <p>I've been experimenting with different layouts for my site, <a href="http://www.become.co.uk" target="_blank">http://www.become.co.uk</a>. I have settled for the time being on a basic two pane layout. I think it is quite good, but lately my judgement has been quite iffy. <br> <br>What do you think? Have you any recommendations? <br> <br>Matthew Brown</p>
