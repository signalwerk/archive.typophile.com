    html: <p>Matthew, <br> <br>I'm getting a javascript error on loading the page. It says it's expecting a ) on line 75. <br> <br>I tend to like lots of white space which you have in abundance. I also like understated use of Flash. One look at my very-much-in-need-of-an-overhaul website <a href="http://www.aquatoad.com" target="_blank">www.aquatoad.com</a> will confirm that. <br> <br>On the downside, the colors arent my favorite, but they're ok. The html text (Helvetica I think, I can never remember) it dificult to read because of the tight spacing combined with grey color. Try verdana or georgia for better legibility. <br> <br>Regards, <br>Randy</p>
    html_clean: <p>Matthew, <br> <br>I'm getting a javascript error on loading the page. It says it's expecting a ) on line 75. <br> <br>I tend to like lots of white space which you have in abundance. I also like understated use of Flash. One look at my very-much-in-need-of-an-overhaul website <a href="http://www.aquatoad.com" target="_blank" class="link-external">www.aquatoad.com</a> will confirm that. <br> <br>On the downside, the colors arent my favorite, but they're ok. The html text (Helvetica I think, I can never remember) it dificult to read because of the tight spacing combined with grey color. Try verdana or georgia for better legibility. <br> <br>Regards, <br>Randy</p>
