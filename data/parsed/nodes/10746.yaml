    date_raw: 26 Mar 2003 — 10:24am
    votes: null
    html: <p>Matthew, I like your site, but I think you could actually "play" more with your typefaces. I get the feeling of "work" from the sans serif you have used, but I don't get "play" for the title "play". I don't get "contact" or "all about me". See what you can do, you may want to even do "stuff" by hand to personalize the "about", since it is about you. Plus I don't see much contrast. Just some things to think about. </p>
