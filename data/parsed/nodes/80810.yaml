      <p>I'm sad to see the much more unique wordmark go, but this is definitely clearer. Except that in the solid version, the /o/ does look like an /a/. Why not cut into the letters where the lines in the other version are necessary for readability? Kind of like <a href="http://fontfabric.com/val-font/" rel="nofollow">VAL</a> does on a lot of characters because it's so fat.</p>
      <p>Disconnecting the /t/ does make the /e/ clearer, but it seems, well, disconnected. Especially since the negative space there is larger than between the two words.</p>
      <p>As for the mark, could you make it more like a stylized violet (<a href="http://en.wikipedia.org/wiki/File:Viola_odorata_001.JPG" rel="nofollow">viola odorata</a>)? I don't know if that would be appropriate (I don't even know what the company is besides "a young") but given the vague connotations of stylized flowers, I doubt it would be <em>in</em>appropriate.</p>
