    html: |-
      <p>An interesting concept, but is too literal in its geometry. This happens all the time with this kind of lettering: lines on a grid in illustrator plus a fat round stroke. In order to work well, they require all manner of subtle trickery to keep from clogging. Specifically, the horizontal strokes should be thinner than the vertical, and you need to thin out the joints. Lastly the spacing needs work. Notice the counter space and width of the round letters is much larger than the counter and space between ui etc. Try and harmonize these a bit better.</p>
      <p>I've attached two typefaces I've designed that may help you attack the problem of Heavy+Geometric. It's a tricky beast. Good luck!</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Artwork-2_5594.jpg"></div><p></p>
    html_clean: |-
      <p>An interesting concept, but is too literal in its geometry. This happens all the time with this kind of lettering: lines on a grid in illustrator plus a fat round stroke. In order to work well, they require all manner of subtle trickery to keep from clogging. Specifically, the horizontal strokes should be thinner than the vertical, and you need to thin out the joints. Lastly the spacing needs work. Notice the counter space and width of the round letters is much larger than the counter and space between ui etc. Try and harmonize these a bit better.</p>
