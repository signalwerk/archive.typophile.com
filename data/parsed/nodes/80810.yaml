    html: |-
      <p>Well keep in mind that this is coming from someone who still can't read or write cursive, but... I guess if I had to narrow it down, aside from the /t/ there's the /d/ and /ol/ that might be hard to differentiate. The /u/ and /v/ actually differentiate surprisingly well, but of course I already know what it says. The amount of delay for someone to read it is probably very small, however. It's just that, as a logo, <em>I</em> feel it should be quickly legible (though there seems to be a trend away from legibility in logos).</p>
      <p>There are a couple things that are kind of weird in the design of it—the narrowness of the /d/ and the space in /le/...or maybe it's the width of /e/. That /t/ might actually work if the circle were lowered a bit.</p>
      <p>The thing is, I understand all your decisions, they all seem reasonable, and it <em>looks really good</em> overall, so I hesitate to critique it too harshly.</p>
      <p>On the subject of small sizes and line thickness, you could produce a non-outlined version for small applications.</p>
