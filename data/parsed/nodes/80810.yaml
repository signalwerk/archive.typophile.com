    <p>Hi all, designing a logo from a drawing I made,<br>
    I need to make the type more legible for the client,<br>
    any advice is welcome! The company name is liquid violet.<br>
    They are a young </p>
    <p>The below was sent to the client as explanation:</p>
    <p>'The logo here is typographic. A bespoke<br>
    typeface has been created for Liquid Violet<br>
    which draws on liquid forms taken from the<br>
    name. This logo represents a more modern<br>
    approach. Please note the typeface can be<br>
    made more legible if desired and the word<br>
    ‘liquid violet’ can be placed within the<br>
    logo-mark.'</p>
    <p>Liquid seems to be more legible than violet right now? </p>
    <p>Thanks all. </p>
