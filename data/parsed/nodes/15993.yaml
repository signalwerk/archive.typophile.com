      <p>One definition of software...</p>
      <p><em>computer programming code that provides a computer with instructions to perform specific tasks.</em></p>
      <p>which is what we commonly refer to as a <strong>font</strong> is. What <em>used</em> to be called fonts -- a single size of a single typeface cast in metal -- could just as easily be called be called <strong>foundry</strong> (factory where metal castings are produced) <strong>products</strong>. However, as David noted above, the designation of typeface products as software is the only element of legal protection for our work that U.S. laws allow. So, what's all the hub-bub, bub?</p>
