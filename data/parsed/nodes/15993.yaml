      <p>My main problem with design patents is that unlike copyright, they involve serious money/effort in getting the design patent. Very few type foundries (other than Adobe) use them, because the costs are so steep.</p>
      <p>The nice thing about them is that they protect the abstract design. This is the type of protection I would like to see in copyright for fonts.</p>
      <p>Btw, I never said or suggested that OT code was more valuable than bitmaps. I have no idea where Hrant got the idea that I did. I don't recall anybody else saying it in that thread, either.</p>
      <p>Cheers,</p>
      <p>T</p>
