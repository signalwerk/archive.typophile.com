      <p><a href="https://web.archive.org/web/20150124160059/http://www.typographer.org/" title="http://www.typographer.org/">http://www.typographer.org/</a>, nice point.<br>
      "I think it devalues high quality typography to label it as software,"</p>
      <p>(It's hard to read when I have to ask myself...what's "typography"...?)</p>
      <p>An idea related to this, is: "typefaces" are brilliant shining (slowly formed and long term) ideas, and "fonts" are relatively "dumb" parts of dumb mechanisms (with dumb being good as it brings a great deal of "Far and Fast"), and "typography" is the thing that weds them for economic and/or artistic gain, funding the whole thing by the interminably long or short, and infinitely possible or impossible "things-people-do" to make *their* brilliant shining ideas, out of said fonts and into — typography. There are other ways to slice it, but fonts (as software), are the key dividing line between design of the type, and design of the typography. So we, founders, (Font Software Developers if I'm talking to Another Audience), work in our many ways along the lines given to us by the dumb mechanism folk, (dumb being good in this context), to give the best experience possible for everyone from the "not much" things-people-do-with-type people to the too much things-people-do-with-type people, all with a single product.</p>
      <p>(...or does he mean that this particular industry has so many shining facets that he can't quite get a grasp on the sheer brilliance of it all? or is it too hard to be on the inside as one of those facets and have to change the context of his discription of what he is, every time he has to describe it in each new context that he meets?...)</p>
