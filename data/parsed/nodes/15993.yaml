      <p>First thoughts, before reading past the first paragraph.</p>
      <p>- Humans can be used for production as well as creativity.<br>
      - Color can be used to technically correct a problem, as well as visually enhance a solution.</p>
      <p>Thoughts after reading.</p>
      <p>- I think it won't be easy to make a cut-and-dried separation from using the words <strong>creative works</strong> without also using <strong>software</strong>. Maybe it isn't <em>necessary</em> to use them both at the same time. Maybe, depending upon context, you will use them in different order. But, I think because the legal is so deeply ingrained into it, it will always be necessary.</p>
      <p>For those of us whom appreciate -- as David does, and myself for that matter -- the hours that really go into <em>creating</em> a typeface we only need think of them as <strong>creative works</strong> that also happen to be a tool that runs like <strong>software</strong>.</p>
