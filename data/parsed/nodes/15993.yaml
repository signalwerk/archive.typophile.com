      <p>&gt;I think you’re ignoring an important aspect of coding.<br>
      &gt;Creativity is not limited to painting pretty pictures.</p>
      <p>You are right. Software/coding is also creative work. And definitely typography contains some coding, but that does not make it software. A car has an engine, but a car is not an engine. You may choose to speak about, or use, or midify the engine part of the car, which may affect the whole appearance and/or functioning of the car, but it still remains a car not an engine.</p>
      <p>Similarly, a font is a font, even if some part of it may be software, it cannot be identified as softwarfe alone. The other side is also true: you cannot say that a font is only a set of letter drawings.</p>
