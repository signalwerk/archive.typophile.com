    <p>David's latest post - <a href="https://web.archive.org/web/20150124160059/http://www.typographer.org/" title="http://www.typographer.org/">http://www.typographer.org/</a> seems worthy of discussion on this forum. </p>
    <p>Personally I don't feel that describing an OTF, TTF or Type 1 font as "software" denigrates the creative work involved. I feel that a font file, like a piece of film type or a hot-metal matrix is just one instance of a typeface design, so calling a particular digital instance "software" doesn't seem to reflect negatively on the typeface design itself, but I'd be interested in the forum’s thoughts on this issue. </p>
    <p>Cheers, Si</p>
  html_clean: |-
