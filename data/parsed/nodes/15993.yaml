    html: |-
      <p>I was being a bit facetious--a lot of those zillions of patterns <em>would</em> be indistinguishable and/or unusable as characters. There is still a lot of room for variation, especially when you throw in shades of gray. And when you get to larger grids, the field of possibilities expands by magnitudes.</p>
      <p>An aspect of the legal position of fonts in U.S. law is that they are considered "useful objects" (along with flatware). It seems that when something is regarded as such, the public's right to access is considered a greater good than the rights of originators. There is also this idea that "the alphabet" is in the public domain and that fonts are simply instances of "the alphabet" It all falls down when you consider that some fonts are more in demand than others. Clearly, not all fonts are valued equally by the people who use them, even though under the law they are considered to be interchangeable "useful objects," indistinguishable as instances of "the alphabet."</p>
    html_clean: |-
      <p>I was being a bit facetious--a lot of those zillions of patterns <em>would</em> be indistinguishable and/or unusable as characters. There is still a lot of room for variation, especially when you throw in shades of gray. And when you get to larger grids, the field of possibilities expands by magnitudes.</p>
      <p>An aspect of the legal position of fonts in U.S. law is that they are considered "useful objects" (along with flatware). It seems that when something is regarded as such, the public's right to access is considered a greater good than the rights of originators. There is also this idea that "the alphabet" is in the public domain and that fonts are simply instances of "the alphabet" It all falls down when you consider that some fonts are more in demand than others. Clearly, not all fonts are valued equally by the people who use them, even though under the law they are considered to be interchangeable "useful objects," indistinguishable as instances of "the alphabet."</p>
