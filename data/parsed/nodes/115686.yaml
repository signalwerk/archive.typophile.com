    html: |-
      <p>Monotype <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/zemestro/?refby=bowfin" rel="nofollow">Zemestro</a> is very close, but I found six or seven others as well that were so similar that it would take side by side comparison to tell them apart (at least for these letters). If you have other letter samples it might help. The letter that was hardest to match was the R, but all the candidate fonts I found had the same basic, straight-leg style, just slightly different counter shapes.</p>
      <p>Some other close styles: Sentico Sans, Glober, Prelo, Metronic, Dobra, Vinkel and FF Plus Sans, all at MyFonts.</p>
      <p>- Mike Yanega</p>
