  html: |-
    <p>I've completed the installation of FDK + the Macro installation successfully...</p>
    <p>But when I go and run the "Autohint" macro (and some others too), I get:<br>
    "The script cannot run the command-line program 'autohintexe.exe'. Please make sure the AFDKO is installed, and the system environment variable PATH contains the path the to FDK sub-directory containing 'autohintexe.exe'."</p>
    <p>I run the Autohint in a command window and it worked, so the FDK is installed OK. I hae a 2.4 version of python, running on Windows 8 64bits.</p>
    <p>Then I tried to put the source folder in the macro, but it still throws some imposiblruuu output.</p>
    <p>Any ideas? I've cheked other typophile posts, and the adobe documentation, but no answer...</p>
