      <p><strong>(i'm running python 2.4.4) The Autohint macro has a line that says</strong><br>
      <code><br>
      if os.name == "nt":<br>
      	haveAC = setFDKToolsPath("C:/FDK/Tools/win/autohintexe.exe")<br>
      else:<br>
      	haveAC = setFDKToolsPath("autohintexe")<br>
      </code></p>
      <p><strong>Which I substituted for (just for trying):</strong><br>
      <code><br>
      if os.name == "nt":<br>
      	haveAC = setFDKToolsPath("C:/FDK/Tools/win/autohintexe.exe")<br>
      else:<br>
      	haveAC = setFDKToolsPath("C:/FDK/Tools/win/autohintexe")<br>
      </code></p>
      <p>And now the message is the following: "Skipping glyph k. Failure in processing outline data Hinting l. 'autohintexe' is not recognized as an internal or external command, operable program or batch file."</p>
