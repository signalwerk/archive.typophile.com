    html: |-
      <p>Did you also run the FinishInstallWindows.cmd file?</p>
      <p>Quoting the Read_Me_First.html file:<br>
      <cite>Open the "FDK" folder. and find the file "FinishInstallWindows.cmd".<br>
      Open a command prompt window. If you do not know how to do this, read the file "FDK\Technical Documentation\CommandLineHowTo.pdf".<br>
      Drag the icon for the file "FinishInstallWindows.cmd" onto the command prompt window. This pastes the path into the command prompt window. Press the "enter" key. This runs the program.<br>
      </cite></p>
