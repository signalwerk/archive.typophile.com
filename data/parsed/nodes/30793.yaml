    <p>I just received a design piece for the 2007 How Design Conference that will be held June 10-13 in Atlanta, GA</p>
    <p>They are offering workshops/lectures from "Can't We All Just Get Along" to aspects of Photoshop, Illustrator, InDesign, Color Trends, even a Gloss-n-Floss Font workshop.</p>
    <p>I was wondering if anyone here was giving any of the 49 sessions and 11 workshops?</p>
    <p>Anyone planning on attending?</p>
    <p>Has anyone been to the HOW conference in previous years? If yes, what were they like?</p>
    <p>If you are interested, they of course, give a website to visit - howconference.com</p>
