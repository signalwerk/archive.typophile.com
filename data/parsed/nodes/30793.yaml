    html: |-
      <p>I have attended the last 3 How Conferences. It can be hit or miss. Some great designers are not necessarily great speakers. I think it is still worth going, as you can meet some great people. The resource center and bookstore are also great. I have picked up a lot of back issues of HOW and Print for cheap and tons of free paper samples.</p>
      <p>The conference is very busy, it sold out the last 2 years, and they always pick a city that has ungodly heat.</p>
      <p>Don't overbook yourself. Allow some free time to explore the city and just rest. The optional studio tours are okay, but after a while it got repetitive.</p>
      <p>I'm looking forward to Chip Kidd and Deborah Sussman speaking at this year's conference.</p>
      <p>You can also go to forum.howdesign.com and go to the Design Events and Lounge section to meet people (like me) who are going.</p>
