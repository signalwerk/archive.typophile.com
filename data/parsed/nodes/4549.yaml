    html: <p>Robert, I went to a talk he gave at the Urbis museum last month, thought he was one of the most interesting and charismatic speakers I've heard in a long time. It's often difficult to distil into words just why his designs have such a resonance, the mystery you describe, the uncluttered, classical, almost at times austere layouts are why I think his design work has an ageless quality. Coupled with his uncanny prescient feel for condensing new contemporary trends into a meaningful visual format and you realise Factory were fortunate indeed.  <br> <br>Someone asked him at the talk which font he wanted on his gravestone, he chose News Plantin, used by his own studio on their identity and branding. Quite ironic seeing as it was selected by 'Graphic Thought Facility' after the Design Museum commissioned the agency, when they felt it was too risky hiring Saville in case he missed the deadline for his own show! Talk about your reputation preceding you.  <br> <br>There's another interesting book which came out late last year, a limited edition monograph which has much better quality reproductions, if less theory than 'Designed...' available <a href="http://www.btinternet.com/~comme6/saville/folio1.htm" target="_top">here.</a> <br></p>
