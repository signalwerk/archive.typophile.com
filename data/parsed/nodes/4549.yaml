    html: <p>Amazing how much of that was so timely when it came out (trendy is too tainted a word) and yet it is so timeless still.  <br> <br>___ <br> <br>Speaking of Joy Division, the movie <a href="http://www.partypeoplemovie.com/" target="_blank">24 Hour Party People</a> is a good take on the Manchester music scene of the 80s. Prior to seeing the movie I could not appreciate the poor recording quality of Joy Division, the lyrics especially. Afterall, I was raised on New Order. But the movie tapped me into that psyche somehow. It's like being able to look again at Meta and appreciate its quirks after falling in love with Unit. <br></p>
