    html: <p>Hi Sarnie, <br> <br>The idea to use Wim Crouwel's New Alphabet was less about the importance of his font (although I liked it a lot) than it was to combine it with Garamond... I think Peter had a book around with the Neue Alphabet in it, and I quite liked it. These were pre-Fontographer days (for us), so I had to draw/re-draw the Crouwel characters I needed and I had the Garamond typeset and pasted the whole thing together by hand. It took a lot of fiddling to get the balance right, but the idea of something concurrently futuristic and classical seemed appropriate for a Joy Division 'anthology' in 1989. Of course, the Jan Van Munster artworks on the inner liners made the whole story complete. <br> <br>As for the Adobe posters, they were not for sale. They were sent to design schools around the world to promote CS. I only have about five file copies myself. You might want to try your local Adobe office (I don't know which country you are in) and enquire there. <br> <br> - Brett</p>
    html_clean: <p>Hi Sarnie, <br> <br>The idea to use Wim Crouwel's New Alphabet was less about the importance of his font (although I liked it a lot) than it was to combine it with Garamond... I think Peter had a book around with the Neue Alphabet in it, and I quite liked it. These were pre-Fontographer days (for us), so I had to draw/re-draw the Crouwel characters I needed and I had the Garamond typeset and pasted the whole thing together by hand. It took a lot of fiddling to get the balance right, but the idea of something concurrently futuristic and classical seemed appropriate for a Joy Division 'anthology' in 1989. Of course, the Jan Van Munster artworks on the inner liners made the whole story complete. <br> <br>As for the Adobe posters, they were not for sale. They were sent to design schools around the world to promote CS. I only have about five file copies myself. You might want to try your local Adobe office (I don't know which country you are in) and enquire there. <br> <br> - Brett</p>
