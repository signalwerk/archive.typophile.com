    html: <p>Thanks Brett, I came across the Atmosphere and Substance promo posters in the Richard Goodall Gallery in Manchester a few years ago. I was struck by how exquisite the composition and layout were.  <br><br>One thing I noticed after <a href="http://www.foundrytypes.co.uk/" target="_top">The Foundry</a> released Neue, was the variation in your use of the underlined letter M for N. Now I appreciate if it was hand drawn, you could decide to modify it for aesthetic reasons, though I suspect for some of the typographers on this forum, this may be construed as heresy (violating Crouwel’s work in such a manner). <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
    html_clean: <p>Thanks Brett, I came across the Atmosphere and Substance promo posters in the Richard Goodall Gallery in Manchester a few years ago. I was struck by how exquisite the composition and layout were.  <br><br>One thing I noticed after <a href="http://www.foundrytypes.co.uk/" target="_top" class="link-external">The Foundry</a> released Neue, was the variation in your use of the underlined letter M for N. Now I appreciate if it was hand drawn, you could decide to modify it for aesthetic reasons, though I suspect for some of the typographers on this forum, this may be construed as heresy (violating Crouwel’s work in such a manner). <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
  - id: 33490
