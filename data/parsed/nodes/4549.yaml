  html: "<p>... have a website under construction: <a href=\"http://www.saville-associates.com\" target=\"_blank\">http://www.saville-associates.com</a> <br> <br>I wonder if anybody else finds this as exciting as I do ... ? And as typically Saville-weird -- it takes him until 2004 to get a website moving. <br> <br>I guess he's controversial as a designer -- I spoke to a designer acquaintance recently about my visit to the <a href=\"http://www.designmuseum.org/designerex/peter-saville.htm\">Peter Saville Show</a> at the London Design Museum and he erupted in a rant about how Saville was a dilettante, a has-been and a hands-off 'Art Director' who only bothers to get out of bed (generally at around 4pm) to give a thumbs-up or -down to whatever his acolytes are working on. And I'm sure that's all true. Yet still -- to my eye -- everything he touches has a mystery and perfection to it that nobody can match. He was the reason -- as for so many people, I'm sure -- that I ended up in the field I'm in; the early New Order and Joy Division covers were such extraordinary objects that they engendered in me a fascination with design -- and particularly type -- that started me on the journey I'm on now. <br> <br>There's so much that's interesting about Saville and his work -- where to begin? That his old typographer, Brett Wickens, is now at MetaDesign and supervised the current redesign of the Adobe product line, which owes so much to Saville &amp; Wickens' work for Yohji Yamamoto? That he's perhaps single-handedly responsible for the revival of the late-modernist Swiss design ethic in the late 80s (and which continues today)? <br> <br>Did anyone else buy the <a href=\"http://www.amazon.com/gp/reader/1568984227/ref=sib_dp_pt/104-0443871-5919952#reader-link\">book</a>? <br> <br>R</p>"
