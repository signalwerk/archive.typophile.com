    html: <p>Thanks Brett, I came across the Atmosphere and Substance promo posters in the Richard Goodall Gallery in Manchester a few years ago. I was struck by how exquisite the composition and layout were.  <br> <br>One thing I noticed after <a href="http://www.foundrytypes.co.uk/" target="_top">The Foundry</a> released Neue, was the variation in your use of the underlined letter M for N. Now I appreciate if it was hand drawn, you could decide to modify it for aesthetic reasons, though I suspect for some of the typographers on this forum, this may be construed as heresy (violating Crouwel's work in such a manner). <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
    html_clean: <p>Thanks Brett, I came across the Atmosphere and Substance promo posters in the Richard Goodall Gallery in Manchester a few years ago. I was struck by how exquisite the composition and layout were.  <br> <br>One thing I noticed after <a href="http://www.foundrytypes.co.uk/" target="_top" class="link-external">The Foundry</a> released Neue, was the variation in your use of the underlined letter M for N. Now I appreciate if it was hand drawn, you could decide to modify it for aesthetic reasons, though I suspect for some of the typographers on this forum, this may be construed as heresy (violating Crouwel's work in such a manner). <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
  - id: 33490
    user: 3638
    date: 2004-05-04T00:16:00
    date_raw: 4 May 2004 — 12:16am
    votes: null
    html: <p>Sarnie, <br> <br>I didn't really modify Crouwel's font, I simply used the M instead of the N for aesthetic reasons. After all, the M is simply the N with an underline, in the original font. <br> <br>But, if you were to translate it according the actual font, I guess you would get SUBSTAMCE, though nobody saw it that way. <br> <br>About a year after doing that cover, a guy in South Africa (Leslie Willmers, I think his name was) emailed me a postscript version of the Neue Alphabet which he had painstakingly created - and many years before The Foundry got around to it. I still have it somewhere, thought it's not quite perfect. <br> <br>And, believe it or not, I actually tried some comps for the new Adobe packaging using New Alphabet, but they just looked weird. Without the Garamond, and fifteen years later, it all looked painfully trendy - more like the packaging for Wipeout XL than something interesting and prescient. <br> <br> - Brett</p>
    html_clean: <p>Sarnie, <br> <br>I didn't really modify Crouwel's font, I simply used the M instead of the N for aesthetic reasons. After all, the M is simply the N with an underline, in the original font. <br> <br>But, if you were to translate it according the actual font, I guess you would get SUBSTAMCE, though nobody saw it that way. <br> <br>About a year after doing that cover, a guy in South Africa (Leslie Willmers, I think his name was) emailed me a postscript version of the Neue Alphabet which he had painstakingly created - and many years before The Foundry got around to it. I still have it somewhere, thought it's not quite perfect. <br> <br>And, believe it or not, I actually tried some comps for the new Adobe packaging using New Alphabet, but they just looked weird. Without the Garamond, and fifteen years later, it all looked painfully trendy - more like the packaging for Wipeout XL than something interesting and prescient. <br> <br> - Brett</p>
