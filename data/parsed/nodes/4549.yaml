    date: 2004-05-04T02:16:00
    date_raw: 4 May 2004 - 2:16am
    votes: 0
    html: <p>Sarnie, <br><br>I didn’t really modify Crouwel’s font, I simply used the M instead of the N for aesthetic reasons. After all, the M is simply the N with an underline, in the original font. <br><br>But, if you were to translate it according the actual font, I guess you would get <span class="caps">SUBSTAMCE</span>, though nobody saw it that way. <br><br>About a year after doing that cover, a guy in South Africa (Leslie Willmers, I think his name was) emailed me a postscript version of the Neue Alphabet which he had painstakingly created — and many years before The Foundry got around to it. I still have it somewhere, thought it’s not quite perfect. <br><br>And, believe it or not, I actually tried some comps for the new Adobe packaging using New Alphabet, but they just looked weird. Without the Garamond, and ﬁfteen years later, it all looked painfully trendy — more like the packaging for Wipeout <span class="caps">XL</span> than something interesting and prescient. <br><br> -&nbsp;Brett</p>
