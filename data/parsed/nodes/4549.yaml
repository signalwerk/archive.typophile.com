    html: <p>&gt; I always wondered about the signiﬁcance of the design. It apparently harkens back to when <span class="caps">BMW</span> made airplane (propeller) engines, and the blue and white quadrants symbolize a propeller in motion. <br><br>i’m not sure about the propeller theory, brett. the blue and white checker pattern is a major part of the bavarian identity. if you ever get the chance to visit the oktoberfest in munich, you’ll see it all over. <br>and since <span class="caps">BMW</span> stands for Bayrische MotorenWerke (bavarian motor works), i think it rather has to do with that, then with airplanes. but maybe it has to do with both. <br><br>didn’t wanna be a smartass, just thought you might like to&nbsp;know.</p>
