      <p>While I'm not clear why you have to use the corporate font to create the logo your present special characters do relieve some of the predictability of Rotis, however the L and R look a little light, especially with the Es, an answer to that might be to work on the serifs of the E, especially on the crossbar. You have kerning issues throughout, but must finish the character development before you can adjust them.<br>
      Tim</p>
