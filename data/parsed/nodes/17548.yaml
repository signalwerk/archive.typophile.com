      <p>What Tim is saying makes sense. If all of the packaging using Rotis it might be more interesting to use a different typeface which contrastst with the it. If anything, Rotis is a display font. For me anyway. I think the fact that you did draw some unique letters helps. If you would have used the type out of the can it wouldn't be enough to differentiate it.</p>
      <p>The N seems a little naked compared to the other characters that all have at least one semi-serif.</p>
