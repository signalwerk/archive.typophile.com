    <p>Hi All-Of-U!</p>
    <p>First let me introduce myself. I'm a designer from hungary (Central-eastern Europe).<br>
    I am working on a logotype (more type less logo :) for a consulting company. They are selling a portal engine named "Celerus". The Corporate font for all the printed stuff is Rotis Semi-serif, so I must use it also in this case.</p>
    <p>I designed a few special characters for this project instead of using the originals.<br>
    This is an early stage of design (the "n" is still without serif)<br>
    Please if U grlz&amp;guys got time, take a look at my work!<br>
    Mudan</p><div class="imageWrap"><img src="http://typophile.com/files/Celerus.jpg"></div><p></p>
