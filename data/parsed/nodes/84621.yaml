      /S/ needs smoothing.<br>
      /Y/ connection is too high.<br>
      /A/ crossbar is too high.<br>
      Move rightmost /W/ hand to the left.<br>
      Same with /V/ - it „falls“ to the right.<br>
      /K/ is broken.</p>
