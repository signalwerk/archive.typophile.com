    <p>Hello all. I am currently working on creating a typeface loosely based on a piece of hand-written signage I found on a recent trip to Thailand. So far, I have designed caps only, but I aim to continue and create a comprehensive character set. I guess I'm trying for something quirky yet elegant!</p>
    <p>Any thoughts and criticism would be much appreciated at this stage.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/flametree_1_5033.jpg"></div><p></p>
