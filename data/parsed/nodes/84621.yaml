      <p>Thanks Minerva. Actually, no, I didn't create them in that manner, although it might have made things easier!</p>
      <p>I probably should have pointed out that one of the things I liked most about the lettering that inspired this typeface was the somewhat exaggerated height of the characters, and so the elevated crossbars of the A and H and comparatively small counters of the P and R. Similarly, the curly leg of the R was integral to its charm and so I am tempted to stick with these quirks. Agree with you with everything else though, so many thanks for taking the time to look and pass on some comments. N,M and W have caused a lot of bother trying to eliminate those dense spots at the joins without the characters becoming excessively wide or the strokes to fine.</p>
      <p>In the meantime, I have also been working on the lowercase, so I will report back soon with more to dissect.</p>
      <p>Cheers!</p>
    html_clean: |-
