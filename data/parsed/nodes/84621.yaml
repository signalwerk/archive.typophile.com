      <p>I see you lowered /P/ and /R/ bowls - looks more balanced.<br>
      /Y/ connection still looks to be higher than /H/ for example.<br>
      /X/ is quirky (very difficult letter to get right) - lower right leg is too far out.<br>
      /G/ and /E/ bars are at different heights now (somehow). They need to be at either the same height, or noticeably different.<br>
      /K/ connection was lowered too much. Now top is too light. Also try another connection.<br>
      /c/ too wide (big).<br>
      Not sure about /g/. The bowl should come from /d/, or try the two-story /g/.<br>
      /r/ terminal too dark.</p>
