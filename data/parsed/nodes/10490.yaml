    html: "<p>A bit more about Tempo: <br> <br>It was very popular headline face for newspapers before \"cold type\" took over in the 1970s. As Raph points out, it looks similar to Spartan. Both were modeled on Futura--Spartan to a greater degree and Tempo to a lesser degree.  <br> <br>Tempo, like some other contemporary geometric sans, had alternate characters so you could make it look like Kabel, Erbar, Vogue, or Futura (with a one-storey a). The reason for this was undoubtably pragmatic. Most of their customers (newspapers) used other manufacturers' equipment (Linotype mainly) for setting text. Ludlow was used for headlines. By offering these alternate characters, they could offer reasonably close matches to the smaller faces set with the other equipment. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/70511.gif\" alt=\"tempo1\"> <br> <br>The Light Italic and Medium Italic were very unusual in that they had tails on some of the lowercase characters (m, n, i, u) and other somewhat calligraphic features--even a set of swash caps. The closest I've seen to this is <a href=\"http://www.houseind.com/index.php?page=showfont&amp;id=18&amp;subpage=viewfontspecimens\" target=\"_blank\">Neutraface Italic</a>. Tempo Italic was definitely in the back of my mind when I dreamed up <a href=\"http://www.ms-studio.com/FontSales/coquette.html\" target=\"_blank\">Coquette</a>. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/70512.gif\" alt=\"tempo2\"></p>"
    html_clean: "<p>A bit more about Tempo: <br> <br>It was very popular headline face for newspapers before \"cold type\" took over in the 1970s. As Raph points out, it looks similar to Spartan. Both were modeled on Futura--Spartan to a greater degree and Tempo to a lesser degree.  <br> <br>Tempo, like some other contemporary geometric sans, had alternate characters so you could make it look like Kabel, Erbar, Vogue, or Futura (with a one-storey a). The reason for this was undoubtably pragmatic. Most of their customers (newspapers) used other manufacturers' equipment (Linotype mainly) for setting text. Ludlow was used for headlines. By offering these alternate characters, they could offer reasonably close matches to the smaller faces set with the other equipment. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/70511.gif\" alt=\"tempo1\"> <br> <br>The Light Italic and Medium Italic were very unusual in that they had tails on some of the lowercase characters (m, n, i, u) and other somewhat calligraphic features--even a set of swash caps. The closest I've seen to this is <a href=\"http://www.houseind.com/index.php?page=showfont&amp;id=18&amp;subpage=viewfontspecimens\" target=\"_blank\" class=\"link-external\">Neutraface Italic</a>. Tempo Italic was definitely in the back of my mind when I dreamed up <a href=\"http://www.ms-studio.com/FontSales/coquette.html\" target=\"_blank\" class=\"link-external\">Coquette</a>. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/70512.gif\" alt=\"tempo2\"></p>"
