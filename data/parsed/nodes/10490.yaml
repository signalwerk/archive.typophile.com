    html: "<p>From Myfonts.com's Journal sans page: <br> <br>\"The typeface was designed at the Polygraphmash type design bureau in 1940-56 (project headed by Anatoly Shchukin) based on Erbar-Grotesk typeface of Ludwig &amp; Mayer company, 1929 by Jakob Erbar, and on Metro typeface of Mergenthaler Linotype, 1929 by William A. Dwiggins. A sans serif of geometric style. For use for text and display typography.\" <br> <br>Now the question is; does anyone here have links to any specimens on Erbar-Grotesk (1929) ? <br>Dwiggins' Metro #2 is familiar, but how does the #1 look like?</p>"
