    html: "<p>Thanks Mark and everyone else! <br> <br>Tempo was a name that was bouncing around in my head. I wasn't sure why, as I'd only really seen it in the bold condensed like you mentioned. <br> <br>A couple weeks ago I went to the City Museum (basically a building full of neat would-be garbage). The walls near all the elevators are covered with old printing plates and empty type cases. And I snapped this picture: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/70563.jpg\" alt=\"tempobolditalic\"> <br> <br>So I guess that explains why I thought Tempo. <br> <br>And perhaps there's a chance they snatched this up from the Globe-Democrat, which no longer exists. <br> <br>I'm still curious as to what's so wrong with that 'a'.</p>"
