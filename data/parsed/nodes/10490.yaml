    html: <p>Red Rooster (Steve Jackaman) had rights to at least some of the Ludlow collection. The font Jan pointed out was one of the digitizations Steve did on typefaces from the Ludlow type, and there were a number of others, including Radiant, Bodoni Campanile, Ultra Modern, Railroad Gothic, Florentine Cursive, Coronet, Ludlow Garamond (including swash italics) and Hauser Script. <br> <br>Thanks for the background  and samples on Tempo, Mark.</p>
