    html: <p>By far the most common Newspaper sans of the pre-digital era was Spartan. What you have here is an exceptionally poor cut of it, with the two-storey 'a' standing out as particularly badly done (I'm not sure which alternates were available, but Jaspert has just the one-storey). It will be hard to track down exactly which manufacturer was responsible for this butchery, but perhaps your curiosity doesn't extend quite that far.</p>
