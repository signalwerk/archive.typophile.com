  html: <p><img src="http://www.typophile.com/forums/messages/83/70491.jpg" alt="globedemocratclipping"> <br> <br>This is the headline typeface used in the St. Louis Globe Democrat newspaper dated June 22, 1971. It kinda jumped out at me when I was looking through my grandma's old photos and stuff, and I haven't been able to figure it out. <br> <br>Your help is appreciated.</p>
