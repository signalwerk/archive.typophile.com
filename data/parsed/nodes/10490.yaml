    html: <p>The face in question is the old Ludlow metal face Tempo. The weights in the samples above are Tempo Bold and Tempo Bold Italic.  <br> <br>The only survivors of the Tempo family in digital form that I know of are <a href="http://www.myfonts.com/fonts/linotype/tempo/" target="_blank">Tempo Bold Condensed and Tempo Bold Condensed Italic</a>. The rest of the family has never made it to digital (although there was a guy in the UK a couple of years ago who apparently got the rights to the Ludlow name and library who had a few new weights of Tempo for sale, but he and the site seem to have disappeared). I don't recall that it was ever even available in phototype.</p>
