    html: <p>Spartan had an alternate two-storey a as well, at least in the lighter weights. I don't know if it was used much, but in the old Linotype specimen books it looks surprisingly natural. I actually prefer it. It's a bit better-thought-out than the one in Tempo--not so wide.</p>
