      <p>Hay Rachel,</p>
      <p>My first impression is that the letters don't work well together (maybe it's just me, but using upper and lower case letters randomly in a word seems wrong). Also, the logo seems a bit heavy for a textile company. I know this may be deliberate, referencing the machines themselves, but it's what I notice.</p>
      <p>The bottmos of uppercase letters shaped like a needle are a nice touch though. I'd also be careful with the 'closed-ness' of the e's. Thay might close and look like crossed o's in smaller sizes (especially if the medium used for the logo is knitted, or thred).</p>
      <p>I have to say that the combined "F" "T" symbol is very nice. Conceptually. It also seems too heavy.</p>
      <p>Just my opinion.</p>
