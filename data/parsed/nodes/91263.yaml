  html: |-
    <p>Current renderings of the Massachusetts state seal use a sans-serif for this motto, but it appears to have been originally drawn as a serif. The face, as drawn, is inconsistent in its style, so this might be a tall order to fill. Perhaps someone with knowledge of the period (1890-1910) might know what the illustrator was going for?</p>
