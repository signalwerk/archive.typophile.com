      <p>P.S. Your insight would be a lot more intriguing if it were not patently obvious to anyone with…what?…eyes?</p>
      <p>OTOH, I must confess that I assume that you are not impaired in any way; however, the internet is not always accommodating to blind people—lucky them—so…</p>
      <p>P.S. this post, believe it or not, was all in fun, spoken both kindly and gently. And, BTW, IMHO—this lady knows her stuff. If I could afford to, I would buy a boatload of her fonts. If I could afford to…</p>
      <p>However, since I am having a tough time getting a free beer and a fiendishly clever free stop in Detroit to work out, my luck has not been so hot lately. But, one can always hope.</p>
      <p>No: actually, one must ALWAYS hope, or this sh*t happens...<br>
      <img src="http://www.nicksfonts.com/depot/hell.png"></p>
      <p>And I DO mean “Express”…but, as you will note, both stylishly and conveniently...</p>
