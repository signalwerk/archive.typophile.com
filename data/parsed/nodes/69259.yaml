      <p>These samples are great. But they are examples of working around the problem. Mine included. @ is an old glyph from (If I remember correctly) Italian book keeping manuscripts.</p>
      <p>It's been in PS1 fonts from the start, for a reason I can't figure out. And with e-mail it is now everywhere.</p>
      <p>And because of that new prominance, should this glyph get some standard features? We've interpreted the original form (or not), and just worked around it, rather than stopped and see why  it looks so awkward.</p>
      <p>Could we find a way to make a standard way to incorporate @ to type design? We should be able to do that. Probably fight a lot during, but in the end find a good solution.</p>
      <p>P.S. You can see the difference of @ and @ by just replying to this and then previewing; Courier has a designed @, while (Georgia?) has a generic version.</p>
