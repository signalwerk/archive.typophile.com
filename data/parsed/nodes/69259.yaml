      <p>Remember that politically correct scholars in the States are now using the at symbol for a "gender neutral" character in Spanish. In the past month, we have set two books where "Latin@" occurs throughout the text, in both roman and italic.</p>
      <p>My comment to the editor was that using the at symbol presented the female as being encircled by the male, with the only escape space at the bottom, and so small to require  dieting to the point of fashion model thinness for any possibility of escape. Obviously, the use of the at symbol had to be a male-chauvinist plot.</p>
      <p>But no luck. Make your at symbols accordingly, and remember the extra kern pairs needed . . .</p>
