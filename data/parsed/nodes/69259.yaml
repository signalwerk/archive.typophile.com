      <p>Tomi, the problem with starting with a lower case d is if you are then giving the character both full l/c ascender and descender depth, which then makes the character look too big compared to the other l/c characters (which only have either an ascender or a descender, very rarely both (thorn?) and commonly neither. Now that's no problem if you subscribe to Ray's view suggested above that that the '@' <em>needs</em> to be bigger to do it's job (at least in email addresses) properly. But you definitely don't want your '@' looking like its a points size or two too big in relation to the rest of the font. </p>
      <p>I'm currently designing an @ that is optically the same height as the caps but descends optically as far below the x-height as it did above. This means that the 'a' part of it, still sits within the lower case x-height which is tidy in my head but it's not as tall as the full l/c ascender and descender design.</p>
      <p>The trouble is it then appears to unhealthily dip below the baseline in a line of caps so I've done a cap version of it too. Messy? Afraid so.</p>
      <p>The beauty of Nick S's design for Scotch Modern is that you only need one version of it plus it sits beautifully on the baseline (the common reference for all three major styles within a font - upper case, lower case and even small caps. (Incidentally Nick, what did you do for small caps?) I'm not sure how well the Scotch Modern '@' performs as the kind of stand-out character that Ray was talking about but any sort of stand-out character would have constituted a defeat in Nick's mind, surely?</p>
