    html: |-
      <p>@ is not a lowercase letter. It's not a capital letter. It's more like a dash, hashmark, asterisk, dagger, para, section. In the context of an email address, it shouts "hey, this is an email address". If you make it conform too much, it doesn't do it's job. When I make an @ . . . I think about the weight . . . obviously lighter so it doesn't look too dark. I figure out the vertical placement by typing a few email addresses and putting some numerals around it. There's a spot that feels comfortable. The top usually ends up about half way between the cap and x-height. The bottom, about half way from the ascender to the descender. Even when it's used with numbers, aligning with the top of the numerals often feels wrong. The @ is a free floating rebel . . . he knows where he's supposed to vertically align. There are some all caps display fonts situations where it really only makes sense to nail it to the cap and baseline.</p>
      <p>Who's really using "stock" @ symbols these days anyway. Fonts with parts bin @ symbols were made about 15-20 years ago, no?</p>
      <p>I think the less serious a font is the more whimsical it should be. It looks so out-of-place when a font has zany letters and a serious @. I don't like the "At" in place of an @ idea except as an alternate. It may not seem so clever to the customer who's trying to use the font to display email addresses and ends up having to borrow a proper @ from another font.</p>
      <p>Nick: I always liked the Scotch Modern @: very cool.</p>
