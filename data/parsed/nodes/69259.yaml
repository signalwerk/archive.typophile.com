      <p>I agree with Mark; traditional form should be a base for the glyph. My concern is that intrinsically it does not follow any dimensions of the type design; it just floats within the ascender and descender, and we try to balance it with baseline.</p>
      <p>I'm looking for a sandard form with x-height, ascender and descener to conform with the font. That's why my favourite has been a version starting with "d"; it still has "@" shape, but it works with the design, while suggesting to the "original" form.</p>
      <p>But that's just me. Better solutions are welcome.</p>
    html_clean: |-
