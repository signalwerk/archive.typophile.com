    <p>I truly and vehemently hate the generic @ glyph. In too many fonts it seems to have been copied from an older font, and pasted into new one.</p>
    <p>The first different @ I saw was in DIN, and realised that @ does not have to look like that.</p>
    <p>So, I would like you to show different variants of this generic form.</p>
    <p>Here are some of mine:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/at_3770.png"></div><p></p>
