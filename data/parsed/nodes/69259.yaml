    html: |-
      <p><cite>In Italy it is so far removed from any letter-like meaning or resemblance that it's called "chiocciola" (snail).</cite></p>
      <p>Koreans call it ‘golbaengi’ (a type of sea snail), but that doesn't stop them from writing it as a circled ‘a’. This was quite surprising to me; I myself write it in a single continuous stroke as in the most usual printed form, but then again I was brought up mostly outside of Korea.</p>
      <p>Repeatedly seeing lists where people filled in their email addresses by hand finally clued me in to the fact that most Koreans write @ as a circled ‘a’. I'm looking at my old-school mini address book right now. Out of 14 email addresses written by my Korean friends, 10 use a definite circled ‘a’ form and only 2 use unambiguous single-stroke @s. By contrast, all of my non-Korean contacts use single-stroke @s. It's a small sample because most of the entries are in my own handwriting rather than that of my contacts, but it's fairly representative of how Koreans write the @.</p>
