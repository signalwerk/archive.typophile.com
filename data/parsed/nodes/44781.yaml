    <p>’Evening, All</p>
    <p>I have been asked to help ID a font for a friend</p>
    <p>He described a regular sans font that he told me looked ’shattered’</p>
    <p>I suggested ITC Shatter (<a href="https://web.archive.org/web/20081012142145/http://www.myfonts.com/fonts/letraset/shatter/" title="http://www.myfonts.com/fonts/letraset/shatter/">http://www.myfonts.com/fonts/letraset/shatter/</a>) but he said it was more ’subtle’ and prepared a mock-up, which I have attached</p>
    <p>Can anyone help with a font that looks something ’in between’ the two?</p>
    <p>Cheers!</p>
    <p>H-NX_</p>
