    html: <p>In the metal type days, fonts did not come with matching registered, trademark, or copyright symbols. These were purchased separately in a range of sizes and had generic designs. They came in only serif or sans serif if there was any choice--no condensed, bold or italics. Phototypesetting fonts were similarly limited. The idea of having these characters match the font is a recent development and one that seems not to have been completely worked out yet.</p>
