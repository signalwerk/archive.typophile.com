    html: "<p><i>How far should the mark match the style of the typeface -- in particular, why do most italic fonts have roman marks?</i>  <br> <br>The answer, as always, is: it depends. <br> <br>I have strongly suspected that some sloppy font producers throw in a generic humanist \"r-ball\" or \"tm\" on any font they create. To me, it's an obvious error if the R in the registration mark doesn't bear a strong resemblance to the R in the typeface it \"modifies.\"  <br> <br>The \"depends\" part deals with condensing and/or obliqueing the circle along with the R inside the circle. That's just wrong! Keep the circle round. Then condense or oblique (if you have to, but you really should re-draw) the R within the circle. <br> <br>Of course, after I've gone through the process of doing all that, the effect can be so distracting that I throw the end product out and default to the roman registration mark. Italic Rs within a circle sometimes look silly. Italic TMs sometimes look silly. <b>Avoid silly.</b> <br> <br>Thomas, I agree with Gerald -- providing alternate versions is a great solution -- I'd be tempted to provide a version set at x-height as well.  <br> <br> <br></p>"
    html_clean: "<p><i>How far should the mark match the style of the typeface -- in particular, why do most italic fonts have roman marks?</i>  <br> <br>The answer, as always, is: it depends. <br> <br>I have strongly suspected that some sloppy font producers throw in a generic humanist \"r-ball\" or \"tm\" on any font they create. To me, it's an obvious error if the R in the registration mark doesn't bear a strong resemblance to the R in the typeface it \"modifies.\"  <br> <br>The \"depends\" part deals with condensing and/or obliqueing the circle along with the R inside the circle. That's just wrong! Keep the circle round. Then condense or oblique (if you have to, but you really should re-draw) the R within the circle. <br> <br>Of course, after I've gone through the process of doing all that, the effect can be so distracting that I throw the end product out and default to the roman registration mark. Italic Rs within a circle sometimes look silly. Italic TMs sometimes look silly. <b>Avoid silly.</b> <br> <br>Thomas, I agree with Gerald -- providing alternate versions is a great solution -- I'd be tempted to provide a version set at x-height as well.  <br> <br> <br></p>"
