  html: <p>How big should the "-mark" symbols be in a font? <br> <br>Many fonts have the trademark and copyright mark at full cap height. Others have the Registered mark as a superior. <br> <br>But surely this is a mistake, because while it makes sense in the main text, if a typographer then has to set the character in an accompanying footnote, it becomes the size of a fly dropping, and too small to decipher without a magnifying glass. <br> <br>What's your experience? <br> <br></p>
  html_clean: <p>How big should the "-mark" symbols be in a font? <br> <br>Many fonts have the trademark and copyright mark at full cap height. Others have the Registered mark as a superior. <br> <br>But surely this is a mistake, because while it makes sense in the main text, if a typographer then has to set the character in an accompanying footnote, it becomes the size of a fly dropping, and too small to decipher without a magnifying glass. <br> <br>What's your experience? <br> <br></p>
