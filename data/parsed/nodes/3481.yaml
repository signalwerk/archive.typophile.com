    html: <p>I think the copyright mark should match the numerals in vertical span, while the registered and trademark should be floating to the height of the caps (but not too small). <br> <br>hhp <br></p>
    html_clean: <p>I think the copyright mark should match the numerals in vertical span, while the registered and trademark should be floating to the height of the caps (but not too small). <br> <br>hhp <br></p>
