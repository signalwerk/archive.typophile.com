    html: <p>That's a big problem, that the weight and optical size is all wrong if one simply scales the mark to the desired size. <br> <br>This is an area that screams for a sensitive optical size treatment, with *much* smaller registered and TM symbols at large display sizes, and pretty big ones for small print. <br> <br>If you don't have separate optical sizes of the typeface, one could also include different size versions of the R/TM as alternates. I think I will do this for the typeface I'm working on right now, actually.... <br> <br>T</p>
