    html: <p>Mark, <br> <br><i>In the metal type days, fonts did not come with matching registered, trademark, or copyright symbols. These were purchased separately in a range of sizes and had generic designs.</i> <br> <br>No point messing with a good thing. After all, ugly is beautiful. <br> <br>One the other hand. <br> <br><i>The bullet was like a basketball, and the mid-point like a marble.. I'm in need of something, baseball sized (excuse all the sports metaphores)</i> <br> <br>With Monotype these were not "type face dependant." They were "sorts matrices". You could choose from a vast selection of sizes. For that matter for a fee, not enormous, you could have your own matrices cut for the copyright, trademark symbols etc. <br> <br>This sort of activity was common. <br> <br></p>
