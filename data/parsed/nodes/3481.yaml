    html: "<p>&gt;the intended average point size of usage <br> <br>But in practice that will vary: <br> <br>In my experience designing ads, flyers, and marketing newsletters, the Registered symbol is used in body text (size 8 - 14 pt) as a superscript to a brand name.  <br> <br>Then it is repeated in a footnote (with the name of the owner of the brand) as small as possible, (4 - 6 pt).  <br> <br>I always prefer it when fonts have a cap-height Registered symbol, because it is easy to \"superscript\" the symbol in the body copy, but very difficult to increase the size of a pre-shrunk symbol in the footnote and not have it look too bold and misaligned vertically. If you just set it straight, it's but a speck. <br> <br>That's why I make cap height Reg symbols in the fonts I design, unless they are outright display faces. <br> <br>However, I seem to be going against the flow here, so I would like to confirm with typographers:  <br>Do you prefer a pre-shrunk Registered symbol in your text fonts? <br> <br></p>"
    html_clean: "<p>&gt;the intended average point size of usage <br> <br>But in practice that will vary: <br> <br>In my experience designing ads, flyers, and marketing newsletters, the Registered symbol is used in body text (size 8 - 14 pt) as a superscript to a brand name.  <br> <br>Then it is repeated in a footnote (with the name of the owner of the brand) as small as possible, (4 - 6 pt).  <br> <br>I always prefer it when fonts have a cap-height Registered symbol, because it is easy to \"superscript\" the symbol in the body copy, but very difficult to increase the size of a pre-shrunk symbol in the footnote and not have it look too bold and misaligned vertically. If you just set it straight, it's but a speck. <br> <br>That's why I make cap height Reg symbols in the fonts I design, unless they are outright display faces. <br> <br>However, I seem to be going against the flow here, so I would like to confirm with typographers:  <br>Do you prefer a pre-shrunk Registered symbol in your text fonts? <br> <br></p>"
