    html: <p>The contrary argument is that at display sizes, the registered and trademark need to be even smaller than the main text. <br> <br>In general, copyright is supposed to align with the body text, and registered and trademark symbols should be superiors; that is, about 1/3 of their size above the cap height, and 2/3 below, with the overall size being considerably smaller than the cap size. (How much smaller being dependent on both the weight of the font and the intended average point size of usage.) <br> <br>T</p>
    html_clean: <p>The contrary argument is that at display sizes, the registered and trademark need to be even smaller than the main text. <br> <br>In general, copyright is supposed to align with the body text, and registered and trademark symbols should be superiors; that is, about 1/3 of their size above the cap height, and 2/3 below, with the overall size being considerably smaller than the cap size. (How much smaller being dependent on both the weight of the font and the intended average point size of usage.) <br> <br>T</p>
