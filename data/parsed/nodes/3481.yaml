    html: "<p>Another thing to consider is the weight problem. I almost always go up one weight (if possible) when I use a super-shift version of the TM or R. Perhaps if you choose to go with the full-size method, you can increase the weight a bit? I don't know what other consequences you might run into if you choose that option. <br> <br>Here at Gigantacorp, we often redraw fonts for the circulars for superior numbers and special characters. By the time we get to the redrawing stage, we already know what size range we will be needing and therefore can make the \"right\" choice in adjusting \"r-balls\" and \"tms\" in size, weight and positioning. <br> <br>Digression: Does anyone else call them \"r-balls\"? I never heard it before I came to this place..... <br> <br> </p>"
