    html: '<p><i>In the metal type days, fonts did not come with matching registered, trademark, or copyright symbols.</i> <br> <br>One of the first fonts we made when Alphatype (dedicated cold-type setting) started sharing their font creation materials was a font with nothing but registration marks. We had graduated sizes in different "generic" styles: bracketed serif, slab serif, san serif; uneven stress, even stress, etc. It was one of our most-used fonts. <br> <br>Does anyone know whether a similar font exists today? Would there be any use for it?</p>'
