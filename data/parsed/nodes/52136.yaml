    <p>My dearest fellow Typophiles,</p>
    <p>As I am currently heavily considerung moving/relocating to Italia, within the next year(s), I am about to compile a list of brand/design/typography related studios/bureaus/agencies, located in (northern/central) Italy. And I am more than thankful for any name mentioned or link revealed.</p>
    <p><em>(And, If anyone is reading this who, or whose employer, is already seeking, or consider hiring, an additional designer, for 2009, please, let me now. Concerning eventual language barriers, I am capable of English and German, and right now willing, wanting and working on improving my Italian. ;)</em></p>
    <p>Thank you,<br>
    Dav <em>(formlos/Forma)</em><br>
    <em>mail(at)davidhubner.com</em></p>
