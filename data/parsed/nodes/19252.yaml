    <p>Thinking In Type: The Practical Philosophy Of Typography</p>
    <p>Is this book worth the purchase, I looked through it briefly at BN, seems nice, just like a recommendation.</p>
    <p>Also:</p>
    <p>Typeface vs. Font</p>
    <p>I have a theory on this debate. </p>
    <p>I’ve come to, through my studies, speaking strictly in 21st century context, that what is referred to as a typeface is an aesthetic theory and a font is a carrier of information that references this aesthetic construct. Rationalized as: You can’t touch a typeface. And you don’t load ’typefaces’ into the ’typeface’ folder. Font is ’touchable’ via mouse, you load ’fonts’ into the ’fonts’ folder,</p>
    <p>Depending on context. I get razzed because I say ...”Load your fonts this way...” I refer in all other contexts as type, or typefaces. Is this reasonable?</p>
    <p>Thx</p>
