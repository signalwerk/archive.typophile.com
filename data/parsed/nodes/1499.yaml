    html: "<p>Hi Ruia. <br> <br>This sounds like a fun project! Sometimes you have to work to see it that way, especially when you're up against a deadline. Here are some thoughts for you. <br> <br><i>do I use Beautavia Beauty Supply, or just Beautavia?</i> <br>1) Outside of school you will fight the uphill battle against logos that read Beautavia Beauty Supply and Specialty Cosmeticological Products International Companies, LTD. Use Beautavia.  <br> <br><i>I got really creative with my image.</i> <br>2) Yes you did! This is really a layout suggestion. The focal point of the piece is the hair extention/flower, less on the brush. I'd do one of two things:  <br>a. Crop the image differently, and bring the flower down. Give it some space at the top (maybe even put the \"hint of color brilliance\" up in the new found space). <br>b. Do a horizontal layout, or a two page spread if you have the option. Show many <i>flowers</i> at smaller sizes and focus on your color pallet. <br>In either case, I'd choose a background color that competes with the image less. You're cyan is overpowering the hint. <br> <br><i> My teacher told me that my logo needs to be simple. I do not know if i should go with a serif, san serif, decorative font.</i> <br>Some people will tell you that the only </p>"
