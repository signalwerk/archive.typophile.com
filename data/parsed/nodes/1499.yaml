    html: <p>alright you guys this is the scoop on my senior sem project.  I didnt have alot of time to add everything but i changed some stuff that you guys commented on.  basically the teacher critisized to the extreme, which was a good thing because all the art department faculty was not there and next wed they will be meeting us.these were the 2 layouts i showed.  i lowered the flower and changed the backround.  For the first one she asked me why the colors of the flower were so bold and I told her because the age group i am dealing with is 16 to 30 age group and they are more modern and they go for funky colors.  I chose the allise font which was tall and skinny and she loved it.  She didnt like the placement and she busted me out on my quote.  A hint of color brillance.  she said if my girls are from 16 to 30 and they like bold colors, wouldnt they be screaming of color.  i felt really embaressed but hey at least she made a point.  some of my class mates told me to get rid of my whole flower campaign and start from scratch.  so I did another layout and they liked it but the only thing they said was the world looked too much like a golf ball.  I still didnt come up with a logo.  I just chose a simple one and she told me I needed to have a nice logo.  im sorry this email was so long, but wanted to share with you what was going on. thanx <br><img src="http://www.typophile.com/forums/messages/29/18223.jpg" alt="beauty"><img src="http://www.typophile.com/forums/messages/29/18224.jpg" alt="beauty"></p>
