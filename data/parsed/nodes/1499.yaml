  html: <p>This is the first time posting on this forum. I just learned about it recently.  I am doing my senior sem project about advertising about a Beauty Supply store called Beautavia.  I am in typography class now but i still do not know how to handle typefaces.  i think i am better at designing then type.  Hopefully i will become good at both.  here is one of my magazine layouts on the bottom.  as you can see the text is plain. I got really creative with my image. I took colored hair extensions and scanned them all in and made them look like leaves.it looks like a flower.  Then i took a brush and scanned it in.  My teacher told me that my logo needs to be simple. I do not know if i should go with a serif, san serif, decorative font.  i have no clue.  Also with my Logo, do I use Beautavia Beauty Supply, or just Beautavia? Just make the fonts black or colored Do i make an image with my font, or just my font?  please give me all the critism and the help you can give me.  I have been working on this project for months and now the teachers decided to invite all the professors of the art department for a class critique, which is next wed.  please help, thanx<img src="http://www.typophile.com/forums/messages/29/17672.jpg" alt="beaty magazine layout"></p>
