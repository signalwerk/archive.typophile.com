    html: <p>Take the opportunity to base the logo just on Beautavia, adding blowdryers &amp;c will only detract, if you want to add an image think about more of a natural image jojoba seed/flower. When designing a logo you should consider using it white out (as you have it), black, 1 colour (Pantone or similar), 4 colour version of it for different printing applications. Randy offered some very good advice on the b/g colour and fonts - the idiom is to use a fine typeface. <br>However, since you do not have a client weighing in with comments like "this isn't like so-and-so cosmetic company", don't feel you have to submit to the tyranny of following other designs. The image is great - give it some space to breathe, and prepare a presentation for your tutors </p>
