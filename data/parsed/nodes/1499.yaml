    html: <p>I prefer the 3rd logo, although I don't feel it is clear what the hair is and the weight of the line is too heavy. As for the kerning the 'av' is too far apart - a good method for kerning is to print out your file hold it upside down and view it with half closed eyes any large or small spaces become more obvious. On the layout, the grey background is too dominating (although it is difficult with small jpegs to really appreciate it) a subtler shade or white would improve the image as hero, also I would reduce the size of the logo, smaller than the headline, and keep it clear of the image you could produce two layouts demonstrating how the ad would work on a recto or verso page. The second layout kind of shows why design by committee should be avoided, your original concept was strong - stick with and improve that. Good luck. <br>Tim</p>
