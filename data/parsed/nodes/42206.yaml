      <p>It's an old font that was originally called 'Dragonwyck' (I think), which has been digitized as <a class="freelinking external" href="http://www.dafont.com/dragonwick.font?nb_ppp=50&amp;text=Heart+India" rel="nofollow">Dragonwick</a> by my old friend FontGrube. I think several digitizations exist, including one by Rick Mueller.</p>
      <p>- Mike Yanega</p>
