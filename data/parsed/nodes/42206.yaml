    date_raw: 18 Feb 2008 — 10:29am
    votes: null
    html: <p>One clarification about Dragonwick, Mike - it was digitized by David Rakowski. <a href="http://www.fontgrube.de/en/index.htm" target="_blank" rel="nofollow">Fontgrube</a> (Andreas Hofeld) took several fonts that others had made and improved them by fixing mistakes and filling out the character set. He was always very up front about this.</p>
