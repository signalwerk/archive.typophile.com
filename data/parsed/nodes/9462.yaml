  html: <p>Jef Raskin, creator of the original Macintosh died last Saturday at his Pacifica home. <br> <br>You could agree or disagree with him, but you could definitely not ignore him. His views of information presentation, interface architecture and user friendly computing have shaped generations of users. <br> <br>The world looses a great thinker. <br> <br>The author of The Humane Interface and passionate teacher was diagnosed with pancreatic cancer died at age 61. <br> <br>We'll all miss you Jef. <br> <br>A longer article can be found at <a href="http://www.kansascity.com/mld/kansascity/news/nation/11009562.htm?1c">KRT Wire</a> and soon all over the web.</p>
