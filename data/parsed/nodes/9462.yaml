    html: "<p>Very sad about Jef Raskin. <br> <br>The short story re Raskin and the Mac GUI: Raskin's idea for the Mac was very different from how it turned out. He imagined something much simpler and cheaper. The PARC-like GUI stuff (including the mouse) was the result of Jobs taking over the project. Raskin left not long after. He later designed a computer for Canon called the Canon CAT which was more like what he had in mind for the Mac.</p>"
