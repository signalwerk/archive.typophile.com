    html: |-
      <p>Nina kindly asked me to comment on this thread, probably because we (FontFont) resp. our outline guidelines were responsible for lots of the extremum points she and Hrant had to put in on Ernestine ;)</p>
      <p>I’d say, in general it is the safest bet to put on-curve points at all curve extremes. Some font checking tools insist on this and give you error messages otherwise (like FontLab’s FontAudit, FontQA, or MS FontValidator). But you can get away with fewer, and should try too, because otherwise the curve fidelity may be compromised in some cases, depending on what formats the fonts will be produced in, and the kind of hinting that will be applied. You already see that it’s a complicated issue.</p>
      <p>I tried to find an example glyph to illustrate all extremum issues, it’s really hard to show everything in one glyph, but I’ll try ...</p>
      <p>The general order of importance (from most important extremum points to least) would be:</p>
      <ol>
      <li>Points that are relevant for hinting (PostScript as well as TrueType if the fonts will be produced as such)</li>
      <li>Points at global extrema (for calculation of glyph and font bounding boxes)</li>
      <li>Points at local extrema</li>
      </ol>
      <p>In this example, I drew the glyph AE like this and removed overlaps:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AE-Extrema_4164.png"></div><p></p>
      <p>At extremum 1 there should be an on-curve point because it influences the glyph bounding box and would be needed for hinting.</p>
      <p>Extremum 2 and 5 would define a stem hint in both PS and TT hinting and should be marked with an on-curve point.</p>
      <p>Extremum 3 and 7 are local extrema, not influencing the bounding box or needed for hinting, I would leave them as it is (but the curve is long enough so it would be possible to put in a point and preserve the curve shape).</p>
      <p>Extremum 4 and 6 would be tricky to insert an additional point, I’d leave it as it is.</p>
      <p>In extremum 8 I would probably try to adjust the existing point so it would become the extremum point.</p>
      <p>Extremum 9 is a glyph-global extremum and makes the bounding box bigger than necessary, I’d add a point here.</p>
      <p>10 is important for hinting, insert a point.</p>
      <p>11 influences the bounding box, insert a point if at all possible (if there’s a point at 10, then the handle at 11 will get smaller, and it would probably be acceptable to leave out the extremum point. This would be like the point in Sindre’s example).</p>
      <p>Extrema like 1, which make the bounding box bigger on the top or bottom of a glyph, have to be considered extra carefully, because they may occur on the tallest glyph in the font and thus influence the line height calculation (which you usually want to keep as small as possible).</p>
      <p>Sometimes it’s possible to move the points and handles surrounding the extrema and keep the curves looking OK, but if the PostScript curves are just on the border of being distorted, in very tight places, they may blow up when converted to TrueType. Then you could either correct the TT curves manually, or increase the UPM of the font before converting to TT. Of course, if you’re not going to produce fonts with TrueType outlines, you don’t have to worry about this.</p>
