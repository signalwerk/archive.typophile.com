      <p>Here’s another example in which the needed points depend on what kind of hinting you are planning to apply.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/n-Extrema_5081.png"></div><p></p>
      <p>Points 1 and 2 would not be needed for global extrema, and are hard to put in because the curve is so narrow (there is only 1 unit (at 1000 upm) in x-direction between the tangent point and the extremum point at (2) and 2 units in x-direction at (1) so the curves are a bit flat if you look closely enough. They will certainly be flat when converted to TrueType.</p>
      <p>If you do only y-direction TT-hinting, and your PS hinting style is such that you don’t hint vertical rounds in an Italic (as I often do), you could omit the extremum points. But if you want to put PS hints there, or do x-direction TT hinting, the points would be needed.</p>
      <p>We ended up increasing the upm size to 2000 and remodeling the curves at the extremum points in this case.</p>
