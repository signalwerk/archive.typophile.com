    html: |-
      <p>I'll get to the other wonderful stuff (thanks Jens!) later, but for now:</p>
      <p>Craig, to me explicit inflection points are very important, and often actually more important than extrema; when they're missing conversion to TT is a crapshoot.</p>
      <p>So of your three options, I would choose #3 if I can make the curve look nice, and #2 if it's impossible to get a good shape with all those points (without increasing the EM).</p>
      <p>Another technical thing here is the avoidance of what I call "half-dead" curves: curves where only one point has a handle - this is also a TT-conversion minefield. Which is a shame since I find them very elegant to work with. Luckily in FL Alt-Shift-Click* adds the missing handle and balances the other one (although usually a subsequent tweak is required).</p>
      <p>* However Alt-Shift is also the default way to switch keyboards/languages in Windows, so I find myself having to hit Alt-Shift after every Alt-Shift-Click!  :-/</p>
      <p>hhp</p>
