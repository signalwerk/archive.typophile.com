    html: |-
      <p>The first few games are titled as follows (maybe):</p>
      <p>Chemical War<br>
      Revolution<br>
      Long Live the Revolution!<br>
      Reds and Whites (I doubt the rules make it easy for the Whites ...)<br>
      Aerial Conflict<br>
      Aerial Combat (note: the letters going downward are part of the first<br>
      word)<br>
      Cycling Race (?)</p>
      <p>A bit lower down: the one in greyish blue is something like 'Journey through Wealth'.<br>
      I thought at first the city was burning, but it appears to a 'wealthy' industrialized city. Next, a similar theme: Electrification.</p>
      <p>I'll let someone else take over the translation from here.</p>
