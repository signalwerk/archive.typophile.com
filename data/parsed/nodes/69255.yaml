      Polar Expedition of Krasin and Malygin Icebreakers<br>
      Travel the Wealth of the USSR<br>
      Electrification - not to be mixed with Electrocution :)<br>
      Moscow-China Dobrolet - a made-up word, literally - "Kind/Happy Flyer"<br>
      Alphabet of Young Osvodovetz<br>
      Your Friend of Avtodor - Avtodor is the same as Osvod, but applied to the cars instead of water :)<br>
      Maneuvers by Young Friends of Osoviahim - as far as I remember it was a society dealing with training volunteer reservists for the defence department. "-him" stands for "chemical", probably capturing the fascination with gas masks of that period :)<br>
      ...</p>
