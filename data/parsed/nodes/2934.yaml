  html: <p>I'm setting a project using p22's beautiful Operina fonts for display, and I've found that practically none of my text ornaments look good next to Operina; they are all too sharp-edged and formal.  Can someone recommend me a source of antiquey-looking fleurons, preferably an inexpensive one? (I am a poor student; for me, Operina was an extravagance, but a bloody satisfying one.)</p>
