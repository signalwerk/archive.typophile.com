    <p>Hi!<br>
    I am freshman and just start to use Fontlab (XP platform).<br>
    I try to test my first opentype font so I only add a ligature feature to my font in the FontLab 5.<br>
    All things go well until I try to generate my new font.<br>
    I have tested the ligature in Opentype preview wnd. It's perfect.<br>
    But I don't add the digital signature to my font so my font icon is not correct.<br>
    I wanna know:<br>
    In this condition, can my ligature work in InDesign or WinWord ?<br>
    I tried to make it run, but failed. Later I also tried the MS Volt and my ligature runs well in it but after I ship font, it can't work in InDesign.<br>
    Without the DISG, can Opentype feature still work well?</p>
    <p>Waiting for your reply and Thank you very much!!!</p>
    <p>Regards,<br>
    KT</p>
