    html: |-
      <p>Digital signature (DSIG) need only for inform user about <strong>originality of the font</strong>. Ligatures controlled and used only by OT feature liga. Microsoft Word/Notepad/Wordpad, Emurasoft EmEditor and others except Adobe Creative Suite can't have access to ligatures. Also right way is placing ligatures to a private area (assign proper Unicode index for glyph) to get access to your ligature in OT-blind applications.</p>
      <p>I'm right ? Correct me if not.</p>
