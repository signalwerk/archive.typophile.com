      <p>I ran into the same problem when developing Output I which uses a supplemental 'dot' style which you can see here a few slides in - <a href="http://www.reservesca.com/index.php?act=viewProd&amp;productId=69" title="http://www.reservesca.com/index.php?act=viewProd&amp;productId=69">http://www.reservesca.com/index.php?act=viewProd&amp;productId=69</a></p>
      <p>You can adjust the offset in Area Type Options&gt;Offset&gt;First Baseline of course, but even in the drop-down options there is no setting that by default positions the 'supplement' style exactly as it is positioned using the standard 'Type Tool'. (as opposed to using the 'Area Type Tool')</p>
      <p>It would be interesting to hear why the Area Type Tool handles typesetting offsets differently, and if there's anyway to solve the problem.</p>
