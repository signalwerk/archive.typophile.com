      <p>Joaquim, I suspect that the two fonts either don't have a TypoAscender value in their OS/2 table (making Photoshop resort to heuristics for positioning the first baseline of the paragraph), or if they do the value is not the same in both fonts.</p>
      <p>In FontLab, open the Font Info dialog, go to the TrueType-specific metrics pane, switch to "Set custom values", and use the same TypoAscender value on both fonts. Does this fix the problem?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/FontInfo_4795.png"></div><p></p>
