    html: |-
      <p>I've produced a (proprietary) font that does this.</p>
      <p>It only works for one case of the alphabet, not other characters.<br>
      Type "A" and the left half is set.<br>
      Type "a" and the right half is set.<br>
      SsOo YyOoUu HhAaVvEe TtOo TtYyPpEe LlIiKkEe TtHhIiSs.</p>
      <p>**</p>
      <p>It would also be possible to extend the principle to the whole character set, using OpenType alternates, but you would still have to "double" the text.</p>
      <p>So, the first thing to do would be to run a "Find/Change" script that doubles everything:</p>
      <p>e.g. "Find A, change to AA" and so on for all characters in the encoding.<br>
      Then in the "contextual alternates" feature:</p>
      <p>sub A A' by A.alt;</p>
      <p>Where A is the left side, and A.alt the right side.</p>
      <p>And so on.</p>
      <p>**</p>
      <p>It would be easier if OpenType did one-to-many substitutions, but it doesn't.</p>
