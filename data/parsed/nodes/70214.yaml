    html: |-
      <p>1. Check that the OS/2 and hhea table vertical metrics settings of both fonts are identical. Do not allow the font creation software to automatically generate these: set them manually.</p>
      <p>2. If the problem persists when the vertical metrics are identical, then if may be a font bounding box issue as Nick suggests. The best way to resolve the problem in that case is to put an identical glyph in each font with an outline taller and deeper than the tallest, deepest glyphs in each font. This will equalise the vertical bounding boxes.</p>
