    <p></p><div class="imageWrap"><img src="http://typophile.com/files/unify_3529.png"></div><p></p>
    <p>Hello font lovers :)</p>
    <p>I've got an annoying problem (but then again, aren't all problems annoying?). Well here goes:</p>
    <p>I've pursued an old idea of splitting a font in half — one font (half) containing the first set of fragments of each glyph, the second font (half) containing the rest of the fragments. I'm calling the font Unify 1 and Unify 2.</p>
    <p>The idea is then to write something with a readable font, then duplicate the text you've just written and add Unify 1 to the first copy and Unify 2 to the second copy. To be able to read the whole thing, you need to put the two copies on top of each other and voila! It's complete.</p>
    <p>That was the concept. Now to the problem, which I've explained in this short video:</p>
    <p><a class="freelinking external" href="http://www.jokke-svin.dk/other/send/unify.mov" rel="nofollow">http://www.jokke-svin.dk/other/send/unify.mov</a></p>
    <p>What to do?</p>
    <p>I really hope somebody out there might have a clue as to what's going on here.</p>
    <p>Thanks!</p>
    <p>Joaquim</p>
