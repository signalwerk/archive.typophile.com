      <p>Nice work!</p>
      <p>Details I see:<br>
      . "j" seems to have more space at the right side. (look the space with the "k")<br>
      . "z" the upper stroke at the left seems to exeed too much, this might generate some tracking problems.<br>
      . "A" the middle stroke might be a bit low<br>
      . "4" diagonal stroke might be thin.<br>
      . "B,E,F,L" seem to be narrow compared to the other letters.<br>
      . "R" the leg should be a little more to the right, if you prolong the stroke it should reatch the upper left vertex.</p>
      <p>I'm doing something similar now, so its nice to have theese examples.<br>
      Will it be available to purchase or it's a exclusive job?<br>
      Congrats!!! :)</p>
