    <p>Hi Centaur lovers,</p>
    <p>I did a scan from a wonderful book by the Stamperia Valdonega<br>
    that uses the Valdonega Aesthetic Line Centaur (from Monotype cast new digitally translated)<br>
    Sadly the scan cannot show the real feeling, yet, when holding the book in hand it has the<br>
    analog printed feeling.<br>
    So Centaur lives on quite near to how it once was, I find.</p>
    <p>Stefan</p>
