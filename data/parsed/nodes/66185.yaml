    <p>Hi,</p>
    <p>I would like to show you a work I did using my Wacom tablet and Inkscape.<br>
    There was once a thread about calligraphy software and I am sure Inkscape is one of the best. It works different then CorelDraw and Illustrator but I think is more close to the traditional way except the strokes can be rearranged if necessary.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/600 thanks inks_6581.jpg"></div><p></p>
    <p>And a detail at actual size.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/600 detaliu_6204.jpg"></div><p></p>
    <p>I would like to see your comments, critiques and advices so please feel free to post them.</p>
    <p>A bigger version of it (1600 x 1200 px) can be downloaded from my site.</p>
    <p>Thank you very much.<br>
    florinf</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/600thanks_b&amp;w_5962.jpg"></div><p></p>
