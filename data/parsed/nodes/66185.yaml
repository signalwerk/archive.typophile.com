    html: <p>Well, I'm not by any means a pro on calligraphy, but I think this looks great. I'm not typically a fan of effects on type or logos, so I'd love to see what this looks like as a simple black on white, but the effect you have here is actually quite neat and does work with the calligraphy. My only critique would be that the T seems a little lost. I seem to recall much more stylized Ts in other calligraphy I've seen. I absolutely LOVE the K and the S though. Nice work on those!</p>
