    user: 7765
    date: 2008-10-16T09:36:00
    date_raw: 16 Oct 2008 — 9:36am
    votes: null
    html: |-
      <p>Thanks everyone for giving your eyes to this.</p>
      <p>@Robby: I think taking a step away from this and returning to it would be a good thing (it's only been 48 hours since its initial rendering).  I do feel that the more refinements that are made, the less charm it has, but the control does become appealing in it's own right.  It will be good for me to understand for myself just how much control there should be.  The logos for many of the labels releasing blues and folk music on 78s have a very innocent charm to them, but at the same time it is apparent that the lettersmith behind them is trained and skilled.  Though charming as they are, they're definitely not heavy-handed.</p>
      <p>examples:<br>
      <a class="freelinking external" href="http://tedstaunton.com/labels/1930-1939.pages/Melotone/image/melotone.gif" rel="nofollow">melotone</a><br>
      <a class="freelinking external" href="http://tedstaunton.com/labels/1930-1939.pages/Panachord/image/panachord.gif" rel="nofollow">panachord</a><br>
      <a class="freelinking external" href="http://tedstaunton.com/labels/1930-1939.pages/Superior/image/superior.gif" rel="nofollow">superior</a><br>
      <a class="freelinking external" href="http://tedstaunton.com/labels/1930-1939.pages/Brunswick.1930.1939/image/brunswick.1930.1939.gif" rel="nofollow">brunswick</a></p>
      <p>I agree that this is a great committee to process things through, and what I take from it is very valuable, especially when it comes to the little nip/tucks.  Though some things should be taken with a grain of salt, I do appreciate tremendously what more experienced folks have to say.  I'm always looking to learn and understand my own limitations.</p>
      <p>@asvetic: good point in making the o's a bit larger.  I do like bobbling baseline, but limiting the occurences of the swoop down would make those occasions more powerful and less sloppy. ie. raising the connecting stroke of the m, but leaving the e and h.</p>
      <p>@pica: there's definitely something happening with the p-h.  I think creating the stop there helps the eye in reading this correctly, and the descender/ascender matching is intended to unify the letters to each other.  Though, I am unsure of the bottom-left of that h.  It leaves less white space than every other letter-to-letter connection. </p>
      <p>@kirsten: my intention for the line through the o is to signify the numeral zero, known to have a slash-through at times.  I am however sensitive of my own association with labels ending in 'phon' being of eastern-European origin.</p>
      <p>Progress to come shortly!</p>
