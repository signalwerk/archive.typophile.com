      <p>Thanks for the advice, Michael.</p>
      <p>I personally think a design like this allows for some mixing of styles, but do agree with you that the bowls should match with everything.  Harmony with the curves, weights, heights and kerning are the most important to me. The label covers different styles within a semi-specific era, so I think some mixing of typographic styles may not be too harmful, and may hopefully give it some character.  I originally had more of an italic r, but it seemed to stagger the rhythm a bit.</p>
      <p>I am curious about how the u doesn't reflect the m, h, and n.  This is definitely not the only thing I do, so I appreciate hearing what stands out to you.  </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/numerophon-clean-5_6161.jpg"></div><p></p>
