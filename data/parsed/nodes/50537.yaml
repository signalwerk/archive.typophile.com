      <p>Edit: Before you even read this David I am humbly trying to help. My background is in hand lettering</p>
      <p>You are mixing styles David. Part of it is italic(Arrighi) and part modern (Bodoni) or even Old style.. I think that is where the disconnect comes in for me. Look at your branching... they do not match. Look at your bowls... they do not match the other letters. The u does not reflect the h, n and m. The e,r o and p do not match the m,n, and h. The bowl of the e is way to large. And the r is a script r... based on the n,m,h it would have to be an italic r.</p>
      <p>Choose what style you are trying to convey. Don't get me wrong, I like where you are going it just has to have continuity. </p>
      <p>Michael</p>
    html_clean: |-
      <p>Edit: Before you even read this David I am humbly trying to help. My background is in hand lettering</p>
      <p>You are mixing styles David. Part of it is italic(Arrighi) and part modern (Bodoni) or even Old style.. I think that is where the disconnect comes in for me. Look at your branching... they do not match. Look at your bowls... they do not match the other letters. The u does not reflect the h, n and m. The e,r o and p do not match the m,n, and h. The bowl of the e is way to large. And the r is a script r... based on the n,m,h it would have to be an italic r.</p>
