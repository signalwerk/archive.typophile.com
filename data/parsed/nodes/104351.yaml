      <p>Zapf's book <em>About Alphabets</em> is in Optima, published in 1970, original Typophiles edition in 1960. <a class="freelinking external" href="http://oakknoll.com/detail.php?d_booknr=116327&amp;d_currency=" rel="nofollow">Here's an edition</a> for sale. And <a class="freelinking external" href="http://pingmag.jp/images/article/kobayashi_zapf_book2.jpg" rel="nofollow">here's a scan of a page.</a>  </p>
      <p>I'm guessing <a class="freelinking external" href="http://www.abebooks.com/servlet/BookDetailsPL?bi=10315668942&amp;searchurl=kn%3Duber%2Balphabete%2Bzapf%26x%3D35%26y%3D17" rel="nofollow">the original German version</a> is also in Optima. It seems the design was completed in 1958, so the German edition may be the first full book.</p>
