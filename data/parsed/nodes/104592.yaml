  html: |-
    <p>I recently discoverd this font when using a German Post Card Designing Website (can be found at <a href="http://www.urlaubsgruss.com/postkarte-online-gestalten.html" title="http://www.urlaubsgruss.com/postkarte-online-gestalten.html">http://www.urlaubsgruss.com/postkarte-online-gestalten.html</a>)</p>
    <p>I've not seen this anywhere else and I would really like to use it on my own.</p>
    <p>I've been trying to use some online font identifying services to try and find out what the name and source of the font is, but so far I've had no luck.</p>
    <p>I hope you guys can help, if you need more examples I can add some more.</p>
