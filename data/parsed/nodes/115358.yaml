      <p>The font in question is H &amp; FJ's Whitney, though the problem shows for any OpenType font containing PostScript Outlines, such as Adobe Myriad Pro.</p>
      <p>Yes, I meant Microsoft Office 2010. </p>
      <p>FWIW, I have also advised not to use the primary identity font in any MS Office documents. Inevitably, the document will end up on a machine - internally or a client's - that is not licensed for Whitney, causing font substitution and layout problems.</p>
      <p>Cheers.</p>
