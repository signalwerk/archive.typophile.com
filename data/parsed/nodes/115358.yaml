  html: |-
    <p>We have a situation where our identity font is displaying terribly in Microsoft 2010 on Windows 7. The font looks great in InDesign and Illustrator. The font family is OpenType with PostScript outlines, aka CFF. This behavior is consistent for any OpenType font from Adobe, ie Myriad Pro or Adobe Garamond.</p>
    <p>I am nearly certain that the Windows font rendering engine is optimized for TrueType outlines and renders PostScript outlines poorly. I also think that Adobe is using a different rendering engine for the Creative Suite applications, perhaps their own. I have not been able to find any specific documentation of these statements.</p>
    <p>Does this ring true? Does anyone know of specific documentation of poor font rendering in Windows applications, especially MS Office?</p>
