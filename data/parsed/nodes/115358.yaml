      <p>Well, there is this, from John Hudson, in a current build forum thread:</p>
      <blockquote><p>Font rendering is platform-specific (where platform is typically operating system, but can be individual applications (e.g. Adobe apps, which use their own rendering engines) or subsets of the system (e.g. the Metro environment on Windows 8). So the best way to test font rendering, hinted or otherwise, is to test widely on as many platforms as possible.</p></blockquote>
      <p>I suspect generalities will have to do you, vis-a-vis MS Word, which runs on multiple operating systems even within the Mac/Windows dichotomy.</p>
      <p>FWIW, I've heard the same rumor: for Word, always use ttf fonts. And if you want OT features to work, be sure a digital signature is seen.</p>
      <p><cite>Edit</cite><br>
      By the way, I don't believe the company is now known as H&amp;F-J, esp. where Whitney is involved...</p>
      <p><a href="http://www.theverge.com/2014/1/17/5318206/hoefler-and-frere-jones-lawsuit" title="http://www.theverge.com/2014/1/17/5318206/hoefler-and-frere-jones-lawsuit">http://www.theverge.com/2014/1/17/5318206/hoefler-and-frere-jones-lawsuit</a></p>
