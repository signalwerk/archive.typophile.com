      <p>“<em>Design is everything. Everything!</em>”<br>
      ~ Paul Rand</p>
      <p>“Crack is everything. Everything!”<br>
      ~ Crack Dealer</p>
      <p>#biased</p>
      <p>A better way to put it would be to say:</p>
      <p>“Doing things ‘by design’ as opposed to by accident, intuition, guesswork &amp;c. is important.”<br>
      ~ Chris Dean</p>
      <p>This means simply taking into account the user, goals, and resources, and developing a solution that meets the requirements. In this case, “design thinking” isn’t something unique to graphic designers or a magical power, <strong>it’s basic common sense</strong>. Which sadly, our (primarily North American) “culture” lacks as a collective given the current state of global affairs. </p>
      <p>Will graphic designers save the world? Hell no. In fact, we are expediting its demise by putting tits on things so people want to buy them. What <em>will</em> save the world is a shift in global consciousness forced upon us my massive social, political, economic, and environmental catastrophe will do it for us.  I suppose, following this logic, you could say that anything we do to expedite global demise might actually be putting us one step closer to destruction, and eventually rebirth, but that’s debatable.</p>
      <p>Wow. All that from a font? Quitting smoking (again) sucks.</p>
