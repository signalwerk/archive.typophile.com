      <p><em>feature liga {<br>
      lookup liga.Pri1 {<br>
      sub B C by B_C<br>
      } liga.Pri1;<br>
      lookup liga.Pri2 {<br>
      sub A B by A_B<br>
      } liga.Pri2;<br>
      } liga;</em></p>
      <p>If you Type A B first I doubt the B C sub will work. The lookup for A B will kick in before you get to B C and if you don't have a sub for A B C you don't change anything. You should start with the sub of the long (complete) string first.  I think it should be:</p>
      <p>feature liga {<br>
      lookup liga.Pri1 {<br>
      sub A B' C' by A B_C<br>
      sub A B by A_B<br>
      } liga.Pri1;<br>
      } liga;</p>
      <p>Once the B C sub is done the following A B sub won't change it since it's now A B_C, not A B C. It's the same as the f ligatures, f_f_i comes first, then f_i and f_f.</p>
      <p>At least this is my understanding of how the GSUB works.</p>
      <p>George<br>
      I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
