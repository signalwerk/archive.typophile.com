      <p>No. Processing is going like this:<br>
      <code><br>
      For each lookup<br>
      For each position where lookup is applied,<br>
      For each 'rule' in the lookup.<br>
      If rule matches the context do what it says, move to the next position<br>
      If rule does not match the context, try next rule.<br>
      </code></p>
      <p>So lookup order has higher priority than position. </p>
      <p>About your approach, it won't work because 'position' in your contextual substitution starts from B' (A is just backtrack context). So A_B will work first according to the algorithm above.</p>
      <p>It also misses another entry for B_C ligature, without context. And this example contains only two ligatures, in the real font more contexts may be needed for ligatures conflicting with B_C -- looks like supportability case for me. Adding one ligature may cause changing everything around.</p>
      <p>Thanks,<br>
      Sergey</p>
