    html: |-
      <p>Alphabetic ordering is for your own convenience. Ordering ligatures by length in descending order, however, is a generic rule. If f_f ligature would be in the list before f_f_i, latter one would never be substituted.</p>
      <p>But ordering does not solve your problem of prioritization. If your lookup contains ligatures A_B and B_C, whatever goes first in the list -- "A B C" will be substituted to "A_B C". To allow B_C to work over A_B two separate lookups are required (or contextual substitutions, which seem to be overkill here). </p>
      <p>In VOLT you create two lookups and put ligatures into them according to their priority. FDK also allows to specify separate lookup for the feauture, but I am not sure if it won't compile them into subtables of a single lookup. Syntax would look like this:</p>
      <p><code></code></p>
      <dl>feature liga {
      <dt>lookup liga.Pri1 {</dt>
      <dd>sub B C by B_C</dd>
      <dt>} liga.Pri1;</dt>
      <dt>lookup liga.Pri2 {</dt>
      <dd>sub A B by A_B</dd>
      <dt>} liga.Pri2;</dt>
      </dl>
      <p>} liga;<br>
      </p>
      <p>Thanks,<br>
      Sergey</p>
