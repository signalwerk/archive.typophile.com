  html: |-
    <p>I'm working on a typeface at the moment that uses plenty of ligatures (in the style of <a href="http://www.houseind.com/index.php?page=showfont&amp;id=150&amp;subpage=viewfontsinuse" rel="nofollow">Ed Interlock</a>) and I'm wondering if there's any way to make certain ligatures be dominant over others? For example, for SHI I have an SH ligature and a HI ligature, and because SH comes first as you're typing, it turns into the ligature and the I is left alone. Without having to make an SHI ligature, can I make the HI ligature dominant over SH in the case of SHI?</p>
    <p>And pardon me if that makes no sense at all. I'm just curious if I can make certain ligatures bow down to more dominant ones.. If there's any code or such.</p>
    <p>Also, while I'm here and asking, can you include spacebar in ligature replacements? Say, for example, you have an S and when it's at the end of a word (marked by a spacebar following the S) you want it to do a swashy thing, is that possibe? like a "sub S [SPACE] by SSpace.li" thing..?</p>
    <p>Thanks!</p>
  html_clean: |-
    <p>I'm working on a typeface at the moment that uses plenty of ligatures (in the style of <a href="http://www.houseind.com/index.php?page=showfont&amp;id=150&amp;subpage=viewfontsinuse" rel="nofollow" class="link-external">Ed Interlock</a>) and I'm wondering if there's any way to make certain ligatures be dominant over others? For example, for SHI I have an SH ligature and a HI ligature, and because SH comes first as you're typing, it turns into the ligature and the I is left alone. Without having to make an SHI ligature, can I make the HI ligature dominant over SH in the case of SHI?</p>
    <p>And pardon me if that makes no sense at all. I'm just curious if I can make certain ligatures bow down to more dominant ones.. If there's any code or such.</p>
    <p>Also, while I'm here and asking, can you include spacebar in ligature replacements? Say, for example, you have an S and when it's at the end of a word (marked by a spacebar following the S) you want it to do a swashy thing, is that possibe? like a "sub S [SPACE] by SSpace.li" thing..?</p>
    <p>Thanks!</p>
