    html: |-
      <p>whichever ligature you list first is dominat. so if you want HI to trump SH, in your liga feature put:</p>
      <p><code><br>
      liga {<br>
      sub H I by H_I;<br>
      sub S H by S_H;<br>
      } liga;</code></p>
