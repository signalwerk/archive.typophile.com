      <p><a href="http://www.piclig.net/" rel="nofollow">PicLig</a> by Christina Schultz is a great project too.</p>
      <p><em>Thomas Phinney has demoed some amazing stuff with relatively easy code including random things. He also has an OT font that replaces profanity in text.</em></p>
      <p>Tom used the TypeTalk project as inspiration to build his example using some very excellent contextual alternates...and to think i wasted away hours upon hours of grad school making ligatures! :)</p>
      <p><em>she was an entertaining speaker as well as informative.</em></p>
      <p>thanks chris! it was a great experience, although i don't remember any of it (i was too busy being paralyzed with fear!)...BTW, we met briefly, i believe, when you and gerry leonidas were shaming me for my abysmal knowledge of Greek...</p>
      <p>i'll be making a short presentation next week at SUNY New Paltz (where I developed the typetalk project) on 5/5. see the promo poster...<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/amy_intro_small.jpg"></div><p></p>
