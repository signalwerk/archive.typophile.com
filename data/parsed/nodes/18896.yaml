      <p><em>oh, by the way the “sub SHI by S HI.li;” didn’t work. it gave me an error message when i compiled.</em></p>
      <p>You can't do many-to-many substitutions in OpenType. So if your input is multiple glyphs, then the output has to be a single glyph (i.e. a ligature lookup).</p>
      <p>Regarding ligature names, you should definitely use the underscore notation, so H_I, not HI.li</p>
      <p>A period . indicates that the glyph is a variant of a glyph, e.g. a.alt is an alternate form of a. But there is not HI glyph for HI.li to be a variant of.</p>
      <p>The underscore _ notation is parseable by an application that implements the Adobe glyph naming rules.</p>
