    <p>Typography gift wrap paper<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/advent_calender_typographic_wrapping_paper_02_4031.jpg"></div><p></p>
    <p>We asked ourselves: Why not use figures themselves to design wrapping paper for your Advent calendar?<br>
    No sooner said than done—now <a href="http://en.dawanda.com/shop/frauvonzahl" rel="nofollow">available</a>: Typographic wrapping paper for your Advent Calender.</p>
    <p>Your gifts don’t need tiny boxes, the wrapping paper offers more amount for taller and other shaped presents (for e.g. wine, apples, tangerines  … ). Additional labeling isn’t required for your Advent calender.</p>
    <p>All the figures are especially drawn for the wrapping paper, so that they all show to their advantage in the specific pattern as well as possible. Furthermore, every one of them is set in a specific style. They offer enough varieties on a journey through different typographic ages like classicism or baroque—till the final Christmas Eve.</p>
    <p>We consciously left out colour in a first step, therefore you have enough scope for your individual design, using ribbon or to tie bows after your fancy.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/advent_calender_typographic_wrapping_paper_03_6404.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/advent_calender_typographic_wrapping_paper_09_5732.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/advent_calender_typographic_wrapping_paper_05_6040.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/advent_calender_typographic_wrapping_paper_06_5099.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/advent_calender_typographic_wrapping_paper_07_5387.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/advent_calender_typographic_wrapping_paper_08_3864.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/advent_calender_typographic_wrapping_paper_11_5128.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/advent_calender_typographic_wrapping_paper_10_3630.jpg"></div><p></p>
    <p>The wrapping paper is printed offset in solid black on 70 g/m² matte coating paper and consists of 24 sheets (for every figure 1–24) in format 17″ × 12,2″ or 8,5″ × 12,2″ which is now available in <a href="http://en.dawanda.com/shop/frauvonzahl" title="typography wrap Paper for your Advent Calendar" rel="nofollow">Frau von Zahl Shop</a> at DaWanda. The gift wrapping paper is shipped worldwide.</p>
