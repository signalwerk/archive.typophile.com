      <p>The single-story seems to gel with the rest of the logo better, as it is more open and geometric, but my vote is for the double-story since it will not be confused with an o at smaller sizes. The double-story a is a little heavier visually than the rest of the lettering, but only slightly. You asked if it looks small, but I don't see that at all, so I think you're ok there. For what it's worth, the thinner weight of the two looks much better to me, more natural.</p>
      <p>For fun, here's the a both ways:<br>
      <a href="http://www.myfonts.com/fonts/gtandcanary/morebi-rounded/" title="http://www.myfonts.com/fonts/gtandcanary/morebi-rounded/">http://www.myfonts.com/fonts/gtandcanary/morebi-rounded/</a><br>
