      <p>Patty,</p>
      <p>I think Prince used that symbol during a period when he didn’t have the legal right to use the name “Prince”....Weird and sad huh. People used to call him “Symbol”, since nobody knew how it was supposed to be pronounced. When he got the rights back from his old label, he could use the name again. Not so much a failed campaign as an awkward way to deal with legal restrictions. Not to mention typographically limiting. Though, for a while there, you could download a font with that symbol in it. </p>
      <p>In the case of the soda, and other mass-market items, the very dynamics of competition make all the difference. It’s like beta/vhs. Someone has to lose. I’m intrigued with this because it’s clear it isn’t always the best product or most meritorious that succeeds.</p>
