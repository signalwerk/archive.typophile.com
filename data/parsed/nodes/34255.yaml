    html: <p>There was the Arch Deluxe. McDonalds decided all of a sudden that it wanted to counter the perception that it appealed only to children’s tastes, so they created their vision of a “grown-up” burger and set to work insulting their customers with ads that implied that it’s immature to want a burger made to your preferences if you don’t like onions. On the design front, the restaurants were filled with hanging signs that all showed close-up photos of little kids making disgusted faces, each accompanied by “quotes” of their reactions to the Arch Deluxe like “It looks gross. It’s got all that yucky stuff on it.” Somehow this didn’t make a lot of people want one. Epic failure.</p>
