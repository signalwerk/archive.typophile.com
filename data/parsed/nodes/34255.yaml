    html: <p>Commercial failures are one area that’s interesting, but I’m also looking at campaigns that backfired in one unexpected way for another. For example, both PETA and Moveon.org had their Super Bowl advertisements rejected, mostly because their previous ads had shocked or pissed off so many people that those organizations are becoming persona non grata. Compare that with Benneton, whose ads managed just the right amount of offensiveness to get attention, make people angry, and still stay in print so long that people stopped paying attention.</p>
