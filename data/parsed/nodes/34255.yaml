      <p>Here’s one of my favorites: That little symbol Prince tried to adopt as his identity. I called it “hook, line and sinker”. Notice, he’s back to being Prince.</p>
      <p>I had a client (Fizzy Lizzy) who is now on the 4th design for her product line in as many years. I realized pretty quickly that she’d drive me nuts and we parted amicably, but she had another designer take over, and then had it redesigned again a few months later. I actually like the latest one, it’s a vast improvement on the other three. She saw her market share erode to a competitive product with a much cooler design and almost an identical name (Izze).</p>
