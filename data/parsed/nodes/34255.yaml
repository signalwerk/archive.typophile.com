      <p>Great topic.</p>
      <p>In the type world, I can think of cases where an “elite” (and generally good) designer made a font for a client but then the client rejected it, or at least never bothered to use it: Unger’s Capitolium, Frutiger’s Devanagari, and LettError’s MTV typeface. But I don’t know about your “big risk” here - the designers did get paid.</p>
      <p>In type design it’s hard to see “big risk” being a factor, since you already know you’re not really going to be rich even if your work is successful! You put an inadvisable amount of hours into it either way.  :-/</p>
      <p>Maybe you could say Cassandre took big risks with the way he made fonts, like Peignot (which was actually intended as an attempt to reform the Latin alphabet). When these risks didn’t pay off, he killed himself.</p>
      <p>hhp</p>
