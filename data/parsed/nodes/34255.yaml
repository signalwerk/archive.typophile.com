    html: |-
      <p>I think you need to define “flopped”. If the product wasn’t successful, can you really blame the design? It might be easier to focus on redesigns. And there are some baaaaddd ones out there, like Wrigleys gum. But I don’t know if it affected sales, and that’s what defines a design’s success, innit? And there will always be some public resistance to change.</p>
      <p>The Saks Fifth Avenue Optima-esque logo did nothing for me and now they are back to a redraw of their original script logo.</p>
      <p>Or do you just want to focus on designs that designers dislike?</p>
      <p>I loathe the Verizon logo - as do most designers I know, for example, but that doesn’t seem to be a problem for them.</p>
      <p>Another interesting one, the triangle on the Morgan Stanley logo that Landor got paid umpteen millions to design - and now it’s gone.</p>
      <p>Or... a friend is rebranding Marriott. I told him I liked the M in the circle and he told me it’s considered to be ineffective and they’re dropping it.</p>
      <p>None of these qualify as either risky or shocking tho.</p>
