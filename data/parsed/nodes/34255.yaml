    html: <p>I am by no means an *important* designer but have a kind of interesting case study. I was part of a team that was charged with redesigning Betty Crocker cookbooks to make them more upscale - this was in the mid/late 80s. We trained the photographers, reworked all the designs, individualized them, etc. Upshot was they didn’t sell as well and so Betty reverted back to their more generic midmarket look. This was before Martha Stewart Living &amp; Real Simple hit the scene; I think the public appetite (so to speak) for more elegant cookbook design has improved since then.</p>
