    html: <p>My college’s gallery, in a joint effort by our graphics program and the local chapter of AIGA, put together an interesting show a couple of years ago. Titled LOGO [where the first ’O’ is the red circle with a diagonal line through  it], the show featured AIGA member logo designs that were either rejected or never implemented. It was a pretty cool exhibit. Some of the work never made it for very obvious reasons, and some of it was actually very very good, but still “failed.”</p>
