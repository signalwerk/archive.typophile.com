      <p><cite> &gt;OpenType will be around for the next century</cite></p>
      <p>No, I highly doubt that. I do not think it will be at all. I think that it will be replaced by another format. No idea when or by what, of course, but I’d bet on it.<br>
      </p>
      <p>See what Dan has done there? If OpenType gets replaced, he wins the bet right then. But he can’t lose the bet until the next century comes around!</p>
      <p>For the record, I also think that OpenType is likely to get replaced by 2100.</p>
      <p>Quite separate from the question of formats, though, I think there are plenty of unexplored areas in type design that call out for custom work. I wish there were more billionaires, corporations, governments that would support custom type design work for traditionally neglected areas like, say, minority languages.</p>
