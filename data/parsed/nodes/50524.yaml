      <p>Like much of the type market, information is mainly anecdotal.<br>
      I’m sure my experience is very different from James’—although I agree with his theory of the brand-driven impetus.</p>
      <p>If you are interested about this sort of thing Jon, you could commission a survey now, and follow up later to see if there has been a change. It would involve analyzing a list of foundries and seeing what they reveal about their custom work. However, they might not reveal all their custom work (I don’t get around to posting everything I do, whether or not I am happy with the results), and just scanning foundries might not pick up all active work. For instance, some lettering artists also do custom type design, such as Ian Brignell’s new font for <a href="http://www.ianbrignell.com/">Bell</a>.</p>
      <p>Custom type varies by country. I get the impression there is more corporate work in the UK, more periodical work in North America.</p>
      <p>With regard to Hrant’s concern, I would say that declining news sales in the US, coupled with consolidation (both economic and technological), might lead to a reduced demand for custom news fonts. On the other hand, technology can open up new markets (on the internet perhaps?) </p>
      <p>While it might seem that an economic downturn would reduce the budget for custom type, on the other hand, a dramatic change in the zeitgeist could rapidly obselesce exisiting identities, leading to a demand for rebranding. And then of course, with bankruptcies and takovers, new corporate identites emerge which will require expression. Recession as opportunity.</p>
