      <p>”...who wanted the digital interfaces for his multimillion dollar ship” [and analog interfaces]...”[Fashion: haute couture like John Galliano)”<br>
      That is one way of looking at it. Another way could be that when the deck is rolling, the rain is coming down in sheets, and the salt is stinging your eyes, why would you also want to read 60% horizontally scaled 8.2 point Bank Gothic on a 14 mm square button, or a MS “Cleartype font” with CAD operator-quality typography? Additionally, fashion, to a great extent, depends on people seeing the fashion, which is also hardly the case in the plucked instance. I am not saying I’ve never done custom type design for the sake of fashion, but the boat fonts were not one such instance. </p>
      <p>I believe the market is growing. The reason I say so, is because we’ve  always been busy with it for 20 years now, and though we used to ’own’ a 100% market share, there are now hundreds of custom font designers, and we only have a 1% market share for the same amount of work being done by us. ;)</p>
      <p>Cheers!</p>
