      <p>In any market there is going the be a moment when saturation occurs — eg most people own your product(s). After this the market is one of steady renewal of obsolete stuff. Example: iPods. You own one, you buy a new one when it breaks down.</p>
      <p>Type is not a normal business, of course, but the basic principle of saturating a market still applies, imo. How many typefaces do you use? How many do you need? How much new stuff is exciting enough?</p>
      <p>Something to think about: the implementation of OpenType is probably an impetus for continuing growth is type sales, but the time will come where this technology has matured with the evident consequence that sales of OT-faces will slow down.</p>
      <p>Interesting question. I am going to think some more about this.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
