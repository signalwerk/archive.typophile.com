      <p>Like a lot of other products/services there will be a high end part of the business where snobbish people/firms will want to display their uniqueness by commissioning custom typefaces (example: David Berlow did a fontfamily for some billionaire who wanted the digital interfaces for his multimillion dollar ship to reflect the excellence he aimed for in every aspect of its design and build — David presented that during Type 2008). [Fashion: haute couture like John Galliano).</p>
      <p>A larger, but still small group of companies/individuals will buy the more exclusive and pricy fonts that might for instance trickle down to the market after their exclusive rights have ended. Some designers may cater to this group. (Fashion: like Dries van Noten).</p>
      <p>A greater part of the market will just follow the trends that smart marketeers will initiate. As happens in a lot of other fashionlike industries (cars, clothes, shoes, etc.). Fast-and-furious typedesigners could make a bundle here (Kris is fast!), but they need marketing prowess and power. (Fashion: Donna Karan, Ralph Lauren).</p>
      <p>The masses will just use what comes along, preferably free, maybe with some likeness to what is hip. But most of all: cheap. Think of thousands of name– and faceless type-engineers in sweatshops in China or Vietnam, drawing/building quick and dirty knockoffs of bestselling typefaces, marketing them through the internet, or by including 10 cent coupons in breakfast cereals. (Fashion: Hennes &amp; Mauritz, GAP).</p>
      <p>A pretty bleak future, I realise now. : )</p>
      <p>Hrant: leaders of government have seldom shown any degree of good taste. That is not going to change soon, I think. In the Netherlands the powers that be have decided that all of the different identities of governmental departments and organisations have to go and in future one Identity Program for All will be used. If they had done that 15 years ago, some very fine typefaces (like Lud[as] de Groots Corpid) would not exist.<br>
      Euro money looks awful, esp for us Dutch who had arguably the most beautiful paper money in the world — Roger Pfunds Swiss stuff is also okay, I give them that —, and that was the result of a decision by a handful of so called leaders and civil servants, who apparantly had no taste as well. More of this is going to happens as institutions become larger and larger and less democratic.</p>
      <p>Shit, reading what I wrote, the future looks even bleaker now. My plans to do some typedesigning probably will have to wait another twenty years, when I can do it as a hobby…</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
