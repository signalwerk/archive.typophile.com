    votes: null
    html: |-
      <p>My friend,<br>
      ive just been watching the pdf, and got to this conclusion:<br>
      s - needs adjustment on its superior left part, i mean, i can see a sharp connection of it with the middle part.</p>
      <p>t- has too much base. Maybe you should make it more "condensed", less base. the word you use: contemptuous, shows it: the inferior part of that t is giving kerning problems as a result.</p>
      <p>ligature b_r has a similiar problems (the s problem), it still needs to be softer, i can see a sharp connection when it curves abruptly to ligate the r.</p>
      <p>Same with g_r, the g has a little sharp mountain on its top, be careful.</p>
      <p>As regards the curvy e, and its ligatures, they are better! But, also make it a bit more fluid.<br>
      The e, (the new one) should be more fluid on that new part of the eye.</p>
      <p>y- looks pro! congratulations, that one is very well done ;)</p>
      <p>Best, and good luck!</p>
      <p>Lián Types.-</p>
