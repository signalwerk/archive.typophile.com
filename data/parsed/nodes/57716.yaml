    <p>Hello all,</p>
    <p>Although I frequently browse through these forums my contribution to them is still scarce. But I enjoyed making this 'typeface' so much I wanted to share it with you. Hopefully you can give me some feedback to improve it.</p>
    <p>It's a monoline sans with quite a few (discretionary) ligatures, it was inspired by the ligatures in Avant Garde Gothic (alternates). It misses optical correction and inktraps at the moment and that will cause 'darker spots', might address those in the future.</p>
    <p>Thank you!</p>
    <p>Attachments;<br>
    <em>monoline_sans_serif_ligatures.pdf</em> shows the original design<br>
    <em>monoline_alice.pdf</em> updated letterforms and ligatures per 05/13/2009</p>
