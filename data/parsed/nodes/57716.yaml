      <p>Thank you both for your comments.</p>
      <p>The s_c and the s_e do need some work. I believe the s_e can be saved, but am not sure of the s_c. I'm afraid it will keep looking like an s_e. Here are some alternatives to the s_e;</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/monoline_sevens_5536.jpg"></div><p></p>
      <p>I is the original, II has a more fluid curve without making the eye of the e smaller, III is a more fluid curve with a smaller eye &amp; IV is a curvy e where I tried to maintain the same size eye as the original — I think I like option IV the most but am not sure if it is too big a difference from the normal e.</p>
      <p>This 'hard' g is actually an alternative I had drawn at a later stage, I liked it more than the curvy, original g. But this was before I added a lot of the ligatures which changed the overall feel of the font. Here are both;</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/monoline_magemagic_5937.jpg"></div><p></p>
