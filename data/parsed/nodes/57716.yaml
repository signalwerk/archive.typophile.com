      <p>Your work is interesting. This, because it has, for example the fact of particular ligatures which are not very common.<br>
      In my opinion, there are some ligatures that are working better than others.<br>
      s_a and s_o are better than s_c and s_e.<br>
      Despite the fact the first pairs I've mentioned need a bit of optical correction as regards to their connections (a more fluid curve), they are much better than s_e for example.<br>
      This one is a bit forced yet, I mean, the sharp edge of the "e" is not working ok with the meeting. Maybe you should make "e"'s eye smaller, so the curve of the connection with the s should be longer.<br>
      I also think "g" should have a curve instead of that sharp part you are including on its tail. Your type is very curvy, the "g" is not following that parameter yet.<br>
      Well, hope this helps!<br>
      Best! and good luck!</p>
      <p>Lián Types.-</p>
