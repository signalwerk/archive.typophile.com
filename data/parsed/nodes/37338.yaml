      <p>In this thread:<br>
      <a class="freelinking external" href="http://www.typophile.com/node/36418" rel="nofollow">http://www.typophile.com/node/36418</a><br>
      James Montalbano quoted;<br>
      "As to size, I believe ADA guidelines specify 1 inch of cap height for every 50 ft of viewing distance.(I know this is what FHWA has built their spec on)."</p>
      <p>I also remember using this guideline back in my days in the sign business. You might want to use a size larger than that formula provides, since a billboard needs to be read from a moving vehicle, which is considerably more difficult than reading while standing still.</p>
      <p>Jason C</p>
