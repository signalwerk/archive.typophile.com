    <p>Does anyone know where I can find some online reference for environmental typography, specifically what general type sizes are required for reading at certain distances?</p>
    <p>I need to design a billboard and I'm not sure how small I can go with the type, yet still have it be readable from say 50 yards.</p>
    <p>Thanks!</p>
