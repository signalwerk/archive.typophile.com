      <p>That'd explain the squooshed-ness, assuming it looks like that out of the box and I think it does. Well, it doesn't seem to be free, apparently you can buy it <a href="https://web.archive.org/web/20141114171855/http://www.linguistsoftware.com/tech.htm" rel="nofollow">here</a> as part of a bundle for US $99.95.</p>
      <p>I wouldn't recommend buying this, I think you should replace it with Eric Olson's <a href="https://web.archive.org/web/20141114171855/http://www.processtypefoundry.com/typefaces/bryantcon/index.html" rel="nofollow">Bryant Condensed</a>, it costs $99.00 for 4 weights. You'd save 95 cents and gain a    lowercase as a bonus. :^D</p>
