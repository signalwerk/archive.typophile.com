    <p>Hello girls and guys,</p>
    <p>i'm new there, and i've been told by a friend about this website that is really great.</p>
    <p>My first post is identifying a font that i don't find anywhere.</p>
    <p>I'm working for a client, and unfortunately, i've to edit some text but haven't any source to identify this font, so the only i have is jpg image.</p>
    <p>so the ultimate question is, what font is iT? :)</p>
    <p>it would be wonderful if anyone found it out...</p>
    <p>Thank you in advance for your help</p>
    <p>victor</p>
