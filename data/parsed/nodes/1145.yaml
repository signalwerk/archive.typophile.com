    html: "<p>Hrant, you crack me up.  I have seen that poster.. I also use Brothers for the Magic-Marcus logo: <br> <br><a href=\"http://www.diphthong.com/magicmarcus/\" target=\"_top\">http://www.diphthong.com/magicmarcus/</a> <br> <br> <br>I LOVE the Brother's face version but this is a 'design' magazine in Singapore, not Tennessee (trust me, it would still be a refreshing change from the usual logos around here but I doubt they have the true spunk to go for it, or, I mean its just not their character). The client wants to stick with 4E5.b and 4E5. But at the same time has thoughts to #4 with the reversing technique.  <br> <br>Still, I don't think we are done yet.. Some are saying they like E5 instead, especially now after seeing the last two.  <br> <br>Marc I think you right about the Kerning on 4E5.c, but to me, it loses appeal when its too tight. Imagine it on a magazine overlaying a photo.</p>"
    html_clean: "<p>Hrant, you crack me up.  I have seen that poster.. I also use Brothers for the Magic-Marcus logo: <br> <br><a href=\"http://www.diphthong.com/magicmarcus/\" target=\"_top\" class=\"link-external\">http://www.diphthong.com/magicmarcus/</a> <br> <br> <br>I LOVE the Brother's face version but this is a 'design' magazine in Singapore, not Tennessee (trust me, it would still be a refreshing change from the usual logos around here but I doubt they have the true spunk to go for it, or, I mean its just not their character). The client wants to stick with 4E5.b and 4E5. But at the same time has thoughts to #4 with the reversing technique.  <br> <br>Still, I don't think we are done yet.. Some are saying they like E5 instead, especially now after seeing the last two.  <br> <br>Marc I think you right about the Kerning on 4E5.c, but to me, it loses appeal when its too tight. Imagine it on a magazine overlaying a photo.</p>"
