    html: <p>Andreas, a massive number of the PUA-encoded glyphs in your excellent survey are presentation forms of letters plus diacritic marks that have standard Unicode encodings using combining mark sequences. While I understand that there have been difficulties in the past in reliably rendering combining mark sequences, these difficulties have very largely disappeared, and maintaining non-standard encodings for these diacritic letters is very bad text processing and interchange practice. All you need is one user receiving the text and either displaying it in a font with different PUA usage or being unable to display it at all, and the whole ‘practice and agreement’ falls apart. Standards exist for a reason, and as soon as something is encodable via the standard private encodings should be deprecated as quickly as possible.</p>
