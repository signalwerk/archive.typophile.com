    <p>When I pop up the block’s list in Fontlab’s font window (Unicode depiction mode; see image) and scroll down to E000 – <a href="/wiki/Private%20Use%20Area" class="freelinking" rel="nofollow">Private Use Area</a>, then I read a bunch of subheadings which suggest that MS, Apple, SIL and Adobe have made their own “private” deal upon that codepoint space. But it isn’t that I wonder about. I wonder about why Fontlab submissively sub-labels that area and uses it for promotion.</p>
    <p>There are other PUA encoding schemes established which have not less merits than the one apparently favoured by FL. I find this favouring offending and suggest that FL should *not* continue to feature this subheadings by default in the future.</p>
    <p>Or was it money –?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/FL_pua_5572.jpg"></div><p></p>
