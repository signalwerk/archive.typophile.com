      <p>Andreas, </p>
      <p>&gt; Thank you but I don’t want to be bothered by MS or Adobe product “information”<br>
      &gt; while I’m at work. The more if I happen to deal with that codespace in a way<br>
      &gt; different from how others do it.</p>
      <p>If you place your own copy of "uranges.dat" in the Data subfolder of the FontLab Studio shared user folder, FontLab Studio will automatically use that. Feel free to customize that file and remove any range labels that you feel "offensive". This is precisely why FontLab Studio is very customizable. </p>
      <p>Since Adobe, Microsoft and SIL have publicly documented their use of the PUA, we are providing their assignments so that users of FontLab Studio who would like to adhere to their "quasi standards" can easily access them. You can publish your own PUA mappings in the "urange.dat" format on your website so that users who would like to take advantage of your use of the encoding space can easily do that. </p>
      <p>I do not consider our information any more "promotional" than the fact that we use the Adobe Glyph List for New Fonts rather than providing completely invented glyph names -- because there is software in the world that actually makes use of those mappings. We try to be compatible with major software vendors' products so that the fonts our users generate can be, too. That's it. </p>
      <p>Regards,<br>
      Adam</p>
