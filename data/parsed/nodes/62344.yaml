      <p>See page 11 of this Unicode PDF:<br>
      <a href="http://unicode.org/book/ch13.pdf" title="http://unicode.org/book/ch13.pdf">http://unicode.org/book/ch13.pdf</a></p>
      <p>Unless one actually has a need to produce a font that is compatible with a particular company's use of PUA codepoints, it is best to avoid that relatively small set of codepoints, just in case some piece of software is making assumptions about those codepoints. That said, the nature of the PUA is explicitly such that neither software developers nor font developers should expect <em>any</em> degree of safety in making assumptions about the use of any PUA codepoint beyond their own internal use. The basic rules of the PUA apply as much to the ‘Corporate Use Sub-Area’ codepoints as to any other PUA codepoints, so there is nothing to prevent another company or an individual using the same codepoints for other purposes or even claiming them as their own ‘corporate use area’.</p>
      <p>Corporate use of the PUA has occasionally been an issue for me in my work, but only because I'm making fonts for companies that have already made use of some PUA codepoints and I need to make sure that I use fresh ones that their software does not associate with other characters.</p>
