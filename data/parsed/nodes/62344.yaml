    html: |-
      <p>Andreas, </p>
      <p>indeed, it is suggestive for the average user, and it has its reasons. One of the reasons is that some PUA codepoints actually are hardcoded into Windows' CJK processing so using them may result in non-functional fonts. For more details, see <a href="http://scripts.sil.org/PUACharsInMSSotware" title="http://scripts.sil.org/PUACharsInMSSotware">http://scripts.sil.org/PUACharsInMSSotware</a></p>
      <p>Other major vendors also make use of certain PUA codepoints, as documented here: <a href="http://scripts.sil.org/VendorUseOfPUA" title="http://scripts.sil.org/VendorUseOfPUA">http://scripts.sil.org/VendorUseOfPUA</a></p>
      <p>Since this may have repercussions on the functionality of fonts made by independent vendors, we think that labeling the PUA subsections has its merits. </p>
      <p>Cheers,<br>
      Adam</p>
