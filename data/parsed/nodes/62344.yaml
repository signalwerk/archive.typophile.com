      <p>I don't think there's any nefarious plot going on here - but then again, I am from SIL. I'm actually surprised to see this documentation of the SIL PUA ranges in FontLab. We didn't ask for it. It looks like Fontlab is only trying to serve their customers by gathering together info on the most common uses of the PUA. SIL's use of the PUA is <a class="freelinking external" href="http://scripts.sil.org/UnicodePUA" rel="nofollow">publicly documented</a> and follows the guidance of the Unicode Consortium.</p>
      <p>Like John, we try by all means to avoid using the PUA. Most often it has been used as a practical temporary way to encode language data during the sometimes lengthy process of getting new characters accepted into Unicode. Around 80% of our PUA assignments are characters that have now been accepted into Unicode, and the use of them as PUA characters has now been deprecated (no longer recommended). Our detailed <a class="freelinking external" href="http://scripts.sil.org/PUA_deprecation" rel="nofollow">deprecation strategy</a> is available, and explains why we keep characters at both new and old codepoints in our fonts. The other 20% are characters that Unicode rejected, ones that we have not yet proposed, or ones we ourselves have later deprecated.</p>
      <p>FontLab's acknowledgment of the most common PUA uses is not advertising. They are only trying to let font developers know about them so they can avoid those places if they have customers that already use MS, Adobe or SIL fonts - or use them in the same way. Note that since this is a <em>Private Use Area</em> you can feel free to use the range however you choose. Nothing bad will happen if you assign random chars to fall in the 'SIL PUA'. :-)</p>
