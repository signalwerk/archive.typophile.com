    html: <p>This is informational. If a major software developer has used PUA codepoints for some particular purpose -- most likely legacy -- then there is a risk that these codepoints might come with assumptions attached in that software, and it would be a good idea to avoid using these particular PUA codepoints. Alternatively, if you specifically want to make a font that is compatible with the use of PUA in particular software, then you want to know what this use is. And it would be perfectly possible for FL to expose multiple and conflicting uses of PUA codepoints in this way. All you are looking at is a labelling system.</p>
