      <p><cite>Since Adobe, Microsoft and SIL have publicly documented their use of the PUA, we are providing their assignments so that users of FontLab Studio who would like to adhere to their “quasi standards” can easily access them. You can publish your own PUA mappings in the “urange.dat” format … </cite></p>
      <p>And yet, it still seems more decent to me if FL does *not put any labels* under [PUA] at all by default. As it is, it is suggestive for the avarage user and that kind of suggestion is possibly misleading.</p>
