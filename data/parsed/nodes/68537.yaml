    html: |-
      <p>Hard to evaluate it without knowing more, such as how this illustration will be used. </p>
      <p>But my offhand comment is that you're obviously a good illustrator, but the "robbing the bank" theme is hard to spot. Took me a minute to realize there was a broken piggy bank, and the princess' mallet is hard to see.</p>
      <p>Might be better if there was just one piggy bank -- the broken one -- instead of 3 banks, and if the bank was bigger or more obvious, and perhaps with the currency flying out of it instead floating some distance away. (I thought at first that the currency had come out of that open drawer.) And you might try turning the frog so it's body is pointing towards the piggy bank.</p>
      <p>Have you considered showing the moment the princess is actually breaking the bank (BAM!), or the moment before when she's swinging the mallet and we anticipate the bank breaking?</p>
