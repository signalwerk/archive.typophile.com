      <p>I will say this again because it's important and may not have sunk in:</p>
      <p><em>Files in the "/System" folder belong to the OS itself, not to you. Remove them at your peril. If something breaks after your remove anything from "/System", even a font, no one will cry for you.</em></p>
      <p>Off the top of my head, I know that <a href="http://docs.info.apple.com/article.html?artnum=300501" rel="nofollow">iChat will fail if Helvetica is removed or disabled</a>. So will <a href="http://docs.info.apple.com/article.html?artnum=25726" rel="nofollow">Address Book</a>. Terminal gives you a <a href="http://docs.info.apple.com/article.html?artnum=25730" rel="nofollow">tiny, unusable window</a> if you disable Monaco. Version 1.0 of iCal <a href="http://docs.info.apple.com/article.html?artnum=61734" rel="nofollow">crashes</a> if you try to launch it without Helvetica Neue enabled, and that's just in "/Library/Fonts", not "/System".</p>
      <p>For better or worse, some applications require their fonts; disable them at your own peril. Disable the <em>system's</em> fonts at the peril of every application.  Feaverish posted the <a href="http://docs.info.apple.com/article.html?artnum=301332" rel="nofollow">link</a> to the list of fonts that Apple says you should not disable in Mac OS X 10.4, and it, in turn contains a <a href="http://docs.info.apple.com/article.html?artnum=25710" rel="nofollow">link</a> to the same list for 10.3.</p>
      <p>But Apple points out that there's an even simpler test: Font Book will not let you disable any font that the system deems as required.  So, no matter what font manager you're using, if you have any questions, try disabling the font in Font Book.  If you can't, then removing it some other way is a bad idea, and you're on your own.</p>
      <p>(Honest to God, tinkering with the "/System" folder is such a bad idea.  It's like opening the hood of a car and saying, "Hmm, how many of these parts can I remove and still think everything will work correctly?")</p>
