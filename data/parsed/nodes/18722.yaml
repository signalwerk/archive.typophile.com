      <p>Anything that the system itself <em>requires</em> to operate will be found in "/System/Library/Fonts" or elsewhere in the "/System" folder.  Mac OS X reorganized things and created the "/Library" folder precisely so that you would <em>leave the "/System" folder alone</em>.  Anything you remove from "/System" is simply a request for your machine to give you lots of hard-to-track-down trouble, period.</p>
      <p>(Yes, I realize 400 people may respond with "but I removed X and nothing bad happened."  I don't care - they're wrong.  The "/System" folder is for Mac OS X itself.  That's why "root" owns all of it.  Leave it alone.)</p>
      <p>Anything in your personal fonts folder ("~/Library/Fonts") is discretionary, as is, <em>technically</em>, anything in "/Library/Fonts" (the machine-wide configurable fonts folder).  However, applications that require their own fonts are supposed to install them in one of those two places (usually "/Library/Fonts"), and if those fonts are missing, those programs may not work properly or at all.  Tax preparation and music notation programs may fail completely if their special fonts are not available; suites like Microsoft Office may try to "reinstall" Microsoft fonts if they're missing.</p>
      <p>Go to your nearby Apple store, find a display system that is obviously little more than an out-of-the-box machine with demo software, take screen captures of "/Library/Fonts" and "~/Library/Fonts", and E-mail them to yourself.  You should leave those fonts in place; use your font manager (or Font Book, if nothing else) to disable them if you don't want them cluttering up menus. Just keep in mind that some applications may require more.</p>
      <p>The suggestion about the four basic fonts for the Mac OS 9 system folder is correct.  If you remove outlines from that folder, you must at least keep bitmaps for Charcoal 12, Geneva 9, Geneva 12, Monaco 9, and Chicago 12 available to the system or it will not function.  (If your Mac is an older one that can boot into Mac OS 9, it may not even boot if the latter four bitmap fonts are not available.)</p>
