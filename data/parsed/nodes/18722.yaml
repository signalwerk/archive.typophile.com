      <p><cite>Anything you remove from “/System” is simply a request for your machine to give you lots of hard-to-track-down trouble, period.</cite></p>
      <p>I agree. I think the most common way to run into trouble is if you have your own Postscript family of Helvetica, which obviously has many more variations than Helvetica.dfont. It could be that it is activated in a font manager which can override system fonts, or it could simply be that it is earlier in the font path, for example, in ~/Library/Fonts/. The effect can be the same in terms of application functionality. An application that uses Helvetica (and many do)  will be using the Postscript version, which may not function as expected. </p>
      <p>Usually, this isn't a problem, but I think that's what "hard-to-track-down" problems are all about. In a way, it is unfortunate that applications like Safari, iChat and Mail make use of Helvetica for display purposes, when users may have perfectly valid reasons for using their own versions. For example, people commonly have older documents that were created with Postscript versions of Helvetica. </p>
      <p>It is interesting to think of this in light of the Segoe/Frutiger controversy. Apple could have avoided this situation by somehow renaming their version of Helvetica, to say AppleHelvetica. Perhaps they couldn't because of licensing issues...</p>
