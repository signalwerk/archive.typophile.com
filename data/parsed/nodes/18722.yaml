    <p>Can anyone help me with a definitive list of essential Mac OSX System Fonts that are absolutely, positively necessary to ensure that my operating system (Tiger 10.4.5) will continue to run without problems?<br>
    I've scoured the Internet and other Forums with little luck other than listings that contradict each other.<br>
    I'm determined to somehow get rid of all unnecessary fonts that irritatingly clutter my various application font menu's<br>
    Any assistance from anyone would be most appreciated.<br>
    I thank you all in advance.</p>
