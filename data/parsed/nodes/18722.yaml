      <p>It's over 4 years since the other comments, but thought I'd add my experience.  I just upgraded from Mac OS 10.4.11 to Mac OS 10.6.4 and couldn't believe how slow and sluggish the Mac became.  </p>
      <p>Finally discovered that after the upgrade there were:<br>
      36 font files were inside  /System/Library/Fonts<br>
      Over 500 font files inside /Library/Fonts<br>
      Over 300 font files inside User/Library/Fonts</p>
      <p>Emptied the 800+ font files from the latter two locations (instead I rely on Linotype's FontExplorer to manage all my fonts).</p>
      <p>Net result.  Vast speed improvement and responsiveness on the Mac.</p>
