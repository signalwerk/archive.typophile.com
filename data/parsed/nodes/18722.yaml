      <p>Here's a fun project for the brave that will definitely prove which fonts are essential:</p>
      <p>1. Delete all fonts from Library/Fonts<br>
      2. Delete each font from System/Library/Fonts one at a time, restarting after each deletion.<br>
      3. As soon as you're unable to fully boot or login, you'll have found an essential font.</p>
      <p>If you can no longer boot or login, just boot to target disk mode and replace the fonts with those from another Mac.</p>
