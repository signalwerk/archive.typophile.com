      <p>I presume the reason Comic Sans is listed as being required is because if it or any of the other Web Core Fonts are disabled/removed, Microsoft Internet First Run will reinstall them (in ~/L/F) next time you launch Internet Explorer, and you'd end up with copies everywhere. Someone, however, seems to have forgotten to tell the documentation writer that IE no longer ships with the OS.</p>
