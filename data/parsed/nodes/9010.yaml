  html: <p>I'm designing this condensed sans-serif top-heavy font. I'd like any constructive criticism you can offer to improve the process and the look of it. This is all the letter I have finished so far...<img src="http://www.typophile.com/forums/messages/29/64427.gif" alt="deil_typeface"></p>
