    date: 2005-02-03T12:45:00
    votes: null
    html: <p>Chris, I'm looking forward to seeing this top-heavy font in use. <br> <br>The only character that really bothers me is the 'B'. The top bowl is too top-heavy for my taste. It's the width more than the height. I'd optically adjust it so it's a bit more narrow. Just enough to correct the illusion that it's wider than the bottom.</p>
