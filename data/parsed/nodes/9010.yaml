    html: |-
      <p>I really like your new font. I think it would really work in some kind of new sci-fi print-base! I am wondering if the A need a bit of squidge on the top as it seems a bit more pointy than the other letters? However i think it is beautiful. It would work.</p>
      <p>I could say that Nick may be right about the A, perhaps being a lil bit too wide as it stands out a little from the other letters. But that may be your aim. It is pretty unique. </p>
      <p>The B is lovely. I think that if the bar of the A and the bottom of the P’s bowl were to come to the same level as the other letters, you may have created a perfect font. Keep up the good work!</p>
      <p>It is beautiful.</p>
