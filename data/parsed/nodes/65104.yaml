    html: |-
      <p>Because of the geometric nature of the lettering it seems quite possible to me that this was drawn the way a draftsman would have done it many years ago. Lex's suggestion sounds like a good way to approximate it, but perhaps start from a different sans than Johnston,something geometric, like one of the Neuzeit sans faces. They might have the serif on the J too.</p>
      <p>- Mike Yanega</p>
