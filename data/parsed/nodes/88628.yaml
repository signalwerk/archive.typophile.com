  html: |-
    <p>Hello,</p>
    <p>I am new to type design and have created a display typeface in illustrator with all accent sets and a couple of alternates for certain letters. I want to bring everything to Fontlab and make it a usable font.</p>
    <p>Which glyphset table should I use?<br>
    Opentype Standard<br>
    MacOs Roman<br>
    etc<br>
    etc</p>
    <p>What is the difference, how do you define chosing one over another?</p>
    <p>Thanks!</p>
