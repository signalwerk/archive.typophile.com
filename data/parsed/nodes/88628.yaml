comments:
  - id: 488797
    user: 29994
    date: 2011-12-27T20:17:00
    date_raw: 27 Dec 2011 — 8:17pm
    votes: null
    html: |-
      <p>It doesn't matter. FontLab re-sorts the glyphs according to what display option you choose, but internally everything will just have the same assignments.<br>
      Of course you need to save your glyphs under the correct Unicode values -- after all, that's how FontLab recognizes them and can display them in any order you liike.</p>
      <p>What encoding you choose is only relevant if you intend to export your font for a system that limits the type of characters, i.e., if you want to limit yourself to Mac Roman Encoding, you cannot include Chinese as these characters will never get included.</p>
