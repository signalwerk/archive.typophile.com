      <p>In addition to what Nick and Charles wrote:</p>
      <p>In a recent catalogue design, I chose to use three different figure styles on one page:</p>
      <ol>
      <li>OSF were used as default, throughout the text.</li>
      <li>I resorted to lining figures for the sizes, as the OSF looked bumpy with the fractions.</li>
      <li>The archive numbers consisted of caps and figures. That looked best in small caps, hence small caps figures.</li>

      <p><a href="http://kaune.hardwig.com/portfolio/dian-woodner-collection" rel="nofollow"><img src="http://kaune.hardwig.com/wp/wp-content/uploads/UTUH-2.jpg"></a></p>
      </ol>
