    html: |-
      <p>Thomas, as Nick says, it depends, but as a generality, within the text of a book, we'll use old style generally, but with full caps, we'll use lining. It gets a little hincky when there is only one letter and it's a cap, like I-75 (for an interstate highway).  My feeling it is still better to use the lining with the full cap. Holds true even if the sentence is "In 1975, I-95 was finished." Oldstyle for the date, lining for the interstate number. It's a matter of what gets a full cap &amp; what doesn't -- just as with the alpha characters..</p>
      <p>FWIW</p>
    html_clean: |-
