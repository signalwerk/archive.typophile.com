      <p>Maybe a rule of thumb is that OSF is potentially problematic when letters and numbers are part of the same word?  A few of the examples above fit this rule.  The letters can interfere with interpreting OSF's as numbers.  Something I wrote had the gene name "IBD5" in a Adobe Garamond with OSF, and the 5 was hard to read as a 5.  To me, in that context the 5 looked a bit like a Greek final sigma.  </p>
      <p>(Not a designer, just a fan.  Feel free to tell me I have no idea what I'm talking about.)</p>
