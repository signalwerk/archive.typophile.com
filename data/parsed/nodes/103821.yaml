      <p>This is a variation of <a href="http://www.identifont.com/list?3+Futura%20Black+0+44N+1+6N5+1+24P+1+6DV+1+61V+1+6DJ+1+23R9+2+P52+2+OXO+2+MAT+2+I8P+2+CYU+2+CW8+2+AGD+2+CYS+4+CYR+4+259X+4+23RA+4+CYQ+4+1MZ+4+1ZE+4+20M+4+4CN+5+BT1+5+404+7+PNM+8+2YDV+8+OUI+8+EFS+8+2EEN+8" rel="nofollow">Futura Black</a> designed by Josef Albers as a geometric sanserif at the Bauhaus in 1926 and produced by Paul Renner and the Bauer design office as a typeface in 1929, as part of the Futura series. The original design and variations are available from various foundaries. I don't know if the variation in your image has a unique name or was produced by a designer for the AIGA in 1965.<br>
      Don</p>
