      <p>I wasn't going to comment, but...</p>
      <p>You need to be very careful kerning anything with a space. It is a slippery slope, and easy to get in trouble.</p>
      <p>I've used this example before on Typophile. Take Adobe Jensen. Set f_wordspace_quotedbleleft_a</p>
      <p>The wordspace just vanishes  -- esp if you fill out the words, like </p>
      <p>...variance of "allowed" tolerances...</p>
      <p>Hugh Ambrose's book, <cite>The Pacific</cite>, is full of these. The cause of this problem with Jensen isn't so much the "f" but the kerning of the quotes back into the wordspace. The two kerns in concert kill the wordspace.</p>
      <p>If you want to kern an f with a wordspace, be sure to test it when followed by a few capitals -- capital J is usually the worst, as in "of Jewish origin."  Some lower-case letters can give problems, too (b,h,i,j,k,l), as well as the left quotes.</p>
      <p>I prefer to create a special f, where, when followed by a wordspace, the flag (nose) of the f is shorter, and the sidebearing a bit greater -- though I suppose increasing the sidebearing is the same as using a blanket kern. I believe this is what Bill showed with his Caslon. With OpenType, a calt substitution can make its use automatic.</p>
      <p>As others have said, the real answer, in so far as there is one,  comes from the design and spacing of all the letters, and the compromises they occasion. Pairs kerning offers only limited help. You have to set it up for the worst case. Contextual kerning can improve greatly on that.</p>
      <p>Here is the mental model I use for contextual kerning. Back in the days of hand-set type and the composing stick, you set the line, then added more space to the word spaces to drive the line out to full measure. If a particular space was optically larger, you just didn't add as much space there. </p>
      <p>The problem with machine set type, esp. computers, is that adding equal space to drive out the line is automatically applied everywhere. The "programmatic handwork" then, comes in taking out space -- kerning. Essentially, that requires triplets. For example, c_space_w usually requires less space than h_space_n. for optically even spacing. Etc.</p>
      <p>If you can put this in the font and your layout program supports it, fine. Otherwise, easy enough to write a script to put the kerns in with a layout program -- InDesign, TeX, whatever. If you use regular expressions, you can get quite close to the thinking/approach of class-based kerning. We've done this in our shop since the late 1980s, when we drove a photocomp machine (Linotron-202) with TeX. </p>
      <p>But for kerning between just two letters, don't go beyond what the worst situation allows when you add that third letter -- e.g.,  f_space_J, f_space_quoteleft, etc.</p>
