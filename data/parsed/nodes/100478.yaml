      <p>Hrant: <em>But I wonder, what about kerning something like "f"-[space] positively?</em></p>
      <p>Yes. This is more important than tightening word spacing for letters like A and V. If those are well-spaced to begin with, then the visual impact on word spacing isn't very great. But an f that extends a long way into the word space will come very close indeed to a following cap or ascender, especially a T.</p>
      <p>This (above) is the f-to-space kerning in Brill Roman, with the same sequence without kerning below. The value here is +45/1000  units.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ralf_6726.png"></div><p></p>
