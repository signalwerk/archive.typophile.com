      <p>It's pretty rare, probably because it can be dangerous, since it can result in words becoming too close (and too loose doesn't harm readability nearly as much as too tight, at least in terms of wordspace). But I wonder, what about kerning something like "f"-[space] <em>positively</em>? For a really... well-endowed "f" that might be good.</p>
      <p>A more sophisticated solution though is kerning <em>triplets</em> (with the space in the middle) although as Ralf says it can explode.</p>
      <p>hhp</p>
