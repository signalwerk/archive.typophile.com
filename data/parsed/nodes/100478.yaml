      <p>Bill, Charles, I've opined this before, and I still think making the "f" more modest (compromising the bouma) before a space is backwards: the beak of the "f" (the only worthwhile ascender in the Latin alphabet) is kept at bay mostly to avoid a collision, and the blank space totally eliminates that problem. So -assuming you're not getting into kerning <em>triplets</em>- I think kerning the "f" positively with the space is generally the best compromise; I might even contextually make the beak <em>bigger</em>. Remember, too much space isn't nearly as bad as too little.</p>
      <p>hhp</p>
