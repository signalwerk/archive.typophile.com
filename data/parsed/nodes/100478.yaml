    html: |-
      <p><cite>they don't seem to have any kerning pairs with space.</cite></p>
      <p>Because it cannot work this way. In your example “A V”, you are correct, it might benefit from adjusted spacing, but that is cause by the combination of A and V itself, not by the letters standing with a space. You cannot solve this problem by kerning SPACE and V and A and SPACE. Because those 2 single kern pairs don't know the other letter involved. Should the first letter change, than the kerning of SPACE and V would be wrong again.<br>
      You would need to take all 3 letters into account, which is hardly possible considering all the letters that can stand on each side of the space.</p>
