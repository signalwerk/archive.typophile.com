    html: <p>Williams Caslon Text uses CALT to substitute different shorter-nosed f's before spaces, depending on what the letters are following the space. I also negatively kerned some of the space-letter combinations, like space V, space T. I think the triples involving the substituted f's work pretty nicely. This idea came from Charles Ellertson, if I remember rightly.</p>
