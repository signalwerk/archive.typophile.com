  html: |-
    <p>I was wondering how many of actually kern letters with space? Standard kerning can only get the letter-spacing right but what about the consistent spacing between words? I've checked a couple of fonts (from respected designers) but they don't seem to have any kerning pairs with space. Any thoughts? </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/word-sapcing_5503.png"></div><p></p>
