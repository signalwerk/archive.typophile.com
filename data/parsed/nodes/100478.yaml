      <p>&gt; You would need to take all 3 letters into account, which is hardly possible considering all the letters that can stand on each side of the space.</p>
      <p>“All the letters that can stand on each side of the space” come in exactly the same count as “all the letters that can stand on each side of the gap between two letter”.  So, in the worst-case scenario, you need to double the size of the kerning table.  (This ignores the fact that some pairs may be not kerned correct, as in <code>f+space+opendblquote</code> mentioned before — usually, there is little need to kern <code>f+opendblquote</code>.  So it has a chance to become more than 2× larger…)</p>
