    <p>can anybody tell me which font was used for the berlin fashion week 2006? <a href="http://www.berlin-fashionweek.com" title="www.berlin-fashionweek.com">www.berlin-fashionweek.com</a></p>
    <p>i already asked the design agency. they say that it’s the font “regular” in bold. </p>
    <p>“regular” is not the typestyle...it’s the name!?!?</p>
    <p>but i cannot find anything about this font. </p>
    <p>can anybody tell me something about this font or does anybody know the real name or a similar font?</p>
    <p>thanx...</p>
