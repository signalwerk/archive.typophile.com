    html: <p>If you do install ATM on Windows 2000 or XP, be aware that subsequently uninstalling ATM can result in complete lack of PS font support. The current system PS rasterisers are 'blackbox' software from Adobe, and are basically just the rasterising portion of ATM. Installing and then removing ATM from your system deletes the ATM rasterisers but does not restore the original system rasterisers.</p>
