    html: "<p>You are on OS X or OS 9?? Under OS X Adobe has installed several fonts under: Library/Application Support/Adobe/Fonts/Reqd/Base -- making them only available to Adobe Applications. Using Font Reserve I manually removed them, but was worried this might cause problems so put them back. If you move them and seem to have several successful days in a row, let me know too.</p>"
