    html: <p>Colin, <br> <br>Adobe apps have their own Font folders. Check your Illustrator and PhotoShop folders for a Fonts sub-folder, and also check <br> <br>C:\Program Files\Common Files\Adobe\Fonts <br> <br>You will probably find the Myriad fonts lurking in one of these places, indicating that they came bundled with the Adobe app. You can copy from this location to your Windows Fonts folder. <br> <br> <br>Eduardo, ATM is unnecessary on Windows 2000 and XP; there is built in system support for PS fonts, so they can be dropped into the Windows Fonts folder just like TT fonts.</p>
    html_clean: <p>Colin, <br> <br>Adobe apps have their own Font folders. Check your Illustrator and PhotoShop folders for a Fonts sub-folder, and also check <br> <br>C:\Program Files\Common Files\Adobe\Fonts <br> <br>You will probably find the Myriad fonts lurking in one of these places, indicating that they came bundled with the Adobe app. You can copy from this location to your Windows Fonts folder. <br> <br> <br>Eduardo, ATM is unnecessary on Windows 2000 and XP; there is built in system support for PS fonts, so they can be dropped into the Windows Fonts folder just like TT fonts.</p>
