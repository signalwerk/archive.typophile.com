    html: |-
      <p>Indeed…<br>
      We did see the rules on his site, however there is a much large issue of licensing concerned here. </p>
      <p>Mickey Rossi (aka subflux) is being very generous with the simple condition: send me a link to the work. Love it!</p>
      <p>However, since this is a digital replication of the original 'Stark Debonair' designed for press by VGC (Visual Graphics Corporation), who no longer exist as of the 80's, we are unsure as to whether we can legally use this font for a commercial magazine or branding project.</p>
      <p>Thus two questions remain!</p>
      <p>1) Does anyone know of the current rights holders for the VGC's type library?<br>
      2) Has anyone come across this 'digital replication' grey-area before?</p>
      <p>Thanks in Advance,</p>
      <p>F//W</p>
