    <p>Please help us identify this wonderful typeface!</p>
    <p>We think it could be a play on Donald Young's "Young Finesse"<br>
    (<a href="http://doyaldyoung.com/113_YF_Roman/113_YF_Roman.html" title="http://doyaldyoung.com/113_YF_Roman/113_YF_Roman.html">http://doyaldyoung.com/113_YF_Roman/113_YF_Roman.html</a>)</p>
    <p>But there's been a few instances where we have seen this used elsewhere, can anyone out there enlighten us of whether this is an existing typeface?</p>
    <p>Thanks heaps in advance,</p>
    <p>F//W</p>
