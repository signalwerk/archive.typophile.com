    html: <p>while comic sans is among my least favorite of faces and i readily agree that it is very often misused (i saw it in a wedding announcement!) my beef that i have against the ban comic sans people is that they use the image of the creator of the font in their propoganda. i hate comic sans (it makes me gag) but we should respect the person who created it and not deface his image. i'm staging a personal boycot of the face, however. <br>there are some who want to ban Bookman Swash and in effect it has been since it's fairly hard to find (i know where to purchase it, ya don't hafta point it out to me) but personally there's one face that i love to see used (maybe it's because its used all over the place in my church on books, music, etc.) Anyhow, there's my 2� worth. <br>(and who didn't catch that typo on ihatehelvetica.com? there's an apostrophe in the word "world's")</p>
