    html: |-
      <p>The description that Bert gives is how I've always heard it -- for UK English. Here in the States, we tend to always use periods. (If it's an abbreviation, it's an abbreviation; and therefore it gets a period, regardless of the letters.)</p>
      <p>However, there is an inconsistency in Bert's example: 'Saint' and 'Street' both end in the letter 't'. So you can use that UK rule to argue that both should be abbreviated without a stop.</p>
      <p>-- K.</p>
