      <p>I've also seen it used informally in Canada and the U.S., but that doesn't make it "right"....  </p>
      <p>There's also the situation where some uses of "Saint" vs "St." (note the period) are specified:  in Canada, for example, the capital of Newfoundland and Labrador is St. John's, whereas the city in New Brunswick is Saint John.</p>
