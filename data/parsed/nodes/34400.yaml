      <p><cite>The way it is (or should be)...</cite></p>
      <p>That is what Bringhurst, <em>The Elements of Typographic Style</em>, says and he refers to the Oxford house style. However, when I look at the (<a href="http://dictionary.oed.com/entrance.dtl" rel="nofollow">online</a>) Oxford dictionary, what I can see is that they themselves write "St." with a period.</p>
