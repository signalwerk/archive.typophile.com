    <p>Hi,</p>
    <p>What is the correct abbreviation of the English (UK) word "saint"? Different on-line dictionaries seem to give different results:</p>
    <p><a href="http://dictionary.reference.com/browse/saint" title="http://dictionary.reference.com/browse/saint">http://dictionary.reference.com/browse/saint</a></p>
    <p><a href="http://dictionary.cambridge.org/define.asp?key=69492&amp;dict=CALD" title="http://dictionary.cambridge.org/define.asp?key=69492&amp;dict=CALD">http://dictionary.cambridge.org/define.asp?key=69492&amp;dict=CALD</a></p>
    <p>Isn't "St" for "Saint" and "St." for "Street"?</p>
    <p>Thanks for your help.<br>
    Aleksander</p>
