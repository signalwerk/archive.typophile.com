    html: "<p>The way it is (or should be): abbreviations that end with the last letter of the original word don't receive a stop (eg Saint &gt; St or  Doctor &gt; Dr); ones that don't, do (eg Street &gt;St. or  etcetera &gt; etc.).</p>"
