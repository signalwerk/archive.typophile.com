    html: |-
      <p>Chicago 15th says much the same (i.e. advocates spell out or put 'St.') at §§ 15.27-28, 15.32 and 15.35, which confirms this as usual US style.</p>
      <p>(Oxford) Hart's Rules §6.1.6 says "In English 'saint' is abbreviated as <em>St</em> (<em>St.</em> for 'street' is conventionally distinguished by having a full point)." Their "Oxford Dictionary for Writers and Editors" supports this. </p>
      <p>Evidence is stacking up for the "dot in America, not in Britain" concept. Working in UK academic journals publishing, I usually advocate the "dot if the abbreviation doesn't end with the full word's last letter" style mentioned above (and work on the assumption that the "t" in the abbreviation of "Street" is the first one and not the last one!)</p>
