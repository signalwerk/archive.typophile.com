      <p><cite>Saint &nbsp; when preceding a name, is spelt with a capital initial letter, and is shortened to St (no full stop in BrE though one is normal in AmE). The plural is SS or Sts , as in SS / Sts Peter and Paul .<br>
      (From Pocket Fowler's Modern English Usage in English Language Reference)<br>
      </cite></p>
