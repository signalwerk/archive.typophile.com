    html: |-
      <p>There is no inconsistency in Bert's example: The t in St (for Saint) is at the end of the full word, therefore no full stop; the t in Street is the first (not the last) t, therefore the full stop appears in order to show that there are letters missing in its place.</p>
      <p>Saint: St<br>
      Street: St.</p>
      <p>One might say, "well, then, saint should be S.t, to be consistent, showing that there are letters missing between the s and the t", but I would argue that it's obvious that it's an abbreviation, and since it has no final period, the missing letters must be in-between.</p>
      <p>Besides, can't all you typographers see the difference between the two ts in Street?</p>
