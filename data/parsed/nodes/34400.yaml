      <p>Chicago Manual of Style 14th edition (current is 15th) say's:</p>
      <p><strong>14.16 Names with Saint</strong><br>
      Saint is often abbreviated (St. , pl. SS. ) before the name of a Christian saint, but many prefer to spell the word out in text, abbreviating only where space is at a premium. </p>
      <p>etc.</p>
      <p><strong>14.22 Addresses</strong> may be abbreviated in such closely set matter as lists or tables, especially state names and the words mentioned above as spelled out in text:<br>
        Ave., Blvd., Bldg., Ct., Dr., La., or Ln., Pkwy., Pl., Rd., Sq., St., Terr., N., S., E., W. (before street name).</p>
