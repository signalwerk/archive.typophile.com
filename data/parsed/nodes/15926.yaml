    date: 2005-10-31T16:44:00
    date_raw: 31 October 2005 - 4:44pm
    votes: 0
    html: |-
      <p>Nick,<br>
      there is only one alias.dat file, so that's the one to monkey with. (Tip: copy the original alias.dat, and rename it somehing like "aliasdatsafe".) I've got a couple of generations of FontLab running at the moment, hence any confusion about location. and at a certain point the app started to use a folder in the User/Library/Application Support directory.</p>
      <p>If your dotlessi doesn;t have its Unicode index, that shouldn't matter for this exercise. You need to make sure to request this:<br>
      ...e+dieresis dotlessi+grave dotlessi+acute dotlessi+circumflex dotlessi+dieresis,n+tilde...</p>
      <p>If you ask for the "i", that's what FL is going to use; it's not smart enough to use the fotlessi. (I also create a dotlessj glyph which is referenced when making the jcaron and jcircumflex glyphs.)</p>
      <p>Best, c</p>
