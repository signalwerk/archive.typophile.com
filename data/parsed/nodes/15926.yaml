    html: |-
      <p>Nick,<br>
      thing is... When you make an "iacute", what you get is "i" + "acute". The "i" has its dot up there to begin with. Try this:<br>
      Create the dotlessi glyph.<br>
      Glyph / Generate Glyphs...<br>
      Then in the field ask for dotlessi+acute.<br>
      Voila!</p>
      <p>There is a file on you hard disk which is used to build glyphs. It is called "alias.dat", and you can use it to define your glyph-generation rules. So, you can start with your Eth by having the following "recipe" in your alias.dat: Eth D+hyphen</p>
      <p>That will copy the outlines from the D and the hyphen, which you can then decompose and tweak to get what you want.</p>
      <p>Hope that was helpful, c</p>
