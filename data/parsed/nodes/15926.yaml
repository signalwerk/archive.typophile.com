    <p>I finally got some time to work with the latest release of FontLab, and encountered a problem. When I used the Generate Glyph function, everything worked fine/as usual <em>except</em> that the accented lowercase i composite characters used the regular i instead of the dotless i. The latter is named <strong>dotlessi</strong> and is mapped to Unicode #0131, so I'm puzzled: did I do something wrong, or is this a bug in the new program?</p>
    <p>Furthermore, when I tried to logo onto FontLab's website at 13:15 on 30 October, I got this message...</p>
    <p>DB function failed with error number 1016<br>
    Can't open file: 'mos_session.MYD'. (errno: 145) SQL=SELECT session_id FROM mos_session WHERE session_id=MD5('24ec44e760cb285c7105a32d1579fa56')<br>
    SQL =<br>
    SELECT session_id FROM mos_session WHERE session_id=MD5('24ec44e760cb285c7105a32d1579fa56')</p>
    <p>Curiouser and criouser...</p>
