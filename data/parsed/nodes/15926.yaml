    html: <p>Thanks for all the input. I checked the OPTIONS tab (which I probably should have done in the first place) and found that the common files for all FontLab applications on my computer were in a non-existent folder under Documents and Settings. I just changed the path to the existing FL4 folder, and things work fine.</p>
