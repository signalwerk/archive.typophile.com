      <p><em>Please describe what exactly you did, step-by-step</em></p>
      <p>Thanks, Adam. After adjusting metrics, etc., I selected <em>Generate Glyphs</em>, then chose the file I had been using (successfully at all times) with FontLab 4.6. The contents of the file are...</p>
      <p>Agrave,Aacute,Acircumflex,Atilde,Adieresis,Aring,Ccedilla,Egrave, Eacute,Ecircumflex,Edieresis,Igrave,Iacute,Icircumflex,Idieresis, Ntilde,Ograve,Oacute,Ocircumflex,Otilde,Odieresis,Scaron,Ugrave, Uacute,Ucircumflex,Udieresis,Yacute,Ydieresis,Zcaron,agrave,aacute, acircumflex,atilde,adieresis,aring,ccedilla,egrave,eacute, ecircumflex,edieresis,igrave,iacute,icircumflex,idieresis, ntilde,ograve,oacute,ocircumflex,otilde,odieresis, scaron,ugrave,uacute,ucircumflex,udieresis,yacute,ydieresis,<br>
      zcaron (spaces have been added to keep the above string from flying off the page).</p>
      <p>As I said, there was a character named <strong>dotlessi</strong> and it was mapped to Unicode #0131, as it had been in the past, but the generated glyphs used the regular lowercase i -- not a problem to decompose the character and delete the dot, but a minor annoyance and a sort of puzzlement. Re: Chester's comments -- there IS an <strong>alias.dat</strong> file in my old FontLab 4.6 folder under <strong>Mapping</strong>, but there is no such folder nor file in the FL5 folder. Do I need to copy and paste some files?</p>
