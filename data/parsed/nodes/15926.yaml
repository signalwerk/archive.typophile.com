    html: <p>i think there are some screwy combos in the alias.dat file, i think this is one of the more frequent ones that users will encounter. it's easy enough to change the alias file, as outlined above, but some combos should definately be fixed. i guess the best thing to do would be to contact FontLab directly concerning screwy automatic composites.</p>
