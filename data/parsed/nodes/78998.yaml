  html: |-
    <p>I am creating a monospaced monoheight display font were the kerning distance and leading height are identical. The problem I am having, is that when I test the font in InDesign I do not have a simple default way of getting the font leading to be identical to the kerning. This is critical as some of the ligatures are vertically oriented and connect glyphs from two or more lines.</p>
    <p>The Font Information is as follows:</p>
    <p>UPM size: 320</p>
    <p>Ascender: 320 on most glyphs and 420 on the vertically oriented ligatures</p>
    <p>Descender: 0  on most glyphs and -100 on the vertically oriented ligatures</p>
    <p>Line gap: 20  (to match the 20 for kerning)</p>
    <p>Safe zone top: 420</p>
    <p>Safe zone bottom: -100</p>
    <p>Caps height: 320</p>
    <p>xheight: 320</p>
    <p>Thank you in advance for your help</p>
