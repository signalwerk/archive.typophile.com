      <p>Thank you for the suggestions oldnick and Thomas. </p>
      <p>Reading the link I got the crazy idea to lower the baseline by 20 so that the leading might be identical to the sidebearings when set to solid set. I hope. Will have to try it on Monday. </p>
      <p>The reason I do not set the UPM size to 1000 is that the math gets too complicated for me. The xheight and Caps height are the same because the font only has monoheight caps with no descenders other than the vertically oriented ligatures.</p>
