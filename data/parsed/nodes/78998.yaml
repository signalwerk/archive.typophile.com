    html: |-
      <p>Besides whatever you do with your vertical metrics, InDesign's auto-leading is 20% of the point size. So with a 320-unit em square, that would be 64 units.</p>
      <p>You might also see this thread: <a href="http://typophile.com/node/69582" title="http://typophile.com/node/69582">http://typophile.com/node/69582</a></p>
      <p>Also, you use the word "kerning" where most of us would say "sidebearings" which are a rather different thing....</p>
      <p>Cheers,</p>
      <p>T</p>
