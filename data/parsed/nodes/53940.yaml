  html: "<p>On p. 34 of Jan09 commarts, John Berry talks about Doctorow's use of acronyms and letter/number combos as being natural: \"They're part of the flow, not an interruption of it.\" But when typesetting the pages, John doesn't use small caps, so the acronyms stand out and visually interrupt the flow of text. So I wonder if someone could clarify.</p>"
