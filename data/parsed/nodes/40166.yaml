    <p><strong>Recently, I went on a complete shopping spree for type.</strong></p>
    <p>The two online destinations that I kept coming back to were <a href="http://www.vllg.com" rel="nofollow">Village</a> and <a href="http://www.fountain.nu" rel="nofollow">Fountain</a>, due to their pricing, tight selection, usability and general value. H&amp;FJ is, of course, great, but I feel like I have memorized their entire catalog already and they're a little pricey.</p>
    <p>Does anyone know of anything new and comparable that I am unaware of? The huge sources (FontShop, Veer, Linotype, etc.) tend to overwhelm and are difficult to shop.</p>
    <p>Any suggestions? </p>
    <p>Thanks,</p>
    <p>Sam</p>
    <p>PS Some other close runner ups included: Dalton Maag, Emigre, House Industries, Typotheque, Underware, and OurType.</p>
    <p>* I ended up buying Omnes, Apex Sans and Pill Gothic, if anyone was interested.</p>
