    <p>You may have noticed this already, but I thought I better post it here anyway. Following the redesign of the mother-page of the BBC News, the <a href="http://www.bbc.co.uk/arabic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">BBC Arabic</a> launched their redesigned website. It is probably one of the first, and certainly the biggest site yet to use webfonts – Arabic webfonts that is. It uses a custom version of Nassim by Titus Nemeth. The typeface was painstakingly optimized for screen and for web. Hinted by Thomas Grace and mastered into webfonts by Tim Ahrens.</p>
    <p>You can read more on <a href="http://Titus&amp;#039; blog" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Titus' blog</a>.</p>
    <p>We will be releasing Nassim through Rosetta Type Foundry this year, see <a href="http://rosettatype.com/Nassim">http://rosettatype.com/Nassim</a> .</p>
    <p>Few pictures:</p>
    <p><img src="/sites/default/files/old-images/Nassim_BBC-Arabic_1_3965.jpg"></p>
    <p><img src="/sites/default/files/old-images/Nassim_BBC-Arabic_2_4305.jpg"></p>
    <p><img src="/sites/default/files/old-images/Nassim_BBC-Arabic_4_5086.jpg"></p>
