      <p>Thanks John for the clarification. I am on a pretty recent Windows version, but have not seen kerning of quotes against Arabic in any implementation on Windows, including IE9.</p>
      <p>On the other hand, as Karsten Lücke points out, there is good news from Google that reacted swiftly to the issues with GPOS and GSUB support.</p>
      <p>Their updated spec now reads:<br>
      <cite>Now we support GSUB/GDEF table but haven't shipped to Chromium yet.<br>
      Now we support GPOS but haven't shipped to Chromium yet.</cite></p>
      <p>tn</p>
