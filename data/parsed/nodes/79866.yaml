      <p>Titus: <em>The font files render well with Uniscribe as it has the most complete implementation of "complex script" support, though not perfect either as marks such as quotes do not kern against RTL glyphs.</em></p>
      <p>That may depend on the operating system used, rather than on Uniscribe. There is a wrapper in recent versions of Windows that is supposed to roll common punctuation glyphs into runs of adjacent text, rather than imposing a glyph run break at script boundaries or direction changes. I have not tested this with Arabic though.<br>
      _____</p>
      <p>Here is now Nassim is looking in the new IE9 with DWrite rendering, with subpixel spacing and positioning, and y-direction smoothing.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/nassimie9_4014.png"></div><br>
      .<br>
      [DWrite also has its own shaping engines, so does not use Uniscribe. In theory, the Uniscribe and DWrite shaping engines should produce identical results, but I did notice one discrepancy in WPF (the predecessor of DWrite) so will need to test this in IE9.]<p></p>
