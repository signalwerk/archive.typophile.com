      <p>Hi Hrant,</p>
      <p>thanks for your positive feedback. The spacing issue you raise is spot-on, but not related to the font, but the only partial OpenType support for the Arabic script on the Mac OS and/or browser used. Windows users don't have this issue as you can gather from the below screen-grab of FF4b on Win7:</p>
      <p><img src="/sites/default/files/old-images/BBCNassim_win7_3524.PNG"></p>
      <p>There are numerous browser/OS combinations that have similar problems, most notably the flat-out rejection of Google's Chrome of fontfiles containing GPOS or GSUB tables. There is a curious note in the developer's spec noting that:</p>
      <p><cite>Some languages such as Indic/Thai/Arabic need GSUB/GDEF/GPOS support. Probably we should support them whenever necessary.</cite></p>
      <p><a href="http://code.google.com/p/ots/wiki/DesignDoc">http://code.google.com/p/ots/wiki/DesignDoc</a></p>
      <p>The font files render well with Uniscribe as it has the most complete implementation of "complex script" support, though not perfect either as marks such as quotes do not kern against RTL glyphs.</p>
      <p>The technical challenges of "complex script" development attain a different level of complication on the web were user setups and rendering implementations are ever more unpredictable than for desktop development. Also, they are largely undocumented and a fair amount of work is trial and error. If these are exciting new days for Latin-centred typography as it jumps to the web, the work on non-Latin webfonts is a pioneering endeavour.</p>
      <p>For the time being, all we are able to do is develop our fonts to spec and as technically sound as possible, provide updates were the situation changes and hope for browser and OS developers to catch up with their support for non-Latin scripts.</p>
      <p>tn</p>
