  - id: 57022
    user: null
    date: null
    date_raw: null
    votes: null
    html: "<p>Hi Zara! <br> <br>You're in luck! I first came in contact with these types of letters at Typecon last year as the folks from Timeless Treasures had an entire collection of pin-backed ceramic letters that John Downer informed me were used for department store marquees in the 40s and 50s which were in the front of the store to guide shoppers to featured specials, etc . . . <br> <br>Anyhow, Joan was kind enough to loan me some of these letters to turn into typefaces. The first result of this effort is a new freeward font called 'Featured Item' check it out at: <a href=\"http://www.fontdiner.com\" target=\"_blank\">http://www.fontdiner.com</a> <br> <br>Beyond that, I have another set of letters Joan loaned me which were grossly incomplete but very cool looking. A few eBay searches later and I found the originals! Turns out they were no for store signage but as previously suggested in this post, were for home theater titling boards. . . . A great find at $9.99 <br> <br><a href=\"http://cgi.ebay.com/ws/eBayISAPI.dll?ViewItem&amp;item=3853050776\" target=\"_blank\">http://cgi.ebay.com/ws/eBayISAPI.dll?ViewItem&amp;item=3853050776</a> <br> <br>Anyhow, one thing that makes these letters so sweet is that they are very unique type styles that have essentially disappeared into history since they were in essence never cast by a foundry and only exist in this format for this purpose by the original manufacturers. <br> <br>Best, <br>Stuart :D</p>"
    html_clean: "<p>Hi Zara! <br> <br>You're in luck! I first came in contact with these types of letters at Typecon last year as the folks from Timeless Treasures had an entire collection of pin-backed ceramic letters that John Downer informed me were used for department store marquees in the 40s and 50s which were in the front of the store to guide shoppers to featured specials, etc . . . <br> <br>Anyhow, Joan was kind enough to loan me some of these letters to turn into typefaces. The first result of this effort is a new freeward font called 'Featured Item' check it out at: <a href=\"http://www.fontdiner.com\" target=\"_blank\" class=\"link-external\">http://www.fontdiner.com</a> <br> <br>Beyond that, I have another set of letters Joan loaned me which were grossly incomplete but very cool looking. A few eBay searches later and I found the originals! Turns out they were no for store signage but as previously suggested in this post, were for home theater titling boards. . . . A great find at $9.99 <br> <br><a href=\"http://cgi.ebay.com/ws/eBayISAPI.dll?ViewItem&amp;item=3853050776\" target=\"_blank\" class=\"link-external\">http://cgi.ebay.com/ws/eBayISAPI.dll?ViewItem&amp;item=3853050776</a> <br> <br>Anyhow, one thing that makes these letters so sweet is that they are very unique type styles that have essentially disappeared into history since they were in essence never cast by a foundry and only exist in this format for this purpose by the original manufacturers. <br> <br>Best, <br>Stuart :D</p>"
