    votes: null
    html: <p>It looks like the A and 4 are reversed, and maybe one of the Zs. <br> <br>My guess is that Hrant is on the right track, and that they are for photographic titles, in films or for slides. <br> <br>The magnets could act as spacers, so you can create a nice drop shadow. <br> <br>I've seen a similar style of art deco lettering used for titling in a 35mm colour slide show (but made out of a thick white material). The slides dated from the mid '50s. <br> <br>The appeal of this "Broadway" kind of Deco style at that late date would be because of its ease of manufacture.  <br> <br>While there were commercial lettering kits available, it's the kind of project you would find in Popular Mechanics magazine. Or maybe even an amateur photography magazine. <br> <br>Was your Grandad a bit of a handyman, Zara? Did he make these himself? Did he have the photography bug, too?</p>
