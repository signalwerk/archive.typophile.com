    html: <p>&gt;There is no type without sidebearings. <br> <br>That's a bit anal. <br> <br>Sure, Letraset and Phototypositor (eg VGC filmstrip) had sidebearing indications, but most typographers who used those systems, good or bad, ignored them and spaced by eye. <br> <br>Now you may not like the results, but can you really say that those technologies weren't typesetting?</p>
