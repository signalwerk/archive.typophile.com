    html: <p>Perhaps this is a precursor to the black signs with white plastic letters that you see in corporate lobbies, usually with messages like "Acme Corp. welcomes Zara Evens." <br> <br>The magnets would go on the back of black metal board to hold the letters in place. The whole thing would then slide into some kind of display stand, or rest on an easel.  <br> <br>Just a guess, though. Very cool find!</p>
