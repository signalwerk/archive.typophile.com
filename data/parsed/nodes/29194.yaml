    html: |-
      <p>See the FLS5 Manual, p.241:<br>
      <cite>Underline [Position]: This is the position of the middle of the underline line in your font<br>
      Thickness: This is the thickness of the underline line.</cite><br>
      [They go into the post and CFF table of an OT font.]</p>
      <p>As to Strikeout Position and Thickness, these don't seem to be mentioned in the manual, but obviously it's the same for them.<br>
      [These go into OS/2 table of an OT font.]</p>
      <p>I'd make Underline as thick as the 'underscore' glyph, and Strikeout as thick as 'endash'/'emdash', and position them according to these two reference glyphs. However, I am not aware of applications that actually use these values. Has anybody made some tests?</p>
      <p>Karsten</p>
