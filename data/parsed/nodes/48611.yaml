    <p>Hi all,</p>
    <p>I am working on a logo type for a new product company that could use some feedback. It is partnered with a mark that I am not including since the type should stand on its own as well. The idea is to partner soft curves with hard functional lines and have both interesting positive and negative space.</p>
    <p>Since I tweaked and made some of the individual letters, I want to be certain that things feel balanced and not like a random collection of different fonts. Kerning issues and the like are still being resolved too. Other suggestions for sprucing/sexing it up or whatever are also appreciated!</p>
    <p>Thanks in advance,<br>
    Anjel</p>
    <p></p><div class="imageWrap"><img src="/files/waterbox_5413.png"></div><p></p>
