      <p>I like the W but maybe squeeze it in a tad. I’d go with a more traditional A like in Zevbiz’s example and tighten up the X so that it reads better. Another idea for the X would be to turn a + symbol if you’re going for a handmade character appeal.</p>
      <p>You might also try adding a thin stroked box around the type to further iterate the ’box’ theme. </p>
      <p>See below.</p>
      <p>I do rather fancy the boxy look and the subtle gray color though. Nice start.</p>
      <p>The font in these is Gotham HTF Medium weight and I rotated the + symbol 45°.</p>
      <p></p><div class="imageWrap"><img src="/files/waterbox_3968.jpg"></div><p></p>
