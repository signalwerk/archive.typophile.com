      <p>Even though you want the logotype to stand on its own, the letterforms must still be sympathetic to the symbol. So, it’s hard to judge it true effectiveness without seeing it as a whole.</p>
      <p>Regarding the letters themselves: the crossbar on the A seems too high and the X is too wide.  The left and right half of the X should overlap, not just barely meet.  I think the W might be a touch too wide as well.</p>
