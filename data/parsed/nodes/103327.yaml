    <p>The rest of the fonts seem to be all different. In summary, I need help finding the following:<br>
    First name:<br>
    Date/City/length:<br>
    Year:<br>
    Weight/ounces:<br>
    Time:<br>
    "loving parents":</p>
    <p>Thank you and I hope I was specific enough!</p>
