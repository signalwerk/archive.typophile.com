    html: |-
      <p>It's great to see scratch work instead of tweaking - it's the best way to really grasp how letterforms work. I might advise working on this as a whole font (and submitting it to Typophile's critique forum) separate from this logo work; on the other hand you only need 7-8 glyphs to do this job, so maybe you can in fact do the logo first (and actually many fonts start life as a logo).</p>
      <p>I'm not sure what you mean by "having one stroke throughout". You probably mean expanding letterform skeletons, but -although that's instinctive- it doesn't really work, as it looks like you're realizing since you're having to do major adjustments, especially in your "a" and "k". It's better -although decidedly more difficult- to think of letters as black-white shapes, where what you're actually determining is the edge/border of the black-white. In fact on the computer what we actually do is define the border anyway, but the "skeleton" persists with us stubbornly; we have to bury the thing!  :-)</p>
      <p>Your new version is better. First thing I'd do is not bother with the small curve and resultant tiny aperture at the bottom-rights of "d" and "a" and the top-left of "p"; try just making those flat. The other problem is the "s" - almost always a tricky letter; it's hard to tell at this small size, but I think the bottom curve might be the only problem. Lastly, I might make the bottom bowl of the "a" slightly shorter (lower the top of that bowl).</p>
      <p>hhp</p>
    html_clean: |-
