      <p>Wow, great idea with the speech bubble! It would be nice if you could make it more noticeable (right now it isn't at all) without making the turning bars too cluttered.</p>
      <p>Looking at the PDF:<br>
      - Your idea for the "k" is interesting, and I think it can work if you make the curve bigger; and you should curve in the top of the stem-arm join too.<br>
      - The "s" can be rigid that like, but it's also pretty choppy in its curve transitions. It's a very difficult shape to get right, and it's not easy to verbalize how to possibly fix it. That said, you might be able to get away with leaving it mostly like this, but just improving the "internal" straight-to-curve transitions*: bottom-left of the top counter and top-right of the bottom counter.<br>
      - Since the bar-circle has to go left, I would align the bottom-center bar with the space between the "s" and the "p".<br>
      - Should the bars in the bar-circle be thicker?</p>
      <p>* Make the straight segment shorter and start the curve earlier.</p>
      <p>hhp</p>
