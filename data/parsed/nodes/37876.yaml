    html: |-
      <p>Hi David, firstly, I really like your branding work. I especially like your use of strong colours throughout your portfolio. </p>
      <p>As for critique, I think your typography could be cleaned up slightly. Here are a few thoughts that I had looking at your CV.</p>
      <p>Firstly, I would say there are too many different typefaces there. I would suggest using 2 at the most, but using 1 would be even better. To create hierarchy, use different colours (which you have) and weights within the typeface.</p>
      <p>Secondly, I would say the leading is slightly too loose and gappy. As a general rule, or starting point at least, I usually add 2pts to the font size for my leading. I.e. if my font size is 9ot, my leading will be around 11pts, but then play around with it until you are happy.</p>
      <p>Thirdly, I would say that in your bulleted lists, you should use "space before" and "space after" each point to create space instead of increasing the leading. This helps to keep each point together and easier to read.</p>
      <p>Also, in your contact details, the "p" is capitalised, and the rest aren't.</p>
      <p>In your portfolio, I would say that the reflections can be a little too strong in some of them and can distract from the work, which should be the main focus. </p>
      <p>Also, (and this is my last point, I promise), the text at the end of the sections is quite large and quite blocky. Maybe try to reduce the type size and maybe just have the headings in red and the body copy in black or a dark grey? I think the line width is perfect though.</p>
      <p>I think your work is great and you shouldn't have any problems finding work. A last little bit of advice, and this is speaking from personal experience, is to not take the first job that comes along. You have good skills and a hell of a lot of potential, so think about what job you want and chase that be patient, and the right job will come along.</p>
      <p>Hope this has helped? </p>
      <p>Good luck,</p>
      <p>Jem</p>
