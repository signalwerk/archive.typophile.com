    html: <p>It's probably just me who feels this way, as no one has mentioned it so far, but the line down the center of the bulk of your information seems to imply some sort of symmetry.  The symmetry is there for the most part treatment of text but not contact.  Instead of reading from top to bottom on the left and and then top to bottom on the right, my eye has the tendency to want to compare things, such as education vs experience, software vs freelance. Have you tried looking at it without the line?  I suppose the same goes for the text at the top--I don't really see a reason for the different colored grays. The four pieces of text at the top seem to be related and proving the same point more or less, and I wonder if they could be moved closer together, though I am not sure what effect that would have on the rest of the layout.</p>
