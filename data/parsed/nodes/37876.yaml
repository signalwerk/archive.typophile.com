      <p>Having to say you are passionate about design seems a little redundant. Isn't that implied? Would you expect resumes from people that were 'eh...I'm so-so about design'? ;0)</p>
      <p>As such, I'd suggest maybe omitting the upper two right paragraphs. </p>
      <p>Overall, I like the layout a lot. Some suggestions:</p>
      <p>Your red heads are 'floated' to the left, but the grey ones float above the items. Seems a little inconsistent.</p>
      <p>While I like the typefaces, the grey headings are a bit too decorative IMHO. I'd use the body text face for those. </p>
      <p>I'd also right-align the 'pmew' for your connect info.</p>
      <p>Spell QuarkXPress correctly (99% of students can't seem to spell that one ;o)</p>
      <p>I'm also not sure how important it is to list specific software. I know folks have differing opinions on that.</p>
