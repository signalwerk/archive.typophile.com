    <p>Hi all,</p>
    <p>I've just graduated from graphic design at teesside uni (in lovely middlesbrough uk). =)</p>
    <p>I have now (finally) found a studio apartment in London, Harringey (in case anyone is moving to london don't hesitate to mail me with questions...it took me nearly 2 months to find something not too expensive and still in a nice area..so I might have some tips in case you need them).</p>
    <p>Anyway, I'm going to start looking for a graphic job asap but would like some feedback on my cv first.</p>
    <p>Also if anyone can be bothered I would greatly appreciate it if you could look at my portfolio as well for some feedback. It's a bit of a download but with the speeds nowadays I'm sure it won't really be a problem.<br>
    You can find it <a href="http://davdesign.net/work.html" rel="nofollow">here</a>.</p>
    <p>Thank you so much for your time and help!<br>
    dav2.</p>
    <p>p.s. I have looked at other cv's on the typophile forums (and elsewhere) and there might be parts of text that are similar to others. I used these for the feedback that was given to them, but everything in the cv is definitely related to what I do/want to be doing and I have adapted everything to how I would say it. Thought I'd just let you know. English is also not my first language so that's why I had to do some research into writing an english cv.</p>
