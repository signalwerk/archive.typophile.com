    <p>“Type-one : discipline and progress in typography”, R Klanten et al., ed.</p>
    <p>Well, it’s not really that new (it’s from 2004) which makes me wonder why I hadn’t heard anybody mention it before. One of my students brought it to class the other day, and it’s really a great collection of type design efforts - plus it’s very well-produced. A definite Buy Recommendation.</p>
    <p>Just for reference - not a plug for Amazon:<br>
    <a href="http://www.amazon.com/gp/product/3899550560/ref=sr_11_1/104-2497787-2534339?%5Fencoding=UTF8" title="http://www.amazon.com/gp/product/3899550560/ref=sr_11_1/104-2497787-2534339?%5Fencoding=UTF8">http://www.amazon.com/gp/product/3899550560/ref=sr_11_1/104-2497787-2534...</a></p>
    <p>hhp</p>
