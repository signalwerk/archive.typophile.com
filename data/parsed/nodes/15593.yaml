    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Kris Sowersby</strong></p>
    <p>Kris Sowersby is an independent type designer, typographer and graphic designer. Based in Wellington, the capital of New Zealand, he runs the <a href="/wiki/Klim" class="freelinking" rel="nofollow">Klim</a> Type Foundry. Three of his typefaces have been awarded <a href="/wiki/TDC" class="freelinking" rel="nofollow">TDC</a>2 awards. National in 2007, Hardys and Serrano in 2008.</p>
    <p>Kris has designed or collaborated on the following typefaces:</p>
    <p><strong>Retail</strong><br>
    </p><ul><br>
    <li><a href="http://www.klim.co.nz/feijoa_samples.php" title="KLIM / Retail / Feijoa Samples" rel="nofollow">Feijoa</a> (2007, a serif family for text, <a href="http://vllg.com/KLIM/Feijoa/mudTyper+Weights/" title="village /// vllg.com" rel="nofollow">Village</a>).<br>
    </li><li><a href="http://www.klim.co.nz/national_samples.php" title="KLIM / Retail / National Samples" rel="nofollow">National</a> (2007–2009 a sans serif family, <a href="http://vllg.com/KLIM/National/mudTyper+Weights/" title="village /// vllg.com" rel="nofollow">Village</a>).<br>
    </li><li> <a href="http://www.klim.co.nz/meta_serif.php" title="KLIM / Retail / Meta Serif" rel="nofollow">FF Meta Serif</a> (2007, Serif counterpart to FF Meta, designed with <a href="/wiki/Christian%20Schwartz" class="freelinking" rel="nofollow">Christian Schwartz</a> and <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a>, <a href="http://metaserif.com/" rel="nofollow">microsite</a>).<br>
    </li><li> <a href="http://www.klim.co.nz/newzald_samples.php" title="KLIM / Retail / Newzald" rel="nofollow">Newzald</a> (2008, a serif family for text, <a href="http://vllg.com/KLIM/Newzald/mudTyper+Weights/" title="village /// vllg.com" rel="nofollow">Village</a> ).<br>
    </li><li> <a href="http://www.klim.co.nz/galcop_samples.php" title="KLIM / Retail / Galaxie Copernicus" rel="nofollow">Galaxie Copernicus</a> (2009, a reconsideration of <a href="/wiki/Plantin" class="freelinking" rel="nofollow">Plantin</a>, designed with <a href="/wiki/Chester%20Jenkins" class="freelinking" rel="nofollow">Chester Jenkins</a>,  <a href="http://vllg.com/Village/GalaxieCopernicus/mudTyper+Weights/" title="village /// vllg.com" rel="nofollow">Village</a> ).</li></ul><p></p>
    <p></p>
    <p><strong>Custom</strong><br>
    </p><ul><br>
    <li><a href="http://www.klim.co.nz/custom_eliza.php" title="KLIM / Custom / Eliza" rel="nofollow">Eliza</a> (2003).<br>
    </li><li><a href="http://www.klim.co.nz/custom_rewards.php" title="KLIM / Custom / Rewards" rel="nofollow">Rewards</a> (2006).<br>
    </li><li><a href="http://www.klim.co.nz/custom_chisel.php" title="KLIM / Custom / NZ Rugby Chisel" rel="nofollow">NZ Rugby Chisel</a> (2006, The All Blacks Typeface).<br>
    </li><li> <a href="http://www.klim.co.nz/custom_hoko.php" title="KLIM / Custom / Hokotohu" rel="nofollow">Hokotohu</a> (2007, A typeface for the Moriori).<br>
    </li><li> <a href="http://www.klim.co.nz/custom_vic.php" title="KLIM / Custom / Victoria Sans &amp; Serif" rel="nofollow">Victoria Sans and Serif</a> (2007, Custom typefaces for Victoria University).<br>
    </li><li><a href="http://www.klim.co.nz/custom_hardys.php" title="KLIM / Custom / Hardys" rel="nofollow">Hardys</a> (2008, a typeface for  Constellation Wines Australia).<br>
    </li><li><a href="http://www.klim.co.nz/custom_methvenflow.php" title="KLIM / Custom / Methven Flow" rel="nofollow">Methven Flow</a> (2008, a typeface for Methven).<br>
    </li><li><a href="http://www.klim.co.nz/custom_serrano.php" title="KLIM / Custom / Serrano" rel="nofollow">Serrano</a> (2008, a typeface for The Bank of New Zealand).	</li></ul><p></p>
