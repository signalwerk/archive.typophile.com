      <p>VAG Rounded Black (maybe with some extra fatness thrown in for good measure). There are other similar fonts as well.</p>
      <p> And no, there are no consistent terms. You'll sometimes see 'rounded' (usually to describe the strokes' ends), fat (generally descriptive), etc. etc.</p>
