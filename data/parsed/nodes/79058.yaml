    html: <p>I think the question is too general. There is so much variation between printers and, of course, paper. It's not a question of inkjet vs. laser, for example. A good inkjet printer using a good quality inkjet paper has negligible ink spread.</p>
    html_clean: <p>I think the question is too general. There is so much variation between printers and, of course, paper. It's not a question of inkjet vs. laser, for example. A good inkjet printer using a good quality inkjet paper has negligible ink spread.</p>
