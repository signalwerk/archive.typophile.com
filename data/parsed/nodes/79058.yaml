    html: <p>Thanks for your answers. I guess the upshot of it all is that using an inkjet printer doesn't "fix" the thinness of early fonts and that if I want a decent Bembo or Centaur, I'll need to shell out for a newer digitization rather than relying ink spread to make the late-80s Type 1 versions I have on old 3.5" disks look better.</p>
