    html: |-
      <p>Also, while the very earliest inkjet printers were crude dot-matrix printers, current ones print at resolutions similar to those of laser printers. As a result, the droplets of ink involved are small ones.</p>
      <p>As well, given that the printer converts font outlines to dots, normally if corrections for ink spread are required, dealing with them appropriately is more the responsibility of the printer designer than the font designer. One certainly can, by choice of typefaces, deal with any remaining uncorrected ink spread, just as people did in the letterpress era. But that's choosing faces with greater stroke contrast and lighter lines - not detailed adjustments to typeface outlines.</p>
      <p>There are just too many kinds of paper, and models of printer, out there for the font designer to effectively deal with this the way the designers of the newspaper legibility faces could deal with the technical problems of their era.</p>
      <p>And laser printer resolution, on the other hand, keeps going up... so designers have the freedom of treating printers as if they're magical devices, able to put exactly what is specified on the paper. This is great - once <em>that</em> problem is dealt with, type designers still have plenty of other things to worry about.</p>
