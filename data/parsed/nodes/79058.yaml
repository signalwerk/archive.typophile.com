  html: <p>I've recently been thinking about printing technology and was wondering if inkjet output (especially on uncoated paper) "needs" lighter outlines than a font for laser or imagesetter output might need. Certainly metal fonts were designed with ink spread in mind, so do computer fonts need the same kind of adjustment or is inkjet inkspread not that big a deal? As a side question, does the fact that inkjets have some spread that other output techs don't mean that fonts like the original digitizations of Centaur and Bembo which were always "too thin" in offset and laser output might actually be "right" when printed on an inkjet?</p>
