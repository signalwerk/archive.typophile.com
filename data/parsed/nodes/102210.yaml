    html: <p>Gabriel, you can simply change your keyboard layout in OS and try to type. You can also use a virtual keyboard to test it (native in Windows and available as separated app for Mac). It is also possible to create your own keyboard layout with the free Microsoft Keyboard Tool (Win) or SIL Ukelele (Mac).</p>
