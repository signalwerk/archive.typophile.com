    <p>I've added cyrillic characters to one of my opentype truetype fonts. This is my first time designing anything beyond Latin 1. How do I generate it in fontlab so that the cyrillic characters are included? These are the questions that I have:</p>
    <p>in Font Info&gt;<br>
    Encoding and Unicode&gt; I already have 1252 Latin 1 and Macintosh Character Set added here, I'm guessing add 1251 Cyrillic?<br>
    What about the Microsoft Character Set drop down menu? Do I leave that Western (Latin 1)?<br>
    What about the Mac script and FOND ID drop down menu? Do I leave that as Roman?</p>
    <p>in Font Info&gt;<br>
    Encoding and Unicode&gt; Custom [cmap] encodings&gt; Do I add anything here?</p>
    <p>in Font Info&gt;<br>
    Encoding and Unicode&gt; Unicode Ranges&gt; I'm guessing I check Basic Latin, Latin-1 Supplement and then Cyrillic?</p>
    <p>anything else I should change in the Font Info box?</p>
    <p>In Options&gt; Generating OpenType &amp; TrueType&gt; OpenType TT Encoding&gt; Do I change anything here before generating the font to support Cyrillic?</p>
    <p>What about Options&gt; General Options&gt; Unicode and OpenType?<br>
    Do I change anything else in Options?</p>
    <p>When I start to generate the font:</p>
    <p>I go to Codepages mode and at the top left hand corner near the Font Info box, in the next box it says Unicode (I'm guessing I leave that) and then the next box should say? MacOS Roman or  MS Windows 1252 Western or MacOS Cyrillic or MS Windows 1251 Cyrillic? I want the font to be Western but support Cyrillic.</p>
    <p>Anything else I should know before generating? Does anything change if the font is generated as Opentype Postscript?</p>
    <p>Thanks for any help!</p>
