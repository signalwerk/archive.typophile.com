      <p>The "FACTORY" font looks like <strong>Vladimir</strong> - (c) 1995 Ethan Dunham forthead design<br>
      (don't be confused with Vladimir Script which is a totally different font)</p>
      <p>A similar alternative you could modify by replacing /A with /a etc. is:<br><strong><a href="http://new.myfonts.com/fonts/fontbureau/fb-agency/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Agency FB Bold</a></strong> by Font Bureau</p>
