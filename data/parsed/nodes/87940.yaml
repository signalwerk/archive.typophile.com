    <p>Hello, I'm looking for a soviet-like font, in particular the one saying "FACTORY" in this poster:</p>
    <p><a href="http://i43.tower.com/images/mm113641234/farm-factory-reinterpretation-soviet-industrial-revolution-robert-c-allen-paperback-cover-art.jpg">Link to poster</a></p>
    <p>I am looking for this or a similar font, I specially like the way it mixes the lower-case A with the rest of upper case characters. I actually prefer a quality paid font than an medium quality free font, as I need this for a logo design.</p>
    <p>Thanks in advance for your help.</p>
