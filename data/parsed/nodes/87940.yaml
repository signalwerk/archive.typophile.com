      <p>The "FACTORY" font looks like <strong>Vladimir</strong> - (c) 1995 Ethan Dunham forthead design<br>
      (don't be confused with Vladimir Script which is a totally different font)</p>
      <p>A similar alternative you could modify by replacing /A with /a etc. is:<br>
      <strong><a class="freelinking external" href="http://new.myfonts.com/fonts/fontbureau/fb-agency/" rel="nofollow">Agency FB Bold</a></strong> by Font Bureau</p>
