      <p>To be clear, it's a custom typeface designed by Studio Makgill, exclusive for 'The Lollipop Shoppe' and, I assume, not available to sell.<br>
      More alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/crisafulli" rel="nofollow">Crisafulli</a> (not bad, a bit bold though), <a class="freelinking external" href="http://www.myfonts.com/fonts/thinkdust/hiruko-stencil" rel="nofollow">Hiruko Stencil</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/khaito-gengo/air-factory/stencil" rel="nofollow">Air Factory Stencil</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/coreyholms/ne10" rel="nofollow">Ne10</a>, <a class="freelinking external" href="http://www.hypefortype.com/muirside.html" rel="nofollow">Muirside</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/nimbus-sans/nimbus-stencil-d" rel="nofollow">Nimbus Stencil D</a>, <a class="freelinking external" href="http://www.ffonts.net/Eurofurence-Modified.font" rel="nofollow">Eurofurence Modified</a></p>
