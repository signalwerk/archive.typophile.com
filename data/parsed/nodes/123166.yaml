      <p>To be clear, it's a custom typeface designed by Studio Makgill, exclusive for 'The Lollipop Shoppe' and, I assume, not available to sell.<br>
      More alternatives: <a href="http://www.myfonts.com/fonts/t26/crisafulli" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Crisafulli</a> (not bad, a bit bold though), <a href="http://www.myfonts.com/fonts/thinkdust/hiruko-stencil" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Hiruko Stencil</a>, <a href="http://www.myfonts.com/fonts/khaito-gengo/air-factory/stencil" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Air Factory Stencil</a>, <a href="http://www.myfonts.com/fonts/coreyholms/ne10" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Ne10</a>, <a href="http://www.hypefortype.com/muirside.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Muirside</a>, <a href="http://www.myfonts.com/fonts/urw/nimbus-sans/nimbus-stencil-d" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Nimbus Stencil D</a>, <a href="http://www.ffonts.net/Eurofurence-Modified.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Eurofurence Modified</a></p>
