      <p>There's also <a href="http://www.dstype.com/index.php?id=11" class="link-external">Leitura</a> and <a href="http://www.dstype.com/index.php?id=11" class="link-external">Leitura Display</a> by Dino dos Santos. It's not a didone, like Bodoni, but it has a rather high contrast and the display cut is very expressive.</p>
