    html: <p>Don't know if this is close enough to Poster Bodoni for you (or bold enough), but speaking of Nick Shinn, his Scotch Modern has a nice display cut, but also a text size and even a "micro" cut that seems very readable even at seriously small sizes.<br><a href="http://www.shinntype.com/scotch.html">http://www.shinntype.com/scotch.html</a> (check the PDF)</p>
