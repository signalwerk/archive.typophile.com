    html: |-
      <p>Well, if you're after the boldness and high contrast you might want to take a look at this <a href="http://www.fontshop.com/fontlist/genres/didone_extra_bold/">collection</a>.</p>
      <p>Hoefler &amp; Frere Jones's <a href="http://www.typography.com/fonts/font_styles.php?productLineID=100004">Didot</a> with optical sizes is also worth a look.</p>
      <p>There's also <a href="http://www.dstype.com/index.php?id=11">Leitura</a> and <a href="http://www.dstype.com/index.php?id=11">Leitura Display</a> by Dino dos Santos. It's not a didone, like Bodoni, but it has a rather high contrast and the display cut is very expressive.</p>
      <p>I'm a sucker for <a href="http://www.veer.com/products/typedetail.aspx?image=SHT0000006">Bodoni Egyptian</a> (predominantly for text), by Nick Shinn, which would pair nicely with most other Didones.</p>
    html_clean: |-
