      <p>Vertical extended. Antique Tuscan No.9, an early wood-type design by William Hamilton Page 1869 digitized by HiH Retrofonts<br>
      <a href="http://www.myfonts.com/fonts/hihretrofonts/antique-tuscan-no-9/" title="http://www.myfonts.com/fonts/hihretrofonts/antique-tuscan-no-9/">http://www.myfonts.com/fonts/hihretrofonts/antique-tuscan-no-9/</a><br>
      Gothic Tuscan 9 by Wooden Type Fonts<br>
      <a href="http://www.myfonts.com/fonts/woodentypefonts/gothic-tuscan-9/" title="http://www.myfonts.com/fonts/woodentypefonts/gothic-tuscan-9/">http://www.myfonts.com/fonts/woodentypefonts/gothic-tuscan-9/</a><br>
      Also a somewhat thin Tuscan, Cowboy Serenade by Font Mesa<br>
      <a href="http://www.myfonts.com/fonts/fontmesa/cowboy-serenade/" title="http://www.myfonts.com/fonts/fontmesa/cowboy-serenade/">http://www.myfonts.com/fonts/fontmesa/cowboy-serenade/</a><br>
      As well as another thin wood type, Slinger by Canada Type<br>
      <a href="http://www.myfonts.com/fonts/canadatype/slinger/" title="http://www.myfonts.com/fonts/canadatype/slinger/">http://www.myfonts.com/fonts/canadatype/slinger/</a></p>
      <p>Don</p>
