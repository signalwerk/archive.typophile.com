  html: |-
    <p>Years ago I built a bitmap font (ttf outlines) which I would like to use for web embedding in html now.</p>
    <p>The font—like most bitmap fonts available back then—was set to be displayed at 8px size which in case of this font is visually roughly an equivalent of 12px Helvetica.</p>
    <p>My question is: </p>
    <p>Is there an easy way to change the font's metrics so that its px size would be more accurate when used in html? </p>
    <p>It still would only have one native size (as it is a bitmap font), but it wouldn't require displaying at 8px in order to be shown at its native 12px anymore.</p>
    <p>What metrics should I change?</p>
    <p>Thanks for any information.</p>
