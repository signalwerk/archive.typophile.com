    <p>Pretty sure I've made up my mind, but I was interested in what others thought.</p>
    <p>I'm using a nice big square-slab serif for a project and obviously went straight to Lubalin graph.As I looked around though I noticed a few other alternatives (all below). Any opinions on what I should go with, which aren't worth bothering with, favourites, etc?</p>
