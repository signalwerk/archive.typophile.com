    html: |-
      <p>Hi Jim,<br>
      all of them are quite classic. One could add <a href="http://www.fontshop.com/search/?q=Stymie" rel="nofollow">Stymie</a> and, of course, <a href="http://www.fontshop.com/search/?q=Clarendon" rel="nofollow">Clarendon</a> to this list.</p>
      <p>Lubalin Graph is Avant Garde’s slab soul brother, therefore <em>very</em> geometric. Nice for headlines, not easy – to unusable – in text.<br>
      Caecilia is at the other end of the gamut, having humanistic proportions: not so bold-faced, but more versatile.</p>
      <p>Not-so-often seen (can’t call them ‘hidden’) gems: <a href="http://www.myfonts.com/fonts/berthold/city-bq/familytree.html" rel="nofollow">City</a> by Georg Trump, <a href="http://www.myfonts.com/fonts/berthold/boton-bq/familytree.html" rel="nofollow">Boton</a>.</p>
      <p>Similar but fresher faces would be <a href="http://www.fontbureau.com/fonts/slab/Giza" rel="nofollow">Giza</a>, <a href="http://www.fontbureau.com/fonts/slab/Dispatch" rel="nofollow">Dispatch</a>. Or <a href="http://www.myfonts.com/fonts/agfa/silica/" rel="nofollow">Silica</a>, if you like to follow the Caecilia line.</p>
      <p>Check out this thread <a href="http://www.typophile.com/node/31962" rel="nofollow">on Serifa, Glypha, Egyptienne F and other slabs</a>, too.<br>
      F</p>
