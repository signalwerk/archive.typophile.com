      <p>Thanks Florian - Giza is a beauty, I shall be picking that bad-boy up.</p>
      <p>The face will be used for titling only, so Lubalin Graph was my first choice. I'd rejected Clarendon because of the bevelling on the slabs, and its current ubiquitous-ness.</p>
      <p>For my money Memphis and Rockwell are just too similar to Lubalin Graph to merit use on their own terms (certainly on my budgets) -- do you feel there's an argument in having all three in your arsenal, or just picking a favourite and aligning yourself to it. After all, even if I had the cash, I don't want to end up with 800 typefaces, when many of them are very similar...</p>
