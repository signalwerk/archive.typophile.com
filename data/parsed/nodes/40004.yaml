      <p>Pick the heaviest weight of Serifa or Glypha, tighten up the tracking a bit (1 point range tracking at 24 pt text, 2 pt tracking at 48) and voila--superb titling slab at zero cost (I assume you already have Serifa or Glypha if you have the Adobe or Bitstream catalogs handy). Rockwell will work too, I'm just not a huge Rockwell lover.</p>
      <p>If you're willing to buy new stuff, then yes, FB Giza is the slab titling bomb.</p>
