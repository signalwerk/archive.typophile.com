    <p>This type is from a children’s book that is in development, but the page designer didn’t tell the author the typeface before leaving the country — now they have to change some pages. The image is a bit pixilated, because I tried enlarging it. It’s like the sort of font I’d have in Part 14 of the Script Guide, but I don’t think it’s there.</p>
    <p>Anyone recognize this?  Thanks<br>
    - Mike</p>
