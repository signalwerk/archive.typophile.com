    html: |-
      <p>If you wanted to simulate the appearance of un-kerned metal-era type.<br>
      Or capture the flavour of unkerned shareware fonts.</p>
      <p>Or if you have a connected script font in InD, set to “optical kerning”.<br>
      Actually, there’s no way to “de-kern” a font in InDesign.<br>
      But you can do it in Quark, I believe, by using the kern edit table.</p>
