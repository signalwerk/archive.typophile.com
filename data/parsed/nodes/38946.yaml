      <p>&gt; Under what typographical circumstances would I wish to switch off kerning</p>
      <p>Complete lack of typographical knowledge might be one. A situation faced by 90% (I expect) of Word users.</p>
      <p>Seriously, programming code with fixed width characters is the only no-kerning application I can think of, and I suspect that fixed width characters are designed with no kerning table anyway.</p>
