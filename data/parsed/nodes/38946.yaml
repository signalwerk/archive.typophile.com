    html: |-
      <p>&gt;not changed due to document reflow issues </p>
      <p>At Typecon I talked to a guy from Microsoft who works on Publisher and he said that was the reason. I  argued that if it is on by default you can still turn it off if you want the old flow. He said more or less that Microsoft customers are too clueless to do this, even if there is a notice when the change is made.  And I said: by that reasoning you’ll never change to what you acknowledge is a better way. And he replied “go to hell.” Ok, he didn’t actually say that, but that was the message I got.</p>
