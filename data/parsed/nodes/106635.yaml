    html: |-
      <p>Signet, New York, 1973 lettering probably from Photolettering but I don't know the name off hand. [BTW the sexist cover illustration is by Frank Frazetta.]<br>
      F and underscore are probably custom artwork.<br>
      Sansita One by Pablo Cosgaya at Omnibus-Type could be edited to produce the lettering:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/SansitaOneInUse_5116.jpg"></div><br>
      <a href="http://www.fontsquirrel.com/fonts/sansita-one" title="http://www.fontsquirrel.com/fonts/sansita-one">http://www.fontsquirrel.com/fonts/sansita-one</a><br>
      <a href="http://www.omnibus-type.com/" title="http://www.omnibus-type.com/">http://www.omnibus-type.com/</a><br>
      It has an Open Font License which permits this.<br>
      Don<p></p>
