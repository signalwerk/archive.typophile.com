      <p>Interesting. Here is Salut, slanted 11 degrees, to match Sansita.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/SalutSlanted11deg_4542.jpg"></div><br>
      Terminals on r and s are close to the mystery lettering,  and it's a connected font.<br>
      Combine Sansita and Salut and we are starting to generate a match.<br>
      Don<p></p>
