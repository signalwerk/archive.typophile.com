      <div class="comment-spam-body"><p>This lettering for the cover of Dag Hammarskjold 's _Markings_ is apparently based on Eric Gill's _Alphabet Stone_,  A Roman alphabet, 1927 revised 1938. Here is a version carved on Hoptonwood stone,at Piggotts, North Dean, Buckingham, England, 1938. </p><div class="imageWrap"><img src="http://typophile.com/files/GillAlphabetStone1938SM_4762.jpg"></div><br>
      Another version <a href="https://repository.library.brown.edu/studio/item/bdr:401545/" title="https://repository.library.brown.edu/studio/item/bdr:401545/">https://repository.library.brown.edu/studio/item/bdr:401545/</a><br>
      Don<p></p>
      </div>
