    html: "<p>Hi Jim, <br> <br>In the top 10 sometimes when you click on the font name directly it takes you to the wrong page (clicking Digna leads to Nova etc) The zoom icon seems to work better. <br> <br>In addition to the small nav text, I'd increase the text size in the sidebar one level. Adding a touch of leading will lighten it up again. <br> <br>Generally, I'd suggest giving more information about your fonts. The following should be available from the individual font's page IMHO:  <br> <br>Poster showing (I like it!) <br>All the weights in the family stated explicitly <br>(Does it have small caps? Italic? DemiBold Condensed Expert Alternates?). <br>Maybe a character map. <br>PDF Specimen! <br>Information about the design <br>Info about the designer. I see their name, and I see a designers section... link em up! <br>Did I mention PDF Specimen? <br> <br>All of the above will help me to trust the quality of your fonts, and let me confirm it on my own. <br> <br>Cheers! <br>Randy</p>"
