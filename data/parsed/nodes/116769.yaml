    <p>"Lichtspielhaus" is a ultra condensed Lichtspiele Spin-Off with 8 weights. It still transports you back to a time where neon lights and marquee letters decorated cinema facades.</p>
    <p>There are 8 styles: Hairline, Thin, Light, Regular, Medium, Bold, Black and Heavy.</p>
    <p>"Lichtspielhaus" is the first part of a new Type Noir Quadrilogy.</p>
    <p>You can get it here if you like it:<br>
    <a class="freelinking external" href="http://www.myfonts.com/fonts/typocalypse/lichtspielhaus/" rel="nofollow">Lichtspielhaus at Myfonts</a><br>
    or <a class="freelinking external" href="http://lichtspielhaus3d.com" rel="nofollow">Lichtspielhaus3D.com</a></p>
    <p>(80% OFF  for a limited time)</p>
