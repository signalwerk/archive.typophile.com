      <p>As one that must do both for a living, I can feel the issue.<br>
      Unfortunately, in my experience, people tend to feel uneasy in front of skills that they perceive as unconnected. As if one diminishes the other.<br>
      That said, your kind of skill becomes essential if you manage to climb the ladder and work as art director or similar position (not my case, unfortunately ;-).</p>
      <p>P.S.: it should be "résumé" ;-)</p>
