      <p>Much thanks to both of you. </p>
      <p>Dannis- I really agree with you that Hoefler looks really great with Helvetica. </p>
      <p>Thomas- Unfortunately, keeping with the Helvetica is a requirement.</p>
      <p>So I propose a few options that perhaps you and anyone else could give me some feedback on:</p>
      <p>1. Yes, I assume most people will be reading this on screen, and personally, I find a sans body font to be easier on the eye when starring at a monitor. Is that just me? Is a serif better for lots of body text to be viewed on a screen?</p>
      <p>2. The digipak (a nicer cardboard alternative to a jewel CD case I had to sell my soul for in order to get purchasing to agree) has already been designed using Helvetica Neue Thin throughout and sent to the printer. So if I didn't feel a bit stuck with the Helvetica before, I definitely do now. </p>
      <p>On the other hand, considering that this is going to people that most likely don't know/care what a serif is as they still use various shades of Comic Sans in their e-mails, would I be able to get away with something else in the report... perhaps Whitney HTF light?</p>
      <p>3. I am totally pushing it with my textual babble, but this is the last one, I promise. On a somewhat irrelevant note, I have been considering going with a custom size (approx 10.5x9 or so) for best viewing through acrobat. I know a small handful will print this out, so is this a good idea or should I stick with the standard letter size?</p>
      <p>Once again, thanks for all your help and quick responses.</p>
