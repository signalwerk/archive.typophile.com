      <p>I was speaking solely to the body text. Personally, unless I couldn't make ends meet, I would reject doing a design job that required Helvetica for lengthy body text. Seriously. Can you tell me who to tell that they're an idiot to do an entire annual report in Helvetica Neue Light?</p>
      <p>For headings or even subheads, not a problem. But body text on screen? That's just user hostile. Unless of course, the point is that they don't want anybody to read it.</p>
      <p>Cheers,</p>
      <p>T</p>
