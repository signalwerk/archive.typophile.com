    <p>Hi everyone. I admit that I have been trolling these forums for quite some time but am only just now starting to act less like a voyeur and actually tap some of the amazing minds for a bit of help.</p>
    <p>I need a font that compliments Helvetica Neue Light. Stop rolling your eyes. I know that the having the entire font family should suit all my needs, but I am leaning towards incorporating another. Humor me.</p>
    <p>About the project:</p>
    <p>I am currently doing an annual report for the Dept. of Health and have been given creative freedom with the only stipulation being that I keep the Helvetica Neue theme determined by the previous designer. </p>
    <p>In the past, the reports have been a bit... drab. Oh really, you ask? Well, yes. </p>
    <p>It is a lot of text written by civil servants with no advertising background. This year we are going green (and trying to appear budget conscious) so we are only passing out CDs with PDFs as opposed to printing. I am going with a lot of rather bright colors- probably only because I secretly get a kick out of showing mortality rates in a bright purple or turquoise. Essentially, I am just looking to make it a bit more appealing albeit that with the time constraints and the amount of information, it is a bit like pouring syrup on cat litter and calling it pancakes. </p>
    <p>In summary:<br>
    - a lot of boring text (about 300 pages)<br>
    - must incorporate helvetica neue; should I use it for large headers with another typeface for the body, or use it for the large body of text and reserve the headers for an accent font?<br>
    - trying to make it a bit more energetic so am indecisive on referring back to the classic modern serif for the body.</p>
    <p>Any suggestions?</p>
