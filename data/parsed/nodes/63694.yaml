      <p>Either you have a choice, or you don't. If you don't have a choice... don't sweat it! much design work involves compromise. It's part of the limitations inherent to our craft, and we find ways to shine in spite of them (and occasionally because of them).</p>
      <p>Personally, I feel that readability of screen fonts is largely a function of particular size. I think the size is the first thing to consider. Some fonts look good 12px, but not at 13px. The proof is in the proof. </p>
      <p>Personally, I don't have a thing against mixing and matching, but I also respect the consistency approach. I would note that many well-designed web publications (nytimes, wsj) mix and match.</p>
