  html: |-
    <p>We are getting a logo redesigned, and when we asked the designer what font he used, he said "Untitled Regular" and attached a font file with nothing in it.  This should have been a warning. </p>
    <p>I got him to send a screenshot of the font page, and have attached that, but I have already tried Identifont, WhatTheFont, and any other font things I could find.</p>
    <p>After going through Identifont's "similar fonts", I have gotten this far:<br>
    It is not Camphor, but that's the closest I could find - the numbers are all wrong, and I think the font is thinner than Camphor.<br>
    It is not Frutiger Next - the j is rounder, the dots are round not square, the N might be wider, and the numbers don't match.<br>
    It is not Motiva - the ends of the C's are flat, not angled, and the numbers don't match.<br>
    It is not Proxima Nova - the numbers again, and also the shape of the lowercase a.</p>
    <p>Stumped.  Stumped stumped stumped.  If we get no answer, I am not sure what to do - request a different font on the logo?  I am 98% sure the designer does not know what font it is.  But we like the logo in the end.</p>
    <p>THANK YOU!<br>
    Sheri Cheng (new member and font-o-phile)</p>
