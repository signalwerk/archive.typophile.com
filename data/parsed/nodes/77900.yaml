  html: |-
    <p>Hi,<br>
    I'm trying to settle on fonts for a logotype that is a compound word (want to distinguish<br>
    the 2 parts of the word).</p>
    <p>Leaning towards a serif/sans mix but trick is finding a combo that has very similar x-height and shape, and lasting power for a logo.</p>
    <p>There are 2 sets of double "Os." This is where I'm stuck, to go with very round or very not round.<br>
    Also a lowercase "g" which is probably my favorite letter in double storey form.</p>
    <p>Overall look should be friendly, approachable.</p>
    <p>I'm leaning towards Minion combined with either Syntax, Meta, Profile or Whitney (the last of which<br>
    I don't own and will have to buy).</p>
    <p>Any opinions? </p>
    <p>Thanks!</p>
