    <p>The opening reception for "History in Small Spaces: Solo Exhibition of Large Format Archival Pigment Prints" was held in the Abingdon 12 gallery at 613 Hudson Street in New York City.  The crowd was thick with patrons, press, designers, design administrators, artists, architects; art collectors, art historians, members of art academia and archivists–it was an eclectic crowd.  Several private art foundations were represented. </p>
    <p>Viewing of the exhibit is by-appointment only through May 24,<br>
    please call 917 392 1417.</p>
