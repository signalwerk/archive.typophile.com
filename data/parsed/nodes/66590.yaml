    html: |-
      <p>There is limited support for this kind of thing. If you click on a user's name on the left of their post, you can "Track" the threads they've started or replied to.</p>
      <p>I'd like to see the links on the Track page go directly to the user's post in that thread.</p>
      <p> - Lex</p>
