    html: "<p>Gregory, <br> <br>I would consider not putting any references on your resume. Just put \"Ask for references\" or don't put anything at all. One of the reasons is that they may want 1, or they may want 3-5. You never know. <br> <br>Something else that might be helpful is to list what \"Skills\" you have. Mine says \"Proficient on Mac and PC platforms. Software knowledge includes Photoshop CS and Imageready CS, Illustrator CS, Freehand 10, Dreamweaver MX, InDesign CS, QuarkXPress 4, Pagemaker 6, Flash MX, HTML, CSS, Javascript, MS Office, familiar with 3D Max.\" Software knowledge is a big deal with businesses and if you don't list what you know they may toss your resume. <br> <br>I would also focus on your name and make it more graphically interesting. You are trying to seperate yourself from the rest, especially in graphic design. Maybe make a logo (made of just type) using your name. Something that people will remember you by. <br> <br>I would take off objective and put it on your cover letter. Cover letters are also important. They let you customize your objectives specifically to the company you are applying for. You have to do some research into the company. I have talked with many business owners and some have said they throw Below is a template for a cover letter: <br>___________________________ <br>(Insert Date) <br> <br>Your addressee</p>"
