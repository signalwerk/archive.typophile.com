      <p>First off, it's looking a lot better. Your new choices in typefaces are a lot more "boring", but they also work together much better, and you don't really want flashy type in your résumé anyway. It looks good now, although I'd still think hard about the division of text into two ragged columns, especially columns as widely spaced as the ones you have. I'm also not super-fond of the horizontal rules between job names and descriptions; it still feels like too strong a break.</p>
      <p>Second, it's time to proofread that bad boy. Typos abound: "mulitmedia applicaitons", "profficient", and using "rolls" for "roles" are ones that popped out at me. Also, it's "BBEdit" and "InDesign CS". InterCaps are annoying, but there are right ways and wrong ways to use them, so better double-check your app names to make sure you have it right.</p>
      <p>Other than that, it's looking good!</p>
