    <p>Ok, iam finishing school in May so iam trying to rap up my resume'. <br> <br>Iam unsure if this is to over designed but ive seen some nice resumes that were designed including samples of their work so i thought id try something like that.  <br> <br>I took a class on communication and my teacher suggested to design it how you like but to make sure it communicates to the reader clearly. <br> <br>I know that some of you all may look at resumes all day or have way more experience with them so i just wanted some feedback outside of my class. <br> <br>btw this is not nerely finished just a mock up  <br> <br>Thanks, <br> <br>Greg</p>
