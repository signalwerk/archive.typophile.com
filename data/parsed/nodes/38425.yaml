    <p>Hi,</p>
    <p>After four years of happy working with LeMondeSans accompanying LeMondeJournal in a business mag I thought it's time for a change.</p><div class="imageWrap"><img src="http://typophile.com/files/LeMonde_4106.gif"></div><p></p>
    <p>Ideal candidate to stand in for LeMondeSans should:</p>
    <ul>
    <li>have at least 3 font weights (4-5 are most welcome),</li>
    <li>have an accompanying condensed family for use in short portions of texts in infographs (not a must),</li>
    <li>cover variety of functions: comfortable reading in circ. 8-9 pt in sidebar texts, subheads in body in 12-14 pt, sidebar titles in over 18 pt and titles in brochures in really big sizes,</li>
    <li>OSF and small caps are very welcome,</li>
    <li>CE characters are very welcome,</li>
    <li>Open Type is preferred font format.
    </li></ul>
    <p>Fonts being under consideration so far are FF Quadraat Sans, FF Unit, Fedra Sans Alt, DTL Prokylon and Stalemate.</p>
    <p>U.S. edition of the mag went for Univers family some time ago and I'd like to try something different.</p>
    <p>Please share your thoughts on what in your opinion would be the best choice to accompany LeMondeJournal.</p>
    <p>Thanks in advance,</p>
    <p>Antoni</p>
