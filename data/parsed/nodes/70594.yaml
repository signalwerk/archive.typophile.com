    <p>Hi,</p>
    <p>I'm writing a new variant of Niloofar font. there is a problem with Below marks and Microsoft Office programs: they crop below marks. is this a metric issue? I set the Ascender and Descender values in FontLab but get same result. (see attached image).</p>
