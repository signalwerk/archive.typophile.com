  html: |-
    <p>Happy to announce that my new font, Pastiche Brush, is now available on <a class="freelinking external" href="http://www.myfonts.com/fonts/schizotype/pastiche-brush/" rel="nofollow">MyFonts</a>.</p>
    <p>It's inspired by the film titles of <a class="freelinking external" href="http://annyas.com/screenshots/updates/imitation-of-life-1959-douglas-sirk-lana-turner-john-gavin-sandra-dee/" rel="nofollow">Imitation of Life</a>. The aanyas.com site is a great source of inspiration.</p>
    <p>Thanks for looking,<br>
    Dave</p>
