      <p>Hej David,<br>
      I assume you’re talking about <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_matinee_gothic_exp/" rel="nofollow">FF Matinee Gothic</a>. (And btw, here’s a <a href="http://www.typography.com/fonts/font_history.php?historyItemID=1&amp;productLineID=100008" rel="nofollow">link to Gotham</a>, too.)</p>
      <p>Samples really would help.<br>
      Something like this: <a href="http://www.internationalposter.com/poster-details.aspx?id=DUL15660" rel="nofollow">Philips poster from 1951 </a> by <a href="/wiki/A.%20M.%20Cassandre" class="freelinking" rel="nofollow">A. M. Cassandre</a>? — <a href="http://www.myfonts.com/fonts/letraset/corinthian/bold-condensed/" rel="nofollow">Corinthian Bold </a>, <a href="http://www.myfonts.com/fonts/agfa/century-gothic/bold/" rel="nofollow">Century Gothic </a>, <a href="http://www.myfonts.com/fonts/neufville/futura-nd/familytree.html" rel="nofollow">Futura</a>.</p>
      <p>Or rather this: <a href="http://www.internationalposter.com/poster-details.aspx?id=FRL15110" rel="nofollow">17eme Salon Internationale de l'Aviation, 1946</a> by <a href="/wiki/Paul%20Colin" class="freelinking" rel="nofollow">Paul Colin</a>? — <a href="http://www.fontshop.com/search/?q=rhode&amp;site=d&amp;sample_text=L’AVIATION/" rel="nofollow">Rhode</a>, <a href="http://www.myfonts.com/fonts/t26/denim/denim-black-32740/" rel="nofollow">Denim Black</a>/<a href="http://www.fontshop.com/fonts/singles/linotype/helvetica_lt_std_ultra_compressed_ot/?sample_text=SALON%20INTERNATIONAL" rel="nofollow">Helvetica</a>, <a href="http://www.fontshop.com/fonts/singles/creative_alliance/monotype_grotesque_condensed/?sample_text=SALON%20INTERNATIONAL" rel="nofollow">MT Grotesque</a>.</p>
      <p><a href="http://www.internationalposter.com/poster-details.aspx?id=SWL16382" rel="nofollow">Swissair, 1948</a> by Bernhard Reber? — <a href="http://www.fontbureau.com/fonts/Tasse" rel="nofollow">Tasse</a>/<a href="http://www.fontshop.com/fonts/downloads/urw/urw_topic/" rel="nofollow">Topic</a> (<a href="http://www.typophile.com/node/18227" rel="nofollow">more</a>), <a href="http://www.myfonts.com/fonts/t26/liquorstore/jazz/" rel="nofollow">Liquorstore Jazz</a>.</p>
      <p>F</p>
