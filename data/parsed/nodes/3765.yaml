  html: <p>I think this is a custom font based on one of Zapf's types like Aldus, with a 'medieval' T mixed in for a more historical feel. The squarish open counter on the R is like Aldus  (&amp; Palatino), but the serif-less middle arm on the E is more like Aldus. I can't find a picture of Michelangelo by him, but it may also be similar. The T is a misfit, in any case, I think.</p>
  html_clean: <p>I think this is a custom font based on one of Zapf's types like Aldus, with a 'medieval' T mixed in for a more historical feel. The squarish open counter on the R is like Aldus  (&amp; Palatino), but the serif-less middle arm on the E is more like Aldus. I can't find a picture of Michelangelo by him, but it may also be similar. The T is a misfit, in any case, I think.</p>
