      <p>Hello All</p>
      <p>Tim, thanks for the advices. </p>
      <p>I haven't had that much time to work on this during this week. Although I made some changes here and there.<br>
      I've made all the inside corners into curves mainly cause I didn't had a strong reason to keep some sharp and some rounded.<br>
      I've also worked on S, R, P and E characters strokes. On the A, I've tried the lowercase solution but it seemed out of place, so I tried to make it look more triangular in order to resemble more an A than an O.<br>
      The H, I still gotta find a solution to make it work here.</p>
      <p>Keep the comments coming. They're appreciated.</p>
      <p>Best Regards<br>
      Dave</p>
