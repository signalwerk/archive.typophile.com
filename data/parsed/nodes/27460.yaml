      <p>Perhaps you could close the counter of the P more like the A (or open the opening for the A slightly) the two together look strange with different gaps. For the H you could look at combining two curved sections, for example the vertical of the E where it makes the centre bar. The S's are better but I think you can still work on the curves on the outside they seem to start too far up the diagonal.<br>
      Tim</p>
