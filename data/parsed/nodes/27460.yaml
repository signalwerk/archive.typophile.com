    <p>Hi<br>
    This word mark isn't a comercial work. Its intended to work as a mark for the concept I've been illustrating on my free-times.<br>
    The characters I've drawn for the word mark "SHAPERS" are based on the idea of molding, shaping, metal or some other similar material.<br>
    I'd appreciate some advice/feedback concerning the H character specifically since I couldn't get it to fit this concept, but also on the remaining characters draw and the word respective kerning.<br>
    The typeface on the sentence below is Plexes by Dino dos Santos. However, probably I'll get rid of it.</p>
    <p>Best Regards<br>
    Dave</p>
