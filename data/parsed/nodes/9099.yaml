    html: <p>Any of those formats, or Windows TrueType, should work fine in that environment. <br> <br>In the really long run, I believe OpenType or TrueType is likely to be better supported (like 10 years from now). <br> <br>Other considerations might include what language support and additional typographic functionality might be available in the different formats. <br> <br>Regards, <br> <br>T</p>
