  html: "<p>I am about to purchase a font.  But, which kind of typeface should it be:  Macintosh TrueType, Macintosh PostScript or Open Type?  (Each is a separate purchase.) <br> <br>The font is to be used with an iMac 700 in OS 10.3.6; printing on either an HP 1200se monochrome laser or HP 5650 inkjet color; and using applications InDesignCE or Word 2004. <br> <br>Reddaddy</p>"
