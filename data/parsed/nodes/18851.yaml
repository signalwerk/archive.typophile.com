    html: |-
      <p>You have to assign an unicode to your “non unicode” glyphs. Please use the Private Use Area (PUA) for this. (E000 - F8FF) If its done, you will find your “private” glyphs in word too.</p>
      <p>—<a href="http://www.astype.de" target="_blank">astype.de</a>—</p>
