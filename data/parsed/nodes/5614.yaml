    html: <p>I like the possibility of taking pixel fonts in this unexplored direction (to my knowledge). Naturally, they are niche typefaces at best, but they do have an entirely diﬀerent feel to them than their parent typefaces. I like the raw feeling they have, and don’t mind the knobby look that comes as a result of this technique. <br><br>Any thoughts? <br><br><br><img src="http://www.typophile.com/forums/messages/29/40629.gif" alt=""></p>
