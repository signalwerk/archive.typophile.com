      <p>Don't you just love troubleshooting glitches that seem to happen completely at random? The first thing that comes to mind is that Gmail uses shortcut access keys (and a metric ton of javascript), but that alone isn't much to hint at the problem.</p>
      <p>Which methods have you tried using to enter the characters — Option key shortcuts, character palette, copy/paste from another app? When the bug occurs, have you tested to make sure that those characters work elsewhere in Firefox? Does restarting have any effect? Are you using any extensions or user scripts related to Gmail, or that might affect key bindings?</p>
