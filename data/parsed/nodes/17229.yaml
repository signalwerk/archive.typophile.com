    <p>I’ve visited FontFont, FontBureau, Adobe, Linotype… found many typefaces in that spirit but not exactly the same:</p>
    <p>— Kuenstler script<br>
    — ITC Edwardian script<br>
    — English script<br>
    — Palace script<br>
    — Shelley script<br>
    — Snell roundhand script<br>
    — Bickham script<br>
    — Sloop</p>
    <p>Thanks in advance for your help.</p>
