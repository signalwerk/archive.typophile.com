      <p><cite> &gt; i’d love to see the drawings by Dwiggins, i am very curious how he translated the unique Electra shapes into those characters. </cite></p>
      <p>Well, Ondrej, those characters in the font *are* the way he chose to harmonize with the Electra shapes. For whatever reason, in the end, all of those were the shapes that he chose (perhaps with CHG's influence). Remember, you don't want the special characters to distract too much in text.</p>
      <p>Here are images of some of Dwiggins's sketches for a few of those special characters. I apologize for the quality, as these are scanned from photocopies. The originals are in the CH Griffith Archives at the University of Kentucky, Lexington.</p>
      <p>At this point, Dwiggins is working in ink at 10 x 12 pt size (he didn't begin working in the larger, pencil outlines until Caledonia). These scans are actual size at 100ppi. Sorry for the scrolling on the last one.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Electra_ink_UK-E47_5129.gif"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Electra_ink_UK-E137_6483.gif"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Electra_ink_UK-E138_4199.gif"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Electra_ink_UK-E141_5821.gif"></div><p></p>
      <p>&nbsp;</p>
      <p>The note at the bottom of card [E138] says "Hard to make a § that fits the Electra snap. Try again after you see this lot."</p>
      <p>The note at the bottom of card [E141], under the ampersand, says "Attempt to get a flourished 'and' in the Electra feeling."</p>
      <p>Unfortunately, I don't have dates for these. WAD wasn't as diligent about dating things at this stage as he was later. The card numbers are Griffith's cataloging. They may or may not indicate any chronology. </p>
      <p>-- Kent.</p>
