      <p><cite> DB: &gt; Whatever you do when following WAD or LinoWAD drawings, do not follow them exactly and expect to reach the type they had in mind.</cite></p>
      <p>Yes, words to the wise.</p>
      <p><cite> &gt; it is based almost entirely on a 50’s dutch book set in 12pt, the Emblems booklet and a quick overview of WAD’s work and design methods.</cite></p>
      <p>Not an unreasonable approach. WAD would have overseen and approved the Emblems specimen. An Alfred A Knopf book designed and overseen by WAD himself (like <em>Not Under Forty</em> by Willa Cather, or <em>The Borzoi Reader</em> edited by Carl van Doren -- both 1936, right after Electra's release) might have made for a more authentic exemplar than a ’50s Dutch book, but that's a small matter. </p>
      <p>Original sketches might give additional insight, but they cannot be followed slavishly (as DB points out so succinctly), since they were a means to an end -- that end being the printed type in everyday use. What Dwiggins and his peers knew as Electra is what we can all see in the books they made, not the drawings that started the process.</p>
      <p>-- K.</p>
