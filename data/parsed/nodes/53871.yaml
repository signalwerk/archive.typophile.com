      <p><cite> &gt; Who’s he talking too?</cite></p>
      <p>Generally WAD's annotations were directed at Griff. </p>
      <p>I'm not sure about this comment on card [E138]: "Not for use. But the . [period] as furnished seems light to me, and I am not quite sure about Griff's apostrophes, commas, etc., but let ’em ride for present?"</p>
      <p>You'll notice that the final comma is nothing like what WAD drew here.</p>
      <p>The period and comma would have likely been put in by drawing office initially, probably pulled from some standard. Because WAD mentions Griffith in the third person here, I'm not sure who he would have been addressing with this comment. If this were Metro, I would say he might have been talking to Gage, who remained involved in some of the process throughout. </p>
      <p>More likely in this case he's talking to Larson, head of the drawing office. But, I'm not sure his sketches would have gone straight to Larson without first passing through CHG, so this particular comment is curious.</p>
      <p>-- K.</p>
