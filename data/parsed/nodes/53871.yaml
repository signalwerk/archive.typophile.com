    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ele-1_5096.jpg"></div><p></p>
    <p>hello, i am reviving electra and writing short essay about it for a school project. i noticed how completely different the formal appearance of the special characters is. i discussed this with a colleague and one opinion is that it was a usual practice to just use some default matrices to complete the linotype machine character set. i guess this is the right reason, but it would be great if you could help me with this and make it clearer.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ele-2_4411.jpg"></div><p></p>
    <p>in case the reason is really as stated, was that only linotype thing or was it monotype and letterpress practice as well?</p>
    <p>thank you for your replies. ondrej</p>
  html_clean: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ele-1_5096.jpg"></div><p></p>
