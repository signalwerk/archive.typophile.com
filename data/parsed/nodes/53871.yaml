      <p>Ondrej --</p>
      <p>Linotype offered several of the special characters as generic matrices, and these were intended for when a font did not contain the character in question. Not every font had some of the characters you're asking about specially drawn. But many did.</p>
      <p>In the case of Electra, I know that Dwiggins did in fact draw these characters. I have copies of some of his sketches, including alternates that did not get chosen for production. When I have a chance later today or this weekend, I'll scan some samples to post.</p>
      <p>((BTW, I assume that this revival is just for an academic exercise and that you don't intend to release anything without permission. Linotype still owns the intellectual property and the trademarks for Electra. Are you in the same class as Abi?))</p>
      <p>-- Kent.</p>
