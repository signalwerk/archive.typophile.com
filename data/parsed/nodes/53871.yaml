      <p>"Accurate" is a very relative term -- accurate to what? ;-)</p>
      <p>This is an important issue to address in the brief of any revival endeavor.</p>
      <p>For instance, if you're kerning the font, then it isn't "accurate" to the original (in one sense), because metal Linotype casting had no kerning.</p>
      <p>(. . . unless, perhaps, you limit yourself to only recreating the effect of the handful of two-letter logotypes that were produced for Electra -- which most comps, however, probably didn't take the time to insert.)</p>
      <p>-- K.</p>
