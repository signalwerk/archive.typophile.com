      <p>oh sorry, this is probably a problem with english, because it's not my first language. by saying accurate i meant simply "how succesful the revival was".<br>
      i made two versions, for the first one i redrew what i saw on the pages of the dutch book, trying to make the digital printout as similar to the original as possible, but keeping the outlines clean, sharp and rational, not blobby as automatic tracing would produce.<br>
      for the second version, i compared the first one with Emblems and now i am doing some editing to harmonize the appearance of the text. that is also reason why i decided to kern the second version, with capitals that wide the kerning is really necessary.<br>
      i guess the main purpose of our revival exercise was to learn the rules and principles of type design by learning from the masters and i really did learn a lot, although my revival may not be perfect. anyways, i am happy i chose Electra.</p>
      <p>o</p>
