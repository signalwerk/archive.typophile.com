      <p><em>Nick Shinn's first response, third category, could be summarised more plainly as by usage.</em></p>
      <p>I was trying to make the distinction between two kinds of "usage", in graphic trade media and client media.<br>
      Fonts are branded tools, and the folk who pay for them are predominantly professionals.<br>
      Certainly, we professionals see the results of their use in the mass media, but we are consumers too, and are exposed to and develop impressions and opinions about types through advertising, media, and academic publications which target us.</p>
      <p>The "Nazi signification of blackletter" is an issue because the trade media and academia have made it so, as much as if not more than any connotation it might have in the mass media. This thread is ample proof of that.</p>
