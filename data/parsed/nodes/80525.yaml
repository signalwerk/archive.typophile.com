      <p>I take your bait:</p>
      <p>Sure, type designers do of course exploit the symbolism of type shapes directly into their fonts, by alluding to previous typefaces.</p>
      <p>However, the point I wanted to make in my first post was that so much of the symbolism is arbitrary to the actual letter shapes, the result of extraneous social, cultural and economic processes.</p>
      <p>For instance, recently Gotham has become very symbolic not only of New York (from whence its style derives), but also of the USA, due, I conjecture, to its association with the 9/11 memorial and the Obama presidential campaign. This despite the fact that the style of sign lettering which it channels is not exclusively New York or American.</p>
