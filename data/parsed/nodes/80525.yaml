      <p>Nick covers a lot of it.</p>
      <p>Later on, typefaces that were especially popular in a particular period or geographical location (or sometimes just from that period or geographical location) may become associated with it. The strength of this association depends on whether the typeface's popularity was particularly stronger in that time or place than in others, and also whether it was part of broader typographic or artistic trends.</p>
      <p>Thus Avant Garde screams of the 1970s and disco and America, yet Optima is not thought of as particularly late 1950s or German.</p>
      <p>Cheers,</p>
      <p>T</p>
