      <p>Mr vibez is on the money in my opinion. The letterforms have no intrinsic meaning. Like with the semantic nature of words, letterforms are given meaning by context- and meanings change hugely in short timeframes.</p>
      <p>And I think it's important to distinguish typefaces and type styles here. Because Of the way our brains interprete shapes, very few<br>
      people remember enough detail about a letterform to be able to distinguish typefaces (like you can!), but most people can identify the broad similarities of a type style.</p>
      <p>The best example I can think of is blackletter. We associate blackletter most closely with the third reich. But it's calligraphic form was created by monks, and considered close to god. The first printed book, the Gutenberg bible, was made using blackletter. The association with the nazi's is unfair, because in 1941 the nazi high command decreed it "ungerman" (it had been used in Jewish-owned newspapers) and forbade it's use. But it was too late. Rappers and metal bands exploit the nazi association to convey a subversive idea, and in turn have blunted it's offensiveness by making it ubiquitous.</p>
      <p><a href="http://blogs.sitepoint.com/the-blackletter-typeface-a-long-and-colored-history/" title="http://blogs.sitepoint.com/the-blackletter-typeface-a-long-and-colored-history/">http://blogs.sitepoint.com/the-blackletter-typeface-a-long-and-colored-h...</a></p>
      <p>Meaning is a collective hallucination that resides in shared human consciousness- so it's fuzzy and indistinct and subject to tiny and huge shifts. By using a typeface, you are contributing to it's history and meaning by giving it context.</p>
