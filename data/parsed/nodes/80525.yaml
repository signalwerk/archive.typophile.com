      <p>Nick Shinn's first response, third category, could be summarised more plainly as <em>by usage.</em></p>
      <p>The question made me think of what Ellen Lupton wrote about concerning the <a href="http://en.wikipedia.org/wiki/Neuland" rel="nofollow">Neuland typeface</a> (Rudolf Koch 1923) connoting African-Americans and by extension, all things African. Rob Giampetro has expanded on it <a href="http://www.studio-gs.com/neuland.html#top" rel="nofollow">here.</a></p>
      <p>Some, but maybe not all, of the story about what Blackletter has come to signify can be found in Peter Bain &amp; Paul Shaw's excellent book <a href="http://www.amazon.co.uk/Blackletter-National-Identity-Peter-Bain/dp/1568981252/ref=sr_1_1?s=books&amp;ie=UTF8&amp;qid=1301520415&amp;sr=1-1" rel="nofollow">Blackletter: Type and National Identity</a>, and also Christina Paoli's <a href="http://www.amazon.co.uk/Mexican-Blackletter-Cristina-Paoli/dp/0977282783/ref=sr_1_8?s=books&amp;ie=UTF8&amp;qid=1301520415&amp;sr=1-8" rel="nofollow">Mexican Blackletter</a>.</p>
