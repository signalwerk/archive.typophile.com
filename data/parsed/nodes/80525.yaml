    <p>Hey, new to being a member, but a long time reader of typophile.<br>
    In know way asking anybody to do the work for me or research, but their are so many great designers and knowledgeable members, was curious if anyone could point anything I have missed out.</p>
    <p>My dissertation title and question is:<br>
     How do typefaces acquire their symbolism?</p>
    <p>Their is no question that a relationship between a typefont, its appearance, its semantic connotations and the history that produced such development of associated meanings.<br>
    Meaning is not an assumption, it is an unsurpassable condition.<br>
    How such meanings are accrued through time and space and how the contingent history of each typeface is unique in its own way, is how I will go about research.</p>
    <p>Anybody got any ideas for particular fonts to look at, or references etc, or any knowledge of a question like this being asked before. Any help will do, and is really appreciated.</p>
    <p>Thanks</p>
