      <p><em>How do typefaces acquire their symbolism?</em></p>
      <p>Firstly, they are branded products, so they are publicized by their manufacturers.<br>
      Secondly, they are associated with distributors (traditionally that would be through typesetting companies).<br>
      Thirdly, they become associated with the products, services, and publications they are used in; art directors, graphic designers and typographers have a key role in determining how the latent abilities/qualities of typefaces are realized and materialized--once the ball starts rolling...<br>
      Fourthly, they are further publicized and discussed in the editorial matter of trade media.<br>
      Fifthly, some get in the history books.<br>
      Sixthly, a very few spill over into non-professional and prosumer awareness, acquiring signification by the way in which this occurs.</p>
