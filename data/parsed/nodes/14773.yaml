    html: |-
      <p>In hi-fi there are many companies that don’t last. Also, most of the shops don’t have enough product line to really match components. I’d think that if you were spending several thousand dollars on a cartridge for your turntable you would want to do some research. I’ve only met a few people that can do a good job of matching systems. </p>
      <p>That’s why I linked to the Sota page. McIntosh is another hi-fi brand that has been around. Look at their mark.<br>
      <a href="http://www.audioclassics.com/">http://www.audioclassics.com/</a></p>
      <p>Seems trendy type may give an impression that there won’t be a company to service your amp in a few years. </p>
      <p>Hi-fi is like good type design in some ways maybe. Lots of pretenders and few people with enough skill to get all the details right. An esoteric persuit yes, but not to be dismissed as simple vanity. If you’ve noticed, our standards for high-quality music reproduction are doing down fast. It looks like information in the brave new world will be digital and highly compressed.</p>
      <p>I’m ranting and getting off topic.</p>
