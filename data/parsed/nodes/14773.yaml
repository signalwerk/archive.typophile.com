    html: |-
      <p><cite>a high end speaker/components company (think bose, infinity, JBL etc)</cite></p>
      <p>This is actually “mid-end”, for want of a better term, and the domain of fairly predictable corporate identities. Hi-fi manufacturers are generally good candidates for undistinguished and boring identities. But the deeper into hi-end territory you get, the more contrived and “faux craft” the identities become, ranging from your little nephew’s attempts at geometric cool to pink marble mantelpieces with gold leaf borders. Try <a href="http://www.ear-yoshino.com/">http://www.ear-yoshino.com/</a> for the chintzy version, or <a href="http://www.wadia.com/">http://www.wadia.com/</a> and <a href="http://www.wilson-benesch.com/">http://www.wilson-benesch.com/</a> for the techie version. There’s only one truly hi-end manufacturer who manages to translate sonic performance into an at least inoffensive identity, (<a href="http://www.lavardin.com">http://www.lavardin.com</a>), but they’re French, so that doesn’t count (just kidding, J-F). Mind you, they all have 1998-vintage websites. </p>
      <p>Hm. Better get my anorak off, this will get out of hand.</p>
    html_clean: |-
