      <p>You both make eloquent and robust arguments. Michel's argument and quotation alone (the so-called דעת כתב אשורי), should serve as an indication that the phenomena of perceiving square Hebrew as divine in origin, is a comparatively "modern" phenomena (in the grand scheme of things). </p>
      <p>It is also worth noting that Hebrew grammar and structure rules where only established at a much later time, specifically between the 11th to 13th centuries by scholars such as Rabbi David Kimchi (רד"ק) and Iben Ezra. These scholars who were based in Muslim Spain, based most of their preliminary work in Hebrew grammar and structure, on Islamic traditions in the linguistic structural analysis of Arabic. Thus, our modern understanding of Hebrew owes to scholarly work done in Arabic, and the application of those rules and concepts the Hebrew. So, if Hebrew is so divine, how come decoding its structure required Arabic (and Islamic scholars).</p>
      <p>I have though some experience, through a short past stint in a yeshiva, of the kind of mindset that we are dealing with in Israel's case. You can talk reason, logic, and proof until you are blue in the face, and you would have accomplished absolutely nothing (that is unless you are a great Mekubal, in which case no logical arguments are needed, just directives). You are talking about historical documentation and proof to a person who literally believes that the world is 5770 years old, and reject the theory of evolution. So, you really think that you can persuade him that Hebrew did not come directly from God's FontLab Studio?</p>
      <p>My young daughter though seems to have the best reply for Israel:</p>
      <p>"Moses supposes his toeses are roses<br>
      But Moses supposes erroneously<br>
      for nobody's toeses are posies of roses<br>
      As Moses supposes his toeses to be."</p>
