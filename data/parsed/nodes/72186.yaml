      <p>The three columns are called: the right column, the left column, and the special middle column. It is special because it reaches above to the highest level, called Kesser, and to the lowest level, called Malchus.</p>
      <p>In the Beis, the opening is on the left, in the middle row, corresponding to Gevurah.</p>
      <p>What is Gevurah, and why must it be "nullified" in the Beis?</p>
      <p>Gevurah is strickness, and holding back. This is the opposite of Chesed, on the right side. Chesed is kindness, and giving.</p>
      <p>Bais is associated with a "bayis", a house in Hebrew. For a house to exist and endure, there must not be Geruvah, but kindness and flexibility.</p>
      <p>So, we now understand why the Aleph and Beis are designed in these ways. Unlike in other languages, the overall design teaches an important lesson in life. This is reflective of Hebrew in general, which like Torah combines creativity with instructions.</p>
