      <p>According to <a href="http://www.mezuzah.net/scripts.html" title="http://www.mezuzah.net/scripts.html">http://www.mezuzah.net/scripts.html</a>, the talmud tells that the "ktav ashuri" (the "assyrian script") is to be used for mezuzot, tefilin and sifrei torah;  the same site shows a sample of "ktav ivri", "hebrew script", which was quite different, and in common usage during the period of the first temple.  Interestingly enough, in this text from the dead sea scrolls, <a href="http://www.ancient-hebrew.org/31_psalm138.html" title="http://www.ancient-hebrew.org/31_psalm138.html">http://www.ancient-hebrew.org/31_psalm138.html</a>, the tetragrammon is written with a variant of the "ktav ivri" (called "middle hebrew" by the author of the site) whereas the rest of the text is not.</p>
      <p>It is also interesting to compare the "ktav ivri" of <a href="http://www.mezuzah.net/scripts.html" title="http://www.mezuzah.net/scripts.html">http://www.mezuzah.net/scripts.html</a> to the phoenician alphabet, unicode range 10900-1091F, <a href="http://www.unicode.org/charts/PDF/U10900.pdf" title="http://www.unicode.org/charts/PDF/U10900.pdf">http://www.unicode.org/charts/PDF/U10900.pdf</a>.</p>
