      <p>Israel, let me try to answer your three questions.</p>
      <p><em>1. What are the ramifications to Hebrew type design as we practice it, if they indeed have a divine origin?</em></p>
      <p>That it should be practised with great care, attention to quality in even the smallest detail; that our types should reflect the Lord's glory in both their beauty and utility.</p>
      <p>Now, I don't think one needs a theology of Hebrew writing in order to come to that conclusion <em>about any script</em>. A theology of creation is all you need. William writes that he sees ‘some divinity in human creativity’, and hence acknowledges that the invention of all human writing has some divine origin. I'd agree with that in terms of a general theology of creation. As a Catholic, I have a more specific theology of creation that all things are created <em>through</em> Christ in whom, as Saint Paul has it, ‘we live and move and have our being’, and that there is nothing without the continued will of God that it should be so. That is my theological tradition, and hence it informs my thinking about creativity, as do, for example, ideas that derive from that tradition such as the Thomistic tradition of in the philosophy of art, particularly as expressed in the writings of Jacques Maritain and my beloved David Jones.</p>
      <p>But given even the most general theology of creation, I don't see how one can arrive at any other conclusion than that <em>all</em> human creativity should be guided by the criteria I suggest above: care, attention to detail, beauty and utility, etc..</p>
      <p>And maybe your ideas about the origin of the Hebrew script and about the interpretation of its forms might lead you to conclude that only an approach to Hebrew typeface design that incorporates these ideas is valid, that approaches that ignore these ideas are not proper. At that point, polite disagreement might be the only thing left in terms of dialogue with a lot of other Hebrew type designers. For me, it is in an important sense moot, because I'm of the view that when it comes to creative acts what matters is the thing made, not the things that went through the maker's mind while he was creating it.</p>
      <p><em>2. Can we incorporate these divine lessons to improve Hebrew type design?</em></p>
      <p>This depends what you mean by lessons. Even if the Hebrew letters -- and again, which forms: the early, pre-exilic forms? the post-exilic square script forms? the special forms used in the sefer scrolls? -- were of <em>direct</em> divine origin, made by God and gifted to His chosen people, I would still see a distinction between those forms and the interpretation of their meaning within e.g. particular mystic traditions.</p>
      <p>Now, that interpretation is obviously going to be significant to an adherent of that tradition. So perhaps the question to ask is how to incorporate these ‘divine lessons’, as you see them in a kabbalistic tradition for example, in <em>your</em> typeface design. I'm obviously not an adherent of that tradition -- and, as I understand it, neither are very large numbers of Jews --, so for me the question is academic. In my experience, all sorts of complex cultural ideas can be expressed in the form of typography, so I don't doubt that you can find a way to incorporate the ideas of kabbala as they relate to letter shapes in your type design.</p>
      <p><em>3. Can these rules of improvement be applied to other letter sets of different languages?</em></p>
      <p>From my answers to the first two questions you can probably guess that I will arrive at two answers to this third question:</p>
      <p>a) What holds true for Hebrew type design holds true for all creative acts: they should reflect God's glory in the way that His creation does. Even if the Hebrew script were in some way ‘special’ in terms of its divine origin, would we be able to treat it any differently in type design than we treat any other script.</p>
      <p>b) If a script is culturally associated with particular traditions of understanding, then obviously it is likely to express those traditions more easily than a foreign script would. Sometimes, a cultural idea can find idiomatic expression in a foreign script, but very often what results is a kind of pastiche that does not honour the idea, but deforms or debases it. Think, for example, about Latin display fonts that try to look ‘Asian’ by incorporating some evocative shapes that encourage designers to use them in signage for Chinese restaurants. So I'm wary about such things. On the other hand, if an individual type design inhabits more than one culture then I can imagine how he or she might, over time, find ways to express the ideas of one culture within the formal structures of another.</p>
