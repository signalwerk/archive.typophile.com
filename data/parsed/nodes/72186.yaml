    <p>What are the origins of <a href="/wiki/Hebrew" class="freelinking" rel="nofollow">Hebrew</a>?</p>
    <p>This has been a debate among scholars for many centuries.</p>
    <p>Like the age of the universe, scholars can't seem to make up their minds. </p>
    <p>When I was but a mere lad, scholars argued the universe's age was many a million years old. They scoffed at Bible-belt believers who foolishly thought that the universe was about 5,700 years old. Bible scholars rushed in from the cold, and suggested that each day of creation equaled a million years. What a joke?</p>
    <p>But how can we deny the validity of carbon-dating?</p>
    <p>The holy Zohar explains that carbon dating is approximately accurate after the time of Noach's Flood, but fails in dating accurately before that time, as the conditions of the earth changed dramatically with the Flood, which encompassed the earth.</p>
    <p>Similarly, scholars have pondered the origins of Hebrew with only the historical proofs of scientific evidence, known as 'secular knowledge', but have ignored the knowledge provided to us in Talmudic and Kabbalistic information.</p>
    <p>Not having a complete picture of both sources of information, secular knowledge is not accurate, because by ignoring religious knowledge, incorrect inferences are made.</p>
