      <p>from:<br>
      <a href="http://www.inner.org/hebleter/alef.htm" title="http://www.inner.org/hebleter/alef.htm">http://www.inner.org/hebleter/alef.htm</a></p>
      <p>The Hebrew Letters<br>
      Alef: The Paradox of God and Man</p>
      <p>The alef is formed by two yuds, one to the upper right and the other to the lower left, joined by a diagonal vav. These represent the higher and lower waters and the firmament between them, as taught by the Ari z"l ("Rabbi Isaac Luria of blessed memory," who received and revealed new insights into the ancient wisdom of Kabbalah)</p>
      <p>Water is first mentioned in the Torah in the account of the first day of Creation: "And the spirit of God hovered over the surface of the water." At this time the higher and the lower waters were indistinguishable; their state is referred to as "water in water." On the second day of Creation God separated the two waters by "stretching" the firmament between them.</p>
      <p>In the service of the soul, as taught in Chassidut, the higher water is water of joy, the experience of being close to God, while the lower water is water of bitterness, the experience of being far from God.</p>
      <p>In Jewish philosophy, the two intrinsic properties of water are "wet" and "cold." The higher water is "wet" with the feeling of oneness with the "exaltation of God," while the lower water is "cold" with the feeling of separation, the frustration of experiencing the inherent "lowliness of man." Divine service, as taught by Chassidut, emphasizes that in fact the primary consciousness of both waters is the sense of the Divine, each from its own perspective: from the perspective of the higher water, the greater the "exaltation of God," the greater the oneness of all in His Absolute Being; from the perspective of the lower water, the greater the "exaltation of God," the greater the existential gap between the reality of God and that of man, thus the inherent "lowliness of man."</p>
      <p>The Talmud tells of four sages who entered the "Pardes," the mystical orchard of spiritual elevation reached only through intense meditation and Kabbalistic contemplations. The greatest of the four, Rabbi Akiva, said to the others before entering, "When you come to the place of pure marble stone, do not say 'water-water,' for it is said, 'He who speaks lies shall not stand before my eyes.'" The Ari z"l explains that the place of "pure marble stone" is where the higher and the lower waters unite. Here one must not call out 'water-water,' as if to divide the higher and lower waters. "The place of pure marble stone" is the place of truth--the Divine power to bear two opposites simultaneously; in the words of Rabbi Shalom ben Adret: "the paradox of paradoxes." Here "the exaltation of God" and His "closeness" to man unite with the "lowliness of man" and his "distance" from God.</p>
      <p>The Torah begins with the letter beit: "Bereishit (In the beginning) God created the heavens and the earth." The Ten Commandments, the Divine revelation to the Jewish People at Sinai, begin with the letter alef: "Anochi [I] am God your God who has taken you out of the land of Egypt, out of the house of bondage." The Midrash states that "higher reality" had been set apart from "lower reality," for God had decreed that neither higher reality descend nor lower reality ascend. In giving the Torah, God annulled His decree, He Himself being the first to descend, as it is written: "And God came down on Mount Sinai". Lower reality, in turn, ascended: "And Moses approached the cloud...." The union of "higher reality," the upper yud, with the "lower reality," the lower yud, by means of the connecting vav of Torah, is the ultimate secret of the letter alef.</p>
      <p>FORM</p>
      <p>A yud above and a yud below with a vav separating and uniting them simultaneously. The secret of the image in which man was created.</p>
      <p>Worlds:</p>
      <p>The upper and lower waters with the firmament between them.</p>
      <p>In the world:</p>
      <p>The upper atmosphere, the lower atmosphere, the ocean &amp; water table.</p>
      <p>Energy waves, the atmosphere, the hydrological cycle.</p>
      <p>In the human body:</p>
      <p>The respiratory system, the diaphragm, the digestive system .</p>
      <p>The skull-water, the membrane, the brain-moisture.</p>
      <p>Souls:</p>
      <p>Feeling both close to God and distant from Him with commitment to Torah and mitzvot balancing these emotions.</p>
      <p>"Crying is enwedged in my heart on one side, while joy is enwedged in my heart on the other side."<br>
      Divinity:</p>
      <p>Transcendent and Immanent Light with the contraction (tzimtzum) and impression (reshimu) between them.</p>
      <p>Man in perfect unity with the Infinite Will of God.</p>
      <p>NAME</p>
      <p>Oxen; thousand; teaching; master.</p>
      <p>Worlds:</p>
      <p>Oxen--gross physical reality, the lower animal soul.</p>
      <p>Thousand--multiplicity in Creation, the "thousand mountains grazed by the ox."</p>
      <p>The yoke of the ox yielding a thousandfold and returning to unity.</p>
      <p>Souls:</p>
      <p>"I will teach you wisdom"; the root of the soul is derived from the wisdom of God.</p>
      <p>Direct insight of Divine truth; to be nothing.</p>
      <p>Divinity:</p>
      <p>"Master of the universe."</p>
      <p>The Divine "One" revealing itself throughout the plurality of Creation.</p>
      <p>NUMBER</p>
      <p>One</p>
      <p>Worlds:</p>
      <p>First of all countable numbers.</p>
      <p>The beginning of process in nature and sequence of worldly events.</p>
      <p>One counts "something from something."</p>
      <p>Souls:</p>
      <p>"One nation in the land."</p>
      <p>The organic unity of all Jewish souls.</p>
      <p>One counts "something from nothing."</p>
      <p>Divinity:</p>
      <p>"God is One": the absolute unity of God.</p>
      <p>"There is none other besides Him:" "One, single, and unique."</p>
      <p>One counts "nothing from something</p>
