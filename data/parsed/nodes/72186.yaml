      <p><cite>And if Arabic can get glyphs for its initial, medial, final, and isolated forms in a special region of Unicode, clearly other languages from which glyphs are excluded for good reason should also get that treatment as well.</cite></p>
      <p>Arabic Presentation Forms in Unicode are for backward comparability with older encodings to allow round trip conversion between those encodings and Unicode without loss of data (that was the idea back then, at least), and since they violate Unicode principle for not encoding presentation forms, their use in text input is discouraged and currently are only used internally be legacy, pre-smartfont text renderers. As such, no more Arabic presentation forms are allowed into Unicode, see: <a href="http://unicode.org/faq/middleeast.html#1" title="http://unicode.org/faq/middleeast.html#1">http://unicode.org/faq/middleeast.html#1</a>. It is no different from the various f-ligatures encoded into Unicode for the same backward comparability reasons, or even pre-composed accented characters (no new pre-composed characters allowed into Unicode if it can be composed from existing accents and base glyphs, but it is a slightly different issue).</p>
