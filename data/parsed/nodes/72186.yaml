      <p>Apparently, William, you have "Sayings of the Fathers" by Rabbi Dr. Joseph H. Hertz zal, the former Chief Rabbi of England, published by Behrman House, which places this teaching on Avot 5:9. See his comments there on pp. 88-89.</p>
      <p>The letters themselves existed miraculously. Even though they were engraved from one side to another, they appeared in the correct order on both sides - not humanly possible.</p>
      <p>The Talmud states that there are two styles of Hebrew type design. One kind is reserved for the Torah scroll, and holy writing. The other kind is used for common discussions.</p>
      <p>Even in the printing of the Talmud itself, two styles are common. The main text appears in classic square letters, like Bodoni in Hebrew. Commentaries are traditionally typeset in a script-like type design, known as Rashi letters.</p>
      <p>In the Dead Sea Scrolls, we also find a similar trait. Scriptures are typeset in a classic typeface, while other texts describing laws and customs are typeset differently.</p>
      <p>Furthermore, Frederick Goudy, the famous American type designer, writes the Mr. Romm senior traveled from Vilna, Lithuania, to Italy,, to commission students of by Giambattista Bodoni (1740–1813) [see: <a href="http://en.wikipedia.org/wiki/Bodoni" title="http://en.wikipedia.org/wiki/Bodoni">http://en.wikipedia.org/wiki/Bodoni</a> ]to master and cut Hebrew typefaces for his illustrious printing house based upon ancient (Sephardic) drawings of Hebrew square letters.</p>
      <p>So, we see that the classic square letters of Vilna were Sephardic in origin. This was later confirmed by the contemporary type designer, John Hudson, in discussing his work known as 'Adobe Hebrew'.</p>
      <p>Hence, from the Dead Sea Scrolls' images, and from Frederick Goudy's account, the classic Hebrew letter forms were not at all similar to the Aramaic alphabet, or even to the Assyrian script.</p>
      <p>Today, many Arabic letters share similar names as their Hebrew counterparts. Only a fool would suggest that the design found in block Hebrew letters compare to the design of Arabic script, which is like swift handwriting.</p>
