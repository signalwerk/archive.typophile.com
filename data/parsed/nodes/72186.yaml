      <p>Rashi Script<br>
      from <a href="http://en.wikipedia.org/wiki/Rashi_script" title="http://en.wikipedia.org/wiki/Rashi_script">http://en.wikipedia.org/wiki/Rashi_script</a></p>
      <p>"Rashi script (Hebrew: כתב רש"י) is a semi-cursive typeface for the Hebrew alphabet, in which Rashi's commentaries are customarily printed both in the Talmud and Tanakh (Hebrew Bible). This does not mean that Rashi himself used such a script: the typeface is based on a 15th century Sephardic semi-cursive hand and was called by the Ashkenazic Rishonim - the Provencial script. What would be called "Rashi script" was employed by early Hebrew typographers such as Abraham Garton, the Soncino family and Daniel Bomberg, a Christian printer in Venice, in their editions of commented texts (such as the Mikraot Gedolot and the Talmud, in which Rashi's commentaries prominently figure) to distinguish the rabbinic commentary from the text proper, for which a square typeface was used."</p>
      <p>According to this, it is from the 15th century, and preexisted Bomberg.</p>
