      <p>If I had a typewriter that could type in Arabic, I could use it to make a chart of the different forms of Arabic letters.</p>
      <p>Actually, that oversimplifies, since, for example, the IBM Arabic type elements got by with just two forms, not four, of each Arabic letter. Thus, in general, the initial form of a letter was provided, and not the medial form, because the connector between letters was always attached to the first (rightmost) letter of two letters in text. But I do think that if only for that reason, there should be a codepoint for every glyph, although not necessarily for every overstrike.</p>
      <p>Also, I know I've seen complaints from users of Burmese that they now have (post-Unicode) encodings that include extra presentation forms, because implementing full Unicode support for their language is awkward - and, elsewhere, it's been noted that the Unicode rules on not including unnecessary characters are generally only strictly observed in the case of languages that are less "economically important". I don't approve of that kind of a two-tier system.</p>
