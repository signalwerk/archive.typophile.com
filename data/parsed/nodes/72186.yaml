      <p>Israel, your attempts to deny history to bolster your theories are just ludicrous, because the Sages of the Talmud were well aware of this history, and discussed it. </p>
      <p>Your claim that "Ashuri" doesn't mean "Assyrian" but "rich" is ridiculous. "Ashuri," Assyrian, begins with the letter aleph, and "ashir", "wealthy," begins with the letter ayin. As you very well know, these are totally different roots, and would have been pronounced differently in ancient Hebrew. The sages would *never* confuse one with the other, or even make a pun like this, because different roots imply totally different etymology. Furthermore I seriously doubt that any of your Chasidic sages have ever made such a claim that "Ashuri" means "rich".  </p>
      <p>Here is a Talmudic passage on this issue, as translated in the Soncino Talmud from Sanhedrin 21b: "Mar Zutra or, as some say, Mar 'Ukba said: Originally the Torah was given to Israel in Hebrew characters and in the sacred [Hebrew] language; later, in the times of Ezra, the Torah was given in Ashshurith script and Aramaic language. [Finally] they selected for Israel the Ashshurith script and Hebrew language, leaving the Hebrew characters and Aramic language for the hedyototh. Who are meant by the "hedyototh"? —Rabbi Hisda answers: the Cutheans. And what is meant by Hebrew characters? —Rabbi Hisda said: the libuna'ah script."</p>
      <p>This has footnotes explaining that "Ashshurith" means "Assyrian," and that "libuna'ah" means "Rashi: large characters as employed in amulets. R. Tam recognizes "libuna'ah" as an adjective from the name of some locality (Lebanon or Libya?) Another opinion is that libuna'ah is derived from 'lebanah', brick; hence writing found on clay tablets." </p>
      <p>The 'clay tablet' reading I think is correct. Michel's example from the dead sea scrolls shows that some at that time regarded the original script of the Torah as more sacred and powerful, and thus used it for the Sacred Name in amulets. Rashi, commenting on the Talmud around 1100, seems to be aware of this practice as well. We now know that in the second century, Jews still knew the ancient script, as the coins minted during the Bar Kochba rebellion, which still survive, are written in the ancient script. And some modern Israeli coins also use it, in tribute to this. </p>
      <p>By the way "Cuthean" here is what we call "Samaritan". The Samaritan Bible is written in a script derived from the 'ketav ivri', unlike our current Hebrew script, which is not Hebrew but Aramaic, and originally created by non-Jews. </p>
      <p>As Daniel Moynihan said "Everyone is entitled to his own opinion, but not his own facts." It is just a fact that "Ashuri" means Assyrian, as both the Soncino translation and my Alcaly Hebrew-English Dictionary confirm. "Ashir," "wealthy" is spelled differently and has nothing to do with it. And Aramaic was around from long before the Temple was built. </p>
      <p>I know it spoils your theory about the sacred shapes that the Torah was originally not written in our current script but that's the *Rabbinic* view, and scholarly view as well.   </p>
      <p>If you look at the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Hebrew_alphabet" rel="nofollow">Wikipedia article on the Hebrew alphabet</a> you will see the clear comparison between paleo Hebrew (ketav Ivri), Aramaic, and modern Hebrew, and see that the shapes of our current characters are derived from the shapes of a non-Jewish script, and not the script in which the Torah was originally written. </p>
      <p>Edit: I see Michel has posted the original of the translated passage above—thanks!</p>
