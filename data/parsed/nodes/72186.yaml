      <p>Israel: <em>The actual language is supra-logical, and its letter forms are like works of art in their depth and meaning.</em></p>
      <p>The actual Hebrew language is part of the Canaanite branch of the Semitic language group within the Afroasiatic language family, with characteristics and origins in common with other languages of that branch and group. Most of the other ancient Canaanite languages are extinct, but we have enough literary and archaeological evidence to map their correspondences to contemporary ancient Hebrew. All of them were presumably used for liturgical and other religious purposes at some point, and I'm willing to bet that the speakers and writers of these languages all believed that theirs' was special and held some beliefs about its unique divine or mystical origin. Why? Because that's what people all over the world have done for millennia. Scientific linguistic analysis tells another story, though, which is less to do with uniqueness than with commonality, trade, movements of peoples, etc.</p>
      <p>Certain traditions in Jewish thought -- and I know from your previous discussions with William than not all Jews grant these traditions equal significance -- <em>assign</em> to the Hebrew letters -- and I ask again: which forms? -- what might be termed deep meaning, i.e. meaning beyond the sounds that they conventionally represent in written speech. Again, this is not something unique to Judaism. The Germanic tribes assigned magical significance to their runic letters (a belief later adopted by Nazi occultists). The letters of the ancient Irish ogham script are associated with different trees. Gematria, which is central to kabbalah, is also found in ancient Assyrian inscriptions. This is just something that people do: assign extra-linguistic meaning to writing. Sometimes, this contributes to writing as art, but it is also worth pointing out that there are plenty of traditions of calligraphy in which the art is either purely formal or associated with ideas that are not directly linked to religious or mystical beliefs.</p>
