      <p>William,</p>
      <p>I began to research the subject already; I will provide you with both citations and pertinent selected texts in English. Most sources are in Hebrew only.</p>
      <p>Avot is 5:6. </p>
      <p>Many commentators say that this refers to (a) the engravings on the stone tablets of the Ten Commandments, in which the letter forms were engraved through the entire stone tablets, from one side to another, and to (b) the content of those engravings, ie. the Ten Commandments.</p>
      <p>Perhaps, we shall discuss this first.</p>
      <p>But clearly you see from these two citings, ie. the Medrashic teaching about Moses viewing Rabbi Akiva's analysis of the meaning of the taggim, or crowns, upon certain Hebrew letters in a Torah scroll, and the discussion of Avot, based upon sources in the Holy Scripture, about the engraved Hebrew letterforms, that Aramaic was NOT the source for the Hebrew alphabet.</p>
      <p>Both Moses and the Tablets, and Rabbi Akiva, lived prior to the invention of Aramaic.</p>
      <p>Second, Avot declares that the Hebrew letters engraved on the Tablets were "created" on the eve of the first Sabbath, when the entire world was created.</p>
      <p>Now, we clearly see that it is silly to link the origins of Hebrew letters to Aramaic.</p>
