      <p>You may well be right about Aramaic not being the language of Abraham, according to what I now read on the wikipedia article "Akkadian" it could be that the language called "Old Babylonian" or "Old Assyrian", the language of Hammurabi, if the usual dates of Abraham—around 1700 BCE are correct. It's a Semitic language, but not Hebrew (or Aramaic). </p>
      <p>However Torah itself calls Jacob, grandchild of Abraham an Aramean, in the passage (Deut. 26:5) discussed in the Haggadah: "arami oved avi"  "A wandering Aramean was my father." According to the wikipedia on the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Aramaeans" rel="nofollow">Arameans</a> they go back to 1900 BCE, so maybe the Torah is right—I'm surprised you contradict it :) </p>
      <p>(I know there's another reading, but still...) </p>
      <p>According to the article on <a class="freelinking external" href="http://en.wikipedia.org/wiki/Aramaic_language#Old_Aramaic" rel="nofollow">Aramaic</a>, you are not correct that Aramaic was invented during the Temple period. It was current in Babylonia in 1200, BCE, roughly the time of Moses, and several hundred years before Solomon built the Temple in Jerusalem. </p>
      <p>I don't know that the numbering in the Mishnah is more accurate, though I haven't studied this and am not sure. The version of Avot in the Siddur I am guessing goes back to the Mahzor Vitry, and the manuscripts are of it are of approximately equal antiquity to the manuscripts of the Mishnah. Also the wording of Avot was unfortunately not kept with the same care as the Torah, and there are minor variations from manuscript to manuscript.</p>
      <p>So I think neither are entirely reliable. There is a recent scholarly work on the text of Avot, in Hebrew, but I haven't looked at it, and my Hebrew is alas not that good in any case. </p>
      <p>More later...</p>
