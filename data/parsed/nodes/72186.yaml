      <p>I'm sorry Israel, but you are talking about particular ‘meanings of letter forms and parts’ that are assigned to Hebrew in the context of particular traditions of the Rabbinic period, and in particular those ideas that relate to the origin of the script and language. You can't dodge now and say that you are only interested in understanding ‘Hebrew today’ when your understanding involves claims about its origin. You have to face the historical linguistic record.</p>
      <p>What I see is a language that is closely related to other languages descended from a common mother, and two ancient forms of writing that language: one using letters that are clearly derived from those common to other ancient Canaanite languages, and another using letters that were adopted during the Babylonian exile by the Jews, as their own history records, from the Aramaic script used in Babylon. So I don't see evidence for anything unique or special about Hebrew language or script that isn't just historical mythologising of the kind that occurs in many other literate cultures with complex religious and mystical traditions.</p>
