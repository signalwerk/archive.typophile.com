      <p>Pretty much every literate culture in the world seems to have some kind of myth of divine or mystical origin for its writing system. I take this simply as indicative of just how important and all-changing the introduction of writing is to any society: it is one of those few key changes -- like the advent of agriculture or metallurgy -- that transform almost every aspect of a society. And hence it gets recorded in the most important stories that a society tells to itself that help make sense of its experience. The ancient Egyptians, for example, considered writing to have been invented by the Ibis-headed god Thoth. The Greeks believed that writing was invented by the semi-mythological prince of Tyre, Cadmus, and Greek mystic tradition linked the invention of the alphabet to Cadmus' sowing of the dragon's teeth that grew up to become an army, recognising the power of literacy to marshall and regulate a society.</p>
      <p>The earliest known forms of Hebrew letters are completely indistinguishable in their typical shapes from those used to write Canaanite and other languages. Only the language of the text written makes it possible to speak of 'Hebrew' writing as something distinct: the shapes are common to all contemporary literate cultures of the region. Some of the earliest fragments of writing from ancient Canaan are apparently so small -- on broken shards of pottery -- that it isn't possible to determine the language, and hence it isn't possible to determine if this is Hebrew writing or the writing of some other language that used the same letters.</p>
