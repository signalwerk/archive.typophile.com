      <p>&gt;&gt; I was unaware of all the kabbalistic reasoning behind the forms of the letters as we have them...</p>
      <p>Actually, what I mentioned earlier about the aleph's א numerical association with the Divinity, by investigating the aleph's א graphic parts is but a tip of the proverbial iceberg.</p>
      <p>The very shapes of the Hebrew letters contain much meaning. These insights are not only derived from its shapes and positions, but they are also discovered from the shapes and positions of their white or empty places.</p>
      <p>For example, the basic difference between the chet ח and the hei ה is the small empty space on the left hand upper vertical bar, as if to allow air to be expressed. Similarly, the sound associated with the chet ח is guteral, while the sound associated with the hei ה is soft and airy.</p>
      <p>When Rabbi Akiva, one of the greatest Torah scholars of all times, expounded the meanings of the crowns on the Hebrew letters in the Torah scroll, G-d Al-mighty and his faithful servant Moses listened intently too. Moses began to weep, as he was not privy to this information.</p>
      <p>G-d consoled Moses, by explaining that even these esoteric lessons were derived from the Torah of Moses, as we say: "כל מה שתלמיד ותיק נחדש בתורה, נתחדש בתורה ממשה מסיני" "Everything derived by a great Torah scholar was in deed derived from the Torah of Moses at Sinai".</p>
      <p>Each letter contains amazing insights that defy human reason, and the very language itself is super-rational, proving to anyone who has a brain in his or her head, that Hebrew was not a human invention, like all the other languages of the world.</p>
