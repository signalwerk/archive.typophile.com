      <p>John Savard's post</p>
      <p>&gt;&gt;&gt; ... one just happens to have been one of the lucky ones to have been born into the one faith that contains the true message from God. ...</p>
      <p>Lucky is not the right word. A person determines his or her destiny.</p>
      <p>We are not like fixed angels, or animals, who have no free choice. We choose to do what we want to do. We learned this cruel lesson from the Nazis in Germany.</p>
      <p>Before G-d gave the Torah (from the Hebrew meaning "instruction" [hora'ah הוראה]) through His servant Moses, Moses required the Jews to convert. Why? Weren't they Jewish already?</p>
      <p>As an aside, Moses was one of the greatest tzaddikim, outstanding righteous human beings, of all times. He saw from the beginning of time until the end of time (Rashi). Hence, he saw the entire teachings of Torah, including the Oral Law and all its explanations and guidance from the Talmud and works like it.</p>
      <p>So, he also saw the teaching of the Bible to be kind to converts, because the Jews too were converts.</p>
      <p>The Talmud asserts that every convert is a new person, created on the day of their halachic conversion. So, they have no spirital parents, only physical parents. Their spiritual parents are only our Father who art in heaven. Of course, we must treat them well, for they brought us into this world.</p>
      <p>How can one become so knowledgeable in these matters of Torah, 'revealed' and 'hidden', when I am beginning so late in life?</p>
      <p>To answer this, one must look at the life of a very simple farmer, a descendant of converts himself, called Akiva. He once spotted water dripping slowly upon a rock, forging a growing hole. He reasoned that if water could penetrate a hardened rock, little by little, then Torah could seep into his brain too.</p>
