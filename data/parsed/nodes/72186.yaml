      <p>In Avot 5:5, ten entities are listed that preceded creation. The last three concern us here.</p>
      <p>8. The writing of the Torah Scroll<br>
      9. The inscription on the Tablets<br>
      10. The very Tablets themselves</p>
      <p>This is discussed in the Bible, Exodus 32:16; see Nachmonides' comments there.</p>
      <p>Exodus 32:16<br>
      "The Tablets were a work of G-d; the writing (upon them) was the Writing of G-d, engraved upon (or through) the Tablets".</p>
      <p>See Maimonides' comments on Avot 5:5, in his Commentary on the Mishnah. The Moznaim Publishers of NY and Jerusalem has an English-Hebrew edition, available from <a href="http://www.eichers.com" title="www.eichers.com">www.eichers.com</a>.</p>
      <p>His comments in the Introduction to his Mishnah Torah, in the very beginning, elaborate upon this.</p>
