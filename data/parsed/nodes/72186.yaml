      <p>Well, I view the stuff that Israel talked about in another thread, and is raising again here as "aggadah", stories in Jewish tradition that can be moving, entertaining, or annoying, depending, but not to be taken seriously as literal truths that are a basis for any decision. This is actually the traditional attitude toward them, but not of some mystics and Chassids, like Israel. </p>
      <p>So for example there's the story that "truth" in Hebrew, emet (aleph, mem, tav) is solid as the letters all stand on a stable base, where as "lie" in Hebrew sheker (shin, kof, resh), stand on one leg, and so are unstable—so that the truth will stand and a lie fall down. </p>
      <p>I view this as a nice homily—well not that great, if you want to know the truth, as some lies seem to do pretty well—but not to be taken as some literal divine message about either letter shapes or morals. </p>
      <p>If you bring in history and get real about the history of script, as Michel does, I'm with you, but I don't think Israel is interested in that. The irony is that the Sages were sometimes interested in the history. </p>
      <p>The interesting thing about the mention of the writing, stylus and tablets in Avot 5:9, is that it's to me an attempt of the Rabbis to reconcile the Hebrew Bible with the Greek concept of the "cosmos", a world ordered by natural law. They were disturbed by the events contrary to the order of nature—one kind of miracle in the Torah—in light of the Greek concept, and so said that everything contrary to natural law was actually created in the last moment of twilight before the world was finished, and the first Shabbat began. These miracles include the ten commandments to be discovered by Moses, which this story puts there from the beginning of time—writing, the stylus, and the tablets. At least that's my interpretation. You'll get a different story from Israel :)</p>
