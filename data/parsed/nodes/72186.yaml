      <p>Beis - the 2nd letter of the Hebrew alphabet</p>
      <p>Beis consists of three strokes, like Aleph. One horizontal stroke above, one horizontal stroke below, and one vertical bar connecting them, in the middle.</p>
      <p>Here are some examples: </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Beis'_6204.jpg"></div><p></p>
      <p>The upper horizontal bar is shortened on both the right and the left. The lower horizontal bar is not. This is very noticeable, because the lower horizontal bar protrudes on the right in comparison to the upper horizontal bar which does not. The differences on the left side is not as pronounced, and often overlooked by unobservant type designers.</p>
