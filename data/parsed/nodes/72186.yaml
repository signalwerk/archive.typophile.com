      <p>Back to the Topic</p>
      <p>In all the Alephs, there are some common elements.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Alephs_5906.jpg"></div><p></p>
      <p>There are empty spaces on both the top and bottom.</p>
      <p>There are filled-in spaces, and there are empty spaces. As was explained earlier, the filled-in spaces are three elements: two Yuhd-like forms at the top and bottom of the Aleph, and a Vohv-like center element connecting the two.</p>
      <p>But what do the empty spaces signify?</p>
      <p>In good graphic art, and in artwork in general, empty spaces are carefully placed to allow the viewers eyes to rest, and study the details of the filled-in areas.</p>
      <p>So, the empty spaces are for the filled-in spaces.</p>
      <p>Similarly, the concept applies to the Aleph. How so?</p>
      <p>Emptiness, or a void, comes as a result of "bittul", or self-negation. Usually, "bittul" results from awareness that something greater than oneself exists, and "nullifies" ones sense of self-importance.</p>
      <p>When a human being approaches life with the correct "bittul", life's experiences are different, and ones relationships with family members, friends, and even strangers, is improved.</p>
      <p>So, being filled with emptiness, or "bittul", is for the filled-in space, or us.</p>
      <p>It was explained earlier that the Aleph represents the union of the Yuhd above, namely G-d, with the Yuhb below, us people. How is this achieved? It is achieved through the Vahv, the middle stem connecting that which is above, ie. spiritual, with that which is below, that which is physical.</p>
      <p>But nothing can be truly achieved without the carefully placed empty spaces, representing "bittul". When a person "nullifies" himself or herself, then it is possible to accept, in this case, that which is above.</p>
      <p>Really, isn't this true in life, too?</p>
      <p>When a person "nullifies" himself or herself, then it is possible to accept another person.</p>
      <p>This is the Divine lesson of the Aleph.</p>
