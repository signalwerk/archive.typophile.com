      <p>Israel, there is no single standard numbering for Avot. The way it is usually numbered in the Siddur and the way it is numbered in the Mishnah is different. I was using the Siddur numbering above. </p>
      <p>Though that mishnah is clearly talking about the Decalogue or "Ten Commmandments" in Avot, it doesn't say that the language was Hebrew. I take "ketav" to mean "script", with no particular script necessarily meant. In fact, if I remember correctly, the Rabbis discuss in the Talmud whether the Decalogue was in an Egyptian dialect, which Moses may have spoken, as the Sages knew that Hebrew was the language of Canaan. (Sorry I don't have the citation.) Abraham, the ancestor of the Jews in Egypt, may have spoken Aramaic at home, as he came originally from Babylonia, even though he spent a long time in Canaan. </p>
      <p>As as liberal Jew, I'm sure my standards for judging these things are going to be very different from yours, so I doubt this is worth going into further. I'm willing to accept some divine inspiration for writing, but doubt that any particular script is privileged.</p>
