      <p>I now have done a CD ROM search for the word "ashurit" in in the Talmud, which comes up with 16 hits in the Soncino Talmud (includes footnotes, I think).</p>
      <p>Nowhere that I can see has the ridiculous equivalence of ashurit and ashir. </p>
      <p>There are two passages in the Talmud Bavli where the issue of ancient Hebrew writing vs the Assyrian script is discussed: Megilah 8b-9a, and the passage given by Michel and me, Sanhedrin 21b, which goes on to 22a—about which more in a moment.</p>
      <p>In the passage in Megilah 8b, that two different scripts are discussed is even more clear, but it is rather a rather complex discussion, as they are trying to make sense of an older ruling, which it is clear that they don't totally understand—perhaps because they lost an understanding of 'ketav ivri' as paleo-Hebrew, which the old passage refers to. </p>
      <p>In the continuation of the Sanhedrin passage to 22a, there is actually some support for Israel's general view, but not with his ridiculous argument that ashurit = ashir. </p>
      <p>Here in 22a, it starts "Why is it called Ashshurith?—Because it came to them from Assyria." There's a recognition of the real history. However, Rabbi (Yehuda haNasi) has an opinion that supports Israel S: "The Torah was originally given to Israel in this [Ashshurith] writing. When they sinned, it was changed to Ro'az. But when they repented, the [Assryian characters] were re-introduced ..."</p>
      <p>In other words, Rabbi knows that at one time a different script was used, but he wants to regard the then current one (turn of the third century) as the only sacred one. Thus he says that the original was the Assyrian script, that only after sinning was the paleo-Hebrew--here referred to as Ro'az--introduced. Then after the first temple had fallen because of the Israelite sins, and the Israelites repented, and were allowed to return to Zion, they got back the Assyrian script. So Ezra's institution of writing the Torah in Assyrian characters was a restoration! </p>
      <p>Another Rabbi, Shimon ben Eliezer, is quoted as saying the writing never changed at all. </p>
      <p>Yehuda haNasi's theory frankly seems forced to me, but he is certainly a great Rabbinic authority, so Israel has license to go his merry way with his theories. </p>
      <p>But please, some better scholarship.</p>
