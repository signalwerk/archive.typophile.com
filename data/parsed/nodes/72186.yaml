      <p>I think that the Unicode for Burmese, for example, should follow the normal practice for Burmese character sets, instead of trying to be a sterling example of Unicode purism - when other languages have more easily usable representations because they are more glyph-oriented.</p>
      <p>And if Arabic can get glyphs for its initial, medial, final, and isolated forms in a special region of Unicode, clearly other languages from which glyphs are excluded for good reason should also get that treatment as well.</p>
      <p>Of course, while Unicode is nice, it's not really what people want. What they want is something nice and simple to use - something that is, in essence, 16-bit ASCII. And in order to keep all the world's languages, with generous use of glyphs, within 16 bits... CJK characters (and other large-set characters, such as cuneiform and hieroglyphics) would be made from two consecutive 16-bit characters, much as they used to be made from two consecutive 8-bit characters.</p>
