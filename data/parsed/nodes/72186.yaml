      <p>The article (Smashing Magazine: <a href="http://www.smashingmagazine.com/2010/06/22/the-beauty-of-typography-writing-systems-and-calligraphy-part-2/" title="http://www.smashingmagazine.com/2010/06/22/the-beauty-of-typography-writing-systems-and-calligraphy-part-2/">http://www.smashingmagazine.com/2010/06/22/the-beauty-of-typography-writ...</a>) states that the Hebrew alphabet is a descendant of the Aramaic, which is itself a descendant of the Phonecian alphabet. Since there are so many laws surrounding the writing of the Torah, in that it must be copied from another scroll, wouldn't that make the Hebrew alphabet at the latest from year ~1300 BCE? Wouldn't that predate Aramaic by ~300 years, as well as make it about/at least as old as the Phonecian alphabet?</p>
