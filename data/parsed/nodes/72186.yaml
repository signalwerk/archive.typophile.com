      <p>&gt;my alphabet is better than your alphabet</p>
      <p>Well, that's Israel's view. I think it's not justified even by Talmudic standards, aside from its being silly and a bit offensive. </p>
      <p>As to the awe people have for writing, and John's other stories of divine origin. For me personally I see some divinity in human creativity, so I'm willing to go there in saying that the invention of written language, including alphabetic scripts, has some divine inspiration. But narrowing it to one particular script seems to me, well, narrow. </p>
      <p>I'm all for giving the ancient Hebrews the credit where it's due, such as for the invention of the Sabbath (or discovering God's will concerning the Sabbath, if you want to put it the Orthodox Jewish way, as Israel would.) </p>
      <p>But as for the invention of writing, it just won't fly. According to <a class="freelinking external" href="http://en.wikipedia.org/wiki/History_of_the_alphabet" rel="nofollow">what I have read</a>, the invention of alphabetic language is probably a result of simplification of a version of a version of hieroglyphics known as hieratic script. And both hieroglyphics and cuneiform were around for a thousand years before alphabetic scripts. And Chinese script evolves on a separate track. </p>
      <p>Also personally, I find the "solution" to the problem of Biblical miracles in Avot 5:9 pretty weak. It's something like the late 19th century theory that God put created the world in six days with dinosaur bones in the ground. Clever, but not credible.</p>
