      <p>Dear xxxx,</p>
      <p>The comprehensive Jewish perspective on anything encompasses both the historical proofs of scientific evidence, known as 'secular knowledge', and knowledge provided to us in Talmudic and Kabbalistic information.</p>
      <p>Often, secular knowledge is not accurate because by ignoring religious knowledge, incorrect inferences are made, as we find with this silly notion that Hebrew originated with Aramaic.</p>
      <p>The Talmud states that the Hebrew letter forms are of Divine origin, unlike the languages and letter sets of all the other nations of the world. Anyone who has studied Hebrew grammar sees clearly that Hebrew is a pure mathematical and extremely logical language. Its letter forms are like fascinating pieces of artwork. Each letter thoughtfully designed, and is embued with rich numerical meanings.</p>
      <p>Let's look at the first letter of the Hebrew alphabet, or aleph beis אלף בית. This letter is called, א. It is called by this name, because the first Hebrew letter represents the Premier Force of the Universe, אלופו של עולם. Why?</p>
      <p>Let's investigate.</p>
      <p>The 'aleph' א has three pieces two 'yuhd'-like י shapes on the upper right, and the lower left (reversed both horizontally and vertically), and the 'vov'-like ו shaped in the middle.</p>
      <p>These shapes represent G-d Above (the yuhd-like י shape on the upper right - yuhd י equals ten, for the ten Sephirot or Divine Attributes), human being below (the yuhd-like י shape on the bottom left - yuhd י equals ten, for the ten corresponding Midot מידות, or Attributes), and in the middle, connecting the top and the bottom is the vov-like ו shaped in the middle, which equal six.</p>
      <p>All together, the three parts of the 'aleph' א equals twenty-six, which is the holy Name of G-d י-הוה (which we do not spell out, or pronounce). So, we see that the aleph א in deed represents G-d, the Premier Force of the Universe, אלופו של עולם.</p>
      <p>Regards,</p>
      <p>Israel</p>
      <p>PS I seek to post this, as it addresses a basic point about the origins of Hebrew.</p>
