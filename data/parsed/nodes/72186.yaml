      <p>Michel's post</p>
      <p>&gt;&gt;&gt; According to <a href="http://www.mezuzah.net/scripts.html" title="http://www.mezuzah.net/scripts.html">http://www.mezuzah.net/scripts.html</a>, the talmud tells that the "ktav ashuri" (the "assyrian script") is to be used for mezuzot, tefilin and sifrei torah; the same site shows a sample of "ktav ivri", "hebrew script", which was quite different, and in common usage during the period of the first temple. </p>
      <p>Israel (new): First, when the Talmud describes "ktav ashuri", it clearly says it's not the "assyrian script", but that which "rich" (like Ashur or an asher).</p>
      <p>Likewise, "ktav ivri" is generic. </p>
      <p>&gt;&gt;&gt; Interestingly enough, in this text from the dead sea scrolls, <a href="http://www.ancient-hebrew.org/31_psalm138.html" title="http://www.ancient-hebrew.org/31_psalm138.html">http://www.ancient-hebrew.org/31_psalm138.html</a>, the tetragrammon is written with a variant of the "ktav ivri" (called "middle hebrew" by the author of the site) whereas the rest of the text is not.</p>
      <p>Israel (new): Study closely your exmamples. </p>
      <p>The Biblical text from the Dead Sea Scrolls are a variant of the classic Hebrew square letter face. It was not what you call "ktav ivri".</p>
      <p>In my view, there are only two groupings: the square letter and the "rich" letter. The script or rounded letter, as in that which is called "Rashi" was created by Bomberg to fit wordy commentaries beside wider Biblical or Talmudic text. </p>
      <p>The handwriting fonts or those script faces used in invitations are meant to mimick hand written documents.</p>
      <p>In the samples which I saw at Hadassa Hospital in Jerusalem, Israel when I was a child about 40 years ago, the Biblical samples had nikkud, if my memory serves me well.</p>
      <p>&gt;&gt;&gt; It is also interesting to compare the "ktav ivri" of <a href="http://www.mezuzah.net/scripts.html" title="http://www.mezuzah.net/scripts.html">http://www.mezuzah.net/scripts.html</a> to the phoenician alphabet, unicode range 10900-1091F, <a href="http://www.unicode.org/charts/PDF/U10900.pdf" title="http://www.unicode.org/charts/PDF/U10900.pdf">http://www.unicode.org/charts/PDF/U10900.pdf</a>.</p>
      <p>Your "ktav ivri", like the phoenician alphabet, is very different from the classic Hebrew letter, even in the Dead Sea Scrolls sample.</p>
      <p>Just because scholars blabbered this, and even got it printed, is not indicative that it's right.</p>
