      <p>Israel, I'm not finding any speculation on whether the script on the tablets was not Hebrew. But there is a discussion in the Jerusalem Talmud (Meg. 1:11 71c) on it being in the ancient Hebrew script, not the currently used "ketav ashuri", the Assyrian script. The rabbis of the Talmud were well aware that the current script was not the original, and they ascribed the adoption of the current, very different script, which originated in Babylonia, where they had been exiled, to Ezra. </p>
      <p>The point is, even if you read Avot 5:9 as claiming that God invented the script on the  Tablets of the Ten Commandments, and it was Hebrew, it wouldn't have been our current script. </p>
      <p>I believe, but I don't have the reference that the Rabbis were aware that Hebrew was originally the language of Canaan, as John notes, and it wouldn't have been Abraham's mother tongue.</p>
