    html: "<p>1) A face that doesn't have enough room for smallcaps between the x-height and the fullcap-height isn't a text font, so naturally Regularity becomes/can_become more important - you can freely sacrifice readability. <br>2) There's virtually zero harm in confusing smallcaps with fullcaps (I mean in their usual usage of acronyms in running text, as opposed to fancy titling), while there is in confusing them with lc. <br> <br>So you could conclude that a font with a huge x-height doesn't need smallcaps that much. <br> <br>And I personally would go further: a good text face has very short caps (much shorter than current -or past- convention) - it doesn't need smallcaps, at least not that much - there are [generally] more important things to worry about. Not least because virtually nobody uses smallcaps, even if the font has it right under their noses... <br> <br>&gt; +0.2pt <br> <br>I don't know how much larger they need to be - it simply has to be a visible difference, in fact some distance into the parafovea. BTW, it's interesting that the smaller the point size the larger the absolute difference necessary. The problem here is that at very smaller point sizes the x-height needs to be larger too - I guess one could conclude that smallcaps have little place in tiny typography. <br> <br>hhp <br></p>"
    html_clean: "<p>1) A face that doesn't have enough room for smallcaps between the x-height and the fullcap-height isn't a text font, so naturally Regularity becomes/can_become more important - you can freely sacrifice readability. <br>2) There's virtually zero harm in confusing smallcaps with fullcaps (I mean in their usual usage of acronyms in running text, as opposed to fancy titling), while there is in confusing them with lc. <br> <br>So you could conclude that a font with a huge x-height doesn't need smallcaps that much. <br> <br>And I personally would go further: a good text face has very short caps (much shorter than current -or past- convention) - it doesn't need smallcaps, at least not that much - there are [generally] more important things to worry about. Not least because virtually nobody uses smallcaps, even if the font has it right under their noses... <br> <br>&gt; +0.2pt <br> <br>I don't know how much larger they need to be - it simply has to be a visible difference, in fact some distance into the parafovea. BTW, it's interesting that the smaller the point size the larger the absolute difference necessary. The problem here is that at very smaller point sizes the x-height needs to be larger too - I guess one could conclude that smallcaps have little place in tiny typography. <br> <br>hhp <br></p>"
