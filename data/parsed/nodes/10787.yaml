    html: <p>&gt; They look cramped <br> <br>That's a good point, although I don't think it's a huge factor; some lc letters are more cramped than most UC letters. <br> <br>-- <br> <br>a) I think larger size is in fact the best way to disambiguate them. And actually, I prefer somewhat large smallcaps. <br>b) The difference in structure is secondary, especially during immersive reading - in the same way that an upright italic simply doesn't work. <br>c) Most, yes - all, no. Think Maest.  :-) <br>d) Readability. And what's gained by making the smallcaps x-height, Regularity? A succubus. <br> <br>hhp <br></p>
