    html: <p><a href="http://www.typofonderie.com/gazette/ImagesGazette/GazRsc.Gif" target="_blank">http://www.typofonderie.com/gazette/ImagesGazette/GazRsc.Gif</a> <br> <br>If this old image can help?! <br>the yellow R is the capital, the small R outline is the small caps version, and the bolder outline is the same R small caps enlarged at the size of R capital. <br> <br>On this example, the lc is missing to achieve a perfect demo. <br> <br>When I design SC, I start generally with a close to perfect balance between lc and cap weight, then, interpolation between the regular and bold original caps, then, redesign of all serifs. I make most of them wider, more open with generally lower contrast between the letter widths. The eyes still the best judge at the end. Note that the OsF figures match the SC in weight and size.</p>
    html_clean: <p><a href="http://www.typofonderie.com/gazette/ImagesGazette/GazRsc.Gif" target="_blank" class="link-external">http://www.typofonderie.com/gazette/ImagesGazette/GazRsc.Gif</a> <br> <br>If this old image can help?! <br>the yellow R is the capital, the small R outline is the small caps version, and the bolder outline is the same R small caps enlarged at the size of R capital. <br> <br>On this example, the lc is missing to achieve a perfect demo. <br> <br>When I design SC, I start generally with a close to perfect balance between lc and cap weight, then, interpolation between the regular and bold original caps, then, redesign of all serifs. I make most of them wider, more open with generally lower contrast between the letter widths. The eyes still the best judge at the end. Note that the OsF figures match the SC in weight and size.</p>
