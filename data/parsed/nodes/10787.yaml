    html: <p>Good catch. I was sloppy. <br> <br>The first part assumes conventional proportions - caps slightly smaller than ascenders. Which is why when x-height/cap-height is too large, so is x-height/ascenders (a key factor in readability). In fact my proposal (making caps notably smaller than ascenders) goes hand-in-hand with reducing the necessity of smallcaps. Is that clearer? <br> <br>BTW, I think necessity is simply relative. An ideal face will have smallcaps (even if the x-height is large), but to me it's much more important to have sized masters, for example - which very few people do. Too many people are making smallcaps (not to mention the dreaded Unicase) instead of spending the time on more important things. And it seems to be a peer-pressure situation. <br> <br>hhp <br></p>
    html_clean: <p>Good catch. I was sloppy. <br> <br>The first part assumes conventional proportions - caps slightly smaller than ascenders. Which is why when x-height/cap-height is too large, so is x-height/ascenders (a key factor in readability). In fact my proposal (making caps notably smaller than ascenders) goes hand-in-hand with reducing the necessity of smallcaps. Is that clearer? <br> <br>BTW, I think necessity is simply relative. An ideal face will have smallcaps (even if the x-height is large), but to me it's much more important to have sized masters, for example - which very few people do. Too many people are making smallcaps (not to mention the dreaded Unicase) instead of spending the time on more important things. And it seems to be a peer-pressure situation. <br> <br>hhp <br></p>
  - id: 67858
