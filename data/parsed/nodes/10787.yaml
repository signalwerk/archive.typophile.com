    html: "<p><i>&gt; Small caps are designed heavier  <br>And wider. I'm not sure why.</i> <br> <br>They look cramped if they're not, no? Also, as  <br>you'd try to open the counters a bit that would mean  <br>a wider shape in general. And set more open too. <br> <br><i>&gt; depends of course on the original proportions  <br>Yes, but it also depends on readability/legibility:  <br>the primary modern-day use of smallcaps is in fact not  <br>with \"tallcaps\", it's as acronyms in running text - as  <br>a result strings like \"SC\" or especially \"OS\" (since  <br>it's a pseudo-word) cause a handbrake.</i> <br> <br>Good point, but <br>a) is the small difference in height you propose, especially  <br>at small sizes, of any use in this distinction? <br>b) or, better, isn't the difference in shape, proportions and <br>spacing in \"traditional\" small caps more visually meaningful  <br>than this small difference in height? <br>c) doesn't context take care of most ambiguities anyway? <br>d) is anything lost?</p>"
    html_clean: "<p><i>&gt; Small caps are designed heavier  <br>And wider. I'm not sure why.</i> <br> <br>They look cramped if they're not, no? Also, as  <br>you'd try to open the counters a bit that would mean  <br>a wider shape in general. And set more open too. <br> <br><i>&gt; depends of course on the original proportions  <br>Yes, but it also depends on readability/legibility:  <br>the primary modern-day use of smallcaps is in fact not  <br>with \"tallcaps\", it's as acronyms in running text - as  <br>a result strings like \"SC\" or especially \"OS\" (since  <br>it's a pseudo-word) cause a handbrake.</i> <br> <br>Good point, but <br>a) is the small difference in height you propose, especially  <br>at small sizes, of any use in this distinction? <br>b) or, better, isn't the difference in shape, proportions and <br>spacing in \"traditional\" small caps more visually meaningful  <br>than this small difference in height? <br>c) doesn't context take care of most ambiguities anyway? <br>d) is anything lost?</p>"
