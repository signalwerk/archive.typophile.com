    html: "<p>&gt; Small caps are designed heavier <br> <br>And wider. I'm not sure why. It could be because: <br> <br>&gt; depends of course on the original proportions <br> <br>Yes, but it also depends on readability/legibility: the primary modern-day use of smallcaps is in fact not with \"tallcaps\", it's as acronyms in running text - as a result strings like \"SC\" or especially \"OS\" (since it's a pseudo-word) cause a handbrake. <br> <br>BTW: <br>\"Suck\" was me, and I gave the example of the [otherwise superb] Proforma. <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; Small caps are designed heavier <br> <br>And wider. I'm not sure why. It could be because: <br> <br>&gt; depends of course on the original proportions <br> <br>Yes, but it also depends on readability/legibility: the primary modern-day use of smallcaps is in fact not with \"tallcaps\", it's as acronyms in running text - as a result strings like \"SC\" or especially \"OS\" (since it's a pseudo-word) cause a handbrake. <br> <br>BTW: <br>\"Suck\" was me, and I gave the example of the [otherwise superb] Proforma. <br> <br>hhp <br></p>"
