    html: "<p><i>a) I think larger size is in fact the best way to disambiguate  <br>them. And actually, I prefer somewhat large smallcaps.</i> <br> <br>What I wrote: \"In faces with a <b>large</b> x-height they'll  <br>probably look better if they're the same height as the lc\" <br>If you make them even larger, couldn't you be running the  <br>opposite risk: getting too close to the UC? <br> <br><i>b) The difference in structure is secondary, especially  <br>during immersive reading - in the same way that an upright  <br>italic simply doesn't work.</i> <br> <br>Oh, and +0.2pt in size will work in immersive reading? <br> <br><i>c) Most, yes - all, no. Think Maest. :-)</i> <br> <br>Not a good example. We're talking here about letters that are <br>supposed to have 100% decipherability to begin with. ;) <br> <br><i>d) Readability. And what's gained by making the smallcaps  <br>x-height, Regularity? A succubus.</i> <br> <br>Beter a succubus than an incubus...  :/</p>"
