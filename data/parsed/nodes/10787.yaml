    date: 2003-03-23T19:18:00
    date_raw: 23 Mar 2003 — 7:18pm
    votes: null
    html: "<p>Ooh, I have a question on this topic too: Are small caps meant to be used with full-sized caps? I notice that the full size caps often look heavier and does not seem to go all that well with the small caps. <br> <br>Someone also said that when they are not slightly taller than the lowercase characters, they suck. And I tend to agree, although \"suck\" is a strong word. <br> <br>It's somewhere on this forum. I just can't find it now. </p>"
