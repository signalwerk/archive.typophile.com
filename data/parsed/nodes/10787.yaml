  html: <p>I've been on a small caps binge and want to make sure I'm using them appropriately and well.  <br> <br>What should I know? <br> <br></p>
  html_clean: <p>I've been on a small caps binge and want to make sure I'm using them appropriately and well.  <br> <br>What should I know? <br> <br></p>
