  - id: 67849
    user: 916
    date: 2003-03-23T20:00:00
    date_raw: 23 Mar 2003 — 8:00pm
    votes: null
    html: "<p>Small caps are designed heavier than what a scaled-down <br>version of the full caps would be(*) exactly so that <br>the composition has an even color - i.e. the full caps  <br>don't \"look heavier\" (except to the extent that they  <br>naturally should, if it's the case). <br> <br>Also, about proportions: a sweeping comment like \"when  <br>they are not slightly taller than the lc characters, they  <br>suck\" doesn't make much sense. It can often be the case,  <br>but depends of course on the original proportions of UC/lc  <br>to begin with. In faces with a large x-height they'll  <br>probably look better if they're the same height as the lc. <br> <br>(*) This is not the only difference between a small-cap  <br>and a scaled-down full cap.</p>"
    html_clean: "<p>Small caps are designed heavier than what a scaled-down <br>version of the full caps would be(*) exactly so that <br>the composition has an even color - i.e. the full caps  <br>don't \"look heavier\" (except to the extent that they  <br>naturally should, if it's the case). <br> <br>Also, about proportions: a sweeping comment like \"when  <br>they are not slightly taller than the lc characters, they  <br>suck\" doesn't make much sense. It can often be the case,  <br>but depends of course on the original proportions of UC/lc  <br>to begin with. In faces with a large x-height they'll  <br>probably look better if they're the same height as the lc. <br> <br>(*) This is not the only difference between a small-cap  <br>and a scaled-down full cap.</p>"
