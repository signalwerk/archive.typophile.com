  html: <p>Downloaded the demo version of Font RMX Tools today and tried out the Harmonizer.  It didn't really seem to change much.  Am I missing something here?  Is this only designed to work on glyphs with a lot of extra points, or only incredibly ugly ones or something?  I tried it out on some glyphs that had already been manually optimized and nodes moved to extremes, but still had some ugly to my eye curves, and really nothing at all changed.</p>
