    html: "<p>The harmoniser will optimise the curve mathematics of the curves you have: it won't make ugly curves into beautiful ones, it will just make them optimised ugly curves. I find it most useful when a curve is pretty much how I want it to be, where it will just refine slightly the node positions to make a smoother transition between the curve segments. If the harmoniser causes a really large change, that's generally a sign that your curve is not well constructed to begin with, so in general you don't really want it to do very much.</p>"
