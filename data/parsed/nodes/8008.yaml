    <p>Anyone know of, or have had any experience with a really good large format printer? (not the giant print stations for 10k aprox. :P) I'm in the market for one at the moment, and i don't realy care for the price i just dont want any f**k ups if you know what I mean. Ive read some reviews and i just stray away from anything with major mechanical problems in the long run. So now im kinda stranded. Currently I'm reviewing the Canon i9900 or i9100, but that's all I've seen so far, and i have'nt found any decent practical reviews on them realy. ( maybe its a good thing because theres nothing bad about them :D ) <br>Suggestions ?</p>
