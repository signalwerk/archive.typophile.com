    <p>Press / Colleagues / Clients!</p>
    <p>Today we introduce Typopixo.</p>
    <p>A new typefoundry specialized in multi-color webfonts.<br>
    A beautiful and colorful collection of fonts from talented typedesigners and lettering artists from all over the world.<br>
    Beautiful to use &amp; easy to install.<br>
    Brighten up your blog, website or app!<br>
    Please have a look at the website and download a free font for testing.<br>
    <a href="http://www.typopixo.com/" title="http://www.typopixo.com/">http://www.typopixo.com/</a><br>
    One small step for webtypography - a giant leap for colorlovers!</p>
