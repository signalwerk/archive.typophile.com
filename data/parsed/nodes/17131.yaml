  html: |-
    <p>Nike uses <a href="http://www.characters.nl/" target="_blank" rel="nofollow">Insider Regular Roman</a> as textfont for their Annual Report 2005.<br>
    <a href="http://www.nike.com/nikebiz/investors/annual_report/ar_05/docs/2005_annual_report.pdf" target="_blank" rel="nofollow">Download</a> the Annual Report 2005 from Nike directly as pdf and see for yourself. Or download it from <a href="http://www.characters.nl/downloads/2005_annual_report.pdf" rel="nofollow">Characters Font Foundry</a>.</p>
    <p>Too bad they didn't ask me for the Insider Regular Roman LF, because the Insider Regular Roman they bought has old style figures. I have a font ready with lining figures that they could use immediately. In stead they used Helvetica for all the numbers! My god, they must love Insider, otherwise who else would go through all this trouble to change ALL the numbers into another font? ;-)<br>
    I tried contacting the designer at Nike, but without any luck.</p>
    <p>If anyone comes across a printed sample, I'd love to have one. You find my <a href="http://www.characters.nl/" target="_blank" rel="nofollow">address</a> on the website. Please send me a copy.</p>
    <p>This is the old thread about Insider: <a href="http://typophile.com/node/4094" title="http://typophile.com/node/4094">http://typophile.com/node/4094</a></p>
    <p>Best regards,<br>
    ®ené Verkaart</p>
