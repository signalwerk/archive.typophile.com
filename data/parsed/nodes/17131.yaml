    html: "<p>Congrats René. As for the numerals: There are SEC (Securities &amp; Exchange Commission) rules regarding the typesetting of financial statements, with very specific uses of indents, thickness of underlines, etc. And tabular figures are called for to make clear and perfectly-aligning financial tables. The Oldstyle versus Lining issue was probably a factor, but not as much as the Proportional versus Tabular.</p>"
