    date: 2006-01-11T13:10:00
    date_raw: 11 Jan 2006 — 1:10pm
    votes: null
    html: |-
      <p>Si, I can't put my hands to any document of regulations, but I'm sure they're out there on the internets. (When I was a graphic designer, I worked on a trio of annual reports, and all attempts at typographic styling in the financials section were completely shot down by the client due to the SEC requirements. When I then went and looked at other annuals, I noticed that all of the financials were typeset exactly the same way.)</p>
      <p>So, make sure that your typefaces have tabular figures, and that the width is the same in all weights. And include figurespace (uni2007) and figuredash (uni2012) in your fonts.</p>
      <p>By the way, 2006 is the Unicode index of the six-per-em space. Happy six-per-em space year, everyone.</p>
