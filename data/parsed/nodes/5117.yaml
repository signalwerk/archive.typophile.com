    html: <p>David and Steve are right, most printers will not be able to deliver what you've designed. It's not the tick marks bleeding off the edge, it's the lines adjacent to the 0 and 9 that are the real trouble.  <br> <br>You should have these made by a company that makes nameplates. I haven't used them before, but the folks at <a href="http://www.lustrecal.com/namep.html" target="_blank"> Lustre Cal</a> are very nice and their samples looked great.  <br> <br>Wouldn't this card be great in selectively anodized aluminum?</p>
