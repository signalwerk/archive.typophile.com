    html: <p>I just wingin it here, <br>Your identity seems like it is on the right track but I do have a few suggestions. Take em' or leave em'. First, I feel that the 3 dementional logo doesn't relate to the ruler idea which you are presenting on the back of the card. When I think of metric I think of the centimeter(singular) which you have used as a graphic element on the back. I don't think of three dementional space as much. Basically what I am trying to say is that there might be to many things going on on this card. I wish there was a way to integrate the centimeter scale idea with the logo. You know.. it's early in the morning so if I am not making any sense I am terribly sorry. Oh! have you tried just using 1 centemeter unit for the logo. The lines of the centemeter kind of look like an M for metic. Anyway I hope some of that makes sense.</p>
