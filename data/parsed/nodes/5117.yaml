    html: <p>"I don't mean to put a wrench in things, but am I the only one interpreting this mark in an unintended way?" <br> <br>Maybe, but I think the word Metric would 'snap' the concept back pretty quickly if you saw it. <br> <br>I think the tick marks, alone, work best. Forcing the M is unecessary, IMHO. It doesn't need to literally read 'M' but it's a nice 'aha!' if the person sees it. <br> <br>As for the lines on the 0 and 9, just get rid of them (like a tape measure) or don't have the ruler go all the way to the edge (like a school wood ruler). <br> <br> <br></p>
