  date_raw: 7 Jun 2004 — 4:41pm
  votes: null
  html: <p>Good day.  Here is a logo for my own business that I woul like to be critiqued.  I'm starting up some freelance work since I've just finnished school and I need an identity.  I choose Metric Design, since I am a canadian living in the US and the name suggests a different way of looking at things.  I basically settled on a geometric shape(s) in the form of an "M" and simple text for the logo (eurostile).  Here it is on what I would like to be my business card.  Its fairly narrow of a card, 4cmx9cm.  It is all pantone metallic silver ink, because I want it to look like a ruler.  There is a diecut circle like most aluminium rulers have (which I will be doing myslelf after print, with a simple handheld holepunch), and on the back is an actual ruler in centimeters with a small conversion chart for cm to inch. <br>I want it printed on a very heavy stock paper.  What do you think?  I would love coments and critisisms.  Thankyou. <br><img src="http://www.typophile.com/forums/messages/29/37729.jpg" alt="Metric Business Card"></p>
  html_clean: <p>Good day.  Here is a logo for my own business that I woul like to be critiqued.  I'm starting up some freelance work since I've just finnished school and I need an identity.  I choose Metric Design, since I am a canadian living in the US and the name suggests a different way of looking at things.  I basically settled on a geometric shape(s) in the form of an "M" and simple text for the logo (eurostile).  Here it is on what I would like to be my business card.  Its fairly narrow of a card, 4cmx9cm.  It is all pantone metallic silver ink, because I want it to look like a ruler.  There is a diecut circle like most aluminium rulers have (which I will be doing myslelf after print, with a simple handheld holepunch), and on the back is an actual ruler in centimeters with a small conversion chart for cm to inch. <br>I want it printed on a very heavy stock paper.  What do you think?  I would love coments and critisisms.  Thankyou. <br><img src="http://www.typophile.com/forums/messages/29/37729.jpg" alt="Metric Business Card"></p>
