    html: "<p>I think your post from Wednesday, June 09, 2004 - 1:43 pm is working, and would be fine as an icon that doesn't bleed. Your later attempts to make the ruler look too much like a stand alone m get to far from the original idea. <br> <br>As for printing, if you want a silver background, consider printing black on a silver paper. Chances are your production run is pretty small so using an expensive paper might be cheaper/better than two inks, or a double hit of silver etc. <br> <br>Finally, the font. I vote an emphatic no on eurostile. It looks old and tired. Here are some alternatives to consider: <br> <br><a href=\"http://houseind.com/house.php?kit=SIMIAN-FO&amp;sub=view\" target=\"_blank\">Simian</a> <br><a href=\"http://www.myfonts.com/fonts/fontfont/fago-extended/\" target=\"_blank\">Fago Extended</a> <br><a href=\"http://www.foundrytypes.co.uk/\" target=\"_blank\">Foundry monoline</a> <br> <br>These provide more flexibility to expand your identity. <br>Good Luck! <br> <br>Randy</p>"
