    html: <p>I agree with Dan, If you don't literally make small rulers out of metal the concept will seem almost incomplete. Try what Dan said about placing the metric m in silver on a white background. You might find that the flexiblity of your identity will instantly change. If you are still married to metalic inks you could coat the back of the card with solid silver. You would still be implying the ruler surface and without getting into overkill land. Raise this question to yourself. Are you trying to develop a ruler or a buisness card? They both serve two completely different functions.</p>
