    html: <p>I have successfully printed metallics (meaning there was still noticeable reflective qualities) on uncoated stock, but I will admit that there is a much greater reflection/sheen on most coated stocks. The best thing to remember when going for that sheen is to flood large areas with the metallic ink, which you are doing here. <br> <br>BTW, I like  your sphere logo. I would be interested, however, in seeing what you might come up with by following the recommendations from David and Darrel. <br> <br>Aloha! <br>Scott</p>
