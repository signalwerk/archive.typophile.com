    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Giovanni Mardersteig</strong></p>
    <p>Giovanni Mardersteig (1892-1977) was an influential typographer, designer, and printer, best known for his work at the <a href="/wiki/Officina%20Bodoni" class="freelinking" rel="nofollow">Officina Bodoni</a> in Verona. His typefaces include Dante, Fontana, Griffo, Pacioli, and Zeno. Of these, unfortunately only Dante is available in digital form today. Dante is considered one of the most exceptionally beautiful text faces available.</p>
    <p>Source: <a href="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Mardersteig/GMardersteig.pdf" rel="nofollow">Biography</a> at the Klingspor Museum, Offenbach.</p>
    <p><a href="http://www.textism.com/textfaces/?id=17" rel="nofollow">Dante</a> at textism: twenty faces.</p>
