    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Giovanni&nbsp;Mardersteig</strong></p>
    <p>Giovanni Mardersteig (1892-1977) was an influential typographer, designer, and printer, best known for his work at the <a href="/node/add/wiki?edit%5Btitle%5D=Officina%20Bodoni" title="Create node &quot;Officina Bodoni&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Officina Bodoni</a> in Verona. His typefaces include Dante, Fontana, Griffo, Pacioli, and Zeno. Of these, unfortunately only Dante is available in digital form today. Dante is considered one of the most exceptionally beautiful text faces&nbsp;available.</p>
    <p>Source: <a href="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Mardersteig/GMardersteig.pdf">Biography</a> at the Klingspor Museum,&nbsp;Offenbach.</p>
    <p><a href="http://www.textism.com/textfaces/?id=17">Dante</a> at textism: twenty&nbsp;faces.</p>
