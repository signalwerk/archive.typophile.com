    <p>I just read that a letterpress simulator called LetterMpress is being developed. It will be released first for iPads. You'll place and arrange type on a press bed, lock the type, ink the type, and print. You can print your design or export to other applications.</p>
    <p>Apparently the developer is trying to raise development funds through KickStarter. (I have no connection to this project; I just thought it looked interesting.)</p>
    <p>More info and video demo: <a href="http://tinyurl.com/4tm2ke9" title="http://tinyurl.com/4tm2ke9">http://tinyurl.com/4tm2ke9</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/letterpress_5295.jpg"></div><p></p>
