      <p>David, I think you've got it right. The plan is for them to take your iPad layout, set it up in wood and/or metal type, and print it using  the ink and paper you chose from their menu. It seems they're still trying to raise enough money to buy more type to offer users more variety (and so they're less likely to run out of <strong>Z</strong>s).<br>
      What I like about the interface is that it shows users how letterpress works, and lets them experience (in a clean-fingered way) the limitations and the possibilities of the medium. And once LetterMPress is able to make printed copies, users can show all their hipster buddies what real printing looks like.</p>
    html_clean: |-
