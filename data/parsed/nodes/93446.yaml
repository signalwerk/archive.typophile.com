      <p><em>    an archaic unit of liquid measure, equivalent to a quarter-pint.</em></p>
      <p>I guess British binge drinking is what made that obsolete.</p>
      <p>The last time I was in London, they served hard liquor by the gill or half-gill, which made a shot a little stiffer than most you would get in an American bar.</p>
      <p>Which is no real surprise: American merchants have been semantically short-changing their customers since before the republic began. “A pint’s a pound the world around”; in Britain, a pound used to be twenty shillings, and so a pint was twenty ounces; in America, a pound is sixteen ounces, so a pint is sixteen ounces. And so it goes with a great many things…</p>
