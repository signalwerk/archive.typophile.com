      <p>?<br>
      I don't know what rules apply in general, and what rule applies here but in "Gill sans" the word "sans" cannot be a preposition, it is not in a conjunctive locution and I don't see how it can be considered to be used adverbially. So, what is it to be French? If it is short for "sans-serif" then the sound "s" might be justified, but I am claiming nothing.</p>
