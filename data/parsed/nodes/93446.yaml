      <li>1927 A. J. WATKINS <em>Advert. Lay-out &amp; Copy-writing</em> 116/2 <em>Serifs,</em>‥not present on block letters or sans type.</li>
      <li>1932 H. A. MADDOX <em>Printing</em> (ed. 2) iii. 40 (<em>caption</em>) Sans-serif (Gill Sans in light, medium, and bold).</li>
      </ul>
      <p>...
      </p></blockquote>
