    html: |-
      <p>Is your classmate from the UK? The word <em>gill</em> (pronounced <em>jill</em>) is an archaic unit of liquid measure, equivalent to a quarter-pint. The term is still heard sometimes in pubs in Ireland and the UK, and in this <a class="freelinking external" href="http://www.youtube.com/watch?v=MYgjkbMGnb8" rel="nofollow">popular drinking song</a>.<br>
      But Eric Gill's name is pronounced with a hard <em>G</em>.</p>
