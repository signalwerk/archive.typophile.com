    html: |-
      <p>Joshua, I would pronounce it the first way with the stress on the ending.</p>
      <p>But it is a case of communication, many of the typesetters I have worked with have not known (or needed to know) who designed the typefaces they work with or their provenance, so “correct” pronunciation is often ignored in favour of comprehension.</p>
      <p>So, being British, Univers is overwhelmingly Universe (I draw the line at Helvetica Newey though).</p>
      <p>You could blame this on the stereotypical British method of speaking to foreigners – speak English slowly and loudly.</p>
      <p>Tim</p>
