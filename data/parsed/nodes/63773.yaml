    html: |-
      <p>The Library of Congress have tons of pictures on flickr this is the search result for <a class="freelinking external" href="http://tiny.cc/5RgKc">World War 2</a>.<br>
      Now the cool thing about their flickr images is that they all have a description that ends with something called "Persistent URL" if you click that it'll take you to their website where you can click the thumbnail to get a page like <a class="freelinking external" href="http://lcweb2.loc.gov/cgi-bin/query/I?fsac:1:./temp/~pp_Lb0N::displayType=1:m856sd=fsac:m856sf=1a35220:@@@fsa">this</a>. In this example it's a photograph of a tank and you have access to a 191 Megabytes TIFF.<br>
      Most of the images they put on flickr don't have restrictions on reproduction and publication.</p>
