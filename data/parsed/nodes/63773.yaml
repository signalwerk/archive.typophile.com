      <p>@DanGayle... that isn't necessarily 100% true. </p>
      <p><a href="http://www.loc.gov/rr/print/195_copr.html">http://www.loc.gov/rr/print/195_copr.html</a></p>
      <p>They are saying that, to the best of the LoC's knowledge, <em>probably</em> all are OK to use, but that the responsnibility (as always) is on the person who uses the image to accept responsibility for any repercussions (and that the LoC doesn't provide any protection or guarantees, other than presenting what information it has about a particular image). At least that's how I read it.</p>
      <p>It is still use at your own risk, even if that risk is only 0.00001%.</p>
