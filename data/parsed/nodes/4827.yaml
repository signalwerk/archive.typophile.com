    html: <p> Quka, <br> <br>While some of the characters show some interesting promise (particularly D, K, a, b, and x). However, most of the characters are awkward, as if they're forced into that curved shape, (A, C, H, 7, etc.) <br> <br>Perhaps there's some way to preserve what's interesting about that shape without forcing the other characters into unnatural configurations. <br> <br>Good luck with it. <br> <br>//joe </p>
