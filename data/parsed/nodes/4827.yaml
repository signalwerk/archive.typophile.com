  date_raw: 11 Sep 2001 — 2:50am
  votes: null
  html: "<p><!---Attachment: xozza.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">Xozza<br><a href=\"http://www.typophile.com/forums/messages/29/xozza.swf\"><b>xozza.swf</b></a> (9 k)</td></tr></tbody></table></center><!---/Attachment-!--> <br>I began designing Xozza 6 months ago. I wasn't  <br>inspired by any existing face in particular, but i guess there must be some similar fonts out there. I saw a similar one at <a href=\"http://www.thirstype.com/index.html\">thirstype</a> <br> <br>This is my third digital type face, and i know it has some problems. But i like it very much and i have spent a lot of time in its design so i would like to finish it and get the best font i can. Any comments would be very much appreciated. i especially have doubts about numbers and some lc glyphs:k,i,j,t. <br> <br>Thanks for any help or comments in advance.<!--!-/attachment-!--><!--!-attachment:--><p></p>"
  html_clean: "<p><!---Attachment: xozza.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">Xozza<br><a href=\"http://www.typophile.com/forums/messages/29/xozza.swf\" class=\"link-lost\"><b>xozza.swf</b></a> (9 k)</td></tr></tbody></table></center><!---/Attachment-!--> <br>I began designing Xozza 6 months ago. I wasn't  <br>inspired by any existing face in particular, but i guess there must be some similar fonts out there. I saw a similar one at <a href=\"http://www.thirstype.com/index.html\" class=\"link-external\">thirstype</a> <br> <br>This is my third digital type face, and i know it has some problems. But i like it very much and i have spent a lot of time in its design so i would like to finish it and get the best font i can. Any comments would be very much appreciated. i especially have doubts about numbers and some lc glyphs:k,i,j,t. <br> <br>Thanks for any help or comments in advance.<!--!-/attachment-!--><!--!-attachment:--><p></p>"
