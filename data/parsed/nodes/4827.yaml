    html: "<p> I've seen something very similar (not sure where), but that doesn't mean you shouldn't do your own thing. <br> <br>BTW, one small piece of advice: the more you like something, the harder it is to be objective about its flaws. When this thing is a typeface -something *other* people must like- this becomes a big issue. On a practical level, this means that you might consider putting it aside for a few weeks, then taking a fresh look at it. <br> <br>hhp </p>"
