    <p>Hey all, this is my first time posting here, need some help on a logo. </p>
    <p>The client is a photographer who focuses on music/band and fashion photography, aimed mostly at younger people. He says what sets his work apart from the rest is the way he captures colour and movement.</p>
    <p>This is what i have tried to represent in the logo. The final roughs i think look OK, albeit rather cliched. The client has chosen the logo bottom right (despite me saying the extra swirls and colours seem a bit overcrowded, and that the swirls on the other logos ’sit together better).</p>
    <p>The client is happy, but i can’t help but think that i could make the logo more impressive. I’m not too hot on identities and logos (this is my first paid job), so any pointers are appreciated. Thanks!</p>
    <p><a href="http://s47.photobucket.com/albums/f196/mister_tech/?action=view&amp;current=roughs7copy.jpg" target="_blank"></a></p>
