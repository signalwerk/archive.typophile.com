      <p>I’m not feeling it...</p>
      <p>What is the name supposed to mean? No-ID(ea)? No name? - but that’s a photographer’s best asset.</p>
      <p>The eye is definitely clichéd - there’s heaps more to explore - flashes, viewfinders, framing, viewing the world differently.<br>
      In my opinion doesn’t really capture “movement”. There’s also the issue of being able to consistently reproduce that number of colours in a logo (you’ll be printing CMYK every time.)<br>
      Could you not simply use and abstract portion/crop of the photographers work next to the text, thus allowing some flexibility in the ’identity’ you print that logo under a picture in a book etc and it’ll take focus away from the image.</p>
      <p>—————<br>
      <strong>Paul Ducco</strong><br>
      <a href="http://www.solid-creative.com/">Small Studio. Big ideas.</a></p>
