      <p>Hi there.</p>
      <p>I agree with the comment that you have to try black and white first, then add color to the logo.</p>
      <p>I’d recommend that you use a more “youthful” typeface, perhaps something more “grunge”. You also have a great opportunity to create an “eye” out of the letter “O” of the name.</p>
      <p>Play with this logo! Have fun with it!</p>
      <p>- Manuel</p>
      <p>“Less is more”</p>
