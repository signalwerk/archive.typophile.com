    html: |-
      <blockquote><p>
      Courier condensed can be simulated on just about any desktop computer for free, so you can see.
      </p></blockquote>
      <p>O don't know how to do that with TextEdit or Word. With pdfLaTeX, I think I would need to add lines in the map files, which few users know how to do. </p>
      <p>With XeLaTeX, it is  however quite easy. If I declare </p>
      <p><code>\newfontfamily\couriercond[FakeStretch=0.75]{Courier New}</code> </p>
      <p>I get, when choosing the font <code>\couriercond</code></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/couriernew_4984.png"></div><p></p>
