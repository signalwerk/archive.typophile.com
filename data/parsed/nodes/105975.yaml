    html: |-
      <p>"If that font was narrower and lighter it would be perfect."</p>
      <p>monospaced fonts are made to a single width that all glyphs can survive on. That single width is a compromise allowing the m to condense and the i to expand while just maintaining marginal readability. </p>
      <p>so what you are asking for doesn't exist, (with multiple weights and italics),  for a reason. you are in luck though— Courier condensed can be simulated on just about any desktop computer for free, so you can see.</p>
    html_clean: |-
