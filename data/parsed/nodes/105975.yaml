    html: |-
      <p>For a quite condensed light typewriter font with serifs, there is Latin Modern Mono Light Cond  that comes in regular and oblique in the <a href="http://tug.org/texlive/" rel="nofollow">texlive</a> distribution (<a href="http://tug.org/mactex/" rel="nofollow">MacTeX 2013</a> for Mac).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/lmtypecond_4528.png"></div><br>
      It is also available from <a href="http://www.gust.org.pl/projects/e-foundry/latin-modern" title="http://www.gust.org.pl/projects/e-foundry/latin-modern">http://www.gust.org.pl/projects/e-foundry/latin-modern</a> in various formats.<p></p>
      <p>Its character width is 0.35em compared to 0.5em for Inconsolata (that I like) and Letter Gothic (at least the CTAN version).</p>
      <p>There is a mono script also having width 0.35em,  Script Mono Condensed, available from <a href="http://www.fonts101.com/search/condensed+mono" title="http://www.fonts101.com/search/condensed+mono">http://www.fonts101.com/search/condensed+mono</a> (Corporate Mono Condensed has width 0.422em).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/scriptmono_6292.png"></div><p></p>
