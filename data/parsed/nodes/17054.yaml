    html: |-
      <p>You asked for it. :^P</p>
      <p>m / n / h / p  -- At first I did not enjoy the sharp final curve. It has grown on me, but I did read the /m/ and /n/ as /nc/ and /nc/ the first time around. </p>
      <p>/or/ -- the connecting stroke in between these to characters seems a little flat</p>
      <p>/he/ -- there is a little bump happening from the exit on the /h/ and the entry on the /e/ -- looking again the same problem occurs with /de/ so I would guess the problem is with the /e/</p>
      <p>/Re/ -- the connection seems a little stiff</p>
      <p>/t/ -- entry stroke seems stiff</p>
      <p>Overall color -- very nice. I could say that some of the letters could use a little more of that filling in that letters such as the /f/ has. The caps all have it and I really like it. This feels like copperplate engraving and it is gorgeous. I freak out a little when letters are so thin and often call them spindly and without spine, but this ultra-refined, even haute couture-esque. </p>
      <p>Oh well. I will say it anyway. I love this. I just wish the lowercase had a little more of the same "filled-in" or "cut too deep" spots.</p>
    html_clean: |-
