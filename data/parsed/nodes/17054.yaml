    html: |-
      <p>Reminds me to old penmanship writing lesson books. The lower p and r looking very accient. Some glyphs would look better on word beginnings and endings without their connection stroke. The upper case N sems to be broken. Maybe you can enhance the design if you try to write like some would write today, trying to catch this penman style. - So you have two designs, the 1900 and the 2000 version. :-) The connections look ok, since this is an adaption of handwriting for metal. Using Opentype features could give a closer impression of hand writing. </p>
      <p>try to search for some of these little lesson books for more inspiration: C. C. Lister's Progressive Penmanship</p>
      <p>--<a href="http://www.astype.de" target="_blank">astype.de</a>--</p>
    html_clean: |-
