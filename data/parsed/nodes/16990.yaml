    <p>I am searching for a modern serif or slab-serif with a corporate and "cubic" feel.<br>
    This is the way i ma going:<br>
    <a href="http://www.emigre.com/dp/getfontpage.php?PChoSlT.html" title="http://www.emigre.com/dp/getfontpage.php?PChoSlT.html">http://www.emigre.com/dp/getfontpage.php?PChoSlT.html</a> (but i don't like the lowercase "e")<br>
    or<br>
    <a href="http://www.secretonix.pt/ftf/catalogue/FTFmorganAvec.htm" title="http://www.secretonix.pt/ftf/catalogue/FTFmorganAvec.htm">http://www.secretonix.pt/ftf/catalogue/FTFmorganAvec.htm</a> (i like this one but need an alternative)<br>
    or maybe...<br>
    <a href="http://www.myfonts.com/fonts/hamburger/neutraliser-serif/regular/" title="http://www.myfonts.com/fonts/hamburger/neutraliser-serif/regular/">http://www.myfonts.com/fonts/hamburger/neutraliser-serif/regular/</a></p>
    <p>Hope you guys can come up with something...</p>
    <p>Benjamin</p>
