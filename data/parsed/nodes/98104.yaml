    html: "<p>As I can't be positive (or even wrong) on the possibly-endless font/not-a-font discussion, I've tried to focus on finding some fonts in the same vein, hoping it'd be helpful if you need some alternatives: <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/sudtipos/burgues-script/\" rel=\"nofollow\">Burgues Script</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/sudtipos/compendium/\" rel=\"nofollow\">Compendium</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/nicksfonts/his-nibs-nf/\" rel=\"nofollow\">His Nibs</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/wiescherdesign/scriptofino/\" rel=\"nofollow\">Scriptofino</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/profonts/adagio-pro/\" rel=\"nofollow\">Adagio</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/profonts/concerto-pro/\" rel=\"nofollow\">Concerto</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/ihof/p22-zaner/\" rel=\"nofollow\">Zaner</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/itc/elegy/\" rel=\"nofollow\">Elegy</a></p>"
