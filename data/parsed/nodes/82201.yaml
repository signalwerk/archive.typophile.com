  html: <p>A friend and I have been discussing what font we should use for typesetting a series, and as I was offline at the time, she did <a class="freelinking external" href="http://i52.tinypic.com/241lcuo.png " rel="nofollow"> -&gt;this image&lt;-</a> with a font she thought looked good for it. I agreed, but by that time she couldn't remember which one she'd used, and her program/computer was having weird things that meant she couldn't browse through her fonts. She thinks it started with a "GN".</p>
