    html: |-
      <p>I actually spent a lot of time looking at two freebie sites and MyFonts.com. This font was not at any of those. Chances are this may have originated at a Japanese font site and so may not have made it to the sites we would usually find.</p>
      <p>In my opinion this is poorly drawn , although clean, lettering, done by someone unfamiliar with Latin lettering, but if you want this 'raw' look you can set a few sample words and scroll through thousands of hand-printed fonts until you find something with a similar feel. At least you can find something free, if you don't want lettering that was done by someone who knows how to do Latin lettering. My suggestion is to check the handwriting category at Abstractfonts.</p>
      <p>- Mike Yanega</p>
