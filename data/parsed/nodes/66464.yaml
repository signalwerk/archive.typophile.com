      <p>1. Letters zhe, ka, en, ha, and che don't have descenders. So you definitely can't add tails to them. It looks very unnatural, if not terrible. <a href="https://web.archive.org/web/20190726180913/http://www.flickr.com/photos/26973507@N06/3199357343/">Here</a> is example of nice Cyrillic swashes.</p>
      <p>2. Descender of De can look similar to Tse in decorative font. <a href="https://web.archive.org/web/20190726180913/http://paratype.ru/scripts/fontsample.exe?font=AnnaC&amp;hex=1&amp;text=414243616263C0C1C2E0E1E2E3E4E5B8E6E7E8E9EAEBECEDEEEFF0F1F2F3F4F5F6F7F8F9FAFBFCFDFEFF&amp;bi=0&amp;cs=204&amp;th=30&amp;h=30&amp;w=400&amp;xpos=5">Here</a>, for example, is Cyrillic version of ITC Anna, De and Tse has identical descenders. In text font, of course, it's better to go traditional way.</p>
