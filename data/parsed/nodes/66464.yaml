      <p>As I noted in my original post, I abandoned that idea long ago.</p>
      <p>My question concerns a typeface I am working on at the moment which is notably "scripty" in its design, and, while not being an actual script, nonetheless adopts scripty forms wherever possible.</p>
      <p>For such a face, the archaic swash-form descenders of ц and щ are appropriate.<br>
      But then I started to think about similar characters, and wondered if I could make other descenders swashy as well.</p>
      <p>Thanks to the examples people have shown of De with swash descenders, I see that it is certainly possible to swashify the normally stubby Cyrillic descenders/terminals -- but I don't think it's worth the effort for the Kazakh characters. </p>
      <p>However, here is a sketch of what I might do with De:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/De2_4589.png"></div><p></p>
