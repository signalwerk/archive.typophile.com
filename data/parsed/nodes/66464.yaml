      <p>Interesting question. I doubt these non-Slavic Cyrillic letters ever used swash descenders, but I don't know much about them at all. I'd appreciate any information as well.</p>
      <p>As for the De, even though the descending strokes end up looking similar to those of Tse or Shcha, I think of the underlying strokes as being fundamentally different. Taking away the descending strokes on De altogether would be extreme, but it will still be read as a De. But the strokes in Tse and Shcha are essential, and in the latter case it is the only element that distinguishes it from a Sha. It's like the tail of Q, which may be the only flamboyantly swashy detail in an otherwise sober Latin text design.</p>
      <p>In swashy calligraphy, the De may acquire spectacular tails: <a href="https://web.archive.org/web/20190726180913/http://www.flickr.com/photos/7333287@N07/4062666519/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.flickr.com/photos/7333287@N07/4062666519/</a> Of course, the handwritten form of lowercase de has a large tail, being superficially similar to a handwritten "g". But they feel out of place in designs for text.</p>
