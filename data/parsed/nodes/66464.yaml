    <p>There is an old style of <a href="/web/20190726180913/http://www.typophile.com/node/14164" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Cyrillic</a>, e.g. in the typeface Academy, in which the characters tse and shcha don't have the usual short descending mark (below left), but have swash tails (below right). I considered this for Scotch Modern (the face shown in the examples here), but abandoned the idea as inappropriate.<br><img src="/web/20190726180913im_/http://www.typophile.com/sites/default/files/old-images/tails3_5225.png"></p>
    <p>However, I am presently designing a more swashy typeface, and will include swash tails on tse and shcha. Would such tails also be appropriate for other Cyrillic characters which have descenders? Specifically, the tailed versions of zhe, ka, en, ha, and che:<br><img src="/web/20190726180913im_/http://www.typophile.com/sites/default/files/old-images/tails1_6616.png"></p>
    <p>And finally, if there is a swash descender on tse and shcha, why not on De?<br><img src="/web/20190726180913im_/http://www.typophile.com/sites/default/files/old-images/tails2_6521.png"></p>
  html_clean: |-
    <p>There is an old style of <a href="/node/14164/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Cyrillic</a>, e.g. in the typeface Academy, in which the characters tse and shcha don't have the usual short descending mark (below left), but have swash tails (below right). I considered this for Scotch Modern (the face shown in the examples here), but abandoned the idea as inappropriate.<br><img src="/web/20190726180913im_/http://www.typophile.com/sites/default/files/old-images/tails3_5225.png"></p>
    <p>However, I am presently designing a more swashy typeface, and will include swash tails on tse and shcha. Would such tails also be appropriate for other Cyrillic characters which have descenders? Specifically, the tailed versions of zhe, ka, en, ha, and che:<br><img src="/web/20190726180913im_/http://www.typophile.com/sites/default/files/old-images/tails1_6616.png"></p>
    <p>And finally, if there is a swash descender on tse and shcha, why not on De?<br><img src="/web/20190726180913im_/http://www.typophile.com/sites/default/files/old-images/tails2_6521.png"></p>
