      <p>Dear Nick, those wavy, tilde-like terminals of the ц and the щ are typical features of the post-Petrine <a href="http://eldesign.ru/upload/Image/sreda/2007-05-23/letter_r16.gif" rel="nofollow">Russian type of 18th century</a>. In his Cyrillics shown in <em>Manuale Tipografico</em> Bodoni followed the same pattern. I am afraid they would look a bit archaic in a Scotch Roman.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Ze-Eh-Tse-Tshch_3779.png"></div><p></p>
