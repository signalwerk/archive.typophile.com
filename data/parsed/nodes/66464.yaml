      <p>Last comment. If you want some really fun, swashy stuff for Cyrillic, you might try looking at the <em>skoropis'</em> (скоропись) model. Skoropis' literally means 'quick writing' and is usually quite lively as you can see in Oleg's typeface linked to above. To get you started, here are some Google results: <a href="https://web.archive.org/web/20190726180913/http://bnsn.com/3z">web</a> / <a href="https://web.archive.org/web/20190726180913/http://bnsn.com/L2">image</a>.</p>
