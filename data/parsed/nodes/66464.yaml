    html: <p>After a lot of digging, I have found (at books.google.com) a trove of PDFs of <a href="https://web.archive.org/web/20190726180913/http://encpiter.ru/persarticle.php_kod=2803928259&amp;language=2.htm">Mavriky Wolf</a>’s print. It looks like his compositors kept using those ‘new, improved’ types he had developed for the books he published, for 25 years after he died (in 1883). I have found quite a few samples of those <strong>Д</strong>s with curled-up legs, both <a href="https://web.archive.org/web/20190726180913/http://pics.livejournal.com/m_zhukov/pic/00029k7b/s640x480">lateen-shaped</a> and <a href="https://web.archive.org/web/20190726180913/http://pics.livejournal.com/m_zhukov/pic/00028116/s640x480">trapezoid</a>. That <strong>Д</strong> in Kyrill’s post above is definitely Wolf’s. You live and you learn… Those ‘improved’ shapes, and many others invented by Wolf, still look pretty artificial.</p>
    html_clean: <p>After a lot of digging, I have found (at books.google.com) a trove of PDFs of <a href="https://web.archive.org/web/20190726180913/http://encpiter.ru/persarticle.php_kod=2803928259&amp;language=2.htm" class="link-external">Mavriky Wolf</a>’s print. It looks like his compositors kept using those ‘new, improved’ types he had developed for the books he published, for 25 years after he died (in 1883). I have found quite a few samples of those <strong>Д</strong>s with curled-up legs, both <a href="https://web.archive.org/web/20190726180913/http://pics.livejournal.com/m_zhukov/pic/00029k7b/s640x480" class="link-external">lateen-shaped</a> and <a href="https://web.archive.org/web/20190726180913/http://pics.livejournal.com/m_zhukov/pic/00028116/s640x480" class="link-external">trapezoid</a>. That <strong>Д</strong> in Kyrill’s post above is definitely Wolf’s. You live and you learn… Those ‘improved’ shapes, and many others invented by Wolf, still look pretty artificial.</p>
