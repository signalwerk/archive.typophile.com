      <p>Thank you Brian. The typefaces mentioned by Oleg were indeed produced in the 20th century: Academy (2nd line) in 1910, and Elizabeth (3rd line) in 1904–7.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/de_el_tse_shcha_4766.gif"></div><br>
      However, their letter forms have been inspired by the Russian typographic legacy of early 18th century, and more precisely, by the types of the Imperial Academy of Sciences, circa 1748:<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/1748_Academy_Specimen2_3631.jpg"></div><br>
      Hence the triangular, lateen-like and isosceles, construction of the д and the л, and the distinctive <a href="http://typophile.com/files/Ze-Eh-Tse-Tshch_3779.png" rel="nofollow">curls</a>. Kindly refer to the most informative type design blurbs written by Vladimir Yefimov, posted at paratype.com. Incidentally, Academy (<em>Akademicheskii</em>) was issued by H.Berthold to mark the bicentenary of Peter the Great’s <a href="http://tdc.org/news/2005atypiciviltype.html" rel="nofollow">Civil Type</a>. There were two flavours offered, ‘regular’ and ‘historical’ (the latter with long descenders, old-style figures, and the tall yat’, hard and soft signs).<p></p>
