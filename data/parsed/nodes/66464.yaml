      <p>Thank you Brian. The typefaces mentioned by Oleg were indeed produced in the 20th century: Academy (2nd line) in 1910, and Elizabeth (3rd line) in 1904–7.<br><img src="/web/20190726180913im_/http://www.typophile.com/sites/default/files/old-images/de_el_tse_shcha_4766.gif"><br>
      However, their letter forms have been inspired by the Russian typographic legacy of early 18th century, and more precisely, by the types of the Imperial Academy of Sciences, circa 1748:</p>
      <p><img src="/web/20190726180913im_/http://www.typophile.com/sites/default/files/old-images/1748_Academy_Specimen2_3631.jpg"><br>
      Hence the triangular, lateen-like and isosceles, construction of the д and the л, and the distinctive <a href="https://web.archive.org/web/20190726180913/http://typophile.com/files/Ze-Eh-Tse-Tshch_3779.png">curls</a>. Kindly refer to the most informative type design blurbs written by Vladimir Yefimov, posted at paratype.com. Incidentally, Academy (<em>Akademicheskii</em>) was issued by H.Berthold to mark the bicentenary of Peter the Great’s <a href="https://web.archive.org/web/20190726180913/http://tdc.org/news/2005atypiciviltype.html">Civil Type</a>. There were two flavours offered, ‘regular’ and ‘historical’ (the latter with long descenders, old-style figures, and the tall yat’, hard and soft signs).</p>
