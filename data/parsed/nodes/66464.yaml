    <p>There is an old style of <a href="/wiki/Cyrillic" class="freelinking" rel="nofollow">Cyrillic</a>, e.g. in the typeface Academy, in which the characters tse and shcha don't have the usual short descending mark (below left), but have swash tails (below right). I considered this for Scotch Modern (the face shown in the examples here), but abandoned the idea as inappropriate.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/tails3_5225.png"></div><p></p>
    <p>However, I am presently designing a more swashy typeface, and will include swash tails on tse and shcha. Would such tails also be appropriate for other Cyrillic characters which have descenders? Specifically, the tailed versions of zhe, ka, en, ha, and che:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/tails1_6616.png"></div><p></p>
    <p>And finally, if there is a swash descender on tse and shcha, why not on De?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/tails2_6521.png"></div><p></p>
  html_clean: |-
