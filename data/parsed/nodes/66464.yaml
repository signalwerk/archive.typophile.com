      <p>Nick, as for Mamontov, it is based on poster typefaces and has a touch of the beginning of 20th century. In this period Cyrillic typefaces usually combine wavy tails on -tsp- and -shcha- with almost trapezoidal -de-. You can see it in <a href="https://web.archive.org/web/20190726180913/http://paratype.com/pstore/fonts/Academy.htm">Academy</a> and <a href="https://web.archive.org/web/20190726180913/http://paratype.com/pstore/fonts/Elizabeth.htm">Elizabeth</a>.</p>
      <p>Maxim, mammoth is an animal, but Mamontov is something totally different.</p>
