      <p>This shape is hardly recognisable as a д. From the samples you mentioned you might have noticed that the swashy bottom terminals of the д, the distinctive feature of the pre-Petrine cursive hands, are always used with the triangular tops. The trapezoid construction of the д had developed only by the end of the 19th century; it never was, nor is it now, used in writing, only in printing type. Now a question: do you really want that 17th-century touch in your Cyrillic? What do the rest of the glyphs look like?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/1694_Istomin_Dobro_3745.png"></div><p></p>
