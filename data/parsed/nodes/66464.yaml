      <ul><li><em>How authentic was the “historical” version of Academy?</em></li>
      </ul><p>Academy was as ‘authentic’ as its original model, ATF Cheltenham Old Style. It was rather superficially styled after Civil Type; think Monotype Italian Old Style vs. Jenson, Monotype Plantin vs. Granjon, etc.. Elizabeth (<em>Elizavetinskii</em>) was a much more careful and sensitive revival, designed from scratch—unlike Academy. In its initial version Elizabeth also had those tall <em>yer’</em>, <em>yer</em>, and <em>yat’</em>.</p>
    html_clean: |-
