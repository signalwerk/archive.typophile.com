    html: <p>Dear Nick, those wavy, tilde-like terminals of the ц and the щ are typical features of the post-Petrine <a href="https://web.archive.org/web/20190726180913/http://eldesign.ru/upload/Image/sreda/2007-05-23/letter_r16.gif">Russian type of 18th century</a>. In his Cyrillics shown in <em>Manuale Tipografico</em> Bodoni followed the same pattern. I am afraid they would look a bit archaic in a Scotch Roman.<br><img src="/web/20190726180913im_/http://www.typophile.com/sites/default/files/old-images/Ze-Eh-Tse-Tshch_3779.png"></p>
