      <p>Nick, as for Mamontov, it is based on poster typefaces and has a touch of the beginning of 20th century. In this period Cyrillic typefaces usually combine wavy tails on -tsp- and -shcha- with almost trapezoidal -de-. You can see it in <a href="http://paratype.com/pstore/fonts/Academy.htm" rel="nofollow">Academy</a> and <a href="http://paratype.com/pstore/fonts/Elizabeth.htm" rel="nofollow">Elizabeth</a>.</p>
      <p>Maxim, mammoth is an animal, but Mamontov is something totally different.</p>
