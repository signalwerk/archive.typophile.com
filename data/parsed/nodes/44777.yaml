      <p>I’m not to keen on it, looks pretty basic to me. Don’t think the name helps either, reminds me of an east london post code. These sort of names are more associated to club names in and around london. But i take it you have no control over the name. . . </p>
      <p>It would be nice to see some simple treatment to this marque to spice it up a bit, looks rather bland at the moment.</p>
      <p>Perhaps a play on the ’8’</p>
      <p>luey</p>
