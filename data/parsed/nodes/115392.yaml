      <p>Thanks guys.</p>
      <p>I understand that Chaparral Pro is bundled by Adobe and available via my creative cloud subscription, but does that mean I can use any of those fonts free of charge?<br>
      And yes, by "free" I mean for commercial use (in a logo, for example).</p>
      <p>In the grander scheme, I'm wondering if there is some standard way to find out if a font is legally free to use for commercial purposes. I would check the licensing info of the particular foundry, but I can't seem to find anything about Adobe font licensing. In that case should I assume it's not free to use in a commercial logo because Adobe is selling it? Or would you recommend contacting Adobe?</p>
      <p>megs</p>
