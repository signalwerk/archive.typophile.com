    <p>Hi everyone!</p>
    <p>I'm new here and I'm worried about font licensing. </p>
    <p>I'm using Chaparral Pro Bold in a logo design for commercial purposes and I want to make sure that it's free to use, or that the company pays for it if it's not free. I'm pretty sure this font came installed on my mac, but a google search brought me to realize that Adobe is charging money for it. <a href="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFontPackage&amp;code=1717" title="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFontPackage&amp;code=1717">http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=...</a></p>
    <p>What is the best way to be 100% certain that a font you're using is free?</p>
    <p>I'm also wondering, say the company chooses not to pay for it ... who is liable for it's usage, the freelance designer or the company that uses it for commercial purposes?</p>
    <p>Thanks in advance, </p>
    <p>megs</p>
