      <p>It is my understanding that the only way to know what you may do with a font is to find the end user agreement that came with it when it was licensed and read it carefully. </p>
      <p>Concerning Adobe originals, here is a link that may be useful: <a href="http://forums.adobe.com/message/2818917" title="http://forums.adobe.com/message/2818917">http://forums.adobe.com/message/2818917</a></p>
