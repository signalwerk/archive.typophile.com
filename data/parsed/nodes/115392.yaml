      <p>There's free, and then there's free. Oh, and there's free, too. So, which kind of free? I'm guessing free from legal hassles when used in logo design.</p>
      <p>My understanding, thoroughly inexpert as it is, is that you can use Chaparral to design logos for others as long as 1) they do not need the font to use the logo or 2) they have their own licence.</p>
