      ("E" is a bit different)</p>
      <p>"FLOW" is (a not so close) similar to a font referenced in <strong><a class="freelinking external" href="http://luc.devroye.org/SolotypeCatalogTHP.txt" rel="nofollow">Solopedia Catalog</a></strong> as <strong>"Skin &amp; Bones"</strong>:</p>
