  html: <p>When I worked for a film magazine, I used to receive artwork from film distributors and one of the fonts i got was a movie poster credit font that had dings that were job titles i.e. if you pressed option k then the job title 'film editor' would pop up with the word 'film' stacked on top of the word 'editor'. Does anyone know what font that is? I've attached an example. <br><img src="http://www.typophile.com/forums/messages/83/56427.jpg" alt="Movie Poster Credit Block Font"></p>
