    <p>Hi hi hi,</p>
    <p>New to this forum and a student in graphic design. Currently working on an assignment and desperate to find a newspaper which uses Bondoni as it’s primary font.</p>
    <p>Any other Bodoni examples, current or otherwise, would be very much appreciated.</p>
    <p>Google isn’t cutting it!</p>
    <p>Thanks.</p>
