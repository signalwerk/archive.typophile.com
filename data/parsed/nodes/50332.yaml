      <p>You won’t likely find Bodoni in the body copy of any newspaper. But it’s still found as headletter in some papers.</p>
      <p>The Washington Post is still using a custom headline Bodoni that Matthew Carter designed for them, called Postoni. You can check it out at the Newseum.</p>
      <p><a href="http://www.newseum.org/todaysfrontpages/hr.asp?fpVname=DC_WP&amp;ref_pge=lst" title="http://www.newseum.org/todaysfrontpages/hr.asp?fpVname=DC_WP&amp;ref_pge=lst">http://www.newseum.org/todaysfrontpages/hr.asp?fpVname=DC_WP&amp;ref_pge=lst</a></p>
      <p>Can’t think of any others off the top of my head, but I’m sure others will chime in.</p>
      <p>— Kent.</p>
