    <p>Hey,</p>
    <p>I'm looking for some advice. I am going to be having a tattoo shortly, and i need the right font for the quote that i will have on me.</p>
    <p>The quote is from 1912, from Captain Oates, His supposed last words, and i'm looking for a font to really capture the quote. A font accurate to the period, but also something that resembles a Diary Entry? Something handwritten.</p>
    <p>Any advice you could give would be greatly appreciated, the font really needs to fit the quote.</p>
    <p>Thank you so much.</p>
