      <p><em>A font accurate to the period, but also something that resembles a Diary Entry? Something handwritten.</em></p>
      <p>None of which describes Voyage. Careful—attractive though Voyage is, it is a popular style now that may look dated in a few years.</p>
      <p>Here is an item from my grandmother’s autograph book; I believe it is a man’s hand.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Thin_4218.png"></div><p></p>
      <p>A handwriting font like <a href="http://www.g-type.com/olicana-font" rel="nofollow">Olicana</a> would be closer to your speciﬁcation.</p>
