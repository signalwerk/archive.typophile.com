      <p>Or one of Laura Worthington's script fonts, which have more vigour than Voyage. I would take a look at <a href="http://www.myfonts.com/fonts/laura-worthington/azalea-smooth/regular/" rel="nofollow">Azalea</a>.</p>
      <p>While the story of Oates' futile sacrifice is moving, I think I'd be more inclined to a quote from Shackleton, who brought all his men home alive: "Superhuman effort isn't worth a damn unless it achieves results."</p>
