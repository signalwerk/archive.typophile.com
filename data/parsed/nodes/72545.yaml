      <p>I think I consider a host of characteristics for a potential typeface: Technical requirements (suitability for the medium, number of weights and widths, OpenType features), historical connotations or denotations (per Nick), temperament (when it can be divined), ability to pair with other typefaces used, and comments I've heard about it -- many times from this forum. But the decision as to which criterion to use tends to be spontaneous and unpredictable. On most occasions, something about the project's brief or the past design will trigger a thought of a genre or particular typeface. The key is to have a broad enough knowledge of the type world to connect the brief to a typeface.</p>
      <p>As I've learned about and used more typefaces, I've also realized that, many times, there are numerous good options. While my tendency is to look through the online offerings of foundry after foundry, I've learned that eight or nine times out of ten, my first instinct ends up being what I stick with.</p>
      <p>For example, a magazine I'm working on now differentiates itself from others by publishing fiction and poetry in addition to reportage. This led me to the idea of a suite, with a paired serif and sans. I had seen FF Yoga, as promoted by Fontshop, and that was my first thought. I looked through a bunch of other super-families (helped in part by Fontshop's <a href="http://www.fontshop.com/fonts/category" rel="nofollow">FontLists</a>), but Yoga still seemed to fit the magazine best, as a bit literary but appropriately unusual. In the time since that initial decision, I've realized that fiction and poetry are not equal partners with reportage, but the choice still seems sound. As the direction has shifted to become more of a take-off on book design, I've now gone looking for a contrasty Garamond for accents. I need a face in the Garamond genre to cement the literary quality, and it has to be rather sharp and fine to contrast enough with the bluntness of Yoga.</p>
