      <p>By cognition I mean the ability to draw upon inherited knowledge; without knowing the typefaces used by the companies the ads are parodying the 'reader' would not understand the significance that the typeface is inferring.<br>
      In the Dixon ads the typefaces for John Lewis and Selfridges are used for maximum effect. Likewise the Tubeorfalse campaign is relying on a visual awareness of the London Underground typestyle, but to a lesser extent because the fabric the slogans are made from also denotes the seating fabric and patterns used on different tube trains</p>
      <p><a href="http://www.creativereview.co.uk/cr-blog/2009/september/dixons" title="http://www.creativereview.co.uk/cr-blog/2009/september/dixons">http://www.creativereview.co.uk/cr-blog/2009/september/dixons</a></p>
      <p><a href="http://www.tfl.gov.uk/tfl/corporate/modesoftransport/tube/history/" title="http://www.tfl.gov.uk/tfl/corporate/modesoftransport/tube/history/">http://www.tfl.gov.uk/tfl/corporate/modesoftransport/tube/history/</a></p>
