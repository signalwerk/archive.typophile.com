      <p>I think BeauW is absolutely right.</p>
      <p>I worked in a large advertising company and all art directors, graphic designers and web artists have their 'bag-of-fonts'. Or their favorite, 'tried-and-true' selection of typefaces. Also, most agencies and companies have purchased a standard font library, in the past, and most have to work within that framework. When the occasional new job pitch or 'high priority' client comes along, or makes a special request, a requisition has to be submitted and approved before a new font family is added to the library. With all the different font licensing schemes around, companies tend to shy away from purchasing additional fonts, simply, because of the added cost. An art director really has to make a good case for wanting the font.</p>
      <p>In any event, I would advise your students to just look through many different 'high-end' magazines, over a period od time, and see what they like. Put together a list of fonts and start from there. With experience, I'm sure they will experiment and try different solutions.</p>
      <p>Selecting an appropriate 'typeface' is just like selecting and appropriate outfit when you go out. The occasion dictates the choice.</p>
      <p>I hope this helps.</p>
