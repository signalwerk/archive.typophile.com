      <p>Chris,</p>
      <p>Most of the above comments I agree with. Yet, I am surprised that so many people have written so much without explicitly mentioning quality: for 95% or more of the things I do, I'm only interested in typefaces that meet a minimum bar for quality. That includes outline construction, spacing, kerning, consistency, and sometimes hinting.</p>
      <p>I expect many folks will say "of course, that goes without saying," but I suspect you want even these implicit factors made explicit....</p>
      <p>See also a blog post I wrote almost five years ago, which still seems equally relevant:<br>
      <a href="http://blogs.adobe.com/typblography/2005/12/quality_in_type.html" title="http://blogs.adobe.com/typblography/2005/12/quality_in_type.html">http://blogs.adobe.com/typblography/2005/12/quality_in_type.html</a></p>
      <p>Cheers,</p>
      <p>T</p>
