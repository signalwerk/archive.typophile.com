      <p>Thanks for those who have contributed so far, (however existential).</p>
      <p>@ Nick Shinn: I fundamentally agree with your analysis of how much a typeface doesn't matter to the non-typographer, but I believe a reader accesses and recognises the differences in type-forms more than we think. Cognition of typefaces recently played a significant role in a couple of ad campaigns on the London Underground, without the lay person recognising the typefaces used the ads would have failed. Also in a conversation with the designer of the Daily Telegraph I was told the biggest complaint from their readership about a proposed re-design was the choice of typefaces to used. But I'm drifting off into 'should type be invisible' and 'clothes that words wear' territory... which are also factors</p>
