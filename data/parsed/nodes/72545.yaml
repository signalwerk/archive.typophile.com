      <p><em>...the semiotic, semantic and rhetorical influences that we attribute to typefaces.</em></p>
      <p>You're focusing on the wrong user in your definitions.<br>
      It is to the professional user -- art directors, graphic designers and typographers -- that types have most meaning.</p>
      <p>For readers, it is the finished document that signifies. The tools with which it is constructed mean very little.</p>
      <p>It's difficult to draw analogies between type and other areas of design.<br>
      Is a typeface a tool, a material, or an ingredient? </p>
      <p>Fundamentally, the signification of a typeface is determined by the typographer, in varying the typographic parameters of size, style (U&amp;lc, all caps, italic, etc), weight, leading, line length, spacing, alignment, colour, and rotation. Textual content and juxtaposition with pictures further alter the meaning of a typeface, as does the output medium (print, pixels, posters, etc).</p>
      <p>This is not to deny that there may be some small cultural quality of a typeface which the lay reader responds to in a direct manner, but its importance is generally overblown.</p>
