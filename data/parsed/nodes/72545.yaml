    html: "<p>I have a printed list of my top 20 fonts (evenly split between serif and sans-serif) and I choose which one is most appropriate to the job. I came up with the list, based on tried and true workhorse fonts. Often, just the most popular choices available. I keep things as simple as possible, and as conservative as possible (which is demanded in the work I do.) A few simple questions leads me to the choice: Do I want lighter or darker? Old fashioned or modern? Compact or extended? My list covers the options. Only on special projects do I move away from the list and let myself have more fun in choosing a font. Sometimes I see a font I like and keep it in mind in case the right job comes along. I developed this strategy because the speed at which I need to get projects finished is incompatible with the speed at which I make choices. Also, my taste is not the same as the aesthetic of the work I do. So- I keep the choices to a minimum.</p>"
