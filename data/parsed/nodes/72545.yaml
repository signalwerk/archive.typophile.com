    <p>Greeting everyone</p>
    <p>All too often ‘there are too many’ or ‘they all look the same’ are amongst the frequent chants we hear from students of design (and not just beginners) when they are faced with the dilemma of choosing an appropriate typeface for a given piece of work.</p>
    <p>I am currently conducting researching into how designers carry out the process of typeface selection and would appreciate the forums input. So my question is this:<br>
    What are the factors you consider when choosing a typeface?</p>
    <p>I am looking for substantial answers (I know this is cheeky), but would be grateful for any input and feedback</p>
    <p>Many thanks in advance<br>
    Chris</p>
