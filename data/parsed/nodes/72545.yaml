      <p><em>...there are too many ... faced with the dilemma of choosing an appropriate typeface</em></p>
      <p>A dilemma involves two options.<br>
      Although a significant percentage of people follow the sloppy understanding that it means many options, there are enough hardliners (like myself) to warrant the strict usage.</p>
      <p>I favour the "historical allusion" method (a term first used by DB Updike), whereby the historical style of a layout should match the historical era in which a typeface was designed. Also, if the content is historical, the layout and typeface should allude to the appropriate era.</p>
