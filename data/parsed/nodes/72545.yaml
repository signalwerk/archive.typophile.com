      <p>It's like asking a contractor which power tool to use given that there are so many on the market.</p>
      <p>Part of it is context...the right tool for the particular job. A nice serif text face is likely the right tool to set a novel's copy in and a grungy block face is more likely useful in the context of a music magazine headline.</p>
      <p>And then there's preference. Some folks like x on this font and y on this font because, well, they just do.</p>
      <p>And like a good contractor, the key is to not have TOO many typefaces otherwise you end up with a mess and you spend more time finding the tool than using it.</p>
