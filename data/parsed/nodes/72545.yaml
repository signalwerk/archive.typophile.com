      <p>There are many factor that I consider (or at least one of many). Most often, I need the typeface to be relevant to the subject of the text. For a book about the British Museum, I chose Caslon (an English typeface from about the time the Museum was founded), for a car magazine I went with an American typeface.</p>
      <p>Other times, the capability of the typeface dictates the choice, as Riccard0 points out (weights, styles, etc).</p>
      <p>Still on other projects I go more with the feel of a typeface. If it's for a 'quirky' brand/subject, I'll choose a 'quirky' typeface, one which I feel communicates the feel of the brand/subject. Of course, how it looks is a big factor.</p>
      <p>Some typefaces were designed for specific purposes (signage, screen, etc) so that comes into play as well.</p>
      <p>Those are the ones I can write down so far. If any others pop to mind, I'll write some more.</p>
      <p>Hope this helps.</p>
