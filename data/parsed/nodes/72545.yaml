    html: |-
      <p>1) I start with an analysis of requirements (non latin yes/no, special characters or symbols yes/no, one family / more families, number of weights, typographic features yes/no, oldstyle / lining / tabular figures etc.)</p>
      <p>2) Then I try to find a general type style(s) matching with my design concept. I use a 2D "space": the horizontal axe describes the fonts from hand made (left) to geometric (right), the vertical axe is for extravagant fonts (top) and boring "invisible" typefaces (bottom). This chart helps me think what I really need for a particular project.</p>
      <p>3) The third step is to make a list of type families in the desired category matching with my technical requirements. I use my memory, MyFonts, printed catalogs and friends.</p>
      <p>4) Now I try to limit the long list to a couple of finalists. I consider the aesthetic values, consistency of letter shapes, quality of kerning, diacritical marks, overall color of the typeface, how the italic and bold work in the text, the economical aspect (sometimes I have to save paper, sometimes I am asked to make to book as thick as possible), price of a font.</p>
      <p>5) I usually end up with two or three favorites. I try to test them, I print samples. When working on a large projects (newspaper, magazine), real offset printing tests are necessary. In the case I don't have selected fonts, I contact type foundries asking for a temporary licence; if they don't offer this kind of service, I asked them to open my InDesign file, change to default font to requested font and send back as PDF. If they won't provide it, they are out of the game.</p>
