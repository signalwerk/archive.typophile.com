      <p>I feel that Subject and purpose of the design is the most important and one should choose the typeface accordingly. A graphic designer should have its own list of best typefaces as many of us believe that. </p>
      <p>But sometimes all graphic designers and art directors will land up with same typefaces to use in particular designs, so in the overcrowded design world you can experiment with typefaces.</p>
      <p>I also realized that choosing a typeface for advertising design is very much different from graphic design.</p>
