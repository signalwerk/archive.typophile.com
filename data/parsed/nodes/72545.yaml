      <p>I start with two assumptions: (1) not every character/feature I'll need will be in the font, and (2) some of the kerning-spacing in the font won't be to our taste. That means permission for us (the end user) to modify the font is important, either explicitly in the EULA, or by having an arrangement with the designer/seller.</p>
      <p>I should note that "not every character" can mean something as simple as an extra lower-case "f" with a different terminal or right sidebearing (or both), so it can be controlled at the word boundry. Little details in the font can save hours of time with composition of a text, and of course, improve the appearance. "Type" has become complex enough that workflow issues are a factor.</p>
      <p>This is in addition to other things noted above, of course.</p>
      <p>* * *</p>
      <p>Rich Hendel's <cite>On Book Design</cite> spends some time on factors designers consider when selecting typefaces.</p>
