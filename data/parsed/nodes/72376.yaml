      <p>I agree about losing the o c connection. Its kind of unnatural feature in some scripts that just muddies up the design. </p>
      <p>I don't know how far down you need to scale this to know how the contrast will effect this. In text faces smaller point sizes (Letterpress at least) were traditionally given less contrast both for holding up to printing well and also just to visually match larger sizes. That being said, sometimes a heavy script can look almost monoweight at smaller sizes so its definitely worth trying more contrast out and seeing how it sets.</p>
