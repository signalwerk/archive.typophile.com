    html: <p>I don't agree with Tim about removing all connections, but o c feels unnatural. How about a loop in the top right corner? The top right part of a is a little bumpy. If you're going small, you'll probably want to either make small counters bigger (in s and r you may also try filling them) or remove them (as I would have considered with the loops on your ascending characters). Don't worry about contrast at first. You have to test print, but smaller text often need more space between characters.</p>
