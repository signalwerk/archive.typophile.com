    <p>Hi there,</p>
    <p>I was wondering if i may have some assistance in a logo i am creating at the moment. I have licensed metroscript and would like to increase the contrast so the logo is scaleable and legible in small sizes. </p>
    <p>So far i have filled the "O"'s counter, as well as the "A"'s to increase legibility, however I am still struggling to add contrast to the logo.</p>
    <p>Are there any tips you might have?</p>
    <p>Thanks</p>
    <p>2fewdjs</p>
