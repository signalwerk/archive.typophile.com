      <p>Hi 2fewdjs,</p>
      <p>I don't think giveing it a contrast will increase legibility in small sizes. Why do you think so?</p>
      <p>Your modifications are a good start, though. Some more ideas:</p>
      <p>- Remove the stroke that connects o and c. Connections between letter significantly reduce legibility, and it also looks a bit unnatural without the loop. You can even try to disconnect all letters.</p>
      <p>- Give the "a" a top-right corner, possibly letting either the vertical stroke or the bow stick out slightly.</p>
      <p>- Join the bow and the diagonal of the R.</p>
      <p>- Fill the loops of s and r and make them smaller.</p>
      <p>- In the k, remove the stroke below the upper loop (the one that conects the vertical and the upper diagonal) and give the tip of the diagonal a nice terminal.</p>
