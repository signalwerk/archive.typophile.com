      <p>Found this info on Typographica:</p>
      <p>“Mobley is based on ten letters found on the cover of a 1960s Blue Note jazz album. The ten source letters were designed for film setting by Wayne Stettler as part of a single typeface published by VGC under the name Neil Bold. Mobley Sans and its condensed and serifed counterparts constitute a brand new design molded around those source letters.”</p>
