    <p>Hello all,<br>
    I am writing a small research for my Typography course in college, on the subject of "Font Pairing", and I am looking for some website where I could find some HQ scans of magazine spreads or other editorial work I could use as examples.<br>
    I got a few nice scans from magazines and books,  but right now I am thinking about using the net to broaden my field of research (and to save some money for printing the thesis :)</p>
    <p>Can anyone suggest any flickr group / blog / archive where I could find some interesting pictures?<br>
    This is what I found so far - in case someone else might find them useful.</p>
    <p><a href="http://thingstolookat.blogspot.com" title="http://thingstolookat.blogspot.com">http://thingstolookat.blogspot.com</a><br>
    <a href="http://www.flickr.com/photos/goodmagazine/sets/72157618896371005/" title="http://www.flickr.com/photos/goodmagazine/sets/72157618896371005/">http://www.flickr.com/photos/goodmagazine/sets/72157618896371005/</a><br>
    <a href="http://www.flickr.com/photos/ffranchi/" title="http://www.flickr.com/photos/ffranchi/">http://www.flickr.com/photos/ffranchi/</a></p>
