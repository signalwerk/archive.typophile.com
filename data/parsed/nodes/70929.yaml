      <p>Unless you show type at "lifelike" resolution, 100% size as, you are not showing it properly, especially text type.<br>
      Typography is all about the relationship of size and detail, as opposed to layout, which is more about shape and proportion</p>
      <p>Generally speaking, scans don't have anywhere near enough resolution.<br>
      The standard practice for "HQ" is considered to be around 300 dpi Greyscale or "colorscale" (RGB Color/CMYK Color), for halftone reproduction in print, but that is nowhere enough resolution for text type, which operates under a different paradigm: high-contrast linear, not "scalar" (tonal).</p>
      <p>A technique I have used is to scan the full page in colorscale mode, to show layout, and accompany it with a detail of type, if it is black type on white paper, as bitmapped image at 100% size as: <a href="http://www.shinntype.com/Writing/4theMass.pdf" title="http://www.shinntype.com/Writing/4theMass.pdf">http://www.shinntype.com/Writing/4theMass.pdf</a></p>
      <p>I also like to see magazine spreads reproduced as "objets", i.e. photographed as an object, with vignetted dropshadow, rather than scanned flat -- so I know for sure where the trim is, and because they <em>are</em> things.</p>
