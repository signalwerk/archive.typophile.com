    <p>Hello and thanks for looking at this.</p>
    <p>This is a text (in German) that appears on the back of a cover for an online game (drakensang.de). My job is to replace that text with the translated version. However the text in the layer was rasterized, so there is no way to find out what typeface was used. I get a feeling of deja vu when I look at it, but can't quite find a match.</p>
    <p>The quality is rubbish, but unfortunately this is how it is in the original file.</p>
    <p>Thanks in advance,<br>
    Kit.</p>
