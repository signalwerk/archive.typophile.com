  html: <p>Hello. I write a newsletter. I create my newsletter in Word and convert to a PDF.  I'd like to use a slightly different font than the standard options available in Word.  I've found one I like, but I don't know what it's called. Can anyone help?   <br> <br>Much thanks. <br> <br><img src="http://www.typophile.com/forums/messages/83/35493.png" alt=""></p>
