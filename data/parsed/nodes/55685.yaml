    <p>Hola amigos.</p>
    <p>I'm just wondering:</p>
    <p>I want to get my MFA (in graphic design).</p>
    <p>I am about <cite>60%</cite> sure that my school will not have the BA in Arts by the time I graduate. </p>
    <p>That said: What types of things should I be aware of regarding applying to a GOOD MFA program? Will this really hamper me? Is it negligible? </p>
    <p>There are a lot of opinions on this but you are all mostly experience professionals and I value your opinions. </p>
    <p>Best—</p>
