      <p><em> If you go to your web mail you can almost certainly block the mails there already so they do not even reach your computer.</em><br>
      Yes, but the "sender" is the ATypI list (but then again the on other mail that would have been blocked would have been the complaints about the mail). I would have done that if it didn't stop by now. 456 copies of the same mail isn't too bad is it?</p>
      <p>Setting up a rule to sort them into trash is fine but checking a mobile device during the day was an exercise in frustration.</p>
      <p>A year or two ago we had an announcement stuck in a loop where it send 6 times in a row. The hate mail and phone calls started flowing like crazy. We pulled the plug and then apologized to everyone and cancelled the list and asked them to re-subscribe to a new list. Those who did got a free font.</p>
