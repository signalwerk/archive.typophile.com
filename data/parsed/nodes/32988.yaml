  html: |-
    <p>Hello, was wondering if anybody could ID the font used for some of the display type all over this website. Sorry I can't find a bigger sample--I have a little booklet I picked up but don't have access to a scanner right now. It seems sort of like New Clarendon or New Century Schoolbook or something but off the top of my head the tail on the 'a' looks a little different and it has that weird thingy on top of the 'g.'</p>
    <p>Any help would be greatly appreciated!</p>
    <p>Here's the URL:</p>
    <p><a href="http://systembolaget.se/AlkoholHalsa" title="http://systembolaget.se/AlkoholHalsa">http://systembolaget.se/AlkoholHalsa</a></p>
    <p>Thanks!</p>
