    <p>Hi all,</p>
    <p>another contemporary type mystery. I thought this was VoltA from Hubert Jocham, but looking at his specimens and comparing the letterforms closely, it is clearly not.  (K is a dead giveaway). Anybody recoginze this face?</p>
    <p>on that note, I've identified a handfull of faces that fall in this very contemporary class together of very clean sans faces, and I'm wondering what other GREAT faces in this mod-danish style please you all?</p>
    <p>Dax<br>
    VoltA<br>
    VoiceSho<br>
    Bentwood<br>
    Sari<br>
    Noa</p>
