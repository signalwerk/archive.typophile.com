    html: <p>InDesign has a scaling tool for test. It's that thing that looks like a picture frame (with the usual computer-object-handles) and a white cursor. If you give that thing a keyboard shortcut, you're quicker at the scaling text function. </p>
    html_clean: <p>InDesign has a scaling tool for test. It's that thing that looks like a picture frame (with the usual computer-object-handles) and a white cursor. If you give that thing a keyboard shortcut, you're quicker at the scaling text function. </p>
