    html: |-
      <p>It seems some country subpages work better than others, and some browsers work better than others. Tweaking the fonts for external pages requires playing some tricks and it is not really reliable. Please be assured that the JAF webfont service as such works consistenly across browsers – I realise that these fun projects may give the wrong impression regarding the reliability of my webfonts (which, btw, are not even used in the Futurizer).</p>
      <p>Nick, which country did you try? I found that some pages (such as Canada) are particularly Flash-heavy, which doesn't work very well in Safari, and others (such as Germany) have subframes that display Verdana (which might be possible to fix).</p>
      <p>Miguel, are you really seeing Arial? That's strange. I tested with Chrome Win and Mac and it shows Futura for me, except for some Verdana in Flash and inline frames. Do (referrer-controlled) webfonts generally work in your browser?</p>
