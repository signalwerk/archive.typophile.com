  html: |-
    <p>I found it interesting that a sign on the picture on the <a class="freelinking external" href="http://www.nytimes.com/indexes/2008/01/04/todayspaper/index.html" rel="nofollow">front page of yesterday's New York Times</a> from Barack Obama's campaign was set in Gotham, so I started wondering what fonts all of the candidates are doing.</p>
    <p>Here are some general trends I noticed by looking at their websites. All but Edwards use serif fonts for their names in their logos. Clinton and Obama use Gotham pretty much everywhere, and their font usage seems most standardized of all the candidates. Edwards also uses Gotham, but his site uses other fonts too.</p>
    <p>I doubt it's a coincidence that Clinton, Obama and Edwards all use Gotham, but no other candidates seem to have decided to use the same font as each other. (At least two others are using Helvetica, but that could have been a coincidence.)</p>
    <p>I was hoping to find cooler trends, but I didn't. Maybe someone else who's bored will find this interesting and look for some more.</p>
    <p>I'm also wondering whether anyone has <em>consciously</em> taken the quality of the design of the candidates' campaign materials in selecting whom to vote for.</p>
