      <p><em>Typophile members from countries other than the U.S.: what’s the design like for political candidates in your country?</em></p>
      <p>Democracy is a bit different here in Germany. We don’t elect candidates for president (since we don’t have a president as the executive). We elect political parties. All parties have been using quite sophisticated corporate designs lately.</p>
      <p>CDU (biggest conservative party) uses FF Kievit as corporate typeface (custom version).<br>
      SPD (biggest socialist party) uses The Sans.</p>
