      <p>I drove through Iowa this weekend, a few days after their primary. There were still many campaign signs up, so we got a good look at the variations.</p>
      <p>I got to say, that EDWARDSO8 all jammed together, does not work very well. Particularly in the 1-color version we saw, white type on a deep blue field. Speeding by it on an Interstate or puttering by it down a farm road, it was not reading very well. Cheryl asked: "Does it say 'EDWARD SOB' "? Last time out, when Edwards was running for veep with John Kerry, the signs looked like they were pimping for a guy named "Kerry Edwards," and in fact some reporters dug up folks with that name. Now it looks like someone's mad at some guy name Edward who is a son of a b****. No wonder this guy lags today in New Hampshire.</p>
      <p>Obama's O logo looks amazingly like the logo for a church which I assume to be a conservative Christian church in northern Iowa. Drove by in bad weather too fast for a photo. But I know it pre-dates O's run for the top job.</p>
      <p>Oh, well. Just keep in mind that type and design are not very good criteria when you must decide for whom you shall vote.</p>
      <p>powers</p>
