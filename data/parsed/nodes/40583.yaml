    html: <p>In The Netherlands we don't vote for a person (e.g. president) either. We elect political parties as well. What typefaces they use I dont know from memory, but a couple of parties are <a class="freelinking external" href="http://www.sp.nl/" rel="nofollow">SP</a> (a condensed Univers or Helvetica), <a class="freelinking external" href="http://www.pvda.nl" rel="nofollow">PvdA</a> (apart from the logo, not very consistent. I've seen multiple typefaces, like Scala Sans) and <a class="freelinking external" href="http://www.cda.nl/" rel="nofollow">CDA</a> (also doesn't seem to be really consistent, apart from the logo). But I'm sure they all have official typefaces for their visual identity.</p>
