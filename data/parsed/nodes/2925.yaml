    html: <p>Yves,  <br>I think you did a great job of sounding informative, friendly and humorous all at the same time. The English is perfect.  <br> <br>One thing I can suggest is that it would also be good to have them tell us whatever they know about the backgound of the sample  that might be useful. Information such as the country and age of the sample, and whether it is from a web site, or from a scan of printed material.  (For example, if we know something comes from an advertisement published in the 50's it would rule out a lot of possibilities.) <br> <br>Where will you have this so that new posters are very aware of it?</p>
