    html: <p>I find footnotes best if they are short and serve to directly elucidate some statement in the text. I find footnotes best if they are longer and involve a tangential discussion, e.g. a summary of conflicting opinion on a subject, or of prior scholarship. It is possible to conceive of a text that would have both footnotes and endnotes.</p>
