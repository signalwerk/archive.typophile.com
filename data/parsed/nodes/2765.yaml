    html: <p>I certainly prefer footnotes if I'm the reader. <br>I think end notes can be OK if they are purely academic references - all the info you need when you read it is in the text, and if you need to look up a source, then you can check the endnotes. <br>(Its really annoying though, when all the notes are at the end of the book, rather than the end of each chapter, under headings like 'Notes for Chapter 6', and you have check every page from the reference back to the chapter start to make sure you have the correct reference). <br> <br>In this case, the footnotes include academic references, but also, sometimes, asides, qualifications and clarifications as well as detailed discussion of supporting evidence. Most of this stuff has to be footnoted in order to keep the momentum of the main thrust of the argument going in the text, On the other hand it shouldn't be hidden away, as it includes details which are essential to a more considered appreciation of the finer points of the argument. <br>In this case, as well, I think the demands of the content over-rule any kind of typographic judgement. <br>(typography...over-ruled...am I allowed to say that here?)</p>
