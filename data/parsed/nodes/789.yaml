  html: <p>Greetings Typophiles, <br> <br>This is my first font post to typophile.com. It's a silly little number called Hotcakes. I've always wanted to throw a big, fat slab serif on a lower case "o". The letterforms tilt and bounce on an uneven baseline. This is a work in progress so any thoughts or suggestions are greatly appreciated. <br> <br>The uppercase N makes me cringe. Anyone?? <br> <br><img src="http://www.typophile.com/forums/messages/29/13570.jpg" alt="Hotcakes illustrated..."> <br> <br><img src="http://www.typophile.com/forums/messages/29/13571.jpg" alt="Full set Hotcakes Slim..."> <br> <br><img src="http://www.typophile.com/forums/messages/29/13572.jpg" alt="Full set Hotcakes Bulky..."></p>
  html_clean: <p>Greetings Typophiles, <br> <br>This is my first font post to typophile.com. It's a silly little number called Hotcakes. I've always wanted to throw a big, fat slab serif on a lower case "o". The letterforms tilt and bounce on an uneven baseline. This is a work in progress so any thoughts or suggestions are greatly appreciated. <br> <br>The uppercase N makes me cringe. Anyone?? <br> <br><img src="http://www.typophile.com/forums/messages/29/13570.jpg" alt="Hotcakes illustrated..."> <br> <br><img src="http://www.typophile.com/forums/messages/29/13571.jpg" alt="Full set Hotcakes Slim..."> <br> <br><img src="http://www.typophile.com/forums/messages/29/13572.jpg" alt="Full set Hotcakes Bulky..."></p>
