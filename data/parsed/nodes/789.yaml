  - id: 5645
    user: 2108
    date: 2003-09-02T10:48:00
    date_raw: 2 Sep 2003 — 10:48am
    votes: null
    html: <p>Well, I sort of started from scratch and no letter was spared. The face is overall more controlled and condensed (and slightly heavier). The serifs are smaller and many letters were simplified. Most letters still jump and step, but in a less random manner. The Q, E and l each have an alternate. <br> <br>I experimented with sharp strokes for the UC, but it became more somber and seemed to lose it's playfulness. So I went the opposite direction and tried to round strokes where possible. I'm wondering if I should take this approach with the X, x, y, V and v.  <br> <br>Any and all suggestions are welcome! <br> <br><img src="http://www.typophile.com/forums/messages/29/15217.gif" alt=""></p>
    html_clean: <p>Well, I sort of started from scratch and no letter was spared. The face is overall more controlled and condensed (and slightly heavier). The serifs are smaller and many letters were simplified. Most letters still jump and step, but in a less random manner. The Q, E and l each have an alternate. <br> <br>I experimented with sharp strokes for the UC, but it became more somber and seemed to lose it's playfulness. So I went the opposite direction and tried to round strokes where possible. I'm wondering if I should take this approach with the X, x, y, V and v.  <br> <br>Any and all suggestions are welcome! <br> <br><img src="http://www.typophile.com/forums/messages/29/15217.gif" alt=""></p>
