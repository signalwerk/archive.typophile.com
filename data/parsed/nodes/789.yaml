    html: <p>Well, I sort of started from scratch and no letter was spared. The face is overall more controlled and condensed (and slightly heavier). The serifs are smaller and many letters were simpliﬁed. Most letters still jump and step, but in a less random manner. The Q, E and l each have an alternate. <br><br>I experimented with sharp strokes for the <span class="caps">UC</span>, but it became more somber and seemed to lose it’s playfulness. So I went the opposite direction and tried to round strokes where possible. I’m wondering if I should take this approach with the X, x, y, V and v.  <br><br>Any and all suggestions are welcome! <br><br><img src="http://www.typophile.com/forums/messages/29/15217.gif" alt=""></p>
