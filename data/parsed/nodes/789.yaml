    html: <p>Hi Tom <br><br>i like what i see, some few comments though… <br><br>-.i think you should solve you “n” and “m” like you did it with your “h”, and maybe there you have a “u” also. <br><br>-.i like how you close the eye of the “9”, maybe you should close that way your “p” an “q” <br><br>-.your <span class="caps">UC</span> “O” and “Q” are too open <br><br>-.your “b” looks like an “h”, maybe you should close it someway <br><br>-.i think your “W” should be solve like your “V” <br><br>good luck and good job <br><br><span class="caps">CG</span></p>
