    html: "<p>Just an observation: it reminds me of a cross between Image Club's <a href=\"http://www.identifont.com/show?8EH\">Improv</a> and <a href=\"http://www.paratype.com/default.asp?page=/library/newstyles.asp?fontcode=FF_DLR\">Dolores</a> by Tobias Frere-Jones, only using a more controlled vocabulary. Well, as controlled a vocabulary you can use for a bouncy display face, anyway. <br> <br>Regarding Miguel's comment, perhaps eliminating some of the serifs altogether in the more complex characters such as the 3, B, H, Q, M, m, W, w</p>"
    html_clean: "<p>Just an observation: it reminds me of a cross between Image Club's <a href=\"http://www.identifont.com/show?8EH\" class=\"link-external\">Improv</a> and <a href=\"http://www.paratype.com/default.asp?page=/library/newstyles.asp?fontcode=FF_DLR\" class=\"link-external\">Dolores</a> by Tobias Frere-Jones, only using a more controlled vocabulary. Well, as controlled a vocabulary you can use for a bouncy display face, anyway. <br> <br>Regarding Miguel's comment, perhaps eliminating some of the serifs altogether in the more complex characters such as the 3, B, H, Q, M, m, W, w</p>"
