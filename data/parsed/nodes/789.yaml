    html: <p>It looks nice, but the serifs are too heavy, and makes the typeface too complex.  <br> <br>Resolve it with semi serifs, you need more white spaces.  <br> <br>Use more angles like on the A and V on all the upercases, those curves are pure distraction. <br> <br>M.</p>
