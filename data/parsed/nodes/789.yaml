    html: "<p>Great suggestions all! My initial thought for the font was big honking serifs...but perhaps they honk too loudly. The characters seem to need some breathing room and minimizing the serifs will help. <br> <br>Grant: It's funny, I forgot all about Improv. I thought a serif O was rather unique. Perhaps I should think again? <br> <br>Is the font lacking a funk factor? Should I loosen it up a bit like Delores? <br> <br>I'm going to upload another work in progress called Boneyard and would like to get your suggestions.</p>"
