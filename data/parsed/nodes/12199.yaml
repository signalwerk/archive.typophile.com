    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Blogs" class="freelinking" rel="nofollow">Blogs</a> : Speak Up</strong></p>
    <p>URL: <a href="http://www.underconsideration.com" title="http://www.underconsideration.com">http://www.underconsideration.com</a></p>
    <p>Born on-line – currently growing off-line – in September of 2002, Speak Up is an author-based, reader-supported community devoted to graphic design open to conversation and dialogue. It stresses and questions the importance of the profession in our culture. Speak Up challenges those who practice inside the field, in hope of more accountability for their actions and in light of the responsibility we all have as communicators. Its mission is to further the graphic design profession from within with the goal of creating a stronger and clearer sense of what our role is as professionals endowed with the duty of creating social, cultural, political and/or economical communications based on our ability and obligation to do so in a visually clear and comprehensible manner. </p>
    <p>Through interviews, discussions, reviews and supported by openness, honesty and immediacy, Speak Up strives to distinguish exceptional practices in graphic design that exemplify the importance and relevance of the profession as well as shed light on those that deteriorate it. By talking amongst ourselves (an activity continuously regarded as ineffective) it is possible to ascertain the significance and relevance of those practicing under the umbrella of graphic design. </p>
    <p>Shaped by its authors, readers and random contributors Speak Up has grown into one of the most dynamic communities within graphic design. With its emphasis on an open dialogue it has managed to capture the attention and interest of the profession but more importantly has provided a forum and given a voice to otherwise unheard graphic designers. </p>
    <p>Speak Up moves, grows and shifts in parallel with graphic design, rendering the participation of those within its most valuable advantage. It would not exist if it weren’t for the graphic designers who choose to express their opinion and make their voices heard. In that sense, Speak Up embodies consistently and sinuously the ever-evolving profession that shapes the world’s visual environment.</p>
    <p>Authors: <a href="/wiki/Armin%20Vit" class="freelinking" rel="nofollow">Armin Vit</a>, <a href="/wiki/Marian%20Bantjes" class="freelinking" rel="nofollow">Marian Bantjes</a>, <a href="/wiki/Bryony%20Gomez-Palacio" class="freelinking" rel="nofollow">Bryony Gomez-Palacio</a>, <a href="/wiki/Bradley%20Gutting" class="freelinking" rel="nofollow">Bradley Gutting</a>, <a href="/wiki/M.%20Kingsley" class="freelinking" rel="nofollow">M. Kingsley</a>, <a href="/wiki/Tan%20Le" class="freelinking" rel="nofollow">Tan Le</a>, <a href="/wiki/Kevin%20Lo" class="freelinking" rel="nofollow">Kevin Lo</a>, <a href="/wiki/Debbie%20Millman" class="freelinking" rel="nofollow">Debbie Millman</a>, <a href="/wiki/Peter%20Scherrer" class="freelinking" rel="nofollow">Peter Scherrer</a>, <a href="/wiki/Gunnar%20Swanson" class="freelinking" rel="nofollow">Gunnar Swanson</a>. <a href="/wiki/Jason%20A.%20Tselentis" class="freelinking" rel="nofollow">Jason A. Tselentis</a>, <a href="/wiki/David%20Weinberger" class="freelinking" rel="nofollow">David Weinberger</a>, <a href="/wiki/Graham%20Wood" class="freelinking" rel="nofollow">Graham Wood</a></p>
