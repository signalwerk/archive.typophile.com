    html: |-
      <p>After nearly 40 years, I'm not 100% certain they used the Monotype Co. for this job, or what machines Monotype Co. had. Monotype Co. wasn't the only typesetter that Brookings used, but most of their work was set in metal. It was often printed offset from repro proofs; the place I worked was the only printer they used that could still print 16-page forms on a letterpress.<br>
      Some of Brookings' economics publications were dense with equations and tables, and they invariably set those on Monotype machines. This particular example has no equations or tables in it.</p>
