    </p><div class="imageWrap"><img src="/files/okun_6653.jpg"></div><br>
    From 1974 to 1978, I was a customer-service rep at Garamond/Pridemark Press, a now-defunct Baltimore printing company with its roots in a print shop founded by Norman T.A. Munder in 1878. One of our steady clients in the 70s was the Brookings Institution, whose director of publications, Roland Hoover, was a fine amateur letterpress printer (and later became University Printer at Yale).<br>
    Brookings used to have its monographs set metal by the Monotype Co. in Baltimore, printed at Garamond/Pridemark in runs of about 1500 on 60# Warren's Old Style. Sometimes we would even print them directly from the type on a big old Miehle letterpress that was still in commercial use at that time.<br>
    This copy is the 20th printing, but the copyright date is 1975, and it has all the earmarks of the books Roland Hoover did at Monotype: Electra text, with Dwiggins' cursive, not the italic, and Perpetua headings. I'm pretty sure the first printing of this book crossed my desk.<p></p>
