    html: "<p>Seanmichael -- <br> <br>Your page says \"It is all offset printed.\" Given the date, I would be very surprised if it was offset. Perhaps you meant to say letterpress. <br> <br>As you noted, Bradley was the most prominent exponent of the Art Nouveau / Arts and Crafts movement in America. He established the Wayside Press in Springfield, Massachusetts, sometime around 1896. <i>Bradley: His Book</i> was a magazine that he published for two years until he disbanded the press in 1896 due to poor health. He sold his press to the University Press in Cambridge, Mass., and went to work for them for a while to pay off debts. <br> <br>Bradley did some lettering work for <i>The Inland Printer.</i> In 1895 ATF bought the rights to produce some of his cover lettering as type. That began Bradley's relationship with ATF.  <br> <br>Strathmore Paper (headquartered in Springfield, Mass.) was one of Bradley's customers at the Wayside Press. I believe he continued to do design and illustration work for Strathmore promotions even after he closed the press.  <br> <br>After closing the his press, Bradley continued to work as a designer and illustrator for magazines and advertising. He designed a successful campaign of promotions for ATF demonstrating how to use ATF types to great advantage in advertising.  <br> <br>Later he went on to work as art editor for various prominent magazines of the day, including <i>Collier's Magazine</i> and <i>Good Housekeeping.</i> <br> <br>In 1955, the Typophiles published a chapbook honoring Bradley and it includes his \"Notes Toward an Autobiography.\" Later, Dover Publications printed a collection of his artwork and included the \"Notes\" in the introduction. You may be able to find a copy of the Dover book in your library or used. <br></p>"
    html_clean: "<p>Seanmichael -- <br> <br>Your page says \"It is all offset printed.\" Given the date, I would be very surprised if it was offset. Perhaps you meant to say letterpress. <br> <br>As you noted, Bradley was the most prominent exponent of the Art Nouveau / Arts and Crafts movement in America. He established the Wayside Press in Springfield, Massachusetts, sometime around 1896. <i>Bradley: His Book</i> was a magazine that he published for two years until he disbanded the press in 1896 due to poor health. He sold his press to the University Press in Cambridge, Mass., and went to work for them for a while to pay off debts. <br> <br>Bradley did some lettering work for <i>The Inland Printer.</i> In 1895 ATF bought the rights to produce some of his cover lettering as type. That began Bradley's relationship with ATF.  <br> <br>Strathmore Paper (headquartered in Springfield, Mass.) was one of Bradley's customers at the Wayside Press. I believe he continued to do design and illustration work for Strathmore promotions even after he closed the press.  <br> <br>After closing the his press, Bradley continued to work as a designer and illustrator for magazines and advertising. He designed a successful campaign of promotions for ATF demonstrating how to use ATF types to great advantage in advertising.  <br> <br>Later he went on to work as art editor for various prominent magazines of the day, including <i>Collier's Magazine</i> and <i>Good Housekeeping.</i> <br> <br>In 1955, the Typophiles published a chapbook honoring Bradley and it includes his \"Notes Toward an Autobiography.\" Later, Dover Publications printed a collection of his artwork and included the \"Notes\" in the introduction. You may be able to find a copy of the Dover book in your library or used. <br></p>"
