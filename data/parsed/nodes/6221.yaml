    html: <p>It is beautiful. I love the texture. The type is by American Type Founders' Company. <br> <br>It took me awhile to get around to it, but <a href="http://www.explodeddrawing.com/bradley">here are some photos</a>. I am afraid to lay it flat on my scanner. <br> <br>If anyone (Isaac ?) can give me some more info that would be great. <br> <br>Here is bit that I do know. Will H. Bradley (1868-1962) became, and is still regarded as, one of the masters of book, magazine, and graphic design during the Art Nouveau and Arts and Crafts periods. Bradley's typographic and illustrative work expanded the boundaries of both fields. He re-introduced Caslon type through his book work. <br> <br>I</p>
