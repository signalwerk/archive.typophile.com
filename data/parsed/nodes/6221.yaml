    html: <p>Oops. Of course it is letterpress. That is what is so beautiful about it! It must be the excitement getting to me.<i>(not to mention the illustrations!)</i>  <br>  <br>I took it to my local antique book seller and he said it was likely worth $1000! Worth much more than money  to me though. My plan is to do away with it just as it came into my hands. Someday, after I <i> think</i> I am some sort of accomplished designer I will give it to someone who recognizes it's beauty and is inspired by it just as I am. That is the best way I can see to preserve it.  <br>  <br>On top of it all, and upon a closer look, the <a href="http://www.explodeddrawing.com/bradley/">inscription</a> is from William Dana Orcutt. What luck!  <br>  <br>Thanks Lew, for the background. I really like Whitman and am looking forward to it's public release. When I am further along, I would be happy if you would critique a face I am working on. I would appreciate your feedback.   <br>  <br>smc</p>
