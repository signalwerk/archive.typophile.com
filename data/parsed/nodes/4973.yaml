    html: "<p>My 2 cents: <br>The 2 A's look overdesigned, and remind me of the anarchic A's of the heavy-metal ages. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> WHy don't you try to keep the curly crossbar (and maybe make it subtler) but raise it's right end so that it intersects the right stem of the first A a bit higher? <br> <br>Also, if you plan to use rounded shapes as design elements, I think you should soften a bit the letter shapes (look at British Airways logo and Mylius font).</p>"
    html_clean: "<p>My 2 cents: <br>The 2 A's look overdesigned, and remind me of the anarchic A's of the heavy-metal ages. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> WHy don't you try to keep the curly crossbar (and maybe make it subtler) but raise it's right end so that it intersects the right stem of the first A a bit higher? <br> <br>Also, if you plan to use rounded shapes as design elements, I think you should soften a bit the letter shapes (look at British Airways logo and Mylius font).</p>"
  - id: 36203
    user: 804
    date: 2004-05-31T07:28:00
    date_raw: 31 May 2004 — 7:28am
    votes: null
    html: <p>Futher explanation and responses to posts. <br>Arya wanted to modernise and synchronize their identity witout modifying the Zoraster icon they already use. As I discovered once I got started was that the sacred geometry and symbology associated with the character could not be modified, as there was a reason for everything in it. Although I would have liked to re-render it in vector for userbility and refinement I was discouraged to do so by client.  <br> <br>The comps shown were really my first attempt at this to show client some direction. I banged this out the same night after our initial brief 10 minute meeting.  <br>The next day when we had a real meetiung scheduled I was surprised to discover client liked it all as is (top version).  <br>In some strange way disappointing as I like many other typophiles really enjoy the refinement aspect of a project like this. <br> <br>One issue is that we are doing mostly trade, and what was not determined was $ exchange in our short 10 min. meeting. I trust this client because of the referral, so I went ahead with comps as shown. <br>So what now? Well I have approval and exchange negotiated, so I will continue with content. <br> <br>I agree the "A"s aret not perfect (btw I enjoyed your comment about heavy metal Marius-I can see where you how you see the associated, at least if the type is isolated).  <br>Black is to stark-" It always expresses suffering and struggle" I don't agree, Pirates always seemed to be having a good time-just kidding, anyway in final version they will be a warm dark reddish black/maroon. <br> <br>About spot color on "Guide" - just a comp to show client what we could use. It will be solid-thanks Chase a good observation. <br>I does lokk a bit off. <br> <br>A word of advice. Trades can be nice but be careful-it is not a good practise to get in the habit of doing so, especially if you have a sales rep. </p>
    html_clean: <p>Futher explanation and responses to posts. <br>Arya wanted to modernise and synchronize their identity witout modifying the Zoraster icon they already use. As I discovered once I got started was that the sacred geometry and symbology associated with the character could not be modified, as there was a reason for everything in it. Although I would have liked to re-render it in vector for userbility and refinement I was discouraged to do so by client.  <br> <br>The comps shown were really my first attempt at this to show client some direction. I banged this out the same night after our initial brief 10 minute meeting.  <br>The next day when we had a real meetiung scheduled I was surprised to discover client liked it all as is (top version).  <br>In some strange way disappointing as I like many other typophiles really enjoy the refinement aspect of a project like this. <br> <br>One issue is that we are doing mostly trade, and what was not determined was $ exchange in our short 10 min. meeting. I trust this client because of the referral, so I went ahead with comps as shown. <br>So what now? Well I have approval and exchange negotiated, so I will continue with content. <br> <br>I agree the "A"s aret not perfect (btw I enjoyed your comment about heavy metal Marius-I can see where you how you see the associated, at least if the type is isolated).  <br>Black is to stark-" It always expresses suffering and struggle" I don't agree, Pirates always seemed to be having a good time-just kidding, anyway in final version they will be a warm dark reddish black/maroon. <br> <br>About spot color on "Guide" - just a comp to show client what we could use. It will be solid-thanks Chase a good observation. <br>I does lokk a bit off. <br> <br>A word of advice. Trades can be nice but be careful-it is not a good practise to get in the habit of doing so, especially if you have a sales rep. </p>
