    html: |-
      <p>The closest I've been able to find are: </p>
      <p>1)  A font based on the Splendid Olympia Typewriter, named <a class="freelinking external" href="http://www.dafont.com/splendid66.font" rel="nofollow">Splendid 66</a>.  The unique combination of that particular '5' and the open '4' tends to eliminate most candidates.</p>
      <p>and, not as close, </p>
      <p>2) <a class="freelinking external" href="http://www.dafont.com/typewriter-royal-20.font" rel="nofollow">Royal 200 typewriter</a>. There's a current digital font by "Mr. Fisk" named Typewriter Royal 200 .</p>
      <p>The text  (Jan and Apr) in your image is too garbled to be of any use.</p>
      <p>- Herb</p>
