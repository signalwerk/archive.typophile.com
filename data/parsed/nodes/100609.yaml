      <p>I could see opinions posted here being used to guide a lawyer's thinking about a case, but its unlikely that they'd be submitted as evidence in a trial. A lawyer would need to present the poster's credentials to establish them as an expert witness, plus these posts are not made under oath, and the poster cannot be cross-examined. </p>
