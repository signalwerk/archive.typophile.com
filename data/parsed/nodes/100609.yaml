      <p>I wouldn't have any particular qualms about helping you if I could, but the image is so fuzzy and pixelated, and the text so short, that narrowing it down to a specific model seems nearly impossible.</p>
      <p>When do you think this document was typed? Is there a particular machine that you're trying to prove could or could not have typed it?</p>
      <p>And, yes, letting us know what this is all about might help — not only to put our consciences at ease, but also to help us look at your question from the right direction.</p>
