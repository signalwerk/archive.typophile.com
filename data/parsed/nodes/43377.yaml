      <p>Revia. But please bear in mind that the whole verse is a little bit problematic.<br>
      For example, see the book Et Sofer by  Radak (Rabbi David Kimhi/ Qimchi , 1160 – 1235) — revia. Moreover, Rashbam (Rabbi Shmuel ben  Meir, 1085 - 1158) said  revia instead of double geresh  —   'ets peri; see Babli  Chullin (Holin) 60:1.</p>
