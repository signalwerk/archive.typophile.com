    html: |-
      <p>@ David Berlow</p>
      <p><em>Every once in a while, FL seems to completely lose all the changes made during a work session despite numerous savings.</em></p>
      <p>Yes, I had that and thought how illogical it was. It turned out that I have done a <em>Save as...</em> (without really thinking) and because I had been working on a completely different font in a different location, the file was saved in that really weird and rather arbitrary location. Hence I now had two files with same name in different places. Open the original (which you are confident of having overwritten) and it's the same old, same old. The key is to find if you did a <em>Save as...</em> and, if you did, where you saved the <em>Save as...</em> version. It might not be as bad as you think.</p>
      <p>Of course, it might be as bad as you think, it might be a bug and I gather that FontLab has a few of those. Nevertheless not many people stick up for its virtues in this forum. I like it, especially when it behaves.</p>
    html_clean: |-
