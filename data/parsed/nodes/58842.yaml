      <p>I disabled .bak files two years ago, but now I save my .vfb files with a different name if a significant change has been done: Fondo01, Fondo02, Fondo03, &amp;c. It is better for me, but as a side effect I have a lot of files for the same font, so if you are trying to simplify your directories, maybe this solution is not for you. Time Machine is a very good choice, as well.</p>
      <p>On the other hand, I recall a couple of times when I just hit Command + S and said: “Ouh! This is not supposed to be saved, it is just a test!” Those old days, .bak file saved my day.</p>
