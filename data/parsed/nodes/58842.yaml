  html: <p>I’m considering disabling the creation of .bak files in Fontlab to simplify my working directories. I’ve never run into any trouble with Fontlab corrupting my VFB files, and with Time Machine handle my backups reasonably well I feel safe doing this. But before I do, are there still any reasons to leave this feature enabled?</p>
