    <p>Hello there, thank you please if you can help me?<br>
     I am hoping you might recognize this font that is<br>
    -- sort of serif-y<br>
    -- and has horizontal lines across lower case letters.<br>
    --It has diamonds over all vowels, and under the s<br>
    --The ampersand is pretty wild with a long wavery tail<br>
    --some of the letters are above or below the horizontal pediment<br>
    --there is a little decorative blip at the top of the rounds of the lower case letters<br>
    --The Capital letters are seeming tilted forward or back a bit<br>
    -- it is from a wordpress blog page, probably made in the last couple years<br>
    --I thought at first it might be hand drawn, which I think I could do, but will also have to take out ''steady hand insurance" or else it might really run uphill and downhill. lol</p>
    <p>Thank you for reading my words.<br>
    Kind regards,<br>
    Archangel</p>
