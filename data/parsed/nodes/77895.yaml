      <p>Oh yeah - thanks.  :-)</p>
      <p>BTW I've previously mentioned what I consider to be the "best compromise solution" to the problem I stated above, but this is a good place to repeat it: make the cluster of weights that are pretty close to the Regular uniwidth, and make the outlying weights a fixed tracking amount away from that.* In this way the design of the outlying weights isn't notably compromised, but <em>if</em> the user has a strong need to maintain linebreaks (or wants to do some overlay/fading animation) he can decide to sacrifice the spacing a bit to achieve that. I've been calling this "fixed offset" spacing.</p>
      <p>* I've done that in Nour&amp;Patria, where the Regular and Demi are uniwidth, while the Light/Bold are +10/-10 tracking units away from them. BTW Nina and I almost managed to pull it off for Ernestine(&amp;Vem) where the difference between each step was going to be 13 units, but it became too much of a time hog.</p>
      <p>hhp</p>
