      <p><cite>Is it not useful for a typographer to be able to switch weights (other than tabular figures) without having to change things because it doesn't fit anymore?</cite></p>
      <p>Sure it’s useful, but only under certain circumstances. If a complex document is going to be tweaked a whole lot during the design it’s nice to not have paragraphs reflow. I’m not sure how common a situation like this really is; I don’t see publication designers clamoring for families with matching widths. </p>
      <p>If you’re going to do this you should probably plan out a family from scratch and test prototype fonts for the entire family before you undertake designing entire fonts. That way you won’t get to the bold/italic fonts and find that you have to go back and make major changes to the work you already did. Also, it would probably help you to read Stanley Hess’ book <em>The Modification of Letterforms</em> to help you understand how to plan out a type system.</p>
    html_clean: |-
