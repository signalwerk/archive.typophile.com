      <p>The concept of Grades — such as you find in Font Bureau’s Readability Series (<a href="http://www.fontbureau.com/fonts/Quiosco/" rel="nofollow">Quiosco</a>, for instance) or in some H&amp;FJ workhorses (like <a href="http://www.typography.com/fonts/font_features.php?featureID=1&amp;productLineID=100017" rel="nofollow">Mercury Text</a>, for example) — is built upon consistent widths across all grade variants.</p>
      <p>This does not usually extend to the Bold weight, however.</p>
      <p>One exception might be <a href="http://www.fontbureau.com/newspaper/fonts/agate/PoynterAgate/" rel="nofollow">Poynter Agate</a>, where I think the consistent widths apply to all weights, as well as all grades, in a style (since an agate type is typically employed in tabular material, like stock listings or sports scores). </p>
      <p>If I recall correctly, when Akira Kobayashi created his version of <a href="http://linotype.com/135960/metrooffice-family.html" rel="nofollow">Metro Office</a> (based on Dwiggins’s Metro design), he put all styles on a single set of widths, mimicking the duplexing of metal Linotype designs. I’m not sure this feature has much real value.</p>
      <p>Beyond these limited situations, I’m not certain about any real practical value to consistent widths across a broad weight spectrum. Seems like a lot of sacrifice might be necessary. And I can’t think of any practical value to having them “close but not quite,” unless it just happens that way.</p>
      <p>But maybe it would be an interesting gimmick. The proof will be in the design.</p>
