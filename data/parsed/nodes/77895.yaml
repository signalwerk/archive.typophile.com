      <p>For reasons of mechanical efficiency, the Linotype system introduced two-character matrices in 1898.<br>
      The two characters were in fact the same character (we now call them glyphs), but in different styles -- usually roman and italic of the same weight, or regular and bold roman.<br>
      Therefore, each letter of the font shared its width with the corresponding character of the other font.</p>
      <p>And so, many typefaces that were published by Linotype in the early 20th century had identical character widths in regular and bold weights. However, their digital versions might not conform to the original specification.</p>
      <p>This equivalence of weight width was useful to typographers in settings such as classified advertising and charts.<br>
      Consistency of width across weight is still much used today for tabular figures, with genres such as financial reports in mind.</p>
      <p>Hope I got that right, Kent!</p>
      <p>BTW, you might find David Consuegra's book useful, in particular his timeline.<br>
      <a href="http://www.amazon.com/s/ref=nb_sb_noss?url=search-alias%3Daps&amp;field-keywords=consuegra+type&amp;x=0&amp;y=0" title="http://www.amazon.com/s/ref=nb_sb_noss?url=search-alias%3Daps&amp;field-keywords=consuegra+type&amp;x=0&amp;y=0">http://www.amazon.com/s/ref=nb_sb_noss?url=search-alias%3Daps&amp;field-keyw...</a></p>
