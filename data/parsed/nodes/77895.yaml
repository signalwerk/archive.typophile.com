      <p>Here is an example of the typical selection of two-letter matrices for a Linotype face:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/two_letter_5076.jpg"></div><p></p>
      <p>As can be seen, the usual case is to put the regular form of the face on the matrix with the italic. Small caps are on two-letter matrices as well, but with the numerals and ligatures, so sometimes a two-letter matrix can have two different characters on it, instead of two different styles of the same character.</p>
      <p>However, it is true that bold sometimes also shared the matrix with the normal weight:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/two_letter2_3769.jpg"></div><p></p>
      <p>because there were purposes for which bold, rather than italic, would be mixed with the text.</p>
      <p>Italics having the same width as plain is almost a defining characteristic of Linotype faces; as setting requiring roman, italic and bold is also common, I think some faces also had a wider bold on one-letter matrices that were put into an attachment to the Linotype machine to allow it to have a wider selection of characters.</p>
