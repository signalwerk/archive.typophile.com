      <p>I had missed this. FWIW, I call this "unwidth". I think it's definitely an advantage... as long as it doesn't cause more important things to go off. It's good because if you want to change the style of even just a snippet of your text after you've made everything look nice it can make all the difference. There are some other fringe advantages too, for example in some kinds of animated text.</p>
      <p>The problem is that beyond a certain weight range the character of the design -arguably more important than the advantages above- goes off. Looking at Else* I have to say that the -resultant- width difference between the Light and the Bold is too much. But strangely enough in Axia** it doesn't seem so bad... It might have to do with how strong the character of the design is: Else is pretty generic, so it can't handle the width difference, while Axia is pretty distinctive so the width difference doesn't overpower its character. Maybe.</p>
      <p>* <a href="http://www.myfonts.com/fonts/adobe/else-npl/" title="http://www.myfonts.com/fonts/adobe/else-npl/">http://www.myfonts.com/fonts/adobe/else-npl/</a><br>
      ** <a href="http://typographica.org/typeface-reviews/axia/" title="http://typographica.org/typeface-reviews/axia/">http://typographica.org/typeface-reviews/axia/</a></p>
      <p>Another thing that might suffer too much between very different weights is apparent size; for example you rarely want a passage in Bold looking <em>smaller</em> than a Light it's embedded in or next to. Look how much bigger Else's Light looks than its Bold.</p>
      <p>BTW Jasper, I see no advantage to "almost uniwidth".</p>
      <p>See also:<br>
      <a href="http://typophile.com/node/91519" title="http://typophile.com/node/91519">http://typophile.com/node/91519</a><br>
      <a href="http://www.typophile.com/node/61252" title="http://www.typophile.com/node/61252">http://www.typophile.com/node/61252</a></p>
      <p>hhp</p>
