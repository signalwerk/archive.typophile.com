    <p>Please forgive a newbe for jumping in so quickly, but I could use some help. </p>
    <p>I came along in the days of print media and am well versed in the conventions for using typefaces in that context. Well, now I'm in the internet world and am confused. </p>
    <p>Opinions seem split right down the middle regarding the use of a serif typeface for body text as is generally recommended in print. Some seem to think sans is easier to read on screen, others continue in the serif tradition. (I noticed this site is using a serif face.) When working on my current project, I keep decreasing the view to get a sense of how something might appear on a mobile phone, and it does seem like sans holds up better at this scale. Any thoughts? (And many thanks!)</p>
