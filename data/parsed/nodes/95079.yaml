      <p>Android uses a tweaked Freetype for text rendering. As a general rule, imho, i would say that Android will often render an unhinted truetype font in much the same way (or better) than the same truetype manually hinted in the old school manner. I wonder if the old school hinting carried out for ye olde windows GDI is a bit overkill on todays devices? Freetype's built in autohinter seems to do a much better job with unhinted fonts than it's bytecode interpreter does with old school hinted fonts, especially given the luxury of hi res.</p>
      <p>In terms of good looking type that renders well on these devices i agree with the suggestion of the Font Bureau RE fonts. Are they free to users though? i forget, but i'm guessing 'yes they are', or 'yes kind of'. But it's worth mentioning licensing - the web and mobile devices are increasingly reliant on typeset text being 'open' to all users, so the font you use is absolutely best being unrestricted too. The RE fonts though you will pay for per amount of bandwidth per month caused by your users/readers pulling the font from the server. More readers = more bandwidth = more $$$s. Could be a great investment, or could be the reason you go hungry ;)</p>
