      <p>I say, serif. Like Georgia, the font you're reading. While sans might conceivably be better for very small text on very small screens, the web and its readers are not so typographically impoverished that they can't handle serifs. With 300 dpi resolution on some smart phones, any typeface will be pretty readable anyway. Even if they're somewhat less readable than sans, I think the serifs are worth it.</p>
      <p>Actually, I think this kind of thing should be dictated by the theme and content of the site. So what's the site about? How long is the text? Who are your target readers? Etc.</p>
