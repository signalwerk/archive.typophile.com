      <p>As old as Humankind.<br>
      I don't consider myself a capitalist (quite the contrary) but the relevance of <em>materialism</em> cannot be brushed aside. In fact materialism is the covert heart of the open-source philosophy, because it's all about possessing <em>things</em> without giving up <em>things</em> in return. The altruists (like Dave Crossland and maybe yourself) are the priests driving the bandwagons, but the people jumping on them just want the free ride. The priests however would be out of a job without them.</p>
      <p>Don't get me wrong, it's not that one should only do things for money (if anything I myself spend too much time helping people and not making enough money) it's that people shouldn't repurpose their own desire to save money into a belief/delusion that others should make free things for them.</p>
      <blockquote><p>a font that is both excellent, and, that lots of people want to use.</p></blockquote>
      <p>I'm no miracle worker.<br>
      You can hold me responsible for flaws in my fonts, but not for flaws in society.</p>
      <p>It's neither the popularity nor the free/open-source nature of Oswald* that causes "long-term" type designers to see flaws in it. We see flaws in it because there are flaws in it. More to the point: if you were to <em>invest</em> more time into it there would be fewer flaws. Except you don't live in a barrel.</p>
      <p>* <a href="http://typophile.com/node/98761" title="http://typophile.com/node/98761">http://typophile.com/node/98761</a></p>
      <p>hhp</p>
