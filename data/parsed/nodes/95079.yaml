      <p>Web developers, as opposed to users, have to have all that stuff, and a service for the other content on their site, someone or thing, to design, write copy, handle graphics and maintain the site through changes in cross-platform standards, manage any incoming or out flowing data, messages, and sundry web developer things. On top of all that, they can use our RE fonts for 30 days for free. </p>
