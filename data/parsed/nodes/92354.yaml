  html: |-
    <p>Hi all</p>
    <p>I'm trying to create the opentype for Small Caps.<br>
    I have two classes, smcp1 and smcp2 which contain the lowercase and small caps.<br>
    In the Opentype window I have the feature 'smcp' with</p>
    <p><code><br>
    feature smcp {<br>
      sub @smcp1 by @smcp2;<br>
    } smcp;<br></code></p>
    <p>When I compile I get the following warning:</p>
    <p>Feature block seen before any language system statement.  You should place language system statements before any feature definition.</p>
    <p>What is a language system statement?</p>
    <p>How do I place language system statements before any feature definition.</p>
