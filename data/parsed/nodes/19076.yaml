    <p>“I’ve been testing Windows on a new iMac for several days,” writes Walt Mossberg for the Wall Street Journal, “and except for a couple of trifling annoyances, it runs perfectly, just like a stand-alone Windows PC...In Windows mode, the iMac was blazingly fast — far faster than my two-year-old H-P Windows computer. And every function of Windows I tested, including Web browsing, email and music playback, ran flawlessly.”</p>
    <p>true?</p>
