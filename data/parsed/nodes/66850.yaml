      <p>Ah Ha! I had a dream last night and it struck me as to where I have seen that "S" before. One word.... Tiki.</p>
      <p>So I Googled "Tiki Fonts" this morning. Check out the words "Saltwater Taffy" here:<br>
      <a href="http://www.curtshellerpublications.com/images/font/HouseIndustries-Tiki.png" title="http://www.curtshellerpublications.com/images/font/HouseIndustries-Tiki.png">http://www.curtshellerpublications.com/images/font/HouseIndustries-Tiki.png</a><br>
      Not exact, but closer. That "S" shares that same unsymmetrical attribute.</p>
      <p>I found this on the Trader Vic's website.<br>
      <a href="http://www.tradervicsgourmet.com/images/homepic_title.jpg" title="http://www.tradervicsgourmet.com/images/homepic_title.jpg">http://www.tradervicsgourmet.com/images/homepic_title.jpg</a><br>
      It has the cursive, and the simple looped lowercase "a". The "d" matches.</p>
      <p>Here there is a font that is pretty close.<br>
      <a href="http://www.coconutinfo.com/macosxfonts.html" title="http://www.coconutinfo.com/macosxfonts.html">http://www.coconutinfo.com/macosxfonts.html</a><br>
      Look at Pilaki Font. And it has a little background on the font: "Based on the 'modern' scripts of Robert E. Smith (1940s), Pilaki's brush-written characteristics, although fairly common, remain popular. It's jazzy yet informal, and best of all has all Hawaiian pronunciation markings. You'll want its casual looks for advertising and sales since it's great for posters and signs."</p>
      <p>I think I am getting closer... haven't found it exactly yet. What do you all thing? Am I getting warm?</p>
