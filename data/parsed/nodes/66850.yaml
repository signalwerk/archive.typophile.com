    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sadieSeafont_3585.png"></div><br>
    Greetings...<br>
    This is the sign on the side of my brother's boat. We want the website to match, but I can't figure out what the heck font it is.<p></p>
    <p>It is a little cartoonish. The letters are connected, as in cursive. The lower case "a" is closed loop, very unusual. The uppercase "S" is very odd, with a thick, rounded head, and the top and bottom are different. The upper case "C" has a vertical stroke on the top. Weird.</p>
    <p>I am beginning to think that it was simple hand painted. But it is in more than one place on the boat. So how did the artist reproduce this?</p>
    <p>Thanks!</p>
  html_clean: |-
