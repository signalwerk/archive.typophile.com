    <p>i'm verry new to font making and am stuck on the feature i want to make. there are all glyphs made and in some typing occasions i want them to be different: when i type "gj", or "jj" or "yj" i want them to join in a specific way (j is shorter). should i make a separate glyph of those pairs or should i make different glyphs of the same letters and put some script that says how they should join when follow each other?</p>
