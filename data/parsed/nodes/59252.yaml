      <p>I'm not such an expert on this, but I think you do this:</p>
      <p>You make a new character by going to Glyph -&gt; Generate Glyphs. In the top field in the window that appears you can name the new glyph, use something like y_j. Open the glyph, and design your yj ligature.</p>
      <p>Then go to Window -&gt; Panels -&gt; OpenType. Click the little + sign on the lower left of the OpenType panel. This creates a new (but empty) opentype feature.</p>
      <p>Select the new feature in the left field of the window, and replace the default:</p>
      <p><code>feature xxxx {<br>
        sub by ;<br>
      } xxxx;</code></p>
      <p>with:</p>
      <p><code>feature liga {<br>
      sub y j by y_j;<br>
      } liga;</code></p>
      <p>If you have more ligatures, just place them underneath the last one, above the bottom "} liga;".</p>
    html_clean: |-
