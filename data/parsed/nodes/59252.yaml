      <p>In case you are only changing the design of the 'j' and not the letters that precede it, it would make more sense to use contextual alternate (calt) feature.</p>
      <p><cite>Are there words that use jj combinations?</cite><br>
      The Thai Prime Minister Vejjajiva comes to mind. <a href="http://www.as8.it/linguistics/languages_at_a_glance.html">"Languages at a Glance"</a> compiled by Eben Sorkin further provides the Danish hajjæger, the Dutch pijjekker, the English avijja and hajji, the Hungarian ujjak, the Norwegian hasjjag, the Polish trójjęzyczność, and the Swedish nojja.</p>
