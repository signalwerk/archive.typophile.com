      <p>Ah. Using fonts. My favorite horse. Or perhaps Sancho's donkey? Isn't that a windmill over yonder?</p>
      <p>Whether you use ligatures or contextual alternates depends. First of all, only a little current software supports OpenType features. Of those that do, most support ligatures, fewer support contextual alternates.</p>
      <p>Ligatures may revert to the base characters when a certain tracking value is reached. You may or may not want them to. If not, contextual alternates would be best. If you want the end user to think about whether or not to use them, they are discretionary ligatures (*dlig*). If you want him/her to take effort to not use them, put them in *liga*.</p>
      <p>Currently, contextual alternates -- or ligatures -- are a group that is either on or off. That is, you get all or none. If you want several stylistic variations which are independent of each other, put them in stylistic sets -- which even less software supports.</p>
      <p>Finally, almost all letter pairs in the Latin alphabet occur. I learned that with King Arthur's mom, suddenly needing to kern Yg (Ygraine).</p>
