      <p>Chris, you might be in luck! Hiragino Mincho Pro was not designed in Cupertino by Apple. They licensed it. Maybe the company they licensed it from will license you a PC version?</p>
      <p>Some designer/distribution info is embedded in the font (I viewed this information with Linotype's FontExplorer X utility, which will be publicly available soon):</p>
      <p>The font was designed by JIYUKOBO Ltd.<br>
      Their URL is <a href="http://www.jiyu-kobo.co.jp/">http://www.jiyu-kobo.co.jp/</a><br>
      The font's manufacturer/distributor is Dainippon Screen Mfg. Co., Ltd.<br>
      Their URL is <a href="http://www.screen.co.jp/font/">http://www.screen.co.jp/font/</a></p>
      <p>Hiragino is a trademark of Dainippon Screen Mfg. Co., Ltd. registered in Japan.</p>
      <p>Dainippon Screen's site is all in Japanese. But maybe you can find an e-mail link?</p>
