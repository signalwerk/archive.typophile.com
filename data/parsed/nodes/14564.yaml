    <p>So, for reasons I won't get into, I need to point someone towards a verson of Hiragino Mincho Pro that they can license for the PC. It comes with Mac OS X, but that doesn't help me, since I assume the license won't permit me to just email them the OT fonts, even thought it would be really easy and I got them for free.</p>
    <p>Grrr.</p>
    <p>Does anyone know where this font (both weights: W3 + W6) are available? The person using them is a native Japanese speaker, so Japanese sites are fine.</p>
