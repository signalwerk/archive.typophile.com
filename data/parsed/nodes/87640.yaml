    <p>STEFAN SEIFERT</p>
    <p><em><strong>«Frammenti della Bellezza»</strong></em> [„Fragments of Beauty“]<br>
    (uno studio di caratteri)</p>
    <p>*</p>
    <p><em>Pieces of my personal typeface work and also researches about beauty in general from my very personal point of view: expanding from renaissance painting to Proust, from fashion photography (as especially the work of Paolo Roversi) to my love to Italy and more…</em> [<a href="http://typophile.com/files/Titel-Probe_rev_oE+Sp.jpg" target="_blank" rel="nofollow">title</a>]</p>
