    <p>I hat to get all political, so I'm posting this rant in my Typophile "Blog" section.</p>
    <p>Via Design Observer, I just came across Al Gore's <a href="http://www.nytimes.com/imagepages/2008/04/06/weekinreview/06heller.html" rel="nofollow">new logo</a>.</p>
    <p>This design really bothers me. To me, the "flip the m in me around to change it into a w" gimmick is not funny. What it seems he wants is for us to about all of us instead of ourselves as individuals. This is very noble and would might make a change. But when I look at the logo, I see that word in the center looking like a "me" instead of "we" and I suddenly think that the whole purpose of this movement might be more about <em>Al-Gore-the-person-and-what-he's-doing-to-save-the-environment-and-how-it-is-all-great</em> rather than a call for all of us to work together to save the environment, which is what should really happen. Right?</p>
