    <p>I googled and found 2 great samples of Feijoa, a most beautiful serif by a most talented Kris Sowersby.</p>
    <p><strong>Samples</strong><br>
    1. <em>Write Times</em> (a literary collection of student writing from Scotland)</p>
    <p><a href="http://www.sqa.org.uk/sqa/24110.html" title="http://www.sqa.org.uk/sqa/24110.html">http://www.sqa.org.uk/sqa/24110.html</a> (the page the link is sitting on)</p>
    <p><a class="freelinking external" href="http://www.sqa.org.uk/files_ccc/Final_Write_Times.pdf" rel="nofollow">direct link to sample</a></p>
    <p>2. <em>Goodbye, Madame Butterfly</em> (a series of short stories)</p>
    <p><a href="http://goodbyemadamebutterfly.com/preface/" title="http://goodbyemadamebutterfly.com/preface/">http://goodbyemadamebutterfly.com/preface/</a> (the page the link is sitting on)</p>
    <p><a class="freelinking external" href="http://goodbyemadamebutterfly.com/mint/pepper/tillkruess/downloads/tracker.php?uri=http%3A//goodbyemadamebutterfly.com/downloads/gmb_preface_mannequin.pdf" rel="nofollow">direct link to sample</a></p>
    <p><a class="freelinking external" href="http://goodbyemadamebutterfly.com/purchase/" rel="nofollow">purchase the book</a></p>
    <p><strong>Where can you license Feijoa?</strong></p>
    <p><a href="http://vllg.com/KLIM/Feijoa/mudTyper+Weights/" title="http://vllg.com/KLIM/Feijoa/mudTyper+Weights/">http://vllg.com/KLIM/Feijoa/mudTyper+Weights/</a></p>
    <p>Make Feijoa a part of your personal collection.  I can't stop looking at it!  There, I said it.</p>
    <p>Enjoy!<br>
    Rahim</p>
