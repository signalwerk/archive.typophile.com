    <p>I bought <a class="freelinking external" href="http://en.wikipedia.org/wiki/Place_Vend%C3%B4me_(Swingle_Singers_with_MJQ_album)" rel="nofollow">this album</a> at a flea market yesterday and was struck by a typeface that appears near the bottom of the back cover, at around 12-ish point height. It's got some very distinctive features – classical proportions, somewhat extreme serifs on some letters (especially N), straight-leg, Trajan's-column-inspired R, unsual shapes to the G and S...</p>
    <p>Sorry about the image quality. Phone camera tends to distort and blur non-centred macro objects.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/DSC_0216_4114.jpg"></div><p></p>
    <p>Any clue?</p>
