  html: |-
    <p>I know "Space Escapade" is hand lettered. I love drawing stuff like that myself. But what about the sans? At first look I thought it was nothing special but then realised the S looks a bit warped. Is it a photolettering distortion? Could it be hand lettered? (From my own drawings of letters I know s can be awkward.) Is it just my eyes?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Les_Baxter_4794.jpg"></div><p></p>
