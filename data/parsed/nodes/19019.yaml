      <p>I have a good friend from Bern named Peter who apprenticed with Muller-Brockman. He always talked about the famous Swiss 3 x 4 grid.  The proportions of my T-shirt design are on a perfect 3 x 4 grid.  Being an anal retentive Swiss modernist (and a very good designer) my friend Peter could not violate "das grid" (to quote Hrant).  Therefore, I could not violate the grid either when I designed ths shirt :-) </p>
      <p>ChrisL</p>
    html_clean: |-
      <p>I have a good friend from Bern named Peter who apprenticed with Muller-Brockman. He always talked about the famous Swiss 3 x 4 grid.  The proportions of my T-shirt design are on a perfect 3 x 4 grid.  Being an anal retentive Swiss modernist (and a very good designer) my friend Peter could not violate "das grid" (to quote Hrant).  Therefore, I could not violate the grid either when I designed ths shirt :-) </p>
      <p>ChrisL</p>
