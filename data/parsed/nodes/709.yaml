    html: <p>It seems that, along with x-height, the cap height still plays a pretty big role in the visual size of a face, too. With lead type, we used to call that how big a face was "on the body." E.g., you could have 12 point type on a 14 point body. But it still has some effect digitally.  <br> <br>Looking at Bembo and Berthold Baskerville (not my favorite faces), Bembo's caps are 622 upms and Baskerville's are 706 - which seems a pretty big difference to me - while their x-heights are <i>relatively</i> equal (63% and 62% of the cap height, respectively).  <br> <br>It seems that this would have quite an effect on how large a face <i>looked</i> on the page. <br> <br>&gt;On the other hand, it does depend on the language...  <br> <br>This might be a bit off-topic, but one of the most interesting things I saw at TypeCon was Will Powers' presentation on book faces. Of the examples he showed, one was a bilingual (English and Dakota) book of stories. The English pages were set 10.5|13 and the Dakota was 10.65|13. I didn't get a chance to ask, but I'm assuming that's because Dakota uses fewer caps and extending letters, but has (many) more vowels. I never studied Dakota morphology specifically, but IIRC long- and short-vowels play a pretty big role in a lot of Native American languages.  <br> <br>Anyway, I just thought that was a really nice piece of type setting that did it's best to respect both languages, without creating a visually jarring spread.</p>
