  html: <p>Hi, <br>I'm sorry for this basic question, but... <br>what makes a 12pt font to be a 12pt font? Why a 12pt Helvetica is different from a 12pt Times? Is it due to the differences in the relationships among their respectives x-height/ascenders/descenders? <br>How can I make a 8pt font (for example, to be used as a bitmap for Flash)? Does it mean that the overall height (ascenders + descenders) should be 8pt? <br>Thanks, <br>Marcelo</p>
