    html: <p>As far as I know, 8 pixel fonts only show up as 8 <i>points</i> on a Macintosh monitor. On a PC monitor (VGA) they appear as 6 points, and on SVGA even smaller. To show up as 8 points, they need to be 11ppem for VGA and 13ppem for SVGA. <br> <br>I've not done much work with bitmap fonts, but if you want to make an 8 pixel font, your "pixels" should be 125upm square. 10 pixel fonts need 100upm "pixles," etc.</p>
    html_clean: <p>As far as I know, 8 pixel fonts only show up as 8 <i>points</i> on a Macintosh monitor. On a PC monitor (VGA) they appear as 6 points, and on SVGA even smaller. To show up as 8 points, they need to be 11ppem for VGA and 13ppem for SVGA. <br> <br>I've not done much work with bitmap fonts, but if you want to make an 8 pixel font, your "pixels" should be 125upm square. 10 pixel fonts need 100upm "pixles," etc.</p>
