    html: "<p>Yes, Dakota has a Latin orthography - I'm not sure how/when it came about. My presumption was, just from looking at the pages, that the size is due to both cap frequency (much less than English) and lack of extending lc. Here's a sentence from Powers' book: <br> <br>Mii dash ga-pi-izhi-giiweyaan, omaa dash indaa-ani-wiiji'izhinizhaawigoo owidi Mashkimodaang ezhinikaadeg, miinawaa go ji-gikinoo'amaagooyaan. <br> <br>I might try to dig through some of my notes from Amy Dahlstrom this weekend. Most of her work was with Fox, but it might be interesting anyway.</p>"
