  html: <p>I'm not sure what makes you think this is based upon another font.  Logo designs are not necessarily made by modifying fonts -- I am not a logo designer, but I feel pretty confident that this is a true statement. <br> <br>If you are trying to find a starting font to modify for a similar result, maybe <a href="http://www.myfonts.com/fonts/linotype/itc-souvenir/bold-italic/testdrive.html?s=Sunkist&amp;p=48" target="_blank">Souvenir Italic</a> in a heavy weight would be a bit similar. At least the 's' would be similar. Overlay the 'u' and 'n', remove the 'i'-dot, and at quick glance you might be fooled, if you weren't comparing them side-by-side.</p>
