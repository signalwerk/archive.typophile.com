      <p>Hand drawn, with a basis in Roundhand Script.</p>
      <p>This particular style—with a tail originating from the final letter that serves as an underline—is sometimes referred to as baseball script, and has been undergoing a resurgence lately.</p>
      <p>Some digital typefaces that mimic the look:<br>
