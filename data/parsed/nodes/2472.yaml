  - id: 19973
    user: 1290
    date: 2003-01-18T00:03:00
    date_raw: 18 Jan 2003 — 12:03am
    votes: null
    html: <p>Actually, I'd say the font fits your sample use quite well. Readable enough to elucidate the ideas of the text, but disruptive enough to slow the reader and encourage further thought. This will work great for pull-out quotes and other short settings. <br> <br>Your <b>a</b> is just right, toeing the line between roman and italic forms. While not entirely legible, it's easily readable and, to my mind, works well. <br> <br>I very much like how the <b>t</b> combines with the <b>h</b>, where the swash of the <b>t</b> seems to complete the stem of the <b>h</b>. <br> <br>Resist the urge to normalize this font by evening the baseline. The sample settings escape the feel of bars of text, enriching the sprawling organic feel of the character shapes.</p>
    html_clean: <p>Actually, I'd say the font fits your sample use quite well. Readable enough to elucidate the ideas of the text, but disruptive enough to slow the reader and encourage further thought. This will work great for pull-out quotes and other short settings. <br> <br>Your <b>a</b> is just right, toeing the line between roman and italic forms. While not entirely legible, it's easily readable and, to my mind, works well. <br> <br>I very much like how the <b>t</b> combines with the <b>h</b>, where the swash of the <b>t</b> seems to complete the stem of the <b>h</b>. <br> <br>Resist the urge to normalize this font by evening the baseline. The sample settings escape the feel of bars of text, enriching the sprawling organic feel of the character shapes.</p>
