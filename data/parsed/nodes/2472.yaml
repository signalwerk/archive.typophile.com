    html: "<p>Thanks for your comments, guys. <br> <br>Victor: Heh heh heh.... I'm not offended. I figured out long ago that my taste in type is very different than most others' here. You were probably saying bluntly what a lot of other people were thinking. <br> <br>But as Craig mentioned, Victor, there is an art to critique that generally involves backing up your comments -- both positive and negative -- by explaining your thought process. That is usually a lot more helpful to the critiqued individual. <br> <br>Thanks and have a great day.</p>"
