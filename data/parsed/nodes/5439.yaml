    html: "<p>FWIW, though it takes some repetitive button-pushing, I've managed to use the shareware Softy font editor to convert bitmap fonts to TrueType.  You can get it here: <a href=\"http://users.iclway.co.uk/l.emmett/\" target=\"_top\">http://users.iclway.co.uk/l.emmett/</a> <br> <br>To summarize: <br> <br></p><ul><li>Open up the bitmap font in Softy and use the Edit-&gt;Scale command to resize the font to somewhere around 100px wide (with the appropriate ratio for height, of course). </li><li>Then, in Softy's main window, select Use Bitmap Char from the Template menu. </li><li>Open up Softy's TrueType editor and use the Glyph-&gt;Outline Template command for each character to create a bare-bones TrueType font. </li><li>Then, once *that's* done, fiddle with the character mappings, either in Softy or in a program (such as High-Logic's Font Creator Program) that's better equipped with regards to character maps.</li></ul>Just a suggestion; there are no doubt more elegant ways of doing this, but I've created TrueType versions of several <a href=\"http://codeman38.cjb.net/font/\" target=\"_blank\">bitmap fonts</a> from video games and computer programs using this method... <br> <br>-- codeman38<p></p>"
    html_clean: "<p>FWIW, though it takes some repetitive button-pushing, I've managed to use the shareware Softy font editor to convert bitmap fonts to TrueType.  You can get it here: <a href=\"http://users.iclway.co.uk/l.emmett/\" target=\"_top\" class=\"link-external\">http://users.iclway.co.uk/l.emmett/</a> <br> <br>To summarize: <br> <br></p><ul><li>Open up the bitmap font in Softy and use the Edit-&gt;Scale command to resize the font to somewhere around 100px wide (with the appropriate ratio for height, of course). </li><li>Then, in Softy's main window, select Use Bitmap Char from the Template menu. </li><li>Open up Softy's TrueType editor and use the Glyph-&gt;Outline Template command for each character to create a bare-bones TrueType font. </li><li>Then, once *that's* done, fiddle with the character mappings, either in Softy or in a program (such as High-Logic's Font Creator Program) that's better equipped with regards to character maps.</li></ul>Just a suggestion; there are no doubt more elegant ways of doing this, but I've created TrueType versions of several <a href=\"http://codeman38.cjb.net/font/\" target=\"_blank\" class=\"link-external\">bitmap fonts</a> from video games and computer programs using this method... <br> <br>-- codeman38<p></p>"
