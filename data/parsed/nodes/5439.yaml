    html: "<p>I think the top character set is very classy - something difficult to do in bitmap. BTW, the conventional placement for the old-style numeral 4 is lower. <br> <br>Delivering bitmap fonts: <br>PostScript: On the Mac, just use an old-fashioned suitcase. On Windows, you can't. <br>TT: On the Mac I think you have to use a utility from Apple*. On Windows you have to use SBIT. <br> <br>* <a href=\"http://fonts.apple.com/Tools/index.html\" target=\"_top\">http://fonts.apple.com/Tools/index.html</a> <br> <br>BTW, if you can afford it, Pyrus's new BitFonter software is worth every penny: it really opens up a whole new world for bitmapfonting. <br> <br>http://www.pyrus.com/html/bitfonter.html <br> <br>hhp</p>"
