    html: "<p> Anders, your thoughts on old-style numerals are exactly the type of thing many more designers should be going through. Instead, most people are too afraid/lazy/dumb to challenge convention, and we're stuck with the non-sensical stuff we keep seeing. <br> <br>One could argue that keeping the old convention in numeral design is important because readers are already used to it. But really, do we expect readers to notice and even react adversely to something as subtle as making the \"2\" ascending, for example? On the contrary, I think the functional and aesthetic advantages of improved design could play positive roles in the reader's subconscious. <br> <br>Part of the problem is if/when you try to license your work to a font house, they enforce their own beliefs/needs on the design. This is understandable, and much can be learned from the experience of font houses, but to me it's one more reason to go completely independent. <br> <br>Conventional numerals suffer from two main things: <br> <br>1. The distribution of contrast (stroke thickness) is erratic and inconsistent. Gill tried to address this, but I for one don't like the results. In November I will post my own efforts to this list, and see what you guys think. <br> <br>2. The \"extenderness\" of some numerals does not seem to be based on solid reasoning, at least not solid in this day and age. As you allude to, the numerals are too descending overall. <br> <br>In the case of #1, I think more people should be trying to either: make the emphasis of *all* the numerals horizontal; or (preferably) align the emphasis of all the numerals to the vertical of the alphabetic glyphs. <br> <br>In the case of #2, I personally think the \"3\" and \"5\" work much better when sitting on the baseline*, and the \"2\" should ascend as well. As for the zero, I'm undecided.  :-/ <br> <br>* Note that some old French foundries used to so this. <br> <br>Also, the conventional numeral \"4\" is a disaster. <br> <br>BTW, concerning your statement that \"this is not a completely new invention\": Maybe your efforts are not an \"invention\" (very very few things really are), but the mental path you're taking is significant because it's both important and disregarded. <br> <br>hhp </p>"
    html_clean: "<p> Anders, your thoughts on old-style numerals are exactly the type of thing many more designers should be going through. Instead, most people are too afraid/lazy/dumb to challenge convention, and we're stuck with the non-sensical stuff we keep seeing. <br> <br>One could argue that keeping the old convention in numeral design is important because readers are already used to it. But really, do we expect readers to notice and even react adversely to something as subtle as making the \"2\" ascending, for example? On the contrary, I think the functional and aesthetic advantages of improved design could play positive roles in the reader's subconscious. <br> <br>Part of the problem is if/when you try to license your work to a font house, they enforce their own beliefs/needs on the design. This is understandable, and much can be learned from the experience of font houses, but to me it's one more reason to go completely independent. <br> <br>Conventional numerals suffer from two main things: <br> <br>1. The distribution of contrast (stroke thickness) is erratic and inconsistent. Gill tried to address this, but I for one don't like the results. In November I will post my own efforts to this list, and see what you guys think. <br> <br>2. The \"extenderness\" of some numerals does not seem to be based on solid reasoning, at least not solid in this day and age. As you allude to, the numerals are too descending overall. <br> <br>In the case of #1, I think more people should be trying to either: make the emphasis of *all* the numerals horizontal; or (preferably) align the emphasis of all the numerals to the vertical of the alphabetic glyphs. <br> <br>In the case of #2, I personally think the \"3\" and \"5\" work much better when sitting on the baseline*, and the \"2\" should ascend as well. As for the zero, I'm undecided.  :-/ <br> <br>* Note that some old French foundries used to so this. <br> <br>Also, the conventional numeral \"4\" is a disaster. <br> <br>BTW, concerning your statement that \"this is not a completely new invention\": Maybe your efforts are not an \"invention\" (very very few things really are), but the mental path you're taking is significant because it's both important and disregarded. <br> <br>hhp </p>"
