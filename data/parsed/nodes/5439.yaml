    html: <p> Lovely font -- especially in the text samples. The increased letterspacing is a major improvement. <br> <br>I especially like the numerals, and I personally don't see any problems with the "5" reading as "s"; it's main stem is bold enough, I think, to prevent much confusion, especially in context. <br> <br>However, is the condensed middle-size "7" supposed to be ascending, and if so, is it a bit too tall? In any case, I think I prefer it descending. <br> <br>I also like your treatment of the tails on the bold versions of uc "K" and "R", as well as the form of the uc "Y" and the descending tails of uc "J" and "Q". <br> <br>And those lc "r"s are really attractive! Nice work. <br> <br>David Thometz </p>
