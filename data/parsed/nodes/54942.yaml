      <p><em>"Having the top closed, and then making the “stroke” continue into the bottom is just noise; it makes the glyph alien"</em></p>
      <p>Alien? To what? To the structure of the Latin alphabet?<br>
      I'm assuming you're not using the word as opposed to familiarity. I'm not subscribing to Emigre's maxim either (you know I like Patria). But while the closed loop is indeed not "pulling [the ampersand] away from anything else", does it not matter at all that it's probably closest (I'm surmising), for the reader, to some abstract notion of "what an ampersand looks like" – and I'd think, a bit more crucially so than the issue of the "g"'s tail being closed or not?* So this open ampersand needs to overcome a (small) initial threshold of "newness" for the reader, no?</p>
      <p>* I agree that the design of type should be largely independent from ideas (ideals) of strokes and writing. But I'm not quite convinced that people (as in, normal end-users/readers) don't think of lettershapes, even when they're printed, in terms of "how they'd write it" – which would make a difference as to how they will perceive a non-chirographic shape. And in the open ampersand, you actually break the stroke ("the thing they may think of as a stroke") in half. Whereas in the "g" you basically only change the ending, which is less brutal to a chirographic "reading" of type, and therefore maybe less noticeable?</p>
      <p>Though of course the ampersand is probably the prime example of a glyph that's open to interpretation. And I'm not arguing against this open form, for the record. I see your points, and I actually quite like the shape. I'm just trying to see the pros and cons (in terms of functionality; of course there's always aesthetic considerations).<br>
      FWIW, that ampersand from Script MT does seem to get pretty close to the limits of being identifiable as what it is, at least for me.</p>
