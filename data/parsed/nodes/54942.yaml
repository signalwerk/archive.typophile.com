      <p>I'm a member of the Open Tailed Lower Case g Society as well. The secret handshake involves grasping the hands but never closing them. But I've said too much already.</p>
      <p>My experience with opening the tail on a g usually ended with narrowing the lower bowl a bit and/or slightly expanding the upper bowl (less often). Otherwise, the g can look like it's unraveling at large size and under 12 point can look too light. </p>
      <p>What seems like (and is) an intriguing treatment requires whole new tricks to achieve balance and even coloring with the other letters. But it can certainly be worth it and I like the direction you're heading.</p>
