      <p><em>I’m finding the tail serif of the g is angled too tightly into the curve and could perhaps follow a shape more like the tail serif on s. Does anyone else think that?</em></p>
      <p>That would be more daring, certainly. As angled now (and especially as tightened closer with the most recent edits), that serif approximates an unseriffed, barely-open loop (like Baskerville's 'g'), which "normalizes" the open structure. An 's'-like serif will be truer to the rest of the font but I suspect might make the 'g' stand out too much. But I think it's worth a try.</p>
      <p>(How many 'g's can we get Marcelo to draw!? :-)</p>
