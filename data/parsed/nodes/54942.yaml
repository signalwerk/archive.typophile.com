      <p>The ampersand's case is pretty close to that of the "g" actually. Having the top closed, and then making the "stroke" continue into the bottom is just noise; it makes the glyph alien (without the benefit of pulling it away from anything else). That structure comes from ease of writing, which is pointless in type. Having a beak on top is more salient, and allows the top counter to participate more. In fact, I have previously tried getting rid of the arm coming up from the bottom as well! There is one font that does this*, and quite well, but I haven't managed to do it properly myself yet.</p>
      <p>* <a href="http://new.myfonts.com/fonts/agfa/script-mt/" title="http://new.myfonts.com/fonts/agfa/script-mt/">http://new.myfonts.com/fonts/agfa/script-mt/</a></p>
      <p>All that said, this does not mean that every font must have an open-top ampersand - because functionality is only one factor (although perhaps the primary one, in my book). Patria for example has features that intentionally lower its readability, but contribute to its atmosphere.</p>
      <p>hhp</p>
