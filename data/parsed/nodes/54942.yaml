    html: |-
      <p>&gt; I left the “g” as it was</p>
      <p>Newspapers often use zero leading, so you should avoid leaving one extender (especially such a wide one) hanging lower than the rest. But I just measured it and it's not as low as it appears* - it's <em>almost</em> there with the rest. If you decide to shorten it I would make the diagonal less steep, the lower bowl flatter, and the tail serif shorter. If you do all three each will only have to change a smidgen.</p>
      <p>* Because it's so wide.</p>
      <p>This is where my favorite paradox kicks in: in a text font, especially one for very small sizes, the "g" <em>must</em> feel a little cramped, otherwise the balance of compromises isn't ideal. Ugliness isn't something to shun, it's something to assimilate.</p>
      <p>hhp</p>
