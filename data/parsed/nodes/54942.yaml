      <p>My open loop g evolved to that:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Picture_1_4789.png"></div><br>
      The ear is now bolder and points up.<br>
      There are subtle optical corrections in the outline of the bowl.<br>
      Even when the link is shorter, it keeps the original starting angle.<br>
      The tail has been softened and its spine leans to the right enough to avoid the previous left tilting of the figure.<br>
      The serif is larger (the same size of the s's one), but doesn't sacrifice the air needed to make the loop looks open at small sizes.<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture_2_6037.png"></div><br>
