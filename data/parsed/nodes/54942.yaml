    <p></p><div class="imageWrap"><img src="http://typophile.com/files/my_g_4803.png"></div><p></p>
    <p>Hi, TPh's! This is a glyph I've been working for a while and need some help in deciding which trend to follow, if there's one:<br>
    ---excuse me by relating the image---</p>
    <ul>
    <li>#1 is the most 'normal', being the loop dominates the width</li>
    <li>#2 is a variation I like: the link is wider than the loop (which is narrower) by its left side</li>
    <li>#3 is similar to #1, except for the inflection in the link</li>
    <li>#4 –quirky– is similar to #2 (narrower loop), but the sharp link</li>
    </ul>
    <p>Forgive the noticeable imbalances: it is the shape as a whole what I'm trying to choose among these.<br>
    I guess the upper counter and the ear work fine for a text font, even though I need to refine the contrasts and the overweight in junctions, but there'll be time to.<br>
    <a class="freelinking external" href="http://typophile.com/files/my_g.pdf" rel="nofollow">Here I post a PDF</a> for better inspection.</p>
    <p><strong>MarS</strong></p>
