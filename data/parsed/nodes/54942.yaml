      <p>I think you went too far left.<br>
      But to be sure we need "ngn" and "ogo" for starters.*<br>
      Then after control strings I use adjacency frequency:<br>
      <a href="http://www.themicrofoundry.com/other/kf_adj.pdf" title="http://www.themicrofoundry.com/other/kf_adj.pdf">http://www.themicrofoundry.com/other/kf_adj.pdf</a><br>
      So for the "g" I would first look at "n" on the left and "e" &amp; "h" on the right, then "a" &amp; "i" on the left and "g", "o" &amp; "r" on the right, etc.</p>
      <p>* Assuming of course that "n" and "o" are properly spaced.</p>
      <p>About that PDF:<br>
      1) I apologize that it's so ugly.<br>
      2) That email address no longer works.</p>
      <p>(BTW, not "extrema" but "extremum", sorry.)</p>
      <p>hhp</p>
