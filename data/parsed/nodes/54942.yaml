      <p>Hrant :-) Thanks! That was a highly interesting elaboration.</p>
      <p>I was probably stuck in the skeleton model to some degree as far as character recognition goes (that "abstract notion" of what a given character "looks like"). But you make some excellent points! The model of a "dictionary" of somewhat fuzzy shapes that a (more often than not, also "blurry") glyph is matched up against, does seem a lot more plausible than anything involving abstract skeletons.</p>
      <p>But, what is in the dictionary? Isn't that where the factor of familiarity comes in?<br>
      I realize this might be splitting hairs, but with not a huge lot of open-topped ampersands around, I'd assume the reader might still have a tiny little threshold initially to "amend the dictionary", so to speak? (Though the ampersand is probably a bad example, since that particular dictionary entry is atypically broad and fuzzy anyway.)</p>
      <p>Hope Marcelo doesn't mind this lil' tangent.</p>
