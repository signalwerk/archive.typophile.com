      <p>I must say however that people's familiarity with much of my stance in type design (thanks to mondo keystrokes on my part) allows me to conduct fewer repetitive attacks these days. For example I'm not really a big fan of this font of Marcelo's (it's too chirographic) but I think that other people will like it a lot, and I just want to help him arrive at a good terminus. There is no perfect font anyway - if I can help him make the "g" better for example, I feel good. And I think that is one reflection of Design versus Art. Here's another example of what I mean: <a href="/node/54841/" title="http://typophile.com/node/54841" class="link-kept">http://typophile.com/node/54841</a>  Note Ben's reaction to my first post.</p>
