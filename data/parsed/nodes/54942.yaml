      <p>Those 'dua' improvements are good, I think.</p>
      <p>On the caps, I suspect a challenge with such bold serifs will be to get them to work on the thin strokes without overwhelming them. AKMNUVWXY (Actually, the diagonal thins make it easier, as they flow into one side of the serif, so the real challenges are MNU.) Maybe cupping the serifs more will help here and will also "soften the strong hardness of the strokes," though perhaps that would lose too much of the sharpness you want to retain.</p>
