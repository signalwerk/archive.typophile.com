      <p><em>"I don’t know if this is intentional, but the Q (and the O too) is leaning to the left. :P"</em></p>
      <p><strong>Jelmar</strong>, actually, the counter in curvy shapes is intentionally rotated 3 degrees to the left, to keep some calligraphic taste and to avoid "hyperelliptization".<br>
      Though it's more noticeable in the O and Q, you can find the axis is also slanted in the C, D, G, b, c, d, e, g, o, p, q, for example.<br>
      Usually Humanist (<a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/creative_alliance/adobe_jenson_pro_ot_virtual/" rel="nofollow">Jenson Pro</a> by Adobe) and Garalde (<a class="freelinking external" href="http://www.fontshop.com/fonts/singles/monotype/caslon_titling_regular/" rel="nofollow">Caslon Titling</a> by Monotype) faces share this feature; I somehow prefer the criterion adopted in Jenson, while Caslon has the counters rotated inversely, that is, 3° to the right.</p>
      <p><strong>MarS</strong></p>
