      <p>Nina, you're reminding me of me!</p>
      <p>&gt; does it not matter at all that it’s probably closest (I’m surmising),<br>
      &gt; for the reader, to some abstract notion of “what an ampersand looks like”</p>
      <p>I think two things tugging at a glyph are: belonging in a visual dictionary; and being decipherable. And while the former seems pretty literal/formal, the latter is pretty nebulous (meaning that deciphering a glyph involves recognizing enough hazy bits). So maybe something like that ampersand structure that I favor "belongs" very well while still exhibiting all the necessary hazy bits. But honestly I'm not pretending this is a highly robust argument with solid evidence; my stance derives in a large part from instinct: the closed binocular "g" and the old-fashioned ampersand simply seem pointlessly complex, alien.</p>
      <p>&gt; I’m not quite convinced that people (as in, normal end-users/readers)<br>
      &gt; don’t think of lettershapes, even when they’re printed, in terms of<br>
      &gt; “how they’d write it”</p>
      <p>I honestly have to think that during immersive reading there's absolutely no room for a reader to consider the ease of writing of individual glyphs. Our reading system cannot be bothered by such irrelevances - it is like a hungry wild animal.</p>
      <p>And really, who ever writes like any font anyway! We don't reproduce serifs, stroke contrast, etc. Could we really be extracting and evaluating numerous "skeletons" in a fraction of a second at 10 point? Nevermind that 2/3-rds of the field of vision is in the blurry parafovea.</p>
      <p>hhp</p>
