      <p>As you say, 1 and 3 are good, normal forms. I like 2 as well, but wonder how it will fit with the rest of the glyphs. I also wonder if you could lengthen the descender a bit as well, at least for display settings. 1 &amp; 2 together might give some interest for words with two gg's (eggs, for example). </p>
      <p>4 is odd, but not unserviceable. What would it look like if the like joined the bowl a tad bit higher? (The angle of the straight edge of the sharp link catches my eye.) Or perhaps drop the right part of the loop a bit to balance.</p>
