    html: |-
      <p>Ah, the hardest [Latin] glyph!</p>
      <p>The thing about the "g" is, I feel there's a large gulf between what the reader needs and what other type designers expect. There are very few binocular "g"s that I personally like, and there's a lot of room for improvement on the conventional forms.</p>
      <p>Specifically:<br>
      - The closed bottom makes the form too complex - almost Chinese. It does not belong in the Latin alphabet (even though we're consciously used it to by now). I'm a big fan of the open bottom - although it's much harder to pull off. Even Baskerville's is non-ideal - too apologetic.<br>
      - The thick top of the bottom bowl should not be very horizontal, and -assuming your font has stroke contrast- should get thicker on the right. To me the conventional flat, evenly-thick stroke is a disaster*. HOWEVER, you probably cannot make the bottom of "g" entirely like [most of] the rest of the alphabet; it's better to emulate the "s". Thanks in part to Roy Preston's designer's intuition many years ago, I personally arrived at this:</p>
      <p>* Unless maybe you have a "z" with thick horizontals.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/g_6558.gif"></div><p></p>
      <p>hhp</p>
