      <p>Perhaps you've got every reason on earth, Nina, but unfortunately:</p>
      <ol>
      <li>I'm not sure about what criteria one must follow to build such a comprehensive database:
      <ol>
      <li>Processing all words of a given language (let's say, at least 30 K to 60 K words), though... what about punctuation and other characters?</li>
      <li>Processing large amounts of relevant text written in a given language (countless books) as is, though... what is relevant at all?</li>
      <li>Processing thes large amounts of relevant text written in a given language, and its capitalized version.</li>
      </ol>
      </li>
      <li>Solved the first question, how many pairs one must consider relevant for kerning? (I assume over 600 pairs become unmanageable for both, the designer and the font spacing processor).</li>
      <li>How can one discard without pain those pairs that don't need individual kerning, i.e.: "no", "on", "nn", "oo", etc.</li>
      </ol>
      <p><a class="freelinking external" href="http://www.bycsrl.com.ar/gallery/lfm.php" rel="nofollow">My modest unfinished engine</a> is just a try in the sense of finding frequent occurrences of letter pairs ("no") and neighbors ("non") by mining in the web.</p>
      <p>When finished, it will automatically search among pages written in a given language, and then will process them in order to create an evolving (evolutive?) database of recurring associated letters, so as, for the end user, the interface will only show a sortable list of instances to research on, something like it displays once you process the entered text in the alpha version.</p>
      <p><strong>MarS</strong></p>
