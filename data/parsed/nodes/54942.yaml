      <p>0 - quite narrow! Maybe it just results from rotating ellipses, but that high extremum on the right outer side bothers me.<br>
      2 - consider ways of closing up the top counter or opening up the bottom one. Something about the relative weights of the top (near the serif) and the diagonal seems a little off, too - could you establish the weight you need with just the serif and let the stroke thin a little more?<br>
      3 - at the top, see 2<br>
      4 - some nice little details here!<br>
      5 - curved stroke gets too fat at the top, or gets fat too fast. (compare thickness to the six right next door)<br>
      6 - seems to me too sudden of a break between a gentler full-height curve on the left (like parenthesis) and the quicker x-height curve on the right (like 'o'). as a result there's an awkward bend at the lower left<br>
      7 - falling right but that may be okay<br>
      8 - curves are nicely drawn<br>
      9 - see 6</p>
      <p>You may want to make the counters of your 5 more even (lower the middle part) and/or make the counters of your 8 less even (raise the middle part).</p>
