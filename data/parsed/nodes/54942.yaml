      <p>&gt; When everybody pretty much burned Muzzer at the stake, like so often<br>
      &gt; happens on Typophile if someone is even slightly harsh in their language</p>
      <p>?<br>
      Maybe things have been softer lately, but I've been a member since the beginning and I can assure you that is not accurate in toto. I happen to know not least because I've done a very big chunk of the attacking myself. I've even attacked entire design schools, accusing them of superficiality. In fact I did so once pretty recently. But I don't expect others to behave like me.</p>
      <p>I must say however that people's familiarity with much of my stance in type design (thanks to mondo keystrokes on my part) allows me to conduct fewer repetitive attacks these days. For example I'm not really a big fan of this font of Marcelo's (it's too chirographic) but I think that other people will like it a lot, and I just want to help him arrive at a good terminus. There is no perfect font anyway - if I can help him make the "g" better for example, I feel good. And I think that is one reflection of Design versus Art. Here's another example of what I mean: <a href="http://typophile.com/node/54841" title="http://typophile.com/node/54841">http://typophile.com/node/54841</a>  Note Ben's reaction to my first post.</p>
      <p>&gt; I do not think it was an attack.</p>
      <p>I don't know about anybody else, but saying that I don't make fonts was (and was in no way constructive - it was just defamation). However you will note that I did not strike back, I only defended myself. Not because I don't believe in fights, but because I need a much better reason to muster that energy. Sorry Muzz.</p>
      <p>--</p>
      <p>I'm curious, are there other creative fora where people are regularly harsh, while still providing useful feedback (as opposed to simply venting)?</p>
