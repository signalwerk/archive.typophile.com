      <p>IIRC since I made that table (by hand :-) there have been a couple of online tools that let you dump text into them, and they spew out all kinds of stats.</p>
      <p>BTW, this might sound far-fetched, but lacking language-specific data, using data from a similar language is better than nothing. For example English and Spanish are more similar than different; and Spanish &amp; Portuguese are brothers. Although of course if you have language-specific data (and you're reasonably sure the font will mostly be used for one language) that's much better.</p>
      <p>hhp</p>
