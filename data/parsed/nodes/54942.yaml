      <p><strong>Ben, Hrant,  Merkri:</strong><br>
      I'm working hard in that open loop you like. Initially I was not much enthusiastic, but I need to tell that Hrant triggered my never-answered ancient doubts (concerns) about the causes of current <em>"too complex - almost Chinese"</em> shape of lc closed loop g.<br>
       I can easily assume the transition from the UC to the open lc –it is very appropriate considering lc were tied to manuscript writing–, but when I had to face production, and the original design was a 'traditional' closed loop g, I felt a big confusion: the unnatural changes in the thicknes of strokes, and even the disruption between the top and the bottom ones, made me think there was some kind of undecipherable secret formula. I don't know why I gave in and went along with the crowd.<br>
      Finally, I believe my g will be open tail.</p>
      <p><strong>Craig, Merkri and Steve:</strong><br>
      Here it goes a "flogger" (by the moment I cannot write <em>hamburgefons</em> and anyway it doesn't match my purposes) new sample of the quasi-ligature g_g, where one can realize that the first uneven solution is much better than the second (duplicated g) one. I guess it will be a good –and funny– step for futher investigation.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ligatures_4001.png"></div><p></p>
      <p>Cheers,<br>
      <strong>MarS</strong></p>
    html_clean: |-
