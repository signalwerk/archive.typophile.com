    html: |-
      <p><em>"I’m somewhat ignorant about the fact that it is normal for Geralde typefaces"</em></p>
      <p>Well, as said, it is not only common in Garalde letterforms, but also in modern serif fonts (i.e.: <a class="freelinking external" href="http://www.typotheque.com/site/font_tester.php?family_id_0=23&amp;id_0=249&amp;size_0=72" rel="nofollow">Greta</a> or <a class="freelinking external" href="http://new.myfonts.com/fonts/fontfont/reminga/" rel="nofollow">Reminga</a>), especially for text (printing) sizes –6 to 12 points– at regular weights, being it won't work well in screens because of aliasing (hinting for display is quite harder). The aim is to resemble some calligraphic gestures –by the other side, usual in wood or metal types– to escape from visual monotony and annoying grays in large blocks of text, beyond keeping alive the soul of writing in production.<br>
      Naturally, the O and the Q, being both are almost absolute shapes in terms of symmetry, make it more apparent. When working in context, and if well spaced, letters become sinergically balanced and rhythmic.</p>
      <p><strong>MarS</strong></p>
