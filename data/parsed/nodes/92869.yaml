    <p>Hi people,</p>
    <p>I'm working on a project that will require me to replicate the fonts used in the above supermarket logos. I've tried, and failed to locate any suitable matches. I'm told that they are probably proprietary fonts based off of modified versions of existing fonts. Even having a closely matched font would be extremely useful.</p>
    <p>I can't divulge too much about the project, tho I can say that it will be a comedy website with more than a little tongue in cheek humor aimed at these retailers. I'm telling you this in the hopes that former employees of the companies may come forward with enthusiasm!</p>
    <p><a href="http://www.udsu.co.uk/files/minisites/54703/asda.png" title="http://www.udsu.co.uk/files/minisites/54703/asda.png">http://www.udsu.co.uk/files/minisites/54703/asda.png</a><br>
