      <p>You may like the following substitutes:</p>
      <p>"ASDA": <strong>[[http://www.parachute.gr/fonts.aspx?Sample=1&amp;FontStyleID=&amp;FontFamilyID=22&amp;CharacterSetID=42|PF Highway Sans Pro Black]]</strong></p>
      <p>"TESCO": <strong>[[http://www.findmyfont.com/index.php/fonts/font-preview?fset=Elsner%2BFlake&amp;ffam=NewtextEF%20Demi%20-%20Regular&amp;fid=d7c646f4221e1c6b092a01513515a50a&amp;fstyle=b&amp;fsize=60&amp;text=TESCO&amp;fit=1|NewtextEF Demi]]</strong></p>
      <p>"Sainsbury's": <strong>[[http://www.dutchtypelibrary.nl/Argo_rdrct.html|DTL Argo ST (Medium)]]</strong></p>
      <p>"MORRISONS": <strong>[[http://www.findmyfont.com/index.php/fonts/font-preview?fset=Linotype&amp;ffam=Siseriff%20LT%20Std%20-%20Regular&amp;fid=a06a02495c63da94321ab321ef14e0e3&amp;fstyle=b&amp;fsize=60&amp;text=MORRISONS&amp;fit=1|Siseriff LT Std]]</strong></p>
      <p>None of them is an exact match, therefore some Photoshop treatment is required to make them look closer to your originals.</p>
      <p>Good luck with your comedy website :)</p>
      <p>PS: Why all Super Market logos are created with so bold and "fat" letters? ;)<br>
      Is this a subconscious message like "consume more" - "have plenty of food" - "be fat too"?</p>
