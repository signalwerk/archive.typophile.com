      <p>Hi, sorry for the late reply. I just wanted to thank you. Your suggestions are pretty much perfect. I'm happy to use slightly different fonts as it helps me distance myself legally from any backlash! </p>
      <p>I think you're onto something with the trend in chunky lettering! Retail is full of subliminal messages and subtle manipulation!</p>
      <p>Thanks again</p>
