      <p>You may like the following substitutes:</p>
      <p>"ASDA": <strong><a href="http://PF Highway Sans Pro Black" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://PF Highway Sans Pro Black</a></strong></p>
      <p>"TESCO": <strong><a href="http://NewtextEF Demi" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://NewtextEF Demi</a></strong></p>
      <p>"Sainsbury's": <strong><a href="http://www.dutchtypelibrary.nl/Argo_rdrct.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">DTL Argo ST (Medium)</a></strong></p>
      <p>"MORRISONS": <strong><a href="http://Siseriff LT Std" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Siseriff LT Std</a></strong></p>
      <p>None of them is an exact match, therefore some Photoshop treatment is required to make them look closer to your originals.</p>
      <p>Good luck with your comedy website :)</p>
      <p>PS: Why all Super Market logos are created with so bold and "fat" letters? ;)<br>
      Is this a subconscious message like "consume more" - "have plenty of food" - "be fat too"?</p>
