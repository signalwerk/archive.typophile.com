      <p>I am aching to see the top left swash on the H join the crossbar, or at least the appearance that it could make a smooth join if one doodled on it, I would also like to see the swoosh make a more dramatic downward sweep. I would also try aligning the loop of the “l” with the upward stroke of the 1st “i” and moving the dots of the “i’s” to make the spaces either side of the “l” appear equal. A joining spur on the first stroke of the “u” might help, as might making it slightly wider.<br>
      Very cheerful looking logo.<br>
      Tim</p>
