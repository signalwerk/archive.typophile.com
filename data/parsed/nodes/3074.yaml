    html: <p>Hrant, <br> <br>For me, easy to use type means that no matter what size, leading, letterspacing, etc. the setting just "feels" right. It looks professional, it looks appropriate. <br> <br>For me, Helvetica is a typeface I just don't have the hang of yet. I use it very infrequently, but for some reason, it just never turns out right. Either I set it too large, or space it out too much, or too little. There's a middle ground that I can't seem to hit. There's a few other typefaces like that for me as well. <br> <br>However, Futura seems to just set perfect, with little tweaking. When I set 18 point heads with 9 point subs, it looks right. When I letterspace it for effect, it looks right. Meta is the same way. I don't think it's so much the kerning tables, but the character shapes. The challenge with Helvetica is getting over the lack of continuity between letterforms. <br> <br>I'm sure I could ramble on and on about this.</p>
