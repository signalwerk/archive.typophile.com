  html: <p>I'm a student at Art Center College of Design. I would really like to get feedback from those currently practicing in the professional world. Obviously each individual project dictates the font choices that need to be made. I am looking for your opinion on a good base of fonts to use and understand. <br> <br>I realize there is no clear answer, but would appreciate any feedback you might give. Thank You. </p>
