    html: "<p>Nikolai - First off, great question. many new designers interested in Typography (eg. myself 7 odd years ago) thinks the more fonts you have the more choice you have. <br> <br>Not really - the more fonts you have the longer it takes to evaluate the possibilities for each project and the more wrong fonts you need to wade through before finding something suitable. In the commercial world time is morning and therefore you are actually restricting the chances you will find a great font inside the deadline! <br> <br>That being said I would start with a couple of good quality fonts and really know the font inside out before buying more.  <br> <br>Know what the designer intended, know if the target audience is (over)used to the font, what attitude it conveys subliminally. How dark it makes the page, whether it suits looser or tighter leading and what point size is most suitable for different lengths of copy.  <br> <br>Also know how the family fits together. How much emphasis does a bold give to the roman, maybe the black weight will work better, or maybe the italic is different enough for emphasis. <br> <br>A tiny selection of my workhorse fonts are: <br>Sans - Frutiger, DIN, Avant Garde <br>Serif - Minion Pro, Adobe Garamond Pro <br>Script - Voluta Script, Pilsner (Letterhead Fonts) <br> <br>PS - If you use InDesign for page layout always try and use OpenType fonts (good quality) and use the extras like ligatures and the correct type of numerals for the task at hand.</p>"
    html_clean: "<p>Nikolai - First off, great question. many new designers interested in Typography (eg. myself 7 odd years ago) thinks the more fonts you have the more choice you have. <br> <br>Not really - the more fonts you have the longer it takes to evaluate the possibilities for each project and the more wrong fonts you need to wade through before finding something suitable. In the commercial world time is morning and therefore you are actually restricting the chances you will find a great font inside the deadline! <br> <br>That being said I would start with a couple of good quality fonts and really know the font inside out before buying more.  <br> <br>Know what the designer intended, know if the target audience is (over)used to the font, what attitude it conveys subliminally. How dark it makes the page, whether it suits looser or tighter leading and what point size is most suitable for different lengths of copy.  <br> <br>Also know how the family fits together. How much emphasis does a bold give to the roman, maybe the black weight will work better, or maybe the italic is different enough for emphasis. <br> <br>A tiny selection of my workhorse fonts are: <br>Sans - Frutiger, DIN, Avant Garde <br>Serif - Minion Pro, Adobe Garamond Pro <br>Script - Voluta Script, Pilsner (Letterhead Fonts) <br> <br>PS - If you use InDesign for page layout always try and use OpenType fonts (good quality) and use the extras like ligatures and the correct type of numerals for the task at hand.</p>"
