    html: <p>Well, since you said "know how to use" not "own," I'd include the following (not a complete list) <br> <br><b>Gill Sans</b> <br>It's <i>everywhere</i>. I swear, I'm sick of using it, no matter how nice it is. <br> <br><b>Helvetica or Helvetica Neue</b> (complete family) <br>This includes the extended and condensed weights. Another one that you can't avoid. <br> <br><b>Adobe Garamond</b> (Pro, if possible) <br>I quite like it, and it's common. It presents interesting challenges at smaller sizes, due to its more fragile features, and small x-height. <br> <br><b>FF Meta</b> <br>The ubiquitous Humanist sans. High legibility, 'the next Helvetica' for a while. Unavoidable. <br> <br><b>Futura</b> (not sure which is best) <br>Classic geometric sans. Very common. <br> <br><b>Adobe Minion Family</b> (Pro if possible) <br>Solid, a workhorse of book typography. See Bringhurst's <i>Elements of Typographic Style</i>. Very comprehensive family. <br> <br><b>Bodoni</b> (again, not sure which version, maybe not Bauer as it's got very hight contrasts) <br>The archetypical Neo Classical font. Haven't seen it around as much lately (at least in my line of work), but I think it's a must. <br> <br><b>Frutiger</b> and <b>Univers Families</b> <br>Adrian Frutiger's classic sans fonts. More personality than Helvetica, less than Meta (IMO). In short, Frutiger is friendly and Univers is serious. Another pair you can't avoid. <br> <br>A <b>Gothic (Bell, Trade, Franklin)</b> <br>I saw a lot of these when I was in school. They seem to be waning again, but familiarity with them is important. <br> <br>These stick out in my mind as "need to know". There are so many others that I see a lot, like Mrs. Eaves. These are all very good to know, but aren't on my top-tier list of ones you need to know how to work with. Again, this is a partial list.</p>
