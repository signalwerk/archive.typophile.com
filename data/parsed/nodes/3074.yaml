    html: "<p>I would try to go for one or two fonts from each stylistic /time period category. This way you can cover most of the different options there are for just about any situation.  <br> <br>Blackletter: Fraktur (Fette Fraktur), Textura (Goudy Text) <br>Serif: Venetian (Jenson), Transitional (Baskerville), Modern (Bodoni), Postmodern (Eidetic) <br>Script: a brush script, formal script, and handwriting <br>Sans: Grotesque (FB Grotesque), Humanist (Gill), Institutional/technical (Helvetica, Eurostyle) <br>Display: Postmodern/Classic (Mason), Vernacular signage (Los Feliz) <br>Calligraphic: Uncial (American Uncial) etc. etc. <br> <br>This is obviously a small list, but you get the general idea, I hope. <br></p>"
    html_clean: "<p>I would try to go for one or two fonts from each stylistic /time period category. This way you can cover most of the different options there are for just about any situation.  <br> <br>Blackletter: Fraktur (Fette Fraktur), Textura (Goudy Text) <br>Serif: Venetian (Jenson), Transitional (Baskerville), Modern (Bodoni), Postmodern (Eidetic) <br>Script: a brush script, formal script, and handwriting <br>Sans: Grotesque (FB Grotesque), Humanist (Gill), Institutional/technical (Helvetica, Eurostyle) <br>Display: Postmodern/Classic (Mason), Vernacular signage (Los Feliz) <br>Calligraphic: Uncial (American Uncial) etc. etc. <br> <br>This is obviously a small list, but you get the general idea, I hope. <br></p>"
