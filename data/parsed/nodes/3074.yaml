    html: "<p>Filosofia is getting around these days... <br> <br>Bodoni is fun to play around with. <br> <br>Univers I find great. <br> <br>TheSans I'm getting into. <br> <br>Sabon is amazing. <br> <br>Kottke's silkscreen. Free and good. <br> <br>Hrant's Mana is some neat stuff, and demonstrates amazing foresight. <br> <br>Anything made out of real wood. (no fake wood!) <br> <br>Georgia is fantastic on screen and even in print. <br> <br>Lucida Grande is my on-screen sans serif choice. <br> <br>New Century Schoolbook is one of my all-time favorites. <br> <br>Futura I think is extremely hard to get right. If done well, it's fantastic. <br> <br>Janson Text is solid. <br> <br>Some form of Garamond. Preferably a good version. I can't remember what's good. Berthold, maybe? <br> <br>Galliard is pretty great. <br> <br> <br>Faces I'm not so thrilled with: <br> <br>Mason. Nah. Reminds me of Queensryche and only Queensryche. <br> <br>Anything Spiekermann. Sorry. They look corny. FF Unit as a small text face isn't too bad, but anybody who titles his book stupidly just to include and \"fi\" ligature rubs me the wrong way. \"Find out\"?? How about \"learn\"? (Stop Stealing Sheep and find out How Type Works) The title just doesn't work. <br> <br>Frutiger is sterile. <br> <br>Arial. Some Chicago Transit signs are in Helvetica. Some are in Arial. Arial is a disaster. At least Helvetica can do its job. <br> <br>Verdana. Sorry, Carter. <br> <br>Copperplate Gothic. Try again.</p>"
