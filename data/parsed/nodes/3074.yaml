    html: <p>This would be my list of fonts that are important enough that everyone should know how to use them well. There are a bunch that I thought about putting on this list, but in the end, learning to use Helvetica means you'll be able to use Univers, etc. as well. <br> <br>Helvetica (really hard to use well, but man it looks great when it's done right, ala Designer's Republic) <br> <br>Garamond (classic workhorse) <br> <br>Caslon (the other classic workhorse) <br> <br>Bodoni (the other, other classic workhorse) <br> <br>Futura (simple and perfect, much easier to get right than Helvetica) <br> <br>DIN (for any sort of industrial-nuanced application this font looks great, but it's a bit tough to use well) <br> <br>Gill Sans (humanistic sans serifs have always been easy for me to use, but they do seem to require a careful eye in the letterspacing) <br> <br>Optima (the subtlties of this face make is difficult to use, and it's horrible mis-use as "the hospital font" makes good uses of it breathtaking) <br> <br>FF Meta (one of the best designed typefaces of the last 10 years, and remarkably easy to use) <br> <br>ITC Century (a retro-classic, hard to use well) <br> <br>Franklin Gothic (not quite geometric, not quite humanistic, more personality than Helvetica, less than Gill)</p>
    html_clean: <p>This would be my list of fonts that are important enough that everyone should know how to use them well. There are a bunch that I thought about putting on this list, but in the end, learning to use Helvetica means you'll be able to use Univers, etc. as well. <br> <br>Helvetica (really hard to use well, but man it looks great when it's done right, ala Designer's Republic) <br> <br>Garamond (classic workhorse) <br> <br>Caslon (the other classic workhorse) <br> <br>Bodoni (the other, other classic workhorse) <br> <br>Futura (simple and perfect, much easier to get right than Helvetica) <br> <br>DIN (for any sort of industrial-nuanced application this font looks great, but it's a bit tough to use well) <br> <br>Gill Sans (humanistic sans serifs have always been easy for me to use, but they do seem to require a careful eye in the letterspacing) <br> <br>Optima (the subtlties of this face make is difficult to use, and it's horrible mis-use as "the hospital font" makes good uses of it breathtaking) <br> <br>FF Meta (one of the best designed typefaces of the last 10 years, and remarkably easy to use) <br> <br>ITC Century (a retro-classic, hard to use well) <br> <br>Franklin Gothic (not quite geometric, not quite humanistic, more personality than Helvetica, less than Gill)</p>
