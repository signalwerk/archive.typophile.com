    html: <p>ITC Garamond was very big in the '80s. Goudy Oldstyle and Les Usherwood's stuff was pretty popular in the early '80s. Later on with the desktop publishing boom, probably because of the limited quality type choices at the time, you saw a lot of the "LaserWriter 35", especially Palatino. The first few batches released by Adobe skewed things a bit, causing a revival of sorts of Century Oldstyle, Trump Medaeival, Optima, Bodoni and some others. Used to see Futura used with ITC Baskerville a lot. Bernhard Modern and Onyx were both pretty big. None of these really says EIGHTIES the way some of the others that have been suggested do, but these are ones I recall seeing a lot.</p>
    html_clean: <p>ITC Garamond was very big in the '80s. Goudy Oldstyle and Les Usherwood's stuff was pretty popular in the early '80s. Later on with the desktop publishing boom, probably because of the limited quality type choices at the time, you saw a lot of the "LaserWriter 35", especially Palatino. The first few batches released by Adobe skewed things a bit, causing a revival of sorts of Century Oldstyle, Trump Medaeival, Optima, Bodoni and some others. Used to see Futura used with ITC Baskerville a lot. Bernhard Modern and Onyx were both pretty big. None of these really says EIGHTIES the way some of the others that have been suggested do, but these are ones I recall seeing a lot.</p>
