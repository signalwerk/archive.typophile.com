    date: 2003-02-28T10:39:00
    date_raw: 28 Feb 2003 — 10:39am
    votes: null
    html: "<p>Any Oz Cooper typeface is eternal, for me. <br> <br>Although I don't agree any typeface stops looking decent, as everything is the basis for the future, I can say my impression (from graphic design) is you would get the most of eighties design from the following: <br> <br>1) Industria (Adobe) <br>2) Franklin Gothic and Franklin Gothic Condensed (mostly used in bold and extrabold). <br>3) Compacta <br>4) City (Berthold) <br>5) Eras (ITC/Letraset) (yes, Stephen is right!) <br>6) Enviro (ITC/Letraset) <br>7) Frankfurter (ITC/Letraset) <br>8) American Typewriter <br>9) Harlow (ITC/Letraset) <br>10) Santa Fe (ITC/Letraset) <br>11) Serif Gothic (ITC/Letraset) <br>12) Tiffany (ITC) <br> <br>For a display type crying \"1908s\" and stuck in them (for now) Enviro, Santa Fe and Harlow are the best for me. (I hate Enviro but I'm following the brief). <br>Serif Gothic and Eras are also very OK for a more formal look. <br>If you want to look a bit \"too fancy for my cat\", Tiffany is fine, instead. <br>Steve (ITC/Letraset) it's from 1973 but it recalls a lot the \"future past\" attitude of the 1980s first videogames generation. A lot more than Data70 or Countdown and Amelia, more connected to their own 1970s. <br> <br>I hope I have spotted something suitable for your poster. <br></p>"
