    html: <p>&gt;Cooper black How does a 20s typeface have an 80s flair? :-) Still used as VIVA TVs principal font, though... Eerie, to see that font on young music television... Fonts with massive 80s flair, imo are the various works of Neville Brody, mostly available through Fontshop and Linotype. The standard, non Fontshop-modded DIN-Schrift also was very big, at least in Germany, in the 80s, used in a mag named TEMPO. Not a font from the 80s, but it fit the cold and sterile tone of the times. Many Emigre Fonts stem from the 80s, especially their bitmap work like Oakland. Also, Modular and Triplex suggest themselves, but I'm not sure they're from the 80s originally. Also, if we go late-80s, there were already some Instant Fonts in Use. VERY late 80s, we got the Beowolf by Letteror. Despite being called the Helvetica of the 90s, Erik Spiekermanns Meta was originally created in the mid-80s and somehow has an 80s Flair, imo, till today. Also, if you look at Vaughan Olivers stellar work, a nice step back in history is okay, so even Garamond and Sabon or specimen from old books can be used. </p>
