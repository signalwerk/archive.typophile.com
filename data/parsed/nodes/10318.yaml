    html: <p>Cooper Black = 80s? you're talking about the 1980s right? Hmmm. <br> <br>When I remember the 80s I remember Memphis style with lots of wavy lines and Univers Condensed Oblique set on an angle to match the slant. Remember that? <br> <br>And Charles S. Anderson and the retro, rubber stamp feeling. Maybe some Torino or Corvinus Skyline or Fenice. Or maybe even just some Cheltenham Condensed. <br> <br>I also think of early Neville Brody stuff -- Industria, Arcadia. Or maybe early Emigre -- Modula, Senator, Base 9. <br> <br>That's some of what says the 80s to me. <br> <br>-- K. <br></p>
