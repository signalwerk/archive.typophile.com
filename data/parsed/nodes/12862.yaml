    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Case</strong></p>
    <p>In current practice, usage of the term case most likely refers to the use of uppercase (capital) or lowercase letters. See some examples below. In <a href="/node/12409" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">letterpress</a> practice, case refers to the physical box (case), usually wooden, that a given set of letters is stored. Capital letters were stored in the upper (top) case and lowercase letters were stored in the lower (bottom)&nbsp;case.</p>
    <p>Examples:</p>
    <p><span class="caps">ALL</span> <span class="caps">CAPS</span> – All letters are&nbsp;capitalized.</p>
    <p>Title Case – The first letter of each word is&nbsp;capitalized.</p>
    <p>Sentence case – where the first character is capital and the remaining words are&nbsp;lowercase.</p>
    <p>Camel Case – Also called internal caps where one or more characters in a given word (or string) has a capitalized letter. This is often used in programming languages and increasingly seen for naming or branding companies or&nbsp;products.</p>
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/30028" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Technical Info</a>&nbsp;: <a href="/node/33993" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Feature Tags</a>&nbsp;:&nbsp;case</strong></p>
    <p>‘case’ is an <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a> <a href="/node/add/wiki?edit%5Btitle%5D=feature%20tag" title="Create node &quot;feature tag&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">feature tag</a> with the friendly name “Case-Sensitive Forms”. <a href="http://www.microsoft.com/typography/otspec/features_ae.htm#case">Click here</a> to read the spec from the Microsoft Layout Tag&nbsp;Registry.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/32525">Greek OpenType&nbsp;Features</a></p>
