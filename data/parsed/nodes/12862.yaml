    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Case</strong></p>
    <p>In current practice, usage of the term case most likely refers to the use of uppercase (capital) or lowercase letters. See some examples below. In <a href="/wiki/Letterpress" class="freelinking" rel="nofollow">letterpress</a> practice, case refers to the physical box (case), usually wooden, that a given set of letters is stored. Capital letters were stored in the upper (top) case and lowercase letters were stored in the lower (bottom) case.</p>
    <p>Examples:</p>
    <p>ALL CAPS -- All letters are capitalized.</p>
    <p>Title Case -- The first letter of each word is capitalized.</p>
    <p>Sentence case -- where the first character is capital and the remaining words are lowercase.</p>
    <p>Camel Case -- Also called internal caps where one or more characters in a given word (or string) has a capitalized letter. This is often used in programming languages and increasingly seen for naming or branding companies or products.</p>
    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Technical%20Info" class="freelinking" rel="nofollow">Technical Info</a> : <a href="/wiki/Feature%20Tags" class="freelinking" rel="nofollow">Feature Tags</a> : case</strong></p>
    <p>'case' is an <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> <a href="/wiki/feature%20tag" class="freelinking" rel="nofollow">feature tag</a> with the friendly name "Case-Sensitive Forms". <a href="http://www.microsoft.com/typography/otspec/features_ae.htm#case" rel="nofollow">Click here</a> to read the spec from the Microsoft Layout Tag Registry.</p>
