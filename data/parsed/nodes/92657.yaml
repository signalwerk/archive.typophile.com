    <p>I was primarily struggling to identify the font at the bottom of this logo (although matslof got it bang on ^^) and now I'm wondering if maybe a better match can be found than my approximate guess for the font used at the top of the logo.</p>
    <p>The logo in question is here ("THE KENT SPITFIRE"):<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ks_logo_master_small_6255.jpg"></div><p></p>
    <p>My naked-eye research led me to <a href="http://www.identifont.com/find?font=CG+Alpin+Gothic+No.+1&amp;q=Go" title="http://www.identifont.com/find?font=CG+Alpin+Gothic+No.+1&amp;q=Go">http://www.identifont.com/find?font=CG+Alpin+Gothic+No.+1&amp;q=Go</a> but I wonder if it's not instead another one.</p>
    <p>Thanks to anyone who gives it a shot :)</p>
