    <p>The <a href="http://www.typesociety.org/" rel="nofollow">Society of Typographic Aficionados</a> is pleased to announce the fourth annual SOTA Catalyst Award. The award is targeted at young people who have created original work in type design, type history, or other areas related to typography. The award recognizes a person 25 years of age or younger who shows both achievement and future promise in the field of typography. The purpose of the award is to act as a catalyst in the career of a young person who does not yet have broad exposure in the profession.</p>
    <p>The recipient will be awarded up to $1,500 USD in reimbursement for transportation and lodging expenses to attend the <a href="http://www.typecon.com/" rel="nofollow">TypeCon2013</a> conference in Portland, Oregon — August 21st – 25th. They will also have their conference registration fee paid for and will be required to give a 20-minute presentation during the main conference program. Recipients should be available to attend the conference from Thursday to Sunday.</p>
    <p><strong>Judging Committee</strong></p>
    <p><a href="http://tbrown.org/" rel="nofollow">Tim Brown</a><br>
    <a href="http://explorationsintypography.com/" rel="nofollow">Carolina de Bartolo</a><br>
    <a href="http://www.myfonts.com/person/Craig_Eliason/" rel="nofollow">Craig Eliason</a><br>
    <a href="http://twitter.com/gabrowitsch" rel="nofollow">Ivo Gabrowitsch</a></p>
    <p><strong>Submission Deadline</strong></p>
    <p>March 1, 2013</p>
    <p><strong>Notification of Award</strong></p>
    <p>April 1, 2013</p>
    <p><strong>Requirements</strong></p>
    <p>You must be 25 years of age or younger on December 31st, 2013 and must attend TypeCon2013 in Portland — making a presentation during the conference.</p>
    <p>The following materials must be emailed to <a href="mailto:catalyst@typesociety.org" rel="nofollow">catalyst@typesociety.org</a> by the submission deadline. A single PDF file (may be multiple pages) containing the following information is preferred:</p>
    <ol>
    <li>Visual samples of a specific project or related group of work to be the topic of the presentation</li>
    <li>A brief description of the presentation (100 words or less)</li>
    <li>A letter explaining your involvement in typography (300 words or less)</li>
    <li><strong>Optional:</strong> Online links to additional work or background information</li>
    </ol>
    <p><strong>Contact Information</strong></p>
    <p>Include your name, date of birth, postal address, organization or university affiliation (if applicable), email, and phone number with area code. Applicants from outside the U.S. or Canada should include their country dialing code as well.</p>
