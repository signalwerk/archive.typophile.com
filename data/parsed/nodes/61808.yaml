    html: |-
      <p>Hi Eric,</p>
      <p>That second to last 'g' is pretty interesting. I like what's happening with the top bowl; have you tried giving the lower bowl a little of the same treatment? I wonder if, instead of the lower part of the letter being a single looping stroke, it instead had the "constructed" feeling of the top bowl, maybe with a teardrop-shaped counter. I have a feeling that if you get this letter to a place where you like it, it might inform the other letters as well -- and this is a good testword for working these ideas out.</p>
      <p>Good luck!</p>
      <p>J</p>
