      <p>@Claus Sorry about that. I will think of a new name. It seems like the good names are always taken. I definitely don't want to compete with Markant, as it looks much nicer than this font; I think it utilizes Dwiggin's Marionette theory very well!</p>
      <p>@Tiffany Thank you for taking the time to point out these issues. The diagonals in general are difficult to judge after too many attempts at minute adjustments, but you;re right about the y tail. I think the b &amp; d need more as well. I will produce some variations for all of these suggestions and jpg them on this thread.</p>
      <p>-Eric MacLeod</p>
