      <p>Interesting. It isn't very wide, but it feels wide. </p>
      <p>y - the tail seems a little thin<br>
      t - the cross-stroke seems a little long<br>
      g - the bottom bowl looks squooshed<br>
      g - not sure about the ear<br>
      d - the bottom of the belly seems pinched.<br>
      b - the notch where the stroke and stem meet should be more defined</p>
      <p>b &amp; d - maybe the bowls need to be a little more square?</p>
      <p>Still pretty readable at small sizes. The wide spacing helps with that. </p>
      <p>s - I can't decide if it is squooshed or not.</p>
