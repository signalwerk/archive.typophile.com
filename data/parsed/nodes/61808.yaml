    html: |-
      <p>Hi Eric,</p>
      <p>I just couldn’t resist your last ‘Input from non-Type-Superheroes’ call. I am still smiling about it. I liked ‘Marquardt’ very much from the first time I saw it. It emanates a subtle elegance.</p>
      <p>Structurally speaking you have two options: </p>
      <p>1.	To design a regular typeface without unexpectedly innovative character shapes (like Frutiger, Scala Sans, Syntax or to put it better; like Futura after the Bauer craftsmen took out all the ‘odd-looking’ like characters of Paul Renner), The Standard version for Body Text.<br>
      2.	To design a typeface with 80% normal and 20% novel-looking like characters, The Alternate version for Display.</p>
      <p>Maybe you could make a No. 1 as a standard version (and even so, it would still display many very nice characteristics as it already does) and a No. 2 as an alternate version and see how it goes.</p>
      <p>The last image with alternate versions of the word ‘badge’ that you posted concentrates on restructuring the overall style of ‘Marquardt’ according to the shapes that the letter ‘g’ might take.</p>
      <p>Trying out different ‘g’s is quite OK, and of those I like the ones in b, c, d and e. Altering all the other letters in the word ‘badges’ didn’t quite work out as these letters in your original version are already quite nicely drawn compared to the new version.</p>
      <p>I am posting you some alternates for the letter ‘g’ just in case they might interest you.</p>
      <p>Cheers<br>
      Boris</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Gs_5710.png"></div><p></p>
