      <p>Here are the changes made in y,t,g,b,d, &amp; s. I will change the name of the font to "Marquardt". That's the name of the street next to a triple-train-track crossing on my way to work; probably the most annoying section of my commute.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Marquardt-090909_4112.jpg"></div><p></p>
      <p>The change in the bowls/bellies and counters in d,b are slight, but I think they are the necessary changes. The counters in the g have been balanced a little more. The s has been adjusted some more...I think the spine was too fat before. I've included several g's here, but I have visited some of the ear variations before and I still feel like the ear similar to the inverted b belly-stem connection is the most successful. I'll have the pdf updated by tomorrow.</p>
      <p>-Eric MacLeod</p>
