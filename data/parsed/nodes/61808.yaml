      <p>Thanks for the comment, Jonathan! Here are some totally new variations based on the idea of giving the lower bowl a "constructed" feel. I applied this g's <a class="freelinking external" href="http://www.vllg.com/Thirstype/Infinity/mudTyper+Weights/" rel="nofollow">Infinity-like</a> upper-left bowl-stem connection to b &amp; a. </p>
      <p>Seen are some other variations:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Marquardt-091209_4736.jpg"></div><p></p>
      <p>fig. a. original</p>
      <p>fig. b g. with new lower bowl, a &amp; b changed as well; angled ascenders</p>
      <p>fig. c–e. experimenting with opening the weak connections</p>
      <p>fig. g–l. experimenting with giving g tail connection relief.</p>
      <p>fig. f. a full fledged stencil font perhaps, using 110° angle</p>
      <p>Can I get some more feedback on these variations? Input from non-Type-Superheroes also welcome :)</p>
