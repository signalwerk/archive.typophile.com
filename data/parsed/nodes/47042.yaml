    <p>Hey, i am brand new to this website and this forum. So please be nice!<br>
    I started a clothing company around 18 months ago. But i have had many comments saying its not clear to read the typeface and that the ’r’ looks like 2 letters instead of one. So i have decided to totally re-design it.</p>
    <p>The thing is i forked out for photoshop cs3 extended about 8 weeks but to be honest don’t have a clue where to start really.</p>
    <p>i know that my old logo looked a bit childish i want the new one to look more professional.</p>
    <p>i really like the font gill sans mt condensed and was wondering if you bright sparks could give me some good alternatives.</p>
    <p>also if you good give me some ideas on layout and things like that, it would be very much appreciated.</p>
    <p>below i have put and example of the past logo.</p>
    <p><a href="https://web.archive.org/web/20080828032549/http://i29.tinypic.com/2lx8il4.jpg" title="http://i29.tinypic.com/2lx8il4.jpg">http://i29.tinypic.com/2lx8il4.jpg</a></p>
    <p>please ANY help is very much appreciated!</p>
    <p>the color scheme i want to be very neutral</p>
    <p>thanks</p>
