    date_raw: 15 Feb 2010 — 2:59am
    votes: null
    html: <p>Allow me to point out that though offerings with multiple optical variants tend to focus on the display end, there may be some demand for serving the smaller sizes. Johannes Küster says in his ATypI 2004 presentation "Fonts for mathematics" (<a class="freelinking external" href="http://www.typoma.com/publ/20041002-atypi.pdf" rel="nofollow">PDF</a>) that "math would need two sizes below Regular" in order to accommodate multiple levels of superscripting and subscripting one requires in mathematics.</p>
    html_clean: <p>Allow me to point out that though offerings with multiple optical variants tend to focus on the display end, there may be some demand for serving the smaller sizes. Johannes Küster says in his ATypI 2004 presentation "Fonts for mathematics" (<a class="freelinking external link-external" href="http://www.typoma.com/publ/20041002-atypi.pdf" rel="nofollow">PDF</a>) that "math would need two sizes below Regular" in order to accommodate multiple levels of superscripting and subscripting one requires in mathematics.</p>
