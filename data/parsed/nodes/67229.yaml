    html: |-
      <p>I have several typefaces at MyFonts that are tagged "optical sizes", however I don't recall that as my tag, and most of them only have two optical sizes, "normal" and Display/Headline. (Scotch Modern and Walburn, and later this year Fontesque, have three.) </p>
      <p>As William notes, Hairline and Ultra Thin sans fonts are to all intents and purposes display sizes, although the original principle of optical scaling (Hrant's "...appear like the same typeface at different sizes...") doesn't really apply. </p>
      <p>It's difficult to keep track of any category if you don't mentally "tag" it immediately you see a new face, as there is now such a large number of typefaces being released every month.<br>
      How many?</p>
