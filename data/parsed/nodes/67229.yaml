      <p>Nick — FB has used “Banner”. However, not consistently, unfortunately. </p>
      <p>Fenway Banner is intended for larger than Display. Zócalo Banner, more for in between Text and Display. </p>
      <p>Can’t think of any “Poster” off the top of my head.</p>
      <p>“Titling” is sometimes used for larger-than-Display. Often implies all-caps, but not exclusively.</p>
      <p>“Deck” is used a lot for in-between cuts. H&amp;FJ uses that also, as do others geared toward publications.</p>
      <p>I've seen FB use “Slug” and “Agate” (in addition to Micro) for small text sizes, though not in the Retail library.</p>
