      <p>To be of more practical use, a list should state which optical sizes a face has.</p>
      <p>A two-size system is Display and Text.<br>
      A three-size system could be named Display, Text, and Micro.<br>
      But after that what? Display (2), for instance? That would seem to indicate that there is a font for really big sizes.</p>
      <p>**</p>
      <p>Shinntype faces with optical variants:</p>
      <p>Bodoni Egyptian (Display, Text)<br>
      Brown Gothic (Display, Text)<br>
      Fontesque (Display, Text)<br>
      Nicholas/Goodchild (Display,Text)<br>
      Pratt (Display, Text)<br>
      Scotch Modern (Display, Text, Micro)<br>
      Walburn (Display (2), Text)<br>
      Worldwide (Display, Text)</p>
