  html: |-
    <p>Hi, I am trying to create a series on fonts that can be used for childrens handwriting practice.</p>
    <p>I need the fonts to appear layered when used in Illustrator.</p>
    <p>I am using FontLab and have created 3 separate fonts with the same metrics. One font is handwriting and the other two are guidelines.</p>
    <p>After generating the fonts and loading on the computer, each font is out of step with the other on the vertical position.</p>
    <p>Does anyone know why this is happening? Is it Fontlab or is it Illustrator?</p>
    <p>Thanks!</p>
