    html: "<p> Interesting thread/questions. <br> <br>Maybe the hardest thing to predict is how much future generations will *care* about reading/readability (and that's not saying the current generation cares enough). But for the moment I'll ignore the underlying cultural motivations/obstacles (as interesting as they are to consider) and assume that future generations will [nominally] care enough to implement non-trivial methods: <br> <br>&gt; How will reading develop? <br> <br>Reading will be heavily assisted: you will be primarily shown what [you're told to think] you're interested in. Which means more efficiency, but at the cost of exposure to new/unexpected things: narrower but deeper thought. Dangerous. <br> <br>&gt; What are or will be the most influencial factors for this change, if a change happens? <br> <br>Media will increasingly be controlled by large corporations, which will assimilate smaller, more liberal entities, subsequently posing on the surface as providing an alternative to those who feel they need an alternative. The small media players which manage to survive will never make a real difference. Until, of course, the Great Revolution. <br> <br>So, because for the forseeable future reading will be controlled by corporations, we will become less rounded people. <br> <br>&gt; What influences on type will it have? <br> <br>A given type design will be more software, less highly designed beziers: a font will be able to adapt its x-height, width, color, etc. automatically depending on the reading conditions. How these conditions are conveyed is another matter. <br> <br>There will be fewer text faces in actual use. <br>But just as many display faces. <br> <br>&gt; Will we see more Sansserif or serif type, if so, why? <br> <br>Display: Almost no serifs. <br> <br>Text: We will see more flare-serif and semi-serif designs. I'm not sure why I said that. <br> <br>&gt; How much does this depend on the development of technology? <br> <br>Serifs depend on resolution. As we're waiting for enough resolution, more and more people will think (incorrectly) that it's OK to use sans for long texts. <br> <br>&gt; how could ultimate redable type look like in the future? <br> <br>Instead of moving your eyes around, you will look directly at a fixed spot on a dynamic medium (like a screen, or \"active\" paper), and you'll use small movements of your hand/fingers (or maybe small \"symbolic\" eye movements) to trigger saccades/regressions. You might indicate the size of the saccade/regression through degree of movement, or the system could learn and adapt to your reading ability, and coupled with the bouma-difficulty of the text at hand (meaning its ease of decipherability), will guess how far to saccade/regress. At first you'll go slow, your hand taking a while to do what it needs, but eventually there will be an instantaneous connection between your eyes, brain and hand, enabling you to read much faster and for much longer (thanks to near-total lack of saccades). <br> <br>hhp </p>"
