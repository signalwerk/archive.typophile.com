    html: <p> If we want to have good readability the solution is have a good legibility in each letter to creat good apperence for the reader ( form, space, unity betten letters to creat words) without visual noise or interferences but it's depend of the principal function of that type. And when we want to use one letter only for a trademark? <br> <br>&gt; Words are composed by lettes so we designing letters to compose words or not. <br> <br>To continue the first idea of Jacques, how far is gonna be the globalization of the world to transform all languages in one? How many country's and cultures will survive to all this big and historical transformations of language?  <br> <br>Ricardo </p>
