    html: <p> You make a good argument. <br> <br>&gt; changes have to bleed into the community. <br> <br>Totally agreed. <br>Many reform efforts have failed because they were too top-down. <br> <br>&gt; what are the characteristics that make one way of writing more fit than another? <br> <br>Yes, that's a very interesting question. And what I like most about it is that it doesn't resign to a fatalistic view of a course of evolution that can't be affected by humans. <br> <br>There are ways to improve writing, even if it usually seems like such an uphill battle. <br> <br>&gt; there is an academy in Spain that makes rules for everything. <br> <br>But there's something else. Unlike English, Spanish has a precedent for "correct" spelling, so when importing/creating a word there's every reason and motivation to keep things logical. One could say that the Academy isn't laughed out of existence because Spanish pronunciation/spelling is already highly sensical as it currently stands. English is already such a mess that the notion of such an Academy is just plain funny, and people have little motivation to maintain/promote good orthography. <br> <br>BTW, proper names could be seen as an generally acceptable exception. <br> <br>hhp </p>
