    html: "<p> &gt; Will that give us similarities with chinese/japanese writting, glyphs and signs? <br> <br>That's an interesting way of looking at it. But the difference is that Latin (or any alphabetic system) has the advantage of being decomposable: you can \"compile and vocalize\" any new/unknown word and possibly know what it means if you've heard it before; in a logography (like Chinese) you have to  basically learn the glyph as it stands. The often ignored beauty of Chinese is that it's the only way to have one written language for the many spoken languages in the huge, multi-faceted society that is China. You realize this when you watch a Chinese TV show, and start wondering why it's subtitled in Chinese too... I used to work in a small company with employees from Mainland, Taiwan and Hong Kong, and they had to talk English to one another - but they would *read* the same script fine! <br> <br>Then there's syllabaries, like the Kana component(s) of Japanese, and although there's a lot less syllables to learn (than complete logographs in Chinese), and although syllabic writing has the didactic advantage of being very close to actual speech, it still doesn't enjoy the abstraction of alphabetic systems. <br> <br>And *then* there's the rare bird that is Hangul (Korean), which is an alphabetic syllabary (it encodes syllables, but the component alphabetics are visible and decomposable \"inside\"), so it enjoys the best of both worlds. And what's the most amazing thing about Hangul? It's an entirely man-made writing system (invented about 500 years ago). <br> <br>&gt; it then will be based on images, not language. <br> <br>But I'd say that [immersive] reading (in any system) is basically image-based anyway. <br> <br>&gt; the solution is have a good legibility in each letter <br> <br>But in immersive (high-speed) reading the details of a letter are a lot less important than some of its \"global\" features (like ascenders/descenders). <br> <br>&gt; how far is gonna be the globalization of the world to transform all languages in one? <br> <br>That's a very interesting -and equally worrisome- question. I just hope that more people start seeing cultural imperialism for the dangers it poses. <br> <br>hhp </p>"
