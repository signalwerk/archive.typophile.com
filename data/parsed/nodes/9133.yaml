    html: "<p> i just thought of a problem:  <br>&gt;&gt; If, theoreticly, something like charactermelting might happen, what will then happen in the eastern european countries for example? They are also using latin signs, but combined with a lot of accents! It might become difficult to assign optically accents to forms/glyphs, resulting from the melting of characters.  <br> <br>I tried to compare the charactermelting to chinese signs and glyphs. Maybe we could also compare, to a certain degree, the arabic written languages. <br> <br>&gt; how far is gonna be the globalization of the world to transform all languages in one? <br> <br>That will probably depends if it will influence handwritting and the development of language (e.g esperanto).  <br>And even if character will melt together, each will still have to be typed and therefore will it influence the reading, not the languages. The melting will be done by software. That is to say, if al this won't end up in a kind of *steno* ( the short language secretary use to shorten down dicted text).  <br> <br>Jacques </p>"
