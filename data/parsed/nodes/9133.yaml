    html: '<p>Hrant:  <br> <br>I would agree.  <br> <br>Robert Bringhurst has much more to offer on the subject, of course, in his book, "The Elements of Typographic Style."  <br> <br>(<a href="http://www.amazon.com/exec/obidos/ASIN/0881791326/inktomi-bkasin-20/103-2474988-0468653" target="_top">http://www.amazon.com/exec/obidos/ASIN/0881791326/inktomi-bkasin-20/103-2474988-0468653</a>)  <br> <br>Highly recommended, for those who have not yet discovered this excellent reference.  <br> <br>Also useful: "A History of Graphic Design" by Philip B. Meggs  <br> <br>(<a href="http://www.amazon.com/exec/obidos/ASIN/0471291986/ref=pd_sxp_elt_l1/103-2474988-0468653" target="_top">http://www.amazon.com/exec/obidos/ASIN/0471291986/ref=pd_sxp_elt_l1/103-2474988-0468653</a>)  <br> <br>David</p>'
