    html: "<p> English orthography helps readabiltity in the following way: Instead of one posible combination of characters for any given sound, there are many. For example, \"night\" is more easily distinguished from \"mite\" than mit from nit. It does make it harder to learn, though. <br> <br>As for evolution: of course there are concious decisions made, but there are so many by so many different people, that the results tend to be very organic. The characteristics of change in writing are very similar to other complex network, one of which is biological evolution. Obviously there are differences, but the point in this case is that certain things have to happen for a sign to be adopted into a community. In korea there was a central figure that dictated a new writing system. In our capitolist society there are big descision makers, (bill gates could probably do a lot to change writing if he had a mind to) but even there, changes have to bleed into the community. It parallels evolution in that different signs compete for use. Writing signs that are used more prolifically tend to enter into a positive feedback loop that spreads them throughout the system, much in the same way that animals that are more fit then create more offspring until they fill their niche. A good example of this evolution is the advent of typing signs like :-) Obviously someone somewhere thought of the smiley, but something had do happen for it to seep into the communal conscience. <br> <br>The real questions then are, what are the characteristics that make one way of writing more fit than another? There are political, social, economic, aesthetic, and physical considerations (and I'm sure a lot more). <br> <br>About spanish: there is an academy in Spain that makes rules for everything. In my opinion, they are loosing credibility-- why should their only be one right way to do things, and who are they do decide? My prediction is that spanish along with english will become more diverse in its spellings as they adopt words from other places, and as commercial creative spellings become more common. Even spellings of Spanish names are being changed (to be cool? I don't know why). It is common, for example to substitute th for t. (thalia, liseth) even though it is still pronounced the same way. </p>"
