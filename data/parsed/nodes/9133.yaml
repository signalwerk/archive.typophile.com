    html: "<p>Whew, so much has been said here, it's almost not worth saying more.  But I'll try.  <br>  <br>Reading in the future: that implies, of course, that people will be reading at all.  How many novels does a teenager in the Western world (or specifically, America and Britain) today read per week, compared to, say, 100 years ago?  <br>  <br>If the trend continues, the future of Western literature could conceivably be reduced to academic journals for the elite and indecipherable instant messaging by hordes of illiterate graduates.  <br>  <br>One the other hand, the latter part of the century may well be dominated by the cultural contributions of 1.x billion Chinese, once their civilization becomes fully industrialized.  <br>  <br><i>If Open Type and its offspring will open the possibility of dynamic, maybe even intelligent type, might it not be possible that characters and words could melt together, creating a new kind of silhouette/bouma based reading? (I mean a kind of ligaturing which goes beyond the typical combined two, max. three character forms). </i>  <br>  <br>I've recently thought it would be interesting to see typefaces where the shape of each letter depends on the context of the word and surrounding letters, for total efficiency, readability, and gestalt contrast.  <br>  <br>Interesting discussion on \"word glyphs\".  I've also heard a theory that whenever a language is faced with multiple-glyph forms for words, and single glyphs, the single glyph ultimately wins out (the contention being that logographic languages are innately preferable).  Examples: people prefer &amp; to \"and\"; or @ to \"at\"; or the number 2 to \"to\" and \"too\".  Could our whole language be transformed in such a manner?  <br>  <br>Cultural imperialism: much may depend on whether a certain Western power opts for a few more centuries of colonizing and policing the world, politically and culturally; or whether the hundreds of still-unique cultures around the world stand their ground and take advantage of their diversity.  <br>  <br>Paul</p>"
