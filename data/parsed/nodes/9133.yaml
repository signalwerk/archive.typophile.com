    html: "<p>&gt; But where will this intelligence come from? The programmer, or the type designer? <br> <br>You got me there. That is why I put *intelligently* in brackets, because it actually isn't the right term.  <br>Of course, the type designer should tell the way things happen. (welcome in typo'topia!) Which means that the type designer should think of all possibilities, if possible, and then programm the stuff himself or he should let it programm. <br> <br>Programming??? You probably know or heard about all the things Open Type should make possible, but it still will have to be programmed, and the glyphs will have to be all designed and drawn. So at the end, the designer should, like I said before, think of all possibilities an problems.  <br> <br>Alternativ Idea&gt; If the offspring of Open type will have increased possibilities such as GX type had for example, or MM, fonts could become semi-intelligent (Mmmh....), maybe predictable is the better expression, in the future. If so, type design might not be the design of glyphs whih work well together anymore (to put it very crude), but as noted before, the design of words, maybe even texts. Which means a type designer will have to think in an extra dimension: Bouma. (Note: today and in the past designer also worked with the bouma principle. But instead of building the words out of quantified units, characters, in the theory we are speaking of now, the quantum units will be part of a puzzle, of which the pieces won't be interchangeable. Woven together. (&gt;&gt; we could call this the choas theory of type, hihihihi&gt; Splines with predictable behaviour which function as carriers to glyphs. (As if you put a metal glyph on a piece of metal, and bend this piece of metal to make the glyph fit into whatever...) <br> <br>Jacques</p>"
