  html: "<p> Hi guys, <br>I thing this might be a very importent topic for typedesigners now and in the future ( in 2-3 generations most people will probably only read from monitor and displays): <br> <br>::::::::: How will reading develop? <br> <br>:::::::::: What are or will be the most influencial factors for this change, if a change happens? <br> <br>:::::::::: What influences on type will it have?  <br> <br>:::::::::: Will we see more Sansserif or serif type, if so, why?  <br> <br>:::::::::: How much does this depend on the development of technology? (HiRes monitors e.g.) <br> <br>I would like to hear your opinions, or maybe you have questions yourself. <br> <br>Jacques <br> <br>PS: automatically the question arises: how could ultimate redable type look like in the future? </p>"
