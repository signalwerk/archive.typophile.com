    <p>Hi, I'm dropping some substitution features into a new font, and I'm wondering about how to code OpenType ranges.</p>
    <p>For example: [a-z] will cover your basic alphabet, but won't cover accented characters. </p>
    <p>Is there a way to write out a range that includes, for example, all lowercase characters?</p>
    <p>Is there any documentation on this, or basic principles involved?</p>
    <p>Obviously, I can do write out every character manually, but would rather do it efficiently if possib.e</p>
    <p>Rob</p>
