    html: |-
      <p>Uppercase vs. lowercase is a somewhat fluid concept -- best illustrated by the <a href="http://typophile.com/node/48746" rel="nofollow">long-ongoing discussion</a> on where to put the eszet, and now it officially (or semi-officially) has an uppercase form, what to do with existing fonts, or indeed, with new fonts, and with new fonts in old software (and presumably also the other way around).</p>
      <p>The Unicode consortium lists per code point what they consider "lowercase" and "uppercase" (for an introduction, read <a href="http://unicode.org/reports/tr21/tr21-3.html" rel="nofollow">their view on Case Mapping</a>). You can safely refer to the Unicode lists to decide which characters are uppercase or lowercase.</p>
      <p>For example:<br>
      U+2C60 LATIN CAPITAL LETTER L WITH DOUBLE BAR<br>
      U+2C61 LATIN SMALL LETTER L WITH DOUBLE BAR</p>
      <p>(etc.) Once you have decided which characters to put into your font, define named glyph classes:</p>
      <p>@mylowercase = [ a b c ... x y z uni2C61 ];</p>
      <p>It sounds like a lot of work, but of course you only have to do this once. If you ever add an uppercase of lowercase glyph later on, you only have to add it to the right glyph class.</p>
