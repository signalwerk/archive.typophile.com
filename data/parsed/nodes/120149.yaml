      <p>If there is a font exactly like this, I don't recall seeing it.<br>
      The lettering is an adaptation of a classic blackletter style called textura. The font with the closest basic letter-forms is Fette Gotish </p><div class="imageWrap"><img src="http://typophile.com/files/FetteGotischAsArsenal_5474.gif"></div><br>
      <a href="https://www.myfonts.com/fonts/linotype/fette-gotisch/" title="https://www.myfonts.com/fonts/linotype/fette-gotisch/">https://www.myfonts.com/fonts/linotype/fette-gotisch/</a><br>
      See also fonts like Unger Fraktur Fett  <div class="imageWrap"><img src="http://typophile.com/files/UngerFrakturFettAsArsenel_5707.gif"></div><br>
      <a href="http://www.myfonts.com/fonts/rmu/unger-fraktur/" title="http://www.myfonts.com/fonts/rmu/unger-fraktur/">http://www.myfonts.com/fonts/rmu/unger-fraktur/</a><br>
      and, particularly for the _s_, Fette Fraktur<br>
      <div class="imageWrap"><img src="http://typophile.com/files/FetteFrakturasArsenal_6004.gif"></div><br>
      <a href="http://www.myfonts.com/fonts/linotype/fette-fraktur/" title="http://www.myfonts.com/fonts/linotype/fette-fraktur/">http://www.myfonts.com/fonts/linotype/fette-fraktur/</a><br>
      Don<p></p>
