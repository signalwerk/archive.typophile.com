    html: |-
      <p>If there is a font exactly like this, I don't recall seeing it.<br>
      The lettering is an adaptation of a classic blackletter style called textura. The font with the closest basic letter-forms is Fette Gotish <img src="/sites/default/files/old-images/FetteGotischAsArsenal_5474.gif"><br><a href="https://www.myfonts.com/fonts/linotype/fette-gotisch/">https://www.myfonts.com/fonts/linotype/fette-gotisch/</a><br>
      See also fonts like Unger Fraktur Fett  <img src="/sites/default/files/old-images/UngerFrakturFettAsArsenel_5707.gif"><br><a href="http://www.myfonts.com/fonts/rmu/unger-fraktur/">http://www.myfonts.com/fonts/rmu/unger-fraktur/</a><br>
      and, particularly for the _s_, Fette Fraktur<br><img src="/sites/default/files/old-images/FetteFrakturasArsenal_6004.gif"><br><a href="http://www.myfonts.com/fonts/linotype/fette-fraktur/">http://www.myfonts.com/fonts/linotype/fette-fraktur/</a><br>
      Don</p>
