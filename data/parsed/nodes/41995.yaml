    <p>I built a site a couple months back, and wish I had found this site before I was done. I would appreciate some feedback on the logo I made for my site:</p>
    <p></p><div class="imageWrap"><img src="/web/20081008043235im_/http://www.typophile.com/files/wwjdl_5335.gif"></div><p></p>
    <p>I wanted something clean and sharp that could be used in a variety of ways; printable, over complex backgrounds, possibly on t shirts &amp; other mediums, looks good in black &amp; white as well as other variations that include multiple colors. I also want to be able to add it to a new background image for the site to easily create a different look (sorta like the backgrounds on MTV’s website)</p>
    <p>Here is a screenshot of how I’m using it as the logo currently.</p>
    <p></p><div class="imageWrap"><img src="/web/20081008043235im_/http://www.typophile.com/files/wwjdl2_6679.gif"></div><p></p>
    <p>Please, let me know your thoughts on this. I think it’s the first logo I’ve made that isn’t crappy.</p>
