      <div class="comment-spam-body"><p>Cheltenham as shown in the ATF 1923 Specimen Book is a match. The alternate _r_, with its arm raised above x-height, was provided with the various Cheltenham fonts. Here is the bold and extra bold version:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/CheltenhamBoldAndExtraboldAndWideATF1923_4254.jpg"></div><br>
      Mac McGrew explains: "The alternate form of r, with its arm raised above x-height, has also been criticized, but this is mostly the result of misuse. It is disturbing within a word, but adds a bit of grace at the end of a word." Source: American Metal Types of the 20th Century.<br>
      Don<p></p>
      </div>
