    votes: null
    html: |-
      <p>That was my observation as well — it should be a giveaway, but I can't spot it in another face.</p>
      <p>It compares interestingly to Berthold Sorbonne and Paratype Academy, but these are slightly higher in contrast, and without the reaching “r” and (I notice, not in the sample) relatively straight lower-case “f”.</p>
      <p>The whole of the Anglican Missal is curious, as it is composed of separate bodies of prayers set in differing faces. The bit I’m looking at now is “Prayers Before Mass,” but each subsequent section employs slightly (or markedly) different type. The “Proper Masses” section uses a face whose “r” is more conventional, and whose “l” upper serifs are angled rather than square.</p>
      <p>If you’re interested, it’s at <a href="/wiki/https%3A/%252Farchive.org/details/anglicanmissal00churuoft" class="freelinking" rel="nofollow">Archive.org</a>.</p>
