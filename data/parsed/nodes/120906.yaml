    <p>I was trying to replicate the appearance of this portion of the Anglican Missal, and was stymied in trying to identify the main body face. In particular, the lower-case “r” with its slight upward reach, and the “g” (which I know should be a giveaway) elude me. It looks a little like a Clarendon, and little like a Cheltenham, but not exactly like either, to my eye.</p>
    <p>I promise I'll moan, smack my forehead, and say “Of course!” if the answer is as obvious as I fear it will be.</p>
    <p>Many thanks —</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        Gloucester Old Style        </div>
            </div>
    </div>
