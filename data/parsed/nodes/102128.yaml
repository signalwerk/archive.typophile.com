    html: |-
      <p>The dash in example B does not, at least, look like a minus sign.</p>
      <p>As for this use of a dash, I believe it is standard on architectural drawings. I have also seen a computer program for making engineering drawings that uses the hyphen-minus character in <em>both</em> senses: -1/2" is exactly 4 inches away from 3-1/2".</p>
      <p>The way I see it, things would be much easier if the meanings of the plus and minus signs were swapped.<br>
      See: <a href="http://en.wikipedia.org/wiki/Counting_rods#Rod_numerals" title="http://en.wikipedia.org/wiki/Counting_rods#Rod_numerals">http://en.wikipedia.org/wiki/Counting_rods#Rod_numerals</a> (you might have to scroll down a bit)<br>
      Alas, it is far too late to change things from the way they now stand.</p>
      <p>As for "the customer is always right": I would at least get their specifications in writing, so in case there is trouble, your hands are clean.</p>
