      <p>As Charles said, hyphens are used sometimes with fractions that are made using regular-sized numbers. Probably started back in the typewriter days, and is still seen today sometimes when type is set amateurishly or in things like emails.</p>
      <p>I see it a lot on the web, and the Yahoo Style Guide even tells how to do it: "...if coding the fraction is impractical, use numerals for the whole number, followed by a hyphen and the fractional part written as x/y (as in 1-1/2 or 2-3/8)."</p>
      <p>&gt; Client says the fractions must be typeset as in B.</p>
      <p>He's seen it done that way and assumes it's correct. Show him examples of correct fractions in books, magazines, etc.</p>
