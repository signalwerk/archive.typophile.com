    <p></p><div class="imageWrap"><img src="http://typophile.com/files/frax_5790.jpg"></div><p></p>
    <p>Typesetting a new condo owner's manual in English and French which includes some measurements in inches. Client says the fractions must be typeset as in B.</p>
    <p>I'm almost dead certain you never set fractions with a hyphen in English text, unless there's a convention about doing this in the building trades that I don't know about. I would always set a number and fraction together as in A.</p>
    <p>I'm not as dead certain about French. This is in Quebec, not France (where of course this would be metric and so much simpler).</p>
    <p>(I am also reminded those should be double primes, not close quotes. But they're not the issue.)</p>
    <p>I've looked long and hard for French typesetting norms but this specific circumstance isn't covered by anything I've found.</p>
  html_clean: |-
