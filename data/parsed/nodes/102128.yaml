    html: |-
      <p>I tend to agree that the customer is always right. But I would desperately try to avoid the confusion caused by a hyphen also looking like a minus sign.</p>
      <p>So instead of 6-1/2, I would try 6_1/2, 6&amp;1/2, or, as suggested, 6+1/2.</p>
      <p>One can't do 6,1/2 since in most European languages the comma, rather than the period, serves as the decimal point, thus being even more confusing than a hyphen. (Note, too, that in typeset material, the minus sign tends to look more like an em dash than a hyphen, so this may not be as bad as it seems from typed material where - is the minus sign for programming languages.)</p>
