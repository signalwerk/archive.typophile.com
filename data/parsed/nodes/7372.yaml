    html: <p>Thank you all! <br> <br>This is the title of the very first edition of Candide. <br>I got this image from the web.  <br>I think I can create the "weathered" look myself but I would like to know what font would be used at the time when Voltaires' works were published.</p>
    html_clean: <p>Thank you all! <br> <br>This is the title of the very first edition of Candide. <br>I got this image from the web.  <br>I think I can create the "weathered" look myself but I would like to know what font would be used at the time when Voltaires' works were published.</p>
  - id: 50340
