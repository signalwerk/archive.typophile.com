    html: "<p>Well, Baskerville's fonts were used to print the works of Voltaire, but that was towards the end of the 18th century, not around the middle as the date there says. Plus the \"E\" is not Baskerville. <br> <br>Serge, do you have a better scan, or maybe some publication info? <br> <br>Also, I have to ask: how close do you need to come, and would that include the \"weathered\" look? <br> <br>hhp</p>"
