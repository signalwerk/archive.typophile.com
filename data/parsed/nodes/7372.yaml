    votes: null
    html: <p>You need to look at the offerings of the French foundries around that time, like at Deberny. Look to the articles by Ovink in Quaerendo, as well as the works by Audin and Thibaudeau. <br> <br>But actually, Baskerville became very fashionable in France shortly after Voltaire (and continues to hold a special place in French publishing) so it might be the best choice. On the other hand, its design goes against the "antique" look. <br> <br>hhp</p>
