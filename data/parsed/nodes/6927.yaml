    date: 2004-12-12T12:41:00
    date_raw: 12 Dec 2004 — 12:41pm
    votes: null
    html: "<p>I'm pulling a Frankenstein here. I got some great advice the first time around, but ultimately they were looking less in the \"baseball\" direction. <br> <br>Actually, the first question I'm going to ask is more of a philosophical one: How do I convince them to go with something that I know is good over something that I know is bad? I'm not a professional designer, and I don't have any formal design education, but I can more or less tell the difference between good and bad. A few people on the team have their own ideas, but quite honestly they suck. Even if the ideas were good, they wouldn't have the technical skill to execute them properly. <br> <br>What method do you use to deal with a client who apparently doesn't know what's good for themselves? I'm only the \"expert\" in this situation by default, but still... <br> <br>Anyway, here is the new direction I'm trying to go. I'm actually really pleased with this idea. I think it's recognizable but still contains familiar references. I wanted something angular and geometric looking (see bottom), but still balanced. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/55816.gif\" alt=\"\"> <br> <br>Here it is Photoshopped onto a jersey. I think it works better with a light logo on a dark background: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/55817.gif\" alt=\"\"> <br> <br>I think my teammates really like the identity of another Ultimate tema, and are using that as kind of a mental starting point. Here it is for reference. This trucker hat was the best example I could find, but you get the idea. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/55818.jpg\" alt=\"\"> <br> <br>Thanks again for the great critiques.</p>"
    html_clean: "<p>I'm pulling a Frankenstein here. I got some great advice the first time around, but ultimately they were looking less in the \"baseball\" direction. <br> <br>Actually, the first question I'm going to ask is more of a philosophical one: How do I convince them to go with something that I know is good over something that I know is bad? I'm not a professional designer, and I don't have any formal design education, but I can more or less tell the difference between good and bad. A few people on the team have their own ideas, but quite honestly they suck. Even if the ideas were good, they wouldn't have the technical skill to execute them properly. <br> <br>What method do you use to deal with a client who apparently doesn't know what's good for themselves? I'm only the \"expert\" in this situation by default, but still... <br> <br>Anyway, here is the new direction I'm trying to go. I'm actually really pleased with this idea. I think it's recognizable but still contains familiar references. I wanted something angular and geometric looking (see bottom), but still balanced. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/55816.gif\" alt=\"\"> <br> <br>Here it is Photoshopped onto a jersey. I think it works better with a light logo on a dark background: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/55817.gif\" alt=\"\"> <br> <br>I think my teammates really like the identity of another Ultimate tema, and are using that as kind of a mental starting point. Here it is for reference. This trucker hat was the best example I could find, but you get the idea. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/55818.jpg\" alt=\"\"> <br> <br>Thanks again for the great critiques.</p>"
  - id: 48297
    user: 2933
    date: 2004-12-13T06:25:00
    date_raw: 13 Dec 2004 — 6:25am
