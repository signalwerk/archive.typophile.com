    html: <p>I'm not a particularly fast worker, so I'm having a bit of trouble keeping pace with all the suggestions that I really want to try out now. I very much appreciate all of the generous feedback. <br> <br>I liked the idea of making the counter into a bevo shape, so here's a rough rendering of that. I'd also like to play around with David, Scott, and Dana's suggestions. <br> <br>Also, I forgot to mention that the primary application of this mark is screen-printing on dri-fit jerseys. <br> <br><img src="http://www.typophile.com/forums/messages/29/50227.jpg" alt=""> <br> <br>The effect as I have rendered it is kind of jarring. I probably need to make it cut into the stroke width a good deal less, but this is the digi equivalent of rough sketch.</p>
