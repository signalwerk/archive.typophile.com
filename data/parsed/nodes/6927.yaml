  html: <p>I don't mean to be an opportunist. I actually read everything on these boards, but rarely post due to my own lack of experience. The critiques here are great, though. <br> <br>This is a personal project for my Ultimate Disc team. I don't know how many of you will know what <a href="http://www.upa.org">Ultimate</a> is, but it's an intensely competitive sport  that plays kind of like a mixture of soccer and football (or football and football, I suppose). <br> <br>This is the official <a href="http://www.utexas.edu">University of Texas</a> team, which is where the <a href="http://www.utexas.edu/visualguidelines/vg_colors.html">colors</a> and the <a href="http://www.utexas.edu/visualguidelines/vg_longhorn.html">Longhorn mark</a> are taken from. <br> <br>Handlettered and traced from scan. <br> <br><img src="http://www.typophile.com/forums/messages/29/50126.jpg" alt=""></p>
  html_clean: <p>I don't mean to be an opportunist. I actually read everything on these boards, but rarely post due to my own lack of experience. The critiques here are great, though. <br> <br>This is a personal project for my Ultimate Disc team. I don't know how many of you will know what <a href="http://www.upa.org" class="link-external">Ultimate</a> is, but it's an intensely competitive sport  that plays kind of like a mixture of soccer and football (or football and football, I suppose). <br> <br>This is the official <a href="http://www.utexas.edu" class="link-external">University of Texas</a> team, which is where the <a href="http://www.utexas.edu/visualguidelines/vg_colors.html" class="link-external">colors</a> and the <a href="http://www.utexas.edu/visualguidelines/vg_longhorn.html" class="link-external">Longhorn mark</a> are taken from. <br> <br>Handlettered and traced from scan. <br> <br><img src="http://www.typophile.com/forums/messages/29/50126.jpg" alt=""></p>
