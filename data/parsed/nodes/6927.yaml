    html: "<p>I really enjoyed your original solution, though I did think it needed some angles to make it look \"tuff.\"  <br> <br>This looks like a bovine snowflake, or maybe that's my up-coming colorado ski trip talking. I think the light on dark is not very aggressive, and I think that your original looked like a sports team, not just baseball, but with some angles it would have been good for football, or in this case, ultimate.  <br> <br>Let's talk lame clients. I always find it's good to take a back seat when fielding complaints, lying in wait for the right time to go at it. Let them air out all grievences and worries, there will be a lot. If your solution is the right one, you can tackle each complaint and catagorically prove your rightness. <br> <br>Let's try it! <br>Lame Client (or teammate)  \"I don't like orange\"  <br>Killer designer (you)            \"Well in this case orange references our teams connection to texas and it's wild west herritage, while remaining exciting and active, like the sport itself.\" <br>Client:                                 \"Sweet! I get it, I kinda like it.\" <br> <br>It migh take some work, but usually if you know what exactly is be hind the \"i don't like that, i like this\" then you can explain why your solution is good. They like the simple mark? Tell them it's old skewl and simple, but doesn't say who they are! The tuff mark is old skewl and simple, and with some angles (just an idea) would not only say \"we rock\" but also \"we're team tuff, and don't you forget it! suckas!\" <br> <br>Ok I really ought to be practicing instead of preaching! <br> <br>Happy monday! <br> <br> <br>Aaron</p>"
