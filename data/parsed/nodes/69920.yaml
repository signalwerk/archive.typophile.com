    <p>This font was inspired by Lviv ArtDeco architecture dominating in 1920s-30s.<br>
    This collection of ornaments is a graphic representation of building decorative elements. Mostly of metal tracery elements and wall bas-relief.<br>
    This font can be used for the variety of purposes, in graphic design as well as in industrial design.</p>
