    html: '<p>Scangraphic out of business? Could have fooled me… <br><br><a href="http://www.scangraphic.de/sc-about-fonts.htm" target="_blank">http://www.scangraphic.de/sc-about-fonts.htm</a> <br><br>FontHaus also sells <span class="caps">SG</span> fonts: <br><a href="http://www.fonthaus.com/products/fonts/FontFind.cfm?Function=Supplier&amp;Search=Scangraphic" target="_blank">http://www.fonthaus.com/products/fonts/FontFind.cfm?Function=Supplier&amp;Search=Scangraphic</a> <br><br>But I can’t ﬁnd Avant Garde in there.&nbsp;:-( FontHaus does, however, have Elsner <span class="amp">&amp;</span> Flake’s strange monospaced version. <br><br>The Avant Garde alts were also part of Linotype’s <span class="caps">GX</span> Font Collection, released back in the early 90s. It had such other oddities as “schoolbook letters” for Times, Helvetica, and New Century Schoolbook, all the swashes for Bookman, swash caps for Palatino (not the originals, but rather Ariadne, which has often been paired with Palatino’s and others’ lowercase italics) and the swash alternates for Zapf Chancery Medium Italic. <br><br>You might be able to call Linotype and see if they have any extras left that they would be willing to sell you. You can only get to the <span class="caps">GX</span> features through <span class="caps">GX</span> apps like UniQorn and LightningDraw, or one-by-one through the InDesign glyph palette. <span class="caps">GX</span> features do not work automatically in InDesign like OpenType features. <br><br>Good luck in your quest, <br>—John <br><br><span class="caps">P.S.</span> <br><span class="caps">RSP99</span> wrote: <i>Try in “The Pirate’s Den”&nbsp;… </i></p>'
