    html: "<p><i>If something (anything) I had created had fallen out of publishing then I would want people to be able to get it somewhere. <br> <br>Those forums are as much a way to keep forgotten works alive as they are anything.</i> <br> <br>But what if you preferred that something be forgotten? What if you decided to deliberately withdraw something from circulation because you were dissatisfied with it? Would you still be happy to see people trading it on newsgroup forums? <br> <br>This is not a hypothetical question. The early Tiro Typeworks Type 1 retail fonts have all been withdrawn from circulation, a process that took some effort to cancel contracts etc. We did this because some of the types were going to be revised and rereleased in OpenType format, while others we were unhappy with and wanted to retire. The fact that trading those old fonts on newsgroups doesn't financially harm me is irrelevant: the fonts are my intellectual property and I have the right to say when, how and if they are distributed.</p>"
    html_clean: "<p><i>If something (anything) I had created had fallen out of publishing then I would want people to be able to get it somewhere. <br> <br>Those forums are as much a way to keep forgotten works alive as they are anything.</i> <br> <br>But what if you preferred that something be forgotten? What if you decided to deliberately withdraw something from circulation because you were dissatisfied with it? Would you still be happy to see people trading it on newsgroup forums? <br> <br>This is not a hypothetical question. The early Tiro Typeworks Type 1 retail fonts have all been withdrawn from circulation, a process that took some effort to cancel contracts etc. We did this because some of the types were going to be revised and rereleased in OpenType format, while others we were unhappy with and wanted to retire. The fact that trading those old fonts on newsgroups doesn't financially harm me is irrelevant: the fonts are my intellectual property and I have the right to say when, how and if they are distributed.</p>"
