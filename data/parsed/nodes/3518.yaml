  - id: 141132
    user: 851
    date: 2002-10-16T19:26:00
    date_raw: 16 Oct 2002 — 7:26pm
    votes: null
    html: "<p>Scangraphic out of business? Could have fooled me... <br> <br><a href=\"http://www.scangraphic.de/sc-about-fonts.htm\" target=\"_blank\">http://www.scangraphic.de/sc-about-fonts.htm</a> <br> <br>FontHaus also sells SG fonts: <br><a href=\"http://www.fonthaus.com/products/fonts/FontFind.cfm?Function=Supplier&amp;Search=Scangraphic\" target=\"_blank\">http://www.fonthaus.com/products/fonts/FontFind.cfm?Function=Supplier&amp;Search=Scangraphic</a> <br> <br>But I can't find Avant Garde in there. :-( FontHaus does, however, have Elsner &amp; Flake's strange monospaced version. <br> <br>The Avant Garde alts were also part of Linotype's GX Font Collection, released back in the early 90s. It had such other oddities as \"schoolbook letters\" for Times, Helvetica, and New Century Schoolbook, all the swashes for Bookman, swash caps for Palatino (not the originals, but rather Ariadne, which has often been paired with Palatino's and others' lowercase italics) and the swash alternates for Zapf Chancery Medium Italic. <br> <br>You might be able to call Linotype and see if they have any extras left that they would be willing to sell you. You can only get to the GX features through GX apps like UniQorn and LightningDraw, or one-by-one through the InDesign glyph palette. GX features do not work automatically in InDesign like OpenType features. <br> <br>Good luck in your quest, <br>--John <br> <br>P.S.  <br>RSP99 wrote: <i>Try in \"The Pirate's Den\" ... </i></p>"
