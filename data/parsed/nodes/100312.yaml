    html: |-
      <p>I write form home &amp; work at work, so I may get this backwards...</p>
      <p>For Fontlab: if your target file is set to Unicode, and your copy (from file) is set to Names, then if you copy and paste to the correct Unicode position in the target file, everything works  fine.</p>
