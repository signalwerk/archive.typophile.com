      <blockquote><p>The serif is placed on the position, where it is logical to fill empty spaces</p></blockquote>
      <p>It's wonderful to see such non-chirographic thinking! Keep it up, and don't let old-fashioned people discourage you.</p>
      <p>However, in terms of "filling space":<br>
      - It's only part of what serifs do (and to me not a central part).<br>
      - Is that really what/all you're doing? Looking at the "w", there must be more.</p>
      <p>BTW, you might like to analyze (but not imitate) Rotis Semi-Serif, since Aicher was also interested in leveraging serifs functionally, and not according to their circumstantial origins.</p>
      <p>hhp</p>
