    html: |-
      <p>Thanks. I am actually planing to finish it, because it looks nearly refined to me.<br>
      But I posted it to this forum, if there are some fatal/minor adjustments to be made...</p>
      <p>It actually started as project how to make rotis semi serif "better", or inspired by.</p>
      <p>Yes, the function of the serif is not filling the space. I just change their function for my purposes, and I am trying to keep serifs on baseline to have more "consistent baseline" than in some other semi-serif fonts (rotis and themix).</p>
      <p>I was mostly curious how people will read the small texts in the pdf attachment. Some people I showed them samples, at first they were very surprised and claim it very disturbing. After some time, they adapted and they don't see them. Usually new type of type need a time to "became" readable to our eyes. But some of them still have a problem after time :)</p>
