    html: |-
      <p>Getting useful feedback is a classic paradox, especially for a text face. The people who can potentially give you some great advice -type designers- are tainted by having their own ideas of how it should be done*; this is pretty much a death trap for something that tries to innovate. And the people who can give you the <em>best</em> advice -actual readers- cannot do so explicitly; you're not supposed to point out anything at all to them - certainly not that the font is trying to innovate...</p>
      <p>* And creative people are not good at putting themselves in other people's shoes.</p>
      <p>So you have to listen to everybody with an open mind, but see clearly what's in your own mind, and follow that. And this is what makes me hesitate to give you more advice, at least in terms of where to [not] put serifs. One thing I will opine though is that the weight difference between the Regular and Bold is too great*. I think your Regular is only slightly light, so I might recommend keeping that as is and making a Bold that's less dark.</p>
      <p>* Coming back to Aicher, I guess you don't agree with his philosophy for a Bold. I myself actually do.</p>
      <p>BTW, you might want to look at Swagg, although it's not hugely relevant.<br>
      <a href="http://typographica.org/typeface-reviews/swagg/" title="http://typographica.org/typeface-reviews/swagg/">http://typographica.org/typeface-reviews/swagg/</a></p>
      <p>hhp</p>
