    <p>Hello people!<br>
    I am 99% finished with the Preto Sans and Preto Serif family. Now I am working on Preto Semi.</p>
    <p>It is an experimental text type, where I am working with serif, changing their function and trying to create a "better sans with some contrast". The serif is placed on the position, where it is logical to fill empty spaces (making the color of the text more even), or when the thin lines need serif to balance contrast, or serifs are placed on end strokes.</p>
    <p>Look at the pdf in the attachment.</p>
    <p>What do you think of it?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/preto-semi-typophile_6600.png"></div><p></p>
