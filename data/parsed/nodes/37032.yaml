    <p></p><div class="imageWrap"><img src="/web/20080828032945im_/http://www.typophile.com/files/typotrip_4478.jpg"></div><p></p>
    <p>_<br>
    <strong>TypoTrip</strong> is a collection of strange, worn-down, outdated, intriguing, self-made, out-of-place or interesting letters from all over the world.<br>
    Also improvised signs, coincidental designs and random messages, eroded forms, outdated design trends and letters that have seen a better day. </p>
    <p>Take a look or contribute to: <strong><a class="freelinking-external" href="https://web.archive.org/web/20080828032945/http://typotrip.wordpress.com/">typotrip.wordpress.com</a></strong></p>
    <p>Enjoy your visit!</p>
    <p>Wojtek Mejor</p>
    <p>p.s.<br>
    Please feel free to share your thoughts about the web - I’m curious to know.</p>
