      <p>When I heard of this lawsuit, at first I was puzzled. You buy a font for one computer. You print something on that computer. Then you make millions of copies of what you've printed on an offset press, or take your image with letters on it, and put it into an animation... and none of those later actions violate the license to the font. You only need a license to the font on the one computer and printer combination that converts the text to the graphic image of the letter.</p>
      <p>But it is being alleged by the plaintiff that NBC used those fonts on more than one computer. And this is not an unreasonable suspicion if they were used in a wide variety of advertising materials that would likely have been prepared by different people working in different offices. Plus, lawsuits only require a balance of probability, not proof beyond a reasonable doubt.</p>
    html_clean: |-
