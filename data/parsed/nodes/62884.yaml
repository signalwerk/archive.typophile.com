      <p>I don't know how much distinct promotional material NBC has, so my hypothesis may well be untenable. Nor do I suggest they should get away with it if they are guilty.</p>
      <p>But this one computer could be just used to set the appropriate text into type, while other aspects of the creative design - turning a line of text into a colorful logo - take place on other computers.</p>
      <p>So my point is merely that to eliminate possibilities like that, one needs more than "oh, my, they run these logos all the time". How much typesetting with this font actually took place, not how often we see it, is what matters.</p>
      <p>Of course, if we're talking about a lot of printed material too, it may also be that printed material was done with copies of the font in question at the printing shop... since sending the printer a PDF with an embedded font might not be allowed by the font license.</p>
