      <p>I just ran accross a link at Ascender's blog to this post:</p>
      <p><a href="http://www.graphicartsonline.com/blog/Premedia_Trends_Sponsored_By_Epson/23764-Jaywalking_on_fonts.php" rel="nofollow">Jaywalking On Fonts</a></p>
      <p>By some guy named Brian Lawler who I hope, for everyone's sake, is never allowed to sit on a jury.<br>
