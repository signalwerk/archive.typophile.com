      <p>Richard, I found you attack on Brian's article a lot more offensive than the article itself.</p>
      <p>Yes, the opening sentence seems to assume guilt. But the entire rest of the body of the article is really about the broader issues of font piracy and how hard it is to make a living as a type designer. Not much to complain about there.</p>
      <p><cite>Does he question the reasoning behind NBC owing anything more, even if found liable, than the difference between the license they purchased and the license Font Bureau says they should have purchased?</cite></p>
      <p>Why should he question it? US law provides that a copyright holder may opt for either actual damages *or* statutory damages. So on the copyright claims, if NBC is found to have infringed, it is possible Font Bureau could get quite a bit more in damages than just the amount NBC failed to pay. Plus, not all of the claims were based on copyright, so there are other factors.</p>
      <p>You're spending a lot of time on web fonts and related areas. Try spending a day reading up on copyright law. It's fascinating stuff, and not all of it is obvious or self-evident.</p>
      <p>Cheers,</p>
      <p>T</p>
