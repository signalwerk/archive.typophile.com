      <p><em>The idea of a license, a “right to use” is predicated on copyright.</em></p>
      <p>The fact that B is predicated on A does not mean that A is at issue whenever B is at issue. Licensing law is fundamentally contract law; specific types of contracts may be predicated on intellectual property law, but that does not imply that lawsuits regarding such contracts are intellectual property suits. I don't believe that the copyrightability of fonts as computer programs under US law is at issue in this licensing case.</p>
      <p>But I'm not a lawyer. And you're not a lawyer. If you'll excuse me, I have to go stare down a herd of buffalo now. It's a Canadian Thanksgiving tradition.</p>
