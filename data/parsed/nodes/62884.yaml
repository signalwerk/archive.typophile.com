      <p>Anyway, Frank Martinez (who I met at Typecon) has a website where there is interesting stuff germaine to this topic to be read:<br>
      <a href="http://www.martinezgroup.com/litigation.html" rel="nofollow">The Martinez Group - Litigation</a><br>
      I've also been reading some Atypi presentations and all kinds of stuff with an eye to the possible legal consequences of using for-pay web fonts.</p>
      <p>Anyway, I'm not understanding you on this at all.<br>
      How can there be a license to use something unless there is, presumably, a right on the part of the licensor that remains attached even after the item is transferred?<br>
      You say I'm buying the "right to use" the thing. OK, understood.<br>
      But if the thing is not protected in the first place, there is no "right to use" to be obtained in the first place. The idea of a license, a "right to use" is predicated on copyright.<br>
      Sorry, sometimes I'm thick, but what you seem to be saying is that anything can be licensed, and the license can be enforced, even if the licensor has no claim on the item after transfer.<br>
      To use the analogy one more time: you seem to be saying that if I buy an egg from you under the terms of a contract that says I'm only to eat it hard-boiled but, dammit, you've got pictures of me eating it scrambled, that you can claim damages because it's going to be harder to license more eggs to other clients in the future. (As the Font Bureau's complaint puts it. But no eggs, of course.)<br>
      The only problem with this is that you never had any rights to the egg in the first place because it was just an egg, so that leaves you with only breach of contract and what damages could you legitimately claim?<br>
      I don't call up Herman Miller to license a chair. I don't go to the local Honda dealership to license a car.<br>
      After I've purchased those things I can do what I want with them, period. I own them lock, stock, and barrel.<br>
      Licensing a "right to use" the font software is dependent upon the font software being protected IP. Otherwise, there may be a nonsensical contract, but there is no license.<br>
