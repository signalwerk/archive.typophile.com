      <p>Rich: <em>My feeling is that from the day of that purchase onward they were being stalked for any sign that the basic license had been exceeded.</em></p>
      <p>Your ‘feeling’ is erroneous.</p>
      <p>We're talking about very high profile font use: fonts used in a television season branding campaign by a major media corporation. When fonts are used in such a high profile way, I think it is sensible for foundries to check their license sales logs. The fonts are contributing massive added value to the media corporations campaign, and should be properly licensed and paid for. Further, as explained during the web fonts discussions, much of the value in fonts, for the professional designers who are the principle market for font licensing, resides in real, partial or perceived exclusivity. If major TV network ‘A’ are using specific fonts in their season branding, other networks will want to avoid using the same fonts so that their own branding is not diluted. So high profile font use by one major customer diminishes the likelihood of licensing by other customers in the same business or marketplace. Hence the basis of potential damages. If NBC had properly licensed the fonts to use them in the ways in which they intended to use them, they would have reasonably compensated Font Bureau for the likely loss of other sales.</p>
