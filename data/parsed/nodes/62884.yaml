      <p>&gt;I don’t call up Herman Miller to license a chair. I don’t go to the local Honda dealership to license a car.</p>
      <p>Take a look at <a class="freelinking external" href="http://www.copyright.gov/title17/92chap1.html#106" rel="nofollow">Title 17 § 106</a>. The idea is that as the owner of a copyright, one has exclusive rights to do a few things with that copyrighted work. Generally one can sell or conditionally license these rights. Similarly, if you don’t own a copyright to a particular work, and you wish to do any of the things to which the owner of the copyright holds exclusive rights (again, generally) you have to negotiate with the owner to do those things. </p>
      <p>Seriously. Bravo, Font Bureau.</p>
