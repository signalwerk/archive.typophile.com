    html: |-
      <p>Rich, what is being licensed is not a right to IP, but a right to use the font software, so I really don't see how IP is at all relevant. When I license Adobe InDesign, I'm not licensing the IP -- that is, I am not purchasing the right to reuse of Adobe copyrighted code or patented techniques --, I'm just purchasing the right to use the software for the purposes and in the ways permitted by the license agreement. Same with fonts.</p>
      <p>That said, the USCO has explicitly recognised that fonts are may be copyrighted as computer programs, and the summary judgement in the Adobe vs. SSi case confirmed that this pertains also to the outlines, so even if this were an IP case I don't think there would be any question of the eligibility of the fonts to protection.</p>
      <p><em>Do they do Columbus Day in Canada.</em></p>
      <p>No. It's our Thanksgiving weekend up here, an end-of-harvest festival.</p>
      <p>By the way, it's Frank Martinez, not Herb Martinez.</p>
