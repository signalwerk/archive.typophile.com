      <p>"quadribloc, I believe all software is licensed and charged by the number of computers, and when fonts became software, they started charging the same way. It may not make a lot of sense otherwise, but surely NBC is aware of the terms of the license. If you buy any font over the internet, there is almost always—and certainly at FontBureau.com—a choice of how many computers you are licensing the font for, with the price adjusted accordingly. This information is not a detail buried in a long EULA, but right in the buyer’s face as part of the buying process."</p>
      <p>I didn't think I put anything contradicting that in my post.</p>
      <p>Instead, I noted that the widespread use of the font in NBC's promotional materials is not necessarily evidence of a single-user EULA being violated.</p>
      <p>If, on one computer, I type the phrase "The More You Know", and with my copy of that font on the computer, produce an image of those words set in that font - then I need to have that font licensed on that computer.</p>
      <p>If I then take that image, the translation from individual letters to the printed page having been performed on the first computer, and do coloring, 3D-shading, and rendering into an animation of that image on a render farm of a thousand other computers - not <strong>one</strong> of those computers needs to have a copy of that font installed on it. None of them are doing any typesetting, they're only doing image processing.</p>
      <p>So the test to determine whether the font has been pirated isn't how widespread logos using that font are - but how many different texts they contain.</p>
      <p>Otherwise, it's like saying that since a book set in Caledonia had a print run of 30,000 copies, the publisher must have had 30,000 Linotype machines with Caledonia matrices.</p>
      <p>If that font is important to NBC's corporate identity, it could be there is only one copy of that font in the company, in one computer in a closely guarded room - to make sure that unauthorized employees in NBC do not create official-looking materials without authorization.</p>
    html_clean: |-
