      <p>Rich, my impression is that lawyers can and on occasion will use any argument to win their case, whether it is legitimate or not, consistent or not. Thus NBC could try to challenge whether Font Bureau owns any rights to the fonts, and hence whether their EULA is a legally binding contract. </p>
      <p>But then NBC would in effect be challenging whether any software EULA for fonts is valid. In light of SSI vs Abobe, I doubt they would be successful, and hence probably NBC won't try this strategy. I am just guessing, as I have no training in law.</p>
      <p>Because SSI vs Adobe established protection of fonts as software, and undoubtedly software was licensed from Font Bureau and used by NBC, I don't think that an argument about the originality of these particular fonts as designs would be relevant, as they would pass the test of SSI for original software. Again, lawyers can try any argument, but I don't see how it would work before a judge. </p>
      <p>Also re-litigating SSI vs Adobe would likely be an expensive matter for NBC to do, which they would want to do only if they were concerned to establish a principle important to their business. And I don't see how this is. To put this into perspective, according to one figure I just found it costs 3 million dollars to produce one hour of a sitcom. In contrast, paying for new fonts each year will be a tiny fraction of that.</p>
