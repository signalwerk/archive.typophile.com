    html: |-
      <p>@zara evens</p>
      <p>Thank you so much for posting this. Awesome indeed, but to me for different reasons, I suspect. I've been reading the complaint and looking at the exhibits - all of it available via Scribd links in the article. (Ya gotta love the web.)<br>
      I now doubly hope this goes to a decision and not a settlement because then there will be an extensive transcript, too.</p>
      <p>Two facts stand out to me so far:</p>
      <p>1) The three fonts Font Bureau is claiming to have been infringed are "Bureau Grotesque", "Antenna", and "Interstate".<br>
      I am now deeply interested to what degree those fonts can be considered "original expression".<br>
      I would imagine this would also be one line of defense for NBC.</p>
      <p>2) The invoice to NBC for those fonts (bought online) is being used as prima facia evidence that NBC both obtained (paid for it, certainly) and used (presumably) those fonts in violation - or so plaintiff says - of Font Bureau's EULA.<br>
      I'm sure it will also be claimed that the invoice amounts to a tacit acknowledgment by NBC that said fonts are, indeed, copyrightable and that the license terms are, therefore, legit.</p>
      <p>But since there are so many typefaces nearly identical in design, and the designers at a behemoth like NBC would surely experiment with many different fonts before making a decision, how is it going to be ascertained that NBC did, indeed, use these three exact fonts?</p>
      <p>Fascinating.</p>
      <p>The simple truth is that any font designer can bring a suit claiming infringement against anyone and do so relatively cheaply. But defending against it can be very expensive no matter how off-the-mark it may be.<br>
      However, if the basis of the complaint is just a similarity in <em>look</em>, it's a rather thin argument. Bolstering it with a documented purchase, however, much stronger.</p>
      <p>Unfortunately, for some, the lesson here might be to think twice before buying <strong>any</strong> commercial font.</p>
      <p>This isn't a football game where one roots for one or the other "side". There's always two sides and real-world consequences.</p>
      <p>Awesome.</p>
