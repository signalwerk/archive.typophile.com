      <p><em>"this is a software licensing suit, not a typeface intellectual property suit."</em></p>
      <p>I <em>think</em> I understand what you mean by this. But one line of defense is always that said property was not eligible, as IP, for licensing at all. (In patent suits, invalidating the patent is always the surest - and sometimes the easiest - way to go but whether that line is available here, I have no idea.)<br>
