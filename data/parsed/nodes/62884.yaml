      <p>I have no illusions. A quick settlement is what is being sought and what will, probably, be gotten.<br>
      Prolonged litigation is fabulously expensive.<br>
      On the Martinez group's web site (link to the litigation page is in a previous comment), it's made clear that settlement is the aim.</p>
      <p>Disclaimer: I am not a lawyer. The following is nothing more than opinion and reportage of the legal precautions and calculations that take place in the world.</p>
      <p>To continue, Bill:<br>
      Where NBC screwed up is in buying the font online using a NBC credit card or somesuch. It proves access and gives the complaint legs. It's much more difficult to prove access without it. It's the last time NBC will be doing that, I assume.<br>
      And it would not surprise me if this ran counter to existing policies within NBC.<br>
      Businesses with deep-pockets are constantly sued. Some suits are legit, some concocted. But it's routine to create barriers to potential liability such as using shell entities to conduct business, etc., to provide a shield.<br>
      For example, if the design department were to be spun off as a single-client entity - a business of it's own - it would be much more difficult to drag NBC into the fray.<br>
      And the bells that went off at Font Bureau when NBC purchased those fonts would not have rung, most probably.<br>
      My feeling is that from the day of that purchase onward they were being stalked for any sign that the basic license had been exceeded. I do not know if Font Bureau's claim is true or not. But the whole idea of a purchase triggering a surveillance of sorts, I find a little creepy. I mean, do <em>you</em> think someone at FB just woke up one day and said, "Hey! There's our fonts on Jay Leno!"<br>
      Instead of NBC it could be me or you or anybody, really.<br>
      I recently bought a particular weight of Kent Lew's font "Whitman" from the Font Bureau. And it gives me pause.<br>
      (Well, more than pause, but another time and place, not here.)<br>
      Anyway, perhaps because so much of NBC's core business is copyright related, it simply isn't (or wasn't) worth the confusion for them to take these precautions, who knows.</p>
      <p>The world we live in. Interesting (and sometimes troubling) times.</p>
