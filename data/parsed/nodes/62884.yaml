      <p>Richard, Brian, not being on a jury, is not required to presume innocence. I do agree that his first sentence should have been a 'what if', rather than a presumption of guilt. (He does conclude with a 'what if'.) But what exactly is mistaken in the rest of the article? I find it hard to believe that Steve Matteson did 4000 kerns in a sitting, but aside from that it seems pretty accurate, though I admit I didn't read it with great care. </p>
      <p>As to the "chilling effect", doesn't this argument apply to all software sales? Will people stop buying software if some software manufacturers sue when large public companies violate the EULAs by distributing all over their company a piece of software licensed for only one computer? </p>
      <p>By the way do you have no concern for the huge losses due to use of unlicensed fonts? Should foundries and developers of fonts always just shrug and let themselves--ourselves--be robbed? I am not, I should emphasize, presuming the outcome of this case. But let us suppose for the moment that Font Bureau is completely right, and NBC completely in the wrong. If that were the case, do you still think Font Bureau should do nothing? </p>
      <p>quadribloc, I believe all software is licensed and charged by the number of computers, and when fonts became software, they started charging the same way. It may not make a lot of sense otherwise, but surely NBC is aware of the terms of the license. If you buy any font over the internet, there is almost always--and certainly at FontBureau.com--a choice of how many computers you are licensing the font for, with the price adjusted accordingly. This information is not a detail buried in a long EULA, but right in the buyer's face as part of the buying process.</p>
