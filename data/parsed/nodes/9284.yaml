    html: |-
      <p>I'm thinking that the near-future proliferation of advanced reading pads (like the iPad) will make the Th ligature an INDIVIDUAL READER option. Each reader will get to choose what ligatures he or she likes or doesn't like.</p>
      <p>And the social network will make the total sum of the reader preferences available for all to see.</p>
      <p>Some book designers, typesetters, and type designers might get their feelings hurt.</p>
