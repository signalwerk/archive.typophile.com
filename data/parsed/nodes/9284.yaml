  html: <p>Greetings! <br> <br>I'm new to this forum so be gentle!  I'm wondering what the general feeling is about the 'Th' ligature in body text.  It seems that many of the Adobe OpenType fonts (WarnockPro, Jenson, etc.) have this ligature, and I'm not convinced it's easier to read. <br> <br>Is this a "feature" for the sake of a feature, or are there appropriate (and inappropriate) place for this ligature? <br> <br>Thanks! <br> <br>Chris Swingley <br>University of Alaska Fairbanks</p>
