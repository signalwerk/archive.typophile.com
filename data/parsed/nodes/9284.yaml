    html: <p>Personally, I like it. I think it can get more even spacing for the Th - depending on the other features of the font. I was interested to hear at Typotechnica, though, that Adobe gets a lot of complaints about the default Th ligature.</p>
    html_clean: <p>Personally, I like it. I think it can get more even spacing for the Th - depending on the other features of the font. I was interested to hear at Typotechnica, though, that Adobe gets a lot of complaints about the default Th ligature.</p>
  - id: 60079
