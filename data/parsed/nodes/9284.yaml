    date: 2005-02-24T19:33:00
    date_raw: 24 Feb 2005 — 7:33pm
    votes: null
    html: <p>William, <br> <br>I can imagine the complaints they get because I thought it was a defect at first (I'm using TeX, and sometimes the translation of formats results in things like this), but when InDesign did it too I realized it was the way the font was designed. <br> <br>Thanks for your opinion.  I've been keeping my eye out for it in print and haven't seen it yet, but it does seem almost a natural ligature given how much white space results around the T without it. <br> <br>Thanks, <br> <br>Chris Swingley <br>University of Alaska Fairbanks</p>
