    html: |-
      <p>I like the idea and the background pattern, also the gradient.<br>
      Maybe the grey border is distracting, if it’s not part of the design try a white one, the colours may seem  less intense.<br>
      I agree with riccard0 about the main type. It’s too heavy and/or the contrast is too harsh.</p>
      <p>In print, silver would look great, at least for ‘creativity’ and ‘currency’. Or even a hologram/kinegram ;)<br>
      But maybe lightening up your charcoal and a lighter weight would do.</p>
      <p>For further (banknote) inspiration see also <a href="http://www.bank-note.ru/security.html" title="http://www.bank-note.ru/security.html">http://www.bank-note.ru/security.html</a></p>
