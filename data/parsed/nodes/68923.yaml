    <p>Hello, I was hoping I could get some comments and criticism on this item. It's a postcard being sent out as an invitation to my portfolio show, and I am hoping to develop 2 or 3 full size posters further developing the idea of creativity as a currency. Any and all comments welcome!</p>
    <p><a href="http://img522.imageshack.us/img522/9742/creativecurrency.png" title="http://img522.imageshack.us/img522/9742/creativecurrency.png">http://img522.imageshack.us/img522/9742/creativecurrency.png</a></p>
