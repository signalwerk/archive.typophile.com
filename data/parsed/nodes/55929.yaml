      <p>Yes there's a bug, but the Discretionary Ligatures are getting kerned on the right side. Just look at this other example:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/dlig_kerning2_5342.png"></div><p></p>
      <p>The overlay clearly shows that there's the same amount of kerning between 'pV' and 's_pV'.</p>
      <p>The bug is that the kerning value is being incorrectly displayed as zero in the UI.</p>
