    html: |-
      <p>Plus, it helps to structure the inner whitespace. This way, you can have a larger (wider) O that doesn’t look out of place when standing next to darker, denser letters like M.<br>
      A dot would serve the same purpose, see for example Barnbrook’s <a href="http://www.emigre.com/EF.php?fid=104">Mason</a>, or Tiemann’s <a href="http://new.myfonts.com/fonts/canadatype/orpheus-pro/">Orpheus</a> (revived and extended by Canada Type). CastleType’s <a href="http://new.myfonts.com/fonts/castletype/goudy-trajan/regular/characters.html">Goudy Trajan</a> offers an alternate O with a cross in the counter.</p>
      <p>It might also be worth looking at the ‘O’s in blackletter typefaces, e.g. <a href="http://new.myfonts.com/fonts/ef/alte-schwabacher/">Alte Schwabacher</a>, <a href="http://new.myfonts.com/fonts/preusstype/fleischmann-gotisch-pt/">Fleischmann Gotisch</a>, <a href="http://new.myfonts.com/fonts/adobe/goudy-text/">Goudy Text</a>, <a href="http://new.myfonts.com/fonts/wiescherdesign/royal-bavarian/">Royal Bavarian</a>.</p>
