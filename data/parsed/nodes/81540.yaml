    html: |-
      <p>Plus, it helps to structure the inner whitespace. This way, you can have a larger (wider) O that doesn’t look out of place when standing next to darker, denser letters like M.<br>
      A dot would serve the same purpose, see for example Barnbrook’s <a href="http://www.emigre.com/EF.php?fid=104" rel="nofollow">Mason</a>, or Tiemann’s <a href="http://new.myfonts.com/fonts/canadatype/orpheus-pro/" rel="nofollow">Orpheus</a> (revived and extended by Canada Type). CastleType’s <a href="http://new.myfonts.com/fonts/castletype/goudy-trajan/regular/characters.html" rel="nofollow">Goudy Trajan</a> offers an alternate O with a cross in the counter.</p>
      <p>It might also be worth looking at the ‘O’s in blackletter typefaces, e.g. <a href="http://new.myfonts.com/fonts/ef/alte-schwabacher/" rel="nofollow">Alte Schwabacher</a>, <a href="http://new.myfonts.com/fonts/preusstype/fleischmann-gotisch-pt/" rel="nofollow">Fleischmann Gotisch</a>, <a href="http://new.myfonts.com/fonts/adobe/goudy-text/" rel="nofollow">Goudy Text</a>, <a href="http://new.myfonts.com/fonts/wiescherdesign/royal-bavarian/" rel="nofollow">Royal Bavarian</a>.</p>
