    html: <p>The form of phi – Φ – from the Greek alphabet is an historical antecedent for these English alternates. I don’t think it has much to do with the letter O, though.</p>
    html_clean: <p>The form of phi – Φ – from the Greek alphabet is an historical antecedent for these English alternates. I don’t think it has much to do with the letter O, though.</p>
