      <p>Sindre! Amazing. I'd need more time for a fuller crit. But just wanted to say I really like the color and proportions of the roman, its sturdy &amp; stable and yet friendly feel – it feels both harmonious ("reliable") and fresh I think. Quite exciting!<br>
      (I'm spontaneously very fond of the "k" and "J".)</p>
      <p>Regarding the italics, I don't know anywhere near enough about italics… so go find a saltmine ;-).  But just staring at these alphabets, my partly-educated eye wonders if your italic lowercase (so soft/brushy/playful!) is a bit separate from the rest of the family? It seems quite different from the roman in character; so I'd be curious to see it in text, especially to observe how roman &amp; italic work together.</p>
      <p>BTW, that's a funny asterisk. Reminds me of flesh-eating plants, or something from a 70s scifi movie. :-)</p>
