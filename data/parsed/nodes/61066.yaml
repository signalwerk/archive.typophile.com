    html: |-
      <p><cite>the Arabs added the zero</cite></p>
      <p>I think that's a myth. Babylonian mathematicians understood the concept of zero around 1500 BC, and used an open space to represent it. The Sumerians used three hooks to notate zero 800 years or so later, and I'm pretty sure the Indians used a round shape to write zero around 500, and that the Arabs learned it from the Persians a couple of hundred years or so later.</p>
    html_clean: |-
