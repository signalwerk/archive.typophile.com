    <p>Dear fellow typophiles,</p>
    <p>Criticising Ben Mitchell's great <a class="freelinking external" href="http://typophile.com/node/60805" rel="nofollow">Eternal Italic</a> made me realise how little knowledge I have of italics. For some reason, I've never been very fond of them. Even for calligraphy, I've always preferred upright romans. Probably something genetic. </p>
    <p>So I thought it was time to put a little ink to that white spot on my typographical mind map. (Not literally. All my typefaces start with mouse in hand and no clear idea. I've found that construction by improvisation is the best method for me.)</p>
    <p>So here is a rough draft of my first attempt at an italic. Simultaneously, I drew a roman companion, based on a few glyphs I made earlier this summer. Of course, I think the roman is vastly superior to the italic. I really need criticism and help. </p>
    <p>Although the roman is rather Didone in stress (but transitional in detail), I've made its italic with a slant of only 10 degrees, just to make things a little easier. (And I must say I find extreme italic slant rather unappealing.) The capitals are even more upright, at approximately seven degrees. They are also deliberately much less italicised than the lower case, I want them to work in all cap settings. Perhaps I'll make some alternate caps later.</p>
    <p>This definitely does not mean that I've abandoned work on <a class="freelinking external" href="http://typophile.com/node/59004" rel="nofollow">Ethos</a>. (But perhaps I've abandoned <a class="freelinking external" href="http://typophile.com/node/56025" rel="nofollow">Schola</a>. I don't know if I like it anymore.) I just need to do something else for a while. Drawing more than 3000 sans serif glyphs is a little ... tiring.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mondegreen1_5552.jpg"></div><p></p>
    <p>So please, I need your help on these two creations. They're both unpolished, and ready to go in new directions. The name is but a <a class="freelinking external" href="http://en.wikipedia.org/wiki/Mondegreen" rel="nofollow">joke</a>, but it's a nice name, I think.</p>
