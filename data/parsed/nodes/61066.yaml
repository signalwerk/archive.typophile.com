      <p>These uneducated eyes also share your doubts about the italic/roman relationship. One can possibly think of them as Lady and Lord Mondegreen, married to each other of political and economical reasons rather than of love. I need to work a lot on the spacing (and some basic kerning) before they can set a text together, but as soon as possible, I'll upload some text settings.</p>
