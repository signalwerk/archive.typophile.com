    html: |-
      <p>Thanks for asking, guys! Yes, I've made loads of variants and optical sizes and stuff, and even some titling alternates and indeed a Grotesque companion based on the base fonts' proportions. The whole project turned into Gargantuan proportions, really, while I started experienced rather severe exhaustion symptoms, as someone here at Typophile kindly pointed out. I think I got a serious type overdose. So I had to take a long break. Of course, I haven't stopped drawing type, but at some point I started thinking I have to reconsider most of my work. </p>
      <p>I started type drawing a little more than a year ago, and I found that I've learnt so much form drawing and redrawing and studying type that some or most of the work I did months ago just isn't up to standard anymore. So I've started over, in a way. Mondegreen will definitely survive in some form, as it is the first typeface I drew without emulating or quoting or even looking at anything else. But I have to lower my own ambition, one dilettante simply cannot take on the task of finishing a 20 font OpenType face with extensive language and script support, at least not when he has a family (well, sort of) and a full-time job and several musical projects on the side. </p>
      <p>At the moment, I'm redrawing and reviving Schola, and reducing it to something approximating manageability. (Roman and Italic. No Russian, no Greek, no friggin' Runes. But Central and Eastern European support, of course.) The 8 point cut will be finished in both styles first. Later, I will add 10 and 24 point cuts. Maybe.</p>
      <p>Then Mondegreen is up for revision. I now have no idea what to do with its grotesque and titling variants, and I seriously doubt I will develop all the planned optical sizes (8, 10, 12, 18 and 60 points) anywhere soon or even ever. </p>
      <p>Thanks for the interest, my friends! I feel ready to be a contributing Typophile again now, but perhaps a slightly less frantic one.</p>
      <p>Sindre</p>
