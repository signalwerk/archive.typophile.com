      <p>The A-half of AE (and the E-half of OE?) looks a little overwhelmed.</p>
      <p>Should the thinnest part of the bottom bowl of g be a tiny bit thinner? Does the spine of s get a tiny bit too dark?</p>
      <p>Is there too much bottom overshoot with v and w?</p>
      <p>Not an expert but I think your acute and grave placement could need adjustment - should the bottom of the accent be closer to the vertical centerline of the glyph? </p>
      <p>f-umlaut ligs are really great, but fí is not (partly because of the left-right placement I just mentioned). (fì, I would think, would sooner warrant a ligature...)</p>
