      <p><cite>So where is it written that “pure” italics don’t have terminals on “p” and “q”?</cite></p>
      <p>Ah, absolutely nowhere (that I'm aware of). What I meant, was that I don't want to introduce serifs unlike the other lower case terminal on these two descending glyphs only, just because that's the way it's normally done. I should never have used that adjective. </p>
      <p><cite>I do hope you make that decision based on whether the “f” works within this particular font</cite></p>
      <p>That's a piece of good advice. I realise I have a tendency to make things (not just typefaces) from the top to the bottom, by imposing strict or arbitrary rules on the matter, and then by force make it work (or convincing myself that it works). But then again, I think a "f" like this <em>could</em> work. Extensive text settings will answer that.</p>
      <p><cite>[...] did I really say something about the weight of the “z”?</cite></p>
      <p>You didn't. The sentence that led to your confusion should have read like this: <cite>I’ve also cut a notch in the top of the "a" stem</cite>. From now on, I'll take up your good practice of putting glyph names in quotes.</p>
      <p>I was very tired (blasted insomnia!) when I wrote those last two comments, and my accuracy level obviously rather appalling.</p>
