    html: |-
      <p>Oh my goodness!! </p>
      <p>First up. Thanks for the compliment! I'm thrilled my experimentation is so inspiring! Second. Don't give up on Schola. I was at a stage with Eternal where I'd gone off it for a bit, thinking it unresolveable as my first (bad) font. I just needed a rest from it, and making the italic after learning to see details gave me better ideas about proportions and density that I could retrofit back onto the roman.</p>
      <p>Thirdly, I am vastly impressed with this lovely (fast!) work! Your asterisk looks like a mischievous little alien, in a good way, it put a smile on my face :D</p>
      <p>We seem to have gotten ourselves a great little learners group going here! I'm finding it very exciting.</p>
      <p>This is terribly interesting! The shapes you've made are so nice. Traps, cupping, serifs, contrast all look really good. I like the way I'm not sure whether to resolve it as Clarendon, Baskerville or Georgia, lovely. </p>
      <p>I'll start with the roman uppercase.<br>
      A is very clever. I like the slight thorn on the top left, the trap in the counter and the crossbar.<br>
      C: I'm not sure if the lower serif works for me. Ask other people.<br>
      D: well done.<br>
      G: May need more weight on the stem.<br>
      J: That kind of taper makes me happy.<br>
      K, M, Q, R: Really neat shapes. In fact all the others are great too. Z may need bevelling on it's vertices.</p>
      <p>lowercase<br>
      h, k and m may be a bit wide, I'd need to see text to be sure.<br>
      r: heavier beak/bigger ball?<br>
      t: I don't understand its top.<br>
      y: can the tail be darker than the right arm? I think it looks a bit light below.<br>
      z: see Z.</p>
      <p>Italic<br>
      Caps<br>
      There's maybe some optical correction needed. For example the M has a darker downhill diagonal than the right side vertical, probably from slanting. Check the other downhill diagonals esp RSVWXY, I think they're a bit heavy.<br>
      Q and Z could be more exotic given the lowercase dynamism. Maybe K and R too?</p>
      <p>lowercase<br>
      Reminds me of Dolly, but somehow more classical looking. It's funny I was reading the other day that the italic should harmonise with the roman, but can be a cousin rather than a sibling...and I wondered how far that could be pushed. Eternal has only a few common elements between the roman and italic, and I think it's more in the balance between soft/hard than in the actual shapes that form the glyphs. Your roman and italic are quite distant cousins in structure, tone and stylistic influence, I would say, but I'm liking the contrast. I think the two could be reconciled, or perhaps developed into one of those families that has varying degrees of brushy-cursiveness instead of the normal roman/bold/italic branches*. I think it'd definitely be worth exploring a more upright italic. (Lord and Lady, Count and Countess?) </p>
      <p>*check out Émilie Rigaud's Coline typeface on the <a class="freelinking external" href="http://www.typefacedesign.org/2009/" rel="nofollow">Reading students' MA submissions</a> if you haven't already.</p>
      <p>I like the name Mondegreen!</p>
      <p>Keep up the great work :)</p>
