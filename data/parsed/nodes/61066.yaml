    html: |-
      <p>Wow, this is already so developed. Exciting work.</p>
      <p>I have to say I'm not yet convinced that these italic minuscules can read as a family member with this roman. The broad-brush construction of those italics seems very at odds with the didone premise of the roman. The roman reminds me of Century (I consider that a compliment) so looking at its italics might be helpful for seeing what kind of matches are traditional. Of course I'm not saying you have to do what's been done before just because it's been done; but there's a real divide between broad-brush/broad-nibbed pen forms and engraved/split-nib pen forms, and I think straddling across that divide with one typeface family might be quite difficult. (Did this divide come up in that recent italics thread that Nina started?) </p>
      <p>These alphabets are all very nice, so maybe you should reinvent a different italic for this roman and a different roman for this italic! Or maybe see it through and prove me wrong - I think this match looks improbable but it may not be impossible.</p>
      <p>Some smaller-scale reactions:</p>
      <p>Overall your proportions are sure and your drawing is handsome.<br>
      I'm envious of the curves of all your S's.<br>
      Roman g is particularly nice and roman j is very well done.<br>
      Did you consider more substantially bracketing the serifs on your thins? (southwest of AMNX; northeast of KNUXY and perhaps roman kvwxy)<br>
      Descenders of italic p and q are wonderful.<br>
      Tail of roman and italic Q may be a bit too black.<br>
      Top of roman c overhangs. Perhaps italic c, too, though I always find that letter difficult to judge.<br>
      Thin stroke of roman Xx and italic X looks unaligned and rather spindly, especially at the bottom.<br>
      Bowl coming into the stem at bottom of roman p looks weak. Perhaps same thing at top intersection of roman b and d.<br>
      Maybe lower the crossbars of roman and italic F's.<br>
      Italic s looks upside down.<br>
      Can the whites eat a little more into the center of the asterisk - it looks quite a bit too dark relative to the arms.<br>
      Roman and italic C and italic G: lower serif looks broken off.<br>
      You could extend the right side of P's lower serif for balance's sake.<br>
      I would make the terminal serif at the top of your S's (and roman s) lower relative to the top curve. Similarly, the top of q's stem could be lowered relative to the top of its bowl.</p>
      <p>Hope that helps.</p>
