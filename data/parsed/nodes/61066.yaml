      <p>In AE, I might give more of the overall width of the glyph to the A-parts on the left, because they're all thins (and because the thick vertical reads as belonging to the E, since it's vertical). Similarly the O of your OE might use some narrowing. These are characters I have little experience of, though, so I may be way off on how they read to more familiarized eyes.</p>
      <p><em>Boy, placement of diacritics is hard, even when you have them in your first language. I need to work more on this, for sure.</em></p>
      <p>There's a bit on that <a class="freelinking external" href="http://www.microsoft.com/typography/developers/fdsspec/diacritics.htm" rel="nofollow">here</a>.</p>
      <p><em>Do you think an fí-ligature like this could at all work if the diacritic was better placed? I know it may seem odd that I want to make such an odd ligature, but it’s very much needed in Old Norse, Færoese and Icelandic, languages I am very keen to support.</em></p>
      <p>I'd get the accent placement right first. Then it might be worth seeing if the f hood can come down to the bottom of the accent rather than the middle or top. It'd be cool if it could work, though perhaps it would require too much bending of the f.</p>
