    votes: null
    html: |-
      <p>Without modifying the font, and without using an explicit <code>\kern</code> command, it can be done with luaLaTeX using a little file, say <code>Ti.fea</code> with the lines</p>
      <pre>languagesystem DFLT dflt;
      languagesystem latn dflt;
      feature kern {
            pos \T \dotlessi -115;
      } kern;
      </pre><p>and then loading the font with the option <code>[FeatureFile=Ti.fea]</code>. That does not seem to interfere with the rest of the kerning.</p>
    html_clean: |-
