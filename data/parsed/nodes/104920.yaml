    date: 2013-07-25T15:58:00
    date_raw: 25 Jul 2013 — 3:58pm
    votes: null
    html: |-
      <p>Well, here is something for Quark to beat. I did not find a way to make a <code>calt</code> table for lualatex, nor to simulate adding a table that does not exist in a font. There is at least a <code>salt</code> table in Minion Pro so here is another experiment. This time, I used a little file I called <code>salt.fea</code> with the following lines</p>
      <pre>languagesystem DFLT dflt;
      languagesystem latn dflt;

      feature salt {
        script latn ;
          language dflt ;
             sub \i by \dotlessi ;
      } salt ;
      feature kern {
       script latn;
         language dflt ;
            pos \T \dotlessi -115;
      } kern ;
      </pre><p>I used it to define the fontface <code>\head</code> in the following luaLaTeX file</p>
      <pre>\documentclass{article}
      \usepackage{fontspec}

      \setromanfont{Minion Pro Bold Subh}
      \newfontface\head[FeatureFile=salt.fea,
                        Style=Alternate]{Minion Pro Bold Subh}
      \begin{document}
      {\head Time} in Toronto
      \end{document} 
      </pre><p>which gave the following output:</p>
      <p><img src="/files/timeintoronto_5104.png"></p>
      <p>Of course, the "font face" <code>\head</code> used to write "Time" is of little use but at least the word "Time" is properly coded, without cheating with an dotlessi in the input. The worst that can happen if <code>salt.fea</code> is used with a font that misses a <code>salt</code> table is that the output simply shows "Ti" instead of "Tı" which is exactly as should be.</p>
