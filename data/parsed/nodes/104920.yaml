      <p>The kerning given by the font is -80 (as in the first line below). To get the Tı as close as the jpg above, I have to fix it to about -115 in InDesign (as shown in the little box for kerning)</p>
      <p><img src="/files/kerning_6653.png"></p>
      <p>If the kerning was not done in InDesign, then I suspect a special kerning pair was added to the font.</p>
      <p>It may also be possible with luaTeX to add that kerning pair without touching the font. That would satisfy, in some way, all the given requirements.</p>
