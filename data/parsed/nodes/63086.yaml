    <p>I demonstrated this in my type design class last night. All of the students were surprised that this feature existed, so I thought maybe others were unaware of its existence.</p>
    <p>While viewing a glyph string in the metrics window, on a Mac, shift command P will unfill the glyph shapes and render them in their outline form. Very helpful if you are spacing a connecting script. Shift command N will give reveal the control nodes as well.</p>
    <p>Just thought this might be of interest. If it is old news my apologies for wasting your time.</p>
    <p>James</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/outline_metrics_5124.jpg"></div><p></p>
