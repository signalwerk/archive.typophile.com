    html: "<p>One other thing about my old method: It might not work so well in font editors that use only integer coordinates. When I was using that method, I was still drawing my typefaces in Illustrator. I don't draw typefaces in Illustrator anymore and I don't recommend it. However, some font editors can work with fractional coordinates, including Fontographer and Robofont. (Edit: Robofont <em>seems</em> to allow use of fractional coordinates, but they don't seem to \"stick\", rounding to an integer next time you click on the point.)</p>"
