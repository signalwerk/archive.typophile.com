    html: |-
      <p><cite>Seriously, gentle slants are generally better anyway.</cite></p>
      <p>I'd be interested in hearing a rational for that. Particularly with sans faces, I find that the less the angle on the oblique, the harder it is to distinguish the oblique from the upright; there is insufficient contrast.  Although I like setting text in sans serif (although I'm seldom allowed the opportunity in book design) I dislike the use of obliques instead of a built italic just for that reason. Italics are often used to provide emphasis, and I think you need to be able to readily distinguish the italic from the roman for that to work.</p>
    html_clean: |-
