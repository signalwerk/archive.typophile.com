  - id: 494070
    user: 1250
    date: 2012-02-06T11:48:00
    date_raw: 6 Feb 2012 — 11:48am
    votes: null
    html: |-
      <p>Well, there's gentle, and then there's gentle. I agree with<br>
      your concern, and that's why I'm no fan of "upright italics".<br>
      I also think you have a point about the sans issue, although<br>
      when an Italic has too fewer serifs than the Roman that's a<br>
      problem too (in terms of "skewing" the voice of the Roman<br>
      too much - not being a good subordinate style).</p>
      <p>The slant certainly has to be sufficient. And that depends<br>
      on a number of factors, for example the repro quality, which<br>
      can be hard to predict. However one thing it also depends on<br>
      is other attributes of the design - the Italic can deviate from<br>
      the Roman in various ways beside slant, such that the slant<br>
      can be in the single digits and still work. Look at the Italic in<br>
      FF-Ernestine*; it's only ~3.6 degrees, but works like a charm.</p>
      <p>* <a href="http://ernestinefont.com/" title="http://ernestinefont.com/">http://ernestinefont.com/</a></p>
      <p>But why avoid steep slants anyway? Readability. The patterns<br>
      established by the more significant Roman (and Roman<strong>s</strong>) are<br>
      increasingly violated with increasing slant. This BTW is also<br>
      why a descending "f" in an Italic is a bad idea.</p>
      <p>hhp</p>
