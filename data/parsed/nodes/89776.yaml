      <p>Before I found Briem's technique, I used a different method. I don't think it's as reliable, but the results weren't terrible. Also, I don't think it would lend itself to some sort of script. That said, here's what I did:</p>
      <p>1. Slant the glyphs <em>twice</em> the target angle. For example, if the italic slant is to be 11 degrees, slant the glyphs 22 degrees.<br>
      2. Visually correct the glyphs until they don't look distorted. (This is the tricky part since it depends on your visual judgment, which may not be as good as you think it is.)<br>
      3. Interpolate with the original upright glyphs.</p>
      <p>The idea is that in the twice-slanted glyphs the distortions will be easier to see and fix, and, if your corrections are not perfect, the imperfections will be reduced in the interpolated glyphs. I prefer Briem's method mainly because it's more mechanical and less dependent on subjective judgments, plus I'm happier with the results.</p>
