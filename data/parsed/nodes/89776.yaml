    <p>Hi Typohiles,</p>
    <p>I'm doing obliques of a sans right now, with Briem's method. While it's simple enough, I still wonder what are the other methods out there? Are there any? I've searched the forum and haven't found anything concrete.</p>
    <p>Another question, the Briem's method is so schematic that it got me thinking that it must be possible to be translated into a script. Has anyone taken a shot at it? The needed curve compensation is in direct relation to the angle of the slant and the curve, maybe this could be calculated? In the next version of RMX Tools?</p>
    <p>I know, as always the final answer is "trust&amp;train your eyes". But with the help of automation, getting to even the halfway of things would really speed up the process and leave the monotonic parts for the machines.</p>
