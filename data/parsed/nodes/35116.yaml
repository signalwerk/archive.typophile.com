    html: "<p>It's nice but the formula is getting in the way a little. The repetion of the form form of o for the n isn't working for me. The m is not working for me either. I lik the v. I would make a w based on the v instead. I suggest you learn about 'clotting' and what to do about it. Here is a start: see were the like joins the stem on the p? See how it makes a kind of dark spot? You don't want that. I ma not saying change the shape - just compensate for the clot.</p>"
