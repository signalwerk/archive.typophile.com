      <p>Then I feel like the "M,,W,m,w" dont belong to the sistem, becouse the union from curve to line is weard... may be </p>
      <p>The horizontal line of the "f" should be at the "x" heigt, like the "t", the bottom eye of the "B" should be larger than the top eye... and the center of the "xX" should be a little bit more close from the "x" heigt line.</p>
      <p>Anyway, i like the "k" "v"</p>
      <p>Sorry for my misspels, I dont write english very well...<br>
