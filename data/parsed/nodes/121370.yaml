    html: <p>Thanks Ryuk. Beaurencourt seems quite nice. I also found a bunch of the Aring Typeface's had a similar letterforms. <a href="http://www.myfonts.com/fonts/mawns/castro-script/" rel="nofollow">Castro Script</a>, <a href="http://www.myfonts.com/fonts/mawns/society-editor/" rel="nofollow">Society Editor</a> and <a href="http://www.myfonts.com/fonts/mawns/dollie-script/" rel="nofollow">Dollie Script</a>. It's quite possible the original script is just the designers own handwriting.</p>
