    html: "<p>Was almost certain I've already tried to identify it but can't find anything. Anyway, confirming hand-drawn hunch. Looks like a <a class=\"freelinking external\" href=\"http://typophile.com/node/70274\" rel=\"nofollow\">Spoleto/Aktuelle/Athletic Script/Opti Sport Script</a> x <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/fontyou/beaurencourt-fy\" rel=\"nofollow\">Beaurencourt</a> job. Some alternatives: <strong>Vellum/Swoon</strong> (interesting but don't want to give any pointer to it as it's copyrighted by Summitsoft Corporation and I don't trust this source although I can't find any other \"trusty\" source for it), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/corien/dausby\" rel=\"nofollow\">Dausby</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/softmaker/enrico-handwriting\" rel=\"nofollow\">Enrico Handwritting</a>, many <a class=\"freelinking external\" href=\"http://www.myfonts.com/foundry/IHOF\" rel=\"nofollow\">IHOF P22</a></p>"
