  html: |-
    <p>I claim to have a world record in type design in speed.</p>
    <p>When House Industries guys went about their Font Sprint in Vancouver, I promised I would trump their attempt of producing a working font in under 4 hours. They failed miserabily; they had upper and lower case letters, and most of the numerals.</p>
    <p>I promised that if ATypI ever came to Helsinki, I would make a whole font in that time.</p>
    <p>ATypI did come to Helsinki, so I had to put my money where my mouth was, and since I was one of the organizers, I could. This is the result:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Marathon_4566.png"></div><br>
    It is ugly as hell, but it's a working Open Type font with 122 kerning pairs.<p></p>
    <p>I made a RoboFog-file with pre-demernied x-height, ascenders and descenders beforehand, but that was it. Everything else was made on site. From start to this pdf, it took me 3 hours 4 minutes.</p>
    <p>Challenge?</p>
