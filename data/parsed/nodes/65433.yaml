      <p>Hi, James-</p>
      <p>I was not bashing House; I know them, and consider them friends of mine. But Ken, Christian and Tal did admit that they did not manage the task in time. And so, with help of some amount of red wine, I promised them that if ATypI ever came to Helsinki, I would try to make a whole Latin 1 font in 4 hours. </p>
      <p>And look what happened.</p>
      <p>And I quess I was showing off. Sorry about that.</p>
      <p>But then again, I made a full font in 3 hours and 4 minutes :·)</p>
