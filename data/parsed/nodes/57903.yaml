      <p>The easy way for the full set is to open the enc file in a text editor and reorder the glyphs as you would like. You can also use a spreadsheet like Excel where you can put lists next to eachother as columns and drag and drop things around. Be sure to rename your file afterwards.</p>
      <p>ChrisL</p>
