    html: |-
      <p>I have made some 'fake' codepages for FontLab just to put similar characters side by side and work on them. For that, I simply copied a codepage from codpages folder of FontLab and changed its name and changed the codes to those I wanted to put together... it takes time!<br>
      Note that this was never intended to affect the font encoding process.</p>
