  votes: null
  html: <p>I have a client that would like to continue using a logo which was originally created using the free true type font (air millhouse italic) on a PC. <br>I work on a Mac and will need to use this logo for having his letterhead and business card printed. <br>Is there a converter to make that font postscript or should I use a program like illustrator to make a EPS image or photoshop to make a tiff image  of that logo and then import it in quark? <br>I would appreciate any advice. <br>Thanks, <br>bbpal</p>
  html_clean: <p>I have a client that would like to continue using a logo which was originally created using the free true type font (air millhouse italic) on a PC. <br>I work on a Mac and will need to use this logo for having his letterhead and business card printed. <br>Is there a converter to make that font postscript or should I use a program like illustrator to make a EPS image or photoshop to make a tiff image  of that logo and then import it in quark? <br>I would appreciate any advice. <br>Thanks, <br>bbpal</p>
