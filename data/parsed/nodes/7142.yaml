    date: 2004-10-14T05:51:00
    date_raw: 14 Oct 2004 — 5:51am
    votes: null
    html: <p>You can read the PC font into a typeface editor like Fontographer and then re output as a Mac font. If you don't have such a utility it might be easier to make the logo into a vector file -- which it should probably be anyway. <br> <br>There is also the possibility -- which I have encountered myself -- where the free font is actually a ripoff of a commercial font. Looking at this <a href="http://www.1001fonts.com/font_details.html?font_id=466">Air Millhouse</a>, it looks awfully familiar. Does anyone recognize it? I bet it's a ripoff with a couple of cheesy alternate caps. If this is the case, it might be easier and/or more ethical to simply license the commercial version.</p>
