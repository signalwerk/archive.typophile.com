  html: <p>Wood, Linoleum, or any surface which can be cut by hand tools and inked with a brayer or stamp. Prints can be pulled with high pressure hand presses or "spooned" by hand by rubbing the back of the paper with a spoon while it is on top of the inked block.</p>
  html_clean: <p>Wood, Linoleum, or any surface which can be cut by hand tools and inked with a brayer or stamp. Prints can be pulled with high pressure hand presses or "spooned" by hand by rubbing the back of the paper with a spoon while it is on top of the inked block.</p>
