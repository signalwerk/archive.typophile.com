    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Publications" class="freelinking" rel="nofollow">Publications</a> : Spatium</strong></p>
    <p><strong>Publisher:</strong> <a href="/wiki/Typosition" class="freelinking" rel="nofollow">Typosition</a> (GER)</p>
    <p>Published in Offenbach, Germany. <a href="/wiki/Typosition" class="freelinking" rel="nofollow">Typosition</a> was founded by <a href="/wiki/Peter%20Reichard" class="freelinking" rel="nofollow">Peter Reichard</a>. Issue #4 (»Group 11 – typography is international«, 2004) features an in-depth article about mixing writing systems and latinization by <a href="/wiki/Hrant%20Papazian" class="freelinking" rel="nofollow">Hrant Papazian</a> and some other articles about non-latin typefaces. The issues before had these topics: »norming in typography and design« (2002), »collecting mania« (2003), »typography« (2003).</p>
    <p>In Autumn 2005 the 5th issue under the title »Hamburgefonts« will published about type specimen books. spatium is published in German and English and in every issue their are a lot of international contributers (Tarek Atrissi, Oded Ezer, <a href="/wiki/Hans%20Peter%20Willberg" class="freelinking" rel="nofollow">Hans Peter Willberg</a>, Jorge Alderete, Fons Hickmann, David Quay, <a href="/wiki/Heinrich%20Lischka" class="freelinking" rel="nofollow">Heinrich Lischka</a>, Filip Blazek <a href="/wiki/Typo%20Magazine" class="freelinking" rel="nofollow">Typo Magazine</a>, etc.).</p>
    <p><strong>Website:</strong> <a href="http://www.spatium-magazin.de/" rel="nofollow">www.spatium-magazin.de/</a></p>
