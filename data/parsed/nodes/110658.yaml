    html: |-
      <p>You still get better with Firefox. Still right click the text and choose "Examiner l'élément" (I guess it is "Inspect" in English).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/examiner_6533.png"></div><br>
      And then you can directly choose "Polices" (Fonts) in the right panel.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/polices-firefox_6294.png"></div><p></p>
      <p>Unfortunately, I have found no browser that gives the "Full Name" to be found inside the font file. All that is given is the css code to load the file .</p>
