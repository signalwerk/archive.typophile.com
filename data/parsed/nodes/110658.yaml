    <p>Please help me identify these beautiful font: <a href="http://www.kobzar.be/objects/nice_font.png" title="http://www.kobzar.be/objects/nice_font.png">http://www.kobzar.be/objects/nice_font.png</a></p>
    <p>The French newspaper Figaro uses is as the TEXT BODY font in its articles:<br>
    <a href="http://www.lefigaro.fr/conjoncture/2014/01/23/20002-20140123ARTFIG00620-l-allemagne-accelere-son-calendrier-de-reformes.php" title="http://www.lefigaro.fr/conjoncture/2014/01/23/20002-20140123ARTFIG00620-l-allemagne-accelere-son-calendrier-de-reformes.php">http://www.lefigaro.fr/conjoncture/2014/01/23/20002-20140123ARTFIG00620-...</a></p>
    <p>Please help me with the name of this font.<br>
    Thank you in advance,<br>
    Andrei</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/nice_font_3982.png"></div><p></p>
