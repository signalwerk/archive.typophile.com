      <p>Small size &amp; lack of earmark letters make it rash to venture a firm statement. Could be bespoke. Possibly something from Typofonderie<br>
      <a href="http://www.myfonts.com/foundry/Typofonderie/" title="http://www.myfonts.com/foundry/Typofonderie/">http://www.myfonts.com/foundry/Typofonderie/</a><br>
      Some similarities to Agenda <a href="http://www.myfonts.com/fonts/fontbureau/agenda/" title="http://www.myfonts.com/fonts/fontbureau/agenda/">http://www.myfonts.com/fonts/fontbureau/agenda/</a> with different K, t and a few others. I'll let another typophile stick their neck out on this one.<br>
      Don</p>
