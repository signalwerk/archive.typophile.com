      <p>Not sure why I’m part of the incantation of this item’s title, but hey — I’ll give it a shot!</p>
      <p>&gt;it seems to me that type design is like 007. top secret </p>
      <p>Annoying, isn’t it? I suspect this is because typefounding has its roots in the guild tradition, in which master craftsmen were deeply reluctant to share their trade secrets. (There’s an anecdote about young Joseph Jackson, apprenticed to William Caslon, learning his trade by boring a hole through the master’s wall; this sums it up.) Christopher Plantin’s “Dialogues,” which purport to explain type design to the lay public, are riddled with intentional errors (though the book is still a good read), and Joseph Moxon’s “Mechanick Exercises” is similarly oblique by design.</p>
      <p>There are a lot of personal monographs about lettering, even more about typefounding, but only occasional writings about typeface design that are really on point. I really like Fred Smeijers books, <a href="https://web.archive.org/web/20081006112502/http://www.amazon.com/exec/obidos/ASIN/0907259065/typographycom-20">“Counterpunch”</a> especially (it’s a farrago of ideas, every bit as thoughtful, inventive and thorough as Fred himself), but it’s not really a manual about how to design fonts. Gerrit Noordzij’s books are also great, of which <a href="https://web.archive.org/web/20081006112502/http://www.amazon.com/exec/obidos/ASIN/088179175X/typographycom-20">“Letterletter”</a> may be the one that’s of greatest practical use to someone wanting to learn how to design typefaces. You can generally find Dwiggins’ things through inter-library loan, and both “WAD to RR: A letter about designing type” and “Layout in Advertising” (ignore the misleading title) offer some genuine insights.</p>
      <p>&gt; is there a chance that you and other type designers<br>
      &gt; will develop a deep course about type design</p>
      <p>A lot of type designers do teach courses on type design. Tobias Frere-Jones and Matthew Carter co-teach an excellent class in the Yale MFA program, and I’m always impressed by the students’ output: more than just drawing good letters, they really learn to develop the kind of clarity of purpose that makes a good typeface. Cyrus Highsmith teaches a type design class at RISD, Erik van Blokland teaches at KABK in The Hague, and Gerry Leonidas runs an outstanding program in Reading — we’ve hired type designers out of all of these programs. If you’re interested in type design and thinking about going back to school, I’d really encourage you to talk to one of these folks about their programs.</p>
      <p>A lot of type designers also participate in workshops. Jean-François Porchez leads workshops in a variety of places, and the guys from Underware host a travelling workshop that looks every bit as exciting as their fonts are. Most accessibly, many type conferences have a parallel “hands-on” track in which accomplished type designers teach their specialties. (<!--
