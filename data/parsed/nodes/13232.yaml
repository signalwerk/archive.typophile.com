    <p>1. you  said that “the  virtues of good typeface are more than skin-deep” — can you talk  about that?</p>
    <p>2. sometimes —  it seems to me that type design is like 007. top secret (if we compare drawing or painting and type design. ) I can’t find books about type design (we can find more books about lettering  — like the books by Michael Harvey)<br>
      are you going to write a book about type design? </p>
    <p>3. is there a chance that you and other type designers will develop a deep  course about type design — and enjoy  it here; something like design workshop. (I know that there’s  a type design workshop  by Jean François Porchez  in Madrid — but i can’t go to Madrid)</p>
