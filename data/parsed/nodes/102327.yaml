    <p>Hello guys,</p>
    <p>i need to pick a body copy font to mix with Mostra Nova... This font will be used on the menus, bussiness cards, all corporate identity of an italian restaurant (not the traditional one but rather a "chic" italian... Modern and up to date.. </p>
    <p>The display font is Mostra Nuova Bold<br>
    <a href="http://www.marksimonson.com/fonts/view/mostra-nuova" title="http://www.marksimonson.com/fonts/view/mostra-nuova">http://www.marksimonson.com/fonts/view/mostra-nuova</a></p>
    <p>I see that i could just use Mostra Nuova on one of the lighter weights, but i am sure you'll have a better recomendation...</p>
    <p>Thanks in advance!</p>
