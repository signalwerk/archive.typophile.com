      <p>Thanks guys for your recommendations...</p>
      <p>Nick, the "modern" and up to date is the restaurant, not the font.  Mostra obviously has that retro italian feel.. and as you well say it is art deco. </p>
      <p>Regarding your recomendation, don't you think the general feel of semplicita is too similar to the lightweights of mostra??  Legibility is improved over them but... Anything with more contrast??? ( i know it is hard, that's why i need you guys! :)</p>
      <p>Topy, same thing... too similar maybe.. </p>
      <p>And in both cases i guess i prefer the single storey "a" of  Mostra lightweights...</p>
