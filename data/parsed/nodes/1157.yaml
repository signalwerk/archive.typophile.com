  - id: 9173
    user: 1681
    date: 2003-09-05T12:03:00
    date_raw: 5 Sep 2003 — 12:03pm
    votes: null
    html: "<p>After a week of design classes, I believe I'm qualified to shoot my mouth off, so here goes: <br> <br>Something's not quite working with the type. I think it's the ascenders and descenders - you have to leave a lot of space for them, so everything floats instead of feeling integrated. <br> <br>As for the illustration, Randy said it - it needs a warmer handmade feel. I'd also add that you should get to the essentials, cropping it fairly tight around the hands and the loaf. To me the focus of the image should be the bread, not so much the artisan. <br> <br>I also think the dark brown should be pulled back. As it stands it looks almost black. Despite sounding cliche, I think the pallette should be muted and more in the grain/crust color range. <br> <br>Okay, I'll stop now.</p>"
