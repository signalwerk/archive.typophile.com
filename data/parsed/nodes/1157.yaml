    html: "<p>Hi David. <br> <br>Sorry for a grumpy opinion, but I think this one is missing. I don't know the client, or what they have in mind for the decor... <br> <br>Type: I agree the italics on the circle isn't working. Try open capitals (?), big bold deco sans (?) <br> <br>Illustration: This is saying clip artisan to me. Too computerized for an artisan outfit. I'm looking for an engraving, or a woodblock print, or scratchboard... not vectorville. <br> <br>There was a gelato shop logo that got posted a few months back that I think was suffering from the same sort of trouble. I know Louise Fili was mentioned elswhere recently, but check out that site for some gourmet/food/restaurant delectable type. <a href=\"http://www.louisefili.com\" target=\"_blank\">www.louisefili.com</a> <br> <br>Maybe it's modeled after an old streetsign (I've got some photos if you want). Maybe it's not old at all, it's just where my mind goes first. All that to say, I've seen your postings at typophile and have been impressed. This isn't it, but you're surely capable. Sneek away from your machine, and go for it (fresh bread on hand might not help!) <br> <br>Good luck, <br>Randy</p>"
