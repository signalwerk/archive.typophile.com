  html: <p>This is a logo I've been working on for a client who is opening a small, indepentent neighborhood bakery. Fresh handcrafted artisan baked goods will be the focus, but the bakery will also offer a small coffeeshop, limited delicatessen and bistro-style and sidewalk dining. <br> <br>The bakery will be located in the Avenues neighborhood of Salt Lake City, hence the name. <br> <br>After a few false starts on an image concept, this is the image and type treatment that the client liked. <br> <br>The colors are based on (and meant to be evocative of) the characteristics of baked bread, and the overall feeling we've been trying to create is a simple, rustic, artisan-style charm. <br> <br>There will also be a horizontal banner version, with the mark set to the left and the type in two lines next to it. <br> <br>Comments appreciated! <br> <br>David <br> <br><img src="http://www.typophile.com/forums/messages/29/15436.gif" alt="AvenuesBakeryLogo4LR.gif"></p>
