    <p>Hello everybody! I am pretty new to typeface design but I do have an interest in learning the process of designing my own typeface. This typeface design was intended as a research project, however the deadline's pretty tight so I have only another 2 days to complete the full uppercase and numeral sets. </p>
    <p>Basically, I am aiming to design a sans serif, geometric typeface that I like to coin as the "lovechild of Futura and Gotham". I will be taking some characteristics from Futura and Gotham, and combining them to create a softer yet bolder typeface. This typeface was made to be a header font, hence the heavier body weight. I have not gotten all the letters right, so the image seen here is just what I have so far. Also any suggestions to characteristics that I could add to further differentiate my typeface from Futura / Gotham or any other geometric sans serifs that are already out there? </p>
    <p>Any critique and suggestion will be very useful at this point. Thank you in advance! :)</p>
    <p>PS: This is my first time designing a typeface, so any tips would greatly appreciated too. Cheers!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Fotham a4-03_3927.jpg"></div><p></p>
