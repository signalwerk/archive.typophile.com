      <div class="comment-spam-body"><p>Indeed, this isn't going to work. I think you would do well to study the basic principles of type design first. For one, horizontal strokes are optically thicker so you need to compensate for that. You didn't, so all your horizontals look too thick. Here's a great source to study some basic principles: <a href="http://www.typeworkshop.com/index.php?id1=type-basics" title="http://www.typeworkshop.com/index.php?id1=type-basics">http://www.typeworkshop.com/index.php?id1=type-basics</a></p>
      <p>And here you can find more resources: <a href="http://temple-of-typefaces.deviantart.com/journal/Type-resources-276795259" title="http://temple-of-typefaces.deviantart.com/journal/Type-resources-276795259">http://temple-of-typefaces.deviantart.com/journal/Type-resources-276795259</a><br>
      Also have a look at the other blog posts. I have a few tutorials on how to design a typeface.</p>
      <p>Also, don't think you can get a great typeface by combining popular ones. Especially if you're not well versed in type design, it can quickly become a monstrosity. Try to design your own typefaces. You learn a lot more by doing so. I can recommend to just keep experimenting, keep researching and keep looking at other people's designs. Reading the criticism people leave here on other people's typefaces can also be greatly beneficial as you get more insight into what works and what doesn't according to the professionals, rather than guessing what works. You first need to have knowledge before certain issues become obvious. For example, you probably didn't know that horizontal strokes look optically thicker, and so you didn't see that issue.</p>
      </div>
