    html: |-
      <p>Hi Nick,<br>
      I am aware of the tendency of calling those "altered" type designs "distressed". It‘s just that I never felt comfortable with both english terms ("grunge" and "distressed"). I never felt at home with the general attitude most english-speaking and dutch designers were using during the early 1990s avant-gardes which let to lettering and type experimentation, because they weren’t related to my personal experiences.<br>
      Th biggest problem I have is that "distressed" implies an association with inner feelings which are not necessarily the ones fueling the inspiration.<br>
      The reasons may be varied as much as the reasons which prompt to do a new take or experiment on established typographic categories, so the definition should reflect that, without implying certain emotional states or feelings.<br>
      Of course, there was a sense of anguish and disorientation in the mid-1990s, for young people which were getting older in that period, but this wasn’t the only (or the main) element of inspiration for producing “distressed” type. Another silly term was “egyptian” but luckily it’s mostly gone… :-)</p>
