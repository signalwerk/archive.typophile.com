      <p>Claudio, I’ve never considered <strong>Distressed</strong> to mean an emotional state, when applied to type.<br>
      Before its use to describe a genre of type, I was already familiar with its long-standing meaning as applied to antiques (furniture etc.) and pseudo-antiques: “Intentionally marred or faded to convey an antique or used look”.<br>
      Also, I don’t believe that types have inherent emotional qualities.<br>
      Therefore, to use an existing craft manufacturing term to describe a style of type seemed quite straightforward, especially as the design process is one where a perfect shape is corrupted, tainted, or marred.</p>
      <p><strong>Grunge</strong> has a broader meaning, as it quite often refers to what has never been anywhere near perfection.<br>
      Typeface: Amoeba, or anything roughly hand-made.</p>
      <p><strong>Deconstruction</strong> was another mid-90s method, typically involving a mash-up of contrasting styles.<br>
      Typeface: Fudoni, Dead History, Keedy Sans.</p>
      <p>All these three terms describe things that are less-than-perfect, but in quite different ways.</p>
      <p>What are the words for “distressed”, meaning the antiquing of furniture, in other languages?</p>
