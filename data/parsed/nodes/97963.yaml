      <blockquote><p>Is copying another piece of lettering as a font really OK as long as it it's not an exact digital copy, or as long as it's over 50 years old?</p></blockquote>
      <p>It really depends on your motivation. In the case of digitizing an older typeface or lettering sample, if no other exists and you are open about your sources and motivation (assuming you plan to make it available publically or commercially) and if done well then it can often be a useful excercise and of benefit to people.</p>
