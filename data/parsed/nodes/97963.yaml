      <p>"Is copying another piece of lettering as a font really OK as long as it it's not an exact digital copy, or as long as it's over 50 years old?"</p>
      <p>Like everything else, it depends.</p>
      <p>Factors include:<br>
      .   What jurisdiction - European union and USA treat designs and durations differently.<br>
      .   Previous actions taken - Is the design (or implemenation) patented? Copyright? Trademarked? Has the protection been renewed? Is the original owner alive?<br>
      .   If the original is protected, how different is the new design - a difficult interpretation.</p>
      <p> Simple questions seldom have simple answers.</p>
      <p> - Herb</p>
