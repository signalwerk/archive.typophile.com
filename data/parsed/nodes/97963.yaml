      <p>A fourth category may be the simulation, or the faithful <em>recording</em>—to use Jonathan Hoeﬂer’s term describing his Historical Allsorts—of a roughly printed (compared with subsequent technologies) typeface, where the distress is unintentional, an artefact of the printing process. Mark van Bronkhorst has called this <strong>Rustic</strong>, e.g. his Celestia Antiqua. </p>
      <p>Compare with the architectural term Rustication.</p>
