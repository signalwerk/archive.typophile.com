    html: |-
      <p><em>Fontographer defines point coordinates with non-integer precision. FogLamp can convert .fog files into .vfb with increased precision up to 10,000 UPM. Useful when making complex ornaments, logos, signatures, Baroque initials.</em></p>
      <p>Will the finished fonts be rendered at 10,000 UPM, or will rounding occur to PS and/or TTF standards when the fonts are generated?</p>
