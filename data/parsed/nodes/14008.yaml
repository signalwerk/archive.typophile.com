    date_raw: 4 Aug 2005 — 12:56pm
    votes: null
    html: |-
      <p>The finished fonts will be rendered at whatever you specify in the application you do the finishing :) </p>
      <p>From FontLab, you can output a font with any UPM up to 16,000. For TrueType / OpenType TT, it will work perfectly, for OpenType PS and Type 1, there will be some minor application-specific annoyances e.g. the text cursor in InDesign might shrink to half or quarter size but the font still works. </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
