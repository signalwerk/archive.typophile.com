  html: |-
    <p>I think that this is right forum to post this little announcement: we just released new product, named <a href="http://www.pyrus.com/Font-tools/FogLamp/" rel="nofollow">FogLamp</a>. It is very simple application which has only one purpose: convert Fontographer database files (versions 3 and 4 are supported) to FontLab files.</p>
    <p>FogLamp is available separately (for both platforms) and in bundles with Fontographer and TransType Pro. Combination of Fog, FogLamp and TransType Pro allows to build Fog-based font-editing environment which can generate OpenType fonts in both "flavors" as well as any other font format.</p>
    <p>More information is available in <a href="http://www.fontlab.com/The-News/Announcements/FogLamp-for-Fontographer-Users" rel="nofollow">press release</a>.</p>
