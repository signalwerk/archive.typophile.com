      <p>Welcome back William!</p>
      <p>Expansion is different from proportion.<br>
      See the following page from my ATypI 2003 Vancouver presentation on Henk Krijger's Raffia Initials:<br>
      <a href="http://www.enneson.com/public_downloads/pe/trans_expansion_rot.pdf" title="www.enneson.com/public_downloads/pe/trans_expansion_rot.pdf">www.enneson.com/public_downloads/pe/trans_expansion_rot.pdf</a></p>
      <p>Pressure downwards on the flexible nibbed pen creates a swelling in the stroke. Noordzij discusses this in terms of the direction of the 'front' and the size of the 'counterpoint'. (Note the varying widths of the little vectors im my pdf. Think of the endpoints of the vectors in counterpoint terms--literally as well as musically.) The Noordzij drawings on the left in my pdf come from Noordzij's <em>Letterletter</em>. The drawings on the right come from a paper explaining the math behind Vinyas, a now defunct Indian font-creation software.</p>
      <p>Expansion is the model for contrast manipulation in the old classification's Modern (Noordzij's Romantic, which includes Bringhurst's Neo Classical--Baskerville--and Romantic--Bodoni). Pages 27 to 29 of <em>The stroke</em> demonstrate the fundamental similarity of the Baskervilles and the Didonis (note especially figure 2.13, but refer back to figures 2.8 to 2.12). You can see it on the Gerrit Noordzij site<br>
      (<a href="http://www.letterror.com/noordzij/streek/chapter2/index.html" title="http://www.letterror.com/noordzij/streek/chapter2/index.html">http://www.letterror.com/noordzij/streek/chapter2/index.html</a>)<br>
      but buy the book.</p>
