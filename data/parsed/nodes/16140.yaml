      <p><em>It does not have to be physically possible to write a form for the contrast scheme imposed by a tool in the hand to be or become inherent in or underly a constructed form, i.e., to give the constructed form a ‘logic.’</em></p>
      <p>This is very important to understand when reading <em>The Stroke</em>: Noordzij is providing an analytical tool for describing what is happening in a stroke, not a model for writing. Nick, the Bodoniesque o is easy to understand in terms of expansion if you remember that at every point along the stroke the 'heartline' is equi-distant from the two edges. So it is perfectly possible, in the expansion model, for one side of the stroke to be straight and the other to be curved, and you can see exactly how by mapping the heartline, i.e the movement of the stroke.</p>
      <p>I love expansion. Expansion is the new black :)</p>
