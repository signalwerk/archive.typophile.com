      <p>&gt;the first typeface to be drawn from scratch</p>
      <p>Before L.B. Benton's mechanical punchcutter, drawings had to be interpreted by human punchcutters working by eye. With Benton's device, a pantograph followed the letter shapes as drawn, and transferred these directly to metal. This removed the creative/craft influence of the human punchcutter, making type design more the preserve of draughtsmen (and women), be they in the drawing office of a foundry, or independent designers.</p>
    html_clean: |-
