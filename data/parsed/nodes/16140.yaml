      <p><a href="http://www.enneson.com/public_downloads/pe/typophile/bodonipresupposesexpansion.jpg" title="http://www.enneson.com/public_downloads/pe/typophile/bodonipresupposesexpansion.jpg">http://www.enneson.com/public_downloads/pe/typophile/bodonipresupposesex...</a></p>
      <p>To get back to the subject of Romanticism, it is hard to see why the term romanticism should be linked to 'expansion' <em>per se</em>. It would rather seem that the flexble pen should be the instrument <em>par excellance</em> of the Rococo. </p>
      <p>Bringhurst talks of both Neoclassical and Romantic types as having a rationalist axis. This seems to fit. It is as if, after the <em>romain du roi</em>, which rationalized the type surface, opportunistic use of expansion and the contrast it provides was able to happen. </p>
      <p>But the question also arises how to think of romanticism in terms of a rationalist axis. (In the history of philosophy Kant is sometimes thought of in classical idealist terms, and Hegel in romantic idealist terms. Descartes and Hume, meanwhile epitomize two subcurrents with rationalism)</p>
      <p>I think there's still some work to do in aligning typographical history with cultural history.</p>
      <p>Bringurst wants to use terms like Neoclassical and Romantic as 'genus' descriptors, by anology with biological classification. While I think the principle of genus / species thinking in type classification terms is fertile,I've wondered about the aptness of the terms.</p>
