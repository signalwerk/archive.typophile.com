      <p>&gt;What by the way do you mean by ‘non-pen stress’?</p>
      <p>It's the point John made about Baskerville's joints, how he adapted written forms by applying engraving techniques. </p>
      <p>A pen can do a lot of tricks, and there are trick pens too, but the hardest thing to write (rather than draw) is a thick vertical stroke with a fine unbracketed horizontal serif. The stress transition is too abrupt for a flexible nib -- it still carries a large blob of ink from the thick down stroke, and easing up the pressure abuptly will still leave a rounded terminal. If the stroke is eased off into the (right) serif, the shape takes the form of a bracket. The perpendicularity of main and serif strokes is a typographic form originally taken from ancient lapidary capitals, and applied to both typographic upper and lower case. The more constructed (ie built up by multiple strokes) forms of engraving and stone carved lettering don't have as much difficulty in rendering the "modern" serif.</p>
      <p>So in the 18th Century you have the archetypal lapidary-derived serif being pushed technically by stone carving and engraving into a region that the pen cannot write, and type will not be able to match until Didot and Bodoni.</p>
