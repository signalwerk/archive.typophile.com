      <p>&gt;same way that the ptolemaic way of describing celestial mechanics is mathematically ‘equivalent’ to the copernican way.</p>
      <p>Unfair temptation to an historian of science!</p>
      <p>Ok, I give in. This is a revealing analogy. First, the Ptolemaic way--circular epicycles--never got the orbits as accurate as the when Kepler put elliptical orbits into the Copernican system. Then he hit it much more accurately. In addition you have to do the epicycles 'ad hoc', meaning that you have to insert them in different ways for each orbit after the fact. The ellipses give you the right thing for the whole orbit, right away. Then there is the matter that Newton came along and showed you could get the ellipses from an inverse square law and his laws of mechanics, which also worked terrestrially. Game over. </p>
      <p>The way the ellipses in a Copernican system are not ad hoc I think also may point to the limitation of the utility of the moving front description. If you restrict the moving front to translation and rotation, then you get the 'ductus' (am I using it in the right sense John?) of pen drawn letters--the physics is right, following the analogy. But once you have unrestricted expansion and contraction, you can describe any shape ad hoc, which makes the model less interesting, as it is disconnected from any underlying physics. </p>
      <p>I think if you put rules on how the expansion or contraction takes place, then it stays interesting. For example, if you could specify a restriction on what kind of expansion can take place, and get Baskerville or Bodoni--or better yet one and not the other--then you would really have something. </p>
      <p>Noordzij's idea is already very revealing that the 'baroque' faces, as Bringhurst calls them, have rotation, whereas Jenson etc did not. But to get as much insight on later developments I think you have to put more constraints on the expansion and get it to match the facts. If no restrictions, then it becomes ad hoc and has less explanatory power.</p>
