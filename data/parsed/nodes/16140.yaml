      <p>This lead somewhere Nick. I think your observations about the structure of heartline in the bodoniesque 'o' are valid and bring us to the kind of point Williams questions brought us to as well.</p>
      <p>You say: <em>But the exaggeration of this basic quality [...] of type did not come from the impetus of writing instruments.</em></p>
      <p>I think this might very well be the case. However, this suggests you think the basic quality <em><strong>is</strong></em> nevertheless there. That's all I wanted to assert. I don't think Noordzij wanted to make any assertion about the structure of the heartline, just that expansion about one and the same heartline can produce results that very markedly in appearance, ressembling those we see in Baskerville as opposed to Bodoni, but have a common denominator.</p>
      <p>After he is finished talking about <em>types</em> of contrast Noordzij begins to talk about <em>changes</em> in contrast (increase / decrease). His schematisms for this are very different from his schematisms of types of contrast. (Chapter 8 of <em>The stroke</em>) So the sources for the <em>type</em> of contrast used can vary from the provocations for it's <em>exaggeration</em>.</p>
      <p>Aside from that, Noordzij's "The Frankilin Letter" in <em>Letterletter</em> does present compelling evidence that Bodoni's efforts had something to do with the 'standard of handwriting' at the time.</p>
      <p>I'd expect that what you see and what Noordzij sees can be made part of a larger picture. Let me try:<br>
      The didoni 'o' is a special case of systematic exaggerative contrast manipulation on an broadly expansion-based frame, valued because it approaches a rational geometrical ideal (your schema). Contemporary engraving provided prototypes of how this might be pursued. The romanticism in it is the faith or illusion that text letterforms can approximate such an ideal and still be viable in functional terms.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/][img:"></div><p></p>
