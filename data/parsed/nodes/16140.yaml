      <p>William, bezier curves and quadratic splines can tell a you great deal about the structure of an outline but very little about the characteristics of the shape they contain. </p>
      <p>Mathematically they are as you suggest clearly inter-translatable, the one into the other, with perhaps some slight margin of practical indeterminacy. But for an understanding of typographical history Noordzij's schematisms are far superior, even to the feature-description approach that dominates most handbooks. Noordzij's schematisms are to feature descriptions what genotypical descriptions are to phenotypical descriptions.</p>
      <p>Relative to the topic at hand they help one see the genotypical commonality between the baskerville and the didonis in a non-trivial way. More broadly they provoke a powerful reading of typographical history as consisting of various explorations along surfaces of the typographic cube that is displayed on the cover of <em>The stroke</em> and elaborated somewhat more fully in Noordzij's 1991 contribution to Robert A. Morris and Jacques André (ed.), <em>Raster imaging and digital typography 2: papers from the second RIDT meeting, held in Boston, October 14-16</em>, 1991 New York, 1991, pp. 34-42</p>
      <p>I used the word non-trivial, because relating modes of <em>contrast manipulation</em> or <em>contrast <strong>re-production</strong></em> in punchcutting--as well as in bezier or spline adjustment in digital type design--to modes of <em>contrast <strong>production</strong></em> in the activity it is continuous with (and keeps reasserting it's continuity with--Hrant might say: to it's detriment!) is intstructive (because it gives us insight into the internal logic of typographical history), and it might provoke even more drastic norm violations (relative to the stroke of the pen) in our contrast manipulations.</p>
      <p>(And it is possible that fundamental--rather than incidental--norm-violations, such as those introduced in Bloemsma's Legato, where the violations are neither additive or subtractive (or based on sampling, like for instance Fudoni), might lead to something that is advantageous from a 'heightened readability' point of view.)</p>
      <p>Chris: who?</p><div class="imageWrap"><img src="http://typophile.com/files/][img:"></div><div class="imageWrap"><img src="http://typophile.com/files/][img:"></div><p></p>
    html_clean: |-
