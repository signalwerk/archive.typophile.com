      <p>Thanks, Peter. My translation: the moving line model helps illuminate the history of type because its evolution is influenced by the changes in pens, and the moving line is a kind of mathematically generalized pen. Different variations in the moving line--translation, rotation, expansion, can characterize well different periods and the designs associated with them.</p>
      <p>I do find this idea very valuable, and look forward to reading the book. </p>
      <p>My only comment at this point would be that the moving line model has certain limits also. The modification of letter forms for type, as opposed to hand writing, takes into account optical illusions and the goal of evenness of color. There are also in roman type 'architectural' factors, viewing the character as a weighted object resting on the base line. So in so far as these are not pen-driven, the moving front model would mainly illuminate by how these typographic features break the rules of the physical pen.</p>
