      <p>&gt;expansion underlies bodoni</p>
      <p>Expansion (stroke contrast) is a quality of broad and split nibbed pens. It is also pleasing at the most basic level, as an example of comparative proportion, found in the golden section. But the exaggeration of this basic quality (prior to the 19th century) of type did not come from the impetus of writing instruments.</p>
      <p>It's extremely unlikely that type founders would have been inspired by calligraphers to produce the Didone style. In the first place, Calligraphers did not do vertical roman, because it is counter-intuitive. Stilted and wooden. You would need to use two pens to write a "Bodoni" -- a broad nib for the straight verticals and a split-nib for the curves. Secondly, it simply would not occur to a calligrapher to have any shape other than an oval for the heartline of a humanist (as opposed to blackletter) "o". The kinked "heartline" diagram you've linked to is theoretically possible, but physically impractical, if not impossible -- there's no leeway for even the slightest deviation without it looking cack-handed. Thirdly, calligraphers had been doing high-contrast lettering for centuries.</p>
      <p>The spur to the Baskerville style was engraving, a form of printed reproduction in direct competition with typography. Consider the 18th century illustrated pattern books of Robert Adam, Thomas Chippendale, etc., where the exquisitely engraved lettering on the plates is directly comparable with the much cruder letterpress typography on the text pages. It must have been galling. </p>
      <p>And the famous example, Pine's Horace from the 1730s, where the whole book was engraved, after it had been typeset "for position".</p>
      <p>The conceptualization behind Baskerville's rationalization is towards one end -- achieving maximum finesse on a par with the engraved letter. </p>
      <p>The schema behind the didone 'o" is not a written heartline, but this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Ohoh.jpg"></div><p></p>
