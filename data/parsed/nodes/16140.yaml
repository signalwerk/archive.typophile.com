      <p><em>It might be more accurate to say that the type of contrast or contrast manipulation inherent in the Baskerville types and the Didonis is based on the type of contrast produced by the split-nibbed pen. And that this is applied to letterform-construction protocols that are considerably older.</em></p>
      <p>I'm happy to agree with the first part of this, but not with the second. The stroke manipulation model of the split nib heavily influeces 'letterform-construction protocols'. Indeed, I'm not sure what protocols exist that are not dictated or informed by the stroke manipulation as combined with the ductus angle. The way bowls join to stems, for example, is very different in Baskerville's types from that employed in oldstyle types from Jenson to Caslon. This is precisely what I think of as 'letterform-construction'. The only shared protocols of the oldstyle types and the neo-classical are conventions of Italian humanist letter shape that precede both, and which are so general as to be uninteresting to contrastive analysis. Yes, both Jenson's a and Baskerville's a look like the humanist letter a, but it is everything that makes them different that is important. The relationship between them is not linear: Baskerville takes a step sideways, drawing on his experience as an engraver and responding to the stroke manipulation common in the handwriting of his day. There is no more a linear relationship between Jenson and Baskerville than there is between Arrighi's chancery hand and Bickham's round hand.</p>
