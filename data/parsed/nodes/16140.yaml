      <p>That's many steps on a single path. The immediate step is from Caslon to Baskerville. Whether it's forward or sideways, it's still part of a linear temporal narrative. But with Morris you had to go back in time and start over, and with the Bauhaus you had to start from scratch. Both despised the Scotch modern.</p>
