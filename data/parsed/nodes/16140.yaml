      <p>I don't consider the evolution from Jenson to Scotch roman as entirely linear. It is linear from Jenson to Caslon -- you can actually trace the direct influences, and even movement of particular punchcutters or their types, through France to the Netherlands to England. But Baskerville's types deserve to be seen as a truly revolutionary development -- within the necessarily conservative confines dictated by the conventions of the received alphabet and the restrained nature of neo-classicism* --: the 'mainstream' splits into myriad rivulets after him. And I think Noordzij is essentially correct, that what drives this revolution in type design is the change in the dominant writing tool during this period, from a broad-nib to a split-nib, reinforced in Baskerville's case by his experience as an engraver.</p>
      <p>* If I may be forgiven a somewhat obscure architectural parallel, Baskerville is the Durham to Didot's St Denis: everything that is necessary to the romantic typeface is present in Baskerville's neo-classical types, only restrained.</p>
