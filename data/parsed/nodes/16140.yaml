    html: "<p>A nod to the romain du roi is certainly in order, and I should have mentioned it. But the typical characterisation of the romain du roi as 'drawn from scratch in a rationalist way' is apparently incorrect: the minutes of the committee meeting reveal that the design was based on the handwritten letters of Nicolas Jarry. These forms were transferred to the famous grid, leading to the perception that the type was designed by way of a grid. In fact, the romain du roi and Baskerville's types are both based on split-nib written models.</p>"
