      <p>There is very little lettering or type that can be specifically identified as rococo in the sense of belonging to that aesthetic movement and its time. Of course, there is a lot of 19th century split-nib calligraphy that could be might be adjectively referred to as rococo in exhibiting extreme ornament, but this is done after the rococo period has ended and when other arts have passed through neo-classicalism to romanticism.</p>
      <p>Romanticism inherits the rationalist axis from neo-classicism, just as it inherits the symphony orchestra. It isn't romantic in itself: it is what romantics do with it that matters.</p>
