    html: <p>In the fine arts, especially music, romanticism persists and evolves through the 19th century. But I think it is useful to consider Victorian as a distinct, parallel movement, especially with regard to applied arts. Victorian arts represent a kind of domesticated romanticism, from which revolutionary threat has been excised and replaced by middle-class stolidity. I think this is the context of the Scotch romans and their popularity in Victorian England.</p>
