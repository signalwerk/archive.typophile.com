      <p>Not sure. The base sense is obvious; on the other hand the only thing that's clear to me concerning the rich, relevant sense of the term is that it's central to the human existence (much more so than something Modernistically appealing like rotation). I have yet to grasp the true depths of the issue, but I feel strongly that the way the human "machine" is physically built* makes the proper -if maybe always fuzzy- consideration of laterality a big, golden key.</p>
      <p>* And I don't mean "intelligent design", thank you very much.</p>
      <p>BTW, "The Alphabet and the Brain" is only book I know of that considers the readability facet of laterality with any seriousness; unfortunately the basic premise of the book's editors has a chauvinistic undercurrent.</p>
      <p>hhp</p>
