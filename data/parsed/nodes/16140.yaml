      <p>In Dan Hosek's <em>Serif: The Magazine of Type &amp; Typography</em> #1 (Fall 1994) Bringhurst includes in the Romantic Roman genus "many of the romans of Bodoni, Vafflard and the Didots, Austin Scotch Roman, the romans of Marcellin-Legrand and Walbaum."</p>
      <p>A fuller description can be found in <em>Serif</em> #4 &amp; 5 (Spring, 1996 and Fall 1997) Under the titles: "The Invisble Hand: Neoclassical Letterforms" and "The Invisble Hand: Roman and Italic type in the Romanitic Age"</p>
      <p>The second of the two begins: "Neoclassicism and Romanticism are two antagonistic, interdependant halves of a single movement in the history of European culture.The line between the two is often hard to find, yet it marks one of the major evolutionary ruptures in the hiistory of European culture, and in the history of European letterforms."</p>
      <p>For Gerrit Noordzij, using his catalogue of contrast types, romanticism corresponds to <em>expansion</em> and encompasses the baroque, and classicism.</p>
