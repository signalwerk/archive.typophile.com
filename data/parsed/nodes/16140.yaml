      <p><em>In fact, the romain du roi and Baskerville’s types are both based on split-nib written models.</em></p>
      <p>I wonder if this is entirely accurate. The <em>romain du roi</em> might have been based on the handwritten letters of Nicolas Jarry, but the Baskerville types might not be based on written models per se. It might be more accurate to say that the <em>type of contrast</em> or <em>contrast manipulation</em> inherent in the Baskerville types and the Didonis is based on the <em>type of contrast</em> produced by the split-nibbed pen. And that this is applied to letterform-<em>construction</em> protocols that are considerably older.</p>
      <p>James Mosley <em>Typography Papaers • 2 • 1997</em> cites the <em>romain du roi</em> as the first type for which a preliminary 'design' is known to have been made, and sees the associated <em>pied du roi</em> as the basis for the reform of type bodies (≠ typeform).</p>
