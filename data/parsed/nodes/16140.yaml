      <p>William: <em>the moving line model has certain limits also.</em></p>
      <p>Think of it as a coarse-grained template-like reference point for getting a handle on typographic stroke-contrast, rather than as a mechanism for 'thick description,' i.e., for charting each inflection of every constructed stroke and terminal.</p>
