      <p>You fail to mention the <cite>little</cite> problem... GN's cube is missing (by his own admission) something central to good type design: the dimension of scale. And it is missing this because chirography cannot go that deep; it is a plaything of the surface. Optical scaling is anti-chirographic, and in more ways than one.</p>
      <p>As for Legato, it very much is an exception (no matter how badly a Modernist wants to put everything under the sun among his neat row of boxes) because it treats the Black and White as equals (on some level, and an important level). 1) Chirography cannot do this, no matter how sincerely it wants to; 2) There certainly are other fonts that are anti-chirographic, but only by circumstance, and not in a way that can really hope to mark progress; all such efforts have been oblivious to good notan. In some cases (like WAD) the designer didn't even realize he was being anti-chirographic! Dwiggins actually thought the only reason for extenders was aesthetics. Puhleez. The thing is, he was so genially good in other ways that he made up for the theoretical void between his ears.</p>
      <p>Legato is an instance of progress in our craft that virtually nobody else could have carried out. Every type designer should have the humility to learn from it.</p>
      <p>hhp</p>
