      <p>&gt;what drives this revolution in type design is the change in the dominant writing tool</p>
      <p>To add to this, I would say that technology was the main force of change during that one long sequence from Jenson to Scotch.</p>
      <p>Perhaps it was also the instrument precipitating Morris' revivalism, in the shape of the slide projector that Emery Walker used to show him Jenson's typography blown up huge, decorating the wall like the tapestries and wallpaper that Morris so loved.</p>
      <p>Other instruments of 19th century change: stereotyping in the 1830s which allowed an increase in sharpness and detail, and the Benton punchcutter of the 1880s, which allowed type to be made more directly from drawings -- that really let the cat out of the bag.</p>
      <p>A number of design developments softened the dominance of the Jenson-Scotch sequence in the early 19th Century: diversification of weight and scaling; decorative display fonts; invention of the sans; the Caslon revival (not a re-drawing, but a re-casting from extant moulds). But these did not affect the basic form of roman text type. What Morris did was like introducing a flashback into a movie or novel, disrupting the narrative sequence. His version of Jenson was not a revival, but a caricature; and a little later we find Cheltenham has become the most popular new typeface -- a post-Modern design that applies an industrial finish to old-style proportions.</p>
