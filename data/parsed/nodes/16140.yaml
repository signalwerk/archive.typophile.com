      <p>The thing to remember about romanticism is that it tended to be strongly linked to nationalism, and hence the typographic expressions of romanticism are quite particular to individual countries. As Hrant notes, Walbaum is the more readable of the romantic types, and would be a fine choice indeed if you are happy to evoke specifically German romanticism.</p>
      <p>English romanticism didn't really produce any types of its own, so in that context you have the choice of using the later neo-classical British types such (of which I would recommend Bulmer) or opting for the imported Italian style.</p>
