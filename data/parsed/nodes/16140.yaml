      <p><em>Expansion (stroke contrast) is a quality of broad and split nibbed pens.</em></p>
      <p>This is not what I -- or Noorzij -- means by expansion. Expansion is a particular kind of stroke contrast, and is contrasted with translation, which is the kind of stroke contrast one gets from broad nibbed pen. The third kind of contrast is produced by rotation. None of these are 'pure': in practice some amount of rotation is almost always present in all writing, even if it is not the dominant and intentional method, and if you press really hard with a broad nib pen you can produce a kind of expansion. Again, what Noordzij is providing is an analytical tool: a way of looking at strokes and determining what is happening within them. The practical usefulness of this analysis is e.g. in determining the degree and kind of consistency across a collection of letters.</p>
      <p>The Didot and Bodoni types, of course, represent a rationalist exaggeration of 'the swelling line' -- to use the term James Mosley adopted to describe Cresci's influential calligraphy --, but the point is that it is describable in terms of the expansion model of stroke construction.</p>
    html_clean: |-
