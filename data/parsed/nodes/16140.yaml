      <p>It's not just the pen.<br>
      18th C. copperplate engraving put typography to shame with its finesse.<br>
      And the stone carved lettering in church and churchyard was equally magnificent.<br>
      Both these high-contrast genres introduced non-pen stress long before it appeared in type.</p>
      <p>&gt;linear relationship between Jenson and Baskerville</p>
      <p>That's many steps on a single path. The immediate step is from Caslon to Baskerville. Whether it's forward or sideways, it's still part of a linear temporal narrative. But with Morris you had to go back in time and start over, and with the Bauhaus you had to start from scratch. Both despised the Scotch modern.</p>
