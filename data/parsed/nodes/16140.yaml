      <p>Nick Shinn: "Legato is no exception" / "[Noordzij's <em>The stroke</em> / moving front] not my kind of thing"</p>
      <p>Hrant Papazian: "mine even less" / "rotation is [...] boring" / "what is gained?: a cozy illusion is maintained" / "a veritable black hole elsewhere, one that would suck all the progressive juices from most any mind"</p>
      <p>Let me plunge in and start sucking:<br>
      1) Legato <em>is</em> no exception.</p>
      <p>To understand what follows, you will need to have looked at:<br>
      a) <a href="http://www.evertbloemsma.nl/legato/about_legato/about_legato.asp" title="http://www.evertbloemsma.nl/legato/about_legato/about_legato.asp">http://www.evertbloemsma.nl/legato/about_legato/about_legato.asp</a></p>
      <p>b) <a href="http://www.enneson.com/public_downloads/pe/typophile/paillason_sm.jpg" title="www.enneson.com/public_downloads/pe/typophile/paillason_sm.jpg">www.enneson.com/public_downloads/pe/typophile/paillason_sm.jpg</a></p>
      <p>And it would help to have read:<br>
      i) "The Franklin Letter" in <em>Letterletter</em>,<br>
      ii) Chapter 8 (Changes in contrast) of Gerrit Noordzij's <em>The stroke</em> and<br>
      iii) Gerrit Noordzij's 1991 contribution to Robert A. Morris and Jacques André (ed.), "<em>Raster imaging and digital typography 2: papers from the second RIDT meeting, held in Boston, October 14-16, 1991 New York</em>, 1991, pp. 34-42, paying special attntion to the following two images:<br>
      <a href="http://www.enneson.com/public_downloads/pe/typophile/gn_cube_sm.jpg" title="www.enneson.com/public_downloads/pe/typophile/gn_cube_sm.jpg">www.enneson.com/public_downloads/pe/typophile/gn_cube_sm.jpg</a></p>
      <p><a href="http://www.enneson.com/public_downloads/pe/typophile/cube_underside_sm.jpg" title="www.enneson.com/public_downloads/pe/typophile/cube_underside_sm.jpg">www.enneson.com/public_downloads/pe/typophile/cube_underside_sm.jpg</a></p>
      <p>Gerrit Noordzij's schema for contrast exaggeration is this:<br>
      <a href="http://www.enneson.com/public_downloads/pe/typophile/contrast_change_exag.jpg" title="www.enneson.com/public_downloads/pe/typophile/contrast_change_exag.jpg">www.enneson.com/public_downloads/pe/typophile/contrast_change_exag.jpg</a></p>
      <p>(Noordzij: The top of the block is a cross with a given contrast. Proceeding towards the bottom the thicker stroke becomes thicker, so that every horizontal cross-section shows a greater contrast than the top. An end of increases in contrast is reached when the thin stroke no longer has a meaning: at the bottom of the block the cross has turned into a rectangle.)</p>
      <p>Gerrit Noordzij's schema for contrast reduction is this:<br>
      <a href="http://www.enneson.com/public_downloads/pe/typophile/contrast_change_decr.jpg" title="www.enneson.com/public_downloads/pe/typophile/contrast_change_decr.jpg">www.enneson.com/public_downloads/pe/typophile/contrast_change_decr.jpg</a></p>
      <p>(Noordzij: The thin stroke becomes thicker towards the bottom. The effect is a decrease in contrast. The endpoint of this decrease is reached when the strokes are equally thick.)</p>
      <p>The basic scheme for the contrast in most Bodini romans is contrast exaggeration on an expansion frame following the model of Paillason's "Premiere Position"<br>
      The basic scheme for the letter "T" in the title page to Bodoni's <em>Essai des caracteres de l'imprimerie</em> (discussed in "The Franklin Letter") is shown in Paillason's "Seconde".</p>
      <p>The basic scheme for the traditional sans serif is contrast reduction on an expansion frame (contrast reduction makes serifs superfluous: it eats them up). The expansion base accounts for the vertical stress Bloemsma emphasizes as characteristic of univers and Helvetica.</p>
      <p>Bloemsma's <em>Balance</em> is contrast reduction on the contrast type shown in Paillason's "Seconde"</p>
      <p>In <em>Legato</em> Bloemsma has found his way onto the back row in the base of Gerrit Noordzij's cube (top row of the 5 x 5 "cube_underside" grid). This row represents contrast reduction on a translation base (with the caveat that some rotation has been added--making the face neo-mannerist). And he has done this not by starting from translation, but from an introduction of inner form / outer form counter-rotations in an expansion based context.</p>
      <p>On inspection, the tension caused by Bloemsma's rotation seems to make the white of the word more active or salient vis a vis the black. Here he is in a line that includes W. A. Dwiggins. If I am right (in my understanding of perceptual processing in reading) about the place of 'the map of salient whites' in reading (see the "bouma as bounded map thread") we can see why Bloemsma is justified in thinking he is reconnecting (optically, 'after-helvetica') the single units of our scripts, or restoring  and extending the optical integrity of the wordform.</p>
      <p>Because Bloemsma's achievement circles back around to meet translation plus rotation, we learn something about mannerist and neo-mannerist (Bringhurst says: Lyrical Modernist) form. That is, we learn something about what's (mostly) boring, and what is to be gained by reading.</p>
