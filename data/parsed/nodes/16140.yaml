      <p>Legato does not address the dimension of scale.* Doing so would actually not be exceptional (although it would still be great, as well as anti- or at least non-chirographic) since that's been done before. Legato's "first" is in the domain of notan; the ideal form of which (at least in terms of text fonts) precludes the GN moving front (since it's hopelessly Black-centric).</p>
      <p>* Although it's interesting to note that Evert's fonts tend to work well small.</p>
      <p>&gt; did you mean lateral connectivity across the bounded map?</p>
      <p>I meant laterality of the human experience as a whole. Including things like the armature of the neck, and yes, the shape of the retina and lateral bouma effects, etc. In comparison, rotation seems to me to be in the conscious domain, and in a way artificial, or at least circumstancial and/or unintuitive; which is why the invention of the wheel was such a notable (and noted) leap, as opposed to just a "duh" moment.</p>
      <p>hhp</p>
