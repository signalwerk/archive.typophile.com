      <p>&gt;The Scotch Romans are Victorian, largely post-romantic.</p>
      <p>It depends when and where you place the Romantic period.<br>
      Romantic (classical) music lasted into the 20th century.<br>
      Robert Bringhurst compared historical type genres with movements in other arts, and extended Romanticism, as applied to type, through most of 19th century.</p>
      <p>Although he understands Neoclassicism and Romanticism as contemporary movements, he categorizes Romantic type as having evolved from Neoclassical, with greater contrast and finer details. This newer style, which was popular throughout the 19th century, especially in the US, is what we now term "Scotch" roman, or Modern (as in Modern 20). DeVinne and Torino are further examples. And certain display weights of Century.</p>
      <p>It seems to me that the first "moderns" of Didot and Bodoni showed a classical restraint and simplicity of design logic, whereas the Scotch moderns are romantic in their quest for the awesome, by exaggerating formal qualities: More contrast! Finer hairlines! Bigger serifs!</p>
