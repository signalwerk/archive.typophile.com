    <p>G'day.</p>
    <p>I'm trying to identify the typeface used in this company logo.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/yugo_4353.gif"></div><p></p>
    <p>I've attempted to straighten it up from this photo (so you can see it in context).<br>
