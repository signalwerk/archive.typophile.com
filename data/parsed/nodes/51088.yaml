    <p>I've tried Identifont &amp; WhatTheFont, but no luck.</p>
    <p>It resembles a Letraset font I saw when I was a kid, but no luck on the Letraset fonts either.</p>
    <p>Thanks in advance.<br>
    Warwick</p>
