    user: 38073
    date: 2009-09-08T09:57:00
    date_raw: 8 Sep 2009 — 9:57am
    votes: null
    html: |-
      <p>Sorry it's been a while but one of my Hard Drives went belly-up and I was working on recovering some of the files. I have lost a file where I had refined the serifs, but I don't think it was a great idea anyway, not at this stage at least.</p>
      <p>I made the face lighter, I think what I have now will produce a better colour at text size. I used Karen Cheng's  "Designing Type" book to determine width relationships between letters and it's more of a classic proportions typeface. The original idea was to somehow blend Modern and Classic elements but I went with Classic instead. Hopefully it'll be identified as "contemporary" when it's done.</p>
      <p>The "R" was indeed out of place. The skew on the O's counter was intentional but I guess it was too geometric, I adjusted that slightly I don't know maybe it still is awkward.</p>
      <p>I've redrawn the counters for the B P &amp; R. I'm satisfied with the stroke weight relationship now, but I could be wrong. Let's see what everyone thinks.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DentalNewsTypophile_Alphabet3_6031.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/DentalNewsTypophileSpecimen!_3658.png"></div><p></p>
      <p>I wanted to make a couple of notes on some of the letterforms, but I'll just wait for undistorted feedback (e.g. I'm in a hurry to go to school :P)</p>
