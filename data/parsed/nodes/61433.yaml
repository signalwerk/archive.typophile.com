    html: |-
      <p>Yes, good improvements! I’m still not sure about the J: this detail is found nowhere else in that alphabet*. But you should elaborate a bit on the tail of the Q: that could be much longer &amp; more elegant.<br>
      The middle bar of H seems too heavy. Me thinks that the right upstroke of U is a bit too thin. And maybe the thin strokes of N a bit too heavy, whereas the diagonal could be slightly heavier.<br>
      The bow of D should have the same weight as the ones of O and C.<br>
      S should be haevier in the middle, work on the horizontal thin strokes at the top and the bottom, they are too different.<br>
      The U is still too wide. Place your X into the text as well to see what needs to be changed there. It drwas too much attention to its serifs.<br>
      The overall proportions look good now.</p>
      <p>*) I know J is your initial, that is why you drew it first, but it looks like from a different alphabet.</p>
