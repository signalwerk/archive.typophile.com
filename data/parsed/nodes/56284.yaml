    <p>[Edit: This idea started in the <a href="http://www.typophile.com/node/55924" rel="nofollow">Fix Arial Type Battle</a>]</p>
    <p>I was casting around on a client project for a sans where I could modify the n &amp; m to match the geometric look of the logo (stemless) for their identity package. The project gave me an excuse to tinker on the Arial alphabet. Here's the lc (with alt n m) and a text setting:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/arial_client_3884.gif"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/arial_client2_5155.gif"></div><p></p>
    <p>I don't expect this to go further anytime soon. There's just enough to meet the deadline for the stationary package.</p>
