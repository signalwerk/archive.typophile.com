    date_raw: 21 Apr 2009 — 11:54am
    votes: null
    html: |-
      <p>Thanks for the comments. I think Arial is well hinted as rui abreu mentions, but also that the design is not as effective as other options for long stretches of running text, per Thomas.</p>
      <p>The forms do have a benefit:<br>
      I recently watched the Helvetica film, and one comment sticks with me (I forget who it was). They were saying that all the letters in Helvetica feel like they are set in concrete when next to each other. It is down to the closed forms, and vertical stress with low contrast IMO. There is massive lockup for almost all letter combinations. This stability results in fonts well suited for making logos and setting headlines. Sounds like a recipe for overexposure and dulled creativity, which I think is the root of most people's issues with the genre. </p>
      <p>However, as I said in the main post, this project has shed a positive light on both Helvetica and Arial for me. Whenever I've tried to improve something I perceive as lacking, the result is that I esteem it more.</p>
