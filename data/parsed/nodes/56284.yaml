      <p>I like that k form too. I think I originally got the idea from Walbaum, and originally implemented it in one of my first efforts to draw a workable font. It took me a while to find, but it dates way back to the dawn of Typophile, and my type journey. *Warning* the following link contains graphic images of font brutality:<br>
      <a href="http://typophile.com/node/110" title="http://typophile.com/node/110">http://typophile.com/node/110</a></p>
      <p>It played a bit part in a Typecon presentation in 2004, and there was some distinct snickering when the title went up. *sniff* Hehe. It is good to look back and see some progress.</p>
      <p>Edit for Nachos: It reads, but looks off balance, especially at the end of a word like "butter" ie round+stemless-r. The more the stemlessness goes in, the less workable in text. Dax and others counter this by injecting a corner for the missing stem. That allows them to bring the feature into the r,u,b,d,p,q etc.</p>
