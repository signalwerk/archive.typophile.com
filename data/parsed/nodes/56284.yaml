      <p>Not to me — I immediately think the opposite. The letterforms were not designed for legibility, and it shows. The superhinted screen rendering is nowhere near the legibility of, for example, Verdana. One needs the more open counters of a humanist sans design.</p>
      <p>In any case, I think I like what Randy did here. The corner treatment feels like overexposed phototype, and combines with the missing stems to yield an interesting retro-futuristic feeling. (Having not gone back to re-read the whole thread, probably somebody else already said that....)</p>
      <p>Cheers,</p>
      <p>T</p>
