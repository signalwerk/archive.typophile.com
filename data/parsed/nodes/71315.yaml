      <p>Yes, some words would be nice. :]</p>
      <p>Just looking at the alphabet though, some things do stand out to me.</p>
      <p>- /v/ and /u/ may need more differentiation<br>
      - the strokes could remain thin when curves meet stems (for example, in /h/)<br>
      - it kind of feels as though /s/ ought to have those big ball terminals...</p>
      <p>Anyway, I'd hardly call myself even at the level of novice, so take my words with a grain of salt!</p>
