    <p>I'm redesigning my website and I'm in the process of testing out the build in different browsers.  Everything looked fine on IE6, IE5.5, FF, and Opera on the PC, but when I had it tested in Safari on the Mac, I noticed that the machine didn't have Georgia at all and the text was rendered in Times instead.  This got me thinking, how common is Georgia on the Mac?  I did some research and found out that it seems to be bundled with the newest versions of OSX and IE on Mac.</p>
    <p>My question is this: What font should I substitute Georgia with for those users that don't have it?  I'm thinking of some a seriffed face with a large x-height and a big appearance like Georgia does.  This would have to be a standard Mac font that has been bundled with OS's for the last 5-10 years.  A Scotch roman would be perfect.  But anything with a large x-height that comes bundled with the Mac will work.  Times looks so small compared with Georgia.</p>
    <p>This is how it would be styled:<br>
    <code>font-family: georgia, mac-font, serif;</code></p>
    <p>Thanks!</p>
