      <p>Tiffany,</p>
      <p>I don't know too much about the Safari browser setup since I'm screenshots from an online service.  I'm just using one stylesheet since fonts aren't really browser-specific, and no plug-ins at all.</p>
      <p>My problem pretty much is that there's no good standard serif to subsitute Georgia with on those machines that is missing the font since everything else looks pretty tiny in comparison.  A six-line paragraph would be only about 4 lines when you use Times, Baskerville, or other standard seriffed text fonts.  What would be ideal is to increase the size of the text from let's say 11px to 12px for any other font than Georgia.</p>
      <p>So we'd have something like:<br>
      <code>Georgia 11/16 or Times 12/16</code></p>
      <p>And this isn't possible using regular CSS and I don't want to use SIFR, or anything like that.  So I guess I have to assume that most users have Georgia, and if they don't the text will be a bit smaller.</p>
