      <p>I’m sure you know this, but you really cannot control what font, font size, or word wrap people will see. </p>
      <p>But of course it does make sense to try to allow for some control for viewers who don’t circumvent it. </p>
      <p>The Codestyle web site surveys font usage on the web (using RSS sampling in some way, so it is at least somewhat objective). According to the most recent list (August 27), the web-optimized fonts most in use on both platforms are, in order: Verdana, Trebuchet MS, and Georgia. FWIW. </p>
      <p><a href="http://www.codestyle.org/css/font-family/sampler-CombinedResults.shtml" title="http://www.codestyle.org/css/font-family/sampler-CombinedResults.shtml">http://www.codestyle.org/css/font-family/sampler-CombinedResults.shtml</a></p>
