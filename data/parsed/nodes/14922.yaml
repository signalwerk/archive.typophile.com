      <p>For nicer URIs … Oh, dumb me. Of course! I must have been especially dim this afternoon! Thanks.</p>
      <p>A Mac user who installs OS 9 or any OS X gets MS Internet Explorer as a matter of course, and the screen fonts are installed as well. If they do nothing, they have them. OS X users also get Lucida Grande, of course; it has no italics, but does have a larger x-height.</p>
      <p>Mac users account for less than 15% of web surfers, of course.</p>
      <p>Anyway, we do need to keep reminding ourselves that we have very little control over the way readers see our sites. That is the path toward sanity!</p>
      <p>Good luck with your site. </p>
      <p>--Kathleen</p>
