      <p>&gt;I guess that in a couple of years people will be using the Vista/Longhorn fonts on their webpages, and Mac users won’t have access to those, so we’ll run into the same kind of problem again, down the road.</p>
      <p>The ClearType team is not promoting these as Web fonts. Specifically because…</p>
      <p>1. No plans to produce a redistributable pack - the thing that convinced Web page designers that Verdana, Georgia et al would always be freely available even if not bundled.<br>
      2. Fonts only target ClearType - don't render well 'down-level' on platforms with no CT support or where CT is turned off.  </p>
      <p>Regardless people will start specifying them on Web pages. Hopefully they'll be testing the pages with fall-back font choices as well as cross platform.</p>
      <p>Cheers, Si</p>
