      <p>I did some further experimenting with Georgia and Times New Roman on Windows XP.  In Photoshop I need to have 12px TNR for a paragraph of text to be as long as 11px Georgia (I tried different anti-alias modes; single line composer; no optical kerning).  But doing the same experiment in IE6 using CSS, I needed 15px TNR to cover the same length as a paragraph of text in Georgia 11px (TNR was taller but as wide).</p>
      <p>I used pixel sizes in both Photoshop and in HTML/CSS so that it'd be resolution independent and all that jazz.  How come there is such a big difference in size btween Photoshop (CS2) and the web?  Is it all about rendering? Georgia is hinted in such a way that it appears real big and wide?</p>
      <p>I love Georgia, but it's hard to use an alternative since all text will reflow dramatically.   If you can't tell, I obsess over small details.  :)</p>
