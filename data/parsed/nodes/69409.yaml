    <p>I am in the process of designing a book that features some polaroid photograpy. I'm thinking of doing the title of the book as well as the major headlines/subheads in a slab serif while having the body copy and captions in a sans serif typeface.</p>
    <p>Just wondering if anyone can recommend a really good sans serif typeface to go with a slab serif?</p>
