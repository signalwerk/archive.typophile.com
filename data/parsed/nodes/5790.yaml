  html: <p>It reminds me of Chuck Davis's <a href="http://www.letterheadfonts.com/contributors/chuckdavis/denise.shtml" target="_blank">Denise</a> at Letterhead Fonts, but it looks custom. It could be a font with swashes that has been set along a path and/or distorted too, but as usual, when there are no duplicate letters, telling if it is custom is mostly guessing.</p>
