    <p>Hi,</p>
    <p>I was wondering if anyone could help me out with finding a typeface that is similar to Christian Schwartz’s DB News<br>
    <a href="http://www.christianschwartz.com/dbnews.shtml" title="http://www.christianschwartz.com/dbnews.shtml">http://www.christianschwartz.com/dbnews.shtml</a></p>
    <p>Christian actually recommend me to check out Garamond no. 3 and I do agree that it is very similar but there is just something about the DB News typeface that makes it different with the serifs.</p>
    <p>Thanks!<br>
    Rob</p>
