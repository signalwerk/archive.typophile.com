      <p>If you want something in that kind of plain oldstyle vein, but not quite as soft as Garamond No.3, then take a look at James Montalbano’s <a class="freelinking-external" href="http://www.terminaldesign.com/fonts/characters/?ID=56">Rawlinson</a> — an underappreciated family, IMO. I like its sturdy, plain-spoken qualities. It’s not as sharply cut as Christian’s DB News, but it shares some DNA.</p>
      <p>— Kent.</p>
