  html: |-
    <p>Short for <a href="/wiki/Portable%20Document%20Format" class="freelinking" rel="nofollow">Portable Document Format</a>, an <a href="/wiki/Adobe%20Type" class="freelinking" rel="nofollow">Adobe</a> technology that allows people to share documents that preserve their original appearance, including embedding the specific fonts used in the document. PDFs can also contain interactive elements such as web and email links and form fields.</p>
    <p>Though other applications can create PDFs, the primary application for creating and modifying PDFs is <a href="/wiki/Adobe%20Acrobat" class="freelinking" rel="nofollow">Adobe Acrobat</a>. Portable Document Format has gained in popularity and credibility as many professional printing houses request high resolution PDFs as the default format.</p>
    <p>Some type designers and type <a href="/wiki/Foundry" class="freelinking" rel="nofollow">foundries</a> have reservations about the security PDFs as it is still possible for dedicated hackers to pull font <a href="/wiki/Outlines" class="freelinking" rel="nofollow">outlines</a> from a PDF. For this reason some foundries' <a href="/wiki/EULA" class="freelinking" rel="nofollow">EULAs</a> disallow embedding their fonts in PDFs.</p>
