    html: <p>Also, one caveat about the "cast shadow" effect I did in the second sample... It's made of individual copies of the black stroke layer, so if you zoom in or print it out you would see tiny stair steps. One way around this is to increase the number of steps and reduce the distance between them. The other would be to not rely on such a short cut and actually draw it. The 3-d extrude can do it too, but it tends to be a little imprecise for this kind of shadow and the artwork you get when you expand the appearance is a little, I don't know, messy.</p>
