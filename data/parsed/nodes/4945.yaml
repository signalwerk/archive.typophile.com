    html: <p>Thanks Peter for alerting me to this thread! <br>My book (<a href="http://www.logofontandlettering.com" target="_blank">http://www.logofontandlettering.com</a>) was completed just as Adobe released Illustrator CS. I was able to acknowledge--somewhat in passing--that the new AI version had 3-D extrude tools, but I couldn't say more.  <br> <br>I just played around with Appearance and 3D extrude with ambient shading in AI CS and yes, they add a whole new dimension. It's a miracle!  <br> <br>There are a few problems, though. The shading gets put in as bands that are too low res. Each band is an individual object which makes editing difficult (too many points flying around) and gets us into issues of trapping if we're doing this for publication.  <br> <br>Also, I tried a couple of layers of fills and strokes followed by a 3D extrude and when it was done, 3 of my letters ended up behind the top fill layer, so this is a bug, I presume.   <br> <br>The revision of my book--eventually--will have to cover these new AI features, though! However, I'm thinking that I would still very likely build my own shadows because there's always a superficial feeling to out-of-the-box features like these. But maybe  <br>I'm just futilely trying to resist progress. <br>Leslie <br> <br></p>
    html_clean: <p>Thanks Peter for alerting me to this thread! <br>My book (<a href="http://www.logofontandlettering.com" target="_blank">http://www.logofontandlettering.com</a>) was completed just as Adobe released Illustrator CS. I was able to acknowledge--somewhat in passing--that the new AI version had 3-D extrude tools, but I couldn't say more.  <br> <br>I just played around with Appearance and 3D extrude with ambient shading in AI CS and yes, they add a whole new dimension. It's a miracle!  <br> <br>There are a few problems, though. The shading gets put in as bands that are too low res. Each band is an individual object which makes editing difficult (too many points flying around) and gets us into issues of trapping if we're doing this for publication.  <br> <br>Also, I tried a couple of layers of fills and strokes followed by a 3D extrude and when it was done, 3 of my letters ended up behind the top fill layer, so this is a bug, I presume.   <br> <br>The revision of my book--eventually--will have to cover these new AI features, though! However, I'm thinking that I would still very likely build my own shadows because there's always a superficial feeling to out-of-the-box features like these. But maybe  <br>I'm just futilely trying to resist progress. <br>Leslie <br> <br></p>
