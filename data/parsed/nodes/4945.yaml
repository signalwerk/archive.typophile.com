    html: <p>I did actually try it before I recommended it, so I can swear that it works. <br> <br>Type the text. <br> <br>Select the text block with the regular pointer. <br> <br>Add a stroke by double-clicking on the stroke icon in the tool palette (or typing shift-x). If needed, adjust stroke thickness and color using the stroke palette, and text fill color using the fill palette. <br> <br>Still with the text block(s) selected, go to Effect - Path - Offset Path, and set the offset to half the stroke thickness. <br> <br>Maintaining selection, go to Effect - Stylize - Drop Shadow and add your drop shadow. <br> <br>You know have the entire effect working on the live text in one layer. <br> <br>T</p>
    html_clean: <p>I did actually try it before I recommended it, so I can swear that it works. <br> <br>Type the text. <br> <br>Select the text block with the regular pointer. <br> <br>Add a stroke by double-clicking on the stroke icon in the tool palette (or typing shift-x). If needed, adjust stroke thickness and color using the stroke palette, and text fill color using the fill palette. <br> <br>Still with the text block(s) selected, go to Effect - Path - Offset Path, and set the offset to half the stroke thickness. <br> <br>Maintaining selection, go to Effect - Stylize - Drop Shadow and add your drop shadow. <br> <br>You know have the entire effect working on the live text in one layer. <br> <br>T</p>
