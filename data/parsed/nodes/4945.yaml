  html: <p>Hey. Do any of you know whether you can create a text style that has three layers of type? <br> <br>I am designing a DVD menu system and each menu item has a top layer, a middle outline layer, and a bottom offset layer for a drop shadow effect.  I have to translate this system into three languages and it's turning out to be a big pain in the ••• to edit three type layers for every item x three languages! <br> <br>I tried making a text style but it only works on one layer of type. <br> <br>Any suggestions? <br> <br>Thanks, <br>peter </p>
