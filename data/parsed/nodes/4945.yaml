    html: <p>Peter -- <br> <br>In illustrator <br>set three layers, but don't create outlines. <br>You can still use your Character palette <br>to change the font, the size, etc. <br> <br>In your three-item cluster ... <br> <br>1. Top, non-eroded <br>2. Outline <br>3. Drop shadow, nudged 1 pt down, 1 pt. right <br> <br>copy the three-item cluster each time you need it. <br> <br>Now, to change the words ... <br>use your 'A' or Type tool and click on the <br>mass of three elements and it'll select the  <br>top one by default. Make the changes to the top layer, then immediately <br>LOCK that top version. (OBJECT &gt; LOCK) <br>Repeat on Layer 2 with the Type Tool. <br>LOCK. <br>Repeat on layer 3. <br> <br>Then Unlock ALL and move the cluster <br>around as a GROUP. <br> <br>bj <br> <br>easier demonstrated <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br></p>
