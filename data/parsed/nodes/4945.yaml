    html: <p>I think maybe you're going at the problem backwards. <br> <br>There's no reason you need to use more than one layer for this. Use a stroke on the type, and use Illustrator's own drop shadow capabilities. <br> <br>The stroke will tend to erode the type. If Illustrator doesn't have the option to simply place the stroke behind the object (not sure), you can set the path offset to half the stroke thickness, and that should eliminate the problem. <br> <br>Regards, <br> <br>T</p>
