    html: |-
      <p>I tried it in both 10 and CS and it works the same. Try this: <br> <br>1. Set some large text. <br>2. Switch to the solid arrow tool. (The text should now be selected as an object.) <br>3. In the Appearance palette, do Add New Stroke and set the stroke thickness to 6 points and the color to red (to make it easier to see what's going on). <br>4. Illustrator automatically adds an empty Fill layer to the appearance palette. Click on it and change it to yellow. <br>5. In the Appearance palette, drag the yellow Fill layer to above the Stroke layer. You now have the Fill in front of the Stroke, just as if you had pasted a stroked copy of the text behind the filled text. <br>6. Switch to the text tool again, select the text and type something else to see that it worked. <br> <br>Of course, use whatever attributes you want for colors, etc. The ones I chose were just to show how it works. <br> <br>To add a dropshadow: <br> <br>1. Swith back to the solid arrow tool. Make sure the text block is selected. <br>2. In the Appearance palette, do Add New Stroke. <br>3. Change the color of the new stroke to black. <br>3. Rearrange the layers in the Appearance palette so the new stroke is below the other stroke and fill. <br>4. With the new stroke selected in the Appearance palette, do Effect &gt; Distort &amp; Transform &gt; Transform. Type 3 pt and -3 pt in the Move area of the dialog box and click OK. <br> <br>Now you've got a dropshadow. Here's what mine looks like: <br> <br><img src="http://www.typophile.com/forums/messages/30/36865.gif" alt="foo"> <br> <br>Here's the Illustrator CS file: <br> <br></p>
      <!--attachment: foo-36866.ai*attachment_icon.gif*application/postscript*444.2*foo2*foo%2eai --><!--attachment: foo-36866.ai*attachment_icon.gif*application/postscript*444.2*foo2*foo%2eai --><p></p><center><br>
      <table border="1">
      <tbody><tr>
      <td><img src="http://www.typophile.com/forums/icons/attachment_icon.gif" align="left" alt="application/postscript">foo2<br><a href="http://www.typophile.com/forums/messages/30/foo-36866.ai" target="_blank"><b>foo.ai</b></a> (444.2 k)</td>
      </tr>
      </tbody></table>
      <p></p></center><p></p>
      <!--/attachment--><!--/attachment--><p> <br> <br>You can also change the stroke characteristics, transparency, etc. Just be sure to select the proper component in the Appearance palette first. <br> <br>Once you have everything set up, you can drag the appearance into the Style palette so it can be applied to other text.</p>
