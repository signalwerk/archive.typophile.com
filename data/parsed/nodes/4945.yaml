    html: <p>Huh. I've been playing around with this in Illustrator and you <b>can</b> do exactly what you want.  <br> <br>The key is to modify the appearance of the text by selecting it as an <b>object</b> (using the arrow tool), not as <b>text</b> (using the text tool). When it is in object mode, you can change the stacking order of the stroke and fill in the appearance palette. You can't when the text is selected as text.  <br> <br>Doing it this way means that the effects will apply to the whole text block, but that would only be a problem if you wanted to use the style within a text block. It doesn't sound like that's the case.  <br> <br>You change the stacking order of the strokes and fills by dragging them up and down in the Appearance palette. Also, you can add as many strokes and fills as needed and modify them with the Effects menu. With the appropriate stroke or fill selected in the Appearance palette, use Effects -&gt; Distort &amp; Transform -&gt; Transform to do the dropshadow effect.</p>
    html_clean: <p>Huh. I've been playing around with this in Illustrator and you <b>can</b> do exactly what you want.  <br> <br>The key is to modify the appearance of the text by selecting it as an <b>object</b> (using the arrow tool), not as <b>text</b> (using the text tool). When it is in object mode, you can change the stacking order of the stroke and fill in the appearance palette. You can't when the text is selected as text.  <br> <br>Doing it this way means that the effects will apply to the whole text block, but that would only be a problem if you wanted to use the style within a text block. It doesn't sound like that's the case.  <br> <br>You change the stacking order of the strokes and fills by dragging them up and down in the Appearance palette. Also, you can add as many strokes and fills as needed and modify them with the Effects menu. With the appropriate stroke or fill selected in the Appearance palette, use Effects -&gt; Distort &amp; Transform -&gt; Transform to do the dropshadow effect.</p>
