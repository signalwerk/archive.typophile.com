    <p>I always felt that the letters of the Vimeo logo were poorly done. I want to see what you folks think of that, and my re-drawing of it. </p>
    <p>I posted this on Dribbble a few weeks back, and it surprised me to see how many designers loved the original logo.</p>
    <p>So here's my first stab, <a href="http://drbl.in/bxuJ" title="http://drbl.in/bxuJ">http://drbl.in/bxuJ</a> , and the followup to it: <a href="http://drbl.in/bxOL" title="http://drbl.in/bxOL">http://drbl.in/bxOL</a></p>
    <p>Thoughts?</p>
