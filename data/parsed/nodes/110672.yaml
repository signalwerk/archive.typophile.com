      <p>Note that since it's a logo, a letter doesn't always have to look the same; the second "a" can be different than the first – although in that case I would make the two "s"s a bit different as well. Just make sure such variance makes sense for the subject.</p>
      <p>BTW, the x-height is generally over-rated.</p>
      <p>hhp</p>
