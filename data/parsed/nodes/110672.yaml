    html: |-
      <p>I first read "Kisstells". It took a bit to realize the last letter is an /a, and it took far longer for me to realize that in that case the second letter is also an /a.</p>
      <p>I quite like the style, but I think you're thinking too much of typefaces. I agree with Hrant the x-height might not be so important here. I like the /k. I think I would look at this logo like a handmade script and bring more variety to the letter shapes and flow.</p>
      <p>As for associations, I find it difficult to say anything about this, but if I have to I would say it reminds me of stitch work which tries to become a graphic element or typeface.  I'm aware they're not mutually exclusive, but then associations aren't always rational. Either way, I think you have a good starting point here but you probably shouldn't be too conscious of the rules of typography. During the design process I wouldn't think of this logo too much as a typeface because that might be limiting in its forms.</p>
    html_clean: |-
