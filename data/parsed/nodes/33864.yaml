    html: |-
      <p>These are from the same engraving gadgets you see them use in the malls to make your custom license plate frames and desk nameplates. The <a href="http://www.tpub.com/engbas/3-35.htm" rel="nofollow">Leroy Lettering Guides</a> worked on a similar principle -- you trace the letter shapes that are engraved into a template and the pen (or engraving tool) at the end of the pantographic device reproduces the letter shape.</p>
      <p>- Mike Yanega</p>
