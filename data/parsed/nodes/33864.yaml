    html: <p>This is not really a "font" per se. There are machines for engraving letters in metal using a cutting tool. This looks typical of that method. They don't use "fonts" in the normal sense, instead tracing paths in the shape of letters. <a href="http://www.suregrave.com/wizzard-st.html" rel="nofollow">Here is an example of what I mean.</a> Originally, before they worked with computers, you would actually trace a sort of template with letters cut into it with a sort of pantographic mechanism. I remember seeing one of these when I was a kid. I believe the letter shapes go back to those older machines.</p>
    html_clean: <p>This is not really a "font" per se. There are machines for engraving letters in metal using a cutting tool. This looks typical of that method. They don't use "fonts" in the normal sense, instead tracing paths in the shape of letters. <a href="http://www.suregrave.com/wizzard-st.html" rel="nofollow" class="link-external">Here is an example of what I mean.</a> Originally, before they worked with computers, you would actually trace a sort of template with letters cut into it with a sort of pantographic mechanism. I remember seeing one of these when I was a kid. I believe the letter shapes go back to those older machines.</p>
