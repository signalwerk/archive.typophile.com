    html: |-
      <p>Those simple lines should be rather easy to trace in a drawing program. I found the shape of the P in <a href="http://www.myfonts.com/fonts/agfa/century-gothic/" rel="nofollow">Century Gothic</a> to be fairly close, but the A was a bit too wide, and the stroke was also a bit thicker in the regular weight. (Adding a leg to the P to make your R would be easy)</p>
      <p>- Mike Yanega</p>
