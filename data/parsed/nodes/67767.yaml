  html: |-
    <p>Here is the message FontLab gives me:</p>
    <p>&gt;&gt;&gt;[FATAL]  aborting because of errors:<br>
    syntax error at "-63"<br>
    [/Users/chrisL/Library/Application Support/FontLab/Studio 5/Features/fontlab.fea 11]<br>
    &lt;&lt;&lt;</p>
    <p>I had been cleaning up classes and getting rid of some duplicate commaaccent glyphs when I tried to recompile. The message above is what happened.<br>
    I then made a copy of the file and one-by-one deleted each feature and attempted to recompile between each removal to no avail. It seems as though it may be something in the classes but I am going nuts for 2 days now trying to find it!</p>
    <p>I am hoping someone can clue me in on my malfunction.</p>
    <p>Desperately seeking help,</p>
    <p>ChrisL</p>
