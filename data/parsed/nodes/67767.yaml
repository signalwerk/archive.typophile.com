    html: <p>Whenever I encounter a recalcitrantly corrupt file, I usually generate a Postscript Type 1 version, then open that in FontLab and work from there. It's a lot faster that copy glyphs individually into a new file and, so far, this method has effectively remove whatever voodoo resides in FL's OpenType apparatus...</p>
