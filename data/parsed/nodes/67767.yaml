      <p>Another "purifying" method:</p>
      <p>1. create a new, empty font<br>
      2. in the Font Info, copy all data from the corrup font<br>
      3. copy all glyphs from the corrupt font<br>
      4. in the empty font, right-click in the Font Window and choose "Append Glyphs"</p>
