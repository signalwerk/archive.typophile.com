    html: "<p>Paul Renner (c.1950), translated by Chris Burke in his \"Paul Renner\": <br> <br>\"The truly Modern, that is, the undistorted expression of an objective Zeitgeist, is only what we hold today to be timelessly perfect. This is not the same in all periods, because the insight into the timelessly valid changes from generation to generation\" <br> <br>and <br> <br>\"For the Modern is an idea, an unending task, never to be entirely resolved. We seek it on a narrow ridge, which drops away on one side into thoughtlessly adopted convention and on the other side into the Modish, which is mostly a somewhat foppish exaggeration of the Modern at any one time. this ridge is no comfortable middle way.\" <br> <br>I would have thought this understanding of the Modern would be sympathetic to you, Hrant, rather than demonizing Modernism as a banal \"fitted to the grid\". <br> <br>But surely there are Modernists, Traditionalists, post-Modernists, post-traditionalist, etc., all over the geographical compass, and most designers don't categorize themselves in these or any terms, we just do it. <br> <br>And if we do categorize, is it by which side of the country we live on, by which side of the bed we sleep on, or somewhere in between? Get over it -- it's the principles that matter, not the people or where they happen to live. <br></p>"
    html_clean: "<p>Paul Renner (c.1950), translated by Chris Burke in his \"Paul Renner\": <br> <br>\"The truly Modern, that is, the undistorted expression of an objective Zeitgeist, is only what we hold today to be timelessly perfect. This is not the same in all periods, because the insight into the timelessly valid changes from generation to generation\" <br> <br>and <br> <br>\"For the Modern is an idea, an unending task, never to be entirely resolved. We seek it on a narrow ridge, which drops away on one side into thoughtlessly adopted convention and on the other side into the Modish, which is mostly a somewhat foppish exaggeration of the Modern at any one time. this ridge is no comfortable middle way.\" <br> <br>I would have thought this understanding of the Modern would be sympathetic to you, Hrant, rather than demonizing Modernism as a banal \"fitted to the grid\". <br> <br>But surely there are Modernists, Traditionalists, post-Modernists, post-traditionalist, etc., all over the geographical compass, and most designers don't categorize themselves in these or any terms, we just do it. <br> <br>And if we do categorize, is it by which side of the country we live on, by which side of the bed we sleep on, or somewhere in between? Get over it -- it's the principles that matter, not the people or where they happen to live. <br></p>"
