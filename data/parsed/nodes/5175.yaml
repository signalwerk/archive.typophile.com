    html: <p>Having lived and worked in Italy, Switzerland and on both coasts -- Cape Cod and Sonoma County -- I think westerners mistrust any guy who wears chinos instead of jeans. I found designers and illustrators in Milan to be the most fun to be among, but then we were all young. In and around the Boston-Cambridge area I found illustrators to be very open and helpful whereas designers were uptight almost to a man. (Note that I did not say woman. ) It might be that we were all that much older and competitive. Yes, it's generalizing, and I'm guilty as charged.</p>
