    html: "<p>Really?  I can see the American/European thing, but I always thought something big inside the U.S. was going on.  Seems like there would be at least something, given the fact that different interests have based themselves on the two coasts (at least in my mind)--East coast:  book publishing, West coast:  entertainment/computer industry. <br> <br>Is the Tijuana thing true?  Several years ago I lived in a region in Mexico (Oaxaca) that was about as far geographically and culturally from Tijuana as one could get; now I've never been to Tijuana, but every sign and work of graphic design in Oaxaca seemed as if it were in emulation of something in Tijuana (or the pictures I've seen anyway).  Interesting.</p>"
