    html: <p>Why yes... <br> <br>The thing with Tijuana is that it's neither Mexico nor US. It is one of the weirdest amalgams of cultures and nationalities. Graphic design coming from Tijuana is some of the freshest, edgiest � even smartest � coming from Mexico. <br> <br>Scott, Tijuana is unlike anything else in Mexico, which is why Oaxaca (which is more like everything else in Mexico) seems like such a departure. BTW, there is NO design in Oaxaca. I'm not sure though if being from Tijuana gives you instant cred. But it is a hotspot to be in� kind of like Minneapolis or Madison, WI. <br> <br>Mexico City is filled with amazing designers and some very good type designers. Most notably Gabriel Martinez Meave. And many of the people who were part of <a href="http://www.underconsideration.com/speakup/matiz/" target="_blank">Matiz</a> are incredible type and graphic designers. Very different style from that of Tijuana's though.  <br> <br>As far as the US East/West coast thing, in graphic design, there is a very big difference. West Coast design is at times much more colorful than East coast. There is more illustration used in the East Coast, perhaps because of the insane amount of illustrators in NY. The styles are very blurry now, what with  the internet and all.  The differences are subtle and still noticeable but not as apparent as 10 years ago. We had <a href="http://www.underconsideration.com/speakup/archives/001814.html" target="_blank">a similar discussion on Speak Up</a>, not long ago, if anyone's interested. <br> <br>Type design differences, I don't know. Probably there is.</p>
