      <p>Dan, I think that what Ferch, James, Hildebrant and I are talking about is not whether the logo is well-executed or not... It is about what the logo is communicating about the magazine to the reader.</p>
      <p>To put it another way: does the current logo tell Joe Bookfiend, who is casually perusing magazines at the bookstore, anything about the content or mission of <strong>Elementes</strong> magazine? Because to me, it is not transmitting the idea that this is “[a]n art and literary rag”. Compare that to the logos that Ferch posted... they cleverly pun on the name and content of the magazines. The reader gets what each magazine is about without ever having to look at any headlines. While you don’t <em>always</em> have to arrive at that kind of solution (a visual pun), these logos show that the designer put some thought into what he was trying to communicate. And that is what design is all about — thinking ahead, planning, looking at things from every possible angle with a critical eye... knowing what you want to say, before you take pen to paper and start sketching.</p>
      <p>Maybe what I said before about the cradled <strong>e</strong> needs to be re-stated: you say that the central theme of the first issue was to be “water” — if that were the theme of every issue, or the reason for the magazine, then sure, make part of the logo look like a water droplet. But if water is (or was) only the theme of the first issue, what will happen with the second issue? What will readers make of a logo that simulates a water droplet in an issue whose main theme is something completely different from water? And if the theme of the first issue is no longer water, as your comment seems to imply, then there is even less reason for keeping the cradled <strong>e</strong>. Don’t hold on to an idea just because you’ve grown fond of it. Make sure it says something.</p>
      <p>So I think it’s a good idea to go back and come up with more logo ideas, or different ones. Or think through your logo strategy — because there is no one “right” way to do this, no single “correct” solution. You could have the logo change with every issue, as we’ve both mentioned, always reflecting the theme of that issue and establishing a connection with the readers that way. Or you could come up with an entirely different concept that never changes. But this current logo idea, the cradled <strong>e</strong>, might seem anecdotal after a couple of issues, not to mention perplexing. You shouldn’t make your readers guess at what they’re looking at — they might move on to the next magazine on the stand and not bother to pick this one up.</p>
      <p>Speaking of guessing, I suppose the name of the magazine has something to do with the natural elements — is that correct? Is there any special reason that the name of the magazine seems to be spelled in a foreign language? Those are also considerations if you are designing the magazine and the logo.</p>
