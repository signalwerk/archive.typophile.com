      <p>I can see that this design is leading towards the destijl look... the bars are too heavy with the type. I like the san serif ... I am agreeing that the “u” is redundant unless there is a reason for it. What kind of magazine is elements anyway? Who are the target audience? The elements could be in blocks to make up the words? Maybe something could be 3D? </p>
      <p>If there are any doubts.. lets fall back to our basic design principles... are there contrast in shapes, size, space, texture, weight?</p>
      <p>Think with the whole body and soul. — AD Shamiko</p>
