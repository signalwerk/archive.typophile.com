      <p>Dan, before delving into designing a magazine from SCRATCH, I recommend getting some books on <a href="http://www.amazon.com/s/ref=nb_ss_gw/103-0346915-5618242?initialSearch=1&amp;url=search-alias%3Dstripbooks&amp;field-keywords=magazine+design&amp;Go.x=11&amp;Go.y=9&amp;Go=Go">magazine design</a> or <a href="http://www.amazon.com/s/ref=nb_ss_b/102-0505973-3098567?initialSearch=1&amp;url=search-alias%3Dstripbooks&amp;field-keywords=publication+design&amp;Go.x=11&amp;Go.y=13&amp;Go=Go">publication design</a>.</p>
      <p>A magazine should have a distinctive look and feel that, ideally, will set it apart from the competition... You might want to start by having a flexible underlying page grid that allows you to set up the different sections (features, fiction, interviews, letters, editorial, etc.)...</p>
      <p>Go to your local magazine stand and look at the competition... See what you like and also what you don’t like... Check out what works and what doesn’t.</p>
      <p>Also, speaking from personal experience doing a magazine for a group of writers, know what YOU want for the design of the magazine, and be prepared to defend it!</p>
