      <p>OK, but then will the logo remain this way throughout the life of the publication? Or will it change with every issue, reflecting the central theme of each one? You can have it either way, but be sure to think all of the possibilities through. For example, if you keep this logo the way it is for subsequent issues where the central theme is not water, what will readers make of the cradled <strong>e</strong>?</p>
