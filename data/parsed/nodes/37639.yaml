      <p>Ha, well i'm very pleased you like it! I totally agree about the lowercase being more harmonious than the capitals...may need to rethink the parameters a bit.<br>
      I'm surprised you mentioned the W first! That is a very interesting point because I found the diagonal shapes hardest and thought W was a bit of a disappointment. There is so much white space below its arms (and with the V) that it looks funny setting it next to a vertical stem. I need to perhaps think of a trick. I tried that roundy corner facing the other way on the W but that looked bad. It didn't strike me to try the lowercase w the other way, but i think it might work too.<br>
      The g is a fun one. I originally had the tail the same thickness as the other letters, but the shape was really distorted, that's why it looks light...i had to cheat to keep the shape right. I think I may close off the bottom loop to make it darker and simplify the contours. I must say I wanted all the shapes to be interesting, but they have perhaps ended up difficult on the eye.<br>
      Somehow Q is staring at me like an unplayable instrument in an orchestra. Is it permissible to add a toe on the foot like on the y?<br>
      With b, I found a blob of dark when the corner is lower, but let's see if I can do better. You're right it is a bit lively.<br>
      A and M do suddenly look lots too wide. I was aiming for this Black weight to be more condensed than usual blacks.<br>
      There are weight issues because I have simply moved the contours by eye, nothing is really measured. Are there any letters which stick out especially? With the contrast, I find that naturally b and q take on more of an angle, which I can't apply very easily the other way round on the d and p. I'll try some tricks there too.<br>
      I think the k is satisfying too. I only just resolved the R. It is funny you like the letters with diagonal strokes best.<br>
      Numbers, still fighting me...especially 2. It's so insolent, I want to physically make the outline with bendy wire and force it into the proper shape.<br>
      I'm closing off the A.<br>
      May take a while to sort out the shapes...</p>
