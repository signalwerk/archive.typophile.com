      <p>It's noyce! (very nice)</p>
      <p>There are loads and loads of successful seriffed fonts with a <strong>g</strong> of these "small" proportions. It's not so abnormal.</p>
      <p><strong>t</strong> only looks heavy compared to <strong>E</strong> when they're next to each other, mainly because E contains a lot of white space. <strong>t</strong> looks fine in other combinations. The point: typeface design involves compromise. Certain combinations are always going to look awkward. Some type designs manage to minimize awkward combinations, but this one has design parameters that do not allow that degree of optimization. Awkward combinations are something you'll have to live with. </p>
      <p><strong>c</strong> and <strong>a</strong> need serifs. <strong>e</strong> rarely, if ever, has a serif in seriffed fonts. Look at Charter for example.</p>
      <p><strong>r</strong> could benefit from more weight at the end of the stroke---a serif might do the trick.</p>
      <p>The established convention for stroke width is that capitals have a slightly heavier stroke than lowercase letters, because they are larger and appear more natural this way. I don't make this stuff up. Other type designers do.</p>
      <p>j a m e s</p>
