      <p>I'm looking at Eternal 2 Jan. Prepared animations show recommended changes for <strong>g</strong> and <strong>a</strong>. Do something similar to g to the counter of <strong>o</strong>. The change for the hood of <strong>a</strong> is optional. I'm looking for a way to reduce the horizontal thickness of that top part and still make it asymmetric. The modified drawing in the anim isn't successful as far as the shape goes (asymmetry disappearing!), but shows the change in thickness that would complete the <strong>a</strong>, matching the rigor of the hood to that of the bowl, which came up very nicely.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/eternal_a_anim_6382.gif"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/eternal_g_anim_6526.gif"></div><p></p>
      <p><strong>a</strong> much improved<br>
      <strong>r</strong> much improved.</p>
      <p>What's up wth the numbers? Describe the problem(s) in detail.</p>
      <p>For the Extra bold, the crossbars on the E F and H can go thicker, no problem.</p>
      <p>From what I can see of the ultrablack, <strong>c</strong> looks okay (not too narrow). If you can post a pic of the ultrablack <strong>g</strong> at a decent size I will happily show how to solve its problems. Reducing the size of the upper bowl would be a good start. The upper portion of a binocular g is the body (proper), a.k.a upper occulus, but you can call it the head if you want. <strong>k</strong> is well solved, keep going with that. For the ultrablack generally, your overshoot appears excessive.</p>
      <p>Italics are generally narrower than their regular cousins, yep. At this stage of development the regular still has some basic problems that need attention first. Put the italic aside for the time being. When the time comes to build it, yes, narrow those guys by character width and stroke width. Not narrowing your italics isn't so much a mistake as a defiance of convention. We can be philospohical about this; pretend nobody has ever seen the regular font, an italic version with forms not narrowed they would be none the wiser about. Depends who's looking at it. Some designers insist that italics have to be narrow or they're not true italics. Others will accept it on face value. </p>
      <p>I need to see a PDF with full character sets (everything drawn so far) of each weight before advising any further.</p>
      <p>j a m e s</p>
