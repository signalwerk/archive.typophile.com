      <p>I agree with James that the <strong>o</strong> is fine. Also the visual connection it has with other round shapes (b, d, e, etc.) is good enough.<br>
      Small details; I think the <strong>e</strong> might be a fraction too wide, although James suggestion of setting the crossbar higher might already help. The <strong>b</strong> (and q) seems a little narrow, compared to b/p, etc. I think it has the same width, but optically it looks less wide. Maybe you can try if you can optically balance this out, but we're talking a couple of units here. I like your <strong>s</strong>.</p>
      <p>One thing that I see when looking at the pdf, is that the shapes are quite 'rigid', so to speak. They are very 'well-behaved'. You have put some playful aspect into them, like the curly endings and such, but maybe you can try to introduce some more small details that give it a more lively and human appearance. For example small changes/cuts in line-direction and things like that. I don't mean you should ditch this version, it is getting better and better, but you can always give it a try.<br>
      I am thinking little things, like in the following illustrations. Please excuse the rough auto-trace and quick edits.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/f-1_5668.png"></div><p></p>
      <p>Top of <strong>f</strong> edited. Very rough crossbar edit, but you get the idea. I let the top terminal flare a little bit.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/p-1_4696.png"></div><p></p>
      <p>Top of the <strong>p</strong>. A subtle but sudden change in line-direction I mentioned earlier. Gives the impression of a written or cut line.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/t-1_4075.png"></div><p></p>
      <p>Top of the <strong>t</strong>. Shortened and altered top, less rigid crossbar.</p>
      <p>Just to give you an idea what I'm talking about. There are lots of places where you can introduce these kind of details, without making it annoying or anything like that.</p>
