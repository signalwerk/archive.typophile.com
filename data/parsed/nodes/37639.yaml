      <p>Yes v could be wider. w and y look okay---they're functional in the text run.</p>
      <p>Ear of g -- make it larger at the free end tip, and bring it up further above x-line for collision avoidance.</p>
      <p><em>do you think this generally works better as a display font than a text one?</em></p>
      <p>The design and detailing make it shine the most in display applications, altho it's surprising how capable it is at text. Before you go widening sidebearings try the text setting with some positive tracking. If it works reasonably well then you may be able to leave the sidebearings alone for a while. Hope I'm not too late on that.</p>
      <p>j a m e s</p>
