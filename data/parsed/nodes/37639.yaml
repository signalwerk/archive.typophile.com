    html: |-
      <p>On text faces, I've observed that the lower dot of the colon and semicolon are generally the same as a period and comma, respectively, while the upper dot rides near the x-height. This is so it lines up with the lower case in body copy. With the quotation mark at the top above a colon, the dots are often evenly spaced vertically.</p>
      <p>The colon and semicolon may ride higher than the period in display weights, especially when used in all-caps setting.</p>
