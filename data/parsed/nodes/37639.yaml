      <p>Condensing the w is what I mean. Rather than looking at other fonts for a particular w shape, it's better to adapt your own design first by adjusting it. Select each joint and shift the whole lot horizontally to the left. Try ten or twenty units of shift for each joint for starters (assuming this font is drawn at a scale of 1000 units per em) . It may need more or less.</p>
      <p>This drawing shows how to do it as a series of steps.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/eternal_w_3968.gif"></div><p></p>
      <p>After condensing it in this way you'll probably need to adjust the stroke widths to make them the same as what they were before.</p>
      <p>The serif on c does speak a bit loud. I like it as one of those little eccentricities that can help make a typeface interesting. Consider keeping it as is because it adds flavour without drawing as much attention as the counter of e. This drawing shows how it would look if you paste the unit from s on as a replacement, making no other adjustments.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bendy_c_anim_5042.gif"></div><p></p>
      <p>Alright, that works in being less pronounced, but it's a modular method I've used (only to get a quick idea of how it might look). Best if you adjust the existing beak on c instead of cutting and pasting, to keep it unique.</p>
      <p>Your o can never truly match the shapes of the bowl pairs on account of the differences in structure between those letters and o, and you're better off not sweating over that discrepancy so much. The art of typeface design is in part the attempt to perfect what ultimately cannot be perfected. The effort to do that leads to creative work. By all means try condensing o to make it more elliptical, but keep in mind the need for even density and color. The current width is about right, making o a good match for the bowl pairs as well as h, n, m, u, producing a fairly even color in combination with them and other glyphs.</p>
      <p>j a m e s</p>
