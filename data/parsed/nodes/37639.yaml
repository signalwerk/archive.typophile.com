      <p>Take a break. Give your loved one a big hug. Pat the cat (Put the cat out dear. "I didn't know he was on fire!")</p>
      <p>It sounds like you may be a little too close to it after much intense effort. I would take a break and give the font to a colleague you trust, ask that person to play with it for a few days, to live with it by doing some comps with it. Then a few days or a week later when you look at the comps you'll have a fresh perspective on the type design---at that point I find my feelings and reaction to it are different.</p>
      <p>Season's greetings.</p>
      <p>j a m e s</p>
