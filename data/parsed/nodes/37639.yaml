      <p>Here's that pdf in columns. I have widened the sidebearings so the body text appears as it would with no extra tracking, only justified. Left column is 10/14pt and right is 9/12pt.<br>
      To my eye, the spacing is too wide...but perhaps that's because I've got used to narrow spacing.<br>
      Small caps are not finished; I still have T through to Y to fix.<br>
      The numbers are still fighting me. The 2 is too short and dumpy and the 3 is too heavy. Its bottom hangs out looking bulbous.<br>
      I got some nice results interpolating the black and the regular to make a bold. The extra fat idea is great...really fudgey, and will probably need a lot of restyling, so that'll wait for now.<br>
      I lengthened the curly toes of the t and f, pulled up that bowl on the a slightly as you suggested; also, the k has a thinner knee.<br>
      I shaved off some of the eyelid of the e and likewise on the c. There wasn't enough contrast. Perhaps the G needs to be a smidge wider. I squashed the p in slightly. And that ampersand needs a tweak.<br>
      I haven't done anything to the italic. But i'm glad you liked the black spunky one :) It's funny how the regular one somehow contained the recipe for the black weight. The e there needs its curves to be a bit tauter, I think.<br>
      It's very encouraging to hear positive opinions. I'm sure I would have lost interest without your feedback, so thank you all! And, please, any comments again :)<br>
      Cheers,</p>
