      <p>I like that 'A' as well, although I think the left stroke is probably a bit too thin. Some of your other caps have the same problem.<br>
       As for the sans-serifness of the 'a' and 'c', try incorporating subtle vertical spurs on the top terminals (and maybe on the 'r' as well), look at your question mark! That is what I mean, basically.</p>
      <p>The 'b' looks fine. As Matt already pointed out, the tops of the 'D', 'R' and 'q' aren't working. I think the 'q' should resemble the 'b' more. Somehow I think the crossbar of the 'f' should be flipped on a horizontal axis, as in that the shaved off slope is going downwards, instead of upwards. The serif on the 'G' looks a bit attached. The top serifs on the 'H' don't look right, I think they should be more like the bottom serifs. </p>
      <p>I like where you are going with the 'k', though it could use a bit of character. The 'o' has very bumpy curves, as does the bottom of the bowl of the 'q'. Apart from the 's' leaning to the right, I think it is too light, the spine can use some more weight. I like the 'v' and the 'w'. Last, look at the stress of your contrast, I don't think it is completely vertical. If not, the counter of your 'o' is vertical, it should probably be rotated a bit, to echo the stress of the rest.</p>
      <p>I think all in all it could become a very nice typeface. :)</p>
