      <p>I've been discussing some of the topics raised in this thread with James, via e-mail, since he's taking a break from Typophile. As he was helping you in this thread before he left, he wanted to respond to your last post.</p>
      <p>Consider shortening the descenders on the p and q to bring them closer to those of the g and the y. Also, after giving it some thought, make the descenders of the g and y longer. Or at least, make all of them consistent. The difference in lenght becomes especially apparent in display sizes, where it may be distracting.</p>
      <p>About the error message you are getting on TypoAscender and TypoDescender: reduce any characters that extend past the descender and ascender lines, then recalculate the values via the Font Info menu, using the button with the jewel icon on it. The two values should add up to the numer of units per em that the font scale is set to.<br>
      It might be that only the bar and broken bar have to be shortened. If that doesn't fix the problem, some accents might have been placed too high up that will need to come down a bit.</p>
      <p>James gave me an example: if the font is scaled to 1000 units per em, the typo ascender is typically around 850, and the typo descender about -150.<br>
      If they're a bit less you can pad the values by typing in a number manually.<br>
      As long as those two values add up to 1000 the error condition should go away.  You ignore the negative sign of typo descender--only the numbers matter.</p>
      <p>Important: make a copy of the Fontlab file first and make the changes to that to be safe.</p>
