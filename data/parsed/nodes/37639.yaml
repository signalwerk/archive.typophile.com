      <p><strong>k:</strong> I don't think it really is too narrow, instead I think the arm and leg are too light. This might give the impression it's too narrow.<br>
      <strong>v/w:</strong> Don't look too wide or narrow to me.<br>
      <strong>p:</strong> While I think it isn't too wide on its own, compared to b/d/q it seems it is. If you want to change this, I suggest you don't just narrow the p, but look at all of them; making some a bit more wide, others narrower. Evening them out optically.<br>
      <strong>y:</strong> I like the way the tail curves. But I agree the terminal might be a bit too fiddly. One thing that would help, is making the right stroke plus tail a bit heavier. It looks too light, eventhough it's probably of the same weight as your typeface's lightest parts.<br>
      <strong>g:</strong> I agree that the head of the g might indeed be a little bit too small. It looked right with in the shorter version, but not so much anymore now. But I do think the extended version looks nicer overall than before.<br>
