      <p>I think the ear of the <strong>r</strong> needs to have some more weight. It has to fit with the other characters. The <strong>s</strong> leans to the left. Try extending the lower left stroke. The <strong>1, 3</strong> and <strong>4</strong> are too light. The <strong>8</strong> leans to the left. Have you tried to make the hook of the <strong>f</strong> a tad longer? (a bit like you have in the <strong>fi</strong>-lig). I think it might define the shape better. The same goes for the <strong>t</strong>.<br>
      I think the waist of the <strong>k</strong> should be lowered a little bit. It seems to me the lower leg is too long, and the top one too short. Somehow, the <strong>o</strong> doesn't look right. Compare it to your capital <strong>O</strong>. The same goes for your <strong>c</strong>, <strong>e</strong> and the top of the <strong>g</strong>. I think it is the contrast (weight) that needs some work on those characters. The same problem exists in the italic.<br>
      How about oldstyle figures? You can make more creative shapes with those, so to decide what kind of numerals you want (and then extend that to the lining figures). I like your questionmark, but the one in the italics seems to be too small?</p>
      <p>Overall I think it is definitely coming together pretty nicely. If you loosen up the spacing a bit, you can probably judge longer text settings better. Keep it up. :)</p>
