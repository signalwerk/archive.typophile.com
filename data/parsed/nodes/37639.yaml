    html: <p>What seems somewhat strange to me is the stress in the <strong>p</strong>. The thickest part of the bowl is on the lower right, which I think (?) should be - considering the angle of stress on the <strong>o, e, c</strong> - on the upper right. The same goes for the <strong>b</strong>, where the thickest should be on the upper right, and the <strong>q</strong>, where it should be on the lower left. Compare them to your <strong>o</strong>, and you'll see what I mean (it becomes apparent in the word 'bold' as well). The image that words form, will look more balanced when the stress is consistent. :)</p>
