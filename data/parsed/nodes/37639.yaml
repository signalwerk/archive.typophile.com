      <p>Well, nearly a year after I started...here is the current state of this font. It's been a LOT more work than I naively expected, and I'm sure there is still plenty of work to be done on things like spacing, kerning and perhaps hinting (I don't fully understand even what that entails).<br>
      It's been a fun project for my spare time, something outside the 9-5, more as a personal thing than for commercial use.<br>
      Do tell me what you think so far. I'm sure there are a lot of useful opinions out there.<br>
      Here are my latest notes on the letter shapes.<br>
      The UPPERCASE LETTERS have more consistency of colour, the serifs are more pronounced and the strokes have better texture, to give a slightly cursive feel to the forms. Problem areas have included the D, P, R, and T. I am still not happy with these shapes. D looks slightly light, the serif is not strong enough and the 2 o’clock section needs to be thicker. P and R were too smooth and rounded; the R is now too square and the bottom of the bowl on the P wants to be straighter, perhaps. T is proving difficult to get the serifs at a sensible angle, width and height. My next uppercase glyphs for experiment include the A, J, N, V, W, and X. Of these, I have adjusted only the A recently and it is looking too wide. The others are in need of more texturing and stroke tapering. O and Q always look distorted and are difficult to make beautiful. I am happy with B, E, F, G, H, I, L, M, U and Y as these are the most expressive characters in this font so far, and the redistibution of the weight into the serifs and away from the middle of the stems has been most successful. H and U were widened, E and M are particular favourites.<br>
       As for lowercase, I have added more quirkiness, taking the shapes away from their underlying geometric components to emphasise their individuality. In response to the heavier serifs in the uppercase, the lowercase has stronger terminals, especially on the vertical stems. The non-linear stems of the uppercase have also been transposed onto lowercase letters such as b, d, f, h, k, l, m, n, p and r. Some more adjustments will be needed on the remaining letters, which have been given better overall form but need more impact. The letters v, w, x, y, and z seem to present a difficulty as I have not decided which way the diagonal strokes should be weighted.<br>
       It will be very interesting to see how all these latest changes will be implemented in the black weight, which was originated as a clean and square, blocky ultrafat headline font.<br>
       The lowercase italic letters are beginning to coalesce into pleasantly coherent structures, with each letter looking more like a unit and less like a collection of parts, or like a sloped roman glyphs. I have started a set of italic uppercase letters but they look a bit of a mash right now. The letters that are working best, I think, are the a, f, g, j, n, o (interestingly), r, t, u and v. I have two versions of x (£ and x) which are fighting to be included. b looks too wide, c too oblong, e perhaps needs a smaller eye (though I’m fond of big eyes), h could be wider, k, m and s are in need of work, and w, y and z again have the problem of diagonal strokes which needs to be resolved. f and t of course need to have the overlap added.<br>
       My numerals are still not fitting into harmony. Here they are: 1 2 3 4 5 6 7 8 9 0. I think they will perhaps become easier once the uppercase is more solid. They are quite different in structure to the letters, of course.<br>
       Please let me know your observations and feelings about this font so far. They are very useful!</p>
    html_clean: |-
      <p>Well, nearly a year after I started...here is the current state of this font. It's been a LOT more work than I naively expected, and I'm sure there is still plenty of work to be done on things like spacing, kerning and perhaps hinting (I don't fully understand even what that entails).<br>
      It's been a fun project for my spare time, something outside the 9-5, more as a personal thing than for commercial use.<br>
      Do tell me what you think so far. I'm sure there are a lot of useful opinions out there.<br>
      Here are my latest notes on the letter shapes.<br>
      The UPPERCASE LETTERS have more consistency of colour, the serifs are more pronounced and the strokes have better texture, to give a slightly cursive feel to the forms. Problem areas have included the D, P, R, and T. I am still not happy with these shapes. D looks slightly light, the serif is not strong enough and the 2 o’clock section needs to be thicker. P and R were too smooth and rounded; the R is now too square and the bottom of the bowl on the P wants to be straighter, perhaps. T is proving difficult to get the serifs at a sensible angle, width and height. My next uppercase glyphs for experiment include the A, J, N, V, W, and X. Of these, I have adjusted only the A recently and it is looking too wide. The others are in need of more texturing and stroke tapering. O and Q always look distorted and are difficult to make beautiful. I am happy with B, E, F, G, H, I, L, M, U and Y as these are the most expressive characters in this font so far, and the redistibution of the weight into the serifs and away from the middle of the stems has been most successful. H and U were widened, E and M are particular favourites.<br>
       As for lowercase, I have added more quirkiness, taking the shapes away from their underlying geometric components to emphasise their individuality. In response to the heavier serifs in the uppercase, the lowercase has stronger terminals, especially on the vertical stems. The non-linear stems of the uppercase have also been transposed onto lowercase letters such as b, d, f, h, k, l, m, n, p and r. Some more adjustments will be needed on the remaining letters, which have been given better overall form but need more impact. The letters v, w, x, y, and z seem to present a difficulty as I have not decided which way the diagonal strokes should be weighted.<br>
       It will be very interesting to see how all these latest changes will be implemented in the black weight, which was originated as a clean and square, blocky ultrafat headline font.<br>
       The lowercase italic letters are beginning to coalesce into pleasantly coherent structures, with each letter looking more like a unit and less like a collection of parts, or like a sloped roman glyphs. I have started a set of italic uppercase letters but they look a bit of a mash right now. The letters that are working best, I think, are the a, f, g, j, n, o (interestingly), r, t, u and v. I have two versions of x (£ and x) which are fighting to be included. b looks too wide, c too oblong, e perhaps needs a smaller eye (though I’m fond of big eyes), h could be wider, k, m and s are in need of work, and w, y and z again have the problem of diagonal strokes which needs to be resolved. f and t of course need to have the overlap added.<br>
       My numerals are still not fitting into harmony. Here they are: 1 2 3 4 5 6 7 8 9 0. I think they will perhaps become easier once the uppercase is more solid. They are quite different in structure to the letters, of course.<br>
       Please let me know your observations and feelings about this font so far. They are very useful!</p>
