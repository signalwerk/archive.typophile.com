      <p><em>I don’t know how the kerning works in fontlab,</em></p>
      <p>If you open Kerning Mode in a Metrics Window, it's actually quite self explanatory. You can basically grab letters and drag them to one side or the other, either adding positive or negative space to the pairs of letters.<br>
      It's handy to open the 'Kerning Table' on the Metric Window (one of the buttons at the top) so you get a list of all pairs you've already made for quick review or changes.<br>
      Also handy is loading a txt file in the Metrics Window with a good set of words that contain the most used pairs (like <a class="freelinking external" href="http://www.logofontandlettering.com/kernking.html" rel="nofollow">Kern King</a> for example).</p>
