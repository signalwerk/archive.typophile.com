      <p>Ben this is in all-round great shape. The o "can be" improved, but it seems most satisfactory as it is. I am more concerned about your e. There's an easy way of making it more elegant and less eye-catching (it "dazzles" a bit much for me). If you narrow the e body a bit and raise the crossbar as shown in this animation.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bendyanim_6669.gif"></div><p></p>
      <p>The other glyph you could consider reducing the size of is w. This Venetian style of w has ruined most major text fonts for five hundred years, and right now it's doing a fair job of ruining Eternal's integration and sense of stylistic unity. The only thing you can do to these little twerps is narrow them to make them smaller, and by making w smaller it somehow seems less intrusive.</p>
      <p>The only other thing I had time for is the curl tip on the right side of z. Can you make it taper like the curls on <strong>n, m, l</strong> etc?</p>
      <p>m e w &nbsp; j a m e s</p>
