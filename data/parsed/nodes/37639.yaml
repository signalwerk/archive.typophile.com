      <p>I mean that it may be wise to look at the letter fit resulting from all r-combinations to determine if the angled ear end is really the best way of finishing the <strong>r</strong>. It works beautifully with <strong>a</strong>, but by the time you get to the black weight the fit becomes awkward with some letters. For example r-s in the black weight is a bit quirky, and an ear facing closer vertical would make more sense to me there.</p>
      <p>Another way of looking at it---an ear facing closer vertical poses less risk of fit problems.</p>
      <p>But this isn't a huge fit issue. In the regular it isn't very noticable. Only in the heavier weights does it draw the eye's attention.</p>
      <p><em>It’s really encouraging to hear all these ideas. I hadn’t started seeing the font as a product, only as an arcane hobby! Thanks :)</em></p>
      <p>Don't let me impose too much commerciality on this font. It's your design, your baby. Ideally commercial considerations should not come last but neither should they occupy the front seat. If you decide to make Eternal commercially available then my key word lists may come in useful. Some of the ideas may turn out to be duds too. Sometimes when I look at an unproven type design (like this one) a torrent of applications (uses) and key words wells up in my head and it makes sense to write it all down somewhere. But I can be very commerically-minded at times and I recommend you get as many more impressions from other people as you can---people who aren't type designers or typophiles and people who don't work in design or advertising :^)</p>
      <p>j a m e s</p>
