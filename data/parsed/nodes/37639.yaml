      <p>I think the W looks nice. I couldn't judge if it's too wide or if there are other problems with it. You obviously do know from designing it. But at first glance it's a nice shape. The roundy bit is also nice on the lowercase w, so by all means try both approaches.<br>
      About the g, it's not horrible or anything, just that double story g's are already quite complex on themselves. Your g does work when looking at it in the context of a word. But you could always try what happens if you play with it a little more.<br>
      The Q, I can see what you mean. If it's permissable to add the toe... well I'm not stopping you. ;) You could also try what happens if you move the tail more to a 5-o-clock position. You might be right that the b becomes too black in the corner if you lower the lower left part. Luckily you can easily try with béziers! :) If you lower it, you should probably also lower the inside of the same corner as well, so the bottom stroke stays about the same thickness.<br>
      A and M do look kinda wide, and when looking at the specimen again, I think the W (that I like) is also on the wide side. At least, by looking at the 'CHOCOLATE SANDWICH BISCUIT'.  It could also be that it is the other way around, and that the <em>other</em> characters are too narrow. In that case, it's 'just' a matter of balancing. The weight issues are mostly in the uppercase as well, not really a few sticking out.<br>
      The angle on the b and q and d/p; I think you got it pretty right in the other weights, so I'm sure it will work out in this weight too.</p>
      <p>Interesting that I like the diagonals indeed. The k is nice, better than the K. The R is working pretty good (on its own, don't know what it will look like in a word). What do you think you find tricky when doing the diagonals? Is it the fact that they usually look too heavy, or something else?</p>
      <p>I don't really hate the 2 to be honest, but I realise that by me saying that, it only gets more difficult for you. ;) I think the 3, 4 and 5 are nice. 6 could use a bit of work, while 9 (being practically the same shape) isn't really bothering me that much. I like the way you put the weight in the 7, although it might stand out a bit in the group. The shape of the 8 is fine, but needs some finetuning. Thats what I think, but I don't have alot of experience at drawing numbers myself, so I'm probably not the best person to give advice on them. Are you planning any oldstyle figures as well?</p>
      <p>Well, I hope I touched on all points you mentioned in your last post. ;)</p>
