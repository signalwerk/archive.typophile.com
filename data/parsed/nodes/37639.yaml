      <p>I do think the black lowercase works a bit better than the uppercase, although I love the W. Because of the middle, where the two strokes join with the rounded off top. The lowercase w also has this, only reversed. At first sight I think the direction of the rounding looks better in the uppercase version, but I would have to see it in a sentence. I like the R as well.<br>
      The g looks a bit too complicated to me. Maybe there is too much happening, in an already complex character shape. It might also look a bit too light, maybe because of the opening in the bottom loop. It's not wrong, but you might try to simplify it a little bit.<br>
      The uppercase A and M might be a bit too wide, and the N a bit too narrow. I really like what you did with the k, really nice. I think the lower left corner of the b curves up a bit too far, which somewhat disturbs the wordshape, for example in the word 'suitable' in your specimen. It might look ok in other words, though...</p>
      <p>As you already state in your pdf, there are some inconsistencies in the angle of stress, but also weight. The characters b, d, g, p and q have some angle of stress issues. The weight issues are mainly in the uppercase characters.</p>
      <p>About the thread; it doesn't really load very slow for me. You can make a new thread if you want, but I think it's good that the critique and images are in one place, so people can scroll through the changes you have made so far.</p>
      <p>If I think of something else, I'll add it later. But keep it up.<br>
      And I hope I didn't contradict James too much! ;)</p>
