      <p>@Bendy(via email):<em>The regular is falling into shape, but still needs more consistency with strokes as some are now narrowing in the middle and others are not there yet. Can you see any drastic problems with contrast, glyph shapes or bumps? </em></p>
      <p>When printed your PDF for the regular font shows a basic issue which you should attend to before doing too much else. In the lower case the vertical strokes (stems) are optically heavier than the curves. This is most noticable on "a", "c", "o" and "e", and the bowl letter pairs. At serious text sizes the uncompensated weight of the curves may cause uneven or patchy color.</p>
      <p><em>I'm not sure about the y tail, i think the Q is somehow still too heavy and the V and W need feet like the v and w.</em></p>
      <p>For y, crank the curve on the tail tip back anti-clockwise and make the serif smaller. To reduce the ponderous nature of Q reduce the tail stroke width from joint to tip; is the Q body identical to O? It doesn't have to be. Q can be shorter in height with the top cuve overshooting the caps line and the bottom curve sitting above the baseline, no problem. I've done it a few times and it works.</p>
      <p>Yes, match the feet of V and W to the lower case v and w.</p>
      <p><em>I can't get happy with the 2.</em></p>
      <p>Drawing a good 2 takes a bit of practice. For yours I would try to simplify the base stroke (foot?) by getting rid of the asymmetry. The spine of your 2 flattens out as it approaches the baseline. To make the spine look more agreeable redraw it so it's a concave curve all the way from where it starts at the top right down to the junction (joint?) Take the curve of the lower half of your 3 and weld that into the 2 as a replacement, then adjust as needed.</p>
      <p><em>You can see I got carried away with the ligatures and went too far.</em></p>
      <p>Yes ;^) </p>
      <p><em>The black is what i've been working on lately, and I may need to change the shapes substantially. I've tidied up the disparate overshoot. I want to join up the A crossbar, and wonder about K curving like k.</em></p>
      <p>Yes. It's a good plan.</p>
      <p><em>W and w only looked right with opposite facing middles.</em></p>
      <p>Yep.</p>
      <p><em>The diagonal letters are hard in a fat font, yes?</em></p>
      <p>Yes they are.</p>
      <p><em>Again, the tail of y bothers me because I'm not sure why it fits there like it is.</em></p>
      <p>Solve this in the regular first then adapt the solution to the black.</p>
      <p><em>The numbers are fighting me again, but I think they just need fiddling.</em></p>
      <p>Yes. I can speed that up for you by doing a quick tidy-up, if you output the nums as individual EPS files or send me the VFB file by email.</p>
      <p><em>I had to cheat with the g tail, it's not as fat as it should be but overall the colour fits with the other glyphs i think.</em></p>
      <p>Same as above.</p>
      <p><em>Do you think D needs another serif?</em></p>
      <p>No, just give it less turn-up from horizontal at the base, same with G</p>
      <p><em>Lowercase l is not singing loud enough.</em></p>
      <p>It's a very different design compared to the regular l.</p>
      <p><em>e has a nice mood but looks a bit untamed. I wanted also the inner counters of s to be more vertical than diagonal, but they wouldn't go that way without ruining the angle of stress.</em></p>
      <p>s -- give the outer profile of the tips less curve-in*. That will put more meat on the serifs and allow you to open up the counters a bit, and may even give more leeway with the angle (no promises, try it and see how it works out). Study the font known as Aachen.<br>
      * do the same for the sharp corners of b and q</p>
      <p><em>I think the next move on the black is to add some texture to the strokes, like I did on the regular?</em></p>
      <p>Sounds good. Don't get too carried away.</p>
      <p><em>I think L needs more weight, so may need to add it to the foot serif.</em></p>
      <p>That's exactly what it needs. The serif is the only place you can add weight to your L without fattening the stem.</p>
      <p><em>Finally, it looks like the caps have rounder curves than the lc...should it be more consistent? (See Vv, Xx or Yy)</em></p>
      <p>Depends how modular you want the finished type to be. You can try to make those parts better match each other, but does such a move really make the font "better", or only different? Only the designer can judge these things. The rest of the world is always wrong, even when it's right.</p>
      <p>j a m e s</p>
