      <p>I do think the black lowercase works a bit better than the uppercase, although I love the W. Because of the middle, where the two strokes join with the rounded off top. The lowercase w also has this, only reversed. At first sight I think the direction of the rounding looks better in the uppercase version, but I would have to see it in a sentence. I like the R as well.<br>
