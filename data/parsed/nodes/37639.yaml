      <p>If you really weant to do it that way. I wouldn't. Leave <strong>t</strong> and <strong>E</strong> as they are and test them with other characters to see how they look. <strong>t</strong> only looks heavy compared to <strong>E</strong> when they’re next to each other. Certain combinations will look awkward. Test <strong>t</strong> with other characters, test <strong>E</strong> with other characters. If <strong>t</strong> looks okay with other characters there's no reason to change it. Same goes for <strong>E</strong>.</p>
