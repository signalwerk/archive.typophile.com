      <p>Nah, we're not doing that. Much easier to draw an ellipse of the required size and aspect with Fontlab's ellipse drawing tool.</p>
      <p>The point I made above is that the <strong>o</strong> is just fine. Every typeface design is a collection of compromises. Ben has made Eternal into an artful collection of compromises, and that is what every good type designer does---creative work.</p>
      <p>Perfection is boring. A technically 100% consistent typeface is usually reductive and not design at all, but rather soulless pedantry.</p>
      <p>The "x-bar" is called the "x-line", and the "bottom boundary" is called the baseline.</p>
