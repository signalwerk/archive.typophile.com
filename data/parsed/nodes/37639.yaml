    html: |-
      <p>It's pretty obvious that you've assembled these letters from components. They are very good looking components, and this is a great way to start, but now the letters need some individual personality. </p>
      <p>The un-connected horizontal in the A is great. a, c, e could be mistaken for glyphs in a sans-serif font. The tops of the D and R (and q) look really weird to me. I'd straighten out the part where the bowl meets the counter. The curves in the f and j are too straight, bend them more. The g is great, keep it, it fits, and maybe add some serif-ness. The tops of the verticals in the H should match the uppercase I, not the lowercase l. The r has some outline problem -- very faint white space between the vertical and the ear.  The S and s are falling over to the right (a common problem). The shaved-off bit on the t is just the kind of personality I think you should add elsewhere. The flair at the end of the z is good, keep it. The &amp; is too wide or bulging -- make the backwards moving part of the curve less horizontal.</p>
    html_clean: |-
