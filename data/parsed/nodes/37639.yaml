      <p>Took a look at the new pdf a bit better now.</p>
      <p>v/w -- can use a little overshoot on the baseline as well. Probably not as much as the round characters, but nevertheless. Check the word 'overshoot' in your pdf, the 'v' looks smaller. (On a sidenote, I think the w works better than the v).</p>
      <p>y -- somehow seems a bit too wide. And the bottom terminal could use a little love, maybe an increase of weight, I don't know exactly.</p>
      <p>r -- I hope I'm not sounding too harsh, but it's not really working for me. It looks less defined than some of the other characters. For starters I think the ear should probably start lower on the stem. A bit like it does in the n. I'm also not sure about the wedge serif on the ending.</p>
      <p>e -- when the e is next to vertical strokes, it seem the verticals are heavier. Some of the round characters, especially the e, might need a couple of units more weight on the thickest part of their bowls. But it seems it depends on which vertical character is next to it, so it might be that the problem lies there.</p>
      <p>single storey g -- has the same issue as the e. See the word 'vague' in your pdf. The thickest part of the bowl of the g is lighter than the same part on the e and single storey a.</p>
      <p>k -- while it is good (!), may I suggest you look at the k of Arnhem (OurType.be). It can give you some ideas on how to make it an even more interesting shape.</p>
