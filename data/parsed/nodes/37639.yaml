      <p>You are completely right: I have changed the design concept entirely. Now Eternal is pretty chirographic and probably too pretty for body text. But it has character, which I somehow wasn't getting with the upright stress and the clean, sansy lines. </p>
      <p>I may come back to the previous iteration at some point, but for now, that's not the font I want to create. I think I need to fully explore the easier (perhaps) option before 'progressing' backwards. I know what you're saying about education and following the conventions but in this case I think education and learning is the right way.</p>
      <p>&gt;This happens often<br>
      That is a relief and a mystery to me — to be in the same path as other people when following only my own judgments. Fascinating.</p>
