      <p>The black looks very good, and importantly it's got spunk now! Jimmy Cat like very much. </p>
      <p>I would keep developing it as the black weight and make an additional font with a big increase in stroke width (but not so much horizontally) and counterspaces almost as large as these. </p>
      <p>Bug Blatter Megagrotesk has a very fat stroke in all directions and very small counters. Very small counters would ruin your tasteful spunky design.</p>
      <p>The k can be remedied by bringing the arm &amp; leg in so it touches the stem.</p>
      <p>Adding the serif to s helps balance it. Extent the bottom arm to the left a bit.</p>
      <p>j a m e s</p>
