      <p>I think your overshoot at the baseline is too big. Take "n" for instance. The right stroke goes too low.</p>
      <p>Letters have different weight. "a" is heavier than "c" for instance.</p>
      <p>Your S, s and &amp; are falling right.</p>
      <p>I like what you did with "z" on the bottom, but you'll have to balance it. It looks like the bottom is going too far to the right.</p>
      <p>"g" looks smaller than other letters (compared perhaps to p and q) because you tried to box it to the descender. Bowls are normally smaller with this style but this one definitely looks smaller than other letters.</p>
      <p>Is this font supposed to be a mixture between serif and sans serif? If not, you're going to have to do something about completely sans serif letters (e and c).</p>
