    html: |-
      <p>Hey Ben, </p>
      <p>* <strong>f</strong> -- You probably drew the bar shorter than the hood to avoid collisions on the x-line. It can stay that way if you want it to. A lot of fonts are designed that way. The alternative is to have the bar project as far right as the tip of the hood---like the t but upside down. The f-bar will then tend to crash into x-line serifs (or come very close), but will fit better with rounds.</p>
      <p>* <strong>f-ligs:</strong> compare the whitespace inside those ligatures with the whitespace between their individual component letters when typed in the same combinations. Space the ligature stems for consistent color and encapsulated whitespace. The standard form for an <strong>f i</strong> ligature is to bring the finial (beak) out to the position the dot of the i would otherwise occupy. The finial on your <strong>f-i</strong> lig could be a bigger lump to emulate the presence of the i dot. <strong>f-l</strong> is okay. <strong>f-f</strong> -- try dropping the hood of the first f about half the distance between x-line and ascender line, then extending the hood it until it mates with the back of second f, and make the bar between them a bit thinner.</p>
      <p>* <strong>h</strong> looks a bit wide in the body. Recommend narrowing it some to even up the color. Same could be done for <strong>n</strong>.</p>
      <p>* <strong>m</strong> might integrate better and improve overall color if the arches were narrowed, but subtly. Try it and see how it looks.</p>
      <p>* <strong>b o p</strong> A whop bop-a-loo-bop, a-whop bam-boo! It is entirely possible you are over-critical of these fellas. Only <strong>o</strong> is in serious need of adjustment. Make the counter taller then recenter it. Test, test, test. Put it all aside and go for a walk. While out walking think about your loved ones, or interest yourself in the street life and details of houses and cars. It's a woopy raggy world we live in. I always get a clearer perspective if I go for a walk when I'm too close to the thing I'm working on.</p>
      <p>* Capital <strong>J</strong> is dropped design. Will work in some combos but look funny with others. Recommend making alternate lining J, to give users a choice. We live in a world partly driven by consumer choice.</p>
      <p>* Gap on <strong>k</strong> is about right now. Try narrowing gap on <strong>K</strong> to match. Test it, see how you like it. If the wider gapped K makes more sense to you then keep it.</p>
      <p>* Numerals: 6 and 9 take some effort to master. Study the 6 and 9 in other people's fonts (OPFs), look closely at the way the bowls join onto the stems. Learn the form. Try to emulate it. Have patience. 3 is basically okay. Angled left stroke of 4 can angle in to the right more (harmonize with 7), as you have plenty of gap next to the vertical stem. Biggest concern here is top bowl and diagonal stroke of 8. Top bowl is small, not a serious fault but a stylistic concern. Diagonal stroke needs to be thinner</p>
      <p>* comma tail, make it shorter.</p>
      <p>* Euro symbol incorrect form according to industry spec. The right tips of the bars should be staggered to form a diagonal alignment, like they've been cut by a slash. Bars will also benefit from more space between them. See example:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/euroslash_5280.gif"></div><p></p>
      <p>* angled bottom of exclamation stroke is a nice touch :^)</p>
      <p>* mu symbol is fine, no need to adjust except maybe make the descender serif asymmetric or a curl if you want. Your choice.</p>
      <p>* Yen symbol -- give the bars more air, and extend them as far left and right as tips of upper v structure. See example:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/yenbars_5035.gif"></div><p></p>
      <p>* Bar and Brokenbar -- to distinguish Bar from similar characters like <strong>l</strong> and <strong>I</strong>, I draw Bar about fifty to a hundred units higher than the ascender line as well as the descender line. Amount of extension depends on the font. You've got the width right. Set the bearings nice and wide. Bar attains some of its functionality from the whitespace either side of it. Set up Brokenbar the same way as Bar.</p>
      <p>* Asterisk is very cool by way of its impression of motion. Looks like it's spinning. Some designers insist it should appear static, but spectators seldom notice small details like that. Five prongs the way to go.</p>
      <p>* Percent sign -- thin the connecting bar until it looks elegant (not pedestrian). Move the zeros away from the slash. Aw man they need air. Check it at small sizes to guage how much. Looks like you adapted the 7 for the slash. Hee-hee! Make the slash thinner too. Having a curved slash is another nice touch.</p>
      <p>* Accents -- angles are all fine. Ogonek is noyce, oye loyke it. Breve curve is fine but make the whole breve narrower. Lower case thorn ð stem is fine, but thin the bar down and reposition for less eccentric symmetry.</p>
      <p>Most of the sidebearings look okay except for a few:</p>
      <p>* right sidebearing of <strong>b</strong> may be too short. Study combinations b-e, b-o. Compare the right side bearing of <strong>b</strong> with that of o, e. If they are the same then the bad combos I'm seeing in the PDF may be due to errors by InD CS2.</p>
      <p>* right bearing of <strong>g</strong> looks too short. Adjust, check in combination with everything else in the lower case. Adjust until it works with the most probable combinations.</p>
      <p>* <strong>l</strong>, right bearing and possibly left one. Set the bearings by measuring from the stem. Ignore the curl tip. The basic formula for a lower case is to set the sidebearings for the stem letters -- b, d, f, h, i, j, k, l, p, q, t -- all more or less the same. They don't have to be exactly the same, but that often works well. For the bowl pairs b-q d-p, this only applies to the stem side of them, not the bowl side.</p>
      <p>* How short are the bearings on <strong>t</strong>? The right side looks a bit wide. A formula for designing lower case <strong>t</strong> is to set the sidebearings so they are the same distance from the stem as l and i. Then bring the tips of the bar on <strong>t</strong> out (or bring them in) until they are at zero with the sidebearings, or very close to zero. You can make them negative if need be.</p>
      <p>* Set up <strong>f</strong> the same way as <strong>t</strong>.</p>
      <p>* <strong>v V y Y</strong> --- usually the bearings on these are zero or close to zero. For a seriffed font it's not unusual to set the bearings negative.</p>
      <p><em>Hope you like it :)</em></p>
      <p>I love it :^)</p>
      <p>j a m e s</p>
