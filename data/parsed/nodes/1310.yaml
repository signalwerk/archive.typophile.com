    html: <p>Finally, my college minor in Math pays off!  ;-) <br>Actually, this is more like junior high stuff. <br> <br>58 degrees?! Is that correct? Well, you take the tangent of 58 = 1.6003-whatever, which is about a 16/10 = 8/5 slope. But that translates back to ~57.9946 degrees, so sticking with 58 is really just as good in this case. <br> <br>But if you want a simpler/more_elegant slope you could use 3/2 which is 1.5, and the arc-tangent of that is about 56.3099 degrees, so use 56.31 and you'll get a nice two pixel move vertically for every three pixels you move horizontally, which means your line will have alternating two and one pixel steps. <br> <br>hhp <br></p>
