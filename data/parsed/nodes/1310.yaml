    html: <p>Ren�, it's very easy to calculate the angle, in degrees, if you know the slope (and vice-versa). Softwares like Excel, and scientific calculators have the necessary (arc-tangent and tangent) functions. No need to know formulas! ;-) <br> <br>And, I think all type design softwares have that "measurement" tool. You can measure any angle, in degrees, with that tool. It's very simple too, if you don't want to go to the calculator. <br> <br>For example, let's say you want to calculate the angle, in degrees, for a 2:3 slope. Just draw a rectangle, 20units x 30units (40x60, 80x120, or anything proportional), and measure one of its diagonals. The software will tell you the angle. That's it.</p>
