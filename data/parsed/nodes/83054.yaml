      <p><strong>Concept</strong><br>
      The shopping bag to represent shopping is very obvious and forgettable.  Look at logos like amazon for an example of a great concept that keeps things memorable, simple and unique.  I would work more on the concept for sure.</p>
      <p><em>Example:</em><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Amazon-logo_3556.gif"></div><p></p>
      <p><strong>Execution</strong><br>
      This seems more like an illustration than a logo.  You will want something more iconic and easily rendered as a favicon or single color print on a shipping box.  You have way too many tiny details and shadings to work in any situation other than large full color like your example.  Try looking at it scaled down to a postage stamp or printed on a pen.  An example of an iconic shopping bag logo (and a bit better concept) is shopping.com</p>
      <p><em>Example:</em><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Shoppingcom-Logo_3734.gif"></div><p></p>
      <p>*Edit*<br>
      Looking again, is that clipart or stock imagery?  That should be avoided at all costs.  Have you considered hiring a logo designer?  That will get you a lot farther in my opinion, and there are a lot of great &amp; inexpensive freelancers to choose from.</p>
