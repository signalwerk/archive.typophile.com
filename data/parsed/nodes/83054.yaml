      <p>Your background color is the biggest issue right now.  Branding is more than just a logo, and the background color should be part of the larger picture of branding.  </p>
      <p>What is the concept behind making an X out of tags?  Could you find other ways to get at the same ideas?  The tags are ok but a bit expected.  In the shopping.com example they have combined a smiling face with a checked box and a shopping bag.  Those three elements tell a story of a successful online shopping experience, and therefore make for a pretty good logo.  What story are you telling?</p>
