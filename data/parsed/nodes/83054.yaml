    html: |-
      <p>I agree with most everything that Luma Vine said. </p>
      <p>The shopping bag may be an obvious concept, but it certainly has possibilities if you can find a more creative and practical way to use it in the logo. The way you're doing it lacks impact and wouldn't reproduce well, especially in one-color jobs or when the logo needs to be small.  I'd suggest trying some concepts using just a single bag, or if you want to have multiple bags maybe just have one in the foreground with the type on it and others just peaking out from behind.</p>
    html_clean: |-
