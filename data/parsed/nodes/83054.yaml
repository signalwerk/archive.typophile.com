    html: <p>Great improvement!  The grey is looking a bit too light to stand out enough to me, especially when it has the same darkness as the colors.  I think that square around the symbol is not adding anything.  The stroke on the text will make it hard to read at small sizes.  I would go with solid letters.  There is also a bit of trouble with 'the' capitalization - the logic of capitalizing each word makes it seem like Allthe Deals.  Great update!</p>
