    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Aviano-Didone-Poster_3748.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Aviano-Didone-Poster-2_5136.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Aviano-Didone-Poster-3_5973.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Aviano-Didone-Sample-Page_4995.png"></div><p></p>
    <p>The Aviano series returns with a Didone or Modern face. <a class="freelinking external" href="http://new.myfonts.com/fonts/insigne/aviano-didone/" rel="nofollow">Aviano Didone’s</a> high contrast forms lend elegant beauty, luxury and romance to your designs and it’s extended letterforms provide strength and power. Aviano’s foundational classical forms give the face a look that is unique for Didone faces. Aviano Didone is a bold new interpretation of vertically contrasted type.</p>
    <p>Aviano Didone comes in five different weights and is packed with OpenType features. Want ball terminals for that logotype or headline? Flat serifs? Swash forms? Aviano Didone includes 102 alternate characters. Five style sets are available, and Art Deco inspired alternates, small forms, swash, titling and stylistic alternates. Aviano Didone also includes 40 discretionary ligatures for artistic typographic compositions. Please see the informative .pdf brochure to see these features in action.</p>
    <p>Be sure to check out the rest of the <a class="freelinking external" href="http://new.myfonts.com/search/aviano/fonts/" rel="nofollow">Aviano series</a> which can be used as complementary faces, including Aviano, Aviano Serif, Aviano Sans and Aviano Slab.</p>
