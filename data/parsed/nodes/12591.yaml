  html: |-
    <p>Hello people!</p>
    <p>This is a relatively simple one - I am looking for a selection of fonts to present to a client. The client has asked for a display face in a ’50s ‘retro’ style accustomed with the stereotyped American diner, gas station etc.</p>
    <p>The first port of call was, of course, FontDiner.</p>
    <p>However, fifties retro is not really a favourite genre of mine, so has anyone got their own preferred 50’s font?</p>
    <p>Any suggestions welcomed!<br>
    Thanks in advance.</p>
    <p>(<a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=MVB.102372.0.0" target="new">MVB Bossa Nova</a> is a start!)</p>
