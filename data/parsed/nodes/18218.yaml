      <p>I think the sheer range of Ihlenburg’s work is just amazing. I have always been fascinated by his stuff. The Cary Library at RIT has an archive of personal files of his, including sketches of unpublished work. But I don’t think any of that is online. There was also a nice article by David Pankow on Ihlenburg’s work that appeared in “The Ampersand” vol 13 number 3-4, Fall/Winter 1993-94.</p>
      <p>I don’t know if that helps any.</p>
      <p>Regards,</p>
      <p>T</p>
