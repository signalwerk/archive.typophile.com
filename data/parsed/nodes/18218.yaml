    html: <p>Online resources are difficult to locate; however, you can purchase some excellent reproduction specimen books from David Peat for quite reasonable prices ($4-20 each, with multi-unit discounts available). Send him an SASE to get a catalog sheet at 1225 Carroll White Drive, Indianapolis IN 46219; or you can get a partial listing and Mr. Peat’s email address <a href="http://www.briarpress.org/cgi-bin/briarpress/show.cgi?db=direct&amp;uid=default&amp;view_records=1&amp;Category=Books:%20reference&amp;nh=7&amp;mh=1" target="_blank">here.</a></p>
