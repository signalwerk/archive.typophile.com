    <p>Good evening.</p>
    <p>I am a first semester Design student from Mexico looking for visual reference for late 19th century types and letterform designs.</p>
    <p>I was fortunate enough to find some good listings (and samples of the most popular ones like Kismet and Nymphic) by John F. Cumming, Hermann Ihlenburg and from the Mackellar Smiths &amp; Jordan foundry. On the latter I was particularly pleased to find this web site ( <a href="http://cgm.cs.mcgill.ca/~luc/mackellar/" title="http://cgm.cs.mcgill.ca/~luc/mackellar/">http://cgm.cs.mcgill.ca/~luc/mackellar/</a> ) which list a good number of types featured in the “The Compact Book of Specimens”.</p>
    <p>Now my problem is that I have yet to find any sort of on-line visual reference for a lot of these, as some don’t seem to have been digitalized yet (to my knowledge). I found quite a few ’variations’ though but not much examples of the originals.</p>
    <p>Seeing as this is a good place to ask for assistance I humbly request any sort of URL with data or images of letterforms and typefaces from that period, as I will be trying to list them for part of a presentation by image example, name, year of patent and designer.</p>
    <p>Any help would be appreciated.</p>
    <p>Thank you very much.</p>
