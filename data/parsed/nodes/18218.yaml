    html: |-
      <p>My suggestion is to use some of the font sites that allow searching by keywords, such as MyFonts.com, and use terms like ’19th century’, Art Nouveau. Victorian, Old West, Antique and see what you find. There are many designers/digitizers, like Dan Solo, Nick Curtis, Jim Spiece, <a href="http://freefonts.fateback.com/george_williams/">George Williams</a>, David Nalle and others who have mined the 19th century for many designs. The problem is that only some of them are good about documenting the sources.</p>
      <p>If you have some good books, such as the Dover book by Ludwig Petzendorfer called ’Treasury of Authentic Art Nouveau Alphabets’, then it is usually pretty easy to correlate the fonts to their original typefaces.</p>
      <p>- Mike Yanega</p>
