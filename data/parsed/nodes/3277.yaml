    html: <p> I like this font...at first glance, I thought that it had <br> graf stylings, but looking at it a little longer,  I'm  <br>seeing a Whimsy-like face with some character.  <br> <br>It looks like your original intention (and the source  <br>of your frustration) was to have nice, smooth curves. <br> But to me it looks like the letters are a little  <br>choppy/chunky...and that's a good thing. It has  <br>a very hand drawn look. <br> <br>From what I see here, my suggestion would be to  <br>even out the size &amp; weight of the characters.  <br>The "e" seems a little small in relation to the other  <br>characters. But on the other hand, I think that  <br>variation adds to the hand drawn feeling. The stem  <br>of the "m" also looks a little heavy in relation to the <br> rest of the lines... <br> <br>I say keep it up and post more examples! </p>
