    html: |-
      <p>If I were in your situation, I would look at TypeTool from Fontlab:</p>
      <p><a href="http://www.fontlab.com/font-editor/typetool/" title="http://www.fontlab.com/font-editor/typetool/">http://www.fontlab.com/font-editor/typetool/</a></p>
      <p>It's only $99 and the interface is nearly identical to FontLab. Here is the feature comparison:</p>
      <p><a href="http://www.fontlab.com/fontlab-products/compare/" title="http://www.fontlab.com/fontlab-products/compare/">http://www.fontlab.com/fontlab-products/compare/</a></p>
      <p>Since you already have the letters in Illustrator as vectors, I would just paste them into whatever program you choose to go with. Otherwise, ScanFont is only $99 more.</p>
      <p>Learn Fontlab Fast is worth getting. I will help you get up to speed quickly, and much of the content applies to TypeTool.</p>
