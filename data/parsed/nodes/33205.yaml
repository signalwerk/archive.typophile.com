  html: <p>im interrested in making lo-fi handdrawn fonts.  i've already drawn out large alphabets for many typefaces, each letter approximately the size of an 8.5 x 11" sheet of paper, scanned them in, and vectorized them in adobe illustrator.  is there any quick conversion available to turn these files into a fonts?  is it possible to cut and paste into a font program?  i know nothing of typographic software, what is available, what is possible.  any leads in the right direction would be gold to me, so thank you all in advance.  if it matters, i'm running mac os x (10.4.9)</p>
  html_clean: <p>im interrested in making lo-fi handdrawn fonts.  i've already drawn out large alphabets for many typefaces, each letter approximately the size of an 8.5 x 11" sheet of paper, scanned them in, and vectorized them in adobe illustrator.  is there any quick conversion available to turn these files into a fonts?  is it possible to cut and paste into a font program?  i know nothing of typographic software, what is available, what is possible.  any leads in the right direction would be gold to me, so thank you all in advance.  if it matters, i'm running mac os x (10.4.9)</p>
