    html: <p>Get "Logo, Font &amp; Lettering Bible" by Leslie Cabarga (Barnes and Noble usually has it) It tells you how to do it in Fontographer or get "Learn FontLab Fast" also by Leslie. Fontographer and Fontlab can be found at Fontlab.com. Typetool also from Fontlab is sort of a Fontlab light and so they have a solution for every price range.</p>
