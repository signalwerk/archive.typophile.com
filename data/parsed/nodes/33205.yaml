    html: <p>ScanFont works pretty good for this sort of thing. It can read in an EPS file and output a FontLab- or FontTool-compatible .VFB file. Which means you also need a copy of FontLab or FontTool to work with it.</p>
    html_clean: <p>ScanFont works pretty good for this sort of thing. It can read in an EPS file and output a FontLab- or FontTool-compatible .VFB file. Which means you also need a copy of FontLab or FontTool to work with it.</p>
  - id: 198376
