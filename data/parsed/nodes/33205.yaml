    date: 2007-04-20T17:42:00
    date_raw: 20 Apr 2007 — 5:42pm
    votes: null
    html: <p>Scanfont for Mac imports your scan directly into FontLab - does a pretty good job of tracing into vectors. Scanfont to Fontlab is my standard way of working.</p>
