    <p>I guess I can make a Blog entry, just to say I’ve done it. Maybe the idea will grow on me, but for now it feels rather narcissistic to think people will want to read what I have to say about Type, and yet I like the idea that they <em>might</em>.</p>
    <p>(The rest of this entry will be added as a later comment to avoid having it all set in huge type).</p>
