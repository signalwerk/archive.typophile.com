      <p>Yes Calibri for as you say (corporate font). In terms of style of the site, Im trying to create a  clean professional feel (colours black, white, magenta) black/dark grey background with white/off white content area. Headers/Focal Points in Magenta, so will stand out quite a lot anyway, so I dont want a type that is too heavy really or the over use of magenta could become too much. </p>
      <p>Do you think I could use a slab serif type for headers and it look right with Calibri as the logo type font?</p>
      <p>Thanks</p>
