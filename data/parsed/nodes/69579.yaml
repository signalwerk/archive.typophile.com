    html: |-
      <p>Well, of course it depends on the content and style of the website, if there are other places (stationery, etc.) where the logo will be paired with other typefaces, and so on.<br>
      First thing you should determine is if you want Calibri just for the logo or as "corporate face" (pull-out, etc.).<br>
      You could also try to define it in CSS, but the problem is that it's pretty small compared to most other fallback fonts.</p>
