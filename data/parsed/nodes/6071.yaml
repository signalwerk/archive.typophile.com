    html: "<p>Thread ID#: 4100/42575 <br> <br>-------- <br> <br>POST 1/4: <br>Daniel Genser: <br><a href=\"http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=daniel_genser-users\" target=\"_blank\">http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=daniel_genser-users</a> <br>Registered <br>Username: daniel_genser <br>Post Number: 1 <br>Registered: 8-2004 <br>\" <br>Hello,  <br> <br>                           I'm a new design student who is very interested in typography (in fact, this is my <br>                           first post here). I'm designing a logo for an acupuncture clinic and the problem <br>                           I'm running into is this: I'm creating the logo in a size somewhere in the <br>                           neighborhood of 8000 X 5000 at 300dpi. From there I'm resizing downward <br>                           depending on the use. The problem I'm running into is setting the type. What <br>                           methods are there to set type that large? Are there typefaces available that <br>                           large? Or is the typical method to design your own type for that size of a project? <br>                           In my smaller rough drafts I was using Trajan as the typeface. I've attached a <br>                           web-ready rough draft. Thanks in advance! <br>{logo.gif} <br>\" <br> <br>-------- <br> <br>POST 2/4: <br>Alessandro Segalini <br><a href=\"http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=as8-users\" target=\"_blank\">http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=as8-users</a> <br>Typophile Regular <br>Username: as8 <br>Post Number: 280 <br>Registered: 4-2004 <br>\" <br>Why do you set type in Photoshop?  <br>                                     Kern the dot after the P, now it is closer to S.  <br>                                     AS <br>\" <br> <br>-------- <br> <br>POST 3/4: <br>David Hubner <br><a href=\"http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=formlos-users\" target=\"_blank\">http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=formlos-users</a> <br>Uppercase <br>Username: formlos <br>Post Number: 176 <br>Registered: 2-2002 <br>\" <br>You should use a vector program / software for creating logos ( or when working with type <br>                   ), something like Freehand, Illustrator or Corel Draw.. That way, your logo being a vector <br>                   file, is scaleable and there would be no problem with rezising it..  <br> <br>                   <a href=\"http://www.prepressure.com/image/bitmapvector.htm\" target=\"_blank\">http://www.prepressure.com/image/bitmapvector.htm</a>  <br>                   <a href=\"http://graphicssoft.about.com/library/weekly/aa000327a.htm\" target=\"_blank\">http://graphicssoft.about.com/library/weekly/aa000327a.htm</a> <br>\" <br> <br>-------- <br> <br>POST 4/4 (x2): <br>Daniel Genser <br><a href=\"http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=daniel_genser-users\" target=\"_blank\">http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=daniel_genser-users</a> <br>Registered <br>Username: daniel_genser <br>Post Number: 2 (&amp;3) <br>Registered: 8-2004 <br>\" <br>                           Thanks for the suggestions. Like I said earlier, I'm a very beginning design <br>                           student! I just bought Illustrator, so I'll use that.  <br> <br>                           Also, thank you David for the links. It's hard to find solid information that breaks <br>                           things down like that on the web, sometimes.  <br> <br>                           Back to the drawing (Illustrator using vectors) board! <br>\" <br></p>"
