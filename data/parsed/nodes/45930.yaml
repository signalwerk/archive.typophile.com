      <p>I had the same problem with Freight Text on a PC, and I couldn’t live with it. The oddball naming convention sucked the usefulness out of an otherwise great font.</p>
      <p>I have a program that allows me to rename fonts, which is what I did, and I am living happily ever after. I don’t know the Mac, or programs that can rename fonts on the Mac.</p>
      <p>I’d love to know what Darden was thinking, and if he would consider renaming the fonts for the rest of the type world outside his circle.</p>
