    <p>The company I work for recently purchased the fantastic typeface Freight (<a href="https://web.archive.org/web/20081007165057/http://www.garagefonts.com/typespecimens_2.html?sku=GF060014X1P2&amp;start=1" title="http://www.garagefonts.com/typespecimens_2.html?sku=GF060014X1P2&amp;start=1">http://www.garagefonts.com/typespecimens_2.html?sku=GF060014X1P2&amp;start=1</a>)</p>
    <p>Unfortunately, we haven’t figured out how we can use it correctly on Macs (we don’t have any PCs so I’m not sure if they have a similar problem).</p>
    <p>Basically, the system seems to be handling every style and variation as a separate typeface.  I’m sure there’s a great reason for this, but since it’s the base typeface for all of our corporate use, it’s really inconvenient to have to change fonts every time we want italics, bold, etc.</p>
    <p>Is there some way to merge the text, bold, italic, and bold-italic so that the system recognizes them as a single font, and we can then use the formatting features of applications such as Word, Pages, Photoshop, etc. to select the style?</p>
    <p>This is getting more frustrating by the minute (I’m working on a large document with lots of bold and italics as I write this), so any advice is appreciated.</p>
    <p>Thanks!</p>
