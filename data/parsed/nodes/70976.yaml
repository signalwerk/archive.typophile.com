    <p>Hello folks,</p>
    <p>I am heading to my first AtypI this fall (both preface &amp; main conference) and am really looking forward to attending. Of course, between transport, accommodation and entrance fee, it gets a bit expensive...</p>
    <p>So, I was wondering if there are any other folk planning on going who would be interested / willing in splitting a room for the duration of the conference. </p>
    <p>Feel free to contact me or leave a comment!</p>
    <p>Thanks.</p>
