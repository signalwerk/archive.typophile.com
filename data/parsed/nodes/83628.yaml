    html: |-
      <p>Thank you, Jasper and Craig. </p>
      <p>I'm still not sure if I understand your 'nmh' critique, Craig, but I've looked long and hard at them, and modified them somewhat. I am very satisfied with their overall shapes (and how they carry on the cusp from the Roman), but they were perhaps a little overdone. I've also taken into account Jasper's critique of the lower case being slightly wobbly (I have thought that myself. Some angular ambiguity is intentional, though), and adjusted that subtly. Now everything should be a little smoother. The SE terminals of adklmn etc. are now less curved and points more in the slant direction. 'e' and 'c' opened a little too. And '@' is thoroughly funkified. </p>
      <p>And yes, Craig, I must ask to you explain your 'g' thoughts again. I just didn't get it. When in designer mode, my language perception isn't much to write home about, obviously. </p>
      <p>  </p><div class="imageWrap"><img src="http://typophile.com/files/Satit_rev2_4836.png"></div><p></p>
    html_clean: |-
