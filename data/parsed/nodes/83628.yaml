  - id: 470451
    user: 3254
    date: 2011-07-10T09:47:00
    date_raw: 10 Jul 2011 — 9:47am
    votes: null
    html: |-
      <blockquote><p>Aw, they're [/h/m/n/] the heart and soul of this font. How would you have preferred them?</p></blockquote>
      <p>I know, I'm really sorry that I didn't word this in a more constructive way, but I'm having difficulty pinning down what bothers me about them. I just find them ungainly in a way that doesn't have the same charm as the other quirks of the face. If it were me, I might try considering alternatives to the transitive serif at the end of the letter, just widening the whole thing a bit, or making the angle of the right side more upright to break up that curved parallel on the sides of the counter. Of course if you like it as is don't touch it!</p>
      <p>Seeing the /X/ in context... I think it works beautifully! Bravo!</p>
      <p>I'm very impressed with how well the typeface works in all-caps.</p>
      <p>At the bottom left of /Z/ you might try tapering one or the other of the strokes a bit.</p>
      <p>I can see how the top of /g/ posed a challenge: seems like there are three things you might want happening there:<br>
      - a notch of white large enough to be read<br>
      - a broad strong flat terminal to begin the big swooping stem<br>
      - the thickening of the bowl at the join which is a key characteristic of the face<br>
      Seems like you chose #1 and #2 at the expense of #3. It may well be that having all three is impossible, but I wonder...</p>
