      <p>Awesome job! The only thing (apart from everything above :-) I notice is that the angle in the lc looks uneven. By giving the glyphs with descenders and ascenders a slightly more vertical angle (more towards the angle of f), it will probably look more even. It's done in many old italics.</p>
      <p>@ looks out of place</p>
      <p>It would be more historically correct to base the ß on a long s and z, instead of s. However, z is replaced so often by s in the ß that it can't really be seen as incorrect. I guess the choice is up to you.</p>
      <p>Diagonal in Z looks too dark.</p>
      <p>Already looking forward to the release!</p>
