      <p>Gargoyle, you got some good advice.<br>
      But Typophile is a forum where opinions are discussed.<br>
      The issue of how much automation or finishing is required to produce a font is much discussed here, and I for one don't find Frode's comment damning of your font, certainly not while I have never even seen it!</p>
      <p>Who is the fool, he who spends too little time on a font, or he who spends too much?</p>
      <p>If I was a really sharp businessman, I would never bother providing italic fonts for any of my designs, as sales wise they are not cost effective. For any of my types, roman always outsells italic hugely. Bold italic serif...aargh, so much work!</p>
