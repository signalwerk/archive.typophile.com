    html: <p>Don’t worry about later additions to the family now. I think at your stage in the learning process—if you continue to nurture your interest in type—you’ll probably do the spacing and kerning all over again a bunch of times anyway. You learn so much as you go in this trade. In any case, a good fundament (=even spacing) is much better to build on then a bad one.</p>
