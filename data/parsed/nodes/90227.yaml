    html: |-
      <p>Start with ooooooooooo and nnnnnnnnnn. Then nnnnoooonnnnonnnnoooonnnnoooonoooo. Once those are a balanced you can use these (or appx) values for all straights and rounds. For letterforms that deviate, try oooxoooxxxoooxnnnxxxnnn (where x = your letter).</p>
      <p>Do the same with caps, and small caps: starting with HHHHHHH and OOOOOO, but consider how they should relate to each other and the lowercase.</p>
      <p>Punctuation adds some other factors, but that’s a huge topic -- too big for a single thread.</p>
    html_clean: |-
