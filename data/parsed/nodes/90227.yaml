      <p>Gorgoyle,</p>
      <p>Asking for help around this joint can be frustrating, if you're not in with the in crowd…which I apparently am not. However, I can suggest that you do what I did when I needed some test material for languages unknown to me: find some web pages with your target language, then copy and paste them into a Word document.</p>
      <p>If Cyrillic-based languages follow the same basic rules as letter distribution in English, this approach should cover a number of the more common kerning pairs.</p>
      <p>P.S. "this guy" is, IMHO, not unlike a hack...but a well-respected one, it would appear. I reworked over 300 of my own fonts in less than half the time, but he rules, dude.</p>
