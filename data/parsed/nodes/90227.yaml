    html: |-
      <p>A display face needs less air then a text face. Print at intended size and adjust/repeat until you are satisfied. Compare text setting with another similar typeface. (Squint and compare evenness of grey.)</p>
      <p>And another thing: Don’t touch the kerning until the spacing is perfect! If the spacing isn’t solid, you’ll end up going in circles as you already observed.</p>
    html_clean: |-
