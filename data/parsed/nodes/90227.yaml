    <p>I'm in process of designing and redesigning glyphs but need some advices how to do spacing and kerning properly on non-serif font? Where in a font are a lot of letters "same width".</p>
    <p>What are test words, texts of you experienced technical fonts designers for spacing and kerning?<br>
    How to do easiest spacing and kerning on my font in Font Lab Studio?<br>
    Using classes? But what classes and letters actually in my font(look picture)?</p>
    <p>I tried auto kerning and I don't like results. I tried Optical metrics feature in Adobe programs and also not liked result. I want to do kerning properly and won't hesitate to do it manually, pair by pair. But how? From where to start? I tried by myself to do it but I see that moving some values in one part may make problem "in other part" of the font. So I can circle in that forever.</p>
    <p>Briem guide is for serif fonts I think, so Briem not helping here in my case.</p>
    <p>Help me to make it right...</p>
    <p>I wanna make display, technical, geometrical and cargo font so I would like to see advices of font designers of that kind of fonts. I wanna make Latin 1 and Central European font for the start. Will add Cyrillic code pages later.</p>
    <p><a href="http://i44.tinypic.com/2co1ncg.png" title="http://i44.tinypic.com/2co1ncg.png">http://i44.tinypic.com/2co1ncg.png</a></p>
    <p>EDIT: save linked picture on your computer and look better in some image viewer. Image is Hi-res.</p>
