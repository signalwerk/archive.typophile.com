    html: |-
      <p>The exact measurement was a metrical one, i.e. based on the meter, namely one fifteenth (i.e. 1/15) of 35 centimeters, so that the height of paper or height to paper or type height was exactly .9186 inches (instead of .918 inches). For details see Victor Strauss, The Printing Industry, Bowker 1967, page 60 and page 753.</p>
      <p>(The US typographical point size measurement was also a metrical one, namely eighty-three picas were set as equal to 35 centimeters, i.e. 83 x 12 = 996 points.)</p>
