    <p>Does anyone know the reason when / why <a href="http://typophile.com/wiki/type_high" target="_blank">type high</a> became .918 inches?<br>
    I’ve heard explanations that range from it being a totally arbitrary number (which I find hard to believe) to having it correspond to the length of someone’s thumb.<br>
    Is there a definitive answer to this that anyone knows of?</p>
