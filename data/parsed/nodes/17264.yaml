    <p>Hello people,</p>
    <p>I need some crit on a logo that I am doing for a personal project (don't they seem like the hardest ones?), it's a website that is basically a web zine. The topic is vegan/vegetarian/DIY/indie subculture with accent on recipes and basically food and drink, but what's more important--education of people here (Serbia) on the topic of veganism/vegetarianism, because when you tell someone you don't eat meat here you look like a freak. So I want it to be very appealing visually, I am not looking for "deep meaning and clever" here, just plain sweet and mild, therefore the ferlauf (sorry--gradients). :)</p>
    <p>The concept is that I took the word "herbivore" and played around with it resulting in "herbiv.org" for both the internet adress (obviously) and the mag name, it's in the pronounceation where you'll find the most similarity between those two. :)<br>
    It's shorter than herbivore.org and I think more clever and memorable, at least for me, <strong>but I'm interested what do you guys think?</strong></p>
    <p>As far as the logo itself is concerned, I just made the "g" nibble on the leaf--as the last logo says itself.</p>
    <p>(For claricication <a href="http://i2.photobucket.com/albums/y38/TheJay/herbivorg.png" rel="nofollow">here are the logo versions</a> (213kB) and <a href="http://i2.photobucket.com/albums/y38/TheJay/herbivorg_colors_and_favorite.png" rel="nofollow">here is the direction I have decided to go along with the color versions</a> (518kB), the last bigger one is my current pick.)</p>
