    html: |-
      <p>You may be aware of this, but keep in mind that even lines and points are filled shapes; otherwise, they would have no width. A horizontal line, for instance, is a horizontal rectangle with a large width and a very small height. I am not a type designer, so forgive me if I misunderstand your question, but I think that even if you're making a simple "stroke" font, you would have to draw both sides of the stroke and join them at the ends to give it its width.</p>
      <p>Hope this helps.</p>
      <p>Josh</p>
