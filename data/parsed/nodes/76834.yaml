  html: |-
    <p>I would like to create a font with very few lines and points and no fills, for applications like these: <a href="http://johannesgees.com/?p=123" title="http://johannesgees.com/?p=123">http://johannesgees.com/?p=123</a><br>
    I have started in Fontlab Studio, which I am new to. If I draw only lines, I understand that I need to close the countours, but can somebody explain to me what exactly this does when I have only strokes? It looks a bit like Fontlab is making the lines double when I click "close contours", is that true?</p>
