    html: |-
      <p>Thank you very much!</p>
      <p>I know I have to alter most of the characters, so it really helps that you singled some out, glyphobet. That way I can tell what's more important and noticeable and what's not.<br>
      I had kind of thought about the tails on Q and R, but I thought they should be different, since I was aiming to create a uniqueness on all (or most) of the characters... and also, I really like the angular tail on the Q, but think it wouldn't work on the R. Also, this R will probably be an alternate, so that wouldn't be that big of a deal... but I will think about that (and the Y). Thank you for pointing that out!<br>
      You're right about the X and the F – though I was fond of that top left of the F – and I will think about that idea about the O, too.<br>
      I'm really glad you liked those characters... the T, for instance, was really great, in my head, but when I drew it it kind of looked strange and out of balance... I also thought maybe the H should be a tad wider and I should do something about the top leg on the K (though I still don't know what, exactly); what do you think?</p>
      <p>Now about mr: I'm glad you like it!<br>
      I did run into a lot of trouble with the N and the M... I was thinking the contrast is there on all the characters, but it is a bit discreet, so when I thought about the contrast on these letters I didn't want to overdo it, because it would be too noticeable... you really think I should give them more contrast? Should I focus on making the thin strokes thinner, the thick thicker or both?<br>
      About the D, I'm thinking I should probably make it a bit wider, because it's hard to add contrast when the thin part of the stroke isn't long enough. Originally it was wider, but the counter looked too open when compared with the others...</p>
      <p>Thanks again and please, keep'em comin'. :)<br>
      rubenD</p>
