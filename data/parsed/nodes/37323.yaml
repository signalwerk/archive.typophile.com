      <p>I love unicase fonts.  This is cool.  You might look at the gothic alphabet and uncial faces for some inspiration.</p>
      <p>I like the K, Z, T, and H best. </p>
      <p>Keep the flair inside the O, just make it a bit smaller, and make it not touch the right side of the bowl.</p>
      <p>The X is falling over to the right.  </p>
      <p>The tail on the Q and R are too different. Pick angular or curved, and run with it.  Same with the Y. </p>
      <p>The F looks like something mashed it down on the top left.</p>
      <p>Hope this helps. Keep going with this.</p>
