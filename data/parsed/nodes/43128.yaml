      <p>There’s a passage in the Sign Painter section of the House Industries book about John Downer coming out and teaching them some stuff, try playing that one up. Also, have you tried searching <em>The Design and Applied Arts Index</em> for articles? I find that it’s often the only useful database for tracking down good stories about designers, especially type designers. If your school library doesn’t have access to that database, get the librarian to direct to a library that does. Because you’re in New York you have access to some great libraries, so get out there and ask the librarians to help you look stuff up. You should see if the <!--
