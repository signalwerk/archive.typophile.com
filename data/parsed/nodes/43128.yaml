    <p>Hello,<br>
    This is my first time on this forum and I am new to this page. I was recently assigned a research project for typography on a type designer. The designer that I received is <a href="/web/20080907091832/http://typophile.com/wiki/John%252BDowner" class="wiki">John Downer</a>. I am have some trouble finding the resources and information I need. The largest  issue that I am having is finding information that is considered an article. I am only allowed 2 internet sources the rest have to be from articles and books and I need 6 sources total. I was looking to see if some one could point me in the right direction of where to look. I would appreciate the help.<br>
    Thank You.</p>
