    <p>1) Tottenham Hotspur rule OK!</p>
    <p>The new identity of the London football club Tottenham Hotspur was<br>
    recently unveiled. As part of the identity update the cockerel was redrawn<br>
    and a display typeface designed by Dalton Maag.</p>
    <p>More: <a href="http://www.daltonmaag.com/news/35.html#s1" title="http://www.daltonmaag.com/news/35.html#s1">http://www.daltonmaag.com/news/35.html#s1</a></p>
    <p>1) Die Tottenham Hotspur kommen!</p>
    <p>Die neue Identität des Londoner Fussballclubs Tottenham Hotspur wurde<br>
    kürzlich vorgestellt. Als Teil des neuen Aufrittes wurde auch der Gockel<br>
    im Logo neu gestaltet; die Display-Schrift wurde dabei von Dalton Maag<br>
    gezeichnet.</p>
    <p>Mehr: <a href="http://www.daltonmaag.com/news/35.html#s1" title="http://www.daltonmaag.com/news/35.html#s1">http://www.daltonmaag.com/news/35.html#s1</a></p>
    <p>2) Möbel Pfister becomes Pfister</p>
    <p>You may have been quite surprised by some full-page adverts in Swiss daily<br>
    newspapers: the well established and traditional Möbelhaus Pfister has<br>
    created some impact with its new look. The new visual identity was<br>
    developed by Külling &amp; Partner, Zurich.</p>
    <p>More: <a href="http://www.daltonmaag.com/news/35.html#s2" title="http://www.daltonmaag.com/news/35.html#s2">http://www.daltonmaag.com/news/35.html#s2</a></p>
    <p>2) Möbel Pfister wird Pfister</p>
    <p>Wer in den vergangenen Wochen die ganzseitigen Anzeigen in den Schweizer<br>
    Tageszeitungen beachtete, kam aus dem Staunen nicht mehr heraus: Das<br>
    altehrwürdige Möbelhaus Pfister setzte sich wirkungsvoll mit seinem neuen<br>
    Outfit in Szene. Die neue Identity wurde von Külling &amp; Partner, Zürich,<br>
    erarbeitet. Was aber alles dazu gehört, ein Unternehmen wie Pfister<br>
    (bleiben wir beim neuen Namen) zu einem neuen Gewand zu führen, das lässt<br>
    sich nur erahnen.</p>
    <p>Mehr: <a href="http://www.daltonmaag.com/news/35.html#s2" title="http://www.daltonmaag.com/news/35.html#s2">http://www.daltonmaag.com/news/35.html#s2</a></p>
    <p>3) Dalton Maag font updates</p>
    <p>Dalton Maag is updating its font library with new standard character sets,<br>
    fonts and typefaces. Co, Plume, Royalty and Fargo are the first to be<br>
    updated and are available as of now. Customers who have already purchased<br>
    Co will be eligible for a free update of the fonts.</p>
    <p>More: <a href="http://www.daltonmaag.com/news/35.html#s3" title="http://www.daltonmaag.com/news/35.html#s3">http://www.daltonmaag.com/news/35.html#s3</a></p>
    <p>3) Font Updates von Dalton Maag</p>
    <p>Dalton Maag ist zur Zeit daran, die gesamte Bibliothek der Schriften mit<br>
    neuen Standards auszurüsten. Co, Plume, Royalty und Fargo sind die ersten<br>
    zur Verfügung stehenden Updates. Kunden, welche Co bereits besitzen,<br>
    werden mit einem Gratis-Update ausgerüstet.</p>
    <p>Mehr: <a href="http://www.daltonmaag.com/news/35.html#s3" title="http://www.daltonmaag.com/news/35.html#s3">http://www.daltonmaag.com/news/35.html#s3</a></p>
