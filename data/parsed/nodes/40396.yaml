  html: |-
    <p>The combined structure and style of a letter or <a href="/wiki/glyph" class="freelinking" rel="nofollow">glyph</a>, its physical form. Basic Latin letterforms consist of the letters a to z, and A to Z, and the Arabic/Indian <a href="/wiki/numerals" class="freelinking" rel="nofollow">numerals</a> 0 (zero) to 9. Letterform is analogous to letter structure.</p>
    <p>Letterforms are represented by sub-types. For example, capital Latin A letterform is a triangular structure mirrored by its gothic counterpart letterform, the straight-sided loop top A. In <a href="/wiki/roman" class="freelinking" rel="nofollow">roman</a> types, the  triangular lowercase <a href="/wiki/v" class="freelinking" rel="nofollow">v</a> letterform has an alternate cursive v letterform. Each is treated as a ditinct letter form or structure.</p>
