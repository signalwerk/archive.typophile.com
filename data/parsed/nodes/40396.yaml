  html: |-
    <p>The combined structure and style of a letter or <a href="/node/12748" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Glyph</a>, its physical form. Basic Latin letterforms consist of the letters a to z, and A to Z, and the Arabic/Indian <a href="/node/add/wiki?edit%5Btitle%5D=numerals" title="Create node &quot;numerals&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">numerals</a> 0 (zero) to 9. Letterform is analogous to letter&nbsp;structure.</p>
    <p>Letterforms are represented by sub-types. For example, capital Latin A letterform is a triangular structure mirrored by its gothic counterpart letterform, the straight-sided loop top A. In <a href="/node/14507" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Roman</a> types, the  triangular lowercase <a href="/node/add/wiki?edit%5Btitle%5D=v" title="Create node &quot;v&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">v</a> letterform has an alternate cursive v letterform. Each is treated as a ditinct letter form or&nbsp;structure.</p>
