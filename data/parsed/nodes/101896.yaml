    <p>Hi,</p>
    <p>I hope it's ok to post these questions here.</p>
    <p>- Aside from the OS typefaces and the ones that come with Adobe CS, are there other collections which are deemed "must haves" (either free or that can be purchased as a collection)?</p>
    <p>- I'm interested in learning the art of actually creating typefaces. What are considered the best learning material (books/online) and tools (Fontlab?)?</p>
    <p>Thanks,</p>
