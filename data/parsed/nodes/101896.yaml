      <p>If you are a student, there are some additional options available to you for inexpensive font collections.</p>
      <p>Regarding books, currently I suggest the following as the optimal $100 type designer’s starting library:</p>
      <p>Fontographer: Type by Design by Stephen Moyes (out of print, used)<br>
      The Stroke by Gerrit Noordzij<br>
      The Elements of Typographic Style (4th edition) by Robert Bringhurst<br>
      Designing Type by Karen Cheng<br>
      Anatomy of a Typeface by Alexander Lawson</p>
      <p>Notes:</p>
      <p>I would have Letters of Credit by Walter Tracy on the list, but it is not only out of print, but horribly expensive.</p>
      <p>The Fontographer book may seem very software-specific, but it is actually a great general intro to how to work with bezier curves and the like.</p>
      <p>Karen Cheng’s book is a bit polarizing for some folks, but most of us seem to think it is useful. Yes, you can do most of the same analysis on your own with a decent library of fonts and a font editing program, but it would take a bunch of work; somebody else doing that for you is helpful, IMO.</p>
      <p>Finally, other books may come into play depending on what font editing tool you use. The software manual itself may be of use....</p>
