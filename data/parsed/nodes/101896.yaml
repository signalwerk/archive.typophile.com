      <p>Although fonts are not neccesarily bought as collections – more often they are bought one font or family at a time – but you could start here:</p>
      <p><a href="http://typophile.com/node/30047" title="http://typophile.com/node/30047">http://typophile.com/node/30047</a></p>
      <p>There are no such things as must have fonts though, it all depends on what you do with them, what you like, and what’s your budget. You could do searches on Typophile for threads on what people consider the best or essential typefaces. What you will see though is that these lists are different from person to person.</p>
