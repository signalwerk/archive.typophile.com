      <p>In addition to creating a blotchy appearance on the page, bold text has more visual emphasis than regular text within a block of copy. This conveys the impression that the bolded text is <strong>more important</strong> since it seems to speak louder.</p>
      <p>Italic text, on the other hand, has the same overall visual color as regular text and <em>simply suggests a distinction</em> without implying anything about relative importance.</p>
      <p>Judging only from you post and not having seen the work, I think your client wants you to do something that will not only be visually unattractive but will also convey the wrong meaning.</p>
