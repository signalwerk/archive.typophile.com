      <p>I'd say that using italic and Roman in the fashion you describe provides a greater contrast than using bold/regular. Not in terms of typographic colour, of course, but in most other respects. It changes the mood and the voice completely, while boldface just dims the light.</p>
      <p>And you are in my opinion right about boldface for extended reading. Contrasting it with a regular weight would work against the intention, making the most important matter less accessible and pleasant to read than the commentary.  </p>
      <p>I agree that a modern (in the typographical sense) serif would be your best bet if the client still insists. It was Bodoni who invented boldface (though it wasn't very bold, and I don't think he used it for contrast), the bolds of earlier typefaces are modern inventions. Very rarely do they look good, in my opinion. Bold letters needs simple, clean shapes to work well, if readability is a goal.</p>
