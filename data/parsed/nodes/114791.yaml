      *Roman-Italic<br>
      *Regular-Bold<br>
      *Leading<br>
      *Paragraph indents<br>
      *Justified-Ragged<br>
      *Black-Grey</p>
      <p>Let it go!<br>
      A better design would be to keep exactly the same setting throughout, just changing weight…</p>
      <p>“Maximum meaning, minimum means.” —Abram Games, zen master.</p>
