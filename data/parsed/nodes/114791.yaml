      <p>The 1978 novel <em>Birdy</em> was a story told by two narrators. In the original hardcover edition, the publisher (Knopf) set the text in Linotype Electra, using Electra Roman for the voice of one narrator and Electra Italic for the other.<br>
      When W.A. Dwiggins designed Electra in 1935, he drew the Italic as a slanted version of the Roman letterforms, not cursive. (This was a radical idea at the time, and Mergenthaler later insisted that Dwiggins draw a conventional Italic, which they released in 1944 as Electra Cursive.) In <em>Birdy</em>, Knopf paired Dwiggins' original Electra Italic with Electra Roman, so that readers could easily spot the difference but wouldn't have to wade through page after page of cursive letterforms.<br>
      If you can find a hardcover edition of <em>Birdy</em> (maybe your local library has one), you could show it to your client to demonstrate that an obliqued Roman might work better than bold as a contrasting text face. (Don't show them the mass-market paperback--that uses a cursive Italic for the second narrator's passages.)</p>
