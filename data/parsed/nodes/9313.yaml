    html: <p>I always enjoy illustrations made of type. As for the logo, the characters look retro and techno at the same time. I think it's the thick and thin aspects, whether it's stroke modulation or counters vs stroke weight. Normally I would say the one that looks like a backward s is out of place (because it has the only thin stroke), but it seems to be working with the other elements. What is the music like? I'm guessing it has a little intensity to it.</p>
