  html: '<p>hello everybody. i am new to this grate site. i would like to show u new work that me and my partner made ( we have recently opened a studio ) this is a logo (and also a cover ) of a cd of a singer here in israel. the cd is allready out, but i would be glad to hear your comments and critques for it. the image is built from hebrew letters ( font name: livorno) and the name is built from a letter that we made here at the studio. it is interesting to see what u have to say about it ( as most of you dont read hebrew, i assume). thanx <br>dani<img src="http://www.typophile.com/forums/messages/29/65615.jpg" alt="logo for muk e"></p>'
