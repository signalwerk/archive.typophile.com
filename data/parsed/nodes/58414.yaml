    <p>Well having FINALLY decoded Peter Saville's so-called colour-code-typography from the early 1980s, I also discovered his 'free fonts' on a site hosted by British Telecom;</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture-1_6648.jpg"></div><p></p>
    <p>Now I'm sure this is wonderful news for all you Joy Division/New Order fans out there, BUT as far as I can see, these are all typefaces that go by standard industry names anyway</p>
    <p>Closer = Trajan<br>
    Blue Monday = Engravers Gothic?<br>
    Low Life = Futura<br>
    Republic = Univers Condensed Bold Oblique?<br>
    Substance = Bodoni?<br>
    Technique = Helvetica Neue Black Oblique<br>
    Atmosphere = Wim Crouwel's New Alphabet?<br>
    1993 = New Handel Gothic<br>
    Ceremony = Albertus<br>
    World = Serpentine</p>
    <p>Are these cuts unique to those particular projects or am I (like with the colour-code-typography) missing something here?</p>
