    <p>I'm adding Opentype features to a font for the first time. I have already added two sets of alternates and a set of discretionary ligatures. Most of the ligatures I want are made and I would like to add accents on some of them using anchors. Here's an example:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MultiLigature1_4990.gif"></div><p></p>
    <p>When I look at the preview, everything seems to be ok, but when I'm trying to generate composite, it doesn't work as you can see in the next picture. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MultiLigature2_4729.gif"></div><p></p>
    <p>The accents are positioned correctly but the ligature are replaced by both glyphs.</p>
    <p>When I'm trying to positioned the accent on the second letter within the ligature. The preview is still correct:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MultiLigature3_5884.gif"></div><p></p>
    <p>When I generate composite, the ligature is still replaced by both glyphs, the position of the accent is not above the right part of the ligature and is too low:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MultiLigature4_4634.gif"></div><p></p>
    <p>Anyone knows what I'm doing wrong<br>
    Thanks</p>
    <p>Raphael</p>
