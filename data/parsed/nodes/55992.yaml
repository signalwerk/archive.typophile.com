    html: |-
      <p>As regards the wrongly placed accents (your last screenshot):<br>
      If you add a tilde before each accent name in your glyph composition text like<br>
      &nbsp;&nbsp;&nbsp;&nbsp;<em>C_A+~acute=C_Acute</em><br>
      this will prevent FLS5 from performing some positioning tricks. If you click the green button with a questionmark in it (bottom right of the <em>Generate Glyphs</em> ... dialog), a dialog will show some more information.</p>
      <p>As regards decomposition of ligature into individual glyphs:<br>
      FLS5's glyph generation mechanism has a built-in trick that, if you provide a glyph name that involves underscores like<br>
      &nbsp;&nbsp;&nbsp;&nbsp;<em>C_A+dieresis</em><br>
      then FLS will ignore the part after the '=' and instead use the 'components' as found in the 'C_A' name, i.e. 'C' and 'A'. I have not found a way to avoid this -- except for, temporarily, replacing the underscore in the ligatures' glyph names by another character or string.</p>
