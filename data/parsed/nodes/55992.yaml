    html: |-
      <p>You could use a little script like:</p>
      <p>sr = ("_","!!!")<br>
      #sr = ("!!!","_")<br>
      for g in fl.font.glyphs: g.name = str(g.name).replace(sr[0],sr[1])<br>
      fl.UpdateFont(fl.ifont)<br>
      print "done!"</p>
      <p>Copy/paste into the Macros Panel. You'll need to replace typographic quotes by simple ones.<br>
      Before generating glyphs, run the script with the second "sr = ..." line commented out. After generating glyphs, run it again but with the first "sr = ..." line commented out. (Of course you'll need to do a search/replace in your glyph composition text too.)</p>
