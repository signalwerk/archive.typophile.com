  html: |-
    <p>Happy New Year to all!</p>
    <p>We're currently using ATM Delux to manage our fonts, mostly in Windows XP. All the fonts are stored on a network drive and we're able to create and export font sets for each project. Before beginning word on a project we always go to the central location and load the font set for that project. The ATM sets are simply a list of pointers to the font files so that when we update a font (as we do for some of our series books) when the fonts are next loaded the font files are re-read and the most recent version of the font gets loaded.</p>
    <p>Trouble is ATM is VERY sketchy in Windows 7 and won't work at all on some installations.</p>
    <p>We have Font Explorer X on the Mac but it, unfortunately, doesn't allow the export of the sets as described above. I'm looking into other programs now but the few I've checked thus far only indicate that you can manage them into sets, I've not seen specific info for exporting the sets.</p>
    <p>Making my plea here so as to hopfully avoid downloading bunches of programs for trial.</p>
    <p>Many thanks,<br>
    Ken</p>
