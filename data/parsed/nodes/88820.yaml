    html: |-
      <p>ATM deLuxe is not supported in Windows Vista and Seven –and it is supposed not to install or run properly on these systems. Anyway, it works with some adaptation.</p>
      <p>Just copy-n-paste the folder where ATM was installed in a XP. Create a shortcut to the executable and make it run in XP SP2 compatibility mode:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/atm00_5263.png"></div><p></p>
      <p>In ATM settings, define the folder where it manage fonts as a subfolder from Windows Fonts system place. Works perfectly for me. I just avoid to change the original Windows fonts with ATM –to this, I use Windows Fonts control.</p>
      <p>ATM deLuxe can even managem MM fonts in Windows Vista/Seven:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/atmmm01_4296.png"></div><p></p>
      <p>Newer applications, as InDesign CS5x, cannot recognize MM instances. But they are active, as this Word 2002 screen shows:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/atmmm02_6671.png"></div><p></p>
      <p>Of course, although ATM can work in newer OS, it may be not the best option if compared to tools available today –and Thomas pointed a good one.</p>
