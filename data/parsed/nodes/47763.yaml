      <p>I thank each of you for your honest opinions. They’ve helped me gain a better perspective on this. My favorite part was also the name; my name being Penn, it seemed to be the perfect name for my design company. Sadly, however, after doing a little research on the name, I came up with a few other conflicting organizations / companies.</p>
      <p>1. William Penn University’s literary magazine is called Penn &amp; Ink <a href="http://www.wmpenn.edu/Academics/DivisionsAreasofStudy/Humanities/English/PennInk/tabid/161/Default.aspx" title="http://www.wmpenn.edu/Academics/DivisionsAreasofStudy/Humanities/English/PennInk/tabid/161/Default.aspx">http://www.wmpenn.edu/Academics/DivisionsAreasofStudy/Humanities/English...</a><br>
      2. There is a publishing company called Penn &amp; Ink publishing <a href="http://pennandinkpublishing.com/" title="http://pennandinkpublishing.com/">http://pennandinkpublishing.com/</a><br>
      3. Pennandink.com is registered to Penn &amp; Ink communications <a href="http://pennandink.com/" title="http://pennandink.com/">http://pennandink.com/</a><br>
      4. Similarly, if you search on google penn and inc (note the inc not ink), there is another design site coming soon under that title. (Even if it is crappy design, it’s still got a similar title and similar vocation as an organization) <a href="http://pnidesign.com/" title="http://pnidesign.com/">http://pnidesign.com/</a></p>
      <p>It seems my title is dead in the water. If you guys don’t think that these companies are reason enough to give up the name, I have a question about domain names. I checked the domain: <a href="http://www.penn&amp;ink.com" title="www.penn&amp;ink.com">www.penn&amp;ink.com</a> and nothing came up, but I’m wondering if having an ampersand in a web address is possible. Is it? </p>
      <p>Once again, thanks guys for all your help.</p>
