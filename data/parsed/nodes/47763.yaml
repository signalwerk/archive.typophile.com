      <p>I dislike that you’re making the letters into a person, and the different versions with the pencil and brush forms evoke a sense of lumpy, malformed tails or oddly shaped bowel movements.  The circle seems forced and tacked on.  I don’t mean to be mean-spirited or disgusting; this is just what I see.</p>
      <p>As for your contention regarding design puzzles: some reveal themselves as “a-ha!”, others obfuscate with “huh?”, and still others repulse with “what the hell?”  If you’re insistent that your designs are puzzles, then I’m in between “huh?” and “what the hell?”</p>
      <p>I agree with the other posts, however, that your concepts (“penn &amp; ink” and “plg”) are brimming with expressive potential, and I am curious and excited to see what directions you develop as your research progresses.</p>
      <p>—<br>
      Nick Hladek</p>
