    <p>I am considering doing an Indian Font with non-latin letters as a supplement to a "indianized" latin font. My first idea was to place the letters in the regular boxes, and then providing a keyboard-layout as seen in this website:<br>
    <a href="http://www.geocities.com/SiliconValley/Lab/9988/keyboards.htm" title="http://www.geocities.com/SiliconValley/Lab/9988/keyboards.htm">http://www.geocities.com/SiliconValley/Lab/9988/keyboards.htm</a></p>
    <p>But then I also studied OSX own Punjabi-font Gurmukhi MT which comes with the OSX, and saw that this is done in another way, with Unicode. In this font, the glyphs is not where the latin letters are, but in other places marked *** below the standard squares. As an example, one font had 402 number of characters allowes instead of standard 256 and these new boxes is placed below with a specific Unicode-number.</p>
    <p>Is there anyone who has any experience of producing non latin fonts with their given unicode numberings? How do this work basically? How do people use it later on? Latin Keyboards do not have any possibility to use these "unicode fonts", or do they?</p>
    <p>The reason for this Indian alternate version of my Latin alphabet, was not intentionally to make a full working Indian font, but more as an "extra bonus" for the standard font, but then I though that why not make it "for real" - and maybe do a font where the Indian letters are placed BOTH in the regular latin keyboard AND with Unicode.</p>
    <p>If the questions seems strange, it's because I don't know what I am talking about and my english is not native language. =)</p>
    <p>Any knowledge on this?</p>
    <p>Thanks in advance.</p>
