      <p>Goran,<br>
      If you are using FontLab, you can select the codepage you are interested in from the Unicode mode pop-up list.  This will give you a ghosted bitmap in the background of the glyphs needed with the proper names and unicode numbers in place. Opentype/unicode is the way to go and will live much longer than remapping methods. Hopefully Adam will give you more details but there are numerous code pages to choose from.  I have done Greek and Cyrillic but there are many more available.</p>
      <p>ChrisL</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/devangari_5957.png"></div><p></p>
