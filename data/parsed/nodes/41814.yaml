    date: 2008-02-11T00:03:00
    date_raw: 11 Feb 2008 — 12:03am
    votes: null
    html: |-
      <p>Vista does indeed have Cleartype turned on by default, and in XP it is done by going into the appearance tab of the display properties dialog, and then clicking the 'Effects...' button and there's a dropdown box in there.</p>
      <p>There are a huge host of fonts which render poorly without cleartype on at small or even text sizes, so when doing web work it needs constant checking because, as brendanm noted, most XP users wouldn't have a clue what cleartype was or how to turn it on.</p>
      <p>-Rafe</p>
