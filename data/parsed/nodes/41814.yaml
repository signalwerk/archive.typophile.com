    html: |-
      <p>99% of the people in the world cannot tell Univers from Helvetica. 99% of the of the same people probably couldn't tell Helvetica from Arial.</p>
      <p>At body copy size, with Cleartype turned off, that means that most of the people in the entire world won't even notice if you use Univers, Helvetica, and Arial all in the same word, let alone the same page.</p>
      <p>So if you're going to go sans, stay with Arial.</p>
      <p>Although... I like setting Lucida at 13 point, since that's the same size as the UI of the computer (XP and OS X. Sii? Correct me if I'm wrong.).</p>
