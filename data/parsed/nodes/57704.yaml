    <p></p><div class="imageWrap"><img src="http://typophile.com/files/PosterPreviewSmall_3682.jpg"></div><p></p>
    <p>See larger poster <a href="http://www.lewisbullock.com/PosterPreview.jpg" rel="nofollow">here</a> for detail of cross-stiches in all characters.</p>
    <p>This is my first typeface, started in February as part of a university project.</p>
    <p>It's purely playful and teamed with a experimental specimen book that expands the traditional idea of typesetting witty text quotes or pangrams, to include an entire story with illustrations about the typeface. This typeface is the visual representation of the character Ina within the story.</p>
    <p>Looking for any critique and tips on Opentype as I'd like to include a few ligatures in the future.</p>
    <p>Thanks!</p>
    <p>p.s. I have a Flickr set with a few photos of development <a href="http://www.flickr.com/photos/doubleyoudoubleyoudot/sets/72157615005997770/" rel="nofollow">here</a></p>
