    <p><strong>Mrs Eaves Bold Italic Addition by Zuzana Licko</strong> </p>
    <p>Emigre is proud to announce the <a href="http://www.emigre.com/fontpage.php?PMrsBI.html">Bold Italic</a> addition to the Mrs Eaves family. Like the regular Italic, the Mrs Eaves Bold Italic style includes a large collection of <a href="http://www.emigre.com/fontpage.php?PMEJLigBI.html">ligatures</a>, ranging from the common to the fanciful. </p>
    <p>Zuzana Licko designed Mrs Eaves in 1996, as a reinterpretation of Baskerville. Now, the Bold Italic style adds even more versatility to the Mrs Eaves family. </p>
    <p>In her rendition of this classic typeface, Licko addressed the sharp contrast, which was highly criticized in Baskerville’s time. Her reduced contrast interpretation retains an overall openness and lightness, while mixing a modern drawing approach with familiar classic details, making it a highly legible design that is reminiscent of a time past. </p>
    <p>View, order, and read more information about the Mrs Eaves family here:<br>
    <a href="http://www.emigre.com/MrsEaves">http://www.emigre.com/MrsEaves</a> </p>
    <p>Available in Macintosh, Windows or OpenType formats. </p>
    <p>The Mrs Eaves <a href="http://www.emigre.com/ot.php?id=109">OpenType</a> Bold Italic font includes the following features:<br>
    Extensive Ligatures, Proportional Old Style Numbers, Proportional Lining Numbers, Tabular Old Style Numbers, Tabular Lining Numbers.</p>
    <p>Other fonts in the Mrs Eaves OpenType family include the following features:<br>
    Small Caps, Petite Caps, Extensive Ligatures, Proportional Old Style Numbers, Proportional Lining Numbers, Tabular Old Style Numbers, Tabular Lining Numbers, Superior Numbers and Scientific Inferior Numbers, Numerator and Denominator, Fractions, Arbitrary Fractions, and Ornaments. </p>
    <p>Accessing typographic features in OpenType fonts requires an Adobe OpenType savvy application, such as InDesign 2, Photoshop 6 or Quark 8.</p>
