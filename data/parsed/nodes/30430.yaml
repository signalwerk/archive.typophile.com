    <p>Dear Typophiles,</p>
    <p>I am going to see a client in London next week to discuss their use of the Frutiger typeface.  They contacted me a few weeks ago asking for some help in standardising their versions.  Now, I do not have any idea what version of the font they are using, but I want to prepare myself properly for the meeting and show to them that I actually have some idea of what is going on!</p>
    <p>Now, as I understand it, the original Frutiger typeface is owned by Linotype, but other font foundry's have also created the 14 weight family. i.e. Monotype (Frutiger MT) and Bitstream (Humanist 777). Please correct me if this is inaccurate.</p>
    <p>The main reason that they want to meet with me is that their marketing, design, and print departments seem to be using conflicting versions of the font, and they want to standardise on one version so that their brand is consistent.</p>
    <p>I am going to ask the respective font foundry's for some sample settings to take to the client, but is there any other information, i.e. good/bad points about all three that should be considered.  I know that most of you will say to me that the original Frutiger should be used, and I agree with this, but I would like to give the client some options and a bit of history.</p>
    <p>Look forward to any responses.</p>
    <p>Kind regards<br>
    Neil</p>
