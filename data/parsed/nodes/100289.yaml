      <p>Given the application to literature it may well have yielded intriguing results (in that context) if applied to whole words and then if tweaked for frequency analysis based on selectable criteria, such as words containing particular letters, or more unusual words. It would be a nice feature in an e-reader and could possibly aid accessibility and readability, as Hrant notes.</p>
      <p>I am also reminded of the article <em>About the Typefaces Not Used in This Edition</em> by, Jonathan Safran Foer:</p>
      <p><a href="http://www.guardian.co.uk/books/2002/dec/07/guardianfirstbookaward2002.gurardianfirstbookaward" title="http://www.guardian.co.uk/books/2002/dec/07/guardianfirstbookaward2002.gurardianfirstbookaward">http://www.guardian.co.uk/books/2002/dec/07/guardianfirstbookaward2002.g...</a></p>
