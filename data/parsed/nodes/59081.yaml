      <p>Giza doesn’t have a serif on the middle arm of the E, but I think your <a class="freelinking-external" href="http://new.myfonts.com/fonts/agfa/atbehemoth/">Behemoth</a> suggestion is a good choice. A little extra stroke thickness would do it, I think. <a class="freelinking-external" href="http://new.myfonts.com/fonts/berthold/quadra-57-bq/">Quadra 57</a> was the other font I looked at, but the serifs are not bracketed.</p>
      <p>- Mike Yanega</p>
