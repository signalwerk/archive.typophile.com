  html: |-
    <p>A fun typeface for light-hearted projects. I've used it primarily for t-shirt designs and posters for children's activities. I know it isn't the usual fare for folks around here. Available at Myfonts.com for $10 - includes the solid and the openface forms.</p>
    <p><a class="freelinking external" href="http://www.myfonts.com/fonts/fontry-west/wild2-peppermint/">http://www.myfonts.com/fonts/fontry-west/wild2-peppermint/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/PM_SnowAd500_6365.jpg"></div><p></p>
    <p>Thank You for not brandishing pitchforks and lighted torches....</p>
