  html: <p>Did anyone else hear Matthew Carter on NPR's <a href="http://www.wnyc.org/onthemedia/" target="_blank"><i>On the Media</i></a> this week? He's such a gentleman -- even laughed obligingly when the interviewer said he was "a font of knowledge," yuk yuk yuk. (The story was about the NYT headline overhaul with Cheltenham.)</p>
