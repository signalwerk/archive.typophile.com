  html: |-
    <p>I can't get my TrueType fonts to kern properly in CS3. </p>
    <p>Set to 'metrics' in CS3 the kerning is effectively removed.</p>
    <p>I discovered if I moved my fonts out of FontXplorer or Suitcase and activated them in Font Book then kerning would work again.</p>
    <p>Anyone else encountered this problem? I'm now at a loss how to manage my fonts properly.</p>
