  - id: 21642
    user: 2088
    date: 2004-01-15T14:58:00
    date_raw: 15 Jan 2004 — 2:58pm
    votes: null
    html: <p>Donald,  Unfortunately I didn't see an exact match for this in the Solotype book. Castcraft site starts at <a href="http://www.castcraft-software.com/" target="_blank">http://www.castcraft-software.com/</a>. It may take some hunting to find the information that they acquired the rights to Solotype. I have heard that inquiries to them may never be answered, so I can't give you a very positive feeling about dealing with them. Frankly, I think you would be best off just searching for Wood types, Tuscan types or Western types and seeing what is available. The closest resemblance to this I know is a font from the old FontBank colelction called Old West. It is an open face style, but I think it could be called concave tuscan too. You can see and buy it <a href="http://www.buyfonts.com/value_for_money/oldwest.htm" target="_blank">here</a>.</p>
