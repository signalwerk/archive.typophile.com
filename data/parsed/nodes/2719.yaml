    html: <p>Nick Curtis has a selection of wooden types at <a href="http://www.nicksfonts.com/" target="_blank">http://www.nicksfonts.com/</a>, but none are very close to your sample. I also looked through the Solotype Catalog, to at least find a name, but this typeface only resembles a few types that were all upper case and more elongated. The other problem is that not much of the Solotype collection was digitized. The rights to the collection now belongs to Castcraft, so they claim.</p>
