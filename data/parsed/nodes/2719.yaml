    html: '<p>Take a look at the wood-and-and metal type prints and posters done by Chris Stern of Grey Spider Press. <br> <br>He works with wife Jules Faye, where they print in an old barn in Northern Washington state. <br> <br>Chris has taken wood type broadsheets in a completely different and exciting direction. Every typopgrapher needs one of these sheets on the studio wall. (and I get three cents for every one I sell)  <br> <br>Find them at: <a href="http://www.sternandfaye.com" target="_blank">www.sternandfaye.com</a> <br> <br>Jim</p>'
