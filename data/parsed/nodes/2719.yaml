    html: <p>I don't have a specific ID for that, but, according to the Rob Roy Kelly book (American Wood Types), that general style was known as Concave Tuscan. Also, a lot of wood types didn't actually have names, only numbers.</p>
    html_clean: <p>I don't have a specific ID for that, but, according to the Rob Roy Kelly book (American Wood Types), that general style was known as Concave Tuscan. Also, a lot of wood types didn't actually have names, only numbers.</p>
