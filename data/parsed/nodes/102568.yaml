      <p>If you are a frequent user of type, you might as well bite the bullet and get a font editing program. The learning curve is not shallow, you won't learn to use it in 10 hours or 10 days -- at least, for many things. Some, of course, are dead simple.</p>
      <p>But the state of type today is such that a professional user simply cannot leave things up to the font publishers. They have to aim at too many different markets, and the inevitable compromises will, at some point, drive you to distraction.</p>
      <p>Users of type have been significantly modifying type since the days of photocomp -- we use to make up needed characters, or even whole fonts, for the Linotype V-I-P machine. The digital/photocomp machines, such as the Linotype 202 and 505 frustrated many, but then PostScript came along, and again, type was available for tailoring by the user.</p>
      <p>Now, licensing restrictions are rearing their head, but it is easy enough to use fonts that permit the end user to modify for their own purposes, just no reselling. If a font publisher doesn't permit this, avoid their products. There are 1,000s of fonts out there.</p>
      <p>Hiring such work out is rarely successful for an end user. There is the time element, the cost, and the fact you have to describe *exactly* what you want, when (1) you don't know *exactly* what you want, and (2) you'll think of something else tomorrow...and the next day. I have fonts we've owned since the early 1990s that I'm still modifying. Examples are endless, just like the need.</p>
