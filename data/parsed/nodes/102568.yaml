      <blockquote><p>Mere terminology does not affect the inadvisability of Ashley <strong>spending months to years learning how to do something </strong>that she might need to do once a year at most </p></blockquote>
      <p>Emphasis added.</p>
      <p>Taken most charitably, this is misleading. Taken generally, it is a falsehood.</p>
      <p>Part of the problems may be that hhp does not seem to use type, so that all the little things that come up don't occur to him. Quick example from last week: Take arithmetic operators -- plus, minus, equals, multiply, divide. Even the most complete fonts have them only for lining and old style numbers. They are spaced to use as arithmetic operators. But English, and I'd assume other languages, use these symbols in other constructions -- a B+ student, a 6 x 9 trim. They are used in linguistics and  phonetics as well. Sometimes just the spacing needs adjustment, sometimes the character itself. Usually 5 minutes work in a font editing program.</p>
      <p>Take  a character needing an accent. Really quick in a font editing program.  Yes, you can probably do it in the layout program, but if there are more than a couple, or if they occur more than a couple times in the text, it is a real nuisance -- remember the problem with macrons in the old PostScript days?</p>
      <p>Take setting some African languages, where you need U+0181 and  U+018A. If you can't draw -- and I can't -- you can still find that little piece to graft on to the B or D of the needed font. 15 minutes work.</p>
      <p>On and on and on. There is a reason users of type have been modifying it since the middle of the 15th century. Little things add up. In Europe, Gutenberg was probably the first to see that a saw worked better than a chisel. Probably took him, oh, one or two tries -- total time, 10 minutes.</p>
      <p>OK, but you were asking about embolding. Do you think a font editing program's "bold" routine will do a worse job than the stroking routine in InDesign? So you start there, "just as good." Improving on that is all a plus, &amp; you'll get that from day one. You'll get both better and quicker over time, but from day one, you're already ahead of what you have now. The same with all the examples above, and all the things that pop up when setting type.</p>
      <p>And if it really takes so long, you can't afford hhp. Believe his hourly rate is $75. What does that work out to, in months? But of course, it won't take <strong>him</strong> months. How long would it take him? If it takes him 5 hours, that's $375, right. Plus a little for handling? And once for the roman, once for the italic ?  -- it's all hours, and starting to add up. How about the next font, or the next little operation you need?</p>
      <p>So the first time, it takes you 10 times as long to get near his quality, a full week. But you don't have that time, so you settle for less quality, which is still better than ID stroking. It won't take you <strong>years</strong> to reach his -- or Matthew Carter's -- level of quality, unless you're talking about all levels of type founding. At which point, you're a type designer, not a user.</p>
      <p>If you're not a user, if you just spec things for others to set, you don't need the tool -- unless, of course, you want an exact spec, and have to play around with values to satisfy yourself. But if you are a type user, and if you expect to be among the better ones, font editing is something you just cannot ignore, nor pass on to anyone else.</p>
