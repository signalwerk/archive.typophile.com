      <p>1) The font's EULA (licensing agreement) needs to allow you to do that. Although personally I encourage people to ignore such "no-mod" clauses, as long as: they make dead sure the resultant font doesn't leave their sight; if it <em>does</em> leak they don't shy away from facing the consequences.<br>
      2) You can make darker (or lighter) versions with a font editor, but: font editors (at least good ones) are not cheap; simply adding a stroke rarely results in something acceptable; and font editors are complex animals and there's a potential for a first-timer to waste a lot of time before getting it all working right.</p>
      <p>hhp</p>
