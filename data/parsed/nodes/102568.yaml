      <p>Mere terminology does not affect the inadvisability of Ashley spending months to years learning how to do something that she might need to do once a year at most (and I have to wonder what a person's agenda is in recommending such inefficiency). But anyway I'll humor you:</p>
      <p>Type design isn't just making letterforms from scratch. And making a darker weight of an existing font (at least the right way, not simply by adding an outline) very much is type design. You should know that Matthew Carter (whom I mention because he's your favorite type designer) is in fact known to take an uncharacteristically high measure of pride in making good weight variations*; you can be sure he <em>never</em> applies an outline. Now, do many good type designers use automation tricks as a starting point? Absolutely. Do virtually all of those then spend many hours adjusting the results by hand? Absolutely.</p>
      <p>* See the fifth paragraph here:<br>
      <a href="http://www.typophile.com/node/6848#comment-47659" title="http://www.typophile.com/node/6848#comment-47659">http://www.typophile.com/node/6848#comment-47659</a></p>
      <p>Anybody who believes that a typeface by itself makes a work great is deluded. Anybody who believes that details in type are irrelevant in making a work great is deluded. And any typesetter who doesn't realize that his job will be replaced with automation way before type design is automated is deluded.</p>
      <p>hhp</p>
