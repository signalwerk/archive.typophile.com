      <p>I'm not recommending learning type design. I'm recommending learning the skills to tailor type to your needs as a user. How much anyone needs to rely on font editing tools depends in part on how much type they deal with. </p>
      <p>If your business is helping the great American Retail Effort in getting consumers to part with their dollars, the amount of type you set, quantitatively, is quite small. While great care might be needed with what you do set, handwork is always required, so a little more handwork is no big deal. On the other hand, there are always things that just cannot be done by hand. They will change from project to project, and so, not the proper purveyance of a type designer. </p>
      <p>If your business is helping the American Consumer to avoid boredom (books, magazines, etc.) the amount of type you set, quantitatively, is quite large. In that case, automaton -- programmatic improvements -- are useful. If the program takes care of a detail, you're never tempted to skip it because it takes too much time or work. But again, these tend to vary some, and again, they are not a "materials" issue.</p>
      <p>With OpenType, font editing programs let you modify the letterforms, their spacing, and certain automation that may or may not also be available in a layout program. </p>
      <p>None of this has anything to do with type design, except, perhaps, in the minds of a few people who seem to feel that type design, by itself, is what creates the timeless classics of literature, best sellers, cash-cow advertising, etc.</p>
