    html: <p>One caveat is that only Star Trek isn't really associated with metal, and that's just because the new ship seems to be made using polymers. Other than that, Wolverine is known for his claws, Battle for Terra seems to be dominated by a metallic ship of some sort, both Transformers and Terminators are made out of metal, and G. I. stands for galvanized iron.</p>
