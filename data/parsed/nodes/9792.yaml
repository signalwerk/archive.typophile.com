  html: <p>Hi,everybody. I'm showing you a logo I created for a photostudio of a friend of mine in Brazil. The name is "Olhodepeixe", which in English would be "Fisheye" (olho=eye and peixe=fish).  <br>The idea was to refer to the wide-angle lens that have the same name. However, the photographer didn't want any fish in the visual identity, we both agreed that it would be too literal and silly. <br>Therefore I came up with a reference to the wide angle lens, which is also a (not so) subtle image of an eye. I wanted a strong and simple logo, to be applied in any color, so I'm sending you the black version. <br>Well, I would like to see your opinion and suggestions to improve or even change it radically. I'm sure it will help me. <br> <br>Thanks, <br> <br>Daniel Cabral<img src="http://www.typophile.com/forums/messages/29/67482.gif" alt=""></p>
  html_clean: <p>Hi,everybody. I'm showing you a logo I created for a photostudio of a friend of mine in Brazil. The name is "Olhodepeixe", which in English would be "Fisheye" (olho=eye and peixe=fish).  <br>The idea was to refer to the wide-angle lens that have the same name. However, the photographer didn't want any fish in the visual identity, we both agreed that it would be too literal and silly. <br>Therefore I came up with a reference to the wide angle lens, which is also a (not so) subtle image of an eye. I wanted a strong and simple logo, to be applied in any color, so I'm sending you the black version. <br>Well, I would like to see your opinion and suggestions to improve or even change it radically. I'm sure it will help me. <br> <br>Thanks, <br> <br>Daniel Cabral<img src="http://www.typophile.com/forums/messages/29/67482.gif" alt=""></p>
