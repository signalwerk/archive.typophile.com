    <p>Hello all knowledgeable ones,</p>
    <p>I need help with feature markings in a RTL (Syriac) font which utilizes the mark and mkmk features. I have worked making Latin fonts with many open type features so I am familiar with how to write other open type code.</p>
    <p> I am using a Mac and have FL 4.6 and have access to FL 5 Studio. This font will be used in the software Mellel. I have downloaded the correct keyboard and other RTL fonts have worked correctly.</p>
    <p>I decided to do this in stages to help pinpoint any errors. So far I have marked all the base glyphs with their anchor markings and checked them in the preview in FL. I saved the features file in FL. Then in the demo version of Fontographer 5 I opened the FL .vfb file and did all the linking (to the feature file) needed to process the open type file. No errors were reported but when I viewed in the Mellel it didn’t link the position of the mark to the base glyph. </p>
    <p>Obviously I am missing something. Any help will be appreciated.</p>
    <p>Thanks,<br>
    Frances</p>
