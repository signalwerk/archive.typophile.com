    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 4.Apr.2006 8.19am </div>
      <p>/ / / / / / / / / / / / / / / / / / / / / / /</p>
    <p>Hi!<br>
    The dark and snowy quarter of the year is behind us, and now the flowers and trees are blossoming all around. The rains are washing the filthy sidewalks almost clean. It’s Spring in New York!</p>
    <p>/ / / / /</p>
    <p>And we have two exciting new releases from Joshua Darden to announce. That is, we have one new release and one really serious update.</p>
    <p>The update is Joshua’s Omnes typeface, which has been available for a few months as a 5-weight set. Joshua has added 4 lighter weights, all the way down to the waif-like “Hairline”, and he has made italics for all weights. The whole package is beautifully-conceived and -drawn, and brings a unique approach to the rounded sans idiom.</p>
    <p><a href="http://vllg.com/JoshuaDarden/Omnes/mudTyper+Weights/" title="http://vllg.com/JoshuaDarden/Omnes/mudTyper+Weights/">http://vllg.com/JoshuaDarden/Omnes/mudTyper+Weights/</a></p>
    <p>The new face is Corundum Text, a classical serif family based on Pierre-Simon Fournier’s 1742 specimen. Fournier has long been and inspiration for type designers, though his name is not as familiar as his countrymen Garamond or Didot. Joshua’s interpretation balances historical re-enactment and interpretation beautifully.</p>
    <p><a href="http://vllg.com/JoshuaDarden/CorundumText/mudTyper+Weights/" title="http://vllg.com/JoshuaDarden/CorundumText/mudTyper+Weights/">http://vllg.com/JoshuaDarden/CorundumText/mudTyper+Weights/</a></p>
    <p>Joshua was featured in Print magazine’s recent “New Visual Artists Review” of talented folks under 30 years of age. (Village was noted in the same issue’s “Hot Type” column.)</p>
    <p>/ / / / /</p>
    <p>Odile by Sibylle Hagmann of Kontour is almost finished. Watch this space...</p>
    <p>/ / / / /</p>
    <p>We have extended the “Typographica Favorites 05” offer for another couple of weeks. Until April 15th, 2006, you can save $290.00 on this critically-acclaimed selection:<br>
    / Arrival by Keith Chi-hang Tam from Type Initiative<br>
    / Crank 8 by Greg Lindy &amp; Henk Elenga from Lux Typographics<br>
    / Flama by Mario Feliciano from Feliciano Type Foundry<br>
    / Garda by Mario Feliciano from Feliciano Type Foundry<br>
    / Litteratra by Karsten Luecke from KLTF</p>
    <p>You can purchase the set for US$575.00, a savings of one-third off the combined price of US$865.00.</p>
    <p><a href="http://vllg.com/offers.php" title="http://vllg.com/offers.php">http://vllg.com/offers.php</a></p>
    <p>Stay tuned for a new offer when this offer expires.</p>
    <p>/ / / / /</p>
    <p>With warm wishes from New York.</p>
    <p>Village<br>
    168 Second Avenue #253<br>
    New York NY 10003<br>
    USA</p>
    <p>telephone ++1 646 654 1506<br>
    fax ++1 646 429 8597</p>
    <p><a href="http://vllg.com" title="http://vllg.com">http://vllg.com</a></p>
    <p>/ / / / / / / / / / / / / / / / / / / / / / /</p>
