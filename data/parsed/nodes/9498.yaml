  html: "<p>ADVANCE NOTICE <br> <br>This summer I will be offering \"Introduction to Typeface Design\" (E/402) through Art Center College of Design's Art Center at Night program. This 14-week course will be held at the new \"Windtunnel\" South Campus (950 S Raymond Ave, Pasadena) one night a week (from 7 to 10 pm) from the 3rd week of May through the 3rd week of August. Exact weeknight to be determined soon. <br> <br>From the upcoming catalog: <br>This new course nurtures a deep appreciation of typography through the exploration of classical and experimental letterform design. Discover why new fonts are created, examine several philosophies of letterform design, and explore the difference between text and display typefaces, as well as the differences between other lettermaking disciplines (e.g. calligraphy, lettering) and type design. Hand-drawn, traced, and digital letterforms will be compiled into working typefaces using FontLab software. Projects will first emulate existing letterforms, then develop into the beginning designs for a new typeface, including the application of spacing/kerning, test sheets and a simple specimen. Prerequisite: Form + Letterform, or by permission of an Art Center counselor. <br> <br>Since type design can be a highly personal thing for most people, the emphasis on individual attention will be a central part of this course. Students will be encouraged to start their own journey towards a hobby or a career in the craft of type design, exploring their talents and refining their skills. <br> <br>Registration begins April 11. <br>Enrollment is limited to 10 students.   <br><a href=\"http://www.artcenter.edu/atnight\" target=\"_blank\">www.artcenter.edu/atnight</a>  <br>626-396-2319 <br> <br>Hrant Papazian <br>The MicroFoundry <br>hrant_at_inverselogic_dot_com</p>"
  html_clean: "<p>ADVANCE NOTICE <br> <br>This summer I will be offering \"Introduction to Typeface Design\" (E/402) through Art Center College of Design's Art Center at Night program. This 14-week course will be held at the new \"Windtunnel\" South Campus (950 S Raymond Ave, Pasadena) one night a week (from 7 to 10 pm) from the 3rd week of May through the 3rd week of August. Exact weeknight to be determined soon. <br> <br>From the upcoming catalog: <br>This new course nurtures a deep appreciation of typography through the exploration of classical and experimental letterform design. Discover why new fonts are created, examine several philosophies of letterform design, and explore the difference between text and display typefaces, as well as the differences between other lettermaking disciplines (e.g. calligraphy, lettering) and type design. Hand-drawn, traced, and digital letterforms will be compiled into working typefaces using FontLab software. Projects will first emulate existing letterforms, then develop into the beginning designs for a new typeface, including the application of spacing/kerning, test sheets and a simple specimen. Prerequisite: Form + Letterform, or by permission of an Art Center counselor. <br> <br>Since type design can be a highly personal thing for most people, the emphasis on individual attention will be a central part of this course. Students will be encouraged to start their own journey towards a hobby or a career in the craft of type design, exploring their talents and refining their skills. <br> <br>Registration begins April 11. <br>Enrollment is limited to 10 students.   <br><a href=\"http://www.artcenter.edu/atnight\" target=\"_blank\" class=\"link-external\">www.artcenter.edu/atnight</a>  <br>626-396-2319 <br> <br>Hrant Papazian <br>The MicroFoundry <br>hrant_at_inverselogic_dot_com</p>"
