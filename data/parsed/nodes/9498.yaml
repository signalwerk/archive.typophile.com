    html: <p>UPDATE <br> <br>The course will be held Wednesday evenings, from 4-7 PM (not 7-10 PM), <br>starting on May 18 and ending on August 17. We are being provided with two <br>classrooms, one for discussion/sketching, the other for computer work. Also, <br>there will be a field trip to Archetype Press as well as a guest presenter. <br> <br><a href="http://www.artcenter.edu/atnight/coursedescription.jsp?xd=advertising+%2B+graphic+design&amp;xid=2578&amp;id=5406&amp;loc=PAS" target="_blank">http://www.artcenter.edu/atnight/coursedescription.jsp?xd=advertising+%2B+graphic+design&amp;xid=2578&amp;id=5406&amp;loc=PAS</a> <br> <br>Registration begins April 11, and enrollment is limited to 12 (not 10) students. <br> <br>Hrant Papazian <br>The MicroFoundry <br>hrant_at_inverselogic_dot_com <br><a href="http://www.artcenter.edu/atnight/facultydetail.jsp?id=3225" target="_blank">http://www.artcenter.edu/atnight/facultydetail.jsp?id=3225</a></p>
