  html: |-
    <p>I need some help finding good new and usefull condensed fonts.<br>
    I am a book-cover designer and space economy is often important in my trade.<br>
    I´ve been using DIN Engschrift and Trade Gothic Condensed for a looong time now, and I feel it´s time to update my fontlibrary.<br>
    I like Tungsten, but has it been any more good releases in the last ten years?</p>
    <p>And it must include lowercases.</p>
    <p>grateful for any suggestion</p>
    <p>/patlin</p>
