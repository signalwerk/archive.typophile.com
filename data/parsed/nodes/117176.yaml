      <p>For the 2nd one:<br>
      <strong><a class="freelinking external" href="http://www.dafont.com/search.php?text=CHURCHILL%27S&amp;q=BonJovi" rel="nofollow">BonJovi</a></strong> a Dafont.com font with no designer/foundry information</p>
      <p>BonJovi looks like as somebody took the <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/wiescherdesign/metra-serif/" rel="nofollow">Metra Serif (Bold)</a></strong> by Gert Wiescher [Wiescher Design, 2009], expand it by 200% and added the spurs.<br>
      It's also possible that the two fonts share a common pre-digital source, I don't know...</p>
