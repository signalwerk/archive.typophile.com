      <p>Ibis RE – the webfont version optimized for small sizes – is also used on the <a href="http://www.ediblevineyard.com/" rel="nofollow">Edible Vineyard website</a> and <a href="http://www.fontbureau.com/" rel="nofollow">fontbureau.com</a> itself.<br>
      And all over my operating system (you can get Ibis RE for desktop use, too).</p>
