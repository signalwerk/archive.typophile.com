    html: <p>I don't know if you only need big/highly visible projects, but FWIW I've recently used Ibis Text as the secondary typeface in the branding of a little actuarial consulting outfit here in Switzerland (<a href="http://www.flickr.com/photos/ninastoessinger/6755021369/in/set-72157620488846151" rel="nofollow">photo</a>), together with Breuer Text – one of my favorite new-found pairings.</p>
