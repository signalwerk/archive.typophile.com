    <p>Hi,<br>
    I'm doing a project in Typography class about the tyepface Ibis, by Cyrus Highsmith of Font Bureau. I was wondering if anybody knew where it is or has been used? I haven't had much luck finding this. </p>
    <p>Thanks for your help</p>
