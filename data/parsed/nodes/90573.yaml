    html: |-
      <p>Correction: It was used as <em>the basis</em> of the current Fortune logotype. As explained in <a href="http://www.fontbureau.com/blog/change-of-fortune/" rel="nofollow">this blog post</a>, Highsmith modified his Ibis starting point a fair bit. So, that’s not a pure example.</p>
      <p>Highsmith has written a short book on type fundamentals, due out this summer, the text of which we set in Ibis Text, but that probably won’t help you in time for your class project.</p>
