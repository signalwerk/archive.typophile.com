      <p>&gt;As I transfer it onto my computer / work on the novel on my computer, there’s obviously going to be a difference in these quotation marks.</p>
      <p>If you want the dumb quotes - you can turn off "smart quotes" in Word etc.,</p>
      <p>If you want "smart quotes" I think you can "autoformat" the document to replace the straight quotes - if not I'm sure you'll find a macro to do this on the Web.</p>
