      <p>Hi Nick - Here’s the plan. First, someone will translate your paragraph into demotic Greek, then another person - a monk apparently at a big monastery in the mountains - will turn that into a polytonic version! When I’m sure this really can happen, shall I contact you via your website?</p>
      <p>Leads me to wonder what motivates font makers - yourself included? - to produce polytonic Greek type. Who uses it? As I understand it’s pretty much limited to classicists, the Church - hence the monk - and I guess academics discussing older texts. Not complaining, mind, just interested.</p>
      <p>Are you in fact making a Greek font of your own?</p>
      <p>Toby</p>
    html_clean: |-
