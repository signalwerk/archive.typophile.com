    html: <p>Toby, there are literary publishers in Greece who never stopped using polytonic. As Nick notes, there is also a lot of polytonic text floating around out there that needs to be typeset, and not only classical or religious text. I recently found out that one of my polytonic Greek types might be used for a new edition of the poems of Cavafy, which is a thrill for me because he is one of my favourite modern poets.</p>
