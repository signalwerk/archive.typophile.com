  - id: 117448
    user: 2021
    date: 2006-04-10T09:45:00
    date_raw: 10.Apr.2006 9.45am
    votes: null
    html: |-
      <p><em>Who uses it?</em></p>
      <p>I was persuaded by several people.<br>
      David Lemon at Adobe saying that classicists need it, and there are a lot of them around the world.<br>
      Gerry Leonidas at Reading saying that there are recent pre-monotonic texts (not just Homer etc.) that still are quoted and reprinted in Greece using polytonic, and a subculture of present day writers who use it — much the same way many typographers still use old type designs like Helvetica, etc. </p>
      <p><em>what motivates font makers</em></p>
      <p>Obsessive adolescent behaviour.<br>
      And it’s those damn folks at Adobe always raising the bar.<br>
      Professional challenge.<br>
      And one gets bored with the same old glyphs, so curiosity, bring on the Greek and Cyrillic.<br>
      Also, I took Greek at school, so it’s familiar (although I’ve forgotten too much to be able to do the translation).</p>
      <p><em>Are you in fact making a Greek font of your own?</em></p>
      <p>Of course, and I’m not alone. Typophiler Chris Lozos (Dezcom) has one, a family actually, in the works too.</p>
