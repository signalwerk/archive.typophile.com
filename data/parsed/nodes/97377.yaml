      <p>@MafaldaRemoaldo: Before you can get a useful answer, you must first inform the thread what <em>you</em> mean by font. For example, if you mean something close to “the oldest instance of mark-making used to communicate with a fixed set of glyphs” then we can go <strong>thousands</strong> of years before Gutenberg.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/disc_3807.JPG"></div><br>
      <em>Figure 1</em>: Something for you to Google.<p></p>
      <p>And for the record, the Chinese invented a movable type system like Gutenberg’s about 100 years sooner.</p>
      <p>Already, we have departed from Latin glyphs to <a href="http://en.wikipedia.org/wiki/Logogram#Logographic_systems" rel="nofollow">logograms</a>.</p>
      <p>Before you go any further, define what you mean by font.</p>
      <p>And if you are going to use a forum to assist you in your research, be sure to cite and reference it in your paper. The proper way to do this (according to the American Psychological Association publication guidelines) is:</p>
