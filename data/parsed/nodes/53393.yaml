      <p>It can cause incorrect spacing in Quark (don't know if this was fixed in 8.0). </p>
      <p>I ran into this problem just as I was almost finished with Lakeside (a connecting script), which had a UPM of 1300 something (don't ask). Scaling it down to 1000 caused big problems for me because the x-height was quite small, and also messed up all the careful alignment I had done on the connecting strokes. My solution was to scale it up to a UPM of 2000. This still left the cursor anomaly in certain older Adobe apps, but it fixed the spacing problem in Quark.</p>
