      <p>I like the idea that all PS glyph data tables should be on 1,000, and all TT glyph data tables are on powers of 2, but...</p>
      <p>"... if you need to scale from 800 to 1000, try scaling first up to 8000 and then down to 1000; that will avoid rounding errors[...]"<br>
      ...on some even values, and few odd values. Good luck!</p>
      <p>"What [] if I set the UPM size to 1000, force the descender to -200, and still have glyphs that reach down to -300, meaning being larger than the specified UPM?"<br>
      It depends. Sounds like your safest and speediest method, is to convert it to an 1100 upm TT font, and leave it. TT doesn't really care about the upm value and DTP/office environments use enough TT to get along. This keeps the issue out of Adobe's emfumbling mitts, look ma no editing, and boom done.</p>
      <p>The current bottom of node/53308 states your most likely options, and it's quite simple if you start one of two ways... which you have not. </p>
      <p>Cheers!</p>
