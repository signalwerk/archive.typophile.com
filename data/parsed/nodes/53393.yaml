      <p>Sebastian, if you need to scale from 800 to 1000, try scaling first up to 8000 and then down to 1000; that will avoid rounding errors.</p>
      <p>It is okay to have some elements of glyphs exceed the UPM height and these will not be clipped so long as the OS/2 table winAscent and winDescent values equal or exceed the actual height of the tallest glyphs. However, you generally don't want the main parts of letters to exceed the UPM height, only things like cap accents.</p>
