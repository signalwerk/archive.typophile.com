      <p>I remember that at Adobe we ran into another issue with other-than-1000 upm fonts, that occurred when making PDFs with a "third party" (non Adobe) application, and then viewing them in *newer* versions of Acrobat/Reader (8 and 9, I think). It involved an area where the PDF spec might even be ambiguous, IIRC. Anyway, the PDFs came out with the glyphs scaled incorrectly... it was pretty bad.</p>
      <p>I think it's safe to say that it's nearly certain there will be further problems with "some applications" or workflows; it's just that we don't know for sure what those applications/workflows are, and there can even be complicated "emergent problems" from combining particular applications.</p>
      <p>Regards,</p>
      <p>T</p>
