    <p>I’m trying to do some lettering on a half-circle, and it occurred to me that I should be able to do a mock-up on the computer. To that end, I’m trying to take a scan of my caligraphy, and warp it into the proper shape—sort of like Word ‘Art’. But how can I achieve this twisting with a scanned image?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/text in a half-circle_6719.jpg"></div><p></p>
