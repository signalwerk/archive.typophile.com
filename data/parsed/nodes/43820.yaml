      <p> I suppose I'll do that next time. For now, though, I was intending to warp the image on the computer and then retrace the calligraphy once it's in hemicircular form. (Then I was planning to go crazy and blow the image up by 2× and edit the fine detail with marker, pen, and white-out…)<br>
       Also, and this is not obvious from the low-res scan I've posted below, I'm using a graph paper grid to help me space and position things. In order to redraw this on a half-circle, I need some sort of circular graph paper with the same spacings as what I've built my lettering around. And then there's the next line of text that I'm intending to put on a bit of a wave.<br>
       Any suggestions?<br>
      —Joel</p><div class="imageWrap"><img src="http://typophile.com/files/od yishama_4911.gif"></div><p></p>
