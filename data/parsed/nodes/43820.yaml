    html: |-
      <p>1. sketch the curved typography roughly how you'd like it.<br>
      2. map it onto a circle grid as desired. you should make one for yourself.<br>
      3. use the pshop polar coordinates distortion filter to remap the sketch<br>
        -from polar to rectangular.<br>
      4. draw the type cleanly using the new rectangular distortion as a guide.<br>
      5. reverse the distortion back to polar using pshop filter.<br>
      6. clean up as needed.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/domegridch_6127.png"></div><p></p>
