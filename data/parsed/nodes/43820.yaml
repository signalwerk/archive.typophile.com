    html: <p>Well, you <strong>could</strong> do it in Photoshop; but I wouldn't. Better to do it on paper in the first place; than to have your computer mush up your letterforms afterwards... Draw a circle lightly on the paper with a pencil, and use that as your baseline, when drawing out the calligraphy...</p>
