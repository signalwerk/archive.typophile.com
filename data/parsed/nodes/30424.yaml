    html: |-
      <p>Did you mean computer tablet (input device) or tablet computer (type of portable computer)?</p>
      <p>If you can get used to absolute positioning, and take the time to exploit pressure sensitivity in the applications that can understand it, it will totally change your digital art.</p>
      <p>I’ve used Wacoms before. I bought a 6x8 generic labeled US Logic pad, and it works fantastically (when I can find my stylus). It cost 43 dollars with shipping on eBay <a href="http://cgi.ebay.com/Graphic-Tablet-New_W0QQitemZ150078388543QQihZ005QQcategoryZ3680QQrdZ1QQcmdZViewItem">Something like this</a>.<br>
      Pros - It’s huge, sensitive and drivers were stable.<br>
      Cons - theres a AAA battery in the pen, (lasts forever), only one input end (no “eraser”) and it only affects the primary monitor.</p>
      <p>A same-sized Wacom is nicer, but I don’t know if it is 10x better. Supposedly they are multimonitor friendly. Perhaps if it recognized pen twists much more clearly it would be a more obvious winner.</p>
      <p><a href="http://www.chozcunningham.com">Choz Cunningham</a><br>
      <a href="http://www.exclamachine.com">!Exclamachine Type Foundry</a><br>
      <a href="http://www.exclamachine.com/snark">The Snark</a></p>
