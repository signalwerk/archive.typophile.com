    html: |-
      <p>I have two tablets, a 4x5 Grapphire for general use and portability, along with a 9x12 intuos 3 that I use for serious photo retouching and other things that come along. When I really get serious about it I actually clamp one of my LCDs to my drawing table and lay the big tablet on there, it’s a very sweet setup.</p>
      <p>Wacom does sell fully-functional tablets at a pretty nice academic discount if you’re eligible (or just feel like comping up a fake  course schedule) Academicsuperstore.com and sprysoft.com both sell the discounted tablets.  </p>
      <p>Keep in mind that Wacom’s intuos tablets cost so much because they come with a lifetime warranty, driver updates that last as long as the OS can support the hardware (Wacom eventually dropped the old hardware because of hardware support problems Apple created in OS X, but otherwise provides great support for old models), and because Adobe designs its apps to work with Wacom tablets. Not to mention that they’re super-sensitive and a dream to use.</p>
