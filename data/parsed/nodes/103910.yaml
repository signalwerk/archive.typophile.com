  html: |-
    <p>My company are introducing a server-based font management system As part of that they want to sort out the library and importantly delete illegal fonts. The issue is they want to bring in a 'complete' library to use across all titles - the one being touted is the Adobe type library.</p>
    <p>Are there any better alternatives, and (assuming most people would be negative) is anyone in favour of this type of rationalisation?</p>
    <p>Thoughts as always gratefully received…</p>
