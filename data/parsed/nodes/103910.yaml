    html: |-
      <p>Frode, just how old do you think I am ;-) the $300 (or so) was for a couple (roman &amp; italic) photocomp fonts. </p>
      <p>Metal would have been much more, esp. for bookwork. With metal, you need at least three text sizes (for text, extracts &amp; footnotes), at least roman &amp; italic &amp; maybe some bolds, probably a display size or two for chapter openings -- the costs quickly get up there.</p>
      <p>In the days of metal, you just didn't buy a new "font" for any bookwork. I'd imagine unless the account was quite large, you didn't for advertising, either. You picked a printer who <strong>already owned</strong> &amp; didn't need to buy a font, and used handlettering.</p>
      <p>Postscript fonts at $35 or so was what made the small, independent font publisher viable. If you let the big guys (Monotype, etc.) dictate pricing policies, esp. for ebooks etc, you'll loose that market. Maybe you don't want it. And maybe nothing will help, the people in management want headaches to go away, that's why they're paid the big bucks. Aesthetics &amp; designer pleas don't count.</p>
      <p>Edit:<br>
      IsleofGrough: If you're a freelance designer, the decisions of who you're working for will affect your font choices.</p>
