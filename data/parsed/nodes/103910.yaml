      <p>In general, I would say it’s a mistake to put all your eggs in one basket.<br>
      Also, such comprehensive libraries tend to be strong on the classics but a bit stodgy.<br>
      However, if you can ﬁnd a match between your company’s mission/style/whatever and that of a type supplier, it may help focus your direction.</p>
      <p>Monotype=Sauron?</p>
