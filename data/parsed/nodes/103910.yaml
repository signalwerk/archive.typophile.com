    html: |-
      <p><em>I wish we could pay, say $300 for a font and own (not license) it, just like the old days. But then, the cost of fonts limited choices then, too...</em></p>
      <p>Those $300* only payed for fonts that could be used at one location in the old days. Lead is physical, right. You couldn’t copy the font and distribute it to everyone in the firm. The same amount gives you roughly the same value today. </p>
      <p>How web and app licensing today are handled by type publishers differs wildly. Give it some time, and we’ll probably figure out a good solution. A license that covers both desktop, app and web might be a good idea. In fact, OurType does this very thing.</p>
      <p>* I suspect it was a lot more back then, though …</p>
