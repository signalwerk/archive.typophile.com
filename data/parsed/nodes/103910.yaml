    html: |-
      <p>Well, my library of books consists of publications that cover interests of mine, or are entertaining or just beautiful in their own way — strangely enough they are from a multitude of publishers…</p>
      <p>Your type library should be similar, and as it is, having only the Adobe Type Library is like having only Penguin books: not bad at all, but somewhat restricted.</p>
      <p>Why not ask for a quote for licensing the ATL for your situation and then use amount of money as a budget and gradually build an interesting and useful collection?</p>
      <p>FYI: amongst my last purchases were typefaces and type families from Village (Klim), Typotheque, House Industries and other small foundries.</p>
