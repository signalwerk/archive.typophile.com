      <p>This is just going to keep happening. Many of our  customers (book publishers) are moving to this. Think their problem -- freelance designers, contract typesetters and (different) contract printers, not to mention different products -- ink on paper books, eboks in both pdf and ePUB formats, etc.</p>
      <p>Keeping track of who has a legal font would be daunting. Even worse is paying for it all, esp. from some of the major European font publishers. The possibility of revenue from the Web, I guess, has set up pricing strategies for font use that book publishers just won't pay. Kind of like medical care in America. This is their first step, a limited library &amp; maybe a contract price for that library. No doubt more to come.</p>
      <p>I wish we could pay, say $300 for a font and own (not license) it, just like the old days. But then, the cost of fonts limited choices then, too...</p>
