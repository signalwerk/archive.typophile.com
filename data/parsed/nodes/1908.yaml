    html: <p>It's definitely a pretty neat looking face. I was scrolling and I read 'Fax' instead of 'Fox' and then when I looked at the alphabet it was still the case. The lc o just seems like an a to me. The uc O doesn't seem to do this. <br> <br>I agree with John about the R. I read BOOS instead of ROOS even though I knew the name. I like the Q's internal tail. That's pretty cool. U feels like it's about to shut tight as does N. <br> <br>Looking good though. <br> <br>Jon</p>
