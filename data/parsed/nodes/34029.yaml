    html: |-
      <p>Strikes me that it makes more sense to have the italic rotationally symmetrical but the roman more reflectionally symmetrical (about the central stem/y-axis). Not sure why but feels more appropriate, maybe I'm thinking of those zhe's which have a lower case 'c' structure to them (a bit like a cursive Greek kappa with a vertical line down the middle. They only seem to exist in italic.</p>
      <p>Plus don't you love the way both the words Italic and Roman effectively mean 'from Italy' (and thus Latin) and therefore are perhaps rather inappropriate in a conversation about Cyrillic? Maybe one should talk about cursive and upright instead? Can of worms maybe, sorry.</p>
      <p>(If it's not already apparent, I'm out of my depth.)</p>
