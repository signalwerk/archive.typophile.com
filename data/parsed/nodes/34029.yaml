    html: |-
      <p>Niiice. This is quite encouraging, including the fact that the structures are different between the lc and UC, which I'm doing myself*. The fact that Grace has left the UC Zhe symmetrical also makes sense, since the UC set is monumental while the lc is more organic (and secondarily that the UC doesn't need to be as readable). You can see this in the Ya as well (and probably elsewhere - I'll be perusing the PDF for sure). And there's some other funkiness as well, like all the serif action - wow, brave student, that one.</p>
      <p>* Mostly by having more rounded corners in the lc, and almost none in the UC.</p>
      <p>One place I've been a little bit more pushy (quite likely too pushy) is that the Ka and the Zhe are <cite>vertically</cite> flipped: the curly arm on the Ka is the top one. Problem?</p>
      <p>hhp</p>
