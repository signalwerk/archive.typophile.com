    html: "<p>интереснно, overall it seems pretty good. a couple things that are concerning. Your shape for У makes it hard to be read, i think it would be too easy to confuse with Џ. i don't understand why the leg on the д continues from the main stroke when this is not the case with Д, ц or щ. i'm wondering what your reasoning was behind this decision. i'd like to see the Д/д, Л/л all share the same structure, in particular i like the shaping of Д/д better, but that's just me. i'm sure you chose disparate forms for readability sake, but i think it would make the face more cohesive if they matched. The bar on the Ф can actually extend below the baseline and above the cap height a bit: I think it would look better with a bit bigger body. I'm wondering why you made the Г/г so narrow. Also, i would think the flag on the Ъ/ъ could be more pronounced as this is a distinguishing feature and would aid deciphering this letter in text. lastly, i wonder why the crossbar on the Ю/ю is so high, it looks funny to me.</p>"
    html_clean: "<p>интереснно, overall it seems pretty good. a couple things that are concerning. Your shape for У makes it hard to be read, i think it would be too easy to confuse with Џ. i don't understand why the leg on the д continues from the main stroke when this is not the case with Д, ц or щ. i'm wondering what your reasoning was behind this decision. i'd like to see the Д/д, Л/л all share the same structure, in particular i like the shaping of Д/д better, but that's just me. i'm sure you chose disparate forms for readability sake, but i think it would make the face more cohesive if they matched. The bar on the Ф can actually extend below the baseline and above the cap height a bit: I think it would look better with a bit bigger body. I'm wondering why you made the Г/г so narrow. Also, i would think the flag on the Ъ/ъ could be more pronounced as this is a distinguishing feature and would aid deciphering this letter in text. lastly, i wonder why the crossbar on the Ю/ю is so high, it looks funny to me.</p>"
