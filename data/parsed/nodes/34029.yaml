    html: |-
      <p>Thanks Paul!</p>
      <p>&gt; i think it would be too easy to confuse with Џ</p>
      <p>Even though there's a difference of vertical scale? Should I make<br>
      the top of it diagonal, even though it's a "U" shape in the Latin "Y"?</p>
      <p>&gt; i don’t understand why the leg on the д continues</p>
      <p>To differentiate it from the UC. I actually started with the left spur also<br>
      coming straight out of the top part, but it was way too much like an "A".</p>
      <p>But the same trick doesn't seem to work in the other spurred characters,<br>
      maybe because their structures are too plain? Maybe I should give those<br>
      ones another chance at straight-down spurs.</p>
      <p>Basically it's the old Papazian "sacrifice consistency for the sake of differentiation"<br>
      routine. :-)  This font is for use on-screen (although anti-aliased) so I think it needs all the help it can get.</p>
      <p>&gt; The bar on the Ф can actually extend below<br>
      &gt; the baseline and above the cap height a bit</p>
      <p>Do you mean optically or obviously?</p>
      <p>&gt; I’m wondering why you made the Г/г so narrow.</p>
      <p>It's based on the Latin "L".<br>
      Normally I wouldn't think in those terms but when I suggested to the client that the Cyrillic should be wider overall than the Latin (I mean for so-called "cognate" forms as well) they were unwilling. And to be fair the narrowness of the overall design is a big part of its usefulness to them, so...</p>
      <p>&gt; i wonder why the crossbar on the Ю/ю is so high</p>
      <p>Maybe it is too high. But it does match certain<br>
      things, including the way Verdana seems to do it.</p>
      <p>hhp</p>
