      <p>Ah, Egyptified Cyrillic!  :-)</p>
      <p>Paul, I think the potential "stopping effect" here is exactly the sort of thing in type that you can't know until you try it out. Sometimes you can tell with enough certainty before you even try something out, but my lack of "culturally progressive" experience in Cyrillic precludes that here; until now I'd only made "safe" Cyrillic glyphs.</p>
      <p>So, you'll never know if you don't push. The trick I guess is to glean what kind of design (for what kind of customer) is a good opportunity to push, and when it's better to humbly follow precedent. In that this is clearly not a face for long text anyway, my chances seem decent; on the other hand it's a commissioned design, not a speculative retail one, so there's more risk than I might like.</p>
      <p>hhp</p>
