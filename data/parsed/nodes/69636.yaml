    <p>Hey all,</p>
    <p>The highly acclaimed <a class="freelinking external" href="http://www.fontbook.com" rel="nofollow">FontBook 4th Edition</a> was published in 2006, so I'm just curious how relevant it is since 4 years have passed.</p>
    <p>I realize that it is listed as one of the essential books, but I just want to make sure that it's worth my USD$99 before I pick a copy up.  How often do you consult this dense resource?  Do you feel it is outdated to the point where you search through fontbook.com from the get-go, bypassing the book altogether? </p>
    <p>I will appreciate any and all thoughts.</p>
    <p>Tom</p>
