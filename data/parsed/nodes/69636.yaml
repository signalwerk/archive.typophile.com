      <p>I would primarily use it for font identification and ideas.  Not to mention the fact that I have a slight feeling that it's something that I could page through for hours and never get enough.  I just don't really know about the price or the 'must buy' factor.  I've found others that seem much more practical (and are easier on the bank).</p>
      <p>Thanks for the input Don.  Much appreciated.</p>
