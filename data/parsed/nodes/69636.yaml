    html: |-
      <p>What do you want to use it for? I have a much older, and much less exhaustive copy of an Agfa font catalogue, covering Adobe, Berthold, Linotype, and a few others in about 1995. I make use of it occasionally when I want to ID a typeface that doesn't come to mind immediately. I find books handier in many cases than online samples, although they do get dated.</p>
      <p>I have long craved that FontBook, but never managed to get it to the top of the "must buy" list.</p>
