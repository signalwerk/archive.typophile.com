      <p>I don't recall the previous version, but I can definitely agree with "<em>could page through for hours and never get enough</em>." </p>
      <p>Best feature (other than the fonts): It has three ribbons to mark pages. One yellow, one black and one white.</p>
      <p>Not best feature: The paper is a little thin (out of necessity as there are so many pages).</p>
      <p>I recommend buying it for the fun factor alone.</p>
