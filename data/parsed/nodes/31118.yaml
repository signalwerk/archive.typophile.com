      <p>I also recommend that the style elements in PS Font Name are always abbreviated to three letters (i.e. "Lig" for Light, "Med" for Medium, "Bol" for Bold etc.) In the Family Name field, you may use those abbreviations or full names, i.e. either "Coop Lig"/"Coop Med" or "Coop Light"/"Coop Medium" or even "Coop Lt"/"Coop Md". Sometimes it's wiser to use the shorter names because this leaves you room for a bunch of other suffixes that indicate the character set and your foundry, e.g. "Coop Lig FL Pro" etc. </p>
      <p>**) You can either fill these fields in, then you'll get "prettier" Adobe-style font menus in Adobe and Apple applications, but no 100% cross-platform compatibility, or you can omit these fields entirely, then you'll get Bitstream-style "grouped into four styles per style-linked group" font menus and 100% cross-platform compatibility. </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
