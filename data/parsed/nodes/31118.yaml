      <p><em>I don’t understand the question. Those two variants are the designer’s discretion, and are just examples. There are many other variants possible, and it’s the designer who must make a choice how he *wants* his font menus to be structured.</em></p>
      <p>The operative word is "choice".<br>
      I would like to be able to *choose* from a selection of established, robust family name formats that I know will work, rather than spend ages inputting values, with the discretion to make all kinds of mistakes that will only become apparent after protracted trial and error testing.</p>
      <p>FontLab Family Formats? --That would certainly be useful for foundries making retail typefaces, and surely for OpenType, where the premise is ONE. </p>
      <p>Admittedly, "Claptrap Condensed Bold" doesn't roll so easily off the end-user's tongue as "Claptrap Bold Condensed", but fonts should be organized around the way people use them, not whim or what sounds best. </p>
      <p>Of course, lower-level, manually editable naming controls will always be indispensible for custom font development, or those who want to stick with Bold Condensed.</p>
      <p>***</p>
      <p>However, here is a solution for the FontLab interface that would offer the designer maximum *choice*:<br><strong>Virtual Menus</strong> that show how a particular family-naming scheme will display in different applications on different platforms.</p>
      <p>So I, the designer, would enter my family naming scheme in the left fields.<br>
      The right fields would show how that scheme displays in different menus, by clicking on, for instance, the [ ] Word  [ ] Windows 98  buttons, or the [ ] Quark XPress 7 [ ] OS X buttons.</p>
      <p>With such a system, I would be able to interactively fine-tune the family names for a variety of applications, without having to generate fonts, load them, and boot up applications to see how they display.</p>
