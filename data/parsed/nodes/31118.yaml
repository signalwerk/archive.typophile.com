    <p>Hi all,</p>
    <p>I searching for a definitive system for naming opentype font families in Fontlab that works accross platforms. Problems I've experienced are mainly to do with the font list in applications, font styles in families not appearing in the correct order, so instead of Light, Regular, Medium, Bold I have Bold, Regular, Medium, Light. Sometimes I have the situation where the lIght will appear at the bottom of the list seperate from the rest of the family. I just what the font family name to appear alphabetically and then within the font style names to appear in order.</p>
    <p>I have read many post on this subject and the fontlab manual, but I still don't have a definitive answer that works accross platforms.</p>
    <p>Any help would be GREATLY appreciated</p>
    <p>c.</p>
