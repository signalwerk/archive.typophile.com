      <p>This rather sounds like your font cache is corrupt.<br>
      Try this (in this order):</p>
      <p>(1) Quit all applications.<br>
      (2) Search for "AdobeFnt", then delete all files looking like "AdobeFnt10.lst" (if you have CS2), the number may differ. These are Adobe-app font caches.<br>
      But do NOT delete files ending with".db".<br>
      (3) Use <a href="http://homepage.mac.com/mdouma46/fontfinagler/">Font Finagler</a> or a similar tool to delete the Mac OSX system font caches. This requires a restart of the system.</p>
      <p>Does this work?</p>
      <p>(You can contact me offline through my Typophile user page.)</p>
      <p>Karsten</p>
