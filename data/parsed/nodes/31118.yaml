      <p>Nick, </p>
      <p>I will be giving some careful thought to redesigning the family naming settings for the next editions of our font editors. I will consider your suggestions. </p>
      <p>However, I very much doubt that Fontlab Ltd. will ever dare to provide naming suggestions "for QuarkXPress 7" or "for Word XP" or something like that. This would mean that we assume responsibility for knowing "for sure" exactly how these various applications recognize and organize names. It would mean that we'd need to track potential behavior changes and bugfixes made by vendors of those applications. </p>
      <p>We're sufficiently busy in keeping track of what other companies are doing and trying to make sure that our tools are compatible with what Adobe, Apple, Microsoft, Quark etc. are doing. But it would be a different pair of shoes if we'd go from that to actually giving the customer a *promise* that certain settings will create a font that is compatible with Quark 7 or Word XP or something or other. And most certainly, we wouldn't build in hacks that would attempt to work around certain bugs in certain versions of certain applications -- only to potentially discover that their bug has been fixed in the next release and our hack is doing more harm than good. </p>
      <p>We don't have insight into these companies source code. The companies don't publish the implementation details of their font engines. Their font people as well as Fontlab Ltd. simply do not have the resources to create a "perfect font world". It's as good as it gets. Adobe and Microsoft develop and publish the OpenType specification, and our mission is to be compatible with that. So is Quark's, Adobe's, Microsoft's, btw. The only promise that Fontlab Ltd. can give its customers is that our tools are compatible with OpenType. But not with Word, Quark or InDesign -- simply because we would not be able to reliably fulfil that promise. </p>
      <p>Adam</p>
