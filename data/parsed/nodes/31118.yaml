      <p>I'm glad Microsoft has made naming so complicated with their quaint nuclear family conception of typography. (So very bourgeois, pronounced "Bur-joyce", of course).</p>
      <p>It gives me the opportunity to charge my clients big bucks for making the large-family, cross-plaform font solutions they require.~</p>
      <p>I could do without the hair-tearing though (metaphoric term, hair already dispensed with).</p>
      <p>Yesterday I was making an OpenType font family of two, Regular and Light. How gay.<br>
      But the damn thing wouldn't even work in InDesign on OS X -- it kept giving me two separate menu entries. Somewhere in the labyrinth of code is Wintel stuff that has infected my Mac and its apps, some "logic" saying "what, no bold? -- therefore the lightest weight must be regular, as well as the regular regular," or some such thing.</p>
      <p>The only way I could get it to work as a single menu entry was was by naming the light weight "Fine" and giving it a manual numerical value of 250, and giving the Regular a manual value of 600. That produces two entries on PCs, but you get Light as a separate "family" there anyway.</p>
      <p>Thanks, Thomas and Typophile! -- an earlier thread here helped me sort that out.</p>
