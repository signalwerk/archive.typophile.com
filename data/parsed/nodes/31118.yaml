      <p>biddy, i'm in no way as experienced as nick, adam and the other people that have joined this thread so far, but, yes, font naming is crucial for the usability within the applications. if you have two fonts "biddy sans" and "biddy sans bold" and they are not within the same family, and/or "bold" has not been checked when creating the font, word won't access the real bold style and electronically fatten the regular one instead. adobe applications, however, just wouldn't allow to use a bold style. you would see the bold font as a separate font in the fontmenu.</p>
      <p>// alex</p>
