      <p>Coop, </p>
      <p>the *definitive* solution to the problem is: </p>
      <p>1. If your family has more than four members, split it into style-linked groups with up to four members. </p>
      <p>2. Never use any of the "OT" names (i.e. OT Family Name and OT Style Name). </p>
      <p>3. In the Style Name field, have only one of the four basic values ("Regular", "Italic", "Bold", "Bold Italic"). </p>
      <p>4. Your Family Name should include the name of the style-linked group, i.e. may be identical only for up to four fonts that have different Style Name. Different style-linked groups can use different suffixes to differentiate, e.g. one oculd be "Coop Sans", another "Coop Sans Lt", another "Coop Sans Blk", another "Coop Sans Disp" etc. </p>
      <p>5. Remember that your Family Name field may not exceed 31 characters, better be even shorter. </p>
      <p>6. Your PS Font Name and your Full Name may reflect the true typographic name of the font, e.g. the font with Family Name "Coop Sans Lt" and Style Name "Regular" could have the Full Name "Coop Sans Light" and the PS Font Name "CoopSans-Light". </p>
      <p>If you follow this scheme, all your OpenType fonts will appear as style-linked groups on Windows, Mac and in Adobe applications. This somehow limits the typographic freedom of how the user will see your family, but guarantees cross-platform compatibility. </p>
      <p>If you use the Adobe-style OpenType family naming, i.e. choose to place the alternative "true typographic" family naming in the OT Family Name and OT Style Name fields (e.g. for the example mentioned above it would be "Coop Sans" and "Light"), you will have "prettier" font menus in Mac and Adobe applications, but you won't get 100% cross-platform compatibility of documents. </p>
      <p>Adam</p>
