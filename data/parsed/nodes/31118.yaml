    html: |-
      <p><strong>VARIANT 1</strong><br><strong>PS Font Name* | <em>Family Name</em> | Style Name | <em>OT Family Name**</em> | OT Style Name** | Is Bold | <em>Is Italic</em> | </strong><br>
      Coop-Lig | <em>Coop Lig</em> | Regular | <em>Coop</em> | Light | N | <em>N</em> |<br>
      Coop-LigIta | <em>Coop Lig</em> | Italic | <em>Coop</em> | Light Italic | N | <em>Y</em> |<br>
      Coop-Reg | <em>Coop</em> | Regular | <em>Coop</em> | Regular | N | <em>N</em> |<br>
      Coop-Ita | <em>Coop</em> | Italic | <em>Coop</em> | Italic | N | <em>Y</em> |<br>
      Coop-Med | <em>Coop Med</em> | Regular | <em>Coop</em> | Medium | N | <em>N</em> |<br>
      Coop-MedIta | <em>Coop Med</em> | Italic | <em>Coop</em> | Medium Italic | N | <em>Y</em> |<br>
      Coop-Bol | <em>Coop</em> | Bold | <em>Coop</em> | Bold | Y | <em>N</em> |<br>
      Coop-BolIta | <em>Coop</em> | Bold Italic | <em>Coop</em> | Bold Italic | Y | <em>Y</em> | </p>
      <p><strong>VARIANT 2</strong><br><strong>PS Font Name* | <em>Family Name</em> | Style Name | <em>OT Family Name**</em> | OT Style Name** | Is Bold | <em>Is Italic</em> | </strong><br>
      Coop-Lig | <em>Coop Lig</em> | Regular | <em>Coop</em> | Light | N | <em>N</em> |<br>
      Coop-LigIta | <em>Coop Lig</em> | Italic | <em>Coop</em> | Light Italic | N | <em>Y</em> |<br>
      Coop-Reg | <em>Coop</em> | Regular | <em>Coop</em> | Regular | N | <em>N</em> |<br>
      Coop-Ita | <em>Coop</em> | Italic | <em>Coop</em> | Italic | N | <em>Y</em> |<br>
      Coop-Med | <em>Coop Lig</em> | Bold | <em>Coop</em> | Medium | Y | <em>N</em> |<br>
      Coop-MedIta | <em>Coop Lig</em> | Bold Italic | <em>Coop</em> | Medium Italic | Y | <em>Y</em> |<br>
      Coop-Bol | <em>Coop</em> | Bold | <em>Coop</em> | Bold | Y | <em>N</em> |<br>
      Coop-BolIta | <em>Coop</em> | Bold Italic | <em>Coop</em> | Bold Italic | Y | <em>Y</em> | </p>
      <p>The two variants differ in how Coop-Med and Coop-MedIta are style-linked. In the first variant, they create a style-linked group of their own, in variant 2 they are linked as bold counterparts to the Light styles. </p>
      <p>*) To simplify things, Full Name to be same as PS Font Name. </p>
      <p>I also recommend that the style elements in PS Font Name are always abbreviated to three letters (i.e. "Lig" for Light, "Med" for Medium, "Bol" for Bold etc.) In the Family Name field, you may use those abbreviations or full names, i.e. either "Coop Lig"/"Coop Med" or "Coop Light"/"Coop Medium" or even "Coop Lt"/"Coop Md". Sometimes it's wiser to use the shorter names because this leaves you room for a bunch of other suffixes that indicate the character set and your foundry, e.g. "Coop Lig FL Pro" etc. </p>
      <p>**) You can either fill these fields in, then you'll get "prettier" Adobe-style font menus in Adobe and Apple applications, but no 100% cross-platform compatibility, or you can omit these fields entirely, then you'll get Bitstream-style "grouped into four styles per style-linked group" font menus and 100% cross-platform compatibility. </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
