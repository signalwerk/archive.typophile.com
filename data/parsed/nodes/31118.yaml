      <p>For an example, you can look at page 5 of <a href="http://www.kltf.de/downloads/FontNaming-kltf.pdf">this</a>. Replace "Semibold" by "Medium" and it should resemble your family.</p>
      <p>If you will generate OpenType fonts only (which I get from your very first post), you do not need to fill in the "Menu Name" and "FOND Name".</p>
      <p>If you make PS-OpenType fonts, you can use "Coop-Regular" in "PS Font Name".<br>
      If you make TT-OpenType fonts too, you should use "Coop" (and "CoopLight" for the other sub-family) in "PS Font Name". (This name will not be displayed but is used for identifying the font.)</p>
      <p>Since it seems that you want the family to appear as identical as possible in all applications: Leave "OT Family Name", "OT Style Name" and "Compatible Menu Name" empty. </p>
      <p>Very important: In FLS5 Options/Preferences, section "Generating OpenType PS (.otf)", you must activate "Use PostScript FontName as FullName on Windows" if you are generating PS-OpenType fonts.</p>
      <p><strong>And then: Double-check if all of Adam's requirements for absolute platform-compatibility are met!</strong></p>
      <p>And do many tests.</p>
      <p>Karsten</p>
