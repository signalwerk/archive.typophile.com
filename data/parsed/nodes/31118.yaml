      <p><em>trying to make sure that our tools are compatible with what Adobe, Apple, Microsoft, Quark etc. are doing.</em></p>
      <p>I think you should take a more proactive role.<br>
      Those guys will always be doing things different ways.<br>
      However, Fontlab is more dominant in its field than any of them are in theirs, so is ideally placed to establish some sensible family naming formats, and have the behemoths conform.<br>
      That would be particular useful in weaning Microsoft from its "a family is four" prejudice, which is both ante-deluvian and anti-typographic.</p>
      <p>I'll repeat: such family naming standards would be primarily for retail fonts, and hence of great benefit to the end-user massive. For more specialized concerns, e.g. custom fonts for proprietary system users, there's always the "lower" level of manual inputting for those who know what they're doing.</p>
