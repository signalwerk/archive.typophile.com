  html: |-
    <p>The April edition of the Metal Type newsletter is now out.</p>
    <p>The video this month was filmed on the south bank of the river Humber, right next to the Humber Bridge, here in the UK. There are some facts about the bridge at the end of the video.</p>
    <p>To see this month's video click this link:<br>
    <a href="http://j.mp/k5KA95" title="http://j.mp/k5KA95">http://j.mp/k5KA95</a></p>
    <p>Some interesting new material has been added to the site in the last month, including a superb cartoon calendar by Tony Hall.</p>
    <p>If you get the site's monthly HTML newsletter, you will already have seen the front cover of the calendar. If you would like to receive it next month, click here: <a href="http://j.mp/n3wkjc" title="http://j.mp/n3wkjc">http://j.mp/n3wkjc</a></p>
    <p>Planning on seeing "Linotype: The Film?" Take a look at this letterpress clothing, and look the part! <a href="http://j.mp/Hd5MoT" title="http://j.mp/Hd5MoT">http://j.mp/Hd5MoT</a></p>
    <p>All the Best<br>
    Dave Hughes<br>
    York, UK</p>
