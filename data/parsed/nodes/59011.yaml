    html: |-
      <p>Thanks for the response. I already have done what you've suggested and in fact have a pretty extensive workspace ... meaning, I probably have 40 tools/commands represented by various personally-created small icons on my toolbars/panels docked at the top of my window in two rows.</p>
      <p>What I'm wondering is, if there's a way to prevent those toolbars/panels from being "undocked" and converted into floating boxes because I've reached for something at the top of the glyph window and clicked a centimeter or two above it. Every time I do that, my two toolbars either combine into one (hiding one, in effect), or the bottom toolbar is moved and becomes a square version inside the glyph window itself. It can be rather annoying.</p>
