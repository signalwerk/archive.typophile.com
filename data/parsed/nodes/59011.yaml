    votes: null
    html: |-
      <p>You can customize your main panel and have only tools which you use most often. Then you can save it as your workspace(s), and use them later anytime you want.</p>
      <p>Tools &gt; Customize &gt; Drag-and-Drop the commands you wish to have on your main panel.</p>
