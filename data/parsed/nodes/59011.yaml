    html: <p>You're using the mouse to select tools? I find it's much more efficient to use the keyboard shortcuts. Most of the tools have single keys assigned to them (1 for the select tool, 3 for knife tool, 5 for the corner tool, etc.). For the ones that don't, you can assign them yourself.</p>
