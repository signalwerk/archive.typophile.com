  html: <p>If it even exists, has anyone figured out how in FontLab to lock down the tool bars at the top and keep them from inadvertently converting to floating boxes because of an erroneous click of the mouse? And STILL have the buttons be clickable?</p>
  html_clean: <p>If it even exists, has anyone figured out how in FontLab to lock down the tool bars at the top and keep them from inadvertently converting to floating boxes because of an erroneous click of the mouse? And STILL have the buttons be clickable?</p>
