  html: |-
    <p>Some friends and I plan on watching <em>Helvetica</em> (again!) this Friday and eating typographic foods. So far, we plan on making alphabet soup with alphabet crackers, followed by alphabet cookies.</p>
    <p>There is <a class="freelinking external" href="http://typolade.de/" rel="nofollow"> chocolate type</a>, but I don't think we have the time or funds for that unless we cast it ourselves.</p>
    <p>Typographic fluids will be one issue. The only solution I can find is <a class="freelinking external" href="http://www.google.com/products?q=letter+ice+tray&amp;oe=utf-8&amp;rls=org.mozilla:en-US:official&amp;client=firefox-a&amp;um=1&amp;ie=UTF-8&amp;ei=68rQSceBGurplQeXg4zyCQ&amp;sa=X&amp;oi=product_result_group&amp;resnum=1&amp;ct=title " rel="nofollow">ice</a>.</p>
    <p>I'd love to see what other typographic foods are available.</p>
