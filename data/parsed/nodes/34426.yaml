    <p>5ive by 5ive Design is a company that I recently created.  I plan to cater primarily to military affiliated organizations and universities.  Five by Five is military jargon (WW II) meaning “loud and clear”.  My goal with the attached wordmark (logo) was to create something that is firm in tradition (balance and symmetry) but comes across as contemporary and modern.  </p>
    <p>I am looking to get some professional feedback on this wordmark and any input or suggestions that anyone may have.  Thank you for submitting any comments.</p>
