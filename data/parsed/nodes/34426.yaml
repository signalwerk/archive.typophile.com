      <p>I agree it reads “SIVE BY SIVE”... And font choice makes it look more like a design company for digital media. If the “design” would be green I would say: “ok this is air traffic control company.”</p>
      <p>Just an idea: why not play with type. If “five by five” is “loud and clear”, then make type say that. Emphasize LOUD and polish/sharpen the CLEAR. You can add design underneath or sideways as it’s now (great solution for different brands to change “design” to brand names, but you’re not having products to use that), because it’s just an addition to the primary jargon saying.</p>
