      <p>I feel most people will read, “SIVE BY SIVE.” Plus, this solution is not unique. We’ve all seen it before: 3hree, SE7EN, etc. Using numerals in place of the first letter of the word doesn’t necessarily say anything about your design company. At least nothing which I can discern. </p>
      <p>I also see your choice of typeface as somewhat tech-inspired. I don’t quite get “firm in tradition,” especially since the mark is less than perfectly readable. The weight of the face seems a bit weak to be considered firm in tradition. </p>
      <p>This is only one opinion and I’m trying only to be helpful so please consider my remarks as food for thought. Somebody else may come along and say you’re spot-on.</p>
