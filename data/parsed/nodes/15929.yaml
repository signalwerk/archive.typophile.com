      <p>Art is not about meaning, it's about expression. Personal expression which is only certain to be relevant to the expressor, and not necessarily users.</p>
      <p>&gt; what you feel about someone’s work is a<br>
      &gt; good way to see where they’re coming from.</p>
      <p>Only on the surface (towards Display). When it comes to Design (towards Text), feeling doesn't get you very far, and quite often will take you in a misguided direction. Feeling is certainly not unimportant in design, but demote thought/function, and you stray into selfish artistry.</p>
      <p>To decide if a designer is useful or not, you have to think.</p>
      <p>hhp</p>
