      <p>Thanks for the props, Hrant.</p>
      <p>I might be partly responsible for this, as Zal is in Toronto.<br>
      Yes, time had something to do with it.<br>
      There are so many things for a design student to learn these days, and the first year I taught Type 4 (type design+poster+animation) in the York/Sheridan B.Des (in Toronto) some students had difficulty finishing all the characters. I thought that making the font unicase would both cut down production time, and provide a valuable background -- both depth of historical evolution, and the full scope of alphabetic forms. </p>
      <p>In fact, by doing a unicase project -- research and development -- students gain a good understanding of why the two cases are the way they are. And it really focuses them on approaching typeface from the point of view of structure and pure form rather than style.</p>
