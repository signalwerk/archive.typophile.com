    <p>Hi,</p>
    <p>I am designing a unicase typeface for my Typography class. It is called ‘Cutting Edge’ for now—hopefully I'll come up with something less cheesy down the road.</p>
    <p>I was hoping to get some critique and feedback; general comments regarding aesthetics, which letters work and which don't, which of the two versions you prefer, and any other sage advice the type pros of this forum might have for me.</p>
    <p>Version 1 has been built from two basic shapes, a square (denoting a “pixel”), and a triangle (“half a pixel”). Version 2 evolved from the first, with an additional rounded shape to smooth things out. Even though it shares certain characteristics with pixel fonts, they are both intended as display fonts (set at 24 points or larger). Mainly because there is no such thing as half a pixel but also because legibility suffers at small point sizes.</p>
    <p>The spacing and kerning are arbitrary for now. Any comments are welcome.</p>
    <p>Edit: Attached pixel-version.pdf (November 13)</p>
