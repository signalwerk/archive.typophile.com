      <p>&gt; or that you designed the course.</p>
      <p>It was mostly in place before I joined. Darren Wilson, Sandra Gabriele, and Zab Hobart all contributed at the early stage, as did David Scadding. And it continues to evolve. The unicase idea was mine, although it occurred during a planning meeting I had with Sandra and Zab at Zab's studio, so it was kind of a group idea. It's certainly produced some astonishing results.</p>
      <p>Funnily, after the unicase concept had been introduced, it occurred to me that I hadn't actually designed such a face myself. With that in the back of my mind, when Christian Bok asked me to recommend a monowidth typeface for setting his poem "Diamonds", I thought, hey, I could design one, and make it unicase too. Hence Panoptica.</p>
      <p>I'll keep an eye open for your PDF.</p>
