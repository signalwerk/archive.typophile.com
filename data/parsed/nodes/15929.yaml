      <p>Building versus bantering...</p>
      <p>Nick, I've seen your body of work. I've bought a chunk of it (Brown, Handsome Nib, Preface, Worldwide) and use it year 'round. I also appreciate your opinion more than others on this site, as it's often served with grace. You talk it...and you walk it. You're building, in more ways than one.</p>
      <p>Hrant, I've been trolling this forum for a few years and it's clear that you enjoy banter over building. And banter would be the kindest description. Over time, I've made a point to ignore your posts more often than not, as they seem to be a platform for spewing academic babble. I've learned so much from the fine minds that populate this site. However, the knowledge you bring to the forum is heavily soaked in smugness and pretenstion. Put another way, I never get the impression that you offer your knowledge to help. Instead, you're just wanting to be heard.</p>
      <p>If you can, Hrant, try to objectively hear the tone of your own voice in these forums. Ask — and be willing to listen to — how others perceive you. Until then, I'll continue to enjoy the Typophile veterans who are walking through, building up, and genuinely contributing to a community of folks interested in typography.</p>
