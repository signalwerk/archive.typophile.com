  - id: 151171
    user: 2942
    date: 2006-08-01T13:57:00
    date_raw: 1 Aug 2006 — 1:57pm
    votes: null
    html: |-
      <p>Now I can see what happening I do have several things to offer you: take them or not.</p>
      <p> I am not sure that I like the 'bitten' quality of some of the openings where one shape has been cut from another. Some places like the upper end of low tail of the the L seem to benefit from this approach. But the bottom of your M it seems like a problem. And I don't know if it helps the opening under the A either. </p>
      <p>Maybe instead of making the R so round you should bring the arm in. Or cut a bite in the right side. </p>
      <p>I would like to see the Y being built out of the forms I see in the D. That vertical width. </p>
      <p>Looking at the comma I wonder if it can be at an angle, why not the arm of the R? Or maybe the comma should be build up from squares too... </p>
      <p>This is all to suggest that there are many more ways of making these forms &amp; that I want to encourage you to keep trying things. I think you might try 3 or 4 more possibilities for each letter and look for ways of creating a bit more harmony between them. There is always going to be some tension in a font like this between the 'rules' you have set for yourself to build the font &amp; the needs of the eye. When in doubt - go with the eye.</p>
      <p>I hope this is helpful.</p>
