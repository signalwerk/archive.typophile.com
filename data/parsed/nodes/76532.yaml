    <p>So I saw this Carnival/Western style display face two days ago, and have bene looking everywhere possible since. Some examples are listed below.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/example01_4714.png"></div><br>
    -<br>
    <div class="imageWrap"><img src="http://typophile.com/files/example02_4368.png"></div><br>
    -<br>
    <div class="imageWrap"><img src="http://typophile.com/files/example03_3818.png"></div><p></p>
    <p>I have stumbled across only one in the past day that is very close, but some of the serif/ornaments are not the same. That can be seen here.</p>
    <p><a href="http://www.1001fonts.com/font_details.html?font_id=2898" title="http://www.1001fonts.com/font_details.html?font_id=2898">http://www.1001fonts.com/font_details.html?font_id=2898</a></p>
    <p>I have literally spent hours going through free and paid type sites and am just not having any luck. The above was actually suggested using What the Font on MyFonts.com.</p>
    <p>Thanks in advance for any input!</p>
