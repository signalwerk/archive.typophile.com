    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_Fehlian_4T_5111.png"></div><p></p>
    <p>I take the pleasure to announce the release of <a class="freelinking external" href="http://www.myfonts.com/fonts/andreas-stotzner/fehlian/" rel="nofollow">FEHLIAN</a>, a caps-only titling font. It owes much to my former Arthur and Lindau releases.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_Fehlian_8T_4041.png"></div><br>
