      <p>I fulfilled my rounded font urge with <a href="http://www.joshuadarden.com/shop/omnes.php?PHPSESSID=9dfe50e2917793793d76564a2a62b391">Omnes</a> by <a href="/node/20594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Joshua Darden</a>. </p>
      <p>[Edit: That didn't really answer your question, Stephen. I'd say that based on the popularity of Gotham it could be very popular. However, the fact that the rounded (aka Web 2.0, as you mentioned) look has been around for a while perhaps it won't be quite as hot as the parent. I like how you identify it as a draftsman alphabet, it is very straight forward and perhaps that will be one thing it has over the other rounded sans available. Either way, the market is saturated, IMHO, and perhaps this completes it. (Although I see Nick has something coming out so perhaps I should hold my tongue.)]</p>
