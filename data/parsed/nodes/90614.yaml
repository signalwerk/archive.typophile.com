    html: |-
      <p><em> …if there is in fact much piracy of your Cyrillic fonts that means you're on to something; if there isn't that might mean people are looking for something else …</em></p>
      <p>One way or the other, realistically speaking I’m not in a position to monitor or market to Cyrillic countries, either directly or through distributors. I’m better off concentrating on Western markets, with Cyrillic &amp; Greek as features for Western corporate customers selling in those markets.</p>
      <p>And the types in question, Scotch Modern and Figgins Sans, are not productized for mass sales in the first place, in the West. </p>
      <p><em>That's just a color … </em></p>
      <p>It’s more than a colour, it’s also a surname (Brown is a newspaper face, named after the publisher). There’s no Mr Red or Mr Yellow, outside of <em>Resevoir Dogs</em>—not all colours are equally generic.<br>
      But that’s not the issue — Lineto didn’t do an adequate name search.</p>
