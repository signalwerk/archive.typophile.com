    html: |-
      <p>Dennis, I don’t actively search for piracy, it’s not a battle I choose to fight.<br>
      IMO it’s just part of the “shrinkage” (the trade term for shoplifting) of the digital marketplace.<br>
      I have enough to do.<br>
      For instance, I have been exchanging emails with Lineto for many months, trying to persuade them that they should not have named a new release “Brown”, as that is a longstanding Shinntype trademark.<br>
      If I wanted, I could spend all day running my business and not designing typefaces (or posting on Typophile).<br>
      However, this is not to say that I wouldn’t go after a particularly egregious act of piracy if I came across it or it was brought to my attention.</p>
