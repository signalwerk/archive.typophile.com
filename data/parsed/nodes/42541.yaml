      <p>Hi Yogendra,</p>
      <p>I’m afraid that one letter is a little too little to identify a typeface. Maybe the cracks can prove me wrong – then again, a ‘v’ isn’t very characteristic, and what’s more, the sample is quite small.<br>
      All I can tell you that it is an italic ‘v’ from a ‘Modern’ serif face, i.e. a classicist design that follows the form principles of the pointed pen. An example would be this <a href="http://www.fontshop.com/fonts/singles/elsner_flake/itc_bodoni_seventy_two_book_italic/?sample_text=v&amp;sample_size=388 " rel="nofollow">(ITC) Bodoni</a> – you see, it is somewhat similar, but no cigar.</p>
      <p>F</p>
