    html: |-
      <p>It looks very close to <a href="http://www.houseind.com/fonts/signpainterfontkit/viewfonts" rel="nofollow">House Slant</a> from the House Sign Painter set. Possibly a bit more stroke was added, but this is at least very similar to your sample. There were literally dozens of similar styles in the film type era, but a much smaller number were digitized. URW has some heavy brush scripts of this type, but I did not see an exact match.</p>
      <p>- Mike Yanega</p>
