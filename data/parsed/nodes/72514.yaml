    <p>I've been looking for this brush script font for a long time with no luck. It's quite different from the most common marker script like <a href="http://new.myfonts.com/fonts/efscangraphic/flash-sh/" rel="nofollow">Flash</a> or <a href="http://new.myfonts.com/fonts/ef/balloon/" rel="nofollow">Balloon</a>. Any ideas? </p>
    <p>Thanks a lot.</p>
