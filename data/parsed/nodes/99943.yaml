      <p>It is very hard to combine quite different serifs for a text and not make something look amateurish. While it is possible, start with that thought, and if you're not sure about something, assume you're making a mistake.</p>
      <p>As the alphabets are different, it is possible to use a <cite>somewhat</cite> different Greek and Latin font &amp; still have harmony. But watch out for headings that don't fit.</p>
      <p>By the way, there are more free fonts for polytonic Greek from The Greek Font Society:</p>
      <p><a href="http://www.greekfontsociety.gr/pages/en_typefaces1.html" title="http://www.greekfontsociety.gr/pages/en_typefaces1.html">http://www.greekfontsociety.gr/pages/en_typefaces1.html</a></p>
      <p>Not the best, but then, neither is Gentium. For what it's worth, GFS Olga is a pretty good font, but it is offered as an an inclined only.</p>
      <p>* * *</p>
      <p>In the world I live in -- scholarly books -- Goudy Old Style is reminiscent of Alumni magazines and other slick magazines aimed at people with more money than taste. While your mileage may vary, consider where you've seen Goudy Old Style used. Goudy is a Venetian, sort of, kind of. There are many better, of which Espinosa Nova is one. I mention it because just now the Roman is free, leaving you with a $50 purchase for the italic. I realize that does exceed you budget a bit.</p>
      <p><a href="http://www.myfonts.com/fonts/estudio-ch/espinosa-nova/" title="http://www.myfonts.com/fonts/estudio-ch/espinosa-nova/">http://www.myfonts.com/fonts/estudio-ch/espinosa-nova/</a> </p>
      <p>There is a GFS font (Greek) that matches it reasonably well -- if you're interested, reply so &amp; when I get to work tomorrow, I'll look it up.</p>
      <p>* * *</p>
      <p>It would appear you've got the Linotype Palatino that comes with polytonic Greek? Palatino is somewhat out of favor these days, but the OpenType version has all the characters and weights you need, and is still reasonably well respected. The fact that Palatino has been used a lot is probably the major reason it is out of favor. Designer boredom is not your problem, money is. If it were me &amp; I had your budgetary constraints, I'd used it for all the text.</p>
      <p>Adobe's Arno came free with some Adobe software; if you have it, it might serve your needs very well.  Arno also has all the characters and weights you need. It is well outside your budget if you have to buy it, though.</p>
      <p>&amp; BTW, a setting size of 9-point Palatino is about the same as 10-something Arno. Point size itself isn't too meaningful these days. Fit your copy if that's a requirement, while balancing the apparent size. You probably knew that...</p>
      <p>Good luck with it.</p>
