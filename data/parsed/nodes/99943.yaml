    <p>Hi all,</p>
    <p>I feel I am too sub-amateur to even be posting here, but I need some serious typographic assistance!  I'm preparing a handout (attached) for an important job talk I'm giving and I desperately want it to look professional.  </p>
    <p>The main body font must be small (like 9pt) to prevent lines of poetry from running off the page; and has to either come with MS Word 2010 or be inexpensive ($35 or less.)  :(  Also, some of the handout is in Greek, so I need a unicode font that will look ok with the Goudy</p>
    <p>I chose Goudy Old Style for the Latin because it seemed old-fashioned (good for my audience of Classics scholars) and on my screen I thought it looked more readable than, say, Baskerville OF at that size.  I keep switching between Palatino Linotype and Gentium for the Greek.  Then Bodoni MT for the headings...is this like a rookie combining-serifs mistake? I think all the fonts should have serifs because I'm trying to keep it sort of old school , but wasn't satisfied with the way GOS looked in the headings. </p>
    <p>Anyway, your suggestions would be so much appreciated!!  Thanks in advance!</p>
