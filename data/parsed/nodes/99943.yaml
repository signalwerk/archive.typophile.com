    html: <p>As to free fonts, you can try Andron and Cardo (<a href="http://www.mufi.info/fonts/" title="http://www.mufi.info/fonts/">http://www.mufi.info/fonts/</a>). I'd prefer the new Brill font (<a href="http://www.brill.com/author-gateway/brill-fonts" title="http://www.brill.com/author-gateway/brill-fonts">http://www.brill.com/author-gateway/brill-fonts</a>). Minion and Myriad come with Adobe Reader and might suit you well (after you install go to the installed folder under "resources - fonts".)</p>
