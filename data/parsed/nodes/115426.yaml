    html: |-
      <p>In Didone style typefaces the ‘o’ has a vertical symmetry axis. In most typefaces of that style b and d as well as p and q are almost mirror imaged. The relatively thin serifs at the top of the ascenders do not really contribute to a strong asymmetrical impression. In many cases the counters of these characters, as well as those of n, m and u look quite symmetrical. Especially when compared with the Garalde style. Geometric Sans Serif may be fairly symmetrical when it comes to u, j and t (as in Futura), as well as i, v, w and x, but that’s about it. In geometric sans serif design it is of course possible to come up with a symmetrical n and m as well, but then the typeface would have looked as revolutionary as the typefaces Herbert Bayer and Joost Schmidt designed during the Bauhaus Dessau era. Herbert Bayer used it for the title of »die neue line« and both of them used such designs for the lettering in exhibition design and posters, but these rather experimental designs heave never been available as metal type back then, let alone in text sizes.</p>
      <p>I’d be surprised if Borges thought of a sans serif typeface anyway. After all, his story was first published in 1941. At that time there were hardly any books printed with a sans serif as a text typeface. If he would have really imagined the books being printed in sans serif, that would have been quite a revolutionary statement for that time and I think he would thus have described that idea more precise. </p>
      <p>Also we have to take into account that at that time, Garalde typefaces were a relatively young phenomenon. Most of the revivals of that style came into the market into the early 1920s. Especially in Europe were WWII will have kept many printers from buying new typesetting machines and typefaces for some time. And, like it or not, the typical 19th century book face is Didonic. Most books known to Borges in 1941 will have been set in Didonic typefaces. Many of these will have had bracketed serifs, but that alone does not make their appearance less symmetrical.</p>
      <p>Didonic typefaces have a bad image when it comes to legibility, but we have to take into account that this idea is largely fed by the far too thin versions of the 20th century. This was mainly caused by poorly handled pantographs, phototype versions rendered from artwork for large sizes etc. Also the smoother paper of the 19th and 20th century had already caused many typefaces to look thinner than originally intended.</p>
      <p>Today, well designed optical sizes for smaller typefaces may do a remarkably good job, especially for the Didonic style.</p>
