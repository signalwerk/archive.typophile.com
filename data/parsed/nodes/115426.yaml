    html: |-
      <p>FontShop’s <a class="freelinking external" href="http://www.fontshop.com/fontlist/subclasses/serif_bracketed_modern_text/" rel="nofollow">Modern bracketed serif</a> list shows the right category, I think.</p>
      <p>Thinking within that category but not excluding the usually non-bracketed Didonic style: <a class="freelinking external" href="http://www.identifont.com/find?font=century+expanded&amp;q=Go" rel="nofollow">Century Expanded</a> is not bad, <a class="freelinking external" href="http://www.identifont.com/find?font=miller+text&amp;q=Go" rel="nofollow">Miller Text</a> is better but in both cases the descenders are too short for longer texts. I have the same problem with the regular weight of <a class="freelinking external" href="http://www.houseind.com/fonts/eames/viewfonts" rel="nofollow">Eames Century Modern</a>. Besides of that, the italic with its tightly-knit begin- and end strokes is far too nervous for book typography. <a class="freelinking external" href="http://www.identifont.com/find?font=new+century+schoolbook&amp;q=Go" rel="nofollow">(New) Century Schoolbook</a> may be slightly more appropriate. <a class="freelinking external" href="http://www.identifont.com/find?font=Bodoni+Twelve&amp;q=Go" rel="nofollow">ITC Bodoni Twelve</a> looks OK, but it may be too quirky for Borges rationalist attitude. <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/kepler/" rel="nofollow">Kepler</a> is more regular, but tends too much to the transitional style. Less transitional than one might expect from the way it is usually classified is Baskerville. A version of Baskerville with the appropriate lower contrast needed for text sizes could probably do a great job here. <a class="freelinking external" href="http://www.myfonts.com/fonts/berthold/baskerville-book-pro/" rel="nofollow">Berthold Baskerville Book</a> has the right colour I think. The same goes for <a class="freelinking external" href="http://www.myfonts.com/fonts/berthold/baskerville-pro/" rel="nofollow">Berthold Baskerville</a>, but it is rather clumsy compared with the Book version, the italic is too dark and the bolder weights lack contrast. That typeface family does not have that much in common with Baskerville anyway. One should be aware of the fact that foundries such as URW and Linotype sell Berthold Baskerville as Baskerville too, but that does not make them much better. Monotype and ITC Baskerville are far too light <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/baskerville-classico/" rel="nofollow">Linotype’s Baskerville Classico</a> looks decent, but one has to put it to the test to make shure.</p>
      <p>Personally, I would do some testing with <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fontfont/ff_cellini_ot/ot_ps" rel="nofollow">FF Cellini</a> by Albert Boton. Especially because it has the typical 19th century rationalist look, which is a bit more condensed.</p>
