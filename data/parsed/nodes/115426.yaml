      <p>Wow, thanks! I really appreciate your input! </p>
      <p>You definitely got me convinced it´s a didonic typeface I´m after. Especially:<br>
      "In most typefaces of that style b and d as well as p and q are almost mirror imaged"</p>
      <p>To me this is perfect since Borge frequently mentions mirrors in his stories, also in "The Library of Babel":</p>
      <p>"In the hallway there is a mirror which faithfully duplicates all appearances. Men usually infer from this mirror that the Library is not infinite (if it were, why this illusory duplication?); I prefer to dream that its polished surfaces represent and promise the infinite..."</p>
      <p>Do you have any suggestion for a great "modern" didone that would do a great job in my book? I´m going to follow the rules mentioned in Borges story, i.e:<br>
      "Each book is of four hundred and ten pages; each page, of forty lines, each line, of some eighty letters which are black in color."<br>
      Probably set at a pretty large size, something like 12/16pt. Havn´t got that far yet...</p>
      <p>Once again, thanks! I´ve learned a lot.</p>
