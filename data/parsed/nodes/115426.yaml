      <p>Caledonia is a beautiful typeface, but a bit skinny when compared to the metal version. I think that the hairlines of New Caledonia LT are a bit too thin for a text typeface. I also like Berthold Walbaum Book, but I think the stem are a bit too dark. Makes it too spotty / sparkling for a text typeface. Berthold Walbaum Standard is much better as a text typeface, also much better than the Monotype version which is too skinny. Also I think that Justus Erich Walbaum would probably rotate in his grave if he’d see how quirky that interpretation is. The disadvantage of Berthold Walbaum Standard might be slope of the italic. It provides a clear contrast to the roman, but at the risk of creating too much unrest on the page.</p>
      <p>When you need a typeface for student project, some foundries may supply you with a ‘student license’. Usually that means that you do not have to pay for it, but are not allowed to use it after having finished your study and for commercial projects. Give it a try at the foundry in question, I’d say …</p>
      <p>When classifying according to Thibaudeau, Baskerville clearly belongs into the Didot group.</p>
