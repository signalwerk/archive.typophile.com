    html: <p>The stresses I think were based on calligraphy. The U would have been drawn in one stroke (unless it is completed by a tail) whereas the lowercase u was drawn in two, as was the O.</p>
    html_clean: <p>The stresses I think were based on calligraphy. The U would have been drawn in one stroke (unless it is completed by a tail) whereas the lowercase u was drawn in two, as was the O.</p>
