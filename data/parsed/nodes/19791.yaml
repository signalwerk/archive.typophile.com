    html: |-
      <p>It is the result of historical evolution indeed, so there is no real "logic" to the stress in the UC 'U'. On the other hand it's difficult to shake the familiarity of centuries of consistent use.</p>
      <p>One of the funny examples I can think of is the previous incarnation of the logo of Belgian telecommunications company <a href="http://www.belgacom.be/home/en/jsp/dynamic/homepage.jsp" rel="nofollow">Belgacom</a>. It used a customised version of <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=E.1145.0.2&amp;attributes.sampleSize=24&amp;sampleText=B+E+L+G+A+C+O+M&amp;sampleSize=24" rel="nofollow">Template Gothic</a> where the original O and M were flipped horizontally because the stress was inverted. The O didin't bug me that much, but the "correct" M looked so wrong to a nerd like me. :^)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Belgacom_logo_5207.gif"></div><p></p>
