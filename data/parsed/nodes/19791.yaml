    <p>Has anyone ever noticed how awkward the U in US Airways' logo is?<br>
    (Compared here with Plantin Bold)<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ms_usairways_4968.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/ms_plantin_6073.gif"></div><p></p>
    <p>I'm not trying to prove anything here, but it doesn't have the same contrast treatment as the remaining letters. I surely won't be able to look at it the same way again...</p>
