    html: <p>You do see U's like that in fonts sometimes. Utopia is one. I find them to be a bit odd myself, even thought there seems to be a certain logic to it. The O and H, for example, are symmetrical, why not the U? The only reason I can think of is that U was derived from V and, therefore, follows the same thick/thin pattern.</p>
