    html: |-
      <p>&gt; The U would have been drawn in one stroke</p>
      <p>No, since the right stem would have to go up,<br>
      and that's a no-no in (conventional) calligraphy.</p>
      <p>If the Romans had a "U", they would have done a better job than us.</p>
      <p>Me, I like the one in "Carter's Caps", by William Carter.</p>
      <p>hhp</p>
