  html: |-
    <p>Hello Typophile!</p>
    <p>I created a simple sans-serif font for a personal web project I am working on, however, I have stumbled upon a problem with Firefox for Mac OS. "CHRSTPHR" (within an h1 tag) renders decently in most browsers except Firefox for Mac OS (V. 4 tested) in which it shifts down 10/15 pixels or so. I've checked my CSS thoroughly and can't seem to figure out the problem. Check out the last browser window in the following image:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/chrstphr_webtype_4639.jpg"></div><p></p>
    <p>I could just end up using an image for the header, but I am very curious about this inconsistency with the web font (web font was rendered using the Font Squirrel tool). I tried using a similar google font and it rendered with the same problem. You can also check out the demo project live right here: <a href="http://www.chrstphr.info/website/" title="www.chrstphr.info/website/">www.chrstphr.info/website/</a></p>
    <p>Any suggestions or thoughts are much appreciated!</p>
