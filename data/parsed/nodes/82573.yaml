      <p>Might also be a float issue. I seem to remember having some problems with alignment when I had both left and right floats. Anyway, it appears you've moved your site. If I can see the code it should be easier to figure out what's wrong. </p>
      <p>H1 tags have default margins that might differ from browser to browser. It's helps to reset some of these things.</p>
