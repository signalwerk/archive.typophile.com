    html: |-
      <p>Try checking your line-height or baseline attributes in the CSS. Firefox might be choosing a default value for something that you haven't defined in the CSS. In other words, it might be what isn't in your CSS that is the problem. </p>
      <p>There are a lot of reasons that could be happening, but those are worth checking first.</p>
      <p>Technically, though, there are probably more helpful places you could ask about cross-browser compatibility than Typophile. Try <a href="http://www.stackoverflow.com" title="www.stackoverflow.com">www.stackoverflow.com</a>! :)</p>
