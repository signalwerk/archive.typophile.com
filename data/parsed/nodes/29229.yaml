      <p>It does indeed look like it was cut with a router on an engraving jig.</p>
      <p>The "2" seems a bit topheavy and leans to the left and I'm not sure what to make of the angle cut in the "r".  The arches of the "m" and "n" transition into their uprights a bit too abruptly. Otherwise, this is looking very good.</p>
