    <p>So... I’ve been perusing this site and others for some time and have finally made progress on my first font.</p>
    <p>I've been really amazed at what a supportive and  collaborative environment there is. You might think it would be  secretive and competitive, but people seem happy to spread the information and love for designing type.</p>
    <p>I’m nicknaming it Router, because it is based on a sign that I saw in the subway where the letters are drilled out of plastic.</p>
    <p>I drew the shapes as simple lines with a stroke so I could make lighter and heavier weights if I wanted. Then, I expanded the objects and started redrawing. I particularly like the hard angles that happen inside the m, h, n, u etc. But, I’m not sure it’s dramatic enough... Doesn’t really have an effect when it’s reduced to smaller sizes.</p>
    <p>Page 1 are the letters I’ve worked out the most (hamburgefonts), and page 2 shows an example of the sign (with levels adjusted for ease of tracing). Also, the number 8 which was my first love in this font.</p>
    <p>It’s been a great learning experience. I can only imagine how much more I will discover as I go along.</p>
    <p>All the best. And thanks for your willingness to take a look at this.</p>
    <p>Jeremy</p>
