  html: |-
    <p>I would like to announce the release of TTHmachine Beta 2 (free download).<br>
    It is an IDE, with glyph rendering abilities, for hinting True Type fonts.<br>
    It enables full editing of prep, fpgm, CVT, gasp tables and glyf table instructions.</p>
    <p>My thanks to those who have given feedback.</p>
    <p>Allan Murray<br>
    <a href="http://www.cr8.netfirms.com" title="http://www.cr8.netfirms.com">http://www.cr8.netfirms.com</a></p>
