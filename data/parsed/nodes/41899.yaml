      <p>A great book with wonderfull examples printed by some of the best printers and designers is called "Specimens: A Stevens-Nelson Catalogue". It was printed in 1953 and each page is a sample of great paper, a great designer and/or printer including Bruce Rogers - Aldo Novarese -Hans Mardersteig - Joseph Blumenthal etc. Check it out at Booksold.com - sells for $150 t0 300 and would make an exhibition in itself.</p>
      <p>Specimens:A Stevens-Nelson Paper Catalogue<br>
      [New York]: [Stevens-Nelson], [1953] This is a catalogue “of the finest printing and art papers in the world...” All of the papers presented in this specimen book were either made by hand, or by hand in conjunction with the mould machine. The papers are a kaleidoscope of colors, tones, patterns and textures. “This catalogue owes its existence to ...more than 150 designers, printers, paper-makers, and other participants” (acknowledgements page) and contains a diversity of designs and printing techniques. Designers include Bruce Roger (who designed the introduction to this volume), Joseph Blumenthal, Hans Mardersteig at the Stamperia Valdònega, T. Robert Stumpf, Jan van Krimpen. Presses include Spiral Press, Curwen Press, Meriden Gravure, Golden Cockerel Press, Chiswick Press. Techniques used in the printing include lithography and silkscreen. With price list dated July 1953 loosely laid in (PAPERMAKING) 4to. Frontispiece “is a specially watermarked handmade paper from Cartiere Miliani-Fabriano” which when held up to the light reveals a marvellous portrait of a mother and child.Flyleaves are examples of fine watermarking obtained in mould made papers Numerous additional illustrations. Quarter green Nigerian goatskin over marbled boards by Russell-Rutter.</p>
