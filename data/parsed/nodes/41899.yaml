    <p>As I've mentioned <a class="freelinking external" href="http://www.typophile.com/node/36998" rel="nofollow">before</a>, I'm putting together an exhibition on type design from 1900-1960 this summer. I am presently searching for materials (books, specimens, sorts, whatever) that show any Deberny &amp; Peignot sans faces from the 20s/30s (e.g. Bifur). I'm looking for materials from that era, related to the metal type. </p>
    <p>Any Deco collectors out there who have something they'd be willing to lend June-September? (Security, climate control, proper attribution of course all assured.) Anybody know any leads on other people or institutions who might be willing to help?</p>
    <p>Thanks in advance for any offers or leads!</p>
