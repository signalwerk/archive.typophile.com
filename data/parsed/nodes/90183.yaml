    <p>Hello all,</p>
    <p>I'm currently designing for a scriptwriting project - book cover &amp; posters. </p>
    <p>I'm under the impression that Courier is the standard typeface for scriptwriting. However, this might seem a tad generic, so I'm tempted by something more contemporary (set it modern day). I've been curious of Officina &amp; Stag. Would anyone have any thoughts?</p>
    <p>Thanks for any sort of input!</p>
