    <p>Hello there guys, i'm really wanting to purchase Doyald Young's books, but they aren't the easiest to find, especially in Europe. I found this website, and they have the boxed set for sale: <a href="http://www.doyaldyoung.com/DYC01.html" title="http://www.doyaldyoung.com/DYC01.html">http://www.doyaldyoung.com/DYC01.html</a></p>
    <p>However, there is zero contact information on the site, and i'm a little wary spending $300 when I don't even know if i'll get the item, I don't see the boxed set for sale anywhere else like Amazon. For this type of purchase I would want to track it and insure it, but there are no options for that. </p>
    <p>Does anyone know if the site is legit? Or if there is anywhere else I can buy the boxed set?</p>
    <p>Thanks!</p>
    <p>-Josh</p>
