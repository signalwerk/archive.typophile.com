      <p>I found two of the books on ebay. All three of the books (not as a set) can be found at various booksellers on abe.com (owned by Amazon). You could save a few dollars, especially on shipping, by buying the individual books on abe.com.</p>
      <p>Also on abe.com is one listing for the boxed set, but it is $350.00. If you contact the bookseller and point out that the retail price is only $300.00 new they might match it, and you might save on shipping.</p>
      <p>On both sites I used the keyword search term "Doyald Young". FWIW, I think the site you mentioned is legitimate.</p>
      <p>HTH</p>
