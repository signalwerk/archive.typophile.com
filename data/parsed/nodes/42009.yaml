      <p>Joel, </p>
      <p>since the "plain" pseudo-quotes are separate characters from the "typographic" quotes, separately encoded in Unicode, a transformation from "plain" pseudo-quotes to "typographic" quotes should be done on the character level, by an application -- not on the glyph level in your font. Note that quotation rules are different for different languages. If your text is in English, then the typographic quotes “are like this” but if your text is in German, then the typographic quotes „are like this“. Each language has its own specifics, and it is up to the application's (or up to the keyboard driver) to take those specifics into account. It would be very inefficient to expect that every OpenType font should carry quotation rules for dozens or even hundreds of languages, and it would be very difficult to maintain/fix/update this kind of information once the font is released. This is why the stuff does not belong in the font. </p>
      <p>FontLab Studio uses the AFDKO (Adobe FDK for OpenType) syntax for defining the OpenType Layout features. </p>
      <p><strong>Some pointers for learning the "OpenType language"</strong></p>
      <ul>
      <li>Your starter may be <a href="http://www.fontlab.net/Typographic-Resources/Font-Typography-Books/Learn-FontLab-Fast/" rel="nofollow">Leslie Cabarga's "Learn FontLab Fast"</a> book.</li>
      <li>Secondly, there is a chapter <a href="http://www.fontlab.net/font-editor/fontlab-studio/download-fontlab-studio/" rel="nofollow">FontLab Studio manual</a>.</li>
      <li>John Hudson's article <a href="http://www.microsoft.com/typography/Glyph%20Processing/intro.mspx" rel="nofollow">Windows Glyphs Processing</a> provides a good overview of the OpenType technology.</li>
      <li><a href="http://www.typotheque.com/fonts/opentype_feature_support/" rel="nofollow">Typotheque</a> provides a useful reference of Layout features used by different applications.</li>
      <li>The <a href="http://www.microsoft.com/typography/otspec/ttoreg.htm" rel="nofollow">OpenType tag registry</a> provides an overview of all registered OpenType Layout features.</li>
      <li>Microsoft provides an overview of the system support for OpenType Layout features <a href="http://www.microsoft.com/typography/OpenType%20Dev/standard/intro.mspx" rel="nofollow">for Latin, Cyrillic, Greek and other "standard" writing systems</a>.</li>
      <li><a href="http://kltf.de/kltf_otproduction.htm" rel="nofollow">Karsten Luecke</a> collected his various useful OpenType production notes.</li>
      <li>Adobe published the <a href="http://del.icio.us/adamtwar/opentypedev/" rel="nofollow">AFDKO source code for the Bickham Script Pro and Minion Pro</a> OpenType fonts they published.</li>
      <li>Adobe's <a href="http://blogs.adobe.com/typblography/atypi2006/slye_lisbon-05.pdf" rel="nofollow">Christopher Slye</a> and <a href="http://blogs.adobe.com/typblography/atypi2006/atypi_Adventures_in_class_kerning.pdf" rel="nofollow">Miguel Sousa</a> published useful slides.</li>
      <li>There are numerous <a href="http://www.google.com/search?q=site%3Atypophile.com+feature+sub" rel="nofollow">threads on Typophile</a> that discuss specific quesions and issues.</li>
      <li>Finally, the <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html" rel="nofollow">AFDKO feature file syntax</a> is the ultimate reference for the language.</li>
      <li>The <a href="http://www.microsoft.com/typography/otspec/" rel="nofollow">OpenType font format specification</a> is an important reference.</li>
      </ul>
      <p>Regards,<br>
      Adam</p>
