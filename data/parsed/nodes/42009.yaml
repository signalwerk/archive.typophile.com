      <p>Frank, </p>
      <p>you do know that the "crcy" and "dpng" features have been removed from the OpenType specification version 1.25 back in July 2000? Generating fonts with those features makes them contradict the current OpenType standard, so I'm puzzled why DTL FontMaster tries to make them. If it really does generate them, it looks like all fonts made with DTL FontMaster so far that carry those features are not compliant with the most recent OpenType specifications 1.25, 1.3 and 1.4. </p>
      <p>Adam</p>
