    html: |-
      <p>‘[…] FontLab Studio uses the AFDKO (Adobe FDK for OpenType) syntax for defining the OpenType Layout features. [...]’</p>
      <p>And so does DTL FontMaster. It generates the applicable OpenType Layout features like:</p>
      <p># --- FEATURE SUMMARY<br>
      # --- Substitution<br>
      #     aalt: access all alternates<br>
      #     smcp: lc to smallcaps<br>
      #     c2sc: caps to smallcaps<br>
      #     case: uppercase, math and punct shift up<br>
      #     titl: replaces default glyphs with .titling variations<br>
      #     onum: changes to oldstyle figures<br>
      #     lnum: changes to lining figures<br>
      #     pnum: changes to proportional figures<br>
      #     tnum: changes to tabular figures<br>
      #     crcy: replaces any currency char with any other<br>
      #     sups: makes numbers superior<br>
      #     sinf: makes numbers inferior<br>
      #     numr: replaces selected figures with numerators<br>
      #     dnom: replaces selected figures with denominators<br>
      #     frac: substitutes the existing fractions<br>
      #     dpng: dipthong subs<br>
      #     liga: standard lig replacement<br>
      #     salt: replaces glyphs with alternate variations<br>
      #     dlig: discretionary ligatures<br>
      #     ordn: subs ordinal glyphs after numbers<br>
      #     ornm: allows access to ornaments<br>
      #     zero: slashed zero</p>
      <p>automatically if there are matching characters in the font.  All other features will be removed during generation. Basically one can use any features file that uses the AFDKO syntax and has a matching character naming convention after adding three lines. Everything that is covered by the FDK/SDK will be in the font then, as I showed during the presentation together with Miguel Sousa at the ATypI TypeTech Forum in Brighton last year.</p>
