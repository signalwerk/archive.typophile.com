      <p>I am having a similar problem to youremin.</p>
      <p>Converting a postscript outline font to otf using FontForge (yes, I have permission to do this) and I find that the typesetting program (in this case XeLaTeX) does not correctly substitute the curled quote marks that are at U+2018 and U+2019 for the vertical "apostrophe quote". Yet with standard (bought) open type fonts it works fine. So there must be some flag somewhere in the font that the typesetting program reads to know to do this. And that flag must not be being set correctly in the conversion process. Does anyone know what that is and how I can correct it?</p>
      <p>The curled quotes are definitely present in the font.</p>
      <p>(Tearing my hair out!)</p>
      <p>El.</p>
