      <p>I prefer the original as well, mainly because if feels more distinct and has a more solid design. But, I understand the desire to move away from it. However, I think your changes are a bit scattered. They are leaning towards one direction, but not working together and just confusing things.</p>
      <p>If your concept is the idea of the web as a ‘green field’ and your design group ‘cultivates’ it, then this should sit more squarely at the center. I like the idea that Chris Keegan mentioned: the agricultural look. It’s unique and has a lot of visual possibilities that make your concept a bit clearer.</p>
      <p>What you’ve design so far has the feeling of a concept sketch that’s been executed on the computer. Research something like <a href="http://flickr.com/photos/darrylsphotoblog/89769945/">painted barn signs</a> or something with a bit more life to it. Your current design feels too sterile to have real character, but too mixed to be modern and sleek. Your old design was complex, but it seems to get at the concept more directly. Also, if your company name is GreenField, I’d stick with that same treatment. It’s confusing otherwise and the whole ‘bold/regular but one word’ thing is very played out.</p>
      <p>Your project definitely has possibilities. I’m eager to see where it goes.</p>
