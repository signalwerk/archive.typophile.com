    html: <p>I’m going to make an assumption about your concept. It reminds me of old farm signage, agricultural equipment, with an industrial feel. Is this the direction? If so, I think it makes sense, but the logo definitely needs to be finessed - letterspacing, etc. I would even think about keeping “greenfield” in the same typeface, and separating the words by color. There’s something about that combination of typefaces that isn’t working for me. I think you’re heading in a much better direction - that first logo looks like a logo for cookies, or health food.</p>
