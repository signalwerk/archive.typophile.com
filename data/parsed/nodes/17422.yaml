      <p>The old logo is kind of nice, but I also wanted something I can shrink and place in the footers of the websites I create.  The top logo doesn’t shrink too well.<br>
      GreenField is supposed to be one word.  The name of my company is “GreenField Designs” - it’s a web design company.<br>
      I think I just may replace the tag line (it was just a thought I threw together) with bar to help fill the space.</p>
