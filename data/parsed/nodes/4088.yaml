    html: "<p><i>The purpose of an emphasis style is simply to differentiate, visually.</i> <br> <br>Yes, but differentiating visually does not necessarily involve <b>visually emphasising</b> which is what happens when you change weight. Such visual emphasis draws immediate attention to the bold words, overriding normal reading, which is the intent: visual emphasis says 'look here'. Articulatory emphasis, using italics, makes a visual distinction, but it is not a distinction of visual emphasis. Italics do not say 'look here', and they do not override normal reading; rather, as you are reading they subtly signal that a word is of a different order to the words around it, either because it is a foreign word or because it is <i>stressed</i>. <br> <br>I disagree that typical italics introduce a 'perceptive informality'. I see nothing informal in the typical italic, e.g. Bembo. If anything, such italics are much more formal (literally, <i>formata</i>)than sloped romans, which tend to look like toy versions of their upright versions. <br> <br>A 'carefully balanced demi' is still darker than the surrounding text. It is still going to draw the eye to it: even before one starts reading at the top of the page, one is going to be aware of this dark area in the lower peripheral vision. It is still going to say 'look here'</p>"
