    html: "<p>Chris, in design -unlike Art- <i>other people</i> are more important. <br> <br>&gt; Perhaps we have a semantic misunderstanding. <br> <br>Possibly. <br>The purpose of an emphasis style is simply to differentiate, visually. The context (for example, if it's a magazine title, or a single word) will determine what the reader makes of it. My concern is simply to: <br>1) Ensure proper saccading. <br>2) Avoid a skew in the voice. <br> <br>A typical italic will accomplish the first, but generally fail in the second - it will introduce a <i>perceptive</i> informality (not just a \"shift in tone\") that's not necessarily appropriate (certainly not a newspaper for example). A typical bold will fail in the first (it will cause errant fixations because of its extreme contrast), but succeed in the second. Because failure in the first is more obvious than failure in the second, people will favor italics over bold. But you <i>can</i> have both, with a carefully balanced demi. <br> <br>Look at the Bold of Mana-16 and see how much better than an italics it works. <br> <br>&gt; would say that italic is like a change in voice, while <br>&gt; bold (or demibold) is like a change in volume.  <br> <br>1) I'm not so sure laymen will say this. <br>2) It matters less what they say, versus what they feel. <br> <br>hhp <br></p>"
