    html: "<p>Well, I think semi-serifs do actually add some cursiveness, because they sort of emulate in/out strokes (and that's the bad news). But my point was something else: you said Prensa's italic was a sloped-Roman except for different structures on four letters; while I think the change from double to semi serifs is significant - in terms of texture, hence contrast. A \"true\" sloped-Roman (funny) should have full double serifs, no? Or at least a lot more serifs, like in that Deberny face. <br> <br>As for dynamism, is it coming from the \"seminess\" of the serifs, or actually just the slant? <br> <br>BTW, let me ask something: <br>How would you compare Prensa's italic with Harrier? <br><a href=\"http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif</a> <br> <br>Unibody: <br>It's slight. I only realized because Nick Shinn pointed it out. Unibody's italic is narrower than the roman, but has the same stroke widths (1 pixel) and letterspacing (2 pixels). This makes it darker. <br> <br>hhp <br></p>"
