    html: <p>&gt; I would not call Joanna italic a sloped roman. <br>&gt; Joanna italic has .... <br> <br>But look at the foot serifs, and that "f"! <br>Since there isn't (and maybe can't be) a formulaic way to decide if an italic is a sloped-Roman or if it's so-called "true", I'd suggest that the important thing is the overall impression. To me, Joanna italic's rigidity, along with some strong Roman features (and weak cursive features) really seem to make it more a sloped-Roman than not. <br> <br>Another "litmus test" might be my Patria's italic*. It is in fact structurally derived directly from a Roman framework, but the serifs have been pulled out, softer terminals grafted, and some structures altered - but mostly there's a strong mechanical relationship with the Roman. But is it a sloped or a "true"? In fact I think it looks more "italic" than Joanna's, but maybe it isn't? <br> <br>* <br><a href="http://www.themicrofoundry.com/other/nour&amp;patria/dev/patria-italic.gif" target="_blank">http://www.themicrofoundry.com/other/nour&amp;patria/dev/patria-italic.gif</a> <br><a href="http://www.typophile.com/forums/messages/29/805.html" target="_blank">http://www.typophile.com/forums/messages/29/805.html</a> <br> <br>hhp <br></p>
