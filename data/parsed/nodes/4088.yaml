    html: <p>I'm not sure that there's much to be learned from it, really. What I learned in doing it was much more interesting than the font itself. The intermediate forms are far from being usable. You've got double-sided serifs turning into one-way cursive exit strokes and the like. <br> <br>But it is kind of entertaining seeing the two story a turn reasonably smoothly into a one-story a, and the roman ampersand (&amp;) turn into the "et" style ampersand.  <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>On the chirography front, in my mind a different level of chirographic tratment is just another aspect of the distinction between italic and roman. Indeed, I would say that the stronger calligraphic underpinnings of italic are traditionally one of its defining features. <br> <br>Cheers, <br> <br>T</p>
