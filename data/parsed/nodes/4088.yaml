    html: "<p>Chris -- <br> <br>As others have already mentioned, Electra was originally released with a sloped roman counterpart. This was subsequently augmented with a more traditional italic design (designated Electra Cursive), which is the only companion to be found in current digital versions. <br> <br>In response to your second query:  <br>The best example I know of is Rudolph Ruzicka's design of the two-volume tribute to Dwiggins that was published by the Typophiles after WAD's death -- <i>Postscripts on Dwiggins</i>, Typophiles Chap Books 35 &amp; 36 [The Typophiles: New York, 1960.] <br> <br>The trim size is 4.5 x 7\". The text is set in Electra, 10 / 12 x 19p6, 32 lines deep. Ruzicka specified the use of both the original italic and the cursive for different kinds of distinctions. Within text, the cursive is used for emphasis, foreign phrases, and titles of works; but captions and extended extracts from writings or interviews are set in the sloped roman. The effect is subtle and quite interesting. <br> <br>I don't think I have the entire Electra correspondence, but I have Griffith's dossier on the project. When I get a chance, I'll look through it to see if there is anything substantial to report about the development of the two italics. <br> <br>I have an ambition to redigitize Dwiggins's Electra, going back to the original Megenthaler drawings as the primary source. However, I have not yet been able to secure the appropriate permissions. Part of my plan is to include both versions of the italic. <br> <br>-- K. <br></p>"
    html_clean: "<p>Chris -- <br> <br>As others have already mentioned, Electra was originally released with a sloped roman counterpart. This was subsequently augmented with a more traditional italic design (designated Electra Cursive), which is the only companion to be found in current digital versions. <br> <br>In response to your second query:  <br>The best example I know of is Rudolph Ruzicka's design of the two-volume tribute to Dwiggins that was published by the Typophiles after WAD's death -- <i>Postscripts on Dwiggins</i>, Typophiles Chap Books 35 &amp; 36 [The Typophiles: New York, 1960.] <br> <br>The trim size is 4.5 x 7\". The text is set in Electra, 10 / 12 x 19p6, 32 lines deep. Ruzicka specified the use of both the original italic and the cursive for different kinds of distinctions. Within text, the cursive is used for emphasis, foreign phrases, and titles of works; but captions and extended extracts from writings or interviews are set in the sloped roman. The effect is subtle and quite interesting. <br> <br>I don't think I have the entire Electra correspondence, but I have Griffith's dossier on the project. When I get a chance, I'll look through it to see if there is anything substantial to report about the development of the two italics. <br> <br>I have an ambition to redigitize Dwiggins's Electra, going back to the original Megenthaler drawings as the primary source. However, I have not yet been able to secure the appropriate permissions. Part of my plan is to include both versions of the italic. <br> <br>-- K. <br></p>"
