    html: "<p>(Agree with John H about the visual or text emphasis. Not the same thing, text one is part of the writer job, visual part of typographer job). <br> <br>Assuming with start from a Serif roman, attempt to list various way to create an italic in not particularly order, some ways can mixed with others: <br>-- Electronic slope <br>-- Electronic slope, visually corrected by a designer. <br>-- Condensed version <br>-- Roman all serif became semi serif with flat serifs or close too. <br>-- Cursive serifs, in various degrees. <br>-- Ligher weight <br>-- Cursive version from a subtil difference to a Aldus/chancery style <br>-- Different glyphs forms <br> <br>Then, depending of the wishes of the designer, to fit to a style, type category, skills of the designer (!), Morison views, to be creative, innovative, to fit the brief of the client, brand needs, etc. the result can be very different. <br> <br>In my early years of type design, I tend to like Aldus style cursivity with low slope. Such my Angie. Then, I experimented in my own way \"Morison ideas\" with Apolline (true Aldus cursivity, narrow, lighter, different glyph forms, but Roman serifs). Later, I after various others experiments, I tend to think that is really depending of the subject, some designs need innovative italics, others very traditionals ones. <br> <br>And more more, I try to don't \"re-event cold water\" when I design a new face. Caps are caps, lowercases are lowercases, and italics are italics! but always there way to play with forms to have fun (one of my main concern).</p>"
    html_clean: "<p>(Agree with John H about the visual or text emphasis. Not the same thing, text one is part of the writer job, visual part of typographer job). <br> <br>Assuming with start from a Serif roman, attempt to list various way to create an italic in not particularly order, some ways can mixed with others: <br>-- Electronic slope <br>-- Electronic slope, visually corrected by a designer. <br>-- Condensed version <br>-- Roman all serif became semi serif with flat serifs or close too. <br>-- Cursive serifs, in various degrees. <br>-- Ligher weight <br>-- Cursive version from a subtil difference to a Aldus/chancery style <br>-- Different glyphs forms <br> <br>Then, depending of the wishes of the designer, to fit to a style, type category, skills of the designer (!), Morison views, to be creative, innovative, to fit the brief of the client, brand needs, etc. the result can be very different. <br> <br>In my early years of type design, I tend to like Aldus style cursivity with low slope. Such my Angie. Then, I experimented in my own way \"Morison ideas\" with Apolline (true Aldus cursivity, narrow, lighter, different glyph forms, but Roman serifs). Later, I after various others experiments, I tend to think that is really depending of the subject, some designs need innovative italics, others very traditionals ones. <br> <br>And more more, I try to don't \"re-event cold water\" when I design a new face. Caps are caps, lowercases are lowercases, and italics are italics! but always there way to play with forms to have fun (one of my main concern).</p>"
