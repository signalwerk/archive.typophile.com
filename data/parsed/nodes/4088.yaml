    html: "<p><i>Since there isn't (and maybe can't be) a formulaic way to decide if an italic is a sloped-Roman...</i> <br> <br>I generally take the lowercase a as the key letter in determining whether an italic is a sloped roman. Foot serifs and general rigidity, even a non-descending f, these are all found in historical sloped lettering styles that are clearly not sloped romans per se, and which certainly predate the typographic concept of a sloped roman. I think we're making a mistake if we divide all sloped lettering into either 'sloped roman' or 'true italic': there is a variety of sloped lettering, which deserves to be more thoughtfully considered. Joanna italic certainly isn't cursive, but it is very far from being a sloped version of the roman: the compression of the letters is extreme, and quite contrary to Morison's idea of a sloped roman as a subservient style.</p>"
    html_clean: "<p><i>Since there isn't (and maybe can't be) a formulaic way to decide if an italic is a sloped-Roman...</i> <br> <br>I generally take the lowercase a as the key letter in determining whether an italic is a sloped roman. Foot serifs and general rigidity, even a non-descending f, these are all found in historical sloped lettering styles that are clearly not sloped romans per se, and which certainly predate the typographic concept of a sloped roman. I think we're making a mistake if we divide all sloped lettering into either 'sloped roman' or 'true italic': there is a variety of sloped lettering, which deserves to be more thoughtfully considered. Joanna italic certainly isn't cursive, but it is very far from being a sloped version of the roman: the compression of the letters is extreme, and quite contrary to Morison's idea of a sloped roman as a subservient style.</p>"
