    html: <p>I think I agree with John here, in that boldface is used for different kinds of emphasis. I would also add that on average, a bold creates a much heavier emphasis than an italic. Yes, it's possible to design an italic that creates more emphasis (e.g. Galliard), or make weights close enough together that they create less emphasis.  <br> <br>But again, this is not how italics and boldface have generally been designed, nor (as John points out) how they have been used. I'm sure this won't change in my lifetime, and I'm not going to be saddened by this, as I don't feel that we're missing out on some particularly wonderful alternative. <br> <br>Cheers, <br> <br>T</p>
