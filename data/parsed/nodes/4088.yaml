    html: <p>I actually think Electra's slanted-Roman failed because it <i>wasn't</i> "pretty". In terms of contrast, I think it had plenty, and anyway that's not the point - the point is cursiveness is not an absolute requirement for effective contrast, and slant works much better. As for the way "texture" is used in that correspondence, I think any slanted form naturally has a very divergent texture from a Roman, more so than an "upright italic" in fact. <br> <br>&gt; some distractingly exotic forms <br> <br>Where can one see these? <br> <br>hhp <br></p>
