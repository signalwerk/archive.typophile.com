    html: "<p>Chris, this is something I've researched a good deal. <br> <br>Some fonts have had an italic that was replaced with another. Think Bembo. Some fonts have had a sloped-Roman which was later replaced by so-called \"true italics\". Probably the best example is Electra. Morison influenced the creation of Electra's first italic. His ideology was solid (for a change), but he went in the wrong direction, taking the idea too literally. Other fonts have had two italics, one more italic than the other. Porbably the best example is Seria (although its first italic is unusable for emphasis). There's also a font which didn't have any italic at first, so people auto-sloped it. When the designer released a true italic, many users clamored for the old one! So the designer released the sloped-Roman as  a true separate alternative. That font is Treacy's Arrow. <br> <br>Then there's Sauna, which has two italics with different levels of cusiveness (but the same slope). <br>This is the closest thing to the \"ideal\" that I've found, except: <br>1) It's not a text face. <br>2) You really want less cursiveness overall, especially in the less cursive one. <br> <br>My Patria has an italic that's not really a sloped-roman but it's very rigid. There's also a second italics (at the moment with incompatible proportions however - a long story) which is basically a sloped-Roman with semi-serifs. It's called Harrier, and I actually see it as a next-generation book face. <br> <br>&gt;&gt; \"Slanted roman type was introduced in the 1930s <br> <br>More like the 1830s... Well, in the second half of the 19th century. <br>Most notably by Tuleu, Deberny's bastard son. <br> <br>The true age of sloped-Romans is a little-know fact, which Morison deftly covered up. In the end, his single good idea was unoriginal. It's a good thing he wrote a lot of books. <br> <br>hhp <br></p>"
