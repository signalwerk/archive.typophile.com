    html: "<p>&gt; my personal preferences and my service to them shouldn't be at odds. <br> <br>I think they <i>must</i> be at odds - but \"naturally\" so - it's a dynamic that can be used well or poorly. Humans can't help being individual and creative - but it's the way you harness that energy which makes the difference between Craft and Art. So for example: <br> <br>&gt; italics click more for me <br> <br>No doubt, and nobody should condemn you for your feelings. But then you have to consider the differences between want and need, between consciousness and the subconscious, and between us and laymen. You have to ask what clicks for <i>users</i>, and if that doesn't click for you then to me that's the real test of a designer: the process of compromise itself should click for you, should turn you on. Otherwise it's merely art. <br> <br>&gt; And a controlled, quality printing environment. <br> <br>This is admittedly a very good point: a demi will get lost in lo-fi printing more than an italic. However: <br>1) Lo-fi printing is less demanding in terms of readability anyway. So for example you would use a heavier demi and live with the occasional errant saccade, since they're going to happen a lot anyway. Agreed, this make a demi less desirable in lo-fi printing, but there's still a gain: you're avoiding a skewed voice. <br>2) This still doesn't justify cursiveness in an italic. It's the slope that counts. <br> <br>hhp <br></p>"
