      <p>As promised, here are a few tidbits I dug up. <br> <br>Excerpts from two letters from Dwiggins to Griffith, which confirm that he was influenced by Morison's article: <br><br>
      </p><blockquote>March 22, 1932. <br>"I send with this . . . trials for my italic. You will remember when we were talking about it once we said let's try something not like the usual italic form. This shot is not like the usual italic. It might be called slanted roman. Stanley Morison was advocating something along this line, as better for words in an otherwise roman set-up that wouldn't jump out of the page so much as the usual italic.  <br>"This attempt, as you will see, has roman style serifs, etc., -- idea is to have it color just like its accompanying roman -- same weights and finishing features. " <br> <br>June 14, 1932. <br>"My gag has been -- working along the lines suggested by Stanley Morison -- to make an italic that would be weighted the same as the roman; keeping the texture of the page, and still breaking away from the roman far enough to do the trick that italic is used for. This [Electra Italic] will unquestionably keep the texture pretty, the test will be to see if it separates enough to do the trick."</blockquote><p></p>
      <p> <br>(It should be noted that the drawings for this italic would have been made by hand -- that is, I don't believe that Dwiggins made use of any photographic manipulation to arrive at his sloped roman.) <br> <br>Griffith, in one of his commentaries, provides this evaluation of the circumstances surrounding the birth of the second italic: <br><br>
      </p><blockquote>"The oblique roman letter, misnamed italic, designed as a running mate with Electra Roman, failed to perform the service that an italic is used for: contrast, emphasis. It was successful, however, in keeping the texture of the page, but so much so that it did not break away far enough to provide a sufficient degree of contrast. Used apart from the roman as an individual face in its own right, this so-called italic possesses essential virtues that make it uniquely appropriate and felicitous for poetry, separatist texts, etc., for its allusive clearness and dignity. . . . <br>"With the growth in popularity of Electra as a book text face, the demand became insistent for a more conventional form of italic, particularly the lowercase characters, to provide the necessary break in texture of the printed page. Accordingly, WAD set out to develop a lowercase alphabet in the cursive form which would meet the requirements and at the same time look well in conjunction with oblique style of capitals, numerals, etc., previously made for the original italic."</blockquote><p></p>
      <p> <br>Dwiggins's first attempts in this direction were actually quite bizarre, with some distractingly exotic forms for 'g r s' and an idea for some rather swashy capitals. He also faced some challenges working within the constraints of Lino duplexing. <br> <br>-- K. <br></p>
