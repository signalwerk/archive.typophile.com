    html: "<p>&gt; an MM that morphed from a Venetian roman to a very cursive italic. <br> <br>Hey,  I'd really really like to see that font. Is it something you'd publish for general appreciation? I think we can learn a lot from it. <br> <br>&gt; some of those differences are perhaps multiplicative with each other <br> <br>Well stated. <br> <br>&gt; Too much will interfere significantly with readability <br> <br>As will too much slant (which is one reason why Patria's is so slight). But really in this case I'm more concerned with \"atmospheric\" conflict with the Roman. <br> <br>Chirography: maybe we should stay away from that angle for a change. My main point isn't that anyway - I'm concerned that an italic that has a different level of chirography than the Roman is less useful, because it dilutes the focus of the font's \"voice\". There's a reason fonts have paired Roman-Italics! <br> <br>Rate of progress: <br>In this age of \"democratic\" type design, there's really only one way: people should think about what's needed, and make fonts accordingly, and throw them out so their ideas take life on the ground, slowly but surely. <br> <br>hhp <br></p>"
