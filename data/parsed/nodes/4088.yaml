    html: <p>&gt; Morison wanted italic types that are not too different from their <br>&gt; roman counterparts, that perhaps share similar widths and proportions. <br> <br>From the famous Fleuron article -where you can see for example Morison taking a Roman, slanting it, then modifying it slightly- it seems that he was advocating an italic structurally similar to the Roman, yes, and even highly so. His problem with the conventional italic is that its informal structures introduce an unnecessary skewing of the Roman's "voice". And he was right. For a reader the only real marker of an italic is its slope (which is why upright italics are just a bad joke). As a result, a sloped-Roman is in fact the ideal. This doesn't mean however that all the serifs have to be maintained, or the "a" has to remain binocular, etc. First of all, it has to look nice. But the point is that it doesn't have to be cursive to look nice. If you look at the  Deberny sample I linked to, you'll see a truly intelligent as well as attractive rendering of a slanted-Roman (unlike the stuff Morrison's contemporaries produced). <br> <br>&gt; Trump Medi</p>
