    html: <p><i>1) I'm not so sure laymen will say this. </i> <br> <br>Presuming the layman is a competent and experienced reader, give him a piece of text in which a <i>stressed</i> articulation is indicated in italics. Ask him to read it aloud. He will stress the italicised word. Whether he understands conceptually that italicisation indicates a change in voice, he practices the convention. <br> <br><i>2) It matters less what they say, versus what they feel.</i> <br> <br>It matters less what they feel than what they <i>do</i>. They articulate.</p>
