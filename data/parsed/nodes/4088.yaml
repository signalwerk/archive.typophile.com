    html: <p>I agree with Dwiggins insofar as slant alone is not sufficient for contrast, as well as creating ugly shapes. <br> <br>I do agree with Hrant that cursivity is not a requirement for effective contrast (though I think it is a near-requirement for historical reasons, as outlined earlier). Slant is a near-requirement for effective contrast, though I think that if one combined form change, lighter weight and more condensed width, it might be possible to do an upright italic that had sufficient contrast to "work" in that sense, though I think it would probably fail simply because it violated reader expecations. <br> <br>Regards, <br> <br>T</p>
