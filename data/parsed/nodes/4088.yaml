    votes: null
    html: "<p>&gt; I don't feel that we're missing out on some particularly wonderful alternative. <br> <br>I don't know about \"wonderful\" either, but certainly there's something a bit off about using italics for emphasis, and a good typographer will consider alternatives no matter how slight the benefit. <br> <br>&gt; Hrant, when was the last time you typeset an author's text? <br> <br>Practically never. My claim comes from observation. In 99% of the typesetting on this earth (and Kent, you can certainly consider yourself in the other 1%), there's the roman, and then there's its italic, and the latter is used for any kind of differentiation, including article names, single words, etc. Yes, they're coming from different places (and if that's what John meant then, sure, I agree), but as far as the reading process is concerned the \"micro\" functionality is the same. Now if you're asking for some sort of formalization for \"the masses\" to use <i>two</i> forms of differentiation instead of just italics, then you're asking for even more than me! I'm simply asking for people to use a Demi (for everything), instead of italics. And onsceen typography is actually heading this way; if ideology won't facilitate the shift from slant to color, maybe technological limitation will!  :-/ <br> <br>Hey, that strange WAD italic is interesting! Mostly I'm glad to see it's not an idea about a funky italics that I've had myself... <br> <br>(William: thanks!) <br> <br>hhp <br></p>"
