    html: <p>&gt; quite contrary to Morison's idea of a sloped roman as a subservient style. <br> <br>Do you think Morison wanted the italic to totally blend in, only standing out in terms of slant? I guess that could be. And maybe that validates my feeling that he was taking the idea too literally. To me, the point isn't to preserve the structural formalism, but simply to avoid introducing a skew in the "voice" (which cursiveness will generally do). <br> <br>-- <br> <br>Kent, great plan! <br> <br>hhp <br></p>
