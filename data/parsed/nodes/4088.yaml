    html: "<p><i>For one thing, silent reading is totally removed from articulation.</i> <br> <br>Are you saying that silent reading is effectively monotonous? I do not think that silent reading is <i>totally</i> removed from verbal articulation, especially not when one is reading a novel and is dealing with dialogue or articulated narration. But note also that I am not claiming a direct or constant parallel between verbal and typographic articulation. Using italics to indicate foreign words is also typographic articulation, assisting higher level processing of text. I use the term articulation because of the parallels that often do exist and because typographic articulation, like verbal articulation, makes the meaning of language clearer. <br> <br>I suspect we are talking at cross purposes, again, because you are obsessing about what happens in the lowest level of reading comprehension -- word identification -- and I am talking about typographic articulation that exists primarily to assist higher levels of reading comprehension -- textual understanding. Once again, I take readability as a given -- it's not an achievement, it's a prerequisite --: there's no point to any sophisticated typographic articulation if people can't read. But people can read, and do read, and the goal of their reading is not word identification <i>but textual understanding</i>.</p>"
