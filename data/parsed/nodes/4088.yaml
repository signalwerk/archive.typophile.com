    html: "<p><i>I actually agree that a darker weight (rarely a full Bold though) is better for emphasis than an italic.</i> <br> <br>This is something that really gets on my tit: if you ask people what italics are used for, one of the typical answers is 'for emphasis' (indeed, the 'em' tag in HTML is interpreted almost exclusively as applying italics: you have to make a different choice explicit in your CSS if you want something other, e.g. bold). But this is often followed by the observation that 'bold is actually better for emphasis'. The problem of both the response regarding the use of italic and the observation regarding bold is that it makes no distinction between <b>visual</b> emphasis and <i>linguistic</i> or <i>articulatory</i> emphasis. The main use of italics within text is for articulatory emphasis, the typographic equivalent of verbal stress. This is completely different from visual emphasis, which unless used to denote shouting has no verbal equivalent: it is usually navigational or indicative of information hierarchy, e.g. to highlight a warning or some other particularly important message in a text. So when you talk about using italic or bold for emphasis, be clear about what <i>kind</i> of emphasis you mean.</p>"
    html_clean: "<p><i>I actually agree that a darker weight (rarely a full Bold though) is better for emphasis than an italic.</i> <br> <br>This is something that really gets on my tit: if you ask people what italics are used for, one of the typical answers is 'for emphasis' (indeed, the 'em' tag in HTML is interpreted almost exclusively as applying italics: you have to make a different choice explicit in your CSS if you want something other, e.g. bold). But this is often followed by the observation that 'bold is actually better for emphasis'. The problem of both the response regarding the use of italic and the observation regarding bold is that it makes no distinction between <b>visual</b> emphasis and <i>linguistic</i> or <i>articulatory</i> emphasis. The main use of italics within text is for articulatory emphasis, the typographic equivalent of verbal stress. This is completely different from visual emphasis, which unless used to denote shouting has no verbal equivalent: it is usually navigational or indicative of information hierarchy, e.g. to highlight a warning or some other particularly important message in a text. So when you talk about using italic or bold for emphasis, be clear about what <i>kind</i> of emphasis you mean.</p>"
  - id: 30429
