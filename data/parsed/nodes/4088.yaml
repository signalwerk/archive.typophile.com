    html: <p><i>&gt;you choose a style (usually italics) that will make words stand out, irrespective of what they're standing out for, so to speak. </i> <br> <br>This is not true at all, at least not in my profession. Hrant, when was the last time you typeset an author's text? <br> <br>Most of the time, italics are used to make the text different, not stand out -- foreign words and phrases, titles, etc. When I set those in italic, I don't want them to <i>stand out.</i> The author doesn't want them to stand out. When you look at the page, you aren't supposed to necessarily see those elements first. Heck, that's really true even of articulatory emphasis. I don't think you should notice a use of italics for emphasis <i>standing out</i> from the page.  <br> <br>Now, heads, subheads, run-in heads, these are supposed to stand out. And a bold is much more effective here (or a change in size). <br> <br>-- K. <br></p>
