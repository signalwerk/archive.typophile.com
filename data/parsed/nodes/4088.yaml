    html: <p>"<i>Chris, in design -unlike Art- </i>other people<i> are more important. </i>" <br> <br>I take it this is in response to my bit of prose on my preference for italics. In which case, I agree completely. However, as the appointed guide for the reader through the author's text, as long as the rest of the choices support that preference, then my personal preferences and my service to them shouldn't be at odds. I'm willing to accede that there's a relative subtlety in the sloped romans compared to the italics. But the italics click more for me when considering their common usage as an indication of importance, extra considerations, emphasis, emotion, tone, etc. (excluding titles, which is partially what sparked the questions in the first place <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> ). This is most likely a moot point, since I tend to use the faces of others, rather than create my own. So, the choice is made for me in most cases. <br> <br>"<i>But you </i>can<i> have both, with a carefully balanced demi. </i> <br> <br>And a controlled, quality printing environment.</p>
