    html: "<p>A couple of responses/corrections to comments above. I'm sorry I don't have time to get into this really fascinating thread. <br> <br>Tiffany: I would not call Joanna italic a sloped roman. It is very rigid, certainly, but that is typical of all Gill's italics. Joanna italic has a single-storey a and many other 'true italic' forms, e.g. the e and g. <br> <br>Keith: Felicity is the proper name of Perpetua italic, not Joanna. <a href=\"http://www.newadvent.org/cathen/06029a.htm\">Perpetua and Felicitas</a> (anglicised as Felicity) are saints martyred, with others, at Carthage in 203AD.</p>"
    html_clean: "<p>A couple of responses/corrections to comments above. I'm sorry I don't have time to get into this really fascinating thread. <br> <br>Tiffany: I would not call Joanna italic a sloped roman. It is very rigid, certainly, but that is typical of all Gill's italics. Joanna italic has a single-storey a and many other 'true italic' forms, e.g. the e and g. <br> <br>Keith: Felicity is the proper name of Perpetua italic, not Joanna. <a href=\"http://www.newadvent.org/cathen/06029a.htm\" class=\"link-external\">Perpetua and Felicitas</a> (anglicised as Felicity) are saints martyred, with others, at Carthage in 203AD.</p>"
