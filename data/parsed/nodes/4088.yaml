    html: <p>My Master's thesis topic was actually extreme form change in multiple master fonts. But to embody that problem, I did an MM that morphed from a Venetian roman to a very cursive italic. So I also studied the difference in the forms a lot, and in some different ways than most people have needed to look at them. I learned lots about the problems (and solutions) of linear interpolation along the way. <br> <br>You did a good job of enumerating the typical differences between roman and italic. Although I agree that the slope is perhaps the single largest factor in visually distinguishing the typical italic from the roman, I don't think it's possible to make a simple formula for the relative contributions of each of the differentiating factors. Indeed, I think that if one was expressing it mathematically, that some of those differences are perhaps multiplicative with each other, or some other more complex relationship. <br> <br>Personally, I think there's nothing wrong with some cursiveness in an italic. Too much will interfere significantly with readability, but of course if italic is reserved for emphasis, a *little* slowing down is not necessarily bad. <br> <br>The part of this where we disagree most strongly is where you bring in all the anti-chirographic screed. It's not that I'm particularly strongly in the chirographic-is-inherently-good camp. But I do think that there is some significant truth to the idea that people are the most comfortable reading fonts that have familiar structure and rhythm. For the Latin script (and many others) that familiar structure and rhythm has a lot to do with the chirographic underpinnings of our printed language. <br> <br>In a country with sufficiently strong centralized control, it would be possible to change this by decree and just do fonts with no chirographic basis. It would just take 50 years or so. Unlike you, I don't think this would necessarily be "progress"; it would just be different.  <br> <br>Cheers, <br> <br>T</p>
