    votes: null
    html: "<p>Nice Master's topic! A copy of the paper anywhere? <br> <br>&gt; contrast is exactly what it necessary to help it stand out enough. <br> <br>Sure. But: <br> <br>&gt; It's just a question of what's enough contrast <br> <br>Degree of \"aggregate contrast\" shall we say is indeed the central issue, and we can talk about that (including the difference between the degree people [think they] want versus the degree designers tend to think they need versus the degree they <i>actually</i> need), but the real point here I think is the <i>types</i> of contrast that can be used, and which are suitable in what ways. <br> <br>Italics can stand out in various ways, such as slant, cursiveness, color, apparent size, narrowness, etc. and certainly most italics combine more than one of these*. What we need to try to figure out is: <br>1) How much each factor contributes to the contrast, and in what contexts (most significantly in terms of display versus text work). <br>2) What other \"baggage\" does each factor bring, and how is each type of baggage good/bad with respect to the italic's primary role (emphasis in a body of the Roman). <br> <br>* Patria's for example uses ALL the ones I list, mostly because I decided to make its slant very slight (1/16 = ~3.58 degrees), and it needed help pulling away from the Roman. <br> <br>A telling indication that cursiveness is insufficient on its own is the simple truth that an \"upright italic\" (which I prefer to call \"cursive roman\") just doesn't work for emphasis. <br> <br>My feeling is that cursiveness: <br>1) Does indeed add to contract, but not much. <br>2) Is not <i>indispensable</i> for good functionality. <br>3) Can help or hinder depending on the nature of the Roman (and its proper use). For example, cursiveness is less welcome in a news face than it is in a coffee-table book about Italian art. Cursiveness brings an informality to the setting that might or might not be a good idea; in fact I think it's really a lousy default choice of contrast tactic. Part of the reason is that I think chirographic Romans are themselves flawed. <br> <br>Most of all, I think what needs to be admitted is that <i>slant</i> is in fact the primary axis of differentiation, especially in immersive reading, where structural pedantisms such a deeper angle in the arches of h/n/m/u are secondary (even tertiary, when you consider that color for example is more significant). This is common sense, actually, and the main people resisting this obvious fact are chirographic type designers, who want cursiveness to have a power it simply can't. When they ridicule the sloped-Roman, it's not because they have any proof that it's less functional (the proof would show the opposite!), it's because it counters their \"faith\". Others favor cursiveness simply because \"them's the way me pappy always made 'em\". <br> <br>What we need is some progress. <br> <br>hhp <br></p>"
