    html: "<p>Randy -- <br> <br>Dwiggins's \"exotic\" italic was never developed. It was nixed (for good reasons, IMO). It might have been interesting on its own, but it was a poor companion for Electra. It looked really ungainly in-line. <br> <br>Hrant:  <br><i>&gt;there's the roman, and then there's its italic, and the latter is used for any kind of differentiation, including article names, single words, etc. Yes, they're coming from different places (and if that's what John meant then, sure, I agree), but as far as the reading process is concerned the \"micro\" functionality is the same. </i> <br> <br>The micro functionality is to be different, not to stand out. Perhaps we have a semantic misunderstanding. When you say \"stand out\" I think you mean that the emphasized word or phrase should be more obvious than the surrounding text -- which is what I think a demi-bold accomplishes.  <br> <br>However, I do not think that is what should happen in 99% of typesetting. Nor do I think that is what \"the masses\" would want to accomplish when they are seeking to supply emphasis.  <br> <br>Yes, italic disrupts the roman \"voice\"; but I would suggest that this is precisely what most people are trying to show with italic -- when they italicize a word or phrase, it is to indicate a shift in tone. I would be willing to bet that most nontypographic people, when asked, would say that italic is like a change in voice, while bold (or demibold) is like a change in volume. (I don't think that is just a \"1%\" perception.) <br> <br>-- K. <br></p>"
