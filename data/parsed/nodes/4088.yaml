    html: "<p><a href=\"http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif</a>  <br> <br>This is absolutely beautiful!  <br> <br>The bigger differences between the two lie more with finish than with the fundamental architecture; with regard to the latter, they may be said to be fairly similar. Readily apparent differences between the two are: (1) a steeper slope and greater stroke angularity in Prensa, (2) the two- (Harrier) vs. one-storey (Prensa italic) lower case a, and (3) the beak (Harrier) vs. quasi-lachrymal (Prensa italic) lower case f.  <br> <br>Your face, Hrant, more closely rides the line between roman and italic than any other font I've seen! <br> <br>With regard to the dynamism I perceive in Prensa's italic, to me it derives more from the unilateral serif placement than from the slant; silly as it may sound, the letters seem to be taking a step in the right direction (no pun intended, really), which is important in a language that is meant to be read from left-to-right. It's the same dynamic effect that I get from Avance (in both the roman and the italic). <br> <br>An answer (albeit a poor one indeed) to Chris's first question above is Optima, which has an italic and an oblique. The differences between the two are slight but perhaps most noticeable in the lower case f. <br> <br>Jon</p>"
    html_clean: "<p><a href=\"http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif\" target=\"_blank\" class=\"link-external\">http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif</a>  <br> <br>This is absolutely beautiful!  <br> <br>The bigger differences between the two lie more with finish than with the fundamental architecture; with regard to the latter, they may be said to be fairly similar. Readily apparent differences between the two are: (1) a steeper slope and greater stroke angularity in Prensa, (2) the two- (Harrier) vs. one-storey (Prensa italic) lower case a, and (3) the beak (Harrier) vs. quasi-lachrymal (Prensa italic) lower case f.  <br> <br>Your face, Hrant, more closely rides the line between roman and italic than any other font I've seen! <br> <br>With regard to the dynamism I perceive in Prensa's italic, to me it derives more from the unilateral serif placement than from the slant; silly as it may sound, the letters seem to be taking a step in the right direction (no pun intended, really), which is important in a language that is meant to be read from left-to-right. It's the same dynamic effect that I get from Avance (in both the roman and the italic). <br> <br>An answer (albeit a poor one indeed) to Chris's first question above is Optima, which has an italic and an oblique. The differences between the two are slight but perhaps most noticeable in the lower case f. <br> <br>Jon</p>"
