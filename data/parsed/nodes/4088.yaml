    html: <p>My Master's thesis actually had a lot to do with the structural differences between roman and italic. <br> <br>Personally, I'm in agreement with the idea that structural change in the letterforms is the critical feature in determining when you've got an italic instead of a sloped roman. If you want one big change to point at, I agree with John that a change from a double story to single story "a" is probably the clearest indicator. <br> <br>I can see a usage for a less distinctive italic when it is going to be set fairly separately from the upright. But when it is being used mixed in with roman text, contrast is exactly what it necessary to help it stand out enough. It's just a question of what's enough contrast; I think it's pretty clear that I'm in the mainstream as believing that a cursive element is helpful in creating the necessary amount of contrast. My impression is that the kind of "ideal italic" Hrant would favor, I would find useless in any situation where it had to mix with roman. <br> <br>T</p>
