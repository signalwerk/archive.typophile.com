    html: "<p>From <i>Stanley Morison: his typographic achievement</i>, by James Moran: <br> <br>\"However, Morison's liking for the Arrighi-style italic was not followed when Van Krimpen designed Romulus, cut by Monotype in 1936. Its italic applied Morison's theoretical ideas in his essay <i>Towards an Ideal Italic</i> where he had urged that the only function of the italic was to support the main roman letter. Romulus was therefore a sloped roman, but the result was not a happy one for the reader, as A. F. Johnson observed in a review in <i>Signature</i> (No. 13, 1940) where he stated of the 'sloped roman': 'This may be logical, but results in a stiff and monotonous letter.' Both Morison and Van Krimpen later considered the experiment to be wrong in principle, but they discussed a script type for the Romulus family, and out of this came Van Krimpen's exquisite Cancelleresca Bastarda.\" (p. 142) <br> <br>As to more modern use of the sloped roman, Knuth (1986) -- although he did not specifically design a sloped roman -- advocates use of a mathematically sloped roman in the context of mathematical text: \"Slanted roman type was introduced in the 1930s, but it first became widely used as an alternative to the conventional italic during the late 1970s. It can be beneficial in mathematical texts, since slanted letters are distinguishable from the italic letters in math formulas. The double use of italic type for two different purposes -- for example, when statements of theorems are italicized as well as the names of variables in those theorems -- has led to some confusion, which can now be avoided with slanted type.\" (p. 13) <br> <br>Personally, I have an aversion to slanted roman type; this is no slight against Romulus. Rather, it stems simply from seeing so many bad examples of artifically sloped roman type in advertising and text. <br> <br>Jon</p>"
