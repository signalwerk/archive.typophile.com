    html: "<p>I'm very glad Electra has been discussed here; I'd neglected to recall its italic/cursive evolution. If you have Tracy's wonderful <i>Letters of Credit</i>, you will find another specimen of Electra's first italic on p. 179. See also the text on pp. 179-180 for more information on this. Another specimen of the original Electra italic appears in Carter's <i>Twentieth Century Type Designers</i> on p. 69. <br> <br>With regard to Gill's work on Perpetua and its associated Felicity, see also Carter's aforementioned work (p. 76) and Morison's <i>A Tally of Types</i>, pp. 97-104, particularly p. 102: \"The theoretical discussion about 'sloped roman' had not been without its influence on the italic but the rejection of f [straight-serriffed descender] in favour of f [curved descender] proves that the calligraphic past of italic was still robust and capable of holding its position in the typography of the future.\"  <br> <br>And so it has. <br> <br>Jon</p>"
