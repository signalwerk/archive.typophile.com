  html: <p>I'm reading Bringhurst and I came across his discussion of sloped romans and italics (p. 56-59). This triggered a series of questions in my mind. <br> <br>1) Is there a family that has sloped romans and italics? (serif or sans) <br> <br>2) If there are any (or if any were made) would you use sloped romans for accents and italics for emphatic speech? Or would you avoid the sloped roman, as Bringhurst suggests? <br> <br>Just some random thoughts...</p>
