    html: <p>Getting back to Chris's second question, I have little doubt that most if not all of us on this list would avoid mathematically sloped romans altogether; they look like crap. The programs for my kids' violin recitals are done largely in sloped Mrs Eaves roman (hit the I in Word, and that's what you get); every time I see this, my blood pressure goes up by at least 20 points. <br> <br>I should say, however, that an exception to my general aversion to sloped or obliqued romans is the "italic" of Cyrus Highsmith's excellent Prensa. But for a few characters -- a, f, k, and n -- the italic is an obliqued roman, and in my opinion, it works really well. <br> <br>Jon</p>
