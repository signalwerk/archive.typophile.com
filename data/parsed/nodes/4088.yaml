    html: "<p>&gt; articulatory emphasis ... is completely different from visual emphasis <br> <br>Really? The thing is, in 99% of typesetting emphasis is one-dimensional: you choose a style (usually italics) that will make words stand out, irrespective of what they're standing out for, so to speak. And I'm not sure that italics and bold really represent qualitatively different aspects of speech; you could say that an italics of very steep slant \"shouts\" more than a demi weight. <br> <br>BTW, technically there's no contradiction in saying that \"italics are used for emphasis\" and \"bold makes for better emphasis\". Also, I really haven't heard this second statement often at all - your typical typographer certainly won't agree to that. <br> <br>-- <br> <br>Jon, I'm very pleased you like Harrier*. Would you see it being used as a book face? I mean as a \"roman\", not an italic. <br> <br>* You should know however that -just like at the Westmnister show- Harrier is an underdog - pardon the pun. Many other type designers can't stand it, and it caused a Really Famous one to recently exclaim \"you still don't know what is a counter and how counters are the key of good typeface design\". But the opinion of a [discriminating] <i>user</i> is always more valuable to me than that of another type designer... <br> <br>Optima: yes, that's an interesting new dimension, that you now have two italics to choose from (a bit like Arrow). I think the same will happen (or has already?) with Frutiger. <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; articulatory emphasis ... is completely different from visual emphasis <br> <br>Really? The thing is, in 99% of typesetting emphasis is one-dimensional: you choose a style (usually italics) that will make words stand out, irrespective of what they're standing out for, so to speak. And I'm not sure that italics and bold really represent qualitatively different aspects of speech; you could say that an italics of very steep slant \"shouts\" more than a demi weight. <br> <br>BTW, technically there's no contradiction in saying that \"italics are used for emphasis\" and \"bold makes for better emphasis\". Also, I really haven't heard this second statement often at all - your typical typographer certainly won't agree to that. <br> <br>-- <br> <br>Jon, I'm very pleased you like Harrier*. Would you see it being used as a book face? I mean as a \"roman\", not an italic. <br> <br>* You should know however that -just like at the Westmnister show- Harrier is an underdog - pardon the pun. Many other type designers can't stand it, and it caused a Really Famous one to recently exclaim \"you still don't know what is a counter and how counters are the key of good typeface design\". But the opinion of a [discriminating] <i>user</i> is always more valuable to me than that of another type designer... <br> <br>Optima: yes, that's an interesting new dimension, that you now have two italics to choose from (a bit like Arrow). I think the same will happen (or has already?) with Frutiger. <br> <br>hhp <br></p>"
