  - id: 30438
    user: 2172
    date: 2004-04-05T10:09:00
    date_raw: 5.Apr.2004 10.09am
    votes: null
    html: "<p>Wow, I was away from Typophile all weekend, and now my mind is reeling from the wealth of discussion here. This'll probably be a long post. <br> <br>Firstly, I find it appropriate that Electra comes up in this topic, since I've been a fan of it ever since I discovered it back in school. In fact, it was a large subliminal (and later a direct) inspiration for my first attempt at typeface design. I've always been drawn to lighter faces (a child of the digital age, I suppose), but now I'm starting to find many of them too thin and spindly. In fact, the roman I designed is probably more of an anemic, poorly-fed light face rather than a roman. So, Kent, if you revive Electra, I will be forever in your debt. <br> <br>Secondly, I'm fascinated by the possibilities of these two variations, to the point that I'd want to incorporate both into any serif design I'd end up doing (I still hold out hope that I'll get to it). Although, I abhor the mathematical 'faux' italics of word processing, so it would be interesting to see where my tastes would lead me. <br> <br>-- <br> <br>In reference to the emphasis discussion (bold v. italic/ high contrast v. low contrast), I avoid bold weights in text scrupulously, unless forced by 'marketing concerns'. When I post on the web, I'm emulating my speech (which is often sarcastic or ironic), so I use italics for subtle emphasis, and bold for more blunt emphasis. But in printed text, I think I'd use capitals before I'd use bold, solely because of the color difference in the words. I'm not sure where or when I came to this conclusion, but there it is. I reserve bold for heads, typically. I guess this strikes at editorial/ authorial decisions as well. Why use caps for yelling, one could just preface with, \"He yelled...\"? <br> <br>-- <br> <br>Anyway, concerning the sloped v. italic: I would never give up what I consider the rhythmic beauty of a well-matched calligraphic italic in a field of serenely vertical romans. It may not be the most efficient or theoretically sound choice, but I don't think that makes it less effective.* However, the idea of supplementing a family's range of voice with a sloped roman does seem like an intriguing idea (Though I'm treading ground that's already been covered here, I suppose.) <br> <br>Perhaps I hold this view for the same reason I wear my great-uncle's manual-winding wristwatch: it's a connection to the past (as Thomas points out) that just feels right... and still works. <br> <br>*Interesting side anecdote: I once had to defend the somewhat out-of-context serif italic affectations of Gill Sans italic to a client, who thought they were 'wierd'. I believe they were implying I should faux-italicize instead. Oh, they know not what they do... Fortunately, I cut that debate short before it got out of hand.</p>"
