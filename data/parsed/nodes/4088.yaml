    html: <p>Personally, I find that overly steep slants on italics are jarring and distracting. But maybe that's just me. But I have to admit that for contrast only, there is certainly some amount of slant that is sufficient. <br> <br>Actually, that brings to mind an observation. System-slanted "faux italics" are usually at 20 degrees I think, while 10 to 12 degrees is typical of real italics. Perhaps the OS designers thought they needed that much slant in the absence of the other changes in form. <br> <br>As for expectations, I wasn't thinking of them necessarily being conscious expectations, no. <br> <br>As for differences in weight, if you look carefully or do some measurements, you'll find that the overwhelming majority of italics are slightly lighter in weight than their roman counterparts. Now, they're also slightly narrower, but in general the reduction in weight goes just a tad beyond the amount necessary to maintain the same color. FWIW, I'm pretty sure Robert Slimbach agrees with me on this, unless I'm completely misremembering a conversation we had a few weeks ago. <br> <br>But we're talking a pretty subtle difference in weight, nowhere near the amount one has between one weight and the next in a series. In most typefaces, italics are definitely a more subtle form of emphasis than boldface. Of course there are exceptions--Galliard Italic springs to mind. <br> <br>Cheers, <br> <br>T</p>
