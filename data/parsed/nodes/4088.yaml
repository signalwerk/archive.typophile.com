    html: "<p>&gt; Such visual emphasis draws immediate attention to the bold words <br> <br>Not if it's not too dark. An overly-italic italic has the exact same problem that a too-dark bold has. An emphasized word needs to draw a saccade from the correct range: the fixation before it, but not before that. The correct amount of contrast does this, and this is at the perceptive level, way before the reading mechanism has had time to figure out any higher-level information such as what the emphasis is about. <br> <br>&gt; I see nothing informal in the typical italic <br> <br>Really? That's strange. So Noordzij is wrong there [too]? <br> <br>&gt; He will stress the italicised word. <br> <br>Consciously, sure. But: <br>1) What about the -more important- immersive mechanics? No such thing happens there. <br>2) There's also a rise in amplitude/volume, just like you \"accuse\" a darker weight of having. <br> <br>I think you're assuming too rigid and superficial an interpretation of what actually goes one during reading. For one thing, silent reading is totally removed from articulation. At least let's not regress so many hundreds of years, please. <br> <br>hhp <br></p>"
