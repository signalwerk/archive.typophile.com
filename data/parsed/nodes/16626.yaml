  html: |-
    <p>Hi Folks,</p>
    <p>I would swear there was a way to create a shape of a certain size in FontLab but I can't find it!</p>
    <p>Let's say I wanted to make a circle or a square 100 units wide and high. How do I do that!?</p>
    <p>Thanks in advance,</p>
    <p>Amy</p>
