    html: |-
      <p>Open the Primitives window (Window &gt; Primitives).<br>
      Select Ellipse and click on the Place button.<br>
      In the tiny window that appears, click on the "..." button.<br>
      A dialog box will appear where you can enter the dimensions.</p>
