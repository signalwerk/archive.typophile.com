      <p>I differ from Adam on this.</p>
      <p>I've put this character in my fonts since it was introduced in Unicode, but only make it available through c2sc, not smcp.</p>
      <p>In the smcp feature, ß maps to a special double-s glyph.<br>
      This is so that "caps with small caps"—which is what, in implementation, smcp really is — is a true bicameral setting, corresponding with the way that ß is capitalized by layout engines.</p>
      <p>However, if the special Eszett character exists as text in a cap setting (never as titlecase, of course!), that makes it OK to have it in the c2sc feature—which is, in implementation, "all small caps".</p>
    html_clean: |-
