      <p><cite>I guess there will always be disagreement between German speakers about the use of that glyph</cite></p>
      <p>I predict it will be a transition over one or two generations. Same thing happened for the Umlauts. They started out as a lowercase ligature and when their use was common, the uppercase versions slowly appeared and are now standard too. We are used to them now, so no one is questioning the existence of those characters, even though—ironically—their formal development from a lowercase letter is something that some experts now use as an argument against the cap Eszett. </p>
      <p><cite>the strongest argument I have heard in favour of the new Unicode character, from a German, is that it enables reliable one-to-one round-trip case mapping<cite></cite></cite></p>
      <p>Well, of course. This is how every Western alphabet works. See also <a href="http://opentype.info/blog/2011/01/24/capital-sharp-s/" title="http://opentype.info/blog/2011/01/24/capital-sharp-s/">http://opentype.info/blog/2011/01/24/capital-sharp-s/</a><br>
      And that's why I always get a little mad, when typographers(!) call the cap Eszett a “silly” idea. It is silly not to have a lowercase AND uppercase version of any character in any Western alphabet. Its the most basic principle. </p>
      <p><cite>My impression of Duden is that it tends to favour a top-down approach to spelling, reflecting official decision making rather than popular usage. </cite></p>
      <p>They do both. Of course they follow the spelling reform, because this is now the new standard. But when new words or new spellings become widely used, they list these also, even though they are not in the official German orthography.</p>
