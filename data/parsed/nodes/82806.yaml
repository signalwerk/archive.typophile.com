      <p><cite>The German standard spelling regarding ß to SS is not likely to change based on font character set support. </cite></p>
      <p>Well, of course the change of the standard spelling requires a sufficient support of the character in typical operating systems first. Everything else would be madness.<br>
      And the common dictionary publishers like DUDEN will follow whatever the users make their standard. </p>
      <p>And actually, I am surprised how many users actually use it even today—especially on the internet. Even though there are no easy input methods yet and even though many readers will still see a NOT DEF sign instead.  It is spreading—whether the conservative typographers like it or not.</p>
      <p>But apart from that I fully agree, the standard is still ß to SS in uppercase and small caps and fonts, design applications and browsers should implement it that way. (Maybe leaving additional options for using the cap Eszett instead in stylistic sets and the like.)</p>
