      <p><strong>UPDATE:</strong> In 2010, the German Federal Agency for Cartography and Geodesy (“Bundesamt für Kartographie und Geodäsie”) published the 5th revised edition of the document <a href="http://www.stagn.de/Portals/0/101125_TopR5.pdf" rel="nofollow">“Toponymic guidelines for map and other editors for international use Federal Republic of Germany”</a>. </p>
      <p>Section 1.1.3 of this document says: </p>
      <blockquote><p><cite>1.1.3 Special letter ẞ ß<br>
      The special letter ß (“strong s”) existed hitherto only as small letter (minuscule). In 2007 DIN and ISO accepted the capital letter ẞ which is rendered on position 1E9E of the Unicode character tables. In official spelling it must not be substituted by any other letter combination, as e.g. SS, ss. In the alphabetical order ẞ, ß is treated like SS, ss. Since a typographical implementation of the upper case letter ẞ in the various character fonts will take some time, it may be temporarily substituted by SS, ss.<br>
      NEW: Due to the new regulation of German spelling the letter ß is after a short (stressed) vowel now replaced by ss. The letter ß remains after a long vowel or a diphthong.</cite></p></blockquote>
      <blockquote><p><cite>Examples for names of geographical regions:<br>
      — now: Hassberge (short and stressed vowel a), until now: Haßberge<br>
      — will continue: Meißner (diphthong preceding ß), MEIẞNER<br>
      — will continue: Großer Feldberg (long vowel o preceding ß), GROẞER FELDBERG</cite></p></blockquote>
      <blockquote><p><cite>Example for an officially approved name of a municipality<br>
      — will continue: Haßfurt, HAẞFURT (though a short and stressed vowel a is preceding ß)</cite></p></blockquote>
      <p>This is, to my knowledge, the first official <strong>German government body</strong> that not only approves but actually <strong>prescribes</strong> the use of uppercase ß (U+1E9E, ẞ), and only accepts the use of SS “temporarily” (“since a typographical implementation of the upper case letter ẞ in the various character fonts will take some time”). </p>
      <p>Regards,<br>
      Adam</p>
