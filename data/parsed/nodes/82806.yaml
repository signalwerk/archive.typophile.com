      <p>I guess there will always be disagreement between German speakers about the use of that glyph--some even quite passionate about it. I usually include it but not for any philosophical reason.  I just put it in there for those who need it.  I don't care to get involved in the pro and con positions opposing sides site.  Those who want it can use it and those who don't can just ignore it. I put there just like the florin, AE Ring acute, etc. and let the user have the option if so desired.  I include it in the c2sc code and as a stylistic alternate to the S_S.sc glyph.</p>
      <p>My understanding is that the majority of uses involve proper names mostly of towns and cities.</p>
