      <p>This line is not necessary in c2sc:</p>
      <p>sub @LC_ALPHA by @UC_SMCP;</p>
      <p>Also, for @LC_SMCP, make sure that germandbls is substituted by "germandbls.smcp", which is two small cap "s"s.</p>
      <p>**</p>
      <p>This is what should happen:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Gross_3971.png"></div><p></p>
      <p>The fact that "mixed case to small caps/all small caps" loses the distinction between Gross and Groß follows on from the way that layout engines convert "mixed case to all caps", losing the distinction there (although it is maintained in the underlying text). This is because traditionally there was no cap eszett accessible in most fonts or via keyboards, and this behaviour has been grandfathered.</p>
