      <p>The German standard spelling regarding ß to SS is not likely to change based on font character set support. I suspect that, like most bodies that add words to language and regulate spelling, changes to German orthography will be made based on a combination of history and current use of how the language is spoken and written. German recently had a big spelling reform; whether another top-down reform could come in the near future … I have no idea.</p>
      <p>One should not judge what practicing German typographers are doing based on glyph design discussions of a certain number of type designers alone. The pros and cons of the cap eszett are still quite active topics of discussion among German typographers. No particular feeling toward the new form is universal yet. I certainly know plenty of type designers, book designers, and typography professors who are not in favor of cap eszett use.</p>
      <p>&gt;<em>How many foundries include it in all new fonts as a matter of course?</em></p>
      <p>Well, I work at the largest foundry in the country, and we do not include these new glyphs in all new fonts as a matter of course. In fact, we include them in hardly any new fonts. There are a few fonts with them now, but only because the type designers behind the fonts wanted to include them. Otherwise (in the majority of cases, in fact), they are not part of the character set. Some of the type designers that I work with are actually relieved about this, because they are not in favor of the cap eszett yet either, and do not want to have to draw them just for the sake of character set completion.</p>
