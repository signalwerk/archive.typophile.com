    html: |-
      <p>The glyph should be accessible through the "smcp" feature of the font: </p>
      <p><code>feature smcp {<br>
        sub a by a.smcp;<br>
        sub b by b.smcp;<br>
        ...<br>
        sub germandbls by germandbls.smcp;<br>
        ...<br>
      } smcp;</code></p>
      <p>(As should all the other small-cap letters). </p>
      <p>In InDesign, it would be accessible through the "Small caps" option in the Character palette. I'm not aware of any situations where InDesign would perform some behind-the-scenes additional operations when applying small caps. </p>
      <p>In addition, you'll probably want to have the "c2sc" feature in your font which maps uppercase letters to the small-cap variants. You can choose to create an additional set of small cap glyphs for those (identical in shape but with different glyph names, so a small-cap "A" would exist in the font as "a.smcp" and as "A.c2sc") or you could just use the same set (named whatever you wish). </p>
      <p>If you go with the separate sets, then the small-cap ß would exist as "germandbls.smcp" and as "uni1E9E.c2sc", and the code for "c2sc" would be then: </p>
      <p><code>feature c2sc {<br>
        sub A by A.c2sc;<br>
        sub B by B.c2sc;<br>
        ...<br>
        sub uni1E9E by uni1E9E.c2sc;<br>
        ...<br>
      } c2sc;</code></p>
      <p>Cheers,<br>
      Adam</p>
