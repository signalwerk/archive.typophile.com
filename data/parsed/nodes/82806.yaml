      <p>The strongest argument I have heard in favour of the new Unicode character, from a German, is that it enables reliable one-to-one round-trip case mapping, which is desirable in data management for things like e.g. passport control. There are apparently some German names in which a distinction between ß and ss is critical, and different government agencies store names in all uppercase or in mixed case.</p>
      <p>Of course, this has nothing to do with the design of the glyph, but only with the existence of the distinct codepoint for an uppercase eszett, which might ostensibly be displayed as /SS/.</p>
