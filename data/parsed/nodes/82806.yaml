    <p>I've been working on the specimen booklet for my graduation typeface (part digitisation of Manuscript Antikva, part stylistic extrapolation), and have run into the curious situation of not being able to use one of my designed characters.</p>
    <p>As Adam Twardoch mentions <a class="freelinking external" href="http://typophile.com/node/33647" rel="nofollow">here</a>, uppercase ß will still map to SS. Oddly, however, InDesign CS5 allows me to input the capital Eszett just fine. However, the small-caps variant is seemingly impossible (I've attached a screenshot of the usual situation upon insertion—small-caps SS). I can only think of placing it in the Private Use Area, but I'd rather not. So, in short, how can I access the actual glyph at codespace uni00DF.sc without InDesign telling me what it's supposed to be?</p>
