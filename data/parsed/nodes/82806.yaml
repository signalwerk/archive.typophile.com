      <p>Thanks for all the replies! I'm pretty sure Andreas is actually outlining what I'm saying: InDesign has it hardcoded, and that makes it impossible to input. To check up on my sanity, here is the OpenType in place:</p>
      <p><code><br>
      @LC_ALPHA = [a-z germandbls];<br>
      @UC_ALPHA = [A-Z uni1E9E];<br>
      @UC_SMCP = [A.sc-Z.sc uni1E9E.sc];</code></p>
      <p><code>feature c2sc {<br>
        sub @UC_ALPHA by @UC_SMCP;<br>
        sub @LC_ALPHA by @UC_SMCP;<br>
        sub @LC_PUNCT by @SMCP_PUNCT;<br>
        sub @PNUMS by @SCNUMS;<br>
        sub @ONUMS by @SCNUMS;<br>
      } c2sc;</code></p>
      <p>(I realise I'm conflating c2sc and smcp; that's laziness, and will be resolved as soon as I get to the final designs.)</p>
