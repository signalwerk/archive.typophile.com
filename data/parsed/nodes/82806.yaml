      <p>I agree with Ralf. There is also a strong linguistic reason for having an “uppercase ß” (<strong>U+1E9E</strong>, ẞ) adopted widely: </p>
      <p>In the pre-1996 German spelling, the basic principle for writing consonants after a vowel was:<br>
      — if the vowel is long, write a single consonant (in “Bote”, the “o” is long)<br>
      — if the vowel is short, write a doubled consonant (in “Gott”, the “o” is short)</p>
      <p>This was a very reliable rule, that also applied to “s” and “ss”, e.g. in “Mus”, the “u” was long, and in “Masse”, the “a” was short. The only exception was “ß” where the behavior was “undefined”. If “ß” followed a vowel, you never knew whether the preceding vowel was long (as in “groß”) or short (as in “muß” or “daß”). The reader needed to “memorize” the pronunciation. So “ß” was viewed as an ambiguous letter that was either “single” or “doubled” depending on the context. This was correct historically, because “ß” was originally a doubled letter, and then a ligature. </p>
      <p>But in the 1996 spelling reform a rule was introduced, which has been kept up in the 2006 “reform of the reform” that “ß” is a single letter. So all situations where the preceding vowel was long kept the “ß” (“groß” is the new spelling) while in all the situations where the vowel was short, the “ß” was replaced by “ss” (“muss”, “dass” is the new spelling). </p>
      <p>So now, German is written very logically, and the single-or-doubled consonant rule is reliable. But this has repercussions. </p>
      <p>All the readers who grow up with the new spelling, or adopted it quickly (such as myself) rely on the rule blindly. In the words “Rußpartikel” or “Großenkel”, it is absolutely obvious that the vowels preceding “ß” are long. It’s automatic, there is no doubt about it. </p>
      <p>So, “ß” <strong>is</strong> a single letter. </p>
      <p>But hang on... Not when the word is written in uppercase! When I convert the word to uppercase using the currently valid rules, I get “RUSSPARTIKEL” or “GROSSENKEL”, and then the acquired reading automatism <strong>forces</strong> me to think that the “U” vowel in the first word or the “O” vowel in the second word is short. So I mispronounce the words. </p>
      <p>This of course is most problematic for personal names, where you don’t really know a “memorized” pronunciation. “Frank Mussmann”: “u” is short, of course. “Frank Mußmann”: “u” is long, of course. But “FRANK MUSSMANN”? “Well of course, the U is short”, says my reading automatism. But I may be wrong! </p>
      <p><strong>If</strong> “ß” is a <strong>single letter</strong> now, why is its uppercase representation a doubled letter? That’s now (<strong>after</strong> the 1996-2006 reforms) <strong>less</strong> logical than it was before. It’s now completely counter-intuitive. </p>
      <p>So I strongly presume that the reason why the case conversion rules were not changed in 1996 or 2006 was <strong>purely technical</strong>. I.e., there was no technical means to represent a “more logical conversion”, because the uppercase “ß” character was not codified or even “invented”. </p>
      <p>Andreas Stötzner’s Unicode proposal has resolved this barrier. The Windows 7 versions of the Microsoft core fonts (Arial, Times New Roman etc.) have been revised to include the U+1E9E character (ẞ), and more and more fonts are coming out that include it. A <a href="//new.myfonts.com/search/char%3A%E1%BA%9E/fonts/”" rel="nofollow">search at MyFonts</a> reveals 106 families that include the uppercase ß character. Not many, but I’m sure more are coming. </p>
      <p>So we’re in a technical transitional period now. Just like with the Euro currency character, the technical support needs to be there first (fonts and keyboard layouts), but at some point people will be adopting ẞ more and more widely — because it’s the <strong>only logical thing</strong> to do. </p>
      <p>Arguments against it are based purely on tradition and history. Arguments for it are based on linguistics, pragmaticism, logic and practicality. Go figure who will “win” in the longer term :)</p>
