      <p>I'm not really advocating any particular design solution, I'm just suggesting a coding solution. </p>
      <p>The decision what kind of shape to put as a small-cap ß which is intended to work in "smcp" is up to the designer. I mean, whether your "germandbls.smcp" looks like a small-cap version of the uppercase "ß" or if it's a smallcap "ss" is a design decision. But the code I've given will work either way.</p>
