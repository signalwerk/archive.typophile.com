      <p>Yes, in InDesign, "all small caps" invokes both "smcp" and "c2sc". </p>
      <p>Also, I tested the substitution: </p>
      <p>feature smcp {<br>
        sub germandbls by germandbls.smcp;<br>
      } smcp; </p>
      <p>in InDesign CS5 Middle East on Mac OS X, and it I found that when using the "Paragraph Composer", then "ß" is indeed converted to "ss" before "smcp" is applied, while when using the "World-Ready Paragraph Composer", germandbls is indeed being substituted directly. </p>
      <p>My guess is that when using "Paragraph Composer", when the "Small Caps" is applied, InDesign converts all lowercase text in the string to uppercase, and then to lowercase again, using the Unicode case mapping rules, and the "smcp" feature is applied after that. When using the "World-Ready Paragraph Composer" is used, the "smcp" feature is applies without any preprocessing. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/smcp-germandbls_6401.png"></div><p></p>
