    <p>Bak Dergisi'nin 5. Sayısı Yayında<br>
    <a href="http://www.bakmagazine.com" title="http://www.bakmagazine.com">http://www.bakmagazine.com</a><br>
    İnternet üzerinden yayınlanan görsel sanatlar dergisi Bak, 5. sayısıyla karşınızda.</p>
    <p>Bak Dergisi'nin yeni sayısında dünyaca ünlü sanatçı Gottfried Helnwein, usta yazı tasarımcısı Oded Ezer, reklam dünyasının duayenlerinden Hakkı Mısırlıoğlu ve tecrübeli karikatürist Ercan Akyol'un yanısıra genç tasarımcılar Adhemas Batista, Thomas Schostok, Volkan Ekşi ve Can Pekdemir'in röportajları yer alıyor.  Dergide ayrıca "20. Yüzyılda Tipografi Eğilimleri" konulu bir araştırma yazısı ve görsel sanat içerikli iki kitabın incelemeleri bulunuyor.</p>
    <p>5th Issue of <a href="/wiki/Bak%20Magazine" class="freelinking" rel="nofollow">Bak Magazine</a> is Online<br>
    <a href="http://www.bakmagazine.com" title="http://www.bakmagazine.com">http://www.bakmagazine.com</a><br>
    5th issue of the international visual arts e-magazine Bak is online.</p>
    <p>This time, Bak is hosting the world famous fine artist Gottfried Helnwein, well known typographer <a href="/wiki/Oded%20Ezer" class="freelinking" rel="nofollow">Oded Ezer</a>, experienced Turkish advertiser Hakki Misirlioglu, talented caricaturist Ercan Akyol and four young graphic designers, Adhemas Batista, Thomas Schostok, Volkan Eksi and Can Pekdemir.  An in-depth research about the typography trends in 20th century and two special book reviews can also be found in the issue.</p>
