      <p><cite>The cost of living is much higher in the UK. Petrol, for instance, and housing.<br>
      Why should fonts be different?</cite></p>
      <p>It is not a cost of living issue... The price of FF Scala (single weight) is 40 euros also for Italy and other Euro-Zone countries. FontFont have a pricing policy based on the equation 1 Euro = 1 Dollar. In fact the euro is much stronger against the dollar (check <a href="https://web.archive.org/web/20081011161633/http://www.xe.com/" title="www.xe.com">www.xe.com</a>) so European FontFont customer pay more for the same stuff ):<br>
      In my opinion their pricing policy is not fair.</p>
      <p>What if a European customer buy online directly from FontFont US?</p>
