      <p>&gt;in my opinion their pricing policy is not fair.</p>
      <p>There is nothing unfair about selling a product for a different amount in different markets.<br>
      It is a marketing strategy — take it or leave it.</p>
      <p>The fact is, fonts are underpriced in the US market, which is why FontFont has to cut its prices to participate there. This is not news, but has been happening since before e-commerce.  </p>
      <p>&gt;it is not a cost of living issue</p>
      <p>Of course it is. Otherwise known as standard of living. Companies set product prices for particular countries based on what the local conditions are. They charge what they think the market will bear. </p>
      <p>For instance, Quark XPress wil cost you £700 in the UK, $1000 in the US.</p>
      <p>Obviously, graphic designers make a lot more money in the UK than they do in the US!</p>
