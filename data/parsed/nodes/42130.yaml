    <p>I'm working on a project for a client starting from scratch on his whole LOOK and feel. We've revamped the logo to be more elegant. I've changed the colors for a more elegant feel. i've spent over 70 hours on the press kit, the collateral, credit card designs, 3-d materials and so on... finding the perfect fonts. etc. its pretty far along. </p>
    <p>I get an email this morning from the web developer who is working on the website, wondering if we should use the same fonts (his fonts) for cohesiveness throughout all the projects. I'm kind of perturbed. As the brand manager of this client i just feel a bit miffed right now that everything should change to a font that i don't want to use. but i'm not sure i'm correct.</p>
    <p>My arguement is print is not web. the avenues are different. He is using Gotham. for i guess the headers and some copy areas. The website is a retail site. it will forever be changing. My recomendation is to keep all things cohesive thru photography/color/style I've got Rotis family as my font in the collateral. And as the new tag line. and i was going to have it on the identity package.</p>
    <p>Do i treat the identity package the exact same as the collateral? and then the exact same as the website? this person seems to think i should.</p>
    <p>Should we be swapping things out to make it all the same? Brand identity stems from the logo and then the fonts chosen for the elements that go into the identity. but does that always include the collateral? should it include the website?</p>
    <p>i know the problem lies in that we didn't coordinate at the outset. but honestly i hadn't a clue there was another person working on the project. I usually would be the one to design the LOOK of the website and then pass that along. and issues of consistency were never at issue.</p>
    <p>I need some guidance here. what do you all do? or how i might address this? I don't have a problem revamping the letterhead and business cards to match, but i do have a problem with making the collateral (all 30+ pieces) change. The look is established. The client loves it. Now with this email it could all change? I need help is my arguement as to what i should do. or why it doesn't have to change. (or if you think it should).</p>
    <p>thanks so much,</p>
