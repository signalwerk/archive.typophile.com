      <p>"As the brand manager of this client i just feel a bit miffed right now that everything should change to a font that i don’t want to use. but i’m not sure i’m correct..."</p>
      <p>I think you certainly are. The whole point of a brand look and feel is to ensure that there is consistency across different delivery channels. The brand typeface is probably the most important component of a brand identity program. Gotham and Rotis are so different that it would certainly result in a disconnect between the website and everything else. </p>
      <p>It is standard practice in large identity program to have an alternate web-core font for on-screen applications: from corporate corespondence and powerpoints to very often, html text in websites. In other words for applications that may be viewed in computers that may not have the primary brand typeface installed. Here however, that obviously does not apply. If Gotham is being used, it can't be a html site. </p>
      <p>'I need some guidance here. what do you all do? or how i might address this?''<br>
      Well, it would help a lot if you have created some kind of brand documentation. Typically when brands are designed, some form of guidelines are created, the idea of which is to ensure that everyone else who handles different components of the brand, adhere to the outlines of the program. This would normally have a section on typefaces that articulates what typeface to use, how and some form rationale for the choices. It would also have a set of DO NOT examples. If you don't have one yet, you could quickly put one together and use that as a basis for arguing your case. There are a lot of useful resources on guidelines <a class="freelinking external" href="http://www.identityworks.com/tools/guidelines_and_standards_manuals.htm" rel="nofollow">here</a>.</p>
