      <p>It's possible to create brands that are typeface-independent, and in fact some font businesses do that, e.g. FontShop.</p>
      <p>When I worked for Raymond Lee and the National Ballet was our client, Ray would use just about any classic-style serif type--but he had a way of keeping the look consistent. That's easier to do in a small shop with one creative director with a lot of style, harder when relying on a manual.</p>
