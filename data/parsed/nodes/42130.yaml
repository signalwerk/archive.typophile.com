      <p>Setting aside my deep dislike for Rotis...</p>
      <p>Have you brought this up at all with the client? There is a strong argument for using a serif font for any body copy in the collateral. While Gotham and Rotis are not exactly a match made in heaven, you could put selected elements if the identity package and perhaps the collateral into Gotham to tie it in with the look of the web site. Perhaps the web developer could bring Rotis into his design a little too.</p>
      <p>More people will probably see the site than the collateral, so I think you don't want your materials to look too different, as said by both commenters above. </p>
      <p>It seems to me the client should have managed this better. It's pretty crazy, if you're the brand manager, that the web developer got as far along as he did without consulting you on his font choices.</p>
