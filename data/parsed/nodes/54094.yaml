      <p>Optima works well with Palatino, also by Zapf. The amazing thing about this whole group (Optima, Palatino, Michaelangelo, Sistina, Kompakt, Gilgenhart, Phidias Greek, and ultimately Aldus) is that they ALL work together. </p>
      <p>I do not have any problems with Optima, other than overuse, like others. It functions very well, and now that they have expanded the face to include condensed versions and additional "approved" weights it will endure... even if it displeases other type designers. </p>
      <p>Yeah, it's easy to trash, by some, (a lot of times I think that is nothing more than gang mentality) but it has endured for 50 years : )</p>
      <p>Michael</p>
