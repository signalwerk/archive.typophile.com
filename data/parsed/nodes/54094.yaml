      <p>Marcel</p>
      <p>I lectured last evening at VCU to a gathering of illustrators. I told them that I too was an illustrtor... I just use "stick figures" : )<br>
      I.e. the alphabet. I explained that the alphabet, from my perspective, is simply a skeleton, a very pliable one (from a lettering artists perspective)... I concentrate on the exoskeleton to infuse meaning.</p>
      <p>Most Sans too me are sterile revisionist forays into technological and reading efficiency. On the other hand there is Optima with personality. An undeniable touch of the hand. I know I am extremely biased. I don't apologize for it. And try to not be too antagonistic anymore.</p>
      <p>And certainly Optima is not suited for everything. I love Universe, Poppl Laudatio (which you probably would not like), and some other sans that are very quirky. I mix them all the time with my lettering. Most times I draw my own sans.To me it all comes down to suitability. </p>
      <p>But I would never use Helvetica and I won't rent the movie. Period :&gt;)</p>
      <p>Michael</p>
    html_clean: |-
