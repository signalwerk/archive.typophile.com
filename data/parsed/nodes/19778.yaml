      <p>&gt; Can ‘ccmp’ and ‘liga’ be applied together</p>
      <p>Any features can be applied together. In such case, the order of the lookups in the font decides which substitutions or positionings are applied first. </p>
      <p>But what do you want to put into the liga feature? A + uni0302 is not really a substitution that should be placed in the liga feature because Acircumflex is not a ligature. If you intend to hack the OpenType spec, of course you can still do it but keep in mind that your font will considered a hack. </p>
      <p>&gt; Do some display the precomposed forms instead of<br>
      &gt; the composed ones when not advanced feature is applied?</p>
      <p>Yes, some applications apply the Unicode canonical composition process on the text string level, i.e. before the OpenType Layout processing is triggered. Some applications may also perform canonical reordering. </p>
      <p>Also keep in mind that "ccmp" can be realized through substitutions but you can also add "mark" and "mkmk" features that position diacritical marks through GPOS. Your "ccmp" will be supported in a larger percentage of applications, e.g. TextEdit on Mac OS X 10.4 or InDesign non-Middle East while "mark" will be supported only in savvy applications e.g. Notepad on Windows XP SP-2, Word or InDesign Middle East. </p>
      <p>A.</p>
