    <p>I'm working on fonts that should support a maximum of accented characters (precomposed and composed). What's the best way to use OpenType features to avoid making smallcaps, etc. of every accented character (if that's possible)?</p>
    <p>Can 'ccmp' and 'liga' be applied together on each precomposed character to get composed variants when applying features such as 'c2sc', 'smcp', etc.?<br>
    How do font renderers handle 'ccmp' and 'liga' when together?</p>
    <p>The test program (TrueTypeViewer) shows the desired behaviour. For example Â (Acircumflex, ccmp: A + uni0302, liga: A + uni0302) is always rendered as Â (circumflex) when the default 'ccmp' and 'liga' for latn are enabled. When applying 'c2sc' the desired composed smallcap Â (A.small + uni0302) is displayed.</p>
    <p>Would this work on most systems? Do some display the precomposed forms instead of the composed ones when not advanced feature is applied?<br>
    How do you deal with advanced features for tons of precomposed characters?</p>
