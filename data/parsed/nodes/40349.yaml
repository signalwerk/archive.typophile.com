  html: <p>A <strong>beak</strong> or <strong>beak terminal</strong> is an angular spur-shaped terminating device occuring on some characters, typically <strong>a c f</strong> and <strong>r</strong>. Typically found in 20th century <a href="/wiki/roman%20type" class="freelinking" rel="nofollow">Romans</a> and <a href="/wiki/Italic" class="freelinking" rel="nofollow">italics</a> such as Perpetua and Pontifex.</p>
