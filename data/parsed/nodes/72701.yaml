    html: |-
      <p>I looked in some old Photo-Lettering catalogs and nothing looked particularly close. It's hard to define this style, because it has Art Nouveau-like curves, yet the S is not very typical of Nouveau lettering I have seen. Stephen mentioned 'tiki' and I guess I see that, but I couldn't find many examples that were not the current crop of digital ones.</p>
      <p>- Mike Yanega</p>
