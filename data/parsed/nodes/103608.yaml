      <p>Hola Bendreski, estoy en la misma situación, por el momento lo que atino a comentar es guiarse con algunas fuentes que ya traigan incluidas las extensiones para cirílico, griego y latina, las fuentes Calibri, y Cambria, que por lo general vienen en el sistema operativo, pueden ser una gran ayuda.</p>
      <p>Tener en cuenta cuando se vaya a generar la fuente, incluir que soporte además de Latin1, Latin2, las demás opciones a cada idioma.</p>
      <p>Por el momento estoy también indagando acerca de métodos de espaciado y kerning para cirílico y para griego. Cualquier cuestión que pueda ser compartida, será también de gran ayuda.</p>
      <p>Saludos</p>
      <p>JVB</p>
