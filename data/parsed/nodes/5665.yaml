  html: <p><b>"A History of American Penmanship", with Robert Hurford</b> <br> <br>Wednesday, July 21st, 2004 at 6:00 p.m. <br>The Grolier Club, 47 East 60th Street, New York, NY <br> <br>Robert Hurford will discuss handwriting and education from Colonial times to the present. He will share with the audience digital slides, samples and a pen-and-ink demonstration. <br> <br>Mr. Hurford is a graphic artist and historian of the Golden Age of American Penmanship. An active member of the International Association of Master Penmen, Engrossers and Teachers of Handwriting (IAMPETH), Association for the Calligraphic Arts, and Society of Scribes, he is also editor of IAMPETH's own magazine, <i>IAMPETH Penman's Journal</i>. <br> <br>Free and open to the public. <br>Light refreshments will be served. <br> <br>Sponsored by the Society of Scribes, The Grolier Club and Type Directors Club. <br> <br>More information at <a href="http://www.tdc.org/events/2004events/2004grolierhurford.html">the TDC website</a>.</p>
  html_clean: <p><b>"A History of American Penmanship", with Robert Hurford</b> <br> <br>Wednesday, July 21st, 2004 at 6:00 p.m. <br>The Grolier Club, 47 East 60th Street, New York, NY <br> <br>Robert Hurford will discuss handwriting and education from Colonial times to the present. He will share with the audience digital slides, samples and a pen-and-ink demonstration. <br> <br>Mr. Hurford is a graphic artist and historian of the Golden Age of American Penmanship. An active member of the International Association of Master Penmen, Engrossers and Teachers of Handwriting (IAMPETH), Association for the Calligraphic Arts, and Society of Scribes, he is also editor of IAMPETH's own magazine, <i>IAMPETH Penman's Journal</i>. <br> <br>Free and open to the public. <br>Light refreshments will be served. <br> <br>Sponsored by the Society of Scribes, The Grolier Club and Type Directors Club. <br> <br>More information at <a href="http://www.tdc.org/events/2004events/2004grolierhurford.html" class="link-external">the TDC website</a>.</p>
