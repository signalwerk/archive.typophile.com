      <p>I'm not sure about background layers, never use them, but you could use the font-to-mask tool. Just keep your reference font open and it copies either selected glyphs or the entire font onto the mask layer. Here's the icon for it.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Picture-1_3739.gif"></div><p></p>
