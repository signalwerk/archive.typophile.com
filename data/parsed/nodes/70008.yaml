      <p>I think Sharon Jones is <a href="http://www.fontshop.com/fonts/singles/bitstream/decorated_035/?&amp;sample_text=SHARON%20JONES&amp;update=0" rel="nofollow">Decorated 035</a>, the Bitstream name for an older typeface whose name I forget at the moment. If you make the outline color the same as the shadow color I think you get the same look.</p>
      <p>The sans may be Futura.</p>
      <p>- Mike Yanega</p>
