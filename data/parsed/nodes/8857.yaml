    <p>I would like to learn the basics of type design and I hope to design some typefaces of my own someday. I'm trying to decide between the following books... <br> <br>- "The Elements of Typographic Style" by Robert Bringhurst <br>- "A Type Primer" by John Kane <br>- "Type and Typograpy" by Phil Baines and Andrew Haslam <br> <br>What would some of you recommend? I'm thinking Bringhurst's book is the most thorough and comprehensive of the three...</p>
