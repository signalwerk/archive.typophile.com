    html: |-
      <p>I'm looking at the /a/ and /g/ and I still say likely typewriter. It's not hand-lettering, of course the lettershapes are roughly the same, but look at the bowl of the two /g/s, the lower portion of which is noticably differently thick. For the /a/s, the very first /a/ has been struck lighter than the rest, the second and third heavier.</p>
      <p>Have you got a sample of the anniversary book text?</p>
