    html: <p>I have a feeling these are produced on an actual typewriter and using actual stencils respectively. Slight imperfections, bleed, differences in the same letter at different sizes...</p>
    html_clean: <p>I have a feeling these are produced on an actual typewriter and using actual stencils respectively. Slight imperfections, bleed, differences in the same letter at different sizes...</p>
  - id: 476396
    user: 176670
    date: 2011-09-06T06:10:00
    date_raw: 6 September 2011 - 6:10am
    votes: null
    html: <p>You could be right for the stencil font because on a lot of photos you can see that they used real stencils. As you said, imperfections and »bad kerning«. But in the book for their 20th anniversary you can see that the font is set digitally (it could also be a custom font, of course). And for the typewriter I think the letters are pretty much the same, take a look at the a and the g for example. This one is definitely digital.</p>
