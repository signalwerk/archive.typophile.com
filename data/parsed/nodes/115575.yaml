  html: |-
    <p>MIT did some testing on how long people looked at dashboard type to read it. They found humanist type more readable than geometric. They have narrower glyphs than geometric, based on circle-my take. Also Verdana, if that's what they used, has better spacing. </p>
    <p>Congrats to Carl Crossgrove!</p>
    <p><a class="freelinking external" href="http://www.fastcompany.com/3028665/most-creative-people/introducing-burlingame-a-safer-font-for-your-dashboard?partner=newsletter#4" rel="nofollow">Here is an article on it.</a> It's in the third slide. </p>
    <p>I would like to see a comparison to Clearview Highway, which used distance thresholds, as well as time, I believe.</p>
