    html: <p>I agree with Randy, in that the B&amp;W version will require much darker tints than what you can do with color. I would print no less than 30% black, but I still think tints are acceptable. I have been limited to 1-color (black) designs on many occasions where tints have drastically improved the versatility and appeal of the subject. <br> <br>Aloha! <br>Scott</p>
