    html: <p>Very nice, although a bit ideographic, I don't know if there is any specific meaning you associate with the visual sign. The light blue might prove difficult in print technically and also might be a problem to read in outdoor applications, like on posters etc, depending on the light and reading distance. Meta, imo, is quite unused these days, and with its heyday gone, I feel one can use it again without being to me-too. The fi, despite there not being a REAL ligature in the font itself, as Spiekerman kept the i-dot and the f apart, should be remodelled to a real ligature, perhaps. It would add a nice touch of individuality to the typography. But at the very least you should use the ligature provided with the Font. </p>
