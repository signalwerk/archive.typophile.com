  html: <p>hi everyone, <br> <br>I am new to this discussion area but decided to give it a try. Here is a logo for FinnAgora. Comments are welcome. <br> <br>The organization is a Finnish Institute in Budapest. Main focus on delivering culture and science projets from Finland to Hungary and developing a contact network for these in Budapest. The main idea behind the design is a snowflake with movement. The dots create networks which communicate to the outside. I know typography (Meta) is a bit pass</p>
