    html: <p>How much faxing does this particular company actually do, and how purposeful are the faxes in relation to the corporate identity. For example legal and real estate professions utilize faxing as a prominent means of communication, whereas, most retailers do little to no faxing and the faxing they do may only be internal...Not to say that internal identity is not important, but the perfection of logo output via fax may not be detrimental. <br> <br>If possible, I would go with the tints. The outlined/stroked version says bubbles or maybe I envision an automatic tennis ball dispenser simultaneously shooting multiple balls at my face. <br> <br>Aloha! <br>Scott</p>
