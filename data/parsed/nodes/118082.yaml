    html: |-
      <p>Ryuk, good call for a similar _G_ from Carlton. It also has a similar top overhanging _A_ as an alt. Letraset got its design -- according a predigtal Letraset catalog -- from Stephenson Blake. The original is Ehmcke Antiqua by Fritz Helmut Ehmcke 1908.<br>
      Don</p>
