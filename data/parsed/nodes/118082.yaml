  - id: 583378
    user: 205259
    date: 2014-07-18T14:36:00
    date_raw: 18 July 2014 - 2:36pm
    votes: null
    html: |-
      <p>Looks like a ransom note where letters from fonts of different widths but the same caps height, and a lowercase _e_ expanded to the caps height, were carefully lined up to make words. Note that some letters such as _A_, _M_ and _R_ come in both wide and narrow widths.<br>
      Possibly the capitals are from the same font and were severely compressed in some cases but not in others.<br>
      Don</p>
