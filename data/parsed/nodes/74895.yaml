      <p>Thanks for the thoughts Marcin! I think you are correct on all accounts, although this was just a rough test. This bold is really just too bold; no one in their right mind would use it in text, unless they were already using an ultra weight in text and needed a bold emphasis. That said, I think a little bolder than the 5% interpolated test would make a good bold for normal use, but like you said, testing in a block of text would be my best bet for the bold weight.</p>
      <p>I think I'll still have the "Way Too Bold" version, but I might close up the counters a but more, and definitely shorten those serifs. Even then it might still be too bold, and I will probably need to make the stems a little thinner.</p>
