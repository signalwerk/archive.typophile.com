      <p>A quick test. Hairline to ultra.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/1_5797.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/2_3445.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/3_3727.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/4_6394.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/5_3728.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/6_3883.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/8_4769.png"></div><p></p>
      <p>I used 4 masters: Hairline, Regular, Black, &amp; Ultra. I could have omitted the Regular, but that gave me a bit more control to the forms. As it stands, interpolation between Hairline &amp; Black works.</p>
      <p>Please note the weights aren't positioned along optimal points in the system - I just did 50% between each master.</p>
