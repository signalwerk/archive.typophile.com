    html: |-
      <p>I am not a type designer, so don't take too serious what I'm going to write. But...<br>
      Probably, you should rethink your Ultra. As it is very wide, you don't need such long serifs, which only accentuate the horizontal axis. They're diagonal, so their corners will be visible this way or another. I mean, if you close the inner space, serifs could be shortened as well.</p>
      <p>The a and s have similar terminals in the regular weight, but different in the ultra. Refine all ultra glyphs first, check them in text; then interpolate.<br>
      It is very easy to find wrong ultra letters in printed text, because they will look like heavy black dots, or grayish crocks.</p>
      <p>The best way (in my opinion) to find the bold, is to insert single words and longer sentences into a page set with your regular. One copy for one intermediate. Then you can show these pages to your friends, and probably they won't say "this" or "that", but something like "it should be between this and that". Then you decide.</p>
