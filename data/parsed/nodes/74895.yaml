    html: |-
      <p>Thanks for your comments Marcin! You've encouraged me that more weights can be very useful! I suppose my reasoning is that, except for a few situations, I don't even use bold weights, just semibold. But I think there are certain aspects of using different weights that can be a very big plus. I definitely think you are right about "wayfinding emphasis", I have just never designed anything as complex as that.</p>
      <p>For everyone interested, I've searched Typophile for "Interpolation", and managed to find these bits in a thread on interpolation and light weights:</p>
      <p>Hrant's interpolation reccomendations:<br>
      <em> 1) Make a midling weight that looks good for text.<br>
       2) Make a Bold "candidate" (maybe using auto-weight-gain + mucho tweaking).<br>
       3) Extrapolate the lightest and darkest extremes.  <br>
      4) Clean up the extremes real good.<br>
       5) Make new intermediates and compare against the originals.  <br>
      6) Tweak only the extremes to make any new intermediates come out good, dumping the original intermediates. </em></p>
      <p>How Tim Ahrens interpolates:<br>
      <em>1) Prepare an ultralight (maybe even stroke weight 0) monochrome weight.  <br>
      2) Extrapolate the extrabold. This will be too "proportional", i.e. the stroke weight is constant, makeig a and e too bold.  <br>
      3) Modify and clean up the extrabold.  <br>
      4) Re-interpolate the regular wight.  <br>
      5) Create an MM font with the "true" regular and the interpolated regular wight.  <br>
      6) Extrapolate a "triple true" regular (truer than true!). Now you can see what makes the true regular true and make conscious decisions about that. I think the most important thing with designing is that you do everything consciously.  <br>
      7) clean up the triple true and re-interpolate the true regular.   </em></p>
      <p><em>When I generate the final instances I put all three weights in one MM font. The semibold is not only an interpolation between regular and bold but I add a certain amount of extrapolation (regular and light).<br>
       The reason for this is that a point does not move on a straight line on its way from light to bold (that is why we need a true regular). However, it should not move on a line with a kink at the regular weight. It should move on a curve instead. So the semibold will not be on the direct line between regular and bold.  I usually prepare an Excel diagram that shows the amounts of light, regular and bold in all the instances. Again, the graphs schould not have kinks. The semibold usually has about -10% of the light weight, 60% regular and 50% extrabold. </em></p>
      <p>From James Montalbano:<br>
      <em>To make a bold ya gotta move either east or west.</em></p>
      <p>I think James' comment really speaks volumes about bolds in some ways, at least, Frutiger used this method, and it worked wonderfully:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/frutiger_6576.jpg"></div><p></p>
      <p>This seems like an incredibly good and simple solution; the problem is that a bold really wants to be a little more condensed than a regular, for two reasons: 1) To make a bold really be "bold", the space inside should probably be closed up more, 2) the bold should be a bit condensed in order to not be a large amount wider than the regular.</p>
      <p>But an improvement in speed and  "visualization" of the process can be made with this method</p>
      <p>1) Creating an ultra weight using this method<br>
      2) Creating condensed versions of both the ultra and regular by</p>
      <ul>
      <li>squishing both versions to say, 80% width</li>
      <li>interpolating/extrapolating the squished regular and squished ultra to get proper stem widths</li>
      <li>tweaking if necessary</li>
      </ul>
      <p>3) Interpolating with the condensed version to get the proper Ultra width<br>
      4) Determining the bold weight by interpolating between the regular ultra<br>
      5) doing necessary tweaking</p>
      <p>I think Superpolator could also help this out, I'm planning on purchasing that as soon as possible.</p>
