      <p>20%<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/neuton20_5459.png"></div><p></p>
      <p>40%<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/neuton40_6152.png"></div><p></p>
      <p>80%<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/neuton80_5327.png"></div><p></p>
      <p>100%<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/neuton100_6580.png"></div><p></p>
      <p>The problem is, with letters like s, a, and e, the structure and thickness has to be changed too much, and so the  intermediate weights suffer. Probably, a little above what is 50% interpolated in this test would be about the boldest I can feasibly go and have it interpolate well. I could, of course, make another master, and go all the way, but I can't go the far with just on bold master.</p>
      <p>I feel I have overcome something great. I also learned that you have to make the starting point the same on each glyph.</p>
