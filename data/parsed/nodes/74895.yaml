    <p>I don't know if there is a topic for there or not, but I'd like to know how you all handle multiple <a href="/wiki/weight" class="freelinking" rel="nofollow">weights</a>, such as the <a href="/wiki/bold" class="freelinking" rel="nofollow">bold</a>, if there are any routines you go through with it, or anything peculiar to note. If there are a few aspects about doing bold and multiple weights, maybe it'd be nice to see a little discussion?</p>
    <p>The only thing I could think of that covered how to make a bold was the type design notes at <a class="freelinking external" href="http://briem.net" rel="nofollow">Briem's site</a>. Any other resources?</p>
    <p>I have made a quick image showing how Minion and Scala do their weights, I might make one for sans serifs later. Are there any fonts to note which take a particularly interesting stance on multiple weights, or are especially lovely in that respect?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/weights_3868.png"></div><br>
