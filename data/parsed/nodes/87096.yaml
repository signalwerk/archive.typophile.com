    <p>Hi!<br>
    I´m going to design a sign that is going to be painted on a wall.<br>
    I want to use a font as the one used in these images:<br>
    <a href="http://forumbilder.se/show.aspx?iid=ff4201150632P7989" title="http://forumbilder.se/show.aspx?iid=ff4201150632P7989">http://forumbilder.se/show.aspx?iid=ff4201150632P7989</a><br>
    <a href="http://forumbilder.se/show.aspx?iid=994201150708P02e3" title="http://forumbilder.se/show.aspx?iid=994201150708P02e3">http://forumbilder.se/show.aspx?iid=994201150708P02e3</a></p>
    <p>Any suggestions for something similar?</p>
    <p>I´ve been looking at for example:<br>
    <a href="http://new.myfonts.com/fonts/urw/criterion/urw-t-extra-bold/" title="http://new.myfonts.com/fonts/urw/criterion/urw-t-extra-bold/">http://new.myfonts.com/fonts/urw/criterion/urw-t-extra-bold/</a><br>
    <a href="http://new.myfonts.com/fonts/tilde/clarendon/bold-condensed/" title="http://new.myfonts.com/fonts/tilde/clarendon/bold-condensed/">http://new.myfonts.com/fonts/tilde/clarendon/bold-condensed/</a></p>
    <p>But still not what I´m after, any better suggestions?<br>
    Thanks!<br>
    G</p>
