    html: <p>I have been three times at La Scala, <br>but only after its rennovation and transferring <br>to the new Teatro degli Arcimboldi, <br><a href="http://www.teatroallascala.org/eng/arcimboldi/index.htm" target="_blank">http://www.teatroallascala.org/eng/arcimboldi/index.htm</a> <br>The 3D typography ("Teatro degli Arcimboldi") out of the <br>building is designed (I think) with Bruce Rogers' Centaur. <br> <br>&gt; How do you cellebrate there? <br>A friend from Poland, Dorota, sent me a DVD, <br>"Czesc Tereska" ("Hi Teresa"). <br><a href="http://www.iofilm.co.uk/fm/h/hi_tereska_2001.shtml" target="_blank">http://www.iofilm.co.uk/fm/h/hi_tereska_2001.shtml</a> <br><a href="http://www.rottentomatoes.com/vine/showthread.php?t=329449" target="_blank">http://www.rottentomatoes.com/vine/showthread.php?t=329449</a> <br>I have seen it in Polish, with English subtitles, <br>I have seen it at my sister`s, while my sister <br>and her family took a walk somewhere on the hills. <br>I was fussing, that movie it is romantic but hopeless, <br>it is one of the best film I have ever seen. <br>I had my birthday cake with all my family, <br>a cake with strawberries and slices of banana, <br>it was really good. <br> <br>Today, in the afternoon, I took the bike and went downtown, <br>just to buy my favorite tobacco, "Van Nelle." <br>There, one the way back, I met my good friend Alberto, <br>and it was really nice to talk with him. <br>We planned a bike trip (we both ride racing bikes, <br>but this year, nor me or him had the time to train). <br> <br>Here is my grazie, set in Ernesto Hemingway, <br>the typeface family I designed for my MA thesis. <br> <br>AS <br><img src="http://www.typophile.com/forums/messages/30/38879.gif" alt=""></p>
