    html: <p>Festeggiato! I am glad you enjoyed your day.  May you have many more.  My  daughter just had her 20th birthday last week.  We allso watched a DVD (My Big Fat Greek Wedding). It was far less sad and reminded me of my silly upbringing. <br> <br>I envy you being able to visit La Scala when you wish.  I am an opera fanatic. I am studying the role of Giorgio in Bellini's "I Puritani".  My wife gave me singing lessons as a birthday present 2 years ago.  I am just starting to sing at an age when most people retire from it. <br> <br>Your "Ernesto Hemingway" is quite free and alive.  You should do many more types. <br> <br>Cia� <br> <br>Chris</p>
