    <p>Hi Typophiles,</p>
    <p>I'm looking for a script font wedding stationery that would go well with Garamond Premier Pro. I was browsing through some of the fonts mentioned here on the forum and quite liked Bickham Script Pro and Avalon but it's rather far from Garamond and this logo (the latter could be amended though):</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/RN_flower_4194.jpg"></div><p></p>
    <p>Any ideas?</p>
    <p>AL</p>
