    html: |-
      <p>Garamond is a rather formal (Classic) typeface, so I am assuming that you are thinking of a rather formal script (Bickham and Avalon are a mix, with Avalon less formal, in my opinion). However, your logo has a more modern, casual look to it (and it's nicely done, by the way). Which way do you want to go? </p>
      <p>Frankly, I think Bickham gets overused, especially with the huge swash initials. No complaints from me about the regular Bickham though, as a classic script. But if you are wanting to find something that might work with your logo idea, possibly Font Bureau <a href="http://www.myfonts.com/fonts/fontbureau/sloop/" rel="nofollow">Sloop</a> would give you a somewhat similar R in an elegant script that I think would go nicely with a classic serif like Garamond. This is very subjective, of course. Only you can tell if you think they look OK together.</p>
      <p>For more ideas, you might look at Parts 1 &amp; 2 of the <a href="http://bowfinprintworks.com.ScriptIDGuide.html" rel="nofollow">Script Font ID Guide</a> for more formal styles and Parts 7 and 8 for more casual styles. Another idea is to use Antique Handwriting, as if from the Garamond era of the 1700's, and for those styles See Part 10 of the Guide.</p>
      <p>[edit: My mistake. Garamond is really 1500's, but the idea still applies.]</p>
      <p>- Mike Yanega</p>
