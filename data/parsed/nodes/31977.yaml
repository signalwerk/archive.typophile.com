      <p>Oh, congratulations then to Ingo. What I get from the German text is just that this is a development of ideas from Bernard Gothic, which evidently was the first to remove the stems from the mn etc. </p>
      <p>It is interesting to compare this with Daxline, which is also an optically monoline, stemless sans. I prefer Phoenica.</p>
