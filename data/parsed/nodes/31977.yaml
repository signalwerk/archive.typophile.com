    <p>German Type Foundry releases Phoenica, a legible contemporary humanist sans serifs font family</p>
    <p>Phoenica and Phoenica Condensed is offering six weights for both font families, all with true italics. Three extra thin hairline versions are developed additionally to match the challenges for photo and magazine design needs.</p>
    <p><em>For a limited time Phoenica Std Regular will be available free of charge.</em><br>
    <a href="http://www.germantype.com/freetype.htm" title="http://www.germantype.com/freetype.htm">http://www.germantype.com/freetype.htm</a></p>
    <p>The fonts coming in two flavors, Pro (Phoenica) and Standard (Phoenica Std), all in OpenType format only. The pro version is covering all bells and whistles you can expect from a high quality type face. Central European, Cyrillic and Greek language support, small caps and all common kinds of numerals are available throughout each font with a bunch of additional symbols and signs. Each Phoenica (Pro) font is covering more than 1000 gylphs. </p>
    <p>The Pro version will be available form the new founded German Type Foundry: <a href="http://www.germantype.com" title="http://www.germantype.com">http://www.germantype.com</a></p>
    <p>PDF Specimen:<br>
    <a href="http://www.germantype.com/pdf_phoen.htm" title="http://www.germantype.com/pdf_phoen.htm">http://www.germantype.com/pdf_phoen.htm</a></p>
    <p>Character Set and OpenType Features:<br>
    <a href="http://www.germantype.com/tech_phoen.htm" title="http://www.germantype.com/tech_phoen.htm">http://www.germantype.com/tech_phoen.htm</a></p>
    <p>Phoenica Std is the entry level version of this big font family covering the Latin 1 Western European (ISO-8859-1) character set. The standard version is available from preussTYPE and MyFonts.</p>
    <p><a href="http://www.preusstype.com/fam-phoenica.php" title="http://www.preusstype.com/fam-phoenica.php">http://www.preusstype.com/fam-phoenica.php</a> -<br>
    <a href="http://www.myfonts.com/fonts/preusstype/phoenica/" title="http://www.myfonts.com/fonts/preusstype/phoenica/">http://www.myfonts.com/fonts/preusstype/phoenica/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Phoenica4_5706.gif"></div><p></p>
