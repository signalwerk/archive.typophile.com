      <p>Hello William,</p>
      <p>The typeface is from my friend and colleague Ingo Preuß. Since I know him, he is working on it. The real world specimen - a printed one in German and English is in the works and will hopefully available in a month or two, saying more about the concept behind the typeface.</p>
      <p>For the monent a very short German text is available only.<br>
      <a href="http://www.germantype.com/cms/info_phoen.htm" title="http://www.germantype.com/cms/info_phoen.htm">http://www.germantype.com/cms/info_phoen.htm</a></p>
      <p>We are busy in making the GTF site usable in English too.</p>
      <p>--<a href="http://www.astype.de" target="_blank" rel="nofollow">astype.de</a>--</p>
