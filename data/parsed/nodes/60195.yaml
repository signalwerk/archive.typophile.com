    html: |-
      <p>You’re welcome.<br>
      When compiling this list, I didn’t pay regard to your original request, sorry. That is, I won’t recommend most of those typefaces for setting a children’s book (including URW Grotesk, for the reason Jens mentioned).<br>
      In my opinion, the significance of a single-storey ‘a’ for children is, at least, debatable. Such a typeface might come in handy for teachers, when it is both used for reading and (as a model for) writing. Apart from that, the benefit of avoiding confusion of ‘<em>a</em>’ and ‘a’ is soon outweighed by the potential –&nbsp;and likely – confusion of ‘<em>a</em>’ and ‘<em>o</em>’.</p>
      <p>Children are not stupid, they can handle more than one representational form per character. Their world doesn’t end at the edges of their primer. They do spot and effortlessly read a lot of different ‘a’ glyphs every day: caps, italics, serifs, sans-serifs, scripts, fat letters, condensed letters, single-storey and double-storey …</p>
      <p><cite>Sassoon Primary looks a bit too young for our purposes</cite></p>
      <p>Note that the <a href="http://www.clubtype.co.uk/fonts/sas/sasslist_com.html" rel="nofollow">Sassoon family</a> is an elaborate system that consists of a number of members, each designed for a special purpose.<br>
      <a href="http://www.clubtype.co.uk/fonts/sas/s110sample.html" rel="nofollow">Club Type</a> about <a href="http://www.clubtype.co.uk/fonts/sas/s110sample.html" rel="nofollow">Sassoon Sans</a>: “A more mature font … Ideal for older pupils, perhaps at Seconday school, or adults, who no longer require ‘exit strokes’ to clump the letters together.”</p>
      <p>F</p>
