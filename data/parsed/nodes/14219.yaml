      <p>My inspiration comes entirely from John's work, he's nothing less than inspirational. John is perhaps one of the most knowledgeable people about letterforms and type that I know in person and to be deemed the 'Ambigram Master' by so many, who could ask for a better teacher!? He's been my motivation for what now is becoming a love for type and he enjoys the fact that I'm really getting into it. I get to help out with some of his work like mentioned before which is also exciting!</p>
      <p>I've linked my very first 3 ambigrams I did for John's class open ended final if anyone's interested. He enjoyed them very much for their different styles and solutions:</p>
