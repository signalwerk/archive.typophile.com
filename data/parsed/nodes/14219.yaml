      <p>If I refer to the A, the curve I suggested would be in the same direction as the outside curve from the vertical to the horizontal in the top right, you will have to balance the curve so it works with the other curve inside that counter. The reason I made the suggestion is that it looked a bit abrupt having a right angle. Of course you might decide that it will affect the readability of the R shape too much.<br>
      Tim</p>
