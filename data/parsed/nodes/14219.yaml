    <p>Here's an ambigram I sketched while at TypeCon last weekend. I talked with my professor (John Langdon) about it and deemed it a good start but not a perfect finish. I learned a lot from the progression of it from my original sketch (there were about 3 revisions). Time to move on and do more sketching. I did come up with what John considers quite an excellent alternate for an a/r combo that he had never seen before (doesn't fit this style though) and I attached that as well, it'll surely go into my library for future use! Comments? critiques at this point aren't so important, just thought I'd share some of my type work with everyone!</p>
    <p>-Dave</p>
