  html: "<p>I see Tamye Riggs has posted the availabilty of the FontAid fleurons font at: &lt;<a href=\"http://typophile.com/cgibin/show.pl?72/72.html\" target=\"_blank\">http://typophile.com/cgibin/show.pl?72/72.html</a>&gt; <br>The font is only $20 and is sent as a donation to relief efforts for Tsunami victims.  There is also a place to contribute more if you like.   <br>The font itself is a gem. I am sure everyone will have their favorites but my 5 favorites were designed by: Ko Sliggers, Lukasz Dziedzic, Magda Frankowska, Stefan Hattenbach, and Will Price. <br>I won't post any GIFs but anyone who buys the font will be able to see my favs and find many of their own (that was a sales pitch). If you buy the font, then you get to post your thoughts on how your favs are at least as good as the 5 above--and you would have contributed to the Tsunami victims. <br>Thanks to Jim Richardson, SOTA, and everyone else involved in puting this [project together. <br> <br>ChrisL</p>"
