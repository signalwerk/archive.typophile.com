    <p>Not to start another Best Legible Didone thread, but: </p>
    <p>Looking for a substitute for Bodoni MT Book in a 170-year-old scholarly journal. As you know Bodoni (even MT Book) is not ideally legible in small print on white and slightly glossy paper. I was wondering about <a href="http://www.suitcasetype.com/page.php?lmut=en&amp;section=font&amp;font=teimer%20Std%20OT" rel="nofollow">Teimer Antiqua</a>. Only thing that worries me is that it would have to be set even smaller, at least nominally (9?) if it isn't to take up too much space compared with MT Bodoni 10/12, on 12 cm lines. And wide letterforms might otherwise produce awkward spacing or word division, and so on. </p>
    <p>I have also toyed with the usual distinguished substitutes, Storm's Walbaum, Hoefler's Didot, Licko's Filosofia, even Paperback from House Industries, which is actually an excellent didone, despite its understated name. Love them all but in each one my editorial board  finds something just too special for academic work (especially in the figures), or just too different from the usual face. Kepler, conversely, is certainly well crafted and well behaved but what's the use of having a didone if it looks so dull? (I admit I haven't actually seen a good print-out of it).</p>
    <p>Other tempting possibilities, with somewhat similar proportions and none of the offending peculiarities, but further removed : FB Whitman, FF Scala, Utopia.</p>
    <p>Teimer could make everyone happy, since it's actually even closer than Bodoni to the Didot we started off with in 1839. So does anyone here have any experience setting text in Teimer, or any further suggestions? Thanks in advance.</p>
