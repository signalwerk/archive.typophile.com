    <p>Hello everyone</p>
    <p>I'm looking to hire a WordPress master to take care of a theme I bought, turn it into a online store website. </p>
    <p>It's WooCommerce compatible. What I'd like to be done there is logo and title customization, some color scheme tweaks and populating the store with products images and items information.</p>
    <p>I'd also like it to have installed along with WordPress itself and some SEO plugin added so my website is better visible for search engines.</p>
