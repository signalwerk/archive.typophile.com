    <p>Hi,</p>
    <p>would someone happen to know the typeface used for the FAIRCHILD 670 (Audio compressor) logo (the "Fairchild" part)?</p>
    <p>Although the attached picture shows rounded corners (due to picture resolution), I'm pretty sure the characters have squared ends.</p>
    <p>Picture uploaded.</p>
    <p>More images here: <a class="freelinking external" href="http://www.diy-racked.com/diy-talk/viewtopic.php?f=7&amp;t=128" rel="nofollow">http://www.diy-racked.com/diy-talk/viewtopic.php?f=7&amp;t=128</a></p>
    <p>Thanks for any help.</p>
