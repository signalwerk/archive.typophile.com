    html: <p> I've always assumed it was "treh-byoo-shay" and nobody's ever corrected me... <br> <br>What's goofy about this typeface is the strange shift from the regular weight to the bold weight. The regular weight has flat terminals (at the top of the t and h for example), but the bold weight shown in the Big Brother logo has angled terminals. <br> <br>Is this an anomoly or is this some design feature I'm just naive about? Did multiple designers work on the different weights? <br> <br>//joe </p>
    html_clean: <p> I've always assumed it was "treh-byoo-shay" and nobody's ever corrected me... <br> <br>What's goofy about this typeface is the strange shift from the regular weight to the bold weight. The regular weight has flat terminals (at the top of the t and h for example), but the bold weight shown in the Big Brother logo has angled terminals. <br> <br>Is this an anomoly or is this some design feature I'm just naive about? Did multiple designers work on the different weights? <br> <br>//joe </p>
