    html: <p>From <a href="http://www.microsoft.com/typography" target="_top">http://www.microsoft.com/typography</a> <br> <br>"Trebuchet MS, designed by Vincent Connare in 1996, is a humanist sans serif designed for easy screen readability." <br> <br>"Trebuchet takes its inspiration from the sans serifs of the 1930s which had large x heights and round features intended to promote readability on signs."</p>
