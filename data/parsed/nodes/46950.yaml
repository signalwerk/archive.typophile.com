      <p>I guess my biggest purpose on Typophile is just to represent those who use type.</p>
      <p>So here is a for-instance:</p>
      <p>Right now, I’m setting a book with 4,000,000 characters (1,100 manuscript pages). Sequence of events: The files are supplied by the author, then edited. After editing, which includes any coding or change to the text, the book is designed. And in designing the book, the designer will decide that certain elements, <cite> some of which (e.g., acronyms) are run into the text stream,</cite> are to be set in small caps. The book does NOT go back to the editors after design.</p>
      <p>Except for the size, this is a pretty typical workflow.</p>
      <p>OK, think it through: in the copyedited files, the elements to be set in small caps may be (1) full caps, (2) a mixture of cap &amp; lower case, or (3) lower case. In the week that I spend typesetting this, when I encounter one of these elements in the text, all I want to have to do is hit “all small caps” (which takes case of 1-3), and be done with it.</p>
      <p>Well, almost done. I’ll then run a global S&amp;R for “all small caps” with “0 tracking” and replace the “0” tracking value with a value appropriate to the text font. Small caps in display won’t be affected; they’ll be set either through a paragraph style which will include a bit of tracking, or occasionally “directly formatted,” again with tracking done as set.</p>
      <p>If the type designers start messing around with just which small cap function does what, I’ll have a lot more work &amp; confusion.</p>
      <p>I believe it was Adam who suggested that “display” small caps really call for a separate font, and I agree. If you’re gonna screw around with just what feature does what, put it all in a readme. And make sure the EULA lets the end user go in and modify the font(s) so they are useful.</p>
