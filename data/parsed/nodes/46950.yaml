      <p>So, Charles, are you advocating completely against contextual punctuation for small caps? (I don’t see how that would affect your example, since presumably you’re just selecting the letters of the acronyms.) Or are you advocating against including any figure substitution in either small cap feature? Or all of the above?</p>
      <p>So far, I haven’t seen anyone suggesting that “All Small Caps” not change all cases to small caps — {c2sc} for the caps and {smcp} for the lc. Software must implement both for the All Small Caps command.</p>
      <p>I can respect the opinion that these two features should perform only the minimum written in the spec (which BTW, suggests that OsF may be included in {smcp} subs). </p>
      <p>But it doesn’t seem to necessarily follow from the example that you outlined. Or, at least, I’m not seeing it.</p>
      <p>— K.</p>
