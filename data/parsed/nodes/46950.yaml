      <p><em>Which special characters schould be activated with smcp-feature, and which with c2sc?</em></p>
      <p>This distinction addresses the “double duty” described by Charles.</p>
      <p>What I’m doing now is to put the “text” features (1) in smcp, and the “optical size” features (2) in c2sc.</p>
      <p>That is to say, “smcp” only substitutes the lower case alphabet.<br>
      So smcp, which is really “caps with small caps”, has default figures (whether cap-height lining or oldstyle), whereas “c2sc/all-small-caps” has small-cap height lining figures.</p>
      <p>However, I don’t make c2sc versions of every character, omitting those which I consider to be “text” characters that don’t usually occur in all-capital settings, such as parentheses and brackets. I think the bar character is instrumental in determining the look of “all small caps”, representing the way that setting is most likely to be used, in a folio for instance. </p>
      <p>Here are the two styles.<br>
      </p><div class="imageWrap"><img src="/web/20080907011307im_/http://www.typophile.com/files/smcp_4198.jpg"></div><p></p>
