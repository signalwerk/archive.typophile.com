      <p>If lining figs are your default (nothing wrong with this), then I would sub oldstyle figs with {smcp}. I would sub your sc figs only with {c2sc}. You might also consider parens, braces, and brackets to sub with {c2sc} but not {smcp}.</p>
      <p>As Nick pointed out above, {smcp} is usually invoked when the designer wants U&amp;sc. Thus the punctuation and figures should accommodate both heights. Standard puncts and oldstyle figs do the best job in this case, in my opinion.</p>
      <p>Nick’s comment about the vertical bar has to do with the fact that one of the most common uses of small caps, at least in book work, is as a running element in conjunction with a folio (page number). It is currently a favorite stylistic device to separate these two things with a vertical bar. The standard vertical bar stands too tall when set in a line of small caps and doesn’t look vertically centered against the nice horizontal line of small caps. Book designers usually baseline shift the bar down a bit to look right. Since this is usually done once on a master page, it’s not such a terribly tedious task. But his idea of an alternate form for [c2sc} is a nice detail.</p>
      <p>— Kent.</p>
