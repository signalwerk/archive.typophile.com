    <p>From a typographers point of view, and for all fonts in general:<br>
    What characters are good to adjust to smallcaps settings?</p>
    <ul>
    <li>A-Z.sc and all diacritics (okay, that’s obvious :)<p></p>
    </li><li>0-9.sc
    </li><li>dieresis.sc, brackets.sc, ...
    </li><li>currency symbols?
    </li><li>exclamation and question marks?
    </li><li>fractions?
    </li><li>What else can you think of? What would be useful in a sc-version?
    </li></ul>
    <p>Additional questions:</p>
    <ul>
    <li>Where will the normal version just do the job (or even be better)?
    </li><li>How would a special Version of, for example, “{}” would look like?<br>
    Same height as the letters? a tad higher? Just a repositioned normal version?<p></p>
    </li><li>Which special characters schould be activated with smcp-feature, and which with c2sc?
    </li></ul>
