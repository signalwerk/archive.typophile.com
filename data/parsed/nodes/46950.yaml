      <p>It breaks down into how small caps are used. For books anyway, there are two uses, (1) run into text and (2) used as display, as for subheads.</p>
      <p>For (1), you want to maintain most of the punctuation of the regular font — it would look odd to have the quotes change (includes apostrophe), the period change, etc. For most of us book people, it would look odd to have the numbers change, unless someone was so crass as to use lining figures in the text.</p>
      <p>For (2), ideally you have a separate set of glyphs that should mirror the full caps in all ways they can occur in display, just smaller, but with a weight that lets the smaller size carry itself when compared to the weight of the text. No telling what words or punctuation might appear in a heading, so you would need everything where the position or size of the basic font was appeared odd — just as with full caps. </p>
      <p>As to size, the run-into-text small caps should be just a bit bigger than x height, with the sc “X” roughly 10 to 20 units taller that the topmost part of a lc “n”. They need to blend into the lower-case letters, without appearing optically smaller. </p>
      <p>For display, it is a harder call, but I’d say a height should be around 10 percent greater than a l.c. “x” would be most useful.</p>
      <p>FWIW</p>
