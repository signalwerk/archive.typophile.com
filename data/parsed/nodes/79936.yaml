      <p>Cristóbal, Alexis. Muchas gracias por colaborar conmigo.</p>
      <p>Sobre el apunte de Cristóbal del manual... me temía que era así, pero me animó a la consulta la entrada:</p>
      <p>"5.b. [GSUB LookupType 2] Multiple substitution<br>
      A Multiple Sub rule is specified as:</p>
      <p>substitute  by ;<br>
       contains two or more glyphs. It may not contain glyph classes. (If it did, the rule would be ambiguous as to which replacement sequence were required.) For example:</p>
      <p>substitute f_f_i by f f i; # Ligature decomposition"</p>
      <p>Que se encuentra en: <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#5" title="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#5">http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#5</a></p>
      <p>Cosa que obviamente no me funciona, y por eso la consulta.</p>
      <p>Sobre el apunte de Alexis... pues sí, pero es lo que no quiero hacer ya que necesitaría varias decenas de glifos para lo que quiero hacer (sino más de una centena).</p>
      <p>Nuevamente muchas gracias. Saludos desde Montevideo, Uruguay.</p>
