    <p>I am new to using typefaces on websites (beyond the normal select amount).</p>
    <p>If I wanted Univers, I would just purchase the license for the correct weights here:<br>
    <a href="http://www.linotype.com/53226/LinotypeUnivers-family.html?site=webfonts" title="http://www.linotype.com/53226/LinotypeUnivers-family.html?site=webfonts">http://www.linotype.com/53226/LinotypeUnivers-family.html?site=webfonts</a></p>
    <p>And pay the annual / monthly fee?</p>
    <p>Are there any fonts like Univers that might be better suited for screen?</p>
