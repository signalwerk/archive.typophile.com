    html: |-
      <p>It's starting to look very groovy. If your teacher really is too nice to tell you how to improve it, enclosing my 10 cents worth:</p>
      <p>1. You need bigger margins and on the back the lines could be broken better (eg. second line take "He" to the next line) There are too many hypens eg. get "influential" onto one line and see if you can avoid breaking names like "Zarathustra". I'd move the photo down to line up with the last baseline on the first column to give yourself more space.</p>
      <p>2. Get the barcode to line up with the text margin on the left. </p>
      <p>3. Think there's too much line spacing between "Prelude to a Philosophy of the Future" bit and maybe move it up to get it to correspond with the "Penguin Classics", ISBN and price on the reverse.</p>
      <p>4. Completely agree with ncaleffi and ben_archer that a huge "Nietzsche" is a good idea , so that it can be part of a series. You could even try removing the "Friedrich".</p>
      <p>5. Not important but for a late 19th century German philosopher you could also try using a late 19th century German typeface.</p>
      <p>Best wishes</p>
