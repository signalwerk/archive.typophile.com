    html: "<p>Just my thought: on the front, the author's name, Nietzsche, is much smaller than the translator's - Kaufmann. It doesn't seem to me a good choice. I would move Nietzsche's name on the top, near the title, trying to find a balance between them. Another thing I would try to avoid is using so many fonts: there seems to be Big Caslon, Adobe Caslon and Baskerville there - one should be enough.</p>"
