      <p>"The subtitle, typographically, needs to “belong” more to the title."</p>
      <p>I agree. etahchen, visually you should consider three degrees of importance, in my opinion:</p>
      <p>- The author - Nietzsche, a philosopher but also a sort of popular culture superstar - at least here in Europe. One how is read not only by students (who can hardly understand him) but by generic readers. And whose last name only can easily get the attention it deserves.</p>
      <p>- The book title - which should be bound more to the subtitle.</p>
      <p>- The editing and translation reference. Again, Kauffman, the least important element typographically speaking.</p>
      <p>If I were in you, I'd try to balance these three different elements in the front, with different sizes and positions. The first example you posted, apart from Nietzsche's name, was interesting by this point of view, and I think you were heading towards the right direction.</p>
