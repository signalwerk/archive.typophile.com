    html: |-
      <p>The title "Beyond Good and Evil" should be centered on the page. It looks disconcerting with a wider inside margin. And is it intentionally flush right with Prelude....?<br>
      Is "Translated, with Commentary, by" supposed to be centered with "Walter Kaufmann"? visually it looks off.<br>
      Back cover, is it all running text? Or is the knock out about Nietzsche and the rest about the book? If it is continuous text I think it should all be set at the wide measure, you can still wrap around the photo. And finesse it so the margins, especially top and bottom are all equal. If it is two separate pieces of copy perhaps having a run in bold subhead to further emphasis the two separate blurbs. You also want to tweak the margins on the back, because the copy is ragged it looks like a misprint with the copy closer to the outside.</p>
