      <p>Hi Etah</p>
      <p>The last-but-one example (first response to ncaleffis' advice) works becasue it pushes the author name better; this book was not the only one that Nietzsche wrote... so it could be seen as a design that would work for a series.</p>
      <p>As Juergen was hinting earlier, it's not a good idea to mix left/right alignments with centered all in the same layout; pick one organisational axis and stick with it. That said, you should centre the big Nietzsche name – we can tell it's r/left while the title below is centered...</p>
      <p>Good luck with the assignment. (Oh and if you think it needs a title or something on the back cover, consider using a drop capital to kick off the text in the top left corner.)</p>
    html_clean: |-
