    html: <p>It's more correct now, for sure. But if I had to set this cover (with no editorial restricions) I'd try to push the word "Nietzsche" to a very *big* size, since the subject "Nietzsche" is, in some way, and from my point of view, what I'm looking for if I enter a library and look for a book by him. Or at least I would try to balance more the author and the title display size. Then, I would gain space, if I nedded it, by setting the last three bottom lines smaller. Nothing against Walter Kaufmann, but, again, the point here is Nietzsche, not his translator.</p>
