    html: <p>This depends on what kind of font you are producing, in what environments it will be used, and whether you need documents produced with it to be accessible on older systems or across platforms. Today, I would favour Andreas' solution and simply use a codepoint from the Unicode Private Use Area, but this presumes that the font has a Unicode cmap (TrueType or OpenType), or some other method of mapping from glyphs to character codes, and is going to be used in a Unicode text processing environment (Windows NT, 2000 or XP; Cocoa apps on OS X; ? on Linux). <br> <br>If you are making Type 1 fonts, or are otherwise aiming at legacy environments, then you may find it expedient to replace a character in one of the standard 8-bit codepages. Since any use of the logo is screwing up text anyway, it doesn't really matter which character you replace. If you want easy keyboard access, Hrant's suggestion of the bar character is not bad. <br> <br>Another thing we've done in the past is to make a separate logo font, that contains only a single glyph. This discourages customers from trying to typeset documents with font that might contain their logo replacing a character that might occur in normal text.</p>
