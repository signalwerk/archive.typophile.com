    html: <p>If the logo font is destined for Macintosh Postscript Type 1, then you might consider the shift-option-k (dec 240) position, which usually contains Apple's apple logo. (You'll need to generate the font with Macintosh encoding and not Adobe Standard, so that the character isn't pulled from the Symbol font. I think you'll need to do the same if you replace the "pipe" character also.) <br> <br>-- K. <br> <br></p>
