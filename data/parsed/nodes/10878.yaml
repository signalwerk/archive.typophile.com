  html: <p>I hope this is a good place for this post. So I need to insert a company logo into a typeface. Is there a standard key combo that people use to do this? Or do I just pick a little-used character and write over it? I hate to blow away the eastern euro support built into the face but since it's a US company (for now) it'll probably be one of those...  <br> <br>I'm counting on Hrant for this one. <br> <br>Thanks in advance, free beer in VT. <br> <br>g <br></p>
