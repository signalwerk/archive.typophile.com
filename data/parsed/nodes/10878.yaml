    html: <p>I'm flattered, but I think you should count more on an encoding guru, like John Hudson. <br> <br>With my little knowledge, I might put it where the  "sputnik" is (that generic currency symbol), and map it to some memorable shift-option position. But if you go lower-ASCII, I might consider repurposing the "pipe" (shift-backslash). <br> <br>&gt; I hate to blow away the eastern euro support built into the face but since it's a US company <br> <br>Don't worry, I'm pretty sure getting rid of eccents 'n' stuff is part of the US Master Plan. <br> <br>hhp <br></p>
