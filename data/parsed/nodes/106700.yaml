  html: |-
    <p>Hi everybody, I hope you like our new release, available at <a href="http://www.myfonts.com/fonts/outras/progressiva" title="Click to visit an external URL." class="freelink freelink-external freelink-external">MyFonts</a>.</p>
    <p><a href="http://www.myfonts.com/fonts/outras/progressiva" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Progressiva</a> is a sans serif type family for text and display usage. With some unique playful forms and a little bit condensed structure, the family is ideal for texts that require some personality and titles with great visual presence. Progressiva family is composed by 11 roman styles, from Thin to UltraBlack, giving a lot of space for visual variance. Each font includes some standard and discretionary ligatures as well as some alternative letterforms included in stylistic alternates and stylistic sets OpenType features. It’s suitable for magazines, posters, packaging, advertising, signage systems, corporate material and so on.</p>
    <p><img src="/sites/default/files/old-images/progressiva-poster1-tf_3928.png"><br><img src="/sites/default/files/old-images/progressiva-poster2-tf_4826.png"><br><img src="/sites/default/files/old-images/progressiva-poster6-tf_6070.png"><br><img src="/sites/default/files/old-images/progressiva-poster3-tf_5011.png"><br><img src="/sites/default/files/old-images/progressiva-poster4-tf_4707.png"><br><img src="/sites/default/files/old-images/progressiva-poster5-tf_4086.png"><br><img src="/sites/default/files/old-images/progressiva1ba_5011.png"></p>
