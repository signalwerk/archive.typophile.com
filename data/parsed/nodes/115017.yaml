    <p>Hi everyone, could someone be so kind as to suggest to me a companion and/or body text to go with Trio Grotesk?</p>
    <p><a href="http://www.boldmonday.com/en/triogrotesk/" title="http://www.boldmonday.com/en/triogrotesk/">http://www.boldmonday.com/en/triogrotesk/</a></p>
    <p>I'd like something contemporary to go along with it.  I'm doing a site re-do for a friend who's got it and also has a subscription to Typekit, so if any suggestions would be on there, that would be fantastic, but it's by no means a requirement.</p>
    <p>Thanks for any help or guidance you can give me.</p>
    <p>Aaron</p>
