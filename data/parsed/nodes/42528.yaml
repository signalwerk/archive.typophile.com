      <p>I was about to say, you better not be talking about the letterforms... I own Verlag, Gotham, Hoefler and Didot. They work just fine for me. Can't really say I know about Whitney specifically.</p>
      <p>Does it just not show up, or does it work in the text palate at least? How I usually create Paragraph styles is to manually configure a text block with the attributes I want, then with it highlighted, create a new paragraph style. That new paragraph style should be automatically created with all the attributes that are highlighted. The only other things I can think of is if you have a character style overriding it or the Paragraph style is based on another Paragraph style. Probably not though, if the H&amp;FJ tech department admits it's an issue.</p>
      <p>Hope this helps?</p>
