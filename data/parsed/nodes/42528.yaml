    html: <p>I can make the same thing happen here, and create similar problems with big families from other foundries, too. I think that this problem is caused by mixing fonts with specific names for each of their weights, e.g. condensed italic or book italic. There’s nothing wrong with the fonts themselves, it’s just a byproduct of complex typesetting.</p>
