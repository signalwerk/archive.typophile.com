    <p>Last year I purchased the font family "Whitney" from famed "Hoefler &amp; Frere-Jones".<br>
    I received a beautiful type family and was excited to get to work with it.<br>
    When creating a Paragraph Style using Indesign (CS2 and CS3) it neglects to recognise any of the Italics.<br>
    I contacted the tech department and they said  its a know issue and suggested I use "Find Font".<br>
    For the amount of money spent you would think that this would<br>
    be a working function.<br>
    Has anyone else had this problem? if so do you have any remedies?</p>
