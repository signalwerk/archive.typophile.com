      <p>Hi Koop,</p>
      <p>I believe my colleagues Jonathan and Ksenya here at H&amp;FJ have been in contact with you, but I'd like to follow up with a bit of background about the problem you're experiencing.</p>
      <p>When you switch between font families in an Adobe application, the application does its best to match up font weights and styles from one font family to another. Maybe Eric Menninga on the InDesign team can give a little more information about this, but I believe InDesign uses a hard-coded internal list of style names to know which styles to match up.</p>
      <p>For instance (and I believe this is the problem you're experiencing), if you set a paragraph with Times Regular and Times Italic and then switch the entire paragraph to the Whitney family, Adobe's internal style name list is able to deduce that "Regular" is the same weight as "Book" and properly switches to Whitney Book, but it doesn't make the connection that "Italic" should transpose to "Book Italic".</p>
      <p>The Italics in Whitney are style linked with the Romans -- you can still select some text and type command-shift-i and the font will switch to the proper italic -- it's only when blindly switching an entire paragraph of styled text from one font family to another that this problem would come up. This isn't isolated to just Whitney, we can confirm that the same problem occurs with fonts from other vendors that use "Book" and "Book Italic" as style names including fonts from Adobe. You'll find that the same thing happens with Meta Book Italic and Adobe Futura Book Italic, among others.</p>
      <p>I'm sorry that this is still causing you trouble, but I hope this explanation helps shed a little more light on the subject. Maybe Eric, Miguel or Thomas from Adobe might chime in a bit on this and give a little bit of a different perspective.</p>
      <p>Andy</p>
