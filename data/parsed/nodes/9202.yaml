    html: <p>I've been looking at this one too. My first impulse is that they took a script font, but replaced the 'r' letters with an italic from another font.  <br> <br>The script font I thought it resembled was <a href="http://www.myfonts.com/fonts/ef/ballantines-script/ef-demi-bold/testdrive.html?s=prairie+style&amp;p=60" target="_blank">Ballantines Script</a> (a.k.a. Dianna). I can see that the 'y' and 's' aren't quite right, but someone who knows how to tweak a font might have started with this style.</p>
    html_clean: <p>I've been looking at this one too. My first impulse is that they took a script font, but replaced the 'r' letters with an italic from another font.  <br> <br>The script font I thought it resembled was <a href="http://www.myfonts.com/fonts/ef/ballantines-script/ef-demi-bold/testdrive.html?s=prairie+style&amp;p=60" target="_blank" class="link-external">Ballantines Script</a> (a.k.a. Dianna). I can see that the 'y' and 's' aren't quite right, but someone who knows how to tweak a font might have started with this style.</p>
  - id: 59721
    user: 2088
    date: 2005-02-11T07:43:00
    date_raw: 11.Feb.2005 7.43am
    votes: null
    html: <p>Doing some more hunting, and I still think the 'r' comes from a different font, but I think the rest of the script comes from an old Z-series film type script. I have a German Script Font book from 1993, and it shows that a company called Typo Bach in Frankfurt and Munich was using a bunch of those Z-name fonts that show up in the Solotype Catalog. It turns out that Zither (Solotype Catalog p. 95) is nearly identical, except that the loop on the 'y' in the sample is bigger (and the 'r' is a true script 'r'). It's a better match than Ballantine's Script, which I now see has a slight bend in the vertical stems. In the Photo-Lettering Catalog this was called 'Nightingale Script', I think.  <br> <br>Turns out that Zither was apparently digitized by Opti, and possibly by Dan Solo, because I have a sample in the Script Font ID Guide (below):<img src="http://www.typophile.com/forums/messages/83/65213.gif" alt="Zither sample"> <br> <br>I will make a larger sample of 'prairie style' using OptiZither, and post it shortly.</p>
    html_clean: <p>Doing some more hunting, and I still think the 'r' comes from a different font, but I think the rest of the script comes from an old Z-series film type script. I have a German Script Font book from 1993, and it shows that a company called Typo Bach in Frankfurt and Munich was using a bunch of those Z-name fonts that show up in the Solotype Catalog. It turns out that Zither (Solotype Catalog p. 95) is nearly identical, except that the loop on the 'y' in the sample is bigger (and the 'r' is a true script 'r'). It's a better match than Ballantine's Script, which I now see has a slight bend in the vertical stems. In the Photo-Lettering Catalog this was called 'Nightingale Script', I think.  <br> <br>Turns out that Zither was apparently digitized by Opti, and possibly by Dan Solo, because I have a sample in the Script Font ID Guide (below):<img src="http://www.typophile.com/forums/messages/83/65213.gif" alt="Zither sample"> <br> <br>I will make a larger sample of 'prairie style' using OptiZither, and post it shortly.</p>
  - id: 59722
    user: 2088
    date: 2005-02-11T08:21:00
    date_raw: 11.Feb.2005 8.21am
    votes: null
    html: <p>Ok. Here is my crude attempt to use OptiZither to reproduce this sample. I used the 'r' from Times Roman. What it shows me is that I may not have the exact Z-script that was used for the original, but the method seems credible to me. As you know with film type, lenses could be used to rotate the slant of the type, so my backslanting may approximate what was done. I think it was done to make the italic 'r' fit, and I think they may have used a different 'r' because the original letter looked wrong stylistically, was harder to read, or they just wanted a more vertical style and the r didn't work well that way. Who knows? <br><img src="http://www.typophile.com/forums/messages/83/65218.gif" alt="prairie style simulation"></p>
