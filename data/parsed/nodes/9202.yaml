    html: <p>There's something maddeningly familiar about this, but I just can't place it. I'm pretty sure it's a font. There's a bit of Coronet in there, but it's definitely not that. I can also a bit of Trafton Script, but again even less of a match. I have a strong suspicion that this is the italic of a roman face like Bodoni, but again I draw a blank. <br> <br>You've picked a doozy, Paul. It's stumped me, anyway.</p>
