  html: |-
    <p>I am very in love with the ampersand. It is my favorite character.<br>
    For a long time I loved the lowercase 'g' and then the lowercase 'j.' There was a brief period when I was all about the interrobang but that was short-lived.<br>
    Does anyone else love the ampersand?</p>
