    <p>Dear collueges from all over the world,<br>
    as you might know, I am working in the letterpress pre-print market:<br>
    <a href="http://www.bleisetzer.de" title="www.bleisetzer.de">www.bleisetzer.de</a></p>
    <p>But although I am a writer of short stories and others and I am just preparing my new literature blog at <a href="http://www.preussen-blog.de" title="www.preussen-blog.de">www.preussen-blog.de</a> (its not ready yet, sorry.)</p>
    <p>Right now I am working on an essay about the smell of languages.<br>
    I for myself associate e.g. french with love &amp; erotic, finish with a motor bycicle and so on... I think its always depending on what you individually learned in your first 20 years and what your special country culture says to you, what you associate to a language.</p>
    <p>But now the question, where I'ld like to ask for your help:</p>
    <p>What do you as a non german associate with the sound of german language?</p>
    <p>Thanks in advance for your help. I hope, I do not disturb too much with my OT question.</p>
    <p>Georg</p>
