      <p>&gt; français aux hommes</p>
      <p>There’s a slightly different saying but I won’t quote it here… ;)</p>
      <p>Seriously, the cliché about Germany/Germans I’m generally confronted with is either ridden by the image of the brutish Pickelhaubenmaschinenmensch (wow, this word sounds like machine gun staccato!) or the one of a slightly deranged dreamer who’s getting bitchy as soon as you’re talking about his nationality. Actually, I can identify with both, getting something positive out of both these clichés.</p>
      <p>The scent of German is dominated by motor oil and decay. Maybe due to the fact that motor oil and decay smell somehow stronger than the scents renowned as more ‘humane’. Or maybe because we lack the ability to mask the bad smell properly by spraying rose petal or bubble gum scented air freshener.</p>
      <p>Also check this great film:</p>
      <p><a href="http://video.google.com/videoplay?docid=7688523464781787807&amp;ei=7qmYS4_jJqLe2wLAp63ZAg&amp;q=faust+film&amp;hl=de&amp;view=1&amp;dur=3#" title="http://video.google.com/videoplay?docid=7688523464781787807&amp;ei=7qmYS4_jJqLe2wLAp63ZAg&amp;q=faust+film&amp;hl=de&amp;view=1&amp;dur=3#">http://video.google.com/videoplay?docid=7688523464781787807&amp;ei=7qmYS4_jJ...</a></p>
