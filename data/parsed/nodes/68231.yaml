      <p>The main German media stereotype when I was growing up (England in the '50s and '60s) was the sadistic Nazi/SS officer in war movies that demonized Germans. And Hitler ranting. So I have been indoctrinated with the impression that the German language is harsh and evil. The Tool recording plays on that, with words that are completely innocuous made to sound like a satanic ritual.</p>
      <p>Car ads here (Canada) are disgusting, with their cliché of the humourless German engineer. It's not just Japanese or American manufacturers who exploit that stereotype, but some German too, e.g. Audi, with a seriously guttural man's voice saying the tagline "Vorsprung durch Technik" (Progress through technology).  </p>
      <p>As an aside, I find that English spoken with a German accent is very pleasant. That may well be because of the Germans I have known in recent years, in my dealings with FontShop.</p>
      <p>Even more of an aside, I thought Kate Winslet's German accented English in <em>The Reader</em> was brilliant.</p>
