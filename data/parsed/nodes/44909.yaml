    html: |-
      <p>Sometimes, in words such as "exotic", there isn't enough flavor to carry the word. I wonder if this isn't one of those times where more is better. For instance, should the o have a tiny loop? Should the n have a tail? Should the b and d have curls? I guess why not a little more character on all the blank letters?</p>
      <p>The it ligature isn't working for me. It looks almost like an ampersand when small.<br>
      The ri ligature isn't working for me either.</p>
