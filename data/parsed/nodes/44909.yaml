      <p>Thanks for the feedback.</p>
      <p>Here's the original logo (color) that I did, and then a version of what it would look like now that I've actually spent time on the letterforms (b &amp; w). It would also be used as a display type on stationery and collateral. I'd really like it to be legible/readable at text sizes, although I know it won't be able to get too small since it is a little funky.</p>
      <p>Michael: I know, I really struggled with that fl ligature. But I looked at a lot of other fonts with ball terminals, and that seems to be how the fl is treated. Any suggestions?</p>
      <p>Thanks again.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture46_5980.png"></div><p></p>
  - id: 276649
    user_id: 3254
    user_name: eliason
    user_path: null
    date_raw: 4 May 2008 — 8:36am
    date: 2008-05-04T08:36:00
    votes: null
    html: |-
      <p>I'm not sure the angled terminals on bdhklmnpqru go with the bouncy feel of the rest - it's like a combination of X-Acto blades and bubbles - but the difference I suppose adds to the liveliness. I would experiment with the m, n, and r at least.</p>
      <p>If y is giving you trouble: did you consider doing a y that is u-shaped with a curving descender instead of the diagonal form?</p>
      <p>I agree that the fl ligature isn't working - I would abandon the idea of a ball terminal on a line that's not actually terminal.</p>
      <p>I think all of your ligatures need to be spaced out more.</p>
      <p>I like this font - it's fun. It says to me: Las Vegas, The Price is Right, Sherwood Schwartz shows, 60s stewardesses, Acapulco honeymoons.</p>
