    html: |-
      <p>I think you have a really nice start. Just a few things I really noticed:</p>
      <p>- the e, k, o, v, w, x, z are the same thickness throughout the letter, and the other letters have some variations. They seem to be from a different typefaces, at least to me.</p>
      <p>- the w also seems a little wide and leaves a really bad space in the word "anyway" that I do not believe you could fix with kerning pairs.</p>
      <p>- maybe the t works better at smaller sizes but at the size you provided it seems to drop below the baseline too much.</p>
      <p>- the fl ligature looks odd where the ball in the f and the l collide. The purpose of ligatures is to really make the transition smooth and elegant.</p>
