    html: |-
      <p>Below is an image from Gerrit Noordzij's "the stroke". The purpose of the image is to show how easy it is to break up a word and make it hard to read by making the space between letters stop relating to the counter-space or space inside letters. I suggest that you look at the white spaces and get them to start to balance. In general your interletter space is too small to be comfortable. As letters get physicaly ( optically really ) larger you can let them come together a bit more and you might need to add space at very small sizes. But in even in these cases this 'rule' still applies just to a different degree. You might have to make your counters smaller  ( they are very big) as well as adding space between letters. Doing this will make the massive gap between y+w less bad but you should also fix that - probably by making the angles of the diagonal steeper.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/whitespace_6611.jpg"></div><p></p>
