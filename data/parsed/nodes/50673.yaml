    <p>G'day guys,</p>
    <p>I need to come up with some maps of continents, eg. India, Cambodia etc, for a book I'm producing and I'm wondering how designers normally go about it in the right way. Is there a good online resource with simple map outlines? can I use a few different sources and come up with a composite that doesn't rely too heavily on any of the originals? does NASA have such a thing?<br>
    thanks guys, I'm a bit stumped</p>
    <p>--N</p>
