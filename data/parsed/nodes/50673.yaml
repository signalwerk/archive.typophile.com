      <p>I've purchased vector stock maps and then modified them to reflect a particular theme or illustrative style. I'm not sure if that's "standard" I suppose ideally it's best to have a budget and commission an artist. Even with purchased stock maps, I often just use it as a template to draw my own version which hopefully takes some of the "stock-ness" from the piece and gives it a more unique look.</p>
