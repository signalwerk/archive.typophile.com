    <p>Hello,</p>
    <p>I am working on a logo design for a high tech venture which has many geometric circles and I wanted to try and find a sans-serif with rounded corners that would harmonize with the perfect circles in the logo design. I am presenting type treatments in U&amp;lc as well as all caps. I would like the typeface to have a normal width, not too condensed or too expanded.</p>
    <p>I was thinking of Bryant or VAG rounded but I thought there might be better faces to match the perfect circles used in the logo design.</p>
    <p>Thank you in advance.</p>
    <p>Regards, Sal</p>
