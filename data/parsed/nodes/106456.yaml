      <p>Now that anyone with a computer can make a TTF or OTF font for a new typeface, whereas in the past one would have had to mold lead type, create a Monotype matrix-case, or a comb of Linotype circulating slugs, I think you can be highly secure in the conclusion that current technology is contributing to a proliferation of typefaces.</p>
      <p>The only interesting question is whether the photo-typesetting era was much of an intermediate between these two.</p>
