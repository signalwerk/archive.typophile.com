      <p>I think people are being a bit harsh on the questioner, in this thread and the other. It's a perfectly reasonable question if you break it down.</p>
      <p>Type 200 years ago was (more or less) hand-cut and hand-set, 100 years ago machine-cutting and linotype/monotype machines were used, 35 years ago it was photolettering. Today, we've got digital typefaces in formats like OpenType and TrueType. Each of these changes has had a significant impact on the way type is used. This is extremely basic stuff, of course.</p>
      <p>What's really made this last change different from the others is that (a) a vastly bigger amount of people are now able to use fonts than ever before, and (b) the tools used to design, manufacture and distribute fonts are now immeasurably cheaper. This has led to more fonts being produced today, as well as indeed proliferated, than at any previous point in history.</p>
      <p>Now, the question is: what aesthetic impact has this transformation had? It's really the equivalent of queries from previous eras: Is <a class="freelinking external" href="http://en.wikipedia.org/wiki/The_medium_is_the_message" rel="nofollow">the medium the message</a>? <a class="freelinking external" href="http://en.wikipedia.org/wiki/The_Work_of_Art_in_the_Age_of_Mechanical_Reproduction" rel="nofollow">What happens to the work of art in the age of mechanical reporduction</a>? How has post-modern <a class="freelinking external" href="http://www.youtube.com/watch?v=0pDE4VX_9Kk" rel="nofollow">ways of seeing</a> impacted our understanding of art? And so on. </p>
      <p>The trivial answer to this question, that we're now seeing more "bad" amateur fonts than ever before, as well as a great dela many more professional-quality fonts than ever before, is uninteresting, however. It needs to be taken futher.</p>
