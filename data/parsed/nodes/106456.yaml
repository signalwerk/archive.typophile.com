      <p>Your grasp of this topic is weak, and consequently your writing makes little sense.</p>
      <p>Rather than get bogged down in issues of “quality”, whatever that means, start by putting together a history of font production in the digital era, attempting to identify the different phases it has been through.</p>
      <p>This will get you off and running:<br>
      <a href="http://www.amazon.com/Inside-Publishing-Revolution-Adobe-Story/dp/0321115643" title="http://www.amazon.com/Inside-Publishing-Revolution-Adobe-Story/dp/0321115643">http://www.amazon.com/Inside-Publishing-Revolution-Adobe-Story/dp/032111...</a></p>
      <p>There have been certain sea changes, such as the release of Fontographer in 1986, the replacement of direct mail trade advertising of fonts on floppies by e-commerce, c.2000, and more recently the introduction of @fontface, which has proliferated webfonts from the handful of Microsoft Core TrueType Web Fonts (Georgia, Verdana, Comic Sans etc.) </p>
      <p>IMO, people’s opinions on what are the siginiﬁcant historical events would be more productive than their opinions on whether more designers publishing more fonts is good or bad.</p>
      <p>But in answer to that question, it is what it is.</p>
