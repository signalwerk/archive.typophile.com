      <p>Technology changes have had a similar affect in many professions. In the 1800s photography was done mostly by professionals, but today with cell phones everyone has a camera in their pocket. A few decades ago graphic design involved ordering type, pasting up layouts with a t-square and X-Acto knife, etc, but now anyone with a computer can try page layout. Journalism used to involve getting hired and having editors review your work, but now anyone can set up a website and post articles and news.</p>
      <p>There are many similar examples in other professions and the results are what you'd expect — it's great that people have access to these tools, but the results are often amateurish.</p>
