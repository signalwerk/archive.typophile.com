      <p>Certainly, but in some professions at least – I can't speak for graphic design – the ability for more people to have access to technology has also allowed for a lot more quality product to come through, from unexpected places and with radically changed content.  Music is the classic example, of course, where recording, distribution and (some) instrument technology has constantly become cheaper, and each new change (like the proliferation of the electronic microphone in the 20s, or the significant increase in the number of recording channels available in the 70s, to take two random examples) has added new tools and brough new people into the cultural form, creating new angles and perspectives and styles. That a relatively poor country like Jamaica has had the innovative impact on generations of music that it has, is strongly correlated with the availability and cost of various technologies at various times.</p>
      <p>I've got a significant interest in African music and arts, and there's a perfect example there in the way music videos have changed: HD digital cameras and processing technology has gone from unavailable to common in around five years. And in that same time time a staggering change has taken place in the artistic ambition and visual complexity of the videos accross the whole continent, from <a class="freelinking external" href="http://www.youtube.com/watch?v=U6L3tOU4PTI" rel="nofollow">amateurish green-screen nonsense</a> to <a class="freelinking external" href="http://www.youtube.com/watch?v=1_bq1F9hV8g" rel="nofollow">highly ambitious aesthetic concept videos</a>.  And of course the two are highly correlated, no matter how much new mediocre stuff is also bein made!</p>
      <p>Have we seen a smilar change in type? If not, why not? Where are the African type houses? (The South American ones are obviously doing fine.)</p>
