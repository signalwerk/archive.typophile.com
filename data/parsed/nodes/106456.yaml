      <p>As the others have said, this is a bit of a confused question. What do you mean by 'proliferation'? The digital environment has put typefaces in the hands of everyone who owns a computer, so in that sense they're much more widespread than metal type ever was. Or do you mean digital fonts' copyability in users' hands? Or the ease of availability online through foundries' distribution channels?</p>
      <p>OpenType is not really a 'type design programme', rather a file format that puts the typeface on screen when you key characters. The quality of typefaces is more to do with the experience of the designer and production team. Type design software like FontLab or Glyphs, like any tool, can be used badly or well.</p>
