  html: <p>I'm currently working on a thesis that discusses the impact of late twentieth-century technology on the proliferation of typefaces. It would be a great help if you would comment your opinion whether type design programmes, such as Opentype have had a positive or negative impact on the quality of typefaces designed over the past few years.</p>
