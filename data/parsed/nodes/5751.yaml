    html: "<p>For better or worse, for me meatspace is much more docile than online fora. I got along with almost everybody - credit to <i>them</i> mostly. It was a really great conference - quite possibly the best ever I've been to - although it'll take weeks to see it objectively - as with anything so heady. It was great to be back. Special thanks to Tamye. <br> <br>BTW, Miles, TC98 was special, wasn't it*. The giddy \"exploring the unknown\" delight is gone now, but in terms of value and pure rockin' fun 2004 rules bigtime, and apparently it gets better every year. Helsinki or New York... Now that's an open question. <br> <br>* And talking to Stuart it's clear that feeling is pervasive - something magical happened back then. And maybe it was my imagination, but whenever two of us from the Old School (like Brian, Allen, Richard, James, Simon) eyed each other in SF we had this certain knowing, quiet smile. Bob was there too. But I guess this conference will generate its own nostalgia as well. <br> <br>BTW, thanks to Jared and Joe (duh), Typophile was like a subcurrent running through the entire conference: most blind intros referenced this place, even particular threads! Major symbiosis. Or mutual parasitism.  ;-) <br> <br>hhp <br></p>"
    html_clean: "<p>For better or worse, for me meatspace is much more docile than online fora. I got along with almost everybody - credit to <i>them</i> mostly. It was a really great conference - quite possibly the best ever I've been to - although it'll take weeks to see it objectively - as with anything so heady. It was great to be back. Special thanks to Tamye. <br> <br>BTW, Miles, TC98 was special, wasn't it*. The giddy \"exploring the unknown\" delight is gone now, but in terms of value and pure rockin' fun 2004 rules bigtime, and apparently it gets better every year. Helsinki or New York... Now that's an open question. <br> <br>* And talking to Stuart it's clear that feeling is pervasive - something magical happened back then. And maybe it was my imagination, but whenever two of us from the Old School (like Brian, Allen, Richard, James, Simon) eyed each other in SF we had this certain knowing, quiet smile. Bob was there too. But I guess this conference will generate its own nostalgia as well. <br> <br>BTW, thanks to Jared and Joe (duh), Typophile was like a subcurrent running through the entire conference: most blind intros referenced this place, even particular threads! Major symbiosis. Or mutual parasitism.  ;-) <br> <br>hhp <br></p>"
