    html: <p>After having such a great time in Minneapolis, I was really upset having to miss this year's event. I may be a mere type fan and not a type designer, but nobody seemed to care. There I was having lunch with Mark Simonson or playing hearts with Steven Coles or signing Dave Farey's programme... just a bunch of font-geeks hanging out and talking about their passion without having to explain that, yes, someone actually has to design all those little letters they read every day. <br> <br>I can't miss two years in a row. See you in 2005.</p>
