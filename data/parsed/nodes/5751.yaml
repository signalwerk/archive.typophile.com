    html: <p>Hrant, I felt similarly about last year's conference which was my first. Maybe the first TypeCon--whichever one it was--will always have a special quality that can't be repeated. <br> <br>As far as meatspace vs. online goes, when you talk to someone in person, you have much less opportunity to be misunderstood because you not only get the words, you also get body language, facial expression, tone of voice, etc., and it's much harder to forget another person's humanity when they're standing right in front of you. <br> <br>I think a good portion of what passes as debate online simply comes down to the difficulty of communicating through such a limited medium as text. They touched on this a bit in the Underware Typeradio presentation.</p>
