      <p>Galliard got its name from a Renaissance dance which is ‘<cite>characterized by leaps, jumps, hops, and other similar figures. The main feature that defines a galliard step is that the last two beats consist of a large jump, landing with one leg ahead of the other. […] The galliard was a favorite dance of Queen Elizabeth I […] The distinctive 6/8 rhythm can still be heard today in songs such as “God Save the Queen.”’</cite> <a href="http://en.wikipedia.org/wiki/Galliard" rel="nofollow">[¹]</a></p>
      <p>The font was designed by <cite>Royal Designer</cite> Matthew Carter in 1978—2&nbsp;years before he became <cite>typography consultant to Her Majesty’s Stationery Office</cite> <a href="http://www.linotype.com/346/matthewcarter.html" rel="nofollow">[²]</a>—as a reinterpretation of Granjon’s 16th century style. <a href="http://www.linotype.com/661/itcgalliard-family.html" rel="nofollow">[³]</a></p>
