    html: |-
      <p>It is actually <a class="freelinking external" href="http://www.stormtype.com/typefaces-fonts-shop/typefaces-199-farao-black" rel="nofollow">Farao Black</a>, but that is close enough! Farao Book works surprisingly well for text, I used recently &amp; was very pleased with the results. I gave it a short review as well for our national design magazine (this is the unproofed version)</p>
      <p>----------------------<br>
      FARAO<br>
      ----------------------</p>
      <p>To classify Farao merely as a ‘slab-serif’ is akin to describing Twin Peaks as a mere ‘drama’: the closer you look at it the weirder it gets. It is true that Farao has slab-serifs, but looking at the individual details reveals the eccentricities of certain letterforms, strange constructions that challenge one’s notion of how a letterform should be ‘correctly’ formed.</p>
      <p>If the ‘g’, for instance, was a person then it would’ve been locked away at birth. The ‘c’ contradicts the vertical stress of the ‘o’ and differs entirely the pointed stroke finish of the ‘e’. The slabs of the ‘s’ bully the rest of it’s curves into submission, giving the appearance of a contorted snake about to strike. Farao’s uppercase isn’t quite as deranged as the lowercase—the inherited straightjacket of majuscule limits overly affected construction. The numerals, however, flaunt the familial oddness beautifully—slab-serifs and ball terminals are held together with excellent curves. </p>
      <p>Up close, Farao is certainly odd, but the individual inconsistencies make it perversely consistent as a whole. It is a warm, full-bodied family with a palatable coal-fired heft. Designed by František Štorm, it is available in a confusing array of styles. This is fortunately allayed by the very reasonable price and OpenType compatibility. </p>
      <p>Farao can be purchased from <a href="http://www.stormtype.com" title="www.stormtype.com">www.stormtype.com</a></p>
      <p>----------------------</p>
    html_clean: |-
