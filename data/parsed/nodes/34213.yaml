      <p>Yeah, the 'Hoefler Text.dfont' is a bit of an odd duck. I don't know what compelled me to crack it open with fontforge, but I discovered some really wonderful things there. Also some odd things.</p>
      <p>The big problem is that it's really only designed for use with Apple Advanced Typography; the OpenType tables are missing a lot. Even on the AAT side, the italic ligatures aren't tagged at all, so I don't know if programs just look for the 'f_i' glyph anyways and use it if they find it, or what...</p>
      <p>The OpenType tables that are there are more often than not 'lfbd' and 'rtbd' (left and right bounds), which is great if you've got a program that can choose a character based on whether or not it's at the beginning or end of a line, but not so useful otherwise.</p>
      <p>I use TeX mostly (which obviously doesn't play "find the ligature"!) but IIRC, InDesign didn't use them automatically either.</p>
      <p>I'm saving my pennies to buy the Hoefler Text &amp; Hoefler Titling bundle! :D</p>
