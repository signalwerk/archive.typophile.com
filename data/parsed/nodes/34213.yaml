    html: |-
      <p>Congratulations, Linda! Yay, it’s Bickham, indeed. The glyph is the Greek uc letter Sigma (∑), used in math as a summation operator. </p>
      <p>To be precise, it is Bickham Script <strong>Pro Bold</strong>. While the Standard version shows a rather generic non-script ∑, the Pro features this fancy one—which, imho, looks like a L hit by a flowerpot (or a £ that can’t afford a proper crossbar).<br>
      It’s nice to see the makers cared about those poor cousins of the charset table. Still, I wonder who wants to have a summation operator on a wedding invitation… Then, mathematicians can be quite peculiar.</p>
      <p>For the record: It was New Yorker Richard Lipton who ‘has further explored the design possibilities of this 18th century English round hand writing’ <a href="http://www.adobe.com/type/browser/landing/bickham.html" rel="nofollow">[¹]</a>. The font was named after George Bickham, ‘English writing master and engraver […] famous for his manual <em>The Universal Penman</em>’ <a href="http://www.myfonts.com/person/bickham/george/" rel="nofollow">[²]</a>.</p>
      <p>Your turn.</p>
