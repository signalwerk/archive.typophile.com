      <p>Parry grotesque normal or semi-bold</p>
      <p>from Ourtype:</p>
      <p><cite>Parry is a typeface design of Artur Schmal. It began as Schmal's graduation project at Type &amp; Media in The Hague. Inspired by the sturdy typefaces of Edmund Fry and Thorowhood, it came out as a rather traditional, heavy slab serif, complemented by an even heavier condensed variant and a series of sanserif capitals.</cite></p>
      <p>As of 2004 the typeface saw further development: First, designing the slab serif that would be suitable for composing longer texts yet retaining the Victorian atmosphere. Secondly, drawing a matching Grotesque, as part of the same family. </p>
      <p>Despite its nineteenth-century perfume, Parry is a contemporary type family. It produces a rounder and softer image than the often rigid slab serifs of those times. Some of Parry's design features - like the top serifs - have an outward bulge. And, although such details might be regarded as 'not done', Schmal opted for them, because 'it simply looks good' in combination with sharp-edged bottom of the lowercase c, e and d.</p>
      <p>Parry Grotesque family comes in four weights: Normal, Bold, Semi-bold and Black and comprises matching Italics, Small Caps, as well as text figures.</p>
      <p>Available in Open Type Standard, TrueType and PostScript for Mac and PC. OpenType Pro is scheduled for release in Spring 2007.</p>
