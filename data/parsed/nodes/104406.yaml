    <p>I make hand-drawn typefaces using an Illustrator to FontLab workflow like this:  </p>
    <p>1. Scan.<br>
    2. Vectorize in Illustrator [using ImageTrace in AI CS6].<br>
    3. Copy and paste individual glyphs into FontLab.</p>
    <p>I used to be satisfied with this workflow, but now that I'm making more fonts, I really want the ability to import multiple characters/glyphs at once, so that I don't have to go back and forth copying and pasting over a hundred times per typeface. All of my characters start out together in a single AI file. Is there any way to get them into FontLab (or Glyphs) all at once as separate glyphs?</p>
