      <p>To clarify, I'm not drawing the vectors manually—I'm using Illustrator to vectorize automatically, tracing the scanned image in one step with the Image Trace feature (previously called Live Trace).  </p>
      <p>I didn't think you could do that in FontLab without also buying their ScanFont app, which I am trepidatious about because a) it hasn't been updated in six years, and b) Illustrator has gotten pretty good at tracing bitmaps over the last few releases.</p>
