      <p>ScanFont provides a really quick way to get Illustrator art into FontLab. You basically open the Illustrator document in ScanFont, adjust the scaling factor, and export as a FontLab file (or into an open FontLab file).</p>
      <p>Unfortunately, they haven't released an Intel-native version yet, so it can't run on Mac OS 10.7 or 10.8 natively. In the mean time, it is possible to run the Windows version on a Mac in a VM or similar.</p>
