      <p><em>I just bought ScanFont 5 and I am very disappointed. It simply doesn't work. When I try to import EPS file (saved as EPS for Adobe Illustrator 3 and other versions), it doesn't work at all. "File is damaged or contain invalid data.". When I try to export the curves to FontLab, it says "Unable to find FontLab server application" followed by "FontLab server is not responding in time. Pleas witch (!) to FontLab and close unnecessary modal dialogs." Of course, there are no opened dialogs in FL.</em></p>
      <p>They sent me some kind of a workaround which was not useful anyway. There was no way to use ScanFont with vector data on my Windows 64bit system.</p>
