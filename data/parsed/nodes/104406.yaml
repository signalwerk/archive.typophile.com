      <p>There is another route for auto-tracing-in-batch and it’s a free one too. The <a href="http://www.fontmaster.nl/Downloads/Light/Windows/FM_Light_270.msi.zip" rel="nofollow">Light version</a> of DTL FontMaster contains a fully functional version of <a href="http://www.youtube.com/watch?v=5WNDdGu9Pqg" rel="nofollow">TraceMaster</a>.  With TM you can auto-trace multiple TIFF ﬁles at once and convert these to a BE glyph database. Open the BE ﬁle in BezierMaster (Light), generate a PS Type1 font and open this in whatever font tool you prefer (or stick to BM). Another option is to trace in IKARUS format and to use TransType to convert the IK ﬁle to any other format.</p>
      <p>Although the auto-tracer in Illustrator CS6 is pretty good IMHO (much better than in previous versions), TM is the best auto-tracer in our and any other parallel universe (really!). The algorithms were developed decades ago by Dr. Jürgen Willrodt for a large American type foundry that lost all IKARUS data and that had to convert printed glyphs in a jiffy (it’s blazingly fast too). It’s a bit older technology though, and therefore there are a few restrictions:</p>
      <p>–the TIFF ﬁle should be a B/W bitmap<br>
      –no layers nor any compression are allowed</p>
      <p>You could give it a try. My students are in general quite pleased with it.</p>
      <p>FEB</p>
