    <p>I have always been artistic.  When I was a kid I use to pain watercolors of dinosaurs and fighter jets.  When I was in middle school it was comic book character and rock and metal band logos.  In high school I took a class called Drawing and Commercial art, and it was around that time that I really seriously became involved in design, especially concert posters and album covers and the like.  I recently started going to school for design after a few false starts.  One thing I have noticed is that I clash with some of my instructors over design... because I am so art oriented they have a hard time with that because it's not rigid or organized or whatever.</p>
    <p>I recently heard David Carson remark on the following question... where does art end and design begin?  It's a question I have been thinking a lot about, especially since I'm at a crossroads in my education.  So what is the difference?  Where does one begin and the other end?</p>
