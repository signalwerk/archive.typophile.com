      <p>Chris, though I agree in general, there is an exception. As Patty noted in the other thread on 'best designer', some people are commissioned to do art. </p>
      <p>If a maker of things visual has a client that wants art, then that maker can be an artist rather than a designer. So it seems the key issue of art vs design is not only whether there is a client, but whether the priority is on serving primarily needs and goals of the client, or primarily the creative's own personal expression.</p>
      <p>edit: I cross posted with you, Chuck. The case of Rembrandt I think shows that the difference is in the purpose of the work rather than the result. You can have dreadful, failed art that is still clearly art, in terms of the goal of self-expression. And you can have things that are clearly design, but are artistically superior to much art. </p>
      <p>So maybe Rembrandt had to put a priority on some of his portraits being good likenesses and flattering, but they ended up great art anyway. And if I executed a portrait with self-expression in mind, I am sure the result wouldn't be any Rembrandt!</p>
