      <p>But even that’s a pretty iffy distinction. Designers today convey messages without words when literacy/language barriers occur much like the way religious art of Europe was used to reach the illiterate majority. And words and images have been used together since language began, when A looked like V and meant <em>cow</em>.</p>
      <p><cite>Perhaps art historians have ignored commercial work like posters and play bills as ‘non art’ unless the artist involved also had a painting career.</cite></p>
      <p>It seems to me that they tend to focus on the starving artists and the weirdos. Just about every art historian considers Lautrec relevant to the era of the impressionists and post impressionists; but plenty entirely ignore Mucha when discussing art nouveau while others credit him with starting it. What’s the difference? One was an inbred alcoholic who drank himself to death, the other was disciplined, internationally famous, and enormously successful. I suspect that, had Warhol found ways to work his critiques of culture into his advertising as opposed to turning to “fine art” he would be ignored by  mainstream art historians and known only to designers.</p>
