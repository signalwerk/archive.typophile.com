      <p>Here’s a fun one: how much classic fine art should really be classified as design? Why do art historians seem to think that the Sistine Chapel and all of the paintings inside are great examples of fine art that have more in common with the work of Mark Rothko than with the environmental design that Vignelli and Associates did at St. Peter’s in New York? Why do the great Roman sculpture copyists get associated more with Rodin than with Aalvar Aalto? Why are the great scribes who produced the <em>Book of Kells</em> covered in surveys of western art history, as well as William Morris, but one has to pick up design history books to find mentions of Jan Tschichold, and a biography to understand the work of Paul Renner?</p>
      <p>I think that one reason the line between art and design is so hard to define is that even art historians have a hard time dealing with the magnitude of the break with tradition that occured in the Twentieth Century. I believe that today’s designers are the scions of the masters that preceded modernism, and that what people now refer to as fine artists are a very different animal following—and establishing—an entirely new tradition.</p>
