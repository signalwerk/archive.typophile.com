      <p>Chris, I agree to a certain extent, but to me design is all about style.  When I say style I mean style, not kitch.  I agree the the retro for the sake of retro thing is dumb and overused.  But style is not necessarily genre... for example, Saul Bass had a distinctive style to everything, from his more rigid identity work to his fun and playful movie posters.</p>
      <p>This is where a lot of designers frustrate me.  I feel that a lot of us get into a mindset of being information architects.  And I think that design is more.  Sure, you can design a brochure that looks pleasing to the eye and presents all of the information in a great way.  But I feel that if we are hired by a client we are doing them a disservice if we remain sterile in our work.  So instead of a good brochure, make an amazing brochure.  If we are to do the best for our client we continue to come up with innovative ways to present the information.</p>
      <p>Part of what we are paid for is presenting a creative solution.  So throw yourself into it.  If a client is paying you $75 an hour (or more depending on who you are), make it worth their while.  Don't give them vanilla.</p>
