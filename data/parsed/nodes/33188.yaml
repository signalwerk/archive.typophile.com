      <p>im inspired just by reading this wonderful thread.</p>
      <p>personaly i see design and art not as contradictory but as a kind of prism, a gradient if you will of colors. one side is artist, the middle is designer, and at the far end of the other side is advertiser.</p>
      <p>when i started learning design, we were taught that being "arty" is okay but not for the purpose of being a designer. then later i found out that art can be intertwined with design, if the conditions allow it. personally i aspire as a student now and as a designer in the future, to do art as well as design, and to touch different shades of this theroretical prism. if we are talking about branding, then it's supposed to better for the client to have a designer with strict advertising skills. but now im working on rebranding a pro-peace organization called "peace core" (some of you may have seen it). as a part of this rebranding, i had to reccomend and design ways to advertise the organization and to generate responces and awareness amongst civilians, about recent events that are related to the palestinian-israeli relationship. my suggestion, (alongside guerilla advertising) was to create art instalations on the street. and so an important part of branding process, included artistic installations and basically art. (important to notice that this wasn't a real job but a class in the design college).</p>
      <p>art and design can leave in peace side by side. when designing certain products it's more possible. if you are designing things like books or books covers, you can use artistic measures as well as design measures.<br>
      so i think it's possible if you really want and willing to try doing that.<br>
      i can't think of myself withought art, i think i have been a much more boring designer. i have another project where we were told to design a book, and i think that using my artistic skills, i designed the book with images and text that respond to the text, thus weaving my "unique hand" into a product that requires design solution.</p>
      <p>by the way - about artists - i understood something about art. i was offered to do a big exhibition of my art in my school. the head of the design department is the curator of the exhibition, and when we sat to  decide which of my works to exhibit and which not, he chose some that i liked and some i liked less. he also turned down on several works i wanted to exhibit. i understood that the institution i exhibit in (this case it's my college) has it's needs and it's perception. the curator has his own mind of what to use, and what would be un suitable. this resembles design, and i think that it happens all along the art world.</p>
      <p>i think (from my brief brief knowledge in design) that designers aren't just humble servile vassals of a client, we have qualities that the client has chosen us for. some can appreciate it, some can't.</p>
