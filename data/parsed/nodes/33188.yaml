      <p><cite>This is where a lot of designers frustrate me. I feel that a lot of us get into a mindset of being information architects. And I think that design is more.</cite></p>
      <p>It can be hard to resist the temptation to try and be Josef Müller-Brockmann or Alan Fletcher; I think that the answer is to find a sweet spot in the middle, and that is not an easy thing to do. It does not seem that the constant influx of technology into, and the effect said technology has on design, is helping much. But few things worth doing are done with ease. </p>
      <p><cite>I saw the amazing Hokusai exhibition...I wonder what his conception of what he was doing, in terms of art vs design.</cite></p>
      <p>That was one amazing exhibition. It left me with the feeling that Hokusai transcended what most of the world understands about art and artists. I felt similar, albeit less powerful, effects when I walked through the Orsay and the Uffizi. </p>
      <p>Maybe the problem with trying to really understand art and design is that creativity, and appreciation of creativity’s fruits, is an essential part of our brains and minds. As the old saying goes, if it were simple enough for us to understand, we would be to simple to understand it. </p>
      <p>Or maybe the answer to these questions is so simple that we won’t resolve it by thinking at all.</p>
