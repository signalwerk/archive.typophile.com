      <p>Hiroshige has made me wonder if discussions like this should be conducted with the works of the greatest matters as part of the discussion, or if they should simply be placed into some different class requiring different discussion. Of course that would also require defining who is and is not a great master, but I digress...</p>
      <p>There are countless unknown artists for all of the knowns. Hokusai is probably the greatest artist to every handle a brush, Michaelangelo the greatest to carve stone, and so on. What happens when we consider the common art and common artists; the pottery and painting produced by our mothers and grandmothers? What about the countless reports, advertisements, and magazine layouts with no design credits? Should we really be examining art at that level, which accounts for far more of the world’s creative output than does the work of masters? And when we do, does the expression of the Sunday painters and compromising unknowns designers indicate a much greater split betweeen art and design than the work of the masters, or does is show us that there is even less contrast than we previously thought?</p>
