      <p>A classic discussion of art vs craft is in R.G. Collingwood's <a href="http://www.amazon.com/Principles-Art-Galaxy-Books/dp/0195002091/ref=sr_1_13/002-0804764-7091213?ie=UTF8&amp;s=books&amp;qid=1177071260&amp;sr=8-13" rel="nofollow">Principles of Art</a>.</p>
      <p>Basically the generally accepted view, probably influenced by Collingwood, is, as Miss G. says, that the difference is in the goal: art is aimed at self-expression or communication of a personal vision, whereas design is in service of another purpose. That may be a comfortable chair, a readable book, a liveable house, and advertisement that sells a product. Aesthetics is always part of design, but it is in a service role--serving the purpose of the design. </p>
      <p>Thus the difference is not in use of materials or even in aesthetic merit, but purpose. Thus there are said to be Frank Lloyd Wright houses that are great aesthetically but their roofs leak and the kitchens are too small for use. Great as art, but failures as design. </p>
      <p>As I wrote in the other thread, to me what is exciting about design is that it is part of the texture of daily life, and makes other people's lives better. The down side for some is that design has a service role, not a starring role. There is an essential humility about good design. What the designer gets in return for that humility is a widespread presence and usage that art almost never has. </p>
      <p>Another aspect that Collingwood writes about is that in artistic creation the artist doesn't know the end goal, but it is discovered in the artistic process. The craftsman knows much better his or her end goal, and what constitutes success in achieving it. This distinction is a bit more problematic, as there is also discovery in a design process, but I think there is something in it.</p>
