      <p>Thanks for all your thoughts about what separates art and design.  It does seem like quite a murky subject, doesn't it?</p>
      <p>Here's my two cents: I actually didn't start out in design via the traditional way of going to school, getting an internship, then getting a job.  I started out doing design for bands and concert promoters, and realized it really was what I wanted to do because I recognized the art behind it.  I think the people who are arguing that design is driven by the client are correct, but it is moving to where designers are starting to become artists.  Most of the famous designers, from Saul Bass to David Carson, have a distinct style.  Even Paula Scher, who many people say doesn't have a specific style, has something there that makes me say "I bet Paula Scher did that".  There are still the ad agencies and design houses that do things the traditional way, and they aren't going to go away, but I am starting to see that there is a commodity out there.  People hired Carson because they wanted that style.  If someone wants a simple corporate website, they're going to go with the local design house.</p>
      <p>Someone made the comment about Commercial Art... I like that term a lot!</p>
