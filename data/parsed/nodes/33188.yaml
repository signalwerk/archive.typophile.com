      <p>There is a difference between "a certain style" and deducing who the designer is. I think the whole concept of style for design (other than things like fashion/clothes) is counterproductive. If someone after-the-fact lays a style label on a designers work, that is bad enough. If a designer tries to emulate a style when they do their work instead of solving the clients communication problem, then they are pißing in the wind and full of themselves. If a designer honestly approaches a design problem with the tools of his time, there may be an indication that they worked during a particular era. That is not the same as the retro-is-everything guys who look for a past era to rip off just for the "Look" rather than solving the communication problem. It is an issue of honesty, not style.</p>
      <p>ChrisL</p>
