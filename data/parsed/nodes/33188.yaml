      <p>But not everyone likes rock and roll...<br>
      In the end everything from art to design (if you want to distinguish the two), music to movies, etc. is still in the eye of the beholder meaning that not everyone will appreciate a piece of art (/design/whatever...) as much as the next person. You can argue about the fact that there's always a group of ignorants that don't "understand" the art, but when you throw music into the whole discussion, it's a lot clearer. Who of all people who enjoy music actually know anything about sound technique?<br>
      Besides, some of what we call the greatest artists of all time now we're not recognised as such in their time and had to struggle to make ends meet. You could say that time is the best judge to test something's value, but then again, not everything that survives is great. I believe that art is indeed in the eye of the beholder &amp; that whatever ends up in a museum is probably enjoyed by more people, but not necessarely better than a scribbling on a wall somewhere. Personal taste is always a factor in judging a piece of work (sure, there's are some "basics" (such as technique) that might be "objectively" discussed) &amp; where the majority of personal tastes agree, that's where art is born (or broken), but it remains a matter of taste. I generally like to see all these things as a sign of the times &amp; part of our culture which is now broader than ever.</p>
