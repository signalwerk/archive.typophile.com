      <p>Chuck, your ignorance of how an artist describes form and <em>how</em> to compose (especially a master) is holding you back. Note: I did not say <em>what</em> to compose.</p>
      <p><em>although that thought is very idealistic, i think most people — including the majority of masters — are probably a bit more pragmatic. rembrandt altered work to suit patrons, as did botticelli, ghirlandaio and da vinci. even the great galileo knew the pressures of the day.</em></p>
      <p>Rembrandt never compromised his brush. Sure subjects in his canvas may have changed (aka the elements of the composition) - but <em>how</em> he described mass and space was <em>never</em> conducted by his patrons, could be why he was commissioned in the first place? Again, the subject matter may change - but the technique stays constant. Please try to understand the difference.</p>
      <p>Furthermore Chuck, to find your voice (what you glib as 'style') in any given discipline is a great great thing. It's a blessing - not a curse ...at any age.<br>
      And those that do have a voice and have found a way to communicate their 'art' (including designers of Type), go on to inspire others not only from their work, but also from their writtings. A classic case are the complete letters of van gogh - who can't learn from his voice?</p>
      <p>'nough said.</p>
      <p>_________<br>
      Hiro</p>
