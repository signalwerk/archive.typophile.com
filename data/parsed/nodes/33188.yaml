      <p>From what I understand Bass had a friggin tight technique. </p>
      <p>I think most people don't understand what 'art' is. Probably because of crap cliches like "art is in the eye of the beholder".</p>
      <p>But, just as all noise is not music, all paint/graphics is not art. Noise can <em>become</em> music when it comes from one who has developed an understanding of technique - ie a Mozart, <em>the</em> Rolling Stones et al.. But without technique it's still just noise.</p>
      <p>When technique has been mastered, then the heavens open up. You can sleeze a technique, rock a technique, or be as refined and elegant as the day is long.</p>
      <p>But yeah I agree, first must come sound technique. Technique is everything - purpose is everything too. And for those who can master 'technique' and get a grip on 'purpose' then 'expression' can have a chance. And that, I believe, is where 'art' begins.</p>
      <p>it's only rock and roll</p>
      <p>But I like it</p>
      <p>like it </p>
      <p>yes I do...</p>
      <p>_________<br>
      Hiro</p>
