      <p>Graphic design as we know it is a fairly new profession. I might guess that if we begin looking at when words and pictures were created together as a piece, we might get closer to a defining moment. The words would also have to be with purpose and meant to augment the image with a message. Georges Braque's still lifes with "Journal" in the mix don't cut it but perhaps the work of  Toulouse-Lautrec really bridges the gap. Perhaps art historians have ignored commercial work like posters and play bills as ‘non art’ unless the artist involved also had a painting career.<br>
      Andy Warhol studied art at my alma mater CMU, and we had some of the same teachers. Robert Lepper was one of them. He spoke of Warhol occasionally and mentioned he had taken some graphic arts classes there as well. Andy used combined graphic arts images with his fine art work as a mode of self expression rather than for a clients need.</p>
      <p>ChrisL</p>
