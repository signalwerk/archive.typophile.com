    html: <p>Well, as a kid &amp; adolescent I was often referred to as "an artist" &amp; since then I've come to dislike the term. It was also -in a very "box minded" way- used to describe parts of my personality that had absolutely nothing to do with drawing (eg. a kind of laissez-faire attitude, an -occording to others- weird sense of dressing, sleeping till noon &amp; staying up all night) &amp; apparantly most of these prejudices have survived till today. And now, the same is happening with the word "designer". Proclaiming oneself as either an artist or a designer is just pretentious &amp; as stated in previous posts often an easy excuse. I don't like to be referred to as either, but I'd rather have myself described as a (graphic) illustrator. That's the most objective describtion I can think off &amp; I hate the idea of myself or anyone else for that matter putting me in a predefined box. I also like to write every now and then &amp; everyone that has read some of my texts defines it as poetry, but the same problem arises here. Poetry is also something for others to decide, but every arty farty term now comes with a denotation due to misuse by pretentious wannabe's. Therefor I simply refer to my texts as lyrics without music or simply texts. My drawings or designs if you will (the term can be broadly interpreted &amp; can also just mean graphic work) are just drawings. Nothing more, nothing less.</p>
