    html: <p>It's interesting the way that the word "art" was used in commercial graphics. Prior to digitization, "the artwork" meant the art board with the type galleys and PMTs pasted up on it, suitably keylined with rules drawn for picture areas and crop marks, and with cut rubylith overlays and tissue overlays indicating colour breaks. When ready to go to the film house, this was "finished art". Put together by the "paste-up artist"/"mechanical assembly artist". So "art" referred quite specifically to skilled handwork which was an interim step in the production process.</p>
    html_clean: <p>It's interesting the way that the word "art" was used in commercial graphics. Prior to digitization, "the artwork" meant the art board with the type galleys and PMTs pasted up on it, suitably keylined with rules drawn for picture areas and crop marks, and with cut rubylith overlays and tissue overlays indicating colour breaks. When ready to go to the film house, this was "finished art". Put together by the "paste-up artist"/"mechanical assembly artist". So "art" referred quite specifically to skilled handwork which was an interim step in the production process.</p>
