      <p>OK, so you're a student and you have a design problem to solve.<br>
      Some of you will seek the direction that's "out there", working with precedents that have proven effective, and in this you're learning to sync up with the way that professional design culture works, becoming familiar with its techniques, styles and nuances. Others will take a more experimental approach, which is likely to be more expressive of what's inside. There's room for both approaches to design, and anything on the spectrum, because clients vary. Just be aware that David Carson's kind of design, revered though it may be in the metaculture of the design world, and the kind of clients who support that kind of approach/attitude, are in the minority in the workaday world.</p>
