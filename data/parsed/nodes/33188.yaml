      <p>Artists like a 'Rembrandt' were/are commissioned because of their own individual brush. They have achieved a clearity of understanding not only how to paint but what to paint (ie composition). Rembrandt's was unique in many ways - command of light and shadow, quality of line - are just two of the more obvious characterists to <em>his</em> brush.</p>
      <p>Designers are no less individual, they just use a different kind of brush - like Alexander McQueen, <a href="http://www.alexandermcqueen.com/flash.html" title="http://www.alexandermcqueen.com/flash.html">http://www.alexandermcqueen.com/flash.html</a> , Ralph Lauren <a href="http://www.polo.com/frontdoor/index.jsp?videoflash=false&amp;flashversion=9" title="http://www.polo.com/frontdoor/index.jsp?videoflash=false&amp;flashversion=9">http://www.polo.com/frontdoor/index.jsp?videoflash=false&amp;flashversion=9</a></p>
      <p>And as for the team player, compromise your unique voice, argument goes take a look at these two ukiyo-e graphic artist - Hiroshige <a href="http://en.wikipedia.org/wiki/Hiroshige" title="http://en.wikipedia.org/wiki/Hiroshige">http://en.wikipedia.org/wiki/Hiroshige</a> , and Hokusai  <a href="http://en.wikipedia.org/wiki/Hokusai" title="http://en.wikipedia.org/wiki/Hokusai">http://en.wikipedia.org/wiki/Hokusai</a> , are well known examples. These graphic artist shook up the whole global 'establisnment' - and didn't even touch their own work. It was the unsung wood block carvers who produced their work - and yet Hiroshige and Hokusai (amoungst many other fine wood block print graphic artist) each maintained a very distinctive voice.</p>
      <p>I don't buy into the argument that commercial art is to appease the public and fine art is to appease the artist because no master that I've known would/could be pushed, no matter where their work is to be used. I'm sure that if you were to tell a <em>master</em> how to compose their work and try to instruct them on how to depict a form - they would toss you out of their studio in a heart beat.</p>
      <p>Having said that - the accomplished Type, Graphic, Fashion, Canvas, Sculpture etc., etc., 'artist/designer' are well aware of the guidelines they not only exist in - but they enjoy pushing those boundaries however possible, whilst maintaining their unique voice.</p>
      <p>Unfortunately I understand that not everyone has/can develope their own unique voice, or simply have bills to pay, and must make 'compromises' along the way - then yeah sure, portraits are repainted to the buyer's taste and graphics are pushed by the client's taste.</p>
      <p>And for those who don't believe in the Individual as an artist/designer - <a href="http://www.segmation.com/" title="http://www.segmation.com/">http://www.segmation.com/</a> &amp; <a href="http://www.paintbynumberz.com/" title="http://www.paintbynumberz.com/">http://www.paintbynumberz.com/</a> </p>
      <p>_________<br>
      Hiro</p>
