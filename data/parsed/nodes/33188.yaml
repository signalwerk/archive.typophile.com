      <p>Chuck and William,<br>
      I added my second post as a way of clarifying the first. I realize that there has been commissioned art for centuries. The pieta, the ceiling of Michaelangelo, etc. You might call these things design in art's clothing. If the Pope or the Medici, or the wealthy patrons of Rembrandt either specifically said "This is what I want, do it this way" or if was just implied by their position of power, criteria were set with a purpose to be achieved and a price was paid for that. There is no doubt that an artist with the talent of Rembrandt would certainly be quite artful in his execution of the portrait contract. I wonder what he would have done if he could just do it his own way? To me, when the message is clear to convey and the terms are agreed upon, it is design--or at least "by" design. For my taste in art, the stuff I quickly pass by in any museum or gallery, is the commissioned portrait of the wealthy and powerful. Even though they may be exquisitely painted, they are typically boring to me. I can admire them for great articulation and painterly skill--even for getting the rich old bugger to agree to pay for the thing but I would rather see something done without the need for ego-stroking and anointment to deity of the commissioner.</p>
      <p>ChrisL</p>
