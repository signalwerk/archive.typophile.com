      <p>&gt;Hokusai is probably the greatest artist to handle a brush</p>
      <p>I saw the amazing Hokusai exhibition here at the Smithsonian recently. Strangely enough, he impressed me more as a designer and illustrator than an artist in the Western sense. You could see he was absolutely the father of modern design in his use of space--notan--and assymetric balance of flat colors. His mastery is just breathtaking; I have not seen an equal to that.  </p>
      <p>Though his stuff is brilliantly dramatic and eye-catching, somehow I missed the inner light of soulfulness that you see in Rembrandt, some of the Chinese scrolls, and others. </p>
      <p>I wonder what his conception of what he was doing, in terms of art vs design.</p>
