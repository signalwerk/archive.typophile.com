    html: "<p>I think design IS a form of art (the new Pop Art), but hasn't been recognized as that yet. The difference is maybe that art is usually not made for someone else &amp; should only satisfy the artist. In design however the client has the final word &amp; he has to be satisfied even if that means leaving the designer in complete disagreement. The times, they are a-changing &amp; just as much as Pop Art was first sniffed at by the art connaisseurs, it will take some time for design to find its way to recogntition. Today, there are more means &amp; tools for reaching more people than ever &amp; there's no longer a need for a \"bridge\" (read: galleries and such) between the artist &amp; his audience. Design is a far more direct &amp; interactive kind of art, but I'm sure within a few years the already fine lines between art &amp; design will blur even more &amp; eventually disappear. In the future there will probably be no more need for art as such, because it will be all around us. Most people just still need to learn to look at things with different eyes. It's about changing the state of people's mind &amp; time will surely do that for us.</p>"
