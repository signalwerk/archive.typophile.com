      <p>What does style have to do with being or not being sterile, with throwing yourself into a project or not, with a good brochure or an amazing brochure? Nothing!<br>
      Style is one of those words art reps throw around to hype up something. A design should stand on its own without the need to be pigeon holed into a style.<br>
      Saul Bass's "rigid identity work" was done by the folks who worked for him (like one of my old classmates). Saul was the name and the connection. His love was motion work and he was damn good at it. I fail to see a continuity of style between his "Walk on the Wild Side" and "Around the World in 80 Days" titles. Style says "It is all about me" instead of it is all about a good [great, amazing, stupendous] solution to a communication issue. </p>
      <p>ChrisL</p>
