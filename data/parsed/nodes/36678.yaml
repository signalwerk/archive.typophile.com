    <p>Hi,</p>
    <p>I came across this logo recently for Centropolis and love the condensed deco font. I tried finding it but couldn’t. Silhouette is the closest I got: <a href="http://www.myfonts.com/fonts/letterperfect/silhouette/silhouette/" title="http://www.myfonts.com/fonts/letterperfect/silhouette/silhouette/">http://www.myfonts.com/fonts/letterperfect/silhouette/silhouette/</a></p>
    <p>Any suggestions? Any fonts that look like this?</p>
    <p>Thanks, </p>
    <p>Tal</p>
