    html: <p>Interesting. <br> <br>I've got Czech type on the brain right now, as I'm reading through the back issues of TYPO and spent last week going through people's reports from ATypI in Prague last year, so I hope you'll forgive me for observing that this seems a little like a more rounded version of Vojtech Preissig's Antikva. It's more rounded, of course, but the pillowy serifs remind me of Ionic capitals (on columns). I'm not sure they work, but they're certainly different. <br> <br>The choice of Kafka for the specimen text is apt, because the typeface as a whole reminds me a little of Edward Gorey's handwriting. <br> <br>I like the squared-off interior spaces in the C, D, G, O, and Q. The U doesn't work for me, though</p>
