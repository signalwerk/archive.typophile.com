    date_raw: 1 Mar 2005 — 1:19pm
    votes: null
    html: "<p>Hi Noah, <br> <br>It looks like your serifs are all the same length regardless of glyph or location. I'm currently investigating how serif length affects spacing. There are a few that should be longer just for balance: Right side of the r. RIght side of the f. Right side of the F etc. <br> <br>Also, glyph construction can give you bad spacing. the construction of your t is causing problems (plus it's spaced too tight on the right). The ear on the g is another difficulty. See the ga combination. <br> <br>It all looks slightly loose to my eyes. (Though i'd probably lengthen the serifs as a start if this is for extended reading as it seems to be. Note: this will change its character a lot.) I also find the caps slightly dark. <br> <br>Keep it up! <br>R</p>"
    html_clean: "<p>Hi Noah, <br> <br>It looks like your serifs are all the same length regardless of glyph or location. I'm currently investigating how serif length affects spacing. There are a few that should be longer just for balance: Right side of the r. RIght side of the f. Right side of the F etc. <br> <br>Also, glyph construction can give you bad spacing. the construction of your t is causing problems (plus it's spaced too tight on the right). The ear on the g is another difficulty. See the ga combination. <br> <br>It all looks slightly loose to my eyes. (Though i'd probably lengthen the serifs as a start if this is for extended reading as it seems to be. Note: this will change its character a lot.) I also find the caps slightly dark. <br> <br>Keep it up! <br>R</p>"
