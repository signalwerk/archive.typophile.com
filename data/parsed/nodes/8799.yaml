      <p>Well, for whatever reason this hasn't elicited much interest. Nonetheless, I'm still working on it. This sample has what I hope is the final form of the roman style. I've added some semi-random ligatures and swash characters which are fun, though I'm not certain how useful. I've set the first chapter of Jerome K. Jerome's Three Men in a Boat, along with a bunch of other stuff in an attempt to explore the range of the face. It also contains a very rough draft of the italics. I'd really, really, really love some feedback, especially on the italics. Thanks in advance. <br></p>
