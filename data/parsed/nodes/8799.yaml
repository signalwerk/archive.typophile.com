  - id: 57736
    user: 5267
    date: 2005-01-31T11:10:00
    date_raw: 31 Jan 2005 — 11:10am
    votes: null
    html: <p>Forrest, thanks for the "Too tight!" Here is what is going on. Tracking is at zero. Kerning is set to Optical. The metrics/kerning in the font is nearly identical to the optical setting in InD, though not quite as smooth. The problem is that I tweak the metrics and kerning a lot as I work and at high magnification on a decent display a 5 unit sidebearing looks ample. Most of the glyphs have 5 units for the sidebearing or 1/20th of an EM. I haven't run across a recommended width but seeing it on screen at 11pt it is unpleasant. However, printed at 600dpi (default for most laser printers) the color is very nice and even, although reading it does feel a little off. I have considered adding 1/10th of an em to either side. There is a hairspace character in the font set at 55 units. That seems too wide a space to have between each glyph, but perhaps 20 units on each side would work. I don't really know. <br> <br>It is interesting that you specifically mentioned Caslon, an early version of the face was based on several different digital interpretations of Caslon and the over all proportions  and x-height are still relatively faithful to that model. My initial concern was that it would be seen as a Caslon knockoff. However, reading it on paper it retains the features I sought to introduce, what you have termed expressionistic started out as an exploration of how much tension I could place between the edge of enclosing space (the white space around a glyph) and the edges of the space the glyph encloses.  I think it works as a text face precisely because the exterior of the forms is familiar, thus not challenging to read but the interior establishes tension and horizontal movement, the effect at 8pts is, for me, to pull my eye across the text. I'm pleased with how this experiment is shaping up. I'd originally feared that the experiment would hinder the goal -- that being to create a useful book face. <br> <br>Kevin, I'm very pleased that you enjoy my interrobang, I've always had a fondness for the character but found the standard rendering to sedate. Thanks also for pointing out the overly wide D and smallcap D. I'm also very pleased that my lc 'g' works for you as it is one of my favorite characters to draw but I find it challenging to strike a balance between expression and usefulness. The swash 'g' was a discarded character that I did not want to let die, and, while it is somewhat out of place, I imagine someone could find a use for it. <br> <br>Thank you both. I will probably have another revision of the roman if I can get some free time and then I need to put some serious effort into the italic.</p>
