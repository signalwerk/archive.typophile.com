    date_raw: 24 Apr 2005 — 8:32pm
    votes: null
    html: <p>You need to lower the contrast for the italic. Maybe that means making it less geometric and more curvy, but the current version looks spindly on the page. Also, looking at this specimen makes me think that the N needs attention in both the italic and the roman. <br> <br>The italic r looks like it's dripping fluid off its terminal, a vivid and not entirely pleasant impression. <br> <br>Make the e, x, and z more cursive. <br> <br>The counter in the k needs work (it probably needs to be smaller). The counter for the g, by contrast, needs opening up; it looks squashed. <br> <br>Why do you want your italic to occupy the same width as the roman? Traditionally, italics are narrower than the romans they accompany.</p>
    html_clean: <p>You need to lower the contrast for the italic. Maybe that means making it less geometric and more curvy, but the current version looks spindly on the page. Also, looking at this specimen makes me think that the N needs attention in both the italic and the roman. <br> <br>The italic r looks like it's dripping fluid off its terminal, a vivid and not entirely pleasant impression. <br> <br>Make the e, x, and z more cursive. <br> <br>The counter in the k needs work (it probably needs to be smaller). The counter for the g, by contrast, needs opening up; it looks squashed. <br> <br>Why do you want your italic to occupy the same width as the roman? Traditionally, italics are narrower than the romans they accompany.</p>
  - id: 57757
    user: 5267
    date: 2005-04-25T01:34:00
    date_raw: 25 Apr 2005 — 1:34am
    votes: null
    html: <p><i>Why do you want your italic to occupy the same width as the roman? Traditionally, italics are narrower than the romans they accompany.</i> <br>Good question. There are several reasons. The first is purely aesthetic, I like the way it looks. The second is a more practical consideration, while I understand that the italic form has, historically, been more economical while retaining legibility, no one really uses italic as an alternative to roman in current practice, instead the italic is used for emphasis. A wide italic is just as capable as a narrow one for this purpose. Yet another reason is that if you do a tight layout and then need to italicize a lot of text, you have to redo much of the layout. If the italic occupies the same amount of space the substitution won't cause any problems. Finally, I don't like reading large blocks of text in normal italics, wider glyphs are more readable to my eye.</p>
    html_clean: <p><i>Why do you want your italic to occupy the same width as the roman? Traditionally, italics are narrower than the romans they accompany.</i> <br>Good question. There are several reasons. The first is purely aesthetic, I like the way it looks. The second is a more practical consideration, while I understand that the italic form has, historically, been more economical while retaining legibility, no one really uses italic as an alternative to roman in current practice, instead the italic is used for emphasis. A wide italic is just as capable as a narrow one for this purpose. Yet another reason is that if you do a tight layout and then need to italicize a lot of text, you have to redo much of the layout. If the italic occupies the same amount of space the substitution won't cause any problems. Finally, I don't like reading large blocks of text in normal italics, wider glyphs are more readable to my eye.</p>
