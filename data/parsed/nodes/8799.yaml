    html: "<p><i>don't try to make the kern-less spacing perfect</i> <br> <br>Yeah. After thinking about this some more, I think the best approach would be to create a text without digraphs in need of kerning. Make the spacing of <i>that</i> perfect, then graduate to text with full digraph coverage to do the kerns. <br> <br>Noah: the spacing is <i>much</i> improved. It shouldn't be too hard to figure out what to kern - just look for spacing that looks too loose, and tighten it up a touch. Spacing a la Letters of Credit will result in very few pairs that need loosening; f) is the only one that readily comes to mind.</p>"
