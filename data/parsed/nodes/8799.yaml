    html: <p>Whoah! Too tight! Too tight! The character spacing in your example setting is kind of insane. <br> <br>The face itself feels more balanced now, and strikes an interesting balance between the "antiqued" rough fonts like Antique Caslon and the Czech fonts I was talking about before. I'm still not sure how I feel about those convex serifs, though. <br> <br>The italics feel a little too straightforward next to the roman. The figures work better now, though. Those swash-ligatures are ridiculous. I'm pretty sure in a good way, too. <br> <br>Aside from that, I don't have a lot to add. Good choice of setting!</p>
