    date: 2005-02-26T16:57:00
    date_raw: 26 Feb 2005 — 4:57pm
    votes: null
    html: "<p>Noah: a suggestion. Delete all of the kerning pairs in the font. Now run some text (use real text, not my nere ntin; the latter is best suited to finding rare badly spaced pairs in an otherwise solidly spaced font). Tweak side bearings only until the spacing looks fairly decent, resisting the urge to kern. <br> <br>Then, when you feel there's nothing to be gained from tweaking the side bearings, start in on the kerning. Be careful to avoid overkerning (like your small-cap AV), but at the same time don't be afraid to kern pairs that really need it (like ab). <br> <br>It's hard to tell which of the spacing problems are due to side bearings and which are due to kerns (which is why I suggested removing all kerns while working on the sb's), but I can offer some educated guesses based on your sample: rsb on f is <i>way</i> too large; you'll want to plus-kern special pairs like fb fh fk f). rsb on j is too small; remember, you're working from the main stroke, not the tip of the serif, so the right numeric value may seem alarmingly high. lsb on b is probably too large (ib seems to loose, and shouldn't be). rsb on u is a shade too large (probably d too, but it's not so bad). Both lsb and rsb on x are a bit too large. <br> <br>Side bearings on rounds (obdecopq) probably need to be 5-10 units (out of 1000) bigger; your round-round spacings are consistently too tight. <br> <br>You've got some kind of problems with ligs; fe is way too tight but ffe is way too loose (as is ist). Once you get into kerns you should make sure that the ligs are consistent with the base letters. <br> <br>Best of luck! I'm struggling with the spacing in my own font, so I can definitely appreciate how hard it is to do well.</p>"
    html_clean: "<p>Noah: a suggestion. Delete all of the kerning pairs in the font. Now run some text (use real text, not my nere ntin; the latter is best suited to finding rare badly spaced pairs in an otherwise solidly spaced font). Tweak side bearings only until the spacing looks fairly decent, resisting the urge to kern. <br> <br>Then, when you feel there's nothing to be gained from tweaking the side bearings, start in on the kerning. Be careful to avoid overkerning (like your small-cap AV), but at the same time don't be afraid to kern pairs that really need it (like ab). <br> <br>It's hard to tell which of the spacing problems are due to side bearings and which are due to kerns (which is why I suggested removing all kerns while working on the sb's), but I can offer some educated guesses based on your sample: rsb on f is <i>way</i> too large; you'll want to plus-kern special pairs like fb fh fk f). rsb on j is too small; remember, you're working from the main stroke, not the tip of the serif, so the right numeric value may seem alarmingly high. lsb on b is probably too large (ib seems to loose, and shouldn't be). rsb on u is a shade too large (probably d too, but it's not so bad). Both lsb and rsb on x are a bit too large. <br> <br>Side bearings on rounds (obdecopq) probably need to be 5-10 units (out of 1000) bigger; your round-round spacings are consistently too tight. <br> <br>You've got some kind of problems with ligs; fe is way too tight but ffe is way too loose (as is ist). Once you get into kerns you should make sure that the ligs are consistent with the base letters. <br> <br>Best of luck! I'm struggling with the spacing in my own font, so I can definitely appreciate how hard it is to do well.</p>"
