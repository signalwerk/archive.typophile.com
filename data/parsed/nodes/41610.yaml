    html: |-
      <p>i believe it was jean paul sartre who said:</p>
      <p>“hell is clients”</p>
      <p>just kidding.</p>
      <p>i think there are a lot of reasons for this.</p>
      <p>1/ they are generally paying a good deal of money, for which they<br>
      are somehow responsible (their job or the success of the company)</p>
      <p>2/ design has an inherently subjective component, so there will<br>
      always be room for debate (as opposed to other professional<br>
      relationships, e.g. if my construction manager tells me i need a<br>
      certain kind of concrete to carry the load, i am unlikely to argue)</p>
      <p>3/ design - especially with the advent of DTP - always feels<br>
      somewhat “graspable” by clients, i.e. the feeling that they can<br>
      do it themselves  - it’s often difficult to quantify the value of<br>
      our experience, expertise, and intuition.</p>
      <p>sometimes i think about finding a small, oceanfront town in italy<br>
      where there is an old man who builds boats by hand and has no<br>
      apprentice because no one wants to do it anymore. i’d become his<br>
      apprentice and make wooden boats by hand and drink a lot of wine.</p>
      <p>then i wouldn’t have to deal with clients anymore. ;)</p>
