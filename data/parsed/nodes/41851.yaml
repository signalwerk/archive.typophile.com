  html: |-
    <p><em>The ability to download and immediately render non-standard web fonts is just one of several advancements Apple Inc. has planned for Safari 3.1, a small but significant update to its share-gaining web browser for both the Mac and Windows PCs.</em></p>
    <p><a href="http://www.appleinsider.com/articles/08/02/07/apples_safari_3_1_to_support_downloadable_web_fonts_more.html" rel="nofollow">Full article</a></p>
    <p>I haven't fully parsed the significance of this, but I thought I'd post it for general edification/examination.</p>
