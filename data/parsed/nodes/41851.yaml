    date: 2008-02-08T09:18:00
    votes: null
    html: <p>My own opinion is that this is good news. Apple can trial the feature and we'll see how iPhone and other Safari users react to the freeware fonts funneled down onto their favorite Web pages. Browsers on the side-lines can then decide if they want to jump on-board. Apple should get credit for having the balls to stick their head over the ramparts on this one.</p>
