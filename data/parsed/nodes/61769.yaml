      <p>Simple, clean, and professional. Big improvement and by flipping the leaf you get people to read from left to right as it moves their eye up, which helps communicate the "growth" aspect you're looking for. You also have a subtle leaf shape repeated in the descender of the "y". You also see it rotated 180 degrees in the "e". Nice.</p>
      <p>Can you explain the meaning of the period at the end of the wordmark? Not sure what to think about it... part of me feels it distracts and grabs attention but it's just a touch different.</p>
      <p>Psychology of Color: Blue<br>
      "Blue calls to mind feelings of calmness or serenity. It is often described as peaceful, tranquil, secure, and orderly.</p>
      <p>Ask people their favorite color and a clear majority will say blue. Much of the world is blue (skies, seas). Seeing the color blue actually causes the body to produce chemicals that are calming; but that isn't true of all shades of blue. Some shades (or too much blue) can send a cold and uncaring message. Many bedrooms are blue because it's calm, restful color. Over the ages blue has become associated with steadfastness, dependability, wisdom and loyalty (note how many uniforms are blue). People tend to be more productive in a blue room because they are calm and focused on the task at hand. Some studies are showing that weight lifters can lift more weight in a blue gym - in fact, nearly all sports are enhanced in blue surroundings."</p>
      <p>Tell the client that is why you selected blue and you'll sound like a genius. ;)</p>
