      <p>If you are going to use a leaf (which i like, it breaks the mold of finance i think) direction is definitely important.  Like the person before me says, the line of the leaf stem seems to be going downward. </p>
      <p>Id flip the leaf horizontally, so the stem is gradually going upwards.  This could represent even more growth, or moving forward.</p>
      <p>Also, I agree that using a green leaf may initially cause viewers to expect an environmental company. But again, I like the idea of a leaf.  There could be a few possible fixes for this, such as changing the color of the leaf.  Making it a non traditional color could possibly disconnect it from the environmental image while still maintaining the strong leaf symbol. If that makes any sense. I hope it does.</p>
      <p>As for the wordmark, I love the way it ties into everything.  I think the text works well.  Not completely organic, but it does seem somewhat friendly and free-flowing, while still maintaining the structure you might want as a financial group.</p>
