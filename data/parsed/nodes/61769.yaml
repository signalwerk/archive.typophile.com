    <p>Hi There,</p>
    <p>I've been asked to put together a corporate identity for a family friend. he's starting a new business and needs me to put together a complete corporate identity. As well as stationary, he's also going to need a brochure outlining service offering and website. </p>
    <p>As far as layout and web goes thats something i'm very good at as i'm an artworker by trade. My weakest area is initial conceptual design, I need to come up with something professional, modern, clean, simple and friendly. This is my first concept and I needed some critique and advice to push me forward through the part I find most difficult.</p>
    <p>The image added gives an overview of where I am at the moment, right now i'm struggling with using a mark or not. I want to stay away from cliche financial symbology and japanese influences. I want to kind of focus on 'growth' both for the company in terms of growing their business and the customer in growing their income.</p>
    <p>Any advice, inspiration and critique no matter how brutal would be very much appreciated.</p>
    <p>Thanks</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/prosperity.jpg"></div><p></p>
