      <p>I think you've got a great start and the leaf and green certainly communicates 'nature' and 'growth'. The ultimate challenge will be in the quick viewer thinking this is an environmental or agriculture company. Blue is popular in banking because of the psychology of color and it being tied with 'trust' and 'integrity'.</p>
      <p>Super Technical: In the top logo the stem is on the left which makes the leaf appear to go down and to the right. Not sure you want to visually imply that for a financial company. ;)</p>
      <p>Also the reversed logotype and tagline in that option is way too small.</p>
      <p>One tip if you haven't done this... turn off the computer and grab a pencil and paper. Sketch out a bunch of different directions this can go and then eliminate the weakest concepts until you're left with 2-3 solid solutions.</p>
      <p>Beautiful work so far!</p>
