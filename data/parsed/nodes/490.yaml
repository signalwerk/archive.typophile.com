    html: <p> &gt; I want to appeal to all markets, nationally and internationally. <br> <br>I think that's too ambitious. Start with a focus. If/when you make it, expand. Hey, that's one good reason growing companies do redesigns! <br> <br>Figure out what you can do best, as well as who you can best do it for, *then* forge your identity. I think in this case movement is good, hipness is good, but also some sobriety. So maybe a slant in the main logotype, some funky organic shape for the logo (no swooshes, please), and a solid subhead using the slogan. The tricky part is the logo, but remember that memorability comes from simplicity as well as sensation. <br> <br>(BTW, Ole, nice list!) <br> <br>hhp </p>
