  html: '<p>Hi guys!  <br> <br>I need some help to decide on our company logo. We have been through tons of designs, but are not convinced yet. I am not sure whether to use a funky, trendy or modern look or a more serious neutral look. The company offers ALL Design services available and specializes in web and online/offline marketing. Our future plans are to evolve into an integrated advertising agency.  <br> <br>With that said, the name of the company is fullride. For full-integration, full-service and full-power. We thought some ideas with a roller coaster (flash intro), a driving wheel (for logo icon) and other simple and emotive things. Any idea for this is SUPER welcomed. The name can be written in caps, in the case anyone wants to try some ideas. The rest of the name or the text below the LOGO reads, "creative design group". We offer intelligent design that sells effectively and creative ideas that will swipe people off their feet.  <br> <br>I wanted to have the name plus some icon so I could use both elements for designing and alternating in my company collaterals.  <br> <br>I will really appreciate any ideas or suggestions on this.  <br> <br>You ALL understand the toughest decision is to decide on what you want for yourself. THANKS FOR THE FEEDBACK!  <br> <br>Jorge.  <br> <br>This are some of my ideas: <br><a href="http://www.fullridemedia.com/ideas/logos.htm" target="_top">http://www.fullridemedia.com/ideas/logos.htm</a></p>'
