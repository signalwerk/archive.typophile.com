    html: <p> Great you have a theme, that is a good start and a name with a domain name to match ,even better but now what?  Who is the client you are seeking. fortune 500 or a cool music label. Your logo must appeal to them, it should of course also reflect your values and ultimately reel in the jobs you will enjoy doing. If you want to do this right you will need to document everything, make this a case study and not just 30 logos to choose from.  Here are the steps I take for a logo design. (branding is something else altogether). <br> <br>Phase1)  Planning <br>   a) gather content information <br>   b) decide hierchy of information <br>   c) examine usage <br>   d) consider context <br>   e) define expression <br>   f) consider capability <br>   g) establish timelines <br>     <br>Phase 2  Elements <br>   a) choose elements, photos, illustrations, etc   <br>   b) spec colors <br>   c) choose proper typefaces or modify exsisting    type faces or design from scratch <br>   d) evaluate fusibility with existing identity (you may not have anything currently so skip this one) <br> <br>Phase 3  Refine Direction <br>   a) make comps <br>   b) discard unnecessary elements <br>   c) emotionalize remains <br>   d) choose best comp <br> <br>Phase 4)   Complete design <br>   a) refine best comp to a complete design <br>   b) test legibility-laser, fax, screen, etc <br>   c) proof prints <br> <br>(in between all these phases always carry a sketchbook a sketch as much as you can.) <br> <br>the logo should be a strong enough design to not rely on color. Black and White, with no shades of grey if possible.  This of course is just a rule and as they say, rules are meant to be broken.  <br>Good Luck. <br> <br>check out www.logolounge.com </p>
