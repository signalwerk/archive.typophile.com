    html: "<p> Just some things from a non-graphic-designer: <br>I like the name, but forget that rollercoaster business. Since you're not starting off as some long-term megabucks operation, try to focus on one aspect of the scene in the beginning, to maximize your chances for survival. This focus should be reflected in your logo. And don't use Helvetica - it makes you looks like a 40-something accountant. I like the 4-arrows, but maybe make them point *in*. I also think the slant in the logotype is good, and you might want to choose one letter (maybe in a different case than the rest) that can be made to convey movement. Consider using a set of wide, upright caps for the subtext. <br> <br>hhp </p>"
    html_clean: "<p> Just some things from a non-graphic-designer: <br>I like the name, but forget that rollercoaster business. Since you're not starting off as some long-term megabucks operation, try to focus on one aspect of the scene in the beginning, to maximize your chances for survival. This focus should be reflected in your logo. And don't use Helvetica - it makes you looks like a 40-something accountant. I like the 4-arrows, but maybe make them point *in*. I also think the slant in the logotype is good, and you might want to choose one letter (maybe in a different case than the rest) that can be made to convey movement. Consider using a set of wide, upright caps for the subtext. <br> <br>hhp </p>"
