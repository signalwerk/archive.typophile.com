    html: <p> I reckon the first one is the best...it creates a definite identity. In my humble opinion, the infinity sign has been done to death in company logos + it isn't that inspiring a shape. I would abandon gradient fills within the text...looks dodgy, especially when in grayscale. The arrows are also promising. I'd like to see more of the thin outline of the first example's font coupled with the straightforward colours of the text, perhaps with the innerfacing arrows. <br>Matthew Brown </p>
