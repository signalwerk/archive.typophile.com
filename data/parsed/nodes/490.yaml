    html: <p> Hi Jorge, <br> <br>As a "creative design group", you'd better push yourselves much harder to make the impact you're going for creatively. <br> <br>With the concept of your company being a full service design firm, the metaphors you've suggested are just that metaphors but none of them really speak to the qualities your trying to impress on potential clients. <br> <br>As I posted in another critique, your brand goals should be solidly identified before you start killing yourself with rounds of design execution which is what your post seems to suggest. <br> <br>Give your company a strong concept first and the logo will present itself! Good Luck! <br> <br>Stuart :D </p>
