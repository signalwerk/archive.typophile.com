    html: <p> yeah! <br>That's the criticism I was exactly looking for. <br>Thanks Stuart and Papazian. <br> <br>Papazian which logo do you consider works better. I didn't get the opinion on the type. By the way, the type used is arial, with simple twists to it. I think you get my feeling on what I think is neutral. If you go and check the major advertising and design firms, as well as clothing designers, they all have simple one or two color logos. most of them just text. since they work with different media and aspects of the business, they remain neutral with their identity. This is an observation I have made and I do not want to mislead my clients for a particular service or specialty. I want to appeal to all markets, nationally and internationally.  <br> <br>Something too funky (sort of like a rave flyer or CD cover - which by the way I do like) may not represent seriousness and quality to everyone.  <br> <br>I think you guys get my feeling. I originally come from marketing background, I later became a designer.  <br>(Stuart) The main focus of the company is to offer intelligent marketing design that sells and represents the brand. Not just some cool graphics and colors. Represent the essence and impact the customers. <br> <br>I also though about "creative adrenaline" which works good with the fullride concept. <br> <br>Stuart, which logo will you go for, or do you have any other suggestions? <br> <br>GUYS, I truly appreciate your time and opinions. <br> <br>Later, <br>Jorge </p>
