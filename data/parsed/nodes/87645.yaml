    html: |-
      <p>&gt; That will retain most formatting</p>
      <p>I've done that sometimes if I'm cutting and pasting a lot, although a potential disadvantage is that the pasted text may have some formatting that you need to change (like if the point size doesn't match your InDesign text). Also your InDesign style sheets may get cluttered up with imported styles from the Word document.</p>
      <p>In many cases I'd prefer just to paste without formatting and then apply InDesign paragraph or character styles. But it's just personal preference; whatever works best for you.</p>
