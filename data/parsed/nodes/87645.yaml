    votes: null
    html: |-
      <p>On a Mac, go into InDesign &gt; Preferences &gt; Clipboard Handling and check the box "All text information..." That will retain most formatting coming from Word and Word-clones. </p>
      <p>In experimenting just now, I can even get InDesign to accept fake italics and small caps from Word.</p>
