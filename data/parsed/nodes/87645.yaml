  html: |-
    <p>This seems like a feature that should exist, epecially with OpenType, but as far as I know you cannot copy italicized type from a Word doc and paste it into your InDesign layout, without having to reformat the italics. Anybody have any workarounds or tips. </p>
    <p>Would importing the text and remapping styles be the way to go? Sometimes I just need to bring in a paragraph or two, in which case the text import seems laborious.</p>
