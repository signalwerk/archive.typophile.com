      <p>&gt; the last time I talked with agents ...there appeared to be a<br>
      &gt; number of regulations about which they were either vaguely<br>
      &gt; or not at all sure…</p>
      <p>Here are the government's rules:<br>
      <a href="http://www.secretservice.gov/money_illustrations.shtml" title="http://www.secretservice.gov/money_illustrations.shtml">http://www.secretservice.gov/money_illustrations.shtml</a></p>
      <p>As a practical matter, they're unlikely to get upset about actual-size web images because the resolution is so low.  Prints at high resolution (like in a book, magazine, or brochure) are a bigger concern as someone might cut it out and try to pass it off as real currency. </p>
      <p>I used to have a large bank as a client and we often used money images in the brochures and needed to be careful to comply with the rules. Most commercial printers are very familiar with these rules and will refuse to print a piece that violates them.</p>
