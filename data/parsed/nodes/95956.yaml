    html: |-
      <p>To me the important difference between typography and the lettering arts (whether with pen, brush, burin, or something else) is that typography involves the arrangement of already-formed letters, while lettering involves an interaction between the arrangement and the forming of the letters. The square-letter engraver for that silver certificate did a number of things that were very un-typographic at the time, such as adapting the "A" in "DOLLARS" to the shape of the preceding "L". </p>
      <p>Now that OpenType programming makes type more flexible, the difference isn't as sharp as it was previously. There's always been quite a lot that type designers can learn from lettering, and more now than before, but typographers are still mostly constrained by what the type designer offers them.</p>
    html_clean: |-
