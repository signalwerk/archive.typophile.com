      <p>It's interesting to compare the two approaches to deterring counterfeits: the Americans throwing in as much fine detail as possible so that something would almost certainly be copied badly, and the British using very little so that anything that is wrong would stand out more clearly.</p>
      <p>None of it is exactly typography, though, as Craig says, since the lettering was hand-engraved on the dies used for creating the printing plates.</p>
