    date_raw: 31 Aug 2012 — 3:46pm
    votes: null
    html: <p>Zeno, typography is, as the word suggests, writing with type. If it weren't a distinct technology from pen writing or block printing or engraving or laser etching, etc. it wouldn't have a distinct name. In the digital realm, fonts are used to output to many different kinds of technologies, so it is more common for typography to play a role in the creation of letters in various media than used to be the case, but when we're talking about historical artefacts we should take care to accurately describe the means of their making. If you want a general term to refer to the kinds of lettering treatment on that US bill independent of technology, it would be ... lettering.</p>
