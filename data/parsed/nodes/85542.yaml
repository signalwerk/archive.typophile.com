      <p>Hi Ben,</p>
      <p>Coluring Book "coloring" is Cursif<br>
      <a href="http://www.dafont.com/cursif.font?text=coloring" title="http://www.dafont.com/cursif.font?text=coloring">http://www.dafont.com/cursif.font?text=coloring</a></p>
      <p>Invite Text "LAUREN ASLHLEY..." is Birmingham - (c) Copyright PJ Lloyd 1995<br>
      <a href="http://www.dafont.com/birmingham.font?text=LAUREN+ASLHLEY" title="http://www.dafont.com/birmingham.font?text=LAUREN+ASLHLEY">http://www.dafont.com/birmingham.font?text=LAUREN+ASLHLEY</a></p>
      <p>The top title on invite text ("MARK AND BRENDA...") is very small for my eyes...</p>
      <p>Have a happy wedding!<br>
      Fivos<br>
      PS: I found them using Find my Font utility - <a href="http://ww.findmyfont.com" title="http://ww.findmyfont.com">http://ww.findmyfont.com</a></p>
