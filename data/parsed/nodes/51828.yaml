      <p>James: The answer's not as complicated or mysterious as you make it sound. Any foundry or vendor will be happy to take payment from one party and license the font to another. Designers/agencies do this all the time on behalf of their clients.</p>
      <p>Frank: The mechanics may differ a bit from vendor to vendor, so contact Fountain (or FontShop or MyFonts or...) and ask them how they handle these requests.</p>
