  html: |-
    <p>Hello,</p>
    <p>I’m making a font and I’m trying too add alternate characters using for example the following code.</p>
    <p>feature zero {<br>
      sub zero by zeroalt;<br>
    } zero;</p>
    <p>So I’ making extra characters by adding an -alt suffix. For example “zero” becomes zeroalt.<br>
    So far so good. But my question is the following: What do I do with the Unicode of these new characters?<br>
    The Unicode for “zero” is “0030” but I can’t put my alternate “zero” at “0031” because that’s taken by “one”.<br>
    What are some possible unicode solutions for “zeroalt”? And is a uncode necessary for these alternates?</p>
    <p>thx</p>
