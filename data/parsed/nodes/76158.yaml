      <p>Bob, thank you for responding to my comment on Yagi Double,<br>
      one of my absolute favorite typefaces.  </p>
      <p>I never thought that I would read from the man who drew the types.</p>
      <p>I've loved it ever since I was a child in the 1970's.  Probably<br>
      when I watched ABC's Rhyme and Reason game show on TV, back then.<br>
      Notice the podium before Bob Eubanks?</p><div class="imageWrap"><img src="http://typophile.com/files/rhymeandreason_5433.jpg"></div><p></p>
