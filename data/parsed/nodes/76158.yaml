  html: |-
    <p>The typefaces, called Retro Stereo Wide, Thin, and Thin Alternate,<br>
    can be found at <a href="http://www.acidfonts.com" title="http://www.acidfonts.com">http://www.acidfonts.com</a>.  The cost is absolutely free.  </p>
    <p>I've been trying to find a digital version of Yagi Double for years<br>
    and even made one myself in 1995.  These typefaces I found were very<br>
    faithfully reproduced.</p>
    <p>Look around in the free typeface websites.  Who knows?  You might find<br>
    something very interesting!</p>
