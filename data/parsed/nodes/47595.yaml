    <p>Hello Typophiles.</p>
    <p>I'm looking for a typeface along the lines of something you might associate with the not so glorious type of The British Empire (British rule in the Indian subcontinent between 1858 and 1947).... or as my client refers to it as "British Raj."  Something obviously serifed and / or scripted is the direction we are wanting to venture off in.</p>
    <p>I've been playing around with Dalliance, and although I do really like the outcome so far, I'd really like to find some other faces to play with.</p>
    <p><a href="http://www.fontshop.com/fonts/downloads/emigre/dalliance_script_ot/" title="http://www.fontshop.com/fonts/downloads/emigre/dalliance_script_ot/">http://www.fontshop.com/fonts/downloads/emigre/dalliance_script_ot/</a><br>
    <a href="http://www.fontshop.com/fonts/singles/emigre/dalliance_roman_ot/" title="http://www.fontshop.com/fonts/singles/emigre/dalliance_roman_ot/">http://www.fontshop.com/fonts/singles/emigre/dalliance_roman_ot/</a></p>
    <p>As always, suggestions / help is always much appreciated.</p>
    <p>Okay.</p>
