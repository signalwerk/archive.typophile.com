    html: |-
      <p>It's Letter Gothic. Maybe you just compared it with Adobe's version of it.<br>
      It's more likely to be ParaType's "New Letter Gothic". You'll see the difference on the finial of the letter "J".</p>
      <p>But, to answer your question. A free "Gothic Letter" look-alike called "Letter Gothic Line" is available here:<br>
      <a href="http://www.dailyfreefonts.com/fonts/info/1325-Letter-Gothic-Line.html" title="http://www.dailyfreefonts.com/fonts/info/1325-Letter-Gothic-Line.html">http://www.dailyfreefonts.com/fonts/info/1325-Letter-Gothic-Line.html</a></p>
