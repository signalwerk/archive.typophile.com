      <p><a href="http://new.myfonts.com/fonts/agfa/monkton/" rel="nofollow">Monkton</a> is close, but the serifs are off. "Byington" is Ray Larabie's version of Trajan with l.c., but it's also not a match.</p>
      <p>My <a>Serif Guide</a> is not working for me, or that would be a good place to find this.</p>
      <p>- Mike Yanega</p>
