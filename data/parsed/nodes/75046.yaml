    <p></p><div class="imageWrap"><img src="http://typophile.com/files/IMG_0532_6678.jpg"></div><p></p>
    <p>Hi, can anybody ID this font?<br>
    The caps look like Trajan, but they come with lowercase too.<br>
    It's not La Gioconda for sure, but I have no idea what this is.<br>
    Additionally, tell me whatever font you know that the caps are strictly based on Trajan's and comes with lowercases.<br>
    (such as La Gioconda, Capitolium...)</p>
