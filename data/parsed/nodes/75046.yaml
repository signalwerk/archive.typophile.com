      <p>Both of you, thank you very much for suggestion. At least I could confirm who made this.<br>
      And I didn't know that such a nunmer of Trajans exsist as digital font.<br>
      Maybe Adobe Trajan is too famous.</p>
      <p>Other font I found is <a class="freelinking external" href="http://new.myfonts.com/fonts/storm/amor/" rel="nofollow">Amors Serif</a>. Interestingly, it includes sanserif variants.</p>
