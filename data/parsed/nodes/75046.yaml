    html: <p>This is a custom font called ‘Blackwell’ by—as far as I know—<a href="http://www.fontfactory.co.uk" rel="nofollow">Font Factory</a>. It comes in two roman styles, vaguely reminding me of <a href="http://www.fontshop.com/fonts/downloads/elsnerflake/itc_giovanni_1_ot/?&amp;sample_text=Blackwell&amp;sample_size=74&amp;update=0" rel="nofollow">ITC Giovanni</a>, and a titling variant, which is indeed close to <a href="http://www.fontshop.com/fontlist/alternatives/trajan/?&amp;sample_text=BLACKWELL&amp;sample_size=60&amp;update=0" rel="nofollow">Trajan and Co</a>.</p>
