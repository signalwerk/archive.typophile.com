  html: <p>Looking to ID the font used by Flavia Greeting Cards in their logo.  Go to <a href="http://www.flavia.com" target="_blank">www.flavia.com</a> to view.  Script with spiral flourishes.  Does anyone know what this typeface is, or if there is anything similar available as a shareware/freeware font???  Thanks for your help.</p>
  html_clean: <p>Looking to ID the font used by Flavia Greeting Cards in their logo.  Go to <a href="http://www.flavia.com" target="_blank" class="link-external">www.flavia.com</a> to view.  Script with spiral flourishes.  Does anyone know what this typeface is, or if there is anything similar available as a shareware/freeware font???  Thanks for your help.</p>
comments:
  - id: 18234
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>That is certainly hand drawn, Ken. Look at repeating characters, not only in <br>the logo, but in the various other places on the site that script is used. Those <br>repeating characters are always a bit, or much, different. <br> <br>For example, there are lots of 'a's and 'e's in the various words and they all <br>vary. Look at the word Free on the "About Flavia" link and there's even a much <br>different 'F' than is used in the word Flavia. <br> <br>As far as similar fonts go, realize that there's no way to actually match a <br>flowing, calligraphic, varying script like this, but give us a few minutes to think <br>up suggestions for fonts with a similar "feel" (if someone hasn't already done <br>so by the time I post this). <br><br></p>
    html_clean: <p>That is certainly hand drawn, Ken. Look at repeating characters, not only in <br>the logo, but in the various other places on the site that script is used. Those <br>repeating characters are always a bit, or much, different. <br> <br>For example, there are lots of 'a's and 'e's in the various words and they all <br>vary. Look at the word Free on the "About Flavia" link and there's even a much <br>different 'F' than is used in the word Flavia. <br> <br>As far as similar fonts go, realize that there's no way to actually match a <br>flowing, calligraphic, varying script like this, but give us a few minutes to think <br>up suggestions for fonts with a similar "feel" (if someone hasn't already done <br>so by the time I post this). <br><br></p>
  - id: 18235
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>Ken, <br>As Mike said the 'Flavia' signature and some of the site lettering looks like it was hand-drawn. Since there are fonts with alternate characters and endings, it's theoretically possible that a font was used, but I would expect it to be a custom one. The curly spirals would be pretty memorable if this were a commercial font, I think. <br> <br>The lettering shown on that site for the wording of the greeting card, does look like a font (identical letters look identical), but I didn't try to ID it as it wrote on the screen.  <br> <br>There are a couple of places to look for similar fonts in the <a href="http://bowfinprintworks.com/ScriptIDGuide.html" target="_blank">ScriptFont ID Guide</a>, such as Part 10, Part 4, or Part 7. You might find the font used for the 'animated' cards that way.</p>
    html_clean: <p>Ken, <br>As Mike said the 'Flavia' signature and some of the site lettering looks like it was hand-drawn. Since there are fonts with alternate characters and endings, it's theoretically possible that a font was used, but I would expect it to be a custom one. The curly spirals would be pretty memorable if this were a commercial font, I think. <br> <br>The lettering shown on that site for the wording of the greeting card, does look like a font (identical letters look identical), but I didn't try to ID it as it wrote on the screen.  <br> <br>There are a couple of places to look for similar fonts in the <a href="http://bowfinprintworks.com/ScriptIDGuide.html" target="_blank" class="link-external">ScriptFont ID Guide</a>, such as Part 10, Part 4, or Part 7. You might find the font used for the 'animated' cards that way.</p>
