    html: "<p>The fonts that might be acceptably similar are few enough. Your requirement <br>of freeware/shareware limits the candidates greatly, Ken. <br> <br>Here are a few possibilities: <br><a href=\"http://www.dafont.com/en/search.php?q=caffe%2Blatte&amp;nb_ppp_old=10&amp;page=1&amp;texte=Flavia%2BGift%2BNews&amp;nb_ppp=10\" target=\"_blank\"> Caffe Latte</a> (freeware by Peter Stanton), <a href=\"http://www.geocities.com/arrfdesigns/fonts.html\" target=\"_blank\"> HipnOtik</a> (shareware by Randy Ford) <br>and <a href=\"http://www.dafont.com/en/search.php?q=moonpie&amp;nb_ppp_old=10&amp;page=1&amp;texte=Flavia%2BGifts%2BNews&amp;nb_ppp=10\" target=\"_blank\"> Moonpie</a> (shareware by Steven Lundeen). <br> <br>Non-freeware candidates that come to mind include Frivolous, Gigi, Pablo and <br>Party, all available from <a href=\"http://www.myfonts.com/\" target=\"_blank\"> MyFonts</a>. <br> <br>See Mike Yanega's site for an incredible showing of script fonts to get more ideas. <br><br></p>"
