    <p>Hi everyone!<br>
    I have a somewhat unusual request on behalf of a friend.<br>
    There is a court case where one side claims that a document was printed year 2005 and the other side claims that it was year 2016.<br>
    The font used is Times New Roman, I think.<br>
    Is it possible to look at the font used and determine if this particular version of Times New Roman was / was not available in year 2005? I assume that most fonts are updated continuously behind the scenes, minor tweaks and such.<br>
    See attached image, a higher-res version with more text is available as well.<br>
    Would be really grateful for any help you can provide.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/font-id/19204673_10209871640362860_1363088531_o.jpg" width="1334" height="750" alt="">
