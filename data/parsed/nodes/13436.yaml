      <p>As far as I can see, InDesign doesn't really provide much in the way of imposition support. Which is a little frustrating. There are various plugins of which <a href="http://www.alap.com/products/inbooklet.html" rel="nofollow">InBooklet</a> is the one I use if I'm doing something small like this. You can download a free trial from their web site.</p>
      <p>Alternatively, I remember seeing some free plugins for Adobe Acrobate which will turn an exported PDF into various predefined impositions. Have a look on <a href="http://www.versiontracker.com/php/search.php?mode=basic&amp;action=search&amp;str=imposition&amp;plt%5B%5D=macosx&amp;x=0&amp;y=0" rel="nofollow">Version Tracker</a>.</p>
      <p>Hope this helps</p>
      <p>_<br>
      Nick</p>
