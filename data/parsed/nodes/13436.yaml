    html: <p>The imposer I use is Imposer Pro by ALAP, <a href="http://www.alap.com/" title="http://www.alap.com/">http://www.alap.com/</a> They also have a free trial download. If you end up buying it, its a bit pricey, but well worth if you are into publishing books in small runs. The only other way is to figure out what the pages positions would be in their imposition states and drag them manually to those spots. The best way I have found to do this is by making a dummy and visually matching up the pages. It can get tricky though. If you have pages numbers, you have to make sure they are not shifting around with any kind of automation. If you have images they run over the gutters, you have to duplicate each side for each page. But, it is possible. I have done it many times. It would be even trickier to do a 4-up situation like you want, but possible. It can be real annoying with a very long book though. And, save that file as another version before you start dragging pages around!</p>
    html_clean: <p>The imposer I use is Imposer Pro by ALAP, <a href="http://www.alap.com/" title="http://www.alap.com/" class="link-external">http://www.alap.com/</a> They also have a free trial download. If you end up buying it, its a bit pricey, but well worth if you are into publishing books in small runs. The only other way is to figure out what the pages positions would be in their imposition states and drag them manually to those spots. The best way I have found to do this is by making a dummy and visually matching up the pages. It can get tricky though. If you have pages numbers, you have to make sure they are not shifting around with any kind of automation. If you have images they run over the gutters, you have to duplicate each side for each page. But, it is possible. I have done it many times. It would be even trickier to do a 4-up situation like you want, but possible. It can be real annoying with a very long book though. And, save that file as another version before you start dragging pages around!</p>
