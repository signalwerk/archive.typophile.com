    <p>Hi,<br>
    I'm trying to find a good way of printing a little book project from a standard inkjet and A4 format.<br>
    What I want to do is set up a layout in Indesign that lets me do the following:</p>
    <p>1. book will be printed one side only<br>
    2. A4 divided in four to provide 4 pages<br>
    3. Pages 3,4...7,8...etc. rotated so I can fold the sheet an trim it at lower edge (Book will have the paper-fold towards reader)</p>
    <p>see attachment.</p>
    <p>I could of course just set up the A4 and do the layout there, but is there any way of setting up a Spread like this in Indesign? Or any other clever way of doing it?</p>
