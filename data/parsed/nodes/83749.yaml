    html: <p>I understand reasoning why decision about subpixel rendering can be based on font/size, but using hardware capabilities for this purpose is strange (you can use it for other puuposes, of course). Results on screen produced by DWrite should not depend on whether you use hardware or software rendering. And the other way around, DWrite provides ability to produce both subpixel ClearType or GDI-compatible rendering, independent from hardware mode. Would be interesting to hear what John D think.</p>
