      <p>Rich: <em>But if it's a hardware issue that's holding DWrite back in FF, I fail to see how the same hardware issues won't put the kabosh on CFF DWrite rendering, too.</em></p>
      <p>The second paragraph of John D's comments indicates that this is not fundamentally a hardware/driver issue, but a design decision, i.e. that it would be possible to enable DWrite by default ‘whether hardware acceleration is enabled or not’ (presuming an OS that supports DWrite). He further suggests that specific (TTF) fonts can be excluded by name, so what I'm wondering is if other (CFF) fonts could be <em>included</em> by flavour.</p>
      <p><em>Also, isn't it a big surprise that Microsoft seems to have the leg up on getting DWrite to work?</em></p>
      <p>MS invest in massive hardware testing and maintain a very extensive driver registry, so of course they have an advantage over companies that don't do the same level of hardware and driver testing.</p>
