      <p>Mike, I've not had an opportunity to test FF5 yet (too busy), but my understanding of John Daggett's comments is that you will see DWrite rendering of both CFF and TTF fonts in both FF4 and FF5 <em>if hardware acceleration is enabled,</em> but that some core TTF fonts are currently excluded due to negative user feedback on the rendering (perhaps fixed, according to Si's comment).</p>
      <p>So what I take away from this is that what you will see in FF4 and 5 will depend on both the machine being used and which specific font is used.</p>
      <p>My suggestion was that if, as John D suggests, it would be possible to support DWrite regardless of hardware acceleration, but there are concerns about rendering of some TTFs and hence the possibility of using DWrite for some fonts and GDI for others, it might be possible to first apply default DWrite rendering to CFF fonts, since they will more surely benefit relative to the old PS rendering.</p>
