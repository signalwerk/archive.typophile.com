      <p>IE always uses D2D/DWrite. Only if there are known problems with graphics card or driver, IE9 will use D2D software rendering. This should produce the same (although slower) layout and rendering results as hardware accelerated mode, incuding ClearType with subpixel positioning. </p>
      <p>Here is relevant post on IE team blog:</p>
      <p><a>http://blogs.msdn.com/b/ie/archive/2011/04/01/getting-the-most-from-ie9-and-your-gpu.aspx</a></p>
      <p>Besides rendering quality, compatibility of layout is also very important (e.g. same site laid out using pixel-aligned or subpixel glyph metrics). Having different layout results depending on user's hardware would be support nighmare, we went through this. It is not clear from John's response if this actually happens in FireFox.</p>
      <p>Thanks,<br>
      Sergey</p>
