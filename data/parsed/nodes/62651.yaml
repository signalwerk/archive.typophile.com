      <p>I usually work with Multiple Master and when I design a glyph in Wt0 the other master is all messed up, so I use Tools&gt;Multiple Master&gt;Expand Master in order to have the same exact glyph in both masters. Then I just work on the master Wt1 to design the boldest version. And I do the same both for width or weight axis. This works for me because I'm sure that the points are in the same relative position and the paths have the same direction.</p>
      <p>If you have any problems, you can email me and I'll be glad to help.</p>
      <p>Dino</p>
