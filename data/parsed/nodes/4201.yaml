    html: <p>It would be interesting and helpful to see the list of languages in question. On the plus side, InDesign supports more languages, better, than any other high-end DTP application. But it is still not a panacea for language support. For example, you're out of luck if you want to do any of the Indic languages (short of sticking an EPS or PDF into your InDesign layout). <br> <br>I just spent 40 minutes this morning (at 7 am, ouch!) in a teleconference with a major US newspaper chain discussing whether/when they should start moving to OpenType. I'm happy to discuss these sorts of things with our customers, including in public. OpenType isn't perfect (nothing is, really), but in most workflows it's an improvement, and often a very large one. <br> <br>Assuming you are also using InDesign and a Unicode-based text workflow, and that InDesign supports all the languages you need, at least some of your specific problems can be avoided by also using OpenType fonts. You can use the exact same font on both platforms, and your kerning and layout will be 100% identical on both Mac and Windows. <br> <br>Regards, <br> <br>T <br> <br>Thomas Phinney <br>Program Manager <br>Fonts &amp; Core Technologies <br>Adobe Systems</p>
    html_clean: <p>It would be interesting and helpful to see the list of languages in question. On the plus side, InDesign supports more languages, better, than any other high-end DTP application. But it is still not a panacea for language support. For example, you're out of luck if you want to do any of the Indic languages (short of sticking an EPS or PDF into your InDesign layout). <br> <br>I just spent 40 minutes this morning (at 7 am, ouch!) in a teleconference with a major US newspaper chain discussing whether/when they should start moving to OpenType. I'm happy to discuss these sorts of things with our customers, including in public. OpenType isn't perfect (nothing is, really), but in most workflows it's an improvement, and often a very large one. <br> <br>Assuming you are also using InDesign and a Unicode-based text workflow, and that InDesign supports all the languages you need, at least some of your specific problems can be avoided by also using OpenType fonts. You can use the exact same font on both platforms, and your kerning and layout will be 100% identical on both Mac and Windows. <br> <br>Regards, <br> <br>T <br> <br>Thomas Phinney <br>Program Manager <br>Fonts &amp; Core Technologies <br>Adobe Systems</p>
