    html: <p>Hi Jim, <br> <br>It seems very much as if your workflow is busted, and this is what you need to fix. Certainly standardizing on a set of good, full-feature multilingual OpenType fonts and Adobe InDesign across your complete workflow, Windows and Mac, including the 'local agency', would be a good move, but there may be other ways to fix the problems.  <br> <br>Certainly if the Adobe Sales guy or someone else is suggesting that getting a few OpenType fonts will magically solve your process problems, they are over-selling the fonts.  <br> <br>As you're dealing with sixty languages you're probably going to hit on more than a few that InDesign will have trouble with. You probably want to have Adobe help identify these and work out a process specifically around them. Likewise with the fonts themselves, you're probably not going to find a single OpenType family that supports all the languages your customer cares about. <br> <br>Hope this helps,  <br> <br>Cheers, Si <br> <br></p>
    html_clean: <p>Hi Jim, <br> <br>It seems very much as if your workflow is busted, and this is what you need to fix. Certainly standardizing on a set of good, full-feature multilingual OpenType fonts and Adobe InDesign across your complete workflow, Windows and Mac, including the 'local agency', would be a good move, but there may be other ways to fix the problems.  <br> <br>Certainly if the Adobe Sales guy or someone else is suggesting that getting a few OpenType fonts will magically solve your process problems, they are over-selling the fonts.  <br> <br>As you're dealing with sixty languages you're probably going to hit on more than a few that InDesign will have trouble with. You probably want to have Adobe help identify these and work out a process specifically around them. Likewise with the fonts themselves, you're probably not going to find a single OpenType family that supports all the languages your customer cares about. <br> <br>Hope this helps,  <br> <br>Cheers, Si <br> <br></p>
