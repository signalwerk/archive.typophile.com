  html: <p>Dear typography gurus, <br> <br>I am new to this goroup and a bit out of my league here, that is pretty obvious as I read some of the postings, so this must be the right crowd to turn to for much needed advice. <br> <br>I am a studio manager for a medium sized Advertising agency based in Amsterdam. As with most Studios, we are seriously considering making the switch to InDesign. For now, one of the most compeling reasons to do this is that a very large multinational client of ours suffers when their materials are converted from English Masters  to local masters as the typographical attention we give to the materials is often lost when the text is simply translated and pasted back into a layout by a local agency which often strips away any of the typographical adjustments we have made. The worst results are when our mac based fonts are repaced by PC fonts which even in a straight conversion of the English Masters results in unwanted line breaks and terrible kerning.  <br> <br>I have heard that open fonts will help solve this problem but where in the world would I have this corporate typeface converted into an open type font?  <br> <br>This particular client reproduces work throughout the world, in over 20 languages using at least three different versions of their font which seems like another strong reason why open type sounds so interesting to me even if we stayed with our current layout application. <br> <br>So to make a very long question a bit shorter, where can I draw the line between the hype of the Adobe sales guys who are parading the open face type and InDesign flag and the reality of really  having more creative control over the final products that are produced in over 60 countries? Would open type help? Where would I find a passionate typographer that would not only convert the current fonts but actaully improve it?  <br> <br>Any help or advice would be grately appreciated! <br> <br>Thank you, <br>Jim </p>
  html_clean: <p>Dear typography gurus, <br> <br>I am new to this goroup and a bit out of my league here, that is pretty obvious as I read some of the postings, so this must be the right crowd to turn to for much needed advice. <br> <br>I am a studio manager for a medium sized Advertising agency based in Amsterdam. As with most Studios, we are seriously considering making the switch to InDesign. For now, one of the most compeling reasons to do this is that a very large multinational client of ours suffers when their materials are converted from English Masters  to local masters as the typographical attention we give to the materials is often lost when the text is simply translated and pasted back into a layout by a local agency which often strips away any of the typographical adjustments we have made. The worst results are when our mac based fonts are repaced by PC fonts which even in a straight conversion of the English Masters results in unwanted line breaks and terrible kerning.  <br> <br>I have heard that open fonts will help solve this problem but where in the world would I have this corporate typeface converted into an open type font?  <br> <br>This particular client reproduces work throughout the world, in over 20 languages using at least three different versions of their font which seems like another strong reason why open type sounds so interesting to me even if we stayed with our current layout application. <br> <br>So to make a very long question a bit shorter, where can I draw the line between the hype of the Adobe sales guys who are parading the open face type and InDesign flag and the reality of really  having more creative control over the final products that are produced in over 60 countries? Would open type help? Where would I find a passionate typographer that would not only convert the current fonts but actaully improve it?  <br> <br>Any help or advice would be grately appreciated! <br> <br>Thank you, <br>Jim </p>
