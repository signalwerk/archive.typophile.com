    html: <p>&gt;a very large multinational client of ours suffers when their materials are converted from English Masters to local masters as the typographical attention we give to the materials is often lost when the text is simply translated and pasted back into a layout by a local agency which often strips away any of the typographical adjustments we have made. <br> <br>This is disingenuous, and somewhat arrogant. The multinational is simply not prepared to pay for quality typography at the local level. To the multinational mentality, a single "smart-software" solution is preferable. Hence the crass uniformity of global culture, and the derogation of local culture. <br> <br>Good typography requires a discriminating human presence, and that can never be replaced by "smart" software.  <br> <br>For example, there is no way that Quark or InDesign will EVER be able to make truly smart quotes ("Typographer's quotes")! Stuff like "rock 'n' roll" will always fool it. </p>
