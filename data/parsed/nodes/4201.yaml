    html: "<p>Oh, another thing to note: InDesign supports existing Type 1 and Truetype fonts just fine. You can even use its fancy optical kerning on any font in any format.  <br> <br>Just for kicks, set a block of text in something monospaced like Courier, and apply optical kerning. (!)</p>"
