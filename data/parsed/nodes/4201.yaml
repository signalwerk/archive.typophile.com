    html: <p>Greetings Jim, <br> <br>InDesign can handle most languages based on the Latin alphabet, plus CJK stuff. The ME version adds Arabic and Hebrew. For Indic, a good start is the latest version of (!) Microsoft Publisher. I get the impression that the 60 languages you're talking about are mostly Latin script, though. <br> <br>If you have a set of custom corporate fonts, please feel free to contact me privately about OpenType conversion. (<a href="mailto:john@eccentrifuge.com">john@eccentrifuge.com</a>) If they were commissioned from a third-party designer, you will need that person's written permission up front.</p>
