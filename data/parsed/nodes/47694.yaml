    <p>Hello everyone. I'm new the world of type, so please forgive my ignorance.</p>
    <p>As part of a major re-brand, my company is looking to adopt a relatively unique font family which can be used in all of our collateral. The font which has most appealed to us so far is Whitney and, whilst we are definitely willing to pay for the 2 licenses needed for our designer and server to host the font files, I've been told that, if we want to use the font in our distributed PDFs, we need to pay an additional $150 per year per font variant. These kind of figures amount to being way too much and i'm thinking it makes much more sense to have a custom font developed.</p>
    <p>Unfortunately, though, we don't have much time available to us and using a ready-made font family makes much more sense.</p>
    <p>My questions to all of you typophiles are...</p>
    <p>1. Will we face the same problem with all fonts or was this unique to Whitney?<br>
    2. What solutions are available to us?</p>
    <p>Many thanks for your time and input.</p>
    <p>Fahed</p>
