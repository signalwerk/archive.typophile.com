      <p>Ah, sIFR. I get that. They use that for the rotating display type here at Typophile.</p>
      <p>Hmmm...</p>
      <p>If you aren't absolutely desperate to get the fonts settled, it will probably be worthwhile to consider custom. </p>
      <p>But I would have a number of questions to ask you about your needs and preferences before I could give any idea of turnaround. There are many variables like: how many styles, character set (language coverage), style, intended uses, etc. </p>
      <p>At a certain point, you are likely to want a real quote from someone, and I'm not in a position to do the work or give a quote at all, so maybe this is the time for you to contact some of the <a class="freelinking external" href="http://typophile.com/node/20643?" rel="nofollow">independent foundries whose designers visit typophile.</a> If you want recommendations, contact me offline thru my profile. </p>
      <p>One thing to know: There is a lot of gray area between retail and custom type solutions for you. For instance, a designer might take one of their own retail releases and make custom weights or styles for you from their private data, thereby saving immensely in development costs. They might also arrange for the faces to be exclusive to you for a specific period such as 3 years or 10 years, after which they become retail, and a royalty stream takes up some of the development cost. So there are many different ways to get custom type that might fit your situation and budget. </p>
      <p>The one way that isn't kosher is for someone to slightly scale someone else's retail face and then sell it to you as custom. The originating foundry is likely to pounce. Work directly with originating foundries to get the best work and the cleanest contracts.</p>
