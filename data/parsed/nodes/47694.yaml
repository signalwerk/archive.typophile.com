      <p>I'm seeing a red flag. It's the discrepancy between "Major re-brand", "requisite 2 licenses" and "server to host the font files". </p>
      <p>How many employees will be using the fonts to make documents? How many people will use templates, company forms and collateral that require the use of the fonts? Will all of them require the fonts themselves, or will company graphics using the fonts be converted to outlines? </p>
      <p>I ask all these questions because most "major re-brands" require a considerably more extensive licensing arrangement than 2 copies of the fonts. Hosting fonts on a server doesn't replace the necessity for all users of the fonts to be licensed. If 50 people throughout the company need to have access to the fonts to make documents, there will be many more than 2 licenses required. </p>
      <p>It might be useful to ascertain all the potential uses your company would make of the fonts, and then get appropriate pricing for retail fonts, and compare that to pricing for custom fonts. Custom fonts have the advantage that nobody ever needs to upgrade licenses or get new licenses; the fonts can be distributed freely within the company that owns them. In the case of exclusive custom fonts, you could host them on a server and allow employees to download them at will. However the fonts are a more valuable asset as exclusive property, and need to be kept within the company.</p>
