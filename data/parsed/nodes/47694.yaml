      <p>I'm actually not referring to employees, but customers. Employees have the fonts loaded on their machines, customers do not. It is understandable to pay for licensing employee machines, I am wondering if it is understandable to pay for licensing customer machines. The scenarios I listed do not involve the fonts being anywhere except on the printer's machine. The hardware and software a bank owns is present in their own facilities, used on a daily basis by their employees. There is no problem understanding that cost. That is a different situation than the scenarios I described.</p>
      <p>To use your bank scenario, it would be like a customer coming in to make a deposit, filling out the form, handing it to the teller who then prints a current balance statement for the customer. The bank would now need to pay to license the customer's (not the employee's) use of that font used in printing the statement he/she received.<br>
      --<br>
      Aj</p>
