      <p>Every font distributor has their own EULA provisions! However, to try and answer your questions…</p>
      <p>&gt;<em>#1: I call my printer and ask them to change my address on a business card, have I now typeset something?</em></p>
      <p>No. But when your printer makes the change, he IS typesetting something. You can't give him the font you used to make the design (unless the font's EULA allows this). The printer will have to license the font himself in order to make the change.</p>
      <p>&gt;<em>#2: I email my printer the change I would like made on a business card, have I now typeset something?</em></p>
      <p>If you are sending him a changed business card layout file, then yes, you have. You are using the font you licensed, and you made the change on your own computer. If your font's license allows PDF Print &amp; Preview embedding, then you can send that PDF to the printer, and he can print your business card. He's not actually using the font himself, and probably wouldn't need a license.</p>
      <p>&gt;<em>#3: I modify a spreadsheet of business card info and email the file to my printer to import into a biz card template, have I now typeset something?</em></p>
      <p>Here your printer would need a font license, I think. Depending on whether or not you actually designed anything in the font on your computer, you may not even need the font file yourself to do this work! But the printer would.</p>
      <p>&gt;<em>#4: I modify a database of business card info and email the database file to my printer to update his database which is linked to a biz card template, have I now typeset something?</em></p>
      <p>The answer here is probably the same as number three. Your printer would probably need to license the font himself.</p>
      <p>&gt;<em>#5: I modify a database of business card info on my printers website which is linked to a biz card template, have I now typeset something?</em></p>
      <p>Sounds like numbers three and four to me…</p>
    html_clean: |-
      <p>Every font distributor has their own EULA provisions! However, to try and answer your questions…</p>
      <p>&gt;<em>#1: I call my printer and ask them to change my address on a business card, have I now typeset something?</em></p>
      <p>No. But when your printer makes the change, he IS typesetting something. You can't give him the font you used to make the design (unless the font's EULA allows this). The printer will have to license the font himself in order to make the change.</p>
      <p>&gt;<em>#2: I email my printer the change I would like made on a business card, have I now typeset something?</em></p>
      <p>If you are sending him a changed business card layout file, then yes, you have. You are using the font you licensed, and you made the change on your own computer. If your font's license allows PDF Print &amp; Preview embedding, then you can send that PDF to the printer, and he can print your business card. He's not actually using the font himself, and probably wouldn't need a license.</p>
      <p>&gt;<em>#3: I modify a spreadsheet of business card info and email the file to my printer to import into a biz card template, have I now typeset something?</em></p>
      <p>Here your printer would need a font license, I think. Depending on whether or not you actually designed anything in the font on your computer, you may not even need the font file yourself to do this work! But the printer would.</p>
      <p>&gt;<em>#4: I modify a database of business card info and email the database file to my printer to update his database which is linked to a biz card template, have I now typeset something?</em></p>
      <p>The answer here is probably the same as number three. Your printer would probably need to license the font himself.</p>
      <p>&gt;<em>#5: I modify a database of business card info on my printers website which is linked to a biz card template, have I now typeset something?</em></p>
      <p>Sounds like numbers three and four to me…</p>
