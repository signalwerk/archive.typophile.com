      <p>Hmmm... So, to try to carry out the logic. I present some scenarios accomplishing the same thing, changing an address on a business card. Where does the typesetting occur?<br>
      #1: I call my printer and ask them to change my address on a business card, have I now typeset something?<br>
      #2: I email my printer the change I would like made on a business card, have I now typeset something?<br>
      #3: I modify a spreadsheet of business card info and email the file to my printer to import into a biz card template, have I now typeset something?<br>
      #4: I modify a database of business card info and email the database file to my printer to update his database which is linked to a biz card template, have I now typeset something?<br>
      #5: I modify a database of business card info on my printers website which is linked to a biz card template, have I now typeset something?</p>
      <p>Here is my point and question: does modifying raw data constitute typesetting? If so, does a credit card company or bank that uses a specific font in its statements need to purchase licenses or make special arrangements for thousands (maybe millions) of its customers who make purchases, deposts, transfers and withdrawls thereby 'typesetting' the statement? That may sound a bit ridiculous, but I believe that this line between compensated use and non-use of a font needs to be more equitably and definably drawn in an era of increasingly remote data manipulation.</p>
      <p>Please let me know your thoughts.<br>
      --<br>
      Aj</p>
