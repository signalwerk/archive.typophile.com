      <p>John, I said "some kind of grid". That is not very specific. What I mean is that some kind of mental template that uses the spatial relation of marks to one another within the word is operating. That I do think is a fair conclusion. If you have an alternative theory, I'd be happy to hear it. </p>
      <p>I strongly suspect that there is a mental grid eg in the case of Chinese. That's because you learn to write Chinese characters on a grid! I'm also not saying that the grid is all inborn. I'm sure a lot of it is learned, or created in the learning process. </p>
      <p>&gt;But has anyone ever claimed that ability to quickly identify individual letters independent of their conventional use within the writing system is the whole story?</p>
      <p>Well, denying the validity of any distinction between legibility and readability has the consequence that the distinguishably of individual letters is the whole story of readability. And I may not be remembering correctly, but I thought you and Kevin did deny the usefulness of the distinction. The unimportance of these other factors seems to me a consequence of the denial. And Kevin refers to a study on the distinguishably of individual letters, which I don't think is much of an issue with latin script. </p>
      <p>I'm not saying you were consistent :)</p>
