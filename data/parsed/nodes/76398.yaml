      <p>Bill, I'm with you with regard to the human facility for pattern recognition, but this is why, contra your last post, I think that identifying the learned pattern of letters within a word is, if not trivial in terms of the perceptual and cognitive processing involved, something most humans are likely to be very good at. Indeed, pattern recognition is properly understood as pattern isolation, i.e. identifying familiar patterns within a crowded context.</p>
      <p>With regard to Peter's remapping of individual letter recognition to role unit recognition, I think it very likely that as we gain experience in reading we start to recognise the patterns caused by combinations of letters, especially frequent combinations and, I suspect, orthographically significant combinations, i.e. digraphs or diphthongs. But I'm doubtful if these super-letter patterns ever exceed two or three letters in length, and I think were faced with something like a perceptual equivalent of the Arabic ligature problem: if we process a pair of letters as a unit, in a sequence of three letters do we process the first two or the second two? or if we process a triplet of letters as a unit, in a sequence of four letters do we process the first three or the last three? or do we instead process the first two and the second two? or what about the middle two?</p>
      <p>It seems to me that in terms of accuracy relative to efficiency, there are likely to be diminishing returns in trying to recognise units greater than individual letters which remain, after all, the most reliable unit of recognition, the one we can fall back on. The net gain in efficiency may make such super-letter pattern recognition worth while to a point, but I wonder just how far that point is from letterwise word recognition?</p>
