      <p>The results of social science experiments are always open to vastly different "readings", i.e. interpretations.</p>
      <p>Reading is a social phenomenon.<br>
      Yet it seems to me that reading researchers are under the illusion they are investigating a basic physiological process, believing that letters are not cultural artefacts, merely natural shapes, the grammatical content of which can be deciphered at different speeds, and that's all there is.</p>
      <p>Reading science can reveal how we read, but as soon as it gets into passing typographic judgement, it is nothing but market research, or at worst banal scientism.</p>
