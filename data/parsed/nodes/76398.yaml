      <p>&gt;hard to read unconventional use of letters that do not correspond to the norms of the writing system.</p>
      <p>John, why should unconventional use of letters be such a problem, if all of the letters make easily readable words when they are with their stylistic mates? Why should any training at all be needed? Because we have familiarity with all the letter forms, there must be *more* involved in "training" the mind to read words than simply familiarity with individual letters, and which letters go to make up a word with a specific meaning.</p>
      <p>I would also guess that it would be harder to train readers of another script, who didn't know roman script, to read this kind of text than text which keeps to its stylistic mates only. That would show that not only is there "more" than what is involved in isolated letter recognition, but that some mixtures are inherently more difficult for the brain to handle. I also doubt that even with training we could ever read such text with the ease of standard text faces. I am guessing that something fundamental in our visual decoding apparatus is being stressed.   </p>
      <p>I mixed all of the variations—regular and bold, caps and lower case, roman and italic, to maximize the disruption of word recognition. That makes the graphic a refutation of the idea that ability to quickly identify individual letters, and a quickly accessible knowledge of spelling is the whole story. That's all that I'm claiming is demonstrated.  </p>
      <p>My theory of a "matrix" is a vague model, and not a well worked out theory of the "more." I suspect that this portion of reading, the portion that is not in recognition of individual shapes by themselves, is a bigger area for making type more readable than the area of making Latin letters more highly differentiated for isolated quick recognition. Of course there are other issues such as resolution, figure-ground contrast, back-lighting of screens, etc. that are also important. </p>
      <p>Kevin, thanks for the kind words. </p>
      <p>I agree with you that my graphics and analysis are all compatible with a parallel letter recognition model. What I don't think they are compatible with is holding that legibility of individual letters in isolation—ability to differentiate them quickly and reliably—is the same thing as readability—comfort in reading words. The importance of this other dimension of readability is also why I am skeptical that there is much to be gained in increasing differentiation of letters in the Latin alphabet, which are highly differentiated already, especially in stressed, serifed faces.</p>
      <p>In the Hebrew alphabet, there are much more serious problems of differentiation. The scripts of Eliyahu Koren, recently discussed in the "Hebrew" section here, do increase differentiation of Hebrew letters in a way that remains aesthetically attractive, and are felt by many native readers to increase readability.</p>
