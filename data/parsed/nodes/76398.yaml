      <p>[with edits]</p>
      <p>John, there is no magic moment: the change is not that sudden. The literature on perceptual learning details how the change might happen. </p>
      <p>The impetus to change is three-fold: 1) the process of learning to read, being letter-based and iterative, is highly deliberative and cognitively lead but visual word-form resolution must ideally be perceptual driven, effortless and automatic, 2) the disambiguation overload caused by the phonetic assignments of discrete alphabetic markers must be silenced, and 3) narrow phase alignment — which the history of reading has selected for survival — makes the intervening segmentation required to isolate letters for independent (though parallel) recognition hard.</p>
    html_clean: |-
