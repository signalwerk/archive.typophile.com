      <p>I changed my mind about this guy. He's OK. Yes, he's a self acknowledged "type snob"; yes, he elevates writing above the other arts, so he can still KMA.<br>
      But I was reading the chapter on "Grooming The Font" from <em>The Elements Of Typographic Style</em> and it turns out the guy thinks most fonts need fixing. He's a tweaker! Go figure.</p>
