      <p>Bill: <em>s I mentioned with my idea of many different parallel analyses going on and one winning the race, I think the brain is doing a lot simultaneously.</em></p>
      <p>I don't find this idea very persuasive. I find it easier to believe that the cognitive process is iterative, and that the first method tried is determined by previous success. This is also one of the reasons why I'm not convinced that there is a magic moment when someone who had learned to read by recognising letter shapes suddenly becomes a different kind of reader, one who recognises words using some other pattern of shapes: what is the impetus to change something that works? This is not to say that I don't think we gradually pick up the ability to recognise other patterns within words, but I suspect this happens willy nilly, happens as a byproduct of looking at lots of words and not as a cognitive progression. Of course, if Karl Marx were interested in cognitive psychology, this is presumably the point where he would remind me that sufficient quantitative changes result in a qualitative change.</p>
