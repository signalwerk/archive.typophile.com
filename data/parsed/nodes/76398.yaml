      <p>"That's not true within science."<br>
      It may be less true in science, but that is not the point.  The problem is that errant reaction to interpretations by scientists is acted upon by the doers and gatekeepers of the world, not the scientists.  Scientists enquire, theorize, test and publish what they think is in evidence. They may be best intentioned and even accurate in their data-collection but that does not make a dent in what the errant doers do with that information. The doers are people who make stuff, decide stuff, and disparage stuff; politicians and government officials, the legal system bureaucrats, school boards, teachers, students, marketing people, editors, graphic designers, clients, etc. They don't always "get the memo" that a certain study has been found misleading or new information about it has come to light. They just carry on either being naive and unaware or simply choose the study which best props up their own bias. They go on armed with the words "Scientists say" or "I read that" without question. It is not what scientists  SAY, it is what they are REPORTED to have said that causes the problem. Doers don't talk to scientists, they talk to themselves, their neighbors, and listen to their media (be it Fox News or MSNBC, Rush Limbaugh, The Group, or Type Radio.)  Years ago the psychiatric wisdom was that Autism was caused by unloving mothers.   Psychiatric theorists and most laymen know now that that is not true. That does not help the mothers of Autistic children who ever heard the old mistaken tales even once from "Aunt Flo" or their neighbors pet sitter.<br>
