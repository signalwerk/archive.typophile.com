      <p>Bill, putting a grid over the word and matrix resonance might profitably be thought of as two different things. The grid put over words comes from how the permutations inherent in the script system implement cartesian space. Roman versus italic; capitals versus lower case. Lower case uses the x-height axis in a way capitals don‘t understand. Italics use the y-dimension differently than roman by giving it a slant. When these different ways are intermixed in a single word (and compounded with differences in weight — which translates into salience and equals cue-value), matrix resonance becomes difficult to achieve, because the clumps of information are out of synch with each other — they‘re on different registers, or in different keys as it were. A kind of stressed parallel letter recognition becomes the only perceptual processing option.</p>
      <p>What I think this knocks out of the word-recognitional equation is trans-graphemic interfacilitation at the role-unit level. This is a kind of neurophysical cross-talk across letter boundaries while processing letter-parts across the entire word. Edmund Burke Huey’s simultaneous coactivation of letter parts. This is essential for speed, comfort and especially transparency.</p>
      <p>This, by the way is one of the reasons why, though I find Denis Pelli and Kathryn Tillman’s data interesting, I don't accept the conclusions of their triple dissociation study. I don't buy the analysis of wht the various manipulations knock out. Part of the reason for this is that we have different functional ontologies of reading.</p>
