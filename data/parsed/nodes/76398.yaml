      <p>&gt;The problem is, nobody erases the errant conclusions people have drawn from the data. </p>
      <p>That's not true within science. You won't read any articles defending Phlogiston in current science journals. Or for that matter questioning the reality of evolution. Politicians, on the other hand will get up and blather and contradict well tested solutions—with no contrary evidence or argument.  </p>
      <p>The important thing is that within science people do feel the need to address experimental evidence. I'm not saying that there is no poor science; there is plenty of that. But the scientific standard of respect for observation and experiment creates a mechanism of self-correction, of reducing errors of science that other fields unfortunately lack. </p>
      <p>I have often disagreed with Kevin here, but I've never seen him spouting BS, because he does respect the results of observations and experiment. The reality is that it is very hard to get decisive answers from nature, but when they do happen, they stick.</p>
