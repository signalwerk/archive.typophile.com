      <p>David, I think you are suggesting that reading research is only a topic right now because of the poor state of on-screen reading, and if screen densities suddenly improved than the topic would disappear.</p>
      <p>I think you are partially right. It’s certainly true that my job at Microsoft exists because of the poor state of on-screen reading, and a lot of what I focus on has to do with dealing with the problem of poor screen density.</p>
      <p>But reading research is a bigger field than you might imagine with several conferences and journals dedicated exclusively to such research, including specialized conferences for reading education, eye movement studies, and dyslexia. Very few of the researchers at these conferences care at all about the density differences between print and on-screen. For some, having a good model of word recognition is important because it provides information about how to teach a child to read. Interestingly, the two best predictors for a pre-reader becoming a successful reader within the next year are knowledge of letter names and phonemic awareness, being able to manipulate the sounds of language. </p>
      <p>In addition to reading research being interesting because learning how the brain works is intrinsically interesting, and because it is useful for learning how to teach reading, I will also bet that reading research will eventually improve some aspect of print typography.</p>
