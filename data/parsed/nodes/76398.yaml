      <p>John, I agree that humans are very good at identifying letters. Letters are designed to be easy to recognize. But given that our capacity is so much greater, why would our brains forgo the efficiency of recognizing "the" as a whole pattern, and put a semantic association with that? It isn't any more complex than many Chinese root characters, so why not take advantage of that? That's my plausibility argument for Peter's view.</p>
      <p>By the way, Peter, does "interactive activation" theory posit a look-up on the semantic level, or the "matrix resonance" I find plausible?</p>
