      <p>Rich: ...[<em>Bringhurst</em>] <em>elevates writing above the other arts...</em></p>
      <p>He does? Robert is very knowledgeable on music and painting, so this statement surprises me. He has spent years trying -- not very successfully, I think -- to attain in typographic form something of the qualities of polyphonic music, so he is surely aware of some of the limitations of writing.</p>
      <p>Also, it is perhaps better to say that <em>literature</em> is his principle interest, not writing per se, since he has done so much to champion oral literature.</p>
