      <p>Bill, Kate Mayall, Glyn W. Humphries, et. al. [2001] “The Effects of Case Mixing on Word Recognition: Evidence from a PET Study” found that besides the increase in reaction times in naming and other word recognition tasks for alternating-case words, during both an implicit (feature detection) task and an explicit word-naming task, alternating-case words compared to same-case words produced increased activation in an area of the right parietal cortex previously associated with visual attention. They concluded that reading alternating-case words requires increased attentional processing.</p>
      <p>Why are we pretty skilled at it? Because even at significant levels of disruption, with increased attentional processing, and maybe indeed some resultant activation of letter modes, matrix resonance can still happen?</p>
