      <p>William, Williams Caslon is lovely and your paper about its creation was enjoyable to read. Congratulations.</p>
      <p>The components that you identified as important for good readability all seem quite sensible and should be accounted for in a complete model of word recognition: good rhythm, even color, stroke ratio, and avoiding the picket fence. I think these could be compatible with parallel letter recognition models. Good rhythm and even color in particular seem to relate to vision psychologists' concept of spatial frequency. Pelli has shown that we tune to particular spatial frequencies while reading, and that tuning changes by the font that we are reading. If every letter is from a different font or has irregular letter spacing, then it won't be possible to tune to a spatial frequency.</p>
  - id: 440312
    user_id: 1551
    user_name: William Berkson
    user_path: null
