      <p>Peter: <em>I don’t see a reason to restrict the amount of role-unit information the system can form vectors over to the amount contained in two or three letters. Is the Arabic ligature problem really real?</em></p>
      <p>Note that I was suggesting a perceptual parallel to the Arabic ligature problem, which is a mechanical problem, not a perceptual one.</p>
      <p>The Arabic ligature problem is this: if you have a ligature that represents a combination of two letters AB, and another ligature that represents a combination of two letters BC, what do you do when you encounter the sequence of letters ABC? You either need to favour AB over BC, or vice versa, or you need to add an ABC ligature to your font. But what happens if you also have a CD ligature, or even a BCD ligature, and encounter an ABCD sequence? You have to make the same choice about which sequence of letters to process as a unit, and the only way to optimise the typographic results is to add an ABCD ligature, and then an ABCDE ligature, and an ABCDEF ligature, all the way up to the maximum sequence of connected letters anticipated in the vocabulary of the target language(s). And this is exactly what some approaches to nastaliq typography ended up doing, resulting in fonts of &gt;20,000 ligatures, many of them whole words. [And then a Palistani newspaper would transliterate the name of a Soviet premier, and a new ligature would need to be added.]</p>
      <p>The Arabic ligature problem is resolved by not using ligatures.</p>
      <p>What I am suggesting is that a similar problem might arise in any situation in which two or more letters are processed as a unit, including the perceptual situation. If we learn to recognise the pattern of features that constitute two letters in sequence, or three letters in sequence, what happens when we encounter overlapping sequences? You are familiar, I am sure with Wittgenstein's rabbit/duck illustration, or with the famous images of the old crone / young beauty, or the portrait of Freud that can also be seen as a naked woman reclining? The point of such illustrations is that at any one moment we see either one image or the other: we don't see both at once. I believe -- I am not aware of evidence to the contrary -- that pattern isolation, recognition of patterns within a crowded context, works the same way. Otherwise, word search puzzles would be no challenge at all. So in reading a sequence of letters containing two overlapping patterns that we recognise as units, but whose combined form we do not recognise as a pattern, I predict that we will recognise only one of the patterns. Now, it probably doesn't matter which of the two patterns we recognise in that moment, except insofar as one or the other might have an advantage in terms of accuracy or efficiency of identifying the particular word (whereas the other pattern might have the advantage in a different word). But what may matter is that if we try perceptually to resolve the problem by recognising three, four, five letter sequences as patterns that subsume the shorter sequences, there are almost certainly diminishing returns in efficiency and accuracy, unless you think we read like a ligatured nastaliq font with thousands of patterns of letters sequences in our heads to be searched among for matches when reading.</p>
