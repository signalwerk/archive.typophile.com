      <p>In an effort to clarify for myself and others where my intrinsic integration account and a parallel letter recognition account might converge and diverge, let me try the following:</p>
      <p>A letter recognizer, when applied to words, requires a parsing or segmentation routine. Suppose we think of this as a gathering of role-unit level information around salient centres. (We know that role-units — my term for independent letter parts like bowls and stems — are the perceptual processing primitives in reading because of some of Deinis Pelli’s work with spatial frequency channels and efficiency.) The salient centres might be indexed in parafoveal preview. They might correspond with open counters, or areas of high role-unt density or ‘expressed structure’ like in the e or s. The gathering is keyed to determine the prototypical identity of the role-units and detecting their local combinations, such as where and how role unites touch or intersect.</p>
      <p>My account can work on this principle as well.</p>
      <p>In the parallel letter recognition account it is assumed that this gathering proceeds to the point of explicit labeling, constructed in the Interactive Activation scheme as an activation of an independent abstract-letter node. A look-up function, which can be schematized as projection to or feeding-forward to a set of word nodes sits on top of this.</p>
      <p>In my account the gathering around salient centres happens but node activation or explicit labelling is inhibited or suspended. (This is Edmund Burke Huey [1908]’s inhibition of incipient recognitions for letters.) The activation of word-nodes can be more direct.</p>
      <p>It is not the gathering of information around salient centres that I object to, but the explicit labelling / letter-node activation caveat.</p>
      <p>Because my account can effectively work on the principle of a parallel gathering around salient centres, it can in principle account for both our everyday experience — while reading — of words as lettered things and empirical data that is taken to suggest a letter-wise parsing operating in parallel.</p>
      <p>To account for the capacity benefits experimenters see in Word Superiority tests, Marilyn Jager Adams speaks of interfacilitation [her term] at the letter level. My account imagines an interfacilitation routine operating at a role unit level and relying on phase alignment to be effective. The Interactive Activation scheme achieves the same or similar capacity benefits by positing facilitatory feedback loops between levels.</p>
