    <p>From the Microsoft Typography website:</p>
    <p>Redmond - 2 November 2010<br>
    Monitor on Psychology, the magazine of the American Psychological Association (APA), has published an interview with Kevin Larson, of Microsoft’s Advanced Reading Technologies team, in the November 2010. The interview focuses on the interactions of typographers and psychologists in trying to improve onscreen reading. Monitor on Psychology is a general psychology magazine, sent to every member of the APA.</p>
    <p>Here is the url:<br>
    <a href="http://www.apa.org/monitor/2010/11/read-onscreen.aspx" title="http://www.apa.org/monitor/2010/11/read-onscreen.aspx">http://www.apa.org/monitor/2010/11/read-onscreen.aspx</a></p>
