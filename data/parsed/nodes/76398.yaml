      <p>What Denis Pelli found was that the spatial frequency channel that is used is centered at the frequency of stroke-level information — not letters. An explicit presupposition of parallel letter recognition models is the channeling of feature information into independent slots. This is slot-processing. In well-set pages of type we find narrow phase alignment. On the basis of gestalt principles it seems likely that narrow phase alignment is antagonistic to slot-processing. What adherents of parallel letter recognition models might then need to explain, but haven‘t, is how, under conditions of narrow phase alignment, slot-processing ever gets off the ground.</p>
      <p>The successes of the interactive-activation account of how perceptual processing in reading works is really what solidified the case for the parallel recognition model of word recognition. When faced with a spacing effect qualified scientists resorted to ad hocery. In recent years other types of networks have been explored in some domains, including speech perception. These networks rely on notions like non-independance or interfacilitation, and supercapcity. Supercapacity and interfacilitation could illuminate the word-superiority effect, and why, in reading there is an “inhibition of incipient recognition for letters,” to quote Edmund Burke Huey.</p>
      <p>When I explained my ‘single-tiered, intrinsic integration, matrix resonance’* alternative recently to Jay McCelland, one of the architects of the interactive-activation scheme, his response was: If I had but world enough and time I might join you in your quest. I don’t think of this as endorsement, but I do think of it as a recognition that there is a promising and attractive alternative that ought to be pursued.</p>
      <p>In the Monitor on Psychology interview Kevin says “research from reading psychologists suggests...” Wouldn't scientific candor dictate some stronger recognition that the jury is still out.</p>
      <p>* I used this phrase in my TypeCon Atlanta presentation. (The term matrix resonance is a favourite of Bill‘s but also occurs in the cognitive scientific literature on neural network coding. My source for the other two terms is the cognitive scientific literature as well)</p>
