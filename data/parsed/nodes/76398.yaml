      <p>Bill: <em>I mixed all of the variations—regular and bold, caps and lower case, roman and italic, to maximize the disruption of word recognition. That makes the graphic a refutation of the idea that ability to quickly identify individual letters, and a quickly accessible knowledge of spelling is the whole story. That's all that I'm claiming is demonstrated.</em></p>
      <p>But has anyone ever claimed that ability to quickly identify individual letters <em>independent of their conventional use within the writing system</em> is the whole story?</p>
      <p>Writing systems are, well, systems, and reading is an activity that takes place within the normative contexts provided by those systems (including the sub-system norms of particular styles). If you change the normative contexts, e.g. by mixing letters from different styles or breaking normal rules about the use of bicameral forms, then it doesn't surprise me at all that word recognition is slowed.</p>
      <p>Further, you wrote above: <em>This graphic I think shows that the eye-brain combination is putting some kind of grid over the words, and interpreting based on relationship of the marks on paper (or screen) to that.</em> </p>
      <p>This is very clearly claiming that more is demonstrated than a refutation that quick letter recognition is the whole story: you claimed that the graphic showed that a particular perceptual and cognitive mechanism is in use during reading, and I don't think it does. You disrupted normative reading context in at least three different ways in the illustration -- case, style, slant --, making it impossible to isolate factors in a way that would imply inhibition of a particular mechanism.</p>
