    html: '<p>John, I believe that for long words the letter scrambling texts have found that the ends of the word and its length are the stronger influence. As I mentioned with my idea of many different parallel analyses going on and one winning the race, I think the brain is doing a lot simultaneously. This would include identifying sub-word phonemes by pattern. This may seem inefficient, but not when the prime goal is recognizing the word quickly, and given the massive resources available. And this is the phenomenon of "attention": a whole lot of the brain is tasked to the priority of the moment. At least for some of us, that focus means we may not hear our wives reminding us of household chores when absorbed in reading, writing or designing type!</p>'
