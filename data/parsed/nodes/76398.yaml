      <p>I don’t fully understand the conversation at the moment, but it did make me think of these three papers on font tuning. Font tuning appears to be a perceptual process that allows readers to recognizing letters or words faster when they are in the same font that they last looked at. This effect only seems to be true for native readers of an orthography.</p>
      <p>Sanocki, T. (1988). ‘Font Regularity Constraints on the Process of Letter Recognition’, Journal of Experimental Psychology: Human Perception and Performance, 14(3), 472-480.</p>
      <p>Gauthier, I., Wong, A.C., Hayward, W.G., Cheung, O.S. (2006). Font tuning associated with expertise in letter perception. Perception, 35(4), 541-559.</p>
      <p>Walker, P. (2008). Font tuning: A review and new experimental evidence. Visual Cognition, 16, 1022-1058.</p>
