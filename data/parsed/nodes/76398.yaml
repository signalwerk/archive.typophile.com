      <p>Chris, I'm afraid that what impacts on public consciousness is arguments over statistical tests—which are very hard to get anything conclusive on—or sciences that are weak (clinical psychology) or barely scientific at all (economics). But what is taken for granted is the greatest advance in the history of humanity, which is due to science. I am typing on a computer, whose results can be seen within seconds all over the world, and looking through reading glasses. All this is based on really solid science, which we all take for granted. In traditional societies one of ten women die in child birth, today death in childbirth is very rare in wealthy countries. And in our lifetime, the life expectancy has gone up considerably, because of hard science, not debates over statistics. </p>
      <p>Your complaints about weak and bad science are fully justified, but the glorious advances of science are none the less true. And they are based on a method that is fundamentally honest in respecting real observation and experiment, while drawing on the heights of human imagination and ingenuity in creating new theories. The dark side is there, but so is the bright.</p>
