      <p>&gt;you might just as well ask why the brain would do more than it needs to do to recognise the word?</p>
      <p>Well I did ask and answer that, though my answer is conjectural, of course. In my view brain can *more quickly* do whole word recognition than by doing a look-up, given the way the brain works. We can easily recognize the difference between a cat and a dog, a holistic recognition problem that is currently beyond computers (as Kevin has explained) whereas adding 358 and 786 in our heads takes most of us a long time, if we can do it at all. Interactive activation, which is necessary to explain the word superiority effect at all under the "slot processing" model, I suspect operates more slowly than the kind of "matrix resonance" that is going on in pattern recognition. That's one reason why I don't buy that that is what's happening. </p>
      <p>Your argument about increasing ligatures in Arabic is not relevant, in my view, because we are not talking about an endless combination of letters, but a finite and not that big collection of words, a few thousand, and a smaller group of phonetic combination that I think are recognized as well.</p>
