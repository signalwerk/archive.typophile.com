      <p>Kevin, I‘m not all that familiar with the font-tuning literature. But from what I‘ve gathered, I‘d guess phase alignment and implementation of cartesian space play a role in this. I include phase alignment, because the peak frequency in the x-dimension of reading shifts position from font to font, as does the narrowness of the alignment.</p>
      <p>Bill, I‘m not sure what ‘doing a look-up on the semantic level’ might mean in neurophysical / neurobiological / neural-network terms. I don‘t see that the interactive activation account posits either a look-up or matrix resonance, unless you want to think of node-activation as a type of matrix resonance, which is plausible. </p>
      <p>I see three classes of schemes:<br>
      Feed-forward node-activation schemes with feedback loops; matrix resonance schemes which posit vector-placement over networks of statements about identity, connection and location; trace-signature recognition schemes. If recognition manifests itself neurobiologically as a cascading series of neuro-transmissional events, than specific role units, and the registration of their relations in letters, bigrams, diphthongs and words can become uniquely associated with a particular series of such events. The series of events, being unique to the role-unit, etc., can than be said to have a trace signature.</p>
      <p>I hope readers can find some of this illuminating, rather than just confusing. Those conspiring to sort out the perceptual and cognitive mechanics of reading in today‘s environment might benefit from this.</p>
