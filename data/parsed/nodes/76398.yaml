      <p>Kevin underestimates his influence.<br>
      To say that typographers believe people read word shapes rather than letters may have been true in the past, and may still be true at large, but it's nonetheless a bit of a generalization.<br>
      I for one see no reason to doubt this recent scientific discovery, and I'm sure most Typophiles who have followed the readability debates here feel the same way.</p>
      <p>However, just because people read letters doesn't mean the shape of a word is unimportant, or that it is only important as mere aesthetics.<br>
      People "read" the aesthetic qualities of typography, and this reading is quite important, even though such readability cannot be boiled down to a simple measurement of speed.</p>
