      <p>Bill, you lose me in your first two sentences.</p>
      <p>As for the third, I think the visual cortex is biased to select the most efficient route. It's not a matter of which process gets there first. I think the letter process is a phase in learning to read, but once the word is learned there is a there is a remapping in role unit terms. I think the perceptual psychophysics of a well-spaced word is such that the phase alignment that it puts in place becomes the catalyst for the remapping. After this the only place the letter route is really used is when new or unfamiliar words are encountered or disturbance caused by things like alternating case frustrate access to the more elemental role-unit mapping.</p>
