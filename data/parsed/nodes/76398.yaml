      <p>Bill: <em>Your argument about increasing ligatures in Arabic is not relevant, in my view, because we are not talking about an endless combination of letters, but a finite and not that big collection of words, a few thousand, and a smaller group of phonetic combination that I think are recognized as well.</em></p>
      <p>The combination of joined letters in Arabic is also not endless, and the maximum length of a lettergroup is something fairly close to the area of reasonably clear foveal focus in a fixation during reading. The problem that I described is not, in any case, one of length, but of pattern overlap. The length issue only arises if one tries to resolve the overlap issue by recognising larger patterns that incorporates the shorter, overlapping patterns.</p>
      <p>Here is a word of average length: length. If we don't recognise the whole word as a pattern, then there is a very large number of possible combinations of single and multiple letter patterns that we potentially recognise within the word:</p>
      <p>l e n g t h<br>
      le n g t h<br>
      l en g t h<br>
      l e ng t h<br>
      l e n gt h<br>
      l e n g th<br>
      le ng th<br>
      le n gt h<br>
      le n g th<br>
      l en g th<br>
      l en g t h<br>
      l en gt h<br>
      len g t h<br>
      etc.</p>
      <p>Any one of these patterns will be more or less beneficial to accuracy and speed of word recognition than any other, and we can't predict or determine which patterns are actually recognised by an individual reader in a particular situation.</p>
