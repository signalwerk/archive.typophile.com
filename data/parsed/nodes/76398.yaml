      <p>Well, I probably shouldn't have used the word "grid", because I think that it exists but is only part of the story. The term "matrix", which I used in my TypeCon talk, and Peter says is also in the psychological literature, is more general and better. Grid seems to imply that the whole story is whether something falls on or off the grid. And I think a lot more is involved, such as weights, angles, etc.</p>
      <p>My slide I think shows that a mental "matrix" is operating and a grid, or several grids are only part of it.  </p>
      <p>One comparison is enlightening here: I have seen in several places that there are more connections in the human brain than stars in the universe. Even though vision is only one part of the brain, it is clear that we are dealing with a hugely complex and highly adaptable system for pattern recognition.</p>
      <p>Partly because of the brain's pattern recognition power, I doubt that we fail to use pattern information from across more than one letter when recognizing a word, as Peter has argued.</p>
