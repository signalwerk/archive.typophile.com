      <p>John, the capacity gains will have to be assessed by network modeling. Echoing James Townsend, from the Cognitive Modeling Training Program in the Department of Psychological and Brain Science of the University of Indiana in a letter to me, I think they will be competitive until the phase alignment problem — if it can be quantified — is factored in. Then, I expect, there will be some clear differentiation.</p>
      <p>I don’t see a reason to restrict the amount of role-unit information the system can form vectors over to the amount contained in two or three letters. Is the Arabic ligature problem really real?</p>
      <p>There are probably bottom-up and top-down constraints. The bottom up constraint is probably defined by the width of the individual reader’s uncrowded span (Denis Pelli again), which varies. If I remember correctly, it can vary from 5 to 7 letters.</p>
      <p>The top-down constraints are probably of several different orders. Letter vectors form over one or more connected or intersecting role-units. You mentioned digraphs and diphthongs, both of which map to phonologically distinctive complexes. What's to stop them from forming over morphemes where lexicality is the driving force in the vectorization?</p>
