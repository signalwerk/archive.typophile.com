      <p>Massive resources are no excuse for inefficiency. Bill, I think your “many different parallel analyses” scheme results in something I’ve seen referred to by David Boulton as the disambiguation overhead problem. See: <a href="http://www.childrenofthecode.org/library/refs/alphabeticinsight.htm" title="http://www.childrenofthecode.org/library/refs/alphabeticinsight.htm">http://www.childrenofthecode.org/library/refs/alphabeticinsight.htm</a>. I think a horse-race that relies on identifying sub-word patterns kicks in when the rapid automatic process of resolving the whole word pattern in purely role-unit terms fails.</p>
      <p>I’ll have more to say, I hope, about processing analogues to John’s Arabic Ligature Problem after I’ve knocked down some looming deadlines. I’ll be referring to Colin J. Davis &amp; Jeffrey S. Bowers [2006] Contrasting Five Different Theories of Letter Position Coding: Evidence From Orthographic Similarity Effects.</p>
