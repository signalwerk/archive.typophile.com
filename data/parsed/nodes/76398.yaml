      <p>John, I'm not trying to prove anything. I’m just trying to lay out my notions in a persuasive or compelling manner. To do this I try to elucidate, using things I've gathered from years of immersion in the literature on reading — a kind of “critical retrieval,” if you will — how my scheme might elucidate the issues that you raise. The issue was that of impetus. I said a deliberative and iterative process was not ideal, and then highlighted a disambiguation and a potential perceptual psychophysical issue which both of which are insufficiently address. If that's “assuming the initial point,” so be it.</p>
      <p>About phase alignment, fourier transforms show that in the horizontal direction of reading visual information is fairly tightly packed around a single phasal peak, i.e., a single spatial frequency. In transforms of well set type there are typically no competing harmonics, and the packing is not absolute. Competing harmonics begin to appear when type becomes badly spaced. This seems consistent across many typefaces, covering different styles. The realist sans serifs and the bodonis are most tightly packed, which accounts for the picket fence effect. Humanist sans serifs and traditonal old style and transitional faces are better. So when I say narrow phase alignment I am refer to the tight packing around a single phasal peak.</p>
