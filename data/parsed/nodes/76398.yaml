      <p>Bill, I didn't object to you reading too much into data, I objected to you reading too much into a picture that you had made, and I pointed out that the picture didn't demonstrate what you claimed that it demonstrated because there are at least three different explanations for retardation of word recognition potentially at play in the picture, and hence you can't reliably ascribe the cause of retardation to disruption of a mental grid.</p>
      <p>Further, the result of a simple experiment that I conducted -- mixing together only roman and sloped roman forms within a word, i.e. varying only the slant angle to disrupt the presumed mental grid (rather than varying style, case, weight and other factors as in your illustration) -- was that word recognition was much less retarded than in your example. This leads me to conclude that while there may be a mental grid on which the features of letters are perceived, simply shifting some features off that grid by varying the letter slant does not retard word recognition to the same degree that a combination of other factors will that more grievously depart from the learned, conventional sub-system norms of the writing system, e.g. mixing letters of different cases.</p>
      <p>[With regard to the latter, I think it is important to remember that the case distinction is used in English and other bicameral writing systems as a <em>grammatical</em> cue, i.e. it provides information about the structure of text and the kind of words we are looking at. Mixing uppercase letters unconventionally into a word doesn't only disrupt the visual pattern and spatial frequency of the word as it would conventionally be read, but also disrupts the our expectation of the normal role of uppercase letters.]</p>
