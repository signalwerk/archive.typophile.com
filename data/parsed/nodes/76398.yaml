      <p>Bill: <em>But given that our capacity is so much greater, why would our brains forgo the efficiency of recognizing "the" as a whole pattern, and put a semantic association with that?</em></p>
      <p>I never said it didn't, and there seems to be good evidence from saccade length that short words are more easily recognised that long words and some kind of super-letter pattern recognition is likely. But your argument can go both ways. Instead of asking why the brain would forgo the efficiency of recognising 'the' as a whole pattern instead of a sequence of three letter patterns, you might just as well ask why the brain would do more than it needs to do to recognise the word? If letterwise recognition is as efficient as it needs to be to produce the kind of reading speed and accuracy that is typical of mature readers -- which is the claim of the reading psychologists --, is there any need for super-letter pattern recognition, especially within longer words in which, as I suggested to Peter, the necessary overlapping of such patterns would produce variable benefits and may even result in a net cost in some words.</p>
