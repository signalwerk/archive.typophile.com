      <p>A little more on scientific method. </p>
      <p>&gt;I think you are reading too much into your own graphic.</p>
      <p>John, any theory "reads too much" into results of observation and experiment. That is because the data is finite, and theories universal. As Popper said, scientific theories are always conjectures that go beyond the data. The goal is to have imaginative explanations for the data, and then test them. </p>
      <p>The reason for my conclusion is that some kind of "matrix" is the only way I see of *explaining* the data. —In this case the data is the difficulty of reading a word composed of many different letters which are legible on their on. Alternative explanations, or more refined versions of my vague model, would help to test, and to enlighten so I am all in favor of that. </p>
      <p>I agree with you that any good theory would have to account for how reading changes with each variation alone: mixed case, mixed style (italic and roman), and mixed weight. The point of the graphic is to refute the idea that the clarity and unambiguity of individual letters is the only important factor in readability. That's a starting point. </p>
      <p>Chris, genuflecting is not my thing, as you know :) </p>
      <p>I am all in favor of looking at scientific claims critically, and there is a lot of weak and bad science out there, and misleading claims of "scientific authority" for whatever view a person is a partisan of. But I am also in favor of recognizing the power and even the moral goodness of scientific method. The cure for bad science is good science, not no science. That is the main point I am trying to make.  </p>
      <p>Good science is having the courage to make theories testable—so specific that they are vulnerable to possible refutation by observation and experiment. And then it is being honest about the relations of the theory and the data. There is a courage and honesty in good scientific method, and it is a force for progress of humanity. I hear very often criticism of weak and bad science, but I don't hear much public understanding and appreciation for good and great science. Depreciation of scientific method is to me a blow against honesty and progress for humanity.</p>
