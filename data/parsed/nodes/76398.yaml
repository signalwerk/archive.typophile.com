      <p>I think the focus on letters in isolation is a mistake. <a class="freelinking external" href="http://ilovetypography.com/2010/11/02/reviving-caslon-part-2-readability-affability-authority/" rel="nofollow">Here, I discuss the process I used to try to make my Williams Caslon Text as readable as possible.</a> </p>
      <p>As you can see from the first graphic, there is more to a readable typeface than individual letters. This graphic I think shows that the eye-brain combination is putting some kind of grid over the words, and interpreting based on relationship of the marks on paper (or screen) to that. Much of readability is in how the letters in a style relate to one another, and hence to this mental grid. And this involves weight density and distribution, size of counters and relation to spacing and so on.</p>
      <p>This is aside from the question that Peter and I have discussed with Kevin, whether the issue of whether we first identify letters, then do a look-up, or whether we identify words and phonemes as whole patterns. </p>
      <p>In other words, whether or not Peter is right about whole patterns—and I am inclined to believe there is some truth in his view—I think even the one graphic shows that how the letters relate to the mental grid is a key issue. Because even on the letter by letter view "interactive activation", if I remember the term correctly, allows us to identify words when we don't have all the letters in a word identified. This means that one or two ambiguous characters—such as I and l—don't damage readability as much as you might think. </p>
      <p>The "matrix" view puts a lot of readability in the color and rhythm of the text. And by the way this was Matthew Carter's view on Verdana, where he has said that the main advance was on the spacing, rather than simply the letter shapes themselves.</p>
