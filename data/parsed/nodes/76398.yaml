      <p>&gt; Personally, I am sure they can accurately count eye regressions but I don't know that they can say for sure what that means.</p>
      <p>That’s a great point, and why clever experiments are developed to induce what is happening. For example a test could be developed to compare the regressive saccade rates when writing is confusing or when writing is funny compared to writing that is less confusing or less funny respectively. These tests would tell us if confusing or funny writing cause an increase in regressive saccades.</p>
      <p>I expect that most regressive saccades are not caused by the semantic content. One finding shows that blinking is a source of eye regressions. The rate of regressive saccades immediately following a blink is measurably higher than the rate of regressive saccades immediately before the blink. I think this tells us that blinking is disruptive to reading, but is necessary to keep the cornea moist.</p>
