      <p>What amazes me is how WELL humans can read even the worst ßhit writing or type (including my own hand writing).<br>
      We may gain a very minute amount of reading speed and comprehension with further research so scientists can have at it all they want .</p>
      <p>Personally, I am sure they can accurately count eye regressions but I don't know that they can say for sure what that means. I have several reasons that I know I go back and re-read a few words. Here is my top 10:<br>
      1. It was great writing and I enjoyed it;<br>
      2. It was really ßhitty writing and I couldn't understand it;<br>
      3. It said something that really pißsed me off;.<br>
      4. It said something I strongly agreed with;<br>
      5. It was a blatant lie;<br>
      6. It was funny;<br>
      7. It was stupid;<br>
      8. It was about typography (or dark chocolate or coffee);<br>
      9 It was about my family;<br>
      10. It was from the IRS, Ivan the Terrible, or John Gotty.</p>
      <p>My biggest reason would have to be:</p>
      <p>Because I was daydreaming and forgot where I was.</p>
      <p>ChrisL</p>
