      <p>Bill; <em>As you can see from the first graphic, there is more to a readable typeface than individual letters. This graphic I think shows that the eye-brain combination is putting some kind of grid over the words, and interpreting based on relationship of the marks on paper (or screen) to that.</em></p>
      <p>While I'm not unsympathetic to your idea of gridded feature recognition, I think you are reading too much into your own graphic. What the graphic primarily demonstrates to me is that it is hard to read unconventional use of letters that do not correspond to the norms of the writing system. If you took out the uppercase letters and varied only the weight and style of the letters, then I think you would have something more interesting, but with weight differences you would be affecting the spatial frequency as well as a presumed perceptual grid, so perhaps the better test of the latter would be similarly weighted combinations of <em>r</em>om<em>a</em>n a<em>nd</em> i<em>t</em>a<em>l</em>ic l<em>e</em>t<em>t</em>e<em>r</em>s.</p>
