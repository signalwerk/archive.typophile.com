      <p>David: <em>In order to believe in letter-only reading theory, one must accept that the part of humanity reading scripts without letters, isn't reading...</em></p>
      <p>Evidence of letterwise word recognition -- which is what we're talking about not 'letter-only reading' -- has no implications at all for word recognition in scripts that do not use letters, any more than a word-shape theory has implications for scripts, e.g. Thai, that do not visually demarcate word boundaries.</p>
      <p>Would it really surprise you to discover that people read different writing systems in different ways?</p>
      <p><em>...and that the other part of humanity reading scripts with letters, invented words in cahoots with the space between words without a reason, no?</em></p>
      <p>You're begging the question by assuming that the only possible reasons for spacing words are linked to word shape recognition and not compatible with letterwise recognition.</p>
      <p>Visual demarcation of word boundaries has testable benefits in cueing fixations, as seen in variation of saccade length relative to word shapes perceived in the parafovaea, i.e. word spaces enable us to anticipate the length and position of words, long before we're able to recognise what the words are. Visual demarcation of words also has testable benefits in letterwise word recognition, because knowing where a word ends and how many letters it contains enables the brain to exclude possible readings involving letters from adjacent words (and hence miss out on those humorous misreadings encountered in some URLs, e.g. therapistfinder, penisland, expertsexchange, whorepresents, etc.). So that's two benefits to word spacing that don't imply a role for word shape in word recognition and that are perfectly compatible with letterwise word recognition.</p>
