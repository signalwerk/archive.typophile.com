      <p>From a legibility perspective, the purpose of kerning is not the irrelevancy of making attractive word shapes.<br>
      Kerning supports the parallel letter recognition model, by evenly spacing letters so that the status and distinction of each is maximally asserted, disconnected from adjacent letters. Uneven spacing is noise.</p>
