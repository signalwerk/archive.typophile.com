      <p>Bill: <em>And I may not be remembering correctly, but I thought you and Kevin did deny the usefulness of the distinction [between legibility and readability].</em></p>
      <p>I've never denied the usefulness of the distinction, and I've even tried to convince Kevin that the terminological distinction is useful in discussing <em>possible</em> functional distinctions. But I also think that the distinction is largely instinctive -- i.e. we have tended to proceed from usefulness of the terminological distinction to the assumption that there is a functional distinction -- and a lot of question begging takes place as a result of that.</p>
      <p>Re. the mental grid, I am not disagreeing with your theory; I am disagreeing with the claim that your graphic provides evidence that supports the theory. In the first place because your graphic illustrates how word recognition can be retarded, not how it is normally achieved, and in the second place because you disrupted word recognition in multiple ways from which it is impossible to isolate a particular cause for the retardation. Yes, disruption of a grid might account for the retardation, but so might any one of the disruptions of the sub-system norms of the writing system, or disruption of spatial frequency, or simply the fact that the brain is too busy thinking 'That looks weird' to devote sufficient attention to word recognition.</p>
