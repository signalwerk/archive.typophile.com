    <p>I made 10 different styles of a font in FL5, named them correctly both in the open type field and the PS field, generated them all as OpenType (otf), threw them in Fontbook, where they showed up correctly. I then fired up InDesign CS2.. to see that just a few of them showed up, and the menu´s “building” the font like crazy.. Tested in Photoshop CS2, there it all looks fine. What´s going on?</p>
