    <p>Have you ever seen oldstyle figures for Font Family Frutiger LT St?</p>
    <p>I mean, figures that have </p>
    <p>ascenders :       6, 8<br>
    descenders :      3,4,5,7,9<br>
    x - height only : 1,2,0</p>
    <p>Like ITC Braganza.<br>
    <a href="http://www.fonts.com/AboutFonts/Articles/fyti/OldstyleFigs.htm" title="http://www.fonts.com/AboutFonts/Articles/fyti/OldstyleFigs.htm">http://www.fonts.com/AboutFonts/Articles/fyti/OldstyleFigs.htm</a></p>
