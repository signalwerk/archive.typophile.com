    html: |-
      <p>I've seen them in specimens, but never in use.<br>
      In the documentary on Frutiger Next, Adrian Frutiger does a quick sketch of the oldstyle figures (in which he makes a mistake on "4"), which Akira Kobayashi implements (fixing the mistake).<br>
      So I don't think the designer's heart was in it (really, it's a feature made to accommodate Adobe layout apps and the OpenType format), and a bit of a travesty for this modern typeface.</p>
