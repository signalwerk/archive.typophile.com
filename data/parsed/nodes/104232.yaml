    html: <p>Ironically, the biggest limitation of screen typography is that it is scalable. Increased resolution will, I think, create a new technological monster to replace hinting -- the problem of how to adjust the appearance of typography according to absolute type size. We will have to go back to designing multi-size-specific fonts, or parametric fonts. Either way, that is a daunting constraint.</p>
    html_clean: <p>Ironically, the biggest limitation of screen typography is that it is scalable. Increased resolution will, I think, create a new technological monster to replace hinting -- the problem of how to adjust the appearance of typography according to absolute type size. We will have to go back to designing multi-size-specific fonts, or parametric fonts. Either way, that is a daunting constraint.</p>
