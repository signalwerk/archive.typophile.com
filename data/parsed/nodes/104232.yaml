      <p>Cursive is a good way to write, because it is faster than “printing” discrete letters.<br>
      Speed is important, because it allows the writer to capture thoughts before they dissipate.<br>
      Typing is of course faster, but if one is going to use a pen, then cursive is the way to go.<br>
      It is also a more joyful and expressive act—dancing and ﬂowing rather than marching.</p>
