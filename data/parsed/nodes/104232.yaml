  html: <p>Looking at the history of type and the role that process-based limitations have played in its design, what will be the future of type design as we approach the age when retina-level displays are the norm? Limitations on the design of type will be almost completely eliminated. Without these constraints, there is only a blank canvas. What do you see as the future of type?</p>
