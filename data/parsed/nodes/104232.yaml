      <p>We'll probably see script fonts gradually disappearing, since the ability to read cursive seems to be on the way out.</p>
      <p>From a recent New York Times article: "Cursive should be allowed to die. In fact, it's already dying, despite having been taught for decades," said Morgan Polikoff, assistant professor of education at the University of Southern California's Rossier School of Education. "Very small proportions of adults use cursive for their day-to-day writing...As we have done with the abacus and the slide rule, it is time to retire the teaching of cursive," Polikoff said. </p>
      <p>The recently established Common Core State Standards, the standardized educational benchmarks for U.S. public schools, omit cursive as a requirement. Some states, including Indiana and Hawaii, have dropped cursive from their curricula.</p>
