    <p>(I'm reposting this in 'General Discussions' because it only got 85 reads when i put it in 'Home » forums » Special Interest Groups » Typographic Education' which makes me think it got missed by a lot of people.)</p>
    <p>You may all be well aware of this website, but just in case you weren't i thought i'd share this typographic (or should that be glyphic for non-printed letterforms?) goldmine of inspiration i found purely by chance...</p>
    <p><a href="http://www.nb.no/baser/schoyen/index.html" title="http://www.nb.no/baser/schoyen/index.html">http://www.nb.no/baser/schoyen/index.html</a></p>
    <p>(click on an image to see a much bigger version)</p>
    <p>It seems a little picky to say, because the content speaks so well for itself, but it's a shame the website design doesn't really do the content justice. If i weren't so busy i might offer a pro bono make over :)</p>
    <p>Here's a small sample of the wonderous beauties that lay within...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/AristotelesEthics600w_5236.jpg"></div><p></p>
    <p>It makes me feel so talentless. Well, at least digitally fraudulent.<br>
    All hail the scribe.</p>
