      <p>we had a similar thread three or four years ago — the 'blend-tool' solution, or the 'multiple-copies' solution came up in that thread, iirc. Back then, I posted something similar to this as another possible method.</p>
      <p>1. Copy and paste into desired position.<br>
      2. Pathfinder/Unite, then use Delete Anchor PointTool on each letter (the points indicated by the black circles.)<br>
      3. Paste a final layer on top and set to white.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/help_6172.jpg"></div><p></p>
      <p>With rounds, you have to do some extra work with the pen tool. Or you can use Z's method.</p>
