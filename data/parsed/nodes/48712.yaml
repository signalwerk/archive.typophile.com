      <p>Here's a very simple and accurate way to achieve this effect in illustrator...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/3dtext_3487.png"></div><p></p>
      <p>Instructions:</p>
      <p>Make two identical copies of the graphic you'd like the effect applied to.</p>
      <p>If desired give a different color to the main part (top copy) and the 3d part (bottom copy)</p>
      <p>Now with only the bottom copy selected, click: Effect &gt; Distort and Transform &gt; Transform</p>
      <p>Use settings similar to this...<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/3dsettings_5568.png"></div><p></p>
      <p>*If you want to make something like this in photoshop you could record an action of moving a layer repeatedly 1px diagonally.</p>
