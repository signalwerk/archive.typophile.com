      <p>It is an old sign painter or poster artist trick. A reproduction of a late 19th Century British signwriting book of mine calls any effects to give the letters an appearance of thickness "raising". Shadow effects are "shading". I don't know about a special name for this look where the original letter face is removed.</p>
      <p>I'm not sure about Photoshop but in Illustrator I would use the Extrude &amp; Bevel effect. Expand that to be flat paths &amp; then use Pathfinder to knock out the original letters.</p>
    html_clean: |-
