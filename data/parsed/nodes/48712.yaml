    <p>Hi there,</p>
    <p>This is a very simple question but it is one of those mental blocks that is driving me crazy. What is this type effect called? Is it just considered a kind of drop shadow? Also is there a quick way to make it in Photoshop?</p>
    <p>Thanks very much!</p>
