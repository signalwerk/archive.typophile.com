      <p>Hello again,</p>
      <p>So after playing around with the Extrude &amp; Bevel in Illustrator CS3 I don't believe this is what I'm looking for.</p>
      <p>Extrude has two problems that I ran into:</p>
      <p>1) it seems to only be able to give you a 3D effect (Freeza is probably explaining a solution to this when he says "define on the extrude options a pure hard shadow" but I wasn't able to do this. I could remove the shading but I could not change the color of the extruded portion)</p>
      <p>2) it shifts the access of the type. in the picture "FLOW" is completely unaffected, but with Extrude I could never create a 45 degree angle shadow effect without rotating the type some amount.</p>
      <p>Sorry if I'm not understanding you're instructions.</p>
      <p>I see this effect absolutely everywhere so it seems like it must be easy to do (I even saw it on an add on typophile just the other day). Anybody have any other hints?</p>
      <p>Thanks again,<br>
      Sven</p>
