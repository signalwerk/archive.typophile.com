      <p>Here's a way to achieve the effect in Illustrator (somewhat complicated, but works pretty well and the result is scalable without quality issues):</p>
      <p>1. Select the text (or object), copy it (CMD+C), lock the original object (CMD+2), paste a copy behind the locked object (CMD+B) and make it black</p>
      <p>2. ALT+Drag the pasted object away (in your case that would be down to the left), copying it</p>
      <p>3. Select both copies of the original objects, give them  and choose from the top menu Object &gt; Blend &gt; Make (CMD+ALT+B)</p>
      <p>4. From the same palette, choose 'Blend options...'. A new options palette will appear; select the 'Specified distance' option instead of the preset 'Specified steps'. Lower the distance until the individual blend steps aren't recognizable as such anymore.</p>
      <p>5. Unlock the original object (CMD+ALT+2) and group it with the blend if you plan to move it around.</p>
      <p>You can come up with some interesting effects with this method.<br>
      Here's a nice tutorial: </p>
      <p><a href="http://www.bittbox.com/illustrator/fun-with-illustrators-blend-tool/" title="http://www.bittbox.com/illustrator/fun-with-illustrators-blend-tool/">http://www.bittbox.com/illustrator/fun-with-illustrators-blend-tool/</a></p>
