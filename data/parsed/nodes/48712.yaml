      <p>I am more of a Photoshop user than Illustrator, so that's the method I wound up sussing out for this. It's a very easy process that only takes a minute, although it doesn't nail what you want 100%.</p>
      <p>Basically, you just make a type layer, with the color of the text the same as the color of the background. Then click the "Add a Layer Style" button on that layer (the little fx button), and select Drop Shadow. Set the angle to be the drop you want (around 45 deg.), set Opacity to 100%, bring the Spread up to 100%, make the size what you want it at (I used 7px), and then change the distance so that all of the shadow is on the bottom-left of the image (it will tend to peek out of the other edges because of the larger Size) - I went with 11px for this example.</p>
      <p>This method does seem to create some roundness in the drop, unfortunately. It seems like it would be a matter of a few minutes to just manually straighten those edges, so long as this is just for a logo or two. But I suspect there might be a 3rd-party drop-shadow plugin that allows for that roundness to go away. I'll keep playing.</p>
      <p>One love.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/svenSample_5740.png"></div><p></p>
