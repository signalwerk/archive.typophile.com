    <p>LeBeaune<br>
    A new version of this character drawn at first in 1995 for the famous town in Burgundy and its identity and public signage will be available in novembre at "Editions 205".<br>
    The font is entirely redrawn, digitalized. Many ligatures are added.<br>
    In OpenType format, of course.<br>
    <a href="http://www.editions205.fr/index.php?/fonderie/lebeaune--soon/" title="http://www.editions205.fr/index.php?/fonderie/lebeaune--soon/">http://www.editions205.fr/index.php?/fonderie/lebeaune--soon/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/LeBeaune_4236.png"></div><p></p>
