    <p>I have a problem when I export text, and especially footnotes, from word (2003) to pdf.<br>
    You can see the problem in these screenshots (taken from the exported pdf):</p>
    <p><a href="http://users.auth.gr/gtrianta/images/problem1.png">http://users.auth.gr/gtrianta/images/problem1.png</a><br><a href="http://users.auth.gr/gtrianta/images/problem2.png">http://users.auth.gr/gtrianta/images/problem2.png</a></p>
    <p>The problem is these tag-like characters that appear with the footnote reference in the text and also the footnote number at the bottom of the page. I guess there are some sort of tags that word uses to make the footnote reference a link to the actual footnote when you read the text in word. Is there a way to avoid having these marks printed when you export the text in pdf?</p>
    <p>Another problem (again with the footnotes) is shown in the following screenshot:</p>
    <p><a href="http://users.auth.gr/gtrianta/images/problem3.png">http://users.auth.gr/gtrianta/images/problem3.png</a></p>
    <p>The problem here is that when exporting the text in pdf, a number is added before the footnote separator as if it is a "Heading 1" styled text. The same number appears before every footnote separator.</p>
    <p>Any help will be highly appreciated.<br>
    Thanks you in advance.</p>
