    html: |-
      <p>This can happen if you used PDFMaker. The TPF and FPT are footnote markers that apparently get inserted by PDFMaker. I've found a number of PDFs on the web that have them in ZWAdobeF 1 point font. If you have Acrobat, print your document to a .ps file and then distill the .ps file.</p>
      <p>I suspect the heading style being applied to the footnote separator is also due to PDFMaker. However, the footnote separator might have picked up a hyperlink or other cross reference. Go into Normal view and open the footnote separator for editing; look for any field codes or whatever (you might have to set up your options to view field codes).</p>
      <p><a href="http://www.acrobatusers.com/forums/aucbb/viewtopic.php?id=18320" title="http://www.acrobatusers.com/forums/aucbb/viewtopic.php?id=18320">http://www.acrobatusers.com/forums/aucbb/viewtopic.php?id=18320</a></p>
