    <p></p><div class="imageWrap"><img src="http://typophile.com/files/HRPS_logo_5017.jpg"></div><p></p>
    <p>So this is a logo I designed ten years ago for my father's company... originally designed in MS Paint. While I don't plan on changing the logo itself there has been a lot of change in what fonts have been used. The one you're viewing currently is the most recent choice but I was wondering if anyone had any input on what would aesthetically be best.</p>
    <p>Anyways, the following is an excerpt about the company for some background information.</p>
    <p>"HR Privacy Solutions is a New York-based management consulting practice focused exclusively upon helping clients meet the privacy challenges involved in the collection and use of employment-related personal information.  Our clients are U.S. and Canadian multi-national employers and employer service providers needing assistance in complying with domestic and international privacy laws."</p>
    <p>Thanks for any thoughts you might have.</p>
