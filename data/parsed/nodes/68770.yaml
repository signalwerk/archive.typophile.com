    html: |-
      <p>I recommend NOT going freelance right out of school. Do a year or two at a good design place where you will be mentored. You will discover that you learn as much in those two years as you did in school, if not more. You CAN learn the same things as a freelancer, but it will take you 10 years, and the learning will be more painful.</p>
      <p>You can always keep designing type as you work in a conventional graphics job. Who knows, one day you may hit the big time and be able to make a living off type alone. (Very few people do).</p>
