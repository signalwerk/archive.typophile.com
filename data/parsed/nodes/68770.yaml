    <p>Hello all,</p>
    <p>I'm nearing my conclusion of a BA Graphic Design course and I'm wondering what scope there is for a heavy type-related kind of job. Although my course hasn't been overly focused on typography I've gained one of those passions for it that sometimes get you labelled for it—"him? oh, he's the 'type' guy". I've considered freelance (general) graphic design, publishing and even further study (Reading MA!) but I wondered what the professional (and non-professional) opinion is on how to earn your keep via the lovely lovely world of type. </p>
    <p>I already know it's not a high-salary line of work. I don't mind that :)</p>
    <p>For reference (and a bit of self-sell) I've done experience at an advertising firm in London and a small publisher. I have one typeface under wraps that's been accepted into the typodarium 2011 calendar and another experimental one underway for my graduation project.</p>
    <p>Cheers and thank you!<br>
    Lewis</p>
