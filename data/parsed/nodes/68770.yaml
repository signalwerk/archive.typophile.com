    html: |-
      <p>Thanks for the responses and extra to Riccard0 for re-posting those threads. Some informative reading that I've only just managed to read through fully!</p>
      <p>I understand experience is necessary when coming out of education and freelance is definitely the hardest working routes available.  If I could get in with groups like Underware and House Industries it'd be a dream come true and I'd be overseas like a shot. In a less rosey-tinted view of the future however I thought there must be some type firms in the UK? </p>
      <p>A publishing-firm was my initial 'real-world' route, and as you say James, one with strong connections into digital counterparts/supplements would ensure innovative practices to learn of that'd prove of massive benefit. I'd definitely work for an agency within the more general scope of graphic design however (without rambling) branding isn't an interest of mine.</p>
      <p>I guess this means that I've set myself two steps: Firstly I'll search out the dream type-riddled job and see how applicable a route that is for me via application and feedback. Secondly, I can 'settle' (in terms of aspiration) for a broader graphics/publishing job and implement type as much as possible in both working and personal (freelance) areas.</p>
      <p>Is there any UK-specific type-heavy jobs? A MyFonts or FontShop UK office? I know this is a long shot and may not even be possible but I feel I must aim high and be unsuccessful, before I start lowering my sights.</p>
      <p>Thanks again for the advice thus far.<br>
      Lewis</p>
