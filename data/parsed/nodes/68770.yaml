      <p>You're setting out on a long road, but I would follow the advice offered by James; start in the design industry and let people know of your interest. I think I saw another of your posts where you said you're known as 'the type guy' - that's a good start.  You can always design type in your spare time until you have a few typefaces, then offer them to a reseller.</p>
      <p>You never know, you may be lucky; I was, that was my route and I now make a living designing type, but it did take a hell of a long time. You just have to think 'perseverance will eventually pay off'.</p>
      <p>You could try for a placement at Dalton Maag, or just show your folder to them, it's always good to get some feedback and/or advice.</p>
      <p>Keep at it.</p>
