    <p>i'm working on a large typeface family for a client of similar size, and they want the character set to include the windows glyph list WGL 4.0. there's a few characters whose design rules i cannot seem to find anywhere:</p>
    <p>a) line separator u2028 and paragraph separator 2029.<br>
    i've read everything i could find online about these two comrades and know now what they're good for, but how do you design them? -- in other superlarge fonts like everson or code2000, they're just empty with zero width. is that correctly done?</p>
    <p>b) block elements u2580-2593.<br>
    they all appear to be parts of one master 'block', or screen patterns of the same. but i can't figure out what the dimensions of this block should be; it varies considerably across fonts. is the width defined in relation to the emsquare or any other existing glyph? should the height be beyond ascenders / descenders / max. diacrit height? or is it related to the size of the "box drawing" elements?</p>
    <p>thanks much! -- joachim</p>
