      <p>thank you very much Jens!<br>
      so that's what those blocks are for.... great, it makes good sense now.</p>
      <p>you're right about the 'separators' not being in wgl4, it turns out they're a specific requirement of the client. they seem to work like the "br" and "p" in html. my assumption about making them empty at width=0 was confirmed.</p>
      <p>thx also for the link to the wgl4 list!<br>
      --j--</p>
