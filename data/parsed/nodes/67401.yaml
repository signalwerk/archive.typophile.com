      <p>Joachim,</p>
      <p>u2028 and u2029 are not part of <a href="http://www.microsoft.com/typography/otspec/WGL4E.HTM">WGL4</a>, so I wouldn't worry about them ;) I have no idea what they should look like.</p>
      <p>Regarding the block elements: I make the dimensions of the »master block« so that when the font is set without extra leading, the tops and bottoms of the block and line drawing elements touch (or better, overlap a few units). This way they can be used for block graphics like the border elements in this terminal window:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/terminal_6282.png"></div><p></p>
