    <p>I'd like to design logo for my personal photographic website.</p>
    <p>Is it appropriate to ask for type and color recommendation on this forum if I provide general info, like who I'm targeting site for, what is suppose to aspire to, etc.?</p>
    <p>If it's appropriate, on what subforum may I do it?</p>
    <p>If it's not appropriate, can you please link me to useful info I might find on this forum, specifically where should I start? I wouldn't call myself complete newbie concerning type (I'm aware of font types, and basic parameters like X height, etc), but I'm not far from.</p>
    <p>Thanks!</p>
