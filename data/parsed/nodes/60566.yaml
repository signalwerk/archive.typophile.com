    html: |-
      <p>Surely there will be someone that will tell you to hire a professional designer... ;-)<br>
      And it will be for a reason, especially if by “my personal photographic website” you mean “my website as a professional photographer”.<br>
      But, being an almost self taught graphic designer myself, I can understand the need to try by yourself.<br>
      Two little bits of advice:<br>
      1. Always start with black &amp; white (and, dealing with photography, you can well stick with it).<br>
      2. The easiest and most trivial idea you can tinker with is the identity of form between the “O” (as in phOtO) and the lens (iris/pupil). So you could search for a typeface with a perfectly rounded O, or substitute the O with a circle.</p>
      <p>And don’t forget to submit your efforts to the Critique section of the forums! :-)</p>
