  html: |-
    <p>Hello !</p>
    <p>I think fonts softwares offer a great opportunity to produce "more" than types for the client. The project below, Brouniak, is the third for which i used FontLab to create symbols the client can use in classical office softwares to get : vectorial logotype, vectorial backgrounds, vectorial pictograms, etc.</p>
    <p>For Brouniak, i've created a special font, with the logotype instead of letters and dots instead of numbers : the client can use a vectorial logotype on documents he creates under OpenOffice, and the clock of his computer generate dotted random backgrounds (i've used the "insert date/hours" function to do that).</p>
    <p>You can read (in french) the full project here : <a href="http://www.punkat.com" title="http://www.punkat.com">http://www.punkat.com</a></p>
    <p>1. Logotype and font:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/brouniak1_4475.jpg"></div><p></p>
    <p>2. Random covers for booklet:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/brouniak3_6537.jpg"></div><p></p>
    <p>3. Random letterheads :<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/brouniak2_5607.jpg"></div><p></p>
    <p>4. Website :<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/brouniak4_3740.jpg"></div><p></p>
