    html: "<p>And 2000: 185 entries <br>Come on, Stephen, there's a problem. <br> <br>&gt; I don't count the ITDC as a contest <br> <br>1) Then Morisawa wasn't a contest either? <br>2) Only the winners -and not all entries- are (potentially) bound to a license. <br>3) If it's like Morisawa, the exclusion is only for a year. <br>4) It's unclear if it would be illegal to end up selling the font yourself. Selling it to a Linotype competitor however would be illegal (and unethical, as far as I'm concerned, because of the prize money). <br> <br>So in practice the bit about having to give your winning font to Linotype is more a tactic to convince, rather than coerce. <br> <br>hhp <br></p>"
