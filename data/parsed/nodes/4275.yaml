    html: "<p>{Hey, you knew it was coming...} <br> <br>Prestige? The number of entries to the TDC2 keeps falling year after year. So I'm sorry to say that I'm being proven right: it has major flaws. In fact three of them: <br>1) The cost to enter is simply too high for too much of the world. As a result, proven hotbeds of type design talent (like South America - just check out the Morisawa results) get shut out, making the results of the competition less valid. The TDC needs to implement a variable fee based on country of origin, exactly like ATypI membership has now become. The way the TDC uses the word \"international\" is the way baseball uses \"world series\"... <br>2) The judging is too rushed (one weekend!), and this results in the ever-present bad choices among the winners, discouraging entries. Every year there's at least one winner that the bulk of people agree was totally misguided. It's tempting to think that every competition has this problem, but really, in the case of the TDC it consistently seems to go too far. <br>3) The judging is too \"clubby\". The TDC insists on flying the judges to and lodging the judges in friggin' NYC. Total waste of money. <br> <br>The solution to #2 and #3 is exactly what Critique magazine did for their wonderful (and free!) competitions in the late 90s: screen the entries, weeding out the really bad stuff (optional, actually); send the remaining entries to the judges, instead of the other way around; give the judges plenty of time, like a month. Since fonts are adequately shown in one color, on a flexible and flat surface, you would save a lot of money (hence reduce fees) by simply rolling up the 11x17 sheets and cascading them from one judge to the other. Or you could ask people to send five copies to speed things up. Or you could send groups of entries to each judge and get them rotating. And hey, do conference calls if you think interaction among judges is important. ANYTHING is better than donating money to the airlines and hotels. <br> <br>There are in fact other problems with the TDC competition, but they're not as bad as the three above. <br> <br>-- <br> <br>Morisawa was super prestigious, and deservedly so - and it even allowed submission by emailed PDF! But yeah, it's over. Bukvaraz was wonderful, and another one would be even better (it could allow itself to start looking forward rather than back). Then there's the Linotype contest, which is now giving out cash prizes (although there are some strings attached). Note that all of them except the TDC are/were free. <br> <br>-- <br> <br>The ideal competition would have modest (and country-sensitive) entry fees, be held every 2-3 years, and give a choice to each winner of prize+strings or just glory. <br> <br>&gt; what's up in France? <br> <br>Maybe there's a surcharge for entries from those damn anti-war frogs...  ;-/ <br> <br>hhp <br></p>"
