n rules, they come as no surprise. People whose work wins seem generally happy to abide by the rules they have accepted. Considering the cost of other avenues of advertising and marketing, I consider the hanging fee that covers the cost of being in the annual and the shows to be a bargain, considering the reach they give the work. <br> <br>If someone did refuse to pay I think it would be up to the circumstances. IF there were special circumstances involved then I think the club and the winner could come to some understanding. But if the person just refused to pay and offered no reason then I would take it in the same way as someone who tries to welch on a debt and they, most likely, would not be included at all. <br> <br>Every year when someone brings up the TDC Type Design Competition Hrant begins his litany of complaints. I have tried to explain the reason the competition is run the way it is. I have grown weary of doing this every year for the last 6 or 7 years. This is the last I will speak of it. If Hrant thinks he has the answers, I encourage him to start his own competition. It would lovely to see him actually act on his complaints. <br> <br> </p>
