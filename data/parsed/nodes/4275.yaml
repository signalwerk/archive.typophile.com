    html: "<p>&gt; $15,000 <br> <br>You mean for the New York show? What about the other shows (like the one in Rome)? And I have to wonder, how much marketing value do the shows really have? An annual (or something like LCT) seems much more effective to me - but maybe \"movers and shakers\" actually do take enough time away from the shmoozing at the shows to pay attention to the exhibits? Dunno. <br> <br>And sure, someone always pays (by cash, or by giving up licensing decisions, or whatever), but the point should be: <br>1) How to make the entry fees so they don't reduce the validity of the results (think South America). <br>2) How to allocate the funds efficiently (ie: not donate to Delta Airlines). <br> <br>&gt; More uninformed opinion concealed as fact from Hrant. <br> <br>Wasn't it you who once pointed out on Typo-L that the hanging fees are optional? Or was it Gary? Or did that used to be the case but no longer? I definitely heard it from one of you guys. <br> <br>&gt; I guess you will have to keep wondering. <br> <br>That's just great. It's certainly to your advantage for people not to know, I guess... It's like if they win they <i>have</i> to pay up because the consequences of not paying are undefined - sort of like a protection racket... That's New York for you, I guess. <br> <br>-- <br> <br>It's such a shame: with its stellar membership the TDC has such great potential to hold the best type design competitions in the world, but it's consistently proving too stubborn, too unwilling to give up its mimosas, even if the results would be better type. <br> <br>hhp <br></p>"
