    html: "<p>Yeah, it's much more strict than I thought. It's changed over time - but in both good ways and bad, like when I entered back in '97 (or was it '98?) there were no prizes! <br> <br>Does this make it not a contest though? Anyway, that's just a terminological issue. What we should try to figure out is what most type designers want in a contest: fame, no strings, money, licensing, etc. Let's do a survey, eh? BTW, I've been trying to get the TypeCon people to do a panel discussion on contests for years - it's strange that they don't want to - it seems right up the conference's alley. I can picture Carter, Kegler, Montalbano and so many others being superb elements in such a discussion. <br> <br>hhp <br></p>"
