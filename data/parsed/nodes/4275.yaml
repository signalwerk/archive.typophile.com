    html: <p>The Linotype competition attracts -- and is designed to attract -- new designers. Having just judged the most recent one, I can say that there were very few entries from designers whose work I recognised, and there was a lot of work from students. In the TDC show, a lot of the work is already familiar, because major foundries enter the most recent additions to their libraries. <br> <br>I agree with Hrant that the TDC competition is expensive and that this discourages people from entering. It is even more expensive if you win, because you then have to pay a hanging fee and provide six copies of your work for the travelling exhibitions. One of the great things about the bukva:raz! competition is that it was free to enter and there were no hanging fees. But this was only possible with sponsorship from ATypI, underwritten to some extent by the advance from the <i>Language Culture Type</i> book from Graphis.</p>
