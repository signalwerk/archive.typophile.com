    html: "<p>Thanks for the full reply. <br> <br>&gt; I've run your idea past judges of the competition <br> <br>That's good to hear. To me, trying is the most important thing. <br> <br>That said, I still think the TDC competition clearly has a good deal of room for improvement, and the declining participation -among a BOOM in the actual practice of designing type- seems to support that opinion. Another reason to think there's room for improvement is that other competitions have found better ways to do some aspects of the job. <br> <br>The idea about shipping the entries does have its drawbacks, I admit. But as for the fees, I think the least you can do is make it cheaper for people from non-affluent countries. Otherwise, \"For type designers around the world, the TDC2 is the premier annual event to honor the achievement of type designers everywhere\" is simply untrue. <br> <br>&gt; I consider the hanging fee that covers the cost of <br>&gt; being in the annual and the shows to be a bargain <br> <br>That's fine, and I probably agree with you! But we shouldn't try to decide on behalf of other people. For one thing, somebody -possibly a talented designer- from South America for example (it's clear they have many down there) might already be overstretched with the entry fee. As I've pointed out before, I'm not complaining on my behalf: I can afford the entry pretty easily. What makes me complain is a desire to see the results of the competition become more relevant, and become more of a reward-system for everybody with talent and dedication, not just rich people. <br> <br>So if somebody only wants to have won, and doesn't want to pay extra for shows or being in the annual, I think you should try to accomodate that, instead of putting designers on the spot with an agreement they might find too commital. <br> <br>-- <br> <br>BTW, these days I only complain about the TDC competition when somebody else brings it up. And I complain because it makes me sad to see wasted potential, that's all. <br> <br>hhp <br></p>"
