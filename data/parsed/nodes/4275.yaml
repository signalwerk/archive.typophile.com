    html: <p><i>What type design competition do Typophiles feel is the most prestigious, the results of which best represent that year's finest type designs.</i> <br> <br>I think the TDC is the most prestigious annual competition, and having been a judge I can say that it tends to attract a generally high level of work, much of it from experienced and professional designers. Overall, the Morisawa prize was more presitigious for the winner -- and licrative --, but it wasn't annual and has now been cancelled. The most prestigious competition of recent years was probably ATypI's bukva:raz!, but that was a one-off.</p>
    html_clean: <p><i>What type design competition do Typophiles feel is the most prestigious, the results of which best represent that year's finest type designs.</i> <br> <br>I think the TDC is the most prestigious annual competition, and having been a judge I can say that it tends to attract a generally high level of work, much of it from experienced and professional designers. Overall, the Morisawa prize was more presitigious for the winner -- and licrative --, but it wasn't annual and has now been cancelled. The most prestigious competition of recent years was probably ATypI's bukva:raz!, but that was a one-off.</p>
