    html: <p>&gt; <br> <br>&gt; too unwilling to give up its &gt; mimosas, even if the results would be better type. &gt; &gt; hhp <br> <br>Mimosa's? Huh? <br> <br>Stubborn? Why because I don't agree with you. I have been listening to your suggestions on how to run a competition for 6 or 7 years now, and for the TDC, with our publishing deadline, the idea of sending work around the world to a set of judges so they can have as much time as they need, does not work. <br> <br>I've run your idea past judges of the competition, and all have had the same reaction... "no way would I want all this stuff coming to my studio." <br> <br>You seem to think that a weekend is too short a time to judge. After every competition that I have been around, I have asked the judges if they felt they were rushed or needed more time. Every one that I have spoke to has answered the same way. They all felt they had plenty of time. <br> <br>Of the total number of entries, about half are dismissed by the judges in the first hour. So if you have 120 entries, 60 are gone. Of that next 60 half of those go in the next two hours. It doesn't take four people a month to decide on the remainder. <br> <br>All the judges have very clear ideas of what is good and what is not. The discussions are very lively, and I wish everyone could eavesdrop because it is a valuable experience. I remember Matthew Carter saying that if he was in town the year following his judging would it be alright if he came by to watch, because he felt it was such an enjoyable experience. <br> <br>Right there is another reason why it is important to have judges in the same place. They get something out of it as well. I think that bringing someone to NYC and putting up in a hotel for a couple of days is a small honorarium to pay in exchange for their expertise, and commitment. <br> <br>As to Kyle's question about Hanging Fees. No one has ever refused to pay them. Since the hanging fee requirement is spelled out in the competition rules, they come as no surprise. People whose work wins seem generally happy to abide by the rules they have accepted. Considering the cost of other avenues of advertising and marketing, I consider the hanging fee that covers the cost of being in the annual and the shows to be a bargain, considering the reach they give the work. <br> <br>If someone did refuse to pay I think it would be up to the circumstances. IF there were special circumstances involved then I think the club and the winner could come to some understanding. But if the person just refused to pay and offered no reason then I would take it in the same way as someone who tries to welch on a debt and they, most likely, would not be included at all. <br> <br>Every year when someone brings up the TDC Type Design Competition Hrant begins his litany of complaints. I have tried to explain the reason the competition is run the way it is. I have grown weary of doing this every year for the last 6 or 7 years. This is the last I will speak of it. If Hrant thinks he has the answers, I encourage him to start his own competition. It would lovely to see him actually act on his complaints. <br> <br> </p>
