    html: "<p>Because I'm part of a repressed and threatened minority, I need to apply any \"philanthropy\" towards my own people first. I even feel guilty about the $40 that I gave to Typophile last year. And yes, I would be willing -and delighted- to sponsor a promising* non-affluent Armenian type designer. <br> <br>* And \"promising\" from my own perspective. I'm not about to help somebody make more Latinized Armenian fonts for example. <br> <br>&gt; the judges as a body were coming to a decision <br> <br>Yes, this is admittedly valid - I for one am a big fan of communication. But: <br>1) It's just another factor that has to be balanced. If the cost of getting the judges together is preventing meaningful competition results, then maybe it should be tossed? Or here's an idea: don't use one of the world's most expensive cities to host the thing! And here's another: do the judging where type people are going to congregate anyway, like at TypeCon. <br>2) It doesn't preclude doing part of the judging remotely/individually. There might even be an advantage to having a hybrid method, so judges can think both individually and with the benefit of the others - different people think better in different circumstances. So you could send copies of the entries to the judges, give them a week or two to build some preferences and pro/con arguments, then get everybody together to nail down the winners. In this way you have the communication, the shmoozing, and the better results too, without spending more (like you could make the final stage one day instead of two). <br> <br>There's so much room for some nimble, intelligent improvement, instead of this seemingly monolithic and exclusionary thing we have now, I'm just surprised that the TDC competition doesn't seem to be adapting, even though the drop in participation is the strongest possible warning signal. <br> <br>hhp <br></p>"
