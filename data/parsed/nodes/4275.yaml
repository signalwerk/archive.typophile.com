    html: "<p><i>Because I'm Armenian.</i> <br> <br>To clarify: does this mean you might be willing to sponsor a fellow Armenian? or that because you're Armenian you wouldn't sponsor anyone? <br> <br> <br>In addition to the points James made above, I would add that bringing all the judges together in one place is important because of the interaction of the judges in the judging process. In both type design competitions I have judged (TDC and Linotype) there was the sense that the judges <i>as a body</i> were coming to a decision, not that individual judges were making decisions and the majority ruling. This process is worthwhile, and is only possible when people are together to discuss the work before them.</p>"
    html_clean: "<p><i>Because I'm Armenian.</i> <br> <br>To clarify: does this mean you might be willing to sponsor a fellow Armenian? or that because you're Armenian you wouldn't sponsor anyone? <br> <br> <br>In addition to the points James made above, I would add that bringing all the judges together in one place is important because of the interaction of the judges in the judging process. In both type design competitions I have judged (TDC and Linotype) there was the sense that the judges <i>as a body</i> were coming to a decision, not that individual judges were making decisions and the majority ruling. This process is worthwhile, and is only possible when people are together to discuss the work before them.</p>"
