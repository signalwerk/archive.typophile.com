      <p>I think that could have been <a href="http://paratype.com/pstore/fonts/Bannikova.htm" rel="nofollow">Bannikova Roman</a>, used for the headlines in… <em><a href="http://files.myopera.com/samaccat/albums/4020462/novgorod%20pravda.JPG" rel="nofollow">Novgorodskaya Pravda</a></em>. </p>
      <p>And for sure that was Goudy Old Style. I noticed how beautiful the title of an American art book looked. It was <em>Masterpieces of Painting from the National Gallery of Art</em> (Huntingdon Cairns, John Walker, ed. Washington: National Gallery of Art, 1944).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/1944_Natl_Gallery_5796.jpg"></div><p></p>
      <p>Later I learned that the typeface that caught my eye was Goudy Old Style, created by an American designer Frederic W. Goudy, and much later that the book was among the winners of the <a href="http://designarchives.aiga.org/#/entries/%2Bid%3A18486/_/detail/relevance/asc/0/7/18486/masterpieces-of-painting-from-the-national-gallery-of-art/1" rel="nofollow">Fifty Books of the Year</a> competition held annually by AIGA. </p>
      <p>I tried to copy those letterforms, as closely as I was able to. I even ruined the jacket of that book by tracing the cap- and the baselines, and marking the horizontal boundaries of the letters.</p>
      <p>The year was, probably, 1958.</p>
      <p>Now back to the main subject. You know that <a href="http://www.huffingtonpost.com/2012/01/27/hh-bagels-evicted-from-la_n_1236262.html" rel="nofollow">H&amp;H Bagels</a>, New York’s best bagel bakery, is no more?!</p>
