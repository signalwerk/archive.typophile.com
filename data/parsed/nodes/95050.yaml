    html: <p>My high school newspaper sent our typewritten copy to a printer to be typeset (on the Linotype, I assume). As a reporter and features editor, I had to learn copyfitting, and how to spec headline type. Around the same time I bought some sheets of transfer lettering I found in a hobby shop and had some fun fooling around with them (Hellenic Wide was a favorite). But those were just gateway drugs, making me all too susceptible when I went to Cornell and took a class with Prof. Peter Kahn, who had a little workshop tucked away in Uris Library, with a Vandercook and some cases of type. I did a very little bit of very bad letterpress printing, but I had the typography bug for life.</p>
