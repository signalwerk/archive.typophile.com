      <p></p><div class="imageWrap"><img src="http://typophile.com/files/TypesofTypefaces_4578.jpg"></div><p></p>
      <p>My Uncle Ben Lieberman got me interested as a teen. This book actually came later. He had already written books on printing as a hobby, and convinced my Dad to buy a press. So I had fun doing letter press printing as a teen. </p>
      <p>Lieberman had been a journalist. He rose to being editor of the San Francisco Chronicle, but they wouldn't let him touch the presses because he was not union. So he bought a small press and became fanatic about all things printing and type. Among other things, he founded the American Printing Historical Society, whose annual lecture is named after him. He had written his PhD in political science about freedom of the press, which he interpreted rightly first of all as freedom to own a press. He would have loved desk-top publishing.</p>
    html_clean: |-
