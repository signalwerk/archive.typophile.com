    <p>As a kid and teenager in the 60s and 70s,  I went to a gothic architecture church that made the church bulletin using what today is a Blackletter typeface called "Linotext". That got me hooked :) :) back then the church printed the bulletins on their own small typesetting machine...Looking back i wish I had a look at that machine....I just remember being told that they were made there. That church no longer makes that style of bulletin. The very top of the cover of the bulletin with the church's name, was a Blackletter type that is different than Linotext is now for the first letter of each word of the church's name, but the rest of the bulletin used Linotext. For an image of the church bulletin go to....<br>
    <a href="http://www.flickr.com/photos/zeno3333333/5736579584/sizes/l/in/photostream/" title="http://www.flickr.com/photos/zeno3333333/5736579584/sizes/l/in/photostream/">http://www.flickr.com/photos/zeno3333333/5736579584/sizes/l/in/photostream/</a></p>
