      <p>I was fresh out of school with a CS degree in 1983. I went to work for the only start-up tech company in town that any of the profs knew.  The company made printer controllers that let you print bar codes, different fonts, and other graphics - for all kinds of dot-matrix printers. I was hired to take over the software development for the existing business, so the senior guys could work on a new project. The founder and CEO told the R&amp;D dept. he was "betting the company" that we could compete against HP in a new market for low-cost laser printers - we were in line with HP to receive the first shipment to the US of the new 300 DPI Canon laser printer engines, the first ones on the market. You had to buy a lot of them to place an order. </p>
      <p>The CEO refused to pay the license fees Adobe was asking for their fonts, so we (the R&amp;D dept) were told to make our own fonts. They hired two people of artistic bent (but no font design experience) to start. Soon after the gurus had the engines printing at all, test fonts started coming out, and the results were not what the artists expected or wanted. The gurus were busy, so they asked me to have a look. So I learned about the technology between them and the paper, and helped them sort out the problems (inside corner fills, outside corner rounding, unexpected  thicknesses, bad curves, etc.) and got to draw some shapes of my own. My interest expanded from there.</p>
    html_clean: |-
