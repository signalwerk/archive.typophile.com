    html: <p>I remember getting a musty old book from the school library, but for the life of me I can't remember anything about it except the typefaces. Whenever there was dialogue (and there was a lot), each character "spoke" in a different typeface. One was italic, one was hold, one was sans-serif, one was Old English, and so on. It was incredibly hard to read, not only because the story line was boring, but the mixture of typefaces was physically jarring. Being an artistic person, I realized it must be something in the design, and I set out to study type design.</p>
