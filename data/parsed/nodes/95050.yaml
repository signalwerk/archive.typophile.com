      <p>I honestly don't remember what got me started.  I know I knew that a person could make a 'font' quite early in life.  Some friends of mine were taking a class on it in a vo-tech class in highschool. (in the US a vo-tech class is a class about something highly technical--car repair, etc.  Most of the time there is only one place per county where you can get this training, and the students would have to leave their high school and travel to this place, which is the main reason why a lot of people liked to take the classes)  So I was about 14 when I found out that it was possible for someone to make a font, but I never really took any interest in it.  20 years later I made my first typeface. </p>
      <p>I don't know what made me want to get into it, but I can tell you sometimes I wish I never did.  Type design is fiendishly hard.  Probably because it looks so simple.  Sometimes I get really sick of it, like, literally sick to my stomach.  And what's worse is that there is no escape.  We are surrounded by text everywhere, all day.  The only place you could go to get away from it would be somewhere out in nature, far away from humanity.  If I was a landscape painter, and grew sick of seeing landscapes, I could just hold up in my apartment.  If I was a portrait painter, I could stay home, keep the TV off, and not talk to anybody.  However as a type designer there really is no escape.</p>
      <p>Moreover I really do think Spiekermann was right.  It <em>is</em> a disease.  An incurable disease.  No matter how sick of it I get, or how frustrated, I come back to it shortly.  I'm a fairly creative person.  I have written over 12 hours of music, from classical to rock to hip hop to sound collage.  I'm a graphic designer.  I have acted in plays, and made short films.  I have tried my hand at oil painting.  I have written hundreds of pages of stories and essays, and won awards for it.  I have written hundreds of poems and done the stand up spoken word thing.  I have written tens of thousands of lines of computer code.  I cut people's hair, men's and women's...  the list goes on...  But none of it, not one other part of it, has such a strong hold on me as type design.  I imagine its what taking heroin must be like. Once you get a taste you're hooked for life.  I believe this is because such small changes can make such a huge effect.  Moving a node by one em, or a control arm by one em, can make a huge difference, and all it takes is one click of an arrow key, whereas with anything else, making changes requires a lot more work, and may not even be noticed.  I sit and I look at my type in fontlab, and it's so easy to see, "oh, this part is a little too thick." click.  "Oh look at this other part, it needs this." click.  The ease of changing it all and the huge effects such easy and small changes can have is incredibly addictive.  The perfect typeface is only one small click away, and then just one more click, and then just one more click, and then just one more click.....</p>
    html_clean: |-
