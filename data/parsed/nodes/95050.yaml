      <p>I had been quietly studying up on screen "readability" with the intention of writing about it.  I had also done web development for the New York City Transit Authority.  Intranet work, mostly.<br>
      So when it became clear that fonts were finally going to become web server based resources, I felt there was an opening for somebody to focus on that.</p>
      <p>There still is.  We're almost at the end of the beginning by my reckoning and I'm planning on ratcheting up my involvement quite soon.  I think the last tally I read - and give some credence to - was that about 8% of web sites now have web fonts in use.  Only 8%. </p>
      <p>I have my tastes, but I'm certainly no designer.  My interest is more technological -  getting fonts to work well - consistently and predictably - onscreen in web pages. I'm also interested in the impact a greater range of typefaces has on expression onscreen.  To take a metaphor from musical theatre: Typefaces are the alphabet in costume and typography is the orchestration.</p>
