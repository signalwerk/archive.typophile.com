      <p>I too had a John Bull set.<br>
      And played with Letraset.<br>
      But there are many things I “started to become interested in” that didn’t end up as my career(s).<br>
      With type, I would say in retrospect that an accumulation of inﬂuences and circumstances made me an art director and subsequently a type designer.</p>
      <p>Had I been a better art director, I would no doubt have worked at an agency doing broadcast ads rather than B2B type-heavy print, directed commercials, and eventually become a movie director like Ridley Scott. </p>
      <p>Rather than a serial accumulation of prods in this direction, there may well have been a turning point when two or more inﬂuences coincided. </p>
      <p>I can certainly attribute my career as a (successful) type designer to one person. In the mid 1980s I gave up on type design, having had a couple of faces published—a lot of work and precious little remuneration. Then in 1993 David Michaelides, the manager of the FontShop store in Toronto, organized a type event with Carter and Brody speaking; he then suggested I present some type concept ideas to FontFont, which I did, and they published Fontesque, which became very popular. Had it not been, I would probably not have pursued type design any further.</p>
      <p>A lot of turning points, serendipity, personal inspiration, opportunities opened up by new technology, and so on.</p>
