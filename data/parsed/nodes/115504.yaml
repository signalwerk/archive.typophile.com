    <p>Hello,</p>
    <p>I have tons of problem with Fontlab 5.1.2 on Mavericks and my intuos wacom tablet. This is very hard to work with as the tablet does not respond to the commands. When you click a glyphs it would select another. When you click a point it will randomly moves the window space. I know there are some threads around the web talking about these issues. But I cannot find any solutions. Anyone might have resolve these wacom bugs ?</p>
