  html: "<p><b>Veer Announces: New Umbrella Typefaces for May 2004</b> <br> <br>Veer is pleased to announce the availability of several new and exclusive typefaces this month - all part of our growing <a href=\"http://www.veer.com/umbrella/\">Umbrella</a> collection. These typefaces can be found in the May edition of the <a href=\"http://www.veer.com/ideas/catalogs/\">Veer Visual Elements Catalog</a> and on our web site. <br> <br>............................................................................................................................................ <br> <br><img src=\"http://www.typophile.com/forums/messages/72/35636.gif\" alt=\"Umbrella Ayumi\"> <br><a href=\"http://www.veer.com/results.asp?image=UMT0000026\">Ayumi</a> by Neil Summerour <b>{ Umbrella }</b> Ayumi (pronounced, 'ah-yoo-me') comes from the Japanese word 'to walk', representative of this face's walking the fine line of quirkiness and utility. Ayumi is as much an unserif as it is a san serif. Distinct characters like the rigid 'g', the quirky 'y', and the slight curl of the true italics provide subtly unique features without calling too much attention. The Ayumi family includes eight weights: Light, Normal, Medium, Bold, plus italics and is available is three different packages. <br> <br>............................................................................................................................................ <br> <br><img src=\"http://www.typophile.com/forums/messages/72/35637.gif\" alt=\"Umbrella Headcold\"> <br><a href=\"http://www.veer.com/results.asp?image=UMT0000028\">Headcold</a> by Neil Summerour <b>{ Umbrella }</b> Got a fever? Head pounding? Headcold takes two aspirin and asks that you call it in the morning when you need a display face. This heavy display font adds even more personality with dingbats showing off how they feel. Headcold comes in two variations: Regular and Shadow <br> <br>............................................................................................................................................ <br> <br><img src=\"http://www.typophile.com/forums/messages/72/35638.gif\" alt=\"Umbrella Brisa\"> <br><a href=\"http://www.veer.com/results.asp?image=UMT0000027\">Brisa</a> by by Alejandro Paul &amp; Angel Koziupa <b>{ Umbrella }</b> Another fine example of the casual script by the Argentine team of Paul and Koziupa. Quicker than lightning and just as poignant, Brisa shows unprecedented determination, presence of spirit, and confidence. Brisa comes with two weights: Regular and Alternates <br> <br>............................................................................................................................................ <br> <br><img src=\"http://www.typophile.com/forums/messages/72/35639.gif\" alt=\"Umbrella Pill Gothic\"> <br><a href=\"http://www.veer.com/results.asp?image=UMT0000043\">Pill Gothic</a> by by Christian Robertson <b>{ Umbrella }</b> The long awaited first release by Betatype's Christian Robertson, Pill Gothic is a geometrically constructed font designed plainly enough for traditional text settings, but funky enough to have a cool edge. The family offers a complete set of tools for expert typesetting, with OpenType features including small caps, old style numerals, small cap numerals, fractions and alternate characters. These features are also available to OS X native applications (Cocoa) as AAT (Apple Advanced Typography) features in the TrueType version. The complete Pill Gothic family includes normal and condensed varieties and a full range of weights making it a superbly flexible text family. <a href=\"http://www.veer.com/search/results.aspx?producttype=typ&amp;keyword=%22Pill%20Gothic%22\">Several packages</a> are available exclusively from Veer. <br> <br>............................................................................................................................................ <br> <br><img src=\"http://www.typophile.com/forums/messages/72/35640.gif\" alt=\"Umbrella Mince\"> <br><a href=\"http://www.veer.com/results.asp?image=UMT0000036\">Mince</a> by Corey Holms <b>{ Umbrella }</b> Stretching the human mind and its capacity to grasp order and establish meaning, Mince amuses itself by inflating font forms to the limits of comprehension, implying a palpable roundness as though suffering from over-inking. Singularly, each character is abstracted to the furthest point of legibility, but when viewed as a word, the pattern emerges and the viewers' brain completes the circuit. The Mince family includes two weights: Regular and Shadow <br> <br>............................................................................................................................................ <br> <br><img src=\"http://www.typophile.com/forums/messages/72/35641.gif\" alt=\"Umbrella Kautiva\"> <br><a href=\"http://www.veer.com/results.asp?image=UMT0000035\">Kautiva</a> by Alejandro Paul <b>{ Umbrella }</b> Kautiva is a comprehensive modern sans serif family that includes true italics, small caps, and unicase variations. Kautiva was developed to be efficient in both text and display environments and serves as a refreshing middle ground between serious geometric and overly humanistic design. The OpenType format Kautiva Pro family is available for those who want to take advantage of the numerous features of the format: from true small caps to a variety of ligatures and stylistic alternates, through proportional and tabular figures and complete support for a multitude of Latin-based languages, as well as Cyrillic and Greek scripts. <a href=\"http://www.veer.com/search/results.aspx?producttype=typ&amp;keyword=kautiva\">Several packages</a> are available exclusively from Veer. <br> <br>............................................................................................................................................ <br> <br>For more information regarding these new type products, contact: <br> <br>Jacqueline Wallace <br>403 313 4942 <br><a href=\"mailto:media@veer.com\">media@veer.com</a></p>"
