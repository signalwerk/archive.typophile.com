    <p><strong>Hello</strong>,<br>
    long time no see.</p>
    <p>I am assembling a list of currently released books on typography. It is meant to be a shopping list as I intend to review them for a magazine on a quarterly basis. </p>
    <p>Typography is meant in a rather broad term here, it could be the basics (as <a href="http://insideparagraphs.com" rel="nofollow">Inside paragraphs</a> by Cyrus Highsmith) or slightly more advanced (<a href="http://markbattypublisher.com/books/typography-monographs-volume-2-size-specific-adjustments-to-type-designs-an-investigation-of-the-principles-guiding-the-design-of-optical-sizes/" rel="nofollow">Size-specific Adjustments to Type Designs: An Investigation of the Principles Guiding the Design of Optical Sizes</a> by Tim Ahrens) or biographies (Patricia Costs book about the <a href="http://ritpress.rit.edu/publications/books/bentons.html" rel="nofollow">Bentons</a> springs to mind, or the books about Excoffon and José Mendoza y Almeida from <a href="http://www.ypsilonediteur.com/typo.php" rel="nofollow">Ypsilon éditeur</a>).<br>
    Also Stephen Coles <a href="http://typeanatomy.com" rel="nofollow">The Anatomy(/geometry) of Type</a> obviously, and maybe I can squeeze in the second edition of Fred Smeijers <a href="http://www.hyphenpress.co.uk/books/978-0-907259-42-8" rel="nofollow">Counterpunch</a> ? </p>
    <p>I would like to ask you for more suggestions. It needs to be at least partly in English and preferably released in the last two or three years. Anything you consider should be in the home of a proper typographer. </p>
    <p>ok, a happy Walpurgis Night to you all.</p>
    <p>ƒ.</p>
