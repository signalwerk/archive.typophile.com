    html: |-
      <p>Not a typeface, but hand lettering (as was most poster display type of the era).</p>
      <p>The lettering appears to be based on an old woodtype style called Latin:<br>
      <a href="http://www.myfonts.com/fonts/mti/latin/" title="http://www.myfonts.com/fonts/mti/latin/">http://www.myfonts.com/fonts/mti/latin/</a></p>
      <p>Some digital typefaces with a similar vibe (but by no means a match to your sample):<br>
      <a href="http://www.houseind.com/fonts/edbenguiatfonts/" title="http://www.houseind.com/fonts/edbenguiatfonts/">http://www.houseind.com/fonts/edbenguiatfonts/</a> [Ed Roman]<br>
      <a href="http://www.google.com/fonts/specimen/Fontdiner+Swanky" title="http://www.google.com/fonts/specimen/Fontdiner+Swanky">http://www.google.com/fonts/specimen/Fontdiner+Swanky</a></p>
