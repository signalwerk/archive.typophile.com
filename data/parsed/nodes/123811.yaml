    html: |-
      <div class="comment-spam-body"><p>AFAIK nobody has made this lettering into a font.<br>
      The capital letters are fairly standard Roman letters with pulled out serifs. Fonts that include this feature include Ronaldson </p><div class="imageWrap"><img src="http://typophile.com/files/RonaldsonAsTMW_5765.gif"></div> <a href="http://www.myfonts.com/fonts/canadatype/ronaldson/" title="http://www.myfonts.com/fonts/canadatype/ronaldson/">http://www.myfonts.com/fonts/canadatype/ronaldson/</a> and Tiffany <div class="imageWrap"><img src="http://typophile.com/files/TiffanyMedAsTMW_5064.gif"></div> <a href="http://www.myfonts.com/fonts/itc/tiffany/" title="http://www.myfonts.com/fonts/itc/tiffany/">http://www.myfonts.com/fonts/itc/tiffany/</a><br>
      The other letters are an unusual mix of roman letters with big ball terminals and sloped letters. For some ideas see Everafter Bold <div class="imageWrap"><img src="http://typophile.com/files/EverafterBoldAs_anho_4640.gif"></div> <a href="http://www.myfonts.com/fonts/typetrust/everafter/" title="http://www.myfonts.com/fonts/typetrust/everafter/">http://www.myfonts.com/fonts/typetrust/everafter/</a> and Oxtail Black <div class="imageWrap"><img src="http://typophile.com/files/OxtailBlackAs_anho__5811.gif"></div>  <a href="http://www.myfonts.com/fonts/macrhino/oxtail/" title="http://www.myfonts.com/fonts/macrhino/oxtail/">http://www.myfonts.com/fonts/macrhino/oxtail/</a><br>
      Don<p></p>
      </div>
