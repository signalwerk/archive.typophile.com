  html: |-
    <p>Can anyone ID this font? It has humanistic tendencies with Geometric serifs. There is a lot of modulation in the stems. It's similar to Bodoni or Didot, but not quite. The "R" is a good distinguishing letter.</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/victorian_6175.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/victorian_2_3445.png"></div><p></p>
    <p>Thanks in advance,</p>
    <p>B</p>
