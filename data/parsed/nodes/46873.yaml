      <p>Hello, I have many letters that were hand-written in German with the Sutterlin font. These date from the early 1930s. Since this was the time when Hitler came into power, they would contain interesting historical information. Therefore, I would like to translate them, but I cannot read this script. This is also so because of variations in the handwritings.</p>
      <p>Does anyone have any suggestions?</p>
      <p>Thank you very much.</p>
      <p><a class="freelinking external" href="http://www.herobooks.com" rel="nofollow">“Heroes from the Attic: A Gripping True Story of Triumph”</a><br>
      A Memoir by Herman Neuman<br>
      Miraculous Survivor, Author, Inspirational Speaker<br>
      Toastmasters International</p>
