      <p>There are various transcription services for documents written in Sütterlin and other ‘Kurrent’ handwriting styles. I guess most of them are located in German speaking countries. However, they often also offer translation into English, or at least can communicate in English.</p>
      <p>Search for <cite>Sütterlin, Kurrent, transcription</cite> etc.<br>
      F</p>
