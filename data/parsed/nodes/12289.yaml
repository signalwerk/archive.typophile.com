    html: |-
      <p>The thing that remains attractive about Fontographer is the simplicity of the interface and the font generation options. I use Fontlab, but become enormously frustrated with the number of options and setting just to generate a single typeface. Fontographer doesn't get in the way of the generation of the file. Certainly, it's not nearly as flexible or powerful and it cannot produce OpenType fonts, but most of time (for what I do anyway) I don't need those features. There are folks like me who have been using Fontographer since it first came out (late 80s) and are used to how it works and where the tools are and what the expected outcome of the generated file should be. Fontlab is too cumbersome to learn when you have little time to change your work habits.</p>
      <p>Of course, this is one person's opinion.</p>
      <p>I think that Fontlab (the company) taking over Fontographer development and support can only lead to good things in the long term.</p>
