    <p>Fontlab Ltd., 136 E 8th St., Port Angeles WA 98362, USA</p>
    <p><strong>FONTOGRAPHER HAS A NEW HOME AT FONTLAB LTD.</strong></p>
    <p>Fontlab Ltd. Licenses Legendary Font Editor, Plans to Continue Development</p>
    <p>For Immediate Release<br>
    Monday, May 9, 2005<br>
    Contact: Ted Harrison<br>
    Fontlab Ltd.<br>
    Tel: +1 (509) 272-3260<br>
    <a href="mailto:contact@fontlab.com" rel="nofollow">contact@fontlab.com</a></p>
    <p>Port Angeles, WA, USA, May 9, 2005: Fontlab Ltd. is pleased to announce<br>
    the licensing from Macromedia Inc. of the Fontographer product line.<br>
    “Fontographer is a respected name in the field of digital typography,”<br>
    said Ted Harrison, president of Fontlab Ltd. “We are proud to add this<br>
    legendary font editor to our lineup of products.” As of today, Fontlab<br>
    will continue to sell the current version of Fontographer while beginning<br>
    work on fixing bugs and preparing a new version - expected to be released<br>
    early next year.</p>
    <p>“With nearly two decades of presence on the market, Fontographer has<br>
    gained a reputation as an easy-to-use and reliable tool for creating<br>
    digital fonts, and continues to boast a strong and dedicated user<br>
    community among desktop publishers, graphic designers and typographers. We<br>
    feel that Fontographer will find a secure and comfortable home at Fontlab<br>
    Ltd. Our team is committed to continuing the development of a brand-new<br>
    version of the product,” said Harrison. Harrison continues, “With our TypeTool product we have a font editor for<br>
    beginners, hobbyists and students. FontLab Studio and AsiaFont Studio are<br>
    our high-end products with a certain degree of technical complexity, aimed<br>
    at professional type designers. With Fontographer, we now have a tool that<br>
    fills the gap between those products - a font editor for graphic designers<br>
    and desktop publishers, powerful enough for real-world typography but<br>
    without all the bells and whistles of our high-end products.”</p>
    <p>Fontlab Ltd. will offer upgrade paths from TypeTool 2 to Fontographer 4.1<br>
    (US$249) and from Fontographer 4.1 to FontLab Studio (US$299) and to<br>
    AsiaFont Studio (prices to be announced.)</p>
    <p>Fontlab will assume support for Fontographer version 4.1+ from Macromedia<br>
    and will retain the services of Fontographer guru Jim Gallagher, who has<br>
    nurtured Fontographer for the last ten years, and who will advise the<br>
    Fontlab development team in their task of updating Fontographer.</p>
    <p><strong>About Fontlab Ltd.</strong></p>
    <p>Fontlab Ltd. is the world’s leading developer of digital typography<br>
    solutions. Their full line of products is dedicated to solving typographic<br>
    issues ranging from the simple to the most complex. These products<br>
    include: AsiaFont Studio™, BitFonter™, FontLab Studio™, ScanFont™,<br>
    TypeTool™, TransType™, FontFlasher™, FONmaker™, SigMaker™<br>
    CompoCompiler™ and Photofont. More information on all Fontlab products<br>
    can be seen at <a href="http://www.font.to/cgibin/at.cgi?a=227536" rel="nofollow">www.fontlab.com</a>.<br>
    					###</p>
