    votes: null
    html: |-
      <p>The QA we used for years was basic and functional. Did the fonts print on multiple output devices? Did the font names map cross-platform? Did glyphs drop out? Did the visual appearance remain consistant between Type One and TrueType flavours? It wasn't rocket science. In the 16 or so years that I have used Fontographer, the inherent quality of the fonts depended more upon the consistancy and attention to detail in the design of the outlines and the tweaking of the metrics than that of the engine which generated the final files. Perhaps I'm not as particular or granular about the same details as other type designers, but over the years we produced, developed, generated, sold, and supported thousands and thousands of Fontographer-based Type One and TrueType fonts without any customer (or internal - as we have always eaten our own dog food) feedback indicating that the technical quality of the fonts were anything less than fine and dandy.</p>
      <p>This is not to say that Fontographer couldn't stand a good soak and scrub behind the ears.</p>
      <p>My excitement about this announcement has less to do with the potential of improving the back-end services of Fontographer (which I agree, certainly would not hurt) and more about continuing to give designers an alternative tool to develop fonts. Fontographer fits my workflow more than the likes of Fontlab or TypeTool. If I was more involved in producing double byte OTFs, I am certain that my priorities in terms of font design toolsets would change.</p>
