  - id: 71515
    user: 1262
    date: 2005-05-09T14:40:00
    date_raw: 9 May 2005 — 2:40pm
    votes: null
    html: <p>The font business had a pretty easy ride during most of the 1990s with regard to quality assurance. PostScript RIP engineers went out of their way to accomodate all sort of font bugs that would not have been accepted in Adobe's own fonts, and printer manufacturers effectively cut their TrueType teeth on some of the worst fonts ever made, because for several years only a handful of company actually knew how to make good TrueType fonts. So we could afford to be less than particular about spec conformance. But I think we need to wake up to the fact that those times are changing. Windows began preventing some kind of problem fonts from being installed, although they were still pretty generous about what they would accept. Apple is now doing likewise. We're looking at a future of digital signatures in which corporate customers will likely refuse installation of software from unapproved vendors, including fonts. I think all font developers, big and small, need to be aware of this; especially the small ones, if we want to maintain the diverse and dispersed font business that we've created in the past fifteen years. The demand for assured technical quality -- especially spec conformance -- in fonts is going to increase, and we need to be able to deliver. The good news is that font tool developers like FontLab are aware of this, and Microsoft, Adobe and Apple are all helping by providing testing tools for OT and TT fonts. But we're the ones who have to learn to use these test tools and develop workflows that incorporate them.</p>
