    html: "<p>Grant, what quality assurance tests do you put your Fontographer fonts through? My concern with Fontographer is that it never actually generated very good quality fonts. This wasn't obvious to most people because almost no one tested the fonts in any kind of rigorous way, and there has never been a proper quality assurance process for Type 1 fonts outside of Adobe. Some years ago, Adobe were testing various commercial font tools to see if any might be suitable replacements for their old Unix-based development tools. At the time, neither Fontographer nor FontLab produced PostScript code that the Adobe RIP engineers thought was of a satisfactory standard. Now, of course, FontLab uses Adobe code to generate CFF OpenType fonts, (as for Type 1 most people know my opinion of 8-bit font formats and what should happen to them), and presumably a new version of Fontographer from the FontLab people would do the same. But it seems likely to me that all that will remain of Fontographer will be the UI: they are going to need to replace the entire back end of Fontographer with something that produces better quality fonts.</p>"
    html_clean: "<p>Grant, what quality assurance tests do you put your Fontographer fonts through? My concern with Fontographer is that it never actually generated very good quality fonts. This wasn't obvious to most people because almost no one tested the fonts in any kind of rigorous way, and there has never been a proper quality assurance process for Type 1 fonts outside of Adobe. Some years ago, Adobe were testing various commercial font tools to see if any might be suitable replacements for their old Unix-based development tools. At the time, neither Fontographer nor FontLab produced PostScript code that the Adobe RIP engineers thought was of a satisfactory standard. Now, of course, FontLab uses Adobe code to generate CFF OpenType fonts, (as for Type 1 most people know my opinion of 8-bit font formats and what should happen to them), and presumably a new version of Fontographer from the FontLab people would do the same. But it seems likely to me that all that will remain of Fontographer will be the UI: they are going to need to replace the entire back end of Fontographer with something that produces better quality fonts.</p>"
  - id: 71508
