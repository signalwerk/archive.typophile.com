      <p>Yes, the italic f is giving me problems too. I was hoping some of the other Kis fonts might show the difference, but so far I haven’t seen it. The chin on the G and the oddly splayed M and the drooping ‘g’ ear are Kis/Janson hallmarks, so I still don’t think this is Caslon.</p>
      <p>You say that the book is a reprint of a 1971 book. I wonder if they used the old plates, and that this is a metal version of the type.</p>
      <p>- Mike Yanega</p>
