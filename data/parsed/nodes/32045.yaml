  html: |-
    <p>Hi everybody,<br>
    Here’s a font I can’t quite identify. It reminds me of Caslon but it seems more<br>
    rounded, compact, and ‘heavy’. I’ve tried using the Serif Font Identification Guide but did not find a match.<br>
    The book is a 1997 reprint of a 1971 edition of Michel Foucault’s ‘Madness and Civilization’.<br>
    Hope someone can at least give me a pointer.<br>
    Thanks in advance.</p>
