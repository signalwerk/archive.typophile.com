    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophilemachebayo_6110.jpg"></div><p></p>
    <p>We are proud to announce the release of two different new fonts. <strong>A 50% discount is being offered for a Limited Time</strong>.</p>
    <p><strong>Machete</strong> is the hulky, overfed distant cousin of Bayoneta. Enthusiastically in your face and full of humour, Machete is exactly the kind of big alphabet that takes a skinny actress camping at the top of a really tall building downtown. If you don't think this sort of date is interesting enough, try cramming these letters on your next tub of comfort food, road trip comedy, or assault rifle packaging and see. Machete don't text. Machete roars!</p>
    <p><a href="http://www.myfonts.com/fonts/sudtipos/machete-pro/" title="http://www.myfonts.com/fonts/sudtipos/machete-pro/">http://www.myfonts.com/fonts/sudtipos/machete-pro/</a></p>
    <p><strong>Bayoneta</strong> is not your usual handcut alphabet, though it can seem so. It can also seem like carefully constructed lettering inspired by Polynesian cultures. By bridging that gap between knife-wielding kitsch and studied display lettering, Bayoneta offers quite a various range of theme possibilities. Its clear and attractive shapes can provide the eye-catching spontaneity on a book cover, the expressive shout on a skateboard or a muscle shirt, the mouth-watering brand on a protein bar package, or the main notice on a theme park ride sign.</p>
    <p><a href="http://www.myfonts.com/fonts/sudtipos/bayoneta-pro/" title="http://www.myfonts.com/fonts/sudtipos/bayoneta-pro/">http://www.myfonts.com/fonts/sudtipos/bayoneta-pro/</a></p>
    <p>More info<br>
    <a href="http://www.sudtipos.com" title="www.sudtipos.com">www.sudtipos.com</a></p>
