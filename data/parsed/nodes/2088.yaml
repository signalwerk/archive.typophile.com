    html: "<p>A few observations on the new NWA logo: <br> <br>Regarding the mark, when I first looked at the photo above, I immediately noticed that the placement of the triangle just underneath the windows near the front of the plane makes it look like a heart. Completely different interpretation (\"heart of the northwest\" or some such nonsense) <br> <br>Also, it's interesting to note that the triangle is more or less an equilateral triangle, so it could be seen as pointing to the left, not down (although there would be better ways of doing this). <br> <br></p>"
