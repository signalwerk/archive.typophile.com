    date_raw: 17 Nov 2003 — 11:36am
    votes: null
    html: "<p>While I like this new livery, the new mark is really a shame. If they're really counting on people thinking this arrow points diagonally upward, they're asking people to remember their old logo. Silly. <br> <br>Re: saving money &amp; the livery <br>I'm not surprised that this livery design will save them money as the planes come in white, straight out of the factory. FedEx did the same thing when they moved away from their all purple trucks. <br> <br>When I worked on the JetBlue livery, I was interested to find out that a light colored top allows a plane to be more fuel efficient. (A plane with a dark top requires more energy to cool.) NWA's new livery will probably save them on operating costs over time.</p>"
