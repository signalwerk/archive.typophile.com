    votes: null
    html: "<p>thats a real shame. <br> <br>the new logo is clunky, chunky and just plain ugly imo. especially when you compare it side by side with the original, it just looks pathetic. <br> <br>the original logo perfectly resolved the balance of all the elements, whereas the new one just seems to be haphazardly arranged, not to mention the typeface choice is unbelievably bad. <br> <br>the only real negative i can find about the old logo is the use of a serif instead of using a sans to compliment the symbol, and the tracked out \"airlines\". <br> <br>quote: <br>\"The new NWA identity was positioned as primarily a cost reduction exercise (that's a first!)... intended to lower future repainting costs by 20% or so (simpler design thus less masking, fewer colors, greater durability). More importantly, it's also an assertion: \"We're global, not regional; what's more we're very cool, like our best customers... smart, sophisticated, technically advanced and elegant.\" Livery design was inspired both by the Audi TT, and by Northwest's clean, functional new Detroit home terminal.\" <br> <br>this is really just crap. the words \"smart, sophisticated, technically advanced and elegant.\" are so far removed from my mind when i see this logo that its not funny. also whats to stop them from retaining the original logo and just redesigning the livery using fewer colours? <br> <br>talk about taking a backward step.</p>"
    html_clean: "<p>thats a real shame. <br> <br>the new logo is clunky, chunky and just plain ugly imo. especially when you compare it side by side with the original, it just looks pathetic. <br> <br>the original logo perfectly resolved the balance of all the elements, whereas the new one just seems to be haphazardly arranged, not to mention the typeface choice is unbelievably bad. <br> <br>the only real negative i can find about the old logo is the use of a serif instead of using a sans to compliment the symbol, and the tracked out \"airlines\". <br> <br>quote: <br>\"The new NWA identity was positioned as primarily a cost reduction exercise (that's a first!)... intended to lower future repainting costs by 20% or so (simpler design thus less masking, fewer colors, greater durability). More importantly, it's also an assertion: \"We're global, not regional; what's more we're very cool, like our best customers... smart, sophisticated, technically advanced and elegant.\" Livery design was inspired both by the Audi TT, and by Northwest's clean, functional new Detroit home terminal.\" <br> <br>this is really just crap. the words \"smart, sophisticated, technically advanced and elegant.\" are so far removed from my mind when i see this logo that its not funny. also whats to stop them from retaining the original logo and just redesigning the livery using fewer colours? <br> <br>talk about taking a backward step.</p>"
