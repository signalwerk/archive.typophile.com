    date_raw: 15 Nov 2003 — 12:18pm
    votes: null
    html: <p>Speaking of an international audience and implied W's, the rebranding of <a href="http://www.nwa.com/" target="_blank"> Nortwest Airlines</a> comes to mind. Their <a href="http://www.identityworks.com/Reviews/2003cases/nwa.html" target="_blank"> old logo</a> had a subtle w, which was quite well done, implying a compass pointing to northwest as well as the letters N and W, but in order to sound less regional (Northwest) their mark is now just "nwa" worked into the frame of the old logo. The problem is they still had to stick "northwest" into the logo. Another rebranding that, in my opinion, seemed like a good idea on paper but failed to hit the mark, no pun intended. (I like the new paint job on the planes though)  <br> <br><a href="http://mike.essl.com/more.php?id=163_0_1_0_M" target="_blank"> Another interesting take on the Northwest rebranding.</a></p>
