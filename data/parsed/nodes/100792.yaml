      <p>Welcome.</p>
      <p>I do not recommend 'Just My Type.' I couldn't finish it. (<a class="freelinking external" href="http://www.salon.com/2011/09/20/just_my_type_imprint/" rel="nofollow">Relevant review</a>)</p>
      <p>I haven't read 'Anatomy of a Typeface.' (But I plan to at some point.)</p>
      <p>Of these three, 'Thinking With Type' would give you more details about the uses of typefaces. I think '<a class="freelinking external" href="http://www.amazon.com/Shaping-Text-Type-Typography-Reader/dp/9063692234/ref=sr_1_1?s=books&amp;ie=UTF8&amp;qid=1361638565&amp;sr=1-1&amp;keywords=Shaping+Text" rel="nofollow">Shaping Text</a>' is an even better introductory text.</p>
      <p>Good luck!</p>
