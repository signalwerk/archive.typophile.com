    <p>Hello everyone! I am a new one!<br>
    can someone  give me some advice ?<br>
    I am writing an academic paper about typography and mass media. This theme also includes all information about typefaces. I have aldeady read a book, by Robert Bringhurst, but I would like to go further on this issue. So I found three books, those ones:</p>
    <p> <a href="http://www.amazon.com/Just-My-Type-About-Fonts/dp/1592406521/ref=cm_cmu_pg__header" title="http://www.amazon.com/Just-My-Type-About-Fonts/dp/1592406521/ref=cm_cmu_pg__header" class="link-external">http://www.amazon.com/Just-My-Type-About-Fonts/dp/1592406521/ref=cm_cmu_...</a></p>
    <p><a href="http://www.amazon.com/Thinking-Type-2nd-revised-expanded/dp/1568989695/ref=pd_sim_b_2" title="http://www.amazon.com/Thinking-Type-2nd-revised-expanded/dp/1568989695/ref=pd_sim_b_2" class="link-external">http://www.amazon.com/Thinking-Type-2nd-revised-expanded/dp/1568989695/r...</a></p>
    <p><a href="http://www.amazon.com/Anatomy-Typeface-Alexander-S-Lawson/dp/B005MWKQQ4" title="http://www.amazon.com/Anatomy-Typeface-Alexander-S-Lawson/dp/B005MWKQQ4" class="link-external">http://www.amazon.com/Anatomy-Typeface-Alexander-S-Lawson/dp/B005MWKQQ4</a></p>
    <p>,but I haven't choosen yet which one is more appropriate to give me more details about the uses of typefaces.  Has anybody know those books?</p>
