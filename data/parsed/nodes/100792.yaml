      <p>Welcome.</p>
      <p>I do not recommend 'Just My Type.' I couldn't finish it. (<a href="http://www.salon.com/2011/09/20/just_my_type_imprint/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Relevant review</a>)</p>
      <p>I haven't read 'Anatomy of a Typeface.' (But I plan to at some point.)</p>
      <p>Of these three, 'Thinking With Type' would give you more details about the uses of typefaces. I think '<a href="http://Shaping Text" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Shaping Text</a>' is an even better introductory text.</p>
      <p>Good luck!</p>
