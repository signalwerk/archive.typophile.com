      <p>Perhaps you can check <a href="http://www.dynacw.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Dynacomware</a> and <a href="http://www.foundertype.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Founder Type</a> for traditional and simplified Chinese fonts.</p>
      <p>Oh, and there is also <a href="/node/add/wiki?edit%5Btitle%5D=www.arphic.com/" title="Create node &quot;www.arphic.com/&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Arphic</a>.</p>
      <p>There is only one usable Open Source simplified Chinese font out there: DroidSansFallback.ttf, which is in a sans-serif style (which should be no surprise given its name!). Arphic also contributed some, but at least I don't think they should be used to typeset simplified Chinese blindly, as I spotted a few glyphs in styles that's not accepted in mainland China.</p>
