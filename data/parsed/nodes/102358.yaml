    <p>Hey!<br>
    I am having trouble finding the right (meaning cheap) cjk font for a client and I was wondering if anyone already had the same problem (and solved it). ;-)<br>
    The fonts I am looking for will be used digitally on embedded devices, as webfont and for apps and software.<br>
    So the question is, are there any free cjk fonts for commercial use avaliable? Probably not, but just in case...<br>
    After researching the web, it seems that all the smaller foundies are getting the same cjk fonts from one of the big global foundries. Does it make sense to ask a whole bunge of foundries around the globe? Should I ask an asian foundry? Are there any price ranges? And if so, what's the best way to getting a cheap font?<br>
    I've already sent enquiries to the big foundries and was wondering if that's the right way to do it. ;-)<br>
    Thanks in advance!<br>
    Siggi</p>
