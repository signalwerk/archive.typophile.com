      <p>What language in are you looking for?  CJK fonts generally have to be tuned for one of Japanese, Korean, Traditional or Simplified Chinese, as each language expects slightly different forms of certain characters.  </p>
      <p>For various CJK fonts, check the 'East Asia' page at <a href="http://www.unifont.org/fontguide/">http://www.unifont.org/fontguide/</a></p>
      <p>For Japanese in particular, <a href="http://www.wazu.jp/gallery/Fonts_Japanese.html">http://www.wazu.jp/gallery/Fonts_Japanese.html</a> has a number of free &amp; open source fonts.</p>
      <p>Also Japanese, a set of nice sans-serif (ゴシック) fonts: <a href="http://mplus-fonts.sourceforge.jp/mplus-outline-fonts/index-en.html">http://mplus-fonts.sourceforge.jp/mplus-outline-fonts/index-en.html</a></p>
