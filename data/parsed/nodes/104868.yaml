    html: |-
      <div class="comment-spam-body"><p>Seems to be a brass or bronze plate of unknown date in the Medieval Revival style popular in the late 19th century. The inscription is in an English vernacular lettering pattern that mixes a Gothic [Textura] lowercase with Roman capitals.<br>
      There would not have been a font as such.<br>
      If you want a font with something of the flavor of the lettering you could try David Quay's <a href="//www.myfonts.com/fonts/linotype/blackmoor/" rel="nofollow">Blackmoor</a>, which mixes a gothic lowercase with Lombardic capitals.<br>
      For an overview of digitized Textura fonts see <a href="http://www.fontscape.com/explore?755" rel="nofollow">Textura</a>.<br>
      Some of the lower cases are closer to your image than others. None of the upper cases match.<br>
      A vast number of Textura fonts were made since Gutenberg. Only a small percentage are digitized.<br>
      Don</p>
      </div>
