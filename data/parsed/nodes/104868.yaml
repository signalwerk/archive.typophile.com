    html: |-
      <p>Handlettered – look at the repeating letterforms (l in Dunlop versus in Charles; counters of the e's). I'd say it's a strange vernacular script taking up forms of Textura (r, c, e, o) and Roman skeletons (W, D, C, G, s).<br>
      If you need to reproduce something alike, you might be looking for old Bastarda and Fraktur type, but also at Art Nouveau lettering (around 1910-30).</p>
