    html: "<p>Although I don't know that I recommend *any* OpenType feature for this purpose (for reasons mentioned above), the \"stylistic sets\" features I mentioned earlier are substitution features with names 'ss01' to 'ss20'. <br> <br>For full documentation on all registered OpenType layout feature tags, see: <br>&lt;<a href=\"http://partners.adobe.com/asn/tech/type/opentype/appendices/feattags.jsp\" target=\"_blank\">http://partners.adobe.com/asn/tech/type/opentype/appendices/feattags.jsp</a>&gt; <br> <br>Regards, <br> <br>T</p>"
