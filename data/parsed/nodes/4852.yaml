    html: <p>Roman numerals actually have their own codepoints in Unicode (goofy though that might seem). So, you can just use those codepoints. <br> <br>In addition, or instead, if you want a substitution feature to exchange default forms for ones that have connecting serifs, I'd suggest simply using stylistic sets. I can't see roman numerals being common enough to justify their own unique feature. <br> <br>Regards, <br> <br>T</p>
