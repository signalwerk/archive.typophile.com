    html: <p>I didn't say Roman numerals were goofy. I said it was goofy that they had their own slots in Unicode. <br> <br>Although, on further consideration, it is true that they have semantically different meaning than the same glyphs used as letters, so the argument that they should have separate Unicodes is not without merit. Still, I suspect that their existence in Unicode is due to compatibility with some other encoding. <br> <br>T</p>
