    html: <p>I was actually thinking of treating them as variants of European *letters*. But since they have their own legitimate Unicodes, and the semantic meaning of the letters is quite different, that would be against the philosophies of Unicode and OpenType. <br> <br>That being said, the practical implication is that you stick the characters in the font, but have no easy way to input them, unless you use a custom keyboard setup. Otherwise, you'll have to hunt and peck them from a utility palette (glyph palette / character palette / character map). <br> <br>T</p>
