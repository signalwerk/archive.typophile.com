    html: <p>Thomas,  <br> <br>I think Roman numerals should have their own Unicode values. The difference between European numerals and Roman numerals are somewhat like between uppercase and lowercase -- they share some characteristics, but are also different in some regard. For example, in scientific or legal texts, Roman numerals may designate a different level of structure than the European numerals, so keeping them separate makes sense.  <br> <br>Encoding Roman numerals as a mere styllistic variants of European digits isn't obvious at all -- you would need to do very elaborate contextual substitutions.  <br> <br>First, because depending on the position within the number, the European numeral converts to a different Roman numeral, and secondly, obviously, because for certain numbers, the Roman numeral must be repeated. So for example, 4444 translates to MMMMCDXLIV. Making an OpenType layout feature that does the conversion is possible but not trivial. Also, in some older sources, alternate renditions of various Roman numbers were used, e.g. XXC = LXXX, IC = XCIX, IIXX = XVIII. Therefore, I think it's better when Roman numerals have their own Unicodes.  <br> <br>Best,  <br>Adam</p>
