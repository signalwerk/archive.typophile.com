  html: |-
    <p>I was playing MGS4 this weekend and my typophile senses were tingling. </p>
    <p>During the in-game conversations between the main character and a remote character the text of the conversation would be shown on screen. </p>
    <p>It looked great on my TV and I wanted to know what it was. The most unique thing was the slanted stroke under the eye of the “e”.</p>
    <p>Also, it looks like a rounded sans in the screen grab, but I’m not entirely sure it is.</p>
    <p></p><div class="imageWrap"><img src="/web/20081013111037im_/http://www.typophile.com/files/CloseupMSG4txt_6074.gif"></div><p></p>
