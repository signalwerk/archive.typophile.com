    html: <p>It's an interesting question. For me the thing that stands out about the font is the way you handle curves - the C obviously but also the 3 &amp; so on. They have a nice tension &amp; invention about them. To make a the redesign worthwhile I would try to find a way to make the other glyphs with straight lines inherit some subtle shift and maybe tension as well. To me the glyphs don't quite all relate as a group yet - in either set. I think they need to. You could loose the weirdness even more but I think that would be a shame. The shift I mean doesn't have to be huge. Just there - &amp; helping the letters to belong to each other. If you are not sure how to do that yet; I would wait until you are &amp; then finnish a version 2.0 You are clearly developing the sensitivity you need to do it. I think you can.</p>
    html_clean: <p>It's an interesting question. For me the thing that stands out about the font is the way you handle curves - the C obviously but also the 3 &amp; so on. They have a nice tension &amp; invention about them. To make a the redesign worthwhile I would try to find a way to make the other glyphs with straight lines inherit some subtle shift and maybe tension as well. To me the glyphs don't quite all relate as a group yet - in either set. I think they need to. You could loose the weirdness even more but I think that would be a shame. The shift I mean doesn't have to be huge. Just there - &amp; helping the letters to belong to each other. If you are not sure how to do that yet; I would wait until you are &amp; then finnish a version 2.0 You are clearly developing the sensitivity you need to do it. I think you can.</p>
