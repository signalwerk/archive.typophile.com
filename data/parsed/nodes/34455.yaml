    <p>I am working on a redesign of one of my first fonts (Tirana released by T26). I feel that this fonts has flaws as it was my first. Since I feel strongly enough about it, I’d like to make something better of it, so I am redrawing it and expanding it’s weights. I think it is improving lot to the point of starting to become a different font, although the basic characteristics like the curves and proportions, which were my main motivation for going back to this font, are kept. I think this is a common feeling among type designers, if you were in the same situation, what would you think would be best the best way to release it? Releasing it with the same name and adding it something like “pro” or “new”? Releasing it with a different name and assume it is a new font? Not going back to it at all?</p>
    <p>You can see attached a sample of the new upper cases.</p>
    <p>Thank you in advanced.<br>
    </p><div class="imageWrap"><img src="https://web.archive.org/web/20141113062543im_/http://typophile.com/files/tirana0_5553.jpg"></div><p></p>
