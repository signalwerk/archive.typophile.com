      <p>I do like the newer version of this face very much. Although it appears more 'corporate', I think it retains a very subtle impression that retains the character you were acheiving in the first version.</p>
      <p>My notes would be to keep what you have here, but perhaps reconsider the following glyphs:</p>
      <p>G, R, 1, 2, 4</p>
      <p>G: I think if you include the spur from the original (but not the arm), it'd add what's possible missing to the G.</p>
      <p>R: I feel this character falls out of balance with P. Perhaps consider using P as the basic form the new R? It appears to slightly fall out of balance with the rest of the face.</p>
      <p>1: I prefer the angle of the original - as it now matched the 6's new angle.</p>
      <p>2: I like the suggestion above - perhaps de-emphasis the bottom.</p>
      <p>4: As noted above, perhaps emphasise this character as it would 'match in' better with the rest of the numeral set.</p>
      <p>And sorry all the mistypes - but I've been up for around two days straight again on my own project. I won't even bother trying to spell-check at this stage.</p>
      <p>I like this new version of your typeface though! Very nice. Very subtle. Subtle is a beautiful thing.</p>
