    <p>Hi all.<br>
    Unfortunately I only have one low-resolution sample of the font I'm trying to identify, and that sample contains a slightly modified letter. Thus I have a feeling that this will be a challenge. Here it is:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Logo-main_5065.png"></div><p></p>
    <p>The letter 's' is modified a bit, I don't have the original. The word written is 'Veiskille', in case it was unclear.</p>
    <p>As far as I know it was found on the web some time around 2000. Not much help there, I guess.</p>
    <p>Any help would be appreciated.</p>
    <p>All the best,<br>
    Kristian</p>
