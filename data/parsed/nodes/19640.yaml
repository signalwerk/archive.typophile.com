    html: <p>Yea great comments. To add on...from an aestheitc aspect...The C and G is too funky. Doesnt fit in well. The S isnt balanced properly. I would open the top aperture up more and push it to the left. The crossbar on the E anf F can be a little longer. Also the crosspointon the X can be lower (reminds me of Steve Urkel pants). The tail on the Q seems out of place because the design is so classical. And it looks like its barely hanging on. But your consistency is nice. I like where its headed.</p>
