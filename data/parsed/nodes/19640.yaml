      <p>Well, if no one else is going to come around, I'll bounce some things back to ye. I'll say I like this quite a bunch. It has character, for sure. My humble opinion:<br>
      Maybe lower A bar<br>
      Maybe take middle of B higher<br>
      Maybe extend bar on EF a little<br>
      Bar of G doesn't go<br>
      J terminal needs something<br>
      Maybe take point of M down a bit<br>
      Q could do with more equilibrium, maybe center that tail under the O form (...I might like it if I could see it next to a U)<br>
      S too small on top<br>
      V and W bottom serifs ought to be bracketed<br>
      Y too thin at confluence<br>
      I could see this, like, engraved onto a wooden sign outside of a quaint family restaurant or motel, or maybe on the cover of a book I'd like to read.... Don't normalize it too much--keep some of the seemingly odd proportions--because that's where the charm comes from.<br>
      Cheers<br>
      Nathanael</p>
