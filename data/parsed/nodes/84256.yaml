    <p>Hi All, </p>
    <p>I'm going to VERY brave here and open up a small part of a website that I'm currently designing. I'd love to know people's thoughts on the typography - this isn't my strongest area and is something I'm really keen to improve on. I've included a few notes on my thought process when laying this out. Please tell me if you think I might be doing something wrong! Also let me know if any of this doesn’t make sense.</p>
    <p>A few notes - This is for a website and uses fonts on the google web fonts service displaying on a vista machine - therefore some things might not look as crisp as they would in a perfect world.</p>
    <p>(You may need to scroll to the right to see these full and I've also uploaded them as files and there are a few more notes below them)</p>
    <p>NORMAL VIEW:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/norm_4746.jpg"></div><p></p>
    <p>WITH GRID<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/withgrid_3494.jpg"></div><p></p>
    <p>I wanted the heading to have twice as much space where possible above as they do below so that are in close proximity to their paragraphs.</p>
    <p>I've set the base font to a simple arial at 13/18. I've tried to stick to the classical typographical scale but 12 was too small and 14 too large in my opinion. </p>
    <p>The "leading text" (first bit in italic) is open sans condensed italic at 24/36. I've added a 4px margin at the top which puts it on the baseline. I've made this up to 18px by adding a 14px margin at the bottom.</p>
    <p>The headings are all open sans condensed.</p>
    <p>Secondary headline is 36/36 with 9px margin top and 9px margin below</p>
    <p>Third headline is 24/36. 36 seems a bit too much but the likely hood of these going over 2 lines is very low. I also thought about shifting this a few pixels so that it falls on the either the baseline or the "half baseline" but decided against it.</p>
    <p>The quote on the right does a similar thing to "leading text" in that it shifts as its so close the baseline.</p>
