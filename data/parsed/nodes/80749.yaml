    <p>I'm having glyphs disappear when I output my fonts. It seems to happen spontaneously, and appears to be related to adjustments to an outline, and the ones that disappear are not the glyph I've just modified. </p>
    <p>For instance, I adjusted the spur of the small cap g, and this is what happened (before and after):</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/stp-missing001_4481.png"></div><p></p>
    <p>Has anyone seen this before?</p>
    <p>Thanks.</p>
    <p>Mcs</p>
