    html: |-
      <p>I've had something like that happen with Fontforge, but likely for a different reason.<br>
      To keep my glyph set manageable when editing, I switch encodings often, and set it for Unicode before generating a font. Sometimes I forget myself and leave the Encoding&gt;Compact item checked, and that screws the thing up like you show.</p>
      <p>Again, not likely your problem, but I thought it worth mentioning.</p>
