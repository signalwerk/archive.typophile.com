    html: |-
      <p>Although in some ways it's becoming more mainstream, it's also starting to click - good job. There's a nice Fleischmann flavor, but it's not at all a revival.</p>
      <p>The main thing to me is that you have a tricky decision to make: how far out on a limb do you want to go? Look at that /j. Fabulous. Dangerous. I think it's exactly the sort of thing a real text face needs; neutering it would constitute giving in to display setting, to superficial type design. If you're worried whether you've gone too far with it, remember how things that seem garish at large sizes blend in to the overall texture at text sizes - just look at Schwartz's Houston Chronicle* face, to me a pinnacle of functionalist bravado. But that <em>does</em> mean things like that /j have to make sense in that overall texture, and some other glyphs are not pulling their weight in that respect, so the whole is unlikely to be cohesive. The /y for example completely clashes with the /j; I would either give it a ball (quite possibly with a the Fleischmann "flipped" structure) or a big rightward serif** (or maybe double serifs, like in Bembo's italic). Similarly /k/x could benefit from having much more character, and /f could take the attitude of /j and -thanks to its bar- push it even further. And /g is also too conservative, too polished.</p>
      <p>* <a href="http://www.christianschwartz.com/houston.shtml" title="http://www.christianschwartz.com/houston.shtml">http://www.christianschwartz.com/houston.shtml</a></p>
      <p>** What famous font is it that has that?</p>
      <p>Another thing I noticed is that some key glyphs are unusually wide - the /a/e/t. That does amplify the design's overall butch character, but know that it also reduces readability (at least I strongly believe so).</p>
      <p>The /f/r should have longer rightward footserifs.</p>
      <p>BTW, it's always good to figure out what point size a given font likes most. For this I myself am seeing 11 pt. Just know that -at that size- the color is going to be somewhat darkish (something I personally value).</p>
      <p>hhp</p>
