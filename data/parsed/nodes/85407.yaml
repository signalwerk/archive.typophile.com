      <p>JamesT: That was just me trying to put words to my amateur's impression. I find it hard to put a finger on what gave me an impression of "old-fashioned"; the ball terminals perhaps?  The slightly droopy-eyed |a|? The strong weight and shape contrast in the serifs/terminals between the |r| and |v| in "Garvis"? By "not classical" I meant to disambiguate from fonts that feel old but timeless (such as Garamond, to my eye).</p>
      <p>Actually, looking at your PDF sample and at larger blocks of text, I'm starting to like the feel of it. Some letters are also quite elegant up close; such as |b q n s t|. I like club-shaped tails on |y|, but perhaps yours could use some more weight? The |k| is somewhat club-footed. </p>
      <p>And yeah, I guess in the end, I just don't like ball terminals much...</p>
    html_clean: |-
      <p>JamesT: That was just me trying to put words to my amateur's impression. I find it hard to put a finger on what gave me an impression of "old-fashioned"; the ball terminals perhaps?  The slightly droopy-eyed |a|? The strong weight and shape contrast in the serifs/terminals between the |r| and |v| in "Garvis"? By "not classical" I meant to disambiguate from fonts that feel old but timeless (such as Garamond, to my eye).</p>
      <p>Actually, looking at your PDF sample and at larger blocks of text, I'm starting to like the feel of it. Some letters are also quite elegant up close; such as |b q n s t|. I like club-shaped tails on |y|, but perhaps yours could use some more weight? The |k| is somewhat club-footed. </p>
      <p>And yeah, I guess in the end, I just don't like ball terminals much...</p>
