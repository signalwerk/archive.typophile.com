    html: |-
      <p>Good :-)</p>
      <p>/b q s/ still need some work IMO. Put /q/ next to /u/ and you will find that /u/ suddenly looks too tall. This is because the q, for some vague and illusive reason, needs to align to the x-height stronger. Either you make the curve very flat at the top, or you add a little triangle, like Lexicon.</p>
      <p>You might want to try increasing the contrast in the bold, as to make the thins the same thickness as the thins in the regular. The bold probably looks too light to you, because you put the semi-bold in between the regular and the bold. Bold has the same problems as the regular (b, q, and s), along with one extra: The whitespace in /m/ is not equally devided.</p>
      <p>I get a very cosy Ms. Eaves feeling from this, which is good! Keep going!</p>
    html_clean: |-
      <p>Good :-)</p>
      <p>/b q s/ still need some work IMO. Put /q/ next to /u/ and you will find that /u/ suddenly looks too tall. This is because the q, for some vague and illusive reason, needs to align to the x-height stronger. Either you make the curve very flat at the top, or you add a little triangle, like Lexicon.</p>
      <p>You might want to try increasing the contrast in the bold, as to make the thins the same thickness as the thins in the regular. The bold probably looks too light to you, because you put the semi-bold in between the regular and the bold. Bold has the same problems as the regular (b, q, and s), along with one extra: The whitespace in /m/ is not equally devided.</p>
      <p>I get a very cosy Ms. Eaves feeling from this, which is good! Keep going!</p>
