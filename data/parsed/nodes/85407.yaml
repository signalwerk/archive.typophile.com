      <p>Jasper,</p>
      <p>Thank you! I'm glad you like the progress. I think I agree with all of your comments, except I might keep playing with the lower terminal on the /c/e as I like the idea in theory. I've yet to really draw an /r or a /g I've really been completely happy with, although I think I'm getting closer.</p>
      <p>Hrant,</p>
      <p>I'm glad you understand what I'm attempting to do (Fleischmann-inspired but not strictly adhering to his work), I suppose that means I got something right!</p>
      <p>I ended up toning down the /j a little. I have another project I started a while ago (and then forgot about until now) – I think you would like it – it's essentially my attempt at trying to push characters like that /j further than it is here while still making it work at small sizes. </p><div class="imageWrap"><img src="http://typophile.com/files/screencap-5-4-12_4750.PNG"></div><p></p>
      <p>You're right about the /y. At the moment, I'm playing with the standard ball terminal (since this is for extended language support, I need to leave the right open to fit some diacritics). Also, the /a/e/t where too wide.</p>
      <p>My intention was something that works around 10-11 point.</p>
