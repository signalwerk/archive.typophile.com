  - id: 480227
    user: 30114
    date: 2011-10-10T13:42:00
    date_raw: 10 October 2011 - 1:42pm
    votes: 0
    html: |-
      <p>Wow! Making progress here! Beautiful! </p>
      <p>On the regular:</p>
      <p>The node at the very bottom in /e/ and /c/ needs to be moved to the left (moving the control points with it), to make the curves fuller.</p>
      <p>Try making the bottom bowl (tail) of g a little more narrow.</p>
      <p>Somethings wrong with the curves in /e/. Compare them with the c.</p>
      <p>The top curve in /a/ needs more strength. Move the horizontal control points to the left and allign them with each other.</p>
      <p>The sharp style of the curves in /m n h u, etc/ is different from the softer, more round style in /d p q b, etc/</p>
      <p>The thin strokes in /k v w x y/ should have the same thickness as the thinnest part in /o/.</p>
      <p>/b/ and /q/ are begging you to add some sort of continuation of the stem towards the baseline/x-height. Most likely a triangular shap. Have a look at Garamond.</p>
      <p>width of /j/ might cause trouble in some lettercombinations.</p>
      <p>/k/ and /r/ are too wide</p>
      <p>s needs reworking from scratch. It looks weak.</p>
      <p>Make the bar in t a little shorter (and possibly also the tail)</p>
      <p>Caps:</p>
      <p>Thickness of thin strokes is inconsistent.</p>
      <p>Bar in F should be lower.</p>
      <p>C more like G. Wider and more open.</p>
      <p>Let the tail of J descend a little further</p>
      <p>Leg of R needs some curves.</p>
      <p>S, same as s.</p>
      <p>Keep going!</p>
    html_clean: |-
