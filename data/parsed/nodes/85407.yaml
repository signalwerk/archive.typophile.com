      <p>From your perspective I guess it would be in the way<br>
      you see Greek: the experience. But maybe even more so.</p>
      <p>In a way designing an Armenian font brings you back to<br>
      the basics: the number of characters is not many since<br>
      not much beyond the alphabetics is required, but we have<br>
      around 10 letters of the complexity of the binocular lc "g".<br>
      And since a person is unlikely to be able to read Armenian<br>
      text, it becomes a powerful and rewarding abstract exercise.<br>
      There are "rules", but a lack of nativity means one has to<br>
      learn to figure them out, and the lessons then apply nicely<br>
      to other non-Latin attempts. Armenian basically becomes<br>
      a superb introduction to non-native design, after which a<br>
      person might move on to things like Arabic and Devanagari.</p>
      <p>hhp</p>
