      <p>Very nice design! It reminds me a bit of Geronimo by Mário Feliciano. I think the weight in the bowl of 'a' could be a bit more horizontal though. M/N/S are too heavy in the italic and the italic 'W' seems a bit too wide.</p>
      <p>Why are the arrow symbols without contrast? The scissors look deformed as the grip seems to be too thin.</p>
      <p><cite>Right now, I'm leaning towards Bantam or Essex. Both appear not to be taken.</cite><br>
      I don't like having 'sex' in the word. Actually it doesn't make me think of sex but of Sussex. Both are associations I would avoid though.</p>
      <p>Garvis somehow makes me think of a web font, which makes it sound cheap. Really, this might be a very personal association and has nothing — necessarily, anyway — to do with the quality of web fonts, but I still think it should be avoided (if others make the same association that is).</p>
      <p>Bantam is also not fitting. It's a good name I think but it fits a more horizontal serif better. It would also be better to take a name without double letters though I certainly don't always come up with names conform to this "rule".</p>
      <p>A "few" names right off the bat (I haven't checked whether any of these exist already): Diluran, Atina, Nelan, Manora, Harmen, Werder, Coldre, Sermior, Beldor, Nuave, Myre, Verton, Ciller, Rezden, Pranu, Lisar, Solur, Betarn, Mastun, Abeling, Groze, Veltura, Denerim, Salmert, Perusal, Banewick, Greven, Jaborandi, Eupal, Unstemar, Mardine, Hamewick, Piasoli, Molgen, Trigon, Gritude, Cheloir, Ratite, Nelwing, Dorman, Revenam, Eggerbit, Mitser, Santil...<br>
      It's not too hard coming up with names which sound good I think (unless you insist on using existing words). Just look at your typeface and try to make sounds which fit the style and atmosphere. Another good method I think is think of keywords which fit your typeface and come up with words which loosely relate to that keyword in terms of sounds or use of letters. For example, I derived 'Eupal' from 'euphoria', 'Gritude' from 'gratitude' and 'Santil' from 'sand hill'. Not that these (key)words fit your typeface but the derived names just might. Some of the names I mentioned are just rather obscure words (at least to me as English is not my primary language).</p>
    html_clean: |-
