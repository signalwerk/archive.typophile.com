      <p>Here's one of the visuals from that talk of mine:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/08_polytypie_3859.gif"></div><br>
      So the French called it "poly[ma]typie". And I remember now that "logography" was another term for the method of using multi-letter sorts. No matter what you call it it's pretty impressive (if actually to me not surprising) that a typesetter could handle this many types of sorts, at speed.<p></p>
      <p>BTW, to add to the confusion: logograph/logogram and ideograph/ideograph are often used to speak about Chinese...</p>
      <p>&gt; I doubt it will lead to the dreaded wide word spacing.</p>
      <p>But what about a sneaky font choice, like Mrs Eaves?  :-)</p>
      <p>hhp</p>
