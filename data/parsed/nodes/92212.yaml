      <p>Hrant,</p>
      <p><cite>The point was to save not only time but money, since typesetters would charge by the sort. :-) But then the typesetters switched to charging by the letter...</cite></p>
      <p>And now, most of us charge by the page (again). Different reasons, &amp; I doubt it will lead to the dreaded wide word spacing.</p>
      <p>* * *</p>
      <p>A lot of people don't seem to know the uses of the word "logotype." I used that word to refer to the two-character pairs available in some Linotype fonts (Va, Ve, Vo, Vu, Ta, Te, To, Tu, Fa, etc.) &amp; got a ??? from an "expert reader."</p>
