      <p>I've seen "catchword" for this too, but the problem with using "<a class="freelinking external" href="http://en.wikipedia.org/wiki/Catchword" rel="nofollow">catchword</a> " is that it is also (probably more prominently) used to describe when the first word of the following page is also placed at the bottom of the current one. </p>
      <p>Of course, "logotype" also has the meaning of "wordmark," so it's not "clean" either...</p>
