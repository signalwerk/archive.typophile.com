    html: |-
      <p>The way somebody like Downer would use it, it would be "catchword"* (from signpainting). But in terms of typography "logotype" is indeed the common term (and as Nick says it could be as short as two letters).</p>
      <p>* Related: <a href="http://fontsinuse.com/the-chop-shop/" title="http://fontsinuse.com/the-chop-shop/">http://fontsinuse.com/the-chop-shop/</a></p>
      <p>There was even once a patent involving an expanded typecase (I mean for hand-setting) where in addition to individual letters there were a large number of frequently-occurring letter sequences. The point was to save not only time but money, since typesetters would charge by the sort. :-)  But then the typesetters switched to charging by the letter...</p>
      <p>I featured much of this in one of my Thessaloniki talks - I'll try to dig up some visuals.</p>
      <p>hhp</p>
