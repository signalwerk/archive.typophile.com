    html: |-
      <p>Word logos/word logotypes.</p>
      <p>“Word” is somewhat redundant, as <em>λογος</em> means word. However, Linotype manufactured what it termed “logotypes” for its system in the early 20th century, and these were “pre-kerned” two-letter glyph combinations of Ta, Wo, etc. Therefore, to distinguish from these, it is probably best to add the word “word”, as John Downer does in describing the logotypes he made for Brothers.</p>
      <p>Whether this terminology is widespread, or reﬂected in keywords, is another matter.</p>
