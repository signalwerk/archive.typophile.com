  html: |-
    <p>What is the name for a glyph which contains a full word?<br>
    I am looking for typefaces which contain glyphs that are complete words - like "THE" or "AND".<br>
    It's hard to search for these because I don't know the term. And searching for "and glyph" really ain't working.</p>
