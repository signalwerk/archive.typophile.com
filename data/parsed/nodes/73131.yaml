    <p>My outfit TypographyShop recently released two new shirts chosen by our buyers from a number of themes related to letterspacing.   </p>
    <p><a class="freelinking external" href="http://bit.ly/9cLWlC" rel="nofollow">Well Kerned</a> is a simple statement set in Neuzit S Book Heavy and printed in white on an American Apparel black Fine Cotton Jersey T-Shirt. <a class="freelinking external" href="http://bit.ly/9LVOEO" rel="nofollow">Letterspaced</a>, a phrase that could be interpreted a number of ways is set in Trade Gothic Bold Condensed 20 and printed in white on a black American Apparel tee. </p>
    <p>Both are on pre-release sale untill August 15th.  Just 17.99 for men, 18.99 for women.</p>
