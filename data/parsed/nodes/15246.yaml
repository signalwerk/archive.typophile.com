  html: |-
    <p>Are there any typefaces that you would consider extremely succesful at communicating a certain mood through their mere design but at the same time are not too literal (i.e. no tear drop shapes for sadness)? In particular the feelings on the bleaker end of the spectrum; sadness, melancholia, depression. </p>
    <p>I am attempting to design such a font and the task is proving more difficult than I initially assumed, and figured I could use some inspiration.</p>
    <p>Thank you.</p>
