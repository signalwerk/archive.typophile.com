    html: |-
      <p>I agree with Mark. I think the most you might be able to pull off is a vague and faint sense of "sadness", and only among some people - plus you'll certainly get other associations too (like elegance) in fact maybe more strongly.* The general traits I would look for are: narrow, small x-height, light, high waist, somewhat weathered finish, and old-fashioned terminals (like balls, but small ones). Maybe something that has an old French colonial air about it - a bit like this:</p>
      <p><a href="http://www.typophile.com/forums/messages/30/20897.html" title="http://www.typophile.com/forums/messages/30/20897.html">http://www.typophile.com/forums/messages/30/20897.html</a> _<br>
      But taller caps, and daintier serifs.</p>
      <p>* It seems like maybe traits that have strong tangible representations have a better hope than emotions (which are rarely associated with any physical form).</p>
      <p>hhp</p>
