      <p>Thanks for the help all; I actually got to looking around in the retro section at DaFont and found a lot of fonts I had overlooked. Guess I consider Retro to be 50's and 60's-ish fonts and din't think to check there for what I was looking for.</p>
      <p>The project I'm working on is actually a t-shirt design for my church's Vacation Bible School this summer. The theme for this year is "Under God's Big Top," so I'm trying to mimic the look of an old circus poster for the t-shirt design. It's still a work in progress, but here's what I've come up with so far; feel free to offer any advice or suggestions:</p>
