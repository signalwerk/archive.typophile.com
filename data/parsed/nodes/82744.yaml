      <p>So do you guys think the FF Din Round example is a bit extreme? Considering we're moving towards higher and higher resolution devices it looks like hinting will eventually become unnecessary and with that said extremes on rounded forms will be unnecessary as well.</p>
      <p>I've been facing this dilemma as I have an upcoming face that will have a rounded version and I've found that depending on the weight and size of the contour it can be really difficult to attach an extreme point without compromising the form even if the compromise is very subtle. At the same time, I PS Hint all our faces and know that I'll be at a loss with attaching a hint to a rounded end that doesn't have an extreme point.</p>
      <p>I also have some older faces that I intend to rework, adding extremes and properly hinting them although, again with say a Thin weight, even at 2000 UPM things get really tight when trying to attach points on such small rounded contours.</p>
      <p>Any advice on this?</p>
