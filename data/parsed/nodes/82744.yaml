    html: <p>Points at extremes are important for both .otf and .ttf because of the hinting. Basically, if you want to have your baseline and x-height align at small sizes, i.e. you want the overshoots for your round and spiky letters not to look awkward, then you need some points there (and hints) so the rasterizer knows WHICH points to align. Because of subpixel rendering, points at extremes are still important in the y-direction (i.e. on top and bottom of forms) while in the x-direction they are not. For example, for italic letterforms, I would say that they are no longer really mandatory on the left and right edges. But it's still "safer" to put them there until we can reliably find out that not having them doesn't cause some awkward issues in applications that rely on bounding boxes when doing line layout (for example, I suppose Adobe InDesign's "optical margin alignment" does take bounding boxes into account).</p>
