    <p>Hi all,</p>
    <p>Here’s a question that’s been on my mind for more than a decade and i’ve finally decided to seek some wisdom from the crowd.</p>
    <p>It is generally recommended that you place points at the extreme tops, bottoms, lefts and rights of your glyphs. My question is: exactly how important is this? I mean, what happens if you ignore this rule.</p>
    <p>I do a lot of rounded type and especially rounded glyphs can get you in a bit of a headache here, because the extreme points of rounded glyphs are not necessaryly important points for the definition of the shape - in contrast to non-rounded glyphs where extreme points are almost always also defining points for the glyph shape.</p>
    <p>So far i’ve always followed the extreme point rule eventough it meant polluting my outlines a bit, but in the fonts i’m working on right now i’d like to keep my outlines clean. And so far i havn’t had any problems with printing or displaying these fonts...</p>
    <p>Can anyone shed some light?<br>
    Thanks, Alex.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/kk_4808.png"></div><p></p>
