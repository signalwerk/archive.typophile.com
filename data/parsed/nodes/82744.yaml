      <p>The most important thing in point selection is the clean and accurate capture of your idea. Nothing should overrule that. </p>
      <p>"Hinting", though not nothing, is only truly effective in TT, where a format conversion is going to leave points close enough to extrema, and your example, as shown on the left is entirely hint-able. T1 hinting depends on Zones which your example can fall nicely into as well, as shown on the left.</p>
      <p>If you want to prove to Yourself! that the left version is best for font scaling, regardless of hinting, follow these simple steps, and look at the illustration below. </p>
      <p>In a copy of your font with both digitizing options represented, change the Em to around 50/1000th of it's existing units per, and scale all the glyphs too. </p>
      <p>Then, scale the Em back to it's original size, 1000/1000ths, all the glyphs too, and observe: </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ClubOne_5561.png"></div><p></p>
      <p>The top left contour is the clean and accurate capture of the idea at 1000, unscaled. The top right is the capture of the idea at 1000 according to the prevailing suggestion, also unscaled.</p>
      <p>The bottom is both options scaled to 50 units per em and back.</p>
      <p>As big as the deformation to both shapes appears, the deformation of the bottom right seems a bit more serious, and directly related to the presence of the extrema.</p>
