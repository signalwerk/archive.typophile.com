      <p>David: <em>"Hinting", though not nothing, is only truly effective in TT, where a format conversion is going to leave points close enough to extrema, and your example, as shown on the left is entirely hint-able.</em></p>
      <p>I think that bit about PS-to-TT outline conversion leaving [off-curve] ‘points close enough to extrema’ needs to be highlighted and properly understood, because if the points are not close enough to extrema then you end up with a segment of curve that is beyond control of the hints and may round in unfortunate ways.</p>
      <p>Not having nodes at external extrema also means that the glyph bounding box will be inaccurately recorded. Tom Rickner told me off for doing that some years ago, and I've been faithfully noding my extrema ever since.</p>
