      <p>Alex – thank you very much for touching this subject. David – thank you for your clear example.</p>
      <p>I have been discussing this topic over and over, and I agree with Alex that his original drawing (left) is just more natural, specially when it comes to rounded fonts.</p>
      <p>I mean, we all agree that drawing glyphs with proper extreme points facilitates things enormously, and is a useful thing to do.<br>
      However, when placing extremes presents more difficulties than advantages, I’d really rather focus on the shape instead of trying to fit extreme points, distorting my outlines.  </p>
      <p>It feels to me that ‘points at extremes’ has taken the place of a dogma for many, and although 20 years ago printers might have crashed trying to process badly-drawn fonts, it is time to re-think this assumption in many cases. </p>
      <p>BTW: even the original <a href="http://partners.adobe.com/public/developer/en/font/T1_SPEC.PDF " target="_blank" rel="nofollow">Adobe Type 1 Specification</a> is not as strict when it comes to extremes (page 30):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/extremes_6340.png"></div><p></p>
