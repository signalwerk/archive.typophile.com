      <p>Alex, </p>
      <p>if you define an alignment zone or ghost hint for the purposes of equalizing the baseline and the x-height in very small screen sizes (through hinting), and in some glyphs there will be no point there, or the point will not be at the extremum, then the hinting may work not as you'd expect. In your design, hinting will work better if you draw your glyph as you've shown it on the right (with points at extremes). </p>
      <p>Points at extremes are primarily relevant for hinting purpose. Other than that, you don't need to worry about them. Especially in italic typefaces, points at extremes in the x-direction (i.e. on the left and on the right) are not really important if you don't use x-direction hinting.</p>
