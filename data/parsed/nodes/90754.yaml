      <p>Amateur tinkering is inappropriate for a Luxury Product.<br>
      There are plenty of condensed didone faces available for licence.<br>
      It’s 2012, not 1992.<br>
      If you want to study correct scaling of this genre, check out the Yo! fonts:<br>
      <a href="http://www.terminaldesign.com/fonts/" title="http://www.terminaldesign.com/fonts/">http://www.terminaldesign.com/fonts/</a></p>
