    html: <p>The relationship between the crossbar of the A and its thin vertical would be one place to refine. That probably will have ramifications on the V. Probably take a look at the center of the S and the width and length of horizontal and vertical serifs. This is one very rare case where stretching hasn't caused major problems, so you are lucky!</p>
