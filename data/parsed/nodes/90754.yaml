  html: |-
    <p>Hi Typophile,</p>
    <p>Throughout my studies it was drilled into me to never distort/stretch a typeface. For a current project I'm creating a Luxury Magazine masthead. I'd love some feedback on what I could possibly do to create a slightly condensed version of FF Holmen.</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/holmen-typophile_4076.jpg"></div><p></p>
    <p>In the above image I've just vertically stretched the typeface to create the condensed feel I'm after. Is there any corrections I should make to the anchor points? or is this something I could get away with?</p>
    <p>Any feedback would be greatly appreciated.</p>
