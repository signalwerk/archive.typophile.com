      <p>I think I found the answer while hunting for something else. I think this is <a class="freelinking-external" href="http://www.fontshop.com/fonts/downloads/psyops/aquamarine_basics_subset/">Aquamarine</a> from Psy/Ops, designed by Rodrigo X Cavazos and Gábor Kóthay. It has all the characteristics and swashes we were looking for.</p>
      <p>- Mike Yanega</p>
