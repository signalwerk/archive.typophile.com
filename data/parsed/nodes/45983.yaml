      <p>If you have the brochure, did you try using the <a class="freelinking-external" href="http://www.bowfinprintworks.com/SerifGuide/intro.php">Serif Font ID Guide</a> with samples of the letters? There were not enough upper case letters in the other samples posted so far to get a good set for the Guide. You would also have a clearer look at the lower case letters, and maybe I picked the wrong shapes for my searches.</p>
      <p>The Museum query may or may not ever get an answer. The last one took three days.</p>
      <p>- Mike Yanega</p>
