    html: |-
      <p>This is a new one to me. The ’s’ is very odd, with two kinds of serifs. Swash Romans are pretty rare too, and none that I know of match this. </p>
      <p>The closest I can think of is Thierry Puyfoulhoux’s large and varied <a class="freelinking-external" href="http://www.myfonts.com/fonts/presencetypo/classica/">Classica</a> family which includes a Gallic version with the Venetian style e, and the Prestige subfamily that has all kinds of swashes and ligatures.  There is a swash W like the one shown, only it is reversed.</p>
      <p>This might be another time when writing to the Museum might get an answer.</p>
      <p>- Mike Yanega</p>
