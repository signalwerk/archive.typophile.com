    <p>This beautiful typeface was used in the signage &amp; accompanying brochure for the exhibition <a class="freelinking-external" href="http://www.artic.edu/aic/exhibitions/exhibition/figuration">“Figuration in Contemporary Design”</a> at the Art Institute of Chicago. Photography was sternly discouraged, but an understanding security guard allowed me a couple furtive shots of the typography. Any help identifying this lovely font? Thanks very much!</p>
