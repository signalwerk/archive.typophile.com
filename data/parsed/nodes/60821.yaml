      <p>Going for the grand prize...</p>
      <p>I’m pretty sure this is a heavily modified/regularized Emily from T26 by Sylvia Janssen and Daniel Janssen.<br>
      The x-height has been reduced and many letters have been redrawn.<br>
      But it’s still Emily.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Emily_5136.gif"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Emily_4927.png"></div><p></p>
      <p><a href="http://www.t26.com/fonts/715-Emily" title="http://www.t26.com/fonts/715-Emily">http://www.t26.com/fonts/715-Emily</a></p>
      <p>Mike Diaz :-)</p>
