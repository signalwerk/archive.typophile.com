    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Silica-770-280_e_6212.png"></div><p></p>
    <p>Monotype has become the exclusive distributor of more than 100 fonts from Sumner Stone of Stone Type Foundry Inc.  Stone’s typefaces have earned an excellent reputation for quality and legibility for a wide range of uses, from books to display advertising.  Along with lecturing, writing and teaching, Stone will be designing new typefaces that will become available through Monotype.</p>
    <p>View Stone Type Foundry typefaces on Fonts.com - <a href="http://bit.ly/1iT4Cns" title="http://bit.ly/1iT4Cns">http://bit.ly/1iT4Cns</a> </p>
    <p>And read more about Stone Type Foundry typefaces – <a href="http://bit.ly/1kvCbHU" title="http://bit.ly/1kvCbHU">http://bit.ly/1kvCbHU</a></p>
