    <p>I've been lurking for a while and haven't really had much to post but I'm working on a new logo for a Class 1 training school. Smaller business needing a bit of a logo update. So here's what I have so far and the original. More looking for ideas for the typeface; placement sizing and all but suggestions and comments on the mark are fine too. Thanks.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/freeeagle-logo_5208.jpg"></div><p></p>
    <p>PS. I realized it resembles Ferrari's logo a bit (slab serif under image of animal) which was totally unintentional.</p>
