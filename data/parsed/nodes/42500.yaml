    date_raw: 29 Feb 2008 — 7:20am
    date: 2008-02-29T07:20:00
    votes: null
    html: |-
      <p>Asvetic: Very nice edit. I'm still learning continually about typography and design and had this strange idea that I had to use two fonts together that were almost identical just one being sans and the other serif. I'm still unsure of how the relationship between two fonts that go well together is but certainly like this idea. Secondly I didn't think of making it smaller like that and having it NOT line up with the edges of the "FREE EAGLE" but I think that seeing as Free Eagle is the name of the company and Driver Education LTD just describes what they do it's a very nice adjustment.</p>
      <p>I will continue to update and tweak this until there are no further adjustments needed.</p>
