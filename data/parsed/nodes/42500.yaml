    html: |-
      <p>I think you are well aware of what I'm getting at tylor, that that expression has been done before. And if the owners of the driving school are aware of Ultramar's mark, then I would hope that they would be wanting something 'more' original than what your effort is trying to express for <em>their</em> company.</p>
      <p>To me, your effort is either an intentional blurring of the Ultramar automobile service station mark and your driving school mark, or perhaps just by chance the two expressions are very much alike.</p>
      <p>Either way, I hope the driving school as a seperate and privately owned company will push for their own identity. Which in turn will push your <em>own</em> creativity.</p>
