  - id: 262650
    user_id: 6496
    user_name: AndrewSipe
    user_path: null
    user_image: /files/pictures/picture-6496.png
    date_raw: 29 Feb 2008 — 6:00am
    date: 2008-02-29T06:00:00
    votes: null
    html: |-
      <p>Myriad being a humanist sans has a lot of character. I was thinking of more along the lines of a Gothic that would accentuate your font choice for FREE EAGLE instead of competing with it. FREE EAGLE is the most important part of this logo. DRIVER EDUCATION LTD is just a description of what service FREE EAGLE performs.</p>
      <p>This is Freight Sans, but you could use any gothic sans like Trade Gothic, Franklin Gothic, Avenir, Gotham...</p>
      <p>I also reduced the size of DRIVER EDUCATION LTD, again so it doesn't compete with FREE EAGLE but in fact accentuates it.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/FREEEAGLE_5301.gif"></div><p></p>
  - id: 262675
    user_id: 25880
    user_name: tylor.reimer
    user_path: null
