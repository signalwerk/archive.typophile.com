    html: |-
      <p>Hiroshige: First of all I've never seen the Ultramar logo before so it's definitely not intentional. I did extensive studies on eagles and this pose is far from unseen. I felt it was a strong enough posture without being completely aggressive as seen in a hunting/fishing posture. I did a lot of sketching before coming up with this one. I had some ideas for doing just a head but that's been done (USPS) and didn't want it to be too abstract either.</p>
      <p>Asvetic: Well it's not really "mixing" as they are the same typeface" but I will try using a sans. I'll see if I can find a nice complementary face. As stated before I don't think a name change is possible. Name's been around for around 10 years and I'm not sure the client is too huge on a completely new logo direction either but I think what I have so far isn't too extreme.</p>
      <p>I'm still open to ideas and will try to incorporate some. I just know some of the ideas may not fly so sorry for my hesitance.</p>
