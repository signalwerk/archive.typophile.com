    html: <p>I'm not to crazy about the font choice on "Driver Education LTD". Mixing serif fonts isn't usually a wise design choice. Perhaps a sans serif for contrast would be more suitable. I'd also make it slightly shorter in line length than "FREE EAGLE" to balance your image on top better and to help direct the eye towards "FREE EAGLE" more so.</p>
