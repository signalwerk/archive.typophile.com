    html: "<p>There are still two typos: <br>- \"presado\": correct form is \"prezado\" (with z); <br>- \"Dasa dos Hunt\": correct form is \"Casa dos Hunt\". <br> <br>I'd like to make some \"style\" recommendations, too. <br>- \"sexta-feira\" (add a hyphen); <br>- \"Nove de Abril\" (capital N); <br>- \"Voc</p>"
