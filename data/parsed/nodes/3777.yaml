      <p>Wow! Thanks for your help i went ahead and made all of the recommended changes, but i kept the word "selado" because the word we Mormons use is "sealed" and I want to be sure to get the conotation right. Anyhow, lemme know if i missed anything. <br>On a more stylistic note, i'm not sure if i like the near collisions between the name "Jaden Rosser" and the next line of text. Does this bother anyone else or am i being hypersensitive? Thnx again for your help!</p>
