  - id: 28463
    user: 1353
    date: 2004-03-25T09:18:00
    date_raw: 25 Mar 2004 — 9:18am
    votes: null
    html: <p>If you really need to use the word 'sealed' ('selado'), then the sentence has to change. <br>Because what's being 'sealed' here is their marriage, not them. So, it should be <i>"a ser selado"</i> instead of <i>"para serem selados"</i>. <br> <br>Also notice that you need the <i>"de"</i> in your dates. You could also change <i>"Casa"</i> (dos Rosser/Hunt) to <i>"Resid</i></p>
