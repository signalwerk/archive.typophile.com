    <p>okay i'm sorry for slaughtering the portuguese language. but my little sister is getting married and wants to send announcements to friends in Brasil. I'm hoping that there might be some portuguese gurus to help me out on this one. The english announcement (bottom) is a done deal (mistakes and all) and the portuguese one (top) is more of an afterthought just to let friends know that the marriage will/has transpire/d. whovever translated the text (it wasn't i) took out the names for Shrs &amp; Shras Hunt &amp; Rosser that appear in the English version. Is this customary? Also is the typing out of the year (2004) cusotmary as opposed to spelling it out? I would appreciate any help with this one that anyone can offer. Any other comments of the overal design are welcome. Thnx in advance</p>
