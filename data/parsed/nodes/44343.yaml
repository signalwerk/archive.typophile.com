    html: |-
      <p>Hi Höfe. Yes, the promo isn't a showcase. It's supposed to be a striking,<br>
      cinematic introduction/teaser. The intention is it makes an impression,<br>
      because it's unusual, and generates interest from a wider range of web sites.<br>
      Too early to say whether it's working but wanted to try something different.</p>
      <p>The pdf shows of the design well, I hope, and has some notes at the back.<br>
      Obviously the press release has information relating to the design.<br>
      Anything else you want to know just ask.</p>
      <p>&gt;I’d love to hear what your main inspiration &amp; references were!</p>
      <p>Hi Kris. In some respects it's like Neo Sans, which I designed,<br>
      with the curves taken out. Not all the curves obviously.<br>
      That would be hideous, but enough to make the design a bit<br>
      more versatile I think.</p>
      <p>So the same things that influenced Neo. Gerard Unger's<br>
      excellent open designs like Argo, Dave Farey's Cachet, etc.<br>
      It's more industrial looking than the former and less curvy<br>
      than the latter.</p>
