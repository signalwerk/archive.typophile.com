      <p>Found a better sample (<a href="http://amostviolentyear.com/public/img/splash/logo.svg" title="http://amostviolentyear.com/public/img/splash/logo.svg">http://amostviolentyear.com/public/img/splash/logo.svg</a>), some details are completely absent from your sample. It is some sort of ultra contrasted stencil Caslon/Baskerville. <a href="/wiki/https%3A/%252Fcommercialtype.com/typefaces/dala_floda/dala_floda" class="freelinking" rel="nofollow">Dala Floda</a> might be decent alternative. Still searching a match.<br>
      More alternatives: <a class="freelinking external" href="http://www.parachute.gr/typefaces/allfonts/regal-stencil-pro" rel="nofollow">Regal Stencil</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/applyinteractive/caslon-fina-stencil" rel="nofollow">Caslon Fina Stencil</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typeinnovations/nadia" rel="nofollow">Nadia</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typeinnovations/renovatio-deco" rel="nofollow">Renovation Deco</a> (not bad filling vertical stem gaps)</p>
