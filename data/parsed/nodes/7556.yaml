    html: <p>1. Open the font in FontLab.  <br>2. Window / New Metrics Window.  <br>3. Enable kerning mode ("K" button).  <br>4. Type any two glyphs.  <br>5. Drag the right glyph to set a kerning pair.  <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd.</p>
