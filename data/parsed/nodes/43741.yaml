    <p>Okay. Now that I’ve got your attention...</p>
    <p>I recently saw an ad with this great typeface that I wonder if anyone can i.d. for me. below are lots of examples.</p>
    <p></p><div class="imageWrap"><img src="/web/20080705164433im_/http://www.typophile.com/files/g1_5017.png"></div><br>
    (I love the innuendo of that one!)<p></p>
    <p></p><div class="imageWrap"><img src="/web/20080705164433im_/http://www.typophile.com/files/g2_4930.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="/web/20080705164433im_/http://www.typophile.com/files/g3_5215.gif"></div><p></p>
    <p></p><div class="imageWrap"><img src="/web/20080705164433im_/http://www.typophile.com/files/g4_4170.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="/web/20080705164433im_/http://www.typophile.com/files/g5_3479.png"></div><p></p>
    <p>In the print ad, I could see that the face has rough edges (not so easy to see at 72ppi). I’m much more interested in the letterforms themselves, so if anyone knows comparable faces without the rough edges, please advise.</p>
    <p>Thanks.</p>
