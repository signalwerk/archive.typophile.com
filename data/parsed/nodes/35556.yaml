      <p>well i'm no expert but i understand that the press is well established, formed in 1924 for by Sebastian's father Will Carter it is apparently "Apart from the Officina Bodoni in Italy the longest-established family fine press in the world" I beleive that among other things sebastian most famously oversaw the digitization of Golden Cockerel and authored 20th century type designers:</p>
      <p><a href="http://www.amazon.com/20th-Century-Designers-Sebastian-Carter/dp/0853318514/ref=sr_1_2/002-4602721-8667219?ie=UTF8&amp;s=books&amp;qid=1185825040&amp;sr=1-2" title="http://www.amazon.com/20th-Century-Designers-Sebastian-Carter/dp/0853318514/ref=sr_1_2/002-4602721-8667219?ie=UTF8&amp;s=books&amp;qid=1185825040&amp;sr=1-2">http://www.amazon.com/20th-Century-Designers-Sebastian-Carter/dp/0853318...</a></p>
      <p>Sadly the press is closing at the end of this year, Sebastian is downsizing and moving so the type and machinery is being sold off or given away (though i was assured to good homes) </p>
      <p>It was a great visit, i could have happily stayed there all week, so much to learn and Sebastian was so kind and helpful</p>
