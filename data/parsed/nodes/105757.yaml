    <p>I've been wanting to tackle a variation of Romanian Orthodox for years, but on my last trip to Romania, I visited a cathedral in Galati that had a very unique style. I don't know much about the origin of the style, but would like to. The samples below are my initial attempt at digitizing the script, with a few variations from the original (attached)</p>
    <p>Though the market may be narrow for this style, I have noticed similar styles in Bulgarian Orthodox, which opens up the possibility of a Cyrillic variant.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/nouortodoxa-1_5724.png"></div><p></p>
