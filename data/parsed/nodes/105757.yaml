    html: |-
      <p>Bogdan, thanks for the tips again. A few of the letters are original to the face, as they weren't represented in the tablet at the church (Q, W, Y), so I'm open to reworking them to fit better historically/stylisticly as well as some of the others for the sake of the style.</p>
      <p>As for the weight/contrast, I'm considering this to be more of a wireframe for a finished face, but it's not like there are any other traditional orthodox monoweights around.</p>
      <p>Thanks for the history. I assumed that there was a close connection between Romania and cyrillic, but wasn't sure when it was.</p>
