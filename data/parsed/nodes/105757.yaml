    html: |-
      <p>Great find! Depending on whether you want to keep the letters totally identical or improve stuff here and there (and if some more diacritic nitpicking is allowed), I'd say that…</p>
      <p>   • Uc |J| could extend a bit below the baseline, (isn't this a decorative font after all?);<br>
         • Uc |Q| doesn't look like Q to me;<br>
         • Uc and lc |R| looks more like a lc |h| with a swash (maybe go back to |B| as a starting point instead?);<br>
         • I suppose the diacritic mark of the third letter is intended to be a circumflex, but it looks like an inverted breve. The circumflex has to be a bit "pointy" at the top, not round;<br>
         • The breve, inverted breve and circumflex should 99% of the time be narrower than the upper part of lc |a|, but in this case, for stylistic reasons, it can be the same width – but not wider like they are now;<br>
         • The ampersand based on "și" would look much better/rounder/fuller as uc |Ș| and as basis for lc |ș|.</p>
      <p>And… are you gonna let this be a monoline font? Some contrast would make it look much better/solid IMO. :)</p>
      <p>(Similarities with the inscriptions in Bulgarian Orthodox churches? Of course – the territory north of Danube was under the Bulgarian Orthodox "Empire" for a long time, complete with Cyrillic, not Latin letters and inscriptions. The Latin alphabet was adopted gradually after the 1848 revolution, and I suppose the church in Galați was built after that, but the Cyrillic (or Byzantine?) style influenced the Latin letters.)</p>
