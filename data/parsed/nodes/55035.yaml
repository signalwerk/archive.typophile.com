      <p>Separations refer to the 4-color printing process (on an offset press) where you separate the colors (CMYK) to 4 printing plates. Normally your printer can handle this (in fact I'd highly encourage it). But occasionally a designer will have to prepare the files. Anyhow see <a href="http://help.adobe.com/en_US/Photoshop/11.0/WSfd1234e1c4b69f30ea53e41001031ab64-7794a.html" title="http://help.adobe.com/en_US/Photoshop/11.0/WSfd1234e1c4b69f30ea53e41001031ab64-7794a.html">http://help.adobe.com/en_US/Photoshop/11.0/WSfd1234e1c4b69f30ea53e410010...</a><br>
      for how to create/print separations.<br>
      Also a read of <a href="http://help.adobe.com/en_US/Photoshop/11.0/WSfd1234e1c4b69f30ea53e41001031ab64-779da.html" title="http://help.adobe.com/en_US/Photoshop/11.0/WSfd1234e1c4b69f30ea53e41001031ab64-779da.html">http://help.adobe.com/en_US/Photoshop/11.0/WSfd1234e1c4b69f30ea53e410010...</a> would be recommended as well.</p>
      <p>Finally I recommend working in RGB until you have everything finalized before converting to CMYK.</p>
