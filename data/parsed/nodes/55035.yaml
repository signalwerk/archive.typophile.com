      <p>This may be a case of the blind leading the blind. I regularly get requests from people companies who use the wrong terminology (which ends up confusing everyone involved), or just plain don't know what they're talking about/asking for.</p>
      <p>Artsions, you should probably get more info from these people about what specifically they're asking for. I suppose they could be asking you to save it in DCS format, which splits up the file into separate CMYK files, but I haven't seen those used in years.</p>
      <p>"Also, this isn’t exactly graphic design work, but prepress or DTP."</p>
      <p>True, but definitely something a designer should know.</p>
