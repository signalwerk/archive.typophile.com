    html: |-
      <p>I think you are worrying too much about the 4 color process. Photoshop automatically takes care of that issue, assuming that you have the color setting preference set for either US web coded (SWOP) v2 or US Sheet-fed coated v2. This can be achieved within photoshop by going to edit/color settings, a dialogue box will open with drop-downs under Working spaces. I recommend that you set the RGB to Adobe RGB 1998 and the CMYK to one of the settings I mentioned ( sheet-fed or web). If in doubt, contact the printer and they will guide you.</p>
      <p>That's it. If you want to check out the separations click on channels window in photoshop and turn on and off the channels and you will see the CMYK on their own. Unless you really know what you are doing, leave them alone.</p>
      <p>There are advanced corrections you can make to the images using adjustments such as curves, levels etc. but for now I think this will do.</p>
      <p>Hope this helps.</p>
      <p>G.</p>
