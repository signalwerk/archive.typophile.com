    html: |-
      <p>Well, if he is asked to make color separations, I guess that is what he has to do.<br>
      It is true Photoshop automatically has the 4 colors each on a different channel, but I presume his client wants these in seperate files as well. The first link bemerx25 has posted shows how to do this.</p>
      <p>I do wonder why they want you to do this, though, since most modern printers will separate colors themselves with their RIP.</p>
      <p>You should go back to the client and ask what it is he wants exactly. Does he really want 4 files each with 1 color? For what printing technique is this going to be? Etc.<br>
      For offset printing I don't see why you should separate the colors yourself. If it is for screen printing I could see why, but even then I think most screen printers will take care of it themselves...</p>
      <p>Also, this isn't exactly graphic design work, but prepress or DTP.</p>
