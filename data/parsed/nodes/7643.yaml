  html: "<p>This isn't a display font strictly speaking. However, I put it together with titling usage in mind. <br> <br>I really enjoy playing with grays, but I also enjoy tinkering with notchy designs as well. <br> <br>In fact, I'm torn as to the true nature of what a pixel font might strive to be: emulate the fluid nature of outline fonts, or: damn the torpedos and celebrate the stepping visuals of stacked blocks. <br> <br>At any rate, Fredman is open for examination. Any feedback is welcome. <br> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/53356.gif\" alt=\"\"></p>"
