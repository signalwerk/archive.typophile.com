    html: <p>I decided to take the direction the serif italics (above) wanted to go in, emphasizing letterforms that lent themselves to the italics diagonals, and ended up with another font. <br><br>I worked the italics backward graphicallly to reach the non-italic version of the font. It’s not cutting edge, but I do like the congruency between the italic and non italic sets, and of course, the fact that the italics don’t look like an afterthought when compared to the non italics. <br><br><img src="http://www.typophile.com/forums/messages/29/53468.gif" alt=""><br><br><img src="http://www.typophile.com/forums/messages/29/53469.gif" alt=""></p>
