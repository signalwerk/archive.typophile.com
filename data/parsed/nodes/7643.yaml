  - id: 51881
    user: 2139
    date: 2004-11-11T02:35:00
    date_raw: 11 November 2004 - 2:35am
    votes: 0
    html: '<p>Well, the italics variants are a fun challenge. They may or may not work ultimately, but I can’t help trying to make them work. Of course, grays would ﬁx this right up, but, this is a 1-bit exercise for now. <br><br>The same two serifs have been tilted, with the top one being cleaned up and the bottom one left raw. Not surprisingly, the bottom graphic is the most faithful to the non-italic members of the family. <br><br>And although I like taking pixel designs towards notchiness sometimes, I only like it if it looks like its been done by design. This is where the bold italics below falters, although it does beneﬁt from the heavy line weight to carry the eye past some of its crags and holes. <br><br>I like the regular italic version better, but it faulters in a diﬀerent way: in an eﬀort to clean up the letters and give them uniformity across the set, a large portion of the style set forth by the non italics members is lost. In fact, characters stretch the limits of acceptability from bold to regular within the italics. <br><br>Any thoughts or critiques are most welcome! <br><br><img src="http://www.typophile.com/forums/messages/29/53372.gif" alt=""></p>'
