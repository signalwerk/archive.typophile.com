    html: '<p>Looks promising. Reminds of Skia, which to me is good. <br><br>&gt; the true nature of what a pixel font might strive to be <br><br>Don’t necessarily see grays as an emulation of outlines. <br>“Gray pixels are people too.” <br><br>One way grays can help on their own merit is by balancing color better. For example look at your 2-pixel <span class="caps">UC</span> “V”: a touch of gray on the insides would make it: nicely darker; seem less wide. <br><br>hhp</p>'
