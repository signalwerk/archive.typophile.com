    html: <p>no, it’s named after a rosy-cheeked blonde boy with glasses and purple tiedye shirts, who was a friend of mine in the fourth grade and who stole the aﬀection of a certain girl in our class. <br><br>what made matters worse was that at the time, the fourth grade was when boys actually admitted to one another that they liked girls at all, which made holding hands and awkward kisses possible, and therefore inevitable. <br><br>which meant that at recess there was repeated, quantiﬁable proof that this girl only had eyes for him and wasn’t even <span class="caps">THINKING</span> about me. <br><br>i was jealous of him after that, but always liked his last name. he coined his own nickname after it, in fact. mag wheels. eric “mag wheels” magnuson. <br><br>that font looked to me like a fast car (well, you know), and fast cars ought to have cool wheels. so, if this font were to have wheels, they’d be mag&nbsp;wheels.</p>
