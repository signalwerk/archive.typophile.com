      <p>BlueStreak, I’m not dismissing CSS at all, and use it extensively. What I’m hoping to avoid, however, is the focus on CSS as the end goal. What I see a lot lately is the dismissing of everything <em>but</em> CSS. It’s the new kid on the block (not so new anymore, really) and so lots of folks are jumping to be the purest of the pure, and it’s getting a bit tired. Cameron’s site has some nice qualities, but to me they’re found in the site’s textures and depth-of-field (amazing what a simple drop-shadow can do to make the “page” pop off the background). The typography there seems well done, but ironically I find it a bit over-done, a bit busy at times (there’s a lot of emphasizing going on in the main column, and that side bar needs some leading, etc.).</p>
      <p>As for this thread, the OurType site is still the closest to what I had in mind, but all of the other suggestions have been helpful in the search for points of reference. It’s not at all that I’m planning to design a site that looks anything at all like OurType, but simply that I’ve been most inspired by that site so far. That site, more than the others, has got my motor runnin’. I’d love to comment on some of the other suggestions, but I have a pile of term-projects to mark and I’ve put them off long enough.</p>
      <p>So, thanks to everyone for their input. Hopefully this thread will continue, but I may not be able to respond for a few days.</p>
      <p>Alessandro, thanks for the Plato reference, I’m eager to take a look.</p>
