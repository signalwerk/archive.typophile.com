      <p>Mr. Jason Dewinetz,<br>
      since Dennis Brody talks about ‘appropriacy’, if I may ask, what is your project about? I want to ask also because I guess there is no similar idea in the web as the one you have in mind.  Ideas demand change.  By definition, the application of an idea means that something different will take place in the universe.<br>
      I don’t take any offense, I am rather glad my site is the exact opposite of what you are looking for, and because I do not waste my time with thoughts about “being even,” I, from now on, think in terms of my overall strategy and I am willing to sacrifice temporary loss in local skirmishes for the advancement of the long term goals.<br>
      Object-oriented programming is the leading software&nbsp;development technique today——but the logic of object-oriented&nbsp;programming was developed by philosophers like Plato, Aristotle&nbsp;and Porphyry.  If you can master the concepts, you can master&nbsp;the details.  Many philosophers are surprised to discover that high-tech jobs are often philosophically rewarding as well as financially rewarding.  If you love metaphysics, for instance, you’ve great future as a software designer: a large software system is just an enormous conceptual structure, not unlike a great metaphysical system.</p>
      <p>Regards, and good luck for your project(s).<br>
      AS</p>
