      <p>I think what happens is that initially a site design might involve a graphic designer and be more visually rich but after a while, site maintenance becomes the devil and the master.  It is just a royal pain to upkeep the old style tables and Flash sites.  CSS is a better solution (at least for now). I much prefer a site where I can quickly find what I want and that is up-to-date in information to one that is glitz and eye-candy. Larger sites use CMS just to handle upkeep. They are most often put together by folks who are more akin to engineers than to graphics types.  Their sites work and pages get rebuilt on the fly but they usually don’t have the pizazz you might be looking for.</p>
      <p>ChrisL</p>
