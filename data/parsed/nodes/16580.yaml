      <p>I also appreciate your comments on the philosophical connection to technical work. Mathematicians have long discussed the spiritual/philosophical component of their efforts, and it seems to me that the same inhabits this sort of thing as well: <em>connection</em>. I tell my students all the time that there’s little more exciting than watching as they grow into code, to find the pattern in the chaos and suddenly “see” what they’re doing. To see the connectedness of every character they type (be it literary or technical). This is trivial, of course, as metaphor, but it is not, of course, simply a metaphor. A broken HTML link to a CSS stylesheet crumbles a website. The wrong word in a delicate simile crumbles a poem. A broken link from practical every-day action to some sense of larger order or system crumbles a life. This is the dilemma. It’s not a matter of designing a website. It’s finding the appropriate method to express an experience. Lofty as all get-out, and pretentious to boot, but it’s what we all do every day, if we do what we do without fear of the consequences.</p>
