      <p>Alessandro,</p>
      <p>I’ll take your post gratefully at face value in that you’ve not taken offense to my comments, which had nothing to do with accomplishment or even taste, but simply with objective. My remark as to “opposites” had only to do with setting up a binary: not of “good” and “bad,” but instead “this” and not “that.” The problem, of course, is that I have no “this” to hold up as example.</p>
      <p>As you mention, “appropriacy” is indeed the topic at issue, in that I’m searching for inspiration in order to help me determine the appropriate approach to a project on the horizon, and that project is to present the topic of typography in the medium of a website. To my mind, this hasn’t been done to its potential, and so obviously that’s my goal. I have no illusions about accomplishing that goal, but it’s a goal regardless. To add to this task is the fact that I’ve brought it up here, in a community of well-educated and experienced typographers, which exposes me to all kinds of “pressure.” But that’s rather beside the point. I have a project in mind and I’m seeking input/guidance. This puts me in a position to be critically judged if/when the project comes to light, and I’m grateful for the opportunity. Maybe I’ll crash and burn, who knows. But each project is a challenge and boils down to this: accept the consequences and do, or fear the consequences and do nothing. So I’ll do, with the help of others’ advice, and if it all comes to crap, well, then I’ve discovered one more route to crap which I can perhaps avoid in the future.</p>
      <p>I also appreciate your comments on the philosophical connection to technical work. Mathematicians have long discussed the spiritual/philosophical component of their efforts, and it seems to me that the same inhabits this sort of thing as well: <em>connection</em>. I tell my students all the time that there’s little more exciting than watching as they grow into code, to find the pattern in the chaos and suddenly “see” what they’re doing. To see the connectedness of every character they type (be it literary or technical). This is trivial, of course, as metaphor, but it is not, of course, simply a metaphor. A broken HTML link to a CSS stylesheet crumbles a website. The wrong word in a delicate simile crumbles a poem. A broken link from practical every-day action to some sense of larger order or system crumbles a life. This is the dilemma. It’s not a matter of designing a website. It’s finding the appropriate method to express an experience. Lofty as all get-out, and pretentious to boot, but it’s what we all do every day, if we do what we do without fear of the consequences.</p>
