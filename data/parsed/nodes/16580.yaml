      <p>It seems like designers often throw out the basics when designing for the screen. Contrast goes a long way. I’m talking about contrast of size! Which is why Coudal is a great looking blog-style site. One of the best examples of contrast is <a href="http://ourtype.be">Ourtype</a>. </p>
      <p>Step users down into your site. The reason every site looks like a blog these days is because they’re very flat (one template)... Blogs have no template hierarchy that indicates to users that they’re at the top level (directory level or landing page level), versus the deepest levels (articles, content, etc.)</p>
      <p>Our site is need of a refresh, but I think what it does well is give users a sense of how deep they are by not only the amount of links and text, but through the presentation of the content. The other thing I’m happy with about it is the variety of templates that come through. That variety is also missed in most flat blog-style sites.</p>
      <p>Level 1: <a href="http://www.punchcut.com/company/" title="http://www.punchcut.com/company/">http://www.punchcut.com/company/</a></p>
