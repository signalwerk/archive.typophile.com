      <p>Thanks for the suggestions so far, but it does appear I was too vague in my first post. I think of those listed so far, <a href="http://www.markboulton.co.uk/" target="_blank">Boulton</a>’s site is closest to what I was getting at, yet that site, and others (like Dean’s <a href="http://www.textism.com/" target="_blank">Textism</a> and <a href="http://www.cardigan.com/" target="_blank">Cardigan</a>) are great examples of well written CSS, and while <a href="http://www.alistapart.com/" target="_blank">solid and valid CSS</a> for content is of course part of my quest, I’m actually looking more for interesting use of type and typographic principle in the interface itself; think 1998-2002 when designers weren’t quite so XHTML/CSS Standards-driven and were doing interesting things graphically with type. (I’m not, of course, saying XHTML/CSS Standards should be disregarded, just that they’ve become the goal rather than the tools.)</p>
      <p>While I’m all for massive restraint and understatement in my book work, the internet is its own animal and should, I think, utilize it’s wide range of opportunity, rather than attempt to simulate newspaper/magazine/book layout &amp; design. I’m not suggesting websites should revert to the visual chaos of graphic pomp so popular not so long ago, but the current trend to pure CSS text in sleek perfect columns on white backgrounds is beginning to bore me to sleep. So, with that rant in place, any other suggestions?</p>
