    <p>Request:</p>
    <p>I’m looking for typographically driven sites as a source of inspiration for a project I have lined up in the new year. I’m not necessarily looking for sites on typography, but sites that make interesting use of type and typography built into the interface. This might include portfolio sites for type designers, type foundries, or book designers, etc., but also sites for non-typographic subjects that use type in an interesting way. I know this is very vague, but after visiting my regular list of web inspiration showcases I’m getting tired of frilly graphic design &amp; fancy-schmancy Flash/CSS bragging and am looking to absorb some understated and clean layouts that use type and typographic principles and “iconography” well.</p>
