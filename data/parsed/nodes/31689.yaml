    <p><strong>Ravensbourne College of Design and Communication</strong> is a specialist university sector college based in the <span class="caps">UK</span>, near Chislehurst in Greater London. It’s particular specialism is in design and broadcasting, with a strong creative tradition in&nbsp;both.</p>
    <p>A three-way merger between the art schools of Bromley, Sidcup and Beckenham in 1962 effectively gave birth to today’s&nbsp;college.</p>
    <p>Their website is: <a href="http://www.rave.ac.uk/">http://www.rave.ac.uk/</a></p>
