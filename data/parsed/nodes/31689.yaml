    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Education" class="freelinking" rel="nofollow">Education</a> : Ravensbourne College of Design and Communication</strong></p>
    <p><strong>Ravensbourne College of Design and Communication</strong> is a specialist university sector college based in the UK, near Chislehurst in Greater London. It's particular specialism is in design and broadcasting, with a strong creative tradition in both.</p>
    <p>A three-way merger between the art schools of Bromley, Sidcup and Beckenham in 1962 effectively gave birth to today's college.</p>
    <p>Their website is: <a href="http://www.rave.ac.uk/" rel="nofollow">http://www.rave.ac.uk/</a></p>
