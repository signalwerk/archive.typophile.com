      <p>Indeed, Verizon is one of the ugliest logos out there. That said, it's unique enough to be readily identifiable in the marketplace.</p>
      <p>What you have is a start, but is a fairly generic form/concept. I think you need to spend some more time further exploring ideas.</p>
      <p>And Gotham is a great typeface, but these days, it might warrant a bit of a push away from it. There's going to be a lot of student portfolios coming out the door with Gotham everywhere.</p>
