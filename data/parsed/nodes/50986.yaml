      <p>I like the original third one, but I find that the uniformity of the line width in the design, and the uniformity in stroke width in the text leave me feeling very cold and as though I am looking at a machine.</p>
      <p>I think that although technically, this logo is well executed, I feel that adding certain flair to it could much improve the experience and message it communicates.</p>
      <p>What if the circles had a varying width, one thicker part and one thinner part?</p>
      <p>What if the type used a slightly more human-friendly typeface?</p>
      <p>Play with it, I don't think it's done, but I do think you're definitely on to something good here too!</p>
