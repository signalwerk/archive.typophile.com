      <p>I agree with the bolding making a separation between the 'Veriz' and the 'On'.  I've seen that used most publicly in Apple's branding as a delimiter between words:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/iphone_5347.png"></div><br>
      iphone3G<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/macbook_4541.png"></div><br>
      MACBOOKair<p></p>
      <p>And the other place I've seen this is even more serious when you consider the nature of the Business: Bell Canada, a very popular Telecommunications company started by Alaxander Graham Bell (inventor of the telephone) himself.</p>
      <p>Bell recently went through a change in corporate identity, and has turned heads, especially in the design community with their new website.  The entire new campaign and branding also focuses on the emboldening of any 'er's in the text, and because Verizon and Bell are in the same industry, I think at that point that would be fresh in any designers mind when viewing your logo.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bell_5413.png"></div><p></p>
      <p>Now, I highly doubt you intended this, but if I were you now that word is out, I think I would change it just so the next person who comes along (and may not be as open-minded or forgiving) doesn't just assume you ripped off some Canadian telcom company for your logo.</p>
      <p>Best of luck, I wanna see what you come up with, cheers!</p>
