      <p>Its funny. I work for an interactive Agency that does all of Verizon's online advertisement and web pages. Yes the logo is terrible. Myriad Pro is their corporate face if you care to include that (or it could be interesting to turn away from that completely).</p>
      <p>@aluminum: Yeah that logo is pretty ugly especially how they highlight the Z. Oh and the way the dot of the "i" sits bothers me. There are 2 versions actually. One where the V's ends tapers off and another where it fades away at the ends.</p>
      <p>I agree with the complaint that its a little generic. Why not take the company's history as a starting point. They are the second biggest phone company in the world and actually offer the fastest form of internet in the US (if FiOS is available in your city). That could be another point.</p>
      <p>@aluminum again: I hope you are wrong about students and Gotham. I just branded a start up company with Gotham rounded. Oh well</p>
