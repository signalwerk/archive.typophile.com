      <p>I like the third one. Focusing on the link seems to be a good idea, because Verizon is known for their strong connection (except on the left side of my room). However, the circles jumble together a bit, seeing as how they are all the same stroke width. Try varying the strokes, or eliminating the outer two circles all together and focusing on that one link.</p>
      <p>Another idea would be to focus on the "network" premise, as they seem to be big on that right now.</p>
