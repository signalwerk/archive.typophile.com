      <p>The smaller bold line looks like <a href="http://www.fontshop.com/fonts/singles/itc/itc_garamond_std_bold/?&amp;sample_text=Het%20bijgaande%20wordt%20u%20zonder%20begeleidend&amp;sample_size=18&amp;update=0" rel="nofollow">ITC Garamond</a>.<br>
