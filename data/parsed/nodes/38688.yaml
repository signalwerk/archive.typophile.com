    html: |-
      <p>Limiting yourself to web-safe typefaces for all areas of branding is not a good idea IMHO. The web is very limited in the way of type, and people are used to it. If you go with Georgia on the website and a different font for print (or header images, etc.) you shouldn't run into any problems.</p>
      <p>The one point that concerns me is the fourth one. If it has to be free or a system font, then you're pretty much stuck with Georgia or TNR.</p>
      <p> - Lex</p>
    html_clean: |-
