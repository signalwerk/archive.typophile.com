  html: |-
    <p>Hi - I am new to typophile and would like to say congratulations on a superb website!</p>
    <p>I am working on the branding of a large website start-up company dealing with World History. Essentially it will be an on-line encyclopaedia or research tool. The criteria for font selection is as follows:</p>
    <p>Widely available across current platforms (a core font)<br>
    Font should be serif and not modern looking<br>
    Both print and screen use<br>
    Free - no licence required</p>
    <p>At the moment, the choice I have suggested is Georgia which works great on screen but no good with print.</p>
    <p>I would much appreciate your suggestions – thanks in advance.</p>
  html_clean: |-
