    html: |-
      <p>According to <a href="http://en.wikipedia.org/wiki/Snellen_chart">wikipedia</a>, These aren't ordinary fonts (with only 9 characters), they appear to be custom designed so the black balances with the white (notan? :^P) and the body height and width is five times the width (or thickness) of a stroke. </p>
      <p>The sans-serif chart example appears to be <a href="http://www.thomson-software-solutions.com/user_updates.html">this</a> font.</p>
      <p>The slab does bear a resemblance to Rockwell but I'm sure it is not.</p>
