    <p>Is there an official font used on Snellen eye charts?  I've seen both serif and sans serif versions, but the serif versions seem more widespread, at least based on online image searches.</p>
    <p>Example of serif chart:<br>
    <a href="http://upload.wikimedia.org/wikipedia/en/e/e7/Snellen06.png" title="http://upload.wikimedia.org/wikipedia/en/e/e7/Snellen06.png">http://upload.wikimedia.org/wikipedia/en/e/e7/Snellen06.png</a></p>
    <p>Rockwell?  Or is there something closer?</p>
    <p>As for the sans serif versions, online images of these are harder to find.  But they remind me of BankGothic Lt BT, although I'm pretty sure that's not it.</p>
    <p>Example of sans-serif chart:<br>
    http://pro.corbis.com/popup/Enlargement.aspx?mediauids={87b2fd54-3495-426c-8400-9280e50bf723}|{ffffffff-ffff-ffff-ffff-ffffffffffff}&amp;qsPageNo=3&amp;fdid=&amp;Area=Search&amp;TotalCount=472&amp;CurrentPos=25&amp;WinID={87b2fd54-3495-426c-8400-9280e50bf723}</p>
