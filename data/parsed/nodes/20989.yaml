    html: <p>I've actually always thought those eye charts used characters that had unfairly small bowls and counters. Kind of like when you see a sign for the fire department "F.D." but the period after the F is too tightly kerned and it causes it to look like it says "ED." ("Who's this Ed guy and why does he get to park here?")</p>
