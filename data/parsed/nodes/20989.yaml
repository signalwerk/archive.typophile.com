      <p>Don't know the official typefaces. Judging by the vertical symmetry, lack of overshoots on the rounds (O,C), and tiny bowls (D,P) it seems clear that the slab version at least was made by scientists, doctors, or engineers -- not type designers. These are my closest matches:</p>
      <p>Serif: <a href="http://www.fontshop.com/fonts/singles/linotype/stymie_com_medium/?sample_text=EFPTOZLD&amp;sample_size=74">Stymie Medium</a> beats <a href="http://www.fontshop.com/fonts/singles/monotype/rockwell_by_adobe_std_roman/?sample_text=EFPTOZLD&amp;sample_size=74">Rockwell</a> mainly because of the width and it's shorter E,F crossbars.</p>
      <p>Sans: <a href="http://www.fontshop.com/fonts/singles/monotype/sackers_gothic_std_heavy/?sample_text=PNXCASLGRK">Sackers Heavy Gothic</a></p>
    html_clean: |-
