  html: '<p>I would like to translate my site ( <a href="http://atomicmedia.net" target="_top">http://atomicmedia.net</a> ) into: <br> <br>Dutch <br>French <br>German <br>Spanish <br> <br>This is the file that I would like translated: <br> <br><a href="http://x.itsamac.com/~atomicmedia/temp/translate.txt" target="_top">http://x.itsamac.com/~atomicmedia/temp/translate.txt</a> <br> <br>I would like to trade my font library for these translations. If you would like to do this please send an email to <a href="mailto:matthew@atomicmedia.net">matthew@atomicmedia.net</a> before you start  so I can make sure you are not duplicating someone elses effort. <br> <br>Thanks, <br> <br>Matthew Bardram <br> <br>Atomic Media Fonts</p>'
