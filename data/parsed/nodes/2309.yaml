    user: 2704
    date: 2003-12-08T07:47:00
    date_raw: 8 Dec 2003 — 7:47am
    votes: null
    html: |-
      <blockquote><p>postulated <b>Hrant H Papazian</b>: <br>I really think all that's missing is a nice third-party licensable (or included in Flash) infrastructure, or "engine", where you could just dump in the text in, choose some parameters (like size, line length, etc.) and the textual navigation would pop up looking and working great. I think somebody actually made something like this in Java - in fact I think it was Bitstream.</p></blockquote>
      <p> I have concerns about licencing a text display widget in an era when web sites with budgets in excess of US$5-10K are few and far between. I don't see it getting used much, to be honest. <br> <br>That aside, your theory here sounds a little like the old /. joke:
      </p><ol>
      <li>Develop widget </li><li>??? </li><li>Profit!</li>
      </ol>
      <p></p><p>What we've got here is the dreaded SMOP (Simple Matter Of Programming), which as most developers will tell you is often anything but simple. <br> <br>I probably spend as much time reading on-screen as anyone (often 8-12 hrs./day), but I really don't like it as much as old-fashioned dead-tree text. The reasons are fairly obvious:
      </p><ol>
      <li>limited layout options </li><li>limited font choices </li><li>can't as easily see where one is in the text  </li><li>you typically see less text at a time, so scanning about the page requires scrolling rather than just moving one's eyes </li><li>mousing + clicking is slower and clumsier than thumbing for moving back and forth to reread, compare and contrast </li><li>cannot hilight passages </li><li>relative discomfort of viewing emissive vs. reflective media for extended periods </li><li>being tethered to a desk or a laptop (the latter isn't as handy as a book, not even the thin'n'light varieties) </li><li>cannot dogear pages </li><li>redraw times are infinitely greater online (books have none) </li><li>high entry cost (price of a computer + 'Net connection vs. price of a book/magazine) </li><li>poor text rendering</li>
      </ol>
      <p></p><p> The unique advantages of online text balance the equation for short- to medium-length texts:
      </p><ol>
      <li>Low incremental cost (even paid sites are typically cheaper than a magazine subscription) </li><li>Easy storage (a hard drive is smaller and holds a lot more than a bookshelf) </li><li>Portability (a laptop is easier to carry than a library) </li><li>Ubiquity (easier to find a phone jack or wireless hotspot than to find an adequate library/bookstore in many areas) </li><li>Automatic updates </li><li>Ease of copying  </li><li>Internal searchability (the 'find' command) </li><li>External searchability (search engines like Google) </li><li>Easy cross-referencing (copy/paste into Google, M-W.com, etc.)</li>
      </ol>
      <p></p><p> There are also a few things that a browser does to mitigate the disadvantages of online reading:
      </p><ol>
      <li>ability to resize text (text/page zoom) </li><li>proportional scrollbars </li><li>scroll wheel/arrow keys for moving around a page </li><li>keyboard accelerators for forward/back, links, etc. </li><li>bookmarks </li><li>ability reflow text (changing browser width)</li>
      </ol>
      <p></p><p> <br>Now, going through the disadvantages of online text, which ones does Flash address? Flash allows better layout control (point one) and a far wider selection of fonts (point two). Two points for Flash. <br> <br>Flash neither hurts nor helps with respect to points 3-9. No score. <br> <br>However, Flash does hurt us with respect to point 10: OS + Browser is always going to be faster than OS + Browser + Flash. Flash imposes <i>some</i> overhead, no way around it. Likewise, one needs a newer, more powerful computer to have an acceptable experience browsing a Flash page than browsing HTML, so it hurts again on point 11. On point 12, Flash's rendering of small text is notably inferior to OS X's native rendering, and I'll take your word that WinXP's antialiasing is better than OS X's, so Flash looses this one. Score 3 for HTML. <br> <br>Now let's look at the advantages of online text. Flash has no effect whatever on points 1-4, so those are a draw.  <br> <br>Assuming proper authoring, updates in Flash can be more or less as simple as updating HTML (the text needs to be drawn in from a file on the server or similar), so we'll give it point 5. Likewise, it's possible to save an .swf file to your HD just as you can an HTML page, so point 6 is a draw as well. I have never seen any implementation of a 'find' command in Flash, but it shouldn't be <i>that</i> difficult to implement, so we'll give it point 7 as well. Point 8, external searchability, is a well-known problem with Flash. Theoretically, at least, one could include the text in a 'hidden' &lt;div&gt; or similar to enable searching so I'll give you that point, too. Likewise, I've never met a Flash page that allowed me to copy a text snippet, but IIRC there is a particular sort of text that can be used (the name escapes me) that makes the text editable, and that text could allow copy/paste, so I'll concede point 9.  Another draw, but only after an awful lot of hand-waving. <br> <br>Last, we'll look at the things browsers do to mitigate the problems with online text. Flash allows users to zoom, and we'll concede that your widget gives us proportional scroll bars, scroll wheel/arrow keys and keyboard accelerators. No score. <br> <br>Bookmarking is another well-known problem with Flash, but we'll wave our hands some more and say each page could be a separate movie or that there is some mechanism for bookmarking within a Flash movie of which I am unaware. So a draw on point 5. <br> <br>On point 6, Flash zooms to fit the screen, but doesn't reflow. If for whatever reason I've got a narrower display area than you anticipate, I'm screwed. Still, there may be a way to automagically determine the width of a Flash movie and reflow the text to accommodate it. Let's wave our hands and call it a draw. <br> <br>Final score: Flash 2, HTML 3, and *lots* of hand waving going on to get there. Notably, I haven't used Flash since v. 5 so I'm just assuming that there is some way to get a movie's dimensions at run time and that the editable text cast member can use an arbitrary font that isn't installed on the end user's system (my recollection is that it could not as of v. 5). Futher, to solve both the external searchability problem and the bookmarking problem we need to rely on techniques that will exacerbate the performance and entry-price problems. As well, I glossed over another issue: we need to license this widget, which means our costs for producing content go up, which in turn means incremental costs (cost per new page of text) will probably need to reflect that somewhat mitigating one of online text's advantages. <br> <br>Call me crazy, but it seems to me that right now, today, even with a whole lotta benefit of the doubt and assuming a widget that doesn't exist, Flash is still inferior to HTML for reading more than small bits of text. Seems to me efforts at improving online reading would be better focused on a base of HTML rather than on Flash. <br> <br></p>
