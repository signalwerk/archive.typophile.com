      <blockquote><p>opined <b>steve paxton</b>: <br>Well, I think that's a highly dubious statement anyway given Netscape's buggines in terms of actually working ;)</p></blockquote>
      <p> Which version? NN4.x is an unholy mess, to be sure, and Netscape versions prior to 6.2 were beta-quality at best. However, I've been using Mozilla (the same 'guts' as NS, just without the AOL adware) since 0.9.4 and it's quite stable and acceptably fast. In fact, my SO uses Moz 1.0 on a 6-year-old Dell PII 266/160 MB and is quite happy with it. <br> <br>Firebird on OS X has been a bit dodgier, but I've been using it on my Win2K laptop since the Phoenix days with nary a problem and speed-wise it's comparable to IE or even Opera. <br> <br>And of course there's always the little matter of <a href="http://slashdot.org/article.pl?sid=03/11/29/1353243">security</a>. <br><br>
      </p><blockquote>further posited <b>steve</b>: <br>But that still takes longer than developing for just one browser, and testing is a much longer process. Unless you want to stick to really basic stuff (which is a good strategy, but one many clients don't want to know about).</blockquote><p></p>
      <p> It takes a bit longer, yes, but once you relegate NN4.x to the 'gets basic content + functionality' category it isn't so bad. In fact, if IE/Win were even as capable as IE 5+/Mac WRT CSS testing expense would be negligible. With the exception of heavy use of frames (generally a Bad Idea anyway) or hairy DHTML I find that pages tend to work first time out in Gecko-based browsers (Moz, Netscape, etc.), Safari, Opera 7 and IE 5+/Mac. Opera 5/6 typically boosts time by maybe 10% or so, IE/Win by 10-30% depending on what you're trying to do. <br> <br>It also matters what you mean by 'support'. If you're still locked into thinking that the pages must look pixel-perfect across browsers (which it doesn't seem you are), supporting multiple browsers can be a PITA. If you realize that pixel-perfection is a fool's errand, things get easier in a hurry. With a little practice,  methodology like Steve Champeon's '<a href="http://hotwired.lycos.com/webmonkey/03/21/index3a.html?tw=design"> progressive enhancement</a>' makes supporting multiple browsers relatively painless. <br><br>
      </p><blockquote>observed <b>steve</b>: <br>Hey, so the real figure could be as much as even maybe 4 or 6% at a push. I can't imagine any client not wanting to throw money at that market sector.</blockquote><p></p>
      <p> I assume you're being sarcastic, but there are in fact sites that <i>do</i> take that percentage seriously. The creative director at the <i><a href="http://www.economist.com">Economist</a></i> is a regular over at <a href="http://www.webdesign-l.com">WD-L</a> and has explained many times that given their traffic levels, even 3-4% of their audience is large enough to warrant attention. <br> <br>Even if it weren't, it isn't like we're talking about breaking the bank. It's mostly a matter of not doing things that are actively hostile to non-Windows or non-IE browsers (document.all and such) and not browser sniffing and locking non-Windows browsers out. <br></p>
