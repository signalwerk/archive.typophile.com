    html: "<p>I just wanted to make two comments: <br> <br>WEFT: It was at one time really easy to rip off WEFT fonts if you were viewing the page as an end user. This was what I based my comments on. However, this appears to be no longer the case, which is a good thing. Similarly, fonts in PDF are less easy to rip off than they once were (not that I'm claiming they're \"secure,\" just a bit less insecure). <br> <br>HTML: There is absolutely no reason that a web browser can't display HTML using the built-in kerning in the font you're viewing in (if there is any), except that it chooses not to. (The HTML text itself doesn't have to indicate kerning any more than plain text does. Place a plain text file in a DTP app, and it will have kerning.) <br> <br>T</p>"
