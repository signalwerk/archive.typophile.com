    html: |-
      <blockquote><p>informed <b>Hrant H Papazian</b>: <br>Not really. Flash can render the highest form of text (handmade grayscale bitmaps) more reliably than MacOS (and even Windows) can.</p></blockquote>
      <p> Is there an example somewhere? The tutorials on this site apparently do <i>not</i> use them, because the text looks like •••. <br> <br>Taking your word that they're noticeably better than native OS X/WinXP text at the designed size (it does make sense), how good are they if you zoom them in Flash? Better, worse or about the same as zoomed outline fonts? <br> <br>As well, we're adding to our incremental costs again, and I don't believe these greyscale bitmaps are in terribly wide use. <br> <br>Regardless, I'll give you the point with the caveat that there's some more hand-waving going on here. So it's still 2-2, even up, and lots of hand-waving to get there. <br><br>
      </p><blockquote>Flash also has the advantage of allowing kerning - very important for onscreen readability (and legibility).</blockquote><p></p>
      <p> Important, yes, but it's an incremental improvement. I'd vote for higher-resolution displays, reflective displays (for extended reading, at least) or even annotation/highlighting capabilities before I'd go after kerning. <br><br>
      </p><blockquote>HTML doesn't kern (does it)?</blockquote><p></p>
      <p> You mean hand-kerning? Not really. You can hack it by wrapping the problem pair in a &lt;span&gt; and using the letter-spacing property to adjust the space, but it's crude and probably not worth the effort for anything other than an egregious headline boner (not that I expect many people take the time to hand-kern body copy even in print). Even there, given the differences in text rendering between platforms and unreliable fonts I'd say it would likely do more harm than good. <br> <br>If you mean automagic kerning based on the kerning pairs specified in the font, that would be an OS-level issue. Honestly, I don't know if OS X does or not as it's not terribly obvious which nasty pairs in the text above are due to lack of kerning and which are due to the coarse pixel grid. <br><br>
      </p><blockquote>I'm not saying Flash is ready for prime-time in terms of extended reading, but I do think (not least by observing the wanton behavior of the OS/app makers) that it has more potential than HTML.</blockquote><p></p>
      <p> Based on MM's progress so far? I don't know. They seem pretty focused on making Flash the app development platform Director could be but isn't (due to underpromotion as much as anything, really; it's far more capable than Flash as a programming environment). <br> <br>As well, there's SVG floating around out there. The SVG-RCC bit allows you to map arbitrary XML elements to an SVG display, which would <i>in theory</i> allow you to add vector fonts to XHTML elements. It's still at the Working Draft stage, though. <br> <br>And of course there's XAML, MS's Flash/SVG/HTML/DOM/CSS killer-to be. By the time Longhorn hits, &amp;deity; only knows what text will look like in that or where OS X text rendering will be. In principal, OS X uses display PDF, so there's really no reason it shouldn't have at least as much sophistication as Flash. <br><br>
      </p><blockquote>Ah, but you've also not gotten calls from clients who decided never to contact you in the first place. That's my point.</blockquote><p></p>
      <p> So you're talking wow-em portfolio showpieces? Sure, Flash allows some brilliant stuff in that area. No contest there. <br> <br>I'm talking production sites</p>
