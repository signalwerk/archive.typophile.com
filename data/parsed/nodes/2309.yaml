      <blockquote><p>revealed <b>Refusenik</b>: <br>While checking out the Microsoft Typography site, I came across <a href="http://www.glyphgate.com/info/index.html">GlyphGate</a>, a server-side application that claims to offer a cross-platform solution to the limitations of web typography.</p></blockquote>
      <p>I'm with darrel on this one regarding cost/benefit. It may engage in some tricky sniffing to determine browser capabilities, but as a practical matter there is no way to support <b>every</b> browser out there as this product claims. Just off the top of my head, one would have to test it with all released versions of Trident (IE 4+/Win rendering engine), Tasman (IE 5+/Mac), Seamonkey (NN4.x), Gecko (Mozilla, Netscape 6+, Camino, Firebird, Galeon, etc.), Opera and KHTML (Safari, Konqueror and OmniWeb 4.6+), to say nothing of such obscure rendering engines as iCab and OmniWeb (pre-4.6), older rendering engines used by the aforementioned browsers (such as IE 3, NN 3, etc.) or browsers for the Danger hiptop, PalmOS, the Symbian OS, etc. <br> <br>From the FAQ: <br><br>
      </p><blockquote><b>Q:</b> What is Server Gated CSS Level 2? <br> <br><b>A:</b> The ability to publish a web page containing CSS Level 2 formatting to a server and view that page faithfully in a browser without CSS support. <br> <br>... <br> <br><b>Q:</b> What browsers are supported by GlyphGate? <br> <br><b>A:</b> All browsers are supported, at varying levels. Text of any language, any font, any color and any style is presented equally well in all browsers. Other types of formatting, such as border styles and margins, may or may not be supported by all browsers.</blockquote><p></p>
      <p>So they plainly state that it doesn't do quite what they claim: CSS2 layouts are <i>not</i> magically viewable on non-CSS2 browsers. <br><br>
      </p><blockquote><b>Q:</b> How are browsers without support for "embedded fonts" handled? <br> <br><b>A:</b> Even browsers that do not support font embedding are fully supported. Web pages are partially formatted on the server and text set in non-standard fonts are transmitted as images to these browsers.</blockquote><p></p>
      <p> So it just sets your text as images in Mozilla, Safari, Netscape 6 (the 'Navigator' name only applies to Netscape versions prior to 6) et al. <br> <br>I would also add that I'd be leery if this thing served embedded fonts to NN4.x. I've heard nothing but horror stories from those who have tried to use the Bistream embedding technology in that browser--as in 'every page with an embedded font crashed the browser' kind of horror. <br> <br>Net-net, this product may be beneficial if you're serving sites using Thai or Arabic or some other script that is poorly supported in most browser/OS combos. It is not, however, a means of ensuring that 'every' visitor will see the layout/fonts you choose. <br> <br> </p>
