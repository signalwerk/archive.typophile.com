    html: <p>"You are using a web browser that is unknown to this web server" <br> <br>Which is the problem with browser detection. At least this detector was smart enough to say 'I don't know what you are using, but if you think it's OK, go ahead and look at the site...' <br> <br>"I didn't really mean crashing, I was referring to the way Netscape browsers deal with DHTML." <br> <br>Oh...I think you're referring to NN4. No argument there that's a crappy piece of software. I tend to serve NN4 the plain-jane text of a site. It's not pretty, but they get all the content. <br> <br>As other's have mentioned, Flash really isn't the web. Flash is it's own thing, and can often compliment a web page, but using flash *as* the web page is often (though certainly not always) a bad thing. Even Macromedia is realizing that and is finally pushing Flash outside the browser, where I think it will actually do quite nicely. <br> <br>Bottom line, use flash when it makes sense. Using it because it is 'easier' to get the exact visual design 'you' (the author) wants isn't usually a valid argument.</p>
