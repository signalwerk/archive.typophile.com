stead of HTML. <br> <br>&gt; .... one site, properly built .... <br> <br>A properly built site takes as much advantage of the differences in user setups as budget allows. <br> <br>&gt; CSS doesn't do that at all. <br> <br>Then it's not enough, at least not all of the time. <br> <br>hhp <br></p>
  - id: 18482
    user: 2704
    date: 2003-12-08T13:10:00
    date_raw: 8 Dec 2003 — 1:10pm
    votes: null
    html: |-
      <blockquote><p>informed <b>Hrant H Papazian</b>: <br>Since pixelfonts (1-bit or grayscale) are built with funky outlines (to map to the screen pixels correctly), zooming destroys them. What you can do is detect the zoom level and sub another font that renders well at that magnification. But a user who zooms in isn't worried about readability (unless the Flash stuff is badly designed and the text is too small).</p></blockquote>
      <p> That's precisely why users may want to zoom in. And 'too small' is subjective. On my screen for my eyes the text in this forum is at the bottom edge of comfortable legibility. For my GF, it's a shade too small. For my aunt, it's illegible. That's one of the bonuses of online text: no need for large-print editions. Flexible text size is a nicer solution, at least as far as the sort of ephemeral, moderate-length text people tend to read online. The violence done to line length by resizing the text might be too much for longer texts, but by then you've got bigger problems (eye fatigue from staring at an emissive display, for example). <br><br>
      </p><blockquote>I mean that the kerning in a font is ignored by HTML.</blockquote><p></p>
      <p> Vocabulary-check time. HTML is a markup language for describing the structure of a document. It really does nothing in terms of rendering a document to the screen. It just says "this is a 'p', this is an 'h1' and that's an 'li'". The browser then interprets those tags (typically as a paragraph, a level-1 heading and a list item, respectively) and applies formatting based on internal style rules. If it groks CSS, it will override those internal rules according to the rules specified in the stylesheet, if any. <br> <br>The little presentational candies (font tags, color and border attributes and suchlike) are corruptions introduced by Netscape back before CSS was a working draft, and are slowly being deprecated out. They really shouldn't have been there in the first place, but are and are still in wide use despite their drawbacks WRT bandwidth consumption, maintainability, etc. <br> <br>The point of HTML was that it could be viewed using a wide range of clients running on a wide range of devices: text browsers running on green sreen terminals, graphical browsers running on a PC, audio browsers running on a phone and so on. Fine points of display were intentionally left out because there was no way for an author to know whether the reader's device would even be capable of displaying multiple fonts or even boldface, let alone kerning and the like. <br> <br>CSS is a style language. It's entire raison d'etre is to define the look of a page. One of the design goals was to make it device-independant, so that the same style language could be used to style a document intended for a PC screen, for print, for a cell phone, etc. It is interpreted by the client application (a web browser, most commonly), which then applies the rules it understands and ignores those it doesn't. <br> <br>Neither HTML nor CSS is responsible for rendering the output; that's the browser's job. As I understand it, browsers typically use OS-specific drawing routines to actually produce the page. Leastwise, that's the only way I can explain why Firebird gets OS X's system-wide anti-aliasing. <br><br>
      </p><blockquote>No, because the OS conveys kerns just fine - how else would Word be able to use them?</blockquote><p></p>
      <p> Does Word display kerns in online text? I honestly don't know. I just know that on OS X at least, Word text is by far worse than text in Safari, Firebird, Flash, Acrobat, Illustrator...just about anything other than FreeHand with antialiasing turned off (which is hands-down the worst of all). If it does display kerns, you'd never know it. The text is <i>that</i> bad. <br> <br>It would actually surprise me if IE/Win didn't display kerns but Word did (my Win2K version of IE displays old-skool aliased text), as I'd expect them to use the same library for rendering text given how intertwined with the OS both are. <br> <br>To be perfectly honest, I'm not exactly sure how all the interaction between a font, an app and the OS plays out; that's a bit lower-level than I typically go. I do know that neither HTML nor CSS was ever intended to get quite down to that level</p>
