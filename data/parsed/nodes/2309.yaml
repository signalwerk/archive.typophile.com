    html: <p>OK ... Awesome responses! Thanks all. <br> <br>First, Hrant, about Flash. We want to avoid it for content. We are cool using it for some simple navagation, but we want to keep the site content in HTML to make it easy to search and easy to update. <br> <br>Second, as to the designer I am working with - well he is prez of our studio and cut his teeth in print. I agree that he should just get over the control issue, but with everything, life is never that simple. I am moving him toward the right mindset for this project, but I can't just make demands here. Sigh. <br> <br>I think WEFT is a cool idea, but not worth the effort. If we still have to account for variations in text we might as well just go simple and worry about other aspects of the site.</p>
