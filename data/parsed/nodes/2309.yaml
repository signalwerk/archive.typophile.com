    html: "<p>setmajer, it's great to see you've put a lot of thought into this stuff. <br> <br>&gt; Flash's rendering of small text is notably inferior to OS X's native rendering <br> <br>Not really. Flash can render the highest form of text (handmade grayscale bitmaps) more reliably than MacOS (and even Windows) can. Flash also has the advantage of allowing kerning - very important for onscreen readability (and legibility). HTML doesn't kern (does it)? The grayscale bitmap font I'm finishing up has over 600 pairs just within the alphabetics (although only about 10% are likely to show up in normal text), and it's only a sans! <br> <br>I'm not saying Flash is ready for prime-time in terms of extended reading, but I do think (not least by observing the wanton behavior of the OS/app makers) that it has more <i>potential</i> than HTML. <br> <br>&gt; improving online reading would be better focused on a base of HTML <br> <br>The main problem with that is that with HTML you're relying on the OS, and neither of the two major OSes (if you can call 5% market share \"major\"...) can deliver handmade grayscale bitmap fonts as well as Flash. They just don't care enough. <br> <br>&gt; I've never once gotten a call from an irate CEO .... <br> <br>Ah, but you've also not gotten calls from clients who decided never to contact you in the first place. That's my point. Flash enables a level of <i>design</i> greater than HTML (elbeit flawed in some [important] ways), and that helps justify your existence as a designer. <br> <br>&gt;  which is going to do more to increase material wealth: spending .... <br> <br>And by the same logic: Which saves more money, hiring a designer or doing it yourself? <br> <br>&gt; how does serving unstyled pages to everyone not using IE/WIn maximize 'cultural benefit'? <br> <br>Design is the artful balance of compromises. <br>Trying to make everbody equally happy just makes everybody more miserable. <br> <br>&gt; If playing to the strengths of the medium is somehow 'fundamentalist', <br>&gt; then pass the bible 'cause I'm in a thumpin' mood. <br> <br>But if it means ignoring its weaknesses, and trying to achieve some sort of \"purity\", then that's not design, that's art. My approach is getting to the destination in that jalopy as fast as possible without taking undue risks. Tellingly, my actual car is an '87 BMW. <br> <br>&gt; CSS <br> <br>That's just code representing a de facto a two-tier system. <br> <br>hhp <br></p>"
