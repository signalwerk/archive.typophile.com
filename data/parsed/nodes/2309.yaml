    html: "<p>Just a quick update on font extraction from EOT: <br>After some asking around and some actual testing, it seems that it's not at all trivial to swipe fonts from an EOT page. Although the fonts are indeed saved as individual files in the browser's cache, there's no obvious way of making them work as fonts on their own. I guess it's possible to decipher (or swipe) the encryption MS seems to be using on the font files, and provide a utility to bring them back to TT (or PS), but I don't see anybody going to that trouble. Fonts are much easier to swipe otherwise. <br> <br>hhp <br></p>"
    html_clean: "<p>Just a quick update on font extraction from EOT: <br>After some asking around and some actual testing, it seems that it's not at all trivial to swipe fonts from an EOT page. Although the fonts are indeed saved as individual files in the browser's cache, there's no obvious way of making them work as fonts on their own. I guess it's possible to decipher (or swipe) the encryption MS seems to be using on the font files, and provide a utility to bring them back to TT (or PS), but I don't see anybody going to that trouble. Fonts are much easier to swipe otherwise. <br> <br>hhp <br></p>"
