    html: "<p>&gt;&gt;It's not that hard to get a site working cross-platform nowadays as it used to be, say, 2 or 3 years ago <br> <br>I agree that this is true as a rule of thumb, and in practice, as its usually possible to get clients to avoid problematic features when they find out how much it costs to get compatibility on some issues. But I think that its largely because people have more idea now that they can't have everything they want and still have 100% compatibility without paying a small fortune.* <br>About 4 or 5 years ago I wroe a cross plaform function library for DHTML  - it was a learning experience as much as anything, which is fortunate, because not long after that new releases of Netscape and IE made it redundant. I wouldn't even consider doing such a thing now - at least not for less than a medium size fortune... <br> <br> <br>*Pop quiz: What's the quickest and easiest way to make a small fortune?</p>"
