    html: "<p>One big problem I've found with WEFT (other than the fact that it won't work on anything other than IE) is that, even if you have ClearType turned on, the embedded type won't anti-alias, which looks like crap most of the time. <br> <br>Nathan: you could always move the styles in the .html to a .css file and then call it depending on the user's browser. And font tags are deprecated anyways - there's simply no need to use them anymore.</p>"
