    html: <p>&gt;&gt;I understand and accept it, but the designer that I am working with to create our site feels funny about not controling certain aspects of the user's interface, such as the type choice and treatment.  <br> <br>Either your designer needs to learn to adapt to the context, or you need to find a web designer to design for the web. <br> <br> <br> <br>&gt;&gt;One of the things I do not like about WEFt is that it is not cross platform or cross browser. So, even though you may be able to control the type on PC's using IE, you still ahve to account for NS and Mac's and thus you are back to the basic considerations with web design that you are trying to eliminate.  <br> <br>Yep, so either you can detect OS &amp; browser or do what you would do if it were up to you... <br> <br>&gt;&gt;If it were up to me I would spec Ariel and move on ...  <br> <br>Me too! <br> <br> <br>&gt;&gt;So you're saying if it's not Explorer on Windows, a page using WEFT (EOT) simply bombs?  <br>Isn't there a way to have a fallback mechanism?  <br> <br>Yep, - detect browser version &amp; OS <br> <br> <br> <br> <br>&gt;&gt;I still think, though, that WEFT will only be ready for prime time once it works under Mozilla <br> <br>Its years since I met a client who thinks that's worth the expense (and they only think that its worth worrying about Mac support if the site is aimed at designers, dtp community or journalists). <br>Non IE browsers account for around 6% now, and Macs are way behind that - people can't see the point of going to great expense to accomodate such minorities. <br> <br>Offer a client a choice between <br>a) Spending lots of money maintaining typographic integrity while accomodating 100% of potential users <br>b) Blocking off fewer than 10% of users and saving loads of money <br> <br>or <br> <br>c) Compromising typographic integrity to get a site that everyone can use without spending a fortune. <br> <br>In my experience C beats B almost all of the time  - if any client ever goes for A, I'll let you know.</p>
