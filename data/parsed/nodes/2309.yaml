    html: "<p>&gt; This WEFT tutorial site renders nice and smooth for me <br> <br>On my end it renders smooth when CT is turned on, but 1-bit when CT is off. I wonder if it's a GASP issue, since the larger Times text in the boxes does render smooth no matter if CT is on or off. <br> <br>If the issue is the GASP settings, then it's really a matter of making sure the font is hinted well if you're using the range of sizes where smoothing is off (assuming CT is off). So it's not the technology's fault, more like a combined limtation of the hinting in a given font design and the font rendering algorithm in Windows (which is however the best out there, except maybe the Kaasila stuff). <br> <br>I need to do more testing. <br> <br>BTW, what do you guys know about security: how easy it is to extract a font from an EOT/WEFT page? Is it like PDF, harder, or easier? <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; This WEFT tutorial site renders nice and smooth for me <br> <br>On my end it renders smooth when CT is turned on, but 1-bit when CT is off. I wonder if it's a GASP issue, since the larger Times text in the boxes does render smooth no matter if CT is on or off. <br> <br>If the issue is the GASP settings, then it's really a matter of making sure the font is hinted well if you're using the range of sizes where smoothing is off (assuming CT is off). So it's not the technology's fault, more like a combined limtation of the hinting in a given font design and the font rendering algorithm in Windows (which is however the best out there, except maybe the Kaasila stuff). <br> <br>I need to do more testing. <br> <br>BTW, what do you guys know about security: how easy it is to extract a font from an EOT/WEFT page? Is it like PDF, harder, or easier? <br> <br>hhp <br></p>"
