    html: "<p>&gt;&gt;Either your designer needs to learn to adapt to the context, or you need to find a web designer to design for the web. <br> <br> <br>Couldn't agree more. The wish to \"control\" what people see on the internet is - at best - outdated, naive and quaintly megalomaniac, however it also betrays a serious misconception of the medium that is being designed for. In short: You can't control it and neither can I, so get over it and move on, before more valuable resources are wasted on solving the unsolvable. <br> <br>The web is about the exchange of information, period. It is currently not a very suitable medium for the display of typographic integrity, whether that suits any of us or not (and yes, of course I *do* agree that current options for web typography are lamentable, limited and unsatisfactory, ). <br> <br>Flash, while fun and (typo-)graphically more fulfilling than HTML, suffers from serious usability problems, not the least of which is the failure of SearchEngines to index Flash content in a satisfactory manner, so if that is important to you, you may have to settle for Arial after all. Of course you could go out on a limb and use Verdana instead... <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
