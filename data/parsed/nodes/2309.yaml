    date: 2003-12-05T13:55:00
    date_raw: 5 Dec 2003 — 1:55pm
    votes: null
    html: <p>I haven't really put much work into making my site function - I'm hoping over winter break I'll have time - but I'm not sure how I'll work around it. I'm also an idiot when it comes to coding. This site is the only site I've coded, and I taught myself everything I know about CSS, HTML, and JavaScript. Which is not much. But... <br> <br>I thought I could call up different CSS based on the OS/browser of my user. But WEFT writes the style declarations for font substitutions in the .html documents themselves - not the CSS. So I don't think using different style sheets will work. <br> <br>The release notes for WEFT say that the font tag doesn't work in MacIE4.5, but CSS declarations do. I tried the work around suggested in the release notes, but could never get it to work. <br> <br>Like I said though, I've done very little in the way of fixing anything. But I've never once seen the text on my site on a Mac. And I had mucho problemo with Netscape Navigator. <br> <br>Sorry this doesn't help much.</p>
