    html: <p>"Isn't there a way to have a fallback mechanism? <br>Yep, - detect browser version &amp; OS" <br> <br>Browser/OS detection is asking for trouble, usually. There are so many browsers today that unless you really take care to fully test your script in all the browsers and be sure to keep it up to date to reflect changes in all the browsers, you'll block a chunk of people from seeing your site. <br> <br>There are still plenty of badly built sites out there that still assume the only two browsers are IE5 and NN4. Ugh. <br> <br>The best advice for designing for the web is to realize that the most you can is 'suggest' a visual presentation. You can't/shouldn't mandate it. <br> <br>But don't spec arial. yech. ;o) <br> <br>GlyphGate, I think, is just a browser detection system that then throws out embedded faces if it can. A lot of money for little benefit, IMHO.</p>
    html_clean: <p>"Isn't there a way to have a fallback mechanism? <br>Yep, - detect browser version &amp; OS" <br> <br>Browser/OS detection is asking for trouble, usually. There are so many browsers today that unless you really take care to fully test your script in all the browsers and be sure to keep it up to date to reflect changes in all the browsers, you'll block a chunk of people from seeing your site. <br> <br>There are still plenty of badly built sites out there that still assume the only two browsers are IE5 and NN4. Ugh. <br> <br>The best advice for designing for the web is to realize that the most you can is 'suggest' a visual presentation. You can't/shouldn't mandate it. <br> <br>But don't spec arial. yech. ;o) <br> <br>GlyphGate, I think, is just a browser detection system that then throws out embedded faces if it can. A lot of money for little benefit, IMHO.</p>
