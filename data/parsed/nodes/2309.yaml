    html: <p>Erm, I'm no web guru - in fact I know little to nothing obviously - but WEFT didn't work so well for me. That is, it works fine if your end user is on a PC with Explorer 5 or above, but not at all if they're on a Mac.  <br> <br>Feel free to check out {<a href="http://www.eightyproof.com" target="_blank">www.eightyproof.com</a>, my site} &amp; see the atrocity. On a Mac <i>none</i> of the text shows up. Though it looks fine on every PC I've seen it on.  <br> <br>My apologies if your screen resolution is above 1024 x 768. Joe Clark would probably hunt me down if he ever saw such a thing.</p>
