    html: "<p>&gt;&gt;Actually, the great expense is IE/Windows...which is the most buggy in terms of supporting web standards.  <br> <br>Well, I think that's a highly dubious statement anyway given Netscape's buggines in terms of actually working ;) <br>Most clients are interested in 'cost per head' <br> <br>&gt;&gt;That said, there isn't really any expense involved. A competent developer with an understanding of web standards can design for a variety of platforms/browser at once.  <br> <br>But that still takes longer than developing for just one browser, and testing is a much longer process. Unless you want to stick to really basic stuff (which is a good strategy, but one many clients don't want to know about). This is what I've said in the post above - you might have missed it, as your post was only a few minutes later. <br> <br> <br>================== <br>================== <br> <br> <br>Spouteth setmajer: <br>That's quite a swing--Google claims twice the proportion of Mac users  <br> <br>Hey, so the real figure could be as much as even maybe 4 or 6% at a push. I can't imagine any client not wanting to throw money at that market sector. <br> <br> <br>&gt;&gt;Historically, Mac users have skewed more educated, more affluent and more willing to purchase online than Windows users <br> <br>Hmmm, interesting. You would know this from some other, more reliable type of statistic, then? <br> <br>&gt;&gt;So although Mac users make up only a tiny fraction of the total audience, they may make up a much larger portion of the audience that will actually buy whatever it is you are selling. <br> <br>Well there are a few assumptions there. <br>1. That your stats are right in a general sense. <br>2. That I, or my client, has something for sale. <br>3. That Mac users are the kind of people that want my clients product. Now I really don't want to get into a Mac vs PC fight, but both sides in that argument suggest that Mac users compared to PC users represent different groups with different approaches to buying. Which group presents the best pickings for a given client depends on many things, not least the product range and its target audience. <br>(Alternatively, one could argue that Mac users are not significantly different to PC users in a personality or lifestyle or buying habits sense, (and in fact are often the same people) but that still puts this part of the argument out of the window). <br> <br>You suggest that: <br>'they may make up a much larger portion of the audience that will actually buy whatever it is you are selling' <br> <br>Are you sure? <br>I'm not sure what you mean by 'much larger', but it seems unlikely that a group which consists of roughly 3% of the total is going to contribute a 'much larger' contingent in any subset - unless I'm selling Mac software of course. <br> <br>&gt;&gt;but it is entirely possible that users of minority browsers may likewise be more desirable than their sheer numbers indicate <br> <br>Yes, that's entirely possible, but in order to justify more than nominal extra expense, these groups would either have to be much larger than they are now, or very, very much more desirable users for a given client - and this would have to be demonstrable. <br> <br></p>"
