of HTML. <br> <br>&gt; .... one site, properly built .... <br> <br>A properly built site takes as much advantage of the differences in user setups as budget allows. <br> <br>&gt; CSS doesn't do that at all. <br> <br>Then it's not enough, at least not all of the time. <br> <br>hhp <br></p>
