      <blockquote><p>confessed <b>Refusenik</b>: <br>OTOH I must admit that deep down I am pleased to see that there actually are some companies (well, one) out there devoting time, resources and money to the issue of web typography. Let's face it: it can only improve from where it stands right now.</p></blockquote>
      <p> On some level I agree, but the approach is terribly disheartening: a complex and expensive server-side application. I also have philosophical problems with MS regarding product activation and the like, not to mention security, but that's another can 'o worms. <br><br>
      </p><blockquote>confessed <b>Refusenik</b>: <br>Hands up all those who wouldn't love to use a different font on a web page in their lifetime. ;)</blockquote><p></p>
      <p>Me.sit('on=hands'); <br> <br><br>
      </p><blockquote>revealed <b>Adriano Santi </b>: <br>Actually, I tested their example pages with Firebird (Mozilla engine/Win32) and it popped up a dialogue asking me to install a plug-in. I chose not to install it and the text was then set in Times New Roman.</blockquote><p></p>
      <p> Interesting, as I'm using Firebird on OS X and got the following: <br><br>
      </p><blockquote>You are using a web browser that is unknown to this web server (it's identified as Mozilla/5.0 (Macintosh; U; PPC Mac OS X Mach-O; en-US; rv:1.5) Gecko/20031026 Firebird/0.7), so these web pages may not look correct.</blockquote><p></p>
      <p> I can't really blame them, though, as Firebird has not yet hit final-release status. I can't say as I'd be terribly anxious to go chasing after beta-status browsers myself. <br> <br>On Safari, I get the first page of the demo in all its glory, but with the 'GlyphGate Demo Pages', 'Welcome to the GlyphGate demo Pages!' and other text set as images</p>
