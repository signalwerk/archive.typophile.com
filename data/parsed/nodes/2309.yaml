    html: <p>"Non IE browsers account for around 6% now, and Macs are way behind that - people can't see the point of going to great expense to accomodate such minorities." <br> <br>Actually, the great expense is IE/Windows...which is the most buggy in terms of supporting web standards. <br> <br>That said, there isn't really any expense involved. A competent developer with an understanding of web standards can design for a variety of platforms/browser at once.  <br> <br>Nothing pisses me off more (well, in terms of the web, at least) than idiots that develop web sites or web applications that REQUIRE IE on a PC. That's *not* a web application. That's an IE/PC application. At that point, why bother with the browser? Just make your own thin client.  <br> <br>Our company uses something called Netilla to allow users outide our network to dial-in through the firewall and acecss their files. Netilla is Java based. It requires Mozilla to use. Great! Cross platform! Well, the idiots built the Java applet using MS's Java IDE. Which, like IE, is non-standard and proprietary. Crap like that is just way too common. <br> <br>And let's not forget there are other platforms than Macs and Windows...some growing slowly but surely (WalMart sells Linux computers...many people are using their Palm OS Phone...etc.) <br> <br> <br></p>
