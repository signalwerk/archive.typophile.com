    html: <p>&gt; So it just sets your text as images in Mozilla, Safari, Netscape 6 (the 'Navigator' name only applies to Netscape versions prior to 6) et al. <br> <br>Actually, I tested their example pages with Firebird (Mozilla engine/Win32) and it popped up a dialogue asking me to install a plug-in. I chose not to install it and the text was then set in Times New Roman. <br>On IE, it doesn't ask for a plug-in installation (I don't know whether it installed without my consent, which it shouldn't have, or if it simply works without a plug-in), the text was set in Franklin Gothic Condensed, as they claim, and it's just plain text - no images - but I had ClearType on and there was a clear difference between the GlyphGate text and the other text on the page, which was set in Arial. The GlyphGate type wasn't antialiased, even though ClearType was turned on.</p>
