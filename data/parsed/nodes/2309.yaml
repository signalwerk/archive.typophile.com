    votes: null
    html: |-
      <blockquote><p>sniped <b>Hrant H Papazian</b>: <br>So is hiring a designer. Just do it in-house! :-/</p></blockquote>
      <p> <br>In 7+ years of web development I've never once gotten a call from an irate CEO at 11 p.m. on a Friday night saying a designer was preventing his mother-in-law from accessing the site with her iMac.  I cannot say the same for browser-sniffing widgets. <br> <br>Perhaps you know a different sort of designer. <br><br>
      </p><blockquote>As far as our clients ar concerned, the "fundamental purpose of the medium" is to make more money, so "good design" is merely what increases material wealth.</blockquote><p></p>
      <p> Very good. Now, which is going to do more to increase material wealth: spending $X on browser testing to see that 3-8% more visitors get the branding, UI, etc. rather than a circa-1995 grey background'n'Times mess or spending $X on a two-tier system to ensure that IE/Win users get to see 12px-on-14px Bookman Old Style instead of 1em-on-1.2em Georgia? And what of the X% of Win/IE users who can't read that 12px-high text because they're near sighted? Or the Y% who decide to override your font choices just because they feel like it? Or the Z% of IE/Win users who have the contents of the page read to them via a screen reader and don't see that lovely type anyway (and won't get anything at all without non-trivial extra effort/expense if you're using Flash)? <br><br>
      </p><blockquote>To me though it's about maximizing the cultural benefit of a tool, with a pragmatic -not a fundamentalist- mentality as to how to achieve that.</blockquote><p></p>
      <p> And how does serving unstyled pages to everyone not using IE/WIn maximize 'cultural benefit'? <br> <br>If playing to the strengths of the medium is somehow 'fundamentalist', then pass the bible 'cause I'm in a thumpin' mood. <br> <br>Your approach is rather like trying to turn a pickup truck into a sports car. Yeah, you can hop up the motor, rework the suspension, add new breaks, wheels and tires...hell, you could slap the pickup body on a Corvette chassis if you like (I've seen it done), but at the end of the day what you have is a hopped-up pickup that will get spanked by a cheaper off-the-showroom-floor 'Vette at the racetrack and is far worse at hauling cargo, towing trailers or driving offroad than it was to start with. If what you want is a vehicle for hauling cargo that also has good road manners, you buy a BMW or Volvo station wagon. Maybe it won't quite run with the hotrod truck or the 'Vette, but it's cheaper and more utilitarian, not to mention more economical to own and maintain. <br> <br>Flash is the 'Vette, your two-tier solution is the hotrod truck and a browser-tested CSS solution is the wagon. <br> <br>Thing is, if you bother to learn CSS et all well, you can get 90%+ of the nifty presentation you would from your two-tier system out of a one-tier system that will be easier to maintain and expand, quicker to download, and more accessible to a wider audience to boot. <br> <br>Sounds pretty pragmatic to me. <br> <br></p>
