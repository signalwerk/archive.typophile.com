      <blockquote><p>queried <b>steve</b>: <br>Hmmm, interesting. You would know this from some other, more reliable type of statistic, then?</p></blockquote>
      <p> It was a Gartner or Forrester press release from about a year ago. I'm not finding the link just now. I can't vouch for their methodology as I didn't purchase the whole report, but generally they survey a scientifically-selected sample. Selecting the sample for statistical validity is itself an improvement over the typical general-interest web stats, which are usually compiled by a web log analysis outsourcing firm based on users visiting their client's sites. Those users may or may not be representative of the web as a whole. <br><br>
      </p><blockquote>qualified <b>steve</b>: <br>Well there are a few assumptions there. <br>1. That your stats are right in a general sense.</blockquote><p></p>
      <p> I have <i>slightly</i> more confidence in the Mac user demographics than I do in general Web stats because the latter are known to be flawed (see <a href="http://www.macedition.com/cb/cb_20011231.php">this <i>MacEdition</i> article</a> for one example). <br><br>
      </p><blockquote>2. That I, or my client, has something for sale.</blockquote><p></p>
      <p> I don't know very many clients who don't. :-) <br> <br>The big exceptions would be publication sites, which as I said tend to take an 'every last eyeball counts' approach, and government/education sites. In the U.S., U.K. and Germany, at least, the latter are covered by accessiblity laws that make the whole discussion moot. <br><br>
      </p><blockquote>3. That Mac users are the kind of people that want my clients product.</blockquote><p></p>
      <p> Yes, which is why I used 'may' rather than 'are'. :-) <br><br>
      </p><blockquote>I'm not sure what you mean by 'much larger', but it seems unlikely that a group which consists of roughly 3% of the total is going to contribute a 'much larger' contingent in any subset - unless I'm selling Mac software of course.</blockquote><p></p>
      <p> Well...say the Mac users account for just 6% of potential customers (those who would buy if they could). 6% doesn't sound like much, but boosting sales by 6% isn't something most companies would sneeze at. Wall Street tends to like that sort of growth, anyway, particularly when it comes with relatively little expenditure. <br> <br>Remember that web site construction is typically a relatively small percentage of a company's costs. Even for an outfit like Amazon, which has no bricks-and-mortar stores, the biggest costs for them are inventory, shipping and so on, not the construction of the site itself. <br> <br>Besides, what does being IE-only <i>really</i> get you in most cases? Some whizzy DHTML or other? Prettier text? Is there any research indicating that those things will add even 3% to total sales? Most of the big gains come from improving navigation, reducing page load time and the like</p>
