      <blockquote><p> clarified <b>steve paxton</b>: <br>I didn't really mean crashing, I was referring to the way Netscape browsers deal with DHTML.</p></blockquote>
      <p> NN4.x wasn't <i>that</i> bad, so far as it went. It's DOM just wasn't as powerful as the MS or W3C DOM. <br> <br>NS6+, OTOH, does very well with the W3C DOM, and IE 5+ Mac/Win isn't too shabby there either. There are sore spots, of course. IE doesn't implement the W3C's event model, for example, and NS's animation speed has been an achilles heel, though it has improved markedly in the last few revs. <br> <br>It really depends on what you're doing. <br> <br></p>
