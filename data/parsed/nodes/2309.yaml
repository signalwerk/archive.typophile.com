      <blockquote><p>asserted <b>Hrant H Papazian</b>: <br>Sure it costs more to do a two-tier solution*, and usually the expense is hard to justify, but I think it's not any harder than justifying good design in the first place.</p></blockquote>
      <p> Except the cost of a two-tier solution is deceptively high. It isn't just initial construction that is more expensive, it's maintenance too.  <br> <br>Even assuming the content is stored in a database and combined with templates at request- or publish-time, every time you want to redesign something on the site, add some new functionality or alter the structure (adding a new section/subsection, for example) you've got to do it twice. You've also got twice as much (OK, probably more like 140-170% as much, but still) code where things can go wrong.  <br> <br>You're also setting up a false dichotomy here: neither IE/Win nor  'everything else' is monolithic. IE 5 &lt;&gt; IE 5.5 &lt;&gt; IE 6. They're closer in many respects than, say, IE 5/Win and IE 5/Mac, but the differences are still significant enough to warrant testing. So you're testing regardless. Likewise, 'everything else' includes everything from Mozilla to PocketIE on a cell phone. Those browsers have vastly different capabilities. Either you need to serve them straight-up HTML 2.0 (no tables, no CSS, no JavaScript, etc.) or you're back to testing and 'progressive enhancement' again. <br> <br>And then, of course, there's the question of what, exactly, is 'good design' in the first place. Is it really 'good' to take an approach contrary to the fundamental purpose of the medium (non-discriminatory access to information)? <br><br>
      </p><blockquote>analogized <b>Hrant</b>: <br>The web is like a pet: you can't control it totally, but you can train it a lot with the right pragmatic and "humane" attitude - you don't have to let it run wild.</blockquote><p></p>
      <p> I disagree slightly: the web is more like a child than a pet; you can <i>try</i> to instill the right values in it, but in the end it leaves you and goes into the broader word where it is entirely beyond your conrol. <br> <br>Remember how the web works: when you go to a site, you aren't looking at something that lives somewhere else, you're looking at a copy of that something that has been made on your local HD, complete with source code. Once that copy hits the user's browser, all bets are off. They can resize the text. They can zoom the whole page. They can turn off JavaScript, plugins, images and CSS. They can even gasp use their <i>own</i> stylesheets with 18px/18px Comic Sans if they so choose. <br> <br>As a wise man once said "the control you have is proportional to the control you relinquish." <br> <br>Indeed. <br> <br></p>
    html_clean: |-
      <blockquote><p>asserted <b>Hrant H Papazian</b>: <br>Sure it costs more to do a two-tier solution*, and usually the expense is hard to justify, but I think it's not any harder than justifying good design in the first place.</p></blockquote>
      <p> Except the cost of a two-tier solution is deceptively high. It isn't just initial construction that is more expensive, it's maintenance too.  <br> <br>Even assuming the content is stored in a database and combined with templates at request- or publish-time, every time you want to redesign something on the site, add some new functionality or alter the structure (adding a new section/subsection, for example) you've got to do it twice. You've also got twice as much (OK, probably more like 140-170% as much, but still) code where things can go wrong.  <br> <br>You're also setting up a false dichotomy here: neither IE/Win nor  'everything else' is monolithic. IE 5 &lt;&gt; IE 5.5 &lt;&gt; IE 6. They're closer in many respects than, say, IE 5/Win and IE 5/Mac, but the differences are still significant enough to warrant testing. So you're testing regardless. Likewise, 'everything else' includes everything from Mozilla to PocketIE on a cell phone. Those browsers have vastly different capabilities. Either you need to serve them straight-up HTML 2.0 (no tables, no CSS, no JavaScript, etc.) or you're back to testing and 'progressive enhancement' again. <br> <br>And then, of course, there's the question of what, exactly, is 'good design' in the first place. Is it really 'good' to take an approach contrary to the fundamental purpose of the medium (non-discriminatory access to information)? <br><br>
      </p><blockquote>analogized <b>Hrant</b>: <br>The web is like a pet: you can't control it totally, but you can train it a lot with the right pragmatic and "humane" attitude - you don't have to let it run wild.</blockquote><p></p>
      <p> I disagree slightly: the web is more like a child than a pet; you can <i>try</i> to instill the right values in it, but in the end it leaves you and goes into the broader word where it is entirely beyond your conrol. <br> <br>Remember how the web works: when you go to a site, you aren't looking at something that lives somewhere else, you're looking at a copy of that something that has been made on your local HD, complete with source code. Once that copy hits the user's browser, all bets are off. They can resize the text. They can zoom the whole page. They can turn off JavaScript, plugins, images and CSS. They can even gasp use their <i>own</i> stylesheets with 18px/18px Comic Sans if they so choose. <br> <br>As a wise man once said "the control you have is proportional to the control you relinquish." <br> <br>Indeed. <br> <br></p>
