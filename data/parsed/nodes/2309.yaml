    html: <p>Thanks Hrant, <br> <br>I did do all the reading on the site. It was informative ... but I am a little cynical, as MS is the Great Satan. I was hoping some here have had some experience with WEFT and would be willing to share. <br> <br>I saw an earlier thread that you took part in that talked about the ease of swiping embedded fonts. That would be a conscern. <br> <br>I think our problem is as a design studio that designs mainly for print we are having trouble thinking in terms of type variables that you get with the web. <br> <br>I understand and accept it, but the designer that I am working with to create our site feels funny about not controling certain aspects of the user's interface, such as the type choice and treatment. <br> <br>One of the things I do not like about WEFt is that it is not cross platform or cross browser. So, even though you may be able to control the type on PC's using IE, you still ahve to account for NS and Mac's and thus you are back to the basic considerations with web design that you are trying to eliminate. <br> <br>Does not seem worth it, really. If it were up to me I would spec Ariel and move on ... <br> <br>;)</p>
    html_clean: <p>Thanks Hrant, <br> <br>I did do all the reading on the site. It was informative ... but I am a little cynical, as MS is the Great Satan. I was hoping some here have had some experience with WEFT and would be willing to share. <br> <br>I saw an earlier thread that you took part in that talked about the ease of swiping embedded fonts. That would be a conscern. <br> <br>I think our problem is as a design studio that designs mainly for print we are having trouble thinking in terms of type variables that you get with the web. <br> <br>I understand and accept it, but the designer that I am working with to create our site feels funny about not controling certain aspects of the user's interface, such as the type choice and treatment. <br> <br>One of the things I do not like about WEFt is that it is not cross platform or cross browser. So, even though you may be able to control the type on PC's using IE, you still ahve to account for NS and Mac's and thus you are back to the basic considerations with web design that you are trying to eliminate. <br> <br>Does not seem worth it, really. If it were up to me I would spec Ariel and move on ... <br> <br>;)</p>
