      <blockquote><p> quoth <b>Hrant</b>: <br>What about using Flash?</p></blockquote>
      <p>If your site has more than very short snippets of text, please don't. Flash is lovely for animation, getting better for GUI development and can be just the ticket for rendering vector artwork. It is, however, an abominable means of displaying even modest amounts of text.  <br> <br>Any advantages Flash lends in terms of aesthetics (and at text sizes there are few) are overbalanced by loss of convenience unless you go to the trouble of ensuring that scroll wheels, keyboard accelerators and the like all work in your movie--something I have not seen done. I recently read through the Flash-based tutorials on this site and the experience was not pleasant. The type was too small for comfort on my screen (17" LCD at 1280 x 1024) and could not be adjusted, the antialiasing was appallingly bad, the lack of a history function (back/forward buttons) was frustrating and rendering speed was markedly inferior to HTML. <br> <br>Flash design (which is image-centric) should not be confused with web design (which is text-centric). The two aren't identical, nor even all that close in many respects. <br> <br><br>
      </p><blockquote> sayeth <b>steve paxton</b>: <br>Non IE browsers account for around 6% now, and Macs are way behind that - people can't see the point of going to great expense to accomodate such minorities.</blockquote><p></p>
      <p>I'd be a bit leery of drawing an serious conclusions based on general statistics. As one example, the <a href="http://www.google.com/press/zeitgeist.html"> Google Zeitgeist</a> puts MacOS at 3% of web share while <a href="http://www.onestat.com/html/aboutus_pressbox24.html"> OneStat</a> puts it at 1.49% and <a href="http://www.thecounter.com/stats/2003/May/os.php"> TheCounter</a> splits the difference at 2%. That's quite a swing--Google claims twice the proportion of Mac users that StatMarket does. <a href="http://www.upsdell.com/BrowserNews/stat.htm#source2"> Upsdell's Browser News</a> demonstrates nicely just how radically browser share can vary from site to site and also explains why statistics purporting to reflect the entire web audience should be taken with a grain of salt.  <br> <br>In addition, strict market share does not tell the entire story. Historically, Mac users have skewed more educated, more affluent and more willing to purchase online than Windows users. So although Mac users make up only a tiny fraction of the total audience, they may make up a much larger portion of the audience that will actually buy whatever it is you are selling. To my knowledge, there is no research on the demographics of browser users, but it is entirely possible that users of minority browsers may likewise be more desirable than their sheer numbers indicate. <br> <br>There are really just too many factors involved for general stats like these to be taken too seriously. <br> <br>Besides, IE as a standalone browser is dead. MS has gone on record saying that no further standalone versions will be released for Windows or Mac, and the primary driver of IE/Mac, Tantek </p>
