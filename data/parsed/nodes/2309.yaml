    html: <p>"Well, I think that's a highly dubious statement anyway given Netscape's buggines in terms of actually working ;)" <br> <br>Hmm...I have infinitely more problems with IE crashing my PC than any flavor of Netscape or Mozilla. <br> <br>"But that still takes longer than developing for just one browser, and testing is a much longer process." <br> <br>Well, sure. Just like printing 4 color is more work than black and white. It certainly isn't perfect, but the problem is Microsoft, not the rest of the browsers. Choosing to design for microsoft only is just encouraging their bad behavior. ;o) <br> <br>"Hey, so the real figure could be as much as even maybe 4 or 6% at a push. " <br> <br>Also consider that a lot of Mac users still have to use PCs at work. So that skews figures like that as well. You can't assume that all people are one-OS users. ;o) <br> <br>"Yes, that's entirely possible, but in order to justify more than nominal extra expense, these groups would either have to be much larger than they are now, or very, very much more desirable users for a given client - and this would have to be demonstrable." <br> <br>Do you charge your clients on a per-end-user rate? Again, if you're designing for IE/PC only, then you're not making a web site. You're making an IE/PC site.  <br> <br></p>
