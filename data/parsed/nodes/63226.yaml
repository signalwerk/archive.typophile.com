    <p>“The problem lies in ABC News’s adoption of the Arial font for its news scripts [a bad idea right there]. Arial makes no distinction between a capital <cite>I</cite> and a small <cite>l</cite>. So Kim Jong-Il does look exactly like Kim Jong the Second.”</p>
