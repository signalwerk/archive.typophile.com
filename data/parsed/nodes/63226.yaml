    <p>Australian radio <a href="http://www.abc.net.au/mediawatch/transcripts/s2711819.htm" title="‘MediaWatch’ segment">confuses <cite>I</cite> and <cite>l</cite></a> – <a href="http://www.slate.com/toolbar.aspx?action=print&amp;id=2194921" title="Coverage by –&nbsp;wait for it – Christopher Hitchens">something Jesse Helms used to do</a>. </p>
    <p>“The problem lies in ABC News’s adoption of the Arial font for its news scripts [a bad idea right there]. Arial makes no distinction between a capital <cite>I</cite> and a small <cite>l</cite>. So Kim Jong-Il does look exactly like Kim Jong the Second.”</p>
  html_clean: |-
