      <p>Si will keep in mind that every Windows user knows what Arial is; most think it’s “clean.” Some software defaults to its use. Si cannot seriously believe that more than a fraction of Windows users have enough knowledge to know what typefaces will harm them, as in the case of reading them aloud for an entire nation.</p>
      <p>Hence, a familiar font name way up high in an alphabetical list <em>will</em> get used more.</p>
      <p>—<br>
