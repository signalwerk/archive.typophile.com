  html: |-
    <p>We were getting a lot of Type ID requests in the the “Solved ID” and “FAQ” forums, so we killed 'em off and moved everything into the main Type ID board where they belong. We'll continue to focus on better ways to flag and sift through solved IDs in the future.</p>
    <p>A side benefit: This also removes all those extra Type ID rows that were appearing on the home page, so the Critique and SIG forums move up, appropriately.</p>
    <p>//jared</p>
