      <p>TypeTool is fine. Consider it as Studio light. Its advantage is that it allows you to concentrate on designing. And it generates OT fonts. Should you really need to add OT features, use the free <a href="http://www.adobe.com/devnet/opentype/afdko/" target="_blank" rel="nofollow">AFDKO</a>. But do not try to do everything at once. One step after the other. It is perhaps a bit early for a 'time gain' question.</p>
      <p>You might consider getting <a href="http://www.fontlab.com/font-converter/scanfont/" target="_blank" rel="nofollow">ScanFont</a> or <a href="http://www.high-logic.com/scanahand.html" target="_blank" rel="nofollow">Scanahand</a> (Windows only), allowing you to start from your own hand-made input rather than playing with outlines alone.</p>
