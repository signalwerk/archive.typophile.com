    html: |-
      <p>A font with 2 weights is a family. It's not a competition and the number of weights doesn't necessarily add up to more sales. Of my current best sellers, 4, 5, 6, 7, 8, 12 and 18 are single weights. Consider leaning toward display fonts while you're still learning. You'll have more creative freedom and you might need 1 or 2 weights, plus they're more fun to make. Above all: test print, make notes, fix, repeat. That's the part that most beginners miss and it's the most important thing.</p>
      <p>Why so many weights? Someday when you blend a black to an ultralight in Fontlab or whatever, you'll feel a little rush and you'll understand: it's an addiction.</p>
