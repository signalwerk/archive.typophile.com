      <p>Maybe it's easier in fontlab, but I find making more weights a long and quite job. "The number of weights doesn't necessarily add up to more sales." True, but I've heard of graphic designers that look how much megabyte a font is before even having a look. How stupid is that?! "It's not a competition" True, but some typedesigners try to make it a competition. "Above all: test print, make notes, fix, repeat. That's the part that most beginners miss and it's the most important thing." True. I've made two very ugly fonts before where I skipped the repeat part, but I've learned my lesson now. I've spend my holiday in Turkey without a laptop, making adjustments to some prints and sketching a new typeface idea. Two years ago I would have never done that.</p>
      <p>Thank you both for your help.</p>
