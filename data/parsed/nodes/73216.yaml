    <p>Hey everybody,</p>
    <p>I'm fourteen years old and I'm designing typefaces in TypeTool (You might have seen my expletus in the critique forum). Everywhere I look on Typophile I see Fontlab Studio, never TypeTool. I thought (and still think), that I can make a complete family in TypeTool, sell it, and actually make some money. (Don't worry I'm not expecting much.) TypeTool supports a very broad amount of languages (I could easily pass the 1000 glyphs if I wished to). Althoug the TypeTool table only has the 'fi' and 'fl' ligatures I found a way that allows me to make all the standard ligatures, such as ffj, in TypeTool. TypeTool's drawing tools are simple, but I think the quality of my work would go down if I used more automatic functions. For example, I make the different weights fully by hand. So my question is: Am I a fool to think I can make a succesful typeface in TypeTool? If not, then: How much time would I gain by using Fontlab Studio?</p>
    <p>Fontlab Studio costs way to much for a fourteen year old kid, so if the answer to my first question is 'yes', I might as well quit designing typefaces. :-( Any of you font-addicts know that's not really an option.</p>
    <p>thanks in advance,</p>
    <p>Jasper de Waard</p>
