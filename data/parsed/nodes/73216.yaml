    html: <p>I believe your right about the f, but here's the problem. With to many fonts on the market many designers don't look at a font if it doesn't have ligatures or less than 5 weights. I said "I could easily pass the 1000 glyphs if I wished to", which I don't. Don't you think it's worth to be called a typefamily if it has 'only' four weights? I don't think I'll ever make more than four weights (8 styles). To be honest I'm getting sick of this competition to make as many weights as possible. Four weights is MORE THAN ENOUGH! I think I'm going to start a new topic against this madness. Anybody with me?</p>
