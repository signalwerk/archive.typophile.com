    html: <p>If you design your f properly, you won't need ligatures at all. Ligatures are often just an affectation that impairs reading. Consider scaling back the scope of your project. You're lacking a decent kerning assistant or kerning classes. It's some thing you can overcome but to kern a family or 32 would be too much. Don't think you need to release a font all at once. You can start with 1-4 weights then expand the family later when your software/skills improve.</p>
    html_clean: <p>If you design your f properly, you won't need ligatures at all. Ligatures are often just an affectation that impairs reading. Consider scaling back the scope of your project. You're lacking a decent kerning assistant or kerning classes. It's some thing you can overcome but to kern a family or 32 would be too much. Don't think you need to release a font all at once. You can start with 1-4 weights then expand the family later when your software/skills improve.</p>
