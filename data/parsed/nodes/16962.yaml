      <p><cite>Letters of Credit</cite> by Walter Tracy<br>
      <cite>Anatomy of a Typeface</cite> by Alexander Lawson<br>
      <cite>The Elements of Typographic Style</cite> by Robert Bringhurst<br>
      <cite>Logo, Font, and Lettering Bible</cite> by Leslie Cabarga<br>
      <cite>Wordplay 2nd Edition</cite> by John Langdon</p>
      <p>I’ve got a lot of reading to do! Oh and for those wondering I’ve found no errors in my US printed version of Langdon’s second edition release of Wordplay. I did find one page with a few random bold letters, but the reproduction quality of his work is spot on. I did recieve some other small gifts, but it was just good for the family to be together as I had no real material wants this year besides the books!</p>
