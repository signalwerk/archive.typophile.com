    <p></p><div class="imageWrap"><img src="http://typophile.com/files/06_5921.jpg"></div><p></p>
    <p>TypeTogether is proud to announce the release of Etica, a strong yet delicate sans serif.</p>
    <p>Etica, the-moralist-typefamily-project, was born at the end of 2000, but its development is ongoing, overcoming many hurdles and diversions. On one hand, the original idea was spurred by a certain esteem for Helvetica, in particular, its strength and versatility, and on the other, an intolerance to its plenty but inadequate applications; created by those who erroneously consider it to be a neutral and timeless design.</p>
    <p>We believe that Helvetica is a beautiful typeface, but very deeply rooted in its own era. It is often unsuitably used in contexts that have changed profoundly since its birth. From this initial intention, we coined the ironic payoff ‘The-Moralist-Typeface’.</p>
    <p>The challenge was to obtain the same force, versatility and colour that are, from our point of view, Helvetica’s greatest qualities. The same proportions have been maintained, albeit with slightly reduced letter width. The resulting design has soft strokes, open counters and terminals; aesthetically resting somewhere between a grotesque and humanist sans serif. It successfully combines masculine force with female delicacy.</p>
    <p>Etica’s wide range of styles, together with a large character set and OpenType features, such as 4 sets of numerals,<br>
    fractions, several stylistic alternates and a set of arrows and dingbats, allows for a vast variety of applications, be they editorial or corporate.</p>
    <p><a href="http://www.type-together.com/Etica" title="http://www.type-together.com/Etica">http://www.type-together.com/Etica</a></p>
