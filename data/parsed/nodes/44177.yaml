    html: |-
      <p>Drop shadow detracts from a clean look, and is pretty passé by now. Most of the time it is best left out unless you need it to distinguish letters from the background. And you'll find that purist type aficionados will usually be against it because it presents the letters with unintended baggage.</p>
      <p>Personally, I'd take it off, and make the med. gray one shade darker to compensate.</p>
    html_clean: |-
      <p>Drop shadow detracts from a clean look, and is pretty passé by now. Most of the time it is best left out unless you need it to distinguish letters from the background. And you'll find that purist type aficionados will usually be against it because it presents the letters with unintended baggage.</p>
      <p>Personally, I'd take it off, and make the med. gray one shade darker to compensate.</p>
