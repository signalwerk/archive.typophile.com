      <p>Thank you, Ratbaggy, for this comment. I take your point about the purpose of the site being identified rather vaguely, and have made a change to the brief description in the header.</p>
      <p>As for the 'structure' of the site, as you will have seen, it <em>is</em> organised logically, and with navigation obvious, despite your comment here that it is '<em>confusing</em>'. The structure of the individual pages are, likewise, logical and with extra navigation as necessary.</p>
      <p>It is possible much of your objections arise through visiting the site under a Windows OS. Of this I am aware and, because this is a personal site, I am not particularly concerned to create a site which is rendered more-or-less similar under several OSs.</p>
