      <p>fontplayer, </p>
      <p>This 'logotype' looks far too 'tepid' without the drop shadow, as seen here  <a class="freelinking external" href="http://i126.photobucket.com/albums/p116/readred_2007/tepid_air.gif" rel="nofollow">http://i126.photobucket.com/albums/p116/readred_2007/tepid_air.gif</a>. Here, nothing has been changed, just the shadow removed.</p>
      <p>I have tried using a slightly darker grey, but I feel the shadow gives both colours a better degree of separation from the background without resorting to 'reflections', while still allowing lighter colours.</p>
      <p>I hear what you say about <em>unintended baggage</em> and '<em>fashion'</em>, but I don't pretend to be in the vanguard; I'm still struggling to catch up with the rearguard!</p>
