      <p>You posted this in the Logo critique section, so I was commenting on the 'logo' on the site. But the problems run much deeper. The 'type' used feels rigid, as does the structure of the information, it's all very tight and confusing in its structure.</p>
      <p>What's the site about, what's the meaning of tepid air in relation to the site, why the colour choice, who is your audience, what are you trying to communicate?</p>
      <p>... perhaps your approach is wrong.</p>
