  html: <p>We have a contract to prevent unauthorized access to certain fonts, and from what I've seen on this forum and other sites, it is possible for hackers or pirates to extract embedded font metrics from pdf files -- which would mean we couldn't distribute pdf's.  Assuming we want the folks that receive pdf's to be able to view and print them as designed -- is there a way to prevent such access, without locking down the whole pdf?</p>
  html_clean: <p>We have a contract to prevent unauthorized access to certain fonts, and from what I've seen on this forum and other sites, it is possible for hackers or pirates to extract embedded font metrics from pdf files -- which would mean we couldn't distribute pdf's.  Assuming we want the folks that receive pdf's to be able to view and print them as designed -- is there a way to prevent such access, without locking down the whole pdf?</p>
