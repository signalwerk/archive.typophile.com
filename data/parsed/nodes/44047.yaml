    <p>Hi everybody,</p>
    <p>I'm kind of stumped on a technical issue here, and was wodering if anybody could help.</p>
    <p>I'm trying to wrap up my first font, and it has some alternates, like so:</p>
    <p>feature calt {<br>
    	sub [fshort lshort] l' [b f h k l] by l;<br>
    	sub [fshort lshort] f' [b f h k l] by f;</p>
    <p>	sub l' [b f h k l] by lshort;<br>
    	sub f' [b f h k l] by fshort;</p>
    <p>} calt;		</p>
    <p>It also has some oldstyle numerals:</p>
    <p>feature onum {<br>
      sub zero by zero.onum;<br>
      sub one by one.onum;<br>
      sub two by two.onum;<br>
      sub three by three.onum;<br>
      sub four by four.onum;<br>
      sub five by five.onum;<br>
      sub six by six.onum;<br>
      sub seven by seven.onum;<br>
      sub eight by eight.onum;<br>
      sub nine by nine.onum;<br>
    } onum;</p>
    <p>When I test my font in Illustrator CS3 at home, it works file; I can use the OpenType panel to use my alternates, and when I select Proportional Oldstyle I get my oldstyle numerals.</p>
    <p>But, in Illustrator CS at work, the alternates button is disabled and selecting different figure options doesn't do anything.</p>
    <p>I'm using FontLab Studio 5.0.2 for Windows, if that's important.</p>
    <p>Any thoughts?</p>
