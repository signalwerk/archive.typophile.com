      <p>Well, if anybody's curious, I seem to have solved my alternation problem like this, after having discovered the existence of 'ignore' statements:</p>
      <p>feature calt {<br>
      	ignore substitute [l.short f.short] l' [b f h k l];</p>
      <p>	substitute l' [b f h k l] by l.short;<br>
      	substitute f' [b f h k l] by f.short;<br>
      } calt;</p>
      <p>Still no lock with Illustrator CS though.</p>
    html_clean: |-
