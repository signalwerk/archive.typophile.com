      <p>AFAIK, Illustrator CS and CS3 have essentially the same OpenType support. Mind you, there will have been some bugs fixed in there somewhere.</p>
      <p>I understand the net effect of the code, but the first two lines of substitutions take l and f and replace them with themselves. In any case, the latter two lines are completely adequate to achieve the desired effect if you just want the letter styles to alternate. If you wanted to get the shortened form to repeat, then you would need to chain the letters or write the code differently.</p>
      <p>Cheers,</p>
      <p>T</p>
