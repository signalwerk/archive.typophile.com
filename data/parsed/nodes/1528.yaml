    html: "<p>I am new to this list and have only one specific interest which concerns the 'long s'. I hope someone can help. <br> <br>\"1791: John Bell, U.K. printer, abandons the \"long s\" (the \"s\" that looks like an \"f\")\" <br>&gt; <br>&gt; I was interested in the spelling rules that existed at the time writers used the 'long s'. <br>&gt; I have been reading old documents from various archives and I have seen many examples of the 'long s'. <br> <br>&gt; Example: \". . . and to ship myfelf upon the firft Veffel or Ship . . .\" <br>&gt; <br>&gt; Can anyone refer me to any spelling rules that would explain when the 'f' was substituted for 's'. <br>&gt; <br>&gt; Lawrence C. Erwin, <br>&gt; Toronto</p>"
    html_clean: "<p>I am new to this list and have only one specific interest which concerns the 'long s'. I hope someone can help. <br> <br>\"1791: John Bell, U.K. printer, abandons the \"long s\" (the \"s\" that looks like an \"f\")\" <br>&gt; <br>&gt; I was interested in the spelling rules that existed at the time writers used the 'long s'. <br>&gt; I have been reading old documents from various archives and I have seen many examples of the 'long s'. <br> <br>&gt; Example: \". . . and to ship myfelf upon the firft Veffel or Ship . . .\" <br>&gt; <br>&gt; Can anyone refer me to any spelling rules that would explain when the 'f' was substituted for 's'. <br>&gt; <br>&gt; Lawrence C. Erwin, <br>&gt; Toronto</p>"
  - id: 12481
