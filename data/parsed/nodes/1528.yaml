    date: 2003-10-23T12:08:00
    date_raw: 23 Oct 2003 — 12:08pm
    votes: null
    html: "<p>The orthographic rules for long s vary from language to language. In English, the typical rule is as follows: <br> <br>long s : beginning of a word; mid-word; first s in a double <br> <br>short s : end of a word, second s in a double <br> <br>fo fend mifsals to fifters in fouth-eaft Afia</p>"
    html_clean: "<p>The orthographic rules for long s vary from language to language. In English, the typical rule is as follows: <br> <br>long s : beginning of a word; mid-word; first s in a double <br> <br>short s : end of a word, second s in a double <br> <br>fo fend mifsals to fifters in fouth-eaft Afia</p>"
