  - id: 12475
    user: 909
    date: 2003-10-09T10:06:00
    date_raw: 9 Oct 2003 — 10:06am
    votes: null
    html: "<p>Gerald: <br> <br>These are two separate questions. OpenType is capable of any arbitrary ligature a type designer cares to create. However, I don't know if Sabon has the f_j ligature. Some Adobe fonts have it, but far from all. <br> <br>Andreas: <br> <br>Sure, the long_s is a historic thing. So use the 'hist' feature if you like to get the glyph in there. But once you've got it in text, there's no need for a *special* ligature feature with it. Any long_s ligatures you either want on by default (liga), or off by default (dlig). <br> <br>Put another way, if every substitution feature were to need a separate corresponding ligature feature, we'd need an amazingly large number of ligature features. <br> <br>But luckily for us, features are cumulative. Whether it's swashes or small caps or historical forms, they can interact with the main ligature features (liga, dlig, clig) to create just about any combination effect needed. <br> <br>T</p>"
