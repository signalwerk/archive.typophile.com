  - id: 12469
    user: 1262
    date: 2003-10-08T21:31:00
    date_raw: 8 Oct 2003 — 9:31pm
    votes: null
    html: <p>I think the &lt;hlig&gt; feature may be redundant. If a user wants the long s, he probably wants the ligatures associated with it that are appropriate for his language, so I would use the &lt;hist&gt; feature to substitute the long s, using contextual lookups for those languages that have rules about where the substitution may occur, and then the &lt;liga&gt; feature for any ligatures. The only reason I can think of for the &lt;hlig&gt; feature is if you wanted users to be able to turn the long s ligatures off without affecting other ligatures. Frankly, though, I don't expect to see the &lt;hlig&gt; feature supported any time soon, at least not with its own UI function, which is what it would need to make it at all useful. <br> <br>I don't know what all the rules are for the long s in German, so I can't say what would be the best way to approach this.</p>
    html_clean: <p>I think the &lt;hlig&gt; feature may be redundant. If a user wants the long s, he probably wants the ligatures associated with it that are appropriate for his language, so I would use the &lt;hist&gt; feature to substitute the long s, using contextual lookups for those languages that have rules about where the substitution may occur, and then the &lt;liga&gt; feature for any ligatures. The only reason I can think of for the &lt;hlig&gt; feature is if you wanted users to be able to turn the long s ligatures off without affecting other ligatures. Frankly, though, I don't expect to see the &lt;hlig&gt; feature supported any time soon, at least not with its own UI function, which is what it would need to make it at all useful. <br> <br>I don't know what all the rules are for the long s in German, so I can't say what would be the best way to approach this.</p>
