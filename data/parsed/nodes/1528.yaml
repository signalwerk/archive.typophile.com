    html: "<p>&gt;1791: John Bell, U.K. printer, abandons the \"long s\" <br> <br>But why? From a practical point of view, according to the orthography of the day, there would have been many more long s's in a tray, so economically, it would have made more sense to rationalize by abandoning the short s.  <br> <br>And from the reader's point of view, it would have been less of shock. <br> <br>But perhaps they wanted drastic change. <br> <br>Did a standards committee of the era recommend a compromise, medium-length s, to replace both? <br> <br>Figures changed from old-style to lining, but were there other proposed orthographic changes during that revolutionary era, that didn't catch on? (I'm thinking of glyph shapes, including punctuation, rather than phonetic systems such as Pitman's, which was 1830s, I think).</p>"
