    date_raw: 8 Oct 2003 — 11:18am
    votes: null
    html: <p>The use of the long s in German, like several other aspects of German typography, is pretty much impossible to automate without a dictionary. It is possible with OpenType to provide basic contextual handling of the long s, and to use Language System tags to vary the handling for different typographic traditions, but German has too many lexically-determined exceptions to a general rule.</p>
