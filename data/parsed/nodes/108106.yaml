    html: |-
      <p>The caron (or háček) receives a special design just in Czech and Slovak, similar to an apostrophe, when applied to letters with ascender. This is related to these languages culture and typographical heritage. The same does not occurs in other languages.</p>
      <p>For more information, consult <a class="freelinking external" href="http://diacritics.typo.cz/index.php?id=5" rel="nofollow">this site</a>.</p>
