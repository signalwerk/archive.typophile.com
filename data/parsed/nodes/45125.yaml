    <p>I went to visit a printer in Nottingham and came across this font in his archive. Would you be able to help me and tell me what it is? It looks a bit like Caslon, but the the c and s have details which I can't find in any Caslon I have – and the g is quite peculiar too. Thank you for your help!</p>
