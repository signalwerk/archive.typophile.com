      <p>De Vinne Condensed.</p>
      <p>Elzevir, originally designed in the late 18th century, was revived in France in the 1880s and enjoyed a return to popularity in the USA, inspiring Gustav Schroeder's "De Vinne" of 1893 (Elzevir Bold, really), and this became the most popular typeface of the 1890s. It was named after Theodore De Vinne, the leading figure in American typography. He was a printer in the wide sense of the term as it was then employed, a publisher of books and magazines, instigator of coated paper, co-founder of the Grolier Club for bibliophiles, and an authority on typography who wrote extensively on the subject. Of the eponymous face, DeVinne said, “This face is the outcome of correspondence (1888-90) between the senior of the De Vinne Press [meaning himself] and Mr. J. A. St. John of the Central Type Foundry of St. Louis, concerning the need of plainer types of display, to replace the profusely ornamented types in fashion, of which the printers of that time had a surfeit. The DeVinne Press suggested a return to the simplicity of the true old-style character, but with the added features of thicker lines and adjusted proportion in shapes of letters. Mr. St. John approved, but insisted on grotesques to some capital letters in the belief that they would meet a general desire for more quaintness. Mr. Werner of the Central Type Foundry was instructed to draw and cut the proposed face in all sizes from 6- to 72-point, which task he executed with great ability. [Theodore De Vinne was mistaken on this.] The name given to this face by Mr. St. John is purely complimentary, for no member of the De Vinne Press has any claim on the style as inventor or designer. Its merits are largely due to Mr. Werner; its few faults of uncouth capitals show a desire to please eccentric tastes and to conform to old usage. The new face found welcome here and abroad; no advertising face of recent production had a greater sale.”</p>
