    <p>When Adobe announced the acquisition of Buzzword, the Flash based word processor, I couldn’t wait to check it out especially with a quote like this... </p>
    <p>“Because it was built with Adobe Flex™ software and runs in the Adobe Flash™ Player, Buzzword enables greater document quality, <em>outstanding typography</em>, page layout controls, and robust support for integrated graphics, regardless of the browser or device.” </p>
    <p>It’s pretty cool, but I’m going to have to fire up the Phinnsignal on the outstanding typography claim ;-)</p>
    <p>Here’s what they present when you launch it up...</p>
    <p></p><div class="imageWrap"><img src="/files/dashing_4466.JPG"></div><p></p>
    <p></p><div class="imageWrap"><img src="/files/fakequotes_6145.JPG"></div><p></p>
    <p>whole screen...</p>
    <p></p><div class="imageWrap"><img src="/files/wholescreen_4752.JPG"></div><p></p>
    <p>And the font list</p>
    <p></p><div class="imageWrap"><img src="/files/BuzzOnTheStreet_6278.JPG"></div><p></p>
    <p>I know it’s a beta – and Tom will I’m sure be helping them out, but let’s save the “outstanding” til they beat WP 5.1 ;-)</p>
    <p>Cheers, Si</p>
