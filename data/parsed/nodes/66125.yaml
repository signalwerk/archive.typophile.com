  - id: 570643
    user: 217411
    date: 2014-02-04T04:00:00
    date_raw: 4 Feb 2014 — 4:00am
    votes: null
    html: <p>The case of font used for The Avengers is interesting, and certainly during Series 4 and Series 5 of the Diana Rigg episodes, the graphic design was of a very high calibre.  For the monochrome (Series 4) programmes, I have only ever found the font as mentioned above by riccardO.  For Series 5, however, it appears the font used was Compacta, and for the opening fanfare 'The Avengers In Color' it appears to be Compacta Outline.  Apart from the title, Compacta was also used in Series 4, along with a combination of Helvetica.</p>
    html_clean: <p>The case of font used for The Avengers is interesting, and certainly during Series 4 and Series 5 of the Diana Rigg episodes, the graphic design was of a very high calibre.  For the monochrome (Series 4) programmes, I have only ever found the font as mentioned above by riccardO.  For Series 5, however, it appears the font used was Compacta, and for the opening fanfare 'The Avengers In Color' it appears to be Compacta Outline.  Apart from the title, Compacta was also used in Series 4, along with a combination of Helvetica.</p>
