    <p>Hello,<br>
    The Avengers TV series font seems to have changed quite a bit over the course of it's ten year life on TV.<br>
    This version is from 1965 - would anybody be kind enough to hazard a guess a what it could be?</p>
    <p>Many thanks<br>
    best<br>
    Paul</p>
