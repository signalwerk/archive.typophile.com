    <p>Hi all,</p>
    <p>  I have two questions that I could sure use help with:</p>
    <p>  I use InDesign and was wondering whether I ought to set the kerning to optical or metric? What is optical? That is, if I have a high quality font with a painsakingly created kerning table, will there be further improvement ot the kerning if I highlight a body of text and choose optical?<br>
      Also,`In Robert Bringhurst's 'Elements of Typographic Style' he speaks of letterspacing capitals at, say 10%, how much is that in the InDesign scale of 10 point increments? Or if that is too opaque a way of asking the question, what letterspacing do those who use InDesign tend to use for successive capitals and small capitals. I anticipate that the answer is something like, "whatever is most aesthetically pleasing' or something, but I'd also appreciate some general suggestions.</p>
    <p>Thanks alot.</p>
