    html: |-
      <p>I would be more concerned over the width of the letters.<br>
      Each glyph in a typeface is something of a compromise, optimized to work with every other glyph, so any particular combination in a word may not be ideal.<br>
      In this word, the M is really wide, and the F quite narrow, drawing attention to the middle of the word, when really the initial letter is the most important.<br>
      So why not make the F a bit wider (and possibly the T), and the M narrower, and see if that improves the whole?</p>
      <p>BTW, please make images no wider than 588 pixels, to avoid scrolling.</p>
