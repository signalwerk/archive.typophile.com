    <p>Hi guys,</p>
    <p>Is the Kerning ok on this?<br>
    Have I improved the "R" or have I destroyed it?</p>
    <p>I have just designed a logo need a nice bold extended font to go with it. The company is called fourmation and the font I have used in the attached picture is Microgramma Bold Extended. I like this font but to me the "R" looked a bit funny so I have played around with the "R" relating it to the "F", do any of these work?</p>
    <p>Look forward to your response,</p>
    <p>Cheers,</p>
    <p>Michael</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fourmation_4350.jpg"></div><p></p>
