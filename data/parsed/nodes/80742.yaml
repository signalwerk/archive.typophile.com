    html: <p>That looks like one of those amateurishly drawn digitizations of the French school script model. If you really are after that, search for ‘Ecolier’ or ‘Cursif’ on the notorious freebie websites. For a nice upright script, check out <a href="http://www.fontshop.com/fontlist/genres/upright_script/?&amp;sample_text=Les%20Cerfs" rel="nofollow">Fling, Mousse Script and others</a>.</p>
