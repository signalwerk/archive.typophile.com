    <p>What <a href="/wiki/software" class="wiki">font management software</a> do y’all recommend for Mac OS X? I had been using Font Reserve in OS 9 which I basically loved but they don’t seem to be making it anymore for the mac. I think Fontbook (which comes with the system) basically sucks. It has a nasty habit of activating all my fonts without my asking it to, my “collections” get mysteriously deleted, and it won’t activate/deactivate fonts when I open individual jobs. It also has very limited preview options. I’ve heard that Suitcase is good now - I ditched it years ago.</p>
    <p>Any thoughts?</p>
    <p>(forgive me if this topic has come up before - I didn’t do a thorough search before posting this)</p>
