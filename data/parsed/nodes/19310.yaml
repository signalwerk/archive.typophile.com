      <p>BEWARE: rant ahead...</p>
      <p>I know I shouldn’t hijack this thread, but these modification rules drive me crazy!</p>
      <p>Look at FontFont’s EULA. It doesn’t allow modification:<br>
      “2.6. You may not modify, adapt, translate, reverse engineer, decompile, disassemble, alter, or attempt to discover the source code of the Font Software. If you want to make modifications to the Font Software, you must obtain the prior written consent of FSI.” </p>
      <p>So, if I want to run FontDoctor on a FF font, I need to get a letter! (And of course, there’s no assurance I _will_ get one.)</p>
      <p>I’m really not sure what these no-mod rules are for. I’ve been told that allowing mods increases tech support difficulties, but I wonder, is Adobe flooded with tech calls for font mods? Was Linotype, when their MyFonts EULA allowed mods? It seems that most people who actually read and abide by EULAs would be able to understand a clause indicating that modifications would not be eligible for support. </p>
      <p>These clauses offend a foundry’s most fastidious customers, customers who actually care about type, while leaving the uninterested unaffected! What a strange business approach: we only want customers who aren’t interested in our product. I certainly won’t buy font from outfits with that attitude.</p>
      <p>By way of contrast, look at Village’s EULA:<br>
      “You may modify the fonts for your own purposes, but the copyright remains with Village, and the number of computers covered by the license remains the same. You may not commission a third party to modify the fonts without first gaining permission from Village. You may not sell or give away modified versions of the fonts.”</p>
      <p>That seems to cover it in a fair way.</p>
