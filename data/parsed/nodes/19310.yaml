    html: |-
      <p>Suitcase Fusion has plug-ins that bypass the Mac OS font system and talk directy to the application. Fusion also uses FontSense IDs, basically checksums generated from the font files themselves. For that reason, it is able to distinguish between two fonts of the same name during auto-activation. Other font managers tend to work off PostScript name only. </p>
      <p>I tend to think that some Mac OS system font cache issues are related to activating an de-activating different font files of the same name. This may be why FEX has a feature for clearing font caches.</p>
    html_clean: |-
