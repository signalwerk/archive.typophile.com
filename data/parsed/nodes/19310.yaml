      <p>There are several things that can go wrong with traditional Mac fonts that simply don’t occur with later (data fork only) font formats. Some of these things occurred because of the way fonts worked under Mac OS 9 and before. For example, under Mac OS 9, the Finder would actually open fonts in a read/write mode and change font IDs if necessary. The Finder could modify fonts! (This cannot occur in OS X)Also, modification of font suitcases was an accepted practice under OS 9 and before. There is a lot of junk out there. </p>
      <p>In these cases, the ’modification’ by Font Doctor isn’t related to outline shapes, hinting, kerning or other design aspects of the typeface. Typically the fixes are simply repairs to the structure of the font suitcase. In my experience, if table data is bad, FontDoctor lists it as irreperable. </p>
      <p>In some cases font vendors may not be as forthcoming with replacements as Linotype seems to be. Many older vendors have disappeared. Font vendors depend upon selling fonts, and also re-selling the same fonts later. I don’t think it is reasonable to expect Linotype to help peoeple use fonts they already have.</p>
