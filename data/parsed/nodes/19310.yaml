      <p><em>One thing I wish was in the Linotype program is something like Font Doctor that verifies the font file is fine.</em></p>
      <p>This is not in FEX as an issue of “politeness,” for a lack of a better term… ;-)</p>
      <p>Linotype’s EULA forbids the modification of fonts. Font Doctor modifies fonts. </p>
      <p>Linotype also offers a free lifetime download guarantee on all of our fonts… if your font file becomes corrupted, you can just log-in to to your account and download it again. You will be able to do this for non-Linotype fonts bought via the FEX store as well.</p>
      <p>Since Linotype’s EULA doesn’t allow Font Doctoring, we didn’t put this feature in FEX. We don’t want to mess around inside other foundries’ fonts, just like we wouldn’t want them doing the same to ours.</p>
