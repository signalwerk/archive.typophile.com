    html: |-
      <p><cite>Font management in OSX is painful.</cite></p>
      <p>I agree. However, this is partly because Mac OS X is the most feature-rich operating system ever in terms of typographic functionality. It supports more font formats than any other platform. Windows doesn’t have any way of isolating font activation per user. Windows also doesn’t have any system-wide API that would make auto-activation possible, and I don’t think Vista is going to be adding it. While these features were present in OS 9 to some extent, the way they were implemented meant that there was a much greater danger of system instability. Also System 9, for practical purposes, never provided much language support. </p>
      <p>This comment, of course, is from the perspective someone using a Latin-based language with an interest in graphic design. John Hudson would be quick to point out that Windows wins in terms of support for complex scripts such as Arabic.</p>
