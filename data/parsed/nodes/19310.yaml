      <p>@ Paul, my solution is to turn off the optional fonts in the System Fonts folder and let OS X just use the locked fonts. You can delete those directly off the computer but I keep them there, they are mostly all at the bottom of the font list in programs anyhow. </p>
      <p>I don’t know how you set your fonts up but I create folders for the Foundries and place the respective fonts inside, and you can create sets inside there as well or on their own. That way I never deal with having all fonts in the same massive folder. I use FEX at home, and used to work out of my house. I recently moved to a studio and use it here as well, I love it. The only time it’s gone funky on me was when I tried to preview a corrupt font. Other than that activation and management has been instantaneous between programs.</p>
      <p>Also, on my HD I created a font folder where I keep my fonts and organize my own fonts and have the preference set so FEX does not copy or move anything for me.</p>
