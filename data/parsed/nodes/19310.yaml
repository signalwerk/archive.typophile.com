      <p>I love my Font Explorer X from Linotype; however, it is loading  during my computers start up and causes my cpu to start slower. It also causes strange ghosts of letters on my mac when I erase letters that are typed in things like this comment box or an email.  I  followed the Apple techs directions to try to help my computer start faster. He helped me get the program off off my computers background. Then, I went into a illustrator file and (shock) the type was @#^$%. I had to go into the program and turn on all the types again. After that my computer started up slow like it did before because the program is on my background again. </p>
