  html: |-
    <p>I wonder if anyone here might have a decent showing of the old Art Nouveau typeface Kobe that they might be willing to scan and send my way. Right now all I've got is a small, low-res, curled page scan.</p>
    <p>I need Kobe (solid), not Kobe Open.</p>
    <p>Amongst all of my books and catalogs, I find only one limited showing of Kobe Open – which is useless for my needs. I don't think that it is on any of the Dover/Dan Solo CD-ROMs, but perhaps in one of their 100 Font picture books?</p>
