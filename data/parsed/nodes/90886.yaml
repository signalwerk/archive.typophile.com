  html: <p>What type size would you suggest using for the captions in a photography magazine? I'm a Graphic Design student. I'm using Neutra Text. I've been trying with 8 pt because anything else seems way too small, but it still feels dense on the page.</p>
  html_clean: <p>What type size would you suggest using for the captions in a photography magazine? I'm a Graphic Design student. I'm using Neutra Text. I've been trying with 8 pt because anything else seems way too small, but it still feels dense on the page.</p>
