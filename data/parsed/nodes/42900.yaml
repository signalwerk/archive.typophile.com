      <p>To prevent use of typographic quotes in any newly created documents:</p>
      <p>1. Open InDesign but do not open any documents.</p>
      <p>2. Go to Preferences, and turn off ’Use typographers quotes’ option.</p>
      <p>This will stop InDesign from converting straight quotes to curly quotes.</p>
