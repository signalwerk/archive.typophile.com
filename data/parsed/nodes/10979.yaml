    html: <p>The first, although cramped is the least clever. And in this instance I don't think clever is what you want. Although the <i>fake</i> smallcaps aren't helping either. Do you have a version of this face with <i>real</i> smallcaps? The 'R' needs to be given some it's florentine roots back. You've stretched the curve too much and it shows. It would be more elegant, and natural, if you could create the leaf from the natural stroke of the 'R'. This would also fix the clotting in between the 'R' and the 'D'. As well, it would also force your to drop the leaf a little lower which it needs. Hrant suggestion about  a little less all caps might be nice to explore as well. And if you must use a <i>fake</i> smallcap, limit it to only the word Verde. I really like the colors. They seem crisp and elegant. Smart Papers makes something with this kind of scheme that would be beautiful. And one more thing. The word 'AT' seems to be an afterthought. It needs to fit into the scheme, not float outside of it.</p>
