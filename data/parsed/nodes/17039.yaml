      <p>Upon leaving the theatre, and being asked "What did you think?". I replied "I think I saw Optima and Friz Quadrata... totally inappropriate for the time period." My wife rolled her eyes, my friends laughed, then asked "What?"</p>
      <p>The Optima siting was mentioned above. I swear I saw some Friz on building signage behind Kong, on the streets of New York, near the end of the movie. There were some great (appropriate) neon signs above it, and then BANG... Friz Quadrata.</p>
      <p>Oh well, I like being a "subset of a subset of a subset of society."</p>
