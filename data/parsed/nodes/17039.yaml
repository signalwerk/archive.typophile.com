      <p>I remember Adam Twardoch going into conniptions during <em>Enemy at the Gates</em> because the WWII Russian propaganda leaflets were set in Arial Cyrillic.</p>
      <p>One of Ross' and my earliest typographic jobs, when we first started Tiro, was reproducing French identity cards and vermouth bottle labels from the 1920s for a film based on the flying exploits of Antoine de Saint-Expury. If I recall correctly, we modified Franklin Gothic for the identity card type, and were able to get quite close without too much difficulty. Even if it wasn't completely accurate, it also wasn't recognisable as a specific later typeface. Fun work, and something that could become a lucrative and interesting field for many of our colleagues if the studios start paying attention to Mr Simonson. :)</p>
    html_clean: |-
