      <p>But wouldn't the prop dept. (depending on the film's set or art director) go a more logical route first seeking what their own studio or CBS Studios might still have available in terms of sign props? (Free standing extruded, cast or cut letters.)</p>
      <p>My younger son works in L.A. at an antique store that specializes in architectural hardware from European gothic cathedral door hinges, to brass spitoons from the 1920s. He says many of the set and prop workers in Hollywood hunt for period style fixtures, door knobs, ceiling fans, etc., then bring them back to the prop dept. workshop to make knock-offs for the various sets.</p>
      <p>My point being that the responsibility for making/finding letters for "CBS NEWS" might have gone to through the "property master" to the prop dept instead of through the art director to the art dept. </p>
      <p>Instead of creating all the letters from scratch, the prop people might have gone the research route and found only a few existing sign letters, mistakenly identified what they had as Helvetica, thus constructed any missing characters as Helvetica???</p>
      <p>Besides, we know that both <a href="http://www.scottsigns.com/ExtLtrs.htm" target="new">signage manufacturers</a> and sign makers deal in a different scale than graphics people. If type designers prior to phototypesetting frequently modified character design for scaling of titling weights, wouldn't even skilled sign crafters consider subtle modifications for characters ranging from 12 inches to 20 feet tall? I think so.</p>
    html_clean: |-
