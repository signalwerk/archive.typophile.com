      <p>I watched the new King Kong movie shortly after watching the 1933 original on the recently released DVD. It was fun to see them back to back because the new one follows the original store very closely and includes many references to it. The titles on the new version--the ones with Bodega Sans--were similar to the original, but could have been better. In fact, in all the extras on the DVD of the original, they did a really good job of aping (ha!) the original titles, even creating a font to match the lettering. The titles in the new Kong look "inspired by" while the DVD's look astonishingly like the real thing, down to scratches and frame jitters.</p>
      <p>The "one other thing" I noticed that's mentioned at the end of the article was Bodega Sans used for dimensional letters above a marquee on a theater. It's a fleeting image and I missed it the second time I saw it. It may well have been my imagination. There was one more thing (which Scott Stowell mentioned on Design Observer and I had forgotten about): During the opening scenes depicting the Great Depression, there is a down-on-his-luck guy sitting in front of a box labeled in large letters set in Optima. Aside from those few things, I thought they did a great job on signs and such. I noticed there were three sign painters listed in the credits. Nice.</p>
    html_clean: |-
