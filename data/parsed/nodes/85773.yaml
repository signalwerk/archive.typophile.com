  html: |-
    <p>After a successful mini Euro tour of the Making Faces film, I will be presenting it at a few stops in October.</p>
    <p>October 04-11 - San Francisco, CA<br>
    (Sponsored by TypeKit, Communication Arts Magazine and Dependable Letterpress)</p>
    <p>October 21-11 - Vancouver, BC<br>
    (Sponsored by Simon Fraser University and the Alcuin Society)</p>
    <p>October 25-11 - Victoria, BC<br>
    (Sponsored by Vancouver Island Chapter Society of Graphic Designers of Canada (GDC))</p>
    <p>October 27-11 - Seattle, WA<br>
    (Sponsored by AIGA)</p>
    <p>October 29-11 - Portland, OR<br>
    (Sponsored by Extensis, CC Stern type foundry, Museum of Contemporary Craft, KeeganMeegan, Peet/Kegler)</p>
    <p>more info than you could want:<br>
    <a href="http://makingfacesfilm.blogspot.com/" title="http://makingfacesfilm.blogspot.com/">http://makingfacesfilm.blogspot.com/</a></p>
