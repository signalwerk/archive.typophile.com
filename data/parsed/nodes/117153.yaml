    html: "<p>In searching for information about the bullet point, I learned something new: that the paragraph mark is called the 'pilcrow'. Also, a fleuron used as a paragraph divider is sometimes called a 'hedera' (at least when it is in the form of an ivy leaf, the meaning of that word).</p>"
