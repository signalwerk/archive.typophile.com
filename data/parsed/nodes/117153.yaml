      <p>And then there's the typographic manicule/fist...</p>
      <p>BTW the most important thing about a good pilcrow goes unmentioned in that HTF article: that it must look heavier than the rest of the font, so that it can do its intended –or at least typical– job.</p>
      <p>hhp</p>
