    html: <p>Hey Noah <br> <br>Happy new year! <br> <br>I am by no means an expert in analyzing a typeface in any other way than as a user (graphic designer).  I would say that this face seems to be strongest when used as a headline - when it is set as body it has a jittery-ness that could be good or could be bad, it would be somewhat hard to say right now. <br> <br>Is there anyway you could highlight your thoughts and process with deciding on the shapes of the letters.  For example the uppercase U and the lower case u share some traits but the curves seem somehow off - is this intentional (as I assume it is) - if so, what lead you to making them this way?</p>
