    <p>I've begun work on Frimbo Sans, a companion face to my first serif font, <a href="http://www.typophile.com/forums/messages/29/56784.html?1104524163">Frimbo</a>. The goal is to retain some of the quirkiness of the original in the overall character while creating as even a color as possible. Glyphs like the lc "g" carry over nicely as does most of the punctuation. Other than that, I want this face to look more "finished" (interesting that this is a faster process than constructing the parent font), slightly darker, even, and legible. Things like the lc "o" need to change. Any suggestions on adjustments to individual glyphs would be appreciated. As would any other critique you have to offer. Oh, and Happy New Year!</p>
