    html: <p>My clients Brill, the academic publishers in the Netherlands, use didot points to spec type. The most obvious impact of this was that using integer type sizes and leading results in a different visual proportion of interline spacing than corresponding Anglo-American points. I made my initial specimens interpreting their spec using Anglo-American points, and found the interline spacing too tight, but when I revised it to use didot points (by redefining the point scale in InDesign preferences), the result was better.</p>
    html_clean: <p>My clients Brill, the academic publishers in the Netherlands, use didot points to spec type. The most obvious impact of this was that using integer type sizes and leading results in a different visual proportion of interline spacing than corresponding Anglo-American points. I made my initial specimens interpreting their spec using Anglo-American points, and found the interline spacing too tight, but when I revised it to use didot points (by redefining the point scale in InDesign preferences), the result was better.</p>
