    html: |-
      <p>The system proposed and introduced by Berthold (in the seventies, I think), and used by them for years until the demise of their photo-setting equipment business, was the most practical - based on SI-units: millimeters! </p>
      <p>Too bad it never got to DIN-status.</p>
      <p>Addendum: Or maybe it did. This article is not clear on this:<br>
      <a href="http://en.wikipedia.org/wiki/Metric_typographic_units" title="http://en.wikipedia.org/wiki/Metric_typographic_units">http://en.wikipedia.org/wiki/Metric_typographic_units</a><br>
      Interesting that Otl Aicher was involved.</p>
      <p>Another addendum: Discovered that the Japanese Q stands for quarter millimeter. Smart!<br>
      <a href="http://www.iol.ie/~sob/tm/index.xhtml" title="http://www.iol.ie/~sob/tm/index.xhtml">http://www.iol.ie/~sob/tm/index.xhtml</a></p>
      <p>Question that remains: did the Japanese go metric before the Germans?</p>
