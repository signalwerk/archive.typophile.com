  html: <p>Hi, we are currently working on a university project to create 2 contrasting ISTD journals on the typographic measurement debate, one issue being on points/picas and the other being on didots/ciceros. but issues must be contrasting and 32 pages long. However, we are struggling with research into this other than the obvious differences of size, nationality and age if anyone could point us in the right direction of some good articles discussions we would be very grateful.</p>
