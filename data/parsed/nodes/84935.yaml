      <p>&gt;median age</p>
      <p>Well, not just median age, but the fact that most material is going to have readers over 45. Everyone over 45 has some limitation because of presbyopia and need for brighter light. So aided with glasses or not, larger type is going to be welcome for us old folks. So design not just for those with the best sight, but those with normal vision affected by age. Having 10 or 11 point type rather than 8 or 9 is not going to slow young people down, and is going to be a benefit for the older readers.</p>
