    html: |-
      <p>I think Andreas's number of 3 points for short text is generally too low if you are talking about reading with comfort. The article of Legge and Bigelow give a range of 4 to 40 points as the general "fluent" range, but that includes I think very large x-heights, as the visual angle is more precisely .2 to 3 degrees for fluent reading. They give several convenient conversion methods, including that visual angle at 40 cm (16 inches) is point size divided by 20. </p>
      <p>The x height of Adobe Garamond is a little less than .4 of the point size, and working from that I get 10 point as the smallest fluent reading size (.2 degrees visual angle of x-height) for Adobe Garamond. They define "fluent" as being able to read at maximum speed. Of course you can decipher letters at much smaller sizes than that if you stare at them in very bright light. But that's different from reading fluently, and with comfort.</p>
      <p>To me that 10 point minimum of comfort for Adobe Garamond seems reasonable. Now typefaces designed for reading below 10 point normally have a larger x-height, so I would expect that Garamond Premier, which has optical sizes, could go smaller for the 'caption' optical size. By comparison, Minion "caption," which is intended for small sizes, has an x-height of 438 em units (of 1000). That pushes the fluent reading size down to about 9 point. I'm sure you can read it, maybe not at maximum speed, at 8 point. But 3 point? That's getting to the stare-and-decipher level, if you can even make it out.</p>
