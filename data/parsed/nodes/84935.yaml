  html: '<p>I have what I hope to be a simple question: what is the smallest comfortable size for continuous reading for a type like <a href="/wiki/Dante" class="freelinking" rel="nofollow">Dante</a> or <a href="/wiki/Garamond" class="freelinking" rel="nofollow">Garamond</a>?</p>'
