      <p>I have to think that "3 points" is simply a typo. I cannot imagine a typeface, however well-crafted, being readable except with difficulty at that size. Perhaps 6 points was meant.</p>
      <p>In the past, of course, occasionally 4 1/2 points was put to use, but that was eye-straining small print... and so was 6 points, for that matter, but not as bad.</p>
      <p>EDIT: I have to admit, though, that the rules text on Yu-Gi-Oh! cards seems to be smaller than 6 points. So sizes below 6 points still see some use, even today.</p>
