    html: |-
      <p>Note that the question in this thread is the smallest size for *comfortable* reading. The recent paper of Legge and Bigelow that I've referenced is about "fluent" reading ranges, which measure reading speed. So the ability to decipher 2 point type doesn't address that. In general, according to that paper the fluent range of type is twice the size of the minimum visual acuity. </p>
      <p>The one who measured visual comfort, or visual fatigue, was Matthew Luckiesh, as explained in <a class="freelinking external" href="http://typophile.com/node/83684" rel="nofollow">this thread.</a> Luckiesh's work lay fallow for 60 years, and needs repeating, but as I remember he found large type to be more comfortable, with 12 point being generally more comfortable than 10 point. This was as measured by increase in blink rate, with the lower blink rates over time indicating more comfort and less fatigue.</p>
      <p>p.s. note that caps are going to be decipherable at smaller sizes, probably around half the size of lower case, as generally the vertical visual arc will be at or above the .2 degrees down to a far smaller size.</p>
