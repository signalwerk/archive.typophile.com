    html: <p>The scientific article by Legge and Bigelow linked in <a class="freelinking external" href="http://typophile.com/node/84429" rel="nofollow">this typophile thread</a> addresses this and will give you a detailed answer. If I remember rightly, below .2 degrees of visual angle for the x-height seems to be a limit for fluent reading. Since x-height varies with typeface, the minimum point size can vary a lot with typeface.</p>
