    html: |-
      <p>The Legge-Bigelow paper spoke of type size defined by the amount of visual angle occupied by x-height, which they determined to be about half of the point size.</p>
      <p>But this makes two assumptions.<br>
      First, that x-height is pretty standard relative to point size, and secondly that people hold the document at a standard distance.</p>
      <p>Obviously, x-height varies; Dante, for instance, has a far larger x-height than Garamond (presumably not the ITC version).</p>
      <p>More importantly, it's possible to use much smaller type on smaller pages—people will hold the book closer to bump up the angle-size. And this is something that those with normal sight can do, as well as the short sighted, who can just remove their spectacles and hold the document real close.</p>
      <p>Centuries ago, many books were published at "pocket" size, with small type. I have many of these, and they are a joy to read as I am short-sighted—all I have to do is take off my glasses and hold the page six inches away. In fact, this bumps up the angle to practically headline proportion, which is a nice way to read letterpress text type, for me at least, slowly—and also to marvel at the detail of engraved illustrations.</p>
