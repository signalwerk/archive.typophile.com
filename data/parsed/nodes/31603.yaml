    html: |-
      <p>Yes, far more than one book. There are different classificatory systems. For example, Mrs. Eaves is a revival of Baskerville -- or maybe "inspired" by Baskerville? So, is it "digital" or "transitional" in your system? The three you term "old style" I would break into different categories, with, for example, Bembo being a Venetian.</p>
      <p>People classify fonts for varying reasons, so no one system is right or wrong.</p>
