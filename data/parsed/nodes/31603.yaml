    html: |-
      <p>The FontBook categories are Sans, Serif, Script, Slab, Display, Blackletter.</p>
      <p>It also gives the name of the designer/redesigner, date of design, and "similar to" links.</p>
      <p>It is not comprehensive, as some foundries are not included.</p>
