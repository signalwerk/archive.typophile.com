      <p><cite>What I’am trying to say, I’am not able all the time to categorise a font, and a book who tell me this font is a modern font etc. are going to help me.</cite></p>
      <p>There's no book out there that can be considered a definitive resource for font classification. Classification systems are very much a subject of debate, as is which typefaces go where, so it's really up to you to nitpick for yourself.</p>
