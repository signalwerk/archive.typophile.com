  html: |-
    <p>Hi,</p>
    <p>Soon I'am going to bought the FontBook, but I would like to know if in the book they describe the fonts by categori.</p>
    <p>What I try to say by describing fonts is, example : </p>
    <p><strong>Digital :</strong></p>
    <p>Matrix;<br>
    Mrs Eaves;<br>
    Out West.</p>
    <p><strong>Old Style :</strong></p>
    <p>Garamond;<br>
    Caslon;<br>
    Bembo.</p>
    <p><strong>Modern :</strong> </p>
    <p>Gill Sans;<br>
    Futura;<br>
    Frutiger;<br>
    Univers.</p>
    <p><strong>Transitional :</strong></p>
    <p>Baskerville;<br>
    Bodoni.</p>
    <p>What I'am trying to say, I'am not able all the time to categorise a font, and a book who tell me this font is a modern font etc. are going to help me.</p>
    <p>I dont know if you understand what I mean ?</p>
