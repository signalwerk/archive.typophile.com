      <p><a href="http://www.amazon.co.uk/Rookledges-Classic-International-Typefinder-Christopher/dp/1856694062/sr=8-1/qid=1171982288/ref=sr_1_1/026-4632524-9608460?ie=UTF8&amp;s=books" rel="nofollow">Rookledge’s Classic International Typefinder</a> –&nbsp;btw a good source for identifying older typefaces – breaks down into categories based on <a href="http://ourworld.compuserve.com/homepages/profirst/b.htm#brstclofty" rel="nofollow">BS 2961</a> (in turn based on the Vox system). Not perfect but a starting place.</p>
      <p>Tim</p>
