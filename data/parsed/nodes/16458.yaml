    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Education" class="freelinking" rel="nofollow">Education</a> : Escola Superior de Desenho Industrial</strong></p>
    <p>Founded in 1963, Escola Superior de Desenho Industrial (ESDI) was the first design college in Brazil and in Latin America. </p>
    <p>The undergraduate course consists of a five-year programme of full-time study, covering both product design and graphic design. </p>
    <p>ESDI's Master's Degree Course started in 2005.</p>
    <p><a href="http://www.esdi.uerj.br" rel="nofollow">http://www.esdi.uerj.br</a></p>
