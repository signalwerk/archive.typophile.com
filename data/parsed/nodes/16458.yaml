    <p>Founded in 1963, Escola Superior de Desenho Industrial (<span class="caps">ESDI</span>) was the first design college in Brazil and in Latin&nbsp;America. </p>
    <p>The undergraduate course consists of a five-year programme of full-time study, covering both product design and graphic&nbsp;design. </p>
