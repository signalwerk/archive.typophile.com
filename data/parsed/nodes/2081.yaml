  html: <p>I know that QWACK, has a feature called white trap. So it spreads the white when setting on a dark BG within a 4 color document. Say if I had my blacks set to 50 40 30 100, and I didnt what the other colors bleeding inside my white reversed out text. <br> <br>Does InDesign have something like this? Im looking, but it is not called White trap, so not sure what it is, or if it is available. <br> <br>Thanks. <br> <br>Hildebrant.</p>
