    date: 2012-01-10T06:21:00
    date_raw: 10 Jan 2012 — 6:21am
    votes: null
    html: <p>Avant Garde seems like an odd choice to pair with Chaparral. I once used Chaparral with Today Sans and they looked good together, both "warmth" and informal typefaces in my opinion; the "headline" cut of Today Sans should fit well if it must be set for titling. I'd also suggest Nick Shinn's Sensibility as a compaion sans.</p>
