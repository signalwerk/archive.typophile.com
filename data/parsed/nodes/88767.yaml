    votes: null
    html: <p>I think if the difference in size is big enough, you can combine almost anything. But I don't think the aesthetic of these typefaces work well together. I think Chaparral could be nice, it is a friendly and warm face, but avant garde is cold and stylized, and it is too geometric (in a bad way). If you like a geometric face, try Futura, Avenir or Neuzeit.</p>
