    <p>Hello people,</p>
    <p>First of all I wish you all to be very happy this year!</p>
    <p>Now to my question.<br>
    What do you think of combining ITC Avant Garde Gothic Pro for titles with Chaparral pro (typekit) for body copy?</p>
    <p>If you think it wouldn't work, any tips would be very much appreciated!</p>
    <p>Thanks!</p>
