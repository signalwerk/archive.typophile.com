    <p>Hello everyone,</p>
    <p>I don't post very often, but have a great deal of respect for the many knowledgeable and insightful members here. I hope some of you can provide good suggestions and feedback for this project of mine.</p>
    <p>I have a logo which features Chalet for the type, and I'm trying to find a Serif for headings (and possibly body) to properly compliment it. I guess I'm just trying to achieve a proper balanced look, since the logo type is so distinctive.</p>
    <p>Any advice/suggestions are much appreciated, as well as any criticisms on the logo itself.  The logo is very much a work in progress, and I attempted some small modifications to the type (for the lowercase u and a).</p>
    <p><a class="freelinking external" href="http://www.houseind.com/index.php?page=showfont&amp;id=4&amp;subpage=viewfontspecimens" rel="nofollow">Chalet Fonts</a></p>
    <p>Cheers</p>
    <p>EDIT:  I'm thinking a slab serif of some variety. Any thoughts? I saw <a href="http://www.myfonts.com/fonts/linotype/pmn-caecilia/" title="http://www.myfonts.com/fonts/linotype/pmn-caecilia/">http://www.myfonts.com/fonts/linotype/pmn-caecilia/</a> suggested in another thread.</p>
