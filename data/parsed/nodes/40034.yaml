      <p>Miss Tiffany:<br>
      Here it is: <a href="http://www.linotype.com/2061-20496/licenseagreementforfontsoftware.html" title="http://www.linotype.com/2061-20496/licenseagreementforfontsoftware.html">http://www.linotype.com/2061-20496/licenseagreementforfontsoftware.html</a>  I'm assuming that's a correct/current EULA. Personally I wouldn't hesitate to use any fonts I own in flash files. If a foundry wants to get fussy and send me a letter, I'll happily switch to another font/foundry. I asked a few designers and they agreed that flash is flash, regardless of whether it's a spinning logo or SIFR ;) Obviously, I'll still take every reasonable precaution to ensure people can't rip the fonts or characters.  </p>
      <p>Auricfuzz: Thanks for that. I like Silica too, but it doesn't seem to mesh as well with Chalet. TheSerif looked nice, very similar to Caecilia.</p>
      <p>Lex: To some extent I agree, but I believe the concept is different enough that it should be fine. A large selection of my clients helped choose the logo from several options. I'm still working on ways to build a brighter/happier looking site around it. I don't want everything appearing too dark and dreary.</p>
