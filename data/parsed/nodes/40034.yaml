      <p>Hi Trevor,</p>
      <p>I'd probably suggest using something a little understated compared to Chalet. Have you seen MVB Verdigris? (But, I guess I might see Caecelia being used too.) </p>
      <p>As for you logo. I don't mind the change to the lowercase u, but the serif on the lowercase a isn't smooth enough. In addition the u serif seems more rounded while the a is more attached.</p>
