      <p>Hey Trevor,</p>
      <p>I agree with Miss T. There's a lot going on the mark already, so choose something simple. In fact I'd be inclined to stick Chalet, but one of the less ornate cuts.</p>
      <p>With the logo itself, I'd probably lose the gradient fade in the separating line, you don't need it. And yep, the little hair flip on the a needs a little smoothing.</p>
