      <p>Thanks for the input. It's hard to find good constructive criticism these days :)</p>
      <p>I hadn't heard of Verdigris, and it looks like another contender.  I've done a few quick tests with Caecelia, and it seems to go quite well with the logo type. It's my current favourite. </p>
      <p>A lot of my content will be web-based, so that's definitely a concern when choosing fonts. I'm happy to use SIFR for headings and very brief paragraphs.</p>
      <p>I'll take a look at implementing those logo improvements.</p>
      <p>Attached is one of the Caecilia tests:</p>
