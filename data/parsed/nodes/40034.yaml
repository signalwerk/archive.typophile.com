    html: <p>I think Caecelia works. However isn't Caecelia a Linotype font? Their EULA doesn't allow for web embedding. What about Adobe's <a href="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFontPackage&amp;code=1718" rel="nofollow">Chapparal</a>?</p>
  - id: 246312
    user_id: 19243
    user_name: Trevor Curtis
    user_path: null
    date_raw: 12 Dec 2007 — 10:38pm
    date: 2007-12-12T22:38:00
    votes: null
    html: |-
      <p>Caecilia is Lino, yeah.   I wasn't aware SIFR would violate their EULA. This is their section on embedding:</p>
      <p><cite>1.5 Embedding of the Font Software into electronic documents or Internet pages is only permitted under the absolute assurance that the recipient cannot use the Font Software to edit or create a new document (read-only). It must be ensured that the Font Software cannot be fully or partially extracted from said documents.</cite></p>
      <p>There's so many flash-based websites that feature commercial fonts. I would've assumed SIFR is no different, unless of course all those flash sites have broken the EULA too :)</p>
      <p>It turns out I have Chapparal (does it comes with the Adobe apps?). It looks good, but not as nice as Caecilia. The bold weight is also way too heavy. </p>
      <p>I'm consulting Mr. Google for some clarification on the licensing thing.</p>
      <p>EDIT:  I was just comparing Caecilia and Chapparal a bit more. Caecilia is definitely the winner. Even if I don't use it here, I'll keep it in mind for other projects. It's quite impressive.</p>
      <p>Do you think <a class="freelinking external" href="http://www.garagefonts.com/typespecimens_2.html?sku=GF060016X1P2&amp;start=1" rel="nofollow">Freight Micro (book)</a> would be an option?  In a world without Typophile, that's probably what I would've ended up choosing.  It's so expensive.</p>
