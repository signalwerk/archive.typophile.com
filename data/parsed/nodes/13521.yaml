    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Miles Newlyn</strong></p>
    <p>Born: Leicester, United Kingdom, 1969.</p>
    <p>Miles Newlyn graduated from St Martins College of Art, London, in 1991. He first released Missionary, Sabbath Black, and Democratica through <a href="/wiki/Emigre" class="freelinking" rel="nofollow">Emigre</a>, and then designed a set of six keynote typefaces for <a href="/wiki/David%20Carson" class="freelinking" rel="nofollow">David Carson</a>.</p>
    <p><a href="http://www.newlyn.com" title="www.newlyn.com">www.newlyn.com</a></p>
