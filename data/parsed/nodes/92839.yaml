    html: <p>Perhaps, but a cursory browsing through Google books seems to show that after the 1840s the term "wood-block letters" becomes shortened to "block letters," and is distinct from "gothic letters;" the block type usually having angles restricted to the octagonal, and the gothic being fully realized sans-serif. There doesn't seem to be any consistent restriction of block letters to capitals until shortly after the turn of the century, and primarily in technical drawing alphabets. And by then the distinction between the block and the gothic is becoming blurred.</p>
