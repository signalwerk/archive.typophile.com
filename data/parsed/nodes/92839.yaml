      <p>We get requests for block fonts in our designs at work all the time.  I usually end up giving them something like Rockwell extra bold, a slab serif, and yes, always in all capital letters.  The customers seem happy.</p>
      <p>I thought the term "block" derived from the slabs themselves actually, i.e., block fonts = slab serif fonts, though I could be quite wrong.</p>
