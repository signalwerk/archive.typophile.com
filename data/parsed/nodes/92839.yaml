      <p>At the risk of beating horses already passed, a little more digging has found that as of the 1830s the term is applied to letter forms that have been produced in some form of relief, whether in iron, marble or cut from a wooden block. The term "block" seems to have, therefore, derived from the letters having an actual three-dimensional form.</p>
      <p>makes sense.</p>
      <p><a class="freelinking external" href="http://books.google.com/books?id=qrhHAQAAIAAJ&amp;dq=%22block%20letters%22&amp;pg=PA59#v=onepage&amp;q=%22block%20letters%22&amp;f=false" rel="nofollow">The Athenaeum, Issues 375-426, 1835</a></p>
