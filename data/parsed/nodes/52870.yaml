  html: |-
    <p>If <a class="freelinking external" href="http://vllg.com/KLIM/Feijoa/mudTyper+Weights/" rel="nofollow">Feijoa</a> is the main body text in a book, what sans would work well for headings, captions, and back cover text?</p>
    <p>I'm thinking of <a class="freelinking external" href="http://www.emigre.com/EF.php?fid=200" rel="nofollow">Vista Sans</a>, a squarish sans to complement the curves of Feijoa.  Or would such a contrast be jarring?  Does a curvy serif absolutely need a curvy or neutral sans?</p>
    <p>Thoughts/alternatives?</p>
    <p>Thank you.</p>
    <p>Rahim</p>
