    date_raw: 24 December 2008 - 2:00am
    votes: 0
    html: |-
      <p>Hi Mike:</p>
      <p>Thanks for the clarification.  I see what you're saying now.</p>
      <p>You know what made me think Vista Sans could be literary as well as technical?  There are <a href="http://specimens on Emigre&amp;#039;s website" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://specimens on Emigre's website</a> that have text that starts off with, "I sit in the shade of an ancient, dying juniper tree..."  I read that and thought, wow, this might work for some more literary stuff too.  But you're right, Feijoa *and* Vista Sans saturate the page with so much character that it would be difficult to create a harmonious contrast.</p>
      <p>Yup, I've 95% decided to go with FF Milo.  It just looks better than anything else I've seen.</p>
      <p>Maurea was a total surprise.  I had not heard of it.  Looks nice.  Lots of weights.  OpenType.  And so affordable.  Thanks for letting me know.</p>
      <p>I'm waiting to use Ronnia somewhere in the distant future.  I like it very much.</p>
      <p>My book is about how people today can use the wisdom of the world's religions in practical ways to raise the quality of the happiness in their actual daily lives.  You could say I am taking those wisdom teachings, removing all foreign terminology, unhelpful dogma, and uncritical mythology, and putting them in a blender and making a smoothie that is both tasty (relevant) and nourishing (effective).</p>
      <p>And it will be set in Feijoa and FF Milo (unless I change my mind again). Ha! :)</p>
      <p>Rahim</p>
