      <p>Hi Rahim:</p>
      <p>I love the lowercase a in Vista but as for pairing it with Feijoa... it feels too technical. Seravek is too wobbly.</p>
      <p>I’m thinking you should go with something, such as Milo, that is so neutral and geometric to the point of being invisible.<br>
      The reason for this being that Feijoa has so much personality, it might create a busy page.</p>
      <p>What is your book about?</p>
      <p>Also look at Maurea (similar to Kievit but much less expensive)</p>
      <p>Ronnia is another alternative to Milo if you can chance it.</p>
