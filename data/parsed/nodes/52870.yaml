    <p>If <a href="http://vllg.com/KLIM/Feijoa/mudTyper+Weights/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Feijoa</a> is the main body text in a book, what sans would work well for headings, captions, and back cover text?</p>
    <p>I'm thinking of <a href="http://Vista Sans" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Vista Sans</a>, a squarish sans to complement the curves of Feijoa.  Or would such a contrast be jarring?  Does a curvy serif absolutely need a curvy or neutral sans?</p>
    <p>Thoughts/alternatives?</p>
    <p>Thank you.</p>
    <p>Rahim</p>
