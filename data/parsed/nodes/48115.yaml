    html: |-
      <p>I kept the horizon equal to eye-level to maintain depth, three dimensions. Keeping with the idea that in photography/cinematography, when the subject is above, it diminishes viewer's posture. When the viewer's perspective is from above, it empowers the viewer. This offers a bit of depth towards-beneath the viewer. Which hopefully adds a bit to the idea of the GIS/CAD capabilities of the software.</p>
      <p>It's geospatial features is part of what differentiates it from its competition.</p>
      <p>Getting away from the stereotypical IT elements, I want to convey a bit more dynamism. It's not being marketed to IT departments per se, but to departments, execs, and persons with very basic database knowledge. Because it is a "rapid application development" environment, the point is that almost anyone can easy prototype and create solutions instead of relying on software developers and consultants.</p>
      <p>Or so I am shooting for… =]</p>
      <p>As for colour, we'll be working with a green hue. This is a strategic decision in light of competition primarily using reds.</p>
      <p>I appreciate the feedback so far, though. Thanks! Keep offering insight!</p>
