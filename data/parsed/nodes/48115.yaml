    <p>The software — rapid application development, or RAD — was originally called WebRADE (RADE = rapid application development environment). Shortened it down, and focused on its speed at developing apps and its robustness.</p>
    <p>It's for quickly developing apps that can access a variety of databases and is easy for non-programmers to use. It's also tied in to Autodesk MapGuide, allowing for use of map and GIS info to provide particularly robust applications.</p>
    <p>I wanted to capture the three dimensions, speed, and effectiveness. I also wanted to avoid anything too complex so it can represent the company in light of Oracle, Autodesk, et al.</p>
    <p>Any comments?<br>
    .</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/RADE_Logo_3444.jpg"></div><p></p>
