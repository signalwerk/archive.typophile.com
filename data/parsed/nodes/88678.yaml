      <p>Claire Bibio – <cite>... or they are only for the readers.</cite></p>
      <p>What exactly do you mean by "<em>only</em> for the readers"?<br>
      A four-pages pamphlet may do without page numbers. But if your publication is supposed to have some value beyond being nice to look at, consumed once and then either shelved or trashed, you better provide readers with some markers that allow them to point at any passage such that other readers are able to find it ... A text is to speak and to be spoken about.<br>
      If the text consists of rather short and numbered sections, you might do without page numbers, of course.</p>
