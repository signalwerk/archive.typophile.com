      <p><a class="freelinking external" href="http://home.vicnet.net.au/~typo/glossary/index.htm" rel="nofollow">http://home.vicnet.net.au/~typo/glossary/index.htm</a> – This glossary will help with many of the outer-space terms used here. Otherwise, as I understand it...</p>
      <p>Logical page numbering: PDF readers use this as the primary numbering scheme. The first page in the file is page 1, no matter how much front matter there is before the 'real' page 1.</p>
      <p>Bleed zone: Pages are printed on slightly oversized sheets. The extra bits are then trimmed off to get the correct size, sharp and neat. You can make use of this to let images flush to the edge by letting them extend (bleed) a wee bit into these cut-offs.</p>
      <p>Follow Theunis' advice well, and the printer's gunna think: "Ho! Claire's more pro than she looks like! Major coolness!" It shouldn't harm, either, to ask the printer for the best spot to place the page numbers.</p>
