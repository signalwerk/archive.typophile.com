      <p>Claire, if your files are prepared logically your printer should be able to sequence everything without printed page numbers. However I think page numbers may help reduce the possibility of assembly errors, and at the very least will make it easier for you to proof the job. If your pages aren't numbered, it may be harder for you to spot any pages that are out of sequence in the proof, and it may make it harder for your client to communicate changes to you.</p>
      <p>And incidentally, even though a good printer SHOULD get everything in sequence, printers are human and even a good printer can sometimes make a mistake. A few years ago I was doing a press check at a high-quality print shop and saw a huge stack of brochures (not my job) that had been assembled in the wrong page sequence. My rep told me they were very embarassed by the error and would fix it before delivery, of course, but unfortunately it caused the job to be delivered late.</p>
