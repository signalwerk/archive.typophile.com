      <p>Ah I've been putting all my faith in InDesign for this. In the Printer's Marks section of its PDF export dialog, you have this option to add page numbers. Long time since I had to do that manually.</p>
      <p>The printer needs <em>logical</em> numbers so he can see at a glance if his impositioning is correct. That's much harder if he has to mentally add up leading blanks and/or a roman numbered preamble -- and impossible if he's looking at an un-numbered page.</p>
      <p>Clare, you also mention 'files' -- plural. Your printer is also going to thank you for consecutively numbering the files, rather than naming them "first part", "stuff before first part", "the very first part" (well you get the idea). Put "01 -", "02 -" etc. in front of your own (probably <em>very</em> logical, in your view) file names. Use a leading zero before single digits so no matter what operating system the printer uses, the files will appear in the correct order.</p>
