      <p>Yes, exactly the point I was making in my earlier post. Printers are human and can make mistakes. If the pages don't have printed page numbers (or in this case have an unusual numbering system), a page sequence error may be much harder for the client to notice in proofing. And once you approve the proof,  the printer is off the hook for any unnoticed errors.</p>
