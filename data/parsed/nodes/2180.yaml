    html: <p>I'm not sure it's the kerning that makes it awkward still.  The U seems like such a departure from the character of the other letters.  It's making he space inside the U sort of swell the area it is taking up.  It's such an oddball I want to read it as an icon rather than a letterform, but no visual references come to mind. <br> <br>Is the U saying something different than the other letters?  If not, i'd go ahead and straighten the sides...or bring some of the characteristics of the U you have into the D maybe (might set up some nice rhythm). <br> <br>What's the connection you're working at between the logo you have and the nightclub?  Just wondering <br> <br>-JT</p>
