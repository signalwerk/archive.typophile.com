    html: "<p>Peter: <br> <br>I am sorry I dont' have much time right now to illustrate more appropriately what I will reference, but hopefully this will do. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/21151.jpg\" alt=\"Suede Logo\"> <br> <br>I like where you are headed overall, and I like the hard corners on the \"U\". Rather than morphing the \"U\" into the other letters I would go the opposite direction. The \"U\" has the most character of all the letters, so why not let it set the trend. Do as JT suggested and as I have so poorly illustrated�mold the \"D\" to follow suit. <br> <br>I am seeng the same spacing in the crossbars as Randy, so I flipped the \"E\"s and rotated the \"S\" 180 degrees. I'm not sure how you're measuring them, but there seems to be a pretty clear distinction between the flipped/rotated letter forms and the originals. Also, I wonder if the crossbar on the \"E\"s is long enough. Like I said, I have limited time, so I couldn't try that one. <br> <br>I started to mess with the kerning also, but it still needs a little more caressing. I hope this helps with some further exploration. <br> <br>Aloha! <br>Scott</p>"
