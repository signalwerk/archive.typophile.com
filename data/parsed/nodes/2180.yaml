    html: <p>P.S. <br> I know you dont have much play in this area, but maybe the arms on the 'e' and the 's' could move up just a touch? So the have a little more 'bottom weight', this would offset a little of the over-symetrical shape you have going. <br>Also I love Tiffany's 'U', I think this is really the direction you should take. If you were concerned about a tumbler beeing made after this shape, I think that might even be cool. and asymetrical glass, with a flat side? But maybe I'm crazy. I still say tighten it up a touch, the widely tracked, horizontally skewed logo types are quite cliche for clubs and such. (not to insinuate that yours is <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">) <br> <br>Good work overall. Nice to see some custom lettering done. <br> <br>Hildebrant.</p>
