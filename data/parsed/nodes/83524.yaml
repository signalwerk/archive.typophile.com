    html: |-
      <p>Dave, here's a true story from the days of rubber cement.</p>
      <p>I once worked for a textbook publisher who published a book about behavioral science, and the author's first name was <em>Theadore</em>, not the more conventional <em>Theodore</em>. We hired a freelancer to design the cover and when he submitted his sketch, someone looked at it and said "The author's name is misspelled," but we checked and it was correct. </p>
      <p>We had the designer make the mechanical, and when it was done, someone else asked, "Is the author's name spelled right?" After verifying that it was, we sent the mechanical to the printer, and when the printer sent their proof, the same thing happened: The spelling of the author's name was queried, and yes, it was supposed to have an <em>a</em>.</p>
      <p>A few weeks later, the bound books were delivered, and copies circulated throughout the office. An assistant in the Marketing department came over to Production with a copy of the book and said, "<em>Behavioral</em> is spelled wrong!"</p>
      <p>We looked at the book, the printer's proof, the mechanical, and the sketch, and on every one of them, it said <em>Behaviorial</em>. We had all been looking so hard at the author's unusual name, no one had seen the error in the title.</p>
