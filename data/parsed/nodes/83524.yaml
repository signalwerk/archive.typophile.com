    <p>A terrible nightmare startled me from sleep last night. I was working on a deadline (of course!) and my design existed in only one form: A Letraset sheet. (If you're under 50, <a class="freelinking external" href="http://www.youtube.com/watch?v=ed6iXQW_O1U" rel="nofollow">click here</a>.) As I picked it up, the letters began to curl and peel off the sheet, and they fell to the carpet, where they stuck fast. That's when I awoke in a cold sweat.</p>
    <p>Tell me, fellow typophiles, what typographic terrors haunt your sleep?</p>
