      <p>I really like this -- you should definitely keep developing this. I agree with all that Steven and Jelmar said, except that I dont' dislike the r. </p>
      <p>Some suggestions of my own: There's something weird going on with the M's strokes -- the left middle one seems to oddly taper in the center, which definitely ruins the monoline feel of the letter. I find the left Q too illegible, but maybe you could add a serif or two to the right Q to make it a bit more different in keeping with the rest of the font. I feel the X is too wide, while the Z isn't wide enough. The Y feels unbalanced -- try moving the top two strokes higher. I'd rethink the 1, 9, 6, and 7. The 6 and 7 especially look too much like other letters (b and F). Finally, I'd shrink the top of the 2.</p>
      <p>Again, I really like where you're going with this.</p>
