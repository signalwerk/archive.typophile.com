    html: <p><i>&gt;I meant text font. It was his first there, right?</i> <br> <br>Yes, you're right about that. <br> <br><i>&gt;How so?</i> <br> <br>Because he was talking about increasing legibility in a 7-point design ("I am just cuckoo enough to be intrigued by this problem of getting a thundering big character on a 7-point body"). Would you not agree that larger x-heights and shorter extenders become more important in sub-reading sizes, below 8 point? Dwiggins said, "It is surprising how little descenders and ascenders have to do with *legibility* as such." [WAD's emphasis]. That "as such," I think, is an important qualifier in this context. In Gerard Unger's <i>Quaerendo</i> article, noting differences of opinion on this matter, he said, "Personally, I go along with Dwiggins." Will you now declare Unger to be also lacking in logic? <br> <br>I'm not arguing here that extenders don't play an important role. I think Dwiggins may indeed have underestimated this. But you seem to consistently overplay the importance of this one statement, taking it out of the context of small sizes and parading it out as if it summarized Dwiggins's whole theory of readability, or some such, and then declaring that therefore he must not have taken type design seriously. <br> <br>(As I re-read WAD's original letter, I do see that he makes some connection between this observation of the newsface and his interest with uncial forms. And I will concede that I think this latter obsession was misguided and distracting.) <br> <br>Nevertheless, I do not think that it is fair to say that Dwiggins didn't think extenders played an important role and *therefore*, <i>ipso facto,</i> he was not logical. That's a big leap. It seems to me like saying that Newton was lacking in logic because he insisted that light was a particle. <br> <br>&gt;Any type designer (after Javal) isn't taking things seriously when he <br>&gt;thinks x-height is all that matters. Conclusions derive directly from <br>&gt;understanding, and not having understanding is largely one's own <br>&gt;fault. But since Dwiggins didn't seem to have the mettle for it, maybe <br>&gt;it was excusable?  <br> <br>*Sigh*. Hrant, this seems unnecessarily defamatory. Why must you always be so polemical? So you disagree with some of Dwiggins's thoughts; so you don't think he ever designed anything to best his first text typeface -- can't you just leave it at that? Why must you attack his character?  <br> <br>It seems to me that Dwiggins was one of the more *thinking* type designers of his era, exploring ideas, examining and analyzing. The fact that he did not always draw the same conclusions as you should not mean that he lacked logic or the "mettle" for understanding. <br> <br>The fact that he was not able to embody some of his theories about type into a successful design should not necessarily diminish the value of his thinking about type. (Beware, lest the same charge be levelled at you.;-) <br> <br>-- K.</p>
