    html: <p>Logic and intuition are largely opposed, but they're both important. Few people have both, and if they do, one tends to be suppressed due to social circumstances. <br> <br>Dwiggins had great intuition, but a lack of logic caused him never to make a better font than his first (Electra). Some people make very good revivals, but couldn't make an original design (which requires intuition) if their life depended on it. <br> <br>hhp <br></p>
