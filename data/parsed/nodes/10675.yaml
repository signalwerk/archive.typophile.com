    html: "<p>What does the M-Formula have to do with intuition? It was based on <i>observation</i> and <i>experience</i> in his work with marionettes. <br> <br> <br>Kent, I think Hrant always insists on attacking peoples' character because he is a deeply insecure individual who needs to make himself feel superior to others. Perhaps because his own flaws are so deeply embedded in his personality, he's become convinced that all flaws are flaws of personality; so if someone disagrees with him it must be because that person is 'psychologically weak' or has some similar fault of character. This is why his hermeneutics are always so wide of the mark: he never considers that the other person might <i>not</i> be pathological, let alone that the other person might be at least partly correct, or correct within the context that Hrant ignores to impose his own context. Note that none of this is intended as an attack on Hrant's own character. Even if it were, I hope he has 'the maturity to withstand it'.</p>"
