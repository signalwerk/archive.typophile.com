    html: "<p>I do not think much of the P22 font, much as I generally admire Rich's work. I would not have chosen the model that he did. Paul Shaw, who has spent twenty years studying Dwiggins's work -- especially his lettering (from which this font derives) -- feels that it lacks the quality of the original calligraphy.  <br> <br>Tiffany has kindly provided a rather thorough (if a bit hard to decipher -- on the Mac anyway) brief on the Winchester \"half-uncial\". And a lovely close-up. <br> <br>I will add that Dwiggins designed a more conventional uncial, Experimental No. 264, and a half-uncial companion to the first Falcon design, before the Winchester. Neither of these was completed. The Winchester was completed, along with a conventional roman and italic, but never released to the trade. Fonts of Winchester were cast for hand-setting and used by Dwiggins and Dorothy Abbe at their Püterschein-Hingham press for several books, mostly of Dwiggins's stories (which I believe is what is shown in the first image Tiffany posted above). <br> <br>The uncial experiments have not been a focus of my research (yet), so I can't say much more about them with any real authority. Personally, I do think it was an essentially futile attempt at \"alphabet reform\" and a distraction in the latter part of Dwiggins's career. But Tiffany's right, there are some interesting aspects to the letterforms themselves, from what I've seen. <br> <br>Here's an interesting tidbit: \"Such a letter should not break too sharply with the roman we are used to: it should take our reading habit as a starting point, and make use of as many of the familiar shapes as possible.\" If I didn't know better, I'd say that sounded like another zealous alphabet reformer I know. ;-) <br> <br>-- K. <br></p>"
    html_clean: "<p>I do not think much of the P22 font, much as I generally admire Rich's work. I would not have chosen the model that he did. Paul Shaw, who has spent twenty years studying Dwiggins's work -- especially his lettering (from which this font derives) -- feels that it lacks the quality of the original calligraphy.  <br> <br>Tiffany has kindly provided a rather thorough (if a bit hard to decipher -- on the Mac anyway) brief on the Winchester \"half-uncial\". And a lovely close-up. <br> <br>I will add that Dwiggins designed a more conventional uncial, Experimental No. 264, and a half-uncial companion to the first Falcon design, before the Winchester. Neither of these was completed. The Winchester was completed, along with a conventional roman and italic, but never released to the trade. Fonts of Winchester were cast for hand-setting and used by Dwiggins and Dorothy Abbe at their Püterschein-Hingham press for several books, mostly of Dwiggins's stories (which I believe is what is shown in the first image Tiffany posted above). <br> <br>The uncial experiments have not been a focus of my research (yet), so I can't say much more about them with any real authority. Personally, I do think it was an essentially futile attempt at \"alphabet reform\" and a distraction in the latter part of Dwiggins's career. But Tiffany's right, there are some interesting aspects to the letterforms themselves, from what I've seen. <br> <br>Here's an interesting tidbit: \"Such a letter should not break too sharply with the roman we are used to: it should take our reading habit as a starting point, and make use of as many of the familiar shapes as possible.\" If I didn't know better, I'd say that sounded like another zealous alphabet reformer I know. ;-) <br> <br>-- K. <br></p>"
