  - id: 67033
    user: 1352
    date: 2003-03-05T12:48:00
    date_raw: 5 Mar 2003 — 12:48pm
    votes: null
    html: <p>I know, why don't we have a maturity contest! I wouldn't win but I'm sure I'd enjoy myself. <br> <br>I don't think logic Vs intuition is the real question. I'm sure you'll all agree that each one can lead to exactly the same results. <br> <br>What's important is the transmission of the technique afterwards. If your product is based on pure intuition, you're probably going to have to take on a very bright apprentice and show him/her how you work. With a lot of observation and experience they might pick it up, if they've got the mettle. With a product based on purely logical reasoning, you should be able to write it all down and teach it to 500 kids in an amphitheatre. <br>In my very humble opinion, I think good type design (like most things) is a healthy combination of both intuition and logic. Who cares about the ratio. <br> <br>Matha <br> <br></p>
