    html: "<p>&gt; Electra was Dwiggins's second font. <br> <br>I meant text font. It was his first there, right? <br> <br>&gt; I think you take out of context <br> <br>How so? He said something like \"it's interesting what little role extenders play in legibility\", and he certainly wasn't advanced enough (in that realm) to even differentiate between legibility and readability. Pure blasphemy. <br> <br>&gt; merely reaching a wrong conclusion? <br> <br>Any type designer (after Javal) isn't taking things seriously when he thinks x-height is all that matters. Conclusions derive directly from understanding, and not having understanding is largely one's own fault. But since Dwiggins didn't seem to have the mettle for it, maybe it was excusable? The problem in his case was that: <br> <br>&gt; how do you think this *caused* <br> <br>Because intuition is a fragile thing, very easily crushed by the more tangible formal logic. Logic has to respect intuition; even when the logic is sound, it can end up subverting intuition to the point of sterility; and when it's flawed logic (like WAD's), the result is gradual degradation, like Caledonia. He needed more time - like Gill. <br> <br>hhp <br></p>"
