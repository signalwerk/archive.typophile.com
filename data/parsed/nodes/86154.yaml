    <p>Hey guys, I am designing a new wesbite for a jewellery brand and they use Akzidenz Grotesk CE Roman in their identity but when I want to upload it on the web it says that it's not allowed, does anyone have a recommendation on a similar one that I can use online? Also looking for a bold version :)</p>
    <p>Here's an example: <a href="http://upshizzle.com/pfiles/12366/Akzidenz.jpg" title="http://upshizzle.com/pfiles/12366/Akzidenz.jpg">http://upshizzle.com/pfiles/12366/Akzidenz.jpg</a></p>
    <p>Best,</p>
    <p>F</p>
