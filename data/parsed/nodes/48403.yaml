    html: |-
      <p>I think Stephen is right, but here goes:</p>
      <p>How about Columbus?</p>
      <p>According to Monotype:<br>
      "The Columbus font family was designed to celebrate the quincentenary of the voyage from Spanish shores by Christopher Columbus. The roman is based on types used in Spain by Jorge Coci circa 1513, probably originating from Italy and traveling via France. Columbus Italic is derived from a font cut by Robert Granjon circa 1543 and used by Bartolom de Najra in 1548 to print a famous manual by the writing master Juan de Yciar."</p>
      <p>It's available in a Pro version now, see <a href="http://www.fonthaus.com/products/fonts/view.cfm/sku/MI-OPP711492.cfm" rel="nofollow">here.</a>, and you can get a <a href="http://www.fontmarketplace.com/font/columbus-family.aspx" rel="nofollow">single user, non-pro, no extras version</a> from Ascender for 17.99—perfect to give it a try.</p>
      <p>It's fairly strudy, so I think it would work. I don't know about the long s, though, and I don't think there are swashes.</p>
      <p>And then there's Dwiggin's <em>idea</em> of Spanish, Eldorado: the Font Bureau version has a "micro" and display cuts, but again, I doubt there are any long s's. And, unless Font Bureau isn't saying, no OpenType version, pro or otherwise.</p>
      <p>If swashes, the long s, and OpenType pro are more important than Spanish, Garamond Premier is awfully nice.</p>
