    <p>I'm drawing a complete blank here. I need a typeface which is suitable for bible use, with a historical spanish flavour. Preferably an OpenType font, with historical glyphs like long s etc. Swashes would be nice to have. It should work well in 8 - 9.5 pt sizes in a 51mm column, but it doesn't have to be ultra-compact. I'm trying out Arno Pro, it looks very pretty, but feels a bit, well, italian . . .</p>
    <p>- Andreas Krautwald</p>
