    html: |-
      <p><cite>It is still puzzling that Fonts.com (Monotype) would get something like this wrong on two very popular fonts…</cite></p>
      <p>There is nothing »wrong« with the fonts. The problem is IE with its @font-face implementation. I am not aware that any webfont service provider would solve this problem within the fonts. They work around it dynamically or let you do it yourself by just serving single-style families.<br>
      The internal style-linking wouldn't help much for larger families where the customer might pick random styles from a family and wants to link them together via CSS. </p>
      <p>If you got at 4-style family, just add a conditional comment for IE up to version 8. Within that comment define your 3 additional styles (italic/bold/bold italic) as single families and assign these fonts to every instance of “b”, “strong”, “i”, “em” and the combinations of those. That works all the time for every font and every version of IE.</p>
