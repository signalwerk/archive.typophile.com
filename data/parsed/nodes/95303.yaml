      <p>You shouldn’t have done all this work. First of all, the internal names are usually not used at all. Webfonts might even work if they don't have a name table at all. They are just file references within the browser. From what I read, you also didn't change the fsSelection flags. </p>
      <p>Also, I would not advise to mess with existing TrueType fonts in font editors. If they have manual hinting you will probably strip that in the process. </p>
      <p>So again concerning to your original question:<br>
      Yes, style-linking IS possible in IE up to version 8 for a regular 4-style families, if these families are set up in a certain way internally.<br>
      Usually we can't expect that so you either have faux italic/bold in IE until version 8 or you work around that with one of the methods mentioned above. But basically they all do the same thing. Even if they don't use conditional comments, they use automatically altered font stacks to achieve exactly the same thing. There is no other »magic« is use. Just pick one of the methods and implement it.</p>
