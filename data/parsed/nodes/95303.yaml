      <p>Thanks for the help here! I hadn't thought that using Medium for the 'bold' weight might not work properly. I guess that does make sense if what you're saying about 'internal linking' is true.</p>
      <p>UNFORTUNATELY, I tried swapping out the medium face for demi and even bold. Neither of them made any difference in IE7. (it's currently set for demi now). And even with that, why would the italic face not be displaying properly?!?</p>
      <p>I even tried going so far as to load Century Gothic - the same font we currently have working through FontsLive.com (this is how I've left it for now). Still same issue. So I downloaded the CSS file that is served just to IE from FontsLive.com and mirrored it for this test so that the only difference was the location &amp; names of the font files (even took off the .eot extension that they don't list). Took out all the rules that target other browsers so only the IE stuff was in there. SAME ISSUES!</p>
      <p>It seems like no matter what I try, IE grabs the first face that it sees in the @font-face stack and uses that. Then it applies a 'faux' italic and bold for every instance that is required. If I put the bold face first in the CSS file, it makes all of the type bold, with 'faux' italic and bold applied to those specific instances.</p>
      <p>Argh! From my extensive testing it would certainly lead me to believe that it is 100% NOT possible to do style linking with IE7-8, but yet FontsLive.com and TypeKit somehow magically get it to work!</p>
      <p>- Any other thoughts or things I might have missed???</p>
      <p>THANKS!</p>
