      <p>I have to investigate/test this myself with fonts and old browsers to check, but why would you even want to use web fonts with IE6,7 or 8? They look crap most of the time anyway on XP (or, I could say they don't look so good in any IE).</p>
      <p>But I thought that style linking worked whenever it was properly configured for regular/italic and bold/bold italic, just like for the Office environments back in the day. Here's the fsSelection flags Ralf is talking about I think: <a href="http://www.microsoft.com/typography/otspec/os2.htm" title="http://www.microsoft.com/typography/otspec/os2.htm">http://www.microsoft.com/typography/otspec/os2.htm</a> (search for fsSelection) which is in relation with font naming (<a href="http://www.microsoft.com/typography/otspec/name.htm" title="http://www.microsoft.com/typography/otspec/name.htm">http://www.microsoft.com/typography/otspec/name.htm</a>, read under Name IDs).</p>
      <p>But in any case I would just create the site for modern browsers and then the alternative for old browsers and really check if you want to use web fonts in those cases. No?</p>
