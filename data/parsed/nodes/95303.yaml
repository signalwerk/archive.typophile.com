    html: |-
      <p>It doesn't matter how you setup the @font-face declaration. If the font family itself does not support this internally, you cannot get it to work in IE &lt;=8 in the normal CSS way of declaring one family and different styles of that family.<br>
      The normal way to work around this would be to setup conditional comments to directly target any use of "i", "em", "strong" and so on and apply the individual styles (as single-style family) for IE smaller version 9. You can find example code in the Web FontFont user-guide.<br>
      Webfont services detect the browser for each request, so they can apply such work-arounds on the fly if necessary. </p>
      <p>There are however a few fonts that work without such work-around. Ethan from Fontspring suspected the OS/2 fsSelection flags to be responsible for this.</p>
