      <p>Hi Ralf,<br>
      Thanks for the reply! I appreciate the help.</p>
      <p>I had wondered if the hosted solutions (FontsLive.com or Typekit) were doing some sort of js or other magic to 'redefine' all of my styles for IE7-8. But there are just a couple things that make me wonder if this is really true:</p>
      <p>A) With FontsLive.com at least, we are not using the js method, just one straight line of CSS added to the head. They use @font-face to deliver fonts. I know that they may deliver a separate version of the actual style sheet for each browser, but upon examining the style sheet that appears to be coming into IE, it looks like pretty standard @font-face syntax, just linking to the EOT files. It is using style linking with one family name, and not much more than that.</p>
      <p>B) We do all CSS locally on our site, nothing is added on the hosting site (they do allow you to define CSS rules there usually, but we decline). So the hosted solution would have to parse all of my CSS rules to override them with the specific font face and reset the default bold/italic/bold-italic declarations to 'normal' so that it wouldn't then apply a 'faux' bold/italic on top of the now proper font face. And on large sites we might have 30-40 different rules declaring type to be bold/italic/bold-italic, not just 'strong' &amp; 'em' tags. We see no evidence of this actually happening, though I may be missing it.</p>
      <p>The font we are trying to use is from the same foundry (Monotype), and very similar to, one we are currently using on a hosted solution (Avant Garde local vs. Century Gothic hosted). So we would hope they use similar standards in regards to 'internal' linking. Maybe I can try this with Century Gothic to be certain.</p>
      <p>If it helps, here's a link to the site using FontsLive.com's implementation. We only declare 'Century Gothic Web' (the served font) in 2 places in our style sheets, the main one being on the body &amp; other main elements. And it's not even first in the stack. But bold/italic/bold-italic is defined in many different rules.<br>
      <a href="http://www.raphahouse.org/what-we-do" title="http://www.raphahouse.org/what-we-do">http://www.raphahouse.org/what-we-do</a></p>
      <p>Thanks again for any insight here. Just trying to get to the bottom of it.</p>
