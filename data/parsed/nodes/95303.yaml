      <p>SUCCESS!!!! </p>
      <p>Thank you Ralf for the little hint about the fsSelection flags! I went back in to FontForge and paid a lot more attention to all the tabs in the 'Element/Font Info' section. There are quite a few things, and they're not named by standards (like 'fsSelection'). But I think I found everything, re-generated the TTF fonts, and re-converted to EOT using WEFT. SO nice to finally see it change when I refreshed!!!</p>
      <p>Here's my sample page using Avant Garde, with Avant Garde Medium used for bold/bold-italic:<br>
      <a href="http://joomla25.lanetest.com/index.php/client-test-article" title="http://joomla25.lanetest.com/index.php/client-test-article">http://joomla25.lanetest.com/index.php/client-test-article</a></p>
      <p>So to answer the original question: YES, it is possible to use style linking in older versions of IE, as long as the font metadata is properly setup when it is converted. And it is possible to modify this information if it is not correct by default.</p>
      <p>I'm a bit frustrated with Fonts.com that I had to do all this, but I suppose that's why they don't explicitly support style linking. So FontsLive.com must have done something to the fonts before or during their conversion of them. I really figured this out when I tried converting my Windows desktop version of Century Gothic to EOT and it worked right off. Just can't understand why the web-hosting version of that font (both from Monotype) would be so different in the metadata?!?</p>
      <p>Thanks everyone for the great help!</p>
