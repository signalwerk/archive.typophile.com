      <p>Want an explanation? Wanna get it to work?<br>
      This explains what to do and the underlying theory:</p>
      <p><a href="http://www.eotfast.com/documentation.php" title="http://www.eotfast.com/documentation.php">http://www.eotfast.com/documentation.php</a></p>
      <p>Skip to the section titled <strong>What To Do When You Run Into A Problem</strong><br>
      and then skip to number 3 within that where it says:<br>
      <em>If you are declaring the font as part of a larger Font-Family, the same style and weight as you are declaring for font-weight and font-style in the CSS needs to be defined inside the font, since IE 6, 7, and 8 will read that font data – and possibly override the CSS weight/style settings.</em></p>
      <p>If you don't understand fonts well enough to know what all of this means and what internal settings are involved, I suggest you just fuggedaboudit.<br>
      But if you do - or you take it upon yourself to learn - I assure you that font weight and font-style will work predictably and reliably once you reconcile the internal data of the fonts with the font-weight and font-style properties declared for them in the @font-face declarations.</p>
      <p>Ok?</p>
