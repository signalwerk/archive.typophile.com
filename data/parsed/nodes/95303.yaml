    html: |-
      <blockquote><p>The font we are trying to use is from the same foundry (Monotype), and very similar to, one we are currently using on a hosted solution (Avant Garde local vs. Century Gothic hosted). So we would hope they use similar standards in regards to 'internal' linking.</p></blockquote>
      <p>That does not appear to be the case. You're declaring the Book weight of Avant Garde as the "regular" CSS weight, and the Medium weight as the "bold", and those weights are not linked together internally. Century Gothic Web has four weights with (I'm assuming) standard style linking, and is apparently intended to be "compatible" style-wise to the Century Gothic fonts that ship with various Microsoft products. That allows it to be listed in the font stack after versions that might already be installed locally.</p>
      <p>You could try declaring Avant Garde's Demibold weight as the <code>font-weight: bold;</code> for Avant Garde Book. Likewise, Avant Garde Bold might function as a CSS bold with the Medium weight as regular, if they're linked as such internally.</p>
