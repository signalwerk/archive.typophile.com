      <p>Thanks Ralf! </p>
      <p>I have a message in to someone at Fonts.com trying to ask the FontsLive.com developers how they pull it off. But he was also starting to wonder if the internal metadata style linking was not correct with the EOT files.  If so, this might help me understand why NOTHING I do on my end (CSS tricks, etc.) is making any difference.</p>
      <p>The only thing that is puzzling about this situation is the fact that the font that we have working with FontsLive.com is a Monotype font, so they would have had to get it from the same source as Fonts.com (a Monotype division). But I'm wondering if they made some modifications while creating the EOT files that might have fixed the issues before they started. </p>
      <p>- Is this what you are thinking in regards to the 'flags' not being set right??</p>
      <p>- If this is actually the case, I would also be curious to know if there are any tools/methods that would allow me to 'fix' the metadata/flags for these EOT files so they would work properly??? FontsLive.com somehow did it, as apparently Typekit does as well.</p>
      <p>And according to both of those links you posted for Typekit, they both indicate that the extra 'variation-specific family names' is for when you have more than the default 2 weights in your family. They try to strip families down to the basic 2 weights (normal/bold) and 2 styles (normal/italic) so they work across browsers by default. We are not trying to use more than the 4 basic style/weight variations. </p>
      <blockquote><p>The biggest limitation is that in IE6, IE7, and IE8, you can only link up to four fonts with two weights into a single font-family name before the entire family stops working. In order to avoid breaking things completely in these older browsers, Typekit filters the set of fonts that you select in each family down to a basic four weights and styles when serving fonts to these browsers.</p></blockquote>
