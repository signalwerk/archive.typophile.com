      <p>Like I said before: “real style-linking“ (the way the CSS specs declare it) in IE 6-8 is only possible for certain fonts that have certain flags set correctly. If the font is not set this way, you cannot do anything about it directly. </p>
      <p>You either need to target these IE version with conditional comments or you need to apply work-arounds dynamically. Typekit describes their work-around here: (They basically turn every style into a single family for IE 6 to 8)<br>
      <a href="http://help.typekit.com/customer/portal/articles/6855-using-multiple-weights-and-styles" title="http://help.typekit.com/customer/portal/articles/6855-using-multiple-weights-and-styles">http://help.typekit.com/customer/portal/articles/6855-using-multiple-wei...</a><br>
      <a href="http://blog.typekit.com/2011/06/29/using-typekit-fonts-in-your-own-css/" title="http://blog.typekit.com/2011/06/29/using-typekit-fonts-in-your-own-css/">http://blog.typekit.com/2011/06/29/using-typekit-fonts-in-your-own-css/</a></p>
