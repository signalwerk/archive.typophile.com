    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Surge-460x150-banner_5683.gif"></div><p></p>
    <p>We’re pleased to announce that <a class="freelinking external" href="http://www.typecon.com/register" rel="nofollow">registration</a> for this year’s conference is now open. Take advantage of early bird pricing by registering before May 31st. You can save even more on registration by joining the Society of Typographic Aficionados or renewing your SOTA membership.</p>
    <p>This year’s incredible <a class="freelinking external" href="http://www.typecon.com/program/" rel="nofollow">conference program</a> is starting to come together. Over 100 of the brightest names in type and design will be sharing their knowledge and skills during <a class="freelinking external" href="http://www.typecon.com/" rel="nofollow">TypeCon2011: Surge</a>, including:</p>
    <p>Lynne Baggett, Ed Benguiat, William Berkson, David Berlow, John D. Berry, Scott Boms, Veronika Burian, Aaron Carámbula, Nancy Sharon Collins, Viviana Cordova, Bill Davis, Carolina de Bartolo, Luke Dorny, John Dowling, John Downer, Angela Driscoll, Carol Fillip, Lorrie Frear, Mehmet Gözetlik, Will Hill, Jessica Hische, Otmar Hoefer, Amelia Hugill-Fontanel, Mark Jamra, John Jennings, Kenneth Jones, Akira Kobayashi, Jenny LeBlanc, Gerry Leonidas, Ian Lynam, Grahame Lynch, Erik Marinovich, Ricardo Martins, Erin McLaughlin, Vince Mitchell, Anitra Nottingham, Sharon Oiga, Ketty Miranda Orozco, Leonard Otillio, Dr. Kayanna Pace, David Peacock, Thomas Phinney, Rafael Díaz Rey, Nancy Rorabaugh, Anthony Rozak, David Rozak, Yvette Rutledge, José Scaglione, Juliet Shen, Neil Summerour, Guy Villa, Brian Warren, Jim Wasco, Marcin Wichary, and Onur Yazicgil</p>
    <p>Presentations and workshops will explore topics such as: Japanese typography; the champions of readability; typography for the web; the graphic history behind QSL cards; book design and bookbinding; Fontographer basics; letterpress techniques; connections between lettering and lingerie; historic New Orleans print engraving; the lack of Latin typographic heritage in Turkey; glass gliding; and so much more.</p>
    <p>Keep an eye on the <a class="freelinking external" href="http://www.typecon.com/program/" rel="nofollow">conference program</a>, <a class="freelinking external" href="http://www.typecon.com/workshops/" rel="nofollow">workshop schedule</a>, and <a class="freelinking external" href="http://www.typecon.com/events/" rel="nofollow">special events</a> pages for the latest updates and additions.</p>
    <p>See you in New Orleans!</p>
