    <p>Charles E. Heyer, 1841–1897</p>
    <p>As a young man Charles E. Heyer (1841–1897) worked for the Decker printing company in Germany which later became the government printing office. In 1867 he came to American and worked at the <a href="/wiki/Boston%20Type%20Foundry" class="freelinking" rel="nofollow">Boston Type Foundry</a> for 10 years. He came to Chicago in 1877, and in 1879 joined <a href="/wiki/Barnhart%20Brothers%20and%20Spindler" class="freelinking" rel="nofollow">Barnhart Brother &amp; Spindler</a> and remained there until May 1, 1897, when he died of heart failure.</p>
    <p>Among his typefaces are: Armenian &amp; Extended, Maltese &amp; Open, Occident &amp; Shaded, Lyric, Sylvan Text, Challenge, Emerald, Arcade, Castle, Solar, Grant, Princeton, Fair, Aron, Canton &amp; Open, La Salle, Mazarin, Mayo, Opaque, Heyer, Lightface Era, Lakeside, Princess, Jewel, Grace, Myrtle, and Plate.</p>
