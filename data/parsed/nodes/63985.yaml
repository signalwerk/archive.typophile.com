      <p>How are you planning to use Skolar?</p>
      <p>I've set it for long running text at sizes from 10-11 points and there's something that just doesn't feel right about it. Maybe I've become too accustomed to using warm, flowing faces like Dolly or Feijoa, but there's something rather jarring and distracting about Skolar when set at these sizes. I don't think it's appropriate for setting long running text, at least not at 10-11 points. The Skolar specimen pdf has it set smaller, I think, and it seems to work. </p>
      <p>It shines as a web or display font, however. Go figure.</p>
