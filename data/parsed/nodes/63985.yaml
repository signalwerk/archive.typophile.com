    <p>I'm considering purchasing either Skolar or Mokka, but considering the price of four basic styles will run me, I want to be certain before I buy. I've looked at online specimens of both, but in the past, I've fount that what may look great in that setting, or even in downloaded PDF specimens, ends up looking awful on-screen in Microsoft Word. (Might this be because I'm using Windows, and perhaps these typefaces were designed largely by Mac users for Mac users?)</p>
    <p>I'm not looking for free fonts, or to rip off foundries. What I'm hoping is that someone might be willing to set the attached word document (at least I think it's attached) in either Mokka or Skolar (ideally both, if you can), and embed the fonts so that they'll appear when I open the document. That way, I'll be able to see what they'll look like in actual use, without getting additional access to them before buying. (my email is <a href="mailto:mikebaranowski@gmail.com">mikebaranowski@gmail.com</a>)</p>
    <p>Thanks so much in advance to anyone willing to help me out. I know it's asking a lot, and I appreciate your assistance.</p>
    <p>Michael</p>
