      <p>Simon Robertson pointed me over here. Thanks Simon. </p>
      <p>The fact that you don’t like the PDF rendering, suggests that like many Windows users your preference has been tuned to crisp rendering of Windows and Office bundled fonts like Calibri and Cambria under Windows “GDI rendering”. These TrueType based OpenType fonts have had a level of hinting investment that few third-party font vendors can justify. Occasionally corporate clients, looking to roll out a corporate font across thousands of desktops, might be willing to invest in having a font hinted, but typically for font vendors selling to graphic designers (who are happy with the way Adobe apps render type) would have no need to. So really you have three options, live with the rendering, pick different fonts, or pay to have the fonts hinted.</p>
