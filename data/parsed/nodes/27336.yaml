    html: |-
      <p>In the .otf, classes have different names than in the .vfb; don't expect to find your original names. Also, feature code may look a bit different in the .otf.</p>
      <p>No duplicate class names, then this is strange. You assigned leftside or rightside flags (the checkboxes, either in the classes panel or in the kerning assistance dialog) correctly? Just a guess. But -- to my knowledge -- the warning appeals to duplicate class names. (I had this myself last week, and it took me some time to find the class.)</p>
