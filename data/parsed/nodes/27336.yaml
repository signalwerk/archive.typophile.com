    <p>And then suddenly when I compiled the OT-lookups it happened…<br>
    …The lookups work however, but my once so carefully named kerning and OpenType classes has been reduced.<br>
    For instance: Kerning class “_A1” (right), “_A2” (left) turned into just  “_A” (right).</p>
    <p>[WARNING]  Glyph class @Font Name redefined [/Users/User Name/Library/Application Support/FontLab/Studio 5/Features/fontlab.fea 41]<br>
    [WARNING]  Glyph class @Font Name redefined [/Users/User Name/Library/Application Support/FontLab/Studio 5/Features/fontlab.fea 42]<br>
    [WARNING]  Glyph class @Font Name redefined [/Users/User Name/Library/Application Support/FontLab/Studio 5/Features/fontlab.fea 46]<br>
    –<br>
    [WARNING]  Glyph class @Font Name redefined [/Users/User Name/Library/Application Support/FontLab/Studio 5/Features/fontlab.fea 83]</p>
    <p>Why?<br>
    Please help me!</p>
    <p>// Kristian M</p>
