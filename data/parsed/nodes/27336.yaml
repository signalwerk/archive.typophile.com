    html: |-
      <p>That redefined warning comes up when there are two sets of classes (or duplicate classes). If you imported your features, you may have also imported a set of classes with the features. (The default in FLS5 is to included classes in the feature code) Look in the features panel and see if there are classes listed in the lower right hand panel (under the panel that contains the feature text). If it is there delete it. Then recompie with your original classes.</p>
      <p>James</p>
