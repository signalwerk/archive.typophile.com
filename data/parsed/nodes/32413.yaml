      <p>Miguel, </p>
      <p>Poetica includes up to 9 alternate variants for each uppercase letter. You'd quickly run out of the 20 ssXX sets if you do it your way. </p>
      <p>Each of these variants forms a *set* across the alphabet, i.e. the D.swash5 glyph is of the same stylistic flavor as R.swash5 but of different flavor than R.swash8. So the way Poetica is implemented now actually makes perfect sense in the ssXX world, and makes sense in the salt world. </p>
      <p>Also, while InDesign implements ssXX on an additive basis, Mac OS X’s Cocoa implementation is mutually exclusive. Poetica works well in the mutually exclusive world as well as in the additive world.</p>
      <p>&gt; If we could redo Poetica’s features today, we’d probably<br>
      &gt; do a different combination of ‘salt’ and ‘ssXX’. One<br>
      &gt; possible solution comes to mind:</p>
      <p>Try another, something along the lines of: </p>
      <p><code>feature salt {<br>
      sub A from [A.1 A.2 A.3 ... A.9];<br>
      sub B from [B.1 B.2 B.3 ... B.9];<br>
      sub C from [C.1 C.2 C.3 ... C.9];<br>
      ...<br>
      sub Z from [Z.1 Z.2 Z.3 ... Z.9];<br>
      } salt;</code></p>
      <p>feature ss01 {<br>
      sub [A B C ... Z] by [A.1 B.1 C.1 ... Z.1];<br>
      sub [A.1 B.1 C.1 ... Z.1] by [A.2 B.2 C.2 ... Z.2];<br>
      sub [A.2 B.2 C.2 ... Z.2] by [A.3 B.3 C.3 ... Z.3];<br>
      sub [A.3 B.3 C.3 ... Z.3] by [A.4 B.4 C.4 ... Z.4];<br>
      ...<br>
      sub [A.9 B.9 C.9 ... Z.9] by [A B C ... Z];<br>
      } ss01;</p>
      <p>feature ss02 {<br>
      sub [A B C ... Z] by [A.2 B.2 C.2 ... Z.2];<br>
      sub [A.1 B.1 C.1 ... Z.1] by [A.3 B.3 C.3 ... Z.3];<br>
      sub [A.2 B.2 C.2 ... Z.2] by [A.4 B.4 C.4 ... Z.4];<br>
      sub [A.3 B.3 C.3 ... Z.3] by [A.5 B.5 C.5 ... Z.5];<br>
      ...<br>
      sub [A.9 B.9 C.9 ... Z.9] by [A.1 B.1 C.1 ... Z.1];<br>
      } ss02;</p>
      <p>feature ss03 {<br>
      sub [A B C ... Z] by [A.3 B.3 C.3 ... Z.3];<br>
      sub [A.1 B.1 C.1 ... Z.1] by [A.4 B.4 C.4 ... Z.4];<br>
      sub [A.2 B.2 C.2 ... Z.2] by [A.5 B.5 C.5 ... Z.5];<br>
      sub [A.3 B.3 C.3 ... Z.3] by [A.6 B.6 C.6 ... Z.6];<br>
      ...<br>
      sub [A.9 B.9 C.9 ... Z.9] by [A.2 B.2 C.2 ... Z.2];<br>
      } ss09;</p>
      <p>...</p>
      <p>feature ss09 {<br>
      sub [A B C ... Z] by [A.9 B.9 C.9 ... Z.9];<br>
      sub [A.1 B.1 C.1 ... Z.1] by [A B C ... Z];<br>
      sub [A.2 B.2 C.2 ... Z.2] by [A.1 B.1 C.1 ... Z.1];<br>
      sub [A.3 B.3 C.3 ... Z.3] by [A.2 B.2 C.2 ... Z.2];<br>
      ...<br>
      sub [A.9 B.9 C.9 ... Z.9] by [A.8 B.8 C.8 ... Z.8];<br>
      } ss09;</p>
      <p>The idea is that without any manually-applied <em>salt</em>, the user would switch everything to 1st set by applying <em>ss01</em>, to 2nd set by applying <em>ss02</em>, to 3rd set by applying <em>ss03</em> etc. If the user had manually applied some stylistic alternates to some glyphs in his font, applying any of the <em>ssXX</em> features would still "upgrade" or "spice up" his entire text "by one set up". And additive combination of the sets would have a yet more "accelerating" effect. </p>
      <p>A.</p>
