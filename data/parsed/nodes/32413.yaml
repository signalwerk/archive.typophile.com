      sub U from [U.swash1 U.swash2 U.swash3 U.swash4 U.swash5 U.swash6 U.swash7 U.swash8 U.swash9];<br>
      sub V from [V.swash1 V.swash2 V.swash3 V.swash4 V.swash5 V.swash6 V.swash7 V.swash8 V.swash9];<br>
      sub W from [W.swash1 W.swash2 W.swash3 W.swash4 W.swash5 W.swash6 W.swash7 W.swash8 W.swash9];<br>
      sub X from [X.swash1 X.swash2 X.swash3 X.swash4 X.swash5 X.swash6 X.swash7 X.swash8 X.swash9];<br>
