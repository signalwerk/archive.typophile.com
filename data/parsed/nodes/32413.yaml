      <p>Ps. The implementation shown above has interesting side-effects. E.g. applying ss01, ss04 and ss05 at the same time gives you the exactly original string back. This could be made slightly more interesting if each ssXX feature for each entry glyph moved at a different pace, e.g. ss01 could replace A with A.1, B with B.1, A.1 with A.2 and A.1 with B.2, but ss05 could replace A with A.5, B with B.5, A.1 with B.7 and B.1 with B.3, or something like that. Then additively combining various sets would give you very different combinations :) </p>
      <p>A.</p>
