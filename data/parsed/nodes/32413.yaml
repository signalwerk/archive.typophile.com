      sub G from [G.swash1 G.swash2 G.swash3 G.swash4 G.swash5 G.swash6 G.swash7 G.swash8 G.swash9];<br>
      sub H from [H.swash1 H.swash2 H.swash3 H.swash4 H.swash5 H.swash6 H.swash7 H.swash8 H.swash9];<br>
      sub I from [I.swash1 I.swash2 I.swash3 I.swash4 I.swash5 I.swash6 I.swash7 I.swash8 I.swash9];<br>
      sub J from [J.swash1 J.swash2 J.swash3 J.swash4 J.swash5 J.swash6 J.swash7 J.swash8 J.swash9];<br>
      sub K from [K.swash1 K.swash2 K.swash3 K.swash4 K.swash5 K.swash6 K.swash7 K.swash8 K.swash9];<br>
      sub L from [L.swash1 L.swash2 L.swash3 L.swash4 L.swash5 L.swash6 L.swash7 L.swash8 L.swash9];<br>
      sub M from [M.swash1 M.swash2 M.swash3 M.swash4 M.swash5 M.swash6 M.swash7 M.swash8 M.swash9];<br>
