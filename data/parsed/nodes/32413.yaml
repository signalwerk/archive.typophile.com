      <p>Your ideas for Poetica are quite interesting. But being able to change the default set of glyphs  (@ss00) directly by any of the other sets still makes me uncomfortable.</p>
      <p>In fact, I was just looking at the specimen book* and it's clear that the different sets of capitals were not designed to be interchangeable, at least not all of them. Most of the alternate capital forms are swash versions, therefore changing from plain capitals to swash capitals is a job for 'swsh', not a stylistic sets. Of course, once the basic swash form of the capitals is applied, the stylistic sets can come into play, allowing different flavors of "swashness".</p>
      <p>Another thing I noticed is that the specimen doesn't contain any example of a word set in all caps that is as "swashed" as the examples you made. This is understandable since an all-swash-caps does not only look silly, but it's also difficult to read. The image below reproduces one example found in the booklet.</p>
      <p>*Gorgeous! Unfortunately it's not available in PDF</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/poetica_books_4156.png"></div><p></p>
