      <p>&gt; <em>to me, there no apparent reason why the first set of alternates provided by salt should NOT be compatible with what ss01 offers.</em></p>
      <p>Me neither (but to be correct I should say that an example that contradicts it doesn't occur to me right now), but what I meant was 'salt' might have much more to give than what the user gets when he/she presses the 'Stylistic Alternates' button in Illustrator's UI. And the UI doesn't make it clear to the user that he/she is only getting a subset (the first "layer") of that feature. </p>
      <p>&gt; <em>Of course, *in addition* salt should give the user access to *all other* alternates offered by ss01–ss20. My principle is simple: whatever is in ss01–ss20 should *always* be in salt, because salt is a superset of ss01–ss20, organized differently. salt may contain additional glyphs that are not accessible through ss01–ss20 but anything that is accessible through ssXX should also be accessible through salt.<br>
      I don’t see why salt (being “stylistic alternates”) should NOT include any glyphs that are mapped to “sets of stylistic alternates”, i.e. ss01–ss20.</em></p>
      <p>We agree on that.</p>
      <p>Based on your tables, this is how I see it:<br>
      <code>+—————————+—————+—————+—————+<br>
      | ——————— | ———— salt ————— |<br>
      +—————————+—————+—————+—————+<br>
      | ——————— | — A | — B | — C |<br>
      +—————————+—————+—————+—————+<br>
      | —— ss01 | A.1 | B.1 | C.1 |<br>
      | —— ss02 | A.2 | B.2 | C.3 |<br>
      | —— ss03 | A.3 | B.3 | C.3 |<br>
      +—————————+—————+—————+—————+<br>
      </code></p>
      <p>Using your terminology, the table shows that 'salt' has "wide" (covers A, B and C) and "deep" (can get to all alternates of A, B and C) access, whereas stylistic sets only have "wide" access, as each one is restricted to its own "layer".</p>
      <p>&gt; <em>But I still need to hear a good reason why any ssXX alternates would not be included in salt.</em></p>
      <p>I can't think of one. And it should be said that the opposite isn't true. This is due to the architecture/intentions of both features. 'salt' can contain the same kind of substitutions present in ssXX, but ssXX shouldn't (can't?) contain all types of substitutions that can be implemented in 'salt' (such as one-from-many).</p>
