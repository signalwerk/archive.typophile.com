      <p>Adam wrote:<br>
      <cite>I don’t see why salt (being “stylistic alternates”) should NOT include any glyphs that are mapped to “sets of stylistic alternates”, i.e. ss01–ss20.</cite></p>
      <p>Miguel wrote:<br>
      <cite>Having said that, Illustrator’s implementation of Stylistic Alternates is incomplete since it trims down ‘salt’ to only provide one-to-one substitutions (therefore you can only get access to the first alternate when pressing the button on the UI).</cite></p>
      <p>Reading this thread, one question bugs me: What would an <cite>ideal</cite> implementation and UI of 'salt' in applications look like?</p>
      <p>As to the one-by-one part:<br>
      User selects a glyph and applies 'salt' to receive an (the first) alternate for this glyph. Same for strings, maybe (if 'salt' mirrors 'ss01').<br>
      This however is like applying 'ss01' -- which makes 'salt' superfluous.</p>
      <p>As to the one-from-many part:<br>
      User selects a glyph, and upon right-click/ctrl-click or some shortcut, a popup appears which <cite>only</cite> presents alternates for this glyph. Consider as a more 'interactive' version of the Glyph Palette method. (The way Chinese or Japanese is typed comes to mind!)<br>
      But then, doesn't 'aalt' do the job already? Maybe not: 'salt' is more 'focused', i.e. limits the choice to real design alternates -- as against small cap, uppercase, superior &amp;c alternates.</p>
      <p>It seems that this discussion is about: Does it make sense to use the one-by-one part of 'salt' as a 'ss01' mirror for less advanced applications which don't yet support Stylistic Set features?<br>
      To tweak my question a bit, I would ask: If not for the one-from-many part, for presenting a more focused selection of alternates, what is 'salt' good for at all?</p>
