    html: |-
      <p>&gt; <em>Of course it does not make sense, typographically, to apply “salt” to an entire paragraph as you did.</em></p>
      <p>No, what I did was to simulate the effect of including the same substitutions (present in 'salt') in one Stylistic Set, as you suggested.</p>
      <p>&gt; <em>Similarly, it would not make sense to apply “ordn” or “subs” to an entire paragraph. The user applies these features on his or her discretion, to the glyphs he or she needs.</em></p>
      <p>From this I infer that you understand the differences between 'salt' and 'ssXX', and how they're NOT the same thing. The 'salt' feature is designed to be applied at the user's discretion — in the sense that he/she has the freedom to decide what should be done in a particular situation — whereas 'ssXX' is designed to be applied throughout and make changes to a wide range of elements without requiring the user's decision about every single one of them.</p>
      <p>&gt; <em>There are numerous fonts out there which have stylistic sets that don’t work well when applied to entire words.</em></p>
      <p>I consider that a bad implementation/usage of stylistic sets.</p>
      <p>&gt; <em>Not really. One needs to apply the sets selectively, letter by letter.</em></p>
      <p>The appropriate feature to achieve such behavior is 'salt', not 'ssXX'.</p>
      <p>&gt; <em>Still, you have not explained why something that is doable in Illustrator (apply salt to one, two or three letters at a time) should not be doable in InDesign (apply an ssXX to the same glyphs to produce an analogous effect).</em></p>
      <p>You've already answer that yourself: "[...] it does not make sense, typographically [...]".</p>
      <p>&gt; <em>Poetica includes both a “sub A from [A.1 A.2 A.3 …]”-style salt feature and eleven “sub A by A.1”-style ssXX sets. Garamond Premier Pro does it otherwise. Why?</em></p>
      <p>I was not involved in the development of neither Poetica or Garamond Premier, so I can't say what thoughts went into them. But my view is, when Poetica was developed the ideas behind OpenType features and their implementations in the applications were not as mature as they were by the time when Garamond Premier was developed. Technically wise, Garamond Premier might embody more best practices than Poetica does. That's the price of being a pioneer; nothing is certain, so there's a good chance of not getting it right at the first time.</p>
