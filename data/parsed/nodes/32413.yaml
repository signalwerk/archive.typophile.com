    html: |-
      <p>&gt; <em>Are you saying that when ssXX was conceived, with Poetica being used as an example, Poetica actually was a bad implementation of the ssXX idea</em></p>
      <p>That's possible. My view is that the implementation in Poetica doesn't seem consistent with the result we expect, nowadays, when applying a Stylistic Set.</p>
      <p>&gt; <em>But what you’re saying contradicts the OpenType specification, because the OpenType specification (read my lips:) uses Poetica as an example for ssXX!!!</em></p>
      <p>Dear Adam, you know, better than me, that some aspects of OpenType spec would benefit from a revision, to bring it up to date with our (as a community) current understanding and usage of the technology.</p>
      <p>&gt; <em>Am I to assume that Adobe now recommends to contradict the OpenType specification and disregard its recommendations for the ssXX feature because people who wrote up the ss01–ss20 feature description didn’t know what they were doing?</em></p>
      <p>No. The people that initially wrote it had *very* good and well intentioned ideas, and knew perfectly well what they were doing. Nonetheless, with time ideas get more mature, and I'm of the opinion that some definitions in the OT spec would benefit from being polished and clarified.</p>
      <p>Take the <a href="http://partners.adobe.com/public/developer/opentype/index_tag8.html#rand" rel="nofollow">'rand' (Randomize) feature</a> as an example; it is an excellent idea! Will it ever be implemented? Probably not. Why? Because after all these years we (and I mean font developers and app developers) realized that we can achieve the same result with 'calt'.</p>
