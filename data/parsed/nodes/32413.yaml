      <p>&gt; <em>Similarly, an InDesign CS2 user is able to enable or disable stylistic sets on a per-glyph basis, but also on entire words, sentences, paragraphs or text frames. It is up to the user’s discretion to do or not to do this. The difference between Illustrator and InDesign is that the first gives you just one alternate and the second gives you up to twenty. Right?</em></p>
      <p>It's true that one 'ssXX' can be seen as a subset 'salt'. In other words, 'salt' could be viewed as a 'ss00' (hypothetical Stylistic Set 0). BUT 'salt' is much more than a simple stylistic set, because it was designed to consider one-from-many (GSUB lookup type 3) substitutions as well as one-to-one (GSUB lookup type 1) substitutions, whereas 'ssXX' was only intended to be used  with the latter type of substitutions.</p>
      <p>Having said that, Illustrator's implementation of Stylistic Alternates is incomplete since it trims down 'salt' to only provide one-to-one substitutions (therefore you can only get access to the first alternate when pressing the button on the UI). And this implementation is flawed because it makes 'salt' behave like a simple 'ssXX', which subverts the initial intent of the feature. This also has the side effect of leading users to believe that the two features ('salt' &amp; 'ss01') are the same, when in fact they were created with clear different intents of interaction in mind.</p>
