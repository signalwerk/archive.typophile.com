      <p>If we could redo Poetica's features today, we'd probably do a different combination of 'salt' and 'ssXX'. One possible solution comes to mind:</p>
      <p><code>feature salt {<br>
      sub A from [A.1 A.2 A.3];<br>
      sub B from [B.1 B.2 B.3];<br>
      sub C from [C.1 C.2 C.3];<br>
      ...<br>
      sub Z from [Z.1 Z.2 Z.3];<br>
      } salt;</code></p>
      <p>feature ss01 { # 1 -&gt; 2<br>
      sub [A.1 B.1 C.1 ... Z.1] by [A.2 B.2 C.2 ... Z.2];<br>
      } ss01;</p>
      <p>feature ss02 { # 1 -&gt; 3<br>
      sub [A.1 B.1 C.1 ... Z.1] by [A.3 B.3 C.3 ... Z.3];<br>
      } ss02;</p>
      <p>feature ss03 { # 2 -&gt; 1<br>
      sub [A.2 B.2 C.2 ... Z.2] by [A.1 B.1 C.1 ... Z.1];<br>
      } ss03;</p>
      <p>feature ss04 { # 2 -&gt; 3<br>
      sub [A.2 B.2 C.2 ... Z.2] by [A.3 B.3 C.3 ... Z.3];<br>
      } ss04;</p>
      <p>feature ss05 { # 3 -&gt; 1<br>
      sub [A.3 B.3 C.3 ... Z.3] by [A.1 B.1 C.1 ... Z.1];<br>
      } ss05;</p>
      <p>feature ss06 { # 3 -&gt; 2<br>
      sub [A.3 B.3 C.3 ... Z.3] by [A.2 B.2 C.2 ... Z.2];<br>
      } ss06;<br>
      </p>
      <p>In other words, the user would be able to switch between the different "flavors" of Poetica via 'ssXX', but first he/she would need to specify where he/she would like to see an alternate form, via 'salt'.</p>
