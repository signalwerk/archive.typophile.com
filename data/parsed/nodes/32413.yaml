      <p>OK, unlike you, I didn’t "simulate" anything here. I just typeset the paragraph in Illustrator CS2 using Adobe Garamond Pro, clicked on the frame and then simply clicked on the "Stylistic Alternate" button on the OpenType palette:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/adobegaramondpro_4810.jpg"></div><p></p>
      <p>An Illustrator CS2 user is able to enable or disable stylistic alternates on a per-glyph basis, but also on entire words, sentences, paragraphs or text frames. It is up to the user’s discretion to do or not to do this. </p>
      <p>Similarly, an InDesign CS2 user is able to enable or disable stylistic sets on a per-glyph basis, but also on entire words, sentences, paragraphs or text frames. It is up to the user’s discretion to do or not to do this. The difference between Illustrator and InDesign is that the first gives you just one alternate and the second gives you up to twenty. Right? </p>
      <p>A.</p>
