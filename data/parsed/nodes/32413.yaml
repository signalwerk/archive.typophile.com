    html: |-
      <p>&gt; Does the image below make any sense to you?</p>
      <p>Ah! This is the image I get if I apply "stylistic alternate" in Illustrator to a run of text set in Garamond Premier Pro. Of course it does not make sense, typographically, to apply "salt" to an entire paragraph as you did. Similarly, it would not make sense to apply "ordn" or "subs" to an entire paragraph. The user applies these features on his or her discretion, to the glyphs he or she needs. </p>
      <p>There are numerous fonts out there which have stylistic sets that don’t work well when applied to entire words. </p>
      <p>Take Robert Slimbach’s wonderful creation, Poetica Std:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/poetica1_4163.jpg"></div><p></p>
      <p>Am I suggesting that one should apply <em>ss07</em> to an entire word or paragraph?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/poetica2_3503.jpg"></div><p></p>
      <p>Or <em>ss11</em>?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/poetica3_3798.jpg"></div><p></p>
      <p>Not really. One needs to apply the sets selectively, letter by letter.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/poetica4_3688.jpg"></div><p></p>
      <p>Still, you have not explained why something that is doable in Illustrator (apply <em>salt</em> to one, two or three letters at a time) should not be doable in InDesign (apply an <em>ssXX</em> to the same glyphs to produce an analogous effect). </p>
      <p>Poetica includes both a "sub A from [A.1 A.2 A.3 ...]"-style <em>salt</em> feature and eleven "sub A by A.1"-style <em>ssXX</em> sets. Garamond Premier Pro does it otherwise. Why? </p>
      <p>Regards,<br>
      Adam</p>
