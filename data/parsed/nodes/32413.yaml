      sub Z from [Z.swash1 Z.swash2 Z.swash3 Z.swash4 Z.swash5 Z.swash6 Z.swash7 Z.swash8 Z.swash9];<br>
      } salt;</p>
      <p>feature ss01 {<br>
      sub @ss00 by @ss01;<br>
      sub @ss01 by @ss02;<br>
      sub @ss02 by @ss03;<br>
      sub @ss03 by @ss04;<br>
