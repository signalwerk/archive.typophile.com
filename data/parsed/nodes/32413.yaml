    html: |-
      <p>Miguel, </p>
      <p>to me, there no apparent reason why the first set of alternates provided by <em>salt</em> should NOT be compatible with what <em>ss01</em> offers. Of course, *in addition* <em>salt</em> should give the user access to *all other* alternates offered by <em>ss01–ss20</em>. My principle is simple: whatever is in <em>ss01–ss20</em> should *always* be in <em>salt</em>, because <em>salt</em> is a superset of <em>ss01–ss20</em>, organized differently. <em>salt</em> may contain additional glyphs that are not accessible through <em>ss01–ss20</em> but anything that is accessible through <em>ssXX</em> should also be accessible through <em>salt</em>. </p>
      <p>I don’t see why <em>salt</em> (being "stylistic alternates") should NOT include any glyphs that are mapped to "sets of stylistic alternates", i.e. <em>ss01–ss20</em>. </p>
      <p>Obviously, you know that there are two ways to access <em>salt</em> in Illustrator: "wide" and "deep". The "wide" access through the "Stylistic Alternate" switch in the OpenType palette only gives access to the first alternate but can be applied to an arbitrarily long text. The "deep" access through the Glyph palette gives access to any alternates for a single glyph but can only be applied on a per-glyph basis. </p>
      <p>I think this is actually pretty good, and does its job well. I cannot really think of a reasonable user interface that would combine the "wide" and the "deep" access at the same time. </p>
      <p>To me, simply speaking, salt and ssXX are one and the same matrix but rotated by 90 degrees -- see table: </p>
      <p><code>+———+—————————+—————————+—————————+<br>
      | — | salt(1) | salt(2) | salt(3) |<br>
      | — | —— ss01 | —— ss02 | —— ss03 |<br>
      +———+—————————+—————————+—————————+<br>
      | A | ——— A.1 | ——— A.2 | ——— A.3 |<br>
      | B | ——— B.1 | ——— B.2 | ——— B.3 |<br>
      | C | ——— C.1 | ——— C.2 | ——— C.3 |<br>
      +———+—————————+—————————+—————————+</code></p>
      <p>or viewed from a different angle:</p>
      <p><code>+—————————+—————————+—————+—————+—————+<br>
      | ——————— | ——————— | — A | — B | — C |<br>
      +—————————+—————————+—————+—————+—————+<br>
      | salt(1) | —— ss01 | A.1 | B.1 | C.1 |<br>
      | salt(2) | —— ss02 | A.2 | B.2 | C.3 |<br>
      | salt(3) | —— ss03 | A.3 | B.3 | C.3 |<br>
      +—————————+—————————+—————+—————+—————+</code></p>
      <p>Of course, there may not be a 100% compatibility both ways if there are, say, more "B" alternates than "C" alternates because it is not possible to "skip" positions in the <em>salt</em> indexes. So a realistic scenario might look like:</p>
      <p><code>+———+—————————+—————————+—————————+<br>
      | — | —— ss01 | —— ss02 | —— ss03 |<br>
      +———+—————————+—————————+—————————+<br>
      | A | ——— A.1 | ——— A.2 | ——— A.3 |<br>
      | B | ——— B.1 | ——————— | ——— B.3 |<br>
      | C | ——————— | ——— C.2 | ——————— |<br>
      +———+—————————+—————————+—————————+</code></p>
      <p>+———+—————————+—————————+—————————+<br>
      | — | salt(1) | salt(2) | salt(3) |<br>
      +———+—————————+—————————+—————————+<br>
      | A | ——— A.1 | ——— A.2 | ——— A.3 |<br>
      | B | ——— B.1 | ——— B.3 | ——————— |<br>
      | C | ——— C.2 | ——————— | ——————— |<br>
      +———+—————————+—————————+—————————+</p>
      <p>or viewed from a different angle:</p>
      <p><code>+—————————+—————+—————+—————+<br>
      | ——————— | — A | — B | — C |<br>
      +—————————+—————+—————+—————+<br>
      | —— ss01 | A.1 | B.1 | ——— |<br>
      | —— ss02 | A.2 | ——— | C.2 |<br>
      | —— ss03 | A.3 | B.3 | ——— |<br>
      +—————————+—————+—————+—————+</code></p>
      <p>+—————————+—————+—————+—————+<br>
      | ——————— | — A | — B | — C |<br>
      +—————————+—————+—————+—————+<br>
      | salt(1) | A.1 | B.1 | C.2 |<br>
      | salt(2) | A.2 | B.3 | ——— |<br>
      | salt(3) | A.3 | ——— | ——— |<br>
      +—————————+—————+—————+—————+</p>
      <p>Of course, the corresponding feature code for that would be: </p>
      <p><code>feature salt {<br>
      sub A from [A.1 A.2 A.3];<br>
      sub B from [B.1 B.3];<br>
      sub C from [C.2];<br>
      } salt; </code></p>
      <p>feature ss01 {<br>
      sub [A B] by [A.1 B.1];<br>
      } ss01; </p>
      <p>feature ss02 {<br>
      sub [A C] by [A.2 C.2];<br>
      } ss02; </p>
      <p>feature ss03 {<br>
      sub [A B] by [A.3 B.3];<br>
      } ss03;</p>
      <p>But I still need to hear a good reason why any <em>ssXX</em> alternates would <em>not</em> be included in <em>salt</em>. </p>
      <p>A.</p>
    html_clean: |-
      <p>Miguel, </p>
      <p>to me, there no apparent reason why the first set of alternates provided by <em>salt</em> should NOT be compatible with what <em>ss01</em> offers. Of course, *in addition* <em>salt</em> should give the user access to *all other* alternates offered by <em>ss01–ss20</em>. My principle is simple: whatever is in <em>ss01–ss20</em> should *always* be in <em>salt</em>, because <em>salt</em> is a superset of <em>ss01–ss20</em>, organized differently. <em>salt</em> may contain additional glyphs that are not accessible through <em>ss01–ss20</em> but anything that is accessible through <em>ssXX</em> should also be accessible through <em>salt</em>. </p>
      <p>I don’t see why <em>salt</em> (being "stylistic alternates") should NOT include any glyphs that are mapped to "sets of stylistic alternates", i.e. <em>ss01–ss20</em>. </p>
      <p>Obviously, you know that there are two ways to access <em>salt</em> in Illustrator: "wide" and "deep". The "wide" access through the "Stylistic Alternate" switch in the OpenType palette only gives access to the first alternate but can be applied to an arbitrarily long text. The "deep" access through the Glyph palette gives access to any alternates for a single glyph but can only be applied on a per-glyph basis. </p>
      <p>I think this is actually pretty good, and does its job well. I cannot really think of a reasonable user interface that would combine the "wide" and the "deep" access at the same time. </p>
      <p>To me, simply speaking, salt and ssXX are one and the same matrix but rotated by 90 degrees -- see table: </p>
      <p><code>+———+—————————+—————————+—————————+<br>
      | — | salt(1) | salt(2) | salt(3) |<br>
      | — | —— ss01 | —— ss02 | —— ss03 |<br>
      +———+—————————+—————————+—————————+<br>
      | A | ——— A.1 | ——— A.2 | ——— A.3 |<br>
      | B | ——— B.1 | ——— B.2 | ——— B.3 |<br>
      | C | ——— C.1 | ——— C.2 | ——— C.3 |<br>
      +———+—————————+—————————+—————————+</code></p>
      <p>or viewed from a different angle:</p>
      <p><code>+—————————+—————————+—————+—————+—————+<br>
      | ——————— | ——————— | — A | — B | — C |<br>
      +—————————+—————————+—————+—————+—————+<br>
      | salt(1) | —— ss01 | A.1 | B.1 | C.1 |<br>
      | salt(2) | —— ss02 | A.2 | B.2 | C.3 |<br>
      | salt(3) | —— ss03 | A.3 | B.3 | C.3 |<br>
      +—————————+—————————+—————+—————+—————+</code></p>
      <p>Of course, there may not be a 100% compatibility both ways if there are, say, more "B" alternates than "C" alternates because it is not possible to "skip" positions in the <em>salt</em> indexes. So a realistic scenario might look like:</p>
      <p><code>+———+—————————+—————————+—————————+<br>
      | — | —— ss01 | —— ss02 | —— ss03 |<br>
      +———+—————————+—————————+—————————+<br>
      | A | ——— A.1 | ——— A.2 | ——— A.3 |<br>
      | B | ——— B.1 | ——————— | ——— B.3 |<br>
      | C | ——————— | ——— C.2 | ——————— |<br>
      +———+—————————+—————————+—————————+</code></p>
      <p>+———+—————————+—————————+—————————+<br>
      | — | salt(1) | salt(2) | salt(3) |<br>
      +———+—————————+—————————+—————————+<br>
      | A | ——— A.1 | ——— A.2 | ——— A.3 |<br>
      | B | ——— B.1 | ——— B.3 | ——————— |<br>
      | C | ——— C.2 | ——————— | ——————— |<br>
      +———+—————————+—————————+—————————+</p>
      <p>or viewed from a different angle:</p>
      <p><code>+—————————+—————+—————+—————+<br>
      | ——————— | — A | — B | — C |<br>
      +—————————+—————+—————+—————+<br>
      | —— ss01 | A.1 | B.1 | ——— |<br>
      | —— ss02 | A.2 | ——— | C.2 |<br>
      | —— ss03 | A.3 | B.3 | ——— |<br>
      +—————————+—————+—————+—————+</code></p>
      <p>+—————————+—————+—————+—————+<br>
      | ——————— | — A | — B | — C |<br>
      +—————————+—————+—————+—————+<br>
      | salt(1) | A.1 | B.1 | C.2 |<br>
      | salt(2) | A.2 | B.3 | ——— |<br>
      | salt(3) | A.3 | ——— | ——— |<br>
      +—————————+—————+—————+—————+</p>
      <p>Of course, the corresponding feature code for that would be: </p>
      <p><code>feature salt {<br>
      sub A from [A.1 A.2 A.3];<br>
      sub B from [B.1 B.3];<br>
      sub C from [C.2];<br>
      } salt; </code></p>
      <p>feature ss01 {<br>
      sub [A B] by [A.1 B.1];<br>
      } ss01; </p>
      <p>feature ss02 {<br>
      sub [A C] by [A.2 C.2];<br>
      } ss02; </p>
      <p>feature ss03 {<br>
      sub [A B] by [A.3 B.3];<br>
      } ss03;</p>
      <p>But I still need to hear a good reason why any <em>ssXX</em> alternates would <em>not</em> be included in <em>salt</em>. </p>
      <p>A.</p>
