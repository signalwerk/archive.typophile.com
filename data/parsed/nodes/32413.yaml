      <p>Wow. I went away for a few days and this thread went crazy. I haven't read everything thoroughly, but I have some comments based on what I have read so far (so sorry if I missed something):</p>
      <p>AFAIK, stylistic sets were proposed by John Hudson back in summer 2002 (so maybe he has some further insight). The idea is to express a single design variation that spans multiple glyphs. A "stylistic set" is meant only to be a set of glyphs (i.e. more than one, as I see it) which are collectively a single design variation -- so it can be a set of capitals in Poetica, or the long ascenders in Kigali, or the plain capitals in Bulmer. It's a way of saying, "These alternates belong together."</p>
      <p>It is probably true that we haven't been too consistent about how 'ss**' features are implemented in fonts, but I think it's fair to say that Poetica is well-suited to it.</p>
      <p>Adam, you're example/complaint about applying a set to Poetica "all at once" is valid, but in fairness to whomever authored those features in Poetica (I don't think it was me!), I think it was imagined that the features would be applied to upper/lowercase text, not all-caps. Still, the stylistic sets serve the purpose that 'ss**' was created for, which is to express a shared design trait among glyph alternates.</p>
      <p>As I said in another thread, I don't agree with this idea that alternates should be in both 'salt' and 'ss**' as a general practice (just like you wouldn't put all ligatures from 'liga' in 'clig'). I think the two features are complementary, in that 'salt' handles single alternates, and 'ss**' handles sets of alternates. Like a lot of feature choices, it's harmless, but I wouldn't call it "best practices".</p>
      <p>I am not so sure that there is anything in the 'ss**' description which prescribes that it be applied "all at once". This certainly seems to be the way to go for many stylistic sets, but I don't know that this should be assumed. As we've seen in Poetica, some discretion is sometimes needed. (By the way, we should clarify some of the language Miguel used unintentionally, because in the OpenType vernacular, both 'salt' and 'ss**' are "discretionary", because they're not on by default.) With not too much trouble, an 'ss**' feature can be applied to a character style in InDesign, for example, and applied to the first letter of every paragraph with nested styles. In a case like this, 'ss**' can be very useful and appropriate, without being an "all at once" kind of thing.</p>
