      <p>is there a reason why in Garamond Premier Pro, Adobe chose to include substituions of lowercase letters with their "final" forms in the "salt" (stylistic alternates) feature but did not include the same substitutions in one of the "ssXX" (stylistic set) features, e.g. ss04? Also, these glyphs are not substituted in the "fina" (final forms) feature. </p>
