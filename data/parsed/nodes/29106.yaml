    <p>Hey there, I've been searching for sans and serif pairs for a while now.<br>
    I give great thanks to Crossgrove, hrant and anyone else I may have missed for all the help. You've been great.</p>
    <p>So now, I'd really like to find a sans to pair with Adobe Garamond.</p>
    <p>or...</p>
    <p>If anyone knows of a serif similar to Adobe Garamond that might pair well with Futura or Akzidenz Grotesk...by all means, please let me know.</p>
    <p>I feel as though I'm making a Christmas Wish-List. Ok, for all who may lend a hand, godspeed...<br>
    see you later,<br>
    Jaz</p>
    <p>The samples below are Futura and Adobe Garamond.</p>
