      <p>I would not combine a Rennaissance-Antiqua with a Futura.<br>
      E.g. the italic version of Garamond is a very pretty one. Combining it with the Bauhaus style of Futura does not make sense for me.</p>
      <p>If Futura with an antiqua, I'ld look for e.g. Memphis, Beton or a Monotype Rockwell.</p>
      <p>Georg</p>
