      <p>I like my Baroque paired with a humanist. And two of them that has worked the best for me, believe it or not, are Scala and Quadraat Sans.</p>
      <p>For a less common alternative, try Fontfarm's <a href="http://fontfarm.de/themes/fonts/kofired/index.php" rel="nofollow">Kofired</a> or John Sans.</p>
      <p>For an alternative to Futura, try an architectural sans (how do we come up with such term anyway?) like Verlag or Neutraface.</p>
