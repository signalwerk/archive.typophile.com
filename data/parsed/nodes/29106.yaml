      <p>Hey there, thank you all for your comments! Terrific and very helpful,<br>
      I really appreciate it. Ok, well, here's what I've chosen to do ( I may be breaking rules here, well I most definitely am at the looks of the posts here) I have chosen to use ITC Garamond and Futura.<br>
      Someone suggested to me yesterday (Avant Garde to go with ITC G.) </p>
      <p>Since they are both geometric sans, Avant G. and Futura that is, (excuse my limited typographic vocab is somewhat limited) I thought Futura could work as well. They seem to fit together quite nicely for my purposes (and time constraints).</p>
      <p>Well, I hope I do not disappoint anyone. I've got to do my own thing I guess, but this info you've given me is also priceless, and thank you for the support; again priceless, thank you very much,<br>
      Jaz</p>
