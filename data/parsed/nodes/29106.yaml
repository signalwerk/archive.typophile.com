      <p>I like my Garamonds paired with sans serifs that have a late 19th- or early 20th-century flavor:</p>
      <p>The Benton gothics:<br>
      News Gothic<br>
      Franklin Gothic<br>
      Trade Gothic<br>
      Benton Sans (Font Bureau)</p>
      <p>The unassuming grotesques:<br>
      FF Bau (FontShop)<br>
      Monotype Grotesque<br>
      Super Grotesk (esp. the B weight) (FontShop)<br>
      Maple (Process Type Foundry)</p>
      <p>The more-interesting-or-at-least-less-often-used-than-Futura geometrics:<br>
      Metro<br>
      Erbar<br>
      Nobel (DTL or Font Bureau)<br>
      Proxima Nova (Mark Simonson)</p>
