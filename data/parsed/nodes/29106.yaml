      <p>Futura is surprisingly nice paired with Galliard, which has some of the same genes as Garamond. Something about the simplicity and hardness of Galliard and the proportions of Futura keep them in harmony. </p>
      <p>But if you really want Adobe Garamond, which is much softer, you could look at Cronos, or one of OurType's sans designs might be right: Eva (new), Fresco Sans or Versa Sans.</p>
