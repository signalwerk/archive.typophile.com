  html: |-
    <p>Typofonderie (formely Porchez Typofonderie) is an independent French digital type foundry started in 1994 by Jean François Porchez. He has designed such typefaces as <em>Le Monde</em> for the French newspaper of the same name, <em>Ambroise</em> based on the work of the Didots, <em>Anisette</em>, and <em>Parisine.</em> He also designed the <em>Deréon</em> typeface family for Beyonce Knowles’ House of Deréon fashion line and <em>Sabon Next</em> for Linotype.<br>
    Since 2012, Typofonderie has started to release fonts by other designers than Jean-François Porchez, including <em>Geneo</em> by Stéphane Elbaz <span class="amp">&amp;</span> <em>Mislab</em> by Xavier&nbsp;Dupré.</p>
    <p><a href="http://www.typofonderie.com/">http://www.typofonderie.com/</a></p>
