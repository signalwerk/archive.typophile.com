    Since 2012, Typofonderie has started to release fonts by other designers than Jean-François Porchez, including <em>Geneo</em> by Stéphane Elbaz <span class="amp">&amp;</span> <em>Mislab</em> by Xavier&nbsp;Dupré.</p>
