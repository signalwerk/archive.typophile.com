    html: |-
      <p>It’s a pretty sure bet that your sample is hand-lettered—notice how clumsy the ampersand is, compared to the other letters. And, given the date, the lettering probably was not based on an actual foundry-released typeface: the design is simply way too ahead of the pace of the times to have been commercially viable as a release in metal.</p>
      <p>Or so it seems to me…</p>
