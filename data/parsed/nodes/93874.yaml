  html: |-
    <p>Hello everyone,</p>
    <p>I have attached a scan of the masthead. It reminded me of Wim Crouwel's 1957 Hiroshima poster but this was done almost a decade earlier. The letterforms seem to be drawn on a grid of a 7:2 ratio, if I am correct. Minimal counters and a very graphic, clean appearance.</p>
    <p>Thanks in advance!</p>
