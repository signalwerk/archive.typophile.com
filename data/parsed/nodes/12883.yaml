      <p>Jason</p>
      <p>There is an acceptable way of breaking a line of poetry (by indenting the remainder of the line) but most contemporary poets would be quite upset if you do so. </p>
      <p>I was once shown a manuscript of poems by a well-respected upper midwest poet and commented to the publisher that the poet's habit of using an isolated instance of an extremely long line in an otherwise short line measure poem was problematic both in terms of design and presswork (letterpress). It was simply a comment regarding production rather than a criticism of the work but because of it the publisher decided to give the book to a less fussy and opinionated printer.</p>
      <p>One of the problems with formats (in trade publishing) is that any deviation from standard sizes kicks up the unit price. But yes, you rarely seen oddities from poets who have had some experience on the production end. Walt Whitman wrote extremely long lined free verse but since he also had experience as an itinerant printer he fully understood the need for breaking lines. Even Marinetti understood the restrictions of "the page form" and consulted with his printer as to how to achieve his intended effect.</p>
      <p>Gerald</p>
