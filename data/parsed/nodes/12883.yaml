      <p>Nick, thanks for your comment; I love these questions as they push me to investigate my preferences, and I think that's what learning &amp; experience is based on.</p>
      <p>In this sort of instance I tend to prefer using small caps for headings (unless using caps for a heading &amp; subhead, in which case I use all-caps for the head &amp; small caps for the sub). </p>
      <p>I realize using small caps on their own for a heading isn't the convention, but in many cases I'm drawn to small caps for exactly the reasons you mentioned: less contrast &amp; finesse. To my mind, larger-set caps tend to begin to look a bit too "modern" (that is Bodoni- or Didot-ish), and the delicacy of the serifs begin to irritate me. (Let alone using an actual [optical] Display weight, as there is for Minion.) I'm a sucker for stocky Renaissance type and thus tend to shy away from the sort of refinement you're advocating.</p>
      <p>The odd thing here is that while I favour a darker Book rather than Regular weight, and have a fondness for Medium &amp; Semibold weights of various book faces, Bold and Black weights make me extremely uncomfortable.</p>
      <p>As for the mis-positioned apostrophe, that's an excentricity I haven't quite found the restraint to abandon. If my ongoing journey towards conservative setting continues, it shouldn't be more than a few weeks before I look at that apostrophe in horror. But for the moment I'm going to enjoy its abandon out in the great white open.</p>
