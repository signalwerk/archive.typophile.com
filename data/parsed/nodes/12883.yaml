      <p>hrant: The list I put together was primarily based on my experience with Minion, which is what I use for most of my academic/scholarly book design. Minion's small cap x-height is level with the lowercase (well, very close to it), and while the small cap U is obviously distinct from its lowercase relative, the small cap S is just too similar; thus the word itself is very easily read as "us." While in principle I agree with you (and thus this is an issue I reconsider often), the reality in many of the projects I've worked on is that principle in this case isn't as important as clarity for the reader.</p>
