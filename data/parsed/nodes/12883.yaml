    html: |-
      <p>Nice post Jason!</p>
      <p>I have some comments (excuse me for not using bullets on this list):<br>
      In regard to the last point on bullets, I don't understand why you wouldn't use a period if the items are not continuation of list title. Wouldn't you then choose to capitalize the items, and use a period?</p>
      <p>I also have a preference for en bullets instead of em bullets. Em bullets take far to much attention, especially since they're also indented.</p>
      <p>Here are some notes I have made about bullets, taken from Brinhurst and David Jury among other places. Sorry for not giving credit to everyone, I didn't bother to jot down where I got it from since I only wrote it down for myself.</p>
      <p>Bullets can be solid or outline, and come in two standard sizes, em bullets (which are almost as big as capital letters) and en bullets (which are about half the size of em bullets).</p>
      <p>Em bullets: Are almost always too big, should be limited to cap letters and should be set in outline form for minimum text disruption.</p>
      <p>En bullets: Should centre on cap height when in the beginning of a line and should centre on lowercase x-height when used with lowercase text.</p>
      <p>En bullets can be set even smaller when less emphasis is required, when very many or very few bullets are used, when they’re used with a typeface that has a small x-height and whey they’re used with a condensed typeface.</p>
