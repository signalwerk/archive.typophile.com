      <p>Hi,</p>
      <p>Jason: Thanks for posting the checklist. It's always helpful to see how others do things. </p>
      <p>I have a couple of questions about urls. I'm on the first of 8 books that are peppered with urls -- I'd rather start right than go back and fix things.</p>
      <p>I find it odd to remove the http:// when the address is not preceded by www, especially when the address is buried in text. Is this really standard practice? (Guess I'm a little behind on that one.)</p>
      <p>When the url appears at the end of a sentence within a paragraph, it seems awkward to not include a period. How do you handle those instances? </p>
      <p>From the discussion in this thread I gather this would be the best way of presenting the following sentence:</p>
      <p>Pour obtenir plus d'information, visitez notre site Web à l'adresse design.concordia.ca/</p>
      <p>Thanks for the help. </p>
      <p>Oh, an aside: Jason, I contacted rob mclennan to try and get a copy of your chapbook from him, but he's all out. He highly recommended your book, so I'll be looking for it in stores here. If I don't find it, I'll order a copy. I'm looking forward to reading it immensely.</p>
      <p>Kristina</p>
