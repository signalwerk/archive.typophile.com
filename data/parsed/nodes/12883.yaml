    html: |-
      <p>l_vazquez<br>
      While I'm familiar with Dowding's (and others') view on dashes, and while I recognize Stephen's comment about colour &amp; length, my approach to dashes used for asides -- like this* -- comes down to an editorial perspective. </p>
      <p>Dashes used for this purpose are meant to distinguish a secondary comment (the aside) from the primary statement (the sentence). Using an non-spaced em-dash for this purpose really doesn't make visual sense because such a setting JOINS the two separate components (comment &amp; statement) rather than distinguishing them from one another.</p>
      <p>(Granted, a non-spaced em-dash creates physical space between the sentence &amp; the aside, but the glyph itself creates a visual binding that, to me, works against the purpose of the aside as a comment or response to the sentence it resides in.)</p>
      <p>The same goes for hair-spaced dashes, whether en or em. While Dowding might say that thin- or word-spaced dashes are left "floating," to my mind thin-spacing is the best compromise between editorial clarity and typographic colour.</p>
      <p>*As always, please excuse HTML's clumsy handling of dashes in this example. HTML uses em's rather than en's, which is what exactly the practice I'm speaking against.</p>
