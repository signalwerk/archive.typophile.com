      <p><em>Why include closing slash with simple domains?</em></p>
      <p>One possible explanation is that the formal syntax for a URL requires there to be a path following the domain, and the shortest legal path is "/". But this is a technical argument, not a typographical one. Perhaps some techie had browbeaten you into adopting that rule.</p>
      <p>Another reason might be that a trailing slash serves as a visual marker that this is a URL and not an ordinary word. Usually a leading "www" serves this purpose, but domains don't always include it. If the parts of the domain can together form a word (consider inter.com) it might mask the fact that this is a URL.</p>
      <p>But the trailing slash does look odd.</p>
      <p><em>What do others do with pluralized small cap acronyms?</em></p>
      <p>I don't have any solution but I certainly admire the problem. -- Ashleigh Brilliant</p>
      <p>I do note that I see this phenomenon all the time in <em>The Economist</em> magazine and it throws me off every time. They pay enough attention to this stuff that I'd think they'd do it differently if they could think of a better way.</p>
      <p>s'marks</p>
