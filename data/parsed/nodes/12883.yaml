      <p>Great, thanks to each of you for the input. I'm going to speak to each here, one at a time.</p>
      <p>oyestein (bullets):<br>
      The notes on bullets are very specific &amp; helpful. Any chance you could dig up where they're from? I'm going to add them to the list but would like to give credit. I'll also adjust the list itself to exemplify the practice described (I'll let everyone know when an updated version of the list is ready).</p>
      <p>oyestein (ellipses):<br>
      The samples I have in the list were pulled from the marginal examples in Bringhurst (p.82 in v.3.0), but here are my understandings (please ignore spacing issues in HTML text below):</p>
      <p>"text...text"<br>
      = omission of one or more words</p>
      <p>"text..., text"<br>
      = omission of remainder of comma-distinguished clause</p>
      <p>"text,... text"<br>
      = omission of entire comma-distinguished clause(s) following a comma</p>
      <p>"text.... Text"<br>
      = omission of remainder of sentence</p>
      <p>"text...."<br>
      = omission of remainder of paragraph</p>
      <p>(final period in last 2 examples above could be exclamation or quesion)</p>
      <p>Nick (spacing ellipses &amp; dashes):<br>
      As I mentioned in a comment above, the list I posted is based on my work with Minion (which I use often for body copy) and thus the spacing suggestions are specific to Minion. Beyond that face, the list is meant simply to draw my attention to various tricky settings, each of which will need to be addressed differently depending on the face &amp; size in use at any given time. Thus, the list isn't meant to be accurate in all cases, but is meant to itemize issues that will need to be examined &amp; adjusted in each project.</p>
      <p>Nick (possessive roman "s" with italicized words):<br>
      I agree, it's a bit of a make-work project, but in my experience they don't crop up too often and can be addressed easily enough. The idea here, I think, is to find a solution - specific to each book project - that will work throughout that project and apply it consistently.</p>
      <p>Nick (kerning/spacing proportional oldstyle "1"):<br>
      I think what you're saying here is that generally speaking "1" needs some attention. It is, after all, the loneliest number.</p>
      <p>Nick (roman parentheses with italic content):<br>
      I'm a hard-ass on this one, siding with Bringhurst, and ultimately my opinion here is simply aesthetic: italic parentheses, brackets &amp; braces look ridiculous. Working with an italic "f" and a roman right parenthesis is indeed tricky, but it's doable (this may horrify some, but in the past I've kerned that paren out and then [god forbid] put a 5 degree slope to it [example no longer available].</p>
      <p>Nick (your final comment):<br>
      "Rather than specify procedures for different circumstances, it may be better to suggest a desirable visual outcome, and leave it for the typographer to implement."</p>
      <p>Absolutely. My goal is to set up the list (using Minion) to serve as a visual guide (which happens to have specific directions for using Minion). From there the idea is to examine these issues in whatever face/size I'm using and produce similar visual results.</p>
      <p>Phew. Thanks to each of you for taking the time to respond, I really appreciate the input on these topics. I'm going to try later today to update the list to reflect the suggestions so far, and will let you know when the new verison is posted, but in the meantime please keep'm coming.</p>
