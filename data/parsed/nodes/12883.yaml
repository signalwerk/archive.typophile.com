      <p>bieler: You're absolutely right. What part of this thread has reminded me is that what we're talking about here has nothing to do with setting metal. Coppers &amp; brasses are not hair &amp; thin spaces, and setting lead bullets has nothing to do with tabs. Thus, my notion of producing this list as a letterpress broadsheet has been set aside.</p>
      <p>As for the long-line poems, in addition to designing I'm also a publisher &amp; a poet (if you're really bored <a href="http://www.greenboathouse.com/dewinetz/" rel="nofollow">take a look here</a>), and I think line-length still has plenty of impact on digitally produced books. For example, look at Patrick Lane's recent <em>Go Leaving Strange</em>. It's painful to open. Due to Patrick's desire for a long line, the text measure is less than 1cm from the outside edge, made so much worse by the fact that the body text is set in a condensed face. Sure, the publisher could have moved up to a larger format for the book, but do you know any trade publishers that would do so for a book of poetry (other than Gaspereau [I'm speaking of the Canadian scene here])?</p>
      <p>My point is that as a writer myself it doesn't seem so much to ask that poets recognize the medium they're working with (books), and perhaps learn a tiny bit about their means of production and thus their (commercial) limitations.</p>
      <p>Don't get me wrong, I run a small press for exactly this reason: to produce books that serve the writing, not the other way around. Most trade publishers, however, don't have that luxury.</p>
