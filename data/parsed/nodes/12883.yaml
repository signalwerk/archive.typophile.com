      <p>I also have two comments in regard to ellipses.<br>
      How would you differentiate between the omittance of a word, and the omittance of a sentence? For instance:<br>
      He was going to Norw….<br>
      He was going to Norway….<br>
      Is there any other way to do this?</p>
      <p>And why would you put the comma before the ellipsis and after the first sentence? Doesn't that all depend on wheter the word(s) that have been omitted in the first or the second sentence? If the words have been omitted in the last sentence, I agree, but except for that I think the comma should be placed after the ellipsis, as with all other punctuation marks.<br>
      Here's the excample from your document:<br>
      text,… text</p>
