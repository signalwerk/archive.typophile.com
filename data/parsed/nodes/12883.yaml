      <p>Goudy's idea (which the old guys stole from him) of using an angled hyphen makes a clear distinction between hyphens and dashes.</p>
      <p>***</p>
      <p>As a writer-typographer, I often leverage punctuation to maximize the visual interest of text. I use the em dash as an alternative to little spotty marks (especially the colon) -- it's so much more brisk and exciting! I also use parentheses as part of this visual scheme: text which incorporates parentheses and dashes, as well as the usual spot marks, is very lively. </p>
      <p>So, for an aside, nothing beats parentheses, and then a hearty dash will plunge the reader right back into the main text stream. </p>
      <p>***</p>
      <p>I also find that in (stacked) bulleted lists, the bullet can be a bit strong, and the period-centered a bit weak, while a dash can provide just the right amount of emphasis. A hyphen always looks like something's missing.</p>
    html_clean: |-
