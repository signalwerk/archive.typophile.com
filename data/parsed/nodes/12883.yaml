      <p>Stephen: Good question. I can remember making the decision with a book a while back to include the closing slash, but now that this practice is posed back as a question, I can't seem to find a functional reason. Thanks for drawing attention to this one.</p>
      <p>sergej: I avoid setting US in small caps simply because in many faces, despite obvious context, it has the potential to look like "us" ("We're going to the movies. What to come with us?") USA is a different matter and should, of course, be in small caps.</p>
