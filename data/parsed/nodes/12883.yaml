  html: |-
    <p>Hi folks,</p>
    <p>As I'm sure is the case with most of you, my notebook is randomly filled with various bugs and hiccups that I try to remind myself to scan for when starting work on a new book. The problem, of course, is that these hints &amp; nudges are spread out all over the place. For a while now I've been meaning to compile these notes, and an upcoming wayzgoose has prompted me to put them together either as a chapbook or a series of broadsheets. However, I know that the list I've gathered is cursory and incomplete at best, so I wondered if anyone wanted to add their favourite quirks.</p>
    <p>This list obviously isn't absolute, as various spacing and kerning issues will be different from one face to another. The idea was/is simply to put together a list of things to look for with each project.</p>
    <p>The list has nothing really to do with layout: that is, I haven't put in anything about leading or sizing or H&amp;J settings, etc. This is purely about typesetting issues, such as what to place on either side of an en-dash or how to handle singe-quotes inside double-quotes.</p>
    <p>Also, at the moment the list is specific to the house-style used at <a href="http://www.greenboathouse.com" rel="nofollow">greenboathouse books</a>, a small press I started up a while back. This means many of you will likely have different opinions about many of the setting "rules" I have in the list. Hopefully what I have listed doesn't make anyone too crazy.</p>
    <p>While I'm curious and eager to hear different takes on different bugs, I'm primarily interested in the many details the list is currently missing entirely.</p>
    <p>I realize some out there may not be too eager to give away their secrets, so if you're the quiet type, I understand completely. But for those of you willing to share, please post anything that comes to mind.</p>
    <p>At the moment I've set the list without much hoopla, designing it primarily with a letterpress setting in mind, so it's a fairly humble looking PDF at the moment.</p>
    <p>While this idea started out as a potential reference tool for my students, really it just seems like a good exercise, and while I was at it I thought some of you might like to stretch your muscles a bit as well.</p>
    <p>I look forward to anything you might have to offer...</p>
    <p>Here's the link: <a href="http://www.greenboathouse.com/dewinetz/pdf/a-typographers-checklist.pdf" rel="nofollow">A Typographer's Checklist</a> (so far).</p>
    <p>Jason</p>
