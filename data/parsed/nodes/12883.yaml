      <p>Hi Kristina,</p>
      <p>I tend to set URLs in (non-breaking) italics, and if I had one ending a sentence (which has never come up - almost every instance I've run into has the URL enclosed in parentheses) I would, indeed, set it as you have in your example. The main thing if a reader types in the URL exactly as you've set it, they'll get where they want to go. If you include a closing period, they won't.</p>
      <p>ps. I have a handful of copies of the above/ground chapbook if you'd like one. Contact me off-list for details and to say hello.</p>
      <p>pps. Sorry for not responding sooner; I was out of commission for the a month and have now been busy making up lost time.</p>
      <p>Jason</p>
