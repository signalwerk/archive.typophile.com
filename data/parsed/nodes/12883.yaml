      <p><em>...leverage punctuation to maximize the visual interest...brisk and exciting</em></p>
      <p>Liberating isn't it? Adds to your expressive range. I've done the same kind of leveraging ever since writing with word processors.</p>
      <p>Em dash is dynamic punctuation. It adds movement to a cast of characters dominated by verticality, making it ideal for emphasis or shift of emphasis. In effect you're throwing the reader's eye to the right---with an opening em dash---and sucking the eye leftwards with a closing em dash. The forward shift works for a solo em dash as well.</p>
