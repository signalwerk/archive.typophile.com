      <p>Just some comments about dashes.</p>
      <p>According to Geoffrey Dowding's 'Finer Points in the Spacing &amp; Arrangement of Type' en dashes are rightly used in a sequence of figures, as you have done. </p>
      <p>For text copy he uses em dashes without spaces between words. He points out that in any case dashes should be separated from the word or words they relate to by a hair space only, otherwise they appear to be floating, making the line of text becoming too gappy.</p>
