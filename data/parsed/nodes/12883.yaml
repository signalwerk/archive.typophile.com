      <p>&gt; holding out</p>
      <p>FYI here is a style guide I prepared earlier this century, which shows examples of some of the issues:<br>
      <a href="http://www.shinntype.com/Assets/Depts/Essays/DigginIt.pdf" title="http://www.shinntype.com/Assets/Depts/Essays/DigginIt.pdf">http://www.shinntype.com/Assets/Depts/Essays/DigginIt.pdf</a><br>
      (2.2 Mb)</p>
      <p>Your suggestions for "hair" spacing is problematic in that the effect will vary with different styles of font (especially roman vs italic, and serif vs. sans), and with the different spacing strategies built into fonts. </p>
      <p>* dashes: the amount of sidebearing included with a dash varies with the font. Some have it built-in, others don't. See example.</p>
      <p>* spacing ellipses: similar thing. Traditionally, the ellipsis appears to have been an em in width (1000 units), with the period and comma about a quarter of that. However, many digital fonts have the width of the ellipsis as three times the period/comma (and that's how I do all my fonts), so you don't need to add hairs between it and other marks. </p>
      <p>* possessive "s" is roman in italicized words: this is a real makework project, when you consider the extra kerning that will be involved (could use InDesign "optical" tho'): Also, many fonts have kerned apostrophes (very necessary following "f") already. Sometimes, the different angle can look noticeably silly, like a wrongfont mistake.</p>
      <p>* kerning figures: I consider the sidebearings of the "1" to be part of the character -- when they are too small, as is often the case in proportional figures, it doesn't look right. This is possibly because we see so much of tabular figures, and didone figures, which have plenty of side-bearing built-in to the "1". So when the old-style figure is the "little" 1 that looks like a dotless "i", as is the case with Minion, there really isn't enough "one-ness". Keeping adequate space on either side helps preserve that.</p>
      <p>However, it always helps to kern between a space and a following "1".</p>
      <p>* Roman parentheses with italic content. This is a bit precious. Again, it creates all kinds of kerning problems. Italic f with roman brackets is incredibly horrible, creating gaping wounds in the text flow. The technique can look great for Didone types with their huge pothooks, and other italics with prominent serifs, but creates a really unbalanced inprression with sans serif fonts.</p>
      <p>Rather than specify procedures for different circumstances, it may be better to suggest a desirable visual outcome, and leave it for the typographer to implement. For instance, state that the goal to be attained in a  sequence is the appearance of four equally spaced periods.</p>
