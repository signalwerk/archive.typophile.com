    html: <p>About pluralizing the acronyms. It find it very interesting how different languages solve these types of problems. In spanish I believe there is a convention of doubling the letters in the acronym to indicate plural words, for example the acronym <em>EE.UU.</em> for <em>Estados Unidos</em> (United States). In swedish we typically use a colon, for example <em>IPR:s </em> or in small caps <em>IPR:S</em>.</p>
