      <p>I overlooked one of oyestein's questions above:</p>
      <p>"In regard to the last point on bullets, I don’t understand why you wouldn’t use a period if the items are not continuation of list title. Wouldn’t you then choose to capitalize the items, and use a period?"</p>
      <p>In the document I posted I mentioned 3 types of lists, which I'll run again here with explanations:</p>
      <p>1<br>
      Items are capped with closing punctuation. This is where the title/introduction is a complete sentence, as are the items.</p>
      <p>The list title is what introduces the list:</p>
      <ul>
      <li>Each list item is a complete sentence.</li>
      <li>Complete sentences make use of initial caps.</li>
      <li>Closing punctuation is required for complete sentences.</li>
      </ul>
      <p>2<br>
      Items are not capped and conclude with semicolons. Such lists make up one complete sentence.</p>
      <p>This list has a variety of parts including:</p>
      <ul>
      <li>an introductory clause;</li>
      <li>some bullets;</li>
      <li>and multiple items.</li>
      </ul>
      <p>3<br>
      Items are not capped and use no punctuation. This is a simple itemized list, where the items are not part of the title/introduction.</p>
      <ul>
      <li>white</li>
      <li>black</li>
      <li>red</li>
      <li>blue</li>
      </ul>
      <p>These aren't the best examples, so I may simply be making this more complicated, but this is more-or-less how I set such lists.</p>
