    html: |-
      <p>Oystein, I've avoided issues such as the one you mentioned as there tend to be different schools of thought on whether punctuation should be placed inside or outside quotes. In my part of the world I stick to the following guidelines, but I think this issue is normally a matter of cultural (<em>ie.</em> double-quotes [“x”] vs. guillements/chevrons [«x»]) &amp;/or house style:</p>
      <ul>
      <li>period, comma: always inside right quote</li>
      <li>question, exclamation: inside right quote ONLY if part of quote</li>
      <li>colon, semicolon: always outside right quote</li>
      <li>footnote superscript: always outside right quote (kerned carefully)</li>
      </ul>
      <p>I haven't included this in the checklist as it seems more an editorial decision than a typographic one (despite the fact that I fight for the above when working with [misguided] editors).</p>
      <p>*<br>
      Norbert, thanks too for your suggestions. As above, I haven't bothered to discuss the use of old style or lining figures only because I'm assuming that's relatively obvious. One only has to read a few books on typography to have the proper use of numbers drilled into one's head, and if less than a few such books have been read, one shouldn't be typesetting anything. Ditto for use of small caps: if the font doesn't have true small caps, find another font. And ditto again for small caps after drop caps: this seems more a matter of style than a technical typesetting issue (despite the need for careful kerning after the drop cap).</p>
      <p>As for combing for possible ligs, I've added a new section at the start of the checklist discussing various things that should be noted &amp; potentially replaced throughout a project. Take a look and please do let me know if anyone has anything that could be added to this section.</p>
      <p>Please keep in mind that this little project continues to be ultimately geared to my own taste &amp; needs. I don't suggest that anyone follow these guidelines exactly. Instead, I hope that posting the list might encourage others to modify it to best serve their own workflow.</p>
      <p>Here's the latest version: Typographer's Checklist (v.3)<br>
      [Link removed; see mid-February 2006 posts for a new version of this file.]</p>
