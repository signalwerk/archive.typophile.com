  html: <p>I wonder whether Eric Gill, Englishman, to be sure, but a staunch socialist, would have felt a mild sense of irony to see a typeface of his, 'Perpetua ( Italic)', used on the current Prince of Wales's wedding invitation. Of course, 'Perpetua', at eighty-two years old now, is a classic and represents the best of English design. It has that cunning simplicity that is the essence of elegance and never goes out of style.</p>
