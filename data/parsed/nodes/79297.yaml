    html: |-
      <p>@Nick Shinn:<br>
      <cite>So what are you saying—that people who use Gill Sans or Perpetua are condoning sexual assault?</cite><br>
      No. I don't think that this issue can be simplified to that extent.<br>
      It's a reasonable attitude to take that Gill Sans and Perpetua are in themselves useful things which we should not deny ourselves because of whatever their creator may have done.<br>
      But it's also a reasonable attitude, which should not be condemned as bigoted, to shun those faces as an expression of our revulsion towards sexual assault.<br>
      What I reject in this kind of situation is an insistence on ideological purity. In cinema, Leni Rifenstahl is a pariah, while Sergei Eisenstein is a hero. And yet Stalin killed even more people than Hitler. If these are the results of a consensus on which artists should be shunned produce, they are not results of value: hypocrisy is not valuable.<br>
      Works of art are valuable and useful things, and serious crimes shouldn't meet with indifference. These are both reasonable values - and individuals should be able to balance them in their own way. Free from both an insistence that everyone must stop using Gill Sans and Perpetua or be branded a pedophile sympathizer... and an equally ideological insistence that art is sacred and must be considered in isolation from the "personal" lives of its creators.</p>
