    html: <p>I haven’t looked at the <span class="caps">PDF</span> yet, but from the Flash views I’d say it’s a nice, solid humanist sans. The problem is we have so many of those now, it’s hard to appreciate!&nbsp;:-/ The good news is that your ﬂares (although I don’t see how they might promote “clarity of reading from a distance”) do give the design some subtle originality. And the Heavy has a nice presence. <br><br>For signage I presume this needs to be conservative, but for the retail market you might consider putting some funkiness in it, somehow. A good example of what I’m talking about is <span class="caps">FF</span> Proﬁle. <br><br>hhp <br></p>
