    html: <p>After looking through your <span class="caps">PDF</span> and printing it to my <i>completely</i> undeserving and lowly hp posing as an inkjet. Being extra sensitive to the letter w, I love the fact that yours works. I think this is one character that usually looks frumpy and out of place in other sans types that are trying to maintain constraint. The dot over the i and j, only looked big on my monitor and the remark was supposed to be tongue in cheek, but instead it came across more foot in mouth. Very <i>very</i> nice work. Will there be a condensed version? <br><br></p>
