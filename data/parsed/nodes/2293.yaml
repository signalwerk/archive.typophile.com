    html: <p>Thank you so much, Hrant! <br>I loved Skia since my old Mac and its System 7.5 and I’m sorry its advanced features are built in just as a Quickdraw <span class="caps">GX</span> face. Do you know if someone translated in in Type1, OpenType or something? <br>Cadmus is too wide. A bit narrower and it could be the perfect greek counterpart to the recent Skia. Do you know if Cadmus has a digital version or if Carter is intentioned to work again on Skia. Is Skia still a property of Apple? <br><br>What do you mean by “culturally degenerative designs”? Something like bastard and dull roman fonts designed on the wave of advertising urge from the 1960s onwards we have for&nbsp;latin?</p>
