    html: '<p>Nice clean site. <br><br>I’ll have to check out the <span class="caps">PDF</span> later: I think your server crashed from all the simultaneous downloads! &nbsp;:-/ <br><br><span class="caps">BTW</span>, the loose spacing seems to be right on (for highway signage), partly from what I’ve gathered from James Montalbano. <span class="caps">BTW</span>, he’ll be giving a talk about the topic at <span class="caps">TC2003</span>: you should go and ask him some heavy technical stuﬀ during the <span class="caps">Q&amp;A</span>! <br><br>— <br><br>Hey, you work with Michail Semoglou?! Wow, cool. He showed me his most recent work in Rome — very nice. It’s a very original (and apparently culturally authentic) Greek, and has a subordinate “Hellenized” Latin component — something that hasn’t been done since Carter’s Cadmus in the 70s. Wonderful. <br><br>hhp <br></p>'
