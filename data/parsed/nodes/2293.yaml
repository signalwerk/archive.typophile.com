  html: "<p>Hi! I've just finished my typeface Arrival, designed for signs. It has three variants: Normal, Normal Italic and Extrabold. It was the practical project for my MA Typeface Design course at Reading. Main features of this typeface: <br> <br>_ Large x-height <br>_ Calligraphic flow <br>_ Subtle stroke modulation <br>_ Flaring on stems for clarity of reading from a distance <br>_ Flowing, legible hybrid italic <br> <br>Download the pdf of my specimen booklet if you want to know more about it: <br> <br>http://home.lynx.net/chtam/arrival_spec_web.pdf.sit <br> <br>Here are the images: <br> <br><!---Attachment: arr_norm.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">Arrival Normal<br><a href=\"http://www.typophile.com/forums/messages/29/arr_norm.swf\"><b>arr_norm.swf</b></a> (27 k)</td></tr></tbody></table></center><!---/Attachment-!--> <br><!---Attachment: arr_ita.swf-!--><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">Arrival Normal Italic<br><a href=\"http://www.typophile.com/forums/messages/29/arr_ita.swf\"><b>arr_ita.swf</b></a> (28 k)</td></tr></tbody></table></center><!---/Attachment-!--> <br><!---Attachment: arr_xbold.swf-!--><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">Arrival Extrabold<br><a href=\"http://www.typophile.com/forums/messages/29/arr_xbold.swf\"><b>arr_xbold.swf</b></a> (27 k)</td></tr></tbody></table></center><!---/Attachment-!--> <br> <br>My web site's here: www.keithtam.com <br> <br>Looking forward to your comments. I'm just trying to test the waters on this board... Be honest with your comments, O.K.? <br> <br>Cheers! <br>Keith. <br>Vancouver BC, Canada<!--!-/attachment-!--><!--!-attachment:--><!--!-/attachment-!--><!--!-attachment:--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
