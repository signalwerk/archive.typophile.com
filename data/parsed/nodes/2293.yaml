    html: "<p>Re. Cadmus: I agree that it is generally better than the heavily Latinised old Helvetica Greek, Baskerville, etc., but I still wouldn’t describe it as authentically Greek. It is really a kind of ‘what if?’ historical fantasy, in which Matthew applies the fairly rigid geometry of early Attic inscriptions to a lowercase alphabet that did not exist at the time. It’s interesting and in some respects successful (it doesn’t suﬀer from the deadness and lack of rhythm of the Helvetica), but it is no more authentically Greek than the other types of this period. The straight <i>lambda,</i> the symetrical <i>chi</i> and <i>gamma</i>; the lack of descenders on <i>beta</i>, <i>zeta</i> and <i>ksi</i>; the monodirectional ascender on the <i>delta</i>: none of these are any more authentic to Greek than the serifs on the Baskerville. Perhaps Cadmus just seems more Greek because it is less obviously Latin? <br><br>Anyway, sorry for the digression. Back to&nbsp;Arrival…</p>"
