    html: '<p>M Carter made a slew of Latinized Greeks in the 70s via Linotype, at the sorry-arse request for such culturally degenerative designs by certain Greek news designers. He rightfully had an allergic reaction to this process, and made Cadmus, and unconventional but in a way culturally authentic (at least “lapidarily”) design. About 20 years later he made Skia, which is in eﬀect a Hellenized Latin font: <br><a href="http://www.themicrofoundry.com/other/cadmuskia.gif" target="_blank">http://www.themicrofoundry.com/other/cadmuskia.gif</a> <br><br>Michail’s email: <a href="mailto:msemoglou@operamail.com">msemoglou@operamail.com</a> <br><span class="caps">BTW</span>, a few months ago this place was full <br>of Greeks — maybe they’re still lurking? <br><br>hhp <br></p>'
