    html: "<p>I like the Eurostile with the four dots for an \"o\", but also the \"g\"s with the triangle as a tee. <br> <br>Tail on the \"g\": Chase probably either means the join between the head and the tail of a conventional binocular \"g\", or maybe the protrusion of the tail to the left of the head like in Rudolf Koch's Kabel. <br><a href=\"http://www.myfonts.com/fonts/linotype/kabel/book/win-t1/113786/character/0067/CP2/1/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/kabel/book/win-t1/113786/character/0067/CP2/1/</a> <br> <br>hhp <br></p>"
