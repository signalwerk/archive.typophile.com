    html: "<p>Geoff: <br> <br>This is the first time in a while that I think Avant Garde is an appropriate choice for logotype. As you indicated in your original post, this is a work-in-progress, and as the rest of the posts indicate, you still have a lot of work to do. <br> <br>I like Avant Garde because it is a clean typeface which is appropriate for the golfing community. I also like the implications of balls (we all know what I mean here) created by the circular letterforms. I would suggest exploring more subtle approaches to manipulating the type than what you have done, thus far. <br> <br>The \"W\" with the \"R-ball\" implies a bouncing ball, which I don't think is the most beautiful shot to highlight. If I was showcasing a shot I think it would either be a long drive, or a perfect putt. The drive would require an arc and the putt would require a hole. I don't know if either of these would work into this logo, but you might sketch out a few ideas. <br> <br>The \"L-club\" looks much more like a hockey stick to me. That starts alluding to Happy Gilmore, which albeit is a classic in my eyes, but I don't know how the more serious golfing community views that one. <br> <br>Probably the most simple solution is to put some dimples in the \"O\" and call it good, but my guess is that the \"O\" in golf has been used as a golf ball hundreds of times over (but I can't support that with any research at this time). As I mentioned above, I like the concept of implied balls and subtle letterform manipulation. <br> <br>Good luck! I'm anxious to see what you come up with. <br> <br>Aloha! <br>Scott</p>"
    html_clean: "<p>Geoff: <br> <br>This is the first time in a while that I think Avant Garde is an appropriate choice for logotype. As you indicated in your original post, this is a work-in-progress, and as the rest of the posts indicate, you still have a lot of work to do. <br> <br>I like Avant Garde because it is a clean typeface which is appropriate for the golfing community. I also like the implications of balls (we all know what I mean here) created by the circular letterforms. I would suggest exploring more subtle approaches to manipulating the type than what you have done, thus far. <br> <br>The \"W\" with the \"R-ball\" implies a bouncing ball, which I don't think is the most beautiful shot to highlight. If I was showcasing a shot I think it would either be a long drive, or a perfect putt. The drive would require an arc and the putt would require a hole. I don't know if either of these would work into this logo, but you might sketch out a few ideas. <br> <br>The \"L-club\" looks much more like a hockey stick to me. That starts alluding to Happy Gilmore, which albeit is a classic in my eyes, but I don't know how the more serious golfing community views that one. <br> <br>Probably the most simple solution is to put some dimples in the \"O\" and call it good, but my guess is that the \"O\" in golf has been used as a golf ball hundreds of times over (but I can't support that with any research at this time). As I mentioned above, I like the concept of implied balls and subtle letterform manipulation. <br> <br>Good luck! I'm anxious to see what you come up with. <br> <br>Aloha! <br>Scott</p>"
