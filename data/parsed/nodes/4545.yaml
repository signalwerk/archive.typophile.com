    html: "<p>Chase, now you're just showing off (it takes one to know one :-). Geoff, translation: lachrymal = teardrop-shaped. Pretty rare term. Although useful. But even though I agree with Chase that an ear (what the structure in question is normally called) would help make it more of a \"g\", of course it doesn't have to be lachrymal, and (as Chase says) it probably shouldn't be. And virtually all binocular \"g\"s in <i>any</i> font (not just serif) have an ear. The classical exception is Centaur's Italic (dubbed \"Arrighi\"). <br> <br>-- <br> <br>Chase, I like that teddy-bear \"g\". <br> <br>hhp <br></p>"
