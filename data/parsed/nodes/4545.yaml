  html: <p>G'day <br> <br>I am working on a corporate identity for a business that creates websites for golf clubs. <br> <br>I am trying to avoid illustrating boring symbols ie. golfers, golfballs, putters, or the world wide web. Instead I decided to opt for a typographic solution. <br> <br>I played around with Avant Garde and came up with the idea of using the registered trademark symbol to symbolise a golf ball. <br> <br>It is a work in progress, it is in black and white for the moment. <br> <br><img src="http://www.typophile.com/forums/messages/29/34745.gif" alt="First Idea"> <br> <br><img src="http://www.typophile.com/forums/messages/29/34746.gif" alt="Second Idea"> <br> <br> <br>What do you think?? Some feedback would be excellent. <br></p>
  html_clean: <p>G'day <br> <br>I am working on a corporate identity for a business that creates websites for golf clubs. <br> <br>I am trying to avoid illustrating boring symbols ie. golfers, golfballs, putters, or the world wide web. Instead I decided to opt for a typographic solution. <br> <br>I played around with Avant Garde and came up with the idea of using the registered trademark symbol to symbolise a golf ball. <br> <br>It is a work in progress, it is in black and white for the moment. <br> <br><img src="http://www.typophile.com/forums/messages/29/34745.gif" alt="First Idea"> <br> <br><img src="http://www.typophile.com/forums/messages/29/34746.gif" alt="Second Idea"> <br> <br> <br>What do you think?? Some feedback would be excellent. <br></p>
