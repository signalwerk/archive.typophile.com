    html: "<p>Geoff, to be honest, I didn't really care for the capital G I did either. This last iteration is nice and simple, but I feel that with a simple marque like that you need stronger type. I concur with your use of a sans face, but if you're straddling the upscale/classy set as well as the contemporary and tech-savvy, you may need something with a bit more presence.  <br> <br>I think something simple like Univers Extra Condensed might work, IMO a face with non-circular bowls would complement a circular marque nicely. <br> <br>Hrant: Sorry, sometimes I don't know my tail from my ear <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> I like the teddy-bear too� the uppercase one looks too much like the Gannett marque to me.</p>"
