    html: '<p>Golf balls are small and precious. The logo shown in #4 depicts the ball as being large, due to the large negative counterspace. As a suggestion, try making the green "O" extra bold. The tee would then come down at a sharper angle and therefore look more like a tee. The ball would also appear smaller, like a real golf ball.</p>'
