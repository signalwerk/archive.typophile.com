    html: <p>G'day. <br> <br>It has been awhile. I am up to my ears in design briefs at the moment. During the weekend I managed to find some time to do a few layout sketches. This is a first crack at a sketch I liked. Well, I like to do things simple, but in an original manner. I dont want to copy an over-used sucessful layout or anything. So one of my aims here is to create an unique and creative layout with functionality and (this is going to be difficult!) legibility. <br> <br><img src="http://www.typophile.com/forums/messages/29/35551.gif" alt=""> <br> <br>The letter body text is 10point on I believe 13point Avant Garde Book. The rest of the type is 9pt (I think it is readable, everything I get in the post is just under 9pt) Avant Garde again in varying weights (Bold, Medium and Book). I wanted to enclose the address and contact details into goftball shape, I think this could work. <br> <br>Honest crituque would be fantanstic. Thank you.</p>
