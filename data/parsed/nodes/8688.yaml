  html: '<p>Astype announces the release of Gracia, a classic connected script design coming in four flavors: No. 44, 45, 54 &amp; 55. <br> <br>Like all astype releases, Gracia ships in OpenType format with an extended character set covering a wide range of European Latin based languages. <br> <br>specimens: <br><a href="http://www.astype.de/s/specimen/Gracia_45_web.PDF" target="_blank">www.astype.de/s/specimen/Gracia_45_web.PDF</a> <br><a href="http://www.astype.de/s/specimen/Gracia_55_web.PDF" target="_blank">www.astype.de/s/specimen/Gracia_55_web.PDF</a> <br> <br>Gracia is available through <a href="http://www.astype.de" target="_blank">www.astype.de</a> and <a href="http://www.MyFonts.com" target="_blank">www.MyFonts.com</a>.</p>'
  html_clean: '<p>Astype announces the release of Gracia, a classic connected script design coming in four flavors: No. 44, 45, 54 &amp; 55. <br> <br>Like all astype releases, Gracia ships in OpenType format with an extended character set covering a wide range of European Latin based languages. <br> <br>specimens: <br><a href="http://www.astype.de/s/specimen/Gracia_45_web.PDF" target="_blank">www.astype.de/s/specimen/Gracia_45_web.PDF</a> <br><a href="http://www.astype.de/s/specimen/Gracia_55_web.PDF" target="_blank">www.astype.de/s/specimen/Gracia_55_web.PDF</a> <br> <br>Gracia is available through <a href="http://www.astype.de" target="_blank">www.astype.de</a> and <a href="http://www.MyFonts.com" target="_blank">www.MyFonts.com</a>.</p>'
