    <p>Looking to id these two typefaces. I'm guessing the headline typeface is either Rockwell or Memphis.</p>
    <p>Probably Memphis because Rockwell has a double-story 'a'</p>
    <p>The body text - at first glance appears to be Trade Gothic. </p>
    <p>Any help is appreciated.</p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/WilliamsSonoma_01_5627.jpg"></div><p></p>
