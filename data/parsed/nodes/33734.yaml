      <p>Think about how this stuff works: the paper moves, and the electromagnetized (or whatever) specs of toner are laid down on the paper, line-by-line. So the vertical resolution is a matter of how finely the paper can be moved, and the horizontal resolution is a matter of how finely the toner can be laid down. The former depends on the quality of the paper "tractor" mechanics, the latter on the quality of the electronics as well as the granularity of the toner coming out of the cartridge. Since the way any product like this is put together depends on the price point it is meant to end up selling at, an asymmetrical resolution means that it was much cheaper per dpi to produce either horizontal or vertical resolution. A given company might be able to produce finer mechanics and less fine electronics/toner than another company, and/or they value symmetricity of resolution differently.</p>
      <p>For text, the horizontal dimension tends to need more definition, for things like consistent stem weights and equal counters in the "m" (especially using fonts with bad/no hinting) but most of all for reduced aliasing in italics. For a printer with finer vertical resolution than horizontal, printing text in landscape format gives better results. BTW, don't assume the higher number is the horizontal, since the marketing people will always get the literature to list the higher number first either way.</p>
      <p>And a general problem with asymmetrical resolution is that if you print something like a fine grid mesh (especially a skewed one) the texture and color of the vertical vs horizontal lines will be different.</p>
      <p>In short: Oh brother!</p>
      <p>hhp</p>
