    html: |-
      <p>If it's like the 1022, if you set it to "true 1200" you shouldn't have the resolution enhancement option on (that's for making 600 look more like 1200, which it does, but visibly not enough). You definitely don't want "econo mode" on, since that makes everything gray. On my setup all I did was switch it up to "ProRes 1200" and I get the best it can do. But I also have the density set to 3 (the default), and 5 is too much for me (plus it probably distorts the outlines, not to mention takes you further away from what an imagesetter would do).</p>
      <p>Beyond that the main thing you'll need to worry about is changing the paper type setting as needed. Thicker paper needs more toner fusing time, otherwise the stuff can actually fall off after printing!</p>
      <p>hhp</p>
