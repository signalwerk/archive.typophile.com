      <p>Yup. Inkjets pretty much suck when it comes to rendering fine text; I don’t use them for anything lighter than Akzidenz-Grotesk. I know some crazy design students who can coax amazing output from an inkjet, but that’s because they sit around all day running prints and tweaking settings for every page. </p>
