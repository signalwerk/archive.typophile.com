      <p>There are all kinds of reasons for/problems with laser or inkjet printers. For example, we could never use the highly though of -- and expensive -- Xante because some of its internal software took over &amp; we couldn't do a proper grayscale profile for it. Now that only affects work with images, but images are an important part of our business. Drive by the office &amp; make us an offer -- less than 5,000 sheets through it.</p>
      <p>Always remember that what you are after is total resolution, with all elements considered. So,</p>
      <p>1/Rt = 1/R1 + 1/R2 + 1/R3 + ... 1/Rn.</p>
      <p>If one of those R's is low (like the paper), having high resolution in some other element doesn't help the total resolution all that much.</p>
      <p>My real world test is that a .25-point rule often looks good on a laser printer. It flat-out doesn't work for offset printing (Direct-to-Plate at 2400 dpi), at least, with uncoated stocks. A .33-point rule is the smallest you can get away with.</p>
