      <p>Someone has already explained that a 2400 x 600 printer is basically a 600 x 600 printer where the electronics allow fractional dot positioning. I am sorry to hear that the OP had a bad experience with buying a laser printer that had inadequate support for his computer; but in the case of the Macintosh (and, for that matter, with Linux as well) one must very carefully check on driver support for peripherals.</p>
      <p>This reminds me of something else, though. Some laser printers have a 360 by 360 resolution. This way, they can, without rounding, support type with a 1/72" point, and, like a 300 by 300 printer, also support the 1/60" unit common to Pica and Elite typewriter fonts.</p>
      <p>Some European typewriters, instead of having a character width of 1/10" or 1/12", defined character widths in millimeters. And, of course, for printing, they use Didot points, based on the pre-revolutionary French Pied du Roi, which are about 15/14 of the English-speaking world's points. Have laser printers been designed with a resolution to specifically accommodate this?</p>
    html_clean: |-
