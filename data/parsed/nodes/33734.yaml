      <p>I bought an HP-1022 recently. It was quite a find - no frills, but very affordable and a very small footprint. I did consider some Brother models, but they all seemed cheesy to me, not least because I think symmetrical resolution is important. My only complaint with the HP-1022 is some slight toner scatter towards the bottoms of shapes, visible via a loupe. HP suggested trying different fusing temperatures (easily set via the driver) and even sent me a replacement cartridge, but nothing helped. On the other hand, it's hard to see the scatter with the naked eye.</p>
      <p>In terms of pumping up the color of text rendering, the HP software (at least on Windows) lets you choose a number between 1 and 5 to determine darkness, and it's pretty effective.</p>
      <p>hhp</p>
