    <p>I'm in the market for a laser printer, but I'm a bit flummoxed when it comes to understanding dpi output.</p>
    <p>One of the models does 600 x 600dpi, which is too low for me. Heck even my inkjet did 1200dpi.</p>
    <p>Here's my problem:</p>
    <p>I've narrowed it down to two models. The HP laserjet 1022 does 1200x1200dpi. BUT . . . the Brother HL-2040 does 2400x600dpi. </p>
    <p>Which is better with respect to producing text that is crisp and on the heavier side - as in, which would do justice to Bembo Book?</p>
    <p>Both are b&amp;w laser printers, and those dpi ratings are for text, as far as I know. </p>
    <p>Any help would be appreciated.</p>
