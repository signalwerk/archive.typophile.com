      <p><a href="http://www.druckerchannel.de/cache_bilder/std/textdruck_qualitaetsmodustextdruck_qualitaetsmodus_lf8f80.jpg" rel="nofollow" class="link-external">Samsung ML-3051/letter a (Palatino)/quality mode</a>.</p>
      <p>As you can see, the ML-3051 prints cleaner, (probably!) less glossy (an advantage), but thinner (a bit too thin). I have compared the outline of the Palatino a in Photoshop.</p>
      <p>The buy is not a question of precision only, but also a question of taste. For most digitized typefaces, the ML-4551 is maybe better, because in my opinion most of them are too thin! But in case of Mario Feliciano’s Merlo for example the ML-3051 works perfectly fine.</p>
      <p>I only have to warn you with regard to the resistance of the Samsung toner against mechanical influences. If you fold and unfold paper, the paper looses the toner in the edge. So, if I have to fold paper, I am using an electric iron and hold it shortly to the edge.</p>
      <p>And forget the duplex print of the ML-3051. I tuned mine with a kind of carton rail. Now I am able to print duplex very precise, but I need 20 seconds per page. No, not 20 seconds, I need more time. It takes more time than letterpressing now, lol! But nevertheless I am contented.</p>
      <p>And Samsung has a very bad firmware support. In Germany they send service men to you only for updating firmware, although this could be done by yourself in a few minutes only.</p>
      <p>I have heard, that Lexmark’s toner resistance is very good.</p>
      <p>Hope this was a help!</p>
