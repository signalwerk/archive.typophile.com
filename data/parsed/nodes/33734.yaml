      <p>Thanks for the reply, hrant!</p>
      <p>I actually bought the LaserJet 1020, but I was thinking about returning it because:</p>
      <p>I use an Intel-based Mac, and this little printer is supported by 1) An older HP driver that offers no access to print quality controls, limiting the output to 600 x 600dpi, and 2) An Open-Source CUPS driver which, although allowing access to print controls, prints 600 x 600dpi no matter what I select. This issue with the CUPS driver is confirmed by web sources.</p>
      <p>So I'm basically stuck with a wonderfully compact, reliable (HP), quiet laser printer that is stuck in 600 x 600dpi mode. I compared a page of Underware's Dolly printed with the LJ 1020 to one printed with my Deskjet 5150, which printed it at 1200dpi. Needless to say, my inkjet brought out the warmth of Dolly, and that rich black it is known for. But at 600 x 600 dpi, it basically loses its charm</p>
      <p>Other lasers for Mac are either cheap Brother brands that do 2400 x 600 (why the lowewr vertical res?), or Samsung models that do 1200 x 600. </p>
      <p>The only 1200 x 1200 laser from HP that is in my price range is the Laserjet 1022, but that also is stuck at 600 x 600dpi on the Open Source drivers. It does have a Mac driver from HP, but I can't tell whether it just allows basic printing (what I'm stuck with now) or access to advanced functions. </p>
      <p>I feel like tearing my hair out.</p>
