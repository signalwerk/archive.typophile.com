      <p>A Didot point is about 0.0376 millimeters, so one could imagine it being approximated by 0.375 millimeters. I would assume that 10 pitch typing would be approximated by letters that are 2.5 mm wide; 12 pitch is 2.12 mm, so 2 mm is possible, but I vaguely remember instead seeing 2.25 mm given as a width of characters on a European typewriter.</p>
      <p>0.375 is three times 0.125, or 1/8, so 8 dots per millimeter, or 203.2 dots per inch, would serve both the Didot point and the common European typewriter pitches well. Of course, that is too low for laser printer quality, but any multiple - 16, 24, and so on, dots per millimeter should work well.</p>
    html_clean: |-
