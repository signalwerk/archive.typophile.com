      <p>Since this thread has risen from the ashes, I might mention that in my web searches on this topic, I found that some early Autologic laser printers had a 723 dpi resolution. This shrunk the output just enough so that if the software assumed a 720 dpi resolution, and used the conventional 1/72" point, the point size would actually be shrunk to 0.01383126... inches, which approximates a real official printer's point of 0.013837 inches.</p>
      <p>Further pursuant to this topic, I've modified <a class="freelinking external" href="http://www.quadibloc.com/other/cnv01.htm" rel="nofollow">this page</a> on my web site by adding a table comparing several possible laser printer resolutions in the neighborhood of 1080 dpi, showing how closely these resolutions could approximate both the Didot point and either the standard English printer's point of 0.013837 inches or its nominal 1/72 inch replacement in the computer world.</p>
