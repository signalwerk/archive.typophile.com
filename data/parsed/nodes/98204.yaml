      <p>Try the (german) forum <a href="http://www.typografie.info" rel="nofollow">typografie.info</a>, some blackletter experts are attending there. </p>
      <p>Or try to contact <a href="http://www.typosition.de/kontakt" rel="nofollow">Peter Reichardt</a>. He is one of the best in having knowledge of extinct (german) typefaces. </p>
      <p>Another one could be <a href="http://www.druckerey.de/index.php/kontakt.html" rel="nofollow">Martin Z. Schröder</a> from druckerey.de. He works, publishes and writes about old typefaces. </p>
      <p>I had a look at the site of <a href="http://www.romana-hamburg.de/Fraktur.htm" rel="nofollow">Dipl.-Ing. Gerhard Helzel</a>, but have only found some lookalikes. </p>
      <p>That's what I can recommend.</p>
