    html: |-
      <p>Hints:</p>
      <p>1. The letters FS can be seen somewhat hidden in the frame ornaments for some initials (D, E, G, I and N).</p>
      <p>2. There exists one "Potsdam" typeface family designed in 1934 by R. Golpon for J.D. Trennert und Sohn. However, they do not seem to have designed/released the "Potsdam Initials".</p>
      <p>Thanks again.</p>
