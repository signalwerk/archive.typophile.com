  html: |-
    <p>Hello,</p>
    <p>I would be very grateful if someone could tell me about the original (historical) source for the so-called "Potsdam Initials" as appearing in one of Dan X. Solo's books for Dover Publications ("Celtic and Medieval Alphabets", 1998). I am finishing an OpenType adaptation of such initials and would like to credit them appropriately (or ask for the corresponding permissions in case they are somehow copyrighted).<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/s_potsdam_5044.png"></div><p></p>
    <p>Thanks in advance for your help.</p>
