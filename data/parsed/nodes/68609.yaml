      <p>@Ralf: From the <a href="http://www.fontshop.com/blog/?p=1661&amp;utm_source=NewsletterFeb2410&amp;utm_medium=web&amp;utm_content=LearnMore&amp;utm_term=em&amp;utm_campaign=FF52Web" rel="nofollow">Fontblog</a>.</p>
      <p><strong>Question:</strong> I’m not clear about the licensing. Does this mean that the licences are only sold to organisations that own/operate a website? As a freelance designer, does that mean that every one of my clients has to buy a separate licence to use for their websites? Or does the licence somehow allow me to set up websites for a number of clients under my own licence?</p>
      <p><em><strong>Answer:</strong> The Web FontFont license applies to the the organization whose websites will be implementing the fonts. Your first question is correct: each of your clients will need their own licensing for use on their websites, depending on their number of monthly pageviews. The “User” would be your client, even if you as the designer are the one writing the CSS.</em></p>
