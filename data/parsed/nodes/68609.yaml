      <p>Frank, it seems the issue that you're struggling with is in who owns &amp; pays for the license. </p>
      <p>When a designer buys a print license, they own the license to use for any print project. Now, they may choose to charge that fee to a client (or not), but ultimately the licensee is the designer.</p>
      <p>However, when it comes to webfonts, the owner of the license is the client. They are the ones using it and who need the ongoing usage of that typeface. Thus, the fee is paid completely by the client and while a designer (or developer) may use the typeface for development purposes, the license is transfered over at the conclusion of the project. In this case, it seems that the designer <strong>cannot</strong> use the font for any future projects because they no longer own the license. </p>
      <p>At the end of the day, clients are forced to pay more, but they are also the ones using the webfonts, so it makes sense?</p>
