      <p>I am very interested into this discussion. But not as a developer like you guys, but as a user and owner of web sites. Yesterday I started a discussion about it on my own blog.</p>
      <p>Some questions, please:</p>
      <p>— What about the security? As I understand, right now its very easy to copy the font, which is used with font face.</p>
      <p>— Do you expect web versions of all (new and existing) fonts as a kind of general feature within the next years?</p>
      <p>— Do you see your new options to earn money with font face technology? E.g. I am using Futura book for all printed material of my company. And I'ld love to see Paul Renners Futura on my websites, too. Yes, I'ld be willing to pay for it.<br>
      How much more will it be interesting for larger companies with their own fonts?</p>
      <p>— Could it be, that the foundries itself are not too interested into this feature? As I understand, IE is theoretically offering this feature since 1999 with IE 5.0. Why did not see someone this big choice?</p>
      <p>Georg</p>
