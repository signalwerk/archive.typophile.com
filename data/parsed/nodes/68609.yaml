      <p>@Nick:<br>
      Have you considered just releasing the core weights (reg, italic, bold, bold italic)? That’s probably what most people would buy anyway. It won’t be such a big investment, leaving financial room for an upgrade later.</p>
      <p>@James:<br>
      <em>How much are you willing to pay?</em><br>
      I just realized the Web Fontfonts must be licensed per domain/business. I understand the additional payment for large scale corporations, but depriving the designer of the possibility to fund fonts over multiple projects is – IMHO – a bad idea. </p>
      <p>I personally think the price range should be about 3/4 the price of print fonts, or 1/2 the price if you’ve already licensed the print fonts.</p>
