    html: |-
      <p>@Thomas Phinney and all:</p>
      <p>I spent considerable time with the IE9 Preview over the past few days. The future of text rendering on Windows can be seen easily by anybody who downloads it AND is using nothing earlier than Vista SP2. (And therein lies the rub. XP users are 66% of Windows users. Reduced to marginality in five years? I don't think so.)<br>
      I will be posting some screenshots on my <a href="http://readableweb.com" rel="nofollow">blog</a>.<br>
      I'm very impressed with DirectWrite. If it looks good, it is good. And it looks damned good. I'm "profoundly wowed" - as Tim Gunn puts it on Project Runway.</p>
      <p>Thomas Phinney wrote: <em>I think auto-hinted TTFs will be more common than CFFs for online use in the next five years, because they will render about as well as CFFs in near-future Windows browsers, and they won't suck nearly so much as CFFs in old Windows browsers.</em><br>
      More common? Does a choice really exist?</p>
      <p>Also on my blog, today, is a makeover of a <a href="http://readableweb.com/fontface/tenfree/tengreat.htm" rel="nofollow">page</a> - with the fonts converted to TTFs and viewable in IE - called Ten Great Free Fonts that was originally published using <em>only</em> OTF CFF fonts (by Ralf Herrmann).<br>
      The conversions were done using TypeTool 3. I also added autohinting using TypeTool 3.($99). It takes me about 3 minutes to convert and autohint a font. (That's not rhetorical, I timed it - 3 minutes, tops.)<br>
      Results vary from font to font. But it is a one-click operation. I'm training one of my Yorkshire Terriers to assist me. And for some fonts, the results are quite acceptable overall. Of course a professional grade tool like Fontlab offers more finely-graded options for auto-hinting. I'm not yet proficient enough to get a handle on how long an acceptable job would take in FontLab but maybe you could help me out with a estimation.<br>
      (During the brouhaha over Boing Boing's experience with <a href="http://www.thomasphinney.com/2009/10/boing-boing-redesign-uncovers-web-font-ignorance/" rel="nofollow">web fonts</a>, concerning the problems with the font BPreplay, regarding possible solutions you posted:<br>
      <em>Somebody who knows what they’re doing could spend ten minutes and either fix the font’s hinting...</em><br>
      So, I guess the question is, how long would it take on average? Is the requisite facility with auto-hinting a part of most type designer's skill set?<br>
      Is there a step-by-step procedure that one could document that would lead, in most cases, to an acceptably hinted TTF?<br>
      Fontlab's documentation is helpful, but more all-purpose, untargeted.</p>
      <p>Regards,</p>
      <p>Rich</p>
