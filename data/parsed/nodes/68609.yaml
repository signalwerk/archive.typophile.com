    html: |-
      <p><em>As long as the browser and OS manufacturers keep placing the hinting burden on the type designer, this whole web fonts thing is going to take a very long time.</em></p>
      <p>I think for a lot of foundries, largescale offerings of webfont licenses won't make sense until the major browsers provide decent rendering for CFF OpenType fonts. The good news is that both IE9 and an unspecified upcoming FireFox release (already in testing) will use DirectWrite rendering on Windows instead of the old, crap GDI PS rasteriser. Of course, the availability of browsers that display CFF fonts well on Windows won't automatically translate into the majority of users upgrading to these browsers, but the lack of such display in current browsers causes a major bottleneck for webfont licensing. Simply put, most foundries don't have the resources to convert entire libraries to TTFs. So as we've seen with FontShop, foundries might initially offer only a limited selection of fonts for web licensing: meaning, of course, making guesses or conducting customer surveys to find out which fonts have a market for web use.</p>
