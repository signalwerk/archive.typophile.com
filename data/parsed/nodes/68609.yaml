      <p>&gt;I suspect my expectations are shared with many other designers, something font sellers should consider.</p>
      <p>I agree Frank. But I'm having trouble figuring out how it's more expensive for anyone. I mean, it's more expensive than using Verdana and Times, but it's not more expensive than having X-number of copies of a commercial font in a multi-cpu enterprise, using that asset to develop print materials that then need tons of physical assets and labor to get to market, is it?</p>
      <p>With regards to the process, in many of these schemes the web designer has the ability to register at any or all of the forthcoming web font hot spots, and when a client calls, the designer can spring into action and test license some fonts that meet the clients needs, direct the client to the designer's development site where the client can make or not make a preliminary decision before the trial period ends, but at any time, the client can extend the trial period by test licensing the same font themselves. </p>
      <p>Once the decision's been made, the client can decide how to license the font for their web use, to self-serve or not, as the font licensor offers, and the designer can either continue with the client's needs, using the client's links to the fonts, or go on to the next client via the exact same process. At any time during the trial period, the designer and client can take screen captures of the work, and they themselves or trial users can examine the site in as many live environments as they wish.</p>
      <p>At no time in this process does the designer, client or user need to worry about html, font formats, sub-setting, serving, or keeping track of possibly hundreds of font files.</p>
      <p>So, what exactly do you wish worked differently?</p>
      <p>Cheers!</p>
