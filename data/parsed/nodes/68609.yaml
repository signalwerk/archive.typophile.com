      <p><em>Again: Who is that?</em></p>
      <p>You'll have to ask FontShop how <em>they</em> define ownership. I'd say that a website is owned by the entity that claims the domain and the content as a direct asset.</p>
      <p>I suppose there will be cases in which it isn't obvious to a casual observer who owns what, but that is one reason why contracts exist: to clarify who owns what. In some situations, much will depend on the corporate structure of the client and who exactly within that structure is contracting the licensing of a webfont and then where that webfont is used. Let's say a corporation has a number of independently operating subsidiaries. If the client is one of those subsidiaries, and that is the entity licensing the webfont, then only sites owned by that subsidiary may use the font. Now, let's say the parent company licenses the webfont; does that mean that it can be used on all the websites of all the subsidiary companies? Not necessarily -- and in fact probably not --, because those websites are direct assets of the subsidiaries and only indirect assets of the parent company.</p>
      <p><em>Both print fonts and web fonts are manufactured, produced and delivered to the person buying the license in virtually the same manner.</em></p>
      <p>I think what David is pointing out is that in print media the designer determines the typography of a fixed text; whereas on the web a font determines the typography of a dynamic text in a way that a) is only partially determined by the designer and b) relies on the presence of the font not as a layed out display of glyphs but as a functioning piece of software in the hypertext delivery mechanism. In print, the typography is done long before the job actually hits the presses. On the web, the typography is being done on-the-fly. Put another way, a web designer isn't doing typography at all, except at the most macro level: he or she is defining the framework within which typography happens.</p>
      <p>I'm following the CSS3 spec development quite closely, and although it puts a *lot* more typographic tools in the hands of web designers, I think the basic distinction between print/static typography and web/dynamic typography remains. It is a distinction of when and where the laying out of text happens.</p>
