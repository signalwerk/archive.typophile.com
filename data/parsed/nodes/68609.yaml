    html: |-
      <p>John H wrote: <cite>Simply put, most foundries don't have the resources to convert entire libraries to TTFs.</cite></p>
      <p>I wonder if what he actually meant was, "most foundries don't have the resources to convert entire libraries to TTFs <em>with manual hinting</em>"?</p>
      <p>Converting to TTF isn't hard and can be completely automated, though testing would be a bit time-consuming. Getting better hinting than auto-hinting is the hard thing to do and makes the timeline much worse.</p>
      <p>DirectWrite does a pretty fabulous job of rendering auto-hinted TTFs as well as CFF. I think auto-hinted TTFs will be more common than CFFs for online use in the next five years, because they will render about as well as CFFs in near-future Windows browsers, and they won't suck nearly so much as CFFs in old Windows browsers.</p>
      <p>Everything looks quite passable (though never fabulous, IMO), on the Mac, btw.</p>
      <p>Cheers,</p>
      <p>T</p>
