      <p>Rich, showing fonts at giant sizes is hardly a good indicator of how well they render on screen. Of course, most of the ‘Ten Great Free Fonts’ are display types, so might be expected to be used at larger sizes, but to me this simply means that they are ignorable. If the goal is ‘readable web’, then text fonts at text sizes need to be the focus of attention. So let's reduce the size of your examples, cut out all but those fonts that might conceivably be used at text sizes, and see what we're left with [FireFox 3.6; Windows Vista SP2]:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/10gff_4259.jpg"></div><p></p>
      <p>The convenient failure of Vollkorn and its replacement by Verdana makes the comparison all the more telling.</p>
