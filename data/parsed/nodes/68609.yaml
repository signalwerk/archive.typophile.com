      <p>Frode: <em>Sending a pdf document using a font to my clients is not very different from uploading the files for a website to some server.</em></p>
      <p>It's about as different a situation as I can conceive of involving the same font: in a PDF, an embedded font is a carrier format for a bunch of glyphs layed out in static, pre-typeset text; in a website, a served webfont is a piece of software actively typesetting dynamic text.</p>
      <p><em>What if a designer hosts fonts on their own server, sort of like how Typekit works?</em></p>
      <p>Go ask the individual foundry. You might be able to make a deal on these grounds, or they might refer you to use an existing service (such as Typekit), or they might insist that you use their own service (such as Typotheque).</p>
