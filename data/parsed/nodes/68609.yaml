      <p>But Frode, you're apparently still missing the fact that it is not the designer but the client who is licensing the webfont. There is no issue of paying off a font license over multiple projects (unless they are for the same client), because the webfont is part of the project deliverables, not something used to make the project that stays with the designer.</p>
      <p>Of course, this is something that designers are going to need to explain to their clients, and hopefully this is an area in which webfont vendors can cooperate and help designers by e.g. providing materials that help make it easy for designers to explain webfont licensing to clients.</p>
      <p>There's going to be a lot of web design client presentations sounding like this: ‘This is what your website looks like using the served webfonts we selected, at <em>x</em> cost to you in licensing fees. And here is what your website looks like in Verdana.’</p>
