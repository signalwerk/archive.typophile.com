    html: "<p>The logo is pretty much a dog's dinner: the I might be qualified as a Gothic Tuscan, the C is similar to an old late-1800s ATF face named Concave, and the serifs on the S don't match those of either of the other letters (besides which, the two serifs don't even match each other)...</p>"
