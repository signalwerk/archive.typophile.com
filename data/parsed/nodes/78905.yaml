    <p>The picture in the link is the crest of a brazilian football team. I searched for quite a while for letters like this and wasn't able to find anything.</p>
    <p>To what genre does this belong? Does anyone knows fonts that look like this?</p>
    <p>I have never been an active member of this site until now, but I've been visiting Typophile for more than a year and I can say this community is truly amazing!</p>
    <p>Thanks in advance.</p>
    <p><a class="freelinking external" href="http://img824.imageshack.us/i/internacional.gif/" rel="nofollow">Internacional SC crest</a></p>
