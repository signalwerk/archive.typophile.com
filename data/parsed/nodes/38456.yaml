      <p>Thank you Stephen, but Swift is a bit to dark. I'm using Akkurat at a really small size besides my text blocks, the contrast between Akkurat and the serif is much better when text is set in Proforma. </p>
      <p>I've been thinking of Collis, but at the same size, Proforma is a bit more open. Also, Suite Serif and On Serif from Text Axis would suit my project well, but as far as I know, there not available to the public. </p>
      <p>Maybe I'll end up working with Proforma.</p>
