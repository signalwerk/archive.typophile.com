    html: |-
      <p>I'm working on a book about designer/artist <a class="freelinking external" href="http://www.jacquesbilodeau.com" rel="nofollow">Jacques Bilodeau</a>. This guy in his way has been some sort of pionneer. His early works are also known for beeing really square, he works a lot with folded steel sheets. Obviously, the book will feature many pictures, but also a beautiful text. I want to set the text in a serif that will reflect the pioneering and squarish aspect of bilodeau's work. Proforma would suit this text quiet well because of the way the serifs are managed. Actually, it's not that Proforma doesn't work, but I was wondering if another typeface could do the job. So I have to avoid typefaces that are too curvy, or that are based on old drawings. I saw a wonderful typeface, developed by Nicole Dotin during her MA in Reading, <a class="freelinking external" href="http://www.processtypefoundry.com/images/front/Elena_Preview.pdf" rel="nofollow">Elena</a>, the problem is that it wilI be released in 2008. I was thinking of Fedra Serif. I should also say that the font will be paired with Akkurat. I really like Relato, I think I'll buy it though I won't use it on this project. The overall feeling of Fedra Serif and Proforma are much more modern to me.</p>
      <p>I hope these precisions will help.</p>
      <p>Thanks</p>
    html_clean: |-
