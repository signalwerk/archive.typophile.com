    <p>Hi all.</p>
    <p>Looking to identify one of the typefaces used in the attached scan. It’s the smaller “dotted” one I’m after –&nbsp;”CALL FOR APPLICATIONS / JAN VAN EYCK POST-ACADEMIC INSTITUTE” etc. Spacing/fitting of the dots looks too good to be done with dotted lines in Illustrator.</p>
    <p>The scan is from p86 of Phaidon’s <em>AREA 2: 100 Graphic Designers, 10 Curators, 10 Design Classics</em>, and it is the work of Dutch designers Cobbenhagen &amp; Hendriksen.</p>
    <p>Any ideas?</p>
    <p>(<a href="http://typophile.com/files/typeID_2.jpg">Here’s a link to the attached sample, just in case –&nbsp;not sure how attachments show up here</a>).</p>
    <p>Cheers,<br>
    Pat</p>
