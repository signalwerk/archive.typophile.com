    <p>I'm working on a logo for a band, based on this antique 19th-century book cover I found.</p>
    <p><img src="http://typophile.com/files/pennsylvania-illustrated2.jpg"></p>
    <p>And so far it's going better than I thought it would. This is a screengrab from illustrator:</p>
    <p><img src="http://typophile.com/files/pennsylvania-illustrated-P.gif"></p>
    <p>Looking for advice on what I have so far, and on turning this "P" into an "R". Does anyone know of a typeface that's similar in form I could look at for reference?</p>
    <p>If I get better at this I might try and go for a full typeface, rather than just a 9-letter logo, but at the moment I'm not so sure...</p>
