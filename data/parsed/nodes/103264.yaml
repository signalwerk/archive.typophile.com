      <p>It’s <a href="http://www.screen.co.jp/ga_product/sento/sample/hirg.html" rel="nofollow">Hiragino Kaku Gothic</a>, a Japanese font shipped with Mac OS X.<br>
      Check these out, if you are looking for other Japanese fonts:<br>
