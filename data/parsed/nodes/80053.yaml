  html: |-
    <p>After heavy google searching, whatthefont.com and searching other type databases including my own. I've yet to find any possible matches or similar Type. This "Times" is a Nameplate for a Newspaper in the Middle East. I was asked to update the Nameplate, However keeping the Traditional "Times" in tact. </p>
    <p>So, before I take the time to recreate the type from scratch, I thought I would ask to see if anyone else had an idea of what typeface this was. (No EPS, AI, or any vector format was available. )</p>
    <p><img src="http://i53.tinypic.com/2i117hs.png"></p>
    <p>Thanks for your help,</p>
