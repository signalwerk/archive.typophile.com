    html: <p>There’s a typewriter repair shop right down the street from where I live called Quincy Typewriter Service. It’s run by this great guy who also fixes up antique cars. He pulled me in off the street one day to ask me some questions about by 1993 Dodge Shadow and segued into a half hour presentation on all these great old cars he has. I think he was bored.</p>
