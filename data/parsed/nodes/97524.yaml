      <p>Part of some words or letters that could have been duplicated (mainly "and"), this is most probably a handwritten calligraphy, meaning not-a-font (all /A are different).<br>
      You may like the work of <a href="http://www.myfonts.com/foundry/Magpie_Paper_Works/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Jessica McCarty</a>,<a href="http://www.myfonts.com/foundry/Emily_Lime/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Emily Lime</a>, <a href="http://www.myfonts.com/foundry/Tart_Workshop/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Crystal Kluge</a>, <a href="http://www.myfonts.com/person/Jill_Bell/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Jill Bell</a>, <a href="http://www.myfonts.com/foundry/Laura_Worthington/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Laura Worthingthon</a>,   <a href="http://www.myfonts.com/foundry/Corradine_Fonts/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Manuel Corradine</a>, <a href="http://www.myfonts.com/foundry/Sudtipos/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Alejandro Paul</a>, <a href="http://www.myfonts.com/foundry/Li%C3%A1n_Types/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Maximiliano Sproviero</a>, <a href="http://www.myfonts.com/foundry/Typesenses/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Sabrina Lopez</a>.<br>
      A list of some loosely similars: <a href="http://www.myfonts.com/fonts/magpiepaperworks/saissant/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Saissant</a>, <a href="http://www.myfonts.com/fonts/magpiepaperworks/vermandois/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Vermandois</a>, <strong><a href="http://www.myfonts.com/fonts/emily-lime/jacques-and-gilles/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Jacques and Gilles</a></strong>, <a href="http://www.myfonts.com/fonts/emily-lime/carolyna-pro-black/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Carolyna</a>, <a href="http://www.myfonts.com/fonts/emily-lime/peoni-pro/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Peoni</a>, <strong><a href="http://www.myfonts.com/fonts/emily-lime/bombshell-pro/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Bombshell</a></strong>, <a href="http://www.myfonts.com/fonts/trial-by-cupcakes/katie-rose/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Katie Rose</a>, <a href="http://www.myfonts.com/fonts/mawns/roskrift-clean/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Roskrift Clean</a>, <a href="http://www.myfonts.com/fonts/sudtipos/plumero-script/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Plumero</a>, <a href="http://www.myfonts.com/fonts/betatype/dear-sarah-pro/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Dear Sarah</a>, <a href="http://www.dafont.com/antrokas-demo.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Antrokas</a></p>
