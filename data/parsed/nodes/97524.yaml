      <p>Part of some words or letters that could have been duplicated (mainly "and"), this is most probably a handwritten calligraphy, meaning not-a-font (all /A are different).<br>
      You may like the work of <a class="freelinking external" href="http://www.myfonts.com/foundry/Magpie_Paper_Works/" rel="nofollow">Jessica McCarty</a>,<a class="freelinking external" href="http://www.myfonts.com/foundry/Emily_Lime/" rel="nofollow">Emily Lime</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Tart_Workshop/" rel="nofollow">Crystal Kluge</a>, <a class="freelinking external" href="http://www.myfonts.com/person/Jill_Bell/" rel="nofollow">Jill Bell</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Laura_Worthington/" rel="nofollow">Laura Worthingthon</a>,   <a class="freelinking external" href="http://www.myfonts.com/foundry/Corradine_Fonts/" rel="nofollow">Manuel Corradine</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Sudtipos/" rel="nofollow">Alejandro Paul</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Li%C3%A1n_Types/" rel="nofollow">Maximiliano Sproviero</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Typesenses/" rel="nofollow">Sabrina Lopez</a>.<br>
      A list of some loosely similars: <a class="freelinking external" href="http://www.myfonts.com/fonts/magpiepaperworks/saissant/" rel="nofollow">Saissant</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/magpiepaperworks/vermandois/" rel="nofollow">Vermandois</a>, <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/emily-lime/jacques-and-gilles/" rel="nofollow">Jacques and Gilles</a></strong>, <a class="freelinking external" href="http://www.myfonts.com/fonts/emily-lime/carolyna-pro-black/" rel="nofollow">Carolyna</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/emily-lime/peoni-pro/" rel="nofollow">Peoni</a>, <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/emily-lime/bombshell-pro/" rel="nofollow">Bombshell</a></strong>, <a class="freelinking external" href="http://www.myfonts.com/fonts/trial-by-cupcakes/katie-rose/" rel="nofollow">Katie Rose</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/mawns/roskrift-clean/" rel="nofollow">Roskrift Clean</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/sudtipos/plumero-script/" rel="nofollow">Plumero</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/betatype/dear-sarah-pro/" rel="nofollow">Dear Sarah</a>, <a class="freelinking external" href="http://www.dafont.com/antrokas-demo.font" rel="nofollow">Antrokas</a></p>
