      <p>Hi Danny,</p>
      <p>this style is called ‘<a href="http://new.myfonts.com/tags/ronde" rel="nofollow">Ronde</a>’. Some typefaces from this genre:<br>
      <a href="http://new.myfonts.com/fonts/bitstream/french-111/" rel="nofollow">Gando aka  French 111</a><br>
      <a href="http://new.myfonts.com/fonts/linotype/linoscript/" rel="nofollow">Linoscript aka Typo Upright aka French Script</a><br>
      <a href="http://new.myfonts.com/fonts/agfa/redonda-itc/" rel="nofollow">ITC Redonda</a><br>
      F</p>
