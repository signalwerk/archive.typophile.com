    html: "<p>Very few songs have typeface names, that namecheck the title. here's two: <br> <br>CALEDONIA, what makes your big heart so hard? <br>(Louis Jordan wrote it, but also recorded by many others) <br>GEORGIA, sweet Georgia. <br>(Hoagy Carmichael wrote and recorded it, Ray Charles did a classic version) <br> <br>How about: <br>1-2-3 by Len Barry <br>(Includes the line \"ABC, falling in love with you was easy for me..\") At least I think it does -- I haven't heard that song for 40 years! <br> <br>German Bold Italic by Towatei, of course. <br> <br></p>"
