    <p>So for those of you who haven't heard, Typophile is DJing the Saturday night "Digikana" event at TypeCon San Francisco. And while we've been doing our best to amass a pile of tunes that will please the discerning typographer, we're left with a question: <br> <br>What are the must-have tunes to please a Typecon crowd? <br> <br>Mind you, I'm not fishing for "what's your favorite song?" here - I'm looking for specific songs that mention type, alphabet, fonts, letters, etc etc.  Spoken word or musical. <br> <br>Any links to downloadable MP3s of typographers speaking (or something similar) would also be welcome here.  <br> <br>thanks- <br>jb</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20081121133422/http://www.typophile.com/node/5680" class="topic-previous" title="Go to previous forum topic">‹ Typophile Small Talk Generator: TypeCon Edition</a> <a href="/web/20081121133422/http://www.typophile.com/node/5640" class="topic-next" title="Go to next forum topic">Typing around Corners ›</a></div>
