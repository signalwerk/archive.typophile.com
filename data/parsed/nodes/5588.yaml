    html: <p>It's common knowledge that Prince has a thing for letters, especially the "U" (I Would Die 4 U, Take Me With U, U Got the Look)... he waxes melodic about letterish locales (Alphabet Street, Graffiti Bridge)... but could we expect any less from a guy who renamed himself an unpronounceable glyph?</p>
