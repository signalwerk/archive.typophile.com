    html: |-
      <p>Am I right and you want to use the red g and w as alternates!?!</p>
      <p>If so I would make the red w the primary letter and the other one the alternate. The red one is more humanistic and better fits to the binocular g.</p>
      <p>I dont like the shoulder on the letters n, m (and u). I would make them a little bit rounder. The shoulder on the a is really nice.</p>
      <p>I think it would look nice if you slant the crossbar on the e a little bit.</p>
      <p>Greetings: Steven</p>
