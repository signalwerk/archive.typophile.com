    html: |-
      <p>Hi Eduardo<br>
      It's looking good. A few quick comments:<br>
      r seems a bit too narrow<br>
      j and y seems to acend too deep<br>
      The cut-off piece on the e is a bit distracting, but you only notice it in the very large sizes.<br>
      k upper arm is a little weak</p>
      <p>In the bold cut I feel that the upper case glyphs are too dark compared to the lower case, and compared to the relationship between upper- and lower case in the regular cut.</p>
