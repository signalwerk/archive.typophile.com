    html: "<p>Font Bureau is the place to start. They have lots serif type designe just for that purpose. Whitman (designed by Typophile regular Kent Lew) is one I want to use very soon: <br> <br><a href=\"http://www.fontbureau.com\" target=\"_blank\">http://www.fontbureau.com</a> <br> <br>Check out Walburn, Worldwide and Goodchild, by Nick Shinn: <br><a href=\"http://www.shinntype.com/\" target=\"_blank\">http://www.shinntype.com/</a> <br> <br>And I've long been intrigued by Kandal, from Mark Simonson: <br><a href=\"http://www.ms-studio.com/FontSales/kandal.html\" target=\"_blank\">http://www.ms-studio.com/FontSales/kandal.html</a> <br> <br></p>"
