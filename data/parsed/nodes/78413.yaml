      <p>@JH - <em>"...varying vertical distance between points, which will not always snap to multiples of the rise value."</em></p>
      <p>Not to leave out the fact that a well-designed typeface requires a variety of runs (angles), and side bearings for optical consistency. Snapping to multiples here is hopeless without both x and y hinting. </p>
      <p>@JH - <em>"...In Windows FL, a right click drag with the measuring tool..."</em></p>
      <p>I don't use FL, but thanks for the tip!</p>
      <p>@HP - <em>"stems are king; the Latin alphabet (especially the UC)<br>
      is primarily built on a stem-plus-"augmentation" strategy."</em></p>
      <p>I think there is no such thing as a dominant, "king" feature in type. There is background, beat (the main stems) and variety. And the beat itself, likes variety in the angles... and the variety in angle, one of the largest parameters to vary, shows up as a pixel difference early in the ppm spectrum relative to spacing, stem thickness or alignment varieties.</p>
