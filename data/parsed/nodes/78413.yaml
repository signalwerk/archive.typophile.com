      <p>David: <em>...capture the interactive slant angle...</em></p>
      <p>The workaround for the bug is to use the measuring tool to capture the resulting slant angle, rather than relying on the feedback from the Free Transform tool. This seems to be accurate, albeit recorded in the measurement panel as a value relative to the horizontal (e.g. a 14 degree right slant off vertical is recorded as 76 degrees).</p>
      <p>In Windows FL, a right click drag with the measuring tool will give you the option to insert an angled guideline following the line of drag. You can then check the properties for this guideline to get the angle.<br>
      _____</p>
      <p>Hrant, I agree that being able to specify slant in terms of rise-over-run em unit integers would be a good feature in font tools. There will still be rounding errors, however, due to varying vertical distance between points, which will not always snap to multiples of the rise value.</p>
