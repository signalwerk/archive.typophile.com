    html: |-
      <p>Since digital type is all on a grid, a slope of 1/n where<br>
      n is an integer is what makes sense. An integer degree<br>
      slope produces erratic stair-steps, with no benefit.<br>
      Degrees have basically become a dysfunctional legacy.<br>
      There's also something else: when you're editing a font<br>
      and you have to move a point, you know that for every<br>
      unit of horizontal movement there must be a vertical<br>
      shift of n.</p>
      <p>BTW, for onscreen type the grid is so coarse that<br>
      each point size benefits from having its own slope!</p>
      <p>In Patria (which influenced Ernestine) the slope of the<br>
      Italic is 1/16, which is about as slight as I think one<br>
      should go; it's ~3.6 degrees. I could have chosen 1/15,<br>
      but the nice things about 16 are that: being a power of<br>
      2 it can be halved all the way; and at 12 pt (on Windows)<br>
      you get precisely one step (in the middle). Sometimes.  :-)</p>
      <p>hhp</p>
