      <p>@Mark Simonson: <cite>The error increases if I slant it back further than upright. Starting from a rectangle slanted 30°, here are the results I get if I slant it backwards again by various amounts:</cite></p>
      <p>This is to be expected; the angles from consecutive slantings in general do not add.  In fact, a slanting by theta and then a slanting by phi will result in a slanting of arctan[tan(theta)+tan(phi)].  The data in your table agrees very closely with this formula.  The one oddness is slanting by 30 and then by -30 should return the shape to vertical.  I'm assuming that the error you report is due to rounding to integer units after the first transformation; the error is too large to attribute to inaccuracy of floating point arithmetic.</p>
