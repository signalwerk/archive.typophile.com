      <p>@Hrant - <em> "BTW, for onscreen type the grid is so coarse that<br>
      each point size benefits from having its own slope! ...Sometimes. :-)" </em></p>
      <p>Even if you could find the perfect italic angle for each size that works all the way from the ascender to the descender hitting integer pixels at the baseline and the x-ht, you cannot make the diagonal strokes of an italic, which require many angles to cover K, S, V, W, X, Y and Z e.g., step evenly. These diagonals will stand out with uneven stair steps relative to the idealized per ppm italic slant you are promoting. </p>
      <p>Bitmaps are no longer in the mainstream of screen font technology, but if you are doing a Baskerville outline font for Google, you'll finally have to face this issue and present a solution to the real world.</p>
