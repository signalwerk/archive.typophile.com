    html: |-
      <p>I moved the whole thing to <a class="freelinking external" href="http://github.com/grzegorzrolek/kif-compiler/" rel="nofollow">a new repo</a> and made it build both <code>kerx</code> and <code>ankr</code> tables during the past year. It means you can work with both state machine-based kerning and the new control-point positioning as found in those tables.</p>
      <p>This was before John Jenkins from Apple announced an upcoming update to their Font Tool Suite, a release that I assume will be pushing forward Apple’s new input format for building AAT, the Advanced Typography Input File, or ATIF, which is probably better-suited for the more common use cases. Nevertheless, when it comes to state machines with non-trivial state chains, I still find MIF, or for that matter KIF, often much easier to follow at a glance than ATIF.</p>
