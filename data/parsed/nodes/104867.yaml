    <p>Hi,<br>
    i am searching for a font which is used in EA's 1999 Need For Speed High Stakes (NFS4 EA Canada). Thought of using it for some Artwork.<br>
    Its mostly used in headlines, although it seems to have only lowercase letters.<br>
    The font is stored in a file called "Galext18.ffn" ... maybe thats helpful (btw renaming to *.ttf does not work).<br>
    In the attached image I cut together different samples from menu and loading screens. </p><div class="imageWrap"><img src="http://typophile.com/files/Unknown_6037.png"></div><p></p>
    <p>I couldnt find any information so far and "What the Font" did not show any helpful results. Are there other image based search engines?</p>
    <p>It would be awesome to have at least a similar font.</p>
    <p>Thx4Reading<br>
    Greetings</p>
