    <p>Hi, i'm new here...<br>
    My question is:<br>
    If I download a free font today with its proper license, will this license allow me to use it for indefinitely time or could the license change in some time without giving me a notice. Note that i´m talking about licenses with no warning about changes in the future. Thanks...</p>
