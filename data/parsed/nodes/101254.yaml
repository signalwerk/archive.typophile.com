      <p><cite>will this license allow me to use it for indefinitely</cite></p>
      <p>Yes. </p>
      <p><cite>could the license change in some time without giving me a notice</cite></p>
      <p>No. </p>
      <p>(It could change, but that wouln't affect your license, but only the license of the people who download the font then)</p>
