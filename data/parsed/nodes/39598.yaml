    html: |-
      <p>@ nvhladek: you’re quite close to the meaning I guess. We will work with corporate id and webdesign, mostly.</p>
      <p>@ Haley:<br>
      The idea behind this logo is the following:</p>
      <ul>
      <li>Companies often show their corporate id on papers or on the web, and most times the logo of the company is on the top of the paper; here it would be represented on the right side, in the green triangle.</li>
      <li>The white paper represents the old corporate id of a company, and the green triangle represents a new id behind the old one. Our job is to give the company a new corporate id., so the white paper represents the old “skin” of the company, being teared off, to show the new “skin” of the company.</li>
      <li>The green triangle is an arrow pointing forward and top, showing the progress we want for our customers.</li>
      <li>The triangle is also intended to be used in our branding stuff. In portuguese there is a word with two meanings: “destacar” means “detach” (or “tear off”, like a coupon we can tear off a paper); it also means “highlight” or “stand out”.<br>
      So there there should be a play with this word, since the idea is to have some detachable corner in our papers, meaning also our customer can stand out off the crowd as well.</li>
      </ul>
      <p>My English is not good, but I hope you understand what I mean.<br>
      Also, the green color is not definitive, we are thinking about something different. Maybe a hot pink or so.</p>
