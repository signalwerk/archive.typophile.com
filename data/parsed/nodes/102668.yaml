      <p>Thank you much! Your comments are causing things to stand out that I missed completely before. Some  questions (some of this is fairly new to me)..</p>
      <p>S) I went back and forth on the terminal. Lacrimal terminals really weighed the composition down. It was just too same/same. CAn you clarify what you mean by "one sided serifs"? Maybe point me to some type that uses this on the s?</p>
      <p>A little lost on the following comment: "When strokes cross (like towards the bottom of the "L") they often don't end up looking like their two parts are lining up... To make it easier to tweak the "apparent alignment", give each crossing curve a two-node flat segment hidden inside the other crossing stroke."</p>
      <p>Thanks again for the feedback! I will refine this some more!</p>
      <p>cheers, evan</p>
