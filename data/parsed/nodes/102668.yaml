    html: |-
      <p>Hey, this looks nice. My favorite thing is how well you've resolved the tittles of the "i"s. And I love how the shadow details are giving it a nice layered feel.</p>
      <p>Some things to consider:<br>
      - The "C" is too narrow, and its bottom-left is malformed.<br>
      - The "s" is too wide.<br>
      - The terminals of the "s" seem out of character. I'm not sure teardrop terminals would work though. If they don't try making those serifs more one-sided.<br>
      - The big swash on top is coming too close to the "s".<br>
      - When strokes cross (like towards the bottom of the "L") they often don't end up <em>looking</em> like their two parts are lining up... To make it easier to tweak the "apparent alignment", give each crossing curve a two-node flat segment hidden inside the other crossing stroke.<br>
      - The loop in the descender of the "h" is too square.<br>
      - I think a monocameral "a" might work better.<br>
      - The "r" looks like an "i" trying to lick the sky... Try to integrate the two parts better.</p>
      <p>hhp</p>
