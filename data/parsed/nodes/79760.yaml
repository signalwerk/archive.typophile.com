    html: |-
      <p>But system you're describing, Johan — and, in fact, system of all those standard keyboards — is exactly what I was trying to avoid, as it forces you to be aware of a bunch of things:<br>
      • What modifier keys are required? Shift? Alt/Opt? Both?<br>
      • What keys trigger what diacritics? Apostrophe gives acute or grave? Colon as umlaut? What about others, less intuitive ones? And, hey, it's still punctuation, not diacritics!<br>
      • What is the actual combination? In other words, what modifiers in what combination with what other keys give what diacritics? You see the problem.</p>
      <p>Early on, I've tried a system based simply on Option key plus a key of diacritic's initial letter, followed by the base letter. But it just couldn't work with caron, cedilla, circumflex and so on. I'd have to make some hacks, therefore no solution either.</p>
      <p>What makes the Interdiacritical method effective is its ridiculous simplicity, intuitiveness and extensibility: with a single Opt key you can enter basically all imaginable diacritics above all Latin letters, knowing only the diacritic's name. And with multiple languages to deal with efficiency is not a priority — that's what language-specific keyboards are for.</p>
