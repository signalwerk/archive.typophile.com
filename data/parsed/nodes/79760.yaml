    html: |-
      <p>First, I must say that Uwe just nailed the subject with his research and all this makes my little method rather weak, basically. Now portability is another problem entirely. I’m not really a fan of syncing everything everywhere mantra, nevertheless this would imply a system-level support, as any third party solution would have to be imposed on the host system anyway.</p>
      <p>James, isn’t this is how OS X Lion somehow deals with it? Hold-pressing a base letter gives you a little pop-up with a row of few related diacritics, all with associated numeral as a shortcut. By the way, this row is also tab-enumerable, what quite closely resembles Uwe’s very own idea.</p>
