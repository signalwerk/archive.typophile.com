      <p>I feel comfortable with standard Mac method, using the <em>US-international</em> keyboard layout (it covers the western latin languages). I feel it's the fastest method: (cmd+key) + your letter. Of course you have to remember the key for each accent, but they're not so many.<br>
      However I have to point some incoherences as, for instance, "å" letter is the direct result of cmd+<em>a</em>, while "à" is cmd+<em>`</em> + <em>a</em> </p>
      <p>To access the complete latin accents, and have a more consistent generation system [(cmd+key) + key] you can switch to <em>US-Extended</em>.<br>
      for custom tuning, you can modify your keyboard layout with the <a href="http://www.macupdate.com/app/mac/14495/ukelele" target="_blank" rel="nofollow">Ukulele</a> App.</p>
