      <p>I've experimented with various input methods some years ago. For longer texts anything beyond two keystrokes per accented letter gets tedious. It's not only the number of keystrokes that grows but also the <em>typing time per keystroke</em>. It seems that one can do at most two keystrokes unconsciously — if the keystroke sequence is longer, the brain starts task switching: one stops thinking about the text, one starts thinking about the required key sequence, one finishes the key sequence, and finally continues thinking about the text.</p>
      <p>Unfortunately, accessing every accented letter with two keystrokes does not work (unless one uses a keyboard with thirty dead keys). But one can access the most frequent ones with two keystrokes, and that's what counts in practice. Here's the recipe: Take one key as a reserved &lt;Accent&gt; key (I prefer &lt;Tab&gt;, but that's a matter of choice). Typing &lt;Accent&gt; replaces the letter before the cursor by another one: <em>a</em> becomes <em>ä</em>, <em>A</em> becomes <em>Ä</em>, <em>e</em> becomes <em>é</em>, <em>s</em> becomes <em>ß</em>. To get other letters with the same base letter, type &lt;Accent&gt; repeatedly. Every press of the &lt;Accent&gt; key yields one more replacement: <em>ä</em> becomes <em>à</em>, <em>à</em> becomes <em>á</em>, <em>á</em> becomes <em>å</em>, and so on.</p>
      <p>As a result, I can get the frequent letters (in a given language) with keystroke sequences that are both mnemonic and short (the average length of the keystroke sequences is very close to 2). For rare letters occurring in some foreign proper name, I may have to type &lt;Accent&gt; ten times, but for letters that I need only once per month, that doesn't matter. The only thing I have to remember is the rule "type the base letter and then type &lt;Accent&gt; sufficiently often until the required letter appears". The method also has the advantage that one can type in the natural (handwriting) order: first the base letter, then the accent. And in contrast to dead keys, one needs only one reserved &lt;Accent&gt; key. (Conveniently located keys are a scarce good!)</p>
      <p>I've checked the orthographies of 28 European languages. For 21 of them, everything works smoothly, for the remaining 7, it works with some tweaking. <a href="http://www.mpi-inf.mpg.de/~uwe/paper/AccInput-bibl.html" rel="nofollow">(Here's the full story.)</a> Still there are some limitations:</p>
      <p>The method clearly does not work if the number of accented letters per base letter is too large (such as the 17 variants of <em>o</em> in Vietnamese or the 23 variant of <em>alpha</em> in polytonic Greek). Even five derived letters (e.g. in Yoruba) may be too much.<br>
      If one switches between different languages, one has to switch the replacement scheme. Typing French text with a replacement scheme for German is a sure way to give you RSI.<br>
      Unlike dead key or AltGr techniques, the method requires support by the application. It's an <em>input method</em>, not a <em>keyboard</em>. (In fact, I have only implemented it as an editor macro.)</p>
