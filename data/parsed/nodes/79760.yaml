      <p>I work mostly in three different languages (dutch, german english) on a dutch keyboard, which works fine most of the time. The only difficulty I have is when I write long german texts, as the accents and characters commonly used (ä,ü,ö,ß) are not, as on a german keyboard, directly accessible, but only through the pattern alt+u+a/o/u and alt+s. This becomes even more of a hassle when using it on capitalized letters, which are common in german because every noun is capitalized. So typing Ä requires the combination alt+u, shift+a. This can become a little annoying over time... </p>
      <p>And I guess languages that use more diacritics, and more complicated ones (like stacked diacritics) can be even more difficult to write. So I guess there definately is a need to simplify this, but I'm not sure this will work over longer texts as it still requires quite a lot of extra typing. So when using multiple languages at the same time, I would prefer programming new key combinations with only single keys (like the ones mentioned above). When only using the diacritic in a few words I probably would go through the glyphs panel.</p>
