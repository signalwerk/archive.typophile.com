      <p>I use Windows and expanded my keyboard adding AltGr + key combinations for most letters with diacritics. This could be done with a free keyboard editor from Microsoft.</p>
      <p>One can add characters to AltGr + A-9 and Shift + AltGr + A-9. Thus, the possibilities are quite wide (49 x 2 in a Portuguese keyboard). The only problem are conflicts with keyboard shortcuts in some programs, as InDesign or Photoshop, so it's up to the user to select keys for one and other functions.</p>
      <p>I don't know if this is possible in Mac. As there is no AltGr key, Grzegorz solution may be the better choice in this platform.</p>
      <p>What about to use stylistic sets to achieve this? Say, in a <code>ssXX</code> feature one can add the same substitutions set on <code>ccmp</code> feature, but then using combinations like letter + diacritic abbreviation + trigger. Something like <em>a/ac=</em> subs by <em>aacute</em> (this is just a sample, not the correct syntax). Is this a very unorthodox idea?</p>
