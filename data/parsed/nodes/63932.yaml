      <p>I'm with Ivan. For most users, there has been virtually no reason to keep waging the Holy OS Wars for a few years now (except some people seem to think it's fun).</p>
      <p>That said, in the case of the original poster I can actually think of one good reason for a Mac: It's very easy now to run Windows on Mac as well, so you essentially get two OSes on one box – which is a definite advantage for testing web designs. (But this will only work remotely well if you get an Intel-based Mac, i.e. newer than a G5.) Your call to decide if that's worth the additional cost to you.</p>
