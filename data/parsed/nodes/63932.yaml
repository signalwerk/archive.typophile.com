      <p>I've only just joined this group, but I'll give my 2p's worth.</p>
      <p>I have both a PC and a Mac. Which do I prefer for general use? The PC. Which do I prefer for creative use? The Mac.</p>
      <p>PC: Great for general use because almost all software is developed for PCs. The only software I can think of that I would use that isn't for PC is Adobe Aperture. Also, the only IM program I use is MSN, which as far as I know isn't available for Mac.</p>
      <p>Mac: Switch on a Mac, and you forget that you're using a computer. For those that have never used a Mac, you won't understand this until you use one. Macs stay out of the way, and let you get on with what you're doing. However, as the OP has already stated, you do need to pay A LOT to get a Mac that runs current software blindingly fast.</p>
      <p>~ squodge ~</p>
