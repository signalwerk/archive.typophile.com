      <p>Everyone knows design work is more creative on a Mac sheesh!!</p>
      <p>I'm actually a fairly recent convert. I too do a lot of motion work (3d and After Effects) which (in the past) meant that PC was the way to roll. Not any more though. I'm all for Mac.</p>
      <p>I also do a lot of print work - and still believe Macs handle larger files better. That said, and this is the major thing I think...none of the PCs I've used have come from a complete dealer (i.e, Dell etc) - where everything is put in the box knowing it all works together.</p>
      <p>I've always found PCs to be very niggly - particularly when you've just acquired it. All sorts of peripheral issues etc. Where as, my experience with Macs has been (mostly) really straight forward.</p>
      <p>THAT said, in the future I'll being putting on PCs for dedicated 3d work. Their price point just can't be beaten - particularly for a render farm.</p>
      <p>----------<br>
      <strong>Paul</strong><br>
      <a href="http://www.allthingsconsidered.com.au">Design Studio Melbourne</a></p>
