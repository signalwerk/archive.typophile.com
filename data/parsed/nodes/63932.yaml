      <p>While one can run OSX on a Windows PC, it's not officially supported (or even allowed).</p>
      <p>As such, if you're a web developer, it's nice to have a Mac for that reason alone. You can easily test a wide range of browsers fairly easily.</p>
      <p>That said, there aren't huge issues in the OSX browsers for the most part. You can install Safari on Windows easy enough and Firefox is pretty much the same. </p>
      <p>Obviously, if you want to get into iPhone dev, having a Mac is a prerequisite. </p>
      <p>"It just seems that for the money I can get a much better pc"</p>
      <p>If that's how you feel, then there's your answer. It depends on your region and how much effort one wants to put into DIY. When I comparison shop, I don't usually find the Macs to be more much more expensive (if at all) for what I'm getting. You can definitely get cheaper PCs, of course, but rarely will they have the same specs/niceties. </p>
      <p>I use both all the time and if you really need to ask 'Mac vs. PC' then it really doesn't matter to you and/or you're just trolling for the sport of it. If you don't need to ask Mac Vs. PC it'd because you've used both and know the answer already.</p>
