    <p>I currently use a pc to design but am looking into getting a new computer.</p>
    <p>What makes a mac better for designing than a pc?</p>
    <p>I do web graphics so wouldn't it be a better idea to view my designs in windows (the os that more people will be using to view the page).</p>
    <p>Would an old power mac g5 with a dualcore 2.3 processor be any good?<br>
    Otherwise I am going to do a custom core i7 build.</p>
    <p>It just seems that for the money I can get a much better pc, and I do not see how pixels look any better on a mac.</p>
    <p>Please let me know your thoughts.</p>
