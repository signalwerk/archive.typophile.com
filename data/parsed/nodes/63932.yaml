      <p>Hi,</p>
      <p>Firstly - you seem to have come under fire for asking an inappropriate question in a forum based around typography...</p>
      <p>This question is dead my friend - It does still get peoples blood pumping though and for all the people shouting you down in here - you did get a good response.</p>
      <p>For me- you answered the question yourself. - YOU DO 3D</p>
      <p>I do alot of 3D - high end arch viz etc - The only option for me it so to use PC.<br>
      I simply cannot do what I need to do on a Mac.</p>
      <p>Macs are great - no question -<br>
      I am an architect and have refused to work at some high profile offices because I walked in to find a white office full of Macs and people wearing Thick Black Glasses claiming Form Z was the pinnacle of 3D media creation - </p>
      <p>A PC with all its niggles and quirks once set up the way I like it does everything I need.</p>
      <p>3D - yep -get bags of Ram  - if you can build yourself - make sure your bits are compatible - On paper this stuff should all work. In practice you will find bits don't always sit nicely together - I spent a year once with a self build running a dual processor pc on a single chip because I had all sorts of problems connecting to the internet - it was only 1 year later i was able to work out that USB modems with my mobo meant high voltage across the mobo and a shut down.</p>
      <p>Once I got a modem that connected with RJ45 problem solved. Its not always this simple.<br>
      I have had issues with ATI GPU's and I have had endless issues with AMD chips - I like you am into Intel</p>
      <p>AMD for me is again not an option - I simply don't trust it.</p>
      <p>The old - Macs are better for GFX argument (which usually comes from some tool with a 70's fro and a pair of jesus sandals underclad with brown socks - seams showing on the outside and all) IS DEAD - this was down to colour repro a long time back and Gamut etc etc. </p>
      <p>I use a PC i have worked in IT retail in the past - i know both<br>
      I made my choice and its nothing to do with the cache of owning a Mac - </p>
      <p>If a client wanted me because of what i had in my bag and not what I have in my head then I don't want to work with them. </p>
      <p>FLAME SUIT ON    ~(MAYBE)</p>
      <p>James</p>
