      <p>Hello!</p>
      <p>In case you use the 'Additional OpenType names / Non-English or special font names', you might also check if the entry for 16-1-0-0 and 16-3-1-1033 are identical throughout all fonts, like, do regular, light, lightitalic have an additional space after the name? You need to scroll down a bit; I cannot see the entry in your screenshots. For you are speaking of InDesign -- it's OT Family Name / NameID16 which identifies the family to which a font belongs.<br>
      Have you really run <a href="http://homepage.mac.com/mdouma46/fontfinagler" rel="nofollow">FontFinagler</a>? I had the problem of a family split into two myself some time ago, and it turned out that it was the cache. Not Adobe's, but OSX's own cache.<br>
      As a test, you could also install the fonts on a Mac on which you haven't installed them before.</p>
