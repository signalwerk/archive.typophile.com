      <p>After all the insights, I can't think of other problems your fonts might have. In any case, here's a short (and most certainly incomplete) list of things to check:<br>
      -- The OS font cache is clean (there are no old versions of the fonts in memory)<br>
      -- The fonts have all the characters for the following Codepages (the ones between parenthesis can be omitted, I think)<br>
      • 1252 Latin 1<br>
      • 1250 Latin 2: Eastern Europe<br>
      (• 1254 Turkish)<br>
      (• 1257 Windows Baltic)<br>
      -- The Codepages above are included in the 'Supported codepages' field</p>
      <p>If your fonts still line-up at the bottom of the menus after these steps, try to add the codepage '1253 Greek', as Karsten suggested. I think I recall a bug where this codepage need to be flagged, when the codepage '1250 Latin 2: Eastern Europe' was present (or when characters from that codepage were present), even if the font/typeface had no coverage for Greek.</p>
      <p><strong>A clarification on the <em>.notdef</em> glyph:</strong><br>
      A couple posts above, I told you to put this glyph in the 'slot' 0000. This is in fact incorrect, as that glyph would be encoded as U+0000 (uni0000). The correct way is to give that glyph the name '.notdef', and leave the Unicode field blank, as shown in the image bellow.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/notdef_5614.png"></div><br>
      Nonetheless, this glyph should be the first glyph in all your fonts, appearing in the 'slot' 0 (zero), when in Index mode.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/notdef_index_3686.png"></div><p></p>
