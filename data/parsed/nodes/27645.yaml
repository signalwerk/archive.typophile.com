    date: 2006-08-18T22:50:00
    votes: null
    html: |-
      <p>&gt;&gt;Is this a bug in Studio ?<br>
      &gt; Maybe not. Perhaps it’s a change of behavior<br>
      &gt; from FL4.x to FLS. Might be documented in the manual.</p>
      <p>It is an intended change of behavior. In FontLab 4.x, the automatic algorithm was too generous. The spec requires all characters from a certain codepage to be present if a certain flag is to be enabled -- but FontLab 4.x's tolerance was too much. In FontLab Studio 5, the alrgorithm requires about 95% of the characters from a certain codepage in order to flag it. </p>
      <p>If in Studio 5, pressing the green button gives you no codepages at all, it seems that the character set of your font is pretty incomplete or that there is some other problem with your .vfb file. You may want to contact us at <a href="http://www.fontlab.com/contact/" title="http://www.fontlab.com/contact/">http://www.fontlab.com/contact/</a> </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
