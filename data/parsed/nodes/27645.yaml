  - id: 153927
    user_id: 1844
    user_name: Miguel Sousa
    user_path: null
    date_raw: 19 Aug 2006 — 11:44am
    date: 2006-08-19T11:44:00
    votes: null
    html: |-
      <p>&gt;<em>Are you saying that I need to complete the rest of the characters.</em></p>
      <p>Yes, but just the ones that have templates, plus a few others. That said, you should add:<br>
      -- 0000 (.notdef)*<br>
      -- 00A0 (nbspace) Make it a composite of 0020 (space)<br>
      -- 00AD (sfthyphen) Make it a composite of 002D (hyphen)<br>
      -- The remaining ones that have template</p>
      <p>*Also, make this the "PFM Default character"</p>
      <p>Another thing I noticed, you have the Euro glyph (€) encoded as U+00A4, when it should be in U+20AC. U+00A4 is normally used by currency (¤).</p>
      <p>&gt;<em>Is it not possible to have fonts with characters missing and still have them work correctly ?</em></p>
      <p>Yes, but it's much easier to make them work when there are no characters missing :)</p>
      <p>&gt;<em>but my problem is that the font name appears at the bottom of the font list, are the missing characters related to this ?</em></p>
      <p>As Thomas said, some applications, like InDesign for example, rely on the Codepage information present in fonts, to order them on the menus.</p>
      <p>&gt;<em>or is just that the green diamond won’t work with characters missing ?</em></p>
      <p>As Adam explained, pressing the green diamond will only produce results if most of the characters for a given Codepage are present.</p>
