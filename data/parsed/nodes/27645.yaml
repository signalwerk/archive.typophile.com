    user_id: 1844
    user_name: Miguel Sousa
    user_path: null
    date_raw: 19 Aug 2006 — 6:00pm
    date: 2006-08-19T18:00:00
    votes: null
    html: |-
      <p>&gt;<em>so how would I make the .notdef the “PFM Default character” ?</em></p>
      <p>Go to the panel "Encoding and Unicode" in Font Info window.</p>
      <p>I'm not entirely sure that PFM means ‘Printer Font Metrics’ in this case. I think that field refers to the 'usDefaultChar' entry of the OS/2 table.<br>
      <a href="http://partners.adobe.com/public/developer/opentype/index_os2.html#dc" title="http://partners.adobe.com/public/developer/opentype/index_os2.html#dc">http://partners.adobe.com/public/developer/opentype/index_os2.html#dc</a></p>
      <p>Essentially, this will be the character that a given application will display, whenever a requested character is not present in the font. For example, let's say I'm using your font and type the Greek letter α (alpha). Because your font does not support Greek, the usDefaultChar will be displayed.<br>
      Now, it's not very useful to assign the character 'space' (U+0020) to this character, because this way it's not (visually) obvious that a character is not present and is being replaced.</p>
      <p>The .notdef glyph can take many shapes. You'll find some examples on this page:<br>
      <a href="http://www.microsoft.com/typography/otspec/recom.htm" title="http://www.microsoft.com/typography/otspec/recom.htm">http://www.microsoft.com/typography/otspec/recom.htm</a></p>
