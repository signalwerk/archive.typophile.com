    <p>Hi all,</p>
    <p>I've been trying to name my opentype family for nearly 4 weeks now, with limited success.<br>
    I have followed the tutorial -</p>
    <p><a href="http://groups.msn.com/FontLab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2843" title="http://groups.msn.com/FontLab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2843">http://groups.msn.com/FontLab/tipsandtricks.msnw?action=get_message&amp;mvie...</a> </p>
    <p>exactly but I'm still getting problems with my font list in Applications like InDesign 2.0.<br>
    I have an 8 font family </p>
    <p>Light<br>
    Light It<br>
    Regular<br>
    Regular It<br>
    Medium<br>
    Medium It<br>
    Bold<br>
    Bold It </p>
    <p>My font list shows all the fonts under one heading apart from the Light It and Regular which are in another font heading.<br>
    Also the font heading only appear in the correct alphabetical order if I load the fonts directly into the fonts folder within the InDesing folder. If I load the fonts using Extensis Suitcase the font always appear at the bottom of the font list.</p>
    <p>I would be very grateful is someone could offer any advise or suggestions.<br>
    I'm using Fontlab 5, Mac OS X</p>
    <p>s.</p>
