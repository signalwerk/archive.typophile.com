      <p>Then compare your results with the .ttx files included in this zip:<br>
      <a href="http://www.adhesiontext.com/typophile/MinionPro_name.zip" title="http://www.adhesiontext.com/typophile/MinionPro_name.zip">http://www.adhesiontext.com/typophile/MinionPro_name.zip</a></p>
