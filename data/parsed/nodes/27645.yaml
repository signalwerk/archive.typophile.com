      <p>Your problems seem to have other sources than font naming:</p>
      <p><cite>My font list shows all the fonts under one heading apart from the Light It and Regular which are in another font heading.</cite></p>
      <p>It seems your font caches are corrupted. Close Adobe apps, search for 'AdobeFnt', then delete files looking like 'AdobeFnt06.lst' (with InDesign 2).<br>
      But more important, you should download and run FontFinagler which deletes OSX's font caches.</p>
      <p><cite>If I load the fonts using Extensis Suitcase the font always appear at the bottom of the font list.</cite></p>
      <p>In FontInfo, 'Encoding and Unicode', did you add Greek?</p>
      <p>The naming looks ok (hope I didn't miss something); seems you followed the suggestion to follow Adobe's example.<br>
      You should take care that in 'Basic set of font names', after the Weight name,<br>
      there is a number in the smaller field. This helps applications sort weights.<br>
      Then, you can omit filling out the 'Non-English or special font names' (except if you want to make additional changes) if you activate the option/preference 'do not export OpenType name records' in 'Generating OpenType PS, OpenType TT and TrueType'.</p>
      <p><a href="http://www.kltf.de/otproduction.htm" rel="nofollow">Here</a> (click the logo to enter) is a download PDF 'Font Naming' with some info. See esp the small print and notes on page 3. However, this is still 'beta' ... Adam Twardoch's suggestions are still the most authoritative ones -- if there is any such thing in the OpenType world.</p>
      <p>Karsten</p>
      <p>To Typophile: Someone eat my image!&nbsp;&nbsp;:(</p>
