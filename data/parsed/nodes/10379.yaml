    html: "<p>Regarding Fontographer: it is very unlikely indeed that Adobe's purchase of Macromedia will lead to a new version of Fontographer. It is much more likely that the produce will be retired completely, and will simply no longer be available. <br> <br>The history of Fontographer and FontLab has shown very clearly that for a large software company like Macromedia or Adobe a font tool is simply not worth development investment. The potential market is simply too small to interest them. Font tools need to be developed by small companies seeking a niche market, and FontLab has demonstrated that this approach can be very successful. <br> <br>I suggested some years ago that Macromedia should simply give the Fontographer code, including the aborted 5.0 version, to Jim Gallagher. He has spent a good portion of his life nursing this code and providing tech support to Fontographer users, so if there is any future to Fontographer it seems to me that he deserves to guide it and to benefit from it, if possible. Perhaps Adobe might consider this. They have been generously supportive of the makers of FontLab, DTL FontMaster, etc., with their OpenType SDK code, so clearly encourage competition in the font tools business. Giving Fontographer to Jim for a dollar, and letting him do whatever he wants with it -- which might include open sourcing it, I suppose -- seems to me the best thing that could be done with this product. Otherwise, it might as well be withdrawn from the market, because it is never going to be updated by Adobe or any other large software company.</p>"
