    html: "<p>It's striking that so much of the reaction I've seen in the press is about the business end of the deal, and almost none of it is how the users of the software, in particular creators, are affected by it. The same weird sense of disconnect haunts me when I read the interview with the CEO in PC Magazine. The SF Chronicle was talking about how the combined Acromedia can shove more \"interactive content\" (read: \"ads\") at \"consumers\" (read: \"poor suckers\", namely us) with the Flash / Acrobat juggernaut. In businesslandia, this seems to be seen as a win, rather than a horrible lose / lose situation for all of us. <br> <br>Am I being needlessly gloomy? Are all of us here? Am I unreasonable for being disappointed by a situation in which I can pay $500 a year for the kinds of improvements that used to be given away for free in incremental updates, now that the tools I use are mature platforms, and I have no viable alternatives to choose from if I grow discontented with what I've got? I use Adobe CS because I think Adobe's tools are the best out there for what they do, but still, as CS becomes more like Microsoft Office for Designers, it would be nice if there was more competition to push things forward.</p>"
