    html: "<p>I like the suggestion that Adobe might give the Fog code to Jim Gallagher. Poor fellow! He's spent years lobbying Macromedia without success, and now he has to start over with a new set of corporate goons. But as for Adobe _giving_ away anything away? Je crois que non.  <br> <br>Otherwise I think it's very bad news. Competition is the only thing that makes products good. Apple has proved this again and again: how it is possible to do things that really do make it worthwhile to pay twice as much for a computer. For those who can afford it, it's a very nice situation. Photoshop has been in strong need of competition for years, and it is striking that nobody seems to be able to get in there and do it. Illustrator is now even more likely to stagflate, I fear, having taken its best recent ideas, now 8 or so years old, from LightningDraw GX. What a pity that Corel couldn't do a better job. Or Macromedia, for that matter.  <br> <br>I find it interesting that Quark 6.5 now has considerable Photoshop-like functionality, and this is only bound to increase. One can see clearly that the competition from InDesign has strongly benfitted Quark. Remember the dizzy days when Quark nearly took over Adobe?</p>"
