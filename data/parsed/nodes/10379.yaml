    html: "<p>Well, think of it this way: now one company can sit on font design software instead of two. At least FontLab is still free from being stored in the warehouse next to the Ark of the Covenant. <br> <br>How many times has Adobe ended up owning Freehand now? Two? Three? <br> <br>It would be nice if Adobe got the Macromedia product teams to pay the same attention to detail to their code that they do to their own. Dreamweaver is a sluggish, kludgy mess on the Mac, and the last time I tried to use Freehand, I gave up in disgust after like 5 minutes. (I remember when Freehand was much easier and more fun to use than Illustrator, but I guess that predates Macromedia's acquisition of it by a while. 4.x was the last version I really liked.) <br> <br>And both companies are a pain when it comes to the cycle of annual, painfully expensive product upgrades. At least Adobe writes reasonably speedy, usable software; maybe that will rub off on Macromedia. I wonder how much of the acquisition was just so Adobe could get their hands on Flash, though... interactive SVG never took off the way they wanted it to.</p>"
