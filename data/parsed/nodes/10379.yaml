    html: <p>"Darrel, in some ways your perception of Flash as a gimmick, a toy, is based on how people have used it and not for what it is <br>capable of." <br> <br>Absolutely no argument there, Joe. I completely agree, as a technology, is has all sorts of uses. <br> <br>BUT...and a big but...the reality is that it's never taken off beyond a bell-and-whistle thing for 99% of the web. Much to MM's dismay, I'm sure. <br> <br>The business pundits are saying this merger is mainly about Flash, but few pundits have really pointed out that Flash really isn't all it was originally supposed to be. Remember when Adobe had grand illustions that the entire internet would be PDF based someday? I think they realized that (thankfully) never happened and are now latching on to Flash hoping for the same...though they're a few years to late. <br> <br>"On mobile devices it has the potential to become <br>the UI for a mobile OS, not merely so you can 'make stuff move'." <br> <br>Well, again, you are absolutely right. But the reality is that Flash was exactly that for the desktop world, yet it never became so. <br> <br>And, again, I think the mobile industry is becoming increatingly gloated with a perception that people actually want all of this. Some do, of course, but the 'mobile' web has been around for years and still isn't the huge thing everyone had hoped it'd be. <br> <br>"And you can keep just making phone calls. Ten years ago people <br>said, 'why would I want to carry a phone around with me?'" <br> <br>With each phone upgrade over the past decade, making a simple phone call has become increasingly more difficult. Handheld interface design is perhaps the best example of crappy interface design out there today. ;o) <br> <br>As for Avalon, it's a feature for feature's sake. MS has the money to market anything without any worries. If it sticks...Great. If not, well, at least they made the competition chase and waste money on a silly non-feature ;o) <br> <br>"They want to control the platform that now defines media on the web, and if it works out like they think" <br> <br>I agree. Their mistake is thinking that that is, in fact, Flash. <br> <br>Again, I'm not bashing Flash...I used it like anyone in the heydays of the web and still find it very useful for certain design, but it just never took off as that thin-client that everyone had hoped for, and, in the interim, DHTML (namely with Ajax) has seemed to be embraced in record time.</p>
