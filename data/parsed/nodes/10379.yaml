    html: <p>"DHTML? In record time? Are you kidding me? How long has DHTML been around now? That's four question marks in a row, and yet, I feel compelled to write more." <br> <br>DHTML, but more specicially, Ajax...which is getting lots of use in a manner of months (the technology has been there for a while, but the buzz is fairly new) <br> <br>maps.google.com and gmail.com are perhaps good examples of something that normally would have been done in flash, but is now being done entirely with DHTML.</p>
