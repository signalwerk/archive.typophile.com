    html: <p>&gt;Macromedia is one of those rare tech companies that actually gets design. (Adobe is also a tech company and they understand design.)  <br> <br>Joe, you are focusing on the companies, and imagining what may happen to specific product. But the real issue here is a general ethical one, which is whether the means justify the end. If the end is "good software", is it OK to pursue that end by means of a monopoly? <br> <br>No, because that amount of power corrupts. It's not that the people in the companies "know they have no competition" and deliberately produce sloppy product. It just happens when all the power is concentrated in one place. <br> <br>If the market, in the form of competition, or government, in the form of the Securities Commission (or whatever) is not going to keep the system in balance, that's a problem. <br> <br>it doesn't matter how brilliant or well intentioned people are, or what wonders they have achieved in the past, they go bad if they acquire too much power. Sorry to get preachy, but this is a basic of human nature which every age, blinded by its own brilliance, is apt to forget.</p>
