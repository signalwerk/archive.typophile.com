    <p>I'm Matthew Heinrich from Chicago.</p>
    <ul>
    <li>I'm a long time lurker via the RSS feeds.</li>
    <li>I'm 25 years old and an Art+Design BA student at DePaul University. Stifle your chortles, please. My school might not be reputable as an art school, but I'm passionate and hard-working (and something of an autodidact).</li>
    <li>I work three part time jobs: As a/the (it's complicated) lab admin for the department's computer labs, as the department's in-house designer/webmaster, and as an intern building websites for a design firm.</li>
    <li>I formerly studied psycholinguistics and cognitive neuroscience at the University of Chicago. It ended three years into my degree with a nervous breakdown.</li>
    <li>I'm a student member of aTypI and AIGA.</li>
    <li>I'm interested in:
    <ul>
    <li>Contemporary (not modern) applications of Bauhaus and Swiss Modernism</li>
    <li>Web typography (and its discontents)
    </li><li>Software and hardware as it applies to design</li>
    <li>Letterpress and serigraphy (though I haven't tried my hand at either yet)
    </li><li>Anywhere that design overlaps with psychology (which is just about everyhwere)</li>
    <li>Hermetic knowledge</li>
    <li>Parenthetical statements (obviously)</li>
    </ul>
    </li><li>Fun facts:
    <ul>
    <li>I'm ambidextrous (or more accurately, ambisinistral).</li>
    <li>I don't follow sports, so don't ask about the bears, bulls, cubs, sox, fire, &amp;c.</li>
    <li>I live in Lincoln Square.</li>
    <li>I'm a lapsed Catholic.</li>
    <li>I'm really hoping all these nested lists work out.</li>
    </ul>
    </li></ul>
