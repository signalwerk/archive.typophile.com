  html: |-
    <p>I attached an example, posters are going to be as long as the one on the right at the most. I wasn’t sure if I should align them all on the bottom and rag on top or otherwise. This will be a twin-loop / double-wire binding so the pages will be spread apart ~1/6th” when opened opposed to a perfect bind which would obscure the middle.</p>
    <p>Questions<br>
    How do I decide where to place the image, the text (inc. colophon)<br>
    Some thoughts about text hierarchy<br>
    Maintaining some sort of order between posters that vary in size (width kept the same)</p>
    <p>The book is 11x17, bound as demonstrated by the spread</p>
    <p>Thanks!</p>
