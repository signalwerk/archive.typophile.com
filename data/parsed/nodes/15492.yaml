      <p>Vletter, yes, that is the old Signature Software company. They<br>
      started out by placing ads in airline magazines for 100 dollar custom<br>
      handwriting jobs. Thousands of business guys fell for it.<br>
      So, I decided to check it out and shelled out 100 dollars.<br>
      I opened the PostScript font (which is no doubt illegal—hence my<br>
      immense pleasure), and saw that each character was represented four<br>
      times. Each time the font was called upon to produce that character,<br>
      it would take the next one, rotating through the four glyphs.<br>
      That, in my opinion, is not “context sensitive”. It is not in the<br>
      spirit of OpenType ligatures, for example. The sales hype<br>
      that accompanied this was just incredible—they called it “magic”.<br>
      Maybe they could have changed between 1999 and now, but the samples<br>
      on their web page (look at “subsystems”) seem to indicate that<br>
      they are still rotating through their glyphs. Any decent computer<br>
      science graduate can do infinitely better than that.<br>
      It is disappointing to see that Microsoft is aligning itself<br>
      with such a company. </p>
      <p>Creating real-looking handwriting is *very very* difficult. No one<br>
      has done it to date—it is one of those enormous challenges ahead<br>
      of us—I have dabbled in it myself, but had to give up because<br>
      I needed to do other things to make a living. Lots of things<br>
      are important: ductus, stress, style of pen, inertia (and thus,<br>
      differential equations), connectivity, ligatures, and so forth.<br>
      The best attempt I had was when I wrote 1600 glyphs with an<br>
      electronic pen, including all the pairs and triples of characters<br>
      that were most common in Shakespeare’s work. But it’s not enough—<br>
      there is no program on earth (yet) that can really “learn” how<br>
      a writer moves his/her hand. Most experts in this area work in<br>
      Electrical Engineering departments, by the way—they are familiar<br>
      with signal processing and related things. Anyway, it’s going<br>
      to take another decade at least to get something decent.<br>
      Vletter is just a temporary cure for the cold.</p>
      <p>All the best to everyone,</p>
      <p>Luc</p>
