      <p>Hi Luc, </p>
      <p>&gt;Vletter, yes, that is the old Signature Software company. </p>
      <p>Yes they changed their name - apparently there were four or five other companies using the same name - it’s kind of snappy.</p>
      <p>&gt; opened the PostScript font </p>
      <p>Might be more sensible to open the OpenType font in FL and take a gander at their OTL tables. </p>
      <p>&gt;which is no doubt illegal</p>
      <p>...in the name of scientific study and research I’m sure no one would object.</p>
      <p>&gt;hence my immense pleasure</p>
      <p>...now that’s a little bit sad ;-)</p>
      <p>&gt;Any decent computer science graduate can do infinitely better than that.</p>
      <p>...and mass produce thousands of fonts for less than $100 each? I wonder why they’ve not bothered? I think I pointed out that the font I had made was not top quality, but I didn’t feel cheated out of my $100. You get what you pay for.</p>
      <p>&gt;It is disappointing to see that Microsoft is aligning itself with such a company. </p>
      <p>If by aligning you mean “licensing a couple of fonts for a Flash demo and nagging them to fix their bad fonts” then you’d be right. </p>
      <p>I’d agree that making 100% convincing handwriting is probably impossible. Most of the people on this list can spot fake handwriting a mile off. But looking at the wide-spread use of VLetter’s fonts and other handwriting fonts in direct-mail, advertising etc., seems as if you can fool most of the people most of the time.</p>
      <p>I assume the electrical engineers are not in the direct-mail biz. Why are they interested in this? What’s the application of this work?</p>
      <p>Cheers, Si</p>
