      <p>I was kind of semi-serious. These chaps seem to be best of a ’bad’ bunch. One thing they’ve offered for a while is contextual OpenType fonts which does put them a cut above the rest. I had them convert a friends handwriting as a wedding gift a few years back and the result seemed pretty fair (for $99) - to the extent that whenever I get handwritten cards from her I catch myself thinking ’I know that font’. </p>
      <p>We also licensed a few fonts for them for use in localized Flash based help tutorials for German and Italian Tablet PC - we needed handwriting that looked authentic for these countries. Again fonts were okay and usable in these tutorials.</p>
      <p>We’ve also been badgering them for a while on fixing validator errors in their fonts so quality may have improved. </p>
      <p>An alternative might be the cut-down FontLab product (can’t recall the name), or of course a real designer, but I can’t help but think that life’s too short for talented people to be working on stuff like this ;-) </p>
      <p>Oh one more if you have access to a Tablet PC... <a href="http://www.microsoft.com/windowsxp/downloads/powertoys/tabletpc.mspx" title="http://www.microsoft.com/windowsxp/downloads/powertoys/tabletpc.mspx">http://www.microsoft.com/windowsxp/downloads/powertoys/tabletpc.mspx</a> scroll down to “My Font Tool for Tablet PC” Results are not exactly good but it’s free.</p>
      <p>Si</p>
