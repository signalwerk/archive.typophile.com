      <p>It's not the umlaut which is sitting lower, but the i-dot which is sitting higher. No pun. In most typefaces the umlaut is in line with other accents.<br>
      The i-dot may sit higher for aesthetic reasons, but I am not sure if this is a must. (I think Mr Gaultney raises the issue in his essay on diacritic design, and following it I have tried to drop the i-dot a bit but found the result unpleasing. At least in German, the combination of i and umlaut-letter doesn't occur often -- if at all.)</p>
      <p>Karsten</p>
