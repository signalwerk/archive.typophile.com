      <p>Seems that my i-dot placement is a bit narrow minded, and some design decisions turn out to be national peculiarities which get evened out as character sets grow. Approaching diacritics a more systematic way is one consequence. Also the peculiar Czech caron comes to mind, or Ä Ö Ü with dropped umlaut (in German typefaces) which are just out of place in larger character sets.<br>
      As regards your design samples, it is interesting that versals and ascenders are comparably small which doesn't leave much choice for placing accents.</p>
      <p>"The doubling of the ї is not unusual either (e.g., її, ‘her/hers’)."</p>
      <p>This is good to know!</p>
