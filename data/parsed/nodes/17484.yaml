  html: <p>Anyone can tell me <em>why</em> the diaeresis/tréma/umlaut in the lower-case <strong>ï</strong> most of the time sits lower than the dot in the <strong>i</strong>? This puzzles many designers of Cyrillic typefaces. The thing is that in Ukrainian the combination of the <strong>і</strong> and the <strong>ї</strong> is quite common (e.g., <em>історії</em>, 'of the history'). The doubling of the <strong>ї</strong> is not unusual either (e.g., <em>її</em>, 'her/hers'). Any help would be much appreciated.</p>
  html_clean: <p>Anyone can tell me <em>why</em> the diaeresis/tréma/umlaut in the lower-case <strong>ï</strong> most of the time sits lower than the dot in the <strong>i</strong>? This puzzles many designers of Cyrillic typefaces. The thing is that in Ukrainian the combination of the <strong>і</strong> and the <strong>ї</strong> is quite common (e.g., <em>історії</em>, 'of the history'). The doubling of the <strong>ї</strong> is not unusual either (e.g., <em>її</em>, 'her/hers'). Any help would be much appreciated.</p>
