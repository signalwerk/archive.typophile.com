      <p>I am of the school that says the diaeresis should always sit at the same height as the dot on the i, along with the dot on ċ ė ġ ż ȯ ṁ ṅ ṗ ṡ ṩ</p>
      <p>Of course, this presumes that the dot on the i isn't in the stratosphere. For a language like English, of course, the dot on the i can be virtually any height, since there are almost no accent marks to be concerned with. But as soon as you have a language with a rich diacritical set you want the height of the dot on the i to be constrained to a reasonable height. In a typically proportioned text face, I usually align the top of the dot somewhere close to the cap height.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Hicii.png"></div><p></p>
