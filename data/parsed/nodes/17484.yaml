      <p><em>...national peculiarities which get evened out as character sets grow.</em></p>
      <p>Not necessarily even -- it seems that the more demanding languages are paid more attention in the mega-language font; for instance, when some languages have proponents who are quite adamant about having steep acute accents, and others traditionally have a flatter angle, and no strong voice arguing for that in the type design community, then the steeper accent will predominate.</p>
