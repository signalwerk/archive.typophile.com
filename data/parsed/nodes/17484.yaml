      <p>I usually make my dieresis dots a bit smaller than the i dot, for two reasons:</p>
      <p>1. So that, compared with other accents, it (the dieresis) is not too heavy -- it has to have "single accent" weight, and not look like two 'i' dots.</p>
      <p>2. Because of the f, as Hrant says, but also because of ascenders that may follow, such as b, h, k and l.</p>
      <p>I line them up along the bottom, with the i dot.<br>
      I sometimes vary the width betwen the dots, depending on the width of the character.<br>
      A lot of little "cheats".</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/dies.jpg"></div><p></p>
