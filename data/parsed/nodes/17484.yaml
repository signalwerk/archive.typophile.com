      <p>I can think of two possible reasons:<br>
      1) Since the tittle spans further left, it collides with the "f" more [often], so bringing it down helps.<br>
      2) Unless one makes the dots much smaller (which would cause a disturbance similar to the one caused by the height mismatch you mention/imply) they combine to have too much more presence than the single dot on the "i", so bringing them down makes them stand out less (see below).</p>
      <p>&gt; The i-dot may sit higher for aesthetic reasons</p>
      <p>Or a functional one: since the dot is the main thing the "i"<br>
      can contribute to readability, making it more prominent helps.<br>
      I've done that (as well as make it slightly "too big") in Patria.</p>
      <p>hhp</p>
