      <p><em>Optically or mathematically?</em></p>
      <p>Given that they are similarly shaped forms of similar size, I don't see a difference between optical and mathematical in this instance, at least given the coarseness of the typical UPM grid.</p>
      <p>Aligning the diaeresis dots to the bottom of the i-dot works better than aligning the centres of the dots. If you align the centres, the diaresis tends to sit too high relative to other accent marks.</p>
