    html: <p>Alexis, I’d just like to say that Kyle is right, you’ll probably want InDesign or Illustrator for this project. <br><br>I run into this all the time. Because of its overwhelming mind-share Graphics=Photoshop to the vast majority. It’s not unusual and you may be forced to rely on Photoshop depending on your circumstance. If you must use Photoshop, then use version 7 as it’s easier to handle the text. Also if you must use Photoshop, consult with your printer about what kind of ﬁle they require in order to make a nice sharp result. <br><br>But I strongly advise InDesign or Illustrator for this work. InDesign is a page layout and typesetting application, which is after all, what you’re doing. Or ﬁnd a designer to do this, using your type speciﬁcation. <br><br>Of couse your wedding invitation may be a new media extravaganza in which case Photoshop could be a better choice… <br><br>Jon</p>
