  html: <p>I recently posted a question regarding a particular font for my wedding invitations.  It was identiﬁed as Bickham Script and I found it for purchase on adobe.com.  I have photoshop 5.5 and 7.0.  Will these glyph complements work on these versions or do I need <span class="caps">CS</span>?  I am a little new to these programs and can’t seem to ﬁgure this out from reading information on adobe.com. <br><br>If I purchase and download the Bickham Script Std Regular package can I use the glyphs with 5.5 and 7.0?   <br><br>Thanks for the&nbsp;help!</p>
