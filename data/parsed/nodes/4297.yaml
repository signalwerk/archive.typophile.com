    html: <p>In a somewhat related topic, I recently discovered that Illustrator <span class="caps">CS</span> and Quark do not map the characters to the keys in the same way when using Mantinia. In fact, the only way I can access all of the oﬀered glyphs in Illustrator <span class="caps">CS</span> is to copy them out of Quark. This is the <span class="caps">PS1</span> version of the face, so I’m a bit confused about why the much newer Illustrator would seem to underperform compared to Quark. <br><br>My guilty typesetting app was Illustrator, the ﬁrst ‘design’ app I’d ever used. I had a brief dalliance with Photoshop before shaking oﬀ the <span class="caps">MS</span> Word mindset and realizing that boxes for type is actually rather&nbsp;convenient.</p>
