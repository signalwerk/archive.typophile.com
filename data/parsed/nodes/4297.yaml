    html: "<p>It’s a beautiful day for confessoin, so I’ll admit this: in my early days of design and layout, I set simple type in Photoshop.  <br><br>[Well, this thing is still letting me type, so I’ll continue with the story.] <br><br>I worked with a designer who was much older than I, the two of us working for the same clients (a college) but never on the same project (to his chagrin we were in the same room). I typically received the poster work and display pieces, while he worked on the longer brochures. I prided myself on my photoshop skills and loathed the type-sitter PageMaker that we were forced (at the gunpoint of no-pay) to use, since I was too lazy to learn about clipping paths and was in awe of the seemingly seamless unity that Photoshop oﬀered our cranky bedfellows image and type. But day after day the mockery would ﬂoat over from my partner’s desk, culminating in “You can’t set type in Photoshop” followed by some general cursing and mumbling as he got up to drain the coﬀee pot. <br><br>And for many many months (the legend will state with a nod and a wink) I labored under the illusion that Photoshop doesn’t rasterize the vectored type until the very end thus giving full control, and blah blah blah etc. I rationalized that I could kern any obvious monstrosities by rasterizing the text and scooting over carefully selected words (yes, the Scooting was as regal as that). I even pretended that I was pulling individual letter forms from a box and setting them on the page awaiting a ﬁnal impression called Flatten. It was foolish, but fools need to operate long and hard until one day they buy InDesign. <br><br>It didn’t take me long to learn the error of my ways. Photoshop is still my darling, and she will always be a dear friend, but never again will she privy to my type-setting ways. And now that I think on it a little longer, I remember a string of painful days almost six years ago when I set my all-important wedding invitations and their fellow programs in some beastly little romantic upstart of a program called Photoshop. My wife still loves me and probably wouldn’t know the diﬀerence, so I suppose not all was lost. But somewhere in the back of my mind, I wonder if a little curse was not unleashed… <br><br>~h</p>"
