ams in some beastly little romantic upstart of a program called Photoshop. My wife still loves me and probably wouldn’t know the diﬀerence, so I suppose not all was lost. But somewhere in the back of my mind, I wonder if a little curse was not unleashed… <br><br>~h</p>"
