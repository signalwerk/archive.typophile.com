    html: <p>You can’t get at quite all of the glyphs in Photoshop 7, but you can get at most of them. If you go to <a href="http://www.adobe.com/type/opentype" target="_blank">http://www.adobe.com/type/opentype</a> you can look at the OpenType User Guide (see links on right side of page). Go to the last page of the Guide. It has a table which will tell you which OpenType features are supported in which versions of each application, including Photoshop. <br><br>In Photoshop 5.5 you will only be able to get at the default forms for each character, none of the cool variants. <br><br>Given that you’re doing wedding invitations, you probably can’t wait too long, but other folks might consider delaying a bit, as Adobe has made public mention of a “Bickham Script Pro” in the works. <br><br>Regards, <br><br>T</p>
