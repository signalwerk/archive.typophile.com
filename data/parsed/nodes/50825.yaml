    <p>Hi everyone!</p>
    <p>I’ ve been working in a typeface for some time now and came up with a question that I dont know how to awnser it!<br>
    The <a href="/wiki/ogonek" class="wiki">ogonek</a> that appears in the default enconding in fontlab is just one drawing.<br>
    I found several articles here where this subject is discussed and lots of fonts here all letters are draw.<br>
    My question is this:<br>
    Does the ogonek itself, that appears in the default enconding in fontlab, is enough?<br>
    Or should I draw all letters that use it? By the way, where can I find this list?</p>
    <p>Thanks in advance<br>
    António Fonseca</p>
