    html: <p>Put in your portfolio the type of work you want to do. Icon design is very much a part of graphic desingn (as well as Information Architecture, Human Factors, Usability, etc.) <br> <br>So, if you like doing icon design, and you feel yours are strong, then by all means, show them.</p>
