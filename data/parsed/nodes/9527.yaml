    <p>Hi everyone, <br> <br>I am about to graduate this April and we have a portfolio show coming up where people come in from all over the city to see our books. I was wondering what people think about icon design, should I put them in my portfolio? Or is it something graphic designers don't usually like to put in because they are more illustrative and kind of desktop publishing? My book has corp IDs, ads, logos, and the such. The logos that I create are fairly high in detail and more realistic approach. I'm just not sure if it would look awkward or unprofessional. Any art directors out there or other designers that can give me some direction?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/8291" class="topic-previous" title="Go to previous forum topic">‹ An InDesign Blog</a> <a href="/node/9568" class="topic-next" title="Go to next forum topic">Altsoft FTMaster 1.3 released ›</a></div>
