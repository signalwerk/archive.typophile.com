    <p>Hi,<br>
    I am looking for a typeface that is simple, legible, light, trustworthy.<br>
    For now, I have found three main options, as showed in the image.</p>
    <p>Any other idea? Comments?</p>
    <p>Regarding GOOD DOG NEW, I would like something as readable and handwritten, not too childish, but with more weights. Alternatives?</p>
    <p>Thanks, Paolo</p>
