      <p>“Talk to the people at Kinkos - you may be surprised at what they can do.”</p>
      <p>As well as surprised at how they can really screw up the simplest of instructions. That said, they never charge for mistakes, so you just have to do a bit of hand holding.</p>
      <p>Also, most any Kinkos or small print shop will have large format ink jet machines these days. Shouldn’t cost much at all.</p>
