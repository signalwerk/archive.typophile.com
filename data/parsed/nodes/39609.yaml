    <p>I need to print a short 8 spread page magazine [plus front and back cover] for a graphic design class thats 15 by 25 inches full spread.  Front and back, and hopefully in color.</p>
    <p>Is there any easy way to do this do you think, besides paying the big bucks and printing out large posters and glueing them together?</p>
    <p>I’d be willing to print in black and white.</p>
    <p>Thanks.</p>
    <p>F</p>
