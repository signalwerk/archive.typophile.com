    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Renee&nbsp;Ramsey-Passmore</strong></p>
    <p>Renee is originally from Louisana, and a graduate of both Southern Methodist University and The University of North Texas. She works as a graphic and web designer in the Chicago suburbs and teaches classes in graphic design and typography at Columbia College Chicago. She attributes her interest in typography to her father who was a civil engineer and map maker, and her mother, a fabric consultant and monogram&nbsp;designer.</p>
    <p>In 1997 her typeface Renee Display won third place in Linotype’s International Digital Type Design Contest. She has also designed the typeface Paige, named after her daughter, and the typeface Slate, named after her son. Paige is available from <span class="caps">T26</span> foundry, and Slate has not yet been&nbsp;marketed.</p>
