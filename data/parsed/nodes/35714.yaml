      <p><em>To me it looks like the caps in the photo are just resized.</em></p>
      <p>Well, it could be <a href="http://www.pbtweb.com/alpha26/alpha.htm"><strong>Paul Baker’s digital version</strong></a> of <a href="http://www.aiga.org/content.cfm/bradbury-thompson-alphabet-26"><strong>Bradbury Thompson’s Alphabet 26</strong></a>... Baker’s version uses an uppercase <strong>G</strong>, like in the invitation (Thompson’s had a lowercase <strong>g</strong>), and has a set of caps.</p>
      <p>Then again, fontplayer has already posted a link to Bodoni 26, which is another version of the same face, and it, too, has a set of caps (and an uppercase <strong>G</strong>).</p>
      <p>One more thing, this thread belongs in the Type ID Board.  :-)</p>
