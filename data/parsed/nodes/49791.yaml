    <p>There are so many lawn services. Please help me make this one a truly unique and well done logo. </p>
    <p>Neltner's lawn service is not a lawn mowing business but they do other up keep such as chemical spraying for greener lawns as described in my logo.</p>
    <p>So far I have worked off of Optima Italic to design the word "Neltner's", and have used Myriad Pro for the words, "LAWN SERVICE".</p>
    <p>I want to learn from you.</p><div class="imageWrap"><img src="http://typophile.com/files/Neltner's-lawn-service---Logo_4364.gif"></div><p></p>
