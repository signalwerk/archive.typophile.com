    <p>I am confused when browsing and buying new typefaces. Can someone help me.</p>
    <p>After reading a story about Akira Kobayashi last night in HOW magazine, I was interested in his Clifford set but don't understand the difference between Clifford Roman, Clifford Six Roman, Clifford Eighteen Roman, Clifford Nine Roman and so on. What do these numbers mean? I've seen it before in Trade Gothic with Trade Gothic Eighteen and Trade Gothic Twenty but never really understood the purpose of those numbers.</p>
    <p>I thought if I'm going to find out any where it would be here on Typophile.</p>
    <p>Thanks for any help!</p>
