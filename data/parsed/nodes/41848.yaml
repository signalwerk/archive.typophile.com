    html: |-
      <p>Numbering like this can have different meanings. As has already been pointed out, the numbers in Clifford indicate target sizes for which the design is optimized.</p>
      <p>Examples of other designs that utilize this type of designation include </p>
      <p>Paperback Text 6, 8, and 12; Paperback Display 24, 28, and 96<br>
      ITC Bodoni Six, Twelve, and Seventy Two<br>
      Cycles Five, Seven, Nine, Eleven, Eighteen, Twenty Four, and Thirty Six</p>
      <p>As Tiffany points out, not all designers who work on optically optimized variants use a numbered size designation. The Freight family is one approach (Micro, Text, Display, Big). Adobe uses the approach of Caption, Text, Subhead, Display.</p>
      <p>Also, as Don humorously points out, sometimes a number in a name is not a size designation. Sometimes it is just a series designation. This is the case with Trade Gothic, I believe. The two styles Condensed 18 and Bold Condensed 20 are not targeted at 18 and 20 point; they are related series.</p>
      <p>Which leads to the other kind of number system: a rationalized matrix of weights and styles. This was pioneered by Frutiger with Univers and the 2-digit system to relate style and weight.</p>
      <p>Another example of this approach would be H&amp;FJ's Knockout with numbered styles from 26 to 94 -- the first digit indicates relative weight, the second digit indicates relative width. </p>
      <p>FB's Giza family uses different numbers but a similar scheme: first digit is weight, second is width.</p>
      <p>However, just to confuse everyone, FB's original Bureau Grotesque family's scheme is the opposite: the first digit indicates width and the second indicates the weight.</p>
      <p>I think I got those right. Knockout's scheme is particularly challenging to follow, since the weight (first digit) crosses thresholds within a single weight column.</p>
      <p>-- K.</p>
