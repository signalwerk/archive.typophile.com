      <p>Yes, I did mean Luxury Gold. Not the first mistake I made today. Thank you all for all the help. In terms of look, it’s a trade off. It’s either the wide width. Or the look and attitude of the characters without the width. Definitely need upper and lower case, so to make a long story even longer, for wide gothics, may use Sweet Sans or even Univers exteneds, or Helvetica Neue extended. For not-extened faces, I could use Neutraface or even Gill Sans.</p>
      <p>Andy</p>
