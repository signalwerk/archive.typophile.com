  html: <p>Legacy Gold (House Industries), comes in only one weight with no italics. Does anyone know a similar font that comes with a full complement of weights and italics? Unfortunately, I am having javascript errors on my end trying to upload the image file of the font. So if you want to help me out, you’ll have to go the extra step of seeing what Legacy Gold looks like on your end. I’ve never had a problem with the upload process before, so as a side issue, if anyone knows what I’m doing wrong, let me know.</p>
