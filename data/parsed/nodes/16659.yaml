  html: |-
    <p>I just downloaded the free Meta Pro from Fontshop. Is anyone else surprised that the tied st ligature is a default lig in Meta Pro? </p>
    <p>This seems a strange choice for a "workhorse" font, especially since such less obtrusive ligs like fft are discretionary. Is this a mistake?</p>
