      <p>&gt; what the law <cite>ought</cite> to be is irrelevant to the current discussion.</p>
      <p>The Whyte judgment ruled:</p>
      <p><cite>"King also infringed when he loaded into his computer's random access memory copies of the Adobe program. See Sega Enters. v. Accolade, Inc., 977 F.2d 1510 (9th Cir. 1992). His fair use defense fails because his intermediate copying utilized unauthorized copies of the Adobe programs in an apparent attempt to avoid being a party to Adobe's license agreement."</cite></p>
      <p>This is what IS (according to Whyte), not what OUGHT to be (according to Whyte).</p>
      <p>But this has the legal consequence (according to Whyte) that anyone viewing the PDF</p>
      <p><a href="http://www.sanskritweb.net/forgers/veracity.pdf" title="www.sanskritweb.net/forgers/veracity.pdf">www.sanskritweb.net/forgers/veracity.pdf</a></p>
      <p>commits the crime of copyright infringement.</p>
      <p>For instance, Thomas Phinney, who downloaded this PDF file committed the crime of copyright infringement, unless he is <cite>"a party to Adobe's license agreement" <cite>.</cite></cite></p>
      <p>Thomas Phinney, who all of a sudden claims that one OUGHT to consider downloading of PDF files containing fonts as fair use, now deliberately disrespects the Whyte judgment ruling that this is NOT fair use and that anyone downloading PDF files with embedded fonts is a criminal, because, as Thomas Phinney correctly states, <cite>"Opening a PDF loads its fonts into memory, and the person opening the PDF might not have any involvement in licensing that font."</cite></p>
      <p>For instance, if you search in Google for "filetype:pdf"</p>
