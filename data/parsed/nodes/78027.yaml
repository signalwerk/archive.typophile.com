    date: 2011-01-22T10:35:00
    votes: null
    html: <p>As I have written here before, whether Uli's arguments are good or bad, US law doesn't care about his views unless he is a party to a lawsuit here. However, the US law does care about the judge's opinion in the Abobe et al. vs SSI case, as it set precedent. It might be overturned, but meanwhile it is, I believe, the guidance that everyone involved in font commerce in the US has looked to.</p>
