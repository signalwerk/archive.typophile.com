      <p><cite>"Do not make the legal mistake of claiming copyright to digitizations of the public domain Erbar fonts, because nobody can claim copyright to something that is in public domain. Neither the heirs of Erbar nor anyone else can do that. Therefore, a digitization of Erbar Mediaeval will be public domain too, just like the original font made by Erbar is public domain."</cite></p>
      <p><cite>"Many people at the Typophile website erroneously think that they can become the copyright owner of a public domain font by digitizing this public domain font. This is legal nonsense."</cite></p>
      <p>Uli is misrepresenting both the views of "many people at the Typophile website" and as far as I can tell, the reasonably settled state of US law on the subject, by conflating the underlying design and the digital representation.</p>
      <p>What is commonly believed and claimed is that by digitizing a public domain *design*, one may create a digital font and have copyright on the font. This belief is founded on pre-existing practice, strongly supported by both the broad situation and the details of the summary judgment of Judge Ronald Whyte of the US 9th Federal District Court in the Adobe v SSI case.</p>
      <p><a href="http://directory.serifmagazine.com/Ethics_and_Law/Copyright/judgement.php4">http://directory.serifmagazine.com/Ethics_and_Law/Copyright/judgement.php4</a></p>
      <p>Specifically, Whyte found:</p>
      <p>"The evidence presented shows that there is some creativity in designing the font software programs. While the glyph dictates to a certain extent what points the editor must choose, it does not dictate every point that must be chosen. Adobe has shown that font editors make creative choices as to what points to select based on the image in front of them on the computer screen. The code is determined directly from the selection of the points. Thus, any copying of the points is copying of literal expression, that is, in essence, copying of the computer code itself."</p>
      <p>Whether or not the abstract design is protected by copyright (which it sadly is not in the USA), the placement of on and off-curve points in digitizing that design is itself protected by copyright in the USA. Judge Whyte found this to be the case as a simple matter of law.</p>
      <p>Neither Uli nor I is a lawyer, and the sensible thing to do would be to consult one on these sorts of questions.</p>
      <p>The other sensible thing to do would be to consider the past behavior of the most likely complainant, Berthold, the likelihood of them suing you, and whether you are willing to contend with such a lawsuit, even if you have reason to believe you could win in the end.</p>
      <p>Cheers,</p>
      <p>T</p>
