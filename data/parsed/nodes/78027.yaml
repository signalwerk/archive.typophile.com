      <p>I know it's momentous that Uli agrees with Nick but I have to bust the feel-good bubble: you're both as wrong as wrong can be.</p>
      <p>Typefaces enjoy no claims of copyright. This is flat-out indisputably true.<br>
      Why would an IP attorney need to know a damned thing about type to function well?<br>
      It's irrelevant.<br>
      There is no need to be an expert on type science. Academic qualifications in graphic design or typography are equally irrelevant.</p>
      <p>The claim is that fonts are copyrightable <em>as software</em>, not type. It is the original expression as it might or might not exist within the font <em>as software</em> that is the issue. Software is software, right? Code.<br>
      Type, as such, DOES NOT ENTER INTO IT except for how the code, as original expression (or not), shapes the resulting type. The design of that type is irrelevant. All typefaces are the same for the legal issues at hand. Pick a font, any font, doesn't matter.</p>
