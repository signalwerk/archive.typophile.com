    html: |-
      <p>@all</p>
      <p>I don't know what "legal nonsense" means, all I can know is how courts have ruled. And upon reflection, if I'm taking issue with someone who has the bona fides of Thomas Phinney, maybe I ought to back up what I say a little.</p>
      <p>First, it has to be noted that all typefaces are unprotectable and in the public domain in the US. It doesn't matter if the typeface was created yesterday or 400 years ago. The title of this thread carries the implication that it could be otherwise - that one typeface could be "more" public domain than another. Hah! Ain't so.</p>
      <p>In case law, there are four cases that appear to have special significance in light of the Adobe v SSI ruling:<br>
      <a href="http://scholar.google.com/scholar_case?case=16845746302991569414&amp;hl=en&amp;as_sdt=2&amp;as_vis=1&amp;oi=scholarr" rel="nofollow">L. Batlin And Son v Snyder</a> decided by the US Court Of Appeals, Second Circuit in 1976.<br>
      <a href="http://www.law.cornell.edu/copyright/cases/36_FSupp2d_191.htm" rel="nofollow">Bridgeman Art Library v Corel Corp</a> decided by a US District Court in 1999.<br>
      <a href="http://www.ca10.uscourts.gov/opinions/06/06-4222.pdf" rel="nofollow">Meshworks v Toyota Motor Corp</a> decided by the US Court Of Appeals, Tenth Circuit in 2008.<br>
      Lastly, there's the Supreme Court opinion from 1991, <a href="http://caselaw.lp.findlaw.com/scripts/getcase.pl?court=US&amp;vol=499&amp;invol=340" rel="nofollow">Feist v Rural</a>.</p>
      <p>When you read these opinions along with their cross-citations <em>in total</em>, it's hard see Whyte's decision in Adobe v SSI as anything other than an abberration.<br>
      (And BTW - in Whyte's decision there is a quotation from an Announcement in the Federal Registry by the US Copyright Office titled "Registrability Of Computer Programs That Generate Typefaces" that is completely misinterpreted. If you read the whole thing (2 pages) it's perfectly clear that the "computer programs" it refers to are what we would normally refer to as rasterizers, not TrueType or PostScript fonts. And it is carefully worded to make no claims as to the validity or level of copyright protection that may be obtained by registration, no matter how you interpret what kind of software it references.)<br>
      This is just one of several glaring errors in the SSI decision. IMHO.</p>
      <p>My guess is that King was not a sympathetic defendant. And Whyte was happy to go along with a cherry-picking of the facts and precedent in order to find against him. It happens, and maybe King had it coming and the good guys won. Who knows.</p>
      <p>Anyway, it's impossible to reconcile SSI with these other decisions.<br>
      Adobe lucked out, that's all. Speaking only for myself - I would have to have especially opaque blinders on not to consider fonts, all fonts - certainly, absolutely, the outlines - as public domain. Period.<br>
      Meshworks especially, being an appellate decision, has a far greater weight of authority than SSI. And it would, I imagine, be controlling in any "fonts as copyrightable software" case since the facts are nearly identical.</p>
      <p>Before the advent of computers all typefaces were public domain. With the advent of computers, a claim was made that, as digital creations, typefaces could be copyrighted as software.<br>
      The courts, on the whole, say this ain't so. It's pretty clear, frankly.</p>
      <p>And this might partially explain why Uli's dog hasn't barked, that is, why there's been no infringement suits in the US for thirteen years. (But legal costs and the overall effetiveness of licensing can explain it, too.)</p>
      <p>Note that licensing is contract law and another matter entirely.</p>
      <p>rich</p>
