      <p>13 years ago, Judge Whyte declared in his strange summary judgment:</p>
      <p><strong>"King also infringed when he loaded into his computer's random access memory copies of the Adobe program."</strong></p>
      <p>Now I prove step by step that the Whyte judgment is utter legal nonsense:</p>
      <p><strong>Step 1:</strong></p>
      <p>Load e.g. this PDF containing a Whyte judgment into your computer's memory:</p>
      <p><a href="http://www.greenisthenewred.com/blog/wp-content/Images/100712_aeta4_dismissed.pdf" title="www.greenisthenewred.com/blog/wp-content/Images/100712_aeta4_dismissed.pdf">www.greenisthenewred.com/blog/wp-content/Images/100712_aeta4_dismissed.pdf</a></p>
      <p><strong>Step 2:</strong></p>
      <p>Look at the blue running header:</p>
      <p><cite>"Case5:09-cr-00263-RMW Document177 Filed07/12/10 Page1 of 14"</cite></p>
      <p>This running header starts with the capital letter "C" of the word "Case".</p>
      <p>This "C" is typeset in Helvetica by this "program" embedded into the PDF:</p>
      <p>%ADOBeginSubsetFont: KQPJUO+Helvetica AddGlyphs<br>
      ...<br>
      %%Copyright: Copyright 2011 Adobe System Incorporated. All rights reserved.<br>
      ...<br>
      /C &lt;1C60D8A8C9B6079F6D8209747A86332E73924F1B07F271169856A53C9157<br>
      71D7C530ADE68D8CA49F0A6B3478F9E8176949771F40D91B68E1A88C72CE81CC<br>
      0A91B3CFB642960E7EB2127A1637D49961A11F5DD40622F39379CDAB7E5B349D<br>
      F832E4955008C5E3208AB258B012A237635179513D820ACF76E0A17ED392C351<br>
      599687E8E7D0&gt; |-</p>
      <p><strong>Step 3:</strong></p>
      <p>According to Judge Whyte, unless you have licensed the "program" of the letter "C" of Helvetica, you just committed the crime of copyright by loading the "program" of the letter "C" into your computer's random access memory.</p>
      <p>This is utter legal nonsense.</p>
      <p>According to Judge Whyte, millions of people, day by day, commit millions of crimes of copyright or millions of copyright infringements by downloading and viewing millions of PDF files from millions of Internet websites.</p>
