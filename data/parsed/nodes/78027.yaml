    html: |-
      <p>Thomas,</p>
      <p>I would prefer just to leave it alone at this point. Summarizing the holdings from each case and connecting the dots is just too much work. And I'm under no obligation, thank heavens, to educate anybody on this issue except myself. It won't win me any points on anybody's scorecard. But I stand by my conclusion, though.</p>
      <p>There's been too much FUD for too many years and that will continue. One self-interested person will say Tomato and another self-interested person will say Tomahto.<br>
      And without the concurrence of some leading legal people, it would have little to no impact, if even then.</p>
      <p>That's why I just cited the cases so that anyone who wishes can make of them what they will. If I do write up a full analysis - and seek input from the legal community - you'll be the first to know. (I do intend to discuss it with <em>my</em> IP attorney, however.)</p>
      <p>With regard to <em>your</em> interpretation of the Announcement in the Federal Registry my answer is this, to anybody who's interested and stumbles upon this thread:</p>
      <p>1) Read the <a href="http://www.copyright.gov/history/mls/ML-359.pdf<br />
      " rel="nofollow">1986 policy</a> and the <a href="http://www.copyright.gov/history/mls/ML-443.pdf<br />
      " rel="nofollow">1992 revision</a> and come to your own conclusions.</p>
      <p>I don't know enough about how the Copyright Office works to comment on why they might or might not issue a registration. The Announcement was about a procedural issue -about the need for an applicant to file a disclaimer, a procedure adopted with its previous policy decision in 1986 - which they discontinued. Other than that, I don't know anything other than what it says and it's hard to square what it says with the notion that they're talking about something akin to an OpenType font unless you cherry pick paragraphs. And there is the added complication that protectable material could certainly be included in an OpenType file. But not a typeface AS typeface.</p>
      <p>See this scholarly essay <a href="http://www-personal.umich.edu/~pfs/essay2.html" rel="nofollow">here</a>, for another take on this.</p>
      <p>2) Being able to register a font is proof of nothing. As the court answered in Bridgewater v Corel. [Emphasis mine]</p>
      <p><em>"plaintiff argues also that the fact that the Register of Copyright issued a certificate of registration for one of plaintiff's transparencies demonstrates that its photographs are copyrightable under U.S. law. The argument is misguided."</em></p>
      <p><em>"No one disputes that most photographs are copyrightable. In consequence, <strong>the issuance of a certificate of registration</strong> for a photograph <strong>proves nothing</strong>. And while the certificate is prima facie evidence of the validity of the copyright, including the originality of the work, the presumption is not irrebuttable. Here, the facts pertinent to the issue of originality are undisputed. The Court has held as a matter of law, and reiterates, that plaintiff's works are not original under either British or United States law."</em></p>
      <p>In other words, in Bridgewater, the court rendered the registration certificate fit for wrapping fish.</p>
      <p>BTW - In fishing up the links I kept discovering more and more legal or legal-like stuff. This looked interesting by a lawyer named Blake Fry.<br>
      <a href="http://www.jthtl.org/content/articles/V8I2/JTHTLv8i2_Fry.PDF" rel="nofollow">Why Typefaces Proliferate Without Copyright Protection</a></p>
      <p>Anyway, bottom line, as the decision in Bridgewater says, registrability proves nothing.</p>
      <p>And now I'm outta heah.</p>
      <p>Rich</p>
