      <p>Geez, it's a lawyer's job to represent their clients, whether their clients are in the right or not. That's the whole way the legal system works, in pretty nearly every country in the world with a functioning independent legal system. Criticizing Martinez for effectively representing his client is just nuts. If you don't like it, blame Bauer for claiming a trademark they shouldn't, not their lawyer for sending a letter at their request.</p>
      <p>For what it's worth Bauer Types SA is at least a bit more than just a faceless holding company with trademarks, I've met a couple of their people at type conferences, repeatedly.</p>
      <p>Richard: You fail to address my point, which is that being familiar with the case law and the state of the law with respect to fonts is specific expertise. Martinez doesn't have to do a bunch of reading and research, which would have to be paid for by the client. Just knowing general info about copyright isn't enough, it's important to know how it has been applied in this area.</p>
