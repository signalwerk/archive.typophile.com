      <p>William Berkson:</p>
      <p>&gt; You don't seem to get the concept of "precedent".</p>
      <p>The Whyte judgment, dated 30 January 1998, took place 13 years ago. </p>
      <p>During these past 13 years, innumerable outfits ignoring the Whyte "precedent" have been selling the SSI clone fonts, and Adobe during all these 13 years never cared about sueing any of these innumerable outfits for selling Veracity and other SSI clones.</p>
      <p>So, if Adobe, now 13 years later, all of a sudden starts to sue these numerous outfits, e.g. the guys running the <a href="http://www.azfonts.net" title="www.azfonts.net">www.azfonts.net</a> website, the judge, after looking at the Whyte "precedent", would ask, why Adobe during the past 13 years has ignored the Whyte "precedent" thus acting against own interests (German law: "venire contra factum proprium", US law: "estoppel by delay", etc.).</p>
