      <p>William Berkson:</p>
      <p>&gt; <cite>However, the US law does care about the judge's opinion in the Abobe et al. vs SSI case, as it set precedent.</cite></p>
      <p>The SSI summary judgment is not valid for all fonts of all companies in the world, but it is only valid for the US company SSI, which is defunct now, and it is only valid for one SSI font, namely for the Adobe font Utopia sold by SSI as the clone Veracity.</p>
      <p>see <a href="http://www.sanskritweb.net/forgers/ssi.pdf" title="www.sanskritweb.net/forgers/ssi.pdf">www.sanskritweb.net/forgers/ssi.pdf</a></p>
      <p>The SSI summary judgment is of no avail, if other companies sell the clone Veracity, about which judge Whyte made his summary judgment. For instance the website</p>
      <p><a href="http://www.azfonts.net" title="www.azfonts.net">www.azfonts.net</a></p>
      <p>and numerous other websites offer the SSI clone Veracity and other SSI fonts for sale or for free download. Although Adobe knows that the clone Veracity and other SSI fonts have been offered for sale by numerous companies during the past ten years, Adobe never dared to sue any ot these companies for fear of losing at court, because the Whyte judgment was a strange summary judgment, which presumably will never be confirmed by any other judge.</p>
