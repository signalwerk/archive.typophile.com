      <p>Let me add a small information.</p>
      <p>A type design from someone dead in 1935 is in public domain in almost all countries –standard copyright length varies from 50 to 70 years. So, it can be freely reused to create new fonts. But the new font based on that type design is <strong>not</strong> in public domain.</p>
      <p>See: a new font has other additional works, as digitalization, OT programing and kerning. This is new intellectual creation and cannot be freely reused. Thus, the font cannot be freely copied, its use must follow the EULA conditions.</p>
      <p>What remain in public domain even in the new font is the type design. This means anyone can produce another font using the same design. There is no illegal copy of the glyphs as their shapes are public (of course, I'm talking about a simple reedition of a font in new format. maybe with small adjusts, and not a revival).</p>
      <p>In some countries, there is a split between copyright and software protection. Under this legal model, this new font wouldn't have elements protected by copyright (the only artistic creation is the type design and it's expired). But anyway this new font cannot be copied due to software protection –which actually is very similar to copyright, but preserves technical solutions instead of artistic creations.</p>
      <p>Analogy with music applies. A piece from Debussy is in public domain; it can be freely performed and recorded by any orchestra. But a CD with his works is not public domain –it brings efforts by other people, some of them also protected by copyright, as performers– and cannot be copied.</p>
      <p>Almost all Western countries follow these guidelines, with small variations, as Intellectual Property rules proposed by WIPO were adopted in a near standard basis.</p>
