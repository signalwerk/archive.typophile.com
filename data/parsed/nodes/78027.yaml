      <p>typodermic:</p>
      <p>&gt; <cite>A few weeks ago it took me 5 solid days to attempt to recall a free font from a zillion font sites</cite></p>
      <p>This is surprising, since the trademark law does not apply to non-trade things.</p>
      <p>If a font is really for free, i.e. if the font is not a commercial commodity sold against payment, but a font made just for fun, the trademark law does not apply at all to such a non-commercial, non-trade object.</p>
      <p>For instance, if someone writes the trademark "Pepsi-Cola" just for fun on the hood of his old car, he cannot be sued by PepsiCo Inc. The same holds true, if someone making a free font as a pastime or leisure activity labels this free font "Pepsi-Cola".</p>
      <p>Even a novelist cannot be sued by PepsiCo Inc, if the novel begins with the sentence:</p>
      <p><strong>"The trademark shyster with his greedy eyes was drinking Pepsi-Cola"</strong></p>
      <p>If all this were forbidden by trademark law, you could not even enter a drug store or a pub and say: "I want to drink a Pepsi-Cola", without fearing to receive a cease-and-desist letter by some trademark shyster.</p>
