      <p>&gt; <cite>Uli - it no longer matters what Judge Whyte thought in 1998. But he was not alone in considering a RAM copy, a copy under the law. It is now not infringement to view the PDF under the Title 17 statute in the US Copyright law. Loading a "program" into RAM as a normal part of utilization is not infringement. According the following quotation from Cornell University, this was added to the law in 2000.</cite></p>
      <p>I understand that you want to help Thomas Phinney, who behaves like a cornered rabbit, but referring to § 117 does not solve the problems of the Whyte judgment.</p>
      <p>§ 117 of US Copyright Law is old hat added before the Whyte judgment and enacted December 12, 1980. See here page 1 and page 14:</p>
      <p><a href="http://www.history.nih.gov/research/downloads/PL96-517.pdf" title="www.history.nih.gov/research/downloads/PL96-517.pdf">www.history.nih.gov/research/downloads/PL96-517.pdf</a></p>
      <p>§ 117 states that <cite>"Making of additional copy ... is not an infringement <strong>for the owner</strong> of a copy of a computer program".</cite></p>
      <p>It is obvious that the downloader of a copy of a computer program is not the owner of the copy of the computer program, nor does the downloader become the owner of a copy by copying the copy into the random access memory of his computer.</p>
