    html: <p>@Uli - Law or no law, the common concensus is that once you buy a copy of a commercial program, you are the de-facto owner of that copy, only without the rights to copy except as needed for the normal operation of the program. Judge Whyte may have made a precedent, but he does not make law. Only institutions like Congress, Parliament and the Bundestag get to do that. Nope, Ministries/Departments make regulations and must base them on existing law.</p>
