      <p>Nonsense, of course he can be sued. Whether or not the lawsuit would be successful is another matter.</p>
      <p>Richard: I don't think the situation at hand is actually all that complex. If *I* were considering doing it, I'd assume that the printed design from pre-1935 is fair game as a source, that other people's recent digital font versions of that same design are not, and that the status of the name is uncertain but not worth the risk given that Berthold seems to have some claim on it. It's just that I know better than to offer legal advice as such.</p>
      <p>I am myself on the verge of taking a printed work (rules for a complex strategy game) that was created over a couple of decades (1960-1983) by ongoing collaboration of a loose evolving and changing bunch of people who never bothered even sticking their names on it, and making my descendant of it publicly available. I'm putting a fair bit of work into tracking down some of those people first, to see if I can get their blessing and reassurance that such availability is cool with them and the kind of thing that they think the creators would have approved of. But technically there is a legal risk involved, and I recognize that, even if I think the likelihood of anyone who has a claim on some portion of the game rules turning up and objecting is vanishingly small.</p>
      <p>Cheers,</p>
      <p>T</p>
