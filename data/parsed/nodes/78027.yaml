      <p>In addition, the plaintiff (= Adobe) was the "expert" consulted by the judge. This is ridiculous. An independent expert such as  mathematics professor Luc Devroye would have explained that "points" are no computer programs, no software.</p>
  - id: 448567
    user_id: 6470
    user_name: oldnick
    user_path: null
    user_image: /files/pictures/picture-6470.gif
    date_raw: 22 Jan 2011 — 9:57am
    date: 2011-01-22T09:57:00
    votes: null
    html: <p>Points are waystations on the journey. Every glyph in a font is described by a SPECIFIC set of mathematical instructions used to construct that glyph. Starting from a base reference (usually 0,0), the code lays out the waystations and the kinds of paths used to connect them. If the code used to describe a specific character in one fonts is ABSOLUTELY IDENTICAL to the code used to describe the same character in another font, chances are EXTREMELY HIGH that one is a direct copy of the other. Period.</p>
