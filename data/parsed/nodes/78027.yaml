      <p>&gt; Uh, I wouldn't be so sure about that. The courts in America, at least, seem to have never seen a contract provision they don't like.</p>
      <p>I was thinking of third-party-provisions. At least here in Europe, two parties A and B cannot stipulate a contract to the detriment of a third party C. For instance, if a third party C downloads a PDF with a font embedded which is copied into the RAM of his computer, this is illegal according to Judge Whyte, but the parties A and B cannot make a contract which allows or forbids the third person C to download the PDF, unless the third party also signs the contract.</p>
