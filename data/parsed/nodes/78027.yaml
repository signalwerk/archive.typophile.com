      <p>William Berkson:</p>
      <p>Since you address me directly, I will answer directly.</p>
      <p>Since I have written several books about computer programming, I know what I am talking about. If someone claims that the data points of glyphs are computer programs, I cannot but laugh.</p>
      <p>Look at this trivial BASIC two-liner:</p>
      <p>1 DATA C,O,M,P,U,T,E,R<br>
      2 FOR I = 1 TO 8: READ LETTER: PRINT LETTER;: NEXT I</p>
      <p>The <strong>data segment</strong> is line 1, and the <strong>code segment</strong> is line 2.</p>
      <p>Data and code may be mixed, but they are and remain two completely different things.</p>
      <p>For TTF fonts, I have proved irrefutably, that the sequence of numbers describing the x-y coordinates of the outlines of TTF glyphs are no code, but data only.</p>
      <p>see <a href="http://www.sanskritweb.net/forgers/computerprogramm.pdf" title="www.sanskritweb.net/forgers/computerprogramm.pdf">www.sanskritweb.net/forgers/computerprogramm.pdf</a>, pages 5-7</p>
      <p>(This does not apply to TTF hints, which are code, but this is not the topic of this thread. For TTF hints as code, see above file computerprogramm.pdf, pages 8-10).</p>
      <p>Theoretically, it would be possible to program a huge mixed code-and-data rasterizer including as code segment the rasterizer proper and as data segment the entire Adobe Font Folio library. Nevertheless, you could distinguish the code (= rasterizer proper) and the data (= fonts proper).</p>
      <p>Since you are no computer programmer, let me explain it in this metaphorical way:</p>
      <p>If you have a cup of coffee, you can distinguish between the cup (code) and the coffee (data). The cup remains the same, but the beverages may change (coffee, milk, water). Likewise, the rasterizer (code) of a given operating system remains the same, but the fonts (data) may change, i.e. the same rasterizer code may process different font data (e.g. Helvetica, Times, etc.)</p>
      <p>If a judge shows this sequence of numbers</p>
      <p>-227 0 0 227 160 160 228 0<br>
      0 -228 -153 234 333 0 0 -333 etc.</p>
      <p>(see <a href="http://www.sanskritweb.net/forgers/computerprogramm.pdf" title="www.sanskritweb.net/forgers/computerprogramm.pdf">www.sanskritweb.net/forgers/computerprogramm.pdf</a>, page 6)</p>
      <p>to a mathematician and claims that this sequences of numbers is a computer program, the mathematician will ask the judge, whether he is sane in the brain.</p>
      <p>Judge Whyte, who obviously thinks that anyone, e.g US Chief Justice John G. Roberts, is a computer programmer, if he draws e.g. an egg with a drawing program, will never understand that drawings are no computer programs, nor will he ever understand that sequences of numbers are no computer programs.</p>
      <p>see <a href="http://www.sanskritweb.net/forgers/publicdomain.pdf" title="www.sanskritweb.net/forgers/publicdomain.pdf">www.sanskritweb.net/forgers/publicdomain.pdf</a>, page 2</p>
      <p>Since Adobe knows that the Whyte judgment is nonsense, Adobe never dared to sue anyone selling the Veracity alias Utopia font during the past decade.</p>
