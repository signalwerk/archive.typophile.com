      <p>@uli...</p>
      <p>I don't need to prove anything; I merely made a "better safe than sorry" suggestion.</p>
      <p>Yes, copyright laws differ from country to country: what Germany says cannot be done may be perfectly allowable under US copyright law. For example, Berthold claimed copyright to the name Boton BE/BQ, which effectively prevented Alfred Boton from using HIS OWN NAME for any other of his works in the US.</p>
      <p>Lawsuits don't have to have a sound basis in order to be filed but, in US courts at least, once a person is sued, it is his or her responsibility to prove that the claims are bogus: in other words, in civil court, one is presumed guilty unless he or she proves otherwise. So, I repeat: better safe than sorry.</p>
