      <p>Judge Whyte's "summary judgment" has a Wikipedia entry:</p>
      <p><a href="http://en.wikipedia.org/wiki/Adobe_Systems,_Inc._v._Southern_Software,_Inc" title="http://en.wikipedia.org/wiki/Adobe_Systems,_Inc._v._Southern_Software,_Inc">http://en.wikipedia.org/wiki/Adobe_Systems,_Inc._v._Southern_Software,_Inc</a>.</p>
      <p>There we read:</p>
      <p><strong>"Since the font editing programs extracted control points from Adobe's fonts, use of those programs constituted copying of literal expression. Thus, King also infringed on Adobe's copyright through intermediate copying into RAM."</strong></p>
      <p>Was this Wiki entry sponsored by Judge Ronald M. Whyte?</p>
      <p>- According to Judge Whyte, whosoever uses Fontlab or Fontographer, which extract the control points from fonts, commits copyright infringement by illegal copying.</p>
      <p>- According to Judge Whyte, whosoever uses the Windows or Mac operating system, which extract the control points from fonts, commits copyright infringement.</p>
      <p>- According to Judge Whyte, whosoever uses Adobe Acrobat and other PDF tools, which extract the control points from fonts, commits copyright infringement.</p>
      <p>- According to Judge Whyte, whosoever uses Coreldraw or other drawing programs, which extract the control points from fonts, commits copyright infringement.</p>
      <p>- According to Judge Whyte, whosoever uses Internet Explorer or any other browser, which extract the control points from fonts to display this Typophile thread you are reading at this very moment, commits copyright infringement.</p>
      <p>Believe Judge Whyte, and you'll believe anything.</p>
