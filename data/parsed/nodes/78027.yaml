      <p>Thomas Phinney:</p>
      <p><cite>&gt; Opening a PDF loads its fonts into memory, and the person opening the PDF might not have any involvement in licensing that font. Of course, there would seem to also be some very simple solutions to this. One would be to consider such actions to be fair use by the viewer when they were occurring simply for the purposes of viewing documents with embedded or linked fonts, and the viewer was not duplicating the font (which would not mean that setting up that situation by embedding or linking the font is automatically fair use). Another would be for the font vendors to clarify in their copyright statements what uses they permit for unlicensed people.</cite></p>
      <p>All these proposals are legal rubbish. You cannot force font licensors to adopt fair use rules for all fonts. This could only be done by law, not by contract. But since this strange American Judge Ronald M. Whyte ruled that it is forbidden by fair use to copy unlicensed fonts into computer memory, everyone downloading PDF files with embedded fonts commits the crime of copyright infringement, unless he licensed these fonts before downloading the PDF files. Therefore, those who offer PDF files for download and who think that the bizarre judgment by the strange Judge Ronald M. Whyte is no legal rubbish, must provide the download link with the following proviso (example):</p>
      <p><strong>Warning: Do not download the following PDF, unless you have acquired a licence to the Utopia font. If you download this PDF without a licence to the Utopia font, you will commit the crime of copyright infringement according to the judgment by Judge Ronald M. Whyte:</strong></p>
      <p><a href="http://www.sanskritweb.net/forgers/veracity.pdf" title="http://www.sanskritweb.net/forgers/veracity.pdf">http://www.sanskritweb.net/forgers/veracity.pdf</a></p>
