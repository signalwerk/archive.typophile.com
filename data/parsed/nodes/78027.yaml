  html: |-
    <p>A Typophile member asked me by email the question, whether he is permitted to digitize an old font no longer sold by the original foundry and then sell this digitized font using the old font name.</p>
    <p>Since this is a question which will interest other Typophile members too, I summarize here what I wrote to the member, who asked me the question. While the trademark laws vary from country to country, there are usually two principles applied in most countries and summarized here at the Wikipedia website <a href="http://en.wikipedia.org/wiki/Trademark" title="http://en.wikipedia.org/wiki/Trademark">http://en.wikipedia.org/wiki/Trademark</a> as follows:</p>
    <p>"Proprietary rights in relation to a trademark may be established <strong>through actual use</strong> in the marketplace, or <strong>through registration</strong> of the mark with the trademarks office of a particular jurisdiction."</p>
    <p>The Typophile member asked me, whether he is permitted to digitize the old font "Erbar Medieval" and sell it by its original font name "Erbar Medieval".</p>
    <p>Here is a sample of one of the bold cuts of this old font</p>
    <p><a href="http://www.sanskritweb.net/temporary/Erbar-II.jpg" title="www.sanskritweb.net/temporary/Erbar-II.jpg">www.sanskritweb.net/temporary/Erbar-II.jpg</a></p>
    <p>drawn from a book by Georg Kandler</p>
    <p>"Erinnerungen an den Bleisatz", Volume 1, 1995, page 26<br>
    ("Reminiscences of the foundry type era")</p>
    <p>Erbar Mediaeval is a typeface which was designed by the German Jakob Erbar, who died in 1935 in Cologne in Germany.</p>
    <p>Even if fonts were copyrightable in Germany (which they are not), the "70-years-post-mortem" copyright protection period would have expired a couple of years ago (1935 + 70 = 2005).</p>
    <p>However, fonts may be registered as designs in Germany for a period of 25 years starting with the first publication of the font. This period expired too.</p>
    <p>Since Erbar died in 1935, all his copyrightable works (e.g. his books etc.), if any, and all his fonts registered as designs, if any, have already fallen into public domain.</p>
    <p>Therefore today nobody can can claim any copyright to the works and to the fonts made by Jakob Erbar, because Erbar's death was more than 70 years ago.</p>
    <p>Do not make the legal mistake of claiming copyright to digitizations of the public domain Erbar fonts, because nobody can claim copyright to something that is in public domain. Neither the heirs of Erbar nor anyone else can do that. Therefore, a digitization of Erbar Mediaeval will be public domain too, just like the original font made by Erbar is public domain.</p>
    <p>Many people at the Typophile website erroneously think that they can become the copyright owner of a public domain font by digitizing this public domain font. This is legal nonsense.</p>
    <p>As regards the name of a font, it may be registered forever, provided you pay the trademark registration fees forever. I did NOT research in depth whether anyone registered the name "Erbar Mediaeval" for a font. Such a research is cumbersome and time-consuming, because the name of a product may be registered in any country of the world.</p>
    <p>As regards the website <a href="http://www.bauertypes.com" title="www.bauertypes.com">www.bauertypes.com</a>, a certain "c. Dr. Ferran, nº 6-8 Entlo 2º A 08034 Barcelona Tel. +34 931127993 - Fax +34 932524806" seems to be responsible for this website. At the subsite</p>
    <p><a href="http://www.bauertypes.com/categorias/index/32/quienes-somos" title="www.bauertypes.com/categorias/index/32/quienes-somos">www.bauertypes.com/categorias/index/32/quienes-somos</a></p>
    <p>we read:</p>
    <p>"Trademarks: BauerTypes, como principal fabricante de tipografía en la era de plomo posee la patente o TradeMark de un sinfín de tipografías dentro del marco de los grandes clásicos. Entre las más destacadas se encuentran: ver listado"</p>
    <p>However, the trademark list</p>
    <p><a href="http://www.bauertypes.com/arxiu/Pdfs/c/catalogo_nd.pdf" title="http://www.bauertypes.com/arxiu/Pdfs/c/catalogo_nd.pdf">http://www.bauertypes.com/arxiu/Pdfs/c/catalogo_nd.pdf</a></p>
    <p>does not even mention fonts by Erbar as trademarks</p>
    <p>The Neufville website <a href="http://www.neufville" title="www.neufville">www.neufville</a> says here:</p>
    <p><a href="http://www.neufville.com/nd/uk/colof_uk.htm" title="http://www.neufville.com/nd/uk/colof_uk.htm">http://www.neufville.com/nd/uk/colof_uk.htm</a></p>
    <p>"... Erbar Mediaeval ... are trademarks of Bauer Types SA"</p>
    <p>"Neufville Digital makes no warranties as to the completeness or accuracy of this information."</p>
    <p>The information that "Erbar Mediaeval" is a trademark of Bauer Types SA is inaccurate, because neither of the two requirements for a trademark protection are met:</p>
    <p>Firstly, "Erbar Mediaeval" is not protected by registration<br>
    Secondly, "Erbar Mediaeval" is not protected by actual use</p>
    <p>"Proprietary rights in relation to a trademark may be established <strong>through actual use</strong> in the marketplace, or <strong>through registration</strong> of the mark."</p>
    <p>Since neither Bauer nor Neufville sell a font called "Erbar Mediaeval", this font name is no trademark by actual use. To mention a name of an old font in a list does not make you the owner of a trademark. You have to sell the font to achieve protection by actual use.</p>
    <p>This means that the Typophile member is permitted to digitize the public domain font Erbar Mediaeval and to sell this font by its original font name Erbar Mediaeval.</p>
    <p>However the Typophile member cannot claim copyright to his digitization of the public domain font. But he may sell the font against the payment of a font price (but not against the payment a copyright licence fee).</p>
    <p>Remember: If you digitize an old public domain book, you do not become the copyright owner of this public domain book. The same holds true for old public domain fonts, irrespective of whether fonts are copyrightable or not.</p>
