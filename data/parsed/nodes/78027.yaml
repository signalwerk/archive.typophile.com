      <p>oldnick:</p>
      <p>&gt; Mergenthaler Linotype distributed Erbar Sans, and doubtless trademarked the name.</p>
      <p>Prove it!</p>
      <p>As regards "Erbar Mediaeval" (in Germany also spelled "Erbar Mediäval"), this font name consists of two components:</p>
      <p>1) "Erbar" is the name of a German typographer<br>
      2) "Mediaeval" is the generic German term for "old style"</p>
      <p>1) ad "Mediaeval" as a Generic term:</p>
      <p>Generic terms such as "Mediaeval" cannot be registered. Harvey Hunt even tried to register the generic term "Standard", but did not succeed.</p>
      <p><a href="http://www.sanskritweb.net/forgers/standard.pdf">www.sanskritweb.net/forgers/standard.pdf</a></p>
      <p>2) ad "Erbar" as the name of a person:</p>
      <p>The name "Erbar" without any additions cannot be registered as a font name.</p>
      <p>The German typographic company Schumacher-Gebler in Munich recently tried in vain to register the name "Erbar" for a font. The application was rejected by the German Trademark Office with the remark "Eintragung nicht möglich" (= "Registration not possible").</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/Erbar-Trademark.pdf">www.sanskritweb.net/temporary/Erbar-Trademark.pdf</a></p>
      <p>But the combination "Erbar" + "Mediaeval" = "Erbar Mediaeval" could be registered as a trademark for the font shown above</p>
      <p><a href="http://www.sanskritweb.net/temporary/Erbar-II.jpg">www.sanskritweb.net/temporary/Erbar-II.jpg</a></p>
      <p>As far as I know, nobody ever tried to register this font name, and as far as I know, nobody offers the font "Erbar Mediaeval" for sale. Hence, whosoever comes first and publishes a digitization of the "Erbar Mediaeval" font, may call it "Erbar Mediaeval".</p>
