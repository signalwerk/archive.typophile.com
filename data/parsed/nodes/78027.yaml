      <p>oldnick:</p>
      <p>&gt; <cite>they do not EXTRACT the points and copy them </cite></p>
      <p>In the example of glyph "C" shown above two extractions happened:</p>
      <p>1) Acrobat Distiller extracted the glyph "C" from the font file.</p>
      <p>2) Acrobat Reader extracted the glyph "C" from the PDF file.</p>
      <p>According to Judge Whyte, these are two copyright infringements.</p>
      <p>If Acrobat Distiller extracts a glyph from a font file and inserts it into the PDF file, this two-step process is done by copying the glyph from the font file into the "computer's random access memory" (Whyte) and then by copying the glyph from the "computer's random access memory" into the PDF file. Whyte said: "King also infringed when he loaded into his computer's random access memory copies of the Adobe program" and declared this copying process a copyright infringement.</p>
      <p>If you view the Whyte PDF file</p>
      <p><a href="http://www.greenisthenewred.com/blog/wp-content/Images/100712_aeta4_dismissed.pdf" title="www.greenisthenewred.com/blog/wp-content/Images/100712_aeta4_dismissed.pdf">www.greenisthenewred.com/blog/wp-content/Images/100712_aeta4_dismissed.pdf</a></p>
      <p>with Acrobat Reader, the opposite takes place. Acrobat Reader copies the glyph of "C" into the "computer's random access memory" (Whyte), and then this glyph of "C" is rendered (I skip the intermediate steps). Whyte declared this copying process a copyright infringement too, because for Whyte any loading of copies of glyphs into the computer's random access memory is a copyright infringement for Judge Whyte.</p>
