      <p>BTW - I should make it clear that I'm not referring to behavior that's stupid by anyone's lights. If you look and see that someone has a trademarked name for a font you're either asking for trouble or out to prove a point if you name your font the same.</p>
      <p>But in that case there is a Trademark registry to check. It's rather clear cut. Very little else is, in comparison.</p>
      <p>Here's what one author has to say about this. (All of these instances are endnoted with citations from the actual cases in the original):</p>
      <p> "I would not have imagined that a temporary image of a Web page captured in the cache of my browser counted as a “copy” for the purposes of copyright law. I would have thought that it was fair use for a company to photocopy articles in journals it subscribed to, and paid for, in order to circulate them to its researchers. If a conservative Web site reposted news articles from liberal newspapers with critical commentary, that, too, would have seemed like fair use. I would have thought that it was beneﬁcial competition, and not a trespass, for an electronic “aggregator” to gather together auction prices or airline fares, so as to give consumers more choice. I would not have thought that a search engine that catalogued and displayed in framed format the digital graphics found on the Internet would be sued for infringing the copyrights of the owners of those images. I would not have thought that I might be sued for violating intellectual property law if I tried to compete with a printer company by making toner cartridges that were compatible with its printers.</p>
      <p> "The examples go on. I know that the “research exemption” in U.S. patent law is very tightly limited, but I would have laughed if you had told me that even a research university was forbidden from doing research unless that research had no conceivable practical or academic worth - in other words that even in academia, in a project with no commercial goal, the research exemption only covered research that was completely pointless. Why have an exemption at all, in that case? I would have told an academic cryptography researcher that he need not fear legal threats from copyright owners simply for researching and publishing work on the vulnerabilities of copy protection schemes. I would not have thought that one could patent the idea of having an electronic Dutch auction on the Internet, working out the daily prices of a bundle of mutual funds through simple arithmetic, or buying something online with one click. I would have assumed that celebrities’ rights to control their images should end with their deaths, and that courts would agree that those rights were tightly limited by the First Amendment. Yet, in each of these cases, I would have been wrong, or at least I might be wrong — enough that a sane person would worry. Not all of the expansive claims eventually triumphed, of course, but some did. Guessing which would and which would not was hard even for me, though, as I said, <strong>I teach intellectual property law</strong>. You, probably, do not. </p>
      <p>From <strong>The Public Domain</strong>: <em>Enclosing The Commons Of The Mind</em> by James Boyle<br>
      Boyle is a Professor of Law at Duke Law School</p>
      <p>So, which lawyer are you going to consult? The guy who did the closing on your house?<br>
      You might as well, for all the difference it will make.</p>
      <p>Don't get me started... I'm really tired of dealing with geniuses who think their creations - or a single thought in their heads for that matter, and that includes me - owes nothing to what came before. Appropriation, my ass.</p>
