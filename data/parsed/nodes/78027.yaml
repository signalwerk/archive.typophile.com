      <p>Uli has a point here. There are several valid defenses to copyright infringement and equitable estoppel is one of them. Antitrust would be another. (And I would imagine *that* was considered a door best left unopened.)</p>
      <p>And interestingly, there is also, in the US, something called Copyright Estoppel in which the copyright owner falsely represents portions of his or her work and then later asserts copyright in that material in order to sue a copyist. According to my reference material, this defense almost always succeeds where the copyright owner has made an express false representation.</p>
      <p>That goes a long way in explaining why the first line in the <a href="http://www.adobe.com/aboutadobe/antipiracy/ff_faq.html" rel="nofollow">Adobe Font Licensing FAQ</a> is worded the way it is.</p>
      <p>"Generally, font software is copyrightable."</p>
      <p>Well, which font software do they mean? The fonts themselves as "font software"? Or Adobe Type Manager? Or what?<br>
      And then there's the weasel word, "<em>Generally</em>", implying that some font software might not be copyrightable. Well, which font software is that?</p>
      <p>(I'm sorry, but stuff like this amuses me.)</p>
      <p>Ya gotta love lawyers. The hardest thing to swallow about the legal system is that, as a system, it's arranged so that lawyers can earn a living. For some, a very handsome living indeed. Once you understand that, it all makes sense.</p>
      <p>As Roy Cohn once said, "I don't care if the other side knows the law, as long as I know the judge."</p>
