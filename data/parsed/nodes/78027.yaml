      <p>@Thomas Phinney</p>
      <p><em>"You fail to address my point, which is that being familiar with the case law and the state of the law with respect to fonts is specific expertise.</em><br>
      Oh yeah, of course I agree with that. (I didn't get that this was the kind of expertise you meant. Thought we were still on "design".)<br>
      This is the ordinary <em>legal</em> expertise one seeks from <strong>any</strong> lawyer.<br>
      Task-specific, let's call it. You don't go to a cardiologist to treat a skin infection.<br>
      (For example, the pre-eminent law firm in Franchise law is Zarco, Einhorn, &amp; Brito in Miami, Florida. If you think copyright law is arcane, try franchise law. Finding a lawyer familiar with it is near impossible. There are a handful at best and except for Robert Zarco, et al, the other firms represent franchisors, not franchisees so the chances are good the others won't take the case due to conflict of interest.)<br>
      Apropos of this, there was an episode of the Sopranos where - after Carmella tells Tony she wants a divorce - Tony calls up every top divorce attorney in the vicinity to meet for a consultation, thereby making them ineligible, ethically, to represent Carmella.</p>
      <p>Try hiring a law firm specializing in IP law in or near Seattle, Washington to work on anything that even mentions Microsoft technology.<br>
      I had a reason to do this some years ago - the idea being that firms heavily involved with software would possess the needed expertise. I stopped after calling about a half-dozen firms in the Seattle area. They wouldn't/couldn't touch anything to do with Microsoft technology, even if it was only prior art. (And that's all it was.)</p>
      <p>I'm bringing this up simply to bolster the notion that "consult an attorney" is almost always a very unpractical and usually prohibitive proposition almost all the time that someone is advised to "consult an attorney".</p>
      <p>But there is precious little law that's font-specific. And, as I said, it's peripheral to the main issues. The technological issues are not difficult to grasp. IMHO.<br>
      There IS, however much that has happened in case law over the last twelve years regarding software in general which would be equally binding "precedent".<br>
      There is nothing in the SSI decision that left anything "well settled".</p>
