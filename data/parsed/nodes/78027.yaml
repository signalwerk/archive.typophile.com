      <p>"But since this strange American Judge Ronald M. Whyte ruled that it is forbidden by fair use to copy unlicensed fonts into computer memory"</p>
      <p>He said no such thing.</p>
      <p>The law:</p>
      <p>"Notwithstanding the provisions of sections 17 U.S.C. § 106 and 17 U.S.C. § 106A, the fair use of a copyrighted work, including such use by reproduction in copies or phonorecords or by any other means specified by that section, for purposes such as criticism, comment, news reporting, teaching (including multiple copies for classroom use), scholarship, or research, is not an infringement of copyright."</p>
      <p>It actually seems improbable that copying a font into memory *in general* could be construed as fair use. Presumably it would depend on the purpose of said copying. That was probably a goofy thought on my part. But in any case, the judge did not say that copying an unlicensed front into computer memory is "forbidden by fair use." That's part of your ongoing campaign to put words in his mouth.</p>
