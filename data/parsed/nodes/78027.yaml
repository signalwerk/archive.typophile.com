      <p>I have no desire to read Knuth's <em>The Art of Computer Programming</em>, which I suspect contains precious little art.<br>
      My literary allusion ("…but some data are more equal than others") was to <em>Animal Farm</em>, the inference being that this is a political issue as much as a legal one.  </p>
      <p>It is the role of technological progress to reduce cultural artefacts to "content", minimizing their worth, and this is the foundation of the value of new media devices (both hard and soft). But typefaces are not just an old analog form automatically reduced to data (with programs being a more privileged species of code, to the vested interest of technologists). They are written directly into digital media, and even revivals of metal typefaces are necessarily unique interpretations—as would be the case with the 24 pt Erbar font that is the subject of this thread; the specimen has sufficient traces of process that will require "cleaning up", or not, as the case may be, that any digitization would have some measure of originality.</p>
