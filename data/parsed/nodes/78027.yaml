      <p>Uli - it no longer matters what Judge Whyte thought in 1998. But he was not alone in considering a RAM copy, a copy under the law. </p>
      <p>It is now not infringement to view the PDF under the Title 17 statute in the US Copyright law. Loading a "program" into RAM as a normal part of utilization is not infringement.<br>
      According the following quotation from Cornell University, this was added to the law in 2000.<br>
      <a href="http://www.law.cornell.edu/uscode/uscode17/usc_sec_17_00000117----000-.html" rel="nofollow">Limitations On Exclusive Rights: Computer Programs</a></p>
