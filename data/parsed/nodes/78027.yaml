      <p><cite>Now show me the scientist or lawyer who claims to be an expert on type science or type law who actually has some professional experience or academic qualification in graphic design or typography.</cite></p>
      <p>For lawyers, that would be Frank Martinez, in NYC—which is probably why he's the single most popular lawyer for indie type foundries. I'd go straight to him in an instant if I was operating independently and had font legal issues I needed dealt with.</p>
      <p><cite> Type, as such, DOES NOT ENTER INTO IT except for how the code, as original expression (or not), shapes the resulting type....</cite></p>
      <p>Your initial point is right I think, as is the point that the design of the type is irrelevant (unless a design patent is involved, or you're outside the USA). But I don't agree with your conclusion that specific expertise is irrelevant. That specific expertise is about legal issues around fonts, not necessarily about type design per se.</p>
      <p>I strongly believe it helps to have a lawyer who knows and understands the exact same stuff you're talking about, BEFORE you go and talk to them about it. Somebody who has already read the various legal info specifically relevant in this area, including understanding the published position of the US Copyright Office on the subject, as well as the Adobe v SSI case, and potentially others, depending on the nature of the claim. Do you want to pay for hours of their paralegal's time to find stuff, and then for the lawyer's time to read it? I know I don't.</p>
      <p>Note in particular that there are issues specific to type in IP law, where it's not like other software. Take for example when Agfa Monotype sued Adobe over font embedding rights in sub-licensed fonts. That was very interesting, particularly when it got down to whether the font embedding bits constitute protection in a DMCA sense (they were found not to do so). Similarly it helps to know that US design patent can apply to fonts (again Adobe v SSI is informative), which is a way in which they are a bit different than most software.</p>
      <p>Cheers,</p>
      <p>T</p>
