      <p><cite>Trademark law does not apply to non-trade things.</cite></p>
      <p>This is wrong. Everything eligible to be protected under any category of intellectual property (what includes trademark for font names) would keep its privileges no matters if it is commercially used or not. To freely distribute a font is not a right withdrawal. Of course, commercial use is the main privilege granted to its owner, but it's not the only one.</p>
      <p>Usually there is confusion between trademarks, patents, industrial designs and copyrights. When discussing these matters in relation to fonts, it may refer to trademarks (font name), copyrights (shapes) or copyright-related issues (codes, mappings, kerning, hinting, etc.).</p>
      <p>I suggest some survey in <a class="freelinking external" href="http://www.wipo.int/portal/index.html.en" rel="nofollow">WIPO</a>, where one finds much information about this and also some ways to solve international infringements.</p>
      <p><cite>In U.S. civil courts, a case does not have to have merit in order to be filed.</cite></p>
      <p>Unhappily, it's also this way in many other places. And even in countries where legal procedures permit the judge to refuse a case due to complete lack of minimum sense, this is not always done due to excessive number of cases.</p>
      <p>There are notorious cases where people sued God, Devil, Abraham, Adam, etc. and the procedure advanced for weeks or months before a judge finally aborted it.</p>
      <p>Last year a person filed dozens of identical cases in Rio because he did bet and lost in Brazilian Federal lottery. The Federal Bank who manages the lottery was even notified to answer some of the cases before Judiciary finally perceived what was happening...</p>
