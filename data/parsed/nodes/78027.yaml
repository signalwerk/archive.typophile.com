      <p>Nick Shinn:</p>
      <p>&gt; "All software is data, including code."</p>
      <p>Professor Luc Devroye says:</p>
      <p>- "Programs are data", but<br>
      - "Data are not programs".</p>
      <p>I agree to the latter.</p>
      <p>I cannot agree to the former from the point of view of European copyright laws.</p>
      <p>For example, in Europe, programs are protected for a period of 70 years post mortem auctoris, whereas databases are protected for a period of 15 years only:</p>
      <p><cite>"In the case of a database ... the term of protection by that right shall expire fifteen years from the first of January of the year following the date when the database was first made available to the public."</cite></p>
      <p><a href="http://eur-lex.europa.eu/LexUriServ/LexUriServ.do?uri=CELEX:31996L0009:EN:HTML" title="http://eur-lex.europa.eu/LexUriServ/LexUriServ.do?uri=CELEX:31996L0009:EN:HTML">http://eur-lex.europa.eu/LexUriServ/LexUriServ.do?uri=CELEX:31996L0009:E...</a></p>
      <p>If fonts were databases, the period of protection would be even shorter than the period of protection for the design of typefaces, which is 25 years:</p>
      <p><a href="http://www.sanskritweb.net/forgers/publicdomain.pdf" title="www.sanskritweb.net/forgers/publicdomain.pdf">www.sanskritweb.net/forgers/publicdomain.pdf</a></p>
