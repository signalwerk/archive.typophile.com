      <p>Luc DeVroye promotes piracy and frequently misrepresents people and situations. I stopped paying attention to anything he wrote a long time ago. Moreover, Uli is now trying to change the discussion to what the status quo SHOULD be, but that's not the question at hand. If somebody thinks the copyright office is wrongheaded, that's fine, but that has no bearing on the question in the title of this thread.</p>
      <p>Richard, perhaps you should note the sentence right before the one you emboldened. Read the FIRST sentence this time: "No one disputes that most photographs are copyrightable. In consequence, the issuance of a certificate of registration for a photograph proves nothing."</p>
      <p>In other words, a certificate of registration for a *particular* font doesn't tell you anything about the legitimacy of that particular font registration. I could rip off the code of a digital font and rename it and register the copyright, and if it ever got contested, I'd lose. But the fact that the copyright office routinely issues copyrights for fonts as software IS telling, and your quote doesn't say otherwise.</p>
      <p>I'm not claiming that typefaces are protected by copyright in the USA. But it seems reasonably clear that digital fonts are, as software. And by the way Blake Fry thinks they likely are as well (whether or not he thinks it reasonable that they be protected in that way). He has a whole section of that treatise entitled "Computer Fonts are (Probably) Protected as Software."</p>
      <p>Cheers,</p>
      <p>T</p>
