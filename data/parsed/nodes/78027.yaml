      <p>Libel has to be untrue. Luc DeVroye has provided links to pirated font downloads.</p>
      <p>Uli is again clouding the issue, in two ways:</p>
      <p>1) I was not representing my personal opinion, but commenting on what is generally accepted as being the state of US copyright law. I'm saying “this is how the law is treating it.” Trying to express that as my personal opinion and contrasting it with Luc's personal opinions as to what the law <strong>ought</strong> to be is irrelevant to the current discussion. I have not been engaging in a discussion of whether copyright “ought” to cover digital fonts and how it ought to do so. <em>Just because I make a statement that a situation is XYZ does not mean that I agree with that situation, nor even if I agree with the effect of that situation that I agree with how that outcome was reached.</em></p>
      <p>2) I do not claim that data points of glyphs are computer programs, nor has anybody else I cited. I claim that the US copyright office treats a digital outline font, in toto, as a computer program (while being unfortunately vague about which elements are protected). I also claim that a federal court in Adobe v SSI ruled (in a summary judgment, as a matter of law) that the placement of points in those programs in particular is an element of creative expression protected by copyright. I made no comments about my own opinions on what ought to be, and my opinions are irrelevant to the question of "are you allowed to...?"</p>
      <p>My own opinions on "what should be" are that *typefaces* should be protected under copyright as creative works, but that US copyright terms are insanely long and should be shortened dramatically.</p>
      <p><strong>I do actually partly agree with one thing Uli is saying</strong>, although he's been rather oblique about it. Given that digital fonts are protected by copyright, if loading them into computer memory can constitute infringement, then there would seem to be a potential issue with many normal and accepted uses of fonts that font vendors are actually okay with, even involving third parties who have not been involved in the font licensing process. Opening a PDF loads its fonts into memory, and the person opening the PDF might not have any involvement in licensing that font.</p>
      <p>Of course, there would seem to also be some very simple solutions to this. One would be to consider such actions to be fair use by the viewer when they were occurring simply for the purposes of viewing documents with embedded or linked fonts, and the viewer was not duplicating the font (which would not mean that setting up that situation by embedding or linking the font is automatically fair use). Another would be for the font vendors to clarify in their copyright statements what uses they permit for unlicensed people. This would be similar to copyright statements that grant certain exemptions beyond fair use. Uli seems to think this is a big deal. I think it's a minor issue, and if it ever came up in court in a more worrisome context, font licensors and copyright holders would deal with it more actively. They'd all go talk to their lawyers about the “right” way to do it, and one or more legally viable approaches would emerge. They might or might not be like the ones I outline here... again, I'm not a lawyer, nor are any of the other folks in this discussion.</p>
      <p>Actually, the whole discussion has veered off of "are you allowed to...?" The OP was asking about the legality of selling a new digitization, and had no intention of using existing digital fonts as a basis for said digitization. The comment was made that a new digitization was fine as long as one didn't directly input existing digital fonts as the basis for the new version and we wandered off....</p>
      <p>Anyway, back to my day job. Time to go look at some font metadata.</p>
      <p>Cheers,</p>
      <p>T</p>
