      <p>Two things:</p>
      <p>1) Richard, you are utterly incorrect in your interpretation of the Copyright Office decision. I think this part of the decision is fairly telling: "The creation of  scalable font output programs to produce harmonious fonts consisting of hundreds of characters typically involves many decisions in drafting the instructions that drive the printer. The expression of these decisions is neither limited by the unprotectable shape of the characters nor functionally mandated. This expression, provided it meets the usual standards of authorship, is thus registrable as a computer program."</p>
      <p>If you think this refers to rasterizer software rather than the font program itself, you're nearly alone in that belief. Most notably, the copyright office itself clearly disagrees with you, which is why they started accepting registrations of copyright on fonts-as-programs immediately after this. there have been thousands of such registrations.</p>
      <p>In light of the above quote (which is admittedly more vague than one might like), I would argue Judge Whyte was simply clarifying the law by saying that the placement of points on bezier vector outlines was not functionally mandated and hence protected by copyright, and by declaring so as part of a summary judgment he said it was the case as a simple matter of law.</p>
      <p>2) In considering other court decisions, you'll have to explain how and why you see them as contradictory to Adobe v SSI. For example, a phone directory and a font outline (possibly with hinting code) seem to me to be clearly not the same thing.</p>
      <p>Cheers,</p>
      <p>T</p>
