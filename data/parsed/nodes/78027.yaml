      <p>Uli, if I remember correctly, all computer programs are, in machine language, sets of numbers. Are the numbers that indicate glyphs, spacing and kerning part of an instruction? Well, in conjunction with a rasterizer program, the numbers in the font direct the computer or printer on what to put on the screen or put on the page. The rasterizer by itself can't do anything. It needs the input to be operational. Hence one could argue that the "rasterizer + font information" is intended to be a "program" for producing letters. Or you could argue that since the lines that are obviously instructions, except for open type programming, are not in the font, the font is not a program.   </p>
      <p>So are the points part of a program or not? It seems to me you could argue either way, and the situation is rather ambiguous. The judge in Adobe vs SSI ruled "program." You want to make it obvious that it is one way or the other, when it is not. It is a borderline issue. And in such cases, judicial decisions create the law.    </p>
      <p>I'm not saying that this is the best way to deal with IP protection for fonts, but it is what we've got now in the US. </p>
      <p>You keep raging about the situation being black-and-white, and everyone else being fools, but that's you oversimplifying the situation, and not situation itself, which is messy and ambiguous.</p>
