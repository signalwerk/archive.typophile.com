      <p>James... HP has the best BW printers in my mind. I started off with them, switched to a NewGen/Design XP 1200 dpi printer for 4K and promptly went back to the HP when I could no longer afford the refills. Bad investment as the cartridges were 250$. I like the black crispness of the HP’s and they take a licking and keep on ticking!</p>
