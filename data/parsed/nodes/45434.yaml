  html: <p>My color laser printer is almost out of all four colors of toner—I’m looking at a minimum of $220 to replace them. I no longer use it for color work, it’s loud as hell, and has no postscript support. Can I get a decent postscript BW laser for less than what it’s going to cost me to refill this thing?</p>
