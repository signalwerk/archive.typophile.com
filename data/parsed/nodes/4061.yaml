    html: <p>have i been pigeonholed as hater? sheesh. hrant- thanks for noticing my humble concessions on *some* points in the comic sans discussion. but i still hate it. <br> <br>as for this, it is better than comic sans. i'm with joe pemberton on the v, w, and x. too swashy. the tails on i and l are too pronounced as well. the s seems smaller than the other characters. <br> <br>is this intended as a simulation of handwriting? i think this is what might result if comic sans and meta had kids. or maybe more accurately, if someone tried to draw meta by hand. <br> <br>my wife just walked in and said, "that looks kind of like... <b>comic sans!</b>"</p>
