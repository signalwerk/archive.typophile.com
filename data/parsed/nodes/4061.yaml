    html: <p> well, don't think about comic sans again. this is much more natural looking. <br> <br>that is a long f. i'd like to know some of your thoughts about designing it with a super long descender. <br> <br>it seems a little clustered in the small body copy. <br> <br>gushy? oh, man. i guess i just wanted to point out the difference between a font actually designed for children and a font used (ostensibly) for children with no reasoning other than it looks childish. <br> <br>andrij- what were your original intentions for creating this font? i'm interested in the history of it. </p>
