    html: <p>This has potential. However, what this gains in  <br>friendliness it lacks in--for lack of a better word-- <br>naturalness. Some of that 'looseness' just looks like  <br>ordinary sloppiness. I'm mainly talking about the forced  <br>w and v, the squashed x, the chunky s. <br> <br>Don't let me discourage you. When you finness this to  <br>look more natural (less forced) is when you'll have a  <br>winner. <br> <br>Strudel is a great name, by the way.</p>
