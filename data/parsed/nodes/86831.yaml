    html: <p>This comment comes for an instruction writer for a needlecraft kit manufacturer, not a designer. However, I know fiber and needles. What you are depicting is not rope, it's a braid. Rope is a single twist; it is not interwoven. Look at a piece of rope, twine, or thread for that matter and you will know what I mean. It would also help if you had the "rope" go more convincingly through the eye of the needle, along with the needle actually piercing the rope. Enlarge the eye if need be. I think this is why some are reading it as a pin instead of a needle. Hope this along with the other comments helps.</p>
    html_clean: <p>This comment comes for an instruction writer for a needlecraft kit manufacturer, not a designer. However, I know fiber and needles. What you are depicting is not rope, it's a braid. Rope is a single twist; it is not interwoven. Look at a piece of rope, twine, or thread for that matter and you will know what I mean. It would also help if you had the "rope" go more convincingly through the eye of the needle, along with the needle actually piercing the rope. Enlarge the eye if need be. I think this is why some are reading it as a pin instead of a needle. Hope this along with the other comments helps.</p>
