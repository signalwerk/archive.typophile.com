      <p>&gt; I know the person I am designing this for is<br>
      &gt; going to choose the 3rd because he likes those details</p>
      <p>Personally I wouldn't even show the client the third one.</p>
      <p>If your client wants tiny details that you know won't reproduce well, you need to educate them about the requirements for a proper logo. Show them how the tiny details become a blur when reduced down to postage stamp size to fit on a business card or in a small ad. And show them examples of good logos which reproduce cleanly in small sizes.</p>
      <p>If you do a Google images search for Rope Logo or Thread Logo (or similar phrases) you'll find examples of logos which represent those materials and yet are simple enough to reproduce cleanly in a small size.</p>
