    html: <p>I like this idea, it seems to work.  I am not sure the distinction you are making between illustrative and simple shapes, in many ways I see this as both.  I would try to illustrate the ends of the rope rather than cut them.  Maybe try a cut perpendicular to the rope, or some sort of ends of the fibers.  I didn't get the bomb idea at all, but there seems to be potential to amp up that aspect.  Good start!  I do like the organic feel of rope weave together with a sort of geometric overall shape.  The needle feels a little like an afterthought.  Looking forward to seeing this develop.</p>
