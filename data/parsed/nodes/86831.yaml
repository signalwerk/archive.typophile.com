      <p>What is the market positioning for the new logo, is there a specific demographic that will be targeted by the brand. To me the name seems to have 2 distinct connotations, the first is that this work is hand crafted, the second - now this may be a local perception - I am a New Zealander - to us, crafty means clever, cunning, normally with a negative spin. In the latter context, it would work well for a street label, in that case it would need attitude. Rereading the first entry I see that you mention a bomb symbol or graphic and T shirts so i assume it is a street brand. If this is the case maybe you need to get a bit more funky, especially if it is a label that you want to built a culture behind. The use of the letters C R F T Y reminds me of the very successful UK brand FCUK.</p>
      <p>Don't get caught up in the details before you have worked out the strategy and market positioning of the finished brand. I agree with the other responses that mention issues that can arise from being able to embroider the labels.</p>
      <p>I think the needle graphic has some great potential</p>
