    <p>The name is CRFTY. which is read "crafty".<br>
    the client wants a letter C that looks like rope. The reason is because it is fiber and so is textiles. Also, a bomb image is a common design element in the t-shirts, and the rope is supposed to reference the fuse of the bomb.</p>
    <p>Here are many versions I've played around with.<br>
    Any ideas or suggestions would be greatly appreciated, for I have spent so many hours on this already. Thank you.</p>
    <p>I forgot to mention, the client also wants a sewing needle going through the C. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typofiles_4298.jpg"></div><p></p>
