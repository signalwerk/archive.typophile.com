      <p>Typography is an art, and as such it can't be reduced to a formula. A good design education, which takes years, will teach you some common-sense guidelines about what works for children, for advertising, for books and magazines, and so forth. But clients hire a designer because he or she has the skill to use type in unexpected and pleasing ways.</p>
      <p>Any fool can pick type off a list, and most of the "inappropriate" uses of type you refer to are the work of clients who didn't want to spend money hiring a professional designer.</p>
