    <p>How can we identify each font purposes to?<br>
    Just like Comic Sans for children's things, Times for formal texts, Grunge font for urban art and so on. Are there basic parameter that we can use? The parameter must be accepted by people globally (like measurement system of International that accepted globally).</p>
    <p>If the basic parameter is found, there is no inappropriate using of font anymore. During this time, People commonly using feeling instead of thinking while using font. That's it. We need parameter. Here need a professor thinking i think :)</p>
    <p>Gunarta</p>
