      <p>Since this is before the time of digital fonts, this may not be available now, if it was a typeface, and not hand-drawn. You might get close to this look by adding stroke to <a href="http://new.myfonts.com/fonts/adobe/spartan-classified/" rel="nofollow">Spartan Classified Heavy</a>. That would have the effect of closing down the counters, although I don't think the differences between them would be as pronounced as your sample.</p>
      <p>- Mike Yanega</p>
