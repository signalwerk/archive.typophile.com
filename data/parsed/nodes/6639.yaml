    html: <p>'FUEL' is set in <a href="http://www.myfonts.com/fonts/linotype/futura/extra-bold/testdrive.html?s=FUEL&amp;p=72">Futura Extra Bold</a>, not Kabel. <br> <br>'Buster' and 'Made in Germany' are indeed set in Kabel, but not the ITC version as linked above. They use <a href="http://www.myfonts.com/fonts/linotype/kabel/black/testdrive.html?s=Buster+Made+in+Germany&amp;p=48">the Linotype version</a> which has a square dot for the lowercase 'i' in the Black weight, rather than the diamond shaped one in ITC's ultra weight.</p>
    html_clean: <p>'FUEL' is set in <a href="http://www.myfonts.com/fonts/linotype/futura/extra-bold/testdrive.html?s=FUEL&amp;p=72" class="link-external">Futura Extra Bold</a>, not Kabel. <br> <br>'Buster' and 'Made in Germany' are indeed set in Kabel, but not the ITC version as linked above. They use <a href="http://www.myfonts.com/fonts/linotype/kabel/black/testdrive.html?s=Buster+Made+in+Germany&amp;p=48" class="link-external">the Linotype version</a> which has a square dot for the lowercase 'i' in the Black weight, rather than the diamond shaped one in ITC's ultra weight.</p>
