    html: "<p>So, broadly speaking, the scoop is this: <br> <br>OS X 10.4 (\"Tiger\") dynamically maps OpenType features to AAT features. So in theory, existing applications that support AAT will also see OpenType fonts working much the same way. You should be able to get OpenType small caps, ligatures, oldstyle figures, etcetera in Keynote and TextEdit. Apple has not yet implemented OpenType support for features needed to handle \"complex script\" languages such as Arabic and Indic, however. <br> <br>I can't say we've tested Tiger's OpenType support here at Adobe - unfortunately, we've just been too swamped with other big projects that had similar schedules to Tiger (CS2, Garamond Premier, etc.). However, we are pleased to see Apple offering such support at the system level, broadening the base of OpenType support. Having Apple as an increasingly involved partner in the OpenType effort can only be good for third party developers and end users. <br> <br>Regards, <br> <br>T <br> <br>Thomas Phinney <br>Program Manager <br>Fonts &amp; Core Technologies <br>Adobe Systems</p>"
    html_clean: "<p>So, broadly speaking, the scoop is this: <br> <br>OS X 10.4 (\"Tiger\") dynamically maps OpenType features to AAT features. So in theory, existing applications that support AAT will also see OpenType fonts working much the same way. You should be able to get OpenType small caps, ligatures, oldstyle figures, etcetera in Keynote and TextEdit. Apple has not yet implemented OpenType support for features needed to handle \"complex script\" languages such as Arabic and Indic, however. <br> <br>I can't say we've tested Tiger's OpenType support here at Adobe - unfortunately, we've just been too swamped with other big projects that had similar schedules to Tiger (CS2, Garamond Premier, etc.). However, we are pleased to see Apple offering such support at the system level, broadening the base of OpenType support. Having Apple as an increasingly involved partner in the OpenType effort can only be good for third party developers and end users. <br> <br>Regards, <br> <br>T <br> <br>Thomas Phinney <br>Program Manager <br>Fonts &amp; Core Technologies <br>Adobe Systems</p>"
