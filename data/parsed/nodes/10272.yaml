    html: |-
      <p>I installed Tiger yesterday, but I’ve noticed a couple things already. File server access is much faster in my office to my machine (Dual 1GHz G4 with 1gb RAM), than prior running under 10.3.x</p>
      <p>The Widget thing is neat, but I think I’d prefer a different implementation. Also, there is not help documentation telling you how to add new widgets that you download. I can open them, and use them, but when they are closed they do not go back into the Widget bar. A simple “do you want to install this widget” dialog box that then moves the open widget to the correct library folder would have been great.</p>
      <p>Other than that, Spotlight preforms nicely, and Mail 2 looks pretty good. More Apple user interface guidelines are broken (ie, Safari gets brushed metal, but Firefox does not, iCal is brushed metal, but other Apple programs are not), but that’s really just a small aesthetic complaint (but that is what design is all about right?).</p>
      <p>Sean Glenn<br>
      Art Director<br>
      <a href="http://www.superunicorn.com">www.superunicorn.com</a></p>
    html_clean: |-
