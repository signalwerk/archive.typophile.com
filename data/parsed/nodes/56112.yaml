    html: <p>I would recommend following the spec as best you can and hope that application support will improve. If you go your own way, you run the risk of confusing users, particularly when they switch between your font and one that follows the spec. There are definitely areas of ambiguity and disagreements among font developers with regard to such things. In the end, the needs, convenience and expectations of the font user should have the highest priority.</p>
