    html: |-
      <p><code>aalt</code> just specifies any and all alternates, including anything covered by other features. There is no specific user interface item to apply <code>aalt</code>, but it does affect what you see in the Glyph palette, specifically those little arrows that indicate alternate forms for a glyph and what appears under the little pop-up on the arrows. </p>
      <p><code>salt</code> at first seems similar to a stylistic set, except that it is intended to be applied to individual characters and can include more than one glyph alternate. However, the user interface for this feature is inconsistent: In Illustrator there is a single on/off button, with the result that you can only access the first available alternate (you can get at the rest via the glyph palette). InDesign doesn't have any obvious support for <code>salt</code>, at least in its OT submenu, but you see them listed under Stylistic Alternates in the glyph palette.</p>
    html_clean: |-
