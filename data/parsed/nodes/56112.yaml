      <p><em>Incidentally, this isn’t necessarily anything to do with stylistic sets. </em></p>
      <p>Right. So the question is, if there are three sets of alternate glyphs, what is the best way to configure them in fonts, to facilitate a typographer who may wish to mix and match?</p>
      <p>I've done some setting along those lines, with the three Eunoias, which are conceptually similar to the way the Mostras are set up.<br>
      I found the best way to work is to set the word three times in the three different fonts, then cut and paste into a fourth mixed version. And then manually kern.</p>
      <p>I certainly think that cutting and pasting is better than selecting a character and applying a stylistic set or font, because with "select and apply", you're not so sure what the character is going to look like--whereas with cut and paste, you can see exactly what you're substituting, at the same size. It's better than working from a glyph palette, with small images.</p>
