      <p><em>What is the best way to implement multiple ’sets’</em></p>
      <p>Separate fonts.<br>
      Seriously. Better usability--users don't have to dig down through so many GUI levels to access the style, and you can spell out what the feature is in the font name.<br>
      That way you also get to find out what people really want.<br>
      And you can realistically lower the per-font cost in a family package.</p>
