    <p>After reading this post explaining the concept of using a separate stylistic set for each stylistic alternate:</p>
    <p><a href="http://typophile.com/crss/node/55586">http://typophile.com/crss/node/55586</a></p>
    <p>I recalled I had learned that because of Illustrator's OpenType panel's limitations (i.e. it's not easy to access 'sets') you could, if you were so inclined, group SS01 with aalt and salt, and group SS02 with calt… although this was highly debated…</p>
    <p>The reason I wanted to bring this up is that I'm about to complete a font that will have up to five or more 'sets', (where previously I've only used up to two SS01 &amp; SS02) and obviously there's not enough other feature definitions (or buttons on the Illustrator Glyph panel) to make it easy to activate these sets…</p>
    <p>How would you recommend moving forward, I like the idea of breaking the rules for usability, but I also like being consistent with how I do things…</p>
    <p>What is the best way to implement multiple 'sets', yet still utilize aalt, salt, and possibly calt, and additionally titl, and why doesn't Adobe sync the OpenType panels interface between all of their apps? (Let alone all software brands)</p>
    <p>Mike</p>
