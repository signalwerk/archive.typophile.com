    html: |-
      <p>For example, I currently ship Mostra (not available yet in OT format) as three separate fonts--Mostra One, Mostra Two, Mostra Three. Conceptually, it's one typeface, but in order to accommodate the stylistic variants in the basic Type 1 and TrueType formats (without hijacking character slots meant for math characters or symbols, for example), I had to split them into three fonts. However, the way I split them up may not be the way a user would split them up. Ideally, you should be able to combine the different variations in any way you like. If you want to use Mostra Three, but would rather have the "S" from Mostra Two, you can simply select the "S" and choose Mostra Two, but you may need to do some manual kerning, depending on what characters are on either side of it (from Mostra Three).</p>
      <p>When I do the OT version of Mostra (which is long overdue), there will just be one font, with Mostra Two and Three represented by stylistic sets, but also in the stylistic alternates feature. The "S" from Mostra Two will be kerned against glyphs from Mostra One and Mostra Three that are not present in Mostra Two.</p>
      <p>Incidentally, this isn't necessarily anything to do with stylistic sets. It's a problem with any sort of alternate glyphs if they are split out into separate fonts.</p>
