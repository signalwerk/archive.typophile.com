      <p>I'm not so bothered by the circle and the square thing, but if this was all in a cicular format it would probably be stronger.</p>
      <p>I agree on the F, I saw two F's in one, but I really like how the "bigger F" interacts with the circle.  </p>
      <p>I think this would look nice as an italic script, with some relationship between the stroke of the script and the circle.</p>
      <p>This to me as a nice historical nod to it, like something CSA would make.</p>
      <p>The challenge will be how to work in that tagline.  But focus on the logotype first.</p>
      <p>Recommend checking out some old hardware/tool/maybe even camera logos.</p>
