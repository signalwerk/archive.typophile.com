    <p>hi everybody,</p>
    <p>i'm posting this logo that's been around for a while, some of you might even know it. it needs some refining, and i was wondering what you all think where to start.</p>
    <p>any comments on the type? readability? what sort of connotations does it have for you all?</p>
    <p>where would you head: going way retro? just cleaning up things?</p>
    <p>looking forward to receiving your opinion,<br>
    cheers</p>
    <p>curtze</p>
