    <p>I am writing to ask anyone interested in engraving, and those who participate in "social media" to help spread the word about my new kickstarter project to fund the West Coast book tour for The Complete Engraver. </p>
    <p><a href="http://www.kickstarter.com/projects/1872144378/engraving-for-nerds-ii-west-coast-book-tour" title="http://www.kickstarter.com/projects/1872144378/engraving-for-nerds-ii-west-coast-book-tour">http://www.kickstarter.com/projects/1872144378/engraving-for-nerds-ii-we...</a></p>
    <p>The rewards are pretty juicy:</p>
    <p>   - Jessica Hische's new font, Minot (Jessica's a young, hot design diva)<br>
       - Be a member of the VIP team for the engraving day at the International Printing History Museum in carson, CA<br>
       - Beta test and be the first 5 to get the new engraving app being developed<br>
       - Get the first ever engraving app we are developing after in launches<br>
       - Engraved, custom monogram notes.</p>
    <p>Book tour I, in the northeast was wildly successful and i'd like to continue the momentum.</p>
