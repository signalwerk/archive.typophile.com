    <p>I am in the midst of designing 2-10’ x 7’ murals for a new loft development.<br>
    The loft development is inside a 1940s Sears retail store and I have been hired to design these 2 pieces.<br>
    I want to pay homage to the era without over doing it and am curious if anyone can point me to some 1940 - 1960 Sears logos.<br>
    I don’t plan to use the logos, but might create some graphic elements out of letterforms.</p>
    <p>Thanks.</p>
