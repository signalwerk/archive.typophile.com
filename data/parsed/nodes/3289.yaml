    html: "<p>I can't thank you folks enough for your feedback, it's been a great help. I had to present my work last night, and I've included the final results of what I wound up with presenting (#2 and #3 only. These came about after numerous discussions with my instructor). I unfortunately didn't have the time to interview the owners before turning this in, but since I have another week to turn in the final version I will definitely make time for this.  <br> <br>I was able to find one of the fonts suggested here but not the others (I'm limited to what the school computers offer). <br> <br>This is a picture of the shop itself. There is another sign in the shop that says \"David's Bagels &amp; Deli\". Our instructor told us to only work with the complete name (that being the most complete name of the place) but in the end the \"&amp; Deli\" was so problematic that she suggested dropping it. In the end this seemed OK to do, as really the focus of the place is bagels. People really come here for bagels and it's their bread and butter.  <br> <br>Some of the crits I received for this is that the bagel needs to look more \"bagely\". Folks suggested that I continue sketching bagels and trying to find unique qualities of them that I can translate into this bagel. My instructor seemed to prefer #3 over #2. <br><img src=\"http://www.typophile.com/forums/messages/29/27303.gif\" alt=\"bagel pics\"></p>"
