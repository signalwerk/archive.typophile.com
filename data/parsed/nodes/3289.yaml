  html: <p>Hi everyone, <br> <br>I'm a beginning graphic design student. My first assignment was to design/redesign a restaurant logo. I've chosen a takeout bagel joint named "David's Bagels &amp; Deli" -- it's a mom-and-pop-type shop frequented by neighborhood locals. The interior is pretty nondescript and there's currently no logo. Existing signage and awning just states the name in a generic manner, like many New York City shop awnings. The place has a cozy, neighborhood feel, generated mostly by the customers and the friendly folks who work there. It's the kind of place where they'll know your name and your regular order after a couple of visits. <br> <br>Here's the logo I came up with. I would greatly appreciate any feedback I can get to improve upon this... Thanks very much in advance for your help. <br> <br>Cheers, <br>Noah <br><img src="http://www.typophile.com/forums/messages/29/27146.gif" alt="david's bagels logo"></p>
  html_clean: <p>Hi everyone, <br> <br>I'm a beginning graphic design student. My first assignment was to design/redesign a restaurant logo. I've chosen a takeout bagel joint named "David's Bagels &amp; Deli" -- it's a mom-and-pop-type shop frequented by neighborhood locals. The interior is pretty nondescript and there's currently no logo. Existing signage and awning just states the name in a generic manner, like many New York City shop awnings. The place has a cozy, neighborhood feel, generated mostly by the customers and the friendly folks who work there. It's the kind of place where they'll know your name and your regular order after a couple of visits. <br> <br>Here's the logo I came up with. I would greatly appreciate any feedback I can get to improve upon this... Thanks very much in advance for your help. <br> <br>Cheers, <br>Noah <br><img src="http://www.typophile.com/forums/messages/29/27146.gif" alt="david's bagels logo"></p>
