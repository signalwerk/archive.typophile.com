    date: 2004-02-25T12:52:00
    date_raw: 25 Feb 2004 — 12:52pm
    votes: null
    html: "<p>I agree with what others have said (particularly talking to the owners/ workers about the place). I think the most key thing to focus on here is not tweaking what you have (in the first post), but thinking about things that feel unique and related to what you're dealing with: hand-drawn, printing irregularities, soft variations like dough or a on well-used kitchen tool. <br> <br>Your logotype is set in a fairly common typeface (from what's available at school, right?) and a pretty standard configuration. It definitely makes it look like a typical NYC awning, but it looks that way because it looks like it was set by the printing company that did the awning. Do research online and walking around NYC. Sketch lettering that's been around for a while, or looks really unique and warm. Maybe image-search on google for 'deli' or 'bagels' and see what strikes you. Just beware of the fake mom 'n' pop look, like a big chain trying to look like it's a little shop.</p>"
    html_clean: "<p>I agree with what others have said (particularly talking to the owners/ workers about the place). I think the most key thing to focus on here is not tweaking what you have (in the first post), but thinking about things that feel unique and related to what you're dealing with: hand-drawn, printing irregularities, soft variations like dough or a on well-used kitchen tool. <br> <br>Your logotype is set in a fairly common typeface (from what's available at school, right?) and a pretty standard configuration. It definitely makes it look like a typical NYC awning, but it looks that way because it looks like it was set by the printing company that did the awning. Do research online and walking around NYC. Sketch lettering that's been around for a while, or looks really unique and warm. Maybe image-search on google for 'deli' or 'bagels' and see what strikes you. Just beware of the fake mom 'n' pop look, like a big chain trying to look like it's a little shop.</p>"
