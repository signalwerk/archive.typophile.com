    html: <p>The weight of your DOM doesn't match that of your BAGELS. Perhaps something more like <a href="http://www.letterheadfonts.com/letterheadfonts/fattony.shtml" target="_blank">Fat Tony</a> or another bolder handlettered style. I'll agree with BJ about doing some sketching too. You might end up playing with other contrasts and use type more like Fink Gothic and Fink Heavy. (Off the top of my head) <br> <br>I can see what you, Hrant, mean about the Slab being rigid against the Dom, but I think that this will have a lot more to do with the treatment of the type, methods employed by signpainters like outlines or shadows. The idea of a handpainted sign is nice, and could be an interesting exploration in the idea of a hand-lettered sign.</p>
