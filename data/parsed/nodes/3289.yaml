    html: <p>Peter what street is that shop on I swear I've seen it before.  <br>Something to note about Mahattan walk-in eateries. Most of the Tex-Mex shops are run by Koreans and most of the Deli's are too. My local bagel shop is all latin americans, with english being the second language. Vision about their business isn't the driving goal, these deli's and tex-mex and bagel shops are part of an organization that pools the resources and distributes the wealth. One year a water main broke on 5th avenue and the korean deli was forced to shut down for 3 months but it never had to go out of business, because it was part of the organization.</p>
