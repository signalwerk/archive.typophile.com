      <p>History? I wish I knew. The Solotype Catalog calls this Music Hall Text and <a href="http://moorstation.org/fontennium/blackheav/fsheav1.htm" target="_blank" rel="nofollow">here</a> you'll find one digital version as Music Hall.</p>
      <p>The font is copyrighted by WSI - one of those companies that produced almost solely clones of existing fonts, renamed. However, if you look at <a href="//cgm.cs.mcgill.ca/~luc/WSI-FontList.txt" target="_blank" rel="nofollow">this list of WSI font descriptions</a> by Robert Long of WSI (1997), you'll find that almost all of the fonts state that they are "similar in appearance to ...". Music Hall, however, states that, "WSI is the first commercial collection to produce and offer such a clean digitization ...". So, just maybe this was a rare legitimate WSI digitization.</p>
      <p>The other digitization I'm aware of is Scriptorium's <a href="http://www.myfonts.com/search?search%5Btext%5D=rheingold" target="_blank" rel="nofollow">Rheingold</a>.</p>
