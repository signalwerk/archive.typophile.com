    <p>I found this in a book called "Early Advertising Art" by Dover, I was thinking of digitizing it for more practice making fonts. But curious on any history of it? Has it been already digitized? (didn't see anything close on whatthefont.com). If it did make it into a font, i'd most likely give it away.</p>
    <p>thanks</p>
