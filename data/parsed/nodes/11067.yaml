    html: <p>Agfa was originally an acronym for <i>Aktiengesellschaft für Anilinfabrikation</i>. In 1989, Agfa-Gevaert Inc (1964) merged with Compugraphic and Matrix. [Note that Agfa-Gevaert <i>Inc</i> is not be be confused with the Agfa-Gevaert Group, which is the parent company that owns all the others.]</p>
