  html: |-
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: Font Starter&nbsp;Packs</strong></p>
    <p>A recommended list of commercial fonts available in affordable collections, usually on <span class="caps">CD</span>. Of interest to students and designers looking to begin building a professional typeface&nbsp;collection.</p>
    <dl><dt><a href="http://www.youworkforthem.com/product.php?sku=T0077">Canada Type Collection&nbsp;01</a></dt>
    <dd>Includes Adore, Blackhaus, Coffe Script, Dominique, Flirt, Fontella, Pendulum, Quanta, Runway, Sailor, Torquemada, Treasury, Heathen and Mayfair.  -&nbsp;$299.99</dd>
    <dt><a href="http://www.youworkforthem.com/product.php?sku=T0272">Canada Type Collection&nbsp;02</a></dt>
    <dd>Includes Ambassador Script, Clarendon Text, Fantini, Jezebel, Jupiter, Mascara, Militia, Militia Sans, Merc, Vip, Vox, Silk Script, Sterling Script, and Swan Song.  -&nbsp;$447.95</dd>
    <dt><a href="http://www.stormtype.com/package-alpha-1-single-license.html">Alpha 1 Single&nbsp;License</a></dt>
    <dd>By Storm Type Foundry, 434 Fonts both for text and display, single user license. €&nbsp;299</dd>
    <dt><a href="http://www.stormtype.com/package-storm-open-library-22.html">Storm Open Library&nbsp;2.2</a></dt>
    <dd>Also by Storm Type Foundry, 164 Fonts, including Amor Sans <span class="amp">&amp;</span> Serif, Baskerville Original Pro, Vida and Walbaum Pro. €&nbsp;490</dd>
    <dt><a href="http://store1.adobe.com/type/collections.html">Adobe&nbsp;Collections</a></dt>
    <dd>A variety of Adobe type&nbsp;packages.</dd>
    <dt><a href="http://www.fontshop.com/products/fontcds/the_cambridge_collection_font_cd/">The Cambridge&nbsp;Collection</a></dt>
    <dd>200 classic faces from Bitstream -&nbsp;$199</dd>
    <dt><a href="http://www.linotype.com/3501/funeralvaluepack.html">Linotype Funeral Value&nbsp;Pack</a></dt>
    <dd>Admittedly of limited use, a nice set of typefaces useful for setting funeral&nbsp;announcements.</dd>
    <dt><a href="http://www.fontshop.com/products/fontcds/fontstars/">FontStars&nbsp;2007</a></dt>
    <dd>29 OpenType fonts from 14 foundries. The best new additions to the FontShop collection in 2007.&nbsp;$599.00</dd>
    <dt><a href="http://www.insidersoftware.com/customer/product.php?productid=16254&amp;cat=279&amp;page=1">FontAgent Pro <span class="caps">PLUS</span> (Download) - Mac <span class="caps">OS</span>&nbsp;X </a></dt>
    <dd>FontAgent Pro software with 750 professional Open Type fonts from Bitstream and including the full Breaking The Norm set&nbsp;bundled. </dd>
    <dt><a href="http://www.fonts.com/findfonts/detail.htm?productid=886882">Ascender Resume <span class="amp">&amp;</span> <span class="caps">CV</span> Font&nbsp;Pack</a></dt>
    <dd>6 Faces for&nbsp;$19.99</dd>
    </dl><p><strong>Fonts Bundled with&nbsp;Software</strong></p>
    <dl><dt><a href="http://www.unleash.com/articles/fonts/coreldrawx3fontlist.asp">Corel Draw bundled&nbsp;fonts</a></dt>
    <dd>Corel Draw (Version 4 and later), Corel Clipart collections and, apparently, Corel Wordperfect, come bundled with a collection of up to around 1000 fonts, mostly from Bitstream. Older versions have <span class="caps">URW</span> and <span class="caps">ITC</span> fonts as well. Newer versions are in Open Type <span class="caps">TTF</span>, older ones in Truetype and Postscript <span class="caps">T1</span>. These fonts are good in quality but lack advanced typographic features like old style figures and&nbsp;smallcaps.</dd>
    <dt><a href="http://www.adobe.com/products/creativesuite/type.html">Adobe Creative Suite bundled&nbsp;fonts</a></dt>
    <dd>Adobe Creative Suite products come bundled with a large collection of&nbsp;fonts.</dd>
    </dl><p><strong>Discussions:</strong><br><a href="http://typophile.com/node/56838">On Goin’ Legit</a><br><a href="http://typophile.com/node/88053">Affordable Font Packs /&nbsp;Bundles</a></p>
