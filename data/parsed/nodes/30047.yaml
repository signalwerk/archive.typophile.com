    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Font Starter Packs</strong></p>
    <p>A recommended list of commercial fonts available in affordable collections, usually on CD. Of interest to students and designers looking to begin building a professional typeface collection.</p>
    <dl>
    <dt><a href="http://www.youworkforthem.com/product.php?sku=T0077" rel="nofollow">Canada Type Collection 01</a></dt>
    <dd>Includes Adore, Blackhaus, Coffe Script, Dominique, Flirt, Fontella, Pendulum, Quanta, Runway, Sailor, Torquemada, Treasury, Heathen and Mayfair.  - $299.99</dd>
    <dt><a href="http://www.youworkforthem.com/product.php?sku=T0272" rel="nofollow">Canada Type Collection 02</a></dt>
    <dd>Includes Ambassador Script, Clarendon Text, Fantini, Jezebel, Jupiter, Mascara, Militia, Militia Sans, Merc, Vip, Vox, Silk Script, Sterling Script, and Swan Song.  - $447.95</dd>
    <dt><a href="http://www.stormtype.com/package-alpha-1-single-license.html" rel="nofollow">Alpha 1 Single License</a></dt>
    <dd>By Storm Type Foundry, 434 Fonts both for text and display, single user license. € 299</dd>
    <dt><a href="http://www.stormtype.com/package-storm-open-library-22.html" rel="nofollow">Storm Open Library 2.2</a></dt>
    <dd>Also by Storm Type Foundry, 164 Fonts, including Amor Sans &amp; Serif, Baskerville Original Pro, Vida and Walbaum Pro. € 490</dd>
    <dt><a href="http://store1.adobe.com/type/collections.html" rel="nofollow">Adobe Collections</a></dt>
    <dd>A variety of Adobe type packages.</dd>
    <dt><a href="http://www.fontshop.com/products/fontcds/the_cambridge_collection_font_cd/" rel="nofollow">The Cambridge Collection</a></dt>
    <dd>200 classic faces from Bitstream - $199</dd>
    <dt><a href="http://www.linotype.com/3501/funeralvaluepack.html" rel="nofollow">Linotype Funeral Value Pack</a></dt>
    <dd>Admittedly of limited use, a nice set of typefaces useful for setting funeral announcements.</dd>
    <dt><a href="http://www.fontshop.com/products/fontcds/fontstars/" rel="nofollow">FontStars 2007</a></dt>
    <dd>29 OpenType fonts from 14 foundries. The best new additions to the FontShop collection in 2007. $599.00</dd>
    <dt><a href="http://www.insidersoftware.com/customer/product.php?productid=16254&amp;cat=279&amp;page=1" rel="nofollow">FontAgent Pro PLUS (Download) - Mac OS X </a></dt>
    <dd>FontAgent Pro software with 750 professional Open Type fonts from Bitstream and including the full Breaking The Norm set bundled. </dd>
    <dt><a href="http://www.fonts.com/findfonts/detail.htm?productid=886882" rel="nofollow">Ascender Resume &amp; CV Font Pack</a></dt>
    <dd>6 Faces for $19.99</dd>
    </dl>
    <p><strong>Fonts Bundled with Software</strong></p>
    <dl>
    <dt><a href="http://www.unleash.com/articles/fonts/coreldrawx3fontlist.asp" rel="nofollow">Corel Draw bundled fonts</a></dt>
    <dd>Corel Draw (Version 4 and later), Corel Clipart collections and, apparently, Corel Wordperfect, come bundled with a collection of up to around 1000 fonts, mostly from Bitstream. Older versions have URW and ITC fonts as well. Newer versions are in Open Type TTF, older ones in Truetype and Postscript T1. These fonts are good in quality but lack advanced typographic features like old style figures and smallcaps.</dd>
    <dt><a href="http://www.adobe.com/products/creativesuite/type.html" rel="nofollow">Adobe Creative Suite bundled fonts</a></dt>
    <dd>Adobe Creative Suite products come bundled with a large collection of fonts.</dd>
    </dl>
    <p><strong>Discussions:</strong><br>
    <a href="http://typophile.com/node/56838" rel="nofollow">On Goin' Legit</a><br>
    <a href="http://typophile.com/node/88053" rel="nofollow">Affordable Font Packs / Bundles</a></p>
