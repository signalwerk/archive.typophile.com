  html: |-
    <p>Hello my friends,</p>
    <p>I'm facing an anoying problem now… On Fontlab 5.0.4 for Mac, I can't click on the metrics window tools menu (the one that has 'Open AFM, save, measurement line buttons, etc). I can click on these, excpet I cannot click on the class kerning button (the one where you select if you want the metrics window to show class kerning, or kerning with key pairs only, etc). It's stuck on not showing class kerning - and I need to see them all :D</p>
    <p>So anoying, the button is there, it's not greyed or whatever, but nothing happens on click…</p>
    <p>Reinstalling didn't help at all…</p>
    <p>Any help?</p>
    <p>Maybe a low instruction to fontlab to set this?</p>
    <p>Cheers</p>
