    html: |-
      <p><em>…what's that font with the way too peculiar question mark?</em></p>
      <p>Futura. Which also has a funny "j" and "t". But Renner's really weird "g" and "a", and his stick-and-ball "r", never made the final cut.</p>
      <p>These days, it's possible to cover one's bets, with Stylistic Alternates in the OpenType format. For instance, Adobe Jenson relegates the authentic "M", with its top inside serifs, to alternate status, the default being conventional.</p>
