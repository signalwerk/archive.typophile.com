    html: |-
      <p>A typeface may be deemed great when some skilled  user has found the perfect use for it and has done a very good job of using it. This may come soon after release of the face or years later. A particular quirk in a glyph that does not seem to sit well with some percentage of users only helps to bring that font to be discussed and therefore more well known.  There have been times when a thing is looked upon as an odd quirk and times when that same thing has seemed quite normal to most viewers.  The Gill Sans binocular g was seen as quite odd during the 60s-70s when AG, Helvetica, and Univers  were the accredited fonts in use.  During the earlier days, of Gill Sans, there was not so much a problem as it was an expected form in the tradition of the English.  It also came back in the late 80s-90s as a proper g, fit  for the face.  There was a big surge in use of the sans binocular g in what we call humanist sans in the past half dozen years--most notably by talented Dutch type designers of our time.  Even though this form of g can be quite problematic at bolder weights and smaller sizes because it can look too dark when small yet too light when big.  That is not to say type designers were trying to be quirky.  We can only speculate on what enticed them to choose a certain form.  Some may love the challenge, some wanted a more pronounced distinction from other sans or even other glyphs, some just may have wanted to better match a serif face or a historic reference. Would not a quirk by some other name be cloaked as normal?<br>
      Basically, it is my belief that a typeface is tapped for knighthood as "Great" by users much more than by type designers. Users have fickle ways of turning on an accepted face with disgust or "rediscovering" a disgraced face face some years later when it is not only "good again" but chic.  In many cases, it is just popularity that breeds contempt and they go the way of Helvetica and Disco.  Don't be surprised when your grandchildren reintroduce Disco Dancing and revert to that very hip and sweet face known as Helvetica ;-)</p>
