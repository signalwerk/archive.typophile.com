      <p>There was a PDF of a Gans specimen book floating around the web for a while. You might find it in there.</p>
      <p>By the way, like many foundries of the era, Gans made many "copies" of other popular typefaces, and Dalia may be their version of Middleton’s <a href="http://www.fontshop.com/fonts/singles/creative_alliance/delphian_open/?&amp;affid=99346&amp;sample_text=P%C3%93SITO%20MAR%C3%8DT&amp;sample_size=60&amp;acs_pt=32&amp;update=0&amp;affid=99346" rel="nofollow">Delphian Open</a>.</p>
