    html: |-
      <p>This design doesn’t look contemporary to me. It looks very 60’s/70’s industrial/corporate. I like your idea of using the 8 sublevels of the museum. </p>
      <p>There should be a concept behind your design, don’t just try and do something that looks “cool”. I hope I don’t sound harsh here, we all have a tendency to get caught up in executing without a strategy first. </p>
      <p>Dive in to what the museum is about and develop your concept out of that. You will have to explain your design, and why you arrived at your solution, so you should have a good idea behind it. You may have done a lot of this thinking already, but to me this design doesn’t feel contemporary.</p>
      <p>One final thought - if most museums are using sans-serif, maybe a contemporary museum would break away from that and try something new to set itself apart? Best of luck on your project.</p>
