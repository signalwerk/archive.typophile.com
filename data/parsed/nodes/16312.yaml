    html: |-
      <p>i did a research. result was that the majority use a sans serif (mostly helvetica, din, trade gothic). without or with a mark (which often relates to the architecture of the building)</p>
      <p>i like for example the logo of the expo hannover (the moiree “bubble”, which is always changing)… i think for something like a contemporary art museum, a dynamic (i mean always transforming) logo would be perfect.. </p>
      <p>i didn’t want to limit myself, by not using a mark. if i use one, i think it has to be symbolic (communicating the aspect of change and dynamic).</p>
      <p>the only thing i know is that the museum has more or less 8 subareas…</p>
      <p>exposition, moving exposition, moving library, show, conference, cinema, theater, projection</p>
      <p>maybe i can do something with this… that these eight parts are somehow visible in the logo…</p>
