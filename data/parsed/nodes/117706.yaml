    html: |-
      <p>Everlane uses a bespoke typeface simply called 'Everlane Sans'. Fot these letters only, it resembles <a class="freelinking external" href="http://www.myfonts.com/search/engravers+gothic/" rel="nofollow">Engravers Gothic</a>/<a class="freelinking external" href="http://www.myfonts.com/search/blair/" rel="nofollow">Blair</a>/<a class="freelinking external" href="http://www.myfonts.com/search/sackers+gothic/" rel="nofollow">Sackers Gothic</a>. The rest of the alphabet is more 'techy'.<br>
      The other one is <a class="freelinking external" href="http://www.myfonts.com/search/century+schoolbook" rel="nofollow">Century Schoolbook</a>.</p>
