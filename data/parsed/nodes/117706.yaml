    html: |-
      <p>Everlane uses a bespoke typeface simply called 'Everlane Sans'. Fot these letters only, it resembles <a href="http://www.myfonts.com/search/engravers+gothic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Engravers Gothic</a>/<a href="http://www.myfonts.com/search/blair/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Blair</a>/<a href="http://www.myfonts.com/search/sackers+gothic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Sackers Gothic</a>. The rest of the alphabet is more 'techy'.<br>
      The other one is <a href="http://www.myfonts.com/search/century+schoolbook" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Century Schoolbook</a>.</p>
