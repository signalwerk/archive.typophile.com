    <p>I've been working on this font for about 5 months, and I figure it's about time to get some fresh eyes on it. It's designed to work at both text and display sizes -- my goal is for it to be bold and interesting at large sizes but be extremely legible at small sizes while taking up the least amount of room.</p>
    <p>I currently have seven different weights, though I am also planning on doing a set of obliques (I will probably do true italic characters as alternates, or vice-versa) as well as small caps/fractions/old-style figures/other OpenType features.</p>
    <p>Let me know what you think!</p>
    <p><img src="/sites/default/files/old-images/roster_3421.jpg"></p>
