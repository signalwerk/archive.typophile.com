    html: |-
      <p>Thanks riccard0! Interesting about the similarity to DIN...I was actually worried about it looking too much like Trade Gothic, but I will look into keeping it distinct from both. I really don't want to be known as the guy that makes rip-off fonts! After drawing both Roster and Normandie I noticed lots of similarities with other fonts, which I guess isn't necessarily a bad thing but I do want to make them distinct with their own stand-out characteristics.</p>
      <p>I see what you mean about the numerals -- do you recommend making them narrower? Or smaller all-together? They line up with the caps height and while I know most fonts have slightly smaller numerals I figured it worked in this case.</p>
      <p>I'll keep going on these and hopefully have a new sample up in a week or so. I didn't have as much time to work on these this week as I would have liked.</p>
