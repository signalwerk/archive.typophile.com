    html: |-
      <p>To my slowly-becoming-less-untrained eye, I am, again, really impressed. I agree that Kristian's is pretty incredible, and I really dig the little hooks on Sebastian's. And I'm glad that dtw even took the time to do a ligature. I'm interested in how all of you went about this problem, and what your strategies were behind optimizing the letters for text setting.</p>
      <p>Not knowing really how to start, here's what I did: After I messed around a little yesterday with a pen, I decided that it was gorgeous out, so I went out on the deck and drew out each letter on graph paper, x-height about an inch an a quarter (3cm). Then I came inside a couple hours later, scanned that, and traced it in illustrator, doing a lot of copying and pasting of serifs and stems in the process (a quick way to establish consistency, I figured). Then, the copy and paste job in illustrator was another hour and change, spacing the letters manually (that was a mistake). My thinking behind this alphabet is that I wanted to allow for reasonably high ascenders without ridiculous leading. So I made big blocky serifs to emphasize the line of text so that I didn't have to make the leading too generous. Of course, my submission is no battle-winner, but it's a start (for me at least).</p>
      <p>Is that similar/different to what you did/thought about while doing? Just curious.</p>
