    html: |-
      <p>Well for speed I went for draw-it-straight-in-the-computer. Lots of modular bits (verticals, horizontals, serifs), plug 'em together and tweak to fit, with occasional sideways glances at Karen Cheng's book...</p>
      <p>All drawn on one line in CorelDraw and then imported into TypeTool (see, a non-designer with non-designer's software! LOL). Sidebearings as per Cheng, kerned about ¼ of the necessary pairs then thought 'stuff this, it's taking too long'... Paragraph assembled line by line in Photoshop as I'd stuffed up the vertical metrics.</p>
      <p>I do like Kristian's: those serifs are far more elegant than my hobnail-boot-like ones!<br>
      __________________________<br>
      Ever since I chose to block pop-ups, my toaster's stopped working.</p>
