      <p>Hi, thanks. Yeah I know about Paratype, and I was unable to find anything close, which is why I asked here. The closest to Copperplate Gothic on that site is a Cyrillic version of Engravers Gothic. That's why I asked here since I know there's lots of font enthusiasts, experts, designers here, etc.</p>
