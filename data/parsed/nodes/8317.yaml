    date: null
    date_raw: null
    votes: null
    html: "<p>I don't think I would go with a \"deeper red\". To me, that is even more bloody. If anything, I would lean more in an orange direction, which has no relationship to blood or medical institutional imagery. Also, I don't mean to be intentionally contradicting Hugh on all accounts, but the dove thing seems to be a pretty far stretch. Anytime a heart is used as imagery, my first concern is avoiding the image of breasts or a butt. In this case, the only alternative image I can see beside the intended one is a flaming fart exiting a butt. <br> <br>I can't say I like the tagline at all. \"Houston Wellness Center: Wellness is our middle name.\" It is redundant and doesn't add any explanation or description. Something like \"Houston Wellness Center: Live a longer, healthier life\" or \"...Be stronger, live longer\" makes a suggestion about what the wellness center is about. \"...is our middle name\" is an old school clich� that refers to the speaker instead of the reader. Today's customer/client wants to be communicated with in terms of theirself. <br> <br>Good luck Jay.</p>"
