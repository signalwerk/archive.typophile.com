    html: <p>yikes - forgot about the whole error thing - been three months since I posted (ugh) if a mod could just delete one of those.  <br> <br>LOL - Scott - boy oh boy I must be way out of practice at critique (heheheh) - Instead of deeper I should have said cooler reds- not quite as far as a rubine, but something of that more calm feel - but orange is an energy color so if you can get them to make enough of a shift to be an actual orangey (is that a word) red then you cold inject a ton of energy into the logo.  <br> <br>Scott you are probably right - it is a bit cliche, but I think that is what appeals to me - it seems like it is coming full circle. There are a lot of taglines for hospitals around here that are those kinds of statements. Norton - Experience. Better Care.; Baptist East - Feel Better. Maybe it was just the whole going for the cute punch line that got the nostalgic side of me. <br> <br>As far as the dove - I swear I see it, but that may be the fact that I am from the south and you can't swing a dead cat without hitting a church down here. And I know of a couple that are actually called Hearts of Fire Church (one was located in an old firehouse so it was always a bit corny). All I am saying is I have seen logos for churches that maximize the similarity between a flame shape and a downward dove - (i've even designed one or two). If I am the only one who sees it - then you are probably safe. - Just thought to mention it.</p>
