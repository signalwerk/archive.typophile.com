  html: <p>This is my first post to this forum. I have designed a logo for a local wellness center and I am not quite happy with it. <br> <br>I am pleased with the overall design but I think I need to tweak it just a bit more. The company has an existing logo of a heart with an olympic flame over it. I decided to update their image with a new design. <br> <br>They did'nt really ask for a redesign but I took the initiative to put something together for them. They have actually used the logo on a drink bottle but nowhere else. I think they are afraid to change their identity because they might look too "successful". <br> <br>The logo would eventually be applied to stationary, bus. cards, etc. Any critiques would be great at this point. I'm very happy with the concept but it still needs a little something. <br> <br>Thanks for the help <br><img src="http://www.typophile.com/forums/messages/29/56490.jpg" alt=""></p>
  html_clean: <p>This is my first post to this forum. I have designed a logo for a local wellness center and I am not quite happy with it. <br> <br>I am pleased with the overall design but I think I need to tweak it just a bit more. The company has an existing logo of a heart with an olympic flame over it. I decided to update their image with a new design. <br> <br>They did'nt really ask for a redesign but I took the initiative to put something together for them. They have actually used the logo on a drink bottle but nowhere else. I think they are afraid to change their identity because they might look too "successful". <br> <br>The logo would eventually be applied to stationary, bus. cards, etc. Any critiques would be great at this point. I'm very happy with the concept but it still needs a little something. <br> <br>Thanks for the help <br><img src="http://www.typophile.com/forums/messages/29/56490.jpg" alt=""></p>
