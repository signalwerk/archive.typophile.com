    html: <p>The concept is okay, in my opinion. But the overall feeling lacks finesse, subtlety. The capitals are rather insipid in contrast with the flowing forms of the central heart-piece.  <br>The way the H sits against the heart leaves this little angle in the top-right corner. This needs to be corrected. Also, to my eye, the W sits to cramped in the heart. Due to all the diagonal lines of that letter, you need to orchestrate a fine balance between form and counterform here. <br>Have you experimented with other fonts, or a narrower heart, smaller letters? Might be usefull.</p>
