    html: <p>I like the direction your logo is taking, but you might want to look at the flame shape and maybe make a small adjustment. As it is now, it is very similar to the shape of a descending dove, in that case it almost certainly gives a quasi religious feel to it - especially in some evangelical circles in the south. Perhaps another toungue on the flame would help or rounding the bottom a bit more. Unless of course it is associated with a church group or religious movement - in which case it would be very appropriate - right now it kinda seems to say Mercy Hospital of the Sacred Heart to me. As far as any ambiguity of the word wellness center - in Louisville almost ALL of the new health clubs are called "Wellness Centers" so I think that aspect is clear - is that a regional thing maybe? I do like the tagling though - very snappy. Is it possible to shift them to a deeper red - less bloody and more soothing? I think that will cut down on the medical feel - also maybe incorporate a softer color into the text to help even it all out.</p>
