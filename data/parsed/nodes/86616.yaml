      <p>In addition to the /t/ and /e/ flourishes,<br>
      the font seems also italicized by an additional let's say 12+ degrees.</p>
      <p>I recommend to check the following ones;<br>
      if you ignore /t/ and /e/ they look pretty close:</p>
      <p>FleurishScript<br>
      Ancestory SF<br>
      Yorkshire<br>
      Cumberland<br>
      OPTIYork Script</p>
