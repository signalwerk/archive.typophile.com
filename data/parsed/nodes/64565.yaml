    html: <p>Oh yes, and I meant "one-to-many" when I wrote "many-to-one." I would like to finally attempt a Latin font that employs one-to-many. You can completely redo connecting strokes using modular bits instead of grafting them on to every glyph and amassing hundreds of tedious variants. Of course I suppose in reality it will prove more complex. Does anything on the Apple side support one-to-many in Opentype yet? Aside from CS4 of course. Mellel perhaps?</p>
