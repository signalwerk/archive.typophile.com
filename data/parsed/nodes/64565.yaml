    html: |-
      <p><em>my only complaint is that the implementation of Stylistic Sets is mutually exclusive</em></p>
      <p>Yes, that is a problem, although not in the case of Gabriola, whose Stylistic Set lookups are designed to be mutually exclusive.</p>
      <p>Regarding how Gabriola works: there are just about every kind of GSUB lookup employed. Stylistic Sets 6 and 7 make heavy use of contextual one-to-many substitutions: the big independent swash forms are zero-width glyphs that are inserted into the glyph string according to contextual rules. When I started the project, I wasn't sure there would be any applications in which I could even test these lookups, since MS didn't support the features and Adobe didn't support one-to-many substitutions, but by the time I'd finished the font Adobe had finally implemented that support, and now MS Publisher and Word are going to support the features.</p>
      <p>I did all the OTL feature work myself. Ross hinted the font, with advice from Mike Duggan. I can't say I actually understand how it is hinted, but apparently it is a relatively novel approach.</p>
