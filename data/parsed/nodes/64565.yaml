    votes: null
    html: |-
      <p>I use VOLT.</p>
      <p>I believe Mellel should work with one-to-many lookups. And perhaps also Apple's own OT support? Try TextEdit.</p>
      <p>I've played with the idea of making a Latin connecting script font that splits letters into left and right side halves. I would use the 'curs' GPOS feature to tie them together -- even though there are no vertical offsets and the attachments would all be 0,0 -- because otherwise you risk the letters being broken apart by tracking (of course, you probably want to discourage users from tracking a script font anyway, but users will do the darndest things).</p>
      <p>The tricky issue would be overlap of joins, ensuring that rounding doesn't produce stem offsets or dropped pixels. This is less of an issue with subpixel rendering than it used to be. For full pixel rendering, you want an overlap of 70 units on 2048 to ensure no drop out.</p>
