    <p>I just downloaded the latest Office 2010 beta, and the Opentype feature support seems to have expanded more since the Technical Preview. You can get to far more features now. If you have 3.5GB of space lying around, try it out.</p>
    <p>So far (after ten minutes of experimentation with just Gabriola) my only complaint is that the implementation of Stylistic Sets is mutually exclusive, against the spec. You cannot turn on multiple stylistic sets at once. So for example, something like Hypatia Sans, where stylistic sets toggle individual alternates for fine control, is crippled in this application. </p>
    <p>I will write feedback requesting that they modify the interface to change ss01-ss20 to checkboxes instead of a pulldown. Has anyone here had direct contact with the specific MS employee interested in this and capable of addressing it?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/GabriolaWord201050pct_6311.png"></div><p></p>
