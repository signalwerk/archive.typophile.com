      <p>I’ve never used any DTL applications, but the makers are well-respected and experienced type &amp; software developers. I’m sure it would be a worthy program, but I don’t know how suited it might be to a beginner.</p>
      <p>FontLab Studio is, by far, the more commonly used tool by the professionals that I know and work with. TypeTool is a pared down version of FontLab Studio and provides a good upgrade path in terms of skill sets (and license also, iirc).</p>
      <p>Regarding ATypI member benefits, see this link:<br>
      <a href="http://www.atypi.org/news_tool/news_html?newsid=577&amp;from=/" title="http://www.atypi.org/news_tool/news_html?newsid=577&amp;from=/">http://www.atypi.org/news_tool/news_html?newsid=577&amp;from=/</a></p>
