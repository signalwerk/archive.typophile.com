    html: <p>Just catching up with news here, but noted your post because we both live in Vermont. I have used Fontographer for many years and the new update is great. I recommend it for many reasons. Also TypeTool 3 is very good and a great introductory program. FontLab Studio is the best of all. Each program has something to recommend it but I personally would start with Fontographer. Best of luck to you.</p>
