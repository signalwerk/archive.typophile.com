    <p>Hi,<br>
    I have just joined Typophile and have taken the tag of this forum to heart: "anything goes". I also add that I'm definitely not a "fly by nighter" as I was friends with Mac McGrew and actually provided one of the specimens for his American Typefaces book. </p>
    <p>I am a graphic designer (specializing in typography--many years), a fine art photographer, and web designer. I wish now to take my love of letters to the next level and experiment with type design. After much browsing and reading I have found the DTL Bezier Master. Given that I am so green (very bright green in fact) I want to know if this is a valid place to start. My plan is to create a simple face to begin to learn the skill of type design. Is this program the place to start. </p>
    <p>I need also add that I am poor, on social security, and teaching a beginning graphic design course at the local college here. I also looked at the TypeTool 3 which is considerably cheaper and has an academic discount program as well. But, my heart leans to the DTL tool.</p>
    <p>I also want to join atypi -- but being late in the year, I would prefer to wait until the new membership year begins in January. Does anyone know if that membership includes any discounts with DTL?</p>
    <p>I would welcome advice on my venture from anyone willing to help. And I thank you for taking the time to read this now.</p>
    <p>Clair</p>
