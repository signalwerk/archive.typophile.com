    <p>HGR are simply defined by their respective roots and uses.</p>
    <p>For example:</p>
    <p>neeshmosee<br>
    נ ש מ ת י<br>
    my soul</p>
    <p>Look at its root and common use</p>
    <p>root<br>
    nuhn + shin + mehm<br>
    3 Hebrew letters</p>
    <p>gematria<br>
    50<br>
    300<br>
    40<br>
    =<br>
    390</p>
    <p>=<br>
    shas<br>
    talmud</p>
    <p>small number gematria<br>
    =<br>
    5 + 3 + 4<br>
    =<br>
    12<br>
    tribes of israel</p>
    <p>its basic meaning is the soul of a jew is related to the study of talmud<br>
    = every jew</p>
