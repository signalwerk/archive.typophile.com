    html: |-
      <p>This set of GSUBs assumes that you have defined 5 glyph groups:</p>
      <p>1.  t'nu'ah ge'dola glyph group = the five members of Henna's set from above:<br>
      a) komatz gadol<br>
      b) chirik gadol (chirik followed by a yuhd)<br>
      c)  tzeray, tzaray yuhd<br>
      d) shuruk (kubutz)<br>
      e) cholam, cholam nistar</p>
      <p>2. all hebrew letters glyph group<br>
      all the Hebrew letters and their matches</p>
      <p>3.  all nikkud glyph group<br>
      all the nikkud</p>
      <p>4.  all taamim glyph group<br>
      all the taamim</p>
      <p>5.  meteg glyph group</p>
