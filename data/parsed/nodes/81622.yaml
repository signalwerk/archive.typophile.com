      <p>The Radak says the t'nu'ot ge'dol'lot, and t'nu'ot ke'tan'not, define what is and is not a shvah-na and shvah-nach.</p>
      <p>Some people mistakenly thing that a t'nu'ah is a sound pattern, and can not define what is and is not a shvah-na and shvah-nach by analysis of context. Of course, this is an incorrect understanding of what is a t'nu'ah.</p>
      <p>According to the view of Rabbi (Shlomo) Zalman (of) Henna (Henau), a shvah-na and shvah-nach can in deed be defined by analysis of context.</p>
      <p>As Prof. Aron Dotan of Tel Aviv University (retired) told me explicitly, "everything is in the nikkud".</p>
      <p>Rabbi Zalman Henna defines a shvah-nah as a shvah which follows a t'nu'ot ge'dola, and shvah-nach as a shvah which follows a t'nu'ah ke'tan'nah.</p>
      <p>Here is his chart from Henna's book, "Yesod HaNikkud".</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/tnuot_6354.JPG"></div><p></p>
