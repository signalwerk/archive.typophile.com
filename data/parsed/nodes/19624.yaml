    <h2><a href="/node/36129" title="TypeCon2008 Buffalo Town Hall Meeting, Tues., Aug. 21">TypeCon2008 Buffalo Town Hall Meeting, Tues., Aug. 21</a></h2>   <p>SOTA’s going to be on location in Buffalo next week to meet with local crew and others interested in helping to develop the TypeCon2008 program and extracurricular activities.</p>
    <p>All type lovers are encouraged to join us for our first official local planning/brainstorming meeting for next year’s ’con.</p>
    <p>Tuesday, August 21st | 6pm<br>
    WJ Morrissey’s Irish Pub in Buffalo’s Historic Cobblestone District<br>
    30 Mississippi Street (one block away from HSBC Arena</p>
    <p><a href="http://maps.google.com/maps?f=q&amp;hl=en&amp;geocode=&amp;q=30+Mississippi+Street,+Buffalo,+ny&amp;sll=37.734436,-122.243442&amp;sspn=0.031293,0.058365&amp;ie=UTF8&amp;ll=42.875225,-78.87424&amp;spn=0.007249,0.014591&amp;z=16&amp;iwloc=addr&amp;om=1">Directions to TypeCon2008 Meeting</a></p>
    <p>Anyone interested is free to attend, but please RSVP in case we need more space.</p>
