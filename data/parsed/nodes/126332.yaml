      <p>If this is a logo, whatever the source, it’s most likely been customized.</p>
      <p>Which is probably why I haven’t found a match. Linoletter Black might have been the inspiration:<br><a href="https://www.myfonts.com/fonts/adobe/linoletter/">https://www.myfonts.com/fonts/adobe/linoletter/</a></p>
      <p>To match that O, however, try FP Head Pro Black:<br><a href="http://www.myfonts.com/search/fp+head+pro/">http://www.myfonts.com/search/fp+head+pro/</a></p>
