  html: |-
    <p>I am trying to convert my old armenian fonts to unicode. I have a lot of fonts and I was thinking if there is a pyhton script that can help me. What I need is a script similar to the “Rename glyphs by scheme [TTG]” script, only it has to renumber the glyphs from one unicode # to another.</p>
    <p>Is there any such script?</p>
