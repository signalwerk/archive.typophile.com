    html: |-
      <p>It looks hand drawn to me.</p>
      <p>There are variations in common letters, and the angle of "radiation?" varies all over the place.</p>
      <p>It's from 1976, so it ain't type on a path. I think you'd probably have to slant a script font backwards to get it to work like that as well.</p>
      <p>Richard</p>
