    html: <p>This is crazy. All you need to do is put the smcp feature before your alt features, or really any features that transform upper or lowercase glyphs into something that has no corresponding form in the small caps (e.g., liga). (Only exception would be fi and fl which exist as single type-able glyphs in some encodings.)</p>
