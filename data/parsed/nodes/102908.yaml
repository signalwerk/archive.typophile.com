    html: |-
      <p><em>…if two different glyphs are substituted with the same target glyph…</em></p>
      <p>Make three identical target glyphs, named differently.<br>
      As Justin says, there may be no practical use for that, but if it helps you keep things straight in your head and logically organized, it’s a best practice. Redundancy can also be useful if you ever have someone else work on your ﬁles, or return to the ﬁles after several years and try to ﬁgure out what on earth you were thinking back then!</p>
      <p>t.smcp<br>
      t.alt.smcp<br>
      T.smcp</p>
