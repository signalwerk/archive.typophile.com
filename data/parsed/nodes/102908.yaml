  - id: 553832
    user: 2438
    date: 2013-05-11T21:53:00
    date_raw: 11 May 2013 — 9:53pm
    votes: null
    html: |-
      <p>For lowercase alternates, the only reason I can imagine needing a duplicate .smcp glyph is if you have some feature coming after smcp that would need to know whether the original glyph was an alternate (i.e. in order to convert it back to lowercase?). But I can't think of any practical examples of such a feature, so probably not necessary.</p>
      <p>For uppercase alternates, it might be useful to include real smallcap glyphs that could be invoked with the c2sc feature.</p>
      <blockquote><p>You should order your features so that .smcp is executed before .alt.</p></blockquote>
      <p>Otherwise include both glyphs in the smcp feature (i.e. <code>sub [t t.alt] by T.smcp;</code>).</p>
    html_clean: |-
