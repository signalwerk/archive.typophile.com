      <p>True, but that technique requires omitting "t.alt" from @smcp_source, and complicates feature order.<br>
      If, for some unrelated reason, one decides to copy and paste the glyphs in that class, or change the feature order, then things could go wrong. This form of glyph proliferation is suggested as a general best practice, containing redundancy but pre-empting complications by removing exceptions.</p>
