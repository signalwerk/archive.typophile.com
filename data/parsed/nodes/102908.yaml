  html: |-
    <p>I have alternative glyphs for lowercase and caps. For example, I have /t.alt and /U.alt but NO corresponding /T.alt or /u.alt. How would you handle the SmallCap OT feature in such case?</p>
    <p>Should /t.alt be replaced with /T.smcp or should I create a "placeholder" /T.alt.smcp glyph that would be just an exact copy of /T.smcp ?</p>
    <p>Bit hard to explain, hopefully you understand my question?</p>
