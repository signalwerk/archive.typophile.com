    html: |-
      <p>If I wanted to reuse the lowercase class for something else but also wanted “t.alt” included, rather than add redundant glyphs in the font, I would just do something like this:</p>
      <p><code>sub [ @lowercase t.alt ] by [ @lowercase_foo t.alt.foo ] ;</code></p>
      <p>Or, just make another class, like this:</p>
      <p><code>@lowercase_extended = [ @lowercase t.alt ] ;</code></p>
      <p>There are certainly cases where redundant glyphs make sense, but if it’s to solve a problem that could be solved by changing feature order or adding a class or class exception, I think it’s a bad idea.</p>
    html_clean: |-
