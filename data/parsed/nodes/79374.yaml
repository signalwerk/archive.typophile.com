      <p>@Bendy:</p>
      <p>I have no problem with anyone running a competition in any way they see fit. I am not proposing that Letter.2 be redone.  I just wish there would be somewhere a competition that really focuses on our current time and avoids the previous several hundred years.  I guess the way of the world is that no one ever talks about "what is happening now" until that now is at least 50 or even 100 years old.  With time, we get to only look at the chosen remaining remnants that historians or the like have labeled and written about.  I guess it is easier to be a Monday Morning Quarterback 50 years after the fact than it is to face the live pass-rush of our time while you are making your call ;-)</p>
      <p>I propose a new Type  exhibition, or book or, competition called "Now or Never" where the criteria for entry would be that no design would be accepted that was a redo, reference, revival, recapture, reverent look back at, recapitulation of, or reconstruction of historic or very oft used forms.  That is not to say that we would get all absolutely squeaky clean "Original" entries because that might be impossible but we would be making an effort to go at least in that direction.  This would certainly not exclude renowned and immensely talented type designers like Slimbach from entering their finest work.  I am sure our senior living members of the type design community are quite capable of stepping away from the historic realm and creating brilliant types that are more descriptive of the contemporary.</p>
