      <p><em>As ATypI treasurer, I suppose you could think I have a vested interest in keeping the sponsors happy.</em></p>
      <p>Yes, that's a pretty good description of vested interest.<br>
      Whether a vested interest causes bias is another matter, and hence the issues.</p>
      <p><em>I'm not clear on what influence mechanism you think they have.</em></p>
      <p>As I said, vested interest. Not the same thing as payoff.</p>
      <p><em>The first two “issues” are equally true of most juried competitions.</em> </p>
      <p>Right. But most Best of the Year juried competitions aren't quite so ambitious: "a wide-angled snapshot of the state of typeface design around the globe … to promote typographic excellence and best professional practices … to raise awareness about the role of typography at encouraging and maintaining cultural diversity." There are a lot of contradictions in using a competition format to advance that agenda.</p>
      <p>The rules are somewhat disingenuous with regards to the role of different scripts (writing systems). Explicitly this is a global competition, yet the rules, which are in English, do not break down language categories: surely the judges have a vested interest in selecting non-Latin types to fulfill the competition's agenda? Why not have specific categories for different writing systems? </p>
      <p><em>What “steps” would you suggest? </em></p>
      <p>Enough already with the quote mocks.</p>
