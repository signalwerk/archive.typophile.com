      <p>"Speculative" seems to be a term that I can't find useful in this context.  We may be just thinking along completely different lines. Speculative implies that the originator is either unsure about it or just not ready to call it a finished product.  To me, it implies rough sketches of a "possible concept" rather than a ready to use completed item.</p>
      <p>The typefaces that I would like to see given more media play are designed in the current decade but working, ready-for-prime-time use today.  The ones I am talking about are at least attempts to be reasonably original and not holding the coattails of well established historic models. I am after types which answer the question "What is the best design for real use that focusses on the here and now and may at some point be looked back upon by competent historians archeologists as being representative of early 21st Century work.  When you look at Helvetica, it portrays the zeitgeist of mid to late 20th Century reasonably well but is really not what says anything about today (other than today, people are too locked in to the past). There are tons of well documented scholarly works out there written about incunabula, arts and crafts, "modern", transitional, oldstyle, classical, what have you.., that you can quite readily pinpoint types of their time and show examples of work to prove your case.  No body speaks about the real "today" though, without a quick segway to historic forms.  Are we all so frightened that we cannot possibly measure up to the long-dead masters that we deny even the attempt of doing our own stuff? Is it it true that "only dead guys" had anything to say? Can't we just face our own days problems square on and think we must solve them with our own day's thinking and tools? We are no more or no less able, talented or intelligent than any other peoples of previous time and society.  Why must we so tight-fistedly grip the loin clothes of our ancestors?  Our ancestors did not do this but we do.  Are we really totally gutless and in awe of the past that we will be known as the Copy Cat era who did nothing but borrow from the anointed deity of history?</p>
      <p>We should be able to say, "This is us, this is what we do now. This is neither an experiment or a speculation of what ought to be done now or in the future.  This is our stuff as it is and it is just as polished as the Trajan inscription, Renaissance calligraphy, Garamond, Caslon,  Didone, Bauhaus, Tschicholdian, Push Pin, Swiss modern, or PoMo, and we are not ashamed of it."</p>
    html_clean: |-
