    <p>I would like to inform you that the Rules of the Letter.2 type design competition are now available on the website <a href="https://web.archive.org/web/20150123220135/http://www.letter2.org/" title="www.letter2.org">www.letter2.org</a></p>
    <p>Regards,</p>
    <p>José Scaglione</p>
    <p>-------------------------</p>
    <p>More information about Letter.2:</p>
    <p>Letter.2 is the second international competition of type design organized by the Association Typographique Internationale (ATypI). The first event of this kind since the founding of ATypI  took place in 2001, and it was a contribution to the United Nations Year of Dialogue Among Civilizations. The winning entries were exhibited at the United Nations Headquarters in New York (USA) and they were featured in the book Language Culture Type.</p>
    <p>Letter.2 aims to provide a wide-angled snapshot of the state of typeface design around the globe ten years after the 2001 competition, and to promote typographic excellence and best professional practices. It also intends to raise awareness about the role of typography at encouraging and maintaining cultural diversity.</p>
    <p>The jury will meet in Buenos Aires in October 2011 and will make a selection of winning entries based on their design excellence. The winning designs will be exhibited at the 2012 ATypI conference. Letter.2 is made possible thanks to our platinum sponsors Fontlab, Typekit and Veer, and our gold sponsors Ascender Fonts, FontDeck, FontShop, Monotype Imaging, P22, TypeTogether and Webink. Find out more about becoming a sponsor or a media partner for this event please visit <a href="https://web.archive.org/web/20150123220135/http://letter2.org/sponsors/" title="http://letter2.org/sponsors/">http://letter2.org/sponsors/</a></p>
    <p>Mark your calendar! Submissions open on April 4, 2011.</p>
