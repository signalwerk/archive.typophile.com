      <p>That may be difficult to assess.<br>
      For many years, when I was working as an art director, I would sent typeface proposals to Letraset, and was always turned down.<br>
      In retrospect, I suspect the roughness of my comps (following the roughness of the advertisement comps in my day job) mitigated against my designs. And now in digital culture everything is so slick. And final finish is so important to fonts, especially something as subtle as Legato.</p>
      <p>So perhaps the format for conjectural would be just "Hamburgefons" — fully finished/polished, but only a few characters.</p>
      <p>But do people still use that word alone to assess a typeface proposal, in this day and age?</p>
