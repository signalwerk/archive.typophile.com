      <p>There is no way to make certain that any design competition will be completely unbiased, anonymous, fair, or even representative. We all know this and have been entering our work regardless for years in assorted competitions.  The only truly anonymous entries are from unknown designers and foundries.  Everyone knows who did the work on all the more popular foundries is no secret. Does this weigh on the judges who might want to place an unknown designer higher than say a Zapf or a Frutiger?  Perhaps, but people are human and have failings.  </p>
      <p>The point is, Does this really matter at all?  I don't think so (unless you are a winning-is-all- that-matters person).  Judges may differ and some face that is found less objectionable to the lot may do better than one with great discrepancy in opinion.  We just have to trust all those involved have done their best to arrive at a fair choice and move on. ATypI is a reputable organization made up of most of us and they don't seem to have any malice in mind.  It is a completely voluntary competition with a reasonable entry fee that will surly be judged by competent people. There is no punishment for not winning. Those who care to enter may and those who don't care to can opt out.  While our individual egos may be bruised if not chosen, such is life and not a thing to worry about. The show will go on with or without us.</p>
