      <p>Users don't know it is old because it is most often still used and talked about today.  Users only get a chance to know it if we dare do it, show it, and talk about it.</p>
      <p>I did not say "old stuff" is not useful now or should not be used, I said we already know plenty about old stuff because it is never ignored and always praised.  We know next to nothing about "our era's original stuff" because we don't have the guts to talk about it. The 90s are over, too, whatever it was, hooligan or not, is not now. Looking back even only 20 years is far easier and safer than looking only at the moment of now.<br>
      I don't care to be so closed minded as to limit the work to what some may call avant garde or to exclude what some may call hooligan work, or naive work.  I would just like to see Now Work that is not just reflections of previous Not Now work.  It just needs to be a finished usable typeface of respectable enough quality to do its job.  Work that would be a kin to 2010-2020 but not pretending to be either "the Future" or "the Past".  Content with itself in the present and unashamed.</p>
