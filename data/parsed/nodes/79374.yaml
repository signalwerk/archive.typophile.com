      <p>What “steps” would you suggest? The first two “issues” are equally true of most juried competitions. I think that seeing who the jury members are, and later the variety in the winning entries, should address those issues. Feel free to critique who is on the jury if you like: <a href="https://web.archive.org/web/20150123220135/http://letter2.org/jury/" title="http://letter2.org/jury/">http://letter2.org/jury/</a></p>
      <p>As for the third, perhaps you can explain what you are implying and how exactly you see an issue emerging?</p>
      <p>From the sponsors’ POV, of course for those who are foundries or distributors, they will be happy if more of “their” fonts win. But I'm not clear on what influence mechanism you think they have. They are contributing money up front to the competition. The last similar one was a decade ago. So, what, the jurors are going to worry about whether the sponsors will sponsor again in ten years? Or jurors will worry about whether not voting for enough sponsor-connected fonts will cause the sponsor(s) to get upset and not sponsor the next ATypI conference or something?</p>
      <p>As ATypI treasurer, I suppose you could think I have a vested interest in keeping the sponsors happy. But I have nothing to do with the judging of the contest.</p>
      <p>As a sponsor, even if I was sufficiently lacking in ethics to *want* to swing the competition, I don’t think the benefits of “victory” would be worth the risk of getting caught trying to manipulate the outcome. I suppose for somebody unknown, that equation might be different, but I think all the major sponsors have reputations to protect.</p>
      <p>Cheers,</p>
      <p>T</p>
