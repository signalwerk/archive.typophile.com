      <p>Hello,</p>
      <p>I just made a second post about the early bird discount for type submission ending soon and I saw that I neglected to keep an eye on this thread. My apologies.</p>
      <p>I understand the different concerns raised here and wanted to to clarify a couple of issues. Specially those that relate to the organization itself.</p>
      <p>I agree that the snapshot we obtain from this event is limited to the types that were submitted, to the criteria set for the judging procedure and, ultimately, to the opinion of the judges. This is something inherent to all competitions and all we could do is to select the jurors and work on the judging criteria as carefully as possible. </p>
      <p>Regarding the amount of submissions, what we tried to do is to bring down the cost of the entries as much as possible, so we make it easier for those designers living or working in lower income places of the world. The goal is to get an overview of how type design is evolving around the globe. The problem is that this kind of competitions require quite a bit of investment, so in order to have these very low entry fees, we need the support of sponsors. </p>
      <p>We kept the same criteria with the sponsorships as we did with the entries. Set up the sponsoring opportunities at lower end costs and accepting sponsorships in kind and media partnerships with as many organizations or small companies as possible. The idea is to have the support of as many people as possible instead of relying on a single big contributor. Making this plural and transparent is in the very same spirit of the event.</p>
      <p>Finally, we stablished a system of digital submissions that guaranties that fonts will remain anonymous throughout judging. Non-latin fonts will not be received as a separate category, that's why there's no mention in the rules, but in the submission process there's a box to indicate the scripts supported by each entry.</p>
      <p>I hope this clarifies at least some of the ideas behind the way this is organized.</p>
      <p>Kind regards to all of you,</p>
      <p>José Scaglione<br>
      Chairman, Letter.2</p>
