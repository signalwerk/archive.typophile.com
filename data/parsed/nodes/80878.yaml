  html: |-
    <p>Hi,</p>
    <p>what do you think about this multiple fonts combination? <a href="http://gayonmars.eu/" title="http://gayonmars.eu/">http://gayonmars.eu/</a> (The site is still in designing phase and not complete).</p>
    <p>The fonts used:</p>
    <p>Jeanne Moderno Ultra by Steve Mehallo for the page heading</p>
    <p>Jeanne Moderno Titling Italic by Steve Mehallo for the page subheading</p>
    <p>FF Tisa Web Pro by FontFont for the headlines</p>
    <p>Ratio by ps Type for the body text, social icons labels and  timer labes (days, hours etc.)</p>
    <p>LFT Etica Display Web by TypeTogether for the timer numbers.</p>
    <p>All fonts are from the Typekit library.</p>
    <p>I am not completely sure about the headlines / body text pair.</p>
    <p>All opinions are really appreciated.</p>
