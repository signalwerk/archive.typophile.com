    html: |-
      <p>I don't mind a lot of fonts, well hierarchied, and am impressed you have the hutzpah to use one of the very few "Unicase with small unicase" typefaces for your main style!</p>
      <p>However, the main subhead is a bit off. It is distinguished by size, position and color, so a separate font/style is not necessary.<br>
      Also, the countdown numbers are odd as the only sans on the page, and don't seem "techy" enough if you are using them in an illustrative, denotative manner; they also don't sit very comfortably on the convex gradiented surface.</p>
