      <p>Shave them off in Photoshop if they are what is bothering you! I would not want to convince you but I think Solemnis is one of the most beautiful hybrid Uncial/Roman fonts ever. A wee bit of the Isles with a bit of the Roman punch. I would use it in a logo, but for almost 30 years people have demanded that I hand letter their requests... so I have never had a chance. I bought the font when I bought my second computer... haven't ever even used it but I love to look at it.</p>
      <p>As to the Belhaven (and thank you for the spelling correction) I had 4 quarts and 8 shots of Irish whiskey at my rehearsal dinner. Needless to say I was worthless for a bit : ) The owner shut down his pub for our dinner and we went 'til 2. Needless to say the parents went home early but the band played on!</p>
      <p>Michael</p>
