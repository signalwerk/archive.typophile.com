    html: |-
      <p>It's starting to get busy... too busy. It doesn't feel congruent. There seems to be 3-4 different elements/styles working, but not well, together. </p>
      <p>The Field from your original post is much better than the current version, all it needed was a little more roughing. I would have ran it through the photocopier a few times to give it some "antiquing". </p>
      <p>The Irish Pub &amp; Eatery byline stands out way too much. While the style is sharp and unique it isn't very "Irish" feeling. I'd stay with a more organic, earthy approach. The Irish are Earthy people and the current style feels very rigid and well, stylish.</p>
      <p>And the Banyan Tree is just over the top... very heavy and throws the entire layout a little out of whack. It also seems very clean. It needs tossed in the mud and then backed over with the car a few times. </p>
      <p>Just giving my honest impressions, nothing against you Jay or your abilities. I'd take this as a true opportunity. It's not often one gets to create a logo for an Irish establishment. I'd really do some research, visit some other local Irish establishments, sample the delectable Irish fare and beverages. Have some Single Malt Scotch and Guinness or 2. Practice your brogue when talking to friends and relatives. Wear some plaid, or atleast some green and if it's not too cold, hit the links. All in the name of research!</p>
