      <p>You're not conceited, I wasn't aware. I saw Florida and well, just assumed. Also, I didn't mean to offend by mixing my countries together. </p>
      <p>Having that out of the way, I agree with you on the front that Americanized Irish Pubs don't have a clue when it comes to their signage. But, I do also like the Fado's logo. There's a Fado's in Philly I've been to on occasion.</p>
      <p>If it's Fado's that you like, I'd suggest following their example. The logo is simple, but rustic without being overloaded. And there aren't mixed styles. If you create a solid identity, then the idea of The Field being an Irish Pub and Restuarant should be understood without having being said.</p>
      <p>You might have approached this idea already, but what if you created a field, and have a simpler Banyan Tree as the center point. I'm picturing shafts of wheat on both sides. Then include a weathered version of The Field positioned next to this illustrated field.</p>
      <p>Again, just a suggestion. I don't mean to ruffle any feathers. When I see a design posted in the crit section, I critique it.</p>
