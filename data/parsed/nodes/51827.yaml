  html: |-
    <p>Hello,</p>
    <p>Just wanted to get some feedback on this. It is an identity redesign for an Irish pub I work at called 'The Field'. The pub resembles an Irish farmhouse or cottage and is very rustic and homely - extremely unique and traditional. They have been in business for over 7 years and have quite a poor and hacked up Celtic blackletter logotype at the moment. They are renowned for great food and music.</p>
    <p>The type is set in a modified version of Device's Sparrowhawk which was traced and scanned to give it a handlettered feel. The tagline is set in Steelplate Gothic Shaded. The parchment is quite likely to be the treatment so I thought it should be in there.</p>
    <p>Thanks,<br>
    Jay</p>
    <p>NEW LOGO:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/field_hndltr_3863.jpg"></div><p></p>
    <p>OLD LOGO:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/field_logo_5253.jpg"></div><p></p>
