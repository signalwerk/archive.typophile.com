      <p>Just to mention Tony, I agree with you 100% regarding the over-cleanliness of the revision. The main reason I did not include any irregularities from my scan is that there's a lot of irregularities! Calligraphy is shit hard and I now have a new found respect for scribes of old :)<br>
      My plan was to hand draw as close to what I wanted as possible, thereby having an authentic sketch to reference when tracing. Then once I have all of my letterforms working well with each other and of proper scale and proportion, then I would introduce color, texture and 'vintage' it up somewhat, possibly even retracing it by hand like my initial idea.</p>
