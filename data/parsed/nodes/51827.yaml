    html: |-
      <p>Asvetic,</p>
      <p>Thank you for your frank critique. I do want to antique it for sure, but want to get the type and treatment correct first. I feel the tagline would loose legibility at smaller sizes were it any smaller. The tree, as fussy as it is, is stylistically subjective. I have seen many logos in recent years published and recognized for their brilliance that have much fussier graphical treatments that I hated. So I can see your argument.</p>
      <p>And not to sound conceited...BUT...I am Irish, from Dublin. Have been to more Irish pubs than I would like to admit, drank more Guinness, Irish Whiskey (Scotch is from Scotland btw as is plaid), have a natural Irish accent and have been immersed in so much Irish culture while in the US and at home that I think I would bleed green if cut.</p>
      <p>That said, you not being Irish and the target market not being Irish but the sort that are of Irish ancestry and think Scotch is from Ireland, may also not get it.</p>
      <p>One thing I hate is the total tackiness of any of the Irish/American crap I see. Despite a lot of research, I have not been able to find any Irish pub logos that I like - with the exception of <a href="/wiki/%20http%3A/%252Fwww.fadoirishpub.com/" class="freelinking" rel="nofollow">Fado</a> which I feel is contemporary and represents a modern and progressive Ireland and not the backward tack you see most places.</p>
      <p>Michael,<br>
      What did you mean by 'imagine it without the serifs'?<br>
      We just got Belhaven this week :) Got to wait to finish our Czechvar before we can put it on line though. It is so good with the nitro pour.</p>
