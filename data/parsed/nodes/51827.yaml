      <p>Eh...the wavy appendages on the type...look...weird. I mean, what is more tradiational than an irish pub?! you need to sell that culture...their heritage. It's kind of like people craving pizza for dinner. More often than not, they will go to the store with the green, white and red sign...why? because it's Italian! They have a rep for making the best pizza! ( and they do generally make really good pizza!) I just think the wavy lines draw too much attention away from that. </p>
      <p>robbiefa had a good direction with the sub head. I'm not so sure the sans serifs are working. It looks too much like a meatball shub shop. I hope I'm not coming off too harsh, I don't mean to at all. I'm just a big believer that it's best to accent the strengths of a business in their logo if at all possible. An Irish Pub's strength is the simple fact that they are Irish! :) well at least their claiming to be in their pub's name. </p>
      <p>courtney</p>
