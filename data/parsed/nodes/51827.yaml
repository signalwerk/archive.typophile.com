      <p>The placement of "the" does look awkward poised on top of the F. So in terms of layout I like the bottom sample best. I like the type you used for Irish Pub and Eatery on the first one, but the type for "Field" doesn't work with it in my opinion. </p>
      <p>You might consider staying away from the uncial types as they seem rather cliche for an Irish pub. I don't know what your decor there is like, but a lot of Irish pubs have the feel of early 20th century. It might be worth considering a type treatment along those lines if thats the case. Sort of what you might see on an old bottle of whiskey.</p>
      <p>Stephen Rapp</p>
