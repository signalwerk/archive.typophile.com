    <p>I’m working with Zeppelin 31 in Indy CS3 and getting odd behavior from the <cite>Th</cite> ligature.</p>
    <p>In Zeppelin the ligature works everywhere but the first word of the paragraph. If I change it to Walbaum the opening ligature is activated and the next in line separates.</p>
    <p>Maybe someone else would experiment a bit and see if they get similar results.</p>
    <p>Here’s and example.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Zep_6221.gif"></div><p></p>
