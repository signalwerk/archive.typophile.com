      <p>Yeah, I noticed that too Chris. It seems to have something to do with tracking; once the typeface starts to look too openly spaced it knocks the ligature feature off, which is quite sensible I guess as ligated pairs would look too tight.</p>
      <p>In the example above the top line especially looks more widely tracked than the bottom three lines.</p>
      <p>Nick Cooke</p>
