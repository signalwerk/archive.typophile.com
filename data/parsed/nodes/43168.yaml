    votes: null
    html: |-
      <p>It is the tracking and justification settings working together.</p>
      <p>The first thing I do is to track a font out to notice where the ligatures break. That helps me decide IF I want to use the ligatures.</p>
      <p>The justification settings, which I have not finalized, added another layer of variance. When I hem in the letter spacing tolerance it comes back together and behaves.</p>
      <p>I have not set justified text in a long time.</p>
