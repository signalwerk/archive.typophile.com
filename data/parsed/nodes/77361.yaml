    <p>so I've just began an idea of a simple hairline serif typeface.<br>
    I am very early in the process of putting it together but I've come across a small dilemma: should I dot my /i/s and /j/s or do diamonds add a little class or sophistication? is there certain protocol for this or is entirely based on opinion, etc.<br>
    I've attached the letters for reference.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ij_6255.jpg"></div><p></p>
    <p>thanks</p>
