    html: |-
      <p>Fair point, Frode. If you want to licence the font then that might help create a personality, but then it might also be a selling point to have some alternatives! Changing the tittle does produce an unusually large change in overall appearance (dots always seem friendlier than blocks, for example), so it is worth bearing in mind.</p>
      <p>Any other interesting alternatives out there?</p>
  - id: 444332
    user_id: 16884
    user_name: Ehague
    user_path: null
    user_image: /files/pictures/picture-16884.gif
    date_raw: 19 Dec 2010 — 11:04am
    date: 2010-12-19T11:04:00
    votes: null
    html: <p>Isn't there also some notion that diamond tittles, punctuation, etc. denote a kind of calligraphic thrust? That's how I always interpreted something like Kabel, that gets more brush stroke–like (or woodcut-like, maybe) as it moves toward heavier weights. This goes even more for Fedra, but then it's fairly modulated.</p>
