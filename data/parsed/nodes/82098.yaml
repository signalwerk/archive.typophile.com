    <p>Hello</p>
    <p>I'm looking for help creating a few magazine spreads (a mockup essentially) for a school assignment, with emphasis on good typography. You might be thinking that it may prudent to educate myself on these things, read some books, and you may be right, but my time frame is very limited, so unfortunately I do not have time to do so. I hope, regardless, that this post is in the spirit of the site, as I do hope to learn something from this, despite rudely requesting end results, so to speak, of tested and tried combinations of fonts and style. If you deem this inappropiate, then disregard the remainder of this post and please know that no disrespect was intended. </p>
    <p>Looking at the forums on this site, I'm convinced that there are a great many typographically and design gifted people that frequent this place. I'm looking for one of those for not only advice, but if I find someone both creative and willing to assist the design of these spreads, there can be payment. But not a lot, as it is a non-profit/non-commercial school assignment, and my budget is not great. </p>
    <p>I'm looking for help in setting text, font choices (what fonts goes well together), proper leading, kerning and so forth of headings, subs and the body text for legibility, column widths (left justified or perhaps full justified if possible) and gutter. A tested and tried recipe, I suppose - but for the sake of doing the fonts justice. Suggestions on use of whitespace is certainly appreciated. I realise this is more of a design issue than legibility.</p>
    <p>The spreads I will print on a highend color laser printer on matte coated paper. I don't know the exact details of the paper.</p>
    <p>My idea is that the titling and headings may be a sans-serif font, and a serif font for the body text - legibility and easy decoding being key. I hope for a modern look, but not necessarily brand new fonts.</p>
    <p>Please forgive me, these are all of different style and period and I don't know which fonts go well together. I liked some of the Gerard Unger fonts, but I also looked at some type foundry sites, like Linotype. I looked at Garamond, Granjon, Edison, Centennial, Bembo, Caslon, Farnham, Mrs. Eaves or some derivative of any of those for the body text. For titling or headings: Frutiger, Gothic, Aptifer or some other modern looking font. Yes, I realise that this is very vague and subjective. I'm sorry, I do not know how to otherwise describe them.</p>
    <p>I know there are many variations of most of these fonts. Any suggestions?</p>
    <p>My apologies for the very lengthy post. I hope anyone would like to provide some tips and suggestions. If this post is completely off key, please disregard, or if a mod deems it inappropiate, delete it.</p>
    <p>Many thanks for reading it all.</p>
