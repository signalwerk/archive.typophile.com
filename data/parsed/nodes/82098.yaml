      <p>Things to read about:</p>
      <p>• Optical trickery<br>
      • Vertical rythm and the baseline grid<br>
      • What a display face needs vs. what a text face needs<br>
      • What paper does to a typeface<br>
      • What printing does to a typeface<br>
      • Misregistrations and coloured type<br>
      • Pairing typefaces &amp; superfamilies<br>
      • Hierarchy and navigation<br>
      • Even colour and optical sizes<br>
      • The grid<br>
      • Proper use of text figures and lining figures, punctuation and other nitty gritty stuff<br>
      • White space<br>
      • The physical restrictions of the magazine format<br>
      • The mental restrictions of the human brain<br>
      • Leading and measure<br>
      • Widows and orphans<br>
      • Balance and tension</p>
      <p>etc.</p>
