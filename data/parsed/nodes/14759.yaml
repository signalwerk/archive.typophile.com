    <p>I've Googled and Wikipedia'd, but I'm unable to find an answer: is there a term for using punctuation/symbols to hide explitives? </p>
    <p>(My friend who asked is of the opinion that there <em>must</em> be, given the existence of the <a href="http://en.wikipedia.org/wiki/Interrobang">interrobang</a>. Heh.)</p>
