      <p>My impression of Goudy is that he liked to make sweeping statements that he himself probably didn't agree with one hundred per cent. Under the right circumstances, he might have even letterspaced lowercase. </p>
      <p>Both Goudy's and Lawson's statements seem to presume that typographers are all solving the same problem, and thus their efforts must all converge toward one perfect solution. </p>
      <p>Typefaces are vehicles. Is a Ford pickup a more perfect vehicle than a Lamborghini? That depends on how much 5hit you have to haul.</p>
