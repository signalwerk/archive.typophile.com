      <p>@PublishingMojo:<br>
      You make a good point, but even if one admits there will always be multiple typefaces, because we have multiple applications (such as text versus display), and we assume that both Goudy and Lawson realized that... then we go to the next level.</p>
      <p>Would it be a reasonable assumption, say, that there could ever be "one best typeface" for a specific task, such as body copy for continuous reading?</p>
      <p>Goudy's statement doesn't seem to assert that. He notes that if some characteristic - say sharper serifs - unproblematically made any typeface better (for a particular application, let's assume) then every typeface intended for that purpose would have really sharp serifs.</p>
      <p>That doesn't leave out the possibility of design freedom in other aspects of the typeface. The typefaces would all belong to the "sharp serif" kind, but there could still be only one of them.</p>
      <p>But, at least as I understood what he said, he clearly intended the "if" to be counterfactual. We don't see all text faces, or all display faces, or all headline faces, looking alike <em>even in just one, or a few, trivial characteristics</em>. Because his intent was to say that <strong>there are no shortcuts to quality</strong>.</p>
      <p>And so good craftsmanship and good design is the only universal. That is the <strong>opposite</strong> of a situation where there is a single best typeface, <em>even</em> for a single purpose.</p>
