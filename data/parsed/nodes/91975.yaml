      <p>“<em>…Shaikh and Chaparro (2004) found that people could read text with surprisingly long line lengths (95 characters per line) 6% faster than short to mid-length lines (35, 55, 75)</em>.”</p>
      <p>I believe you mean:</p>
      <p>Shaikh, D. A. (2005).  The effects of line length on reading Online news. <em>Usability News, 7(2)</em>. </p>
      <p><strong>Abstract</strong><br>
      This study examined the effects of line length on reading speed, comprehension, and user satisfaction of online news articles. Twenty college-age students read news articles displayed in 35, 55, 75, or 95 characters per line (cpl) from a computer monitor. Results showed that passages formatted with 95 cpl resulted in faster reading speed. No effects of line length were found for comprehension or satisfaction, however, users  indicated a strong preference for either the short or long line lengths.  </p>
      <p><a href="http://surl.org/usabilitynews/72/pdf/Usability%20News%2072%20-%20Shaikh.pdf" title="http://surl.org/usabilitynews/72/pdf/Usability%20News%2072%20-%20Shaikh.pdf">http://surl.org/usabilitynews/72/pdf/Usability%20News%2072%20-%20Shaikh.pdf</a> </p>
      <p>————</p>
      <p>Shaikh, A. D. &amp; Chaparro, B. S. (2004). A survey of online reading habits of internet users. <em>Proceedings of the Human Factors and Ergonomics Society Annual Meeting September. 48(5)</em>, 875–879. doi: 10.1177/154193120404800528</p>
      <p><strong>Abstract</strong><br>
      This study evaluated the reading habits of Internet users across five document types. Internet users completed an online survey indicating whether they were likely to read a document online or on paper using five possible choices. Document types evaluated included journal articles, news, newsletters, literature, and product information. Results revealed differences in the reading habits based on document type. Journal articles were reported to be primarily printed while documents such as online news, newsletters, and product reviews were reported to be read mainly online. Users tended not to use online sources for reading literature. Primary factors determining whether a document was printed or read online were size, importance, and intended purpose of document.</p>
