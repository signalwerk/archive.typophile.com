      <p>The quest for a single perfect typeface for a general class of application is doomed to failure.</p>
      <p>There are differences between individual people, between groups of people, and changes in what people (individuals or groups) are used to over time. There can also be differences in the environment for the consumption of the “same” textual material. With digital material, there can be interesting differences in the devices used to display it, as well.</p>
      <p>Not to mention that there can be differences in the mental state of people reading the material. For example, Shaikh and Chaparro (2004) found that people could read text with surprisingly long line lengths  (95 characters per line) 6% faster than short to mid-length lines (35, 55, 75). But for just over half their subjects 95 CPL was their least favorite reading condition. In a situation where the reader is forced to read something and speed is important, long lines might be good, but otherwise, one suspects they would be less likely to consume the material, and long lines are bad.</p>
      <p>Yes, that was line length rather than a font change. But we see similarly complex issues around choosing fonts (and typesetting) to create “disfluency,” which is superficially attractive yet almost certainly a bad idea in the real world where people may just not consume the information.</p>
      <p>All of which is a long-winded way of saying: type design (and typesetting) is complex. Although there is not doubt that poor choices can be made, and that striving for perfection is a fine thing, defining and proving that any particular typeface (or typesetting condition) is literally “perfect” for some application is a chimerical quest.</p>
