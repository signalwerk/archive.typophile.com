    html: |-
      <p>Hold the Ctrl key while you press the Play button for runnig the macro. You'll be presented with the dialog shown below. Make sure that the option "Allow changes to glyph outline" is unchecked.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/autohint_5632.png"></div><p></p>
      <p>If the issue persists send me some files and we'll look into it. Thanks.</p>
