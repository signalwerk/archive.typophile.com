    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Henning Krause</strong></p>
    <p>German typeface designer, currently working in Berlin. Born 1965.</p>
    <p><a href="http://www.formgebung.com" title="http://www.formgebung.com">http://www.formgebung.com</a></p>
    <p>1990–1993<br>
    Employee at <a href="/wiki/MetaDesign" class="freelinking" rel="nofollow">MetaDesign</a>. Involved in the design of the CI and navigation system of the BVG (the Berlin transit authority). During this project, MetaDesign created <a href="/wiki/FF%20Transit" class="freelinking" rel="nofollow">FF Transit</a>, which is used by the BVG and distributed by FSI <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a> International.</p>
    <p>Afterwards independent type designer. Krause develops typefaces for corporations and for <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a>. During the mid-1990s, he designed a signage font for DeutscheBahn, which was meant to be more legible in large sizes than <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a>. This typeface will most likely be seen less and less, however, as the Deutsche Bahn has a new series of typefaces (2005), which were designed by <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a> and <a href="/wiki/Christian%20Schwartz" class="freelinking" rel="nofollow">Christian Schwartz</a>.</p>
    <p>In 2006, FontShop Berlin released <a href="/wiki/Trivia" class="freelinking" rel="nofollow">Trivia</a> a demo font designed by Krause. Trivia is in the style of many contemporary sporting event fonts, and some consider it similar—but significantly better—than the typeface used in the World Cup Germany 2006 identity. Trivia is expected to be released as a full typeface family by FSI FontShop international in the future.</p>
    <p>In 2006, he translated (and expanded) <a href="/wiki/Karen%20Cheng" class="freelinking" rel="nofollow">Karen Cheng</a>'s <a href="/wiki/Designing%20Type" class="freelinking" rel="nofollow">Designing Type</a>. The German edition, published by the <a href="/wiki/Verlag%20Hermann%20Schmidt" class="freelinking" rel="nofollow">Verlag Hermann Schmidt</a> in <a href="/wiki/Mainz" class="freelinking" rel="nofollow">Mainz</a> is hardcover, and longer than the english edition. It is also not set in <a href="/wiki/Univers" class="freelinking" rel="nofollow">Univers</a>! The German title is called "Anatomie der Buchstaben – Basiswissen für Schriftgestalter", which is better translated as "Anatomy of Letterforms—Basic Tips for Type Designers."</p>
    <p><strong>Links</strong><br>
    <a href="http://www.formgebung.com" rel="nofollow">http://www.formgebung.com</a><br>
    (Henning Krause's website, with some portfolio information)</p>
    <p><a href="http://typophile.com/node/20905" rel="nofollow">http://typophile.com/node/20905</a><br>
    (Typophile thread with images of Krause's Deutsche Bahn signage face and FF Transit)</p>
    <p><a href="http://guillemets.de/weblog/trivia-welcome-vergleich" rel="nofollow">http://guillemets.de/weblog/trivia-welcome-vergleich </a><br>
    (German-language, image-filled blog article comparing Trivia with <a href="/wiki/Welcome" class="freelinking" rel="nofollow">Welcome</a>, the 2006 World Cup face)</p>
    <p><a href="http://www.fontblog.de/files/category-6.html" rel="nofollow">http://www.fontblog.de/files/category-6.html </a><br>
    (Scroll down this German-language page to find Jürgen Siebert's great article introducing Trivia on his <a href="/wiki/fontblog" class="freelinking" rel="nofollow">fontblog</a>; unfortunately, the article does not have a direct link)</p>
    <p><a href="http://www.slanted.de/767" rel="nofollow">http://www.slanted.de/767</a><br>
    (The big German typography blog <a href="/wiki/Slanted" class="freelinking" rel="nofollow">Slanted</a> discusses Trivia)</p>
