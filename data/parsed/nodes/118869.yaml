    html: <p>Just a sidenote now after Dick's brilliant identification of 'Cyclones'. 'Cyclones' is an exclusive typeface for <a class="freelinking external" href="http://www.cyclones.com/pdf3/91103.pdf" rel="nofollow">Iowa State Athletics</a> and can't be used for any purpose else. Now judging by the complete alphabet, 'Cyclones' is definitely based of Berthold City.</p>
