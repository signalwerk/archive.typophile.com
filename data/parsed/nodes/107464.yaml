    <p>I have 10 original floppies containing Macintosh TrueType fonts that date back to the late 90s. I am on a PC and can't read the disks. I went to a media conversion company that read the disks and put all the fonts on a jump drive. They said they were able to see the actual fonts on the screen. However, I cannot access or install any of the fonts on my PC. There are two sets of font files on the jump drive. One set begins with the font name but has zero bytes. The other begins with  ._  and then the font name and has data ranging from 22KB to 40KB. All the extensions are .TrueType. I changed the extension to TTF but still couldn't access or install any of the fonts.</p>
    <p>Any suggestions?</p>
