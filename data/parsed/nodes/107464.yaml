      <p>I have success from two different directions.</p>
      <p>The company that originally converted the fonts was able to find software (which they didn't want to tell) that made the fonts readable in the PC environment. I don't know if the Forum rules allow me to post their info, but contact me if you need to reach them.</p>
      <p>A few days later I heard from FontLab. Here is what they wrote: "All you need is to archive the mac fonts into a mac zip file. PC Transtype can see them and convert them. When someone tells me the file has 0 bytes then I assume it is not inside a mac zip archive. Here is a video on the process: <a href="http://vimeo.com/45071100">http://vimeo.com/45071100</a>." I didn't try this since the company had already converted the fonts. Note that the text says a zip file, but the video says a sit file. If one doesn't work, probably try the other.</p>
