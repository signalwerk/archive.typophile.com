      <p>There is a Y&amp;Y TeX utility to create a .pfa files from a Mac font (but maybe not from TT?), and FL can read .pfa format. Believe the utility runs in DOS -- you'd need to set up a DOS box on your PC. I did this maybe 20 years ago, don't remember all the details.</p>
      <p><a href="http://code.google.com/p/yytex/source/browse/trunk/src/c32/mactopfa.c?spec=svn10&amp;r=10">http://code.google.com/p/yytex/source/browse/trunk/src/c32/mactopfa.c?sp...</a></p>
      <p>Likely be FontLab's program <strong>Transtype</strong> will convert it too, but you still need a utility to read the Mac disk, I think (long way outside my field of expertise).</p>
      <p><a href="http://www.fontlab.com/font-converter/transtype/">http://www.fontlab.com/font-converter/transtype/</a></p>
      <p>Best: find a Mac, buy Transtype for it, create .pfb and .afm files, and take *them* to the PC -- how we do it, to this day.</p>
      <p>(Where the EULA permits, of course...)</p>
