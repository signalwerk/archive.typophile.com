      <p>Also, if you know someone whose PC runs Linux or BSD (OS X is BSD-based), you may be able to use the 'fondu' utilities from fondu.sourceforge.net to convert the files to Windows-readable TrueType fonts.</p>
      <p>The 'fondu' kit is a set of command-line utilities that can convert to/from Mac font formats. They may or may not have been ported to WinDOS yet (I really don't know).</p>
