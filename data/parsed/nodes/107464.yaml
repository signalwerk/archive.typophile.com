    html: |-
      <p>The Mac file system allows files to have two parts, called the data fork and the resource fork. The resource fork isn't really used anymore (since OS X), but it's still supported for backward compatibility. </p>
      <p>Old school Mac font files (a.k.a., font suitcases) stored all the font data in the resource fork and nothing in the data fork. Non-Mac file systems can only see the data fork. So, if you try to copy an old Mac font suitcase file to a non-Mac file system, you only get the data fork, resulting in a file with zero bytes.</p>
      <p>However, if you zip the font suitcase on a Mac, you can use PC Transtype to convert the (zipped) font. The resource fork is preserved as ordinary data within the zip file. But don't try to unzip it on the PC side; the resource fork will still be lost.</p>
