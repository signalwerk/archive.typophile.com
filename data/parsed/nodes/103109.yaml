  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/flag_4823.png"></div><br>
    <em>Fredrik Meltzer’s original design proposal for the Norwegian flag, drawn in 1821. According to the myths, it was drawn by his twelve year old son.</em><p></p>
    <p><strong>Hipp hipp hurra!</strong> It’s the 17th of May, and we’re throwing a surprise sale to celebrate the Norwegian constitution day. Get 17% off on any purchase with the coupon code “pølser”. Have a mouthful on <a href="https://monokrom.no/" rel="nofollow">www.monokrom.no</a></p>
    <p>But wait, there’s more: You can now compose custom bundles combining fonts within and across families. Any purchase with three or more items is eligble for a bundle discount.</p>
    <p>Hold on! We’re not done yet. Do you need to upgrade a license? The old one is now automatically deducted in the checkout.</p>
    <p>Puh. Time for some sausages.</p>
