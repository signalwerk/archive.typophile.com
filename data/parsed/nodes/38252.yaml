    html: |-
      <p>If you only need it for display purposes, ok.<br>
      But is it not better to buy SB (text) version and apply tight tracking (using software) in headlines?</p>
      <p>SH versions use to have a lesser count of characters - compare for yourself:</p>
      <p><a href="http://www.myfonts.com/fonts/efscangraphic/europa-grotesk-no-2-sb/lig/opentype-ps/253647/" title="http://www.myfonts.com/fonts/efscangraphic/europa-grotesk-no-2-sb/lig/opentype-ps/253647/">http://www.myfonts.com/fonts/efscangraphic/europa-grotesk-no-2-sb/lig/op...</a><br>
      (230 characters in SB version)</p>
      <p><a href="http://www.myfonts.com/fonts/efscangraphic/europa-grotesk-no-2-sh/lig/opentype-ps/254225/" title="http://www.myfonts.com/fonts/efscangraphic/europa-grotesk-no-2-sh/lig/opentype-ps/254225/">http://www.myfonts.com/fonts/efscangraphic/europa-grotesk-no-2-sh/lig/op...</a><br>
      (198 characters only in SH version)</p>
      <p>Scangraphic SB and SH sometimes (not always) differ (except tracking) in two ways:<br>
      SB (text) versions have ink traps which is ugly in big sizes<br>
      SH (headline) versions have a different positioning of diacritics.<br>
      In very rare cases, some characters differ as well. (Compare Futura SH X-Light and SB X-Light numbers.)</p>
      <p>But if there's no difference in character shapes and the only difference is tracking, I would go for SB version and apply custom tracking in big sizes. Or you could also buy the original Helvetica Neue. :-)</p>
