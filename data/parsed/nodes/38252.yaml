      <p>&gt;&gt;If you only need it for display purposes, ok.<br>
      But is it not better to buy SB (text) version and apply tight tracking (using software) in headlines?&lt;&lt;</p>
      <p>At times, I can only create documents in something like MS Word--where typographic controls are crude. I need some display weights for those instances. You are of course correct though, when using InDesign or some other layout program, manual kerning and tracking of headlines is the way to go.</p>
      <p>Thanks for the headsup on the differing character sets btw, I hadn't noticed that.</p>
      <p>&gt;&gt;Or you could also buy the original Helvetica Neue.&lt;&lt;</p>
      <p>I've owned the Neue Helveticas in the 25/26 through 95/96 weights for years. Couldn't live without them.</p>
