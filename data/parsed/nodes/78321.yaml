    <p>[Not sure which forum this is best to post to]</p>
    <p>For a flyer I need the kanji for Reiki: 霊気<br>
    I started out with Adobe's beautiful Kazuraki, which is rather unbeatable in the overall context. However, it does not contain the «<a href="http://nuthatch.com/kanji/demo/970a.html" rel="nofollow">霊</a>» kanji. So I've tried to put this together in Illustrator.<br>
    The top «rain» radical is based on the «<a href="http://nuthatch.com/kanji/demo/96fb.html" rel="nofollow">電</a>» glyph; for the bottom part (which is not a radical), I figured the structure is similar to the bottom-most part of the «metal» radical («<a href="http://nuthatch.com/kanji/demo/r167.html" rel="nofollow">金</a>») with the vertical stroke doubled, so that's what I've tried to reproduce.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/reiki_kanji_herleitung_4632.gif"></div><br>
    Before I do much more refining, I'd be really grateful if someone could confirm if this makes sense in terms of stroke order, and/or if it's legible / looks OK? (I took an intro to Japanese at university, so I have an idea of how to write kanji, but it's really too basic for «extrapolating» calligraphy.)<p></p>
