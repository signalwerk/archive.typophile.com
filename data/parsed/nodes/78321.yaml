      <p>Kazuraki does give that loose vibe, but when you look at the individual kanji the basic stroke skeleton is quite well respected. When you compare the same passage set in a true sosho and Kazuraki side by side it would be more evident, I think.</p>
      <p>What Kazuraki does simplify is horizontal arrays of simple strokes ('dots' as we call them in calligraphy), as in the top radical for 霊. The bottom part doesn't lend itself quite so well to that type of simplification, though you could probably go further than what I did above and make it basically two wide Zs stacked together plus the vertical strokes (another thing: vertical strokes seem to resist simplification in the Kazuraki style).</p>
      <p>Of course, since Nina only needs the two characters 霊気 and the Kazuraki 気 has a particularly loose feel, I think she has much more room for experimentation.</p>
