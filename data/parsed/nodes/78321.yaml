    html: |-
      <p>Structurally, it looks correct. The bottom part of the 霊 could use more space as it is rather dense at the moment. One of the design features of Kazuraki is the huge variation in the relative size of the characters which allows those with lots of strokes to breathe. There is no reason for 霊 to be so much vertically shorter than the 気 despite stacking more horizontal strokes, so you can enlarge the bottom part of the 霊 somewhat.</p>
      <p>The top and bottom parts of the 霊 do not align vertically; the bottom part is shifted too far to the right. Kazuraki is designed to be set vertically, and its characters, as free-flowing as they are, still respect the central vertical axis.</p>
      <p>I'm not sure how much looser you can get while making sure that the glyph fits Kazuraki. But as I said, if you're only using the two characters so that there's no need to harmonize with the rest of Kazuraki, you might experiment with a full sosho structure. But you'd need the help of someone who knows more about Japanese sosho calligraphy to make sure that it's in fitting with this style of calligraphy (Kazuraki is not sosho in terms of kanji structure despite its cursive feel). We don't use the character variant 霊 in Korea as far as I know (we use 靈), so I'm out of my depths here anyway.</p>
