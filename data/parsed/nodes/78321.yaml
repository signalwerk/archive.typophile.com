    votes: null
    html: |-
      <p>A more micro observation about the bottom part of your 霊 is that the strokes seem to be packed too densely in the middle. The part where two 'dots' lie on either side of the two vertical strokes (the two dots form a horizontal stroke here since it's a fast hand) is much narrower than the horizontal strokes directly above and below. This isn't fatal, but it goes against what one would expect based on calligraphic expectations of distributing strokes to achieve the optimal interplay of the black and the white. In calligraphy, the 'dots' would come right after the part shaped like ㅠ, and one would instinctively place them to take up a bit of the empty spaces on either side of the vertical strokes.</p>
      <p>Look at how this part is treated in the examples of the character SATG posted above. The two 'dots' are quite prominent in each case. Roughly, you would expect the bottom half of 霊 to fill out a trapezoid.</p>
      <p>I'm not convinced that an off-vertical axis would make the composition dynamic rather than just clumsy. To me it would be like an otherwise exquisite western calligraphic composition with a wobbly baseline or bad spacing between letters—the misalignment will be at odds with the carefully composed forms and proportions at the character level. A wobbly baseline could suggest dynamism for truly carefree fast handwriting, not ornamental copperplate calligraphy. And don't let the flowing strokes fool you: Kazuraki represents a finely tuned style of calligraphy, in Western terms closer to copperplate calligraphy than freehand scribble.</p>
