      <p><em>Friedrichstrasse 2</em><br>
      This is a custom font, based loosely on Helvetica, which was made for the Deutsche Bahn a few years ago. This was done by <a href="/web/20191007122657/http://www.typophile.com/node/20907" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Henning Krause</a> (<a href="https://web.archive.org/web/20191007122657/http://www.formgebung.com/">www.formgebung.com</a>) for them. The Deutsche Bahn will not be using that in the future though. They have a new super family, which was recently designed for them by Erik Spiekermann and Christian Schwarz. I do not think that either the older face on that sign nor the new Bahn faces are/will be available for public distribution. But maybe the designers or the Bahn have something up their sleeve.</p>
      <p><em>Stadtmitte 2: This looks like Frutiger, but the ‘i’ is wrong.</em><br>
      This should be <a href="/web/20191007122657/http://www.typophile.com/node/20908" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FF Transit</a> (specifically FF Transit Back, I guess, if it is a back-lit sign), which <a href="/web/20191007122657/http://www.typophile.com/node/15651" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">MetaDesign</a> created in the early 1990s. After the reunification, Erik Spiekermann and his Meta Design firm (which he is no longer part of) created a comprehensive signage system and CI for the Berlin transit authority. Henning Krause may of been working at Meta then, and could have played a role in the design of this as well.</p>
      <p><em>Unter den Linden 2 and Potsdamer Platz 1</em><br>
      These are <a href="/web/20191007122657/http://www.typophile.com/node/12130" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Schaftstiefelgrotesk</a> lettering jobs… they seem very similar to <a href="/web/20191007122657/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Tannenberg" title="Create node &quot;Tannenberg&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Tannenberg</a>, which was a Neo-Gothic face popular in Germany in the 1930s, and seemingly in West German (to which West Berlin belonged) in the 1950s as well.</p>
    html_clean: |-
