      <p>Stephen, If you're interested in fraktur and Germany, you should pick up <a href="https://web.archive.org/web/20191007122657/http://www.amazon.com/gp/product/1568981252/sr=8-1/qid=1151300546/ref=sr_1_1/102-2962883-0166538?ie=UTF8">Blackletter: Type and National Identity by P. Bain and P. Shaw</a> (if you haven't already). It's a nice little book containing some great essays on blackletter. I was able to order my copy from Readings St Kilda which bought it in a heartbeat. :^)</p>
