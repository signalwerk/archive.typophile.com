      <p>Thanks for sharing your photos, Stephen. I'd never seen FF Typestar in use before; it's a great looking face. I'm a sucker for a flared M. I think my favourite bit of type (just edging out the blackletter on the King's scroll), is that '<a href="https://web.archive.org/web/20191007122657/http://www.flickr.com/photos/stewf/305529918/in/set-72157594386592999/">diebels</a>'. So sharp and crisp, it's like a slap in the face. Absolutely magnificent bit of lettering. </p>
      <p>Patty, I loved Berlin and would love to go back sometime. Although, I've still got the rest of Germany to explore!</p>
