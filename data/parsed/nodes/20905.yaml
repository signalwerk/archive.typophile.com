      <p>Geoff - I really like that Stratum. Just have to find a good job for it. </p>
      <p>Dan - Thanks for those links. I wish I had more than a smattering of German. One day I'll find the time to learn it properly. (One day, one day). People always look at me blankly when I say I love German, but I think it's such a rich and expressive language. Like these Schaftstiefelgrotesk forms which are so expressive as well. Such a shame that Hitler had a preference for them. I guess they won't easily live that down.</p>
      <p>Patty - The Berlin system did run very well. Although I was in New York before I went to Berlin, and my subway experience there was great as well. Maybe I got lucky? I was amazed at the quality of the buskers in New York! There were full-on jazz combos down there and they were brilliant! It's obvious, but it was also amazing how many cultural references come to life in the New York subway: from Duke Ellington (I actually got to Take the 'A' Train, woo!) to the Beastie Boys (on the 1 or 9 line) for just two otherwise disparate examples. :-)</p>
