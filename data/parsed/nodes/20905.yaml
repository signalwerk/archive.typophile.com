    <p>Hi there,</p>
    <p>When I was in Berlin last year I was impressed by the variety in type and style on the signage of Berlin's Rail Stations. Impressed, but also surprised as (and maybe it's a stereotype, but) I would have expected more uniformity. Particularly when you consider the story of the <a href="https://web.archive.org/web/20191007122657/http://en.wikipedia.org/wiki/Ampelmännchen">Ampelmännchen</a>. </p>
    <p>Unfortunately I was only there for a week, so a couple of days had passed before I really noticed, but I photographed what I could in the time that I had. This meant some shots were a bit blurry, but then I quite like blurry photos. </p>
    <p>So I don't <cite>need</cite> to know if these samples have names, I'm just curious. Obviously a number of them pre-date digital typefaces, but they might still have a name or a history to them that one of you might know? I loved Berlin. Wish I could have stayed there longer, and not just so I could get more photos of train station signs. :-)</p>
    <p>Friedrichstrasse 1: So this one is good old Helvetica. (Which is <cite>all</cite> we have here in Melbourne.)<br><img src="/web/20191007122657im_/http://www.typophile.com/sites/default/files/old-images/01-friedrich_helv_4097.jpg"></p>
    <p>Friedrichstrasse 2: I don't know this one.<br><img src="/web/20191007122657im_/http://www.typophile.com/sites/default/files/old-images/02-friedrich_3573.jpg"></p>
    <p>Stadtmitte 1: This looks like DIN, but the 'S' is wrong.<br><img src="/web/20191007122657im_/http://www.typophile.com/sites/default/files/old-images/03-stadtmitte_DINbutS_3625.jpg"></p>
    <p>Stadtmitte 2: This looks like Frutiger, but the 'i' is wrong.<br><img src="/web/20191007122657im_/http://www.typophile.com/sites/default/files/old-images/04-stadtmitte_frutbuti_5456.jpg"></p>
    <p>Stadtmitte 3: I don't know this one.<br><img src="/web/20191007122657im_/http://www.typophile.com/sites/default/files/old-images/05-stadtmitte_5070.jpg"></p>
    <p>Unter den Linden 1: This Helvetica Bold is a crime when you consider they've got the one below elsewhere at the station. :-)<br><img src="/web/20191007122657im_/http://www.typophile.com/sites/default/files/old-images/06-unter_helvbold_5729.jpg"></p>
    <p>Unter den Linden 2: This is my absolute favourite.<br><img src="/web/20191007122657im_/http://www.typophile.com/sites/default/files/old-images/07-unterdenlinden_3669.jpg"></p>
    <p>Potsdamerplatz 1: Don't know.<br><img src="/web/20191007122657im_/http://www.typophile.com/sites/default/files/old-images/08-potsdamerplatz_4938.jpg"></p>
    <p>Potsdamerplatz 2: Don't know.<br><img src="/web/20191007122657im_/http://www.typophile.com/sites/default/files/old-images/09-potsdamerplatz_6145.jpg"></p>
    <p>Hallesches Tor: Don't know.<br><img src="/web/20191007122657im_/http://www.typophile.com/sites/default/files/old-images/10-halleschestor_4928.jpg"></p>
    <p>Hansaplatz: This blurry one looks like Interstate Regular Condensed.<br><img src="/web/20191007122657im_/http://www.typophile.com/sites/default/files/old-images/11-hansa_IntRegCnd_4693.jpg"></p>
    <p>Nollendorfplatz: Don't know.<br><img src="/web/20191007122657im_/http://www.typophile.com/sites/default/files/old-images/12-nollendorfplatz_3473.jpg"></p>
    <p>Zoologischer Garten: And finally, I can't work out if this is Univers or Zurich.<br><img src="/web/20191007122657im_/http://www.typophile.com/sites/default/files/old-images/13-zoologischer_univ-zuri_3889.jpg"></p>
    <p>Thanks a lot.</p>
