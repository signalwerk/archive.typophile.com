    html: <p>Craig, you’ll have better luck in the future if you post this kind of request in the Type Idenﬁcation Board, and if you upload a sample. <br><br>Anyway, if this is the face you’re referring to,  <br><br><img src="http://www.typophile.com/forums/messages/30/48046.jpg" alt="subaru.jpg"><br><br>then it’s an extended weight of Eurostile (or Microgramma, as it was originally called when it was ﬁrst released as an all caps face in the 50s). <br><br><a href="http://www.myfonts.com/fonts/urw/eurostile/t-black-extended/testdrive.html?s=SUBARU+MODELS+OWNERS&amp;p=24" target="_blank">http://www.myfonts.com/fonts/urw/eurostile/t-black-extended/testdrive.html?s<span class="caps">=SUBARU</span>+<span class="caps">MODELS</span>+<span class="caps">OWNERS</span>&amp;p=24</a></p>
