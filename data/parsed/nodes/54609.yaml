    <div class="info">Submitted by <a href="/user/15263" title="View user profile.">Nick Sherman</a> : 9.Feb.2009 10.05pm </div>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/WhatTheFont_for_iPhone_5646.jpg"></div><p></p>
    <p>It is with great delight that MyFonts introduces WhatTheFont for iPhone! Those of you who have already used the existing web-based version of WhatTheFont will be familiar with the general concept: upload an image of a font in use and WhatTheFont will identify which font it is.</p>
    <p>With the iPhone version of WhatTheFont you can use the phone's built-in camera to photograph the text in question (or choose an existing image from your photo albums). The app allows you to crop the image, focusing on only the important parts before uploading. After confirming which characters are used in the image, the app provides a list of possible matching fonts. You can then either e-mail a link to a MyFonts page with more info on that font, or open it up in the iPhone's built-in Safari web browser.</p>
    <p>And best of all, the app is free!</p>
    <p>For more info, check out MyFonts' official <a href="http://www.myfonts.com/WhatTheFont/iPhone/">WhatTheFont for iPhone page</a>, or just <a href="http://itunes.apple.com/WebObjects/MZStore.woa/wa/viewSoftware?id=304304134&amp;mt=8">download it from the iTunes Store</a>.</p>
    <p>Also keep an eye on the <a href="http://blog.myfonts.com">MyFonts blog</a> for future tips and upgrade info.</p>
