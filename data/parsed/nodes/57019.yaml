  html: |-
    <p>When I type (copy/paste) same text in CorelDraw (x4), Illustrator (CS4) and MS Word (2007) in font I created in FontLab, every program shows me different kerning.</p>
    <p>- Illustrator shows everything alright... kerning and leading, it's like in FL.<br>
    - CorelDraw shows unlogical kerning... space between glyphs are more wider then in FL or Illustrator. Some glyphs are overlapping too...<br>
    - Word shows no text, just glyph for ".notdef" for every letter typed!</p>
    <p>I've read <a class="freelinking external" href="http://typophile.com/node/15458" rel="nofollow">this topic</a>, and I've tried to add autohinting to font just to see will it make any difference, but everything remained the same. </p>
    <p>Any suggestion/solution?</p>
