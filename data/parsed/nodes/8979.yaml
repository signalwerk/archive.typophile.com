  html: <p>Dear Typophiles, <br> <br>I have the question, which is caused by a deficiency in the information maybe. It is about Stem hint programming in Type one font files and hint replacement program. <br> <br>As hint-substitution points and first node of contour are connected (I mean FontLab realisation)? Is there whether sense to focus attention on beginning of each counter of my letter when I work with overlapping zones? <br> <br>Of course there is some information in FL Manual (p. 493) but I see that when I change position of first node the hint replacement algoritm changes HR points too. <br> <br>How it works? Possibly, the "Black Book" will give the answer, but thus I could not find it. <br> <br>Sorry for my terrible English (I propose the abbreviation "sfte").</p>
  html_clean: <p>Dear Typophiles, <br> <br>I have the question, which is caused by a deficiency in the information maybe. It is about Stem hint programming in Type one font files and hint replacement program. <br> <br>As hint-substitution points and first node of contour are connected (I mean FontLab realisation)? Is there whether sense to focus attention on beginning of each counter of my letter when I work with overlapping zones? <br> <br>Of course there is some information in FL Manual (p. 493) but I see that when I change position of first node the hint replacement algoritm changes HR points too. <br> <br>How it works? Possibly, the "Black Book" will give the answer, but thus I could not find it. <br> <br>Sorry for my terrible English (I propose the abbreviation "sfte").</p>
