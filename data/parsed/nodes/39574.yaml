      <p>I would suggest Utopia that matches well the magazine subject and also has larger x-height. However, I did not test it in reality for legibility issues compared to Times.</p>
      <p>You could also try Times Seven<br>
      <a href="http://www.fonts.com/findfonts/detail.htm?pid=205579&amp;grab_id=0&amp;page_id=40489&amp;query=times%20seven&amp;SCOPE=Fonts" title="http://www.fonts.com/findfonts/detail.htm?pid=205579&amp;grab_id=0&amp;page_id=40489&amp;query=times%20seven&amp;SCOPE=Fonts">http://www.fonts.com/findfonts/detail.htm?pid=205579&amp;grab_id=0&amp;page_id=4...</a><br>
      that is more robust for small sizes, so you would not actually change the typeface that much while improving legibility.</p>
