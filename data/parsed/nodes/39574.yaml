  html: |-
    <p>I volunteer for a small organisation which publishes a magazine giving a socio-political analysis of current events.  The magazine is aimed at the general public, but many of our long-term subscribers are becoming older and visually impaired, and are complaining that the text is hard to read.  We don’t want to increase the font size to the point where our typography stands out like a sore thumb as that will turn off new and casual readers, so perhaps we could change the typeface to something more legible?  The body text currently looks to be 9.5 pt Times New Roman (clichéd, I know).  I hear that studies have shown that Century Schoolbook is more legible to young readers; would it also be more legible to older or visually impaired ones?</p>
