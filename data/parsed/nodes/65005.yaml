      <p></p><div class="imageWrap"><img src="http://typophile.com/files/image_6558.jpg"></div><p></p>
      <p>I will consider the redesign without an existing font and I'll let the shapes, colorful palettes.</p>
      <p>The quote from the article I posted previously "The decision to develop the project into the identity for a “panadería” became obvious when the students started buying and eating bread as part of their daily routine while in Mexico."</p>
      <p>This is also true for migrants in the area I reside. Buying bread as a daily routine is accustomed in their country of origin and when it became available [just within the last 5 years] it was evident the tradition was not lost and their routine would not have to take a plunge. The desired customers definitely love their morning [and evening] bread with hot chocolate or other traditional beverage.<br>
      The foreseen bakery is small [not fancy] but its attempt it to stand out from the other established bakeries [ a few in other townships but none in the township it will be established], but the goal is not to step over the boundary and over the customers comfort zone. The migrants are costumed to simple [decor] and anything [logo identity] that resembles their small town hand lettered signs and bright colours. The focus is not on the fancy or strange. The main goal is between the cross breed between a small coffee shop feel with a "panaderia". The more home-town feel the better while keeping it well designed.</p>
      <p>And as I write this and see my previous design, I now think, If I was one of those customers, I would not walk in there to buy my morning [evening] bread :)</p>
      <p>thank everyone, i will work on a redesign and post for comment.</p>
    html_clean: |-
      <p></p><div class="imageWrap"><img src="/files/image_6558.jpg"></div><p></p>
      <p>I will consider the redesign without an existing font and I'll let the shapes, colorful palettes.</p>
      <p>The quote from the article I posted previously "The decision to develop the project into the identity for a “panadería” became obvious when the students started buying and eating bread as part of their daily routine while in Mexico."</p>
      <p>This is also true for migrants in the area I reside. Buying bread as a daily routine is accustomed in their country of origin and when it became available [just within the last 5 years] it was evident the tradition was not lost and their routine would not have to take a plunge. The desired customers definitely love their morning [and evening] bread with hot chocolate or other traditional beverage.<br>
      The foreseen bakery is small [not fancy] but its attempt it to stand out from the other established bakeries [ a few in other townships but none in the township it will be established], but the goal is not to step over the boundary and over the customers comfort zone. The migrants are costumed to simple [decor] and anything [logo identity] that resembles their small town hand lettered signs and bright colours. The focus is not on the fancy or strange. The main goal is between the cross breed between a small coffee shop feel with a "panaderia". The more home-town feel the better while keeping it well designed.</p>
      <p>And as I write this and see my previous design, I now think, If I was one of those customers, I would not walk in there to buy my morning [evening] bread :)</p>
      <p>thank everyone, i will work on a redesign and post for comment.</p>
