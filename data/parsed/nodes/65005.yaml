      <p><cite>"It is not an upmarket bakery"</cite><br>
      Then I think you need to open up your search again. It's not just the handwritten thing that looks posh, you've got it all: centered alignment, a star in gold!, classy serifed, tracked-out all-caps. And that gradient. It does look good, just potentially too high-class. –&nbsp;Motter Corpus is a good suggestion in terms of earthiness / puffiness I think; find a font that smells like fresh baked country bread. :-)</p>
      <p>Also: If you have the word "Bakery" in 2 languages, you may want to set those so that the 2 words also look like they have the same function. This way it looks like "Bakery" is the "subline", but "Panaderia" looks like, dunno, the signature of the founder or something.</p>
