      <p>I think it's pretty clear that mobile devices (smart phones, iPads, etc) are rapidly increasing in popularity, especially with younger users, and within a few years the majority of computing will be done on them, with desktop computers used mostly for more heavy-duty tasks that require a mouse and physical keyboard.</p>
      <p>To paraphrase Steve Jobs, desktop computers are like trucks and mobile devices are like cars. Some folks need trucks, but most folks will prefer to drive cars. </p>
      <p>Personally I don't like reading or writing anything lengthy on my phone, but I know some younger folks who are typing on them constantly.  However I do find myself using my iPad more and more.</p>
