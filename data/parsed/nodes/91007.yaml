  html: |-
    <p>Change is hard.</p>
    <p>But the Flash home page had to go. We all knew it was way past its prime. </p>
    <p>This temporary Typophile theme you're seeing now puts us back at our roots, in a way. Since 2000, Typophile has been a vibrant community focused around these very forums. It's a community built around a love for the craft of typography and design, and these forums have been home to hundreds of thousands of conversations around type. </p>
    <p>Don't worry, this is not the new permanent look for Typophile. It's merely a temporary state while we tighten up a new look for Typophile. Removing the Flash is the first big necessary step toward correcting a number of other bugs (file upload, anyone?) that have been plaguing us. Rather than take the site down while we get things squared away, we opted to keep it up so you can talk type while we're heads-down on the new Typophile.</p>
    <p>Yes, we know the theme is not perfect. Go easy, make constructive suggestions and we'll make CSS tweaks as we go.</p>
    <p>Most of all, get involved!</p>
  html_clean: |-
