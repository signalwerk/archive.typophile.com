    html: <p>On Chris's comment. I think a few things have happened. One is that a lot of typographic discussion has moved to twitter. The other is that because there are now circles associated with Reading and KABK, and it seems like they are interacting in other ways. KABK are taking up a lot of 'new blood' who would have enlivened typophile, but they are now using twitter a lot. How to be welcoming to new designers, and how to relate to twitter are things worth thinking about, to keep Typophile vital. I love Typophile. It has its ups and downs, but I think the changed educational situation and social media situation is worth thinking about.</p>
