    html: |-
      <p>What bothers me most about the drifting of Typophile in to "Typonotsomuch" is the content.  Sure, there was always some "what is your favorite" and "do my homework for me" threads, but today, it is rare to see a thread with content that you actually wanted to read.  I am not talking about the reality TV pisßing matches that were too plentiful for me.  I am talking about real discussions that used to happen.  There was plenty of good material in "Build" but now it looks more like "foreclosure" than build.<br>
      It seems as though everyone in the industry from the most renowned type designer or executive to the young, beaming-with- zeal, ernest neophyte was posting here.  Now, it seems as though many of these people have either been annoyed enough to leave or got just plain fed up with the nothingness and just moved on.<br>
      I also have concerns about hints of possible censorship but will not go into detail here because it would be unfair to all parties.<br>
      Yes, the spam protection is sorely lacking, the upload of files is maddening, the Flash screw-ups are annoying, but.  The main thing is that content and meaningful dialogue have diminished markedly.  Is this a case of Typophile just running its course and achieving entropy or is it something that can be fixed?  I don't know.  There was a good run there for several years. Was that just by chance or were we all doing something different then?<br>
      Nowadays, the hosts don't even show up for the party.  What has caused the circle of stalwart and gifted forum moderators to fade into the distance? Typophile used to be a fine Espresso made by real people and now it is yesterday's Instant Sanka reheated by automation.</p>
