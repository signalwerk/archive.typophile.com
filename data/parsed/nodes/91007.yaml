    html: <p>Twitter is not really a discussion place, though.  The question is, what caused the migration to Twitter, Facebook, etc.?  Yes, there are now other options but they each have their drawbacks. Competition works when the competitors offer a better solution.  Twitter is not a better solution, it is a different path. Twitter works best when you already know the others you interact with so it is more closed circle.  Typophile used to be an open circle with fuzzy borders that was somehow inviting.  Something may have happened to put the "don't bother" signs up at all perimeter points?</p>
