      <p>To put this in perspective for new users: Typophile has been around a while, and the last few years the number of bugs have grown steadily while Punchcut have seemingly "forgot" all about running and maintaining the site.  The lack of moderating coupled with the recent type hype have resulted in a lot of spam, a lot of"do my homework" traffic and a lot of derailed conversations.  Many of the true professionals have left Typophile, which is apparent in the critique forum where amateurs voice their opinion loudy, no-one sets them straight and newcomers follow blindly.  As a result, Typeboard -- the small seed of what may become a new and better forum (?) -- was launched just a few days ago. </p>
      <p>And now this new initative from Typophile. Should we understand this as a response to the competition? Have the financial situation suddenly changed? Who will be in charge? Do you have a serious plan now?</p>
