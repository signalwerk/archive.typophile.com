      myself against personal attacks that boil over from disagreements that<br>
      involve the craft, or the nature of Typophile itself. For better or worse,<br>
      I only get emotional when it comes to true friends and close family, and<br>
      I don't see Typophile as a sort of social grounds for people to either<br>
      prove themselves or leave in a fit. To me, it's about content.</p>
      <p>That said, this might be a good opportunity to bring<br>
