    html: |-
      <p>I'm in agreement with Frode. This site used to be really buzzing with interesting professional interactions. With no moderators (removing spam is not moderation), this site has become a place for egos to misbehave. I also see considerably fewer women participating these days. The recent antagonistic threads will only put off new members — a lot of the Reading people I talk to now are completely put off visiting the site at all, despite knowing there's a vast amount of useful content here — and will make sponsors very unlikely to be interested in supporting the site.</p>
      <p>I'm not switching to TypeBoard, as I strongly disagree with the principle of excluding people with different ideas; closing your ears to others doesn't validate your opinions. Following on from what Nina said over on TypeBoard, it's really not about who has worked in this industry for longest, it's about treating each other with humility, listening and encouraging the sparks of collaboration that lead to fresh thinking.</p>
      <p>Thank goodness something's happening here finally. I'd hate to see this site simply get archived. Good luck to Punchcut in sorting it all out.</p>
