      <p><cite> &gt; One is that a lot of typographic discussion has moved to twitter. </cite> </p>
      <p>Hmm. I am not on Twitter, but I would not have thought that it made a suitable environment for real discussion.</p>
      <p><cite> &gt; Is this a case of Typophile just running its course and achieving entropy </cite></p>
      <p>Call me a cynic, or perhaps a fatalist, but I wonder if this isn’t perhaps the case. Nothing lasts forever; and in my experience, ten years for this sort of thing is about par for the course. I’ve seen my share of similar communities/gatherings come and go in my lifetime.</p>
      <p>I, too, miss the old days — the heyday of Typophile — and I would welcome them back again. But I also recognize that I am not the same as I was then. My interest is not piqued by as many topics, and I find myself less interested or willing to spend the time I once did in earnest discussion, explanation, or debate. </p>
      <p>Perhaps it is the greater proportion of inanity or the cyclic rehash of the perennial topics.</p>
      <p>On the other hand, who knows? Perhaps the cycle has hit bottom and quality will rise again. Perhaps even just this meta conversation will turn a tide.</p>
