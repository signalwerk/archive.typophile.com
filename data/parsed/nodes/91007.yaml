      <p>Actually, I think I might have just figured out the culprit. I believe that this behavior only happens on threads with attachments. And I believe the culprit is the "sticky-enabled" class that is written on the table that presents any attachments. The class itself doesn’t seem to have rules in the CSS, but it is triggering some Javascript which then rewrites an invisible "sticky-header" table, which forces the pageload back to the top.</p>
      <p>I believe that the "sticky-enabled" class is a mistake and shouldn’t be enabled by default on those threads.</p>
      <p>I’ll write to Jared and have him investigate the template.</p>
