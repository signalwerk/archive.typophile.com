      <p>&gt; I strongly disagree with the principle of excluding people with different ideas</p>
      <p>I’d say this is not what the initiators of Typeboard intend to achieve: excluding people of different ideas. I am rather under the impression that they try to establish a certain standard of communication and behaviour. Which aim I can’t blame at first hand, though delicate it may seem. I’m a bit sceptic but rather curious about that model. There’s no reason to talk in hostility against it.<br>
      There are problems on this site we all know about, for a rather long time. Now someone tries to get over it, well, respect. There may be an alternative or not. There may evolve competition or not. However, things will not remain in status quo forever. “Change is hard” - oh yes.</p>
      <p>The whole business gives me to think about “community–communication–common sense”.<br>
      Maybe, a club is a kind of community too. If some people like to go clubbing, why shouldn’t they? They’re unlikely to harm others by this.</p>
