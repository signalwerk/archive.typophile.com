      <p>Actually I'm not sure that it would be. Does anyone know how many new accounts are set up per day?  If there are, say, 4 new accounts one day that make a 1st post, and a moderator takes 15 seconds to glance at each and click an "approved" button, then it takes 1 minute.</p>
      <p>If a 1st post is spam and the account needs to be deleted, then no more time is spent than it takes under the current system to delete a spam account.</p>
      <p>(This assumes that the software is set up to present a moderator with a list of 1st posts from new accounts that need to be approved, so that he/she can review them efficiently.)</p>
      <p>&gt; And you might be surprised at how many spam accounts already<br>
      &gt; post seemingly innocuous comments initially</p>
      <p>OK. I'm not saying the system would be perfect, but I think it would weed out a lot of the spam.</p>
      <p>Just a thought. I know it's unlikely to be tried.</p>
