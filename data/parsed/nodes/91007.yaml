      <p>It's easy to lose perspective of how awesome this forum is when you've constantly participated over a long period of time. But, what keeps things fresh are the young bloods and vibrant debates.</p>
      <p>I was a moderator of a chess community - and believe me guys like Hrant pale in comparison to ego driven competitive chess players (no offense Hrant) - what we did is a slow sterilization and began to ignore the new bloods ever active noob questions. Sooner rather than later we ended up with whole chunks of blocked IPs, a sterile aging environment, no new bloods, and after almost a decade of coolio discussions it dyed.</p>
      <p>Typophile can always be fresh - if you want it to be. Dynamic, heated, and dissenting view points can always give colour to an environment. New bloods questions are a sign that this forum matters.</p>
      <p>To me,  Life is a vibrant dirty journey ...questioning your purpose is always beneficial.</p>
      <p>imho of course</p>
