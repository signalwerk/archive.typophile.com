    html: <p>Since the beginning of word processing, I have always been driven mad by the use of hard returns.  In those days, people were used to the typewriter where a carriage return, multiple tabs or spaces all had the same effect.  It was printed on paper and then re-typed by a type house so what the customer did formatting meant little.  Along comes the transition to electronically captured word processing being sent via tape or disk to the type house which then was bound to absorb the tedious labor of taking away all the problematic typing done by his clients.  Now comes the all-in-one process where the page layout person and type house are the same individual.  Even much worse, today comes the multiple device viewing of a single digital flow of text.  Bunches of browsers, bunches of hand-held devices, bunches of resolutions, bunches of default typefaces, different platforms and versions of the software, some subpixel rendering and some not, some greyscale and some not. The odds of what the enduser sees on his device looking exactly like it did on the original authors source device is quite slim.  The only prayer of workable shifts in devices is if everyone strictly avoids hard returns or multiple tabs or spaces to push a line break that only looks good on their screen.  The end user at least knows where a paragraph ends.  This is one heck of a lot better than trying to mind read the original author or guess what system they used to write the darn thing.  What you may think you are fixing for 2% of your readers, you are totally fuchking up for 98% of your readers.</p>
