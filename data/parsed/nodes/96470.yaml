      <p>The dotted circle is U+25CC.</p>
      <p>I'm not sure what you mean by asking if I agree with this approach? This is normal Devanagari shaping, according to script rules, but in practice it is very unusual to have even a RR conjunct, let alone RRR. Most commonly, the repha key, i.e. the shift+4 on your keyboard, which inputs Ra + halant, would be followed by another letter.</p>
