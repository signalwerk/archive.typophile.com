    html: |-
      <p>Have you read up on the special treatment of the letter Ra in Devanagari conjuncts?</p>
      <p>The sequence र् (R with killed vowel) at the beginning of a conjunct is always rendered as the repha form, i.e. the little hook above the last letter of the conjunct. So when you enter the sequence twice you get र्र्, which is the conjunct RR with killed vowel.</p>
      <p>When the sequence virama+Ra occurs following another letter in a conjunct, it takes the rakar form, which is either the little hat below the letter as in this case, or a stroke merged with the full form of the letter. So when you enter the sequence three times you get र्र्र्, which is the conjunct RRR with killed vowel. The first R is displayed as the repha, the second R is displayed as a full form, the third R is displayed as the rakar form. The explicit halant (virama) always indicates that the final vowel is killed.</p>
      <p>None of these are 'invalid glyphs' (indeed, they're not glyphs per se, but combinations of glyphs) in the writing system, although I believe RRR is probably not found in actual languages. RR may be.</p>
