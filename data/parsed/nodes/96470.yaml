      <p>John</p>
      <p>Thanks for calling my attention to the treatment of the letter र in conjuncts. I haven't had the time to read this subject yet. The amount of information that I'm processing in the last few days is just mind-boggling.<br>
      But after carefully studying the subject presented in <a class="freelinking external" href="http://www.unicode.org/versions/Unicode6.0.0/ch09.pdf" rel="nofollow">Chapter 9 : South Asian Scripts - I</a> published by the Unicode Consortium, I think I finally understood what's going on here. I'll just repeat below the steps I used to achieve the results obtained by the shaping engine, using the rules stated in the referenced<br>
      document :</p>
      <p>According to the Rule R2 in page 275 of the document we have : र् + र् = र्र् . Now applying rule R8 in page 277 we get : </p><div class="imageWrap"><img src="http://typophile.com/files/Consonant RA_5122.png"></div><p></p>
      <p>I had to use the image above, for I couldn't figure out how to print the cincunflex under the dotted circle. BTW, is there a way of printing on this editor a Unicode point, as one does in MS Word, i.e., by typing the Unicode character code followed by Alt + x ?</p>
      <p>The final glyph, although not very clear, should stand for र्र्र्, i.e., Shift + 4 applied 3 times.</p>
      <p>Do you agree with this approach ?</p>
