    <p>Using the Hindi keyboard and typing the following sequence of keystrokes below I get :</p>
    <p>Shift + 4         र्<br>
    Shift + 4         र्र्<br>
    Shift + 4         र्र्र्<br>
    Backspace     र्र्र<br>
    Backspace     र्र्<br>
    Backspace     र्र<br>
    Backspace     र्<br>
    Backspace     र<br>
    Backspace</p>
    <p>This is the way I understand what is occurring above :</p>
    <ol>
    <li>The key Shift + 4 inputs at once the Hindi character र (j) combined with the virama diacritics ् (d). In fact, if one types these two characters in sequence, with the Hindi keyboard, one gets the character र्.</li>
    <li>Therefore when I type the second combination Shift + 4, I get first, the combination of the glyph र् with the character र, which results in र्र (this doesn't seem to be a valid glyph in devanagari), which is followed by the combination of   र्र with the virama, resulting in र्र् (again possibly another invalid glyph), which equals the second glyph obtained above.
    </li>
    <li> Continuing with the exercise we get first र्र्र and finally  र्र्र् which equals the third glyph obtained in the diagram above.</li>
    <li>Now if we type the 6 Backspace keys in sequence, we should obtain the remaining glyphs shown above.</li></ol>
    <p>Question : Why the shaping engine allows the rendering of those extraneous glyphs, instead of simply rendering र् र्, for the keys (Shift + 4)(Shift + 4) and  र् र् र् for the keys (Shift + 4)(Shift + 4)(Shift + 4)  ?</p>
