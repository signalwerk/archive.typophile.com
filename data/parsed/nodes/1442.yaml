    html: <p>Just as the Confederate 'Stars and Bars' flag is still offensive to African Americans as a symbol of slavery, the Nazi flag, with its central swastika will always be offensive Jews as the symbol of a regime that chose to murder nearly half of the Jewish population in the world simply for being Jewish. <br> <br>Of course, within the context of a Hindu temple (where I believe the symbol is not in a circle and normally 'rotates' other way) it is ancient and not offensive. <br> <br>In the West the Nazi swastika is kept alive not by Jews. I have never seen it in any Jewish literature, excepting that on the history of the Nazi period. Where you do see it is with those hate groups who like the Nazis, and in Arab political cartoons - where it is regularly pasted on Israeli leaders and the Israeli flag. I don't think they mean it as a compliment. <br> <br>The infamy of the Nazi period tarred the swastika for at least a hundred years. Those who use it in the West offend Jews, and know it and don't care.   <br> <br>Fraktur is a different matter. I agree that it is not rational (though understandable) to identify it with the Nazis, and it should not be taboo.  <br> <br>As to brutal symbolism, I don't like it, but it is not an identifying mark of Naziism like the swastika.  <br> <br>I dislike brutal symbolism for the same reason I dislike speech filled with anger. It undermines peace and love. </p>
