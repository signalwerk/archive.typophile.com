    html: <p>Hrant, <br> <br>"Brian, Disneyland uses blackletter. But apparently good ol' Walt was white supremacist anyway."  <br>.... <br> <br>Probably a case could be made easily supporting that. I have heard Walt hated children. But then some don't think much of us "old people". <br> <br>Hrant, I am teasing! <br> <br>But, <br>..... <br>German Fraktur type (as opposed to other medieval gothics, such as Old English) still evokes iron-fisted authority. The words ULT!, VERBOTEN!,and JUDE! are frightening when spelled out in these letterforms. Actually, anything set in Fraktur, even the most harmless words and phrases, takes on a decidedly ominous look. <br>....... <br> <br>The words ULT!, VERBOTEN!,and JUDE! <br> <br>Well, if you look at these words they don't look overly pleasant in Sans Serif either!???? <br> <br>His opinion, his problem. <br> <br>Usage outstrips form. Earlier I mention propaganda. Later about that! For me Fraktur has nothing evil embodied in the forms themselves. Many words are ugly no matter what the type face. <br> <br>Especially, cough cough, in bolds. <br> <br>"Heller" for instance "evokes" something that could be ugly in itself. It does not have a Polly Anna look to it. <br> <br>For instance, HELL, HELLER and HELLIST. Think about it? <br> <br>By the way, when you have multiple Zerox copies, are they called Zeroxies, or Zeroxen? <br> <br>I suppose it is always easiest to blame the medium rather than the messenger. I remember my great distaste for "Pastonchi", not the "nuts", the "type face". Thought it was a "Bread Truck Typeface". Then Dave Farey sent me a copy of a book set in the face, one word, "beautiful". I have like bread trucks ever since! Not many around these days? <br> <br>Fraktur has thorniness in form. I am surrounded by it in Finnish bookstores. Thorns are certainly a respectable fence. My past life gave me a great deal of time gardening. Most thorns evoke in me a sense of raspberries, blackberries and even the "lonely rose has thorns". <br> <br>Gardening, bread trucks and typography, there you have it. <br> <br>Gerald Giampa <br>Lanston Type Company</p>
