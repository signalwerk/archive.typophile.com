    html: <p>William, <br>"Just as the Confederate 'Stars and Bars' flag is still offensive to African Americans as a symbol of slavery, the Nazi flag, with its central swastika will always be offensive Jews as the symbol of a regime that chose to murder nearly half of the Jewish population in the world simply for being Jewish. " <br>....... <br> <br>You have a good heart. I know that. You do, I see it in your writings. <br> <br>Naturally you are aware that many American blacks find Jews offensive because of their systematic participation in the slave trade? We have not stopped eating bagels though have we? <br> <br>Further more what happened to the North American Indian? But we have not given them back their land, have we? Oh, land, but, but, that's much more than a symbol? <br> <br>Few people are aware of how many Indians lived in America when the white man came. Few know that the white man used biological warfare on them. And some democracy! I am not sure when the Indians were even allowed to vote. In Canada it was the fifties. Possibly the Canadian Indians got to vote earlier than the American Indians. <br> <br>Anyway, how many Indians do you figure there were? Lots! Far more than half of them were killed. So lets not talk so much of symbols. They are not evil. Mankind is evil. Lets get back to the Palestinians, or the Jewish "state". Heller seems to have much time on his hands. He should do something constructive such as identifying good from evil. The Palistinian question is a short study. But if he simply does not like Germans he should just come out and say so. <br> <br>Maybe he is a racist, anyone asked? <br> <br>Furthermore the Swastika has great meaning to other cultures. Also it has great meaning to the European cultures. I am not so sure that it should be "swept under the table". It is offensive to many and it should be. But symbols don't kill people, people kill people. So given Heller's logic we should get rid of people.  <br> <br>Those are the issues that should be dealt with, as Henry Kissinger states, the "National Psychiatric of Cultures". The swastika should remain hanging in every household as a reminder of how terrible man is to each other. Frankly, I do not think things should be forgotten in 100 years, if ever. <br> <br>Furthermore, most of those illustrations, particularly the first set that Matha exhibited are indeed just plain ugly. They are offensive just because they are. Ugly! <br> <br>But I could design a swastika that is beautiful and meant as such. Not only that but I would have spiritual justification for doing so. I could also print a beautiful book in Fraktur. <br> <br> <br> <br> <br>Gerald Giampa <br> <br></p>
