  html: "<p>David, <br> <br>I've started a new thread on this subject so I can't be accused of hijacking someone else's. <br> <br>Now that I've thought about it for a whole day and looked over all the Heller texts I have hanging around at home, I can rationalise my feelings to a certain extent. <br> <br>In a nutshell, then, I don't like it when a prolific and respected writer abuses his or her position and disseminates their own prejudices/political agenda disguised as critical writing. <br> <br>This extract from Heller's <i><b>Designing Hate: Is There a Graphic Language of Vile Emotion</b></i> takes the biscuit as far as I'm concerned: <br> <br><i>German Fraktur type (as opposed to other medieval gothics, such as Old English) still evokes iron-fisted authority. The words ULT!, VERBOTEN!, and JUDE! are frightening when spelled out in these letterforms. Actually, anything set in Fraktur, even the most harmless words and phrases, takes on a decidedly ominous look.</i> <br> <br>I'm sorry, but this is pure propaganda. He should be ashamed of himself for publishing it. Or maybe the publisher should be ashamed.  <br> <br>Anyway, this sort of thing coupled with the tripe in his Swastika book have most definitely turned me off his work.  <br> <br>Matha</p>"
  html_clean: "<p>David, <br> <br>I've started a new thread on this subject so I can't be accused of hijacking someone else's. <br> <br>Now that I've thought about it for a whole day and looked over all the Heller texts I have hanging around at home, I can rationalise my feelings to a certain extent. <br> <br>In a nutshell, then, I don't like it when a prolific and respected writer abuses his or her position and disseminates their own prejudices/political agenda disguised as critical writing. <br> <br>This extract from Heller's <i><b>Designing Hate: Is There a Graphic Language of Vile Emotion</b></i> takes the biscuit as far as I'm concerned: <br> <br><i>German Fraktur type (as opposed to other medieval gothics, such as Old English) still evokes iron-fisted authority. The words ULT!, VERBOTEN!, and JUDE! are frightening when spelled out in these letterforms. Actually, anything set in Fraktur, even the most harmless words and phrases, takes on a decidedly ominous look.</i> <br> <br>I'm sorry, but this is pure propaganda. He should be ashamed of himself for publishing it. Or maybe the publisher should be ashamed.  <br> <br>Anyway, this sort of thing coupled with the tripe in his Swastika book have most definitely turned me off his work.  <br> <br>Matha</p>"
