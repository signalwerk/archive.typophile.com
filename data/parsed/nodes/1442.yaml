    html: "<p>Heller, the person, overall: I think he's more of an asset than a liability. <br> <br>But - big but: <br> <br>&gt; Have you ever heard of jewish (yes, Heller is <br>&gt; jewish, so am I) people making propagandist <br>&gt; statements of the swastika? <br> <br>All the time. And for very good reason: it's a superb graphic symbol of the Enemy, hence very useful to keep reminding people to be nice to the [erstwhile] Victim. <br> <br>I wish the Turks had such a symbol that we Armenians could use. It can even be argued (based on speeches Hitler made) that the Holocaust wouldn't have happened if we Armenians had such an  enemy symbol available and had used it as effectively as the Jews use the Swastika. On the other hand, media wasn't nearly as good as brainwashing and manipulation as it is now. <br> <br>So in a way I understand the Jewish desire to keep it Evil, but I can't stand the duplicity necessary in applying it (even though it's part and parcel of such propaganda), I guess because Jews aren't the underdogs any more. Now they have an underdog, who I guess are in turn lucky to have the Star of David as a symbol with as much potential as the Swastika!  :-/ <br> <br>But what really riles me up the most isn't the Swastika treatment, it's the blackletter blacklisting. It is a violation of venerable typographic culture to subjugate blackletter to the Jewish cause (no matter if you think the cause is just or not) the way is done with the Swastika. Leave blackletter alone, so that it may flourish again. <br> <br>&gt; To me it just takes big balls to tackle <br>&gt; such a project and face the consequences. <br> <br>What the hell are the consequences when all you're doing is catering the existing power structure?! What would take balls is to publish a book saying the Swastika is socially maligned, that it needs to be give a new chance. <br> <br>Same with blackletter. <br><a href=\"http://www.typophile.com/forums/messages/4077/11682.html\" target=\"_blank\">http://www.typophile.com/forums/messages/4077/11682.html</a> <br> <br>hhp <br></p>"
