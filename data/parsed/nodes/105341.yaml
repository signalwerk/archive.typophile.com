    html: |-
      <p>There is no need for external photo editors, Find my Font contains an interactive perspective correction tool, especially for these cases (it's the tool marked with "ABC").<br>
      You hold down the shift key to move the 4 corners of the tool to appropriate position, check the "Fix Perspective" checkbox [x] and click on [OK] button - that's all.<br>
      You get a perspective-corrected copy of the selected image and you can then select the letters you wish as usual. See the image bellow:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/fmf-perspective_5437.jpg"></div><p></p>
