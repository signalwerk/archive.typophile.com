  html: <p>I'm working on a project for Artisan.  There primary typeface used in the logo is a slightly modified Trajan.  Im trying to come up with a san-serif face that would prove complimentary. This is for a website, so it would have to be somthing solid enough to holdup against anti-aliasing at smaller sizes. about 14-16 points will be the smallest sizes used.  if anyone has any thoughts they would be much welcomed. <br> <br>cheers. <br> <br> <br>hildebrant. <br></p>
