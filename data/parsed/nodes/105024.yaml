    date: 2013-07-30T10:00:00
    date_raw: 30 Jul 2013 — 10:00am
    votes: null
    html: <p>This seems really suspicious. The Palatino shown in the sample doesn't match the original metal cut. It matches the later phototype version of Palatino. The original had a smaller x-height/taller ascenders, the top of the /t/ was taller, and the /g/ was more squat. The /6/ and /8/ also match the phototype version, but not the metal version. I'm not sure exactly when the revised phototype version of Palatino was released, but it was not before the sixties, more like the seventies as far as I can recall.</p>
    html_clean: <p>This seems really suspicious. The Palatino shown in the sample doesn't match the original metal cut. It matches the later phototype version of Palatino. The original had a smaller x-height/taller ascenders, the top of the /t/ was taller, and the /g/ was more squat. The /6/ and /8/ also match the phototype version, but not the metal version. I'm not sure exactly when the revised phototype version of Palatino was released, but it was not before the sixties, more like the seventies as far as I can recall.</p>
