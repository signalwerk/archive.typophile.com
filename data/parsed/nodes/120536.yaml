    html: <p>You said that you have used Storm’s <a href="http://www.stormtype.com/typeface-walbaum-120-pro.html" rel="nofollow">Walbaum 120</a>. I presume that you know that this is the display cut of the family (it takes its name from the approximate point size it is best used at; cf. <a href="http://www.stormtype.com/services/get_pdf.php?family_id=107" rel="nofollow">this PDF</a>). You might not know that there is also <a href="http://www.stormtype.com/typeface-walbaum-10-pro.html" rel="nofollow">Walbaum 10</a> for text (at around 10 point) and even <a href="http://www.stormtype.com/typeface-walbaum-10-xl-pro.html" rel="nofollow">Walbaum 10 XL</a> with increased x-height. I can recommend both. Have a look at them!</p>
