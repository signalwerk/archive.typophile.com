      <p>Indeed! Humbled as I was by your reply, Mr Shinn, you shouldn't have hidden your own light under the bushel. I'll take your Walburn anytime over Felice (even though the latter does have all the frivolity of the native Giorgio but without its uselessness in text). As for Kepler, Les, I'd be the biggest fan if it wasn't for the italics that, personally, I consider somewhat clumsy.<br>
      My shortlist right now would be Walburn, Felice, Didot HFJ (6pt/11pt) and maybe a neat digital Walbaum that I have yet to discover.</p>
