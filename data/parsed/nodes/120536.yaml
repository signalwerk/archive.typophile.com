    html: <p>Wow, that was quick! Cheers riccardo. I did consider ›subtly squared‹, as in Guardian Text or Parachute's Centro Slab. But even as, technically, those go rather well will Giorgio Sans, I found them to lack the ›je-ne-sais-quoi‹ factor I'm after, the one that comes with the more classic form language of the Caslons and Bodonis, especially when printed. (I hope I am making sense here.)</p>
