    <p></p><div class="imageWrap"><img src="/files/bplogo_wbground_5274.jpg"></div><p></p>
    <p>Hello,</p>
    <p>I would love some criticism on my personal logo design. I’m finishing school right now, so this would be going on business cards and stationary that I will be giving to potential employers in  the graphic design industry.</p>
    <p>I’m going for something simple and clean, but I also want it to be more masculine than feminine. I’m planning on using letterpress or an embossing for the final product on a fairly heavy stock. </p>
    <p>My name is Bekka Palmer, hence the bp. </p>
    <p>Any advice/criticism/comments would be greatly appreciated.</p>
    <p>Thanks<br>
    Bekka Palmer</p>
