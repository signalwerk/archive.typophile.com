      <p>@ Lex:</p>
      <p>Negative connotations aside, I think we can agree that symbol was effective.</p>
      <p>@ Bekka:</p>
      <p>First thought is beefing-up slightly the thin parts of your logo. They may get lost when you size them down for letterpress printing. Second, is there a reason for the cartwheeling logo? It does not say “clean and simple” IMO. What would it look like without the spinning? </p>
      <p>I think letterpress on heavy stock will be a great first impression—like a really firm handshake. Good luck out there!</p>
    html_clean: |-
