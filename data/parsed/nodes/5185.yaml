    html: "<p>Welcome to Typophile! <br>This design would have been a big hit... in the 90s.  :-/ <br>I wouldn't want to discourage you, and if it's something you're motivated to finish you should definitely do so - at the very least it would be a good learning exercise. Just know that many people will think \"there's another one\", even if it's actually unique in some way. <br> <br>Try this, if you like: figure out what you really like about Helvetica and Bodoni, and make a totally new font based on that. Make the forms not by literal splicing, but by... \"abstract synthesizing\"? <br> <br>BTW, that loaf on your site makes me hungry!  :-) <br> <br>hhp <br></p>"
