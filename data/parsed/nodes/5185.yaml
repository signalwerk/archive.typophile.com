    html: <p>Hrant--I know the concept behind this font is dated and could have been done in the '90's and I am in the process of doing just what you described. I am working on a new face that would blend the characteristics of a classic serif and modern sans serif font. I still think that a hybridized font still has it place in today's typography, even though this needs a lot of work. I want a versatile font that can hopefully add to some of my motion graphic work. Thanks for you response.</p>
