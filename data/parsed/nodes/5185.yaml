    html: <p>En el mundo tipografico existen mitos que te pueden sacar de apuros en momentos de respuestas rapidas. <br>Uno de esos mitos es que bodoni y helvetica se aman, las pongas, como sea siempre funcionan. <br> <br>creo que es un enriquecedor ejercicio tomar las dos y hacer un hibrido en la que ninguna tranza con su forma y encontramos una "heveticoni". No se como funcione impresa eso si. <br> <br>i think is very important, before you combine both families you must equal the x heights.  <br>if you work with the same x height, you must avoid the monster characters like the "s", the "g, "c", and "S".</p>
