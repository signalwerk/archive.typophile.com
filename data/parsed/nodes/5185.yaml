    html: "<p>Random thoughts from the padded cell: <br> <br>My very first reaction to your sample was<i> \"Why the funky serifs?\"</i>  <br> <br>After examining the letters a bit more, it seemed to me that there was no particular reason for <i>any</i> of the serifs to be where they are. Some of them don't even make any sense at all (uppercase <b>E </b>for instance). This may be fine for a headline in some trendy magazine but I would <i>hate</i>  having to read a full page of text set in this.  <br> <br>I'm sure you devoted some time formulating the underlying design-concept of this font but I'm sorry to say that it doesn't show up in this specimen at all. The first word that does come to mind here is <i>\"random\"</i> and that is never a good word in the context of a font (unless you are Erik van Blokland of course). <br> <br>That being said, I would ask you to carry on and refine your design, despite the slashing here. It wouldn't be fair if your very first effort became the next Univers, right?</p>"
