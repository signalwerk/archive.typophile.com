    html: <p>I agrre with Hrant. Nice work but dated. In some ways I miss the 90's and all the great experimental type design that was going on.  <br>I have wondered if this type of design still worth doing as commercial work, but when I am honest with myself I realize it must be extraordinary (in execution as well as concept) if it needs to sell., and still I doubt it can be successful. Your work is nice but not exceptional. Similar fonts have already been fused and I think you need to make this more unique if it is intended to make you money. For personal use who cares as long as you enjoy building it and learn from the experiment. Good luck. <br>To help you with any research check out Michael Worthington, Geoff Kaplan (Sucker), Stephen Farrell (Missive, Entrophy), Jonathan Barnbrook (Drone), Max Kisman (Fudoni). Rodney  <br>Fehsenfeld (Canadian Photographer) <br>Of all the hybrids out there I think the Frakture/Sans hybrids are the nicest.</p>
