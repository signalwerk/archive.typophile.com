    html: "<p>Chunky! <br>The \"G\" and \"S\" need work, but the rest is nice. I wouldn't mind a caps-only font, as long as you have alternates in the uppercase. I would put a curl in the \"E\", somehow - it's the most frequent letter (in English), and would spruce things up bigtime. <br> <br>Name: Blowsy. Dunno why. <br>Anyway, something that starts with a \"B\", for sure. <br> <br>hhp <br></p>"
