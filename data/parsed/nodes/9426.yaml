    <p><img src="http://www.typophile.com/forums/messages/29/6609.jpg" alt="jpg example"> <br> <br>Here's a preliminary UC set for a font I'm working on. Rather than include a lc, I may just supply a set of alternates. What does everyone think of this idea? What do you think of the font? Which glyphs need work? The goal was to create a sans based on extremely geometric forms, but that still retains some subtle allusions to the pen. <br> <br>And if anyone has any good ideas for a name for this face I would appreciate suggestions. <br> <br>karl. <br> <br></p>
