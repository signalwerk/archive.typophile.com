    html: <p>I find the S to be the hardest letterform to get right especially when it is part of a whole font (vs. a logo type)  I think you are on a good track with the new S, but perhaps it should be a tad more "open". <br>As for the font as a whole I think it is really nice reminds me of a hybrid between Licko's Dogma and M.V.B's Bovine. A small cap version would be a nice.</p>
