    date_raw: 15 Feb 2003 — 2:50pm
    votes: null
    html: "<p>I really dig this, Karl. <br> <br>Nothing inherrantly wrong with an uppercase-only font, but <br>keep in mind it may hurt sales if you plan to market it. The <br>base utility of a font is often the buyer's first concern. <br> <br>The glyphs that stand out in need of massaging are the 'G' <br>'J' and 'S'. But I'll let someone with more experience give you <br>some ideas on improving those. <br> <br>Names: Creme, Fat Poster, Augustus Gloop (in honor of the <br>rotund German <a href=\"http://www.preurbano.com/images/defaults/gloop.jpg\" target=\"_blank\">kid</a> from <a href=\"http://us.imdb.com/Credits?0067992\" target=\"_blank\">Willy Wonka</a> with the curl in his hair.)</p>"
    html_clean: "<p>I really dig this, Karl. <br> <br>Nothing inherrantly wrong with an uppercase-only font, but <br>keep in mind it may hurt sales if you plan to market it. The <br>base utility of a font is often the buyer's first concern. <br> <br>The glyphs that stand out in need of massaging are the 'G' <br>'J' and 'S'. But I'll let someone with more experience give you <br>some ideas on improving those. <br> <br>Names: Creme, Fat Poster, Augustus Gloop (in honor of the <br>rotund German <a href=\"http://www.preurbano.com/images/defaults/gloop.jpg\" target=\"_blank\" class=\"link-external\">kid</a> from <a href=\"http://us.imdb.com/Credits?0067992\" target=\"_blank\" class=\"link-external\">Willy Wonka</a> with the curl in his hair.)</p>"
