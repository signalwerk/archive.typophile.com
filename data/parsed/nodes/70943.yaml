  html: |-
    <p>Please enjoy this bunch of recently released quality fonts - all available at our usual low price of only $10 each! :)</p>
    <p>In this news release I present 9 fonts:<br>
    - 1 from Kimberly Geswein<br>
    - 1 from Paul Lloyd<br>
    - 1 from Brian Kent<br>
    - 1 from Nick Curtis<br>
    - 1 from Levente Halmos<br>
    - 3 by myself! ;)<br>
    - 1 from "Apostrophe" - and it's free!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CheapProFonts_NEWS_10_02_450_4758.jpg"></div><p></p>
    <p>Now there are over 100 fonts available on CheapProFonts, and many more are on the way! I have just started cooperation with another designer (Gyom Séguin/Last Soundtrack of Bleeding Cowboys fame ;) so soon there will be some more grungy and gritty fonts available, too.</p>
    <p>CheapProFonts is dedicated to supplying high-quality OpenType and TrueType fonts for setting "foreign" languages (languages requiring more than the basic A-Z characters) for professional Mac and Windows users.<br>
    Check our site for constant new releases, and see you in the next newsletter!</p>
    <p>Roger S. Nelsson<br>
    --<br>
    <a href="http://www.CheapProFonts.com" title="http://www.CheapProFonts.com">http://www.CheapProFonts.com</a><br>
    High quality multilingual fonts at a low price - for professional (non-english) designers with a small budget!</p>
