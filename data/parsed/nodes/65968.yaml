    <p>/////////////////////////////////////////////////////////////////////////////////////<br>
    SUDTIPOS ::: 01.2010 ::: NEW FONT RELEASE</p>
    <p>Welcome back and happy new year. We are proud to announce the release of <strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000507#specimen" rel="nofollow">Business Penmanship</a></strong> and some amazing collateral material.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophilebusiness_4941.jpg"></div><p></p>
    <p>/////////////////////////////////////////////////////////////////////////////////////<br>
    AN ILLUSTRATED PDF SPECIMEN<br>
    /////////////////////////////////////////////////////////////////////////////////////</p>
    <p>The long waited <strong><a href="http://www.veer.com/download/pdf/businesspenmanship_specimen.pdf" rel="nofollow">Specimen PDF</a></strong> is finally online. It is a beautiful collaboration with<br>
    amazing illustrations by Leandro Castelao. Check it out! </p>
    <p>/////////////////////////////////////////////////////////////////////////////////////<br>
    SLIDESHOW SPECIMEN<br>
    /////////////////////////////////////////////////////////////////////////////////////</p>
    <p><strong><a href="http://bit.ly/7vAHGY" rel="nofollow">Letters from Antarctica</a></strong> is a awesome slideshow by creative people from Veer. </p>
    <p>/////////////////////////////////////////////////////////////////////////////////////<br>
    BUSINESS POLAROIDS<br>
    /////////////////////////////////////////////////////////////////////////////////////</p>
    <p>Is a collection of <strong><a href="http://www.behance.net/Gallery/Business-Penmanship--Polaroids/382489" rel="nofollow">wonderful pictures</a></strong> by Stéphane Giner mixed with Ale Paul's<br>
    Business Penmanship new font.</p>
    <p>/////////////////////////////////////////////////////////////////////////////////////<br>
    ABOUT THE FONT<br>
    /////////////////////////////////////////////////////////////////////////////////////</p>
    <p>Business Penmanship is an ode to the business handwriting from the era penmanship was a highly-valued part of business education and practice.</p>
    <p>In the early 1800s, Platt Rogers Spencer (1800-1864) created what would become the most widely accepted and prized cursive writing method used in business. Before the American Civil War, Spencer was the undisputed king of handwriting. He was also an outspoken supporter of American business education. By the late 1800s business education included some focus on penmanship, and there were many colleges that specialized in it. One of the most influential penmanship schools was founded by Charles Paxton Zaner and his partner E. W. Bloser. Later on, in the early 1900s Austin Palmer introduced the Palmer Method of business penmanship, and it soon became the most popular handwriting system in the United States.</p>
    <p>Business Penmanship is a single feature-rich font that includes over 1200 characters, covering ligatures, alternates, a large set of beginning and ending extensions, as well as a wide range of Latin-based languages, including Turkish and the languages of Central and Eastern Europe and the Baltic region. To take advantage of all the OpenType features included in the font, please use within programs that support such advanced typography.</p>
