    <p>Hello, </p>
    <p>I am attempting to create a web site. I came across a font type i really like. In my opinion it looks so much nicer than Dreamweaver libary of fonts. <a href="http://www.naimaudio.com/" title="http://www.naimaudio.com/">http://www.naimaudio.com/</a><br>
    this is the site with the font I like, its just bellow "world class sound" <a href="http://www.bowers-wilkins.co.uk/Car_Audio/Jaguar_Car_Audio/XJ" title="http://www.bowers-wilkins.co.uk/Car_Audio/Jaguar_Car_Audio/XJ">http://www.bowers-wilkins.co.uk/Car_Audio/Jaguar_Car_Audio/XJ</a> exact same font. Please could someone tell me the font type. </p>
    <p>Thanks<br>
    Mike</p>
