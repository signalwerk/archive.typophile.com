    html: |-
      <p>They have used Cufon to embed that typeface into that page. You would have to do the same as the typeface is not that common, and therefore will not be installed on many end users computers.</p>
      <p>The Typeface is called 'Swiss 721' at regular (400) weight.</p>
      <p>I hope this helps.</p>
