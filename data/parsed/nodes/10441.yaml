    date_raw: 2 Mar 2003 — 3:36pm
    votes: null
    html: <p>BTW, I see that the Kepler MM fonts are still available. Presumably Adobe will soon be releasing OT opticals of this face as well. I am sure that for most users who even care about optical designs, the current OT optical range is quite adequate. But for those who want maximum flexibility, you might consider getting these fonts before there gone. Kepler is a very friendly and versatile Modern/Didone design. I've enjoyed using it several times. <br> <br>The potential downside is that direct support for MM at the app and system level may disappear (I seem to recall something about future versions of ATM dropping MM support) so you may need to be comfortable with getting under the hood and generating instances as Type 1 for them to continue to be useful into the future. <br> <br>-- K.</p>
