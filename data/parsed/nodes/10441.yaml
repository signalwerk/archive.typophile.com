    html: <p>It's too bad that you can't still buy the MM fonts, even if they aren't supporting them or making more. <br> <br>I agree that some typefaces will look good at one size but not a point or two smaller or larger. The thing that I found unusual was that you felt Minion was too closely set at 11 point, but not at 10 point. Generally speaking, the smaller the point size, the looser the fit should be; so if a font looks too closely fitted at one size, I would expect it to look even more so when set smaller. <br> <br>-- K.</p>
