  - id: 65939
    user: 1551
    date: 2003-03-02T14:35:00
    date_raw: 2 Mar 2003 — 2:35pm
    votes: null
    html: <p>Yes, when I checked Abobe, they weren't selling the MM Minion font. If, John and Kent say, Slimbach adjusted Minion several times, it may be that what I found problematic, he did as well. In any case, it looks like I need to spring for the 'Pro' version to be confident about the result. <br> <br>As to the sizes of the different regular and optical fonts, to me sometimes a font will look good at 10 point but not at 12 or visa versa. Maybe I am crazy about this, but I think something objective is going on. For example with Adobe Garamond I did some booklets that were printed in 12 point and looked great. But I think at 10 point, Adobe Garamond, with its small x-height doesn't work so well. But I find similar things with explanations I can't come up with.  <br> <br>To me, one of the things about great typefaces like Goudy or Palatino or Times is that you can feel the look of the typeface on the page without looking at individual characters. But I have seen for example Palatino looking really elegant or clumsy. Maybe this is just graphic designers knowing how to us them, but I think sizes and weights that work best is also part of the story.</p>
