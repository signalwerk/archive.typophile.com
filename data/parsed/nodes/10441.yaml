    html: <p><i>&gt;Very interesting, Kent. Yes I am using the regular Type 1 fonts and an HP laserjet that is not a postscript printer, though I thought - perhaps mistakenly - that this didn't make a difference. </i> <br> <br>I think it makes a difference. In your case, I would definitely not make judgements about the display versus the regular grades of Minion based on your laser output. I would rely instead on printed examples, especially if I could find specimens printed under similar circumstances as my target. <br> <br>The choice to purchase the MM fonts is entirely yours and budget will necessarily be a factor. Adobe will not be creating any more MM fonts, but I still find the existing ones invaluable. In the event that MM becomes unsupported, one can always generate instances as regular Type 1 fonts. <br> <br>That said, the regular release fonts look just fine, they just aren't as flexible in terms of fine-tuning — but we’re talking about being pretty darn picky here. <br> <br>Hrant, I tend to agree more with your divisions. I was just reporting Adobe’s characterization. <br> <br>— K. <br></p>
