    html: <p>Update on Minion and display vs regular weights. Thanks to all for your advice on this. I now have Minion Pro and InDesign, and am resetting (and finishing writing) the book in this.  <br> <br>When I tested Minion Pro against the old Minion, I found that the Pro regular is actually slimmed down, looks better and sets narrower - almost identical to the old Display minion in setting, but a bit darker. My old problems with it are largely overcome in the new version.  <br> <br>I do feel somewhat validated in that Slimbach actually corrected what was bothering me!  </p>
