    html: <p>Yes, laser prints almost always give slightly thicker letters, so that might be why you find the display version a little bit nicer. But what you also have to take into account is the quality of the final offset printing. Are you using a coated stock? What resolution are you printing at? Computer-to-plate? There are so many variables. Let's say you're using a really high quality coated stock, printing at 3000+ dpi, computer-to-plate. You might find the display version of Minion too light and contrasty. <br> <br>K.</p>
    html_clean: <p>Yes, laser prints almost always give slightly thicker letters, so that might be why you find the display version a little bit nicer. But what you also have to take into account is the quality of the final offset printing. Are you using a coated stock? What resolution are you printing at? Computer-to-plate? There are so many variables. Let's say you're using a really high quality coated stock, printing at 3000+ dpi, computer-to-plate. You might find the display version of Minion too light and contrasty. <br> <br>K.</p>
  - id: 65931
    user: 1551
    date: 2003-03-01T11:46:00
    date_raw: 1 Mar 2003 — 11:46am
    votes: null
    html: <p>Thanks, Keith. I guess I need guidance from the printer. The paper will not be coated, at least if I have a say. Overall, I'm surprised that there isn't more discussion of and guidance, eg. from Adobe, on when to use what weights, especially given that they are now doing the 'opticals'. To me, the digital versions of typefaces should be just as sensitive to the changes in size as were the original foundry type, and the typeface developer should give guidance to graphic artists on how to use them. </p>
    html_clean: <p>Thanks, Keith. I guess I need guidance from the printer. The paper will not be coated, at least if I have a say. Overall, I'm surprised that there isn't more discussion of and guidance, eg. from Adobe, on when to use what weights, especially given that they are now doing the 'opticals'. To me, the digital versions of typefaces should be just as sensitive to the changes in size as were the original foundry type, and the typeface developer should give guidance to graphic artists on how to use them. </p>
  - id: 65932
    user: 1215
    date: 2003-03-01T11:59:00
    date_raw: 1 Mar 2003 — 11:59am
    votes: null
    html: <p>Also, if the regular weight looks too closely set in 11 point, but not in 10 point -- which seems counter-intuitive to me --  then I wonder if your printer's RIP might not be playing tricks on you. If it is not a true Adobe Postscript RIP, then it may not be correctly interpreting hints. <br> <br>There are several versions of Minion. The regular Type 1 fonts, which were released initially (and which it sounds like you are using) were revised when the family was released as a Multiple Master set. As I understand it, Robert completely refitted the fonts in addition to tweaking some of the outlines. The MM fonts have an optical axis and allow greater range than the initial release. <br> <br>I believe that the OT Pro series has been further tweaked. The OT opticals are labelled to indicate the intended use -- Caption for the smallest sizes, Text for normal text sizes, Subhead for the mid-range, and Display for headline and on up. I don't know if a layout feature has been implemented to automatically pull the outlines for the designated point size. <br> <br>Personally I prefer the MM versions because they provide the greatest flexibility in matching the grading to the output. <br> <br>-- Kent. <br></p>
    html_clean: <p>Also, if the regular weight looks too closely set in 11 point, but not in 10 point -- which seems counter-intuitive to me --  then I wonder if your printer's RIP might not be playing tricks on you. If it is not a true Adobe Postscript RIP, then it may not be correctly interpreting hints. <br> <br>There are several versions of Minion. The regular Type 1 fonts, which were released initially (and which it sounds like you are using) were revised when the family was released as a Multiple Master set. As I understand it, Robert completely refitted the fonts in addition to tweaking some of the outlines. The MM fonts have an optical axis and allow greater range than the initial release. <br> <br>I believe that the OT Pro series has been further tweaked. The OT opticals are labelled to indicate the intended use -- Caption for the smallest sizes, Text for normal text sizes, Subhead for the mid-range, and Display for headline and on up. I don't know if a layout feature has been implemented to automatically pull the outlines for the designated point size. <br> <br>Personally I prefer the MM versions because they provide the greatest flexibility in matching the grading to the output. <br> <br>-- Kent. <br></p>
