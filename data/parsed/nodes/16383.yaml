    <p>If you put together a reasonably inexpensive non-electronic type design kit, what would be in it?</p>
    <p>Here's mine:<br>
    Sanford Design Ebony Layout Pencils<br>
    Alvin Brass Bullet Pencil Sharpener<br>
    Sanford Higgins Waterproof Black Magic Ink<br>
    Rapidograph pen set (I use Mars): .3, .6, and 1.2<br>
    General's Pen Holder (and a selection of pen tips)<br>
    Alvin French Curves (set of 3)<br>
    9x12" Acid free 65 lb white sketch paper (spiral pad)<br>
    9x12" Tracing paper pad<br>
    16" cork-backed ruler<br>
    erasing shield<br>
    Sharpie twin tip marker (black)<br>
    red, black and non-repro blue prismacolor pencils<br>
    and BIC Crystal Ball Point pen (black)</p>
