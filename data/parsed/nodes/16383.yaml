    html: |-
      <p>To be fair, the only things I use from the original list with regularity are the sketchbook, pencil/sharpener, metal ruler, and the bic pen. I used to be into pilot razor points, but when I had one explode on me I switched to staedtler triplus fineliners.</p>
      <p>The rapidographs and steel pens are 1/2 tool fetishism (gearism?), and 1/2 practical. Something about using tools like this forces you to consider the marks you make on paper. There is a deliberation to each penstroke... but then, at the same time the carefulness can sometimes kill the spontenaity of sketches. I also like the quality of the india on paper. It doesn't bleed like felt tips, is completely opaque, and (depending on technique) doesn't make indents on the paper.</p>
      <p>The most obscure tool I actually use is a "Wrico lettering pen" (#6), but it's messy, and I find that I spend more time with preparation and clean-up then I do with drawing.</p>
