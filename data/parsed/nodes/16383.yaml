      <p>Geez, it's been so long since I've done any real handwork, it's hard to remember, but...</p>
      <p>I was seriously into Rapidographs, with a complete range from 6x0 (about a gnat's eyelash in width) to 6 (used about a half bottle of ink for every twenty feet ruled); two Rapidograph ruling compasses (a small drop compass, which handled radii down to a sixteenth of an inch, and a large, far more precise one with worm-gear adjustment that could tackle radii to about four inches); a free-flowing India ink (whose name I cannot recall, but decidedly necessary for very fine-point pens); and Linekote illustration board. Both Rapidograph compasses had leadholder inserts, so you could use non-repro blue lead to plan your work, then swap out the appropriate penpoint to work your plan.</p>
      <p>Another handy tool was white mylar tape for corrections and adding traps. The mylar version was much thinner than regular white tape (fewer problems with shadows), and a lot tougher (you could cut VERY tiny slivers for traps). And, of course, a whole slew of Alvin templates often came in handy.</p>
