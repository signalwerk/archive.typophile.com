      <p><em>After watching the movie “Crumb” a couple of years ago, I noticed he uses a “2” Rapidograph pen for most of his work. I got all nostalgic and went out and got one. I used it for a couple of weeks, carried it around for a couple of months and now the damn thing is sitting with my other pens full of dry ink. Oh well.</em></p>
      <p>That's the reason that an <strong>ultrasonic cleaner</strong> was also an essential tool in the analog days. The chemistry profs at the college I worked at eons ago said "old soapy water" greatly increased the efficacy of the cavitation produced by an ultrasonic cleaner, and made it more effective. However, I was never sure whether or not that meant that you had to add old soap to new water, or that you added new soap to new water and let it age. Vintage two-and-a-half months ago: a very good year?</p>
