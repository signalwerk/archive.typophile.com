    html: <p>I don't do a lot of actual typeform design off the computer, but I do tend to make prepatory studies of stroke and contrast patterns using different writing implements and techniques. The most useful addition to my analogue toolkit this year has been an Osmiroid copperplate nib. This is a discontinued item, but I found a couple on eBay. It is, as far as I know, the only split-nib attachment available for a cartridge pen, and it much more convenient than getting out the pot of ink and my various old nibs and holders.</p>
