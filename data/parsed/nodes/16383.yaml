    html: <p>2mm pencils have replaced all of my other graphite pencils at this point, I buy them in different brands and colors so I can keep different leads ready to go. The leads are expensive, but like steel nibs, can often be found in bulk as designers and draftsmen of the 1970s appear to have purchased enough to last through 2099.</p>
