      <p>I quit using Rapidograph pens over a decade ago, hated the things. I still occasionally use calligraphy pens, but Iike the feel of the marker better. Still looking for a really black marker though. Quit using french and ships curves for the most part.<br>
      The Bienfang paper is okay, but I had a noname tracing paper I got at Favor Ruhl in Chicago. It was between the parchment and satin design in weight, nice surface and very strong. Favor Ruhl went under sometime between 75-80 I think and my brother and I bought all we could get our hands on. The manufacturer quit making tracing paper and I used up the last of it about two years ago.</p>
