      <p>When I'm not working at my computer, I like working with any of these, depending on what I'm doing:</p>
      <p>Pilot Precise Extra Fine Roller Ball Pen<br>
      No. 2 Pencil<br>
      Faber-Castell 9000 Pencil Set (for more serious drawing)<br>
      Faber-Castell Magic Rub Eraser<br>
      Pilot Razor Point<br>
      Yellow legal pad (I love doodling on these things more than anything for some reason)<br>
      Bienfang 10x10 gridded paper<br>
      Gaebel steel 18" ruler<br>
      Various sized plastic triangles<br>
      Drafting tape<br>
      X-acto knife and blades<br>
      Mechanical pencil (no favorite brand right now, so long as it has an eraser and uses .05 HB leads)<br>
      Various drawing paper sketch books<br>
      Cheap little note pads (I always carry one of these)<br>
      Vidalon Translucent Vellum pad<br>
      Electric pencil sharpener</p>
      <p>After watching the movie "Crumb" a couple of years ago, I noticed he uses a "2" Rapidograph pen for most of his work. I got all nostalgic and went out and got one. I used it for a couple of weeks, carried it around for a couple of months and now the damn thing is sitting with my other pens full of dry ink. Oh well.</p>
      <p>I still like using pencils and paper, but I would never go back to producing finished lettering art with ink and pens. I actually used a ruling pen for a little while before I discovered Rapidographs. Ruling pens were heartbreakers. I also used to use a lot of red Zipatone instead of ink for filling in large areas. Plus a ton of ellipse and circle templates and french curves. (What do they call french curves in France? Des courbes? I guess if we were still using them here, some people would be calling them "freedom curves." :-P )</p>
      <p>Oh, and I still have the T-square I bought in college. Nowadays, I am most likely to use it to retrieve our cat's toys from under furniture.</p>
