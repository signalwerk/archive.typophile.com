      <p>I saw Amberlith and Rubylith in posts by Carl and ChrisL, so I thought I'd mention my indispensible tool.</p>
      <p>The stencil knife. Just a piece of 3mm stainless steel rod about eight inches long, ground flat at one end and sharpened at about 45°.</p>
      <p>The great advantage when hand-cutting is the ability to rotate the blade as you cut, when held almost vertically between forefinger and thumb.</p>
      <p>I don't cut much by hand these days, but still use it all the time to weed out computer-cut ruby and self-adhesive vinyl.</p>
      <p>Nothing to do with typography, I'm afraid, but I'm just a crude screen printer and sign maker really!</p>
      <p>Richard</p>
