    <p>Hi guys,</p>
    <p>I have a problem with various font files on one of my systems. They appear perfectly on one system, but on the other the "BoldItalic" is actually "Thin", the "Hairline" is "Normal" (etc etc etc.... it varies with the font in question).</p>
    <p>Some fonts are from Adobe Font Folio OpenType Edition (the original one), and one is "Omnes" by Joshua Darden. They appear perfect on my laptop, but as I don't use them on my laptop but on my desktop, it's a PITA! :D</p>
    <p>The only difference between the two systems is that the laptop (where the fonts are fine) is XP SP2, whereas my design machine is XP SP3. I don't know if this has anything to do with it...</p>
    <p>Any help would be appreciated!</p>
    <p>Many thanks,</p>
    <p>Martin</p>
