    <p>It’s a font used on a letterhead, which is designed in the late 80’s,<br>
    though i think it’s done with a Drytransfer it could also be a custom job.</p>
    <p>The second image seems to be the same font only distorted.</p>
    <p>Does anyone have an idea?</p>
