  html: |-
    <p>Hello,</p>
    <p>I’m working on a serif text font, it has constructed elements of a slab serif, but also some of the Old Style genre.<br>
    The idea is, to design the typeface more squarish, with superelliptical shapes – to produce a strong horizontal impression and keep the counterspaces more open.<br>
    What do you think? Every comment is welcome.</p>
