    <p>Or rather an æ?</p>
    <p>In the <a class="freelinking external" href="http://typophile.com/node/50618" rel="nofollow">crit thread on my handwriting-inspired font</a> we ran into this question. I have little experience with this glyph. </p>
    <p>In handwritten form, would æ usually be written like an 'a' and then an 'e', but abutted? Or does one swing down and around and up and around, so that the crossbar of the a goes right into the crossbar of the e? Or does a handwritten form most often employ a single-story 'a' form?</p>
  html_clean: |-
