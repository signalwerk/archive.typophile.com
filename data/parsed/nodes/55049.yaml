      <p>This is how I tend to write it when using IPA or when using those few words in English that use it, pretty similar to Jonseong just with a more clearly defined two-story a (which is my normal a).  However I do know it's the same form used by Spaniards when writing a cursive x (then again, their cursive f is my esh so...). </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ae_handwriting_5865.png"></div> <p></p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
