    html: |-
      <p>I'm curious how French speakers write æ and œ, since both are supposed to be used in French (though they're really, really rare).</p>
      <p>I myself rarely write æ. When I do, I usually begin by tracing the loop of a half-hearted single-storey a, clockwise, and then connect the e from there, so I end up with something like this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ae_4132.gif"></div><p></p>
      <p>It's a hassle to write, and I suspect if I were writing in a language that uses æ frequently, I'd use a simpler form.</p>
