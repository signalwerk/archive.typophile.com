    html: |-
      <p>Vito Sans is very interesting, but the (lowercase?) /i/ in your first example could be easily confused for an /o/. The ring in the Aring glyph doesn't need to be touching. The tilde in your accented glyphs is also a bit wobbly. You might also try giving that ring in Aring and the cedilla a bit more weight. Especially the ring.</p>
      <p>Nice though!</p>
