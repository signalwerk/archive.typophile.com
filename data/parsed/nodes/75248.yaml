  html: |-
    <p>Hi,<br>
    I'm Giuseppe Salerno, Art Director of Resistenza.es -Valencia Spain.</p>
    <p>I'm developing some fonts, and i would like you to see my latest<br>
    creation called Vito Sans.</p>
    <p><a href="http://www.resistenza.es/vitosans/" title="http://www.resistenza.es/vitosans/">http://www.resistenza.es/vitosans/</a></p>
    <p>this typeface born during the summer of 2010, in a little town<br>
    called San Vito lo Capo in Sicily.<br>
    this uppercase font is perfect for when you want to use eye-catching<br>
    big texts for anything from posters and flyers for concerts, events,<br>
    parties, to cd covers, advertisements.<br>
    <img src="http://www.resistenza.es/vitosans/wp-content/uploads/2010/08/vitosans_big.png" width="600" height="504"></p>
    <p>I hope you like like it!</p>
    <p>thanks for your time.</p>
