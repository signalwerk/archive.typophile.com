    html: <p>Sarah, <br> <br>Take the above comments with a grain of salt. What you need to know is that a large percentage of the people here are in the business of selling type, and therefore are opposed in principle to the distribution of free fonts, whether legit or stolen. <br> <br>And it's true that generally the for-profit fonts are better designed and more complete. But for amateurs and collectors, there is nothing at all wrong with seeking out free fonts. My only advice is to be careful in using the fonts in projects -- especially professional projects -- and only use those that are definitely freeware or that you have purchased.</p>
