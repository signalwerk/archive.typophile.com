  html: <p>I have never downloaded anything before, but just curious as to how to go upon it.  I want to get a font collection going for projects that I am in the process of working on now, and I need help.  ] <br> <br>I just need help with the whole thing, I know you can just go to these font sites and download either for MAc or PC, but is there anything I should know beforehand.   <br> <br>Please, if anyone has experience or knowledge of downloading fonts, please let me know.  Thanks.</p>
