    html: "<p>adendum to the above post: <br> <br>in reference to my third list item, even those rare gems  <br>require some very careful kerning. of course, that  <br>comes with the use of most display type. <br> <br>in reference to Gentium, my primary concern for text  <br>setting is the lack of small caps and text numerals. it  <br>doesn't appear that there have been any updates in  <br>recent months, but here's a link to the site. <br>&lt;<a href=\"http://www.sil.org/~gaultney/gentium/\" target=\"_blank\">http://www.sil.org/~gaultney/gentium/</a>&gt;</p>"
