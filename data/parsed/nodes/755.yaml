    html: <p>&gt;the Lab is one popular source for them <br> <br>The way I understand it, Fred Nader was taken to court by a number of foundries for making their fonts available on a "usenet". However, the free fonts on the apostrophiclab.com site are acceptably original. Is this correct? Is Fred Nader still a pirate? <br> <br>The ethics of the type designer, the price, and the quality of fonts, are three separate issues. If you are looking for a free version of an established typeface, that's an unprofessional thing to do, for the reasons Joe mentioned. However, a font such as Fred Nader's free Republika appears to be original and good quality. <br> <br>I've never discussed his court case, or his philosophy on copyright, with him, but Fred Nader did once mention that he was at the ATypI conference a few years ago when Book Antiqua was premiered, and Hermann Zapf walked out in disgust. <br> <br>OK Joe, forget the Lab, let's start a petition to get Book Antiqua withdrawn. (Or did its publishers settle with Zapf?)</p>
