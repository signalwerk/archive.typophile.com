    html: "<p>Sarah inquired... <br>\"I know you can just go to these font sites and  <br>download either for MAc or PC, but is there anything I  <br>should know beforehand.\" <br> <br>you get one of three things: <br>1) a poorly executed rip-off of someone's valiant  <br>commercial effort <br>2) a poorly executed, uninformed, \"original\" design <br>3) one of those _very_ rare gems that might come in  <br>handy for display work some day <br> <br>I have yet to see a functional text font among these  <br>ranks; maybe someone can show me otherwise. I'm  <br>not sure where that whole Gentium project stands...</p>"
