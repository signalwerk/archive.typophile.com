    html: <p> I'm interested to hear more on this. <br>I've tested my fonts extensively in the <br>Windows environment and have run into some <br>strange kinks with all fonts (let alone my own). <br>From what I can figure out various versions <br>of design programs (esp. Quark &amp; Illustrator) <br>tend to create different results depending on <br>the version of Windows. <br>Very frustrating if you tend to lean towards <br>obsessive perfectionism. </p>
