    html: <p> I have had the same problem with missing fonts even though they are installed. it's odd, and I unfortunaly haven't got a solution. <br> <br>As for the protected fonts issue, legitimate purchased fonts often have a checkbox marked that protect the font from ebedding into documents. I have it you can change it in FG, but I doubt you're allowed by the license agreement. </p>
