  html: <p> Hello... <br> <br>I have a question that hasn't been answered to my satisfaction over at Adobe regarding the way Illustrator reads fonts in the Windows environment.  <br> <br>Often AI will display fonts in the font menu that it will not pull into a document when opened, claiming that the font(s) are unavailable. <br> <br>Also, when saving a document that uses fonts that I know are legitimate, purchased fonts, I will frequently receive a message stating that Illustrator is "unable to create font subset" and that "protected fonts cannot be embedded". <br> <br>What's going on here? Anyone? <br> <br>Thanks! </p>
