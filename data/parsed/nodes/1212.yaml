    html: <p> thanks tom. <br>no, i'm running windows 2000. <br>it seems to be fonts that have been 'converted' from mac to pc or from t1 to truetype that are at the heart of the problem. i've spoken with adobe tech support (some of the fonts in question were adobe), and the upshot of our back-and-forth dialog was that the problem most likely lies with fonts that have been altered in fontographer (or crossfont, etc). at least that's been our best guess. i'm not entirely sure how illustrator id's fonts for its menu, so i've been unable to confirm this theory, but i can't think of anything else... </p>
