    html: <p> Are you running windows 98? If so I would recommend doing a search for "adobefnt.lst" and then deleting all of the files that it finds with that exact name. Then before starting any other adobe apps start photoshop first. It builds the best adobefnt.lst and all of the adobe apps share the same lst. That will fix some of the problems <br> <br>Tom </p>
