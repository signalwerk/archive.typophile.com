  html: |-
    <p>Hello everyone,</p>
    <p>Just to let you know that since last october, the ANRT (Atelier National de Recherche Typographique) has re-opened in France.<br>
    The call for applications is opened until the end of may, we select 6 students-researchers each year. For more informations, you can check <a class="freelinking external" href="http://www.anrt-nancy.fr/en/how-it-works" rel="nofollow">our website</a>.</p>
    <p>We also organize on May 6th and 7th a symposium about "Automatic Type Design", <a class="freelinking external" href="http://www.anrt-nancy.fr/en/how-it-works" rel="nofollow">more infos here</a>.</p>
    <p>Hope to meet some of you soon.</p>
