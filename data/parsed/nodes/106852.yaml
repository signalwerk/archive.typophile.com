    html: |-
      <p>Nike is well-known for its bespoke typefaces and particularly the people at <a class="freelinking external" href="http://typophile.com/node/103278" rel="nofollow">Nike Bowery Stadium</a> where this photo shoot comes from.<br>
      This sample is very close to <a class="freelinking external" href="http://www.myfonts.com/fonts/coniglio/nomad" rel="nofollow">Nomad</a>: straight oblique /S transition above median line, low /A crossbar, pointy /M centre vertex above baseline, 3 upper terminals /W, straight oblique /R leg. But Nomad is bolder and /R is rather off... Some more alternatives: <a class="freelinking external" href="http://www.tendollarfonts.com/strassenbahn" rel="nofollow">Strassenbahn</a> (/M and /W off), <a class="freelinking external" href="http://www.myfonts.com/fonts/chank/nicotine" rel="nofollow">Nicotine</a> (/W off), <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/tempus-gothic" rel="nofollow">Tempus Gothic</a> (/S, /M, /R off), <a class="freelinking external" href="http://www.myfonts.com/fonts/virusfonts/bourgeois" rel="nofollow">Bourgeois</a> Condensed (mixing Regular/Alternate, probably my candidate for customization as it offers a maximum of flexibility), <a class="freelinking external" href="http://www.myfonts.com/fonts/sentinel/primex" rel="nofollow">Primex</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/sentinel/big-noodle-titling/" rel="nofollow">Big Noodle Titling</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/k-type/enamela" rel="nofollow">Enamela</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/capearcona/ca-geheimagent" rel="nofollow">Geheimagent</a></p>
      <p>EDIT: after further inspection, <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/refrigerator-deluxe" rel="nofollow">Refrigerator Deluxe</a> Light might work pretty well...</p>
