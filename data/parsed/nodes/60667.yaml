      <p>What you have looks pretty good in terms of matching the symbol with the font. If you pick a different font for a more "subtle" look, you will need to re-draw the symbol, unless you are looking for another round geometric font. </p>
      <p>For example, would <a class="freelinking external" href="http://www.fontshop.com/search/?&amp;q=FF+Max&amp;x=17&amp;y=13&amp;sample_text=svenska%20vard&amp;sample_size=48" rel="nofollow">FF Max</a> or <a class="freelinking external" href="http://www.fontshop.com/search/?&amp;q=FF+Dax&amp;x=17&amp;y=9&amp;sample_text=svenska%20vard&amp;sample_size=48" rel="nofollow">FF Dax</a>, in one of it's wider variants, work for your design?</p>
      <p>- Mike Yanega</p>
