    <p>Hi!</p>
    <p>I´m working on a logo for a health care organisation, and the idea is to integrate a symbol I´ve made into the text in the logo. Last letter of the text is "d" and the symbol looks similar to the letter "d".</p>
    <p>The symbol fits quite nice in combination with bauhaus and similar fonts, here it´s combined with Horatio bold.<br>
    But I´m not sure. I would like to find a font that look a bit more strict and serious. To me this is a little bit too playful for health care. But I kind of like the symbol. Any suggestions for a more subtle font that still would look good combined with the symbol?</p>
    <p>Eventually the logo will have another colour than black. I might accent the cross in the d/symbol in some way too.</p>
    <p>thanks!<br>
    //J</p>
