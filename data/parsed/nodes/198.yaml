  html: <p> Hello; <br> <br>I'm wondering what people's thoughts are when critiquing type that there would be benefit to not only looking at individual letters but also at the same time comparing the likely sequences of letters and possibly words (handgloves etc.). Sequences of letters are alluded to in a previous forum. (Typophile Forums &lt; General Discussions &lt; Mmm, ligatures) <br> <br>I realize that this isn't a new idea but I haven't really seen it put to much use. <br> <br>Michael </p>
