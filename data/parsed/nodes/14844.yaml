    html: |-
      <p>There is really no rule. As a rule of thumb, the TM* should be as non obtrusive as possible. Our firm will occasionally develop several different optical variants of a mark, intended for different size applications. A feature of these variants normally incorporates different sizes of the TM or (R) to match the intended reproduction size of the mark. </p>
      <p>Go with a placement that works with the mark. Normally it follows the mark, and is most commonly located at the top (although recent trends have seen this changing).</p>
      <p>*I am assuming you will mostly be working with a TM, not a registered mark.</p>
