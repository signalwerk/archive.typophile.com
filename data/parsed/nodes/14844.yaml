    html: <p>Have the client consult with their lawyer(s). In most cases I’ve run into in the U.S. a trademark ® or TM only has to appear once at the beginning of a document although I just read an article about SPAM® vs spam, where every time SPAM® was mentioned they had it in all caps and ®.</p>
