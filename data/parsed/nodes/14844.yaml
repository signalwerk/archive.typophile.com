    <p>I’ve recently started doing design work for financial advisors, on top of the ninetofive at a commercial signage shop/digital printer’s. I’ve done logo design at the day job in the past, but obviously the clientele there (mostly of the Mom &amp; Pop’s Fish &amp; Chips variety) isn’t half as concerned with protecting their marks as the financial advisors.</p>
    <p>I was wondering how to approach placing Trademark and Registered Trademark symbols tastefully on logos. Do I want them to ’nest’ with the letterforms and blend in, or seperate them and leave them hovering like an insect? What about the size relationship? Naturally a logo must be printed at different sizes, does the trademark remain a constant size or should it resize too?</p>
    <p>Insight appreciated.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/14884" class="topic-previous" title="Go to previous forum topic">‹ Sans Serif with Mrs. Eaves</a> <a href="/node/14837" class="topic-next" title="Go to next forum topic">Arial alternate - no laughing please ›</a></div>
