    <h2><a href="/node/39993" title="Typophile Support Badges">Typophile Support Badges</a></h2> 
        <div class="info">Submitted by <a href="/user/1160" title="View user profile.">Joe Pemberton</a> : 11.Dec.2007 6.02pm </div>
      <p><strong>What’s up with those little badges on peoples’ user icons?</strong></p>
    <p><a href="http://typophile.bigcartel.com"></a></p><div class="imageWrap"><a href="http://typophile.bigcartel.com"><img src="/files/typ_sponsor-levels_5368.png"></a></div><p></p>
    <p>The concept is if you have sympathy, send Typophile $15. If you love Typophile, send $45. And, if it’s a true obsession, you can show it with a larger donation of $100.</p>
    <p>When you support Typophile you’ll receive a badge to add to your user icon. Let other users know of your undying sympathy (shield), love (heart) obsession (drop of blood) for Typophile.</p>
    <p>Also, if you purchased a tee in the last 12 months we’ll send you badge to match your approximate contribution. Some of you made other significant contributions this year. You won’t be forgotten.</p>
