  html: |-
    <p>Ok… I am a little bit lost here with the lookups in Opentype fonts. Anyone could tell me the interest there is to add lookup if I already made a -salt- feature (for example) with my classes ?<br>
    For example I have this feature :</p>
    <p>feature salt {<br>
      sub @reg_lc by @alt_lc ;<br>
          sub @reg_uc by @alt_uc ;<br>
              sub @reg_sc by @alt_sc ;<br>
    } salt;</p>
    <p>Why would I need to add lookups and what way would they improve my font ? I don't really get the big interest there is behind lookups. Could anyone explain it with more simple words than the Fontlab manual :)</p>
