    html: |-
      <p>You can make use of a lookup later in your feature file, in order to avoid repeating the feature code.<br>
      (For instance, you might want the same substitution to be active in multiple different language systems. First, you wrap the feature code in the lookup; later, you just call the lookup again.).</p>
      <p><a class="freelinking external" href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#4.e" rel="nofollow">http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#4.e</a></p>
