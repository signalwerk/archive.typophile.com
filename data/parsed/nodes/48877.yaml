      <p>Hi, Hakan.</p>
      <p>There is Fwis's <a href="http://covers.fwis.com/" rel="nofollow"><strong>Covers</strong></a> blog...</p>
      <p>...also <a href="http://nytimesbooks.blogspot.com/" rel="nofollow"><strong>The Book Design Review</strong></a>...</p>
      <p>...and Osprey Design's <a href="http://foreword.ospreydesign.com/" rel="nofollow"><strong>Foreword</strong></a> blog.</p>
      <p>Gestalten has a recent book called <a href="http://www.gestalten.com/books/detail?id=d7f6f0d8181ee5580118a318ca940193" rel="nofollow"><em>Fully Booked</em></a>, and there are others. Try doing a search on Amazon.com, or on Google, using the terms "book design" or "book cover design".</p>
