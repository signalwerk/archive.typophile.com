    html: |-
      <p>If you find a site with Mediafile/Rapishare links, don't even bother contacting the owner of the site. They'll just tell you that they don't host fonts, you'll waste a lot of time and get nowhere. Do to where the files are hosted. You can take Mediafire links down pretty quickly. You have to write up a list of fonts along with your address, phone number and some DMCA required rigmarole. But once you've done it, you can quickly target and shut down subsequent Mediafire &amp; Rapidshare links by sending the same info. I've done it a few times. People can re-upload the files but if you really want to shoot a link down, you can.</p>
      <p>If you find a site that appears to be offering your fonts through Usenet, just ignore it. The casual downloader won't bother with those anyway. A lot of those sites create fake lists of files based on search inquiries. If you search for nude photos of Nick Shinn, they will later claim that they have nude photos of Nick Shinn which you have to pay to access. That's what I heard anyway . . . from this guy I know. Yeah.</p>
      <p>If you find a site that's offering your fonts for direct download, send a polite email first, that's always done the trick for me. I've always found free fonts site operators to be reasonable. They're either reasonable or absent. There were three cases where the site owners didn't bother to leave a contact link. I contacted the ISP, they gave they guy a few days to respond, they didn't and the whole site was shut down. To my knowledge, none of those sites ever returned. Ba-boom!</p>
    html_clean: |-
