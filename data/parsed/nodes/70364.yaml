    <p>I'm certain I'm not alone in this rather disturbing topic (and even more certain that there has been a thread about this topic posted before - I did look for it, but to no avail) - I would love to hear comments, advice, etc. about websites that blatantly post your font for others to download them for free. And then to insult to injury, request that you jump through ridiculous hoops to get them removed. How much time do you all spend pursuing this, what's your take on it, approach, etcetera?</p>
    <p>Thanks in advance from this lost little rookie type designer :)</p>
    <p>~ Laura Worthington</p>
