      <p>I like to think that most designers buy fonts legitimately (Typophile users already busted my chops about this. I like to think that I've learned my lesson.) Those who steal are hopefully in the shadows and use the fonts for their own closeted purposes.</p>
      <p>I only hope that the people who are putting your typefaces out in the open with their works (and, hence, ought to own them legally) are not the same people who are pirating them.</p>
      <p>People who understand type are the most likely group to purchase them. Hence, they are the target market. People who wantonly pirate fonts probably have no idea how to use them effectively. I, too, would be offended if someone stole my work, but I wouldn't expect some random font pirate to siphon off my creative power and make a killing.</p>
      <p>Unless, of course, this happens more than I know. I got in trouble for walking this fine line in another thread...</p>
