      <p>I'm a largely retired lawyer with an interest in typography. I've never been a designer.</p>
      <p>I understand the annoyance of seeing one's work used without consent and without compensation and I sympathize. Nonetheless, the pirating of fonts likely does not lead to significant loss of revenue to the designers and foundries.</p>
      <p>Unconsented use falls into 3 general categories:</p>
      <p>1. Use within the Fair Use Doctrine, which allows use of copyrighted material under certain conditions, e.g., for educational purposes, criticism, etc. Downloading by font collectors who do not actually use the fonts for print materials, websites, etc., likely fall into this category.</p>
      <p>2. Improper use by high-end designers and design studios who are being compensated for their work. These people certainly should be paying for fonts and their improper use of fonts and other intellectual property does represent a loss of revenue to the creator of the font or other intellectual property. I am not privy to the data, but from what I've heard most such designers properly license material they use and charge the cost to the customer. If so, this group does not represent significant losses to the designers of the work they incorporate into their designs.</p>
      <p>3. Improper use by low-end designers. This use is clearly improper, but also likely does not represent a significant loss of revenue. If one is designing a flyer for a local business, e.g., Sam's Car Wash, Sam doesn't know much about fonts and doesn't care what font is used so long as someone can read the flyer with the $1 off regular price coupon. If the designer chooses to use a font that he or she has not licensed, the use is likely personal whim.  Not being able to pass the cost along to the customer, the designer is unlikely to pay for fonts for which he or she does not hold a license. Instead, if the designer was unable to use the unlicensed font, he or she would simply use a font to which he or she had a license through purchase of the computer's operating system, Adobe Creative Suite, etc.</p>
      <p>So. . . . Take pride in the beautiful work you've created, enjoy what revenues you do receive, and write letters to websites hosting illegal downloads asking them to remove the offending fonts. Don't waste money on hiring lawyers, though, because you are very unlikely to recover the cost of having a lawyer write a letter for you, let alone file a lawsuit for you, particularly when the hosting site is hosted outside your own country.</p>
      <p>Finally, Laura, I've seen some of your fonts -- though I've never used one since courts would not welcome calligraphic script fonts in legal documents -- and I think your work is beautiful. Were I a designer of items for which your fonts are suitable, I would surely license and use them.</p>
