  html: <p>Is it possible to create classes for individual letters in Fontlab’s Metrics.txt file? And if so, what is the proper syntax?</p>
  html_clean: <p>Is it possible to create classes for individual letters in Fontlab’s Metrics.txt file? And if so, what is the proper syntax?</p>
