    html: |-
      <p>Apache does not stop people from deriving free fonts, while OFL does stop people who cannot allow themselves that luxury, due to factors essentially out of their control. OFL is idealistic to the point of in fact actually doing damage to minority writing systems, and you can see this in action when you look closely at the low quality of non-Latin derivations. Apache is humanly pragmatic, resulting in higher quality typography for more disadvantaged people.</p>
      <p>When you decide to release a font under OFL instead of Apache you are –whether you realize it or not– adopting a narrow view of what kinds of people should be designing fonts.</p>
      <p>hhp</p>
