    html: |-
      <p>RFNs allow corporate entities to contribute open-source fonts while still protecting their trademarks.</p>
      <p>It does mean that the modified fonts can't be used as substitutes for the original without being specified explicitly. But in the case of web fonts, you're providing a font yourself on your web site (i.e. in a format like WOFF) and so your web page would specify the name of the version you're providing.</p>
      <p>The only case where RFNs mess up the display of a web page is if you're just hoping the viewer happens to have the original font, or at least one of its modified versions, installed on his computer. That isn't how people serious about the appearance of their web page should do it anyways. So I'm having a hard time understanding why the RFN is a real problem.</p>
