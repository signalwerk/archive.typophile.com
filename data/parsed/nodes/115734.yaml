      <p>I'll have to read the license, as the Wikipedia article is confusing. It appears that the requirement that fonts must be packaged with software only applies to selling them for money, not for all redistribution. That apparent silliness, though, may not be what Hrant is objecting to.</p>
      <p>OK, I've read the license, and although it's much briefer than the GPL, I can't see a problem.</p>
      <p>Ah:<br>
      <cite>Apache does not stop people from deriving free fonts, while OFL does stop people who cannot allow themselves that luxury, due to factors essentially out of their control. OFL is idealistic to the point of in fact actually doing damage to minority writing systems,</cite></p>
      <p>reading what Hrant said lets me see what the issue is; that issue is that the OFL <strong>is</strong> like the GPL instead of the BSD license.</p>
      <p>The objection is reasonable - people who use minority writing systems tend to live in poor countries, and so they may not be able to indulge themselves the way people in rich countries might by working for free. While people in the rich world might not have any problem drawing the <em>glyphs</em> for the writing system of a foreign language competently, it may well take a native speaker to set up all the various Unicode composition rules for a given language correctly.</p>
      <p>So an OFL-licensed font does not serve as a resource for commercial indigenous font designers.</p>
      <p>But why did the GPL come about in the first place? To prevent someone from tweaking a program, making a few improvements, and then preventing the originators of the program from making similar improvements without copying anything from that person's implementation.</p>
      <p>I see this limitation of the GPL, therefore, as coldly practical - not <em>primarily</em> a manifestation of the idealism that Richard Stallman indeed does advocate. I too have lots of problems with Richard Stallman's idealism; as far as I'm concerned, people producing IP and making money from it under the current copyright regime are not doing anything questionable (merely by doing so).</p>
      <p>The scarcity that leads to the world's real poverty problems isn't scarcity of IP, which is so easy to copy, legally or otherwise. It's scarcity of land, shelter, food, water... neither legal copies of Linux or pirate copies of Windows or Britney Spears records will help all that much with that.</p>
      <p>This is not to deny that computers haven't helped to improve the efficiency of the production of physical goods. But, if Brazil needed an operating system for its computers, it has the resources to write one. And the gains are relatively small ones; agriculture hasn't improved by Moore's Law style leaps and bounds.</p>
