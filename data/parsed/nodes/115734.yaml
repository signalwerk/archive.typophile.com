      <p><cite>And that BTW is why I don't condone people making money by redistributing an OFL font "packaged" with some random junk.</cite></p>
      <p>That is a practice, indeed, not to be condoned, because it subverts what appears to be the purpose of a clause in the license.</p>
      <p>Unfortunately, though, because the GPL doesn't restrict sale of its free software, it's possible to do something legitimate with (at least almost) no more effort required than the practice you deplore. Sell a CD-ROM with a complete Linux distribution on it, packed with every OFL font in existence (and open-source fonts under other licenses too)... and what you're doing is completely legitimate, but of course those fonts are also readable from Windows. And yet you've written no software yourself, not even a silly little utility.</p>
      <p>Packaging a Linux distro on CD-ROM involves some work, sure, but the problem is clear; while subverting the OFL is not moral, that clause in the OFL practically subverts itself.</p>
