      <p>The well-known typefaces of which someone has made an open source imitation for potential distribution with Linux that I know of offhand are:</p>
      <p>Times Roman<br>
      Palatino<br>
      Helvetica<br>
      Baskerville<br>
      Century Schoolbook<br>
      Optima<br>
      Goudy Old Style<br>
      Kennerly<br>
      Deepdene</p>
      <p>There are a couple of Clarendons on Google Web Fonts, but no versions that I know of based on major popular Clarendon typefaces.</p>
      <p>Bodoni, Cloister Oldstyle, Jenson Oldstyle, Peignot Bold, Bembo, Poliphilus, Avant-Garde, Futura, Gill Sans and a host of other well-known faces have not yet been dealt with in this manner, even if Bitstream has made versions of some of them.</p>
      <p>In fact, I can't even think of a free Garamond out there. So there's plenty of scope for anyone who feels like making the effort to add an open-source version of a classic typeface to what is out there already. If one deals only with classic typefaces, whose designs have fallen out of whatever protection they may have had in some countries, one won't be taking bread and butter out of the mouths of today's type designers, at least not too badly, I would think.</p>
