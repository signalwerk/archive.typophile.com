    html: |-
      <p>I apologize that I was busy making a major addition to my post, about Richard Stallman's idealism, while you were replying to it.</p>
      <p>In any case, while your point about mimicking precedent is valid, it contrasts with rather than contradicting my post, except perhaps contradicting a misunderstanding on my part.</p>
      <p>Of course non-native designers normally can't properly contribute to the aesthetic development of a script that is alien to them. But when you speak of the OFL harming minority scripts, I had thought in terms of how existing OFL faces for those scripts were most likely to be defective.</p>
      <p>If they don't follow the proper writing rules for the language, then they are unusable for the native speakers of the language to express themselves. Correcting that would be a lot of work, which people in the target area might not be able to do for free. That would obviously be a problem.</p>
      <p>On the other hand, if those faces are fully usable, then they're not doing cultural damage. That any commercial operation seeking to make new styles of type available in the target area for pay would have to do their own Open Type coding doesn't strike me as an issue. If we're talking about a poor country where people can't afford to work for free, we're also talking about a poor country where people can't afford to pay for fonts. So why is the culture endangered by firms serving the rich elite having to do their own work?</p>
      <p>Now, though, this is a massive oversimplification. Most people in the United States would never pay over $1,000 for a font, but they read magazines published by companies that have done so. Poor countries still have businesses in them which have appreciable amounts of capital.</p>
      <p>Poor countries also tend to be small countries, and if they have more complex scripts than ours, the position I have taken so far would seem to demand that their economies support typographical firms larger than Adobe. Except that Adobe supports a lot of scripts, and I had thought it wasn't <em>that</em> hard to specify ligatures and such in OpenType.</p>
      <p>Of course, that's based on a picture of a "complex script" being something like the one for Thai or Burmese, say. Maybe you're thinking of something more along the lines of Nastaliq' - for which, I notice, the Pakistani government has found it necessary to provide a font providing support. I don't know about the quality of that particular font; I've tended to assume it's probably basic and limited. In that case, unlike the case of Brahmi scripts, Ethiopic, and so on, I don't know of any OFL fonts produced by Westerners, though.</p>
