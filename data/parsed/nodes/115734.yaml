      <p>John, mostly I had in mind the extension of existing libre fonts for minority scripts.</p>
      <blockquote><p>we're also talking about a poor country where people can't afford to pay for fonts.</p></blockquote>
      <p>That's where the saving grace of fonts –being tools and not end-products– nicely comes in: the people paying for a good non-Latin font are not the people who most benefit, culturally; the latter are readers, who don't (directly at least) pay anything – the true "end-users".</p>
      <p>Reynir, besides being awake, you'd have to be able to put yourself in other people's shoes.</p>
      <p>People who rip others off have their eyes on money. In contrast, the goal of people in my shoes is helping those who are getting the cold shoulder from professional type designers because OFL is too hippie. We can't ignore our bills. You could say we have a debt both to culture and to corporations!</p>
      <p>hhp</p>
      <p>----</p>
      <p>Today, learn about the Armenian Genocide.</p>
