  html: <p>I'm considering creating a font created from an old typeface from a specimen book with an expired copyright and making it available for free for both commercial and non-commercial use. My goal is to get social media followers. More free fonts could follow if there are signs that the approach works. Do you think that's a realistic goal? Is there something I might have better success with? The typeface I've considered is Bodoni. Do you have a better recommendation?</p>
