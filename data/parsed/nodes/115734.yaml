      <p><cite>In contrast, it's not a good assumption to think that somebody who releases an OFL font is OK with a third party adding some bogus "packaging" and selling the result (even though that would be legal).</cite></p>
      <p>And I absolutely agree with that. The problem I was pointing out, though, is that it's possible to add packaging that's anything <em>but</em> bogus (two complete word processors, the associated office suites, a host of other applications, and the complete operating system they run on)... for less effort than adding bogus packaging would take! To me, at least, that raises questions like "why did they bother" - it seems as though the parties involved hadn't thought the issue through carefully.</p>
      <p>So it's not just that the letter is not enough to enforce the spirit, it's that even the spirit of the license is placed in an awkward spot by the existence of GPL software that uses fonts. Because CD-ROMs are in a standard filesystem which all major operating systems can read, on the one hand, and including OFL fonts as one of the things provided in a Linux distribution does make sense for the users of that distribution.</p>
      <p>Of course, if the intent is really just to make the fonts available, one can still say that refuge is being taken in the letter to violate the spirit. But this case makes things <em>so</em> murky that this particular dichotomy is less clear-cut.</p>
