  - id: 140876
    user: 103
    date: 2004-02-27T13:45:00
    date_raw: 27 Feb 2004 — 1:45pm
    votes: null
    html: <p>My understanding is that it's more of a "within the year" thing <br>than a "coming before the decade's up" thing. <br> <br>It <i>does</i> take two or three years to complete, but production <br>has been underway for a while now.  <br> <br>By the way, the new book is not merely an update to the last  <br>edition. The content has shifted radically with new releases and  <br>licensing changes so there is a lot of new work to do.</p>
