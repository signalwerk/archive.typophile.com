    <p>I am working on an exhibition about Samurai for an American art museum and am looking for designers that I might consult in choosing an appropriate Japanese typeface. </p>
    <p>Japanese will only be used for select wall graphics and headings, and not for lengths of text. We have a curator on staff that is available to write, edit, and proof any text, but I am very much out of my league when it comes to understanding the design connotations of Japanese fonts. I am not so terrified of pairing Garamond with the Japanese version of Hobo (an obvious clash), as I am with pairing the Latin and Japanese equivalents of Bodoni and Tisa in a single headline.</p>
    <p>At the moment, I do not know which Latin typeface I will go with, though it will likely be a conservative serif because the show's objects date from the 13th–19th centuries. </p>
    <p>Thanks for any leads!</p>
