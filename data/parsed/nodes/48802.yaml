  html: |-
    <p>I have just started a new job at a university designing for the art and architecture departments. the art and architecture departments want me to make something very cutting edge, but  the graphic standards of the university are very stringent...i can only use akzidenz and melior. akzidenz i can deal with, but i am not particularly crazy about melior especially because it only has two weights. would i be legally able to create additional weights based on the medium and bold or should i just grit my teeth and bear it?</p>
