  html: <p>I've been doing freelance web and graphic design work for about three years now but have been considering finding a job with a design company to get a more steady source of income. I'm also a student so I'd be looking for something part time. Is it possible to find a part time design job? Where should I look? I've tried craigslist but haven't had too much luck. Also, I'm sure it varies from region to region, but how much can I expect to make at my experience level?</p>
  html_clean: <p>I've been doing freelance web and graphic design work for about three years now but have been considering finding a job with a design company to get a more steady source of income. I'm also a student so I'd be looking for something part time. Is it possible to find a part time design job? Where should I look? I've tried craigslist but haven't had too much luck. Also, I'm sure it varies from region to region, but how much can I expect to make at my experience level?</p>
