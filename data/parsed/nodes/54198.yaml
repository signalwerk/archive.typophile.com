    html: |-
      <p>I'd see if your school has any jobs - my university was wonderful in providing many opportunities for students to find "school friendly" employment. Perhaps your school has similar opportunities? That's where I'd first look.</p>
      <p>You might also see if design studios in your area offer internships. This is a great way to gain experience, build a portfolio, build relationships, and be able to work part-time (although that really depends on the studio). You'll probably not make a lot as far as money goes, but it's usually a great learning experience. Your school may have services to help you find internships.</p>
      <p>As far as pay goes, it all really depends on your portfolio, experience, and focus with a bit of geography and a touch of local economic climate interleaved into the mix. In other words, you'll have to figure that out based on the above variables. You may want to check AIGA (<a href="http://www.aiga.org/" title="http://www.aiga.org/">http://www.aiga.org/</a>) for additional resources on figuring that out.</p>
      <p>Finally - good luck and happy job hunting!</p>
