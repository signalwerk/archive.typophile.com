      <p><em>Is the story of greater use of lower case sans a matter of gradual improvement in the design of the lower case sans letters, which, when they were better, started to be used more often?</em></p>
      <p>Yes Bill, I think there’s a lot in that. The sans was so strange that it was not easy how to figure out a lower case for it – whereas the slab serifs, which just seemed to be rather crude roman types, soon had lower case in roman and italic.</p>
      <p>I dived into this without much preparation, but here to justify my remarks about the German sans is one from the foundry of F. W. Bauer in Frankfurt am Main (not, I think, any relation to Johann Christian Bauer, whose firm became the Bauer’sche Gießerei in Frankfurt), from the technical publication <em>Journal für Buchdruckerkunst</em>, 1858. The size is 14 Didot points. Seems pretty competent to me.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bauer - Mittel Grotesk - 1858 - 500_4102.jpg"></div><p></p>
      <p>English founders do seem to have woken up to the idea much later. Here is a sans from the Caslon foundry in London, from their house journal, <em>The Caslon Circular</em> for October 1878. The size is 2-line English or about 28 point. They introduce it with the note, ‘Many have been the applications we have received for the Doric—or Sans-serif— lowercase, and we have been induced to commence the series so as to supply the want thus indicated.’ In other words we are making a lower case for this font because our customers keep asking for it, not because we want to. They say, without enthusiasm, that it has ‘the quality of plainness’, and that it can’t help being ‘a good wearing letter’. What one might call low-key marketing.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Caslon - Doric 2E lowercase - 500_3846.jpg"></div><p></p>
      <p>More early German examples would be welcome – but not that notorious and much-reproduced condensed sans of ‘1825’, which I hope is now thoroughly discredited.</p>
