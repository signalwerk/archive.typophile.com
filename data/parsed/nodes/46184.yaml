      <p>Another factor may have been that it is harder to see what to do with the lower case and a mono-line look. </p>
      <p>With the upper case, the joins in DPBR are at right angles to the stems, whereas in the lower case many, bdghmnpq, are at a steeper angle. And you have to narrow them more at the joins, like in a serif font, for them not to look clotted. But that compromises the mono-line look to some extent. </p>
      <p>That doesn't answer the question of why they felt they needed a lower case, though.</p>
