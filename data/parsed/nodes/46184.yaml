      <p>One of the small stories here is the use of the one story g in the German sans you put up. I'm wondering whether this was a German practice, based on the black letter style of g. </p>
      <p>Perhaps the one story g is easier to make work in a monoline look, as you have three horigonals, instead of the four in the double story g. </p>
      <p>And the need for a more forced double story g may have influenced the more quirky look of the English Grotesques. That German 'Mittel Grotesque' already has a more even, sober look than the English example.</p>
