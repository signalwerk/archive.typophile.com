    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Field_6561.jpg"></div><p></p>
    <p>This advertisement (tipped into an 1853 magazine), shows a gamut of working styles in the multi-face genre of advertisement that originated in the title pages of books. Blackletter, script, outline, dimensional and decorative styles were also available, but not used in this piece, which represents the basic "look" of advertising typography for much of the 19th century.</p>
    <p>Sans serif faces came into common usage in the 1830s, but with the exception of the odd bold condensed display face, these were all-cap designs, and the idea and practice of using lower case sans serif fonts did not emerge until the 1890s.</p>
    <p>Why did it take so long?</p>
