      <p>That's brilliant James, great samples!</p>
      <p><em>...because our customers keep asking for it, not because we want to...</em></p>
      <p>It seems paradoxical that the sans was more developed in blackletter-using Germany than the UK.<br>
      But perhaps German type culture had less prejudices about what was appropriate for the foreign and already strange-seeming roman letter (as Paul Renner would later demonstrate with Futura).</p>
      <p>Another explanation is suggested in Fred Smeijers' <em>Counterpunch</em>--that by the 19th century type founding had become an industrial institution with clearly demarcated job functions which separated concept and execution, the conceptualizers being marketers, not designers or makers. But why did the marketers not respond to the market's "applications" for a sans lower case? Because it was beneath the diginity of type founders?--They were men of rank, many being engaged in public affairs. James Figgins I, for instance, was an Alderman while directing the Figgins foundry, only retiring from the business when he became an MP in 1868.</p>
