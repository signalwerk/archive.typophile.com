      <p>For what it’s worth, this is my take on the topic. If, as I think, the sanserif letter of the late 18th and early 19th centuries was based first on Roman capitals of the Republican period – up to the first century BCE – which are monoline letters with hardly any noticeable serifs and no thick and thin strokes – and then on earlier Greek capitals, then our lower case letters did not exist at that period and it would have been illogical to add them to sanserif letters of any kind. During the 19th century, quite a lot of display typography using sanserif types, in books at any rate, seems, whether consciously or not, to have a sort of echo of the form of the Roman inscription, and is set all in caps.</p>
      <p>When typefounders began to think that the strange new ‘Egyptian’ (sanserif) design was worth developing (as we know it was already used by signwriters and letter cutters and lithographers and engravers), that argument did not hold out for very long. So you get Thorowgood’s well-known Grotesque round about 1830, which has condensed proportions and a lower case, and does not look remotely like the letters of a Roman or a Greek inscription. And then gradually lower case characters begin to be provided for some sanserif types. My impression is that these happen first, or at any rate more frequently, in Germany, round about 1850.</p>
      <p>But of course anyone could have made a sanserif lower case. In 1810 William Gell published a book about his exploration of antiquities in Greece, and drew this quite nice title page for it using sanserif capitals. He would have been familiar with early Greek monoline inscriptional lettering.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Gell - Itinerary 1810 - 1 title tr a 450_3689.jpg"></div><p></p>
      <p>And this is an engraving of a detail of one of the maps he drew for the book. The sanserif lower case must simply have seemed a sensible addition.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Gell - Itinerary 1810 - 2 lower case - 500_4360.jpg"></div><p></p>
      <p>If there is an earlier sanserif lower case in print than this, of 1810, I have yet to hear of it. (Note that I said in print. During the 18th century there were monoline types with a lower case for impressing lettering in relief for blind people to read.)</p>
