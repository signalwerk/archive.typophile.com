      <p>I wanted to revive this thread for another round of opinions. </p>
      <p>Having spent more time with the above version I find it hard to work with. Specifically trying to match it to supporting fonts, especially in the online context, presented a real challenge.</p>
      <p>For this reason I went back and looked at other type options for the logo. Looked at <a class="freelinking external" href="http://vllg.com/Village/GalaxiePolaris/" rel="nofollow">Polaris</a>, <a class="freelinking external" href="http://www.daltonmaag.com/browse/fonts/dama/effra/" rel="nofollow">Effra</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/storm/etelka/" rel="nofollow">Etelka</a> and <a class="freelinking external" href="http://processtypefoundry.com/typefaces/klavika/index.html" rel="nofollow">Klavika</a> among others, and finally converged to <a class="freelinking external" href="http://www.paragraph.com.au/mentone.html" rel="nofollow">Mentone</a>:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/certtime-r2_4714.png"></div><p></p>
      <p>The goal was to dampen the "technical" feel of the logo, to make it a bit more user-friendly and to be able to re-use Mentone for other design elements such as parts of the website. </p>
      <p>Thoughts ?</p>
