  html: |-
    <p>The brief is as follows - an online digital time stamping service geared towards the design professionals. It needs to evoke feelings of trust, reliability and maturity while still being approachable, friendly and modern.</p>
    <p>This is an early iteration, and I have converged to the following set of typefaces:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/certtime_4129.png"></div><p></p>
    <p>My top choice by a <em>very</em> slim margin is Titilium italic. I also really like the r-t pairing in Sansation, specifically the shape of the 't', and I am considering building it into the Titilium version.</p>
    <p>Alternatively, I am looking at using NeoTech italic, but borrowing 'r' from NeoSans.</p>
    <p>Thoughts ?</p>
