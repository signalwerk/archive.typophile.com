      <p>@CGI - thanks for the suggestion, I gave the ligature idea a try. Merging t's by extending of left t's arm to the right looks not terribly interesting, but it does show some promise. I see two problems with this option though. First is that the ligature falls apart and looks quite odd if each t uses its own color. I guess I can do a gradient, but that's a path leading to the cheesy side :) Second issue is that the wordmark starts to look a bit busy (or fancy) and I really need it to have a fairly restrained and understated appearance.</p>
      <p>@all - I was also pointed out that tighter kerning and alternative shape of 'r' are worth looking at. The kerning suggestion is 100% spot on, applied. With the 'r' there are options:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/certtime-r-500px_6015.png"></div><p></p>
      <p>1. untouched 'r'<br>
      2. 'r' based on 'm'<br>
      3. 'r' based on 'e', take 1<br>
      4. 'r' based on 'e', take 2</p>
      <p>I am definitely not liking #1 anymore. The #2 is more consistent, but #3/4 look more pleasant. Thoughts ?</p>
