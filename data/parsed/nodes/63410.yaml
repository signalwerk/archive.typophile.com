    html: |-
      <p>You could fashion the double ‘t’ into a ligature and thus eschew letterspacing. It's kind of begging for it in the lowercase version, I feel. Doing this would have the fortuitous side-effect of making the logotype more memorable, perhaps even lending a layer of meaning — in the ‘lock’ that would be created between ‘cert’ and ‘time’. You could even include the ‘r' in the ligature if you felt adventurous. </p>
      <p>If you do attempt this, don't just smash the letters into each other, but rather intervene in the letterforms and extend the right arm of the first ‘t’ — and be vewy vewy careful with the ‘r’, should it be involved.</p>
      <p>That said ( in defense of a capitalized version ) may it be useful to have that uppercase ‘T’ in order to point out that there are two  of them? It may serve as a nifty mnemonic for the correct spelling of the inevitable website.</p>
    html_clean: |-
