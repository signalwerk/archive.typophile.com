  html: |-
    <p>Hi guys</p>
    <p>I'm designing a logo for a company which produces expensive bespoke clothing. I want to find a seriphed font which has a classic feel about it - not dissimilar to those used by long-established suit-makers/professional outfitters.</p>
    <p>I want something which is (very) slightly heavier than Garamond. I'm also looking a font which has a slightly unorthodox ampersand.</p>
    <p>Any ideas would be very helpful.</p>
    <p>Thanks,</p>
    <p>Drew</p>
