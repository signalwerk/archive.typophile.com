    html: <p>Greetings seventy7. I am a type and graphic designer living in, of all places, right here in Richmond. Can I be of assistance. I would hate to see the beautiful “wall,” as I called it, covered up. I have a number of Dietz letterpress publications from way back when and they even did some letterpress for me in the 80's. I used to stop and look at it on my way to Poor Richard's for Friday libations, probably before your time.  It is a great typographic landmark here in Richmond. Go take a look at the Farmer's Market if you want to be upset... had wrought iron letters done and put the “A's” up backwards... dim wits! Let me know. Michael</p>
