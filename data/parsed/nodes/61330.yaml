    html: |-
      <p>Guys -- thanks for delving a bit deeper into this.</p>
      <p>I don't think there is an <em>implementation</em> defined limit to the number of stacked accents; I can't remember reading anything about that. Besides, there seems to be no way of knowing which 'number' one particular accent has in its stacking order. <code>mkmk</code> accents only have positions relative to the preceding one, and the very first relative to its parent glyph.</p>
      <p>That said, I'm also not sure why there would be a hard-coded limitation in an OTF drawing routine, it could be written as a simple repeating piece of code (at least, that's how I would've done it ;-).</p>
      <p>I suspect it's more a bug (or 'feature') in the way type gets blitted; it may be to a buffer restricted to the current font height plus ascenders, something like that. Do Word, Notepad, and Wordpad all use the same drawing APIs? (And -- again, just suspecting -- the answer is likely to be 'yes'.)</p>
