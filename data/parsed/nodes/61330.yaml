  html: |-
    <p>To my utter delight, the new <a class="freelinking external" href="http://www.adobe.com/devnet/opentype/afdko/" rel="nofollow">AFDKO</a> now supports proper mark-to-base and mark-to-mark features -- not limited to TrueType 'attachment points', it works perfectly with CFF (Type 1s) as well. So I spend the weekend updating my accents font, removing all rligs that glued a myriad of specifically spaced accents to a few characters and replacing them with a single accent glyph. I even could use the free DTL OTMaster Light to proof them! (And I am utterly convinced the full version is worth its full price, because with that I could have done the positioning straight away!)</p>
    <p>Here's the catch.</p>
    <p>Traditionally, I positioned my accent glyphs <em>after</em> its base glyph, then manually kerned it into place. The positioned accents I created had, therefore, to be of zero width and <em>on the left side</em> of the zero line. After some initial problems, I worked out I still could position its anchor points on the base point per accent:</p>
    <p><code>  markClass [ @ALLTOPMARKS ] &lt;anchor -250 500&gt; @TOP_MARKS;</code></p>
    <p>-- the entire accent glyph is centered horizontally inside a 500 unit wide rectangle. So all I had to do was for umpteen characters figure out where <em>their</em> (optical) center was, and set the position for their anchor:</p>
    <p><code>  position base [ g ] &lt;anchor 240 500&gt; mark @TOP_MARKS<br>
    		  &lt;anchor 240 -250&gt; mark @BOTTOM_MARKS;</code></p>
    <p>Works like a charm in OTMaster. I could even work out vertical stacking of the accents (mark-to-mark). Now the strange thing is, when testing with InDesign CS4, vertical stacking works as advertised, but the <strong>horizontal position</strong> is off by an entire character width. If I type in</p>
    <p>m &lt;acute&gt;</p>
    <p>the acute appears the exact width of the 'm' to the right. I have confirmed this by typing in another 'm' right after the acute, and <em>then</em> the accent was placed perfectly -- on the next 'm'.</p>
    <p>What are the conventions for combining accents? Should they have a non-zero width after all? (I think their widths would be discarded because they're positioned with the mark-to-base feature.) Should they be zero-width and on the <em>right hand side</em> of the null line? (That would imply that, lacking mark-to-base, one would type first the accent and then the base glyph -- which is, I admit, <em>also</em> a historical convention -- typewriter style.)</p>
    <p>Or is OTMaster behaving correctly, and IDCS4 not?</p>
