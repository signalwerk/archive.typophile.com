    html: <p>Scott - over in the Uppercase section...there's a big <br>long thread...it was mostly about lap dancing and SUVs, <br>with a little bit of letterpress thrown in to keep our interest. <br>Anyway, I mention this because Adam King made a post <br>where he mentioned 10+ years of letterpress experience. <br> <br>He's not far from you, in Pasadena. <br> <br><a href="http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=typehack-users" target="_blank">www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=typehack-users</a> <br> <br>Don't forget Hrant and Gerald Lange. <br>Either of those three could probably point you in a good direction. <br> <br>this site might help... <br> <br><a href="http://www.print-world.com/trade_directory/index.asp" target="_blank">www.print-world.com/trade_directory/index.asp</a> <br> <br>and there's a trade magazine called Horse Trader or <br>The Horse Trader that covers Southern California. <br> <br>It's chock full of printer ads. <br> <br>I could dig an old one up, or get a contact tomorrow, <br>just let me know. <br> <br>bj</p>
