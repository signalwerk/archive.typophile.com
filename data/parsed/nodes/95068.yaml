  html: |-
    <p>I am currently developing a web based game that aims to attract players from a large variety of countries. I had planned to use Lubalin Graph Bold Condensed as a headline font in my game. As I understand it, this only supports Latin characters. Can anyone explain what my options are in this case? Is it possible/ feasible to make custom characters for the languages I require? (WGL would probably be enough for me). </p>
    <p>I'd appreciate any advice.</p>
