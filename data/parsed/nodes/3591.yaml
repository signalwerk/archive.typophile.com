    votes: null
    html: "<p>If you work by the centerline method in CorelDraw, round corners are as easy as selecting  Outline Pen, Corners Round. It works with any shape or kind of line. The only problem—which is slight—is when paths with obtuse angles are converted to curves: the radius tends to be a little shallow, but can easily be tweaked.</p>"
