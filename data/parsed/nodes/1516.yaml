    date_raw: 11 Oct 2003 — 11:57pm
    votes: null
    html: <p>Mark, "pretty absorbing" eh? <br> <br>I think Tim and I are experiencing what you did <br>20-some years ago. <br> <br>the Typophile ambigram was really bothering. <br> <br>typo p hile <br>t=e <br>y=l <br>p=i <br>o=h <br>and flip the p. <br> <br>blackletter and conventional, struck out. <br> <br>I sketched out some cursive letters and <br>thought of suburban from emigre, with the <br>lowercase l and y being the same glyph flipped. <br> <br>That made me decide that a script skeleton would work,  <br>but I'd have to fudge a bit on the problematic h/o <br>combination... <br> <br>the bottom one is a half-finished take on <br>word balloon, forum banter, etc. <br> <br> <br><img src="http://www.typophile.com/forums/messages/4100/18413.gif" alt=""> <br> <br> <br>Tim (or Mark), do either of you want to take this and do <br>some of your cool blackletter...while maintaining a script <br>skeleton...i don't know if it'd work. <br> <br>Tim, I like your 'typography' as a late entry for the Tee contest  <br>or an early favorite in the Typophile Tattoo contest. <br> <br>bj <br> <br>ps, this is not experimental! <br> <br>:P</p>
