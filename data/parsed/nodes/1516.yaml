  - id: 12217
    user: 1043
    date: 2003-10-03T20:05:00
    date_raw: 3 Oct 2003 — 8:05pm
    votes: null
    html: <p>I got the Scott Kim book when it was published in 1981 and tried doing some of that stuff myself for a short while. It's not easy, but it can be fun. I find it interesting but ultimately kind of a novelty.  <br> <br>Did you know Scott Kim designed the original Adobe logo? Not only that, some of the illustrations in his book were done using a predecessor of PostScript called JaM. The book was published in 1981 by Byte magazine and has a "backword" by Jef Raskin, the guy who started the Macintosh project at Apple. <br> <br>Kim's stuff is more interesting intellectually, but Langdon's stuff is more aesthetically pleasing.</p>
    html_clean: <p>I got the Scott Kim book when it was published in 1981 and tried doing some of that stuff myself for a short while. It's not easy, but it can be fun. I find it interesting but ultimately kind of a novelty.  <br> <br>Did you know Scott Kim designed the original Adobe logo? Not only that, some of the illustrations in his book were done using a predecessor of PostScript called JaM. The book was published in 1981 by Byte magazine and has a "backword" by Jef Raskin, the guy who started the Macintosh project at Apple. <br> <br>Kim's stuff is more interesting intellectually, but Langdon's stuff is more aesthetically pleasing.</p>
