    <p>Hi All,</p>
    <p>King Fahd Glorious Quran Printing Complex just released Uthman Taha's Bold Naskh Font.  Please download and review, and give us your comments. Keep in mind this is version 0.07 a lot of improvements yet have to come. Zip file contains Normal and Bold fonts and License.txt file. Both Fonts are Free for everyone.</p>
