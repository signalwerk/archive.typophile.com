    html: "<p>I think it's ITC Avant Garde Gothic Bold (which has a close-loop default R unlike other digital cuts of Avant Garde, surprising for such a high profile face—although of course this is the \"original\"). It also has all those famous leaning letters: <a href=\"http://www.myfonts.com/fonts/itc/avant-garde-gothic/std-bold/glyphs.html\" title=\"http://www.myfonts.com/fonts/itc/avant-garde-gothic/std-bold/glyphs.html\">http://www.myfonts.com/fonts/itc/avant-garde-gothic/std-bold/glyphs.html</a></p>"
