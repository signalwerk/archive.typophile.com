      <p>António -</p>
      <p>I do not know whether it is exactly the same book, but Frutiger's "Sinais e Símbolos" is available here in Brasil from Martins Fontes Editora (in Portuguese, of course). I quote from the review:</p>
      <p>"Não existem elementos casuais em nosso redor ou dentro de nós, mas toda matéria obedece a uma composição ordenada. Até o traço ou o rabisco mais inocente não pode existir acidentalmente, por puro acaso, mesmo que o observador não reconheça claramente as causas, a origem e o motivo desse "desenho". É a partir de considerações como essas que Adrian Frutiger leva o leitor a reconhecer e julgar com mais facilidade a origem, o sentido e a mensagem dos sinais e símbolos."</p>
      <p>Take a look at <a href="http://www.martinsfonteseditora.com.br/detalhes.asp?ID=552685" title="http://www.martinsfonteseditora.com.br/detalhes.asp?ID=552685">http://www.martinsfonteseditora.com.br/detalhes.asp?ID=552685</a> and Boa sorte!</p>
      <p>Ronald  Kyrmse<br>
      ronald.info.ms</p>
