    <p>Hello,</p>
    <p>I have been searching far and wide for the owner of this font (see attachment). I would like to purchase it for a museum project. Please contact me asap if you have any leads.</p>
    <p>Font Name: YoBaby Outline<br>
    Created by Southern Software 1993 (this info was in the font file when I clicked “Get info” on a Mac)</p>
    <p>Thank you!<br>
    Susan Brzozowski<br>
    Tsang Seymour Design Inc. NYC</p>
