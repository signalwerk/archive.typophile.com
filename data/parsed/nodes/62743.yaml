    html: "<p>I have to admit that I prefer a lot of this sort of vernacular lettering to the imperial monumental inscriptions à la Trajan's column. The letters in the latter are magnificent but frankly the overall impact is massively dull: like most authoritarian design it lacks the human dimension. There's a liveliness in Antonio's far from perfect examples that the more famous monumental inscriptions lack.</p>"
