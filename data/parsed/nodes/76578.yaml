    html: |-
      <p>You can homebrew it, in theory, for your own use. Use Type 2.2 light (Windows, from CR8) or FontForge (Linux/Unix) on a freely-available Helvetica-style font (Free Sans bold, TeX Gyre Heros bold, URW Nimbus Sans bold -- all available under an open-source licence) to remove the centres from the letters you want all-black.</p>
      <p>If you don't have the time, I reckon the blokes here can whip up a custom job for you. Likely to cost a small bit, but they'll know better than I.</p>
