      <p>James you are right, but when I say "overused" it also implies poorly used, since countless amateurs do their own graphics now. </p>
      <p>Overuse of Helvetica is not as annoying (to me) because it's not a "novelty" font and fits in quietly, without crying "Why am I here? I don't belong here!" </p>
      <p>I saw one business card recently which used Papyrus appropriately for the subject, and looked rather elegant. But I still winced at the sight. Considering there are hundreds of suitable fonts NOT done to death. </p>
      <p>I realize that inexpertise is fine with the majority. Most people do have a specialty or area of expertise in which they instantly recognize and disapprove of hack work, while most others are oblivious. </p>
      <p>Thanks to my lurking on this site and others, I now recognize typographical hack work; at one time I wouldn't have noticed.</p>
