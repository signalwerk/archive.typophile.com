      <p>I once designed a logo for a client — sent the first proof, made some revisions, sent the second proof — weeks went by and we hadn't heard a thing. We figured they backed out and we were never going to heard from them again. Then, about 3 months later, I'm watching TV and I'm like, “Hey! That's my logo!”. Naturally, we immediately sent them an invoice for the logo design. Now get this — instead of <em>paying</em> us, they stop using our logo and pull a new one out of thin air that featured no other but Papyrus in all of its faux classy exoticism. </p>
      <p>Moral of the story: Make sure you rasterize your vector art during the proofing process.</p>
