      <p><em>Overused is not a valid criticism.</em></p>
      <p>In theory no, but in practice it's another matter.<br>
      If everyone uses the same materials and tools without much imagination (and even the best of us can't hit a home run every time we come to the plate), then everything starts to look the same. Working with common materials, people fall into ruts.<br>
      But working with little used typefaces, you're more likely to come up with something that looks different, not just because the typeface is different, but because there are less clichés to fall back on in the way that it's used.</p>
