      <p>Overuse is not a poor trait in and of itself, but it makes poor use much easier. When a typeface like Arial, Comic Sans, or Papyrus enters ubiquity because of its accessibility, the vast majority of its applications are poor and cheap-looking. Thus, those typefaces can no longer escape the connection with unprofessional and cheap design that they carry, and it becomes increasingly difficult to use them well.</p>
      <p>The reason that other typefaces that are probably overused (most notably Gotham and Helvetica) escape (mostly) this same criticism is because the majority of their applications are professional and well-done, because they are not accessible to just anyone who has a computer (although Helvetica comes bundled with Macs, the vast majority of computer users, and especially businesses, still use Windows boxes).</p>
      <p>I'd be interested to see what the type community thinks of Calibri ten or fifteen years from now. It certainly doesn't carry the same baggage as Arial, and it's certainly an attractive font now, but is it going to be so ubiquitous and so often poorly used that it will carry the same air of unprofessionalism as Arial?</p>
      <p>(Sorry to divert the conversation away from specifically Comic Sans and Papyrus, but I think that Arial is the greatest victim of poor use through overuse. I've gone so far as to tell people, "There is no application of Arial where something else would not be more appropriate, unless you're trying to be intentionally unprofessional." I think there are still some viable uses of Comic Sans and Papyrus.)</p>
