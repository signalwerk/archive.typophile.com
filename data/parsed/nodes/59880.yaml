      <p>I have a former client that PAID me for a logo just so he could kill it - had a new one made by a student; the new one has a major kerning problem - and he's really proud of it.</p>
      <p>So ... I've got nothing.</p>
      <p>steve mehallo<br>
      tinyurl.com/mehallofonts<br>
      mehallo.com</p>
