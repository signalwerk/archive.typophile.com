    <p>Yesterday I was strolling at a local summer festival with hundreds of vendors in their booths. I couldn't help observing graphics and pointing out many instances of the dreaded (to us) Comic Sans and Papyrus fonts (especially the latter) on logos and business cards, banners, adverts, etc. </p>
    <p>I spotted an advert with BOTH! - a first for me. I know y'all will appreciate this. Here it is:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/comicsans-papyrus-8i_6036.JPG"></div><p></p>
    <p>My husband has limited tolerance for my diatribes about unbearably overused fonts and says: "So what? As long as it looks nice." etc. </p>
    <p>That troubles me because it is fundamental to my identity as an artist to value creativity and originality over banality and mimicry. </p>
    <p>It got me thinking that many people don't recognized "overused" as a pointed criticism. </p>
    <p>To them, if something is used a lot, that means it's popular.  Popular = good = accepted standards = something I should do too = a feeling of belonging.  </p>
    <p>That explains the blank looks I often get when pointing out that something, anything, is unbearably overused.</p>
