      <p>This is the culmination of the naive typography typical of small, home-grown businesses that do all their own work. I am sure the fonts fall into the "what-we-have-on-our-computer" set. The street vendor is just trying to make a buck on the cheap.<br>
      Actually, work this naive has a charm I can forgive from a mom&amp;pop shop. I am not saying it is good design but that it is not criminal looking as it might be if it were done by a larger corporation with more budget and experience that should know better.</p>
      <p>It reminds me of tiny family businesses across the land and it makes me smile. It brings back memories of my uncle Gus's homemade candy store and his self-made posters--badly hand painted signs but the hand dipped chocolates were to die for :-)</p>
      <p>Yasou, Uncle Gus! May you rest in peace.</p>
      <p>ChrisL</p>
      <p>Thanks, Dina, for the memories!</p>
