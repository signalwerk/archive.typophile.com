      <p>You know, the only approach is I know is to tell the client that it makes them appear unsophisticated and let them know that there are designers out there that spend their free time posting messages about how unsophisticated this client is and that we make fun of and laugh at them every any chance we get. </p>
      <p>We tell our friends about them and come up with all kinds of insults about how dumb, inferior and juvenile they are and how their picks are the equivalent of serving Spam at a wedding banquet and is that how they really want to represent their company?? </p>
      <p>And I mention how the fashion magazines they read wouldn't use those fonts, so obviously they are so out of touch, they should start buying things from the Franklin Mint, should own a velvet Elvis painting (without the irony) and ... Well, typically at that point, they stop talking to me and it's all moot. </p>
      <p>Then their resolve kicks in and they insist to do it just to be dumb and spite me.</p>
      <p>I have a former client that PAID me for a logo just so he could kill it - had a new one made by a student; the new one has a major kerning problem - and he's really proud of it.</p>
      <p>So ... I've got nothing.</p>
      <p>steve mehallo<br>
      tinyurl.com/mehallofonts<br>
      mehallo.com</p>
