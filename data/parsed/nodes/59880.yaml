      <p>Overused is not a valid criticism, it’s a pretentious criticism leveled by people who like to think that their less popular preferences are better just for being less popular. If we applied that criticism to music most of what’s ever been written would be of no value because so much of it is built on the same simple foundations. Designers who gripe about typefaces being overused need to realize that they sound just like indie music fans who can’t shut up about how they liked a band <em>before</em> they were cool.</p>
      <p>Poorly used, however, is a valid criticism. And this is an excellent example of how two fonts can be very poorly used. Neither is appropriate for this kind of signage, nor have they been typeset well. The images are uninspired, the color palette thoughtless, and the layout appears to be recycled from a bad take-out menu. And it’s probably an inkjet print that will fade quickly and look like hell when it does. That’s why this sign is so much worse that the myriad good signs in Helvetica that we don’t gripe about so much, not matter overused Helvetica is.</p>
