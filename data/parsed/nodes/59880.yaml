      <p>I know this has been discussed to death here. But only recently did I realize that Papyrus is the only installed font that conveys "elegance" to the untrained eye. This elegant look, they believe, classes up everything: frozen yogurt, hemp sneakers, computer services. To their eye, it really is distinctive. </p>
      <p>At business networking events, I frequently spy Papyrus-adorned cards. Like this: The website is very minimal, but there's the Papyrus on black: <a href="http://www.jabezproductions.com" rel="nofollow"><strong>Jabez Productions</strong></a></p>
      <p>So, elegant = Papyrus. Friendly = Comic Sans. Official = Times Roman. Everything else = Arial. (Combining the first two: Elegant AND friendly??)</p>
      <p>I redesigned a website for a Bed &amp; Breakfast with a calligraphic title, headers, and navbar that really were elegant in: <a rel="nofollow"><strong>Kallos</strong></a>.<br>
      Then the owner insisted all text be in Comic Sans. I explained it clashed with the look of the headers. I told her "friends don't let friends use Comic Sans." She insisted stubbornly - this was her "signature font". I wince when I view the pages, but she's very pleased</p>
      <p>For her printed lit, I convinced her, after much persuasion, to let me use Maiandra for the text instead of Comic Sans.</p>
