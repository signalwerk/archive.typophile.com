    <p>Narrator: Needless to say, the luncheon there under the trees was a great success, and a good time was had by Puritan and Indian alike. Everything came of beautifully with the exception of one minor catastrophe.</p>
    <p>Mayor: What do you mean you cooked the turkey, Charlie?</p>
    <p>Charlie: Well, I cooked the turkey, that’s all.</p>
    <p>Mayor: You put our national bird in the oven. Is that correct?</p>
    <p>Charlie: Yeah, well I, uh …</p>
    <p>Mayor: And all of us had our mouths set for roast eagle with all the trimmings.</p>
    <p>Charlie: Yeah, well I, uh …</p>
    <p>Mayor: You did a thing like that?</p>
    <p>Charlie: Well, the two birds were lying there side by side.</p>
    <p>Mayor: The *turkey* was for the centerpiece, Charlie, I mean …</p>
    <p>Charlie: Well, they looked so much alike that I, uh …</p>
    <p>Mayor: Well, we blew it now. They’re all sitting down at the tables out there.</p>
    <p>Charlie: Yeah, yeah.</p>
    <p>Mayor: … starting on their little nut cups already. Just have to switch the birds, that’s all.</p>
    <p>Charlie: Yeah, well …</p>
    <p>Mayor: Serve them turkey instead of eagle. But it’s kinda scrawny-lookin’, isn’t it?</p>
    <p>Charlie: Yeah, well I thought I’d stuff some old bread in it and make it look a little fatter.</p>
    <p>Mayor: You do that, OK?<br>
    Charlie: OK. Narrator: Needless to say, the luncheon there under the trees was a great success, and a good time was had by Puritan and Indian alike. Everything came of beautifully with the exception of one minor catastrophe.</p>
