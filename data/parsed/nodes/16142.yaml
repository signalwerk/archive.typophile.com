      <p>For Chris: *Dummm da dum dummm…. dummm da-dum dum dummm….*</p>
      <p>Narrator: The legend you are about to hear is true, only the needle should be changed to protect the record.</p>
      <p>*Dummm da dum dummm…. dummm da-dum dum dummm….*</p>
      <p>St. George: This is the countryside, my name is St. George, I’m a knight. Saturday, July 10th, 8:05 p.m. I was working out at the castle out on the night watch when a call came in from the chief: A dragon had been devouring maidens. Homicide. My job: Slay ‘em.</p>
      <p>*Dummm da dum dummm…. *</p>
      <p>St. George: You call me chief? </p>
      <p>Chief: Yes, the dragon again, devouring maidens. The kings daughter may be next. </p>
      <p>St. George: Mmmhmm…You got a lead? </p>
      <p>Chief: …eeh, Nothing much to go on. Say did you take that 45 automatic into the lab to have them check on it? </p>
      <p>St. George: Yeah, you were right. </p>
      <p>Chief: I was right? </p>
      <p>St. George: Yeah, it was a gun</p>
      <p>*Budumm budumm dumm da-dummmm*</p>
      <p>St. George: 8:22 p.m. I talked to one of the maddens who had almost been devoured.</p>
      <p>*knock knock knock* [door opens]</p>
      <p>St. George: Could I talk to you Maam? </p>
      <p>Madden: who er you? </p>
      <p>St. George: I’m St. George maam. Homicide maam. I want to ask you a few questions maam. I understand you were almost devoured by the maam is that right dragon? </p>
      <p>Madden: It was terrible, he breathed fire on me, he burned me already! </p>
      <p>St. George: How can I be sure of that maam.</p>
      <p>Madden: Believe me, I got it straight from the dragon’s mouth!</p>
      <p>*Dummm dummm dum dum da-dummmm!*</p>
      <p>St. George: 11:45 p.m. I rode over to the kings highway, I saw a man, I stopped to talk to him. Pardon me sir, could I talk to you for just a minute sir? </p>
      <p>Nave: Sure I don’t mind. </p>
      <p>St. George: What do you do for a living?</p>
      <p>Nave: I’m a nave. </p>
      <p>St. George: Didn’t they pick you up on a 903 last year for stealing tarts? </p>
      <p>Nave: Yeah, so what do you want make a federal case out of it? </p>
      <p>St. George: No sir. We heard there was a dragon operating in this neighborhood. We just wanted to know if you’d seen him. </p>
      <p>Nave: Sure I’ve seen him. </p>
      <p>St. George: Mmhmm, could you describe him for me? </p>
      <p>Nave: What’s to describe, you see one dragon you’ve seen ‘em all! </p>
      <p>St. George: Would you try and remember sir, just for the record. We just want to get the facts sir. </p>
      <p>Nave: Well, he was, you know, he had orange polkadots… </p>
      <p>St. George: Yes sir. </p>
      <p>Nave: …purple feet, breathing fire and smoke, </p>
      <p>St. George: mmmhmm </p>
      <p>Nave: …and one big bloodshot eye, right in the middle of his forehead, and uh, like that. </p>
      <p>St. George: Notice anything unusual about him? </p>
      <p>Nave: No, he’s just the run of the mill dragon, you know. </p>
      <p>St. George: Mmhmm, yes sir, you can go now. </p>
      <p>Nave: Hey, hey! by the way, how you gonna catch him? </p>
      <p>St. George: I thought you’d never ask. A dragon net.</p>
      <p>*Dummmmmm duuummmm dum dumm dummmmmmmmmm….*</p>
      <p>St. George: 3:05 p.m. I was riding back in to the courtyard to make my report to the lab, then it happened.</p>
      <p>*Du-dummmm*</p>
      <p>*Roar!* </p>
      <p>St. George: It was the dragon </p>
      <p>Dragon: Hey, I’m da fire breden dragon, you must be St. George right?! </p>
      <p>St. George: Yes sir. </p>
      <p>Dragon: I see you got one of those new 45 caliber soards </p>
      <p>St. George: That’s about the size of it.</p>
      <p>Dragon: Wuhaaahahayayahaaaagh, you slay me! </p>
      <p>St. George: That’s what I came here to talk to you about. </p>
      <p>Dragon: Wuh do yuh mean? </p>
      <p>St. George: I’m take’n you in on a 502, you figure it out. </p>
      <p>Dragon: What’s the charge. </p>
      <p>St. George: Devouring maddins out of season.</p>
      <p>Dragon: OUT OF SEASON! YOU’LL NEVER PIN THAT RAP ON ME, DO YOU HEAR ME, COP! </p>
      <p>St. George: Yeah. I hear ya. I got you on a 412 to. </p>
      <p>Dragon: A 412! WHAT’S A 412!! </p>
      <p>St. George: Overacting. Let’s go.</p>
      <p>*Dumm du-dummm, dum da-dum da-dum*</p>
      <p>Narrator: On September the 5th the dragon was tried and convicted. His fire was put out and his madden devouring license revoked. Maden devouring out of season is punishable by a term of not less than 50 or more than 300 years.</p>
      <p>*Dumm du-dummm, Dummm, Dummm Dummmmmmmm…*</p>
