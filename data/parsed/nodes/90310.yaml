      <p>I'm aware of the limitations of Word—I worked as a typesetter and graphic designer in print publishing for a few years before starting law school, and I've been an InDesign proponent since CS2. </p>
      <p>Problem is, the editorial workflows of most LRs don't lend themselves to professional typesetting. Most journals operate on a shoestring budget, and the typical workflow has  the upper-level editors overseeing the process of typesetting the manuscript using VBA macros supplied by the company that does the vast majority of LR publishing. </p>
      <p>Even if we could afford multiple seat licenses of the software, training anyone besides myself wouldn't be an option, since the turnover in LR boards is annual. I love working in LaTeX—and it's a less expensive option—but most law students are scared to death of anything that looks like code.</p>
      <p>The control over paragraph composition in Word is abysmal, but the VBA Word macros use now supports things like kerning, tracking, ligatures, and certain opentype features. It offends my sensibilities as a typographer, but working within Word is the best option I have as far as making sure that any improvements I make aren't lost as soon as I graduate. It's a compromise, but if we can become the *only* law review in the entire country not to use fake small capitals, I will be very happy.</p>
