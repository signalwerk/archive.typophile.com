      <p>It does have to conform to bluebook style, so the footnotes will be heavy with small caps and so forth.</p>
      <p>Part of the redesign will definitely find involve getting a new type family that has SCs, italic SCs, superiors, and ideally a display weight and a pi font. I've got a few ideas in mind--but that isn't the hard part.</p>
      <p>I was asking for designs because I've had such a hard time finding any journals that seem *designed* instead of just the product of a Word macro or LaTeX (we'll be using the former, sadly). I'm sure I can do a competant job producing something that looks good and doesn't violate the conservative norms of the medium, I just prefer to have seen a couple examples of good work before I set out on my own.</p>
