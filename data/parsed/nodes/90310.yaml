      <p>I’m not sure it’s really the type of examples you’re awaiting, but you can look up nearly any math journal. They all use LaTeX, so have a minimal quality standard (true small caps, true superscript, etc.), even though the font is often Computer Modern (which is one of the only font to have true optical sizes from 10pt down to 5pt).</p>
      <p>See, for example, the <a class="freelinking external" href="http://www.ams.org/journals/bull/0000-000-00/" rel="nofollow">Bulletin of the American Mathematical Society</a>.</p>
