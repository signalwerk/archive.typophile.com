    html: <p>For all  know, Word will fake the small caps even if true-cut are in the font. The work-around, of course, is to use an old-style Type-1 font format, where the small caps are in the lower-case a-z position, and do a font change when you need small caps. But given your work flow, that's still a bit awkward.</p>
