    html: |-
      <p><cite>It shouldn't be too bad: I have a separate style set up for the SC, and at the stage at which most of the editing is done, the editors use boldface to stand in for SC. The Macro will swap all the bold out for the SC style.</cite></p>
      <p>I've played around with getting true-cut characters in ebooks, which is essentially the same problem. Putting them in the old ASCII positions in separate fonts is the only solution I've come up with, for both small caps and superiors. There are several problems with this: First, kerning is blocked across font changes. If you want it, it is handwork. </p>
      <p>And with the small caps, anyway, you now have the wrong character, a lower-case letter where a cap should (usually) be. I solved this by putting the small caps in both the upper &amp; lower case ASCII positions, but given the legal style, that would just increase your burden. Still, if a "display" (print &amp; ebook) edition is all you care about -- no syntactically correct Unicode files ever needed -- this approach would work.</p>
      <p>To do all this right, you'll swapped the expense of InDesign for the expense of FontLab. Or maybe you can work in the <cite>Libre</cite> program, FontForge...</p>
