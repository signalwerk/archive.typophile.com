    <p>I'm beginning work on a non-radical design update to the interior an American Academic Journal (a law review) and am looking for examples of well-done interior design in this medium. </p>
    <p>Most U.S. law journals use Times, fake small caps, fake superscripts, vertical space between consecutive paragraphs, unconscientious justification, etc. Any examples (in any field) to the contrary? Thanks.</p>
