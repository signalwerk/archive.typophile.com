  html: <p>Hello, <br> <br>Me again. <br> <br>I've downloaded a font. Made some heavy modifications to it, now I want to generate new font files to install to my system. How do I rename the font? When I try to install it in Windows, it think its an exact duplicate. I want both the original and my mod font on the system. <br> <br>Any help is greatly appreciated. <br> <br>Thanks, <br>Lucas</p>
