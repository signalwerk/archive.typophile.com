      <p>&gt; <em>Thanks Bald. Couldn’t find “Barmeno Next” though. The only Barmeno’s I can find are Barmeno BQ and Barmeno BE (what’s the difference?).</em></p>
      <p>Barmeno Next was an <a href="http://www.linotype.com/2095/avenirnext.html">in-joke</a>. ;^)</p>
      <p>Use FF Sari, not Barmeno. When you purchase a license for <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories=1&amp;font_categories_search=font_name_search&amp;searchstr=ff+sari">FF Sari</a>, you support <a href="/wiki/Hans%252BReichel" class="wiki">Hans Reichel</a>, the designer who created Barmeno and its almost identical twin FF Sari. If you purchase a license for Barmeno, you just make some lawyers who work for a rotten apple a little richer. Read all about it in <a href="http://typophile.com/node/1394">this thread</a>.</p>
