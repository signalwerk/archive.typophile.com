    html: |-
      <p>I designed the letters for the Ministry Logo. It isn’t a font. They use to use Times but I refined their logo and they chose my design. So I designed the letters to go with it. It was a bit tough to make it work on an arch but it was finalized then made into an eps file in Illustrator from the letters made in Fontographer I believe since it was before FontLab might have been finished.</p>
      <p>I was trying to pick-up how they wanted to round off the logo and the way they changed the inner holes of the globe.</p>
