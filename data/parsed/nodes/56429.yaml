    <p>I’m in my fourth and final year of a design degree and am working on my final project. The project is a hypothetical, where the advertising industry (’Madison Ave’) is feeling the effects of the global recession and is embarking on a widespread advertising campaign. The whole thing is very much anti-advertising, and is designed to highlight how the idea of ’the consumer’ is really a product of the advertising industry. <a class="freelinking-external" href="http://www.danflan.com.au/links/poster.jpg">This</a> might give you a better idea of the whole idea, or if your really keen I’ve posted my brief up <a class="freelinking-external" href="http://danflan.com.au/madisonave/?page_id=2">here</a>.</p>
    <p>Anyway, although its all early stages at the moment, I’m up to the visual identity bit (small part of the assignment, but pretty important for everything to come), and am eager to get some outside feedback.</p>
    <p></p><div class="imageWrap"><img src="/files/Post1_1_6202.jpg"></div><p></p>
    <p>Visually, the aim of the identity is to appear slightly detached from the content. I want the logo to be somewhat ambiguous — playfully neutral — and hardly distinguished from a design one might expect from companies manufacturing pharmaceuticals or light-globes. Aside from a few clues, the logo that I have identified doesn’t say all that much about the ‘client’, and isn’t supposed to.</p>
    <p>The alternate ideas all had a few issues associated with them (the first one is a bit cliche, the second one doesnt scale well), but have included them here for good measure.</p>
    <p>Finally, I know this is probably too much to ask, and of course feedback in any form would be massively appreciated, but I’ve set up a blog at <a class="freelinking-external" href="http://www.danflan.com.au/madisonave">http://www.danflan.com.au/madisonave</a> (as an assessable task) to keep track of the project and for this sort of thing so any posts on that page would be appreciated beyond belief,</p>
    <p>Anyway, love to hear what you think, criticisms and any suggestions,</p>
    <p>Thanks in advance,</p>
    <p>Dan Flan</p>
