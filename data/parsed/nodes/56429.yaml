      <p>Eliason:<br>
      I agree with your observation, some of the revised designs are strikingly similar to the Mad Men logo. Out of curiosity, do you think that this is necessarily a bad thing considering their common origins? Is this (originally unintended) pop-culture reference at all appropriate?</p>
      <p>Incidentally, Mad Men season 1 is due to air on Australian free to air in the next few weeks, looking forward to seeing whether it lives up to the hype..</p>
      <p>Will:<br>
      Thanks for your suggestion, I’ll give it a go in the next round</p>
      <p>Epsillicon:<br>
      That ad is amazing, thanks for posting it. He’s living the dream</p>
      <p>Alaskan:<br>
      Thelma and Louise is actually only two degrees from Kevin Bacon. Geena Davis was in Cutthroat with Frank Langella who was in Frost/Nixon with Kevin Bacon</p>
      <p>Litera:<br>
      I really like your suggestion for the name, and in an ideal world I would probably run with it. However, such an application would probably go over the head of the intended audience. Speaking with people about my project so far, I’ve found that a lot of people— although liking the name — have never heard of Madison Ave. and those who have often don’t make the association with advertising. Being clever with the name like that would almost certainly add to the confusion.</p>
      <p>You’re completely right about the two lines under AD being distracting and looking like illegible text, thanks for that, I’ll keep it in mind with upcoming revisions. And thank you for liking the colours, I’m also really happy with them.</p>
      <p>To answer your question, as you guessed, I’m being a bit indecisive, but I think I’m probably more inclined to highlight the MAD as suggested by William. I’m only continuing to highlight the AD to address the above problem of people not linking Madison Avenue with advertising. </p>
      <p>What do you think? Have I been speaking to a select few people who just don’t get the reference?</p>
      <p>Thanks for your words,</p>
      <p>Dan</p>
