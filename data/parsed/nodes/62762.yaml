      <p>Ah. I misunderstood. When you said you were "from Australia" I didn't assume you were still there. I took that to mean you were in the USA now and because you were raised elsewhere you'd never seen Stove Top Stuffing. My mistake.</p>
      <p>However, "they exist in two completely different markets" is not a valid argument, in my opinion. That's like saying people who work in the print industry have never been to the supermarket and therefore wouldn't notice. People who write/read/print/sell books don't eat, right? </p>
      <p>It's not like you can make a logo for a bookbinder out of the Coca Cola script and not expect people to associate the two.</p>
      <p>I do concede that the Stove Top association is irrelevant in a country without Stove Top, but that doesn't mean it looks like a mark for a fine bookmaker. It looks like a food logo, as several people in this thread alone have seen - it reminds people of cookies, supermarkets, <em> <strong>and</strong></em> stuffing.</p>
      <p>If this is solely a US reaction, obviously, you're ok. But I think it's worth asking some local designers before you submit it to the client....</p>
