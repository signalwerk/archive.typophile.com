    html: <p>I tend to disagree with the comparison with Stove Top. As I've mentioned before, I've never seen this logo/product before (I'm in Australia, and I'm pretty sure it's not on our shelves), and as MrKikkoman has mentioned, they exist in two completely different markets. Thanks for pointing this out to me, but I think it's time to move on :). The branding (utilisation of the mark) is where the difference is created, and going from the concepts I am working with at the moment, this isn't going to be an issue whatsoever.</p>
