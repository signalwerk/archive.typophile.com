      <p>I immediately thought of the <a class="freelinking external" href="http://www.tollbrothers.com" rel="nofollow">Toll Brothers</a> logo (which made me think of Toll House Cookies - now I'm hungry!). Here is their custom font: <a class="freelinking external" href="http://www.ms-studio.com/FontDev/tollbros.html" rel="nofollow">http://www.ms-studio.com/FontDev/tollbros.html</a></p>
      <p>I guess it was just the swashes and the capital "T" that made the connection in my head.</p>
      <p>Maybe you can customize the swashes and/or the way things overlap more so everything is more integrated. Right now I am +1 for what eliason said - word positioning is not quite right.</p>
      <p>Here is a thread that I came across that has a well integrated swash-style logo. I kind of like the heavy weight they used: <a class="freelinking external" href="http://new.myfonts.com/WhatTheFont/forum/case/189400/" rel="nofollow">Vanilla Splits</a></p>
