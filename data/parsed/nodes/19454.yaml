    <p><strong><a href="http://www.fontplay.com/images2/brushpenmktrio.jpg" target="_blank">THIS</a></strong> is the first in series that takes the two-headed doll to the next step. I have several different three panel strips made from doll photos I’ve taken. (dialogue suggestions gladly accepted)</p>
    <p>Font is Brushpen MK by Manfred Klein</p>
    <p><strong><a href="http://www.fontplay.com/images2/paquitatrio.jpg" target="_blank">PART II</a></strong></p>
    <p>Font is Paquita by Juanjez Nikis - Thought ballon is from Blambot.com</p>
    <p>The first balloon contains a line I saw needle-pointed<br>
    on a pillow at an antique store this afternoon.</p>
