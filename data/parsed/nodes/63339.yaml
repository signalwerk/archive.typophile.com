    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 21.Oct.2009 12.11pm </div>
      <p>Help restoring the Bodoni originals…<br>
    ... by becoming an affiliate to an alphabet of your choice.</p>
    <p>The association “Friends of the Palatina Library and the Bodoni<br>
    Museum” have created the initiative “Adopt a Bodoni alphabet” whose<br>
    aim is to restore the full set of more than 600 alphabeths, their punches<br>
    and matrices.</p>
    <p>Located in Parma, Italy, the Museum needs to raise funds to be able to restore the lead characters,<br>
    which also need to be conserved in an appropriate polycarbonated box.</p>
    <p>With a few hundred euros you can become affiliate of one of your alphabets<br>
    of choice. Or maybe you would like to adopt an entire Bodoni family?</p>
    <p>The mentioned sum is used to restore an alphabetical set of Bodoni<br>
    punches, currently in bad condition, oxidized and stored in an<br>
    inappropriate place, and put it in a purpose-made polybicarbonate box for<br>
    a proper preservation.</p>
    <p>With some more money it is possible to restore a series of punches<br>
    preserved in the original wooden cases.</p>
    <p>The restoring is made by Studio Paolo Crisostomi in Rome, an experienced<br>
    workshop dealing with antique and bibliographical stuff.</p>
    <p>The donors will be publicly acknowledged and as affiliated will be<br>
    recognizable by a plate on the case in which the punches will be stored,<br>
    in the Museum’s exhibition.</p>
    <p>For more info: Typevents Italy - Simone Angelica Wolf (Via Del Pozzo 6 -<br>
    Reggio Emilia, phone 334-1814389, e-mail <a href="mailto:simone@typevents.com">simone@typevents.com</a>).</p>
    <p><a href="http://www.typevents.com/index.php?id=422,0,0,1,0,0" title="http://www.typevents.com/index.php?id=422,0,0,1,0,0">http://www.typevents.com/index.php?id=422,0,0,1,0,0</a></p>
