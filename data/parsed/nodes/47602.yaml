      <p>thanks everyone for the suggestions ! these chiseled solids are consistent with what i was thinking... that's encouraging. i'll be experimenting with several of these. </p>
      <p>paul: feisar is supercool ! </p>
      <p>one thing that has become a rather daunting issue (switching over to a license thread) is the standard EULA i'm finding regarding film usage. yes, i read them completely. there's rather unclear clauses in the the font bros, house, and font diner EULA's about annual broadcast schedule and mandatory renewal of the license annually... not sure i understand the clause but i have written to the foundries seeking clarification. i love the house 3009 package but the EULA may be prohibitive. this drives me nuts. i don't want to show a design to the client if it comes attached to a maintenance/renewal issue. i'm not sure there's an entity in place to deal with that once the film is distributed. it's a science film, not a hollywood blockbuster.</p>
      <p>i'm also going to take a shot at designing my own title - not a font per se, but a custom type treatment. </p>
      <p>any further suggestions are welcome!</p>
