    html: |-
      <p>It's really hard to recommend futuristic fonts, since there have been so many different perceptions of what type will look like in the future, almost all of which, in a different context, look very retro. My favorite version of the future is a movement back towards Art Deco, so something like <a class="freelinking external" href="http://www.veer.com/products/typedetail.aspx?image=UMT0000122" rel="nofollow">Mostra</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/itc-anna/" rel="nofollow">Anna</a> could be what you're looking for. Anna is pretty prevalently used in Tomorrowland in the Disney parks.</p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/bank-gothic/" rel="nofollow">Bank Gothic</a> is pretty popular for conveying a futuristic feeling, but it may be too closely associated with Chipotle and sci-fi movies.</p>
      <p>You could go for something like <a class="freelinking external" href="http://www.myfonts.com/search?params[boolean]=and&amp;params[searchtype]=fonts&amp;search[text]=computer" rel="nofollow">Computer</a>, which has kind of a 1960s perception of the future.</p>
      <p><a class="freelinking external" href="http://www.myfonts.com/search?params[boolean]=and&amp;params[searchtype]=fonts&amp;search[text]=handel%20gothic" rel="nofollow">Handel Gothic</a> is what the future looked like in the early 80s.</p>
      <p>Or you could do the ironic "World of Tomorrow!" look, which you can achieve with almost anything from <a class="freelinking external" href="http://www.fontdiner.com" rel="nofollow">FontDiner</a>.</p>
      <p>Good luck!</p>
