    <p>greetings earthlings. i'm getting started on a large publicity campaign for a science film about atoms and molecules.</p>
    <p>i'm seeking recommendations for fonts, font families, or font designers/vendors with a distinctive science/sci-fi/futuristic feeling.<br>
    when i use these keywords in myfonts.com i get surprisingly same-old, blocky, 80's looking examples.</p>
    <p>any recommendations ? i'll be choosing a few to experiment with. </p>
    <p>fully legit protocols will be followed, including obliging the distributor/client to license their own copies (after design approval) for extended packaging use.</p>
