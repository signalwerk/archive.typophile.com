      <p>Hmm… to avoid an "already seen" ar an excessively decorative feeling is not easy…</p>
      <p>I would suggest Beta Sans or Beta Semi from Joshua Distler's <a class="freelinking external" href="http://www.shiftype.com/fonts.php" rel="nofollow">Shift</a> or <a class="freelinking external" href="http://www.devicefonts.co.uk/cgi-bin/device2.cgi?action=fonts&amp;section=family&amp;font=Elektron&amp;custom=0&amp;text=" rel="nofollow">Elektron</a> by Rian Hughes for titling. Shift's Beta could be used even for short texts.</p>
      <p>Dr Nob by Ian Anderson (presented in FUSE 6) could be a tool to construct "molecular" letetrforms or patterns for your designs, although FUSE packages seem to have become difficult to buy. I have found something <a class="freelinking external" href="http://www.fontshop.de/sukr.php3?ch=%2Ffontproductdetailc.php3%3Fns%3D1%26sns%3D0%26ns%3D1%26sns%3D0%26co%3D%26co2%3D%26id%3D6034160" rel="nofollow">here</a>.</p>
      <p>And Eidetic Modern from Rodrigo Cavazos' Psy-Ops, could be a good idea for text.</p>
