    <p>I have just begun work on this. As you can see, there are a lot of issues. Some of the character widths are incorrect, stem widths are inconsistant, and there are notches in strange areas. </p>
    <p>I am looking for just general comments. Does the face have potential? Any thoughts on the notches? I think I will use them throughout the face, but I will have to see how they work out.</p>
    <p>Although this face is inspired by Clarendon, I frequently deviate quite a bit from my intentions. I am aware this concept has been done before(<a href="http://www.typography.com/catalog/leviathan/index.html" title="http://www.typography.com/catalog/leviathan/index.html">http://www.typography.com/catalog/leviathan/index.html</a>), but I think I can bring something new to it.</p><div class="imageWrap"><img src="http://typophile.com/files/clarendon-sans_6309.gif"></div><p></p>
    <p>More to come tommorrow.</p>
    <p>Jeremy Dooley<br>
    <a href="http://www.insignedesign.com" title="http://www.insignedesign.com">http://www.insignedesign.com</a></p>
