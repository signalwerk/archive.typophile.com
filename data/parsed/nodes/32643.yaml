    html: |-
      <p>Your 's' and 'S' look like they have been turned upside down. Also, the thickest part of the s should be the spine.<br>
      Usually, the crossbar of the 'F' is a little bit lower then that of the 'E', to fill up the lower gap (but not necessarily so).<br>
      The 'g' doesn't work yet, for the most part it lacks the contrast between thick/thins. Maybe you can look into 'bdpq', and design some of them individually, instead of flipping b and d. :) I think your 'L' arm should be shortened a bit.<br>
      Aside from that, there are the general bezier-inconsistencies.</p>
      <p>Keep working on it!<br>
      On a sidenote; I just read 'Designing Type', by Karen Cheng, a while ago, which is a very good book that discusses every character of an alphabet in detail. Maybe you can use it for designing this typeface. :) I know it helped me design mine.</p>
