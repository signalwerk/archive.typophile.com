    html: |-
      <p>Quincunux,</p>
      <p>I touched up the s, a and g, among other things. I took your advice for the g, but I left the old one in as an alternate. Thank you for pointing out the issues with s and a.</p>
      <p>Dan,</p>
      <p>I have also updated the k. This works quite a bit better.</p>
      <p>Although I am using the Clarendon as inspiration, I don't feel I need to stay with it exactly. I like to use the use of a face as an inspiration, rather than the actual face itself. I would say, however, that this has come closer to "Clarendon Sans" that I would have imagined.</p>
      <p>Maybe it's just me, but it has a very "British" feel to it. It reminded me of walking through Gatwick airport, for some reason. Because of this, I have renamed the typeface to "Stratham."</p>
      <p>Latest PDF: <a href="http://www.insignedesign.com/pdfs/stratham.pdf" title="http://www.insignedesign.com/pdfs/stratham.pdf">http://www.insignedesign.com/pdfs/stratham.pdf</a></p>
      <p>Thanks to all that have commented so far.</p>
      <p>Jeremy Dooley<br>
      www.insignedesign.com</p><div class="imageWrap"><img src="http://typophile.com/files/Stratham_4952.jpg"></div><p></p>
