    <p>hello.</p>
    <p>i’m very happy that i’ve found the „saa series fd“ (<a href="http://www.myfonts.com/fonts/urw/saa/series-f-d/" title="http://www.myfonts.com/fonts/urw/saa/series-f-d/">http://www.myfonts.com/fonts/urw/saa/series-f-d/</a>)<br>
    after many, long searches it’s exactly what i’m looking for.</p>
    <p>but the problem now is: there are no lowercase letters available and i want to use it for copy, documents, web and much more, too. do you have an alternative in mind, which is very close on shape? i would be happy about every hint.</p>
    <p>best regards,<br>
    jan</p>
