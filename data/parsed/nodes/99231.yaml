      <p>"YOU ARE BROUGHT" looks like a manually bolded Atlantis - and the only digital version I'm aware of is by <a href="http://moorstation.org/typoasis/designers/mueller/a_f.htm" target="_blank" rel="nofollow">Rick Mueller</a>.</p>
      <p>To me, "Wonderful Manifestations" looks like a condensed Clarendon, similar to <a href="http://old.myfonts.com/fonts/adobe/willow/" target="_blank" rel="nofollow">Willow</a> or <a href="http://old.myfonts.com/fonts/woodentypefonts/clarendon-condensed/" target="_blank" rel="nofollow">Clarendon Condensed</a>.</p>
