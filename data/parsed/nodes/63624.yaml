      <p>Well, Berlin has a couple of big schools. I don't know how friendly they are to foreign students who wan to come over for a semester. There are so many student enquiries already! Does your school in Denmark have a partnership with any schools in Berlin already? That could help a lot.</p>
      <p>Anyway, here are the schools that I can think of off the top of my head that teach graphic design in Berlin. These are all state-run institutions:</p>
      <p><a href="http://www.udk-berlin.de/sites/content/themen/aktuelles/index_ger.html" rel="nofollow">Universität der Künste Berlin</a><br>
      <a href="http://www.kh-berlin.de/" rel="nofollow">Kunsthocschule Weißensee</a><br>
      <a href="http://www.htw-berlin.de/" rel="nofollow">HTW Berlin</a></p>
      <p>Then just across the city border is the <a href="http://www.fh-potsdam.de/" rel="nofollow">Fachhochschule Potsdam</a>.</p>
