  html: "<p>First off, I'd like to say that this place has become something of an addiction for me. I've learned an incredible amount just by lurking. I'd like to levy your collective knowlege of independent foundries. I'm looking for a sans-serif companion to New Caledonia. This is one of the few times where I might be able to drop some coin of font licensing, so I want to make sure I'm getting something good.  <br> <br>Background: I picked New Caledonia as a titling face for an online lierary journal, and as the titling and body face for a print version of the same thing. I wanted something that paired well with Georgia, since the online typography is important to me, but also stood on its own. New Caledonia seemed to have just enough Scotch in it, and like pretty much everything Dwiggins has done. <br> <br>It would also help to have a sans to go with it. In general terms, what category of sans goes with  Scotch Romans? As I understand it, they're most closely related to the Didones, which makes me think geometric, but they seem to have a more human quality about them. My first thought was an Avenir or Nobel, but I'd really like to hear what else is out there. I've learned a lot in the past just by watching Typophiles go about the process of recommendations. Thanks.</p>"
