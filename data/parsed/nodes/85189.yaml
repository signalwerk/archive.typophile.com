    <p>Hi everyone,<br>
    I have these doubts about glyph names and unicode:</p>
    <p>00A0: Should be named uni00A0 or nbspace?<br>
    .null or NULL?</p>
    <p>00B7: Should be named periodcentered or middot?<br>
    Its the same as 2219/uni2219? Should I include both?</p>
    <p>00AF: Should be named macron or overscore?<br>
    Its the same as 02C9/uni02C9? Should I include both?</p>
    <p>0394 2206/Delta, 2206/increment or 0394/uni0394?</p>
    <p>0130: Idotaccent or Idot?<br>
    idotaccent (lowecase) is used by any language?</p>
    <p>015E: Scedilla or uni015E?<br>
    015F: scedilla or 015F?</p>
    <p>0218: Scommaaccent or uni0218?<br>
    0219: scommaaccent or uni0219?</p>
    <p>0162: Tcommaaccent or Tcedilla or uni0162?<br>
    And what about 021A/uni021A?</p>
    <p>0163: tcommaaccent or tcedilla or uni0163?<br>
    And what about uni021B/uni021B?</p>
    <p>0111: dcroat or dslash?</p>
    <p>0237: dotlessj or uni0237?</p>
    <p>Ligatures?<br>
    ff or f_f, fi or f_i, fl_or f_l, ffi or f_f_i, ffl or f_f_l?</p>
    <p>I´ve been looking at fonts from different foundries, and everyone seems to be doing it in different ways...</p>
