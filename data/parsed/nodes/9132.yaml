    html: "<p>&gt; The condensed feels a little too narrow for lots of text <br> <br>Well, it's supposed to be!  :-) <br> <br>If you want to cast it as an <i>alternative</i> to the \"normal\" one for text, then I think you have a problem because the normal one is already on the narrow side (although it's also too loose). <br> <br>But if you decide to go for it: <br>1) Call it Narrow instead of Condensed. <br>2) Make it maybe about halfway between where it is now and the normal one. <br> <br>hhp</p>"
