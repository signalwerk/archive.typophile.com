    votes: null
    html: "<p>No rule of thumb*, just eyeballing refined over time. Observe, measure, think, all the time. Or if you're going to listen to other people's advice, learn to gauge what they mean by things like \"a fair amount\" versus \"slightly\" versus \"a hair\". :-) But whatever you do, note this: it's quite amazing how <i>small</i> adjustments need to be to make sense in type design - I think even seasoned designers are periodically humbled by the degree of subtley required. <br> <br>* Although I can imagine somebody one day coming up with a killer formula that balances color, spacing, contrast, proportions, intended size, etc. Sort of like PV=nRT in chemistry. Of course it could never be so exact, but it could save a lot of time by immediately putting you in the ballpark. <br> <br>hhp</p>"
