    <p>Hi everyone. nsfBook (which has undergone a name change and may do so again) continues to plauge me and, now that I am realatively pleased with the roman form and am taking a break from the italic, I've started in on a condensed version. I'll make a better sample sheet soon, but for comparision here are six 'graphs set in both the normal and condensed widths. The condensed feels a little too narrow for lots of text, but I can't decide if it is that all of the glyphs are too condensed or if specific ones are to blame. Any feedback would be great. I feel as though the serifs have suffered a bit, though I have tweaked them.</p>
