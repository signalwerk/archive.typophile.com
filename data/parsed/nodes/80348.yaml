    <p>Weingut Script Flourish is a decorative display font with high contrasts, perfectly drawn to the tiniest details. The font is trimmed to fairly large font sizes and is highly suitable for chapter titles or book jackets as well as Headlines, Invitations and wine labels, although also impressing with an astounding legibility in small typesettings. Inspired by the hand drawn Blätterschrift from the 19th century Mettenleiter’s Schriftenmagazin, its basic structure is related to the English Script. The creative process started in summer 2009 and after 600 hours of work, over a 2 year period, Weingut now unfolds to reveal all its charms.<br>
    Created by Georg Herold-Wildfellner.</p><div class="imageWrap"><img src="http://typophile.com/files/typophile-Weingut-590x360-12_4901.png"></div><p></p>
    <p><strong>Design with bicoloured capitals: </strong><br>
    In Weingut Script and Weingut Flourish, leaves and letters are available separately. You can stack them and apply different colours to the foreground and background.</p>
    <p><strong>Decoration and patterns: </strong><br>
    Weingut Swashes and Ornaments offers extra decorative elements in a separate font. Leaves, flourishes and borders available on their own or merged to ornaments.</p>
    <p>The Weingut Family – noticable bouquet, beautiful structure with full fruit and a long finish.</p>
    <p>View the full specimen here: <a href="http://new.myfonts.com/fonts/facetype/weingut/" title="http://new.myfonts.com/fonts/facetype/weingut/">http://new.myfonts.com/fonts/facetype/weingut/</a></p>
    <p>Please make sure to use an application that supports the layering of text (two-coloured capitals) and OpenType features (contextual alternates). Be aware if you intend to combine Weingut Script Flourish and Weingut Flourish that these two do not go together. The floral outlines differ slightly and inaccurate overlaps will be the end result.</p>
