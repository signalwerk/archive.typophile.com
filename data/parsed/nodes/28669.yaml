    <p>Can anyone help with the identification of the font used here?</p>
    <p>This is the logo for Canada’s largest outdoor gear store, Mountain Equipment Co-op or MEC. As far as I know, the logo was designed in 1974 by Steven Brown, a designer from the US.</p>
    <p>Thanks in advance.</p>
