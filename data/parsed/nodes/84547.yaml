      <p>Well being from WebINK I would tend to prefer my own. I am glad you are trying them all out. We all have some great fonts with both TypeKit and us having fonts from Adobe.</p>
      <p>I am always asked what is the difference between you and TypeKit and the most obvious is that we are a pure CSS only solution. I prefer this method because it allows development to be as I normally would develop with links to my media. A lot of folks don't like the extra JavaScript required to use TypeKit but a lot of folks dont find it an issue. We use a powerful CSS implementation model that differs from many of the other CSS only services. Most CSS only shops link back to a hosted CSS file that uses a traditional @font-face stack of EOT, WOFF, TTF calls and allows the browser to determine what file format to download. Ours links back to our intelligent servers that determine the OS and Browser version and hand back the best format for that browser. This matters a lot since in some OS and Browser combinations handing back a WOFF/CFF might not be the best and a TTF might be better.</p>
      <p>Another item to always look at when reviewing the service you want to go with is the backbone that their service is on. WebINK is on the Amazon Cloud with region locations all over the globe so our fonts download from a server closest to the user. TypeKit is on a very good CDN as well. Some services might be on the Amazon network but they only download from one location, so your visitors in Europe are getting their fonts from the East Coast of the US or farther away and this can cost extra seconds on page load.</p>
      <p>I would agree that the folks at TypeKit are pushing the industry and that is great for all of us. They recently starting serving up WOFF/CFF (postscript outlines) as pointed out and we and others will do this as well in the near future. We too will push the industry and have some very seasoned software engineers.</p>
      <p>I hope you find a service that works for you.</p>
      <p>Brad Dunzer<br>
      Product Manager WebINK</p>
