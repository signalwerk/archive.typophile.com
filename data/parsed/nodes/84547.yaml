      <p>Speaking for the WebINK side, there are other differences that spring to mind:</p>
      <p>- WebINK also provides a minimum px size rating for every font in our system, based on analysis by one or more people viewing browser screenshot waterfalls. We're working on also providing waterfalls, but it seems to us that knowing what we think the minimum good size is, is pretty helpful.</p>
      <p>- As best as I can tell, WebINK has a more heavily curated collection of fonts. Mind you, this is probably not as important for typophiles as the general web design audience.</p>
      <p>Regards,</p>
