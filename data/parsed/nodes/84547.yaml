      <p>(1) Ah, I understand, then. That feature is on our to-do list. On the other hand, we do offer a rating of minimum size so that you don't necessarily have to check it yourself under every browser combo. (I'm not saying that either feature is a substitute for the other, but if a font is rated as having a minimum safe size of 24 px, it's hardly a case of not being "open" about rendering issues.)</p>
      <p>(2) Yeah, if you use Windows, and have ClearType off (the default on XP, but not anything later), and use the wrong browsers, stuff will look worse, including our own site. You'll see that rendering on any version of Windows, using Firefox, with ClearType turned off. Current Windows versions of IE, Chrome and even Safari all do better, even with ClearType off; they will show that text anti-aliased and it looks pretty fabulous. Even on XP with IE 7 or 8, for that matter. We could try forcing anti-aliasing for that font at such small sizes under GDI greyscale (non-ClearType), but the type may get a little too thin if we do.</p>
      <p>Cheers,</p>
      <p>T</p>
