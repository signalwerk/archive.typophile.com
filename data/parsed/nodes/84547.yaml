      <p>"Typekit seems more open about the rendering issues in older browsers."</p>
      <p>How so? For example:<br>
      <a href="http://blog.webink.com/webink/font-rendering-in-web-browsers-a-find-your-font-adventure/" title="http://blog.webink.com/webink/font-rendering-in-web-browsers-a-find-your-font-adventure/">http://blog.webink.com/webink/font-rendering-in-web-browsers-a-find-your...</a></p>
      <p>Perhaps we need to blog about it more often, but we certainly have blogged about it, and are always ready to talk about it when it comes up, which is often. A lot of TT fonts render badly on older browsers on Windows, and even newer Windows browsers are not always fabulous at small sizes with all fonts.  :(</p>
      <p>This of course is not an issue that is specific to either WebINK or TypeKit. It's a general challenge for web fonts.</p>
      <p>Cheers,</p>
      <p>T</p>
