      <p>I'll also begin with a disclaimer (I work for Typekit). Brad is right that Typekit requires JavaScript; we think that layer of JS allows us to serve fonts in a way that's more reliable, consistent, and provides more control to the designer. You can read more about why we use JavaScript and what it does <a href="http://blog.typekit.com/2011/08/11/better-web-font-loading-with-javascript/" rel="nofollow">on a recent post on our blog</a>.</p>
      <p>In addition, we're working closely with our foundry partners to improve rendering on Windows browsers; switching to PostScript for some fonts is a recent step. (Though I should clarify that at this point we are not yet sending PS based on the size of the font; though we are considering that additional level of control in the future.) We've also done a lot of <a href="http://j.mp/typerendering" rel="nofollow">research on rendering</a> and will be sharing more on that front soon. And we provide browser screenshots for all of our fonts, so you can evaluate how they perform before using them.</p>
