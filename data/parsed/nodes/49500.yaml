      <p>It is a category mistake to think that Bodoni Greek reflects ‘old Greek typesetting’ any more or less than does the typeface used in Bekker’s Aristotelis Opera. A typeface is Greek because it is designed to set the Greek language. Many of the great type designers, Bodoni included, cut Greeks for academic works which are no more or less authentic than Bekkeriana. </p>
      <p>Bekker’s Aristotle editions were printed in Berlin in the early nineteenth century and the use of the particular Greek typeface reflect the tastes of their time and the place of printing (and, perhaps even more importantly, the availability of type) as much as the use of any roman typeface. Bekkeriana closely resembles the cursive Greek cut in the late eighteenth century by Alexander Wilson of Glasgow  (which has been digitized by Matthew Carter). Like Bodoni, Wilson was a punchcutter in the romantic tradition.</p>
      <p>Bekkeriana reflects ‘old Greek typesetting’ only to the extent that it is an old typeface that was designed to set Greek, and its original is much more likely to have been produced on the shores of the North Sea than the Aegean.</p>
