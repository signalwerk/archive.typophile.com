    html: <p>Incidentally, the Junicode font for medievalists designed by Peter Baker now contains a 'beta' version of a new digitization of Wilson's Greek, which I think you'll find has a very similar feel to Bekkeriana. See pages 3-4 of <a class="freelinking external" href="http://inamidst.com/stuff/archive/Junicode.pdf" rel="nofollow">this pdf</a>. Junicode is available at <a class="freelinking external" href="http://junicode.sourceforge.net/" rel="nofollow">http://junicode.sourceforge.net/</a>.</p>
