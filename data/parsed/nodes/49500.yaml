      <p>May I quote »Keeping Greek Typography Alive« by Yannis Haralambous:</p>
      <p>A good friend and colleague of ours at ENST de Bretagne, Prof. Ioannis Kanellos, has started an initiative against this trend, by giving us the opportunity to modelize the typesetting of a very important collection of books : the Aristotelian Collected Works by the German scholar Bekker of the Academy of Leipzig.<br>
      The typeface used in these books, and especially in the earlier volumes, is a pure masterpiece of 18th-19th century Greek typefaces. It has practically no ligatures ( besides omicron-upsilon and sigma-tau ) but keeps the manuscipt style of earlier Greek typefaces. The placement of accents is amazingly dynamic : in some cases, an accented letter seen out of context seems to be completely wrong. The same letter seems completely natural in the context of a word.<br>
      We hope that this typeface, called  »Bekkeriana« in honour of Bekker, will contribute to the revival of older Greek typefaces and bring the Greek audience closer to part of the ( typographical ) history of its language. </p>
      <p><a href="http://omega.enstb.org/yannis/" title="http://omega.enstb.org/yannis/">http://omega.enstb.org/yannis/</a></p>
      <p><a href="http://omega.enstb.org/yannis/pdf/thessaloniki.pdf" title="http://omega.enstb.org/yannis/pdf/thessaloniki.pdf">http://omega.enstb.org/yannis/pdf/thessaloniki.pdf</a></p>
