      <p>If people can't read Futura, they don't deserve a driving licence.</p>
      <p>There is design logic in choosing Futura, given the role played by its classic art deco buildings in establishing Miami's architectural identity. Although there are comparable American faces which would be more authentic.</p>
      <p>While drivers look at signage briefly, signs are also a part of the urban environment that exists for everybody. This environment should not be reduced to a utilitarian lowest common denominator under the tyranny of the automobile.</p>
      <p>Concerning accident prevention: In the interests of road safety and climate change, it would be a good idea to make city centres pedestrian precincts, ban the manufacture of SUVs and limit all cars to 35 hp per seat. </p>
