    <p><a href="http://www.citydebate.com/florida/miamibeach/template.php?url=0103120603.htm" title="http://www.citydebate.com/florida/miamibeach/template.php?url=0103120603.htm">http://www.citydebate.com/florida/miamibeach/template.php?url=0103120603...</a> </p>
    <p>&gt;City of Miami Beach is sponsoring a research project to test the legibility of the Futura typeface for use on directional signs. </p>
