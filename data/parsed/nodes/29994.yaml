    html: |-
      <p>Thank you all for the feedback so far, I really appreciate it. </p>
      <p>Based on the comments received, it seemed to be a tie between 2.2 and 2.3. I really like 2.2 because it does indeed resemble a climbing carabiner more than anything else, but in the end I think I'll end up going with 2.3 for legibility's sake (I've had a comment from a non-designer that the 'e' in 2.2 doesn't look like an 'e' because of its open counter).</p>
      <p>I've done some more renditions based on the comments received. 2.3.1 is a variation of 2.3 with rounded corners. I took <strong>timd</strong>'s suggestion into account and rounded just the corners rather than the whole terminals. 2.3.2 and 2.3.3 are based on <strong>cannon46</strong>'s suggestion to compress the text (I did keep the old shapes however).</p>
      <p>I'm not sure whether I find any of these new variations more effective than the old ones, but I'm always eager to hear what other people think.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/mec-typophile005_4360.png"></div><p></p>
