      <p>Thanks for the feedback and suggestions, <strong>timd</strong> and <strong>jpad</strong>!</p>
      <p>I have incorporated <strong>timd</strong>'s suggestion regarding the E and you can see it in action below, next to a rendering of the original. What do you guys think? I've also made the kerning equal between the letters.</p>
      <p>I've also tried a few quick comps with the peaks at different heights, but that didn't go too well. I've also played around with the curves a bit, with similarly discouraging results.</p>
      <p>I'm not sure what else I can do about the peaks. I would like to keep them symmetrical, since they form the negative shape of the letter M (with stems slightly apart). At the same time, I feel the symmetry does look a bit static and boring and not exactly representative of the excitement of outdoor activities. </p><div class="imageWrap"><img src="http://typophile.com/files/mec-typophile004_5934.png"></div><p></p>
