      <p>I prefer version 2, but I find the mountain icon a little ambiguous it could be mistaken for a hat, maybe having the peaks at different heights could help, the radius of the corners seems a bit too much, you could introduce the carabiner theme by using an open carabiner as a lowercase e, you needn't change the shape of the sides of the character. I also feel that with the counters being so closed your kerning could almost be equal spaces.<br>
      Tim</p>
