      <p>I'm with you guys on the Estimated*, but do © and ® have to be upright to be legal? I don't think so, since even "(c)" is acceptable AFAIK. I also don't grasp why any of the others should be upright. You want the upright one? Use the Roman. You want the slanted one? There it is.</p>
