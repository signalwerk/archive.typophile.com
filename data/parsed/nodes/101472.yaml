    date: 2013-03-19T03:49:00
    date_raw: 19 Mar 2013 — 3:49am
    votes: null
    html: |-
      <p>Slanted © or ® look strange (being rather pictorial elements), but I can imagine a dense, technical or business material, full of quotations, where they could be an advantage.<br>
      Leaving upright periods makes utility sense, because people often don't make exact selections...<br>
      Anyway, I have problems in saying what sould and what shouldn't be italicised, because there are such texts and such conditions, where I find those upright elements as details of incredible beauty, and I would even accept the geometric zeros there.</p>
