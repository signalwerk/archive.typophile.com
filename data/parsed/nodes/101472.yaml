      <p>“There is no harm in doing it” is not the same as “that is the optimal thing to do.” I think the question is, what is optimal?</p>
      <p>One notable omission: the estimated symbol.</p>
      <p>I made a rather small .enc file for FontLab Studio, with the glyph names of the glyphs that I keep as upright in an italic face, based on what I did at Adobe with Hypatia Sans. It has a fairly large character set.</p>
      <p>Here is a link to the file: <a href="http://www.thomasphinney.com/wp-content/uploads/2013/03/Upright.enc_.zip" title="http://www.thomasphinney.com/wp-content/uploads/2013/03/Upright.enc_.zip">http://www.thomasphinney.com/wp-content/uploads/2013/03/Upright.enc_.zip</a></p>
      <p>Here is the info to cut and paste into a new .enc file:</p>
      <p>%%FONTLAB ENCODING: 84131926; Upright in Italic<br>
      .notdef 0<br>
      asterisk 1<br>
      plus 2<br>
      less 3<br>
      equal 4<br>
      greater 5<br>
      asciicircum 6<br>
      bar 7<br>
      asciitilde 8<br>
      logicalnot 9<br>
      trademark 10<br>
      plusminus 11<br>
      degree 12<br>
      registered 13<br>
      copyright 14<br>
      revlogicalnot 15<br>
      uni2120 16<br>
      uni2117 17<br>
      estimated 18<br>
      uni2190 19<br>
      uni2192 20<br>
      arrowup 21<br>
      arrowdown 22<br>
      uni25C0 23<br>
      uni25B6 24<br>
      uni25B2 25<br>
      uni25BC 26<br>
      uni25C1 27<br>
      uni25B7 28<br>
      uni25B3 29<br>
      uni25BD 30<br>
      uni25C9 31<br>
      uni25C6 32<br>
      uni25A0 33<br>
      uni2752 34<br>
      uni2713 35<br>
      uni2610 36<br>
      uni2611 37<br>
      lessequal 38<br>
      greaterequal 39<br>
      approxequal 40<br>
      notequal 41<br>
      uni2213 42<br>
      infinity 43<br>
      lozenge 44<br>
      integral 45<br>
      radical 46</p>
