      <p>What is optimal?<br>
      As Marcin says, consider usage.<br>
      IMO, it looks like a mistake if text is in italics, with mathematical symbols upright.<br>
      Unless you’re making a math font, there is absolutely no reason* to put any upright glyphs in an italic font — except for ©, ®, •, ˚,° and Estimate (if you are doing WGL4 encoding).</p>
      <p>*Except laziness.</p>
