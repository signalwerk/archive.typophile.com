    html: |-
      <p>Think not as a type designer, but as 1) typesetter/graphic designer, and 2) reader ("can I imagine someone needs to present/recieve this element in a cursive manner?").<br>
      I would say that pictorial elements like arrows aren't worth of slanting or italicising in a font, but in the other hand, one can foresee a need of having italicised arrows, for certain purposes...</p>
