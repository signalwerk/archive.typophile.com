    votes: null
    html: |-
      <p>Unless you are producing a math font, there is no harm in italicizing/slanting just about everything.<br>
      Except ©,  ® and •.<br>
      Also, I don’t usually italicize small marks: tittles/dots/periods, and the degree symbol and ring accent.</p>
