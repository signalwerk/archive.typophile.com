    <p>Hello guys,</p>
    <p>As you may already know I am currently working on the italics of my Graphirus font and I have a question in this regard: besides the letters and numbers, what other characters are often italicised? Diacritics, punctuation marks, mathematical symbols/operators? There are many takes on what to italicise and what not, so I'd like to hear opinions from you, the people who has been doing this longer than me )</p>
    <p>Thanks</p>
