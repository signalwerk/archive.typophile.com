      <p>Yeah it was hard to tell at that size for some reason (for the bowls etc.)</p>
      <p>As for the /B/... I definitely prefer the last one. The crossbar on both the /P/ and /R/ are both in the same vein, in that they have two corner points, so I think the /B/ should follow that paradigm, if it remains disconnected. You could also have /B/ be the only character of the three that actually has a connected crossbar, as a lot of faces seem to do that.</p>
