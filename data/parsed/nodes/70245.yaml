      <p>I'm digging what you've got so far. The mixture of curvy/pointed finials and the wide, adnate serifs combine to make a nice overall visual. I think some of the awkwardness of the letterforms comes from the curved letterforms not dropping below the baseline. The bowl of the /a/, /d/, etc. should dip just a little bit below the baseline/above the x-height when compared to the serifs of a letter such as an /m/... this balances the visual weight of the letters. In the word "Quagmire" the /a/ seems a lot smaller when compared to the /u/. I might also suggest reducing the size of the finial on /l/ as it's much larger than most of the other letters.</p>
      <p>The face is coming along nicely. Thought about naming it yet?</p>
    html_clean: |-
