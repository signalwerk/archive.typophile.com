      <p>Much better with the brackets.</p>
      <p>Couple of observations on the latest image:</p>
      <p>-I like the stress you have in the lowercase letters, but it doesn't seem consistent. The thinnest parts at the joints of the 'r,' 'm,' 'u,' etc. don't match the thinnest parts of letters like the 'a' and the 'g.' The 'S' in general, and particularly the spine, strike me as being too thick as compared to the thickest parts of the 'Q' and the 'C.'</p>
      <p>-The top terminal of the 'c' is much larger than those of the 'C,' 'S,' and 's,' which are all different from the one on the 'r.' The one on the 'f' seems to be having its own party. Personally, I like the one on the 'r' the best.</p>
      <p>-The serifs on that 'K' are huge. o_O</p>
      <p>On the old image:</p>
      <p>-The diagonal of the z's seems too thick, and I wonder what they would look like if either the bottom or top serifs (not both at the same time though) resembled more the top terminals of letters like 'c,' 'r,' etc.</p>
      <p>-I have no idea why, but the 'x' looks backwards. I know it's not, but something about it makes it seem like it's the mirror version of what an 'x' should look like.</p>
      <p>-Maybe I'm just seeing things, but the 'S,' the 'Q,' and the 'C' look like they're sitting just a smidge too high on the baseline (in both the old and new image).</p>
