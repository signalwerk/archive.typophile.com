    html: |-
      <p>Hey, your font is looking pretty good. I have a few critiques, but I'm also a beginner so take them with a grain of salt. I'll start with the roman:</p>
      <p>Lowercase:<br>
      - All of your upper serifs in the lowercase, with the exception of diagonal letters, are contradictory to the lower serifs, and all serifs in the uppercase. These serifs are thin, curved, and bracketed, whereas the others are dark and abrupt.<br>
      - The diagonal letters - /z/x/v/w/z/ - all extend too high. The reach where round letters should overlap, and not at the optical x-height.<br>
      - You may want to make the transition on letters like /n/ slightly darker. (The top right where the curve transitions into the right stem.)<br>
      - Terminals on /a/, /r/, and /s/ should be darker as they are on /c/</p>
      <p>Uppercase:<br>
      - The O and Q are much darker than other letters.</p>
      <p>Overall, your font is quite good, although probably needs some refinement. Most of the curves seem to be a bit wobbly, this is because of the construction used when making them. The extrema should be at the most logical point in a curve. I like to think of it as making curves appear natural, but it's hard to explain. I may be able to post an image describing this later. Also, I would recommend looking carefully at the weight of each letter and trying to balance the color of all letters.</p>
      <p>Your font reminds me a bit of Newton, a font I am making, but only certain parts.</p>
      <p>Good luck with your font!</p>
    html_clean: |-
