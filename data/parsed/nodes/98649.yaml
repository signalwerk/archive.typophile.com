  html: |-
    <p>Can anyone identify the font used in 'the cookbook store' logo? Online services suggest ITC Avant Garde Gothic Demi and Swiss 721 but they're not quite right. It's most noticeable in the characters 'c', 'k' and 's' for Avant Garde. </p>
    <p>The store's website: <a href="http://www.cook-book.com" title="http://www.cook-book.com">http://www.cook-book.com</a></p>
    <p>Any help would be much appreciated. Thank you.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/COOKBOOKLOGOCopySm_4022.jpg"></div><p></p>
