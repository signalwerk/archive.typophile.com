  html: <p>My main question here is whether or not the letter spacing in VSG looks OK to your raw eyes, but I welcome any other comments as well. <br> <br>This is one of those projects that has been reserrected from several months of rest. It's a logo for a professional athlete agency in the Southeast (Georgia, Alabama). I am dealing with a challenging client, and don't expect to be able to make many major alterations at this point</p>
