    html: <p>Scott, <br> <br>The right stem of the "V" looks too thin. I think a  condensed sturdier font under the icon may give it more stability. Also, in the space between the thin and thick bars on the stem on the G should be more straight. In the other parts of the logo, the taper is less obvious. <br> <br><img src="http://www.typophile.com/forums/messages/29/42599.gif" alt=""></p>
