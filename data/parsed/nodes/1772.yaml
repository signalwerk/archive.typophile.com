  html: "<p>Can anyone tell me anything about S.H. Steinberg, author of <i>Five Hundred Years of Printing</i> (1955) ? <br> <br>It's full of loveliness like this : <br> <br><b>It is rather one of the most wholesome consequences of the worldwide expansion of the printing press that the one Latin alphabet should have become the one medium in which every human thought can find adequate expression.</b> <br> <br>But he also makes some extremely astute comments about Gaelic typography and I was wondering who exactly he was and if he was taken seriously nowadays. <br> <br>Any info would be appreciated. <br> <br>Matha.</p>"
  html_clean: "<p>Can anyone tell me anything about S.H. Steinberg, author of <i>Five Hundred Years of Printing</i> (1955) ? <br> <br>It's full of loveliness like this : <br> <br><b>It is rather one of the most wholesome consequences of the worldwide expansion of the printing press that the one Latin alphabet should have become the one medium in which every human thought can find adequate expression.</b> <br> <br>But he also makes some extremely astute comments about Gaelic typography and I was wondering who exactly he was and if he was taken seriously nowadays. <br> <br>Any info would be appreciated. <br> <br>Matha.</p>"
