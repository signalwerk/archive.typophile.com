    html: <p><i>...European printing history conceived as a whole rather than focusing on an individual country</i> <br> <br>What attracted my attention in the first place was that he places Ireland very firmly in its European context. On top of that he refers to Gaelic typography as 'artificial', something that Irish writers could never and British writers would never dare do. <br> <br>A breath of fresh air, to say the least. <br> <br>Matha</p>
