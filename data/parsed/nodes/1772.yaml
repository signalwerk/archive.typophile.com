    html: "<p><img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Yes. Well, the second I posted, I realized that.  <br> <br>I think it might be easy to say that a book that is only 272 pages in length can't possibly be worth reading. However, this book has a couple things going for it. The British Library is one of the publisher's and Beatrice Warde wrote the intro. Apparently Steinberg is to be thought of in good light. <br> <br>I googled (as you probably did already) and came across this teensy bit of information: <br> <br><a href=\"http://www.dotprint.com/fgen/history.htm\" target=\"_blank\">http://www.dotprint.com/fgen/history.htm</a> <br> <br><i>FIVE HUNDRED YEARS OF PRINTING BY S H STEINBERG, revised by  John Trevitt (The British Library and Oak Knoll Press</i>  <br>  <br><i>Hitler unwittingly did this country a favour when he forced so many  German and Central European scholars into exile in the 1930s. Whether Jewish or Gentile, they brought with them a very Germanic dedication to scholarship  which is in some ways superior to the home-grown variety and, like most refugees, they worked amazingly hard to re-establish themselves in a new environment.  <br>  <br> Famous examples include the architectural scholar Nikolaus Pevsner, the art historian E H Gombrich, typographers and book designers Hans  Schmoller and Jan Tschichold, and Sigfrid Henry Steinberg, the unrivalled historian  of printing. First published in 1955 as a Pelican Book, with the  encouragement of Schmoller, Five Hundred Years of Printing proved to be a  bestseller, with 70,000 copies of the Pelican editions sold over a period of 24 years  and parallel hardback editions issued by Faber &amp; Faber.  <br>  <br> The present publication is the fourth revision of a work whose author  died in 1979, too early to take much account of offset-litho printing and well  before the general use of digital typesetting and the introduction of the  Internet, which both feature in John Trevitt's revision of Steinberg's  third and final chapter.  <br>  <br> This has now been divided into three, so that instead of The  Nineteenth Century and After we have The Nineteenth Century, 1900-1955 and  The Postwar World. In his Preface, Trevitt comments: 'On re-reading Five Hundred Years , I was struck by its lightly-worn learning, both deep and wide &amp;shyp; and by a feeling that on any and every subject the author  knew far more than he had space to tell us.'  <br>  <br> Lightly-worn learning was acquired by persistent effort. Steinberg's Ph.D  thesis at Leipzig University had the heavily Germanic title of  Documentation methods of the Goslar City Council up to the mid-14th Century. He was  then 23 years old and 12 years later he fled from Nazi rule to England. Teaching German in evening classes, which led to the publication of A  One-Year German Course (Macmillan), then writing and editing history books and  encyclopedias, established Steinberg in the English publishing world.  <br>  <br> Readers who remember Ipex 1963 and its fascinating sideshow, Printing &amp; the Mind of Man,, will not be surprised to learn that Steinberg  played a major part in its organisation under the direction of Stanley Morison. So close was his friendship with the great typographer that they agreed to write each other's obituaries for The Times &amp;shyp; surely the greatest example of back-scratching in any coterie. <br>  <br>  To conclude the personal observations drawn from the Preface,  Steinberg's wife is quoted as saying: 'S H never realised that other people were not able or willing to work a 16-hour day, as he often did himself.' And on the same page, there is his portrait photo, looking for all the world  like Henry Kissinger's older brother. What of the book itself? Well and  clearly written, it also has the best qualities of a reference book. <br>  <br> If you want to know about the development of printing techniques,  typefaces and book production in any European or other English-speaking country,  Steinberg is your man. Should you wish to shine on Mastermind, you could choose  printing history as your subject on the basis of this book.  <br>  <br> Here are some sample questions:  <br> Q: What is the world's oldest established printing company? <br> A: Orell Füssli of Zürich, established as Froschauer in 1521.  <br> Q: Who invented the title page?  <br> A: Gutenberg's successor, Peter Schöffer, for a papal bull of  1463. <br> Q: Who introduced printing to Russia?  <br> A: The German, Hans Missenheim, at the invitation of Ivan the Terrible in  1552.  <br> Q: Who introduced accents in French printing?  <br> A: Robert Estienne in the 1530s.  <br> Q: Why is the Judas Bible of 1611 so-called?  <br> A: Because in Matt. xxvi 36 it names Judas as presiding at the Last  Supper.  <br> Q: And the Wicked Bible?  <br> A: Because it gives the seventh commandment as Thou shalt commit  adultery. And so on. <br>  <br> A fresh selection of illustrations has been made for the new edition, but  it is a pity that they are not indexed. The reviser mentions the fact  that his publisher insisted on a maximum of 272 pages and the resulting longer  lines and smaller typeface make the book less readable than the Faber  edition of 1959. Nevertheless, even if regarded simply as a reference book, Five Hundred Years deserves a place on the printer's bookshelf beside the  English dictionary. <br>  <br> And as tens of thousands of readers can testify, it is really much more than a reference book. As Trevitt comments, it established the invention of printing at the centre of modern history, thereby appealing not only to printers, but also to a wide circle of general readers interested in history.</i>  <br> </p>"
