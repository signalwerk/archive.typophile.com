    html: <p>Steinberg's book was one of the first systematic surveys of European printing history conceived as a whole rather than focusing on an individual country, and has remained a well respected text. It belongs to the same typographic movement that resulted in the famous &lt;I&gt;Printing and the Mind of Man&lt;/I&gt; exhibition. I don't know anything about the man, other than that my father might have known him (he studied at the Courtauld Institute).</p>
