    html: <p><i>Apparently Steinberg is to be thought of in good light.</i> <br> <br>He got his PhD at the age of 23 and wrote Stanley Morison's obituary.  <br>Can't go wrong there. I was planning on shining some good light on him anyway. I have to get an abstract off this week for a conference on Irish book history and I just wanted to check he wasn't a nutcase or anything.  <br> <br>The PhD thing reminds me of a bit of blurb I read on the back of a David Hume book.  <br>"He entered Edinburgh University at the age of 12, but left before completing his degree".  <br> <br>Those were the days. <br> <br>Goodnight and thanks a million. <br> <br>Matha <br></p>
