    <p>Hi all,<br>
          I am new on here and this is my first post. I have been tasked with designing a new logo for our company. The company is currently called National Polytunnels and has a logo. The logo etc wansn't designed by myself and I personally hate them. The good news is that the company has moved in new directions (pitched roof buildings and canpopies for Garden centres and the retail industry). The old logo and company name doesnt cut it anymore and after lots of meeting with the MD he has now agreed that I can have a go at designing a new logo based on the name National Structures.</p>
    <p>I have been playing around with Ideas for some time and have listed the things that I need ed to look at to get me started.</p>
    <p>1. What is the main buisiness core / Manufacture &amp; instalation of steel framed buildings.<br>
    2. How do they acheive this / Initial site visit and structure design, steelwork and material manufacture, construction on site.<br>
    3. Target group / Garden centre's, retail industry, schools etc</p>
    <p>The MD also wants to move away from the old style altogether and has said "start with a clean sheet"</p>
    <p>Here is the old logo for National Polytunnels. I added the word Structures to it for recent advertising just to try and feed the name in a little. The original logo was done by the MD.</p>
    <p>As I have a blank canvas I am struggling to get started as there are so many options here. Any suggestions??</p>
