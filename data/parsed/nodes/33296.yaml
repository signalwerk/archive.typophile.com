      <p>Look at the product, the nuts and bolts (no pun intended) of steel framed building and the finished product, take pictures.<br>
      Look at competitor’s logos (to see what has already been done).<br>
      Sketch out ideas on paper and refine them.<br>
      Does it have to include an image, will type do the job better on its own?<br>
      Look at colours.<br>
      Look at structures, natural or manufactured, that provide covering.<br>
      Define what you don’t like about the old logo.<br>
      Define what you want a new logo to do, where it should go (stationery, vehicle livery, boards etc).</p>
      <p>These are in no particular order, the key is to define your aim and reduce/refine your options.</p>
      <p>Tim</p>
