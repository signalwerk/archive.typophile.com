    html: |-
      <p>I'd assume they should be kerned with alphabetics, punctuation, mathematical signs and the word space (and of course with other numerals). At least I always feel happier when fonts include those kerning pairs, especially if I've paid a lot for them.</p>
      <p>Agree with Charles, tabular numerals should be slightly different, and smallcap numerals are often indispensable.</p>
