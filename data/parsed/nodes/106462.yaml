    html: |-
      <p>The only time I see numerals kerned with "every other glyph" is when class kerning has been used. Usually poorly.</p>
      <p>Remember that "lining" is another name for "uppercase" (&amp; "oldstyle" for "lowercase"). If you don't have small cap figures, the oldstyle will usually be selected when small caps with numbers are set. Make sure your oldstyle figs work with them, and if that destroys the look of the them, add small cap figures.</p>
      <p>And I would say remember to check the comma and period with your tabular numerals. I frequently wind up adding a comma.lt and peroid.lt to switch in -- usually works for with tabular oldstyle numerals, too. And If you're really careful, you might want to have slightly different numerals for tabular figures... </p>
      <p>FWIW</p>
