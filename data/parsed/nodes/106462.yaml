    html: |-
      <p>I'm not a type designer but I would probably kern everything with everything, if you're releasing a font into the wild for general use. Never doubt that someone's going to want to write 6a = b, Section 12c, l33t, 221b Baker St, a 501(c)(3) organization, c u l8r, a 1p6 gutter, map coordinates 18f, <a href="mailto:smith38@yahoo.com">smith38@yahoo.com</a>, manuscript leaf 18r, and license plate T42N24T.</p>
      <p>However I can't think of any circumstances where you'd mix lining and oldstyle numerals within the same word, so you can probably skip kerning the two sets of numerals <em>to each other</em>.</p>
