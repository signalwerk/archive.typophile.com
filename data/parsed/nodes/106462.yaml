  html: <p>When kerning fonts with both Lining and Oldstyle proportional numerals what is the generally accepted form when it comes to kerning? Are all numbers kerned with every other glyph or is it best just to kern 0-9 with all punctuation and parenteses/brackets/braces only? Interested to hear thoughts. Thanks.</p>
  html_clean: <p>When kerning fonts with both Lining and Oldstyle proportional numerals what is the generally accepted form when it comes to kerning? Are all numbers kerned with every other glyph or is it best just to kern 0-9 with all punctuation and parenteses/brackets/braces only? Interested to hear thoughts. Thanks.</p>
