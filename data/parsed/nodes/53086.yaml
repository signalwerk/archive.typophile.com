  html: |-
    <p>I´m right in the middle of starting a t-shirt-label called "Riot in Paris".</p>
    <p>Target audience: m/f, 18-30 yrs old, electronic music lovers.</p>
    <p>I´m looking for the best font, which I will use for the logo and most of the motives.</p>
    <p>It has to be young, contemporary, plain and striking (and maybe a little bit aggressive due to the "Riot").</p>
    <p>Any ideas?</p>
    <p>I appreciate your help!</p>
