  html: <p>These are scans from a book called <i>The Problem of the Media</i>, by Robert McChesney, published 2004. I tried Identifont to no avail. It seems very familiar but I can't put my finger on it. I don't know if it has small caps, but they aren't used in the book. OsFs are, but they are a little darker than the rest of the text, which I thought was strange. Anyway, here goes... <br> <br><img src="http://www.typophile.com/forums/messages/83/69958.jpg" alt="McChesney1"> <br> <br><img src="http://www.typophile.com/forums/messages/83/69959.jpg" alt="McChesney2"> <br> <br><img src="http://www.typophile.com/forums/messages/83/69960.jpg" alt="McChesney3"> <br> <br>It isn't as noticeable on screen, but in the actual physical book the figures appear much darker than everything else, almost as if it's a bold weight. My wife is trying to go to sleep and is not well pleased with my noise-making, so good night.</p>
  html_clean: <p>These are scans from a book called <i>The Problem of the Media</i>, by Robert McChesney, published 2004. I tried Identifont to no avail. It seems very familiar but I can't put my finger on it. I don't know if it has small caps, but they aren't used in the book. OsFs are, but they are a little darker than the rest of the text, which I thought was strange. Anyway, here goes... <br> <br><img src="http://www.typophile.com/forums/messages/83/69958.jpg" alt="McChesney1"> <br> <br><img src="http://www.typophile.com/forums/messages/83/69959.jpg" alt="McChesney2"> <br> <br><img src="http://www.typophile.com/forums/messages/83/69960.jpg" alt="McChesney3"> <br> <br>It isn't as noticeable on screen, but in the actual physical book the figures appear much darker than everything else, almost as if it's a bold weight. My wife is trying to go to sleep and is not well pleased with my noise-making, so good night.</p>
