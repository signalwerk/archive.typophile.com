      <p>first thought: brilliant. second thought after this discussion and some squinting: good, but not great. i think i responded more to the sentiment than the design.<br>
      interesting topic there: wherein lies the "response" to design ?</p>
      <p>glaser has always been a hero to me. i was fortunate to meet him once and like a true master he said just a few things but they still resonate with me. understatement is ultimately more powerful than overstatement.</p>
      <p>too bad about the fat yellow logo thing in the corner, but overall the poster is striking enough to hold my attention. crossing out the names of relatives is genius; we all have grandmothers.</p>
      <p>the hand keeps it human, but i admit it's a bit "mixed". i like it because the ambiguous upward reach is potent in a way that only understatement can be.</p>
      <p>thanks to those who ask me to think. and rethink.</p>
