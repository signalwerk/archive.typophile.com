      <p>It seems that the most significant obstacle campaigns such as this face is the sort of paradoxical relationship between their message and their environment. Billboards, bus sides, magazines, posters all play host to objects of our desires and fears, and as consumers we are accustomed to thinking of these as liminal spaces containing fantasies, lies, distortions, all sorts of salesmanship, and much of it already very intimate and presumptuous. If you want a message about a real emergency in the real world to really cut through the fog, you've got to do better than clever, and be more daring than elegant.</p>
      <p>The "acceptability" of Glaser's solution lies in the fact that you could use the poster for cancer, wearing a seatbelt, clean drinking water, or a variety of other issues. The tactic of presenting a destroyed version of something valuable (be it the word "daughter" or a Lexus) as a way of illustrating personal responsibility is typical of public service announcement scolding (there is also here the authoritarian threat that this could happen to you and your family). To the degree that it reinforces the general message that you as an individual ought to think about the larger world, Glaser's solution probably works just fine.</p>
      <p>But I think there is a real missed opportunity here. "Innocent people just like the innocent people in your family are dying in Darfur in an arbitrary fashion as though they are being crossed off a list" is not a very motivating message. Afterall, innocent people die in random, senseless ways all the time. And in a time of war (our own or Sudan's) we may even have an elevated tolerance for such deaths. Instead, the message ought to have been concerned with the injustice with which these people are being killed. </p>
      <p>The people of NYC don't need to be encouraged to be more compassionate or more caring than they already are. They're fine and I trust them to know injustice when they see it. What they generally don't know is who the Janjaweed are and what they are doing. If the headline "Genocide in Darfur" isn't furious enough and won't win any design awards, I might suggest a campaign that features some photos of the Janjaweed's criminal brutality with the tagline "Mind your own business." Not on a dare, they wouldn't.</p>
    html_clean: |-
