    html: <p>One legalistic tangent—I believe many states still have "one drop" clauses in law, which basically says that if a person has a single drop of non-white blood in his/her tree they are black. In a country where we campaign to have creationism taught in schools and fling ourselves under the authoritatian train with such zeal I can in a way empathize with the "all African" sentiment just as I refuse to check the caucasian box on various forms while such inane laws remain on the books. Still this line of thinking can turn on itself. I remember meeting a woman at a party with a swastika tattoo who claimed to be "reclaiming the symbol". Something about seeing Ms. Paltrow in the add sends me off in the same way.</p>
