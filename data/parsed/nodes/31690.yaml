    html: <p>Perhaps the problem stems from the fact that the people who create campaigns like this are most emphatically NOT african. Or at least that's my issue with them. There is no way any of us sitting here at our computers can possibly understand what it's like to be in Darfur right now. So while I applaud any and all efforts to raise awareness, money, and outrage, I think the campaign misses the mark. It just serves to remind us how totally un-African we are. I'd rather see the faces of the Africans themselves and hear their stories than stare at an undernourished actress who thinks she can identify with their plight (and congratulate herself for her effort). I am so tired of celebrities and the idiots who need to take their cues from them.</p>
