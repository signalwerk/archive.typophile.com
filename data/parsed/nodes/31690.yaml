      <p>I saw these poster on the subway about a month ago, and I have to admit I thought they were just rubbish. I gave them a pass because I thought they were student work, connected with SVA. I'm surprised now to learn they were Glaser's creation. Truly uninspired, ugly and conceptually garbled. I really hate the oh-so-literal visual interpretation of "We Are All African." And playing off the Vegas tourism tagline... um... just a little inappropriate? I dont know what message the designer wants me to walk away with except maybe poorly written, poorly executed design. Staring at these for the half hour I was on the train only made me angry... but not at the situation in Darfur.</p>
      <p>Of course that's just my opinion, they could be brilliant to someone else.</p>
