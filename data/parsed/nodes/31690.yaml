      <p>this raises a very interesting but sensitive topic - "the art direction of fascism" -<br>
      which i tried to (very carefully) introduce to my graphic design students back when i was teaching.</p>
      <p>i used albert speer and the nazi materials as a disturbing but important historical example of the ominous power of design. there's no doubt that speer made some very arresting visual choices. designers can have influence, often subliminal but also overt. </p>
      <p>i was mainly discussing symbols and colors and monumental scale. i know less about typographic history... i've heard rumors that hitler called serifs "decadent" and promoted san serif typography. that seems odd given the nazi's fondess for old german gothics. anyone know more ?</p>
      <p>i understand patty's sensitivity. we've discussed it, and i sense that the symbol might never be "reclaimed". just as the cross predates christianity, the six pointed star predates israel, the crescent predates islam, but the associations are so deeply reinforced that it might as well be ownership. </p>
      <p>too bad, in a way, but also fascinating. symbols become the symbolized. the power of reductive design.</p>
