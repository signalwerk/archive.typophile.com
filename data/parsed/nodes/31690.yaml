    <p>There is a media campaign in New York's subways designed by Milton Glaser to raise awareness about the massacres in Darfur. What's interesting about these from a design standpoint is the avoidance of the expected shock photos of poverty, violence, etc. Instead, the solution is completely type-based, and quite effective, I think. By avoiding the heart-wrenching people-as-victims photos, I think the people in question retain dignity and the "coversation" transpires at a rational level. (Although one could make the point that the disaster has passed the point of "rationality" being appropriate.) Any thoughts?</p>
    <p>Here is a story with some photos of the ads:</p>
    <p><a href="http://www.designdrivethru.net" title="http://www.designdrivethru.net">http://www.designdrivethru.net</a></p>
