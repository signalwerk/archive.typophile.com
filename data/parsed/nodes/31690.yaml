      <p>&gt;nous sommes tous américains</p>
      <p>I think this statement was more on point. </p>
      <p>First French and others in Europe did in fact empathize with the suffering of those in the US. The fact is that the US is a derivative of European culture and the majority are of European ancestry, and through the media and travel French have some familiarity with the US. </p>
      <p>In the case of Darfur, for most Americans Darfur was so unknown and alien that it took an effort to empathize. The point of the campaign was to say we should empathize, as those in Darfur are human too--which of course is both true and important. But instead of saying we should--which some do, but not in massive, effective numbers--they say 'we are all africans' which is true neither literally nor in the sense of empathizing reflexively. </p>
      <p>Secondly, it was evident to French and other Europeans that they wouldn't be exempt from the threat of groups who were terrorists in the name of Islam, such as those who had attacked the US. This was also unfortunately true. </p>
      <p>The immediate threat of the Sudan government-sponsored violence against the people in Darfur is not a threat likely to be immediately redirected at the US and Europe in the same way.  </p>
      <p>The poster campaign gets it very right by emphasizing the common humanity of those in Darfur, but the 'We are all African' is wrong enough to detract from the message, IMHO.</p>
