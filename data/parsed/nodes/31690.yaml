      <p>I think Glaser is presenting a safe design/composition that is in keeping with his somewhat dated and tired style. </p>
      <p>Where's the <a href="http://dictionary.reference.com/browse/passion">passion</a>? I don't see it.  </p>
      <p>There's an ominous urgency prevalent in today's world. And I don't get that feel from the Glaser comment either. The rhythm of the piece is too demanding and not spontaneous. The balance of the piece smacks of colonial middleclass compromise. In short - it's got no soul.</p>
      <p>Perhaps Glaser is no longer hungry - no longer pissed off - and has become set in his ways - become too commercial. This poster is stale, lame, and is without a pulse.</p>
      <p>If I was to graphically speak of Darfur - I would speak in terms of brute force and play off that. Darfur struggles with massive brutality - lives shattered and ripped apart, sorrow crushing childern. There's an enourmous weight to what is happening in Darfur. </p>
      <p>So when I see Glaser's little words with little lines comfortably arranged amoungst far to much blank space all of which wants to 'discuss' with me some kind of loss to us all, I see a graphic coming from someone who is NOT empathetic to the great weight of brutal killing on an enormous scale.</p>
