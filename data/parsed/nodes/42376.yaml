    date: 2008-07-12T09:19:00
    date_raw: 12 Jul 2008 — 9:19am
    votes: null
    html: |-
      <p>Your lowercase x will give you problems when it gets smaller.  The lowercase g will also be a problem, not enough space between the upper and lower bowls. It looks ok in display, but that is not its intended use.</p>
      <p>As will the default spacing which seems way too tight for its intended use. Both the word and the inter-character spacing. Kinda weird to me to design a typeface intended for small sizes and not show a sample of it at small sizes.</p>
      <p>You should proof the design at its intended size, and not get too concerned with what it looks like large.  Also, all those soft edges may render strangely in small sizes, you better pay close attention to how you hint it.</p>
