    <p>Hi. I have a problem. I had a great plan to use Fedra sans and Fedra serif (<a href="http://www.typotheque.com/fonts" title="www.typotheque.com/fonts">www.typotheque.com/fonts</a>) for big, industrial corporations personnel magazines family. Unfortunately Fedra was out of the game since the brand manager didn’t want to see font that’s she’s seen before in one of their publications. (come on, redesigning doesn’t mean that you really have to get rid of everything good as well!)</p>
    <p>Fedra was so perfect:<br>
    -it had some playfulness and softness, big variety of weights, it suports all needed languages (Russia, slavic languages etc). I really need to get out of being upset with my great idea using Fedra crashed, and find something totally new: something that is not too serious, but is clear and fresh and speaks to people working in the factories and does it in all those different languages. </p>
    <p>please, cheer me up! Thanks</p>
