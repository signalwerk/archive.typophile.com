      <p>Thanks for suggestions! I would seriously consider them, just that they are lacking Cyrillics.</p>
      <p>Oh, boy, I could make a book about “yes it’s cool, but it doesn’t support scandinavian, cyrillic and East Europian glyphs” That’s what you have to deal in Finland all the time with!</p>
      <p>Anyways. What do you think about Leksa? I have my doupts that it might be too oldish and stylish for my purpose? But I love it!</p>
