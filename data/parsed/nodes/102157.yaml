    date_raw: 10 Apr 2013 — 3:37am
    votes: null
    html: <p>Can't agree more with Jodie. Definitely Lubalin Graph to me and dramatically squooshed. If the /e is the only letter that really bothers you, I suggest you to borrow it from <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/avant-garde-gothic/std-demi-bold/glyphs.html#glyphs/541078/308" rel="nofollow">Avant-Garde</a> (available as stylistic alternate though OpenType features). Avant-Garde has been designed by amost all the same persons (Lubalin, Carnase, Benguiat...) and is likely the sans version of Lubalin Graph (or Lubalin Graph is the slab serif version of Avant-Garde).</p>
