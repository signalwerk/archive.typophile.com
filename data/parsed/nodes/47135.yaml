    <p>I’ve recently taken on a fairly big brand job and inherited a logotype which utilizes Baker Signet with the addition of some slight changes. I’m looking to streamline this logo and presented Fedra Sans along with some of the existing nuances. Still client response was “too far out.” I’m hoping someone may have a suggestion of a typeface that embodies some of Baker’s qualities but be a bit more contemporary if you will. A foundation for me to move this logotype forward. I appreciate any input.</p>
    <p>Thank you,<br>
    J.C.</p>
