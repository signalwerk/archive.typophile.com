  html: |-
    <p>I am helping a friend ( who is a product design student) put together a document about his internship at Renault. The document mainly talks about how he went about designing a new car… right from research to his final concepts for the car. The car is more of a ‘concept car’ and not a car that you would see on the roads too soon. I would be grateful if you guys could suggest fonts that might work well for the body text and for the headings of such a document. I hope the information I have provided is enough for you to help me out with your suggestions. </p>
    <p>Thank you!</p>
  html_clean: |-
