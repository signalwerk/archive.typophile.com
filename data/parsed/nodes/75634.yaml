      <blockquote><p>a thread somewhere that said best to draw f-lig glyphs even if they're no different from their component parts, for maximal compatibility</p></blockquote>
      <p>That’s because fi and fl are maybe the only ligatures which have their Unicode codepoints. But, IIRC, Adobe deprecates their use in favour of the proper Unicode feature.</p>
