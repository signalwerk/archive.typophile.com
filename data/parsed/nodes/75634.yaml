  - id: 446091
    user_id: 3254
    user_name: eliason
    user_path: null
    user_image: /files/pictures/picture-3254.png
    date_raw: 4 Jan 2011 — 9:29am
    date: 2011-01-04T09:29:00
    votes: null
    html: |-
      <p>I just couldn't tell how the f-ligs differed from /f/ and /i/, and wondered if they actually got turned off in the specimen. If they're intended to be unconnected, would a contextual-alternate /f/ serve you better than ligatures?</p>
      <p>On the dollar, the issue I see is the closed counterspaces being so small compared to the open counters on the other side of the bar. This (it seems to me) can be an issue with this glyph when the bar is bold, or when the apertures of the /S/ are open, and in this case you have both going on. Did/would you consider a dollar with the bar not passing through the /S/?</p>
      <p>On the diacriticals, I suppose if there's no crashing there's no problem. </p>
      <p>A couple other notes: I wonder if your breve is too shallow. Will your pound get read as an /E/? Is the end of the ampersand that comes up too closed-looking compared to the open apertures of /S/ etc.?</p>
