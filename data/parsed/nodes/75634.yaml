    <p>Polyester is a 'blended' sans that came about through experimenting with interpolation. I took two other fonts I'm working on and did a 50% blend, tidied up the stray points and here's the synthesis. (Top is untitled techy sans, bottom is Carnet, also up for crit in this section.)<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Polyester-Blend_4348.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/Polyester Sample1_5182.jpg"></div><br>
    I'd be interested to hear anyone's thoughts and/or recommendations.<p></p>
