      <p>Oh, right. I'd read a thread somewhere that said best to draw f-lig glyphs even if they're no different from their component parts, for maximal compatibility. What benefit do you see in a c.alt?</p>
      <p>$: You mean just the spurs at the extrema instead of running through? Or I could rotate the bar round?</p>
      <p>I like your other questions. I was wondering a similar thing about breve...again a familiarity thing...I've never needed to use one and the open counter style of this face seemed to fit a shallow one, but I think I'll make it a bit more pronounced. I'll look at those other two glyphs. I'm not quite happy with ampersand myself.</p>
