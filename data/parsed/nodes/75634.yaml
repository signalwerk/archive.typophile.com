      <p>To me, the top one is nice but not fantastic. Carnet on the other hand IS fantastic. So, blending it with a 'nice but not fantastic font' is not really worth it. Sure, it's a quick way to get an extra typeface, but I don't think it actually adds something. Just something I notice in Carnet:<br>
      Because the descenders are so short, there's little room for your g. It looks to me as if it has a smaller pnt size. Maybe try to make it wider, or just go for a single story g. Hope this helps.</p>
