      <p>Fun! I'd say wire up the ampersand. While the V is fine, you may want to see if a V more in the style of your Y would be better.</p>
      <p>Some users will probably want a plain intersection to use instead of a space. Since an alternate space glyph may be hard to implement, you could probably make it the plus sign.</p>
      <p>The exclamation point will be a challenge... I imagine a straightforward solution would have inadequate impact. Maybe the glyph could be like three exclamation points.</p>
