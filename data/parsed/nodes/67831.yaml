    html: |-
      <p>I would recommend connecting the C to the right from the top terminal, not the bottom terminal, to avoid possible confusion with a G. Also, the opening of C is very small, so the other terminal should probably stop where the € does.</p>
      <p>There are some places where more of a sense of connectedness could be achieved by trimming off part of a glyph to make an intersection into a bend. The bottom of @, for instance, could stop at the middle, making it a continuation of the connector. Maybe the same for 9. The top of &amp; could be open for a similar connection on top (and I think your first &amp; had better proportions and angles, especially if you take this suggestion).</p>
      <p>FlxB, ₤ is a symbol distinct from £; while both can be used for pounds sterling, one stroke is more common for pounds and two strokes is used for lira.</p>
