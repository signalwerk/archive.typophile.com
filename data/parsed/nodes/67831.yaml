      <p>@FixB : Yeah I think it could be great to have some variations to make different connections between letters, and I also tought a bit about making ornements. It could be funny and push the puzzle &amp; labyrinth effects further.</p>
      <p>BTW, It could be very interesting to have vertical ligatures with OpenType, even if I'm not aware of such thing.</p>
      <p>@brockfrench : Thank you for your drawing! I understand your idea and I also thought about making it this way, but I soon left this idea because my goal is to make characters with connecting lines only.</p>
      <p>I think adding inset forms this way would make them look heavier and focus too much the reader on.</p>
      <p>Also, I admit I didn't really followed my rule for the punctuation, but I think it's better like this to let the whole thing breath a little.</p>
      <p>Thanks for your help.</p>
