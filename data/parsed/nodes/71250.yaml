      <p>Kerning Copy/Paste and import options are buggy; the more pairs you have the worse it gets. IIRC Karsten Lucke has written some scripts for doing this stuff correctly, it might be worthwhile to ask him about them.</p>
      <p>But I highly recommend that you just license Metrics Machine and not kern in Fontlab at all.</p>
