    <p>I'm having trouble figuring out a thing in FontLab. I'm trying to copy all the kerning data from one of my fonts to another one, but it's not working right. I go into the class kerning panel and click "Copy classes from a font", but it only copies the classes, not the actual kerning numbers. So when I test the kerning, none of the letters kern at all.</p>
    <p>But with some of my fonts it does work. Particularly, it works with the ones where the letters are all in the right order in the font window, which is to say they're alphabetical. In the ones where it doesn't work, the letters are all jumbled around once you get out of Latin-1 (sample: ŔĂĹĆČĘĚĎĐŃŇŐŘŮŰŢ). Actually the weird part is that on one of the two fonts where it worked, the letters are jumbled, although in that font I remember they've been ordered before; I don't know when it changed.</p>
    <p>How can I get the letters in the right order, and more importantly, how can I get the kerning to copy from one font to the other? Is it something to do with encoding? Because I really don't understand that well.</p>
    <p>Thanks!</p>
