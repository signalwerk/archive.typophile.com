      <p>Here's what to do: With the first font, open the Metrics Window, click the "Save Metrics" button (second from the left at the top). This will create an .afm file, which is a text file containing metrics and kerning info. Now switch to the other font, open the Metrics Window, and click on the "Open Metrics" button (top left) and choose the .afm file you just created. A warning message will appear, reminding you to make sure you know what you're doing. (It's a good idea to save the font before doing this.) If you click "Continue", it will ask you which data you want to import from the .afm file. Choose "Do nothing", "Completely replace kerning data in current font", and "Do nothing" from the three popups. The second font will now contain a kern table identical to the first font.</p>
