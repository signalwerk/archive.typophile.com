    html: |-
      <p>Another method: </p>
      <p>In the source font, save the OpenType Layout features into a .fea text file (using the OpenType panel popup menu). </p>
      <p>In the target font:<br>
      1. Open the OpenType Layout features from that .fea text file (using the OpenType panel popup menu).<br>
      2. Compile the OpenType Layout features (using the Compile button on the OpenType panel).<br>
      3. Open the Preview panel, OpenType Features tab, and click on the "Import kerning from [kern] feature" button. </p>
      <p>Alternatively (if you have the same classes set up in both fonts), in the source font you can just generate a "kern" feature, then copy-paste the "kern" feature definition from the source font's OpenType panel into the target font's, then compile the features in the target font and use the "Import kerning from [kern] feature" button on the OpenType Features tab of the Preview panel. </p>
      <p>Regards,<br>
      Adam</p>
