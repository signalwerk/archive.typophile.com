    <p>Hi everyone,</p>
    <p>I need critiques of these typefaces:</p>
    <p>Avant Garde Gothic<br>
    Benguiat Gothic<br>
    Bauhaus</p>
    <p>It's for a project that serves as a cautionary tale for new designers against using these faces for text, or setting them at all. Please be frank, and hold nothing back. I need some good juicy bits for my project. </p>
    <p>So go on, how bad are they really?</p>
