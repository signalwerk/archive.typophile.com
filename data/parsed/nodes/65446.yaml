      <p>&gt;I wonder if, typographically speaking, the third example is an error.</p>
      <p>All small caps, all the time? I think the third example is otherwise an error that is comfortable because it is congruent with the compromise that is the quote alignments for uppercase. Multicase alignment of quotes works easier the bigger the x-ht, and less so the smaller the x-ht (apos. shows first and worst with a small x-ht, I think because the back end of ' before s, e.g. is so open. With small caps floating between the cases, quotes and small caps should just work with the multicase alignment if x-ht is otherwise.</p>
      <p>&gt;It used to be standard practice for lettering artists to raise the apostrophe and quote marks in all caps settings.</p>
      <p>I like that, but am assuming one line of text. I don't think even OpenType can detect this, so a special set of high quotes, as much as I'd love to make them sometimes, would require decidedly manual employment I think, (as perhaps small cap aligned for all small caps all the time, quotes would need to be employed?).</p>
      <p>Cheers!</p>
