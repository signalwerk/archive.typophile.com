      <p>“in my opinion your third example is an error indeed. The apostrophe should be as in the second example or just a bit lower than that”</p>
      <p>When setting the apostrophe aligend to the x-height, I’m thinking about some very specific typographic setting; in particular, a title, or a display text, set in all small caps with very tight leading. Like this:</p>
      <p></p><div class="imageWrap"><img src="/files/pilgrim_cover_3422.jpg"></div><p></p>
      <p>The matter here is avoiding the SC apostrophe, commas, etc, to clash with the above or bottom text line. I wouldn’t use an apostrophe set that way in a default line of current text (say, in a book page). The thing can be adjust manually, of course, but I was suggesting that having some alternate SC glyphs, with aligned height, would be useful.</p>
