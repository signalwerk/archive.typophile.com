    <p>There is a fact that frequentely happens when using the apostrophe with small caps. When the text is set in all small caps the apostrophe seems a bit out of the way - on a level too high - so I manually adjust it, like this:</p>
    <p><img src="/sites/default/files/old-images/apostrophe_3878.jpg"></p>
    <p>I wonder if, typographically speaking, the third example is an error. But an alternate small caps apostrophe, paired to the x-height, could be useful if available in the typeface glyphs palette.</p>
