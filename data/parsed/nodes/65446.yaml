      <p>Did early small caps fonts have numerals in them? If so were they lining or old-style?<br>
      I know a few fonts nowadays offer small caps numerals which is definitely a great feature, But in a typeface like the one Nina used here the small caps are at x-height and small caps punctuation is designed that way too. So the old-style numerals look really nice in those parentheses the problem is when the small caps are bigger than x-height. 'Petite' caps are another great feature. It's amazing how type designers keep making everyone else's life easier.</p>
