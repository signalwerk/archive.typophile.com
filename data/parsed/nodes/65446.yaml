    html: |-
      <p>This is a question that may be addressed in the "all small caps" feature of OpenType fonts.</p>
      <p>What I've done is to leave "normal" punctuation in the standard Small Caps feature (smcp), and add what I consider to be necessary small-cap-height punctuation characters in the All Small Caps (c2sc) feature.</p>
      <p>So I usually provide matching small cap height Question and Bang, but leave quote marks and parentheses at full height.<br>
      I like the way that looks; for a rationalization, I would say that small caps are small on the page, and you don't want parentheses getting muddled up with capitals, looking like letters rather than punctuation, and apostrophe getting lost.</p>
      <p>It might be different if you really tracked out the letter spacing, old school style, but that's not the default look for small caps these days.</p>
      <p>As I say this is just my preference and practice.<br>
      What do others think/do?</p>
      <p><img src="/sites/default/files/old-images/good_3956.jpg"></p>
