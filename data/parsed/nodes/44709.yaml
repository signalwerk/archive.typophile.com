    <p>In 2008 font retailer <a href="/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop</a> released FontStruct, a free, online tool for the design, publishing and sharing of user created&nbsp;fonts. </p>
