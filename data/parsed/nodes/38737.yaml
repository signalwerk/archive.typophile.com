    <p>Hi there.</p>
    <p>I just discover this site... great!<br>
    just in time, I did a new logo for our company and, even I like it, I have little doubts, mostly abot the first “e”.</p>
    <p>I would apreciatte any kind of critique and opinions on it.</p>
    <p><a class="freelinking-external" href="http://www.eragin.com/txo/logo_eragin2.jpg">the logo</a></p>
    <p>I actually tried some diferente “e” and finnaly that’s the one... here some that I tried with (the first is the one I used finally): </p><div class="imageWrap"><img src="/files/logo_versions_3506.jpg"></div><p></p>
    <p>My idea was to create a especific type for this logo, not two complicated, readable (is this word ok in english?) and kind of contemporary... or something :P</p>
    <p>We use the type inside this rounded black square as a base, and them put some draw or imagotype behind, change colour or texture depending on when and where we are using it... it’s a very dinamic logo... but that’s another story...</p>
    <p>how about this type?</p>
    <p>thanks to all</p>
