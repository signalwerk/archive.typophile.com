    html: |-
      <p>Would you elaborate on the use for this? Size it will appear? Feeling you're trying to convey?</p>
      <p>The 'retro' idea is coming across, for sure. Some nice curves in there too. </p>
      <p>You could get better legibility from your r if you gave it a little more thick/thin contrast.</p>
      <p>The -lab- doesn't have as much sense of a continuous pen stroke as the rest—that could be ok.</p>
      <p>Overall the strokes might benefit from standardizing their angle and weight, and the rhythm between them. Or you could go the opposite direction and push the hand-drawn quality, maybe by accentuating the different heights of the ascenders.</p>
