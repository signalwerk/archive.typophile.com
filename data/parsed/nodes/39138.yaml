      <p>When you mention Garamond, being a humanistic typeface, as well as looking for something that should be more “innovative” I can’t help but to think of my own typeface: <a class="freelinking-external" href="http://www.fontshop.com/search/?q=Profile&amp;site=d&amp;btnG=Go">FF Profile</a>. A sans serif text face that has it’s roots in the renaissance but with a minimum of contrast. Maybe this could be a healthy contrast to the more geometric Crank8.</p>
      <p>Martin</p>
