    html: "<p>Ludovic Balland's website states \"LUDOVIC BALLAND TYPOGRAPHY CABINET\" and the business case for (Editorial &gt;) BUCHNER BRÜNDLER says \"typeface: plain\" so may be it would be not so hazardous to consider it as a bespoke typeface created by Ludovic Balland Studio. The same \"plain\" has also been used for \"BARENTS LESSONS\" editorial.</p>"
