  - id: 234103
    user: 1043
    date: 2007-10-18T11:28:00
    date_raw: 18.Oct.2007 11.28am
    votes: null
    html: |-
      <p>The sure fire way is to go to your home folder, then go to Library &gt; Fonts. Drag both files to the Fonts folder. This is essentially what Font Book does when you tell it to install a FFIL file you double-clicked on. I knows about the companion LWFN file automatically. FontExplorer’s default behavior is to make a copy of the files in its private database, but you have to drag both files to it, not just the FFIL. </p>
      <p>Generally, when I’m testing fonts, I don’t use a font management tool. I copy files manually to either my user Fonts folder or the Adobe Fonts folder ([main hard drive]/Library/Application Support/Adobe/Fonts/).</p>
