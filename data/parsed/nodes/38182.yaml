    <p>I’m finishing up my font Insider and a friend of mine is test-driving it. The font seems to work just fine in FontExplorer, but doesn’t work well in InDesign CS3 (5.01) and Illustrator CS3 (13.02). All fonts are suitcases for Mac.</p>
    <p>It keeps giving out this error:<br>
    “You might not be able to print with “fontname” or stroke its characters because the font outline file is missing.”</p>
    <p>That the hell does that mean? I never get that error here. I don’t have InDesign CS3, so I can’t reproduce the problem. Is there anyone else that get’s the same errors and knows how to solve this?</p>
