    html: |-
      <p>Normally I double click the FFIL file and the font is installed in Fontbook. I don’t know how FontExplorer works, but my guess is that it works the same. How else should you install both files?<br>
      If you check the destination folder for the fonts, both files are in there.<br>
      Is there another problem that might initiate this error?</p>
