    html: |-
      <p>"finishing off now, and with a pdf of instructions for use"</p>
      <p>If you think through the substitutions, alternates and default behavior, and get some assistance with the OpenType programming, instructions won't be necessary. You can definitely add dozens of alternates and ligatures, because I agree those will make this design all the more convincing and fluid, but it's unrealistic to think people will carefully select alternates. Wouldn't it really kick kiester to provide 2 or 3 different "states" or conditions? Consider offering stylistic variations like Formal, Casual, Feverish, Passionate. You set up the alternates and ligatures that create those different effects, and any user can choose which one is suitable for their copy, as a simple OpenType feature choice. </p>
      <p>One reason for this is that if you offer all the swash letters as a single option, you get a mess. It's likely to never look very good if all the swashes always appear together; and as you've already noticed, it really looks cool when you judiciously add a few swashes here and there. That would only be possible if you control what happens with each user choice. If you want assistance in setting up OT feature code, I suggest contacting Tal Leming or the House Industries gang; they have done great work setting up automatic substitutions, and I really think this design will be fully realized only with a lot of OpenType enhancement. I really like it, and I encourage you not to try to finish it too hastily.</p>
