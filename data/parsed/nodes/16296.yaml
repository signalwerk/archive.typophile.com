    <p>Hi typophiles, (or typenerds as my wife calls us),</p>
    <p>This is my first post inviting criticism of my design. </p>
    <p>I'm working on this informal script at the moment. I drew it with pen and ink first to get the thick/thin contrast, but I didn't want it to look 'Dickensian' - I'm trying to achieve a naturally flowing style without formal stiffness. I have completed the 'rough' style, and I thought it might look pretty good as a smooth style - so that's what I'm doing now.  I'm also going to produce a more refined 'fine' with as-thin-as-I-can-go thins style.</p>
    <p>At the moment it is Postscript, but I'm toying with the idea of contextual alternates in Opentype. The FontLab manual is no great help as I find it to be written from a programmers viewpoint, unfortunately I'm a designer and a lot of that stuff goes way over my head. I wish Leslie Cabarga had written the manual, as his 'Learn FontLab Fast' has excellent illustrated step-by-steps, but is a bit brief in the OpenType section.</p>
    <p>Does anybody know of any easy to understand intructions of exactly what to do, as I'm very impatient with plowing through the manual to extract the info.</p>
    <p>Thanks in advance,</p>
    <p>See new pdf. 28 November 2006</p>
    <p>Nick Cooke, G-Type.</p><div class="imageWrap"><img src="http://typophile.com/files/typophile.jpg"></div><p></p>
