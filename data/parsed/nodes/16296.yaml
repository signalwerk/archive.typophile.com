      <p>Nick,</p>
      <p>This last sample shows how interesting and vital this design can be. Please, DO take it to the next logical level and add contextual alternates. 1, 2 or 3 alternates per letter, plus a bunch of ligatures and final forms would make this a really exciting handwriting face. I think the rough version is best. </p>
      <p>If you are not versed in OpenType code, you might want someone to help you set that up. It can be confusing, and it definitely requires patience in testing, but I think the shapes you have already have terrific promise. </p>
      <p>This is unique in that it seems to be written with a pointed quill dipped in an inkwell. Very few script typefaces give that feeling. The 'splat' alternates will be like icing. Keep going!</p>
