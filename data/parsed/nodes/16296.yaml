    html: |-
      <p>Ah, then you are really talking about a specimen, which I fully encourage. Definitely keep the options simple to use. Looks like we understand the user similarly. It's not just London where OpenType is still a foreign concept. ;) I just don't want you to miss opportunities for each of the options to be compelling, distinct, interesting, memorable, and especially, believable as handwriting. Your design is so vivacious, and there haven't been any really compelling, loose handwriting faces with all those bells and whistles, and yours could be the first one! Again I say, it's worth the extra fuss. </p>
      <p>Here are some other names you could consider for different states:</p>
      <p>Humble Servant (very regular)<br>
      Wish You Were Here (more casual)<br>
      To My Dearest (gushingly, yet tastefully ornate, maybe add flowers, birds?)<br>
      Mad Genius (violent spatters)<br>
      Admiral Bombast (excessive ornate swashes, since sometimes this is what's wanted)<br>
      Beat Generation (spatters, fingerprints, coffee rings, etc)</p>
      <p>Continue having fun.</p>
