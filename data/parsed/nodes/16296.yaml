      <p>I have been moved by this typefce to make my first post - this strikes me as a magnificent creation Mr Nick. </p>
      <p>I have found almost all scripts to be a problem in one way or another based on my particular prejudices, and can think of only one or two instance of using one in my work over the last 11 years.</p>
      <p>I am currently working on a Heritage project and this face would be ultra suitable for this so am keen to know when it becomes available. I have created a defacto face for the display implementation by digitising an original sample of a gothic face printed within the local area in 1851. Olicana will work beautifully in key paragraph settings and will add some real humanity to the various applications. </p>
      <p>Sorry to hear about your legal trevails. </p>
      <p>Salvatore<br>
      Lyttelton, New Zealand</p>
