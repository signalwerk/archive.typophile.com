      <p>I only started it as a bit of distraction from doing more 'formal' stuff – I just got a bit carried away. One can always add something more. It's knowing when to stop that's the problem.</p>
      <p>I thought I had.</p>
      <p>Well, Hrant I would say that it's good enough. And I know it's not perfect.</p>
      <p>But is that good enough?</p>
      <p>Nick Cooke</p>
