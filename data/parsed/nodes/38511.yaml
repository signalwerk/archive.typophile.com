    html: |-
      <p>This topic was inspired by a conversation I overheard in an elevator yesterday. Two women were looking quizzically at the Rockies logo, trying to figure out what GR stood for.  One suggested the team was from Grand Rapids, Colorado (is that a place?) while the other wondered if the full name was “Grand Rockies.” </p>
      <p>I was wholly amused.  Sure, I really want to fix the wonky bowls of the Red Sox B, but, in my opinion, it’s not nearly as lazy as either of the Rockies logos.</p>
      <p>Wow, YES, the BOSTON needs kerning, and RED looks like it’s bouncing along inside a stage coach wheel.</p>
      <p>Given the expansive sports branding empire, how do these logos end up so glaringly imperfect?</p>
    html_clean: |-
