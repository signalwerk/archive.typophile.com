      <p>Through technology, the ability to produce fonts faster than ever before - compare and contrast that with where the technology was at the turn of the century and how over time, photosetting - then digital - changed all that. </p>
      <p>And that's just technology. It's not just technology. </p>
      <p>20th century design movements reshaped the types we use in drastic ways. Just charting this evolution would make an incredible research paper; from bauhaus to ... garage fonts.</p>
      <p>Businesswise: how was type bought, distributed, used - ATF, Linotype, Monotype - thru ITC - and compare that with where we were by around 2000. </p>
      <p>You're gonna need a copy of Meggs' History book.</p>
      <p>and</p>
      <p>Stanley Morison and Beatrice Warde.</p>
      <p>Those two should spice up a paper or two.</p>
      <p>s.<br>
      mehallo.com</p>
