      <p>Pay no attention to the underemployed-by-choice, dear ramelton, the bad students of the past rise against the good ones of the future in every generation. That's the good and the bad, I leave the ugly for later;) </p>
      <p>The arrival of the typewriter as a tool for the masses.<br>
      The perfection to 1/10,000 of an inch accuracy of the mechanical punch cutting process.<br>
      The development of the commercial photo composition machine.<br>
      The automation of post-input typesetting.<br>
      The invention of the cargo container and, the founding of Typophile.</p>
      <p>I'll leave it to the student to follow these leads, because I agree with John H that research skills are one of educations greatest gifts. :)</p>
      <p>Cheers!</p>
