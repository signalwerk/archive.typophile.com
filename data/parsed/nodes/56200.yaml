      <p>“ What were the important developments in typography during the 20th century ”</p>
      <p>The dongle, also known as the hardware key. Fonts in old printers were supplied in a cartridge that was 'plugged' in the printer.<br>
      No cartridge, no type.  Good old days.</p>
