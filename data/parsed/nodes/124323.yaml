    html: |-
      <p>So it looks like there is still no simple, recommendable and bullet-proof solution for this on the web. :-(</p>
      <p>U+202F would be the way to go in theory, but most fonts will not have it and the browser’s fallback results might be unacceptable.<br>
      The SPAN solutions do work, but they are just styling, not encoding. So they might not be preserved properly when copied and the people who edit the texts of websites often don’t even have the permissions or knowledge to write this stuff out in HTML/CSS.</p>
