      <p>Reasonable way of doing it would be to use normal non-breaking spaces and style their width in CSS. That way, when copying, or if CSS fails, people would still get the non-breaking space which they already use and expect in those situations.</p>
      <blockquote><p><strong>Lorem&nbsp;? Ipsum.</strong></p>
      <p><strong>Lorem</strong><code>&lt;span class="thin"&gt;</code><strong>&amp;#160;</strong><code>&lt;/span&gt;</code><strong>? Ipsum.</strong></p>
      <p>.thin {<br>
          display: inline-block;<br>
          width:   0.125em; /* 1/8 em */<br>
          }</p></blockquote>
      <p>Ellipses and consecutive quotation marks could just be wrapped in spans and tracked, 'cause people usually don't write them with, or expect, spaces inside. (If you also do it that way in InDesign with a tracked character style, you can map it to a classed span when exporting to HTML or EPUB.)</p>
      <blockquote><p><strong>Lorem, “&nbsp;‘Ipsum’ dolor” sit amet .&nbsp;.&nbsp;.&nbsp;?</strong></p>
      <p><strong>Lorem, </strong><code>&lt;span class="ls-punct"&gt;</code><strong>“‘</strong><code>&lt;/span&gt;</code><strong>Ipsum’ dolor” sit amet </strong><code>&lt;span class="ls-punct"&gt;</code><strong>...?</strong><code>&lt;/span&gt;</code></p>
      <p>.ls-punct {<br>
          letter-spacing: 0.125em;<br>
          white-space:    nowrap;<br>
          }</p></blockquote>
