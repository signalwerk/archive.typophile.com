  html: <p>Are there any uses for thin or hair space where it wouldn't make sense for them to be non-breaking? I ask because I can't think of any, and the fact they aren't hard spaces makes them pretty unusable in reflowable text such as web. Why did Unicode not at least go with two equal sets of spaces, one of which would be non-breaking, instead of just a single  non-breaking word space?</p>
