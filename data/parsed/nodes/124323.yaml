    html: |-
      <p>According to the Unicode Standard Annex #14,  <a href="http://unicode.org/reports/tr14/tr14-17.html">Line Breaking Properties</a>, the following characters are in the class <strong>BA</strong>, which means there is an opportunity to break after, but not before.</p>
      <p>2000    EN QUAD<br>
      2001    EM QUAD<br>
      2002    EN SPACE<br>
      2003    EM SPACE<br>
      2004    THREE-PER-EM SPACE<br>
      2005    FOUR-PER-EM SPACE<br>
      2006    SIX-PER-EM SPACE<br>
      2008    PUNCTUATION SPACE<br>
      2009    THIN SPACE<br>
      200A    HAIR SPACE<br>
      205F    MEDIUM MATHEMATICAL SPACE</p>
      <p>That being said, the breaking algorithm (cf  <a href="http://unicode.org/reports/tr14/tr14-17.html#ExampleTable">Example Pair Table</a>) specifies that you may not break after a character in <strong>BA</strong>  if it is followed by a character in one of the classes <strong>CL</strong>, <strong>EX</strong>, <strong>SY</strong>, <strong>IS</strong>, <strong>ZW</strong> and <strong>WJ</strong>.</p>
      <p><strong>EX</strong> contains the exclamation mark and the question mark; <strong>IS</strong> contains the semicolon. It appears that French typography is saved and does not need the narrow no-break space (<code>U+202F</code>; cf <a href="http://unicode.org/udhr/n/notes_fra.html">Unicode Notes on French</a>).  A consequence of the algorithm is that those characters may not be "unusable in reflowable text such as web" as you say.</p>
    html_clean: |-
