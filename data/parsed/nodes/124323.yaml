      <p>They are great for any sort of groups of figures or letters, which are meant to be shown as a unit. Abbreviations, dates, large numbers, bank accounts, measurement units, mathematical equations …<br>
      You basically encode that the unit belongs together, but is just visually separated a little bit. And that’s why you don’t want it to break at the end of the line. Power Supply: 110<br>
      V</p>
