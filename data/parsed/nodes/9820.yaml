  html: <p>Bit of a problem at my job. <br> <br>We produce hangtags, warranty booklets and other related  <br>printed materials for Samsonite. Multi-lingual texts including  <br>Eastern European, Greek and Cyrillic are sent to us which  <br>we have to lay-out on in QuarkXPress on Mac. <br>These multi-lingual texts were input on PC using unicode  <br>fonts, most probably Arial MS Unicode. <br> <br>So we have a multiple problem. <br> <br>First, we have no other option but to migrate to inDesign CS,  <br>as QXP doesn't support Unicode until the bug-infested and  <br>bankrupcy inducing version 7 is released in 2008 or so. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">  <br> <br>Second, we need Helvetica (as prescribed by the Samsonite  <br>style manual) in Rg, Ob, Bd and BdOb weights as a Unicode  <br>font. I found a Linotype Pro version including everything I  <br>need at MyFonts, but when I double-checked the fonts on the  <br>Linotype site it looked as if in some instances Greek and in  <br>other both Greek and Cyrillic were <i>not</i> included. <br> <br>Can anybody confirm that this version of Helvetica is indeed  <br>a Unicode font including Easter European, Cyrillic and Greek,  <br><i>not as separate add-on fonts.</i></p>
  html_clean: <p>Bit of a problem at my job. <br> <br>We produce hangtags, warranty booklets and other related  <br>printed materials for Samsonite. Multi-lingual texts including  <br>Eastern European, Greek and Cyrillic are sent to us which  <br>we have to lay-out on in QuarkXPress on Mac. <br>These multi-lingual texts were input on PC using unicode  <br>fonts, most probably Arial MS Unicode. <br> <br>So we have a multiple problem. <br> <br>First, we have no other option but to migrate to inDesign CS,  <br>as QXP doesn't support Unicode until the bug-infested and  <br>bankrupcy inducing version 7 is released in 2008 or so. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">  <br> <br>Second, we need Helvetica (as prescribed by the Samsonite  <br>style manual) in Rg, Ob, Bd and BdOb weights as a Unicode  <br>font. I found a Linotype Pro version including everything I  <br>need at MyFonts, but when I double-checked the fonts on the  <br>Linotype site it looked as if in some instances Greek and in  <br>other both Greek and Cyrillic were <i>not</i> included. <br> <br>Can anybody confirm that this version of Helvetica is indeed  <br>a Unicode font including Easter European, Cyrillic and Greek,  <br><i>not as separate add-on fonts.</i></p>
