    html: '<p>Yves, you need <b>Helvetica Linotype</b>. This is a family of four OpenType fonts. The four weights available are just the ones you need (the "italics" are only obliques). <br> <br>Each of the fonts has Western Latin and Extended European (CE, Baltic, etc.), Greek, and Cyrillic characters, as well as Hebrew and Arabic. You can read the code page info in the description at the bottom of this page: <a href="http://www.linotype.com/48344/helveticalinotype-family.html" target="_blank">http://www.linotype.com/48344/helveticalinotype-family.html</a> <br> <br>You can also purchase the fonts there, too ;-) <br> <br>Helvetica Linotype was released in 2002</p>'
    html_clean: '<p>Yves, you need <b>Helvetica Linotype</b>. This is a family of four OpenType fonts. The four weights available are just the ones you need (the "italics" are only obliques). <br> <br>Each of the fonts has Western Latin and Extended European (CE, Baltic, etc.), Greek, and Cyrillic characters, as well as Hebrew and Arabic. You can read the code page info in the description at the bottom of this page: <a href="http://www.linotype.com/48344/helveticalinotype-family.html" target="_blank" class="link-external">http://www.linotype.com/48344/helveticalinotype-family.html</a> <br> <br>You can also purchase the fonts there, too ;-) <br> <br>Helvetica Linotype was released in 2002</p>'
