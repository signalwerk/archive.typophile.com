    html: <p>Yves, your question wasn't misplacesd at all. I just have to point out that for 100%-accurate info about any foundry's fonts, that foundry would be the best source. This isn't marketing spin; I am not a customer service rep, and I can make mistakes, too. <br> <br><i>The only reason I asked here was because I deemed the information as found on MyFonts and the Linotype website confusing.</i> <br> <br>This is why companies have customer service <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> . Plus, I don't think that Helvetica Linotype is for sale on MyFonts at the moment. <br> <br>I think that Typophile is the best source on the internet for opinion and information exchange about typography. This is a great place to ask "what is the best font for this job" or "what are the roots of xxx typeface's design" or even "what is the future of OpenType application support?" <br> <br>But the best place to find out whether or not a speciific character range is in a given commercial font is from the distributors themselves. This information is constantly changing. On a forum, you could get inaccurate advice, and then waste or lose time and money. And that would be sad. It would be great if every foundry would have their customer service reps surf typophile and other web forums around the clock to always dispense accurate information. Unfortuantely, this isn't the case at the moment, and a lot of info comes from individuals whose hearts are in the right place, but who may not be aware of certain little details in every case.</p>
