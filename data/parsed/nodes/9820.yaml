    html: <p>I'll just note that the design of the Cyrillic and Greek letters in Helvetica Linotype differs very considerably from the earlier Helvetica Cyrillic and Greek designs (the latter from the 1970s, not sure about the Cyrillic). When Linotype approach me about making a version of Helvetica for use as core fonts in software systems, I recommended redesigning the Cyrillic and Greek, and was very happy when Linotype okay'd the budget for this. It should also be noted that Helvetica Linotype was completely respaced (Latin too), because the older Helvetica fonts (and the Helvetica Pro fonts that are based on them) had inherited 18-unit spacing from earlier font formats, so had inconsistent sidebearings. This is important to note, because you won't get the same line-layout between the  Helvetica Pro fonts and the new Helvetica Linotype. So if you have existing documents set in the old Helvetica fonts and don't want them to reflow, you should avoid using the new font for that text. So, for instance, you might find that you end up using the Helvetica Pro fonts for Latin text and Helvetica Linotype only for the Cyrillic and Greek.</p>
