    html: <p>Yves, I'm not sure if any of the other Helvetica versions can solve your problems in four single fonts. <br> <br><i>(The following is not an official statement)</i> For instance, from what I can tell from the Linotype webshop, <a href="http://www.linotype.com/12753/neuehelvetica55roman-font.html" target="_blank">Neue Helvetica Pro</a> fonts have Western Latin and CE character sets in them, but not Greek or Cyrillic.  <br> <br>The OpenType fonts in the <a href="http://www.linotype.com/13446/helveticaroman-font.html" target="_blank">Helvetica</a> family on the other hand are different. <b>Std</b> seems to have Cyrillic characters in the character set, but no CE. The surperbly hinted <b>Com</b> version has Latin Extended characters, which include CE glyphs but not Cyrillic ones. <br> <br>If text flow issues would be a problem, and you don't think that Helvetica Linotype would be the best solution, I would recommend sending an e-mail to Linotype customer service, at <a href="mailto:info@linotype.com">info@linotype.com</a>. If you tell them exactly what your requirements are, they should be able to give you all of the definitive answers you would need. Additionally, you can call them up if e-mail isn't your thing. Info on that <a href="http://www.linotype.com/10-53-10/contactdetails.html" target="_blank">here</a>. <br> <br>I should add that, whenever anyone has questions about Linotype fonts, e-mailing the company support address (<a href="mailto:info@linotype.com">info@linotype.com</a>) is always the best way to get information. It is faster</p>
