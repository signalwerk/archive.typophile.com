    html: "<p>While waiting someone better suited to critique a typeface than me, I'm giving some commentrs: <br> <br>I see a capital \"T\" too wide. Maybe you could cut the right \"descending\" serif and substitute it with something like the upper part of the six. <br> <br>That would make a weird \"T\" anyway, but I think the whole font is special enouogh to tolerate it. <br> <br>I see the \"N\" too wide too. <br> <br>Vicente <br>PS And a character representing Thai currency will make it funny...</p>"
