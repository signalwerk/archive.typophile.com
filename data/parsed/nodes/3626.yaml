    html: <p>hey mitch, definately keep the fractured letters as a design element. but it think what matt is meaning is that they technically shouldn't be overlapping. (but i'm sure you knew that already) I believe you can fix this if you use the "merge contours" feature in FontLab, but then again, I don't really know what yer building this in! <br>One last note, i know that you're pushing the boundaries of traditional letterforms in this one, but to my eyes the 3 and 4 are almost unrecognizable (without the greater context) perhaps think about reworking those?</p>
