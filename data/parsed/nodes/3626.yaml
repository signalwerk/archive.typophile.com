    date_raw: 18 Mar 2004 — 12:34pm
    date: 2004-03-18T12:34:00
    votes: null
    html: <p>Hey Paul, <br>              This is one of those cases where the potential cartoon was sort of being written as the typeface was being created.  I like your assumption of 1950's Mexico though, though I don't think I could write that as I do not want to assume I know the people and culture of 1950's Mexico.  Right now my only description is that it's about a group of "hip cats" and their unusual personalities in the big inner city of Cape Donkey.  I'm just as confused and that's half of the fun! <br> <br>-Mitch</p>
