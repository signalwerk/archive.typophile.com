    html: <p>Hello "Mitch" <br>I think your figures are very original and fun.  However, I don't think that the "girl" icon at the end of the digbat line doesn't go with the line weight of the other dingbats.  Also, the numbers, "4, 5, 6, &amp; 9" don't have the thin strokes like all the other characters....maybe you should go for consitency on these.  Finally, I think the "zero, 8, I, &amp; A" don't quite fit in the typeface.  Great start.  </p>
