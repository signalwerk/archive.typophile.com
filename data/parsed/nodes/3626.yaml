  html: '<p>Hi everybody, here is my typeface: Cape Donkey.  The context is To create a display typeface for a potential cartoon designed around the aesthetic of cartoon architecture and citizens of the <br>ficticious big city of Cape Donkey.  I look forward to hearing all your praises.......and I suppose criticisms. <br> <br><img src="http://www.typophile.com/forums/messages/29/28699.jpg" alt="Cape Donkey"></p>'
