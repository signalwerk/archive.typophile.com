    html: <p>very cool! i love it! <br>this face fits very well with the retro style illustrations. i wish you'd give us a bit more info about the premise and setting of the cartoon (is it mexico in the mid 50s? cuz that's what it feels like to me but then again maybe that's just the name giving me that vibe). <br>Personally i wouldn't set the leaning figure in the middle of the word cape, i'd put him before the C. but overall this is very fresh &amp; inventive. good job! <br>oh, btw, if you need any inspiration for comic book fonts it'd be worth yer while to head over to blambot.com (but i'm sure yer probably quite familiar with that site as well as comicraft).</p>
