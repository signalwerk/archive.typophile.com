    <p>As a graphic design student with an overwhelming interest in typography I am happy to be able to use the Typophile forums as an invaluable resource. In fact, I will even be attending TypeCon in a few weeks. However, as I venture towards my first actual typeface design project this summer I must say I feel quite unprepared. I am hoping that some of you can provide me with some resources. Whether it may be books, magazines, websites, interviews, articles, or anything else you feel maybe helpful, please post them here. Best of all, of course, would be plain, old advice.</p>
    <p>I would also like to thank all of you who post here. Typophile has provided me with an education I cannot receive in a classroom or on the job in the future. There is an abundance of information available here due to the comradery among designers and the collaboration that takes place.</p>
