      <p>I'm also a total beginner. I've made a few crappy fonts and have started making hopefully my first half-decent one. I'm not going to offer any technique advice since I'm still learning myself, but I do think there are a couple of books that you should check out.</p>
      <p>1) I HIGHLY recommend this book as it is one of the few modern type books that actually shows a little about technique: "Logo, Font &amp; Lettering Bible" by Leslie Cabarga. A must have for any beginner I think.</p>
      <p>2) This one is a bit harder to track down, you might have to special order it (I did). Idea Magazine is a Japanese design magazine and last summer they did an entire issue about typography. It is No. 303 July 2004. The issue is "Type Design Today." Its a great resource, it is more of a book than a magazine. Jean-François Porchez, Akira Kobayashi, Matthew Carter, André Baldinger, Fred Smeijers, the LettError guys and a few others all have features in this issue...great stuff.</p>
      <p>3) Trust your own judgement, if it feels right it probably is.</p>
      <p>4) Lastly, I just say look at the type designers and type designs you like the most.</p>
    html_clean: |-
