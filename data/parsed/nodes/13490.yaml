      <p>im nearly a total beginner. i made two or three not really useable typefaces until now, all which were based on a very rigid grid. right now im trying to figure out my first normal sans for display purposes.</p>
      <p>1. read books on both micro- and macrotypography.<br>
      2. look at fonts, closely, even at text size.<br>
      3. try to draw your first letters based on a rigid grid, if you feel confortable with it, be creative about letter shapes.<br>
      4. start with the "easier" letters (in my opinion: n, m, o, r, p, d, g, a, P, T, L), then try the "harder" ones (esp. S, s, R, G, g, Y, y).<br>
      5. then.. i dont know, im not any further right now :)</p>
      <p>at least thats what i have done, and i dont regret it. im not anything near "real typeface design", im just trying out and having fun. but trying to do this grotesk sans right now, im learning ALOT.</p>
      <p>and <a href="http://www.typeworkshop.com/index.php?id1=type-basics" target="_blank" rel="nofollow">have a look at this one</a>.</p>
      <p>again: im a total beginner, too. thats just what i experienced in the last few months..</p>
