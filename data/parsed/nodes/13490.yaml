      <p>I am also starting (the first characters from my new font are almost ready). So here's my two cents:</p>
      <p>Read the Microsoft typography specifications. There's some good piece of advice on the technical side of constructing fonts. I think you must read on the expressive and technical aspects of design.</p>
      <p>I found a PDF file a couple of months ago which proved to be VERY helpful. The name: Fontographer: Type by Design. The author: Stephen Moye. If you find the book and buy it, it will make you and the author happy, even if you don't use Fontographer. I found the link to it in this forum.</p>
      <p>In my experience: make the first characters by hand. Doodle a lot until you get the look &amp; feel for your font. Then turn on your computer. Of course you can start right down on your favourite vector editor, but I think you'll end up with a livelier font if you start with handwork.</p>
