      <p>Jason,</p>
      <p>Look at everything. Notice everything about type wherever you see it. This becomes a curse, and a bane to the spouses of type nerds everywhere, but it is the trained eye that will guide you through the many, layered, interdependent processes that result in a typeface, well made for a real need. </p>
      <p>Start by dissecting: Blow up small type, reduce large type, notice what works and what doesn't. Why is Avant Garde a display typeface? What is a text typeface? Why do some typefaces look "bigger?" Get some good type and dissect it in a type drawing program. How about those asymmetrical serifs?... What are these little segments in all the narrow crotches?....</p>
      <p>The only thing I'd add to Hrant's mantra is LOOK. Draw and re-draw. Your ability to perceive subtleties, combined with sure draftsmanship, will be bedrock for your future endeavors. Nothing is precious while you're learning. Throw away your first typeface. You'll be glad later. </p>
      <p>You're on your way, if you keep your eyes (and mind) open. And you'll definitely jump-start the process to attend TypeCon. We'll see you there.</p>
