      <p>I imagine doing/researching calligraphy would be adventagous. Construction of basic roman, upper, lower, all with pen and ink. It seems quite a few Typophiles here are straight digital, but I recommend at least starting analog... actually, a few quotes ...</p>
      <p>From the introduction of Frederic W. Goudy's The Alphabet and Elements of Lettering ...</p>
      <p>" Good lettering must be founded on good models; for the use of beginners they ought especially to be simple, dignified forms that are free from archaisms and mannerisms of the scribes and that exhibit in a high degree the essentials of legibility, beauty and character"</p>
      <p>there's another one in their that says ( paraphrasing )</p>
      <p>" one must master the basics before creating something new "</p>
      <p>So, given the lineage of type design, I'd say it's fairly safe to say, when first learning why wouldn't you want to do it the same way as the masters?  </p>
      <p>Studying proportion of classic types, Garamond, Caslon, Goudy, Jenson and learning how to truly see. Making the translation from eye to hand is the key...And if you draw it out by hand, and you think you've got it, check it with some sample letters of the aforementioned fathers of type. Then do it again. And Again, And Again.It will give you much better understanding of the character of letters, their history ... thats all i've got for now.</p>
