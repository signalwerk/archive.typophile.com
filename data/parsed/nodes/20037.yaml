      <p>Thanks all for the suggestions. Sadly none of them are quite right. Stanyan Autumn is way too casual, Coquette too stylized (though I've always loved it), Mahagony Script too journal-y. Stefan, Montessori is really nice and not at all silly, but also not quite what I need.</p>
      <p>I'm really looking for something that looks like it was labored over, but labored over by an amateur. Something like a Brothers Quay title card. Something like the attached image, which is a portion of a piece in the book...</p><div class="imageWrap"><img src="http://typophile.com/files/doodle_4805.jpg"></div><p></p>
