  html: |-
    <p>I'm looking for a display font for a book about American folk art. I want something funky and handdrawn, but not novelty or wedding-invitation-y. Seems like the vast majority of script faces out there are just silly.</p>
    <p>Storm's <a href="http://www.myfonts.com/fonts/storm/rondka/" rel="nofollow">Rondka</a> is really close, but too slanted for my purposes. I like that it's deliberate, not like dashed-off handwriting, and not too ornamental.</p>
    <p>Any suggestions?</p>
