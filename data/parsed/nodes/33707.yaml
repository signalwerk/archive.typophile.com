  - id: 203248
    user_id: 1844
    user_name: Miguel Sousa
    user_path: null
    date_raw: 17 May 2007 — 4:24pm
    date: 2007-05-17T16:24:00
    votes: null
    html: |-
      <p>&gt; <em>Does is in anyway has some negative effect in other situations to have an OTF-font with this 1253 Greek support checked?</em></p>
      <p>I haven't heard of any... yet ;^)</p>
      <p>Keep in mind that, AFAIK, Quark 6.x only supports one codepage at a time. So, in a 'Pro' OpenType CFF (.otf) font with a large character set, only a subset of that will work correctly. This means you won't be able to get Western and CE characters working correctly at the same time; you can only have one or the other.</p>
      <p>Have you ever wondered why some foundries make different versions of the same font? (e.g. <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a>'s Maiola Pro, Maiola OT, Maiola CE, Maiola Cyrillic) One of the reasons is to circumvent the problem that some applications treat OpenType CFF fonts as if they were basic Type 1 fonts (where you can only encode 256 glyphs).</p>
