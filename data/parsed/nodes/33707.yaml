      <p>In my experience, fotns generated with Windows codepages will work perfectly on Windows and Mac, but NOT IN QUARKXPRESS 6. The problems you are experiencing with QuarkXPress are problems with that application, and can be solved by using InDesign. (Or generate your fonts in legacy PostScript Type 1 format for QXP users, and OT format for everyone else.)</p>
