    <p>I have a font generated from FontLab 5.02 and it is not working properly in Quark 6.5.</p>
    <p>I’ve heard about problems with Quark and OT-fonts, but is there a solution available?</p>
    <p>What happens is that some diacritic letters, like Å (Aring) gets mixed up with other letters?</p>
    <p>Anyone with knowledge on this?</p>
    <p>Thanks</p>
    <p>Göran</p>
