      <p>Ok, try this (Warning: no guarantee of success!):</p>
      <p>1. Add "1253 Greek" to the supported Codepages. (I don't think the Greek codepage has anything to do with this issue, but just in case it happens to have...)</p>
      <p>The point above is likely to do nothing, so try this instead:</p>
      <p>2. Take one of your .otf fonts, and using <a href="/wiki/TTX" class="freelinking" rel="nofollow">TTX</a> run the following command:<br>
      <code>ttx -t 'CFF ' MyFont.otf</code><br>
      A file named MyFont.ttx will be created in the same folder as the .otf file. Open the .ttx file in a text editor, and search for <strong>Encoding</strong>. What does it say in front of <strong>name=</strong> in that same line? If it does NOT say <em>"StandardEncoding"</em>, then you'll need to change the way you're generating the font out of FontLab.</p>
      <p>My 2 cents.</p>
