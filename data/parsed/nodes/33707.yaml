  - id: 203372
    user_id: 1844
    user_name: Miguel Sousa
    user_path: null
    date_raw: 18 May 2007 — 8:43am
    date: 2007-05-18T08:43:00
    votes: null
    html: |-
      <p>&gt; <em>So in other words there is really no point in doing this at all for a Pro font except if you only want to do one font-file and then tell people it wont work in Quark 6.5.</em></p>
      <p>Not necessarily. The "hack" you did ensures that the Western subset of your Pro font will work in Quark 6.x (on a Mac; AFAIK the PC version will not trigger the OS/ATM bug). The same font will also work on Quark 7.x, Adobe apps, etc. My point is, just because Quark 6.x only "sees" a subset of your fonts, it doesn't mean that you need to trim-down all your fonts to that subset; there are more software applications on the planet ;^)</p>
      <p>What you should do is to advise your clients that when using your Pro fonts with Quark 6.x, only the Western set of characters will be handled properly, because Quark 6.x is not <a href="/wiki/Unicode" class="freelinking" rel="nofollow">Unicode</a> savvy. If they require CE (for example) characters in the same job, then they should upgrade to Quark 7.x. Alternatively, you could (in the same way as FontFont does) provide fonts that are effectively subsets of the Pro font, to your clients still on Quark 6.x.</p>
      <p>However, I do not recommend the second option. Why? Because, let's imagine you make a font that contains only the CE glyphs. When using such font in Quark 6.x, although you  get the intended glyphs (i.e. you get the correct ink on the page), in Unicode-speaking the underlying character is incorrect, because the codepoint inserted (when you type a key on the keyboard) does not correspond to the glyph you're seeing. This has the side effect that the text will not be correctly encoded, so if you try to use a Unicode-savvy font with it, you'll get gibberish glyphs in place of CE characters.</p>
      <p>Put in a simplistic way: Think of codepages as if the two first Unicode blocks (Basic Latin and Latin-1 Supplement, the first 256 codepoints) were repurposed over and over to display different glyphs.</p>
