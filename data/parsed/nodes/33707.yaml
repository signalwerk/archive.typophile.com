      <p><cite>The problems you are experiencing with QuarkXPress are problems with that application, and can be solved by using InDesign. </cite></p>
      <p>Sometimes it feels to me like Quark 6 occupied the same developmental stage as Photoshop 7 and Illustrator 11. It's a transitional application. Many Quark 6 users are still primarily using PostScript fonts because they are inherently conservative. This isn't necessarily a bad decision, since they are able to recover the substantial costs they've sunk into their type libraries. I agree with Village; use PostScript with Quark 6 and consider OpenType with InDesign or Quark 7.</p>
