  html: |-
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Lowercase</strong></p>
    <p>Lowercase characters evolved from several hand written or cursive letterforms. Some of the most notable are various <a href="/node/13703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Uncial</a> forms and those of the <a href="/node/13704" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">carolingian minuscule</a>. As the handwritten characters evolved, they developed <a href="/node/12043" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">ascenders</a> and <a href="/node/12051" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">descenders</a> that extended beyond the <a href="/node/12047" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Baseline</a> and <a href="/node/12028" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">x-height</a>. Larger characters, often differing in form from the smaller characters, were used to demarcate important names or the beginnings of pages or sections. These larger characters were often based on <a href="/node/add/wiki?edit%5Btitle%5D=lapidary" title="Create node &quot;lapidary&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">lapidary</a> forms.</p>
    <p>The name <em>lowercase</em> is derived from the practice of placing the printing case of miniscule characters below the case of <a href="/node/13762" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">caps</a>.</p>
    <p>See also <a href="/node/14510" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Uppercase</a>.</p>
