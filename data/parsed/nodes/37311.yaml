      <p>Hi Phil,</p>
      <p>The Harris-Intertype Fotosetter was the first photo typesetting machine invented. It marks the beginning of the Cold Type era and is the machine responsible for it . . . Incidentally this is the machine that inspired the creation of the Filmotype by its inventor Allan Friedman when he saw it unveiled to US audiences in 1948.</p>
      <p>Instead of lead slugs, the Intertype which was a Linotype machine had replaced them with small film negatives and proceeded to set type as you would imagine the bastardization of a lead type and photo type machine only could.</p>
      <p>There are several great articles about the Fotosetter and some Googling is well advised but to help round out the picture for you, imagine the benefit a typesetter or printer gained when going from lugging around cases of lead slugs weighing many pounds to an entire alphabet that could be held in hand.</p>
      <p>There are many reasons Cold Type caught on and it became the standard some time after that period till digital typesetting machines like the Alphatype came into their own. It wasn't until the release of the first MacIntosh in 1984 when Cold Type was eclipsed by desktop publishing . . .</p>
      <p>Let me know if you dig up some nice images of the Fotosetter!</p>
      <p>Best,<br>
      Stuart :D</p>
