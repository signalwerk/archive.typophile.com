      <p>For what it is worth, there was also a machine called a Linograph [I think]. This was cheaper than Linotype or Intertype machines and could run mats from both those machines. I only know of this because it was invented and developed here in the upper Midwest. I have not had time to look into it more deeply.</p>
      <p>This might be an interesting topic for someone delving into the history of hot-metal machine composition.</p>
      <p>powers</p>
