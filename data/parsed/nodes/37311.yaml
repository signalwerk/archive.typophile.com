    <p>Hi, </p>
    <p>I am currently researching the Monotype and Linotype typesetting machines. I came across an 'Intertype Parts and Accessories' book from 1957 which I bought. However, I can find very little information relating to these <a href="/web/20150123044210/http://www.typophile.com/wiki/Intertype" class="freelinking" rel="nofollow">Intertype</a> machines. The title page says 'Intertype Company — A division of Harris-Intertype Corporation, Brooklyn, New York.' I believe Linotype was founded in New York which me think that the two were somehow related.</p>
    <p>Was Intertype a subsidiary of either Monotype or Linotype? If not did it have much commercial success, and what were the reasons for introducing this new machine when Linotype and Monotype were already so dominant? Did it offer any benefits or technical progressions over the Linotype/Monotype machines?</p>
    <p>Any information you can offer would be greatly appreciated. </p>
    <p>—Phil</p>
