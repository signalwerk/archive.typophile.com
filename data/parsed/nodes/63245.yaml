    html: |-
      <p>Any license that allows Cúfon embedding also allows proper "naked" referencing, I think, because it is hardly hidden. And those are only available from free (and/or open, public, whatever) sources. I've heard of "naked" embedding of the recent FontShop Axel release, which is corroborated by <a href="http://webfonts.info/wiki/index.php?title=Fonts_available_for_%40font-face_embedding" rel="nofollow">the webfonts.info wiki</a> (which gets its info from <a href="http://fontfeed.com/archives/last-hours-for-the-axel-promotion/" rel="nofollow">this post on the FontFeed</a>), so that looks good. Otherwise, the only list I know of <em>is</em> that one on the webfonts wiki. Start there, or wait for the guys who've actually read all the recent EULA-updates from the big foundries, if any.</p>
      <p>— Rob Mientjes<br>
      robmientjes.nl / rbmntjs.nl</p>
