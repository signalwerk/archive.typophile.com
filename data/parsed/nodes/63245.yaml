    html: |-
      <p>&gt; <em>Any license that allows Cúfon embedding also allows proper “naked” referencing, I think, because it is hardly hidden.</em></p>
      <p>Not necessarily. Cúfon is akin to sIFR, where a "raw" font is converted to another format and then linked from a webpage. So that's different from linking directly to a "naked"/"raw" font.</p>
      <p>Cúfon (and sIFR) cannot be used on the desktop, for example, so I can easily see licenses allowing those "embedding" solutions but at the same time disallowing direct linking to "raw" fonts.</p>
