    html: "<p>Price per glyph is good idea, but only in context of large sets, such ones John Hudson do generally. For me, generally I stick with  the usual 256, in several weights. <br><br>What is important to me is: <br>Does the still will be more like a complicate stuﬀ, such Copperplate (extrem) or basis Sanserif. <br><br>A basic sans is more easy to design generally, compared to the copperplate where each cap is quite diﬀerent, same if you have connections in case of handwriting emulation. <br><br>I hope you see my point. <br><br>I generally charge 10/20% for a preview of the font, the ﬁrst Creative step, with several proposals generally. Then, if the client accept the concept, we go to more big budget in more secure way and&nbsp;trust.</p>"
