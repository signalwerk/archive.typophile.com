    html: <p>Hey, way cool, agreement! I didn’t mean to imply you were wrong in saying per glyph only works with large sets. I suppose it’s more that if you sit down and quantify properly what you’re going to do, then it’s much easier to extrapolate the price. <br><br>A good starting point, <span class="caps">IMO</span>, is the number of characters you need to do. Then other items become quite apparent. <br><br>Even if you buy oranges by the kilo you’re more interested in how many you get than anything else — so a couple of big oranges costs the same as several small ones… <br><br>Er.&nbsp;:-)</p>
