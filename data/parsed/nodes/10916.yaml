    html: <p>Essentially, though <span class="caps">JFP</span> says diﬀerently, I’d just treat it like piece work — ie cost per glyph. If you reduce it to that level, whether you’re doing ten characters or 1,000, you know where you’re at. <br><br>What you have to think about is what everyone has said above — what are the tasks you need to complete, how complex are the characters… <br><br>Once you have some answers, then you can think about how long each character will take, and how much you want to be paid per hour. If you say you have 100 characters to do, and they average an hour each, then multiply your hourly rate up 100 times. <br><br>So, you’re up to $50 now.&nbsp;:-) <br><br>You may think that for two weeks work you’ll settle for $35, or you may think you really need $75 — tha’s your choice. <br><br>What you also have to bear in mind is how much running around you may have to do, besides just drawing the characters. This could add 50% to the job. <br><br>The ﬁgures above are just things to think about — designing, drawing, spacing and kerning could take a day per character or more. Just scale it to where you think it ﬁts your skills and the job at&nbsp;hand.</p>
