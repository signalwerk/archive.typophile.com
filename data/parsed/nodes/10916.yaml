    html: "<p>I never quote on a custom job without ﬁrst asking the client a lot of questions, including: <br><br>1. What format will the font be? If TrueType, what level of hinting is desired for screen readability? <br><br>2. How large will the character/glyph set be?* [Clients sometimes can’t answer this question, so I ask what languages they need to support; then I provide a suggested character/glyph set based on their needs.] <br><br>3. Does the client want to retain exclusive use of the font? For how long? If you will eventually be able to license the font to others, what restrictions might apply (e.g. I have made fonts for software companies who were content to let me sell the fonts to anyone except companies making similar products to their own). <br><br><br>* I almost always base a quote on a glyph count. I make a spreadsheet in which I list all the glyphs that will be included in the font, and then I note how many are base glyphs and how many are composites. This provides me with an accurate count on which to quote per glyph design and hinting costs. Things like kerning and OpenType feature development can’t be dealt with in the same way, of course, and need to be added on top of the per glyph costs, but this approach will give you a solid justiﬁcation for your quote, and will also reduce the likelihood that you will&nbsp;underquote.</p>"
    html_clean: "<p>I never quote on a custom job without ﬁrst asking the client a lot of questions, including: <br><br>1. What format will the font be? If TrueType, what level of hinting is desired for screen readability? <br><br>2. How large will the character/glyph set be?* [Clients sometimes can’t answer this question, so I ask what languages they need to support; then I provide a suggested character/glyph set based on their needs.] <br><br>3. Does the client want to retain exclusive use of the font? For how long? If you will eventually be able to license the font to others, what restrictions might apply (e.g. I have made fonts for software companies who were content to let me sell the fonts to anyone except companies making similar products to their own). <br><br><br>* I almost always base a quote on a glyph count. I make a spreadsheet in which I list all the glyphs that will be included in the font, and then I note how many are base glyphs and how many are composites. This provides me with an accurate count on which to quote per glyph design and hinting costs. Things like kerning and OpenType feature development can’t be dealt with in the same way, of course, and need to be added on top of the per glyph costs, but this approach will give you a solid justiﬁcation for your quote, and will also reduce the likelihood that you will&nbsp;underquote.</p>"
  - id: 68954
