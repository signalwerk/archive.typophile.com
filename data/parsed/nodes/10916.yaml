    html: <p>Hrant’s of course right on this. <br><br>Way overquote for the Armenian Yellow Pages, because you really don’t want the job in the ﬁrst place. If you’re unfortunate enough to “win” the job you’ll now appreciate the extra padding you gave yourself because they”ll now do their best to beat you down on the price you quoted and which they agreed. <br><br>So you haggle a little. <br><br>Then do the job, but be prepared for them changing their minds mid-stream, but blaming you for putting lies into their mouths — again your overquoting will help you stand the aggravation factor. <br><br>When you’ve ﬁnished the job be prepared for them coming back *forever* asking for “little” changes, and not wanting to pay! <br><br>When you eventually say “no more” they’ll brand you a cog in the imperialist war machine destroying the world and its free-minded peoples. <br><br>They just might be right, but either way they’ll always get the last&nbsp;word!</p>
