    html: <p>Did you ever make a font before? <br><br>If not, $.50 a glyph. <br><br>If you did, and you’re actually pretty good, then maybe $100/glyph. <br><br>But, the reality is, it’s very variable — for a start, are you really designing, or are you adapting something else? Are the character forms complex or simple. Can the work be automated in any way… and that’s just digitizing the outlines. <br><br>Do they need hinting — if you haven’t done that before then don’t start&nbsp;now.</p>
