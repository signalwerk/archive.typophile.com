      <p>Perhaps a serif type with quaints (ct, st ligatures), to continue the flourishing theme.<br>
      Old style figures (for address, date, and time) and small caps (for R.S.V.P.) of course.</p>
      <p>The precious typographic noodling required to implement such features in text is in keeping with the mannered quality of the swashes in Affair.</p>
