  html: |-
    <p>I love the look of Affair and I'm &gt;thisclose&lt; to buying it for a wedding invite project but I worry that I won't be able to set long stretches of type in it.  (Also yes, I know it's probably a cliche at this point, and yes, I know some other member set her invites in Affair, but AP is my favorite designer and Affair is amazing.)</p>
    <p>Anyway, are there some complimentary faces I should take a look at?  Thanks!</p>
