      <p>Flash portfolios have to be REALLY elegantly simple for me to bother looking through them. </p>
      <p>Most of these seem to suffer from the same Flash issues:</p>
      <p> - loading bars everywhere<br>
       - giant sweeping page transitions<br>
       - mystery meat navigation<br>
       - annoying sounds</p>
      <p>I’m a big fan of portfolios like this:</p>
      <p><a href="http://analog.sys.is/" title="http://analog.sys.is/">http://analog.sys.is/</a></p>
      <p>Yea, this is maybe extreme (everything on one page) but it makes it very easy for me to quickly scan the body of work.</p>
      <p>One of the few Flash-based portfolio sites that I’ve found nice is this one:</p>
      <p><a href="http://www.geredonovan.com/" title="http://www.geredonovan.com/">http://www.geredonovan.com/</a></p>
      <p>A little gratuitous/cliche with the scrolling text transitions, but, overall, lightweight and not crazy on the special effects.</p>
      <p>I also like Ty’s (haven’t seen him in here in a while) from a pure minimalist standpoint:</p>
      <p><a href="http://www.tywilkins.com/" title="http://www.tywilkins.com/">http://www.tywilkins.com/</a></p>
    html_clean: |-
