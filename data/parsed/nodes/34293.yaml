      <p>“has anyone seen this effect somewhere else by any chance?”</p>
      <p>Yep. Pretty much everywhere. Look at any retail store that has a weekly circular...they’ll often post their ad as a ’flippable’ flash file. It was cool the first time I saw it years ago, and even then only for a few minutes. Now it’s just inane. If I want to flip pages, I’ll pick up that magazine on the table thank-you-very-much. ;o)</p>
