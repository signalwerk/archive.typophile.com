    html: <p>The Manchester based magazine Rant! had a flash website a while ago which allowed the user to turn pages exactly as you do with a printed magazine (it reminded vaguely the <a href="http://www.geredonovan.com/" title="http://www.geredonovan.com/">http://www.geredonovan.com/</a> site except that it was much more literal, you had to turn the page with the cursor and it was a great feel. The page turned gradually from the bottom right corner until you had moved the cursor to the left side then the page would gently fall and the next page was gradually reveal. Brilliant. Not incredibly intuitive but extremely rewarding. The site doesn’t exist anymore, has anyone seen this effect somewhere else by any chance?</p>
