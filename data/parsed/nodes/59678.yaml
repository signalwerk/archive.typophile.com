    html: <p>Yet another method would be to export to PDF, then in Acrobat do Save As. Change file type to JPEG and adjust the settings to your liking. The only problem with this method is that it leaves you with a separate JPEG file for each page. To get those back in a PDF, you would have to make a new InDesign document and place the JPEGs onto each page, then export as PDF. Just make sure not to downsample too much. All that compression will not be good for your art.</p>
