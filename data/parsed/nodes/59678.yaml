    html: |-
      <p>The simplest trick (if I recall correctly) is to add an extra layer to all of the pages of your document. Make this the top layer. On this layer (on each page) draw a box that covers all artwork and images and textmaterial (in other words: the whole page). Give this a fill of 1% Black and make it Transparent.<br>
      Now export to PDF as usual. All text and vectorimages will be rasterized.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
