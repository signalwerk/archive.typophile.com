    html: |-
      <p>If you export your pages as PDF, you have a LOT of options (in terms of file size/quality)... “smallest file size” will often rasterize teh art, but not always, and only at 72 or 96 ppi.</p>
      <p>You should be able to Export pages as JPEG images; it’ll ask you what resolution, RGB/CMYK, etc.</p>
      <p>If you still want a PDF, use Adobe Acrobat: choose to “Create PDF from Multiple file(s)” and select all the JPEGs (they’ll be numbered)... Acrobat will then let you save that as a rastered, multi-page PDF.</p>
