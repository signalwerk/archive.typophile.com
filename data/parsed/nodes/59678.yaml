  html: |-
    <p>how come I can’t figure this out.</p>
    <p>If I have a 10 page doc of vector art and type, how do I export this as a rasterized or .jpg pdf file?</p>
    <p>Do I have to export the pages as .jpgs and then put them into another file?</p>
