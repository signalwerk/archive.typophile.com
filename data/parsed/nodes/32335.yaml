    <p>I’m curious what the typophiles think of the idea to have a design contest for a new logo to represent the city of Anchorage, AK.  The logo they paid thousands for (I think 200k!) is a <a href="http://www.bigwildlife.com/"> big brown splat,</a> and people just HATE it. I can’t tell if the pixelation is intentional or not?</p>
    <p>Restrictions?  Must be a resident of Anchorage to submit work.<br>
    The prize?  “An unspecified package of Alaskan items worth $3000.”</p>
    <p>IMHO, and in the name of good design, we should pepper the forum with our take on such contests …  <a href="http://community.adn.com/?q=adn/node/100260">http://community.adn.com/?q=adn/node/100260</a></p>
    <p>AK</p>
