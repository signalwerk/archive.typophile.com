      <p>A fine point, aluminum.  A designer <em>“is paid for the entire process of getting to the point of a file on a disk.”</em> All the more reason I find this contest insulting. </p>
      <p>I strongly resent the notion that designing a logo is anything less than a professional endeavor, requiring education, skill, experience, and the ability to cultivate productive client/designer communications.  Would any serious company (or city) EVER hold a contest to outsource <em>other</em> professional services to any willing volunteer?</p>
      <p>Imagine - City of Anchorage holds contest to …. Repair schoolbuses! Plow city streets!  Manage the statewide DMV!  Provide health insurance to city workers!  Invest the Permanent Fund (ok, I know that’s obscure to the lower 48, but it’s important to Alaskans. Ask google.)</p>
      <p>Perhaps I take myself too seriously, but I’ve spent a lifetime learning and loving this craft.  To see design belittled in such a public way saddens me.</p>
      <p>AK</p>
