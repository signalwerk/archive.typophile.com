    html: |-
      <p>RE the reaction</p>
      <p>Reading the ADN blog the feeling I get is that Anchoragites just don’t like the idea of being ‘brandable’. I am somewhat sympathetic to that but I doubt they mean it. They don’t complain about the branding of their sports teams… Keep in mind these are folks who were ‘too Texas as for Texas’ for the most part. I think what they really feel is that the design doesn’t refelect their taste. And about that they are right. If the logo had flames on it they would be far happier. Or sharp teeth. Or faux chrome. Or all three. So instead of admiting that their macho self image is under threat by the campaign - they resort to arguements they don’t mean, certainly don’t understand and at maximum volume. </p>
      <p>RE: the cash</p>
      <p>If somebody was paid that much to build a house nobody would blink. I don’t think 200k is too much for the job they were given to do. Double that would be fine too - I say ‘look reality in the face &amp; LICK IT’*. </p>
      <p>RE: success or failure</p>
      <p>The campaign’s success can’t be judged by residents alone - they are not the folks the message is geared towards. But, and it’s a big but, no camapaign can really be sustained without the support of common folk. Nerland’s hubris in this regard is their undoing here. I like the site they built even if it comes directly out of the ‘seattle style design’ handbook. </p>
      <p>RE: The ‘shape’</p>
      <p>I think the mashup of shapes we call the splat is being focused on simply because it looks ‘odd’. In the designer’s mind they were thinking ‘brown is very in just now’. In the local person’s mind brown is the color of breakup when the snow melts &amp; everything is infinitely muddy for a month. Our least favorite time of year. Seattlities wouldn’t so much as blink at it. It’s a flexible theme element like a light motif - only more flexible &amp; more ‘wild’ - at least in the sense that it looks unkempt ;-) . It’s actually a clever idea in some ways; but just not made as well as it might be; and unfortunately ready-made to freak out people whose graphic sensibility is just entering the early 90’s. </p>
      <p><cite> Designers aren’t paid for the file on a disk. They’re paid for the entire process of getting to the point of a file on a disk. </cite></p>
      <p>Too right. Exactly. But they are also hired to get a business result. That’s the measure the City aught to &amp; almost certainly does care about. That business result can be affected by local attitude though. We have been losing fising spots to the folks this stuff is geared to for years. So local folks are feeling somehow sensitive. Well actually it’s been to those Texans who live here now but we are too polite or brainwashed to admit that. Still, for folks who are really serious about the fishing thing - a successful campaign is the last thing they would hope for. And a dismal one is fodder for jokes.</p>
      <p>RE: the contest</p>
      <p>I think it’s a faux populist PR move meant to help the whole thing blow over. And if nobody will does anything wothwhile they have a ready made excuse. And if they do something great they are of the hook then too. Ceratinly an ‘adventure’ ‘valued at 3k’ is too cheap to lure me in.</p>
      <p>In any event I think none of this is actually so serious. Except for the Nerland folks perhaps. I say why not treat it like sports. It’s only 200k, &amp; there is always next year. </p>
      <p>* One of my favorite lines from ‘The Mighty Boosh’ a british comedy that references Alaska with surprising regularity.</p>
