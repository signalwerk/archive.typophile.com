    <p>Hi.</p>
    <p>I am not a font designer, nor a graphic designer, but I’ve been insane for fonts since I was in my early teens (many, many moons ago), long before computer based font tools...</p>
    <p>In any case, I’m looking for a book that someone out there might have of know where can be obtained... I have Volume Two of D. B. Updike’s “Printing Types; Their history, forms, and use, a study in survivals”, second edition, 1937. I’d like volume one as well.</p>
    <p>Thanks!</p>
