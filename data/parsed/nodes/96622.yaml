      <p><em> I've been concerned about ... a subscription model, which I really don't like and will cost me far more than an outright purchase</em></p>
      <p>I'm not sure about that, if you have kept up your upgrades. I expect that when a desktop app becomes only available as a subscription web app, the cost for those who bought desktop licenses will be lower, and the cost for <em>a lot</em> of the users who don't have licenses (or bough a license 15 years ago and never upgraded) will be higher. </p>
      <p>I think subscription models for proprietary software are great, because it makes it much easier to compare to the costs of libre software, which is best commercialised on subscription (eg RHAT)</p>
