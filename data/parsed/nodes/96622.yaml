      <p><em>&gt;since Apple seems determined to reduce Adobe to irrelevance</em></p>
      <p>This is perhaps drifting off topic a bit, but Apple's reducing Flash to irrelevance doesn't really do too much to Adobe's overall dominance of the graphic industry which has me concerned. There is nothing at all to compete with the Creative Suite. There are some individual programs, but nothing even close to the integrated products of the Creative Suite. I've been concerned about Adobe shifting to a subscription model, which I really don't like and will cost me far more than an outright purchase, and the CS6 cloud is the beginning of the shift to a subscription only model. So what choice will any of us have if Adobe becomes an evil empire? Corel? </p>
      <p>Far from irrelevant, I'm worried about Adobe already being too relevant to my every day. </p>
      <p>And BTW Mr. Daniels, the Packers were TOTALLY ROBBED! It was an uncalled push off and an interception. I think the Packers should sue the Seahawks and NFL to get what lawfully belongs to them.</p>
