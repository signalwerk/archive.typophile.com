      <p>Hello Adam,</p>
      <p>Thanks for TransType, I have tested it once and it was very fast, quite useful.<br>
      I still have a question/request:<br>
      Are you going to add a function to add meta-data for woff fonts?<br>
      Or is it already possible and I missed it? I must say the interface was a bit strange at first…<br>
      I could find "effects", but not this function that is more important IMHO.</p>
      <p>Other thing: it would be nice to know what is actually happening in the box…<br>
      Obvisouly when one converts a PS font to EOT, what happens is that the file gets automatically converted to TrueType curves, before being packed in a EOT (or am I wrong here?).<br>
      It would be good that the program actually explains what is happening when something fundamental (such as converting PS to TT automatically) is being done.<br>
      From my experience, the results with this are pretty bad in terms of hinting.<br>
      Fonts that were carefully PS hinted (with links) looked better in PS WOFF than in EOT.<br>
      From our tests, it works better to convert to TrueType in FontForge, which also does a good job at keeping PS links and where the TT autohinter isn't doing a bad job.<br>
      Any plans in that area?</p>
