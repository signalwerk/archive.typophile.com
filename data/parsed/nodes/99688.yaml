    votes: null
    html: |-
      <p>xy,</p>
      <p>I recommend reading what "profile" means in the TransType context -- in the preliminary TransType 4 manual. </p>
      <p>TransType has a selector for export profiles in the top-right corner. Currently, the only webfont-related profile is "Webfont TT .woff+.eot+.svg (Optimized)". </p>
      <p>The "TT" in the profile name indicates that it's TrueType-based. It means that any input font is converted into a .ttf and then converted into .woff, .eot and .svg. </p>
      <p>The profile, in fact, generates a series of fonts: .ttf, .woff, .eot, .css, .html. </p>
      <p>As I said, we're planning to add a Webfont PS profile, which will generate three PostScript-based files (.otf, .woff and .svg) plus one TrueType-based (.eot). </p>
      <p>This means that the .eot will be identical regardless of whether you use the Webfont PS or the Webfont TT profile, since only TrueType-based EOTs are supported by Internet Explorer. </p>
      <p>Hope this helps,<br>
      Adam</p>
