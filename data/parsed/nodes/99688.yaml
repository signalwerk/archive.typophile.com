    <p>Hello all, </p>
    <p>I'm excited to let you know that we at Fontlab Ltd. have just released the 2nd beta of TransType 4 for Mac OS X. With this build, you can convert any font (OTF, TTF, plus a number of other formats) into WOFF and EOT webfonts. </p>
    <p>TransType 4 beta 2 is available free of charge at <a href="http://bit.ly/trt4macbeta2" title="http://bit.ly/trt4macbeta2">http://bit.ly/trt4macbeta2</a> </p>
    <p>The current build 4762 will expire on February 28th, 2013. However, by the time that build expires, we will post another build with more features and bugfixes. </p>
    <p>Enjoy! </p>
    <p>Best regards,<br>
    Adam Twardoch<br>
    Fontlab Ltd.</p>
