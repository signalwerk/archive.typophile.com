    html: |-
      <p>Dear Adam,</p>
      <p>Just saw you replied.<br>
      It's great to read that you are really interested.<br>
      To be honest, I cannot elaborate much because my knowledge and understanding of TT in general and TT hinting is very limited. It is my partner who has more experience with that. I'll ask him to elaborate when we get some time. So I cannot say if the problem lies in the quality of the curves conversion (although my partner was saying that FontLab was creating TT outlines with too many points) or with the hinting.</p>
      <p>But for the moment what I can say is that our experience was that exporting our PS fonts (with PS hints placed manually) in .TTF and making webfonts out of them resulted in quite poor results. From what I remember of our tests, it was almost always looking worse than with .OTF (CFF).<br>
      That's why I'm quite surprised about the TT profile only. I don't really see the advantage of doing that. For sure TT are needed for EOTs, but other than that, I wouldn't want our fonts to be converted in TT, unless the curves and the hints were translated into something of at least equal quality than the PS versions.</p>
      <p>Looking forward to a version of TransType with PS profile!</p>
