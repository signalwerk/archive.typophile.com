    html: |-
      <p>Short: yes on all counts but gradually :) </p>
      <p>TransType 4 is completely rewritten from scratch using our newest technology (codenamed Victoria). The technology will be used in the font editing products we're working on. TransType 4 is the first application based on this, so we want to cover base ground first, and make sure that the core functionalities work well. </p>
      <p>The Webfont TT profile always converts to TT first. We'll likely add a Webfont PS profile, which will generate OTF, OTF-based WOFF and TrueType-based EOT (only TT outlines are supported in EOT). </p>
      <p>We also have plans in the area of better autohinting, more flexible outline conversion control, and WOFF metadata (currently there is no such access). </p>
      <p>I agree that the Effects functionality is not "core" for most font vendors. It's just a simple "extra fun" added on top. </p>
      <p>Thanks for your feedback! </p>
      <p>Best,<br>
      Adam</p>
