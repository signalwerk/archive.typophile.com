    html: |-
      <p>Bill,<br>
      I took a midline when choosing the shape. The "a" may be a tad wide at larger sizes but is better smaller. The proportions are not humanist, I admit so "a" will seem wider than typical humanist faces. I always worry about the counters of a and e getting clogged and dark so feel better about making them open. This helps in interpolation but I may have to go back and adjust the hairline weight "a" afterward. </p>
      <p>ChrisL</p>
