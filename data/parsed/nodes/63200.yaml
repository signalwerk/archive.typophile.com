      <p>i've had this happen and it's maddening.</p>
      <p>might be a situation with bridge and if there are multiple files on the drive named 'document.indd', revisions and edits and whatnot ... if there's an application error and it has to recover or start again at what it thinks is the correct version of 'document.indd' that it pulls from the wrong place, you can have those things jump up and bite you. especially since the last few edits on anything are small punctuation changes, a factchecking clarification or subtle design adjustments. </p>
      <p>i'd recommend taking on a naming convention where you have the day's date at the end. 'document102009.indd' so if you have to recover or compare it, you don't have to go on an archaeological expedition to see the differences.</p>
      <p>In the spirit of unbridled creativity,</p>
