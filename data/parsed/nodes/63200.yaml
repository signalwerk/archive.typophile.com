      <p><cite>I once had problems with the line breaks when we began the book layout in Indesign CS3 and updated then to CS4, some parts had different line breaks in CS4. </cite></p>
      <p>Just FYI, that's not a bug -- it's documented. The line breaking algorithm is revised for CS4, as the older versions (at least going back to CS) tended to kick out the last single word or syllable, leaving this more often on a last line than statistically likely.</p>
      <p>The new line breaking routines are only applied to stories that are actually edited in CS4; if you don't edit something, it'll remain the same (and if you <em>do</em> edit something, the line breaks will be better!).</p>
      <p>Whenever and whereever possible, I refrain from upgrading software across documents.</p>
