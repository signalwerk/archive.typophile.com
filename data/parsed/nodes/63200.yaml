    html: <p>I once had problems with the line breaks when we began the book layout in Indesign CS3 and updated then to CS4, some parts had different line breaks in CS4. Another case was when I worked with the book function, I copied the Indesign documents on my laptop, started this files but I was still connected with the server. As soon as I used the book function the documents were saved again on the server, it took me quite a while until I realized this.</p>
