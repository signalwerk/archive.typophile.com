      <p>Oddly enough, I have been working on a font inspired by those same cheesy postcards, although it more closely resembles Futura Display on steroids. I've been dragging my feet finishing it, because I think there's probably a pretty limited demand for this kind of thing.</p>
      <p>Here's what it looks like so far...<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Souvenir-Postcard_6583.gif"></div><p></p>
      <p>Another of my fonts that might be useful for the same purpose, and <em>is</em> actually finished, is <a href="http://www.myfonts.com/fonts/nicksfonts/jampact-nf/" target="_blank" rel="nofollow">Jampact</a>.</p>
