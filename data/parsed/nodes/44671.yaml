    <p></p><div class="imageWrap"><img src="http://typophile.com/files/pingpong2_5036.jpg"></div><p></p>
    <p><strong>Bolda</strong><br>
    I'm currently working on a new font, 'Bolda'. I have worked on it for quite some time now and i'm starting to feel that i'm never gonna finish... I guess it is a very normal feeling when you're designing a font... </p>
    <p>The last time i made a custom font was almost three years ago, i have totallty forgot how much work it i takes. </p>
    <p>I'm done with all the basic latin letters, the rest is the difficult part, making the norwegian letters æ ø å...</p>
    <p><a href="http://www.morteniveland.net" title="http://www.morteniveland.net">http://www.morteniveland.net</a></p>
