    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Maple_Pictures_Old_4517.png"></div><p></p>
    <p>The first time I saw the original Maple Pictures logo I knew the $12.50 I'd spent was worth it, even if the movie was a piece of piss. The way the animation rotated and the tree rings formed the letters just struck a chord in me. </p>
    <p>AND THEN THIS HAPPENED!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MaplePictures_New_5998.jpg"></div><p></p>
    <p>What in the hell were they thinking? What does this say other than we typeset some letters and put a box around them? </p>
    <p>I have started this thread hoping to see you add other logos/branding that were redesigned so poorly that you're left wondering "How did this happen?"</p>
    <p>Pepsi anyone?</p>
