      <p>From USPTO.gov:</p>
      <p>What is a trademark or service mark?</p>
      <p>    * A trademark is a word, phrase, symbol or design, or a combination of words, phrases, symbols or designs, that identifies and distinguishes the source of the goods of one party from those of others.<br>
          * A service mark is the same as a trademark, except that it identifies and distinguishes the source of a service rather than a product. Throughout this booklet, the terms "trademark" and "mark" refer to both trademarks and service marks.</p>
      <p>Do Trademarks, Copyrights and Patents protect the same things?</p>
      <p>No. Trademarks, copyrights and patents all differ. A copyright protects an original artistic or literary work; a patent protects an invention. For copyright information, go to <a href="https://web.archive.org/web/20150124161118/http://lcweb.loc.gov/copyright/" title="http://lcweb.loc.gov/copyright/">http://lcweb.loc.gov/copyright/</a>. For patent information, go to <a href="https://web.archive.org/web/20150124161118/http://www.uspto.gov/main/patents.htm" title="http://www.uspto.gov/main/patents.htm">http://www.uspto.gov/main/patents.htm</a>.</p>
      <p>Is registration of my mark required?<br>
      No. You can establish rights in a mark based on legitimate use of the mark. However, owning a federal trademark registration on the Principal Register provides several advantages, e.g.,</p>
      <p>    * constructive notice to the public of the registrant's claim of ownership of the mark;<br>
          * a legal presumption of the registrant's ownership of the mark and the registrant's exclusive right to use the mark nationwide on or in connection with the goods and/or services listed in the registration;<br>
          * the ability to bring an action concerning the mark in federal court;<br>
          * the use of the U.S registration as a basis to obtain registration in foreign countries; and<br>
          * the ability to file the U.S. registration with the U.S. Customs Service to prevent importation of infringing foreign goods.</p>
      <p>When can I use the trademark symbols TM, SM and ®?</p>
      <p>Any time you claim rights in a mark, you may use the "TM" (trademark) or "SM" (service mark) designation to alert the public to your claim, regardless of whether you have filed an application with the USPTO. However, you may use the federal registration symbol "®" only after the USPTO actually registers a mark, and not while an application is pending. Also, you may use the registration symbol with the mark only on or in connection with the goods and/or services listed in the federal trademark registration.</p>
