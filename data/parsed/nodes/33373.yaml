    html: <p>It's not so much that you must use the "™" for a given period of time, but rather that you can use the "™" to stake your claim to a trademark until your registration is approved, and only then are you allowed use the "®". The length of time depends on however long it takes for the USPTO to process and approve the trademark registration application.</p>
