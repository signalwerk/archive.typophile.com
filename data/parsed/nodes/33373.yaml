      <p><cite>How can you tell if someone is already using it, and has it registered? Also, how can you tell if the name is in the public domain?</cite></p>
      <p>Search it at the USPTO on TESS (for United States pending, registered and dead federal trademarks)</p>
      <p><a href="https://web.archive.org/web/20150124161118/http://tess2.uspto.gov/bin/gate.exe?f=tess&amp;state=rj48fh.1.1" title="http://tess2.uspto.gov/bin/gate.exe?f=tess&amp;state=rj48fh.1.1">http://tess2.uspto.gov/bin/gate.exe?f=tess&amp;state=rj48fh.1.1</a></p>
      <p>For example, "Helvetica" turns up four distinct registrations, including a pending one for financial services.</p>
      <p>Google isn't especially good for this kind of search</p>
