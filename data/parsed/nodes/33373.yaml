      <p>&gt;What´s up with this? There´s lots of major foundry faces sharing names, only differentiated by the foundry name..</p>
      <p>Garamond is a good example of a name that's in the public domain. It's also a name that has a fairly well understood meaning with respect to font appearance and style. So naming your font "Garamond Toby" would be fine, but "Helvetica Toby" or "Interstate Toby" would not.</p>
