      <p>Toby, if you have done your due dilligence and found an existing typeface using the name you fancy, you should probably "do the right thing" and pick another name. BUT... If the typeface name in question exists as some kind of dafont.com rip-off, you're probably safe to use it for your "real" typeface.</p>
      <p>In all things, the golden rule is the best one to follow: Do unto others as you would like others to do unto you. So. Would you like someone else to come along and use your typeface names for their typefaces?</p>
      <p>My 2 cents.</p>
