    html: <p>The TM mark isn't legally meaningless; it's the trademark law equivalent of p*ssing on a fire hydrant. It amounts to a generalized statement to the world that you are claiming the name as a trademark. If there is a dispute, a registered mark is simpler to defend, but both kinds are in principle legally protected.</p>
