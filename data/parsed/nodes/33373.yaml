      <p>The question of how much diligence is due is moot.</p>
      <p>I had been planning to name a typeface "Austin", after the 19th century type designer.<br>
      I have discovered by chance (typecentric surfing serendipity) that Christian Schwartz has already named a face Austin, but he has not released it, or, AFAIK, publicized it other than on a single web page, and you won't find it by Googling. Also, Berthold has the name Austin registered, although they have not released anything by that name.</p>
      <p>So I thought, maybe I can call it Shinn Austin, in the manner of Adobe Garamond, Stempel Garamond, ITC Garamond etc.</p>
      <p>However, to avoid hassle, I'll probably steer clear of Austin.</p>
