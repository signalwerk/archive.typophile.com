    html: |-
      <p>&gt; How hard would it be to include layers with assignable rgb color codes in OTF?</p>
      <p>Well, it would require extensions to the OpenType format, such as those proposed by Microsoft, Adobe+Mozilla, or Google.  <a href="http://blog.fontlab.com/font-tech/color-fonts/color-font-format-proposals/" title="http://blog.fontlab.com/font-tech/color-fonts/color-font-format-proposals/">http://blog.fontlab.com/font-tech/color-fonts/color-font-format-proposals/</a></p>
      <p>This stuff is all implemented and working somewhere, but there is no standard across platforms and major apps. (Apple's own take has not been proposed as a standard, but it is a bitmap format like Google's.)</p>
