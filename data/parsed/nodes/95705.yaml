    html: |-
      <p>Here’s one I developed for The Globe and Mail:<br><img src="/sites/default/files/old-images/Pex_3843.png"><br>
      This was set by typing PpEeXx.<br>
      The majuscule characters provide the outline of the glyph, the minuscule the body; each character is half the width of the composite glyph.<br>
      The advantage of this method is that there are no layers with the resulting issue of selection and registration, and one may adjust colors in the color palette without selecting any of the text.<br>
      The disadvantage is that it only works for one case of letters.</p>
      <p>It would work with normal text if “one to many” substitutions were implemented in OpenType.</p>
