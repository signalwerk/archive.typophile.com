    html: |-
      <p><em>new supplement to The New York Times, Play? </em></p>
      <p>Want some gossip?</p>
      <p><em>Play</em> is designed by Jeanette Hodge, who previously designed <em>Dwell</em> in San Francisco. Her husband is Mike Abbink, who previously worked at MetaDesign, also in SF, and is now with WolffOlins in New York (at least he was earlier in the year...) Mike happens to be the designer of <a href="http://www.fontshop.com/?fuseaction=catalog.fonts&amp;searchID=1079&amp;searchby=designer" rel="nofollow">FF Kievit</a> and has some great new stuff in the typographic pipeline.</p>
