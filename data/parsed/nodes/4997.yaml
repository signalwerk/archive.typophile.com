  html: <p>In an attempt to design a typeface that has broader international use, I am gathering texts from many languages to test the font. <br>Below is a Czech translation of part of Mozart's opera Don Giovanni. I am using it as an example.  My problem is that I can't get some of the accented characters to work.  At first I thought it was just my poor understanding of Opentype in preparing my font (which is still very likely) but the same problem exists no matter what font or what foundry I use.  For instance the caroned and ringed characters don't compose</p>
  html_clean: <p>In an attempt to design a typeface that has broader international use, I am gathering texts from many languages to test the font. <br>Below is a Czech translation of part of Mozart's opera Don Giovanni. I am using it as an example.  My problem is that I can't get some of the accented characters to work.  At first I thought it was just my poor understanding of Opentype in preparing my font (which is still very likely) but the same problem exists no matter what font or what foundry I use.  For instance the caroned and ringed characters don't compose</p>
