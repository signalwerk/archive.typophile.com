    html: "<p>Chris, get yourself a Lego set that requires batteries. You'll find a nice, everyday sort of text, provided in 29 languages (in 6 scripts) about what not to do with batteries. It's not too long though. <br> <br>And specifically for Czech, a great source is the PDFs of back issues of TYPO magazine: <br><a href=\"http://www.magtypo.cz/\" target=\"_blank\">http://www.magtypo.cz/</a> <br>Bottom-right. <br> <br>hhp <br></p>"
