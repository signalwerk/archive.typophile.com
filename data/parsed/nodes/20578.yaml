    html: |-
      <p><cite>in the next century Garamond and his co-horts surpassed what was done</cite>.<br>
      The quality of Garamond's output was certainly more even than Griffo's, but as designs his work just looks vacuous to me. I'd really be interested to know what people see in them. Griffo seems to have been much the more thoughtful and inventive of the two; and his masterpieces, the 1499 caps and 1503 italic, had no influence on the French, who stuck to reductively reproducing his 1495 roman and 1501 italic.</p>
