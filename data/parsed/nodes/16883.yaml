      <p>&gt;there is little interest in modernism</p>
      <p>John, Jones was part of the UK art scene in the mid 20th century.<br>
      Art is a language of its own, apart from any one artist’s theories, motivations, or self-awareness. He wouldn’t have painted like that at any other time (and have recieved the status and recogntion he did).</p>
      <p>An artist painting like that before the Great War would have been thought too foreign, and after the mid 1960s, too old-fashioned. So he was involved with the modernisation of British art, in getting it from naturalistic representation to abstraction, pop art, minimalism, conceptual, etc.</p>
      <p>When I say that he was contemporary and modern, I’m saying that he was a man of his time, of his own culture. He was engaged with modernism, recognized as such as one of the dozen or so painters profiled in the series “Penguin Modern Artists” in the 1940s. If you had shown his paintings to anyone in Britain from the 30s to the 60s, they would have said “that’s modern art”.</p>
      <p>I think I’m agreeing with you, in so far as I’m saying “not to the extent of European Modernism”, and you’re saying “in so far as he had one”</p>
      <p>It’s interesting, speaking of Neo-Thomism, that Neo-Platonism, a philosophical movement in France in the late 19th century, was very influential to many avant-garde artists, leading von Doesburg to Neo-Plasticism, and the break with representation.</p>
