      <p>&gt; <cite>why is he in the finest museums in the world?</cite></p>
      <p>Well, I think the last few comments by Mr Shinn and Mr Hudson answer the question very well.</p>
      <p>Art, like so many things, does not exist inside a bubble. You cannot take the visual out of its context. Historical significance, titling, intent all flesh-out the meaning of a piece. Whether or not you personally respond to the aesthetic has no bearing on the “greatness” of an artwork. </p>
      <p>And to the point of other, “better” artists who have no critical acclaim or popular recognition… art is a business as well, unfortunately. A big part of playing the game is who you know. </p>
      <p>Most artists, I would venture, aren’t in it for the fame and fortune anyway. Rather, they are driven by personal passion to express themselves creatively.</p>
