      <p><em>Like a lot of British and American artists of his generation (early and mid 20thC) Jones was engaged with modernism, but not to the extent of “European” modernism. In other words, those Brit artists tended to abstraction, because it was contemporary and modern, but were never able to let go of representation.</em></p>
      <p>I suppose this might be true of many British artists of his generation, but it is a misinterpretation of Jones. I’ve read just about everything he ever wrote, and there is little interest in modernism and certainly no attraction to anything for being ‘contemporary and modern’. His ‘theoretical’ engagement, insofar as he had one, was with the neo-Thomist aesthetics of Jacques Maritain, which he first encountered and discussed while part of the Pepler/Gill community at Ditchling.</p>
