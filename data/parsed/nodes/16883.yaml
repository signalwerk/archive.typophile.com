      <p>From the <em>Slate</em> visual essay: “To be meaningless without being disallowed to be […] might be an apt description of Twombly’s work,” etc.</p>
      <p>It’s what the pieces <strong>represent</strong>, piece after piece, <strong>as</strong> frictive <strong>actions</strong> vis à vis, or relative to, or against the western socio-cultural intstitution of high art—-it’s norms, fascinations, priorities—and the expectations and norm concepts of the general public of art that makes them important.</p>
      <p>‘Meaningless’ in referential or self-referential (abstract expressionist) terms is different from meaningless in ‘action-representation’ terms.</p>
      <p>Rogue efforts in type design and typography must be evaluated along similar lines, according to what they represent as actions within a type-cultural milieu. </p><div class="imageWrap"><img src="system/files?file="></div><div class="imageWrap"><img src="system/files?file="></div><div class="imageWrap"><img src="system/files?file="></div><div class="imageWrap"><img src="system/files?file="></div><div class="imageWrap"><img src="system/files?file="></div><p></p>
