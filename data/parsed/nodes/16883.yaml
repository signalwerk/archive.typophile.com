      <p>&gt;the observations of optical perspective, foveal and parafoveal vision that inform Jones’ paintings</p>
      <p>Like a lot of British and American artists of his generation (early and mid 20thC) Jones was engaged with modernism, but not to the extent of “European” modernism. In other words, those Brit artists tended to abstraction, because it was contemporary and modern, but were never able to let go of representation. That’s what makes Pollock so seminal, in the way that one (and the critics and Life magazine who built the myth) can see his work moving from pictorial representation, through “psychological,” kind of surrealist doodling, on to action painting.</p>
    html_clean: |-
