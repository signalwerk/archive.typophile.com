    html: <p>Just an addenda to my previous comment, something Marcel Duchamp said along the lines of art not being known if it isn’t in the public eye. Great art created in the darkest part of the world, if not “known” is nothing. It is neither good nor bad, it is simply not public. If not public, or, in this case, in a museum or talked about in cyberspace, how can it be of any worth? Isn’t that a part of the package of “modern”, the publicity?</p>
