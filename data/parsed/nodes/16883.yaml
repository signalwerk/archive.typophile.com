      <p>Alessandro,</p>
      <p>Regarding Pollock, I read this in <a href="http://www.wired.com/wired/archive/13.12/rembrandt.html?pg=1&amp;topic=rembrandt&amp;topic_set=" target="_blank">Wired Magazine</a> (pp. 2-3):</p>
      <p><cite>“After scanning Pollock’s works and analyzing them at increasingly fine magnifications, Taylor found fractals - the naturally occurring geometric patterns, like the branches of a tree, that repeat over and over at every level of magnification… In one experiment, he rigged about 40 people with motion sensors and asked them to flick, spatter, and pour paint à la Pollock. But contrary to the my-kid-could-do-that sentiment often triggered by abstract art, nobody could fake the fractals. ‘When you move your body to a posture where you are right on the edge of your balance, your motion becomes fractal,’ Taylor says. Pollock refined his technique over his career, increasing the fractal structure of the paintings… A subconscious perception of the fractal quality may explain Pollock’s popularity.”</cite></p>
      <p>Very interesting stuff… read about Rembrandt too!</p>
    html_clean: |-
      <p>Alessandro,</p>
      <p>Regarding Pollock, I read this in <a href="http://www.wired.com/wired/archive/13.12/rembrandt.html?pg=1&amp;topic=rembrandt&amp;topic_set=" target="_blank" class="link-external">Wired Magazine</a> (pp. 2-3):</p>
      <p><cite>“After scanning Pollock’s works and analyzing them at increasingly fine magnifications, Taylor found fractals - the naturally occurring geometric patterns, like the branches of a tree, that repeat over and over at every level of magnification… In one experiment, he rigged about 40 people with motion sensors and asked them to flick, spatter, and pour paint à la Pollock. But contrary to the my-kid-could-do-that sentiment often triggered by abstract art, nobody could fake the fractals. ‘When you move your body to a posture where you are right on the edge of your balance, your motion becomes fractal,’ Taylor says. Pollock refined his technique over his career, increasing the fractal structure of the paintings… A subconscious perception of the fractal quality may explain Pollock’s popularity.”</cite></p>
      <p>Very interesting stuff… read about Rembrandt too!</p>
