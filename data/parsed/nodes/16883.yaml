    html: <p>I found it interesting to see a discussion of Cy Twombly on a forum about typography and related subjects. I guess if one finds letters or words in anything visual it is fit for discussion here. Firstly, every artist in every time is “modern.” The usage of the word “modern” to suggest something which is new is an invention particular to our time, i.e., the 20th century. Modern has come to mean new, but one might argue that every artist who has ever created work in any period was “modern” in that period. One might also argue that every artist whose work is not modern or “dated” is of an earlier period, like David Jones. He might have been modern in his time, but he is old stuf now, but still a fascinating painter. Secondly, we are all of us here of our own time, therefore “modern.” We are communicating in cyberspace - very modern. I don’t go to museums or art galleries to see work in which I am not interested. But the fact that Twombly has provoked this interest in what is ordinarily a forum for talk about type suggests in fact that “art” which may appear to be extremely irritating to some, or “crap”, is of such modern character that it can stimulate such animated discussion. Perhaps that too is a part of what “modern” art has, the power to stimulate discussion.</p>
