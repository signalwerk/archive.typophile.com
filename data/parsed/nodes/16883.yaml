      <p><em> Modern has come to mean new, but one might argue that every artist who has ever created work in any period was “modern” in that period.”</em></p>
      <p>That wasn’t the case with some of David Jones’ contemporaries.<br>
      There was a notorious incident at the Royal Academy (London) annual banquet in 1949 when its president, Alfred Munnings (a magnificent painter, BTW), flanked by celebrity dauber Winston Churchill, used the oportunity to thoroughly diss Modernism, going so far as to say that if he met Picasso in the street, he would join with Winnie in putting the boot in.</p>
      <p>At that time, in Britain, that was the majority sentiment. Polarization between modernism and traditionalism as media spectacle. They’re still at it, ennit?</p>
