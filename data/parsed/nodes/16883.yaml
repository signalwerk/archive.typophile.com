      <p>Not sure if nyceralife is still around or not.</p>
      <p>Someone (I think Nick, but I can’t be bothered to read back through) brought up Pollock. There’s a fairly common dialogue throughout modern (read: 20th century) painting regarding the battle of image vs. text. That’s the filter through which a lot of folks understand Pollock’s work. I have to admit it’s the only way I can understand and/or appreciate his work. </p>
      <p>As a bad paraphrase: (1) Modern is that which is without ornament, decoration, or extraneous matter; (2) literary narrative is extraneous to the painted image; (3) the representational(y painted) object is necessarily endowed with narrative; (4) therefore it must be destroyed.</p>
      <p>Get pissed.</p>
      <p>IMHO, this history is the only context within which to understand Twombly’s work. <em>As painting</em> anyway. Pollock (and some of the other Abstract Expressionists) did a swell job of getting narrative/literature/’the word’ out of the modern image. And now some folks feel it’s time for it to creep back in. Just like modern architecture failed the populace, therefore it’s time to bring other models back into play (which is why so many skyscrapers have to wear party hats shaped like ancient Greek pediments).</p>
      <p>Twombly isn’t kow-towing to the Pollock crew by showing that the textual has no place in painting. Nor is he refuting that stance. His work tries to find a place where both modes of communication co-exist. Either everything cancels out and he becomes Sigmar Polke — or the sum is greater than the parts in ways that we plebians can’t comprehend. He’s the modern post-modern.</p>
      <p>So, painting-wise Twombly’s work is highly significant. Otherwise, you’re probably right: it’s nothing but utter crap.</p>
