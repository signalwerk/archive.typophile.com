    html: <p>Twombly uses classical mythological themes and legible text as well. I think if you read him as an after-the-fact product of the New York school you miss the point. Check his sculpture, and later works with the Day-Glo colors. Not so easy to sum up. You can see an artist with real chops and the ability to nail composition and color that gets tired of his own schtick and works into a more adventuresome direction. Most assumptions made about him are easily debunked by observing his work.</p>
