      <p>Twombly’s stuff has to reach you in the right context.  I know I was fascinated with his work halfway through my second year of art school, tired of fiddling with the “illusion of light”, perspective, color theory and other optical tricks.  It actually steered me in the direction of graphic design.  Flat and linguistic.</p>
      <p>It’s always a downer to disregard work in a museum on the basis that it looks like a 5-year-old made it.  One’s understanding may be better served asking <em>why</em> it looks like a 5-year-old made it.</p>
