    html: <p>I’d not seen any of Cy Twombly’s work, as far as I know, until I checked out the links at the top of this thread. I actually quite like the second example, and I’m not an automatic fan of abstract expressionism. This work interests me, because it has some of the same visual quality as David Jones’ (figurative) paintings (see <a href="http://collection.britishcouncil.org/html/work/workimage.aspx?imageId=4241">this</a> for example). I wonder to what degree Twombly might be responding, in an asbtract way, to the observations of optical perspective, foveal and parafoveal vision that inform Jones’ paintings? Or maybe they simply had a similar colour palette. Either way, Twombly’s work is of interest to me, so thanks, ironically, for bringing it to my attention.</p>
