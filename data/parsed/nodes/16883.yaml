    html: <p>The point I want to make about Jones is that he was not a good fit with ‘his own culture’. Yes, his art belongs to the modern moment, but his concerns are frequently at odds with most of his contemporaries. I have no difficulty calling him a modern artist, but that seems to me to be a different thing from modernist. I also think that his way of painting was quite unique, in many ways the visual equivalent to his way of writing. And of course he was one of very few people in history to have made a signficant impact in both the visual arts and literature, and this dual activity also set him apart from most of his artistic contemporaries.</p>
