    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : primetype</strong></p>
    <p>From 1995-99 <a href="/wiki/Ole%20Schafer" class="freelinking" rel="nofollow">Ole Schäfer</a> worked at MetaDesign as type designer and type director for Audi, Volkswagen, Boehringer Ingelheim, Düsseldorf Airport, Sächsische Zeitung, Berlin's public transport company BVG and others. His typeface for the City of Glasgow's festival of architecture made him known outside Germany. He was also involved in the extension of <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a> bestsellers <a href="/wiki/FF%20Meta" class="freelinking" rel="nofollow">FF Meta</a> and <a href="/wiki/FF%20Info" class="freelinking" rel="nofollow">FF Info</a> as well as the new weights of <a href="/wiki/ITC%20Officina" class="freelinking" rel="nofollow">ITC Officina</a>.</p>
    <p>Schäfer now works as an independent type designer and teacher for type design and typography in Berlin. He launched his own foundry, primetype, in 2003 with new typefaces by himself and other designers.</p>
    <p>Besides Schäfer's work, primetype released fonts from other designers, including <a href="/wiki/Andrea%20Tinnes" class="freelinking" rel="nofollow">Andrea Tinnes</a> and <a href="/wiki/Verena%20Gerlach" class="freelinking" rel="nofollow">Verena Gerlach</a>.</p>
