    <p>Hey everyone.</p>
    <p>My communication design course at art university wants every student to create a booklet which is supposed to accompany an ad campaign for a chosen subject. Each and everyone of us needs to present our work early next year.</p>
    <p>I have NO idea for an effective ad campaign (newspapers) yet... ;-) However... I thought - why not start with my booklet then, as I did some profound research concerning my topic.</p>
    <p>I like the typefaces which were created for the relaunch of the UKs daily “The Guardian” a lot. I would have loved to choose them for lead-ins and headlines in my presentation as well. Another typeface I love (and which was also awarded by the TDC) is “Greta”. However, due to Christmas and other heavy expenses and my life as a poor design student, ;-) I had to settle for Lucida Std which I found on my Mac and thought of it as a good alternative for headlines and bigger sized lead-ins...</p>
    <p>I think about combining it with one of the following typefaces (for continuous text):<br>
    Bliss Pro, Vista Sans or Dax... I’ve attached a screen shot of those three, with Vista Sans being my favorite at the moment, for the simple reason that I feel it might be more readable (in small print) although it’s “f” and “l” collide for example.</p>
    <p>What do you think - I feel the two typefaces might go well together, I’m no type specialist, so I might be completely wrong as well - that’s why I ask you guys :-)</p>
    <p>Thanks a lot &amp; happy new year,<br>
    Jan</p>
    <p></p><div class="imageWrap"><img src="/files/Picture3_4119.png"></div><p></p>
