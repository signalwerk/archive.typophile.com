      <p>&gt; “f” and “l” collide</p>
      <p>That’s not so much a collision. It’s a <a href="/wiki/ligature" class="wiki">ligature</a>. You can turn it <a href="http://www.fontshop.com/fonts/singles/emigre/vista_sans_book/?sample_text=fl%C3%BCchtet&amp;sample_size=14&amp;acs_p=1&amp;acs_pt=24&amp;acs=1">off</a> if you don’t like the effect.</p>
