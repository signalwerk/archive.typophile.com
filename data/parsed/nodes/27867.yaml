    <p>Thanxxx for your previous posts...<br>
    (If all you wanted to have was my number, you could have asked for it earlier ;-p...)<br>
    Ok, so one last thread about my new business card new modifications and : NO, I’m not going to put any other contact information there : I’d rather have a client gifted with a brain who could find all the information he needs on it and not overload the design with unecessary text... and : NO, I’m not willing to change the picture nore the logotype, for god sake ! A little bit of taste here, and c’mon it’s not that bad, I don’t agree...<br>
    By the way, I’d LOVE to see your bCards guys...<br>
    Let’s have a little gallery here in this thread.<br>
    B.CARDS HALL OF FAME (first edition)</p>
