      <p>Thanks for your reply Richard, certainly a lot to think about!</p>
      <p>Granted screen fonts aren't great on paper by their nature, so I agree about it's potential as a print font. However, the project isn't going live for a few months (around May/June) so we're looking towards the Pro version of Droid (which is on its way) for print. This will be used in a PDF document, rather than linking the fonts (or including a print stylesheet). I should have mentioned that in the initial post!</p>
      <p>Although the online presence is [currently] in Droid, the PDF summary documents could be set in something different. But I was wondering what other font families have both a serif and sans serif version? I couldn't think of any off the top of my head, and still can't.</p>
