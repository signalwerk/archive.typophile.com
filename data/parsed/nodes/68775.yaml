    <p>Woah, it's been a while since I've been on here!</p>
    <p>I've recently been checking out/using the Droid font (Google's android OS font) in a current project. Could anyone recommend an alternative which is easy to read, that has both a serif and sans serif version?</p>
    <p>(It's main use in the project will be for a design research summary document that will be available online (for visitors/potential clients to download and print), or printed and sent out).</p>
    <p>Look forward to your suggestions!</p>
    <p>Cheers in advance,<br>
    G</p>
