  - id: 589773
    user: 213248
    date: 2014-10-03T02:40:00
    date_raw: 3 Oct 2014 — 2:40am
    votes: null
    html: <p>Hi Caparica - The Italian bit is a backwards justification.  I just liked the name Belvedere which has Italian roots.  The inspiration for the font actually came about when I was drawing an inline for another - Showbiz - although the finished result evolved considerably.  Most of my fonts sell well, if not spectacularly.  Showbiz, Soft Rock and Alma Mater are particularly strong sellers.  Some of my early work like Contessa sells hardly at all, but my skills have developed a lot since then.   As you say, there's really no accounting for taste, but if you have any other insights I'd be pleased to hear them.</p>
