    html: |-
      <div class="comment-spam-body"><p>I think Martin may have hit on something - The image with the girl does present your font well. The rest of the images don't present your font well or seem well thought out. I guess I'll be critiqueing your images...</p>
      <p>The images with the paisley backgrounds competes with your font too much. The font doesn't really compliment an image/idea/concept or just show off the font well. It competes with the background like another texture.  </p>
      <p>On the wedding image, it doesn't flow well - looks a bit like a collage - maybe get rid of the hand rail? </p>
      <p>On the Alienwear, I think that sends a mixed message, presented where a Sci-Fi font would do well. I don't think the font is suited for both "touch of class" and Sci-Fi. The Alienwear image looks poorly put together too. The design looks like it all should be centered, but the title is off to the left, the "heads" are off to the right, "by Studio K" is way left, while "Belvedere by Studio K" actually is centered. Do you really need "by Studio K" twice in that image? </p>
      <p>The other images are somewhat bland. </p>
      <p>You don't need "Studio K" and the font name in every image do you? That seems too much. Take a look at the images in "Selfie" for example: <a href="http://www.myfonts.com/fonts/argentina-lian-types/selfie/" title="http://www.myfonts.com/fonts/argentina-lian-types/selfie/">http://www.myfonts.com/fonts/argentina-lian-types/selfie/</a><br>
      The font name used only once in all the images, and note too where actual words are used complementing an image/idea/concept.</p>
      </div>
