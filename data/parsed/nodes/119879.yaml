      <p>When you make a font or family you really hope everything will go well sales-wise, but you should not expect it to happen -- that's kind of like buying a lottery ticket with your last dollar thinking for sure it's going to be a winner. Just because you really, really like a design doesn't mean others will.</p>
      <p>Even in the days of foundry type, ATF's biggest worry when introducing a new font in the various sizes was that they might end up with 150 linear feet of type inventory on the shelf that no one wanted.</p>
      <p>Don't let non-sales get you down though; keep on making fonts if that's your thing. Just don't depend on font sales supporting your lifestyle because it's not likely to happen.</p>
