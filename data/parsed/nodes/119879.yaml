    <p>I released this font family on myfonts a couple of weeks ago expecting it might be, if not a runaway success, at least moderately popular.  To date, though, not so much as a single sale.  Is this just a fashion thing, are we still in the silly season, or is the work seriously flawed?  I spent two or three months drawing it, so it's a bit galling that it's met, to date, with total apathy!  Your comments, suggestions and critiques are welcome.  I attach a small sample, but you can view the full family at: <a href="http://www.myfonts.com/fonts/studio-k/belvedere/" title="http://www.myfonts.com/fonts/studio-k/belvedere/">http://www.myfonts.com/fonts/studio-k/belvedere/</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Belvedere Sampler copy_5901.jpg"></div><p></p>
  html_clean: |-
