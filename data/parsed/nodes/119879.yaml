    votes: null
    html: |-
      <div class="comment-spam-body"><p>I don't really see how Conto and Belvedere are competing with each other. Belvedere is more of a display type while Conto has a broad text application. Seeing Conto Slab, I realize the typeface is somewhat reminiscent of DTL Prokyon and DTL Antares.</p>
      <blockquote><p>As for the general/specific thing I think you can argue that both ways</p></blockquote>
      <p>I agree. It has to fill a niche though. Although I do think Belvedere is rather unique and as a display face should compliment text typefaces that explore a similar road, perhaps the broader application of those other faces is what's competing with Belvedere. I'm thinking of faces like Uni Sans, Flexo, Core Sans and Helia Core. Still, I do find it puzzling you haven't sold a license considering, as I said, it seems to compliment other typefaces. But I must say, I don't remember having used any spurless typefaces before, so I wouldn't have an immediate need for Belvedere either. </p>
      <p>Could it be a matter of marketing strategy? I feel this picture presents the typeface very well: <a href="http://cdn.myfonts.net/s/aw/720x360/292/0/149747.jpg" title="http://cdn.myfonts.net/s/aw/720x360/292/0/149747.jpg">http://cdn.myfonts.net/s/aw/720x360/292/0/149747.jpg</a></p>
      </div>
