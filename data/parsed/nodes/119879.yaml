    html: |-
      <p>Absolutely, sales are a big motivator. As for Belvedere, it is interesting but I don't see it as being used widely -- but that's just one man's opinion.* There may also be other fonts out there that people already own that are similar -- which will block sales.</p>
      <p>I looked at the MyFonts specimens, and I must say it is very tight if that is normal spacing. While that shouldn't matter too much because of today's software capabilities, some people could be deterred by it, particularly if adding letterspacing might cause the spacing to become less than optically pleasing.</p>
      <p>*When ITC Souvenir first came out in the 70's, I absolutely loved it and still do. Today though, many people just about detest it. Why? I have no idea because technically it is well done and is pleasing to the eye, at least to me.</p>
