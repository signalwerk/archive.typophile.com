    html: <p>Thanks Special K and Jennastempel.  Haven't checked this post out for a couple of months, so sorry not to have replied earlier.  I think the presentation is a bit uneven and I take your thoughts on board.  I've recently made Belvedere Extra Bold the 'front of house' face on My Fonts and immediately generated some quite healthy sales, so I guess that goes some way to answering my original question - the bolder fonts seem to have more of a resonance with designers.  Hopefully sharpening up the images will help some more.</p>
