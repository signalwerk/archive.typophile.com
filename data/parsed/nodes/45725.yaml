      <p>Salut Christophe,</p>
      <p>there’s a <a href="http://www.typografie.info/typowiki/index.php?title=Hausschrift-Liste_Unternehmen-zu-Schrift" rel="nofollow">list of Corporate fonts</a> at German Typografie.info. It features some banks, too.</p>
      <p><a href="http://www.typophile.com/node/27315" rel="nofollow">This older Typophile thread</a> is about corporate initiated typeface designs. Nick mentions the Westminster Bank typeface, by David Quay(?), and Robb says that Fontbureau has customized a monospace Interstate for Citibank.</p>
      <p>And there’s the <a href="http://users.ncrvnet.nl/mstol/index.html" rel="nofollow">Website about Corporate Identity</a> by Hans Stol with a lot of useful information.</p>
      <p>F</p>
