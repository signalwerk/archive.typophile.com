    <p>Hi folks,</p>
    <p>I wanted to let you all know that I have been asked to teach a class on font creation at this year's <strong>Legacies II— the International Calligraphy Conference</strong> in Dallas. I'll be teaching the basics of how to use FontLab and Fontographer. The conference is a week long (July 19-26) and the class is called <strong>Tool2Type</strong>. It's a 2.5 day class, and you can learn more about the conference at this address:</p>
    <p><a href="http://calligraphyconference.org/index.php?option=com_content&amp;view=article&amp;id=57" title="http://calligraphyconference.org/index.php?option=com_content&amp;view=article&amp;id=57">http://calligraphyconference.org/index.php?option=com_content&amp;view=artic...</a></p>
    <p>So, if you or someone you know is interested in taking a class and begin making fonts, check it out.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/tool2type_5593.png"></div><p></p>
