      <p>Using the bass clef as the starting point for the design of a new at-sign... and drawing the conclusion that @ is not used much for its original purpose simply because it is now used more for a new purpose... both lack appeal to me, at least.</p>
      <p>@ was used for E-mail addresses because its original use gave it a semantic link to "at", which has a range of meaning - at a price, or at a location. If a new at-sign were developed just for E-mail, and displaced the old one among the easily available characters on a computer (otherwise, E-mail would become more difficult to use on older computers!) then when one used a computer for word processing as a typewriter, suddenly ASCII would no longer contain the old at-sign for commercial correspondence.</p>
      <p>It's bad enough that the Euro isn't $EU, but has its own brand new symbol that typewriters and fonts don't already have. While new symbols are a fun exercise in creativity, from a practical standpoint they're to be avoided unless desperately necessary.</p>
    html_clean: |-
