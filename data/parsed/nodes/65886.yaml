      <p>Brian, not "unnatural", but not-ideally-functional.</p>
      <p>&gt; still make it recognizable as an “@” to those who rely on<br>
      &gt; the “a” component to distinguish it from similar symbols.</p>
      <p>Like what?</p>
      <p>And always, think about the context: the "@" sign's main role now is email addresses. when you see it in a tightly-packed string of alphanumerics, what are the chances that it's going to be confused for the copyright symbol, versus an "a"?</p>
      <p>For example if you see "nin@gmail.com" and the "@" has a honking "a" in it, you're much more likely to incorrectly see it as "nina@gmail.com".</p>
