      <p>Hrant, your point about the ampersand makes sense, and you could add other examples: a question mark should not look like the letter "q", and an eszett should not look like a long s and an s or a z merely joined together. I personally don't like the W made of two Vs simply overlaid either. In other words, we shouldn't be taking the etymological origins of symbols and letters literally in designing them.</p>
      <p>But to me "@" has always been nothing more than an "a" with a circular swash, and the statement that you want people to see an "@" instead of an "a" makes as much sense to me as wanting people to see a "©" instead of a "c" in a circle.</p>
      <p>Is it just me? Are there people who think of "@" as an independent symbol with nothing to do with "a"? Come to think of it, I see how people who have only ever typed "@" and never wrote it by hand may not ever make the connection between "a" and "@".</p>
