      <p>Brian – very good point that transforming a character into what is essentially a catch word glyph is quite limiting in terms of cultural/language context.<br>
      Still, in principle I think it's interesting and refreshing to see a designer going about making this character differently – who said they need to always share the same structure (that's certainly not "progress" either). Plus, it's an alternate.</p>
      <p>BTW, I missed this the first time round:<br>
      <cite>"nin@gmail.com"</cite><br>
      Reminds me of how people actually tried to capitalize on the formal closeness of "@" and "a" for a while, back when email was still a new and exciting thing. I even know somebody who registered <em>the part of her name that follows the first "a"</em> as a domain name, so she could have an email address that was simply her name with that "a" replaced by an "@". :-\<br>
      It's certainly very fortunate that that isn't really done anymore. The close association of "@" with "a" seems to have waned largely by itself, maybe simply due to the fact that the "@" symbol has grown to be seriously relevant, and is now largely "understood" as a character in its own right. All the less reason to make it look too much like an "a" if you think about it that way (but maybe also less reason to <em>completely</em> redefine its design…).</p>
    html_clean: |-
