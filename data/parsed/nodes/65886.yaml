      <p>Brian, for any symbol we must consider what it does, not where it comes from. The "a" component of "@" should be actively discarded because all promoting that can do is confuse people; seeing an "a" in there is much more likely to do harm than good. Knowing that the "@" comes from writing "at" quickly is just cute trivia, not good design.</p>
      <p>This reasoning is also what I apply in demoting chirography in type design.</p>
      <p>hhp</p>
