      <p><cite>The close association of "@" with "a" seems to have waned largely by itself, maybe simply due to the fact that the "@" symbol has grown to be seriously relevant, and is now largely "understood" as a character in its own right. All the less reason to make it look too much like an "a" if you think about it that way (but maybe also less reason to completely redefine its design…).</cite></p>
      <p>I disagree.</p>
