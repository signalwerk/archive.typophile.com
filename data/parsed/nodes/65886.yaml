      <p>Hrant: <cite>What about in fonts with a monocular “a” (like most Italics)?</cite></p>
      <p>To me, that is nothing to worry about, at least no more than one would worry about the "d" looking too much like the "a" when you take away the ascender. The circular swash means the "@" will never, ever be confused with an "a". The focus should be on differentiating it from other circular-swashy characters, which admittedly isn't much of a problem for most westerners.</p>
