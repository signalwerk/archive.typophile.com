      <p>Hrant, this must be a difference of how we think of the "@" sign, because I think an "@" where the central component is stylized beyond recognition as an "a" will be more confusing to me.</p>
      <p>Maybe this comes down to the fact that I'm more used to glyphs that may be confused with an overly-stylized "@". Koreans (and Japanese, I think) often make use of circled letters, and Thai numerals or Japanese hiragana contain many symbols containing a circular-swash-like element. So to me, what distinguishes "@" from an array of other similar symbols—indeed, the most characteristic trait—is the central "a" component.</p>
      <p>I remember seeing other Koreans writing "@" as simply a circled "a". This is nothing more than anecdotal evidence, of course, but it shows that to some people the connection between "@" and "a" is really strong.</p>
      <p>The situation may indeed be different for those who are not likely to use any other symbol that can be confused for the "@".</p>
