      <p>Hrant, while I agree with the principle behind your suggestion, is there anything inherently unnatural about thinking of "@" as a swashy "a" symbol? Any more than thinking of "©" as "c" in a circle, for example? It's a convenient and intuitive way to think about the symbol, even for many non-English-speakers who have no idea that it is called the "at sign" in English. Take away the connection and we are left with a random scribbly hieroglyph that we'll never remember how to write. ;)</p>
      <p>I'm also curious how one would move the design of the "@" away from the "a" component and still make it recognizable as an "@" to those who rely on the "a" component to distinguish it from similar symbols.</p>
      <p>Just to make clear, none of the atypical "@" treatments that Bendy found (from Roadway, Jana Thork, Perla, and Letunical) look like "@" to me. Just because in my mind "@" is inextricably connected to "a" doesn't mean that just any "a"/"A" with a circular swash makes an "@". But Bendy's own "@" design to me is a perfect example of what an "@" should be shaped like. I'm curious how one would improve upon it.</p>
