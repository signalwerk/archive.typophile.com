      <p>Just yesterday, I saw a Korean write down her e-mail address making the @ an "a" in a circle. Now that I think of it, I've noted in the past looking at sign-up sheets and such that this is how the vast majority of Koreans write the @ in e-mail addresses; I was the type geek who insisted on a proper connected @ form. I can't even recall seeing another Korean who writes the @ like I do, although surely I can't be the only one.</p>
      <p>The lesson, I think, is that we should keep in mind that how one sees a character is often more culture-dependent than one might think. Something to keep in mind when we discuss the designs of glyphs like the @ or numerals, asterisk, daggers, and such.</p>
