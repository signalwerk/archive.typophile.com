      <p>I would think that the at-sign @, in order to look like @, needs to look like a single story a, with a tail that goes around it. Yes, it needs to be very distinct from the lower-case letter a, and from a circled A, whether upper- or lower- case, but it <strong>also</strong> needs to not be an unfamiliar symbol which readers will not recognize at sight.</p>
      <p>Of course, on the other hand, &amp; would only look like an et ligature in a typeface which is patterned after a historical typeface or group of typefaces in which that was the case.</p>
