      <p>Hi oldnick, </p>
      <p>To my eyes it's horrid, too curvy. It's quite feminine. Don't like the r, k, and g. It feels rather geometric. I also don't like the bilateral slabs. I suppose the feeling I'm after is mechanical. </p>
      <p>Maybe I should settle for  Grotesk, or a Neo-Grotesk Sans. I think I'm far too picky at times with slabs. I like Helvetica, but I really dislike the upper-case R in Helvetica, especially in italics. Akkidenz-Grotesk is pretty good. FF meta deserves a special mention for it's curves, very organic. </p>
      <p>I like Frutiger's r but not their a, and q.</p>
