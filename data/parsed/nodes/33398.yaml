    html: <p>I have never been to most of those places. I do not work with trains, or hand paint exteriors with scriptures. TO be fair, I considered the term “document” lightly on the front of the site, but the pictures document well other things, such as  the chemistry of the decomposition, quite well. Brad’s recontextualization (as pretty art stuff)is what creates the value to some of us, as too busy adults, to go and appreciate. It also helps keep me from reading the words in what is a picture, to some extent. Could there be more type-documentation and less recontexting? Sure, but this works well for me. Also, ya can’t beat the price.</p>
