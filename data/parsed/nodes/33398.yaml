    html: |-
      <p>Just a quick note to say I just returned from my childhood home of New Orleans and managed to take some photos along the way. The new photos can be seen in the ’Latest Additions’ album—you will notice I am now making a conscious effort to take 2 shots (sometimes more) to satisfy those wishing to see the whole sign as well as those drawn to the more abstracted crops.</p>
      <p>Some of the signs in the Newest Additions gallery are the same signs I have photographed before, but I can never resist an opportunity to perhaps look at these in a new way.</p>
      <p>Trips to Chicago and Seattle are planned within the next month, so I should have more to add to the site then.</p>
      <p>Thanks again for all the kind words and suggestions. The overall response has been quite positive and has given me a new energy for this project. I am still far away from pushing for book publication, but I do have a few ideas of how I would like to see lettermade grow in the future.</p>
      <p>Regards,<br>
      Brad.</p>
