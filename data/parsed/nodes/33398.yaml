      <p>crossgrove,</p>
      <p>thanks for the insightful comments.</p>
      <p>you may very well be right—it may be an issue of audience. I can indeed understand why these photographs may frustrate those looking for full specimens. But the aim here is to appreciate the micro (as opposed to macro) properties of the letterforms by focusing on the presence of nature and the human hand and not so much the content of the sign itself. This is the reason that the letters are not completely abstracted.</p>
      <p>To this end the “document, appreciate, and recontuxtualize” components are not the same things, but equal parts of an inseperable process. if i had stripped the recontextualize portion from this process we would probably be seeing the full sign. However for me the crop and composition play an essential role in allowing the viewer (typographer or otherwise) to appreciate the work on a formal/sensory level.</p>
