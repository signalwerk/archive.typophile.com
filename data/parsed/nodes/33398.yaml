    <p>Thought everyone at Typophile may find this interesting:</p>
    <p><a href="http://www.lettermade.com" title="http://www.lettermade.com">http://www.lettermade.com</a></p>
    <p>This ongoing project, started in 1998, is aimed at documenting, appreciating, and recontextualizing our vernacular letterforms and typography.</p>
    <p>I have been working on this project in the background for several years and have only recently managed to get a substantial portion of my images online. I would love to hear any questions, comments, etc.</p>
    <p>Regards,<br>
    Brad.</p>
