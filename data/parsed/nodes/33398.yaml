      <p>For some reason this did not post earlier:</p>
      <p>ill sans: Eventually I will work up the steam to push this project out to potential publishers. For now I am simply happy to have it online. Do you know of any publishers who would be predisposed to this sort of publication?</p>
      <p>jpad: I do have other photographs that often show the signs in their entirety. However it was/is my intention with this project to really focus on using the camera as a compositional tool while examining the unique letterforms and weathering of each sign. I guess in some ways I do not see the documentation, appreciation, and recontextualization as three separate things, but as a single goal—each component of which is essential to the other. Hopefully that makes sense. </p>
      <p>Essentially I wanted, personally, to admire these letterforms as something a little removed from their original intent. The camera was my way of doing that. Hence the ’arty’ compositions of these images.</p>
