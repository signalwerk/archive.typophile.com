      <p>I’d also like to see whole letters and signs. I think the audience here is different from the average layperson or photographer: whatever the medium, I am interested in the letterforms first and foremost. So these fragments are frustrating for me, especially knowing there is more. For that matter, you could bring these same images, or other photos of the same signs, to an even more abstract level than you have. Why leave them recognizable as letters, or even as signs?</p>
      <p>“I do not see the documentation, appreciation, and recontextualization as three separate things, but as a single goal—each component of which is essential to the other.”</p>
      <p>I would argue with that. Document: record. Appreciate: view, assess. Recontextualize: obscure, dislodge, reframe, repurpose. One of these is not like the others. It may be that your goal for this project is all three, and of course I can’t argue with that. But this audience may value the originals more than the recontextualizations.</p>
    html_clean: |-
