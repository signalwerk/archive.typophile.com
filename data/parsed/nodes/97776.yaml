    <p>Dear typophiles,</p>
    <p>After a request of a friend I’m writing about these strange capitulars.  She is writing his thesis about Sebastião Nunes, a Brazilian Poet of the 90’s that used those capitulars on his book História do Brasil a satiric view of the Brazilian historiography. The colophon doesn’t inform nothing about the typeface and the author too.</p>
    <p>To me, the typeface looks like a kind of clipart from an old book capitular. Take a look in the irregular contours, the oldstyle proportions and the “ancient-greek-roman” ornamentation. To me is  something from XVI century.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/cassia_6664.gif"></div><p></p>
