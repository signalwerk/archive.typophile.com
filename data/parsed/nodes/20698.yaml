      <p><em>why do most people specify arial as the default font for websites over helvetica. Or even put arial before fonts like maybe verdana or trebuchet?</em></p>
      <p>Like it or not, most browser out there use Windows and Internet Explorer, which means they have Arial installed on their systems; Macs, on the other hand, come with Helvetica pre-installed. Since Arial and Helvetica are reasonably equivalent in their gross metrics, web designers can be reasonably confident that the pages they design will be rendered in more or less the same way, regardless of browser or platform, following the hierarchy of arial-helvetica-sans serif. If Arial is available, the browser uses Arial; if not, it uses Helvetica; if neither is available, it uses a generic sans.</p>
      <p>I agree that almost all browsers render Verdana and Georgia better than Arial (they were designed to, and succeed admirably) but, until Verdana and Georgia  ship with every computer OS and browser, its use can create problems for web designers because their gross metrics are very different from their Mac equivalents.</p>
    html_clean: |-
