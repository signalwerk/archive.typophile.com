    html: |-
      <p>Arial and Helvetica are similar in some basic ways; however, there are so many subtle differences just beyond the broad appearance. Anyone who messes around with type will spot those differences eventually. Once seen, those differences are highly noticeable. The fonts become as different as night and day.</p>
      <p>There are certain characters in Arial I find pretty ugly, such as the lowercase "a" with its crooked looking aperture. I don't like the angled cut at the top of the stem on the lowercase "t". The angled stem on the capital "R" seems pretty odd. Typefaces like Vectora, Akzidenz Grotesk, Trade Gothic among others handle those design cues in a more attractive manner.</p>
      <p>I'm sick of seeing Helvetica, but agree it is still highly useful in combining with other more flashy type styles. Helvetica Neue Extended has some personality at least.</p>
