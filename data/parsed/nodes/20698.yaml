      <p>I've never liked Arial because it seems Frankensteined together. It recycles the metrics of Helvetica while grabbing style cues from Univers, Akzidens Grotesk and a number of others.</p>
      <p>My dislike for Arial intensified over seeing how it has been used in sign design. Many of these vinyl cutting shops have people who simply grab one of the first fonts they see in the menu: Arial. Their CorelDRAW font disc has lots of naturally condensed and compressed faces. But these folks just squish or stretch Arial Bold and Arial Black to fit any space.</p>
      <p>Arial is ugly enough it its own natural state. It's stomach-churning when seeing it distorted and plastered on any acrylic sign face next to a street.</p>
