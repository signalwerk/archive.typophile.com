      <p>Perhaps. Would it be as widely used as it is if Microsoft hadn't bundled it in Windows, Office, and Internet Explorer? It's never had the chance to make a name for itself in the marketplace the way Helvetica did, so we will never know. Its history is the key to its popularity, whether people know it or not. Whether it's a good typeface or not (sure, it's functional, although many designers don't like it simply on aesthetic grounds) is almost beside the point.</p>
