    <p>Why is arial still so highly used over helvetica?<br>
    Take for instance my sister's highschool year book. Her instructor used arial for cutlines. Why would someone teaching design to highschool students use arial when they have pretty much any other choice? and especially over helvetica?</p>
    <p>I get that microsoft used arial in windows so it's widespread, that it is cheaper and that most people won't know the difference. But a design instructor? Also why do most people specify arial as the default font for websites over helvetica. Or even put arial before fonts like maybe verdana or trebuchet?</p>
