      <p>&gt;What i don’t get is why some people love helvetica and some people hate it/ will never use it/ tell their students not to. Is it personal preference, over use, or some other reason?</p>
      <p>I think there are three reasons:</p>
      <p>1. Helvetica is a poor text face for print, but is constantly mis-used this way. Its combination of circular rounds and tight spacing make it hard to read, especially if it is used in long measure on letter-sized paper. Screen Helvetica &amp; Arial are really a different animal as hinting quite changes its forms. </p>
      <p>2. It can be an effective display face, but it is so over-used that most type-aware people are sick of seeing it. Admittedly some designers, including prominent ones, are still fans, regarding it as a completely 'neutral' face that they can turn to whatever use they want with their designs. </p>
      <p>3. Many designers feel there are better alternatives to it as a display face, if you want its general look. These include Univers, which appeared at about the same time, and Akzidenz Grotesque, which is based on the same historical model. </p>
      <p>John Hudson has said with some justice that Helvetica is like a fish that everyone says they don't like but in fact eat every day. </p>
      <p><a href="http://typophile.com/node/19366" rel="nofollow">Here</a> is one of the many, many discussions of Helvetica on typophile.</p>
    html_clean: |-
