    <p>Hello!</p>
    <p>I'm building a website for an law firm. My client has no logo, then I used Trajan Pro to make the ID (my focus isnt logo at now).</p>
    <p>My focus is that welcome text (Bem Vindo in portuguese) I can't find a font that looks great to do it with others element (logo, menu and that text above).</p>
    <p>Somebody can give me ideas? Thanks.</p>
    <p>PS: That Picture have the company's brands fotolia because I have not bought it. I'm just doing tests.</p>
    <p>Thanks</p>
