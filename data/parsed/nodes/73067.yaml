    html: |-
      <p>The best way is to use the same font for logo and headlines. But Trajan isn't the best choice for this. It's overused, even in Brazil.</p>
      <p>You can achieve a very classy, elegant result with Arno Pro or Girando Pro. As these fonts have small caps, beautiful ligatures and ornaments, you can play with these variations in titles. Other options in this line: Williams Caslon, Documenta, Lyon Text.</p>
      <p>Calluna is beautiful, but maybe a bit playful for lawyers. Minion is great, but it's becoming very common (even ZH uses it). In a less traditional approach you can test Stuart or Expo Serif.</p>
      <p>Your client will need to combine numbers with its logo and headlines. So pay special attention to numbers (old style or lining, normal or Roman-like 1, etc.). Some fonts have the old style zero like a simple ring to differentiate from lowercase o, and this produces an uneven and ugly result (IMHO).</p>
      <p>If you need to keep Trajan for the logo, I second Nick's Pratt.</p>
      <p>If you have choice about the sans, there are many options to scape the Arial/Helvetica world. Unit, Proxima Nova, Interstate, Info Text, Milo, The Sans, Gotham, Dobra and Flama are some I remember now.</p>
      <p>Meta and Meta Serif have excellent reputation, but I dislike their accents, a decisive question to Portuguese texts.</p>
      <p>Hope this helps.</p>
