  html: |-
    <p>Hi.</p>
    <p>Client likes <a href="http://www.linotype.com/799/ITCSlimbach-family.html" title="http://www.linotype.com/799/ITCSlimbach-family.html">http://www.linotype.com/799/ITCSlimbach-family.html</a> for body text. I, too, am finding it quite lovely.</p>
    <p>The client has seen it paired with Univers for titles, headings, and captions, and they like it; client already uses Franklin Gothic for a lot of their visual identity, which I think pairs with Slimbach about as well as Univers. Which is to say, OK but not great.</p>
    <p>So, what sans would YOU pair with body-text Slimbach for titles, headings, and captions? And, what would you use for pull-quotes?</p>
    <p>It would be for publications for a department at a major university. So, inviting and serious, but if we can avoid being stodgy that would please the client (and me).</p>
    <p>What think you?</p>
