      <p>Just to be clear: As I understand it, a license is for a certain number of copies of the software. The usual thinking I run into from publishers is "We bought the font. Therefore, it is OK for you to sent me a copy of it."</p>
      <p>Well, no. The publisher bought, say, a license to have five separate copies of the software (usually) installed on their computers. If I send them a copy of our fonts with job, that would be a sixth copy. Either I (as a vendor with X-number licensed copies) need to give up one of my licensed copies, or *somebody* has to buy a new license.</p>
      <p>It is the number of copies the license permits that no one seems to understand.</p>
      <p>All this is separate from the muddy modification rules (cited above). As I read them, I can't "send a copy" even if a new license is purchased; modified fonts can't leave the building. Further, it looks like I'm supposed to trot over to their building &amp; modify the newly licensed copy there. And I'm not supposed to take any "fonts" with me, or leave with any "fonts." Please tell me I'm wrong on this, my trotting days are long past.</p>
      <p>As I've said before, this doesn't fit the modern workflow. Maybe a per-use license, or a cheaper "license to archive" for copies of the font software where there is no anticipated use; they are a backup in case a particular job, for some reason (second printing with three corrections, maybe?) needs them.</p>
      <p>FWIW</p>
    html_clean: |-
      <p>Just to be clear: As I understand it, a license is for a certain number of copies of the software. The usual thinking I run into from publishers is "We bought the font. Therefore, it is OK for you to sent me a copy of it."</p>
      <p>Well, no. The publisher bought, say, a license to have five separate copies of the software (usually) installed on their computers. If I send them a copy of our fonts with job, that would be a sixth copy. Either I (as a vendor with X-number licensed copies) need to give up one of my licensed copies, or *somebody* has to buy a new license.</p>
      <p>It is the number of copies the license permits that no one seems to understand.</p>
      <p>All this is separate from the muddy modification rules (cited above). As I read them, I can't "send a copy" even if a new license is purchased; modified fonts can't leave the building. Further, it looks like I'm supposed to trot over to their building &amp; modify the newly licensed copy there. And I'm not supposed to take any "fonts" with me, or leave with any "fonts." Please tell me I'm wrong on this, my trotting days are long past.</p>
      <p>As I've said before, this doesn't fit the modern workflow. Maybe a per-use license, or a cheaper "license to archive" for copies of the font software where there is no anticipated use; they are a backup in case a particular job, for some reason (second printing with three corrections, maybe?) needs them.</p>
      <p>FWIW</p>
