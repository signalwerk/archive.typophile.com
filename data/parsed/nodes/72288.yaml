      <p>Sorry to go a bit off topic, but:</p>
      <p><cite> . . . unlike most foundries, Adobe's license allows such modifications, as long as they are not redistributed and are used by folks who are legitimately licensed for the fonts in question.</cite></p>
      <p>I know you're not a lawyer, but here goes. I modify most of the Adobe fonts we use for setting scholarly books for publishers. Here's the problem: we have customers that do have a license for the unmodified fonts, and want us to include the fonts we actually used, along with the .indd files, as part of finishing off a project. To date we have refused, partly on the basis of the licensing. </p>
      <p>They argue that the practice of publishers REQUIRING the typesetter to include the fonts is so common as to make our concerns unwarranted. And in case the type design community didn't know it, that practice *is* common, as is the one of allowing (interior) book designers to use only Adobe fonts because of the licensing situation. (Don't get down on me, I'm only reporting, not arguing for this position.)</p>
      <p>Tying this in to the original question then, is "no distribution" to be taking only as prohibiting reselling the type itself, or does it include prohibiting passing on the modified fonts to a customer who also holds a license for the unmodified font?</p>
      <p>If the latter, it would seem that Gerhard Donauer is still in need of a solution.</p>
