    <p>i read some time ago that it is possible (and legal) to extract special opentype features from a licensed adobe font and create a (ttf?)-font that could be used in applications that do not support opentype (like office word). </p>
    <p>to make things more practical: i would need for a client three weights of hypatia sans (e.g. light, regular, bold) in the stylistic set 1 (no serifs) both itallic and normal and additionally in the stylistic set 13 (unicase).</p>
    <p>any ideas if this would work, who could do this and what costs i would have to face?</p>
    <p>thanks<br>
    gerhard donauer</p>
