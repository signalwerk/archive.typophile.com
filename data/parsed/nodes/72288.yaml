      <p>David, I'd say you "may not" be in accordance with the license.</p>
      <p>From:</p>
      <p><a href="http://www.adobe.com/aboutadobe/antipiracy/ff_faq.html" title="http://www.adobe.com/aboutadobe/antipiracy/ff_faq.html">http://www.adobe.com/aboutadobe/antipiracy/ff_faq.html</a></p>
      <p><cite>You are allowed to use font manipulation software to modify the font software to produce “derivatives” of fonts licensed from Adobe, as long as you use the derivatives in accordance with the same licensing terms that accompany the original fonts. For example, you can use Macromedia Fontographer or Pyrus FontLab to customize an Adobe Font for individual usage, but you are not permitted to distribute, sell, or give away, the derivative work, and the derivative work counts as one of the permitted number of uses.</cite></p>
      <p>and</p>
      <p><cite>A consultant may solicit their services to companies who have legitimately licensed copies of Adobe font software. The work product of the consultant must remain with the company. The consultant cannot (i) take or keep a copy of the company’s original, localized, or customized version of the font software, or (ii) distribute any original, localized or customized versions of the font software.</cite></p>
      <p>I don't see the font police everywhere. What seems to be going on is the lawyers are trying to protect their clients from font piracy, but have no understanding as to how fonts are actually used in today's environment. From that perspective, everything given with one hand is taken away with the other.</p>
