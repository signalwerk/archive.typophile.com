    html: <p>Assuming it's legit for the client to pay me to modify their Adobe licensed font, I've been working on the basis of giving them my modified version and telling them to replace an unmodified copy with it, and then billing them for whatever fraction of my modification time seems appropriate based on whether I did the modification just for them or if it was something I had already done for general use with many clients. This seems to work so far, but admittedly I've only done small changes like adding a few glyphs that can live without in-font kerning if necessary (nothing like re-kerning all of Arno Pro), so I've never tried to bill them for enough time to cause anguished screams.</p>
