      <p>Adobe is interested in helping people "stay legal", and anyone who is making an effort to do so should not worry about contacting Adobe to ask questions about it.</p>
      <p>Just to be clear: Adobe's EULA allows for the kinds of modifications discussed here, but the modified font counts toward permitted uses. An end user that has a one-seat license <em>cannot</em> modify the font and keep/use both the unmodified and modified font. Luckily, the most common font EULA from Adobe is a 5-seat license, so many users have the leeway to modify a font and still keep the original.</p>
      <p>One reason Adobe is somewhat permissive about sending copies of fonts along with jobs is because we recognize that small variations between font versions can exist, and it's sometimes important for a job to be output with the <em>exact same</em> font that it was created with. Still, the service bureau must have their own legitimate license.</p>
      <p>Obviously, a contract requiring a designer to hand over a font to a publisher with a job does not supersede the user's existing EULA. An appropriate response in the face of such a demand would be, "I will be happy to include all fonts, but you must first ensure that you purchase your own license."</p>
      <p>Charles (or anyone), feel free to contact me offline and I'd be happy to get your legal questions answered definitively.</p>
