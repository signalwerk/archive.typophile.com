      <p>It could be done, sure. And unlike most foundries, Adobe's license allows such modifications, as long as they are not redistributed and are used by folks who are legitimately licensed for the fonts in question.</p>
      <p>I'll note that Office 2010 does in fact support OpenType layout features, including even stylistic sets, with the caveat that one can only turn on one stylistic set at a time (IIRC). Then again, even if your customer/client is on Office 2010, it may still make more sense to customize the fonts to get the desired result consistently.</p>
      <p>I think something like this is best accomplished with automation in terms of how the change is done. One could script it in FontLab with Python, or even using TTX and Python. I suggest that offering some small bounty and letting the script be open source would be ideal, as it would be useful to others as well, on other fonts. Maybe Tal Leming, Adam Twardoch or Just van Rossum would be available....</p>
      <p>Heck, I'd kick in a few bucks toward paying somebody to do that script.  :)</p>
      <p>Regards,</p>
      <p>T</p>
