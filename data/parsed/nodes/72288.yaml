      <p>To try and stay relevant to Mr. Donauer's post, I think he faces some of the same issues.</p>
      <p>I'd be happy to talk to someone at Adobe, but it is a large company, and to anyone but a very few in the type design side of things, I'd just be an annoyance to ignore (well, maybe there too, but hopefully sometimes an *interesting* annoyance . . .).</p>
      <p>The use of type has gone well beyond what anyone envisioned when the EULAs were written to protect the foundries while maintaining a useful product. I can show you numerous contracts from State-run university presses which require the typesetter to include the fonts with each job as a part the contract. This isn't for printing the book, but for the *file,* now the principle product of publishing.</p>
      <p>For example, one of the things I've been told is that when a publisher contracts with an outside agency (usually in India) to take the InDesign files and make an ebook, the Indian company will give them a significant discount for this work if the fonts are included. It isn't that the fonts are being used for the ebook itself (usually Kindle or EPUB format), but the people doing the work find it easier if the fonts are included.</p>
      <p>Or, one I got just today. A publisher discovered that there are no hamzas or ayns in Arno (surprise), which the designer has chosen for the text. They have asked us to set it, so I'll make up and kern the characters. Likely there are a few dot-below Latin characters needed as well.</p>
      <p>BUT the designer wants those fonts so she can do the cover. Of course, they already have a license for Arno; they can't see a licensing problem. And this is one of the publishers who makes sure they have a license to cover the number of platforms the type is used on. They are trying to stay legitimate. Number of total copies of a font, or restrictions on modified fonts are not on their radar.</p>
      <p>AFAIK, everybody in the publishing world ignores the "number of copies" part of the EULA, feeling, I suppose, that they just couldn't do their work otherwise. I can't imagine they have a site license for number of copies of the fonts they use, not if every book generates two or three copies. If the foundries say "tough," the press directors will say fine, all our books will be set in a couple of typefaces. And Open Source fonts will gain a lot of new converts. Type designers can forget about any sales to publishers.</p>
      <p>If anyone thinks this is only done by small publishers, two I know of who require the typesetter to include all fonts are Oxford University Press and Columbia University Press -- and both do hold licenses for the fonts they allow the designers to specify.</p>
