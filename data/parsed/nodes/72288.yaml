      <p>Following Phinney's idea, I wrote a small Python and FontForge script that would take an OpenType font, a feature to activate and optionally a script and language tags. The script and language can be useful to activate script and language sensitive features. Only single substitution features are supported (it checks the actual metatada of the feature regardless of its name).</p>
      <p>It can be found <a href="http://github.com/khaledhosny/deotfy" rel="nofollow">here</a>, obviously you need FontForge with Python support. It is still rough at edges (tags must be exact and are case sensitive) but I think it does what it ought to do.</p>
