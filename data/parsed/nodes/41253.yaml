      <p>Further to this, I posted about my experiences at my blog <a class="freelinking external" href="http://www.roger-pearse.com/weblog/?p=559" rel="nofollow">here</a>.  One of the comments suggested that a number of free fixed-width unicode fonts exist:</p>
      <p>I was told:</p>
      <ul>
      DejaVu Sans Mono: <a class="freelinking external" href="http://sourceforge.net/projects/dejavu/" rel="nofollow">http://sourceforge.net/projects/dejavu/</a><br>
      Everson Mono: <a class="freelinking external" href="http://www.evertype.com/emono/" rel="nofollow">http://www.evertype.com/emono/</a><br>
      FreeMono: <a class="freelinking external" href="http://www.gnu.org/software/freefont/" rel="nofollow">http://www.gnu.org/software/freefont/</a><br>
      GNU Unifont: <a class="freelinking external" href="http://unifoundry.com/unifont.html" rel="nofollow">http://unifoundry.com/unifont.html</a>
      <p>are all fixed-width and support Unicode polytonic Greek (although some aren’t the most attractive fonts).</p>
      <p>Good resources for this sort of thing:<br>
      <a class="freelinking external" href="http://www.alanwood.net/unicode/fonts.html" rel="nofollow">http://www.alanwood.net/unicode/fonts.html</a><br>
      <a class="freelinking external" href="http://www.unifont.org/fontguide/" rel="nofollow">http://www.unifont.org/fontguide/</a>
      </p></ul>
      <p>I've not had a chance to try any of these, but any thoughts would be interesting.</p>
    html_clean: |-
      <p>Further to this, I posted about my experiences at my blog <a class="freelinking external link-external" href="http://www.roger-pearse.com/weblog/?p=559" rel="nofollow">here</a>.  One of the comments suggested that a number of free fixed-width unicode fonts exist:</p>
      <p>I was told:</p>
      <ul>
      DejaVu Sans Mono: <a class="freelinking external link-external" href="http://sourceforge.net/projects/dejavu/" rel="nofollow">http://sourceforge.net/projects/dejavu/</a><br>
      Everson Mono: <a class="freelinking external link-external" href="http://www.evertype.com/emono/" rel="nofollow">http://www.evertype.com/emono/</a><br>
      FreeMono: <a class="freelinking external link-external" href="http://www.gnu.org/software/freefont/" rel="nofollow">http://www.gnu.org/software/freefont/</a><br>
      GNU Unifont: <a class="freelinking external link-external" href="http://unifoundry.com/unifont.html" rel="nofollow">http://unifoundry.com/unifont.html</a>
      <p>are all fixed-width and support Unicode polytonic Greek (although some aren’t the most attractive fonts).</p>
      <p>Good resources for this sort of thing:<br>
      <a class="freelinking external link-external" href="http://www.alanwood.net/unicode/fonts.html" rel="nofollow">http://www.alanwood.net/unicode/fonts.html</a><br>
      <a class="freelinking external link-external" href="http://www.unifont.org/fontguide/" rel="nofollow">http://www.unifont.org/fontguide/</a>
      </p></ul>
      <p>I've not had a chance to try any of these, but any thoughts would be interesting.</p>
