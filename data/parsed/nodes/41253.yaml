      <p>Spire, </p>
      <p>The concept that some plain-text files should use different encoding than others *is* antiquated, no matter what. In future, it only makes sense that plain-text files (even programming source code) are encoded using Unicode — even if a certain document format or programming language restricts the character set used for certain aspects, e.g. object names. </p>
      <p>But whether string literals should be intermixed with programming code or externalized depends on the type of application. If the application is text-intense and only contains comparably little programming code (i.e. it is more like a document with elements of a program, e.g. a dynamic web page) *and* it will only be deployed in a single language, then I think externalizing strings makes little sense. It becomes useful only in scenarios where you have a large overhead of programming code over text, or when you're developing for i18n scenarios. </p>
      <p>As you well know, XML can use any Unicode characters for element and attribute names. So you may use an XML document structure that looks like this: </p>
      <p><code>&lt;?xml version="1.0" encoding="UTF-8"?&gt;<br>
      &lt;authors&gt;<br>
      &lt;author type="main"&gt;<br>
      &lt;firstname&gt;Юрий&lt;/firstname&gt;<br>
