      <p>I realize this is a defunct discussion, but I feel compelled.</p>
      <p>Defining coding as creating something that gets compiled into an executable is a rather narrow definition.  As a computational linguist, I do things which I consider to be coding, but which do not get converted into executables per se.  One of these things is to code finite state transducers for various human languages, using tools like the Xerox and Stuttgart Finite State Transducers (xfst and sfst respectively).  I have also done coding in XML, where the XML is intended to be converted into the programming language of one of these FSTs.  Once in awhile I've programmed things in Python (and co-workers have done so in Perl or even C) to modify the XML code for these FSTs or for dictionaries, and occasionally it's necessary to embed Unicode characters in these programs--not as strings to appear in dialog boxes or such like, but as parts of strings or regular expressions that the Python etc. code needs find in the XML and modify.  </p>
      <p>Apart from C, all these programming languages use interpreters.</p>
      <p>The human languages we work with have included Bengali, Arabic and Urdu (Urdu uses the Arabic code range of Unicode).  I wouldn't be surprised if we worked with other Indic languages in the future, and Ethiopic languages are not out of the question.</p>
      <p>I regularly use jEdit or Visual Slickedit for writing these programs; some of my co-workers use emacs.  We also use XMLmind, although that is mostly for DocBook-type XML, which I suppose you don't consider to be coding.</p>
      <p>So I think I feel safe in calling what I and my co-workers do "coding", even though it does not always result in executables.  Hard-coding literal strings is really the only option for these programs, especially for the FSTs where the whole point is to deal with dozens or even hundreds of such strings in the morphology and phonology of these languages.  We certainly use programmers' editors, and at least jEdit does not "support user-definable fonts for each Unicode range".  (I asked a couple months ago, and it's probably at the bottom of their priority list.)</p>
      <p>  Mike Maxwell</p>
