      <p>Simon, </p>
      <p>for coding purposes (a monospaced linear font), a pan-Unicode font would actually be useful. </p>
      <p>Monotype Imaging offers <strong>Andale Mono WT</strong>, a pan-Unicode monospaced font with the same design as the free Andale Mono font. There are four versions that cover the entire Unicode 3.0 range: Andale Mono WT J (Japanese), Andale Mono WT K (Korean), Andale Mono WT S (Simplified Chinese), Andale Mono WT T (Traditional Chinese). There is also a set of two fonts: Andale Mono WTG and Andale Mono WTG Surrogate, with the entire Unicode 3.2 range. Those fonts are also distributed e.g. by Ricoh (google for Andale Mono WT for more details). </p>
      <p>Ascender Corp. offers <strong>Ascender Uni</strong>, a pan-Unicode monospaced font with the entire character set of Unicode 5.0. The design is similar to Andale Mono. </p>
      <p>Microsoft offers <strong>Consolas</strong>, a great monospaced design by Luc(as) de Groot that covers extended Latin, Cyrillic and Greek that has regular, italic, bold and bold italic variants (Andale Mono and Ascender Uni only have one regular weight). </p>
      <p>Regards,<br>
      A.</p>
