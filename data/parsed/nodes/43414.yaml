    html: <p>Since you will be presumably using secondary typefaces to stylize each of the different packages and in themselves will be very over-the-top and/or decorative you  might look for something simple that plays well with others. What about <a href="http://www.joshuadarden.com/shop/omnes.php" rel="nofollow">Omnes</a> or <a href="http://www.processtypefoundry.com/typefaces/bryant2/index.html" rel="nofollow">Bryant</a>? Too round?</p>
