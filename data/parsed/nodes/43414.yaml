  html: |-
    <p>I'm looking for a typeface (either for use or for inspiration) for use in a logo, some of the key words are:<br>
    nightlife, fun, party but still clean and professional. It is for a website that advertises "packages" for city nightlife, with different packages, like "punk night out", "gay night out", "glamorous night out" etc. So it can't be too this-or-that since it must work for several groups of people. Punks should like it, so should preps, glamorous high-fashionistas and so on. It's maybe vague, but anyone got any suggestions?</p>
