    html: |-
      <p>Yeah, need something that will work well with others (although we won't be able to play with the typography as much as wanted since this is a web-project, hnngh). </p>
      <p>And the fonts you mentioned where nice, and something I'll keep in mind but I do think they are a bit round, yes. Since this is "night out" it's mainly focused at young people about 20-30 that wants to go out in Oslo and have a few drinks, dance or get insanely drunk or whatever they want to, so I'm thinking something abit more... urban perhaps?</p>
