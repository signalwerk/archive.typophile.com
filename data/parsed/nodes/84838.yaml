    <p>Hello – please help identify this typeface. View it here<br>
    <a href="http://www.tumblr.com/photo/1280/9308379016/1/tumblr_lqejq6XGDf1qhyco6" title="http://www.tumblr.com/photo/1280/9308379016/1/tumblr_lqejq6XGDf1qhyco6">http://www.tumblr.com/photo/1280/9308379016/1/tumblr_lqejq6XGDf1qhyco6</a></p>
    <p>It is similar to Futura, but with the exception of the "C" and "a" characters. It has a closer feel to Caslon's Egyptian, in that the aperture of the "C" curls inwards, instead of being "cut-off" vertically as does the "C" in Futura.</p>
    <p>Please let me know if you know the name!!</p>
    <p>Also, on another note, are there any contemporary typefaces designed in a similar style to this one that you know of?!</p>
    <p>Thanks very much!<br>
    Best,<br>
    JH</p>
