      <p>I wouldn’t say Erbar. From the image, which is low quality, but it shows enough, I would say it’s Wagner &amp; Schmidt’s Kristall Grotesk, of which I am unaware if a digital version exists.</p>
      <p>Its feeling on the page is very different from Erbar, and also from Futura, especially due to the peculiar form of the lowercase [a] and other letters.</p>
