  html: <p>I use Corel 10. I just learned that you can add page numbers to the document by using Print Preview&gt;Prepress&gt;Page Numbers <br> <br>However, when the page gets printed out, the numbers are very small font size. How do I increase the font size of the page number? <br></p>
