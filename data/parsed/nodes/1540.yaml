    html: <p>&gt; How do you render half a pixel? <br> <br>1) In grayscale rendering you have fractional pixels. <br>2) In Windows the native OS resolution is 96 ppi, so some half-pixel sizes will have their own bitmaps. Specifically, 10 point rounds to 13 PPEM, 11 point to 15 PPEM, and 10.5 point to 14 PPEM. Since 96/72 is 4/3, one out of every three half-pixel sizes will have its own bitmap.  <br> <br>hhp <br></p>
