    html: <p>Hrant — in what I assume was a slip, you wrote that <span class="caps">PPEM</span> is “points per em”, which makes no sense because a 14 point font will always be 14 points per em, by deﬁnition. Of course ppem = pixels per em. TrueType font technicians use this pixel measurement all the time, and don’t think in real-world units such as points or millimetres. When an application requests a particular point size (and implicitly also a zoom <span class="amp">&amp;</span> resolution speciﬁcation), the font returned is mapped to the closest ppem size. <br><br>If you want to examine the actual pixel-tuned ppem sizes in fonts, a nice trick in <span class="caps">MS</span> Word is to set the zoom to 75%. Since 72 is 75% of 96, the point size setting will now exactly equal the ppem setting. Set some lines in consecutive point sizes, and you’ll see how the font behaves at all low resolutions. Use Ctrl-[ and Ctrl-] to whizz up <span class="amp">&amp;</span> down sizes in selected&nbsp;text.</p>
    html_clean: <p>Hrant — in what I assume was a slip, you wrote that <span class="caps">PPEM</span> is “points per em”, which makes no sense because a 14 point font will always be 14 points per em, by deﬁnition. Of course ppem = pixels per em. TrueType font technicians use this pixel measurement all the time, and don’t think in real-world units such as points or millimetres. When an application requests a particular point size (and implicitly also a zoom <span class="amp">&amp;</span> resolution speciﬁcation), the font returned is mapped to the closest ppem size. <br><br>If you want to examine the actual pixel-tuned ppem sizes in fonts, a nice trick in <span class="caps">MS</span> Word is to set the zoom to 75%. Since 72 is 75% of 96, the point size setting will now exactly equal the ppem setting. Set some lines in consecutive point sizes, and you’ll see how the font behaves at all low resolutions. Use Ctrl-[ and Ctrl-] to whizz up <span class="amp">&amp;</span> down sizes in selected&nbsp;text.</p>
