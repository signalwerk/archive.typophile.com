    html: <p>Hrant - in what I assume was a slip, you wrote that PPEM is "points per em", which makes no sense because a 14 point font will always be 14 points per em, by definition. Of course ppem = pixels per em. TrueType font technicians use this pixel measurement all the time, and don't think in real-world units such as points or millimetres. When an application requests a particular point size (and implicitly also a zoom &amp; resolution specification), the font returned is mapped to the closest ppem size. <br> <br>If you want to examine the actual pixel-tuned ppem sizes in fonts, a nice trick in MS Word is to set the zoom to 75%. Since 72 is 75% of 96, the point size setting will now exactly equal the ppem setting. Set some lines in consecutive point sizes, and you'll see how the font behaves at all low resolutions. Use Ctrl-[ and Ctrl-] to whizz up &amp; down sizes in selected text.</p>
