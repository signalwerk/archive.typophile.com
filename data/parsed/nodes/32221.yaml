    <p><strong>Linotype’s LinoLetter for March 2007 – Easter fonts</strong></p>
    <p>Check out the full version of this month's newsletter at the Linotype website: <a href="http://www.linotype.com/38-21525/issue200703.html" title="http://www.linotype.com/38-21525/issue200703.html">http://www.linotype.com/38-21525/issue200703.html</a></p>
    <p><em>Content Preview:</em> In March and April, winter comes to an end and springtime begins; it’s the time of year to celebrate! Linotype.com has just added a page full of font suggestions for Easter, and if you are searching for the proper font for your Sunday brunch invitation, look no further! Just a few weeks before Easter is another fine holiday – St. Patrick’s Day. Since uncial typefaces are most commonly associated with Ireland, we’ve brought out an emerald of our crop for this month’s newsletter: Sweeney™. And now that the Oscars have aired, March marks the beginning of a new season of movies to enjoy. Check out Linotype’s new “Movie Value Pack” – five high-quality fonts for one low price! Many renowned designers have worked closely with Linotype throughout its 120-year history, but William Addision Dwiggins was one of the first. Read more about his life, work, and legacy in a new Linotype.com Font Feature. </p>
    <p><a href="http://www.linotype.com/38-21525/issue200703.html" rel="nofollow">Read the rest of the Linoletter at Linotype.com!</a> </p>
    <p>Or, <a href="https://www.linotype.com/newsletter.html" rel="nofollow">subscribe to the Linoletter</a>, and get the information delivered every month directly to your mailbox.</p>
