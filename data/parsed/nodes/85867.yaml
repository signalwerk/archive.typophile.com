    html: |-
      <p>Hi J<br>
      I would suggest to use GREP rather than nested styles.<br>
      In Cs5 you will find it in the paragraph styles - GREP.</p>
      <p>This will give you the possibility to change the letter "P"<br>
      to a different character style. Im just trying to get you<br>
      the GREP code as well.</p>
      <p>Edit: here a code which seems to work</p>
      <p>\sP\s</p>
