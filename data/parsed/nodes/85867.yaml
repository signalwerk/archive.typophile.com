  html: |-
    <p>Hello.</p>
    <p>I'm trying to create a nested style, which would go something like this:</p>
    <p>Title P (2pm)<br>
    Title Two P (2pm)</p>
    <p>I want to apply a character style to the single character (P). </p>
    <p>I tried to do this by running no style up to 1 P, then applying the character style through 1 character. It actually worked, except when there was a "P" in the title. *See attached image.</p>
    <p>Any tips on how I could target only the single character "P" and not "P's" that show up in title names??</p>
    <p>Thanks, J.</p>
