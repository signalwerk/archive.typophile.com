    html: |-
      <p>Edited:<br>
      Opti Boutique is an accurate digitization of the metal font used in your Mexican publication.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/OptiboutiqueOrigHaasBoutiqueInUse_3530.jpg"></div><br>
      The publication used Boutique by the Haas type foundry of Switzerland or Carola Grotesk of H.Berthold and Bauer, or a metal-type era clone.<br>
      BTW the Paratype Karolla Narrow Bold, although similar, is a different design.<br>
      As for Opti fonts, they are font orphans and there is no legitimate way to acquire them.<br>
      As far as I can determine Opti Boutique was an original digitization by Opti rather than a clone of of digital work done elsewhere. Most of the Opti fonts were pirated clones.<br>
      Don<p></p>
