    html: |-
      <p>I believe this is Carola Grotesk (H.Berthold and Bauer), also known as Boutique (Haas Type Foundry), which dates from the early 20th century. </p>
      <p>The only somewhat faithful digital version (though seemingly no longer available) was from the less-than-reputable Castcraft Software Inc. under the name Boutique:<br>
      <a href="http://luc.devroye.org/fonts-27506.html" title="http://luc.devroye.org/fonts-27506.html">http://luc.devroye.org/fonts-27506.html</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Boutique_4061.png"></div><p></p>
      <p>Paratype created a version called Karolla. PT Karolla Narrow Bold comes awfully close to your sample (save for the C):<br>
      <a href="http://www.myfonts.com/fonts/paratype/karolla/" title="http://www.myfonts.com/fonts/paratype/karolla/">http://www.myfonts.com/fonts/paratype/karolla/</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Karolla_6661.png"></div><p></p>
