    html: '<p>I don’t know who did the original logo (which I assume is not based on any specific font), but in 2011 the company commissioned a custom typeface derived from the logotype: <a href="http://fontsinuse.com/typefaces/32148/adineue" rel="nofollow">AdiNeue</a>.</p>'
