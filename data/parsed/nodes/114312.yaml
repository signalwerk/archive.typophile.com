  - id: 582762
    user: 175823
    date: 2014-07-13T15:58:00
    date_raw: 13 Jul 2014 — 3:58pm
    votes: null
    html: |-
      <p>The original appears to have been a mash-up of Super Grotesk (developed by Arno Drescher in the 1930s for the Typoart foundry) and Helvetica (just the s). Though the bold version of Super Grotesk was used, its smaller round counters were not--those were enlarged to maintain an even stroke width. The ascender on the d was also truncated to the height of the i.</p>
      <p>Joancarles Casasín--the designer of AdiNeue--mentions the "100% geometrical build" and the atypical s at the link above.</p>
