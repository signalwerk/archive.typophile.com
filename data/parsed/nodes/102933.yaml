    html: <p>The combination of this art with Oo-Boodlio-Doo would have a definite Ben Shahn vibe. Oo-Boodlio-Doo is inspired by Ad Lib, designed by Freeman Craw in 1961, and it's hard to imagine Craw wasn't influenced by Ben Shahn's distinctive handlettering. <a class="freelinking external" href="http://americanculture.wustl.edu/dowd/f20_4354/fawcett/fawcett/Shahn_Chicago_Jazz_files/shapeimage_2.png" rel="nofollow">Here's an example from 1955</a>.</p>
