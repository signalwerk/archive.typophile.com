    html: <p>It's definitely possible to look to key letters or specific earmarks to help identify typefaces. This method is probably the most common. It's the basis for <em>Rookledge's International Typefinder</em> (1983). For me it's almost always an overall impression or "gestalt" that I look for. It's like recognizing a face of or a voice, the way you can recognize someone you know even if they are in disguise. The drawback of my method is I can't identify any typefaces I don't know. One thing I can say is "I" and "O" are almost no help at all. :-)</p>
