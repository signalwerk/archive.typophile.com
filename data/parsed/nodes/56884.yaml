    html: |-
      <p>@Edward Long:<br>
      <cite>While Times New Roman is "obvious", I struggle to find letters which give it away. Maybe the weird stress on the lowercase e or the not-very-italic-ness of the italic z.</cite></p>
      <p>The italic z is what's needed to distinguish the Monotype and Linotype versions of the typeface. I find that the uppercase L differentiates Times from many serif typefaces. Given what makes it "obvious", lowercase letters like b, that give away its x-height and its oblique stress, are perhaps the best bet; except for the capital Q, which it shares with some sizes of Caslon and several other typefaces, it indeed has no eccentric letter forms.</p>
