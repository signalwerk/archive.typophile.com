    html: |-
      <p>The lowercase g is certainly the most variable form from one typeface to another and probably gives the most clue to identification, but apart from stroke weight it can have very little relation to the rest of a typeface. </p>
      <p>One lowercase h can look much like any other, but it has the detailed features of serifs and straight and arcing strokes that are replicated throughout much of the rest of the alphabet, and thus one can make a well reasoned guess at what the rest of a typeface might look like based on the h much more than you could with a g.</p>
      <p>So, if one were to compare this to evidence gathering on a person, a g would be equivalent to a typeface's fingerprint, while the h would be like finding its skull.</p>
