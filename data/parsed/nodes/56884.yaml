    html: |-
      <p>I find lowercase y is the first letter I look at. Very distinctive in Minion, Centaur, Bembo Italic, Bliss and Perpetua. After that I probably go to lowercase t, which is distinctive in Arial, Gill Sans, Helvetica, Palatino, Scala, Georgia and, again, Minion. Lowercase g gives away Goudy Old Style, Meta, Baskerville and Perpetua Italic. Capital R is quite good for distinguishing sans and also sticks out a long way in Bembo and Trajan.</p>
      <p>While Times New Roman is "obvious", I struggle to find letters which give it away. Maybe the weird stress on the lowercase e or the not-very-italic-ness of the italic z.</p>
    html_clean: |-
