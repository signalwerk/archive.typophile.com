  html: <p>Hi Y'all, <br> <br>I am looking for some great type people to come talk to our graphics students at CCSF in the Spring 05 semester. <br> <br>How about you? <br> <br>There would be little to no compensation, but you would have the opportunity to influence and inspire our students. <br> <br>The ideal speaker would be able to speak about issues of wide appeal to graphic designers, or would be accomplished enough to have a large body of their own work to show. Forming a panel of speakers is also a possibility. <br> <br>Let me know if you are interested. <br> <br>Thanks! <br> <br>Amy</p>
