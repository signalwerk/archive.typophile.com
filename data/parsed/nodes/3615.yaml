    html: <p>You know, I just finished combining a postscript italic with a swash italic to make a new Opentype font with Fontlab. I added  swash, ligature, discretionary ligs and alt forms features.  <br> <br>I hadn't done this before, I'm not a type designer or a programmer - I'm a puppeteer for goodness sake - and, from start to finish it took me about 8 hours. Now that I've flatten that learning curve a bit, I figure I could do another one in less than four hours.  <br> <br>Given all the time that goes into a typeface, the extra time seems minimal.</p>
