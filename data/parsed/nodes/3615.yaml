    html: <p>James, <br> <br><i>Since most authors of digital fonts not only have designed the work, but has also produced it, they are entitled to a majority of the income. What risk does the reseller assume in this model? One can argue that the author is taking a bigger risk by entering into the agreement.</i> <br> <br>This is good point, also in our case we have a proven product. Well advertised by ourselves. Some of which have been common currency in North American trade markets for 100 years. We are speaking of market proven products. People buy them. Believe me. <br> <br>I suppose the only thing that might be said about our fonts in their present state is they are preparing themselves for OpenType. In addition I more aware of the subtle aspects of European accents. Especially Scandinavian accents. So some of these issues are getting addressed. These are improvements under way. That said, the accent issue is nothing many American foundries should be proud of. <br> <br>And please, remember I am against OpenType so don't tell anyone what we are doing. OK.</p>
