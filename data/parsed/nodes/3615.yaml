  - id: 27673
    user: 1947
    date: 2004-03-16T05:20:00
    date_raw: 16 Mar 2004 — 5:20am
    votes: null
    html: <p>Hypothetically speaking, any royalty arrangement that gives the author of the work a minority share is still based in an antiquated manufacturing model.  <br> <br>If the reseller took a design from an author and had to invest time and money to manufacture the product, well, they are the ones taking the calculated risk, and are entitled to the majoirity of the income. <br> <br>Since most authors of digital fonts not only have designed the work, but has also produced it, they are entitled to a majority of the income. What risk does the reseller assume in this model? One can argue that the author is taking a bigger risk by entering into the agreement. How much promotion is worth giving away 35, 45, or 50 percent? Or more. And will your fonts get lost in the mass promotion of a typical reseller? <br> <br> <br> <br></p>
    html_clean: <p>Hypothetically speaking, any royalty arrangement that gives the author of the work a minority share is still based in an antiquated manufacturing model.  <br> <br>If the reseller took a design from an author and had to invest time and money to manufacture the product, well, they are the ones taking the calculated risk, and are entitled to the majoirity of the income. <br> <br>Since most authors of digital fonts not only have designed the work, but has also produced it, they are entitled to a majority of the income. What risk does the reseller assume in this model? One can argue that the author is taking a bigger risk by entering into the agreement. How much promotion is worth giving away 35, 45, or 50 percent? Or more. And will your fonts get lost in the mass promotion of a typical reseller? <br> <br> <br> <br></p>
  - id: 27674
    user: 2094
    date: 2004-03-16T07:24:00
    date_raw: 16 Mar 2004 — 7:24am
    votes: null
    html: <p>All of these are good points. Early offers paid smaller percentages, ITC for instance, but in that case we got a "most favourable up front signing fee", they did all the work. ITC made a big event of a new releases. This was not exclusive. We released our own version of the same title, same artwork. <br> <br>The other option would have been to sub-license the font back. <br> <br>Another company paid $5000.00 up front. Another $20,000 but they only paid a "dime" (their verbiage) per font. However they guaranteed 200,000 fonts would be sold. Add that up, pretty good deal.  <br> <br>These were strictly signing fees and were never subtracted from royalties. Only one of them was exclusive. <br> <br>My thoughts are that resellers are a "thing" soon to be of the past. Either that, or the type designers. How can a type designer make a living from 25%, giving an exclusive, with no guarantee? <br> <br>Risky business, no stupid. <br></p>
    html_clean: <p>All of these are good points. Early offers paid smaller percentages, ITC for instance, but in that case we got a "most favourable up front signing fee", they did all the work. ITC made a big event of a new releases. This was not exclusive. We released our own version of the same title, same artwork. <br> <br>The other option would have been to sub-license the font back. <br> <br>Another company paid $5000.00 up front. Another $20,000 but they only paid a "dime" (their verbiage) per font. However they guaranteed 200,000 fonts would be sold. Add that up, pretty good deal.  <br> <br>These were strictly signing fees and were never subtracted from royalties. Only one of them was exclusive. <br> <br>My thoughts are that resellers are a "thing" soon to be of the past. Either that, or the type designers. How can a type designer make a living from 25%, giving an exclusive, with no guarantee? <br> <br>Risky business, no stupid. <br></p>
