  - id: 27680
    user: 2094
    date: 2004-03-17T03:46:00
    date_raw: 17 Mar 2004 — 3:46am
    votes: null
    html: <p>John, <br> <br>Look I agree, eight hours is not long. But when you spend eight hours for 90 days re-working your library you would be inclined to think otherwise. <br> <br>Why bother propping up the underpinnings of monolithic corporations and their crippled applications that can't handle the real basics of type in the first place. For instance, rubber type, what's that all about? These programs were planned by strippers and photo comp folk, not by people that really knew anything about type. <br> <br>Besides, how long do your think the customer will say, gee look at this, I have magic ligatures? Not long. They will just take it all for granted. For that matter, these trained fonts, with their nifty gimmicks will make redundant highly skilled typesetters. Now, wait just a minute, where have they gone now? <br> <br>It further erodes the already over stressed economics of type design by increasing their work load without compensation. In the end type designers will all be eating out of dumpsters. <br> <br>You hear people saying, "save the farmers," "save the fisherman". When do you expect a public outcry of "save the type designer". Never, that's when, never. <br> <br>What happened to photographers after all those "stock art photographs" drove them into poverty. Next time you walk down the street and tell me what you see, bums, winos,  your future before you if you make OpenType fonts. <br> <br>Don't you care about your children. Your self respect?  <br> <br>Your wine decisions will be made by how many beer bottles you find. <br> <br>Here we are all busy working ourselves out of employment, already the children of photographers and typesetters are suffering from malnutrition, teeth rotting, living with street rats. Think about it. <br> <br>But, oh no, we are going to work even harder to reduce the already few jobs to be found for our fellow workers. <br> <br>That's it, lets unionize. <br> <br>By the way, can I stay at your house tonight? <br></p>
