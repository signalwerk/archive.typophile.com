    html: <p>I've just started to develop Typefaces, and I've never used OpenType (I'm still in the Fontographer stage). <br> <br>But, since I haven't developed oodles of old faces that would have to be updated for the new technology, I'm impressed with the new possibilities that are seemingly available with OpenType. I'd like to work with it. <br> <br>How is this technological advance different from previous ones? Does everyone hate change (and the reworking it requires) once they reach a certain stage of comfort/success?</p>
