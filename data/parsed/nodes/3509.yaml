    html: <p>It's probably an older version of Normande. Both Haas and Bauer had versions of it in metal. The version in my old Formatt (cut-out type) catalog, for example, looks closer to your sample than the Bitstream version in your link. I'm not sure which foundry's version it is, though. The Bitstream version may be as close as you're going to get without drawing it yourself.</p>
