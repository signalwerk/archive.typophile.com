    html: <p>How about the <a href="http://www.philsfonts.com/detail.html?sku=BQ90084001P1" target="_blank">Berthold Normande</a>?  Sometimes Bitstream's versions may be a bit different. I think this looks very much like the sample, and I think you need to allow for the fact that black on white looks different than the reverse.</p>
