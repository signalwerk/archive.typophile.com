  html: <p>On my search for a match to the font bellow (sample is from '86) I've come to as close as Bitstream's <a href="http://www.myfonts.com/fonts/bitstream/normande/" target="_blank"> Normande</a>. Yet, as not too sure whether it is indeed Normande (particularly the "L", the "E" and the "P" keep me in doubt) or actually may perhaps be an other font, I would appreciate the opinion of you... (Then again, could it be that those which appear to me as being differences between those letters in the pic and in the <a href="http://www.myfonts.com/fonts/bitstream/normande/normande/testdrive.html?s=SOUL%2BDEEP&amp;p=36" target="_blank"> test-drive</a> may just result from the quality of the scan itself, and maybe I'm paying too much attention to such details?...) <br> <br><img src="http://www.typophile.com/forums/messages/83/28178.gif" alt=""></p>
  html_clean: <p>On my search for a match to the font bellow (sample is from '86) I've come to as close as Bitstream's <a href="http://www.myfonts.com/fonts/bitstream/normande/" target="_blank" class="link-external"> Normande</a>. Yet, as not too sure whether it is indeed Normande (particularly the "L", the "E" and the "P" keep me in doubt) or actually may perhaps be an other font, I would appreciate the opinion of you... (Then again, could it be that those which appear to me as being differences between those letters in the pic and in the <a href="http://www.myfonts.com/fonts/bitstream/normande/normande/testdrive.html?s=SOUL%2BDEEP&amp;p=36" target="_blank" class="link-external"> test-drive</a> may just result from the quality of the scan itself, and maybe I'm paying too much attention to such details?...) <br> <br><img src="http://www.typophile.com/forums/messages/83/28178.gif" alt=""></p>
