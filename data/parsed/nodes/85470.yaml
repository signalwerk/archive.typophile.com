    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Web Fonts 900 sm_4737.JPG"></div><p></p>
    <p><strong>Monotype Imaging Adds 10 Collections and Over 900 Web Fonts to Fonts.com Web Fonts<strong></strong></strong></p>
    <p>Monotype Imaging Holdings Inc., a leading global provider of text imaging solutions, has expanded <a class="freelinking external" href="http://webfonts.fonts.com/en-US" rel="nofollow">Fonts.com Web Fonts</a> with the addition of over 900 fonts, including collections from 10 typeface foundries new to the site and new designs from the company's Monotype®, Linotype® and ITC® libraries. More than 12,000 Web fonts are now available from Monotype Imaging's Web font service. </p>
    <p>"We're continually widening our range as part of our commitment to offering the world's best and biggest selection of Web fonts," said Chris Roberts, vice president and general manager of e-commerce at Monotype Imaging. "Whether the need is for a font that brands or a font that personifies, we're here to answer the diverse demands for typefaces for the Web." </p>
    <p>New foundry collections offer diversity that spans a wide range of Web design possibilities. The Calligraphics collection from Paul Veres features the Gargoyle™ family, an informal, friendly typeface. MyChristie from Christie Podioti brings the Noisetoy™ font, an experimental, art deco design. PeGGO Fonts, the foundry of Pedro González, features the Legan™ typeface, a Trajan®-inspired design, and the PintassilgoPrints foundry, with the works of Ricardo Marcin and Erica Jung, offers handwriting fonts including the condensed, casual Amarelinha™ design. The Sardiez foundry from Sergio Ramírez brings the futuristic Systopie™ family, and Suomi, the foundry of Tomi Haaparanta, offers the round, yet narrow Titillation™ face. Grummedia, featuring the designs of Graham Blakelock, includes the Fifteen 36™ face, inspired by 16th century Italian texts. Ray Cruz brings the curvaceous Bandolera™ display face, and Boover Software rounds out the new foundry collections with a series of fraction fonts. </p>
    <p>Fonts.com Web Fonts has also been expanded with designs from Monotype Imaging's own foundry offerings. Additions from the Monotype collection include the Augusta™ family, a calligraphic design by Julius de Goede. New Linotype offerings include the Helvetica® monospaced family from the popular Helvetica suite, in addition to the Cyrillic version of the Neue Frutiger® design and an Arabic version of the DIN Next™ face. New from ITC is the ITC Adderville™ typeface, a sans serif design created by Monotype Imaging's George Ryan. </p>
    <p><strong>About Fonts.com Web Fonts<strong> </strong></strong></p>
    <p>Monotype Imaging's Fonts.com Web Fonts solution enables thousands of high-quality fonts to be used in Web page design. Typefaces include some of the world's most renowned designs used in branding and advertising, such as the Helvetica, Frutiger and Univers® faces, available as Web fonts exclusively from Fonts.com Web Fonts. Typefaces are added on an ongoing basis from the company's Monotype, Linotype and ITC font collections, in addition to fonts from contributing type foundries and independent designers. </p>
    <p>Three subscription plans are available: free, standard and professional. The no-fee plan includes more than 3,000 fonts that can be used on an unlimited number of websites for up to 25,000 page views per month. Both the standard and professional plans provide access to more than 12,000 fonts and feature several flexible page view allowance options, starting at $10 and $100 per month, respectively. In addition to a self-hosting option, professional tier subscribers may also receive up to 50 "desktop downloads" each month — fonts that can be used for the creation of Web page mockups in applications such as Adobe® Photoshop® and Illustrator® software. Complete details and pricing are available at Fonts.com Web fonts. </p>
    <p>Monotype Imaging's Web font service complies with W3C (World Wide Web Consortium) specifications for deploying server-based fonts and supports all major browsers. </p>
    <p>Fonts.com Web Fonts is also accessible from the homepage of <a class="freelinking external" href="http://www.fonts.com/" rel="nofollow">Fonts.com</a>, which offers more than 160,000 font products. Included are the downloadable versions of Monotype Imaging's latest Web font additions, which may be licensed separately for use in desktop applications. </p>
    <p><strong>About Monotype Imaging<strong> </strong></strong></p>
    <p>Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers, page description language interpreters, printer user interface technology and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype, Linotype and ITC typeface libraries — home to some of the world's most widely used designs, including the Times New Roman®, Helvetica and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Linotype is a trademark of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Helvetica, Frutiger and Univers are trademarks of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. DIN Next is a trademark of Linotype GmbH and may be registered in certain jurisdictions. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic and ITC Adderville are trademarks of International Typeface Corp. and may be registered in certain jurisdictions. Gargoyle is a trademark of Calligraphics. Noisetoy is a trademark of MyChristie. Legan is a trademark of PeGGO Fonts. Amarelinha is a trademark of PintassilgoPrints. Systopie is a trademark of Sardiez. Titillation is a trademark of Suomi Type Foundry. Fifteen 36 is a trademark of Grummedia. Bandolera is a trademark of Ray Cruz. Augusta is a trademark of Julius de Goede and may be registered in certain jurisdictions. Adobe, Trajan, Photoshop and Illustrator are trademarks or registered trademarks of Adobe Systems Inc. in the U.S. and/or other countries. All other trademarks are the property of their respective owners. © 2011 Monotype Imaging Inc. All rights reserved.</p>
