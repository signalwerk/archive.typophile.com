      <p>In payment terms (shouldn't that be a lowercase p) the numerals aren't aligning and the grand total doesn't seem to align with hk$ and the numerals, I think you have a double word space in extra cost. And the tint rules for the job description section could align with the dotted rules. You will also need to standardise the punctuation and uppercase in the remarks section.<br>
      If you can create an excel file that keeps the look you want it would seem to me that it would be the sensible way to go.<br>
      Tim<br>
