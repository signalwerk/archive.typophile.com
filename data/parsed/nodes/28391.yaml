      <p>Nothing wrong with posting business documents. </p>
      <p>I know some people who do everything via PDF, but then they keep the "bookkeeping" part of it in a book after the fact. I'd think you would be happier using some sort of business software that can help you manage your books at the same time without having to keep a paper trail. (Although a paper trail is a good way to have secondary proof of something.)</p>
