    <p>Here's the opening spread from Machiavelli's 1506 Decemnale (first edition.) The typeface looks to be a Jenson or a close relative thereof. I'm looking for a font that matches the look of this letterpressed text. <a href="http://www.myfonts.com/fonts/grummedia/fifteen36/" rel="nofollow">Fifteen36</a>  looks very promising, but I am concerned that there's no bold, italic, or small caps. I'd prefer to buy a font family that would give me the most flexibility. P22's <a href="http://www.p22.com/sherwoodtype/mayflower.html" rel="nofollow">Mayflower</a>  is a nice looking font, but I'm fairly certain I will go to hell for using a typeface from 1610 in a book about Machiavelli (1469-1527.) Plus it's not Venetian, Florentine or anything else. </p>
    <p>Any suggestions for a nice antiqued Roman font from Machiavelli's era?</p>
    <p>Thanks,<br>
    Don</p>
