      <p>The P22 Morris looks very close to what I'm looking for. (Thank you for the pointer, by the way) It may be the font I choose, but before I shell out for it, I want to make sure I'm not missing anything.</p>
      <p>It doesn't have to be a Jenson variation, I'm definitely willing to "swing farther afield." It just needs to be based on a Renaissance form, and it needs to be antiqued, so it has the appearance of being printed by letterpress (like the P22 Morris you pointed out.) For example, <a href="http://www.p22.com/ihof/telegdi.html" rel="nofollow">Telegdi</a> is another I considered, but rejected because it is <em>too</em> distressed.</p>
