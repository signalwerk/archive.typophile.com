      <p>I hope it is not a breach of etiquette to resurrect a thread this old, but I wanted to thank the people who gave such good advice and to point you toward the fruit of my labors. I'm releasing my <a href="http://donmacdonald.com" rel="nofollow">Machiavelli graphic novel</a> online on my web site.</p>
      <p>As I wrote above, I took Miss Tiffany's advice and am using Morris Golden for captions and titles and Operina Pro for dialogue. But even here I am indebted to you, for it was in poking around P22's site that I found Operina. I had experimented with a few different type treatments before coming here, but it was your advice which helped form an critical part of <em>Machiavelli'</em>s visual style.</p>
      <p>So thank you.</p>
      <p>—Don</p>
