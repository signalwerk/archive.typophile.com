      <p>Tiffany, the P22 Morris Golden looks very close to what I'm looking for (though still missing a bold or italic) I already own Adobe's Jenson Pro, so I'm covered there, but for this specific project, I need a font (like the P22 Morris Golden) which is antiquated.</p>
      <p>I tried using Adobe Jenson, but the problem is a modern font rendered with razor sharp accuracy (like LTC Jenson or Golden Type) seems to float above my drawings. The organic look of a period typeface integrates much better with my pen &amp; ink artwork. Even the clearest line I can make with a quill pen can't match the precision of Adobe or LTC Jenson.*</p>
      <p>* well, technically, I probably could, if I were using the smoothest hot press watercolor paper or Bristol board, but in this project I'm not.</p>
