    html: |-
      <p>I would drop the dots, they don't help with the website address and the name itself is already naturally FD STIL because of the ligatured letters.</p>
      <p>However I think what you have has the potential of being iconic. The only concern I have about it is that the 'F' may read as an A so may need squaring up, in that case you would square up the 'L' too.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/fdstil_5465.gif"></div><p></p>
      <p>(By the way, the second one is just the first one with sharp corners rounded.)</p>
      <p>The one remaining reservation I have is that the letters are perhaps too heavy to adequately represent the industry that you are in which is altogether more refined! (This mark could easily be an engineering firm.)</p>
      <p>Interesting challenge you've got there.</p>
