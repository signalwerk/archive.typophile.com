    html: <p>Very interesting. When I started this thread I was thinking of the fact that the client really likes Palatino, and that my art director is a Garamond no. 3 type of guy. Since that's where my head was at your suggestions initially came as a surprise. Don't get me wrong, I understand the reasoning behind your suggestions. I'm just wondering if I should be considering using an old style font for most of the text, with "period" fonts for initial caps, heads, subheads, etc. Is this a "cop out"? I'm interested in your reactions. <br> <br>I'm anxious to get my hands on copies of the images, to become more familiar with the look of the material (seen briefly in a meeting yesterday). And I agree, Mark, that it would be a good idea to do some research into the books of the period. Thanks.</p>
