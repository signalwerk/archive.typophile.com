    html: <p>And of course designs from the late 1800s did not necessarily use fonts specifically created in that era. My impression of VIctorian design is really of mixing disparate fonts and dingbats. There were a lot of frilly fonts used with intricate dingbats and also blockier fonts based on wood type. <br> <br>There have been plenty of fonts created in the 20th century which faithfully reproduced the look of "bygone days". T-26 created the Toulouse Lautrec family in the late 90s to recreate art nouveau fonts.</p>
