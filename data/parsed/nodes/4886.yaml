    html: <p>"Antique" faces similar to  <a href="http://www.myfonts.com/fonts/spiecegraphics/zinc-italian-sg/" target="_blank">Bruce Old Style</a> were popular, as was <a href="http://www.myfonts.com/fonts/bitstream/de-vinne/" target="_blank">De Vinne</a> and <a href="http://www.myfonts.com/fonts/bitstream/egyptian-710/" target="_blank">Egyptian</a>. Faces like Egyptian would often be used as a boldface for De Vinne or Bruce Old Style. Ronaldson was also popular. Unfortunately, the closest thing available to it today is <a href="http://www.myfonts.com/fonts/linotype/itc-tiffany/" target="_blank">Tiffany</a>, which doesn't really have the same antique feel (unless you're talking about 1970s antiques :-). Faces like the original (non-ITC) <a href="http://www.myfonts.com/fonts/bitstream/bookman/" target="_blank">Bookman</a> and <a href="http://www.myfonts.com/fonts/bitstream/itc-cushing/" target="_blank">Cushing</a> were common. Also <a href="http://www.myfonts.com/fonts/urw/romana/" target="_blank">Romana</a>. I've got a children's history book from 1889 that uses <a href="http://www.myfonts.com/fonts/urw/art-gothic/" target="_blank">Art Gothic</a> for section headings. Jonathan Hoefler's <a href="http://www.typography.com/catalog/knockout/series_e.html" target="_blank">Knockout Series</a> would not feel out of place. <br> <br>Of course, it's not just the type choices, but how you set them. I would recommend getting hold of or at least looking at books from the late 1800s to get layout ideas.</p>
