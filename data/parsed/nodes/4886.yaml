    html: <p>Palatino is from about 1950 and was inspired by Renaissance calligraphy. It's definitely not a look I would ever associate with the late nineteenth century. Similarly, Garamond's fonts were made in the 1600s and were not revived until the 1920s. <br> <br>The late nineteenth century was big on "antiques," which evolved from Caslon's types, and moderns, such as De Vinne. (Caslon's original faces, which were from the 18th century, were not popular again until they were revived the early 20th century.)  <br> <br>Old style, in the sense usually meant today, meaning things like Bembo, Jenson, Garamond, Caslon, etc., is a very 20th-century thing. Even a lot of the moderns, like Bodoni and Dido, and transitionals, like Baskerville and Bulmer, were out of style by the late 19th century and didn't make a comeback until the 1920s. Most of the faces we call "old style" now were considered obsolete in the late 1800s. <br> <br>If you look at books and other things published back then you will see what I mean.</p>
    html_clean: <p>Palatino is from about 1950 and was inspired by Renaissance calligraphy. It's definitely not a look I would ever associate with the late nineteenth century. Similarly, Garamond's fonts were made in the 1600s and were not revived until the 1920s. <br> <br>The late nineteenth century was big on "antiques," which evolved from Caslon's types, and moderns, such as De Vinne. (Caslon's original faces, which were from the 18th century, were not popular again until they were revived the early 20th century.)  <br> <br>Old style, in the sense usually meant today, meaning things like Bembo, Jenson, Garamond, Caslon, etc., is a very 20th-century thing. Even a lot of the moderns, like Bodoni and Dido, and transitionals, like Baskerville and Bulmer, were out of style by the late 19th century and didn't make a comeback until the 1920s. Most of the faces we call "old style" now were considered obsolete in the late 1800s. <br> <br>If you look at books and other things published back then you will see what I mean.</p>
