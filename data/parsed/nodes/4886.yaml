    html: "<p>Because Bulmer's design is really older, here are some other text type suggestions: <a href=\"http://www.myfonts.com/fonts/bitstream/cheltenham/\" target=\"_blank\">Cheltenham</a> designed in 1896-1902 by Bertram Goodhue, and refined by M.F. Benton in the next 2 years; or <a href=\"http://www.myfonts.com/fonts/linotype/golden-type-ef/\" target=\"_blank\">Golden Type</a>, originally designed in 1892 by W. Moris. The latter has SC and OSF versions.  'Chelt' was such a widespread favorite by the early 20th century, all printers had it in their inventories, so it's a very characteristic style of that era. <br> <br>(BTW, it's nice to be back from vacation, I must say).</p>"
    html_clean: "<p>Because Bulmer's design is really older, here are some other text type suggestions: <a href=\"http://www.myfonts.com/fonts/bitstream/cheltenham/\" target=\"_blank\" class=\"link-external\">Cheltenham</a> designed in 1896-1902 by Bertram Goodhue, and refined by M.F. Benton in the next 2 years; or <a href=\"http://www.myfonts.com/fonts/linotype/golden-type-ef/\" target=\"_blank\" class=\"link-external\">Golden Type</a>, originally designed in 1892 by W. Moris. The latter has SC and OSF versions.  'Chelt' was such a widespread favorite by the early 20th century, all printers had it in their inventories, so it's a very characteristic style of that era. <br> <br>(BTW, it's nice to be back from vacation, I must say).</p>"
