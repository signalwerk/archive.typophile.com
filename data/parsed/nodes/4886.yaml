    html: <p>According to American Metal Typefaces of the Twentieth Century, all those numbered Old Style faces have their origins in the late nineteenth century, and that Old Style No. 7 was a copy of an older foundry face adapted for machine composition. So I think it would work, even though technically it was released later. <br> <br>If you go earlier into the nineteenth century, you would find stuff more along the lines of <a href="http://www.myfonts.com/fonts/linotype/bulmer-mt/" target="_blank">Bulmer</a> and <a href="http://www.myfonts.com/fonts/linotype/scotch/" target="_blank">Scotch Roman</a> (Matthew Carter's <a href="http://www.myfonts.com/fonts/fontbureau/miller/" target="_blank">Miller</a> is a modern interpretation of this). Also, you start getting into "fat faces" like <a href="http://www.myfonts.com/fonts/linotype/thorowgood-ef/" target="_blank">this</a> and egyptians like <a href="http://www.myfonts.com/fonts/fontbureau/giza/" target="_blank">this</a>.</p>
