  html: |-
    <p>Ascender Corporation is a provider of advanced font products specializing in type design, font development and licensing. Ascender’s founders <a href="/node/add/wiki?edit%5Btitle%5D=Bill%20Davis" title="Create node &quot;Bill Davis&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Bill Davis</a>, <a href="/node/16223" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Steve Matteson</a>, <a href="/node/13646" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Thomas Rickner</a>, and many others are font industry veterans and have been involved in developing fonts used in computers, phones and many other hardware <span class="amp">&amp;</span> software products. Ascender provides multilingual, custom font development. Ascender also offers high quality fonts for download from the Ascender Font Store&nbsp;website.</p>
    <p><a href="http://www.ascendercorp.com">www.ascendercorp.com</a></p>
