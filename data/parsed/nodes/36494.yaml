    <p>Ascender Corporation is a provider of advanced font products specializing in type design, font development and licensing. Ascender's founders <a href="/wiki/Bill%20Davis" class="freelinking" rel="nofollow">Bill Davis</a>, <a href="/wiki/Steve%20Matteson" class="freelinking" rel="nofollow">Steve Matteson</a>, <a href="/wiki/Thomas%20Rickner" class="freelinking" rel="nofollow">Thomas Rickner</a>, and many others are font industry veterans and have been involved in developing fonts used in computers, phones and many other hardware &amp; software products. Ascender provides multilingual, custom font development. Ascender also offers high quality fonts for download from the Ascender Font Store website.</p>
    <p><a href="http://www.ascendercorp.com" title="www.ascendercorp.com">www.ascendercorp.com</a></p>
