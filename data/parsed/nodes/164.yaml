    html: |-
      <p>So instead of cycling through Northern Ontario as I'd planned, circumstances caused my bike to become acquainted with the fender of a police truck, and a fragment of my front tooth to become acquainted with the inside of my lip. So I've spent my summer break redrawing Hamfist and trying to make it not as gimpy and ugly as I currently am. At least I wasn't attacked by a moose.  <br><img src="http://www.typophile.com/forums/messages/29/12496.gif" alt=""> <br>The general aim's been to make it more consistent as far as both the stroke weight and size of the serifs go. And I ditched all the fruity curvy stuff in the italic face - except the descending leg on the u/c R. I also decided I was going at this arse-in-front by doing a semi-serif first, so I put all the serifs back, and I figure I might make a semi version after this one's done. That makes more sense all the sudden. But maybe it's the pain-killers. <br> <br>But a few questions about widths: (1) are the italic l/c b, d, p, and q too wide; or (2) are the italic l/c c and e to narrow; or (3) both; (4) are the l/c r and t too wide/narrow respectively; and (5) is the u/c N too narrow? And (6) is the u/c G really ugly? <br> <br>I've only just started setting the spacing - not with FontLab's algorithms this time - but, in general, are there any opinions as to whether is too tight/too loose? Here's a PDF too: <br></p>
