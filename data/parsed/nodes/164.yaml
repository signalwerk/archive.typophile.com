    votes: null
    html: "<p>The bouquet is wonderful. But next time, send some of that 80-proof instead. <br> <br>The \"weight problem\" might be hinting: what output are you looking at? <br> <br>The caps do seem dark. <br> <br>Smallcaps: I think the height could be a hair greater, but more than that you might make them a lot wider too. This is actually common practice. But don't ask me why... Maybe it pulls them away from the lc. Or maybe that makes them look better in mixed setting with full-caps. (Although this latter application of smallcaps is about a common as a... something or other.) <br> <br>hhp <br></p>"
    html_clean: "<p>The bouquet is wonderful. But next time, send some of that 80-proof instead. <br> <br>The \"weight problem\" might be hinting: what output are you looking at? <br> <br>The caps do seem dark. <br> <br>Smallcaps: I think the height could be a hair greater, but more than that you might make them a lot wider too. This is actually common practice. But don't ask me why... Maybe it pulls them away from the lc. Or maybe that makes them look better in mixed setting with full-caps. (Although this latter application of smallcaps is about a common as a... something or other.) <br> <br>hhp <br></p>"
  - id: 791
    user: 1026
    date: 2003-06-05T14:36:00
    date_raw: 5 Jun 2003 — 2:36pm
    votes: null
    html: <p>Cyber-booze, eh? What a great idea. <br> <br>I'm looking at printed samples from an ancient HP Laserjet 4M. I wouldn't think that 600dpi output would be prone to such distortions due to hinting, but what do I know? ;-) <br> <br>I'll give the wider small caps a shot. These were just scaled down from the normal caps, and then adjusted to match the weight of the lower case. <br> <br>So, my work's cut out for this weekend - I'll post another sheet when I lighten the caps the widen the small caps. <br> <br>Thanks again.</p>
