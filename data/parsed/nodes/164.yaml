      <p>Oi. So I've started in small caps. I've noticed that some characters (notably the l/c "o") seem too thin at small sizes, and just fine at larger ones. Is that normal? Or is it just a product of my bad hinting? I also can't seem to keep my hands off of the figures - alternately they seem too light and then too heavy. On this PDF, they're leaning towards the too heavy side I think. And are the upper case, across  the board, too heavy for the lower case maybe? I can't tell anymore. Perhaps it's time to look at something else. Cheers. <br> <br></p>
