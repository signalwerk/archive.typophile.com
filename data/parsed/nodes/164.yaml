    date: 2003-06-05T14:44:00
    date_raw: 5 Jun 2003 — 2:44pm
    votes: null
    html: <p>You need 1200dpi to avoid obvious bad-hinting artefacts for normal reading text (like 9-11 point). And the smaller the point size, the greater resolution you need. At 2400 you have nothing to worry about for any size. <br> <br>hhp <br></p>
    html_clean: <p>You need 1200dpi to avoid obvious bad-hinting artefacts for normal reading text (like 9-11 point). And the smaller the point size, the greater resolution you need. At 2400 you have nothing to worry about for any size. <br> <br>hhp <br></p>
