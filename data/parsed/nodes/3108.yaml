    <p>Hi everyone, <br> <br>I'm trying to identify the font in the following images.  The images are from a set of logs on our website and on our company cards.  they were designed by a local graphics design company which went out of business several years ago and their graphic design staff have (as far as we can discern) left the country so we are unable to simply ask the designers what it is! <br> <br>I have been using any online ID tools i can find in my attempts to ID this font and most recently Mike Yanega of Bowfin Printworks' ID tool.  He suggested i post here as he is sure you people will be able to cast your experienced eyes over it and say what it is. I'm hoping, nay preying, he's right. <br> <br>Push comes to shove i'm prepared to sit down with what i've got, download a font authoring tool and over the weekend emerse myself in redesigning the font type from scratch if necessary so any help with that would also be good. <br> <br>I've setup this account with my work address but if you have a 100% sure ID on the font you can email me at home over the weekend (it's friday afternoon here now) at <a href="mailto:giant@paradise.net.nz">giant@paradise.net.nz</a> <br> <br>Cheers <br> <br>Dean Lawrie <br>Webmaster <br>waymark solutions  <br>Wellington <br>New Zealand <br> <br><!--attachment: FontSample1-26428.unk*attachment_icon.gif*image/bmp*101.5*waymark+font+sample+1*FontSample1%2ebmp --></p><center><br>
