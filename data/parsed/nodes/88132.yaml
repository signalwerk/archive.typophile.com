    <p>I 'd like to thank you all for your valuable feedback on the initial presentation of Find my Font, about 3 month ago here:<br>
    <a href="http://typophile.com/node/84965" title="http://typophile.com/node/84965">http://typophile.com/node/84965</a></p>
    <p>In fact, many of the features added in our new release 2.3.01, are based in your comments and much more of your comments are also carefully examined and prioritized for a future release. Many thanks for that!</p>
    <p><strong>So, what's new in Find my Font v2.3.01?</strong></p>
    <p><strong>1. Minor improvements on Font Image Identification &amp; UI</strong></p>
    <p><a class="freelinking external" href="http://www.findmyfont.com/images/stories/fmf/screenshots/FMF-Win-Connected-Letters.png" rel="nofollow"><img src="http://www.findmyfont.com/images/stories/fmf/screenshots/FMF-Win-Connected-Letters_sm.png" alt="Find my Font Screenshot 2"></a><br>
    <a class="freelinking external" href="http://www.findmyfont.com/images/stories/fmf/screenshots/FMF-Win-Connected-Letters.png" rel="nofollow">click for bigger image</a></p>
    <p><strong>(a)</strong> Improvement in font matching speed<br>
    <strong>(b)</strong> Matching list shows more similar fonts<br>
    <strong>(c)</strong> Added Horizontal &amp; Vertical splitters to the 4 main screen areas<br>
    <strong>(d)</strong> Added context sensitive menu (right click) on all font lists to:<br>
    Open / Locate font file / Install font / Browse for Specific Family / Copy font name / Copy font path<br>
    <strong>(e)</strong> More accurate remaining time estimate<br>
    <strong>(f)</strong> Added font's copyright info in font details area<br>
    <strong>(g)</strong> Fixed screen capture bug on Mac OS/X Lion<br>
    <strong>(h)</strong> Made Splitter tool Sticky, to perform multiple cuts</p>
    <p><strong>2. New feature: Browse fonts by Visual Similarity</strong></p>
    <p><a class="freelinking external" href="http://www.findmyfont.com/images/stories/fmf/screenshots/FMF-Win-Browse.png" rel="nofollow"><img src="http://www.findmyfont.com/images/stories/fmf/screenshots/FMF-Win-Browse_sm.jpg" alt="Find my Font Screenshot 2"></a><br>
    <a class="freelinking external" href="http://www.findmyfont.com/images/stories/fmf/screenshots/FMF-Win-Browse.png" rel="nofollow">click for bigger image</a></p>
    <p>Apart from Find my Font main functionality -to identify fonts in images- many of you have said that "it's a unique &amp; different way to browse your font collection", therefore I think you will love this new feature.</p>
    <p>You may now browse for fonts on your computer by typing a part of a font's name.<br>
    The program displays a list with fonts that contain that word in their family name or font style. You can then render a custom text preview using any of the browsed fonts.</p>
    <p><strong>The good news is, the font-matching button is still active:<br>
    This way you can find fonts that are visually similar to the browsed font, according to the letters you specify!<br>
    We think this as an important and invaluable feature for Font Designers, Graphic Designers and Type Enthusiasts.</strong></p>
    <p>As always, you can compare the different editions and download a 30-days free trial on this page: <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/download/compare-editions" rel="nofollow">Find my Font Editions Comparison</a></strong></p>
    <p>All typophile users already having a promo-code/license can download Find my Font Pro v2.3.01 by going to the following page and entering your license number: <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/members/product-update" rel="nofollow">Members - Update (to latest version)</a></strong></p>
    <p>I will be really glad to read your comments/critique about the new features and especially the "Browse Font by Visual Similarity" functionality.</p>
    <p>Thank you again for your time,<br>
    and your valuable feedback.</p>
    <p>Fivos Vilanakis<br>
    Software Engineer<br>
    Softonium Developments</p>
    <p>Product Page: <strong>http://www.findmyfont.com</strong></p>
    <p>===================================================<br>
    <strong>UPDATE - 27/1/2012</strong><br>
    New Find my Font release v2.3.02 - Major new Features are:</p>
    <p><strong>(a). Support of Postscript Type 1 Fonts &amp; Mac Suitaces</strong><br>
    The Windows Edition supports now Windows Type 1 fonts (.pfb/.pfm) while the Mac OS Edition supports both Windows Type 1 font and Mac Font Suitcases containing Type 1, True Type or Open Type fonts.<br>
    For more details on the supported font-formats <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/find-my-font/supported-font-formats" rel="nofollow">click here</a></strong>.</p>
    <p><strong>(b). New "Getting Started" Help Screen</strong><br>
    A "Getting Started" screen is created to describe the basic application functionality in just 4 paragraphs of text and assist first-time user to get quick results.</p>
    <p>===================================================<br>
    <strong>UPDATE - 11 May 2012</strong><br>
    New Post: <a class="freelinking external" href="http://typophile.com/node/92904" rel="nofollow">Find my Font v3.0 - Find fonts in Images: Both Local and Online font matching is now supported!</a></p>
