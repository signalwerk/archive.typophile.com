    html: |-
      <p>@Fivos</p>
      <p>BTW - I'm a former network engineer/administrator with a lot of experience with Windows installation problems. I was the third-level guy - the guy they called in when the first two techs failed. And unless something was truly broken, <strong>I</strong> never failed. (Just true, that's all.)</p>
      <p>I began playing around with Find My Font today.</p>
      <p>1) I am absolutely sure I installed the newer version some weeks ago, yet when I went to launch, the icon brought up the older version. Just odd, that's all I'm saying. After that, I uninstalled the older version and re-installed the newer version and everything's fine now. But unless I'm losing my mind (perfectly possible), the install of 2.3.01 either wasn't successful, or didn't replace/overwrite the previous version. I'm just mentioning this so you can double-check.</p>
      <p>2) I have not looked at the tutorials yet. But simply trying to figure out how the program works by looking at the interface and making educated guesses is a bit difficult. Too difficult - and I don't think it has to be this way.<br>
      That I have to have an image of a font and that it needs to be in the left-hand box is fairly clear and obvious. But it would be more obvious if the box were not blank by default, why not a greyed out "Font Image Loads Here" or something like that? This way, the second the user opens the program, it's unavoidably obvious that an 'font' image needs to be opened and that it will display in the left-hand panel?</p>
      <p>Now, I'm at the point where what's not clear to me is what kind of image is best to use to get the best chance of an accurate match. Should it be a phrase, or a word, or a single character? When I click the image more than once, it tiles within the "preview" box below it. There, too, what exactly is being displayed in the lower left hand box? Is it what the program "sees" in trying to find a match? It's unclear.<br>
      Ideally, I should be able to learn these things without going to the help section or a tutorial.<br>
      I'm getting a pop-up box that says something about a 1 letter bitmap which I don't understand, too. I'm being forced, really, to go into the help and tutorial sections and it seems to me, the idea of the program is very simple and this shouldn't be the case.</p>
      <p>The idea behind the program is simple to understand: Provide an image of a font, select a folder or directory that has a font collection, and ask the program to find a match. That's it. Very simple.</p>
      <p>Yet, it seems a little more difficult than it should be to make this happen quickly. Everybody hates "reading the manual". In fact, they <strong>don't</strong> read the manual! And if you're going to be relying on a thirty day and/or disabled features demo or something like that to generate sales, it's important that it be as easy to use as it can be.</p>
      <p>Please understand that I'll certainly figure out how to use the app, I'm just passing along these points of confusion as a good beta tester!  If you'd like to switch to email on these observations, let me know.</p>
      <p>Regards,</p>
      <p>Rich</p>
