  - id: 488229
    user: 176276
    date: 2011-12-21T20:18:00
    date_raw: 21 Dec 2011 — 8:18pm
    votes: null
    html: |-
      <p>Hi Rich,</p>
      <p>and thank you for your valuable comments.</p>
      <p>----------------------------<br>
      About this one:</p>
      <blockquote><p>1) I am absolutely sure I installed the newer version some weeks ago, yet when I went to launch, the icon brought up the older version.(...)</p></blockquote>
      <p>The only difference in installer prior v2.3.00, it was it offered an option to launch the application at the end of install.<br>
      As the installation always requires an admin-level account, any files created on this first run were owned by the admin and they might not be accessible for a normal user account.<br>
      That's the only thing I can think it's related to the issue you mention.<br>
      Anyway, the last installer is tested again &amp; again with many different XP accounts and I hope this is not an issue anymore.</p>
      <p>----------------------------<br>
      I really appreciate your comments and ideas about how a first-time user can figure out the basic program operation.<br>
      Experienced users, have no problem to start using the app. right away,<br>
      but you are right that people hate to read manuals.<br>
      We have already started to design a simple screen to stay on, and navigate the new users through the required steps:</p>
      <p>1) Tell the App. where your fonts are (once)<br>
      2) Load or Capture a font image<br>
      3) Click on it to select 1-3 distinct letters<br>
      4) Type the actual text in [Text to Match] field<br>
      5) Click the [Mach Fonts!] button</p>
      <p>That's all ;)<br>
      and you are right, we should make these simple steps more obvious.</p>
      <p>Thanks again for your time</p>
      <p>Regards<br>
      Fivos</p>
      <p>PS-1: We are already testing Finf my Font v2.3.02-beta, which supports Postscript Type-1 fonts (both Mac &amp; PC format) and Mac Font Suitcases (OTF/TTF/Type-1). I will post the details just after release in a couple of weeks.</p>
      <p>PS-2: I will be really glad to read some comments about the "Browse Fonts by Visual Similarity" functionality. What do you think?</p>
