    <p>German Type Foundry is pleased to announce the release of Secca.</p>
    <p>Secca is a fine and simple typeface honoring the roots of early German grotesque type designs but mastered for the needs of today.</p>
    <p>One font of the 12 weights family can be ordered as free demo version.</p>
    <p><a class="freelinking external" href="http://issuu.com/astype/docs/secca" rel="nofollow">specimen</a></p>
    <p><a href="http://www.germantype.com/secca" title="http://www.germantype.com/secca">http://www.germantype.com/secca</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/gtf_Secca_4_4044.gif"></div><p></p>
