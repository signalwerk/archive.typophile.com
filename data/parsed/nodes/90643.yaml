    <p>Can anyone identify this font?</p>
    <p>It's from a vinyl record of the US Air Force performing jazz tunes. The record is from the 70's to early 80's - I wouldn't expect the font to be any newer than 1984.</p>
    <p>Thanks!</p><div class="imageWrap"><img src="http://typophile.com/files/crystalgardens_font_invert_6457.jpg"></div><p></p>
