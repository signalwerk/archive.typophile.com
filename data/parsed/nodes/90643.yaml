    html: <p>FYI, Opulent is credited to <a href="http://typographica.org/on-typography/interview-phil-martin/" rel="nofollow">Phil Martin</a> (the guy who started Alphabet Innovations and TypeSpectra). However, after Phil died in 2005, I heard from one of his former associates who said that some faces that Phil took credit for were actually designed and/or drawn by others in his employ. He stated that Opulent actually may have been designed by George Bain, or that he at least drew it.</p>
    html_clean: <p>FYI, Opulent is credited to <a href="http://typographica.org/on-typography/interview-phil-martin/" rel="nofollow" class="link-external">Phil Martin</a> (the guy who started Alphabet Innovations and TypeSpectra). However, after Phil died in 2005, I heard from one of his former associates who said that some faces that Phil took credit for were actually designed and/or drawn by others in his employ. He stated that Opulent actually may have been designed by George Bain, or that he at least drew it.</p>
