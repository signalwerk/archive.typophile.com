    html: '<p>Joseph Treacy asks about a presumed relationship between Intertype an Lettergieterij Amsterdam.  <br><br>Well, there was a ‘warm business relationship’: <span class="caps">LA</span>/Tetterode sold Intertypes and Intertype matrices in Holland and Belgium, and provided type designs to be rendered in Intertype matrices. Among these <span class="caps">S.H.</span> de Roos’s De Roos Romein en Cursief (Roman and Italic), his Egmont, and Dick Dooijes’ Mercator. <br>A similar warm business relationship existed between Monotype <span class="caps">UK</span> and the type foundry of Joh. Enschede in Haarlem, employer of Jan van Krimpen. This is the reason that Monotype matrices exist for Lutetia, but not for de Roos’ Hollandsche Medieaval or Dooijes’ wonderful sans serif Mercator. <br><br>Does anyone know if casting handletter from Intertype/Linotype matrices has ever been attempted? It would of course require a specialized hand-mould, or an adapted Monotype&nbsp;caster…</p>'
    html_clean: '<p>Joseph Treacy asks about a presumed relationship between Intertype an Lettergieterij Amsterdam.  <br><br>Well, there was a ‘warm business relationship’: <span class="caps">LA</span>/Tetterode sold Intertypes and Intertype matrices in Holland and Belgium, and provided type designs to be rendered in Intertype matrices. Among these <span class="caps">S.H.</span> de Roos’s De Roos Romein en Cursief (Roman and Italic), his Egmont, and Dick Dooijes’ Mercator. <br>A similar warm business relationship existed between Monotype <span class="caps">UK</span> and the type foundry of Joh. Enschede in Haarlem, employer of Jan van Krimpen. This is the reason that Monotype matrices exist for Lutetia, but not for de Roos’ Hollandsche Medieaval or Dooijes’ wonderful sans serif Mercator. <br><br>Does anyone know if casting handletter from Intertype/Linotype matrices has ever been attempted? It would of course require a specialized hand-mould, or an adapted Monotype&nbsp;caster…</p>'
