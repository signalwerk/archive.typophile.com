    html: <p>Century Gothic is an amusing suggestion, given its history. <br><br>Since we were talking about knockoﬀs, this one is a particularly amusing story. Monotype’s knockoﬀ of Futura was called 20th Century. When Microsoft was trying to produce metrically-equivalent designs for the PostScript “base 35” fonts, back in the early 90s, Monotype reﬁt 20th Century to match the metrics (and to a lesser degree the design) of Avant Garde. This new creation was called Century Gothic. <br><br>T</p>
