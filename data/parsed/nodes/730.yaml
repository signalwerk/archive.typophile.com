    html: <p>The heading type for The New Yorker is named Irvine, presumably the name of the lettering artist who hand- splashed it in the pre-thirties. Lanson Monotype cut a series of sizes—without Mac McGrew’s book at hand—I think from 14 to 36 point. These matrices were for the exclusive use of The New Yorker. I am reasonably certain that Monotype never attempted to sell them to the general public. <br><br>In recent years Rich Hopkins, who produces The Newsletter of The American Typecasting Fellowship aproached The New Yorker with the request that they supply him with information about the type so that he could include an article about it in The Newsletter. They very vigorously declined! I think they feel very protective of it. It’s hard to blame them when so many designers have “borrowed” it to create logotypes. <br><br>If you can dig up Mac’s book, you can get the full details if you are interested. <br><br>Jim&nbsp;Rimmer</p>
