    html: <p>Eduardo— <br><br>This isn’t a rip-oﬀ, but it does show what occurred during the ﬁrst part of the 20th century in the world of typeface design. Geometric sans serifs were all the rage, and every foundry wanted a piece of the pie. For instance, Monotype wanted Gill, Linotype wanted Dwiggins, and yes there was also Renner’s Futura and Kabel (and I’m sure otheres I’m forgetting. <br><br>I don’t know the history of this typeface, but I’m sure someone will come around soon enough to educate&nbsp;us. </p>
