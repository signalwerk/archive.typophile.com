    html: <p>»Century Gothic is an amusing suggestion, given its history.  <br><br>&gt;Since we were talking about knockoﬀs,  <br>&gt;this one is a particularly amusing story. <br>&gt;Monotype’s knockoﬀ of Futura was called  <br>&gt;20th Century. When Microsoft was trying  <br>&gt;to produce metrically-equivalent designs  <br>&gt;for the PostScript “base 35” fonts, back  <br>&gt;in the early 90s, Monotype reﬁt 20th Century  <br>&gt;to match the metrics (and to a lesser degree  <br>&gt;the design) of Avant Garde. This new creation  <br>&gt;was called Century Gothic. <br><br><br>I remember it well (although not particularly dewy-eyed). <br><br>;-) <br><br>I recall leaning into framed specimens of it, Corsiva and others at one of the type exhibits organized within the Seybold shows the year of Century Gothic’s debut, and being asked by the originators, “well, what do you think of it?!”…. <br><br>Well, what is one supposed to think? <br><br>I’d forgotten about that metrics-matching, and the pyrotechnics it caused at the time, helping keep burning the ‘Base 35’ licensing ﬁght. <br><br>I recall thinking what a coarse and seemingly unretouched set of fonts those knockoﬀs were. <br><br>Really, I didn’t recommend it lightly, but unless someone chimes in from Heidelberg/Linotype to say that they’ve made Intertype Vogue available, the Century Gothic seemed the best bet. <br><br>Noble is not a bad option, but not quite the same in the respects that make Vogue, Vogue.  <br><br>I’ve actually had to use Century Gothic for a design project (cleaning up someone else’s work for a client). For what it is, it’s not too terrible. Of course, I prefer spacing to be somewhat better than its. <br><br>I appreciate you pointing that out, Thomas. And you too, Gerald. <br><br>The 20th Century design aside, Sol Hess sure did some lovely work. <br><br>Joe <br><br></p>
