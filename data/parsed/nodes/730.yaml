    html: '<p>By the way, regarding Intertype’s eventual fate: <br><br>This from an ad in an American publication <i>Printer’s Hot Line</i> <br>on 18 September 1991. <br><br><img src="https://web.archive.org/web/20190929160745im_/http://www.typophile.com/forums/messages/30/14377.jpg" alt="Intertype merged with Mergenthaler"><br><br>It’s always sad to see a century of leadership end in such typographic disarray.  <br><br>A goodbye ad, of sorts, and not even with historic Intertype types! <br><br>Anyway, can Intertype’s Vogue now be found cast in digital form at Linotype? <br><br>Joe <br><br><br></p>'
