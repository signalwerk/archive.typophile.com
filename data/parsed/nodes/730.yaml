    html: <p>I just spotted your posts regarding Vogue via a google search. I’m a graphic design masters student at Yale who is embarking on digitizing Vogue. I’d be interested to send you some samples and get feedback as it evolves. The ﬁrst time I saw Vogue in an old type specimen book it intrigued me; I love the humanist style drawing and the similarities to schoolyard primer type. I’m glad there are others who seem to love it too. Email me at <a href="https://web.archive.org/web/20190929160745/mailto:emily.lessard@yale.edu">emily.lessard@yale.edu</a> if you’re interested in giving feedback or have some information to&nbsp;share. </p>
