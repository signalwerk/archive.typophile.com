    html: '<p>&gt;Wasn’t Intertype more of a second-tier  <br>&gt;bandwagon-jumping foundry? <br><br>Hard to tell. There were worse oﬀenders at the time. Some who prefer the Linotype or the <span class="caps">ATF</span> or the Continental of the day might say it was second-tier. Or worse. <br><br>After all, while Intertype Vogue might have been inspired by the hype surrounding Futura, it’s not Futura. And the original Noble (Noble Grotesque) is neither of them. <br><br>And, astonishingly, look how Intertype Vogue has managed to stand exclusively even today. (I would have never guessed that, but I’ve never paid much attention to Intertype Vogue.) <br><br>I think Tiﬀany Wardle’s July 26 post above summed it up well: Everybody wanted a piece of the pie.  <br><br>The positive thing was (and is), they nearly always created something diﬀerent; they didn’t just clone verbatim. <br><br>Joe <br><br><br><br></p>'
    html_clean: '<p>&gt;Wasn’t Intertype more of a second-tier  <br>&gt;bandwagon-jumping foundry? <br><br>Hard to tell. There were worse oﬀenders at the time. Some who prefer the Linotype or the <span class="caps">ATF</span> or the Continental of the day might say it was second-tier. Or worse. <br><br>After all, while Intertype Vogue might have been inspired by the hype surrounding Futura, it’s not Futura. And the original Noble (Noble Grotesque) is neither of them. <br><br>And, astonishingly, look how Intertype Vogue has managed to stand exclusively even today. (I would have never guessed that, but I’ve never paid much attention to Intertype Vogue.) <br><br>I think Tiﬀany Wardle’s July 26 post above summed it up well: Everybody wanted a piece of the pie.  <br><br>The positive thing was (and is), they nearly always created something diﬀerent; they didn’t just clone verbatim. <br><br>Joe <br><br><br><br></p>'
