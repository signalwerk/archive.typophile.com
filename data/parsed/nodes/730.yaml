    html: <p>According to the McGrew book, Vogue was cut in 1930 for Vogue magazine and later released generally. It diﬀers from Futura in a number of ways. The caps are the full decender height, the lowercase a is two-story in the lighter weights. The most distinctive characters are the uppercase G, M, and Q.  <br><br>A lot of typefaces back then, including Vogue, Metro, Gill, and Tempo, had alternate characters available to allow them to pass as Futura or Kabel. Linotype’s Spartan (their version of Futura) also had an alternate two-story a. Monotype also had a Kabel look-alike called Sans Serif that had alternates to make it look like Futura or Bernhard Gothic, plus some really neat rounded capitals designed by Sol&nbsp;Hess. </p>
    html_clean: <p>According to the McGrew book, Vogue was cut in 1930 for Vogue magazine and later released generally. It diﬀers from Futura in a number of ways. The caps are the full decender height, the lowercase a is two-story in the lighter weights. The most distinctive characters are the uppercase G, M, and Q.  <br><br>A lot of typefaces back then, including Vogue, Metro, Gill, and Tempo, had alternate characters available to allow them to pass as Futura or Kabel. Linotype’s Spartan (their version of Futura) also had an alternate two-story a. Monotype also had a Kabel look-alike called Sans Serif that had alternates to make it look like Futura or Bernhard Gothic, plus some really neat rounded capitals designed by Sol&nbsp;Hess. </p>
