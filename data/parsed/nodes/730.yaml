    html: '<p>Hi, Jim — <br><br>From McGrew’s marvelous book, p. 185: <br><br>” <br>Irvin, Mono (8-30pt), private <br><br><span class="caps">IRVIN</span> is a very unusual typeface, used for many years for the distinctive heads in the <i>New Yorker</i> magazine. It was designed in 1925 by Rea Irvin, ﬁrst art director of the magazine, (…) <br>” <br><br>The specimen on the facing page, showing only A-Z, &amp;, ~, $, 1-0,&nbsp;?!()[], cent, period, comma, single open and single closing quotation marks.  <br><br>(But that doesn’t necessarily mean that was the complete fount, according to Mr. McGrew.) <br><br>The use of caps for <span class="caps">IRVIN</span> was the author’s. <br><br>Quoted from ‘American Metal Typefaces of the Twentieth Century’, by Mac McGrew, 1986, 1993, Oak Knoll Books. <span class="caps">ISBN</span> 0-938768-34-4 <br><br>Copyright 1986, 1993 by Mac McGrew. <br><br>In hardcover, was it <span class="caps">US</span>$70., new?  <br>I don’t recall and it’s not on the jacket. <br><br>Anyone know how much like it the ’90s revival <span class="caps">FF</span> NewYorkerType meant to be?  <br><br>Doesn’t appear to be a tracing, just heavily inspired by the original. There’s much more untoward modulation than in Irvin the Original. <br><br>Comparing the two, I prefer Irvin the Original’s predictibility in roughness and weighting. <br><br>Joe <br><br><br><br></p>'
    html_clean: '<p>Hi, Jim — <br><br>From McGrew’s marvelous book, p. 185: <br><br>” <br>Irvin, Mono (8-30pt), private <br><br><span class="caps">IRVIN</span> is a very unusual typeface, used for many years for the distinctive heads in the <i>New Yorker</i> magazine. It was designed in 1925 by Rea Irvin, ﬁrst art director of the magazine, (…) <br>” <br><br>The specimen on the facing page, showing only A-Z, &amp;, ~, $, 1-0,&nbsp;?!()[], cent, period, comma, single open and single closing quotation marks.  <br><br>(But that doesn’t necessarily mean that was the complete fount, according to Mr. McGrew.) <br><br>The use of caps for <span class="caps">IRVIN</span> was the author’s. <br><br>Quoted from ‘American Metal Typefaces of the Twentieth Century’, by Mac McGrew, 1986, 1993, Oak Knoll Books. <span class="caps">ISBN</span> 0-938768-34-4 <br><br>Copyright 1986, 1993 by Mac McGrew. <br><br>In hardcover, was it <span class="caps">US</span>$70., new?  <br>I don’t recall and it’s not on the jacket. <br><br>Anyone know how much like it the ’90s revival <span class="caps">FF</span> NewYorkerType meant to be?  <br><br>Doesn’t appear to be a tracing, just heavily inspired by the original. There’s much more untoward modulation than in Irvin the Original. <br><br>Comparing the two, I prefer Irvin the Original’s predictibility in roughness and weighting. <br><br>Joe <br><br><br><br></p>'
