    html: <p>Benjamin,  <br><br>If a digital Intertype Vogue isn’t avalable from Linotype, then you might want to throw your hands in the air and buy Font Bureau’s cut of ‘Noble’. <br><br>It appears to be faithful to <span class="caps">N.V.</span> Lettergieterij “Amsterdam” (formerly) N. Tetterode’s original ‘Nobel’. <br><br>That has a similar attitude — same slightly non-geometric softness overall, even though O and similar are optically round.  <br><br>And unless I missed it, it’s minus the delightful Q with the vertical tail, and the Futura-like e.  <br><br>(McGrew’s book mentions that Vogue was apparently inspired by Renner’s developmental work on Futura, right up to and including those alternate lowercase characters you show.) <br><br>The Encyclopaedia of Type Faces listing for Noble actually hints at a relationship between Tetterode (Amsterdam) and Intertype, but I don’t recall. The showing it uses is from Tetterode’s specimen of 1930-32, yet it lists the face’s release as 1929. <br><br>Nobel might be a good substitute. <br><br><br><br>And although I don’t like to recommend <span class="caps">OS</span> fonts, in this case, if Vogue isn’t available, then (sigh!) the <span class="caps">OS</span> font ‘Century Gothic’ might also be a good match for you. <br><br>It also misses the vertically tailed Q, but has the Futura-like e.  <br><br>Overall, seems directly derived from Vogue. Or Noble. Or both….  <br><br>Joe <br><br></p>
    html_clean: <p>Benjamin,  <br><br>If a digital Intertype Vogue isn’t avalable from Linotype, then you might want to throw your hands in the air and buy Font Bureau’s cut of ‘Noble’. <br><br>It appears to be faithful to <span class="caps">N.V.</span> Lettergieterij “Amsterdam” (formerly) N. Tetterode’s original ‘Nobel’. <br><br>That has a similar attitude — same slightly non-geometric softness overall, even though O and similar are optically round.  <br><br>And unless I missed it, it’s minus the delightful Q with the vertical tail, and the Futura-like e.  <br><br>(McGrew’s book mentions that Vogue was apparently inspired by Renner’s developmental work on Futura, right up to and including those alternate lowercase characters you show.) <br><br>The Encyclopaedia of Type Faces listing for Noble actually hints at a relationship between Tetterode (Amsterdam) and Intertype, but I don’t recall. The showing it uses is from Tetterode’s specimen of 1930-32, yet it lists the face’s release as 1929. <br><br>Nobel might be a good substitute. <br><br><br><br>And although I don’t like to recommend <span class="caps">OS</span> fonts, in this case, if Vogue isn’t available, then (sigh!) the <span class="caps">OS</span> font ‘Century Gothic’ might also be a good match for you. <br><br>It also misses the vertically tailed Q, but has the Futura-like e.  <br><br>Overall, seems directly derived from Vogue. Or Noble. Or both….  <br><br>Joe <br><br></p>
