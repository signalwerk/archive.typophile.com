    html: <p>Hrant <br><br>If you have ever sat with two old uncles at family gatherings and heard them argue over the relative merits of Ford over Chevrolet, that is what it was like between operators of Linotype and Intertype machines. <br><br>Although the the places I worked back in the ﬁfties and sixties favored Lonotype, Intertypes were very respected and considered by some to be more reﬁned machines. <br><br>personally, I thought them both to marvels of engineering and performance. <br><br>As far as the typefaces (matrices) they produced for their machines. Many printers preferred those of Intertype. They both pinched designs from each other a certain amount, but so did all the composing machine manufacturers; Monotype and Ludlow. And of course none of these makers hesitated to produce designs based on those of the true had metal type foundries. As Tiﬀany Wardle has noted, every typemaker on the planet  was in a headlong rush to come out with a geometric sans. They all did the same thing when Garamond was rediscovered and made into useable type by a modern-day foundry shortly after the turn of 1900. I can’t remember who was ﬁrst. Isn’t it funny, though how digital makers are still doing the same thing with Garamond? (I have my version too). <br><br>I don’t think Intertype was thought of as an interloper, except by a few old “uncles” who started out with Linotype. <br><br>I did have the opportunity to operate one of two Intertype machines back about 1960 at the Williams Lake Tribune; a weekly paper and job printing shop in the Cariboo (Cowboy country) in the interior of British Columbia. <br><br>Jim&nbsp;Rimmer</p>
    html_clean: <p>Hrant <br><br>If you have ever sat with two old uncles at family gatherings and heard them argue over the relative merits of Ford over Chevrolet, that is what it was like between operators of Linotype and Intertype machines. <br><br>Although the the places I worked back in the ﬁfties and sixties favored Lonotype, Intertypes were very respected and considered by some to be more reﬁned machines. <br><br>personally, I thought them both to marvels of engineering and performance. <br><br>As far as the typefaces (matrices) they produced for their machines. Many printers preferred those of Intertype. They both pinched designs from each other a certain amount, but so did all the composing machine manufacturers; Monotype and Ludlow. And of course none of these makers hesitated to produce designs based on those of the true had metal type foundries. As Tiﬀany Wardle has noted, every typemaker on the planet  was in a headlong rush to come out with a geometric sans. They all did the same thing when Garamond was rediscovered and made into useable type by a modern-day foundry shortly after the turn of 1900. I can’t remember who was ﬁrst. Isn’t it funny, though how digital makers are still doing the same thing with Garamond? (I have my version too). <br><br>I don’t think Intertype was thought of as an interloper, except by a few old “uncles” who started out with Linotype. <br><br>I did have the opportunity to operate one of two Intertype machines back about 1960 at the Williams Lake Tribune; a weekly paper and job printing shop in the Cariboo (Cowboy country) in the interior of British Columbia. <br><br>Jim&nbsp;Rimmer</p>
