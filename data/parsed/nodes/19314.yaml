    <p>Greetings: I’m looking for type suggestions for a variety of projects. I perform desktop publishing for local Virginia businesses, Clients including a realtor, developer, builder, photographer, equine non-profit, and others. I write/design ads and promos that appear in local papers and weekly publications (newsprint); as well as newsletters; flyers; brochures; and business cards/letterhead.<br>
    Back in the dinosaur days when we purchased type on floppy disks, I had TONS of Adobe stuff, but found I generally used three or four faces regularly.  Now, after a long hiatus from this type of work, my floppy versions are gone, and I’d like to purchase some new type.<br>
    As much as I try to “expand” my tastes, I usually choose type with the same characteristics: large x-height and tight letter spacing. Also, I often like condensed versions in headers. Lately, my type of choice has been ITC Century Std, in the past it has been Garamond. I like Utopia, but have never tried it. “Regulars” include Bookman and Palatino, and for sans serif, Helvetica (although I never like the way it looks; I got used to it when I worked for a corp. that used it as their official typeface). As you can see, my choices are all pretty mainstream.<br>
    These days, I’m looking to find about half a dozen typefaces that work together in a variety of print materials.  I’d like to try something new, fresh, more modern, that will work with/compliment the style I like (and will continue to use, no doubt) and I’d hope to find a sans serif, as well as something more casual. Please, any creative suggestions for a collection of type would be greatly appreciated!  I’m hoping you’ll all get me to think outside the box a bit...</p>
