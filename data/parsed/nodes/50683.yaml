    date_raw: 20.Oct.2008 5.37am
    votes: null
    html: <p>I don’t think any font would specifically meet your needs. What you need to do is grid out the windows/lights on each building and then build bitmap letters. A grid 3 wide by 5 high can get you most of the letters, though some will require a wider grid.</p>
