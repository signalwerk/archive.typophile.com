    html: |-
      <p><em>(1) Are there any typefaces that do this well?</em></p>
      <p>I write one with 5553 kerning pairs (and also increasing). see my post on this forum.</p>
      <p><em>(2) What the kerning pairs that need adjustment?</em></p>
      <p>1 - all of [right-joining characters [isolated and final]]+[dual-joining characters [initial and isolated]]<br>
      2 - all of [right-joining characters [isolated and final]]+[right-joining characters [isolated]]</p>
      <p>If you want to design an Arabic font with kerning, you have to be careful of above marks. you can add an extra substitution for replacing base glyphs with their alternatives when above marks are applied.<br>
      My advice is not to try make pairs manually. if you want a completed and clear kerning, write a program to accomplish it. i write an algorithm using some artificial intelligence and image processing algorithms to make kern feature in form of VOLT lookup.<br>
      I can send you the algorithm.</p>
      <p><em>(3) What software do people prefer for working with Arabic script fonts?</em></p>
      <p>I'm not a professional font designer, but I'm pretty sure VOLT+FontLab+Font Creator is necessary and enough for designing clear Arabic fonts. you could use AFDK too.</p>
