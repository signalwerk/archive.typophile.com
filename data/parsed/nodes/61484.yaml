    <p>Hello,</p>
    <p>As I've been looking at the results from various Arabic fonts (starting with the free Scheherazade, but then seeing that the problem is quite widespread), I'm beginning to notice that kerning for Arabic fonts is quite rare. (From one long listing of fonts I saw online, a handful had any kerning pairs at all.) So, a couple of questions...</p>
    <p>(1) Are there any typefaces that do this well?<br>
    (2) What the kerning pairs that need adjustment? For the most part I find that glyphs following ر (and ر-like glyphs) could be much, much closer. Also و often seems to get an unnecessarily wide berth.</p>
    <p>And, off-topic, but since I'm writing...</p>
    <p>(3) What software do people prefer for working with Arabic script fonts?</p>
    <p>Thanks,<br>
    Adam Baker</p>
