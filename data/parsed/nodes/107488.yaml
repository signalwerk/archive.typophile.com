    html: |-
      <p>Looks like lettering inspired by works of the Russian Constructivists of the 1920s and 30s, including Alexander Rodchenko, Varvara Stepanova, Vladimir and George Stenberg, and Gustav Klutsis.<br>
      For angularity and a somewhat similar S, see for example  Bs-Kombat,<br>
      <a href="http://www.myfonts.com/fonts/feliciano/bs-kombat/" title="http://www.myfonts.com/fonts/feliciano/bs-kombat/">http://www.myfonts.com/fonts/feliciano/bs-kombat/</a><br>
      Other angulars in this group include ITC Stenberg<br>
      <a href="http://www.myfonts.com/fonts/itc/stenberg/" title="http://www.myfonts.com/fonts/itc/stenberg/">http://www.myfonts.com/fonts/itc/stenberg/</a><br>
      and Rodchenko<br>
      <a href="http://www.myfonts.com/fonts/paratype/rodchenko-cond/" title="http://www.myfonts.com/fonts/paratype/rodchenko-cond/">http://www.myfonts.com/fonts/paratype/rodchenko-cond/</a><br>
      The low crossbar A was a common Art Deco feature now found in some fonts, including Neutraface by House and Erbar by URW++<br>
      C's like the image<br>
      ITC Terta bold<br>
      <a href="http://www.myfonts.com/fonts/itc/tetra-itc/" title="http://www.myfonts.com/fonts/itc/tetra-itc/">http://www.myfonts.com/fonts/itc/tetra-itc/</a><br>
      Konstruct  Square<br>
      <a href="http://www.myfonts.com/fonts/stockbucket/konstruct/" title="http://www.myfonts.com/fonts/stockbucket/konstruct/">http://www.myfonts.com/fonts/stockbucket/konstruct/</a><br>
      Don</p>
