      <p>Thank you very much for the replies.<br>
      Looking at all those links fvilanakis's suggestion "Teuton" seems to be by far the closest. I think with some customising it could look quite close to the example in the OP.</p>
      <p>If anyone else come across similar typefaces (in particular the "S" "A" and "C"), please post it up.<br>
      Thanks again!</p>
