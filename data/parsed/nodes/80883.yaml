      <p>I am not sure how to participate in this but wayyyy back in 2003 Jimmy in Design posted a question about how to change the underline in InDesign so that it was a different weight, color, etc.  There was no solution listed, and I just figured it out and came upon you when i was doing my search. How do I go about posting the step by step solution? It may well have been that in 2003 there was no solution but there is now.<br>
      Also one of the folks in the group giving 'oh well' answers said, well, since typography is much more than typewriters now, we don't need underlines anymore. Not so. There continue to be studies going on in the direct marketing world about how people read, comprehend and respond to messaging in various typographic styles, and for some messaging, you want it to look as much like a typewriter as possible, or at least use less of our 'new-fangled' font versions and include underlines. People read more, and they buy more. And folks, that is how we get paid and get new jobs from former clients; when we know how to help them make money. </p>
      <p>Anyway if anyone wants a step by step i can try to set it up. It is easy once you know how. Cheers!</p>
