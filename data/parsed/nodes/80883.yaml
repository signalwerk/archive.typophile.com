    <p>1. Your thread will be on Google.</p>
    <p>It is important to remember that not all clients want the work which you are doing for them in the search engines. Before you post work for critique keep this in mind because the search engines love Typophile. Sometimes it is best to keep things generic or, if you want to use the company name, consider only using images with the logo, etc., and ask that no one type the company name.</p>
    <p>We don't wish for anyone to lose their jobs because of a thread on Typophile, but it is our policy not to delete threads and we don't delete them without consideration.</p>
    <p>2. Be helpful, but be polite.</p>
    <p>Further,  if you don't have anything nice to say, don't say anything at all. You may think you are offering "friendly" advice but your words say otherwise. It is one thing to give a fair critique, but if words such as "don't mean to be rude, but this is awful" or "obviously you have no experience" are part of what you wish to write perhaps just don't write anything. Silence is critique enough. </p>
    <p>While it might be true that thin skin is not helpful to a designer, Typophile does not need to be the place to scare anyone away. Everyone is on the same path, some further along that others. We are all here to learn and grow. Let's help each other.</p>
    <p>3. Nothing is free.</p>
    <p>And lastly, if you are here asking for people to design something for you without compensation—or worse hiding it behind the guise of a contest—thinking that the experience will be great on their resume this is not the place for you. Typophile does not support this practice. <a href="http://www.no-spec.com/" title="http://www.no-spec.com/">http://www.no-spec.com/</a></p>
