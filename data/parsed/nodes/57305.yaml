    <p>Hi.</p>
    <p>I’m on the search for å corporate slab-serif.<br>
    Must have some character and “attitude”, but still work as bodycopy.<br>
    Looking for something a bit rounder than Soho, but not as round/geometric as Lubalin Graph.</p>
    <p>Any tips?</p>
    <p>Thanks.</p>
    <p>H</p>
