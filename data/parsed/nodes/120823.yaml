  html: |-
    <p>Hi all,</p>
    <p>I'm using the Syriac font "East Syriac Adiabene" available here: <a href="http://www.bethmardutho.org/index.php/resources/fonts.html" title="http://www.bethmardutho.org/index.php/resources/fonts.html">http://www.bethmardutho.org/index.php/resources/fonts.html</a></p>
    <p>I'm trying to use the Arabic shedda along with other non-Syriac diacritics on Syriac letters. I have made sure that these diacritics are indeed already included in the font. When I try to use them on an initial or medial letter, it breaks the cursive and the next letter in line takes its initial form. This doesn't happen with the standard Syriac combining characters.</p>
    <p>I opened the font in FontForge to see if I could get an idea why this is happening but I can't come up with anything. All the lookups and anchors are standard across all the diacritics (Syriac or not). There must be something I'm missing that's causing the font to break.</p>
    <p>Thanks in advance.</p>
