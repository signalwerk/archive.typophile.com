    html: <p>There is a reason for some fonts having a darker texture — as Alex mentions; it makes the printed matter more comfortable to reader. I would go with Garamond, but it will take someone very experienced in typography to make it work well. If you are having trouble in choosing the right font, it's better to pay attention to what will professionals recommend. I would advise you to use either Cambria or Constantia as your main body font.</p>
