    <p>Hey all,</p>
    <p>I'm looking for some help with a nice font combination for my PhD thesis. I wrote it in MS Word (big mistake), but after seeing the font used by LaTeX (CMU family), I initially chose CMU Bright for headings and CMU Serif for body text.</p>
    <p>This feels a little antiquated now, and I'd like a clean and modern feel to the thesis. I've been playing with a couple of different font combinations, and have settled on:</p>
    <p>Open Sans (Light/Bold)<br>
    Bree (Thin)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2012-12-26 at 13_5627.16.45.png"></div><p></p>
    <p>Thoughts/recommendations?</p>
