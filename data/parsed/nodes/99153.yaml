      <p>Thanks for the responses. I've been looking for a clean serif font for a while and haven't found one I can settle on.</p>
      <p>My thesis is on the natural barrier that exists between the blood and brain (to protect the brain and provide all the nutrients it needs in a carefully controlled way), and uses our current understanding for the design of next generation drugs to treat brain conditions. Not exactly bed time reading!</p>
      <p>Since it's a thesis it's not something that people would ordinarily come across, so my font selection is more about reducing reader fatigue and clean presentation, rather than pulling them in for aesthetics.</p>
