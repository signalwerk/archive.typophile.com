      <blockquote><p>I've been looking for a clean serif font for a while and haven't found one I can settle on.</p></blockquote>
      <blockquote><p>my font selection is more about reducing reader fatigue and clean presentation, rather than pulling them in for aesthetics.</p></blockquote>
      <p>Simplified structure (if that's what you mean by "clean") doesn't necessarily correlate to ease/comfort in reading.  Personally, I think a traditional face like Bembo, Galliard, or Janson makes for superbly readable, comfortable text.</p>
      <p>If by "clean" you're thinking of something more in the transitional vein, I recall seeing an article not long ago which claimed that people were statistically slightly more likely to agree with something set in Baskerville than with other fonts.  For a PhD it might be an edge worth thinking about.  :-)</p>
      <p>If you want something specifically open and uncluttered, Constantia actually isn't a bad face, although I'm not sure how well it would hold up for dense multi-page writing.</p>
      <p>Speaking personally, for a long time I favoured Marty Pfeiffer's <a href="http://scootergraphics.com/nuserif/index.html" rel="nofollow">Nu Serif</a> for prose.  It's a nicely neutral serif face which is easy to read, although the high x-height may not be everybody's cup of tea.</p>
