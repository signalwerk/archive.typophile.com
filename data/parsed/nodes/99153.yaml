    html: <p>Will your thesis contain many equations, formulas, or tables of numerical data? If so, compare the numeral <strong>1</strong>, the lowercase <strong>l</strong>, and the capital <strong>I</strong> in any font you're considering. In many sans-serif faces, it's difficult to tell those three characters apart, which leads to confusion in reading equations and formulas.</p>
