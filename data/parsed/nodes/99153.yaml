      <p>@hrant: Well, it was the first font family I ever bought, so I have a certain soft spot for it.  The designer claims it for an adaptation of a bitmap font called Espy Serif; since I have (after all) done something similar with Workplace Sans, I was inclined to give him the benefit of the doubt.  His fonts are also very well hinted, which doesn't strike me as typical for quickie-knockoff jobs.  </p>
      <p>OTOH, you've a point that the letterforms are <em>very</em> similar to Stone Serif (with some subtle differences), which I never actually noticed before.  My only exposure, hitherto, to Stone is some samples in the Meggs-Carter book; I've never used it myself, although I'm thinking now maybe I should look into it some more. :)</p>
      <p>@OP: Bembo is my favourite face for "book" style text.  I think it'd be an excellent choice.  (For shorter professional documents I tend to prefer Sabon, but it may be a bit condensed for lengthy prose.)</p>
