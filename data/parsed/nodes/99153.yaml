    html: <p>Hello Mehmet &amp; welcome to Typophile. Before the members suggest you anything — it would be useful for them to know what is your topic about. Also, Bree is a <a class="freelinking external" href="http://en.wikipedia.org/wiki/Sans-serif" rel="nofollow">sans serif</a> font designed particularly for large sizes, it is advised to use serif fonts for long texts; particularly if the content is academic.</p>
