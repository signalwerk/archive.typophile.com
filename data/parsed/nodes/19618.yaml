    <p>This has been driving me crazy.  I’m trying to identify this typeface, which has been in widespread use in National Geographic maps since the 1960s.</p>
    <p><a href="http://wtf.myfonts.com/images/b7/b7ac88f58765bb03121a9e570f16fc73.13762.gif">(image)</a></p>
    <p>It works really well when used in mixed case for short words (town names, etc).  <a href="http://www.globecorner.com/i/t/GWgermd.GIF">Here</a> you can see it used as part of an atlas.</p>
    <p>I’ve heard that National Geographic has their own “customized fonts”, but really something close will suffice.  WhatTheFont turns up nothing (it even crashes) and Identifont is just way out in left field.  I’ve also Googled this to death and found nothing.  Another example is attached.</p>
