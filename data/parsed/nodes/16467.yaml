      <p>Hi,</p>
      <p>To quote the eminent stooge Curley, "I'm thinkin' and thinkin' as hard as I can and nothin's happening!"</p>
      <p>The goal is to produce Native American language documents on both OSX and PCs that can be shared both ways. The next goal is to build support for spell checking. The primary applications are desktop publishing and word processing. I also need to create a utility to convert documents with older 'hacked ascii' fonts to unicode.</p>
      <p>I'm still working on a single font. I'm tending towards using combining diacriticals with space modifying letters. It appears that the features of AAT do not appear to be usable with the recent OpenType changes to OSX 10.4. I guess we'll just live with lower quality typography until more of the OpenType features are supported.</p>
      <p>At the present time I'm trying to better understand how Ukelele works with combining diacriticals to know if our goals are achievable. I'm also diving into Applescript to see how conversion to unicode will work.</p>
      <p>Regards,</p>
      <p>Fred</p>
