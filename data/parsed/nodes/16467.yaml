      <p>What's the breakdown of OS's for the user base? Seems as if you're going to an awful lot of trouble to try to produce a cross-platform solution when a more realistic option would be to make conformant OpenType fonts for Windows XP and Office XP, and stick with hack fonts for the other users - Mac, Linux, and Win 9x? I'd guess you could even use Python Script to generate the good vs evil fonts from the same sources.</p>
      <p>Si</p>
