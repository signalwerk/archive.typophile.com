      <p>Fred, </p>
      <p>since we've corresponded off-list, you know my recent writings on the topic. So you are familiar with all the pros and contras of the various approaches. All I can say is that your issue is a tough call. </p>
      <p>One thing you might be looking at is including both OpenType Layout features and AAT features in your font. Mac OS X 10.3 and earlier only support AAT features. Mac OS X 10.4.3 and later support both OpenType Layout features and AAT features. (Mac OS X 10.4.0-10.4.2 had a problem with fonts that contained both types of features.) </p>
      <p>You will find information about adding AAT tables at:<br>
      <a href="http://developer.apple.com/fonts/" title="http://developer.apple.com/fonts/">http://developer.apple.com/fonts/</a></p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
