    html: |-
      <p>Someone's sure to cock a snook at me for this, since I'm not a designer, let alone a schooled designer, but here's a logo idea...</p>
      <p>Take a sky blue background and add three horizontal lines converging to parallel (like the Atari logo), with the top line being the tail of a lower-case 'e'. Let the lines end at the right in an arrow formation as if they were contrails of a Red Arrows fly-by.</p>
      <p>Set 'pitiro' all-upper in an extended Microgramma/Eurostile/Square 721 following the 'e'. Set your strapline in a fat small-caps sans (I'm thinking a mixed heavy/black extended Helvetica (Neue)/Swiss 721) with triangular bullets pointing rightwards.</p>
      <p>Looks quite punchy and more tech-savvy in my mind than the current 'child healthcare' logo.</p>
