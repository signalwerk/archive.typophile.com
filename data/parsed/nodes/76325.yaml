    <p>Hi,</p>
    <p>I've started working for this company recently and would like your help in analysing the current company logo, it's colours, the impression it gives, its design and what could be done to improve it, to make it stronger.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/epitiro-strap-neg-50mm-hr_5330.jpg"></div><p></p>
    <p>The company test and measure fixed and mobile broadband network performance for broadband providers and regulators from across the world so they know how their customers experience across their network and where there is a need to invest in order to improve the performance of their mobile or fixed network and thus allowing to leverage customer satisfaction.</p>
    <p>Epitiro is a latin name meaning "to watch over".</p>
    <p>I look forward to read your comments.</p>
    <p>Thanks to all.</p>
