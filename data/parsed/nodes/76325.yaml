      <p>The mark looks like it could be for Nytol, something to do with the moon, being wrapped up in a nice warm duvet cuddling a pillow. Not very tech, secure but more maternal than robust. The font too does not convey tech and whilst the strapline is not long, for me it looks odd aligned to the descender of the p.<br>
