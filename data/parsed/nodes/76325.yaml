    html: <p>I am a technical person and happen to be very familiar with the area your company operates in. I think the visual aspect of the branding is off - the colors, the mark and the typeface. Especially, the typeface. It is overly delicate for a technical company. It would be a better fit for an arts supply company or some such. A simpler straight-forward sans serif would IMO work here better. Look at what Agilent, Keynote or Webmetrics use. Or Akamai.</p>
