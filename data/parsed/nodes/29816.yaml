    <p>I’m in the roots process of creating a new identity system for myself, and wanted to know what the growing consensus on some topics were.</p>
    <p>1. My name versus a clever amalgamation  example: Andrew Sipe Vs Clever Amalgamation Designs<br>
    Is this professional? Is it acceptable? Is it the way to go if I’m the only person using it, i.e. no other employees in this company?</p>
    <p>2. Tagline : Yes or No or should I just use a title like graphic artist/designer/communicator?<br>
    Is it necessary to have a tagline/title line at all when creating a personal identity?</p>
    <p>3. What are some resources or guidelines I should consider familiarizing myself with when creating my identity system. I’m guessing there isn’t much difference between a personal ID system and a professional company ID system, but I could be mistaken. </p>
    <p>I’m sure I’ll have more questions as this topic develops out, until then I’d be happy to read your honest insights and opinions on the subject. </p>
    <p>Thanks</p>
