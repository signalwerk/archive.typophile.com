    html: |-
      <p>Oh, Clever Amalgamated Designs is just a spoof title for example purposes only. </p>
      <p>I guess going any root is perfectly fine then. I was kinda hoping there might be more of an argument against the common “so-and-so design” formula a lot of artist/designers use when creating a personal identity. Perhaps an argument like:</p>
      <p>• The artist/designer who tacks on “design” shows little creative energy to their own personal identity, might translate to showing the same energy for the customer’s projects... </p>
      <p>or</p>
      <p>• the artist/designer who uses their own name as the company name might translate to having an egocentric attitude...</p>
      <p>or for it</p>
      <p>• there could be positives to using their own name, especially if the artist/designer is well known or their name is extremely unique and would lend. </p>
      <p>I’m still not sure, I don’t want to come off as pompous and I don’t want to seem immature or under experienced to potential clients/new employers. If I use a name other than my own, I’d have to justify it some way, at least in my own mind.</p>
