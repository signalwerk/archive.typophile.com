    html: |-
      <p>Most striking thing about the lettering is the use of the runic S, which is a strange choice given the unfortunate connotations of a doubled heavy version of it during WWII. Other features are the high N with a cross stroke that meets the rhs at midpoint and the R with very large bowel. Since this is a French movie you might consider Transat, <a href="http://typophile.com/node/101182" title="http://typophile.com/node/101182">http://typophile.com/node/101182</a>,  a geometric sans serif typeface with the correct proportions for N and R. It has caps inspired by Art Deco signage — found inside the “Gare Maritime”  ocean liner terminals at Le Havre and Cherbourg, in the early 1930s. Unfortunately Transat is too rounded. What would really help is as squared off version like <a href="http://www.myfonts.com/fonts/letterbox/berber/" rel="nofollow">Berber</a> or Compacta.</p>
      <p>Don</p>
      <p>.</p>
