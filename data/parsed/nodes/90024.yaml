      <p>Kent’s answer is correct. I’ve used that technique and it works. In that case I asked the printer for a sample of a book they printed to similar specs. </p>
      <p>On layout issues, be cautious about taking your printer’s advice. If the book comes back with layout problems, you’ll get blamed anyways.</p>
