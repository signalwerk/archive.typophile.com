    votes: null
    html: <p>You have to talk to your printer about this (assuming you are having it printed, and this isn't a one-off laser job). It will depend on how the job is printed, folded, and imposed. The rule that one printer gives you (or that you get on a discussion board) will be completely wrong for another printer using different equipment and methods.</p>
