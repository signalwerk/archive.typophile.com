    html: |-
      <p>Or find a published book with similar trim size, page count, paper stock, and binding method and use it as a poor-man’s bound dummy.</p>
      <p>Take a print-out of your sample page, trim off a little extra along the gutter margin, and insert the page so that the fore-edge is flush. Then note where your inside margin appears to fall. Adjust to taste. When it looks good, it is good.</p>
