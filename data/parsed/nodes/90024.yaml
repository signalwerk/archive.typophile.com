    <p>Hi, </p>
    <p>I'm designing a book with over 300 pages, thread stick-bound. </p>
    <p>I usually add 5mm-10mm on the inside margin to compensate for this but does anyone have any typographic rules of thumb? Always handy!</p>
    <p>Thanks</p>
