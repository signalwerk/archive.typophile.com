    html: |-
      <p>With an imposition of 16 pages logic dictates that the ‘compensation’ should be n*x, where n is the paper thickness and x is the order of the spread in relation to the inner one.</p>
      <p>Fun aside — any printer worth his/her salt will have impo-software that compensates automatically.<br>
      Not something a designer has to worry about.</p>
