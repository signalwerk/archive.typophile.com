    date_raw: 17.Dec.2004 3.16am
    votes: null
    html: '<p>Romesh,  <br> <br>Instead of ITC Weidemann, you could use Octava (ParaType), that has similar proportions and is also equipped with smallcaps:  <br><a href="http://www.myfonts.com/fonts/paratype/octava/" target="_blank">http://www.myfonts.com/fonts/paratype/octava/</a> <br> <br>You can also take a look at Adonis (ParaType):  <br><a href="http://www.myfonts.com/fonts/paratype/adonis/" target="_blank">http://www.myfonts.com/fonts/paratype/adonis/</a> <br> <br>Instead of Trade Gothic, you can use Bell Gothic (ParaType):  <br><a href="http://www.myfonts.com/fonts/paratype/bell-gothic-bt/" target="_blank">http://www.myfonts.com/fonts/paratype/bell-gothic-bt/</a> <br>or New Letter Gothic (ParaType):  <br><a href="http://www.myfonts.com/fonts/paratype/new-letter-gothic/" target="_blank">http://www.myfonts.com/fonts/paratype/new-letter-gothic/</a> <br> <br>Regards, <br>Adam</p>'
    html_clean: '<p>Romesh,  <br> <br>Instead of ITC Weidemann, you could use Octava (ParaType), that has similar proportions and is also equipped with smallcaps:  <br><a href="http://www.myfonts.com/fonts/paratype/octava/" target="_blank">http://www.myfonts.com/fonts/paratype/octava/</a> <br> <br>You can also take a look at Adonis (ParaType):  <br><a href="http://www.myfonts.com/fonts/paratype/adonis/" target="_blank">http://www.myfonts.com/fonts/paratype/adonis/</a> <br> <br>Instead of Trade Gothic, you can use Bell Gothic (ParaType):  <br><a href="http://www.myfonts.com/fonts/paratype/bell-gothic-bt/" target="_blank">http://www.myfonts.com/fonts/paratype/bell-gothic-bt/</a> <br>or New Letter Gothic (ParaType):  <br><a href="http://www.myfonts.com/fonts/paratype/new-letter-gothic/" target="_blank">http://www.myfonts.com/fonts/paratype/new-letter-gothic/</a> <br> <br>Regards, <br>Adam</p>'
