    html: "<p>For the regular weights, of 'Trade Gothic', maybe you could try using '<a href=\"http://www.paratype.com/pstore/default.asp?search=Bell+Gothic&amp;fcode=PT_BLL\" target=\"_blank\">Bell Gothic</a>' ( Cyrillic ), from <a href=\"http://www.paratype.com\" target=\"_blank\">ParaType</a>, as an alternate.. <img src=\"http://www.typophile.com/forums/clipart/plain.gif\" border=\"0\"> <i>( And, maybe an alternate for 'Trade Gothic Bold Condensed', at least.: '<a href=\"http://www.paratype.com/pstore/default.asp?search=DIN+Condensed&amp;fcode=PT_DNC\" target=\"_blank\">DIN Condensed</a>' ( Cyrillic ), from <a href=\"http://www.paratype.com\" target=\"_blank\">ParaType</a>.. )</i></p>"
    html_clean: "<p>For the regular weights, of 'Trade Gothic', maybe you could try using '<a href=\"http://www.paratype.com/pstore/default.asp?search=Bell+Gothic&amp;fcode=PT_BLL\" target=\"_blank\">Bell Gothic</a>' ( Cyrillic ), from <a href=\"http://www.paratype.com\" target=\"_blank\">ParaType</a>, as an alternate.. <img src=\"http://www.typophile.com/forums/clipart/plain.gif\" border=\"0\"> <i>( And, maybe an alternate for 'Trade Gothic Bold Condensed', at least.: '<a href=\"http://www.paratype.com/pstore/default.asp?search=DIN+Condensed&amp;fcode=PT_DNC\" target=\"_blank\">DIN Condensed</a>' ( Cyrillic ), from <a href=\"http://www.paratype.com\" target=\"_blank\">ParaType</a>.. )</i></p>"
