      <p>The two typical sides of the argument are too superficial. One side likes to break rules, the other likes the status quo, and both sides rationalize away to suit their personal preferences. That’s not Design. Few people bother to really worry about how written language actually works. It is in this consideration that the Minimalism espoused by those who want to “simplify” language is flawed. We need richer information, not poorer.</p>
      <p>Commas: I myself use too many of them. They make a written piece more conversational, which can do unwarranted harm to immersive reading in some contexts. In that Spatium article I wrote, at the end I went back and -carefully- pulled out ~50 commas. So about one for each 50 words. It became more true to its medium, hence more functional.</p>
      <p>hhp</p>
