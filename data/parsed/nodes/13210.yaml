      <p>The assertion that “context makes it redundant” boils down to demanding that people waste more time explaining themselves. Already, when I say “literally,” I have to stop and explain that I mean “literally” literally. Once upon a time you could just use the word and trust that people know what it means.</p>
      <p>There’s a pervasive attitude today of “I can do whatever I want,” shouting down any question of whether something is a good thing to do. Try to explain to people that “barter” does not mean “haggle,” and they’ll figuratively jump at your throat. “LANGUAGE CHANGES, OLD MAN! EVERYBODY KNOWS WHAT I MEAN SO SHUT UP!” Yeah, fine, but then we’re left without a word for barter. Language is fluid, but there’s a lot to be said for directing the flow.</p>
      <p>There are all kinds of existing ambiguities that pop up in our language and have to be talked around. Why add more? The apostrophe takes up almost no space; why would you want to replace it with words? “The chicken broke James’ fast.” You have a pretty clear idea of what that means, and it only took a millimeter to clear up any confusion.</p>
