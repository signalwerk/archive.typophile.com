      <p><cite>As a person who is helping to destroy American English through marketing language (Think Different - catchy but notoriously incorrect)</cite></p>
      <p>Marketing and advertising will in no way “destroy” the English language. Every language naturally evolves over time, new words are added, archaic ones are forgotten, meaning shift, foreign vocabulary becomes integrated, punctuation standards change, etc.</p>
      <p>Oxymorons, unconventional phrasing, and things of those natures are not “incorrect” usages of language— especially with advertising. Catchy is the point. The only way you can improperly use a language is to use the wrong rhetoric in the wrong situation. Think of Japanese for example, there clear levels of formality how you speak and write to certain people. Every language is like that though; in any setting there are certain things that are appropriate and inappropriate to say. </p>
      <p>However, those examples are more deeply based on social constructions than on language. Language and the way it is used and accepted has very deep roots in local cultures… </p>
      <p>Also, there is nothing wrong with commas.</p>
      <p>r.k</p>
