      <p>English may seem overpunctuated to Europeans because it is so efficient and concise.</p>
      <p>Try saying that in French in 13 words! Without a comma yet. </p>
      <p>English may convey as many points, with as much complexity as French or German, but in smaller space. Compressed sentences may create a need for more, or at least a higher percentage of clarfying marks. </p>
      <p>“Oh, I see. I thought this meant that James was broken quickly by the chicken. What an interesting mental picture!” </p>
      <p>It’s a bigger problem than punctuation when people confuse very different words ( barter  haggle ). No book about punctuation can solve that. There will always be people who care about language (type, poetry, art, etc.) and those who don’t. </p>
      <p>When a ‘Great Leader’ says nuke-yuler on a regular basis, it’s easy to lose hope. That’s lose, not “loose”….</p>
      <p>;)</p>
