      <p>The apostrophe is an interesting piece of punctuation. Unlike the comma, semi-colon, etc. — and even the exclamation mark when used grammatically —, the apostrophe seems almost an accidental mark. Its uses in English are the result of the way in which we idicate the possessive with s and our tendency to contract through vowel ellision. Neither of these characteristics of English are what I would consider fundamental aspects of language, unlike for example words, clauses and phrases, which are, of course, the domain of the comma, the semi-colon, etc.. The latter are grammatical punctuation marks in the full, linguistic sense of the term grammar; the marks themselves are conventional, but what they indicate is not conventional and is common in one form or another to all human languages.*</p>
      <p>The apostrophe is a conventional mark that indicates things that are not quite conventional, but not essentially grammatical either. There are many ways in which languages can indicate possession: it just so happens that, since the decline of noun casing, English has evolved a means of indicating possession that is helpfully indicated by an apostrophe — helpfully because the method of indicating possession is all but identical to the method of pluralising a noun. As Kevin notes, this can result in ambiguities, which the apostrophe resolves. The apostrophe is similarly helpful in indicating contraction, although in that case the usage is more distinctly conventional, since contractions have no grammatical function: they are simply verbal laziness.</p>
      <p>The argument that ‘Language changes, so I can abuse grammar as much as I like’ is a different form of laziness. Language does change, of course, or rather the conventional aspects of language change. They are fluid and they evolve over time. Words, for example, assume new meanings and lose old ones. But the essential elements of grammar change very slowly if at all and, arguably, once they change one no longer has the same language. Old English is not the same language as modern English, not because it uses different spellings and earlier forms of words, but because it is grammatically distinct. Old English is an inflected language in which word order is not very important to meaning, while modern English is largely uninflected and word order is absolutely essential to meaning. Inflection also means that Old English had no need for an apostrophe, because possession was indicated by the genitive case of the noun.</p>
      <p>Possession is a basic aspect of language, and so long as English indicates possession by adding an s to a noun, the apostrophe will remain useful for anyone who cares for precision and wants to avoid ambiguity. If someone really wants to get rid of the apostrophe, he should invent a new way of indicating possession. Personally, I’m all in favour of a return of the genitive case. :)</p>
      <p>_</p>
      <p>* It is worth noting that not all writing systems mark all aspects of grammar equally. The most important punctuation in English is not a mark at all, it is the space between words, but some writing systems do not indicate word breaks at all: in these, the phrase is the smallest <em>visually</em> distinct element. Yet the concept of the word is common to all languages, as far as I know, and the ways in which words relate to each other morphologically is quite limited across the many thousands of human languages.</p>
