      <p>I agree with rkeller. Language is flexible and fluid because it’s a mode of expression, but writing is a system within that mode of expression. It’s a set of practices based on common understandings which either yield rules or exist because of them. So, while I think change is inevitable, removing something because some people are too <strong>lazy</strong> or poorly educated seems foolish to me.</p>
      <p>The apostrophe, in particular, is a useful signifier. I’m sure we could abolish the letter ‘k’ as well, but do we really <em>need</em> to? Some parts <em>add</em> flexibility and depth, even if they are part of a rule or are arguably extraneous. Try adding to before subtracting from language.</p>
      <p>I also dig the comma. I once wrote a sentence in grade school containing six commas, all properly used, without trying. I could tell that my english teacher wanted to reprimand me, but had no grounds for it. I loved that, and have used them liberally ever since.</p>
