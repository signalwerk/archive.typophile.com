      <p>&gt;Which language holds sway over the rules of another?</p>
      <p>Not quite that simple, of course.</p>
      <p>The Quebec government language laws stipulate that you can’t have English-only store signs in that province. (The possessive apostrophe is not French). There is no mirror-law in any anglophone province. Therefore, to create a logo that would be consistent across all of Canada, Tim Horton’s dropped the ‘postrophe. Actually, that’s a total assumption on my part, but I can’t think of any other reason they’d do it!</p>
      <p>Strangely, the very first store was named “Tim Horton”.</p>
