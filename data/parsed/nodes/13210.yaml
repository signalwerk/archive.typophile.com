      <p>I was merely passing on an observation that many Europeans have told me about the over-punctuation of American English. I happen to agree with them. Of course language is plastic, meant to be molded to suit the times. I don’t feel guilty but I also feel that marketing has a destructive influence on the English language. So be it.<br>
      Hrant - i would argue that carefully constructed minimalism can be richer. My own tastes run to haikus and other minimalist type of poetry rather than the epics of this world. They feel far more open to interpretation which suits my artistic ideal. I want to start people thinking, that’s all.<br>
