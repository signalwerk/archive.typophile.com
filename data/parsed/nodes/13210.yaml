      <p>&gt;we idicate the possessive with s and our tendency to contract through vowel ellision. Neither of these characteristics of English are what I would consider fundamental aspects of language</p>
      <p>[begin amateur linguistic rambling]</p>
      <p>Not to get off-topic or nit-pick, but I’d point out that contracting in English is a type of cliticization. Which I think is a pretty fundamental aspect of language(s). While cliticization may well not be fundamental to our understanding <em>what</em> our utterances mean, I still think that it can play a huge part in perhaps <em>how</em> we go about meaning. Which words get contracted mor productively, which get privileged over others, etc.</p>
      <p>That said, I’ve been reading a lot of Cormac McCarthy lately and he tends to eschew most, if not all, punctuation in his dialogue. And I have next to no trouble making sense of it. Although it tends toward the redneck &amp; hillbilly, with which I’m well acquainted.</p>
      <p>It may be the case however that marking possessives with an ‘s’ (<em>a la</em> English plurals) isn’t as fundamental to language as cliticization. Although I still wouldn’t want to suffer through the amibiguities were it axed from the orthography.</p>
