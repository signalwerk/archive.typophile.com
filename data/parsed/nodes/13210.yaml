      <p>Vince, you seem to have a knack for introducing subjects that generate a lot of response, whether or not the subject deserves the level of response it generates (I’m thinking your recent post on “uppercase” and “lowercase”). Give me a ring. Don’t touch that dial! The English language (and, most likely, ANY language) is filled with carryover words which may not accurately describe the items which they are supposed to describe, but everyone knows what they mean. So what’s the big deal?</p>
      <p>Punctuation, like proper grammar and correct spelling, serves a very important purpose: to make the intent of the written word as clearly understandable as possible. People who write well generally use grammar properly, spell correctly, and punctuate accurately; unfortunately, it seems that such people are becoming increasingly rare.</p>
      <p>One of the arguments the referenced article puts forward seems to be that, since so many people don’t know the rules, it’s time to chuck the rules. Great: in order to make the unschooled (or unmotivated or uncaring or whatever) feel better about their shortcomings, we should impoverish the language. Sorry…I don’t buy it.</p>
