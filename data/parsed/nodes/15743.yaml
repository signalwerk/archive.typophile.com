    <p>Hello TypeGurus - </p>
    <p>I am relatively new to this site and have been looking through some of the logo critiques and thought some of you may be able to lend your expertise to a project I am working on for the California Clean Money Campaign. The CCMC is an organization that is working towards removing private campaign contributions with public funding - here is their website and as you can see, their very long, quite plain, current logo, on the top left.</p>
    <p><a href="http://www.caclean.org/" title="http://www.caclean.org/">http://www.caclean.org/</a></p>
    <p>Basically they are looking for something this is "inspiring". Unfortunately we couldn't go with things like "taking the pricetag out of politics" since this kind of messaging is not as successful as voter empowerment etc.  (Move beyond corruption to voter centric messages, voters want a government that helps all voters, government that is honest, open accountable..etc.) although I thought it made a great logo.</p>
    <p>We are now at this point (Please see graphic) - which for the logo to resemble a ballot. I am trying to come up with some type of graphic for yet other versions. Keeping in mind, "clean money", or campaign finance reform, for honest, open government, fairness in elections, accountability and control...... so it's a lot of abstract ideas combined with a very long name..... </p>
    <p>The first two designs were loved by the staff, but rejected by about half of the board members because the horizontal layout reminded them too much of a movie ticket. Hence the vertical versions underneath. Any thoughts, ideas, comments, suggestions, resources would be much appreciated! (please let me know if there's more background information needed...)</p>
    <p>Thanks! Michelle</p>
    <p>P.S. I added two more older versions that were rejected. (RejectPrice.jpg &amp; Reject2.jpg)</p>
