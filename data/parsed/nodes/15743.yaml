      <p>&gt; The problem is by using visual gimmics you set the tone of the organization as not serious and your intended message might be lost.</p>
      <p>I can agree with that Dan. Lots of seemingly stupid/silly/unserious looking visual communication is HIGHLY effective. The question is what will work best. The goal of this org is to mobilize a populace. As many folks as possible stuffy isn't gonna cut it. Popular is micky mouse. Pikachu. Michelin man. Actually maybe a cartoon mascot is just what they need. Like Smokey the Bear.</p>
      <p>Also Michelle, surely campaigns like this exist in other states and or countries. Have you researched their campaign images? There might be low hanging fruit out there.</p>
