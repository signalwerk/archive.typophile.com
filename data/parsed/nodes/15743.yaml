      <p>I find that the message is too easily idetified with Politics. I know that sounds rediculous since it *is* politics. But hear me out - the issue is that you want to break with politics as usual and give power back to ordinary folks. Your visual langauge/graphic approach says the opposite. It says: "This is politics - as you usually ( visually ) see it". When I looked at this I thought - "Run away, this is the usual boring political lies' just before I started to read.</p>
      <p>I think that like me, anybody who is sick of politics as usual will look the other way before you have had a chance to get your message's foot in the door. </p>
      <p>I think you aught to use a newer fresher  opproach to type. One that is less 'political looking'. </p>
      <p>I think Dan is right. Simpler would be better too. This hurts my eyes. You can get attention without being an eyesore. It is both possible &amp; desirable. And not just for the reader - for your end result too.</p>
      <p>Just my 2 cents.</p>
