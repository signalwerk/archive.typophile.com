    html: |-
      <p>Hi guys,<br>
      I posted two more rounds of logos that were rejected, in batches previous to the ballot concept, I originally posted. One of which was a pricetag concept that I thought worked perfectly to communicate the concept of the organization very quickly &amp; effectively, while also speaking to the politically unenthused. However, as I mentioned earlier, the messaging is not as successful when speaking about corruption in politics - although it is the second most successful, it is NOT the first. Therefore the need to commuicate "honest, open government, fairness in elections, accountability and control……" which I can only visualize right now by seeing the white house busted open with a can opener and letting the contents spew out...or just making it entirely see through, like wonder woman's invisible jet...however, I'm sure we could all agree that both of these ideas are not very functional logo concepts. Therefore the kick back to voting in the 50s or when the times "seemed" a little less corrupt then they are now - which is why the concept emerged for the ballot ticket, however old-school looking... I guess I failed to mention this - and perhaps my logo does not communicate this well...and looks more like a sale sign at a money laundering store (also another concept that needs to be avoided in the logo)</p>
      <p>The second (much older) rejected logo - well that one we just sort of glossed over, since we moved onto the ballot concept, however I thought I'd share it with you, since it is a bit of a cleaner approach.</p>
      <p>However, my point being as a jaded as I am, (and only 11 years a voter), a logo that is less political looking is WAS my goal as well, which I have fervently expressed, however, definitely not the goal of an organization, that is political in every way what-so-ever. It's kind of like asking Apple to stop advertising the ipod.... Hence my dilemma. </p>
      <p>So I just saw that almost 300 folks have looked at this and only you brave five have taken a whack at it. Hopefully my next two rejected batches will inspire more folks to window shop as well as join in this critique. </p>
      <p>but I do think that stripping things down is the next step....especially when a fellow design colleague exclaims that the logo design hurts their eyes, and is an eyesore, youch!</p>
