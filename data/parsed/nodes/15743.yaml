    html: |-
      <p>Michelle, I think the price tags come the closest to realizing your intended message. That lookes like a potentially strong direction to me. And the typography hits just about the note I was interested in. Strong, legible, interesting, and approachable! I wonder what it would look like with the tag's string making a dollar sign... I wonder what a dollar sign at the bottom &amp; a politics on top and a hand pulling the two apart with explainitory text below would look like. What about cutting tag ($) off a jacket labeled politics. There are more ways to work on this for sure. Do you think you could rework this concept in some form - or is it really dead?</p>
      <p>I am sorry if my language about the political style example was too sharp. Just the result of writing too quickly. And; of course I meant that the graphic might hurt the eyes not your own good self. Cetainly as a fall back it was probably a safe one. I might have done the same thing myself. It is only the luxury of being a 3rd party that lets me be so forthright.</p>
      <p>I have worked for political orgs and I know what you mean whaen you say they are as political as can be. That is the tricky business of a designer of course - getting the client to stop asking themselves what they think they are &amp; to start thinking about what will WORK for the business or organizational goals. Sometime folk are more attached to being something than to getting something done. As the Apple advertising the ipod seems to be working I would have to argue it's not an apt anology.</p>
      <p>Having a 300 to 5 ratio is I think pretty common on typophile. It may be exagerated in this case by the topic being political. Some folks here might not agree with the goal of your camapaign. But I do. </p>
      <p>Lastly I wonder if there is some way of phrasing things so that it isn't against something but rather for something else. Thats the old trick the right-wing uses all time - being for some clever but all too ephemistic idea. That and targeted character assasination. Well we can do that too! But in this case I think it's being for something that might work best. What would say are you campaigning for? "An equal playing field in political expression"? Maybe there is a better way of putting it.</p>
