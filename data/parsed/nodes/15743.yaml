    html: <p>The problem is by using visual gimmics you set the tone of the organization as not serious and your intended message might be lost. If the leaders of the organization don't agree then I hope the best for them. Its not unusal here that the only people who can run for public office and win are billionaires who spend millions of their own money to get elected (Mike Bloomberg), mayor of New York City. The New Jersey governors race, two billionaires spending millions on their campaigns. The average person who would try to rely on public funding doesn't have a chance.</p>
