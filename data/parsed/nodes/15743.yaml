      <p>Hey Eben, Your ideas are good food for thought, the pulling apart concepts are very interesting. However as much as I think it is successful, the pricetag/money concept is something I have insisted on, yet have been told to dump, since they don't want to focus on the money out of politics issue, and I feel if I keep on pushing the issue I won't be listening to my client.... </p>
      <p>Don't worry about the comments - it's good to get your hair ruffled once in awhile! :} </p>
      <p>Hmmm, very interesting, "An equal playing field in politial expression" is definitely a good way of putting it or "Leveling the playing field of politics"... another analogy that doesn't involve speaking about money but communicates the goal of the organization in a very succint way....while bringing up new visual options.<br>
      Thank you!</p>
      <p>Oh yes,, I have looked at other orgs logos doing similar work and there's not too much going on....for example:</p>
      <p><a href="http://www.publicampaign.org/" title="http://www.publicampaign.org/">http://www.publicampaign.org/</a><br>
      <a href="http://www.vote-smart.org/index.htm" title="http://www.vote-smart.org/index.htm">http://www.vote-smart.org/index.htm</a><br>
      <a href="http://www.citizen.org/" title="http://www.citizen.org/">http://www.citizen.org/</a></p>
      <p>I guess a Mr. Clean but for politics would be a good cartoon logo... Perhaps I will look into using the look and feel for cleaning products - but that definitely is all about using loud color and is not subtle or "serious" looking at all. In terms of the seriousness of a logo, the Tivo icon is not serious, but as a user of Tivo, I certainly don't think the company doesn't take themselves seriously because they have a logo that has a smily face on it with antennas. It's just to make someone who is threatened about technology feel comforted and appeased by a silly, cute little tv-guy...</p>
