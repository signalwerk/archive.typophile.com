  html: |-
    <p>Extensis recently <a class="freelinking external" href="http://www.extensis.com/en/about/press_release_content.jsp?releaseId=9500021" rel="nofollow">announced</a> that we are getting into web font delivery. Indeed, you can see Extensis web font tech in use on that page and throughout the Extensis web site.</p>
    <p>In related news, we're also hosting a pre-conference <a class="freelinking external" href="http://blog.extensis.com/?p=4123" rel="nofollow">cocktail party</a> on Sunday, May 23rd at <a class="freelinking external" href="http://aneventapart.com/2010/boston" rel="nofollow">An Event Apart</a> in Boston. You don't have to be attending the conference to come, though. <strong>Typophiles welcome!</strong></p>
    <p>Yes, we'll be showing our web font goodness at the party.  :)</p>
