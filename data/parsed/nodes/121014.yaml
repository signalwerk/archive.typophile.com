      <p>The numbers are made to look as if they were stamped by a handheld rotary rubber stamp similar to <img src="/sites/default/files/old-images/RotaryRubberStamp_5912.jpg"> or the one described in this patent: <a href="http://www.google.ca/patents/US3955499">http://www.google.ca/patents/US3955499</a><br>
      Still looking for the base font for the numbers.<br>
      Don</p>
