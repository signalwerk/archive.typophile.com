      <p>To make a close match start with Ingeborg or Trola. I already posted the Ingeborg numbers. Here are the Trola numbers <img src="/sites/default/files/old-images/TrolaNumbers_4887.gif"><br>
      Compress. Make a few adjustments -- particularly straighten the sides on _0_ and _6_.Shift the numerals up and down for a bouncy effect. Semi stencilize and distress them.<br>
      Don</p>
