    <div class="info">Submitted by <a href="/user/3194" title="View user profile.">bruno_maag</a> : 8.May.2006 11.45am </div>
      <p>Dalton Maag issues the May Infoletter. Please find below the subjects of this edition.</p>
    <p>Bruno Maag<br>
    Dalton Maag Ltd</p>
    <p>1) Your client needs a nice font</p>
    <p>“Why do I need to buy a font? What is wrong with Arial!” If this is the<br>
    response you get when you try to convince your client to spend some money<br>
    on a good corporate font, Dalton Maag can help you…<br>
    More: <a href="http://www.daltonmaag.com/news/38.html#S1" title="http://www.daltonmaag.com/news/38.html#S1">http://www.daltonmaag.com/news/38.html#S1</a></p>
    <p>1) Ihr Kunde braucht eine schöne Schrift</p>
    <p>“Weshalb brauche ich andere Schriften - ich hab doch Arial!” Diese Antwort<br>
    erhält man oft wenn man versucht, einen Kunden davon zu überzeugen, dass<br>
    er etwas ausgeben sollte für eine gute Schrift. Dalton Maag hilft Ihnen<br>
    mit Argumenten…<br>
    Mehr: <a href="http://www.daltonmaag.com/news/38.html#S1" title="http://www.daltonmaag.com/news/38.html#S1">http://www.daltonmaag.com/news/38.html#S1</a></p>
    <p>2) Flying is funky</p>
    <p>When you fly you have the opportunity to collect Airmiles. Dalton Maag,<br>
    under art direction of London branding agency Lambie-Nairn, designed a<br>
    simple dot matrix style font as part of the new identity for Airmiles…<br>
    More: <a href="http://www.daltonmaag.com/news/38.html#S2" title="http://www.daltonmaag.com/news/38.html#S2">http://www.daltonmaag.com/news/38.html#S2</a></p>
    <p>2) Fliegen ist schöner…</p>
    <p>Mit jedem Flug sammelt man Flugmeilen. Dalton Maag hat zusammen mit der<br>
    Branding Agentur Lambie-Narin ein einfaches Punktmatrix-Font für die neue<br>
    Identität von Airmiles gestaltet…<br>
    Mehr: <a href="http://www.daltonmaag.com/news/38.html#S2" title="http://www.daltonmaag.com/news/38.html#S2">http://www.daltonmaag.com/news/38.html#S2</a></p>
    <p>3) Linotype OpenType CD</p>
    <p>OpenType is rapidly becoming the standard font format for the computer<br>
    industry. Linotype’s new OpenType CD contains all the classics from this<br>
    old type library in OpenType format.<br>
    More: <a href="http://www.daltonmaag.com/news/38.html#S3" title="http://www.daltonmaag.com/news/38.html#S3">http://www.daltonmaag.com/news/38.html#S3</a></p>
    <p>3) Linotype OpenType CD</p>
    <p>OpenType ist sehr rasch zum Standard-Fontformat für die Computer-Industrie<br>
    geworden. Die neue Linotype OpenType CD enthält alle klassischen Fonts im<br>
    OpenType-Format.<br>
    Mehr: <a href="http://www.daltonmaag.com/news/38.html#S3" title="http://www.daltonmaag.com/news/38.html#S3">http://www.daltonmaag.com/news/38.html#S3</a></p>
    <p>4) Fargo renamed to Viato</p>
    <p>Dalton Maag renames its Fargo font family to Viato after we were alerted<br>
    that some customers confused our typeface with FF Fago.<br>
    More: <a href="http://www.daltonmaag.com/news/38.html#S4" title="http://www.daltonmaag.com/news/38.html#S4">http://www.daltonmaag.com/news/38.html#S4</a></p>
    <p>4) Fargo wird Viato</p>
    <p>Dalton Maag hat seine Schrift “Fargo” zu Viato umgetauft, nachdem wir<br>
    feststellen mussten dass es Verwechslungen mit der FF Fago gab…<br>
    Mehr: <a href="http://www.daltonmaag.com/news/38.html#S4" title="http://www.daltonmaag.com/news/38.html#S4">http://www.daltonmaag.com/news/38.html#S4</a></p>
