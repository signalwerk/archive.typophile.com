  - id: 29545
    user: 1160
    date: 2002-12-05T14:20:00
    date_raw: 5 Dec 2002 — 2:20pm
    votes: null
    html: <p> I haven't heard of any problems with Photoshop in  <br>particular, however using a given font in both Classic  <br>and OS X is not always intuitive--but it's easy enough  <br>to figure out. <br> <br>In short, it is possible to activate a font in OS  <br>X and have it NOT be active in Classic. You have to  <br>think of these as two separate operating systems  <br>(because they are). <br> <br>Make sure your customers are activating the font  <br>in both operating systems if they're using the font in <br>both Classic and OS X apps. <br> <br>Hope this helps. </p>
    html_clean: <p> I haven't heard of any problems with Photoshop in  <br>particular, however using a given font in both Classic  <br>and OS X is not always intuitive--but it's easy enough  <br>to figure out. <br> <br>In short, it is possible to activate a font in OS  <br>X and have it NOT be active in Classic. You have to  <br>think of these as two separate operating systems  <br>(because they are). <br> <br>Make sure your customers are activating the font  <br>in both operating systems if they're using the font in <br>both Classic and OS X apps. <br> <br>Hope this helps. </p>
