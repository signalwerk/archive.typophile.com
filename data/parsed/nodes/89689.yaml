    html: <p>Thanks Kent. While I do like the square aspect of the font, I feel the serifs are too strong for easy reading in smaller point sizes. The one thing I don't like about Meta Serif is that the upward strokes on the M aren't straight, but instead slant outward. The ideal font would be Melior, but with a nice italic.</p>
