    date: 2012-02-03T03:39:00
    date_raw: 3 Feb 2012 — 3:39am
    votes: null
    html: <p>Ok, I checked out Melior. While it's a nice font, the italic doesn't look well-designed. It appears as if the regular font was given a slant as an afterthought in order to have an italic version of the face. Meta Serif is quite nice with a nicely designed italic. Doesn't have the same square amount as melior, but certainly more than your usual serif faces. I'm leaning toward that one right now, but still looking at other options.</p>
