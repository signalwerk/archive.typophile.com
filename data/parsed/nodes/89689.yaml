    html: |-
      <p>I think Ibis is perfect for reading. But if you want something a bit more humanist than Ibis and you want to avoid Melior, then perhaps Pagewalker, Cavole Slab or Loreto? Sommet Serif is also quite squarish but it has a very sharp texture which I think isn't what you need.</p>
      <p>Other than that I think for a squarish serif you will have to look at slab serifs. In my opinion Ibis is still your best choice though.</p>
