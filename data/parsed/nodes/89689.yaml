  html: <p>I am doing a corporate identity program and have created a logo patterned off Neo Sans and Aura. I am using Neo Sans as the display type and was wondering what would be a good serif typeface for longer entries of text, such as in a brochure. I was thinking that a typeface with slightly squared shapes would be a good, yet any search for squared serif only finds slab serif typefaces. Any suggestions would be appreciated.</p>
