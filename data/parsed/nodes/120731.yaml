    <p>Hi there,</p>
    <p>I'm looking to create some type that has the feel of The Eagles 'Hotel California' typography.</p>
    <p>The cover was art directed by John Kosh (Abbey Road) so i'm presuming it was a custom script.</p>
    <p>Any font ideas greatly appreciated.</p>
    <p>Thank you.</p><div class="imageWrap"><img src="http://typophile.com/files/SteelyKnifes_3916.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/115759928_01_6404.jpg"></div><p></p>
