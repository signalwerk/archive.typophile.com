      <p>I know what you mean Don. To me the most important is asking yourself the right questions. Why being actually here? Why posting? Why spending so much time?<br>
      My answers, all completely selfish:<br>
      1- I love this game: click it, see it, zoom it, scan it, remind it, track it, hunt it, google it, MyFonts it, search it, dig it, solve it, upload it, sample it, archive it, bookmark it, memorize it... Typologic!<br>
      2- Learning from others, knowledge is power<br>
      3- I want to know them all<br>
      4- feeding my eyes<br>
      5- geeking<br>
      So believe me, I read any line you write down, looked at all scans and type specimens you uploaded, learnt a maximum from you most of the time preferring to lurk because of ignorance. I don't care being the first one to identify a font, I don't care being thanked or not, I don't seek for any kind of recognition, I don't sell anything. I'm here for the fun, for the hunt.</p>
      <p>To know them all :D</p>
