      <p>I agree Ryuk with your opinion of Drew Mellon's work. A real lettering artist who would have been competitive in the golden age of lettering before WW II.<br>
      Recently I have come to the conclusion that we sometimes try too hard to show our encyclopedic knowledge of fonts and tend to overwhelm questioners with too many choices. I am now attempting to focus more in my answers on the choices that are the closest fit. Not easy to do, but I'm trying.<br>
      Don</p>
