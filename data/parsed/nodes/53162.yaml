    html: |-
      <p>In the top sample, it doesn't look like Urkel anymore, but it's still off balance.</p>
      <p>I think the bottom loop could be enlarged a little bit (if you want to, since this will obviously change your descender length). The top bowl could be right, or slighty too large. You'll have to judge that when you change the bottom loop.</p>
      <p>On the bottom 'gg' sample, I think they're both interesting. The first one would probably fit your current design best, although if you include such a 'g', I wouldn't throw away the double-story one (keep them both). </p>
      <p>The second one looks more like an upright italic, which is in itself interesting to explore. But you'd have to carry that style through the entire design to make it work (I think). Maybe something for a different version belonging to the same family?</p>
