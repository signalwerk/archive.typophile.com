    html: <p>I hope I'm not 'killing your darlings' too much when I say I must disagree with you on the lowercase g. I think the lower bowl is set too high. Usually with double-story g's, the top of the lower bowl sits on (or just above / below) the baseline. In my opinion, it doesn't look right the way it is now. A bit like someone who's wearing his pants up under his armpits (Steve Urkel? ;)).</p>
