    html: |-
      <p>@adiron<br>
      It is a legibility test device.  By blurring the type image, you simulate stresses (distortion) on reading the words.  It is most helpful when comparing glyphs which are similar--one, Eye, and elle as well as the r-n as m, etc...</p>
    html_clean: |-
