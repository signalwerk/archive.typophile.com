    <p>hello all, i have a litho print problem and was wondering whether someone on here can help... and so you know from the off i am from a digital background with minimal Litho experience.</p>
    <p>Anyway, Ive designed a CMYK image with black background (c100 m100 y100 k100) and various coloured layers in photoshop that use several different blend options (colour dodge/linear dodge/linear colour). However (and unlike digital print) Ive since been told by our Artworker that the black will be printed 4 times making it really thick/slow drying/shiny etc.. so ive tried dropping back the background black to C10 M0 Y0 K100 - making it a dark grey but printer friendly colour. The trouble is now that the overall colour has lost all its vibrancy since it was dependent on the Black for the Blend Layers to work.</p>
    <p>Does any one have any thoughts, tips, ideas or directions that id find useful at this point? I dont want to sacrifice the lovely black colour for a dark grey colour if i can help it.</p>
    <p>thanks.</p>
