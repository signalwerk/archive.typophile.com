      <p>If I was in your situation, I’d attempt to apply all the layer blending modes, flatten the whole file and adjust the saturation to bring your less dense black up to scratch, this may however, still be problematic, as that black will still have values from all 4 colours. Depending on your print spec, you could run the whole job with your 100% K/10% C then hit the black again with a % of the K. This, naturally, depends on the press your job is being output on.</p>
      <p>I’ve just sent a job to print, a flooded black A1 poster, thats going through twice, to get the denseness right, 5 days drying imo, and the it needs to be folded!!  :S</p>
      <p>__<br>
      Rez</p>
