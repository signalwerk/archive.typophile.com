      <p>thanks bert for the information - that really will help me make the black more of a ’richer’ black at the print process end, but after playing with it some more ive got a feeling my issue might now be a photoshop technical issue. </p>
      <p>It seems to be the various layers blend modes (which are dependent on the background colour having the black a solid black, so  the CMYK settings are right up allowing the layers to react the way they do - all saturated). Im just after a solid black background but with the sae level of saturation on the colours... something im not sure now might be possible :(</p>
      <p>Anyway, Ive provided two cropped images from the file im working on which hopefully demonstrate my predicament. The first image being the original with solid black, while the second is the black background set to C10 M0 Y0 K100 - big difference in my opinion.</p>
