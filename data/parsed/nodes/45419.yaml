      <p>In case you are using a really high grade paper in a good printshop, you could up that TIC (Total Ink Coverage) to around 350%. Provided fastdrying (UV), highintensity inks are used (Toyo — Japanese inks to be brighter), you might achieve something close to what you want.<br>
      Do some tests with different rich blacks and your effects. Flatten and sample the darker areas with the pipet in the Proofsimulation of PhotoShop. Or make PDF’s and check in Acrobat for TIC-limits.</p>
      <p>Another suggestion: use a glossy laminate or varnish to finish it off.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
