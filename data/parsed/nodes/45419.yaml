      <p>Hmm, are you referring to how it looks on-screen? If so, that’s no judge really of what you’ll get out of the printer, litho or digital. I think what you’re seeing just happens to be Photoshop’s on-screen reaction to your CMYK values and these won’t be reproduced when you print.</p>
      <p>I also think you need to Google “rich black” too. Full 100% on all four colours is only ever used for registration and other marks. You’d never print that.</p>
      <p>Essentially though your screen isn’t adequate to accurately proof your composition as its gamut will be different to that of the CMYK process. Downloading the colour profile of the output device might help, but the only way to judge it would be to have a chromalin or digital proof made.</p>
