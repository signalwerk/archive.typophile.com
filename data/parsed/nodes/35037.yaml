  html: |-
    <p>I'm a graphic designer, not a type designer. I just opened up all my Berthold fonts in Type Tool and discovered, much to my dismay, that their fonts seem sloppily drawn: baselines and cap heights consistently don't match one another between letters or even in the same letter. None of my other fonts seem to do this. Is it normal, or are they optical adjustments that I don't understand?</p>
    <p>Many thanks for your input!</p>
