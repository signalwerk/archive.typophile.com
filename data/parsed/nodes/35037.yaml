    date_raw: null
    votes: null
    html: <p>Many foundries used each other's data in the first wave of trying to collect every font in the world (early 90's). So while the outlines of Berthold's Futura might be inconsistent, I'd bet that Berthold's own designs were digitized to an extremely high level of precision. Berthold allowed Adobe to produce and distribute PS versions of their fonts only after Adobe proved that they could match Berthold's data exactly. Check one of the BQ originals like Formata, Comenius or Pontifex.</p>
