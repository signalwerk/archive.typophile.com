    html: |-
      <p>&gt; Does that help?</p>
      <p>Yes. Thanks.</p>
      <p>Your screen shots reveal that you are using the raw font files which were produced by the defunct H. Berthold AG prior to its bankruptcy. The entire collection had been hastily scanned and converted to raw fonts in PS font format, but the finishing of the raw fonts was not possible due to the sudden liquidation of the company by the Berlin court.</p>
      <p>In my documentation "The mentally deranged graphic designer as font buyer" I proved for another font collection that not all, but most font buyers are mentally deranged graphic designers. For the Berthold "Quality" collection it can be proved too that not all, but most font buyers are mentally deranged graphic designers.</p>
      <p>Several years after the liquidation of the H. Berthold AG, an American confidence trickster couple declared themselves to be the legal successors of the defunct H. Berthold AG stock corporation, and after appropriating the raw fonts, they declared themselves to be the copyright owners. For the past 10 years this couple has been selling these raw fonts in order to cheat mentally deranged graphic designers, who have not been mentally able to notice that the "Quality" fonts are the raw, unfinished font files.</p>
      <p>During these past 10 years, it seems that Mr. Yoshiki Waterhouse is the first to notice that there is something wrong with the Berthold "Quality" fonts. This proves that not all font buyers are mentally deranged.</p>
