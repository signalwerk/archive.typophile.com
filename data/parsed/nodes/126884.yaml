      <p>Well, it certainly appears to be poorly drawn, but it also appears to be based Alexei Copperplate, an early 1980s Letraset typeface:<br><a href="https://fontsinuse.com/typefaces/39787/alexei-copperplate">https://fontsinuse.com/typefaces/39787/alexei-copperplate</a></p>
      <p>No legit digital version exists, but Champagne appears to be a poor copy of it—and not a bad match to your sample (use at your own risk):<br><a href="http://www.dafont.com/champagne.font?text=Nonna+Marias&amp;psize=l">http://www.dafont.com/champagne.font?text=Nonna+Marias&amp;psize=l</a></p>
