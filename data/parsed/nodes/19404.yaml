    <p>I just finished up this interview with Micke Thornsby a.k.a. PMKFA.<br>
    His work reminds me of Jean Larcher's weirdo 70s display stuff and some Letraset typefaces, but all run through the 80s redux/electroshock blender with just a pinch of graffiti.<br>
    The article is a bit clunky, as the editorial staff at Ping seem to have trouble, well, editing.... but still, they do really well for folks whose second language is English.</p>
