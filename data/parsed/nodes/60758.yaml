    <p>I was thinking a lot about this and never found exact answer. Which fonts are better to use in long articles or books, sans-serif or serif ones? Personally I see books mainly with serif fonts and magazines in san-serif, but why? </p>
    <p>Are serif/sans-serif fonts more "comfortable" to read? How they affect reading speed? etc.</p>
    <p>So please, let's discuss.</p>
