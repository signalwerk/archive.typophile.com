      <p>I'm <em>not</em> searching for standard variation of serifs and sans-serifs. I'm just trying to find best font type (for most users of course) which is best for huge articles and books. For example here are some simple questions which I'll try to answer myself later (after an experiment), but I'm also interested in your opinion, that's why I'm here. To share my experience and listen to yours. </p>
      <p>So the first park of my questions:<br>
      1. Which font type reads faster? Sans-serif or serif? (I'll read a A4 paper in English in both font types and write down time here)<br>
      2. Which font type is more comfortable to read? (reading long peaces of text without getting tired)</p>
      <p>Please join me if you are interested.</p>
      <p>Thanks.</p>
