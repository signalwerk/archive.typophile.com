      <p>What I see, Palatine, is Roman used mostly in long stretches of book and magazine prose--and sans serif in small sizes on cheap paper (phone books and the disposable like).</p>
      <p>Bowerbird, it IS easy to prove by measuring reflectance/contrast, although that's not very satisfying. Using actual prose pieces would be interesting indeed, but prohibitively expensive and complicated, requiring identical texts in two settings divided between two pretty large groups of people who read often for entertainment and information to read them for say three hours.</p>
      <p>The results are perfectly predictable. The Roman readers will begin by immediately congratulating themselves on their good fortune, finish their texts quickly and conclude by devoting their remaining time to amicable and rewarding contextual discussion. Not so the san serif readers, oh no! They will begin by cursing the day they were born. end of Hour One: mass eye-rubbing, painful headaches. Hour Two: bitter recriminations lead to mutiny. Hour Three: fisticuffs and hair-tearing culminate in hostage-taking incidents.</p>
