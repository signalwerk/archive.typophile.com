  html: |-
    <p>Hullo all,</p>
    <p>I've decided to re-habilitate 'lost' types from old magazines as my final year project at art school. This is the first of the project, a display face intended for posters, and other applications at 72pt and up. The form / style all comes from the initial inspiration with was a glyph for the birth sign Scorpio from a 1960s Astrology mag that caught my eye, also attached.</p>
    <p>Even though the character set is far from complete, I thought it better to get some input and advice sooner rather than later, as this is all a little new to me! Any help in already existing typefaces to research, or just general criticism of the letters so far would be really helpful and appreciated! </p>
    <p>Thanks<br>
    Sam</p>
