    html: <p>Very nice!  Since this is a display face, it might make sense to emphasize the unusual characteristics in as many letters as possidble.  The "angled crossbar" does not appear in every character it could---the N, S, and s appear to me to be obvious candidates.  Making the U have a tail similar to u would also allow the angled crossbar.</p>
