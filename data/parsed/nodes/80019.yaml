    html: |-
      <p>I like the overall idea and you got it working quite well, so far.</p>
      <p>Your q and g should be based on a turned around b, not d! Your K is slightly narrow. Some parts look a bit forced, like the l, t, e, f, etc. Try to keep all angled parts at the same angle. I don't know if it works, but you should at least try it. You could make some more space in the e, by making the cross-bar angled as well. Next time show off the font with some pangrams (<a href="http://dailypangram.tumblr.com/" title="http://dailypangram.tumblr.com/">http://dailypangram.tumblr.com/</a><br>
      They show how the different letters interact. Goodluck!</p>
      <p>Jasper</p>
