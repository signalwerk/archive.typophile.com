    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Frederic W. Goudy</strong></p>
    <p>The preeminent American type designer who had created over 100 classic faces was the Art Director of <a href="/wiki/Lanston%20Type%20Co." class="freelinking" rel="nofollow">Lanston Monotype Company</a> from 1920-1947. Thirty of his designs were created specifically for Lanston and all will be available in the near future as a fitting tribute to Goudy’s typographic legacy.</p>
