    <p>The preeminent American type designer who had created over 100 classic faces was the Art Director of <a href="/node/12341" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Lanston Monotype Company</a> from 1920-1947. Thirty of his designs were created specifically for Lanston and all will be available in the near future as a fitting tribute to Goudy’s typographic&nbsp;legacy.</p>
