    html: |-
      <p>There is a new (old) wood letter manufacturer in Hamburg, Germany.<br>
      He offers not only these letters but although the possibility for designers to produce their own wood letters from their own compositions.</p>
      <p>May be someone is interested in:<br>
      <a href="http://www.holzlettern-manufaktur.de/" title="http://www.holzlettern-manufaktur.de/">http://www.holzlettern-manufaktur.de/</a></p>
      <p>And another new information about lead letters:<br>
      The follow-up company of Stempel AG is still alive and will start new activities to offer their wonderful fonts worldwide. And they can deliver any height of letters which is needes, e.g.<br>
      23,56 mm - German printing height<br>
      23,32 mm - 0,918 Inches - anglo-amerikan height</p>
      <p>If someone needs more information about this or that - please let me know.</p>
      <p>Georg</p>
      <p>Neuzeit-Grotesk halbfett, 20 p<br>
      D.Stempel AG, Frankfurt am Main<br>
      Erstguß 1928<br>
      Entwurf Wilhelm Pischer</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/1_6408.jpg"></div><p></p>
