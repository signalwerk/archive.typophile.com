      <p>Hi Carlos, thank you for the mail. I'm no expert, but I think it's an interesting take on what is an unusual source. I understand the spaces on the a, b and e which you've chosen not to join, following the example of bauhaus, but I'm thinking that it would really make it easier to read if they were joined.</p>
      <p>Are you thinking of making other weights? I would really like to see a light version of this...</p>
