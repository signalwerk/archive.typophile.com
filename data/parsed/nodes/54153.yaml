      <p>Hello, Carlos-</p>
      <p>In all, that's a great take on a Bauhaus, and a very good execution of that idea. There are a couple of things that catched my eye: the arm of the 'r' looks a bit thin, so I would fatten that up. And I would also fatten the open connection of 'a', 'b' and 'e' etc.; I like that you kept that feature of Bauhaus, but in Bauhaus that open part is on a straight line, yours is rounded, so I would compensate that with fattening those parts to enhance the readability.</p>
      <p>But in all, a great typeface.</p>
