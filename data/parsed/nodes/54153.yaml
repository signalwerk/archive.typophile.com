    date_raw: 10 Feb 2009 — 3:19am
    votes: null
    html: |-
      <p>Fabian, since you asked personally for comments, here we go ;-)</p>
      <p>I am looking at the PDF from 7th of february, in case you already corrected anything.</p>
      <p>UPPERCASE</p>
      <p>• Left stem on A feels a little thick, compare it to a straight stem, the goal is to make them look equally thick, or if you are using the contrast method (like serif fonts) when two diagonal stems are in the same letters (like A, V, W) you should have a system for this. Normally the right stem is a little thicker on A in that case (as from the broadpen), and opposite on V, W.</p>
      <p>• W is a litte bit thick in the middle part, it needs more white space there.</p>
      <p>• T is higher than S –&nbsp;perhaps it has jumped up a little bit?</p>
      <p>• B –&nbsp;perhaps it could be a little less wide?</p>
      <p>• M – I think I would try to make the vertical stems a little bit thinner, just to see if it is better or not.</p>
      <p>• N – same as M</p>
      <p>• X and Y – if you compare the left diagonal stems you'lll see that Y is thicker, they should have the same visual thickness I think.</p>
      <p>• Tail on R – a little to heavy, I believe.</p>
      <p>LOWERCASE<br>
      w – same problems as W (use same system also for all glyphs with diagonal stems). Maybe it is a little to wide aswell?</p>
      <p>k – tail to heavy</p>
      <p>j &amp; g – perhaps a little to heavy tails</p>
      <p>e – perhaps this e should be a stylistic alternate and a closed one as default?</p>
      <p>z - to heavy diagonal</p>
      <p>t – a little to high ascender</p>
      <p>x – feels to thick</p>
      <p>s – the lowercase have another touch than the uppercase S -&nbsp;I think you should make them similar.</p>
      <p>c - a little wide and too squarish? could be narrower</p>
      <p>m – a little wide, could be narrower?</p>
      <p>OTHER</p>
      <p>period – feels a little weak, comma is better</p>
      <p>Generally the spacing looks a little bit strange (especially on the lowercase), try to have as few values as possible. Start by letting all similar shapes (o, c, p, q, q etc) share the same sidebearing on the round parts, for example. The same goes for all the straight stems. Then work similar on all letters. Try to find connections. This makes the whole process easier when you are kerning later on also and can use class based kerning in a good way.<br>
      Last but not least – you have a good concept and you followed it well – now it's all about polishing details and making some more decisions.<br>
      Keep up the good work!</p>
