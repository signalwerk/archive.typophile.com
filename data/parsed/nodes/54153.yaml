  html: |-
    <p>Fontibón is based on Ed Benguiat’s (1975) Bauhaus. Moving away from Herbert Bayer’s strong influence, as a result, I am trying to obtain a Grotesque Sans, high contrast between traces and that it looks as if it was made with a paintbrush. This gives it humanistic features and a soft and femenine look. Any comments would be appreciated.</p>
    <p>Thanks!</p>
    <p>—<br>
    Carlos Fabián Camargo G.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fontibon_6656.gif"></div><p></p>
