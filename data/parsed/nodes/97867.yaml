    <p>I've been looking high and low but I can't seem to find a match. It appears to be Venetian/Garalde judging by the "E" but I could be wrong. The image is very low res so it's hard to tell if the bowel is disconnected on the "P" and what's going on with the upper serif of the "A". I'd appreciate any help identifying or at least getting close.</p>
