    html: |-
      <p>I think you are right that this is possibly <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/times-new-roman/" rel="nofollow">Times New Roman</a>. I think the poor scan may have distorted the top of the A. The shape of the S and the N, as well as the E, are all indications of some variety of Times. TNR seems a bit narrower, maybe, than your sample, when you look at the N. Also the middle arm on the E seems heavier, but the overall shapes say Times.</p>
      <p>- Mike Yanega</p>
