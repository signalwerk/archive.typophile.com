    date: 2014-08-03T07:41:00
    votes: null
    html: |-
      <blockquote><p>Have you considered preparing it as an InDesign file with placed Photoshop images?</p></blockquote>
      <p>I have when I did magazines and folders, but I don't see how that is going to help me here. Indeed I would need to be able to place InDesign files into Photoshop, and even then it seems to be an inefficient process. Frankly I don't understand why the typography panel isn't the same in all Adobe design software. I don't see why there would be a need for restrictions on the typographic capabilities in Illustrator and especially in Photoshop.</p>
      <blockquote><p>Cut and paste InDesign file into PhotoShop - Place - Rasterize - Smart Object</p></blockquote>
      <p>That's what I actually do, but it obviously doesn't maintain typographic capabilities and it's just inefficient to do the typography in one software and place it in a different software.</p>
      <blockquote><p>PhotoShop was never designed as a page design program nor was Illustrator</p></blockquote>
      <p>I don't know what page design entails exactly, but I wouldn't use it for magazines or books—that would be beyond silly. I use Photoshop for CD album layouts because they're often so heavy on illustrations and texturing that it's just much more efficient to keep working in pixels and compose the layout there. You often have to work with templates in the music industry as well for all kinds of layouts for vinyls or digi-packs that working in pixels gives you more certainty about the measurements. However, since InDesign's typographic capabilities (particularly OpenType capabilities and settings for hyphenation, justification and the Story option) are far superior to Photoshop's, I still have to outsource some work to InDesign to do the longer texts.</p>
