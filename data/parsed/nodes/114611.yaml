    html: <p>As set up you create art in PhotoShop and Illustrator and then put it all together in InDesign (or Quark, etc). As Martin mentions some things today are just easier to do in PhotoShop entirely (Like CD Covers) as the programs are much more capable today. Illustrator used to used by all sign shops since it could do vector type effects and it was the first Postscript program.</p>
