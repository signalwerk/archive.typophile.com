    html: <p>My comfort level has been quite high with illustrator since around... 1986. The issue to me is whether you want a dumb piece of graphics that needs to start over any time a change is required, or a smart composition that can flex easily in response to issues of size, output, mind changes and more.</p>
  - id: 572746
    user_id: 7409
    user_name: bojev
    user_path: null
    date_raw: 4 Mar 2014 — 4:50am
    date: 2014-03-04T04:50:00
    votes: null
    html: <p>Your point about changes is a good one - my only point was that the same thing can be done a number of different ways using a number of programs (some easier - some harder). Back in the eighties I had a few students that only knew Illustrator - then it was hard to get them to shift and see advantages to other programs . In the nineties I had students who only knew Photoshop and that not very well - then it was necessary to show them why Quark and later InDesign (and Illustrator) could do things and each sometimes better. And back in the eighties we also had graphic design faculty that only knew how to do it by hand and did not want to change. Computer graphics can make change easier, so going for the most easily changed is a valid point.</p>
