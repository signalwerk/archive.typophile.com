    html: |-
      <p>The Blend tool in Illustrator should do this. Set it up to do "Specified Steps", select the follow curve option (icon) and define the number of steps. You can create a blend along a straight line then use "Replace Spine" to map it to your ellipse.</p>
      <p>Alternatively you could make your blend then drag it to the brushes window to create a new Art Brush. You can then apply that brush to any shape or line. (You may have to expand the blend before creating the brush). I've been using this second method for emulating some engraved patterns along curved lines in decorative fonts.</p>
      <p>Working out how many steps you need and the exact shape of your ellipse to get the angles you need is then just a matter of geometry. But I guess you're looking for a way to avoid the complex calculations and potential uncertainty of the resulting angles?</p>
