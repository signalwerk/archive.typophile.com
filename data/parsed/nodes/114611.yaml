    votes: null
    html: |-
      <blockquote><p>Thinking digital means not being limited just to what one tool or mode limits you to.</p></blockquote>
      <p>That's true, though the restrictions of Photoshop make me uncomfortable. I worked with them for a long time before I finally made the switch to Illustrator for vector work and certainly these restrictions force you to think more creatively, but in the end I feel it's just very restricting while Illustrator allows you to be creative by giving you far more options to work with when it comes to vector. The same goes for InDesign and typography.</p>
      <blockquote><p>The cool things happen when you combine and overlap tools.</p></blockquote>
      <p>Could you give an example? I do use Photoshop, Illustrator and InDesign together, but it's usually because they compliment each other and not because I feel combining them allows new possibilities. For example, the typography options in Photoshop are so limited I'm forced to do it in InDesign. I think it's a terrible workflow to do an album layout in Photoshop but having to do the typography in InDesign and then drag it into Photoshop. I don't see new possibilities opening up there by being restricted.</p>
      <p>I'm thinking back at the time before I used Photoshop, where I would use MS Paint to make illustrations (and later even logos) with gradients and depth by coloring it pixel by pixel. I would say that's a creative way of doing it, but what took me hours in MS Paint took me seconds in Photoshop. So yes, being restricted forces one to think outside of the box, but from my experience it hasn't actually opened up new possibilities; it just gave more insight and appreciation of the processes and the tools. Having more options in my experience allows more artistic creativity rather than the practical creativity restrictions enforce.</p>
  - id: 584737
