    date: 2014-08-01T15:06:00
    votes: null
    html: <p>Once converted to bits you add another level of things you can do. Thinking digital means not being limited just to what one tool or mode limits you to. You are right Martin that Illustrator has an advantage if you only limit the tool you use. The cool things happen when you combine and overlap tools.</p>
