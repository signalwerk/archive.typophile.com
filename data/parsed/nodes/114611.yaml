    html: |-
      <p>&gt; PhotoShop was never designed as a page design<br>
      &gt; program nor was Illustrator</p>
      <p>Yes, Photoshop, Illustrator and InDesign are very different programs designed to do different things.</p>
      <p>&gt; I don't see why there would be a need for restrictions<br>
      &gt; on the typographic capabilities in Illustrator ... and Photoshop</p>
      <p>It's because Illustrator and Photoshop were never intended to be used for page layout (except in a limited way), and adding InDesign's features would add size and complexity to programs that are already big and complex.</p>
