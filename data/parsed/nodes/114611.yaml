      <p>Thanks bojev, I didn't realize that was possible, but I just tried it and it works. It'll come in handy sometimes.</p>
      <p>But although that technique works fine, one problem is that you must repeat the process, including positioning, if the InDesign file is updated.  But when placing a Photoshop file into InDesign, you can update the image in InDesign with one mouse click, and it will automatically have the same size, position and attributes. </p>
