    html: |-
      <p>&gt; having to do the typography in InDesign<br>
      &gt; and then drag it into Photoshop</p>
      <p>Have you considered preparing it as an InDesign file with placed Photoshop images? </p>
      <p>Native Photoshop files, even layered ones, can be placed directly into InDesign as images. And if the Photoshop file is updated and saved, you can update the image with one click in InDesign's Links panel.</p>
      <p>(I wish it was possible to do the reverse and place InDesign files directly into Photoshop, but I don't think it's possible unless you make a PDF first.)</p>
