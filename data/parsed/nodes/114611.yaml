    html: <p>To change the orientation and position of the type on a path in Photoshop, select the Path Selection Tool, place the cursor over the text until you get a little black arrow on the type cursor, then Drag the cursor below the baseline to flip the type. Use the same method to flip the text and place it inside a shape.</p>
