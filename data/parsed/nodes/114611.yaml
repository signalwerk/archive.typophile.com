    date: 2014-08-03T04:44:00
    votes: null
    html: <p>PhotoShop was never designed as a page design program nor was Illustrator, but recent versions of Illustrator do support multiple pages. Knowing what tool is best is part of the choice we make when we begin a project. Back in the day we could not use PhotoShop for whole pages due to RAM limits and processor speeds. Today you can make big files fast and it allows for some cool effects we just could not do with limited tools.</p>
