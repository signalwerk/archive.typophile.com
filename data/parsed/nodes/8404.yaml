    html: <p>Some Googling came up with this <a href="http://www.linotype.com/7-600-7/waltertracy.html" target="_blank">profile of Walter Tracy</a>, who designed a couple of fonts for the Daily Telegraph. 'Telegraph Modern' and 'Telegraph Newface' are both mentioned, but not linked (not Linotype faces, and maybe not commercially available -- I haven't looked for them yet, but I will.)</p>
    html_clean: <p>Some Googling came up with this <a href="http://www.linotype.com/7-600-7/waltertracy.html" target="_blank" class="link-external">profile of Walter Tracy</a>, who designed a couple of fonts for the Daily Telegraph. 'Telegraph Modern' and 'Telegraph Newface' are both mentioned, but not linked (not Linotype faces, and maybe not commercially available -- I haven't looked for them yet, but I will.)</p>
