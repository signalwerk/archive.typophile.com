    date_raw: 1.Jan.2005 8.32am
    votes: null
    html: <p>Some other information I found made it sound as if Linotype Modern = <a href="http://www.myfonts.com/fonts/bitstream/modern-880/modern-880/testdrive.html?s=These+boots+made+for+gawping&amp;p=36" target="_blank">Modern 880</a> = Telegraph Modern, but it is not identical to your sample. There are similarities, so I'd guess it is some variant of a Modern.</p>
