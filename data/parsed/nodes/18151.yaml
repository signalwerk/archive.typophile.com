      <p>Added Value is the name of the game.</p>
      <p>Firstly, there is perceived value: when everyone else is using the same fonts and your work stands out with special typography, that's worth something extra in the marketplace. To you, to your employer, to the client. </p>
      <p>Having a library of non-standard fonts, and knowing how to use them, is a value that a designer/design firm brings to any client relationship. Note that Mr Cheese advertises his font library on his web site; it is a benefit of doing business with him. </p>
      <p>Fonts that come bundled with applications or operating systems don't add value, because they are over-exposed.</p>
      <p>Secondly, working with fonts acquired for a specific design project helps create design synergy, which is more productive than wringing your brain for the big idea that will add  life to otherwise hackneyed-looking typography. Fonts have formal qualities which can be leveraged to drive design concepts.</p>
      <p>"Free" fonts don't add value because they lack typographic sophistication: it's difficult to do good work with poor tools.</p>
