      <p>"I need assistance in developing a concise statement of why exactly typefaces cost as much as they do. "</p>
      <p>Since typefaces don't all cost one thing, it's hard to concisely say why they cost what they do. Your boss should understand the relationship between pricing and availability/functionality. Many fonts are free, or come with OS, Applications, or other acts of bundling, and through their wide availability, they are not likely to produce distinctive enough communications for some users. So, less widely distributed fonts may cost $1,000 or more when installed on a network in order serve the particular taste and function of a readership, and none other, and thus be disctinct from the free font crowd.</p>
      <p>If he don't yet get it, tell him he can get free clothes at any number of locations in every city in America. So, ask him why he buys clothes.</p>
