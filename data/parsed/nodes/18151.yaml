      <p>&gt; <em>He doesn’t see why, when fonts are everywhere, why one should have to pay $15+ for one.</em></p>
      <p>This is an unfortunate mind-set that is pervasive throughout this new age of digital distribution. It affects all forms of intellectual property that has been made readily accessible on the Internet; music, literature, motion pictures, photography, illustrations, typefaces, and the list goes on. </p>
      <p>I will make no attempt at giving an explanation to give to your boss or clients. But to put it simply AND mildly -- <em>readily accessible DOES NOT EQUAL available for free</em>!</p>
      <p>The price of a font and the value of a typeface are two different things. What unfortunately has happened within the type industry itself, is that well-known reputable font development companies joined up with hardware/software development companies twenty years ago and began <em>bundling</em> libraries of type with PCs, Macs, printers, software packages, etc., resulting in the proliferation of the "fonts for free" notion and devaluation of font software.</p>
      <p>This all happened BEFORE type development programs became available to run on simple PC/Mac platforms... so the excuse that cheap fonts and free and pirated fonts were the original cause of the problem -- it wasn't so.</p>
      <p>The "bigger" foundries initiated the proliferation of "free fonts" and the smaller type developers of the past ten years are almost crippled by it. The current habit of novice and hobbiest type designers releasing their designs at little to no cost keeps exacerbating the problem.</p>
      <p>I have no solution to what is already out there, but just because one particular typeface may cost $15 doesn't determine the value of ALL typefaces. Just like a pair of classic men's Gucci loafers will cost anywhere from 20 to 50 times more than loafers from Payless.</p>
