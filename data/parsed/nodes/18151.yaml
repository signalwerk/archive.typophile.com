      <p>Font prices, like everything else, are determined by market forces.</p>
      <p>When Adobe began selling digital fonts in the late eighties, a two-font package (the smallest package they offered) was $145. This is $72.50 per font, or about $113 per font in 2005 dollars. Since then, font prices have dropped considerably. Today, most single fonts are sold for $20-$40 each. Purchased in multi-font packages, the price per font is even lower.</p>
      <p>Incidentally, although it does take a lot of work to create a font, that's not what determines the price. A movie costs millions of dollars to make, but you only pay $8 to see it. The reason is that millions of other people will pay to see it, too. The font market is much smaller in comparison, probably in the tens of thousands of potential customers. Everyone else just uses fonts they get for free or bundled with software or whatever happens to be installed on their computers. Everyone who has a computer uses fonts, but only a small percentage actually buy fonts. These are mainly professionals, who understand the value a unique font can add to their work and consider the cost of a font just part of doing business, like using FedEx or buying equipment. For these people, font prices are not high at all.</p>
      <p>Finally, the reason you see fonts everywhere is because, by nature, they are designed to be reproduced. There is no limit to how often a single font installed on a single computer may be seen on books, magazines, tv, movies, packages, websites, video games, etc. It just depends on the kind of work being produced on that computer. You just never know.</p>
