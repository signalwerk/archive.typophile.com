      <p><em>why exactly typefaces cost as much as they do</em></p>
      <p>What your boss lacks is perspective. When he (or she) travels on business, does he/she fly coach, or does he/she fly first class, or even business class? Is there a difference in price? Why do first class and business class cost as much as they do?</p>
      <p>If the average businessperson were capable of writing clear, concise and forceful prose without resorting to the standard formula of <strong>bullsh*t-bullsh*t-buzzword-bullsh*t--buzzword</strong>, then the choice of the typeface used in a proposal or presentation wouldn't be such a big deal: the force of the ideas presented, not the bling used to present them, would carry the day. Unfortunately, the VAST majority of business proposals and presentations which I have seen follow the standard formula to the letter: all style and no substance. As a result, the average businessperson  needs all the window dressing that he or she can get (regardless of price) to disguise his/her lack of originality, insight and content. I hope that this answer meets or exceeds your expectations.</p>
