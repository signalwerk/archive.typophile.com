      <p>&gt; <em>why exactly typefaces cost as much as they do</em></p>
      <p>There are several issues at play here, and as an ex-type-and-font marketing person, I haven't seen much innovative or inspiring progress in increasing the <em>perceived value</em> of typefaces <em>as design tools</em>.</p>
      <p>What I mean is, the typeface as it stands on it's own DESIGN merit, and not on font technology (OT, addition of alternates, special characters, integration with software capabilities, etc.).</p>
      <p>Though I am not currently employed to do any type marketing, it remains a personal mission of mine to increase the value of type as designs and typography as practice. Hopefully, by the time TypeCon 2006 comes around, several of us will be willing to take on new, innovative and inspiring approaches to offset the <em>fonts have little value</em> mind-set of the general type using marketplace (the <em>Great Unwashed</em>).</p>
      <p>I've hashed out several TONS of --<br>
      <em>- Type helps the message<br>
      - Type makes you stand out<br>
      - Type grabs the reader<br>
      - Type can influence the mind<br>
      - Type makes it SEXY</em><br>
      etc.</p>
      <p>Time for something truly new!</p>
