      <p>If you tell perspective font buyers that <em>unique well designed typefaces</em> will make their work stand out from the crowd, you will need to show them, plus give more specific reasons why one particular typeface or family will work better in certain uses than others without resorting to <em>marketingspeak</em>.</p>
      <p>You may not be able to convince penny-pinching business people, but you can convince graphic designers that typefaces can add great significance to a piece, just as important as professional or stock photography. The difficultly is in qualifying such claims.</p>
      <p>Yet many women buy perfume (and men, cologne) strictly on the hopes of becoming more alluring to others without any guarantees from the perfumery... and <em>cheap perfume</em> has unmistakable connotations.</p>
