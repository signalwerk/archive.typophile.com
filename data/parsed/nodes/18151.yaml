      <p>I'd like to state this more eloquently, but at the moment, the cold remedy pills I took own most of my brain cells today.
      </p><ul>
      <li>
      It is easy enough to equate uniqueness and rarety with value. Being "different" is worth something, but misusing distinctive type designs will make most readers turn away from the page as much as any over-used typeface.</li>
      <li>Based on the <em>wannabee factor</em>, ITC was able to set the type buying/specifying market on fire with eye applealing use of type in <em>U&amp;lc</em>. But the truth is you can dress your date like Angelina Jolie or Brad Pitt (take your pick) and the common person will still not turn any heads when walking into a restaurant. There is something more to unique typography than just picking typefaces.</li>
      <li>
      The "workhorse" typefaces are oftened malaligned based on the fact that they have so much utility and stand up under rigorous missuse no matter how many thousand users set jobs with them. But a designer/typographer with <em>unique skills and vision</em> can make Gill Sans look like a $2000 suit.</li>
      </ul>
      <p></p><p>I hate to keep repeating myself, but tired old reasons to buy type isn't going to improve marketability any more than Wonder Bread's slogan <em>Builds bodies twelve ways</em> does for white bread these days.</p>
    html_clean: |-
