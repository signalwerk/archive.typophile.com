    <p>Good day.</p>
    <p>I need assistance in developing a concise statement of why exactly typefaces cost as much as they do. I personally understand and appreciate the value of type, but I don't have enough technical knowledge of the processes involved to really help someone else appreciate it.</p>
    <p>Immediate application of this would be presenting it to my boss with a proposal to purchase a font. He doesn't see why, when fonts are everywhere, why one should have to pay $15+ for one.</p>
    <p>I wanted input from people who had been in this specific industry for an extended period of time who would be able to express, much more effectively than I could, reasoning supporting type value and how it translates to cost.</p>
    <p>Any assistance would be most helpful. Thanks!</p>
