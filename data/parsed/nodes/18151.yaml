      <p><em>Yeah… but I misread the directions. It read take 2 pills every 6 hours, but I’ve been taking 6 pills every two hours! Nighty night folks. :-\</em></p>
      <p>An inspiration to us all.</p>
      <p>Thomas: what a great article. Thanks for spending the time to write the piece. I know how long writing can take and it's a pretty neat thing that you can do it at least partly in professional capacity.</p>
      <p>Norbert: <em>"...but tired old reasons to buy type isn’t going to improve marketability any more than Wonder Bread’s slogan Builds bodies twelve ways does for white bread these days."</em> Wonder Bread is really good with peanut butter banana and bacon grilled like a cheese sandwich. But that notwithstanding, tired old reasons to buy type isn't going to improve marketability is a useful standpoint.</p>
      <p>From a business case point-of-view type is cheaper than logos and effective logos are usually part of an ID system and using unique/appropriate type in a consistent fashion is way cheaper than an ID system. So really compared to other marketing tools, type is relatively cheap.</p>
      <p>Type is ubiquitous. So keeping the business case point of view, one can argue that type is insanely economical because you can, and do, use it with relative impunity and people see way more of it than almost all of your other communications and they see it more often. So seen in this light, type is probably one of the most economical marketing expenses ever.</p>
      <p>Here's a new one: good type is a great design device, and so if you are doing print communications of any kind, type is more economical and flexible than photography and custom artwork. Present it as a design challenge to the designer in a creative brief. No photos. Just type. Type also reproduces very well in a single colour. Lower copying costs in short run office printing and lower costs in large run press publications.</p>
      <p>You can also do object lessons: Take a business letter and remove all the spaces and cpas and punctuation and set it in Courier. Then add spaces, then punctuation, then other adjustments until you have a formatted document. The change the courier to something else like Dolly and something like Frutiger and add some nice leading and spacing. Put them all in a row and say "That's what type can do."</p>
      <p>Is this the kind of thing you're talking about?</p>
      <p>Jon</p>
