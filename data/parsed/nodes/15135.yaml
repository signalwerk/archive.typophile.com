      <p>I don't know about that. Remember, I know very little about actually <cite>using</cite> type. But thanks.</p>
      <p>To be fair, I think Palatino has a lot going for it. It has arguably suffered the least from -and continues to serve well after- its "Laser 35" ubiquity. On the other hand, it has unfairly upstaged Aldus, its more textish sibling. Basically, its x-height is too big* and that limits it more to larger point sizes. Admittedly however that suits its calligraphic nature (the type of thing that looks best large... kinda like a dumb blonde though). Speaking of its calligraphic aspect, the most memorable experience I've had with Palatino is holding some sorts from a large metal size of it in my palm, and not being able to help feel "this is wrong"; on some level it just doesn't seem right to have such shapes carved/cast into a metal parallelepiped.</p>
      <p>* Which might have still made it great for really small point sizes, except its spacing isn't loose enough for that.</p>
      <p>hhp</p>
