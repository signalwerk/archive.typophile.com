      <p>Alright, I give in: if Optima isn't your thing, then I'll cast my vote for meta (FF meta) as well. It's a solid, progressive sans. I really can't argue against it.</p>
      <p>Just a note about Optima:</p>
      <p>Don't forget that of all the well-known sans faces, Optima is unique: It is a sans that is nearly a serif. It is probably the most elegant sans face I have seen. I wouldn't be far off the mark by saying that Optima is a sans version of Palatino. And Palatino is, with aknowledged subjectivity, the greatest serif face ever designed. It retains most of its charm in its digitized version (yes, updated charm, but still looking good), and in light of the absolute farce that is digitized Bembo and Centaur, that's saying alot.</p>
      <p>Just in case you're interested in a *good* Palatino, look no further than the version (Linotype) sold at Adobe: PalatinoLTstd. Decent variety, sc/osf included, of course.</p>
      <p>But yes, meta would be a good choice for a sans.</p>
