      <p>OK, so I'm redesigning a magazine.</p>
      <p>It's a business magazine.</p>
      <p>The demographic is 24-40, management/skilled/educated, heavily digital, mostly men (surprise!), and focussed on financials, techno gadgetry, management/sales/marketing advice, regional trends, and simplicity.</p>
      <p>The market historically is a provincial rah-rah town. "But now, it's really becoming a different city!"</p>
      <p> It's currently (mainly) an Akzedenz book.</p>
      <p>Here's my formation of the problem: If the magazine is to be distinct, and, if "it's really becoming a different city" then maybe something less common than Akzedenz, something more cosmopolitan, something with some curves, some sophistication, would make the book uncommon, more thrilling, more of an artifact, than it currently is in dear ole Akzedenz . . . </p>
      <p>- and it's gotta be a sans, because "sans is, like, it's like the web."</p>
      <p>(a pie of evil is still a pie.)</p>
      <p>Any helpful comments would be . . . most helpful.</p>
      <p>-yes, my first post. I very much enjoy typophile. thanks go out to vurt and anorak for mentioning it often enough to finally get me here.</p>
