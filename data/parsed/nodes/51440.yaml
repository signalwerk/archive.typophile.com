    html: |-
      <p>Well, Thomas - my main concern was to not stray too far away from my knowledge area ;)<br>
      My goal is to make very useable multilingual displayfonts, and so I had to know how to properly make the glyphs.</p>
      <p>I have previously done many customized fonts to cover northern and eastern european languages, so I felt very confident I could do proper letter and diacritic design for all Latin-1 and Latin Extended-A glyphs. Then I started looking into which languages would be covered by these glyphs, and found quite a few additional languages that would be covered by adding just a few additional composite glyphs. So I included those, too.</p>
      <p>The reason I cover some obscure european languages is basically that their glyphs are covered by these two Unicode blocks and simple composited glyphs.<br>
      I don't know specifically the usage of e.g. Rhaeto-Romance, but my fonts have all the glyphs needed to write it, so I include it it my language list :)<br>
      The Ibreve/ibreve glyphs (from the Extended-A block) are included, although their usage apparently are for cyrillic languages...</p>
      <p>Many african languages require modified letterforms (hooks and curves and loops and whatnot ;) and as I have no direct knowledge of how to properly design these (their history and how they are usually implemented) I chose to not include them. Because of their sometimes "awkward" letterforms they would also make kerning much more time-consuming, and all this extra time would work against my idea of low-cost fonts.<br>
      AND the Eng character used for african languages has a completely different design than the Saami Eng - I didn't want to muddle things up with that (as I live in Saami-speaking territory this is perhaps the most important reason for me :)</p>
      <p>As for the asian coverage: well, I do have Tagalog covered but I may have it sorted wrong (under F for Filipino) - a result perhaps (as mentioned in the beginning) of not knowing enough about the language. But the glyphs themselves are pretty straight forward ;)<br>
      (I will probably have to move this entry to T for Tagalog and also call it Filipino/Pilipino ;) </p>
      <p>Yoruba is a whole other kettle of fish: I did look into it, but the character set is full of non-Unicode encoded glyphs, and I found no conclusive information about their design and usage.<br>
      Same also for vietnamese: there would be too much additional work to learn and implement all the needed glyphs - all for covering a market I do not really know how to approach.</p>
      <p>I might expand the language coverage for the fonts I rework later, though - but as a start I have focused on languages where I KNOW how to properly design the glyphs and at least have some idea how to approach the markets. Which I will do more actively when I have built up a large enough library of fonts. :)</p>
      <p>My, what a long post! ;)</p>
