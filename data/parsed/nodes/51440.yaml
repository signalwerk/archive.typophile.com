      <p>Names mode relates to the older Type 1 format, in which each glyph was given a name (but no code). The encoding was supplied by a separate look-up table in the font. When you're making OpenType or TrueType fonts, the Names mode doesn't have any effect on how the font is generated, but can still be a useful way to view a font during development, especially since you can make your own encodings.</p>
      <p>Code pages and Unicode ranges are just different ways of slicing up the Unicode gamut. Code pages relate to different keyboard layouts for different regions and operating systems and often support several languages, while Unicode Ranges are subsets of Unicode specific to various languages and purposes.</p>
      <p>The encodings you can select while in Names Mode are similar to code pages, but come from the various encodings which have been used for making Type 1 fonts.</p>
