      <p><cite>This reminds me I have to post another question to see if I can try to set my own ’conventions’ to assign Unicode values to non-Unicode glyphs (like the Small Capitals)…</cite></p>
      <p>Short answer is: Of course you can. That's what the Private Use Area ranges are for.</p>
      <p>That said there are some organizations that have laid (unofficial, non-binding) claim on parts of the PUA for special purposes (<a class="freelinking external link-external" href="http://mufi.info/" rel="nofollow">MUFI</a> and <a class="freelinking external link-external" href="http://www.evertype.com/standards/csur/" rel="nofollow">Conscript</a> being but a couple), as well as corporate assignments, like uniF8FF being used for the Apple logo. </p>
      <p>It's been said many times on this site and elsewhere that you're not supposed to give unicode numbers to glyphs like small caps or ligatures and to address them solely through OpenType features, but some programs won't recognize those off-list characters without a unicode number.</p>
