      <p>I set type rather than design typefaces. Over the years, we've made a fair bit of money when publishers needed a Latin-based language set, where no font had the needed characters. Adobe helps out, their EULA allows their fonts to be modified as needed.</p>
      <p>The only non-Latin alphabets I worry about -- the only ones where it would be nice to have both the Latin &amp; non-Latin in the same typeface -- are Greek and Cyrillic. By all means include polytonic Greek, all the while remembering that the classical Greek period lasted over a thousand years, &amp; not all is covered in Unicode.</p>
      <p>But you delude yourself to think that "most" of Latin is covered by Latin Extended A. One of the vowels with an ogonek is in Latin B, as are the characters needed for Yoruba &amp; Pan Nigerian, and probably some other African Languages. Thomas Phinney has pointed out that Tagalog has a wide audience. Few of the Native American languages are covered with just Latin A, including Apache, Navajo, Kiowa, and Lakota. Some can't be covered with any of A, B, and extended additional, but can with with either a *mark* or *ccmp* feature. (I believe *mark* isn't currently supported by Adobe, but it is coming.)</p>
      <p>Anyway, that's why I think it more important to cover languages than somewhat artificial codepoints.</p>
