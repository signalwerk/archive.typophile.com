      <p>Many thanks, Mark. I think Metallophile (and maybe even Proxima) does not include most of Latin Extended-B and the additional glyphs mentioned by Charles. That's what I was thinking about, since – in the end – I have no specific language audience in mind (for Latin), so I am quite torn between the idea of keeping the face self-contained and the idea of having a more thorough Latin coverage.<br>
