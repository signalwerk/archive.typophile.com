      <p>Many thanks for your considerations.<br>
      Yes, I was asking mostly for non-Latin, as I see more or less the languages are fully covered by the Latin Extended-A (Unicode range). In fact, as I did the Extended-A for an unreleased typeface, I see it covers most of "Adobe Latin" ranges described by Thomas Pinney (great resouce, thanks to him!)</p>
      <p>I wish to consider different typefaces in specific ways. I do not intend to draw (at first) a large number of glyphs for a typeface which is not meant for big, multi-lingual editorial purposes, inversely I wish – if I decide to include a language – to make the face enough complete in its script as well (i.e. Greek with Politonic).</p>
      <p>I guess it's hard to reach economic standards in glyph choices, but it helps a lot making all these considerations.</p>
