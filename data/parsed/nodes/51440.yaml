      <p>I use pretty much the same Unicode coverage as Adobe does in its "Pro" fonts (but not Cyrillic or Greek as they do with a few). Basically, most Western and Eastern European Latin-based languages. I haven't published anything yet outside of Latin-based scripts. </p>
