      <p>Covering African languages can indeed involve some problems; see</p>
      <p><a href="http://typophile.com/node/49307" title="http://typophile.com/node/49307">http://typophile.com/node/49307</a></p>
      <p>Having said that, using the characters found in Unicode (and the composites that have to be made up) will cover the needs of many users of Yoruba and Hausa. We have run into authors that insist it must be <cite>this</cite> way -- say, a bar under a letter rather than a dot -- but the number diminishes as Unicode becomes more widely adopted. We recently had an author change her mind after first proof. We'd set bars under per her initial request, and she decided in first proof that the dot was becoming a standard, so we switched to that. Admittedly far easier for a typesetter to make these moves than a type designer.</p>
      <p>But there will always be a move towards standardization and what is easy to achieve. For example, while Kiowa properly uses macrons below vowels, the use of the underscore is common, because it is easy. And one reason it is easy is because even with OpenType, few foundries fill out the combining diacriticals. Once that is done, I'd expect more &amp; more people to use the macron below rather than the underline.</p>
      <p>So one point might be to fill out the Unicode ranges for Combining Diacriticals and Spacing Modifiers -- Lord, even MS Word will use them, though not always place them correctly. But to cover a language with characters using multiple diacriticals not precomposed in Unicode requires ccmp or mark, and the latter is not universally supported.</p>
