      <p>Like Charles said, one should base the decision which characters to include in a font rather on language support than on Unicode ranges.</p>
      <p>There are some resources about languages (or rather <em>orthographies</em>) and their required characters:</p>
      <p><a href="http://www.eki.ee/letter/" title="http://www.eki.ee/letter/">http://www.eki.ee/letter/</a><br>
      <a href="http://www.evertype.com/alphabets/#1.2" title="http://www.evertype.com/alphabets/#1.2">http://www.evertype.com/alphabets/#1.2</a></p>
      <p>But there's also a definition problem, because often it's not precisely clear which characters are really needed.</p>
      <p>Take, for example, German: Ask a German school kid and he'll probably tell you the alphabet consists of 26 letters. But what about ä, ö, ü and ß? That makes it 29, and is widely agreed to be sufficient for German. The eki.ee site adds à and é, so then we can write »Café« and »à la carte«, as well as André and René, which are common given names in Germany. But still Mrs Hoëcker and Mr Ruëtz aren't happy because they cannot write their surnames, which are proper German names, no foreign names btw. For historic texts you might want to add ſ (long s).</p>
      <p>Not to forget foreign names which might occur frequently depending on the kind of text that you are setting. Schools in Berlin would definitely need fonts for Turkish, Polish, Serbian, French, Croatian, Vietnamese (to name the biggest groups) to properly write the names of their pupils (non-Latin scripts would be transliterated) in German texts (actually they probably don't care).</p>
