      <p>Sounds like an intelligent question to me, but the answer will likely depend on your notion about the eventual use of your font(s). If they are for text, I'd say the thing to pay attention to is *languages* -- for example, there are many languages that use the Latin alphabet, or are commonly transliterated using the Latin alphabet. Slavishly following either a *codepage* or *Unicode range* formula will not give you the best coverage of languages.</p>
      <p>For Latin-based languages, see</p>
      <p><a href="http://blogs.adobe.com/typblography/2008/08/extended_latin.html" title="http://blogs.adobe.com/typblography/2008/08/extended_latin.html">http://blogs.adobe.com/typblography/2008/08/extended_latin.html</a></p>
      <p>Then there are the non-Latin languages . . .</p>
