      <p>I did A LOT of research before deciding which glyphs to include in the reworked fonts on my site.<br>
      The result (based on -among other things- both eki and wiki information ;) is presented in this list of languages:</p>
      <p><a class="freelinking external" href="http://www.cheapprofonts.com/Languages.php" rel="nofollow">http://www.cheapprofonts.com/Languages.php</a></p>
      <p>The character set I ended up with is made up by:<br>
      - the Mac + Windows standard set<br>
      + Latin Extended-A<br>
      + 8 glyphs from Latin Extended-B<br>
      + 12 Unicoded glyphs outside of those ranges<br>
      + 8 glyphs without Unicode values<br>
      (A simple rundown can be found in the downloadable PDF Catalog ;)<br>
      = 65 Latin-based languages...</p>
      <p>Enough for my concept, but your mileage may vary ;)<br>
      So, yes, I think a list of supported languages makes more sense for an enduser than codepage/unicode block information...</p>
