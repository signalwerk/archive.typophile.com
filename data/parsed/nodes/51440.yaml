      <p><em>What could happen if I use a Unicode value which is not standard?</em></p>
      <p>The results will be unpredictable if the user changes the text set in your font to a different font. (By unpredictable results, I mean the glyph that appears in place of your non-standard coded glyph will be unpredictable, not that the computer might blow up or suddenly transform into a bowl of petunias.)</p>
