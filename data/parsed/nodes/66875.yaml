      <p>The Mandate look was pretty long running, apparently from 1937 to 2008. In 2008, Hasbro standardized the game internationally, using a computer graphic image of Mr. Monopoly (formerly Rich Uncle Pennybags) on the cards - and using the <em>same</em> image on several similar cards, instead of a different image on each card.</p>
      <p>I had not formerly known of this, and am now deeply shocked and distressed. Yes, even a long-running classic must be modernized, but it ought to be an improvement when it is done.</p>
