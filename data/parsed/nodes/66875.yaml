    html: <p>The sans is <a href="http://new.myfonts.com/fonts/bitstream/gothic-no-13/?testdrive=dock%3Dfalse%26size%3D52%26w%3D720%26src%3Dcustom%26text%3DGET%2520OUT%2520OF%2520JAIL%252C%2520FREE%26fg%3D000000%26bg%3Dffffff%26goodies%3Dot.liga%26seed%3D30" rel="nofollow">Gothic No. 13</a> and the script is Mandate, a.k.a. <a href="http://new.myfonts.com/fonts/bitstream/freehand-521/?testdrive=dock%3Dfalse%26size%3D52%26w%3D720%26src%3Dcustom%26text%3DCommunity%2520Chest%26fg%3D000000%26bg%3Dffffff%26goodies%3Dot.liga%26seed%3D30" rel="nofollow">Freehand 521</a>. I don't if the little finishing stroke at the ends of the words is included in the digital version, but it doesn't look like it. Never noticed that before.</p>
