      <p>You're right Mark. In the metal typeface (shown in Mac McGrew's book), Mandate is shown as having a character that is an extender that can be added to the end of the letters. That was not included in the set of glyphs for the font.</p>
      <p>The metal type was designed in 1934 by Robert H. Middleton. So it could have been used in early Monopoly sets.</p>
      <p>- Mike Yanega</p>
