    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Booklet_200.jpg"></div><p></p>
    <p>It carries number 200 of 200.</p>
    <p>Its title page sports 11 signatures from type designers ranging from young up-and-comers to type celebrities: Stefan Hattenbach, Jean François Porchez, Tomáš Brousil, Nick Shinn, {ths}, Rian Hughes, Randy Jones, Mark Simonson, Peter Bil’ak, Eduardo Manso and David Berlow.</p>
    <p>It has traveled to New York and all over Europe, from cold Helsinki to sunny Barcelona via The Netherlands, Germany, the Czech Republic and England.</p>
    <p>It is going to be auctioned to benefit both the SOTA and ATypI organisations.</p>
    <p>We made it for the community, and we're going to give back to the community.</p>
    <p>Soon...</p>
