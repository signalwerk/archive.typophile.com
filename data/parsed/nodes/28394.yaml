    html: <p>'calt' is intended for contextual stuff, whereas your examples seem to be plain ligatures. If you really consider them to be <cite>necessary</cite> ligatures, then they belong into 'liga'. If you want to give the user more control, you can put them into 'dlig' (discretionary ligatures) which is intended to be applied on individual glyphs rather than paragraphs.</p>
