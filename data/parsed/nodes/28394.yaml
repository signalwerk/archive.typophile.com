    <p>I plan to do a lot of ligatures in a script. Ligatures like o_r, b_r, t_t_i, t_u etc.</p>
    <p>I want them to appear all automatic for the user, cos the font needs them really.</p>
    <p>However, I can’t seem to figure out which is better; put them as “liga”, or as “calt”.</p>
    <p>It seems like the contetextual ligatures are ON by default in InDesign, aswell as the regular ligature-function, so for me it feels as if it doesn’t matter really, but perhaps there is (probably) advantages in using one of them instead of the other (?).</p>
    <p>What are your opinions on this?</p>
    <p>Thanks in advance.</p>
