      <p>I don't think it matters for a script whether you use one default OT feature or another. In practice, there's no difference.</p>
      <p>However, there are certain script substitutions you may want to include in your font that are not, strictly speaking, ligatures, such as end forms.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/end_4146.jpg"></div><p></p>
      <p>Typographers are a punctilious bunch; I therefore put all the substitutions in Handsome Pro in the calt feature (except, for sentimental reasons, fi and fl). I suppose I could have split them between calt and liga (or dlig), to be absolutely correct, but why make things unecessarily complex? The real use for the distinctions between calt, dlig, and liga is in old style roman faces, not scripts.</p>
