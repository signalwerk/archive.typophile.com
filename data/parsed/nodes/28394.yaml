    html: |-
      <p>Contextual rules govern instances in which particular glyphs should or should not appear together. </p>
      <p>To take a simple case: In a script face, one form of a glyph might have no connecting strokes, to be used at the beginning or end of a word, while another form would be applied in the middle of a word.</p>
      <p>It can get more sophisticated than that of course.</p>
      <p>Examples of fonts with contextual feature include Shinn's Handsome Pro, and Abode's Caflisch Script.</p>
