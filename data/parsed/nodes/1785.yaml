  - id: 14016
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 25 Oct 2003 — 1:18pm
    date: 2003-10-25T13:18:00
    votes: null
    html: "<p>Meredith, cool! <br> <br>-- <br> <br>Mercury uses four kinds of terminals: adnate wedge (bottom-right of \"L\"), abrupt wedge (all over), ball (why would I ignore them?) and regular adnate (\"s\"). That's not counting the funny tail of the \"a\"... <br> <br>Please name another (non-grunge) font with just three... <br> <br>hhp <br></p>"
  - id: 14017
    user_id: 1262
    user_name: John Hudson
    user_path: null
    date_raw: 25 Oct 2003 — 1:45pm
    date: 2003-10-25T13:45:00
    votes: null
    html: <p>I consider Mercury to have two kinds of wedge serifs. The fact that some of the serifs are adnate and some are not is the only remarkable thing about the design. The fact that a and s have different kinds of terminals from everything else is not unusual; these letters are often exceptional because their terminals are not strictly speaking serifs. The fact that some letters have ball terminals is also not unusual (see Fenway, Arnhem, Paradox, to name just a few recent designs). So let's focus on the adnate vs. non adnate wedges, considering the uppercase L. This is a letter in which the terminal needs to be heavier than a typical serif, both because it is vertical and because it is so far distant from the main stem, connected only by a thin stroke. The connection of the terminal to that thin stroke benefits from being strengthened, hence the adnate connection, which adds weight and makes the terminal a terminal, <i>i.e.</i> something that belongs to the stroke, and not merely something stuck on the end. For comparison, take a look at how Matthew Carter solves the same problem in a different way in Fenway. <br> <br>[PS. Shouldn't this be a separate thread?]</p>
