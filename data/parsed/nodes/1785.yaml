  html: "<p>Greetings from the AIGA conference. (I chose wrong this year, but I'm trying to make the best of it.) Is anyone else here at the conference? <br> <br>I attended a seminar on OpenType by two Adobe Toronto guys. They were good at their jobs, which was clearly to be cheerleaders for the CS suite -- showing off the admittedly dazzling combo of InDesign and OpenType Pro fonts. Two peeves, however: <br> <br>1) They started off with a general presentation (done in Acrobat) in which all the quotation marks were actually inch marks. Way to boost your credibility, guys.  <br> <br>2) During Q&amp;A, they pretty much tap-danced around anything potentially negative about the new Creative Suite model. I realize their job is to evangelize, but when you can't even get a straight answer out of them I don't think it helps Adobe any. F'rinstance, I asked about the <i>next</i> round of upgrades: if you purchase the Suite now, are you locked into always upgrading the whole Suite rather than individual apps? Their answer boiled down to, \"Yes, because that's the way you want it, and you'd be a dolt to want anything else.\" Sigh. Someone else asked about the (current) Photoshop-owner upgrade, and whether there were better upgrade options for people who own more than one Adobe app. Again, their answer was basically, \"But why would you want such a crazy thing?\" The guy who asked the question actually had to follow up with: \"So... are you saying no?\"  <br> <br>I know it's hard to be in the position of marketing something that's problematic. But maybe they could take a page from Tim Cole, who's the only evangelist-type I've ever heard actually give straight, no-nonsense answers. It sure made one want to hear and believe what he had to say. Speaking Marketese doesn't fool anyone. <br> <br>IMHO, of course.</p>"
