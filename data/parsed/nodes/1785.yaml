    date: 2003-10-26T08:22:00
    votes: null
    html: <p>&gt;<i>Speaking of abrupt vs. adnate...</i> <br> <br>Personally, I just love saying the word <i>adnate</i>. <br> <br>Adnate.  <br>Adnate. <br>Adnate. <br> <br>Oh, sorry.</p>
  - id: 14027
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 26 Oct 2003 — 9:50am
    date: 2003-10-26T09:50:00
    votes: null
    html: "<p>John, my own gauge of \"unorthodox\" is much looser than that - for one thing I think Fleischmann's #65 would make a superb text face, while no Fleischmann revival has dared to go to its real depths. I'm just trying to figure out what <i>clients</i> think. But I do see your point. And Kent, thanks for that great illustrated post! <br> <br>Well, I guess I'm mostly convinced about Mercury not being so \"out there\" - but I still think it pushes the envelope in terms of general contemporary typographers' expectations, which I do feel is too conservative. <br> <br>BTW, I hope the Famous Type Designer who had a problem with Patria's <i>two</i> terminal styles is listening!  :-) <br> <br>hhp <br></p>"
  - id: 14028
    user_id: 577
    user_name: cchs
    user_path: null
    date_raw: 28 Oct 2003 — 8:00pm
    date: 2003-10-28T20:00:00
    votes: null
    html: "<p>Just back from Vancouver myself. I was able to make an average of eight lectures per day for each of the three days. Sadly, I missed most of the early morning sessions (and 6AM yoga) due to, shall we say, a rather zealous dedication to after hours socializing. <br> <br>All in all the conference was an inspiring and worthwhile experience, and one which I would recommend. If you did the math in paragraph one, you'll know that I attended about 24 lectures. What is remarkable is that of them only one, Jonathon Hoefler and Tobias Frere-Jones, showed any actual work. To many this was a disappointment, but I found it uniquely envigorating to hear designers really TALK for a change. Yes, a little show and tell could have gone a long way, but after such a drought of discussion of ideas, the change was welcome.  <br> <br>Incidentally, misters Hoefler and Frere-Jones, positively awed the audience with the rigor of their craft. <br> <br>Of course the greatest value of the conference (besides Lucille singing kareoke) was meeting so many interesting new people, reunited with old friends and deepening relationships with heretofor casual acquaintances. It was in these exchanges I took comfort in knowing that there are others out there who care as much as I - miraculously about the same issues. <br> <br>As far as any new direction is concerned for the AIGA, that's tough to say. It has a diverse constituency and I think it is therefore difficult to make such generalizations, no matter how dearly some might wish to. I do think, however, that change will be manifest in two deomgraphics: region and age. Regional attitudes towards design, business and culture (and the degree to which they can be seen as independent from one another) are already becoming evident. This was clear from the presentations, but more notably from the sea of portfolios I reviewed. And age, well, there is a generation of 50 and 60 somethings who have defined the profession in the modern era but who are now close to the end of their run. I think in large part it will be the generation of current 30-somethings (many of whom work for or studied under the aforementioned) who fill the inevitable void and lead design into new territories by their example.</p>"
  - id: 14029
    user_id: 1832
    user_name: meredithalix
    user_path: null
    date_raw: 29 Oct 2003 — 8:27am
    date: 2003-10-29T08:27:00
    votes: null
    html: "<p>I missed Lucille singing karaoke? Damn. What did she sing? (Possible new thread topic: Designers' Theme Songs.) <br> <br>Agreed that Hoefler &amp; F-J gave an excellent presentation -- inspirational.  <br> <br>I do hope you're right about the younger generation of designers. I've sat through so many idealistic organizational \"revolutions\" that never came to anything, so I'm perhaps unfairly cynical about it all. I did find some of the presentations really inspiring and exciting (Fritjof Capra knocked my socks off, and Helfand &amp; Drenttel were pretty great), and have been thinking about practical changes I can make in my business.</p>"
