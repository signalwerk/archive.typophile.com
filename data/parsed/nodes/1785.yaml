    html: "<p>Reply round-up... <br>Joseph, good question. I don't have time to answer in depth now, but I'll just say that the direction of the \"new\" AIGA appears to come from the sincerest of intentions, and the content of this conference does reflect the new direction, but I'm skeptical about how long it will all last. <br> <br>Grant: what we really need here are Monster Trucks. Oh, and I did stop by the Veer booth and dropped your name, at which point they forced me to pose for a photo. Dirty trick. ;) <br> <br>Nick, they showed a slide of a sample of Fontesque and the question was, \"name the Canadian designer of this best-selling font. Bonus question: What is the typeface name?\" I'm just glad I got it right so I can still show my virtual face here. <br> <br>John: if there's at least one other typophile who's in, then I'm in. I'm much too shy &amp; exhausted to be good company ce soir.</p>"
  - id: 14008
    user_id: 1832
    user_name: meredithalix
    user_path: null
    date_raw: 24 Oct 2003 — 11:38pm
    date: 2003-10-24T23:38:00
    votes: null
    html: "<p>To respond to Joseph's question in a little more detail: most of the sessions at the conference do focus on the designer's responsibility for and role in Making The World A Better Place. Some sessions do this more successfully than others. Not to dismiss an admirable goal, but it reminds me of the \"First Things First\" so-called manifesto: easy to scrawl your name on it, but how many people actually took risks and changed things in their own lives &amp; deeds as a result? I'm afraid I can already see the hand-wringing turning into back-patting. I hope I'm wrong, but it's hard not to be cynical.</p>"
