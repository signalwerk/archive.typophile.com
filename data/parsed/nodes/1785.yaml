    date: 2003-10-25T13:03:00
    votes: null
    html: <p>I just have to tell someone. Not two feet away from this computer, Spiekermann, Tenazas and Sagmeister are engaged in high-spirited conversation. I'm hoping if I stand next to them for long enough, some of the brilliance particles will fall off onto me. So far it's not working.</p>
  - id: 14014
    user_id: 1262
    user_name: John Hudson
    user_path: null
    date_raw: 25 Oct 2003 — 1:05pm
    date: 2003-10-25T13:05:00
    votes: null
    html: "<p>I don't think Jonathan is mixing styles at all. It might look that way because the serifs are very sharp and cleanly defined, which emphasises their superficial differences, but really all he's doing is regularising and actually reducing the variation seen here (Janson): <br><img src=\"http://www.typophile.com/forums/messages/30/19242.gif\" alt=\"Janson terminals\"> <br> <br>Ignoring the balls and concentrating on the serifs, all the terminals in Mercury are either triangles (top of i, bottom of d) or half-triangles (foot serifs, a, s). The half-triangle is softened in a, and and softened and made heavier in s, but the forms are much similar to each other than in many other typefaces.</p>"
  - id: 14015
    user_id: 1262
