  - id: 14023
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 25 Oct 2003 — 6:33pm
    date: 2003-10-25T18:33:00
    votes: null
    html: "<p>&gt; I consider Mercury to .... <br> <br>Individually each of the things you mention aren't enough to make a design \"unorthodox\", but in Mercury they're <i>all</i> there. And I think that's why Meredith for one feels the end result is \"distracting\". My own view on it is undecided: when does adding another layer of harmony result in discord? For one thing, it depends who you ask: a classical type designer, a Pomo type user, an oblivious layman, etc. <br> <br>&gt; Carter solves the same problem in a different way in Fenway. <br> <br>But Fenway is much more regular (like see the tail of the \"a\" in the new display cut launched a couple of weeks ago in BusinessWeek). The original Fleischmann stuff though (at least his masterwork #65) is <i>much</i> weirder than Mercury! Variable x-heights, the lone Didone \"o\" in a Dutch Oldstyle design, etc. The guy was a genius. <br> <br>I'd be curious to hear of other high-profile fonts as \"free-willed\" as Mercury. It takes balls to deploy stuff like that in big-name publications. <br> <br>hhp <br></p>"
  - id: 14024
    user_id: 1262
    user_name: John Hudson
    user_path: null
    date_raw: 25 Oct 2003 — 7:13pm
    date: 2003-10-25T19:13:00
    votes: null
    html: <p>See, I don't think of Mercury as either unorthodox or 'free-willed'. I can think of a reasons for all the details you've pointed to so far, or at least a justification that puts them squarely within the bounds of not only acceptable but even normal practice. Maybe your view of what is orthodox is simply too limited? <br> <br>I have not looked closely at the new Fenway cut, but I've looked very closely at the original, having used it in <i>Language Culture Type</i> and all the ATypI Vancouver material. Take a look at the L and see how Matthew maintains the regularity of his abrupt serif connection but at the same time links the wedge to the stroke. He is solving the same problem that Jonathan is solving in a different way. I don't have a problem with either solution, and if anything Jonathan's is the more orthodox and less innovative.</p>
  - id: 14025
    user_id: 1215
    user_name: kentlew
    user_path: null
    date_raw: 26 Oct 2003 — 7:22am
    date: 2003-10-26T07:22:00
    votes: null
    html: "<p>Apologies to Meredith for continuing this tangent to her thread. (I hope you thoroughly enjoyed AIGA and Vancouver.) <br> <br>Hrant, I confess that I'm not entirely sure exactly what you keep carping on about with Mercury's terminals nor what you mean by 'free-willed'. But take another look at all that's going on in Galliard: <br><img src=\"http://www.typophile.com/forums/messages/30/19262.gif\" alt=\"Galliard Terminals\"> <br> <br>You've got a 'lachrymal' terminal in the 'c', but the 'r' becomes more of a beak, while the 'a' has a logic all its own, none of which is similar to the serif-like terminal on the 's'. And what about that 'a' tail compared to the rest of the foot serifs or the 'd' tail serif? Plus, of course, the broad triangular head serifs compared with the thin foot serifs. <br> <br>Or what about Monticello: <br><img src=\"http://www.typophile.com/forums/messages/30/19263.gif\" alt=\"Monticello Terminals\"> <br> <br>The head serifs are all over the place -- compare the 'b' to the 'd' and the 'r' to the 'i'. Don't ask me what's going on with that 's' terminal. And I didn't bother to show the huge, broadly bracketed serifs of the caps. How did Binny (and Griffith/Larson and Carter) get away with it? <br> <br>The tension between <i>harmony</i> and <i>contrast</i> is present in all good form-making. You find it in painting, sculpture, architecture, and music, as well. Of course, one generation's (or person's) contrast is another's discord. I'm not surprised to see this in Mercury, as it was inspired by Fleischmann and this kind of extreme combination of contrasting elements was part of the zeitgeist of the late Baroque period.  <br> <br>Speaking of abrupt vs. adnate, I'm surprised John didn't mention Fenway's 'v' with its remarkable juxtaposition of serifs -- straightline abrupt, curved abrupt, and fully adnate. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/19264.gif\" alt=\"Fenway 'v'\"> <br> <br>-- K. <br></p>"
  - id: 14026
    user_id: 1011
    user_name: Grant Hutchinson
    user_path: null
