    date: 2003-10-25T10:51:00
    votes: null
    html: <p>Hrant, by "get away with," do you mean you think Mercury is a success, or a failure? And if a success, is it in spite of or because of its quirks? <br> <br>BTW, This morning's talks by <a href="http://www.fritjofcapra.net/" target="_blank">Fritjof Capra</a> and <a href="http://www.carboymobility.com/" target="_blank">Dan Sturges</a> left me inspired and much more hopeful about the possibility of real change in the design world and the world world.</p>
  - id: 14012
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 25 Oct 2003 — 12:07pm
    date: 2003-10-25T12:07:00
    votes: null
    html: <p>I mean it in a good way. You're not "supposed" to have that much variety. When I was making Patria (which has two styles of terminals), a Famous Type Designer told me I'd have to choose one. In a formal aesthetic way that does make sense. Pomo designers however balk at that stuff. Mercury seems to be something in between, and I guess I'm mainly wondering what kinds of reactions from what kinds of people the mixing of styles has received. <br> <br>hhp <br></p>
