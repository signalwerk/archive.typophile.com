      <p>Hello again every, thanks again for the feedback. here is some new pages with the a few layout tweaks and some actual editorial. </p>
      <p>litera: I agree and thank you for all your points. But, the look they where going for this year was a more vector look, all the tickets and such have a vector image of a golfer sort of silhouetted in solid colors. I tried to reflect that my own way with the dimples of the ball. I would love to work in more pages with the client but I work in the production world and I am given a set number of pages to keep the price of printing down. What the boss man says, I do.</p>
      <p>Sorry aluminum but the client likes the golf balls so they ended up staying.</p>
      <p>Oberlange and sch2525 I think you both make very good points for both ends, I played a bit with curves like you suggested but just kept coming back to the more structured look. </p>
      <p>Well thanks again and hope I am getting closer to something half decent.</p>
