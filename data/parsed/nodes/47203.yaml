      <p>I disagree with the above comment. I think that the design blends subtle curves and straight edges very nicely. While golf courses are  "natural" (is there anything really natural about manicured greens and strategically placed sand, trees, and water?), the game itself is very structured. The ball is perfectly round, the club is perfectly straight, everything is perfectly precisioned.</p>
      <p>I actually like the idea of the green strip at the bottom of the original image you posted. But have you tried making the strip asymmetrical across the spread? And what about doing the page-number ball on the even-numbered pages and a pin/hole on the odd-numbered pages? Hmmm does this seem too cliche? </p>
      <p>My father has been design golf tournament collateral for years, so I might be a little over-zealous about this stuff.</p>
      <p>-S</p>
