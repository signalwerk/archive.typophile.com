      <p>I don't think it looks professional. Why? Here's why:</p>
      <p>I don't like the top and bottom green bars. Especially not the top one. And they also don't complement each other.</p>
      <p>Text boxes don't have enough white space around them, hence unprofessional and unrefined look.</p>
      <p>Leading with this wide text column is too tight.</p>
      <p>Imagery doesn't match in style even though presented as part of the same publication. </p>
      <p>As said at the beginning. Looks like anyone could do it and as most wanna-be-a-designer would do it. Sorry. Don't like it at all. Golfers are usually richer people and this doesn't reflect this fact. This spread reminds me more of a church mass invitation than anything else.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
