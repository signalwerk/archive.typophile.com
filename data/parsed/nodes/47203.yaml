      <p>Okay not much of a design comment but in your first comment two guys from my University (Auburn) are listed.  War Eagle!  (and also my undergrad school and rival to my current one, Alabama.... Roll Tide!)</p>
      <p>I like the colors, and most of the plays (all?) are from universities, the design matches very closely with standard university non-big-3 sports.  These are the colors I would have expected, I think the blue previously suggested would make it even more cartoonish.+</p>
      <p>I really like the texture you've given, as it nicely matches the dimples on a golf ball, ditto for the curved lines which make me think of wind.  It's a clean layout which is the image I get from golf players (who else makes sure their shirts and pants are ironed before they go out to play sport?)</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
