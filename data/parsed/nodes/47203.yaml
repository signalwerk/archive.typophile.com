      <p>Hmm...after looking at the design, considering it's for a golf championship, it looks elementary; almost like it's a pre-made template (sorry! no offense: ). Is this something the client suggested? </p>
      <p>When I think of golf, I think of sharp, crisp, clean lines, sophistication, rich greens, blues and golden browns with nice contrast. I also think of openness, no boundries, like that of a golf course. Your design seems restricted and too structured. I would suggest playing with the curves that you would naturally find on golf greens, sand traps, the ball, etc...Opening up the design, like Litera suggested will give you much more room to work with. I hope this helps...</p>
    html_clean: |-
