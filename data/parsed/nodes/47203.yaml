      <p>Ok. This looks much better. But if I were you I'd use some free photographic material instead of clip-art vector graphics. It will make it look more sophisticated and nice.</p>
      <p>If space is a problem in that case I'd get rid of coloured edged colour bars because they tend to make content space even smaller and less breathable. I'd incorporate more organic shapes (softened photographic material may work nice if partially also in the content background) that will look nice.</p>
      <p>Eliminating as many limiting surfaces you'll gain breathing space. BUT. Don't get tempted to make content any bigger because you won't benefit anything.</p>
      <p>Your layout is very full already. If you can't get through with decent looking brochure I'd suggest you convince your client to either cut down content or add more pages. Prepare some very good arguments (include some printouts that will look much nicer and convincing) so client will say yes to whatever you'll say.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
