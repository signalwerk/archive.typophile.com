  html: |-
    <p>I've read that Germans space combinations of "ch" and "ck" tighter (than other languages). What is the best way to implement this? Is it preferable to design alternate glyphs with tighter spacing? or can one have OT kerning pairs that target German and accomplish the same result? Would one method be "better" than the other?</p>
