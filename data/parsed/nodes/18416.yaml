    html: |-
      <p>Some 10-12 years ago, the German PAGE magazine published a series of articles devoted to that topic. Peter Matthias Noordzij apparently felt that TheSerif is an unethical clone of his PMN Caecilia and accused Luc(as) de Groot of plagiarism. De Groot defended himself claiming that both typefaces came were inspired by the teachings of their professor (and Peter Matthias' father) Gerrit Noordzij but that they were conceived and created independently. </p>
      <p>A.</p>
