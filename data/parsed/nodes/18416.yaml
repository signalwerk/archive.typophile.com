    html: |-
      <p>Personally, I've always thought this story to be a load of crocker sh!t. This whole polemic started with that article by Max Caflish in 1997. Although initially Peter Matthias didn't appear to have any qualms about TheSerif, he kinda got swept along by this whole ruckus which blew completely out of proportion.</p>
      <p>When in doubt, trust the Type Identification Board people. And I can guarantee you that we never have the slightest trouble distinguishing the one from the other. Are they similar? Yup, as is to be expected from two students of the same influential teacher investigating similar avenues. Is one a clone of the other? Nope.</p>
