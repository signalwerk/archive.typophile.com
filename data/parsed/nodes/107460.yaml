    html: <p>I had to look it up to find out that its native resolution is 2560 by 1600 pixels. So 1280 by 800 is achieved by the simplest possible scaling, 2 pixels to 1 in each direction. 853 by 533 pixels could be obtained by a scaling of 3 pixels to 1, but resolutions like 1680 x 1050, 1440 x 900, and 1024 x 640 are all going to involve unsharpness in fine detail, as not every pixel can be mapped in the same way.</p>
