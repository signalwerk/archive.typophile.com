    html: <p>I do quite a bit of website coding that often involves conditional search and replace patterns that extend over hundreds of documents. For these kinds of complex changes to text, learning Regular Expressions can literally save thousands of hours of manual deletes, copying, pasting, reordering and adding things. Combine it with a scripting language, like Perl or, even, Applescript and magical sorts of mass changes can be done. The big drawback, of course, is the learning curve, which probably wouldn't be cost-effective for a one-off juggling of text in a few .afm files.</p>
