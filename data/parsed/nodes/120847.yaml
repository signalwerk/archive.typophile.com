      <p>As brilliant as it sounded, I can not get this process to work.</p>
      <p>I have edited the old afm file in Word and TextEdit (mac). I just changed all the figure names from zero to zero.oldstyle throughout. The new font has all the figures in position and renamed in the encoding file. </p>
      <p>When I import the new afm back into the new font with the new figure names, it only applies changes to glyphs that were in the original font. Any glyph with a new name get no new kerning.</p>
      <p>Any ideas on what might be happening?</p>
