  html: |-
    <p>I am editing an existing font family that had proportional old style figures as the default and a feature for tabular lining. My client wants those switched so that tabular lining is the default and proportional old style the feature.</p>
    <p>Seems simple… I set up a new encoding file with figure.oldstyle replacing the old figure.lnum glyphs and, copied the glyphs into the new locations and set up the features to work properly.</p>
    <p>That just leaves the kerning… right now I am laboriously copying the kerning info onto paper, deleting it all then carefully inputting it all back into the new old style glyphs. It seems like this approach will take forever with 16 individual fonts and is prone to accidental mistakes.</p>
    <p>I couldn't get "Paste Special" to work as all the figures have new names. Can you guys think of an easier way to handle this kerning problem?</p>
