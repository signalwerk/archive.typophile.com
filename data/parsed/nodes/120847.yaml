    html: |-
      <p>If you are using FontLab:</p>
      <p>Export the AFM Metrics file.<br>
      Open it in a text editor.<br>
      In the 'Kerns' section rename the glyphs in turn (e.g. one  to  one.oldstyle) with Find &amp; Replace and save as a new file with the AFM extension.<br>
      Back in FontLab, delete all the kerning, move the figures into the correct encoding slots .<br>
      Open a Metrics window and open the new AFM file.<br>
      Select 'Import kerning data into current font.</p>
