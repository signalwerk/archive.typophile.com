    votes: null
    html: |-
      <p>It was great to learn I can edit .afm in a text editor. Disappointing that search and replace would not work as described…</p>
      <p>I think it had something to do with the new figures being in the wrong order after their names were changed. The Update [kern] feature would not reorder them properly to work either.</p>
      <p>The most streamlined workflow I could figure out was to export the old .afm, open it in a text editor and do searches for the figures. As I found them, I cut them from the old .afm and pasted them into a new blank doc.</p>
      <p>I imported the .afm, now with no figure info, into my new .vfb with the new the figures with new names and positions.</p>
      <p>Using the new text file with all figure info, I copied and pasted the data into the new figures by hand.</p>
      <p>A little tedious but it worked. I am still thinking there is probably a better way...</p>
