      <p>1. No. General education—at least here in the states—is muddled up enough trying to cram in the interests of too many people as it is. Trying to teach everyone something as subtle and esoteric as typography would just leave them more confused than they already are. </p>
      <p>2. Mandatory music classes education hasn’t done anything to change the public taste for bad music, so I see no reason to assume that it would work with type. </p>
      <p>Carefully developed personal graphic identities seem pretty unlikely to happen on a large scale; people have better things to do with their time. That’s why so many people just stick with Arial and Times New Roman.</p>
