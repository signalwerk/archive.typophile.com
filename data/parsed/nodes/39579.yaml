    <p>1. Do you think people/children should get basic information about typography in the context of mandatory education?<br>
    2. Would this improve the overall taste and literacy of general public?<br>
    3. How would you schedule such education?<br>
    4. Are there countries that actually made some steps in this area?</p>
    <p>Slightly unrelated, but:<br>
    what you think, will there ever be something like “personal graphic identity”, resembling corporate identity?<br>
    Or, rephrased, could typography someday become a part of person’s style (resembling one’s preferences in cars, clothing brands etc.). The answer is probably no, but could you at least imagine such scenario?</p>
    <p>Thanks in advance for any comments.</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20080704152905/http://www.typophile.com/node/39618" class="topic-previous" title="Go to previous forum topic">‹ I'm just going to ask...</a> <a href="/web/20080704152905/http://www.typophile.com/node/39591" class="topic-next" title="Go to next forum topic">[ATypI] Maestría en diseño tipográfico ›</a></div>
