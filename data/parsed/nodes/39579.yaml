      <p>I’ve said this in another thread but will repeat it here. Am doing some mandatory and painful PowerPoint training. I am amazed and disgusted by the delivery of the material. It’s all about everything you CAN do, and nothing about WHY you should do it. One thing that would have incredible impact is Microsoft getting rid of “WordArt” (has there ever been anything more offensive to a typographer) and making some effort to educate users of its software about the fundamentals of design, rather than just telling everyone, “Look! You can center it!” “Look! You can make everything a different color!” “Look you can italicize it!” or, of course, the creme de le creme, “LOOK! YOU’VE GOT HUNDREDS OF FONTS TO CHOOSE FROM!!!”</p>
      <p>Teaching it in schools? That would require good teachers. Who’s going to educate the teachers?</p>
