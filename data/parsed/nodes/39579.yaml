      <p>“Teaching it in schools? That would require good teachers. Who’s going to educate the teachers?”</p>
      <p>Could they be perhaps guest lecturers instead?</p>
      <p>I’ve noticed that for many people it’s quite interesting to hear about the origin of a typeface etc. once they get beyond the feeling that all sans faces look the same. And children use to be excited when they can identify Optima or Futura on a product packaging or posters in the street. But yes, it would be different if they were obliged to do a homework with that subject.</p>
