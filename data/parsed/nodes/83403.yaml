    html: |-
      <p>There are more than two metal type heights, but the most common are North America/UK at .918" and a European 23.56mm. There are many different European type heights, but 23.56 is common (if I remember correctly) in Germany and France, among others.</p>
      <p>I have never heard of European type being "converted" to UK/NA height. It would not match up to spacing available, regardless, as it is all still cast to Didot point/cicero and not the ATF point specs.</p>
      <p>Is this stuff really relevant? Very few are doing repro proofing. Why lament the "bastardization" of one point to 1/72 of one inch? The only reason I can think is that it's not metric, but other than that, why make conversions more complicated? I'm a letterpress printer myself, but I embrace the digital point of 1/72".</p>
