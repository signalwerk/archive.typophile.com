    <p>Hi guys! I'm a student, so, needless to say, I've definitely never done any professional design work, but I do work a lot on InDesign in class, so I'm pretty familiar with the way things work in the USA. My question concerns typographic units outside of the English speaking world. I was reading some article somewhere that mentioned that other countries don't use picas--which was a novel idea to me. I'm just used to twelve points in a pica, six picas in an inch etc. So I started looking.</p>
    <p>I've found, that, in countries like Italy and France, there's a system in place originally created by Françoise-Ambroise Didot which goes like this:<br>
    12 lignes = 1 French Royal Inch<br>
    6 didot points (dd) = 1 ligne<br>
    12 dd = 1 cicero<br>
    6 ciceros = 1 French Royal Inch</p>
    <p>It makes sense to me, although it takes a little thought to get my head wrapped around it. But I love the names, they're much prettier than the American/British method. I also read that Japan uses the American/British system, but I haven't been able to find anything else out about other countries. Are there units tailored to the metric system, used in other places? It would be nice, the ratios are admittedly pretty weird :P</p>
