      <p>A Didot point was somewhere around 0.03759 centimetres; I think that the current "official" value is one of 0.037593985 centimeters, as established by Berthold in 1879.</p>
      <p>As for the metric system, a revised Didone of 0.04 centimetres is apparently in use by the French Imprimerie Nationale, I once read somewhere. 0.0375 would be closer, and quite convenient.</p>
      <p>Myself, I find it annoying that the point is 0.013837 inches instead of exactly 1/72". In any event, a Didot point is about 15/14 of an English point.</p>
