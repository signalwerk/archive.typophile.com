      <p>The fact that Quark rounded off the pica to the order of 72 pts to an inch has troubled me deeply for years. InDesign at least offers an option to define the correct 72,27 pts…</p>
      <p>The Dutch measure was called Augustijn (although Cicero has been in use too) and is equal to 4.5112781 mm. Commonly rounded of to 4,5 mm, I am afraid.</p>
      <p>Another baffling fact: the working height of lead type varies enormously (if I may use that expression) — I will have to dive into the literature to substantiate that claim, but maybe others can chime in here…</p>
