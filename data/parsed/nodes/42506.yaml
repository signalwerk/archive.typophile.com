    html: <p>How things change. My first PS laser printer, a GCC, cost me GBP 2500 in 1990. I got distracted into writing my own PS imposition program but I couldn't afford a PS interpreter for the PC (I had no Mac! still don't) to test it on. But the printer had a bi-directional serial port. I was able to send my generated PS code to it and read back the imposed output (which incorporated page creep allowing for folds in both axes, and what-not, and spot ink-trapping) to test on imagesetters. Pretty cool solution I thought at the time. As for the program ("Reproshop"), as it was on PC I couldn't even give it away. But it's how I learnt programming.</p>
