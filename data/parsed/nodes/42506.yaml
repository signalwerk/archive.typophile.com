    <p>I realize this is a bit of a tangent from usual topics, but printers were discussed here a few times before and it seems like a good place to ask.</p>
    <p>What's a good SOHO laser printer for high quality B&amp;W text printing?  I'm not a pro, but I do a fair bit of DTP-like stuff and low-volume document printing would benefit from better-than-inkjet quality output.</p>
    <p>I have been looking at 1200dpi printers in the $300-$400 price bracket but print quality leaves much to be desired.  For example, sample prints done on a Brother HL 5240N show that the printer rasterizes text at around 200dpi.  The result is unacceptably jagged output that looks awful compared to something done on a nine year old 600dpi laser.  I don't know where to look from here as the 5240 got top marks for text quality from various review outfits, even in competition with higher end printers.</p>
    <p>What are people around here using for low volume B&amp;W text output that doesn't look like sandpaper?</p>
    <p>Thanks</p>
