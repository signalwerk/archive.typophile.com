    html: |-
      <p>Metalfoot -- For proofing typeface designs, it's very useful to use a printer with true Adobe Postscript. Postscript clones may possibly interpret code slightly differently -- for example, hinting instructions. Since commercial output for print will be processed and rasterized through a true Postscript interpreter, it's most useful to be reviewing your work in a workflow as close as possible to the likely result. </p>
      <p>For general design work, there are similar advantages -- things like color interpretation, layout features, etc. True Adobe Postscript will always be guaranteed of giving you a consistent industry-standard interpretation of the code. (There will of course be other limitations, based on the mechanics of a desktop laser; postscript rasterization is only one part of the puzzle.)</p>
      <p>That doesn't mean that all PS clones are all rubbish. But you need to investigate to know whether a given rasterizer will perform according to your needs and expectations.</p>
