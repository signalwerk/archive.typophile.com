    html: |-
      <p>For full resonance, you would have to use a version of Jenson that had the "extra" serifs on the M -- Adobe snipped them off in the default version of Adobe Jenson, but the proper version is in the alt characters.</p>
      <p>My Jenson, Goodchild, has the full serifs.</p>
      <p>Stone's Arepo has a similar quality to your logo, so Cycles could be good, and comes in optical scaling, handy for the back label on wine bottles -- I hate squinting at 6pt Snell to figure out what I'm supposed to be drinking the wine with.</p>
      <p>BTW, brilliant design!</p>
