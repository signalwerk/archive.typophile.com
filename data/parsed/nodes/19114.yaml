    html: |-
      <p>Bingo. I was going to tell Nick "thanks, and the idea was mine (including the floriation*) but this (preliminary) execution wasn't". It's funny how things just fall in your lap sometimes: I had decided to try a "V" nestled inside an "M", and at the same time I was researching Wiegand**, then I turned that page in that book and thought I was dreaming! I put together the plain "M" with the floariation of the "V" (and had to do some distortions to the floriation), but I'm going to redraw it when the client pays up.</p>
      <p>* Although I wanted grapevines, and might<br>
      still splice in a bundle of grapes in there.</p>
      <p>** Thanks to your reference in another thread. I have something<br>
      interesting (relating to the Emerson face) to report on that btw...</p>
      <p>So what do you think about the Bremer text face paired up with those initials? I like it, but it's too butch and too German to work here, no? He's a sommelier after all, not a beer connoisseur.  :-)</p>
      <p>OK, catching up for real now...</p>
      <p>Alejandro, what about Borges?</p>
      <p>Nick, good point about the full serifs up top.<br>
      BTW, this guy doesn't <cite>produce</cite> wine (although he did work at a vinery in Mendoza for some months), he tells people what wine to have, so any small type he sets will probably be limited to legal disclaimers concerning drunk driving and such. :-)  Plus Cycles is wonderful, but maybe too clean? I'd like a font with just a little bit of grape residue at the bottom.  :-)</p>
      <p>hhp</p>
