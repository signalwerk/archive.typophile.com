    <p>I've roughed out the following logo prototype for a sommelier by the<br>
    name of Maxim who's decided to call his venture "Maximus Vinum":</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MV.gif"></div><p></p>
    <p>(FYI, I'll probably have a non-floriated, or perhaps<br>
     a more coarsely floriated, version for small sizes).</p>
    <p>Now I'm looking for a texty (some paragraphs of text, but not<br>
    too much) font to use. Something that matches the spirit of the<br>
    logo (which I assume/hope is discernible in the first place) but is<br>
    not too mannered. For example Hollandse Mediaeval* is probably<br>
    a bit too much, although its somewhat anachronistic yet classy<br>
    feel is close to what I think I want. The ideal candidate would<br>
    work as a heading font as well.</p>
    <p>* Referred to in this thread: <a href="http://typophile.com/node/19096" title="http://typophile.com/node/19096">http://typophile.com/node/19096</a></p>
    <p>Specific suggestions (or wanton brain dumps) highly welcome.</p>
    <p>hhp</p>
