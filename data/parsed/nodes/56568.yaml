    <p>My kerning information keeps building incomplete, and the key has got to be this warning I get when I compile OT. It repeats for what appears to be every kerning class. What does it mean? Another symptom is that when I "Paste Special" all the kerning information in the glyphs from one font to another, only about half appear in the destination.</p>
    <p><code>[WARNING] &lt;Cerulea&gt; Start of new pair positioning subtable; some pairs may never be accessed: [k Kappa kappa kcommaaccent kgreenlandic afii10028 afii10061 afii10076 afii10109 K Kcommaaccent] [q oe e c g o edieresis ecircumflex eacute egrave Ccedilla ccedilla epsilon eogonek emacron alpha ecaron cacute ccaron gcircumflex gdotaccent gbreve cdotaccent ccircumflex gcommaaccent edotaccent sigma1 sigma epsilontonos afii10035 afii10053 afii10070 afii10066 afii10071 afii10083 afii10101 C G OE Gbreve Cacute Ccaron Cdotaccent Ccircumflex Gdotaccent Gcircumflex Gcommaaccent] [C:/Documents and Settings/Kevin Pease/My Documents/FontLab/Studio5/fontlab.fea 301]</code></p>
