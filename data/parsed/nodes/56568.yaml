    votes: null
    html: |-
      <p>You should try to avoid mixing glyphs from different scripts, in this case Latin, Cyrillic and Greek, in kerning classes. Divide your classes by script (Expand class kerning, reorganize classes, compress kerning classes) and see if the warning goes away.</p>
      <p>Oh, and delete any kern pairs between glyphs of different scripts that may result when expanding your classes.</p>
