      <p>I've known about variations in line-height/vertical-metrics between browsers and platforms for quite awhile but what I'm finding hard to understand is why this was or is not an issue with the 'web safe' system fonts.</p>
      <p>Aren't there the same variations using, say, Verdana or Arial? In other words, is this actually a new problem or just one that went unnoticed until fonts were in the spotlight?</p>
      <p>@nick shinn</p>
      <p>I think these are honest divergences of opinion about what font data matters the most, Nick. And perhaps an old fashioned bug or two thrown in. Not a shoot out over proprietary implementations.<br>
      There's also a lot more collegiality between competing browser teams these days - at least with something like this. So hopefully the wrinkles will get smoothed out informally. Much quicker that way, to say the least.</p>
