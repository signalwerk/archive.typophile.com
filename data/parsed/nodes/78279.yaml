      <p>Two separate areas here. First is bugs, errors, cock-ups, e.g. clipping caused by badly set v metrics. ahem :)</p>
      <p>Second is the inconsistencies that exist in amongst the standards.<br>
      Re Verdana, Arial etc. I did some cross platform, cross browser, tests with a handfull of big name system fonts. They do suffer these issues, because the issue is obviously not necessarily at font level.</p>
      <p>I have wondered this myself - is there any solution within font metric standards right now that can be utilised to ease these inconsistencies? (i,e more than Raph states above) or is the core problem at system/browser level?</p>
