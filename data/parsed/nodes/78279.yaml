      <p>@jasonc: I don't know of any such browsers, but I haven't wrapped my head around vertical writing scripts yet. What I'm talking about here is strictly clipping, baseline position, and line spacing for horizontal modes.</p>
      <p>@Richard Fink: They are a problem with system fonts - I found clipping for Vietnamese glyphs in Arial on Windows, and inconsistencies in line spacing from Windows to Mac. But I think the diversity of web fonts brings out the problems more acutely.</p>
      <p>@dberlow: I'd love to see actually useful metadata in the font that helps apps come up with better layout choices. I think maybe the closest thing we have to that is the "actually use typo metrics" bit, which is a pretty strong signal to apps that the typo metrics are trustworthy. Unfortunately, only IE7+ and recent-ish versions of Word respect that (I'm frankly surprised that Firefox on Windows doesn't), so it doesn't go very far to solving the consistency issues that web designers have to deal with today.</p>
      <p>But I do think that being able to <em>articulate</em> the goals will go a long way towards eventually converging on something useful. To date, vertical metrics have generally been pretty hazy and mysterious (notwithstanding John Hudson's great tutorial and the Typekit blogs on the subject), and tool support for getting it right is also poor - especially FontForge.</p>
      <p>Thanks to everybody for the comments!</p>
