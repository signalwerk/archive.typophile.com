      <p>From the answers I got here and thru the ATypI mailing list, I'd like to propose this model (for latin fonts):</p>
      <p>- Draw your letters completely within the em, so that the bounding box of all letters lies within the em. Use global guides to mark your actual (visual) ascenders, x-height etc.<br>
      - For your Vertical Metrics you can then use easy values to make line spacing consistant:<br>
      make all ascenders (TypoAscender, WinAscent etc.) the same value; same for all descenders; make all line gaps zero.<br>
      - If you run into resolution problems, set the upm size to 2048 (or even 10000).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/em_6374.png"></div><p></p>
      <p>advantages:<br>
      - no clipping nowhere and no annoying accent wizardry<br>
      - line spacing is consistant (and also looks quite good as it appears slightly bigger)<br>
      - the font looks a bit smaller as usually, which makes the default 12pt setting in many programs a much better choice<br>
      drawback:<br>
      - users have to get used to a smaller appearance of the font when they apply the point size<br>
      (which I think is acceptable)</p>
      <p>It's a bit like back to hot metal type. Like "Ascender" and "Descender" would be the edges of your lead letter and you can't go beyond.<br>
      What do you think?<br>
      o.</p>
