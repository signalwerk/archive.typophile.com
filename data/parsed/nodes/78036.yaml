      <p>Once you added diacritic letters e.g. for Vietnamese you may hear complaints that the type looks rather small. :)<br>
      The OT list remarks about Excel make me feel like OS/2.TypoAscender = OS/2.WinAscent = hhea.Ascender indeed ... But where does it get us? If foundries try to please even the crappiest application by making one more tweak, this suggests that everything can be solved on the font side – which is a never-ending story since every new application will come up with new peculiarities.</p>
