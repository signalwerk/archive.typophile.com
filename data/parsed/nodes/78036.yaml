      <p>Nice question.</p>
      <p>I've generally been following the first model, with caps at around 725 units. Uppercase accents then fit up to about 975 units, and descenders go down to about -225 units. However in my latest creations I'm more tending to scale the letters down so cap height is about 575, cap accents up to 850 and descenders to -165, which avoids crashing as you mentioned. My opinion is that default line spacing should be deliberately designed into the font to look as polished as possible. (No crashing.)</p>
      <p>Word space is another one that sometimes seems not to get designed carefully.</p>
