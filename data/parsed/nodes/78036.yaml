      <p>I am opposed to making the os2.sTypo metrics identical to the os2.usWin (windows) and head (Mac) metrics, and will certainly not do so in future fonts I create. Speaking for Extensis corporately, although we will look to get consistency between the Mac and Windows metrics in our WebINK web fonts, we won't expect the Typo metrics to match those.</p>
      <p>The whole reason the Typo metrics were invented was to allow for typographically sensitive numbers that were not related to clipping and the "old" platform-specific metrics, so as to actually express accurate values for ascender, descender, etcetera, unrelated to clipping of bitmaps on screen.</p>
      <p>Regards,</p>
      <p>T</p>
