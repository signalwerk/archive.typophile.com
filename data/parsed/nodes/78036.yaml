      <p>More legerdemain with cap diacritics:</p>
      <ol>
      <li>Create a new document in Apple TextEdit.</li>
      <li>Select a font.*</li>
      <li>Enter two returns and then type or paste <em>ÄÖÜÉÈ</em>.</li>
      <li>Now select the blank line above: the initially missing diacritics magically appear.</li>
      <li>Delete the accented caps on line 3: the base characters vanish, the dots and accents above remain!</li>
      </ol>
      <p>*) This works with a lot of fonts, including Consolas, Corbel, Constantia, but also Adobe Garamond, Auto or Malabar.</p>
      <p>Apparently, this is just some line-related redraw bug. As soon as the line above is affected, the bug disappears. Still annoying, indeed.</p>
