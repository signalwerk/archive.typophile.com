    html: <p>I agree with Karsten. It is not the job of a fontmaker to compensate bugs in OSes or applications. The interface between the fontmaker and the application/OS developer is the (OpenType) specification. If a font, which is conformant with the requirements and recommendations of the specification, behaves bad, then the bug is on the application side.</p>
