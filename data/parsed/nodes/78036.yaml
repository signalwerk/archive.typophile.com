      <p>If you just want to ask "what do people do" that can be done without getting technical. But you then bring up "arguments" (your word) for why people should do certain things.</p>
      <p>The arguments given are based on understandings or misunderstandings about some of the technical aspects of metrics. So I can't discuss those arguments for or against different kinds of spacing without getting technical and bringing up some of the same things (like what programs/OSes do what line spacing determined how) that are in the thread that you said you didn't want to talk about.</p>
      <p>&gt; - with a cap-height of around 700 upm, some parts of the font (accents or even ascenders) will reach out of the em and will be cropped in some programs (on screen).</p>
      <p>Going beyond the em does not result in cropping in almost any programs. Both Mac OS and Windows use things other than the em to determine where to clip, as discussed in that other thread.</p>
      <p>&gt; - if line spacing is left to auto, it often looks too tight. Sometimes ascenders and descenders even touch. If the letters are drawn smaller into the em, the line spacing looks larger and in most cases better.</p>
      <p>In typical Mac and Windows applications (like office type apps), line spacing is determined by things in addition to the size of the letters relative to the em, and you can set those metrics as you wish to get more generous line spacing. In more sophisticated DTP apps, yes, this can be an issue, though of course those users are supposedly more sophisticated and could adjust the spacing.</p>
      <p>The technical aspects are discussed in that "other thread."</p>
      <p>&gt; - on the other hand, some users might get confused if a font with the same point size all of a sudden looks much smaller.</p>
      <p>Agreed.</p>
      <p>&gt; - also some fonts with tiny details might have "resolution" problems when drawn too small (e.g. Zapfino with extremely tall ascenders).</p>
      <p>For this case, I don't see that a slight variation in size of the letters (in font units) is likely to help. Instead, change the resolution of the em. (e.g. 2000 font units instead of 1000).</p>
      <p>I haven't checked this, but I wouldn't be surprised if I learned that when Apple did their famous rescaling of Zapfino for OS X 10.2, they simply changed the size of the em while leaving everything else constant. Zapfino got smaller, but (if my supposition is correct) it would have done so with no loss of detail or change in the outlines. The max units per em (UPM) for TTFs is 16K, so that wouldn't have been a problem.</p>
      <p>Cheers,</p>
      <p>T</p>
