      <p><em>We don’t know if the sample we are shown are metal, or digital, or how old they are</em><br>
      Yes, we do. Or at least I can guess from both the language and the printing that this book is from the beginning of the previous century, i.e. between 1900 and 1930. Max Planck published his first major paper in 1900, and the text refers to one of Planck’s discoveries concerning radiation. That’s why <em>Alt Latein</em> is a good guess. German scientific publishers were very conservative typographically. </p>
      <p>Every foundry had a face like that, even before ATF Century (1904). As they were all more or less copies of each other, you’d have to look at a lot of old specimens to find the exact font. The book was probably set in Linotype or Intertype, but it could have been Monotype because of the amount of formulars involved. Mono wasn’t very widespread in Germany, but when it came to that type of setting, no other system was as flexible. </p>
      <p>Finding the exact face wouldn’t do you any good, as you’d want to set the book today, and presumably not in hot metal.</p>
