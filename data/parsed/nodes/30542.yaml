      <p>This might imply that the original typeface is Normande which was NORM found in a type-specimen by the Haassche Schrftgiesserei AG. Münchenstein.</p>
      <p>taken from the lineto website:<br>
      Called «Normande Halbfett» or «Antiqua Halbfett», its origins are a little unclear. «Normande» was published through the swiss-based Haas foundry, while the «Antiqua Halbfett» or «Gewöhnliche Antiqua» has its roots in Scotland and was published through Monotype in England at the beginning of the 19th century. The design is reminiscent of classical Antiqua faces like Didot or Bodoni, but is more accentuated.</p>
