      <p>I’m seeing differences in all of these Erik, with either the g, t or f. They are all close, including DeVinne, which was what Century was based upon, but I haven’t seen any that are exactly the same. We don’t know if the sample we are shown are metal, or digital, or how old they are. Both of these families have been produced in a host of versions, but using the sc, italics and the numerals hasn’t helped to isolate one from the sources I can find. If this is from a European foundry that none of us has information about we can look until we go blind, and never exactly match it. </p>
      <p>You may just have to pick the closest digital font you can find. We have given you some suggestions.</p>
      <p>- Mike Yanega</p>
