      <p>Looks most like Monotype Modern Extended (as suggested by Erik), of which it seems there were several iterations and lots of size variants (again see Erik above). I have had a look at <em>Book Types from Clowes</em> and it seems identical to Monotype Modern Extended No 1 except for the unique letter ’f’. </p>
      <p>Here’s a theory (maybe nonsense): </p>
      <p>Is it possible that German type needs a narrower ’f’ because the next letter is very often ’u umlaut’ (in the word ’für’ which I would guess is the most common word that uses the letter ’f’ in German and would give a rather unpleasant yet very common ’fü’ pair—see illustration below—with a standard English ’f’). Hence a ’German’ Modern (if well-crafted) will be slightly different (i.e. narrower) in the ’f’ department? Anyone ever thought about an fudiesesis ligature for the  word ’für’?<br>
      </p><div class="imageWrap"><img src="/files/fur_5339.gif"></div><p></p>
      <p> Finally, what about the pointy italic ’v’, that’s got to be a ’nu’ hasn’t it? Every Modern I can find has curvy  italic ’v’.</p>
      <p>Great type though. Whatever it is.</p>
