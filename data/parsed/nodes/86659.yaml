    html: |-
      <p>BTW if you are copying from one file to another, you don't have to reenter the name and unicode value -- while in codepages mode, use the 'append glyph' command rather than the paste command and as long as the name or unicode value don't conflict with anything in the destination font they will be preserved.</p>
      <p>André</p>
