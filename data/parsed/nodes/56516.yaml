    <p>Greater Albion Typefounders has just released Bonning on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/bonning/ "> Myfonts.Com</a>. Bonning is a Roman face full of the spirit of the 1920s.</p>
    <p>It was inspired by a (real)estate agent’s For Sale board seen in an old sepia photograph from that era and combines visual flair and period with good clear legibility. </p>
    <p>A range of Opentype features including alternate forms, old style numbers and fractions, as well as discretionary and standard ligatures are included. Three weights are offered, including a shadowed black form are offered, all in a choice of three widths. It’s the ideal face for signage with a period feel, as well as posters, headings and feature paragraphs.</p>
    <p>A full (and fully licensed) version of Bonning Wide Bold can be downloaded completely free of charge from <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/bonning/ "> Myfonts.Com</a><br>
    .  The restof the family can be purchased there.</p>
    <p>In the meantime Greater Albion's <a class="freelinking external" href="http://gatf.wordpress.com "> blog</a> has some examples of the Bonning family in use.</p>
    <p>4/4/09 = We're now running a 40% introductory discount on Bonning at <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/bonning/ "> Myfonts.Com</a>.</p>
