  html: <p>Hi, I'm seeking some font choice advice. My toy piano band Twink (<a href="http://www.twink.net" target="_blank">http://www.twink.net</a>) is releasing a "metal" EP, and I designed a special logo for the package. I'm wondering what typeface(s) might compliment the logo, for use in the album title ("Welcome to the Jingle"). Thanks! <br> <br><img src="http://www.typophile.com/forums/messages/30/6964.gif" alt="Twink metal logo GIF"> <br></p>
  html_clean: <p>Hi, I'm seeking some font choice advice. My toy piano band Twink (<a href="http://www.twink.net" target="_blank" class="link-external">http://www.twink.net</a>) is releasing a "metal" EP, and I designed a special logo for the package. I'm wondering what typeface(s) might compliment the logo, for use in the album title ("Welcome to the Jingle"). Thanks! <br> <br><img src="http://www.typophile.com/forums/messages/30/6964.gif" alt="Twink metal logo GIF"> <br></p>
