    html: <p>Thanks for the suggestions! I like the sketchy script idea, I may go with <a href="http://www.fontalicious.com/super/thug.html">Thug</a>. It's simultaneously whimsical and tough, and seems to be a good foil to a sculpted logo. (Track list will go below the title, possible in Bureau Grotesque. Bunny skull will be front cover, text on back.) <br> <br><img src="http://www.typophile.com/forums/messages/30/7001.gif" alt=""> <img src="http://www.typophile.com/forums/messages/30/7002.gif" alt=""></p>
