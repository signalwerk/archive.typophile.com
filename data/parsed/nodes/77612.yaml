    <p>Hi,</p>
    <p>I love Verlag but am looking for something like it with the range of fonts and nice pointy style. I'd ideally would like to buy individual fonts to start and build it up to the full set as I require. Verlag is over £300 which is very reasonable. However currently I can't cover it at the moment with other sets needed for my latest project. I have Neautraface and could get Neautra 2 which is a similar but has the less stylistic nuances. Can you suggest any others or is Verlag or Neautraface the best option?</p>
    <p>Thanks</p>
    <p>Dan</p>
  html_clean: |-
