    <p>Hello everyone!</p>
    <p>Welcome to the first Typophile <strong>Critique Thursday</strong>!</p>
    <p>Between the hours of 1pm – 3pm E.S.T., I'd like to invite all typophile to critique the following typefaces on our critique forums. Here are direct links:</p>
    <p><strong>Bitmap Display/Script</strong><br>
    <a href="http://typophile.com/node/7694" rel="nofollow">Trixie</a></p>
    <p><strong>Bitmap Text</strong><br>
    <a href="http://typophile.com/node/8034" rel="nofollow">Minque</a></p>
    <p><strong>Blackletter/Uncial</strong><br>
    <a href="http://typophile.com/node/5416" rel="nofollow">Adam</a></p>
    <p><strong>Display</strong><br>
    <a href="http://typophile.com/node/14471" rel="nofollow">Sëftos Parathenia</a></p>
    <p><strong>Display</strong><br>
    <a href="http://typophile.com/node/14471" rel="nofollow">Sëftos Parathenia</a></p>
    <p><strong>Motion/3d/Experimental</strong><br>
    <a href="http://typophile.com/node/5331" rel="nofollow">KUB</a></p>
    <p><strong>Sans</strong><br>
    <a href="http://typophile.com/node/14419" rel="nofollow">Parker Sans (Still Untitled…)</a></p>
    <p><strong>Script/Handwriting/Graffiti</strong><br>
    <a href="http://typophile.com/node/9315" rel="nofollow">AS Letters</a></p>
    <p><strong>Serif</strong><br>
    <a href="http://typophile.com/node/10479" rel="nofollow">Notanutha Serif</a></p>
    <p>My moderator access does not allow me to change the names of older threads. So while I didn't change the names of all the threads to read something like <strong>Critique Thursday: Featured Serif Design</strong>, I think that everything will be OK anyway.</p>
    <p>My appologies to designers who sent me suggestions that I did not use. It certainly does not mean that I don't like your work! I tried, wherever possible, to avoid typefaces that already had a lot of discussion (like Raph's, for instance).</p>
    <p>So, let's get on to the critique, and see what discussion comes out…</p>
    <p>For discussion on the idea "Critique Thursday" itself, please visit this thread: <a href="http://typophile.com/node/14608" title="http://typophile.com/node/14608">http://typophile.com/node/14608</a></p>
