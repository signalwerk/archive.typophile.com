    html: |-
      <p>Well yes the horizontal is a tad bit thicker because the arrow is going to be so weighted. The zig-zag looks way too fragile otherwise, and this looks better than that from my explorations. I might try narrowing the horizontal slightly, but the previous explanation still applies. A slanted arrow is simply not what I'm looking for, either.</p>
      <p>I wouldn't say anything is "at such a late stage;" the mark has been needing a suitable typeface for a while, and had been in the process of designing for quite a long time. My issue was whether to keep the thing in a box or simply to reverse colors from what you see here (which would make typesetting a bit easier).</p>
      <p>Because this is more of a feeling for me than anything I can state concretely, I'll graciously accept the input, but that goes in a direction I'm just not happy with. The logo grew out of how I sign the E in my name (one reason that slanted arrow would never work for me, and another reason why the whole thing sitting low is just fine with me). Whether or not one ever made that connection is of little importance--I don't really expect one would. The important thing to me is that I can see myself in it. What more can one ask for in a personal mark?</p>
