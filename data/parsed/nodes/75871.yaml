    <p>I hate asking for help when it comes to finding a suitable font for my identity/resume. But the time has come where soon, and for unfortunate reasons, I can finally afford to buy something that compliments my mark. I've been using Gill Sans (I know...I KNOW!...)</p>
    <p>But nothing I've found seems quite right. I want a geometric sans-serif that's versatile enough to work on my resume as well. I'ld like the typography next to the mark to read in UC or Caps/SmallCaps "EVAN BROGAN or Evan Brogan."</p>
    <p>Here's the mark:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/EflashSymbol_6073.jpg"></div><p></p>
    <p>There was something about <a class="freelinking external" href="http://new.myfonts.com/fonts/fontbureau/eagle" rel="nofollow">Eagle</a>which I liked, but the Uppercase G simply will not work, and I'm not a fan of the lower case A. And again there aren't enough weights.</p>
    <p>Some other ones I saw were <a class="freelinking external" href="http://new.myfonts.com/fonts/typeinnovations/contax-pro" rel="nofollow">Contax Pro</a> (almost perfect, and enough weights, but that uppercase R just kills it), <a class="freelinking external" href="http://new.myfonts.com/fonts/agfa/itc-kabel" rel="nofollow">Kabel</a> (not serious enough), <a class="freelinking external" href="http://new.myfonts.com/fonts/ef/litera/" rel="nofollow">Litera</a> (too geometric, in fact, with its perfectly rounded forms, and <a class="freelinking external" href="http://new.myfonts.com/fonts/bitstream/geometric-415" rel="nofollow">Geometric 415</a> (also very close to what I want but something seems off--maybe the contrast?).</p>
    <p>None of these work quite right. I'm spent. Any suggestions?</p>
