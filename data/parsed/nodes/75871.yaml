    html: |-
      <p>I second what Frode says about your mark. It catches my eye every time I saw your avatar (in the sense that there’s something wrong with it)</p>
      <p>I think you chose a very tricky form and despite the ‘plain’ look of your mark it is full of optical pitfalls.</p>
      <p>For example, besides the vertical arrow on the slanted stem, which gives the whole shape a broken look, the thickness of your horizontal stem is (optically) far thicker than the diagonals.<br>
      Also, the horizontal line seems to sit way too low, since the head of your arrow optically reduces the lower part. This bottom-heaviness reduces your logo’s dynamics and doesn’t correspondent well with the ‘propulsive’ shape of a slanted lightning, IMHO</p>
    html_clean: |-
