    html: <p>I did it for Which? magazine, so only they can use it. Sorry! <br> <br>I didn't do FF Sheriff. <br> <br>PS. James - how did you get these samples. Looks like somebody has been manual kerning on the serif; a bit tight between m and o.</p>
