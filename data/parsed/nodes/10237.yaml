    html: "<p>Which? Magazine (which is the same as your sample I believe) uses is a custom-designed font family simply called Which. There is a serif (like the sample ) and a sans in a variety of weights. I don't know who designed it.  <br> <br>Marc's suggestion of FF Sheriff is an excellent one since the lowercase looks nearly identical. I wouldn't be surprised if it was the same designer.  <br> <br>Here are samples:  <br> <br><img src=\"http://www.typophile.com/forums/messages/83/69475.jpg\" alt=\"\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/83/69476.jpg\" alt=\"\"></p>"
