    html: <p>The font we see is <a href="http://www.dafont.com/search.php?q=base+02&amp;text=AIDS+WALK" rel="nofollow">Base 02</a>. Its letterforms come from <a href="http://www.identifont.com/show?GL7" rel="nofollow">Helvetica</a> by Max Miedinger. The font itself was printed on paper, then the paper crushed and sprayed with white colour, the result scanned and newly digitized if I recall it correctly from a forum thread.</p>
