  html: |-
    <p>The Y is the most recognizable glyph, with its curved arms. The entire face is strongly influenced with formal hand-lettering. I’ve especially seen it used with religious materials.</p>
    <p>I’m pretty sure it’s commonly used and readily available, but after quite a bit of searching nothing’s turned up. I suspect it might be an Adobe product.</p>
