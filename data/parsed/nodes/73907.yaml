  html: |-
    <p>Our award-winning 'Tomate' is one of our best sellers and we have always felt it deserved to be expanded into a real type family.</p>
    <p>In its 2 years of existence 'Tomate' has been the typeface of choice in a large variety of packaging designs, where its friendly and joyful character plays an important role in making products attractive and sellable.</p>
    <p>Today we are introducing the 'Tomate family'; 4 weights ranging from Light to Black, with improved contours and expanded kerning, plus and alternative 'g'.</p>
    <p>Last but not least, the price of individual weights has been lowered from $55 to $45. Enjoy!  </p>
    <p>The Tomate type family can be purchased at <a href="http://www.re-type.com" title="www.re-type.com">www.re-type.com</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/tomatenewsletter5_4793.jpg"></div><p></p>
