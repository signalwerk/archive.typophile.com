  html: |-
    <p>Just finished a redesign of Pixilate, my small foundry with mostly handwritten/handdrawn fonts. It is now mobile and tablet friendly and uses a friendlier system for purchases. I also released <a class="freelinking external" href="http://www.pixilate.com/font/bellota/" rel="nofollow">Bellota</a>, an open source (OFL) display sans. </p>
    <p>Feedback is welcome on both site &amp; fonts. :)</p>
