      <p>Eventually, yes, XeTeX will hopefully do away with the complications, but at the present it still has issues with mathematical typesetting and microtypography, and the fact that virtual fonts are not supported breaks many things and makes others more complicated. And it's not really portable.</p>
      <p>XeTeX is a wonderful program, and saved the day of a friend of mine who had to typeset mixed English/Greek/Armenian for her thesis, but I'd not recommend it to new users at the present stage.</p>
