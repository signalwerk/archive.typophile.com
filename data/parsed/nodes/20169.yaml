      <p>TeX can use TrueType, PostScript, and OpenType fonts with the minor complication of remapping the encoding, which can be done using automated tools. Type1 outlines either from PFB or OTF work just fine with most current DVI drivers, TrueType outline support used to be limited to PDF creation, not sure how much the situation has improved. </p>
      <p>I doubt LyX does the re-encoding automatically, but I could be wrong. I'm not that enthusiastic on LyX myself.</p>
