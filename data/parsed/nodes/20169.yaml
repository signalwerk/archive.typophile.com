      <p>InDesign will also 'do things" to the default spacing in a typeface. If you allow it to use "optical" kerning/spacing, it ignores built-in kerning and uses its own algorithm. This is a good option to have if the font you're using is spaced badly or has no kerning. Not so sure I like it as default behavior.</p>
      <p>ID also has a preference hidden in the Type panel "Adjust text attributes when scaling", which I suppose is there to support Adobe's sizes, but which (I think) will add space between glyphs (globally) at small sizes, and reduce the letterspacing at large sizes. If you're used to a typeface performing a certain way at small sizes, you could get a surprise when you use it at small or large sizes. Mr. Phinney, care to elaborate? </p>
      <p>For a good all-purpose text family, try MvB Verdigris. Or, get Roman and Italic of Whitman from FontBureau, which is close to your budget.</p>
    html_clean: |-
