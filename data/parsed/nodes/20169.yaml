      <p>Carl Crossgrove wrote:<br>
      <cite>InDesign will also ‘do things” to the default spacing in a typeface. If you allow it to use “optical” kerning/spacing, it ignores built-in kerning and uses its own algorithm. This is a good option to have if the font you’re using is spaced badly or has no kerning. Not so sure I like it as default behavior.</cite></p>
      <p>I wouldn't either, but it isn't the default (using the font's built in kerning is). So InDesign will only 'do things' to the default spacing/kerning if you ask it to.</p>
      <p><cite>ID also has a preference hidden in the Type panel “Adjust text attributes when scaling”, which I suppose is there to support Adobe’s sizes, but which (I think) will add space between glyphs (globally) at small sizes, and reduce the letterspacing at large sizes.</cite></p>
      <p>No, that is not at all what it does. Basically the question is this: Do you want the text size to scale when you scale a frame? In other words, if you scale a frame that contains 12-point text to 75%, do you want it to then contain 9-point text? Or would you rather the text stayed at 12 point (possibly overflowing the frame)?</p>
      <p>Regards,</p>
      <p>T</p>
