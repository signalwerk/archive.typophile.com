      <p>Lyx supports any font supported by LaTex, including opentype, truetype and postscript. Tools available allow easy use of Adobe standard fonts (e.g., from linotype, adobe, and monotype), but something like Quadraat might be trickier (because osf is built into the vanilla roman -- not the "extended".)</p>
      <p>A dear, dear man by the name of Walter Schmidt already provided packages for using Aldus, Minion, Optima/Nova, Syntax, Sabon, Adobe and Stempel Garamond, Dolly, Frutiger and more. All the user needs to do is to license the font. <a href="http://home.vr-web.de/~was/fonts.html" title="http://home.vr-web.de/~was/fonts.html">http://home.vr-web.de/~was/fonts.html</a></p>
      <p>Lyx is an excellent way to get into typography, because it allows a Word user to enjoy the benefits of a typesetting engine out of the box and without paying. With time, a user must learn some LaTex to obtain specific results, but simple documents -- letters, articles, books -- can be produced simply by instructing the program what to set (e.g., a letter), and choosing the font and size. Latex takes care of the rest.</p>
