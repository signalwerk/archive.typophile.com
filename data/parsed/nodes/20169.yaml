    html: <p>Thanks for clarifying that preference, Tom. I have played with ID and there is some behavior that happens to text, which reminds me of the h-z program or some similar algorithm. I've set a paragraph of text in a single-master design like Bembo or one of my own designs, at about 7 point, then copied the text, without changing any atributes except changing point size to about 96 point, and then zoomed the 2 samples to the same large size onscreen, and discovered that the smaller sample was set looser and horizontally scaled. Same with the large sample; tighter spacing, slightly narrow. What is that? I thought that turning off the "text attributes while scaling" preference stopped that behavior. It's a real bother when I'm testing and proofing fonts in development.</p>
