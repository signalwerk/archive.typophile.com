      <p>Yes, Sabon Next is great, and you won't have to see the Sabon italic h. But let me ask you this:</p>
      <p>1. What's your budget?<br>
      2. What purpose will you use Sabon for? To make a shopping list, personal correspondence, or to set a book?<br>
      3. What software will you use? Will you use InDesign or something similar? If it's Word, don't bother - stick with what you have installed. (Someone here recently suggested Georgia, and I think it's quite usable at 10.5 pt).<br>
      4. Why Sabon? It's one of my favourite faces to read, but there are other good text fonts.</p>
      <p>As for your question, the cuts of Sabon are the same.There may be differences in Kerning etc.</p>
