    html: <p>It's a style from few decades earlier than art deco, however I think the design is slightly more recent. The full image can be seen <a class="freelinking external" href="http://1.bp.blogspot.com/_l7FSCh667AA/TEXyPwZK-GI/AAAAAAAAAck/SUlVnrDmTLk/s1600/073.JPG" rel="nofollow">here</a>. The frame looks art nouveau but the lettering is a more traditional style from around 1900. Have a look at <a href="/wiki/www.letterheadfonts.com" class="freelinking" rel="nofollow">Letterhead Fonts</a> for similar styles.</p>
