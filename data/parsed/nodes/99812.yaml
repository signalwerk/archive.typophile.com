      <p>Considering the title of the book, 82 and Penrose are probably not part of a font but a graphic design. The title ("INTERNATION ..." has NT and TH pairs which are likely hand composed.</p>
      <p>Here is a similar which is close except for the /W.<br>
      Ortiz-Lopez, Dennis/OLRoundGothic-Light<br>
