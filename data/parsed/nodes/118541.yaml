      <p>You are indeed correct. I re-checked and found that Sabon Next was not done by Kobayashi but by Jean-Francois Porchez.<br>
      Are you saying that this sword-like f is not a stylistic choice, but a compromise for the technology at the time?</p>
      <blockquote><p>When italic /f starts a line, it goes way over into the margin otherwise.</p></blockquote>
      <p>Good idea! I guess I have just focused on the stylistic side other than the practical function.<br>
      But, are they stylistically bad because a straight end is not most italic small f's are hand-written (viz. not following what a serif glyph should conventionally behave)?</p>
