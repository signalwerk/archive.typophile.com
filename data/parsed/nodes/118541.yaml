    html: <p>If I'm not mistaken, I think that it's Jean-François Porchez, not Akira Kobayashi, who reverted to the curly form of italic lower-case <cite>f</cite> for the Sabon Next version. Tschichold's original design for this particular glyph may have been dictated at the time by the limitations of the Linotype hot-metal typesetting system, which did not allow for kerning letters.</p>
