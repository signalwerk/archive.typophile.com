      <p>When the technical constraints that Sabon faced are mentioned, I am always reminded of the typefaces designed for the IBM Selectric Composer. All of them faced the same constraints as Sabon: as with Monotype, the widths of the characters were according to a unit system; as with Linotype, the italic and the normal (and also the bold) were the same width.</p>
      <p>For comparison, here is Journal Roman, which I've thought of as the Garamond from the set of faces they had (although, looking at the bold, it also reminds me of Perpetua). This is from a scanned version of IBM's catalogue on the web, and the scan isn't the greatest, but it seems to be passable as long as one ignores the artifacts in the background.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Journal_6731.jpg"></div><p></p>
