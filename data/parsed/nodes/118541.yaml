      <p>The whole Sabon project was indeed a matter of compromises : the brief Tschichold received asked for a Garamond-style text design suitable for handsetting, Monotype and Linotype hot-metal composition — three different systems with hugely varying technological constraints.<br>
      In my opinion, the fact that Tschichold managed to overcome all these limitations and to answer the brief in such a masterly fashion makes the original Sabon one of the greatest typographical masterworks of the twentieth century.</p>
