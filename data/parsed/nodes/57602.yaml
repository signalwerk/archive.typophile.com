    html: |-
      <p>"I always thought that obliqued was the same as italics"</p>
      <p>In some fonts obliqued is sometimes called "italics", but in true italics the letters are not just slanted, they also have different shapes. Often the a, e, f and g (among others) are different in the italic than the slanted Roman letter would be.</p>
      <p>The example attached is a serif font sample (Mikaway), but the same applies in Sans Serif fonts. It's true that more sans serif faces use and obliqued Roman as their "italic", but many do not.</p>
      <p>- Mike Yanega</p><div class="imageWrap"><img src="http://typophile.com/files/mikaway_full_5022.gif"></div><p></p>
