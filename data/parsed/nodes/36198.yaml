    <p>When I showed my monospace at the Typecon typecrit one of the items that was brought up was the punctuation. The suggestion was made that I more fully tune the shapes to the letterforms. I am realizing Now I am starting to reconsider it’s design and I am interested in:</p>
    <p>- which fonts’ punctuation you admire and why<br>
    - things you may have noticed or learned about the relationship between the design of letters and of punctuation<br>
    - the way in which a font being a monospace impacts the design punctuation - things like the need for a mono’s punctuation to fill a little bit more space than normal and the need for it to be a bit heavier than normal as well.</p>
