      <p>I don’t know what your intention for the font is, but as a programmer, who uses monospaced fonts daily, I’ll put my two cents in. I feel most monospaced fonts fail bacause of their punctuation. One of the reasons I think Monaco works so well is it’s punctuation is clear but not overpowering, it’s well balanced with the alphanumeric characters. ProFont’s punctuation is too dark, it overpowers the characters, although it does have a large following. I would like the new Microsoft programming font by Luc(us) de Groot except for the double bowl “g” which bothers me. The punctuation marks have a nice balance but I feel they need a bit more height. </p>
      <p>Chuck</p>
