    html: |-
      <p>Don, could it be a problem for people who <em>have</em> seen typewritten pages?  I think typewriter appearance to be nice, because I associate it with individual, hand-made documents (in contrast to machine-made documents like serial letters, advertising, etc.).  It has a more personal touch in my eyes, which is the reason why I use typewriter-style fonts for printed letters.</p>
      <p>Cabrito’s unagitated style (to avoid the term “bland”) is, in my opinion, in line with the illustrations.  I think rich colours and image contents can still provide a lot of fuel for imagination.</p>
