      <p>Actually, I think that kid’s art, lettering and writing is lovely, not terrible.<br>
      That was also the sentiment of artists such as Picasso and Klee, who sought to capture some of its naive quality in their own work.</p>
      <p>But a font like Besley is a poor emulation, most obviously because it has no “pseudo-random” quality.<br>
      For instance, it makes no sense that the glyphs are supposedly imprecisely drawn, and yet you get two /l’s together that are absolutely identical!<br>
      And everything adhering to rigid baselines.<br>
      It’s a travesty of what it purports to represent (unless the typographer goes in manually to bounce, rotate, and scale letters so that they vary each time).</p>
      <p>It’s purpose in a book like this is to signal “this is for children”, not “this is to be read by children”.</p>
      <p>The bad writing of adults, whether innate or feigned, is quite a different thing than the emerging ability of a child.</p>
      <p>Why not hand-letter or hand write the text, or get a child to do that?</p>
