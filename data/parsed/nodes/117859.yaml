      <p><cite>However, I will say that I think it is really stupid to use fonts that have been created by ham-ﬁsted adults to look as if kids drew them. It shows zero respect. After all, most adults’ writing is just as terrible as most children’s, and yet we honor adults with the sophistication of Bembo and Garamond.</cite></p>
      <p>Normally, hand-drawn letters are technically not as perfect as printed letters. That doesn't mean they can't be perceived as beautiful.  Many people, especially parents, may find children's drawings to have some kind of beauty in their own right.  Now I think it shouldn't be forbidden to show such pieces of beauty or wake associations with them by similarly-styled drawings or fonts.  An image like that reminds me of the fun children have scribbling and drawing and of their creativity.  It doesn't remind me of limited abilities.</p>
      <p>Of course, that doesn't mean these associations are appropriate in every case that involves children.  It may be that such "childish" fonts are used too often.  But still, I think it's perfectly acceptable to use them if they fit the topic.  Just as it's acceptable to use imperfect adult handwriting fonts in some cases!</p>
