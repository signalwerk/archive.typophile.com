      <p>Nick is right that the lines and fills in the artwork have a smooth digital finish, and so should the type. I thought Les's suggestion of Maiandra was good--it's got some personality, but it doesn't fight with the art.<br>
      Romiko prefers a serif, though. And low contrast with blunt serifs is one way of interpreting <em>blobby</em>, so maybe this is a job for <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/souvenir/" rel="nofollow">Souvenir</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/cheltenham/" rel="nofollow">Cheltenham</a>, both designed by Morris Fuller Benton, who also designed Romiko's first pick of Century Schoolbook.</p>
