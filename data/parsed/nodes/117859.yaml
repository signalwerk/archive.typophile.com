      <p>I don’t believe I actually recommended Comic Sans, I merely said that it would be better than Besley.</p>
      <p>Without seeing the page layout, size, and the amount of text on a page, I would be loth to recommend any particular face.</p>
      <p>However, I will say that I think it is really stupid to use fonts that have been created by ham-ﬁsted adults to look as if kids drew them. It shows zero respect. After all, most adults’ writing is just as terrible as most children’s, and yet we honor adults with the sophistication of Bembo and Garamond.</p>
      <p>Looking back at my favorite books when I was a child, they were set in the same fonts as adult books. Garamond, Baskerville, etc., including Century Schoolbook, of course.</p>
      <p>This “cloisonné/coloring book” technique of illustration reminds me of the Mr Men books I read to my children in the 1980s, for which the typeface was Univers, IIRC.</p>
