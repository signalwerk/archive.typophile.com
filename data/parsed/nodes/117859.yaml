      <p>I disagree with the resident gurus who propose Comic Sans. Using it with these illustrations turns the book into a McBook, quickly forgettable and something less likely to attract sustained interest. It also precludes the opportunity to encourage children to be able to transition from unstructured lettering to the serifed fonts used in most adult books. Finally, as a parent, I would go stir crazy reading Comic Sans day after day to a child. I can't see any charm of a child's fantasy world in Comic Sans.<br>
      Don</p>
