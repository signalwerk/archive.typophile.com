    html: <p>I like typewriter type and own several vintage typewriters, but I don't think typewriters have been in common usage in the U.S. since the late 1980s.   Typewriter fonts used to be a common graphic design look, but not so much anymore (except in certain specific situations).  I still like the look (I'm in my 50s), but anyone under 35 or so may have never used one, so it may have little meaning other than looking retro.</p>
