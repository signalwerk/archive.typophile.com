    html: |-
      <p>Thanks for all responses guys!<br>
      I did ask MyFonts.com this very same question directly. They kindly replied:</p>
      <p>"It is quite rare to register trademarks for font names. As I understand it, the main benefit of registering a font name is that you get triple damages in the event of a violation. For small foundries and independent designers the cost of registering a trademark is unlikely to be cost effective.<br>
      All that is generally necessary is to ask us to mark your font name with a TM to signal the fact that you consider it to be your trademark. This is sufficient to establish priority in the use of the name for commercial sale of the font."</p>
      <p>So, no cost and no guarantees. Not that I'm cheapskate (although Dutch) but there are not a lot a guarantees in life anyway. And *if* someone does copy the name, I'll consider that flattering.</p>
