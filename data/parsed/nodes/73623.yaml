    <p>I've been working on a font and I just came up with a great name for it. I've searched the internet and there's nothing alike. I really want to use this name.<br>
    I saw in earlier threads that you can't copyright the name. So, what steps should I take? Just hope someone else doen't take it first? Pre-register it at MyFonts?</p>
