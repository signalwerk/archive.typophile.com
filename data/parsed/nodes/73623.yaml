    html: |-
      <p>Jean Paul: </p>
      <p>I don’t work for MyFonts but in my opinion this is something they cannot deal with: even if you can pre-register your font (which I don’t think is even possible), this is not going to protect you against someone else using “your” name. MyFonts is a commercial website, not a government office.</p>
      <p>If you want to protect the name, you must go to the EU Trademark Office. According to <a href="http://oami.europa.eu/ows/rw/pages/CTM/feesPayment/feesPayment.en.do" title="http://oami.europa.eu/ows/rw/pages/CTM/feesPayment/feesPayment.en.do">http://oami.europa.eu/ows/rw/pages/CTM/feesPayment/feesPayment.en.do</a>, the fee to be paid is 900 euros if you file online. It is valid for ten years, and then you must renew it (1350 euros). It must be a very good name indeed.</p>
    html_clean: |-
