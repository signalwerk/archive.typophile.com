    html: <p>In Europe you are better of. As long as you pursue infringements on either an established name, or infringements on your design you are pretty golden. As I understand it, typeface designs are not protected in the US because it was ruled that they constitute 'derivative works', and as I understand it, derivative works cannot be copyrighted. This is partly why typefaces have protected Trademarks (proper), because it is the only properties of a typeface the foundries <em>can</em> protect. Correct me if I'm wrong please.</p>
