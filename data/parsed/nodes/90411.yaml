      <p>@James, I think I will stay with justification, because whether I try to widen the columns or not, in 3 column outline I guess I won't get to a result that satisfies me soon.</p>
      <p>@riccard0, thanks, I didn't know we could do google search on Typophile, the one it has not really functioning properly if you ask me.</p>
      <p>@kentlew, thank you for the long explanation! that was really helpful. Now I realize whatever I do won't help me to achieve such effect because so many variations are interconnected to each other, I think I can only come out with something "agreeable". Also your last post made me "illuminated" once again because that is what I was talking about at first, algorithm of InDesign doesn't let us go straight with the numbers but does it's own way. So I was trying to make minimum space 100%, or maximum space 100%, realized both doesn't let me stay in the exact amounts, only on average "100%"s. I guess the only way would be to find something average and rewrite the lines, which is not practical at all.</p>
      <p>@Bert Vanderveen as in the screenshots below I've tried according to your suggestions and Kentlew's, and some other adjustments visible. If you open the images in new tab there are h&amp;j settings on the right of the images.</p>
      <p>As in this picture, letter spacing downed to 0.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ss1_6058.png"></div><p></p>
      <p>These are my current settings, as you can see f and t letters are nearly being a ligature, I may be exaggerating. But as you can see at the second and last line on the image, the word spacing is pretty tight.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ss2_4551.png"></div><p></p>
      <p>On this last image, I put down all values to 0 more or less, but now indesign highlighted all of my two pages nearly, and it is right because the minimum word spacing is likely preserved, but now I'm afraid of big gaps everywhere even leading to something worse: rivers<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ss3_5335.png"></div><p></p>
      <p>I thought I might have come to something satisfactory with using -20 tracking (these images are in -10 tracking), then I realized I will be sacrificing less glyph scaling, and less of letter spacing (used nearly none of both). Word spaces were mildy improved. But then I am not sure how Minion Pro would look with -20 tracking , I haven't tested it yet that way. </p>
      <p>I also would like to ask, how much should one care about indesign's h&amp;j violations? Because when I change the letter spacings to 0 and glyph scaling also to 0 (while adjusting other settings mildly), there is not even line changes on most of the page. Only glyphs move on nanometric levels, some letter spacing, but not even a word moves to next line.The only difference between -3 letter spacing and 0 spacing is just indesign's making it "highlighted" sometimes.</p>
