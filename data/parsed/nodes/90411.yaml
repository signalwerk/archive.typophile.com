      <p>Nice write up of the process, Kent.</p>
      <p>IMO Americans mishandle workspaces and the standard settings in InDesign reflect this — way too wide. Wordspaces should be in the range of the widths of /i/ to /n/ for serif type and in the range of 'up to' or 'around' the width of /n/ for sans.</p>
      <p>A good way to define the settings is to start with the Letter space and Character scaling locked to 100% and begin with just the Word space settings (I start with something like 75/90/100), playing around with that and choosing an optimum for the desired effect.<br>
      Then you’d add some latitude for Character scaling (just a few percents both way).<br>
      You should forget about Letter space — that’s just plain bad and ugly.</p>
