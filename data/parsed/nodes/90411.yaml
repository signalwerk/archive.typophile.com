      <p>Just to clarify: Setting the Maximum word space to 100 does not prevent the justification engine from using word spaces much larger than that. I think this is a common misunderstanding. (Not necessarily you, Bert; you probably know what you’re doing.)</p>
      <p>The Maximum word space value establishes the upper bound when calculating possible justification schemes for a line. But if the justification engine cannot find a way to justify a line within the given parameters, then as a last resort it will only add extra space to justify.</p>
      <p>That is to say: if the constraints in the H&amp;Js are too limiting, then it’s entirely possible to get lines that are very loose, where the justification engine was unable to find an acceptable solution and had to throw up its hands and just space out the line.</p>
      <p>It’s counterintuitive, but setting your parameters too narrowly can sometimes yield more loose and gappy lines.</p>
