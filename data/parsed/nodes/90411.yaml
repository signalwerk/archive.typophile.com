    <p>Hello dear Typophiles,<br>
    This is my first post, after sneaking around for a long time , I think it is finally my turn to ask.</p>
    <p>I am working on a magazine project, whatever I did, I couldn't come up with a nice charming justification setting. I've inspected other magazine designs online and on press, and I've realized that designer has to sacrifice a part while saving other parts in justification, like to keep the letter spacing and glyph scaling on reasonable levels (or not using at all), usually word space is sacrificed excessively.<br>
    I've spent nearly two of my weeks just measuring many possibilities. Before I go nuts, I've decided to consult you people out there about some things.</p>
    <p>About my design, here are the key points of my design that I've learnt here what affects justification:<br>
    <strong>Column width</strong> is 156.882pt<br>
    <strong>Font</strong> is Minion Pro (10pt) / -10 Tracking<br>
    <strong>Type of magazine</strong> is Economy (long words are common)<br>
    <strong>Justification settings</strong>: Word S.:80/133, Letter S.:-3/+3 , glyph scaling: 98/102, Adobe Paragraph Composer</p>
    <p>What I want to do is to keep minimum word space on reasonable levels on a real basis of between 90% and 100%, as I don't want too close words one near another, loose lines would be okay to make a sacrifice for now. Also I don't know if I can explain but when I look at a column, I want to be able to pick words when I look at a column, when I seek my eyes across columns I want them to be pick-able, noticeable, I don't want them to get lost in column crowd, I don't know how you guys call this phenomena.</p>
    <p>So when I alter the settings, for example between 80% and 99%, there is not really a big difference at all, til I make it 100%, then it gives me what I want. There's a huge difference between 99% and 100%, 99% is not "99%" at all. I also realized that letter spacing and glyph scaling changes the word spacing, regardless of word spacing preferences, not even mentioning hyphenation settings now, so everything is messed up for me. I have really started to doubt about the practicability of indesign's justification algorithm, sometimes it is just so out of proportions.</p>
    <p>I really would love some example justification settings as start that I can stay sane with Minion Pro I guess.Thanks already for your kind responses.</p>
    <p><em>Screenshot of some too close word spacing I work on (justification settings are same as above) : <a href="http://tinyurl.com/83ny64l" rel="nofollow">http://tinyurl.com/83ny64l</a></em></p>
