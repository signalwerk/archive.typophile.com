      <p>The justification engine in InDesign is a complex beast and the relationship between the values in the Justification settings and the results is far from obvious. </p>
      <p>The numbers that are entered in the Justification settings of InDesign are parameters. These parameters are then used to establish a “scoring” system that the algorithm uses to evaluate the various possibilities of adding or removing space to justify a line. This is typically used in conjunction with an evaluation of all reasonable hyphenation points as well (according to the parameters set in the Hyphenation Settings), so it is all quite interconnected.</p>
      <p>At the end of which, InDesign applies the solution with the least-bad score. If you selected the Single-line Composer, then it will move on and not look back. </p>
      <p>If you have selected the Adobe Paragraph Composer, then it will look forward and backward through all the lines in the paragraph (and all their possible scores) and adjust them to achieve the best *average* least-bad scores over the range, which may or may not yield an optimum score for any given line.</p>
      <p>Setting Optimum word spacing to 99% only yields 99% of the font’s nominal wordspace value on the last, unjustified line of a paragraph. For all other lines, it just resets the reference point from which the algorithm calculates the score. </p>
      <p>In many, many cases, there are only a few reasonable break points for justifying a given line of text within the constraints of a setting (e.g., the content, the font, the size, the line-length). So, minor twiddling of the optimum value may not change the results at all.</p>
      <p>The Minimum Word Spacing value establishes the smallest word space that the algorithm will allow in its calculations of possible justification settings for a line. InDesign’s engine will calculate using only word spacing until it reaches that minimum, after which it will then start applying negative letter-spacing down to the minimum value set for that parameter. After which is will continue by reducing glyph width, down to the minimum value set for that parameter.</p>
      <p>Take note that decreasing letter-spacing (and glyph scaling, to some extent) will have a continued effect on the perceived word space. I don’t know if letter-spacing continues to operate directly on the word space itself (I’m pretty sure it does when applying manual tracking, for instance), but at the very least, it reduces the space on either side of the word space because of the reduced sidebearings on the adjacent letters.</p>
      <p>In a quick test I just did, it looks like -3% letter-spacing for Minion yields a word space that looks roughly equivalent to 94%.</p>
      <p>So, I might guess that in the particular example that you cited, where changing minimum word spacing value below 99% did not yield appreciable difference, what was likely happening is that you were just exchanging letter-spacing for word spacing.</p>
      <p>If you had a setting where the solution arrived at by the algorithm involved word space values in the 94% range, and then you changed the minimum limit to greater than 95%, the engine would start applying letter-spacing instead and would likely arrive at a similar solution which used something like -2.5% letterspacing and yielded word spaces that were very close to where you started from — no appreciable difference.</p>
      <p>The more word spaces there are in a given line, the more likely this reciprocal exchange of letter space for word space.</p>
