    html: |-
      <p>Don't start with the bold cut yet.</p>
      <p>Bowls of /a/ and /e/ should be about the same size. I would make the bowl of /e/ larger.</p>
      <p>The tails on /h l n/ don't make sense unless you carry it through in the entire font.</p>
      <p>/g/ needs to be cleaner.</p>
      <p>The stroke endings on /v w x y/ just don't do it for me.</p>
      <p>Crossbar of /f/ and /t/ could be longer (to the right)</p>
      <p>Caps need to be cleaner. /H U/ are too narrow. /V/ is too wide.</p>
      <p>The ascender on /t/ is a bit too tall IMO.</p>
      <p>You have too many different concepts going on. For example the dots on /i j/, the dot in the /zero/ and the dots on /divided by/ are all different. A typeface needs to express unity.</p>
      <p>Good luck!</p>
      <p>Cheers, jasper</p>
