      <p>Proportions generally look good!<br>
      The horizontals of /E/F/L/T/ may be a little too stiff?<br>
      I don't get the ear on the /8/.<br>
      The varying near-horizontal angles on the bottom half of /g/ get kind of noisy.<br>
      For this style, I think a little horizontal connector at the join of /k/K/ might be suitable.<br>
      /e/ may be a little too tightly wound in the middle.</p>
