      <p>How long ago did you visit the site? If you’re on a Mac running Safari you can goto to the ’History’ menu and ’Show All History’ near the very bottom. By default it is set to save all of the sites you’ve visited during the last 30 days. A quick scan can sometimes jog a memory.</p>
      <p>Here is a list of foundries that I have in my bookmarks with a ’dark background’. By no means a complete list but maybe one matches the picture in your head.</p>
