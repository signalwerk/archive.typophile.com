  html: <p>Hi. I'm Diego Sanz Salas. I'm 24 years old peruvian designer. My first font is Sencilla. I'm working it at fontstruct.fontshop.com . You can download it at <a class="freelinking external" href="http://fontstruct.fontshop.com/fontstructions/show/4701" rel="nofollow">http://fontstruct.fontshop.com/fontstructions/show/4701</a> . Now it has 1254 characters for Latin Extended, Greek Polytonic, Cyrillic, Armenian, Hebrew and Arabic. I'm working now on Thai. I want to fix all the mistakes you could found. Please leave your commentaries here <a class="freelinking external" href="http://typophile.com/node/49355" rel="nofollow">http://typophile.com/node/49355</a> or in the fonstruct site.</p><div class="imageWrap"><img src="http://typophile.com/files/sencilla_6726.gif"></div><p></p>
