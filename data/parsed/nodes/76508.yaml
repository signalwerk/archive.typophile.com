    <p>I am looking for a way to describe in detail an Arabic 3 (٣) <a href="http://digs.by/dmKpa9" title="http://digs.by/dmKpa9">http://digs.by/dmKpa9</a> but I do not know the proper typography terminology. I have been trying to find a way to describe the difference between the top of the ٢ and ٣ basically the difference between one looking like a U and other a W.</p>
    <p>Do you have some resources or refences/cheat sheets that you can point me to?</p>
