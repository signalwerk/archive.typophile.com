    html: <p>May be, may be because it were too ugly as Yakout (which implements the same ideas) were picked by newspapers and remains in use even today. Also the largest Egyptian press by then, Bulaq, later simplified their typecase but in a much less drastic way (from 470 to 238 glyphs without counting vowel marks, compared to 135 glyphs in the Academy case including vowel marks).</p>
