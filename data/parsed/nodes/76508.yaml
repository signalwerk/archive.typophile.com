    date_raw: 21 Nov 2010 — 10:09am
    votes: null
    html: |-
      <p>The Academy is mainly concerned about linguistic issues, but one of their interesting type related proposals was their simplified Arabic typecase where each letter has only two glyphs; one for initial and medial forms and one for isolated and final forms, with the main intent of decreasing time and cost of the printing process. Those that typecase were never used (expect in composing the booklet proposing it), it can be seen in later development's like Linotype Yakout.</p>
      <p>There were also some recommendations about the positioning of diacritical dots and vowel marks to make it less ambiguous (calligraphers tend to position them freely on artistic basis, sometimes making text unreadable).</p>
    html_clean: |-
