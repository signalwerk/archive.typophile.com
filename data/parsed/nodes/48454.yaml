    date_raw: 25 Aug 2008 — 6:54am
    votes: null
    html: <p>What appears inside the car is the logo and logotype for the golf course and resort. Something that was probably not designed to be used as a special edition luxury car logo, but instead to evoke certain emotions related to the golf course—which I think it does rather successfully. I'm guessing then that the exterior badge was intended to look similar to the Pebble Beach logotype, except they failed at that. If the exterior tag was properly set like the logotype, I'd have no real problem with it (typographically at least).</p>
