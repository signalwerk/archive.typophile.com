    <p>As it is I’m not too fond Lexus automotive design, but then they drop the ball on the typography.</p>
    <p>Its just so sad...</p>
    <p>Decent coupe<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/lexus_4213.sc430.pebble.beach.edition.500.jpg"></div><p></p>
    <p>then this abomination<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/lexus_6355.sc430.pebble.beach.edition.badge.500.jpg"></div><p></p>
    <p>nice luxo barge<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/lexus_6446.ls600h.l.pebble.beach.edition.500.jpg"></div><p></p>
    <p>then again with the ugly graphics... so sad<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/lexus_3560.ls600h.l.pebble.beach.badging.500.jpg"></div><p></p>
    <p><a href="http://www.edmunds.com/insideline/do/News/articleId=130806#8" title="http://www.edmunds.com/insideline/do/News/articleId=130806#8">http://www.edmunds.com/insideline/do/News/articleId=130806#8</a></p>
    <p>Toyota, the Lexus division parent, is no stranger to nasty car logos and marquees. No even the junk Dafont is this bad :<br>
    <a href="http://toyota.jp/carlineup/name.html" title="http://toyota.jp/carlineup/name.html">http://toyota.jp/carlineup/name.html</a></p>
    <p>So who gets it right? There are only a few a carmakers and their probably owned by...???</p>
    <p>Stay Tuned,</p>
    <p>Mikey :-)</p>
