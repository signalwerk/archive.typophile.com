    html: |-
      <p>The first font used on the side emblem of the car is a bit horsey. Sort of fat and not very "luxurious". The font on the emblem on the inside of the car (quite possibly the same font, but kerned out a bit and used in small caps) seems more luxurious and a bit more suitable for such an application. I think the typography in the second image applied to the first would have been a much nicer treatment for the emblem design of a $50k car.</p>
      <p>IMHO.</p>
      <p>/mattjohn</p>
