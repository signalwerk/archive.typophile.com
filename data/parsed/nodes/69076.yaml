      <p>In capable hands, there is no reason why PMN Caecilia cannot work with Frutiger. Better still, Frutiger Next.</p>
      <p>For the opposite query, where Caecilia is the display face in need of a text companion, Cf. <a href="http://typophile.com/node/50705" title="http://typophile.com/node/50705">http://typophile.com/node/50705</a></p>
