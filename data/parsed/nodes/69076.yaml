  html: |-
    <p>I'm working on a booklet, and was wondering if these two typefaces, Frutiger (sans serif) and Caecilia (slab serif) would work well together. Frutiger would be used in headings/subheads, while Caecilia would be applied to body text.</p>
    <p>Anyone have experience with these two typefaces?</p>
