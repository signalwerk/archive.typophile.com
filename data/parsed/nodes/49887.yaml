    <p>I want to reverse the colors of the below logo.  I want the lettering to be white and the surrounding color to be that blue (well really, I want the surrounding color to be transparent, but the specific blue will do). I don’t know if it can be done and I don’t have a lot of money.  I’ve tried to locate the exact font, but to no avail.  The “e” and the “r” are never correct.  Avant garde gothic pro book is the closest I’ve been able to come.</p>
    <p>I understand that all you designers out there will rate this logo bad to poor.  Regardless, I’m stuck with it for the meantime. Sorry.</p>
    <p>Any help is greatly appreciated,</p>
    <p>Cameron</p>
