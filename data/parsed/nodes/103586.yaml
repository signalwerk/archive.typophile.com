    <p>Hello,<br>
    Poli is my second font, it's a 4 font complete sans serif family. It's a display typeface I guess. I wanted something elegant and crisp, something masculine and feminine at the same time. Poli inverses&nbsp;with some letters (c o d l p…)&nbsp;the classical thickness of the font (downstrokes are commonly down, upstrokes are up).<br>
    As I'd like to release it  - so that I can begin another project - I'd like to ask here some critical advice...<br>
    Thank you,<br>
    Serge<br>
    <a href="http://www.serge-paulus.be/docs/poli.html" title="http://www.serge-paulus.be/docs/poli.html">http://www.serge-paulus.be/docs/poli.html</a></p>
