    <p>I need a slab serif for a project and think I will go with <a class="freelinking-external" href="http://www.vllg.com/Schwartzco/Stag/mudTyper+Weights/">Stag</a>. I would rather get <a class="freelinking-external" href="http://www.vllg.com/KLIM/National/mudTyper+Weights/">National</a> instead of Stag sans. On the type tester, it seems like they would work well together, but I would love your opinions.</p>
    <p>Is Stag/National a go or a no?</p>
    <p>Sharon</p>
