    html: |-
      <p>Try and get the entire mark reading as a single element, rather than a collection of elements that are stacked on and around each other. </p>
      <p>Also most company's budgets barely have enough allocated to promote 1 logo, let alone 3. Work on a single strong logo, then look at a graphic system that supports it. </p>
      <p>You could even think about implementing it with stamps – it would give it a hand crafted feel, link to trading seals, and would be able to turn any old piece of paper into stationery.</p>
    html_clean: |-
