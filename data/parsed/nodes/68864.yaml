    html: |-
      <p>I like it. There are only a few things to tune. (I have no tips to add.)</p>
      <p><cite>The "two typefaces" rule: it doesn't apply here. I think you graciously succeed in giving the right retro feel.</cite></p>
      <p>For me that is the most difficult thing in those projects.</p>
      <p>With regard to the rooster and the "The". It takes a bit of the asymmetry of the ampersand back. Without it, the asymmetry would drag attention in a negative way. That’s good. If Bello drags to much attention, may be dependent from the size in this case. And in the example with the background pattern, I think Bello drags less attention.</p>
