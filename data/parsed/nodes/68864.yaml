      <p>I quite like what you have going there - some ideas:</p>
      <p>• not sure about the 'The' at the top. Even though I like Bello very much, it seems overpowering and drawing too much attention to itself.<br>
      • you might consider increasing the stroke width of the shadow on 'MARKET' as there is a danger of it disappearing at smaller sizes.<br>
      • maybe decrease the size of the stars?<br>
      • slightly more space between 'FARMERS..' and 'MARKET'?<br>
      • like Picard said, maybe remove the '2010' and use the space for 'EST. 1931'</p>
      <p>Looking forward to how this turns out.</p>
      <p>Seb</p>
