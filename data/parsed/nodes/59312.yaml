    <p>I know this is a bit cheeky to ask about because its not about type but does any one know what this fold is called? I have attached an image. I know the 4 panels across fold into a parallel fold but what is it called with the other 3 rows added? Does that question make any sense? There are 24 pages all together.</p>
    <p>Thank you for help in advance.</p>
