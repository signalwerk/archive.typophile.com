      <p>I think some outfits might refer to it generally as a “map-fold” — i.e. anything with multiple folds in both directions. </p>
      <p>But you’ll still want to communicate very clearly with mock-ups or diagrams which folds you want where and consult with a production manager to make sure it’s possible. Do you want a Z-fold vertically followed by a parallel 4-panel fold? Or do you want a tri-fold followed by a parallel fold? Edge to the top or edge to the bottom? etc.</p>
