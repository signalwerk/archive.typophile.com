      <p>Do as Kent says: work closely with the printer. Make a dummy. &amp; make sure you and the printer consider how much any type block or image area may “move” as the thing is folded and paper is used up to accommodate the folds and the increasing thickness of the thing. You may have to manually move some items to or away from the folds.</p>
      <p>Check out</p>
      <p><a href="http://www.foldfactory.com/index.php" title="http://www.foldfactory.com/index.php">http://www.foldfactory.com/index.php</a></p>
      <p>I did not look to see if they deal with a question such as yours; they might.</p>
      <p>powers</p>
