      <p></p><div class="imageWrap"><img src="/files/EmigreNews_6036.gif"></div><br>
    <div class="imageWrap"><img src="/files/MatrixIIEmail_6579.gif"></div><p></p>
    <p>Matrix II<br>
    A redesign by Zuzana Licko</p>
    <p>Matrix II is a complete reworking of the Matrix type family which was originally designed by Zuzana Licko in 1985. The redesign, which started in January 2007, was initiated by the need to create an OpenType version of Matrix. With the hood open, so to speak, Licko used the opportunity to make subtle changes and to fine tune many of the existing characters which were designed some 20 years ago. The contrast between thick and thin strokes was decreased in some instances, and overshoots were corrected. The width of various characters was adjusted and regularized. The cross stroke on the f was simplified on most weights. The design of the lower case g was revisited and an alternate single story version was designed and added to the OpenType version. Seven new fonts were also added to the family: a Semi Narrow, Semi Wide, Semi Tall, Inline Italic, and 3 weights of Italic - a less flamboyant version of Matrix Script. To clearly set this version apart from the original Matrix, and to avoid conflict with previous versions, its name was amended to Matrix II.</p>
    <p>To read the full story behind the design and redesign of Matrix, please visit our website:<br>
    <a href="http://www.emigre.com/EFfeature.php?di=105" title="http://www.emigre.com/EFfeature.php?di=105">http://www.emigre.com/EFfeature.php?di=105</a></p>
    <p>View and order all Matrix II fonts here:<br>
    <a href="http://www.emigre.com/MatrixII" title="http://www.emigre.com/MatrixII">http://www.emigre.com/MatrixII</a></p>
    <p>Available in Macintosh, Windows or OpenType formats.<br>
    Registered customers may upgrade their Matrix fonts to the corresponding Matrix II or OpenType format for 50% of the Matrix II or OpenType price. To order an upgrade, please complete this <a href="http://www.emigre.com/UpgradeForm.php">form</a>.</p>
    <p>The Matrix II OpenType fonts include the following features:<br>
    Small Caps, All Small Caps, Proportional Old Style Numbers, Proportional Lining Numbers, Tabular Old Style Numbers, Tabular Lining Numbers, Superior Numbers and Scientific Inferior Numbers, Numerator and Denominator, Fractions and Arbitrary Fractions, Ornaments.</p>
    <p>How to Order<br>
    To order any items announced in this email click on the links in the text above or go to: <a href="http://www.emigre.com" title="http://www.emigre.com">http://www.emigre.com</a></p>
    <p>To order via fax; print out the <a href="http://www.emigre.com/EFax.php">fax form</a>.</p>
    <p>Contact Emigre<br>
    Emigre, Inc.<br>
    1700 Shattuck Ave., #307<br>
    Berkeley, CA 94709, U.S.A.</p>
