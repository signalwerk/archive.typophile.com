    <p>We learned a some months ago that MS Word 2010 rasterizes OpenType Postscript flavor fonts when it makes a PDF, causing less-than-good appearances in some cases.<br>
    <a href="http://typophile.com/node/72404" title="http://typophile.com/node/72404">http://typophile.com/node/72404</a></p>
    <p>Now MS Word SP1 has been announced, but I have not read that this has been improved. Info on Word 2010 SP1 is here:<br>
    <a href="http://support.microsoft.com/kb/2460049" title="http://support.microsoft.com/kb/2460049">http://support.microsoft.com/kb/2460049</a></p>
    <p>I am hoping that Microsoft made an undocumented change and fixed this. Can anyone say yes or no as to whether this rasterization process has been changed in Word 2010 SP1?</p>
    <p>Thanks.</p>
