      <p>Usually, ligatures had not worked well with sans faces, but yours is a cool try, even when it's heretic.<br>
      I agree with Nachos on preserving font consistence.<br>
      Anyway, I find some quirk effect in the encounters.<br>
      Probably they needs to be softened.<br>
      Let me show you some quick experiments I did on it, though some are very obvious and not well spaced (counterforms are unbalanced):<br>
       </p><div class="imageWrap"><img src="http://typophile.com/files/st_3690.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/fi_3563.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/fl_6233.jpg"></div><p></p>
      <p>MarS</p>
