    <p><strong>Syntax</strong></p>
    <p>Syntax is a typeface designed by <a href="/node/15605" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hans Eduard Meier</a> for in 1968 for <a href="/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel <span class="caps">AG</span></a>. Syntax is a humanist sans serif, which was inspired by <a href="/node/15602" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Sabon</a>’s proportions. Syntax was the last new typeface ever designed by Stempel for metal&nbsp;typesetting.</p>
    <p>Over the next three decades, Syntax would be converted for use with photo- and digital typesetting systems. The typeface is available in digital format from <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>.</p>
    <p>During the late 1990s, Meier revised and extended his Syntax typeface, creating <a href="/node/15604" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype Syntax</a>. Linotype Syntax has two additional serif companion sub-families: Linoytpe Syntax Serif, and Linotype Letter (an informal serif face). Linotype Syntax is part of <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>’s <a href="/node/15662" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Platinum Collection</a>.</p>
