    <p><strong>Syntax</strong></p>
    <p>Syntax is a typeface designed by <a href="/wiki/Hans%20Eduard%20Meier" class="freelinking" rel="nofollow">Hans Eduard Meier</a> for in 1968 for <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a>. Syntax is a humanist sans serif, which was inspired by <a href="/wiki/Sabon" class="freelinking" rel="nofollow">Sabon</a>'s proportions. Syntax was the last new typeface ever designed by Stempel for metal typesetting.</p>
    <p>Over the next three decades, Syntax would be converted for use with photo- and digital typesetting systems. The typeface is available in digital format from <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>.</p>
    <p>During the late 1990s, Meier revised and extended his Syntax typeface, creating <a href="/wiki/Linotype%20Syntax" class="freelinking" rel="nofollow">Linotype Syntax</a>. Linotype Syntax has two additional serif companion sub-families: Linoytpe Syntax Serif, and Linotype Letter (an informal serif face). Linotype Syntax is part of <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>'s <a href="/wiki/Platinum%20Collection" class="freelinking" rel="nofollow">Platinum Collection</a>.</p>
