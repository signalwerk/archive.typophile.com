    <p>Hello,</p>
    <p>I’m about to start writing my diploma thesis in media computer science.<br>
    The idea that occurred to me first was trying to improve an aspect in the process of type design, as I really like the combination of design and technology.</p>
    <p>So I had a look at FontForge and FontLab with regard to the ease of use for designers. OpenType feature creation in those tools seems to me not to be made for people with a less technical background. Even OTMaster and VOLT which claim to do or sound like doing so didn’t meet my expectations in this respect. </p>
    <p>That’s why I think about developing a more designer-focused tool…</p>
    <p>My first humble ideas are:</p>
    <ul>
    <li>A tool to visually edit OpenType features with emphasis on a user-friendly interface (without unexplained cryptic abbreviations)</li>
    <li>Integration of the specification in a way that it doesn’t clutter the user interface but is always within reach</li>
    <li>I’d like to both offer visual tools as well as allowing for directly editing the code</li>
    <li>That would have to include live-updating and checking feature code on the fly…</li>
    <li>But on the other hand it could avoid/indicate errors before font is compiled</li>
    </ul>
    <p>Probably, I will be focusing on AFDKO-syntax. So far I don’t have a decent knowledge of AFDKO, but I already read quite a bit about OpenType and AFDKO and I’m following the threads in this forum about OpenType development for a while (I especially enjoyed reading <a class="freelinking external" href="http://typophile.com/node/55208" rel="nofollow">this one</a>). Also, I did my own first tests with OpenType feature generation using AFDKO.</p>
    <p>Now I’d really like to know what you think of my <em>vague</em> idea. Is it reasonable? Probably I missed some important aspects. Ideas and criticism are very much appreciated. Eventually, I might as well need some test persons in order to evaluate my prototype.</p>
    <p>Thanks for reading and for your comments!<br>
    But dont’t forget: it’s only a diploma thesis…</p>
    <p>MiZ</p>
