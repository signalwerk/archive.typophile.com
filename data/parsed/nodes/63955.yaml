      <p>What I would find useful is a standalone program that can automatically set up OT classes and code based on what glyphs exist in the font using Adobe’s suggested glyph naming. A good app for building combining diacriticals would be a big help as we don’t have one on the Mac platform AFAIK. You should also get in touch with people who build fonts with lots of complex replacements—Patrick Griffin at Canada Type, Ale Paul at SudTipos, and House Industries—to see if they have needs that current software is not meeting.</p>
      <p>I second Mark’s suggestion that you look up Tal’s code. You should also contact Tal and Erik van Blokand to see if there’s pent-up demand for something that nobody has got around to yet.</p>
