  html: <p>Is there a rule-of-thumb for how much to stretch variants of a typeface? For example, if it's 75% as wide, is that condensed or ultra condensed? Or is it all simply relative to my own designs?</p>
  html_clean: <p>Is there a rule-of-thumb for how much to stretch variants of a typeface? For example, if it's 75% as wide, is that condensed or ultra condensed? Or is it all simply relative to my own designs?</p>
