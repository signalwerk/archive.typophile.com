    votes: null
    html: |-
      <p>No rule of thumb that I know.<br>
      When I condense a font I would usually use 80% as my simple condensed. It's interesting to note that FontLab uses 80% as the default change in width in its action menu, but does not give it a name. BTW 75% also is OK to call condensed without any qualifiers.<br>
      Don</p>
