      <blockquote><p>Just like you did with the Muslim pizza boy, I hope you'll check to see if you agree with his sociopolitical stance before working with him.</p></blockquote>
      <p>Thanks for the thought hrant.<br>
      He's edgy. Raw edgy in a urban Us vs Them sort of way but for the most part his lyrics aren't anything too 'damaging' for me to be associated with. </p>
      <blockquote><p>So who's the mystery rapper? Kevin Federline?</p></blockquote>
      <p>He's black loud and proud ...sorry that's not much to go on but I'm not going to pimp his rep. </p>
      <p>My only true concern is the quality of my work ...especially if I've had to think over it for awhile.  I want to get better with every piece I do.  And I've come to realize that thinking and rethinking dummies down the energy of a piece of work. But there are times, and they're coming more often than not these days, when I seem to be able to nail a subject. And that gives me hope for survival. </p>
      <p>If people dig what I do ...then that's awesome!!! but that's not going improve my work. I guess, in a way, I'm seeking some sort of truth in my own ability using type/typography as a means of expression.</p>
      <p>Sorry to have babbled on ...and on ...and on.</p>
      <p>n.</p>
