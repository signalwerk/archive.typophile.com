      <p>Thanks again for remark(s) Chris. I picked those up over at the dollar store ...I got two large and six small complete alphabets (number set included), for something like 4 dollars! They're made of foam. That gives them durability :)</p>
      <p>Think of me purchasing those alphabets as a lot like purchasing a font license. </p>
      <p>And no, I didn't just throw them down to create that composition. I composed them in the same manner as you would with any other type. To me, the piece is of a broader definition of typography...</p>
