    html: |-
      <p>So awhile ago now I had the great honor of receiving an email from an EMI hip hop/rapper recording artist. He wanted to get one my graphic designs inked on his arm.  </p>
      <p>This request blew me away for a ton of reasons.</p>
      <p>Of course I said yes and asked for him to send over a photo of the piece ...and he did!! along with the request of me sending over to him and his crew anything I thought he would enjoy.  So ever since then (this all happened a couple of years ago) I've been bombin' his personal email with most everything I've been doing!! He actually takes the time to respond to my work. Not all of it, but most all of it. Very cool stuff indeed.</p>
      <p>So I sent over the image frontin' this thread ... and he absolutely loved it!!!  Here is what he sent me today...</p>
      <p>"And by the way that pic you sent me with the mic hanging over all the letters is super cool i posted it on instagram everyone's loving it, even my rapper friends that arn't so "artsey" think its sick!! lol It is now my official background for my iphone."</p>
      <p>He went on to request  prints of my other work to hang all around his recording studio ...!</p>
      <p>...thought I'd share.</p>
      <p>n.</p>
