    html: <p>I know that there is a growing trend towards the appreciation of things authentic and and-made as opposed to mechanical. For example, calligraphy and hand drawn scripts are becoming popular, eating local, hipster-farmers &amp;c. This hand-writing thing is another manifestation of it, and the 3D scribbler aesthetic is simply a clever bit of retro-vernacular. How an 11 year old beat them to the punch by six years is blowing my mind!</p>
