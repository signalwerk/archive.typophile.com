      <p>Give me enough time and I can work hipster-bashing into almost anything. For example, you know how its possible to go to a Halloween party and dress up in a costume like someone from the 80’s or 90’s? Well in a few years, if not now, you could dress up like a hipster c 2005-10. Poor hipsters. What will they do next? Prediction: It sure an isht won’t be farming.</p>
      <p>Re the afore hand drawn 3D letters, I seem to be seeing them in a lot of newer movie credits as of late. Pseudo-indi comedies. Can’t name specifics atm. Nothing against the letters personally, I actually did a lot of that in jr. high myself (before it was cool of course). </p>
      <p>Next up: liquid-paper letters on jeans (I also did that before it was cool). -1 to any hipster who who never actually used liquid-paper as a student. -10 if they haven’t even heard of “liquid-paper.”</p>
