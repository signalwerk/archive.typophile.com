    html: |-
      <p>I documented the SWFTE fonts here</p>
      <p><a href="http://www.forgers.de/swfte.pdf" title="http://www.forgers.de/swfte.pdf">http://www.forgers.de/swfte.pdf</a></p>
      <p>It should be mentioned as an irony of fate that the SWFTE font forging company forged the fonts of the Bitstream font forging company, which had forged the Linotype font collection. Strangely enough, the Bitstream font forging company (and other font outfits, e.g. Adobe) sued the SWFTE font forging company (see the court file: Bitstream, Inc., et al., v. SWFTE International Ltd., Case No. 93-11068H, District of Mass.), i.e. „forger v. forger“, so to speak, but the claims of the font forging plaintiffs were dismissed by the Massachusetts court.</p>
