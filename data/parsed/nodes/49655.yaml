  html: |-
    <p>Hello,</p>
    <p>I did a search for "Swfte" on the forums and did not find any hits. </p>
    <p>One of my art directors wants to use Swfte International's "Circus" font. </p>
    <p>1. Does anyone know if the outlines still exist for this font and who has the rights to it? I'd like to get it licensed.</p>
    <p>2. Can you suggest a similar font that we can buy instead?</p>
    <p>3. Anyone know the story behind Swifte? I remember them from way back but haven't heard of them in ages.</p>
    <p>Thanks,</p>
    <p>Kristin</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Circus_5967.gif"></div><p></p>
