      <p>It's an interesting project. My first thought was a font that is probably not technically Medieval, but <a class="freelinking external" href="http://new.myfonts.com/fonts/sherwood/p22-aragon/" rel="nofollow">P22 Aragon</a> has a nice old style with legible lower case.</p>
      <p>I'm sure you will get other suggestions, but this was something I've used and liked.</p>
      <p>- Mike Yanega</p>
