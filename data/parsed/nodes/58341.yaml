    html: |-
      <p>If Medieval means blackletter, you’re in a trouble, but if that is the case I’d choose some rotunda in the spirit of <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/san-marco/" rel="nofollow">San Marco</a> (not really Medieval, it’s early Renaissance).</p>
      <p>If your Medieval concept accepts Carolingian times, I’d say something like <a class="freelinking external" href="http://www.paratype.com/fstore/fonts/Alcuin.htm" rel="nofollow">Alcuin</a>.</p>
      <p>For nice capitals: maybe overused, but <a class="freelinking external" href="http://www.paratype.com/fstore/default.asp?fcode=609&amp;letter=C" rel="nofollow">Charlemagne</a> could be an option.</p>
