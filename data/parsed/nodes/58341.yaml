    <p>Hi!</p>
    <p>I have to make a brochure for a necklace that is supposed to come from medieval times and so they’ve asked me to use an appropiate font. But, the fonts I’ve found are nice for maybe the name of the product or just an important sentence but not for explaining the one page long legend that is related to it. Any suggestions on a couple of fonts that can have nice capital letters but are readable without getting tired of them?</p>
    <p>Thanks a lot!!!</p>
