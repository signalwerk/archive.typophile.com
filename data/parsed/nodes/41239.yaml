    <p>I'm doing some fixes on few OT fonts for a client, only one of which I did any previous work on. the others all work fine and only need a few cosmetic fixes. This one however, they say they can't access alternates. The feature code in this one I noticed is quite simple. In Calt feature it basically substitutes an alternate every time 2 characters are typed in a row. So you'd get c o o.alt l for "cool".<br>
    	The font works perfectly on my computer and I'm still trying to troubleshoot. Here's what I've found out so far:<br>
    Client has Mac OSX 10.1.1  InDesign CS2 and uses Suitcase 11.02 for a font manager. My tests were on ID CS3   OSX 10.4.8  I use Font Explorer.<br>
    One thing I thought might be up is a conflict with Stylistic sets. In InDesign I tried selecting both Stylistic sets and Contextual Subs at the same time. The Stylistic sets (and SALT) are all set up the same as CALT feature. This caused the substitution to go wacky and my default A would not come in as she described. She checked and said they weren't both selected and it happened no matter what was off or on.<br>
    	Any ideas where to go with this next? I wondered about simply deleting the SALT and SSxx features and see if that might cure it. but that doesn't seem very clear to me.</p>
    <p>Stephen</p>
