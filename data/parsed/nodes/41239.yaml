      <p>I do recall reading about a change that occurred in CS3 where an old model for scripted substitutions was dumped in favor of another. Fonts made with the new version (5) of fontlab contain code that should work in both cs 2 &amp; 3. The two places I recall bumping into something like this were in the fontlab 5 PDF guide and maybe also in a PDF available from Thomas Phinney's blog. I will see if I can dig these citations up. Hopefully they are relevant. </p>
      <p>In the meantime why not post the code so we can see what you are really dealing with?</p>
