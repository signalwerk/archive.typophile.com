    html: |-
      <p><cite>I looked for that option in preferences. If only I knew what I was doing???</cite></p>
      <p>The option which you marked red in your screenshot should be off, yes.</p>
      <p>If I understand your feature order (post of 23.Jan.2008 7.40pm) and the feature code (post of 23.Jan.2008 5.56pm), then if a user switches on 'ss01'/'ss02', then <em>all</em> 'normal' glyphs will be replaced by alternates, since substitution in these features is non-contextual. And once that happened, your 'calt' will not show any effect, of course.<br>
      One possible solution is using contextual substitution in 'ss01' and 'ss02' too. Then, if both 'ss01'/'ss02' and 'calt' are on, there's nothing left for 'calt' since there's no match for the context any more.</p>
      <p>You write that </p>
      <p><cite>The Stylistic sets (and SALT) are all set up the same as CALT feature.</cite></p>
      <p>but your code does not reflect this. 'ss01' is not contextual, 'calt' is. (I think that 'salt' doesn't matter here since it is not addressed by InDesign.)<br>
      Also you may check if the code</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;<code>sub @upper @upper’ by @calt1;</code></p>
      <p><em>really</em> does what you want. In your description you say </p>
      <p><cite>In Calt feature it basically substitutes an alternate every time 2 characters are typed in a row. So you'd get c o o.alt l for "cool".</cite></p>
      <p>but what the feature does is substitute every second uppercase or lowercase by its alternate form, so if you type "cool" what you get is c o.alt o l.alt.</p>
      <p>Karsten</p>
