      <p>Here is the text I was thinking of from the Fontlab User Guide:</p>
      <p><cite><strong>Contextual substitutions in invalid legacy format</strong></cite></p>
      <p><cite>Due to a misunderstanding between Adobe and Microsoft, early versions of<br>
      Adobe InDesign (1.0, 1.5 and 2.0) contained a bug in the interpretation of<br>
      contextual substitutions (for features such as calt or clig) so only “invalid”<br>
      contextual substitutions work in these early versions . In Microsoft<br>
      applications, only “valid” contextual substitutions work. InDesign CS and<br>
      CS2 have a special routine so both “invalid” and “valid” contextual<br>
      substitutions work.</cite></p>
      <p><cite>If you enable this option, FontLab Studio will generate a font with “invalid”<br>
      contextual features that will work correctly in InDesign 1.0, 1.5 and 2.0 as<br>
      well as InDesign CS and CS2, but these contextual features will not work in<br>
      OpenType-savvy applications from Microsoft or other vendors.</cite></p>
      <p><cite>If disabled, “valid” contextual OpenType features will be generated that<br>
      will work in InDesign CS and CS2 and all other applications, but not in<br>
      InDesign 1.0, 1.5, 2.0. It is recommended to keep this setting disabled.</cite></p>
      <p>Does this help?</p>
