    html: <p>Not quite sure if this is what you did, but you shouldn't use contextual substitutions in the <code>salt</code> feature. You should only use simple substitutions (<code>sub x by x.alt ;</code> or <code>sub x from [x.alt1 x.alt2 x.alt3] ;</code>, for example). No idea whether this is what's causing the problem.</p>
