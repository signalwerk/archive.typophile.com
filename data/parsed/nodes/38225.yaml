    html: <p>How <cite>alternative</cite> do you wanna go? There is no 100% equivalent to a top class font for free, and I doubt there is a 90% one, whatever that might be. You might wanna read <a href="http://letterror.com/content/value/index.html">The value of type</a> by Erik van Blokland and the <a href="http://typophile.com/node/14652?">FAQ on Free Fonts</a>.</p>
