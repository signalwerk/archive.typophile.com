    date: 2004-11-09T04:47:00
    votes: null
    html: <p>Ruia, your problem is your thinking with the computer rather than your creativity. Grab a pen, go to a cafe, grab a napkin and draw crazy ideas. The more the merrier. Once you have an idea then refine it in pen or pencil and show it to some other creatives and get feedback. Then go to the computer and you will look for the fonts that fit your design. <br> <br>One other thing. Research! Visit competive sites even local retail stores. See what they are doing right and wrong. Hang in there and post some of your ideas.</p>
  - id: 51622
    user_id: 1461
    user_name: aluminum
    user_path: null
    user_image: /files/pictures/picture-1461.gif
    date_raw: 9 Nov 2004 — 9:04am
    date: 2004-11-09T09:04:00
    votes: null
    html: <p>As much as I'll probably take heat for this, I will say that the specific font isn't that important. You're over-thinking the details before your thinking about the big picture. <br> <br>What are the goals of the new logo? What's wrong with the old one? What types of applications will the logo be used on? What's the target demographic? What's the competition look like? Etc, etc. <br> <br>Don't worry about a specific typeface at this stage...that will come naturally later on.</p>
