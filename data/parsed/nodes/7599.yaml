    html: <p>Ruia, your problem is your thinking with the computer rather than your creativity. Grab a pen, go to a cafe, grab a napkin and draw crazy ideas. The more the merrier. Once you have an idea then refine it in pen or pencil and show it to some other creatives and get feedback. Then go to the computer and you will look for the fonts that fit your design. <br> <br>One other thing. Research! Visit competive sites even local retail stores. See what they are doing right and wrong. Hang in there and post some of your ideas.</p>
