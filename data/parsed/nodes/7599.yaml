    html: <p>I highly recommend Erik Spiekermann's <a href="http://www.amazon.com/exec/obidos/ASIN/0201703394">Stop Stealing Sheep &amp; Find Out How Type Works</a>, it's a good basic tutorial on type styles and how/when/why to use different fonts. Ask Santa for a copy!</p>
