  html: <p>Hi everyone, im in need in help.  i am still a student and i am taking typography classes and all that good stuff.  im a graphic designer.  the thing is that i dont know what fonts to choose for certain situations.  people think faster then me, like it just clicks with them.  i lose sleep thinking about fonts and sometimes it makes me ill.  Does anyone else have that problem??  well my brother is expanding his corporation and he wants a logo design for "Internation Flooring", which that is the name.  I guess his theme is Home of fine carpet.  (which that is fine, but i dont know where to start.)  how do i incorporate international.  its not like it has an image or a color, its international.  As, for carpet, carpet has a texture to it, so what font would i really use.  Do i make it more classy font, more wavy, more bubbly.  Im just clueless. ANd his theme, do i add it in the logo or leave it out. I told him that it would take me forever and im not that confident yet, but he has faith in me so i dont want to let him down,  any suggestions???</p>
  html_clean: <p>Hi everyone, im in need in help.  i am still a student and i am taking typography classes and all that good stuff.  im a graphic designer.  the thing is that i dont know what fonts to choose for certain situations.  people think faster then me, like it just clicks with them.  i lose sleep thinking about fonts and sometimes it makes me ill.  Does anyone else have that problem??  well my brother is expanding his corporation and he wants a logo design for "Internation Flooring", which that is the name.  I guess his theme is Home of fine carpet.  (which that is fine, but i dont know where to start.)  how do i incorporate international.  its not like it has an image or a color, its international.  As, for carpet, carpet has a texture to it, so what font would i really use.  Do i make it more classy font, more wavy, more bubbly.  Im just clueless. ANd his theme, do i add it in the logo or leave it out. I told him that it would take me forever and im not that confident yet, but he has faith in me so i dont want to let him down,  any suggestions???</p>
