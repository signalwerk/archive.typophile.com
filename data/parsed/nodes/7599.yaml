    html: <p>Draw, sketch, draw, sketch, make notes, experiment with type faces on your computer and print out the results. Keep challenging your decisions. Look at things by the dawn's ugly light. Draw, sketch, draw, sketch, ad infinitum. Guys who hit home runs have been swinging bats at fast balls for more than a semester.</p>
