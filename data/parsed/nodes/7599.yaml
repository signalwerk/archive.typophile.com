    html: <p>As much as I'll probably take heat for this, I will say that the specific font isn't that important. You're over-thinking the details before your thinking about the big picture. <br> <br>What are the goals of the new logo? What's wrong with the old one? What types of applications will the logo be used on? What's the target demographic? What's the competition look like? Etc, etc. <br> <br>Don't worry about a specific typeface at this stage...that will come naturally later on.</p>
