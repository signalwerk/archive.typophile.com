    <p>The company I work for needs to purchase a font for use in a trade show poster design.</p>
    <p>By itself, the font (Interstate-Light), is $40 &amp; the whole family, (40 fonts, 7 weights) is $1440. It’s a big company and they can afford it—so cost is not a big deal.</p>
    <p>Could ~280 fonts ever be necessary? We’re only using one for the posters &amp; maybe a few more for  collateral materials. How many is just enough?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/17772" class="topic-previous" title="Go to previous forum topic">‹ Why is a zero often very contrast-less?</a> <a href="/node/19218" class="topic-next" title="Go to next forum topic">PixelFont fits with Frutiger ›</a></div>
