    html: <p>I had to doublecheck... Interstate is 40 weights “only”. But still in my eyes it’s a huge family. If you can’t see any immediate use for the full family, I don’t really see any point of buy more than the single weight alone. My own biggest family Sophisto, consists of 21 weights (or rather styles). A single weight is $40 and the whole family is “just” $179. Then you might think it is worth to by the whole thing. But in the Interstate case, the weights just add on without getting cheaper, more or less. I myself tend to get lost if the families are to big. To me it’s also a bigger challenge to use a moderate ammount of weights for a design and squeeze the most out of it all.</p>
