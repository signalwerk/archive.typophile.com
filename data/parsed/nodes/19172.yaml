      <p>I agree with Tiffany on this, with one small exception... depending on the actual material, I would forgo the Hairline and thin unless your business is: Fashion, interior design, jewelry or general pompyness. Also, the Ultra black is fun, but really not that useful... Stay closer to the middle and mix it up a bit.</p>
      <p>Ok, scratch that... use a different font. Try Champion Gothic from H&amp;FJ</p>
