    html: |-
      <p>I have found that working with very large families, such as Neutra or Knockout, is too much work. I hardly ever use those fonts because the range of styles is too large and complex for day-to-day design. So large, in fact, that it becomes necessary to make a printed chart to hang near my desk to refer back to.</p>
      <p>It is tempting to get a huge number of fonts all at once — and perhaps you should, if you have the opportunity — but only install the ones you need, and keep a printed copy of the sample on hand. Otherwise you may find yourself bogged down with a huge font menu.</p>
    html_clean: |-
