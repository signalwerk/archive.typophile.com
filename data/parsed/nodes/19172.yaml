      <p>I’ll say it. Greed is good. :^/ Seriously, if Interstate is going to be the typeface for all collateral and they can afford it you should save the money*—as you do save when you buy quantity—and buy as many as possible. </p>
      <p>On the other hand. I have been known to skip weights when licensing type. For instance with Interstate, pick the absolutely necessary weights and styles and go every other one from there.</p>
      <p>weights:<br>
      Hairline<br>
      <strong>Thin</strong><br>
      Extra Light<br>
      <strong>Light</strong><br>
      Regular<br>
      <strong>Bold</strong><br>
      Black<br>
      <strong>Ultra Black</strong></p>
      <p>styles:<br>
      Compressed<br>
      <strong>Condensed</strong><br>
      Regular<br>
      <strong>Italic</strong></p>
      <p>*It’s $40 for one or $25 ea for all. This is based on a license for 1 CPU.</p>
