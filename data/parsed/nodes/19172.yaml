      <p>Hi Ian,</p>
      <p>I think you just answered your own question. 280 fonts is (not just propably) too much if you only make posters and little collateral materials. It would make sence if you are doing the complete corporate design on all levels.<br>
      I tend to use not more than 6 fonts per client/projects: regular, bold, black, + corresponding italics.<br>
      Interstate has very effective condensed and even compressed fonts that might be very practical for some print material. So my collection sometimes extends to 9 fonts (romans only).</p>
