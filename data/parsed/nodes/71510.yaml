    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Germanica_4204.png"></div><br>
    I have made a new blackletter type, called Germanica, based mainly on that of Fust and Schöffer (c. 1457). The font includes a number of ligatures and scribal abbreviations. It’s an Opentype font, and it can be downloaded (free of charge) from <a href="http://www.iol.ie/~sob/clonna.html" title="www.iol.ie/~sob/clonna.html">www.iol.ie/~sob/clonna.html</a>.<p></p>
