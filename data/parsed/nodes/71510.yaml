    html: |-
      <p>"You surely know that these Latvian characters have been added to Unicode recently –?"<br>
      If you want to do it correctly you can use gklnr with a slash INSTEAD of commaaccent in the same places. About long s with a slash - no it is not in unicode, but if you want to type historical texts correctly you have to figure out a way how to do it. I wrote a stylistic set for old Latvian where slash longs substitutes for longsslash.</p>
