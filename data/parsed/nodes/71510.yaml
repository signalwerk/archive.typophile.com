    html: |-
      <p>Great typeface! Thank you!<br>
      Perhaps you or anybody else know about any glyphs with diacritical marks or ligatures and what languages beside German and Latvian used blackletter in newspapers and book publishing in 20th century.<br>
      I am trying to properly digitize Rudolf Koch's "Kochschrift" or as it appears on several places on the web as "Deutsche Schrift" (all these versions are just scanned and traced without any language support or ligatures)<br>
      For example in Latvia blackletter was used in book publishing and press well into nineteen thirties and had slightly different orthography as was used later after change to Latin type. Instead of commaaccent g, k, l, n and r were crossed with slash, longs was used for the sound of "z" even at the end of the word, but for the "s" in the middle of the word was used longs with a slash.<br>
      Yet unfinished version of the typeface I'm working on you san see here: <a href="http://lamatasunslazdi.photoshelter.com/gallery-image/Typefaces/G0000ZSHRmaOGNFA/I0000oZtWzqzCRnE" title="http://lamatasunslazdi.photoshelter.com/gallery-image/Typefaces/G0000ZSHRmaOGNFA/I0000oZtWzqzCRnE">http://lamatasunslazdi.photoshelter.com/gallery-image/Typefaces/G0000ZSH...</a></p>
