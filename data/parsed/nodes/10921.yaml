    html: "<p>Something else. <br> <br>First I space it! Then I kern based on test texts etc. <br> <br>Obviously don't kern numbers if you want aligning figures. Kern what you need to suit what you're doing, don't over kern it looks awful. <br> <br>Different names: \"KD Helvetica Headline\" <br> <br>Unethical, probably against the licencing, potentially fairly dangerous (fonts floating around with different names, what do they do, is there some conflict in PS names, have references to the original been lost... if you've done something like this then you can take responsibility for it, but other's may not really understand the process and consequences).</p>"
