    html: "<p>1) Although I tend to place more value on \"deep\" kerning than most people, I do agree with the conventional feeling that base spacing is very important. Not just for users sans access to the font's kerning value (due to SW), but also because it makes kerning easier. Many fonts needs re-spacing more than re-kerning. <br>2) Kerning everything is not done because it's not worth it, and it bogs down the OS font engine. I use two kinds of data: linguistically frequent pairs (and words), and rare but highly problematic pairs. Spacing/kerning is actually a very pragmatic process, even though it's really mostly technical. <br>3) Differentiation: A good method is to use a name that starts with 3 or 4 of the same letters as the original, preferably alphabetically right afterwards. <br>4) Sharing: some people would call it \"unprofessional\", but to me <i>not</i> sharing (at least to a reasonable extent) is unethical. <br> <br>Pricing: no joke! I can do the job, for a reasonable fee. <br> <br>hhp <br></p>"
