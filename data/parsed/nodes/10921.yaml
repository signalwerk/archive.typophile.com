    html: <p>Neo and Hrant, I definitely agree on re-spacing fonts! <br> <br>I'd love it if folks would explain the sort of guidelines they use when they kern fonts.  <br> <br>Do you use Fontographer, FontLab, something else? <br> <br>Do you kern every character combination, including numbers, punctuation etc.? Is there a reason why you would and would not do that? <br> <br>How do you differentiate the kerned fonts from the original fonts? <br> <br>Hrant, you make a joke about pricing, but please explain further. Is it just too expensive and or time consuming to kern an entire font? <br> <br>Also, since there have got to be other nutcases .... er, I mean "artists" ... out there who kern the heck out of their fonts, is there any effort  to share this information with one another? Would that be ethical? <br> <br>I'm very curious to hear your responses. <br> <br> <br></p>
    html_clean: <p>Neo and Hrant, I definitely agree on re-spacing fonts! <br> <br>I'd love it if folks would explain the sort of guidelines they use when they kern fonts.  <br> <br>Do you use Fontographer, FontLab, something else? <br> <br>Do you kern every character combination, including numbers, punctuation etc.? Is there a reason why you would and would not do that? <br> <br>How do you differentiate the kerned fonts from the original fonts? <br> <br>Hrant, you make a joke about pricing, but please explain further. Is it just too expensive and or time consuming to kern an entire font? <br> <br>Also, since there have got to be other nutcases .... er, I mean "artists" ... out there who kern the heck out of their fonts, is there any effort  to share this information with one another? Would that be ethical? <br> <br>I'm very curious to hear your responses. <br> <br> <br></p>
