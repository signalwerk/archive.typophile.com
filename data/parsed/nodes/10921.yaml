  html: <p>Here at slow-to-upgrade corporation (still using OS 9) we are having discussions about our kerning options. We make an effort to improve the quality of fonts we use on large campaigns. In the past, we've used Quark kerning tables, but we have moved to doing most of our kerning in Fontographer. <br> <br>For those who use Quark kerning tables, do you have a system for storing and upgrading these tables? Do you create kern tables before using a font or do you capture and upgrade the tables as the font gets used? Any tips or hints would be appreciated. <br> <br>For those who use Fontographer to kern, what kind of system do you use? Do you set a limit to how many kern pairs you'll allow? Any tips? <br> <br>And for the future, what are the odds that this kerning information will be useful and or translatable to OpenType fonts or to InDesign? <br> <br>Thanks for your input! <br> <br> <br></p>
  html_clean: <p>Here at slow-to-upgrade corporation (still using OS 9) we are having discussions about our kerning options. We make an effort to improve the quality of fonts we use on large campaigns. In the past, we've used Quark kerning tables, but we have moved to doing most of our kerning in Fontographer. <br> <br>For those who use Quark kerning tables, do you have a system for storing and upgrading these tables? Do you create kern tables before using a font or do you capture and upgrade the tables as the font gets used? Any tips or hints would be appreciated. <br> <br>For those who use Fontographer to kern, what kind of system do you use? Do you set a limit to how many kern pairs you'll allow? Any tips? <br> <br>And for the future, what are the odds that this kerning information will be useful and or translatable to OpenType fonts or to InDesign? <br> <br>Thanks for your input! <br> <br> <br></p>
