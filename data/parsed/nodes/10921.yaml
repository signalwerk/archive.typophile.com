  - id: 150085
    user: 1203
    date: 2003-04-09T11:39:00
    date_raw: 9 Apr 2003 — 11:39am
    votes: null
    html: "<p>If you're going to edit a font in FOG to \"fix\" the kerning then you may as well do it properly - ditch the kerning, respace the font for your proposed usage, *then* kern the font. <br> <br>I'd avoid using Quark kerning tables: they're only 200 units per em, are not easily imported to a font editor (you're going to have to massage them to fit the em digitization of the font) and of course they are non-portable between other apps. <br> <br>If the kerning is in the font then you shouldn't have any issues saving it out of a suitable editor as OpenType, and or using it as Type 1 or OpenType in InDesign.</p>"
    html_clean: "<p>If you're going to edit a font in FOG to \"fix\" the kerning then you may as well do it properly - ditch the kerning, respace the font for your proposed usage, *then* kern the font. <br> <br>I'd avoid using Quark kerning tables: they're only 200 units per em, are not easily imported to a font editor (you're going to have to massage them to fit the em digitization of the font) and of course they are non-portable between other apps. <br> <br>If the kerning is in the font then you shouldn't have any issues saving it out of a suitable editor as OpenType, and or using it as Type 1 or OpenType in InDesign.</p>"
