    <p>Hi everybody,</p>
    <p>I was recently asked to write a short article about typography (readers will mostly be graphic designers) for a new journal dedicated to posters, initiated by local designers. I've decided to present the Roman Scherer types as they're fascinating, Swiss and obscure. I remember seeing a beautiful specimen when I was studying in the Hague at the TypeMedia Master course.<br>
    The idea was of course to complement the article with scans of a Roman Scherer specimen. The article focuses on polychromatic types and I'm looking for some scans. The designer I know, who kindly offered me to scan pages the specimen he owns, can't find it anymore unfortunately. I have to find illustrations by the end of this week! I contacted the St Bride Library, as they have one specimen but only with monochromatic types…</p>
    <p>I'm wondering if someone, a lucky Roman Scherer type specimen owner, would be willing to help me with this project. There's no money, all I can offer are copies of the journal and a selection of stunning swiss chocolate.</p>
    <p>Online samples:<br>
    1. <a href="http://amassblog.com/?p=127" title="http://amassblog.com/?p=127">http://amassblog.com/?p=127</a><br>
    2. <a href="http://www.typography.com/ask/showBlog.php?kwID=22&amp;blogID=87" title="http://www.typography.com/ask/showBlog.php?kwID=22&amp;blogID=87">http://www.typography.com/ask/showBlog.php?kwID=22&amp;blogID=87</a></p>
    <p>Here's a letter I traced from the second online resource:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Poster-articleRomanScherer-illustrationP_5359.png"></div><p></p>
