    <p>We are looking to combine one of these Roman typefaces with an Arabic typeface:</p>
    <p>- <strong>Helvetica</strong><br>
    - <strong>Frutiger</strong><br>
    - <strong>TheSans</strong><br>
    - <strong>Fedra Sans</strong></p>
    <p>We're looking at the following Arabic typefaces.</p>
    <p><strong>Frutiger Arabic</strong> <a href="http://www.linotype.com/617936/frutigerarabiccomplete-valuepack.html" title="http://www.linotype.com/617936/frutigerarabiccomplete-valuepack.html" class="link-external">http://www.linotype.com/617936/frutigerarabiccomplete-valuepack.html</a><br>
    <strong>TheMix Arabic</strong> <a href="http://www.khtt.net/page/614/en" title="http://www.khtt.net/page/614/en" class="link-external">http://www.khtt.net/page/614/en</a><br>
    <strong>Fedra Arabic</strong> <a href="http://www.khtt.net/page/256/en" title="http://www.khtt.net/page/256/en" class="link-external">http://www.khtt.net/page/256/en</a><br>
    <strong>Insan</strong> <a href="http://www.linotype.com/184192/insan-family.html" title="http://www.linotype.com/184192/insan-family.html" class="link-external">http://www.linotype.com/184192/insan-family.html</a><br>
    <strong>Atrissi Sans</strong> <a href="http://www.atrissi.com/wordpress/?p=157" title="http://www.atrissi.com/wordpress/?p=157" class="link-external">http://www.atrissi.com/wordpress/?p=157</a></p>
    <p>As we don't speak or read Arabic I just wanted to quickly get an idea from you about readability of the above in longer texts, e.g. brochures, articles.</p>
    <p>We have an idea that Fedra Arabic may be quite good in terms of readability and 'normal' feel for longer texts. Would the same be true for Frutiger Arabic, TheMix Arabic, Insan and Atrissi Sans? We would use them for headlines and signs, for example, but which of them would be also suitable for longer texts? Or would we be looking at having another text font in addition to the headline font?</p>
    <p>Thanks for any opinions.</p>
