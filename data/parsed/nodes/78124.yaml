    <p>Hi,</p>
    <p>My company is updating our website and like the rest of the world has been doing, I want to update our site to include the fonts that we use in our identity. Unfortunately, we use Myriad Pro in a wide range of styles and Myriad Web only has 5 fonts (<a href="http://en.wikipedia.org/wiki/Myriad_%28typeface%29#Myriad_Web" title="http://en.wikipedia.org/wiki/Myriad_%28typeface%29#Myriad_Web">http://en.wikipedia.org/wiki/Myriad_%28typeface%29#Myriad_Web</a>) that don't really cover our needs. So, I'm looking for a suggestion for a typeface that we can use that is similar to Myriad Pro but available as a web font. I'd really like something with light, black and condensed versions. Any suggestions?</p>
    <p>The image is just a clip of some of the different styles we intend to use.</p>
    <p>Thanks for any help!</p>
