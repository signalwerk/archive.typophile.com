      <p>Does anyone use Segoe or Corbel - not as web fonts, but just specified in the CSS?  Segoe is not that different from Myriad, and a lot of Windows machines have it. Corbel is becoming common on Windows machines too.</p>
      <p>There would be size issues - at the same pixel size I think Segoe looks really big, so that could be a challenge.  But maybe this would work?</p>
