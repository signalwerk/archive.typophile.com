    html: <p>Even if Myriad Web would have a complete weight set available, I do not recomend it for languages where W is often used. When rendered on screen, Myriad Web's w has a very dark middle, as if the stems were duplicated. Hope Adobe correct this in a next version, with more weights.</p>
