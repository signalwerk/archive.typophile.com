    html: |-
      <p><a href="http://img.skitch.com/20090129-gibiddusq3mxniusq7a25xfwbj.jpg" title="http://img.skitch.com/20090129-gibiddusq3mxniusq7a25xfwbj.jpg">http://img.skitch.com/20090129-gibiddusq3mxniusq7a25xfwbj.jpg</a></p>
      <p>Did some quick help in photoshop. The few things I have are check your spacings (regardless of the logo you are choosing) See what lines up with what else. Make conscious efforts about how thing should grid and correspond together. Should designbits text be as tall as the d? Should the bottom of design bits line up with the white circle in the middle? Web Design should be just as wide as the left side of the lowercase n and right end of that word. Bottom image: I don't like the thickness of the d, I think you should move the lowercase d so that it keeps the same thickness all the way around. Would improve the over all "flow" of the mark. I like this first font you used, the second ones are popular font and have more of a fun cartoony feel. Take it for what its worth. my 2 cents :)</p>
      <p>P.S. Guides are your friends, you have the power to make things perfect (computer) so why not do it?</p>
