    html: "<p>There are two classic freeware fonts (should be available on any one of the vast smorgasbord of enormous mostly-crap free font archives) that fit your bill. \"Logger\" and \"Wood Badge.\" Great for invitations to Twin Peaks film festivals and so forth. <br> <br>I did a quick google search to find a site where one could download Logger, and found many a Boy Scouts of America page which had it up for download, interestingly (for example: <a href=\"http://sne.tripod.com/clip.htm\" target=\"_top\">http://sne.tripod.com/clip.htm</a> ). I kept finding it only in PC.ttf form; if you're on a mac, you will either need to look harder than me or use a tt converter utility.</p>"
