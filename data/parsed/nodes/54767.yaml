    <p>Hi all,</p>
    <p>Based on <a class="freelinking external" href="http://www.typecooker.com" rel="nofollow">typecooker dot com</a>  method, I am trying to design a font the works with russian according to the following parameters:</p>
    <p>width: normal<br>
    weight: black<br>
    construction: roman<br>
    stroke endings: sans serif<br>
    ascender: much shorter than x-height<br>
    descender: much shorter than x-height<br>
    contrast type: broad nib<br>
    contrast amount: a lot of contrast<br>
    stems: straight<br>
    intended application: multi-purpose<br>
    intended size: use very small</p>
    <p>As I am not a user of the cyrillic alphabet, I would like if anyone who knows it could clarify 2 doubts:</p>
    <p><strong>A)</strong> The  word "Булак" is clear?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/komsomol_4169.gif"></div><p></p>
    <p><strong>B)</strong> For the entire font to serve its purpose correctly in Russian, do I have to design the 60 glyps that form the Basic Russian alphabet only? Are there any other glyps I will have to design?</p>
    <p>All your news comments and corrections will be very helpful. Thanks for your help!</p>
    <p>—<br>
    Carlos Fabián Camargo G.</p>
