      <p>I'm liking the new one! The dark weight especially. The lighter weights need to get progressively narrower, and looser spaced. If you want to make all the weights uniwidth* you can, but: the lighter weights still need more interletter space; you will find that the character of the font will change due to a large divergence in apparent width (as is happening now) - typically you can only apply uniwidth between two relatively close weights without seriously affecting the character.</p>
      <p>* Meaning that a given character has the same set width in all the weights (something I've done in Patria's two middle weights). The advantage is that the user can mix up and change his mind about the weights (let's say in which to use for emphasis) without affecting linebreaks etc.</p>
      <p>Also, looking at the dark weight:<br>
      - I wouldn't taper the bottom of the counter of the "у".<br>
      - Since this is supposed to be usable small, the top of the к needs to be more open; you might have to make the whole thing wider.<br>
      - Also stemming from the intended small usage: the counter of the "а" should be larger; although here it looks like you have room without making the glyph wider.<br>
      - Try to standardize (maybe into two angles if not one) the shears, here at the tips of "у", "л" and "а"; I like the one in the "у".<br>
      - What bothers me most is the messy conjunction between the counters and bottoms of "Б" and "а"; what I might try to do is continue the arc from the bottom into the corner of the counter (I'm not sure that's clear).</p>
      <p>hhp</p>
