    html: |-
      <p>Steve, he must mean that the ascenders <em>from the x-line to the top</em> are much shorter than the x-height.</p>
      <p>- In the Б the curvature of the bowl clashes with the bottom of the stem.<br>
      - For Cyrillic especially, this seems a bit narrow to be "width: normal".<br>
      - Why have a trap in the у but not the к?<br>
      - The к is out of character. Try curving an arm and/or a leg. Especially since you're dealing with Cyrillic.<br>
      - You've nicely sketched the inside counters, but the interletter space is just as important.<br>
      - The inside of the descender of the у is malformed.<br>
      - "a lot of contrast" and "use very small" don't mix.<br>
      - What does "multi-purpose" mean?<br>
      - No spacing requirements?</p>
      <p>BTW, in my book that TypeCooker is half-baked.</p>
      <p>hhp</p>
