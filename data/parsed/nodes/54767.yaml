      <p>Hi Carlos,</p>
      <p>The “Б” could be understood in Russian as the “Ñ” using acute instead of tilde in Spanish, but its hook shape is still not working well. Try making the joining of the arm more angled or designing first the “Г”.</p>
      <p>Russian alphabet has 33 letters, that’s 66 glyphs (uppercase + lowercase) if you just need to work in Russian. Here you have the Russian alphabet:</p>
      <p>А Б В Г Д Е Ё Ж З И Й К Л М Н О П Р С Т У Ф Х Ц Ч Ш Щ Ъ Ы Ь Э Ю Я<br>
      a б в г д е ё ж з и й к л м н о п р с т у ф х ц ч ш щ ъ ы ь э ю я</p>
      <p>I also suggest using the tail of “л” in “к” letter.</p>
      <p>BTW, for some Cyrillic inspiration visit <a class="freelinking external" href="http://www.dailytype.ru" rel="nofollow">Daily Type</a> and browse the archive</p>
      <p>Keep it going</p>
