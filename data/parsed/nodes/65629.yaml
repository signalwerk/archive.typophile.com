      <p>OK, this would be for the web. The two main ideas being thrown out so far are:</p>
      <p>1. Starlight Hotel <a href="http://www.fontdiner.com/menu_ifm.html" title="http://www.fontdiner.com/menu_ifm.html">http://www.fontdiner.com/menu_ifm.html</a></p>
      <p>for title-headings. But I need something to pair it with for subheadings and smaller titles underneath it. The main text of the articles is good ole Georgia.</p>
      <p>2. The other idea is using Primal Scream <a href="http://new.myfonts.com/fonts/comicraft/primal-scream/" title="http://new.myfonts.com/fonts/comicraft/primal-scream/">http://new.myfonts.com/fonts/comicraft/primal-scream/</a> for the big banner and again, SOMETHING ELSE for the sub-heads. Text is Georgia, again.</p>
      <p>The mood is supposed to be “mentally unstable” 50s-60s housewives, if that conjures anything. Maybe like in the show “Mad Men.” I don’t know if that helps, but that’s *all* I have now. If anyone has a couple ideas for straitjacket-retro with a dash of boozy brashness, and can suggest anything for the subheads, or, for that matter a complete pairing, it’s much appreciated. :-)</p>
