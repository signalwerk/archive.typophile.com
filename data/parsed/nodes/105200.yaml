  html: |-
    <p>(As always, I apologise as always if I posted this in the wrong forum but I don't have specific font sample to work with here.)</p>
    <p>Hello Typophile,</p>
    <p>I am always bashing Comic Sans, but I would really like to find and suggest a solid alternative to it. My bank (<a class="freelinking external" href="http://www.lloydstsb.com/" rel="nofollow">Lloyd's TSB</a>) use their own variant of <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/vag-rounded/" rel="nofollow">VAG Rounded</a> for almost all of their body text which is friendly and easy-to-read. Two prerequisites for the perfect font family/typeface to recommend.</p>
    <p>A key issue with standard VAG Rounded is it suffers from homoglyph with a only a slightly larger stem on the "i" and "j" glyphs to differentiate between them. Which was rectified in the Lloyd's TSB version. As you can see from their website.</p>
    <p>What can you recommend, if preferable can you keep the price cheap?</p>
    <p>-Inferno986return-</p>
