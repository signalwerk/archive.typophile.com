    <p>Hello everyone,</p>
    <p>I am in the process of creating a new brand for a hair salon called ’human’. The client wants to be a little different from the clean cut/elegant norm for a salon and wants to have a more fun and approchable identity.</p>
    <p>They want to be a bit more funky and cultural diverse and have specified a deep pink as their main colour.</p>
    <p>Please let me know your thoughts - I’m not precious and can take critism!! If there is a different way for me to look at this, please help. I’m becoming a little blind to the project...</p>
    <p>thanks</p>
    <p>S</p>
