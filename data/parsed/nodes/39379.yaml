      <p>Good brainstorming!<br>
      #1 look a bit like something for charity.<br>
      #2 looks good but maybe lack a litle fun? Combine with concept of #5?<br>
      #3 is fun but I think putting two dots over the “u” changes the meaning in the word, “hüman” ... actually wery funny. Maybe move the dots inside the “a” and modify it a litle?<br>
      #4 looks like it is an ambiagram so I started looking for other ways to read it or some other hidden meaning. Could not find any. Hard to read to.<br>
      #5 I like the sissor cutting the letters. Maybe a bigger sissor? I’d like to se the sissor changing another word into “human” by for example cutting an “o” into a”u” or something like that. By cutting away something it should go from ugly to beautiful, hard to pull off I think.<br>
      Maybe try to cut “HAIR” away from “BEAUTY”? The letters “HAIR” could fall down and maybe look a bit hairy? Or write “HAIR” on top of one letter or all the letters in “human” or Write “HAIR” a lot until it looks like a hairdo?<br>
      Looks good so far, best of luck!</p>
