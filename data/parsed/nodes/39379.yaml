    html: |-
      <p>1 - Looks like a free font (is it?). Don’t go with this one.</p>
      <p>2 - Looks very 70s. This is good if you want to go this way, bad if you don’t.<br>
      Is that Arial Rounded for “HAIR &amp; BEAUTY SALON”? You may want to switch to Helvetica if it is.<br>
      Try taking the swash off the ’h’ and using the scissors to cut the swash from the ’n’.<br>
      The ’u’ looks slightly high. Try moving it down a hair.</p>
      <p>3 - Not sure if I get it. Is it supposed to be a happy face or just a ’ü’? I like the font choice for “HAIR &amp; BEAUTY”.</p>
      <p>4 - Very 80s. Again, good if you’re going for 80s. The crossing of ’ma’ is just screaming to be turned into scissors. Try turning the counter of the ’a’ into a handle, and sharpen the “blades”.<br>
      The ’a’ and ’n’ look a little short compared to the ’m’.</p>
      <p>5 - Not sure if cutting humans in half is the kind of image the salon wants to convey.</p>
      <p>These all seem a bit tame to me. I think that you have a great opportunity to use a lot of flowing swashy curlicues and such, especially since the client asked for a fun look. I’d go with more than one shade of the pink, and more than one grey.</p>
      <p> - Lex</p>
