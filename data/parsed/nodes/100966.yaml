      <p>I don't know much about the "official" rules, but I personally like it with en-dashes with no space on the "insides", but certainly no commas.</p>
      <p>So like this:<br>
      . . . prerrománicos –conocidos también como en arte de la monarquía asturiana– como son las Iglesias . . . </p>
      <p>BTW is that "en" supposed to be an "el"?</p>
      <p>hhp</p>
