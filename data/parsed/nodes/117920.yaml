    <p>The SVG font format has support for kerning via the <a class="freelinking external" href="http://www.w3.org/TR/SVG/fonts.html#HKernElement" rel="nofollow">hkern</a> element. Is kerning in SVG fonts supported by any web browser?</p>
    <p>I'm just trying to add kerning to my SVG fonts and it didn't work. I'm not sure what the source of the problem is, is it the lack of browser support or is it my font.</p>
    <p>Any info or reference implementation would be helpful.</p>
    <p>Thanks in advance<br>
    Eigi</p>
