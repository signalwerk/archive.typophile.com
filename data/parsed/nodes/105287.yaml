    <p>Hi everybody,</p>
    <p>In september i'm starting as a first year student in graphic design at the KABK, The Hague. I've been taking these two months of vacation to prepare and read as much as possible on Graphic design but more in particular about typography witch is where my interests really are.</p>
    <p>I do have a few question concerning about making a ready for print .pdf file and was hoping i could get some explaining, here i go:</p>
    <p>- for example i have just finished a 10 page booklet (as exercise to better understand Indesign) I would like to print this booklet but not quite sure on how to deal with the colors i'm using...i have placed some text in a Pantone color, is this ok or should i convert all pantone colors to either RGB or CMYK for print.<br>
    - How can i check in Indesign if i'm either using RGB or CMYK color and for example if there is a color swatch in RGB how do i convert this color to CMYK?</p>
    <p>Type related question:</p>
    <p>- I have been making some type specimens with a typeface i bought a few weeks ago, its kind of the classic type specimen compared to this  (Link)<br>
    <a href="http://www.fontbureau.com/fonts/miller/" title="http://www.fontbureau.com/fonts/miller/">http://www.fontbureau.com/fonts/miller/</a><br>
    I have some trouble with getting the leading just right, i use different type sizes for each text line and every line is set in either italic, caps...etc. Is there like some kind of trick or useful tip/ calculation on how to make the leading just sit right when using different sizes. </p>
    <p>Hope i'm not asking for to much here and that someone finds the time to help out a bit.</p>
    <p>Regards,<br>
    Patrick</p>
