    html: |-
      <p>&gt;  should i convert all pantone colors to<br>
      &gt; either RGB or CMYK for print.</p>
      <p>As Joshua said, if there are just a few colors, you'll get best results with spot colors. If the job just has 2 colors, for example, the printer uses 2 printing plates, each printing in 1 color.</p>
      <p>For jobs with numerous colors, it is usually too expensive to use a separate printing plate for each color, so instead the printer uses 4-color process. Colors are converted to screen tints of 4 colors (CMYK -- cyan, magenta, yellow and black) and the job is printed using 4 printing plates. Look at color photos in a magazine through a magnifying glass and you'll see how CMYK simulates different colors.</p>
      <p>If you set up your file wrong (like using spot colors instead of CMYK), a good-quality print shop should catch the error and fix it, but a shop that specializes in doing things quick and cheap might not notice. It's always safer to make the file correct before you release it.</p>
      <p>To change a color, change LAB to CMYK, then change SPOT to PROCESS. If you're having trouble changing a color, it's possible that the color belongs to a graphic you've imported. In that case, open the graphic using the appropriate program (Photoshop, Illustrator, or whatever) and change it to CMYK. Then save it and update the link.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/example_6543.jpg"></div><p></p>
