      <p>"For example i have just finished a 10 page booklet (as exercise to better understand Indesign) I would like to print this booklet but not quite sure on how to deal with the colors i'm using...i have placed some text in a Pantone color, is this ok or should i convert all pantone colors to either RGB or CMYK for print."</p>
      <p>For print, you should either make everything CMYK swatches (conventional four-color printing uses only Cyan, Magenta, Yellow, and blacK inks), or — if you're using only a couple of colors, you can use Pantone swatches, which represent flat spot colors that will be mixed specifically for the job. For instance, if your whole brochure is only in black and red, you could use a Pantone red, which would then mean your printer only needs two passes to print it instead of four.</p>
      <p>"How can i check in Indesign if i'm either using RGB or CMYK color and for example if there is a color swatch in RGB how do i convert this color to CMYK?"</p>
      <p>Double-click on the swatch in the swatches panel. A dialog window pops up with a menu for what mode the swatch is. Switching it to a different mode will automatically give you the closest equivalent.</p>
      <p>"Is there like some kind of trick or useful tip/ calculation on how to make the leading just sit right when using different sizes."</p>
      <p>No. Trust your eye. InDesign uses a default leading of 120% of the type size (you can change this default), but this isn't necessarily the best for every font at every size.</p>
