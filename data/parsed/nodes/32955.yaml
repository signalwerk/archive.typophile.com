    <p>Hi folks,</p>
    <p>I'm looking to find a suitable replacement for Serifa. I'm using the heaviest weight. (Serifa 75 Black)<br>
    I really like the typeface, but unfortunately I have a client that's hung up on "the heavy handed serifs"</p>
    <p>Any suggestions on a typeface that I could use instead?</p>
    <p>Thanks!</p>
