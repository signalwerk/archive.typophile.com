    html: "<p>I would second the recommendation not to put the figures in the footnotes themselves in superscript: it's what you're looking for at the bottom of the page, so there's really no point in making them small. If you have the space, another nice detail is to have the footnote text indented slightly, as they do <a href=\"http://books.google.ca/books?id=4fDj5mcAXgkC&amp;lpg=PP1&amp;dq=heinzelmann&amp;pg=PA45#v=onepage&amp;q&amp;f=false\" rel=\"nofollow\">here</a> (although they unfortunately superscript the reference in the footnote itself).</p>"
