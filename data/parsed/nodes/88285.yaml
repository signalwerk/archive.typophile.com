      <p>Yes and yes. Then, as always, you should look how well they work in your setting, and fine-tune your style accordingly.<br>
      As an example, in one layout I did using Chaparral as text font, I used the less proper numerator Open Type option because it sits lower and I had a pretty tight leading. Also, I bumped up a bit its size.</p>
