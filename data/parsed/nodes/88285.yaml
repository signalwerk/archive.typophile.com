    <p>Hello</p>
    <p>I'm unusually for me working on a text with footnotes and I'd appreciate some guidance on correct styling of footnotes reference numbers, both within the text and the numbers next to the footnotes themselves.</p>
    <p>Throughout I'm using "proportional old-style" numerals, and I'd normally aim to not mix old-style with the default figures. However the font (Hoftype Cala) I'm using has the option of "OpenType Superior/Superscript" (in InDesign character style under Basic Character Formats &gt; Position drop down).</p>
    <p>Should I use this setting for the superscript footnote references? Even though those aren't old-style figures? And should I do the same for the footnote number alongside the footnote itself?</p>
    <p>thanks very much!<br>
    Michael</p>
