    html: "<p>Yes. Unless the fonts contain old style superior/inferior figures (I don't know of any besides one of mine, but there sure are), go with the ones included in the font. These are better than scaling a set of old style figures to fit, because the weight will be all wrong. For the listing, lining figures are useful for marking the hierarchy: the listing numbers lining, the numbers in the notes old style.</p>"
