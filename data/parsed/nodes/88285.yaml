      <p>If you’re not using a size-specific (a.k.a “optically scaled” or “micro”) font for the footnotes, I would suggest that the numbers in the footnotes be full size, rather than superscript. Otherwise they may be too slight.</p>
      <p>But really, if you’re going to the trouble of using proper superscript reference numbers, you should also be using a size-specific font for the footnotes themselves.</p>
      <p>With Cala, which has no “opticals” per se, you could use Light for the main text, and Regular for the footnotes, with relative sizing &amp;c. that produces the effect of similar weight.</p>
