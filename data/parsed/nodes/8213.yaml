    html: <p>I did an edvert for a magazine that featured hardcore punk bands. I typed out the text, printed two copies and cut and pasted them down to a sheet of paper. I used regular tape and at times wanked the tape back up and replaced it a bit off, pulling ink with it and making a corroded ghost double of the letter.  <br>I then photographed the page with a digital camera and kicked up the contrast to 100% in photoshop. We had to advertise a specific CD as well, so I did that below the flyer using the same tpeface but clean. <br>Attatched is how it came out. <br>(type set in Myriad Pro) <br><img src="http://www.typophile.com/forums/messages/4100/56172.jpg" alt="Hardcore Advert"></p>
    html_clean: <p>I did an edvert for a magazine that featured hardcore punk bands. I typed out the text, printed two copies and cut and pasted them down to a sheet of paper. I used regular tape and at times wanked the tape back up and replaced it a bit off, pulling ink with it and making a corroded ghost double of the letter.  <br>I then photographed the page with a digital camera and kicked up the contrast to 100% in photoshop. We had to advertise a specific CD as well, so I did that below the flyer using the same tpeface but clean. <br>Attatched is how it came out. <br>(type set in Myriad Pro) <br><img src="http://www.typophile.com/forums/messages/4100/56172.jpg" alt="Hardcore Advert"></p>
