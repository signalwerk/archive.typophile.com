    html: <p>I've found that photocopier distress works extremely well to "punkify".  Simply take a hard copy and reduce by 25% then take that copy, and enlarge by 400%. <br> <br>If you're lucky, the copier will still use the electrostatic method and you can rub off the toner with sandpaper or use packing tape to pull it off.</p>
