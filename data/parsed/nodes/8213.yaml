  html: <p>Hi <br>i need to make a logotype for swedish punkband...  well...  it is 2005..  and i was a punkrocker in late seventies..  so for me it feels a bit daft doing this....  but that's beside the point...  anyway.. i wonder if there is a recipy for "scratching" and make the font look worn-out..   if you know what i mean?!  i have seen stamp-effect recipy here...  so maybe somebody has a way of doing what i want to do  <br> <br>thanx</p>
