    date: 2002-05-31T10:25:00
    date_raw: 31 May 2002 — 10:25am
    votes: null
    html: <p> first of all, it would be nice to see a sample of how you <br>might set a headline (or text if you like) with these  <br>existing charcters. a line-up of the alphabet gives us a  <br>good chance to look at induvidual glyphs, but very little  <br>understanding of how it might look in context. <br> <br>secondly, with the idea of setting the characters at a  <br>large display size, the vectorization oddities that  <br>Steven mentions become more problematic. you might  <br>think of producing a variation of the family in which the  <br>*oddities* of the marker (eg, bleed and soft corners)  <br>are featured. this would, of course, take an enormous  <br>amount of time (kind of an ironic feature of digitizing  <br>this type of font), but I think you have a design with a  <br>lot of potential  -- it may warrant that sort of  <br>investment if you're going to make use of it. </p>
