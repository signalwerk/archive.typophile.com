    html: "<p>I've definitely thought about the idea of adding alternate characters to get more mileage out of the face...I think I'll try to do 5 different variations for every character.  <br> <br>I thought I had seen most of the other graf faces out there, but I'd never seen Tag Team...very cool. <br> <br>Anyway, here's a typeset sample...other than a little kerning, this is what it looks like when it's typed. <br> <br>Thanks for the feedback! <br> <br><!---Attachment: milk_test.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">milk_test.swf<br><a href=\"http://www.typophile.com/forums/messages/29/milk_test.swf\"><b>milk_test.swf</b></a> (4 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
