    html: "<p>Kyle, <br> <br>Good show. There's a shortage of decent tag fonts.  <br> <br>I would leave the size inconsistencies <br>as they are. If the user is required to resize <br>letters at random they will end up with pen <br>strokes that are out of proportion (the enlarged <br>glyphs having thicker strokes than they should). <br> <br>Zooming in on the flash file I noticed you're <br>generally free of vectorization quirks*. That's a <br>tough point to reach. How big do you draw  <br>before scanning? <br> <br>Great translation job overall. I can see this <br>working at small sizes and as a huge display  <br>face. It's wild, yet legible. Although I would <br>consider reining in the 't' a bit - if only so <br>it doesn't obscure the legibility of adjacent <br>glyphs. <br> <br>This is also an excellent candidate for  <br>alternates. Have a go at redrawing the  <br>alphabet as you would normally (allowing  <br>for subtle variations in each glyph) and see  <br>if you can build a set of alts. <br> <br> <br>Other tagger faces to check out: <br> <br>- Gary Munch's fairly white-boy <a href=\"http://www.munchfonts.com/UrbanScrawl/index.html\" target=\"_blank\">Urban Scrawl</a> <br>- Thomas Marecki's <a href=\"http://www.fontfont.com/shop/view_packages_main.ep?id=88\" target=\"_blank\">Tag Team</a> is more your style <br> <br> <br>Stephen <br> <br> <br>* The lowercase 's' and 'q' didn't vectorize so <br>well. See if you can smooth those out.</p>"
    html_clean: "<p>Kyle, <br> <br>Good show. There's a shortage of decent tag fonts.  <br> <br>I would leave the size inconsistencies <br>as they are. If the user is required to resize <br>letters at random they will end up with pen <br>strokes that are out of proportion (the enlarged <br>glyphs having thicker strokes than they should). <br> <br>Zooming in on the flash file I noticed you're <br>generally free of vectorization quirks*. That's a <br>tough point to reach. How big do you draw  <br>before scanning? <br> <br>Great translation job overall. I can see this <br>working at small sizes and as a huge display  <br>face. It's wild, yet legible. Although I would <br>consider reining in the 't' a bit - if only so <br>it doesn't obscure the legibility of adjacent <br>glyphs. <br> <br>This is also an excellent candidate for  <br>alternates. Have a go at redrawing the  <br>alphabet as you would normally (allowing  <br>for subtle variations in each glyph) and see  <br>if you can build a set of alts. <br> <br> <br>Other tagger faces to check out: <br> <br>- Gary Munch's fairly white-boy <a href=\"http://www.munchfonts.com/UrbanScrawl/index.html\" target=\"_blank\" class=\"link-external\">Urban Scrawl</a> <br>- Thomas Marecki's <a href=\"http://www.fontfont.com/shop/view_packages_main.ep?id=88\" target=\"_blank\" class=\"link-external\">Tag Team</a> is more your style <br> <br> <br>Stephen <br> <br> <br>* The lowercase 's' and 'q' didn't vectorize so <br>well. See if you can smooth those out.</p>"
