    date_raw: 31 May 2002 — 9:26am
    votes: null
    html: <p> Fun. <br> <br>If you're ambitious, you could achieve a greater  <br>level of randomness by creating an alternate set.  <br>By introducing other variations you wouldn't run  <br>into the stroke weight problem Stephen mentions. <br> <br>This would add to the 'randomness' by making it  <br>possible to write 'street' with two different Es. <br> <br>(This is my beef with distressed faces. They  <br>feel canned and phony when two of the same  <br>characters are identical.) </p>
