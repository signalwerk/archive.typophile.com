  html: <p>A typeface based on my tag-style handwriting. Created using Sharpies<sup>®</sup>, paper, scanner &amp; FreeHand. As I recreated the face in FreeHand I tried to even out the size of the letters a little while trying to keep the random, hand-drawn feeling. <br> <br>I'm stuck on how I should finish out the face...<b>a.</b> make the letters a consistent size and let the end user add the random feeling or <b>b.</b> leave it alone.</p>
