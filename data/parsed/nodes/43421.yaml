    html: |-
      <p>I think you have a great start, but there are some elements that are throwing me. I think that some of the serifs on the caps are very angled. They need to point less out and more down. The stroke contrast seems to be too strong right at the top of the bowls of most lowercases.</p>
      <p>The terminus of the lc g is a little odd. Maybe since its a serif, you may need to make it an eyeglass (two-story) g.</p>
      <p>I would love to see how this turns out.</p>
