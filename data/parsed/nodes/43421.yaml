  html: |-
    <p>Hey all,</p>
    <p>Working on my first typeface for school. Its supposed to be a display face and we pretty much have freedom to do whatever we want in terms of design approach. I had a crazy idea of mixing Helvetica Neue with Adobe Casslon - Since I've always wanted a serif that's close to Neue (after working on it I realize how crazy this sounds). </p>
    <p>Anyhow I've continued working on it and have a very rough version of the lower case, perhaps you could guide me in the right direction. I know the last five letters don't match at all (v,w,x,y,z).</p>
    <p>Also have a rough version of the uppercase but not in Fontlab yet.</p>
    <p>Thanks very much :-)</p>
