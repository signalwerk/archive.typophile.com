      <p>This looks like a thread in which I made the first post – but it isn’t. It’s a portion of an older thread that someone else revived.</p>
      <p>Jorge: Gamme isn’t mine to give you. You would have to get the permission of Fred Peter and Kivart - in that order.</p>
      <p>I really wish that Kivart had tried to talk to Fred Peter and try to come to some agreement, but he chose not to. It probably didn’t help that he was shot in a drive-by posting here by a respected name in typography – in which he was effectively called a “font pirate”.</p>
