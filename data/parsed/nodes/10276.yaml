    html: <p>Jeez, that's  a bummer! <br> <br>I'm sorry to hear you went to all this trouble and at the end turned sour...  <br> <br>As for the font. I did managed to scan it at high resolution from the letraset book,  <br>and did it the old fashion way...cut and paste. <br> <br>Now the question I wonder about; Technically speaking is this a breach of copy right even if I don't sell it to others. <br>"Heck I can't get it anywhere else" is my justification. BUT that is all it is. a justification. <br> <br>What do you (or anyone thinks on the matter) <br> <br>Thanks again for the info and link(s) Mike <br> <br>Regards, <br> <br>Serge</p>
