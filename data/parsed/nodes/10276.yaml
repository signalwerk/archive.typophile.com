    html: <p>Not long after that thread, Kivart replied to my e-mail. I had encouraged him to contact Fred Peter. <br> <br>Instead, Kivart, who had created the font from an image of the lettering provided by a friend, was aghast that the lettering was actually an existing (albeit dry transfer only) typeface. He pulled Gamme from his website and would not reconsider. <br> <br>I remain very sorry to have played a part in that. Subsequent efforts by myself to contact Mr. Peter have been unsuccessful.</p>
