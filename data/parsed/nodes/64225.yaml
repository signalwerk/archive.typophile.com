    html: |-
      <p>You leave space within the EM above the top of the ascenders and below the bottom of the descenders, to avoid collisions in the case of flush setting (plus to meet the size expectations of users, as James said). The sum of these two "blank" spaces is the talus. It's not a common term, but "internal leading" is cumbersome and potentially confusing.</p>
      <p>Also, it's smart to leave a greater proportion of the talus on top, because ascenders are much more frequent than descenders, hence benefit from the greater room to breathe.</p>
      <p>hhp</p>
