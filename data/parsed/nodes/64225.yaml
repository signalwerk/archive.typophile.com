    <p>I'm sure this has been asked before so feel free to point me to an existing thread.</p>
    <p>Obviously there are critical ratios, cap height/x-height, overhang etc, but these ratios can exist at different <em>sizes</em>.<br>
    e.g. 700/500 = 750/536 approx.</p>
    <p>I have <em>some</em> experience drawing type, but it occurred to me whilst starting a new design that there might be some advantage to drawing at a specific size and I would like to be aware of this at the outset to avoid possible problems later on.</p>
    <p>I'm inclined to draw large on the face as I have more options for stem widths etc.</p>
    <p>A little bit of guidance, what to watch out for &amp;c. would be much appreciated.<br>
    Thanks in advance</p>
    <p>Andrew</p>
