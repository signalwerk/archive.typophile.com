      <p>There is no trick, just the normal procedure that you'd use with any Python package: </p>
      <p>1. Start Terminal.<br>
      2. Type <code>python</code> followed by space.<br>
      3. Drag the <code>setup.py</code> file from Finder onto the Terminal window.<br>
      4. Type space followed by <code>install</code> and hit Enter. </p>
      <p>Adam</p>
