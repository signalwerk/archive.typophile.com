  html: <p> _ If you’ve submitted the same design with multiple colorways, Typophile will select one to submit to the judges. (This will prevent judges from splitting their votes on multiple iterations of a given design). <br><br>_ If you submit a revision with the intention of replacing an existing entry, please&nbsp;specify. </p>
