    html: <p>hey hrant, thanks again! <br>yeah the ITC version of Cheltenham was what i was looking at last night. I think most our body text is set at 10pts, you think it would work at that size? <br>We do have some decent alternatives already (perhaps) but i'm none too keen on the intricacies of the text face (i'm more of a display type of guy) Last night i was playing with that front page and and tried using Hoefler Text, Joanna, Georgia, Garamond, Galiard, Goudy just to see how these faces would look. Georgia is a personal favorite of mine (and it's based off of Miller isn't it?) But the rest i didn't really feal comfortable with, except maybe Hoefler Text. <br>About the ads... i totally agree that they should go below the nameplate,  personally i would like to see no ads above the fold, but i don't know what the advertiser's contract is. <br>About the statue.. his name's "Easy" from the Eagle's song "Take It Easy" and the one line that says "I was standin' on a corner in Winslow, Arizona..." I was wanting to make him more graphic instead of having a photo of him, but again, my publisher doesn't want to see him in the nameplate (because of local politics, you know how it goes in a small town) But i may still do one mock up with him in there.  Alternatively other graphic elements I could use are the railroad or perhaps Route 66.  <br>Just for fun i'll upload a few more nameplates that i found while digging through our archives.<img src="http://www.typophile.com/forums/messages/4100/25690.gif" alt="The original in 1897"> <br>My publsiher liked this blackletter. <br><img src="http://www.typophile.com/forums/messages/4100/25691.gif" alt="Nameplate 1927"> <br>i like the nostalgic feel of this one, although i'm not sure whether the train station is the heart of the city (maybe i should stick the local Wal-Mart in there instead, LOL) <br><img src="http://www.typophile.com/forums/messages/4100/25692.gif" alt="Nameplate 1936"> <br><img src="http://www.typophile.com/forums/messages/4100/25693.gif" alt="Nameplate 1942"> <br>A couple rail inspired motifs. <br>Oh and i forgot to mention, Winslow is on the border of the Navajo reservation and we're trying to appeal to that audience as well, however i don't really wanna see an overtly southwestern/native design scheme. keep the comments coming, i'm getting some good ideas!</p>
