      <p>i knew i could count on you to pull though for me, hrant. lemme see if i can answer your questions adequately: <br>1) Our target demographic is the residents of Winslow, AZ and perhaps reaching into Joseph City (my hometown, yay!) Winslow is an old railroad town and i guess most of the citizenship either be classified as bluecollar or small business owners (in my estimation). <br>2) Currently our whole paper is set in Times (shudder!) and i think it's time that be remedied. Lemme upload this week's front page for ya.</p>
      <!--attachment: 01_02-04-04_pdf-25570.unk*attachment_icon.gif*application/x-stuffit*1207.3*This+week%26%2339%3bs+front+page*01+02%2d04%2d04%2epdf%2esit --><!--attachment: 01_02-04-04_pdf-25570.unk*attachment_icon.gif*application/x-stuffit*1207.3*This+week%26%2339%3bs+front+page*01+02%2d04%2d04%2epdf%2esit --><p></p><center><br>
