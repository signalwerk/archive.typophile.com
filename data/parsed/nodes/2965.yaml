    html: "<p>I loaded the PDF fine. <br> <br>&gt; my publisher balked <br> <br>What exactly was her objection? Maybe she wants to think she lives in The Big City instead of a small town... In which case show her the NYT with its Cheltenham! :-) If she's gonna insist on something more elegant and contemporary, then something like Swift would be great, yes. But I'd try to keep the feel homey, so maybe something like Cheltenham but not as mushy. <br> <br>But I wouldn't use Cheltenham for body, it's too old and small on the body. Wait a second: I never thought I'd recommend the otherwise abominable ITC Cheltenham, but for news body (at a small enough size, like maybe 8 point) its obese x-height might just click. Maybe give that a shot. <br> <br>For Cheltenham I was thinking more for the masthead. Here's the ITC \"handtooled\" in action: <br> <br><a href=\"http://www.myfonts.com/fonts/linotype/itc-cheltenham-handtooled/cheltenham-handtooled-itc/testdrive.html?s=Winslow%2BMail&amp;p=72\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/itc-cheltenham-handtooled/cheltenham-handtooled-itc/testdrive.html?s=Winslow+Mail&amp;p=72</a> <br> <br><a href=\"http://www.myfonts.com/fonts/linotype/itc-cheltenham-handtooled/cheltenham-handtooled-itc/testdrive.html?s=WINSLOW%2BMAIL&amp;p=60\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/itc-cheltenham-handtooled/cheltenham-handtooled-itc/testdrive.html?s=WINSLOW+MAIL&amp;p=60</a> <br> <br>But if you want a more dignified look you need to look at the \"real\" non-ITC cuts (which cost more, though). <br> <br>Hey, what do you think of this? <br><a href=\"http://www.themicrofoundry.com/other/Winslow.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/Winslow.gif</a> <br>People have told me that my Patria caps have a Cheltenham feel, but the serifs (which actually need work, though) are \"severe\" wedges. If you like it I can give you an EPS of those settings. But the font itself (which is actually designed as a newspaper text face, in four weights with italics) will cost you...  :-) <br> <br>&gt; I would lobby hard to remove [the ads] from the masthead.  <br> <br>Failing that at least don't allow color ads above the masthead line. <br> <br>BTW, this might sound like blasphemy, but don't jeopardize the redesign by trying force a font sale. There are probably a lot of bundled fonts on your machine, a few of which (like maybe Nimrod*) would work better than Times. <br> <br>* Which I once got from MyFonts for cheap. <br> <br>hhp <br></p>"
