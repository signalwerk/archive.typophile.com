      </tr>
      </tbody></table>
      <p></p></center><p></p>
      <!--/attachment--><!--/attachment--><p> <br>3) abt the authority, we're a small operation here in Winslow. currently i work doing ad design for the Winslow Mail and our sister publication, the Reminder. but our editor (who currently does ALL the layout) is moving back to TX and there is some chance that i may become responsible for layout of the paper. No matter what happens, though, i'm adamant that we sever our ties with Times and find something fresh. <br>I kinda like the Cheltenham (thanks for the ID) mast myself, but would like to see something with a bit more sophistication. We are, however, trying to become "the paper for the people" and want it to have more of a hometown feel, so i don't want to do something too far removed from the people we're trying to reach. (did i put in enough inconsistencies there?) anyhow all suggestions are welcome. Thnx again!</p>
