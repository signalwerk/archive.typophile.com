    html: <p>Joanna is horsey?! We must be using the term very differently. <br> <br>From what I gather, to his credit Kent doesn't think Whitman can be used for news setting. I think it's great for some book work as well as magazines. <br> <br>Azuza is one of my most favorite recent fonts, and I think it would go great with a news version of Whitman. Miller of course is a superb design as well, and seems like it would pair very well with Azuza. BTW, Paul, did you get my private email concerning Patria? It's a news face, and might work well for you too. <br><a href="http://www.typophile.com/forums/messages/29/805.html" target="_blank">http://www.typophile.com/forums/messages/29/805.html</a> <br> <br>I myself haven't found a book dealing specifically with news fonts, but check out all the wonderful stuff on news typography written by Paul Hunt. <br> <br>hhp <br></p>
