    html: <p>Ok, here's some free amateur opinion, probably worth what it costs, based on your PDF of the front page.  <br> <br>I don't think fonts are your main problem. Times New Roman was eventually changed by the Times itself, but it a very good face, if your paper is not too rough. (The sharp points on the serifs melt if the paper is not good enough, I understand.) <br> <br>I suspect you can make the paper look a lot better even with Times as the body text. First, I would look at how the Times (of London) itself used to use it for a clue. <br> <br>I suspect that you have too much leading in the body text, and that tightening it would make give the paper more even 'color' and a more professional look. (Also, your font size may be too big for the narrow columns.) Second, Times bold isn't the best as a headline font, but if you use it, I suspect it should be tracked negatively for large headlines, so you get a bolder, more punchy look. <br> <br>Finally, all the centered text in the blue box on the left is a definite no-no, as it is way less readable, and there should never be over a few lines centered.  <br> <br>I would think that with a new masthead and headline font, and improvement of the typography, you could make the whole thing look quite good, even with Times.  <br> <br>Another more radical revision to think about is having fewer columns. I believe the NYT has the six columns. Narrow columns as less desirable from the point of view of readability, but that way NYT can start a lot of stories on the front page, with headlines - in the narrow, tall Cheltenham. However, you have your headlines going across a number of columns, so that the many columns doesn't particularly help you. <br> <br>As I said, I am just blathering about this stuff without knowledge, but anyway these are the kinds of questions you can ask about revising your present design.  <br> <br>There is a <a href="http://www.snd.org/" target="_blank">Society for Newspaper Design</a> and on their site they have a searchable list of books on newspaper design, including books of award winning designs. If you call them they can probably tell you of a whole division of small town weeklies, and you can talk to your colleagues who are in a similar situation, and get practical, valuable advice. </p>
