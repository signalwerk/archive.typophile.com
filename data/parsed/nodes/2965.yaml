    html: "<p>&gt; i think those slab serifs of Joanna's are it's only <br>&gt; real drawback to making it more versatile. <br> <br>Note however that slabs become less slabby (?) if there's any ink gain, like in a newspaper! <br>But Joanna is no news font anyway. <br> <br>&gt; So does Whitman not work for news just because of the stock? <br> <br>Although Whitman doesn't have any trapping (which would help small sizes on bad stock maintain fidelity), the main reason it's better for book and magazine work than for news is its modest x-height; a secondary reason is its lightish color. News point sizes are on the small end, and those require bigger bodies that are darker (as well as wider and looser). <br> <br>That said, I think Whitman is a natural for adaptation to news setting: it has a superb balance of warmth and neutrality, plus great readabilty. <br> <br>Companion sans: maybe look at stuff by Unger and de Groot. <br> <br>-- <br> <br>Patria: I think you might be pleasantly surprised by its combination of austerity, readability, and setting economy, especially for the point size range you're looking at. Since I've yet to see it in actual news setting action (high speed presses, bad stock, etc.) we might be able to work out some sort of trial scheme - just let me know. <br> <br>hhp <br></p>"
