    html: "<p>Hey, nice \"g\"!  :-) <br> <br>Tell your sister about this gem: <br><a href=\"http://www.newseum.org/todaysfrontpages/\" target=\"_blank\">http://www.newseum.org/todaysfrontpages/</a> <br>Hundreds of front pages in PDF, from around the world, updated daily. <br> <br>Modification: <br>If the EULA says you can't do it, it's illegal. But I would encourage you to ignore such a clause - it's a base scare tactic. As long as your mod stays in your hands only, I say have a blast. <br> <br><a href=\"http://www.typophile.com/forums/messages/30/24752.html\" target=\"_blank\">http://www.typophile.com/forums/messages/30/24752.html</a> <br> <br>Technically however, it's not as easy as it might seem to maintain the quality of the original, so be careful. And if you're going to do a minor adjustment, make sure it's worth it, since you can only really tell what you exactly need by factoring EVERYTHING in: the point size, the paper, the ink, reader preferences... everything. <br> <br>Oh, and look carefully at the \"grading\" in FontBureau's [high-end] newspaper faces. <br> <br>hhp <br></p>"
