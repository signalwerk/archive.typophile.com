    html: <p>okay, i'll try this again... <br>our staff here at the Winslow Mail is in the process of giving our paper a facelift and i've been assigned the task of giving some guidance to this transformation. (that's kinda scary) <br>First on our list is to rework the mast head, the current one is pretty atrocious, i'll post it for you. <br><img src="http://www.typophile.com/forums/messages/4100/25543.jpg" alt="Current masthead">  <br>So my publisher wanted me to come up with several designs that we'll let our readers choose from to be the final nameplate. I was looking through old editions and found that the             paper's header kept going back and forth between different blackletter designs and a more simple, serif design, lemme show you what i mean...<img src="http://www.typophile.com/forums/messages/4100/25544.gif" alt="Header from 1913"> <br><img src="http://www.typophile.com/forums/messages/4100/25545.gif" alt="Nameplate from 1930"> <br>I really like this blackletter and am thinking of cleaning it up for one of my designs, another blackletter face i'd like to see head our paper is Agincourt (<a href="http://www.myfonts.com/Search?searchtext=agincourt" target="_blank">http://www.myfonts.com/Search?searchtext=agincourt</a>) , but i'm worried that that may be a bit too fussy, but i'm a sucker for blackletter, so i need a more balanced opinion. For some other designs i need a face that's classy, simple, clean, but still has some personality. Any suggestions are welcome. <br>Evenutally i'm hoping we'll change our body type and the type for headers and would appreciate any suggestions there as well. I took a look at fontbureau's fonts for newspapers last nite and none of them really grabbed me and that's about as far as i've researched thus far. Anyhow, thanks for your interest and any suggestions/feedback.</p>
    html_clean: <p>okay, i'll try this again... <br>our staff here at the Winslow Mail is in the process of giving our paper a facelift and i've been assigned the task of giving some guidance to this transformation. (that's kinda scary) <br>First on our list is to rework the mast head, the current one is pretty atrocious, i'll post it for you. <br><img src="http://www.typophile.com/forums/messages/4100/25543.jpg" alt="Current masthead">  <br>So my publisher wanted me to come up with several designs that we'll let our readers choose from to be the final nameplate. I was looking through old editions and found that the             paper's header kept going back and forth between different blackletter designs and a more simple, serif design, lemme show you what i mean...<img src="http://www.typophile.com/forums/messages/4100/25544.gif" alt="Header from 1913"> <br><img src="http://www.typophile.com/forums/messages/4100/25545.gif" alt="Nameplate from 1930"> <br>I really like this blackletter and am thinking of cleaning it up for one of my designs, another blackletter face i'd like to see head our paper is Agincourt (<a href="http://www.myfonts.com/Search?searchtext=agincourt" target="_blank" class="link-external">http://www.myfonts.com/Search?searchtext=agincourt</a>) , but i'm worried that that may be a bit too fussy, but i'm a sucker for blackletter, so i need a more balanced opinion. For some other designs i need a face that's classy, simple, clean, but still has some personality. Any suggestions are welcome. <br>Evenutally i'm hoping we'll change our body type and the type for headers and would appreciate any suggestions there as well. I took a look at fontbureau's fonts for newspapers last nite and none of them really grabbed me and that's about as far as i've researched thus far. Anyhow, thanks for your interest and any suggestions/feedback.</p>
