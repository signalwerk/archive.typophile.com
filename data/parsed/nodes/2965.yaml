    html: "<p>Paul -- <br> <br>Regarding Whitman and newspapers: Hrant pretty much summed it up. The proportions are all wrong. Too much of the body is given over to the ascenders and descenders. This is primarily what marks it as a book typeface. There are also a few technical considerations, like various details which would become ink traps on newsprint. I don't necessarily agree with Hrant about the wider and looser part (but that's a legitimate debate). <br> <br>Advice that I received recently on this very topic: \"My advice about newspaper types is that to remember they are set in very narrow columns. So think dense compact lines. But not condensed or squeezed. It is tricky.\" <br> <br>I recently spent a little time on a rough draft of a Whitman News for newspaper text. I wasn't completely satisfied with the results. The project has been put back on a back burner. <br> <br>Coincidentally, however, a newspaper customer has requested development of some condensed display weights of Whitman for headlines.  <br> <br>-- Kent. <br> <br></p>"
    html_clean: "<p>Paul -- <br> <br>Regarding Whitman and newspapers: Hrant pretty much summed it up. The proportions are all wrong. Too much of the body is given over to the ascenders and descenders. This is primarily what marks it as a book typeface. There are also a few technical considerations, like various details which would become ink traps on newsprint. I don't necessarily agree with Hrant about the wider and looser part (but that's a legitimate debate). <br> <br>Advice that I received recently on this very topic: \"My advice about newspaper types is that to remember they are set in very narrow columns. So think dense compact lines. But not condensed or squeezed. It is tricky.\" <br> <br>I recently spent a little time on a rough draft of a Whitman News for newspaper text. I wasn't completely satisfied with the results. The project has been put back on a back burner. <br> <br>Coincidentally, however, a newspaper customer has requested development of some condensed display weights of Whitman for headlines.  <br> <br>-- Kent. <br> <br></p>"
