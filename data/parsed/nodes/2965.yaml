    html: <p>Paul one more thought, in any publishing business the editors know how many words they need to fill a certain amount of space. So your editor has a feel for managing the writers telling them to write to a certain number of words. If you change the text face make sure the characters per pica is almost exactly the same as Times or you might get some resistance.</p>
