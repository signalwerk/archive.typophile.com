    html: <p>Paul, I don't know anything about newspaper design, except that it is a whole art in itself.  <br> <br>If you have any budget to buy some fonts, I would call Fontbureau and talk to whomever is their resident expert on newspapers. The 'Readibility' series - 9 different fonts each with a range of weights - is specifically for newspapers, and something designed to purpose is probably going to end up looking a lot better. They have a PDF of it you can download it and print it out, and have the phone number for this on their site. I'm sure they can clue you in on what will work for your paper stock, press, budget, etc.  <br> <br>The Gerard Unger stuff is also a great idea, and designed and proven for newspapers. You could e-mail him and maybe even phone. Start on his web site <a href="http://www.gerardunger.com" target="_blank">www.gerardunger.com</a>  <br> <br>After talking or e-mailing both you will have a way better idea of what your options are. <br> <br>By the way, Cheltenham for text is a terrible idea IMHO. Its ascenders are way too tall for newspaper text. Fine for Titles, as the NYT uses it; it is narrow, dark and long extenders - that fits the narrow columns they use. </p>
