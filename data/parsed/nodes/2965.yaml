    html: <p>No, I think 10 point would make ITC Cheltenham really horsey, not like a newspaper. But try 9, with some extra leading. <br> <br>Georgia and Miller are sisters, and both good for news. The former is free, but has no kerning. Look at Olympian too. <br> <br>For the Amerind appeal, maybe blackletter would be a good choice after all. But something "strict" and honest, like a firm textura - or even a "jackboot grotesk" (like ITC Honda), if you don't mind some people calling you fascist. <br> <br>hhp <br></p>
