    html: <p>Paul, one more thought, don't use your own money for a company project. Write a proposal outlining the costs in terms of outside expenses (type) and internal expenses (your time). Place a dollar value on your time (be generious) and double the amount of time you think the project will take. This will place value on your project, plus it will show how little the cost of the type licenses really are.</p>
