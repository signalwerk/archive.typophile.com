    html: "<p>Daniel, good point. And Times isn't easy to beat. In fact the best way to beat it is to use a WIDER font with a bigger x-height, so you can set it smaller and with less -total- leading. The CPP will be worse than Times for a give point size, but the overall surface area used by the other font in a <i>small</i> point size will be less (without losing on apparent size), at least for news text (which has a lot of linebreaks - which negates the space savings of narrow designs like Times). <br> <br>BTW, check out these: <br> <br><a href=\"http://www.myfonts.com/fonts/bitstream/lydian/bold/testdrive.html?s=WINSLOW%2BMAIL&amp;p=72\" target=\"_blank\">http://www.myfonts.com/fonts/bitstream/lydian/bold/testdrive.html?s=WINSLOW+MAIL&amp;p=72</a> <br> <br><a href=\"http://www.myfonts.com/fonts/bitstream/lydian/bold/testdrive.html?s=Winslow%2BMail&amp;p=72\" target=\"_blank\">http://www.myfonts.com/fonts/bitstream/lydian/bold/testdrive.html?s=Winslow+Mail&amp;p=72</a> <br> <br><a href=\"http://www.myfonts.com/fonts/linotype/klang/mt/testdrive.html?s=WINSLOW%2BMAIL&amp;p=72\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/klang/mt/testdrive.html?s=WINSLOW+MAIL&amp;p=72</a> <br> <br><a href=\"http://www.myfonts.com/fonts/linotype/klang/mt/testdrive.html?s=Winslow%2BMail&amp;p=72\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/klang/mt/testdrive.html?s=Winslow+Mail&amp;p=72</a> <br> <br>hhp <br></p>"
