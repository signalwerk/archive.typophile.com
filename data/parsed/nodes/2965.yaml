    html: "<p>Hi Paul. <br> <br>I will start with the familiar disclaimer that I've never designed a newspaper. <br> <br>Some questions to ask: Is it a small town paper? Should it look like a small town paper? Do readers want it to look like a small town paper? <br> <br>The implications of this are many. For example, the NYT doesn't have any advertising on the font cover. Should that be a priority? Even if there must be ads on the front page, I would lobby hard to remove them from the masthead. <br> <br>On the masthead: You are dealing with people who are comfortable with 3D photoshopped type, a waving american flag, a local statue (i assume), and a big 50 cent. So moving back to a purely typographic masthead may be a stretch for them. I'd definitly loose the flag. And the large 50 cent (everyone in winslow knows that). If the statue is in fact a Winslow landmark, I would consider keeping it (or some other town landmark) and using it in a <b>Winslow (statue) Mail</b> configuration. Make it an engraved or scratchboard looking illustration, not a photograph </p>"
    html_clean: "<p>Hi Paul. <br> <br>I will start with the familiar disclaimer that I've never designed a newspaper. <br> <br>Some questions to ask: Is it a small town paper? Should it look like a small town paper? Do readers want it to look like a small town paper? <br> <br>The implications of this are many. For example, the NYT doesn't have any advertising on the font cover. Should that be a priority? Even if there must be ads on the front page, I would lobby hard to remove them from the masthead. <br> <br>On the masthead: You are dealing with people who are comfortable with 3D photoshopped type, a waving american flag, a local statue (i assume), and a big 50 cent. So moving back to a purely typographic masthead may be a stretch for them. I'd definitly loose the flag. And the large 50 cent (everyone in winslow knows that). If the statue is in fact a Winslow landmark, I would consider keeping it (or some other town landmark) and using it in a <b>Winslow (statue) Mail</b> configuration. Make it an engraved or scratchboard looking illustration, not a photograph </p>"
