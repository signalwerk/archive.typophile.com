    html: <p>Paul -- <br> <br>For information about the Font Bureau's offerings specifically geared toward newspapers, go to the Newspaper section of their site at <a href="http://www.fontbureau.com/newspapers/" target="_blank">http://www.fontbureau.com/newspapers/</a>. <br> <br>This Products subsection includes the Readability series mentioned by William above. The PDF can be downloaded from <a href="http://www.fontbureau.com/newspapers/readability.pdf" target="_blank">http://www.fontbureau.com/newspapers/readability.pdf</a>. However, you should know up front that for the fonts in this series, FB requires a minimum license for 25 workstations. This aspect of their business is geared toward medium and large newspaper operations, not small-town weekly papers like yours, unfortunately. <br> <br>Nevertheless, the Newspaper section also features some of their more readily available Retail fonts which they feel work well for newspaper use. This information will at least give you ideas, even if it doesn't offer solutions within your budget. <br> <br>Best of luck. <br> <br>-- K. <br></p>
