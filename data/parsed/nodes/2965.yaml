    html: <p>Thnx for all your suggestions, folks, a little more insight into our opperation (just fyi) we're small, really small, at most we'd need a licence for 5 workstations, at least two, but i figger most licences cover at least 5 stations, so i'm safe there. <br>william i totally agree with you that there are more problems than just fonts. personally i'd like to take all ads out the face plate. my publisher wants a big, bold headline each week that runs across the page, i'm thinking i would like to widen the leftmost column for quick reads and weather and contact info and an index, that would narrow the columns to the right, i'd definately do something about the leading, and there's no way i'm sticking with times for the body text and definately not for headlines, but then i'm getting WAAAAAAY ahead of myself. i've been thinking i should talk to my sister who does page layout for the Seattle Post-Intelligencer *lightbulb goes on* but we have conflicting schedules and i haven't been able to get a hold of her yet this week. then i can talk shop with her about body type, headlines, layout, etc. for now i'm gonna just worry about the nameplate. thank you all for your insight and for pointing out useful resources. i'm gonna go start drafting some heads for the paper!</p>
