    html: <p>I think ITC Cheltenham might actually work for news text (8-9 pt), but only if you track it a bit looser - which will make it lighter too. And note that Times is actually a bit light for news in today's repro conditions (especially at smaller sizes). So don't conclude that ITC Cheltenham is too dark based on a comparison with Times, or seen at 24 point, or from laser prints (which make type darker). <br> <br>(I can't believe I'm defending that monstrosity! But I guess any font has its use... Even Helvetica.) <br> <br>&gt; FB has put Whitman on the newspaper font list. <br> <br>That makes no sense. <br> <br>hhp <br></p>
