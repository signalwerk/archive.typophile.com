  html: |-
    <p>I need to use an company name in running text and am having wondering about the placement of the reserved symbol. It sucks I can't write the name of the company because it's changing and hasn't launched. Boo. I'm trying to make this understandable without giving away the name. Let's say there are two sentences here in each example:</p>
    <p>Lorm ipsu dolor New Name, Inc.(R) New Name Subsidiary cetti mar klepto pacis.</p>
    <p>OR</p>
    <p>Lorem ipsum dolor New Name, Inc(R). New Name Subsidiary cetti mar kelpto pacis.</p>
    <p>But the problem is the first two words of the first company name (incorporated) begin with the same letter. Then on the second company name (a subsidiary), the first two words are the same. It starts to look confusing in the first example.</p>
    <p>Grammatically I would think the first option was correct, because Inc. needs the period. But then the (R) looks to be sitting outside that sentence and belong to the next sentence.</p>
    <p>Any thoughts?</p>
