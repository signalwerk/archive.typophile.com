      <p>Hmm, interesting question. Did they really register the name with the Inc. included?</p>
      <p>Microsoft® is a registered trademark of Microsoft Corporation. I searched and searched every major company out there... Apple, Inc. Adobe Systems Incorporated, Nike, Inc., Amazon.com, Inc., Yahoo, Inc., Microsoft, Inc. etc. and couldn't find one instance where they showed a registered trademark with the company name.</p>
      <p>Microsoft has quite a list.<br>
      <a href="http://www.microsoft.com/library/toolbar/3.0/trademarks/en-us.mspx" title="http://www.microsoft.com/library/toolbar/3.0/trademarks/en-us.mspx">http://www.microsoft.com/library/toolbar/3.0/trademarks/en-us.mspx</a></p>
