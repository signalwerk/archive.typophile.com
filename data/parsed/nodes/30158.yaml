    <p>I was sent this cartoon from Monday’s Seattle Post-Intelligencer. A typographic political cartoon is a rare breed indeed. It’s interesting that the cartoonist assumes that readers know what “sans serif” means; in my experience, this is rarely the case. <a href="http://seattlepi.nwsource.com/horsey/print.asp?id=1515">Original link</a>.</p>
