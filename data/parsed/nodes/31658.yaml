    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : PMN Caecilia</strong></p>
    <p><img src="http://sampler.linotype.com/fontbadges/150/1313.gif" img=""></p>
    <p>Caecilia, designed by <a href="/wiki/Peter%20Matthias%20Noordzij" class="freelinking" rel="nofollow">Peter Matthias Noordzij</a>, was issued by <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a> in 1991 as PMN Caecilia in a range of <a href="/wiki/weight" class="freelinking" rel="nofollow">weights</a>, including <a href="/wiki/small%20capitals" class="freelinking" rel="nofollow">small caps</a> and <a href="/wiki/text%20figures" class="freelinking" rel="nofollow">text figures</a>. This face is (perhaps) the first <a href="/wiki/neohumanist" class="freelinking" rel="nofollow">neohumanist</a> <a href="/wiki/slab%20serif" class="freelinking" rel="nofollow">slab serif</a>, with a true slab serifed <a href="/wiki/italic" class="freelinking" rel="nofollow">italic</a> to match. The italic is based on renaissance parameters, meaning it slopes at 5°. This face is a graceful and sturdy slab serif, useful for various applications.</p>
    <p><strong>External Links:</strong><br>
    <a href="http://www.linotype.com/1313/pmncaecilia-family.html" rel="nofollow">PMN Caecilia at Linotype</a><br>
    <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=PMN%20Caecilia" rel="nofollow">PMN Caecilia at FontShop</a><br>
    <a href="http://www.flickr.com/photos/stewf/197268636/in/set-81960/" rel="nofollow">PMN Caecilia and TheSerif</a></p>
