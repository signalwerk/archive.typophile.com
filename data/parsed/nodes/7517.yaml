  html: <p>I've done this a hundred times before, I have no idea why it's not working. I have a regular PostScript font, which has some extra, non-standard characters. I've added some very basic OT features, and when I compile them, it either tells me that something wasn't expected and it's aborting because of errors, or it doesn't give me anything at all in the Output window, but the features don't compile. <br> <br>Right now, I'm working with a font that has a single kerning pair defined in the OT panel. I can't get it to compile. No features with a checkbox show up in the OT preview panel. I'm starting to get really impatient and I wouldn't want to have to do something irresponsible, what with the election already ruining the week/year. <br> <br>Someone please help, I'm getting desperate! <br> <br>Many many thanks, <br>Alan</p>
