    date: 2004-11-04T21:24:00
    votes: null
    html: "<p>Third time's the charm: it's working now, but in a really strange way. <br> <br>I had to add more features in the OT panel for it to preview correctly in the OT preview panel. After compiling, checking features, and saving, I re-open the font to find that the features have all been scrambled. The kern feature has been smashed into the liga feature definition. <br> <br>Oddly enough, when I compile and test the fonts, they work! I've attached a picture of what my two (was three before I closed and opened the font) features look like. Strange stuff. <br> <br>Alan <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/52870.gif\" alt=\"Screenshot of OT features being re-arranged\"></p>"
  - id: 51111
    user_id: 1275
    user_name: jfp
    user_path: null
    date_raw: 5 Nov 2004 — 12:05am
    date: 2004-11-05T00:05:00
    votes: null
    html: <p>Adobe OT FDK + FL Mac (specially) have some problems with handling of line breaks on OT panels. There is a mixture of various kind and sometime, it happen <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"> <br> <br>There is not perfect solution to that. Open the bad features file in text editor and compare to good features file and try to bring it back when its correct.</p>
  - id: 51112
    user_id: 1087
    user_name: eolson
    user_path: null
    date_raw: 5 Nov 2004 — 6:03am
    date: 2004-11-05T06:03:00
    votes: null
    html: <p>Alan - <br> <br>I feel you on the election/OT blues. I've been sailing the same ship lately. <br> <br>As I'm sure you know, this problem could be any number of things but <br>recently I've found that if I make even the slightest change to one <br>of my classes the OT code will jumble as in your screen grab. <br> <br>Or, as JFP points, line breaks can cause the same thing. I've found <br>even extra spaces after lines of code can cause the jumbles. <br> <br>Or, even a third, can be the voodoo of the "Add all glyph classes to OpenType <br>feature definition code" option under the Prefs panel. I might be insane <br>but I swear that things turns on and off by itself. <br> <br>Hopefully some of this helps. When you get the features to work, save <br>the file in a guarded vault.</p>
