    html: "<p>Abu Sharmoota, <br>If I make a list of a half a dozen specific people and you aim it on them, I would do that gladly! <br> <br>Seriously: I don't condone killing, and I've never done it myself (mostly because I was luckily to avoid being in that position). But my attraction to certain machines of war* is there - you might catch the bug too if you ever find yourself growing up smack dab in the middle of a 17-year war. I don't try to reconcile (or even explain) all my feelings, but the fact that I admit to them puts me on a higher level than denial-junkies engaging in criminal voting. <br> <br>* Like the mangonel. <br> <br>And remember Gill? He hated Industry, but he couldn't help but love trains. <br>Humans are strange, and I'm stranger than average. Who/what are you? <br>A saint? If you are, don't show your face around me. <br> <br>hhp <br></p>"
