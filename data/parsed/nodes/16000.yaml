    date: 2005-11-02T18:58:00
    votes: null
    html: |-
      <p>I think the problem with the heavier weights of Apex is that it attempts to remain truly monoline, and keep the weight of that monoline the same for all characters. So the heavy weights suffer from the lack of optical compensation at stroke intersections, and not doing lighter strokes in characters with a high stroke density.</p>
      <p>I like the underlying design and the lighter weights, though, and I am sure that Chester could salvage the heavier weights with a bit more work.</p>
      <p>Cheers,</p>
      <p>T</p>
