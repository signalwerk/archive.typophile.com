    date: 2005-11-02T13:39:00
    votes: null
    html: "<p>Eric, thanks. The font works best at lighter weights. That is to say: the heavy weights are pretty poor. (I was younger and my chops were not what they could have been.) The Book weight specifically is quite good. At some point, if there is demand and interest, I will revise the font family, and do better. (The same applies for Apex Sans, which is presently undergoing a serious and necessary revision, and is going to be MUCH better...)</p>"
