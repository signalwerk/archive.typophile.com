    html: "<p>Miles, I don't understand what \"Red\" has to do with this, but if things are like they say, the Greek Gill Sans mentioned was designed by a colleague of Panos, Hector Haramboulos. <br> <br>And it would be pretty unfair to merely consider Cannibal \"an Athen-based agency\". They did many good and some excellent Greek interpretations of many Monotype, FontFont and Emigre fonts, and they are the leading Greek label, I think. Although I'm not so enthusiastic by Haramboulos' Gill Hellenic (I have a copy sent me by Panos and I have the Monotype version I bought as well), the design already existed. If there was someone to choose (in Greece) for the task, it could not have been none other than Cannibal, I suspect. <br> <br>If you wish to see better and subtler work by Cannibal, you may look at the great Greek version of Fedra (developed by Panos Haratzopoulos with Peter Bilak) or to the classic but unusual Apollonia, by Panos' university teacher. Gill Hellenic is here, anyway (use the popup menu): <br><a href=\"http://www.fonts.gr/tryfonts/index.asp\" target=\"_blank\">http://www.fonts.gr/tryfonts/index.asp</a></p>"
