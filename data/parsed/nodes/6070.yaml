    html: "<p>I'm glad Panos found the time to clear the question. Vincent? <br> <br>And, forgive me, but if such \"comments\" about Gill (or whichever designer, dead or alive) behavior are irrelevant about type conversations, why are they always raised? <br> <br>I suppose because you always have to look at someome presumably worse than you to feel \"safer\" or \"better\". And not to improve. <br> <br>A journalist: \"What do you think should change in the Church?\" <br>Mother Theresa of Calcutta: \"You and I\". <br> <br>Thanks, Hrant. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
