    date: 2004-08-27T06:00:00
    date_raw: 27 Aug 2004 — 6:00am
    votes: null
    html: <p>In my experience the budgets for the identity and the infrastructure works would be entirely separate items, and -- depending on the scale of the project -- their management structure may not overlap until you reach the very top levels in the hierarchy. I do not think you could sustain that, for example, going for different mascots would release funds for works.  <br> <br>Of course, whereas no delay was registered with the identity, a substantial part of the works happened in the last few months -- so even less of an opportunity for give-and-take there... And, whatever you think of Phoevos (which my sons like, but if they knew better would probably disagree with the decision to drop the proper diphthong) you have to keep in mind that it costs just as much to get it right than to get it wrong.</p>
