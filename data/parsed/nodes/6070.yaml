    html: "<p>Let me answer some of your questions regarding the Olympic font. <br> <br>First of all, the Olympic font -Gill Sans Hellenic- was designed by my colleague in Cannibal, Hector Haralambous and I thank Claudio for mentioning it. (Hector among other things, has been designing fonts for more than 20 years)  <br>Some modifications that I did, do not remove any credit from Hector. <br>This Greek version of Gill Sans is quite different than Gill Sans Dual Greek and is distributed under license of Agfa Monotype by Cannibal which is the name of our design studio. <br>The reason why Athens 2004 used Gill Sans Hellenic is clearly quoted in Agfa Monotype's announcement. <br>Now, if Eric Gill was a paidophile and a pervert is something irrelevant with this conversation and I agree with what Dan posted. <br> <br>RED Design Consultants, together with Wolff Olins are the designers of the olive wreath mark as Nathan correctly noticed. The font used for the ATHINA logo is Foundry Sans (not Frutiger) with some slight modifications (ex. #2). Apart from the logo, nowhere else has any other font been used but Gill. <br> <br>And last, since it is Vincent's opening question, I am not aware of any assignment nor Gerry has ever mentioned, at least to me, something. Besides, Gill Sans Hellenic was decided as the Olympic font long before the year 2000 and at least anyone involved in our effort to organize the Games in Greece (publishers, printers, designers, advertisers or licensors) were well aware of that. <br> <br>Panos</p>"
    html_clean: "<p>Let me answer some of your questions regarding the Olympic font. <br> <br>First of all, the Olympic font -Gill Sans Hellenic- was designed by my colleague in Cannibal, Hector Haralambous and I thank Claudio for mentioning it. (Hector among other things, has been designing fonts for more than 20 years)  <br>Some modifications that I did, do not remove any credit from Hector. <br>This Greek version of Gill Sans is quite different than Gill Sans Dual Greek and is distributed under license of Agfa Monotype by Cannibal which is the name of our design studio. <br>The reason why Athens 2004 used Gill Sans Hellenic is clearly quoted in Agfa Monotype's announcement. <br>Now, if Eric Gill was a paidophile and a pervert is something irrelevant with this conversation and I agree with what Dan posted. <br> <br>RED Design Consultants, together with Wolff Olins are the designers of the olive wreath mark as Nathan correctly noticed. The font used for the ATHINA logo is Foundry Sans (not Frutiger) with some slight modifications (ex. #2). Apart from the logo, nowhere else has any other font been used but Gill. <br> <br>And last, since it is Vincent's opening question, I am not aware of any assignment nor Gerry has ever mentioned, at least to me, something. Besides, Gill Sans Hellenic was decided as the Olympic font long before the year 2000 and at least anyone involved in our effort to organize the Games in Greece (publishers, printers, designers, advertisers or licensors) were well aware of that. <br> <br>Panos</p>"
