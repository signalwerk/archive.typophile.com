    html: "<p>From what I see, Red designed the identity of an humanitarian work, \"The Olympiacos Blood Bank\", which incidentally uses Cannibal's Gill Hellenic and Emigre Arbitrary Greek. Nothing to do neither with type design nor the Olympic Games, I think. <br> <br>From Red's website: <br>\"The Olympiacos soccer club this week, in a social effort supported by Red Design Consultants is beginning a huge blood drive. <br>\"The Olympiacos Blood Bank was started in memory of the victims of Gate 7, a tragic accident that cost many human lives, and it is now putting together a nine-day, nation-wide humanitarian marathon that will ask for the participation of well-known athletes, business people, club members and fans.\"</p>"
