    html: "<p>My two [euro]cents:  <br>Vince's query is not unfounded. There was indeed an early effort for a new Greek typeface, roundabout the time Miles did his work through W-O. The people then involved had a preference for Foundry Sans, therefore it made it into the logo. My involvement was before and shortly after the time of the logo; in the end it came to little, mostly for licensing reasons. No mention of Gill Sans was made at the time I was in the loop, but I've been out of it for years.  <br> <br>Foundry Sans had the double benefit of a contemporary design, and the lack of association with the British typographical tradition; arguably desirable attributes in this case. Its drawback, in the context, was the slanted italic.  <br> <br>Being in Greece for the four weeks preceding the Games and taking in as much as I could, I can say that the whole identity thing clicks together pretty well. However, the <a href=\"http://www.athens2004.com/athens2004/page/nochildren?lang=en&amp;cid=c0a87ae4be659f00VgnVCMServer28130b0aRCRD#\"> pictograms</a> deserved to be a bit more visible; or perhaps it is my current televisual perspective.</p>"
