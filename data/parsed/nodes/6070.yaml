    html: <p>thanks for making things clearer Panayiotis. <br> <br>I worked on the wreath with the designer Theodora Mantzaris - Kindel, then at Wolff Olins, now Manager of the Image &amp; Identity Department in the Organising Committee for the ATHENS 2004 Olympic Games. <br>I'm not sure exactly who selected Gill, I selected and modified the logotypes in FoundrySans, <br>and was very much looking forward to doing a custom typeface for the event :-( <br> <br>Theodora gave a presentation of the Visual Identity of the ATHENS 2004 Olympic Games at the Thesalonniki (sp) typography conference this year. <br>red design have been handling implementation.</p>
