      <p>John, </p>
      <p>I can see that you have decided how you will see any typeface set before you, so I doubt I can convince you. However.... </p>
      <p>Gill and Syntax are both part of the same category. There are a lot of other new types that fit that category, and a lot that don't. Saying that various types derive from one or the other is ignorant of how typefaces are developed. Syntax is partially derived from Gill, but also derived from Garamond. Gill was partially derived from other faces not in the Humanist sans category. The categories themselves aren't that useful, as too many faces lie on the margins. New categories have to be invented to house them (as in music).</p>
      <p>Have you not noticed a new category of sans proliferating lately? It's not specifically "derived" from any of your three. It's a new category, and some of the entries are useful for text, some not. Try to guess what I mean.</p>
      <p>Then there's the category Frutiger invented with his eponymous design. It's related to Gill and Syntax but clearly different. And it's derived from a lot more than a single previous typeface. </p>
      <p>Oh that reminds me, there are a bunch of new Geometric sans designs (also not one of your three) that are being used for editorial matter.... </p>
      <p>John I fear you are taking things too much at face value. If you swallow whole reading studies done by groups that completely ignore all typographic factors in preparing their test materials, then you can conveniently believe the answers are all out there. They aren't; far from it. Don't confuse the result with the cause. </p>
      <p>I'm not curious that a bio of Renner isn't set in Futura; book typographers generally know better than that. When the book typographer is also a type designer there's more to the picture. </p>
      <p>I have to go back to your earlier comment: do you really think, at this juncture, the Sans is going to fade before the Serif?</p>
