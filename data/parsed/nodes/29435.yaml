    html: |-
      <p>Serif glyphs are more recognizable than sans glyphs (especially geometric sans) because they provide the viewer/reader with more visual clues. Eg d, b and p are examples of that. </p>
      <p>Don't forget that the human brain is programmed to recognize shapes in any orientation. That's what's evolution is for… recognizing a dangerous snake whether it's hanging from a branch or slithering on the ground does make a difference ; ). </p>
      <p>IMO this whole existing (western?) tradition of using (lowercase!) sans for teaching kids to read is totally of the mark. It has even been suggested that starting with all caps would improve learning to read, because the glyphs are far more recognizabele than lc ones.</p>
      <p>Another important feature is that serifs help the eye to follow the stream of letterforms. Some sans typefaces emulate this by a specific orientation of the contrast, eg FF Balance. </p>
      <p>And I think that the point made before, that serifs help to define the shape between glyphs, is really important too. And also one that hasn't been researched enough…</p>
