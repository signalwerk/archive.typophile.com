      <p>Oh, nothing is in danger of fading--all typography exploded after Postscript like a Big Bang, but my designer friends and I inhabit this brave new world as type consumers, not type designers, and we have our own perceptions--perceptions with a shopping logic. For us, if new face A looks too much like classic B we already own and use, we don't buy. For us, typography breaks down into distinct looks which may have little to do with historical and technical categories. We are not being "ignorant" when we prefer our own shopping logic. </p>
      <p>When you use Syntax, Gill, and Trade Gothic regularly, you become acutely conscious of how many NEW issues orbit around each look without breaking free. Of course, I'm aware of exceptions because I'm testing them out myself. My current fav is Emigre's Cholla, which seems to be working in long texts in a way that FF DIN doesn't always. Since I own so many sans, my buying standard has drifted higher. For me the standard is Avenir, at once a familiar yet a totally fresh fusion of looks, and totally right everywhere from its first use. Let a thousand sans bloom, as long as I don't have to sniff them all!</p>
