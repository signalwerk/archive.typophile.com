    html: "<p>There is certainly room in the type market for those with conservative taste. But one can't see what advantages one design offers over others, however similar, until one actually uses them both. For instance, Univers and Helvetica seem nearly identical to some. If you have Helvetica, is there a point to having Univers? I think Univers is better, because it's more subtly drawn, has more contrast, is spaced better and successfully updates the Grotesk genre of types for the 20th century. The overall effect is actually quite different, and Univers works at more sizes than Helvetica. If I had to choose one family it would be Univers, but I wouldn't know that from a single online GIF file. However that leads me back to my point: it's 2006. I don't find as many uses for Univers as I used to in the 80's and 90's. Many designers want to take advantage not only of <a href=\"http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=C.113530.0.0\" rel=\"nofollow\">types that do more</a> but also <a href=\"http://typographi.com/001045.php\" rel=\"nofollow\">types that are fresher.</a></p>"
