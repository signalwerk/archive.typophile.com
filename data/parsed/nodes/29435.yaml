      <p>Carl, if you know of any new sans serifs intended for editorial use, not just display or novelty, that do *not* derive from Syntax, Gill Sans, or Trade Gothic, I would be very interested in seeing them. For a while the market was flooded with copycat Syntax-derived faces; now the pendulum has swung to Gill-derived. I suppose the next phase will be to revisit Trade Gothic, especially plugging in oldstyle figures, which now seem to be offered that way only by FF Bau. I would love to see any new text-use sans-serif that breaks out of this tight three-model box.</p>
      <p>As for studies on sans vs serif for reading, I remember typesetting, in the annual journal of my client the National Center for Learning Disabilities, articles that surveyed such studies going back 30 years, so without being a reading specialist as they were, I know it's all out there. But the simplest answer is given by the marketplace: how many books, or magazines with long articles, are set in sans-serifs? Isn't it curious that a biography of its designer was not set in Futura?</p>
