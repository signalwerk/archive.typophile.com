      <p>I have a somewhat crazy theory of why serifs are better for readability: it's because the perceived spacing between letters stays similar at different scales. For readability (as opposed to legibility), the importance of the appearance at different scales comes from the imaging of a fixation point (bouma if you will) onto different areas of the retina, especially the fovea and parafovea.</p>
      <p>In sans serif type, the gap between two letters becomes larger in direct proportion to the scale. If it's .5mm at 12pt, it will be 3mm at 72pt. But for type with serifs, the situation is different. At 12pt, the eye sees primarily the space between the stems, say .5mm again. But as the scale goes up, the eye is drawn more to the gap between the ends of the serifs, which is much smaller.</p>
      <p>Proving this theory right or wrong is not an easy task, but if it does hold up, it would strongly suggest that serifs help readability at the level of deep visual processes, and are not just an quaint artifact that should be abandoned in modern times.</p>
      <p>Wouldn't it be shocking if high-tech research on readability were to determine that the most optimum letterforms are essentially those of <a href="/wiki/Nicholas%20Jenson" class="freelinking" rel="nofollow">Nicholas Jenson</a> from over 500 years ago?</p>
    html_clean: |-
