      <p>We don't know exactly why, but for books and long magazine articles, the eye rebels at endless ribbons of sans serif type...it wants the contrasts and kinks of serif fonts, the more complex the better actually...a paradox, perhaps, but well established by many studies and, of course, our own personal experience reading. Remember the recent bio of Paul Renner set not in his creation Futura but in Celeste, and the better for it? </p>
      <p>Plus, how many bases are there for readable sans? All the new entrants derive from either Syntax, Gill, or Trade Gothic whereas serifs can derive from many more models with much more leeway for oddities to delight the eye. If anything's going to fade, it's the sans.</p>
    html_clean: |-
