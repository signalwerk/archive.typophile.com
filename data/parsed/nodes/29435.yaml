      <p>From Carl: I think it should be the clients’ wallets. </p>
      <p>If only! Actually, Carl, I'm getting pretty cagey in my old age, especially with book publishers who profess to be typophiles: as soon as they say that, I include a new typeface from my hit list among their job font choices--fortunately, one can set relevant samples on-screen and then copy a screen snap to the client. If they're nuts about Galliard (they all own shelves of Bruce Campbell's Galliard-infested Library of America titles), I point out that oldstyle figures are now available, in an OpenType ITC family package for only $315 that they can also use in their systems. Even for nonprofits, that's not even a box of pencils. Nobody's bit yet, but hope springs eternal! I've read our threads about who should pay. As Dorothy Parker said: you can lead a ho to culture, but you can't make him buy type!</p>
