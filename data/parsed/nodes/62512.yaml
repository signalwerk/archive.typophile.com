  html: |-
    <p>I've been working at this for hours..ugh! Sure, if there's a better way to do this, please inform. Regardless, I want to really build this script from scratch to learn.</p>
    <p>What I want to do:<br>
    Shift points at a certain y value to a different y value.</p>
    <p>Logical Process:<br>
    Cycle through each glyph in my font. In each glyph, cycle through contours. Within the contours cycle through points. If the point has a y value or 395, or 265, change accordingly. </p>
    <p>--------------------------------------------------<br>
    from robofab.world import CurrentGlyph<br>
    from robofab.world import CurrentFont</p>
    <p>font=CurrentFont()</p>
    <p>for x in font:<br>
    	print font[x.name][0]<br>
    	contour= font[x.name][0]<br>
    	for p in contour.points:<br>
    			if p.y==395:<br>
    				p.y += 100<br>
    			if p.y==265:<br>
    				p.y -= 100<br>
    font.update()<br>
    --------------------------------------------------</p>
    <p>What am I misunderstanding here? When I target the contour by doing CurrentGlyph()[0], it works. So why not font[x.name][0]? Oddly enough font[x.name] is returning the value expected, but CurrentGlyph() returns the glyph that apparently belongs to "unnamed_font". And for some reason, the unnamed_font one works. Am I totally off in my approach?</p>
