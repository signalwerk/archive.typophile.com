      <p>#!@$%!!<br>
      just when I mustered up the will to post it, I figured it out:</p>
      <p><code><br>
      from robofab.world import CurrentGlyph<br>
      from robofab.world import CurrentFont</code></p>
      <p>font=CurrentFont()</p>
      <p>for x in font:<br>
      	for m in x:<br>
      		print m<br>
      		for p in m.points:<br>
      				if p.y==395:<br>
      					p.y += 100<br>
      				if p.y==265:<br>
      					p.y -= 100</p>
      <p>	font.update()<br>
      </p>
      <p>The only question now is, would this be the best way you would solve this problem?</p>
