      <p>Regarding the naming of variables some one letter variables are used very often in RoboFab scripts:<br>
      f for a font object, i.e. f = CurrentFont()<br>
      g for a glyph object, i.e. g = f['Adieresis']<br>
      p for a point object<br>
      and when dealing with multiple objects of the same type variables can be numbered, i.e. f1, f2, etc.</p>
      <p>To distinguish variable names from reserved keywords you can always opt to let them begin with the same suffix. For instance 'my':</p>
      <p><code><br>
      from robofab.world import CurrentFont, CurrentGlyph</code></p>
      <p>myFont = CurrentFont()</p>
      <p>for myGlyph in myFont:<br>
      &gt; for myContour in myGlyph:<br>
      &gt; &gt; for myPoint in myContour.points:<br>
      &gt; &gt; &gt; if myPoint.y == 395:<br>
      &gt; &gt; &gt; &gt; myPoint.y += 100<br>
      &gt; &gt; &gt; if myPoint.y == 265:<br>
      &gt; &gt; &gt; &gt; myPoint.y -= 100</p>
      <p>myFont.update()<br>
      </p>
      <p>-Paul van der Laan<br>
      <a href="http://www.type-invaders.com" title="www.type-invaders.com">www.type-invaders.com</a></p>
