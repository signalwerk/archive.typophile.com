    html: <p>Very nice work.  <br> <br>I wonder about the top of the lowercase i, which is different from j and the first/leftmost stem of the other letters. (If you want the i and j to be different, so be it, but at least make the i with the taper, and the j be flattop. That way, at least in the specimen where the i and j are next to each other, the "leftmost" stem is tapered, and the "other" stem is flat. I hope that makes sense.)</p>
