    html: <p>This is really very fresh*. And some of the glyphs are right on, but many will need a lot of work. The "c" for example needs more curl at the bottom, I think. And try making the stem of the "f" taper thinner towards the bottom. <br> <br>* In fact I think it's too gentle to be called Paprika. It's more like... blueberries? What's "blueberry" in Hungarian? <br> <br>In terms of texture, it's jumpy - but that's to be expected - it's a natural part of the design - just tighten it up though, it might make it all suddenly take hold. <br> <br>hhp <br></p>
