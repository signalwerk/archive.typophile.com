    <p>Hi, I just bought a box of old leady type from a small print shop. It's a display sized Black Letter family. There seem to be mixed pieces of 72 and 60 pt in the box.</p>
    <p>¿Any idea on how to clean this? Most of the dirtiness is dust but there are also some rusted pieces.</p>
    <p>TIA</p><div class="imageWrap"><img src="http://typophile.com/files/DSC_9543_4689.JPG"></div><div class="imageWrap"><img src="http://typophile.com/files/DSC_9544_6371.JPG"></div><div class="imageWrap"><img src="http://typophile.com/files/DSC_9547_4227.JPG"></div><p></p>
