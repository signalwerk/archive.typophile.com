    date_raw: 23 Mar 2010 — 10:38pm
    votes: null
    html: |-
      <p>Don't use anything hard to rub it. There are some leather pads, you can buy in any supermarket for cleaning plates and whatever. Its useful. On the oder hand: You don't want to print with it anymore, do you? So you can use harder solutions, too.</p>
      <p>You might see the round marks on the side of the types? This are "Gussmarken" - I don't know the english word. This is one from Schelter &amp; Giesecke:<br>
      <a href="http://www.bleisetzer.de/cms/front_content.php?idcat=58&amp;idart=826" title="http://www.bleisetzer.de/cms/front_content.php?idcat=58&amp;idart=826">http://www.bleisetzer.de/cms/front_content.php?idcat=58&amp;idart=826</a></p>
      <p>Your american types should have an height of 23,32 mm. German height is at 23,56 mm.</p>
      <p>If you need any more types, use: ;-)<br>
      <a href="http://www.bleisetzer.de/cms/front_content.php?idcat=69&amp;article_id=670" title="http://www.bleisetzer.de/cms/front_content.php?idcat=69&amp;article_id=670">http://www.bleisetzer.de/cms/front_content.php?idcat=69&amp;article_id=670</a></p>
