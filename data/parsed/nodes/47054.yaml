    html: <p>This is probably custom, since it's a logo and the "e"'s are different. You might like the scripts in the <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000194" rel="nofollow">Charles Blumlein Collection</a>, especially <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000186" rel="nofollow">Miss Fitzpatrick</a>, <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000110" rel="nofollow">Miss Lankfort</a>, and <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000080" rel="nofollow">Mr. Rafkin</a>.</p>
