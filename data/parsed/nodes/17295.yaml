    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Graham Type Foundry</strong></p>
    <p>This foundry was founded by type designer <a href="/wiki/John%20Graham" class="freelinking" rel="nofollow">John Graham</a> (1851-?). Graham originally worked in a printing office and later went to work for <a href="/wiki/MacKellar%20Smiths%20and%20Jordan" class="freelinking" rel="nofollow">MacKellar, Smiths &amp; Jordan</a> working on specimen books. At night he studied drawing and letter design, and bought engraving tools and taught himself type cutting. The foundry encouraged his efforts and in 1882 he joined the <a href="/wiki/Marder%20Luse%20Foundry" class="freelinking" rel="nofollow">Marder Luse Foundry</a> in Chicago where he cut Spinner Script and Spinner Script No. 2, and some sizes of Inclined Program. He cut a minion size map font for the Illinois Type Foundry, and eventually started the Graham foundry, cutting borders and ornaments primarily, which were highly successful.</p>
