  html: |-
    <p>When I copy and paste outlines form illustrator to fontlab, the outlines appear below the baseline and I have to move them up to the correct position. Is there a way to paste then so they sit on the baseline.</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/Picture_4166.jpg"></div><p></p>
