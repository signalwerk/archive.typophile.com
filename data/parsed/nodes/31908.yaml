    html: |-
      <p>Rachel, </p>
      <p>the outlines appear exactly as they are placed in Illustrator: the origin point in FontLab Studio corresponds to the origin point in Illustrator. </p>
      <p>All you need to do is move the origin point in Illustrator by drag-dropping the small rectangle where the horizontal and the vertical ruler intersect. Also, there is a section of the FontLab Studio 5 manual dedicated to exchanging drawings with Illustrator which I recommend reading. </p>
      <p>A.</p>
