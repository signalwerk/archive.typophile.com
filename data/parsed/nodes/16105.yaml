      <p>I think the thing to do here would be to take Hrant's suggestion and go with polymer. I say this not only because it removes the issue of finding a metal face with @, but more importantly because of what Hrant has been talking about in terms of distinguishing between affectation and purpose/message.</p>
      <p>I've seen some extremely effective letterpress business cards and, to my mind, what made them stand out was the combination of old-school detail (quality paper, understated design, solid setting [kerning, etc.], good inking, firm but not killer impression) with new-school technology and design. That is, the easiest way to avoid the impression of preciousness with letterpress is to avoid using the standard faces that everyone who has a press has in hot or cold metal, and the best way to do that is to design &amp; set your copy in polymer with a relatively distinctive digital font. (Unless, of course, you're into cutting, punching and casting your own type.)</p>
      <p>This, it seems to me, would best convey your mandate/goal of "using an old process to make something new".</p>
