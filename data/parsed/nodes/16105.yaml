      <p>The thing is : in the past, I suggested letterpress to a couple clients, but they never seem to take it seriously (because of the cost / production time / etc.). I guess it doesn't fit their needs. And I don't blame them.</p>
      <p>In this case, I am the client and I am the designer. I could make a super nice and super detailed offset business card, to achieve the same result with the same concept. And it would perfectly fit my personality and make a good impression.</p>
      <p>But I have many options in front of me. And I can choose to go with letterpress, offset, screen-printing, etc. But using an old process to make something new out of it is really part of my design approach. It does represent me as a person and as a professional.</p>
      <p>Is it nostalgia ? Maybe.<br>
      Is it fetishism ? Probably.</p>
      <p>Why not professionalism ?</p>
