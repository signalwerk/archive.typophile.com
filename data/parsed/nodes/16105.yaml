      <p>I can't recall any at sign in metal that was appropriate. We always had to fit a small point size in the line, adjust the baseline, and with, preferably a semi-bold or bold face version to optimize it. Much, much easier with digital baseline and sizing adjustments (and a font-editing program if you need the weight) to make it look appropriate. I think Bringhurst has something to say about the proper fitting of the at sign. As I recall he is at odds with adjusting it to near the x-height. I think this is wrong. Don't have a copy near hand so can't verify his suggestion. Best at sign I have ever seen is the alternate in Journal.</p>
