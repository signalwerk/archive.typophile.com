      <p>Enough to have done my own business cards that way.<br>
      <a href="http://typophile.com/node/21340" title="http://typophile.com/node/21340">http://typophile.com/node/21340</a></p>
      <p>Letterpress still has real value (although not the sensationalistic way it's almost always used today). But actual typographic production in metal is finished: it only has an educational value now (although a huge one), and way too many arbitrary constraints, flaws and anachronisms (like the typical too-high "@").</p>
      <p>hhp</p>
