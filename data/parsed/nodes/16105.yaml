    html: <p>I've had remarkably good success making photopolymer plates from Boxcar Press (<a href="http://www.boxcarpress.com/" title="http://www.boxcarpress.com/">http://www.boxcarpress.com/</a>)  I bought the boxcar base, which is made from machined aluminum and gridded for alignment of the plates which come with a reusable adhesive backing.  The base is a bit of an investment, and I'd only recommend it if a) you are going to be doing more of this in the future or b) you need to do something larger than about 5 X 5 (just to retain flatness of the type surface)  The people at Boxcar Press are very helpful and have a section on their site which answers a lot of questions.  The ability to pair digital typography with letterpress printing opens so many interesting avenues.  Good luck</p>
