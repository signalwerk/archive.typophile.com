      <p>This is not to say that the digital fonts we have are a superset of the whole spectrum of metal type; there are certainly metal fonts (like Palatino*) which have yet to get comparable digital versions (and probably most never will); and the convenience of scaling digital type has become a weapon turned against its users due a general ignorance of the criticality of optical scaling; but that's outside the issue of the technologies. There are a great many superb digital fonts out there now, and we can always do a better job reviving the metal ones.</p>
      <p>* <a href="http://typophile.com/node/30833" title="http://typophile.com/node/30833">http://typophile.com/node/30833</a></p>
      <p>hhp</p>
