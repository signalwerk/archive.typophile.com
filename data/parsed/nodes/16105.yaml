      <p>&gt;Is it nostalgia? Yep.<br>
      &gt;Is it fetishism? Nope.</p>
      <p>Desires that are out of the 'run of the mill' must be budgeted for. Several years ago I came across a graphic designer here in New Zealand who was on a similar mission (their own design on their own business card), except that they really, really wanted gravure printing, rather than letterpress. Their reasons for this were all about the craft and quality, although at that time there were still viable letterpress options here. Finally they realised that because there were no longer any 'jobbing' gravure presses in New Zealand, they would have to get the job printed in Australia. Needless to say, this just blew the budget right out of the water...</p>
      <p>Ultimately they settled on a very ordinary offset job on some nice stock and left it at that.</p>
      <p>If you are looking for further romanticism about traditional letterpress there is <a href="http://www.typeculture.com/academic_resource/movies/" rel="nofollow">this lovely record</a> on Mark Jamra's TypeCulture site, which includes John Kristensens observation that 'letterpress will die...'</p>
      <p>But I would listen closely to what Hrant and Jason are telling you about digital photopolymer letterpress. It sounds like for what you want, it's the way to go, as long as your typesetting reflects the medium it's intended for.</p>
      <p>Usual setting for @ (whether offset or letterpress); as Hrant says, the @ should be a couple of points smaller than the surrounding text, and baseline shifted so that it optically centres between baseline and x height.</p>
