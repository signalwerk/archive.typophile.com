      <p>Since this is Design, I would first ask: is this fetishism<br>
      going to have a certain intended effect on the user?</p>
      <p>The "at" sign: older fonts tend to have it too high, and<br>
      usually too large* to work well for email. Certainly the<br>
      easiest solution is to use an "at" sign from a smaller size,<br>
      and lead it on top to lower/fit it. A more sophisticated way<br>
      is to go with photopolymer letterpress, which lets you print<br>
      virtually anything you can make on your computer (but it<br>
      costs a lot more).</p>
      <p>* And sometimes even slanted.</p>
      <p>hhp</p>
