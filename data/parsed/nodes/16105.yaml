      <p>There are shops where you take your digital file and they make this thin reliefed plate for you. You put this plate on a special backing (mine is a 12"x16" from Patmag) which raises the surface to type-high. The rest is the same as printing with movable type.</p>
      <p>&gt; I suppose that not every typeface (in small size) will give a good result.</p>
      <p>Indeed, when you use a digital font (anywhere, not just in letterpress) you either have to choose one with optical scaling for small sizes, or you have to do things like choose a demi weight, track it looser, etc. to get it decent. In metal fonts (except for the really bad ones) this was sort of done inherently.</p>
      <p>hhp</p>
