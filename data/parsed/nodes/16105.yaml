    <p>I have a fantasy of having my own business card made with metal letterpress on fine cotton paper. I don't know that much about hot metal typesetting. In fact, I had the idea yesterday and I began looking for more information today. I already found a printer that still owns a Linotype machine, but I haven't contacted him yet.</p>
    <p>The problem is : my business card will include an e-mail address...</p>
    <p>What will happen with the @ character ? This character has been around for many many years before we started using it in e-mail addresses. But was it part of the regular metal letter repertoire ?</p>
    <p>Ah ! The joy of mixing old and new technologies !</p>
