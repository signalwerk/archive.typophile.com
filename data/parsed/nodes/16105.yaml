      <p>You paint with a broad brush. </p>
      <p>It may be finished as a means of generating an illustrative greeting card line, or as a strictly commercial endeavor that kowtows to the whims of designers unable to accept the limitations of the process, however, it has a peerless place for a certain class of printing.</p>
      <p>There will always be those who respond to finer things, done well with attention to detail, using traditional methods, and those who don't recognize the difference.</p>
      <p>For example, one can go to The Bombay Company and buy a plastic and white metal "Tiffany" lamp. Despite what the sales person tells you, that doesn't mean it's actually "Tiffany" stained glass, thoughtfully designed and hand produced. By the same token, relief printing produced exclusively from plates ("platepress") isn't actually "letterpress". Yes clearly it's printing. Just not what it purports to be, or you believe it is. But for some, plastic and the illusion of something finer is satisfactory.</p>
      <p>With regard to alleged constraints, flaws and anachronisms: black and white photography must be dead too since digital needn't concern itself with pesky silver grain and light sensitive paper and chemicals and whatnot. It's all just so much trouble what with the skills and equipment required.</p>
      <p>Why learn to play the violin when you can make the same sounds with a synthysizer? No one will know the difference on playback. . .</p>
      <p>The "too high" @ sign is only an issue in the hands of the unskilled or unaware. I've not had that problem. Generally speaking: 2pt sizes smaller and shim with brass and copper thins to base align the "a". Simple.</p>
      <p>I scrolled down to your card. I'm happy you're happy with it. It's not my style.</p>
      <p>mjb</p>
