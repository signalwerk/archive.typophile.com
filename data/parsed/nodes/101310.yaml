  html: |-
    <p>I've just released a new free font called SONAR SCRIPT available for free download at  the Floodfonts website. If you want to see more in-use examples you are invited to visit the Behance project: <a href="http://bit.ly/103LIko" title="http://bit.ly/103LIko">http://bit.ly/103LIko</a></p>
    <p>SONAR SCRIPT is a modular, experimental typeface that plays with the idea to fold a line of text from a continuous strip of paper. In spite of its technical and contemporary appearance, the overall impression of the typeface is unusual and very characteristic! SONAR SCRIPT works really well to create grid-based, geometric layouts with large letters or to design logotypes.</p>
    <p>I was convinced and excited about the idea to develop a script font that does not rely on handwritten letters. Many design principles of written characters also apply when folding letters, for example the need of the writer to develop the word of one continuous stroke. And also the definition of the lettershape by the angle of the pen nib can be applied to the fold angle of the paper strip. Many problems were similar to standard font development but in some places unusual new solutions had to be found that give SONAR SCRIPT its distinct character.</p>
    <p>The free font is available at: <a href="http://www.floodfonts.com/freefont/sonar.html" title="http://www.floodfonts.com/freefont/sonar.html">http://www.floodfonts.com/freefont/sonar.html</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sonar_TypeSpecimen_480px_5163.png"></div><p></p>
