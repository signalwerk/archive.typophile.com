      <p>To what James Tocco wrote, I'd like to add this:</p>
      <p>Experience, training and common sense do more than trump statistical studies. They very often confirm statistical studies. As an apprentice compositor I was trained by blue-collar men and women who had never been in the same room with a statistical study of typography. Nor had they ever read any legibility/readability studies. They passed on two things to me: what they had learned from others like them, and what they had absorbed by working on book designs cooked up by masters of that craft. We talked about line length, leading, type size (nominal and visual), word space, and all the other factors noted above. I learned from them how to make simple layouts and set the type in metal. Many years later decided I could try to design books.</p>
      <p>In the interim I read some of those reading studies (with my eyelids propped open by toothpicks and good shot of No-Doze). Virtually everything I read in those books I had learned on the shop floor. &amp; had a lot more fun absorbing.</p>
      <p>powers</p>
