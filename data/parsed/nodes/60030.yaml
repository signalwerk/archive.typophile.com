      <p>David, I heard Bill Hill, recently of Microsoft, say at TypeCon a few years ago that the reason for the 2 1/2 alphabet maximum rule for single columns is that after that angle, the reader has to move his or her head, instead of just moving the eyes, and more easily loses place when dropping from line to line. </p>
      <p>It seems that's Hill's own theory, to me plausible, based on eye physiology. There have been also some studies done at Reading, on line length.</p>
