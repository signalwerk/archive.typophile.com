      <p>Just to chime in back on the line length thoughts...</p>
      <p>I've often thought that it makes sense to think of the fundamental measurement unit of type as THE SACCADE instead of fixed measurements like pica. The reason is that the saccade is the fundamental unit of READING.</p>
      <p>Academics have pretty much put to rest the debate about letterwise versus wordshape recognition, in favor of the composite "parallel processing" model. But, the saccade is still the primary unit of visual apprehension of type, regardless of how it is visually processed.</p>
      <p>Now, obviously, this isn't a precise measuring system in the sense that every reader's saccade is of different physical size, with more practiced and trained readers being able to acquire a larger saccade at higher speeds. But on the other hand, it is a very practical MINDSET since it: (1) orients the text designer to the service of reading rather than abstract &amp; formalist aesthetics, (2) demands visual logic and reader testing to rule type decisions instead of math, (3) accounts for differences in setting various languages due to word lengths, (4) differentiates among text categories (dense hard sciences texts filled with formulas &amp; numbers versus breezy magazine editorials) by bringing intended reading speed into the foreground of criteria.</p>
      <p>So to get back to the line length questions, perhaps we shouldn't really ever worry or care about character counts per line as rules-of-thumb, but instead think in terms of how many saccades per line are appropriate for the text and reading experience in question. It's a reductive system, yes, but also quite practical and fast in terms of gut reaction to a text setting. The number of saccades taken per line is always a round whole number (your eye can't jump a fraction of a saccade...it either does or doesn't).</p>
      <p>As a side note, I've often thought it would be an interesting experiment to design a typeface based on a standard workhorse that adds a small red dot just above the x-height on each line as "fixation points" for the intended saccades based on reading speed (kind of like a karaoke dot) for training / diagnostic testing purposes to the end of employing this kind of thinking among designers &amp; students....</p>
