    html: <p>Measuring comprehension is going to fall outside the time and money budgets of most design projects. And comprehension is dependent on many factors outside of design. No amount of typesetting address the limits of readers vocabularies, make readers familiar with niche material, or make bad writing comprehensible. I think that many of the people who are typesetting advanced science, medical, technical and financial material lack the years of study and experience needed to comprehend the text, but it still has to be set by someone who knows how to set type.</p>
