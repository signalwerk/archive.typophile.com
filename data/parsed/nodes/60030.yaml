      <p>At some level, I come back to the notion that if all these things could be quantified, we could come up with a computer program to specify them. While eliminating a need for graphic designers is an intriguing notion -- with it's own pleasure component -- I suspect we're not going to get there.</p>
      <p>On thing I have noticed: most texts will set better with some "number of characters" or equivalent value, and that value changes with the text. </p>
      <p>For example, when we used TeX for book composition and I was designing, it was easy to change the type size, measure, spaceband values, whatever, and run the whole book. TeX could be set up to write off to a separate file the number of lines that did not fit within the values affecting the horizontal space you'd selected (overfull hbox). Of course, this includes spaceband values as well as measure and type size.</p>
      <p>Grep "overfull" in that file, pipe it to another file, and the number of lines in that file would be the number of lines which would not set within the given parameters. The whole deal took less than five minutes; changing a parameter, running the book, grepping the overfull hboxes &amp; taking a look.</p>
      <p>Here is the interesting part: Within reason, the values that gave the best mechanical setting (fewest overfull hboxes) were usually the values that made the text the most comfortable to read. Nor was this always the smallest type/longest measure, given the obvious restriction that (1) you just wouldn't go larger or smaller than a certain type size, (or essentially the equivalent, longer/shorter than a certain measure), and (2) you shouldn't change the spaceband values much.</p>
      <p>With these restrictions, the technique amounts to tweaking rather than designing per se, but it was interesting how often it proved useful, and for me, showed that the text itself is a factor in choosing certain parameters.</p>
      <p>Sadly, AFAIK, you can't set up InDesign to give such a report; in effect, it always has "emergency stretch" turned on.</p>
