    <p>When teaching typography, I sometimes like to start presentations off with an interesting video.</p>
    <p>For example, a friend of mine just showed me the DVNO video.</p>
    <p>I am suggesting we all pitch in and help each other build a library of typography videos to excite young design students. Imagine a room full of 18-24 year old 1st-2nd year design students who don’t know a lot about type, and if they do, they probably think it’s dull.</p>
    <p>I’ve used</p>
    <p><a href="http://www.youtube.com/watch?v=9trOJFXRvVM" title="http://www.youtube.com/watch?v=9trOJFXRvVM">http://www.youtube.com/watch?v=9trOJFXRvVM</a></p>
    <p>A clip from Hero with the dying calligraphers</p>
    <p><a href="http://www.youtube.com/watch?v=qoIvd3zzu4Y" title="http://www.youtube.com/watch?v=qoIvd3zzu4Y">http://www.youtube.com/watch?v=qoIvd3zzu4Y</a></p>
    <p><a href="http://www.youtube.com/watch?v=61d_DiZ7MH4" title="http://www.youtube.com/watch?v=61d_DiZ7MH4">http://www.youtube.com/watch?v=61d_DiZ7MH4</a></p>
    <p>Thanks for your time.</p>
