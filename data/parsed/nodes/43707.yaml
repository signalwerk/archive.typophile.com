      <p>Is that Bookman Swash featured on a bag at 3:05? = Yes</p>
      <p>And it’s certainly not about typefaces, I’ll have to give it a few more views and do a little background but I’m pretty confident its referring to where we are regarding social and political contexts, the video footage on the screen behind them is most likely from a specific movement and I’d hazard a guess that his silent partner is a figure that is a clue to the context. She has to be important on a level other that musical artist given that she doesn’t sing.</p>
      <p>Initial reaction with no research makes me feel “where are we now?” is a general declaration of S’s Fd up and we haven’t made any progress, in fact quite the opposite.</p>
      <p>Thanks for the post. A great addition.</p>
