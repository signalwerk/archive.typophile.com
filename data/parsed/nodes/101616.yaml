    <p>Greetings!</p>
    <p>What typeface does <a class="freelinking external" href="http://www.pentagram.com" rel="nofollow">Pentagram</a> use for their identity? My initial guess was <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/modern-no-20/" rel="nofollow">Bitstream Modern No. 20</a>. But it doesn’t look like it.</p>
    <p>Below is an example of Pentagram logotype. Another example is the letterhead they use. See attached PDF at the end. Thanks!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/PentagramMarks_5263.jpg"></div><p></p>
