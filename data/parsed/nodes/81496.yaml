    <p>Hey guys, </p>
    <p>I've been a designer for many years but one of the hardest gigs I've come across has been an identity for myself that I don't push aside straight after making it.</p>
    <p>The logo I've been sitting on for a while now is something that I'm feeling reflects myself as a designer, individual and business. Its to be clear, simple and subtle. </p>
    <p>The reason why I've posted here is to address the most important attribute to the logo and myself as a designer, refined.</p>
    <p>I've butchered the mac version of Helvetica to come up with something you can identify but with quirk.</p>
    <p>The logo:<br>
    <img src="http://www.danjwilliams.com.au/images/logo.jpg" alt="Dan J Williams"></p>
    <p>...and here's a <a href="http://www.danjwilliams.com.au" rel="nofollow">link to the logo in context</a>.</p>
    <p>Please feel free to upgrade, embellish, chop, burn, praise, help as you see fit.</p>
    <p>Dan.</p>
