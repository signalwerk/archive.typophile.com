      <p>I think your logo does express clear, simple and subtle. I think the "J" feels a little like it is sitting out in the open by itself, as there is so much space between it and the "dan" and "williams", perhaps it is because there is no"." and because it feels so slim and elongated.<br>
      I would also explore the volume of space between the letters and no just be concerned about their distance from each other. I like the logo in context with the nice open sky on your site.</p>
