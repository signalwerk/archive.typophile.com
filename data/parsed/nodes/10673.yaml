  html: <p>I have a chance to participate in a radio program project for my G.D. School in a local kind of cultural radio station. <br> <br>We are looking for some topics and ideas for the program (we have a first chance to try and will continue depending on the quality and success) so I wondered if anyone has a sugestion. <br> <br>Our main problem as G.D. in the community is that our work is not valued, it is perciebed as an artistic ornament for products. <br> <br>Thanks <br></p>
