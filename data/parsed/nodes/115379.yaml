      <p>IIRC, reading-difﬁculty fonts have often been criticized at Typophile.</p>
      <p>Type design is a hand craft in which skill acquired through practice and experience is quite important.<br>
      Most of the fonts speciﬁcally designed to help those with reading difﬁculties have been made by novices.</p>
      <p>Boer is dyslexic. The Dyslexie typeface works for him, but he <em>is</em> intimately acquainted with it.<br>
      Perhaps everybody should design their own typeface, or at least make the effort to try out a variety of other’s and see which works best for them.</p>
      <p>It might not be immediately apparent.<br>
      For instance, if one switches to a new racquet or guitar, it takes a while to get up to speed.</p>
