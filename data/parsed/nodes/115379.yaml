      <blockquote><p>I think it's extremely unlikely that Dyslexie would work for all dyslexic people, especially since we have had dyslexic people commenting here that dyslexia has nothing to do with visual perception.</p></blockquote>
      <p>Not the perception, but the processing, right? I suppose Dyslexie could be an exaggeration of aspects which help process visual cues for the designer of the typeface at least.</p>
      <p>Anyway, the reason why I came back to this thread is because today in the train I had a random thought on dyslexia and I didn't see it as justified to start a new thread for this, particularly because I'm assuming we're all getting a bit tired of discussing dyslexia. We've said so much about it without achieving much progress other than the insight of how current accommodations of type for dyslexic people seem to be lacking in terms of practicality and solving the problem.</p>
      <p>During the train ride I watched the 'Type in a Digital Landscape' lecture by Bruno Maag (<a href="https://www.youtube.com/watch?v=BMr4aBdag3Q">https://www.youtube.com/watch?v=BMr4aBdag3Q</a>) and near the end he shows an illustration of the brain with different areas defined, and I noticed while the area for processing words is on the side near the back, behind it is the visual processing area, and in front of and above the word processing area is the area that gives access to meaning. Looking at this image, I started speculating about which area would perform abnormally/differently in people with dyslexia. I'm assuming it's in this "Visual word form area" in front of the visual inputs area.</p>
      <p>If that's indeed the area which performs in a deviating way, I wonder what effect language and scripts have on a person with dyslexia. Whether there is something going on with visual perception, word processing or attributing meaning, in all cases I would be curious if and to what extent certain languages and scripts have a different effect on the brain, and specifically a dyslexic brain. If there is a visual perception problem, would this person perform better with Arabic than with Dutch for example? If it's the word processing area to blame in regard to people with dyslexia, does the script have an influence? If not, then I doubt a specific typeface can make a dramatic difference beyond the attributes that work best for the average person.</p>
      <p>It also occurred to me I've never read about any scientific tests on dyslexia internationally. Is dyslexia more common in certain areas? Assuming they're distributed evenly and the occurrence of dyslexia is by chance, do people with dyslexia perform better in certain countries and if so, does it have to do with the culture, education or the language they speak and the writing they utilize?</p>
