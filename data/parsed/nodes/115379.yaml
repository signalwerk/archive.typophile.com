      <p>I don’t know if it’s just because dyslexia is “en vogue” lately or if there are systemic changes in how children learn to speak and read, but it seems that speech therapists are increasingly in demand  in Italy.<br>
      What I gather from the various threads on the subject on Typophile and elsewhere is that we really need better terms to define the issue, because “dyslexia” is a too wide umbrella to be used for what can be addressed from a type design point of view.<br>
      Also, I won’t call Italian spelling “simpler”, I would call it “more consistent” than English (we don’t need spelling bees), and I don’t know if that could have an effect on (some form of) dyslexia. German probably has an even more consistent spelling than Italian, so there should be even less dyslexics in German-speaking countries? How about French, and all those accents?<br>
      Still, I’m not sure how a spelling-related dyslexia could be addressed by type design.<br>
      Anyway, I would note that in Italy we also have our “heavily researched” dyslexia typeface, which is just about a blatant rip-off of Officina (<a href="http://twitter.com/typographica/status/483926989125218304">http://twitter.com/typographica/status/483926989125218304</a>).</p>
