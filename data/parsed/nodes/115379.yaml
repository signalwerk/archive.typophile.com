      <p>I have a peculiar form of dyslexia called dyscalculia. It involves numeral-number relationships instead of letters and words. I have great difficulty remembering numerical sequences or being able to tell what order the numerals are in. I have no problem with words or passwords that involve numerals interspersed with letters and symbols — it's just that numerical sequences don't fully register as corresponding to the numbers they represent.</p>
      <p>For example, telephone numbers aren't really numbers; they're sequences of random numerals, masquerading as numbers. Street numbers, on the other hand, are real numbers, so I have less trouble with them, but even then, I have difficulty associating, say, 8541 with the actual abstract number that those numerals represent.</p>
      <p>This has nothing to do with the shape of the numerals. I suspect much the same is true with letters and words in standard dyslexia.</p>
