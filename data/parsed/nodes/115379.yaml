      <p>"I'm assuming it's in this "Visual word form area" in front of the visual inputs area."</p>
      <p>That's not supported by the research, which suggests dyslexia is primarily about the sounds of words/letters, not their shapes. Which is probably why there haven't been any easy fixes via type design for dyslexia.</p>
      <p>It is also the case that the "dyslexia" label is used for any dysfunction in this same general area of reading, and this label may be used for multiple independent and unrelated (or at least distinct) problems. But again, the available research suggests that at least the most common form is related to phonology, not shapes.</p>
