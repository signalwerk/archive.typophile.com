    <p>In your experience, how does <a href="http://en.wikipedia.org/wiki/Dyslexia" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Dyslexia</a> impact the perception of a body of text, e.g. with regard to type, size, weight, spacing, and so forth?</p>
    <p>Looking around, for example <a href="http://www.dyslexia.com/library/information.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a> or <a href="http://www.adhd.com.au/Visual_Processing_Disorders.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>, it seems that it may be difficult for a dyslexic to separate weights of a typeface, or comfortably read certain types? For example, certain <a href="http://www.dyslexic.com/fonts" title="Click to visit an external URL." class="freelink freelink-external freelink-external">fonts</a> seem to be easier to perceive (e.g. Comic Sans, apparently) than others.</p>
