      <p>Thomas, Patty, Russelll,</p>
      <p>I know I can't prevent you or anyone from giving Joe what for except to make some points which either will or won't make sense to you. </p>
      <p>Some of this might sound like my trying to "<a href="http://www.phrases.org.uk/meanings/118200.html " rel="nofollow">teach your grandma to suck eggs"</a>. But isn't meant as condescension. Instead I am trying to see if I can (re)establish common/shared ideas about this.</p>
      <p>a) It's James' thread not Joe's and the more you ( or anyone ) pounds away at Joe the more it becomes about Joe albeit in a negative way.  To me this seems unfortunate. This was in part the reason I asked James to make his own thread - this thread. </p>
      <p>b) A very related point is that information which is too random/mixed becomes less valuable to the users of Typophile. Granted this isn't a Type heavy thread, (it's personal) but the point is applicable to Typophile threads in general. </p>
      <p>This why the guidelines say <cite> Don’t hijack other threads:<br>
      Don’t post irrelevant queries within another thread; create a new thread. You can post a new topic by scrolling to the bottom of one of the main forum pages and clicking on the “Post a new topic” link. </cite></p>
      <p>b) James himself* is an advocate of avoiding extending conflicts bad feelings on Typophile or elsewhere. One way of extending these bad feelings is to reply to negativity with ire even if you are fully justified. </p>
      <p>d) That Typophile is a bit too full of "pounding" is in part why James is taking a break.</p>
      <p>Typophile will be the kind of place we make collectively it. </p>
      <p>Agree or disagree but please make a new thread about it if you want to reply to me. It's valid to link to that new thread here.</p>
      <p>*He can correct me if I am putting false words in his mouth when he gets back, but I I think I am very probably on safe ground here.</p>
