  html: |-
    <p>I'm posting a new thread to prevent further disruption of the <a href="http://www.typophile.com/node/43312" rel="nofollow">thread on embeddable web fonts.</a> My posts on that one were disruptive and harsh, and I apologize to Typophile's members and moderators for that.</p>
    <p>My sincere apologies to Sii for subjecting him to prolonged scrutiny. I can see now that I overreacted. Let's forgive each other and put it all behind us.</p>
    <p>I will be taking a break from Typophile over the next four months. I've got so much work on my hands I can't spare the time, and it pays to be pragmatic when grappling with the slippery dynamics of online fora. Life can be very strange at times. I've had eight of my teeth extracted in the past six weeks. That's six weeks of swollen gums and throbbing pain as the gums heal. I'll have dentures fitted around about May. A musician friend of mine is dying from cancer right now and it's making me miserable. Life can be very strange.</p>
    <p>Before I depart, I want to thank the following people:</p>
    <p>* Tiffany for her good grace, marvellous judgement and big heart<br>
    * Eben for his practical outlook and solid moderating skills<br>
    * Stewf for his coolness and ongoing support of my type career<br>
    * Dan Reynolds for his very existence---you're a beautiful person Dan and I like you<br>
    * Nick Shinn, John Hudson, William and Hrant for their immense knowledge and experience<br>
    * Ricardo and Chris Lozos for their generosity and wonderful humour<br>
    * Linda and Patty for their great artistry and professionalism<br>
    * James Puckett for his dynamism and obvious potential<br>
    * Ben Mitchell and Jelmar for being great sponges and teaching me how better to teach type design<br>
    * Darrel, Haley, Zara, Yves, Russell, Tim Daley, Paul Hunt, Sharon, Richard Kegler, Joshua and every other regular here---you're all wonderful people whose hearts are in the right place<br>
    * Everybody else I've conversed with, whether we've agreed or disagreed, that's not the point. The point is it's all good. You are all good people who expand my mind and strengthen my heart<br>
    * Most of all to Joe for making it all possible.</p>
    <p>I'll leave you with the words to the chorus from the Stone Temple Pilots song Still Remains, written by Scott Weiland. It's very significant for me right now because I don't know how long the repaired arteries inside my head are going to last. I'm experiencing head pains every time I cough lately. That's a bad sign, and if one of 'em bursts I'll probably die. I'm not kidding, nor am I making it up to get sympathy. Life can be very strange.</p>
    <p><em>Pick a song and sing a yellow nectarine<br>
    Take a bath I'll drink the water that you leave<br>
    If you should die before me ask if you can bring a friend<br>
    Pick a flower hold your breath and drift away</em></p>
    <p>While I'm away, please keep in mind one thing: It's the spirit of the rules that counts, not the letter.</p>
    <p>j a m e s</p>
