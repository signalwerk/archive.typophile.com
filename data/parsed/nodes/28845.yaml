    html: |-
      <p>In the letter, Eric posted, Mr. Eul, Marketing Manager of D.Stempel, told the general management about the current situation of Grotesk fonts in Germany. He says there was a kind of very famous fashion wave(?) of "Swiss Typography" (Schweizer Typographie). This does not mean only the fonts but the "modern" designs, realized by Grotesk fonts.</p>
      <p>So he, Mr. Eul, wanted to find a name which the customers, the printers, associate with Switzerland, Swiss design. The general management thought "Helvetia" was is already used by Deutsche Bundesbahn (German Railway) for a special train. This "Helvetica" was the first one which connected Hamburg in the very north of Germany with Zurich (Switzerland) with only a few stops in between. </p>
      <p>So they decided to call the font "Helvetica". And got no trouble with the german government (railway).</p>
      <p>Georg</p>
      <p><a href="http://www.bleisetzer.de" title="www.bleisetzer.de">www.bleisetzer.de</a></p>
