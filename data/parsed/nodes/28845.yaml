      <p>This time, i have to correct more than one mistake:</p>
      <p>As Bleisetzer has already written. Miedinger is spelled thus, not Meidinger as on the website. And Helvetica is not the Latin name of the country, but Helvetia is. In fact, their car plates say CH, for Confederatio Helvetia. </p>
      <p>The name was, indeed, coined by Stempel in Frankfurt – by one of their salesmen, Herr Eul (i attach his original letter with the proposal). He suggested Helvetia (sic), but that name was deemed unusable. The new Haas Grotesk was designed in 1957, not 1937. After the war, Swiss designers favoured Akzidenz Grotesk from Berthold in Germany, so Haas needed to fight back. The foundry commissioned Max Miedinger, also a salesman, to design a new Akzidenz Grotesk, but more neutral. Bingo. </p>
      <p>20 years later, Günter Gerhard Lange at Berthold undertook the same job: he redesigned AG and called the result Akzidenz Grotesk Buch, which looks like Helvetica with some AG features like oblique terminals.<img src="/sites/default/files/old-images/helvetica_letter_3838.jpg"></p>
