      <p><em>Helvetius -a -um and Helveticus -a -um are the corresponding adjectives</em></p>
      <p>You're right, of course. I can distinguish a noun from an adjective in Latin (did 9 years at school), but this was an oversight. Which proves that one shouldn’t write such important documents at some unearthly time in the middle of the night. </p>
      <p>The fact remains that Helvetica is <em>not</em> the name of the country.</p>
