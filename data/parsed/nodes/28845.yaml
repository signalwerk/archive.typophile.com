      <p>The font shown and known as "Helvetica" was designed by Max Miedinger in 1937. The first production of the types was done 1957 by Haas'sche Giesserei in Switzerland and they called it "Haas-Grotesk".<br>
      They offered Haas-Grotesk mager (regular), halbfett (bold) and kursiv (italic). The link in the first posting does not show these informations.</p>
      <p>4 years later, in 1961, D.Stempel, Frankfurt am Main, Germany, bought Haas'sche Giesserei.</p>
      <p>And 1961, D.Stempel called this font "Helvetica".<br>
      And Stempel was it, who designed lots of other versions of Helvetica.<br>
      This font was the No. 1 of Grotesk fonts in Germany (West Germany) for more than 20 years. Much more successful as e.g. Folio-Grotesk from Bauersche Giesserei or Akzidenz-Grotesk from H. Berthold. Every german printer who wanted to have a good position in his local market, used Helvetica. Because it is very easy to combine Helvetica with other fonts, which are no Grotesk.</p>
      <p>If you are interested to see more of original Helvetica from Stempel, please visit:<br><a href="http://www.bleisetzer.de/index.php?target=shop/shop&amp;b=0004">http://www.bleisetzer.de/index.php?target=shop/shop&amp;b=0004</a></p>
      <p>May be that pre-press professionals from today think Helvetica is boring. But Helvetica did a very good job in the past.</p>
      <p>Georg</p>
      <p><img src="/sites/default/files/old-images/1_6230.jpg"><br>
      Helvetica light from 1965</p>
      <p><a class="link">Preußisches Bleisatz-Magazin</a></p>
