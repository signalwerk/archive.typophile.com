    date: 2006-10-19T02:11:00
    votes: null
    html: "<p>I never dreamt that I would ever be able to nitpick with Mr Spiekermann in even the most trivial detail, so this is a chance too good to miss: It's Helvetia but Confoederatio Helvetica (witness the official website of the Federal Swiss Authorities at <a href=\"http://www.admin.ch/ch/index.en.html\" title=\"http://www.admin.ch/ch/index.en.html\">http://www.admin.ch/ch/index.en.html</a>). Helvetia is the Latin word for Switzerland, Helvetius -a -um and Helveticus -a -um are the corresponding adjectives (both versions of the adjective are found in Caesar).</p>"
  - id: 163404
