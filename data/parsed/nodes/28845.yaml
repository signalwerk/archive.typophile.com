      <p>Yikes! I have a lot of respect for Ellen Lupton (the nominee), but I'm suprised at the mundanity of her choice in this instance. </p>
      <p><em>I kind of like the straight lined Helvetica</em></p>
      <p>This image reminds me of the old issue with Berthold's proprietary postscript fonts; back in the 80s, Berthold optimised their postscript library so their typefaces would only image smoothly on Berthold imagesetters – if you ran it out on a Linotronic it would look all 'crunchy' and straight-sided round the curves. </p>
      <p>I once saw this effect on a theatre poster and couldn't tell if it had been done intentionally or not... it did make the type look more interesting, in a postmodernist 'oh no! the technology's s**ffed it up again' kind of a way. </p>
      <p>Maybe that's what design awards are now here to celebrate?</p>
