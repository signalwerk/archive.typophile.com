      <p>Erik, thanks a lot for posting this letter, that's great! One day this letter will be a document as important to future typographic historians as the Le Bé Memorandum<br>
      ;)</p>
      <p>Was Helvetica modelled only on Akzidenz Grotesk, or did Miedinger use also the 'Breite Grotesk' by Schelter &amp; Giesecke as a model? Are there any proofs for this claim, or are these only based on similarity?</p>
      <p>Here's the first appearance of the Breite Grotesk by Schelter &amp; Giesecke<br>
      (the 'Magere' weight only) in<br>
      Typographische Mitteilungen, 3. Band 4. Heft 1890, p 673</p>
      <p>(In 'Handbuch der Schriftarten' you can read that the Breite Magere Grotesk dates from 1870, but this is clearly wrong)</p><div class="imageWrap"><img src="http://typophile.com/files/Schelter_4528.jpg"></div><p></p>
