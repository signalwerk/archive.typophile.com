      <p>My point about the vacuousness of brand advertising has been made by the discussion of Rooney, not Nike. The actual merit of the product, or even what it is, is irrelevant, and that is the case with Helvetica's fame. People who are barely familiar with typoography and couldn't tell Helvetica from Comic Sans, and who are unaware that the sample has rendered in straight lines, have an awareness of "Helvetica".</p>
      <p>Yesterday I heard the results of a focus group for a newspaper redesign, for which I am providing all-new fonts. Of the focus group, only one fellow mentioned the text type (so I must be doing ok!) -- "Yes, it's Courier," he said, "No," (quite categorically) "It's Times." I suspect he would have identified any sans serif as Helvetica.</p>
