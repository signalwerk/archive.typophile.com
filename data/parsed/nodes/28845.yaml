      <p>"Surely the part of the point of Helvetica was the characterlessness in that Modernist way of making machines for living, sitting, reading etc."</p>
      <p>People buy letterpress fonts in my online shop.<br>
      Mostly they are printers. All of them love the old letterpress stuff.<br>
      They spend their money buying fonts from Group VII - Antiqua Varianten and Group VIII - Schreibschriften (DIN 16 518). But very often they forget to buy fonts like Helvetica, Akzidenz-Grotesk, Folio-Grotesk. After a year or so they start to ask for e.g. Helvetica. Because they learned that they need it.</p>
      <p>You need fonts for the standard text. To make special fonts more important. If you only use special fonts, its confusing and does not look nice.</p>
      <p>Helvetica was a very good solution for all these standards.<br>
      This was a well working font. The glamour was given to others. But Helvetica did the job.</p>
      <p>Georg</p>
      <p><a href="http://www.bleisetzer.de" title="www.bleisetzer.de">www.bleisetzer.de</a></p>
