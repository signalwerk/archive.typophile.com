      <p><em>so the emphasis was not on any product.</em></p>
      <p>That is the story of consumer advertising for at least a hundred years.<br>
      The myth is more important than the reality.<br>
      Similarly, Helvetica's "neutrality" for typographers is no longer a purely formal quality (if it ever was), but operates at the level of myth, as explained here:</p>
      <p>Why do you use Helvetica ?<br>
      There are many reasons why we use Helvetica. Each is very different and sometimes seemingly contradictory, and they slowly but constantly change. Some of these reasons may be hard to follow, but we like to believe that it is exactly the complicated nature of our reasoning that, paradoxically, makes our designs so practical and clear.<br>
      One of these reasons involves Helvetica’s neutrality. Of course, we fully realize that no typeface is neutral, and that Helvetica’s objectivity is a myth. But it is exactly this myth that turned Helvetica into one of the most widely used typefaces in the first place. So it is fair to speak of a myth that created its own reality. In that sense, Helvetica’s neutrality resembles a self-fulfilling prophecy. This neutrality, real or imagined, enables us and the user to fully focus on the design as a whole, neutralizing the typographic layer as a way to keep the concept as clear and pure as possible. There are cases, however, where for specific reasons, the concept demands a less neutral typographic layer. In those cases we never hesitate to use other typefaces. But those cases are rare.</p>
      <p>-- Norman Dexel, from emigre 65 “Helvetica again”:</p>
