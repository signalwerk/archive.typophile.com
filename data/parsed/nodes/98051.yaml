      <p>I'm a new member here. I've just begun using FontForge for Mac (an old version from Softpedia) to refine a comic lettering font I created with templates from PaintFont.com, and I have a rather unusual issue.</p>
      <p>When I select "Generate Fonts…" from the File menu, I'm told that my font contains errors; most glyphs are missing points at extrema. When I review the errors in my glyph for the figure 2, FontForge tells me, "This glyph self-intersects. Checking for correct direction is meaningless until that is fixed." My glyph for lowercase <em>s</em> also self-intersects. I have the *.sfd files, if anyone wants to look at them.</p>
      <p>The green areas here seem to be giving me problems:<br>
      <a href="http://wat.midco.net/jvipond/images/FontForge_two.png" title="http://wat.midco.net/jvipond/images/FontForge_two.png">http://wat.midco.net/jvipond/images/FontForge_two.png</a></p>
