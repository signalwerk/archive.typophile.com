    html: |-
      <p>Steps to install fontforge, the short version:</p>
      <p>In Linux:<br>
      Install dependencies, configure, make, make install. Most distros have a package called "fontforge", anyway.</p>
      <p>In Mac:<br>
      Install Macports/Homebrew/Fink, use whatever the package manager to install a package called "fontforge".</p>
      <p>In Windows:<br>
      Download the fontforge-cygwin from somewhere, unzip and use.</p>
      <p>It's not all that hard to install fontforge. But working with it without experiencing crashes is a lot harder.</p>
    html_clean: |-
