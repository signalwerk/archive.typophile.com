      <div class="comment-spam-body"><p>@JimHV The green areas are horizontal hints. That shouldn't be the source of the problem, but I guess it's possible. I do see several clusters of points that are almost on top of eachother. They may be where the self-intersections are happening, but it's not visible at this level of magnification. That being said, unless you're going for an intentionally rough appearance (and you may be if that is what resembles your hand lettering) you just have way too many points around this "2". Try manually Merging some of the points or use the Simplify feature to reduce the number of points while maintaining the appearance of the same shape.</p>
      </div>
