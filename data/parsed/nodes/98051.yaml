    html: <p>References should be preserved when saving to SFD format. It's an editing format and carries all kinds of extraneous data that may not apply in various destination formats. If your OTF file has references, reading it into FontForge and saving it out to SFD should not strip them out (the reverse can be determined on a per-glyph basis). Can you provide a detailed description and test case of this phenomenon? Have you tried a more recent build of FontForge?</p>
