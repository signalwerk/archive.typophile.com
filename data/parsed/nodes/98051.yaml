      <p>The development effort for FontForge is now at <a href="/wiki/https%3A/%252Fgithub.com/fontforge/fontforge" class="freelinking" rel="nofollow">https://github.com/fontforge/fontforge</a> (has been for the better part of a year, actually).<br>
