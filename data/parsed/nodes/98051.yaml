      <p>If you save to ttf, you should keep your references (but lose your cubic splines). I don't know if there is an easy win win strategy. CFF fonts appear to rely on subroutine calls instead of references. Here is aacute in ArnoPro (obtained using ttx)</p>
      <pre>       &lt;CharString name="aacute"&gt;
                271 callgsubr
                206 -20 -83 callsubr
                -25 418 -29 callsubr
             &lt;/CharString&gt;
      </pre>
