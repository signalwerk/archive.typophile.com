    html: |-
      <p>A while ago I hacked together some code and scripts to convert VGA screen fonts to SFD files – kludgy, embarrassing stuff with oodles of references. Hennyway, I would then use FF to dump them to TTF, either straightaway or post-processed by fiddling the font order, unlinking references, removing overlap and then dumping to TTF.</p>
      <p>Later I tried saving straight to OTF and... HEY! It was supposed to be the other way around! *groan* All I did (in FFscript) was Open() and Generate() – and the references are gone! earlier than I thought. How mortifying...</p>
