    html: |-
      <p>'Grande' is refering to the gigantic character set it comes with. Its basically covers all of unicode. Cyrillic, Turkish, CE ete. I think it ways specially hinted too. But still no OSF or small caps though. </p>
      <p>Out of all the interface sans available- Lucida is good for both print and on screen. Whereas Verdana/Tahoma are readable on screen but horriable in print... and in my opinion look like inspired by Lucida.</p>
      <p>Mikey</p>
