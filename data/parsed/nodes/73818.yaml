    date_raw: 21 Nov 2010 — 11:12am
    votes: null
    html: '<p>In brief: First, click the button "Create font data", this is the topmost button on the right side of the window. Then, click the button "Edit font data", right below it. This will show a Font Viewer. Then double-click on any glyph in the glyph overview. This will show the Glyph Editor. (Mind that you will be editing Ikarus outlines which behave differently than Bezier outlines.)</p>'
