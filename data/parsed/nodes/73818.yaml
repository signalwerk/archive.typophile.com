    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/LeMo_transform_1_6740.jpg"></div><br>
      &nbsp;<br>
      Bonus: because the parameters can be applied on ‘skeleton’ lines, this works on outlines also. So, existing fonts can be converted to IK format and modified in LeMo using the sliders –for instance to make some proofs for other weights.<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/LeMo_transform_2_4243.jpg"></div><br>
      &nbsp;<br>
      Of course, one gets also to a certain extend distortions for free and the overlaps have to be removed afterwards (for instance in the LeMo glyph editor).<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/LeMo_transform_1a_4368.jpg"></div><br>
      &nbsp;<br>
      For the examples the regular weight of DTL Haarlemmer was used.<br>
      &nbsp;<br>
      FEB<p></p>
