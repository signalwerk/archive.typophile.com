    votes: null
    html: |-
      <p>Well, I frequently look at the words involved, and if there really isn't any reason to use cap &amp; small cap structure for clarity, I can sometimes use the fact that a line of small caps looks a bit like a rule. You can use them to echo certain kinds of rules that might be used in a chapter opening or subhead. </p>
      <p>Not as an echo of a  solid black hairline rule, but certainly a thicker, gray rule, or a "rule" made up of small vertical lines, one default of "rules" in InDesign.</p>
      <p>In other words, once any need or cap &amp; small cap is eliminated for clarity (&amp; usually it can be), the graphic qualities of small (or full) caps can be exploited.</p>
      <p>FWIW</p>
