    html: |-
      <blockquote><p>do you make those normal sized capitol letters in line the small caps, or just all <strong>lowercase</strong> small caps?</p></blockquote>
      <p>Not sure I understand the question -- the reference to "leading line." Do you mean the first line following, say, some kind of space break, where the style is to set the first few words (or an entire line) in small caps?</p>
      <p>If so, my informal survey is most designers just use small caps. But there is no hard and fast rule, and editors are a little more wont to insist on a full cap for that initial character (i.e., a cap-small cap style). </p>
      <p>Think of it this way: There really aren't any "lowercase" small caps. You could set those words in full caps -- sometimes done, but less commonly seen. It is all a design decision, and as such, is sometimes overridden by editorial convictions.</p>
      <p>If the decision is yours and you strongly believe a reader will be negatively affected by one choice, you pick the other. But it is amazing the number of arguments proffered about what will negatively affect a reader, most of them turning out to be wrong.</p>
