    html: <p>If you get BitFonter, you'll be able to make photofonts with full colors, which will work in a few applications that are supported through FontLab's plugins (Adobe CS apps), *and* you'll be able to easily export an outline version to the VFB format, and then open it in Fontographer and turn it into an outline-based OpenType font which will be monochrome but will work in all systems and applications.</p>
    html_clean: <p>If you get BitFonter, you'll be able to make photofonts with full colors, which will work in a few applications that are supported through FontLab's plugins (Adobe CS apps), *and* you'll be able to easily export an outline version to the VFB format, and then open it in Fontographer and turn it into an outline-based OpenType font which will be monochrome but will work in all systems and applications.</p>
