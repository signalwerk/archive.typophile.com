    html: |-
      <p>Bert, </p>
      <p>a small clarification: PostScript 3 is well-alive, it's the most recent (and quite likely, final) incarnation of the PostScript language. What you're referring to were the PostScript Type 3 fonts. They never actually really worked. Glyphs in Type 3 fonts could be constructed using any operators of the PostScript language -- so you could mix strokes, fills, patterns, colors, bitmaps etc. However, for this to work, one needed a full PostScript interpreter. </p>
      <p>Except in NeXT (and some high-end Unix implementations), no major operating system implemented Display PostScript. So for example in Mac OS, the Type 3 fonts worked so that on screen, you only saw a crude bitmap preview supplied in the NFNT resources in the font suitcase, and only if you printed the job, the actual result appeared on the PostScript printer. If your printer did not have a PostScript interpreter, your results could vary as well. So there was no real guarantee that you'd get want you wanted. You could not even see what you were getting (WYSIWYG). </p>
      <p>The PostScript Type 1 format (and its successor, CFF, which is part of the OpenType PS .otf format) only uses a very limited subset of the operators, which allows in to work in a variety of environments. Adobe Type Manager (ATM) was one software that could produce rasterized images on screen out of the real outline Type 1 fonts. But ATM, even though it was Adobe's, could not render Type 3 fonts properly — because it would then had to include a complete PostScript interpreter. </p>
      <p>Of course, later operating systems incorporated the Type 1 format natively, while they dropped the ability to install Type 3 fonts simply because, as I said, they never _really_ worked. </p>
      <p>Actually, SVG Fonts are made very similarly to the Type 3 fonts. Their glyphs can be either "simple" (and then only use a small subset of outline drawing commands, comparable to Type 1), or "complex" (and then they use the full repertoire of SVG drawing commands, which is comparable to Type 3: you can do strokes, colors, bitmaps, fills, gradients, transparency etc.). </p>
      <p>However, it seems that most web browsers only support the "simple" variant of SVG Fonts, and fail to render the "complex" variant. (And of course, SVG Fonts do not work outside of web browsers, although theoretically they could). </p>
      <p>So same history again :)</p>
      <p>Best,<br>
      Adam</p>
