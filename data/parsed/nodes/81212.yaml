  html: |-
    <p>I am attempting to build a unique font on Fontographer 5 out of a serious of scanned images of letters cut out of newspapers (think ransom note style), but it doesn't appear to be possible, the best I can see is importing the images as .eps files then tracing them with the program's pen tool.</p>
    <p>Does anyone know if this can be done?</p>
    <p>Also, if it can be done, does anyone know a way I can upload several different variations of each letter to appear randomly, so as to prevent them repeating in copy?</p>
    <p>Any help would be much appreciated!</p>
