    html: |-
      <p>Richard, you are the ‘victim’ of evolving technology where some of the original features have been lost. In the PostScript 3 format it was absolutely possible what you want, but PS3 is obsolete, eg not working in the modern operating systems. Too bad… </p>
      <p>The BitFonter option proposed bu Adam Twardoch is your best chance to get what you want…</p>
