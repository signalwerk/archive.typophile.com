      <p>&gt; I’ve always liked the swash J, K, N, T and Y of the Italic.</p>
      <p>But they're like a group of misfits in high school. The errant distribution of swashes in the original Baskerville italic seems to have been a result of a rush job; as in "I spent seven years on the Roman, I'll be damned if I do that again!" It's an example of a failure in moving from calligraphy to type. And every revival so far has either copied his bad decisions, or simply dumped all the swashes.</p>
      <p>BTW, the ATF Baskerville (which is actually the Fry version, especially at sizes above 12) had the best collection of alternates.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ATF_swash_4387.gif"></div><p></p>
      <p>hhp</p>
