      <p>I've always liked the swash J, K, N, T and Y of the Italic.<br>
      In hot metal, they were available as standard from Monotype, I believe, and as alternates from Linotype, but dropped by most phototype and digital manufacturers.</p>
      <p>Goudy used the same idea in some of his italics, and so have I.</p>
