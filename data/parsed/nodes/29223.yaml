      <p>AFAIK the Pardoe is the "standard", and another good reference is:<br>
      "John Baskerville, type-founder and printer", Josiah H. Benton, 1944 (also 1968).</p>
      <p>&gt; Who or What were John Baserville’s Influence’s</p>
      <p>In terms of letterforms: his own calligraphy, and letters engraved in metal and stone. But his contribution was "total", in that paper and ink were central to his effort, and in this broader aspect it seems that his japanning* business (where he made all the money that he would later spend on typography) had a distinct "ideological" influence.</p>
      <p>* <a href="http://www.answers.com/japanning&amp;r=67" title="http://www.answers.com/japanning&amp;r=67">http://www.answers.com/japanning&amp;r=67</a></p>
      <p>One could also suspect that the Romain du Roi had an influence on him. But more interesting is to consider who was influenced by <cite>him</cite>, especially on the continent, where he was better esteemed than on his own island.</p>
      <p>&gt; Any examples of Corparate Use’s of his modernised fonts</p>
      <p>Tons. Habitat* uses the Fry's version for its logo. Christopher Perfect's "The Complete Typographer: A Manual For Designing With Type" has good -if now somewhat dated- examples of usage.</p>
      <p>* http://en.wikipedia.org/wiki/Habitat_(retailer)</p>
      <p>--</p>
      <p>Here's an image of his original character set, from Pardoe:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/PardoeBask17_4245.gif"></div><br>
      But it's not an exceptionally good sample.<br>
      (And you can see where Licko got her "R"...)<br>
      -<br>
      The best samples are probably in Paul Bennett's "Books and printing; a treasury for typophiles". There's also a very good enlargement in an old article by Philip Gaskell in the APHA Journal. Unless of course you can get your hands on an original. :-)  BTW, somewhat easier in this respect is getting one's hands on a volume of Beaumarchais's printing of Voltaire's complete works using his original type (if not his original paper/ink technologies).<br>
      -<br>
      hhp<p></p>
