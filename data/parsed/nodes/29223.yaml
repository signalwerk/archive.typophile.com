      <p>Those ATF swashes are, well, swashy, and a bit too slick. They belong more to Caslon than Baskerville. The great thing about JB's "swash" caps is that they don't stand out too much.</p>
      <p><em>But they’re like a group of misfits in high school.</em></p>
      <p>You could say the same about the typical roman lower case. "g" must have spent a lot of time in the principal's office.</p>
      <p>IMO, JB was considering the contrast between the angularity of the italic caps and round lower case forms, and wanted to lessen the contrast between them, so introduced a few softer characters.</p>
