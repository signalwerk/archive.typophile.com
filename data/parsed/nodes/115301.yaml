    html: <p>The "cracks" are different on repeating letters (e.g. /a /o etc) so most probably they are not part of the font. It actually looks like a <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=ITC&amp;ffam=Franklin%20Gothic%20Demi%20Cond%20-%20Regular&amp;fid=364d488301b62c1e63c04c545eb32315&amp;fsize=60&amp;text=ScaRed%20of%20ChAka%20masoniC%20yoUth&amp;wrap=2" rel="nofollow">ITC Franklin Gothic DemiBold Condensed</a></strong> + the cracks and rotation.</p>
