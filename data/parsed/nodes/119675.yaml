  html: |-
    <p>I have a strange problem with one of my fonts - descenders are clipping on Win / Publisher 2013 &amp; Wordpad at least. I can't duplicate the problem by myself on any of my programs on Mac.<br>
    I've had some clipping issues sometimes before with fonts exceeding the UPM but now the strange thing is that the font gets clipped directly under baseline?!</p>
    <p>Any idea what's this about?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/unnamed_6576.png"></div><p></p>
