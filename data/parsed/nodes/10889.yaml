    html: <p> Congratulations with your release! <br> <br>To my knowledge, this is the very first font in  <br>these forums that has gone from critique to  <br>actual market. (If there are others, they haven't  <br>let us know.) <br> <br>I like this, however it performs much better  <br>in limited quantities (e.g. for navigation or  <br>headers) versus the way you show it on your  <br>site as body text. <br> <br>You may have success including a  <br>sample on your site  at  2x or even 3x scale. I  <br>know Matthew Bardram has had success with  <br>his bitmap fonts selling as display faces for  <br>print. <br> <br>Good luck with it. </p>
