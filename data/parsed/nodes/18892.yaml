      <p>I wrote this back in 2003:</p>
      <p><strong>An open letter to Apple Computer</strong></p>
      <p>I feel for you, Apple. I imagine your products wouldn’t be so prohibitively expensive if you didn’t slip up and get slammed every few years by Apple Records, a company whose business used to be producing Beatles albums, but is now chiefly in the business of leeching your profits with litigation every time you do something even remotely related to music. I think it’s unfair.</p>
      <p>So I have a perfect solution for you. <em>Change the name of your company</em> and then you’ll be able to do whatever you want. To some, this would seem like a rash thing to have to do when one has been in business for a long time… but I don’t think that’s a problem in this case. Just going out on a limb here, but try this on for size: Macintosh Computers. Not only is it a trademark you already own, but it’s a brand that’s been on <em>practically every one of your products for the past twenty years.</em> I think the transition would be pretty smooth, don’t you?</p>
