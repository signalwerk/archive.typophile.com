      <p>Call me old-fashioned, but people ought to keep their agreements. </p>
      <p>Apple Computer wanted the hip and joyful image of the Beatles to rub off on them, and paid for it, with the explicit caveat that they wouldn’t use it in the music business. </p>
      <p>Ironically, that deal turned out to be a major source of income for the Beatles. But then the Beatles were ripped off by their own business partners back in the day. Now, so many years later Apple Computer is in the music business. There isn’t a lot of logic in it, but a contract is a contract. If they want to change it they should re-negotiate it.</p>
