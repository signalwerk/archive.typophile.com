      <p>What is weird to me is that the Beatles “Apple Corp” nolonger functions as a recording label, they just manage the business of royalties on old music from the Beatles era.  Apple Computer is not cutting into their slice of the pie or taking their customers or giving the impression that they represent the Beatles estate. It makes me wonder if this is a PR move to keep the old record label name alive. Today’s young record buying clientele may not even know about Apple Records without the law suit pushing it into the news.</p>
