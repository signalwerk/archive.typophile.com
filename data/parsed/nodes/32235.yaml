      <p>Word spacing varies with font, even within families. There are no absolute rules in the digital era. You may start with something around 250 units but the idea is to create a spce wich will make the word break clear enough without making the line fall apart. Word spacing tends to agree with letterspacing mostly. If the letterspacing is tight, the the word spacing is proportionally tight as well. Like much else about type design, the eye is the master tool.</p>
      <p>ChrisL</p>
