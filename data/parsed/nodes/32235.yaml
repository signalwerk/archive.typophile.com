      <p>Nick, I don't agree. I don't feel you set up a font to it's disadvantage only to cover one possibility. As for tabular setting, you can always use the italic or bold commands around the numbers only, without the spaces. That would preserve the spacing (usually roman) throughout the table. While I can't think of situations where this wouldn't work, you can always just use another tab stop in the table if push comes to shove.</p>
      <p>The other side of the coin is that you often have italic text run in with the roman. Why have unfortunate spacing here? And you can't change, say, the spacing for just the italic in an application program such as InDesign, since that spacing (min-ideal-"max") works on the entire paragraph, right?</p>
