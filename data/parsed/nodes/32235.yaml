    html: |-
      <p>An average, across a wide range of typefaces, is about 1/4 em. Very very few typefaces have a space as big as a third of an em. This is true even in hot metal typefaces (Lino/Mono).</p>
      <p>Heavier weights typically have thinner spaces (not wider, and not the same).</p>
      <p>Of course, some type designers today may have varying ideas, but this is what many great type designers have done over the last century or more.</p>
      <p>Cheers,</p>
      <p>T</p>
