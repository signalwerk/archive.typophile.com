    html: |-
      <p>RachelR</p>
      <p>Frederic Goudy suggested the width of a lowercase i. That would be the visual width, not as, with metal type, the width of the body. Of course, if you've ever looked at Goudy's typesetting you can see how this is simply wrong. Nevertheless, I always recommend it as a starting point to my letterpress students. Keeps them on the right track. It's easy to see when the width is too narrow, not so if it is too wide.</p>
      <p>Gerald</p>
