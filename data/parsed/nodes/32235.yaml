    html: |-
      <p>Having the space as a character is a relatively new phenomenon. To me, the space character should be established so that ragged composition (i.e., no justification) looks right. The space may well need to be different for roman and italic, depending on the letterforms themselves, and their sidebearings.</p>
      <p>As a for-instance, I just made an OpenType version of Bembo from a Type 1 PostScript font. Among the many changes, I changed the space in the roman font from 258 units (1,000 unit em) to 220 units, and the italic from 250 to 200. The reason it wasn't done earlier was simply that our old composition system did not take the space from the font. A bold font would likely need more space, at least, when used at the same size as the text, in text setting.</p>
      <p>Further, the wordspace (however derived) usually needs to be relatively smaller as you increase the size of the type. Obviously, you can't make this provision as a type designer, but must rely on the compositor who uses your type.</p>
    html_clean: |-
