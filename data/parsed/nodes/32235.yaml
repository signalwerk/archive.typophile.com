    html: |-
      <p><cite>Historically. The space character is one third of the Em or one half of the En.</cite></p>
      <p>As long as your history covers about 1880 to about 1940.</p>
      <p>When you hand-set type (1450+ to whenever), you start with the smallest space you are willing to use. To justify the line, you add space. Life is tough enough without starting with a larger space &amp; having to take it out.</p>
      <p>The machines came in right about the time when wide wordspacing was in fashion, which is where you get the "thick" (3-to-em). And by-the-way, Linotype linecasters weren't on an em system, you had a choice of "spacebands" you could use. The "thin spaceband" went from about 2 points unexpanded, to about 5-6 points fully expanded. A good Linotype compositor could tell how much a space would be added to a line, &amp; would hyphenate a word so the spaceband wedge wasn't fully used.</p>
      <p>As to your rivers: Maybe. If you are using words all the same length - 3- 4- 5- letters long, you're going to get more rivers. If you are using a text that could occur naturally, you'll get a better feel for how the space is working.</p>
      <p>One more thing about "history." In the 19th century, many fonts tended to have a wider set than the current fashion, so perforce the space needed to be bigger. You will also get a different feel to the space depending on your leading and margins. One thing far too few book designers seem to realize is that there is a relationship between word space, leading, and margins (which of course, implies measure, given standard paper sheets).</p>
      <p>Obviously, the type designer cannot provide a correct space for all settings. But if it is a text font, you could not ignore text, that is, 8- to 12-point settings.</p>
      <p>Life gets much more difficult for a display font, because things that will affect the wordspace include size, but even the number of words in the line. For example, if you are setting subheads in small caps, the amount you letterspace will be a factor of how many words are in the head. Try it. Set "the next one" in small caps &amp; get it right. Now try that letterspacing &amp; wordspacing for "machinery gone amuck in the twentieth-century industrial plant" I guarantee you, those values will no longer look right.</p>
    html_clean: |-
