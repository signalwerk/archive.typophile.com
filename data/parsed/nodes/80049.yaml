    <p>Hey everyone,</p>
    <p>I need to find a font -- preferably something from the Adobe OpenType Library -- that is as close as possible a substitute for H&amp;FJ's "Whitney".  (That is a wonderful font, but too expensive for me to purchase at the moment, and it's for a client's job which, naturally, they need yesterday...)</p>
    <p>I thought that Frutiger was pretty close, but I thought I'd pick the brains of our resident sages first.  :)</p>
    <p>Any help is most greatly appreciated.</p>
    <p>Cheers,<br>
    John the Fontaholic</p>
