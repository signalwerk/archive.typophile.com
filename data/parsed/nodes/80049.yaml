      <p>Frutiger is certainly a good choice. On their website, they say "While American “gothics” such as News Gothic (1908) have long been a mainstay of editorial settings, and European “humanists” such as Frutiger (1975) have excelled in signage applications, Whitney bridges this divide in a single design."</p>
      <p>So News Gothic might not be a bad choice, either, but I think there's more Frutiger in Whitney than there is News Gothic. </p>
      <p>What about Charlotte Sans?</p>
      <p><a href="http://new.myfonts.com/fonts/letraset/charlotte-sans">http://new.myfonts.com/fonts/letraset/charlotte-sans</a></p>
      <p>Those are the only things I can think of that would most likely be cheaper than Whitney.</p>
