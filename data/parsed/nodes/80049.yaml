    html: |-
      <p>In Frutiger: Typefaces, The Complete Works, Frutiger says that the cursive forms were drawn by others, over his objection, for Frutiger Next, and he thinks they out of character with the typeface. In fact he writes that he was worried about Frutiger Next hurting his reputation. </p>
      <p>Neue Frutiger, done after the book was completed, is evidently his effort, with the assistance of Akira Kobayashi, to do it right. This corrects the adjustments in characters he had to make for first Linotype versions, which had a limited number of widths. Neue Frutiger has obliques, true to his own vision.</p>
    html_clean: |-
