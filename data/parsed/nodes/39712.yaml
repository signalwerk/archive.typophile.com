    html: |-
      <p>I like it.  Keep working on it.  You are right, the S and s need to be thrown out and you need to start over. I would take the uppercase C, flip the bottom half, and use an upward (left to right) sloping diagonal at the same angle as the other letters. </p>
      <p>I particularly like the synergy between the diagonals in the 'yp,' 'yin,' and 'gin' letter combinations.  Keep that.</p>
      <p>The P and B don't have to match.  They both look fine. </p>
      <p>It would be helpful to see upper and lower case at the same point size.</p>
      <p>I'd say design the numbers and punctuation next, and then kern it.</p>
