    <p>OK, pervasive terror now almost fully confined, I submit for the first time a typeface for critique. While I already know what some are likely to be, stating the following may reduce the number of obvious views:</p>
    <p>1.) This font will not be given or sold.<br>
    2.) It is quite uneven - the capitals don't even match in style or size and many of the curves in all the letters are slightly different<br>
    3.) Both cases of the letter "S" are absolutely disgraceful. Ignore if possible.</p>
    <p>What I'm hoping to obtain here is not an ordinary "change this" or "try that." Instead, I am first merely wanting to know if I should permanently give up trying to design a typeface; second, if there are any particular aspects/letters off which I should build (i.e., the uc "P" is different from the "B," so perhaps which looks better); third, if I've unwittingly designed something almost identical to some other typeface out there and; fourth, if I am missing something about typography as whole that screams from this font.</p>
    <p>Thanks for any input, it all will be quite valued.</p>
