    html: <p>I personally don't think it's bad. In my (very amateur) opinion, it's probably more of a display face than something you would use for body text, but the angles on letters like 'b' and 'u' make for an interesting effect. One suggestion I have is that it might look a little more uniform if (for example) you used the same general kinds of angles for 'c' and 'o' as you do for some of the other letters. I think I'll leave further critique for those with more experience and a larger typographic vocabulary.</p>
