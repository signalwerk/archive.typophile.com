      <p>Hi Ash, welcome to Typophile. </p>
      <p>My first thought is to wonder whether it's appropriate to have "Films" in the name and to show an image of film, since film is on the way out and you're shooting video. </p>
      <p>Regarding the logo itself, it's unconventional and amateurish (sorry), but there's something about it that makes me smile; a sense of joy and maybe whimsy. I'm not sure if that's good or not; a lot would depend on how you're marketing yourself. If you want to look a bit unconventional and different and are doing mostly smaller projects, maybe an unconventional logo would work fine. But if you're trying to get corporate work, you might want something more conventional and professional.</p>
      <p>If you want to keep the same general look that you're showing, I'd try using solid areas of color (or color gradients) rather than doing everything in outline, and I'd have a graphic designer redraw it to clean it up. I'd probably try to make the woman in the center the focal point, by perhaps making her a tad larger and making the highest part of the film strip in the center rather than on the left. I'd also make the title larger; maybe one word above the image and one below. Regarding the font, I'll let others who are more expert in that area make suggestions. </p>
      <p>By the way, there's nothing about it that makes me think "African American". I only mention that because you mentioned it in your post, and I'm not sure if you want your logo to communicate that.</p>
