      <p>&gt; We don't have to keep the same look because<br>
      &gt; I Feel like we are still working on our brand! </p>
      <p>Okay, and in fact most companies change or update their logos periodically.</p>
      <p>Maybe some folks here will have suggestions for new logo directions, but my suggestion would be to team up with a good graphic designer who can meet with you, learn about your business, your future goals, your competition, and then he/she can develop a new logo for you. If money is tight maybe you could do a trade and swap some video work for developing a new logo. </p>
      <p>I see you're in the Tampa area and I'm sure there are numerous good designers in that area. (You could also work with an out-of-town designer via phone and email, but I've always felt I could size up people better when I meet them in person.) Look at their portfolios (especially logos), talk to them, get names of some recent clients you can contact for references, get a written estimate, etc.</p>
