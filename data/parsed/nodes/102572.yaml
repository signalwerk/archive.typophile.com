    <p>Hello Everyone! </p>
    <p>Name's Ash. A couple of friends and I have been working together for the past 2 years and so far have been using this logo. We wanted some professional input and would really appreciate your constructive criticism. This logo came about when one of my friends younger cousin drew up a sketched logo and we inked it in photoshop. From looking at the other logo critiques on this forum I can tell your feedback can be very beneficial. </p>
    <p>Background about the group:<br>
    Three 23 year old African American women who met at the University of Florida while majoring in Mass Communications. </p>
    <p>Types of Videos we do:<br>
    Advertisements, Weddings, Short Films, Events, Documentaries. We love it all. Most of our videos so far have been targeted towards the African American Community. </p>
    <p>Let me know if you need anymore info!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Emarjaylogotransparent_6167.png"></div><p></p>
