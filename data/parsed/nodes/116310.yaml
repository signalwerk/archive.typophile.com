      <p>To me, the 2 best styles are Helvetica Neue Light and Helvetica Neue Bold which I believe are also considered by many as the most iconic and well designed styles of Helvetica Neue.<br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/helvetica-neue" rel="nofollow">Adobe version</a> is cheaper too. You could also have a look to Helvetica clones: URW++ <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/nimbus-sans" rel="nofollow">Nimbus Sans</a>, Paratype <a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/pragmatica" rel="nofollow">Pragmatica</a>, Scangraphic <a class="freelinking external" href="http://www.myfonts.com/fonts/efscangraphic/europa-grotesk-no-2-sh" rel="nofollow">Europa Grotesk</a>, Bitstream <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/swiss-721" rel="nofollow">Swiss 721</a><br>
      And finally, if you couldn't afford any of them, you could fall to the lure of the Dark Side of the Force and go with Arial (Bold or Black) which comes free with Windows, mainly reworking terminals and making them horizontal.</p>
