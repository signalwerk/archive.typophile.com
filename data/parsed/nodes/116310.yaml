    html: '<p>CHAMPIRO UHP1: it mixes influences of <a class="freelinking external" href="http://www.myfonts.com/search/handel+gothic" rel="nofollow">Handel Gothic</a> (Bitstream version) and <a class="freelinking external" href="http://www.myfonts.com/search/eurostile" rel="nofollow">Eurostile</a> Extended/<a class="freelinking external" href="http://www.myfonts.com/search/microgramma" rel="nofollow">Microgramma</a>; the main difference with Hande Gothic is the large flat head /A (which could easily be reconstructed); also pretty convinced it could be decently approximate with some techy freebie; try having a look to <a class="freelinking external" href="http://www.dafont.com/theme.php?cat=303" rel="nofollow">Techno &gt; Sci-fi</a>, <a class="freelinking external" href="http://www.dafont.com/theme.php?cat=304" rel="nofollow">Techno &gt; Various</a> and <a class="freelinking external" href="http://www.dafont.com/theme.php?cat=501" rel="nofollow">Basic &gt; Sans serif</a> DaFont sections; some alternatives I came across: <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/snasm" rel="nofollow">Snasm</a>, <a class="freelinking external" href="http://www.houseind.com/fonts/simian" rel="nofollow">Simian</a> Chimpanzee, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/venus-rising" rel="nofollow">Venus Rising</a>,  <a class="freelinking external" href="http://www.dafont.com/astera.font" rel="nofollow">Astera</a>, <a class="freelinking external" href="http://www.dafont.com/xolonium.font" rel="nofollow">Xolonium</a>, <a class="freelinking external" href="http://www.dafont.com/vandiana-platin.font" rel="nofollow">Vandiana</a>...</p>'
