    html: <p>I tend to agree with Nick in the first post. While the aim of Monotype seems to be laudable, i.e., to insure complete legal and permitted usage of fonts, I can't help but wonder what the aim is in the first place. Since probably most font vendors have strict usage reguirements, EULAs, etc., it seems that the Monotype approach may be more than simply providing a service to insure that fonts are not used illegally. It would seem logical therefore that, whether or not intended, the customer will always come back to Monotype for font purchases regardless of whether or not an attempt is being made to monopolize the market because the implication is that, when and if the client or customer comes back, he can be assured of protection and observation of legal usage and there is no such guarantee through other vendors, again, by implication.</p>
