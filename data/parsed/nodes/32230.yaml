      <p>I very much agree with Bruno, Fontwise is a good idea, but it is being used by a commercial company to enhance their commercial interests. I can understand them doing that, but they may well be tempted, from being in such a dominant position, to simply cross reference fonts that they may not have access to. I’m not saying that Monotype carries out this practice, but I do know that some font distributors have done this, and some probably still do.</p>
      <p>When a user is locked into a single distributor it is easy for that distributor to say to the user “g-type fonts (for example) are not easily obtainable so to avoid being compromised with possibly illegal versions of g-type fonts – let us license you with fonts of a similar design from our own sources”. So the distributor makes on the new font license, Nick Cooke looses income and exposure of his g-type font library.</p>
      <p>It is very hard to be an independent font designer without the assistance of organisations like Monotype Imaging to give you wide exposure, and it’s a sad reflection of the font industry that, apart from MyFonts.com, Monotype are now the only boys in town. And what has driven the industry to this position – that’s simple – font piracy.</p>
      <p>One only has to check the listing in alt.binaries.fonts to get a feel for the amout of font data being passed around illicitly,  much of which is original work of independent font designers.</p>
      <p>Malcolm Wooden</p>
