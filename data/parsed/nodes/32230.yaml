    <p>I don't know if this has been discussed previously...</p>
    <p>What does the type community think of <a href="http://www.fontwise.com/aboutservice.asp?part=1">Fontwise</a> by Monotype? Apparently Monotype are presenting this service to major type users in the UK and companies are signing up to a contract. This means that large agencies, publishers or whatever can only buy any new typefaces exclusively from Monotype. I'm not sure that Monotype would do their best to fulfill a request to acquire any typeface from a foundry not owned by them - maybe they would suggest something similar in their library.</p>
    <p>Of course Monotype are presenting Fontwise as a font management system which makes it easy for large organizations to keep control of licensing and ensure legality. They complete a font audit within a company, but if any discrepancies come to light such as customized fonts, a company could find itself having the extra cost of "legalising the modifications". As many publishers have their own versions of typefaces; eg, having a few characters altered or respacing and kerning I am sure they will not welcome this extra expense, especially if the alterations were done when the license stated that modification is allowed if the original font is licensed for the correct number of users and is not being sold or given away and only being used within that company.</p>
    <p>Does anybody think this is a good thing, or just a thinly disguised attempt to monopolize the typeface market? They already own ITC and Linotype, and I am sure many smaller distributors and independent foundries will start to feel the pinch as more companies sign up to Fontwise.</p>
