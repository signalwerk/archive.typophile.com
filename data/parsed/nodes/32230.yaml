      <p>OK, in theory I support Fontwise as it ensures that type designers and font engineers are paid for their work. For too long the practice of sharing fonts has been going on. I remember about 10 years ago there was a statistic that for every font bought, five copies were made and used. And that's just in Europe and North America. The moment you go to places where only minimal copyright laws exist and theft/piracy is regarded as an act of valour you will find this ratio rises to about 1:25.</p>
      <p>Yes we are on the 'signed-up' list at Monotype. But we have no formal agreement with them. It is because we have worked with Monotype in the past and have a good relationship. </p>
      <p>I too have heard that a Fontwise contract will tie the client to buy fonts exclusively to Monotype. This is of course monopolistic and predatory (and potentially illegal under most trade laws). And that's what I object to. This will eventually push independents out of business as more and more clients will go to Monotype as the first port of call - be that for straight font licensing or customisation. As far as Dalton Maag is concerned it may put us in an awkward position as clients may question our legality. Furthermore, original fonts designed by us will flag up on Fontwise as potentially illegal. I don't know how Monotype handles such flagged up fonts - whether they contact the original designer tracing the source of fonts, or whether they simply demand payment from the client. I know that they contacted me about fonts we have done for a client to establish their rightfulness.</p>
      <p>Monotype now controls the three biggest font libraries which contain most of the best known fonts. Establishing Fontwise also gives them control over our potential client base, and thus control over our business activities.</p>
      <p>I am concerned that in the long term the combined behemoth MT/LT/ITC and Fontwise will impact on the smaller foundries and independent font retailers. Companies such as ourselves and retailers will need to double their efforts to put client's minds at ease in regards to legality and copyright if they want to maintain their business. Alternatively, all independent designers will have to 'sign up' to MT's Fontwise to be part of the legal database and give MT a de facto license to retail their fonts. </p>
      <p>Bruno Maag<br>
      Dalton Maag Ltd</p>
