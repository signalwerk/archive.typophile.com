      <p>OK, I posed some questions via email to the people at Fontwise and Alin, a lady who works at Monotype HQ in Redhill in the UK very kindly phoned me with some answers.</p>
      <p>From what she told me there are apparently two types of contract; one where the client is tied to Monotype and its products, and the other where the client is free to choose whatever they want. It seems that if the Fontwise client has the non-restrictive contract they can acquire other non-Monotype fonts direct from the supplier or through Fontwise. Although, as there is no mention of two types of contract on the website I'm wondering if both get equal billing when selling the product. I can't say I'm exactly overjoyed at the first type of contract.</p>
      <p>The question of representation is a bit woolly, as there is no formal representation. Monotype Fontwise will acquire independent fonts from the correct sources if requested.</p>
      <p>I agree Fontwise is a good idea in theory, its objectives are laudable. If only it was run by an impartial company that doesn't sell typefaces.</p>
      <p>So Carl, why exactly do you find this thread to be inappropriate? I would have thought that as an independent type designer you may be a little concerned if a Megacorp was trying to elbow you into the gutter. Perhaps you don't need to worry. Congratulations.</p>
      <p>Nick Cooke</p>
