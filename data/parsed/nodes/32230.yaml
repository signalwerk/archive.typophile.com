      <p>Carl, this is from the Fontwise pdf:</p>
      <p>Your authorised users can licence any font as they need it through the Fontwise centralised database and purchasing system. Now you have a complete font licensing database that can be monitored dynamically. So at a glance you know what fonts your staff are using and critically, that you’re always correctly licensed.<br>
      What’s more, your font specifiers can use the database as a centralised font resource,<br>
      eliminating ad-hoc licensing and reducing system maintenance due to corrupt or infected<br>
      files being loaded from unauthorised sources.<br>
      The FontwiseTM database can also link online to Monotype to try out fonts prior to<br>
      purchase. Each time a font is acquired this way your licensing position is automatically<br>
      updated on the database. So your licensing position is always clear – you’ll never have to<br>
      audit your fonts again!<br>
      FontwiseTM provides a future proof solution you can rely on to end the chaos often<br>
      surrounding font licensing.</p>
      <p>Does the Fontwise centralised database and purchasing system include every font by every independent foundry? Of course there is a link online to Monotype. My main concern is future purchasers of type being steered to Monotype only. See the first sentence of Malcolm's post.</p>
      <p>It would be ludicrous to offer this service and then require that all purchases be made from one font store - I know, but I think that is the case when a company has this contract. Hopefully somebody from Monotype can put me straight on this and tell us all that it isn't so.</p>
      <p>Nick Cooke</p>
