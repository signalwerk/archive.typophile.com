      <p>Nick,</p>
      <p>I am a type designer who happens to be employed by "a Megacorp", The very one you're feeling threatened by. I do care if any company is attempting to monopolise any market, and that's not the case at all: signing up for FontWise isn't compulsory any more than buying all your fonts from Monotype. Now, after the lengthy thread and all the worrisome comments, you know better. Isn't it paranoid to now say: "Elbow you into the gutter"? You finally have substantive information and you're choosing to interpret it the most dreary and negative way possible. </p>
      <p>My objection here is that you (and the Mac power cable inquirer) repeatedly asked a general group of people a question that was relevant to a specific party, one not hidden from you or difficult to find. I notice you didn't ask where to find the information, you only implied that you'd like a Monotype rep to appear to feed answers to you.</p>
      <p>I like to think Typophile can be less of a gossip station and more substantially informative. If you have access to information and you don't take it, don't blame "a Megacorp" for feeling taken advantage of. Knowledge is power. Don't you think the readers and posters of this thread would have appreciated for you to bring all the information up front, rather than sound an unnecessary alarm? Other people come here for information too; consider also providing it occasionally, especially when it's about 3 mouse clicks away.</p>
