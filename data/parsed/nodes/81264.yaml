      <p>&gt; "Do you know of any good books that are more about the history of letterforms way way back? Like the progression to how we even came to have the forms that we have now?"</p>
      <p>I absolutely do! Read "Mysteries of the Alphabet" by Marc-Alain Ouaknin (translated by Josephine Bacon).</p>
