      <p>Some of my favorite type history books:</p>
      <p>(I've omitted ones that are on the Hoefler and Frere-Jones list, which is very useful on its own.)</p>
      <p>"A Short History of the Printed Word" — Warren Chappel / Robert Bringhurst (second edition)<br>
      This is a wonderful overview of general typographic history</p>
      <p>"Type: The Secret History of Letters" — Simon Loxley<br>
      While not a formal type history, this is a wonderful collection of anecdotes about specific designers and faces</p>
      <p>"Meggs' History of Graphic Design" — Philip B. Meggs / Alston W. Purvis (fourth edition)<br>
      This comprehensive textbook covers all aspects of graphic design history, not just typography</p>
      <p>Incidentally, I think the Bringhurst classifications (Renaissance/Baroque/Neoclassical/Romantic/Rococo/Modern/Postmodern etc) are much more useful in talking about type history than oldstyle/transitional/modern, which I couldn't even define off the top of my head. How "old" is oldstyle? If we say Renaissance, though, everyone knows when the (Venetian) Renaissance was, and what was going on in related arts. The distinctions seem to also be finer than the conventional system allows for. Mugford is right, though; Bringhurst's terms aren't often used by typographers (or taught in school), at least in my experience.</p>
