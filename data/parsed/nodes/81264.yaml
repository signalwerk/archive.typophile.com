      <p>Well, Robert Bringhurst's The Elements of Typographic Style is an extraordinary book about typography. However, he has his own classification system that is based more on art history terms than the "standard" oldstyle-transitional-modern classification. It's an interesting way of thinking about typefaces but if you use his terms most people won't know what you're talking about.</p>
      <p>Here are a few links that might be helpful...</p>
      <p><a href="http://www.amazon.com/typography-recommended-Hoefler-Tobias-Frere-Jones/lm/R3QWSQ2V1SIZAE" title="http://www.amazon.com/typography-recommended-Hoefler-Tobias-Frere-Jones/lm/R3QWSQ2V1SIZAE">http://www.amazon.com/typography-recommended-Hoefler-Tobias-Frere-Jones/...</a></p>
      <p><a href="http://www.creativepro.com/blog/typetalk-top-ten-type-resources-online" title="http://www.creativepro.com/blog/typetalk-top-ten-type-resources-online">http://www.creativepro.com/blog/typetalk-top-ten-type-resources-online</a></p>
