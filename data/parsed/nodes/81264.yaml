      <p>The Ouaknin book sound interesting.</p>
      <p>Also good on letterforms is 'The Alphabetic Labyrinth' by Johanna Drucker, available in paperback ( largesize - about 7.5 " x 10.25") paperback is also very good.</p>
      <p>A classic history of typefaces up to the 1920s is 'Printing Types: Their History, Forms and Use', by Daniel Berkely Updike, in 2 volumes. It's a great foundation for a typographical library.  It was reprinted by the Harvard U. Press in 1951.</p>
