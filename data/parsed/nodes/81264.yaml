    <p>I am looking to learn more about the history of typography (what formal ideas/trends come from what eras/places, etc.), and I know that there are a lot of books on the topic, but which do you guys think are best? I have a pretty standard (i.e. limited) knowledge of typographic history (blackletter before oldstyle before transitional before modern, etc.), and I want to learn a lot more so that I can better inform decisions that I make.</p>
    <p>I would appreciate it!</p>
