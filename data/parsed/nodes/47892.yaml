    <p>Hi,</p>
    <p>I am a type enthusiast living in Sydney Australia, and have been frustrated by the lack of organisations and interest groups inspired by our wonderful world of typography.</p>
    <p>Rather than get frustrated, I have decided to do something about it, and am going to establish an informal club called <strong>The Australian Typography Club</strong>. Inspired by organisations like <a href="http://www.typocircle.co.uk/" rel="nofollow">The Typographic Circle</a>, and <a href="http://typeclub.com/" rel="nofollow">Type Club of Toronto</a>, the purpose of our club will be to promote choosing, using, and creating great typography.</p>
    <p>The short version of this thread is that I am seeking advice and direction regarding:</p>
    <ul>
    <li>setting up a typography club</li>
    <li>knowledge of the type scene in Australasia</li>
    <li>general guidance</li>
    </ul>
    <p>If you can help, please read on!</p>
    <p>==================</p>
    <p><strong>ABOUT ME</strong><br>
    In the world of typography, I am just another keen user (a mere nobody). What's worse, I write quite messy (but that's another thread). I am however a very capable person, and run a publishing design studio in Sydney. I will make sure The Australian Typography Club succeeds.</p>
    <p><strong>ABOUT TYPE IN SYDNEY</strong><br>
    For the past couple of months, I scoured high and low to find any sort of organisations, group, or course concerned with type. Bonus points for anything in Sydney. Results:</p>
    <p>There is <a href="http://www.agda.com.au" rel="nofollow">The Australia Graphic Design Association (AGDA)</a>. Many have their views on AGDA - and I have heard them being described as inaccessible or irrelevant. Most importantly, I do not believe there is a focus group concerned with typography. To be honest, I'm a little hesitant to contact these people.</p>
    <p>There is an online community <a href="http://www.australianinfront.com.au" rel="nofollow">Australian INFront</a>. This is a great online only community, with respect of typography.</p>
    <p>Education-wise: There are the usual type subjects taught as part of tertiary courses. Various industry short courses also exist, for example run by <a href="http://www.aftrs.edu.au/aboutus/contactus/nswact.aspx" rel="nofollow">AFTRS</a> "<a href="http://www.aftrs.edu.au/courses/industryshortcourses/findacourse/typographyforthescreen.aspx?iteration_id=5803&amp;PEPICourseID=138" rel="nofollow">Typography for the Screen</a>". Oh dear, but this is run in Melbourne.</p>
    <p>If you're aware of other organisations, groups or courses relating to type in Australia, please let me know!</p>
    <p><strong>PURPOSE OF THE CLUB</strong><br>
    The mission of our club will be to promote choosing, using, and creating great typography.</p>
    <p>On a day-to-day level, the purpose of the club would be to create a real-life community for type enthusiasts to meet, collaborate, and learn. Meetings would be held periodically (in my studio if needed), where Australian typography enthusiasts of all ages can discuss choosing, using, and creating great typography.</p>
    <p>As a 27 year-old, I have a personal interest to get younger professionals / uni students involved. The type scene exists in Australia. There's a type gene in our DNA - we just have to get together.</p>
    <p><strong>ESTABLISHING THE CLUB</strong><br>
    As an informal, not for profit, general interest club, I would imagine that the membership would steer it's direction over time. It however firstly needs to be established.</p>
    <p><strong>The following are 3 issues I would love advice with. Please help!</strong><br>
    ========================================================================</p>
    <p><strong>==&gt; Issue 1 of 3: What is Australian Type?</strong><br>
    When it comes to type, Australia is no New York or Amsterdam. Heck, we're only 220 years old. Compared to other cities, there is little historical culture. How can we define Australian Type? What is it? Is there such a thing? Where have we come from, and where are we going? Is it even important that there is such as thing as Australian type?</p>
    <p><strong>==&gt; Issue 2 of 3: Attracting the right leaders</strong><br>
    We would love to attract respected and knowledgeable type industry leaders to be involved in the club in some way. Those in Industry, type designers, foundries, educators. Who are these people in Australia?</p>
    <p>From Industry:<br>
    Developers: I am aware of Elliot Harper, Chapter Rep of the <a href="http://www.indesignusergroup.com/chapters/sydney/" rel="nofollow">Sydney Adobe InDesign Users Group</a>. Also <a href="http://www.creativesweettv.com/" rel="nofollow">Mike McHugh</a>, Creative Systems Engineer at Adobe - a fantastic Adobe CS trainer.</p>
    <p>Agencies: My knowledge of type specialist in design agencies in Australia is limited. There are of course highly respected agencies like <a href="http://www.frostdesign.com.au/" rel="nofollow">Frost Design</a>, and others specialising specifically in type, magazine and newspaper redesign. Problem is: I am not aware of who the gurus are.</p>
    <p>Type Designers / Foundries:<br>
    Unfortunately drawing major blanks here. <a href="http://typophile.com/user/1519" rel="nofollow">Kris Sowerby</a> of KLIM fame is from New Zealand. That's the closest I get.</p>
    <p>Educators:<br>
    They lurk around teaching courses in places such as <a href="http://www.billyblue.com.au" rel="nofollow">Billy Blue</a> and TAFE Enmore amongst others. They know their stuff. With more homework I can find out these peoples names', but would love some help.</p>
    <p>Attracting these people involves inviting them to contribute at meetings with talks, help set up the club, or merely come along for the ride, if they're at all interested. Remember it's about choosing, using, and creating.</p>
    <p><strong>==&gt; Issue 3 of 3: Getting members to join</strong><br>
    Get issue 2 right, and this one should be quite easy. </p>
    <p>For industry professionals: word could spread with the right seeds planted.</p>
    <p>For young professionals and uni students, from first hand experience I know there are plenty of young enthusiasts out there. Promoting typography to up and comers is only positive for the industry. Quite easy and effective to contact design colleges, I also hear a community announcement on FBI radio etc.</p>
    <p>==============================================================</p>
    <p>So all in all, I'm keen to hear any words of advice, direction, or comments about the ambition for The Australian Typography Club. </p>
    <p>...especially in relation to the <strong>3 issues raised</strong>, and names of people / type designers / foundries / gurus.</p>
    <p>Is there anyone from other type clubs who also could provide advice?</p>
    <p>Thanks for any help and advice.</p>
    <p>*edited to expand scope to Australia (was initially Sydney based only)</p>
    <p>Update:<br>
    A <a href="http://forums.australiantype.org/viewforum.php?f=3" rel="nofollow">Forum</a> has been established. Please help out if you can!</p>
    <p><a href="http://forums.australiantype.org/viewforum.php?f=3" rel="nofollow">http://forums.australiantype.org/viewforum.php?f=3</a></p>
