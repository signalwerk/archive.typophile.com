      <p>The quickest way to get this off the ground will be to establish a website with blog / wiki. I'm very keen to help with that stuff.</p>
      <p>@Nathan<br>
      <em>Agencies: My knowledge of type specialist in design agencies in Sydney is limited. There are of course highly respected agencies like Frost Design, and others specialising specifically in type, magazine and newspaper redesign. Problem is: I am not aware of who the gurus are.</em></p>
      <p>What baffles me is why so few of Australia's type specialists or gurus show up at Typophile. Typophile can seem bewildering, elitist, even offputting at times, depending on the topic being discussed. But it's an international community with a lot to offer, and to be part of it you have to roll with the punches and take a tolerant, long-term view. You (Nathan) and other Aussies have done that. You made the effort and now you're getting something really great in return. I've had my darker moments and occasional loss of faith, but in the end I stuck with Typophile. I'm still here.</p>
      <p>So where are Australia's big shot type people? Why aren't they Typophilers? This curious dearth of Australian presence puzzles me.</p>
      <p><em>The Sydney Typography Club</em></p>
      <p>Is it going to be named that, or The Australian Typography Club, or The Australian Typographic Board as David Sudweeks is suggesting, or something else? Irrespective of where meetings and events are held and where the organization is headquartered, naming it The Australian Typography Club (or something similar) will go a long way towards securing membership from every state. I saw the <em>*edited to expand scope to Australia</em> bit, so does that mean we can substitute each instance (or most instances) of "Sydney" with "Australia"?</p>
      <p>One thing I'm not into is the notion of Melbourne as Australia's culture capital. Currently I don't subscribe to that view, even tho I unwittingly repeated the myth several years ago on the page about me at Planet Typographie. Sydney is a very cultured place, no less so than Melbourne, just different. I hope you and other interested parties in Sydney can see beyond the Sydney versus Melbourne thing too, because it's a load of bunk with the potential to derail a national type society. </p>
      <p>j a m e s</p>
