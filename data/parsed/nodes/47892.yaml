      <p>@James Yencken: <em>I highly highly recommend Typecon - we happened to be in the US on business and got away for a week for the conference this year. So amazing, so inspiring, and so much fun. I’m already saving my pennies for next year.</em></p>
      <p>Typecon is a type trade show where (this year for instance) 400 of the 470 attendees were there to flog their wares. A certain amount of commercialization is neccessary to support industry conferences, but still I find it hard to get enthusiastic about paying $350 (add a few grand in airfares and accomodation on top of that) to go to a convention where more than half the presentations are of no consequence or interest to me, and where most people are consuming alcohol. That turns me off, because I don't drink. I'm a smoker and I'm damn proud of it. The other problem for me with Typecon is I'm no type nerd. I'm an artist and a writer.</p>
      <p>Notwithstanding, I think Typecon is great for the people who like and enjoy that kind of thing, and I wish SOTA and the Typecon people all the best in future gatherings. Everything has its place in this world. I don't dislike Typecon nor am I anti-Typecon or anti-Type nerd. It just isn't for me.</p>
      <p>At least I don't think it is, but I would very much love to be convinced otherwize. Typophiles you are most welcome to turn me around on this. Convince me. Tell me why I should go.</p>
      <p>But enuff sour grapes. It's telling that James Yencken, a designer, knows of other designers interested in typography as well as actual type designers in Melbourne. I'm out of touch with the design scene since I mainly work in public relations, as a writer of business collateral, creative concepts for ads and some corporate branding. I have kept my interest in type going however by forging a career as a typeface designer and font maker. That's not well supported by my daytime contract work, but I guess I can't have everything.</p>
      <p><em>I wouldn’t jump right on the AGDA hate bandwagon fellas.</em></p>
      <p>I appreciate what you are saying there, but your choice of words has a polarizing effect. Leave out "hate" and "bandwagon" please. "Hate" is a dangerous corrosive word and we're all better off not using it. It has a corrosive effect.</p>
      <p>The opinion I expressed of ADGA earlier is based on contact I made with them and their utter lack of responsiveness. They didn't return my any of my calls or emails, and I made quite a few of them. I am very professional in my business correspondence, much more professional than you may see me from time to time in online discussions at Typophile. I made the effort to establish repore with ADGA repeatedly and got nothing in return, not one word, not one call back. What else am I supposed to make of that?</p>
      <p><em>They put on some good events and the people in charge in Melbourne are a young progressive bunch.</em></p>
      <p>Good for them and I wish them all the best with their endeavors. Sorry, but in my estimation they have a colossal amount to learn about professionalism and how to communicate.</p>
      <p><em>They would almost definitely support any kind of type initiative; but everyone involved in AGDA is also a busy designer with limited time.</em></p>
      <p>I think you should speak for yourself, and let them speak for themselves. And James, please take all of what I'm saying in good faith as it's meant that way.</p>
      <p>@Pat Armstrong: <em>PS. Sydney typophiles might want to have a look at the current show at the UTS Gallery, which is a 10-year retrospective of Roma publications. They’re also organising a screening of Helvetica for Friday, August 29 as a related event.</em></p>
      <p>The UTS Gallery show sounds interesting. Thanks for the link Pat : ^ ) </p>
      <p>I watched the Helvetica film for the first time on DVD in my hotel room a few weeks ago when in Sydney. It was the most boring documentary I've ever seen. Nothing in it about Helvetica I didn't already know. It's a boring font and a boring subject. The only interesting person in <em>Helvetica</em> is David Carson.</p>
      <p>j a m e s</p>
