      <p>Thankyou for the information. </p>
      <p>It's very pleasing to hear support and enthusiasm that I've sensed is out there.</p>
      <p>Update:<br>
      There is a plan being formulated. I'm in the process of aggregating all information, and need to make a few phone calls. Alas, work is getting in the way.</p>
      <p>Phase 1: Establishing The Type Club<br>
      - pre general membership phase<br>
      - attracting the right stakeholders: type designers, supporters<br>
      - penciling an initial mission/charter/purpose<br>
      - establishing what 'membership' is<br>
      - thinking about real-life events</p>
      <p>Phase 2: Attracting Membership</p>
      <p>Phase 3: Organising the first event(s)</p>
      <p>Early thoughts on Membership:<br>
      - goes without saying that this is a not-for-profit club<br>
      - target base: design professionals, design students, enthusiasts, type designers, educators, academics<br>
      - membership is free for type designers, students, academics<br>
      - $20/pa design professionals and general enthusiasts<br>
      - hard to draw a line I understand</p>
      <p>- Membership gets you:<br>
      --- the Australian Typography Yearbook posted to you annually, which showcases the best of Australian type. Type designers contribute and showcase their work here. (I am a publisher and can produce the yearbook cheap but nice.)<br>
      --- admission to type events<br>
      --- other stuff (provided by supporters)<br>
      --- tshirt? (may need to bump up membership), but need to keep it down too</p>
      <p>A website link will be published on this thread when the time is right, where others can help with Phase 1, and become part of the core founders. There's no way I can do this on my own. ETA: 1 week.</p>
      <p>Keen to hear any other opinions, thoughts + advice. Thanks!</p>
