      <p>Hi Nathan. Great idea and I'm all for it. Trouble is I live in Melbourne. I've been travelling to Sydney on PR consult jobs this year, but I'm only there for a few days at a time and it's very hard to convince my employers to let me have any time off for things like type club meetings, or anything else for that matter. Mainly I'm employed as a brand consultant, AD and writer.</p>
      <p><em>There is The Australia Graphic Design Association (AGDA). Many have their views on AGDA - and I have heard them being described as inaccessible or irrelevant. Most importantly, I do not believe there is a focus group concerned with typography. To be honest, I’m a little hesitant to contact these people.</em></p>
      <p>Me too. I've had some contact with AGDA in the past and found them rather inaccessible and largely inactive. Certainly they didn't express much interest in typography.</p>
      <p><em>Type Designers / Foundries:<br>
      Unfortunately drawing major blanks here. Kris Sowerby of KLIM fame is from New Zealand. That’s the closest I get.</em></p>
      <p>I'm one of Melbourne's indie type designers / font manufacturers. There are others here, but I've had no contact with them, largely by choice because I'm very indie and like to work on my own, figure it all out for myself. Now that I'm established I'm getting more comissions, and I may be about to sign a deal with a high-profile indie retail / custom type outfit in London, who I cannot name at this time.</p>
      <p>One other Melbourne type designer is Graham Meade:<br>
      <a href="http://www.myfonts.com/browse/person/meade/graham/" title="http://www.myfonts.com/browse/person/meade/graham/">http://www.myfonts.com/browse/person/meade/graham/</a></p>
      <p>I'm not sure where the following people are located:</p>
      <p>Jan Schmoeger:<br>
      <a href="http://www.myfonts.com/browse/person/schmoeger/jan/" title="http://www.myfonts.com/browse/person/schmoeger/jan/">http://www.myfonts.com/browse/person/schmoeger/jan/</a></p>
      <p>Wayne Thompson:<br>
      <a href="http://www.myfonts.com/browse/person/thompson/wayne/" title="http://www.myfonts.com/browse/person/thompson/wayne/">http://www.myfonts.com/browse/person/thompson/wayne/</a></p>
      <p>Jesse Andrew Tilley:<br>
      <a href="http://www.myfonts.com/browse/person/tilley/jesse/andrew/" title="http://www.myfonts.com/browse/person/tilley/jesse/andrew/">http://www.myfonts.com/browse/person/tilley/jesse/andrew/</a></p>
      <p>In Sydney there's Russell Bean:<br>
      <a href="http://www.myfonts.com/browse/person/bean/russell/" title="http://www.myfonts.com/browse/person/bean/russell/">http://www.myfonts.com/browse/person/bean/russell/</a></p>
      <p>There's a list of Aussie type people at Myfonts:<br>
      <a href="http://www.myfonts.com/country/au/" title="http://www.myfonts.com/country/au/">http://www.myfonts.com/country/au/</a></p>
      <p>Out of all those people, the fonts I've made appear to be the most serious as far as typographic design goes.<br>
      <a href="http://www.myfonts.com/browse/person/arboghast/james/" title="http://www.myfonts.com/browse/person/arboghast/james/">http://www.myfonts.com/browse/person/arboghast/james/</a></p>
      <p>I'm not prolific, and the best is yet to come, but out of the two main retail fonts I released last year, all two of them made the Typographica best fonts of 2007 list. I figure that's a good sign. I'm just moving into text fonts now.</p>
      <p>For the time being it's best if you ask me what I can do for you and your endeavor. I'm happy to talk about it here online or we can converse by email.</p>
      <p>j a m e s</p>
