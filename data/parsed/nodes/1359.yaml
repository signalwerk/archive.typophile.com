  html: <p>implicit is a east coast based house dj, when speaking to him about how he saw his work, he expressed himself alot about being part constructor/scientist .. being very focussed about his precision and skill in his mixing <br>i wanted to convey his love of a) simplicity and the meeting between scientific (metaphoricly math/ simplicity in combination of forms) and music (flow/change) <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/1659.gif" alt="implicit logo"></p>
