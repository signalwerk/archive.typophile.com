    votes: null
    html: |-
      <p>I think it is true, as someone mentioned, that LaCie doesn't manufacture hard drives as much as it packages them. Very good connections, fans, housings, etc., which contribute to long life. I had one for over nine years, long past its usefulness, and it never failed.</p>
      <p>Also it is true, to a degree, that it doesn't matter what the hard drive is designated as, SCSI, ATA, SATA, FireWire, USB, eSATA, it is only the connections that make them what they are, so yes, you can house whatever externally with the right connectors.</p>
      <p>I run my internals off of a multi port hard drive controller card and use FireWire for externals. I use an internal drive as the main system and everything else drive, a second as a scratch disk, and a third as a document backup. The externals are all full drive back ups, including a portable (OWC Mercury) and a large multi-partitioned (for sequential back ups).</p>
      <p>SuperDuper (a cloner) is great for backing up everything to the external drives, quickly and reliably, and has saved my butt a couple times now.</p>
      <p>The word of wisdom with a drive is, "not if, but when" it will fail. And yes, back up your back-ups. Likely, your whole creative, and in some case, financial, life is on these drives.</p>
      <p>Gerald</p>
