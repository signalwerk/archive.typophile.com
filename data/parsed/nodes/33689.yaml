      <p>What "An Accident" said: they all die. Google did a great <a href="http://labs.google.com/papers/disk_failures.html" rel="nofollow">study</a> that confirms this and fills in lots more detail. If I go to bed without my work rsync'ed or stored in a version control repo on a remote machine, or burned to CD, I don't sleep as well.</p>
      <p>You can't buy a hard drive that won't fail. So buy a cheap one that will fail, and design your work practices so that when it does fail, it won't impact your life.</p>
