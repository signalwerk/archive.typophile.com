    html: |-
      <p>LaCie are OK and they look pretty but don't be fooled into thinking the actual hard drive is any more reliable than any other brand. They don't make their own drives, just the pretty case.</p>
      <p><strong>they all die.</strong></p>
      <p>anything you have on a hard drive should be backed-up somewhere else –&nbsp;I know too many people with external hard drives as their main storage, with no back-up of that data (do they think the external drive will last forever?)</p>
      <p>So, presuming you have everything backed-up, the one thing that would sway me when I choose a hard drive is brand warranty.</p>
      <p>Seagate offer internal 'Barracuda' drives with a five-year warranty.<br>
      Western Digital offer the My Book <em>Pro</em> with a three-year warranty (other versions of the MyBook range have one-year warranties).</p>
      <p>most other brands offer one-year warranties.</p>
      <p>These warranties don't stop them dying but they will get you a new drive if they do (and if everything is backed-up it's not such a problem)</p>
      <p>Did I mention how important it was to back-up your back-up?</p>
    html_clean: |-
