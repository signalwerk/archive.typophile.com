      <p>I keep a Maxtor 120 Gb (Costco) hooked up at all times, and then every three months I do a back up of all recent files to a Simple Tech 120 Gb (Sam's) that I keep in a fire-proof safe.</p>
      <p>I always thought it sounded strange (and pathetic) that someone claiming to be a professional whines in some group that he had lost all his fonts and files, because he had never backed up. It makes complete sense even for us amateurs, since backing up is a good way to ensure that Murphy leaves you alone.</p>
