    <p>Memo to those businesses in the graphic trades contemplating sending out fancy calendars to this art director/designer next year:</p>
    <p>1. It’s overdesigned.<br>
    2. It doesn’t work<br>
    3. I get lots of this stuff.<br>
    4. I use the Entourage calendar.<br>
    5. It’s going straight to recycling.<br>
    6. I do actually have a printed calendar in the kitchen—from my insurance agent. Nice scenic photos at top, basic boxed grid below. Not much of a “design”, but the best design for the job.</p>
