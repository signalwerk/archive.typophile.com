    html: |-
      <p>&gt;Dolly has a smaller x-height, so it’s better<br>
      at larger sizes, maybe around 12.</p>
      <p>Looking at the specimen book, to my eye Dolly works best at 10 point, but is lovely at 12 pt also--though a bit dark for my taste. At smaller sizes, I think it could use some wider tracking than in the specimen book. </p>
      <p>Here is what Erik Spiekermann says in the Introduction to the specimen book: "What purpose was Dolly designed for? In small sizes--the ones we read--it looks like a warm, comfortable Garamondish, Minion-like Roman. Close up, we notice dozens of subtle curves and unusual shapes. The designers have managed to walk the fine line between their vanity (wanting to show off how good they are) and their purpose (to design other people will enjoy.)"</p>
      <p>He goes on to say other nice things about Dolly, which I think are very deserved, as I think it is one of the best recent text faces--which is why I bought the specimen book at TypeCon. Count me a fan of Dolly. </p>
      <p>My printer--1200 dpi Xante tuned to 'light'--does thicken a bit more than offset, but I think that is not the difference. I have just looked at a few characters large (on the fontshop site and the PDF from Suitcase) and Dederon is both thicker and with less contrast in the normal weight. To me it just goes a little too far in that direction. </p>
      <p>Also the design of Dederon to me is just flat-footed compared to the lively Dolly. Again, I don't have a printed sample, so there may be charms to Dederon that I don't see.</p>
    html_clean: |-
