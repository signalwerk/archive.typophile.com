      <p>Reviving an old thread because I've used Dederon Serif recently. </p>
      <p>I'm not sure whether this would work as a book face. It is quite unlike Dolly. The medium weight is far too heavy. Fair enough. The light, however, looks better suited for Display than anything else. It looks anemic. This is all at around 10 pts. The situation doesn't really improve at smaller sizes. In any case the letterspacing seems a little too wide and the x-height a little too small. All in all it looks like a cross between Mrs. Eaves and a slab serif. </p>
      <p>Anyone else notice this?</p>
