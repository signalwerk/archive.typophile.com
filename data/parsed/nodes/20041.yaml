    html: |-
      <p>Note that while FF Tisa's designer is a University of Reading graduate, Premiéra was designed by Thomas Gabriel, who studied at KABK. But one of Thomas's two business partners at Typejockeys is Michael Hochleitner, who *is* a Reading graduate ;-)</p>
      <p>Premiéra is an (excellent!) typeface that was started at the Type and Media program in The Hague, not on the MATD course in Reading. Moreover, while there are a few stylistic similarities across some of the typefaces designed at Reading, I wouldn't say that Slab Serifs are a big theme, tackled by a majority of students there. Other directions seem much more prominent in my memory. FF Tisa stands out as a pretty unique typeface, I think.</p>
