      <p>Nick's suggestion of using small caps is a good idea. But only if you are using small caps consistently throughout the report. I'm not a big fan of acronyms set in full caps in body copy. But it happens a lot. Especially in annual reports.</p>
      <p>If I was setting the type, I would add thin spaces before and after the slash but not the ampersand. Though this largely depends on the typeface.</p>
      <p>Also, I second Nick's caution about faux small caps and superscript.</p>
