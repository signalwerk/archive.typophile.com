  html: |-
    <p>I'm working on an annual report currently and was wondering if there is any spacing recommended for S&amp;P/TSX. It all looks like a big chunk to me. What would you recommend? Keep it without spaces? Thin spaces before and after the ampersand or the slash?</p>
    <p>Also, in english, is it correct to use superscript in dates? As March 1st, etc.</p>
    <p>Thanks for the help!<br>
    Emilie</p>
