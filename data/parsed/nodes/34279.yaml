      <p><em>S&amp;P/TSX</em></p>
      <p>Try small caps.<br>
      The relative size of small caps varies with typeface, so the effect varies.<br>
      Make sure to use true small caps, not faux.</p>
      <p><em>is it correct to use superscript in dates?</em></p>
      <p>Considered an affectation by many.<br>
      If you do use superscript, make sure the font has proper superscript characters, and doesn't just shrink the font, in faux style.</p>
