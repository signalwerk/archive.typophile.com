    html: |-
      <p>Thank you for (effectively) admitting to acquiring the fonts illegally.</p>
      <p>I have long thought that theft can sometimes be justified. Like stealing food for a starving family. But you don't go to the market to ask farmers where their fields are. And most of all, these are fonts - chances are you don't need them to survive, and you just want them to somehow get ahead. This is not OK, as (most) people make fonts at least in large part to get ahead themselves. So you're devaluing typefaces, our work, and I would ask you to stop.</p>
      <p>But frankly, in this context for us to help you steal fonts is probably worse than you stealing them. So we should stop too. We can't change the world or human nature, but we can and should still fight for things, such as Typophile.</p>
      <p>hhp</p>
