    html: <p>Gian if you must use a graphic representation of 4 color printing, take a photo thats printed and blow up a portion of it until you see only dots. See if you get something pleasing from that.  <br> <br>I personally prefer type logos only. I know what printers do and don't have time for gimics. I want my print jobs clean, crisp, professional and on time. Also the printing industry is now more than just process printing so they might not want to piegon-holed by such a restrictive mark.</p>
