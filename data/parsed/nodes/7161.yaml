    date: 2004-10-15T19:12:00
    date_raw: 15 Oct 2004 — 7:12pm
    votes: null
    html: "<p>The logos are looking much stronger. The second design from the bottom is by far the most resolved solution so far. The others still contain too many elements: the bars/circles, \"graphic\", 3, the black box, and artes graficas. Even though the \"graphic 3\" is working as a unit, the contrast you offer between the letterforms and the number (successfully in the latest versions with the red 3) distinguishes these elements from each other. If you can't leave the illustrative element (bars/circles) behind, then i think you will need to pull the Graphic and 3 together in the same typeface to make it work. <br> <br>As it stands, the design without bars/circles has the two extremely characteristic moments of the A missing it's bar and the 3. They work well together playing angle off with curve, and pulling out the angles within the 3. My only suggestion here would be making the weight of the 3 a little heavier to push the contrast with the weight of the tall condensed letterforms. They might be just a bit too close in weight right now. <br> <br>Whever you move on from here, I think you need to pay more attention to the \"artes graficas\".  It feels a little default.</p>"
    html_clean: "<p>The logos are looking much stronger. The second design from the bottom is by far the most resolved solution so far. The others still contain too many elements: the bars/circles, \"graphic\", 3, the black box, and artes graficas. Even though the \"graphic 3\" is working as a unit, the contrast you offer between the letterforms and the number (successfully in the latest versions with the red 3) distinguishes these elements from each other. If you can't leave the illustrative element (bars/circles) behind, then i think you will need to pull the Graphic and 3 together in the same typeface to make it work. <br> <br>As it stands, the design without bars/circles has the two extremely characteristic moments of the A missing it's bar and the 3. They work well together playing angle off with curve, and pulling out the angles within the 3. My only suggestion here would be making the weight of the 3 a little heavier to push the contrast with the weight of the tall condensed letterforms. They might be just a bit too close in weight right now. <br> <br>Whever you move on from here, I think you need to pay more attention to the \"artes graficas\".  It feels a little default.</p>"
