    html: |-
      <p>The binocular "g" is completely out of character; it's from a different century and a different continent. But I still think you can make a fitting one. The monocular "g" is balanced and stylistically harmonious, but it's a missed opportunity. One place to start looking for a good binocular "g" is the "a"; another is the "s".</p>
      <p>Seeing the conventional "el", I can think of another reason to keep the spiked one: the "el" is the poorest letter of the Latin alphabet, needing by far the most help in contributing something useful and memorable to text.</p>
      <p>I agree with William that the "r" should be narrower.</p>
      <p>More on lc:<br>
      - I'd make the eye of the "e" smaller.<br>
      - The "f" is not very attractive, but maybe a good form in context.<br>
      - Why not make the left foot serif of the "k" double-sided?<br>
      - In the "k", the join is looking neither here not there: there's too much going on for this type of design. I might make the top arm continue to the stem, and have the leg come out of it, or come out of the join, one or the other, clearly.<br>
      - The bar of the "t" could be shorter on the right.<br>
      - In the "x", the thin arms are flared differently to distraction.<br>
      - There seem to be some funny decisions about foot serif lengths: a longer right side makes sense in the "f" and "r", but it clearly doesn't in the "el", and in this design probably not the "p" and [left side of] the "q" either. In this last pair if you do keep one side longer, I'd make the left head serif of the "d" longer as well.</p>
      <p>More on UC:<br>
      - The vertical stem in the "G" should be taller, possibly even reaching the bars of the "E"/"F".<br>
      - The "T" should be wider.<br>
      - In terms of cap widths, there's something unsettling about the decisions of what to make narrow and what to make wide; I can't entirely put my finger on it, but for example looking at the sequence "HAMB" I'm seeing a lot of confusion.</p>
      <p>hhp</p>
