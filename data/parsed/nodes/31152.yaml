      <p>I've posted a new two-page file above, named "test 4 20070210.pdf"</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/test-20070210-u-and-lc_3420.jpg"></div><p></p>
      <p>I just love the l-spike. I know that it isn't necessarily appropriate, but this is a remix of styles anyway, and maybe it'll be able to add something. In the font's newest version, I have two l-glyphs… a "normal" l and the spike l.</p>
      <p>This version has a draft at a complete lowercase. There are currently two g glyph test: a single and double-storey g.</p>
      <p>Hrant, my first go at a lowercase y was a v with a tail, just like you recommend. It didn't work. But I will try again anyway.</p>
      <p>The period is now round.</p>
      <p>Bill: there the lowercase r is new in this version.</p>
      <p>Lari: <em>I don’t like the lowered diaresis.</em><br>
      Don't worry. It will just be an alternate in the end. Otherwise, it wouldn't match all the other diacritics. But old German metal type almost always had cap umlauts differently than the dieresis is now positioned. This alternate lowered version will have uses.</p>
