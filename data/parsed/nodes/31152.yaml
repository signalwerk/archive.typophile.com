      <p>This is a very interesting hybrid design - I'm seeing Didone, Eastern Europe, the RdR (love the nick on the "el") and Fenice. The "a" is a brave attempt, but the beak and the tail are fighting; that would give it a cool PoMo flavor, but no other glyph has such an attribute... I'd look at ITC Veljovic* and Sylfaen** for ideas on the "a". Or maybe remove the beak entirely - yeah, I think that would pump up the elegance even more; although I might still make the tail a wedge.</p>
      <p>* <a href="http://www.myfonts.com/fonts/linotype/itc-veljovic/medium/win-t1/190426/character/0061/CP2/1/" title="http://www.myfonts.com/fonts/linotype/itc-veljovic/medium/win-t1/190426/character/0061/CP2/1/">http://www.myfonts.com/fonts/linotype/itc-veljovic/medium/win-t1/190426/...</a></p>
      <p>** <a href="http://typophile.com/node/29571" title="http://typophile.com/node/29571">http://typophile.com/node/29571</a></p>
      <p>Other things:<br>
      - Love the caret.<br>
      - The "J" is too wide.<br>
      - Try harder with the "Q" (but keep it non-descending).</p>
      <p>hhp</p>
