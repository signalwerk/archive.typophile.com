    html: |-
      <p>The spike on the "el" is a mark of royalty (it was partly a -failed- copy protection scheme restricted to fonts produced under Louis XIV). Admittedly such historical sensitivity is essentially moot, and a good functional reason to have the spike (to disambiguate with the UC "I" in designs with double-serif tops on the ascenders, as in the RdR) is absent here*. But the spike is still: elegant; distinctive; and a great talking point, as Spiekermann has observed concerning the "g" in Meta. This sort of thing is pure gold in a display face - and it's not like we have a shortage of conventional Didones out there...</p>
      <p>* Although that didn't stop the Imprimerie Nationale from putting it in anyway:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/CharlesX_3978.gif"></div><p></p>
      <p>BTW, concerning the "el" spike I saw something pretty shocking recently: it was actually present in some <cite>manuscript</cite> documents, from way before the RdR, possibly even before the invention of printing (in Europe). I have no idea why.</p>
      <p>I do have an idea about the "y" though: try a form that's a "v" with a descender going straight down (and curling) - like a "j". They used to do that back when, and not only does it looks classy and rarified but it helps spacing too.</p>
      <p>The "g": especially if you keep the "u"-based "y" it might be smart to have a monocular form, but not making a binocular "g" also seems like a lost opportunity, even a cop-out. I would look to the funky "g"s in the old Didot fonts, like the ones JFP has revived.</p>
      <p>hhp</p>
