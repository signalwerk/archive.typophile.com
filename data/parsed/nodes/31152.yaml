      <p>a/d: I'd go for the slightly upslanted tail (the second one). But if you go for the totally flat one on the "d", make the one on the "a" identical, not a wedge. And I assume the "u" will follow suit.</p>
      <p>s: I'm in love.</p>
      <p>E/F: Are you going for an apparent alignment of the bars? If so, the one on the "F" looks slightly lower. Personally I might "break" it and make the bar of the "F" noticeably lower (and probably a bit [more] shorter too).</p>
      <p>Flourished K/R: not working for me (especially the "K"). The "J" and single-flourish "N" seem passable, but only the double-flourish "N" is really singing I think. On the "K" and "R" maybe try loosening things up.</p>
      <p>2/3: charming. A bit too much tail on the "2" though.</p>
      <p>y: seems to be working, but let's see it in "wyvern".</p>
      <p>k: the narrow one seems better.</p>
      <p>Q: start the tail from the inside; maybe try splicing in one of those long serifs, like from the "J".</p>
      <p>Just noticed something bad in the "r": don't thicken the arch at the beak - make it like the "a".</p>
      <p>I'm not sure about the oval period.</p>
      <p>BTW the texture is very nice - just make the blank space smaller.</p>
      <p>hhp</p>
