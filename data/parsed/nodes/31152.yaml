      <p>notes on the lower case:</p>
      <p>I think the bottom of the d looks best with the flat serif as it matchs the top of the ascender. And then the tail of the a would best match the d, as Hrant wrote. </p>
      <p>To me the spur on the l is needlessly distracting. I think it might hurt the reception of an otherwise useful display face. </p>
      <p>The r isn't working. Normally the join with the stem is lower on the r than the m and n, and the same weight at the junction. Here the high and heavy join is disharmonious. I don't know about the beak on the r, but I think the connection needs to be fixed first.</p>
      <p>The g is going to be a challenge--maybe a one story will be the way out.</p>
