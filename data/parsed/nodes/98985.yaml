      <p>There are fonts having this "neon feeling" but the reverse is not usually true: The majority of neon signs are <em>not</em> actually based on existing fonts, mostly due to technical and construction restrictions.<br>
      Having this in mind, you might like the following similar fonts:</p>
      <p>#2 : "Cocktails" (<a href="http://i.imgur.com/XTNWG.png" title="http://i.imgur.com/XTNWG.png">http://i.imgur.com/XTNWG.png</a>)<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-2&amp;ffam=TGL%200-16%20-%20Regular&amp;fid=4a170d976b90c99adfec61a30c408f6e&amp;fstyle=i&amp;fsize=60&amp;text=Cocktails&amp;fit=1" rel="nofollow">TGL 0-16</a></strong> by Peter Wiegel<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Typodermic&amp;ffam=Lonsdale%20-%20Regular&amp;fid=5a3dc784a2641051372e8b1043dd9d0f&amp;fstyle=i&amp;fsize=60&amp;text=Cocktails&amp;fit=1" rel="nofollow">Lonsdale</a></strong> by Ray Larabie (Typodermic)</p>
      <p>#4 : "MACAU" (<a href="http://i.imgur.com/t1yPR.png" title="http://i.imgur.com/t1yPR.png">http://i.imgur.com/t1yPR.png</a>)<br>
      <strong><a class="freelinking external" href="http://myfonts.us/td-V8KfeC/" rel="nofollow">Saloon Girl</a></strong> by Michael Hagemann (FontMesa, 2004)</p>
      <p>#7: "Erotic Museum" (<a href="http://i.imgur.com/ydmOQ.png" title="http://i.imgur.com/ydmOQ.png">http://i.imgur.com/ydmOQ.png</a>)<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=ITC&amp;ffam=Savoye%20Std%20-%20Regular&amp;fid=34e41ec35a86f2f7d6a861cfe4b1523f&amp;fsize=60&amp;text=Erotic%20Museum&amp;fit=1" rel="nofollow">Savoye Std</a></strong> by  Alan Meeks (ITC, Linotype, Letraset)<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-1&amp;ffam=CAC%20Pinafore%20-%20Regular&amp;fid=b9a64496fa89457c970be32c6ab503bb&amp;fstyle=i&amp;fsize=60&amp;text=Erotic%20Museum&amp;fit=1" rel="nofollow">CAC Pinafore</a></strong></p>
      <p>#8 "ARCADE" (<a href="http://i.imgur.com/if1YZ.png" title="http://i.imgur.com/if1YZ.png">http://i.imgur.com/if1YZ.png</a>)<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Adobe&amp;ffam=Helvetica%20Rounded%20Black%20-%20Regular&amp;fid=4acf9382e71e0c7c46295a393ad0df21&amp;fsize=60&amp;text=ARCADE&amp;fit=1" rel="nofollow">Helvetica Rounded Black</a></strong></p>
      <p>-----------------------------------------------<br>
      I found them using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
