      <p>#1 "NA": you can try <a class="freelinking external" href="http://www.myfonts.com/search/futura/fonts/" rel="nofollow">Futura</a>.<br>
      #2 "Cocktails: could be <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/santa-fe/" rel="nofollow">Santa Fe</a>, adding also to suggestions <a class="freelinking external" href="http://www.myfonts.com/search/kaufmann/" rel="nofollow">Kaufmann</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/mti/swing-2/" rel="nofollow">Swing</a><br>
      #4 "MACAU": adding to Saloon Girl <a class="freelinking external" href="http://www.myfonts.com/fonts/solotype/quadrille-2/" rel="nofollow">Quadrille 2</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/wood-type/" rel="nofollow">URW Wood Type</a><br>
      #5 "GUADALUPE": possibly <a class="freelinking external" href="http://www.myfonts.com/search/old+towne/" rel="nofollow">Old Towne</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/mti/figaro/" rel="nofollow">Figaro</a>. More: <a class="freelinking external" href="http://www.myfonts.com/fonts/astigmatic/horseplay-aoe/" rel="nofollow">Horseplay</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/intellecta/gans-italiana/" rel="nofollow">Gans Italiana</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/ingrimayne/kyhota/one/" rel="nofollow">Kyhota One</a>, <a class="freelinking external" href="http://www.dafont.com/showguide.font" rel="nofollow">Showguide</a>, <a class="freelinking external" href="http://www.dafont.com/cowboys.font" rel="nofollow">Cowboys</a><br>
      #7 "Frusco Inn": you can try <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/helvetica/" rel="nofollow">Helvetica Condensed Light</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/univers/" rel="nofollow">Univers Condensed</a><br>
      #8 "ARCADE": I'd prefer <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/helvetica/" rel="nofollow">Helvetica Black</a> to Helvetica Rounded Black</p>
