    html: |-
      <p> According to Michael Everson’s <em>The Alphabets of Europe</em>, <a class="freelinking external" href="http://www.evertype.com/alphabets/greenlandic.pdf" rel="nofollow">http://www.evertype.com/alphabets/greenlandic.pdf</a>, the capital associated with [ĸ] is [K‘], with a “high-6” single open quote. (Take that, SmartyPants!) Presumably a small-caps K followed by a (lowered?) open quote would be appropriate.<br>
       As concerns the letters <a class="freelinking external" href="http://www.typophile.com/user/14455" rel="nofollow">eigi</a> mentions, code points like U+01F0 [ǰ] are considered compositions (eg., of j + ◌̌); the small-caps version should just combine the small-caps j with U+303C Combining Caron. Abusing the IPA small-caps, it should look something like [ᴊ̌].</p>
