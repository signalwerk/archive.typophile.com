      <p>If the Kra has a distinctive form as we see in the example above ( no?); making a special small cap shouldn't be too hard ... But the design issue &amp; the technical one are seperate. John, you are saying that Indesign should be doing something. What do you think of putting code in to point to the correct Special glyph. Isn't that what happens All caps &amp; Small Caps anyway?</p>
