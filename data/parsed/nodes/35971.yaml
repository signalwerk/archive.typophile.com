      <p>Good catch, Joel!</p>
      <p>Samuel Kleinschmidt, who introduced the pre-reform Greenlandic orthography (and the one responsible for the kra, if I understand correctly) in <a href="http://books.google.com/books?hl=en&amp;lr=&amp;id=fTcLAAAAQAAJ&amp;oi=fnd&amp;pg=PA1&amp;dq=samuel+kleinschmidt&amp;ots=atOPD5ofol&amp;sig=x0J701F5KhYnXXY8mjKuoF4DAgY#PPA175,M1" rel="nofollow">his 1851 Greenlandic grammar</a>, doesn't seem to have cared about capitalization. I've skimmed the contents at Google Books, and nowhere does he seem to use capitals for any Greenlandic words. His German is far more sparse on capitals than I am used, for that matter.</p>
      <p>I tried to find examples of Greenlandic books in the pre-1973 orthography at Google Books, and found <a href="http://books.google.com/books?id=fiETAAAAYAAJ&amp;q=Av%C3%A1ngarnisalerss%C3%A2rutit+K'anak&amp;dq=Av%C3%A1ngarnisalerss%C3%A2rutit+K'anak&amp;lr=&amp;pgis=1" rel="nofollow">this example</a> which has the form K’ânâĸ (Qaanaaq in today's orthography) with what looks like a modifier letter apostrophe. So score one for SIL. This is just one example, though, and it's a rather small sample size. I would like to see more, but it's difficult to find a fully browsable book written in pre-1973-orthography Greenlandic at Google Books for copyright reasons.</p>
      <p>I did find <a href="http://books.google.com/books?lr=&amp;id=VkYaAAAAMAAJ&amp;dq=subject%3A%22Greenland%22&amp;q=diary&amp;pgis=1#search" rel="nofollow">this snippet</a> of part of a map with "K’ânâĸ" written by hand, but it's too small to see what's really going on in there with the diacritical marks.</p>
