      <p>Yes, you're right. Retconning is done to resolve conflicting accounts of the same event into a single historical reality.</p>
      <p>So this is more like anti-retconning, suggesting an alternative universe/history that has continuity with the present day--referring to historical continuity, not continuity between the cases as mandated by Unicode. </p>
      <p>Really it's just historical fiction, although I do like the Marxist overtones of "revisionism".</p>
      <p>In type design, a comparison might be the Renaissance style of Petrine Cyrillics, or Storm's 18th century sans serif, Sebastien.</p>
  - id: 269361
