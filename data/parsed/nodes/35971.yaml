      <p> <a class="freelinking external" href="http://scripts.sil.org/UnicodeNames" rel="nofollow">SIL</a> and <a class="freelinking external" href="http://www.evertype.com/alphabets/greenlandic.pdf" rel="nofollow">Everson</a> actually disagree here; the one claims upper-case Kra is K’ (K + U+02BC modifier letter apostrophe), the other, Kʻ (K + U+02B<em>B</em> modifier letter turned comma—which is supposed to look like K‘ <em>i.e.</em> K + left single quote; Georgia seems to display it as K+prime).  At any rate, the modifiers are the preferred characters to append, not the quote characters.</p>
      <p>—Joel</p>
