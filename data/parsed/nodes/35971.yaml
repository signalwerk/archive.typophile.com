      <p>This is so obscure you could probably set your own standard.<br>
      There are a few archaic Greek "single-case" letters also: historically, only one form was ever used, but Unicode, being a two-case system (yo Eben, don't get me started) calls forth the other.<br>
      So the question is, who is going to design the glyph?<br>
      Do type designers leave it to the orthographers, who will likely (e.g. Everson, SIL) just add some kind of tick mark? (Pardon me, "diacritic":-)<br>
      I say, if we have to make the damn things, we should at least be allowed a little fun and invention!</p>
