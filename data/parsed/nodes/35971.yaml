      <p>Nick, the example with the capital kra that I just posted is from a 1909 book. So this issue is likely something that conforms to its own set of conventions, and Everson and SIL are not arbitrarily inventing anything. They are merely describing what seems to have been standard practice.</p>
      <p>Nick: <cite>This is so obscure you could probably set your own standard.</cite><br>
      This is a whole language and a literary tradition you are talking about. Do you think type designers should disregard the accepted practices just to have fun in designing a new glyph, which would only serve to cause confusion in the representation of historic spellings? At least the German eszett is still in use so the possibility is there for a gradual acceptance of a capital form.</p>
      <p>The archaic Greek letters pre-dating the bicameral divergence of the Greek alphabet are a fun challenge for type designers, because there is a need for them, as you said. That's where we can exercise creativity and work toward building up some kind of consensus. The Kra doesn't need our help.</p>
