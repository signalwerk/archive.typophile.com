      <p>I would suggest eliding the diacritic with the letter.<br>
      That would avoid the mark bumping into the diacritic on a following letter.<br>
      Also, changing the nature of the top right serif from the standard upper case form of K (borrowing from, say, C) would provide consistency with the lower case treatment. I mean, the lower case character isn't just a "k" with a diacritic, is it?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Kras_6601.png"></div><br>
      But this is hypothetical, there are other more useful characters to put in fonts!<br>
      Thomas Phinney made a good point in his blog, when discussing which Cyrillic characters to add to a font, that using the number of speakers of a language is a good criterion. So if there are a lot of speakers, it's useful to support a language. And perhaps also if it's endangered. But really, what possible use is there in retconning a deprecated glyph?<p></p>
