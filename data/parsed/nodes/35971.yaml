    html: |-
      <p>When you try to offer justification for going one route (SIL) or another ( Nick's) you end up flailing to a certain extent if you insist on grabbing something solid/absolute. You could take either position legitimately as long as you acknowledge your reasons for doing what you do. My preference would be to look to the historical precedent - and then step out from there if at all. But doing that is only my prerogative - not the only right way. </p>
      <p>It is important to consider that a language with not a ton of readers &amp; not a a ton of books was probably given less thought &amp; consideration typographically speaking than other languages. It seems likely to me that the glyph design solutions they evolved might be a bit too slapped together and could stand being reconsidered especially if it was done in a manner that was culturally historically sympathetic. Acknowledgment that a given solution is <cite>completely legitimate</cite> doesn't preclude new ideas. How do you know that the Kra couldn't be helped? I don't! The world can't be split into simply retroactive continuity vs. simple revisionism. Insisting on this split takes your eyes of glyph designs and therefore real consideration of the issue.</p>
      <p>What is the population of readers of this glyph set anyway?</p>
