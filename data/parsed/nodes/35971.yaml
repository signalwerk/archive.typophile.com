    date_raw: 23 Sep 2011 — 10:46am
    votes: null
    html: <p>I think it is a mistake to place the apostrophe mark over the left stem of the n like this, Cristobal. The old Afrikaans character U+0149 is not a letter with a combining mark it is, as the Unicode name indicates LATIN SMALL LETTER N PRECEDED BY APOSTROPHE. It has a compatibility decomposition to U+02BC (spacing apostrophe modifier) followed by U+006E (n), and the Unicode special casing rules indicate that the uppercase form is U+02BC followed by U+004E (N). In other words, the typical rendering for this diacritic character should be identical to ’n and ’N.</p>
