  html: <p>Anybody knows if/how to design <a href="/wiki/kra" class="freelinking" rel="nofollow">kgreenlandic</a> &amp; <a href="/wiki/napostrophe" class="freelinking" rel="nofollow">napostrophe</a> as small capitals?</p>
comments:
  - id: 218332
    user: 19337
    date: 2007-08-09T14:22:00
    date_raw: 9 Aug 2007 — 2:22pm
    votes: null
    html: <p>The kgreenlandic (kra) has a lowercase form only. Good question as to what to use in a small caps setting (or in an all caps setting, for that matter). We'll need an expert to weigh in, but other than avoiding such a setting, my inclination would be to design a usual kra glyph that matched the height of the small caps (typically slightly higher than x-height) and another to match cap height. But that might be seen as incorrect by native users. Just looking at Minion Pro, I don't see anything other than the normal x-height kra. The kra is now replaced by "q".</p>
