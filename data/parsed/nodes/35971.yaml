      <p>I don't have any answer, but the problem applies to some other characters as well:</p>
      <ul>
      <li>01F0 - LATIN SMALL LETTER J WITH CARON</li>
      <li>1E96 - LATIN SMALL LETTER H WITH LINE BELOW</li>
      <li>1E97 - LATIN SMALL LETTER T WITH DIAERESIS</li>
      <li>1E98 - LATIN SMALL LETTER W WITH RING ABOVE</li>
      <li>1E99 - LATIN SMALL LETTER Y WITH RING ABOVE</li>
      </ul>
      <p>All these characters don't have a uppercase mapping in Unicode.<br>
      What should happen when the [smcp] feature is applied? Are they 'small capsed' and if - do they keep or lose their accents?<br>
      What should happen if the user switches to 'All-Caps'? Do i need a uppercase variant for the [case] feature as well?</p>
  - id: 218503
