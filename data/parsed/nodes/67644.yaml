    html: <p>Yes, they are, and it is a very interesting site in general. I had discounted most of his suggestions either because I thought that they tend not to have enough weight to deal with all the whitespace that is encountered in this sort of work (e.g. Bembo) or because I think they work better in book sizes (e.g. Adobe Caslon). I was therefore thinking about some which had a bit more presence on the page might be better. However, I might be overestimating the problem.</p>
