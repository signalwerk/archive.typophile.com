      <p>Nina, many thanks. Dolly might be another possibility, especially as it seems to look better in slightly larger sizes, but I think Fedra is probably a bit too funky (particularly the disconnected b).</p>
      <p>Incidentally, the main reason I was re-asking a similar question is that it seems that English rules and conventions are much less prescriptive than the the posters in that thread said that the American ones are. For instance, paragraphs are usually represented by p rather than ¶ and sections by s rather than §. There also isn't a particular issue with using old-style figures. English legal submissions also seem to be a bit less like the blocks of text you get in America which is why I thought a different typeface might be in order.</p>
      <p>sim, yes, I did think about that. Gill Sans is becoming quite popular and, to my eyes, works quite well in these situations. However, I think to use both a non-traditional typeface and a sans serif would be just a bit too unconventional which is why I'd prefer a serif.</p>
