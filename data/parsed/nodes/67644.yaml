    <p>I was wondering if anyone might be able to suggest some typefaces which might be suitable for use in legal work? I should start of by saying that I am based in the UK so, thankfully, I don’t suffer from the “you must use Courier” rules that seem to plague the American system. However, there are some fairly horrific formatting conventions which can make producing attractive documents difficult. For an example, have a look at <a class="freelinking external" href="http://www.bna.com/bnabooks/ababna/annual/2000/cox.pdf" rel="nofollow">this</a>.</p>
    <p>The main challenge is finding a typeface that has enough presence to look good: i) at reasonably large sizes; ii) where there is quite a lot of whitespace in inappropriate places; and iii) when there is quite large amounts of leading. </p>
    <p>I’ve been wondering about one of the modern old-style faces (if that’s the right description) that have appeared in the last few years. Something like Skolar or Leksa. I also quite like Calluna, and its price makes is particularly appealing.</p>
    <p>Does anyone have any thoughts on these options, or any other suggestions?</p>
    <p>Many thanks!</p>
