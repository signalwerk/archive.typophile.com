    html: |-
      <p>Have you read <em>Johnston's Underground Type</em> by Justin Howes?<br>
      That should give you some ideas.</p>
      <p>You could also compare Johnson's original drawings to old signage, old printed material (eg LT posters), and digital types.<br>
      There are significant differences between ITC Johnston and P22's version. Why?</p>
      <p>Johnston drew some variants of "g" that did not take, similar to Renner's Futura.<br>
      And so on.</p>
      <p>That narrows the focus, but still gives you plenty of scope to go deep.</p>
      <p>The particular reveals the universal, which is better than a broad overview with sweeping generalizations.</p>
