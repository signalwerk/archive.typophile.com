    <p>Hi,</p>
    <p>I am doing a project on san serif fonts for a research project, and wanted to ask you guys for some names of designers who have made successful typeface within the last 20 years. I have all the older more obvious designers, but my lecturer wants more recent guys even though she could not even name any, so if i can get some help with this that would be great.</p>
    <p>Thanks, Luke.</p>
