    html: |-
      <p>Thanks for the comments, people.<br>
      I’m waiting for a proper announcement of the redesign until the shop is up and running.</p>
      <p>The descriptive texts are history, there’s too much talk about type, people should just use it. That’s my new marketing philosophy, although I’m finding it difficult to restrain myself from blabbering on about the types in a couple of the PDF specimens. Memo to self: features, Nick, not cultural influences!</p>
      <p>The site was designed by Aleksey Liskovsky, who interned with me earlier this year.</p>
