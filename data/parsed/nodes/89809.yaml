    html: <p>Use a bigger UPM (like 4000). This will reduce the rounding errors that now cause your deformations. Or use Glyphs (<a href="/wiki/glyphsapp.com" class="freelinking" rel="nofollow">glyphsapp.com</a>) where you can disable rounding altogether.</p>
