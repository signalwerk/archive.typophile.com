    <p>Hi, guys first time posting and i was wondering if can help me, i'm currently building my first typeface, and i can't figure out a solution to the problem in hand. Here's my process, if it helps:<br>
    1 - created paths in illustrator<br>
    2 - imported to fl<br>
    4 - expand it<br>
    5 - created the round endings on the straight lines.</p>
    <p>The problem exists when i try to create the round endings on a diagonal line, it just won't look right, i've even tried to make a straight form and then rotate it, but the round endings deform, is there a way to make the round endings look good?</p>
