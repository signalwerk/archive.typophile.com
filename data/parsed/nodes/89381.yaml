  html: <p>I just learned of the concept of kerning. Now I am curious about whether one can change kerning in a typical word processor, like Word or MS Works. I do not see a kerning function in my MS Works. What is the nature of this adjustment? Must it be built into the font itself? Are there any programs that allow one to change kerning in a given font? Any general insight would be appreciated.Now that I know of this variable, I would love to be able to change it.</p>
