    html: <p>Kerning data is typically built into a font indeed, but it’s not a requirement in any way neither for the font to provide it nor for the app to use it. Typesetting apps usually use font’s kerning data by default if available, but can of course also impose any user tweaks or even run its own kerning algorithms. But that’s for the typesetting apps, text processors are entirely different story…</p>
