    html: |-
      <p>Kerning has been supported in the Windows version of Word (and probably the Mac version too), since like forever, select "Fonts", "Advanced", and select the size at which kerning turns on. Kerning has been "on" by default in PowerPoint for at least the last two releases. </p>
      <p>Changing the kerning values built into a font is a different story. If there's a letter combination that you don't like you can turn off kerning and use tracking (called spacing in the same Word menu) to adjust the space between a pair or group of characters.</p>
