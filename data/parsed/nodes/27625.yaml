      <p>Hi Dan</p>
      <p>Well there is <a href="http://www.linotype.com/1490/spartan-family.html" rel="nofollow">Linotype Spartan LT,</a> which has what you might call a regular question mark, like the one in the sample on ebay.</p>
      <p>You might also have a look at <a href="http://www.linotype.com/308/dinneuzeitgrotesk-family.html" rel="nofollow">Neuzeit Grotesk Light.</a></p>
      <p>There again it depends on what you mean by 'nice'; as it says in the full font name for Spartan this is a face designed for classified advertising at about 5pt. In other words its a bit like Bell Gothic in terms of its initial design function. Consequently all of the Spartan letterforms look really distorted when compared to the Futura model it was taken from. </p>
      <p>You could look at R. H. Middleton's Ludlow Tempo or Gerald Giampa's revival of <a href="http://www.p22.com/lanston/products/twentiethcen.html" rel="nofollow">Lanston Monotype Twentieth Century.</a></p>
      <p>IMHO, the idiosyncracy of the question mark in Futura is a small price to pay for the correct proportions of the rest of the face... especially in the capitals.</p>
      <p>If you think the question mark is that bad you could always have a go at drawing your own.</p>
