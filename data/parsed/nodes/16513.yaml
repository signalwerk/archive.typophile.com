  html: |-
    <p>Fontlab is doing odd things when I compile my open type feature ( calt ).</p>
    <p>1. While in unicode mode ( Unicode on the left &amp; Latin A on the right, I was adding Latin A characters ) it removed the outlines form hbar glyph when I re-compiled my now altered calt feature. The odd thing was that I had no reference to 'hbar' in the code!</p>
    <p>Should I start a new font &amp; paste my content into it? I have heard some folks on Typophile talk about a source file going bad &amp; needing to do this.</p>
    <p>Now that I am in Names &amp; Mac Roman mode again compiling my calt feature didn't wipe out the hbar outlines. It did find a missing Quotesingle glyph. Could that have been wiped out when I went into Unicode mode to add the latin A?</p>
    <p>Are there safer &amp; less safe modes to compile features in Fontlab?</p>
    <p>And actually, what is the recommended roundtrip process ( with emphasis on mode changes ) for adding unicode glyphs &amp; then testing them?</p>
