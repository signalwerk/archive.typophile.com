    html: |-
      <p>Eben, it could be that there are some Unicode indices assigned to your alternates which actually map to real glyphs. You need for any alternate glyphs to be Unicode indexed to Private Use Area numbers, or to have no indexing at all. (If you only want the glyphs to switch out under calt conditions, you need no indices, but if you want to be able to select them from Glyph palettes, they need to have indices.)</p>
      <p>I have noticed that sometimes when I cut and paste glyphs, some of the cut information makes it into the new location. Look out for any glyphs whose Unicode is out of order, then check the name and index, and if need be, regenerate the name and/or Unicdoe using the Glyph Properties panel.</p>
