    <p>Hey guys,<br>
    Here is something I've been working on. This is my first sketch and I could use any help. </p>
    <p>CONCEPT<br>
    I wanted to create an elegant face based on the very curvy physique of swans. For inspiration, I am refering to Baskerville and the occasional Bodoni.</p>
    <p>LINK (its in flash so you can zoom in)<br>
    <a href="http://prakashnair.com/secret/hamsa/hamsa.pdf" title="http://prakashnair.com/secret/hamsa/hamsa.pdf">http://prakashnair.com/secret/hamsa/hamsa.pdf</a></p>
    <p>Thanks,<br>
    Prakash.</p>
