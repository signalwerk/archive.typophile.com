      <p>Great font!</p>
      <p>It definitely has a lot of curvy enegry to it. I am a beginner, so take my comments with a grain of salt.</p>
      <p>The upper curve of the 'a' may be a bit too heavy shouldered. The 'g' has a lot of character. Its lower ear may be a bit too heavy and its upper right section looks a bit too rectangular. What about starting the curve of the 'f'-hook a bit lower in its stem. Now it seems a bit abrupt. </p>
      <p>Hope this makes sense.</p>
      <p>Sebastian</p>
