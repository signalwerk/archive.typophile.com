      <p>Almost all of the letters looked like they had been cut off right at their baseline and x-height. Is that your intention? That could also be due to low resolution. Care to give us a PDF of higher resolution?</p>
      <p>Also, the <em>s</em> look rather imbalanced and the stroke on the upper part of <em>f</em> need to be thinned -- like Rotis' c, it is in danger of falling over, albeit much less so. But I dig the <em>g</em> :)</p>
      <p>Any possibility of using the face at text size? It looked robust enough to me.</p>
