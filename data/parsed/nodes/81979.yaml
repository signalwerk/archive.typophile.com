      <p>just did this with Win7 64bit, python 2.4.4 (32bit) and robofab599 in an admin account.</p>
      <p>depending on where you have installed python, fontlab and the robofab folder, windows will protect changes done by other programs, so the setup routines etc. just don't do anything (but you don't get a warning about this).</p>
      <p>so make very sure - even if you have an admin account running - that your python command shell (python.exe) is executed with administrator rights (rightclick&gt; properties &gt; compatibility &gt; run as admin) before doubleclicking the install scripts.  also make sure your text editor is running in admin mode when editing the path files.</p>
