      <p>Hi,</p>
      <p>Just installed RoboFab on XP myself and indeed it wasn’t completely straightforward. Especially getting FontTools to work required manual editing of a file. Here are my steps:</p>
      <p>1. Python 2.4.4<br>
      <a class="freelinking external" href="http://www.python.org/download/releases/2.4.4/" rel="nofollow">http://www.python.org/download/releases/2.4.4/</a><br>
      download: "python-2.4.4.msi"<br>
      Run the downloaded file</p>
      <p>2. NumPy<br>
      <a class="freelinking external" href="http://sourceforge.net/projects/numpy/files/NumPy/1.2.1/" rel="nofollow">http://sourceforge.net/projects/numpy/files/NumPy/1.2.1/</a><br>
      download: "numpy-1.2.1-win32-superpack-python2.4.exe"<br>
      Run the downloaded file</p>
      <p>3. Robofab+FontTools+DialogKit<br>
      <a class="freelinking external" href="http://robofab.org/download/index.html" rel="nofollow">http://robofab.org/download/index.html</a><br>
      download: "RoboFab + FontTools + DialogKit Combo"<br>
      Unzip file and place it in Program Files directory. I also shortened its name to "RoboFab226"</p>
      <p>4. Robofab install<br>
      Go the the abovementioned "RoboFab226" directory, open the "RoboFab" directory and either:<br>
      – double click: install<br>
      – or open the Command Prompt and use C:\Python24\python.exe "C:\Program Files\RoboFab226\RoboFab\install.py"</p>
      <p>5. DialogKit install<br>
      Go the the abovementioned "RoboFab226" directory, open the "DialogKit" directory and either:<br>
      – double click: install<br>
      – or open the Command Prompt and use C:\Python24\python.exe "C:\Program Files\RoboFab226\DialogKit\install.py"</p>
      <p>6. FontTools install<br>
      Go to C:\Python24\Lib\site-packages<br>
      Open "dialogKit.pth" in a text editor<br>
      Replace its text by "C:\Program Files\RoboFab226\FontTools\Lib"<br>
      Save the file as "fonttools.pth"</p>
      <p>Now open FontLab,<br>
      check in the properties window if Python is installed (otherwise you might need to check the FontLab preferences)<br>
      open a new macro window ("Edit macro")<br>
      type "from robofab.world import world ; print world"<br>
      and run it.</p>
      <p>Hope this helps!</p>
