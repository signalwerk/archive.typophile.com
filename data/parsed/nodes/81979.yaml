    html: |-
      <p>In case someone is installing Robofab with FontLab 5.2 without any luck, try this (following the above steps):</p>
      <p>1. Python 2.7.x</p>
      <p>2. Numpy 1.7.1 (or later) for python 2.7.x</p>
      <p>3. RoboFab 599 (or later) with all dependencies (plusAllDependencies zip file)</p>
      <p>4. Same</p>
      <p>5. Same (when saving the fonttools.pth file select the ANSI encoding system, others like UTF-8 may cause errors later)</p>
      <p>6. Run the code, you should get something like this:<br>
      "Robofab is running on win32, Python version: 2.7, Mac stuff: None, PC stuff: True, FontLab stuff: True, FLversion: 5.2.1.4868, Glyphs stuff: False, Glyphs version: None, RoboFont stuff: False, RoboFont version: None"</p>
      <p>If you get any Traceback or Import Error is because there is something wrong with Python installation or the other libraries, so you must try again.</p>
      <p>Ah, don't copy the Robofab Scripts folder, instead copy the folders inside the Scripts folder (Fontlab can't read macros that are on folders inside folders) and paste in the macros folder (may be on this address: C:\Users\UserName\Documents\Fontlab\Studio 5\Macros). Check the scripts with the Macro toolbar (inside FontLab, go to View/Toolbars/Macro).</p>
      <p>Many thanks to pvanderlaan! ¡Buena suerte!</p>
      <p>Note: If you came to this post from this another in the FontLab forum: <a class="freelinking external" href="http://forum.fontlab.com/index.php?topic=8750.0" rel="nofollow">http://forum.fontlab.com/index.php?topic=8750.0</a> please be sure to follow this updated steps first. The FontLab forum post cited the steps published in 2011.</p>
