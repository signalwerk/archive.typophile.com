  html: |-
    <p>We recently created a <a class="freelinking external" href="http://www.flickr.com/groups/typographic_t-shirts" rel="nofollow">new flickr group</a> called Typographic T-Shirts.  It's a group for all typographic themed gear, not just ours. We've had over 100 photos submitted in just two weeks covering some of the best tees for designers out there.   </p>
    <p>Type t-shirts seem to be more popular each day and it's a very friendly community of competitors. Several of them have joined our group and we hope that it might become a definitive compendium of the genre.</p>
    <p>We've also got a flickr group for our buyers:<a class="freelinking external" href="http://www.flickr.com/groups/typographyshop_tees" rel="nofollow">TypographyShop Tees</a>  We'd love to see more shots there if you've bought one of our shirts.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/flickrgroup_4629.jpg"></div><p></p>
