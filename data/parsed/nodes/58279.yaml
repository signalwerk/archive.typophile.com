  html: <p>What syntax must I use to create a metrics.txt entry for numbers? And is the syntax for metrics.txt documented somewhere?</p>
  html_clean: <p>What syntax must I use to create a metrics.txt entry for numbers? And is the syntax for metrics.txt documented somewhere?</p>
