    <p>Esteemed Typophiles,</p>
    <p>We're taking the site offline today at 5pm to perform a much-needed server upgrade. Typophile will be down for the duration of the weekend so we can perform all sorts of exotic tests, and we're planning to bring everything back online on Monday, 29 August.</p>
    <p>Enjoy your weekend! </p>
    <p>//Jared, Joe and Zara</p>
