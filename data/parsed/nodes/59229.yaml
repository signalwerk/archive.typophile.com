    html: |-
      <p>Following a thread here a while ago with contributions from John, among others, I figured this out for FontLab:</p>
      <p>Case feature:</p>
      <p>  sub Iota by iota;<br>
        sub @UCtonos iota' by Iotadieresis;<br>
        sub iota by Iota;<br>
        sub Upsilon by upsilon;<br>
        sub @UCtonos upsilon' by Udieresis;<br>
        sub upsilon by Upsilon;<br>
        sub @UCtonos by @UCnotonos;</p>
