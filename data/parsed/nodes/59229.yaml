    <p>Hi there<br>
    I have been doing a case feature for Greek diacritical characters, so that the diacritical characters are replaced with the non-diacritical characters when the string is in uppercase. As you can see it works fine in the Fontlab preview panel:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fontlab_5573.png"></div><p></p>
    <p>But in InDesign (CS4) it keeps the dieresis and converts the tonos+dieresis into UC dieresis (I marked them in magenta). Is that an InDesign override, that acually makes it the way it should be? Or what?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/indesign_5049.png"></div><p></p>
    <p>Thanks<br>
    Claus</p>
