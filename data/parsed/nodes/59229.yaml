      <p><code>lookup smcp1 {<br>
      	sub [Alphatonos Epsilontonos Omicrontonos Omegatonos alphatonos epsilontonos omicrontonos omegatonos] iota' by iota.smcp.alt;<br>
      	sub [Alphatonos Epsilontonos Omicrontonos Omegatonos alphatonos epsilontonos omicrontonos omegatonos] upsilon' by upsilon.smcp.alt;<br>
      } smcp1;</code></p>
      <p>sub @GrSmcp1 by @GrSmcp2;</p>
      <p>sub @UCtonos' @GrSmcp2 by @UCnotonos;<br>
      sub iotadieresistonos by iotadieresis.smcp;<br>
      sub upsilondieresistonos by upsilondieresis.smcp;<br>
      } smcp;</p>
    html_clean: |-
      <p><code>lookup smcp1 {<br>
      	sub [Alphatonos Epsilontonos Omicrontonos Omegatonos alphatonos epsilontonos omicrontonos omegatonos] iota' by iota.smcp.alt;<br>
      	sub [Alphatonos Epsilontonos Omicrontonos Omegatonos alphatonos epsilontonos omicrontonos omegatonos] upsilon' by upsilon.smcp.alt;<br>
      } smcp1;</code></p>
      <p>sub @GrSmcp1 by @GrSmcp2;</p>
      <p>sub @UCtonos' @GrSmcp2 by @UCnotonos;<br>
      sub iotadieresistonos by iotadieresis.smcp;<br>
      sub upsilondieresistonos by upsilondieresis.smcp;<br>
      } smcp;</p>
