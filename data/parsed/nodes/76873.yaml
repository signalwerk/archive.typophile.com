      <p>Actually, what I was thinking is that you can create a paragraph style in InDesign where, in the Justification settings, the minimum and desired wordspacing is "0%". I tried it and it works. The spaces collapse to zero, but still work as line-break opportunities. No need to create a temporary zero-space (or near-zero-space) character in the font.</p>
      <p>The only trick is to insert a space between every glyph.</p>
