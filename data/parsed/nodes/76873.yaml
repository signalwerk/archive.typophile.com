    html: |-
      <p>Dezcom, although this is not exactly what you want, here is the solution I use (sorry for the screens in Portuguese):</p>
      <p><strong>1</strong>. With your text already set, do a GREP replace operation using the settings bellow. This will insert a hair space between each one of your characters.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/capture_12022010_010609_6201.gif"></div><br>
      .<br>
      <strong>2</strong>. To avoid additional spacing, you can set a GREP style to be applied for every hair space. In this case, I just created a character style ("Space") and set it with a –25 tracking.<br>
      .<br>
      <div class="imageWrap"><img src="http://typophile.com/files/capture_12022010_010639_4542_6386.gif"></div><br>
      .<br>
      I used a hair space instead of a regular one in order to apply negative tracking just for these situations. So the GREP style will preserve other spaces you use.<br>
      .<br>
      These two steps can be automated. You can save the GREP replace command and reapply it to any text, while the styles with GREP can be imported from one ID publication to another.<p></p>
    html_clean: |-
