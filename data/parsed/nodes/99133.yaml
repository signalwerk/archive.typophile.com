      <p>@hrant: Bringhurst calls Alcuin "admirable" in his first reference, where he's suggesting fonts designed by women (in this case, Gudrun Zapf-von Hesse). He later decribes it as "a strong and graceful Carolingian face". So I doubt that Bringhurst would find its use embarrassing. YMMV.</p>
      <p> - Herb</p>
