      <p>Without an image it's hard to tell - particularly if the people you're asking don't have a copy of whatever it is you have. I happen to have a copy, but have no idea whether it's the same edition, or the same printing, or whether the hardback, or its dust jacket and the paperback versions are the same.</p>
      <p>[Just giving you a hard time!] MY copy, which is the paperback edition, Version 3.1, published by Hartley and Marks, printed by C&amp;C in Hong Kong, appears to have the book title in some version of <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/alcuin-lt/light/" rel="nofollow">ALCUIN</a> or Alcuin Light.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Bringhurst_3954.jpg"></div><br>
      It's surprising that the colophon doesn't include the book cover information.<br>
       - Herb<p></p>
