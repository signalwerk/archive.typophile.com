      <p>Thanks, both of you, for taking the time to comment. I'm currently preparing this for a final (not finished, but something to show for a crit in class) and I'm making sure that stroke weights are more consistent, that my cap heights are right on, and trying to make the M and N look like they weren't afterthoughts.</p>
      <p>Thanks again, and I'll post an update hopefully packed with more charm and some much-needed consistency.</p>
