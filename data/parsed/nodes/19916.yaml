    html: <p>It's lovely, but there are some dubious stroke weights. The heavy diagonal of the K is the most out of place. There are others that just seem to be accidents, like the slightly thinner vertical of the t. Over all, I like your shape choices, except for the x... you should probably just do the x over.</p>
