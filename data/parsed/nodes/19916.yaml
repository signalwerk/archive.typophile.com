    html: <p>I added a new PDF of where I'm currently at with my type experiment. I appreciate the feedback and will most likely keep playing with it as well as starting a new set based on a lot of the knowledge I acquired with this experiment. I just graduated and will be moving across the country though, so type will have to wait a bit while I find a place to live and a job. I'm still open to comments and I appreciate those already made.</p>
