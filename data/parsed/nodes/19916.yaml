    html: |-
      <p>Here is my 2 cents:</p>
      <p>I think the ear on the g should be stronger &amp; more whimsical looking. I might try the lower foot of the k to start with. The G bothers me. It doesn't seem to fit with the rest of the face. Perhaps if it wasn't so closed. There is no reason it HAS to look quite so much like the cap C really. The cap C could be a bit more open too come to that. The Q's tail seems weak to me. The cap K might take up more room. In terms of overall effect, I think a bit more contrast all around using the lovely foot of the k &amp; the leg or the cap R as guides would make the face come alive. I think this face could be tasty - but it needs more verve - more juiciness. One that is in place you can always make a thinner version. As things stand this face is a little too much of a wallflower. It has potential though. I hope you keep working it.</p>
