    date: 2006-05-18T10:43:00
    votes: null
    html: "<p>this is a bit weird. it's almost like 3 typefaces thrown together. you have your plain letters: M,N,O,Q,V,W,X,Y; your slightly decorative letters: A,C,E,F,H,L,T,U; and the over-the-top designed letters: B,D,G,K,P,R,S. Some divergence is no problem, but here i think you have too much. Try to harmonize the letters to a certain standard of decoration with a handful being a bit more decorative. just my 2 cents.</p>"
