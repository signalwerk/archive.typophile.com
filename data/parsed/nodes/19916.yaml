    <p>I've been lurking around this forum reading some really great/helpful conversations about type and I'm nervously putting my experiment on the chopping block. I'm a senior graphic design student on the verge of graduation and I tried to take on designing a typeface for my senior project. I'd really appreciate any feedback (minor or drastic, friendly or angry) on this, particularly what is lacking or could really strengthen or unify it. My goal was to create a face that referred to the foundational calligraphic hand I've been learning while looking more solid and geometric in form as opposed to hand-drawn calligraphy.</p>
    <p>Thanks in advance for ANY comments.</p>
