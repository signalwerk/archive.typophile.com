    <p>I'm consulting with an Armenian publication that's finally giving in to Unicode. Their layout person is a Quark veteran, and they're worried about the move to InDesign. Are there books, tutorials, seminars, converters, testimonials and such that you'd recommend for easing the transition?</p>
    <p>hhp</p>
