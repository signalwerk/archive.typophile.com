    html: |-
      <p>I have had a fair bit of experience dealing with files held in older versions of Quark, up to version 4.11 (at which point content was moved to InDesign CS) including the dreaded Passport version and its unreliable dongles. I have also encountered plug-ins that supported multi-part CJK Postscript fonts, but those were pretty much a lost cause in terms of encoding to encoding conversion. </p>
      <p>Earlier versions of InDesign including CS2 (and possibly later) included native support for certain Quark files, including versions 3-4. This was handled in a Mac OS X environment when it still included support for Classic mode (pre 10.5). With more information I would be happy to lend any insight to the process, as it was incredibly frustrating but extremely rewarding when things worked!</p>
