    html: |-
      <p>A decent converter from Quark files to InDesign is made by Markzware Q2ID</p>
      <p><a href="http://markzware.com/q2id/q2id-cs6-windows-released-convert-quarkxpress-indesign-cs6/" title="http://markzware.com/q2id/q2id-cs6-windows-released-convert-quarkxpress-indesign-cs6/">http://markzware.com/q2id/q2id-cs6-windows-released-convert-quarkxpress-...</a></p>
      <p>I only have the CS4 version which does a decent job although sometimes text that is vertically centred in a text box will shift.</p>
      <p>You can also set the shortcuts to Quark (Edit&gt;Keyboard Shortcuts) which is a little hit and miss.</p>
      <p>Tim</p>
