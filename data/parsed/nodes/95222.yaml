      <p>I'll double-check but I believe their Quark is 5. The latest it could be is 7. They use a custom Armenian hyphenation plug-in (which works with a variant of the legacy ArmSCII-8 encoding).</p>
      <p>They'll be switching to InDesign CS6, essentially because of this:<br>
      <a href="http://typophile.com/node/94478" title="http://typophile.com/node/94478">http://typophile.com/node/94478</a></p>
