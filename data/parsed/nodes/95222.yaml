    html: <p>They may want to temporarily hire an experienced InDesign person as a consultant to help out with the first few publications created in InDesign, and to do some one-on-one tutoring, just as a temporary help to their own designer as he learns the application. It's a complicated program and it'll take him a while to get proficient and comfortable with it.</p>
