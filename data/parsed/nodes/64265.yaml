      <p>Robert, It's all personal. Don't believe all that stuff in the mafia movies about the difference between what is personal and what is business. </p>
      <p>One thing about a EULA that you should remember. There is usually a clause in there that indicates the agreement can change anytime the holder of the IP desires it to. So if you license fonts under the terms of a EULA#1 from Type House A and Type House A later changes the terms of EULA#1 to be more restrictive, those new terms apply to your previously licensed fonts.</p>
      <p>Thank you for your concern about my EULAs. Mine are all in order. What ITC does is ITC's business. Just one more reason I'll never sub-license my fonts to a third party again. The fonts in the Indie fonts book all have their own separate EULAs. At least I provided one to accompany the Rawlinson font. That feel good statement you quote is not a EULA.</p>
