      <p>James - at least I'm guessing this is James, since people tend to not sign their posts around here - I do understand the contractual nature of a EULAs. The whole purpose for asking these questions is to make informed choices about which foundries I should engage.</p>
      <p>You say that your EULA your forbids use in political or religious contexts without prior written permission. (The reasons behing that would make an interesting thread of its own.) You are entitled to make that restriction, but I tell you from my perspective that such a restriction will keep me away from your product. I don't want to have to try to remember which of the hundreds of fonts in my library may gum up the works if I have shown it to a church or mayoral candidate and they decided it is the only font for their logo. It's just simpler to not have any Terminal fonts in my library so that mistake is not made. </p>
      <p>FYI, in a perusal of MyFonts.com, I find your font Rawlinson. When I view the buying options it takes me to:</p>
      <p><a href="http://new.myfonts.com/fonts/terminaldesign/rawlinson/buy.html" title="http://new.myfonts.com/fonts/terminaldesign/rawlinson/buy.html">http://new.myfonts.com/fonts/terminaldesign/rawlinson/buy.html</a></p>
      <p>The pre-purchase license agreement there states:</p>
      <p><strong>Indie Fonts License Agreement</strong></p>
      <p>The CD-ROM included with this Indie Fonts book features fonts licensed for use by the owner of the book. The individual foundries with fonts on the CD-ROM spell out the exact terms of their respective license agreements.</p>
      <p>As with all licensed software, the re-distribution, or “sharing” of these fonts is discouraged -- it is ultimately not benefificial to the designers of the typefaces. We encourage you abide by the terms of use set forth by each foundry represented in this publication, and the rest of the talented type makers hard at work throughout the world.</p>
      <p>Please support these artisans so that they may continue in their efforts to provide us with those essential tools of creativity and communications -- new typefaces.</p>
      <p>Please design safely.</p>
      <p>So your font is being sold without your prerequisite being stated prior to purchase. </p>
      <p>In another instance, your font ITC Nora is listed at MyFonts.com as not for sale there and links forward to International Typeface Corporation. That page says nice things about your wife, but nothing about your desired restrictions. I went as far as searching the ITC site for EULA and got nothing specific. I set up an account and put the font in the shopping cart and still could not review the EULA for your font. I stopped short of adding credit card data because I did not intend to purchase the font and it was not clear that I would be able to cancel the order prior to being charged.</p>
      <p>So you state you have a condition and here are two instances where I could have unwittingly made a purchase, having exercised due diligence in reviewing the terms, without knowing I was getting a use-limited font - and I would have been pissed if I had.</p>
      <p>You might want to review your contracts with your distribution outlets.</p>
      <p>Robert</p>
