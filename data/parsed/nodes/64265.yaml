      <p>While there is no such thing as a "standard commercial-use EULA" (nealy every foundry’s is slightly different), it's probably fair to say that <em>most</em> will allow you to use a font for a logo whether or not you modify the lettershapes. Exceptions are usually in the case of dingbat/symbol fonts from which logos or other products are prohibited without an extended license.</p>
      <p>What <em>most</em> foundries won't allow is the editing of the fonts themselves in a font editor without permission.</p>
