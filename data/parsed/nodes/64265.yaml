      <p>Guys....GUYS! I know what a EULA is. I know why a EULA is. I know one size does not fit all (though I still believe some industry standard form with areas for terms and condition unique to each foundry would go a long way to understanding and compliance). I also get why they can be alternately described as complicated, vague and user-unfriendly. I know that I am not buying, but rather licensing the right to use something called font software and that it comes with proprietary information and defensible IP rights. </p>
      <p>The question - which I believe was stated pretty clearly - that hasn't been answered is: <strong>Would the above examples and procedures shown above be considered permissible use of the font software your business currently offers for licensing under your standard commercial EULA?</strong> </p>
      <p>The folks from Greater Albion answered the question directly in <a href="http://typophile.com/node/64235" rel="nofollow">another thread</a>. I've licensed their font and have put them on the list of foundries to visit when I am in search of a new font. That is my personal goal here - to learn which foundries offer terms compatible with my work process and to support them. I'm doing it in this forum rather than direct email so that the information might be available to other designers who have the same questions.</p>
      <p><strong>James:</strong> Sorry you are unhappy with your sub-licensing experience. We all get screwed from time to time, with no kisses. My credit card company changes the terms of our contract constantly. They go through the expense of notifying me by mail and it is up to me to read the five point text to see if they've changed anything with which I do not agree and decide if I need to act on that change. My contracts with clients state that any changes need to be in writing and agreed to by the parties. I hope that any foundry or font designer who wishes to change their terms would do something similar, rather than just make the change with no notification to those affected. (/James)</p>
      <p>I'm really just trying to be the good citizen here.<br>
      Robert</p>
