      <p>One thing you have to keep in mind is that a EULA is a contract. One that the end user chooses to enter into when they purchase the font license. </p>
      <p>The owner of the IP governed by the EULA can put any terms they want into that contract. For instance our EULA forbids using our fonts for political or religious uses without written permission. </p>
      <p>And while you may feel that EULAs are vague, also remember that they are written for the court. Hence they are, most likely, not vague at all (if they are written properly) but may use language that is not familiar to you. But then again, you are not the court.</p>
