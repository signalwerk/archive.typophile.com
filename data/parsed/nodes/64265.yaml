    html: "<p>Here's the thing: The reason there's no such thing as a standard EULA is because there is no standard business model in the font business. The EULA is the embodiment of a font vendor's business proposition with the customer. When you \"buy a font\" you're not actually buying a font. You're buying the right to use a font according to the terms of the EULA. What you're paying for is whatever the EULA says, not \"a font\". The font developer (usually) is the owner of the font. The \"font buyer\" is simply licensing it for some use. The EULA is meant to cover the most typical uses so that it doesn't need to be negotiated for every case. Yes, this makes things a bit complicated for the customers, but the alternative (negotiating every license) would be crazy. An \"industry standard EULA\" would also be crazy. The system, such as it is, exists because it works reasonably well for both sides.</p>"
    html_clean: "<p>Here's the thing: The reason there's no such thing as a standard EULA is because there is no standard business model in the font business. The EULA is the embodiment of a font vendor's business proposition with the customer. When you \"buy a font\" you're not actually buying a font. You're buying the right to use a font according to the terms of the EULA. What you're paying for is whatever the EULA says, not \"a font\". The font developer (usually) is the owner of the font. The \"font buyer\" is simply licensing it for some use. The EULA is meant to cover the most typical uses so that it doesn't need to be negotiated for every case. Yes, this makes things a bit complicated for the customers, but the alternative (negotiating every license) would be crazy. An \"industry standard EULA\" would also be crazy. The system, such as it is, exists because it works reasonably well for both sides.</p>"
