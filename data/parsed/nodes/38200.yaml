    html: |-
      <p>&gt;diagonals generally have to be heavier than verticals to make them look the same weight</p>
      <p>Are you measuring the width at right angles to the stroke, or along the horizontal axis? In Adobe Garamond Pro, for example, the width of the thick stroke of the X at right angles to the stroke is about 77, narrower than the stems of the H, at 82. If you measure the breadth of that same heavy diagonal of the X horizontally, that measurement is bigger than the stem, at 96.</p>
      <p>Especially because diagonals are often tapered, there is no simple rule on this that I know of.</p>
  - id: 234055
    user: 9636
    date: 2007-10-18T07:02:00
    date_raw: 18 Oct 2007 — 7:02am
    votes: null
    html: |-
      <p>If you're measuring the diagonals in the horizontal direction (parallel to the baseline), then there can't be a rule to follow.<br>
      That distance would change depending on the angle of the stroke: the more upright the diagonal, the closer the distance would be to a vertical stem width, the less upright the diagonal, the wider that distance would be.</p>
      <p>For instance, the angles of diagonals are usually different in K, k, w, v, etc. Even if each of those strokes had exactly the same weight (measuring at a right angle to the stroke), each would measure differently in a purely horizontal measurement.</p>
      <p>Jason C</p>
  - id: 234060
    user: 19337
    date: 2007-10-18T08:04:00
    date_raw: 18 Oct 2007 — 8:04am
    votes: null
    html: <p>You have to measure the thickness of a diagonal stroke at right angles to the angle of the stroke. As the eye perceives a horizontal line to be thicker than a vertical one of the same actual thickness, horizontals have to be made a bit thinner to appear optically the same. A diagonal being somewhere in between horizontal and vertical, it will generally also need to be slightly thinner than a vertical to match the optical thickness of the vertical. The eye is the best judge of how much in any particular circumstance.</p>
