    votes: null
    html: |-
      <p>Coronet itself was designed in 1937 by R. H. Middleton. Ribbon 131 is just the Bitstream name for their digitization of the metal type design.</p>
      <p>You're right that it is pretty close to the Jaguar lettering, and maybe Coronet was the starting point used by whoever designed the Jaguar logo back then. The J and r are quite different, but the a, g, and u could almost be from Coronet.</p>
      <p>- Mike Yanega</p>
