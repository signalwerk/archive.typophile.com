  html: <p>This one was on the cover of a shop manual. It was used often in magazine adverts. The calligraphic consistency is very cleanly broken into individual characters, and the "J" style throws me every time I have seen it since 1963. </p><div class="imageWrap"><img src="http://typophile.com/files/fontjaguar_3830.gif"></div><p></p>
