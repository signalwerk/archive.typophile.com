  html: "<p>ROUGE:  A display font.  Used as a logotype and then expaned to a full character set.  The intentions are that of a display face for titles and labels.  I have tried to build alternate characters with the intention that they be used as MINIMAL accents to the Regular face.   <br>Please feel free to comment</p>"
