    html: <p>I like this. Lots of fun options too. <br> <br>I like to think of type (in one sense) like legos, something you can play/build with. The more options/pieces you have, the greater variety of things you can build. Something like that. <br> <br>I would consider smoothing out the swash decenders/ascenders in the alternate set. Some of them are nice and smooth (like the A), but most seem to have some anchor-point bumps in there. I attached an image, so hopefully you'll see what I mean. Granted, they are tricky to get out, but resolving this makes your face much more professional. <br> <br>Have you made any progress since posting this? <br> <br>r. <br> <br><img src="http://www.typophile.com/forums/messages/29/16721.gif" alt="Swash Problems.gif"></p>
