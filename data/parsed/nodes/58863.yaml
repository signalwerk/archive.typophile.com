    html: |-
      <p>@christopher<br>
      ul and dl are "container" HTML elements. That means they're designed to describe syntactically and encase other elements.<br>
      UL means unordered list and holds LI - list items. It doesn't hold text on it's own.<br>
      DL - same thing. Means definition list and holds dt and dd elements.<br>
      The comments parser that Typophile uses is just guessing at what to with the text within a UL or DL tag but yet outside of a LI or DT or DD tag.</p>
      <p>Regards,<br>
      rich</p>
