      <p>So we have:<br>
      </p><dl>
      <dt><code>&lt;dl&gt;</code></dt>
      <dd>Definition List</dd>
      <dt><code>&lt;dt&gt;</code></dt>
      <dd>Term being defined</dd>
      <dt><code>&lt;dd&gt;</code></dt>
      <dd>Definition of the term</dd>
      </dl>
      <p></p><p>The usage is something like:<br>
      <code>&lt;dl&gt;&lt;dt&gt;Term&lt;/dt&gt;&lt;dd&gt;Definition&lt;/dd&gt;&lt;dt&gt;&lt;/dl&gt;</code><br>
      —Joel</p>
