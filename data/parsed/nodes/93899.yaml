    html: |-
      <p>I always recommend ﬁnding a text-heavy old advertisement from the days of letterpress, one with roman, small caps and italics and some justiﬁcation, and attempting to create a facsimile digitally.</p>
      <p>First, you have to identify the typeface (Matt McGrew will help), and ﬁnd one which has a corresponding digital version, then set it in InDesign. The H&amp;Js are particularly tricky.</p>
      <p>Sure, this is old school print stuff, but typographic sophistication is increasing on screen, and the point of the exercise is to develop an eye for ﬁne distinctions, and practical taste, through solving subtle visual-technical problems.</p>
      <p>In fact, why not try to duplicate the document in html?</p>
