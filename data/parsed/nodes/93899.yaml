    <p>Hey All</p>
    <p>I'm a graduate designer struggling to find work. I realise that my work is lacking in taste and creativity, I'm okay at the ideas side of thing it's just the more artistic attributes of scale, rhythm and negative space that I struggle with.</p>
    <p>I was wondering if anyone else ran into these problems outside of uni and what you did to overcome them. Are there any exercises I can do to improve my art skills, I draw everyday on trains and read through typography manuals in a desperate attempt to get better but I just feel I'm lacking that edge.</p>
    <p>Thanks in advance<br>
    Andrew</p>
