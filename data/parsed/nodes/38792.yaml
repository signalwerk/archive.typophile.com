    html: |-
      <p>Well, looking at the wobbles, I would get some practice with the bézier tools first. I do not mean to offend you of course, but it seems you haven't worked with béziers very often, hence they look wobbly. It really takes some practice to get it right. I could suggest <a class="freelinking external" href="http://www.amazon.com/Logo-Font-Lettering-Bible-Comprehensive/dp/1581804369" rel="nofollow">Leslie Cabarga's book 'Logo, Font &amp; Lettering Bible'</a>, which has some very easy to understand explanations on how to work with béziers. Things like; minimize the amount of nodes or keeping bézier handles straight as much as possible (i.e. horizontal and vertical), etc. I think it's about US$20, so that's not too bad.</p>
      <p>Looking at your PDF, I think you probably have too many nodes, and also nodes with only one bézier handle. It's impossible to get smooth curves this way.</p>
      <p>Briem's site is also a nice source indeed, which also discusses béziers a bit I think. If you search google on bézier curves you will probably find more handy tips and tutorials.</p>
