    <p>Well, I've started on my digitization of "Venetian" from the 1923 ATF catalog/specimen book. I'd like comments on what I've doing right (so far) and what I'm doing wrong. I'm especially interested in hints as to how I might avoid some of the "wobbles" that seem to have creot into the C D and E and on how I should go about keeping the serifs a bit more "uniform"</p>
