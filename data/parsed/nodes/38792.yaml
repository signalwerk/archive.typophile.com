      <p>Cabarga's book is, in my opinion, not well-designed at all. ;)<br>
      It actually looks kinda stupid. Although I have the paperback version, which has quite a nice matte black cover with white type. But indeed, the information is good. Especially if you don't know a lot about the subject yet.</p>
      <p>Cheng's <em>Designing Type</em> is a good book, although it is more a thurough analysation of different typefaces and their glyphs. Not really on how to design type. Not that that is really a problem, though. :)</p>
