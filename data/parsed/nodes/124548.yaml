      <p>Thanks for the quick answer, but I have not found a font in the Delphin family that exactly matches my sample.</p>
      <p>The character shapes in my sample match the Delphin character shapes, but in my sample the lower case l, h, d, and f characters are aligned at the top.</p>
      <p>I cannot anything in the Delphin family where that is true.</p>
      <p>I like the characters in the Delphin family better than those in my sample, but I would still like to find out where the characters in my sample came from.</p>
      <p>Thanks for your help.</p>
