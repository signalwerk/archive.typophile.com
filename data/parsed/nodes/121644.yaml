    <p>Hi everyone,</p>
    <p>I'm hoping for some help with FontLab. I'm pretty new to the program and am having some difficulties when pasting in from illustrator. Based on a friend's good knowledge, I think the glyphs are pasting as a background layer, as they are not editable and show as a filled object rather than outlines like they normally would. Hopefully this makes sense. Does anyone know how to turn off [?] pasting as a background layer?</p>
    <p>Thanks in advance!!</p>
    <p>Ro</p>
