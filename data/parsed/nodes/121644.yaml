    html: |-
      <p>One simple way: In Illustrator use your select tool to go around a glyph. You should see the nodes highlighted. Do copy. Open a new blank file. Paste the information. You should see just the gyph. If you see more, delete the extra stuff -- this may be simple or complex depending on your source. Transform by expanding scale, e.g. 500%. Copy. Paste into FontLab. Adjust scale. Close open contours etc.<br>
      Don</p>
