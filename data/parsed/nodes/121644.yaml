    votes: null
    html: |-
      <div class="comment-spam-body"><p>How come you mention shapes having a fill, yet in the picture you posted there is no letter apart from the one that is in the background, which is default in FontLab. Are you actually seeing the letter you past into FontLab at all? Because I can imagine if you copy/paste straight from Illustrator, your letters may be pasted into FontLab too small to see, or outside of the field. I have a separate Illustrator file that correlates to the dimensions of FontLab, so I don't actually copy/paste from the Illustrator file where I have the typeface directly into FontLab. I copy/paste the shapes into the secondary Illustrator file with the correct dimensions, and copy/paste that into FontLab.</p>
      <p>Also, if you do see your letters but they have no counters anymore, one of your nodes is broken. If this is the case you will notice a cross over the broken node. Select the node in Illustrator and press Cntrl + J. This will join the node(s) so it's not broken anymore. I've experienced sometimes when working in different versions of Illustrator (CS5 and CS6 for example), sometimes some of the nodes will break. You don't actually see that until you copy/paste your design into FontLab, in which case your letter has a complete fill without any counters.</p>
      <p>If you're not experiencing either issue, I have no idea what's going on. I've never had FontLab turning layers off or losing the ability to edit your shapes in FontLab.</p>
      </div>
