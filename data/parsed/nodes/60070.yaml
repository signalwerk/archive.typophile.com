      <p>I've been working on my OpenType features and now have a more complete set of connecting forms, though the algorithm still has some kinks that need to be worked out. While this face isn't really designed for long texts, I've provided several samples below simply because they are more illustrative than a few words in isolation (and also are more useful for finding those kinks...).</p>
      <p>The following is a passage from Jules verne. The sample below is a reference sample without any OpenType goodies active:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AGILabyVerne_5814.gif"></div><p></p>
      <p>The two samples below are the same passage using the OpenType features. The first is exactly what the font itself generates, whereas the second has undergone a bit of manual tweaking, especially wrt lowercase 'r' which needs some rethinking. Lowercase <em> i </em> and <em> l </em> are also causing me massive headaches because they have the annoying properties of having a left vertical stem and a right vertical stem which are the <em> same </em> stem, and this keeps introducing interesting bugs into my features.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AGILabyVerne2_6063.gif"></div><p></p>
