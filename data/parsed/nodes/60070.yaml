      <p>Just a quick addendum to my previous post:</p>
      <p>I've illustrated three different connection algorithms here. The one I've labelled 'Connected III' is intended to be a stylistic alternate. I'm debating between 'Connected I' and 'Connected II' as the basic 'calt' algorithm. The other will likely also end up as a stylistic alternate.</p>
      <p>Connected I favours interleaving joins over fully connected ones.<br>
      Connected II favours fully connected joins over interleaving ones.<br>
      Connected III favours interleaving in the opposite direction from Connected I.</p>
      <p>There's also a stylistic set which allows one to 'tweak' the results by mapping numerals onto non-printing 'joining directives'. I haven't used this, though, to correct any problematic cases in the attached .pdf.</p>
      <p>The reason I'm using full paragraphs to illustrate something which clearly isn't intended for text is simply because it illustrates a greater number of character combinations than a single word or pangram does. Also, picking new random passages for different test runs makes it more likely that I'll be able to identify the problematic cases.</p>
