      <p>responding to anhng</p>
      <p>legibiility wasn't really a goal, but perhaps next time I should choose a sample in English rather than gibberish since context is important here.</p>
      <p>I'm not sure how to answer your questions. I'm not a designer, simply someone interested in the more technical details of fonts, and had originally created glyphs as little more than placeholders to allow me to explore a variety of opentype coding issues (hence the very uniform and simple geometric forms). However, I liked the effect created by the uniform internal spacing created by the letters I had, so I completed the alphabet. It actually works better IMHO for the condensed version, but I didn't post a sample of that since I'm still working on the glyph variants and calt code necessary to create the intertwining. I'll likely post a sample of that, though, in the next few weeks.</p>
      <p>If I were to create another typeface, I'd want to spend more time trying to conceptualise what I wanted from the overall alphabet before I started actually drawing glyphs. When I did opt to complete the basic alphabet here, I had to rethink lots of things to get the glyphs to work together. I'm not really sure though if that is what you are asking.</p>
      <p>André</p>
