      <p>Hi André.<br>
      I am looking at your typeface, and even the shapes are not so original, the opentype features make's it quite worth to have it finished. So if you have plenty of free time, just continue :)</p>
      <p>Only some comments:<br>
      "lover"case: looks nearly finished. the small caps forms of f, g and q are bothering me a little. You can keep these as backup and try some true lowercase variants.<br>
      look at k and x, maybe there is a way to make them fit the rest of letters better. maybe disconnect the shapes?</p>
      <p>uppercase: i only like the normal version (i am not sure if the alt version makes much sense with this typeface, because it makes the typeface a little boring). So i recommend you to work much more with the upper row. You can try to use the same principle as in the lowercase and look at the letters like B, D and try to disconnect them. K and X fits here more than in lowercase. Work also on R, probably the version from the second row will be more clear. But anyway, lowercase looks much more complete than uppercase, so you can play more to make the uppercase some sort of mixed upper-lowercase.</p>
      <p>ligatures - are quite hard to read, but i dont like some of "a with something" ligatures.</p>
      <p>Good luck.</p>
      <p>Jano</p>
