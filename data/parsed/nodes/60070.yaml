      <p>I like the overall colour, the negative space created between and within the letters is pretty nice.<br>
      Let's see some numerals.<br>
      Obviously one big concern is legibility, I'd say since you're exploring the possibilities of open type, give the user a conventional legible alternate just in case they need it for setting certain words that would otherwise be too ambiguous. My first suggestion is the J to look something like the L.<br>
      The uppercase G in the second line in the previous post, I don't like that, I get the point that it lines up with the S and the Z but otherwise it doesn't look like a G.<br>
      But I like that typeface. So you have some good language support there, just add Greek and Arabic (Arabic: that's some coding isn't it?)<br>
      Oh and I just realized how this typeface is crying for a Hebrew companion, that squarish look!</p>
