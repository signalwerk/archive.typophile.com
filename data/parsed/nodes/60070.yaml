    html: |-
      <p>For a variety of reasons I took some time off from this, but I'm trying to get back into the swing of things now. One major problem I was facing earlier was that I wasn't really thinking ahead when I developed the earlier version and had rather foolishly added fairly comprehensive international support before I'd actually finalized the basic letterforms and the calt routine. The result: changes to the calt routine were both time consuming and error-prone since because of the large number of glyphs in all of the classes which I'm using. Adding and removing glyphs from classes would often result in classes with the wrong number of members, or with members which were misaligned, and tracking down these problems was becoming rather time consuming (plus the fact that FontLab's error-reporting isn't usually very informative wasn't making things any easier).</p>
      <p>I've created a new version without any accented characters and want to focus on just getting the basic algorithm down before adding the accented characters back.</p>
      <p>I've uploaded a new .pdf file which contains some samples (the text is the first paragraph of Alice in Wonderland which contains all 26 letters). Note that this is still very much a rough draft. The connected samples represent the 'raw' output of my current joining algorithm, and there are many joins which are somewhat ugly as things stand.</p>
      <p>My current goal is to come up with a general algorithm which produces as few problematic forms as possible before I start adding code to deal with specific exceptions (I suspect there will be quite a few of these even once I finalize the basic algorithm, but hopefully I can arrive at an algorithm which minimizes the number of special cases needed).</p>
      <p>The new font includes both the interleaving joins found in the previous version, as well as more 'script-like' connections. I'm not 100% sure how well the latter work though, and would appreciate feedback. It clearly needs refinement, but that refinement is only worth the effort if it actually 'fits', so to speak.</p>
      <p>Currently, I think that there are far more problems with the lowercase joins than the uppercase ones. There are quite a few lowercase joins which I am not comfortable with. I'm curious to see if people here dislike the same one that I do.</p>
      <p>I'm also rethinking what the basic uppercase should be -- Currently, the font has a 'biform' uppercase with a more standard majuscule one available as a titling alternate. I think the biform works well in all-caps settings, but less well in mixed-case settings. I'm debating between two options here: (i) simply swap the two sets of caps so the biform becomes the titling form, or (ii) make the biforms accessible via the 'case' feature so it becomes the default in all-caps settings, and then using the 'titl' feature to restore the standard majuscules, but only in all-caps settings.</p>
      <p>TIA,</p>
      <p>André</p>
