      <p>It's interesting that today, as we know that it is digital age, media everywhere and all that. When people read something, they want to get the information right out of it right away and don't pay any attention to the typeface. If they do, they'll expect it to look legible and look kool. If they can't read it or not appealing, they'll close the window.</p>
      <p>Anyway, there is a chinese artist, Xu Bing. In 1994, he did a project re-inventing roman letter with chinese aesthetic and written in english, all the letter are intertwine to each other. Below is the link to his project.</p>
      <p><a href="http://www.xubing.com/index.php/site/projects/year/1994/square_calligraphy_classroom" rel="nofollow">Xu Bing/ Square Calligraphy Classroom</a></p>
      <p>At first, nobody can read it, but if you pay more attention to little detail, form, and understand the system, you'll understand it, it's very beautiful.</p>
      <p>Well, this is more about fine art academic work, not commercial marketing base work. It is maybe something for you to consider to, either academic fine art or popular commercial marketing design. </p>
      <p>Another thing, as far as the legibility concern, i can't read the word "LAZY DOG" and "AXLE"</p>
