      <p>Jano had complained about the lowercase x and k and suggested opening them up like the b and d. I don't like the results of a pure 'stenciled' form like the second example below, but what about the third form? I think it works much better than the original form. Do others agree?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AGIByzAxle_4826.gif"></div><p></p>
      <p>For some reason, though, this doesn't seem to work as well for the k (at least to me, but I'm starting to lose objectivity)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AGIByzTake_3722.gif"></div><p></p>
      <p>Also, I'm wondering whether maintaining the original uppercase (which Jano felt worked better) still makes sense, or if it should adjusted to match</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AGIByzAxleUC_5133.gif"></div><p></p>
      <p>I've been working on the connected forms a bit -- still nowhere near complete (anhung had asked at the beginning of this thread what I had learned from this -- answer: if you're creating lots of connected forms don't go overboard with the diacritics. At least I never had the masochistic urge to add Việtnamese), but I thought I'd give an example here. It also I think shows that having multiple different forms of the letters, including the more boring standard uppercase ones, leads to a fair amount of flexibility.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AGIByzAffable_6387.gif"></div><p></p>
      <p>As always, feedback is most welcome and appreciated.</p>
      <p>André</p>
