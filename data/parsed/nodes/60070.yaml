      <p>In working on the joining behaviour, I wanted to allow the lower bar of letters like 'E' to join to the character to the right, but I didn't want to simply extend the bar out horizontally since that would create huge amounts of whitespace which would destroy the overall texture of the font. I've opted instead to lower the center bar. In the image below, the second example shows what the font would previously produce, and the third example shows the new joining 'E'.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AGIBeadTest_4199.jpg"></div><p></p>
      <p>I'm wondering whether this 'E' looks OK, and how acceptable it is to have the joining form make such a major departure from the basic 'E' form. One option would be to make available a similar unjoined E as a stylistic alternate, but if I do that I'd probably need to add similar variants for A, Æ, B, H, K, Œ, R, X and possibly P, S, Y and Z. I'm a bit reluctant to add so many new alternates (along with their corresponding joining forms -- and some of these characters require a substantial number of those) unless this actually looks reasonable.</p>
      <p>André</p>
