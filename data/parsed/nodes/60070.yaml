      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AGILabyVerneFr_3996.gif"></div><p></p>
      <p>Finally, I created a Q-variant which sits directly on the baseline rather than descending below it to allow for very tight all-caps settings which preserve the texture of the face vertically as well as horizontally, but I'm not sure if this alternate works very well.</p>
