      <p>What's in a name?</p>
      <p>I'd started off with the working title of 'Byzantium' because the patterns formed by the negative space reminded me somewhat of a maze (I hadn't thought of the textura analogy which Sindre raised, though I quite like it -- the negative space was very much focal for me). However, I'm starting to rather dislike that name since the letterforms themselves clearly bear no relation to anything Byzantine. I'd thinking of 'Miasma' as an alternative. But I'll probably come to dislike that as well...</p>
      <p>André</p>
