      <p>In general I'm no fan of this style, but I must say this is really great! I wouldn't be too concerned about legibility, I think what is really interesting here is the texture your typeface weaves, especially with the OpenType tricks turned on. This gives an almost textura-like quality, which I have never seen in such a typeface. The internal white space-pattern in the text-setting is a thing of great beauty.  </p>
      <p>I guess the basic idea is the same as with textura, few but very distinct shapes repeated and combined, with the white even more important than the black. </p>
      <p>Your typeface immediately reminded me of the famous blackletter calligraphy of Rudolf Koch: </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Koch_MEvang_6419.jpg"></div><p></p>
      <p>(Sorry for the small image, couldn't find anything larger online.)</p>
      <p>I don't have time for a detailed critique now, but I'll get back to this. Keep up the excellent work!</p>
