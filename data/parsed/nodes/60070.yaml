      <p>Thanks for the feedback.</p>
      <p>My question about the E's isn't just about matching other letters, but also about matching itself, so to speak. Right now, there are three versions which might appear depending on the following character.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AGIEngETest_5837.jpg"></div><p></p>
      <p>The first appears when E can't join to the following character, the second when it can, and the third when the second can't be used.</p>
      <p>There are a variety of other joined forms which are causing me headaches, so I thought I'd take a bit of a break from thinking about them so I can come back with a fresh mind. In the meantime, though, I sketched out some ideas for expanding this into an actual family with additional weights. Unfortunately, if I want to maintain the same sorts of behaviours across weights, the design imposes some rather severe restrictions on the weight of horizontal stems, so in trying to make bolder weights, I've ended up with a situation where the contrast increases with the weight. I'm not sure how unnatural that is. Anyways, I've just done basic alphabets, but here's what I have so far.</p>
