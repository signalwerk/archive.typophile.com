      <p>Here's a slightly revised sample which includes some figures for Johnny Dib.</p>
      <p>The first line is the regular uppercase, whereas the second is intended as a 'legibility alternate'. I've also shown a few alternates at the end. The alternate capital F, R, Z and lowercase z and possibly g and q will probably become the 'standard forms'. The others I'm still thinking of as alternates.</p>
      <p>I may end up ditching the oldstyle figures and just keep the small figures since I don't think they're really appropriate for this sort of face.</p>
      <p>As for Greek, Arabic, and Hebew, I think I work on the basic roman before introducing new scripts... I did play with greek for awhile but had problems visualising a decent lowercase.</p>
      <p>André</p>
