      <p>As mentioned earlier, I'd been working on a condensed version as well. The connections are still under construction, but I thought I'd post the basic alphabet here. There's also some preliminary cyrillic glyphs shown. The mixed-case forms don't translate well to cyrillic, but I thought I might be able to create a similar effect by using cursive letterforms, but I'm not sure if that works for a sans serif -- feedback from anyone more familiar with Russian than I (which means pretty much anyone) would be appreciated.</p>
