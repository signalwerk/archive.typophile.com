    html: |-
      <p><em>"Now what’s more important, BAJA or KAYAK? I don’t know for sure but BAJA most likely."</em></p>
      <p>This would depend on where the bulk of the company's business originates. If people are coming from afar <em>explicitly</em> for this service, then Baja's more important. However, if their customers are mostly people <em>already</em> traveling through the area then Kayak's more important.</p>
      <p>If you really felt the need to emphasize one word over the other, you could perhaps create two versions: a Kayak one for all signage and local advertising, and a Baja one for the company website and ads targeting international travelers.</p>
    html_clean: |-
      <p><em>"Now what’s more important, BAJA or KAYAK? I don’t know for sure but BAJA most likely."</em></p>
      <p>This would depend on where the bulk of the company's business originates. If people are coming from afar <em>explicitly</em> for this service, then Baja's more important. However, if their customers are mostly people <em>already</em> traveling through the area then Kayak's more important.</p>
      <p>If you really felt the need to emphasize one word over the other, you could perhaps create two versions: a Kayak one for all signage and local advertising, and a Baja one for the company website and ads targeting international travelers.</p>
