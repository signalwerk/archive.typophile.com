  html: |-
    <p>I'm an intern for <a class="freelinking external" href="http://en.wikipedia.org/wiki/WiLDCOAST" rel="nofollow">WilDCOAST</a> and one of our areas of focus is promoting ecotourism in Latin America.  As you would expect many of these companies don't have the money or knowhow to create a snazzy logo (or website) so we're designing it for them.</p>
    <p>Right now I'm working on <a class="freelinking external" href="http://bajabykayak.com/" rel="nofollow">Baja by Kayak</a></p>
    <p>Their current "logo":<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/gen_643_6540.1.gif"></div><p></p>
    <p>My new design (in progress):<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/kayak_6592.gif"></div><p></p>
    <p>There's no special reason for the "A" to stand out, and I'm not especially attached to the colors. Also I haven't yet figured out how the "Baja by" text will be incorporated so feel free to offer an ideas. :)</p>
  html_clean: |-
    <p>I'm an intern for <a class="freelinking external" href="http://en.wikipedia.org/wiki/WiLDCOAST" rel="nofollow">WilDCOAST</a> and one of our areas of focus is promoting ecotourism in Latin America.  As you would expect many of these companies don't have the money or knowhow to create a snazzy logo (or website) so we're designing it for them.</p>
    <p>Right now I'm working on <a class="freelinking external" href="http://bajabykayak.com/" rel="nofollow">Baja by Kayak</a></p>
    <p>Their current "logo":<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/gen_643_6540.1.gif"></div><p></p>
