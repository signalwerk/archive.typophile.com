      <p>================<br>
    Newspaper design<br>
    ================</p>
    <p>A day of talks at St Bride Library.</p>
    <p>Friday 19 May 2006, 10.15am–5.15pm</p>
    <p>Tickets cost just £50 (£35 for students) for a whole day of talks.</p>
    <p>Speakers<br>
    ————<br>
    Peter Baistow<br>
    Paul Barnes<br>
    Simon Esterson<br>
    Nico Macdonald<br>
    Ally Palmer<br>
    Mark Porter<br>
    Alan Rusbridger</p>
    <p>To book<br>
    ———-<br>
    You can download the booking form from<br>
    <a href="http://stbride.org/events_education/events/newspaperdesign" title="http://stbride.org/events_education/events/newspaperdesign">http://stbride.org/events_education/events/newspaperdesign</a></p>
    <p>You can also call 0207 353 3331 or email <a href="mailto:laura@stbrideinstitute.org">laura@stbrideinstitute.org</a></p>
