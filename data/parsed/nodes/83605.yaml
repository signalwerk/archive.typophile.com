    html: |-
      <p>Yes. Fontographer 5.1 is a free update to all Fontographer 5 users: <a href="http://www.fontlab.com/news-and-events/fontlab-announcements/free-fog5-1-update.html" rel="nofollow"><strong>get it here</strong></a> and review the list of changes and improvements. </p>
      <p>Also, during this summer, a <strong><a href="http://www.fontlab.com/front-page/featured-product/fontographer-5-1-and-dtl-otmaster-2-4.html" rel="nofollow">Fontographer 5.1 + DTL OTMaster 2.4 bundle</a></strong> is available at US$449.00. We at Fontlab Ltd. are very exciting about this collaboration with Dutch Type Library and URW++. </p>
      <p><em>The Mac OS X version of Fontographer 5.1 is compatible with Mac OS X 10.4 and higher, including 10.7 Lion. The Windows version is compatible with Windows XP, Vista and 7.</em></p>
