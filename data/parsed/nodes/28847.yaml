    html: |-
      <p>I'd like to add that I'm really happy to have found this font.</p>
      <p>We once worked on a logo design for Yves Saint Laurent 'Cinema' perfume and lost the pitch to Art Director Thomas Lenthal who used Optima as proposed Logo. I fully understand why he had chosen Optima, it is very classical (so coherent with the clients brief who wanted to go for a 30's kind of glamour), slim and elegant, but only if seen from far, I think the Optima is dead ugly when you see it from close, it has those curvy lines which make it look kinda sloppy and of little formal value. Goldenbook would have delivered the same 30's galmour message but with much more typographic rigour. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture-3_4245.gif"></div><p></p>
