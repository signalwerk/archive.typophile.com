    <p>Hi, this post just concerning the requests to ID the Gucci Logo.</p>
    <p>ID was usually dismissed because considered the Logo was considered custom designed, but I just fed the Logo in <a href="http://www.myfonts.com" title="www.myfonts.com">www.myfonts.com</a> 'what the font' engine and it neatly outputed this typeface ... I'd say a 95% match of the logo.</p>
