      <p>Thanks for the ID! I was curious too.</p>
      <p>Some more swashy stuff: Jeremy Tankard's <a href="http://www.typography.net/type/font/aspect" rel="nofollow">Aspect</a> might just be the most crazily swashed sans ever. It's more playful overall though.<br>
      Also, JFP's <a href="http://www.typofonderie.com/alphabets/view/ParisinePlusPTF" rel="nofollow">Parisine has a "Plus" variant</a> with some nice swashes and ligatures.</p>
