      <p>I’m almost certain “LUXE” has been built using parts from “Orbit”:<br>
      <a href="http://vllg.com/Thirstype/Orbit/mudTyper+Weights/">http://vllg.com/Thirstype/Orbit/mudTyper+Weights/</a></p>
      <p>The Medium lowercase provides the glyphs; the “X” is built by snipping and reassembling the “y”, and the “E” has had a curve inserted in its middle section.</p>
