  html: |-
    <p>Hi everyone,</p>
    <p>I need some feedback on a logotype for an F&amp;B brand that I've been working on.<br>
    It's based on Susa Bold (<a href="http://new.myfonts.com/fonts/hubertjocham/susa/" title="http://new.myfonts.com/fonts/hubertjocham/susa/">http://new.myfonts.com/fonts/hubertjocham/susa/</a>).</p>
    <p>The client likes the original version, although he is concerned that people would read the logotype as Loi, instead of Zoi, due to the cursive stroke of the uppercase "Z".</p>
    <p>Therefore, I've made some modifications to the uppercase "Z" to make it look less like the cursive uppercase "L" (please see image below).</p>
    <p>However, I really like the curvy upper case "Z" because it has so much flair which fits the brand perfectly, and gives the logo a unique personality. I'm afraid that the more I reduce the cursiveness of the uppercase "Z", the less flair is retained.</p>
    <p>Questions:<br>
    1) How would you read the original logo? Loi or Zoi? (please see image below)<br>
    2) Which one of these modifications has the best balance of readability and flair?<br>
    3) What can I do to make it better?<br>
    4) Is there another typeface that has a similar quality to Susa Bold that I can use as a base; a solid and refined script, less spontaneous and not too feminine?</p>
    <p>Thanks in advance for your input!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/revision_round_1_3691.jpg"></div><p></p>
