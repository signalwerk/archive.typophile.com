    html: <p>As I understand it, the combination of weight number (e.g., 250, 300, 700) and OpenType naming (nameID 17 and 18) are the primary settings that Adobe software uses to sort weight/style ordering in menus. However you would need to modify the font data in order to change this and thus permission from the foundry/copyright holder if permission is not explicitly given through their EULA.</p>
