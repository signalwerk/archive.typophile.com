  html: |-
    <p>I purchased a font the other day, and when I went to use it in one of the Adobe CS programs, there's no rhyme or reason to the order of the font weights.</p>
    <p>Typically for other large font families (including widths and weights) I see them listed like this:</p>
    <p>Light Condensed<br>
    Light Condensed Italic<br>
    ... etc ...<br>
    Medium<br>
    Medium Italic<br>
    ... etc ...<br>
    Black Extended<br>
    Black Extended Italic</p>
    <p>But this font I bought is WAY off from this. It was from a pretty decent-sized foundry, so I was really surprised. It makes it really difficult to use. (Take a look at the attached file).</p>
    <p>So my question: Can I fix this somehow on my end and rearrange them? I've got Suitcase Fusion 3, but that's it for font-specific software.</p>
