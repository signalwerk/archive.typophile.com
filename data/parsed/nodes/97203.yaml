    html: |-
      <p>Adobe software uses the internal data of a font to determine the best sorting order: width, weight, slant. Condensed fonts come before regular and extended, light fonts before regular and bold.<br>
      Since this is data <em>inside</em> the font file itself, you cannot tinker with Suitcase settings, the font foundry has to set the correct values.</p>
      <p>In this case it seems the Pantone flags are probably wrong, or possibly all left as "default".</p>
