      <p>Bill, if you remember, Fontographer had all sorts of bugs. I use to keep a separate kerning file for every font, because Fontographer always messed up anything over decimal 255 . . .</p>
      <p>When FontLab first came out, I kept using Fontographer because it was what I knew. Except at the end, I added the step of running the font through FL, to get rid of those Fontographer bugs.</p>
      <p>Old habit die hard. Even using FL, I still write all OT features in a text editor &amp; import them (&amp; save them as a text file).</p>
      <p>My current grumble with FL is it doesn't support mark and mkmk. Waiting for version 6.0, I guess.</p>
