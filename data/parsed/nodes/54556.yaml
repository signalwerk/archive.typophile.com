      <p>Don’t copy/paste huge numbers of kerning pairs between fonts. Export your kerns to a file and import them back in. </p>
      <p><cite>It is difficult to believe how anyone could reliably use this program as a production tool as is…</cite></p>
      <p>I don’t disagree with you there. Every time Fontlab crashes because I used a keyboard chord to enter an accented character into the metrics window I think that we should start doing annual fund raisers for Fontforge. Fontlab is very good for some stuff, but it’s drawbacks can really eat up a lot of time when one is working on projects solo. I got Fontforge working on Friday night and I’m going to be reading the tutorials over the next week.</p>
