      <p>isn't it amazing how different two designs can be at only four pixels high?</p>
      <p>i'm going to flesh out the minus family a little later. my typical work flow involves putting a font down for quite a while sometimes, before coming back to it to try and publish it.</p>
      <p>i am usually able to hone the design a little better that way.</p>
