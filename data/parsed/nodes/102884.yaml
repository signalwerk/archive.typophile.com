      <p>You can't do that with VOLT. VOLT does not decompile OTL tables, only write them.</p>
      <p>I'm not aware of any tools that will flawlessly decompile OTL tables in a way that a) ensures they can be recompiled and b) it identical to the original source from which they were made. The success of decompiling OTL tables in e.g. FontLab Studio 5 will depend on the contents of those tables, whether they can be handled with the version of the ADFKO code that FontLab uses, etc.. You might be able to use a program like FontLab to decompile into AFDKO syntax, then save that as a .fea file, edit it in text editor, and then use AFDKO itself or DTL OTMaster to try to compile the edited OTL features.</p>
