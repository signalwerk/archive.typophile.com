    html: |-
      <p>1. Open the font<br>
      2. Choose Element -&gt; Font Info<br>
      3. Choose Lookups<br>
      4. Choose GSUB or GPOS<br>
      5. Choose appropriate lookup (here 'curs')<br>
      6. Right-click lookup and choose "Save lookup"<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/amiri_4611.jpg"></div><br>
      Save the fea file, edit it as ordinary text file:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Amiri2_5638.jpg"></div><br>
      save edited, delete this lookup in Font Information window,<br>
      and File -&gt; Merge Feature Info, choose proper fea file. Done.<br>
      Everything about fea syntax is here: <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html" title="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html">http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html</a><p></p>
