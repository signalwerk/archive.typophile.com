    <p>Hello forum.</p>
    <p>I am new to this Font thing. I have a Unicode TTF font.</p>
    <p>When I open the font in Volt, I get this message that "OTL tables already exist, and Volt will delete the OTL table".<br>
    I actually need the OTL table of that font. How do I do that?</p>
    <p>Actually some of the lookups of that font is not working so I would like to extract the lookup table of that font, edit it and save it back.</p>
    <p>Thanks in advance.</p>
    <p>Shahid</p>
