      <p>&gt; <em>difference between an oblique or slanted cut versus a true italic</em></p>
      <p>Hello Ricardo,<br>
      The terminology to describe letterforms whose stems are NOT perpendicular to the baseline have gotten very fuzzy with constant misuse over the last few decades.</p>
      <p>With sans and grotesk/grotesque faces, oblique forms are often the design convention, which essentially is the roman form with re-adjusted stress for rounds, often slight condensing of width and redrawing of connecting stroke intersects. We made a little stink about "true cut" obliques versus "slanted" forms with the release of Avant Garde Gothic Pro Oblique (see Mark Simonson's post in <a href="http://typographi.com/001029.php" target="new">Typographica</a>).</p>
      <p>As long as a typeface (generally sans) has "true cut" oblique weights that's fine, as long as that was the actual designer's intent. Creating "italics" (or after the Italian style as it originally was meant) are based on completely different design principles and models, and meant to compliment the roman, not necessarily "re-invent" or "italicize" it.</p>
      <p>Without specific regard to what Vic Caruso did with ITC Franklin Gothic, strictly using or purchasing a set of weights based on terminology (oblique, slant or italic) is strongly not advised. You need to inspect the characters to determine whether they were "drawn" correctly and weighted properly.</p>
      <p>If both ITC Franklin Gothic Oblique and Italic are well designed (I am not looking at specimen, just memory of pre-digital cuts), then it is up to YOU to decide what you prefer. Neither choice is actually wrong... but one may work better in your design than the other.</p>
      <p>---------------------------</p>
      <p>HMMMMmmmmm...<br>
      Just looked at your link to MyFonts for all ITC Franklin Gothic weights, and it is confusing with "italic" being used as the term in most cases, but "oblique" in certain cases.</p>
      <p>I think this is a Linotype naming issue, or years ago the Linotype release was verly slightly different (maybe in spacing), since in the original ITC Release specimens, only the term "Italic" was used.</p>
      <p>If you go to the <a href="http://www.itcfonts.com/fonts/font/pid/421590/ITC+Franklin+Gothic+Complete+Family+Pack/detail&amp;grab_id=0&amp;page_id=44371&amp;query=%22franklin%22&amp;SCOPE=ITCFonts" target="new">ITC website</a>, you will see that they ONLY use "italic" in descriptions of the non-roman weights of ITC Franklin Gothic.</p>
