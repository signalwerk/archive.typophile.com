      <p>The -valid- terminological confusion issues aside, usually when a font<br>
      has both (not common) it's because an oblique version was rushed out but<br>
      then eventually a so-called "true" italic was produced. As a rule, the italic will be better, at least because it's made non-mechanically*; I can think of rare cases where using the oblique would be better (like if the italic was too free-wheeling) but generally you want the italic. That said, <cite>users</cite> don't <cite>always</cite> think the italic is better: there is one very interesting case, Treacy's Arrow typeface, where the replacement of the oblique with the italic was met with an uproar on the part of his customers! He ended up providing both.</p>
      <p>* Which is not to say I agree with Norbert's opinion that it must be designed from scratch to be good.</p>
      <p>hhp</p>
