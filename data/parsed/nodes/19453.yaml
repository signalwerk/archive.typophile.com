      <p>Thanks for your comments, gentlemen.</p>
      <p>Norbert, thank you for the link to the Typographica article about Avant Garde Pro Oblique; I had forgotten about that... In it, Mark Simonson links to his explanation on <a href="http://www.marksimonson.com/article/128/fake-vs-true-italics">fake-vs.-true italics</a>, which illustrates the differences quite well.</p>
      <p><em>I think this is a Linotype naming issue...</em></p>
      <p>You know, I had also been looking at Adobe's offerings of ITC Franklin Gothic and, interestingly, in <a href="http://store.adobe.com/type/browser/P/P_023.html">PostScript</a> they offer both italic and oblique, while their <a href="http://store.adobe.com/type/browser/P/P_1138.html">OpenType</a> versions have italics only. So it's good to know that the ITC website only displays the italics! (Thanks for that link, too -- I was having trouble with ITC's website, earlier...)</p>
      <p><em>Just looked at your link to MyFonts for all ITC Franklin Gothic weights, and it is confusing with “italic” being used as the term in most cases, but “oblique” in certain cases.</em></p>
      <p>A printout of an online character map will only reveal so much, but it does look as if the Oblique versions of ITC Franklin Gothic are a bit more slanted than their Italic brethren... The italic <strong>uppercase O</strong> looks rounder than the oblique one, which could be confused with the <strong>zero</strong> in the same cut (I'm looking at the Book weights)... The <strong>@ symbol</strong> has the most noticeable difference: only slightly inclined in the italic, while very slanted in the oblique.</p>
      <p><em>If both ITC Franklin Gothic Oblique and Italic are well designed [...], then it is up to YOU to decide what you prefer. Neither choice is actually wrong… but one may work better in your design than the other.</em></p>
      <p>Right you are; I can agree to agree about that.  :-)  Same goes for the naming distinctions you posted; that's the way I had learned them, too.</p>
      <p><em>...usually when a font has both (not common) it’s because an oblique version was rushed out but then eventually a so-called “true” italic was produced. As a rule, the italic will be better, at least because it’s made non-mechanically; I can think of rare cases where using the oblique would be better (like if the italic was too free-wheeling) but generally you want the italic.</em></p>
      <p>Yeah, that is my feeling as well, Hrant. I just wanted to hear some other opinions on this before taking the plunge. :-)</p>
      <p>Thanks again, guys!</p>
