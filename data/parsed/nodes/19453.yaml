    <p>I understand the difference between an <a href="http://typophile.com/wiki/Oblique" target="_blank">oblique or slanted</a> cut versus a true <a href="http://typophile.com/wiki/Italic" target="_blank">italic</a> one... But I am curious if anyone knows why <strong>ITC Franklin Gothic</strong> has <em>both</em> <a href="http://www.myfonts.com/fonts/linotype/itc-franklin-gothic/" target="_blank">oblique and italic versions</a> of its weights... Were they all developed at the same time by Victor Caruso? If so, what would be the reason to develop both a slanted and an italic version of a sans serif face? (For instance, the condensed and compressed weights that David Berlow created for this typeface only have italic versions, no obliques.)</p>
    <p>One last question: I imagine that it is better to purchase the italic versions of this face rather than the oblique versions, but if anyone thinks differently, I'd like to hear what they have to say.</p>
    <p>Thanks!</p>
  html_clean: |-
