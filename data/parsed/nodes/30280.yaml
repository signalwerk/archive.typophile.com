      <p>“I haven’t seen the doc, but Conor’s comment speaks to this:</p>
      <p>‘I was slightly disturbed by the familial acceptance of his promiscuity, something the whole town, it seems, turned a blind eye to.’</p>
      <p>If that’s not moral acceptance, what is?”</p>
      <p>You’ve not seen the documentary, but you are prepared to form your opinions on it based upon the second hand viewing information of one viewer! Regardless of what either Conor, I or anyone else says, you’d have to see it for yourself. The fact remains that he was an abuser, a point, it would seem that you want to sweep under the carpet and forget because it is a history of abuse which some members of past society have ignored, as indeed some will continue to do today. Yes, life moves on, but it does no harm to remember past and present victims of crimes which were never justifiable.</p>
      <p>From what I saw, I believe that villagers at the time did not know about his abusing; he was seen simply as an artistic wierdo but that was about it. What, do you think Gill advertised the fact that he was abusing his kids, perhaps popping into the pub or the post office to let the locals know that he was the local kiddy fiddler? </p>
      <p>“What exactly do social morals have to do with the practice of typography?”</p>
      <p>That is dependent upon one’s purchasing ethics and consumer awareness (if the work is for sale). Some of Gill’s (non-lettering) artwork was inspired by his incestuous leanings. Like I said in a earlier post, I don’t doubt his technical ability (particularly as a lettercutter, designer, etc.) but I don’t have to like the man.</p>
      <p>I don’t think that it hurts to know a bit about the background of any artistic creation and/or the product’s creator when making purchasing decisions. I don’t want to digress too much, but people who by into a product, say Siemens for example, might not know (or may choose to ignore) that they manufactured the ovens to burn the bodies of Nazi concentration camp victims. (Perhaps you think we should ignore that event too, Nick, seeing that that too is history with a past cultural context). Yet still as <strong> <a href="http://news.bbc.co.uk/1/hi/business/2233890.stm"> recently as 2002</a> </strong> this company continued to show no respect for the murdered. It is a question of ethical awareness and consumer choice. If consumers know about a product or manufacturer’s history they might think twice about buying that product. We should not berate people for not buying into certain prouducts, including art (type), if their conscience dictates.</p>
      <p>“How about other ethical behavior?”<br>
      In relation to what exactly?</p>
