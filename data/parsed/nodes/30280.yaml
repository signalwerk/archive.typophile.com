      <p>I am not equating Gill’s morals with his typefaces nor am I condemning his typographic work because of his perversions. To me, it is a matter of personal choice if you use his type. If an individual can use Gill’s type without feeling conflicted or in some way negative, that is fine.  I certainly will make no judgement about that individual. It is their choice, not mine to make.  If another individual cannot divorce Gill’s type from Gill and would be consumed by a moral dilemma, I would have no issue with that person avoiding the use of Gill’s type either. It is their choice not mine.<br>
      As for me, I fall more into the second group. I had not been using any of Gill’s type for several years prior to finding out about his character anyway so I made no conscious choice to avoid his type. I chose other type for the usual typographic reasons based on the needs of the job.  If I were forced to make a choice today, I don’t think I could now choose Gill’s type without it causing me sadness. If a client came to me who uses Gill Sans as a corporate face, I would most likely feel OK about using it because it was their stipulation for their own work. This has never happened so I don’t know for sure if I would be able to do it or feel I must decline the job. There have been times when clients have insisted on using certain typefaces which I felt were wrong for the job (again for typographic reasons). I pleaded my case to the client and sometimes could not sway them. Most often, I ended up doing the job using their type but there was a case where someone wanted to use all caps script.  I declined the job politely. This again was not a moral issue but the thought of being associated with a really bad job just does not sit well with me.</p>
      <p>ChrisL</p>
      <p>PS: Sorry about my error with Caligula/Nero.<br>
      and hello to my friend Gerald.</p>
