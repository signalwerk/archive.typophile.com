      <p>Giampa, my command of English apparantly didn’t allow me to write precisely what I meant. I would suggest to anyone interested in this thread and the topic to read Fiona MacCarthys brilliant book on Gill or another well-researched source and not just rely on some vague rumours. It’s so easy to pick up a scandalous fact on the internet and then cry for morals and censorship.<br>
      To know about Gill’s background doesn’t excuse his behavior in any way – what he did has to be considered a crime, no doubt about that. But there emerges a picture of a patriarchal community –&nbsp;a sect –&nbsp;which was extremely creative and productive. So to me, it is an fascinating, if deeply problematic story about patriarchism and sectism, which makes Gill an important, but not unusual figure in the context of the early twentieth century. It is striking in how many artists’ and patriarchal communities, which have been extremely creative at times, the same issues of promiscuity and misleaded sexual freedom have arised.<br>
      This is a tale about Britain in the twenties, about the status of the artist, about religion and patriarchism. I am speaking from a historian’s point of view – whether you want to distance you from his output, is your matter of choice. So what I suggest is research and historical awareness, not censorship (I think many of Gill’s sculptures and drawings are just horrid, by the way, but still I’m interested in them.)<br>
      I would like this thread to be continued, but not with cheap polemics à la «Would you put a drawing by Saddam Hussein above your bed?»</p>
