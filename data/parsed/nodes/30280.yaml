    html: <p>100 years from now, or 200, when we have left behind our work or lack of same, who will possibly care whether or not a very beautiful type, Joanna, was designed by a pedophile? Long before I read the MacCarthy book and knew only the sanitized biography of Eric Gill I thought that Joanna in metal was a lovely type, especially in the italic. Do we all read the biographies of type designers before we use their types? God forbid what we might find out if we did. Can we, should we, separate the art a person creates from the private life of that person? I condemn the acts Gill committed as much as anyone but I cannot and will not condemn the work he made.</p>
