      <p>We are wrestling here with a problem of how to deal with the works of a great artist who did reprehensible things as a person. </p>
      <p>I think one part of the problem is relatively simple. In my view, we should clearly and uniquivocally reject what was morally reprehensible that the person did, and not soft pedal it because he (or she) was a great artist.</p>
      <p>From what I hear there are perpetrators of incest on the internet who try to reassure one another that it is ok. So I think we have a responsiblity to sustain a climate of moral disapproval of this extremely damaging behavior, and not give any excuse to the villains who perpetrate this stuff. They may find this thread by googling. I know it is not fashionable to moralize, but I don’t agree with the fashion: it is important to moralize to help sustain a decent society. And this is a case where the need is, in my opinion, very clear and unequivocal. </p>
      <p>The question of how to deal with the works of a person whose actions we find reprehensible is more complicated. </p>
      <p>Although his concern is understandable, I don’t agree with Gerald Giampa that we should simply dismiss them. Historically, it seems that we don’t know whether the ’fabulous hands of Francesco da Bologna’ [Griffo], as Aldus put it, were in the end instruments of murder. Evidently Griffo was accused of murder for killing a relative in a fight. We don’t in fact know whether he was, for example, let off on account of self-defence, or was hung. </p>
      <p>But let us assume that he was guilty of murder. Should we then not learn from this ’founding father’ of roman type design? Not use his type designs? I don’t see why. His designing type was an innocent activity, and not malicious. So why not accept the good that the man did, and lament the bad, if indeed it was there. </p>
      <p>Similarly in the case of Gill, his type designs are fine, honest work. And so I don’t have a problem with people using them and learning from them. I also don’t have a problem if their association with Gill is too much, but that is a personal thing. I don’t think there is a moral case to be made against the type itself—as it might be with pirated type, for example—particularly long after his death. </p>
      <p>Now it is not simple because some artistic work is tainted by the corruption in the artist or designer. As I think some have mentioned, this is indeed the case with some of Gill’s drawings and sculpture. Actually before I knew about this stuff there was something I found weird and off-putting about his work, even the relatively innocent stuff on the BBC building at Porter Square, if I remember correctly.  And his stuff of Catholic Saints having sex is just too bizarre for words. </p>
      <p>What of Gill’s work is over the line is I suppose for each person to decide. To me the type is pretty much the good side of Gill’s work, and the Saints the bad. We can accept the one and not the other.</p>
