      <p>Who gave that scary kid an axe?</p>
      <p><em>The Eric Gill story I am sure will raise a few hackles. When I embarked on the series I said that I wanted to use my camera to surprise myself and my neighbours. I think I was using my camera as an archaeologist might use a trowel - digging for memory, looking for hidden truths in the village. The Eric Gill film is a very personal journey. I make no claims to be an art historian or to have anything particularly original to say about Eric Gill, but for me it was a fascinating personal journey. In a sense I was thinking about my dad and his art history. The extraordinary thing is that Gill was in this village because of his relationship with Edward Johnston, the great calligrapher and font designer, and Johnston was my father’s tutor at the Royal College of Art in the 1920s. So it’s not just a film about art; it’s a film about community and personal history.</em> Luke Holland (director)</p>
      <p>Tim</p>
    html_clean: |-
