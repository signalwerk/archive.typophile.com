      <p>“I don’t see that selling it or not makes any difference, taking a copy of somebody’s work and making it available to the public, thereby denying the author their due payment, is piracy”</p>
      <p>This is the definition the RIAA has been using, but is not the traditional term.</p>
      <p>Piracy refers to making fake product...be it physical or an illegal copy  of an electronic medium and then selling it for profit. An illegal business.</p>
      <p>Copying something without the end-user’s permission is copyright infringement.</p>
      <p>I’m not ’for’ either one, of course. I just think it’s important we note the difference between the terms.</p>
