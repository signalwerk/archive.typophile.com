      <p>“Are artists or designers supposed to be saints?”</p>
      <p>No, but neither does their occupation exempt them from behaving in ways that most sane people would doubtless agree are socially unacceptable and abhorrent. Child abuse is illegal for good reason, not simply because people are prudish or that they are moral pontificators. Gill, after all, was a man who claimed to be a devout catholic, working on carvings of the twelve Stations of the Cross at Westminster Cathedral, only to then come home to groom his children so that he could sodomise them. Caravaggio might well have murdered, we don’t know. Gill, however, explicitly documents his abuse in writing, and some of his unhealthier passions fed his work.</p>
      <p>I don’t know whether Gill was a hypocrite, mentally unwell or both, but for me personally, the edge is taken off from enjoying many of his (non lettering) works, knowing that much of his inspiration was generated by incestuous yearning and paedophilia. To me, the physical qualities of his work remain undiminished but when I was made aware that both his artistic and sinister personal life were deeply entwined, I found it quite difficult to view and engage with them in quite the same way that I did, prior to my knowledge of his abusive tendencies.</p>
    html_clean: |-
