    <p>I’m sorry, this isn’t type related . I had to tell somebody.  I just found this incredible foreign film, called A Tale of Two Sisters, based on a Korean folk tale. This movie was infinitely better that any of the recent crop of Asian Cinema remakes. I almost had, and I mean HAD, to hit the power button on my dvd player a couple of times. Also better than Ju-On, and it’s remake The Grudge. Genuinely classy, creepy and scary, all in the right places.</p>
    <p>Ciao</p>
