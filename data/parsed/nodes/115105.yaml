      <p>Agreeing with Thomas Phinney. InDesign's system is not flawless:  Symbol, Wingdings, and Zapf Dingbats appear in the 'default' section, and huge fonts such as Arial MS Unicode appear (from memory) in the Chinese section.</p>
      <p>In general, ID seems to look at the Unicode ranges a font says it contains. Experimenting with these may reveal its actual algorithm --  chances are it's as simple as "first come, first serve", for a reasonable coverage of glyphs for a certain script.</p>
      <p>It's pretty useless to try and match glyph coverage to languages. If a font contains accented characters but not the letter 'k', would you infer it's intended to be used for Italian only? (Which only uses 'k' in loan words.)</p>
