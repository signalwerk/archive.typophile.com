  html: |-
    <p>Today, through Firefox I changed the default font for displaying Armenian texts on the web from Mshtakan to Segoe UI (I have a Mac). So far there haven't been any problems with Armenian websites, however on facebook (see imege below) the lowercase letters |ր| and |դ| of Segoe UI are being replaced with the letters |ր| and |դ| from Verdana. Not that I mind it, but I'm very curious as to why is this happening. (On Typophile too, these letters are being replaced from Segoe UI to Verdana.) </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/rehverdana_4330.png"></div><p></p>
    <p>Also, is there a way of changing the defult fonts for displaying Armenian through the Mac System on Snow leopard, as well as on the keyboard viewer. Thank you.</p>
