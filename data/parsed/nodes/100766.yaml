      <p>It looks to me like those two characters (U+0564/0580) are the only Armenian characters in Verdana.  Why would someone do that?</p>
      <p>So I suppose the site is set up to use Verdana by default and has to use some other font for all the other characters.....</p>
      <p>PS I don't know of any way to change the default fonts used by OS X for Keyboard Viewer or elsewhere in the OS.</p>
