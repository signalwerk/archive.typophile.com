  html: <p>Here's another chance to see and hear Doyald Young's eloquent presentation and to get a free copy of the great "The Art of  the Letter" book that he designed for Smart Papers. He also has his other books for sale and will gladly inscribe them. His year-long Smart Papers speaking tour is almost over, so be sure to catch him if you are in the Pacific Northwest. He will be speaking to the AIGA (non-members also welcomed) on May 3th in Portland, and May 5th in Seattle. Here are the blurbs from the AIGA sites with links to them,  <br>Portland, May 3rd <br><a href="http://www.portland.aiga.org/events/doyald_young.html" target="_blank">http://www.portland.aiga.org/events/doyald_young.html</a> <br>Seattle, May 5th <br><a href="http://www.aigaseattle.org/events/index.asp?include=May_2005#05" target="_blank">http://www.aigaseattle.org/events/index.asp?include=May_2005#05</a> <br> <br>Tell him I sent you!  ;-) <br>Jill</p>
