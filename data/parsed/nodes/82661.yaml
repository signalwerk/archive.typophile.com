  html: |-
    <p>Submissions are now being accepted for inclusion in <a class="freelinking external" href="http://www.typegallery.com/" rel="nofollow">TypeGallery2011</a>, the 11th unjuried showcase of new typeface design presented by the <a class="freelinking external" href="http://www.typesociety.org/" rel="nofollow">Society of Typographic Aficionados</a>.</p>
    <p>Typefaces that have been created, published, or significantly updated between June 2010 and July 2011 will be accepted. Both traditional type specimens and designs showcasing typefaces in use will be accepted.</p>
    <p>Submission deadline is <strong>July 1st, 2011</strong>.</p>
    <p>Works will be exhibited during <a class="freelinking external" href="http://www.typecon.com/" rel="nofollow">TypeCon2011</a> in New Orleans and may also become part of an online exhibition or selected for print publication by SOTA. In past years the TypeGallery has also travelled internationally after the initial exhibition.</p>
    <p>Complete <a class="freelinking external" href="http://www.typegallery.com/guidelines/" rel="nofollow">submission guidelines and forms</a> are available on the TypeGallery site.</p>
