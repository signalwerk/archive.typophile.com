    <p>Whoa now, I think this may be my first Typophile post! *breathes deep*</p>
    <p>I was recently watching "Masculin Feminin" by Jean Luc Godard and noticed this awwesome font scattered throughout.</p>
    <p>I'va been looking around (google, whatthefont, et al.), but havent been able to figure out what it is, can anyone point me in the right direction?</p>
    <p>Merci!</p>
