  html: <p>If you would like to be involved in the planning of TypeCon2005, please let me know. <br> <br>TypeCon2005 will be held July 20-24, 2005, at the wonderful Parsons School of Design in New York. SOTA's sixth annual conference is presented with the Type Directors Club, with assistance from the American Printing History Association and other fine groups TBA. <br> <br>We need people to get involved on many different levels. This is your chance to make this the best TypeCon ever! <br> <br>We are scheduling planning meetings to be held in NYC in the next couple of months, and will also work via email and in the discussion forum provided by our friends here at Typophile. Send an email or respond here if you'd like to volunteer. <br> <br>While much of the work will be carried out by local crew, you can be involved in TypeCon even if you're not in the NYC area. Just let us know that you'd like to help, and we'll put your brainpower and time to good use. <br> <br>Looking forward to working with another dedicated group of type-lovin' folks, and another great event.</p>
  html_clean: <p>If you would like to be involved in the planning of TypeCon2005, please let me know. <br> <br>TypeCon2005 will be held July 20-24, 2005, at the wonderful Parsons School of Design in New York. SOTA's sixth annual conference is presented with the Type Directors Club, with assistance from the American Printing History Association and other fine groups TBA. <br> <br>We need people to get involved on many different levels. This is your chance to make this the best TypeCon ever! <br> <br>We are scheduling planning meetings to be held in NYC in the next couple of months, and will also work via email and in the discussion forum provided by our friends here at Typophile. Send an email or respond here if you'd like to volunteer. <br> <br>While much of the work will be carried out by local crew, you can be involved in TypeCon even if you're not in the NYC area. Just let us know that you'd like to help, and we'll put your brainpower and time to good use. <br> <br>Looking forward to working with another dedicated group of type-lovin' folks, and another great event.</p>
