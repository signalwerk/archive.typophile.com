    <p>I need a font for a campaign that conveys "romance," however, I do not want a script font. </p>
    <p>This is for the headline (eg, display purposes)-- the photography is romantic, but modern (clean, warm lighting)</p>
    <p>I was thinking something along the lines of an elegant, clean, lightly-seriffed font.</p>
    <p>any suggestions? thank you!</p>
