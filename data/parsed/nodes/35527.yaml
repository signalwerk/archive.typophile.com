    <p>5708 (small) pics of ancient Latin inscriptions at <a class="freelinking external" href="http://cil.bbaw.de/dateien/datenbank.php" rel="nofollow">http://cil.bbaw.de/dateien/datenbank.php</a>, just click the "Foto"-Checkbox,  "suchen" and then click through the cryptic list.</p>
