      <p>Well, this is not exactly correct. The Middle East versions of Adobe's products are developed by Winsoft, which is an independent company. So the additional money goes to them, for their hard work to adapt Adobe products to the Middle East requirements. </p>
      <p>&gt; although MAC supports OT but their support is partial not<br>
      &gt; including complex scripts (ie. Arabic). For Arabic MAC requires AAT.</p>
      <p>That, again, is not exactly correct. This was true for Mac OS X 10.4 Tiger and earlier versions, but in Mac OS X 10.5 Leopard, applications that use the CoreText font infrastructure such as TextEdit do support Arabic with OpenType fonts (though I have not tested vocalized text). There is some information about this at <a href="http://lists.apple.com/archives/carbon-dev/2007/Nov/msg00005.html" title="http://lists.apple.com/archives/carbon-dev/2007/Nov/msg00005.html">http://lists.apple.com/archives/carbon-dev/2007/Nov/msg00005.html</a> </p>
      <p>Adam</p>
