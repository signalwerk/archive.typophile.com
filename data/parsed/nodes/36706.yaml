    <p>Dear Typophiles,<br>
    Out of  Adobe Arabic OTF , I have made 2 complementary TTfonts with:</p>
    <p>1. Longer Fatha on wide letters.<br>
    2. Longer Madda on Alif after wide letters.<br>
    3. Higher Madda  on Alif after tall letters.<br>
    4. Longer + higher Madda on Alif after Wide+Tall letters.<br>
    5. Open loop sukun in place of the closed loop.<br>
    6. 69 Tansween instead of z9.<br>
    7. Standing Kasra similar to the Standing Fatha.<br>
    8. Isolated Kasra + (Tanween Kasr) from Shadda.<br>
    9. Closer Kasra + (Tanween Kasr) envelopable by final letters.<br>
    T. Marks on Ta positioned slightly above where the dot of its sister Za appears.</p>
    <p>Like my uncompromisng Arabic font, Adobe Arabic has been re-made:<br>
    1. to work on both Windows 3.11 and Xp.<br>
    2. with no Quarrelsome mark like the fatha in طَآئر+|ترَك<br>
    A Sample will be sent shortly when the renovation to my house is over.<br>
    Greetings from a hotel room with Flowers</p>
