      <p>An interesting and in many respects attractive experiment, Aziz. It is interesting to see the difference in overall texture between the two versions, and how the variation in mark size and the tighter spacing makes your version resemble the texture of a traditional naskh page even though the letterforms are the same. The loss of the fa-yeh and lam-yeh ligature forms is unfortunate, though.</p>
      <p>Adobe Arabic was designed primarily for use in modern business documents, with little expectation that it would be used for fully vocalised text. This is actually the only example of vocalised text in Adobe Arabic that I have seen outside of the tests that we made when we were developing the font.</p>
