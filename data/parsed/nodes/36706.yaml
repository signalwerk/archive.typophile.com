      <p>Dear Vladimir</p>
      <p>If this was you picture on the corner then you look too young to attend a 1960 events :)</p>
      <p>&gt;&gt;I guess I am one of those people who feel that the tradition of writing connected &gt;&gt;words is too important to get rid of, and that connected words create a ’word shape’ &gt;&gt;that aids legibility</p>
      <p>Indeed.  I would never support "getting rid of" connected Arabic form nor can anyone actually do it. My main goal is to emphasize Arabic script flexibility and power and to present more options to serve *real* educational and economical needs. In a way, this would be similar to how Arabic Poetry was successfully enriched last century by include "Amudi poems" side by side "Free Poems". Thinking in term of "replace" or "reform" which was the case for most previous non traditional works, unfortunately, is insulting and would never serve the Arabic script.  </p>
      <p>I must admit that for me personally, the added freedom of not having connectivity as an absolute "minimum design requirement" is a crucial factor for creative design. </p>
      <p>&gt;&gt;What are the different numbers 60 180 in the font names?</p>
      <p>This is related to Tatweel (or Kasheedah) lengths.</p>
      <p>-Saad</p>
