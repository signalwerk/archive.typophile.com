      <p>Interesting indeed.. I never knew that free Arabic verse poets had anything to do with replacing "Arabic Numerals" by Indic-Arabic. I thought it was a trend staring in Morocco and Algeria then adapted by the Arab East.</p>
      <p>I agree with you, "Arabic Numerals" look incongruous when used "as is" with Arabic fonts. My approach to this issue is that since using "Arabic Numerals" is becoming a strong reality on the ground, designers of Arabic fonts must create harmonious designs of these numerals and do not depend on Latin default. In my fonts I try to bring the "Arabic numerals" back to their original Indic-Arabic forms. For example, I flip Indic-Arabic 2 and 3 90 degrees counterclockwise and use diamond shape 0. Similarly my Arabic numeral 9 is made identical to Indic-Arabic.</p>
      <p>-Saad</p>
