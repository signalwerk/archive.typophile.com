      <p>&gt;&gt;When I use Illustrator and input Arabic text it comes out unconnected only letters in their final form. Is getting the ME version the only way to use Arabic in Adobe products? </p>
      <p>Unfortunately, Abobe products do not use the default operating system Arabic (or complex script) engine on Mac or Windows. You will need to use their engine so you will need to get ME (i.e. pay additional money to Adobe). But at least Adobe ME engine uses OT.  That way any OT Arabic font can be used with ME on MAC too; although MAC supports OT but their support is partial not including complex scripts (ie. Arabic).  For Arabic MAC requires AAT.  </p>
      <p>&gt;&gt;Could NAIM help, and if so why is it only restricted to OT?</p>
      <p>NAIM is a text input method in which you have no dynamic glyph substitutions before leaving a word (i.e hitting space) The purpose of NAIM is mainly educational but it is also useful to those who are tired and annoyed by the "hyper" (dancing) behavior of the current "shaping" approach.  I implemented NAIM for OT but it is not restricted to it. </p>
      <p>NAIM is an optional, simpler, and more natural character input method to implement within an Arabic engine. It works with all Arabic fonts, as you can see with the Java applet on the arabetics.com site. NAIM does not replace the need for a default Arabic engine in the first place. But of course, if we would use it in conjunction with one glyph per letter and uniformed diacritic positioning font styles, like fonts in my Mutamathil style, we would need engines to take care of RtL ordering only.</p>
      <p>-Saad</p>
