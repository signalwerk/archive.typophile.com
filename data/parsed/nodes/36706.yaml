    html: <p>Saad the 20x20 or so colorful pixels in my logo are cropped to hide a lot of gray ones! Thanks for the explanation about the disconnected fonts- you have the right attitude.  It is interesting that you mention the writing of free Arabic verse- some of those poets campaigned for the use of "Arabic Numerals" 123456780 as written  in the West thinking that this was a return to their roots. Unfortunately the practice has now spread in the Arab world - I say unfortunately because the Indic-Arabic numerals the Arabs used till recently are in the same style of the rest of the font, unlike the Roman-looking 1234... which look so incongruous on the page.</p>
