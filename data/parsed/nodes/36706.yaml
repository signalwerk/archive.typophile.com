      <p>FontLab Studio does not offer very good support for complex scripts. There is basic support -- you can preview the font and edit its metrics in right-to-left, you can preview the basic OpenType Layout features (init, medi, fina, isol). But no script-specific shaping is supported, mark attachment is also not supported. </p>
      <p>I agree with Saad that Adobe should be adding support for complex scripts to their applications, and I wish it happened faster. On the other hand, I can understand that some companies lack the expertise in certain fields so they initially rely on external providers. My guess is that Adobe will be adding more support for complex scripts themselves in the near future. </p>
      <p>Adam</p>
