      <p>Hello Saad and Aziz, yes the word uncompromising was used appropriately both by Azis and myself but the result is stylistically as different as goldfish are from flowers (!)- I am curious about the font Aziz developed or adapted - is it an Adobe font which he designed? </p>
      <p>I looked at Saad's arabetics website and it had a very nice way to display the various fonts and sizes. As an Arab my first reaction was to notice the gaps between the glyphs, then I looked at the glyphs themselves which had interesting graphic styles- Arabic is amazingly pliable!  As to the unconnected letters...I guess I am one of those  people who feel that the tradition of writing connected words is too important to get rid of, and that connected words create a 'word shape' that aids legibility. Not all of Saad's fonts have noticiable gaps, though.</p>
      <p>- The Mehdi  is the one I liked best, especially the elegant italic. What are the different numbers 60 180 in the font names?<br>
      - The Mitlaq has a delightful Ism-Al-Jalalah and qaf and many other nice fanciful shapes.<br>
      - The Amudi is the one I liked least- it has so many similar verticals (and gaps) that the eye is overwhelmed.</p>
      <p>I had similar reactions when I attended a lecture and exhibition by the late Nasri Khattar in Beirut...that must have been around 1960. His glyphs were nicely designed, but he presented a concept quite similar to the Mutamathil: <a href="http://www.unifiedarabicalphabet.com/" title="http://www.unifiedarabicalphabet.com/">http://www.unifiedarabicalphabet.com/</a> Interestingly the logo of his site is in connected words.<br>
      Good luck to you both<br>
      Vladimir</p>
