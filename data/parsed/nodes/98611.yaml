    html: |-
      <p>The governments of India and Pakistan, for example, have developed a number of free fonts. In the case of India, it's because the country has a number of different scripts, many of which, due to the country's relative poverty, are not economically important enough to encourage software developers to commission fonts for them. In the case of Pakistan, it's because Urdu is typically written in a particular style of the Arabic script, Nasta'liq, that poses a technical challenge not forced upon designers in the Naskh style. (Naskh, properly done, doesn't have a fixed baseline like Latin <em>either</em>, but since it is horizontal most of the time instead of diagonal, it can be debased by fudging away the occasions when the baseline should shift upwards within a word.)</p>
      <p>Note that the foregoing is a drastic oversimplification of topics that, if one is interested, have been discussed at length in threads here from which I learned of these facts.</p>
      <p>When it comes to Armenian fonts, what annoys me is that there are plenty of free Armenian fonts both Unicode and ArmSCII, but there doesn't seem to be a single free Bolorgir font in Unicode! Well, I guess I shouldn't be surprised those who favor a conservative typeface style are also conservative in their coding choices.</p>
