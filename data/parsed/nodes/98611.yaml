      <p>Couldn't find the license on that site. But I found <a class="freelinking external" href="http://www.granshan.org/index.php?lang=eng&amp;mode=alphabet" rel="nofollow">this</a> and even though the alphabet shown in black was Armenian (the Latin letters in orange seem to be in a different face) I immediately recognized the typeface as one I'd seen before (i.e. in an ICL 1900 manual)... it's Monotype Grotesque.</p>
      <p>Well, <em>maybe</em> it's actually trying to be Arial or even Akzidenz Grotesk - as my powers of font recognition are, I must admit, limited compared to those of the experts.</p>
      <p>(I'm now starting to think that although I identify the typeface very strongly with Britain, it indeed is Akzidenz Grotesk; and I've just learned that not only was that face known as "Standard" in the U.S., but that it was known as "Basic Commercial" in Britain.)</p>
