    html: <p>There isn't a license, the government website only mentions about the acquisition of the fonts. On facebook Mr. Gabuzyan confirmed that the fonts are available for download by anyone. The only logical restriction which he mentions about is that ‘neither the appearance of the characters nor the copyright data can be changed’. However one <a class="freelinking external" href="http://www.hayeren.am/?p=fonts" rel="nofollow">website</a> which distributes <a class="freelinking external" href="http://www.gov.am/u_files/file/fonts.zip" rel="nofollow">these</a> and other two fonts mentions that the fonts can be used for non-profit purposes only.</p>
