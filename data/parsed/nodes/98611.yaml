    <p>The Government of the Republic of Armenia allows it's official fonts to be used for commercial purposes by anyone (except of selling them directly). The fonts are <a class="freelinking external" href="http://www.granshan.org/works/2008/mrcuyt_mariam.pdf" rel="nofollow">GHEA Mariam</a> and <a class="freelinking external" href="http://www.granshan.org/works/2008/mrcuyt_grapalat.pdf" rel="nofollow">GHEA Grapalat</a>. Both fonts were designed by Edik Gabuzyan – corrections were made to GHEA Mariam's Latin, Cyrillic and Greek types by Robert Slimbach. Download them from <a href="/wiki/%20http%3A/%252Fwww.gov.am/u_files/file/fonts.zip" class="freelinking" rel="nofollow">here</a>.</p>
    <p>Any other government as generous as the Armenian? What are your opinions on commercial use of these kind of works?</p>
