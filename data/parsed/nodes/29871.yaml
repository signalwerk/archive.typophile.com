      <p>They are wrong; all of them. If they claim just about any superior performance, preference, whatever; either the sample is ridiculous or the interpretation is skewed, or the testing conditions are completely divorced from real reading situations, or some combination of these and any number of other flaws in methodology and design. The only accurate answer is to say that everyone has a different opinion and there’s no proof of any opinion as yet. </p>
      <p>The author might not be contradicting himself; as an example of the meaninglessness of the various studies, the findings he cites could indeed say that adult readers preferred Jenson but found Gill more legible. What that’s saying is that nobody learned anything valuable.</p>
