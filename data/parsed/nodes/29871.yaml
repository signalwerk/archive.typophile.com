      <p>Terry, please don’t think I believe graphic design is or should be devoid of expression. I’ve said this sort of thing before: nothing made by a human can be devoid of expression, and nothing made for a human should be. The difference between Art and Design however is the all-important Intent, which causes expression to be the objective in the former, while merely a subliminal force in the latter; in the former, Expression Is; in the latter, Expression Happens.</p>
      <p>&gt; trying to ensure that there is true empiricism</p>
      <p>Maybe not the case with you, but there are people who’d like to ensure the opposite, because they’re afraid of what people will end up thinking. It’s not far-fetched to claim that many people don’t want to change, not their habits, and certainly not their philosophy. Age has a lot to do with this; some of them have weathered their storms, and don’t want any more storms. Others are not only not tired of storms, they can’t wait for the next one to come and clean the writing on the walls (to rephrase Dire Straights). Heck, some even enjoy <cite>causing</cite> storms!  :-&gt;</p>
      <p>&gt; why should we continue to abstract absolutes from it and thereby close<br>
      &gt; our eyes to some yet unknown alternative which may be “good enough”?</p>
      <p>Who said anything about absolutes? You arrive at conclusions, and hopefully you apply them, if never with total certainty. What else is new in life?</p>
      <p>&gt; what exactly are we talking about studying?</p>
      <p>To me, at the highest level, how the instances of notan are turned into thought. More modestly, how the instances of notan are turned into language. Even more modestly, how the instances of notan are turned into words.</p>
      <p>hhp</p>
