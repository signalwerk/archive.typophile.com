      <p>“I hope there is agreement in the basic questions already,”</p>
      <p>Actually some typophiles are much more interested in the mechanism of reading in general, others more interested in learning about preference, or specifics about type design that influence readability. If you go outside our bubble, you find others whose interest starts from their work with the vision-impaired, or even from government-mandated standards that resulted from some of this dubious research. So I wouldn’t call it agreement, so much, but it has certainly been stated repeatedly that research methods and materials need much more careful and informed design, before meaningful data on any of these areas can be had. </p>
      <p>Since this dialog is heating up, and previously disconnected points of view are interacting, there’s an improving outlook for meaningful testing, so we are making slow progress.</p>
