      <p>&gt; why should we continue to abstract absolutes from it and thereby close<br>
      &gt; our eyes to some yet unknown alternative which may be “good enough”?</p>
      <p>Who said anything about absolutes? You arrive at conclusions, and hopefully you apply them, if never with total certainty. What else is new in life?</p>
      <p>&gt; what exactly are we talking about studying?</p>
      <p>To me, at the highest level, how the instances of notan are turned into thought. More modestly, how the instances of notan are turned into language. Even more modestly, how the instances of notan are turned into words.</p>
      <p>hhp</p>
