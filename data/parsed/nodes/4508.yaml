    html: <p>Nothing here especially sings to me, and it could stand a little cleaning up, but I'd say it's  <br>worth tinkering with. I'd start by thickening up the lines. It looks like your <b>i</b> has disappeared?  <br>Maybe in making the graphic? <br> <br>Half of the bottom of your <b>s</b> is gone too. That makes it unique among this alphabet. (The <b>c</b>  <br>does it too, but at the top, so the theme isn't nearly as obvious, if you see what I mean.) Do  <br>you want to include more of that theme? If not, then I probably wouldn't apply the idea to  <br>only one letter. I'd either develop it more or eliminate it. <br> <br>The lower half of your <b>g</b> looks too deep to me, like it descends too far.  <br> <br>But then, I'm a rank amateur around here. There are lots of other folks who have lots more  <br>experience and critical acclaim for their work than I do.</p>
