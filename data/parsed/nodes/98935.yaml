    <p>Just got my copy of John Boardley's Codex journal, issue 2. There is some wonderful stuff in there, though there's also a lot of very sloppy proofreading, including misspelling names of contributors, and other typos. There are also some small typographical quirks, like putting people's initials in small caps in running text and hyphenating ragged text, that look a bit strange to me. The book reviews are good, and I'm about to jump into the extensive Menhart section that comprises most of this issue.</p>
    <p>Has anyone else taken a look at this?</p>
