      <p>I liked it, but found the quality a bit lacking in repro. The Menhart bit has some very sloppy and unclear quoting which is confusing to read and makes weird design. In all I also found the design a bit dull with the beautiful content. I mean, quite often the tension between the images, text and elements (colored blocks etc) was just off. </p>
      <p>Such as with the cover, I know the reason for it, but pick one, type or photograph, and work further from that. Codex doesn't need tabloid-shop covers to sell, so make the most of it, hardly any other magazine designer (unless you count special subscriber versions) has that freedom.</p>
      <p>These are nitpicks though, so far I've enjoyed the content a lot and it has kept me reading (and looking!) for the last evenings.</p>
