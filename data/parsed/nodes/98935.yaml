      <p><em>...hyphenating ragged text, that look a bit strange to me.</em></p>
      <p>That can be legitimate. It is what is known as a soft rag, as opposed to a hard rag, but it should be done judiciously, either manually or with careful setting of hyphenation options, and only to avoid extreme differences in line length resulting from hard rag.</p>
      <p>Sorry to hear about the proofreading issues.</p>
      <p>My copy has not arrived yet.</p>
