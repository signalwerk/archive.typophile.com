      <p>I am pleased to announce that Codex has been turned into a book series, Codex Studies in Letterforms. The first volume, "The Eternal Letter: Two Millennia of the Classical Roman Capital," will be published by The MIT Press and will appear in mid-February (2015) in North America and in March in the UK and Europe. All subscribers to what was to be Codex 4 will receive a copy of the book free of charge.</p>
      <p><a href="http://mitpress.mit.edu/books/eternal-letter" title="http://mitpress.mit.edu/books/eternal-letter">http://mitpress.mit.edu/books/eternal-letter</a></p>
      <p>John Boardley graciously turned over the keys to Paul Shaw, who remains as the editor. Contributors to this volume include: John and Nicholas Benson, Frank E. Blokland, Matthew Carter, Father Edward M. Catich, Ewan Clayton, Lance Hidy, Jost Hochuli, Jonathan Hoefler, Richard Kindersley, Scott-Martin Kosofsky, Gerry Leonidas, Martin Majoor, Steve Matteson, Gregory MacNaughton, James Mosley, Tom Perkins, Yves Peters, Ryan L. Roth, Werner Schneider, Paul Shaw, Julian Waters, Maxim Zhukov. Linda Florio is the designer and I am the producer and co-editor.</p>
      <p>If you enjoyed Codex, the magazine, you'll find the books bigger, better, richer, and utterly essential. Work is underway on the next two volumes, on the themes of Modernism and Neoclassicism. They will appear in 2016 and 2017.</p>
