    <p>Hi everybody, first post here! I love graffiti fonts; here are my latest:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/font_6607.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/font2_4810.png"></div><p></p>
    <p>I used a wacom to draw these in Illustrator, then copy/pasted into fontlab. I wish I could just work in fontlab, but it doesn't do the brushy/pressure thing I need, AFAIK</p>
    <p>I can post .ttf files if anyone wants to install. Any feedback would be greatly appreciated.</p>
    <p>-Ben</p>
