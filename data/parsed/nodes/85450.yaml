      <p>IMO... doesn't really look like anything I've ever seen in graffiti.</p>
      <p>Perhaps why it doesn't work for me is that graffiti lettering is as diverse, as say, beer, and like beer, your major locales have their own flavor of graffiti that are largely the sum of the dominant cultural influences of these places. </p>
      <p>While there are some really cool letters in your alphabet (I really like your Q and your period), I think it would help to learn a bit about the things that influence graffiti letters rather than trying to pigeonhole graffiti into a certain look.</p>
      <p>For example, LA graffiti draws a huge influence from gang graffiti, much of which is rooted in Gothic letters. Combine that with the need to do it quickly on public spaces and the limitations of spray paint, the form itself began to evolve. Artist Chaz Bojorquez took what kids were doing on the streets and combined it with the techniques of Chinese calligraphy to take it to another level.</p>
      <p>And LA graffiti is vastly different from stuff on the streets of NYC, Sao Paolo, Philly, etc. It's good to know what makes em different as much as what they have in common.</p>
