      <p>As you suspected, this is a custom typeface; it is called <a href="http://books.google.com/books?id=vWwLt69Czv0C&amp;lpg=PP1&amp;pg=PA186#v=onepage&amp;q&amp;f=false" rel="nofollow">Newface</a> and comes in at least three different weights (Light, Regular, Bold). It has been drawn by Shelley Winter and Walter Tracy in 1989/1990.</p>
      <p>It vaguely reminds me of Robert Slimbach’s <a href="http://www.fontshop.com/fonts/singles/creative_alliance/kepler_std_medium_subhead/?&amp;sample_text=Telegraph&amp;sample_size=96&amp;acs_pt=32&amp;update=0" rel="nofollow">Kepler</a> that you might like.</p>
