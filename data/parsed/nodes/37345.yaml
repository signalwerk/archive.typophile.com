      <p>I tend to agree with the thinkers at Oxford on this one. Hyphenates were a fashion that failed to stick, and hanging on to them can be pretentious.</p>
      <p>I also agree with Nick—hyphenated phrases are a good way to identify words used as a group adjectivally. They’re especially useful for making hasty internet communication more comprehensible.</p>
