    html: |-
      <p>A hyphen might not qualify as a pigeonhole*, reports of its death are premature, still used for compound adjectives and it has migrated. The second thing I do when preparing a text provided by an author for setting is to search and replace spacehyphenspace to spaceenspace (I know this a British use, presumably something similar is required to accommodate other uses); the first is to replace double word spaces. The main concern for designers is, I believe, the other use of hyphens – to break a word over two lines and to avoid ladders.</p>
      <p>*5. Typogr. An excessively wide space between two words. Now rare.</p>
      <p>1683 J. MOXON Mech. Exercises: Printing xxii. 4 These wide Whites are by Compositers (in way of Scandal) call'd Pidgeon-holes. 1688 R. HOLME Acad. Armory III. iii. 123/2 Pidgeon Holes, when whites between words are as great [as], or greater then between line and line. 1755 J. SMITH Printer's Gram. 113 [Too] many Blanks of m-quadrats will be contemptuously called Pigeon-holes. 1841 W. SAVAGE Dict. Art Printing 590 s.v., Pigeon holes,..The only instances in which they are tolerated are when a page is small, and the type is large in proportion to it. 1876 Printers' Reg. 7 Aug. 28/1 Sometimes great ‘holes’, or ‘pigeon holes’ as they are called, are seen between the words of a newspaper paragraph, but how unsightly they are. 1904 T. L. DE VINNE Mod. Methods Bk. Composition 89 Spacing too wide produces ‘pigeonholes’ between words. 1970 R. K. KENT Lang. Journalism 102 Pigeonhole, too wide a space between printed words: several of them falling nearly under each other in successive lines may cause a river.<br>
      OED</p>
      <p>Craig, your link doesn’t work for me.</p>
      <p>James, were they ever a fashion?</p>
      <p>Tim</p>
