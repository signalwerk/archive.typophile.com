    <p>The newest edition of the Shorter Oxford English Dictionary boasts some 16,000 changes, all pertaining to the hyphen. It has either been omitted and the words left as two separate entities (ice cream), or the two words have been joined into one (pigeonhole). The AP is running a story which blames the internet and cell phones; and modern design.</p>
    <p>"Another factor in the hyphen's demise is designers' distaste for its ungainly horizontal bulk between words."</p>
    <p>So what do you think, typophiles? Is the hyphen dated and unattractive or just misunderstood by an eager-to-communicate generation?</p>
    <p>The AP story can be found <a class="freelinking external" href="http://news.yahoo.com/s/nm/20070921/od_nm/britain_hyphen1_dc;_ylt=ArHzlsg3leMV5A86tgZvZuqs0NUE" rel="nofollow">here</a>.</p>
