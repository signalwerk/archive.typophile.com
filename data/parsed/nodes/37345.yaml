    html: <p>The hyphen is not likely to go out of fashion when used as you thoughtfully illustrated with "eager-to-communicate generation." That is, hyphenating is an accepted (and, some would argue, requisite) method of identifying a <strong>group of words</strong>--one or more of which is <em>not</em> an adjective--used as a group adjectivally.</p>
