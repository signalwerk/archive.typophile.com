      <p>There aren't aren't a whole lot of accents, so the only one would maybe be fí.  In all caps raising the ¿ can be nice but isn't obligatory.  A quick look at advertisements in and around Madrid will show it's not the norm.</p>
      <p>The m-dash comes along a bit more in Spanish and has spacing rules that can differ from English styles.  It spacing usage in Spanish is equivalent to a parenthesis.  That is:</p>
      <p>Foo —bar— foo.  But:<br>
      Foo —bar—, foo.</p>
      <p>If it's done in a handwriting font, (this may or may not apply in South America), the capital i will frequently maintain its dot.  And universally in the Spanish-speaking world, the tilde can transform into a macron both in handwriting and more geometric fonts.</p>
