    <p>Is your “industrial diet” pushing you towards<br>
    disease?</p>
    <p>¿SU “DIETA INDUSTRIAL” LE ESTÁ EMPUJANDO HACIA LAS ENFERMEDADES?</p>
    <p>When I place the copy into inDesign, the ¿'s baseline drops(like above has it).  I correct whenever I encounter it for a cleaner look (has it appears in the translation), but I'm curious if there are other subtle tweaks that the English language doesn't have to worry about, but the Spanish do.  Treatment of accents and such.  Does anyone have typical things they correct when going through their Spanish copy?</p>
