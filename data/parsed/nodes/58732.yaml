      <p>Nick: Brasil doesn't have an accent in Spanish, but it would hold true for í+stem (bhlk) although off the top of my head I can't think of many examples.  íbamos, um, and that's it.</p>
      <p>On second thought, a quick search through <em>El buscón</em> (Ricardo López Aranda) lists the following í+stem combinations:</p>
      <p>ÍL:<br>
      sacrílego (+derivatives)<br>
      arrodíllase<br>
      perdíla (modern orthography: perdila)<br>
      vendíla (m.o.: vendíla)<br>
      díle (m.o.: dile)</p>
      <p>ÍB:<br>
      íbanse (+derivatives)</p>
      <p>ÍH: none<br>
      ÍK: none</p>
