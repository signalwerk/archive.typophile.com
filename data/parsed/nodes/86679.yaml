  html: |-
    <p>Not a typeface, but related.</p>
    <p>Do you have an Apple Magic Mouse?<br>
    Are you tired of turning the scrolling On/Off each time you get to work?</p>
    <p>If Yes, you will love this.<br>
    All it does is switching the scrolling On/Off with just 1 click.<br>
    As simple as that.</p>
    <p>Free Download<br>
    <a href="http://www.impallari.com/apps" title="http://www.impallari.com/apps">http://www.impallari.com/apps</a></p>
    <p>(Currently only for SnowLeopard)</p>
