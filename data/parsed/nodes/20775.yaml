      <p>Finally something I know that wasn't too obvious. </p>
      <p>Dagen, A Danish newspaper with a short-lived career, had everything designed by E-types. The typeface is custom and is a s far as I know not for sale – even though the Paper folded a couple of years ago.</p>
      <p>You can check the design case at E-types website: <a href="http://www.e-types.com/visUKProjekt.asp?artikelID=163">http://www.e-types.com/visUKProjekt.asp?artikelID=163</a></p>
      <p>or find more general information about the designers here: <a href="http://www.e-types.com">http://www.e-types.com</a></p>
