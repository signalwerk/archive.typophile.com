    html: |-
      <p>Okay macgyver, here's some more info for you: </p>
      <p>The typeface is called 'Press'. </p>
      <p>It's still not for sale as far as I know.</p>
      <p>As you can read on the E-types website it won an award. Here's some text:</p>
      <p>e-Types has recieved the 'Certificate of Excellence in Type Design' by Type Directors Club in New York.	</p>
      <p>e-Types is awarded for the 34 fonts which were designed for the Danish daily DAGEN. The font family is named Press and it was selected by the judges together with 15 other typographies from all over the world. 120 proposals were sent to Type Directors Club.</p>
      <p>e-Types and Press will be featured on exhibitions in Japan, Europe, the US and Canada. Furthermore the fonts will be presented in the Type Directors Club year book 2003, "Typography 24".</p>
