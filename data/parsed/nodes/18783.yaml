    <p>Hi all,<br>
    I’m desiging my wedding invitation and am using Dear Sarah for the display names. Does anyone have recommendations for the body copy? Right now I’m looking at Trajan, Requim, and Penumbra.  The artwork features handrawn plum blossoms so if I could find an elegant match that suggests an asian feel that would be great. Thanks for any recommends...<br>
    AM</p>
