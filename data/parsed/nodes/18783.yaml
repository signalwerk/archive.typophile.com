      <p>I think you could also consider an elegant sans serif like Sackers Gothic, Nobel, or even a light weight of Futura.</p>
      <p>I like the bottom design better but both are quite nice. I’m not in love with the grey border, maybe it could be a little lighter either in tint or in weight.</p>
      <p>Why does Barry get a “Mr.”?</p>
      <p>Have you considered an ampersand between the names? Dear Sarah has a nice one.</p>
      <p>and of course congratulations.</p>
