    html: <p>I’m not sure either really go; Dear Sarah is a pointed pen script, but Trajan and Requiem are shaped by a flat brush or nib (and are much more formal too). Of the two I think Requiem is the better match, but look at something like Bulmer, or Fry’s Baskerville, as well.</p>
    html_clean: <p>I’m not sure either really go; Dear Sarah is a pointed pen script, but Trajan and Requiem are shaped by a flat brush or nib (and are much more formal too). Of the two I think Requiem is the better match, but look at something like Bulmer, or Fry’s Baskerville, as well.</p>
