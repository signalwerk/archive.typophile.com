    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Software" class="freelinking" rel="nofollow">Software</a> : <a href="/wiki/Design%20Applications" class="freelinking" rel="nofollow">Design Applications</a> : ConTeXt</strong></p>
    <p>ConTeXt is a document preparation system based on the <a href="/wiki/TeX" class="freelinking" rel="nofollow">TeX</a> typesetting program. Being more recent than the other main <a href="/wiki/TeX" class="freelinking" rel="nofollow">TeX</a> macro package, <a href="/wiki/LaTeX" class="freelinking" rel="nofollow">LaTeX</a>, it is both more modular in its conception and more monolithic in its building.</p>
    <p>This system was developed from 1990 by Hans Hagen from PRAGMA Advanced Document Engineering (Pragma ADE), a Netherlands-based company.</p>
    <p>For more on ConTeXt, see the wiki:</p>
    <p><a href="http://wiki.contextgarden.net/Main_Page" title="http://wiki.contextgarden.net/Main_Page">http://wiki.contextgarden.net/Main_Page</a></p>
