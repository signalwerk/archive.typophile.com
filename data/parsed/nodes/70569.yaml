    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Volodja1_5242.png"></div><p></p>
    <p>Volodja is my first take on a serif face. Initially it started as a learning project, but now i intend to turn it into something, somebody can use.^^ </p>
    <p>So far i've drawn the latin alphabet, basic punctuation, some composites and numerals.<br>
    Kerning is rather incomplete (spacing may be too).</p>
    <p>The attached .pdf features three weights (two masters and one fontlab-generated instance) – but no italics yet. </p>
    <p>Please tell me what you think.<br>
    Any critique appreciated.<br>
    TIA for your time.</p>
