    html: |-
      <p>Numerals: The top halves of 3, 5, 7 are all light. You ought to choose a stress and put weight on either the horizontals or the strokes that meet them.</p>
      <p>To my eye, D, P, R could stand to be wider.</p>
      <p>Something very subtle is putting me off the regular-weight e. Other weights of the same glyph are okay. Go over its curves, I guess.</p>
