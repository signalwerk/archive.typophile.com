    html: |-
      <p>&gt; Ok, but perhaps they might know someone who is? :)</p>
      <p>Some of the folks here might do a fine job, just follow the normal procedure of asking to see examples of other logos they've designed. You might also want to post your notice at graphic design sites, and also check with some of the local design firms in your city. </p>
      <p>In my opinion, two weeks to design a logo is rushing it if you want to do a proper job. You may go through several rounds of concepts and several rounds of revisions.</p>
