    html: |-
      <p>Hi,</p>
      <p>to me, the type seems too wide for a clothing shop, wide type communicates oversize cloths, even though it’s rather light. Putting it in one line reinforces this impression and makes it harder to read it as a whole, as a coherent entity. And right now, it seems a little bit too austere to me</p>
      <p>Here are my suggestions:</p>
      <p>- try putting it in two lines</p>
      <p>- if you don’t want to make it more condensed, try to reduce the x-height (or rather enlarge the /S/’s and the ascenders. Why not try a little more playful solution for the /S/’s? Maybe even some swirls?</p>
      <p>- to me the (upper) terminal on /c/ and in particular on /r/ could use some more volume (when you change the /c/-terminal you would have to change the upper /S/-terminal as well)</p>
      <p>- the upper terminals on /S/ and /c/ could use a little ‘curl’ (see the left terminal of your /S/)</p>
      <p>Cheers</p>
