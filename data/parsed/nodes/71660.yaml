    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Secret_Shop_3863.jpg"></div><p></p>
    <p>Logotype for a small vintage clothing shop. Targeted largely to women, the client wanted a type-driven identity. The inventory is hand-picked vintage and sells to a trendy audience. After a bunch of cycles on numerous customized typefaces, we've centered at this direction. Some subtle things like the terminals, the 'e','r' and 'p' giving it a more character, I wanted a little old-style reference w/out being blatant, e.g. using a historical type.</p>
    <p>You'll probably never guess what type I started with... :)</p>
    <p>Would love any/all thoughts, thanks!</p>
