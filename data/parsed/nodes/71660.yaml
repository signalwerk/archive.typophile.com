      <p>Your /S/’s seem to be leaning backwards.<br>
      This looks much better alltogether, the terminals are way better IMHO.<br>
      You might want to focus more on the ‘vintage feel’, though. I think an even lower x-height might help (for proportions see e.g. <a href="http://new.myfonts.com/fonts/adobe/bernhard-modern/" title="http://new.myfonts.com/fonts/adobe/bernhard-modern/">http://new.myfonts.com/fonts/adobe/bernhard-modern/</a> )<br>
      Did you try to put /Shop/ beneath?<br>
      Cheers!</p>
