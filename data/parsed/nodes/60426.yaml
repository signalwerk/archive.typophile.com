      <p>Yes, that's in a nutshell what you opted for.</p>
      <p>Me not being intimate to Vista, you can choose between finding out where 'Common files' <em>are</em> stored on your system, or repeating the ad hoc fix for Illy and PS.</p>
      <p>A few of the common files on my system (XP) are "Version Cue CS3 Bitte lesen.html" (Adobe Version Cue), Adobe AIR.dll, MSADDNDR.DLL (MS Designer), patchjre.exe (Sun Java), CAPSULES.ELM (MS Themes), and sam.spd (MS TTS). Find one of these and the rest should be there as well.</p>
