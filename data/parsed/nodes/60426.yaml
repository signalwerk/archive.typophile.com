    html: |-
      <p>The CS suite has several backdoors to get fonts to work. Put the files in C:\Program Files\Common Files\Adobe\Fonts and they should be visible in all CS programs. Put them in C:\Program Files\Adobe\Adobe InDesign CS3\Fonts (or whereever your InDesign resides) and they'll only be visible in CS3. Similar for Illustrator and Photoshop.</p>
      <p><cite>I’m student, so i ain’t got any software licences.</cite></p>
      <p>You are mistaken. A student license is also perfectly valid: <a class="freelinking external" href="http://www.adobe.com/aboutadobe/openoptions/student.html" rel="nofollow">http://www.adobe.com/aboutadobe/openoptions/student.html</a></p>
