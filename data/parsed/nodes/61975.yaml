    html: |-
      <p>These particular words offer a very tight lockup. Soap sitting on Hope leaves a nice little rectangle of space between to insert "FOR". Against that solid backdrop, the bubbles ought to read nicely. Bolder typeface is better, but feels tired. I agree, something round, but maybe with overstuffed curves - something like Cadena Black (<a href="http://latinotype.com/espanol/fonts/CadenaBlack/" title="http://latinotype.com/espanol/fonts/CadenaBlack/">http://latinotype.com/espanol/fonts/CadenaBlack/</a>). </p>
      <p>Another idea would be to minimize the number of soap bubbles to the bottom mask, and inside the counters of o's and maybe p. Using a geometric sans, the bubbles could be slightly off center in the counter.</p>
      <p>Anyhoo, good name for a good cause. Nice project!</p>
    html_clean: |-
