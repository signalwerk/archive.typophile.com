      <p>I recall playing around with some of my own "prank" font experiments as soon as learned about the feature. There was nothing as well thought out as what Amy did. The problem with creating a diabolically funny prank font circa 2005 was that few applications supported OTF layout. OpenType can do more crazy stuff than just the calt as well. </p>
      <p>I think I also played around with the idea of the "secret word". That is, you type a secret word and get a special ligature or symbol. Of course with the various glyphs pallets people can still find it, so its not very exclusive.</p>
