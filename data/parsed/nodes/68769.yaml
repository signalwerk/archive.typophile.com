    html: |-
      <p>Cont...(pt.3)</p>
      <p>I did this with all possible preceeding characters (in this case b, f, w, p, u, r and t). I got this info (ashamedly off a <a href="http://www.morewords.com/most-common-ends-with/iz/" rel="nofollow">website</a>) to lessen my already rapidly growing glyph library by only including active/popular preceeding characters to "iz". This also worked fine until "y"»"why" when after coding twenty-four possible preceeding letters and their possible grammatical endings, the sentence "iz y, yet" turned into "is why, whyet". I countered this by including:</p>
      <p><em>sub space y e by space_y_e ;<br>
      sub y e by y_e ;</em></p>
