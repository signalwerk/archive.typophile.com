      <p>Cont...(pt.2)</p>
      <p>Here you can see I accomodated the space after "iz" to be grammatical points also for if the word is used at the end of a sentence. To accomodate the word existing in the middle of a sentence, with the possibility of a space-eating word existing just before that, I made the last line of code above. This caused problems with words such as "quiz" and "whiz". I rectified this by writing in the code:</p>
      <p><em>sub i z space by i_s_space ;<br>
      		sub b i z space by b_i_z_space ;<br>
      			sub b i z question by u_i_z_question ;<br>
      			sub b i z exclam by u_i_z_exclam ;<br>
      			sub b i z period by u_i_z_period ;<br>
      			sub b i z comma by u_i_z_comma ;</em></p>
