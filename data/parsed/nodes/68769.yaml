      <p>Cont...(pt.4)</p>
      <p>This solved the problem sentence given yet  I can't help feel it's going to have repercussions later on in the project. Words before worked fine and after-words such as "yet" and "youth" both work when the word eats space to the right in translation and doesn't eat space to the right.</p>
      <p>I haven't use classes because the class style I used (@lc) didn't replace the lowercase character. I also don't know of any 'if'-like parameters used in flash. I do however, realise that flash may be a much easier way to do it (with learning), like Amy Papaelias used in her 2005 <a href="http://www.typetalkfonts.com/typetalk_demo.html" rel="nofollow">TypeTalk</a> project but I feel this is a pseudo-solution in that it doesn't use Opentype features to do the translation. I'm sticking to my guns (I can justify later if interested) by using Opentype but the deadline is looming and I fear it may fall flat on it's face at a future point.</p>
      <p>Here is where I'd like to ask for help, advice, questions of "why are you even doing this?" and vexed virtual slaps for the insane mis-use of Opentype. I will also happily send my Fontlab files to those wishing to poke around at the code.</p>
      <p>Thanks in advance and apologies for the "post-and-comment" structure of this post,<br>
      Lewis</p>
