      <p>I think part of the problem with the "sub i z space by i_s_space ;" part of the code is your intention seems to be for a beginning of line context. I usually use a lookup for this. First create a class: such as:<br>
      All = all letters including space</p>
      <p>feature clig {</p>
      <p>lookup calt_iz.start {<br>
      ignore sub @All i' z';<br>
      sub i' z' by i_s;<br>
      } calt_iz.start;</p>
      <p>} clig;</p>
