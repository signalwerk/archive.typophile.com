      <p>The illustration and ITC Bookman Swash come from a poster from this film's 1976 theatrical release. Monotype Corsiva wasn't designed until the 90s, so the Corsiva text clearly is a later (careless) addition for the DVD packaging.<br>
      The original poster fairly screams 1970s, and its designer was obviously a big fan of Milton Glaser. (It could have been Glaser himself, though I can't find any evidence that it was. The Bookman looks too gimmicky to be Glaser's; he occasionally used swash characters, as on his 1962 jacket for the first Peter Paul &amp; Mary album, but his use of type is never this busy.)</p>
    html_clean: |-
