      <p>Well, I'll agree that one person praising Devanagari in that fashion doesn't prove anything. His complaint about our alphabet was that in English and French, because it doesn't have enough letters, combinations like th and sh are needed to make up the deficiency... and in Polish, sometimes the very same letter needs more than one different accent mark! (French has both acute and grave accents on the e, but perhaps following Devanagari, he was only worried about the consonants.)</p>
      <p>Devanagari, on the other hand, had enough letters to follow the rule of one letter per sound! Thus, why invent something artificial, like the Shaw Alphabet, when the natural genius of mankind has already created a phonetic alphabet ready for use.</p>
