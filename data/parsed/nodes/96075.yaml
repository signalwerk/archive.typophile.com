      <p>As the Indo-European tongues are a subset of all tongues, their phonemes are a subset of all phonetic entities. So either the Devanagari script or the Armenian alphabet might be adequate for them.</p>
      <p>For the world to adopt the Armenian alphabet because it's better suited to transliterating the Wu (Shanghai and related dialects) dialect of Chinese, or for the Brahmi-script users to switch to something Latin-based to suit foreigners... yes, neither is likely to happen. But for at least some purposes, such as new scripts for indigenous people adopting the Latin alphabet, it would be nice for the Latin alphabet to have a few extra standardized letters - so that the same letter would be used to express the same non-English sound in those languages that use it, for example.</p>
