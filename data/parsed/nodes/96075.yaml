      <p>This looks to me like an elaborate transliteration scheme, in which you use Latin and Cyrillic letters to represent not the phonetics of language (transcription) but the graphical structure of how the language is represented in another writing system. Considering that there are already well established Latin alphabetic transcription systems for Indian languages, I wonder if trying to introduce a Latin+ abugida transliteration system would not simply be confusing.</p>
      <p>There are regional variant forms of Devanagari letters, which might explain some of your difficulties identifying some characters. The Unicode charts use modern Hindi forms of the western variety.</p>
