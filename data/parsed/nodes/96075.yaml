      <p>Now I see, though, that the idea posed in the earlier thread is (almost) superfluous. In researching additional data to satisfy the curiosity I would have piqued by adding pictures of old typewriter arrangements to my web site, I have found that one doesn't have to go to Sanskrit and its related abugidas... there is one existing alphabetic script that has three letters instead of two where the Latin alphabet has (b,p) or (g,k) or (d,t), thus representing voiced b, g, and d, plosive p, k, and t, and the unvoiced but not plosive letters found in Chinese.</p>
      <p>At least in its Eastern and Classical pronounciations. The Western version has two consonant sounds in each group, not three, and so two of the three letters in each group sound the same.</p>
      <p>Unfortunately, unlike Greek and Cyrillic, for example, the letter forms are <em>very</em> unfamiliar to Latin-alphabet users. Thus, while lowercase h looks the same (when it's not written as a sort of zig-zag line) and O actually stands for O, but (uppercase) S stands for t, and too much else doesn't even begin to suggest a sound... and so I don't think it will be possible to persuade speakers of English, French, Spanish, and so on to switch to this alphabet simply so that they can now unambiguously and correctly transliterate Chinese.</p>
      <p>Of course, this reminds me of an old Hägar the Horrible cartoon, in which the title character responds to the statement "We will never have peace on Earth until all men learn to understand each other!" - he responds, in one panel, "True..."</p>
      <p>and then in the final panel, asks "But how are we going to get everyone to speak Norwegian?".</p>
