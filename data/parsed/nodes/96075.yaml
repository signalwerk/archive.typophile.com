      <p>My goals were more ambitious than a mere transliteration scheme.</p>
      <p>Instead, this is being (although not too seriously) proposed as a new script that would replace almost all existing writing systems.</p>
      <p>According to the book "Significance of the Alphabet", by Charles Kraitsir, "The Dēva nāgari is the only scheme of writing perfectly adapted to represent to the eye the Indo-European tongues."</p>
      <p>Well, English is an Indo-European tongue. So, with this abugida, English can be written, effectively, in Devanagari, without its speakers having to learn a whole new alphabet which would be less legible to them.</p>
      <p>And because of the dominance of English, many people in the languages using abugidas derived from the Brahmi are familiar with Latin letters. Right now, Thai, Burmese, Lao, Tibetan, Hindi, Tamil, and so on... while they are written either in Devanagari or systems essentially isomorphic to it, they are written in a wide variety of different alphabets.</p>
      <p>If, instead, they all used the same alphabet, then they could all take advantage of the great quantity of type design work done for European alphabets (although throwing in a few Armenian letters somewhat weakens this argument), and one obstacle to communication between those nations would be removed.</p>
