      <p><em>...it would be nice for the Latin alphabet to have a few extra standardized letters - so that the same letter would be used to express the same non-English sound in those languages that use it, for example.</em></p>
      <p>This is largely what has happened, on a regional basis, in the extension of the Latin alphabet for sub-Saharan African languages and for aboriginal languages of North America. The linguists working in these areas have mostly followed one another in adapting IPA forms for phonemes not found or poorly represented in European orthographies.</p>
