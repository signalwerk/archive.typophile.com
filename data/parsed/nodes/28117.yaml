      <p>It seems to me the issue is pretty simple, Typophile exists because there is a need for a very high end of user. There exists on this plane very much excellent work and thought. But the elephant in the room is piracy at all levels of this industry and when it starts to get fairly acknowledged it can then be dealt with. If we asses blame to Softmaker or Brendel or SSI, then where is the outrage at Bitstream? Bitstreams core fonts are highly derrivative and they charged alot of money, not $59.99.<br>
