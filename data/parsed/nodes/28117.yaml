      <p>Thomas, please use proof to show I am wrong and am ranting, not making fun of my signature line, which is pretty weak. I think you misread passion for ranting here.</p>
      <p>The history of typography is colorful and full of piracy, that is the truth. Innovation has been much of the hallmark of piracy (Compugraphic, Bitstream, URW and Adobe come to mind) and yeah there are scumbags along the way, but the innovation hopefully will shine through. But what if Brendel some how had stumbled into either great innovation or art? Would they be discounted by Typophile? And what if any of the Big name founderies starts a dismal fall, will they be proped up by Typophile, and for how long? </p>
      <p>If you live in a nice little bubble and try to hide from the FACT that every player in the font business, regardless of position, has pirated and say “No piracy here” what are you really doing? Oh make the bad boys go away. It is true that there are street theives and museum theives and they may be a different class, but their act is the same. I don’t think Softmaker would have the audacity to call any pirates “Originals” either. </p>
      <p>At one time I had ~1200 fonts for Linotronic 202(including the phantom “SuperFonts”), 2300 fonts for L-300, the original Adobe type library, and 1000+ fonts for Filmotype, previous to that my family used VIPs, Diatronic and Hot Metal Linotype machines. Yeah that is quite a lot of fonts, time and money invested into the industry. I tell you this backround because I have some very intimate knowledge of fonts, the font business and typography, which I love. </p>
      <p>The Truth shall set you free</p>
