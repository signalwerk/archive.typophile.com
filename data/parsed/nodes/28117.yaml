      <p>William: <em>Just to be clear, I was was saying that I found it extremely hard to believe that these fine fellows would do anything improper. So the ‘very, very bad’ of John Hudson above is not accurate.</em></p><em>
      </em><p><em>Thanks for the story.</em></p>
      <p>Maybe you should also hear the story from some people on the Linotype side who were there at the time. Or those who negotiated the Linotype-Bitstream agreement to finally ’legitimise’ the clones a mere three years ago. Or maybe ask the designers whose typefaces were not licensed by Bitstream how they felt about other people profiting from their work while they received no royalties. The phrase ’very, very bad’ is a pretty mild to what you will hear from some people.</p>
      <p>Regarding the ’fine fellows’, I like them very much, one-and-all. They are very knowledgeable and talented, and generous with both. They’ve all done things that have been very positive contributions to the type business. Matthew and David know more about designing type than most of the rest of us put together, and it would be hard not to be fond of Mike. I remember, during a presentation by a German copyright lawyer at ATypI Barcelona in 1995, Jonathan Hoefler wanted to draw attention to the naïvite of some of the speaker’s assumptions about the type business. So he raised his hand and said ’I’m sitting next to one of the biggest pirates in the history of type’. Mike laughed.</p>
      <p>Being fine-fellows didn’t prevent them from cloning most of the Linotype library without permission and profiting from typeface designs  without paying royalties to designers (some designers, including Hermann Zapf made agreements with Bitstream; others, including Adrien Frutiger) did not. But being fine fellows did get them forgiven more quickly than anyone else would have been, although the feeling at Linotype — I am told by someone who was there — was that Bitstream was legitimised by the industry much too soon.</p>
