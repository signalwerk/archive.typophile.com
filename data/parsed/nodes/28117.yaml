      <p>I’m not going to bother debating with you. You can believe what you like - it’s mostly for the benefit of others reading that I’m taking a stand on this.</p>
      <p>I’ve known Robert Slimbach for almost ten years, and he’s been my mentor in typeface design for the last several years. This may give me a bias, but it also means that I know whereof I speak. I do not believe that Robert has imitated or would ever deliberately imitate any existing typeface without full credit. When he does a revival he is very clear about it.</p>
      <p>In my 9.5 years at Adobe, the company has taken the high road with regards to not doing derivative typeface designs, even when there have been very strong business incentives to do otherwise. When somebody has suggested doing something of dubious ethicality in this area, standing up and objecting has always drawn the endorsement of upper management.</p>
      <p>The last time I had a serious ethical concern about a strategic issue related to type at Adobe, I let the appropriate people know, even though the thought occurred to me that placing ethics over business might be a “career-limiting move,” as they say.</p>
      <p>So what happened? My concerns were forwarded to president and COO Shantanu Narayen, and he reportedly said “gee, the guy’s got a point, go re-examine that issue” (or words to that effect). A couple of weeks later a senior VP dropped by my office to chat about the problem, essentially to reassure me that the issue would be dealt with and not ignored as I had feared. At the end of the conversation he basically asked me, by the way, would I be interested in a promotion?</p>
      <p>So it wasn’t a career-limiting move, after all. Mostly I felt embarrassed that I had seriously underestimated the ethics of the upper management of the company.</p>
      <p>Regards,</p>
      <p>T</p>
