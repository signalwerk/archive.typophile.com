      <p>“Is the Bitstream vs Linotype story told anywhere?”<br>
      “Mike Parker and Matthew Carter. Both were British ex-pats”</p>
      <p>Mike Parker is not actually a Brit ex-pat. You’d have to ’ave heard his mother to understand the accent. </p>
      <p>Bitstream vs Linotype began when Leonard Storch Enterprises won a suit allowing themselves to continue photocopying Linotype film fonts and selling them for less than the originals cost to make, which for Linotype was a lot, for Storch it cost nothing. In addition, slightly later on, Linotype agreed to produce bitmap screen fonts for Xerox, but declined to do the same for Scitex. So, when Linotype’s management and parent, Allied Chemical, decided also to cut the letterdrawing budget by an amount about equal to the salaries of the four top executives of the letterdrawing department, Bitstream was born. Those four knew that a type department was profittable.</p>
      <p>Bitstream then proceeded to build a staff, tools and a library for typesetter, imagesetter and word processor manufacturers who could not get type otherwise, as Linotype and the other manufacturers would neither license to them, or Bitstream, and there were no other independant digital font foundries. None of the thousand digital outlines made for this purpose were compatible with Linotype’s versions, (except the monospaced), in either width or image and none were made to work on Linotype machines, until the later advent of PostScript, by which time, most of the Linotype library had been cloned by Adobe.</p>
      <p>“Parker and Carter are unlikely-looking as a pair to be cast in the role of pirates”<br>
      Absolutely not. You’d have to make a pretty exact replica of an existing and profittable standard, rename it something, put it right back on the originators machinery, and have the financial resources to to do otherwise, to be cast as a pirate in my book.</p>
    html_clean: |-
