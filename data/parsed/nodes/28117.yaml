      <p>I’m sticking with my definition of cloning, thanks, and no, I would not shoot someone who was stealing food from my, or anyone else’s garden, preferring to ask questions first...</p>
      <p>The Bitstream stuff was certainly my side of the story, but the underlying facts remain: that none of the fonts were clones, most of the sources were more than 50 years old (then), and Linotype licensing was denied for the “new” stuff. The Linotype people who inherited the library from Mike’s regime, (the same upper management who denied Scitex products on politically-based religious grounds), subsequently licensed the library to Adobe at less generous terms than Bitstream offered. Whereupon, another “very, very bad, pirate”, the much loved by me but Ex-Autoligical Sumner Stone, came into typographical control of Adobe’s capture of much of Linotype’s property, for which Linotype ended up paying Adobe royalties, even when they sold their own products. Those Linotype people would be very hard to find! ;)</p>
      <p>I don’t know, were they gobsmacked? I must have been too, because I thought Adobe having a monopoly on the tools, the format, the pdl, interpreter and font format was a very, very bad thing, and to allow them a monopoly on design too was worth breaking up at any cost. There are, I guess, designers who are comfortable with their skills, and there are, I guess, others who need the security blanket of an overarching monopoly to protect their “shortcomings” from the fierce glare of the world’s eyes. “Bitstream was legitimized by the industry much too soon.” Me too. What about you?  Geeze, some newbies just have no idea how easy they have it now...</p>
      <p>God speed and “lead on” John Hudson, </p>
      <p>Cheers!</p>
