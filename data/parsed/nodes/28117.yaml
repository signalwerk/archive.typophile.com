      <p>Rodrigue,</p>
      <p>I am telling you now that you are wrong about Adobe, substantively. </p>
      <p>You are parroting some bile that someone else spewed re: Cronos being derivative of Today. Don’t believe everything you see on the internet. That writer, and you, are ignoring a pretty big elephant. I challenge you to get both typefaces, print them out, and compare them. Even better, I suggest you overlay them in Illustrator, or FontLab. You should finally notice that they are not similar in construction, finish, proportion, spacing, or any other detail. They have in common that they are humanist sans designs. That is all. In that sense, either one of them could be said to be “suspiciously similar” to Gill, Syntax, Agenda, Bliss, Kievit..... the list goes on. It’s a category of typeface, there’s no piracy, there’s not even a derivation. One has only to look clearly to see this. As others have pointed out, the very idea that Robert Slimbach would even be bothered to rip off another design is insane. He has far too much skill and talent for that. This campaign was devised as a retaliation and is not well-motivated. Let it go. pursuing that topic weakens your argument.</p>
      <p>Your complaint about Adobe seems founded on this alone. From what I know of Adobe (and I’ve worked in the type department there), their library is one of the most legal, legitimate, and completely licensed ones in the world. You’re way off base.</p>
      <p>Your point is well taken; there has been piracy in the font business since it was a business. We all know that. I think Tiffany and Paul made it abundantly clear that Typophile has always had a policy of not providing URLs to sites that seem illegitimate or suspicious. If they misjudge a site, then surely it will not stay hidden, and there’s no harm done. Typophile’s policies aren’t powerful enough to globally condone or hinder piracy, or the discussion of it. It doesn’t censor the owner of the site, it doesn’t restrict anyone from voicing their opinion, and it doesn’t prevent you from finding out about questionable sites if you wish.</p>
      <p>You have made an uninformed generalization. Yes, piracy is rampant. No, every single type company is not wallowing in pure pirate gold. Look deeper.</p>
