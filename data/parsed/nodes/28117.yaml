      <p><em>I am willing to accept looking at both fonts (Today Sans and Cronos) in FontStudio and if my assesment is off I will gladly say so. I think to I will look at Book Antiqua and Palatino (Adobe) as well, among others.</em></p>
      <p>I <em>have</em> looked at Today Sans and Cronos side-by-side and overlaid and what they have in common is a similarity of weight and proportion, such that when you print a page of text at, say, 10pt in Today Sans and the same page of text in Cronos at the same size, the <em>overall</em> appearence of the two pages is very similar. But if you compare individual letterforms, and especially compare the fonts at larger sizes, what is most apparent are the many differences. Apart from anything else, the gentle detailing of Cronos is such that I’ve always considered it primarily a display face, while Today Sans is better suited to smaller sizes because it is not so soft. As I understand it, Adobe listed Today Sans as ’prior art’ in their design patent application, i.e. as an acknowledged design in a similar style along with, I presume, other humanist sans such as Gill Sans (to which Today Sans bears a stronger resemblance than Cronos). My conclusion was that Cronos had very similar proportions to Today Sans and clearly belonged to the same idiom, but was not a clone or a pirated copy. It belongs to the class of types — and there are many — that have been developed to competetively exploit a market that has already been identified or established by another company. I think Myriad is another such example. This isn’t limited to type design: it occurs in lots of different kinds of products from kitchenware to automobiles (products in which intellectual property protection is very much stronger than for type design, so in which the concept of what constitutes illegitimate copying and what constitutes legitimate competetive products is much more clearly defined — one of the problems with the lack of good IP protection in type is that private opinion and interpretation runs rampant, with no legal and ethical standard against which to be measured). I think there often is an ’unpleasant taste’ in the development of some competetive products, which, even if not illegal or strictly unethical, offend our sense of the respect that is due to the product that first establishes the market. So, for example, I am less impressed by the various automobiles clearly influenced by the design of the Audi TT than I am by the Audi TT itself, even though none of them are copies per se and some of them are interesting cars in their own right. For those who know and care about such things, the obvious thing to do is to vote with one’s chequebook or credit card and purchase the product that you respect more.</p>
      <p>Regarding Book Antiqua, this is a clone of Palatino, and no one claims otherwise. Adobe’s Palatino is licensed from Linotype, perfectly legitimately.</p>
      <p>What Bitstream did was a Very Very Bad Thing that continues to be a bone of contention in the type community, even though Bitstream and Linotype signed a deal in 2003 that ostensibly legitimises the Bitstream clones of Linotype fonts.</p>
      <p>The truth will indeed set you free, but first you have to seek it, for the sake of truth and freedom, not as a stick to beat other people with.</p>
