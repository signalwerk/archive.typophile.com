      <p>“What format were Linotypes digital fonts in pre-bitstream?”<br>
      Digital fonts covers a lot of ground. The only things you could call digital outlines were 100 or so Ikarus fonts. They also had many machine formats that were either bitmaps or vectorized outlines. Most of the library was on paper and film with a 10” em was the standard font format for its unshrinkable scanabilities.</p>
      <p>”...was the “cloning” of Linotype’s fonts by Adobe done under license from Linotype, or were the current agreements worked out later?”</p>
      <p>In all but a few cases the cloning was under license from Linotype.</p>
