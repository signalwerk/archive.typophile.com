      <p>Rodrigue</p>
      <p>I suspect that the imitation of typefaces was the nature of typeface development right from the get go, the mid-15th century. Exact replication became far more feasible with the development of pantograph machine (used in wood type) and then the camera and photographic film but during the metal years that followed it was more often still a case of modification rather wholesale copying. Imitation is the sincerest form of flattery or something like that. The exact slogan eludes me. </p>
      <p>It really was the photofilm/analog computer years that the piracy that you are discussing became rampant. And then on to the digital years where the effort spent in copying is nearly nil and has led us to this very significant problem. </p>
      <p>Still I would suggest that even though the established commercial type manufacturers may have different names of otherwise identical or near identical typefaces, they may very well have licensed the right to do that. They really can’t afford the legal costs that could result if they do not do so. Though I’m sure examples can be brought up that would prove specifically otherwise in certain instances. I know that Adobe spent (pre-2000, I’ve not had any business contact with them since) an inordinate amount of time just checking to verify that no one had ever even used the name of the typeface before; I kind of doubt that they would in any way risk just copying a competitor’s design.</p>
      <p>Gerald</p>
