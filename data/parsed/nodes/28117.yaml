      <p>Rodrique, I think you are oversimplifying the history and the current situation to a point where misrepresents what is at issue.  </p>
      <p>If Bitream did their own Baskerville and Caslon and Bodoni and these closely resembled earlier versions, including Monotype and Linotype, was is piracy or not? This is a debatable issue. Part of debate is that the originator was by then long dead, and that the Mono and Lino versions were themselves revivals. Of course when we go to Gill Sans, the question becomes a bit more difficult. When it comes to Palatino—Book Antiqua, that seems to me to go over the line.</p>
      <p>The case here I believe includes digital fonts that are also being marketed with royalties to originator of the font. And someone has just copied the digital file and is selling it cut-rate or giving it away with no royalties to the originator. To me there is no debate here, it is just theft. My opinion, but also the court’s opinion in many countries. Not being a lawyer, I don’t know how many.</p>
