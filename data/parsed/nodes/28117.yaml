      <p>What are we saying here? That Myriad is a forgery of Frutiger? Or, at some point, are designers simply faced with nowhere to turn for “innovation” unless they turn letters into something bizarre and unrecognizable?</p>
      <p>After a time, one simply cannot stray from creating a face that is in some way, derivative. Yes, Dederon Serif looks quite a bit like Dolly, and certainly, some of the versions of Baskerville out there look nearly identical, but then, what else whould they have looked like to begin with?</p>
      <p>Try something. Draw the letter “B.” But make it legible, somehting fit for reading at smaller point sizes, ideal for long tracts of text. Nothing too fancy, but don’t make it too plain, either. Chances are, you’ve just created a forgery.</p>
