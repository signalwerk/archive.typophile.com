      <p>Also: Instead of trying to nail down blacks and whites, in the realm of Ethics (as opposed to Law) it’s much more useful, much more <cite>human</cite>, to focus on one simple concept: reasonability - as subjective as that is - because everything is. A good thing to focus on is this passage on the FontInfo site that Elliot referred to above: “Some companies will ... charge outrageous rates or refuse to offer any terms at all.” The alleged Rules of Capitalism can say what they want, balanced human beings know better (even if some of them too often act otherwise, especially when opining on companies one of which they do work for and the other they don’t).</p>
