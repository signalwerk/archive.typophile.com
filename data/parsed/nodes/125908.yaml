  html: <p>Hey, I need to put a mixed case word on a window and it seems it would work best vertically. Wondering if there is a standard rotation whether the text is typically rotated to read bottom to top, or top to bottom. It is mixed case so rotated 90 degrees counter clockwise would put the base line on the right hand side, and the text would be placed on the right hand side of window reading bottom to top so I'm thinking this works. Wondering what the norm is for vertical type.</p>
