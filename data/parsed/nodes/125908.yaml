    html: <p>But to answer W's question, I would say he/she has it right if signage is going on the right side of window. If on the left side then top to bottom would seem more appropriate. In each case the baseline is reinforced by the window's edge (esp. if there are no descenders)</p>
    html_clean: <p>But to answer W's question, I would say he/she has it right if signage is going on the right side of window. If on the left side then top to bottom would seem more appropriate. In each case the baseline is reinforced by the window's edge (esp. if there are no descenders)</p>
  - id: 605028
