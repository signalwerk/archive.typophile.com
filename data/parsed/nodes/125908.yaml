    html: <p>On the other hand, where do you expect people to be standing? If they're standing in front of the window, they will be reading the text upside down if they tilt their heads, and will need to move to the right in order to read it the right way. So having the text run bottom to top at the right edge of the window seems to me to orient the text outside the window frame, whereas running it top to bottom orients it to a reader standing in front of the window.</p>
    html_clean: <p>On the other hand, where do you expect people to be standing? If they're standing in front of the window, they will be reading the text upside down if they tilt their heads, and will need to move to the right in order to read it the right way. So having the text run bottom to top at the right edge of the window seems to me to orient the text outside the window frame, whereas running it top to bottom orients it to a reader standing in front of the window.</p>
