    html: |-
      <p>Typically when you're doing vertical text you want people to read up; the reason it reads downward on book spines is so that it will be upright when the book is lying cover-side up on a table.</p>
      <p>I agree, though, that orienting it so the baseline is supported by the edge of the window makes sense.</p>
