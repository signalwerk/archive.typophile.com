    html: <p>From the brief description here I think I would be tempted to go for reading downwards, although I'd make my decision based upon the exact circumstances and conditions in situ. I have often wondered if there is a handedness issue with this. Looking at bookshelves for example, with both 'up' and 'down' spines, I find it irritating to have to keep rocking from side to side and find tilting to my right much more natural; I'm right handed.</p>
