    html: "<p>I think it looks slick, very modern. The thing is, I don't get how it relates to either \"ego\" or \"phoenix\" or the combination. That's not to say it doesn't -- I just don't see it. I think a logo should connect solidly to the company or individual it represents. <br> <br>Minor note: I agree with the comments about the <i>g</i>.</p>"
