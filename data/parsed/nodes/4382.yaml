    html: <p>At the moment my goal is to gain skills in the use of type. But my goal is to eventually attempt at my very own. But I would prefer to get more background knowledge before this happens. <br><br>For the time being I am just practising by hand rendering ones that already exist and then tweaking them for poster designs etc.  <br><br>You’ve been a great help so far Mr Troubleman — so I will be sticking around!  <br><br>So far I have learnt that type designers are quite disturbed!  <br><br>Not scared no… not yet&nbsp;anyway. </p>
