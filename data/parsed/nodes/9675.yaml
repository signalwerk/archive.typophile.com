    html: <p>Many apologies for sending sooo many bad jokes. I couldn't help myself. Hopefully I've gotten it all out of my system. <br> <br>========== <br> <br>What is a typophile's favorite brand of fruit drink?  <br>Kerns <br> <br>Of course they always buy them in packs of two. - so they can buy kerning pairs! <br> <br>What type of diabetes is a graphic designer most likely to get diagnosed with?  <br>Type 1 <br> <br>Favorite hotel in las vegas?  <br>The Sans <br> <br>What did the 'Free Font Monger' say when he went to the bank?  <br>"Can I open a Chank account?" <br> <br>What did the graphic designer build his house out of?  <br>Adobe <br> <br>Type designer's favorite sport?  <br>Bowling <br> <br>Favorite hat?  <br>Bowler <br> <br>What happened when the type designer was taken to court?  <br>He threatened to counter sue. <br> <br>What kind of relationships do typophiles prefer?  <br>The open type <br> <br>Favorite Song?  <br>I shot the serif by Eric Clapton <br> <br>Favorite Madonna song?  <br>Justify my love <br> <br>Favorite play?  <br>Waiting for Didot by Samuel Beckett <br> <br>Favorite actor?  <br>Steve Gutenberg <br> <br>Favorite Steve Gutenberg movie?  <br>Font Diner <br> <br>Favorite circus act?  <br>Trapeze artist because they are ARIALists <br> <br>Last choice of a graphic designer looking for a career change?  <br>Hobo <br> <br>What did the greedy graphic designer say at the font sale?  <br>How much for Aldus? <br> <br>What part of the fish does a graphic designer remove when cooking?  <br>The gill, so it will be Gill Sans. <br> <br>Why did the graphic designer go see the psychic?  <br>He wanted to see what was in his Futura. <br> <br>What did the typographer say to the printer who wouldn't stop talking?  <br>"Get to the point." <br> <br>Why did the printer forget to say goodbye to his wife?  <br>He was pressed for time. <br> <br>What type of hunting do printers prefer? <br>trapping <br> <br>How does a printer get rid of a bad client? <br>With a choke hold <br> <br>Printer's favorite desert? <br>Keyline pie <br> <br>Did you hear about the unscrupulous paper company? <br>They would ream their customers  <br> <br>Graphic designer's least favorite American talk show host? <br>Moire Povich <br> <br>Favorite typophile superhero? CAPtain America <br> <br>favorite comic book writer? Stan LEEgature <br> <br>Favorite book? <br>The Time machine <br> <br>Xerox's favorite action star? <br>James Bond <br> <br>What did the child of a type designer say when she was asked to share?  <br>"My Fonts!" <br> <br>What is the favorite bathroom appliance of a graphic designer? The toilet - because you can make things flush <br> <br>Second favorite? <br>The counter top <br> <br>What did the graphic designer do to the assistant who kept indenting the text? <br>She kept tabs on him  <br> <br>What happened to the graphic designer who was forced to use a PC too long? <br>He shot his boss with a 0169 caliber bullet <br> <br>Why do type designers always remove the petals from flowers?  <br>They just like to look at the stems. <br> <br>~ Roballoo!</p>
