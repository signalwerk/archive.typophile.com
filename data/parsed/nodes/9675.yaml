    html: "<p>haha. ok here's a recent joke I made....well in an correspondance to a past Art Director I had who had seen a font I used recently and asked what it was...we got into discussion about scripts and where to find some good ones. I pluged a couple addys and anywho..here's the correspondance: <br> <br>&gt; This is fukin awesome... <br>&gt; I ma always so busy I forget that there are freaks like you who are <br>&gt; constantly searching... I love the lamar script, i think i will buy it and <br>&gt; make a purty wine label with it. <br>&gt;  <br>&gt; Thanks Tan ya! <br> <br> <br>Then I replied: <br>hmm another freak comment eh? - My constant searching may be excessive but  <br>keeping a good arsenal is helping me fight designery crime. Its tough on the  <br>frontier without front line &amp; backup, (cue Good, Bad and the Ugly soundbite).  <br>If it gets rowdy over there again, take cover, fire your rifle, send smoke  <br>signal, I'll save the men. <br> <br>dashes off into the sunset.  <br>Serif Sprowl <br> <br> <br> <br> <br></p>"
