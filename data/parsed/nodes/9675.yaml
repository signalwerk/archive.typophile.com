    html: "<p>I got into a fight with a type designer once. I was counterpunch drunk for hours. My hair was a mess, my cap height was all wrong, the blood had to be swashed off with gentle strokes into a bowl, and I had to stem my cursing on the way out of the bar, tail between my legs, nursing my arm.  <br>  <br>The post from Typographer.com, as requested above:   <br>   <br>Type Oddity - World's first typographic joke discovered   <br>A mystery man from AMX Studios (London, UK), who does not want to be identified, passed on what might well be the world's first (and worst) typography joke. Here goes... \"Two fonts walk into a bar, the bartender says 'we don't serve your type here'. So they called the serif.\"   <br>Posted on Friday, January 26, 2001 </p>"
