      <p>The logotype is a special design for the product. </p>
      <p>(Diablo) <a href="http://www.diablo-movie.com/diablo-movie.jpg" title="http://www.diablo-movie.com/diablo-movie.jpg">http://www.diablo-movie.com/diablo-movie.jpg</a><br>
      (Diablo 2) <a href="http://www.galeon.com/laparanoia/img/Diablo%202%20Wallpaper.jpg" title="http://www.galeon.com/laparanoia/img/Diablo%202%20Wallpaper.jpg">http://www.galeon.com/laparanoia/img/Diablo%202%20Wallpaper.jpg</a></p>
      <p>You can see here some differences between the new one and the old one. The A was flipped and they did some little changes around. You can see the changes that they made in 12 years :D Diablo II was released in 2000 and Diablo in 1996</p>
