    html: <p>I noticed the existence of that system last week, based on a "looklike Xpress" appl <br><a href="http://www.mileniumcrossmedia.com/en/Milenium/Mileniumdesig.htm" target="_blank">http://www.mileniumcrossmedia.com/en/Milenium/Mileniumdesig.htm</a> <br> <br>but in fact a sort of front end of a largedatabase system. <br> <br>What is surprise me a lot, is the system still not unicode (from the infos I get from clients), and require only TrueType. <br></p>
