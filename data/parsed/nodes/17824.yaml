    <p><em><strong>KEYWORDS:</strong><br>
    Olympic Games visual identity, Olympic Games corporate identity, Olympic logos, Olympic emblems, Olympic mascots, Olympic sport pictograms, Olympic sport pictographs, Olympic information pictograms, spectator signs and symbols, Olympic typography, wayfinding system, Olympic signage, Olympic marks, Look of the Games, Olympic posters, Olympic medal, Olympic torch</em></p>
    <p>Hi, everybody!!!</p>
    <p>This is Panos Koutsodimitropoulos. On 2002, I did my MA on <strong>'Olympic Sport Pictograms'</strong> and ever since then I try to collect as mush info as I can regarding all the visual elements of Olympic Games. My aim is to create an educational web site, in which there will be all the info for <strong>'Olympic Games visual identity'</strong>. Everything that is related to Olympic Games' visual elements and you happen to know or heard about it may be very valuable to my research.</p>
    <p>The final web site will present for every modern Olympiad the following:</p>
    <p><strong>a) the basic visual elements</strong></p>
    <ul>
    <li>Emblems (bid, main, secondary ones for: environment, culture, volunteerism, torch relay)</li>
    <li>Mascots (in sport action, variations)</li>
    <li>Sports and information pictograms</li>
    <li>Pattern (in <a href="http://www.athens2004.com" title="http://www.athens2004.com">http://www.athens2004.com</a> is called 'secondary graphics' and in <a href="http://www.torino2006.org" title="http://www.torino2006.org">http://www.torino2006.org</a> is called 'Look of the Games')</li>
    <li>Typography</li>
    <li>Colours</li>
    </ul>
    <p><strong>b) design applications, such as:</strong></p>
    <ul>
    <li>Wayfinding</li>
    <li>Posters</li>
    <li>Medal</li>
    <li>Torch</li>
    <li>Web site</li>
    <li>Print items</li>
    </ul>
    <p>So, any help is welcomed. You could help me by giving me reference for: an article that you have read concerning Olympic Games visual identity, a book that contains similar data, digital files and anything you may think off. If you want to send me digital files, please use my e-mail: <a href="pkoutsod@gmail.com" rel="nofollow">pkoutsod@gmail.com</a>.</p>
    <p>Thanks is advance. The project will be done inside 2006. So, stay tuned!!!</p>
    <p>:-)</p>
    <p>Panos Koutsodimitropoulos</p>
