    date: 2002-10-24T19:51:00
    votes: null
    html: "<p> buenos. here's my two cents: <br> <br>-the uc &amp; lc \"c\" seem top heavy. same problem is there with the lc \"e\" as well. if you were to extend the bottom line this could be avoided. <br> <br>-one thing i don't understand is why does the stem in lc \"u\" and \"y\" slope, and it doesn't exist on any other stems. i suggest that you put a slant on the top of the leg on the lc \"k\" and add a slant to the end of the hairline in the lc \"x.\" <br> <br>-the uc \"W\" just doesn't do it for me, same thing with the lc \"w.\" the lc \"w\" looks like it's 2 v's put together. try to integrate them more. the uc \"W\" looks funny with the extended line in the middle. <br> <br>-the stroke of the uc \"M\" and \"N\" seems too thick compared to the rest of your uc. <br> <br>I love your letter forms. They're all very light and airy. It's going to look great with just a little bit of tweaking. I hope that my terminology was correct <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br> <br>t1mmy </p>"
