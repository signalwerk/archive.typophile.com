    html: '<p> Rodrigo:  <br> <br>La "@" me parece un poquito cerrada. <br>La "Ñ" y la "ñ", creo, necesitan mas aire en el "tilde". <br> <br>IndoSans me parece una bella tipografía. <br>Me gustaría poder observar los trazos con mayor detalle. No linkeas un PDF? <br> <br>Abrazo. <br> <br>Ramiro. </p>'
