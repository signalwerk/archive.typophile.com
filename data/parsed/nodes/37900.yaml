      <p>Aric: <em>"You could learn a lot about early Utah English (or at least what was considered the prestige dialect in that time and place) from studying the Deseret Alphabet materials."</em></p>
      <p>Yes you could learn a lot, but only from the letters, journals, and newspaper articles written in it.  Some research done by Ken Beeseley indicates that the books that were printed, or prepared for printing, probably followed the pronunciations given in Websters Dictionary.</p>
      <p><em>"should a modern-day adopter of the Deseret Alphabet stay true to the 19th century spelling reforms and occasionally violate the phonetic correspondence, or write according to their modern phonetics at some expense to the spelling standard?<br>
      "</em></p>
      <p>This is an interesting question.  I think there is a balance that needs to be struck. In the first Deseret News articles that are written in the Deseret Alphabet there is included a brief explanatory paragraph before the actual Deseret text.  In this explanation it is stated: </p>
      <p>    "We present to the people the Deseret Alphabet, but have not adopted any rules to bind the taste, judgment or preference of any.  Such as it is you have it, and we are sanguine that the more it is practised and the more intimately the people become acquainted with it the more useful and beneficial it will appear.<br>
          The characters are designed to represent the sounds for which they stand, and are so used.  Where one stands alone, the name of the character or letter is the word it being the only sound heard.  We make no classification into vowels, consonants, &amp;c., considering that to be of little or no consequence; the student is therefore at liberty to deem all the characters vowels or consonants or starters or stoppers or whatever else he pleases.<br>
          In the orthography of the published examples, Webster's pronunciation will be generally followed, though it will be varied from when general usage demands.  All words having the same pronunciation will be spelled alike, and the reader will have to depend upon the context for the meaning of such words..."</p>
      <p>    It seems that the rules were intended to be rather loose; however, the newspaper used Webster's dictionary as a guide, but even then they varied the spellings according to the local dialect.</p>
      <p>I appreciate the comments on the font.  Those are the kind of comments I was originally after.  I'm not sure what could be done with U+1041B (the letter ehthh).  The original letter looks like a Latin capitol L.  However, I could see changing the bowl angle on U+10419 (the letter ehf).</p>
