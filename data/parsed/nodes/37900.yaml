      <p>Thank you for your very insightful comments Randy.  Some of the arbitrary stress and terminals comes simply from trying to fit the Deseret Alphabet into the Times New Roman motif.  For example, in Times New Roman both J and j have lower ball terminals while S and s have serif terminals.  However, I see what you mean, and I will have to take another look at the differences between cases.<br>
      cheers,<br>
      Joshua</p>
