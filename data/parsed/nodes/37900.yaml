      <p>I guess the Deseret Alphabet is part of my heritage too.  Never really thought about it that way before.</p>
      <p>You could learn a lot about early Utah English (or at least what was considered the prestige dialect in that time and place) from studying the Deseret Alphabet materials.  One thing that stands out to me from looking at the chart of letters is the presence of a vowel "aw" as in "aught" (which would correspond to IPA ɔ).  These days that vowel is a sort of shibboleth of American dialectology--and is absent from Utah English and other Western US dialects.</p>
      <p>In terms of modern usage of the Alphabet, this raises an interesting question.  Two main goals of the Deseret Alphabet were to standardize spelling and to correspond closely to the phonology of the language.  Since the phonology of Utah English (as well as other dialects) has changed since that time, should a modern-day adopter of the Deseret Alphabet stay true to the 19th century spelling reforms and occasionally violate the phonetic correspondence, or write according to their modern phonetics at some expense to the spelling standard?</p>
      <p>Getting back to the font--I've never liked the way the Deseret Alphabet looked, but I have to say that your font seems like a big step toward modernizing it and making it attractive.  I really like the serifs.  One complaint is that U+1041B looks too much like a Latin capital L to me; the original alphabet seemed to go to some lengths to avoid that resemblance (although I don't care for the original one either).  I think that one and ones like it deserve some more attention.  The same can be said for U+10419 and its lower-case counterpart, which incorrectly look like the letter P.  The angle of the bowl is just plain wrong.  On the other hand, I don't mind so much a resemblance in letters that were clearly designed to reflect letters from the Latin alphabet, such as the letters that look like an O or the letter that looks like N.</p>
      <p>Please don't take the criticism badly.  It's interesting to see a "Mormon pioneer" font and I look forward to following its development.</p>
