      <p>Miss Tiffany,</p>
      <p>I have been working on this mostly out of a deep fascination for the Deseret Alphabet.  The Deseret Alphabet is a part of my heritage, but unfortunately it is virtually unknown by others who share that heritage.  I would simply like to see it become more widely known (and even used) by those who have a similar cultural heritage.  I don't have any specific application in mind.  I would like to see everything from poetry to personal correspondence written in Deseret. </p>
      <p>You are quite right about the attempts to reform English orthography.  There were several groups or individuals pushing for it in the 1800's, but language reform was not limited to the 19th century.  The Shavian Alphabet (another phonetic alphabet for English), for example, was developed in 1958.  </p>
      <p>Ken,</p>
      <p>Quite right.  Click <a class="freelinking external" href="http://copper.chem.ucla.edu/~jericks/Deseret%20Alphabet%20Tables/The%20Cannonicaly-Ordered%20Deseret%20Alphabet.pdf" rel="nofollow">here</a> to see a table listing the letters, letter names, and letter sounds for the Deseret Alphabet.</p>
