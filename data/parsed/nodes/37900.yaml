    <p>This is a <a href="/wiki/Deseret%20Alphabet" class="freelinking" rel="nofollow">Deseret Alphabet</a> font that is patterned after <a href="/wiki/Times%20New%20Roman" class="freelinking" rel="nofollow">Times New Roman</a>.  Deseret is a phonetic, non-Roman alphabet for writing English.  It has been encoded in <a href="/wiki/Unicode" class="freelinking" rel="nofollow">Unicode</a> for several years now, and the PDF sample shows the Unicode positions of the letters.  Deseret does not have separate characters for upper and lower case letters - they are distinguished by size only.  However, I have introduced some differences in the upper and lower case glyphs in keeping with the Times.  This is the fist serious font (with many more to come) I have developed for the Deseret Alphabet (or any other alphabet for that matter) and I would appreciate any comments.</p>
    <p>Click <a class="freelinking external" href="http://copper.chem.ucla.edu/~jericks/Fonts/Bee%20Fonts/Bee%20Font%20Maps/PDFS/Times%20Deseret%20Sample.pdf" rel="nofollow">here</a> to see the PDF.</p>
    <p>-Joshua</p>
