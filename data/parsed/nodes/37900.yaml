      <p>My first thought when looking at this alphabet:</p>
      <p>Whoever invented the original Deseret alphabet glyphs should have looked at Hoefler's type 110 class here on typophile ( <a href="http://typophile.com/courses/type110" title="http://typophile.com/courses/type110">http://typophile.com/courses/type110</a> ). I understand of course that Mr. Hoefler arrived to late to help Deseret, but it does suffer from lack of unity and practicality in many of the fanciful shapes. And while the exercise would be purely academic, it would be interesting to try and use the alphabet as a starting point for the assignment in Hoefler's lesson.</p>
      <p>Still it will probably help you Joshua, to look at it for your Times adaptation.</p>
      <p>R</p>
