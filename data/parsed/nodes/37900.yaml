    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/times_des_6354.gif"></div><p></p>
      <p>Glyphs circled in green suffer from color issues. They are generally too dark, or at risk of becoming so. Sometimes it's caused by overlaps that mass dark areas, othertimes it's just too much stuff happening. These are the shapes that I would characterize as too fanciful. They look like letters someone invented in one sitting verses letters with roots in writing that developed over a long time with efficiency as a motivator.</p>
      <p>Glyphs circled in red suffer from spacing and balance issues. In latin type, there are some letters that cause spacing problems P, L, T , r, etc, but for the most part latin letters set up a nice rythm. In Hoefler's lesson these shapes would be modified because the white and black areas would be out of balance. Also on the bottom, the "reverse N with raised left side" glyph :-) shows very poor balance. One of the things latin letter strive to do is fit inside a trapazoid with wider base than top. This allows them to rest on the baseline and feel stable. This is why the top loop of a B is smaller, why the top of an S doesn't stick out as far as the bottom, why the top bar of and E is shorter than the bottom. Some instability is fine, but this alphabet is rife with unstable characters.</p>
      <p>The purple reversed N shows what the stress would look like if and N was redrawn in reverse, not merely flipped. Interesting that the lowercase version of the same glyph has "correct" stress.</p>
      <p>Finally, the terminals on the strokes seems arbitrary in some places. On the slash 8 (second to last line) why a serif in one, and a ball terminal in the other? This difference between lower and upper is all over the alphabet, but missing in the Ss Flipped Jj etc.</p>
      <p>One last note: I'm framing my thoughts by relating this alphabet to priciples from the latin alphabet. Partly because this borrows heavily from it. But it also has elements of greek and cyrillic.</p>
      <p>R</p>
