    html: |-
      <p>Michael,</p>
      <p>in the official FontLab terminology, "Macro Tools" are a special category of macro. This is a bit confusing since all macros could be called tools – the RMX Tools are not "Macro Tools" in a FontLab sense, however.</p>
      <p>"Macro Tools" have to stay in the /System/Tool folder or they won't work. Unlike normal macros, they will appear on the left of the Macro toolbar, they only work in the Glyph window and they are started (rather than "run") by clicking on the arrow button on the very left, not the play button.</p>
      <p>This whole "Macro Tools" thing does not seem to be widely used, and it is hardly documented. I am working on one, which will hopefully be part of RMX some day.</p>
