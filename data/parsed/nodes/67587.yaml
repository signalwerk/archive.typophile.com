      <p>I find Magma an excellent reading sans. The contrast is way less pronounced than in Optima, the tapering gives Magma a lively character. It’s not unlike Syntax, but fresher and more versatile. You can judge it on paper: <a href="http://www.stonetypefoundry.com/specimenbookspag.html">the printable specimen pdfs</a> that are available on the Stone Type Foundry’s website are very helpful.</p>
      <p>Note that there is an economic ‘Compact’ family in between the standard and the Condensed.<br>
      Furthermore, Sumner Stone has extended the superfamily (which originally started out with <a href="http://www.stonetypefoundry.com/basaltoverview.html">Basalt</a> – two sets of signage caps incl. arrows) with slightly heavier <a href="http://www.stonetypefoundry.com/halofontspage.html">Halo grades</a>, light <a href="http://www.stonetypefoundry.com/numamagmathinspe.html">Titling weights</a> plus matching archaic Roman forms (<a href="http://www.stonetypefoundry.com/numaoverview.html">Numa</a>), an accompanying uncial (<a href="http://www.stonetypefoundry.com/muncoverview.html">Munc</a>), and a softened spin-off, <a href="http://www.stonetypefoundry.com/tuffoverview.html">Tuff</a>.</p>
      <p>I haven’t combined Magma with Cycles, but they should work together quite well. You’ll find more options for accompanying sans-serifs in <a href="http://typophile.com/node/39592#comment-258784">this list</a>.</p>
