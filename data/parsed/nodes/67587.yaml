    <p>Hi all,</p>
    <p>I recently bought Cycles 11, which I am very excited about! And I spend some time on the Stone Type Foundry website, and I'm quite interested in Magma. Can you tell me what you think of Magma? I think it is very hard to judge from the screen, because of the fine details and tapered strokes. It reminds me a bit of Optima. I have one book set in Optima, which is alright, not great though. How do you rate Magma as a book typeface (an unusual one). And do you think it would make a good combination with cycles, when used on the same page together?</p>
    <p>Alternatively, do you know other sans-serifs that would go well with Cycles?</p>
    <p>THX Jeffrey</p>
