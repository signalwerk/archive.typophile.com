    <p><strong> New from the Process Type Foundry</strong></p>
    <p>We’re pleased to announce the release of Eric Olson's latest typeface <a href="http://prcss.co/chrono" rel="nofollow">Chrono</a>. At home within a range of design environments, <a href="http://prcss.co/chrono" rel="nofollow">Chrono</a> is a refined oval sans serif of twelve styles ranging from Thin to Black with matching italics for each. Singles, packs and the complete family are available in both desktop and webfont formats.</p>
    <p>See more of Chrono: <a href="http://prcss.co/chrono" rel="nofollow">http://prcss.co/chrono</a></p>
