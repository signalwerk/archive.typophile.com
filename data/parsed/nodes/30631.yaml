      <p>I learned design pre-computer when we had to sketch and (as much as possible) realize our ideas before committing to type. Type was very expensive and we did not have the luxury of fiddling around until it looked right. So we had to try to “see” the concept before we put our ideas into type. My boss, from those days, could spec every element of the design on a piece of vellum and when we ordered the type he was rarely, if ever, off in his measurements and specs.</p>
      <p>I would never go back to those days - and in fact don’t do a lot of drawing anymore - but consider this period of my design development/education extremely valuable. I encourage you to try sketching now, while you’re in school. Even now, I think my brain is still programmed to try to visualize what I want to do before I open up a page and start designing.</p>
