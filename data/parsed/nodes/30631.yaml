      <p>In my experience hiring young designers who cut their teeth on the Mac, I do think something gets lost when you are not taught to try to visualize the design problem and solution before you boot up your computer. I remember one assistant whose computer was down and she came to me and said “I can’t work”. I threw some type books and a pad of paper at her and told her work up some ideas. I think she hated me.</p>
      <p>No doubt schools need to adapt their teaching methods to the new technology and there’s no need to force students to learn the waxer and the ruling pen. The best instructors will teach their students the to think visually and conceptually with or without a computer screen in front of them, and be flexible in their approach to the problem.</p>
