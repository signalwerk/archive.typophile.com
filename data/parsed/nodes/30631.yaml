      <p>At the art school I’m attending, I’m also told many times I need to draw and make more sketches. The concept is the most important thing, they say. Which is of course the truth. However, when I look around at some of my fellow students; some of them can draw their ideas quite nicely, but afterwards, they do not have the skills to finalize their ideas on the computer. Which renders their ideas useless to them.</p>
      <p>I’m not saying the drawing part is obsolete, but it is not everything.<br>
      But of course, it is good to at least be able to make quick and comprehensive sketches, even if it’s just to communicate your idea to someone else in a quick way. Before you spend alot of time making something on the computer, finding out the person you are making it for, doesn’t even like the basic idea to begin with.</p>
