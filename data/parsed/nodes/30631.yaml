      <p>Scott,</p>
      <p>I agree with those that say sketching on paper is still the best way to flesh out ideas quickly. As someone who never went to design school, I still fall into the trap of going to the computer to quickly to try and make a weak concept work. I end up wasting time fleshing out a concept that was not going to work to begin with.</p>
      <p>I would recommend <a href="http://www.illustrationclass.com" title="www.illustrationclass.com">www.illustrationclass.com</a> by Von Glitschka. Though it is more focused on illustration instead of type design, there are numerous downloads where Von goes through his process from sketching to computer. I think it is a great resource. He even has examples from other illustrators/designers so you can see their process as well.</p>
