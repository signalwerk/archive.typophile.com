    html: <p>I grew up in the pre-computer era and drew a lot as a child, so I’m comfortable with a pencil and paper. But as a designer, I don’t do a lot of detailed sketches — it’s usually just a quick way to see how to distribute things on a page, or how a multi-story page will flow, or a way of quickly comparing two approaches. The sketches themselves rarely need to look attractive or polished. They’re just a scribbly shorthand for your ideas.</p>
