      <p>Employing an experimental approach throughout my design education (originally as a student of illustration) allowed me to explore what was intuitive in terms of mark making, ideas development, etc. Even now, I find myself using found objects such as feathers and sticks to dip into Indian ink for lettering, mark making and drawing. Indeed anything that makes a good mark. Depending on the nature of the design brief, I will sometimes develop ideas pencil to paper and some directly on the computer, usually a mixture of the two. For a design student and <a href="http://www.twitchspeed.com/site/Prensky%20-%20Digital%20Natives,%20Digital%20Immigrants%20-%20Part1.htm">‘digital native’</a> like yourself, I think it is invaluable to try many different processes and approaches until you find one that is comfortable for you; one that is not unnaturally forced or laboured.</p>
      <p>Further to what James has previously mentioned: Swanson (Heller’s, Education of a Graphic Designer) makes an interesting point, stating that, “by teaching what they were taught, [design educators are] teaching the graphic designers of the twenty-first century how to be mid-twentieth century graphic designers.”</p>
