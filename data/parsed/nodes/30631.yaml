    html: <p>A pencil is like a computer or a piano or a telescope in that it is an instrument that you might employ to give voice and range to your imagination. And one ought to worry less about performace or quality at the outset and more about simply establishing a healthy relationship with drawing in which you find it purely enjoyable. It may not seem like it, but going to life drawing sessions is a great introduction to the orchestrations of seeing, thinking and sketching. I know with certainty that drawing all the time enriches my own approach to design, but that is very, very far down on the list of reasons why I do it.</p>
