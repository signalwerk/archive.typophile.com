      <p>The conflict between design methods based on drawing/visualization and the new methods was brought up in Communication Arts 347, September/October 2006, pp. 22-27. For me the key paragraph was:</p>
      <p>“Christoper Vice, designer and teacher at Indiana University Herron School of Art and Design, says, in spite of the fact that technology is incorporated into the curriculum, “Most design school are still approaching the teaching of design the same way they did 50 years ago. Like exceptions such as Art Center College in Pasadena, IIT (Illinois Institute of Technology), University of Illinois at Chicago, and Herron, design schools need to rewrite their curriculum following a model of relevancy.“</p>
      <p>I like drawing and sketching, but I often don’t need to do it, and I can often knock out better sketches by screwing around in Illustrator or Indesign than I can with a heap of tracing paper and a light table. This is a big issue for me because during the previous semester my core design class revolved around concept and tracing-paper process. It didn’t go well for me, and I really only got work that I liked when I just ignored the instructor and put the paper away.</p>
