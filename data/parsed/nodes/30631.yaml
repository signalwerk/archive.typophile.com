    <p>Greetings everyone,<br>
    My instructor recommended this forum to me. I’m here to ask for some general advice. What in your experience has turned out to be a waste of time in the creative process? What are some things I might avoid that can prevent me from being productive? Are there any well known situations that could cause me to slow down?<br>
    I do everything on the computer but attending classes now I am being persuaded to do more of my preliminary work by hand until the concept is more developed. Has anyone else struggled with this? Having grown up making art entirely on the computer I personally find it hard to do even simple things by hand.<br>
    I’m just looking for your thoughts, feelings and opinions.<br>
    Thank you<br>
    Scott / BigBeard</p>
