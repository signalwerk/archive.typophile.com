      <p>When I studied calligraphy and book design with Friedrich Neugebauer back in the 1970s, he insisted that I take figure-drawing classes (his workshop was part of a much larger college of artistic and industrial design). Having grown up in an architect’s office, I was very comfortable with T-square, french curves, technical pens, etc. but <em> terrified</em> of free drawing. So I felt that the time would be better spent if I did more lettering instead. However, he persisted, I acquiesced and went to drawing, and gradually I realized that doing this was a way to approach qualities of line, gesture, the nature of curves, light and dark, from a different vantage point. He encouraged me to work on litho stones as well. </p>
      <p>I do not make figure drawings for the work that I produce, but the process certainly was very enlightening and I see now the wisdom of Friedrich’s direction. Even if they are not part of my working outward expression, these drawings are indeed a part of my foundation and instincts. </p>
      <p>I don’t know if this is helpful to you as you struggle with hand work, but it certainly seems worth trying some more.</p>
