    <p>Hi all,</p>
    <p>I’ve been interested in typography for many years now and wonder if anyone could recommend any texts on the subject for further reading.</p>
    <p>I’ve done the obvious (Bringhurst obviously - which is now like gold dust to get hold of and TYPO by Freidl, Ott &amp; Stein) and a few others, but any general historical texts you could recommend would be fantastic.</p>
    <p>A nice simple Monday morning (boo!) question...</p>
    <p>Cheers,</p>
    <p>Simon</p>
