    <p>Sorry my first post is this kinda post.</p>
    <p>I don’t need an ID as much as I need help tracking down<br>
    something like this quick sample I made that’s similar<br>
    to what I’m looking for.<br>
    </p><div class="imageWrap"><img src="/files/read_6738.jpg"></div><p></p>
    <p>I saw a posting on another site a few weeks ago that<br>
    announced a new family had been released that had similar<br>
    traits to this but I can’t remember where/who it was.</p>
    <p>Futura Display in the old Letraset catalog has some of<br>
    the features I want (very upright, rounded corners) but<br>
    the M and N are lowercase and look dated, and I really<br>
    need something contemporary looking</p>
    <p>thanks in advance.</p>
