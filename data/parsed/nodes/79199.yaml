    <p>There was a thread somewhere on typophile, that I can't seem to find. Somebody was looking for some free "Good" fonts (I think), for a school newspaper or column. It was is the last few weeks. One of the free fonts was issued free from a government, school or perhaps newspaper. It was a serif font with multi weight and styles. I think the site was a UK site or perhaps finnish? I can't remember...<br>
    Does anyone know where that thread is, or perhaps know what that font was?</p>
