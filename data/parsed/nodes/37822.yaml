      <p>I have no information at all, but that doesn’t stop me from offering an opinion!</p>
      <p>I think it’s just a different market segment: the fonts are all offered with a single user EULA*, in TrueType only, and most (but not all) don’t include the small caps and osfs. </p>
      <p>There are also some fonts that I suspect were never big sellers for Montotype, like <a href="http://fontmarketplace.com/productinfo.aspx?ProductID=PAS01-70-01-01&amp;CategoryID=41"> Pastonchi.</a></p>
      <p>It is interesting to note that clause 10 of the <a href="http://fontmarketplace.com/custom.aspx?ID=18">EULA</a> offers _editable_ embedding if used “in a “Personal or Internal Business Use” document (that is, a document other than a “Commercial Product” as defined herein)”.</p>
