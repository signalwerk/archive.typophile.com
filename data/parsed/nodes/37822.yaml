      <p>Well, read the definition of Commercial Product in clause 7*, and then note that a “Personal or Internal Business Use” document” is qualified in clause 10: “(that is: a document other than a “Commercial Product” as defined herein)”.</p>
      <p>*”7. “Commercial Product” as used herein shall mean an electronic document or data file created by Use of the Font Software which is offered for distribution as a commercial product in exchange for a separate fee or other consideration. By way of illustration and not by way of limitation, an electronic book or magazine distributed for a fee shall be considered a Commercial Product; a document distributed in connection with a commercial transaction in which the consideration is unrelated to such document (for example, a business letter, a ticket for an event, or a receipt for purchase of tangible goods such as clothing) shall not be considered a Commercial Product.”</p>
      <p>So....</p>
