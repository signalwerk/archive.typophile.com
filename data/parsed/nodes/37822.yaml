      <p>Here’s the deal:</p>
      <p>The license to the Font Marketplace fonts are almost identical to Ascender- the difference is the amount of machines the software can be installed on; in this case, one user.</p>
      <p>You can use the fonts for “for-profit” graphic designs just like “any other font”. The commercial license only applies to the digital software embedded in a product for sale.</p>
      <p>Also if the PDFs you designed that are edited by a client/associate/ Ascender/FontMarketplace would like that user to purchase his or her own license (which happens to be very affordable).</p>
      <p>Personally I think Ascender has done a fabulous job of bringing low cost quality fonts to all users. The Ascender Originals are particularly excellent.</p>
      <p>Mike Diaz :-)</p>
