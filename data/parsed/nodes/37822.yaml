    <p>At <a class="freelinking-external" href="http://fontmarketplace.com/">FontMarketPlace</a>, a new web storefront of Ascender Corporation, there are lots of fonts which say that the names are copyright Monotype, but they are priced at a fraction of the price they are on the Monotype storefront, Fonts.com. Why would Monotype compete with itself in this way? Can anybody explain what is going on here?</p>
