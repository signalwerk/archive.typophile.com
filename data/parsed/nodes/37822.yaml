      <p>Florian wrote: “But when I do the same job as a hired (contract) designer, I would need another, regular license?”</p>
      <p>With respect to FontMarketplace, the answer is no. The EULA language “personal and internal business use” describes how the font can be used (installed on personal computers, and not on web servers).</p>
      <p>There is nothing to stop creative professionals from using the site, and if they increase the workstation license quantity to 5 then the price comes is similar to what they are paying today on our AscenderFonts.com site and many other creative professional font websites.</p>
      <p>As others have described above, and as we have stated in our press release, our intent is to appeal to Microsoft Word users (and all the other software applications used at the home and office) by presenting fonts in a consumer-friendly manner, around themes and occasions, and to make them affordable with a single user license. Our believe is that there is a chasm between free font websites and creative professional font websites, and that’s where FontMarketplace is focused. </p>
      <p>And if we can entice people to move from Comic Sans to one of the many other FontMarketplace fonts, then I think many of you will believe that we’ve done our part to make the world a more beautiful place :)</p>
      <p>(note: of course we offer Comic Sans on the site for those who misplaced it and can’t live without it!)</p>
