      <p>I gather that the goal here is to segment the market and expand one part of it for quality fonts. Fonts intended for publishing would be left to the full open type version of a font with multiple weights and styles. And these more restricted sets would be sold to those not involved in professional design and publication. </p>
      <p>What is not clear to me is whether this will just expand the market for fonts, or will undercut the profits for the full versions—or actually enhance them by fostering appreciation of quality fonts? To what extent do the two markets overlap, and in what way? I guess we will find out.</p>
