      <p>Well, I’m not a lawyer, but I am a native English speaker, so I’ll offer my opinion. Of course, I could be wrong, but to me this seems a reasonable interpretation of the EULA:</p>
      <p>First of all, we’re not discussing a print product, but rather “an electronic document or data file” offered for “for a separate fee”, so you needn’t worry about about the flyer or the print magazine.</p>
      <p>I interpret the EULA to mean that I can’t embed the font in a ebook I intend to sell, but I can embed it in a informational PDF that I put on my web site and allow the public to download free of charge.</p>
