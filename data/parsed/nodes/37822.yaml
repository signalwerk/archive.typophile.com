      <p>In a EULA Internal and Business use, usually refers the the normal print work that fonts are used for in the corporate, design, advertising, and branding worlds. It would also allow graphics to be created for use on a web site.  Commercial Product usually means something like a piece of software, a web book, or magazine distributed via pdf. That is created as a product for sale. Use of a font in tis realm would require a different license. Actually most EULAs contain this sort of language or something similar. (standard caveat, I am not a lawyer)</p>
      <p>To me Font Market Place is aimed at MS Word Users who want a few new fonts to spice up their documents. Not really a high-end designer market.</p>
