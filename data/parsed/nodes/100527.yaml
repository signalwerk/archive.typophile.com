    <p>I have been loving the Benedictine face since I first saw it a few months ago on pages 30-31 of McGrew's <em> American Metal Typefaces of the Twentieth Century</em>. I searched once and again for information about it on the Internet, and, apart from a couple of sample images, I could only find (naturally) an old but quite revealing <a href="http://www.typophile.com/node/48585" title="Click to visit an external URL." class="freelink freelink-external freelink-internal">post</a> on Typophile, and, of course, that wonderful manual on typography by Mergenthaler Linotype from 1923.</p>
    <p>Given that no one seems to have carried the remarkable beauty of the Benedictine family (an apparently forgotten gem) into the modern OpenType world, I decided to do it myself ...</p>
    <p> <img src="/sites/default/files/old-images/BenedictinePro1_4032.png"><br><img src="/sites/default/files/old-images/BenedictinePro2_5260.png"><br><img src="/sites/default/files/old-images/BenedictinePro3_3479.png"><br><img src="/sites/default/files/old-images/BenedictinePro4_6067.png"><br><img src="/sites/default/files/old-images/BenedictinePro5_5293.png"><br><img src="/sites/default/files/old-images/BenedictinePro6_4267.png"><br><img src="/sites/default/files/old-images/BenedictinePro7_5283.png"></p>
    <p>The Book weight (including small caps and italics) is almost finished, with Regular and Bold following (hopefully) shortly. For more information (including detailed specimen and sample sheets) please visit <a href="http://www.alterlittera.com/al_htm/oldtype/benedictine.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">alterlittera.com</a>. I would be extremely grateful if you could send your advice on this project.</p>
    <p>Thanks in advance.<br><img src="/sites/default/files/old-images/al_logo_3429.png"></p>
