    html: <p>To me the 100% tracking looks good, when small caps are set separately as on your picture. But you should consider that the spacing of small caps also depends on the spacing of upper and lower case letters because they are often used in a context. For example small caps can be used among lower case text to attract attention to a certain word or paragraph (as means of selection) and here the more loosely spaced small caps (comparing to lowercase) will help the word to be  distinguished. Also small caps can play the role of lowercase in mixed setting, when the word set in small caps starts with an uppercase letter and here the spacing of small caps should be identical to uppercase, because they stand together in the same word. Also small caps can be used among the uppercase text (for example in a book title) and it is a common practice to use some tracking in uppercase setting (which can be programmed in a font with the “cpsp” feature) so if you make such feature you should consider this too when deciding on the spacing of small caps (for the harmony between small caps and tracked uppercase).  So there can be different situations and you can leave the spacing of your small caps as it is and let a designer who'll use your font to decide on tracking or try yourself find the spacing of small caps which will suit most of situations.</p>
    html_clean: <p>To me the 100% tracking looks good, when small caps are set separately as on your picture. But you should consider that the spacing of small caps also depends on the spacing of upper and lower case letters because they are often used in a context. For example small caps can be used among lower case text to attract attention to a certain word or paragraph (as means of selection) and here the more loosely spaced small caps (comparing to lowercase) will help the word to be  distinguished. Also small caps can play the role of lowercase in mixed setting, when the word set in small caps starts with an uppercase letter and here the spacing of small caps should be identical to uppercase, because they stand together in the same word. Also small caps can be used among the uppercase text (for example in a book title) and it is a common practice to use some tracking in uppercase setting (which can be programmed in a font with the “cpsp” feature) so if you make such feature you should consider this too when deciding on the spacing of small caps (for the harmony between small caps and tracked uppercase).  So there can be different situations and you can leave the spacing of your small caps as it is and let a designer who'll use your font to decide on tracking or try yourself find the spacing of small caps which will suit most of situations.</p>
