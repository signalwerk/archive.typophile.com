  html: |-
    <p>I have been loving the Benedictine face since I first saw it a few months ago on pages 30-31 of McGrew's <em> American Metal Typefaces of the Twentieth Century</em>. I searched once and again for information about it on the Internet, and, apart from a couple of sample images, I could only find (naturally) an old but quite revealing <a class="freelinking external" href="http://www.typophile.com/node/48585" rel="nofollow">post</a> on Typophile, and, of course, that wonderful manual on typography by Mergenthaler Linotype from 1923.</p>
    <p>Given that no one seems to have carried the remarkable beauty of the Benedictine family (an apparently forgotten gem) into the modern OpenType world, I decided to do it myself ...</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/BenedictinePro1_4032.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/BenedictinePro2_5260.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/BenedictinePro3_3479.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/BenedictinePro4_6067.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/BenedictinePro5_5293.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/BenedictinePro6_4267.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/BenedictinePro7_5283.png"></div><p></p>
    <p>The Book weight (including small caps and italics) is almost finished, with Regular and Bold following (hopefully) shortly. For more information (including detailed specimen and sample sheets) please visit <a class="freelinking external" href="http://www.alterlittera.com/al_htm/oldtype/benedictine.htm" rel="nofollow">alterlittera.com</a>. I would be extremely grateful if you could send your advice on this project.</p>
    <p>Thanks in advance.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/al_logo_3429.png"></div><p></p>
