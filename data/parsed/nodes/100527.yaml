      <p>Thanks for reading and commenting. Answers to questions posted in this and other threads are as follows:</p>
      <p>1. "Wordspace may be too big" - I would be very grateful if you could confirm this by having a look at this sample.<br><img src="/sites/default/files/old-images/BenedictineBook_3727.png"><br>
      2. "Small caps look relatively too large" - I tried several metrics starting from the original sources, out of which I only retained those for the Book weight. Most of the glyphs (including the small caps) in the Regular and Bold weights were derived mainly from the Book weight. Among other things, the original x-heights of the Regular and Bold seemed too small to me when compared between them and to the x-height of the Book.</p>
      <p>3. "I assume the Italics are not uniwidth with the Romans, but are they uniwidth among themselves?" - Yes, they will be. I will also try to make them uniwidth with the Romans. That would be nice, I believe. However, it is not possible to achieve that effect with the original sources (on which the current version of the Book Italics is based).</p>
      <p>Thanks.</p>
