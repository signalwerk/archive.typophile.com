      <p>That's one reason why I've cultivated a good relationship with a local high-end shop, I guess. They can do anything I want, including printing around the shirt.  :-)</p>
      <p>I never needed a good shop when I lived in northern VA or I'd reco someone near you, but I know the Maryland Sheep &amp; Wool Festival uses someone local and their shirts are pretty good (I know, I have a lot of them!): you could email them at <a href="mailto:info@sheepandwool.com">info@sheepandwool.com</a> to see who they use.</p>
      <p>Linda</p>
