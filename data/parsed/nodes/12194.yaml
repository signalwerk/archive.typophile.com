    <p>The personal website of <a href="/wiki/Grant%20Hutchinson" class="freelinking" rel="nofollow">Grant Hutchinson</a>. Blatherings about type, design, technology, Macs, obsolete technology, and other bits of interest. The Splorp weblog has been published on an almost daily basis since April 2000. The Grantcam has been serving up embarassing, low-resolution video snaps since July 1996, making it one of the longest running webcam on the net.</p>
