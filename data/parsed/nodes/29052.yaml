      <p>So do I.<br>
      To combine the "Gothic" font with Trajan would kill the "Gothic", 'cause the Trajan is too strong. I'ld use a Grotesk like Akzidenz-Grotesk or Helvetica. Its neutral and it lets the "Gothic" do its job.</p>
