    <p>I am trying to find a good sub-title compliment for this typeface.</p>
    <p><a href="http://planetlag.com/files/typo_header.png" title="http://planetlag.com/files/typo_header.png">http://planetlag.com/files/typo_header.png</a></p>
    <p>Unfortunately, there is nothing I can do to change the main face, but I assure you, I have decorated the face lavishly and it doesn't look that horrible anymore.</p>
    <p>My original idea was to use Goudy as a subtitle text, but my boss prefers Castellar. I believe the engraving reduces the amount of contrast between the main title and sub-title. He suggested Trajan which I may accept as we are far behind schedule to get this out the door but I would like your opinion. For reference here are the typefaces I just mentioned.</p>
    <p><a href="http://planetlag.com/files/typo_goudy.png" title="http://planetlag.com/files/typo_goudy.png">http://planetlag.com/files/typo_goudy.png</a><br>
    <a href="http://planetlag.com/files/typo_castellar.png" title="http://planetlag.com/files/typo_castellar.png">http://planetlag.com/files/typo_castellar.png</a><br>
    <a href="http://planetlag.com/files/typo_trajan.png" title="http://planetlag.com/files/typo_trajan.png">http://planetlag.com/files/typo_trajan.png</a></p>
    <p>You have to excuse my lack of refined typographical knowledge. I'm new and my typography instructor back in school was rubbish.</p>
