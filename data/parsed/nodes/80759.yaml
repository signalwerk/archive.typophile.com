    <p>Dear Typophiles,</p>
    <p>I feel I should know this newish-looking oldstyle face, which I kind of like. Anyone?</p>
    <p>The book is Erin Hogan's <em>Spiral Jetta: A Road Trip through the Land Art of the American West</em>, published by the University Of Chicago Press in 2008. It was probably designed by Jill Shimabukuro, who is mentioned as having done the jacket.</p>
    <p>(Sorry about the cropped textblock. I can post images with more text or more detail if needed.)</p>
