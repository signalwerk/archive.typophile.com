  html: |-
    <p>Hello Typophilers,</p>
    <p>I’m working on a new website (and new typefaces) for the CakeType collection. I like to use recipes of a (chocolate) cakes as faketext. Can you help me by translating the following line into the language you speak?:</p>
    <p>In a separate bowl whisk the egg yolks with the remaining sugar for one minute using the electric mixer.</p>
    <p>I’m looking for Greek, Cyrillic and Latin based languages.</p>
    <p>Thank you very much in advance!</p>
    <p>Pieter</p>
