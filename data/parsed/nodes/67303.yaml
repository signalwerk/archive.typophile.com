    html: |-
      <p>Adam</p>
      <p>When I made the first version of the fonts, I made them as CFF OpenType fonts which meant that I set the Platform 3 FullName (field 4) to the PostScript Name, which in the case of these fonts included a hyphen between the Family name and the Style name. The client preferred to have TTF OpenType fonts which ment that the Platform 3 FullName should have been without the hyphen.</p>
      <p>My way of working is always to work with the OpenType names records directly.</p>
      <p>I think that MSPublisher is the only application that baulks at this but I may be wrong.</p>
      <p>M</p>
