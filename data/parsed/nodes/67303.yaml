  html: |-
    <p>Hi</p>
    <p>A customer is trying to embed a set of eight TT fonts all of which have installable embedding set. All the fonts have the same glyph set and index order, the default glyphs are all correct and MS FontValidator does not return any errors, yet from within MS Publisher four show as 'will embed' and four show as 'may not embed'. The customer has been reporting inconsistent results across different machines when trying to embed.</p>
    <p>Does anyone know what might be upsetting Publisher? </p>
    <p>tia<br>
    M</p>
