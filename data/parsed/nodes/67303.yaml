    votes: null
    html: |-
      <p>No Adam, I'm not saying that MSPublisher has a problem "seeing" them.</p>
      <p>MSPublisher seems to have a problem recognising TTF fonts as embedable when they carry a hyphen in the Windows Full Name (4.3.1.1033), even when the correct embedding bits have been set. The "embedability" of fonts is displayed in the 'Tools&gt;Commercial Printing Tools&gt;Fonts' dialog of MSPublisher.</p>
      <p>I have not been able to do extensive research into this problem suffice to say that changing the 4.3.1.1033 field in these TTF's by changing the hyphen to a space caused the 'Tools&gt;Commercial Printing Tools&gt;Fonts' dialog to show them as 'embedable' where before they were shown as 'may not embed'.</p>
      <p>M</p>
