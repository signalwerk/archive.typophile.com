    <p>There is a design firm in San Francisco...their website is just a white background with a single video with the founder talking about how he isn't going to post a profile, list of works, clients, etc....that if you want real design - come to them. It is a great video and a great site, sadly, I don't remember what it was or who they are...while I was trying to find it I came across some pretty nice sites and designers with nice work. I'm interested in hearing who your favorite graphic designers or firm is and possibly if anyone knows what i'm talking about with this firm in San Fran.<br>
    For now, I really like the work of this guy.<br>
    <a href="http://www.dustinarnold.com/" title="http://www.dustinarnold.com/">http://www.dustinarnold.com/</a></p>
