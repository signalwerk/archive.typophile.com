  html: |-
    <p>Hullo,</p>
    <p>I have not seen the info here yet, so I just wanted to let you know that a new French foundry launched last week (I am not related to the foundry - I just rather like the concept and the fonts): the Bureau des Affaires Typographiques. You can find all info in English here:</p>
    <p><a href="http://beta.batfoundry.com/client/document/bat_communique_20100427en_49.pdf" title="http://beta.batfoundry.com/client/document/bat_communique_20100427en_49.pdf">http://beta.batfoundry.com/client/document/bat_communique_20100427en_49.pdf</a></p>
    <p>IMVHO I think Acier (a revival of Cassandre's type by Jean-Baptiste Levée) will be of interest to many of you since I have seen it (or a closely related character) used in a number of vintage London Underground font.</p>
    <p>Francesco by Franck Jalleau is also available in digital format for the first time I think. This is a fantastic character in extended latin, and will probably find an audience fairly soon. Very few of Franck Jalleau's creations are available so this is certainly great news!</p>
    <p>Let me also mention that <a href="http://www.typographies.fr" title="www.typographies.fr">www.typographies.fr</a> is another multi-designer foundry from France, which has just won two awards from the TDC in 2009 &amp; 2010.</p>
