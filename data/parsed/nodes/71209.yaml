    <p>Does anyone know what most publishers use as the body copy font for their text-driven reading books? </p>
    <p>I know there are many fonts used, but is there one that publishers use more because of readability or flexibility of use?</p>
    <p>The publisher I work for uses Adobe Garamond, but It never looks or reads quite right. Anyone have suggestions? We need a workhorse text driven font.</p>
    <p>Thanks!</p>
