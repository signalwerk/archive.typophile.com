    html: |-
      <p>In Brazil the most common fonts in books are Times New Roman, Adobe Garamond, Minion, Palatino, Berthold Garamond and Caslon. And Arial/Helvetica is largely used too (!).</p>
      <p>Anyway, I don't think these choices are based on readability or flexibility of use. I'm sure there is very much about tradition and typographical ignorance in many book design made here.</p>
      <p>There are many good font options nowadays.</p>
      <p>For a non fiction, technical book, I'd definitively avoid Garamond (all flavors) and also other Garaldes and Venetians. I'd favors some contemporary fonts like Novel, Athelas, Lyon, Calluna or Romulus. If the text is not continuous (I mean, if it mix graphics, tables, equations and so on) other choices could be Tiempos, Expo Pro, Documenta, Stuart, Skolar or Karmina.</p>
      <p>If there is heavy numeric usage, pay special attention to the figures. Although the traditional old style numbers are very elegant, they are far from good to a text with many numbers.</p>
