    <p>I would like to make any text of 16 mm in height using Adobe InDesign CS2.</p>
    <p>Here are the method I’m using:</p>
    <p>First I make a boundary Grid with 16 mm offset.</p>
    <p>Next I create Text Frame between the boundary Grid to insert any text, say, it’s a HELLO text.</p>
    <p>I create text “HELLO” in the Text Frame with Times-Roman font and the initial size of the font is 10 pt.</p>
    <p>I block all of the HELLO text and click the up-arrow of the Font Size tool in order to increase the size of the text until I can see the HELLO text in 4000% zoom is exactly fit to the boundary Grid.</p>
    <p>And final size of the text is 66.4 pt.</p>
    <p>However, there still left a Gap between the Font and the upper boundary Grid and make the text not exactly in 16 mm height.</p>
    <p>Please see image about the Gap.</p>
    <p>And if I move the Text Frame manually until the upper portion of the HELLO text reach the upper boundary Grid, then the gap will be in the bottom of the boundary Grid vice versa.</p>
    <p>So can anyone help me to find the method for this text treatment?</p>
    <p>Thanks in advance<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Gap_5343.jpg"></div><p></p>
