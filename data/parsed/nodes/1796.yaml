    html: "<p>Few random comments: <br> <br>The blue ain't bad...let the client have that one. The grey is nice, but tends to be 'the thing' to do these days. Not sure how timeless it will be (if that is an issue).  <br> <br>I like your t-shirt/hat mock-up. Perhaps just make those the corporate colors and let them use blue vs. grey depending on situation.' <br> <br>I don't usually consider flies a pest. A bit annoying, but usually a sign that the mulch needs taking out rather than a need for an exterminator. As for insects-that-fit-on-a-bcard, I'd say the ant is a good idea. Or a termite. <br> <br>The TM looks much better outside the orange field. <br> <br>The logo-esque 'e' in PEST bothers me. Not sure why, but I read it as P EST. Maybe use a squarer 'e' in the tag line.</p>"
