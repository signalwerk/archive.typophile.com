  - id: 14141
    user: 2236
    date: 2003-10-24T18:40:00
    date_raw: 24 Oct 2003 — 6:40pm
    votes: null
    html: <p>Good suggestion. Eagle would probably be a good choice for this industry. <br> <br>During my initial consultation with the client, we determined that the most important elements to the customer relationship are trust and reliability. Recognizing the need for boldness ("aggressive and macho") within industry applications and considering the look of reliability, I created the bold DETEX type. Also recognizing that most pest control is sold door-to-door during the day, I knew that the logo needed to be soft enough for a predominantly female market, hense, the soft "E's" and the gray (vs. Unocal blue) and orange (vs. the industry standard red) combination. I felt that this would help create warmth, rather than aggressive heat, and contribute to the trust factor. <br> <br>I'm thinking that the space between the name and title on the bizcard needs to be decreased</p>
    html_clean: <p>Good suggestion. Eagle would probably be a good choice for this industry. <br> <br>During my initial consultation with the client, we determined that the most important elements to the customer relationship are trust and reliability. Recognizing the need for boldness ("aggressive and macho") within industry applications and considering the look of reliability, I created the bold DETEX type. Also recognizing that most pest control is sold door-to-door during the day, I knew that the logo needed to be soft enough for a predominantly female market, hense, the soft "E's" and the gray (vs. Unocal blue) and orange (vs. the industry standard red) combination. I felt that this would help create warmth, rather than aggressive heat, and contribute to the trust factor. <br> <br>I'm thinking that the space between the name and title on the bizcard needs to be decreased</p>
