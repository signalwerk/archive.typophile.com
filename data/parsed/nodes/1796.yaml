    html: "<p>I tend to like the client's rather gentler blue. <br> <br>The thing that bothers me about the EX-ligature is the angle that the upper arm of the X is cut at - if it ended vertically rather than horizontally, I think it might flow better.  (Unfortunately this unbalances the top of the glyph and makes the orange arrow look forced). <br> <br>I'll second the curled-up legs for the dead insect; the splat effect could be in poor taste. <br> <br>The complaint regarding the shape of the logo Es: what if only the bottom arm had a corner with the stem?  The stem can retain its bow-curve, but you can also reinforce the baseline and eliminate the instability that the ET ligature has.</p>"
