    html: <p>Yeah, a little more with the S. <br> <br>On the back of the card, merely saying "This is the void where the ant was" doesn't really communicate the idea so well. If you can make the white ant look really dead (a dead insect, when not smooshed, is generally curled up with all its legs folded inward), you won't need to spell out "after" in words at all. I think that would be a good thing.</p>
