    html: "<p>I hate to do this to you, but I'm siding with the client too in terms of color. Grey is a hard sell to a client, IMHO, so you may want to save your energies for a different battle ;o) <br> <br>The card is nice. Two nitpicks: <br> - no URL. I can't trust a company without a web site. ;o) <br> - dots in the phone number. Me no like. Seems 'trendy in art school but not really pratical in the real world' IMHO.  <br> <br>I like that ant. A lot! But I'm thinking the back of the card is too much/too obvious. I'd suggest just having the ant as-is on the front and not try to push the whole before/after concept. If you do keep the ant on the back, I think it needs to somehow look 'more dead'. Not sure how to go about that, though. Maybe a chalk outline? Headstone? Dunno...just thinking outloud... <br> <br></p>"
