    html: <p>Hi Scott <br>I really like your design, especially the use of the orange wedge shape, which is repeated in the shape of the card. <br> <br>When I was growing up in Florida (I now live in Washington) there was this pest control company that had a cute mouse-like logo, and their vehicles were bright yellow VW Bugs with big three-dimensional mouse ears on the roof, a big mouse tail attached to the rear end, and three-dimensional whiskers attached to the front bumper. As a child it was fun to spot them in the sea of otherwise boring 70s-mobiles (ah, suburban sprawl). <br>I looked them up and they're still around (maybe you've heard of them -- people here in the Northeast haven't). I'm attaching a couple of jpegs. An example of rare humor in the pest control industry. <br> <br>Their "mouse" logo became so familiar to people in that area that the company started doing ads with a sign-off of the mouse ears, whiskers and tail without the words Truly Nolen... sort of like what Target does now. <br> <br>Good luck with your project. <br> <br>Troy <br> <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/20213.jpg" alt="image 1"><img src="http://www.typophile.com/forums/messages/29/20214.jpg" alt="image 2"></p>
