    html: <p>Gray and Orange are a good combination, although a bit overused -- your designers delight looks better than the reflex blue look, which of course is bolder but simply doesn't work as nice and will of course need a third colour in printing for the text, which shouldn't be blue.  <br> <br>I absolutely do not like the way E and T as well E and X are done in one shape, almost as ligatured. It looks too clever for its own good...  I think a cleaner and simpler approach would be nicer and would probably have more longevity.  <br> <br>The business card is just great, the although I'm sure the before bug shouldn't be just a fly (no one calls pest control for that) and the after bug should maybe just be more of a kind of red smear :-). Of course though, the shape of the card and the fly are a perfect fit and maybe a cockroach on your bizcard isn't the best idea... :-D. Maybe the DETEX could be a bit smaller and the typeface for the name and tel# and so on isn't my cuppa, for that kinda business and that logo a sans serif would be a better fit.  <br> <br> <br> <br></p>
