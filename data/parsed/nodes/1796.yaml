    html: <p>Scott, <br> <br>I like the design. However, I would like to see a darker blue that doesn't have as much brightness. Because the orange is bright, I think a duller blue would make the orange and blue work better together. Your "e's" feel like they have too much curve. I also don't like the middle bars being different lengths than the outer bars.  <br> <br>The "E" connecting only at the bottom of the "X" seems odd because the top has the same relationship as the bottom, and they don't connect. (I hope that made sense) I don't see anything wrong with just joining the e and the t. Joining the "e" and "x" seems forced. <br> <br>I think pest control could be a sans serif different than the title. I just used univers- I am sure you could find a better one. The orange arrow feels better with the same space between it and the "x" as the thickness of the font. I Hope this helps. <br> <br><img src="http://www.typophile.com/forums/messages/29/19345.gif" alt=""> <br> <br>-Tom</p>
