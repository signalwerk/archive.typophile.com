    html: <p>Thank you all for the incredible critique. Unfortunately, I have become somewhat overloaded with work and will not have time to address each of your helpful comments, but let me assure you that I have used all of your postings to get this design to where it is now. <br> <br>Due to a client response lull, I had some time away from this project. I hope that I remembered everything that I intended to do. Take a look and let me know if I'm still missing some things. I tried to apply a lot of changes to this revision this afternoon and I fear I may have even missed some of the positive adjustments I made on previous versions. <br> <br>The colors are confirmed and due to budget constraints, I need to keep the cards down to 2/1. Because of this we now have a dark blue ant. I think it is small enough that it will still work. On the reverse side, I went with the ant on its back with its let up in the air. The tag line, "after DETEX", probably needs to be present for people who haven't followed this thread to get it. <br> <br>Thanks again for all your help. <br> <br>Aloha! <br>Scott <br> <br><img src="http://www.typophile.com/forums/messages/29/19798.jpg" alt="Detex Identity"></p>
