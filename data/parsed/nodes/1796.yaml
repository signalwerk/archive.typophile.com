    html: "<p>Hi Scott. <br> <br>Not bad so far. <br> <br>Nice card shape - corresponding with the logo. <br> <br>But: the before/after thing (as is) does not at all work for me. Nobody can tell (without inspecting the card with a magnifier) which ant (or fly) is alive and which is killed. People might think: \"Before: grey fly, after: white fly - cool, that's what I always wanted to spend my money for\". :-) <br> <br>And do away with that \"see other side for 'before'\" instruction. That sounds sort of silly. ,-) <br> <br>Maybe the happy vermin/poisoned vermin idea would work if somehow differently done. But, actually, I'm not sure whether such a (tendentially nasty) illustration should be on a card. Maybe it should. I'm a bit undecided here. ,-) <br> <br>I wouldn't make the job title lowercase only. I see no reason to do this. <br> <br>I guess I don't prefer the grey over the customer's blue. <br>The grey might seem to be a bit more sophisticated, but IMO the dark blue suits the business well. <br>Hrant's right: three colors in the logo are too much. <br>Tom's colors are very strong. I think I like them. <br> <br>regards <br>jpg</p>"
