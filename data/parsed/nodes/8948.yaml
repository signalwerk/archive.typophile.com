    html: <p>OK, so I forgot about this thread, but today while I was teaching I farted out a way to geometrically derive a golden section from ugly US paper. Take an 11x17 sheet. Assume you're looking at it vertically. Draw a horizontal line 11" from the bottom to describe an 11" square. Draw a horiz. line 5.5" from the bottom to bisect the square. Draw a diagonal line from the bottom left corner to the top right corner of the lower half of the square. Rotate that line counterclockwise so that its arc hits the left edge of the paper approximately 12.3" from the bottom. Draw a horizontal line from that point. The area bounded by that line, the line at 5.5", and the left and right edges of the sheet should be a Golden Rectangle.  <br> <br>Although it would still be easier to trim your paper to 11 x 6 13/16". That's essentially what you've just constructed. And with a lot less waste.</p>
    html_clean: <p>OK, so I forgot about this thread, but today while I was teaching I farted out a way to geometrically derive a golden section from ugly US paper. Take an 11x17 sheet. Assume you're looking at it vertically. Draw a horizontal line 11" from the bottom to describe an 11" square. Draw a horiz. line 5.5" from the bottom to bisect the square. Draw a diagonal line from the bottom left corner to the top right corner of the lower half of the square. Rotate that line counterclockwise so that its arc hits the left edge of the paper approximately 12.3" from the bottom. Draw a horizontal line from that point. The area bounded by that line, the line at 5.5", and the left and right edges of the sheet should be a Golden Rectangle.  <br> <br>Although it would still be easier to trim your paper to 11 x 6 13/16". That's essentially what you've just constructed. And with a lot less waste.</p>
