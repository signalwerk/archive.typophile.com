  html: |-
    <p>I'm working in Win XP, Fontlab Studio 5.0.4 and we recently installed a new Windows 2008 server. Now saving (simply doing a Ctrl + S or File, Save) takes as long as 30-45 seconds. The font files size doesn't seem to matter much, even fonts that aren't particularly large take a looooong time to save.</p>
    <p>I've tried uninstalling and reinstalling to no avail.</p>
    <p>Has anyone else seen this?</p>
    <p>Thanks,<br>
    Ken</p>
