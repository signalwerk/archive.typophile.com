    html: |-
      <p>Ken: <em>[...] we recently installed a new Windows 2008 server. Now saving (simply doing a Ctrl + S or File, Save) takes as long as 30-45 seconds.</em></p>
      <p>I reckon that this hasn’t anything to do with FLS as such. There seem to be all sorts of slowdown-issues related to the use of SMB2 (Server Message Block Protocol Version 2) in <em>Windows 2008 Server</em>. Some Googling on <a href="http://www.petri.co.il/how-to-disable-smb-2-on-windows-vista-or-server-2008.htm" rel="nofollow">this subject</a> might perhaps help. </p>
      <p>FEB</p>
