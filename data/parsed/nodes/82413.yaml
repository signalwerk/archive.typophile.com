    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typetalks2_590px_4342_6157.png"></div><p></p>
    <p>The two-days symposium will take place this year at the University of Arts in Poznań (Poland) on 18–19 June 2011. The theme of our conferences is type and typography. That is not going to change any time soon. This year we aim to accentuate the social aspect of the symposium. In the end, the word symposium refers to drinking party or convivial discussions held in ancient Greece. The two days will include exhibitions, an evening full of short type presentations (aka TypeShorts), party, and of course a day full of excellent lectures.</p>
    <p><a class="freelinking external" href="http://typetalks.org" rel="nofollow">http://typetalks.org</a></p>
    <p><strong>The super-low-cost early-bird registration is over in just one week! The registration ends on 6 June unless we run out of space earlier.</strong></p>
    <p>The Poznań TypeTalks is organized in collaboration with the <a class="freelinking external" href="http://www.asp.poznan.pl/en_index.html" rel="nofollow">University of Arts in Poznań</a> and Foundation of the Academy of Fine Arts in Poznań.</p>
    <p>Programme:</p>
    <p><em>Day 1, Saturday (ca. 12:00–21:30)</em></p>
    <p><strong>Exhibition opening</strong></p>
    <p><strong>TypeShorts</strong> – an evening full shorts type presentations. Type designers and typographers will present their works as brief 5-minute ignite talks. Everybody is welcome to speak! Check the <a class="freelinking external" href="http://typetalks.org/Symposium2011/TypeShorts.html" rel="nofollow">Call for TypeShorts</a>. We have some great Shorters™ already.</p>
    <p><em>Day 2, Sunday (9:30–22:30)</em></p>
    <p><strong>Indra Kupferschmid (DE)</strong><br>
    Georg Trump’s less-known typefaces</p>
    <p><strong>Jacek Mrowczyk (PL)</strong><br>
    Who is who in Polish type design</p>
    <p><strong>Martin Tiefenthaler (AT)</strong><br>
    On the affective implications of good and bad typography</p>
    <p><strong>Jasso Lamberg (FI)</strong><br>
    Transformer with a daily deadline</p>
    <p><strong>Lucas de Groot (DE/NL)</strong><br>
    Designing large type families</p>
    <p><strong>Adam Twardoch (PL/DE)</strong><br>
    Automated high-end typography: a field report</p>
    <p><strong>Akiem Helmling, Underware (DE/NL)</strong><br>
    Carry on</p>
    <p><strong>Exhibition opening</strong></p>
    <p><strong>Party</strong></p>
