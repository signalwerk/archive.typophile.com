      <p>I think Nancy is probably right about custom, judging from how well the 5 and 4 work together, echoing slants and lines, but if you want an alternative font, look at the works of the "King of Art Deco Fonts", Nick Curtis. The closest I found was <a href="http://Marrakesh Express NF" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Marrakesh Express NF</a>, but La Coupole, Dusty Rose and Duesenberg all have suggestions of this number combination potential.</p>
      <p>- Mike Yanega</p>
