      <p>This is definitely an improvement. Simpler is often better in the world of logo design.</p>
      <p>Some suggestions. May or may not improve things...</p>
      <p> - make all the 'chip' circles the same size. Right now with them different sizes it feels a bit like craters on the moon.</p>
      <p> - note that a stylized bite mark would be in a semi-circle shape with equal sizes scallops (teeth marks)</p>
      <p> - per David's suggestion, make the cookie darker the plat lighter. Might make it less 'moon' like.</p>
    html_clean: |-
