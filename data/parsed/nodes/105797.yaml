    <p>In my last topic I created a logo for Tasty Morsils, I didn't really care for it. I created this logo/mark </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/tasty_4868.png"></div><p></p>
    <p>I thought more into it and many times i think way too hard then i should and go basic. what does the name say? Tasty Morsils. Morsel? A morsel is defined as a small bite so I created a simple round olive circle with a simple chocolate chip cookie with a small bite/morsel in it. </p>
    <p>What does everyone think?</p>
  html_clean: |-
