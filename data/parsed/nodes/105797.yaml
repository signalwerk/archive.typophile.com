      <p>Now the chocolate chips look too much like chocolate chips. Their style is in conflict with the intense modernism of the rest of the logo. I would try making them just various oval shapes. I also think an oval shape for the cookie would be more dynamic and interesting, and still be in keeping with your modernism.</p>
      <p>I’d also change the colour scheme to something warmer. Green seems just wrong for a bakery.</p>
