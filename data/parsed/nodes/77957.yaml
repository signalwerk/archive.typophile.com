      <p>Utopia has quite long descenders compared with many news faces.<br>
      Pratt, for instance, has both shorter ascenders and descenders than Utopia, so will produce a more open look than Utopia at 9 on 10, or may be set at 9 on 9.5.</p>
      <p><a href="http://www.shinntype.com/worldwide.html" rel="nofollow">Worldwide</a> is condensed. You could set it 8.5 on 9.5 and have a similar apparent size to 9 on 10 Utopia, with considerably more copy.</p>
      <p>For something different, <a href="http://www.shinntype.com/goodchild.html" rel="nofollow">Goodchild</a> is a news Jenson, and has a greater characters-per-pica count than Utopia.</p>
      <p>(Shinntype news text faces.)</p>
