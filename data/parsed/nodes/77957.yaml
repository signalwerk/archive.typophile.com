    <p>Hello all,</p>
    <p>So, I'm working with plain old Utopia in news copy right now. It is set 9/10 and the columns are 120 points wide. There are plans for a redesign later this year, and I had originally thought to just upgrade to Utopia Opticals, but wondered if there weren't other options for text setting. Sometimes the 9pt Utopia feels too wide (Is roughly 5 words/29 characters per line too tight?), and I'm reluctant to make the type smaller.</p>
    <p>So I have been searching and I've come up with:<br>
    <a class="freelinking external" href="http://fontshop.com/fonts/singles/creative_alliance/kepler_std_semicondensed_caption/" rel="nofollow">Kepler Semicondensed Caption</a> (Onscreen this looks to be a better size/grade/weight than reg)<br>
    <a class="freelinking external" href="http://fontshop.com/fonts/downloads/typetogether/karmina_ot/" rel="nofollow">Karmina</a><br>
    <a class="freelinking external" href="http://fontshop.com/fonts/downloads/shinntype/pratt_pro_family/" rel="nofollow">Pratt</a> (Only a pinch narrower as I see it)<br>
    <a class="freelinking external" href="http://new.myfonts.com/fonts/tipotype/quiroga-serif/" rel="nofollow">Quiroga</a> (Too nontraditional?)</p>
    <p>Know of any others?</p>
    <p>Recommendations or suggestions are welcome. The plan is to pair this with Proxima Nova as the sans, if that matters.</p>
