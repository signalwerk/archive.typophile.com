    html: |-
      <p>Thank you all for the suggestions.</p>
      <p>Nick — I had not considered Goodchild for news. I very much like the look of it. Are you planning a pro release of it? Any dailies using Goodchild that you're aware of that might be on Newseum?</p>
      <p>Igor – I hesitate to scale the glyphs, because I'm already allowing my H&amp;J settings to scale glyphs ±4%. I suppose just scaling all the type from the start would be more consistent. Squishing it slightly just feels off to me.</p>
      <p>Kent – I like the warmth/softness of BureauRoman. Unfortunately, both families are out of the budget range for our modest weekly.</p>
      <p>Is roughly 5 words/29 characters per line too tight? A rule of thumb I was taught in school is 1.5 lowercase alphabets, which would be 39 characters. I improved the text last year by taking it from 9.5/11 Utopia down to 9/11. The paper had not changed its body style to reflect the narrowing columns (as a result of narrowing web widths).</p>
      <p>Thanks again.</p>
