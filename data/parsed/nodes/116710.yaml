      <p>It appears to be (very nice) artwork based upon an old typeface digitized by Lime as <a href="http://www.dafont.com/extra-ornamental.font" target="_blank" rel="nofollow">Extra Ornamental No. 2</a>. As such, I don't think a font was directly used.</p>
      <p>This appears in the Solotype Catalog (metal, wood and photo type) as Tuscan Floral.</p>
