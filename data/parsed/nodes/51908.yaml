    <p>Hello folks, I'm happy to announce that a new typaface of mine is now released. Here follows the presentation. I hope you enjoy the font.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hachura-tp_3700.gif"></div><p></p>
    <p><strong><a class="freelinking external" href="http://www.outrasfontes.com/hachura.htm" rel="nofollow">Hachura</a></strong> is an impressionist typeface designed by <strong><a class="freelinking external" href="http://www.outrasfontes.com/about.htm" rel="nofollow">Ricardo Esteves Gomes</a></strong>. Its general proportions are based on the garalde models, with traditional roman serifs. It was initially made by hand using a drawing technique to create a font that simulates the unfinished aspect of a work in constant progress. This textured face is useful for display sizes, making a very visible presence. Because of its basic dimensions and careful distribution of black and white, it still also very readable in text sizes like 10 or 8 points.</p>
    <p><strong><a class="freelinking external" href="http://www.myfonts.com/fonts/outras/hachura/" rel="nofollow">Hachura</a></strong> is available to purchase and download at <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/outras/hachura/" rel="nofollow">Myfonts</a></strong>.</p>
