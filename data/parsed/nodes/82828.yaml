      <p>Cycles is an really great typeface, I have to say I am very content with it. I obtained it, when it was still under the normal license and it is to me a really perfect balanced serif font for extended text. It has a classic, old style inspired, appearance, a reasonable proportioned x-height, and the letters seem to harmonize well on a page. It does not have any too fancy features, as some old-style revivals or interpretations have (Garamond Premiere, Arno for example – they are beautiful, but a different category). Yet it is not as cold and sterile as some other typefaces are, like Times New Roman or according to some maybe even Sabon. I have to say I find it hard to find a classic looking text-face that would compete. </p>
      <p>Having said that, I can only say that I have no experience how any font would behave in a professional environment, as I am not working in such. Although I printed with Cycles in ink, laser and offset, I am not the person who could evaluate its performance in a way that would matter to you. </p>
      <p>Personally I like as well: <a class="freelinking external" href="http://www.signographie.de/cms/front_content.php?idcat=35" rel="nofollow">Andron</a> (which has similar qualities to the mentioned cycles, but an almost universal character-set, on the other hand no optical sizing variations, like cycles), <a class="freelinking external" href="http://www.commercialtype.com/typefaces/lyon/lyon_text" rel="nofollow">Lyon</a>, <a class="freelinking external" href="http://www.terminaldesign.com/Fonts/#/Rawlinson2" rel="nofollow">Rawlinson</a> and <a class="freelinking external" href="http://www.type-together.com/Edita" rel="nofollow">Edita</a>. All are a bit wider set than Minion, which I find a tad to condensed and tight. </p>
      <p>If you publish as well in the German, Swedish, Brasilian or other language markets with diacritic marks, then have a look at this issue before you decide on a typeface:<br>
      <a href="http://typophile.com/node/40439" title="http://typophile.com/node/40439">http://typophile.com/node/40439</a><br>
      The before mentioned typefaces in my post all avoid this problem.</p>
