      <p>I'm not sure what you are looking for, but as you mention the new Bembo, I assume that's Bembo book, you might have a look at <a class="freelinking external" href="http://www.fontbureau.com/fonts/WilliamsCaslonText/" rel="nofollow">Williams Caslon Text</a>. It is also intended to capture the look of a classic metal font, in this case the "dark but open" look that Caslon, well printed in metal, had. I just recently went through the exercise of comparing it and Minion as far as economy. I was pleasantly surprised that used somewhat smaller size, it could match Minion in economy. Because it is a little wider, lighter, and a little looser spaced, it is equally as readable at the smaller size—well, more readable, but I am prejudiced. </p>
      <p>If you are looking for a clean and modern look, I am also a huge fan of Whitman.</p>
