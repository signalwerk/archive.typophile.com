    <p>I am a publisher and want to buy a couple de fonts: a sans and a sans serif. With our designer we wrote this draft.<br>
    Coarse papers are used mainly for our books.</p>
    <p>With sans we would like something in the line of Agenda Regular, but it remind me something of the old Britain superb school (g, a) with Johnston and Gill.<br>
    Perhaps something more «modern», just a little less ornamented although similar in beauty and rythm.</p>
    <p>For the serif, we are not sure with the new Bembo recutt as in this forum the opinions were fifty/fifty, and some overused tendency was mentioned.<br>
    Of course our daily leader is Minion (with the marvelous Erhhardt in paralell) but we want a new one. We saw the fantastic Collis and Ruse by the gifted Noordzij's but they are overpriced 400% with our budget.<br>
    (Trinité is a must but time and readers perhaps want something different.)</p>
    <p>Adobe Text sounds good (a mix of Minions, Bembos, Jenson, etc) but we are afraid this is a font Adobe will give as a plus with software purchasing and the investment could be just a loss...<br>
    We checked the dutch foundries but what about the rest of Europe?</p>
