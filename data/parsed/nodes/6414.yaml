    html: <p><i>The only need is too determine if any group has been held back from the opportunity to contribute</i> <br><br>exactly the reason i started this thread. i believe in diversity but i know that i am boud by views that are distinctly male and that are distinctly American. the reason why i’m interested in minorities is that i feel they have a lot to contribute that i could learn from. <br>i didn’t start this tread because i wanted to point out that men are “better” at type design or at anything. Simply stated there are signiﬁcant experiences that shape a person — and their work that depend on sex, language, religion, place of origin, etc. i want to learn from all these people who have diﬀerent experiences and diﬀerent points of view. <br>True, we are all individuals and have our own life experience that shapes us but some factors (such as those you listed) can be generalized to a certain extent. I believe that i could learn certain things on an individual level from one-on-one contact and there are other things to be learned from making well-formed opinions from genralizations. <br>This is the reason i ask about the experience of the woman type designer — not to discriminate, but to be educated about what their particular experience is like, what their special needs are, how to help integrate more women into the ﬁeld and other goals which i feel are worthy&nbsp;pursuits.</p>
