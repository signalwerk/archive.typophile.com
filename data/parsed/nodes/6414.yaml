    html: <p>I'd be interested to know what percentage of students in type design programmes are women, and how many of them manage to get into type design professionally on graduation. I'm impressed by the number and quality of women students at Reading, and some graduates seem to be succeeding in making a living at least in part from designing type. Anyone know what the numbers are in The Hague? <br> <br>During the industrial period, both Monotype and Linotype employed many women in their drawing offices. I believe the majority of Fiona Ross' team at Linotype's non-Latin department in the 1970s were women. Of course, the 'designers' whose work they prepared for manufacture were most often men, but I think one needs to give full recognition to the degree of typographic skill and knowledge that some of these women posessed and the degree to which they contributed to the creation of many typefaces. Of course, Fiona herself is a designer in her own right, and its been a great pleasure to collaborate with her. <br> <br>By the way, I can attest that cooking and ironing do not get in the way of designing type.</p>
