    html: <p>Okay, I am done drawing text faces (not my own) for now. <br><br>I have way too many thoughts to put into one concise post, so I’ll just put down a few things. <br><br>1. There are fundamental diﬀerences between men and women as a whole. It’s more nature than nurture. <br><br>2. Please don’t hate me, my sisters, for saying that. <br><br>3. Despite diﬀerences, anyone is capable of doing anything they want. <br><br>4. Josh Darden is 100% awesome. <br><br>5. Broad generalizations must have exceptions. <br><br>6. Text faces are less fun to draw than displays, but only because they are lower in contrast and allow less room for pleasant little idiosyncracies. But that’s just my taste.  <br><br>7. To really ﬁnd out why there aren’t more women in type design, you will have to ask women who had the opportunity but turned it down (i.e, graphic designers, Reading graduates, etc). <br><br>8. Everyone needs to buy the ﬁrst season of Wonder Woman on <span class="caps">DVD</span> and marvel at how something could be so feminist yet so sexist at the same time. <br><br>9. My thoughts are mainly inﬂuenced today by <a href="http://www.amazon.com/exec/obidos/ASIN/0060929596/qid=1093907839/sr=ka-1/ref=pd_ka_1/002-2662433-9191230">this fascinating book</a>. While it makes a strong case for the nature vs. nurture debate, it also asserts that human beings vary so much, ergo we should focus more on the individual than on trying to categorize everyone into two&nbsp;groups.</p>
