  date_raw: 27 Aug 2004 — 5:49pm
  votes: null
  html: "<p>I've been wondering about this for a while now (like a couple of days probably) and was prompted by <a href=\"http://www.typophile.com/forums/messages/4100/47729.html?1093652334\" target=\"_blank\"> another post</a> in the \"design\" section and <a href=\"http://www.typophile.com/forums/messages/4102/13671.html?1081375511\" target=\"_blank\"> yet another post</a> i read some time ago. <br> <br>Yes, I know there are some great talented women in type design, but doesn't the field seem heavily weighted with men even today? <br> <br>I'm wondering if anyone has compiled any kinds of statistics or could make an educated approximation of: what percentage of type designers have been women 1) since the advent of moveable type, 2) since 1960, 3) since 1990 and 4) as a percentage of type designers currently practicing the craft. <br> <br>I guess these dates are fairly arbitrary and maybe someone can suggest some better cutoff points but my rationale goes something like this: for (1) i think it's fairly self explanitory (2) to find out how many women have been involved in type design since the itroduction of women into the (mainstream) workforce (3) to find out how many women have been involved in type in the digital age (4) self-explanitory. <br> <br>It seems to me that there are more men interested in type than women, which strikes me as slightly strange (and i could be completely wrong in my assumptions) However maybe there are just more male type hobbyists (like me) whereas in the professional realm the field is more even. I don't know the answers to these questions, but I thought this would be worth discussing. If any of you have thoughts, insights, additional questions relating to this topic i'd love to hear what you have to say. thanks for looking.</p>"
  html_clean: "<p>I've been wondering about this for a while now (like a couple of days probably) and was prompted by <a href=\"http://www.typophile.com/forums/messages/4100/47729.html?1093652334\" target=\"_blank\"> another post</a> in the \"design\" section and <a href=\"http://www.typophile.com/forums/messages/4102/13671.html?1081375511\" target=\"_blank\"> yet another post</a> i read some time ago. <br> <br>Yes, I know there are some great talented women in type design, but doesn't the field seem heavily weighted with men even today? <br> <br>I'm wondering if anyone has compiled any kinds of statistics or could make an educated approximation of: what percentage of type designers have been women 1) since the advent of moveable type, 2) since 1960, 3) since 1990 and 4) as a percentage of type designers currently practicing the craft. <br> <br>I guess these dates are fairly arbitrary and maybe someone can suggest some better cutoff points but my rationale goes something like this: for (1) i think it's fairly self explanitory (2) to find out how many women have been involved in type design since the itroduction of women into the (mainstream) workforce (3) to find out how many women have been involved in type in the digital age (4) self-explanitory. <br> <br>It seems to me that there are more men interested in type than women, which strikes me as slightly strange (and i could be completely wrong in my assumptions) However maybe there are just more male type hobbyists (like me) whereas in the professional realm the field is more even. I don't know the answers to these questions, but I thought this would be worth discussing. If any of you have thoughts, insights, additional questions relating to this topic i'd love to hear what you have to say. thanks for looking.</p>"
