    html: <p>Dyana, would you please stop impressing me already? <br> <br>&gt; because they are lower in contrast <br> <br>This is interesting. I've noticed that when I draw letterforms on paper I make them higher contrast than what they have to end up being. I guess I'm essentially drawing the display cut. <br> <br>&gt;  allow less room for pleasant little idiosyncracies. <br> <br>I think this depends on the types of idiosyncracies, and because text type is inherently set smaller the details become part of the texture and don't stand out, hence to some extent idiosyncracy becomes more tolerable, probably even more functional. Think of Dwiggins for example. <br> <br>&gt; focus more on the individual than on trying to categorize everyone into two groups. <br> <br>I agree about the total relevance of individuality, but generalizations do help organize and direct thought - it's a natural heuristic mechanism. <br> <br>hhp</p>
