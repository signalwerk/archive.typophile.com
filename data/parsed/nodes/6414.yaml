    html: <p>&gt;we should focus more on the individual than on trying to categorize everyone into two groups.&lt; <br> <br>At last, the voice of reason is spoken.  <br> <br>Perhaps typographers are used to categorizing because it is vital in distributing type--Here I mean putting hot metal type characters back into their correct boxes in the job case. <br> <br>Why should it matter if the designer is a particular gender or race or from a certain part of the world? What matters is the quality of the work.  The only need is too determine if any group has been held back from the opportunity to contribute fonts or anything else.  The truth is, there is not much money in font design (unless you are a rip-off house) and it takes a certain "love" for letterforms that only the individual knows they have to get involved in it.  Is there a "Good-old-Boy" network controlling type design that does not allow minorities or women to design type?  I don't know.  My guess is that type design is too small-potatoes to warrant such activity. We as typographers should make sure not to discriminate against those different than ourselves--not that I have ever seen any such discrimination anyway.  We should encourage and embrace all who care to join us in our little profession and I am sure that we do.  I don't feel it would be proper to label designers by their sex, language, religion, place of origin, or their sexual preferences. Just let them be who they are as individuals. <br> <br>ChrisL</p>
