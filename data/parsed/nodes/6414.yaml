    html: <p>From my own experience, I was never taught type design at college, and my interest in type design came out of reading other designers speak about it. <br><br>I was never encouraged to design type, and even my friends in design think it’s a bit odd (My girlfriend tells people I am a fontgeek… ). <br><br>I guess that all the people I know who design type have gravitated towards it themselves, without encouragement and maybe in those circumstances, more men then women take up type….  <br><br>Just like Star Trek! <br><br>As for what can change this, well I think all design students should be introduced to type, and creating type. As design classes now are at least 50% women (in the <span class="caps">UK</span> at least), maybe an introduction to type would encourage more female designers to develop an interest in type. <br><br>But I think everyone (in the design ﬁeld at least) should be more aware of type design / designers and the work that goes in to making a typeface, maybe if every student had to make a typeface for class, then they would appreciate proﬀessional type designers work, and be more willing to part with hard cash for fonts when they reach the working world. <br><br>Jim <br>===</p>
