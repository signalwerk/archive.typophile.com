    <p>Hello there,</p>
    <p>I was under the impression that short-cuts to accents were keyboard dependant, but a french friend i'm helping out is having problems...</p>
    <p><cite>At this time there is just 2 tiny problems : (it's hard to explain, it's a very specific french rule). I need this : â ê ô î û - when I use first ^ and then the A (^+A) it works only for the cap the "ô" works only when I use alt+^ , and I really prefer ^+o ? and If it's possible I need the same combination for ä ë ï ö ü : MAJ+^+A, etc. can I have the "" when I use directly the " and " one the keyboard, not alt+" and alt+" ?</cite></p>
    <p>does that make sense to anyone? all the glyphs exist and I can't for the life of me work out what's wrong... help!</p>
