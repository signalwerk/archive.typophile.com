      <p>What is described above looks like the behavior of the US-extended keyboard on the Macintosh. Here is a grab of the keyboard viewer when the alt key is down:<br><img src="/sites/default/files/old-images/USextended_5645.jpg"><br>
      The keys in orange are "dead keys"; when you type them, you choose your accent, and after that you type the letter to put it on. To get ô, you thus type "alt 6" (and there may be a ˆ or not displayed on top of the 6 on the physical keyboard) and then you type "o".</p>
      <p>To change the behavior of the keyboard, you go in "system preferences" &gt; "International" &gt; "Input menu" and select the keyboard you want. "French" will select an azerty keyboard, "Canadian French" a variation of qwerty. Also select "Show input menu in menu bar" so that you can switch rapidly between keyboards if you use more than one, and also be able to select conveniently "Show keyboard viewer" (whose grab is above when the Alt key is pressed while using the US-extended keyboard).  If none of the predefined keyboards pleases you, you can build yourself your own using <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=ukelele">Ukelele</a>, the Mac OS X Keyboard Layout Editor from SIL. </p>
      <p>Michel</p>
