    <p>Hi there</p>
    <p>I hope some one here will be able to help me with tricky issue:<br>
    I need to find a font which have the gender symbols as glyphs. I need them for a ballet program with gender specific Choreographies. The Choreographer insists that they are part af the titles. He wants the middle o to be replaced with the symbols according to whichever of the two ballets being communicated.</p>
    <p>Problem is that they need to fit with our customdrawn corporate typeface(see attached image).</p>
    <p>Hope someone here might have some suggestions.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/eidolon_6412.png"></div><p></p>
