    html: <p>Same designer, different typeface. It's funny, I'd never noticed the similarities between Futura Display and Steile Futura/Topic before. I think this was because I only knew it as Bauer Topic for a long time and didn't know Renner did it. Incidentally, Futura Display was released in 1932.</p>
