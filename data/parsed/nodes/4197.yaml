    html: <p>It looks like a cousin of Steile Futura, Tasse (Font Bureau) or Topic (URW). A quick check at MyFonts didn't turn up that alternate N for any of those faces, though. <br> <br>Another, more recent face along the same lines is Emigre's Solex</p>
    html_clean: <p>It looks like a cousin of Steile Futura, Tasse (Font Bureau) or Topic (URW). A quick check at MyFonts didn't turn up that alternate N for any of those faces, though. <br> <br>Another, more recent face along the same lines is Emigre's Solex</p>
  - id: 31239
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>I think you were right about Tasse Marc, because it does have an alternate N like this, and an alternate rounded A. You can see the N and A <a href="http://www.fontbureau.com/fonts/font_frames.tpl?cart=10663172097593320&amp;fontname=Tasse" target="_blank">here</a> in the words "COMMUNITY OUTRAGED". It is shown more clearly in the Font Bureau Type Specimens book. While Solex has an S like this, it has neither the N nor the A. <br> <br>Of course, this has been slanted graphically, since Tasse has no oblique face.</p>
    html_clean: <p>I think you were right about Tasse Marc, because it does have an alternate N like this, and an alternate rounded A. You can see the N and A <a href="http://www.fontbureau.com/fonts/font_frames.tpl?cart=10663172097593320&amp;fontname=Tasse" target="_blank" class="link-external">here</a> in the words "COMMUNITY OUTRAGED". It is shown more clearly in the Font Bureau Type Specimens book. While Solex has an S like this, it has neither the N nor the A. <br> <br>Of course, this has been slanted graphically, since Tasse has no oblique face.</p>
  - id: 31240
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>Both Tasse and Solex were created long after this movie was released. The inspiration for both of these was Steile Futura/Topic (both are names of the same Bauer foundry face) which had these alternate characters in the roman styles. It appears that the alternate characters were not included in the existing dital versions.  <br> <br>Interesting that they used a face released in the mid-fifties for a film set 20 years earlier.</p>
    html_clean: <p>Both Tasse and Solex were created long after this movie was released. The inspiration for both of these was Steile Futura/Topic (both are names of the same Bauer foundry face) which had these alternate characters in the roman styles. It appears that the alternate characters were not included in the existing dital versions.  <br> <br>Interesting that they used a face released in the mid-fifties for a film set 20 years earlier.</p>
