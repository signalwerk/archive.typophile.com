  html: "<p>Hello, <br> <br>Just wondering if any of you knew what this was. The movie was released in 1984 (Temple of Doom). It's from the titles. Is there a suitable digital version around? I don't think it's related to the this post for the type on the poster. But I wanted to be thorough and check. Here's a link to that old post: <br> <br><a href=\"http://www.typophile.com/forums/messages/83/13951.html\" target=\"_blank\">http://www.typophile.com/forums/messages/83/13951.html</a> <br> <br> Any help appreciated <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/83/32993.jpg\" alt=\"\"></p>"
  html_clean: "<p>Hello, <br> <br>Just wondering if any of you knew what this was. The movie was released in 1984 (Temple of Doom). It's from the titles. Is there a suitable digital version around? I don't think it's related to the this post for the type on the poster. But I wanted to be thorough and check. Here's a link to that old post: <br> <br><a href=\"http://www.typophile.com/forums/messages/83/13951.html\" target=\"_blank\" class=\"link-lost\">http://www.typophile.com/forums/messages/83/13951.html</a> <br> <br> Any help appreciated <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/83/32993.jpg\" alt=\"\"></p>"
