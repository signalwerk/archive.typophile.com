      <p><cite>The Complete Manual of Typography</cite> by James Felici is an excellent one-book reference. Recommended by Erik Spiekermann and Matthew Carter. And me (which doesn’t mean much, but don’t hurt my feelings by pointing this out).</p>
      <p>Adobe Press. ISBN 0-321-12730-7</p>
      <p>It is my one exception (do you always have to have one exception?) to my general rule of never buying a book whose title includes any of the following words:</p>
      <ol>
      <li>complete</li>
      <li>ultimate</li>
      <li>essential</li>
      <li>idiot’s</li>
      <li>moron</li>
      <li>simple</li>
      <li>easy</li>
      <li>best</li>
      <li>every thing you need to know</li>
      </ol>
