      <p>Logo Font &amp; Lettering Bible: A Comprehensive Guide to<br>
      the Design, Construction and Usage of Alphabets and Symbols</p>
      <p>by Leslie Cabarga</p>
      <p>I just got this book in on Friday, and have read over half of it so far, and find it a great resource, probably on a par with Bringhurst. It is not as much logo as lettering, and font design is included in the latter.</p>
