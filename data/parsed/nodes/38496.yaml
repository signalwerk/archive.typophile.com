    <p>Hi all!</p>
    <p>I’m thinking in read some books about typography.<br>
    I already buy the “The Elements of Typographic Style”.<br>
    But in a search I found this 2 books that look very complet. But since you guys are “the pros”, I dn’t want to spend my few euros in weak books...<br>
    So, are this books about type good?</p>
    <p>Grid Systems: Principles of Organizing Type by Kimberly Elam<br>
    Exploring Typography by Tova Rabinowitz</p>
    <p>Or better books?<br>
    I want to (start?) develop my learnings the wonderfull world of typography</p>
    <p>António</p>
