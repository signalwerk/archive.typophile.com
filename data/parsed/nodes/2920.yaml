    html: "<p>OK, I've made some headway on this.  <br> <br>Two things that helped: <br> <br>1.  I went back to an old postscript Type 1 version of the font issued with GreekKeys, \"Athenian\" (circa 1991) and saved the encoding, which I then used for the new remapped fonts. <br> <br>2.  Following John Hudson's advice, I changed the Microsoft Character Set in Font Info (under Encoding and Unicode) to \"Bitstream Font Set,\" to enforce the encoding. <br> <br> <br>This was sufficient to get rid of the problem with iota acute and the Euro symbol swap. (In the old encoding, iota acute is in the \"currency\" slot.) <br> <br>But it did not get rid of the missing omega lenis acute (which occupies the nbspace slot) in certain applications. After extensive testing, here is what I discovered: <br> <br> <br>A.  What is crucial to the GreekKeys keyboard is the *index* number of the glyph. Therefore, you have to have a glyph for every glyph in the Athenian font (all 217 of them), and they have to be in the right order.  <br> <br>To get this, you have to start by appending an empty slot named \".notdef\" which has the first index; and then paste each of the glyphs into a new font window, in the order their names appear in the GreekKeys encoding in Names mode. <br> <br>B.  But it also appears that the font can *not* have *more* than 217 glyphs. (When I did, the letters collapsed on each other in both Word X and FrameMaker 7. I still don't understand why this happened.)  <br> <br>So to solve the omega lenis acute problem, you have to replace an existing character, such as the backslash, in Names mode; then switch to Index mode, and drag and drop the appended glyph to the index slot occupied by backslash (59); and then *delete* the backslash glyph, which is not in index slot 60. Then return to Names mode and generated the Mac suitcase. <br> <br>Anyway, that's what I did. Here are the results: <br> <br> <br>Everything works fine in BBEdit, Word X, FrameMaker 7, and Endnote 6. The normal omega lenis acute is missing in InDesign and Mellel, but the secondary one substituting for backslash works fine. (Iota acute, as noted, works fine.) <br> <br>One oddity is that Mellel screws up on two other characters: eta acute iota subscript and eta asper iota subscript. (It swaps them with pi and Omega, respectively, from some symbol font.) <br> <br>On the other hand, my legacy documents are likely to go straight into InDesign. In Mellel, one can (and should) use a unicode version. <br> <br>Best, Victor</p>"
    html_clean: "<p>OK, I've made some headway on this.  <br> <br>Two things that helped: <br> <br>1.  I went back to an old postscript Type 1 version of the font issued with GreekKeys, \"Athenian\" (circa 1991) and saved the encoding, which I then used for the new remapped fonts. <br> <br>2.  Following John Hudson's advice, I changed the Microsoft Character Set in Font Info (under Encoding and Unicode) to \"Bitstream Font Set,\" to enforce the encoding. <br> <br> <br>This was sufficient to get rid of the problem with iota acute and the Euro symbol swap. (In the old encoding, iota acute is in the \"currency\" slot.) <br> <br>But it did not get rid of the missing omega lenis acute (which occupies the nbspace slot) in certain applications. After extensive testing, here is what I discovered: <br> <br> <br>A.  What is crucial to the GreekKeys keyboard is the *index* number of the glyph. Therefore, you have to have a glyph for every glyph in the Athenian font (all 217 of them), and they have to be in the right order.  <br> <br>To get this, you have to start by appending an empty slot named \".notdef\" which has the first index; and then paste each of the glyphs into a new font window, in the order their names appear in the GreekKeys encoding in Names mode. <br> <br>B.  But it also appears that the font can *not* have *more* than 217 glyphs. (When I did, the letters collapsed on each other in both Word X and FrameMaker 7. I still don't understand why this happened.)  <br> <br>So to solve the omega lenis acute problem, you have to replace an existing character, such as the backslash, in Names mode; then switch to Index mode, and drag and drop the appended glyph to the index slot occupied by backslash (59); and then *delete* the backslash glyph, which is not in index slot 60. Then return to Names mode and generated the Mac suitcase. <br> <br>Anyway, that's what I did. Here are the results: <br> <br> <br>Everything works fine in BBEdit, Word X, FrameMaker 7, and Endnote 6. The normal omega lenis acute is missing in InDesign and Mellel, but the secondary one substituting for backslash works fine. (Iota acute, as noted, works fine.) <br> <br>One oddity is that Mellel screws up on two other characters: eta acute iota subscript and eta asper iota subscript. (It swaps them with pi and Omega, respectively, from some symbol font.) <br> <br>On the other hand, my legacy documents are likely to go straight into InDesign. In Mellel, one can (and should) use a unicode version. <br> <br>Best, Victor</p>"
