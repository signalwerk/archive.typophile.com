    html: <p>The Character Set option determines how the first 256 characters in the font are interpreted, and whether they are re-ordered. If, for example, you select 'Western (Latin 1)...' the characters will be re-ordered to match that character set. The Bitstream Font Set is a fixed encoding that is not re-ordered, hence its usefulness for making custom fonts. <br> <br>&lt;i&gt;And how does one decide which set to select?&lt;/i&gt; <br> <br>Years of painful experience.</p>
