    html: <p>But why does the ordering matter?  <br> <br>I thought the point of the encoding table was to match a standard set of names with glyphs. Unless the ordering alters which name is paired with which glyph, how does it affect the application? <br> <br>I tried your advice, and using the Bitstream Character Set results in a font that works fine for applications that operate under Classic in OS X. But it still produces weird results in OS X proper (in both Carbon and Cocoa apps). E. g., the same file comes up correct in Endnote 5, but not in Endnote 6. It's even worse in Mellel and Word. <br> <br>For some reason, InDesign seems to get everything right, EXCEPT the character that was mapped to nbspace (00A0). <br> <br>Unfortunately, until everything is Unicode compatible, I have to find a solution.</p>
