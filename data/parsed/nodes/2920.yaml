  html: "<p>[x-posted to FontLab group] <br> <br>I'm new to all this, so any help is much appreciated. <br> <br>For non-Unicode applications, there is a common keyboard layout for polytonic Greek called GreekKeys (Macintosh). It dates back to the mid-80s, along with fonts that have a non-standard encoding (e. g., Athenian). <br> <br>I have Type 1 fonts from Agfa Monotype which I need to match to this layout and encoding, but I keep running into difficulties. <br> <br>1. I opened the GreekKeys font in FontLab 4.5 and saved the encoding. <br> <br>2. I then created a new document, put it in Names mode and selected the GreekKeys encoding. <br> <br>3. I then cut and pasted the glyphs from the Monotype font to match the GreekKeys font. <br> <br>4. In the FontInfo, under Encodings, I selected Western Latin 1 as the Microsoft Character set, but did not select any codepages as supported. (I also copied all the hinting data from the Monotype font.) <br> <br>5. I generated a MacIntosh suitcase, with the option to always use custom encoding. <br> <br>But the font that results is erratic, producing different results from the GreekKeys fonts, and different ones in different applications. <br> <br>The original GreekKeys font also has a number of problems on OS X: persistent difficulty over the glyph in \"currency\" slot, also one which is in the \"nbspace\" slot.  <br> <br>If I leave the glyphs there (for legacy documents) and put another copy of each into the one or two existing free slots, all sorts of weird behavior occurs in documents. <br> <br>It all seems so unpredictable. Can anyone help? <br> <br>Thanks. <br> <br>Victor</p>"
  html_clean: "<p>[x-posted to FontLab group] <br> <br>I'm new to all this, so any help is much appreciated. <br> <br>For non-Unicode applications, there is a common keyboard layout for polytonic Greek called GreekKeys (Macintosh). It dates back to the mid-80s, along with fonts that have a non-standard encoding (e. g., Athenian). <br> <br>I have Type 1 fonts from Agfa Monotype which I need to match to this layout and encoding, but I keep running into difficulties. <br> <br>1. I opened the GreekKeys font in FontLab 4.5 and saved the encoding. <br> <br>2. I then created a new document, put it in Names mode and selected the GreekKeys encoding. <br> <br>3. I then cut and pasted the glyphs from the Monotype font to match the GreekKeys font. <br> <br>4. In the FontInfo, under Encodings, I selected Western Latin 1 as the Microsoft Character set, but did not select any codepages as supported. (I also copied all the hinting data from the Monotype font.) <br> <br>5. I generated a MacIntosh suitcase, with the option to always use custom encoding. <br> <br>But the font that results is erratic, producing different results from the GreekKeys fonts, and different ones in different applications. <br> <br>The original GreekKeys font also has a number of problems on OS X: persistent difficulty over the glyph in \"currency\" slot, also one which is in the \"nbspace\" slot.  <br> <br>If I leave the glyphs there (for legacy documents) and put another copy of each into the one or two existing free slots, all sorts of weird behavior occurs in documents. <br> <br>It all seems so unpredictable. Can anyone help? <br> <br>Thanks. <br> <br>Victor</p>"
