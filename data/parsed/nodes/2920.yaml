    html: <p>Right, Type 1 -- I thought that way I could just keep Monotype's hinting and not worry about it.  <br> <br>Thanks for the tip. I'll definitely try that.  <br> <br>I'm a little lost on what it actually means, though. What does the Character Set option do to the encoding? And how does one decide which set to select?</p>
    html_clean: <p>Right, Type 1 -- I thought that way I could just keep Monotype's hinting and not worry about it.  <br> <br>Thanks for the tip. I'll definitely try that.  <br> <br>I'm a little lost on what it actually means, though. What does the Character Set option do to the encoding? And how does one decide which set to select?</p>
