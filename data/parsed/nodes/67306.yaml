      <p>Hi Candy,<br>
      there’s no image.<br>
      Need help? <a href="http://typophile.com/node/18067" rel="nofollow">How to post a sample or image</a><br>
      In particular, make sure that:</p>
      <ul>
      <li>the file name does not contain spaces (or any other ø∂∂ ¢håræct€rs)</li>
      <li>you have the right <a href="http://www.adobe.com/products/flashplayer/" rel="nofollow">Flash plugin</a> installed with your browser</li>
      </ul>
      <p>The Commerzbank logo used to feature a custom bold stressed sans, similar to Optima. The recent redesign brought a more contemporary logotype by <a href="/wiki/Luc%28as%29%20de%20Groot" class="freelinking" rel="nofollow">Luc(as) de Groot</a>, see the <a href="http://www.fontblog.de/das-neue-commerzbank-logo" rel="nofollow">article on Fontblog</a>.<br>
      Apart from the logo, there’s a corporate typeface based on Linotype’s Compatil, <a href="http://www.linotype.com/en/24-19724/corporatetypedownload.html" rel="nofollow">Commerzbank Compatil</a>. Before that, there was a bold oblique slab called Commerzbank Head. More info in <a href="http://www.designmadeingermany.de/magazin/2/corporate-design-commerzbank/dmig2_commerzbank.pdf" rel="nofollow">this article in DMIG 2</a> [PDF, 0.85 MB ].<br>
      F</p>
