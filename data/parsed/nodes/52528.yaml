      <p>This demo was not made by me. I saw this video for the first time today. I am pretty sure that it was made my WinSoft's ME representative. Here's one I prepared, but withdrew after a few days, because of the low quality of the conversion (I find u-toob a bad medium for typographic demo's - you lose too much detail. ):</p>
