      <p>Yes Saad it was very impressive. I posted it in our community site and they were amazed. I hope a simplified version of its text engine become the standard rendering in computers. A simplified version that then could port the text to professional tools such as Tasmeem for graphic enhancements.<br>
      If designers could design only different patterns of a string of characters (their body only) then position their individual dots and vowels etc., all by remaining in Unicode encoding logic, the Arabic script can benefit in computer usage as a whole and not just in specialized graphic tools.<br>
      This is the area I'm not very clear about Decotype project. I don't know how much of it depends on specially designed font tools to facilitate this concept and how much of it depends on the behaviour of the text engine itself.</p>
