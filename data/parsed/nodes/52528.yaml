    user_id: 1262
    user_name: John Hudson
    user_path: null
    date_raw: 24 Dec 2008 — 11:30am
    date: 2008-12-24T11:30:00
    votes: null
    html: <p>Yes. The backing store of text remains standard Unicode Arabic. The PUA codepoints are used only internally by the ACE engine during display.</p>
