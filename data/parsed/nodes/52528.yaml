    html: |-
      <p>From what Karsten Lücke explained me, all the Arabic letters within the OTF files of the Tasmeem typefaces are assigned PUA (Private Use Area) Unicode values, and they are then converted by the Tasmeem engine on the fly as InDesign position them on the page, so the final text remains Unicode-savy and fully searchable.</p>
      <p>Should the text be converted to plain text it would remain OK to be set in an ordinary Unicode Arabic face, right?</p>
