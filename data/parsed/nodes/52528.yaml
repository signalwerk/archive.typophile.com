    html: |-
      <p>Hello Bahnam</p>
      <p>&gt;&gt;This is the area I’m not very clear about Decotype project. I don’t know how much of it depends on specially designed font tools to facilitate this concept and how much of it depends on the behaviour of the text engine itself.</p>
      <p>Decotype or DT format fonts only need to supply main letter forms and diacretic dots and vowels separately, based on a variety of Tasmeem FL template.  The engine in Tasmeem would then set text by default with diacritic placement and inter-word spacing as desired by font designer.  A font for Tasmeem can be as simple as a typical OT Arabic font, but it can take advantage of many of layout engine features on the fly.</p>
      <p>-Saad</p>
