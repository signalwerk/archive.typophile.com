      <p>Here's a nice detailed video tutorial on class kerning: <a class="freelinking external" href="http://www.vimeo.com/681300" rel="nofollow">http://www.vimeo.com/681300</a>. I found it useful for myself. The are also some videos on OpenType ligatures on the same Vimeo channel.</p>
      <p><cite>"i'm not sure if i will be able to undo it without ruining what i did so far"</cite><br>
      In that case just make a copy of your .vfb file and work with that until you're confident to go back to your original file. That's what I do, especially when I'm trialling out something new.</p>
      <p>Domenico.</p>
