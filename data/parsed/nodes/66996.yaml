    <p>I'm pretty new at working with fontlab, and i have been searching the web for tutorials, the manual is horrible, 'learning fontlab fast' was usefull but lacks depth (and is a complete eyesore). I found some usefull stuff on youtube, but i need more before i can continue.</p>
    <p>does anyone know if there are better tutorials that provide a little more depth?</p>
    <p>for instance with class kerning and metrics (i'm allergic to code, but this looks doable), is anyone actually using that? Cause it looks like a great way to get the basics right, but i'm not sure if i will be able to undo it without ruining what i did so far.</p>
    <p>some help please</p>
