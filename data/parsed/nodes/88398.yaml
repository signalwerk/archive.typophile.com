  html: |-
    <p>Fette Deutsche Schrift also known as Koch-Fraktur or Kochschrift was created by Rudolf Koch for Klingspor foundry between 1908 and 1910. The basis of this font is a publication in the magazine "Das Plakat" of September 1921.  The font contains swash capitals to use as dropcaps, contextual alternates, glyphs for line endings, ligatures, discretional ligatures for use in German, ornaments and other OpenType features. It supports all the European languages using Latin alphabets (including slashed S and slashed longs used in Latvian old orthography till 1930s).</p>
    <p><a href="http://new.myfonts.com/fonts/lamatas/fette-deutsche-schrift/" title="http://new.myfonts.com/fonts/lamatas/fette-deutsche-schrift/">http://new.myfonts.com/fonts/lamatas/fette-deutsche-schrift/</a></p>
