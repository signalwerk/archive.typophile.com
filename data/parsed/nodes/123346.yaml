    <p>Had this silly pun in my mind when making this image: </p>
    <p><a href="http://www.inkscapeforum.com/download/file.php?id=4570" title="http://www.inkscapeforum.com/download/file.php?id=4570">http://www.inkscapeforum.com/download/file.php?id=4570</a></p>
    <p>Though the effect looks fancy, I would like some suggestions how to make the lettering part more "streamlined". </p>
    <p>It was modelled with blender, with a simple screw command, which, can work with continuous lines.<br>
    How would you connect letters with horizontal segments? </p>
    <p>I wouldn't prefer adding loops personally, so a regular script writing is a no-go.</p>
