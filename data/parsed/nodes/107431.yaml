    html: |-
      <p>Scale of image too small to comment on details but it seems that terminals have been clipped, perhaps from a Caslon derived font.<br>
      The particular clipped g is found in a few fonts.<br>
      For example, the Rita Smith font by Claude Pelletier <a href="http://www.dafont.com/ritasmith.font?fpp=50&amp;text=%26g" title="http://www.dafont.com/ritasmith.font?fpp=50&amp;text=%26g">http://www.dafont.com/ritasmith.font?fpp=50&amp;text=%26g</a><br>
      Claude based his font on an old design, Primavera of Rita Major.<br>
      The Walmart retail chain also uses a clipped g for its George label:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/george21_4439.jpg"></div><br>
      As for the &amp; it looks like 8 with a tail.<br>
      Don<p></p>
