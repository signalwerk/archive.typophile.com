    <p>I have been given access to a letterpress shop. Interestingly, nobody else with access to the shop knows how to use it, and it hasn’t been used in years.</p>
    <p>I know something about letterpress printing from reading books about printing, but I still think it’d be a really, really good idea to read in more detail about how to use the machines. I’m looking for recommendations of books about how to use a letterpress.</p>
