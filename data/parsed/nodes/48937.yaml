      <p>Check Paul Maravelas’s book on letterpress:</p>
      <p>Maravelas, Paul LETTERPRESS PRINTING, A MANUAL FOR MODERN FINE PRESS PRINTERS.</p>
      <p>It is available from Oak Knoll Press:</p>
      <p><a href="http://www.oakknoll.com/results.php?s_ShowPics=1&amp;search_val=Maravelas&amp;search_fld=All&amp;x=15&amp;y=11" title="http://www.oakknoll.com/results.php?s_ShowPics=1&amp;search_val=Maravelas&amp;search_fld=All&amp;x=15&amp;y=11">http://www.oakknoll.com/results.php?s_ShowPics=1&amp;search_val=Maravelas&amp;se...</a></p>
      <p>&amp; Amazon seems to have a few available.</p>
      <p>But read this book in conjunction with hands-on learning. Miss Tiffany is right.</p>
      <p>powers</p>
