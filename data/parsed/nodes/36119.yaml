      <p>A single bowl sans appropriate for body copy is a tough find. But I agree with dezcom’s suggestion of Proxima as a good choice, with Futura as another route. Though a true condensed face would be tough at full line lengths.</p>
      <p>Stephen Coles <a href="http://www.typophile.com/node/34546">lays the single-storey a smack down in this Typophile thread</a>, giving plenty of options. Also, check out <a href="http://www.fontshop.com/search/?q=malcom&amp;site=d&amp;btnG=Go">Malcom</a>. It’s less geometric, but could be nice.</p>
