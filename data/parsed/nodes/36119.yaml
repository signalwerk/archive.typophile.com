    <p>Hey fellow typophiles,</p>
    <p>This is my first post, but have been an avid outsider for some time and must confess that this is by far the best Typograpy related site on the interweb. Kudos to the creator(s) and members!</p>
    <p>So... my first post comes in the form of a request for help. I’m struggling to find a not-so-popular font that is similar to Century Gothic and Avant Garde (both having an ’a’ shaped the way most people would normally handwrite it, e.g. circle with stick to the right (Apologies for my lack of correct terminology))</p>
    <p>The typeface will be used for body copy, so it would need to have a large variety of weights and of course, be easy to read in large chunks of text. I would also prefer if the font was slightly condensed (not as wide as Century Gothic).</p>
    <p>To add, I’m also not a fan of Avant Garde’s ’s’ being so squooshed.</p>
    <p>Thanks,</p>
    <p>Koodoz</p>
