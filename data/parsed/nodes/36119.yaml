      <p>Koodoz,</p>
      <p>I suggest you exercise caution when pairing headline and body faces that are very similar, but not identical. Typically, your headline and body faces should either be of the same family or contrast in a pleasing manner. This is why sans headlines are often paired with serif text.</p>
      <p>Anyway, I hope you find what you’re looking for. I wouldn’t worry about the ’a’ style not matching unless you’re actually trying to convince the reader they’re the same type family. Frankly, Lane matches the structure of grotesques like <a href="http://www.fontshop.com/search/?q=helvetica&amp;btnG.x=0&amp;btnG.y=0&amp;site=d">Helvetica</a> more than geometrics like Avant Garde. It’s possible you’re losing the forest for the trees in matching type.</p>
      <p>One quick note: Lane is a free font. The others we’re recommending are not. Just something to keep in mind for your budget.</p>
