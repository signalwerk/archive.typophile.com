      <p>It's Retina Display, which H&amp;FJ designed for the Wall Street Journal redesign a few years ago, IIRC. Wired and a few newspapers redesigned by Mario Garcia have used it as well.</p>
      <p><a href="http://typophile.com/node/50178" title="http://typophile.com/node/50178">http://typophile.com/node/50178</a></p>
      <p>I learned this by downloading a PDF of their media kit, which uses some of the same fonts.</p>
