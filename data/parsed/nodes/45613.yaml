      <p>You could rephrase the question and ask, "How do I develop my own personal typographic style"</p>
      <p>While Paul's link will lead you to many threads, with many opinions, you really have to do the hard work yourself and over time you will develop your own personal style. That will allow you to be different from the other designers, and get you clients that appreciate your personal approach.</p>
      <p>DavidR's advice above is basic, but I can think of many times over the years that I have seen type combinations on his "Do Not" list work well to the astonishment of most people.</p>
      <p>Read the advice with a grain of salt and come to your own conclusions.</p>
      <p>Remember what they say about opinions...</p>
      <p>JamesM</p>
