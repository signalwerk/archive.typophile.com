      <p>I often find myself using the "brute-force" approach. It's a disgraceful and barbaric process, but I find it very effective.</p>
      <p>When simple reasoning and historical accuracy approaches fail to produce a desired result:<br>
      1. Select the primary typeface<br>
      2. Enable your core font collections that you think might have something relevant to the task.<br>
      3. Set the second line/paragraph.<br>
      4. Select the first font on the list, then rapidly scroll through the choices with the down button, looking at the changes on the screen, and backing up whenever you think you've seen something match. Copy the successful matches to the side, and proceed all the way to the end of the list. Once there, start scrolling up to the beginning. I usually repeat this 2 or three times, at different speeds, getting about 5-6 choices, that can then be compared and discarded until you find the best one.</p>
      <p>_____________________________________________<br>
      Personal Art and Design Portal of Ivan Gulkov<br>
      <a href="http://www.ivangdesign.com" title="www.ivangdesign.com">www.ivangdesign.com</a></p>
