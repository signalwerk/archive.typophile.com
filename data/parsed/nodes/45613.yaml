      <p>The Easy Guide to Pairing Fonts<br>
      If you fail on any step, go back to step 1.</p>
      <p>Step 1: Do you really need to pair fonts for this project?<br>
      Step 2: Pick two fonts. Do they look cool together?<br>
      Step 3: Will these two fonts allow you to meet the requirements of the task at hand?<br>
      Step 4: Start setting type.</p>
      <p>Really, don’t overthink this stuff. If it looks good, do it. If it looks like crap, don’t.</p>
