    <p>Hello,</p>
    <p>I've come across <a class="freelinking external" href="http://typophile.com/node/15937 " rel="nofollow"> this thread </a> I found it really interesting but too short !</p>
    <p>When I have to chose type for a project, I always rely on my feelings and lots of testing, wating for the love/hate Alchemy to happen and decide for me.<br>
    This <em>method</em>, mostly based on luck, is often time consuming, and I often found myself needing to ask for help on the forums.</p>
    <p>Some kind of <em>typographica best paring fonts 2007</em> would be great, but Give a man a fish...</p>
    <p>I know that it's very subjective, but I'd love to learn more about how you experts decide to mix fonts. </p>
    <p>Is there some kind of Do and Don't basic procedure ?</p>
    <p>Any help or advice will be muchly appreciated.</p>
    <p>+</p>
