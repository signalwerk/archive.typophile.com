      <p>@oprion</p>
      <p>Nothing disgraceful about using the "Brute Force" approach. Until you use a typeface in situ its difficult to tell if it works.</p>
      <p>In my former life as a magazine design director, before the Mac changed the business, I had the job of redesigning publications. The very first thing I would present would be typographic mixtures of heads, decks, text, subheads and callouts. It it was great fun putting together all sorts of strange type combos. At first sight some of them were unsettling. But it is amazing how sitting with them for a little while changes your point of view from revulsion to delight.</p>
      <p>JamesM</p>
