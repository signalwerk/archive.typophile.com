      <p>For InDesign CS3, I think the only way to do Indic scripts is with the IndicPlus plug-in (Windows only):<br><a href="http://metadesignsolutions.com/indicPlus" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://metadesignsolutions.com/indicPlus</a></p>
      <p>For CS4 or CS5 there are several other options, including ScribeDoor and World Tools.</p>
