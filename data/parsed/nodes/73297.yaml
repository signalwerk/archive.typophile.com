    html: <p>Nick — To truly display Indic scripts properly, the text engine needs to be able to process several Indic-specific OpenType features for vowel positioning and compound consonant conjuncts (as Tom mentions). So, even though the typefaces show up and the characters are all there in the glyph palette, that’s not quite the same as being able to use them, practically speaking.</p>
