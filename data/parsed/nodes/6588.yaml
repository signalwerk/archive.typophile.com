    html: <p>&gt; How much interest do Typophiles think there would be in such a thing?  <br> <br>A good optically-scaled Centaur? Are you kidding?! <br>Not even Monotype did a really great job scaling it - I think they only had four masters. <br> <br>But if it'll be your first type design project, good effin' luck doing it justice!  :-) <br> <br>&gt; open to high-resolution scanning? <br> <br>You'll have a hard time finding a rare book collection that allows such a thing - UCLA for example gives great "hands-on" access to everything they have, but totally refuse any scanning suggestions (at least to regular people). Your best bet might be an eloquent, passionate personal letter to a private owner. Or maybe Octavo? <br> <br>hhp</p>
