    html: <p>This was published around 1935 or 1936, right? That puts it -- in the U.S. -- in the period where if the copyright was not renewed it's in the public domain. If the copyright was renewed then it passes into the public domain 95 years after the publication date. For advice on checking on copyright renewal, go <a href="http://onlinebooks.library.upenn.edu/renewals.html">here</a>. Be aware that length of copyright may be different in other countries.</p>
