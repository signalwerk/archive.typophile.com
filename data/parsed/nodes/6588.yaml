    html: "<p>Raph, what's your best source for Centaur samples? Do you have the specimen printer by Rogers? I have the fascimile, so it's not as good, but you might be able to find the original. What about access to the actual metal type? You could make letterpress prints and work from those. The advantage is you could under-ink and under-impress it to get closer to the actual \"outlines\". You could even place the sorts face down on a scanner! I've done that with great success, actually. <br> <br>William, Adobe's Jenson is not Centaur in two ways: <br>1) It's had that Northern California fatal cuteness applied to it. <br>2) The optical scaling is too mild. <br> <br>hhp</p>"
    html_clean: "<p>Raph, what's your best source for Centaur samples? Do you have the specimen printer by Rogers? I have the fascimile, so it's not as good, but you might be able to find the original. What about access to the actual metal type? You could make letterpress prints and work from those. The advantage is you could under-ink and under-impress it to get closer to the actual \"outlines\". You could even place the sorts face down on a scanner! I've done that with great success, actually. <br> <br>William, Adobe's Jenson is not Centaur in two ways: <br>1) It's had that Northern California fatal cuteness applied to it. <br>2) The optical scaling is too mild. <br> <br>hhp</p>"
  - id: 46190
    user: 1551
    date: 2004-09-09T08:23:00
    date_raw: 9 Sep 2004 — 8:23am
    votes: null
    html: "<p>&gt;William, Adobe's Jenson is not Centaur in two ways:  <br>1) It's had that Northern California fatal cuteness applied to it.  <br>2) The optical scaling is too mild.  <br> <br>Well that's your take on it. If you translate those general comments into specific differences in glyphs, then you would have a starting point for a different Jenson.  <br> <br>I don't know what Raph's is, but all I'm saying is that you are going to have to do some variation to take into account digital &amp; offset printing vs metal and letter press. And that means you are going to have to change things.  <br> <br>If you change things, then I think it is wise to look at all the other important interpretations of Jenson, including Slimbach's, and be very clear about what you want to do differently before you start. I am not saying that a person has to stick to his original idea. But if a person starts a reinterpretation without as clear idea, I think the chances of coming up with something fresh and good are greatly diminished.</p>"
    html_clean: "<p>&gt;William, Adobe's Jenson is not Centaur in two ways:  <br>1) It's had that Northern California fatal cuteness applied to it.  <br>2) The optical scaling is too mild.  <br> <br>Well that's your take on it. If you translate those general comments into specific differences in glyphs, then you would have a starting point for a different Jenson.  <br> <br>I don't know what Raph's is, but all I'm saying is that you are going to have to do some variation to take into account digital &amp; offset printing vs metal and letter press. And that means you are going to have to change things.  <br> <br>If you change things, then I think it is wise to look at all the other important interpretations of Jenson, including Slimbach's, and be very clear about what you want to do differently before you start. I am not saying that a person has to stick to his original idea. But if a person starts a reinterpretation without as clear idea, I think the chances of coming up with something fresh and good are greatly diminished.</p>"
