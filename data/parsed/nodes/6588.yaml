  html: "<p>Hi Centaur fans, <br> <br>   I just got my copy of \"An Account of the Making of the Oxford Lectern Bible\", and am very much enjoying it. <br> <br>   Some questions: <br> <br>1. Does anyone still own the copyright on this pamphlet, or has it passed into the public domain? If the latter, I'm very willing to make scans available. <br> <br>2. Even if I don't post full scans, do people want to see details? I can also post a scan of the Oxford Lectern Bible page reproduced in Stanley Morison's <i>The Typographic Book</i>. <br> <br>3. The font used to set the Oxford Lectern Bible is in fact 18-point \"Bible Centaur\". This font is an adaptation of the original Centaur, with some modifications: ascenders and descenders are shortened; thirteen lowercase letters are redrawn, mostly to make them more condensed (Rogers doesn't give the full list, but he identifies bdfgkljonpqu and maybe y, to which I'd add e and t, which is of course 14 or 15); and the Centaur numbers are replaced with Plantin Light OSF. The quirkiness factor has definitely gone down; in addition to the numbers, the tail of the 'j' is now solidly in the classical Aldine tradition. <br> <br>4. If I'm going to work on this font, my goal would probably be an optically scaled series containing both Centaur and Bible Centaur, as well as the large chapter initial caps. How much interest do Typophiles think there would be in such a thing? <br> <br>5. I'm also trying to understand the ethics of releasing and naming revivals, and want to make sure to do everything right. My gut feeling is that the name \"Bible Centaur\", while very appealing for its historical accuracy, cuts too close to Agfa Monotype's valid trademark. Other choices include \"Rogers\" (by which name a version of Centaur was briefly sold by Commercial Controls for use on the Justowriter), or \"Oxford Lectern Bible\". Of course, for the last, I'd definitely want to work with the people at Oxford University Press. <br> <br>6. Does anyone know of a library or other collection that has the Oxford Lectern Bible and would be open to high-resolution scanning? I see the Donohue Rare Book Room at University of San Francisco has a copy, and they're reasonably close by. <br> <br>This font has captured my heart in a way that few others have. Originally, I was planning on working on ATF Cloister, but now after some study I feel that Centaur (upon which Cloister was based after Rogers rebuffed ATF's effort to buy rights) is superior in every respect.</p>"
  html_clean: "<p>Hi Centaur fans, <br> <br>   I just got my copy of \"An Account of the Making of the Oxford Lectern Bible\", and am very much enjoying it. <br> <br>   Some questions: <br> <br>1. Does anyone still own the copyright on this pamphlet, or has it passed into the public domain? If the latter, I'm very willing to make scans available. <br> <br>2. Even if I don't post full scans, do people want to see details? I can also post a scan of the Oxford Lectern Bible page reproduced in Stanley Morison's <i>The Typographic Book</i>. <br> <br>3. The font used to set the Oxford Lectern Bible is in fact 18-point \"Bible Centaur\". This font is an adaptation of the original Centaur, with some modifications: ascenders and descenders are shortened; thirteen lowercase letters are redrawn, mostly to make them more condensed (Rogers doesn't give the full list, but he identifies bdfgkljonpqu and maybe y, to which I'd add e and t, which is of course 14 or 15); and the Centaur numbers are replaced with Plantin Light OSF. The quirkiness factor has definitely gone down; in addition to the numbers, the tail of the 'j' is now solidly in the classical Aldine tradition. <br> <br>4. If I'm going to work on this font, my goal would probably be an optically scaled series containing both Centaur and Bible Centaur, as well as the large chapter initial caps. How much interest do Typophiles think there would be in such a thing? <br> <br>5. I'm also trying to understand the ethics of releasing and naming revivals, and want to make sure to do everything right. My gut feeling is that the name \"Bible Centaur\", while very appealing for its historical accuracy, cuts too close to Agfa Monotype's valid trademark. Other choices include \"Rogers\" (by which name a version of Centaur was briefly sold by Commercial Controls for use on the Justowriter), or \"Oxford Lectern Bible\". Of course, for the last, I'd definitely want to work with the people at Oxford University Press. <br> <br>6. Does anyone know of a library or other collection that has the Oxford Lectern Bible and would be open to high-resolution scanning? I see the Donohue Rare Book Room at University of San Francisco has a copy, and they're reasonably close by. <br> <br>This font has captured my heart in a way that few others have. Originally, I was planning on working on ATF Cloister, but now after some study I feel that Centaur (upon which Cloister was based after Rogers rebuffed ATF's effort to buy rights) is superior in every respect.</p>"
