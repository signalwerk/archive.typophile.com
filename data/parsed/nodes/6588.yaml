    html: <p>Reinterpreting Centaur at different sizes I think is basically redoing Jenson, because Centaur is an interpretation of Jenson.  <br> <br>Since Abobe Jenson Pro of Robert Slimbach is a very impressive optically scaled version of Jenson, if I were you I would want to have at least one very strong idea on what I want to do differently from Slimbach before starting. Incidentally, Jenson Pro includes a 'light' version, optically scaled, which is closer to Centaur than the regular version.</p>
