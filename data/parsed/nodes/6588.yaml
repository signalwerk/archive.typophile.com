    html: <p>As Hrant notes, few libraries are likely to let you scan such a valuable book, also I think you may be underestimating just how large it is. I'm not even sure how one would go about scanning it. <br> <br>My recommendation is macro photography, which is what I use for this sort of thing. You can get excellent detail with some of the recent digital cameras. I use a little Pentax Optio 555, which has a fast enough shutter reaction to use even without a table mount. The <i>g</i> below is 18pt,  if I recall correctly, taken in natural light, holding the camera in one hand while holding the page flat with the other. On the right, I've done a quick and dirty job getting rid of the paper and beefing up the contrast simply by adjusting curves in Photoshop. <br> <br><img src="http://www.typophile.com/forums/messages/30/48593.jpg" alt="g"> <br> <br>[Anyone want to play Guess-the-typeface?] <br> <br>Unfortunately, a lot of libraries are no more happy to have you photographing their books than to be scanning them. Many will offer a photography service, but you should ask to see samples of their photos and, if you can, try to talk to the person who will actually take the photos and explain what you need in detail. <br> <br>If you are up for a visit to London, you'll find that the St Bride Printing Library is much more accomodating than most. Their Oxford Lectern Bible has a weak binding*, which adds to the difficulty of photographing it because it has to rest in a large foam cradle and cannot be lain flat, but you can have fairly liberal access to it. <br> <br>*It is the copy Beatrice Warde used to drag around the country to impress Monotype customers at sales meetings.</p>
