    html: <p>If you compare Centaur with Adobe Jenson's  <a href="http://store.adobe.com/type/browser/F/JENA/F_JENA-10003030.jhtml" target="_blank">light display version</a> you will get a better comparison. <br> <br>Digital Centaur is little used because it is too light at small sizes. If you try to correct this, then you are going to face the same decisions as Slimbach and others have faced. If I were going to try myself (which I'm not) I would certainly want to look at the original Jenson itself for guidance. That is the main point I was trying to make.</p>
