  - id: 46196
    user: 4406
    date: 2004-09-09T15:04:00
    date_raw: 9 Sep 2004 — 3:04pm
    votes: null
    html: "<p>Hrant wrote: <br> <br><i>But if it'll be your first type design project, good effin' luck doing it justice! :-)</i> <br> <br>Amen. But it won't be my first type design project. I expect to lavish care on it over a period of probably years. Meanwhile, my Century Catalogue is nearing completion - I have all the letters and numbers, and a bunch of punctuation and auxiliaries, but there rather are a lot of fiddly shapes that need to be drawn to fill out an AdobeStandard encoding. <br> <br>William Berkson wrote: <br> <br><i>Reinterpreting Centaur at different sizes I think is basically redoing Jenson, because Centaur is an interpretation of Jenson.</i> <br> <br><i>Since Abobe Jenson Pro of Robert Slimbach is a very impressive optically scaled version of Jenson, if I were you I would want to have at least one very strong idea on what I want to do differently from Slimbach before starting. Incidentally, Jenson Pro includes a 'light' version, optically scaled, which is closer to Centaur than the regular version.</i> <br> <br>I agree that Adobe Jenson is now the standard by which the quality of revivals should be compared. It's historically accurate, has good optical scaling, lots of alternate glyphs and other goodies, and is overall very useful. <br> <br>That said, Centaur and Jenson are by no means the same font. I'll let Bruce Rogers speak to that, starting with his reaction to seeing the type in Jenson's 1470 <i>Eusebius:</i> <br> <br><i>This time I had fugitive [underdeveloped] prints enlarged to about five times original size [and] was at once struck by the pen-like characteristics of the lower-case letters; so with a flat pen cut to the width of the heavier lines, I wrote over the photographic print as rapidly as I could, thus preserving the proportions, at least, of Jenson's own characters. ... and these, with capitals drawn with a pointed pen over photographs of the original, served as models for the first cutting of the Centaur type.</i> -- American Proprietary Typefaces, p. 50 <br> <br>And, to me, that is the essence of the difference between Jenson and Centaur. The letters of the latter are, at heart, drawn by pen. It is the stroke, not the outline, which defines the shape of the letter. To me, the capitals of the 60pt metal Centaur possess a calligraphic refinement more akin to Michelangelo or Trajan than any of the other Jenson revivals. <br> <br>Of course I have several reproductions of Jenson's work, and may well do a pilgrimage to a museum to view an original. <br> <br>John wrote: <br> <br><i>As Hrant notes, few libraries are likely to let you scan such a valuable book, also I think you may be underestimating just how large it is. I'm not even sure how one would go about scanning it.</i> <br> <br>Flatbed scanning might not be all that realistic. I had a wierd idea of placing the scanner face-down on the surface of the book, but on reflection that has at least two serious problems: the weight of the scanner bearing down on the book, and the flatness of the page. <br> <br><i>My recommendation is macro photography, which is what I use for this sort of thing. ...</i> <br> <br>Yes, that's likely what I'll end up doing. I have a very nice 35mm camera and lens for this purpose (55mm Nikon macro 1:1), but not yet a good digital. For capturing individual letters, it's probably almost as good a bet as scanning. <br> <br><i>[Anyone want to play Guess-the-typeface?]</i> <br> <br>Carolingian Miniscule? <br> <br><i>If you are up for a visit to London, you'll find that the St Bride Printing Library is much more accomodating than most. Their Oxford Lectern Bible has a weak binding*, which adds to the difficulty of photographing it because it has to rest in a large foam cradle and cannot be lain flat, but you can have fairly liberal access to it.</i> <br> <br>This is a great tip, thanks. I'll definitely keep that in mind if my travels take me to that part of the world.</p>"
    html_clean: "<p>Hrant wrote: <br> <br><i>But if it'll be your first type design project, good effin' luck doing it justice! :-)</i> <br> <br>Amen. But it won't be my first type design project. I expect to lavish care on it over a period of probably years. Meanwhile, my Century Catalogue is nearing completion - I have all the letters and numbers, and a bunch of punctuation and auxiliaries, but there rather are a lot of fiddly shapes that need to be drawn to fill out an AdobeStandard encoding. <br> <br>William Berkson wrote: <br> <br><i>Reinterpreting Centaur at different sizes I think is basically redoing Jenson, because Centaur is an interpretation of Jenson.</i> <br> <br><i>Since Abobe Jenson Pro of Robert Slimbach is a very impressive optically scaled version of Jenson, if I were you I would want to have at least one very strong idea on what I want to do differently from Slimbach before starting. Incidentally, Jenson Pro includes a 'light' version, optically scaled, which is closer to Centaur than the regular version.</i> <br> <br>I agree that Adobe Jenson is now the standard by which the quality of revivals should be compared. It's historically accurate, has good optical scaling, lots of alternate glyphs and other goodies, and is overall very useful. <br> <br>That said, Centaur and Jenson are by no means the same font. I'll let Bruce Rogers speak to that, starting with his reaction to seeing the type in Jenson's 1470 <i>Eusebius:</i> <br> <br><i>This time I had fugitive [underdeveloped] prints enlarged to about five times original size [and] was at once struck by the pen-like characteristics of the lower-case letters; so with a flat pen cut to the width of the heavier lines, I wrote over the photographic print as rapidly as I could, thus preserving the proportions, at least, of Jenson's own characters. ... and these, with capitals drawn with a pointed pen over photographs of the original, served as models for the first cutting of the Centaur type.</i> -- American Proprietary Typefaces, p. 50 <br> <br>And, to me, that is the essence of the difference between Jenson and Centaur. The letters of the latter are, at heart, drawn by pen. It is the stroke, not the outline, which defines the shape of the letter. To me, the capitals of the 60pt metal Centaur possess a calligraphic refinement more akin to Michelangelo or Trajan than any of the other Jenson revivals. <br> <br>Of course I have several reproductions of Jenson's work, and may well do a pilgrimage to a museum to view an original. <br> <br>John wrote: <br> <br><i>As Hrant notes, few libraries are likely to let you scan such a valuable book, also I think you may be underestimating just how large it is. I'm not even sure how one would go about scanning it.</i> <br> <br>Flatbed scanning might not be all that realistic. I had a wierd idea of placing the scanner face-down on the surface of the book, but on reflection that has at least two serious problems: the weight of the scanner bearing down on the book, and the flatness of the page. <br> <br><i>My recommendation is macro photography, which is what I use for this sort of thing. ...</i> <br> <br>Yes, that's likely what I'll end up doing. I have a very nice 35mm camera and lens for this purpose (55mm Nikon macro 1:1), but not yet a good digital. For capturing individual letters, it's probably almost as good a bet as scanning. <br> <br><i>[Anyone want to play Guess-the-typeface?]</i> <br> <br>Carolingian Miniscule? <br> <br><i>If you are up for a visit to London, you'll find that the St Bride Printing Library is much more accomodating than most. Their Oxford Lectern Bible has a weak binding*, which adds to the difficulty of photographing it because it has to rest in a large foam cradle and cannot be lain flat, but you can have fairly liberal access to it.</i> <br> <br>This is a great tip, thanks. I'll definitely keep that in mind if my travels take me to that part of the world.</p>"
