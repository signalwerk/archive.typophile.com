    html: |-
      <p>Oh, man. That Flickr link made me remember something from my childhood that probably had a hand in my obsession with letters.</p>
      <p>I had some plaster letters just like these when I was about six years old:</p>
      <p><a href="http://www.flickr.com/photos/stewf/53893098/in/set-1168574/" title="http://www.flickr.com/photos/stewf/53893098/in/set-1168574/">http://www.flickr.com/photos/stewf/53893098/in/set-1168574/</a></p>
      <p>My dad salvaged some panels that were used at trade shows by the company he worked for. They were covered with letters like these in two sizes, around two inches tall, painted forest green. He pried them off and gave them to me. I used to spend hours playing with them. I'm sure they were a subconscious influence on <a href="http://www.ms-studio.com/FontSales/refrigerator.html" rel="nofollow">this</a>. I wonder whatever became of them.</p>
      <p>(Sorry for going OT...)</p>
