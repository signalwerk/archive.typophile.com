  html: <p>I've tried searching the typophile archives (not working on my PowerBook!), asking friends, everything. I'm trying to identify and locate the movie that starts with a very surreal clay animated title sequence, with little clay balls, blocks and trees all marching or rolling or erupting into letters to form the names of the actors. Each name is a different sort of re-formation, from cylinders unrolling to show the letters, to craters in the ground erupting with letters, to waves of clay washing up and turning into letters. I seem to recall it's from the '60's, and it might be an Annette Funicello movie for all I know. I probably can't remember the movie because the titles are the best thing about it. It is a comedy, I'm sure. Does anyone remember that sequence, and know which movie it is?</p>
  html_clean: <p>I've tried searching the typophile archives (not working on my PowerBook!), asking friends, everything. I'm trying to identify and locate the movie that starts with a very surreal clay animated title sequence, with little clay balls, blocks and trees all marching or rolling or erupting into letters to form the names of the actors. Each name is a different sort of re-formation, from cylinders unrolling to show the letters, to craters in the ground erupting with letters, to waves of clay washing up and turning into letters. I seem to recall it's from the '60's, and it might be an Annette Funicello movie for all I know. I probably can't remember the movie because the titles are the best thing about it. It is a comedy, I'm sure. Does anyone remember that sequence, and know which movie it is?</p>
