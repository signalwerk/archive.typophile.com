  html: <p>Are there any articles or books that I can read about doing layouts for magazine ads and the like?  While my initial attempts don't look too bad, I could use some help and some principles to follow.  I've read some books on scientific advertising and think I got a grip of the conceptual side of things, but typography and layout are still giving me some trouble.  I'm not an advertiser at all; just trying to make some decent ads where I can "fake it" until I have some money to get it done by somebody who actually knows how.  heh</p>
