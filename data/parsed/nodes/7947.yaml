    html: <p>Ogilvy is one of the Godfather's of advertising. Perhaps advertising is looked down upon, but I find clever (ergo well-created) advertising to be better than anything in the realm of visual design. Hmm. Well, maybe not better, but I do appreciate it. Does his book have a bibliography? If yes, I'd dig through that.  <br> <br>Generally, anything published by Phaidon is good and informational.  <br> <br>Creative Advertising doesn't look bad. <br> <br>I would suggest you study well-written copy in the book above (for instance) and read what Ogilvy says (for instance), before buying that copy-writing book. Although <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0071410937/ref=pd_sim_b_5/104-2079498-2974306?%5Fencoding=UTF8&amp;v=glance" target="_blank"> this</a> looks good to me. <br> <br><a href="http://www.amazon.com/exec/obidos/ASIN/1584231467/typophile-20/104-2079498-2974306" target="_blank">Ego</a> --&gt; Worth a peek. <br> <br>Seems to me Wolff Olins might has something useful to say and maybe Marty Neumeier too. Al Ries, Jack Trout. Tibor Kalman. Not really ADMEN, but great writers. <br> <br>If you can get your hands on a copy of Ogilvy's "Confessions of an Advertising Man" or "Blood, brains, and beer" .. those are both quite entertaining and not so bad on the informational side either. <br>  <br>Although, some might say, great advertising is really just a culmination of the stars--design, brand, understanding the market, writing. I'm sure someone will post and steer you somewhere else.</p>
