    html: "<p>Anyone have any opinions on the following books? <br> <br>Hey, Whipple, Squeeze This: <br><a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0471281395/qid=1101909076/sr=8-1/ref=pd_csp_1/002-4630286-4645631?v=glance&amp;s=books&amp;n=507846\" target=\"_blank\">http://www.amazon.com/exec/obidos/tg/detail/-/0471281395/qid=1101909076/sr=8-1/ref=pd_csp_1/002-4630286-4645631?v=glance&amp;s=books&amp;n=507846</a> <br> <br>Creative Advertising: <br><a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0500284768/qid=1101909076/sr=8-2/ref=pd_csp_2/002-4630286-4645631?v=glance&amp;s=books&amp;n=507846\" target=\"_blank\">http://www.amazon.com/exec/obidos/tg/detail/-/0500284768/qid=1101909076/sr=8-2/ref=pd_csp_2/002-4630286-4645631?v=glance&amp;s=books&amp;n=507846</a> <br> <br>Ogilvy on Advertising <br><a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/039472903X/qid=1101909076/sr=8-4/ref=pd_csp_4/002-4630286-4645631?v=glance&amp;s=books&amp;n=507846\" target=\"_blank\">http://www.amazon.com/exec/obidos/tg/detail/-/039472903X/qid=1101909076/sr=8-4/ref=pd_csp_4/002-4630286-4645631?v=glance&amp;s=books&amp;n=507846</a> <br> <br>The Copywriter's Handbook: <br><a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0805011943/qid=1101909076/sr=8-7/ref=pd_csp_7/002-4630286-4645631?v=glance&amp;s=books&amp;n=507846\" target=\"_blank\">http://www.amazon.com/exec/obidos/tg/detail/-/0805011943/qid=1101909076/sr=8-7/ref=pd_csp_7/002-4630286-4645631?v=glance&amp;s=books&amp;n=507846</a></p>"
