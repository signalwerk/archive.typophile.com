    html: <p>The cover of The Copywriter's Handbook is enough to scare away anyone with a lick of visual sense. But I've read the book, and it's actually quite good -- lots of practical examples. <br> <br>Read Ogilvy for the Big Idea approach. Read The Copywriter's Handbook to learn how to turn the Big Idea into succinct copy.</p>
