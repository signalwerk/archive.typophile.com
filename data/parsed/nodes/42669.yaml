      <p>Archer is not actually H&amp;FJ's "newest" type family for Martha, just the most recent one that they're finally able to release for public license. Archer was designed back in c.2002. The Walbaum-ish serif face that they designed for <cite>Martha Stewart Living</cite> is newer (can't remember the name offhand), but isn't available for license. But I suppose I'm just nitpicking semantics.</p>
      <p>Martha's <cite>Everyday Food</cite> magazine uses Whitney pretty much throughout, almost exclusively. There are some numbers that look like Clarendon or Belizio (or perhaps custom from H&amp;FJ in the same vein). But otherwise, Whitney Whitney Whitney. Unless something's changed in the last several months since I looked at a copy.</p>
      <p>-- K.</p>
