    date_raw: 29 Feb 2008 — 9:06pm
    votes: null
    html: "<p>If you want museum art-book elegance, that's easy: Linotype Sabon with oldstyle figures (or the Adobe OpenType version), and, very selectively, Linotype Syntax with oldstyle figures. Sabon is very popular for museum displays and catalogues: in my view, it is the most nearly perfect serif there is. And Linotype Syntax is superior because its base weight is not too heavy, as with so many other sans families. Just remember the oldstyle figures--always makes a really nice difference. In my experience, Sabon looks best set 11/15.</p>"
    html_clean: "<p>If you want museum art-book elegance, that's easy: Linotype Sabon with oldstyle figures (or the Adobe OpenType version), and, very selectively, Linotype Syntax with oldstyle figures. Sabon is very popular for museum displays and catalogues: in my view, it is the most nearly perfect serif there is. And Linotype Syntax is superior because its base weight is not too heavy, as with so many other sans families. Just remember the oldstyle figures--always makes a really nice difference. In my experience, Sabon looks best set 11/15.</p>"
