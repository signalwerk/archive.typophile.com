      <p><em>Still looking for guides on complementary fonts...</em></p>
      <p>Darden and Maag foundries have type testers where you can set up two (or more) types beside one another.<br>
      Reminds me of type specimens where the pages are cut horizontally into three, so that you can view bits of different pages with other bits, if you know what I mean.<br>
      There was a children's book I recall, Victorian possibly, <em>Heads Bodies and Legs</em> -- from which the surrealist game <em>The Exquisite Corpse</em> may have been derived.</p>
