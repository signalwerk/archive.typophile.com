  html: |-
    <p>Can anyone point me as to where I should research complimentary typefaces? I am working on a huge contract designing custom photo albums evocative of coffee table books such as one would buy at the giftshops in museums. So the typefaces need to have a classic quality to them, they can be both classic fonts and modern streamlined fonts depending on the theme of the albums, be it weddings or births.</p>
    <p>Finally, does anyone recognize the fonts used in Martha Stewart's everyday food magazines?</p>
    <p>Thanks ever so much.</p>
