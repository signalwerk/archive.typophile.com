    <p><a href="http://www.bleisetzer.de/cms/front_content.php" class="link" rel="nofollow">Peußisches Bleisatz-Magazin</a> added 49 prints of old german lead letter full character sets to its so called<br>
    <a>Schriftensammlung (font collection)</a></p>
    <p>Thank you all, especially Mike Yanega (with respect.. huhuuu...) for your support helping me to identify these old and wonderful types.</p>
    <p>Here's the list...<br>
    You may use the search function "stichwortsuche" down left on the website to find a font you want to see.</p>
    <p>Regards,</p>
    <p>Georg</p>
