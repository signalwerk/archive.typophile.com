      <p>Right now I agree with riccard0. Actually your question comes a little too early, as color extensions will become part of the OpenType font specification in the near future.</p>
      <p>It will take some time before most software, InDesign included, start supporting the upcoming color font extensions.</p>
      <p>Right now Internet Explorer running on Windows 8.1 and Firefox version 32 (on all platforms) already support the Microsoft color extension, as shown here:</p>
      <p><a href="http://www.high-logic.com/fontcreator/demo/monstre/index.html" title="http://www.high-logic.com/fontcreator/demo/monstre/index.html">http://www.high-logic.com/fontcreator/demo/monstre/index.html</a><br>
      <a href="http://www.high-logic.com/fontcreator/colorfonts/colorlogo.html" title="http://www.high-logic.com/fontcreator/colorfonts/colorlogo.html">http://www.high-logic.com/fontcreator/colorfonts/colorlogo.html</a></p>
