    <p>Hi there<br>
    Not sure if this is the right place to ask my question, but here we go:</p>
    <p>A client asked me if it is possible to have an icon-font, where they can define two colours of the icon in their layout program (Indesign). What they mean is that the icon (see attached) consists of two parts, where as one part needs to be a different colour to the other. In the attached example the background would be red and the cross will be white. I’m not a font designer and haven't used any of the font creation apps at all. I just wanted to know if it is possible or not? Maybe it is possible to define the background as the fill of the font and the cross as the stroke.</p>
    <p>Thanks for your help.<br>
    Jörg</p>
