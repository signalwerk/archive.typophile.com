    html: |-
      <p>Ehague,</p>
      <p>The objects are rectangles and neither is rotated. No grid.</p>
      <p>When I move the image box to the center of the columns so text flows to either side, the problem goes away. As I move the box toward any one column's edge, the text pops down.</p>
      <p>Any other ideas?</p>
