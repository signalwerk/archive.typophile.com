      <p>Try selecting the object to which the wrap is applied and clicking Object&gt;Convert Shape&gt;Rectangle. Then try the same with the text frame. Check to make sure neither is rotated.</p>
      <p>I assume you alright made sure everything is styled the same. Is there some kind of baseline grid align going on?</p>
