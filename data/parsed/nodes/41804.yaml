    <p>OK, I've got an InDesign CS2 problem. An image is splitting columns but each column wraps differently. ("speculate" should be flush left rather than wrapping, etc.)</p>
    <p>Any ideas on how to fix it? Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/indesignissue_6693.png"></div><p></p>
