    <p>Hi folks, I wanted to know what your thoughts are on using Helvetica Rounded for headings, Eurostile Bold for sub headings and Eurostile Standard for body text. Does this sound like a reasonable combination to you? I personally think they are definetly 2 contrasting styles, but any suggestions would be nice! </p>
    <p>Thanks Craig</p>
    <p>EDIT - erm 1st post, just read forum suggestions - so to add this is for a website, my flash portfolio website. Thanks again for any help.</p>
