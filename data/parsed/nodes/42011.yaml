      <p>What is it about young designers that makes them want to have black/dark backgrounds?o they not understand how much it reduces the legibility of the text? And is that a pattern in the background? Down goes the legibility another few notches. </p>
      <p>Finally, while I am a fan of Flash, it is only for its correct use. Now that sample may not represent the entire site, but there is nothing there that cannot be done better in HTML. If there is no reason to use Flash, don't use it. (And I don't consider things moving around mindlessly to be a reason.) Work hard to achieve your goals with HTML and CSS, and then, only if needed, move to Flash.</p>
      <p>Reasons not to use Flash include the impossibilty of someone bookmarking a portion of your site, and the probability that your site will be completely ignored by search engines.</p>
