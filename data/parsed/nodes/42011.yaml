    html: |-
      <p>There is little correlation between the appearance of a type in print and online, especially at text size.</p>
      <p>If one is familiar with a face in print, it would be foolish to assume that knowledge is worth anything on screen. You have to see it.<br>
      There are also many ways to "process" a type for screen display.</p>
      <p>So "use Arial/Georgia" is safe, but I'd say, try your idea and see if it works for your readership on their preferred browsers/OS.</p>
      <p>[update]</p>
      <p>OK, there is some correlation!<br>
      Looks fine to me.</p>
