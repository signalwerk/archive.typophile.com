      <p>"What is it about young designers that makes them want to have black/dark backgrounds?"</p>
      <p>On screen, i find it's almost the opposite of print. the darker the screen, the less light your eyes are bombarded with. This is especially true when it's projected (although a rarer occurrence) A lot of times, flash sites are designed with this in mind. I find using black just as legible in this case, maybe not the pattern.</p>
      <p>As to the Helvetica rounded, it seems to be okay on-screen in this instance, although its not my favorite typeface, it doesn't appear to be doing anything visually weird. I would definitely get rid of the euorstile</p>
