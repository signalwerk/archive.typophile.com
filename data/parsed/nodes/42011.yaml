    html: |-
      <p>As for white text on black, at least for me, it is virtually illegible on my malfunctioning monitor. I can't really do anything about it as I am located near a strong radio interference source, and any monitor would be doing the same thing here, and moving is impractical. Oddly enough, orange text on a dark gray background suppresses the appearance of these distortions.</p>
      <p>But that's just my special case. In general, if you <em>must</em> use reversed out text, it's a good idea so step up the weight a notch, i.e.: change your text weight from Regular to Medium and Bold to Heavy (if you're using the <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/eurostile/" rel="nofollow">URW++ version of Eurostile</a>).</p>
