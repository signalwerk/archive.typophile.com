    html: "<p>I can't find a good match, and I don't think it's a real stencil font, because an O would need some support, if it were a true stencil. What I did was try to find a slab serif that was somewhat square and then simulate this logo (with an upside-down M for a W, and some clumsy outline manipulations in Illustrator). Here's  the result of using Red Rooster's Equestrienne Heavy: <br><img src=\"http://www.typophile.com/forums/messages/83/33691.gif\" alt=\"Equestrienne Sim for Rotwild\"></p>"
