    date_raw: 7.Oct.2004 1.32pm
    votes: null
    html: <p>For another more subtle rubber stamp try this in photoshop... <br> <br>filters &gt; artisic &gt; underpainting <br> <br>play about with the filter to get the edges to fade with a bit of texture <br> <br>then duplicate that layer... <br> <br>then filters &gt; stylize &gt; find edges <br> <br>then make that top layer "multiply" <br> <br> <br> <br> <br>James</p>
