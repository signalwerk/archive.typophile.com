    html: <p>I would avoid italicizing the text, as you'll rarely see that style of type used on passport stamps. You also might want to look at roughening up the edges of the text a bit more to simulate the rubber stamp look. Yves posted <a href="http://www.typophile.com/forums/messages/83/10551.html">this tutorial</a> a while back. It may give you some ideas.</p>
