    html: '<p><a href="http://fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=confidential&amp;font_categories_checkbox=font_name_search&amp;x=42&amp;y=13" target="_blank">FF Confidential</a> <br>- or - <br><a href="http://www.psyops.com/html/library_crash.html" target="_blank">Crash Numerals</a> (Free-may be handy) <br>- or - <br>The type surrounding the australian date is plain old helvetica. Lay the whole thing out. Print and photocopy several times. Light contrast, then dark. Scan back in. Voila! Any sans will do. Tip: you can even rotate the photocopy slightly while the light is passing by to give that rolled stamp look.</p>'
    html_clean: '<p><a href="http://fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=confidential&amp;font_categories_checkbox=font_name_search&amp;x=42&amp;y=13" target="_blank" class="link-external">FF Confidential</a> <br>- or - <br><a href="http://www.psyops.com/html/library_crash.html" target="_blank" class="link-external">Crash Numerals</a> (Free-may be handy) <br>- or - <br>The type surrounding the australian date is plain old helvetica. Lay the whole thing out. Print and photocopy several times. Light contrast, then dark. Scan back in. Voila! Any sans will do. Tip: you can even rotate the photocopy slightly while the light is passing by to give that rolled stamp look.</p>'
