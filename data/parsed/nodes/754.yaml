    html: <p>I haven't run across any issues with generating fonts under OS X, however Fontographer will not launch in the Classic environment of OS X unless you're using the non-FPU version of the application. There's more information in <a href="http://www.macromedia.com/support/fontographer/ts/documents/osxfog.htm">this tech note</a> on the Macromedia site. Quite frankly, when I have to use Fontographer, I simply boot into OS 9 - it's much less painful.</p>
