  html: <p>One of my colleagues heard a rumor that typographers could not generate fonts correctly when using Fontographer in OS10. I tried a search on Typophile and found a couple of specific issues, but not a general concern. I emphasis this is just a rumor and I hope I'm not starting one! <br> <br>So for those of you using OX10, how is Fontographer working? Have you been forced to go back to an old OS? Or is this info lifted directly from the latest issue of "Weekly World News"? <br> <br></p>
  html_clean: <p>One of my colleagues heard a rumor that typographers could not generate fonts correctly when using Fontographer in OS10. I tried a search on Typophile and found a couple of specific issues, but not a general concern. I emphasis this is just a rumor and I hope I'm not starting one! <br> <br>So for those of you using OX10, how is Fontographer working? Have you been forced to go back to an old OS? Or is this info lifted directly from the latest issue of "Weekly World News"? <br> <br></p>
