    <p>i'm in the early stages of blocking out a new logo and tagline.</p>
    <p>after tracing some web graphics just to see how the logo would look after playing with character baselines and tilts, i've decided to go ahead and purchase Jason Walcott's 'Pumpkin'. i really like the way the logo is looking so far: playful, and unassuming.</p>
    <p>but the main reason i traced the font for the first step, instead of just buying it straight away, was so I could set the brand's tagline against it, and make sure i found two typefaces that worked together. here's where i need the most help. i started off with helvetica nue light, because i want to ensure the tag does not compete with the veiwer's eye for attention graphically.</p>
    <p>the thing is, as my tagline would indicate, my target audience is designers. designers, as a rule, love to hate helvetica.</p>
    <p>so, i'm looking for a substitute that will sit backseat to the wigglehop text-logo, and not raise anyone's hackles. it's an interesting study (i believe) in creative priorities: pure design vs. business consideration. on the one hand, helvetica excels in this case (and many others) precisely because it is so upright and impersonal. this, of course, is why so many designers dislike it. so, i believe my strongest choice in this design is helvetica. and yet, the design isn't my highest priority. appealing to my target audience is.</p>
    <p>some might say the two are one and the same. but, i don't believe it's quite that simple.</p>
    <p>so: anyone have some ideas on how to sidestep the helvetica issue? i've put together a few alternates, including a serif (century old style standard), just so i could prove to myself that serifs won't work in this case.</p>
