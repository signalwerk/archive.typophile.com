    html: <p>I agree that this font needs a 'clean' variant. It has some interesting letters that would be cool in a non-grunge context (the A in particular). Besides, grunge characters always look better distressed by the designer, as opposed to the type designer. It avoids goofy looking side by side 'random' letters that are exactly the same.</p>
