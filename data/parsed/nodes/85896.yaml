    date: 2011-09-28T17:18:00
    date_raw: 28 Sep 2011 — 5:18pm
    votes: null
    html: <p>As little type as possible. I like the ideal of purely analog, proportional display. You don't even really need numbers on the speedometer. Then I'd need to know, what's the means of display? Assuming back-lit LEDs, the font needs to be a little light and rounded to compensate for "light spread" and maintain legibility. After that, style-wise, it would depend on the rest of the car. If my dream-dash is part of my dream car, it's gonna be a bit techno but not space age techno. I'd say something that feels like OCR-A Std but I don't like the figures in that exact font.</p>
