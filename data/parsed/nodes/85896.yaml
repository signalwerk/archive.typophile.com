    <p>I thought this might be a fun question. </p>
    <p>It occurred to me when I had to rent a car while mine was in the shop, and a Dodge Charger was as cheap to rent as anything else. Even the lettering on the dashboard instrument panel was... Dodge Charger-ish. It was very "not like me."</p>
    <p>So! If you designed the dashboard instrument panel for your favorite vehicle(s), what typeface(s) would you use? (and what's the vehicle?)</p>
