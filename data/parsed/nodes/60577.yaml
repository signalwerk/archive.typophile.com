      <p>Jakub, I think your favicon is the nicest (except for the top of the "Y", which could be made more Y-like as in my <em>previous</em> post – with subpixel positioning).</p>
      <p><em>But</em> if you preserved 14 pixels wide background (like in original favicon), there is no way to make it as nice as with subpixel rendering. And certainly impossible with 13 pixels.</p>
      <p>Actually I was frustrated with original design, this is why redesigned it – using my newest obsession.  I have YouTube open all the time (mostly listening to the songs) and have to watch its blurry favicon … same with Wikipedia.</p>
      <p>BTW, there is an explanation on <a href="https://web.archive.org/web/20190610070240/http://www.microsoft.com/typography/cleartypefaq.mspx">Microsoft site</a> that "a very small number [of LCD screens] have a striping order of BGR". It also says that it improves rendering on CRT, but just a little.</p>
