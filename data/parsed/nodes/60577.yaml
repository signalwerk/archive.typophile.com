      <p>Hi! Of course it was created by hand!:-) Programs can not do this, well at least not successfully. Particularly Photoshop can't. But you can set very small type in World or in web page, take a screenshot, enlarge it and then study the colorful world that you did't even know it was there! (<a href="https://web.archive.org/web/20190610070240/http://en.wikipedia.org/wiki/Subpixel_rendering">link 1</a>, <a href="https://web.archive.org/web/20190610070240/http://www.grc.com/cleartype.htm">link 2</a>)</p>
      <p>It helps if you use some techniques of pixel art.</p>
      <p>I remembered I did some other favicons as well, I just have to post them!</p>
      <p>Oh, and I see there is too strong yellow in YouTube favicon…</p>
    html_clean: |-
