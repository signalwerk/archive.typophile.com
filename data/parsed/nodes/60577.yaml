      <p>The most common case where subpixel hinting breaks down might be display devices that can be rotated.  I used to run a 17" LCD in portrait mode for more vertical space, for instance.  A more common example is probably portable devices like iPhones that can change orientation at will.</p>
      <p>Not to discourage the work, of course. Subpixels are awesome. =)</p>
