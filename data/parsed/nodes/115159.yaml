      <p>Tuscan with a crisp thick split in the terminals. A couple of well made fonts that you could edit without a lot of work to make this design: Saloon Girl <a href="http://www.myfonts.com/fonts/fontmesa/saloon-girl/" title="http://www.myfonts.com/fonts/fontmesa/saloon-girl/">http://www.myfonts.com/fonts/fontmesa/saloon-girl/</a> and URW Woodtype <a href="http://www.myfonts.com/fonts/urw/wood-type/" title="http://www.myfonts.com/fonts/urw/wood-type/">http://www.myfonts.com/fonts/urw/wood-type/</a> In both cases get rid of the teardrops and squoosh.<br>
      Don</p>
