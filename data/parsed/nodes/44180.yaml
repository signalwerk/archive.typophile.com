    html: <p>There are several theories of contracts that explain why agreements must be honoured. Some are based on autonomy, some on efficiency, some on “ethics”. But consumer contracts are different in many respects. The state (without which there would be no copyright) can intervene where it sees fit and alter the terms of the contract. For example, your relationship with your bank is governed by regulations, your “agreement” notwithstanding. When you buy your gym membership, you might “agree” to waive certain liabilities, yet the law does not give effect to your “consent”. Similarly, it is wrong to assume that a student who acquires a font, or borrows materials from a library, or purchases a CD at the store, has only those rights stipulated in some “license”. Sometimes the license is effective, sometimes it isn’t.</p>
