      <p>“Unfortunately, most people here won’t agree with me about how copyright is obselete.”</p>
      <p>Neither will most courts of law. Certainly not US ones.</p>
      <p>In any case, I would echo a few things people have said earlier, and add a couple of thoughts.</p>
      <p>1) Modifying an existing digital font is not actually a very educational experiene.</p>
      <p>2) Opening and *studying* existing well-made fonts is a useful learning exercise (assuming it’s permitted by the font license).</p>
      <p>Indeed, I’d suggest a good exercise being to point students at two well-done fonts and one poorly-done one, and try to analyze what is wrong with the bad one. Some people will say there’s no such thing as a bad font. They’re wrong.</p>
      <p>If it were permitted by license, you could give them a poorly executed font and ask them to “fix” it. You could even point at what’s not done correctly (e.g. bad spacing, improperly made outlines, poor kerning, whatever). That seems like it might be a useful educational experiene.</p>
      <p>Regards,</p>
      <p>T</p>
