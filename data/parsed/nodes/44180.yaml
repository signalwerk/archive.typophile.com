      <p>&gt; There is no way better way to truly understand the effectiveness of a typeface than to tear it apart into it’s root elements and rebuild it from your own perspective.</p>
      <p>I will not dispute that there is some benefit to this practice. It is partially how I would teach typography (if I were skilled enough in the field to consider myself as teaching material). But the tearing apart and rebuilding should only be considered as a learning step, probably with a limited number of glyphs from any one font, and covering a wide range of fonts: a comparison of seven different ’a’ glyphs from different fonts in different categories, for instance.</p>
      <p>When the students are skilled to the point of creating a first complete typeface, then they should be producing original creations, or if copying, then copying from an out of copyright printed document, the way a revival face might be created. Copying from a modern computer font is problematic in two ways: ethics, plus how do you know they created all the glyphs, and didn’t just steal some.</p>
