    <p>Hello all, first-time poster, though I’ve been a subscriber for awhile. I am teaching my Typography II class FontLab basics in order to create their own typeface. A student asked if they could start from an existing typeface and make changes to create their own font. I didn’t have an answer to this ethical dilemma so I’m turning to you for help. What do you say, Typophiles? </p>
    <p>Many thanks for your feedback!</p>
