      <p>David, I agree with your principles, but think that you have the means backwards.</p>
      <p>Yes, it is good to analyze and re-use the past, but “start[ing from] from an existing typeface and mak[ing] changes to create their own font” is not the way to do it.</p>
      <p>Most of the things you cite as worth knowing about the mechanics of a font can be best determined by measuring: if one merely cuts and pastes or uses transform tools, one will remain oblivious to such qualia, except perhaps in a very intuitive sense.</p>
      <p>The way to learn a skill is by practicing it oneself. If for instance, one copies the metrics of one’s typeface from those of another face, what does one learn about metrics? If, however, one measures the sidebearings for “v”, “l” and “o” in several established faces, and notes the relative proportions, and deduces the strategy behind this, and applies it to one’s own font, then one learns something.</p>
