      <p>dsgoen — <cite>This project is for a class, not for sale. A class is a learning environment. There is no way better way to truly understand the effectiveness of a typeface than to tear it apart into it’s root elements and rebuild it from your own perspective.</cite></p>
      <p>This would be an interesting project indeed — but a research project, not a creative one. The student should be made aware of the difference. For example, the student could do this kind of research <em>and</em> design something original, non-derivative. Finally she/he would present the design together with the research results (maybe a booklet with text and illustrations), and be able to explain why she/he made this or that decision in her/his original design.</p>
      <p><cite>Your dilemma as a teacher is to determine if the student is actually thinking and learning about something. ... It is thought that counts.</cite></p>
      <p>Fully agreed. My conclusion would be a different one, though.<br>
      Since we cannot read otherones’ thoughts, they need to leave some marks from which we can infer that something happened in their minds. And derivative work makes it hard for the teacher to judge whether its qualities stem from the work from which it was derived, or if they represent the students’ own insights.</p>
