      <p>I am in complete disagreement here.</p>
      <p>This project is for a class, not for sale. A class is a learning environment. There is no way better way to truly understand the effectiveness of a typeface than to tear it apart into it’s root elements and rebuild it from your own perspective. Questions abound about why one typeface is more effective than another. What angles are used, and why? What is the rational behind the length of ascenders and descenders? What curves are chosen? Are the curves derived from circles or compound curves? How are the serifs constructed? Would a non serif approach work with the rest of the face? What elements place the typeface in a historical context? How did a type designer learn and feed on the work of others? These are all questions that can be explored through taking an existing typeface and reworking it.</p>
      <p>The whole concept of plagiarism has been completely distorted over the last few decades. We live in a world consisting of billions of people, and the past is filled with more billions. It is egotistical to an extreme to think that you can always come up with a new work that doesn’t owe a debt to the past. Over the millennia the greatest artists have studied, appropriated and built upon the work of others. This is how they learned, this is how they grew, and with growth came wisdom and the ability to transform the borrowed work into something greater. </p>
      <p>Besides the obvious example of Shakespeare, who didn’t write an original plot line in his life, there are myriad other examples:</p>
      <ul>
      <li>We can say nothing but what hath been said . . . Our poets steal from Homer . . . . Our storydressers do as much; he that comes last is commonly best.<br>
      Robert Burton<p></p>
      </li><li>Copy from one, it’s plagiarism; copy from two, it’s research.<br>
      John Milton<p></p>
      </li><li>Take the whole range of imaginative literature, and we are all wholesale borrowers. In every matter that relates to invention, to use, or beauty or form, we are borrowers.<br>
      Wendell Phillips<p></p>
      </li><li>And what there is to conquer<br>
      By strength and submission, has already been discovered<br>
      Once or twice, or several times, by men whom one cannot hope<br>
      To emulate—but there is no competition—<br>
      There is only the fight to recover what has been lost<br>
      And found and lost again and again: and now, under conditions<br>
      That seem unpropitious. But perhaps neither gain nor loss.<br>
      For us, there is only the trying. The rest is not our business.<br>
      TS Eliot<p></p>
      </li><li>If you refuse to study anatomy, the art of drawing and perspective, the mathematics of aesthetics, and the science of colors, let me tell you it is more a sign of laziness than of genius!<br>
      Salvador Dali<p></p>
      <p>It is not plagiarism for a student to learn from those who came before. To always insist that a student must concentrate on “originality” is not an asset. It is not an ethical dilemma to see how something works and what you might change, and hopefully, improve on it. </p>
      <p>Your dilemma as a teacher is to determine if the student is actually thinking and learning about something. Are your students growing in their understanding of the past and making their way into the future? If they are, then they deserve praise. If the student is merely parroting something back, that is plagiarism. It is thought that counts.</p>
      </li></ul>
