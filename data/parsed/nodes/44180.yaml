      <p><cite>So perhaps if a student were to come up with a novel and meaningful idea involving transforming an exisiting font, and it wasn’t just a lazy gloss, that would be worth considering?</cite></p>
      <p>That might be appropriate if the a project’s goal is simply to produce a working font, but I think that it falls short if the goal of the project is to learn to design type. One learns a hell of a lot about the design of a letter by drawing it, even if the drawing process is just a digital tracing. But when an existing font is modified, all of the hard work is done; one need only apply a new idea. Such a project might be appropriate if the goal is to explore mashing up ideas, but that doe not appear to be the case here. </p>
      <p>As a student working on a new typeface based on an existing design, my working process has always been to redraw the existing letters myself and build on that. I constantly check my work against a digital version of the font I am using as a basis, which allows me to spot a lot of mistakes and answers many of my questions about why a font is put together the way it is. I could have saved myself a lot of time by just loading up the original and modifying it, but I wouldn’t have learned a thing about drawing letterforms, or proportions, or spacing or kerning. I would only have learned to dump my design ideas on top of anothers.</p>
      <p>I’ll now attack on Mr. Goen’s arguments for why the student should be allowed to do this: Picasso learned to draw in his father’s teaching method: copy from drawings, then draw sculpture, then draw from life. Would he have have ever made it to step two if he had simply fired up Photoshop, plugged in a Wacom tablet, and started scribbling over scans of old master drawings?</p>
