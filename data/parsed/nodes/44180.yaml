      <p>If the class is on type design, they probably should not start from something that already exists.</p>
      <p>But <cite>typography</cite> includes more than type design. There have been a lot of times in my work where I had to draw up some characters for a font that didn’t have them — anything from a set of old-style numbers, small capitals in italic, Old English sorts — eng, yogh, Carolingian et, etc, Yoruba and Pan-Nigerian characters, and on &amp; on.</p>
      <p>Some foundries allow the end user to modify fonts — Adobe is an obvious example — and it is a useful skill to have.</p>
      <p>So I’d say it depends on what you lump into <cite>typography</cite></p>
