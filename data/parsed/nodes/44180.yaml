      <p>Font making applications can blend two fonts to come up with a “tween”.<br>
      This may be considered a surreptitious form of “point piracy”, which is forbidden by font EULAs.<br>
      However, it is also a use of digital media that creates new ways of designing to emerge, and is “true to materials”, a central principle of many traditional art forms, so the issue is more complex than if tweening were just a cheat.</p>
      <p>There are some fonts available online, eg. Bitstream Vera,  which have licences permitting modifications.</p>
      <p>So perhaps if a student were to come up with a novel and meaningful idea involving transforming an exisiting font, and it wasn’t just a lazy gloss, that would be worth considering?</p>
