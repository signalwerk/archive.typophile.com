      <p>As I understand it (and I’m not a lawyer) the person who writes a contract can put any conditions they want into it, no matter how seemingly absurd, and if someone else agrees to the contract (in order to acquire access to the property), then they are bound by the terms.</p>
      <p>If they think the terms are unreasonable, then they shouldn’t agree to the contract—in which case they won’t get the property and won’t be able to study it.</p>
      <p>If the terms are illegal, in the sense that the licensor claims rights which they don’t possess, that’s another matter.</p>
      <p>But in that case, wouldn’t you consider it unethical of the licensee to agree to the contract in order to gain access to the property, knowing that he/she was going to ignore the terms of the contract?</p>
