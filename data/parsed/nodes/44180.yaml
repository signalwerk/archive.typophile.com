      <p>Nick,<br>
      I don’t understand your objection, as I believe we are saying the same thing. “if ... one measures the sidebearings ... and deduces the strategy behind this” is exactly what I was suggesting. That’s what I meant by “tearing it apart.” I said nothing about cut and paste, I said to rework the typeface, analyze and transform it.</p>
      <p>I think a fairly useless exercise would be to ask a student to create the metrics for a new font without first understanding how metrics came to be and were used in the past. Therefore, you deduce the strategy and learn from it. Even if what you learn is that you don’t agree with the strategy.</p>
      <p>Mr Puckett,<br>
      Similarly, I never said anything about “scribbling all over” anything. How does “copy from drawings” differ from what I was suggesting as a beginning point?</p>
