      <p>1. Legally, check the font licence (EULA) to see what is permissable, as this varies with different foundries.</p>
      <p>2. From an educational perspective, the merit of mashing up other people’s work into something you can call your own is somewhat dubious. Sure, cut and paste is a bona fide part of digital media, and has been canonized in faces such as Dead History, Fudoni, etc., but it’s not the best place to start when you’re learning. Drawing glyphs in a BCP application is the basic skill of font making.</p>
