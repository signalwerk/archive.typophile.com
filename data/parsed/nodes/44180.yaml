      <p>In my experience the question your student raised usually comes up when the students feel insecure about their own ability to design type. When the task seems to daunting students seem to think that starting with a working set of characters will make their own design decisions easier. I have seen what happens next and strongly disagree. However, instead of even entering the discussion wether reverse engineering and plagiarizing other designers work is a creative, honorable and useful enterprise to boot I would suggest to react by making the whole undertaking more accessible. Prepare smaller bites for the students and guide them through the process. Have them draw one character, then the next. In the critique discuss how the letterforms interact. If guided through the alphabet this way, digitizing the drawings will be a relatively small step and nobody will even think to start with stolen outlines.</p>
      <p>If learning FontLab and the principles of type design at the same time seems too complex for that particular class I recommend using FontConstructor  (<a href="http://www.fontconstructor.com/" title="http://www.fontconstructor.com/">http://www.fontconstructor.com/</a>) for their first project and then transitioning to Fontlab with the next assignment. This application is way easier to master, it’s free and encourages modular, object oriented design. </p>
      <p>Discourage plagiarism by snubbing the very notion as below par for any designer. Shoplifting outlines is shameful and will be punished harshly.</p>
