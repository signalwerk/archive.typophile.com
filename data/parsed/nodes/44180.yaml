    html: <p>Instead of relying on the fonts of others I have students appropriate working methods and begin by drawing fundamental characters (HOV hov) while using established fonts as a means of controlling basic proportional relationships. Seeing these relationships among characters and understanding how to apply them to their own work is an essential component of education in graphic design. But they cannot modify another’s work whether that other is a professional designer or another student. Appropriating another’s working method is fine but appropriation of another’s work is grounds for dismissal.</p>
