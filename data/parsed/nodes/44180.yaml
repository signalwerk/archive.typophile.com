      <p>I think the objection of experienced type designers here is not to learning from existing fonts, but rather to what kind of exercise is likely to be most instructive. </p>
      <p>Just taking the digital glyphs from an existing font, and eg, changing the serifs, is not the most instructive exercise. This is because there is so much ’DNA’ in the font that the student is not going to become aware of in this way.</p>
      <p>A more instructive exercise would be to take a good font that is not shown to the students, and giving them some control characters: o n O H. Then have them try to draw three or four other characters in the font consistent with the style. Enough that they can set a few words—you could try ’sex me’ (and in caps) just to get their attention :)  Then compare words set in their newly drawn characters with the original good, professional font. And do this for a few varied styles. Now that is going to be a lot more instructive, I think, than the ’Frankenstein’ exercise.</p>
