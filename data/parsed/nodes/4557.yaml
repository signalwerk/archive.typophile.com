    html: <p>Apologies for the delay in my response <br> <br>Thank you all for your comments which I have found very helpful and - as expected - completely right! <br> <br>I have moved the bug to the left a bit and made it slightly smaller, tightened up the spacing on "bird" and shortened the leg on the L (which was bothering me a lot too). <br> <br>See the new version below... <br> <br>The font is indeed Mrs Eaves (I love it!) but I took the "y" from the "py" ligature as it seemed to work better with the word "landscapes" underneath. <br> <br>If you have anymore comments I would love to hear them - good or bad. Thanks. <br> <br><img src="http://www.typophile.com/forums/messages/29/34986.jpg" alt="Lady_2"></p>
    html_clean: <p>Apologies for the delay in my response <br> <br>Thank you all for your comments which I have found very helpful and - as expected - completely right! <br> <br>I have moved the bug to the left a bit and made it slightly smaller, tightened up the spacing on "bird" and shortened the leg on the L (which was bothering me a lot too). <br> <br>See the new version below... <br> <br>The font is indeed Mrs Eaves (I love it!) but I took the "y" from the "py" ligature as it seemed to work better with the word "landscapes" underneath. <br> <br>If you have anymore comments I would love to hear them - good or bad. Thanks. <br> <br><img src="http://www.typophile.com/forums/messages/29/34986.jpg" alt="Lady_2"></p>
