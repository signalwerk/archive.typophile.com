    <p>Did anyone else catch the short item on <a href="http://www.cbsnews.com/stories/1998/07/09/sunday/main13562.shtml" rel="nofollow">CBS Sunday Morning</a> yesterday about type? It was a few minutes long and featured interviews of Steven Heller and Jonathan Hoefler. It was predictably shallow, but fairly well informed. It reminded me a bit of the famous Erik Speikermann "<a href="http://www.spiekermann.com/iblog/C1097932338/E1823448250/index.html" rel="nofollow">Typomania</a>" video (but without the Tom Tom Club music).</p>
    <p>I don't normally watch this program, but my parents do and thoughtfully TIVOed it for me so I could see it. I checked the CBS website and they don't have the item viewable online.</p>
  html_clean: |-
