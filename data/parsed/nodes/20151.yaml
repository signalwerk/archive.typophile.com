      <p><em>Not everyone who is past retirement age is technophobic.</em></p>
      <p>My mom's sister, who is about the same age as my dad, used to use a Mac. My dad and I would spend hours on the phone with her explaining the simplest things (like opening a folder icon). And then we'd have to start all over again the next time she called because she immediately forgot it all. I don't remember why, but at one point, she decided to switch to a PC that offered unlimited free phone support. That was one case when I was happy when someone switched from the Mac, but I feel sorry for the phone support people at Gateway.</p>
