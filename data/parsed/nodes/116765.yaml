      <p>Nebiolo absorbed several other foundries after 1889 and for some time the company was called Società Augusta, but it reverted to Nebiolo&amp;Co in 1917. See Luc Devroye's Nebiolo page <a href="http://luc.devroye.org/fonts-36780.html" title="http://luc.devroye.org/fonts-36780.html">http://luc.devroye.org/fonts-36780.html</a>. So this font could have been in a Nebilo catalog. The Klingspor musueum has listed many, &amp; perhaps all, of the types ever made by Nebiolo  <a href="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftgiessereien/Nebiolo/Nebiolo.pdf" title="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftgiessereien/Nebiolo/Nebiolo.pdf">http://www.klingspor-museum.de/KlingsporKuenstler/Schriftgiessereien/Neb...</a> but does not show any images. So the name could perhaps be on this list.<br>
      Probably not digitized.<br>
      Some substitutes. Cognac <a href="http://www.myfonts.com/fonts/solotype/cognac/" title="http://www.myfonts.com/fonts/solotype/cognac/">http://www.myfonts.com/fonts/solotype/cognac/</a>  Secession <a href="http://www.myfonts.com/fonts/hihretrofonts/secession/" title="http://www.myfonts.com/fonts/hihretrofonts/secession/">http://www.myfonts.com/fonts/hihretrofonts/secession/</a> Künstler Grotesk ML  <a href="http://www.myfonts.com/fonts/hihretrofonts/kunstler-grotesk/" title="http://www.myfonts.com/fonts/hihretrofonts/kunstler-grotesk/">http://www.myfonts.com/fonts/hihretrofonts/kunstler-grotesk/</a> Auchentaller <a href="http://www.myfonts.com/fonts/hihretrofonts/auchentaller/" title="http://www.myfonts.com/fonts/hihretrofonts/auchentaller/">http://www.myfonts.com/fonts/hihretrofonts/auchentaller/</a> Sparticus  <a href="http://www.myfonts.com/fonts/solotype/sparticus/" title="http://www.myfonts.com/fonts/solotype/sparticus/">http://www.myfonts.com/fonts/solotype/sparticus/</a> Roberta <a href="http://www.myfonts.com/fonts/profonts/roberta/" title="http://www.myfonts.com/fonts/profonts/roberta/">http://www.myfonts.com/fonts/profonts/roberta/</a> Rotorua  <a href="http://www.myfonts.com/fonts/hanoded/rotorua/" title="http://www.myfonts.com/fonts/hanoded/rotorua/">http://www.myfonts.com/fonts/hanoded/rotorua/</a> Vienna Workshop <a href="http://www.myfonts.com/fonts/hanoded/vienna-workshop/" title="http://www.myfonts.com/fonts/hanoded/vienna-workshop/">http://www.myfonts.com/fonts/hanoded/vienna-workshop/</a> Himmelblau  <a href="http://www.myfonts.com/fonts/hanoded/himmelblau/" title="http://www.myfonts.com/fonts/hanoded/himmelblau/">http://www.myfonts.com/fonts/hanoded/himmelblau/</a> P22 Arts and Crafts <a href="http://www.myfonts.com/fonts/p22/arts-and-crafts/" title="http://www.myfonts.com/fonts/p22/arts-and-crafts/">http://www.myfonts.com/fonts/p22/arts-and-crafts/</a> Kolo LP <a href="http://www.myfonts.com/fonts/letterperfect/kolo/" title="http://www.myfo