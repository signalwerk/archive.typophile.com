    date: 2006-03-07T14:06:00
    votes: null
    html: <p>Most definitely. There are few digital faces that feature such extreme hairlines. When an older font is digitized, they want to make it as usable as possible over a range of sizes. Having such thin hairlines would make a font not look too good at sizes smaller than an inch or so. "It's falling apart at 36 point...better make those hairlines thicker."</p>
  - id: 111409
    user_id: 7764
    user_name: Norbert Florendo
    user_path: null
    user_image: /files/pictures/picture-7764.png
    date_raw: 7 Mar 2006 — 5:03pm
    date: 2006-03-07T17:03:00
    votes: null
    html: |-
      <p>&gt; <em>Having such thin hairlines would make a font not look too good at sizes smaller than an inch or so.</em></p>
      <p>Do you mean like ITC L&amp;C Stymie Hairline and ITC Busorama (display cut) as well as ITC Firenze, LSC Caslon No. 223, Mark?</p>
      <p>Somehow the pre-digital ITC Manhattan made it's way into the digital age with the addition of a pixel or two.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ITC_Manhattan.png"></div><p></p>
      <p>Odd, though... it's not only hairline faces that need taming before going digital.<br>
      ITC Gorilla's fur looks more like Lassie than King Kong.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ITC_Gorilla.png"></div><p></p>
      <p>But who would ever want to see a tiny Manhattan or an one-inch gorilla anyway?<br>
      --------------------------------------------------<br>
      Yes, I'm old, and my hairline is fading too!</p>
  - id: 111411
    user_id: 1043
    user_name: Mark Simonson
    user_path: null
    user_image: /files/pictures/picture-1043.jpg
    date_raw: 7 Mar 2006 — 5:35pm
    date: 2006-03-07T17:35:00
    votes: null
    html: <p>Two I specifically had in mind were Jonathan Hoefler's <a href="http://www.typography.com/catalog/didot/index.html" rel="nofollow">Didot</a> and David Berlow's <a href="http://fontbureau.com/fonts/Throhand" rel="nofollow">Throhand</a>. But all of the old display fonts from the phototype era that have been digitized (the ones I know of anyway) seem to have taken a conservative approach with regard to the hairlines. I think it's a shame, but it's not like the situation is hopeless. (We have the technology!)</p>
  - id: 111414
    user_id: 7764
    user_name: Norbert Florendo
    user_path: null
    user_image: /files/pictures/picture-7764.png
    date_raw: 7 Mar 2006 — 6:01pm
    date: 2006-03-07T18:01:00
    votes: null
    html: |-
      <p>Yes, the technology is there.<br>
      Many manufacturers are required (either by law or by their insurance company) to post dangers due to potential misuse of their product such as:<br>
      <a href="http://cgood.org/society-45.html" target="new" rel="nofollow"><em>A five-inch brass fishing lure with a three-pronged hook on the end which warns: "Harmful if swallowed".</em></a></p>
      <p>Instead of "doping down" thin strokes on some great pre-digital display faces, or current type designers shying away from fine hairline strokes, couldn't the font EULA for a particular face state:<br>
      <em>WARNING: Setting this typeface at sizes less than 72 points or 1" will cause painful and permanent damage to your retina.</em> ;-)</p>
