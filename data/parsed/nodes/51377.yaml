    html: |-
      <p>I think it's a huge step forward, but it will now be hard to remember some things.</p>
      <p>resumeplanet.com and résuméplanet.com are pronounced the same, but could be totally different websites.</p>
      <p>Also, for the most part, all websites are now somewhat readable by english speakers because of the latin alphabet.  This will do a much better job at sorting geographic interest sites than using country coded TLDs.</p>
      <p>A step sideways maybe.  Arguably forward, arguably backward, but certainly progress in some direction for sure!</p>
