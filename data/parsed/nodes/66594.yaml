      <p>Well, I load 300-response MetaFilter threads quite commonly. (Typical MetaTalk threads have 150 to 200 replies.) We’ve just got text and avatars, people, and rare feature illustrations. That is not a lot for browsers to handle. You’re all using good equipment and you can all handle it no problem. This isn’t theoretical; I read lengthy forum postings all the time.</p>
