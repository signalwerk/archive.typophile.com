  html: |-
    <p>Breaking long threads into multiple pages is a bad idea for several reasons:</p>
    <ul>
    <li>We associate pagination of this sort with the most vulgar commercial sites, which use pagination to artificially inflate pageviews, thereby raising advertising rates. The only other thing pagination does is infuriate readers who are just trying to get through the damned text.</li>
    <li>Nobody using Typophile has so primitive or fragile a browser/computer setup that a long thread (of mostly text) stands any chance of crashing a browser.</li>
    <li>Links on discussion homepages to so-called most-recent comments <em>never take you there</em>; you are taken to the <em>first</em> page of comments.</li>
    </ul>
    <p>Pagination needs to be eliminated.</p>
