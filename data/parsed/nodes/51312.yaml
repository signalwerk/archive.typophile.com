    <p>Need some type advice.</p>
    <p>I’m doing a school yearbook which is around 200 pages which is print and web based. Im looking for a several fonts that I can use throughout the book. The school uses Times New Roman as its ’Brand’ Logo font and would like to keep it. Would anyone like to give some suggestions of what i could team it with or even some way of making it look right?!! Last year I played around with Verdana for main body text just for web advantage with some degree of success.</p>
    <p>Any feeds would be greatly received.</p>
    <p>Cheers</p>
    <p>GMan</p>
