      <p>Hmmm, so you’re stuck using one of the most ubiquitous typefaces that has plagued the earth since the advent of digital typography.</p>
      <p>Times is a tested workhorse, but it lacks all flavour.  For Times, I’d really recommend you using it larger than you’d regularly use it.  Times can be quite beautiful at large sizes.  Try spicing it up by not using black and white, but a grey (with a decent enough contrast to be read easily on whatever background you choose, at least a 40% difference in tone, 60% is best)</p>
      <p>I assume this is mainly a black and white book?</p>
      <p>What I’d recommend, and this is opinion, but choose only 2 typefaces for the entire book, and stick to them.  I’d recommend a serif and a sans serif.  You have Times chosen for you already.</p>
      <p>Go through the sans-serif typefaces you have and see what pairs well with Times, and to feel them you have to get both of them big on your screen.</p>
      <p>Also, once you start designing the pages, print them out and touch the pages, rotate the pages, flip them upside down and just look at the shapes of the letters.  When you print a typeface it becomes tactile, it has a different feel.</p>
      <p>I’m sure, if you were to being designing the yearbook, you could upload a layout page to the forum and get a critique on it and some better adive once we all see how you’re using it.</p>
      <p>Best of luck with your yearbook, that’s a fun and important project!</p>
