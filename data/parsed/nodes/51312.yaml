      <p>well, if I was going to be doing a yearbook, one tool I’d have in my little box of tricks is this:</p>
      <p>Vector illustrations!</p>
      <p>I don’t know what software you plan on using for the yearbook — I would be doing it in indesign.</p>
      <p>One tool that is invaluable is a lot of high-quality vector illustrations, and I use two main sources for mine because they aer quality, free and consistent.</p>
      <p><a href="http://www.oxygen-icons.org">Oxygen icon set</a></p>
      <p>this is a pretty awesome set, and you can snag the colour palette from their site and use that in your layouts so the layout colours match the illustrations.  For somebody who has little or moderate experience at this, this will save you time, stress and let you sleep at night because a designer better than me or you has chosen colours that work for us in advance :-)</p>
      <p>It can be sneaky to get the icons, because you have to check them out of SVN or find a download of them elsewhere, but they’re licenced to open-source so you’re free to use and modify them.</p>
      <p></p><div class="imageWrap"><img src="/files/figure4_6738.png"></div><br>
      oxygen palette<p></p>
      <p><a href="http://tango.freedesktop.org">Tango Project</a></p>
      <p>this icon set uses more a more trendy and limited palette, but there are less icons available.  They are also open-source and free to use for any purpose, so go nuts and check them out, you’ve got nothing to lose!</p>
      <p></p><div class="imageWrap"><img src="/files/Tango-Palette_4729.png"></div><br>
      tango palette<p></p>
      <p>Hope these resources will help you, I know I refer to them or their colours palettes on almost every project I do!  </p>
      <p>Best of luck to you!</p>
