      <p>I have a lot of test documents in Hebrew with some English text.<br>
      My first goal was to balance the size and boldness of the English so that it<br>
      was unobtrusive - usually acheived by having the Latin characters a little<br>
      larger and a lighter. The overall effect should be for the Hebrew to stand<br>
      out on the page even when an English translation with more words will<br>
      occupy more space</p>
      <p>In no way did I want the Latin characters to look like Hebrew ones.  I avoid<br>
      giving the shape of a Hebrew character to a Latin character.  My approach<br>
      was to make a small change in the Latin and then review all my test documents<br>
      to see if there was an improvent.  For instance, the first change was to tilt the<br>
      center bar of the lower case "e".  The change was carried out across the<br>
      six members of the font family. I was amazed that an improvement could be<br>
      seen in the appearance of whole pages after such a small change! </p>
      <p>The table below shows which Latin characters were changed.<br>
      Further changes suggest themselves but will they improve appearance and not<br>
      diminish readability?<br>
      Mike</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/changes_to_latin_6343.jpg"></div><p></p>
