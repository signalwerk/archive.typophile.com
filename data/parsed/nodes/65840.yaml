    <p>The Mike Hebrew font family has a set of Latin characters. Getting the Hebrew and Latin to match is not at all straightforward  indeed Latin and Hebrew are incompatible in both metrics and style.</p>
    <p>At first I took Tuffy for the Latin with few modifications but now I'm attempting to design a new Latin alphabet. </p>
    <p>Here is an example. My goal is that the Latin should be unobtrusive in its secondary role. Please help me get a good set of Latin characters.</p>
    <p>PLEASE CRITICIZE THE LATIN ALPHABET.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/matching_latin_and_hebrew_2_6393.jpg"></div><p></p>
