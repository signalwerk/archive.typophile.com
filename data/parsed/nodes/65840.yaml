    html: <p>Mike, I think David, who is a native speaker and designer of excellent Hebrew types, is right on the mark. Your Mike Hebrew already is a display font, as it won't work for extended text. So a matching latin that is much more strongly 'flavored' is a more appropriate match.</p>
