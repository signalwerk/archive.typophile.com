      <p>Hrant,<br>
      There may be valuable possiblities in the approach you suggest. Certainly in brief bilingual presentation such as product name or title page, a closely related visual<br>
      style would be attractive. However I'm thinking of my Latin as being a practical<br>
      workhorse to get the Latin out with minimal baggage. The user doesn't have to LIKE the<br>
      design - ideally it should not even be noticed.</p>
      <p>William,<br>
      The very narrow roman characters are of value in displaying translated text where the<br>
      English is so much more wordy and the Hebrew so very brief.<br>
      If you look again at my first post, I think you might agree that the English text in<br>
      the example blends in well with the Hebrew... or maybe it doesn't. What do you think?</p>
      <p>Mike</p>
