    html: |-
      <p>&gt;depreciating the baseline</p>
      <p>Ada Yardeni in Hebrew Script points out that traditionally Hebrew is "hung" from the top, with the baseline not so strong. The baseline was made stronger in Ashkenazi scripts, perhaps under the influence of Latin scripts. </p>
      <p>Mike Hebrew takes advantage of the fact you can play with the baseline in Hebrew without penalty--except for making nikud more difficult to place. </p>
      <p>Playful designs like <a class="freelinking external" href="http://www.p22.com/ihof/peanut.html" rel="nofollow">Peanut</a> (that link should work, the above does not) are able to get away with an irregular baseline in latin. I don't understand how exactly they are able to pull it off, but you might ask typophiler Michael Clark, who designed Peanut, about the challenge. </p>
      <p>Because of the informal mono-line, I think potentially the latin can be very strong also, and still harmonize. This would be a real achievement, I think--to have a latin and hebrew that really work together seamlessly. If it were me, I'd start by mirroring your kaf and using that as a c, and building the look on that. As it is, the very round sans you have doesn't work at all, IMHO.</p>
