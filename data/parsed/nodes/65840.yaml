      <p>Indeed this is quite a difficult design problem. I would recommend reading my article "Latinization: Prevention and Cure"* published in issue #4 of the Austrian magazine Spatium (as well as the 5th issue of the Greek journal Hyphen) and studying my "multilateral" solution for Armenian and Latin, a typesystem called Nour&amp;Patria**. You could say it took me two decades to arrive at what I did; I think it works, and I hope it can inform the development of almost any multi-script type family.</p>
      <p>* A preview here: <a href="http://themicrofoundry.com/ss_rome1.html" title="http://themicrofoundry.com/ss_rome1.html">http://themicrofoundry.com/ss_rome1.html</a></p>
      <p>** From the Creative Review awards:<br>
      <a href="http://themicrofoundry.com/ad/CR.pdf" title="http://themicrofoundry.com/ad/CR.pdf">http://themicrofoundry.com/ad/CR.pdf</a></p>
      <p>The first thing I would decide: Is the Latin meant for parallel setting, or subordinate setting? My view is that a single font can't do both - a more complex system is needed.</p>
      <p>hhp</p>
