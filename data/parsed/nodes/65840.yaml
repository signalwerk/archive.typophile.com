      <p>&gt; How should this effect the design of the Latin characters?</p>
      <p>The way I see it a subordinate font can sacrifice quite a bit of cultural authenticity - but only with the purpose of better serving the master design. So for example Patria's Armenian subordinate has full serifs (which the Armenian script really doesn't like). Another example is the Latin "g" below from a grot Cyrillic-dominant typeface I was commissioned to design last year. It's made to echo the form of the Cyrillic "б".</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cyrlat_g_4412.gif"></div><p></p>
      <p>For serving a traditional Hebrew type I might recommend a subordinate Latin where the stroke contrast is flipped (thicker horizontals than verticals*) but Mike Hebrew is monoline (which you could say makes things easier). Another central parameter is vertical proportions: Latin likes to have an x-height within a certain range, but to avoid a subordinate that looks too large/small in comparison to the master script you can move quite a distance away from that range; in the case of Hebrew that probably means a Latin with quite a large x-height (which you seem to be shooting for already).</p>
      <p>* See the work of Excoffon and Bloemsma.</p>
      <p>--</p>
      <p>William, depreciating the baseline is quite a fascinating idea.</p>
      <p>hhp</p>
