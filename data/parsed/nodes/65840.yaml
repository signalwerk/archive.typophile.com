      <p>"Blends in well" is a question of: compared to what? Generally there's a huge gap between latin and hebrew scripts. So better than many, but still far from being really harmonious. </p>
      <p>Stylistically, they are very different, even though the monoline for both helps immensely. There are a lot of very successful squared off sans--my favorite is Klavika--and my feeling it that something like that would have a shot at more harmony.  </p>
      <p>I don't know about the squashing. I think it would be better to get them really harmonious. If squashing helps, fine, if not not.</p>
