      <p>I think that I maybe wasnt so clear in my explanation (probably because my bad english). I give it another try =)</p>
      <p>The V and H always has the same unoptical balance, no matter where it’s placed, isnt it?</p>
      <p>Keep the same spacing but move the letters all to the left. Like you take every letter and move them to the left. In my opinion, the same optical problems will always occure if they are to the left, middle or to the right. </p>
      <p>As an example: The “V” would even even break the left sidebearing, then it will look like this in InDesign.</p>
      <p>Maybe I’m completely wrong here, but there must have been theories like this before... for me it seems like the font would become more user-friendly.</p><div class="imageWrap"><img src="/web/20080829234235im_/http://typophile.com/files/breakout_V_H.jpg"></div><p></p>
