    <p>Hi all,</p>
    <p>I’m sitting here learning Fontographer and have a few questions.</p>
    <p>1. As a font-designer, must I learn the hinting process or could I (as the manual suggests) let it be on “auto” and just leave it?</p>
    <p>2. When it comes to placing the letter between the sidebearings, I have a theory here which I would be very happy to get some inputs of. In most of the fonts I have used, the letters are placed with equal sidebearings (more or less anyway). But, what really happens when the user later on set the text in one  textblock, in InDesign or Quark?</p>
    <p>What I mean, is:<br>
    If you set a headline and bodycopy with different sizes adjusted to the left in the same text-block – the headline is automatically placed a little bit to the right, isnt it? This is due to the left “space” of the character. The bigger the headline, the bigger the distance becomes. To solve this, the user have to make the headline in one separate textblock and move it a little bit to the left in order to get a feel that the headling and bodycopy is on the same vertical “guideline”</p>
    <p>To my theory:<br>
    Wouldnt it be a more user-friendly approach to place all letters as close to the left sidebearing as possible, and build the font according to this approach instead? So that every character starts on “zero”. Then the left margins would be more straight for the user of the font.</p>
    <p>Looking forward to hear your thoughts on this matter.</p>
    <p>Regards from Sweden</p>
    <p>Göran</p>
    <p><a href="https://web.archive.org/web/20080829234235/http://www.neptuna.se/" title="www.neptuna.se">www.neptuna.se</a></p>
