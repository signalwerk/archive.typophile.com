    html: |-
      <p>The p tag does have some inherent properties —&nbsp;specifically applying space before and after itself. That's it. Beyond that, it applies semantic meaning to the text indicating a "paragraph" of copy, but that doesn't actually mean anything in terms of positioning.</p>
      <p>It isn't inherently bad form to assign css to copy via a containing div — in fact it can save on file size, but I tend to prefer using p tags since then at the beginning of your css style sheet, you just say:</p>
      <p>p {<br>
       stuff<br>
      }</p>
      <p>and it will apply those rules to every single one on the page. I guess for me, it also helps me think, "ok, this is text because it is in a p tag."</p>
      <p>Actually, basic typographic/layout ideas are not impossible on the web. I've seen some work that is done extremely well that follows those principles. The one I usually present is <a href="http://www.wilsonminer.com/" title="Wilson Miner" rel="nofollow">Wilson Miner's site</a>. Figuring out how to think in terms of web development to make your print-inspired typography and layouts work is the biggest difficulty. That just takes time and practice. It isn't impossible, just <em>different</em>.</p>
