      <p>For future reference, it's best to upload your demo page to a server and give us the link if you can. It's so much faster to just muck with the markup directly than to do the back and forth explanations. </p>
      <p>Indeed, if your text is a paragraph of text, you should be using paragraph tags. While there are default styles for most tags in most browsers, you can 'zero them out' using CSS. Just one of many samples is Yahoo's reset.css: <a href="http://developer.yahoo.com/yui/reset/" title="http://developer.yahoo.com/yui/reset/">http://developer.yahoo.com/yui/reset/</a></p>
      <p>As for dealing with baseline grids, the basic premise is that all of your element's styles have to conform to fall within whatever increment you are using for the grid.</p>
      <p>So, if you're using a 20px grid, then your header tags' line-height, padding and margin would have to add up to 20px or 40px or 60px, or etc...</p>
