  html: |-
    <p>I am trying to make text and images line up in CSS/HTML using the same principles as baseline typography.<br>
    I am using images inside AP DIVs, and lining them up with the cap height of adjacent text in another AP DIV.</p>
    <p>My problem is that different browsers pad the text differently within the AP DIV.<br>
    I can't seem to stop this using CSS.</p>
    <p>#alltext<br>
    {<br>
    position:absolute;<br>
    width:width;<br>
    height:height;<br>
    vertical-align:top;<br>
    white-space:nowrap;<br>
    margin-top:0px;<br>
    margin-left:0px;<br>
    padding-top:0px;<br>
    padding-left:0px;<br>
    border-top:0px;<br>
    border-left:0px;<br>
    }</p>
    <p>I know that it is only a matter of 1 or 2px but I'd like it to be as tight as possible. </p>
    <p>Apologies for my poor explanation/terminology.<br>
    Thanks in advance.</p>
    <p>Andrew</p>
