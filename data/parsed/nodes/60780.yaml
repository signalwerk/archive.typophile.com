    <p>I am considering selling some of my artwork and handmade home wares online and was playing around with making a logo. The shop name would be (as you can see) "JR Home Goods," which I like because it's somewhat ambiguous allowing me to very my product range however I want over the long term.</p>
    <p>I have two versions here, I'd love to hear what you think generally of the large letters - I started with Plantagenet Cherokee and modified some elements in both letters (more in the R). Also, which version you like better.</p>
    <p>Thanks! I've been out of design a little while so I"m feeling rusty and your critiques will really help.</p>
    <p>I wanted to add - I know this is really basic. I like the idea of using the basic letterform logo then being about to apply it to a lot of different backgrounds, etc., online to change things up seasonally, etc.</p>
