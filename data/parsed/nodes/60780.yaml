      <p>I like the name, theres a tone of trustworthiness and solidness about it, something traditional and tangible. </p>
      <p>But...</p>
      <p>If its art you're selling, i'm not sure that 'home goods' would resonate with me. I buy quite a lot of original paintings, prints and drawings and 'home goods' is not something that i'm after when i buy art. Although I guess 'art' is a fairly broad term - maybe home goods works for the oeuvre you're selling?</p>
      <p>Anyway...</p>
      <p>In terms of a logo, I don't think trying to integrate the JR into Home Goods is going to work well. I would explore some other options that treat the 'home goods' as more of a byline and the JR as more of a brand statement that can either stand alone or work with the byline.</p>
