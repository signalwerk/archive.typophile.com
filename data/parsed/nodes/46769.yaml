    html: |-
      <p>You just never know when Fontlab is going to crash. It's no better on a PC than on a Mac or vice-a-versa. I've not yet encountered the crashing condition you describe, but then I don't use shortcut keys like that to enter accented characters. I learned to spell out the glyph names, eg: /acircumflex, ccedilla etc. I find that easier than remembering shortcut keys, but then writing is something I actually enjoy doing so it's not for everyone.</p>
      <p>Save your file often. I hit command + s after every edit or at least every ten edits. You just never know when Fotnlab is going to crash.</p>
      <p>j a m e s</p>
