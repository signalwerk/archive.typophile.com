  html: <p>When I bring up characters with diacritics in Fontlab (5.04 on OS X 10.4) using their keyboard commands Fontlab often crashes. For example, if I use Opt+` followed by e to bring up egrave, Fontlab crashes. It seems to happen after I’ve already entered other diacritic characters. I‘ve tried removing my preferences and uninstalling/reinstalling Fontlab with no luck. Is this a common problem?</p>
  html_clean: <p>When I bring up characters with diacritics in Fontlab (5.04 on OS X 10.4) using their keyboard commands Fontlab often crashes. For example, if I use Opt+` followed by e to bring up egrave, Fontlab crashes. It seems to happen after I’ve already entered other diacritic characters. I‘ve tried removing my preferences and uninstalling/reinstalling Fontlab with no luck. Is this a common problem?</p>
