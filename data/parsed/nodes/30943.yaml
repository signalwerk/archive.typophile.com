    <p>Hello,</p>
    <p>I am a graphic design student from Arnhem, The Netherlands, I was<br>
    wondering if anybody has a pdf file of an original American newspaper,<br>
    that was ment for printing, photo's and ads included.<br>
    it does'nt matter from which date the paper comes.<br>
    It is part of a case study for turning a book into a paper, and in reverse.<br>
    Also the thematics play a large role. </p>
    <p>Thanks in advance!</p>
