      <p>@aegirthor:<br>
      Thanks, I have the feeling you are absolutely right.<br>
      I'm just not sure how to make it come out nicely...</p>
      <p>You see, I tried something similar before and I wasn't very pleased with it:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/test1_3911.png"></div><p></p>
      <p>@kattttor:<br>
      (Great to have someone Swedish commenting on the actual name!)<br>
      Yes, architecture is very precise, but does that necessarily mean perfect circles and squares? I don't think so. Many other forms can be 'precise' or 'simple' in a much more interesting way. Also, a circle is not the only thing that has a 'circumference' (omkrets), right?. </p>
      <p>I don't want to emphasize on the circle too much because I think this interpretation is narrowing down the concept of 'omkrets' to just 'circumference of a circle'.</p>
      <p>However I have chosen three typefaces that I like, with circular 'o' just for you!</p>
      <p>Glaser Stencil:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/glaser stencil_5485.png"></div><p></p>
      <p>Mostra:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/mostra_5429.png"></div><p></p>
      <p>Variex:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/variex_4635.png"></div><p></p>
      <p>What do you think? Was there another typeface you had in mind? Please show me!</p>
      <p>@Hiroshige:<br>
      Interesting point.<br>
      Luckily, architecture is wide enough to embrace any definition of it.</p>
      <p>There were some amazing designs on the Bamboo page! Thanks for sharing this link. I think I could be happy spending the rest of my life making baskets. It seems tricky though, ten years just to get started...</p>
      <p>Thanks!<br>
      /Mårten</p>
