      <p>Thank you very much for your comments so far!</p>
      <p>I realize it doesn't work so well in small sizes, maybe a filled version is better.</p>
      <p>I'll try to explain the idea behind the logo:<br>
      These images describe the "spirit" of the name and the company:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/omkrets-what-1_5705.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/omkrets-what-3_4800.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/omkrets-what-4_3486.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/omkrets-what-5_4810.jpg"></div><p></p>
      <p>It's about enclosing or encircling space in an orbiting fashion.</p>
      <p>I wanted to use something curly, like a script typeface, but still funky or contemporary. I tried these fonts first:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/omkrets-easyscript_4846.gif"></div><br>
      Easyscript from <a href="http://lineto.com" rel="nofollow">Lineto</a><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/omkrets-kulukundis_5183.gif"></div><br>
      <a href="http://www.myfonts.com/fonts/linotype/kulukundis-itc/" rel="nofollow">Kulukundis</a><p></p>
      <p>Also, the single stroke look (especially rounded endpoints, like in Easyscript) I think relates to architectural drawings in a way.</p>
      <p>I hope this clarifies the intention.<br>
      Perhaps there is a better way to express it in the logotype?</p>
