      <p>It's late here in London so please don't mistake my brevity for being curt. I applaud your desire to be creative, and I can see the effort that went into this. </p>
      <p>However, honestly, it's rather difficult to read.</p>
      <p>It's not going to be particularly useful in tiny sizes—a good logo should be readable under even the most stringent, adverse conditions. </p>
      <p>Very faddish and likely to seem anachronistic in the foreseeable future.</p>
      <p>And most importantly, no concept. What's the idea? What's it trying to say? If their name means circumference or orbit or something to that effect, perhaps that would be a starting point for an idea-based logo as opposed to just a really cool typeface logo.</p>
