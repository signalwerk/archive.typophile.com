    html: |-
      <p>&gt;<em>It’s about enclosing or encircling space in an orbiting fashion.</em></p>
      <p>For what it's worth...</p>
      <p>Raw pure Architecture (cap. A) is not about enclosing or encircling space... <em>It</em> 'moves' with space and is 'of' space - just as you 'move' and are 'of' Life (cap. L). And if you really want to get down to it, it's space that defines mass. Beethoven wrote that he composed the space <em>between</em> the notes...  </p>
      <p>A current trend/fashion in architecture (lower case 'a') is deconstructivism (think Gehry et. al), and to that flavor I think your concept is somewhat appropriate.</p>
      <p>Btw, take a look at the work of Torii Ippo and his contemporaries at:  <a href="http://www.textilearts.com/bamboo/index.html" title="http://www.textilearts.com/bamboo/index.html">http://www.textilearts.com/bamboo/index.html</a> .</p>
      <p>...I'm beginning to ramble.</p>
      <p>_________<br>
      Hiro</p>
