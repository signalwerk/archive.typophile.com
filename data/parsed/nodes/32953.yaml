    <p>Dear Typophile community.</p>
    <p>This logo is for a small <a href="http://omkrets.se/" rel="nofollow">architecture firm</a> in Stockholm:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/omkrets-20dpc-black_4719.png"></div><br>
    <a href="http://omkrets.se/common/omkrets-logo2-hires.png" rel="nofollow">(high resolution here)</a><p></p>
    <p>It is based on the typeface <a href="http://t26.com/fonts/Orgasmia" rel="nofollow">Orgasmia Outline</a> by Brito Renato (t26.com) but I have altered the "o" and the "t" to make every letter consist of (only) one self-intersecting line.</p>
    <p>I like how the letters are both pixel-based and drawn with a line.<br>
    The name " o m k r e t s " means "circumference" or "orbit" (sort of) in Swedish.</p>
    <p>Please tell me what you think!</p>
    <p>Thanks!<br>
    Mårten</p>
  html_clean: |-
