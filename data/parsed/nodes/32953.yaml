      <p>Just a general thought on the name.<br>
      I'm swedish too and omkrets is a very round word and I really expect to see soft round shapes on a logotype witch uses the name omkrets. When I look at that first version it goes in the direct opposite of what I was expecting to see.</p>
      <p>I'm not saying that a scrpt or serif wouldn't work that was just the first thing that came to mind.</p>
      <p>Encircling space in an orbiting fashion is a cool idea though. You could try to have the encircled space form the letters and the orbiting space filled with a color, could create some interesting forms. Might be difficult with some letters but it would be interesting to see.</p>
