    html: |-
      <p>James, </p>
      <p>it's not an error, it's a warning. </p>
      <p>It is not crucial -- inconsistent linespacing between Mac and Windows may be a result. However, fixing it would require manual editing of the linespacing values (Ascender, Descender). </p>
      <p>A.</p>
