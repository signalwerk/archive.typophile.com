  html: <p>Has anyone come across a batch font conversion script for Fontlab? I have about 200 fonts in pfb/afm format that I need to convert over to a format OS X can handle.</p>
  html_clean: <p>Has anyone come across a batch font conversion script for Fontlab? I have about 200 fonts in pfb/afm format that I need to convert over to a format OS X can handle.</p>
comments:
  - id: 230102
    user: 1133
    date: 2007-09-26T23:34:00
    date_raw: 26 Sep 2007 — 11:34pm
    votes: null
    html: |-
      <p>That's easy, without any script:<br>
      1. Choose "Tools" / "Action Set".<br>
      2. Set "Apply action set to" to "Fonts in the Fonts List".<br>
      3. Click on "..."<br>
      4. Click on "+" and choose all your .pfb fonts.<br>
      5. Set "Destination format" to "OpenType PS (.otf)".<br>
      6. Choose a destination folder.<br>
      7. Click on "OK", then "Run". </p>
      <p>Adam</p>
