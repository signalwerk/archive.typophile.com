    html: <p>Pro (Adobe-Japan1-4) and better Japanese OpenType/CFF fonts included glyphs for upper and lowercase macroned vowels at CIDs 9361 through 9370, and they're encoded at U+0100/U+0101 (Āā), U+0112/U+0113 (Ēē), U+012A/U+012B (Īī), U+014C/U+014D (Ōō), and U+016A/U+016B (Ūū). You don't need any special OpenType feature to access these glyphs. You simply need to use the appropriate Unicode code points.</p>
  - id: 506630
