    html: <p><a class="freelinking external" href="http://www.unicode.org/" rel="nofollow">Unicode</a> has the vowel-macron combinations in <a class="freelinking external" href="http://www.unicode.org/charts/" rel="nofollow">Latin Extended A</a> (U+0100–U+017F). That's a start, anyway.</p>
