    <p>I would like to add aeiouAEIOU with straight dashes ontop of the characters (like macron marks). These signify long vowel sounds and are used in the Hepbern romanisation of Japanese Language called Romaji.</p>
    <p>Looking at a  Japanese "Pro" Font:<br>
