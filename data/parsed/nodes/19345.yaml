      <p>Hmmm, this is absolutely NOT a case to use a  free font that is derived from Bodega Sans. If your client can't afford Bodega, perhaps you could suggest a cheaper alternative (similar but not derivative) or a font from your library that could work. However if your client insists on Bodega Sans specifically, you should tell them that it is worth $648 bucks and perhaps you could educate them why fonts are so darned "expensive*".</p>
