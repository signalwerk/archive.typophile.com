      <p>It might disarm those kinds of replies if you describe the type of font characteristics, and say, "sort of like Bodega, which my client, a poor non-profit organization, can't pay for."</p>
      <p>There is a very high concentration of people who make their living with fonts here, so free stuff is kind of threatening, and a sore subject with some. </p>
