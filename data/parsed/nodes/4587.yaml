    html: <p>Daniel <br> <br>Type specimen books are not often dated I'm afraid to say. Sometimes you can find a code (that might indicate date) on the bottom of a page or there may be a letter or notice of date from the foundry early on in the book. Neither the Lanston nor the British Monotype books that I have are dated. There is a huge Monotype site in Switzerland that has tons of information of the most arcane sort. Might be worth a look see. <br> <br><a href="http://www.letterpress.ch/content.html" target="_blank">http://www.letterpress.ch/content.html</a> <br> <br>Gerald</p>
