  html: <p>I was in a used-book store today and came across a cool and really old-looking "Monotype Typefaces" book from Lanston Monotype Machine Co. The only other info I could find on it was that it was printed in Philadelphia. I tried to buy it but the guy wanted to price it on the internet. I just did a quick search and only found something similar to the book on ebay, going for $6.50. <br> <br>My question is, how much does a spec book like this go for? This one isn't in good shape, but it's cool nonetheless. Also, once I have this thing, what do I do with it? :^)</p>
