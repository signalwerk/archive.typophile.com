    html: <p>Daniel <br> <br>There is currently a type specimen book mania among collectors on eBay. The book you were looking at might be worth $20 to $40, maybe a bit more. Much more to folks interested in metal Monotype and the code numbers etc. I have one. It is cool, not as cool as some, but not bad. Specimen books like this are often not in good shape (as they were often extensively used) and collectors seem to do an awful lot of upgrading. <br> <br>Recently on eBay there was a 1840s specimen book from the Bruce Type Foundry in abnormally excellent condition. Extraordinary rare. It was priced at $9.90 or something with no reserve and completely in the wrong category. The seller sold collector plates, not books. So... I thought, boy oh boy. I mean, boy oh boy. I even wrote to him to verify that it was the orginal and not a later reprint. Well, to make a long story short, "they" slowly found it. I believe it sold at $3,660. Probably what about it was worth to a university collection, which is where it should have gone. Can you imagine the party at the unsuspecting seller's home that night? <br> <br>Gerald</p>
