    <p>Lifted from pic in today's business news report that Hudson's Bay may buy Saks.<br>
    So I wonder what fonts or fonts have the comb over ampersand shown on the Saks &amp; Company street level lettering?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/AmpersandSaks&amp;Company_5225.jpg"></div><br>
    Don<p></p>
