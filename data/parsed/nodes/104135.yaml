    html: |-
      <p>So this stumps the typophiles?<br>
      Presumably this lettering style dates to when the store was  designed by department store specialists Starrett &amp; Van Vleck and built in 1922-24? The bronze letters may be more recent but the ampersand matches the style of the large letters over the entrance.<br>
      See <a href="http://www.flickr.com/photos/emilio_guerra/4956479090/" rel="nofollow">photo of front entrance</a>, with architecural information.</p>
      <p>Don</p>
