    html: |-
      <p>Metrolis-Sinaletica is just Signage Icons.<br>
      You find icons for Trains, Metro, Taxis, Parking, pass cards, etc. and for the Line Symbols.</p>
      <p>There are actualy more than four symbols (in the original 1993 Metro expansion plan, they planned six lines, including Orange and Purple)<br><img src="/sites/default/files/old-images/ml_5269.jpg"><br><a href="http://pwp.netcabo.pt/0659437901/ml.jpg">http://pwp.netcabo.pt/0659437901/ml.jpg</a></p>
      <p>But at the moment there are just four different lines:<br>
      — Linha Azul (Blue Line) or Linha da Gaivota (Sea Gull line)<br>
      — Linha Amarela (Yellow Line) or Linha do Girassol (SunFlower Line)<br>
      — Linha Verde (Green Line) or Linha da Caravela (Caravelle line)<br>
      — Linha Vermelha (Red Line) or Linha do Oriente (Orient Line)<br><img src="/sites/default/files/old-images/LinhasMetro_6135.jpg"><br><a href="http://img254.imageshack.us/img254/1899/linhasmetrohh7.jpg">http://img254.imageshack.us/img254/1899/linhasmetrohh7.jpg</a></p>
      <p>Let me tell you something: I´m looking for this font for almost 8 years...<br>
      Is a beautifully designed font, it's distinctive, simple, it reads well, and it´s a strong brand element of Metropolitano de Lisboa.<br>
      But some other companies got it as well, like a chain of Pizza restaurants, a brand of Cheese an a Condominium Management company.</p>
