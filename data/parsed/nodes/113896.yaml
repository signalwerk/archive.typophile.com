    <p>Hi,<br>
    I am hoping you can help me identify the attached font.<br>
    I used it to create this logo for someone about 6 months ago and have since misplaced the font file.<br>
    I  do however still have the photoshop file and upon opening it it tells me that the font is missing, but that it's name is Motorwerk.<br>
    But the weird thing is that a quick google search revealed there is a font called Motorwerk, but it looks nothing like this!<br>
    I'm at a bit of a loss. Any help would be much appreciated!<br>
    Many thanks<br>
    James</p>
