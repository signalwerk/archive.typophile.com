      <p>Thank you for your help fvilanakis, I actually just managed to find it and it was pretty odd.</p>
      <p>It is called 'Motorwerk Oblique' (not 'Motorwerk' which is a different font). It was a part of a XBOX Live game developers package so no wonder it was hard to find! No idea how I came across that originally.</p>
      <p>Font can be found here for anyone interested: <a href="http://xbox.create.msdn.com/en-US/education/catalog/utility/font_pack/" title="http://xbox.create.msdn.com/en-US/education/catalog/utility/font_pack/">http://xbox.create.msdn.com/en-US/education/catalog/utility/font_pack/</a></p>
