    <p>Kade is a display/semi display sans family of fonts based on vernacular lettering photographed over the last ten years in and around the harbours of Amsterdam and Rotterdam. Hence the name Kade that translates into English as ‘quay’, also the name of its designer.</p>
    <p>Kade grew slowly from many different ideas and elements. The letters reflects the industrial method in which they are cut for the side of ships from large steel plates. Frequently subtleties of curves are compromised due to the cutting tools and the fact engineers are in control. Kade’s italics have an experimental character and were produced in an unorthodox manner by rotating 8 degrees, rather than slanting the roman characters, a method sometimes employed in shipyards.<br>
    Kade ‘constructed character’ is ideal for contemporary editorial works, architecture magazines, museums communication and posters.</p>
    <p>The six distinct styles are published in OpenType format, featuring small caps and four sets of numbers (proportional old style, tabular old style, proportional lining and tabular lining), as well as matching currency symbols and a complete set of fractions.</p>
    <p>Kade can be ordered at: <a href="http://www.re-type.com/" title="http://www.re-type.com/">http://www.re-type.com/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/kade-newsletter4_6601.gif"></div><p></p>
