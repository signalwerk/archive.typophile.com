    <p>Hi,<br>
    This is my first post here so please excuse me if this question has been asked before. I have the job of purchasing a font library for our Repro. department, the question is " Which is the best suited for a Repro department, Open Type or Postscript? "</p>
    <p>Thanks in advance.</p>
