    html: <p>When some users first encounter the more advanced features of OpenType, they sometimes worry that these are vendor-specific technologies or that these features could end up in an evolutionary cul-de-sac, like Multiple Masters. A great deal of this technology, however, was created by the major platform vendors to accommodate different languages. As such, these are core components that will be in use for the foreseeable future. Buying high-quality OpenType fonts now could be compared to buying a Type 1 font in 1990. It's going to be the format of choice for at least the next decade, and application support will only get better over time.</p>
