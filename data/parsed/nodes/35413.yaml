      <p>I've been told that the days of RIPs that require PostScript are over and that most printers made in the last few years can handle other formats just fine. If that's the case, the only thing preventing you from using OpenType is if you're not using Adobe CS and you need to get to small caps and other extra glyphs. </p>
      <p>By and large, if you want to avoid support headaches, OpenType is the cleanest way to go.</p>
