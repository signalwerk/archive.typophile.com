      <p>I agree with Stephen. OpenType is fully compatible with MAC/PC, it has a very extended charset and (in my epxerience) chars are rendered much better on PC's monitor. Therefore:</p>
      <p>1 OpenType (if it is available for the font/family);<br>
      2 PostScript;<br>
      3 TrueType.</p>
