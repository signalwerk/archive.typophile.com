    html: |-
      <p>OpenType is the only way to go and I highly recommend it. InD supports OpenType more and more as you get to the current CS3 revision. Quark 6 will allow use of OpenType fonts with the same functionality as the old Type 1 fonts but new OpenType features are not supported until you get to Quark 7 or later. Quark 7 does not support Stylistic Sets though. As an investment, buying Type 1 fonts are sort of like buying VHS instead of DVD movies. They will work as long as you have the equipment (as is certainly the case now) but are limited in features and an unknown for future systems and software. There certainly is no advantage in Type 1 fonts, that is for sure.<br>
      SoTA members and TypeCon attendees will receive a copy of the soon to be printed "Interrobang" journal with a lengthy article about OpenType fonts. If you are not already a member of SoTA, you might think about joining.</p>
      <p><a href="http://www.typesociety.org/" title="http://www.typesociety.org/">http://www.typesociety.org/</a></p>
      <p>ChrisL</p>
