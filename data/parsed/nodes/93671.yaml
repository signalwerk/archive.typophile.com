  html: |-
    <p>I’m happy to announce that the CoreHumanistSans family has grown. It now features three new styles: Italic, Light Italic and Bold Italic.</p>
    <p>Due to requests from users the existing three styles have also been updated. They now contain a second set of tabular lining numerals that are equally high as capitals, and a more conforming variant of the euro sign.</p>
    <p>You can check out all styles at FontSpring now.<br>
    <a href="http://www.fontspring.com/fonts/fonts-by-alex/corehumanistsans" title="http://www.fontspring.com/fonts/fonts-by-alex/corehumanistsans">http://www.fontspring.com/fonts/fonts-by-alex/corehumanistsans</a></p>
    <p>An updated type specimen can be viewed here:<br>
    <a href="http://www.fontsbyalex.com/images2/CoreHumanistSans_specimen.pdf" title="http://www.fontsbyalex.com/images2/CoreHumanistSans_specimen.pdf">http://www.fontsbyalex.com/images2/CoreHumanistSans_specimen.pdf</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CHS2_4496.jpg"></div><p></p>
