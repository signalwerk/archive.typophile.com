    html: <p>If you have a Windows machine, you can run the fonts through Microsoft's free <a href="http://www.microsoft.com/typography/developers/volt/default.htm">VOLT</a> tool. This is a program for adding OpenType Layout features to a font, but it also rewrites cmap tables, so you can use it to map glyphs to non-BMP characters. However, you have to use surrogate pair values, not 32-bit scalar values, so <a href="http://trigeminal.com/16to32AndBack.asp">this convertor</a> will be useful.</p>
