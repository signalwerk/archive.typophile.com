    html: <p>You can do non-BMP Unicodes in FontLab. You just have to give the glyphs names in the format "u10412" etc. You can't see the non-BMP Unicode correctly in FontLab, but it should work in the exported font. <br> <br>Note that the title of your post is a little off; UTF-16 is simply one of the ways of representing Unicode (and requires two code points to represent a non-BMP code). From a font perspective, you don't use two code points to represent a non-BMP Unicode, but instead use a 32-bit cmap (UTF-32). The font itself will actually have both a 16-bit cmap and a 32-bit cmap. <br> <br>Cheers, <br> <br>T</p>
