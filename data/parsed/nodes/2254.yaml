  html: "<p>Anyone know how to make a utf-16 font without buying the $2000 Asia Font Studio? I'm doing a <a href=\"http://en.wikipedia.org/wiki/Deseret_alphabet\">Deseret Alphabet</a> font (Unicode 10400-1044F) complete with an OSX keyboard layout for a research project. I've played around a little bit with Apple's command line font tools, dumping out xml, editing, then reincorporating, but it always chokes when I try to change the unicode hex values to anything higher than 8 bit. Letterror's TTX has the same problem. (I even downloaded and applied their patch--it still chokes with a long integer error)  Anyone have any ideas? <br> <br>Point of interest: OSX comes with a Deseret Alphabet font included--who knew? Hint: it's in the Symbols font. It's very ugly, but cool that it's there. I just need to figure out how to reencode a utf-8 font into a utf-16...</p>"
  html_clean: "<p>Anyone know how to make a utf-16 font without buying the $2000 Asia Font Studio? I'm doing a <a href=\"http://en.wikipedia.org/wiki/Deseret_alphabet\" class=\"link-external\">Deseret Alphabet</a> font (Unicode 10400-1044F) complete with an OSX keyboard layout for a research project. I've played around a little bit with Apple's command line font tools, dumping out xml, editing, then reincorporating, but it always chokes when I try to change the unicode hex values to anything higher than 8 bit. Letterror's TTX has the same problem. (I even downloaded and applied their patch--it still chokes with a long integer error)  Anyone have any ideas? <br> <br>Point of interest: OSX comes with a Deseret Alphabet font included--who knew? Hint: it's in the Symbols font. It's very ugly, but cool that it's there. I just need to figure out how to reencode a utf-8 font into a utf-16...</p>"
