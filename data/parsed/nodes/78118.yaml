      <p>Are you absolutely certain that you’re using a /degree/ symbol there? It looks to me like it could possibly be the /ringaccent/ (as in å) — based on the not-really-circular shape and the wide fitting.</p>
      <p>Degree symbol (°) = shift-option-8 (on Mac)<br>
      Ringaccent (˚) = option-k (on Mac)</p>
      <p>(It looks to me like you typed the /ringaccent/ character in your post also. And the “02DA” that appears in the sIFR thread title is unicode for the ring accent.)</p>
      <p>If I’m right, see if changing it to a proper degree symbol doesn’t improve the spacing between numbers, symbol, and units abbreviation. The caps might look less distracting when they aren’t hanging out there on their own.</p>
