    <p>I'm working on a cookbook just now – I don't know if anyone on here has experience of setting the ˚C and ˚F characters? I'm using old style numerals/small caps etc and I think the uppercase C &amp; F look harsh but I'm not sure that small caps is correct either.</p>
    <p>Any ideas?</p>
    <p>Thanks</p>
