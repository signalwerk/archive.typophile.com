    html: |-
      <p>As Ben says, the slash is confusing.<br>
      Even with the correct degree character, "C/350" will still look like a semantic unit.<br>
      Try putting some space either side of the slash.<br>
      Or this:<br>
      180°C (350°F)  Gas 4<br>
      or<br>
      180°C, 350°F, Gas 4</p>
