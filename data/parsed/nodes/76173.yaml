    <p>Hello everyone,</p>
    <p>I am addressing this question to the forum because I am considering joining a specialisation course on type design. The first course of this characteristics ever done in Spain. I have always been passionate about typography, and I have already done short courses on calligraphy, font design and that kind of stuff.<br>
    With all due respect to every fantastic font designer around the world, I am rather concerned about the need of new fonts. From my point of view, there ir a huge range of good fonts in every category.<br>
    What do you think?</p>
    <p>Have a nice day!</p>
    <p>Yago</p>
