    html: <p>New typefaces are driven by changes in technology and culture. These changes are mitigated by the requirement of social continuity wherein each social environment has its own boundaries of allowable variance. As long as there is change in technology and culture, and until there is a universal, monolithic social environment, there will be new typefaces.</p>
