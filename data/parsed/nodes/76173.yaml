    html: |-
      <p>Here are my thoughts on the subject. let me know if I'm wrong. Whether you like it or not, I think there will always be an element of fashion in any type of design. Just as the common idea of how someone should look has changed over time, the idea of what type should look like changes. Both of these examples change over a relative long period of time, whereas for example the fashion in clothing changes much faster. Because the fashion for type changes slower than for clothing, you might argue that fewer typefaces per timespan are needed than clothing, which, I guess, is the case. Instead of saying that the fashion in type takes longer to change, you might also say that it just changes less in the same timespan. The old versions of Caslon look out of balance to me, while William's Clason is IMO adapted to the present day fashion. Although these changes might not be noticable in a year, they are there. This means that there will never be a limit to new typefaces. Apart from the above there is also the issue of changing technolgies and the countless different situations in which type is needed. These situations also include the different kind of looks brands want to have for their typefaces.</p>
      <p>Hope this helps convincing you. Don't stop designing type!</p>
