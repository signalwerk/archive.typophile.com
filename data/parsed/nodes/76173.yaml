      <p>Does the world need new kinds of nails? The nail was old technology in Biblical times, but there are still people who make their living by designing new kinds of nails and nail delivery systems. </p>
      <p>A shirt is a shirt, but every year clothing manufacturers come out with new shirt designs, and for some reason people go out and buy them, not just because their old ones are worn out but also because the new ones are different from last year's shirts.</p>
      <p>So, do we need new font designs? Mostly not, but because of technological changes, every now and then we actually do.</p>
      <p>Can we use new type designs? Sure, why not.</p>
