    votes: null
    html: <p>I'm a compositor and I just got a new journal, which has been set in Quadraat for years. The press I work for cannot use Quadraat legally and I have been asked to find something new, something that will come pretty close to matching, since there will be no new design. This is something I rarely do in my job and I'm finding it difficult. So, when I say similar, I guess I do mean stroke and letterforms, and possibly especially the way that Quadraat italic looks. Sorry, I know I'm out of my element here!</p>
