    html: <p>When you say ‘similar’, what in particular would you want to be like Quadraat? I think of stroke and letterforms as making a font similar, but are there particular letters that you like in Quadraat? How close does it have to be? <br><br>I don’t think a list of fonts by the same designer is going to be very much help, because usually a designer explores diﬀerent styles in diﬀerent fonts. <br><br>If we had some idea what it is that you like most in Quadraat, maybe it would be easier to make&nbsp;suggestions.</p>
