    date_raw: 16 January 2005 - 9:28am
    votes: null
    html: <p>A lot of the look and feel of Quadraat has to to with it’s designers’ views on type production (now and in the past).  <br>Fred Smeijers has produced a wonderful little book (Counterpunch) about this — you may want to check it out. It will make quite clear why Quadraat is a unique typeface. And why it’s gonna be hard to ﬁnd similar typefaces. <br>(I’m biased, I know. I’ve used Quadraat for a pet project, some time ago, and am completely smitten with&nbsp;it).</p>
