      <p>Love this Frankenfont!<br>
      The S and C with "smooth as butter" swoosh terminals were previously used by the publisher to spell the author's name in a very different font.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/crimson_5376.jpg"></div><br>
      The cover designer has a real post modern flair for font style fusion.<br>
      Don<p></p>
