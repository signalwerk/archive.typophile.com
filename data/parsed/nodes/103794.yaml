      <p>The swoosh terminals are a rip from the "smooth as butter" fonts such as <a href="http://www.identifont.com/list?3+FF%20Tartine%20Script%20Bold+0+27MD+1+EI4+2+2B0Z+2+2GBG+4+IID+4+EI8+4+325F+7+1WQ2+7+HI0+8+2P02+8+MU6+8+MRZ+8+72R+8+DV6+8+2OV1+8+2XE7+8+1ZO9+8+CPQ+8+2P33+8+2Y6H+8+3259+10+O8M+10+2Z4K+10+LUE+10+5Z5+10+LUG+10+7IR+10+MUB+10+27IC+10+2HB+10">Tartine Script</a>.<br>
      This is a true Frankenfont!<br>
      Don</p>
