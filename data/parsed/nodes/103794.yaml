  html: <p>Please help us identify this font used on 80s romance novel. We are looking for the font used for "Shirley Conran" and "Savages" Thank you!!</p><div class="imageWrap"><img src="http://typophile.com/files/savages conran_6224.jpg"></div><p></p>
