      <p>@aluminum<br>
      EOT is not a DRM format anymore than the JavaScript file which typeface.js or Cufon produces is DRM. Neither one will install as a font file in the operating system. I admit that has a "DRM effect" but in this case it really depends on your biases and point of view.<br>
      Everything has its advantages and disadvantages.<br>
      First, EOT is compressed. That's a plus for me right there.<br>
      I believe TTF/OTF files can be gzipped but that involves another step and might not be available unless you run your own server.<br>
      Next, if you're directly subsetting TTF to TTF and the name of the font is kept the same it's pretty easy to get confused and end up with some mighty strange looking web pages. Dealing with six different variations of Minion, all OTF files, is not my idea of a good time.<br>
      Also, tying the file, as EOT does, to a domain name (or a drive letter for local use) has advantages when you are subsetting, sometimes glyph-by-glyph, for web pages with very specific requirements. The WEFT tool auomatically adds numbers to the file names, and it makes it that much harder for me to shoot myself in the foot by applying the wrong font file to the wrong site or the wrong page.<br>
      It's fine to own guns, but safeties and trigger-locks are necessary accoutrements to them, I think.<br>
      But all this nonsense over font-file formats for the web and IP issues have gone on too long.<br>
      Is the web development community going to wait ten years for the W3C to get off its butt, come up with a format, have the browser makers implement, and then wait out the time it takes for that feature to propogate out to the majority of Internet users?</p>
