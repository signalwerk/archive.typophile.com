      <p>If your description is accurate and first-hand, it's pretty much what I surmised. There's at least one other company called TrueFontFamily using a similar system that also uses a Javascript insert. But they generate bitmaps from TTF and OTF. In that case, the TTF is being referenced piecemeal as the bitmaps are created. There is never any access to the entire, installable TTF or OTF. Hence, no licensing problems. (Or, at least, far less licensing problems. After all, what's being done is what gets done in Photoshop every minute of every day - only it's being generated server-side on the fly.)</p>
      <p>A system which depends upon JavaScript to generate @font-face rules does nothing to protect the TTF or OTF files. No matter how well obfuscated. Cracking it and requesting the entire font file is trivial.<br>
      It will also add overhead to the loading of the page. Especially if it's heavily obfuscated.<br>
      I cannot imagine in my wildest dreams that Ascender/Microsoft or Adobe or Monotype would acquiesce to such a licensing arrangement.<br>
      Plus, my understanding is that FireFox enforces a same-domain restriction on font files. I don't know about IE and EOT files.<br>
      I haven't done any research or testing to see if that's true but I will do so in the next day or two. And if true, I don't see how a system that pulls the font file from a different domain can work.<br>
      Thanks for the info.</p>
      <p>Rich</p>
