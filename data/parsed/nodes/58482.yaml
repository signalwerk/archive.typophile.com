      <p>@Ralf, et al<br>
      Seems like the pros, cons, ups and downs of a font service like this have been well thought out and we are going around in circles.<br>
      IMHO - I'm always in favor of experimentation, but I can't see this gaining any traction in the marketplace. It isn't any kind of a long-term solution.<br>
      From the user's perspective, there are too many negatives. And they are BIG negatives.</p>
      <p>The problem of font-linking will be solved satisfactorily when FireFox, Safari, Chrome, Opera, and IE support linking to 1) both TTF/OTF files and EOT (or an EOT equivalent yet to be decided upon) or 2) just EOT or an equivalent uninstallable file format.<br>
      Then, font-linking can really take off without legal hassles.</p>
      <p>However, there shouldn't be any illusions. Once those versions of FF, Safari, etc... that do support linking to TTF/OTF reach a kind of "critical mass", many web authors will link to font files whether EULAs say they can or not.</p>
