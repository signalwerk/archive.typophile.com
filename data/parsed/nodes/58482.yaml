      <p>Not yet, but as soon as this kind of implementation would become a common way of using webfonts, someone would build a tool that automates the retrieval of the original fonts. This could be as simple as a website (or app), where you enter an URL and get a package of all the fonts used on this website with the base64 encoding removed. </p>
      <p><cite>Very large. Came to about 133 kb, a substantial bit</cite></p>
      <p>Wow, that's a lot. TrueType? CFF? Subsetting?</p>
      <p>I just tried it with our Graublau Sans Web package. One original OpenType file (CFF) has 44 KB (with the full character set including CE, Greek, Cyrillic ...)<br>
      As Base64 it's 56 KB, but with GZIP compression (which all those browsers supporting TT/OT linking should handle) it has only 36 KB! Which could be reduced even further with subsetting.</p>
