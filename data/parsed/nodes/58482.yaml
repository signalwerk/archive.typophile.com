    html: |-
      <p>Typically, CFF OpenType fonts have a ".otf" extension. All of Adobe's retail/end-user fonts are of this form *except* the 12 WebType fonts.</p>
      <p>On Windows, for a TTF (TrueType) font, the presence of a digital signature (of all the silly things) causes an "O" icon instead of the usual "TT" icon.</p>
      <p>Any file can be run through a compression program, of course. OpenType CFF is pretty compact as far as the outlines goes, and doesn't easily compact further... unless it has really extensive OpenType layout tables.</p>
      <p>The optional MicroType compression in EOT uses subsetting plus various TT-specific optimizations. It can achieve slightly better results than straight subsetting plus ZIP compression, say 40% instead of 30% or something like that, as I recall. It won't do so much for OpenType CFF, because that format is already quite compact.</p>
      <p>Cheers,</p>
      <p>T</p>
