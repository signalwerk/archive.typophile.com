    html: |-
      <p>@epsilicon<br>
      I disagree with you as far as typeface.js and the more popular Cufon text-replacement technique.<br>
      In both cases the TTF or OTF is almost always sub-setted, reducing its desirability as something to download and re-use. (In fact, such sub-setting could be requested as a licensing requirement.)<br>
      But far more importantly, the JavaScript data is not easily reconstructed into a usable, working font file. And that data, in the case of Cufon at least, is almost always incomplete because the browser engine doesn't need every point to adequately render the glyph. And skipping points creates a smaller file for download.</p>
      <p>IMHO - font makers have little to fear from this technique.</p>
      <p>Just my 2 cents on the subject.</p>
