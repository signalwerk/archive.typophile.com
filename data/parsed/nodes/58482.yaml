    <p>Well, given our <a href="http://typophile.com/node/57934" title="Typophile" rel="nofollow">recent discussion of using fonts on the web,</a> I thought this was particularly relevant. It appears that Jason Santa Maria is working with a company called Small Batch, a company that, in conjunction with unnamed foundries, will have a storehouse of fonts one can use online in a protected manner.</p>
    <p>Apparently it will work via a javascript call indicating what font one wants to use and assumably, it will allow direct usage of some sort for select-ability and without image replacement, but that is yet to be seen. I'm a little cautious due to the usage of javascript to make it happen, given than if one's internet is not as speedy, there may be a flicker of some sort as the fonts are replaced, but that is  speculation given that the service hasn't launched yet!</p>
    <p><a href="http://blog.typekit.com/2009/05/27/introducing-typekit/" title="Typekit Post" rel="nofollow">Check out the entire post about Typekit</a></p>
