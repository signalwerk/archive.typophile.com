      <p>@thomas<br>
      Thanks. That was succinct and I, newbie, understood every word.<br>
      My focus is on screen reading and fonts for that purpose, especially within browsers - the browser having become the universal client. (Like the knife and fork, by now, IE is probably one of the most-used tools in human history.)<br>
      The sample of Typekit that I analyzed fed an EOT file to IE and fed a base64 encoded string to FireFox. (Very large. Came to about 133 kb, a substantial bit (no pun) of page load time.)<br>
      In order to take the font for re-use, I'd have to reconstruct it from either the EOT or the base64 string.<br>
      The same, incidentally, holds true for the JavaScript text-replacement product Cufón, which converts the points into a format readable by the browser's script engine.<br>
      IMHO - none of these schemes enables easy, drive-by downloading of an instantly installable font-file.<br>
      Plus, once I've reconstructed the data into a TTF/OTF file - which will require a tool of some kind - I then have to trust that it's quality hasn't been degraded.<br>
      Cufón developer Simo Kunnen explains it well on this thread, <a href="http://groups.google.com/group/cufon/browse_thread/thread/0bb96ddb30bc0064#" rel="nofollow">Font Security Issues</a>, from Cufón's Google group.<br>
      I keep having a vision of 60's comedian Jonathan Winters doing his "Grandma" character saying, "Don't touch that. You don't know where that's been!"<br>
      And, truly, I don't. I don't know if it's missing glyphs, or who knows what else.<br>
      And what holds true for me holds true for other developers as well. As long as the terms are conscionable, I'd rather pay for what I can trust from a company I can hold accountable.<br>
      Bottom line: I think the fear of unlicensed distribution running rampant is overblown. It wouldn't be if Microsoft wasn't holding the line, but they are.</p>
