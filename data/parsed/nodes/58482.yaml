      <p>&gt; <em>Any file can be run through a compression program, of course.</em></p>
      <p>Out of pure curiosity I just tried compressing a .ttf and .otf (Effra and Etelka respectively). TTF size was 92K, OTF - 59K. Interestingly enough both compressed down to about the same size:</p>
      <p>ZIP -&gt; 37-39K<br>
      LZMA -&gt; 32-35K<br>
      PAQ8 -&gt; 25-27K</p>
      <p>Basically it means that there's still a lot of potential for compression even if the font file is already compressed natively.</p>
