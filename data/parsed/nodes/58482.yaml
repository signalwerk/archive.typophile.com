      <p>Sorry, I've been kind of busy in the past week.</p>
      <p>As usual, Christopher knows his stuff (no surprise, he started at Adobe way back around August 1997). OpenType CFF is maximally compressed when you use subroutinization, and not without it. How much additional compression that adds is dependent on the outlines in the font. Sorry that I forgot to mention that... pretty much all Adobe's fonts use subroutinization, and I turn it on in my FontLab prefs and forget about it.</p>
      <p>The main part of the font which is not as compact as it reasonably could be, in OpenType CFF, is the layout tables. The more extensive the OT layout in the font, the more you'd imagine that either going to EOT or doing ZIP compression might make things a bit smaller.</p>
      <p>On the protection side.... No scheme that relies on publicly available specs (including EOT) is going to be all *that* hard to crack. It's just a question of what proportion of users are deterred by the barriers put in place, and whether the font vendors are satisfied with that. PDF and SWF are not terribly secure, but are "secure enough" for most font vendors. Mind you, part of that may be because of the lossy embedding of SWF embedding in general, and PDF embedding as typically practiced.</p>
      <p>Cheers,</p>
      <p>T</p>
