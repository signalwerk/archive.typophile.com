    html: <p>Hi phillip, <br> <br>thanx for your tip. The upper version looks nice. Only thing is that I want to keep the vertical openings equally big. That keeps it consistent in style.  <br>You're right that the 'p' and 'r' looked to much the same. I will try it and see if it still fits in the global idea of the font. I need to see it in a textblock. <br> <br>I sold it by the way to Union Fonts. Very soon it will be available online for sale. <br> <br>How are you doing with your fonts. I saw a lot of them in this forum and I really like them. If you ask me, I think you have a good eye for it. Keep it up. <br> <br>Regards, <br>Ren</p>
