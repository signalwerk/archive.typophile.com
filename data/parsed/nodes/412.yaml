  votes: null
  html: <p>Hi.  <br> <br>I see that many nice fonts appearing on this forum and I wanted to post one of my own to see your reaction. <br>It's not meant to be readible at small sizes. I dare people to use it big. Best used for posters, flyers, etc.  <br> <br>I tried to keep the width of the letters the same. The numerals are wider and a little heavier. Therefore they stick out a little bit more. I tried to break the vertical character of the letters a bit by creating some 'thick' areas (a, e). This gives the font also a little rhythem. Otherwise it would be too rigid, not? <br> <br><img src="http://www.typophile.com/forums/messages/29/12031.jpg" alt="Nantua"> <br> <br>I'm finalizing the font but have my problems with the lowercast P and the R. The difference is too small. Perhaps I should cut of the upper right point of the P to make it more round. Then it also sticks out more from the R. Or perhaps the stem of the P should sink under the X-height. <br> <br>Any more suggestions? <br> <br>Ren</p>
  html_clean: <p>Hi.  <br> <br>I see that many nice fonts appearing on this forum and I wanted to post one of my own to see your reaction. <br>It's not meant to be readible at small sizes. I dare people to use it big. Best used for posters, flyers, etc.  <br> <br>I tried to keep the width of the letters the same. The numerals are wider and a little heavier. Therefore they stick out a little bit more. I tried to break the vertical character of the letters a bit by creating some 'thick' areas (a, e). This gives the font also a little rhythem. Otherwise it would be too rigid, not? <br> <br><img src="http://www.typophile.com/forums/messages/29/12031.jpg" alt="Nantua"> <br> <br>I'm finalizing the font but have my problems with the lowercast P and the R. The difference is too small. Perhaps I should cut of the upper right point of the P to make it more round. Then it also sticks out more from the R. Or perhaps the stem of the P should sink under the X-height. <br> <br>Any more suggestions? <br> <br>Ren</p>
