    <p>"To design is to communicate clearly by whatever means you can control or master." –&nbsp;Milton Glaser</p>
    <p>"Art has to move you and design does not, unless it's a good design for a bus." –&nbsp;David Hockney</p>
    <p>"Both optimists and pessimists contribute to our society. The optimist invents the airplane and the pessimist the parachute." –&nbsp;Gil Stern</p>
    <p>"Design is a plan for arranging elements in such a way as best to accomplish a particular purpose."&nbsp;–&nbsp;Charles Eames</p>
    <p>"It's not what you look at that matters, it's what you see." – Henry David Thoreau</p>
    <p>"In art the hand can never execute anything higher than the heart can inspire." –&nbsp;Ralph Waldo Emerson</p>
    <p>"Painting is poetry that is seen rather than felt, and poetry is painting that is felt rather than seen." –&nbsp;Leonardo da Vinci</p>
    <p>"The visual image is a kind of tripwire for the emotions." –&nbsp;Diane Ackerman</p>
    <p>"Designers can create normalcy out of chaos; they can clearly communicate ideas through the organising and manipulating of words and pictures." –&nbsp;Jeffery Veen</p>
    <p>"Design is in everything we make, but it’s also between those things. It's a mix of craft, science, storytelling, propaganda, and philosophy." –&nbsp;Erik Adigard</p>
    <p>"A common mistake that people make when trying to design something completely foolproof is to underestimate the ingenuity of complete fools." –&nbsp;Douglas Adams</p>
    <p>"Life beats down and crushes the soul and art reminds you that you have one." –&nbsp;Stella Adler</p>
    <p>"Design in art, is a recognition of the relation between various things, various elements in the creative flux. You can't invent a design. You recognize it, in the fourth dimension. That is, with your blood and your bones, as well as with your eyes." –&nbsp;D. H. Lawrence</p>
    <p>"Delay always breeds danger; and to protract a great design is often to ruin it." –&nbsp;Miguel de Cervantes</p>
    <p>"There is always a heavy demand for fresh mediocrity. In every generation the least cultivated taste has the largest appetite." –&nbsp;Paul Gauguin</p>
    <p>"Design, in its broadest sense, is the enabler of the digital era - it's a process that creates order out of chaos, that renders technology usable to business. Design means being good, not just looking good." –&nbsp;Clement Mok</p>
