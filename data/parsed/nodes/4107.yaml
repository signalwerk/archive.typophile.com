    html: <p>I think you were right the first time with Peignot. The lower case provides the 'ennn' and the upper case provides the S, which is scaled down to match the size, and then thickened with some stroke addition. Here is what I got using Peignot light. I think Medium would have worked better, but it was all I had. I did some stretching, and flattening, and blocked out the right stem of the last n, and stretched out the apex by using a black triangle. Voila! (almost) [The top image is the original sample] <br><img src="http://www.typophile.com/forums/messages/83/32707.gif" alt="Senna Simulation"></p>
