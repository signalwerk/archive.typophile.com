    <p>Good morning typophiles,</p>
    <p>I’m just asking myself whether it is possible in Fontlab 5 to temporarely use shorter names for some glyphs like “Asmall” or “germandbls” while doing metrics.</p>
    <p>Example: It is fine to kern uppercase and lowercase:</p>
    <p>HHOHHADAHHOHH<br>
    HHOHHAEAHHOHH<br>
    HHOHHAFAHHOHH<br>
    ...</p>
    <p>nnonnadannonn<br>
    nnonnaeannonn<br>
    nnonnafannonn<br>
    ...</p>
    <p>The character of concern can be exchanged very fast.</p>
    <p>But it is almost painful to do so with smallcaps:</p>
    <p>/Hsmall/Hsmall/Osmall/Hsmall/Hsmall/Asmall/Dsmall/Asmall/Hsmall/Hsmall/Osmall/Hsmall/Hsmall<br>
    /Hsmall/Hsmall/Osmall/Hsmall/Hsmall/Asmall/Esmall/Asmall/Hsmall/Hsmall/Osmall/Hsmall/Hsmall<br>
    /Hsmall/Hsmall/Osmall/Hsmall/Hsmall/Asmall/Fsmall/Asmall/Hsmall/Hsmall/Osmall/Hsmall/Hsmall</p>
    <p>To do this job, it would be nice to say: for the time of beeing, when I say “A” i mean “Asmall”, when I say “B” i mean “Bsmall”, etc.</p>
    <p>Is there a way to achieve this, or is there another faster way to to endless spacing and kerning of smallcaps? I’m aware of kerning classes etc. it’s all just about faster program handling...</p>
    <p>Thanks for your help<br>
    Sebastian</p>
