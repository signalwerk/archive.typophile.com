      <p>What I would do is make a new text file with just the “HHOHHADAHHOHH” strings, run a find and replace to replace “H” with “/Hsmall”, “O” with “/Osmall”, etc. and paste this into your original text file with “HHOHHADAHHOHH” and “nnonnadannonn” etc.</p>
      <p> - Lex</p>
