      <p>I don’t know about doing your idea, but you can pre-compose a list of preview strings and then save as a plain text file. This can be imported into the Metrics window by clicking on the “...” button in the lower right corner and then the folder button in the upper right of the Load Text window. </p>
      <p>Once you import your list of preview strings, you can cycle through them quickly using the up and down arrow keys on your keyboard. You can also select a specific preview string from the pop-up menu to the left of the “...” button in the lower right corner of the Metrics window.</p>
      <p>It can take a while to pre-compose your list of preview strings, but once you do it you can use them as often as you like. It’s a time saver in the long run.</p>
