  html: |-
    <p>This is for a software product website. The typeface in question is used for the navigation menu, taglines and section headers. The main body font is Arial. </p>
    <p>After shuffling through a lot of types I have converged to <a class="freelinking-external" href="http://new.myfonts.com/fonts/fontfont/ff-din/medium/">FF Din Medium</a>. It has clean and precise geometrical feel to it, which is exactly what’s needed (the “real-time or ..” header):</p>
    <p></p><div class="imageWrap"><img src="/files/din-1_5154.png"></div>&nbsp;<p></p>
    <p>I was very happy with the result, but then I woke up the next morning and the lowercase L felt wrong. Too playful and distracting, especially in a longer text. So now I made two alternative versions, which I think fix this problem, and I am now stuck deciding between them :)</p>
    <p>First is a pseudo small caps. 16pt R in medium followed by the rest in 12pt bold:</p>
    <p></p><div class="imageWrap"><img src="/files/din-3_3900.png"></div>&nbsp;<p></p>
    <p>Second one simply has the lowercase L straightened up:</p>
    <p></p><div class="imageWrap"><img src="/files/din-2_4956.png"></div>&nbsp;<p></p>
    <p>So .. which one ?</p>
