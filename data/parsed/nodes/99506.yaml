    <p>I'm looking for a webfont similar to Oleo Script but with support for the Polish language:</p>
    <p><a href="http://www.google.com/webfonts/specimen/Oleo+Script" title="http://www.google.com/webfonts/specimen/Oleo+Script">http://www.google.com/webfonts/specimen/Oleo+Script</a></p>
    <p>Also, what do you think would be a good text companion for a font like that?</p>
