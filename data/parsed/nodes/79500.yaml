    <p>Hello,</p>
    <p>I am currently assembling a book for publication, and I am trying to format the titles of each chapter to resemble bold headlines from the 1950s/1960s. Not being a typographer, this is all very new to me, but I do have a firm idea of what I am seeking.</p>
    <p>So what I can glean from a previous conversation is that what was mostly used was a font called "Tempo" in Heavy and Heavy Italic...? However, this is not currently available in a digital form-- only a condensed version...?</p>
    <p>Additionally, I am curious as to what the typical typeface was for the bylines, photo captions and main body of text...?</p>
    <p>From what I've been able to research briefly, it seems that Corona, Excelsior, News Gothic and Franklin Gothic are all possibilities for newspaper body text. Can anyone confirm this? I'm concerned with placing this within the late 1950s-early 1960s, so authenticity is very important. It seems these typefaces were used with Linotype...</p>
    <p>I'd really appreciate any help/suggestions with this.</p>
    <p>Thank you very much!</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/kennedy.jpg" width="560" height="318" alt="">
