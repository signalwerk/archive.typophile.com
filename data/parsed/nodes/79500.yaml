    html: <p>Some newspapers of that period used Bodoni Bold for their headlines - it was more common than the sans-serif typeface in your example. So that, at least, is available. And Corona was indeed the most likely form of body text. Fortunately, Bitstream has a very similar face available - News 705. News 702 is similar to Excelsior, and News 701 to Ionic No. 5, also very common for newspaper body copy, but more so at somewhat earlier dates.</p>
