    <p>I apologize if I’m missing something major, but I’ve spent the night searching Google and this forum and haven’t really felt like I’ve found the information to satisfy my questions.</p>
    <p>First, I’m a design student currently, so I’m working on drinking up as much information as I can now, but I may be drowning — please educate me! I’ve come from a web design background, and now as I learn more about typography, I want to apply that knowledge back to the web by way of embedded fonts.</p>
    <p>I’m really interested by the idea, which technically isn’t provided by many browsers at this point (I can only find Safari and older versions of MS Internet Explorer supporting it. I’m not sure if IE has continued support of embedding) but I’m also concerned with the legality of it. I’ve found many fonts that I’ve found have provisions for embedding in their licenses, but they tend to refer to PDF and Flash embedding. The only typeface I’ve found (that I would use) that specifically mentions embedding on the web in it’s license is <a class="freelinking-external" href="https://web.archive.org/web/20080708213942/http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium">Gentium</a>, which looks like a decent serif, when your choices are between Times New Roman and Georgia.</p>
    <p>Where I get confused is things like <a class="freelinking-external" href="https://web.archive.org/web/20080708213942/https://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFont&amp;code=MYRW10005000">Myriad Web</a> (It looks like that link needs an Adobe account to access) and a few other fonts Adobe sells with a “Web” suffix. I understand that the embedding policy on that font is listed as “Editable,” which is generally pretty open, but I’ve yet to find a definitive answer as to whether that allows web embedding.</p>
    <p>I assume — it does say “web” in it’s name — that web embedding is allowed, but when I assume, I tend to be wrong. So, somebody please educate me on the legalities of embedding.</p>
