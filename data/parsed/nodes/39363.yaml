    <p>I am a graphic design student writing a dissertation on how knowledge of psychology can lead to more effective design and was wondering whether traditional typographers have different feelings towards scientific research than scientists or psychologists working in the field of design.</p>
    <p>I would be really grateful for thoughts, ideas or references</p>
    <p>Feel free to mail me directly at <a href="mailto:mail@tanyaholbrook.com">mail@tanyaholbrook.com</a></p>
