    <p>Hi, All</p>
    <p>I was recently working on a nastaleeq ligature font that has 25000+ ligatures. Asiafont Studio opened the font all fine. But after generating font and opening back again showed a strange behaviour:</p>
    <p>Original, when first opened in AFS4:<br>
    <a href="http://i169.photobucket.com/albums/u218/arifkarim/b211.gif" title="http://i169.photobucket.com/albums/u218/arifkarim/b211.gif">http://i169.photobucket.com/albums/u218/arifkarim/b211.gif</a></p>
    <p>Generated output from AFS4:<br>
    <a href="http://i169.photobucket.com/albums/u218/arifkarim/b212.gif" title="http://i169.photobucket.com/albums/u218/arifkarim/b212.gif">http://i169.photobucket.com/albums/u218/arifkarim/b212.gif</a></p>
    <p>U can clearly see that at a certain point, the glyphs looses their postscript names and start showing as ".notdefine". I also tried generating as .otf. But this format is useless in MSvolt, regaring post script names isuue. </p>
    <p>Strange thing is that AsiaFont Studios own source file format "*.vfb" saves and opens error free. But problems accur everytime after generating ttf from it. I have even tried using TransType 3 to convert .vfb back to ttf but got same results as above. Btw, I am using windows vista home premium 32-bits.</p>
    <p>Any assitance would be appretiated...</p>
    <p>Thnx</p>
