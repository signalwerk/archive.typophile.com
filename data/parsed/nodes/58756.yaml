    html: |-
      <p>It looks like a problem writing the post table of the generated font. I don't know whether there is something you can do in AFS to correct this, e.g. some kind of option setting. I used to have AFS, but have not used it for some years.</p>
      <p>As a work-around, you could use a tool like TTX or OTMaster to build your own post table and add this to the generated font, replacing the incorrect AFS-written table.</p>
