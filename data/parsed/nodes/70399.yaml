  html: |-
    <p>Hey all,</p>
    <p>I've seen this somewhere here before, but I don't think it resolved. Anyone know if a hairline version of Gill Sans has ever been digitized? </p>
    <p>There's a poster that Deitch Project did a few years ago to promote a show called "The Studio of the Street" which had a photo of Jean Michel Basquiat. (See it <a href="http://deitch.com/projects/sub.php?projId=188" rel="nofollow">here</a>.) It featured a beautiful sans that appeared to indeed be Gill Sans Hairline, but I've found no digitized version of this anywhere. </p>
    <p>Anybody know of such a thing?</p>
    <p>Thanks all...!</p>
