    html: <p>I suggest changing "information" to "Contact" (isn't the entire cv information?). Delete using the actual word "Address" and group all of your addresses under the bar, the same with your Education information. Your design makes sense with how you organized your employment, having the position in one column and the responsibilities under the gray bar, but to use that same treatment for contact info and listing your schools doesn't work. Or you could have the bars align with the left column and handle your name in a different manner. Your spacing is inconsistent, compare the white space from the bottom of the gray bar to the base line of "School Address" and the white space from the bottom of the gray bar to the baseline of "Saint Joseph" and same for third bar as well.</p>
