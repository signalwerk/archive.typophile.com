    html: |-
      <p>I would suggest that you use not only an en-dash to separate a range, try a "thin" space (Command-Shift-Option-M in InDesign) instead of a full space.</p>
      <p>I would definitely turn off hyphenation in the paragraphs below "Experience". It might also help eliminate the "orphan" <a href="http://en.wikipedia.org/wiki/Widows_and_orphans" title="http://en.wikipedia.org/wiki/Widows_and_orphans">http://en.wikipedia.org/wiki/Widows_and_orphans</a> in the second paragraph.</p>
      <p>Even though the rule of "never end a sentence with a preposition" is no longer accepted as hard grammar, I find that ending a line break with a preposition, that is, separating the preposition from its object, makes scanning more difficult. Try keeping prepositional phrases together if you can. With a résumé, you want it as scannable as possible. I might even consider (shudder) bulleted lists instead of the compounded sentence with all those semicolons.</p>
    html_clean: |-
