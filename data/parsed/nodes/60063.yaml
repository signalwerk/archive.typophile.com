    <p>Hello all!</p>
    <p>I formatted my CV to Grid. I would like some feedback. I have never done grid before and I feel I have trivialized it far too much. I also fear that I went with form before function, but I will leave that for you to decide.</p>
    <p>Currently, it is at it is. I want to expound on my responsibilities underneath "Experience" because I want to make sure that my potential employer is aware that my tasks weren't vapid; that I actually did things. Also: If any of you are aware of what to properly include in an American CV, and see that I did not include that, please offer those thoughts as well. I am working on an 8.5in x 11in piece of paper, portrait, and am tempted to see if I can keep it one page. </p>
    <p>This was done in InDesign. I used Lucida Fax which I have recently become fond of. It sits nicely. But that is up for debate as well.</p>
    <p>Thoughts?</p>
