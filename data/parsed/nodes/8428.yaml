  html: <p>A MyFonts poster is sure that Scriptorium's <a href="http://www.fontcraft.com/scriptorium/previews/abaddon.jpg" target="_blank"> Abaddon</a> is a version of an earlier typeface which he used to set on typositor. Does anyone know what this was called back then?</p>
