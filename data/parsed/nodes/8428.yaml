    date: 2005-01-04T08:30:00
    date_raw: 4 Jan 2005 — 8:30am
    votes: null
    html: <p>When you say Castcraft might have been the source of your Typositor font, that makes anything possible. Castcraft/Opti never designed any fonts that I have seen -- they are all copies of other designs. I am confident that the information I gave about the typeface is its true origin. What happened to it after that is something only those other players can answer.  <br> <br>The reason I knew that is that I bought that book when it was new, and had always been interested in that typeface. The small notes and publication data contained the information I quoted. When I saw Scriptorium's Abbadon, I knew at once what Dave Nalle had used as his model. (Or at least, what it was based on. Maybe he had access to the same Typositor font that you remember using.) <br> <br>It's a pretty dramatic and distinctive typeface, so I am not doubting you would remember it if you used it. My initial statement was just based on the idea that I knew the source, but I don't know how Typositor fonts were supplied. I have never seen another digital version of the Jay typeface, except the Scriptorium font.</p>
