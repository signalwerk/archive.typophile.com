    html: <p>I think the poster may be mistaken about that. Scriptorium's 'Abaddon' is based on a display typeface  created by Alex Jay for the interior titles for the book "The Dinosaurs" by William Stout, published in 1981 by Bantam Books. The book notes say the typeface was 'inspired in part by letterforms in Alphonse Mucha's classic 1901 Art Nouveau portfolio, <i>Documents Decoratifs</i>'. <br> <br>It does not give a name to the typeface. Dave Nalle does not usually credit the Scriptorium font sources.</p>
    html_clean: <p>I think the poster may be mistaken about that. Scriptorium's 'Abaddon' is based on a display typeface  created by Alex Jay for the interior titles for the book "The Dinosaurs" by William Stout, published in 1981 by Bantam Books. The book notes say the typeface was 'inspired in part by letterforms in Alphonse Mucha's classic 1901 Art Nouveau portfolio, <i>Documents Decoratifs</i>'. <br> <br>It does not give a name to the typeface. Dave Nalle does not usually credit the Scriptorium font sources.</p>
