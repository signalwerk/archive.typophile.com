    html: <p>Thanks very much for that info, Mike. I'll point the <br>Myfonts poster to this thread. <br> <br>Many of Mr. Nalle's early fonts were digitizations <br>of typefaces that can be found in the Solotype <br>Catalog and elsewhere. It always bugged me <br>that he gave new names to those and never <br>credited the originals. <br> <br>Have a great 2005. <br><br></p>
