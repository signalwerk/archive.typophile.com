    html: <p>I am not an expert...though i can say  <br>that the composition of the elements <br>seems disturbing to me.  <br>Esspecially that river the "De" leaves  <br>in the "camara municipal de Coimbra".  <br> <br>The "de" ligature is illegible and would  <br>make more sence as a ligature of "ed". <br> <br>The "M" in "Coimbra" is from a different  <br>font..?(why?) and the "O"-logotype in  <br>the word "Coimbra" just doesn't fit,  <br>esspecially when compined with this  <br>long-tailed "R". <br> <br>In conclusion from the few things I know  <br>for Coimbra (the historical university and the  <br>great tradition of Fado) I think it deserves  <br>an id which carries historical values and this  <br>cannot be achieved with that simple "O" form. <br> <br>ah...and when the "Coimbra" is splited to  <br>COIM....BRA! you cannot avoid thinking about  <br>Eva Herzingova... <br> <br>OK! i think i've been a bad boy today.  <br>there was no purpose to insult anyone,  <br>i just tried to express what i really felt  <br>about the design...which is great comparing  <br>to our sign of Thessaloniki. By the way six  <br>months ago i designed logos for the municipality  <br>and trust me...you don't want to get involved  <br>with those people who take decisions.  <br>They have a charisma to manipulate everything  <br>in order to end up terrible. <br> <br>Good day to everybody!</p>
