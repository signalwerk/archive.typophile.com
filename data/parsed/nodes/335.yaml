  html: <p>The city where I live (Coimbra, Portugal)presented us the new identity and logo last week on a big party with a Michael Nyman show and everything... I intended to present the logo in these phoruns to ask for a typographic expert oppinion (Something on the type is just wrong to me) but now the thing got even more interesting! Someone found a simmilar logo of a company called Quintiles Transnational.. <br> <br>The designer of coimbra's logo says the logo represents a serpent (found on the old coimbra's Blazon). I still don't know why he splitted the Word in to COIM + BRA. <br> <br>The quintiles logo represents a Q, I guess. <br> <br><img src="http://www.typophile.com/forums/messages/29/11635.gif" alt=""> <br> <br>1. I still can't decide if this is plain Coincidence or a bloody ripp-off. What do you typophiles think? <br> <br>2. Can you express the feedback on coimbra's logos? Is it balanced? Is the O logo on the COIMBRA word just placed without any care? And what abou the C</p>
