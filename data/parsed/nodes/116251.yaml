      <p>Cool project. I think Bery Roman does nicely match that façade.</p>
      <p>But: you will need different fonts for the display and the wayfinding. Since Bery is a essentially a Didone, I think the main challenge will be finding a font in that genre that's suitable for wayfinding.</p>
      <p>hhp</p>
