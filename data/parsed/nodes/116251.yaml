  html: |-
    <p>Hello,<br>
    I am in need of some advice. I am working on a project with an architect firm on the renovation of an evangelic building complex in the center of Budapest. On the facade there's going to be a list of the the shops, museums..ect that are housed inside the building. The complex as a whole is getting a logo, which will also appear on the facade, albeit quite subtly, and it will have an internal wayfinding system that will need type as well. There are a long row of shutters that will have quotations on them, for what I already picked out <a href="/wiki/https%3A/%252Fourtype.com/%2523/try/loading/undefined/" class="freelinking" rel="nofollow">Bery roman</a> from Ourtype. The stencil lettering on the shutters and the display type above are quite different in scale, i don't think they can be perceived at the same time so they don't necessarily need to match, but ideally it would be good if they did. </p>
    <p>So, I need to find a typeface that is good for both big display and for the logo and also for the internal wayfinding. Also it need to be something that is reasonable priced and can be brought separately, by weight. I really like Johnston but it doesn't have enough weights for the logo, and its classical propotions don't match Bery's.<br>
    Thanks in advance for any help you can give.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/IMGP8001_5639.jpg"></div><p></p>
