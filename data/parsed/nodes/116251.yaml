      <p>Bery Roman is a Didone, a very high contrast serif. Johnston is very low contrast sans-serif and does not harmonize at all with Bery Roman. If you do want a sans serif you might consider a sans with high degree of stroke contrast, but with letter-forms that are still legible enough for way-finding. Myfonts has over a hundred stressed sans fonts <a href="http://www.myfonts.com/search/tag%3A%22stressed+sans%22/fonts/" title="http://www.myfonts.com/search/tag%3A%22stressed+sans%22/fonts/">http://www.myfonts.com/search/tag%3A%22stressed+sans%22/fonts/</a> that you might want to skim through to see how they feel to you when paired with Bery Roman. Clearly you don't want your choice to look too modern modern, quirky or overused. This counts against fonts such as Optima, Peignot and Parisian. Consider something less distinctive, such as Seaside <a href="http://www.myfonts.com/fonts/andrijtype/seaside/" title="http://www.myfonts.com/fonts/andrijtype/seaside/">http://www.myfonts.com/fonts/andrijtype/seaside/</a> Ocean Sans <a href="http://www.myfonts.com/fonts/mti/ocean-sans-mt/" title="http://www.myfonts.com/fonts/mti/ocean-sans-mt/">http://www.myfonts.com/fonts/mti/ocean-sans-mt/</a> Castle <a href="http://www.myfonts.com/fonts/linotype/castle-lt/" title="http://www.myfonts.com/fonts/linotype/castle-lt/">http://www.myfonts.com/fonts/linotype/castle-lt/</a> or EF Radiant <a href="http://www.myfonts.com/fonts/ef/radiant/" title="http://www.myfonts.com/fonts/ef/radiant/">http://www.myfonts.com/fonts/ef/radiant/</a><br>
      Don</p>
