      <p>Two of my “historical ﬁctions” might be suitable:<br>
      <a href="http://www.myfonts.com/fonts/shinn/bodoni-egyptian-pro/" rel="nofollow">Bodoni Egyptian</a><br>
      <a href="http://www.myfonts.com/fonts/shinn/figgins-sans/" rel="nofollow">Figgins Sans</a></p>
      <p><a href="http://www.myfonts.com/fonts/mti/grotesque-mt/" rel="nofollow">Monotype Grotesque</a> is also worth considering.</p>
      <p>These typefaces reject the smooth mechanical ﬁnish of 20th century modernism, and this, in my opinion, is essential in respecting the ethos of historical architecture—and not setting up a distracting historiographic dialectic between building and typography.</p>
