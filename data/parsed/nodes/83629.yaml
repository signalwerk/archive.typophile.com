  html: |-
    <p>JAE Font (From 1998 and adapted from Transport Typeface with the authorization of UK Department for Transport )<br>
    Traffic System Typefaces at Portugal: Legislated in 1998 (Decreto Regulamentar 22A/1998)<br>
    (J.A.E. – Junta Autónoma das Estradas)</p>
    <p>Uppercase Negative – JAE Type 1a<br>
    Lowercase Negative – JAE Type 1a<br>
    Uppercase Positive – JAE Type 2a<br>
    Lowercase Positive – JAE Type 2a<br>
    Numerary Negative – JAE Type 1<br>
    Numerary Positive – JAE Type 2<br>
    Numerary Negative – JAE Type 3</p>
    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150123172024im_/http://typophile.com/files/Quadro_5033.jpg"></div><p></p>
    <p>Portuguese Traffic Typeface from 1954, 1959, 1994 and 1998.</p>
