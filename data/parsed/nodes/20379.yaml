      <p>&gt; <em>i guess they felt inspired by the Italians?</em></p>
      <p>Dunno who inspired who, but one thing is certain: bi-metal coins have existed in Portugal since 1989, in the form of <a href="http://www.portugalmoedas.com.pt/detalhes.asp?ID=1180" rel="nofollow">100 Escudos coins</a> (100$ was roughly 0,50€). Then later, in 1991, appeared the <a href="http://www.portugalmoedas.com.pt/detalhes.asp?ID=1179" rel="nofollow">200 Escudos coins</a> where the metal combination was reversed.</p>
      <p>&gt; <em>BTW, there must be a better term than “letter format” for that - does anybody know it?</em></p>
      <p>I'd call them <a href="http://en.wikipedia.org/wiki/Armenian_numerals" rel="nofollow">Armenian numerals</a>.</p>
      <p>&gt; <em>Hrant, where is that coin from? What languiage is shown?</em></p>
      <p>Must be Armenian.</p>
