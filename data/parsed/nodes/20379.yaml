    html: |-
      <p><em>It’s interesting that a black coin comes from a country were the landscape is dominated by white most of the year :^) (or that’s just a Photoshop effect?!…)</em></p>
      <p>Actually, neither. The coin is what is known as a <strong>mirror proof</strong>: the fields are polished to a bright, highly reflective finish, while the lettering and figures are frosted. The coin was simply placed on a flatbed scanner, and scanned at 600 dpi: the black fields are, oddly, how the scanner sees itself in the mirror finish.</p>
      <p>BTW, here's the other side of the coin...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/iceland-2_6181.jpg"></div><p></p>
    html_clean: |-
