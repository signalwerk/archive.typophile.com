      <p>Here's a really nicely lettered coin:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Livre_coin_4016.gif"></div><p></p>
      <p>The stuff around the edge is like a cool notan-play of the name*, while the ligated pair next to the guy's cheek indicates the anniversary year in "letter format", where RA=1000 + SHA=500 totalling 1500 years. BTW, there must be a better term than "letter format" for that - does anybody know it? John? I know that some other languages use it too, so hopefully there's a nice[r] term for it.</p>
      <p>* Like check out the two little triangles below the line and the one above it: those are like small extenders that Armenian caps tend to have.</p>
      <p>hhp</p>
