    <p>I have nothing to say, really, except that I can't believe I missed an <a class="freelinking external" href="http://www.spiekermann.com/mten/index.html" rel="nofollow">Erik Spiekermann Lecture at the BPL</a>. I'd checked his blog a bunch of times in the last three months, and actually <cite>been</cite> to the BPL about a week before this, and somehow stayed oblivious of it. </p>
    <p>I don't think I did anything that night either. Depressing. </p>
    <p>Edit: Apparently this is a lecture that happens annually, and it was <a class="freelinking external" href="http://typophile.com/node/44038" rel="nofollow">mentioned right here on Typophile</a>. I have no excuse.</p>
