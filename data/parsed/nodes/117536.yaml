    <p>Looking for a place to stay in DC, preferably from Tuesday the 29th thru Sunday the 3rd. I'm a student, light traveler, and Couchsurfing friendly. My budget's not high, so couchsurfing is preferred, but I might be able to split a hotel room for a few days if necessary.</p>
    <p>Here's my couchsurfing profile, if you'd  more info about me: <a href="https://www.couchsurfing.org/profile.html?id=YJQ60P5">https://www.couchsurfing.org/profile.html?id=YJQ60P5</a></p>
