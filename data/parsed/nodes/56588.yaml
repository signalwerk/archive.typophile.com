      <p>None of them works.<br>
      Sorry.</p>
      <p>What I would do would be plain type “Budghet Printing” in two lines on negative space (for BW version) with tear paper edge. Would be more suitable and original.</p>
      <p>I also think that if you do budget printing your logo should be simple in terms of shapes, type, colours and everything. I’m not saying it should be dull and down to earth trivial. It should be exciting, but budget oriented.</p>
      <p>Think of anything that says to you “Budget” and see if you can work out an idea out of it.</p>
      <p>Your logos may be ok for some other business (but majorly reworked) just not for your company’s business.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
