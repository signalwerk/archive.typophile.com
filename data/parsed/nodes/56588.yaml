    html: |-
      <p>A) I can appreciate what you’re TRYING to do, but it’s not working... too crowded, the “g”s look too stressed like that. I kinda like the fan coming off the B</p>
      <p>B) Too hard to read the BP, sphere makes no sense whatsoever to a printer. Text Boring (though that may be what they wanted)</p>
      <p>C) Nice and clean, but the green color is a little light/weak. Icon is nice, but seems off-center. HATE the stacked version</p>
      <p>D) I think i like this one the best, but i hate the Avant Garde (very hard to be original with since the first LaserWriter Plus). Love the icon over the other three. I dunno, maybe the Avant Garde is conveying the “budget” idea after all... but don’t mix it with another face (like on the right). If you do stick with it, Tighten/fix the kerning/letterspacing - as a logo, it’s gotta be PERFECT. Perhaps run the two words together with the color change.</p>
    html_clean: |-
