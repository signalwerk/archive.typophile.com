    <p>Please tell me what logo you like best and why. If you would make a change to that logo what would it be?</p>
    <p>These logo’s are for a printing Company I work with. They have been around for 30 years and want a logo update. They have 4 employees they do work for designers, the adverage Joe off the street and a few large corporations.</p>
    <p>This printing co’s current logo has the letters BP very large hence my sphere with those letters. I’m really trying to pull them away from something that sounds like a gas station. the others are all built from the thought that they are the people that make a white sheet of paper look good (with ink) Hence, there is paper in the other three logos.</p>
    <p>Please tell me what logo you like best and why. If you would make a change to that logo what would it be?</p>
    <p>Thank you!</p>
