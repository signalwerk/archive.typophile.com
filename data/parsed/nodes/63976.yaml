      <p>I dunno. I work specifically in the area of CJK fonts, and there is plenty of interest. I think it all depends on the person with whom you speak. ;-)</p>
      <p>Perhaps part of the recent interest in such fonts is due to the improved infrastructure to support them, specifically that more applications and text engines are able to correctly handle the line layout and typographic challenges that those scripts pose.</p>
