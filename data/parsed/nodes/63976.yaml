    <p>I’ve been hearing a lot lately about development for Arabic and the Indian market, especially Devanagari. I was able to speak briefly at TypeCon with someone in the industry who is investing in developing Arabic typefaces. I was surprised there seemingly isn’t very much conversation about and very little interest in developing for the CJK (Chinese, Japanese, Korean) market. Piracy combined with the amount of investment required was cited.</p>
    <p>Why is there so much excitement about India and the Middle Eastern market right now? The same disregard for intellectual property is present. Could someone give some additional insight?</p>
    <p>Thank you,<br>
    JDooley</p>
