    html: <p>I see what other folks mean when they talk about the difficulty of good nikud placement with such a wandering baseline. Indeed, it will be hard to make this style work with poetic or biblical hebrew (where nikud matter). On the other hand, I would argue that this is a wonderful informal idea, and, with the possible exception of special composites for the Yiddish composites, nikud might not be so important. <br> <br>Mike, if you work in OpenType, you should be able to set up the vowels (nikud), and then to set up the composite characters so that the overall feel could be quite good. I don't believe that there is a useful way to handle nikud within the confinces of operating system and font prior to OpenType. <br> <br>There is obviously still a lot of work to be done starting with the baseline and sidebearings, but this is a neat start. <br> <br>Sorry to have taken so long to get over from the Hebrew type blog (<a href="https://web.archive.org/web/20140911211412/http://www.ivritype.com/hebrew/" target="_blank">www.ivritype.com/hebrew/</a> ) to take a look.</p>
