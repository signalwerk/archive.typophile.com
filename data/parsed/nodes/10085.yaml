    html: '<p>Hello, Mike. Sorry I have not had much opportunity to contribute to this discussion. It looks much tidier with the baseline regularised, but also a bit less dynamic, as William notes. <br> <br>With regard to nikud, here is an idea for you: keep the forms of bet, kaf, etc. that went below the baseline, but also include the shorter versions. Then you can set up an OpenType contextual alternates feature to subsitute the shorter forms whenever they are followed by a combining nikud (and, obviously, use the short forms in combined letter+nikud presentation form characters). <br> <br>I did something like this for the ayin in my SBL Hebrew typeface: the default form descends below the baseline, but there is also a short version that is automatically substituted when the letter is followed by a mark below: <br><img src="https://web.archive.org/web/20140911211412im_/http://www.typophile.com/forums/messages/29/71087.gif" alt="SBL Hebrew ayin substitution"> <br>Of course, the other challenge for you will be designing nikud that fit the style of the type. For a typeface like this, you should not use the generic circular dots and sticks: try to put some of the character of the letters into the nikud. Also, and this will be tricky to get right, try rotating you nikud just slightly anti-clockwise, so they do not look alienated from the angled base of most of the letters.</p>'
    html_clean: '<p>Hello, Mike. Sorry I have not had much opportunity to contribute to this discussion. It looks much tidier with the baseline regularised, but also a bit less dynamic, as William notes. <br> <br>With regard to nikud, here is an idea for you: keep the forms of bet, kaf, etc. that went below the baseline, but also include the shorter versions. Then you can set up an OpenType contextual alternates feature to subsitute the shorter forms whenever they are followed by a combining nikud (and, obviously, use the short forms in combined letter+nikud presentation form characters). <br> <br>I did something like this for the ayin in my SBL Hebrew typeface: the default form descends below the baseline, but there is also a short version that is automatically substituted when the letter is followed by a mark below: <br><img src="https://web.archive.org/web/20140911211412im_/http://www.typophile.com/forums/messages/29/71087.gif" alt="SBL Hebrew ayin substitution"> <br>Of course, the other challenge for you will be designing nikud that fit the style of the type. For a typeface like this, you should not use the generic circular dots and sticks: try to put some of the character of the letters into the nikud. Also, and this will be tricky to get right, try rotating you nikud just slightly anti-clockwise, so they do not look alienated from the angled base of most of the letters.</p>'
