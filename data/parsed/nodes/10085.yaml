    html: |-
      <p>John,<br>
      Your SBL font is extremely legible with huge nikud. The example of the ayin with and without nikud is intriguing. Thanks for telling me about it. </p>
      <p>Currently my nikud are much smaller so that it is easier to place them under a sloping baseline. In fact, the 'irregular baseline' is not a problem because the top of the nikud is below the lowest part of the baseline. I have dealt with the irregular baseline simply by moving all the nikud down out of the way.</p>
      <p>I have found that making my font more square greatly improves readiblity on the screen at small sizes. Wow, there are so many difficult trade offs! The next version may take a while...</p>
      <p>Mike<br>
      <a href="https://web.archive.org/web/20140911211412/http://mikethompsonpaintings.com/font" title="http://mikethompsonpaintings.com/font">http://mikethompsonpaintings.com/font</a></p>
