    html: <p>Mike, I think your face lost some of its charm in evening up the baseline. I think the problem you are wrestling with is the problem of changing calligraphy or lettering into type. With lettering, the idea is that you can change strokes to suit the neighboring letters, whereas in type you can't.  <br> <br>So in type you can either figure out how to regularize the letters so they work with all the others, or you can go wild with the Open Type stuff. House Industries has done both with lettering, and you might take a look a them to see various ways they have dealt with the problem for latin letters.</p>
