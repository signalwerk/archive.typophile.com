  - id: 64082
    user: 5786
    date: 2005-04-07T06:50:00
    date_raw: 7 Apr 2005 — 6:50am
    votes: null
    html: <p>William, <br>Thank you for your comments. I'll be dealing with the widths and the baseline for the next release. <br> <br>Positioning of niqud and cantillation marks is not a part of my font, it is done by the wordprocessor in this case Word 2002. With Word, the worst examples of the placement of nikud are with the letter caf-sofit where the long descender is on top of the pronunciation marks qamats and the sheva. MicroSoft must have seen this problem because they added composite characters with correct placement. However these are not a part of Unicode, you access them as special characters. I will change my samples to use these characters. <br> <br>Religeous texts with nikud and cantillation may be a poor application of my fonts design as "square" fonts are the most legible. I will be putting an effort into the aesthetic detail of the design for display in large font sizes. <br> <br>Mike</p>
    html_clean: <p>William, <br>Thank you for your comments. I'll be dealing with the widths and the baseline for the next release. <br> <br>Positioning of niqud and cantillation marks is not a part of my font, it is done by the wordprocessor in this case Word 2002. With Word, the worst examples of the placement of nikud are with the letter caf-sofit where the long descender is on top of the pronunciation marks qamats and the sheva. MicroSoft must have seen this problem because they added composite characters with correct placement. However these are not a part of Unicode, you access them as special characters. I will change my samples to use these characters. <br> <br>Religeous texts with nikud and cantillation may be a poor application of my fonts design as "square" fonts are the most legible. I will be putting an effort into the aesthetic detail of the design for display in large font sizes. <br> <br>Mike</p>
