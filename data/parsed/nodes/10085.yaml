    html: <p>Hrant,  <br>Here we are. I created an jpg image of two pangrams. (They use every letter of the Hebrew AlephBet, I believe, although I haven't checked.) I created them as vector text using Paint Shop Pro. How THAT relates to True Type I really don't know. <br> <br><a href="https://web.archive.org/web/20140911211412/http://mikethompsonpaintings.com/font/pangram.jpg" target="_blank">http://mikethompsonpaintings.com/font/pangram.jpg</a> <br> <br>When doing calligraphy, I am always copying from a trial layout, so I see the shape of each word before writing it. I imagine how to make the word fit together. A key element is the long lower bar (maybe a kind of swash) of letters such as bet, caf, peh etc. Such a swash can pass under the bottom of the following letter (on its right). <br>If this font is set or written tightly, many letters would overlap but not touch. The top left of some letters can fit above the top right of the following letter. Also the bottom left of some letters can fit under the bottom right of the following letter.  <br> <br>Certainly this needs tidying up. I need to change many letters slightly. Where should I start? Which are the most offensive letters? <br> <br>Mike</p>
