    html: <p>My Hebrew isn't very good, so take this with a grain of salt. To me, the style can work, but it is too irregular in current execution. For example, the chet is much wider than the hey. The chaf looks wider than both, etc.  <br> <br>Another thing is that the 'baseline' is very irregular. I know that the top is more important for alignment in Hebrew, but still you have an awful lot of variation. Also I see on your web site the sample with nikud, and they fit poorly. I don't see how this style can work with nikud, if you have the varied baseline.</p>
