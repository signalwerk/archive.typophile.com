    html: <p>I have been using Hadasa MFO for the Hebrew quotations in my new guide to Pirkei Avot. MasterFonts claims that this font and a select number of their other open type fonts place nikud perfectly. From what I can see, they are right. (I don't think Word will use the open type features; InDesign ME does.) So this kind of thing can be done in open type. Also John Hudson's SBL Hebrew (free download) also I believe places the nikud and also cantillation marks very well.  <br> <br>I don't think your design with the two-level base line will permit good placement of nikud, but this may not be a problem for you, if you intend it for Israeli use.</p>
