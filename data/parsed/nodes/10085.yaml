    html: <p>Mike, your latest post does work in getting through the fonts. Here the two-level 'baseline' does look more regular, but still I think there is a problem with widths, spacing and nikud. On the widths you need some feedback from those who regularly read Hebrew. It does have merit, and is worth perfecting, I think.</p>
