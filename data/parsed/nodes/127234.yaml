      <p>Google also provides hosting services for the Google fonts online, for free. And the quality and performance of their infrastructure is astounding.<br>
      The higher-quality suppliers sometimes have higher-quality fonts than Google (for various senses of “quality”). But that said, Google does keep upgrading their fonts and the gap has been gradually narrowing.</p>
