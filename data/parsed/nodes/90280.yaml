    <p>In FontLab Studio 5.0.4 I'm opening a Type1 font that was generated by Fontographer 3.5 on the PC. I'll eventually be adding small caps, Greek and some miscellaneous other things. I got the very basics working and decided to test things before adding in my small caps, Greek, etc. and exported as an OTF / PS. </p>
    <p>In InDesign I noticed that text in a frame whose first line was set to "Ascent" was shifting up a bit from where it set in the Type1 font.</p>
    <p>Looking back at Fontographer the Ascent value was 714. Given that Fontlab was showing the "Ascender" to be 685 I changed it to 714 figuring that would fix things. Hoever, it did not.</p>
    <p>When I open the OTF I just generated from Studio with "Ascender" set to 714, the "Ascender" value is back to 685. DTL Typemaster Light shows the same thing, no 714.</p>
    <p>I've read through many a post regarding these things but it simply seem like Studio isn't outputting the correct numbers. Is there an open or generate option I'm missing? Shouldn't the Ascender value be what I typed into that field?</p>
    <p>Thanks for any help ,<br>
    Ken</p>
