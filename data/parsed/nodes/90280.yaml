      <p>Under the "Most important font dimensions" tab, did you check the "Copy values to TrueType" metrics box?</p>
      <p>Where is this. Walk me through it, as if I were a child, unfamiliar with FL. (P.s. I use a Windows machine...)</p>
      <p>I have to assume that you have FL, and are able to open a font file (pfb, ttf, otf, or vfb) and view it.</p>
      <p>From the basic font display (the one that shows all the glyphs in the font), click on the little box at the upper left hand corner of that display. That brings up FONT INFO.</p>
      <p>Expand 'Metrics and Dimensions' (click on the plus sign next to the words). Right under the label "Caps Height" is a box labeled "Copy values to TrueType metrics:.</p>
      <p>  - Herb</p>
