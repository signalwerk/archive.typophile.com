  html: |-
    <p>My "ignore substition" OpenType coding (for determining, for example, whether a letter is the first in a word so that it can be changed out for an .init swash form) works like a charm in InDesign, but it does not in Apple apps like TextEdit and Pages. In those applications, nothing is "ignored" so that every letter of every word becomes the .init form.</p>
    <p>Is this a limitation of those applications, or am I doing something wrong? If the former, what's the best option for giving the user an easy way to set up context-specific swash forms in those apps?</p>
