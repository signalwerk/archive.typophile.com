    html: |-
      <p>The fact that it works in Text Edit (in 10.6) means there is OS support and that Pages and other Cocoa apps should be able to support contextual subs correctly--just not many of them do yet.</p>
      <p>But, yeah, I think most people interested in using OT fonts with advanced layout features will tend to use them with Adobe CS or Quark 7 or later. It's very frustrating that support for stuff like that beyond pro graphics apps is still so sketchy.</p>
      <p><em>do those sell?</em></p>
      <p>I don't sell them separately. I include them with the full OT version (no extra charge).</p>
