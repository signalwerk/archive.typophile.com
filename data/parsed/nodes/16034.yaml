    votes: null
    html: |-
      <p>Hello Sebsan,</p>
      <p>Yes you can apply if you don't have a background in type design.  The participants have a  broad range of backgrounds and interests. Not so specifically type design, but typographic design and a few with no formal design background at all. There seems to be a big emphasis on content and giving appropriate form to the content – whether it be self generated or given</p>
      <p>At the moment my year are working on a 'reader' project which will eventuate in a book on the subject of biography </p>
      <p>Also the WT is open to commision work, and every so often something comes in. For example a student here has just completed a series of stamps for the TPG Post. As for the review process, it is quite informal here, but we have an evaluation in december – so then I can tell you more!</p>
      <p>Hope this helps,<br>
      David</p>
