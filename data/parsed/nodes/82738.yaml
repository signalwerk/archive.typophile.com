    html: |-
      <p>I'm a beginner too just so you know. </p>
      <p>This may just be my taste. But I find when designing anything, I tend to avoid using gradients whenever possible.</p>
      <p>Especially with logotypes or typography, because I find that legibility is very important.</p>
      <p>They're just too hard to replicate in mass production and unless they're done well, they can look cheesy.</p>
      <p>Not to say that the few letters I saw were cheesy. But if the entire font uses that gradation, it will seem cluttered and illegible.</p>
      <p>Anyways, the idea is very creative and I wish you all the best!</p>
      <p>Good luck, I'd love to see you make it work.</p>
