      <p>A way to intensify a color (colour) is to print twice, eg put each sheet thru the press twice. Or use a clear varnish for the second run.</p>
      <p>Something else: the Pantone Matching System has its limitations, there are others that may have ‘better’ reds, like the Japanese Toyo or the German HKS. InDesign has colour libraries for these. Your printer may have to special order a can of ink in case you want something outside the PMS.</p>
