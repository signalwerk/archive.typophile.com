      <div class="comment-spam-body"><p>If you are wanting a 2-color traditional offset printing job then using a CMYK mix for your Red won't work because then, using the numbers you chose, it becomes a 3-color job ( [100m+100y+k) so your printer is actually saving you some money (and headaches for him).</p>
      <p>The latest Pantone books have quite a number of new colors in them in the higher number ranges so be sure your printer has a recent Pantone book, preferably not more than four years old.</p>
      <p>The color of the paper stock you are using will also affect the end result so you have to take that into account.</p>
      <p>If you went strictly digital instead of offset, you might have better luck getting the exact red using CMYK, but at the expense of quality. </p>
      <p>You will never be able to match the full spectrum of RGB using CMYK so don't expect to; reasonably close is all you can get. In 2-color traditional offset, Pantone is the only way to go. Also, but at extra expense, you can ask your printer to do a custom ink mix.</p>
      </div>
