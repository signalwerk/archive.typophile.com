    html: |-
      <p>The red that I like might not be the one you'd choose. If you've seen reds you like, take samples and find the reds in the swatch book that match.</p>
      <p>&gt; Solid Uncoated Pantone Library<br>
      &gt; ...not intense enough</p>
      <p>If you're looking an uncoated swatches, I presume you're using uncoated paper. Uncoated paper will soak up the ink and make the colors less vivid. A coated stock —&nbsp;like most magazines are printed on —&nbsp;will produce more vivid results (although a coated stock isn't appropriate for every job).</p>
      <p>The same ink color can look different on coated or uncoated stock, so use the appropriate coated or uncoated section of the Pantone swatch book.</p>
      <p>&gt; When I make a swatch in indesign with those values,<br>
      &gt; the resulting color is quite different</p>
      <p>Don't go by what it looks like on a computer monitor. Use the printed color swatches. </p>
      <p>This might be overkill, but if you're really concerned about getting the exact color you want, ask the printer for an ink drawdown. They will take some of the actual ink you've picked and spread it on the paper stock you've chosen. There might be an extra charge for this, but it is the best way to see how it'll actually look before printing. A quick printer might say "huh?", but a full-service professional print shop should be glad to do it.</p>
