    <p>Hello all,</p>
    <p>I've designed a book in two colors - red and black, mostly text, but some decorative graphics in red. This is my first book in two colors. I worked using CMYK specs, and set the red to 0,100,100,0. However, my printer needs the colors to be selected from the Solid Uncoated Pantone Library. I have had difficulty find the right red to use.</p>
    <p>My printer has recommended Pantone 185, but I find this is not intense enough: a bit dull, or faint. Moving up just slightly, to 186 and higher, the colors become too brown.</p>
    <p>I have seen books published in red and black ink (liturgical books, predominantly), where the red is bright, clear, and intense. Can someone recommend a good pantone number? Thank you.</p>
    <p>Herman</p>
