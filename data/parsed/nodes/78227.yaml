    html: |-
      <p>Christer, </p>
      <p>also, in your variant, the lines don't optically align. The left edge of the aperture (top opening) and of the descending part don't align in your example -- the left edge of the descending part looks too much off to the left. If you look at other letters such as x, they are often drawn in a similar way (there is no geometric alignment but instead, an optical one). The problem of two intersecting diagonal bars is that, especially when the angle is minimal, the optical illusion makes them appear as if the edges wouldn't align.</p>
