    <p>Hello, I'm new :)</p>
    <p>I'm making a logo, and Calibri turned out to be the best font available. I noticed the little characteristic of the lower case "y". I've decided to remove it, so the typo doesn't compete with the symbol I'm making.</p>
    <p>It's always good to know the reasons for the rules you're breaking, though. So I'm wondering if there is anything I should know.</p>
