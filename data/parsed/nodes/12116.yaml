    <p>Joshua Lurie-Terrell works by day as a graphic designer for the California State Legislature. In the evenings, he helps <a href="/wiki/Stephen%20Coles" class="freelinking" rel="nofollow">Stephen Coles</a> edit <a href="/wiki/Typographica" class="freelinking" rel="nofollow">Typographica</a>. He runs <a href="http://www.hewnandhammered.com" rel="nofollow">Hewn &amp; Hammered</a> singlehandedly.</p>
    <p>He has a <a href="/wiki/Vandercook" class="freelinking" rel="nofollow">Vandercook</a> in his garage and offers its use to any typographer in the Sacramento area.</p>
    <p>Ladies love him.</p>
