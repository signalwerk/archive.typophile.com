  html: |-
    <p>Joshua Lurie-Terrell works by day as a graphic designer for the California State Legislature. In the evenings, he helps <a href="/node/12036" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Stephen Coles</a> edit <a href="/node/12035" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typographica</a>. He runs <a href="http://www.hewnandhammered.com">Hewn <span class="amp">&amp;</span> Hammered</a> singlehandedly.</p>
    <p>He has a <a href="/node/13648" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Vandercook</a> in his garage and offers its use to any typographer in the Sacramento&nbsp;area.</p>
    <p>Ladies love&nbsp;him.</p>
