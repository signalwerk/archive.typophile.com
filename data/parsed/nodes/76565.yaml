  html: |-
    <p>I am trying to produce a scaleable dot-based font family in Fontlab as Mac flavoured Opentype. I’ve had a lot of trouble with getting small circles to be geometrically correct in Truetype (the beziers flatten the arcs) but Opentype keeps them geometrically consistent.</p>
    <p>However, I have a bigger problem which I can't seem to fix. </p>
    <p>The more complex font shown here (with the six dot stroke) refuses to print as Opentype from InDesign or Acrobat on a Konica Minolta PagePro 9100 laser printer with 64Mb memory. It doesn't crash – just ignores the file and clears the print queue. I reckon that there must be too much data in each individual character at the higher dot pitch – and that I am exceeding a Postscript limit. I can't find any info on this and Fontlab tech support have been unable to help. Any ideas on solutions or workrounds would be welcome as I would like to construct a large family of scaleable dot fonts.</p>
    <p>Another issue, which may be related, is that I have chosen to set the type height to its true size, 1008 UPM rather than 1000 UPM, so that the fonts can be accurately scaled to size. If I don't do this, the scaling maths becomes difficult to resolve as does the dot structure. Any advice on this?</p>
    <p>Thanks,</p>
    <p>Paul</p>
