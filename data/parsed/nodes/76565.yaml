    html: |-
      <p>Could be this:</p>
      <p>In "Preferences/Options &gt; Generating OpenType &amp; TrueType &gt; OpenType PS (.otf)", deactivate "Use subroutines to compress outlines in the CFF table", then generate the font again.</p>
      <p>See Adam Twardoch's posts <a href="http://typophile.com/node/56178" target="_blank" rel="nofollow">here</a>.</p>
