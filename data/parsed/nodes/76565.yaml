    html: |-
      <p>I assume that you’re working with components. Are you converting everything to outlines in the final fonts? I imagine that printer programmers aren’t thinking about fonts with dozens of components in the characters.</p>
      <p>You might want to contact Christian Schwartz directly about creating dot fonts as he has done a few.</p>
