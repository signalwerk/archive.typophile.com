      <p>It might be interesting to try printing the same page on  a PS printer with a lot more RAM and/or Adobe PostScript. My recollection is that the QMS clonescript used by Konica Minolta was reportedly the worst of the major PostScript clones, or at least it was a few years back.</p>
      <p>Regards,</p>
      <p>T</p>
