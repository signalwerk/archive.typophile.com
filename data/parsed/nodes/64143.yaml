      <p>I believe all the above statements are true.</p>
      <p>In an average font, the cap height is about 70% of the point size, and the x-height is about 50% of the point size. But plenty of fonts diverge from the average, occasionally by quite a bit.</p>
      <p>Cheers,</p>
