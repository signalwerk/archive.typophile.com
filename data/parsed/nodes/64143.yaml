    html: <p>If you measure the printed type from baseline to baseline with zero leading (line spacing), then it should be 12 points with 12 point type.</p>
    html_clean: <p>If you measure the printed type from baseline to baseline with zero leading (line spacing), then it should be 12 points with 12 point type.</p>
