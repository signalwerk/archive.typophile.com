    html: |-
      <p>I know this is an old post but I like to respond. Dotsies is far too complex to remember. I think it would be a real challenge to teach this to young children. Also, can you imagine checking a dotsies text for grammar?</p>
      <p>In the sample on the dotsies page going from text to dotsies, I have a lot of problems reading beyond the 4th line. Who said being more economical with space helps readability anyway?</p>
      <p>"It's easier than you think. There are only 26 letters. Numbers and punctuation aren't altered. You've probably learned more than 26 things in a single hour-long class or lecture."</p>
      <p>I don't think the issue is the amount of letters or even our memory capacity necessarily, but rather the fact that it's very hard to distinguish letters from each other. This is a lot of fun for people with dyslexia I can imagine.</p>
      <p>Russell, your typeface looks half Asian. I like it. It's hard to read but it looks cool. Is this font available by any chance?</p>
