    <p><strong>From <a href="http://www.dotsies.org" rel="nofollow">dotsies.org</a></strong><br>
    “<em>Since latin letters (a, b, c, etc.) are optimized to be written by hand, they take up a lot of unnecessary space. Your eyes have to move at a frantic pace from left to right to read. The letters in Dotsies words smoosh together, so words look like shapes! Get more screen space! Save paper. Have a more comfortable reading experience</em> (Muth, C.  2012).”<br>
    ————<br>
    Thoughts?</p>
