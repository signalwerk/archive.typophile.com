      <p>&gt; I am using Indesign. I am unsure what the<br>
      &gt; hyphenation settings is</p>
      <p>Spacing problems in justified text can often be improved by telling InDesign to use more hyphens, but the hyphenation controls are a little hard to find.</p>
      <p>1. Select the paragraph(s) you wish to adjust<br>
      2. Open the Paragraph palette (Window &gt; Type and Tables &gt; Paragraph)<br>
      3. In the upper right corner of the Paragraph palette is a tiny little arrowhead. Click and hold the arrow and select Hyphenation in the popup menu. </p>
      <p>(An alternate way to reach the hyphenation controls is to assign a style sheet to the text. The style sheet options include hyphenation controls.)</p>
      <p>Anyway, once you've reach the hyphenation controls, you'll have various options which are mostly self-explanatory. Try different settings and see how they affect the appearance of your selected text.  Be sure that "Preview" is selected so you can see immediately how the text is affected.</p>
      <p>Here's what the controls looks like (these are default settings). And remember that your changes will only affect the selected paragraphs.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hyphenation_6256.jpg"></div><p></p>
