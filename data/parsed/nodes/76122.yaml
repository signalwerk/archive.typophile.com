    html: |-
      <p>The problem is that you've got a narrow column and 0 hyphens. </p>
      <p>Select the paragraph and then change the first three numbers in the settings to 5 2 2 (instead of 3 10 1) and see if that helps create more hyphens.</p>
      <p>Also keep in mind that it's difficult to get attractive justification when there are only a few words per line. Try to get more words per line by widening the column, or by making the type smaller, or by switching to a condensed font.</p>
      <p>And fix "place,titles" (space missing); InDesign thinks its one long word.</p>
      <p>Making these changes should help, but remember that InDesign justifies text by adding extra space between words. So you're unlikely to get perfectly consistent spacing between words.</p>
