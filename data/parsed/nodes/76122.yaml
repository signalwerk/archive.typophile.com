    html: |-
      <p>&gt; What do you do then to fix it?</p>
      <p>I would avoid using justified type in that situation. </p>
      <p>But if you had no choice, adjust hyphenation settings to get the best results, hyphenating manually if necessary. You might find it helpful to temporarily change the justification to flush left rag right so you can clearly compare the actual lengths of each line and adjust the hyphenation until each line is as close to being the same length as possible. After doing that, change it back to justified.</p>
      <p>You could also adjust the tracking of each line to reduce the gaps between words, and make adjustments to the Justification control panel, but if you've got huge gaps between words to begin with then I don't think those things will give you really attractive lines. </p>
      <p>If this problem is occurring only in a few spots in your document, another approach is to rewrite those sentences so they break better.</p>
