      <p><cite> &gt;I tried that also nothing would change no matter what settings I changed. I am surprised there's no book teaching how to kern,</cite></p>
      <p>The solution to your problem is proper Hyphenation &amp; Justification, as others have tried to point out — not kerning. (The general public is getting into a disturbing habit of using the term “kerning” to address a multitude of things which it is not. This is becoming a pet peeve of mine.)</p>
      <p>With a narrow column, you will have to employ hyphenation to have any hope of getting good justification. The numbers in your screenshot are way off base. </p>
      <p>There are plenty of books discussing the principles behind good hyphenation &amp; justification. Some have been mentioned. Find one and educate yourself about the purpose of each of the settings in both the Hyphenation and Justification dialogs.</p>
      <p>There are also plenty of previous discussion on Typophile, with examples.</p>
      <p>I don’t recommend using the actual numbers in Bojev’s example above. You’ll need much tighter minimum word spacing for that particular setting.</p>
