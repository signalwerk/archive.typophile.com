  html: <p>Ok, so I got my local ex-letterpress guy  <br>( he now die-cuts ) to let me poke around  <br>his warehouse at a date of my choosing. <br> <br>In the corner of this rather large space under  <br>a layer of dust and dust bunnies there is  <br>a linotype machine, several letterpress machines, <br> wood and metal fonts and two or three cases  <br>of block plates of logos, dingbats, flurons,  <br>boarders, monograms and who knows what else. <br> <br>Now, while all of this stuff seems a treasure  <br>to me, it is the block plates that are  <br>of particular interest to me now. When I had  <br>the chance about three months ago to dip  <br>my fingers into case one, in was obvious  <br>that many of these were twenty, thirty and  <br>even forty and fifty years old. When he bought  <br>the place many of these blocks came with it.  <br>My estimate is that there are between 300 and  <br>900 of these total. <br> <br>This is my objective. To bring a stamp pad,  <br>plenty of paper and when I get there, stamp  <br>away. He has agreed to let me do this. <br> <br>So I am wondering if anyone has had any  <br>experience in archiving this kind of thing and  <br>if any advice, before I head in, could be  <br>offered. I don't expect to make my trip for at  <br>least another week. <br> <br>Paper choice is a major concern. And since I <br>have no blocks to experiment with myself in  <br>the meanwhile is a simple ink pad going to  <br>work well enough? <br> <br>-smc</p>
