    html: <p>&gt;Are better prints pulled from  <br>the latter?  <br> <br>Lord almighty, yes. Proofing presses, traditionally, are used for pulling proofs of "galleys." A galley is a tray that a typeset page would sit in, after being composed, before being printed. So the proof, like Hrant said, is just for layout/proofreading.  <br> <br>Cylinder presses are the real deal. I've got a "platen press" (see pic below) that I think would be easier to get the hang of for a beginner than a cylinder, although rumor has it that they don't produce the same quality.  <br> <br>I'll try to throw a simple How To sort of thing together for you. It won't make you a great printer, but hopefully it'll help you lock up and print those blocks. Sounds like a terrific project. <br> <br><img src="http://www.typophile.com/forums/messages/30/7790.jpg" alt="platen"></p>
