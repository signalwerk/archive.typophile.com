    html: "<p>smc <br> <br>Sounds like a project. I'd say Nathan has guided you well here. The best blocks to reproduce would be any with a copper face. These would be older than zinc or magnesium faced blocks and would repro much better as their detail is much finer. Rubber stamping won't do unless you are just using it for identification purposes. The use of a traditional hand buren is difficult and the spoon technique is probably worse than rubberstamping.  <br> <br>The galley proof press could work well if you are somewhat skilled with a brayer. A lot of these galley proofers are Vandercooks (Model O). But they are not the sophisiticated models that come with registration and inking mechanisms.  <br> <br>Best would be a Vandercook equipped with these (any of the Universal or SP models are the top of the line), as these were specifically designed for exacting reproduction work. At the end of the commercial letterpress era, these were used by type shops to repro metal type for the photo offset folks. We did a lot of repros for folks intent on digitizing these faces at one time. We even did a couple of repros for Doyald Young's first book. <br> <br>Most likely, in that shop you are messing around in there is a platen jobber, as in Nathan's last photo. (Nice looking press by the way.) This would do the job as well, but the reproduction quality would not be near what you could get with a properly adjusted Vandercook repro press. The platen jobbers are quite beatific to work on but I think it a bit easier to learn on a Vandercook as the makeready and inking concerns are less formidable to a beginner. The Vandercook is also better for bookwork, if for no other reason than it has a relatively massive bed size. <br> <br>Best to take a workshop on letterpress before you engage in this project. The blocks themselves are becoming quite valuable, especially the copper faced. A search for letterpress items over at eBay would give you an idea of their relative value. <br> <br>FYI: I've got a group site on contemporary letterpress practices at <br> <br><a href=\"http://groups.yahoo.com/group/PPLetterpress\" target=\"_blank\">http://groups.yahoo.com/group/PPLetterpress</a> <br> <br>Gerald Lange <br>The Bieler Press  <br> <br></p>"
