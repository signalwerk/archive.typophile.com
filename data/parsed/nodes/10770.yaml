    html: <p>Hrant's definitely right that galley proofs aren't worth a heck of a lot. For that matter, my trailer-park-Hokusai method isn't going to be absolutely stellar. If you're planning on archiving these things <a href="http://www.oneart.com/cgi-bin/briarpress/showcuts.cgi?uid=default&amp;home=1" target="_blank">digitally</a> though - i.e., if you just want something to trace a vector image of - I think that either one would be OK. If you really want to archive them on paper though, you might want to fire up a small platen press if there's one available. If you're not that familiar with letterpress, I think it'd be easier to get decent prints off a platen (e.g., C&amp;P) than a flatbed (e.g., Vandercook).  <br> <br>Nate</p>
