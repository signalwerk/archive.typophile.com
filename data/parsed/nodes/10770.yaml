    html: "<p>Sean: From my limited experience in making block prints without a letterpress, I think that results from a stamp pad are going to disappoint you. You might be better of picking up a pound of <a href=\"http://www.graphicchemical.net/block.html\" target=\"_blank\">black relief ink</a> and a <a href=\"http://www.graphicchemical.net/brayers.html\" target=\"_blank\">brayer</a>. The ink'll be tackier and, I think, give you a better impression.  <br> <br>Try placing the block face up, rolling out a thin layer of ink on a peice of plexiglass or lexan, inking up the block, placing the paper on top of it, and burnishing it with the back of a wooden spoon (er, make-shift baren). It's the white trash way of ancient Japanese woodblock printing.  <br> <br>You could also try using a \"galley\" or \"proof\" press if there's one laying around the shop.  <br> <br>Good luck. <br> <br>Nathan</p>"
    html_clean: "<p>Sean: From my limited experience in making block prints without a letterpress, I think that results from a stamp pad are going to disappoint you. You might be better of picking up a pound of <a href=\"http://www.graphicchemical.net/block.html\" target=\"_blank\" class=\"link-external\">black relief ink</a> and a <a href=\"http://www.graphicchemical.net/brayers.html\" target=\"_blank\" class=\"link-external\">brayer</a>. The ink'll be tackier and, I think, give you a better impression.  <br> <br>Try placing the block face up, rolling out a thin layer of ink on a peice of plexiglass or lexan, inking up the block, placing the paper on top of it, and burnishing it with the back of a wooden spoon (er, make-shift baren). It's the white trash way of ancient Japanese woodblock printing.  <br> <br>You could also try using a \"galley\" or \"proof\" press if there's one laying around the shop.  <br> <br>Good luck. <br> <br>Nathan</p>"
