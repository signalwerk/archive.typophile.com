    html: <p>Hmm. Inking up, printing, and cleaning hundreds of blocks would definitely take an inordinate amount of time. The advantage of a proof press is that it's pretty simple. Just a flat bed that your galley (or block in this case) sits on, and 2 rollers that you pull over the paper. Essentially like block printing but with rollers instead of a baren. Faster than a hand baren, but with uglier results.  <br> <br>To be honest, if you're not looking for top quality prints, learning how to lock up a few blocks at a time in an old platen press wouldn't be too hard. It's pretty easy to pull a print - pretty darn hard to pull a good one. I'm no Gerald Lange, but if you're interested I could email you some pointers.  <br> <br>Incidentally, below is a pretty standard proofing press. Simple little beast, innit. <br> <br><img src="http://www.typophile.com/forums/messages/30/7785.jpg" alt="proofpress"></p>
