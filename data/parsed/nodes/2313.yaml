  html: <p>Hello everyone, this is my ﬁrst post of Typophile!  <br><br>Ignaz Textura’s forms, pictured below, are based oﬀ letters that I found on a sepulchral memorial outside of St. Ignaz church in Mainz (Germany).  <br><br><img src="http://www.typophile.com/forums/messages/29/21834.gif" alt="Inaz Textura?first sample"><br><br>The memorial dates from the mid-16th century. The original letters seem to be similar to a textura, but being carved into stone, are quite diﬀerent from contemporary printed, or written blackletters. I hope that I’ve been able to capture some of this in my drawings.  <br><br>This typeface is still in its early stages, and I’d really love to hear what ever people think about&nbsp;it.</p>
  html_clean: <p>Hello everyone, this is my ﬁrst post of Typophile!  <br><br>Ignaz Textura’s forms, pictured below, are based oﬀ letters that I found on a sepulchral memorial outside of St. Ignaz church in Mainz (Germany).  <br><br><img src="http://www.typophile.com/forums/messages/29/21834.gif" alt="Inaz Textura?first sample"><br><br>The memorial dates from the mid-16th century. The original letters seem to be similar to a textura, but being carved into stone, are quite diﬀerent from contemporary printed, or written blackletters. I hope that I’ve been able to capture some of this in my drawings.  <br><br>This typeface is still in its early stages, and I’d really love to hear what ever people think about&nbsp;it.</p>
