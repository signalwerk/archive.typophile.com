    html: <p>Wow, very nice, Dan. <br>The lowercase seems ﬁne to me. But maybe I’d like to see a descending z. The uppercase… yes, it needs work. There are some good ideas, like the two A’s in your bottom image, and the T, but there are also some confusing glyphs, like V/W, M/N, O/P/Q, I/J. Finally, I’d try to make the ﬁgures just a bit&nbsp;heavier.</p>
