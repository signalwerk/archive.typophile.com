  - id: 18522
    user: 1085
    date: 2003-12-05T12:11:00
    date_raw: 5 Dec 2003 — 12:11pm
    votes: null
    html: <p>All three of the e's are based off of the actual stone carving, so I didn't "invent" the hookling myself (unfortunately!). It is possible that the unattached hookling on the second e may have actually been attached once; the inscription is on red sand stone, which is very soft. Most of the letters are now quite corroded, and some are illegible to me. <br> <br>The letters are from a c.A3-sized inscription on an outdoor sepulcher. Over the seplcher is a larger-than-life, multi-figured sculpture group, depicting the crucifixion (boy, that's a mouthful). The inscription is in German, which seems abnormal for the ecclesatic art of the time, which at least in Catholic Germany was usually done in Latin. However, I don't think that the inscribed text has any deep, inner meaning. I think that its more of your average variety of gravestone thing.</p>
    html_clean: <p>All three of the e's are based off of the actual stone carving, so I didn't "invent" the hookling myself (unfortunately!). It is possible that the unattached hookling on the second e may have actually been attached once; the inscription is on red sand stone, which is very soft. Most of the letters are now quite corroded, and some are illegible to me. <br> <br>The letters are from a c.A3-sized inscription on an outdoor sepulcher. Over the seplcher is a larger-than-life, multi-figured sculpture group, depicting the crucifixion (boy, that's a mouthful). The inscription is in German, which seems abnormal for the ecclesatic art of the time, which at least in Catholic Germany was usually done in Latin. However, I don't think that the inscribed text has any deep, inner meaning. I think that its more of your average variety of gravestone thing.</p>
