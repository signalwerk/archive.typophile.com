      <p>Thanks Endre. I've just been looking around for some typefaces that match my intentions and did spot Gotham which I really like, so it's interesting that you also mentioned it. I'm looking forward to the LC, as Kris said it's tougher than UC but much more fun. I hope to inject a bit of character into it, especially looking at the 'a' and 'g' but I don't want to bite off more than I can chew for this 6 week, very part-time, project!</p>
      <p>Regarding the upper case, I just got my mark back from Kris. A+. I'm stoked!<br>
      He's never mentioned the Q, but that I should slightly broaden the joins on the V, W, N &amp; M.</p>
