    html: |-
      <p>I would love to see one with the x height of Avenir or even better Gotham. I'm not a big fan of the long ascenders and descenders in Avenir. Also I would love for someone to go out of the box on some of the characters like the lowercase a and g. Go in the direction of Avenir or Gotham rather than Univers on the lowercase u and I tend to prefer squares rather than dots on the i and j (see Gotham)</p>
      <p>I'm just talking about what I would like to see in a typeface like this and merely making suggestions;o)</p>
      <p>On the Uppercase: This sort of Q tends to become really heavy at the bottom optically and could possibly be solved better. Again try something original after all you are competing with the likes of Adrian Frutiger and Tobias Frere Jones here;o) Make sure you have something different to offer.</p>
      <p>Best of luck and great job so far!</p>
