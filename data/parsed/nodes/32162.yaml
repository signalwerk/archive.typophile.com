  html: |-
    <p>Hi all,<br>
    I have made a regular weight font. In Microsoft platform, applications still able to get the bold version (lets say when I press the bold button in MS Word). My question is how this default bold behavior is calculated and can we tune this default behavior using FontLab. </p>
    <p>And there is a small question what is the difference between "Normal" and "Regular" weight?  </p>
    <p>Best regards,<br>
    Atif</p>
