    <p>Hi,</p>
    <p>Some guys at my company are doing an online campaign for the surprisingly popular movie Paranormal Activity. Does anyone know what font is being using for the title? Make sure to have a good look at the 't'. </p>
    <p>Something quite similar will be fine too.</p>
    <p>You can se more here: <a href="http://www.paranormalactivity-movie.com/">http://www.paranormalactivity-movie.com/</a></p>
    <p><img src="/sites/default/files/old-images/paranormal_font_3965.jpg"></p>
    <p>Thanks in advance.</p>
