    <p>OK. So I helping out a group of university students who are doing their first magazines.  One has a cover that will have 50% UV spot varnish.  I'm not sure how to set this is in InDesign though.  Is there a swatch for a 5th color?  When I export the document to .pdf, will it be read separately?  </p>
    <p>I appreciate any help you guys can give.  </p>
    <p>Thanks</p>
  html_clean: |-
    <p>OK. So I helping out a group of university students who are doing their first magazines.  One has a cover that will have 50% UV spot varnish.  I'm not sure how to set this is in InDesign though.  Is there a swatch for a 5th color?  When I export the document to .pdf, will it be read separately?  </p>
    <p>I appreciate any help you guys can give.  </p>
