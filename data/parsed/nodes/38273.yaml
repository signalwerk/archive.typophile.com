    date_raw: 21 Oct 2007 — 3:01pm
    votes: null
    html: <p>Maybe a bit old-fashioned, but if I am designing a UV I do two things. One is to have a separate spot color and name it Spot UV, but I also print the separations out so as to give the press a sample of the plates so they know that I know that they should know that there is indeed a spot UV color.</p>
