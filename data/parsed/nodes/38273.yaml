  - id: 234411
    user: 5039
    date: 2007-10-20T03:44:00
    date_raw: 20 Oct 2007 — 3:44am
    votes: null
    html: <p>Yeah, just add any spot color to the ID document where you want the varnish, and make sure when you're exporting the PDF that the spot color is there as a separate plate (it should be by default). Tell the printer that the spot color is where you want the varnish, and be sure to print b&amp;w images of each of the 5 plates (and write on the the spot plate that it's the varnish) so that there's no chance of confusion or miscommunication as the job goes through the hands of several folks at the printer.</p>
