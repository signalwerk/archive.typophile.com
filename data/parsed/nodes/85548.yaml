  html: |-
    <p>I have a couple of doubts that I never understand the true meaning of some.<br>
    For exemple:</p>
    <p>When some description about typefaces refer the feature: <em>optical sizes</em>, what the really difference from the types without this feature? </p>
    <p>A good hinting of a typeface, really give much more legibility on the screen, but what are the techniques for make a really good hinting typeface?</p>
    <p>This are two questions that occupy my head for some long.</p>
    <p>I am most interested in knowing the answer to these questions, and the more detailed the better.<br>
    if you lose your time to answer me, thanks a lot!</p>
