  html: |-
    <p>Hi guys,</p>
    <p>I am looking for a script/handwriting to be used as a tagline. It must feel friendly, warm and simple. And maybe more important it has to be very legible and work in small sizes.</p>
    <p>I've found Tomboy from Letterperfect <a href="http://www.myfonts.com/fonts/letterperfect/tomboy/" title="http://www.myfonts.com/fonts/letterperfect/tomboy/">http://www.myfonts.com/fonts/letterperfect/tomboy/</a> that I find pretty suitable. However, I think it's a bit too masculine and harsh. I guess it's because it's a signage/marker typeface rather than a script. </p>
    <p>Any ideas on similar but with a  friendlier appearance?</p>
    <p>Thanks!</p>
