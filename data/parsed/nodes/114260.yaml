      <p>Unless you've made arrangements with the original author or current copyright holder, or the font license allows for this kind of reuse and modification, you have to do some inspirational cleansing to avoid running afoul and making a plagiaristic copy.</p>
      <p>Erik Spiekermann said something about this on these forums some time ago. I'll paraphrase what I remember, but I welcome correction. Really, paraphrasing what you remember is at the essence of what he said.</p>
      <p>Study the font you intend to revive in great detail. Examine whatever existing copies you can find. Sketch out the glyphs by hand, and become familiar with every curve and corner. Then, lock it all away for a month. Don't look at it. After the time has passed, sketch it out, from memory, on paper, without looking at your references. Build your font from these sketches. </p>
      <p>I'm sure I left out a step or some philosophical point or something. Apologies for what I got wrong.</p>
