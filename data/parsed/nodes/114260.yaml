      <p>There is a continuum from the outright illegal -- copying and editing digital outlines generated by a computer program without the permission of the copyright holder either via the license or by individual arrangement -- to the perfectly legal -- reviving or adapting a printed sample in a foundry specimen book from the 19th century. For everything else laws vary from country to country. There are a few legal cases for guidance but most situations are not properly resolved. Best to be cautious. If in doubt get competent legal advice that applies in your jurisdiction.<br>
      Don</p>
