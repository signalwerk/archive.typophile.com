    html: |-
      <p>Paul, I believe a musical notation font is what Dot said they don't need.</p>
      <p>This is interesting. Frode is right but it's not quite un-tricky. Many Bodonis/Didots don't have the soft/"scripty" instrokes in the italics; but then <a href="http://new.myfonts.com/fonts/bitstream/baskerville/" rel="nofollow">some</a> <a href="http://new.myfonts.com/fonts/emigre/mrs-eaves/bold-italic/waterfall.html" rel="nofollow">Baskervilles</a>, which would seem like good matches otherwise, have the semi-ascending "p".</p>
      <p>Here are a few faces whose bold italic cuts look like they might work:<br>
      <a href="http://new.myfonts.com/fonts/shinn/scotch-modern/" rel="nofollow">Scotch Modern</a><br>
      <a href="http://new.myfonts.com/fonts/bitstream/century-731/" rel="nofollow">Century 731</a><br>
      <a href="http://new.myfonts.com/fonts/berthold/bodoni-old-face-bq/" rel="nofollow">Berthold Bodoni Old Face BQ</a> (quirky "p")<br>
      Also nice: <a href="http://new.myfonts.com/fonts/suitcase/teimer/" rel="nofollow">Teimer</a> (no foot serif on the "p")</p>
    html_clean: |-
