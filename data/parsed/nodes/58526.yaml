    <p>I'm working on a logo for something that's connected to classical music.</p>
    <p>The logo will contain letter "a" but the problem is that it has to look like it has derrived out of same typeface that is used for writting musical dynamic indications which are: piano, forte, mezzo-piano. Does anybody know which typeface is used for these indications? I do NOT need typefaces used for writing musical notation!!! because there isn't any "a" in it. I need a typeface that looks like the one in which piano, forte and mezzo-piano are written. </p>
    <p>I will attach how they look here.Pay attention that they are written in CURSIVE so I need my "a" in cursive as well:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/400px-Dynamics_svg_4146.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/6d9f75b5188c8824a1254dae144bf36e_4648.jpg"></div><p></p>
