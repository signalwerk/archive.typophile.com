    <p>I am wondering if italic isn’t more a style than small capitals: what italic really is if you need to define it precisely?<br>
    In CSS, italic is called a "font-style" such as in the <a href="http://typophile.com/node/12463">dedicated page</a> on this website.  Can we imagine that italic is the same type than a rounded or outline version of a font?  If italic is just another font, it stays related to a typeface, such as weights isn't it?<br><a href="http://graphicdesign.spokanefalls.edu/tutorials/process/type_basics/design.htm">Another result</a> of my research tells that "angle", "weight" and "width" are separated characteristics.<br>
    If I need to make a typeface database, should I order fonts like:</p>
    <p>Case 1<br>
    In this case I try to separate weights, widths and variants, tags are for typefaces only<br><code><br>
    Typeface<br>
     -   Tags: sans, 1990, grotesque, small caps, ligatures<br>
    Font<br>
     -   Weight: bold<br>
     -   Width: condensed<br>
     -   Variant: italic<br></code></p>
    <p>Case 2<br>
    More flexible with tags only but less precise.<br><code><br>
    Typeface<br>
    -   Tags: sans, 1990, grotesque, small caps, ligatures<br>
    Font<br>
     -   Tags: bold, condensed, italic<br></code></p>
    <p>Any other idea?<br>
    Thank you for your help / tips / references.</p>
