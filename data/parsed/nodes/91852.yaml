      <p>It was an exemple: If a typeface contains ligatures, I should want it to appear in search results for "ligature". Tags are really free in my case.<br>
      And thank you for your briliant answer.</p>
      <p>Edit — I just read the text you sent Frank. This is really interesting and  I must confess, a bit discouraging: </p>
      <p><cite>As I am busy with this topic for 14 years now I get really desperate at times. I can understand why my predecessors did not want to continue to bother at some point and why the discussion is preferably avoided at conferences. </cite></p>
      <p>In the article the question is always about typefaces, but I am also wondering about how a font weight can modify the drawing of a typeface: How can I know if I am in front of a bold version of a typeface if I don't know anything about its context?<br>
      Another question is: Who is supposed to classify the typefaces? In a first time, it will be the type designer himself or the foundry, but users (designers or not) will own more and more tools to organise their fonts and this same people are not supposed to learn complex terminology.<br>
      Apologies for my bad english.</p>
