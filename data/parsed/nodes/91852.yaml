      <p>According to the current orthodoxy, typefaces—commonly referred to as fonts—come in families. "Font-style" is a formal taxonomic classification; if the W3C consortium had so chosen, the terms could just as easily be "font-relative," like "brainiac sister" or "finagling uncle." Italics themselves are alternate letterforms which may or may not more closely resemble handwriting, are generally slanted, and commonly used for emphasis or specific identification purposes—such as the title of a book in formal English-language scholarship.</p>
      <p>You've already made your arguments for Case 1 or Case 2, which is usually the case: more "flexible" language is usually less concise.</p>
