    html: |-
      <p><cite>- it works in most software applications<br>
      - it works with any combination of OT features</cite></p>
      <p>There isn't that much software that use the full range of OTF features -- even InDesign does not! (Petite Caps, for example, are missing...) On top of that, even Adobe made some "curious" choices in the various parts of their so-called "Suite" -- from memory, Stylistic Alternates (salt) is available in Illustrator, but not in InDesign.</p>
      <p>Further complicating the issue is that there are no strict guidelines <em>in what order</em> Opentype features are applied. Does it matter for your font if first Swash is processed and then Initials? Or the other way around?</p>
      <p>As to how to prevent clashes, I think there is no other option than preventing clashing glyphs to be generated. If you have a list of clashing glyphs, you could add a substitution table after all "obvious" replacements to correct this. It has to be a separate table at the end, because every table is only looked at once, and only the first match is used.</p>
      <p>(Ligatures are a well-known example of this; if you have</p>
      <pre>replace f f with f_f;
      replace f f i with f_f_i;</pre><p>
      you will never get to see the "ffi" in your output.)</p>
      <p>I agree with Hrant: sweet job so far!</p>
