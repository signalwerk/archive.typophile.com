    html: <p>The salt feature is in Illustrator as well as the dlig. Since Illustrator is about the only one using the salt feature there wouldn't be much sense in doubling it up for that. If I recall I think there was mention before of using salt and stylistic sets together. InDesign has the stylistic sets feature, but Illustrator does not. In a sense stylistic sets is like an expanded version of the salt feature. I wish Adobe would add stylistic sets to Illustrator.</p>
