    <p>Hi guys,</p>
    <p>I've been working very hard on a new typeface called NOVA. This is a geometric stylistic font with a twist. I call it a twist, because I want it to be possible to kinda 'plug and play', or 'stack and play' if you will, with the OT features. This should change the character of the font in a major way, giving the designer the feeling he's got 4 fonts under his control. I want it to be intuitive and robust.</p>
    <p>Let me give you a quick sample of what I've got set up:<br>
    <a href="http://typophile.com/files/Nova_OT_plug_and_play_sets.jpg" title="http://typophile.com/files/Nova_OT_plug_and_play_sets.jpg">http://typophile.com/files/Nova_OT_plug_and_play_sets.jpg</a></p>
    <p>What you see here is a sample of Nova with the additional OT features I've got installed. The trick is that you can type your text in Nova, than activate the DLIG feature ánd the SWSH feature ánd the INIT feature ánd to top it off the SS01 (or any other) feature.<br>
    I've got the basic OT features set up in Fontlab and this works nicely in InDesign. I've done it in a quite simple but effective way and I'm well aware that this might not be compatible with other software. It also (kinda) works if you use any random combination of OT features. Say if you leave out the SWSH and SS01 features, it changes the result in a really nice way giving the designer all the chances to play and have fun.</p>
    <p>It gets now really complicated because glyph replacements should not colide and the glyph Classes with accents etc should be arranged effectively. This is where I'd like your help with, because this is way out of my league.</p>
    <p>Here's the features file:<br>
    <a href="http://typophile.com/files/Nova_features.txt" title="http://typophile.com/files/Nova_features.txt">http://typophile.com/files/Nova_features.txt</a></p>
    <p>Here's the Classes file:<br>
    <a href="http://typophile.com/files/Nova_classes.txt" title="http://typophile.com/files/Nova_classes.txt">http://typophile.com/files/Nova_classes.txt</a></p>
    <p><strong>Question for you OT cracks</strong><br>
    How can I set this up in a solid way that:<br>
    - I've got my Classes set up correctly<br>
    - it works in most software applications<br>
    - it works with any combination of OT features<br>
    - it can be expanded with upcoming OT features or glyphs<br>
    - standard ligatures (ff) don't clash with dicretionary ligatures (ffb)<br>
    - and any other issue you can come up with  ;-)</p>
    <p>I'd love to hear from you.</p>
    <p>Cheers,<br>
    ®</p>
