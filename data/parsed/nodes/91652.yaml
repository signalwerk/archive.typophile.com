    html: <p>The dlig feature seems like a good choice. I wish Adobe would get the features updated and at least more consistent between Illustrator and InDesign. I've stopped using the salt feature for now in fonts because of its behavior in Illustrator. When I make a choice from the glyph palette in Illustrator that just happens to be in the salt feature as well, Illustrator decides I've made an overall preference choice and keeps the salt feature active throughout any subsequent new text. That I find annoying and a waste of time to correct. If Illustrator had stylistic sets and didn't proactively change glyph selections into feature activation you could easily make changes to a style variation as seen in Nova with either Illustrator or InDesign.</p>
