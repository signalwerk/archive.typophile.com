      <p>I know OT is still not really widely spread throughout the software. I think that where we need to educate the user about what's possible and what not.</p>
      <blockquote><p>Further complicating the issue is that there are no strict guidelines in what order Opentype features are applied. Does it matter for your font if first Swash is processed and then Initials? Or the other way around?</p></blockquote>
      <p>I understand and I think it's no problem to change the order of the features, that's the charm until now. I've got it now setup in such a way that some glyphs become richer whén you have a certain feature activated. But also without that, it works perfect. I'd say, just play around with the features and see what works best for you.</p>
      <p>I've read this article, but can't wrap my mind around it:<br>
      <a href="http://ilovetypography.com/OpenType/opentype-features.html" title="http://ilovetypography.com/OpenType/opentype-features.html">http://ilovetypography.com/OpenType/opentype-features.html</a><br>
      It's just a bit over my head to do it this way, but I think it's more sustainable.  ;-)</p>
      <p>What do you say to the OT codes? Do they look good enough to work? Do you know of a good way to test this? I don't want to publish a font with silly glyph issues in it. </p>
      <p>@Hrant: thx  ;-)</p>
      <p>PS: If someone can move this to the Build section, I'm fine with that.</p>
