      <p>Randy and Arlo, Awesome advice... here is my project proposal - in bullet form. </p>
      <p>Problem<br>
      Royal Atlas is an up and coming airline &amp; lifestyle carrier that wants to ‘spread its wings’ and become an equitable brand / company. It caters specifically to ‘events’ and wishes to make the experience of traveling a beneficially and enriching experience. </p>
      <p>Question<br>
      How do you structure / design an interface to build a strong loyal clientele and an efficiently run airline, while maintaining a lifestyle brand with strong brand equity.  What sets this airline apart from others?</p>
      <p>Answer / Proposal<br>
      As technology is no replacement for the actual experience of travel it will be used extensively to supplement the planning and sharing of destinations.  In addition the layout of the plane will create community.<br>
      –	Destinations cater to specific events<br>
      –	Travel Buddies – Groups (Companies can charter this service with other companies.)<br>
      –	Sponsored Events<br>
      o	User created coverage<br>
      •	Twitter feed page<br>
      •	Live update photos &amp; maps<br>
      •	iPhone community – trip specific recommendations ,‘loopt’ like meeting opportunities.<br>
      –	Branded user created content<br>
      o	Photo Albums (Printed) – made by user<br>
      o	Travel site w/ map &amp; photos for friends and family (or for all)<br>
      o	User Swag<br>
      –	Create Printed ads that advertise the style and ideas of the<br>
       brand “Making Google Maps better” ??<br>
      –	Interior Design of the plane to allow for conversations, (instead of all people in rows facing forward toward the destination, people will be grouped at ‘tables’ or in circles to induce conversation and sharing)</p>
      <p>Notes<br>
      The nice thing about traveling in a group &amp; a digital community is that it allows you to use it to better your experience, whether you are ‘social’ or not.</p>
      <p>Technology allows you to hide &amp; be anonymous or network &amp; be seen / heard. Either way the tools supplied at a personal level by the airline supplement the experience and can be utilized by professionals for personal gain. </p>
      <p>The goal of Royal Atlas is to create a community to share travel experiences and aid in networking.</p>
