      <p>I applaud your ambitious project! The "ink trap" feature seems ok but problematic in execution as SJP mentions. The faceted edges are not saying luxury to me on any level. You say they look kitch in display. Where do kitch and luxury airline intersect? </p>
      <p>Take a look at the *free* and excellent Kontrapunkt typeface. It comes from the same genus as your idea:<br>
      <a href="http://www.kontrapunkt.dk/news/ddprize_typeface_of_the_year_2004" title="http://www.kontrapunkt.dk/news/ddprize_typeface_of_the_year_2004">http://www.kontrapunkt.dk/news/ddprize_typeface_of_the_year_2004</a></p>
      <p>My advice would be to remove the faceting. Then you can really focus on the shapes and we can give further crit. An interesting start. I look forward to seeing this used in the program. Can you show us that? Would help us get a feel for the design language of the ID system.</p>
