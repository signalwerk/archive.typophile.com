      <p>After reading the brief, it seems to be more focused on marketing materials than on visual strategy.</p>
      <p>I would ask a few questions about where you want the visual direction to go.<br>
      1. what adjectives do you want people to describe the company as? (fun or serious, inclusive or exclusive, cold or warm, business or casual, etc.) [Randy touched a little on this idea]<br>
      2. What visual elements support the adjectives you selected?<br>
      3. what other brands would consumers of this brand be likely to subscribe to? what visual language works for these brands? Do you want your visual language to be similar/dissimilar? (Be wary that answers to this question can easily cross the line toward plagiarism.)<br>
      4. Identify the demographic more specifically. In addition to the online users, what are their spending habits, income level, hobbies, gender, ethnicity, careers, etc.</p>
      <p>The answers to these questions give a more specific framework and it becomes much easier to develop a visual direction that can then be applied to the marketing materials you outlined in the brief.</p>
      <p>Think general to specific. If you outline objectives and strategy before you start executing, you'll end up with more appropriate work. Freedom within boundaries.</p>
      <p>As far as the logo you have now, it feels much more casual and conversational than luxury; more geared to a predominantly female audience, which may or may not be the demographic you are after.</p>
      <p>Hopefully this is helpful. P.S. I realize this is a student project, but it's always good to build the foundation before building the house on it. Best of luck.</p>
