      <p>Ian let me suggest this: </p>
      <p>Focus on the logo and the identity. Get that perfect and then use your *extra time* (haha) to worry about the font. AND EVEN THEN I would only worry about a single display weight to work with an existing typeface for text. That would be an ambitious,but manageable student project IMO.</p>
      <p>Thoughts to guide your design of the logo:<br>
      Be clear about the position of your new airline brand. You say luxury. Luxury how and for whom? Is this a "luxury" experience for the budget conscious - eg JetBlue vs Southwest or "luxury" for the well-healed international business traveler - eg Emirates / Singapore "now with private suites." Have you created a brief, and if so, what is it?</p>
      <p>Good luck and show us a logo!</p>
