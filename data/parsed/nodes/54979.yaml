      <p>I suppose kitch was the wrong word as yes, kitch has nothing to do with luxury airline. I suppose i was looking more for "quirk," such as the prada R &amp; A. I was hoping that the quirk, awful or not, would be memorable — preferably in a good way. Perhaps those elements are only best explored in the logotype, which I am exploring in creating a fat face for. I will post those tomorrow.</p>
