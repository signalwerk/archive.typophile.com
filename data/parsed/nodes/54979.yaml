      <p>Logo time? Yes! </p>
      <p>Simple explanation of the logo:<br>
      -Globe - as it relates to 'atlas'<br>
      -Compass - as it relates to traveling<br>
      -Diamond - as it is 'royal'<br>
      -Circle - as this is how people will be seated<br>
      -Colored Triangles - as many people will be sharing their voices creating conversation.</p>
      <p>I also took Arlo's advice and made a bold face (well just the logotype so far.)  It had crossed my mind that such thin type would disappear on the side of a plane. Bold just seems to be par for the course.  </p>
      <p>So there will be accents of these really bright colours, as seen in the logo. But for the most part the identity will rely heavily on Black, White, Gray, and Silver with these colors as accents. These colors are based off of some of the colours I've been seeing come down the Spring 2009 Runways. </p>
      <p>Also I plan on making the logo dynamic, the colors can shift fade in and out. Also they can relate to the separate features of my website (to be) and will help navigate. </p>
      <p><a class="freelinking external" href="http://www.umlaut-design.com/RoyalAtlas_Typophile_BoldTypeandLogo.jpg" rel="nofollow">Royal Atlas : Bold Type &amp; Logo</a></p>
      <p>What do you think?</p>
