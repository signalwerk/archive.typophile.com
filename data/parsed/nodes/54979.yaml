      <p>I think the ink traps distract too much from the face and make it look spindly and overly bumpy. The face is essentially monoline, but then it has these odd joins where it tapers down to next to nothing. </p>
      <p>Either you could introduce more humanist traits into the face, to give the tapers a reason to be, or you could lessen their extreme lightness and bring back the monoline nature. As it stands now, I don't think it works.</p>
