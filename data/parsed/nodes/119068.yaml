  html: |-
    <p>Here are two of several messages I receive upon trying to generate fonts:</p>
    <p>[WARNING]  Start of new pair positioning subtable; some pairs may never be accessed: [a a.ss01 agrave.ss01 aacute.ss01 acircumflex.ss01 atilde.ss01 adieresis.ss01 aring.ss01] [y yacute ydieresis ycircumflex ygrave]<br>
    [WARNING]  Start of new pair positioning subtable; some pairs may never be accessed: [r racute rcommaaccent rcaron] [o ograve oacute ocircumflex otilde odieresis oslash omacron ohungarumlaut] [C:/Users/user/Documents/FontLab/Studio 5/fontlab.fea 487]</p>
    <p>It doesn't prevent me from generating the font but obviously something isn't behaving as it should. I have no idea what this message says, though I suspect it's something to do with the classes. Is anyone familiar with this kind of message and what it refers to?</p>
