      <p>Daniel, the sentence "It doesn't have to hurt" in your first image highlights how many people feel as they contemplate a real-estate transaction. <em>I'm afraid I'm going to make a mistake</em> or even <em>I don't want to come off as silly.</em> What your wife promises is to relieve that fear for them. </p>
      <p>A minimalist design can betray a fear of looking silly. Good visual marketing says <em>Here's how I'll make things better for you</em>, not <em>See how sophisticated I am.</em></p>
      <p>One thing that <em>will</em> make your wife look silly is if the printer accidentally cuts off part of her phone number. Your printer will need need at least 1/8 inch margin between any type and the the edge of the card.</p>
      <p><strong>A brief digression about red doors.</strong><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/reddoor_4886.jpg"></div><br>
      As your wife may know, Talbots uses a red door as part of their visual identity. So does the Episcopal Church. A red door is a positive image, but it has definite WASPy associations.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Episcopal_4381.jpg"></div><p></p>
