      <p>I don't quite get the logo. The house shape definitely doesn't communicate easily. I'd go back to the drawing board on that. </p>
      <p>The periods everywhere don't let the text flow well. A lot of new slogans and ads try to be simple. and brief. and to the point. but they end up reading rather stilted and jarring. Why not put commas after "Real Estate" in both instances. Then it would read as a complete sentence, make more sense, and flow better. To make it even simpler, you could make the first instance one complete sentence: "Real Estate doesn't have to hurt."</p>
      <p>I don't like the band of color on either side. It's unnecessary, and especially for a card trying to exude simplicity, it would be better without it. </p>
      <p>penn</p>
