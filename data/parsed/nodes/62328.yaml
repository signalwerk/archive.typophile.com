    html: |-
      <p>Additional tweaks (#1) — If you're going minimalist, it's the details that really make it snap.</p>
      <p>1. Lowercase t and f so they don't blend into the numbers so much.</p>
      <p>2. It's conventional to use a "thin space" (about the width of a lowercase i, maybe less, just a little smaller than a normal space) when separating groups of digits in a telephone number. The spacing after the t and f should be normal. I usually eye-ball it. </p>
      <p>3. Go full-on international: +1 864 908 7498 (+1 = your country code)</p>
      <p>4. Kern the numbers very carefully.</p>
      <p>5. What font are you using? I'd recommend one with small caps (SC) so you can use them for her degree. Using old style figures (OSF) for the tel/fax is a tough call. If you need to buy a font to do it, I wouldn't bother, but if you're willing to shell out a grand, go for <a class="freelinking external" href="http://www.bertholdtypes.com/bq_library/090204000.html" rel="nofollow">Futura Serie</a>. Not only does it have a great range of weights, it is one of few sans with a complete set of SC and OSF. You could use it for all of the additional materials. Additionally, it has a very geometric look to it which I consider appropriate to the context. As her initials are CH, the C would great.</p>
      <p>6. I can't tell if you dropped the weight on the | between the numbers or not. I would.</p>
      <p>7. Try dropping the weight or size (-1 pt) of the . in a web/email.</p>
      <p>8. Why did you choose bottom right, flush right?</p>
      <p>9. Did you consciously choose to not include the web address? I didn't notice it at first as I simply gleaned it from the email address. I would leave it as is (and I'm going to steal that idea).</p>
      <p><em>Pimpin'</em></p>
