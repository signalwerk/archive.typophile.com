      <p>To address your second post: Yeah, the thing I'm learning about minimalism is that, for the design to be successful, every element must be considered with care. Which is why simple design is more challenging for me, and probably why it is so much more appealing</p>
      <p>1, 2, &amp; 4. I changed t &amp; f to lowercase, and reduced the space between clusters of numbers. I'm working on the kerning, which is a trial-and-error process for me.</p>
      <p>3. I'll experiment with adding the country prefix to the phone numbers, though I'm not sure that it's a necessary element right now.</p>
      <p>5. The font is Vegur, which I probably found by scouring the interwebs for free, legal, fairly well-designed fonts. I'll try to find a sans font with small caps and hanging numerals. As you have guessed, money is limited right now (example: the cards were designed in Inkscape on a 7-year-old machine running Linux), but, yeah, the typeface you mentioned is pretty great.</p>
      <p>6. I did drop the weight on the | on one version of the business card, but apparently not on the versions posted. But, yes, it does make a difference.</p>
      <p>7. I will give this a try. </p>
      <p>8. Hmm, this is an interesting question. I'm not entirely sure I have a real answer. I know that I really liked the idea of balancing the card between a nice, comfortable area of white space and tight, compact areas of information. I knew I wanted the contact info at the bottom, and I wanted the characters to be aligned on the right. Honestly, I think I just wanted to make a card that was simple, clean, and direct, and completely unlike most real estate business cards I'd seen. The fact that the card doesn't feature a photo of my wife is pretty unusual, for example.</p>
      <p>9. I thought it was redundant to list the web address on the card, and I also wanted to eliminate unnecessary information to make the contact area more compact. I'd be pleased if you stole the idea, especially since I probably stole it from someone else myself.</p>
      <p>I'll work some more and post my next revision if you folks are interesting in taking a look.</p>
      <p>Thanks again.</p>
