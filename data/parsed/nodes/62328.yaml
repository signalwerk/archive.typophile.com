      <p>I think that would be working against the minimalist appeal. If it's too obvious, people know it's a door. If it's subtle, then you give them the opportunity to have that "oh, now I see it!" feeling. They like that. I call it tailored ambiguity. You can find examples of this sort of <a class="freelinking external" href="http://en.wikipedia.org/wiki/Visual_rhetoric" rel="nofollow">visual rhetoric</a> in:</p>
      <p>Ehses, H., Lupton, E. (1988). Design papers 5. <em>Rhetorical handbook: an illustrated manual for graphic designers</em>. NSCAD University. Halifax, Nova Scotia, Canada.</p>
      <p>I would consider this an example of <a class="freelinking external" href="http://en.wikipedia.org/wiki/Synechdoche" rel="nofollow">synechdoche</a> or <a class="freelinking external" href="http://en.wikipedia.org/wiki/Ellipsis_(linguistics)" rel="nofollow">ellipses</a> but rhetoric never really was my <a class="freelinking external" href="http://en.wikipedia.org/wiki/Metaphor" rel="nofollow">bag</a>.</p>
    html_clean: |-
