      <p>Lubalin was a Futura man. (He used it in the AG magazine after the logo had been made, before he extended it into a typeface.)<br>
      Here’s how I ﬁgure he ﬁrst conceptualized the magazine logo:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AGfut_4089.png"></div><br>
      Finally:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/AgBig_3813.png"></div><br>
      It was the density of adjacent stems in AVA that prompted him to duplicate the effect elsewhere, hence the lop-sided A, V &amp;c., and the scrunched up digraphs NT &amp;c.<p></p>
