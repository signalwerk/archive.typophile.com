    <p>We have finally managed to kick FontLab Studio 5 (at least the Windows version) out of the nest. Cool new stuff includes:</p>
    <p>   - <em><strong>Autotrace</strong></em> is now included in the product. No need to go outside Fontlab to trace glyphs.<br>
       - Many new <em><strong>printing and proofing</strong></em> features, making it easy to get printouts at all stages of the font production process.<br>
       - <em><strong>RoboFab</strong></em> python library is now included in FontLab. Users get access to the Universal Font Object (.ufo) XML font format and to a bunch of improved python resources.<br>
       - New, improved <em><strong>metrics window</strong></em> incorporates a powerful new table that makes class-based kerning a snap and has a multi-line and context-based preview window so users can see how spacing and kerning will actually look in text without having to generate the whole font and print out samples.<br>
       - Support for <em><strong>Unicode 3.2 and 4.0</strong></em> means that users have access to virtually every character in Unicode.</p>
    <p>    The new price is US$649 and upgrades from FL4.6 go for US$99. A Macintosh version is also in the works and will enter beta testing shortly.</p>
    <p>   More details available at:<br>
    <a href="http://www.fontlab.com/The-News/Announcements/FontLab-Studio-5-for-Windows/" title="http://www.fontlab.com/The-News/Announcements/FontLab-Studio-5-for-Windows/">http://www.fontlab.com/The-News/Announcements/FontLab-Studio-5-for-Windo...</a></p>
    <p>Regards,<br>
    Ted Harrison<br>
    Fontlab Ltd.</p>
