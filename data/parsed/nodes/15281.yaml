    votes: null
    html: "<p>If you’ve drawn a circle, you can only toggle between curve or corner point (by double-clicking on the node). You can’t have a tangent point unless there is a straight line on one side of the point and a curve on the other. The double-clicking is contextual: if you have a corner point with curves on either side, double-clicking on it will make it a curve point. If you have a corner point with a curve on one side and a straight line on the other side, double-clicking will make it a tangent. If you have a corner point with a straight line on both sides, double-clicking won’t do anything, since there is no curve element to define a curve or tangent. So point type is dependent on adjacent line type, which is how it should be I think.</p>"
