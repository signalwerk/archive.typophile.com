      <p><em>Can you draw anykind of point and then change it (using the menu bar)?</em></p>
      <p>You mean change the kind of point you just made, or change the next kind of point you will make? If the latter, you can switch between different kinds of new points using either the toolbar of keyboard shortcuts. If you have already, for instance, made a corner point, and decide you want it to be a tangent you can covert the line on one side of it to a curve by alt+clicking on it, and then convert the point by double clicking on it. You don’t need to change tools during this operation: the operations available are contextual based on where you click.</p>
