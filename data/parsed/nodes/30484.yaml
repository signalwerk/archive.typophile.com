      <p>Right, TypeCo’s Gothic Gothic is way cool, especially the horizontal extension.<br>
      But I believe there is a history of “modernized” or reductive blackletter faces (the genre is pretty geometric from the outset with Gutenburg, anyway) such as Morris Benton’s Art Deco <a href="http://www.myfonts.com/fonts/bitstream/american-text">American Text</a> of the 1930s.</p>
