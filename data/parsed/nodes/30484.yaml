      <p>“Goth Punk” is a neat idea. That would entail taking a gothic typeface (not sans!) and giving it a punk setting — mixing style, and perhaps size and baseline shift. Here’s how it could look in FF Merlin, which has a variety of styles.<br>
      </p><div class="imageWrap"><img src="/files/goth_4917.png"></div><p></p>
      <p>Or you could mix blackletter “Gothic” with sans serif “Gothic” in the same word. And then add distress...</p>
