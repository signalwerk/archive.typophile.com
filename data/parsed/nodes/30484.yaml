    <p>Hi there. Need help finding font to use for the chapter openers of a book on the Films of Ken Russell. The publisher wants “gothic, gory, perverse, over the top.” If you’re not familiar with Ken Russell, you can check him out at imdb. He’s, shall we say, “irreverent.” I’d like to give it that b-movie feel, without it looking too much like a horror flick font (no dripping blood, etc.). Or maybe a kind of Goth Punk type . . . Any ideas?<br>
    Thanks,<br>
    Sarah</p>
