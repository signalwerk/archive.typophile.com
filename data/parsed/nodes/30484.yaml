      <p>I think getting the pub his “gorey, perverse” without looking like a horror flick face will be tricky. What about something snappy and clean from one face, with “eerie” rounded distressed for the rest? A Jeckyll &amp; Hyde sorta thing:</p>
      <p></p><div class="imageWrap"><img src="/files/horrortext_5650.jpg"></div><br>
      top: Chiller and !the troubles, bottom Perpetua and !MISQOT<br>
      (warning: two of those are mine, but that’s my bag.)<p></p>
      <p>&nbsp;<br>
      Consider, as well, the pulpy posters of 50’s “My zombie stepmother was a giant teen-aged were-space alien squid”-type films. Brushed strokes, black weights, tilted baselines. And non-dripping heavy vertical perspectives. Or anything shattered, though thats more just dated than camp.</p>
      <p>Or look at anything here (pay and free):</p>
      <p><a href="http://www.astigmatic.com/index.html" title="http://www.astigmatic.com/index.html">http://www.astigmatic.com/index.html</a></p>
      <p>—-<br>
      Nick: What I wouldn’t give to do the <a href="http://www.myfonts.com/fonts/typeco/gothic-gothic/">macabre restyling of this</a> as a luridly distressed face. Gothic Gothic Gothic.</p>
