    html: |-
      <p>yes, with K.L.help. i copy his solution to keep it here for anybody else:</p>
      <p>You need to do two things --<br>
      (1)<br>
      Go to the OpenType Panel (which contains the feature code)<br>
      and delete all the class definitions from the bottom-right<br>
      part.<br>
      (2)<br>
      Go to FontLab Options/Preferences (depends on whether you<br>
      use Windows or Mac),<br>
      click through the submenus "General Options" and "Unicode<br>
      and OpenType" -- and therein activate both options:<br>
      "Add all glyph classes [...]"<br>
      and<br>
      "Do not add metrics classes"</p>
      <p>Now go to the OpenType Panel again and compile. Over<br>
      here this worked well without error message.</p>
