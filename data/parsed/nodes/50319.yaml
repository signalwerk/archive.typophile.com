    <h2><a href="/node/50334/" title="Typophile Welcomes Ngoc Ngo" class="link-kept">Typophile Welcomes Ngoc Ngo</a></h2>   <p>We’re pleased to announce Typophile’s first dedicated employee. <a href="/user/33598/" class="link-kept">Ngoc Ngo</a> is a seasoned consultant and an MFA candidate focused on graphic design at <a href="/wiki/Academy%252Bof%252BArt%252BUniversity" class="wiki-create link-lost">Academy of Art University</a>. He has joined <a href="/wiki/Punchcut" class="wiki link-lost">Punchcut</a> at our San Francisco office and will be engaged on a number of initiatives for this site and for the Typophile community. </p>
    <p>We’re looking forward to the traction that he’ll bring to our modest world domination plans. Please say hello!</p>
