    <p>Hello one and all.</p>
    <p>I am sort of new here. I have posted a couple of times and never really introduced myself. My name is Joseph and Im a typoholic. I am a graphic designer from NYC, and have loved letters most of my life. Even in grade school my only A on my report card was in penmenship. It hasn't been untill recentley have I really focused my attention into the development of type, and have started to try and develop my own fonts. I started out drawing letters were they were always trying to be different, but not different were I would be actually breaking the rules, but by doing what I wanted without really knowing the rules. So from here I read, and I read, and I read everything I could get my hands on about type. Then I decided to start simpe, learn the rules and eventually I will be able to go back were I started. And that is what I wanted to do with this font. Right now it is only an uppercase font, and eventually I think I would like to add a small caps.</p>
    <p>Please let me know what you think. I would greatly appreciate your thoughts.</p>
    <p>Thanks.</p>
    <p>joseph</p>
