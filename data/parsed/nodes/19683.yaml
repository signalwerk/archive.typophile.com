      <p>B: width-difference between top and bottom parts too strong for my liking<br>
      G: the left doesn't feel round, as O,Q, C seem to be based on perfect circles (if that is what you want)<br>
      M needs work on the ankles, feels to fat/dark there, N too.<br>
      S: top too small compared to bottom.<br>
      U: too wide</p>
      <p>2,6,9: look too constructed compared with the rest, i'd round the joints  of the straight stroke with the circles in 6 and 9 more.<br>
      7: horizontal stroke too wide<br>
      0 (Zero) feels too wide compared to your other numerals - or try to make it more oval.</p>
      <p>All in my humble opinion of course.</p>
