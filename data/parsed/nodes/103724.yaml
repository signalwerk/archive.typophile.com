    <p>I am looking for a font called Oriya MN. I can't find it available for purchase anywhere. It seems to be a OS X Mountain Lion system font</p>
    <p><a href="http://support.apple.com/kb/ht5379" title="http://support.apple.com/kb/ht5379">http://support.apple.com/kb/ht5379</a></p>
    <p>If anybody could point me in the right direction, of how to legally obtain the font, that would quite awesome. Also, if instead one can name an alternative font, that may do the trick. I need the font to create artwork for a sign. My customer specified the font on their end.</p>
