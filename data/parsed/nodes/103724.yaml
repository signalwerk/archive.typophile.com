    html: <p>You should note that Apple and Microsoft use different layout and font technologies for handling Indian scripts such as Oriya. The Oriya MN font on the Mac most likely uses AAT layout tables, while an Oriya font for Windows will need OpenType layout tables. While it is possible that an OpenType  version of the Oriya MN font may exist, it might have a different name. I don't have the Oriya MN on my older Mac system, so can't suggest an alternative unless you can provide an image.</p>
