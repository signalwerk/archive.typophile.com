      <p>I might have missed it somewhere in the thread but…</p>
      <p>1. What type of work do you do?<br>
      2. Who are your clients (current/future)?<br>
      3. What are your goals?</p>
      <p>Without a clear definition of context we're simply taking aesthetic shots across the bow until someone gets lucky. Clear definition of context lets you base decisions on fitness for purpose. As this removes guesswork, it is often significantly more efficient and provides you (and your clients) a greater return on investment. However, I'm a hardcore functionalist.</p>
      <p>Regarding the type, I think the type face is fine, but it could use some kerning. Additionally, typographic <em>convention</em> considers letter-spacing (tracking) capital letters to be more "sophisticated." Additionally, it is believed that it assists in individual character recognition but I have yet to read a study that supports this claim (thesis topic).</p>
