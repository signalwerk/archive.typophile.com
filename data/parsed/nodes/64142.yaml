    html: |-
      <p>Re: Keep or lose the box...</p>
      <p>Keep the box.  It provides the mane of the lion.  Makes it read clearer as a lion.</p>
      <p>Re: Alaskan</p>
      <p>I agree.  The type should appear either under the logo or to the right of the logo.  There should be some relationship between the width or height of type to the logo.  If the type is placed underneath, then justify the type to the width of the logo.  If the type is placed to the right, justify the size of logo between the the baseline and cap-height of the type.  Of course this will give more prominence to the logo to the type.  Say either your mark is more important or your name is.  </p>
      <p>Another thought regarding typography selection.  If stay with a geometric font I would justify the size as described above.  However, if you are looking for contrast, you might go with a script or some other "less blocky" font to contrast with the logo's blockiness.  However, that depends on the personal aesthetic you are trying to convey to a would-be client or employer.  Are you projecting: "I am good at maintaining continuity and relationships in my design."  or, "I am good at conveying tension, conversation, or counterpoints, in my design."  I am echoing "altaira", above.</p>
      <p>Either way, the logo is aesthetically pleasing and feels like a mark.  </p>
      <p>Best.</p>
    html_clean: |-
