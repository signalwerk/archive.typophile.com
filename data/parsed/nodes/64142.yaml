      <p>First thoughts: I really like it, especially the face! The type is tasteful as well.<br>
      You could easily use it like this, but if you would ask me how you could improve it I would look at the following: It's a bit too perfect and neat now, the logo is all boxed up and the type is centered under it. I think it would do the face more justice if you tried to find a more exciting combination with the type and the colours. It could be a bank logo now, make it a bit more into a designer logo (whatever that may be), experiment a bit more, do some weird stuff. So I think the elements are all good, but play around a bit more and don't go for the classical solution neccesarily. And try to find a typeface that is a match for your lion logo ;)</p>
      <p>Keep us posted!</p>
      <p>greetings Jeffrey<br>
      <a class="freelinking external" href="http://www.infraordinaire.com/wordpress" rel="nofollow">infraordinaire</a></p>
