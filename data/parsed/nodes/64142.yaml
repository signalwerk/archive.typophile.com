    html: |-
      <p>Additional tips on a purely syntactic level:</p>
      <p>1. Do a black and white version. Do this for black on white <em>and</em> white on black. This will raise the "should I put a box around it?" issue. If you don't go with a "box" for dropouts, then you'll need to think consistent safezone.</p>
      <p>2. Do the same for greyscale. When you reduce your colour palette to greyscale it will surface colours with different hues but similar saturation and brightness.</p>
      <p>3. Reduce the size of your icon to 32 x 32 pixels to see how it fairs as an icon.</p>
      <p>4. What's the smallest size possible it will ever appear? Screen and print. Chances are the type won't be any smaller than eight points. Is the icon still legible at this size?</p>
