  html: |-
    <p>I wonder if there is any reliable independent platform around which gives comparative information about fonts in their possibly latest versions. I have in mind not so much a search like “free funny christmas fonts” but rather specialised requirements, e.g. in science.</p>
    <p><a class="freelinking external" href="http://www.alanwood.net/unicode/index.html" rel="nofollow">Alan Wood’s Unicode resources</a> have been rightfully much acknowledged in the past. But it seems to be heavily out of date, at least with its detailed font informations. No wonder, this is hardly a task to be solved forever by one single man.</p>
    <p>What do you fellow typophiles make of <a class="freelinking external" href="http://www.identifont.com/index.html" rel="nofollow">Identifont</a>?</p>
    <p><a class="freelinking external" href="http://www.fontscape.com" rel="nofollow">Fontscape</a> seems to offer a promising approach, yet the selections presented seem to be rather arbitrary – and very limited.</p>
    <p><a class="freelinking external" href="http://www.wazu.jp/index.html" rel="nofollow">Wazu Japan’s page</a> seems to have not been updated for some two years as well; however, it offers an interesting online <a class="freelinking external" href="http://www.wazu.jp/gallery/Test_Coptic.html" rel="nofollow">font testing functionality</a>.</p>
    <p>An universal, comprehensive and detailed font information system – Utopian?</p>
