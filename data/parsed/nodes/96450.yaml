  html: <p>I heavily modified a letter from a typeface and will be displaying it on my site as a portfolio piece. My questions is, would this be considered "lettering" or "type"?</p>
  html_clean: <p>I heavily modified a letter from a typeface and will be displaying it on my site as a portfolio piece. My questions is, would this be considered "lettering" or "type"?</p>
