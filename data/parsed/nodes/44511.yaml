  html: |-
    <p>I'm curious what most folks here think about "fake italics" on the web, the slanted rendering of non-italic faces when viewed in web pages.  This occurs when font families lacking italic faces are used in a webpage.  Common fonts such as Tahoma are like this, even Helvetica under Mac OS X 10.4:<br>
    <code><br>
      font-family: Tahoma, Helvetica;<br>
      font-style: italic;<br>
    </code></p>
    <p>Browsers are forced to do this for backwards compatibility but it seems like it would be nice to have a way of signaling "no fake italic dammit!" so that the browser would either use a non-italic face or fall back to a font family with a real italic face.</p>
    <p>Same holds true for fake bolding.</p>
