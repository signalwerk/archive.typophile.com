      <p>It’s the designer’s responsibility:<br>
      If you set Tahoma as the primary typeface, and assign italics to certain passages, then you’ll get Tahoma Fake Italic – of course.<br>
      In consequence: If you want true italics, don’t specify Tahoma. Period.</p>
