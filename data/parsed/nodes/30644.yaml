      <p>I'm looking forward to taking a closer look, but for the moment and as another option to consider, I've been using Proxima's FontExpert 8 since it came out last year and have been quite pleased with it. Not only does it have a nicely customizable interface (my layout is split between font groups, a visual listing of each group's contents (in the fonts themselves), a full character map pane, a file properties pane, and a customizable specimen pane). FontExpert has a plug-in for auto-activation in InD CS2, but it does have a fairly significant lag in opening an InD file where activation is called up (due to the fact that the FontExpert is not running in the background but must be "started" each time a font is called-up).</p>
      <p>In the last version of Suitcase I found a variety of fonts would de-activate on their own (primarily semibold Adobe fonts), so I'll be curious to see if this bug has been fixed, and to see how smoothly the auto-activation works.</p>
