      <p>There are a couple of slightly confusing things about this release. It's actual name will be "Windows Client for Suitcase Server X1" because it connects to Suitcase X1 Server. So within the Suitcase line there is Suitcase X1 Client now for both Mac OS and Windows. Suitcase Fusion is the current standalone version for Mac. However, this new release does have a Vault and FontSense powered plug-ins, so in some ways it would have made sense to call it "Suitcase Fusion for Windows". The product is definitely a move towards cross-platform feature parity.</p>
      <p>The good news is that this release adds features that customers have been asking for, regardless of what it says on the box. When Suitcase 9.2 was designed, it was more or less intended for single-user systems where the user was a local admin. For many current business customers this was a problem. The new release keeps user-specific settings where they should be, and can accomodate situations where the user is not an administrator. </p>
      <p>The broad support for windows versions is also aimed at business customers. On the Mac, a huge percentage of customers are using 10.4, with almost no one using 10.3 or 10.2. On Windows I'm expecting corporate customers to stick with XP or even 2000 for quite a while. Standalone customers are going to be getting Vista with their new systems. So, there will probably be a need for compatabiltiy on both ends.</p>
    html_clean: |-
