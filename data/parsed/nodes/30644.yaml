      <p>It is my understanding that the font activation engine has been significantly redesigned. This may have an overall effect on the way in which applications recognize active fonts, although I only have a fairly shallow understanding of how the technology works. </p>
      <p>It's been a while since I tried FontExpert, but my impression is that Suitcase's UI will continue, for good or bad, to be less complex. Suitcase 11 will look basically the same, with most of the differences related to functionality. I think the reasoning is that an average graphic designer should be able to manage fonts without reading a manual. </p>
      <p>If you try it out, let us know what you think. I think it should be out in a month or so.</p>
