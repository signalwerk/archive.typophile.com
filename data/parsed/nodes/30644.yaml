      <p>I suppose you're right, but for a face like, say, Fedra Pro, it would be a royal pain to compile a glyph list (over 2,000 glyphs), and even then other fonts might include additional ornaments, alternates, etc., and thus creating a full character set list for any and all fonts would be mind-numbing. Having said that, I can see the work it would take to implement such a preview option into the font manager, but that's no reason not to expect/request such a feature.</p>
      <p>FontExpert has a long list of available character set preview options, but even here there is no option for seeing everything at once. Depending on how the font was encoded, for example, you may or may not see the small caps when you select "All Defined Characters" from the top of the Character Table viewing list.</p>
