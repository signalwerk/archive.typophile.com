      <p>Currently Suitcase has four ways of previewing a font: Waterfall, ABC 123, Paragraph and Quicktype. Quicktype is what I use the most because I often have a word or phrase that I want to see displayed in the font I'm going to use. </p>
      <p>That said, for type designers or other power users, it would be very useful to see the full contents of the font enumerated. What would be different about this sort of view is that, for performance reasons, it would probably be better to view only once face at a time. Rather than scrolling through several selected fonts, the view pane would have to allow the user to scroll through one selected font. It would be nice to quickly compare say, Helvetica and Helvetica World, for example. </p>
      <p>Type designers would benefit from a feature like this because it would make it easier for font users to access advanced features. If end users have an easy way to use ornaments and alternates, they are more likely to see the value in purchasing high-quality fonts.</p>
