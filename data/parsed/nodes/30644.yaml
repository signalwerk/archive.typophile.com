      <p>High-Logic's MainType is really nice. I have trialled all the other Windows options and MainType is by far the best. It's fast and easy to use, but very powerful.<br>
      The main thing I like about it is that it doesn't try to 'organise' your fonts for you. If your fonts are already organised how you like, it will work with this.<br>
      You can browse your active fonts or fonts in folders elsewhere on your computer. You get to see a sample preview which you can easily type over or revert to a number of presets, plus a full character map. You also get a choice between activating and permanently installing fonts.<br>
      Hope this helps.<br>
      btw I don't work for them, just seems that people have a lot of trouble finding decent, stable font managers for Windows!</p>
