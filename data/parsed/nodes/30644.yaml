    <p>I thought I would post this, since there have been a few lively threads about font management for Windows.</p>
    <p><a href="http://www.extensis.com/en/about/press_release_content.jsp?releaseId=6000020" title="http://www.extensis.com/en/about/press_release_content.jsp?releaseId=6000020">http://www.extensis.com/en/about/press_release_content.jsp?releaseId=600...</a></p>
    <p>Basically, the new version adds features that Suitcase customers have been wanting for some time. Most importantly, it will use FontSense powered, plug-in based auto-activation for InDesign, Illustrator and Quark. It also has a Vault system like Suitcase Fusion which will allow users to backup their database and fonts. It will be compatible with Windows 2000, XP and Vista. Disclaimer: I work for Extensis.</p>
