      <p>I looked for something with squarish counters and an R with the leg coming from near the stem. Came up with <a href="http://new.myfonts.com/fonts/typodermic/gnuolane/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Gnuolane</a> by Ray Larabie.</p>
