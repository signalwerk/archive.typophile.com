    html: |-
      <p>I looked for something with squarish counters and an R with the leg coming from near the stem. Came up with <a class="freelinking external" href="http://new.myfonts.com/fonts/typodermic/gnuolane/">Gnuolane</a> by Ray Larabie.</p>
      <p>You would need to flatten the type, or widen it, but I think you could look rather close.</p>
      <p>- Mike Yanega</p>
