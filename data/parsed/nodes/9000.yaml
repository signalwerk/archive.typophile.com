    html: <p>You can't. They are not part of the standard Mac keyboard layout.  <br> <br>Most commercial fonts include them because they are part of the standard Windows keyboard layout. If you have OS X you can use the system Character Palette to input them into some (most?) programs. In more recent Adobe apps you can use the Glyph palette.</p>
