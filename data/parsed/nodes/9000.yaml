    html: <p>Not sure about you, but I use the "British Extended" layout, and on this, pressing minus on the keypad gives me a − (U+2212), and pressing option-asterisk on the keypad gives me a × (U+D7; and option-slash gives me a ÷ too; U+F7).</p>
