    votes: null
    html: |-
      <p>Use smart/typographic quotes is an option enabled by default in IL and ID. Just disable it.</p>
      <p>ID: Edit &gt; Preferences (or Ctrl/Cmd+K). It's inside the Type group.<br>
      IL: Type &gt; Smart Punctuarion.</p>
      <p>Note that both apps may apply quotes according to the language defined for the text. This may be edited in ID through the Dictionary group in Preferences. Quotes vary a lot according to language and country.</p>
