    html: |-
      <p>In FontLab, verify if the vertical lines fulfill the height for the glyph. In other words, if you are working with a 1000 upm, your glyph must have this height.</p>
      <p>In InDesign, verify if the leading equals to the type size. ID default is to apply automatic leading with 120% of the type size.</p>
