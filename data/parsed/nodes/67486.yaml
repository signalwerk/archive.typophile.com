  html: |-
    <p>Hello there, and thank you for giving your time, here is my case :</p>
    <p>I'm working on a 'liney' font (I mean that all the characters are connected each others by lines, horizontally &amp; vertically) and managed to make it work in Fontlab.</p>
    <p>No problems here, and I'm quite proud of my work!</p>
    <p>When I generate the font, everythings seems to be okay, and it's working nicely in TextEdit. Kerning, line-spacing, hinting are what I expect.</p>
    <p>Problems are coming when I use this font in other softwares :</p>
    <p>- Adobe programs (I've tried on Illustrator, Photoshop &amp; InDesign). Kerning is working but the line-spacing is higher than what I want, so vertical lines are "disconnected".</p>
    <p>When I saw this, I tried with a non Adobe soft, so I've launched iWeb and had a new surprise :</p>
    <p>Kerning and Line-spacing are higher than what it would be, even if all lines are connected.</p>
    <p>I tried googling on this, but didn't find anything to help.</p>
    <p>If someone here needs extra info about my FontLab preferences or anything else, please do.</p>
    <p>Thanks by advance for your help,</p>
    <p>Bernard.</p>
