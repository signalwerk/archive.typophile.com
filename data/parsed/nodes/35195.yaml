      <p>You should keep in mind, that the whole concept of connecting lines is peculiar to the Latin script and almost unknown for the Greek writing (and early Greek printing). Most Greek ligatures are formed by such a way that the involved characters share some of their basic features and, naturally, may lose their components which would be considered important otherwise. This is more like Latin ’ae’ than ’ct’. In case of ’omicron-upsilon’ and ’sigma-tau’ the connection is very close indeed, and yet both parts are still recognizable (sigma-tau is essentially a lunate sigma over a tau, although the right arm of the tau is not present in most designs), none of them being abandoned or completely subdued by another. That’s why I still think they are ligatures, and they were always considered ligatures in the literature devoted to the history of the Greek printing.</p>
      <p>Another reason for which I think the term “abbreviations” is inappropriate here is that it normally denotes an entity which is used to substitute a specific word, or a specific morpheme, rather than just a common sequence of letters. Cf. the case of the Greek “kai” symbol: it corresponds to the Greek conjunction “kai”, but, of course, not just to the ’kappa-alpha-iota’ letter sequence. But of course this might be just a terminology issue.</p>
