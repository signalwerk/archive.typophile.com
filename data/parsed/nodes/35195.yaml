      <p>In my heavily ligatured Greek font, I used a two-level approach. Simple, tying ligatures that I was happy to have active by default went in the ’liga’ feature; more elaborate, archaic ligatures went in the ’dlig’ feature. Given the definition of GSUB layout features and their current implemantations, I would be confident putting contextual lookups in any feature. So in the case you describe I would probably put appropriate contextual lookups for these ligatures in the ’dlig’ feature.</p>
      <p><em>I am wondering, however, why the OT specification forces developers to resort to such ugly tricks if only they want to strictly follow it.</em></p>
      <p>You need to bear in mind that many of the OTL feature definitions were written at a time when no one had actually implemented OpenType Layout. They represent Microsoft and Adobe’s best guess at what would be desirable and how it might work. Also bear in mind that the feature descriptions are not part of the OT specification proper: they are an appendix. I consider them, after many years of discussion with Microsoft and Adobe engineers and managers, as informational and suggestive, rather than binding. The only restriction I recommend and adhere to is that GSUB and GPOS lookups should not be mixed in the same feature and that a clean distinction should be made between GSUB and GPOS features.</p>
      <p>I have suggested in the past that a more sensible feature model would have allowed for three states for any layout feature — required (on by default, cannot be turned off), desired (on by default, can be turned off), and discretionary (off by default, can be turned on) — and any feature could explicitly include either non-contextual lookups, contextual lookups, or both. But this is a hypothetical suggestion (and something to bear in mind when spec’ing the font format of tomorrow).</p>
