      <p>I seem to recall that Unicode’s justification for the alternate forms of β, ρ, κ, π, φ, and θ is that the alternate glyphs are used by Greeks when they need to represent pi the number, as opposed to pi the letter.  I could be wrong, so a Greek here could correct me, but I’m pretty sure that that was the justification, just like the Fraktur letters are encoded, even though technically they are just a particular style of the Roman alphabet, they are used for specialty purposes in mathematics where they contrast with the Antiqua forms.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
