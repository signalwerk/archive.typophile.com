      <p><em>the whole concept of connecting lines is peculiar to the Latin script and almost unknown for the Greek writing</em></p>
      <p>I’m afraid I don’t see it that way. IMO, ligatures are inherently connecting strokes used in cursive writing, and “Byzantine” Greek typography is full of them. A very basic instance: many fonts had an epsilon-iota ligature in which the normal “flipped 3” epsilon was replaced by a lunate form, with the central stroke “ligaturing” over to the iota.</p>
      <p><em>they were always considered ligatures in the literature devoted to the history of the Greek printing.</em></p>
      <p>I’m no expert on that.<br>
      I have been influenced by C. S. Van Winkle’s <em>The Printer’s Guide</em> (Printer to the University of New York), 1818, see below.</p>
      <p></p><div class="imageWrap"><img src="/files/Greek_4711.jpg"></div><p></p>
      <p><em>The problem is that you cannot put Greek glyphs into the same set basing just on their shape and Unicode mappings, but ignoring the history of each particular letterform.</em></p>
      <p>That’s a good point, and I was aware of the beta usage, and I will implement it contextually.</p>
      <p>Nonetheless, I do think that the idea of grouping the scripty verisons into a stylistic set is practical, as it offers the typographer a choice between a plain, contemporary default, and a look which is older and more ornate. That is why I would make the Latin kappa the default. I will post some comparisons specimens shortly.</p>
      <p>I don’t really consider my serif face to be in the German style, as it based on applying the structural forms of the mid-19th century American Scotch Modern to the Greek alphabet. When I did the same for Cyrillic, with no knowledge of 19th century Cyrillic faces, I subsequently discovered that the process produced results that were remarkably close to actual Cyrillic faces of the 19th century, so I have confidence in this approach.</p>
