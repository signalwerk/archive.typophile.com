      <p>The problem is that you cannot put Greek glyphs into the same set basing just on their shape and Unicode mappings, but ignoring the history of each particular letterform. For example, in your particular case I would probably make the x-shaped kappa and the “scripty” rho the default forms, as they would be more appropriate for a typeface implemented in a German style. Curly beta represents a completely special case (it should never be used for typesetting classical Greek, unless the French contextual rule is applied), so please don’t put it into the same stylistic set with “scripty” theta, or you will make that set completely unusable.</p>
      <p>On the other hand, you have correctly noticed that Unicode itself breaks the idea of grouping “scripty” forms together in an alternate set by making loopy phi the default glyph. I would also mention the case of epsilon, which is very similar, as obviously the default 8-shaped form is more “calligraphic” than Porsonic (lunate) one. Practically this means it is impossible to be fully conform with the Unicode code chart if you want to make the default set of your Greek letters look really good together.</p>
      <p>Fortunately the shapes shown in the codechart are by no means prescriptive. The difference between the “default” and “alternate” forms may be really important only in mathematical contexts, and the ’mgrk’ feature can be used to resolve this problem. So there is actually no need to “follow Unicode” at this point.</p>
    html_clean: |-
      <p>The problem is that you cannot put Greek glyphs into the same set basing just on their shape and Unicode mappings, but ignoring the history of each particular letterform. For example, in your particular case I would probably make the x-shaped kappa and the “scripty” rho the default forms, as they would be more appropriate for a typeface implemented in a German style. Curly beta represents a completely special case (it should never be used for typesetting classical Greek, unless the French contextual rule is applied), so please don’t put it into the same stylistic set with “scripty” theta, or you will make that set completely unusable.</p>
      <p>On the other hand, you have correctly noticed that Unicode itself breaks the idea of grouping “scripty” forms together in an alternate set by making loopy phi the default glyph. I would also mention the case of epsilon, which is very similar, as obviously the default 8-shaped form is more “calligraphic” than Porsonic (lunate) one. Practically this means it is impossible to be fully conform with the Unicode code chart if you want to make the default set of your Greek letters look really good together.</p>
      <p>Fortunately the shapes shown in the codechart are by no means prescriptive. The difference between the “default” and “alternate” forms may be really important only in mathematical contexts, and the ’mgrk’ feature can be used to resolve this problem. So there is actually no need to “follow Unicode” at this point.</p>
