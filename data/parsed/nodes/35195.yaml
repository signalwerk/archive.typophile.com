      <p>Well, I considered solutions like these, and they don’t look very elegant, especially because I have no special “historic” forms for most letters, so that, indeed, I have to create a set of exact duplicates of my regular letters. In fact, I would prefer to assign a lookup type 8 to ’hlig’, if there are no strict “contraindications” against such practice (at least with ICU/XeTeX my lookup works just fine). </p>
      <p>I am wondering, however, why the OT specification forces developers to resort to such ugly tricks if only they want to strictly follow it. I think it would be quite possible either to define special features for historic contextual ligatures (and historic contextual alternates), or to explicitly allow using different lookup types for ’hist’ and ’hlig’.</p>
