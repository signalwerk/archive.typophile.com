      <p><em>it is really difficult to distinguish ligatures from abbreviations </em></p>
      <p>I don’t think so.<br>
      In ligatures, two characters are joined by a ligating element — as is most obvious in the Latin “quaints” c_t and s_t.<br>
      However, in the omicron-upsilon and sigma-tau combinations, the individual characters are lost in a composite form that quite literally abbreviates (removes) parts of the components. There is no sense of two characters being joined by a ligature, or extra material. In fact, rather than the addition of a joining component or ligature, body parts are removed.</p>
      <p>Some interpretations of omicron-upsilon look like somewhat like an upsilon sitting on top of omicron, but where is the ligature that joins them? Other versions, such as my italic here, are even further removed. In sigma-tau, where is the stem of the tau?</p>
      <p></p><div class="imageWrap"><img src="/files/abbrvs_6355.jpg"></div><p></p>
      <p>This compression is quite different from ligation.</p>
