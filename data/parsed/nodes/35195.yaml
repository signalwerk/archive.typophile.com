      <p>I am putting historic forms in the Greek fonts I’m working on.<br>
      There are the Unicode “historic variants” of beta, kappa, theta, phi, pi, sigma, cap upsilon, etc., abbreviations, and the “number” forms of koppa etc.</p>
      <p>Because they break down into categories which don’t fully correspond to a neat split between contemporary and historic, I am avoiding any “hist” designations, and arranging them in Stylistic Sets<br>
      The categories are:<br>
      - contemporary (default)<br>
      - “scripty” historical variants<br>
      - obscurely historic (round sigma and omega-shaped pi)<br>
      - historic abbreviations</p>
      <p>The “kai” character is included, but no actual ligatures — however, I am including a fully marked set of omicron-upsilon abbreviations, and the sigma-tau abbreviation.<br>
      Because these are abbreviations, not ligatures, they are going in a Stylistic Set.<br>
      As far as I am aware, these abbreviations were well-used in classical Greek typography of the 18th and 19th century, so are appropriate to 19th-century revivals, which is what my faces are.</p>
      <p>The scripty “historical variants” of theta etc. seem quite at home today, especially in light of the orthodoxy (as represented by Adobe, Microsoft, and GFS) that Greek is inherently scripty, and their inclusion in Unicode as separate characters with their own code points, which mandates their inclusion in any fonts with pretensions of completeness.</p>
      <p>IMO, making them separate characters is absurd, like making the single and double-bowl “a” and “g” in Latin separate characters, or, for that matter, Roman and Italic.</p>
