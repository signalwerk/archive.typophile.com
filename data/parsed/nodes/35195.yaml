      <p>Thank you, John, this is exactly what I wanted to know. Just a small question: are there any particular reasons to prefer ’dlig’ over ’hlig’ for historical ligatures? I always supposed that ’dlig’ is intended for those cases where it is impossible to determine the applicability of a particular ligature in the given context with a simple algorithm, so that the user has to turn the feature on and off whenever appropriate (as with standard f-ligatures in German and ae/oe in Latin). Since there are similar cases in Greek, I planned to put them into ’dlig’, keeping ’hlig’ for more “safe” ligatures, which normally don’t require any manual control.</p>
      <p>I also would be very interested to know, which exactly ligatures you have defined in your Greek font, and which of them have been placed to ’liga’. I am asking this, because designing Greek ligatures is a captivating process... but, I think, it is necessary to stop somewhere, especially because historic ligatures are not going to be actively used anyway. So it would be interesting to determine a minimal set of ligatures sufficient for achieving an effect of an “old style” charm. That’s why I would like to know how other developers resolve the same task.</p>
