      <p>Nick: <em>However, in the omicron-upsilon and sigma-tau combinations, the individual characters are lost in a composite form that quite literally abbreviates (removes) parts of the components.</em></p>
      <p>But this is true of very many of the Byzantine cursive ’ligatures’, so unless one is going to invent some new term for them one has to accept two different kinds of ligatures. Terminologically, I sometimes use the distinction tying ligatures and morphographic ligatures.</p>
      <p>I don’t think calling things like omicron_upsilon and sigma_tau ’abbreviations’ is a good idea, because this is misleading. Abbreviation implies to me that letters are missing from the text, i.e. that the character string is abbreviated, regardless of how the resulting text is displayed. In the omicron_upsilon and sigma_tau ligatures, the two letters are very much present, even if they are not in their regular form. There are other sequences of both ligated and unligated letters in Greek and also in Latin that are actual abbreviations — e.g. nomina sacra — and these need to be independently analysed at an orthographic level, and hence at a text encoding level, not at the visual/glyph level.</p>
