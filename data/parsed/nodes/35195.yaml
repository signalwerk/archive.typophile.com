      <p>Nick,</p>
      <p>I don’t think omicron-upsilon and sigma-tau can be called abbreviations. The only point at which they are different from standard Latin ligatures is that they are formed from vertically (not horizontally) stacked elements, but, I think, this doesn’t prevent them from being real ligatures at any other aspects. But, of course, it is really difficult to distinguish ligatures from abbreviations as the early Greek printing is concerned.</p>
      <p>I also don’t believe all Greek letterforms defined in Unicode can be easily separated into categories you have listed. Let’s take “script” theta for example: it would be completely wrong idea to assume that this form is intended mainly for script or italic typefaces. In fact, it is as “contemporary” as the closed form, and it is a matter of typographic conventions to decide which one should be preferred. For example, in traditional German (and Russian) typography the “closed” theta was almost unknown, and the loopy form is still considered normal and preferred in most contexts.</p>
