      <p>The variant Greek letters are in Unicode because they occur in mathematics with distinct semantics. This is why the Unicode characters names refer to them ’symbols’ even though they have letter properties. This isn’t about Greeks using the letters as numbers, but about mathematicians using them as symbols.</p>
      <p>Greeks traditionally did use letters as numbers, but so far as I can tell they did not favour particular variant forms for this purpose.</p>
