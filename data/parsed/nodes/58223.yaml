    <p>Howdy, I've got two styles of catchwords in my font and was wondering what feature (or combination thereof) to put them in.</p>
    <p>Ornaments, Stylistic Set or Titling Alternates seem to make the most sense with titl having the broadest support.</p>
    <p>However the only way to get them to work in photoshop is via dlig or salt. Is there a problem with having the functionality in both titl and salt?</p>
    <p>Thinking of something like:</p>
    <p>titl<br>
    - - -<br>
    sub A N D by AND.catch;<br>
    sub A n d by AND.catch;<br>
    sub a n d by AND.catch;<br>
    sub ampersand by AND.catch;</p>
    <p>salt<br>
    - - -<br>
    sub AND.catch by AND.catch.alt;</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/catch22_5418.gif"></div><p></p>
