    html: |-
      <p>Yes, if you name your glyph A_N_D.catch then Acrobat will be able to find the glyph in a PDF* if the user searches for the text "AND". If you use a name AND.catch, then Acrobat will "think" that it is just an unknown glyph. </p>
      <p>I recommend reading the Glyph Naming and Encoding chapter of the FontLab Studio 5 user's manual. </p>
      <p>*) This only applies to some PDFs, depending on the way they were created. In some scenarios, Acrobat will still find AND.catch, but the name A_N_D.catch is safer and works in more occasions. </p>
      <p>Cheers,<br>
      Adam</p>
