    html: |-
      <p>Presumably you want to only perform these substitutions when the input string is not directly preceded or followed by another letter, otherwise you'll get the substitutions happening in words like ‘m<em>and</em>ible’.</p>
      <p>I don't think there is a problem with implementing the same substitution in more than one feature so long as there is a reasonable interpretation of the purpose of the features. I would be inclined to use dlig rather than salt, though.</p>
