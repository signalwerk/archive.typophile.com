      <p>Chris, I'd attack the problem as John suggests, from the other way. Make am OT Class @lettersonly, and ignore sub when this is adjacent to the target string. That way "mANDible" is ignored, whilst "'The...'" would be.</p>
      <p>ignore sub @lettersonly A N D ;<br>
      ignore sub A N D @lettersonly ;<br>
      sub A N D by AND.catch;</p>
      <p>- - -<br>
      Whoops, that didn't work. Not sure how to ignore a string of letters:<br>
      ignore sub @lettersonly A' N' D';</p>
      <p>Help?</p>
      <p>Interesting John, dlig for everything? I also have s and c dligs. Seems weird to have catchwords in their too?</p>
