    <p>While looking for angular scripts similar to Loupot I stumbled over a <a href="http://www.flickr.com/photos/hardwig/3055396859/" rel="nofollow">flickr post</a> by our very own Florian Hardwig (see image below) and I am wondering whether there are some others worth mentioning? </p>
