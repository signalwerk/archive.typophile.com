    html: |-
      <p>The list from Ryuk was pretty good for angular, but maybe some of the heavy German styles should also be considered? They are not all angular, exactly, but the feel is similar in my opinion. See Tobias Frere-Jones' version of Imre Reiner's <a class="freelinking external" href="http://new.myfonts.com/fonts/fontbureau/reiner-script/" rel="nofollow">Reiner Script</a> (1951), Reiner's <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/mercurius-bold-script/" rel="nofollow">Mercurius Script</a> (1957); Reiner's <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/matura-mt/" rel="nofollow">Matura</a> (1938), Reiner's 'Mustang' (revived by Patrick Griffin as <a class="freelinking external" href="http://new.myfonts.com/fonts/canadatype/hunter/" rel="nofollow">Hunter</a> (1956), W. Wege's <a class="freelinking external" href="http://new.myfonts.com/fonts/berthold/signal-bq/" rel="nofollow">Signal</a> (1931), Georg Trump's <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/time-script-lt/" rel="nofollow">Time Script</a> (1956), Heinz Schumann's <a class="freelinking external" href="http://new.myfonts.com/fonts/urw/stentor/" rel="nofollow">Stentor</a> (1964); Herbert Thannhaeuser's 1954 'Kurier' (revived as <a class="freelinking external" href="http://new.myfonts.com/fonts/canadatype/puma/" rel="nofollow">Puma</a> by Rebecca Alaccari, Thannhaeuser's <a class="freelinking external" href="http://new.myfonts.com/fonts/canadatype/lotto/" rel="nofollow">Lotto</a> (1955), George Hauser's <a class="freelinking external" href="http://new.myfonts.com/fonts/redrooster/hauser-script-rr/" rel="nofollow">Hauser Script</a> (1937), Rudolf Koch's 1927 'Kurrent' revived by Sudtipos as <a class="freelinking external" href="http://new.myfonts.com/fonts/sudtipos/divina/" rel="nofollow">Divina</a>, Paul Zimmermann's <a class="freelinking external" href="http://new.myfonts.com/fonts/bitstream/impuls/" rel="nofollow">Impuls</a> (1945), Peter Schneidler's <a class="freelinking external" href="http://new.myfonts.com/fonts/profonts/maxim/" rel="nofollow">Maxim</a> (1956), F.H.E.Scheidler's <a class="freelinking external" href="http://new.myfonts.com/fonts/ef/graphis/" rel="nofollow">Graphis</a> (1934) and <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/reporter/" rel="nofollow">Reporter</a> by Carlos Winkow (1938).  </p>
      <p>This list was compiled mainly by scanning through Jaspert's book and using my notes about existing fonts of the heavy German styles.</p>
      <p>- Mike Yanega</p>
