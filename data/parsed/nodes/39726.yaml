    <p>Hi everybody, I'm trying to translate these two terms to spanish; They are often used interchangeably. As I can understand, character set is a collection of characters, "suerte" in spanish, and a codepage is a coded character set (or multiple sets) used by an operative system.<br>
    So, UNICODE is a codepage or an encoding? I'm getting crazy!<br>
    thanks</p>
