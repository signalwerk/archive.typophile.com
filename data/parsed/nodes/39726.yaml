      <p>Unicode is not a codepage, and I'm not sure if "meta-codepage" would be a useful description, either. </p>
      <p>Think of Unicode as a set of all possible character codes. A codepage is a subset of character codes in a particular order, usually limited to 256 characters.</p>
      <p>A little background: A "page" is a block or section of computer memory. In early personal computer systems, a page of memory was 256 bytes, the largest number that can be represented with 8 bits. Before Unicode, most standard character code systems used 8-bit encoding, so it was not possible to have more than 256 characters. So, an 8-bit character set could be thought of as a "page", and a codepage usually refers to any standard pre-Unicode 8-bit character set.</p>
