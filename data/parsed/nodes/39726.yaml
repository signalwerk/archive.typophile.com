      <p>&gt; If you look at the keyboard layout of an rtl Mac keyboard</p>
      <p>Totally irrelevant to most anything that happens with text when you're not actually typing.</p>
      <p>&gt; If you look at the keyboard layout of an rtl Mac keyboard,<br>
      &gt; the opening parenthesis is encoded as left parenthesis</p>
      <p>From a Unicode perspective, there's no such thing as left parenthesis, just opening and closing parentheses. What they look like depends on whether you're in RTL or LTR.</p>
      <p>Now, it's possible that the Windows Arabic keyboard takes the thing that looks like a "left" paren on the keyboard and treats that input as an opening paren in the English keyboard and as a closing paren when you're using the Arabic keyboard. But whether or not it does so, this is unrelated to what happens with Arabic text moving between Mac and Windows....</p>
      <p>Somebody who is really familiar with Arabic typesetting might be able to help decode the particular problems you're seeing, but you'll need to be a lot more specific about two things:</p>
      <p>1) How are you producing the RTF Arabic text on the Mac? (Application, font, font format)</p>
      <p>2) In what Windows application are you opening that Mac-created RTF text file? </p>
      <p>It's in one of those steps that the problem likely lies.</p>
      <p>I'll just note on the side that Mac Word doesn't support Arabic last I heard.</p>
      <p>Regards,</p>
      <p>T</p>
