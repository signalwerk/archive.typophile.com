      <p>All codepages are character sets, but not all character sets are codepages.</p>
      <p>A character set is any specific collection of characters. You could consider any given font to have its own character set, which may or may not be the same as some externally-defined one.</p>
      <p>A codepage is a character set used by a computer, usually OS specific, usually to support a specific language or set of languages. For example, MacRoman is a codepage. Windows codepage 1250 (Eastern European) is a codepage. Many codepages are single-byte character sets - that is, they contain no more than 256 characters.</p>
      <p>Regards,</p>
      <p>T</p>
