      <p>Maybe it helps understanding how codepages  work if you are aware that a single character can be represented in various codepages. So for example, the lowercase 'a' is represented the MacRoman codepage as well as in the Windows 1252 codepage (and in many more).</p>
      <p>Think of Unicode as a label attached to the character via which the character can be accessed by app's and OS's. Some apps and OS's address characters through their name, some through their unicode.</p>
      <p>Hope this helps,</p>
      <p>Artur</p>
