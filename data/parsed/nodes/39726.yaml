      <p>Unicode is a single very large (and still growing) character set and encoding, which encompasses essentially all the standard computer character sets that predated it.</p>
      <p>Most any computer codepage can be mapped to Unicode and back. However, in computer systems Unicode is largely replacing codepage based approaches, and for good reasons. Instead of having dozens of codepages each using (and re-using) the same numbered slots for different characters, each character gets its own unique numbered slot in Unicode. </p>
      <p>T</p>
