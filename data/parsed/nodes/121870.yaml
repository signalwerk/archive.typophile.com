    html: |-
      <p>Bank of America used a custom typeface called, ironically, Higher Standards, but I believe they—like NatWest—stopped using it within the last five years or so (I last worked for them in 2009). </p>
      <p>BoA’s identity typeface is Franklin Gothic.</p>
      <p>Higher Standards was a Clarendon (numeral)/Century (letters) hybrid that I thought worked quite well with Franklin Gothic, but it was eventually relegated to being used only to set long-form copy before it was dropped completely.</p>
