  html: <p>I know of two books devoted to individual typefaces - Justin Howes' "Johnston's Underground Type" and Lars Muller's "Helvetica - Homage to a Typeface". Are there others? I'm talking about real books that treat the design, designer, context and use of the face - not just specimen books.</p>
