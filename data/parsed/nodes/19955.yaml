      <p>This probably isn't exactly what you're looking for, but I recently picked up a book at the library called "Metro Letters, A Typeface for the Twin Cities" that has a handful of typefaces on one theme (namely, Minneapolis and St Paul, Minnesota). It includes interviews with the various designers invited, their backgrounds, and a lot about the process involved. </p>
      <p>Most of the book is spent looking at this font:<br>
      <a href="http://www.letterror.com/portfolio/twin/index.html" title="http://www.letterror.com/portfolio/twin/index.html">http://www.letterror.com/portfolio/twin/index.html</a> (check out the specimen)</p>
      <p>My favorite quotation: "Hopefully, no city can be reduced to a single typeface--except Monaco!" --Gilles Gavillet</p>
