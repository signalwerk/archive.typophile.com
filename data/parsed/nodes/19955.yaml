      <p>Nigella, there is no book on Plantagenet, but there is a very nice limited edition specimen, designed by the brilliant Brian Morgan. If you contact Ross (ross[at]tiro[dot]ca) you can find out more information. The Plantagenet family is one of those designs that seems to be under perpertual development, but you can enquire about licensing the current state.</p>
      <p>The version of Plantagenet that comes with Max OS X is a subset that supports the Cherokee writing system. There is no italic for this subset.</p>
      <p>For more information see <a href="http://www.tiro.com/Plantagenet/plantagenet_index3.html" title="http://www.tiro.com/Plantagenet/plantagenet_index3.html">http://www.tiro.com/Plantagenet/plantagenet_index3.html</a></p>
