      <p><em>that’s really about a writing system though.</em></p>
      <p>Specifically, about the typographic representation of that writing system (i.e. there is very little material in it about the writing system itself or about the manuscript tradition). Although this book isn't about a single typeface, the whole thing can be read as a background to the development of the Linotype Bengali, which concludes the book.</p>
