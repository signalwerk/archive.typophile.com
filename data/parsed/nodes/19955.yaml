      <p>Don't for get about <a href="/wiki/Anatomy%20of%20a%20Typeface" class="freelinking" rel="nofollow">Anatomy of a Typeface</a> by <a href="/wiki/Alexander%20Lawson" class="freelinking" rel="nofollow">Alexander Lawson</a>. I contains 24 chapters that are devoted to a specific typeface and 6 more chapters devoted to more general type styles.</p>
      <p>And American Proprietary Typefaces edited by <a href="/wiki/David%20Pankow" class="freelinking" rel="nofollow">David Pankow</a>. This one contains 10 chapters each written by a different author.</p>
      <p>And, of course, there is D.B. Updite's <a href="/wiki/Printing%20Types" class="freelinking" rel="nofollow">Printing Types</a>.</p>
