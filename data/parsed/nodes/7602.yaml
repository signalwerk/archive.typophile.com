    html: <p>Personally, I'd avoid sans if you can. I think it'd seem a bit incongruous. And, if the museum uses Arial (unwisely) everywhere else, the sans's character will pop more in that context. Also, if the focus is 18th century culture, I'd go with something period-specific that seems, to the average viewer, more related. <br> <br>geraint, is Caslon's Egyptian for sale on Font Bureau's site? I can't find it. <br> <br>I'd recommend Kent Lew's <a href="http://kentlew.com/Type.html">Whitman</a>, for a variety of non-historical reasons, but it doesn't have a bold italic, which I imagine you'd need in a museum setting. (Check it out anyway, 'cause it's great.)</p>
