  html: <p>Hello, <br> <br>As a recent graduate I would like to ask for some advice with my first piece of work please. <br> <br>Could anyone recommend a typeface suitable for information text panels within a local museum/gallery space? The brief states I must use "Arial". I really don't want to mainly because I don't feel it is appropriate for the gallery content (18th century photography)I would like to use a serif, but I'm sure there are other suitable sans serif faces I could suggest?  <br> <br>Maybe this is the norm, and maybe I should use this typeface but I would prefer to argue the case for another.  <br> <br>The gallery is very conscious of legibility issues which I feel is right, but leaves me unsure about the legibilty of other typefaces due to my lack of experience in the field. <br> <br>Any suggestions or is my question a little vague? <br> <br>Thank you.</p>
