    html: <p>&gt; Would I be making a mistake attempting this? <br> <br>The more body text you have, the more sans is a bad idea. <br> <br>But for the heading, simply figure out the flavor you want. <br>Sans and serif give different flavors, but functionally they're both fine for headings. <br> <br>"Use only sans for heading" is naive Modernism. <br> <br>hhp</p>
