    html: <p>Photography was invented in the early 19th century, by means of simultaneous developments among a number of researchers (Daguerre, Herschel, Niepce, Talbot) who were all exploiting Schulze's 1727 discovery of silver nitrate darkening on exposure to light. <br> <br>The French government considered the invention so important that they bought Niepce and Daguerre's patent(s) and put them in the public domain. <br> <br>The first book containing photos was Talbot's "The Pencil of Nature" (1846). <br> <br>Many further big technical breakthroughs in portability didn't come until the early 20th century. Portable flash photography (developed in large part by my great-grandfather, George R Lawrence); the 35mm camera in 1925 (Barnack) was another huge advance in portability; and then faster films made it possible to do away with the flash altogether. Then you got color, and the Polaroid, all before 1950. <br> <br>Any museum/gallery using Arial for exhibit labels didn't have a decent typographer involved in their development. I'd agree with most of the above suggestions, except that stuff like Bulmer and Walbaum is probably not best for readability under sub-optimal conditions (which exhibits usually are, in my experience). <br> <br>Personally, I'd go with a good humanist sans serif, if the client is hung up on sans serifs. <br> <br>T</p>
    html_clean: <p>Photography was invented in the early 19th century, by means of simultaneous developments among a number of researchers (Daguerre, Herschel, Niepce, Talbot) who were all exploiting Schulze's 1727 discovery of silver nitrate darkening on exposure to light. <br> <br>The French government considered the invention so important that they bought Niepce and Daguerre's patent(s) and put them in the public domain. <br> <br>The first book containing photos was Talbot's "The Pencil of Nature" (1846). <br> <br>Many further big technical breakthroughs in portability didn't come until the early 20th century. Portable flash photography (developed in large part by my great-grandfather, George R Lawrence); the 35mm camera in 1925 (Barnack) was another huge advance in portability; and then faster films made it possible to do away with the flash altogether. Then you got color, and the Polaroid, all before 1950. <br> <br>Any museum/gallery using Arial for exhibit labels didn't have a decent typographer involved in their development. I'd agree with most of the above suggestions, except that stuff like Bulmer and Walbaum is probably not best for readability under sub-optimal conditions (which exhibits usually are, in my experience). <br> <br>Personally, I'd go with a good humanist sans serif, if the client is hung up on sans serifs. <br> <br>T</p>
