      <p>Similar to <a class="freelinking-external" href="http://new.myfonts.com/fonts/solotype/opera-house/">Opera House</a> from Solotype. Just needs squooshing/stretching, to make narrower. Not many of these Tuscan styles have the squared S that I have seen so far. (It was not at Dafont either, by the way.)</p>
      <p>- Mike Yanega</p>
