    html: <p>Sorry Soroush, but I'm not sure what exactly the "special needs of complex scripts" you have in mind, I know many LGC fonts with thousands of kerning pairs, so it is hardly a complex script-only need. Actually the most irritating thing I've found about RTL kerning is that you can't use kerning classes; for some undocumented reason kerning classes can only move the second glyph in the kern pair on the X access, which rules out RTL scripts that need to move both sides of the kern pair. Some tools do hide this from the user by converting kern classes to kern pairs silently (I've been told Volt does this, but I never used it, actually).</p>
