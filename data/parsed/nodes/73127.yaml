      <p>I think an independent tool would be more creative. and of course it should be integrated with current tools.</p>
      <p>Using the PyQt graphic client, mastering bezier or B-spline curves became easy to implement. The only matter is how to compile OpenType codes =&gt; we can use command-line executables of AFDK, or addtable of Microsoft after generating the .otf file. Before starting to code, I have to know more about OpenType technology. would they give us documentations of OpenType? or they are traditional secrets? I like to write my own decoder and generator for OpenType.</p>
      <p>The only hard-to-write part is finding some algorithms for curve operation like finding intersections of curves, getting intersection of counters, merging them etc. I'm still trying to find some efficient solutions. </p>
      <p>At this early stage, the idea looks clear. I can't see any problem with details of implementation. could you see?</p>
