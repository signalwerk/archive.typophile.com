      <p><cite><br>
      1- mark.position.x = glyph.width / 2<br>
      2- mark.position.y = maximum([glyph.nodes.y]) + offset<br>
      </cite></p>
      <p>That is essentially what I was doing, but as you state there are special cases, but the effort needed to make it more intelligent (i.e. analyse the actual shape, have special rules for certain classes of glyphs etc.) seemed to much for little gain, but of course if we to build a general purpose solution, then more intelligence is needed.</p>
      <p>I know templates are kind of rigid, but judging by many Arabic fonts that I've seen, they are relatively simple, very few ligature, no fancy substitutions and so on, so such a solution can benefit a lot of potential font designers who are alienated by high entry level. But I can see the benefit of building more general tools, though I prefer to base on existing tools instead of reinventing the wheel. FontForge, for example, is a ten years old beast with more than half a million lines of code, we certainly don't wont to reinvent that.</p>
      <p><cite>What is the benefit of fewer pairs? As I know, using classes of glyphs will not help processing time or save memory. compilers simply replace members of each class with a set of glyphs, in lookups. so in fact, count of pairs will not decrease using classes.</cite></p>
      <p>The less number of pairs the either for font designer to make and maintain them.</p>
