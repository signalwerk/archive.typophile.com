    html: |-
      <p>Positioning marks by a script will save time. I think the best method should be something like this:</p>
      <p><code>1- mark.position.x = glyph.width / 2<br>
      2- mark.position.y = maximum([glyph.nodes.y]) + offset</code></p>
      <p>But I think there would be some inelegance cases; for some glyphs it's not the best approach of mark placement. fine-tuning could be needed after applying script.</p>
      <p>Using a pre-designed template is a good idea, but it could be better. in fact you mean reduction amount of work by avoid repeating routine things. I think using a template will cause some problems. because designing methods and approaches of persons are different. It's difficult to find a template respecting all of ideas. considering work for changing template, whole amount of work will not so decrease. if we think more in details we'll conclude that 'templates' and 'algorithms' are exactly same ideas. but i think replacing visual aimed tools with old methods could help more about simplifying, with maintaining generality of design techniques.</p>
      <p>For example, I like to set marks by hand without involving technical parts of work. Imagine that you want to position marks (completely manual or after applying some algorithms). you should simply type a phrase or paragraph with marks (or use a typed one) and set each mark's positions by selecting and moving it around with mouse. so you can see result in a real paragraph of text and could recognize all of bugs like intersections, touching marks and etc. In this case, designer will never write scripts for placing marks, cursive attachment or kerning. all of features will generated directly at compile time. so designer could focus on his design, not technical details of implementation.</p>
      <p><em>It cuts down the number of kerning pairs significantly.</em></p>
      <p>What is the benefit of fewer pairs? As I know, using classes of glyphs will not help processing time or save memory. compilers simply replace members of each class with a set of glyphs, in lookups. so in fact, count of pairs will not decrease using classes.</p>
