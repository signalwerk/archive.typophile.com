      <p><em>The Devil doesn't scare me</em></p>
      <p>I started to learning FontLab when I didn't know anything about typography and learned it in 30 minutes. why you are worried about learning? learning a new stuff is very easy for a professional designer. If some new tools will be created for development, then they will be very similar to olders. in addition, adding some integration abilities could eliminate complexity of using a new tool.</p>
      <p>FreeType is a rendering engine, but as I know, it could decode font outline data into well-structured curve data. Though if it don't support decoding, I'm pretty sure there are other decoders available. if not, there is no way else than writing a decoder.</p>
      <p><em>OpenType is now an ISO standard, also its documentation were always public...</em></p>
      <p>I didn't mean specifications, I need to know the mathematics and data structures behind of OpenType Tables and want to know how to build a ttf or otf file from an OT script. and of course how to read data from font files.</p>
