      <p>I'd the same goal is yours, but I've taken a different approach. Instead of having thousands of glyphs, ligatures and kerning pairs, I opted to what can be called base-glyph-only-no-ligature approach.</p>
      <p>What I basically do is stripping diacritical dots and working on unique base glyphs, so all Baa-like letters are broken into a dotless Baa and diacritical dots, then all glyphs transformation and positioning rules are applied to the base glyph, simplifying the rules significantly, making it a lot simpler to do the adjustments by hand.</p>
      <p>Ligatures are in turn broken to their building blocks, all ligatures including mandatory ligatures like Lam-Alif, which are applied using contextual alternatives instead of ligature tables, this adds a bit to the complexity but it more extensible and maintainable on the long run, so I think. </p>
      <p>The dots are then positioned using regular mark anchors, vowel marks are either positioned using mark or mkmk anchors (whether they are positioned over a bare glyph or over a dot).</p>
      <p>As a result, the font which covers almost all Unicode Arabic block (I'm still missing few base glyphs and diacritical marks) has only 338 unique glyphs (the missing ones are around 25 max.), with a very sophisticated set of alternating glyphs making it very aesthetically "authentic" Arabic font.</p>
      <p>As result, I find "stoke" tool more than enough and are very economic, as far as my approach goes. My initial glyph drawings were done on Inkscape, but all later edits are done in FontForge, which I use for all font related activities since it supports virtually every feature that I ever wanted, and whenever any automation is needed, I resort to its Python scripting capabilities.</p>
      <p>My work is under Open Font License, and is hosted on <a class="freelinking external" href="http://github.com/khaledhosny/bulaq-naskh" rel="nofollow">github</a>, feel free to have a look.</p>
