      <p>@ marcin:<br>
      <em>does your kerning algorythm base on something similar to a tresholded gaussian blur of a given radius?</em><br>
      No, it's not . it simply expands glyph outline using Breadth-First-Search and colorize the weight of each pixel by distance of it from base shape. Then it recognize white spaces by computational geometric methods, and decrease distance of glyphs each step using a maximum overlap allowed value. </p>
      <p>@ Khaled:<br>
      I found your solution very clever, but do you think it should not be such complex in implementation? if automations (with any approach) came built-in, there will be more efficient ways to design, so I think. Special needs of complex scripts could be automated by a few simple rules or algorithms. but design tools don't support them, and scripting features are not enough.</p>
      <p>this makes me crazy.</p>
      <p>I'm going to design a font creation software with <strong>complete</strong> support of OTT generation. General focus will be on special needs of complex scripts.</p>
