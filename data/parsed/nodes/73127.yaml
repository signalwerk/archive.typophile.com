      <p>I'll try to read some parts of FontForge's source. but I'm not sure a 10 years old program could respond new operating systems and frameworks.</p>
      <p>Half millions line of code isn't a scary amount. necessary tools needed for this project are so improved since ten years ago. We don't have to handle all of protocols, file structure and base platforms. we could use FreeType (Font protocol decoder), NumPy (algebraic core), SciPy (for computational geometry library), PyQt (for GUI), OpenGL (integrated with Qt GUI) and so on. It's more easier than it looks.</p>
