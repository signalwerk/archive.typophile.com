      <p>I use FontForge, it is an outline (and bitmap) font editor, has the most complete OpenType support I know of, and has very powerful scripting language, and above all is free open source software so one can study its code and even add features or fix bugs (which I did myself many times).</p>
      <p>I've sought about your idea for mark placement, and I think it is doable with a bit of python code in FontForge, but I don't see it doing much simplification (adding a mark attachment is a matter of few clicks), I don't see your method simplifying that, can you elaborate more?</p>
      <p>While ago, when I was cleaning and updating arabeyes fonts, I wrote scripts that would take a font file and insert (almost) all anchor points for vowel marks, it works by analysing the base glyph, finding highest and lowest points and inserting anchors above and below them by a predefined offset. It was greatly helpful, and cut the time of adding anchor points significantly, now only manual work was needed to fine tune the positions what was often not needed at all.</p>
      <p>I think, of we have some clear ideas, we can work something out. I'm interested in simplifying the work of creating new Arabic fonts, which have a steep learning curve thanks to the complexities of OpenType. I was thinking of some sort of a "template" that the font designer can fill with glyphs, position marks the way you suggest (simply copying  some mark and positioning it), then run a set of scripts that would put the font in a final, production ready form, what do you think?</p>
