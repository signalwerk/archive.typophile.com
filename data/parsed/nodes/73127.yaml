      <p><cite>The devil is in the details.</cite></p>
      <p>Having my hacker hat on, I'm all for new, fresh start, but now putting my font developer hat on, I'm more inclined to practical solutions that won't take years to implement and does not added more complexity to my existing work flow (i.e. learning a radically new tool).</p>
      <p>I'm not sure how you intend to use FreeType, but last time I checked it was a font rendering not editing library, so of little use here (if you want to edit the fonts you need to decode them yourself), FontForge already use FreeType for some TrueType hinting related stuff, but that is another issue.</p>
      <p>OpenType is now an ISO standard, also its documentation were always public, see <a class="freelinking external" href="http://www.microsoft.com/typography/otspec/" rel="nofollow">OpenType specification</a> page, though I've seen many complaints about unclear or even self-contradictory parts. I believe other specifications (e.g TrueType font structure) are also available.</p>
      <p>However, I'm still more with building on existing stuff, this allows one to concentrate on the parts that matter and leave the heavy lifting to other tools (FontForge already provides a libfontforge, that Python bindings, for example, can be written for and then used without even using its GUI).</p>
