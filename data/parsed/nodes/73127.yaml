    html: "<p>I am for reinventing the wheel. The new approach is needed - and this means a new software. If it would be a plug-in or an independent tool is secondary question. The most important deal is how to manage the extremely complex thing in an easy and flexible way. The challenge probably means forgetting of the most of traditional type tools' rules and rather scope on the task in the way known from parametric design in architecture: highly visual-oriented interface, asking for guidelines and returning propositions; making the dirty job in the background meanwhile.</p>"
