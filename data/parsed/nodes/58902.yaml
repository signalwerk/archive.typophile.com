      <p>Sounds like you are looking for a “single storey” a.</p>
      <p><a href="//new.myfonts.com/fonts/agfa/century-gothic/”">Century Gothic</a>  is very similar to avant garde. </p>
      <p><a href="//www.linotype.com/472/futura-family.html”">Futura</a> is a good font to invest in, in my opinion. I have found it very useful over the years.</p>
      <p>You could also try something with a slab serif, like <a href="//new.myfonts.com/fonts/bitstream/geometric-slabserif-703/”">Geometric Slab 703</a></p>
      <p><a href="//www.houseind.com/fonts/collections/chalet”">Chalet</a> from House Industries has a retro-modern feel to it.</p>
