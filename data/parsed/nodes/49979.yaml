      <p>First, check to make sure your font ID &amp; naming tables are setup correctly before generating the font(s).</p>
      <p>Second, because its working in some but not all apps, I'd suggest that you might need to run a utility to clean out your font caches. I use FontFinagler once a month or so, especially to "fix" Adobe menus that get all cluttered with fonts I had open two weeks prior. Adobe apps seem more prone to this than others, probably because they maintain their own font caches independent of the system... you may be seeing older versions of your font still cached in the apps' memories.</p>
      <p>I don't know if Font Finagler is Leopard-compatible, but it does work in Tiger.</p>
