    <p>Hi Folks,</p>
    <p>It's been ages since I posted or read anything here. I haven't been doing much in the way of making or using fonts lately, but I got a bug in my bonnet to make one this past weekend and soon recalled why this work is not for sissies. :)</p>
    <p>I've created a three-member family I call "FultonSignAndPriceMarkers". The members are Regular, Light and Symbols. For some reason, not all applications are happy with the new fonts (OTFs), as evidenced by the fact that they don't all show up in every application's font menus. Here is what I have found so far:</p>
    <p>Extensis Suitcase - no problems, all styles work<br>
    All Apple apps - works fine, all styles available<br>
    Adobe Photoshop - works fine, all styles available<br>
    Adobe InDesign &amp; Illustrator - only Symbols style is present and available<br>
    MS Office apps - light version is present but no style names show or are available</p>
    <p>If anyone can help me sort this out, I'd be much obliged. For reference, I am using Mac OS 10.411 and FontLab 5.</p>
    <p>I'd happily post the font files or any other info that might help.</p>
    <p>Thanks mucho,</p>
    <p>Amy<br>
    aka<br>
    l'Abécédarienne</p>
