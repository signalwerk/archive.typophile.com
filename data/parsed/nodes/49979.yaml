      <p>Hi Amy,</p>
      <p>Word looks at the family names if no style-linking is included. Adobe apps generally look at other name entries, accessible on your second page.<br>
      So:</p>
      <p>Family Name + Full Name unique:<br>
      1. "Fulton Sign And Price Markers"<br>
      2. "Fulton Sign And Price Markers Light"<br>
      3. "Fulton Sign And Price Markers Symbols"<br>
      PS Font Names without spaces</p>
      <p>2nd page<br>
      OT Family Name for all "Fulton Sign And Price Markers",<br>
      OT style Names<br>
      1. ""<br>
      2. "Light"<br>
      3. "Symbols"</p>
      <p>Best</p>
      <p>Christoph</p>
