    <p><a href="http://www.nobodoni.com" rel="nofollow">No Bodoni</a> is a small, independent type design company, founded by designer <a href="/wiki/George%20E.%20Thompson" class="freelinking" rel="nofollow">George E. Thompson</a>, and inspired by <a href="/wiki/Giambattista%20Bodoni" class="freelinking" rel="nofollow">Giambattista Bodoni</a>’s dedication and drive.</p>
