    <p>I think it is rather commonplace that in Latin formal writing we right-handers have advantage over the lefties. The orientation of hand and tool combined with the shape of letters and direction left-to-right is constitutive for the typical ductus of, e.g., Roman Capitals.</p>
    <p>This is more of a teacher’s consideration. I give courses on lettering and this means to encounter with left-handed students, naturally. I refrain from forcing them into something which is rather uncomfortable, so for quite some time I let them write all letters mirrored, from right to left, with the left hand. If they use a broad-nib edding the ink bleeds through the paper and at the end we just flip the sheet and see a normel left-to-right lettering; the results are as good as those from the righties, sometimes even better.</p>
    <p>Has anyone of you similar considerations or experiences with lefthand formal lettering exercise?</p>
