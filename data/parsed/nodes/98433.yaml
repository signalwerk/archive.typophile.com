      <p>Arbitrary rules? The typical modulation patterns of the signs of any script are not arbitrary: they're the evolved product of competence over time with particular tools. The fact that the majority of practitioners in any culture have been right handed is significant to the results, to be sure, but the very variety of modulation patterns in the world's writing systems indicates that it is not determinative of a singular pattern. But that doesn't mean that the evolved patterns of individual scripts are not important in terms of <em>reading</em>. Remember, what we're talking about is a combination of shapes and modulation, and different combinations of shape and modulation produce different spatial frequencies. Writing systems, as some of Pelli's studies have shown, have distinctive spatial frequencies and, within a system, spatial frequency within a particular tuning range, which result from particular combinations of shapes and modulation patterns. If you change the modulation pattern applied to the same set of shapes, or change the set of shapes to which you apply the same modulation pattern, you end up with different spatial frequency. This is what I demonstrated in that older thread, in which I illustrated Latin letters written with a Devanagari modulation pattern: you end up with a spatial frequency that a) is atypical of the Latin script and b) -- more critically, I think -- varies more than the typical spatial frequency, which may be problematic for reading. Why should this be so? Because writing systems have evidently evolved as mechanisms for achieving particular spatial frequencies, so that reading is not disrupted by re-tuning. That is to say, the combinations of shapes and modulation patterns have been well chosen.</p>
      <p>Ergo, the solution to comfortable writing for lefties cannot simply be to mirror the position of right-handed writers with the same tools -- hence flipping the modulation pattern -- without also considering the shapes that are being formed. In effect, what you would need is a separate script for lefties that enabled them to produce new combinations of shape and modulation pattern.</p>
