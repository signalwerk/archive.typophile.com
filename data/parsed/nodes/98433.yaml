      <p><em>I could guess what you mean by "systemic spatial frequency", but it's better if you could explain.</em></p>
      <p>I mean spatial frequency that, within an individual writing system, falls within one of the perceptual tuning bands. Another thing to note about this phenomenon is that it is scalable, such that even when different weights are applied to a script style, naturally resulting in differences of spatial frequency between the weights, within each weight the same tuning applies. This is no small feat, especially when one considers is is arrived at by generations of writers and readers who have no scientific understanding of spatial frequency and its rôle in reading, i.e. it is arrived at by something like natural selection.<br>
      _____</p>
      <p>While, as you say, Legato -- and type design in general -- is outside the scope of a thread about lefty handwriting, I think it is worth pausing to consider what Legato represents in terms of combinations of shape and modulation pattern. What Evert managed so well is to create strong typical shapes of Latin letters with a new, tool-independent modulation pattern that maintains consistent spatial frequency. The modulation pattern is the innovation, and the strong typicality of the shapes and the consistent spatial frequency are what makes it successful. If, in order to accommodate the novel modulation, the letter shapes had needed to diverge significantly from typical models, the resulting typeface would have joined various idiosyncratic experiments that are practically useless as fonts for setting text that anyone wants to read. If the novel modulation had resulted in inconsistent spatial frequency, such that different letters required different perceptual tuning, this would predictably result in slower reading speeds.</p>
      <p>So, how does this relate to lefty handwriting? Obviously, in handwriting, the modulation pattern is not tool-independent; therefore, the kind of control that Evert had that enabled him to introduce a new modulation pattern <em>while not disrupting either typical shapes or spatial frequency consistency</em> is not available. It seems to me, in that case, that the only way you can achieve those goals in left-handed writing -- if one rejects repositioning of the arm or rotation of the page -- is to use a tool that produces little or no stroke modulation, because any tool that results in strong modulation is going to produce either inconsistent spatial frequency or divergence from normal letter shapes.</p>
      <p>It is not that 'righties are obsessing about proper [modulation]'*, but that readers are expecting typical <em>shapes,</em> and the shapes of letters have been arrived at evolutionarily in ways that favour particular modulation patterns in order to produce consistent spatial frequency. In type design, as Evert showed, these modulation patterns can be mutated through tool-independent manipulation, but in writing there is always a tool that, however manipulated, has an impact on the modulation pattern.</p>
      <p>* I'm trying to avoid using the word ductus to mean modulation pattern, as the term has a more proper use in discussing writing, i.e. the stroke construction pattern of an individual letter, literally the 'path'.</p>
