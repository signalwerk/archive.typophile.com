    html: <p>I'm left handed. I was surprised when I saw Debra Band, who is a calligrapher and illuminator sign <a class="freelinking external" href="http://www.amazon.com/Arise-Deborah-Ruth-Hannah/dp/0985799609/ref=sr_1_1?ie=UTF8&amp;qid=1354467343&amp;sr=8-1&amp;keywords=debra+band" rel="nofollow">this book</a> for me left-handed. (She, ahem, uses my Williams Caslon Text for the commentary portions of the book.) I asked her how she does it, and she said she writes vertically, and starts from the top for English text (as in Pablo's illustration) and from the bottom for Hebrew. She said that she can read text in any orientation now, and even mirrored from the paper cut designs she has done. So I figure it might take some time for the eyes to learn to adjust, but it's obviously doable.</p>
