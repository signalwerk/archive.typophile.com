      <p>The 'vertical line writing' in which the page is rotated 90 degrees is very sensible. It enables the left-handed writer to maintain an unflexed wrist, which reduces fatigue and more easily involve arm movements in the writing.</p>
      <p>Islamic calligraphers regularly write with the page rotated thus, in order to produce the typical ductus of the Arabic script while maintaining a straight wrist.</p>
      <p>Remember, the direction of reading does not need to be the direction of writing.</p>
