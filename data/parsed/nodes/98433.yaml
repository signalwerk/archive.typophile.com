      <p>I believe Hrant is referring to the fact that the human eye provides somewhat better range of acuity in the horizontal direction than in the vertical. This shouldn't surprise us, evolutionarily, since we spend more time scanning horizontally than vertically, and our eye shape also reflect this. What the reading pattern of vertical east Asian scripts demonstrates is that there is sufficient vertical acuity for reading in that direction. Hrant may argue that it cannot be optimal, but only comparison testing of native readers would indicate whether this results in a significant difference in terms of speed/accuracy.</p>
      <p>The question of rotated writing seems to me entirely different from that of rotated reading. Writing direction and reading direction do not need to be the same because writing and reading are different tasks. When writing, one does not need to read the text, only to see what one is doing (for most people; there are some individuals who are very good at writing with their eyes closed).</p>
