    html: "<p>How do you account for the fact that individual writing systems appear to have developed systemic spatial frequency? It seems to me a fairly clear case of evolution in a Darwinian sense: since the criterion of fitness of a writing system is reading, writing systems evolve to favour shape and modulation combinations that aid reading. This is not to say that all writing systems are equally good, let alone optimal, but that they exhibit an observable outcome vis à vis spatial frequency in the combinations of shape and modulation that they evolve. When I said 'well chosen', this is what I meant: not conscious design, but something like natural selection.</p>"
