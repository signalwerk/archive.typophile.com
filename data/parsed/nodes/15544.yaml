      <p>There are a good many letterpress folks still in operation, more and more actually, though most of the newer entrys are using the photopolymer plate process. </p>
      <p>I still have about four cabinets of medium- to larger-sized metal typefaces for use in broadsides and poster work as well as a very prestine collection of Klingspor's Claudius Fraktur and an extraordinarily large run of Ludwig &amp; Mayer's Dominante (which, as far as I know, has never been digitized).</p>
