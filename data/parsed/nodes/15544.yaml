    <p>As the title says, would be most interested in seeing what priceless collections of old <a href="/wiki/woodtype" class="freelinking" rel="nofollow">wood</a> or metal type, or maybe original ink designs, or antique <a href="/wiki/letterpress" class="freelinking" rel="nofollow">letterpress</a> posters, presses or whatever everyone has...</p>
    <p>(I guess this as well my interest in type generally, is sparked partly by a recent trip to Puglia in Italy - I was surprised to find an old fashioned print workshop seemed to be a standard fixture in every town. I nipped into one (I think in Lecce) and was shown around by the elderly owner who showed me all his letterpress stuff, at first I thought he kept it fo posterity -- but he explained it was all very much still in use for wedding stationery and church festival posters. To be honest he seemed a little bemused by my interest...anyway I digress) </p>
    <p>Show us what you've got!</p>
