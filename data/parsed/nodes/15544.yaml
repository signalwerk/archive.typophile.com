    html: |-
      <p>After some fifty-odd years of collecting effects for my printshop/foundry I've got more stuff than I can list, but one part of the collection that interest most visitors is the shelf unit holding about sixty suites of Monotype Giant Caster matrices.</p>
      <p>These are what most people in the "private press" area of interest would find to be ugly typefaces: Bodoni Bold and Italic, Jefferson Gothic, Onyx, Goudy Handtooled, Brush Script, Valiant, Franklin Gothic etc. Okay, even I think Goudy Handtooled is a little on the homely side.</p>
      <p>A few days ago I had another art college class visit. The instructor zeroed in on the Brush Script and fell in love with the mats, showing them to his class. This box of Brush Script contains the rare Th and tt logotypes along with two or three others. The mats are all in the large size range of 42 to 72 point, and are punched aluminum.</p>
      <p>I've been wanting to do a sample casting of as many of them as I can to include in a little autobigraphy (ego, ego) I am writing and printing. This seems to me to be a good reason to drag them out and put them on the Super Caster, since they haven't been cast into for many many years.</p>
      <p>One other oddity is a suite of about a dozen engraved brass mats which are large condensed figures: 10, 20, 30, etc. These are engraved in reverse into a checkered background. They look like they were custom engraved for use in horse racing betting slips or something like that. anyone ever seen this kind of thing???</p>
      <p>I did have one nifty font of woodtype a few years back; a very odd size of 51 picas. I've never seen such an unusual size before or since. They went on to be donated to an art school some years back. The school dumped the type along with all of the little printshop about four years ago. Dumb buggers.</p>
      <p>I've got a box of miscellaneous Giant Caster mats containing a set of figures of Bodoni Black Condensed in 120 point. These were intended to be cast "sideways" on the mold of the Giant Caster. They won't fit on the Super Caster so I keep them as a curiosity.</p>
      <p>Jim</p>
