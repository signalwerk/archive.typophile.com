      <p>Hmmm... I've never put together a catalogue of the various type and print samples and paraphenalia stashed in my cave.
      </p><ul>
      <li>I know I have a small collection of wood types in various sizes of only a few characters.</li>
      <li>A few metal type specimen books, mostly from type shops in NYC.</li>
      <li>A factory boxed sort of special characters from ACME Type Foundry, Chicago (a gift from Joffre LeFevre/Aboutype).</li>
      <li>Several Hamilton California type cases.</li>
      <li>A broadside and some specimens of Bodoni printed from the type in the Plantin-Moretus Museum, Antwerpen, as well as a few bookplates and maps.</li>
      <li>Several books from small private presses, including <em>Gulliver's Travels</em>, with illustrations and decorations by W.A. Dwiggins, from The Peter Pauper Press.</li>
      </ul>
      <p></p><p>Plus a whole bunch of other books, specimens, odds &amp; ends basically collecting dust.</p>
