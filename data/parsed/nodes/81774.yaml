    html: <p>Remember that H weight controls the vertical stem and vice versa for the V weight. The number you enter will essentially be double what you ask for. A value of 20 will increase the stem with by 20 in each direction. If you use small increments you may be OK, but why not just use the interpolate node took on the individual glyphs. If the font contains a reasonable number of glyphs, say under 500, I think one should be able to do it in a day's worth of work, considering at least a third or more of those glyphs will be composites.</p>
