      <p>If you have the old Fontographer installed, use it for enbolding, generate a pfb file from it and try to transfer the glyphs to your FontLab working file. There are different ways to transfer the glyphs; for example you could assign the font mask of the other font and then swap the outline with the mask.</p>
      <p>Edited: Naturally have to adjust the hints (not adjusting, but rehinting with the AFDKO autohinting macro), the stem values and the alignment zones.</p>
      <p>-----</p>
      <p>Not a help for the moment, but FontLab is going to integrate the Fontographer enbolding algorithm into FontLab Studio, as far as I know.</p>
