      <p>I've been meaning to give an update, for the curious.</p>
      <p>So a couple of good things happened: I bought myself<br>
      an extra 24 hours; and I gave Fog4 another shot* and<br>
      it worked! And it's amazing how much better than FL's<br>
      Fog's auto-bold is. The main thing it gets wrong is the<br>
      overshoots**. Anyway, it all worked out (considering<br>
      the still-too-short timeframe). But Armenian only has<br>
      about 100 chars; even a modest Latin font I couldn't<br>
      have pulled off, at least not the way I work.</p>
      <p>* For one thing I noticed a "No paging file" choice<br>
      that wasn't there before - maybe it kicked in after<br>
      I installed SP2 (I've been avoiding SP3).</p>
      <p>** Which you normally have to adjust<br>
      when changing the weight anyway.</p>
      <p>hhp</p>
