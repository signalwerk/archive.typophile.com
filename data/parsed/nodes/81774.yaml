    <p>I have a client who needs a Bold of one my fonts, yesterday. I tried to buy enough time to do it right, but they still want it yesterday. I told them, but I'm no martyr, so... I'm trying to use FontLab's auto-bold Action (I'm running 5.0.4 on XP) and apparently it's not as good as old Fontographer's! I can't seem to vary the size-gain restriction in each dimension. Even if I do it in two steps (once horizontally with dimension gain, then vertically without) it doesn't do it right. It's not a clean-up issue (I <em>was</em> planning on doing that) it's a matter of trying to avoid vertical squooshing after doing the auto-bold!   :-/</p>
    <p>Help?</p>
    <p>hhp</p>
