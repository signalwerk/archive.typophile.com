      <p>I can try FL4, but I don't expect much. Fog4 no longer runs on my machine (the OS memory-management seems to throw it off, and I once tried pretty hard to get around it but couldn't). Fog3 does run though...</p>
      <p>Craig, the problem is a Bold needs to be wider but not taller, and that "Keep glyph dimensions" box only does both or neither (and not even very well - in fact it makes things <em>narrower</em> - dumb). One would think you could do a bold on each dimension separately, the vertical keeping the dimensions and the horizontal not, but for some reason it gives the same results!  :-(</p>
      <p>hhp</p>
