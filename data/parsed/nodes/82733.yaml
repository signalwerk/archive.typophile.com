      <p>The best approach would be to find some examples from the era and then try to find current day typefaces that match or are similar. It sounds like you're asking about text faces, but it would be good to clarify that.</p>
      <p>As far as Caslon goes, the Caslon we know of today is more like the original Caslon (late 18th century). But descendants of Caslon types were pretty popular in the late 19th century, usually called "old style" at the time. Examples of the genre are <a href="http://new.myfonts.com/fonts/bitstream/bruce-old-style/" rel="nofollow">Bruce Old Style</a>, <a href="http://new.myfonts.com/fonts/adobe/old-style-7/" rel="nofollow">Old Style No. 7</a>, and <a href="http://www.fonts.com/findfonts/detail.htm?productid=215888" rel="nofollow">Monotype Old Style</a>.</p>
      <p>"Modern" faces, along the lines of Nick Shinn's <a href="http://new.myfonts.com/fonts/shinn/scotch-modern/" rel="nofollow">Scotch Modern</a>, were also popular in the late 19th century.</p>
