      <p>The <a href="http://www.shinntype.com/Figgins_Scotch.pdf" rel="nofollow">Scotch Modern</a> was the default in that time period. (Not the same as Scotch Roman.)<br>
      You should be able to pick up a copy of <em>Punch</em> magazine from that era -- there are still a lot around at flea markets etc.<br>
      There you can see it in use.<br>
      This style was quite international, and found everywhere from North America to Russia.</p>
