      <p>If you really want to nail the style of a particular era within the 19th century, you need to read Nicolete Gray's <em>Nineteenth Century Ornamented Typefaces</em>.</p>
      <p>Don't be misled by the word "Ornamented"—this is a history of the changing styles in typography, decade by decade, in which Grey relates the trends in type to contemporary styles in art and architecture.</p>
