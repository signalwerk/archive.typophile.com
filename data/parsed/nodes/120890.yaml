  - id: 592030
    user: 22675
    date: 2014-10-29T03:36:00
    date_raw: 29 Oct 2014 — 3:36am
    votes: null
    html: <p>Apparently I was too hasty to conclude it was DoublePlusGood. Thanks guys for checking and my apologies for the over-statement. <a class="freelinking external" href="http://www.face37.com/projects/f37-bella-stencil" rel="nofollow">Bella Stencil</a> F37 might work pretty well too. /R and /Q come definitely closer, switching default /C for alternate and adding (virtually) closing triangles to /A, /M and /N should get you pretty close, possibly even closer than DoublePlusGood.</p>
