    votes: null
    html: <p>speaking as a type-loving graphic designer, not a type designer, i think this face is a great candidate for lots of alternate characters. Allow the final user to choose from a pallete of characters to achieve the optimal rhythm. Some alternate begining/ending characters would be cool.</p>
