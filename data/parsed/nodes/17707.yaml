  html: |-
    <p>Heya,</p>
    <p>This project was my first venture into type design, inspired by the old badge faces from big american cars in the 50's and 60's.  </p>
    <p>It started as a true-type font using fontlab's 'typetool' (thats all we had 2 years ago when i was at university).  I would like to rework it as open type.</p>
    <p>Any criticisms, advice, direction or feedback would be muchly appreciated.</p>
    <p>Looking at it now, I think the following are a bit odd...</p>
    <p>- Upper case 'N' just aint right<br>
    - In fact, I think all the uppercase glyphs are a bit incoherent<br>
    - Something probably needs to happen with lowercase 'f'<br>
    - Stroke width probably could be a bit thicker</p>
