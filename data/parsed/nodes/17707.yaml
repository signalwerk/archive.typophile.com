    html: <p>I think the huge eccentricity of the capitals is what makes this face awesome. I agree, though, that the 'N' isn't right. And the left curve of the 'A' is too organic; it should terminate at the same angle as everything else. I might dare to say 'Z' is not weird enough! Try other things for the 'O', too, because it could read as a big 'a'. As odd as it sounds, maybe a perfect circle would work.</p>
