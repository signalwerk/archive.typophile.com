  html: <p>Well, it worked for FontDiner, so I thought I'd give it a try. <br> <br>An american client has insisted that we use Dan Zadorozny's "Gunship" typeface in a project. I've tried emailing him twice to buy a commercial license from the email address at <a href="http://www.iconian.com" target="_blank">www.iconian.com</a>, but with no luck. After over two weeks waiting, I'm at a loss. <br> <br>Does anyone have any ideas if he's still around and could pass on a message, or who might be able to point him here?</p>
  html_clean: <p>Well, it worked for FontDiner, so I thought I'd give it a try. <br> <br>An american client has insisted that we use Dan Zadorozny's "Gunship" typeface in a project. I've tried emailing him twice to buy a commercial license from the email address at <a href="http://www.iconian.com" target="_blank" class="link-external">www.iconian.com</a>, but with no luck. After over two weeks waiting, I'm at a loss. <br> <br>Does anyone have any ideas if he's still around and could pass on a message, or who might be able to point him here?</p>
