  html: <p>Hi there, i saw this font today on a 1978 movie poster for the film "Piedone l'africano" (Flatfoot in Africa). I could not find out so far what font it uses. I do not assume that it is hand drawn, althought the two "O" do not look exactely identical. This could as well come from the poor printing techniqes. Can anyone help me identifying it? Thank you very much.</p><div class="imageWrap"><img src="http://typophile.com/files/piedonlafricano_6653.jpg"></div><p></p>
