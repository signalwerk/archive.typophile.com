      <p>Hi Joel,</p>
      <p>1. You have to unzip the zip file. That will bring you a folder with the font files (and, normally, some other files like the EULA etc.) I assume you are on Mac OSX? Then just doubleclick the zip file.</p>
      <p>2. The font has to be activated, so that applications can use it. If you don’t have a lot of fonts, the easiest way is to move the files to your Fonts folder (<em>Your-User-Name </em>/Library/Fonts)</p>
      <p><cite>mac post script is that right?</cite></p>
      <p>Depends. But (still assuming you’re on Mac OSX, that is) that should work just fine.</p>
      <p>F</p>
