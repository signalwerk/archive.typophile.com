    <p>hello, i have bought a type face from a download website. it has downloaded as a zip file  onto my desktop. the problem is i dont no how to asign it to any softwares such as illustrator or indesign. i down loaded mac post script is that right? </p>
    <p>thanks for any help</p>
    <p>joel</p>
