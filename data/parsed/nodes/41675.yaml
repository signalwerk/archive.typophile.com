      <p>I guess you are using a mac computer?</p>
      <p>I would advise you to use fontexplorer. It's a free font management application.<br>
      <a href="http://www.linotype.com/fontexplorerX" title="http://www.linotype.com/fontexplorerX">http://www.linotype.com/fontexplorerX</a></p>
      <p>Just download and copy to your applications directory. After that start up the program (just double click), then you can drag and drop the font files into the application window and that should do the trick for you.<br>
      When you then start any application (illustrator, indesign) you will find the font in the font list of the application.</p>
      <p>good luck.<br>
      dav2.</p>
