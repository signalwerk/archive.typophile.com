    <p>I found this on the ground near an Enterprise Rent-a-Car lot the other day. I’m totally intrigued by the spurred “3” on it. I’m not even sure if I like it or not. It just seems so unnecessarily unique.</p>
    <p>Does this belong to a family to which any of you are familiar, or is this some custom thing where someone thought they were being crafty (and completely spoiling the counter on the three)?</p>
    <p>Thanks in advance...</p>
