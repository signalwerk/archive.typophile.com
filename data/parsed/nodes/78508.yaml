      <p>oh yeah, i just thought of something else about .epub...</p>
      <p>first, this "standard" is being choked by the early versions.</p>
      <p>a.d.e. ("adobe digital editions") is the viewer-program<br>
      that was adobe's entry into the .epub arena.</p>
      <p>it had to run on deficient hardware, i readily acknowledge,<br>
      handicapping it badly, but it is still an awful piece of crap...</p>
      <p>and i do mean awful, and i do mean crap.</p>
      <p>(the good news is that it updates itself automatically...<br>
      the bad news is that it seems to update itself constantly.<br>
      the ugly news is that, despite updates, it never improves.<br>
      i suspect the updates are just to plug the security holes.)</p>
      <p>one of the worst things about this early version is that<br>
      it can't handle more than 300k of text without choking.</p>
      <p>300k is not a lot of text.  (the king james bible is 2 megs.)</p>
      <p>so people creating .epub files have to chop up their book<br>
      into bite-sized morsels so this piece of crap can handle it.<br>
      because the old machines cannot update their old version.</p>
      <p>so, just like web developers still have to work around ie6,<br>
      .epub creators will have to bear this burden for a long time,<br>
      even though most e-reader machines have better chips now.<br>
      (the market is still too small to be writing off any customers.)</p>
      <p>as if this legacy crap wasn't bad enough, the technocrats who<br>
      make their living off .epub are already developing a new .epub3.<br>
      because, you know, they must perpetuate their making-a-living.</p>
      <p>so even though the world doesn't have a decent implementation<br>
      of an .epub viewer-program at _this_ time (over a decade after the<br>
      format first become adopted by the corporate publishing industry),<br>
      we will soon be witness to a whole new crop of "standard features"<br>
      which will also be implemented inconsistently.  aren't we so lucky?</p>
      <p>meanwhile, the world of paper-books is crumbling all around us...</p>
      <p>-bowerbird</p>
