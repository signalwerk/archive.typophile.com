      <p>I have been dealing with this issue, too. We are developing a new platform for digital cookbooks and for us the ability to have well designed pages is critical. I've been talking with various foundries and I've been getting very different messages. So far, we have two foundries which are offering to provide us a package of 6000+ fonts for an annual license of a big over $12,000. </p>
      <p>Our approach is to build the pages in HTML5 and use @fontface to integrate the fonts. When someone purchases a cookbook from us they would get the HTML5 files and fonts loaded from our server onto their iPad in a .zip file. So far only Hoefler &amp; Frere-Jones has categorically refused to license for this type of deployment. We happen to have one author who uses their Knockout typeface. So, we need to find a suitable substitute. That isn't great news. If we were to embed the font in the app itself, then they would allow that for an $800 annual fee.</p>
      <p>We need a solution that allows authors/designers/publishers to create digital books using the typefaces that we use for print without any additional fees. For many books it would be prohibitive to have an additional $800 annually tacked on to the costs of the digital publication. I don't think anyone would have a problem with some security around embedded fonts in HTML or ePub3 documents. But, the current solution won't work long-term. Books are going digital and a dramatic increases in costs for typefaces can't be supported financially in the long-term.</p>
