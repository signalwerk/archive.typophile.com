    html: |-
      <p>From the current draft of the spec...</p>
      <p>› 5.2. CSS Fonts Level 3 </p>
      <p>EPUB Style Sheets may include all of the constructs defined in the CSS Fonts Module Level 3 ( [CSS3Fonts] ) specification. User Agents must support at least the following values for the src descriptor in @font-face rules: "woff", "opentype" . I.e. both WOFF and' OpenType are Core Media Types that must be supported by all Reading Systems. Reading Systems may optionally support SVG Fonts in CSS. </p>
      <p><a href="http://code.google.com/p/epub-revision/downloads/detail?name=ebup30-20101216.zip" title="http://code.google.com/p/epub-revision/downloads/detail?name=ebup30-20101216.zip">http://code.google.com/p/epub-revision/downloads/detail?name=ebup30-2010...</a></p>
