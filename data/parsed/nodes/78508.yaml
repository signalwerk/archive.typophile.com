      <p>richard said:<br>
      &gt;   Thanks bb, I know you've kept very much up</p>
      <p>the only thing i think i should have added is that<br>
      microsoft was the big tech partner back in 1998,<br>
      whereas it's adobe here in the 2007-on period...</p>
      <p>so, of course, before the ink was dry on o.e.b.,<br>
      microsoft came out with their format (.lit) which<br>
      put  the open format in a proprietary wrapper...</p>
      <p>the i.d.p.f., which thought that _it_ was the one<br>
      who'd been in charge of the thing, realized that<br>
      microsoft was now in a position to extract a toll<br>
      from all of the i.d.p.f. members who wanted to<br>
      use this new format, so the i.d.p.f. flipped out...<br>
      they _wanted_ sabotage, but they wanted it to<br>
      work in their favor, not _against_ them, and<br>
      they realized that they had fallen victim to the<br>
      microsoft pattern of embrace/extend/extinguish.</p>
      <p>so the corporate publishing houses just shelved<br>
      their plans for o.e.b., and electronic-books, which<br>
      is what they wanted to do anyway, except that they<br>
      had learned to be skeptical of any tech partners...</p>
      <p>however, by 2005 or so, these corporate houses<br>
      were becoming very afraid of amazon's power...<br>
      they needed a counter, and in stepped adobe...</p>
      <p>adobe had been disdainful of the o.e.b. effort,<br>
      partly because microsoft was so heavily involved,<br>
      but also because adobe was always pushing .pdf.</p>
      <p>adobe finally realized, though, that a fixed-page<br>
      format simply wasn't going to work in a world<br>
      where screens came in all different sizes, so<br>
      they first tried to modify .pdf so it'd do reflow.<br>
      the result was the "tagged" .pdf. if you've never<br>
      heard of one, don't feel bad, because they never<br>
      really took off.  so adobe knew it had to change.</p>
      <p>adobe also knew that the corporate publishers<br>
      _desperately_ wanted d.r.m., so that path was<br>
      the plan of attack that adobe chose to utilize...</p>
      <p>of course, the corporate houses were smarter now<br>
      and they _expected_ that adobe was going to want<br>
      a piece of the pie as well, but they were so afraid<br>
      of amazon that they were willing to give it up now.</p>
      <p>the thing is, with amazon's d.r.m. attached to it,<br>
      .epub ceases to be an "open" standard any more,<br>
      because only the reader-programs that have paid<br>
      a fee to adobe are allowed to access adobe files...</p>
      <p>there are so many ways to kill "an open standard".</p>
      <p>&gt;   My attitude summed up in this rant on AListApart.<br>
      &gt;   But I'll be fleshing it out a bit on RW.<br>
      &gt;   Especially the part about<br>
      &gt;   the consistent inconsistencies,<br>
      &gt;   like browsers circa 2003.</p>
      <p>it would be nice if the inconsistencies were<br>
      consistent.  but we're not even _that_ lucky.</p>
      <p>here's a woman who has explored the many<br>
      ways in which .epub viewer-apps diverge:<br>
      &gt;   <a href="http://www.pigsgourdsandwikis.com/" title="http://www.pigsgourdsandwikis.com/">http://www.pigsgourdsandwikis.com/</a></p>
      <p>in recent months, it looks like she's decided<br>
      to focus exclusively on the ipad's viewer-app,<br>
      and has given up on all of the other ones...</p>
      <p>-bowerbird</p>
