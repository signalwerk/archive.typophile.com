      <p>I'd expect that many foundry licenses provide a definition of "document embedding" that would be broad enough to cover ePub.  What might catch you out is the "commercial product" clause in licenses that would prohibit the ePub document being charged for. </p>
      <p>Embedding friendly licenses include Adobe, FontShop, and er Microsoft :-) these may be worth reviewing.</p>
