      <p>Thanks, Si. I wasn't sure of the status of the ePub plans re. WOFF; Vlad was talking with them and I couldn't remember whether a decision had been reached yet.</p>
      <p><em>Depends how you define the document. If the document is the renamed .zip then the fonts are embedded within it.</em></p>
      <p>I suppose that is one way of looking at it, but this text is from the introduction to the <a href="http://www.openebook.org/doc_library/informationaldocs/FontManglingSpec.html" rel="nofollow">openbook.org documentation of their recommended font obfuscation mechanism</a>:</p>
      <blockquote><p>‘Many commercial fonts allow embedding, but embedding a font implies making it an integral part of the publication, not providing the original font file along with the content.’</p></blockquote>
      <p>I think this notion of integral vs. accompanying the content is one that will fit with many peoples' notion of embedding.</p>
