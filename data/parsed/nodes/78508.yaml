      <p>Do any of the popular e-book readers actually implement any “embedded” fonts? </p>
      <p>It’s been about a year since I did any testing. At that time, the only reader that I could find that supported document-specified “embedded” fonts was the Adobe Digital Editions reader for the desktop.</p>
      <p>None of the ebook-reader apps for the iDevices will recognize epub-attached fonts. (Heck, mobile Safari doesn’t even recognize @font-face except SVG.) </p>
      <p>As far as I know, none of the proprietary devices (Nook, Kindle, et al.) will present anything other than their own device fonts. But maybe things have evolved with the latest versions?</p>
      <p>It would be interesting to know if any e-readers have plans to support Epub document-specified/attached fonts in the near future.</p>
