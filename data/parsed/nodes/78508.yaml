    html: |-
      <p>Good point, you could certainly be caught out by EULAs that require "secure embedding" (although in my opinion there's really no such thing) or that define document embedding as only being PDF. At the end of the day I'd be inclined to review EULAs and confirm your findings with foundries that appear to allow this form of embedding.</p>
      <p>Also worth noting that EPub v3 will support WOFF as well as plain TTF/OTF. WOFF in ePub provides the same level of protection as you would with WOFF on the web.</p>
      <p>Cheers, Si</p>
