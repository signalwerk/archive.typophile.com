      <p>&gt;Books are going digital and a dramatic increase in costs for<br>
      &gt;typefaces can't be supported financially in the long-term.</p>
      <p>Of course, it's obvious. Except to the folks who sell typefaces. When God wants to be unkind he makes you a part of the copyright industry and sends fairy-godmothers like Microsoft and Adobe to watch over you.</p>
      <p>&gt;income for type designer and a reasonable protection against pirating</p>
      <p>There is a simple solution to this. It flows from the fact that very, very few fonts made for graphics will also work well in browsers without <strong>adaptation for the purpose</strong>. (Epub rendering engines are browser engines. I don't know of any exceptions or why anyone would want to deviate and re-invent the wheel. Amazon has flat-out announced that HTML5 will be it's publishing language going forward.)</p>
      <p>What foundries should be licensing for this work are their fonts post-processed and re-tasked for the web.<br>
      Got OTFs with a million kerning pairs and advanced OT features guaranteed to send a tickle up your leg? Great, keep selling them. (Yeah, I know, <em>licensing</em> them.) But please, keep them off the web because they don't belong there.<br>
      Instead, toss the fracking kerning pairs out the window ('cause browser support stinks and CSS can handle the kerning where it's absolutely necessary, anyway) and license a font that's -<br>
       • sub-setted with web publishing in mind<br>
       • converted to TTF - the format with the broadest support and, in Windows rendering envionments, a necessity<br>
       • tweaked with adequate TrueType hinting, normalized vertical metrics, scaling, whatever is necessary - for web publishing. (Epub being a subset of web publishing. Is iPad going to be the ONLY platform for you? I don't think so.)</p>
      <p>The idea that fonts created for graphic design work can be licensed for the web and/or epub AS IS and make a customer happy is delusional. As is the idea that there is a market for those very same fonts bundled in an epub wrapper and/or posted on a web server. Anyone who designs for the web, or it's cousin e-pub, are finding this out now, bit by bit. It's an astounding situation, really. Talk about elephants in the room, wow.</p>
      <p>But once you realize that those fonts can fork into two distinct products - one font, the "original", for print as is, and a post-processed version, the "web font", for e-publishing <em>there is no problem</em>.<br>
      What you've exposed to "piracy" is a low-cost spin-off. And a spin-off <em>that works better for the customer's purpose</em>.</p>
      <p>This is one thing  <a href="http://readableweb.com/rb/rbinfo/rbexplained.htm" rel="nofollow">I've been spending a lot of time working on</a> for the past year and I'm about to hang a shingle - offering a service that takes fonts, as is, and adapts them at a very reasonable cost, for e-publishing.</p>
      <p>&gt;We happen to have one author who uses their Knockout typeface.<br>
      &gt;So, we need to find a suitable substitute.</p>
      <p>Please contact me, we can help with this.</p>
      <p><a href="http://www.facebook.com/richard.fink" rel="nofollow">Richard Fink</a><br>
      Blog: <a href="http://readableweb.com" rel="nofollow">Readable Web</a><br>
      Font Director: <a href="http://kernest.com" rel="nofollow">Kernest/Konstellations</a></p>
