      <p>richard said:<br>
      &gt;   E-pub, which, IMHO, is useless, stupid, and counter-productive.</p>
      <p>well, what else would you expect from the corporate publishers?<br>
      look at the members of i.d.p.f., which created the .epub format.<br>
      (i remember their acronym as short for "i design poor formats.")</p>
      <p>the e-book revolution is making their business-model extinct,<br>
      as that model relies on managing the scarcity of p-books, so<br>
      the .epub "standard" is one of their attempts to _stifle_change._</p>
      <p>it's worth pointing out that .epub evolved from the o.e.b. format,<br>
      also maintained by i.d.p.f., which became the "standard" back at<br>
      the end of the 1990s, and the sabotage attempt _did_ work then.</p>
      <p>thanks to the kindle, however, which uses another format (.mobi),<br>
      .epub's shortcomings won't be able to sideline e-books any more.</p>
      <p>which is not to say that the corporate publishers have given up...<br>
      to this very day, for instance, they've still neglected to ever create<br>
      "reference implementations" for either an .epub authoring-tool or<br>
      an .epub viewer-program.  this means that other companies have<br>
      had to start from scratch to build their viewer-programs, and --<br>
      as anyone familiar with such a situation could readily tell you --<br>
      the result is a bunch of apps badly inconsistent with the "standard"<br>
      _and_ inconsistent with each other in terms of their inconsistencies.</p>
      <p>which means the e-book arena is now re-experiencing the awful<br>
      nightmare of "browser inconsistencies" that plagued us in the past.</p>
      <p>&gt;   Browsers are ubiquitous - why not just go with HTML5?</p>
      <p>well, first of all, browsers make very bad e-book viewer-programs.</p>
      <p>aside from that, html5 would be ok, if you're starting from scratch.<br>
      but since i.d.p.f. doesn't really want stuff to work, i'm guessing that<br>
      they will choose instead to continue along their present path, and<br>
      try to continue to support their legacy format which has served their<br>
      (ulterior) motives so fine all along the line.  or, to put it another way:</p>
      <p>if you like that it's broke, and even broke it on purpose, why fix it?</p>
      <p>-bowerbird</p>
