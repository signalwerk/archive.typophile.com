    <p>“History in Small Spaces: Solo Exhibition of  Large Format Archival Pigment Prints” by this author travels from Abingdon 12, NYC, to the 2008 TypeCon Conference in Buffalo, NY.  Eight prints from the original will be on exhibition during the conference then will travel to the Hill Memorial Library, Baton Rouge, LA.</p>
