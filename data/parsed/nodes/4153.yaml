    html: <p> well i checked franklin gothic demi italic/oblique and heavy italic/oblique against the logotype (weird how there is an italic as well as an oblique) and its definately not the same typeface. it may have been based on franklin gothic, but the character shapes are so different, i doubt it. <br> <br>i read somewhere that a typeface was designed specifically for the microsoft logotype, and possibly only the letters of microsoft were done, not an entire typeface, although it didn't state who the designer was or what the typeface was called. <br> <br>i did a lot of searches using google and just found it unusual that there was no information about the designer/company that designed the typeface/logotype, and did the branding. <br> <br>bill gates conspiracy. ;P <br> <br>iota. </p>
