  html: |-
    <p>A colleague of mine wants to use Blue Highway for a project.</p>
    <p>I advise against it: we own a license for Interstate which covers the corresponding weights she needs.</p>
    <p>She insists.</p>
    <p>I tell her I fail to see the reason, and explain Blue Highway is a poor digitisation of exactly the same model.</p>
    <p>No she won't have it, she will accept no substitute.</p>
    <p>Exasperated, I ask her why we should spend money on an inferior design when we have the real deal!?</p>
    <p>She says it looks a bit different, and she wants that exact look.</p>
    <p>...</p>
    <p>Some days, authoritarian rule inexplicably sounds very appealing.</p>
