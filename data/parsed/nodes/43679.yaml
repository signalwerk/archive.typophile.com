      <p>Makambo (deceased, 2000) was more like that than MyFonts. It was largely automated, so that sellers posted their own gif samples and uploaded product themselves.<br>
      I'd recommend getting some experience working for a distributor before you attempt anything like this.<br>
      One difficulty you will run into is how to sell a product with many, many variants, in particular multiple options for multi-user licences. Unless you can automate the process so that sellers can do all the work, you are going to have to charge them, which defeats the whole point of the exercise. However, building and maintaining a sophisticated, automated font-marketing site would be way more complex than ETSY, and would require a huge amount of design and programming at the front end.</p>
