    <p>Hi, I've just started to develop my thesis for my MFA Design program at the School of Visual Arts, here in NY, and I would like to see if you guys can help me with some answers to my very brief questions:</p>
    <p>- if you sell your fonts through any website can you comment the pros and cons of it?</p>
    <p>- if you sell your fonts through you personal website, how do you get the money: paypal, checks, others, etc...?</p>
    <p>- what are the difficulties that you have for selling your fonts on web?</p>
    <p>- what are the most annoying things about buying fonts online?</p>
    <p>- is there any website where designer and typographers can sell their fonts without paying any commission?</p>
    <p>If you can answer these questions, I would be very glad for that, since I'm only playing with a few ideas so far and listening and reading other people's perspective about this subject is extremely important for me!</p>
    <p>Thank you very much,<br>
    Gustavo</p>
