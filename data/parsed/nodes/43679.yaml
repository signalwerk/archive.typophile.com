      <p>Do you have a thesis that relates type design to business models?<br>
      Why are scripts so popular in the retail font market? Is that the kind of question you hope to be able to answer?<br>
      If not, I would say there's too much business in your proposal, and not enough design.<br>
      Also, if you are going to canvas foundries, a systematic approach, contacting them directly, would be more meaningful than throwing up a question on Typophile, although here you may be able to refine the focus of the kinds of questions you should be asking.</p>
