  html: |-
    <p>I am creating a outline of Typographic Terms, but based on current research of various expert opinions, there is no concrete outline for:<br>
    • Slope<br>
    • Stress<br>
    • Axis</p>
    <p>Slope<br>
    The angle of inclination of the stems and extenders of the entire typeface. Not to be confused with axis.</p>
    <p>Stress<br>
    The angle at which letterform contrast occurs in a typeface. The direction and degree of incline in the axis of a typeface.</p>
    <p>Despite the conflicting opinions about Axis, I have determined that those who see this as different than Slope or Stress are correct (consider the “o” in Palatino Italic).</p>
    <p>I look forward to your opinions! Thanks!</p>
