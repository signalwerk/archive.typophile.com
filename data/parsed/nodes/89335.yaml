    html: |-
      <p>Don't know the script. I suspect a modified one though, may be <a class="freelinking external" href="http://new.myfonts.com/fonts/flat-it/ht-gelateria/" rel="nofollow">Gelateria</a> using left part of a /Z for the /T, mixing alternate /d with a /d for the /h.<br>
      Can't be 100% positive for the Gothic but could be <a class="freelinking external" href="http://new.myfonts.com/fonts/rsantos/van-condensed/" rel="nofollow">Van Condensed Bold</a> modified (distressed, slanted and inlined). The better way would probably to ask directly to the designer <a class="freelinking external" href="http://cargocollective.com/RyanjBush#1228240/OLC-WEBSITE-REDESIGN" rel="nofollow">Ryan J. Bush</a>. If he tends to answer, please drop some lines about it.</p>
