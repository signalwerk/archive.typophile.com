      <p>Front - good &amp; minimal<br>
      Back - not so good<br>
      The all lower-case Avant Garde - is that what it is? - is just too difficult to read, it's too hard to differentiate the letters (shapes are too similar) and the lines seem to blend into each other too easily. Try a different font or using mixed case or even spacing the different lines of text further away from each other.</p>
