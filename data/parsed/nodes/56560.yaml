      <p>The big 'a' is Justus.<br>
      I chose Avant Garde becasue it's very round and curvy and my name (in all lowercase) has lots of curves.</p>
      <p>The point size on this version is 10pt. I don't want people to have to squint, though I don't want it to look like a big-print edition book either. A friend recommended trying all caps and moving my name.</p>
