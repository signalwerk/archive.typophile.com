      <p>I think it is very nice. Clean and simple. I am not a huge fan of that shade of purple, but It's a nice composition. I like  to play around with Cicle, Geosans, Lane and Kabel when I am in need of a typeface that is round and curvy like Avant Garde. I am not familiar with Justus. Thanks for enlightening me. Are the lowercase g's as beautiful as the a's?</p>
      <p>j</p>
