    html: |-
      <p>You're in for a long slog. There is simply so much out there that it's better to start by describing what you want, such as: "I need </p>
      <ul>
      <li>a sturdy, rugged serif for newspaper text"</li>
      <li>a casual, friendly script with a nod to the American fifities."</li>
      <li>heavy sans serif typefaces that look like they were hand drawn with a pen or brush."</li>
      </ul>
      <p>With more specific requirements we can be much more helpful with recommendations.</p>
