    html: <p>Yeah, I know what you mean� there are only so many ways to design logos, and everyone wants one that looks just like veryone else's but different. I do think that the Oskar logo is more like the hasbro logo than any of the three you just liked though, because it no only has the smiley-face, but also the rectangle at an angle (which the logos in the links don't have). <br> <br>A few students and I did a seminar last year with the creative team from Leo Burnett in Frankfurt, and we talked a lot about "ideas that have been done before," since we were working on a campaign for a car company, and those are really almost all identical at the moment. They told us that they would never, ever consciously borrow an idea from a campaign that had been done before, competitor or not. If they realized that they had done something that was recycled, they would go back to the client and try to convince the client that they would redo it to preserve originality. Interesting idea I thought� really struck me�</p>
