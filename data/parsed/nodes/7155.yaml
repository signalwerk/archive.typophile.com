  html: "<p>While I was in Prague, one of the first things that I noticed was this: <br><img src=\"http://www.typophile.com/forums/messages/4100/51247.jpg\" alt=\"oskar logo\"> <br>Oskar is the Vodafone subsidiary in the Czech Republic. On first glance, I thought that this was quite a cool logo; I'm not sure if \"oskar\" is written in a custom typeface, or if it is set in a FontShop variation on Dax, but no matter�it looks good. I also appreciate the use of a glyph from the font as the smile. <br> <br>But I was immediately remembered of the Hasbro logo (a company which I worked for a few years ago). In the mid-90s, they redesigned their logo, which since then has looked like this: <br><img src=\"http://www.typophile.com/forums/messages/4100/51248.jpg\" alt=\"hasbro logo\"> <br>For all of my fellow type nerds, I can tell you that the Hasbro logo is definitively set in a custom typeface, aptly called Hasbro Regular. I can't recall who designed it, but I'll bet that someone here can. <br> <br>But no matter� it isn't the typeface that irks me, rather the composition. I'm not saying that this logo is plagerized, it clearly is not, but it does seem \"similar\" <br> <br>Do you think that the Oskar logo was \"inspired\" by the Hasbro logo? Is this too close for comfort? Would you do something like this?  <br> <br>I once made a logo for an online Christian bookstore (that was a fun client�) who directed me to create something \"as close to Amazon's logo as my artistic integrity would allow.\" That was 1999, and both the bookstore and the company I worked for then are gone (the logo, BTW, was the word \"YourKingdom.com\" set in Futura regular, with a streamlined vector swoosh underneath� mea culpa, mea culpa�) <br> <br>Or are my ghosts just coming back to haunt me? <br> <br>This post is dedicated to P22, who seem to have problems with Czech brands using their fonts without proper licenses.</p>"
  html_clean: "<p>While I was in Prague, one of the first things that I noticed was this: <br><img src=\"http://www.typophile.com/forums/messages/4100/51247.jpg\" alt=\"oskar logo\"> <br>Oskar is the Vodafone subsidiary in the Czech Republic. On first glance, I thought that this was quite a cool logo; I'm not sure if \"oskar\" is written in a custom typeface, or if it is set in a FontShop variation on Dax, but no matter�it looks good. I also appreciate the use of a glyph from the font as the smile. <br> <br>But I was immediately remembered of the Hasbro logo (a company which I worked for a few years ago). In the mid-90s, they redesigned their logo, which since then has looked like this: <br><img src=\"http://www.typophile.com/forums/messages/4100/51248.jpg\" alt=\"hasbro logo\"> <br>For all of my fellow type nerds, I can tell you that the Hasbro logo is definitively set in a custom typeface, aptly called Hasbro Regular. I can't recall who designed it, but I'll bet that someone here can. <br> <br>But no matter� it isn't the typeface that irks me, rather the composition. I'm not saying that this logo is plagerized, it clearly is not, but it does seem \"similar\" <br> <br>Do you think that the Oskar logo was \"inspired\" by the Hasbro logo? Is this too close for comfort? Would you do something like this?  <br> <br>I once made a logo for an online Christian bookstore (that was a fun client�) who directed me to create something \"as close to Amazon's logo as my artistic integrity would allow.\" That was 1999, and both the bookstore and the company I worked for then are gone (the logo, BTW, was the word \"YourKingdom.com\" set in Futura regular, with a streamlined vector swoosh underneath� mea culpa, mea culpa�) <br> <br>Or are my ghosts just coming back to haunt me? <br> <br>This post is dedicated to P22, who seem to have problems with Czech brands using their fonts without proper licenses.</p>"
