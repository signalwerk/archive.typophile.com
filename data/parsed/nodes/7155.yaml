    html: <p>I certainly don't have a problem with Richard! I put this little P.S. in my post because he told me in Prague about two separate instances of his fonts being used used in the corporate identities of large companies who weren't registered with P22. And since I saw this logo in Prague, too, I thought that it was an interesting cororally, even though it deals with a different issue. <br> <br>I wasn't suggesting that Barmeno was a P22 font. I was assuming, from its style, that it might be from FSI. I wasn't too far off, since it is from Berthold (as I just found out), and therefore German.</p>
    html_clean: <p>I certainly don't have a problem with Richard! I put this little P.S. in my post because he told me in Prague about two separate instances of his fonts being used used in the corporate identities of large companies who weren't registered with P22. And since I saw this logo in Prague, too, I thought that it was an interesting cororally, even though it deals with a different issue. <br> <br>I wasn't suggesting that Barmeno was a P22 font. I was assuming, from its style, that it might be from FSI. I wasn't too far off, since it is from Berthold (as I just found out), and therefore German.</p>
