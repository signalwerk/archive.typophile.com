    html: "<p>&gt;&gt; Do you think that the Oskar logo was \"inspired\" by the Hasbro logo? <br>No. This idea is everywhere. Off the top of my head: <a href=\"http://www.designinteract.com/features/hellodesign/\" target=\"_blank\">http://www.designinteract.com/features/hellodesign/</a> <br><a href=\"http://www.peoplepc.com/\" target=\"_blank\">http://www.peoplepc.com/</a> <br><a href=\"http://www.3dnews.ru/documents/2750/intelplay_logo.jpg\" target=\"_blank\">http://www.3dnews.ru/documents/2750/intelplay_logo.jpg</a>  <br> <br>&gt;&gt; Is this too close for comfort? <br>Again no. Conceptually it's very close. The execution is not nearly as close as any of the above. <br> <br>&gt;&gt; Would you do something like this? <br>Now that you mention it, no. Not because it's not a good idea, all of the logos above are well executed IMHO. It's just one of those ideas that you think to yourself *genius* only to discover you've reinvented the wheel. Acutally, I might do something like this. The above happens to me at least once in every project. You don't always have a large perspective on your own work, especially when you work by yourself!</p>"
