      <p>@Rui &amp; Marco:<br>
      Yes, spot on with the suggestion that it be more of a graphic system. That was indeed something I was aiming for. My client asked for some small icon which could be cut from icing (you can get die-cutters for icing, too!) in different colours. This could be used on the top of one or two cakes in each flavour, like a key:<br>
      </p><div class="imageWrap"><img src="/files/lb-cakes_6417.gif"></div><br>
      The logo can be split up to create hearts, a flower (three darker colours) and a star (centre). These forms could also be used more generally as sprinkles, which fits the style of my client’s cakes:<br>
      <div class="imageWrap"><img src="/files/cakes_4303.jpg"></div><p></p>
      <p>The question is- do you think it’s acceptable to never use the two different marks (typography / symbol) together in any form? I was intending the mark to be used separately from the type much of the time, but was intending the type to be used with the symbol to tie it together. Do you know of any examples of a brand which has a typographic mark and a symbol mark but doesn’t tie them together in the typical way?</p>
      <p>Cheers,<br>
      H</p>
