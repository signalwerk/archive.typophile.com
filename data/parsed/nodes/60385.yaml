      <p>Hi all,</p>
      <p>Firstly, @NatalieF: Here is what the logo would look like on the left of the type. Difficult to make it look correctly placed, because there is an ascender on the top line but no matching descender on the bottom line (until the end of the line).<br>
      </p><div class="imageWrap"><img src="/files/lb-logos_4893.png"></div><p></p>
      <p>I’ve also made another version (above) with the logo slightly rotated. This makes the star much more obvious. However, I’m probably going to go with the logo below, for the following reasons:</p>
      <ul>
      <li>The filled mark you can create in B&amp;W, which will be important if I want to gold-foil it onto dark card, as I’m intending for the packaging (see below).</li>
      <li>I think black type is more effective for a crisp fashion feel.</li>
      <li>I think the mark getting lighter toward the centre fits better with the light colours and the lightness I want to give the cupcakes.</li>
      <li>The logo can still be pulled apart into its constituent hearts, flower and star. Having the colours getting darker toward the centre but then a white centre breaks this illusion of overlay.</li>
      </ul>
      <p></p><div class="imageWrap"><img src="/files/lb-logo_5929.png"></div><br>
      <div class="imageWrap"><img src="/files/lb-logo-gold_3512.png"></div><p></p>
      <p>Probably need to make the reversed-out versions a bit thicker in the thins...<br>
      Further comments welcome, of course ;)<br>
      H</p>
      <p>—<br>
      Henry Hadlow - <a href="http://work.dlow.org">Graphic Design / Art Direction</a></p>
