      <p>Thanks everyone!<br>
      @Bobby &amp; @Riccardo: I tried some variations on the logo, using a thinner stroke, fill instead of stroke and some other changes, and I don’t really think they work. I also did try lots of that kind of thing when I was initially developing the logo- didn’t want to waste the community’s time with half-baked stuff!<br>
      Anyway, here is a simple variation, with fill:<br>
      </p><div class="imageWrap"><img src="/files/lb-logo_3775.png"></div><br>
      And here’s a type variation. I think the type and mark match better, but this isn’t the feel we’re going for.<br>
      <div class="imageWrap"><img src="/files/lb-logo2_3433.png"></div><br>
      I think the only real alternative is to try something else entirely! I never got that far, because I came up with the mark shown at an early stage and my client really liked it. I’ll try some kind of top-of-cupcake swirl.<p></p>
      <p>@Penn &amp; @Bendy:<br>
      Thanks! Six is OK in China apparently:<br>
      The number 6 (六, Pinyin: liù) in Mandarin is pronounced the same as “sleek” (澑, Pinyin: liù) and “fluid” (流, Pinyin: liú) and is therefore considered good for business. The number 6 also represents happiness. In Cantonese, this number is a homophone for blessings (祿 Lok）<br>
      Four (death!) is the one to watch out for.<br>
      I placed the mark top right because I felt like there’s a line created by the ends of the three words which forms a Lollipop stick. Arguable I know.</p>
      <p>@DrDuckling:<br>
      The mark may turn out to be more important than the type, because we might commission an alternative language version with Chinese characters in a similar style to the above. Maybe this reinforces the calls for an attempt at a different mark altogether.</p>
      <p>@Ratbaggy:<br>
      I like it! The original idea was to use the hearts with multiply blend mode, so I’ve always had the colours getting darker toward the centre. I’ll try some variations on your suggestion. And I’ve got to keep what David said in mind.</p>
