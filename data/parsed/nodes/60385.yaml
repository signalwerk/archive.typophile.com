      <p>Thanks to everyone for your very helpful comments on this thread.<br>
      I feel that, although the improvements might seem slight, the overall result is much more considered, especially for one-colour applications, and I’m very happy.<br>
      Unless anyone has any big criticisms I consider this logo work complete! There’s always a balance between taking the time to get things right, and fiddling to try and achieve perfection, and I’ve got some packaging and a website to work on! But once again, thanks to everyone.</p>
      <p>—<br>
      Henry Hadlow - <a href="http://work.dlow.org">Graphic Design / Art Direction</a></p>
