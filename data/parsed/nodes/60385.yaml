      <p>Hi Bobby,<br>
      Thanks for your comments, much appreciated.<br>
      The concept behind the bakery is a synthesis of high-fashion aesthetics with cupcakes. In China, selling cupcakes for the same price as in the West makes them a very expensive treat, and we want the presentation of the cakes to fit the perceived value.<br>
      I take your point that although the symbol was created using the six hearts described, maybe this doesn’t come across.<br>
      The font used for Lollipop is Ambroise by Porchez Typofonderie:<br>
      <a href="http://www.typofonderie.com/alphabets/view/Ambroise" title="http://www.typofonderie.com/alphabets/view/Ambroise">http://www.typofonderie.com/alphabets/view/Ambroise</a><br>
      with some of the alternate glyphs used.<br>
      The London is indeed strange and I have advised against it but the justification is that the Bakery was founded in London.<br>
      I’ll have a look at reworking the symbol.<br>
      H</p>
