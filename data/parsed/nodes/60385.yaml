    <p>Hi,<br>
    Comments welcome about the attached logo. I’m particularly interested in typographic issues. It’s for a cupcake bakery to launch in Beijing later this year.<br>
    My client and I are taking inspiration from high fashion and fragrances (rather than the more usual fifties America) to create a brand we hope will be aspirational, feminine, a bit whimsical and subtly English.<br>
    The name Lollipop Bakery London is final with the client (but I have raised the issue that it sounds like a bakery making lollipops rather than a bakery called Lollipop which makes cupcakes). The logo is a lollipop/cupcake made out of six hearts (which also combine to make a star &amp; flower).<br>
    Cheers,<br>
    Henry</p>
    <p></p><div class="imageWrap"><img src="/files/lb-logo_4549.png"></div><p></p>
