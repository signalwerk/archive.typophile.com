      <p>I think you really hit the spot with the font choices. The Logotype is very elegant and playful as already said.</p>
      <p>however I think you are trying to conglomerate what could be separate elements of the overall graphic identity in one logo. </p>
      <p>Have you considered extracting de colored shapes from the logo, and use it as a separate element or elements? I mean, not a part of the logo but as graphic elements of the identity. </p>
      <p>We often see designers trying to fit every idea they have in a single logo, and I don’t see why it should be that way. A graphic identity is much more than a single mark. In this case I like both the type (strong enough) and the colored mark, but definitely not together.</p>
