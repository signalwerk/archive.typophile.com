      <p>I am on a PowerMac G5 2*2.5G Hz and have had a fair amount of problems with the CS3 apps, esp. InDesign. Erratic crashes especially when doing stuff in Open, Import, Save dialogs. Using the workarounds that have been found  by smarter people than me, one can cope, but it is a hassle: I have to restart ID often because of sudden disappearances, contain the amount of fonts active, be careful not to drag–and–drop images, and so on.</p>
      <p>Word is that Intel-machines behave better, though.</p>
      <p>I do feel that the combination PowerMac/Leopard/CS3 is not ideally suited for production work. You’re better of staying on Tiger. Or upgrade to Intel : )</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
