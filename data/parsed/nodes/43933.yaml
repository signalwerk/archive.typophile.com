    <p>Hi I am wondering if I should upgrade to Leopard, am using Adobe CS Suite 3. Have done searches on other forums to see who has and if they are having issues with any of the Adobe CS Suite 3 applications... or fonts issues? </p>
    <p>I see the designers posting here of a high level, so who better to ask. Not wanting a poll for posters to do 1 liner posts like: “I have”, would prefer to read how the over all experience was and if it was worth while. Any issues with fonts, font managers, font caches...</p>
    <p>Wanting to update the studio, and for once have not jumped in head first on this upgrade. thanks in advance.</p>
