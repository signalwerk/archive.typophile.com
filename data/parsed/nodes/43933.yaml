      <p>Oisin...machines that were upgraded as in “10.5 was installed on top of 10.4” or upgraded as in “10.4 was deleted and 10.5 was installed”?</p>
      <p>If it’s the former, then it’s no wonder you have problems.  The upgrade process for OS X is quite nice, however, it’s not perfect and a huge amount of cruft is still left over to cause problems.  I never upgrade when I install a new OS; I back everything up and do a complete erase and install of the new version.  Start fresh.  It takes longer to get up and running that way but it saves problems in the future.</p>
    html_clean: |-
