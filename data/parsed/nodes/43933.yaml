      <p>Oisin: erase and install is a complete “nuke ’n’ pave” of the drive.  There will be no user ids or groups until after you’re done.  Unless you’re thinking of an “archive and install” which preserves everything on the drive and creates a new system folder.  I’ve done one archive and install since switching to Mac and less than a week later I had to erase and install because things were just wrong.</p>
      <p>Concrete: Leopard works perfectly on my G4 PowerBook along with CS3.  I’ve heard of relatively few problems regarding Leopard on PPC Macs.</p>
