      <p>I used to work in a printing company that has Mac OS X from 10.2 to the latest version. All of them worked just great, but, sometimes this one intel g5 simply didn’t ’want’ to print for some reason. When we had a problem like that, we opened the file back in a non-intel machine and it would print just right and easy.<br>
      I guess that if you upgrade to Leopard your CS3 suite will work just fine, but, question is: Do you really need (or want) to upgrade?</p>
      <p>Good luck!</p>
      <p>André</p>
      <p>p.s.: You are going to laugh: I am still running Mac OS 9.2.2 = IT WORKS!</p>
