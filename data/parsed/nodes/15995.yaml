      <p>This sounds a little like the Multiple Master Tool that ATM came with; it showed as many axes as a font had, with sliders to select instances from what was actually available. That convention of letting the utility flex to fit the design’s feature set would be cool.</p>
      <p>Knowing that OT font features may vary from one design to another, maybe this tool could accomodate some starter text that the type designer specifies, which will show the features individually and in combination. If the design has a lot of swash, or ligatures, or specific goodies, that could be part of the starter text. I have a few features planned for an upcoming release which, when used together, multiply the options. I’d like to illustrate those combinable features from the start as well. How to display this elegantly? I agree the separate feature buttons are good, and the before/after split screen is a must. Maybe the tool’s default is to start up with all the compatible features on, and the user can switch them off at their discretion.</p>
      <p>I have to say, I think it would be so very nice if this tool was open-source or made freely available to all foundries; it will benefit smaller foundries the most. Could be a free download from everyone’s website. Think iTunes here….</p>
