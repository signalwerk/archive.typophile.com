      <p>“The Adobe OpenType readme seems to cover most of this”<br>
      The Adobe readme is good but not what I was talking about and not intended as a replacement. Also, users don’t read it.  You have to bundle it with fonts to have a prayer. Also, it is Adobe’s.  Would other foundries want to send you to Adobe’s type site or bundle Adobe literature with their own fonts? I doubt it.<br>
      The premiss for my question is: Why do so few people seem to know about the features of the fonts that they purchase? What would help in that area? Would this not help add to the feeling of VALUE in typefaces that go the extra mile?<br>
      I am thinking about something that would be modified for every new typeface that would be BUNDLED with the typeface and explain its individual features.  It would be Chinese menu style with assortments of mix and match text blocks that type designers and foundries could customize on a case by case basis.<br>
      Look at Karsten’s “manual”.  It is a start.</p>
      <p>ChrisL</p>
