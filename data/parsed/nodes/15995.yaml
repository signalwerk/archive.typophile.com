    html: |-
      <p>Here’s my “dream tool”. Think of it from the point of view of end-user usability, as interactive, not a static pdf.</p>
      <p>At the moment, the best gizmo to check out the features of an OT font is the OpenType Preview panel in FontLab.</p>
      <p>Down the left are the buttons for the features (although the names could be spelled out in full).<br>
      There are two large fields where you can enter text.<br>
      The top one (“source”) shows the font plain, the bottom one (“result”) shows it with the OT feature activated by selecting a button at left.</p>
      <p>This gizmo could be “loaded” for a particular font, so that the default text string for each feature shows the glyphs (or some of them) where the feature is present.</p>
      <p>It’s awkward to put your new OT font through its paces in InDesign, because the OT menu is buried, and because some InD commands, such as small caps, don’t tell you whether the feature is true OT or not, (At least, that’s how it is on CS 1 — I have just licensed some fonts to an outfit running Quark 3.5 on Mac OS 9.1, which suggests to me that a stand-alone OT previewer that comes with the font would be preferable to relying on graphics applications for demonstrating font features.)</p>
      <p>I’ve suggested to several font distributors that this would be a good tool to have online. I wish I had the know-how and resources to implement something like this.</p>
