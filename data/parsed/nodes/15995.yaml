    html: |-
      <p>I’ll never joke again.</p>
      <p>The Adobe OT Guide should be regarded as the standard document for OT users (and I refer to it too). Moreover, OT fonts should stick to the basic features and their functionality. So users can develop a feeling of familiarity with OpenType in general. Using terminology consistently would help too, think of “Std” or “Pro”, as would more standardized OT-feature interfaces.</p>
      <p>My sole point in the other thread was Stylistic Set features which may differ in every font. Btw, it is an advantage that this is so.</p>
      <p>As to the “starter question” however, you are right. I think that *if* a font differs from the (quasi)standard, this should be mentioned, so users know what they will get.<br>
      Like, are proportional osf &amp; currency symbols the default ones? Prebuilt fractions only or arbitrary fractions? What does calt do? Even, what does the character set look like? Pro can mean quite different things from foundry to foundry - even if the term is applied correctly.<br>
      This is not an encouragement to divert from (quasi)standards, but to make known if this is the case.</p>
