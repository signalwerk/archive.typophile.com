    html: |-
      <p>The Ambigrammatic is interesting. Looks like they devised a single letter ambigram form for every pair of letters in the alphabet (including the same letter), then the program looks at the string(s) you provide and looks up the corresponding ambigram form for each pair of letters (right-side-up and up-side-down) and displays the ambigram. Crude, but effective in a rather mechanical way. Not all of the forms work real well.</p>
      <p>I just designed <a href="http://www.marksimonson.com/images/revelation-big.gif">an ambigram for a client</a> who is going to use it for a tattoo. They’re not easy, but can be fun (ambigrams, I mean).</p>
      <p><a href="http://www.johnlangdon.net/">John Langdon</a> is the master of this particular art form.</p>
