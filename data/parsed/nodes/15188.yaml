      <p>Hey Tim, thx. I emailed you, btw.<br>
      &gt; was that part of the briefs or your reaction to the problem?</p>
      <p> I’d say ’reaction to problem’ or ’reaction to puzzle’. More often than not, clients need to be  gently educated on the benefits of a custom mark vs. something done in a font. So if a brief exists, hopefully for us, it’s a broad call to solve the puzzle with a custom lettering solution.<br>
         Thus, the lettering journey — from sketchbook musings, to illustrator doodles, to pleasing the client with a final piece — becomes an invigorating exercise in problem solving. It doesn’t always happen like that, but we can dream, eh? (sorry, I know this is preaching to the choir.) :D</p>
