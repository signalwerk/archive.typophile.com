      <p>My view is that the problems are with the rotation point (the two c’s) and the crossbar of the A/M and the way the y/P is formed, there are opportunities for improvement on the r. I feel that overall it needs more work on it to be effective. Also there is a missed opportunity (or built in redundancy) in the treatment of the title, in that it does nothing to support the rotational/reflective aspect of the ambigram.<br>
      Tim</p>
