    html: |-
      <p>Do you have an idea as to the vintage of the cheque?<br>
      Something like this would:<br>
      A. have been engraved or lithographed for the bank, or<br>
      B. if the bank was small it might purchase a special cut from a type foundry which would include everything shown in the image. These cuts were sometimes called billheads, or more recently<br>
      C. a lettering artist would do the design and this would be photographed for printing.<br>
      There might be a font with the interesting treatment of the e, but I don't recall it offhand.<br>
      Don</p>
