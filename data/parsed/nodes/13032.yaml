      <p>William, that is definitely a neat part of town. There are actually a good amount of textile and supply places for designers there. A lot of designers and students go down there to get  supplies for comps, projects (plastic, resin and other materials).</p>
      <p>I like not having a concept of design, as a designer its refreshing to see things that are purely functional. A lot of times there is a lot of character and personality to something that wasn’t overthought by a designer.</p>
