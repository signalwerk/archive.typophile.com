    <p>Alright! Now the site is live and registration* available, let’s starting a running list of who’s going, when they are arriving/leaving, and what you hope to do/eat/see in the big apple!</p>
    <p>Who: Me, myself and I, aka Miss Tiffany, Tiff, Tif, and to close friends and family, T.</p>
    <p>When: I’m hitting the east coast the Friday before it all starts to hang out with an old friend and will arrive at the official conference hotel, <a href="http://www.theroosevelthotel.com/">The Roosevelt Hotel</a> late Sunday night or Monday morning. I’ll be leaving, thoroughly satiated and happy, the following Monday.</p>
    <p>What: I really hope to visit: <a href="http://www.chisholm-poster.com/">The Chisholm Poster Gallery</a> — <a href="http://www.metmuseum.org/">The Metropolitan Museum of Art</a> to see two of my favorite paintings by Pierre-Auguste Cot - The Storm and Springtime. But I can’t say no to the Lehman collection or anything from the PreRaphaelite era or the Dutch, hmm, or Kandinsky, or Caravaggio. Yikes. — <a href="http://www.moma.org/">MoMA</a> to see the new changes in architecture. — But most of all, to see my friends at the conference whom are all just my type. </p>
    <p>* The only browser experience problems at this time is Internet Explorer and only on a PC. However, these people can see some of the content on the site and can still register and see most of the content if they skip directly to <a href="http://www.sotalink.com/register.html" title="http://www.sotalink.com/register.html">http://www.sotalink.com/register.html</a> — We are aware of the problem and are working toward a solution.</p>
