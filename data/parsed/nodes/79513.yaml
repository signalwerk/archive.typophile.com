    html: |-
      <p>I wouldn't be surprised if it was hand-lettered. Film or process lettering is another possibility. I've checked specimen books for Photo-Lettering, Filmotype, and Lettering Inc. All of them had similar styles, but unfortunately none matches exactly.</p>
      <p>(Coincidentally, the closest match from Filmotype, "Escort", is being digitized and will probably be released soon. I'm not the one working on it and not involved in release schedules, so I don't know exactly how soon.)</p>
