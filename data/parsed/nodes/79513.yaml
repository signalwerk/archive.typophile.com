    html: |-
      <p>Hi oldnick, Thank you for your reply!</p>
      <p>Yes it seems Univers is a very close match, but alas... The model is a "1950 Oldsmobile Rocket 88 2 Door Hardtop" and the quotation marks on Univers differs from the typeface in the advert.</p>
      <p>Headline Gothic seems a good match as well (though very late, 1995), but Univers is the winner so far.</p>
      <p>Look at this link for instance, there appears to be minor differences throughout, so it cant be Univers...<br>
      <a href="http://www.flickr.com/photos/autohistorian/3971168200/" title="http://www.flickr.com/photos/autohistorian/3971168200/">http://www.flickr.com/photos/autohistorian/3971168200/</a></p>
