    html: |-
      <p>Try creating a digital facsimile of an old letterpress document.<br>
      Anything prior to the 1960s.<br>
      That will require a lot of discretionary "manual" adjustments, thereby training you in the nuances of typographic setting, and also give you some perspective on the relationship between different technological eras, which is a driving force in typography.</p>
