    <p>Hi everyone,</p>
    <p>I am a student of graphic design who is new to typography and would like to develop my knowledge in this area , as it's a very important aspect of my job. I purchased some recomended books on typography (Fonts , tamye riggs.  Typeography essentials. Helvetica, homage to a typeface), but the only thing I can do is look at them and read the rules , but I don't feel like I'm learning alot by doing that , at least when I start a new project on photoshop. I recently started to draw by hand using a pencil famous and cool logos , mainly only-lettered logos , and I feel like it's deepening my visual knowledge on the topic  since I improved a bit my "type vision".</p>
    <p>Is there a better method wich you reccomend/suggest to improve my typography skills?</p>
    <p>Thank you for the attention,<br>
    Pierluigi Giglio</p>
