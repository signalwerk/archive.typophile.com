      <p>Very nice!  I like your font quite a lot.</p>
      <p>The only suggestion I have matches that of antiphrasis: the joins of M, N, W, and w look too black.  This could be fixed, for instance, on the top left of the M by shifting the vertical leg to the left.</p>
      <p>I think the irony's going over my head. ;)  To me, the font seems just very clean and solid.  A bit refined, maybe.</p>
