      <p>Wow, what a difference it makes to see it set. I think your basic forms may be okay but to fine tune them up you will have decide on your spacing right now because unfortunately the font is not very well spaced yet. After you do that you may also realize that you can alter the lettershapes for better fit too. And then you space things again. And around &amp; around. Hopefully not infinitely. Anyway, that is my suggestion. </p>
      <p>Also, you might want to move the ear of the g up to make spacing easier.</p>
