      <p>Hello! Here's a sample of a revised version of the font.<br>
      <a href="http://typophile.com/files/rs_ironia_2007.pdf" title="http://typophile.com/files/rs_ironia_2007.pdf">http://typophile.com/files/rs_ironia_2007.pdf</a></p>
      <p>Revision of all uppercase characters is needed, I think the curved characters like "O" are not optically adjusted to match straight topped characters.</p>
