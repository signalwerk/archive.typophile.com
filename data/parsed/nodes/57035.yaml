    <p>this great type is called "Hadassah", designed in israel by Henry Friedlander.<br>
    when i turned one of the letters on it's side, i noticed it's interesting "okatsim"* that are similar or were inspired by latin serifs.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_6223.jpg"></div><p></p>
    <p>* "oketz" is the hebrew term for something like serifs, only in the upper end of the letter, as seen in this picture:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-11_3591.jpg"></div><p></p>
    <p>my question is something like this:<br>
    what kind of fonts(english i mean) have these kind of serifs?</p>
