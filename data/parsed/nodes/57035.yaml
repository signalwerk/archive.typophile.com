      <p>I read somewhere that Friedlaender was consciously trying to get the feeling of Jenson in his type, so it's not surprising that there's some echo in the shapes, and the modulation of line. So the answer to your question I think is: Jenson. </p>
      <p>The story of Hadassah, which is as you say one of the great Hebrew types, is incredibly moving. He was a student of the great Rudolph Koch in Germany, but moved to Holland when the Nazis took over in Germany. He started work on what would become Hadassah in Holland. When the Nazis took over, he buried his drawings, but continued to work on it in hiding for nearly three years in an attic, while fed and protected by his non-Jewish wife. He survived and after the war he dug up the drawings, emigrated to Israel and completed it there.<br>
      Influential type teacher Gerrit Noordzij says he was responsible for making what became KABK "letter friendly" and so to hire Noordzij.</p>
      <p><a class="freelinking external" href="http://www.dartmouth.edu/~library/Library_Bulletin/Nov1991/LB-N91-Fontaine.html" rel="nofollow">Here's an extensive description of the development of Hadassah</a>, with a nice bibliography at the end. You should be able to get a hold of his book in Hebrew in Israel, where he also taught.  </p>
      <p>One of the heroes of type, in my book. </p>
      <p>ps, I edited this to add the link, so it got out of order.</p>
