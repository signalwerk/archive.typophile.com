    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : FF Dax</strong></p>
    <p><a href="/wiki/Hans%20Reichel" class="freelinking" rel="nofollow">Hans Reichel</a>, 1995-2000</p>
    <p>The FF Dax family developed from the idea of combining the clarity of a narrow Futura with a "slightly roman touch". The result is a space-saving but very legible typeface.</p>
    <p>Ten years after FF Dax was created, Reichel revised the forms as FF Daxline, designed to be more readable variation for text use.</p>
