      <p>That's something. Note also the links to italics discussion and especially see Briem's pages on italics. Start here:<br>
      <a href="http://briem.ismennt.is/2/2.3.4a/2.3.4.31.italic.htm" title="http://briem.ismennt.is/2/2.3.4a/2.3.4.31.italic.htm">http://briem.ismennt.is/2/2.3.4a/2.3.4.31.italic.htm</a></p>
      <p>and note also the three sub-links in this section. His bit on curves is great.</p>
      <p>I've already started writing up some of my own observations on italics and obliques, stemming from my work on Hypatia Sans italics. Mostly aimed at the practical issues of making modified obliques or italics from an upright face. Might be helpful to somebody out there, I hope.</p>
      <p>Cheers,</p>
      <p>T</p>
