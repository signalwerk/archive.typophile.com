    html: |-
      <p>The contrast is most like <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/serpentine/" rel="nofollow">Serpentine</a>, but the G is quite different and the serifs on your sample are smaller. The only other approximately similar style was <a class="freelinking external" href="http://new.myfonts.com/fonts/urw/agenda/" rel="nofollow">URW Agenda</a>, but the contrast is less and the serifs are still too big. Almost anything else I saw that may have had similar serifs was much more monotone in stroke weight (like <a class="freelinking external" href="http://new.myfonts.com/fonts/urw/bluejack/" rel="nofollow">URW Bluejack</a>).</p>
      <p>If I were trying to reproduce this, I think I would try to customize the heavy weight of Agenda by playing with outlines to change the contrast.</p>
      <p>- Mike Yanega</p>
