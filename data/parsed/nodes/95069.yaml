      <p>Frank, that's exactly what interests me about it ... I completely agree that several of my solutions are bug-ugly; but I'm curious what a grotesque script would look like. I've been surprised by the lack of "straight-up and constructed" scripts on the market, and think that an italic Helvetica could be a great basis to build upon.</p>
      <p>The only problem is, I'm not actually a font designer myself, just a passionate graphic designer who sits around wondering about these kind of things.</p>
