    <p></p><div class="imageWrap"><img src="http://typophile.com/files/helvetica-script_3948.jpg"></div><p></p>
    <p>Hi gang! I only post infrequently, but I was puzzled about something lately and had to ask ... with all the riffs and homages to Helvetica over the years, hasn't anyone done a script version of the typeface? I assumed this would be simple to find, but after a bit of searching, I came up with nothing.</p>
    <p>It seems to me that such a face could be not only beautiful (and in some ways, funny), but also fill what I perceive as a void of highly legible, non-expressive modern script faces.</p>
    <p>I've attached a ridiculously rough sketch of what I'm talking about ... I'd love any leads to a face like this, and any opinions on whether such a face would be a terrible idea or not. Thanks!</p>
  html_clean: |-
