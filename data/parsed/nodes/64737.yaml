    html: |-
      <p>The mobile version is very nice as far as it goes, but it's disappointing that you can't access the whole site in the same manner, just topics and main posts. </p>
      <p>I'm used to the way the standard Typophile pages work on the iPhone. The most awkward aspects are the pages that list topics, because they have a wide fixed width, and the text entry boxes for posting comments, which are also way too wide. Reading topic posts is okay, unless you want to see the name and avatar of the poster at the same time. Viewing the site in horizontal orientation helps, but I prefer reading in portrait orientation--less scrolling.</p>
      <p>If the "normal" site was designed a bit differently, I don't think there would be much need for a custom mobile version, at least for the iPhone.</p>
    html_clean: |-
