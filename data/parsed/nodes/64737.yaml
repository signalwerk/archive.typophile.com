      <p>How about "thank you"?<br>
      Cool thing, Jared. It's nice not to have to zoom and scroll all the time!</p>
      <p>I wonder how much information that little screen can take. I mean in the overview (the first screenshot you show above) it'd be cool to see which Forum a post is in, and/or see more than one line of preview text. And maybe a "updated" time stamp to see what's new? But maybe that's already too much to squeeze on that screen.</p>
      <p>Also:<br>
      - I second that being able to access one's own user tracking list would be nice.<br>
      - I agree that "Launch Site" is a bit weird in terms of wording, but it's nice to have that option so close.<br>
      - The loading indicator is super sweet! :)</p>
