  html: |-
    <p>Fellow Typophiles, </p>
    <p>I've been working on a pet project lately to get a useful mobile experience for Typophile — for those moments when you're on the go and want to get a quick snapshot of what's happening. The design allows you to quickly browse through the latest posts, and jump to the site to get involved if something catches your eye.</p>
    <p>It's just a start, but the project has already undergone a number of improvements and revisions, and I'd love to get your thoughts for where you'd like to see it evolve.</p>
    <p><a href="http://typophile.com/m" title="http://typophile.com/m">http://typophile.com/m</a></p>
    <p>Screenshots (iPhone):</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/IMG_0243_5722.PNG"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/IMG_0244_5947.PNG"></div><p></p>
