      <p>“Feeds”? (Mobile Safari as RSS reader? Is that what you intend?) “Launch site”? Launch what site? Where? Precision in terminology would be helpful.</p>
      <p>Please explain further if you are one of the shadowy “moderators” of this site and if such CSS changes will be permanent.</p>
      <p>Also, <code>m.typophile.com</code> is the generally accepted domain nomenclature. <code>/m</code> is not wrong, just unnecessarily different. The site should auto-detect a mobile device, show you the mobile-optimized version, and give you a link back to the conventional version. (Sadly, this is where we’ve arrived a decade after the <code>handheld</code> CSS media type was invented.)</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
