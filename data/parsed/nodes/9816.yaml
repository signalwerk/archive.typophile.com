    html: "<p>&gt; the stroke of the broad pen? <br> <br>That makes sense. On the other hand: <br>1) If you used rotation and/or expansion (as opposed to just translation), you could make the bar taper even while keeping it straight. (Hey, I'm not as chirographically ignorant as I might seem! \"Know your enemy\". ;-) <br>2) That doesn't explain why the bowed bar is so rare. The only mainstream font I can think of that has an \"A\" with a bowed bar is Ehrhardt. Usually that form is confined to the runic or Byzantine styles. <br> <br>hhp <br></p>"
