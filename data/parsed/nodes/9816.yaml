    html: <p>I think the k was happy as it deserved (this is not to contradict Hrant, I just found it ok). <br>My compliments for your digitization (remember my first post?), but to me the old k is more lively and adds to the design. <br> <br>Do you still use FreeHand? I think the way tools behave in FontLab (and in type design programs in general) cannot be replaced by the use a vector program. You have a higher degree of freedom, and you get a first-hand response from the em-square grid coarseness.</p>
