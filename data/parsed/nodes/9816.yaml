    date_raw: 28 Aug 2003 — 11:20pm
    votes: null
    html: "<p>Concerning the tapered bar again, I forgot to mention why I personally like it: not because it comes from chirogaphy (I know, you're surprised ;-) but because it balances the stroke weight distribution so nicely: thick on the left where the thin arm is, thin on the right where the thick one is. <br> <br>And concerning the bowed bar: in searching the Type Design discussion list's archives for the Parkinson/Downer \"separated at birth\" thing*, a  coincidence fittingly parallel to that one took place! In that thread (now more than 2 years old) Kent wrote the following**: <br> <br>\" <br>regarding the bowed crossbar on the A, there seems <br>to be some precedent for this in various Victorian and fin-de-siecle <br>(XIX siecle, that is) display faces. The instances <br>that I recall are more of a bent crossbar, as opposed to strictly bowed <br>or sagging. This feature can be seen in a modern <br>copy like Algerian: <br> <br><a href=\"http://www.myfonts.com/FontFamily18556.html\" target=\"_blank\">http://www.myfonts.com/FontFamily18556.html</a> <br> <br>I have seen this feature in hand-drawn types on posters from that era. <br>There is a Mucha poster (not one of the particularly <br>famous ones) for La Passion (1904) which demonstrates this. Since this <br>was the era of chromalithography, I believe types <br>like these would have descended directly to the cigar box that inspired <br>John. <br> <br>I notice that Matthew's Sophia  <br> <br><a href=\"http://www.fontbureau.com/specimens/sophia.html\" target=\"_blank\">http://www.fontbureau.com/specimens/sophia.html</a> <br> <br>also features an alternate A with the bent crossbar, which makes me <br>wonder if there is a Byzantine precedent for this form. <br> <br>As for a bowed crossbar, per se, Jim's El Grande  <br> <br><a href=\"http://www.fontbureau.com/specimens/elgrande.html\" target=\"_blank\">http://www.fontbureau.com/specimens/elgrande.html</a> <br> <br>has a bowed crossbar. But, in a font of this character, I would guess <br>that Jim probably arrived at the bowed crossbar from <br>a completely different direction. <br>\" <br> <br>And subsequently: <br>\" <br>Thought of another example. Frantisek Storm's Serapion has a distinctive <br>cap A with a bowed crossbar:  <br> <br><a href=\"http://www.stormtype.com/htm/serap.html\" target=\"_blank\">http://www.stormtype.com/htm/serap.html</a> <br>\" <br> <br>* <a href=\"http://www.typophile.com/forums/messages/30/14948.html\" target=\"_blank\">http://www.typophile.com/forums/messages/30/14948.html</a> <br> <br>** It's public record, but I still hope Kent doesn't mind... <br> <br>hhp <br></p>"
