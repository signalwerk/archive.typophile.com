    html: "<p>I don't spend so much time to look at it. sorry. My mains comments are: <br> <br>Make figures more figures, less caps. Check good oldstyle figures to learn what are the differences between figures design, who don't follow same rules as latin script. <br> <br>Give modulation of width in your caps, follow Romans inscriptions more, as in general your style is quite influenced by writing. I will have say differently if you started something like a Century. Get it? <br> <br>Overally, its a nice face, I just wonder why you use a serif for your \"a bit large\" r when you use better endings for s. <br> <br>good luck for it!</p>"
    html_clean: "<p>I don't spend so much time to look at it. sorry. My mains comments are: <br> <br>Make figures more figures, less caps. Check good oldstyle figures to learn what are the differences between figures design, who don't follow same rules as latin script. <br> <br>Give modulation of width in your caps, follow Romans inscriptions more, as in general your style is quite influenced by writing. I will have say differently if you started something like a Century. Get it? <br> <br>Overally, its a nice face, I just wonder why you use a serif for your \"a bit large\" r when you use better endings for s. <br> <br>good luck for it!</p>"
