    html: <p>&gt; I wonder where that feature comes from. It's brilliant. <br> <br>Could the source be from, say, the stroke of the broad pen? When the bar of the A dips in the middle, it's natural that the left side of the stroke, as it moves down and right, would be wider. For what it's worth, the crossbar on the H also seems to be chirographically inspired. <br> <br>Back to Quetzal (great name), the sample settings posted earlier in the PDF looked a bit anemic, especially with the loose spacing. Your drawing of the newspaper cut looks much heartier to my eyes. Were I to use this face in a book, I would prefer the heavier weight but with longer ascenders/descenders. <br> <br>One problem that I do see with this heavier weight is that the counters of the n and m have closed up much faster than those of the c and o, so perhaps they need to be widened to maintain even texture.</p>
    html_clean: <p>&gt; I wonder where that feature comes from. It's brilliant. <br> <br>Could the source be from, say, the stroke of the broad pen? When the bar of the A dips in the middle, it's natural that the left side of the stroke, as it moves down and right, would be wider. For what it's worth, the crossbar on the H also seems to be chirographically inspired. <br> <br>Back to Quetzal (great name), the sample settings posted earlier in the PDF looked a bit anemic, especially with the loose spacing. Your drawing of the newspaper cut looks much heartier to my eyes. Were I to use this face in a book, I would prefer the heavier weight but with longer ascenders/descenders. <br> <br>One problem that I do see with this heavier weight is that the counters of the n and m have closed up much faster than those of the c and o, so perhaps they need to be widened to maintain even texture.</p>
