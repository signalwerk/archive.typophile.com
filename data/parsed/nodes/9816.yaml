    html: "<p>Great sketch! Very handsome set. <br> <br>The caps seem to be narrower than the lc. This is uncommon, but could work, depending on their relative height: what is it? <br> <br>Some specifics: <br>- Try making the bar of the \"A\" thicker on the left, like those great recent South American fonts. <br>- Avoid modularity, like in B/P, C/G and E/F (especially the first, and also the third). <br>- Splay the \"M\". <br>- Widen the \"R\". <br>- Narrow the \"2\" and \"6\", widen the \"4\" and \"8\". <br>- Don't put trapping in your drawings, save it as the last step in production. <br> <br>BTW, where are the first \"Q\" and \"R\"? <br> <br>Overall, great stuff! <br> <br>hhp <br></p>"
    html_clean: "<p>Great sketch! Very handsome set. <br> <br>The caps seem to be narrower than the lc. This is uncommon, but could work, depending on their relative height: what is it? <br> <br>Some specifics: <br>- Try making the bar of the \"A\" thicker on the left, like those great recent South American fonts. <br>- Avoid modularity, like in B/P, C/G and E/F (especially the first, and also the third). <br>- Splay the \"M\". <br>- Widen the \"R\". <br>- Narrow the \"2\" and \"6\", widen the \"4\" and \"8\". <br>- Don't put trapping in your drawings, save it as the last step in production. <br> <br>BTW, where are the first \"Q\" and \"R\"? <br> <br>Overall, great stuff! <br> <br>hhp <br></p>"
