elgrande.html</a> <br> <br>has a bowed crossbar. But, in a font of this character, I would guess <br>that Jim probably arrived at the bowed crossbar from <br>a completely different direction. <br>\" <br> <br>And subsequently: <br>\" <br>Thought of another example. Frantisek Storm's Serapion has a distinctive <br>cap A with a bowed crossbar:  <br> <br><a href=\"http://www.stormtype.com/htm/serap.html\" target=\"_blank\" class=\"link-external\">http://www.stormtype.com/htm/serap.html</a> <br>\" <br> <br>* <a href=\"http://www.typophile.com/forums/messages/30/14948.html\" target=\"_blank\" class=\"link-lost\">http://www.typophile.com/forums/messages/30/14948.html</a> <br> <br>** It's public record, but I still hope Kent doesn't mind... <br> <br>hhp <br></p>"
  - id: 62593
    user: 829
    date: 2003-08-29T01:26:00
    date_raw: 29 Aug 2003 — 1:26am
    votes: null
    html: "<p>I am starting to like this face very much. <br> <br>Because you certainly showed us, that you are capable of making a serious typeface, I'd like to comment more detailed and maybe more on the design. If I may. <br> <br>I like the overal impression. But the stylistic feature you build in, can be very hard to handle rigth. Let me explain. <br> <br>By making incisions in the round strokes, you took away one of the most important features of what is called, an expansion face. ('written with a broad nibbed pen'). You have not only taken a lot of wheight and color away by doing this, but also  you changed the typical wheight arrangement.  <br> <br>Therefore you might reconsider some of the characters you made. Not only in their form, but as well in their structure.  <br> <br>I'll give you an example, your 's': <br>* its overall structure is pretty round. <br>* its form is round as well. (the srifs are partially angular, but those are only part of the whole form) <br>* ist middle part is far more dark than the upper and lower part. (this is argumented within the context) <br>If you compare it to your lc 'u', you'll notice a few major differences: <br>* its overall structure is angular <br>* its form is angular. its bowl has a more 'stroke'-like feel to it. <br>* its color i has been equally divided. <br> <br>So, what I want to say, is that I still have a little problem with the way the wheight/color has been divided within the characters. And that some characters might not fit in totally within the overall concept, when you look at their structure. <br>Sometimes s little bit of diversity in color and structure is wanted and even needed, but to which amount is a very important and difficult decision. Balance vs. concept! <br> <br>Like I said before, I like this typeface. And because I think this one could become wonderfull design, I took the liberty of being honest and even a little bit strict. <br> <br>If you need more explenation.... <br> <br>---Jacques</p>"
    html_clean: "<p>I am starting to like this face very much. <br> <br>Because you certainly showed us, that you are capable of making a serious typeface, I'd like to comment more detailed and maybe more on the design. If I may. <br> <br>I like the overal impression. But the stylistic feature you build in, can be very hard to handle rigth. Let me explain. <br> <br>By making incisions in the round strokes, you took away one of the most important features of what is called, an expansion face. ('written with a broad nibbed pen'). You have not only taken a lot of wheight and color away by doing this, but also  you changed the typical wheight arrangement.  <br> <br>Therefore you might reconsider some of the characters you made. Not only in their form, but as well in their structure.  <br> <br>I'll give you an example, your 's': <br>* its overall structure is pretty round. <br>* its form is round as well. (the srifs are partially angular, but those are only part of the whole form) <br>* ist middle part is far more dark than the upper and lower part. (this is argumented within the context) <br>If you compare it to your lc 'u', you'll notice a few major differences: <br>* its overall structure is angular <br>* its form is angular. its bowl has a more 'stroke'-like feel to it. <br>* its color i has been equally divided. <br> <br>So, what I want to say, is that I still have a little problem with the way the wheight/color has been divided within the characters. And that some characters might not fit in totally within the overall concept, when you look at their structure. <br>Sometimes s little bit of diversity in color and structure is wanted and even needed, but to which amount is a very important and difficult decision. Balance vs. concept! <br> <br>Like I said before, I like this typeface. And because I think this one could become wonderfull design, I took the liberty of being honest and even a little bit strict. <br> <br>If you need more explenation.... <br> <br>---Jacques</p>"
