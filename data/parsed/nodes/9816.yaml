    html: <p>I assume the ascender height is at the top of the "i"'s dot? If so, I think your lc proportions (assuming the descenders will be notably shorter than the descenders) are great for smallish newspaper type, like around 8 point*. But in that case your spacing is way too tight. Also, your caps being narrow, they need to be a bit taller. <br> <br>* But note that the contemporary tendency is to go larger (partly because of the readership getting older). <br> <br>Separate fonts for book versus news is a great idea. <br> <br>hhp <br></p>
