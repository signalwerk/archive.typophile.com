      <p><em> The advantage I see in TT outlines is that one can determine the curve flow, say between a top and a rightside on-curve extremum point, nicely with three or so off-curve points inbetween. No need for an additional on-curve point as with PS — and hence no kinks when interpolating.</em></p>
      <p>Exactly, Karsten. When I started my first computer font, in my inexperience I used a few off-curve TT points to draw nice smooth curves.  But then I was told by more experienced designers that I needed extremums. I assume those are needed to control hinting?</p>
      <p>There was no way to add extremums to TT curves  automatically in FLS without distorting the curves or dotting them with too many new on-curve points. I then redesigned everything using PS outlines, but I miss the freedom and economy of designing with TT.</p>
