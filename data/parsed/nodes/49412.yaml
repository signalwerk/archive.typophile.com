      <p>"...— and hence no kinks when interpolating."<br>
      Maybe you don't know about this little super-kink?: if you interpolate two quadratic Béziers in FL, you get a cubic Bézier for output. :-o</p>
      <p>"[Note: TT curves are also Beziers. PS curves are cubic Béziers; TT curves are quadratic Béziers.]"<br>
      Yes John, cubic Béziers is what I meant, thanks. </p>
      <p>"... are there any quadratic Bézier editing tools that enable definition of point types and hence controlled alignment of off-line points through on-line curve or tangent points?"<br>
      Fog-Q is the one and only I'm aware of. Developed with the agreement to simplify the editing by allowing only two off-curve points between two on-curve points, this was splendid. Three off-curve points is too many for most users who have never edited IK or Bitstream data anyway.</p>
      <p>The direct advantages I see in quadratic Béziers is that, between a top and a rightside on-curve extremum point, two off-curve points can define all the curves from a straight line connecting the on-curve points, to a pair of straight lines (a sharp corner) instead of a curve, (try that with cubic Béziers!;)) and, that the conversion to cubic Béziers is loss-less. There are some indirect advantages as well, in allowing the direct editing of the world's most popular font format. :-.</p>
      <p>Cheers!</p>
