      <p>Troop: "Why does Fontlab round them off? Is there a way of subverting this behaviour? "</p>
      <p>We've discussed this just recently, if you design on an em with units per em larger or smaller than the em resolution you are producing, (1000 or 2048, e.g.), you are axing for trouble. Remember? I fired fog 4.0 for this reason? Define your design upm based on the output format's upm and stick to it!!!!!!</p>
      <p>The other issue is the penchant of FL to mess with point type. Fog used this signal to indicate if you had scaled skewed or rotated something, that it could not keep a trio of points (offcurve-oncurve-offcurve) in a straight line. You'd get a corner point where a curve point used to be, as your sign from Fog.</p>
      <p>FontLab, does no such thing. It changes curve points to corner points indiscriminately, even if they are orthogonally aligned. </p>
      <p>(Consider yourself lucky to be working in Beziers! FL Truetype allows/enables no curve or tangent points, ever, at all, period!)</p>
      <p>Cheers!</p>
