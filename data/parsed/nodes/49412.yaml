      <p>Yes, FontLab rounds off decimals right away--either when drawn or imported. I believe their reasoning is that it is better to show them rounded straight off so you can make the needed corrections instead of when the font is output and you can't see the effect. Adam talked about this a few times. I hope he can correct me here if I am not accurate.</p>
      <p>ChrisL</p>
