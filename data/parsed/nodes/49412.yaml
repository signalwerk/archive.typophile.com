      <p>Chris, fine if the programs round before generating. But in this case, we are starting with a PS font, opening it in Fog, and finding decimal places in the handles. So how did they get into the font if they're rounded off first? </p>
      <p>Here's an example from an old Adobe font, Poetica Supp Initial Swash Caps, glyph D. Open it in Fog. Look at point 33. The incoming BCP hz value is -290.22; the outgoing BCP hz value is -199.22. Open in Flab and the values are rounded down. Not such a very great deal in this case, but if the values had been .7, .8, or .9, the difference would be quite visible.</p>
