      <p>Vladimir, I can hardly be said to have been 'in on the early development of cornu splines', other than chatting with their inventor, Raph Levien. I still have not actually got around to trying to use them (largely because installing support for them in FontForge seemed difficult for Windows). I see that they are making their way into a number of open source drawing tools, such as NodeBox and Inkscape. I'd like to see them incorporated as a drawing option in FontLab, perhaps replacing the weird 'Sketch' tool, which I've never been able to figure out.</p>
      <p>The smiley was an acknowledgement that introducing a new drawing format, no matter how good and easy to work with, is unlikely to result in a global change in everyone's practices. As David pointed out, there are always issues in outline format conversion and sometimes benefits to working within the native format of the final font, even if the tools for such work are deficient. I know some designers who still swear by Ikarus, but I've also had the job of cleaning up IK-to-Beziér conversions, the quality of which can vary considerably dependent on the skill of the Ikarus user and the approach taken to the drawing.</p>
