    html: <p>John, your test isn't necessarily valid, because it doesn't take into account what Flab might be doing during the act of moving the handle. It might internally store the floating point value, but may round off upon being commanded to move that handle. It is now clear to me that one of the reasons why Flab converts curve points to corner points in MM import from Fog databases and PS fonts is that the rounding off of the handles is more than adequate to change the type of the segment. It is quite dreadful, and accounts for a lot of messy imports. It astounds me that such a situation -- which must have resulted in a staggering amount of data corruption over the past few years -- should exist, and virtually without comment.</p>
