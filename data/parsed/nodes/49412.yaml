      <p>Re adoption of the CT types, surely short-term that depends on how people get along with MS Word 2007, which has the worst interface of any program I have seen since the invention of the 8080 chip. I would be surprised if they attained the visceral traction Georgia and Verdana have attained, but I don't see how anyone can possibly tell what general usage will be like five or ten years from now or how we will see the situation then. </p>
      <p>David, re your admonitions: I AM keeping to the 1000 unit grid as you suggested. BUT, I have a ton of fonts that have floating point handles even from the Fog3 days. Moreover, I think Adam is wrong: FontLab does seem to preserve these values to some extent. It may not show them, and it may capriciously and with inexcusable inaccuracy round them off under circumstances not yet identified. But under certain circumstances, it does preserve them.</p>
      <p>We need to know when it is preserving them and when it is rounding them off.</p>
