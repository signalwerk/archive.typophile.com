      <p>Bill: <em>John, your test isn’t necessarily valid, because it doesn’t take into account what Flab might be doing during the act of moving the handle. It might internally store the floating point value, but may round off upon being commanded to move that handle.</em></p>
      <p>That is exactly the point of the test, to determine whether FontLab is retaining fractional values for untouched BCPs while forcing rounding of touched ones. That is what the test tests.</p>
      <p>But even before this is done, the first thing that should be done is a raw PS dump of the glyphs in the original fonts, because you are assuming that the fractional values you are seeing in Fontographer represent what is actually in the font, and I wouldn't assume any such thing. I would first determine what the native format (PS) contains, and then look at what different tools do with that data.</p>
