      <p>Regarding PS vs TT curves:</p>
      <p>TT outlines are not per se harder to edit than PS outlines -- it is just that FLS5's UI for PS outlines is better than that for TT outlines.<br>
      Neither PS nor TT outlines know about tangent points, or about in- and outgoing off-curve plus on-curve point inbetween that keep in line when moving one of the off-curve points. That's just UI behavior (the curve/corner and smooth buttons).</p>
      <p>FLS5 would simplify editing of TT outline a lot if it would<br>
      [1] connect on-curve point and neighboring off-curve points with a line,<br>
      [2] allow for tangential behavior (off-curve points bothsides of an on-curve point forming a line) i.e.<br>
      [3] distinguish between corner, tangent and curve point as with PS outlines (currently TT outlines only seem to know corner points).<br>
      [4] Allow adding/removing off-curve points with a special tool (or does it exist?).<br>
      In one sentence: The "look and feel" should be the same as with PS outlines.</p>
      <p>The advantage I see in TT outlines is that one can determine the curve flow, say between a top and a rightside on-curve extremum point, nicely with three or so off-curve points inbetween. No need for an additional on-curve point as with PS -- and hence no kinks when interpolating.</p>
      <p>Hello Mr Yarmola!&nbsp;&nbsp;:)</p>
      <p>Karsten</p>
