      <p>&gt;And you did not report this to FontLab?<br>
      In the fall of 2006, when I thought it more than safe to consider TrueType a major font format, I started reporting TT issues and requesting a true TT interface to TT outlines. See how patient I am? Not a single issue has been addressed, yet TT is still a major font format, ain't it? </p>
      <p>This issue was, by-the-way, a major clue to me that the CT collection would most likely find its destiny in typographic oblivion. That the fonts were not drawn as TT, just converted to TT and seemingly barfed around 'till they "worked" was very enlightening. No one "out there" seemed to have learned from the excellence of the Verdana/Georgia development path. </p>
      <p>&gt;[5] When interpolating please do not revert to cubic Bezier.<br>
      As far as I can tell, it's a brain-twisting copulation-cluster because, the two TT input fonts have points that match, auto-converted T1 versions of these TT fonts would not have points that match, and would not interpolate. So, somehow... I think, the fonts are interpolated as TT, a resulting TT font must be "thought out" and then converted to T1 despite the obvious logic of matching the input format to the output format. I.E. Ewe mite half two go out of yore way too due what they dew rong. ;)</p>
      <p>Cheers!</p>
