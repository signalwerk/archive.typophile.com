      <p>Right now, FontLab Studio and TypeTool only allow integer coordinates. Fractional coordinates are allowed in the Type 1 format through the use of the div operator but not all PostScript engines properly support this (so Adobe used to use it in very old fonts but then reverted to integer coordinates only). Fontographer does indeed support fractional coordinates. We are planning to add support for fractional coordinates in all our products in the future. </p>
      <p>Adam</p>
