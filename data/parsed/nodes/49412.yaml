      <p>Here's a test:</p>
      <p>1. Open font in FontLab. Select a glyph, open it, and manually move <em>one</em> BCP, leaving all others untouched.</p>
      <p>2. Generate new font from FontLab.</p>
      <p>3. Open new font in FOG. Go to test glyph and look at position of touched BCP.</p>
      <p>If this BCP is in exactly the same unit position as you set it in FontLab but other BCPs are at fractional positions, this will confirm your conclusion as stated, i.e. that FontLab is keeping track of fractional values for untouched BCPs but not displaying them or allowing fractional editing.</p>
      <p>If the touched BCP also displays with a fractional value, then the problem is presumably on the FOG side, i.e. FOG is scaling BCPs somehow.</p>
