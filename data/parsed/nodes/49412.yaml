      <p><em>That the fonts were not drawn as TT, just converted to TT...</em></p>
      <p>?</p>
      <p>I spent a heck of a lot of time manually editing TT outlines in Constantia. For Calibri, Lucas not only worked directly in TT outlines but also had a customised FL made so that he could make TT-flavour MM sources. At the beginning of the font development, MS conducted hint and rendering tests of all the designs, and determined that they did not consider converted outlines significantly different within CT, so the individual designers were encouraged to work however they found most comfortable.</p>
      <p>When I'm working directly in TT outlines I don't use that same approach as you, because it is most often impossible to get a truly smooth connection through a non-extrema on curve point, due to rounding of the position of the adjacent off-curve points, and I don't like the kinks and wobbles this produces. So I deliberately minimise the use of on-curve points. By way of illustration, here is Georgia, left, and Constantia, right.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/gcq_4684.gif"></div><p></p>
