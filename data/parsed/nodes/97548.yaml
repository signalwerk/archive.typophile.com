  date: 2012-10-25T17:03:00
  date_raw: 25 Oct 2012 — 5:03pm
  votes: null
  html: |-
    <p>dear friends typophiles!<br>
    i am glad to present you new Arsenal contrast sans typeface. the project wins the contest for ukrainian font by <em>Mystetsky Arsenal</em> foundation and <em>Stairfors</em> design studio (some info in english about it you can find <a class="freelinking external" href="http://www.day.kiev.ua/221352" rel="nofollow">here</a> and <a class="freelinking external" href="http://www.day.kiev.ua/220116/" rel="nofollow">here</a>).<br>
    so now it is typefamily of four fonts, released under OFL for free download.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ars01_4625.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/ars02_5803.png"></div><br>
    interesting that it includes few unusual historic alternates for cyrillic letters (like latin-looking <em>f</em> with double bar for <em>ф</em> or round form for <em>я</em>) from old ukrainian origins.<p></p>
    <p>please get the files at <strong><a class="freelinking external" href="http://www.ukrainian-type.com/" rel="nofollow">http://www.ukrainian-type.com/</a></strong>, also here is project page on <a class="freelinking external" href="http://www.behance.net/gallery/Arsenal-free-typeface/5540223" rel="nofollow">behance</a>. </p>
    <p>thank you for watching!</p>
