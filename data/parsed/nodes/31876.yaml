  html: <p>Hey guys! I have this project for my typography class that I need help with. We were assigned to design a poster for an art gallery exhibition on a typographer and I need help coming up with a concept and also a tag line/slogan. The typographer that I have is <a href="/wiki/Paul%20Renner" class="freelinking" rel="nofollow">Paul Renner</a>, the guy who designed <a href="/wiki/Futura" class="freelinking" rel="nofollow">Futura</a>. Any ideas would be great and would be a big help!</p>
  html_clean: <p>Hey guys! I have this project for my typography class that I need help with. We were assigned to design a poster for an art gallery exhibition on a typographer and I need help coming up with a concept and also a tag line/slogan. The typographer that I have is <a href="/wiki/Paul%20Renner" class="freelinking link-lost" rel="nofollow">Paul Renner</a>, the guy who designed <a href="/wiki/Futura" class="freelinking link-lost" rel="nofollow">Futura</a>. Any ideas would be great and would be a big help!</p>
