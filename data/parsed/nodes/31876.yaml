    html: <p>Well one of my ideas that I have is sort of focus on the way Futura is used a lot on identities of fashion lines like Louis Vuitton, Calvin Klein and D&amp;G. Also I noticed that It's also used on perfumes by Britney Spears and J.Lo and as well as in Ikea catalogs and many other magazine ads. I need a slogan/tag line that would tie those in together.</p>
