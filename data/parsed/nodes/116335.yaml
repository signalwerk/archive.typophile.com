    <p>The uploaded images: masthead/nameplate of Der Sturm magazine and a sample first page with some text (I can upload a better quality sample, because this one may be too small). </p>
    <p>I am writing a paper about avant-garde publications and cannot find a perfect match for the typefaces used - the masthead and text typeface is a priority right now. It could be a recut of a more commonly used typeface ... anyways I would really appreciate if you could point me in the right direction. </p>
    <p>Thank you,<br>
    Katja</p>
