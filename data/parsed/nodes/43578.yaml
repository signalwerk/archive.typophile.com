    votes: 0
    html: |-
      <p>It depends on what language this will be in, and how tongue-in-cheek you want to get. Since English has no distinction between <cite>gratis</cite> and <cite>libre</cite> - both are "free" - you could depict a phone with wings flying out of a birdcage (that is if it is an English brochure and you are allowed to get a little cute with it).</p>
      <p> - Lex</p>
