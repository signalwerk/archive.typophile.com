    <p>Hi there,</p>
    <p>I am in desperate need of some much needed critique for a logo I am developing. The logo is for a sportswear company I am starting up.</p>
    <p>The company name is fourmation, I did want to use the company name formation but couldn't. I then justified calling it fourmation because of the numbers used for formations in sport etc...drill me if I need drilling haha.</p>
    <p>Anyways I decided that because its a logo going on sportswear that in needs to be simple, effective and work in one colour only. Attached is a concept that stood out for me, the word fourmation will appear below it. I wanted the logo to refer to the number four somehow but not in a cliche way...I am sure we call all dream up something in no time using the number 4, I didn't want it to be that easy.</p>
    <p>As you can see in the logo there is both a "f" and a "4", I need to know if this is obvious enough to work? I am worried that the 4 doesn't look convincing enough, am I right?</p>
    <p>Please help!!!</p>
