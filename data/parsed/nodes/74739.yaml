    <p>Hi,</p>
    <p>I'm seeking some advice on kerning of Cyrillic glyph afii10093, picture attached. My question is: Since it's made up of two separate 'mini-glyphs', should it be kerned as two glyphs or one? That is, should the spaces either side equal the space in between the two sections, or be larger (so that the glyph appears more as a unfied whole)?</p>
