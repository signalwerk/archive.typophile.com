    <p>Dear all,<br>
    We’ve had many interesting discussions about Arabic type design on this forum and there are many gifted designers who read this. I should have put this in the news section but I can’t seem to find my way around the RSS feed (sorry). So, if anyone is interested, Linotype is hosting its first Arabic Type Design Competition and the deadline is October 31, so there’s a lot of time still left! </p>
    <p>The jury is made up of renowned calligraphers, type designers, and academics who have each offered a great contribution to the development of Arabic typography. They are Samir Sayegh (Lebanon), Fiona Ross (UK), Mamoun Sakkal (Syria/USA), Kris Holmes (USA), and Huda Abi Fares Smitshuijzen (Lebanon/Netherlands). Also participating as an honorary guest juror is the master calligrapher and type designer Hermann Zapf.</p>
    <p>The competition has 3 categories: text, display, and calligraphic. The text category is reserved for text faces, the display category for designs intended for larger sizes, and the calligraphic category is intended for designs based on calligraphic models or any undigitised work. </p>
    <p>For details about the submission of typefaces and for further details please contact:<br>
    +49 (0) 6172 484 2460 or by mail to <a href="mailto:contest@linotype.com">contest@linotype.com</a> </p>
    <p>More information is available at the website at <a href="http://www.linotype.com/contest" title="www.linotype.com/contest">www.linotype.com/contest</a></p>
    <p>Also, you can find the full press release at: <a href="http://www.linotype.com/18374/19_05_05-doc.html" title="http://www.linotype.com/18374/19_05_05-doc.html">http://www.linotype.com/18374/19_05_05-doc.html</a></p>
