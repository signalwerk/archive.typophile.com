      <p>Kay Amert from the University of Iowa did a presentation on Simon de Colines and Geofroy Troy at ATypI Vancouver 2003. See: <a href="http://old.atypi.org/09_Vancouver/40_timetables/view_presentation_html%3Fpresentid=18.html" title="http://old.atypi.org/09_Vancouver/40_timetables/view_presentation_html%3Fpresentid=18.html">http://old.atypi.org/09_Vancouver/40_timetables/view_presentation_html%3...</a></p>
      <p>As I remember it she focused on interpreting the letterforms of both.</p>
      <p>Also, see: <a href="http://muse.jhu.edu/login?uri=/journals/book_history/v008/8.1amert.pdf" title="http://muse.jhu.edu/login?uri=/journals/book_history/v008/8.1amert.pdf">http://muse.jhu.edu/login?uri=/journals/book_history/v008/8.1amert.pdf</a></p>
      <p>Peter Enneson</p>
