    <p><strong>Hi Typophiles!</strong></p>
    <p>I'm starting a new type proyect, trying to interpret scans of books printed by <strong>Simon de Colines</strong>. My question is: Has somebody done this before? Does it worth it?</p>
    <p>I really like the printer history and letterforms.</p>
    <p><img src="http://www.ferfolio.com/files/colinet.jpg" alt="Angry face"></p>
    <p><strong><a class="freelinking external" href="http://www.ferfolio.com/files/colinet.pdf" rel="nofollow">See starting proyect PDF here</a></strong></p>
    <p>Thanks and kind Regards.<br>
    F.</p>
