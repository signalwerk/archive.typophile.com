      <p>Your Version 2 still has stylistic inconsistencies. You say that the horizontal termini are square, but they're still rounded on the y,  the crossbar of the t and both ends of the z.  The bottom of the 'j' is ambiguous - maybe that's your intention, but it has no equivalent elsewhere in the font.  The corner in the 'a' makes it look like a ball ending - again, the only one with that particular appendage.</p>
      <p>I'm trying to attach an image of the 'a' at a fairly small size, with the image enlarged to display the break in rendering the separate segments.  This was from a screen capture of the pdf as displayed by Acrobat 7 at 25%;</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Casca-a_4548.jpg"></div><p></p>
      <p> - Herb</p>
