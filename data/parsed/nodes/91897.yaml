    html: |-
      <p>There doesn't appear to be any rationale for the mixture of flat and rounded termini. Some bottoms are flat, some rounded, as are other random stroke ends.</p>
      <p>Many of the glyphs were put together with pieces (was this done with fontstruct?) that don't always fit together properly. The PDF example shows gaps at some magnifications. This also causes mis-alignment at some magnifications (the 'a' shows its vertical parts at different widths, for example, with a pixel or two difference on-screen)</p>
      <p>The connections between curved and straight strokes are inconsistant - the 'h' is markedly different from the 'n' for example. Most of the glyphs have a constant stroke width, so those that are markedly different tend to stand out like sore thumbs.</p>
      <p>I'm not sure what characteristics make a character 'male' or 'female' or 'neuter'; or even humourous, comical, or serious! I don't tend to either laught at or fantasize about glyphs. </p>
      <p>  - Herb</p>
