    <p>Hello Typophiles,</p>
    <p>I'm aiming for something quirky and light hearted. My approach was to design a rounded face which has some humanist character and a little bit of contrast between sharp and soft. There's influences from Gill, DIN and Futura in there.  </p>
    <p>Unothodoxly, soft edges have been used around the perimeter and straight lines on the horizontal terminals (e.g the tips of the r, l, t and s). My thinking was this would give a nice soft shape to the outline of the word, whilst allowing letters to sit tightly together harmoniously without awkward negative space. I.e. this: || not this: )|</p>
    <p>This is my first font so I'd appreciate your comments! </p>
    <p>Cheers,<br>
    Pete</p>
    <p>...FYI this is the second revision. PDF is attached.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/V2_5958.png"></div><p></p>
