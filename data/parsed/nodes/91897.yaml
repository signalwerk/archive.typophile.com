    html: |-
      <p>PoMo = post-modern. So unencumbered by Modernism's delusion concerning Regularity.</p>
      <p>One thing I would suggest is to look at letter adjacency frequencies*. What I mean is you should try to manage the distribution of rounds versus flats depending on what is most likely to end up next to what.</p>
      <p>* <a href="http://typophile.com/node/5106" title="http://typophile.com/node/5106">http://typophile.com/node/5106</a></p>
      <p>hhp</p>
