      <p>Thanks for your feedback guys.</p>
      <p>Yes ecclectic is what I'm going for – my aim isn't to produce a generic rounded font. The type was drawn from scratch in illustrator with a few bits borrowed across letters (hence the slightly sketchy stitching). The new version I've uploaded is more refined.</p>
      <p>There is some thinking behind the round/straight edges, I've edited my original post to explain things.</p>
      <p>What are your thoughts?</p>
