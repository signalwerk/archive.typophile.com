    html: |-
      <p>Should be a grotesque, to match the tone of the era.<br>
      The grots of that day were generally pretty gnarly, and Vicky sans faces (of which there have been quite a few recently), cleave to that quality in varying degrees -- the temptation being to clean things up and smooth them out. Julian Morey's <a href="http://www.fontshop.com/fonts/downloads/club21/sigma_ot/" rel="nofollow">Sigma</a> is quite true to the originals. My own <a href="http://www.shinntype.com/figgins.html" rel="nofollow">Figgins Sans</a> has similar proportions to Andron. Also Armitage, Knockout, Monotype Grotesque, National, and Ludwig (by Smeijers, offbeat, but interesting). </p>
      <p>**</p>
      <p>I note that you say illustration rather than illustrators. Do you have much about Edmund Evans?</p>
