  html: |-
    <p>I am looking for a fitting set of fonts to use for my thesis (on english book illustration between 1866 and 1907).</p>
    <p>I think I am going to use Andron for the main text, I love that it is dark and not too tall. However I would like to use a different sans serif font for the titles. Any suggestions on a font that would go well with Andron? If it had small caps, that would be a plus, though I haven't yet decided as to whether or not I am going to set the titles in SC.</p>
    <p>Thank you so much in advance for your help and suggestions, it's really appreciated.</p>
  html_clean: |-
    <p>I am looking for a fitting set of fonts to use for my thesis (on english book illustration between 1866 and 1907).</p>
    <p>I think I am going to use Andron for the main text, I love that it is dark and not too tall. However I would like to use a different sans serif font for the titles. Any suggestions on a font that would go well with Andron? If it had small caps, that would be a plus, though I haven't yet decided as to whether or not I am going to set the titles in SC.</p>
    <p>Thank you so much in advance for your help and suggestions, it's really appreciated.</p>
