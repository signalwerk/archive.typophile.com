    html: <p>Um.. I'm going to have to say no on that one. I think Peignot is too decorative, and can deliver flavor and punch but I think its best used in advertising.. for a resume, I'd say go with a strong serif font for your headlines- goudy or baskerville- rather than Peignot, which is an art-deco font, and if used clumsily can easily look cheesy.</p>
