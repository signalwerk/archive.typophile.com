    <p>Hello everyone,</p>
    <p>I am fairly new to the type world and could use suggestions from some of you with better knowledge of appropriate use of type in a resume.</p>
    <p>I have been working with piegnot light for my name/logo. I realize their is some level of subjectivity, but would you consider it to be too flashy for a resume?</p>
    <p>Thanks for any help. I have to make a decision soon and just don’t want to design around it if it’s a bad idea from the start!</p>
