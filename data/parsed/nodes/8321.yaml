    html: <p>If you're going to separate the 'e' and 'a', then you need to <i>really</i> separate them. It looks too much like and accident/poor typography. Perhaps a full word space or a black hyphen. <br> <br>Also, the 'r' and 'i' bother me. The dot on the 'i' feels too close by just a hair (may be the effect of the color difference) and the 'r' looks incomplete, or a little worm-ish to me. Bart and Dan's suggestion of a lowercase 'c' sounds good to me, and my diminish this effect.</p>
