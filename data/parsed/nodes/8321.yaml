    html: <p>I see how you try to visualize the concept of creativity in the letterforms. So as a starting point it is okay, I guess. <br>However - due to the quirky lowercase 'r', the whitespace between the capital C en the r is bothersome. The C seems to stand apart this way. This might be solved using a serif in the r after all. <br>Furthermore, the spacing of e and a is bad. I can see how you want to emphasize the accent grave on the a, but it needs to be set much closer to the e.</p>
