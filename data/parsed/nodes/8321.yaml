    html: <p>It pains me to say it, but have you looked at <a href="http://www.myfonts.com/search?search%5Btext%5D=rotis">Rotis</a>? I don't like it for typesetting, but it might work for you here (it's similar), particularly since you can pick from variations of serif, semi-serif, semi-sans, sans. That's if you want it to feel similar to the version you have. <br> <br>Have you explored any versions that are not solely typographic? The cubical/wall dividers thing could lend itself to some interesing visuals.</p>
