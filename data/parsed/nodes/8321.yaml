    <p>Just started on ID for local company (South) which sells wall partitions, enclosures, cubes, etc to the hospital, school, office building market. Co. presents to architects/designers as well as small renovators. Has several service trucks - white. <br> <br>Attached is first cut at logo for 'creative wall solutions', planning to use (garamond?) for smaller 'wall solutions' below when needed. <br> <br>Type for name, address, card, etc. could be simple sans like Syntax or similar. <br> <br>All suggestions, crit or guidance appreciated. <br>Thank you. <br>John</p>
