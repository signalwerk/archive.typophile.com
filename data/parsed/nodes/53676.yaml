    html: |-
      <p>It would be worth checking out <a class="freelinking external" href="http://www.allinlondon.co.uk/directory/1277/3340.php" rel="nofollow">Collinge &amp; Clark</a> in Bloomsbury. They have an excellent selection of old specimens and type books. They're usually closed on weekends, but their schedule is a bit erratic, so you never know.</p>
      <p>And it's a shame you won't be in town the following weekend, when the <a class="freelinking external" href="http://ephemera-society.org.uk" rel="nofollow">Ephemera Society</a> has one of their big fairs. Those are an absolute treasure trove!</p>
    html_clean: |-
