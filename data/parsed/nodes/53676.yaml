    html: "<p>Oh yes, that is the exterior of Collinge &amp; Clarke used in the Black Books comedy series. The interior scenes, though, were shot in a studio. The real Collinge &amp; Clarke interior is very small and cramped. But consider yourself fortunate that the booksellers have quit smoking: one used to need a gas mask when visiting the shop.</p>"
