      <p>I watched a bit of Black Books, and found it interesting to see how parts of the interior of the fictional shop were modelled on Collinge &amp; Clarke but made much larger.</p>
      <p>Just around the corner from C&amp;C on Marchmont street is Judd Books, which is sometimes a good source for remaindered books on type.</p>
