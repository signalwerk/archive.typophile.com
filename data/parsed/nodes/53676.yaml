    html: |-
      <p>Foyles are good for current publications and often have recently out-of-print titles but won't have anything especially rare. They are a very big store with well-stocked departments on most subjects, and a very nice neon sign which I think dates from the 1930s.</p>
      <p><a class="freelinking external" href="http://www.maggs.com/" rel="nofollow">Maggs</a> are a specialist antiquarian dealer.</p>
      <p>Sadly I don't think Zwemmers have any stores left in London.</p>
