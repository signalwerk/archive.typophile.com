  html: <p>I'm going to London next weekend and i would like to check out some bookshops while i'm there, any tips? I'm interested in books on typography and design, especially out-of-print classics. Tips on great books to pick up are also appreciated!</p>
  html_clean: <p>I'm going to London next weekend and i would like to check out some bookshops while i'm there, any tips? I'm interested in books on typography and design, especially out-of-print classics. Tips on great books to pick up are also appreciated!</p>
