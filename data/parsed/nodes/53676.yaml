      <p>Superb, thanks a lot! i'll check those out. I'm staying until tuesday, so i'll have time to look into Collinge and Clarke too. </p>
      <p>I read somewhere that both Foyles and Maggs have typography books, anyone know anything about them? How about Zwemmers? Foyles is pretty famous i gather, but i'm totally blank when it comes to London shops. Harrods who?</p>
