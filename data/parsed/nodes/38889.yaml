    <p>Hey all!</p>
    <p>I’m a fourth year student in Visual Communications degree programme, and i’m currently working on a design for print project. Its an ISTD project called ’doing my nut in’ about slang and differences in spoken language in countries and places. I’m doing mine on old irish words that my father remembers being incorporated into spoken english when he was a child that have now mostly fallen out of usage.<br>
    I’m hoping to illude to letterpress and uncial character in my piece that will take the form of a small square handmade booklet, with perhaps the use of handmade embossments (that i will do myself).</p>
    <p><a href="http://istd.org.uk/flash_content/index.htm" title="http://istd.org.uk/flash_content/index.htm">http://istd.org.uk/flash_content/index.htm</a></p>
    <p>I was just wondering if anyone had any opinions on this approach!<br>
    thank you<br>
    (long time typophile reader first time user)</p>
