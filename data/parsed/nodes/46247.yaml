      <p>Jay: I’m sorry I have to disappoint you: there is no big master list.<br>
      A number of special (or not-so-special) typeface genres come up here on typophile again and again.<br>
      Some of them have been covered in <a href="http://www.fontshop.com/fontfeed/" rel="nofollow">FontFeeds</a>, like <a href="http://www.fontshop.com/fontfeed/archives/extra-bold-ultra-black-fonts/" rel="nofollow">The Extra Bold, Ultra Black Fonts</a> (see also <a href="http://www.typophile.com/node/42643" rel="nofollow">The Fat Font Fad List</a>). Others, like scripts, contructivist Bauhaus-style typefaces or lined fonts can be browsed on <a href="http://bowfinprintworks.com/" rel="nofollow">Bowfin Printworks</a>. The <a href="/wiki/TypoWiki" class="freelinking" rel="nofollow">TypoWiki</a> has some lists, too.</p>
      <p>I remembered that we already had 2 or 3 threads about this rounded tech thing and searched for <a href="http://www.google.com/search?q=site:typophile.com%20gravur" rel="nofollow">Gravur</a> and <a href="http://www.google.com/search?q=site:typophile.com%20t-star" rel="nofollow">T-Star</a>, using this <a href="http://typophile.com/node/12436" rel="nofollow">favelet</a>.<br>
      Thus, I compiled a little list of the alternatives mentioned there, plus some more that came to my mind.<br>
      No magic involved, only a little help from TextExpander (a Mac app that helps to insert links etc., similar to Typinator or RapidoWrite).</p>
      <p>Thomas: Why don’t do ask <a href="http://www.gestalten.com/fonts/detail/?id=402881820693de75010693debc1600d3" rel="nofollow">Die Gestalten</a> or <a href="http://www.binnenland.ch/" rel="nofollow">Mika Mischler</a>? What about T-Star TW Pro?</p>
