      <p>I must say that we can’t mistook legibility with readability. These are to separate things.<br>
      Anyway, I truly believe that legibility it’s a matter of habit, and the habit is directly dependent certain contemporary approaches.<br>
      I don’t know if they melt down the old lead types, but the idea of renouncing to certain kinds of typefaces is quit ancient.<br>
      Take a look at the book “The alphabetic labyrinth” by Johanna Drucker, edited by Thames and Hudson, and you’ll see that the catholic church renounced to the<br>
      roman capitals because they represented the roman oppression, and just when the emperor Constantin declared the conversion of Rome<br>
      to the catholicism, the roman capitals were then accepted by the church (mixed with the uncials and half uncials that were developed since).<br>
      This is a common issue. In the bauhaus happened almost the same. </p>
      <p>This is an interesting matter for a PhD. I developed a few concepts in my master graduation, and if you’re interested we can discuss a little more<br>
      on this issue.</p>
