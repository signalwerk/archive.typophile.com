      <p>&gt;fast = good</p>
      <p>Certainly reading speed is one valid measure of readability. Another would be comprehension in a given time. Another would be fatigue—meaning not only eye strain, but also just feeling tired of reading. I think there is a ’brain weariness’ as well as an ’eye weariness’. </p>
      <p>By comparison, legibility tests would be eg. how quickly a letter is identified, and how easily it is confused with another letter. Because legibility and readabily would be tested in different ways, they are certainly different conceptually. To what extent legibility contributes to readibility or even subsumes it is a matter for testing. To assume that they are identical, given the clear difference conceptually and operationally, would indeed be question begging—not the idea that they are different.</p>
