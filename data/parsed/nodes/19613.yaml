      <p>fortunately i have some samples of sans serif newsapers, one issue from the children/pioneer magazine Cutezatorii (The Braves) from 1982 and one issue from Romania Libera (The Free Romania) from the beginning of 1990’s, short after the Revolution and before they change the design to the actual one.</p>
      <p>though, I have to scan it and I will do that as soon as I get back to work where I have the samples.</p>
      <p>my reflections are:<br>
      1.) since one grow up in a sans serif dominated typographical environment is the habbit of reading sans serif influence the perception of legibility of a text/type</p>
      <p>2.) are we prefering serif type in print because of the old tradition of reading printed matters with serifs</p>
      <p>3.) has the habit (i.e. the habit of redaing sans serif in print and sans serif on screen) a greater, stronger influence upon what we experience as good typography, apropriated to the content or to the media</p>
      <p>the phenomena of using sansserif in romanian newspappers and my own experience of a typografical environment where the lettersahpe prevailled was the starting point in trying to find out what kind of read behaviour the screen typography will develop in time.</p>
      <p>I’am aware that I need more structure in those thaughts and I welcome any comments on that.</p>
