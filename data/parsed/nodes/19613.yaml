      <p>This is a common assumption among typographers, reflected in our use of terminology, but it may be begging the question. If the parallel letter recognition model is accurate, then there is little distinction between legibility and readability, at least at the level of type design. At the last Thessaloniki conference, I asked Kevin Larson and Mary Dyson how they, as psychologists, used the terminology. Kevin said he made no distinction between legibility and readability, although tended to use the former term, and Mary said she thought of readability as a document design and language issue, not a type design issue.</p>
      <p>Although we often claim there is an important difference between legibility and readability, the consequence of this is simply that typographers have largely stopped using the term legibility. We only talk about readability, because we think that legibility refers to something that isn’t very important.</p>
