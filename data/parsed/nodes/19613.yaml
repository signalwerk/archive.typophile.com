      <p>In ’Types of Typefaces’ Ben Lieberman defined:</p>
      <p>“’Legibility’ is based on the ease with which one letter can be told from the other. ’Readability’ is the ease with which the eye can absorb the message and move along the line.”</p>
      <p>If we take these definitions, which I think pretty well capture the distinction as used by typographers for quite a while, then I have no doubt there is a difference between the two. Partly it is, as you say Mary Dyson said, a matter of document design. If one uses excessive measure, small type, and zero leading, it is easy to produce a pretty unreadable but quite legible document, by the above definitions. </p>
      <p>I also think, though, that it is a matter of type design, and not only of how type is used. Most people find high contrast faces such as Bodoni at small sizes hard to read, even though they are perfectly legible. Similarly, italics, which are just as legible as roman are I believe even tested to read more slowly. Also all the ’optical size’ adjustments on the Adobe fonts have this function of enhancing readability. The larger optical sizes are perfectly legible at small sizes, they are just not as readable. </p>
      <p>Current widespread practice in type design will tell you that legibility is a requirement for readability, but it is not sufficient. If reading science hasn’t yet caught up with the advantages of the well estabished practice of optical sizing, for example, then it needs to work on it. Because they are not working on it doesn’t mean that it doesn’t exist. </p>
      <p>The distinction is not question begging because it reflects people’s experience across a huge range of people and cultures. The distinction between display and text type, the greater readability of  roman over italic, the hundreds of years practice of optical sizing, all these are facts. The task of science is to explain observations, not dismiss them.</p>
