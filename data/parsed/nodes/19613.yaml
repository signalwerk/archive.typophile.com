      <p>’Bouma’ is a word invented by reading researchers, named after the researcher with that last name. It means the ’word seen as a whole’ rather than by identification of individual letters, followed by assembly into words. </p>
      <p>What is the precise meaning of ’Bouma’ seems to vary with the person using the word. Hrant Papazian and Peter Enneson, as well as research psychologist Kevin Larson have essays on this in <a href="http://www.magtypo.cz/buxus/generate_page.php?page_id=101">TYPO</a> Magazine, 13th issue. </p>
      <p>They have also posted extensively on this. If you click on Peter’s name here—he posts mainly on this issue—and use the ’tracker’ you will get a lot of his posts.</p>
