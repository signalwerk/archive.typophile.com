      <p>“Some of the older researchers in reading, as I understand from Peter Enneson, did believe that “bouma shape” is important to word recognition. Now, as you say, the parallel letter view is generally accepted. Peter argues that this acceptance is a result of the ‘bouma shape’ view not being sufficiently developed.”</p>
      <p>The first appearance of the term ’bouma shape’ in the psychological literature on reading is in 1983 and is to be attributed to Insup Taylor and M. Martin Taylor. Insup Taylor was part of the Division of Life Sciences at the University of Toronto, and M. Martin Taylor was at the Defense and Civil Institute of Environmental Medicine in Downsview, Ontario, just outside Toronto. </p>
      <p>Early researchers in reading identified ’whole words,’ ’word forms,’ ’total word forms,’ or ’word configurations’ as being the ’units of perception’ in reading. </p>
      <p>In testing this ’holistic’ approach researchers relied on a concept of ’word shape’ that defined word shape as ’outer contour’or ’envelope structure.’ Another definition defined word shape as the raw pattern of neutral, ascending and descending characters. In these formalizations ’dog,’ ’beg,’ and ’leg’ have identical word shapes.</p>
      <p>When ’word form,’ ’total word form,’ or ’configuration’ are formalized in this way as a basis for empirical testing, it becomes clear that, as one researcher put it: “word shape is not in good shape for the race to the lexicon.” </p>
      <p>I tried to argue that the rejection of the ’holistic’ approach, and the concomitant ascendence of the view that letters are the ’unit of preception’ in reading, was premature because it based empirical testing on a poor formalization of ’word shape,’ and that Insup and M. Martin Taylor’s use of Herman Bouma’s letter-confusion data to define something they called a word’s ’bouma shape’ might provide the basis for a richer notion of ’word shape.’</p>
      <p></p><div class="imageWrap"><img src="/files/][img:"></div><p></p>
