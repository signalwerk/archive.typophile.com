      <p>I tend to think of legibility as a simple matter of discrimination affordance. Are the letters designed in such a way that we can readily make out their identities, or the identities of the words they make up? Are the letters designed in such a way that we can readily tell them apart? Mostly discussions about legibility have to do with thresholds. A highly legible type affords disrimination at larger distances, smaller sizes, lower contrasts, compromised illumination, against higher levels of background noise, with greater blur.</p>
      <p>In discussions about whether the letters in a font combine well to promote rapid automatic visual wordform resolution, efficient saccade planning, a pleasant, perceptually effortless reading experience exacting low attentional resources, I tend to use readability. What we are used to plays a role, but there are also ’harder’ determinants like spacing and formal familiality or fit which play a role.</p>
      <p>However the epistemological status of concepts like legibility and readibility is such that the matters they evoke resist formalization and quantification.</p>
