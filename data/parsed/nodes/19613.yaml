      <p>Arina, the Nazi ideological shift from blackletter to roman (antiqua) types during the Second World War may be the closest parallel to the Romanian ideological shift from serif to sans serif, although type was more likely to have been melted down to make bullets than for purely ideological reasons.</p>
      <p>In communist North Korea, the use of traditional Chinese characters alongside Korean hangul script has been officially discouraged, with the result that most North Koreans cannot read publications from South Korea, where both scripts continue to be used in tandem. The reasons for this are ideological and nationalist, and also practical because it makes it easier to control what people read. Most of the North Korean publications I have seen are set in gothic (’sans serif’, low contrast, geometric) hangul types, but I don’t know if this is ideologically encouraged or simply an aesthetic preference.</p>
