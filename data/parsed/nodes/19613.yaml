      <p><em>‘Bouma’ is a word invented by reading researchers, named after the researcher with that last name. It means the ‘word seen as a whole’ rather than by identification of individual letters, followed by assembly into words.</em></p>
      <p>That is a little misleading. The actual term employed by some by cognitive pyschologists is ’bouma shape’. But your description gives the impression that these psychologists, and perhaps Bouma himself, believe word recognition to be centered on recognition of such shapes, ’rather than by identification of individual letters’, and this is not the case. Rightly or wrongly, the majority of cognitive psychologists seem to embrace the parallel letter recognition model.</p>
    html_clean: |-
