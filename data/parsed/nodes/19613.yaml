      <p>&gt;That is a little misleading.</p>
      <p>I didn’t mean to prejudge the issue. Some of the older researchers in reading, as I understand from Peter Enneson, did believe that “bouma shape” is important to word recognition. Now, as you say, the parallel letter view is generally accepted. Peter argues that this acceptance is a result of the ’bouma shape’ view not being sufficiently developed. I think the issue is undecided, if Peter’s richer view of ’bouma shape’ is   understood here. I used to lean toward the parallel processing view. Now I think that it is likely that some direct recognition of whole patterns is going on, as Peter has argued. This is not least because of our astounding ability to recognize human faces. Type faces aren’t called that for nothing!</p>
