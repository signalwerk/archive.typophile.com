      <p>hello arina,</p>
      <p>first of all, after what communist take over where were the newspapers set in sans body type? And where was serif metal type being melted down, in what scale? I for one have never heard of that…<br>
      I having spent parts of my childhood and youth in former Eastern Germany, cannot remember a newspaper of that time with it’s body being set in sans, i also have held a few issues of Pravda in my hands, and these were set in serif cyrillic completely…</p>
      <p>i think that “the communists” - if you refer to the soviet union that is – were busy enough getting people in the vast rural regions of the soviet union to read at all, i.e. fight illiteracy, than being concerned with sans/serif issues.<br>
      Even more, under Stalins reign there was a clear tendency against modernism (as in the Russian Avantgarde of the 20s) towards neo-classical, almost reactionary forms in design, architecture, etc. As is perfectly examplified by the history of the Palace of the Soviets in Moscow. Under Stalins leadership a bombastic neoclassicism was established, especially in architecture. Most of the comminist leaders in the last century showed a scaringly bourgeois taste with a bit of megalomania thrown in…</p>
