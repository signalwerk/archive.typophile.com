      <p>Arina,<br>
      I thought you might find the following article appropriate to your thesis: “Our Changing Visual Environment” by Maureen MacKenzie-Taylor</p>
      <p>Here is a long quote to whet your appetite:</p>
      <p>”...Our research is showing that people read and understand best what they are most used to (MacKenzie, 1992:54-56).</p>
      <p>“In contrast, the earlier legibility studies suggested that legibility was somehow biologically determined. It was inferred that because of the way our eyes are constructed, and the ways in which people read with jumping eye movements, that serifed text is easier to read because those little finishing strokes to letters aid the eye’s progression from letter to letter, and improve reader’s differentiation of word shapes.</p>
      <p>“In contrast to this earlier research, our recent testing of documents shows that in the 1990s there is no difference per se in ease and speed of reading and consequent understanding between serif and sanserif letterforms. What our results suggest is that legibility is culturally learned and sub-culturally developed.”</p>
      <p>______<br>
      The whole article is available at:</p>
      <p><a href="http://communication.org.au/cria_publications/publication_id_21_584238809.html" title="http://communication.org.au/cria_publications/publication_id_21_584238809.html">http://communication.org.au/cria_publications/publication_id_21_58423880...</a></p>
      <p>Hope this helps.</p>
      <p>ChrisL</p>
