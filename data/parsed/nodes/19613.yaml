    <p>Between the two world wars the typography of the Romanian newspapers followed the general development and the use of serif typefaces for the body type. The concern for the typography of the newspaper was rather conservatory and worked a lot with the same kind of typography used for the fiction literature.</p>
    <p>After the communist take over the typography of the newspapers followed the standards imposed by the propagandistic concerns, which followed the rule to use only sans serif s for the body type.</p>
    <p>The serif typefaces of the newspapers were gathered and melted down as a demonstrative act of rupture with the bourgeois words and an entrance in to a new era of revolutionary thinking.</p>
    <p>Can anyone share similar experience or even thaughts about this topic?</p>
    <p>I’am preparing to start my PhD studies in compared typography with the following topic: Is legibility a matter of habit or of typeface design? Depends legibility of a text on reading habits and how much is the typeface design shaping our cognition process/experience of the content of a text.</p>
    <p>Can anyone refere to previous research in this area? Greatfull for thaughts, ideas and litterature or web references.</p>
    <p>Feel free to mail me directly to <a href="mailto:arina.stoenescu@sh.se">arina.stoenescu@sh.se</a>.</p>
