    <p>Hey everyone,</p>
    <p>I need some help identifying this sans-serif font.</p>
    <p>I once knew the name to this font, something with "Gothic" at the end of the name ;-) … and no, it's not Trade Gothic Gothic Extended. </p>
    <p>Two hints:<br>
    – I remember that this is a font that does not feature any lowercase letters, only uppercase.<br>
    – the watch-manufacturers from "wempe" are using an adapted version of this font: <a href="http://www.wempe.de/" title="http://www.wempe.de/">http://www.wempe.de/</a> – the problem is, they call it "wempe gothic", so this doesnt solve the problem.</p>
    <p>Thanks a lot for the help you guys!</p>
