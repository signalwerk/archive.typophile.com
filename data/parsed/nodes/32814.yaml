    html: |-
      <p><cite>I wonder what are the implications for an individual designer in selling a font outright to a company?</cite></p>
      <p>None. For any of the big players, 10% of the fonts in their library make 90% of the revenue (or perhaps it's even more extreme than that). For Linotype, the overwhelming majority of their revenue comes from designs that are at least 35 years old. So the total value of the entire Linotype Library tells you very little indeed about the value of a *new* typeface that you are trying to get somebody to buy today.</p>
      <p>I agree with Adam and Si as to why this stuff is interesting, and I certainly recommend reading Monotype's filing with the SEC. (Not the FTC, btw.)</p>
      <p><a href="http://www.hoovers.com/free/co/sec.xhtml?ID=155441&amp;Page=1&amp;Sort=D" title="http://www.hoovers.com/free/co/sec.xhtml?ID=155441&amp;Page=1&amp;Sort=D">http://www.hoovers.com/free/co/sec.xhtml?ID=155441&amp;Page=1&amp;Sort=D</a></p>
      <p>Cheers,</p>
      <p>T</p>
