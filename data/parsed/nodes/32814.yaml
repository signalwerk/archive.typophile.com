    html: |-
      <p>I really could care less about what the exact amount it cost Monotype to buy Linotype because its not what it cost them- its what it costs me and you.</p>
      <p>A side effect of the merger was an increase in the price of postscript type from $21 to $24... and the reason is... to pay for the crown jewels- Helvetica???</p>
      <p>Also I believe Linotype had a program in which the more you purchase the more you save:</p>
      <p>21 for 1</p>
      <p>19 for 3</p>
      <p>something to that effect- now its gone!</p>
      <p>There were other perks too- certain families of type were lower in price than Monotype- of course that has been moderated... I'm okay with that though.</p>
      <p>But I'm still curious if Monotype's price increase mandated that their distributors do the same (FontShop for instance) or did these distributors decide to do it on their own?</p>
      <p>But I shouldn't grip too much... I try to purchase only OpenType PostScript. Its more money but you get more features or versatility so the $29 or $35 is worth it to me.</p>
      <p>Mikey :-|</p>
