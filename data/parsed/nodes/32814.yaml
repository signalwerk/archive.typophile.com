      <p>Apart from the annual report, way back in January Monotype Imaging's owners <a href="http://www.ta.com/" rel="nofollow">TA Associates</a>  <a href="http://www.monotypeimaging.com/aboutus/pr_display.aspx?year=2007&amp;pr=306" rel="nofollow">announced</a> that they are planning to offer an IPO - so all manner of financial details would been submitted to the FTC, and are thus public record. Anyone who's not looked at the numbers must either a. not be interested and has more interesting things to do, or b. has been sitting under a rock somewhere for the past few months. </p>
