      <p>If it's a single font, I don't recognize it. You can see some fonts with a similar structure by doing a MyFonts search for flare serif or tiny serif. The cross stroke on the A matches a reverse of the A cross stroke in <a href="http://www.myfonts.com/fonts/adobe/itc-benguiat/" rel="nofollow">ITC Benguiat</a>.<br>
      Don</p>
