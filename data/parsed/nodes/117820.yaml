    <p></p><div class="imageWrap"><img src="http://typophile.com/files/QuireSansGraphic1_edit_4135.jpg"></div><p></p>
    <p>Inspired by the classic proportions of traditional book typography, and crafted for today’s digital landscape, the newest release from the Monotype Studio is the <a class="freelinking external" href="http://www.monotype.com/studio/quire-sans/ " rel="nofollow"> Quire Sans</a>™ typeface. Designed by Jim Ford, the family of 20 fonts is a typeface for all media, suitable for everything from branding, advertising and packaging, to displays, user interfaces, billboards, signage and environmental graphics. </p>
    <p>See the Quire Sans digital specimen: <a href="http://www.monotype.com/studio/quire-sans/" title="http://www.monotype.com/studio/quire-sans/">http://www.monotype.com/studio/quire-sans/</a><br>
    Download the typeface: <a href="http://www.fonts.com/font/monotype/quire-sans" title="http://www.fonts.com/font/monotype/quire-sans">http://www.fonts.com/font/monotype/quire-sans</a><br>
    Read the press release: <a href="http://bit.ly/1nb5qoo" title="http://bit.ly/1nb5qoo">http://bit.ly/1nb5qoo</a></p>
