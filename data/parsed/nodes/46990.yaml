  html: |-
    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150123110120im_/http://typophile.com/files/pitu01_4069.png"></div><br>
    <div class="imageWrap"><img src="https://web.archive.org/web/20150123110120im_/http://typophile.com/files/pitu02_5974.png"></div><p></p>
    <p>The <strong>FF Pitu</strong> typeface by <strong>Łukasz Dziedzic</strong> has been just released by <strong>FontShop International</strong> and is available in OpenType in three styles:</p>
    <p><a href="https://web.archive.org/web/20150123110120/http://www.fontshop.com/fonts/downloads/fontfont/ff_pitu_pro/" target="_blank" rel="nofollow"><strong>FF Pitu Pro Light</strong></a><br>
    </p><div class="imageWrap"><img src="https://web.archive.org/web/20150123110120im_/http://typophile.com/files/pitu03_5626.png"></div><p></p>
    <p><a href="https://web.archive.org/web/20150123110120/http://www.fontshop.com/fonts/downloads/fontfont/ff_pitu_pro/" target="_blank" rel="nofollow"><strong>FF Pitu Pro Regular</strong></a><br>
    </p><div class="imageWrap"><img src="https://web.archive.org/web/20150123110120im_/http://typophile.com/files/pitu04_6314.png"></div><p></p>
    <p><a href="https://web.archive.org/web/20150123110120/http://www.fontshop.com/fonts/downloads/fontfont/ff_pitu_pro/" target="_blank" rel="nofollow"><strong>FF Pitu Pro Bold</strong></a><br>
    </p><div class="imageWrap"><img src="https://web.archive.org/web/20150123110120im_/http://typophile.com/files/pitu05_3951.png"></div><p></p>
    <p>In his primary occupation as an editorial and magazine designer, Łukasz Dziedzic has been constantly in search for new typefaces. Most of his own fonts originate in situations where he felt that none of the faces currently available on the market worked “quite right” in the context of a project he was currently working on. Therefore, most of his typefaces have at some point been tested in real magazine layouts, and refined based on those findings. This was also the case with Pitu: an early version of the design was used by the Polish weekly “Europa” until the magazine assumed a different stylistic direction.</p>
    <p>Pitu started off in 2002 as a set of swashy capitals accompanied by lowercase that sits somewhere between a Didone italic and a Copperplate script. Its most characteristic features are probably the pronounced  stroke modulation and blade-shaped sharp stroke endings, which are slightly softened by generous calligraphic loops with “foxtail” terminals. While keeping a slanted angle of the face, Lukasz expanded the initial face into a three-weight family, changed the proportions of the lowercase, reworked the swash capitals and added a complete set of “simple” Didone capitals and small caps. </p>
    <p>In 2004, Pitu was selected for the “Bookmark” exhibition that showcased Central European typeface designs. The  exhibition took place in The Hague and was hosted by the Slovak Centre  of Design.  </p>
    <p>The primary alphabets of Pitu consists of an ordinary uppercase and lowercase<br>
    </p><div class="imageWrap"><img src="https://web.archive.org/web/20150123110120im_/http://typophile.com/files/pitu06_3788.png"></div><br>
    small caps<br>
    <div class="imageWrap"><img src="https://web.archive.org/web/20150123110120im_/http://typophile.com/files/pitu07_5260.png"></div><br>
    swash capitals, lowercase alternates<br>
    <div class="imageWrap"><img src="https://web.archive.org/web/20150123110120im_/http://typophile.com/files/pitu08_6034.png"></div><p></p>
    <p>The fonts also include several kinds or figures, various ligatures, superscripts, subscripts and many more characters.  The FF Pitu Pro fonts cover all Latin-based European languages, including some niceties. For example, in addition to the regular „ł”,<br>
    </p><div class="imageWrap"><img src="https://web.archive.org/web/20150123110120im_/http://typophile.com/files/pitu09_6332.png"></div><br>
    Pitu contains a calligraphic „ł” variant, typical for Polish handwriting:<br>
    <div class="imageWrap"><img src="https://web.archive.org/web/20150123110120im_/http://typophile.com/files/pitu10_3917.png"></div><br>
    And even, by popular demand (i.e. I asked him), an „łł” ligature:<br>
    <div class="imageWrap"><img src="https://web.archive.org/web/20150123110120im_/http://typophile.com/files/pitu11_4121.png"></div><p></p>
    <p><strong>Full character sets</strong> can be viewed for <a target="_blank" href="https://web.archive.org/web/20150123110120/http://www.fontshop.com/fonts/acs_rend.php?acs_db=1&amp;acs_pt=48&amp;acs_id=176303&amp;acs_fr=0&amp;acs_to=9000&amp;acs_w=1600" rel="nofollow">FF Pitu Pro Light</a>, <a target="_blank" href="https://web.archive.org/web/20150123110120/http://www.fontshop.com/fonts/acs_rend.php?acs_db=1&amp;acs_pt=48&amp;acs_id=176304&amp;acs_fr=0&amp;acs_to=9000&amp;acs_w=1600" rel="nofollow">FF Pitu Pro Regular</a> and <a target="_blank" href="https://web.archive.org/web/20150123110120/http://www.fontshop.com/fonts/acs_rend.php?acs_db=1&amp;acs_pt=48&amp;acs_id=176302&amp;acs_fr=0&amp;acs_to=9000&amp;acs_w=1600" rel="nofollow">FF Pitu Pro Bold</a> <em>(the images are large).</em></p>
    <p>FF Pitu is available through the <a href="https://web.archive.org/web/20150123110120/http://www.fontshop.com/" target="_blank" rel="nofollow"><strong>FontShop</strong></a> network. In addition to the three FF Pitu Pro OpenType fonts, the design is available in a variety of other encodings and formats. </p>
    <p><strong>Łukasz Dziedzic</strong> was born 1967 in Warsaw. Rather than to finish high school, he worked as a sound technician and occasionally actor at a children's theatre group, spent a year working as a carpenter helper rebuilding 13th-century churches, he lent his voice and bass guitar skills to the band »Dunski Jazz«, and worked as a software developer at the Polish patent office.</p>
    <p>During the first free Polish elections of 1989, he briefly worked as a newsboy for Gazeta Wyborcza, the newly-launched, first independent daily newspaper in the country. A year later, he joined the design department of Gazeta Wyborcza and spent seven years there, co-creating the layouts of the main newspaper and its weekly companion magazine, for which he drew his first typeface. He later worked for several other publishing houses in Warsaw (since 2003 at Axel Springer Polska), designing newspapers and magazines. In the same time, Łukasz drew over a dozen typeface families ranging from large Latin and Cyrillic text families to single display styles. Many of these fonts were originally created for a particular newspaper or magazine layout. Some of them went into regular use or were used occasionally (in Poland: Gazeta Wyborcza, Vita, Przyjaciółka, Fakt, Lub Czasopismo, Gość Niedzielny, TeleŚwiat, Komputer Świat, in Russia: OK!, in Germany: OK! and PAGE), others were never utilized.</p>
    <p>In 2007, Łukasz created a three-style Latin and Cyrillic corporate family for <a target="_blank" href="https://web.archive.org/web/20150123110120/http://www.flickr.com/photos/adamt/2563664544/" rel="nofollow"><strong>empik</strong></a>, one of Poland's largest press and music retail store networks. In the same time, FontShop International released two of Łukasz Dziedzic's families (<strong>FF Clan</strong> and <strong>FF Good</strong>). His <a href="https://web.archive.org/web/20150123110120/http://www.typo-berlin.de/2008/index.php?node_id=Dziedzic;942&amp;lang_id=2" target="_blank" rel="nofollow"><strong>Typo Berlin 2008 appearance</strong></a> did not bring him a standing ovation, as he did not show any examples of his own work, so he will do better next time. In 2008, FontFont released <strong>FF Clan Italic</strong> and <strong>FF Pitu</strong>. His other unreleased designs can be seen at his website <a target="_blank" href="https://web.archive.org/web/20150123110120/http://www.alfabety.pl/" rel="nofollow"><strong>alfabety.pl</strong></a>. </p>
    <p>The designer's name is spelled Łukasz, not Lukasz, but Typophile's support for non-Western characters in the Flash-driven headlines is broken. </p>
    <p>For those who like tongue twisters and want to try pronouncing Łukasz Dziedzic's name: it would go like <strong><em>woo-cash jeh-jeets</em></strong>. Also, <strong>Pitu</strong> should be pronounced <strong><em>pee-too</em></strong> (rhymes with <em>me-too</em>), not <em>pie-two</em> or <em>pie-t-you</em>. </p>
    <p>Łukasz has absolutely no clue what Pitu is useful for, so I suggest you give it a shot and let him know. </p>
    <p>Regards,<br>
    Adam</p>
