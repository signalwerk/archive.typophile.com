    <p>Hi all,</p>
    <p>I notice Apple is trying to stop the Australian company Woolworths from using their new logo which to me looks like a bunch of bananas or some other produce formed into a W.</p>
    <p><a href="http://www.smh.com.au/technology/biz-tech/apple-claims-woolies-is-getting-fresh-with-new-logo-20091004-ghxe.html" title="http://www.smh.com.au/technology/biz-tech/apple-claims-woolies-is-getting-fresh-with-new-logo-20091004-ghxe.html">http://www.smh.com.au/technology/biz-tech/apple-claims-woolies-is-gettin...</a></p>
    <p>I live in Australia and see the W logo everywhere and I am a fan of it, I have never ever thought of an Apple let alone Apple the electronics company when I have viewed this new logo.</p>
    <p>I mean the logo does not share any aesthetic qualities compared to the Apple logo in terms of color/style although there is a tiny outside resemblance of an outside shape of an apple and one that is not near the shape of Apples.</p>
    <p>I mean how much overkill can a company go to stop another unrelated company from using a logo? Is someone employed at Apple to view logos all day to ensure no one goes near their brand? </p>
    <p>I mean if Apple gets there way you may as well not even think about designing logos anymore, I see logos that look like other ones all the time and look a whole lot more alike than the Apple Woolworth W!</p>
    <p>Heck why doesn't the creator of Pacman sue the pants off LG for using the pacman shape in it's logo!</p>
    <p><a href="http://en.akihabaranews.com/36529/misc/pac-man-hidden-in-lg-logo" title="http://en.akihabaranews.com/36529/misc/pac-man-hidden-in-lg-logo">http://en.akihabaranews.com/36529/misc/pac-man-hidden-in-lg-logo</a></p>
    <p>Talk about Apple turning into the new Microsoft.</p>
    <p>Just wondering what others thoughts are on the subject.</p>
