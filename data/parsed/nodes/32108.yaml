      <p>Peter, I find the Fourier transform pictures of text intriguing, but frustrating as I don't know how to 'read' them properly. I know that a Fourier transform decomposes a function into its separate harmonic components, but I don't know how to relate that to the pictures of text blocks. </p>
      <p>Do you know of any tutorial on line which explains how to read such pictures?</p>
