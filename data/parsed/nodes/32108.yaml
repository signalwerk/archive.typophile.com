  html: |-
    <p>Recently (March 5) I gave a talk with the above title at the École de design of the Université du Québec à Montréal in their series <em>Enjeux actuels en Design</em>. (The original theme for the series was "interactive practices in design.") This was at the invitation of Alessandro Colizzi, who teaches there. </p>
    <p>My talks are usually tightly 'scripted,' and against a backdrop of pdf-style 'slides.'</p>
    <p>In case some of you are interested in reviewing or commenting on what I had to say, here is my text and the slides:<br>
    <a href="http://www.enneson.com/UQAM/uqam_ge+eitvc+design_script.pdf" rel="nofollow">text</a><br>
    <a href="http://www.enneson.com/UQAM/uqam_ge+eitvc+design_slides.pdf" rel="nofollow">slides</a></p>
    <p>The pdf of the slides will open up as a full screen set of visuals, so you'll have to advance slides by using the side to side arrows on your keyboard. Press: 'escape' on your keyboard to see it in the normal pdf environmnet.</p>
