  html: <p>Ligatures are fun, everyone knows this is true and yet there is very little application for them outside of display uses like advertising, book covers, greeting-cards, and the like. OK, so there are plenty of uses. But for the most part we see the same fi fl ff ffi ffl fj and increasingly Th. The ct and st ligatures look old, but we've got them too. There are 953234362662886047744000000 two-letter combinations possible, ignoring case and allowing for same-letter pairs like "ff." Very few text fonts (<a href="http://www.emigre.com/EF.php?fid=142" title="Mrs. Eaves Ligatures" rel="nofollow">Mrs Eaves</a> springs to mind) go beyond the basic five or six ligatures. What would make an attractive though non-essential ligature varies by face. My question, what are you favorite strange, unusual, totally unnecessary ligatures and what fonts have you seen them in? Second, what ligatures would you (be you a type user or type designer or a 12-year-old with a pirated copy of Adobe Font Folio and a type fetish) love to see available just for the hell of it? Please, no scripts. This is limited to serif and sans whether for display or text. It's a slow day and I'm curious.</p>
  html_clean: <p>Ligatures are fun, everyone knows this is true and yet there is very little application for them outside of display uses like advertising, book covers, greeting-cards, and the like. OK, so there are plenty of uses. But for the most part we see the same fi fl ff ffi ffl fj and increasingly Th. The ct and st ligatures look old, but we've got them too. There are 953234362662886047744000000 two-letter combinations possible, ignoring case and allowing for same-letter pairs like "ff." Very few text fonts (<a href="http://www.emigre.com/EF.php?fid=142" title="Mrs. Eaves Ligatures" rel="nofollow" class="link-external">Mrs Eaves</a> springs to mind) go beyond the basic five or six ligatures. What would make an attractive though non-essential ligature varies by face. My question, what are you favorite strange, unusual, totally unnecessary ligatures and what fonts have you seen them in? Second, what ligatures would you (be you a type user or type designer or a 12-year-old with a pirated copy of Adobe Font Folio and a type fetish) love to see available just for the hell of it? Please, no scripts. This is limited to serif and sans whether for display or text. It's a slow day and I'm curious.</p>
