    html: <p>Hatch does some really nice stuff. I live in Nashville and wish I had gotten an internship there. Unfortunately, Jim Sherraden had already hired his summer interns. Really nice guy. It's all 100-year old wood type on letterpress. Fantastic stuff in an age where design sometimes gets too "clean." Hooray for getting ink on your hands. :)</p>
