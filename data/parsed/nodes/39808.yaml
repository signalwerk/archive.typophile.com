      <p>The fact it's a poster for the Ryman pretty much gives it away as a Hatch piece.</p>
      <p>When I was at Blinc, we did some fonts based off of wood type for Chank (which I now see has already been mentioned). There's also usually an ad in most of the design rags for someone selling a wood type CD that is scans of wood type alphabets.</p>
      <p>And, yes, if you're ever in Nashville, definitely hit Hatch. Jim is, indeed, a very nice guy.</p>
