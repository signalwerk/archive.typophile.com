    votes: null
    html: |-
      <p>thanks for all the replies guys, this was my first post and i'm astounded by the quantity and quality of posts.  some great examples here, most of which i'm familiar with - particularly love the napoleon dynamite's opening sequence, which coupled with 'we're going to be friends' by the white stripes, perfectly captures the innocence of the film.</p>
      <p>i'd seen a lot of the work of Saul Bass before, without really realising it was his, and its stunning. part of the titles to 'the man with the golden arm' were copied for the white stripes  'hardest button to button' single sleeve. (you may have noticed i'm a white stripes fan!)  Love Wes Andersons work, his attention to detail, and his love of futura (like Kubrick), which is most noticeable in the Royal Tenenbaums...along with Helvetica for the book covers featured in the film.</p>
      <p>I've got a lot of ideas, just struggling to come up with a cohesive title/proposal for my dissertation, and a strong direction, but keep these coming!</p>
