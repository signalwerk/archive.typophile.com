    <p>Hi everyone, i'm exploring kinetic typography and movie titles as a dissertation idea, I just wondered if anyone could think of any examples of interesting typography use in opening sequences to films, either old or new, the only one which springs to my mind is the titles of 'Catch Me If You Can' (see below), a style which has been copied quite a lot, but if anyone can think of anything else please let me know.</p>
    <p>thanks.</p>
