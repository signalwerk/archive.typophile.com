    date: 2005-02-06T19:46:00
    date_raw: 6 Feb 2005 — 7:46pm
    votes: null
    html: "<p>I use nested styles in InDesign all the time and they work wonderfully. I'm using InDesign CS.  <br> <br>For the book I'm designing at present, for example, I have: <br>One parent paragraph style, with no indent, which consists of nested styles of: Drop cap, then 1st 3 words in small caps, followed by regular body text in rest of paragraph.  <br> <br>You can then define the \"Next Style\" to follow when you press the carriage return; which in my case is the regular body text face with a 1st-line paragraph indent . If you define this paragraph style to be \"based on\" the parent style, then any changes to the parent will flow on to the child styles (eg: shared attributes such as the body text face, the color, etc). <br> <br>The book \"Real World InDesign CS\" has great explanations of styles and nested styles. Failing that, I think there may be something here: <a href=\"http://www.carijansen.com/tips/016/index.html\" target=\"_blank\">www.carijansen.com/tips/016/index.html</a> <br>From memory, he also has material on previous versions of InDesign - there might be some material relating to the original question there.</p>"
