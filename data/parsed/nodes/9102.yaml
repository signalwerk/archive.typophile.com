    html: <p>You're going to need 2 different setting to accomplish this, Aku. Select the paragraph that follows the empty line and set all of the indents to 0. Then select the rest of the text, and give it the first line indent you prefer. There's no simple way to automatically tell InD to not to apply the indents after an empty paragraph. <br> <br>I incorporate these settings into style sheets, e.g., Body Text No Indent, and Body Text. The first is based on the second, so that any changes made to the Body Text style make their way to the No Indent style as well. <br> <br>Once you get the styles set up, you could use Find/Change to find the paragraphs that follow a blank line and apply the appropriate style sheet.</p>
    html_clean: <p>You're going to need 2 different setting to accomplish this, Aku. Select the paragraph that follows the empty line and set all of the indents to 0. Then select the rest of the text, and give it the first line indent you prefer. There's no simple way to automatically tell InD to not to apply the indents after an empty paragraph. <br> <br>I incorporate these settings into style sheets, e.g., Body Text No Indent, and Body Text. The first is based on the second, so that any changes made to the Body Text style make their way to the No Indent style as well. <br> <br>Once you get the styles set up, you could use Find/Change to find the paragraphs that follow a blank line and apply the appropriate style sheet.</p>
