    html: "<p>You can do it either here, the paragraph palette (I just realized I messed up, it's the space just below the highlighted area): <br> <br><img src=\"http://www.typophile.com/forums/messages/30/64745.gif\" alt=\"InD Pgh Palette\"> <br> <br>Or here, in the paragraph styles: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/64746.gif\" alt=\"Pgh Style Indents\"> <br> <br>If I understand, you want 'hanging indents' on your paragraphs. Just set the 'First Line Indent' to the negative of what the paragraph indent is. <br> <br>For example:  <br>Left Indent = 2p0 <br>First Line Indent = -2p0 <br> <br>Your screens may look different. I'm using InDesign CS in OS X.</p>"
    html_clean: "<p>You can do it either here, the paragraph palette (I just realized I messed up, it's the space just below the highlighted area): <br> <br><img src=\"http://www.typophile.com/forums/messages/30/64745.gif\" alt=\"InD Pgh Palette\"> <br> <br>Or here, in the paragraph styles: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/64746.gif\" alt=\"Pgh Style Indents\"> <br> <br>If I understand, you want 'hanging indents' on your paragraphs. Just set the 'First Line Indent' to the negative of what the paragraph indent is. <br> <br>For example:  <br>Left Indent = 2p0 <br>First Line Indent = -2p0 <br> <br>Your screens may look different. I'm using InDesign CS in OS X.</p>"
