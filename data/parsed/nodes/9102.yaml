    html: <p>InDesign CS now ignores all formatting of pasted text by default. <br> <br>In the Scripting folder of InDesign CS, there's a sample script that's called "TextCleanup". It runs find/change sequences on your text, like fixing double spaces and double returns, etc. that you can modify yourself to suit. There's instructions in there too. I'm about to start experimenting with it.</p>
