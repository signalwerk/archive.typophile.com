    html: <p>I found out that mostly you can save lots of time by getting rid of any pre-formatting before pasting your text into your InDesign document. Easiest way to do this is by pasting the text into an editor like simple text or word pad and save it again as txt or text only. That means a fresh start in InDesign without any strange preformatted bits and pieces and strange styles emerging in the paragraph styles list which may interfere with fresh formatting. If you need to draw a comparison with the originating word-document, a pdf works more convenient than the word-document itself.</p>
