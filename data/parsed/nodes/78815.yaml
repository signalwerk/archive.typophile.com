    <p>Bright Grotesk is a new typeface I'm working on. It's a mixture of humanist &amp; grotesk typefaces which is legible in small sizes yet charming in display sizes as well.</p>
    <p>There's still lot's of inconsistencies here and there as I have only started working on it last week.</p>
    <p>Any comments &amp; suggestions to improve it is highly appreciated.</p>
    <p><img src="http://img842.imageshack.us/img842/482/brightgrotesk.jpg"><br>
    <img src="http://img809.imageshack.us/img809/1336/brightgrotesk1.jpg"></p>
