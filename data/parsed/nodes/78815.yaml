  - id: 455921
    user: 20652
    date: 2011-03-16T03:57:00
    date_raw: 16 Mar 2011 — 3:57am
    votes: null
    html: |-
      <p>I'm really liking this. So remember the pinch of salt, this is just some impressions...</p>
      <p>I think the shape of the original /a/ was more in keeping with the bowl-and-stick letters; the horizontal part of the bowl now looks a bit too 'realist' rather than humanist or grotesque. But I agree the weight wasn't right in the bolder weights, and a more monoline approach works better.</p>
      <p>Leg of /k/ in latest sample 'cupcake' looks like the strokes are not parallel. Overall shape needs a bit of fiddling I think. It's too wide?</p>
      <p>Generally to me the straights look heavier than the rounds...especially /b/, /d/ etc. You'll need to balance that out.</p>
      <p>Tail of /j/ looks out of place...again a more monoline approach will harmonise best I think. Curve of J needs smoothing at SE section.</p>
      <p>Love the way the spurs on /b/, /m/, /r/ etc are curved. On bolder weights they may not be long enough, need to descend/ascend further?</p>
      <p>In lighter weights, /S/ and /s/ need more curl in the spine, they look a bit limp and flat.</p>
      <p>I understand the historical reasons for the choices on the heads of /t/ and /1/ but I think it's not necessary to have those curves there. I'd prefer straights.</p>
      <p>/N/ looks wide, especially in the bold weight.</p>
      <p>Bold /8/ looks unbalanced, and the bold /2/ needs more bowl and is possibly a fraction too light. /5/ is possibly falling left.</p>
      <p>Great design, keep it up! :)</p>
