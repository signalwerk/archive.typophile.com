    html: |-
      <p>There's nothing wrong with the font per se. I'm sure you'll observe the same "issue" when using a sans serif other than Myriad.</p>
      <p>What happens is that the Reader (or whatever app you're using for viewing the PDF) takes advantage of the hinting data present in the font to improve the rasterization. When the glyphs are converted to outlines, that hinting data is no longer available, so the Reader defaults to a different rasterization mode that is good for general artwork, but not ideal for outlined text.</p>
