    <p>Here's something that always troubled me: Wheneaver I export a PDF from Illustrator or InDesign, that uses Myruad Pro, some of the letters (I and l's) would always display rather awkwardly (though they'd print fine afterward). This is mainly noticeable when the type is outlined. I also found that some older versions of acrobat would display and print the I and l glyphs as dashed lines.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Myriard_3729.gif"></div><p></p>
