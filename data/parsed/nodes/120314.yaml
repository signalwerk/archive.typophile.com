      <p>Good find Ryuk.<br>
      Eastwood seems to have been derived from the 1960s poster for _A FISTFULL OF DOLLARS_ <a href="http://i158.photobucket.com/albums/t84/theclinteastwoodarchive/HiQualityUKQuad.png" title="http://i158.photobucket.com/albums/t84/theclinteastwoodarchive/HiQualityUKQuad.png">http://i158.photobucket.com/albums/t84/theclinteastwoodarchive/HiQuality...</a><br>
      The ARSENIC AND OLD LACE image seems to be relatively recent and clearly uses Eastwood.<br>
      A reminder that when looking at an image for font ID its really helpful to know the approximate date.<br>
      Don</p>
