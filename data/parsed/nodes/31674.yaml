    html: |-
      <p>I’d name the capital glyphs “A.titl”, “B.titl” etc., and would associate them with three features: “titl”, “ss01” and “salt”: </p>
      <p><code>@UC = [A B C ...];<br>
      @UC_TITL = [A.titl B.titl C.titl ...];</code></p><code>
      <p>feature titl {<br>
        lookup titl1 {<br>
          sub @UC by @UC_TITL;<br>
        } titl1;<br>
      } titl; </p>
      <p>feature ss01 {<br>
        lookup titl1;<br>
      } ss01;</p>
      </code><p><code>feature salt {<br>
        lookup titl1;<br>
      } salt; </code></p>
      <p>Regards,<br>
      Adam</p>
