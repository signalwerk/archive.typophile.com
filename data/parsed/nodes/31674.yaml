    html: |-
      <p>Thanks.</p>
      <p>Nick, it all depends on what you are doing. As a font user rather than a font maker, I really prefer all glyphs in one font. Suppose, for example, that I need to go back to a font and change kerning between two lower-case pairs. Or add a character. Or change a character. Or. . . With one font, you make the change(s) and are done with it. With split fonts, you have to remember to make it in both.  That is the primary reason I made up database fonts when we were using the Type 1 format. More work starting out, but a lot less work in font maintenance.</p>
      <p>I can live without case. As for cpsp, most book designers specify the amount of letterspacing for caps &amp; small caps, and it is hardly every the amount you build in with cpsp. c2sc is nice, but there is 10+ years of authors &amp; editors putting (eventual) small caps in the lower case due to the Type-1 font structures. Yes, it makes the downstream document harder to prepare, but you know history.</p>
      <p>I’ll take a look at titl, though.</p>
      <p>The cpsp code reminds me of a funny story. Sumner Stone, trying to save the ignorant from themselves, built in a rather generous right sidebearing with the small caps in a font (Type 1). The small caps set by themselves did look pretty good. But when you had Cap-small caps, things went to hell in a hurry — the letter following a cap was tighter to it than to the following letter. Punctuation also was a problem — which would include abbreviations that used the period (e.g., B.C.).</p>
      <p>Moral: you can’t save the ignorant from themselves, and for the moment anyway, there is still a bit of use for compositors.</p>
      <p>Thanks to all</p>
