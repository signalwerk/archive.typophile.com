    html: |-
      <p>It would be easier to make a separate Tall Caps font. That way all you would have to do is substitute the gylphs in the normal cap spots, and you’d get features like c2sc, smcp and case without a lot of messing around with classes and coding.</p>
      <p>And you would be able to recognize and specify the different versions at the top level of the app, without having to dive down into the OT menu.</p>
      <p>That is the benefit of the feature being named in plain English, as part of the font name. Stylistic sets are problematic because they are an uninformative code number: a descriptive name field which shows in the application menu would be helpful, but it hasn’t been implemented yet. So the typographer has to play “spot the difference” or, heaven forbid, consult a reference document, to figure out what the feature does.</p>
