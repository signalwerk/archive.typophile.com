    <p>I’m working on a font that has (like Fournier) a set of tall capitals. The final font must be usable in InDesign. What I plan to do is to have a set of caps named A.tall B.tall . . . Z.tall and implement them through a stylistic set, rather than fib about the “normal” caps by calling them “petite.” (I don’t think InDesign supports the petite caps feature yet, does it?) Can anybody think of why this won’t work, or a better solution?</p>
    <p>TIA</p>
