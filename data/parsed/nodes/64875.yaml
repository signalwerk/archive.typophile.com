    <p>I am working on a website for a service that wants to cater to a design/creative community. For this reason I was playing with an idea of adding an Intro page to the site that would be shown once, the first time someone visits the site. Just to set the stage and sort of help shaping the impression of the site <em>before</em> a visitor gets to the main page.</p>
    <p>For one, I am not 100% sure that this will not come across as forced and/or cheesy. For two, I am not sure if I am overdoing it. For three, not sure if it looks stylistically correct to mix the small caps and lowercase italics. </p>
    <p>That's why I wanted to get some quick opinions on the matter.</p>
    <p>Here are three versions of that page, black/black, black/white, white/black and also varying in a type size a bit. The typeface is <a class="freelinking external" href="http://new.myfonts.com/fonts/fontbureau/hightower/" rel="nofollow">High Tower</a>.</p>
    <ul>
    <li> <a class="freelinking external" href="http://certtime.com/sketches/splash-3.html" rel="nofollow">Version 1</a> </li>
    <li> <a class="freelinking external" href="http://certtime.com/sketches/splash-1.html" rel="nofollow">Version 2</a> </li>
    <li> <a class="freelinking external" href="http://certtime.com/sketches/splash-2.html" rel="nofollow">Version 3</a> </li>
    </ul>
    <p>And just to get an idea of the website's style, <a class="freelinking external" href="http://certtime.com/sketches/better-1.html" rel="nofollow">here</a> is a sketch of site's bare frame.</p>
    <p>Any thoughts or comments are greatly appreciated. Thick skin is provided.</p>
