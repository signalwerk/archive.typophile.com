      <p>Thanks for the comments, fellas.</p>
      <p>@aric, I tried High Tower for the main site headers and such, and it doesn't really work. It has too much character to it if you will and just unbalances the whole page. </p>
      <p>With regards darker shade of gray - do you mean the center piece or the borders ?</p>
      <p>@seventy7, I have the book, mostly obvious stuff. Too many pages, too little content, it should've really be printed as a pamphlet or a blog post :) I fully understand the hurdles/friction/etc concept of the user interaction and I was contemplating the splash page only because it might've brought more in terms of a Wow effect than it would've subtracted in terms of the usability and an extra click.</p>
      <p>The tag line content is temporary. I will change it to something more specific... though it's kind of hard to have it both specific <em>and</em> short. </p>
      <p>With regards to the tag line placement - it is still TBD. Placing it under the logo expands the header by another 20-40px vertically, and adds more dark emptiness at the top of the page. Putting it next to the logo is better, but makes the header look somewhat cluttered and busy. In its current position it is going to be shown only when the user is not logged in. Otherwise the right menu will expand to the left with more items and there will remain no space for the tag line.</p>
      <p>Thanks for compliments, I'm glad you liked what you liked :)</p>
