    html: |-
      <p>I agree with Jan and hamiltro. Don't do an intro page. The site should be self-explanatory without the need for an intro page. People tend to view intro pages as unnecessary barriers to the content. If you include one, you'll risk losing a chunk of your audience to frustration. </p>
      <p>Instead, focus on making whatever service you're offering as obvious as possible. Start with a tag line. Not sure if "Digital proof of existence" is the tag line, but if it is, I recommend finding something much more to the point. And put it where people are used to seeing it: below or near the logo. </p>
      <p>The barebones frame looks classy and functional. And the color palette works well. Excellent work.</p>
      <p>If you haven't already read it, I'd recommend "<a href="http://www.sensible.com/buythebook.html" rel="nofollow">Don't Make me Think</a>," By Steve Krug.</p>
