      <p><strong>Round two</strong></p>
      <p>Today I have a selection of seven fine typefaces and I wanted to ask for help with making a wise choice.</p>
      <p>I am considering using this font for the headers, tag lines and "slides", i.e. sparingly and for relatively short stretches of the text (set at 14-18px). </p>
      <p>Just to re-establish the context - a website providing serious, fairly technical service, but primarily catering to the design community. Needs to be clean, friendly, professional with a bit of personality.</p>
      <p>Please cast your votes, ladies and gentlemen. #8 is for "they all look the same" :)</p>
      <p>I am personally leaning towards #5. </p>
      <p>Here is the <a class="freelinking external" href="http://www.certtime.com/sketches/magnificent-seven.png" rel="nofollow">selection</a>.</p>
