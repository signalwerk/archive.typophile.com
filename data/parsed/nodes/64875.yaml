      <p>Okay, I just figured out that the numbers in the link text don't agree with the corresponding URLs--"Version 1" goes to "splash-3", etc.  For clarity, the version I find friendlier is the one with the white background; I would like to see the logo and the words "the", "for", and "ENTER" made a bit darker.  In the versions with the dark background the contrast is fine.</p>
      <p>Even aside from the fonts, the splash screen and main site are really dissimilar.  I imagine most website visitors won't mind the difference (most probably won't notice), but by making the two pages so different, I think you risk diluting the identity message you're trying to convey.</p>
      <p>In any case, if you decide to keep the intro page, go to great lengths to get visitors beyond it.  Set everything up as a link, so that if the user clicks anywhere (not just on the word "enter"), it takes them to the main page.  And set up an automatic redirect so that after some sane number of seconds their browser will take them there by default.</p>
