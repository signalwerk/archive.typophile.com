    html: |-
      <p>The money would have to be really good for you to accept terms of this nature . . .</p>
      <p>Generally speaking this is too far reaching and could create a situation where you'd be competing with yourself in the future if they ever decided to resell or give away the fonts in a different format . . .</p>
      <p>Many folks who've been around the block on this would simply encourage you to build them a custom one-off they can purchase outright since they could lord over the details of what they wanted to do with it and you'd have your cash and clean hands of the deal . . .</p>
      <p>Ultimately you have to decide from a business perspective if its a fair deal for all parties but know it could certainly hamper your ability to negotiate future licenses of the same scale if this group comes back for another sweetheart deal for them of a company they own/run . . .</p>
      <p>Stuart :D</p>
