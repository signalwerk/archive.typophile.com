    html: |-
      <p>Then again…</p>
      <p>Now that I think about it I’m not sure this is really such a big deal. Designers who don’t buy printing for clients commonly dump all the files in a design, including the fonts, to disc and and it over to their client who then passes it along to a printer. And most font EULAs allow this sort of thing in their clause allowing fonts to be used by service bureaus. This seems to be a similar situation; in this case the clients are probably not people who are likely to have a motivation to scoop the fonts off the disc and do anything with them. Maybe you should just allow it provided that each font comes with a readme file noting that the fonts are only licensed for printing that particular design and a new license must be purchased for other uses.</p>
