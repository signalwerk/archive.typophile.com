      <p><em>Maybe you should just allow it provided that each font comes with a readme file noting that the fonts are only licensed for printing that particular design and a new license must be purchased for other uses.</em></p>
      <p>Whether or not the client knows that they have "free" font files in their job file depends on how savvy the client is; the folks at service bureaus and print shops, however, are very aware. In an ideal world, every print shop would have an IP Compliance Officer, and that would work. However, in the real world, what usually happens is this:</p>
      <ol>
      <li>A client's job comes in. The job is inspected, and accompanying font files are installed on the server.</li>
      <li>The job is proofed, revised if necessary, and then goes to film or direct to plate.</li>
      <li>After the job is delivered, nobody bothers to delete the font files from the server, and the print shop design staff suddenly has more fonts at its disposal.</li>
      </ol>
      <p>The worst-case scenario would be a very savvy user who brings his or her own flash drive into the POS design station, which he or she claims has project artwork on it. Once the flash drive is connected, he or she navigates to the Fonts folder and transfers the whole kit and kaboodle to the flash drive...</p>
