      <p>To solve this problem, you have to change your way of thinking about traditional licensing methods . . .</p>
      <p>The future of font licensing is cloud based which means, the font lives here nor there . . . No longer can we associate licensing with a fixed number of desktops or output devices but rather the specific number of end users and when the total number of users is no longer an appropriate variable, the fallback is uses or more specifically individual uses . . .</p>
      <p>I define these as 'impressions' and for the last 4 years have become an advocate for this manner of font licensing . . .</p>
      <p>Consider this as 'microstock' licensing but for fonts . . . Each time the font is used where it generates value for the item being purchased, a small fee is payable to the foundry.</p>
      <p>Whether the font resides on a server or the outlines are embedded in a software file that is re-distributed, you have to determine what fee gives you the piece of mind that you're not losing a sale . . .</p>
      <p>Also remember all agreements are negotiable and you have the option to strike or modify any portion that you find unpalatable . . .</p>
      <p>FYI, we have several of these licenses already in place and they continue to make income for the foundries we represent at Font Bros . . .</p>
      <p>Stuart :D</p>
