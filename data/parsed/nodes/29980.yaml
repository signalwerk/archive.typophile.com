      <p>Nick Shinn's Handsome Pro is the thing, available at <a href="http://www.fontshop.com/showfont.cfm?fid=NS.120661.0.0" rel="nofollow">FontShop</a> or <a href="http://www.veer.com/partner/link.aspx?i=1048&amp;c=4&amp;p=products/typedetail.aspx?image=SHT0000033" rel="nofollow">Veer</a>.</p>
      <p><a href="http://shinntype.com/Assets/splash05/HP.html" rel="nofollow">The Handsome family</a> has been given the OpenType treatment! Now, contextual alternates (which work automatically in the latest versions of Adobe software) make typesetting with Handsome look even more like real writing. Not only that, but the range of “pens” has been extended to six styles, with Thin (much like a “Fineliner”) and Extra Bold (rather like “Speedball Fat”) versions at either end of the weight spectrum, Classic (a super-elegant version of Nib) and Rough, which simulates the effect of a rollerball or fine-tipped felt-nib pen on ordinary paper, with a subtle “bleed”.</p>
