    html: <p>I haven't seen a Garamond with such wiggy proportions (see a, s, e, c). Goudy's drawings are much more like the Jannons that were misattributed. Also, that was for Monotype. This is set with a Linotype or equivalent non-kerning system. Look at j, z, y, r and especially the telltale smashed f. Looks like Andreas found it.</p>
