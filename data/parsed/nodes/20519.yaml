    html: <p>This isn't a "true" Garamond, I think it's the Jean Jannon roman or a later Garamond mistakely based on the Jannon roman. As this is metal, I think it might be difficult to find an exact match. However, Simoncini Garamond is close and Frantisek Storm's Jannon is a nice Jannon revival worth looking at.</p>
