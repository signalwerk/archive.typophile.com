      <p>Karsten: <em>The pixel vs outline discussion seems pointless. Each serves a purpose. Existence of Illustrator/Freehand did not render Photoshop useless...</em></p>
      <p>No, but Photoshop stores text and geometries internally as vector graphics. Yes, bitmaps and vectors each serve a purpose, but the purpose of scalable shapes is better served by vectors. Bitmaps are fine if all you need is a couple of discreet sizes for screen display at known resolutions, which is Apple's immediate situation with regard to emoji support, but I presume they would acknowledge that this doesn't constitute the whole picture of multicolour, scalable text.<br>
      _____</p>
      <p>I agree with you completely re. sfnt fonts with SVG only. It makes no sense to spec SVG as a secondary glyph source that also <em>requires</em> a glyf or CFF table, although that configuration should be made possible. For fonts that have both SVG and another outline table type, I can imagine a dedicated cmap subformat pointing to the former for a subset of characters (an analogue would be the format 14 cmap for variation selector sequences). An SVG-sfnt savvy app could check this cmap first, and render any codepoints assigned in it using the SVG table, and then render any remaining characters using the next platform appropriate cmap.</p>
