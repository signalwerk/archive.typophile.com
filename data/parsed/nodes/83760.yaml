      <p>"Mr Patel made an interesting remark on the OT List (9 July 2011), that an SVG-only SNFT-based font may need another version identifier. Which makes me wonder, though, why glyf|CFF-plus-SVG SNFT-based fonts are supposed to continue using 0x00010000 or OTTO version identifiers ..."</p>
      <p>Fonts that also have glyf or CFF table are backwards compatible with existing font-consuming apps/OSes. So they can maintain the existing identifiers. Fonts that lack these existing tables would not be backwards compatible and would need a new identifier.</p>
