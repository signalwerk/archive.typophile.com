      <p>There are, broadly, two approaches to standardisation. One is that you makes something and then try to get other people to accept it as a standard, on the basis of its technical merits an/or the basis of its implementation. The other is that you recognise a need for or a benefit to standardising something and you sit down and start spec'ing a standard before you start making something.</p>
      <p>Much of the mess that Web developers have to deal with is the fallout of a history of individual companies making things for their own 'constituencies' (customers, user base), rather than creating and following standards. And that includes the mess that is cross-browser text rendering, which you have elsewhere suggested should be standardised rather than treated as an area of competition.</p>
      <p>Adam doesn't have a constituency. Which suggests that he's going to look at ideas based on general benefit and technical merit rather than corporate advantage.</p>
      <p>I'm not faulting Apple for rushing to market with a colour bitmap in font solution for emoji, which serves their constituency and keeps their phones in a competitive position. I'm saying that a) there are use cases for coloured display of encoded characters that go beyond emoji, and b) a bitmap-in-font implementation doesn't seem like a good long-term basis for standardising support for such use cases. You said that SVG was ‘silly and shortsighted’, and I'm saying that colour bitmaps is shortsighted.</p>
      <p>Specifically, you said that pushing SVG was silly and shortsighted in light of the problems we already have with TTF rendering on the web. But that doesn't follow, because while TTF rendering has been treated as an area of competition, and hence of differentiation and non-standardisation, by OS and browser makers, SVG is a Web standards project, and there is better chance of getting cross-browser compatibility in SVG rendering that there is in TTF rendering. Note that this is <em>not</em> to suggest that SVG can replace TTF as the text font format of choice for the Web, but that the rendering problems of TTF are independent of whatever might be done with SVG. So it doesn't make sense to me to criticise SVG on the basis of what doesn't work in TTF on the Web.</p>
    html_clean: |-
