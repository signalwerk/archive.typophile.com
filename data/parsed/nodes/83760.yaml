      <p>If it's the same as on  the iPhone, it's PNGs in two sizes in a proprietary »sbix« table.</p>
      <p>I had a day off recently and nothing better to do than hack the Apple Color Emoji font from the iPhone. I figured out the »sbix« table format and extended the Python FontTools so that I was able to decompile the table and extract the glyph images. The PNGs are in a different format than usual, supposedly to be rendered faster on the iPhone's processor, but I found a Python script that converts them to the standard PNG format.</p>
      <p>BTW anybody could do that with a little web research and general knowledge about font formats, no Apple-specific insider knowledge required, let alone NDAs ;)</p>
      <p>I think if Apple want to extend the support for this to more and different devices, with different resolutions, a vector-based approach would be better.</p>
