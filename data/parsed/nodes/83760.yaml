      <p>A few remarks:</p>
      <p>First, the discussion is not about SVG Fonts but about SFNT-based fonts (i.e. OpenType fonts) that include an SVG table for outline description.</p>
      <p>Thinking <em>only</em> of SFNT-based fonts with glyf|CFF table <em>plus</em> SVG table (meant to <em>add</em> a handful of colored glyphs to otherwise black glyphs defined in the glyf|CFF table) is shortsighted. It makes things unnecessarily complicated, like aksing for an extra mechanism to replaces glyf|CFF-table glyphs by SVG-table glyphs.<br>
      That is, besides SFNT-based fonts with glyf|CFF table <em>plus</em> SVG table, <em>also</em> include SNFT-based fonts with <em>only</em> an SVG table in your scenario.* SVG-only SFNT-based fonts have a few advantages:<br>
      <em>–1–</em> Outline description can be in either cubic or quadratic bezier curves, which allows designers to choose and stick to their preferred format.<br>
      <em>–2–</em> And they can make a outline format choice without making an implicit choice between CFF or glyf table. SVG format is just some friendly text.<br>
      <em>–3–</em> If there is only one outline description table, GSUB and GPOS can – as with normal glyf/CFF-only fonts – kick in. You can design a full-color glyph set. You can design a mostly black glyph set and a few colored glyphs, and then use a Stylistic Set OTL feature to replace default black glyphs by colored alternate glyphs. You can design a mostly black glyph set and a few <em>encoded</em> glyphs in color (the emoji example) when these are colored by default.<br>
      (Ignoring what may or may not be considered disadvantages of the SVG format and/or its current support.)</p>
      <p>The pixel vs outline discussion seems pointless. Each serves a purpose. Existence of Illustrator/Freehand did not render Photoshop useless, nor the other way round.</p>
      <p>* Mr Patel made an interesting remark on the OT List (9 July 2011), that an SVG-only SNFT-based font may need another version identifier. Which makes me wonder, though, why glyf|CFF-plus-SVG SNFT-based fonts are supposed to continue using 0x00010000 or OTTO version identifiers ...</p>
