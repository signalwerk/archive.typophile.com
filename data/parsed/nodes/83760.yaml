    html: |-
      <p>Colour bitmaps are likely to be an adjunct format, just as embedded b/w and greyscale bitmaps are. The most likely <em>scalable</em> colour font implementation seems to be some form of the SVG-in-OT model. That currently has two draft forms, from <a href="http://dev.w3.org/SVG/modules/fonts/SVG-OpenType.html" rel="nofollow">Mozilla</a> and <a href="http://lists.w3.org/Archives/Public/public-svgopentype/2012Aug/att-0000/SVG_in_OpenType_WD_2012-08-07.pdf" rel="nofollow">Adobe</a>. These will probably merge, but it's early days, so someone else may come along with something more compelling.</p>
      <p>I make these comments as a bemused observer, whose interest in multicoloured glyphs doesn't extend much beyond the Ethiopic paragraph marker.</p>
    html_clean: |-
