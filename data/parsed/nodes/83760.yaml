      <p>Thomas: This makes sense.</p>
      <p>John: I didn't intend to start or contribute to a bitmap vs vector discussion; as a hint, I better remain silent about how useful I find Photo<em>Font</em>. As to glyf|CFF-plus-SVG fonts and glyph substitution/mapping, Mr&nbsp;Patel's original proposal offered a quite straightforward solution, and something similar was discussed on one of the W3 lists (1&nbsp;July 2011). Both seem useful – if implemented as a separate table: Including the glyph substitution/mapping mechanism in the SVG table does not make sense because it is unnecessary in SVG-only fonts. I am not sure about including adding another subtable to cmap, for a similar reason: According to proposals so far, what is needed is mere GID to GID mapping rather than codepoint to GID mapping. And according to proposals so far, SVG-glyphs are meant to be alternates of glyphs covered in glyf/CFF, which suggests that an independent substitution/mapping table is the better choice, e.g. you could remove or add SVG table plus substitution/mapping table without need to dissect cmap.</p>
