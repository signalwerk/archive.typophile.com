      <p>Personally, I think just because emoji pushed the boundary for text encoding -- and you should have heard the arguments about that in Unicode circles! -- that doesn't mean they <em>need</em> to push the boundary of what constitutes a font. There is no reason at all that text encoded characters need to be represented by glyphs in a font; they could just as easily be represented by any indexed collection of bitmaps, vector graphics or, for that matter, robots with spraycans.</p>
      <p>I think there are acceptable reasons why we might want to be able to incorporate colour into fonts in future: mostly in display type, of course, but also for text in some scripts that have traditionally used multi-colour signs (Ethiopic is an obvious example) but have been unable to do so in typography. But rushing to a bitmap-in-font solution as Apple have done to solve a particular use case for emoji seems to me shortsighted in a way that makes Adam's tentative analysis of the SVG option really very thoughtful in comparison.</p>
