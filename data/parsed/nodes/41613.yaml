    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 1.Feb.2008 8.37am </div>
      <p>Hot Metal to Hot Keys<br>
    Printing Historical Society Conference 2008<br>
    22-23 April 2008<br>
    St Bride Library, London</p>
    <p>’Hot Metal to Hot Keys: 50 years of turmoil 1950-1999’ focuses on recent changes in the printing industry and features speakers with direct experience at the cutting edge. There will be a number of short films produced by the industry during the period. Gravure, flexography, printing on demand, phototypesetting, dry transfer, strike-on composition and other long- or short-lived processes and machines, and their impact, will all be explored.</p>
    <p>Registration is now open for the 2008 Printing Historical Society conference.</p>
    <p>For programme details, visit the PHS website:<br>
    <a href="http://www.printinghistoricalsociety.org.uk/forthcoming_events/index.html#65" title="http://www.printinghistoricalsociety.org.uk/forthcoming_events/index.html#65">http://www.printinghistoricalsociety.org.uk/forthcoming_events/index.htm...</a></p>
    <p>To register, go to the St Bride website:<br>
    <a href="http://stbride.org/events_education/events/fromhotmetaltohotkeys" title="http://stbride.org/events_education/events/fromhotmetaltohotkeys">http://stbride.org/events_education/events/fromhotmetaltohotkeys</a></p>
    <p>Early registration rates apply until 1 March 2008.</p>
