    <p>Hi,</p>
    <p>In InDesign there are two options in the justification window; adobe paragraph composer and adobe single-line compser.<br>
    My guide books recommands me to use the first one but it doesn't tell me why. I don't like to be told what to do if I don't understand why I am doing it. Can you guys tell me what this is all about?</p>
    <p>Cheers</p>
