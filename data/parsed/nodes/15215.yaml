      <p>It seems to me though that software is <cite>always</cite> pushing the hardware's limits (maybe due to a lazy attitude towards code optimization, and/or guided by a desire for eventual/perpetual upgrade fees...) and I can think of two recent example: InDesign's somewhat brutish (but necessary, performace-wise) use of a bilinear algorirthm for optical spacing, instead of a smooth (ideally quadratic, or maybe parabolic?) curve; and MS forsaking vertical hinting in CT (until Longhorn/Vista).</p>
      <p>hhp</p>
