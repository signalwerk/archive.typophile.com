    html: |-
      <p><cite>what’s the point of having the single-line composer?</cite></p>
      <p>1. It's faster. In this day of 2GHz+ processors, that's <em>really</em> unlikely to matter much.</p>
      <p>2. The results are a bit more predictable when you're editing text. In particular, when you make an edit at the very end of the paragraph, it won't change much at all. The whole-paragraph option could easily reflow the whole thing. If one were using InDesign to key in large pieces of text (as opposed to importing them from elsewhere), that could be distracting.</p>
      <p>So, bottom line, for the vast majority of users, there's no good reason at all. But software developers <em>love</em> leaving in options as opposed to making up their mind about what's the best thing to do.</p>
