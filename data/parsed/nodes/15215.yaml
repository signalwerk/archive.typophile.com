      <p>As I understand it, the single-line composer does the best it can justifying each line. Having done that, it then justifies the next line to the best <em>it</em> can be given what has gone before, and so forth. </p>
      <p>But better spacing overall can often be achieved by considering the paragraph as a whole. For instance, the "best" justification for line 1 (considered alone) may lead to very bad breaks for lines 2 and 3. It may be that by having a slightly worse break for line 1, you can have much better breaks for lines 2 and 3, and the overall effect will be better. The paragraph composer does that: it looks at the paragraph as a whole and, as it were, notices "If I break this line here I get terrible spacing later; maybe it would be better to break it there instead, and improve the spacing of later lines."</p>
      <p>The advice to use the paragraph composer generally is therefore sound: overall it should result in better (more intelligently) justified text.</p>
