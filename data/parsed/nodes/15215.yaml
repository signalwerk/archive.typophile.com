      <p>Actually, I use the single-line composer a fair bit. For finicky layout problems, the last thing I want is to be fighting with a computer that is making decisions for me. Single line composer is really useful when I need to make a course description fit onto a certain number of lines. With paragraph composer on it often ignores the discretionary hyphens I want it to use; it's difficult to force the paragraph composer to do what you want. So when it's important that I squeeze that last word onto the line above, I'll try the single line composer.    </p>
      <p>Kristina.</p>
