      <p>Hmmm - Titillium is nice but I am almost leaning towards a typewriter type font.<br>
      Something as simple as <a class="freelinking external" href="http://www.jabroo.com/index/search/q/american+typewriteramerican typewriter" rel="nofollow">american typewriter</a> or maybe  <a class="freelinking external" href="http://new.myfonts.com/fonts/matthias-luh/typewriter-basix/" rel="nofollow">typewriter basix</a>.<br>
      Thoughts?</p>
