    <p>I am working on redoing the website for our lab.</p>
    <p>The page header will be all text so I want to use an interesting font . . . professional, science-y, but not boring and will still look good with the web fonts used througout the rest of the site.</p>
    <p>This is the theme I will use for the new website:<br>
    <a href="http://organicthemes.com/demo/portfolio-gray/" title="http://organicthemes.com/demo/portfolio-gray/">http://organicthemes.com/demo/portfolio-gray/</a></p>
