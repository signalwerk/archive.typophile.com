  html: "<p>We can only hope that once you've seen our review of Indie Fonts,  it will be clear that the photo essay was in the works before Stephen beat us to the punch over at Typographica -- not that we could ever hope to compete with his prose (<a href=\"http://www.moderndrunkardmagazine.com/issues/10_02/10_02_bar_signs.htm\" target=\"_blank\">and</a> <a href=\"http://www.bullworks.net/virtual/newstuff/buster.htm\" target=\"_blank\">prolific</a> <a href=\"http://yoga.tripod.co.jp/flash/kikkomaso.swf\" target=\"_blank\">linking</a>) anyway... <br> <br>40,000 Words: A Look at Indie Fonts <br><a href=\"http://www.typophile.com/reviews/\" target=\"_blank\">http://www.typophile.com/reviews/</a> <br> <br>Indie Fonts Brings Unseen Type to the Masses  <br><a href=\"http://typographi.ca/2002_12_17.php\" target=\"_blank\">http://typographi.ca/2002_12_17.php</a> <br> <br>Indie Fonts home at P22 <br><a href=\"http://www.p22.com\" target=\"_blank\">http://www.p22.com</a></p>"
