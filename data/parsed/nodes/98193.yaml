      <p>Ryan, you have no idea what you are writing about, which is a very complicated and tragic situation. Within hours after Israel voluntarily withdrew from the Gaza strip in Sept 2005 some within Gaza started shelling Israel, <a class="freelinking external" href="http://en.wikipedia.org/wiki/List_of_rocket_and_mortar_attacks_in_Israel_in_2001_through_2006" rel="nofollow">as noted here in a Wikipedia article</a>. If they were interested in further withdrawal from the West Bank, this would make no sense, as it is not exactly designed to encourage Israel to continue withdrawal from territories beyond the '67 borders. </p>
      <p>However the continual shelling of Israel by the Hamas-led government (which took over by violence) is understandable given <a class="freelinking external" href="http://en.wikipedia.org/wiki/Hamas_Charter" rel="nofollow">the Hamas Charter</a>, which explicitly adopts the goal of eliminating the Jewish state, and is full of hatred for Jews, not just Israelis—and has not been renounced by current Hamas leaders. <a class="freelinking external" href="http://en.wikipedia.org/wiki/Palestinian_rocket_attacks_on_Israel" rel="nofollow">Gaza has continually shelled Israel since</a> Israel left in 2005, leading to the 2008 invasion by Israel and second withdrawal, and then relative quiet for several years. But there has been <a class="freelinking external" href="http://en.wikipedia.org/wiki/Palestinian_rocket_attacks_on_Israel#2012" rel="nofollow">escalation recently</a>. A country being continuously shelled by another is intolerable, and Israel fighting back against those who have declared war against them and are continually attacking them is understandable. If some Mexicans were shelling Texas regularly, I think we would less see restraint on the part of the US. </p>
      <p>The situation in Gaza is also intolerable, partly due to Israel's blockade, and I am sure Israel has also done bad things. In any case, it is disgusting and horrible that people are dying on both sides, and right now many more on the side of Gaza. But the fact is that Israel is not conducting a genocidal war. If they wanted to do that, they could, and millions would die, but that isn't what is happening. It would also be insane and evil, but that is another matter.  </p>
      <p>I am also not saying that the Netanyahu government is right to attack now. I am too far from the situation and know too little to have any wisdom about who does exactly what when. Also personally I distrust Netanyahu. </p>
      <p>But I would say this:  Hamas from its beginning declared war against Israel, and has prosecuted that war in an ineffectual but terrorizing way for many years. When Israel fights back trying to stop the rockets, and with some restraint but also a lot of horror and death, I think it rings hollow to complain about one-sided aggression. Hamas has asked for war by their continual attacks, and now they've got it, for the second time. Because of this background both the US <em>and European</em> governments have not been condemning Israel, though both have called for a cease-fire, which I devoutly wish happens soon.  </p>
      <p>I will leave it to more knowledgeable people to write the story of this battle, and to sort out the rights and wrongs, which I assure you are not just on one side. And I understand the fury of those on both sides who are losing and may lose friends and relatives, and their own lives. But please don't spout off from a distance when you have no idea of the situation.</p>
