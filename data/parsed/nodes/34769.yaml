    html: |-
      <p>As Butthead would say: "Hey, you're paying attention."  :-)</p>
      <p>It's nice to see an effort like this. But know that it's hard to pull off, not least in terms of getting it into an actual font as opposed to Photoshop images...</p>
      <p>Two-pixel stems seem to make sense above 14-15 ppem. You're at 16, but your x-height is pretty small, so you're pushing it a little bit, and some people will think it's too dark. On the other hand, some people will object to somewhat dark fonts all the time, so... The good news is that at that ppem (and even with a smallish x-height) you want 2 pixels of interletter spacing* and that will open things up. You might end up making a one-pixel weight as a companion (and it could actually serve for emphasis the way an italic does in print) but don't easily give up the darkness.</p>
      <p>* BTW, in bitmap fonts the spacing is very deeply woven into the black forms, so you really have to mind both in parallel, perhaps even more so than in outline fonts. In that way (and maybe otherwise, such as freeing the mind as to what's possible) starting off in type design on the bitmap side might actually be beneficial...</p>
      <p>Your lc structures are sound (the "y" is quite nice) and your vertical proportions are very good for text. Try to make your "v" and "w" narrower - maybe by making their bases two pixels. Your caps and your application of grays I would work on though. Concerning the former, I would try making the caps wider; concerning the latter: avoid "hanging" light grays - they might seem clever, but mostly they just add blur; try to have a lighter touch in places, like the bottom of the "g"; and don't be afraid of using more shades - eight is a decent palette. I do see you're trying to lighten things up by making half of the stems a lighter black! I've experimented with that, and I do think it can work (although your lighter black is a bit too dark) but since you say you're just starting I'd be more conservative and just make things solid for now. In fact I can tell you're trying to apply every single idea you've had (I know because I suffer from the same temptation) but such a utopian approach always backfires in type design...</p>
      <p>BTW, some people will tell you (sometimes through their silence...) that you're wasting your time making something like this. But to me, especially since OSX has gone the What<em>ever</em> route of font rendering something like this makes even more sense than before.</p>
      <p>hhp</p>
