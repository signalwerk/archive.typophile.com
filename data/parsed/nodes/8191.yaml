    html: <p>I am not sure how the quality of the scanned books will be, but hopefully good enough to evaluate if you want to make the effort to see the book in person. <br> <br>Upon further evaluation, print.google.com makes some sketchy implications... <br> <br>Q) Does Google keep track of the pages I'm viewing?  <br> <br>A) In order to enforce content viewing limits, we must keep track of page views by our users. However, we do not associate any of your searches, or the specific pages you view, with personally identifiable information about you, such as your name or address. <br> <br>Yet another thing to make me flip-flop back and forth about how I feel regarding new technologies... <br> <br>r.k</p>
