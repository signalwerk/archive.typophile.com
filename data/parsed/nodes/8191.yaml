    html: <p>dang, I am glad I don't ever have to go to Tahoe for three days. Come to think of it, it is probably good I never leave my cubicle. <br> <br>... <br> <br>I have no idea how this is going to work, but it sounds amazing. Presumably they are scanning the entire page, images and all, with the text being searchable. <br> <br><a href="http://print.google.com/googleprint/example_lg.gif" target="_blank">http://print.google.com/googleprint/example_lg.gif</a> <br> <br>I am wondering how you digitize 7 million books in 6 years "non-destructively." That is rather impressive.</p>
