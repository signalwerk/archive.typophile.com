      <p>Well, the face used in your example is a modified <a href="http://www.myfonts.com/fonts/agfa/monotype-corsiva/" rel="nofollow">Monotype Corsiva</a>. Similar faces include <a href="http://www.myfonts.com/fonts/linotype/itc-zapf-chancery/" rel="nofollow">Zapf Chancery</a> and <a href="http://www.myfonts.com/fonts/linotype/medici-script/" rel="nofollow">Medici Script</a>.</p>
      <p>None are free, but they are all reasonably priced.</p>
