      <p><cite>I don’t know why, but I have an uneasy feeling that your giving away your work is not a good idea.</cite></p>
      <p>Perhaps, perhaps.</p>
      <p><cite>Will you tell us about the curled shape?</cite></p>
      <p>That is the <a href="http://en.wikipedia.org/wiki/Koru" rel="nofollow">koru.</a> It is usually used thoughtlessly as a visual cliché to signify that something is "Maori", which is why I try to use it respectfully, or at least carefully! The geometry of the letterforms are inspired by the typographic style around WWII in Italy/Europe.</p>
      <p><cite>Sort of like what FF does but for Village instead? So especially if you are not keen spending the time massaging it - maybe a promotional font could be a good idea…</cite></p>
      <p>That is what I was thinking. It wouldn't take long to finish, and I'd like to give something back.</p>
      <p>—K</p>
