    <p>Hello folks,</p>
    <p>I made a few letterforms for a recent design job, a play about the Maori Battalion in Italy during WWII. A good friend suggested that I should finish up the basic character set and give it away free. I am happy to do this, but wonder if anyone would actually want it. Would you?</p>
    <p>—K</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/takirua_5659.gif"></div><p></p>
