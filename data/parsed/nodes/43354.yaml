    <p>I'm working on a logo, and I'd like to give it a chiseled or faceted look. The letter base is Zine Slab. I have Cabarge's book (Logo,Font &amp; Lettering Bible) and he suggests staring with a skeleton stroke then building from there using diamonds to create a faceted face.</p>
    <p>I was wondering if there are other styles or ways to do this? Since Zine has these nice thick slab serifs, the technique Cabarge gives doesn't really work, not to mention I don't have a skeleton stroke of the letter.</p>
    <p>Here is the base:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/FAST_3612.gif"></div><p></p>
