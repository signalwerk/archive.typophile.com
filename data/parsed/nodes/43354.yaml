    html: |-
      <p>the bottom A-S join seems to be missing a highlighted size (left side of the serif on the S like the top one).</p>
      <p>Also, if your light source is upper-left, you'd want to reverse the shadow/dark side on the mid-part of the S.</p>
      <p>But those are both 'technical' answer and, aesthetically, it seems to work just fine as-is.</p>
