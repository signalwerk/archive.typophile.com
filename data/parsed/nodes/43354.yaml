      <p>&gt;&gt;<br>
      Thanks to the other guys, but I usually don’t mix my logos with Photoshop (it’s a purist thing).<br>
      &lt;&lt;</p>
      <p>What are you using to do your logo?<br>
      CorelDraw has a feature to automatically add a chiseled look (Effects&gt;Bevel as shown at top of image), or if you want to draw the facets manually, you can convert your logo to a bitmap temporarily and use Corel's Centerline Trace feature to get the skeleton stroke as shown in bottom of image. [note the roughness of curves is only because I did this quickly, you could be as accurate as you'd like.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Graphic1_5722.jpg"></div><p></p>
