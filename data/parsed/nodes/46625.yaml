  html: |-
    <p>For all FontLab users out there who hate building numbered lists for FontLab encoding files, especially as glyph complements are getting bigger and bigger.</p>
    <p>We have just updated a tool that helps to manipulate text lists of glyph names. With it you can renumber a sequence of glyphs using a new text file of glyph names or an existing FL encoding file.</p>
    <p>The tool will pick out the first word of each line in the text file and re-apply the encoding sequence starting with the number you give. You can leave empty blocks or incorporate dummy sequences using the codes shown.</p>
    <p>WARNING<br>
    Never use it on a FontLab encoding file in the Encodings folder, always use a duplicate.</p>
    <p>It's not much but it helps us, so we are sharing it.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ScreenGrab_4177.jpg"></div><p></p>
    <p>Download the Mac Version <a href="http://www.dtptypes.co.uk/flencodings/FLencodingsMac.zip" rel="nofollow">here</a><br>
    Download the Windows version <a href="http://www.dtptypes.co.uk/flencodings/FLencodingsWin.zip" rel="nofollow">here</a><br>
    User:fluser<br>
    Password:flencodings</p>
    <p>All comments and suggestions are welcome at <a href="mailto:mail@dtptypes.com">mail@dtptypes.com</a> but please remember you use the software at your own risk.</p>
