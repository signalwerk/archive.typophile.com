  - id: 287172
    user: 3320
    date: 2008-07-02T06:31:00
    date_raw: 2 Jul 2008 — 6:31am
    votes: null
    html: |-
      <p>Goran</p>
      <p>It is a way to give a visual reference to different groups of glyphs.</p>
      <p>If like me, you work in FL with a 32 cell wide font grid, it is good to group glyphs in a similar pattern, e.g. Cap A-Z in cells 65-90 and smallcap a-z in cells 385-410, 10 rows down.</p>
      <p>It is, of course, just a personal preference.</p>
    html_clean: |-
