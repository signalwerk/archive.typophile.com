    html: <p>Arthur, I agree with you, Type1's need to have the encoding defined correctly to match the output, but with TrueType and OpenType the encoding scheme is just a convenient way of displaying the glyphs in a layout grid, which I find is quite important when working on fonts of many hundred glyphs.</p>
