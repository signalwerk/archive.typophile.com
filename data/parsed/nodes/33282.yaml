      <p>Ok I saw a Hull interview who said he did it but I guess they were wrong and telling a fib but Hull sometimes gets credit for being Mikita’s teammate and one of the first users. </p>
      <p><a href="http://www.iowastarshockey.com/newsandstats/pressreleases/index.html?article_id=400" title="http://www.iowastarshockey.com/newsandstats/pressreleases/index.html?article_id=400">http://www.iowastarshockey.com/newsandstats/pressreleases/index.html?art...</a></p>
      <p>say’s:</p>
      <p>As legend has it, one day at practice Mikita accidentally split the flat, straight blade of his hockey stick into a V-shape. Without pausing to change sticks, Mikita continued playing in the scrimmage. To his surprise, he found that he could rip off faster and harder shots with the crooked cudgel. Soon, he and Hull began using severely curved blades in games. Hull played with up to a one-and-a-half inch curve on his stick.</p>
      <p>p.s. I was looking through stuff and saw I had almost only the 6 NHL shirts...  (no toronto had one as a kid though)</p>
      <p>Boston (Black), Montreal (Red) , Chicago (Red), NY Rangers (White), Detroit (White no logo), also... Team Canada (white), Team Finland (Blue), Microsoft Windows 2000 Ronald McDonald Challenge (teal).</p>
