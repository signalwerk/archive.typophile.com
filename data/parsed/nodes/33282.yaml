      <p>“As the story goes Bobby Hull invented the curved ice hockey stic...”<br>
      Stan Mikita invented the curved stick. You dated yourself when you mention fiberclass getting in the way. A raw stick blade was boiled and then placed under a door with brick to adjust the curve, sometimes twice. Then shaping was done with a hand plane and then laces were wrapped around the handle and taping began. When you were done, unlike in the old days, you could now put a wrist-shot up someone’s nose from 4 feet away, and the race to make safe masks was on, enter Plante.</p>
