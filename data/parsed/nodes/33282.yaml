    <p></p><div class="imageWrap"><img src="/files/canucks_5408.jpg"></div><br>
    Rocking their 1971 logo, the Canucks knocked out the Dallas Stars in game 7, first round of the NHL playoffs.<br>
    Reviving the awesome original logo must have had something to do with it, as the Stars’ is somewhat cheesy. Star = A, get it? And Helveticaaaa... Always tough adapting second-hand goods (it made more sense when they were the Minnesota North Stars). I guess the name Oilers was already taken. However, the total-jersey interpretation is quite cool.<br>
