      <p>It was in 1992/93 when the DEG from Dusseldorf, Germany’s “Little Paris” became Champion in hockey.<br>
      5 matches in the play offs agaist Cologne.<br>
      Cologne and Dusseldorf are like dogs and cats - but only approx. 40 miles from each other.<br>
      The 4th match was in Cologne, but 6,000 fans stood _in front of_ the Dusseldorf stadium. There was nothing - no big video screen, nothing. The stadium was closed. But the police insisted to open it because the people were standing aroung on the streets in the traffic.<br>
      A stadium speaker told us details from the match. And they played the german hockey songs we all singing together. - We lost.</p>
      <p>The fifth and last match was in Dusseldorf.<br>
      John Peter Lee, Chris Valentine, Benoit Doucet.<br>
      They did it.<br>
      When Ben Doucet shot the 5:4 - he was close to God - we all were.<br>
      Champion. In my hometown. Against Cologne. This was magic, men...</p>
      <p></p><div class="imageWrap"><img src="/files/1_5255.gif"></div><p></p>
      <p>“Oh, Du wunderschöööne DE EEE GEEEE...<br>
      Du soooollst ewig Deutscher Meister seeiii hein...”</p>
      <p>Georg</p>
