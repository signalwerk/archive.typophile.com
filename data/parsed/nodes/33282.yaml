      <p>ok. Good old retro 70s Canucks logo, I had table hockey players with Canuck shirts like that, my original 2 teams where Montreal vs Toronto and they were metal but they started making flat plastic ones as well with stick on uni’s. I later bought a game with 3D players and painted them Boston Bruins vs Chicago Blackhawks. I still have that. </p>
      <p>Dallas has had professional ice hockey teams since at least 1945 and there is a well known rink in a mall in Dallas. Jim Gallagher when he was at Macromedia (Fontographer) use to play ice hockey in a Dallas men’s league.</p>
      <p> </p><div class="imageWrap"><img src="/files/smith_4346.jpg"></div><p></p>
      <p>I grew up playing ice hockey on ponds, rivers, flooded backyards and fields but when we got older and more competitive you had to play only indoors on rinks and never use your good skates on ponds since they aren’t smooth and have lots of twigs and sand in the ice. You can play the game anywhere there is refrigeration and aircon. I use to play at the old Sky Rink in Manhattan which was on something like the 17th floor, 33 between 10th and 11th. </p>
      <p>Go Canucks!</p>
      <p>p.s. As the story goes Bobby Hull invented the curved ice hockey stick when one day after practice he put his wet stick against a heater and it caused the blade to curve. I use to try to curve my own stick by soaking it then wrapping it with tin foil and putting it in the oven. This unfortunately makes the fibreglass tape on the blade come loose.</p>
