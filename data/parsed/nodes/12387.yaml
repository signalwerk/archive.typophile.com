  html: |-
    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Type Design</strong></p>
    <p>The craft of devising new versions of <a href="/wiki/alphabet" class="freelinking" rel="nofollow">alphabet</a>s for use in a <a href="/wiki/font" class="freelinking" rel="nofollow">font</a>.</p>
    <p>Type designers are sometimes mistakenly called fontographers. <a href="/wiki/Fontographer" class="freelinking" rel="nofollow">Fontographer</a> was the name of a popular computer program for designing type, predominantly used during the 1990s and early 2000s.</p>
    <p><strong>Relationship to typography.</strong></p>
    <p><a href="/wiki/Typography" class="freelinking" rel="nofollow">Typography</a> is the craft of using pre-made <a href="/wiki/alphabets" class="freelinking" rel="nofollow">alphabets</a> in designs, type design is the art of crafting new alphabets. Quite often one person occupies both roles, and specializes to a greater or lesser degree in one or the other.</p>
    <p>See also <a href="/wiki/How-To" class="freelinking" rel="nofollow">How-To</a></p>
