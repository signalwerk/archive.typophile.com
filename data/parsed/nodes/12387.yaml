  html: |-
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;: Type&nbsp;Design</strong></p>
    <p>The craft of devising new versions of <a href="/node/16847" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">alphabet</a>s for use in a <a href="/node/13544" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font</a>.</p>
    <p>Type designers are sometimes mistakenly called fontographers. <a href="/node/12024" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fontographer</a> was the name of a popular computer program for designing type, predominantly used during the 1990s and early&nbsp;2000s.</p>
    <p><strong>Relationship to&nbsp;typography.</strong></p>
    <p><a href="/node/12026" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typography</a> is the craft of using pre-made <a href="/node/12248" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Alphabets</a> in designs, type design is the art of crafting new alphabets. Quite often one person occupies both roles, and specializes to a greater or lesser degree in one or the&nbsp;other.</p>
    <p>See also <a href="/node/12369" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">How-To</a></p>
