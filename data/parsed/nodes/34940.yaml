    html: <p>The term egyptian appears to have come about to describe the original grotesques, which appeared during a period known as “Egyptomania” when the British were obsessed with all things Egyptian. At some later point the term became associated with slab serifs that were also popular during that period. If you search around you’ll find a thread started by Missgiggles in which James Mosely kindly dropped by to straighten this out.</p>
