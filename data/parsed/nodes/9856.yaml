    html: <p>It's based on an old typeface called Columbian, which Dan X. Solo calls <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0486999564/qid=1108498366/sr=8-1/ref=sr_8_xs_ap_i1_xgl14/102-3821586-5648153?v=glance&amp;s=books&amp;n=507846">Glorietta</a>, P22 calls <a href="http://www.myfonts.com/fonts/p22/victorian-swash/">Victorian Swash</a>, and Scriptorium calls <a href="http://www.myfonts.com/fonts/scriptorium/goodfellow/">Goodfellow</a>. Also found in freeware circles as "Burton's Nightmare" and "PS Bluegum Forest."</p>
