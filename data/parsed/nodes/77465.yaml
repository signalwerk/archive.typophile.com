    <p>I was sitting in the movies the other day, waiting for the movie to start, when Coke's new Christmas ad "Shake Up Christmas" came on.  The ad was cute, but what really grabbed my attention was the font they used at the end of the ad.  It was a slab serif font, but with the most beautiful rounded corners.  I tried searching for it on the net but wasn't successful.  I did manage to find the following though:</p>
    <p><img src="http://typophile.com/files/Coke_Christmas_Font_01.jpg"></p>
    <p><img src="http://typophile.com/files/Coke_Christmas_Font_02.jpg"></p>
    <p><img src="http://typophile.com/files/Coke_Christmas_Font_03.jpg"></p>
    <p><img src="http://typophile.com/files/Coke_Christmas_Font_04.jpg"></p>
    <p>I have a feeling that the font was designed by Coke for Coke, but hopefully I'm wrong.</p>
