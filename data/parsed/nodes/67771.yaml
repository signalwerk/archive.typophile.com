    html: |-
      <p>Semibold on reversed background: this is because of human perception. A regular font in reverse looks lighter than when viewed "normally". There is at least one font that comes with 'normal' and 'reverse' versions, where the to-be-used-in-reverse version is <em>ever so slightly</em> more bold than the regular variant. (Oh, brain! Come on! (thump, thump)... nope.)</p>
      <p>As to when to use what variant ... Whenever you like, I'd say. I can set a book title extra black and very small, or large and light ... or exactly the opposite. Whatever looks best. Period. (Generally speaking, a small bold title with a large black subtitle does <em>not</em> look good.)</p>
      <p>I think the numbering scheme was designed to work around made-up weight names -- i.e., "Semibold" or "Demibold"? "Regular" or "Medium" or "Book"? MS Windows <em>pretends</em> to use the numbered Weight for selecting an appropriate font, but actually it doesn't -- I always got Regular for a value around 500-ish and lower, and Bold for anything higher, and never a Light or Semibold or Black font. Mind, that's pre-Windows 7 -- word on the street is WPF has a better "fitting" algorithm, but I haven't used that as yet.</p>
