  html: |-
    <p>I've seen fonts use these kinds of variations:<br>
    ExtraLight<br>
    Light<br>
    SemiLight<br>
    Plain/Regular<br>
    SemiBold<br>
    Bold<br>
    ExtraBold<br>
    Black</p>
    <p>and I was curious when to use which. Now I've seen someone say to use SemiBold when using white on a black background. And of course I know to use Bold when trying to emphasize something or Light if its something that needs to be airy, of if the font-size is really huge, and perhaps Black if its something that really needs to stand out.</p>
    <p>Also I was curious about the number sizes I've seen also:<br>
    100 = ExtraLight<br>
    200<br>
    300<br>
    400<br>
    500<br>
    600<br>
    700<br>
    800<br>
    900 = Black</p>
    <p>Does 500 = regular?</p>
