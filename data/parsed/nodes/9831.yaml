    date: 2005-03-18T01:44:00
    date_raw: 18.Mar.2005 1.44am
    votes: null
    html: <p>The problem is, even an apparently perfectly geometrical typeface  <br>like <a href="http://www.fontshop.com/?fuseaction=catalog.fontdetail&amp;searchby=manufacturer&amp;displayfontid=LH.108008.0.3" target="_blank"> ITC Avant Garde Gothic</a> will have subtle optical adjustments,  <br>as without them the characters would just look plain wrong. A circle  <br>looks like an ellipse when it's a perfect circle, a join will fill up  <br>optically if there are no subtle ink traps and so on... <br> <br>Can there be <i>no optical corrections at all,</i> or is it OK if they're  <br>almost unnoticable?</p>
    html_clean: <p>The problem is, even an apparently perfectly geometrical typeface  <br>like <a href="http://www.fontshop.com/?fuseaction=catalog.fontdetail&amp;searchby=manufacturer&amp;displayfontid=LH.108008.0.3" target="_blank" class="link-external"> ITC Avant Garde Gothic</a> will have subtle optical adjustments,  <br>as without them the characters would just look plain wrong. A circle  <br>looks like an ellipse when it's a perfect circle, a join will fill up  <br>optically if there are no subtle ink traps and so on... <br> <br>Can there be <i>no optical corrections at all,</i> or is it OK if they're  <br>almost unnoticable?</p>
