    date: 2005-03-18T07:13:00
    date_raw: 18.Mar.2005 7.13am
    votes: null
    html: <p>Many geometric typefaces that use round, not oblong, or oval, counters can be found in <a href="http://bowfinprintworks.com/BauhausFaces.html" target="_blank">Part 1 of the Bauhaus-style Font ID Guide</a>. Since those are sometimes scans from older books, not all of them are in digital form, but many of them are.</p>
