    html: <p>The original DIN was designed to be just that. Digital interpretations are Isonorm by MecaNorma (also in the Adobe ollection) or Isonorm3098 by FontShop. There are more...  <br> <br><a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=FF.6908.0.0" target="_blank">http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=FF.6908.0.0</a></p>
