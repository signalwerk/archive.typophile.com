      <p><a class="freelinking external" href="http://www.kevinandamanda.com/fonts/" rel="nofollow">Fonts for Peas</a> by Kevin and Amanda could be an insteresting place for you. They have a lot of good scrapbooking/handwritten fonts.<br>
      FontLists at Fontshop: <a class="freelinking external" href="http://www.fontshop.com/fontlist/genres/handwriting_fonts_quick_natural_scrawling/" rel="nofollow">Quick Natural Scrawling</a>, <a class="freelinking external" href="http://www.fontshop.com/fontlist/genres/handwriting_fonts_legible_print/" rel="nofollow">Legible Print</a>, <a class="freelinking external" href="http://www.fontshop.com/fontlist/genres/handwriting_fonts_children/" rel="nofollow">Children</a><br>
      Some tags at MyFonts: <a class="freelinking external" href="http://www.myfonts.com/search/tag%3Ahandwriting/fonts/" rel="nofollow">Handwriting</a>, <a href="/wiki/%5Bhttp%3A/%252Fwww.myfonts.com/search/tag%253Ahandwritten/fonts/" class="freelinking" rel="nofollow">Handwritten</a>, <a class="freelinking external" href="http://www.myfonts.com/search/tag%3Ahand-drawn/fonts/" rel="nofollow">Hand-drawn</a><br>
      Some free places to look at: <a class="freelinking external" href="http://www.google.com/webfonts" rel="nofollow">Handwriting section at Google Web Font</a> (use filter on left), <a class="freelinking external" href="http://www.fontsquirrel.com/fonts/list/style/Handdrawn" rel="nofollow">Fontsquirrel Hand-drawn section</a><br>
      My selection: <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/suomi_type_foundry/suomi_hand_script_ot/" rel="nofollow">Suomi Hand Script</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/charlesborges/louisiana/" rel="nofollow">Louisiana</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/caflisch-script/" rel="nofollow">Caflisch</a></p>
