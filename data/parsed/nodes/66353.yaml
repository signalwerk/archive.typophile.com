      <p>That "g" is actually a compromise between the conventional form and what I consider ideal. Here's an early rough sketch (pardon the ugly ears) of the compromise process:</p>
      <p><a href="http://www.themicrofoundry.com/other/gs2.gif" title="http://www.themicrofoundry.com/other/gs2.gif">http://www.themicrofoundry.com/other/gs2.gif</a></p>
      <p>I'm a firm believer in the open-bottom binocular "g", even though it's difficult to make it sober - I wasn't going to compromise on that. I further feel that -ideally- in the bottom bowl the top should be thin and the thickest part should on the right (the lefthand form). However I conceded that it might make things too "pushy", and -with the encouragement of Roy Preston, who pointed out the "g" in the italic of Zapf International- decided to compromise with the conventional form (the righthand one); the end-result (the middle form) I'm very happy with.</p>
      <p>BTW, I'm actually fond of canine analogies in type. One of the parts of Nour&amp;Patria, the Latin subordinate of Nour, is code-named Harrier. Quadraat is a bloodhound. And Souvenir is a Golden Retriever.</p>
      <p>hhp</p>
