    <p>"Mac OSX users, please be aware that the operating system doesn't support kerning for PostScript flavoured OpenType fonts, also not for PostScript fonts. This is only for cocoa applications like Freehand, which rely on the operating system to provide kerning information instead of taking the information straight from the font. Some other applications, like InDesign do support kerning for PostScript Fonts."<br>
    --------</p>
