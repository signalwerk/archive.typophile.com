      <p>Actually the other way around: the "g" is already too divergent<br>
      from the rest (the closed-bottom binocular form for example is<br>
      topologically highly alien - almost like a Chinese logograph),<br>
      it needs more help belonging. There's little risk of it* becoming<br>
      too integrated - the rich descender and the ear take care of that.</p>
      <p>* I mean the binocular form. The monocular one is hopeless.</p>
      <p>hhp</p>
