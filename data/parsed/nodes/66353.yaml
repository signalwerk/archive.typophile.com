    html: |-
      <p>All this is not a precise science. I have ideas of which characters needs help in which ways. This includes considerations of divergence in the x-height region versus the extender space (think of the "s" versus the bottom of the "g"), what distracts a reader too much versus just enough, letterwise differentiation, and who knows what else. And not least in this complex, nebulous "equation" is what people expect. People react to the glyphs in a font; maybe not readers when faced with a text font, but designers choosing any font are certainly paying attention to individual glyphs. And I don't want a designer to say: «I'm not going to use Patria because of the "g".» So I make my "g", "s" and all the others just pushy enough; and I see my job -in part- as helping people in spite of themselves.</p>
      <p>This might seem anti-Design, but to me it's a higher level of Design (and maybe anti-Art, because it devalues what <em>I</em> want).</p>
      <p>hhp</p>
