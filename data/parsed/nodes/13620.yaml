  html: |-
    <p>fontBoy was launched in the summer of 1995 to manufacture and distribute fonts designed by <a href="/wiki/Bob%20Aufuldish" class="freelinking" rel="nofollow">Bob Aufuldish</a> and <a href="/wiki/Kathy%20Warinner" class="freelinking" rel="nofollow">Kathy Warinner</a> of the design office, Aufuldish &amp; Warinner. The foundry has released fonts ranging from the quirky and handmade to the geometrically precise. The current direction of fontBoy’s work incorporates more classical elements into the fonts. The designers try to stay focused on what interests them rather than trying to chase trends. Derided and celebrated as being part of the early 90’s grunge movement, the designers see themselves connected to the wide-open early 20th century version of modernism rather than the formulaic high modernism of the international style.</p>
    <p>Since its founding, fontBoy’s award-winning fonts have been published widely, included in: <a href="/wiki/Indie%20Fonts" class="freelinking" rel="nofollow">Indie Fonts</a> 1, Critique Magazine’s Big Crit, Graphis Digital Fonts 1, <a href="/wiki/Typology" class="freelinking" rel="nofollow">Typology</a>, by <a href="/wiki/Steven%20Heller" class="freelinking" rel="nofollow">Steven Heller</a> and <a href="/wiki/Louise%20Fili" class="freelinking" rel="nofollow">Louise Fili</a>, Extreme Fonts, by Spencer Drate, emotional_digital, by Alexander Branczyk, The Designer’s Guide to Web Type, and The Designer’s Guide to Symbol &amp; Icon Fonts Online.</p>
