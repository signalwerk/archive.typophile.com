      <p>What Hrant said.<br>
      It’s all about the thumbs.<br>
      Ergonomically, more margin is required at the side, and even more at the bottom, in order to support the book adequately while being read.<br>
      However, that’s a static idealization, whereas in practice the merit of book-reading is that one may ﬁdget, avoiding the unpleasant physical side-effects of catatonic pose. So it’s no problem to hold the object where one isn’t reading, after the manner of newspaper use. In fact, it could be argued that the newspaper format is responsible for undermining the traditional book proportions, entrenched as they had become over the centuries of its virtual monopoly.</p>
