      <p>Way, way, way back, as an apprentice comp. we were given quite a lot of "rules"; they weren't quite "Thou shalt not. . ." but they did often come quite close to it. And no-one ever bothered to explain to us where they came from.</p>
      <p>We were given margin ratios for "de-luxe", "normal" and "economy" margins. I forget them all but I think the "normal" was—in the order of backs, heads, foredge, tails—1.5, 2, 3, 4. Economy was less than this and de-luxe considerably more of course. As has been pointed out, this assumes traditional case-binding. This gave a spread in which the backs taken together, were roughly equal to the foredge and the heads about half of the tails, which is more or less what jacobsievers indicates in his illustration.</p>
      <p>It irritated me for years that publishers would use similar values for paperbacks, often resulting in the need to break the back of the book to get any kind of back margin at all. They do seem to be learning now however and it is far more usual than it used to be to see a generous back margin on paperbacks. Seems to have taken them a long time to learn though.</p>
