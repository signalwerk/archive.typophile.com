      <p>Hrant thanks for your thoughts. There are numerous factors that affect the design of the page geometry, including the functional ones you mentioned to the apocryphal ones related to golden ratios. </p>
      <p>Normally one would start from the font size and the paper size, work out a reasonable length for readability and then apportion  the margins unequally to the outer and inner margins.  Now this has a lot of inherent variability as readability is somehow vacuous and the number of characters in a line can vary from 55-80. This also brings cost into the equation as well. </p>
      <p>The bottom margin traditionally is made longer in order to hold the book at the bottom, although personally I always hold a book from its sides.</p>
