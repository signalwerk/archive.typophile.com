      <p>Tschichold's canons of page construction are historically related to an era where books were mostly hard-covered and would open flat; therefore, one designer could easily set a tight interior margin (and large exterior margins) without the risk of getting the lines of text too close to the spine. Nowadays, when books are bound in paperback-like covers or, in the digital printing world, glued and milled, those margins proportions are harder to apply, althought Tschichold's micro-typography prescriptions (and the golden ratio book form proportion) are, in my opinion, still very useful.</p>
      <p>A common norm in designing a book page, anyway, is to set the bottom margin broader than the others; I would set the left and right margins with the same size and the upper margin just slightly smaller. This way, when the book is bound, you will have the impression that the golden ratio approach is somehow respected.</p>
    html_clean: |-
