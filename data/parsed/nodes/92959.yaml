      <p>As the real gives ways to the virtual, the conditions which dictated traditional book design lose their relevance.</p>
      <p>Of necessity, actual books are read in two-page spreads and have gutters. Thus, traditional book design employed mirror symmetry and allowance for creep, neither of which need to considered in the design of a one-page-at-a-time ebook. The only real holdover is a larger margin at the bottom of the page, posited on the optical, rather than the geometric center of the page.</p>
