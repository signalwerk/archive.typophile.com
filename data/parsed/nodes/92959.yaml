      <p>OldNick: "The iPad two-page spread “solution” is a nod to dead-tree book purists, but it’s just algorithmic fakery."</p>
      <p>While the image details may be algorithmic fakery, the overall format is a nod to readability and human factors. You wouldn't want lines of text to be ten inches long. There is ample research and evidence related to optimum line length, single-glance capture, minimization of left-right eye focus, etc. </p>
      <p>The readability effect could have been achieved with multiple columns instead of dual pages, but the implemented solution is both more familiar and technically easier.</p>
