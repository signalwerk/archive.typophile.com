    html: <p>Easier and faster for late-antique scribes to write. Later, Charlemagne thought that it was a good idea. The rest is history (oh yeah, Cosimo di Medici and the humanists had a hand in codifing it, too). <br> <br>Not all writing sytstems have multiple cases, though.</p>
