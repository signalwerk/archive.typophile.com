    <p><a href="http://www.thessalonica.org.ru/en/fonts.html" title="http://www.thessalonica.org.ru/en/fonts.html">http://www.thessalonica.org.ru/en/fonts.html</a></p>
    <p>Does anyone have any opinions about this OFL licensed font? I really like it because it strongly reminds me of the typeface used in many ethnographic and linguistic books published by the Smithsonian Bureau of American Ethnology. I searched around and couldn’t find any serious discussions of it, so I’m curious what you experts here think.</p>
    <p>My greatest complaint is that the mathematical operators and arrows are all very oversized in comparison to the other glyphs. This is however somewhat in keeping with 19th and early 20th century mathematical books that I’ve looked at, where the mathematical symbols are clearly not related to the typeface, but are probably a case of sorts that are mixed in with any other random face in use. For serious use however, I would like to see all the mathematical symbols, even the plebian + and =, scaled down to something more reasonable. Because it’s OFL licensed I’m tempted to do so, but I always seem to have something more important to do with my time.</p>
    <p>I think all this family needs is a good set of superiors and inferiors and a set of small caps, and it’s ready for serious use. The bold and bold italic need to be designed at some point, but they’re not necessary for book work if section and chapter headings are done in some other compatible face.</p>
