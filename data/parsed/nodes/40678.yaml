      <p>Old Standard is similar to Computer Modern (used in TeX), having come from the same type traditions.  I think that's why there isn't a strong desire to use its mathematics characters.</p>
      <p>I like Old Standard, though, and find it has a bit more "old style elegance" than Computer Modern.  I hope that people use it more.</p>
