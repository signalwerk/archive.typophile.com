    html: '<p>FontExplorer builds two files: (1) just the raw database of fonts in a file located in Application Support/Linotype (FontExplorer X.fexdb), and (2) user "sets" and custom classifications, etc, in a file located in Preferences (com.linotype.FontExplorerX). You will need to restore these two files so as to recreate your sets and custom classifications, etc. Note, if you at any time do a clean install and locate your non-system fonts to any other location, you will need to use a (free) database program to edit .fexdb file (sqlitestudio found here: <a href="https://sqlitestudio.pl/index.rvt">https://sqlitestudio.pl/index.rvt</a>). Hope this helps.</p>'
