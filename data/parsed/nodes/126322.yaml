    <p>Hello,</p>
    <p>Not sure if this is the place for a question like this, but I am having a very annoying problem with FontExplorer X Pro. I have reinstalled OS X<br>
    on my MacBook Pro as a clean install, using no time machine. In moving the previous fonts back onto my HD, I also brought over the previous<br>
    'FontExplorer X.fexdb' file so I can still keep my sets from before. From what I have researched, my sets should then be restored as 'missing'<br>
    and in the 'Conflicts' panel I am to locate the files. I have had no such luck.</p>
    <p>The 'Current Path' of the fonts also vary. I have managed resolve a few of them but only family by family at best.. and the ones that have a<br>
    'Current Path' that differs too much from where the files are now located don't work at all. When I click 'Apply' the text field goes blank. Also,<br>
    many of the system fonts are 'missing'.</p>
    <p>My question is mainly with the 'Conflict' panel and how to mass resolve conflicts!! Everywhere I read, people make it seem easy like all I have<br>
    to do is 'replace path component: type Users/oldusername/ then in all selected fonts with: type User/newusername/'</p>
    <p>I did this and nothing happens. Possibly because some of those fonts are system fonts and 1 layer above /Users in /Library?</p>
    <p>I just have no clue.. this is starting to feel immensely hopeless and depressing.. please help..</p>
