  html: <p>I apologize for the cross post with the FontLab Forum.  <br> <br>On page 404 of the manual it says you can browse through preview strings in the metrics window using Cmd-PgDn + PgUp. Does this work for anyone?  <br> <br>How do you preview strings of text? <br> <br>I'm on OS9.2 with FL 4.5.1 <br> <br>Thanks, <br>Eric O.</p>
  html_clean: <p>I apologize for the cross post with the FontLab Forum.  <br> <br>On page 404 of the manual it says you can browse through preview strings in the metrics window using Cmd-PgDn + PgUp. Does this work for anyone?  <br> <br>How do you preview strings of text? <br> <br>I'm on OS9.2 with FL 4.5.1 <br> <br>Thanks, <br>Eric O.</p>
