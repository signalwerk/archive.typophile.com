    html: |-
      <p>In its current state, I don’t think this is very successful. Chopping off the leg of the R and the bottom of the F to make room for “Australia” feels arbitrary, rather than clever. (Sorry, Kat, I don’t see a fin.) The area where the leg of the R leaves the bowl is  too thick.</p>
      <p>The curves of the S are lumpy, and don’t match the R and F very well. The U is too wide — its big, open shape dominates the logo.</p>
      <p>Consider slanting “Australia” (in a more contemporary face, as Vanina suggests) to match the angle of SURF. And you might add a bit more weight overall; the whole thing feels a little spindly.</p>
    html_clean: |-
