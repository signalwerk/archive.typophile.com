    <p>Hi all</p>
    <p>Wanted to gauge reactions to this work-in-progress, for a logo design for a surfing magazine. </p>
    <p>The target demographic is 6-16 year olds, male and female, with a view to (strapline) promote grassroots surfing in Australia.</p>
    <p>It’s a redrawn Riptcure font for the logo, and for all other type  I’m using Gill Sans.</p>
    <p>Toying with the idea of a serif to contrast against Gill - that’s also very contemporary - any thoughts?</p>
    <p>Thanks!</p>
