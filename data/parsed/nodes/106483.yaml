  html: |-
    <p>In typeface design the conscious appeal of even color is subtly broken to deliver subconscious functionality.</p>
    <p>At a basic level this breaking is done unwittingly via the idiosyncrasies of compositional methods, such as a physical marking tools or geometric constructs.</p>
    <p>At a higher level this breaking is done deliberately via a manipulation of the black-and-white bodies, and ideally the system of such.</p>
    <p>At a still higher level this breaking is done via a judicious redesign of the writing system itself.</p>
    <p>hhp</p>
