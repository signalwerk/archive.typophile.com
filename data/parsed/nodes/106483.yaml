      <p>As usual when you cite the 'subconscious', my response is 'Prove it'. But I'll let you off this time, because I think it is more important to cite <a href="http://psych.nyu.edu/pelli/pubs/majaj2002channel.pdf" rel="nofollow">Pelli et al 2002</a> [PDF], which to my mind is the most important study yet done in its contribution to our understanding of 'even colour' (I prefer the term even texture) and its <em>functional</em> rôle in reading. Critically, the concept of spatial frequency channels defines limits within which variations in typographic texture may operate <em>without impeding reading by forcing channel retuning.</em> This statement from the study's conclusion is worth re-reading several times:</p>
      <blockquote><p>For each alphabet, font, and size, letter identification is mediated by a single one-or-two-octave-wide visual channel. Even in the presence of very asymmetric noise distributions, observers continue using the same channel to identify and detect letters and gratings. Together, these two findings say that the channel is selected bottom-up by the signal, not top-down by the observer.</p></blockquote>
      <p>There are some <a href="http://www.yorku.ca/eye/spafreq.htm" rel="nofollow">simple perceptual tests</a> than one can do to confirm that tuning from one spatial frequency channel to another takes time. Ergo, if text involves too great a span of spatial frequencies, reading will be impeded by the need to re-tune. So, it seems to me that even texture in the sense of letters occupying the same spatial frequency channel, is functionally beneficial to reading, while your 'breaking of even colour' is so far without demonstrated benefit.</p>
