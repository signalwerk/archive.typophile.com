    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : End User License Agreement (EULA)</strong></p>
    <p>A legal document that outlines the licensing terms for a particular software. These terms usually list the manners in which the software may or may not be used. In regard to fonts, there are several common topics that <a href="/wiki/foundries" class="freelinking" rel="nofollow">foundries</a> must consider allowing or disallowing. Among these are: Number of Output devices covered by license, server installation, back-up copies, embedding, distribution to a service bureau, modifications, transfer of license, &amp;c.</p>
    <p>For a detailed understanding of the issues surrounding EULAs for fonts, read <a href="/wiki/Tiffany%20Wardle" class="freelinking" rel="nofollow">Tiffany Wardle</a>'s article <a href="http://fontlab.wikidev.net/The_Case_for_a_User-Friendly_EULA" rel="nofollow"><em>The Case for a User Friendly EULA</em></a>.<br>
    <a href="/wiki/EULA%20chart" class="freelinking" rel="nofollow">EULA chart</a></p>
    <p><strong>Discussion:</strong><br>
    For an in-depth discussion of issues, read <a href="http://typophile.com/node/14264" rel="nofollow">The End User's Manifesto!</a><br>
    For a real-life case study, read <a href="http://typophile.com/node/14718" rel="nofollow">Alternative to Fedra Serif B</a><br>
    <a href="http://typophile.com/node/19378" rel="nofollow">Because of a Eula, I need something different</a><br>
    <a href="http://typophile.com/node/19393" rel="nofollow">EULAs--the Devil's Advocate</a><br>
    <a href="http://typophile.com/node/28852" rel="nofollow">Need Help with an EULA</a><br>
    <a href="http://typophile.com/node/100259" rel="nofollow">Petition for a sane EULA</a></p>
    <p><strong>Links:</strong><br>
    <a href="http://fontlab.wikidev.net/" rel="nofollow">EULA abstract website</a><br>
    <a href="http://eeulaa.org/" rel="nofollow">Electronic EULA Abstract</a></p>
    <p><strong>Permissive EULAs:</strong></p>
    <p>The standard EULA allows modifications for personal use:<br>
    <a href="https://monokrom.no/" rel="nofollow">Monokrom EULA</a><br>
    <a href="http://www.shinntype.com/" rel="nofollow">Shinntype EULA</a></p>
    <p>The standard EULA allows embedding in commercial PDFs and modifications for personal use:<br>
    <a href="http://www.adobe.com/" rel="nofollow">Adobe EULA (for some fonts)</a></p>
