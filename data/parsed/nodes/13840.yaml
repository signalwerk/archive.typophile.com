  html: |-
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;: End User License Agreement (<span class="caps">EULA</span>)</strong></p>
    <p>A legal document that outlines the licensing terms for a particular software. These terms usually list the manners in which the software may or may not be used. In regard to fonts, there are several common topics that <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a> must consider allowing or disallowing. Among these are: Number of Output devices covered by license, server installation, back-up copies, embedding, distribution to a service bureau, modifications, transfer of license,&nbsp;&amp;c.</p>
    <p>For a detailed understanding of the issues surrounding <span class="caps">EULA</span>s for fonts, read <a href="/node/13842" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Tiffany Wardle</a>’s article <a href="http://fontlab.wikidev.net/The_Case_for_a_User-Friendly_EULA"><em>The Case for a User Friendly <span class="caps">EULA</span></em></a>.<br><a href="/node/33667" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">EULA</span>&nbsp;chart</a></p>
    <p><strong>Discussion:</strong><br>
    For an in-depth discussion of issues, read <a href="http://typophile.com/node/14264">The End User’s Manifesto!</a><br>
    For a real-life case study, read <a href="http://typophile.com/node/14718">Alternative to Fedra Serif B</a><br><a href="http://typophile.com/node/19378">Because of a Eula, I need something different</a><br><a href="http://typophile.com/node/19393"><span class="caps">EULA</span>s–the Devil’s Advocate</a><br><a href="http://typophile.com/node/28852">Need Help with an <span class="caps">EULA</span></a><br><a href="http://typophile.com/node/100259">Petition for a sane <span class="caps">EULA</span></a></p>
    <p><strong>Links:</strong><br><a href="http://fontlab.wikidev.net/"><span class="caps">EULA</span> abstract website</a><br><a href="http://eeulaa.org/">Electronic <span class="caps">EULA</span>&nbsp;Abstract</a></p>
    <p><strong>Permissive <span class="caps">EULA</span>s:</strong></p>
    <p>The standard <span class="caps">EULA</span> allows modifications for personal use:<br><a href="https://monokrom.no/">Monokrom <span class="caps">EULA</span></a><br><a href="http://www.shinntype.com/">Shinntype <span class="caps">EULA</span></a></p>
    <p>The standard <span class="caps">EULA</span> allows embedding in commercial <span class="caps">PDF</span>s and modifications for personal use:<br><a href="http://www.adobe.com/">Adobe <span class="caps">EULA</span> (for some&nbsp;fonts)</a></p>
