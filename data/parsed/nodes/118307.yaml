  html: |-
    <p>I always disliked the Georgia font because of its old-style numerals. Not any more. I just discovered the advanced font ligatures in Office. Office 2010 and 2013 now includes advanced typographical features. The OpenType features gives you the option to change number spacing to 'tabular' and the number forms to 'lining'.  See this link for instructions: <a href="http://www.howtogeek.com/howto/13484/use-advanced-font-ligatures-in-office-2010/" title="http://www.howtogeek.com/howto/13484/use-advanced-font-ligatures-in-office-2010/">http://www.howtogeek.com/howto/13484/use-advanced-font-ligatures-in-offi...</a></p>
    <p>Now I can use Georgia without being annoyed with the old-style numerals (see attachment). Thank you Microsoft!</p>
    <p>Who else likes these new Microsoft Office OpenType features?</p>
