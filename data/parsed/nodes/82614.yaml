      <p>@Seba: Is this work personal, professional or academic? If it is academic, where do you study, who are your faculty and what it the purpose of the project?</p>
      <p>You will probably have to start with a broader search on Scandinavian design in general:</p>
      <p><a href="http://en.wikipedia.org/wiki/Scandinavian_design" title="http://en.wikipedia.org/wiki/Scandinavian_design">http://en.wikipedia.org/wiki/Scandinavian_design</a></p>
      <p>As well as Scandinavian graphic design history:</p>
      <p><a href="http://www.google.ca/search?q=scandinavian+graphic+design+history&amp;ie=utf-8&amp;oe=utf-8&amp;aq=t&amp;rls=org.mozilla:en-US:official&amp;client=firefox-a" title="http://www.google.ca/search?q=scandinavian+graphic+design+history&amp;ie=utf-8&amp;oe=utf-8&amp;aq=t&amp;rls=org.mozilla:en-US:official&amp;client=firefox-a">http://www.google.ca/search?q=scandinavian+graphic+design+history&amp;ie=utf...</a></p>
      <p>Looks like there are few really good books there. I’m confidant that your professor(s) would be able to direct you to a source for them. From there, you will be able to develop a greater sense of culture, history, politics and philosophy behind their work (including industrial, architectural &amp;c). There should be more than enough material there to develop a sense of typographic flavour.</p>
      <p>See also:</p>
      <p><a href="http://www.1stwebdesigner.com/design/worldwide-graphic-design-2/" title="http://www.1stwebdesigner.com/design/worldwide-graphic-design-2/">http://www.1stwebdesigner.com/design/worldwide-graphic-design-2/</a></p>
      <p>You will most likely need to narrow your research to a specific time period.</p>
