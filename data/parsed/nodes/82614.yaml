      <p>First of all, thank you so much everyone for taking the time to reply. Great links and very interesting read. I'm going through one by one as we speak. Once again, thank you.</p>
      <p>@Christopher Dean<br>
      Must be my poor English comprehension that makes me sound so young :)<br>
      I'm close to my 40s, and this is just pure personal interest. I suspect you won't care much for the details, or a long read, so I try to make it quick.</p>
      <p>Polish born, living in Malaysia - Kuala Lumpur for past 18 years. I'm a (reluctant to use the word here) "designer". I worked with Macromedia for many years, before it was absorbed by Adobe, and my specialty has been Flash design, an interactive content, since Flash's incarnation in 1996.</p>
      <p>I don't usually deal with typography, as most of my clients are from automotive industry, and they have custom made, or certain standard typeface I'm provided with, along with guideline manuals on how to use it. I only put things together and make it interesting for the visitor to explore. But I love looking at text and I find it fascinating. I don't know whether you could call it a "gut feeling", but whenever I see text, I can tell whether it works on not. Perhaps some basic design taste and common sense? Recently I was part of a team working on Mercedes project under Swedish agency. I spent some time there, and while being so close, I stop by Denmark to say hello to my favorite pipe maker. I was amazed with some really great looking typefaces used all around town, from banks to public transport, signage etc... It's not a typeface I come across often, but many of them seem to be quite similar to each other. As if they follow some certain source and were built based on that.</p>
      <p>Right now I'm doing some work for Malaysian property developer. Online application, mobile smart home (on/off air-con from your iPhone etc...) and website. Their branding designer is very local. Don't mean that in negative way, but given Malaysia is made of Malays (Muslims), Indians and Chinese, there is very strong tendency to use cursive fonts for everything. The Arabic, Tamil and Chinese influence, results in Papyrus, Comis Sans or Lucida being the primary choice. To the contrary, the developer aims at the young generation, and all his projects are very modern, minimalist, Scandinavian design inspired. Hence I find the use of Papyrus to be a really bad call, and I'm doing research, trying to find more suitable typeface for that kind of design he does, as substitute to what they have so far.<br>
      I couldn't stress enough how important is to hire professional to do that job, but the mentality in here is very different and branding is never on priority list. I feel guilty and obligated to help, to make best out of it and at least find something that doesn't read the property name in Papyrus :) The least I can do.</p>
      <p>I would welcome very much your suggestions or links where I could read a little more about typeface suitable for this particular job. </p>
      <p>Sorry for the long read, and again, thank you all so very much for such valuable input. Appreciate, and I do mean it.</p>
      <p>regards from Papyrus, Comic Sans land...<br>
      Sebastian</p>
