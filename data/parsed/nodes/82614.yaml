    <p>Google is my best friend, I know. But I had not much luck trying to find out what are the preferred fonts for the Scandinavians. I end up reading about Vikings or rotten shark delicacy. Perhaps my key words are not creative enough.</p>
    <p>Every country has some preferred font that you would recognize it by. Like for example Germany is full of DIN family fonts. From railway stations to administration building, road signs or car number plates. Are there any typefaces that are very Denmark or Swedish ? </p>
    <p>Thank you for taking the time to read it.<br>
    And appreciate your feedback</p>
    <p>regards</p>
    <p>Sebastian</p>
