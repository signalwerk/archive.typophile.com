  html: |-
    <p>Hi,</p>
    <p>I’m trying to find a good solution for setting type (place names etc.) over satellite photographs. The examples I’ve seen either have the type set in yellow or outlined in a contrasting colour. Neither of these methods seem particularly fantastic to me, so I’d appreciate any ideas for methods and/or typefaces.</p>
    <p>Thanks,<br>
    Richard</p>
