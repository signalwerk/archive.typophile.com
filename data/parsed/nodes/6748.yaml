    html: <p>Designers are to our information age what engineers were to the age of steam, what scientists were to the age of reason. They set the mood of the mental environment. They create the envy and desire that fuels the economy and cynicism that underlies our postmodern condition. <br> <br>Kalle Lasn, Director of the Media Foundation, from Adbusters, 1999. <br> <br>----------------------- <br> <br>I'd like to see more debate about off topic stuff on typophile, designers should have opinions.</p>
