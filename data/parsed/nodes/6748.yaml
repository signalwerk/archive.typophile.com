    html: <p>I go off-topic more than average (and usually in a certain known direction...) but I still have to state that focus is important, and so is self-discipline. Nothing exists in a vacuum, and I tend to link everything together* and enjoy discussing the contexts of things. On the other hand, since we're not Ancient Greek philosophers in togas, and we want to actually <i>make</i> stuff, we do need to respect the fact that nobody can grasp and discuss everything, and trying to do so is counterproductive and ultimately does not make [most] people happy. <br> <br>* Even tenuous things. I recently justified my interest in reviving a lost authenticity to Cyrillic partly by noting that Russia and Armenia conduct joint military exercises. Everybody is responsible for everything, just to different degrees. <br> <br>hhp</p>
