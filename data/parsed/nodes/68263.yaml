    <p>Hello,<br>
    <a href="http://vimeo.com/9686565">Lemon Press</a> is a video created by students in <a href="http://tannerwoodford.com/syllabus/2010s">Advanced Media</a>, a course in the <a href="http://design.asu.edu/sdi/">School of Design Innovation</a> at <a href="http://www.asu.edu">Arizona State University</a>. For more context on this work-in-progress, <a href="http://typophile.com/node/68269">see other videos from this class</a> or <a href="http://tannerwoodford.com/syllabus/2010s/1.html">read the official project description on the course syllabus</a>. The video was produced by Patrick Clark, Huilin Dai, Maria Ionova, Brandon Mah, Matthew Mang, Forrest Nutter, Arnon Vasunirachorn and Nicholas Winter.</p>
    <p><a href="http://vimeo.com/9686565">http://vimeo.com/9686565</a></p>
    <object width="601" height="338"><param name="allowfullscreen" value="true"><param name="allowscriptaccess" value="always"><param name="movie" value="http://vimeo.com/moogaloop.swf?clip_id=9686565&amp;server=vimeo.com&amp;show_title=1&amp;show_byline=1&amp;show_portrait=0&amp;color=00ADEF&amp;fullscreen=1"><embed src="http://vimeo.com/moogaloop.swf?clip_id=9686565&amp;server=vimeo.com&amp;show_title=1&amp;show_byline=1&amp;show_portrait=0&amp;color=00ADEF&amp;fullscreen=1" type="application/x-shockwave-flash" allowfullscreen="true" allowscriptaccess="always" width="601" height="338"></object><p><a href="http://vimeo.com/9686565">Lemon Press</a> from <a href="http://vimeo.com/matthewmang">Matthew Mang</a> on <a href="http://vimeo.com">Vimeo</a>.</p>
    <p>We look forward your feedback.<br>
    Thank you.</p>
