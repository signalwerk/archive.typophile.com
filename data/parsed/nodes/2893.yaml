  html: <p>There's a camp send-up of old sci-fi films coming out, called <a href="http://www.apple.com/trailers/sony_pictures/lost_skeleton/">The Lost Skeleton of Cadavra</a>. They do a very convincing job of mimicking the typography and effects of the time in the trailer. It also looks pretty funny.</p>
