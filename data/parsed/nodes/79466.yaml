  html: |-
    <p>Another newsletter and another CheapProFonts newcomer: David Kerkhoff is an up-and-coming type designer specializing in handmade and grungy written scripts - some of which are destined for our usual multilingual treatment.</p>
    <p>Please enjoy this bunch of recently released quality fonts - all available at our usual low price of only $10 each! :)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CheapProFonts-NEWS-11-01_5318.jpg"></div><p></p>
    <p>In this news release I present 14 fonts:<br>
    - a 6-face family from Jan Paul &amp; Brian Kent<br>
    - 2 grunge fonts from Guillaume Séguin<br>
    - 2 display fonts from Vic Fieger<br>
    - 1 handwriting from Kimberly Geswein<br>
    - 1 geometric font from Levente Halmos<br>
    - 1 handwriting font from David Kerkhoff<br>
    - and a version of DIN Mittelschrift digitized by myself - I have made it primarily because I wanted to have a bit of fun with it by experimenting with giving it some very different expressions far removed from its serious and no-nonsense roots. Watch this space!<br>
    (or check out the first variants already released on our website ;)</p>
    <p>Like the idea behind CheapProFonts? Like our selection of multilingual fonts? Like our friendly and reasonable licensing? Like us to inform you about every new font? Like us! :)<br>
    Our <a class="freelinking external" href="http://www.facebook.com/pages/CheapProFonts/216135682084/" rel="nofollow">Facebook page</a> and <a class="freelinking external" href="http://twitter.com/CheapProFonts" rel="nofollow">Twitter feed</a> updates with every single release!</p>
    <p>Roger S. Nelsson<br>
    --<br>
    <a href="http://www.CheapProFonts.com" title="http://www.CheapProFonts.com">http://www.CheapProFonts.com</a><br>
    High quality multilingual fonts at a low price - for professional (non-english) designers with a small budget!</p>
