      <p>Thanks for your interests.<br>
      "They do exist for the condensed fonts:"<br>
      in 1989-1990 when those were developed, ITC had a standard glyph set produced by URW, who did ITC's production and they did ITC Franklin Gothic's final production.<br>
      in the recent ITC Franklin development I had the final say over glyphs and, agreeing with Mr. Puckett,  I don't like os figures in gothic faces. </p>
      <p>"...but I’m confused about which to buy."<br>
      How do you plan on using it?</p>
      <p>cheers!</p>
