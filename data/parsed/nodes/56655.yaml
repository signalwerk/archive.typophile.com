    html: |-
      <p><cite>…for some reason, no one has ever seen fit to design these…</cite></p>
      <p>It’s not easy to come up with good OSFs that work with gothics because the originals were designed with no intention of appearing alongside old style figures. When those big figures are squooshed down to work with the short descenders the result is not pleasant to look at, which makes them look especially out of place in a style of type where one almost never sees them to begin with.</p>
