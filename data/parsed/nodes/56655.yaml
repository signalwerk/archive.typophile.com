    html: |-
      <p>David Berlow recently did a complete revision called now <a class="freelinking external" href="http://www.fontbureau.com/fonts/ITCFranklin" rel="nofollow">ITC Franklin</a>. It is more consistent and harmonized throughout. The Pro version does not have oldstyle numbers, however (for some reason, no one has ever seen fit to design these), but it does have fractions, superiors, inferiors, and a cool unicase stylistic set.</p>
      <p>Available from both Font Bureau and ITC (plus all their resellers) in a variety of packages, or a la carte.</p>
      <p>-- K.</p>
