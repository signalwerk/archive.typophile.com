    html: <p>Well the typeface is ChollaSlabBold. ;) <br> <br>There's something nice about the idea of "melding", "joining" and "fusing" in regards to electricians. And the fact that they "channel" the information is along similar lines. Electrician weld and solder. When we pass or share information we become joined together. I can see this happening in your ligs. Maybe it would be a little too tricky (?) but I would be curious if you could "solder" all the letter together.</p>
