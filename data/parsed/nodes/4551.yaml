    html: <p>Kewl, interesting suggestions. My idea was to go with  <br>the top design too. I'll tighten up the whole thing and  <br>see what it looks like. <br> <br><i>&gt; Ligate the topmost (left) serif on the N with a reverse  <br>taper to the C.</i> <br>Heh, we've got a mindreader in our midst. I felt like  <br>doing that but hesitated because I feared it would harm  <br>the readability of the word. I think I will have a go at it. <br> <br><i>&gt; I love ligation, but you might have a problem with  <br>that "no" standing out - negative vibes.</i> <br>It's a bitch innit? That's why I started out with extending  <br>the tail on the "n", not only to achieve a symmetrical flip  <br>effect but also to counter that problem. Maybe connecting  <br>the "c" with the "n" might de-emphasize that. Also keep in  <br>mind this is for a non-English speaking target audience. <br> <br><i>&gt; This is pretty strong stand alone type</i></p>
