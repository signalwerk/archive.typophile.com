    html: <p>Almost there. I wanna thank everyone for their insights, as this  <br>has helped me get the job done in about half the time (usually  <br>I let each intermediary stage of a logo rest for a while to be able  <br>to evaluate it with a fresh eye). <br> <br>I slightly narrowed the "e"s and tightened up the "cn" ligature.  <br>Last thing to decide on is which stand-alone sign to present to  <br>the client (I'll save the other three as a back-up in case said  <br>client is not completely satisfied). Nr. 2 is a quite literal lift from  <br>the word mark, nrs. 1 and 3 are "melded" as per Tiff's suggestion  <br>and nr. 4 is the most instantly recognizable. Whaddayathink? <br> <br><img src="http://www.typophile.com/forums/messages/29/35064.gif" alt=""></p>
