  html: "<p>Hi everyone, <br> <br>I'm currently developping a logo for an association that gathers and  <br>channels information about new technologies and techniques to their  <br>affiliated electricians. <br> <br>I started with the typography (the fun part) as the rhythm of the name  <br>was very inviting (I'll be adding an image or symbol to it later on}. <br>One of the versions is a customized typeface, and I have three levels  <br>of customization. I think I know which one to use, but am curious what  <br>you guys think of it. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/34772.gif\" alt=\"type treatment\"> <br> <br>PS: I wouldn't be me if I didn't add: \"Extra points for who can guess which typeface!\" <img src=\"http://www.typophile.com/forums/clipart/bigsmile.gif\" border=\"0\"></p>"
