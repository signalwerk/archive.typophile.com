      <p>I'm not actively involved in spec'ing paper for any books these days, so I don't have any current or specific information. </p>
      <p>The information for overseas papers was never that specific anyway. Each printer had a selection of stock on the floor that I had to choose from. Things like "100gsm matte white -- Japan." I'm sure they would regularly change suppliers without indicating. So, the only thing to do would be to order up a dummy.</p>
      <p>Or really, you should be able to do a check on a single sheet. Just fold it in half and check the crease.</p>
      <p>-- K.</p>
