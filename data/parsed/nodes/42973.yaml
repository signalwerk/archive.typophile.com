    html: |-
      <p>This color resonance is a quality that I've noticed in papers before when selecting stock for books. I can't explain it, but it is something that I often check in the gutter of dummies before settling on a stock. I've always imagined it as an effect similar to the acoustics of some rooms where certain frequencies can get noticeably enhanced. </p>
      <p>For instance, there are some [white] matte-coated stocks from China that give off a very distinct blue-purple glow. I generally avoid these for projects where the predominant color scheme or the character of the photography is warm. </p>
      <p>-- K.</p>
