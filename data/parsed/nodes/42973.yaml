    <p>I am currently trying to identify a paper used in a book I own. The book is a 1971 reprint of Gibran's <em>The Prophet</em> published by Knopf. The paper is a rich peachy coloured laid paper which is quite smooth on one side. It has a peculiar characteristic that the shadow toward the spine of the book, where the pages come together, turns pink rather than grey, as it does on most other papers. It is quite a nice effect.</p>
    <p>I attached scans of either side of the paper, despite the fact that it likely won't help much as colors change so much from screen to screen. However, if someone out there has seen this book and knows which paper it is, or knows of a paper with a similar magical colour effects, I would be very grateful!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/peach_paper_3593.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/peach_paper-2_6414.jpg"></div><p></p>
