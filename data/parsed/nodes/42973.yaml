      <p>No, I still haven't. I took it to my local art store and they suggested that the texture and feel of the paper are similar to one they stock at another store, but I haven't been there yet. But they were pretty sure the paper they were thinking of didn't come in that colour. </p>
      <p>Come to think of it, I think I tried contacting some of those museums David suggested, but I never heard back. I should try again.</p>
      <p>And as Kent suggested, there are other papers that have similar colour effects. But I've not found a laid paper with a color <em>that</em> intense and a surface <em>that</em> smooth, yet probably thin enough to run in my laser printer.</p>
