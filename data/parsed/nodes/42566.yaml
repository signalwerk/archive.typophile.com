    html: |-
      <p>I understand exactly why you need these. The width of the stroke will be determined by the size of the router bit in your engraving machine, and you just need a centerline to guide it. PostScript Type 3 fonts allowed for stroked designs. You might happen upon some in very old font packages (earlier than c. 1990), but Type 3 fonts are rare, and stroked ones even more so.</p>
      <p>I'm not sure that Type 3 can even be produced by currently available font design software, as this and the ability to include color were the only advantages the format offered once Type 1 was made publicly accessible.</p>
