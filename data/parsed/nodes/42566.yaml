      <p>If you just need a few words, you could easily convert some text in illustrator (or autocad, for all I know) to outlines, and set a stroke weight. Most typefaces aren't designed to do so though, and will probably result in a less than optimal effect.</p>
      <p>Have a look at these: </p>
      <p>• <a href="//web.archive.org/web/20190930020731/http://www.fonts.ru/ustore/fonts/Gothic-Outline-Title.htm">Gothic Outline Title</a></p>
      <p>• <a href="//web.archive.org/web/20190930020731/http://www.veer.com/products/typedetail.aspx?image=ADT0003273">Helvetica Neue Std Bold Outline</a></p>
      <p>• <a href="//web.archive.org/web/20190930020731/http://www.veer.com/products/typedetail.aspx?image=ADT0003305">Gill Sans Std Display</a></p>
      <p>• <a href="//web.archive.org/web/20190930020731/http://www.veer.com/products/typedetail.aspx?image=LFT2345000">Augustea Open</a></p>
      <p>• <a href="//web.archive.org/web/20190930020731/http://www.veer.com/products/typedetail.aspx?image=ADT0003323">Smaragd Std</a></p>
      <p>• <a href="//web.archive.org/web/20190930020731/http://www.veer.com/products/typedetail.aspx?image=LFT1052100">Academy Engraved</a></p>
      <p>• <a href="//web.archive.org/web/20190930020731/http://www.veer.com/products/typedetail.aspx?image=ADT0003319">Monotype Old Style Std Bold Outline</a></p>
      <p>A google search will turn up even more.</p>
