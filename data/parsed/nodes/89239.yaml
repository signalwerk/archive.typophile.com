      <p>Maybe you're thinking of Today Sans?</p>
      <p><a href="http://new.myfonts.com/fonts/efscangraphic/today-sans-sb/" title="http://new.myfonts.com/fonts/efscangraphic/today-sans-sb/">http://new.myfonts.com/fonts/efscangraphic/today-sans-sb/</a></p>
      <p>One of the (many) things I love about Triplex is that the roman and italic were designed by two different people: Zuzana Licko did the roman (and slab serif); John Downer did the ital that inspired her.  Just like the days before romans with matching italics.</p>
      <p>Does anyone else think the OT versions of the faces seem to have been revised?  They seem different from the PostScript 1 originals, but maybe that's just me.</p>
