      <p>Im pretty sure there are many logotypes using Triplex out there, but maybe not any big brand since Triplex Serif retains a strong 90's vibe. Check out this:</p>
      <p><a href="http://content.corkd.com/about/" title="http://content.corkd.com/about/">http://content.corkd.com/about/</a></p>
      <p>Is that your question?</p>
      <p>Triplex is an interesting family since the sans and the serif were designed after the italic face and somehow made to match. The italic face is very true to the humanist model and works wonderfully in books. The sans and serif faces were designed after a bitmap grid model. I used the triplex family to design a book about indigenous recipes once.</p>
      <p>Héctor</p>
