      <p>I'm not sure I understand your point, Hrant.  As Héctor points out, Downer's italic was designed well before Licko's roman—four years before, in fact.  So I'm not sure how he could have been helping her out of a jam by providing an italic version of a face she had yet to design.  What am I missing?  </p>
      <p>But I certainly agree that he created one of the most memorable italics of the last few decades.</p>
