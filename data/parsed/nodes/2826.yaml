    html: <p>Yes, I got permission from Adobe, and also ensured that the client had appropriate licences for Minion to cover the installation of the custom fonts. Arguably, if I had drawn the Cyrillic smallcaps from scratch and had not used any Adobe data, I wouldn't have needed permission, but it's only polite to ask and Adobe have been very good about granting such permission so long as the licensing is properly arranged.</p>
