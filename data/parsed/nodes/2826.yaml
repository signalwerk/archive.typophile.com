    html: <p>Alan is correct, the fonts to which you refer do not contain Cyrillic smallcap glyphs. However, because they do contain an &lt;smcp&gt; feature, InDesign will not apply fake smallcaps. InDesign will only apply fake smallcaps if the font contains no OpenType feature for smallcaps, regardless of whether particular characters are convered in that feature. <br><br>There are relatively few Cyrillic fonts with proper smallcaps. I know of several in development, but only a handful from Paratype (non-<span class="caps">OT</span>, last I checked their catalogue) that are currently shipping. My take on this is that if a font contains any smallcaps it should contain appropriate smallcaps for all the characters supported, but obviously Adobe have decided to spend their resources in other&nbsp;ways.</p>
    html_clean: <p>Alan is correct, the fonts to which you refer do not contain Cyrillic smallcap glyphs. However, because they do contain an &lt;smcp&gt; feature, InDesign will not apply fake smallcaps. InDesign will only apply fake smallcaps if the font contains no OpenType feature for smallcaps, regardless of whether particular characters are convered in that feature. <br><br>There are relatively few Cyrillic fonts with proper smallcaps. I know of several in development, but only a handful from Paratype (non-<span class="caps">OT</span>, last I checked their catalogue) that are currently shipping. My take on this is that if a font contains any smallcaps it should contain appropriate smallcaps for all the characters supported, but obviously Adobe have decided to spend their resources in other&nbsp;ways.</p>
