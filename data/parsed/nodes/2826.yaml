    html: |-
      <p><i>Cyrillic miniscules are already functionally small caps anyway.</i> <br> <br>No, they are not <i>functionally</i> smallcaps: many of them are &lt;i&gt;visually&lt;/i&gt; similar to small versions of the capital letters in upright style (not in cursive italics), but there is a typographic function for actual smallcaps in Cyrillic text just as there is in Latin text, e.g. acronyms, running heads, etc. The typical difference between Cyrillic smallcaps and Latin ones is that the former tend to be slightly taller, in order to distinguish them more clearly from the similar lowercase letters, whose proportions also differ. This is something to be kept in mind when designing fonts that combine support for multiple scripts. <br> <br>A few years ago I was commissioned to design a set of Cyrillic smallcaps for Minion Cyrillic for a publisher who needed them for a book that included some words that always appeared in all-caps. See attached PDF. <br>&lt;!--attachment: Minion_Cyrillic_SC-24888.pdf*mime_pdf.gif*application/pdf*32.9*Minion+Cyrillic+smallcaps*Minion+Cyrillic+SC%2epdf --&gt;</p><center><br>
      <table border="1">
      <tbody><tr>
      <td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align="left" alt="application/pdf">Minion Cyrillic smallcaps<br><a href="http://www.typophile.com/forums/messages/4101/Minion_Cyrillic_SC-24888.pdf" target="_blank"><b>Minion Cyrillic SC.pdf</b></a> (32.9 k)</td>
      </tr>
