    html: |-
      <p><i>Cyrillic miniscules are already functionally small caps anyway.</i> <br><br>No, they are not <i>functionally</i> smallcaps: many of them are &lt;i&gt;visually&lt;/i&gt; similar to small versions of the capital letters in upright style (not in cursive italics), but there is a typographic function for actual smallcaps in Cyrillic text just as there is in Latin text, e.g. acronyms, running heads, etc. The typical diﬀerence between Cyrillic smallcaps and Latin ones is that the former tend to be slightly taller, in order to distinguish them more clearly from the similar lowercase letters, whose proportions also diﬀer. This is something to be kept in mind when designing fonts that combine support for multiple scripts. <br><br>A few years ago I was commissioned to design a set of Cyrillic smallcaps for Minion Cyrillic for a publisher who needed them for a book that included some words that always appeared in all-caps. See attached <span class="caps">PDF</span>. <br></p>
