      <p>As James Puckett mentions, there were printing presses in Mexico who stocked up on Blackletter. In short, it was said that this influenced the signpainters in Mexico to create signage in blackletter styles, eventually becoming a standard in headline fonts/hand lettering. It made its way up to the US as people migrated north. </p>
      <p>Early Hip-Hop (early 70's) actually did have gangs, most notable are the 'black spades' which became the Zulu Nation. The activities included DJ'ing, Bboy'ing, MC'ing, &amp; Writing/graffiti – all hobbies which predate "hip-hop". Style Wars itself is actually not a documentary on 'early' graffiti, as it was filmed when NYC graffiti was about 12 years old. Illegal graffiti actually has its origins decades before, which is where blackletter comes back into the picture.</p>
      <p>Besides hobo graffiti (possibly dating back to WW1), Cholo graffiti is known as one of the first forms of illegal writing and was done in blackletter inspired forms. It is said that shoe shine boys started it all, marking their places with daubers, eventually transcending into gangs marking territory. Chaz Bojorquez, an original cholo style graffiti artist, mentions... </p>
      <p>"This squarish, prestigious typeface was meant to present to the public a formal document, encouraging gang strength, and creating an aura of exclusivity." </p>
      <p>Chaz would probably be a great resource for you if you are into learning more about the cholo blackletter evolution. And <a href="http://www.graffitiverite.com/cb-cholowriting.htm" rel="nofollow">here</a> is the article I quoted him from. </p>
      <p>An interesting thing to note is that current (non-gang) graffiti has seen a small trend of artists painting their versions of blackletter. Here are a few:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/84042745_95ef3dd4f2_5004.jpg"></div><br>
      "Seventh Letter" by Eklips<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/retna_4018.jpg"></div><br>
      "MINDS SEEK KNOWLEDGE, REVOKSABERRETNA" Detail of a wall. Lettering by Retna<p></p>
