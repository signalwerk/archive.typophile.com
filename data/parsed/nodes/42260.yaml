      <p>Following up on russellim's perspective, I had inferred that blackletter appeals not because of associations directly with authority or religion, but with the semi-chivalric ethos that many gangs cultivate. If that's correct, "authority" and "religion" come along as ingredients to a worldview wherein the gang member is a <em>knight</em>; a bike is his <em>horse</em>; he is associated with a <em>lady</em>; loyalty to turf, group, and leader is the fundamental law; and one protects all these by violence as necessary.</p>
      <p>No other design connotes that chivalric ethos, so far as I can recall early on a Saturday morning, as well as blackletter does -- and blackletter subsequently signals "strength" and "danger" from its association (justified or not) with German authoritarianism, religious deviance, and other anti-bourgeois American phenomena.</p>
      <p>Don't ask how I came by this conclusion.</p>
