      <p>Going back to the Elvis cover above, I think that There has for a long time been a biblical association with blackletter - by the same people who call it Gothic and Old English and used it with great solemnity. I think that by extension, since many "bad-boy" heavy metal bands, use black magic and evil-uber-bad devil-worship themes, blackletter is the perfect choice beause of the irreverence, and like black magic and Satanism, it's not really a departure from religion, it's just a perversion, or at least, different take on it. You can't reject something if you don't first acknowledge it. Gangs - Biker gangs in particular, tend to use death's heads, a devils and tombstones to represent their chosen place as outsiders, (... outlaws, 1%ers, etc.) The religious reference of blackletter lettering suggests what it is you are outside of. Biker gangs and street gangs aren't the same thing, but there could easily be some cross pollination.</p>
      <p>And, for all the rough and tough-guy swaggering of gang types, there is quite a bit of flat-out sappy sentimentally to tattoo art. Could be that the choice of lettering for - oh, I don't know... "R.I.P. Mom" could influence the lettering chosen for gang related tattoos. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/new-7_3510.jpg"></div><p></p>
