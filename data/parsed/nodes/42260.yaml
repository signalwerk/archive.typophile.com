      <p>Ch&gt; <em>i don’t see how one can possibly divorce formal aspects from popular associations. as an academic exercise perhaps, but not in the real world.</em></p>
      <p>It is because the letter form has personal attributes ( ie. script) <em>and</em> has very strong attributes, that is why it is a popular type of choice throughout the body art community. </p>
      <p>You should really get more. Go talk with the owners of tattoo shops. In Ottawa, places like Planet Ink (where I've been seen once or twice), will tell you that it is because of it's attributes blackletter is popular (and too a lesser extent some cursive faces). And btw, the reverse is also true. Monoweight sans serif is not popular. It is not popular because it is seen as being - plain.</p>
      <p>These are very cool words coming from different societies and cultures. Words like 'style' and 'plain' will always transcend pop culture. Blackletter is as hip today and the century to come, as it was during the last century and the century before that (etc.). </p>
      <p>And the more 'exposure' it gets - the more appreciated it will become as a modern artistic statement with a long rich history.</p>
