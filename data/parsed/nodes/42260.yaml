      <p>I understand that you feel that way. I am not saying how you feel is invalid. Quite he opposite! But it is a cultural construct. Another culture might feel quite differently and draw completely different associations deep or otherwise. And they do. You can feel something without it being "essential". The idea that what you feel about type or art is essential and eternal is just nonsense. That doesn't make it feel less. It just means you are not the measure of all things. Is that sooo terrible? Insisting otherwise is like insisting that the universe revolves around you, or the earth, or the sun. It just ain't so. Have a little humility! </p>
