      <p>Fascinating thread!</p>
      <p>I think the choice of blackletter as the preferred type style for tattoos and tattoo artist has very little to do with antiquity, reglion, culture, tradition or otherwise. I think deep down what appeals to the nature of those that chose blackletter for a tattoo are the strong and weak elements of the letter form itself. They graphically impart to the user a strong sense of community. Plus, elements of the letter offer to the tattoo artist and user alike, the opportunity to re-state the letter form as an indiviual statement. </p>
      <p>Test case - present two type choices to a hundred people in the 15-25 age group (group dynamic male and female). One choice sans serif, and the other choice blackletter. And ask each person why they chose one over the other. It would be cool if you could do this study in some major cities on a global scale. </p>
      <p>My bet is that across all cultures, forget about just the gangs, my bet is that blackletter will be chosen over sans serif because of its letter form elements and how those elements relate to each other within each letter shape.</p>
      <p>Descriptive words that superceed stuff like tradition, religion, and culture - are words like 'elegant' and 'style'. Those words appeal to us all equally - regardless of religion, culture, tradition etc., etc... And that imho is what reaches us from the blackletter.</p>
    html_clean: |-
