      <p>Yves, originally <a class="freelinking external" href="http://en.wikipedia.org/wiki/Hip_hop_culture" rel="nofollow">hip-hop and early rap</a>, which originated in the Bronx, New York City, was not associated with gangs. It had three elements: graffiti, break dancing, and rap music </p>
      <p>There seems to be a definitive documentary on early hip-hop graffiti, called <a class="freelinking external" href="http://www.stylewars.com/" rel="nofollow">Style Wars</a>. That should tell you what you want to know. You can order it through the link. My memory is the styles of this early graphitti were not black letter, but I may well be wrong. </p>
      <p>The 'gangster rap', which I believe started in LA, is a later development. It is important not to confuse hip hop with ganster rap, because the spirit is so different.  </p>
      <p>On gangster rap, there may well be an influence of hispanic gangs, but I suspect that also<br>
      Gerald Huerta's AC/DC logo was an influence. He writes about it on <a class="freelinking external" href="http://www.typophile.com/node/20336" rel="nofollow">this Typophile thread.</a> That spawned a whole style for heavy metal, which I think predates the gangster rap albums and may have influenced them. </p>
      <p>I short, I don't know the answer to your question, but these links might help put you on the right track.</p>
