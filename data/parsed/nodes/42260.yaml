      <p>in response to:</p>
      <p>[[&gt; Yves, originally hip-hop and early rap, which originated in the Bronx, New York City, was not associated with gangs. It had three elements: graffiti, break dancing, and rap music.</p>
      <p>Yeah, I knew that — I was a breakdancer in my days. ;^) Thanks for the documentary and the tips.]]</p>
      <p> Actually it wasn't "hip-hop" until the media came along and decided to package and label these "elements" that specific term during the 1980s. Before this, it had always been there, it had always been inner-city youth CULTURE before "hip-hop", and it certainly was initially influenced by gangs. The act of "getting up" too stems from gangs and political messages, do your homework on what influenced TAKI 183 to start writing.. here's a hint "JULIO 204" of the Savage Skulls!!</p>
      <p> The inner-city gang culture of NYC was in fact inherent to the "bad-boy" biker gang culture of the 1950s and 60s, hence why many kids during those days wore DA (Duck's Ass) haircuts and why they wore jackets with the sleeves cut off and their gang's name patched on the back. Ever watch the movie WARRIORS? However, they never called themselves gangs, they were called "clubs", taken from Motorcycle Club (MC). Remember now, motorcycle clubs like the Hell's Angels, their early founding members were veterans, so their style is that of a military nature, hence the patches and the order of rank among it's members. Also, take a look at Afrika Bambatta, he was a high ranked Black Spades member before starting the Zulu Nation! Even the term "B-Boy" stems from "Bad-Boy", hence their attitude when "breakdancing"! </p>
      <p> So in ending, gangs were very much so associated with these so-called "elements". Take the first ever rap crews like, "THE FEARLESS FOUR", "TREACHEROUS 3", "GRANDMASTER FLASH AND THE FURIOUS FIVE", "COLDCRUSH BROTHERS", etc. and how they flashed letters like Old English and Blackletter fonts ironed-on or screen printed on the fronts or backs of their shirts, sweaters, and jackets, or in other words their "colors"! Even the dancers and their crews during that time did this.</p>
