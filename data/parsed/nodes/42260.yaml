      <p><cite>If there is a connection to Mexican culture, the origin would look to be Catholic.</cite></p>
      <p>After the conquer of Mesoamerica the first printing presses set up in Mexico used blackletter type and blackletter has been a big part of the culture ever since. </p>
      <p>The book <em>Mexican Blackletter</em> has a little information on this digging into various histories of alphabets and letting will turn up much more. The question of whether American gangs picked it up on their own or appropriated it from Mexican gangs doesn’t seem to be answered yet.</p>
