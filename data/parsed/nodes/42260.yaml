      <p>If you're looking into blackletter as tattoo art you're probably going to want to dig into the tattoo development side quite a lot as well. I suspect style and development of tattoo genres/phases influenced the lettering artists use. For instance, tattooing around the time of WWII lettering was a more open style, these days a lot of lettering is script or blackletter. A good example of the latter, and someone who might be able to provide insight are tattooists like <a class="freelinking external" href="http://www.mistercartoon.com/" rel="nofollow">Mr Cartoon</a> and <a class="freelinking external" href="http://www.maxx242.com/" rel="nofollow">Maxx242</a>.</p>
      <p>I'd also suggest contacting the editor of International Tattoo Art, and going to BMEzine. You might get some more answers there as well.</p>
