      <p>hiroshige, i'm trying to understand : everything you attribute to the power of the blackletters is meaningful in three possible contexts : animal (pleasure), intellectual (aesthetix) and cultural (community). i doubt the 1st one, (depending on who actually made the cave paintings), i appreciate the 2nd but believe it to be incomplete in this case, and i have reliable experience with the 3rd. </p>
      <p>&gt;&gt;You should really get more. </p>
      <p>not sure what you meant there, but i generally agree. i'm adding to my left sleeve next month. i hang out with plenty of ink &amp; inkers, i'm well inked, and i've not heard much tat talk, even among the art-schooled, about the formal aspects of the letterforms, let alone the word blackletter. but i've heard plenty about heritage, background, symbolism, deeply associational threads, the meaning of the personal choices. </p>
      <p>academics aside, the power of the letters may be in the crazy fun of them, but very much also in all the associations they bring to play.</p>
      <p>smiling emoticon</p>
