    <p>Hi everyone,</p>
    <p>I'm preparing a talk on typeface selection which includes a section about cultural significance of type. There is a missing link though. I know that the use of blackletter on rap album covers stems from the gang tattoos, but how/why did blackletter become the preferred type style for those tattoos?</p>
