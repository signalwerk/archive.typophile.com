      <p>Thanks Aziz</p>
      <p>&gt;&gt;Does NAIM virtual keyboard display Initial or Standalone Arabic Glyphs?!</p>
      <p>Both, it is not dependent on that. I made sure to test it with 2-4 glyphs per letter too. It works with any font.</p>
      <p>&gt;&gt;Are you going to market NAIM physical keyboards along with NAIM Software?!</p>
      <p>For now we created a java applet that serves fonts, keyboards, directionality, and input methods, over the web to demonstrate our project. But NAIM is just a method.  It can be implemented within hardware or software, or even using OT features (with application software aware environment)</p>
      <p>It's main goal to make a user and learner not overwhelmed by awkward glyph changing so he/she can concentrate on learning the shapes. </p>
      <p>&gt;&gt;Then, Arabic is a Digit Hopping System. Arabs read and write 2-digit numbers from right to left if the right digit is not zero, whereas 3-digit numbers are written from left to right but hop read from the left significant, right significant then middle…<br>
      So how does NAIM solve the insolvable?</p>
      <p>Funny you say that Aziz.  That is exactly what we have been saying for years: bidi did not solve the insolvable? It just made typing Arabic awkward, and added unneeded overhead.</p>
      <p>-Saad</p>
