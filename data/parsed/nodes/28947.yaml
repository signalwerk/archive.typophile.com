    <p>Our site, arabetics.com, was recently upgraded to introduce more options for Arabic and Arabetic scripts users.  In addition to adding more fonts and the ability to edit and display extended Arabic scripts online, using any of our fonts, we have also introduced on the site a java applet demonstrating our new alternative Arabetic editing method: NAIM</p>
    <p>This new input method option is a “shaping” free (or glyph substitutions free) natural Arabetic text input method.  User sees no glyph changing prior to leaving a word. Additionally, we have added an option for users to force RtL only ordering to avoid bidi behavior when desired: <a href="http://arabetics.com/java/NAIM.html" title="http://arabetics.com/java/NAIM.html">http://arabetics.com/java/NAIM.html</a> </p>
    <p>Further discussion of this method and other related topics are included in our latest article in the upcoming issue (40.3) of Visible Language: “Typography behind the Arabetic Calligraphy Veil”.</p>
    <p>Thanks.</p>
    <p>-Saad</p>
