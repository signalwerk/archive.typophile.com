    <p>Hello,</p>
    <p>Titles are set in Gill Sans (All Caps), and everybody was really happy with the Lorem.<br>
    The real titles are sometimes very long and I need to fit them on one line.<br>
    I would like to keep the same feeling, but switch to something more condensed.<br>
    I don't see any font like that in my lib, so any help would be very appreciated.</p>
    <p>Note :<br>
    I didn't want to use Gill at first, and now I don't want to leave it. ain't that funny ?</p>
