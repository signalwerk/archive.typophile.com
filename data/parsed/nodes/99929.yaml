    votes: null
    html: |-
      <p>Hi Dave,</p>
      <p>checking the full OTL box doesn't help.  In any case, the "Standard Ligatures" box was checked already, so I have no clue why they don't work. Also, the kerning should be "always on" as far as I can tell, so no reason it shouldn't work.</p>
      <p>Finally, there are no such control boxes for the foundry name set in Octant (above), so I have to rely on that working properly on its own.</p>
      <p>Is there any "rookie mistake" that comes to mind that could have this effect?</p>
      <p>I have contacted MyFonts; lets see what they say.</p>
