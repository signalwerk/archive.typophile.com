    <p>I'm about to start selling my font Octant on MyFonts, but I've run into a problem. Wherever the font is used on the MyFonts webpage — both in the font sample windows and on my foundry page — neither the kerning nor the ligatures work.</p>
    <p>From the website:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/web_6738.png"></div><p></p>
    <p>On my local machine, in PowerPoint:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/powerpoint_6420.png"></div><p></p>
    <p>Any idea why that would happen?  And how to counter it?</p>
