    html: <p>I've never had any trouble with unencoded glyphs in kern feature. I've looked at your font page, and the drop down menu that controls OpenType features (should be in between black and white squares and cog) is not there. This is probably at least part of the problem you're having. Whether it's a problem with the font or myfonts page, I don't know.</p>
