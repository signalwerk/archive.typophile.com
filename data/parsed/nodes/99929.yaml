    html: <p>OK, I've been told by the support contact of the Glyphs software that the lookup tables of my OTF files are damaged.  I've received the metrics information in tabular form from Igino, and hopefully the Glyphs contact will be able to import them into font. We'll see if that works!</p>
  - id: 539626
    user: 1133
    date: 2013-01-22T20:33:00
    date_raw: 22 Jan 2013 — 8:33pm
    votes: null
    html: |-
      <p>Octant includes AAT features (morx and feat tables) rather than OpenType Layout features (GSUB, GPOS). Also, the "kern" table is in class-based AAT format. </p>
      <p>AAT features (including the AAT-only class-based version of the "kern" table) only work on Mac OS X and iOS. They don't work on Windows, or in Adobe apps, or on MyFonts. </p>
      <p>Has the font been generated using FontForge? It has some AAT support. You need to generate the font as "OpenType for Windows" in FontForge, or something like that, rather than "TrueType for Apple". The font will then have OpenType Layout features included. </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      MyFonts</p>
