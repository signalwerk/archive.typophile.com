    html: <p>Kerning and standard ligatures should work fine. Some more complex OpenType substitutions aren't handled properly yet (particularly anything involving ignore subs, such as end forms and certain contextual substitutions). If you're on the staging site, make sure 'full OTL' is checked in the menu that drops down from the cog. That may or may not help. If it doesn't, the myfonts team are very helpful.</p>
  - id: 539452
    user: 188621
