  html: <p>I'm working on what's to be a small, hip fashion/lifestyle magazine. I've chosen too use Chronicle Text and Display and possibly Gotham Bold set in all caps for headlines. But I'm hoping to get some suggestions regarding a sans to pair with as an additional text face. I don't care for any of the Gotham's set small... Thanks so much for your input!</p>
