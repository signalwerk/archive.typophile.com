  html: |-
    <p>i am working to find a substitute font for <a href="http://www.swankglossy.com/" rel="nofollow">swankglossy</a> fashion magazine. The font that i want to substitute is Bodoni.</p>
    <p>The font is similar to Didot,and most fashion magazine use this font such as ELLE, VOGUE, BAZAAR, etc. I`m trying to find something new, fresh, elegant yet still has a sense of fashion in it.</p>
    <p>I would really appreciate any thoughtful feedback you are willing to share. Please ask any questions you need answered in order to respond.</p>
  html_clean: |-
