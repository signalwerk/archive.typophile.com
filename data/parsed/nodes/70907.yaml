    <p></p><div class="imageWrap"><img src="http://typophile.com/files/41716_6449.png"></div><p></p>
    <p>Parisine Office Std was originally created by Jean François Porchez for RATP in 2005. This new variation “Std” is the basic version of the tailored Parisine Office PTF who feature a smaller xheight and perform better on text setting, editorial projects. The design of the italic lowercases is more cursive than in Parisine PTF. Two sets of figures are provided—standard, oldstyle, and lining—in tabular widths.</p>
    <p>All details<br>
    <a href="http://www.typofonderie.com/alphabets/view/ParisineOfficeStd" title="http://www.typofonderie.com/alphabets/view/ParisineOfficeStd">http://www.typofonderie.com/alphabets/view/ParisineOfficeStd</a></p>
    <p>Test it online<br>
    <a href="http://www.typofonderie.com/alphabets/try/ParisineOfficeStd" title="http://www.typofonderie.com/alphabets/try/ParisineOfficeStd">http://www.typofonderie.com/alphabets/try/ParisineOfficeStd</a></p>
    <p>Full pdf specimen<br>
    <a href="http://www.typofonderie.com/icono/alphabets/pdf/ParisineOfficeStd_pdf.pdf" title="http://www.typofonderie.com/icono/alphabets/pdf/ParisineOfficeStd_pdf.pdf">http://www.typofonderie.com/icono/alphabets/pdf/ParisineOfficeStd_pdf.pdf</a></p>
    <p>For the first time, only available in June 2010: Parisine Office Std, a complete family of four weights to set legible and simply beautiful text just for 50% of the normal price. From € 70 /  $86 (only, until the 30 June 2010) for 2 users</p>
