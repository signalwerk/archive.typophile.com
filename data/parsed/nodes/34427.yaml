      <p>First things that come to mind:</p>
      <p>It seems there are some problems concerning contast. Some things too thick, others too thin. Your 's' for example, has its thick at the wrong place. It should be in the middle, on the spine. 'x' too wide, 'v' and 'w' as well. The 'm' doesn't really seem to work, the 'n' is, but the 'm' is looking weird. And I think the slab-serif on the 'd' might be pointing in the wrong direction. Crossbar of the 'A' is too high, 'S' has same prob as lc 's'.</p>
