    html: |-
      <p>You'll find, unfortunately, that even in a font where everything is the same weight, it isn't really. Even Avant Garde, Lubalin, and Futura have slightly thinner horizontal than vertical parts, and their straight lines are thinner than their curved lines. In your case, here are a few weight problems I see immediately. Some of them are technical, and others optical.<br>
      -The main stems of a lot of your letters are thicker than the rest of the letter: MNU, BRP, hmnku, apgqdb. Weight is very dodgy in the small caps.<br>
      -I think your round letters should tend more toward square, as in Melior or cuttlefish's <a href="http://typophile.com/node/28416" rel="nofollow">Palormak</a>. I'm thinking here of OQCG and ceos, which look to have been imported almost straight from Stymie.<br>
      -The biggest way to solve the wonkiness of your S is to move the control points that are on the vertical parts in toward the center. Also, make sure it has the standard S stress (the lowercase s needs that too).<br>
      -Some of your letters are too cobbled together. I'm especially looking at the M, ß, small caps, and most of your diacriticked letters, which I'm guessing you haven't updated since you smoothed out the letters they're based on (like a, n).<br>
      -The numerals are too normal. As it is, though you've customized them appreciably, they still look like they want to go back to Stymie.</p>
      <p>Altogether, an good and interesting start, and I'd love to see where it goes.</p>
