    html: |-
      <p>&gt; <em>Should all the horizontals be the same weight?</em></p>
      <p>No, they do not <em>need</em> to be the same weight, but if all strokes are of varying weight, your typeface starts to bounce all over the place. It will look a bit.. how do you say that (english is not my native tongue).. nervous or restless I guess. Also keeping the weights on the different angles (vertical/horizontal/diagonal) more or less consistent, will make your characters work together better.</p>
