  html: |-
    <p>Hi all,</p>
    <p>I've created a three weight font and it's pretty much done. </p>
    <p>Unfortunately, I added an extra glyph, f.salt. Since I've done that, I've realised that I need to create alternate ligatures, ie fi, ffi, fl etc.</p>
    <p>I've decided to create a stylistic set for the alternate f. I can get the alternate f working when I check it in various programs using the stylistic set, but can't figure out how to get the stylistic set to use the alternate ligatures rather than the standard ligatures.</p>
    <p>This bit of my code works</p>
    <p>feature ss02 {<br>
      sub f by f.alt;<br>
    } ss02;</p>
    <p>Then I've tried to add this in but no matter where I add it, in the SS or the liga feature, it doesn't take effect (I've only done fi as the test so far)</p>
    <p>feature liga {<br>
      sub f.alt i by fi.alt;<br>
    } liga;</p>
    <p>If you have any thoughts that would help I'd be greatly appreciative.</p>
