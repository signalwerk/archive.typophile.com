    html: "<p>I can't find the thread right now, but here is the story: Christian Schwartz and his colleague produced the Luxury Collection as a satire and joke on the fashion industry, and put the price accordingly, not expecting to sell. <br> <br>I think Schwartz's work on type is some of the best being done today, and none of the rest has this kind of pricing. If you want one of the 'luxury' fonts or an alternative, I suggest e-mailing Christian Schwartz and asking him, and I expect you'll get a reasonable answer.</p>"
