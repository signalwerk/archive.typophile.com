    date_raw: 10 Sep 2004 — 2:31pm
    votes: null
    html: <p>Joke or not, exclusivity of a high quality item can ask for exorbitant prices and expect to receive payment. Christian Schwartz does seem to have an impressive resume to back up actions that may seem eccentric. I suspect it will take an equally eccentric person to purchase such a font package and that even large corporations with the pocket change to do that have decision makers with more traditional views on spending. <br> <br>I'm curious to know if anyone has purchased it yet. <br> <br>Also, I'm sure if you looked hard enough you could find some resonably priced typefaces that are similar.</p>
