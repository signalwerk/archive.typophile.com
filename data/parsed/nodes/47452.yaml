      <p>the basic concepts are very similar and easy to understand.<br>
      however Fontographer just resurrected from the dead, while FontLabStudio constantly evolves.</p>
      <p>depending on your needs you might also consider buying TypeTool (think of it as FontLab Limited Edition) and upgrading to FLabS later.</p>
