    html: |-
      <p>Michael</p>
      <p>If you are used to line commands, then here is a Python script that outputs all the unicode points in a font file.<br>
      <code><br>
      ----<br>
      #!/usr/bin/python</code></p>
      <p>import&nbsp;fontforge,sys<br>
      fnt=fontforge.open(sys.argv[1],1)</p>
      <p>for&nbsp;g&nbsp;in&nbsp;fnt.glyphs():<br>
      &nbsp;&nbsp;&nbsp;if&nbsp;(g.unicode&nbsp;!=&nbsp;-1):<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;print&nbsp;"%04X"&nbsp;%&nbsp;(g.unicode)<br>
      ----<br>
      <br>
      It works well on a mac (more generally on unix) and assumes <a href="http://fontforge.sourceforge.net/" rel="nofollow"><strong>FontForge</strong></a> is installed. Say you call the script <code>lstucodes</code>, you make it executable, and you put it in some folder in your path. Then, to see what unicode characters there are in <code>GaramondPremrPro.otf</code> you just type "<code>lstucodes GaramondPremrPro.otf</code>" where the font is. If you don't want the error messages, you type "<code>lstucodes GaramondPremrPro.otf 2&gt;/dev/null</code>"; if you want the list to be sorted then </p>
      <p><code>lstucodes GaramondPremrPro.otf 2&gt;/dev/null | sort</code> </p>
      <p>does it. </p>
      <p>If for some reason you want both the unicode point and the glyph name, you replace the line </p>
      <p><code>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;print "%04X" % (g.unicode)</code><br>
      with<br>
      <code>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;print "%04X;%s" % (g.unicode, g.glyphname)</code></p>
      <p>Here is then a copy paste of part of the output on GaramondPremrPro.otf (Version 1.014)</p>
      <p><code><br>
      01FA;uni01FA<br>
      01FB;uni01FB<br>
      01FC;AEacute<br>
      01FD;aeacute<br>
      01FE;Oslashacute<br>
      01FF;oslashacute<br>
      </code></p>
      <p>It is surprising to see all you can do with very short scripts like this. </p>
      <p>Michel</p>
