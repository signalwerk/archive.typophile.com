      <p>Ken Whistler at the Unicode Technical Committee confirms that the Aringacute entered Unicode as part of the merger of character sets with ISO 10646, i.e. Unicode 1.1. U+01FA..U+01FF came in as a set, and presumably from one of the Scandinavian national standards bodies, most likely the Danes. Ken also confirms that the characters with acute accents, including Aringacute, are listed on page 24 of the <em>Nordic Cultural Requirements on Information Technology</em> publication, and are annotated in the Danish column as 'Letters seldom used in writing the language'.</p>
      <p>Nick: <em>Well, they are the folks that gave smileyface and a cup of coffee their own code points</em></p>
      <p>The smiley face may have come into Unicode via Apple, and I believe the 'hot beverage' symbol originated with the Japanese. There's this mistaken idea that the Unicode consists of a bunch of people coming up with characters to encode, but most of the characters are proposed by other bodies or by individual researchers, and the UTC's task is to review and determine whether the proposed characters should be encoded and how, and it does so in coordination with WG2, the ISO body responsible for 10646. It just happens that most font developers come to know the Universal Character Set via Unicode.</p>
