      <p>Claus: <em>It’s not used in Danish as Hudson claimed in that other thread.</em></p>
      <p>This character is not <em>normally</em> used in writing Danish, but if syllable stress is marked in Danish, as may happen in e.g. dictionaries, then any standard Danish vowel, including the A with ring, may take an acute accent. This isn't unusual for any Latin script orthography: the acute accent is widely used to mark stress, and the only thing that makes the Danish situation a bit more complicated is that the A with ring is a standard vowel, not a diacriticised vowel, and hence you have the phenomenon of stacked marks that is otherwise not usual in European orthographies (but is very common in Africa for example).</p>
      <p>Now, most diacritic stacking in Unicode makes use of combining mark character sequences, so letters with two marks above are uncommon in the standard. If they exist in Unicode it is a very strong indication that they pre-date Unicode in some 8-bit character set, since Unicode has a policy of providing one-to-one round-trip mapping for earlier encoding standards. My guess is that the Aringacute character probably existed in something like a library cataloguing encoding, since these tend to be quite exhaustive in their coverage of possible accentuation.</p>
      <p>If you check the Danish information in the <a href="http://www.evertype.com/alphabets/danish.pdf" rel="nofollow">The Alphabets of Europe</a>, you'll see that Aringacute is included there. This document originated as a CEN project, and included input from a wide range of national experts and standardisation bodies. If you were to check the documents listed in the bibliography, I'm sure you would find the justification for Aringacute in one or both.</p>
      <p>When Microsoft were spec'ing the WGL4 character set, they decided to take an inclusive approach to European diacritic letters, even if the characters in question were not found in everyday orthographic use. Hence, the Aringacute (along with Oslashacute and AEacute, and lowercase equivalents) were all included and, through this, became fairly standard inclusions in OpenType glyph sets for European language support.</p>
