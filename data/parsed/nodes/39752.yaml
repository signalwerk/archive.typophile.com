      <p>Goran: <em>In Swedish, the Aring is also its “own” character, compared to an accented É or similar.</em></p>
      <p>Yes, but if you look here</p>
      <p><a href="http://www.evertype.com/alphabets/swedish.pdf" title="http://www.evertype.com/alphabets/swedish.pdf">http://www.evertype.com/alphabets/swedish.pdf</a></p>
      <p>you'll see that the Aringacute is not listed, nor is it listed in either of the Norwegian orthographies</p>
      <p><a href="http://www.evertype.com/alphabets/bokmaal-norwegian.pdf" title="http://www.evertype.com/alphabets/bokmaal-norwegian.pdf">http://www.evertype.com/alphabets/bokmaal-norwegian.pdf</a><br>
      <a href="http://www.evertype.com/alphabets/nynorsk-norwegian.pdf" title="http://www.evertype.com/alphabets/nynorsk-norwegian.pdf">http://www.evertype.com/alphabets/nynorsk-norwegian.pdf</a></p>
      <p>whereas it is listed here</p>
      <p><a href="http://www.evertype.com/alphabets/danish.pdf" title="http://www.evertype.com/alphabets/danish.pdf">http://www.evertype.com/alphabets/danish.pdf</a></p>
      <p>This is a good indication that the Aringacute will be found identified as a Danish character in the Danish Language Committee (Dansk sprognævn) documents listed in the bibliography for the Danish PDF:</p>
      <p>Dansk sprognævn. 1996. <em>Retskrivningsordbogen.</em> 2. udgave. København: Aschehoug. ISBN 87-11-10000-1</p>
      <p>Dansk sprognævn, in Icelandic Council for Standardization. 1992. <em>Nordic cultural requirements on information technology.</em> Reykjavík: Staðlaráð Íslands. ISBN 9979-9004-3-1</p>
      <p>Interestingly, the Wikipedia entry on the Danish alphabet has this to say:</p>
      <p><em>Standard Danish orthography has no compulsory diacritics, but allows the use of an acute accent for disambiguation. Most often, an accent on e marks a stressed syllable in one of a pair of homographs that have different stresses, for example en dreng (a boy) versus én dreng (one boy) or alle (every/everyone) versus allé (avenue).</em></p>
      <p>Less often, any vowel except 'å' may be accented to indicate stress on a word, either to clarify the meaning of the sentence, or to ease the reading otherwise. For example: jeg stód op ("I was standing"), versus jeg stod óp ("I got out of bed"). Most often, however, such distinctions are made using typographical emphasis (italics, underlining) or simply left to the reader to infer from the context, and the use of accents in such cases may appear dated.</p>
      <p>That explains the use of the acute accent (which is similar to the use of optional diacritics in Norwegian), but whoever wrote that entry maintains that å cannot take the accent mark, which is presumably contrary to whatever document resulted in the inclusion of Aringacute in ISO 10646 and Unicode.</p>
      <p>Annex G of the CEN document <em>User requirements study and programming for standardization in the field of Character Set Technology</em> provides the table of contents of the <em>Nordic cultural requirements on information technology</em> publication:</p>
      <p><a href="http://www.open-std.org/CEN/TC304/docs/pt01-fin.htm" title="http://www.open-std.org/CEN/TC304/docs/pt01-fin.htm">http://www.open-std.org/CEN/TC304/docs/pt01-fin.htm</a></p>
      <p>Note that this includes 'Library application', and as I wrote above such use tends to be very inclusive of possible accentuation, since library catalogues need to be able to accurately represent information from books of different periods, when diacritic use may have varied.</p>
    html_clean: |-
