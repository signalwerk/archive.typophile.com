    html: <p>In Danish typesetter terms the å is called 'Swedish å'. The character was, as it is written today with the ring on top of the a, invented in the 15th century in Sweden. In the 14th century the first ways to indicate the o-sounding a included ā ă â and ao written together like æ is. The origin of the aring was writing the a with the ring right just to it's right side, later in the 15th century it was moved up on top of the a. The first time the å is used in print is in 1526 for a Swedish bible. After a few centuries of mucking about with aa versus å, the å was implemented by law in Danish in 1948.</p>
    html_clean: <p>In Danish typesetter terms the å is called 'Swedish å'. The character was, as it is written today with the ring on top of the a, invented in the 15th century in Sweden. In the 14th century the first ways to indicate the o-sounding a included ā ă â and ao written together like æ is. The origin of the aring was writing the a with the ring right just to it's right side, later in the 15th century it was moved up on top of the a. The first time the å is used in print is in 1526 for a Swedish bible. After a few centuries of mucking about with aa versus å, the å was implemented by law in Danish in 1948.</p>
