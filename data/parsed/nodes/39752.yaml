      <p>I wouldn't take Evertype documents at face value. For instance the quotation marks are wrong. Shown is the Anglo tradition whereas Denmark traditionally follow the Germanic tradition: „Dansk“ not “Dansk”. The two references mentioned is the standard (small) Danish dictionary which I doubt has anything on aringacute, and the other I can't find on the interweb so who know what is in that one?</p>
      <p>Further, if you search the 22'500 pages dictionary 'Ordbog over det danske Sprog' for aringacute it comes up with nothing. But then again ODS only cover the period of 1700 to 1950, so the ǻ might be of older date.</p>
      <p>Anyhoot, I will give 'Dansk Sprognævn' a call tomorrow.</p>
