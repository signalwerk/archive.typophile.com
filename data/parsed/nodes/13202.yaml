      <p>&gt;these values were stored in some number of tracks</p>
      <p>On magnetic tape, presumably.</p>
      <p>So the origin of the word goes back to “you ain’t heard nothin’ yet!” — ie the addition of a sound track to movies in the 1920s (and on to multi-track sound recordings in the 1940s). </p>
      <p>A track is a linear sequence of marks/traces; which describes movie film. And film, with its frames and sprockets, visually resembles a railroad track. </p>
      <p>Two tracks running side by side is a good metaphor to describe how image and sound work together. Hence “soundtrack”.</p>
