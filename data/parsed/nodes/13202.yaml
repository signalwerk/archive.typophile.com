    <p>Hello everyone,</p>
    <p>in a brazilian typography discussion group we’ve been talking about typographic terms and how we use so many english terms like kerning, tracking, leading, etc. When trying to translate, we often run into the problem of not fully understanding the english term. One word we have some trouble translating is <em>tracking</em>. Although we all understand what tracking “does”, I was wondering if anyone knows the origin of this term and any synonyms it might have. I’ve tried a dictionary but no luck.</p>
    <p>Thank you!</p>
