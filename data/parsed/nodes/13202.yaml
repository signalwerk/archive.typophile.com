    html: <p>Compugraphic’s AutoKern was developed for the EditWriter in 1979. For kerning each character was assigned values to describe the outline at the baseline, x-height, and ascender. Tracking was based on an algorithm that defined three levels of compensation. BookSet, AdSet, and TightSet. All values were input on a chip and card.</p>
