  html: <p>It appears as though <a href="http://en.wikipedia.org/wiki/Ambigram" title="Click to visit an external URL." class="freelink freelink-external freelink-external">ambigrams</a> are becoming a popular design exercise. I have noticed a bit of difficulty distinguishing between <a href="http://en.wikipedia.org/wiki/Ambigram" title="Click to visit an external URL." class="freelink freelink-external freelink-external">ambigrams</a>, <a href="http://en.wikipedia.org/wiki/Palindrome" title="Click to visit an external URL." class="freelink freelink-external freelink-external">palindromes</a> and <a href="http://en.wikipedia.org/wiki/Palindrome#Semordnilaps" title="Click to visit an external URL." class="freelink freelink-external freelink-external">semordnilaps</a> (I think you need to scroll down to see semordnilap). I wonder if it’s possible to design an ambigram/palindrome or an ambigram/semordnilap?</p>
  html_clean: <p>It appears as though <a href="http://en.wikipedia.org/wiki/Ambigram" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">ambigrams</a> are becoming a popular design exercise. I have noticed a bit of difficulty distinguishing between <a href="http://en.wikipedia.org/wiki/Ambigram" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">ambigrams</a>, <a href="http://en.wikipedia.org/wiki/Palindrome" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">palindromes</a> and <a href="http://en.wikipedia.org/wiki/Palindrome#Semordnilaps" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">semordnilaps</a> (I think you need to scroll down to see semordnilap). I wonder if it’s possible to design an ambigram/palindrome or an ambigram/semordnilap?</p>
