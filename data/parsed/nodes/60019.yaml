  html: <p>It appears as though <a class="freelinking external" href="http://en.wikipedia.org/wiki/Ambigram" rel="nofollow">ambigrams</a> are becoming a popular design exercise. I have noticed a bit of difficulty distinguishing between <a class="freelinking external" href="http://en.wikipedia.org/wiki/Ambigram" rel="nofollow">ambigrams</a>, <a class="freelinking external" href="http://en.wikipedia.org/wiki/Palindrome" rel="nofollow">palindromes</a> and <a class="freelinking external" href="http://en.wikipedia.org/wiki/Palindrome#Semordnilaps" rel="nofollow">semordnilaps</a> (I think you need to scroll down to see semordnilap). I wonder if it’s possible to design an ambigram/palindrome or an ambigram/semordnilap?</p>
  html_clean: <p>It appears as though <a class="freelinking external link-external" href="http://en.wikipedia.org/wiki/Ambigram" rel="nofollow">ambigrams</a> are becoming a popular design exercise. I have noticed a bit of difficulty distinguishing between <a class="freelinking external link-external" href="http://en.wikipedia.org/wiki/Ambigram" rel="nofollow">ambigrams</a>, <a class="freelinking external link-external" href="http://en.wikipedia.org/wiki/Palindrome" rel="nofollow">palindromes</a> and <a class="freelinking external link-external" href="http://en.wikipedia.org/wiki/Palindrome#Semordnilaps" rel="nofollow">semordnilaps</a> (I think you need to scroll down to see semordnilap). I wonder if it’s possible to design an ambigram/palindrome or an ambigram/semordnilap?</p>
