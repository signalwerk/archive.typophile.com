  - id: 283528
    user: 10199
    date: 2008-06-11T15:57:00
    date_raw: 11 Jun 2008 — 3:57pm
    votes: null
    html: |-
      <p>Thanks Bert.</p>
      <p>iKern is (still) a service. It can't be purchased or licensed. The font files are reworked by Igino and then send back. It's not just a push on a button, because many variables are possible. We did some test runs to determin spacing (family wide) and the level (tight &lt;-&gt; loose) of kerning. In the process of the test runs I adjusted character shapes that needed a better fit. In the final release I adjusted a (very few) things manually. iKern makes it own classes for kerning and is extremely flexible. All still (fortunately) has to be judged by the human eye, but when decisions are made, all that is handled by iKern is in optical consistency truly great. For me it was a real time saver. It nearly felt that I only had to draw the glyphs ;-)</p>
    html_clean: |-
