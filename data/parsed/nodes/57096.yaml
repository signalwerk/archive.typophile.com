    <p><a href="http://tdc.org/tdc/archives/555" title="http://tdc.org/tdc/archives/555">http://tdc.org/tdc/archives/555</a> </p>
    <p>TDC Book Fair, Friday 29th May and Saturday 30th May.</p>
    <p>The Type Directors Club is pleased to announce the inaugural TDC Book Fair at our club office on West 36th Street. The fair is open to the general public Friday 29th May from 3pm to 9pm and Saturday 30th May from 11am to 5pm.</p>
    <p>This specialist book fair will include (but not be limited to) modern and antiquarian books on typography, the lettering arts, type specimens, printing arts, graphic design as well as books on books.</p>
    <p>Exhibitors currently scheduled to appear include Oak Knoll Books, Oaklander Books, Mark Batty Publishing. (Spaces still available, please contact; <a href="mailto:director@tdc.org">director@tdc.org</a>.)</p>
    <p>This is a rare opportunity to have so many specialist book dealers in one place at one time. Whether you just want to browse through their inventory, start your own library, expand your knowledge of type history or maybe you're just looking for a little inspiration, you'll find it here.</p>
    <p>We look forward to seeing you, complimentary coffee will be available.</p>
    <p>Entrance: Free for TDC Members, $15 for non-member, $10 for non-member students and seniors.</p>
