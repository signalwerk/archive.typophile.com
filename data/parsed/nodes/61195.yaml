      <p>Alternate Gothic, </p>
      <p>What you seeing is not featuring any stylistic affectation per se—just used that way. The “O” is actually Ø used in Norwegian languages and some (many ?) others.</p>
      <p>The Bitstream version seems to have the best kerning:<br>
      <a href="http://new.myfonts.com/fonts/bitstream/alternate-gothic/" title="http://new.myfonts.com/fonts/bitstream/alternate-gothic/">http://new.myfonts.com/fonts/bitstream/alternate-gothic/</a></p>
      <p>Mikey :-)</p>
