    <p>Hello All - </p>
    <p>Here’s a mysterious sample. A set of condensed capitals used on Underoath’s Survive Kaleidoscope album. The image is small, and doesn’t quite capture the types strange slanted terminals. It’s almost like an extrusion or a jackboot fraktur. </p>
    <p>Thanks for any ideas, and if I dig up more complete images I’ll add them.</p>
    <p>- Reed</p>
