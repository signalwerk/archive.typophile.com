      <p>I should point out that while Compositor is a great piece of code for working with Western OpenType fonts, it does not implement any of the script-specific OpenType Layout shaping engines, and is therefore useless for any languages that need them, e.g. Devanagari, Arabic, Hebrew, Syriac, Thai, Tamil etc. </p>
      <p>Adam</p>
