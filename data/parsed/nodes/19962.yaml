      <p>I’m glad to inform you that the Python Imaging Library version 1.1.6b1 now correctly supports Unicode-compatible text rendering using Type 1, TrueType and OpenType fonts. You cannot access OpenType Layout features, just plain Unicode codepoints, and of course you can only render bitmaps, not vectors. But it’s quite powerful and works really nice. </p>
      <p>I’ve worked with the library’s author Fredrik Lundh on a fix of a problem that causes PIL to crash on quite many fonts. The good news is that recently released version 1.1.6b1 does not have the problem anymore! </p>
      <p>You can get the newest build of PIL at:<br>
      <a href="http://effbot.org/zone/pil-changes-116.htm" title="http://effbot.org/zone/pil-changes-116.htm">http://effbot.org/zone/pil-changes-116.htm</a></p>
      <p>Regards,<br>
      Adam</p>
