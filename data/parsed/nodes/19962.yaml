      <p>In addition, there are some pretty useful ’third-party’ scripts.<br>
      Definitely I like Python more. Maybe the type department can convince the ID department that Python is worth being supported {natively}* too?&nbsp;&nbsp;;-)<br>
      Btw, the scripting reference mentions one OT feature which can be addressed by scripting but not by the UI. (Was it hist? Forgot which one, not at home yet to check.)</p>
      <p>Big ’but’: Despite of all nice things that scripting allows for, some automation should be available to non-scripters too. Like the data merge function which I read about only last week, though maybe a bit more powerful than it is. One cannot expect that soon every designer will find the time to learn JavaScript (or Python). I say this with ID as well as FLS in mind.</p>
      <p>Karsten</p>
      <p>* {edit: To my understanding, scripting InDesign in Python is kind of an add-on, which requires different solutions on Win and Mac (here it’s kind of Python ’clothes’ around AppleScript), and such Python scripts are not altogether platform compatible — which I would consider a must for a cross-platform application like InDesign.}</p>
