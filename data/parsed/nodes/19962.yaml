      <p>I’ve just returned from the <a href="http://www.indesignconference.co.uk/">InDesign Conference</a> <em>Half-Day Tutorial: Automating Page Layout with InDesign Scripting</em> talk given by Olav Martin Kvern, and I must say that it was simply brilliant.</p>
      <p>As I understood, it is possible to script *any* task in InDesign (CS2), which is quite remarkable. His JavaScript demos were very insightful and easy to follow. (Like Python, JavaScript is an object-oriented language, so the two are quite similar in may aspects). The ExtendScript Toolkit application (that comes with the CS2 Suite) also makes scripting much simple.</p>
      <p>I was simply amazed how one can enhance InDesign’s capabilities and batch process repetitive tasks quite easily. As anyone ever wished Photoshop’s <em>Contact Sheets</em> or Illustrator’s <em>Crop Marks</em> inside InDesign? Well, it’s actually all possible! Simply download <a href="http://www.adobe.com/products/indesign/xml_scripting.html#sresources">these ready-made scripts</a> and place them in [InDy folder]/Presets/Scripts/. Then it’s just a matter of bringing up the ’Scripts’ palette (Window-&gt;Automation-&gt;Scripts) and start clicking**. Definitely worth trying!</p>
      <p>Also worth following:<br>
      <a href="http://jsid.blogspot.com/">http://jsid.blogspot.com/</a><br>
      <a href="http://www.indesignsecrets.com/" title="http://www.indesignsecrets.com/">http://www.indesignsecrets.com/</a></p>
      <p>** The script “ImageCatalog.jsx” does the Photoshop-like function, and “CropMarks.jsx” the Illustrator-like one.</p>
    html_clean: |-
