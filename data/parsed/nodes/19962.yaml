      <p>&gt; <em>Maybe the type department can convince the ID department that Python is worth being supported {natively}* too?  ;-)</em></p>
      <p>I asked Olav Kvern about it. He said that the commitment is to support each platform’s native scripting language — AppleScript/Mac, VBScript/Windows — and one cross-platform language (JavaScript). Nonetheless, his opinion is that more languages should be supported, rather than less. His goal is to allow people to script in whichever language they’re more comfortable with. So, stay tuned :)</p>
      <p>&gt; <em>Btw, the scripting reference mentions one OT feature which can be addressed by scripting but not by the UI.</em></p>
      <p>This one, I believe:<br>
      <a href="http://partners.adobe.com/public/developer/opentype/index_tag6.html#hlig" title="http://partners.adobe.com/public/developer/opentype/index_tag6.html#hlig">http://partners.adobe.com/public/developer/opentype/index_tag6.html#hlig</a></p>
      <p>&gt; <em>Big ‘but’: Despite of all nice things that scripting allows for, some automation should be available to non-scripters too.</em></p>
      <p>Well, that’s debatable. We still don’t have <em>real</em> artificial intelligence, or computers that can read the ideas we have on our minds and simply execute them, so people will still have to do some of the work. The way things are made available (documentation, samples, drag-and-drop, double-clicking, code hinting, etc) effectively simplify a lot of the stuff, even for ’native’ non-scripters.</p>
      <p>I just think that people relate the word ’scripting’ to something that only computer scientists can do. While that was very true some time ago, nowadays things are much much simpler. People just haven’t got around to become aware of that, and to realise that a simple 5-line script, for example, can have a big impact on their daily work.</p>
      <p>Edit:<br>
      Hundreds of free scripts here <a href="http://share.studio.adobe.com/axBrowseSubmit.asp?t=54" title="http://share.studio.adobe.com/axBrowseSubmit.asp?t=54">http://share.studio.adobe.com/axBrowseSubmit.asp?t=54</a></p>
