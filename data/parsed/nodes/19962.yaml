      <p>Miguel Sousa wrote:<br>
      <cite>We still don’t have real artificial intelligence, or computers that can read the ideas we have on our minds and simply execute them, so people will still have to do some of the work. The way things are made available (documentation, samples, drag-and-drop, double-clicking, code hinting, etc) effectively simplify a lot of the stuff, even for ‘native’ non-scripters.<br>
      I just think that people relate the word ‘scripting’ to something that only computer scientists can do. While that was very true some time ago, nowadays things are much much simpler. People just haven’t got around to become aware of that, and to realise that a simple 5-line script, for example, can have a big impact on their daily work.</cite></p>
      <p>Oh, I don’t expect any <cite>intelligence</cite> from the applications’ side!</p>
      <p>Yet, one has to understand how scripting is supposed to work. On two levels, the scripting language, and the application’s own peculiarities. (InDesign example for the latter: deal with script UI and defaults in units other than inch/point.) If it just were: grab some elements and copy/paste, this would be nice. But, despite some great sources, this is not really possible.</p>
      <p>One obstacle may indeed be designers’ fear of scripting. Maybe fear of working systematically, too?&nbsp;&nbsp;;-)</p>
      <p>Karsten</p>
