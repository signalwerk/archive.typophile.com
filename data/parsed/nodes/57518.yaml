    <p>I started up a critique thread for another new font:<br>
    <a class="freelinking external" href="http://typophile.com/node/57348" rel="nofollow">CodePeanut</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CodePeanut1-simple_5702.png"></div><p></p>
    <p>It looks like an abstract blobby mess but it's actually based on Morse code. It should be able to be read easily by someone with the right training once they realize what they're looking at, but remain just a series of undulating streaks and dots to those not in the know. Tell me what you think over there.</p>
