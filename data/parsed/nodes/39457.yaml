      <p><cite>Gruß nach Berlin. Wie war Dortmund?</cite><br>
      Danke! Focus war klasse; die Studis dort haben eine Veranstaltung auf die Beine gestellt, sowas hab ich noch nicht gesehen … Ausstellungsgestaltung mit Containern im Freiraum – aus der Not geboren, aber toll. Das ganze Gebäude mit Pappkartons (Thema war ja ›Standard‹) dekoriert und aufgesprühten neon-orangen Piktogrammen ausgeschildert. Top-Service mit Schlafplätzen, warmen Essen und Getränken; also echt eine Superorganisation insgesamt. Und natürlich die Vorträge/Workshops! Viele gute Namen, hast ja vermutlich gelesen. Gertrud Nolte war z.B. sehr sehenswert. Wermutstropfen war nur, dass ich mittendrin schon wieder abreisen musste.<br>
      Gruß nach F!<br>
      F</p>
