    html: <p>And then there's the heirs to Russian Constructivism with contemporary interpretations. Mark van Wageningen's <b>Gagarin</b> family at <a href="http://www.2rebels.com/" target="_blank"> 2Rebels</a> and Pierre di Sciullo's <b>FF Minimum</b> from the <a href="http://www.fontfont.com/shop/" target="_blank"> FontFont Collection</a> are interesting takes on the subject. And the very constructivist <b>FF Marten</b> by Marten Wenzel, also a <a href="http://www.fontfont.com/shop/" target="_blank"> FontFont</a>, has a cyrillic variant.</p>
    html_clean: <p>And then there's the heirs to Russian Constructivism with contemporary interpretations. Mark van Wageningen's <b>Gagarin</b> family at <a href="http://www.2rebels.com/" target="_blank" class="link-external"> 2Rebels</a> and Pierre di Sciullo's <b>FF Minimum</b> from the <a href="http://www.fontfont.com/shop/" target="_blank" class="link-external"> FontFont Collection</a> are interesting takes on the subject. And the very constructivist <b>FF Marten</b> by Marten Wenzel, also a <a href="http://www.fontfont.com/shop/" target="_blank" class="link-external"> FontFont</a>, has a cyrillic variant.</p>
