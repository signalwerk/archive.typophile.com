      <p>It seems that you can use .otf fonts as input for <code>mergeFonts</code> after all. The output will be a font in CFF format, which you can then convert to Type 1 using <code>tx</code>.<br>
      Therefore, you can do,<br>
      <code>mergeFonts output.cff basicfont.otf glyphlist expertfont.otf</code><br>
      and then,<br>
      <code>tx -t1 output.cff &gt; output.pfa</code></p>
