    <p>I'm working on some of this <a href="/wiki/AFDKO" class="freelinking" rel="nofollow">AFDKO</a> stuff again, and I have a few questions as to how production goes along.</p>
    <p>1) How do you typically create the GlyphOrderAndAliasDB file? Specifically, let's say that you're using Fontlab in names mode. What I've been doing is using the "print all glyphs" macro, then cleaning the text up by removing the line numbers. There has GOT to be an easier way to get a complete glyph list to create the DB, since I know something like the 3000+ glyph Arno Pro wasn't hashed out by hand the hard way.</p>
    <p>What program or command line program is the best solution? And what programming tools are useful in creating the basic file components used the creation of an opentype font via the AFDKO procedures laid out by Miguel Sousa at TypoTechnica?</p>
    <p>2) Just for practice, I'm trying to merge two ttf files together into one otf. One file is the standard U&amp;lc and the other is the expert set with small caps. I'm looking at the mergeFonts tutorial, and it shows that I need to create a mapping file using, guess what, a glyph names list. </p>
    <p>Assuming I correctly map the names of the expert set, i.e., s to s.smcp, I should then be able to merge both fonts together into a single .otf file. That final otf file won't contain class metrics or features, but having all of the glyphs together in one file is a start. Am I correct in how I've interpreted the instructions?</p>
    <p>Thanks for all of the help!</p>
