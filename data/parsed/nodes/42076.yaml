      <p>&gt; <em>How do you typically create the GlyphOrderAndAliasDB file?</em></p>
      <p>What I usually do is to start with an existing GlyphOrderAndAliasDB file and add/remove entries as necessary. (For instance, the one used for Arno Pro was derived from the one used for Garamond Premier Pro, which in turn had been derived from something before). You can, for example, start with the sample file available in the FDK (FDK/Tools/SharedData/GlyphOrderAndAliasDB), or the one present in the ExampleRomanFonts.zip file.<br>
      What we do at Adobe is a mix of using data from existing files, and running our own scripts on the file AGD.txt (FDK/Tools/SharedData/AGD.txt).</p>
      <p>Alternatively, you can write your own, which sounds like what you're trying to do. Writing a GlyphOrderAndAliasDB file might require some hand work the first time, but the good thing is that once you have it you can use the same file for other projects (as is, or with minor changes).</p>
      <p>If you're using Fontlab, what you can do is to switch to "Index mode", rearrange the order of the glyphs, and then run this little Python program,<br>
      <code>for g in fl.font.glyphs:<br>
      &nbsp;&nbsp;&nbsp;print g.name<br>
      </code><br>
      You can then use the outputted list for building your own GlyphOrderAndAliasDB. For that, you will eventually need a good text editor and a spreadsheet program.<br>
      In case your final font does not require any glyph name changes --which means you're using final glyph names in the development process--, you can replace the second line of the code above by,<br>
      <code>&nbsp;&nbsp;&nbsp;print "%s\t%s" % (g.name, g.name)</code><br>
      which will output two columns of glyph names.</p>
      <p>MakeOTF knows how to map standard glyph names --AGL glyph names and uniXXXX-style glyph names-- to Unicode values, so normally you won't need to have a third column in the GlyphOrderAndAliasDB file.</p>
      <p>Another thing I normally do is to extract the second column of the GlyphOrderAndAliasDB file, and use that data to create a FontLab encoding file (.enc). Then, in "Names mode", I use Glyph &gt; Sort Glyphs &gt; By Encoding, and upon switching to "Index mode" I get all the glyphs neatly ordered.</p>
      <p>Keep in mind that it's not mandatory for the GlyphOrderAndAliasDB file to have all the glyphs present in the source font. The data on that file is mainly used for controlling the glyph order on the final font, and to rename glyphs from production name to final (standard) name. If a glyph is in the source font but not in the GlyphOrderAndAliasDB file, it will simply be put at the end on the final font, and its glyph name will remain the same. (NOTE: It's *highly* un-recommend, but MakeOTF will build your font even if the only entry in the GlyphOrderAndAliasDB file is the '.notdef')</p>
      <p>Additionally, you can use the same GlyphOrderAndAliasDB file for your upright and italic fonts, even if their glyph set is not exactly the same. This allows you to maintain the same overall glyph order within all the fonts in the family. For example, in Arno Pro the italics have a bunch of swash glyphs which aren't present in the uprights. Nonetheless, the same GlyphOrderAndAliasDB file was used for both; MakeOTF simply skipped the entries that didn't apply.</p>
