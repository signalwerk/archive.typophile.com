    html: |-
      <p>&gt; <em>Just for practice, I’m trying to merge two ttf files together into one otf.</em></p>
      <p>I'm not sure mergeFonts works with TT or OT fonts. I believe it expects a name-keyed or CID-keyed Type 1 font, and it outputs those same formats. So, if you want to use mergeFonts to merge a "basic" font and an "expert" font into a single font, you need to convert the source fonts into Type 1 and then run this command,<br>
      <code>mergeFonts output.pfa basicfont.pfa glyphlist expertfont.pfa</code></p>
      <p>which will create the merged font (output.pfa). The <code>glyphlist</code> file is a simple text file containing entries for renaming the glyphs coming from the <code>expertfont.pfa</code> file. Its content can be something like,<br>
      <code>mergeFonts<br>
      a.sc&nbsp;&nbsp;&nbsp;Asmall<br>
      b.sc&nbsp;&nbsp;&nbsp;Bsmall<br>
      c.sc&nbsp;&nbsp;&nbsp;Csmall</code></p>
      <p>mergeFonts was created mainly for usage in CJK font development. The raw CID-keyed fonts used as source for the final OTF fonts are normally assembled by merging a few dozen Type 1 fonts, using mergeFonts.</p>
