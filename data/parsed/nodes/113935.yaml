    html: |-
      <p>Hi Rich,</p>
      <p>Data uri for fonts is supported since IE9 when we introduced full support for @font-face rules. Some webfont providers serve fonts this way for a long time.<br>
      There is nothing special about data uri in regards to fonts. They are just data blobs and processed as regular externally downloaded file, it doesn't matter what format is actually inside it. There was a limitation of 32k on data uri size in IE8, but in IE9 it was removed.<br>
      Is this information helpful?<br>
      Thanks,<br>
      Sergey</p>
