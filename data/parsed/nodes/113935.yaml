      <p>&gt;Is this information helpful?</p>
      <p>Hey Sergey...</p>
      <p>Yes, it's very helpful. Thanks. </p>
      <p>To the extent that I can, I like to write web font test pages that have everything necessary written into the page with no need for supporting CSS or JS files.<br>
      So embedding a font using a Data URI is indeed useful.<br>
      It's been available since IE9?  Wow - I'll bet a lot of developers have absolutely no idea that's the case and are feeding all versions of IE either an EOT, a WOFF, or a TTF file thinking they absolutely must do so.</p>
      <p>Thanks again.</p>
      <p>Rich</p>
