    <p>Does anybody know what's up with using Data URLS for embedded fonts in Internet Explorer?<br>
    (Si, I'm lookin' at you, kiddo.)</p>
    <p>I've noticed that Data URLS are supported in IE 11 - or so my webfont test pages tell me.</p>
    <p>(If you're unfamiliar with them, data urls in a @font-face CSS declaration use base 64 encoding and look like this:<br>
    @font-face{font-family:'backdrop';src:url(data:font/woff;charset=utf-8;base64,d09GRgABAAAAAAo.....}</p>
    <p>But oddly, I've heard nothing about it via the grapevine. No blog posts mentioning it, no twitterin', nothin'. </p>
    <p>Did support start prior to IE 11 or is IE 11 the first version to do so? Are there any limitations like the size of the data? Is the format an issue - will TTF, OTF,  WOFF and EOT all work?</p>
    <p>Are there any support docs explaining it? (If so, they seem to be buried deep - I don't see Data URLS for fonts mentioned at all  in the usual places on the Microsoft Developer Network where you'd expect to find it.)</p>
    <p>Any help appreciated.</p>
    <p>rich</p>
