    html: |-
      <p>Weiwauters is mistaken. The icon in the upper right corner of each post is ostensibly a “bookmark” for marking a thread (and thus adding it to My Marks, which can be accessed via the link under your login status at the top of the sidebar).</p>
      <p>I don’t know why the tool tip says “Vote up!” since this isn’t a voting button. I suspect that’s a mistake (probably from copying a previous bit of code related to a short-lived experiment with a voting module). I’ll bring it to the attention of the Punchcut folks.</p>
      <p>I can tell you that using the mark feature will not help with spam, since I won’t ever see your marks.</p>
      <p>There was a brief period when Punchcut experimented with a spam marking feature, but I don’t know what happened to it. I can’t honestly recall whether it worked well, since that was before I volunteered to be janitor on the site.</p>
      <p>Such a feature might be helpful, but I can imagine it would also be subject to abuse. If you seriously want Punchcut to add the feature, I suggest starting a thread in the <a href="http://typophile.com/forum/1343" rel="nofollow">Bug Reports and Feature Requests</a> forum.</p>
      <p>Believe it or not, these occasional bouts of spam comments are actually only the tip of the iceberg. You guys don’t see even a third of the spamming that goes on. Most of it gets caught and shunted off, to be dealt with by us volunteers out of public view.</p>
      <p>The Comments sections are the most vulnerable to these spam fits because we don’t have the Akismet Antispam module filtering the comments. It is still too prone to false positives, and filtering all comments right now would bog down the free flow of conversations.</p>
      <p>I check the General Discussions, Design, and Blog forums every morning and clear spam and block spam accounts. I also usually comb through a couple more times during the day. Sometimes I do a spot check through the entire Comments section in the Admin. I think Florian checks the Type ID forums regularly.</p>
      <p>But if you happen to spend your time on Typophile before I get up and come online, then you probably will end up seeing a fair bit of the overnight spam. </p>
      <p>For whatever reason, there are a few individual threads that have become spam magnets and are usual suspects for spamming. These spam bots seem to follow each other around or something. Also, commenting on spam seems to exacerbate the situation and increase the likelihood that a thread will become the target of future spamming. (Also, the comments look silly once the original spam has been cleared out.)</p>
