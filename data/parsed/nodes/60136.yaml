      <p>several things:</p>
      <p>Colophons in Latin America may be a legacy of Spanish colonial laws that required the printer be named in all printed books. This was not to give credit where credit was due, but was one more way for authorities to try to keep track of who was writing what. I'm not sure how long these laws were in place in which countries, but I'm fairly sure of the origin. maybe some of our friends in Latin America can help us. </p>
      <p>Bimbo Monotone was featured in a colophon written by the one-and-only Alastair Johnston of Poltroon Press in Berkeley. I do not know the book in which it appeared. I have it taped to te back of office door. In the cool months I see it every day as I hang up my jacket in the morning and again as I leave at night. It is a good reminder to take very little seriously.</p>
      <p>Knopf still puts a colophon in most of its books.</p>
      <p>powers</p>
