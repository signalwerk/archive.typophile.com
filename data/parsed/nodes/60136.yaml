      <p>Often the use of colophons in 20th-century American books is credited to book and type designer William Addison Dwiggins (WAD). Among large American publishers, the house of Alfred Knopf has most frequently included colophons in their books, with info about the type, the name of the book designer, and the name of the printing company.</p>
      <p>But if you want to see some colophons, go to a library that has a good collection of American "fine printing" of the 60s, 70s, 80s. Colophons in these books often ramble on, telling who made the paper, who designed and cut and cast the type, who set the type, what press the book was printed on, when the press was made, what the weather was like, when the cat died. On and on. &amp; I'm not joking about the cat; I cannot recall book or publisher, but the colophon told about the cat's passing. Some are like short stories. Some are pretentious as hell. Some have useful info.</p>
      <p>*******<br>
      In our era, when everyone has or "knows about" "fonts," more people are taking notice at least of typeface mention in colophons.</p>
      <p>At this press, we put colophons in most of our books. This helps our freelance designers get their names out into the world, and thus get more jobs. I can attest that happens. It also allows, us when appropriate, to note anything special about the paper we use.</p>
      <p>Many people think colophons are pretentious, glorifying matters no one cares about. I feel they help acknowledge good work.</p>
      <p>powers</p>
