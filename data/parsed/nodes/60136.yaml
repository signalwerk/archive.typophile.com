      <p>O’Reilly Media Inc., the computer book publisher, puts colophons in its books. I grabbed the one closest to me at the moment (<em>Twisted Network Programming Essentials</em> by Abe Fettig) and found that its colophon was two pages long.</p>
      <p>That particular colophon described the picture on the cover (an engraving of a ball of snakes in a mating frenzy), including a lot of biological details that would appeal more to a herpetologist than an computer scientist. It then listed the production editor, copy editor, proofreader, quality control staff, index writer, cover designer, cover design software, and cover typeface. It then went on to list the interior designer, text font, heading font, and code font; then the illustration artists and the software they used. Finally it named the author of the colophon itself.</p>
      <p>About all they seemed to leave out was the blood types and shoe sizes of the people involved. :-)</p>
      <p>Jim Tubman<br>
      Calgary, Alberta, Canada<br>
      "The Stampede City"</p>
