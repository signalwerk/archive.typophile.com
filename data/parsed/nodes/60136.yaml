      <p>A colophon that is quite informational about a font and that also feels personal is the one in  Lawson's book (copyright 1990):</p>
      <p><strong>Anatomy of a Typeface</strong> was set in Galliard, a typeface designed by Matthew Carter and introduced in 1978 by the Mergenthaler Linotype Company. Based on the types created by Robert Granjon in the sixteenth century, Galliard is the first of its genre to be designed exclusively for phototypesetting. A type of solid weight, it possesses an authentic sparkle that is lacking from current Garamonds. The italic is particularly felicitous and reaches back to the feeling of the chancery style, from which Claude Garamond's italic departed.</p>
      <p>I don't know if what follows is to be considered part of the colophon or not (set in italics).</p>
      <p><cite>Printed by the Maple-Vail Book Manufacturing Group, Binghamton, New York, on Glatfelter Offset Smooth Eggshell.</cite></p>
      <p>Michel</p>
