      <p><cite>You agree to identify the Emigre fonts by name and credit Emigre's ownership of the trademarks and copyrights in any design or production credits.</cite> — <a href="http://www.emigre.com/EULOptions.php" rel="nofollow">Emigre</a></p>
      <p><cite>The user of this House Industries font software agrees to credit House Industries as the trademark and copyright owner of the House Industries fonts and list the font names, wherever and whenever design, production, or any other credits are shown.</cite> — <a href="http://www.houseind.com/fonts/licensing/eula" rel="nofollow">House Industries</a> (<a href="http://www.letterror.com/catalog/fontlicense.html" rel="nofollow">Letterror</a> uses the same phrase)</p>
      <p><cite>If your printed publications contain an imprint, the names of the font and the foundry have to be mentioned, e.g. ‘Type set in “Fontname” from LucasFonts’.</cite> — <a href="http://www.lucasfonts.com/support/license-agreement/" rel="nofollow">LucasFonts</a></p>
      <p>IMHO, these clauses are rather wishful thinking. I wouldn’t take them too serious. At least, I haven’t heard of a case where this claim was enforced. <em>If</em> there is a colophon, I will gladly mention the fonts and give credit to the type designer – irrespective if the EULA asks for it or not.</p>
