      <p>Here are a few ones from my computer science books</p>
      <dl>
      <dt>1978</dt>
      <dd>This book was typeset in Times Roman and Courier 12 by the authors,using a Graphic Systems phototypesetter driven by a PDP-11/70 under the UNIX operating system.</dd>
      <dt>1984</dt>
      <dd>This book was typeset in Times Roman and Courier by the authors, using a Mergenthaler Linotron 202 typesetter driven by a VAX-11/750 running in the 8th Edition of the UNIX operating system.</dd>
      <dt>1999</dt>
      <dd>This book was typeset (<code>grap|pic|tbl|eqn|troff -mpm</code>) in Times and Lucida Sans Typewriter by the authors.</dd>
      </dl>
      <p>But, in the meantime, TeX was supplanting troff. I find this one quite interesting:</p>
      <dl>
      <dt>1986</dt>
      <dd>This book was set in TeX by Sarah Fliegelmann at the Weizmann Institute of Science and printed and bound by The MIT Press in the United States of America.</dd>
      </dl>
      <p>Of course, useless to say that the Weizmann Institute is in Israel and that the font is Computer Modern. Though shouldst know!</p>
      <p>Michel</p>
