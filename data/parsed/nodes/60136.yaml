      <p>Some aspects of those colophon statements about Electra seem to be paraphrased directly from Mergenthaler's original promotional copy. That's very likely where Knopf's note originated, which was then passed on from title to title through generations of editors, designers &amp; production managers.</p>
      <p>From the original Electra specimen:</p>
      <p>——————</p>
      <p>ADVERTISEMENT</p>
      <p>This pamphlet is the announcement of a new Linotype face to be called “Electra,” cut from designs drawn for The Mergenthaler Linotype Company by W. A. Dwiggins. The face — at this stage completed in twelve point, roman and italic — provides a new type texture for book-page composition. In the larger sizes now in preparation it will furnish the printer with a new note in advertising typography.<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;The face, as may be seen from this specimen, falls within the “modern” family of type styles, but is drawn to avoid the extreme contrast between “thick” and “thin” elements that marks most “modern” faces. The design is not based upon any traditional model, and is not an attempt to revive or to reconstruct any historic type. What the letter-draughtsman aimed to do is indirectly developed in the following:</p>
      <p>——————</p>
