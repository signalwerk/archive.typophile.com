      <p>&lt;&lt;  “Typeset by M Rules in Caslon”.  &gt;&gt;</p>
      <p>To which I would ask "WHICH Caslon?"</p>
      <p>I see colophons that list such things as "A Garamond" or "Dante MT." We here at Typophile may well know what "A" means in this context, and what "MT" means. But the general reader does not, and will likely not go to the trouble to dig up that info. These sort of attributions give readers both too much info and not enough info, all at the same time.</p>
      <p>******<br>
      Let me add to my earlier post: in our colophons we give the typeface name and almost always the name of the typeface designer. I think it has helped draw some attention to new types (which we try diligently to use).</p>
      <p>powers</p>
