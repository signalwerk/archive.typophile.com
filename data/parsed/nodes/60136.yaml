      <p><cite> &gt; I’d always believed a colophon was the page at the front of the book </cite></p>
      <p>"Colophon" derives from the Greek, meaning "finishing touch." So it typically refers to a statement at the very end of a book which gives information about its production.</p>
      <p>"A Note about the Type" was a typical heading used by A. A. Knopf, which was/is probably the most prominent publisher to regularly include a colophon in trade editions (as opposed to fine print editions, where the practice is practically <em>de rigueur</em>). Even so, Knopf would usually include information about the design, composition, printing, and binding in the statement also.</p>
      <p>Knopf has continued to include Type Notes, but pretty much dropped the crediting of other aspects of production in the colophon.</p>
      <p>"About the Author" statements are usually considered distinct from a colophon, even though they often appear in a similar position at the end of a book. But sometimes the two types of statements are combined.</p>
    html_clean: |-
