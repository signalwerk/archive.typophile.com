      <p>The old Adobe PostScript manuals (the famous "Red", "Green", and "Blue" books) and the huge PostScript Reference had nice colophons.<br>
      It introduced itself by explaining the term 'colophon', and went on (and on) with a list of software, fonts, and hardware used to produce the books.</p>
      <p>From the Blue book:</p>
      <p>"Camera-ready copy for this book was created entirely with POSTSCRIPT and printed on a Linotron 101 at Adobe Systems Incorporated. The book was created with the aid of the Scribe Document Production System (a product of UNILOGIC, Ltd.) as a Scribe document definition. The illustrations were POSTSCRIPT program segments which Scribe integrated and placed on the pages along with the formatted text portions."</p>
      <p>[etc. etc.]</p>
