      <p>What an interesting thread.</p>
      <p>Here is my only attempt at devising a colophon, which appeared at the end of Multimedia Language Teaching, Logos international (1996).<br>
       I edited and typeset the book as well. Self-glorification, perhaps, but many people commented on it and had never seen a colophon before.</p>
      <p>I used Columbus, a font just released by Monotype, at the time still producing high quality fonts, but ultimately doomed to perish in the digital era. Once a great foundry; now just a faint memory for  most people.</p>
      <p>My use of the font had a purposeful connection with the book, as I explain in the colophon.<br>
      Oh, and the little ship is one of the very elegant ornaments included with the typeface.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/MMLT_colophon_sm_3985.gif"></div><p></p>
