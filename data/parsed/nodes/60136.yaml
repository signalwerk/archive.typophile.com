      <p>I love the Colophon! At the publisher I used to work for, we didn't do a formal colophon but we always credited the designer, typesetter (if separate), editor, production editor, and production manager. We also listed the fonts but that was a practical consideration. Often the book was reprinted many years later and it was a useful reference for what font(s) had been used.</p>
      <p>I have never noticed a license that requires the designer to list the font, that seems like chutzpah to me. OTOH I don't read most licenses to the letter (sorry Tiff!).</p>
