    <p>The most peculiar thing happened to me this past May. </p>
    <p>I was reading Brad Land's <cite>Goat: a memoir</cite>, an autobiographical entry about Mr. Land's experience with the Kappa Alpha fraternity at Clemson University. Interesting and engaging. Unique style of writing as well.</p>
    <p>But what was the most interesting part of the book was when after I turned the final page, to my surprise I found a page that discussed and explained the choice of type! The choice was Sabon, and it was a tiny little paragraph explaining  the type, as well the reason it was used.  For the highly curious: I have the book. I can scan in the spread if you desire.</p>
    <p>Can anyone here fathom why this was done? I'd actually like to see it more often, as I found it interesting, and a great way to expose the layperson to type. But it's the first—and only time—I've seen such attention given to the choice of typeface.</p>
