    html: <p>I like it. It feels like text from a tray on a boeing 727. Here are some ideas. What about dropping the cross bar of the A just slightly lower? What you have done to the S give it more charisma than the other glyphs have. Particularly the M &amp; W. I am not sure how but perhaps you can spead some of that goodness around. I like the Alt Glyphs too.</p>
  - id: 183431
    user_id: 16659
    user_name: Raphael Daudelin
    user_path: null
    date_raw: 7 Feb 2007 — 11:19pm
    date: 2007-02-07T23:19:00
    votes: null
    html: |-
      <p>Dear sgh</p>
      <p>I'm not able to explain it in a rational way. To me type design has something really intuitive. I think that I tried to make the curves of the first S almost the same, probably thinking the result would be more coherent to all the other characters. What happened is that the first S was too rigid. In the new S, curve 1 is related to curve 4, while curve 2 is related to curve 3: the result is more fluent. </p>
      <p>I don't have the recipe of what makes a good S. Usually, my first sketches are always rolling forward or backward. But, what's important is: trust your eyes. If you're lost because your working at it for too long, put it aside and come back later or ask someone. </p>
      <p>I hope this comment helped.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/FEEDMono-S2_6399.jpg"></div><p></p>
