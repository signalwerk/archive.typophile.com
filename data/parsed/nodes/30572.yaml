    date_raw: 14 Jan 2007 — 7:44am
    votes: null
    html: "<p>I don't know about quotes, but just about everything you can safely say about the life and work of Garamond (or Garamont if you prefer) is in John Lane's essay on 'Claude Garamont and his roman type' which is in the specimen that Adobe put out in 2005 with the title <em>Garamond Premier Pro: A Contemporary Adaptation</em>. I don't know how you get it, but it's a stunning piece of historical work, very well illustrated, and in English too.</p>"
    html_clean: "<p>I don't know about quotes, but just about everything you can safely say about the life and work of Garamond (or Garamont if you prefer) is in John Lane's essay on 'Claude Garamont and his roman type' which is in the specimen that Adobe put out in 2005 with the title <em>Garamond Premier Pro: A Contemporary Adaptation</em>. I don't know how you get it, but it's a stunning piece of historical work, very well illustrated, and in English too.</p>"
