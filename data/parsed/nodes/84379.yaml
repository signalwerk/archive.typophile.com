  html: <p>Hello, i have been looking for some information on the origins of the monospaced fonts, the things i find on the internet appear to be very basic. if any of you could post links to serious research done on them or good reliable information on monospaced fonts like the origins and creation, etc. i would be really grateful. thank you very much and happy summer holidays!</p>
