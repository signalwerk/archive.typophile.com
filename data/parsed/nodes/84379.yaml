    html: <p>Perhaps it's because I have never used a typewriter, but monospaced fonts always remind me of computer screens of the 80's? Now, I wonder, did the people who made computers had the monospaced fonts in their systems on purpose, because of the screen capabilities or maybe monospaced pixel fonts were easy to make for them and that's why they used those kind of fonts. Or, maybe it was the screens that showed the fonts monospaced and pixel like?</p>
