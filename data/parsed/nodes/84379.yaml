    html: <p>In handset type, as well as Linotype and Monotype, numerals intended for use in tabular matter (as in an annual report) were monospaced so that the columns would align regardless of which numeral you put in them. Monospaced numerals like this were referred to as "lining figures," to distinguish them from "old style figures." The latter have ascenders and descenders and variable set widths, and were designed for use within text paragraphs.</p>
