    html: |-
      <p>I'm not sure that this really counts, but while not all fonts of initials are monospaced, some are, with every letter being placed in a decorated square box. That might be the only instance of a monospaced typeface being created before there were typewriters to imitate.</p>
      <p>I do remember from a type specimen book a monospaced typeface that was <em>not</em> created to imitate a typewriter. It was called "mailing list type".</p>
      <p>Page 537 of the Pacific Type Specimen book from ATF in 1896 shows it.</p>
