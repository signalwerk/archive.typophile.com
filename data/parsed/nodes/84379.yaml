    html: |-
      <p>Early computer screens generally used monospaced character displays. It simplified the software and hardware, which was not very fast and had very little memory compared to modern computers. This "character mode" was usually the default. The character shapes were hard-coded into the hardware. Displays were advertised as having, say, an "80-column display", meaning you could fit 80 characters across the screen (usually about 24 lines). The size was usually fixed, although sometimes there were "low res" modes that doubled the height and/or width of the characters.</p>
      <p>In some computer systems (maybe most?) you could change out the default character designs to a set that was stored in memory, but this meant you had less memory for programs. Usually, you only did this for games or graphics programs.</p>
      <p>Proportional fonts and other sizes were possible if you programmed the computer to use its "graphics mode", which let you draw arbitrary images on the display and address each pixel independently (you could only address characters in character mode). However, this used a lot more memory and was a lot slower than character mode. </p>
      <p>There were computers in the '70s and early '80s that had proportional fonts, such as the Xerox Alto and preview displays for computer typesetting front-ends. There were also graphics programs for the IBM PC and Apple II that let you work with proportional fonts for word processing and graphics. The Mac (1984) was the first popular personal computer to use proportional, arbitrarily sized fonts by default (no character mode--graphics mode only!), but it also included a monospaced font (Monaco). (I seem to recall that some reviewers knocked it for not having an "80-column display".)</p>
      <p>One thing that was probably also a factor in favor of monospaced fonts in early computers: Before CRT displays were economically feasible, you usually interacted with the computer using a teletype terminal. This was basically an electric typewriter that could transmit and receive character codes to and from the computer. It was natural (and technically easier) to emulate the monospaced typewriter output on the CRT display, rather than emulate typesetting.</p>
