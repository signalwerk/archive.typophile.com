    html: |-
      <p>In western typography, perhaps the first monospaced fonts were indeed in imitation of typewriters. Certainly I've seen such in early ATF specimen books (circa 1900).</p>
      <p>But if one looks to Asian ideographic fonts used for Chinese, Japanese or perhaps Korean, I would expect you'd see monospaced fonts centuries earlier. I don't know if those are interesting for your purpose.</p>
