    html: |-
      <p>Like oldnick said, they came about because typewriters and early printers were easier to manufacture if they just spaced the letters out evenly.</p>
      <p>Those early devices weren't designed to create elegant layouts with fine-tuned spacing; they were just a way to get words on a page.</p>
