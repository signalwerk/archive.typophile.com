    html: |-
      <p>I'll just note that artificially extending a typeface is generally less horrific than artificially condensing. The reason being the thick-to-thin balance. Optically, higher contrast between verticals (thicks) and horizontals (thins) is usually okay, but reversing that contrast is a Bad Thing.</p>
      <p>While I don't like to squish or stretch type at all, my rule of thumb would be more like 95%-120% is the reasonably safe range.</p>
      <p>The other special problem is the letter "S," which just does not survive such manipulations very well. Depends a bit on the typeface, but....</p>
      <p>T</p>
