    html: |-
      <p>You're right about artificially extending fonts. A good rule of thumb is to include a picture of a face (preferably yours) and scale it along with the font. As long as the face doesn't look distorted, you're probably OK. Usually you can scale between 95 - 105% without it being too noticeable.</p>
      <p>I can't really think of too many extended serifs. You might want to try Engravers Roman, Americana, Newtext, or even Copperplate Gothic, although none of them look like your sample. If you want to go for a slab serif, Hellenic Wide could do the trick. Also, Black/Extra Bold weights of serif fonts tend to be wider than their regular counterparts.</p>
      <p> - Lex</p>
