  html: |-
    <p>The February edition of the Metal Type newsletter is now out. Click this link to take a look at the video: <a href="http://j.mp/k5KA95" title="http://j.mp/k5KA95">http://j.mp/k5KA95</a></p>
    <p>As well as me telling you what's new on the site the video also shows an Adana 8X5 table-top platen that has been converted to hot foil printing. I recently bought the machine on Ebay in a non-working state, and I am in the process of getting it up and running.</p>
    <p>If you don't already get newsletters from Metal Type, you can subscribe here: <a href="http://bit.ly/n3wkjc" title="http://bit.ly/n3wkjc">http://bit.ly/n3wkjc</a></p>
    <p>Want to start printing letterpress at home? Get First Steps in Letterpress: <a href="http://j.mp/W5M8F3" title="http://j.mp/W5M8F3">http://j.mp/W5M8F3</a></p>
    <p>All the Best<br>
    Dave Hughes<br>
    York, UK</p>
