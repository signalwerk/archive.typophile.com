    <p>Hi all!</p>
    <p>I've been in a DIN mood for a while now and I've paired it with some serifs, and even used it on it's own. But I'm having a hard time coming up with a new serif to go well with it.</p>
    <p>It's the client's corporate typeface and is a must. I'm using it for a construction company's corporate brochure.</p>
    <p>Any ideas out there?</p>
    <p>Many thanks!!</p>
