      <p>Thanks for the replies (and the latex support!). Otf fonts could (and maybe they do) include both an uppercase and lowercase @. Xetex I know—and I’m sure the commercial layout applications too—can select between upper and lowercase glyphs; Adobe Garamond Pro, for example, has an uppercase hyphen.</p>
      <p>A tangential question is parentheses with lining numerals: move those up a skosh?</p>
