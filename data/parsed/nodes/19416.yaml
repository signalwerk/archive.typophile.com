  html: |-
    <p>I was wondering if anyone had any guidelines they used for typesetting the @ in e-mail addresses. I really don’t much like the look of the placement of the @-sign in many fonts, and I’m not so sure about the size either. It looks more like it was designed for the previous usage as the commercial “each” where it would stand alone.</p>
    <p>Below are three iterations of an e-mail address in 9pt Palatino typeset with latex. The top one is straight out of the box (except for a \kern0.5pt between the @ and the c). The second one is the same size, but lowered 0.25ex to approximately center the a in the @ with the x-height. The third one has the @ at 8pt and lowered 0.15ex for the same positioning. The c following the @ might have a lot to do with my problem with the typesetting.</p>
    <p></p><div class="imageWrap"><img src="files/at-signs.png"></div><p></p>
    <p>I’ve also experimented with aligning the top of the @ with the midline, and the bottom of the @ with the baseline and I’m kind of torn. The reactions I get are one of two: “Whatever” or “Suck up and deal with the @ you’re given.” I was hoping this would be a more constructive if not congenial forum. So is there anything people usually do with large high @’s?</p>
