  html: <p>i am using some self-designed bitmap typefaces in  <br>a html-based website. my intention is to have the  <br>fonts available in the site by using microsoft  <br>weft (font embedding tool for web) technology.  <br>it generates compressed font objects (.eot) from  <br>the original type-files and uploads them to the  <br>server with the website. <br> <br>before generating the font objects, weft makes a  <br>list of fonts used on the site, and shows some  <br>attributes of these fonts. the fonts i designed  <br>are classified as "not-embeddable", and the  <br>software can't make font objects out of them. <br> <br>i used fontographer 4.1 (pc) to generate the  <br>fonts. i couldn</p>
