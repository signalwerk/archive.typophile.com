    html: <p>Fontographer has a long standing bug that incorrectly sets the fstype selection field bits. Different software interprets the mangled result in different ways, and it is possible that Weft prevents embedding of such fonts. Your best bet is to get a copy of <a href="http://www.fontlab.com">FontLab or TypeTool</a>, but you may also be able to correctly set the fstype selection field using <a href="http://www.high-logic.com/fcp.html">FontCreator</a>.</p>
