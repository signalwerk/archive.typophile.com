    html: <p>thanks eduardo and john, <br> <br>i found out that it is possible to generate  <br>embeddable fonts in fontographer by altering the  <br>parameter in the "os/2 embedding" field. <br> <br>i just tested it, and it worked fine with weft. <br> <br>btw, has anybody in this forum ever used weft...? <br> <br>g*</p>
