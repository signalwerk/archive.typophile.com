    <p><em>De Pinte, Belgium - January 12, 2012</em></p>
    <p>Ten years ago, one would have hardly believed that slab serifs would regain the popularity they enjoy today, or that they would again occupy such a commanding position in the design of advertisements, magazines and newspapers.</p>
    <p>The slab serif, as a genre of letter, came into existence in the early nineteenth century. The first slab serifs were crude looking, even grotesque. Their fat, squarish proportions, monoline forms and dark colour served one goal above all: to make a powerful and compelling impression on readers. Like the nearly contemporary sans serif, slab serifs dominated display lettering and typography in the West for much of the nineteenth century.</p>
    <p>After this ‘first wave’ of slab serifs, which lasted for about a century and resulted mainly in single unrelated fonts, mechanical improvements in type production and changing approaches to typeface design brought about better-planned font ‘families’. A ‘second wave’ of slab serifs ensued, and typefaces such as Memphis, Beton, City, Karnack, Rockwell and others invigorated the genre in the late 1920s and throughout the 1930s.</p>
    <p><a href="https://ourtype.com/try/stan" rel="nofollow"><strong>OurType Stan</strong></a> is a reinterpretation of a now almost forgotten slab serif named ‘Wellington’, belonging to this period, which was issued in 1913 by Brüder Butter, a Dresden typefoundry specialising in display type, or ‘Schrift für Werbung’. Wellington was designated a ‘Balken-antiqua’, a slab serif that aimed for elegance and readability in text without sacrificing visual power. The revival of Wellington as OurType Stan is designed by <a href="http://ourtype.com/#/our-designers/maurice-goeldner/" rel="nofollow"><strong>Maurice Göldner</strong></a>, whose first commercial font family is <a href="https://ourtype.com/try/meran" rel="nofollow"><strong>OurType Meran</strong>.</a></p>
    <p>The Stan family consists of roman and italic designs in seven weights: Thin, Light, Blond, Normal, SemiBold, Bold, and Black. Its PRO character set includes small caps; lining, old style, and small cap height sets of figures (each in tabular and proportional widths); fractions; comprehensive superiors, inferiors, nominators and denominators; case sensitive punctuation sets; mathematical and monetary symbols; arrows; standard and discretionary ligatures; alternate stylistic sets, and a complete range of accents covering all (Latin script based) Western, Central and East European languages. Additionally, Stan features a variant with longer ascenders and descenders – <a href="https://ourtype.com/try/stan-plus" rel="nofollow"><strong>Stan Plus</strong></a> - specially designed for text allowing generous vertical spacing. </p>
    <p>OurType Stan is part of today’s ‘third wave’ of slab serifs. Its design brings out the best of both worlds: the subtle perfume of the past and the ‘esprit’ of the present. Unpretentious and straightforward, Stan is a smart and effective choice for a very wide range of applications. </p>
    <p>Produced and released by OurType in 2012, Stan fonts are available in OpenType PRO character set only.</p>
    <p><strong>About Maurice Göldner</strong><br>
    Maurice Göldner is a typographic designer, born in Germany. He studied communication and graphic design at the Burg Giebichenstein - Hochschule für Kunst und Design, Halle and later type design with Fred Smeijers at the Hochschule für Grafik und Buchkunst in Leipzig, from where he graduated Cum Laude in 2009.<br>
    Maurice has a keen interest in lettering and typographic research. His work has been exhibited in Leipzig and Copenhagen. Maurice Göldner's Meran was awarded the Saxon State Award for Design in 2009.</p>
    <p>Maurice lives and works in Leipzig.</p>
    <p><strong>About OurType</strong><br>
    Founded in 2002, <a href="http://ourtype.com/#/about/company-profile/" rel="nofollow">OurType</a> is an independent type foundry led by Fred Smeijers, Corina Cotorobai and Rudy Geeraerts. Its signature collection consists of fine typeface designs that respect traditional values and yet are tailored to contemporary needs. In addition to its renowned designers – <a href="http://ourtype.com/#/our-designers/fred-smeijers/" rel="nofollow">Smeijers</a> and <a href="http://ourtype.com/#/our-designers/peter-verheul/" rel="nofollow">Verheul</a> – OurType also publishes fonts from some of the best young talents: <a href="http://ourtype.com/#/our-designers/nikola-djurek/" rel="nofollow">Nikola Djurek</a>, <a href="http://ourtype.com/#/our-designers/andre-leonardt/" rel="nofollow">André Leonardt</a>, <a href="http://ourtype.com/#/our-designers/merel-matzinger/" rel="nofollow">Merel Matzinger</a>, <a href="http://ourtype.com/#/our-designers/artur-schmal/" rel="nofollow">Artur Schmal</a>, <a href="http://ourtype.com/#/our-designers/thomas-thiemich/" rel="nofollow">Thomas Thiemich</a>, <a href="http://ourtype.com/#/our-designers/hendrik-weber/" rel="nofollow">Hendrik Weber</a>, <a href="http://ourtype.com/#/our-designers/maurice-goeldner/" rel="nofollow">Maurice Göldner</a>, <a href="http://ourtype.com/#/our-designers/peter-mohr/" rel="nofollow">Peter Mohr</a>, <a href="http://ourtype.com/#/our-designers/frederik-berlaen/" rel="nofollow">Frederik Berlaen</a>, <a href="http://ourtype.com/#/our-designers/valentin-brustaux/" rel="nofollow">Valentin Brustaux</a>, and <a href="http://ourtype.com/#/our-designers/nils-thomsen/" rel="nofollow">Nils Thomsen</a>.</p>
    <p>OurType collection is available at <a href="http://www.ourtype.com/" rel="nofollow">www.ourtype.com</a><br>
    OurType web fonts exclusive to <a href="http://www.webink.com/" rel="nofollow">webINK</a></p>
