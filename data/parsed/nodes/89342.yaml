      <p><cite>I then interpolate (using Blend Fonts?) a regular in-between.</cite></p>
      <p>If you have two single fonts and want to interpolate them, I’d recommend to define an MM axis in one of them and then use the Assign Master command to get the other one in. Then use Generate Instance. Assign Master is more reliable than Blend Fonts or Mask to Master.</p>
      <p><cite>Would I interpolate kern pairs without interpolating my glyphs?</cite></p>
      <p>I would interpolate the whole font, then export the kerning as pfa file and re-import it into your final Regular. This method works quite realiably for me.</p>
