    <p>Hi there. This is my first post on Typophile so please excuse me if this topic has been answered elsewhere or if I'm in the wrong place.</p>
    <p>My question is about managing kerning across interpolated fonts in FontLab. I have no experience in this area and I am just trying to understand how it is handled.</p>
    <p><strong>An example:</strong></p>
    <blockquote><p>Say I have a light and a bold. I have kerned both. I then interpolate (using Blend Fonts?) a regular in-between. The regular would have kern values averaging the light and bold.</p></blockquote>
    <p><strong>Where I'm having trouble:</strong></p>
    <blockquote><p>If I were to throw out the light weight's values and re-kern it from scratch there would dozens of pairs rewritten. I want those changes to factor into the regular's kern values, but those, once interpolated, seem to be static.</p>
    <p>I've also fixed some broken glyphs in the regular weight and I don't want that work to be overwritten.</p></blockquote>
    <p>Would I interpolate kern pairs without interpolating my glyphs? What method do you recommend? Am I asking the right question?</p>
    <p>Thanks in advance.</p>
