    <p><a href="http://www.michaeldoret.com/AlphabetSoup/soup.html" target="_blank" rel="nofollow">Alphabet Soup Type Founders</a> and Michael Doret are proud to announce the release of the “Steinweiss Script” family on MyFonts.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Steinweiss-Typophile-1a_6250.png"></div><br>
    These fonts began began their journey towards daylight when Michael Doret was asked by Taschen Publishing to do cover lettering for the huge commemorative edition they were putting together on the work of Alex Steinweiss—“The Inventor of the Modern Album Cover”. The lettering was to be created to appear similar to the famous “Steinweiss Scrawl” the calligraphy that Steinweiss had used on countless album covers:<br>
    <div class="imageWrap"><img src="http://typophile.com/files/Inventor_5418.png"></div><br>
    While designing this piece of lettering, Michael realized that there was great potential for a font that was designed in the spirit of that famous “scrawl”. Through his contacts at Taschen Publishing, he was fortunate enough to be able to contact the Steinweiss family, and get the official Steinweiss approval to proceed with his “Steinweiss Script” project. Michael decided that in addition to giving the font his name as an homage, that he would donate a portion of the proceeds from the sale of this font to the man himself: Alex Steinweiss.<br>
    <div class="imageWrap"><img src="http://typophile.com/files/Steinweiss-Typophile-1b_5446.png"></div><br>
    "Steinweiss Script" is a family of fonts in three weights: Light, Medium, and Bold. Additionally, within each weight there are three variations: Simple, Fancy, and Titling. These variations relate to the size/ratio of the caps to the lowercase, the complexity of those caps, and the size of the ascenders/descenders on the lowercase characters. These variations add usefulness to the font, making it accessible not just for headlines, but for longer passages of text as well.<br>
    <div class="imageWrap"><img src="http://typophile.com/files/Steinweiss-Typophile-1c_4143.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Steinweiss-Typophile-1d_4227.png"></div><br>
    Coincidental to the release of “Steinweiss Script” on MyFonts, Alphabet Soup is running a Special Promotion: 20% off this font for a limited time.<br>
    _________________________________________________________________<p></p>
    <p>Steinweiss Script on <a href="http://www.myfonts.com/fonts/alphabetsoup/steinweiss-script/" target="_blank" rel="nofollow">MyFonts</a></p>
