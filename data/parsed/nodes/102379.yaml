    <p>As I mentioned in the thread for <a href="http://typophile.com/node/98739" rel="nofollow">Workplace Sans</a>, at some point I tried experimenting with a variant design that didn't look so stiff and homely.  The alternate design was called "Workplace Gothic", and aimed for more of a grotesque style.  A few months ago I dusted it off and started trying to rework it into something fit for the life of day.</p>
    <p>Like Workplace Sans (with which it shares most of its basic proportions), Workplace Gothic is intended mainly for user interface text in computer software.  It's not hinted beyond TypeTool's autohinting; I expect it'll typically be anti-aliased where used.</p>
    <p>Sample PDF:  <a href="http://www.altsan.org/creative/fonts/workplace/Type-Gothic.pdf" title="http://www.altsan.org/creative/fonts/workplace/Type-Gothic.pdf">http://www.altsan.org/creative/fonts/workplace/Type-Gothic.pdf</a></p>
    <p>And some images for the link-shy or lazy:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/wpgoth1_4126.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/wpgoth2_5153.png"></div><p></p>
    <p>...no, it's not particularly original, or beautiful.  (It was the second font I ever designed, and started before I'd ever done any real study of fonts &amp; design principles, although I've updated it a fair bit now.)  But it seems to work OK for its intended purpose, and IMO looks better doing it than its older sibling Workplace Sans.</p>
