    <p>As I mentioned in the thread for <a href="/node/98739/" rel="nofollow" class="link-kept">Workplace Sans</a>, at some point I tried experimenting with a variant design that didn't look so stiff and homely.  The alternate design was called "Workplace Gothic", and aimed for more of a grotesque style.  A few months ago I dusted it off and started trying to rework it into something fit for the life of day.</p>
    <p>Like Workplace Sans (with which it shares most of its basic proportions), Workplace Gothic is intended mainly for user interface text in computer software.  It's not hinted beyond TypeTool's autohinting; I expect it'll typically be anti-aliased where used.</p>
    <p>Sample PDF:  <a href="http://www.altsan.org/creative/fonts/workplace/Type-Gothic.pdf" title="http://www.altsan.org/creative/fonts/workplace/Type-Gothic.pdf" class="link-external">http://www.altsan.org/creative/fonts/workplace/Type-Gothic.pdf</a></p>
