    <p>No, I didn't see the movie, and no, I don't have a sample.. I wouldn't bother posting this if it weren't for this: My girlfriend went to see the movie with her brother, and when she returned she commented on how she liked <i>the typeface they used for the end credits</i>! <br> <br>I was so proud! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>So she asked me what typeface it was, but I have no idea.. I don't want to disappoint her, so here's my question: Did anyone catch the movie and can you remember the end credits?</p>
