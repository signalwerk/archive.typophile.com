    html: <p>I did see the movie and I wondered this myself. The typeface is first seen on the Mirauder's map. and the end credits take cue from that. I was reminded of Poetica, but it was distressed and Poetica is not.  <br></p>
    html_clean: <p>I did see the movie and I wondered this myself. The typeface is first seen on the Mirauder's map. and the end credits take cue from that. I was reminded of Poetica, but it was distressed and Poetica is not.  <br></p>
  - id: 38161
    user: 1043
    date: 2004-06-21T11:05:00
    date_raw: 21.Jun.2004 11.05am
    votes: null
    html: <p>To me it looked like a custom version of <a href="http://www.myfonts.com/fonts/ef/nicolas-cochin/" target="_blank">Nicholas Cochin</a>. I was very impressed that the main credits appeared to be hand-lettered. Once they got into the thousands of other people who worked on the film, it's clearly type, with some alternate characters thrown in liberally. My guess is that is was one or more custom fonts and quite a bit of calligraphy.  <br> <br>(I quite enjoyed the Mirauder's Map-inspired end credits which twisted and turned as if it was a pop-up map designed by M.C. Escher. The type treatment was fun, too.)</p>
