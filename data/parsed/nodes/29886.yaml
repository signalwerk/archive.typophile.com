      <p>Okay, now something REALLY weird is going on.</p>
      <p>Yesterday, someone took the original "free FAQ", which was at <a href="http://typophile.com/wiki/FAQ_Free" title="http://typophile.com/wiki/FAQ_Free">http://typophile.com/wiki/FAQ_Free</a>, and renamed it -- so that the address became <a href="http://typophile.com/wiki/FAQ_Free_Fonts" title="http://typophile.com/wiki/FAQ_Free_Fonts">http://typophile.com/wiki/FAQ_Free_Fonts</a>.</p>
      <p>This had the effect of making the page "disappear," since all the links to it no longer worked.</p>
      <p>Today, that NEW page has also disappeared. Who is doing this? What's going on? I've been maintaining that page with a high degree of sensitivity and care. </p>
      <p>It would be great if some of the moderators on this site could look into this and join this discussion so it's not just me wondering aloud to myself. =)</p>
      <p>Skylar</p>
