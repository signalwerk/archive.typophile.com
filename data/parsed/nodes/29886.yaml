    <p>I notice that a bunch of <a href="/wiki/Typowiki" class="freelinking" rel="nofollow">Typowiki</a> pages have just been renamed. (To name one example, wiki/faq_free has been renamed wiki/faq_free_fonts. For other examples, go to the <a href="http://typophile.com/wiki/FAQs" rel="nofollow">Wiki FAQ index</a> -- three of the articles in the list seem to have vanished, because they have been renamed.)</p>
    <p>Who is making these changes? Did anyone think it through? </p>
    <p>All of those pages are already linked-to from other Wikis, and those links don't work anymore. (They're also linked to from outside the Wiki, to be sure.) If all the current Wiki entries are now filled with bad links, that reduces the usefulness of the Typowiki.</p>
    <p>Distressingly, when you go to the OLD address, you get a page which says that the entry does not exist -- and which invites you to create one. Soon we'll have people creating new entries for subjects which already have them.</p>
    <p>So, two possible solutions: Is the person who is renaming the pages willing to change the names back? If not, can that person create referring pages, so that people will be automatically sent to the newly renamed page?</p>
    <p>Skylar</p>
