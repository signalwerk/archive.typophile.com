      <p>Ralf: I wish the Typophile software had the same feature! In the meantime, I've just set up a dorky referring link on the <a href="http://typophile.com/wiki/FAQ_Free" rel="nofollow">old Faq_free page</a> which takes you to the new (renamed) one. </p>
