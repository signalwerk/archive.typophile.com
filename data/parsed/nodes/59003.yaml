      <p>I think most people, especially those from the government, are confused with the difference between “Logo mark” and “Logo type”.</p>
      <p>“Logo Marks” are basically graphic symbols which represent the identity of a brand or a company, while as “Logo types” consist of the names of the brand/companies. It becomes even more confusing where a brand doesn’t have any “Logo mark,” instead just “Logo type” as their “logo”. (example, Coca-cola and Levis, as we can see in the above images)</p>
      <p>In many developing countries, people tend to think that since we recognize the name of a particular brand by “reading” it, therefore by just translating the name into a local language that is “readable” should be able to do the job. They have neglected, or just simply unaware of the importance of the visual representation of the brand.</p>
      <p>I find that in my country (Malaysia) it is very much so with most of the clients. It is then our job as designers to educate them.  I find that often times by introducing some simple terms helps a lot. (meanwhile trying to avoid being over “jargonizing”) It certainly wouldn’t help if people go around using a generic term like “logo” to refer to both the “mark” and the “type”,  and worse still when designers don’t even bother to take the effort to explain the terms to the clients.</p>
      <p>The same goes with terms like “brand” or “branding”. People talk so much about them but have no clue at all what they are referring to. Some would even use the term “brand” to refer to a “logo”. You can imagine what happen when your client commissioned you to design a “brand” for them, while as what they actually mean is just a “logo”.</p>
      <p>It is also the responsibility of any international brand to develop a well designed identity manual which cover the communication needs of whatever country where their brand exists, and see to it that the guidelines are being followed by the locals. The purpose of a identity manual is to provide guidelines, in order to protect and to control the integrity of the visual identity. Again, the designer has an important role to play here to educate and inform the client of the need. A manual doesn’t have to be complicated or expansive, but if a business is intended to expand to oversea, it’s extremely crucial to develop such manual so to avoid any miscommunication arises when they cross cultures.</p>
      <p>I am currently involved in an identity project with a local client whom over the years expanded their business to at least another 4 countries or so, without any awareness of the need of any visual guideline in these countries. You can imagine the mess they got themselves into. To help them to design a system to cover these needs would mean a lot of extra works for me and not necessarily extra money, but I realize the hard work is extremely crucial for educating and setting a benchmark for the corporate world in long run.</p>
      <p>weng</p>
