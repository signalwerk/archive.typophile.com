    <p>Basic question I just can’t figure out — the image below is part of a web page. I want the home, about and contact buttons to be rollover images that have a transparent background. Of course, a transparent gif has that ugly white line. This page will have a flash gallery on it. Is the only solution is to make the whole page a flash page? </p>
    <p></p><div class="imageWrap"><img src="/files/gallery_6486.jpg"></div><p></p>
    <p>Thanks,</p>
    <p>Sharon</p>
