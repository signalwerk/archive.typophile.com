      <p>&gt;This page will have a flash gallery on it. Is the only solution is to make the whole page a flash page?</p>
      <p>No.</p>
      <p>For IE you could search for a javascript library called “IE 7”. Nice thing about it, with it you can code properly CSS 2.0 (CSS 2.1?) for all standard compliant browsers and via conditional comments you can solve nearly all problems for IE with it (transparency, box-model bugs, attribute selectors …)</p>
      <p>There is a quite simple javascript to solve this transparency problem for IE, too. Search the web for “IE transparency image”. </p>
      <p>I use transparent png-24 format instead of gif.</p>
    html_clean: |-
