      <p>PNGs work in IE if you use one of the many ’IE PNG fixes’. Google “Twin Helix IE PNG fix” for a decent one. IE7 (as mentioned) works as well.</p>
      <p>I wouldn’t use JPGs for this. JPGs will never match the background color perfectly and tend to add artifacting to areas of high contrast (namly type). A gif will work fine.</p>
