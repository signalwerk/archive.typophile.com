    html: |-
      <p>A gif does not have to have “that ugly white line” around it. If you set the matte to black when saving the gif, then the antialiasing will blend to black, and not to white. you will still have a blackish border around it where the background is lighter than black but this will be better. You might even find a darker gray that works.</p>
      <p>But why limit yourself to GIF. Slice up a JPG and make the rollover from that. If you position things correctly the background of the jpg will line up with the image behind, and transparency is not needed.</p>
    html_clean: |-
