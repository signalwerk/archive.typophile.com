      <p>You can also try using the <a href="http://www.bowfinprintworks.com/ScriptIDGuide.html" rel="nofollow">Script Font ID Guide</a>. If the letters connect, look at either Part 1, or Part 7, depending on whether you think the script is a formal, or casual style. If the letters are not all connected then check Parts 2, or 8, again depending on whether you consider the style formal or casual.</p>
      <p>- Mike Yanega</p>
