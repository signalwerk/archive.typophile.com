      <p>In the specs for the OS/2-table, usWidthClass mentions this:</p>
      <p>1&nbsp;&nbsp;Ultra-condensed&nbsp;&nbsp;(50% of normal)<br>
      2&nbsp;&nbsp;Extra-condensed&nbsp;&nbsp;(62.5% of normal)<br>
      3&nbsp;&nbsp;Condensed&nbsp;&nbsp;(75% of normal)<br>
      4&nbsp;&nbsp;Semi-condensed&nbsp;&nbsp;(87.5% of normal)<br>
      5&nbsp;&nbsp;Medium (normal)&nbsp;&nbsp;(100%)<br>
      6&nbsp;&nbsp;Semi-expanded&nbsp;&nbsp;(112.5% of normal)<br>
      7&nbsp;&nbsp;Expanded&nbsp;&nbsp;(125% of normal)<br>
      8&nbsp;&nbsp;Extra-expanded&nbsp;&nbsp;(150% of normal)<br>
      9&nbsp;&nbsp;Ultra-expanded&nbsp;&nbsp;(200% of normal)<br>
      The addition of % sounds a bit like over-regulation ... (CSS2 font specs mention the same table without the %-values.)</p>
      <p>Even when choosing different names, I find it helpful to see that it employs the same scheme as for weights, with 'ultra', 'extra', 'semi'.</p>
