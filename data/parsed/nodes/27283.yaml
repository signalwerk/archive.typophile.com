      <p><em>Si: compressed, squished or narrow?</em></p>
      <p>A lot of bigger font families already use compressed and narrow variants, which are all less wide than the condensed, if I remember correctly. So calling the intermediary weight one of these would only add to the increasingly confusing landscape of font naming.</p>
      <p><em>Thomas: In several families, Adobe has called it “semicondensed.”</em></p>
      <p>Thank you! I should have remembered that some Adobe fonts had this. I'm glad that there is a specific naming precendent.</p>
