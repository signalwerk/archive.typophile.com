    <p>Does anyone know of sources that may satisfy this reviewer? I have a few quotes from books that I own that I can use, as well as Jessica Hische's talk at the Frontend 2011 conference (<a href="http://www.frontend2011.com/video/jessica-hische.html" title="http://www.frontend2011.com/video/jessica-hische.html" class="link-external">http://www.frontend2011.com/video/jessica-hische.html</a>), but she is in fact a lettering artist and not a typographer, and I'd love to see if there are any serious typographers who'd have quotes on this. Thanks so much!</p>
