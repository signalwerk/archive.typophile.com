  html: |-
    <p>Hey fellow typophiles,</p>
    <p>I just wrote an article on the premise that typography and hand-lettering are, in fact, very different disciplines (*gasp*), in order to clarify the definition because of the rampant misuse of terminology (we've all seen plenty of "35 Samples of Great Hand-Lettered Typography" articles). However, one of the reviewers was disturbed by this claim and demanded sources from "prominent typographers both contemporary and historical."</p>
    <p>Does anyone know of sources that may satisfy this reviewer? I have a few quotes from books that I own that I can use, as well as Jessica Hische's talk at the Frontend 2011 conference (<a href="http://www.frontend2011.com/video/jessica-hische.html" title="http://www.frontend2011.com/video/jessica-hische.html">http://www.frontend2011.com/video/jessica-hische.html</a>), but she is in fact a lettering artist and not a typographer, and I'd love to see if there are any serious typographers who'd have quotes on this. Thanks so much!</p>
  html_clean: |-
    <p>Hey fellow typophiles,</p>
