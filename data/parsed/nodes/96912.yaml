      <p>It wouldn't have to be in print, but preferably something that could be linked to or cited from a publication.</p>
      <p>Haha, that is a good point about Noordzij! I looked up his site and it seems that what he is saying is simply that they're both a graphic representation of a spoken language, but there are major practical differences.</p>
      <p>The premise of the article is that with the resurgence of mainstream popularity of type and lettering there has been a lot of confusion of terms among those who haven't put much study into it. It explains the basic definitions of typography and lettering, highlighting why we shouldn't use "typography" to mean lettering as is so commonly done, and gives a historical background of the development of each. Not much to argue with. The other reviewers were very positive.</p>
