      <p>There are some things that you may dearly want people to open their minds to. For me, the inescapable cause is blackletter. That's pretty innocuous... the worst accusations I have to deal with are illegibility and the occasional Nazi reference (easily deflated when you show them the Bormann letter.)</p>
      <p>Others will get you labeled as a crackpot for the rest of your Internet-archived life. Redeeming and "decontextualizing" (heh) the swastika in the West is certainly one of them. I suppose there are probably <a href="http://skepdic.com/urine.html" rel="nofollow">worse ones</a> than that. Please, please, pick your battles carefully.</p>
