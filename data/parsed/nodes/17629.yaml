    html: <p>You should note that the 45% rotation gives instability as well as dynamism to the design, especially as they are houses, which one expects to sit stablely on the ground. Hitler rotated the traditionally horizontal-vertical swastika's orientation by 45% to give it an agressive dynamism. Including the dimension of gravity in your re-design might help you in divising a new version.</p>
