      <p>I work as an graphic designer at a company that designs/builds museum exhibits. I recently had a client bring a project to a screeching halt when it was suggested to them that the floor plan of their space approximated the shape of a swastika. To be clear, the "swastika" would be totally imperceptable to anyone not looking at the engineering drawings. Everything was revamped to avoid even an imperceptable, unresonable and unitended association with an "evil" symbol.<br>
      Symbolism is strong. I think it would be in your best interest to rework the mark and avoid the whole scenario.</p>
