      <p>Even if you eliminate the doors, there's still the big thin swastika in the remaining space. Best to start over from scratch.</p>
      <p>Fact is, anything with fourfold rotational symmetry is going to remind people of a swastika; that's how sensitive people are to it. For a non-profit organization, it's especially hazardous. Legends will spring up about how the organization is secretly run by white supremacists. Don't think that maybe they won't, because they will.</p>
