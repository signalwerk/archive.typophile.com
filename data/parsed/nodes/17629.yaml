    <p>This is my first post in Typophile, so please be gentle :)<br>
    I recently developed a logo for a non-profit organization. The symbol involves 4 houses placed in a symetrical fashion and tilted at 45 degrees. It has been brought to my attention that the negative space in the middle resembles a swastica (now its all I see). Obviously this wasn't intentional but the question remains. Is it acceptable or should I tell the client to choose one of the other alternatives?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/cit_logo.jpg"></div><p></p>
  html_clean: |-
