    html: |-
      <p>If the alternate glyph represents a character that has not been encoded in Unicode on its own (nor it can be represented as a sequence of Unicode characters), but it has different SEMANTICS that the "basic" variant, and if you want this different semantics to be preserved when the text is extracted/searched in an electronic document (PDF), then you should use a PUA value and use glyph names like <code>uniXXXX</code> where XXXX is the PUA Unicode codepoint. </p>
      <p>If the alternate glyph represents a visual variant of a basic character but semantically it still is the same character, you should not use PUA and use glyph names like <code>basicglyphname.suffix</code>. </p>
      <p>Regards,<br>
      Adam</p>
