      <p><cite>do I need to assign it an Unicode code?</cite></p>
      <p>No, you don't. OpenType features are operating on glyphs names. But you will lose access to alternate glyphs in applications, which are not OT-savvy so it's a good practice to put them somewhere in Unicode's Private Use Area.</p>
