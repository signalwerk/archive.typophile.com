    html: |-
      <p>What else could be where in Hindsight Unicode at HindUnic.ttf will have glitches?<br>
      * No Alphabetic Presentation Forms unicode block was made from the font. Can you replace quotereversed into u201b? From which character has been added to the Free UCS Outline Fonts?</p>
      <p>Here are the relative changes to existing unicode ranges.<br>
      Cyrillic:<br>
      1162 CYRILLIC CAPITAL LETTER SHORT I WITH TAIL: added tail<br>
      1163 CYRILLIC SMALL LETTER SHORT I WITH TAIL: added tail<br>
      1164 CYRILLIC CAPITAL LETTER SEMISOFT SIGN: added line<br>
      1165 CYRILLIC SMALL LETTER SEMISOFT SIGN: added line<br>
      1166 CYRILLIC CAPITAL LETTER ER WITH TICK: added tick<br>
      1167 CYRILLIC SMALL LETTER ER WITH TICK: added tick<br>
      1170 CYRILLIC CAPITAL LETTER GHE WITH STROKE: added stroke<br>
      1171 CYRILLIC SMALL LETTER GHE WITH STROKE: added stroke</p>
