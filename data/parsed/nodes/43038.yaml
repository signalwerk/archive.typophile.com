      <p>"But you will lose access to alternate glyphs in applications, which are not OT-savvy so it’s a good practice to put them somewhere in Unicode’s Private Use Area."</p>
      <p>The problem is completely true, but whether that makes creating a bogus encoding a good idea is a question that has long been the subject of heated debate. Adobe, for example, used to do this religiously in all Adobe OpenType fonts, but we finally decided to discontinue the practice in new fonts starting with Arno and Hypatia Sans (IIRC, I personally pushed that move).</p>
      <p>Cheers,</p>
      <p>T</p>
