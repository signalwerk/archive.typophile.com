      <p>Thomas, I wouldn't call it a *bogus* encoding, but a private one. So, for fonts having a quite restricted audience, private use encodings make sense; for a font to be generally released to the public, probably not. </p>
      <p>For example, the medievalists with "Junicode" have essentially proposed a standardized private use encoding for some characters they need that will never have regular Unicode numbers. And our company, in our working fonts, gives all ornaments a Private Use encoding, on the grounds that it alerts an eventual user of the files that there is something in them they need to check, but if they don't and the characters drop out, no real harm is done to the text.</p>
      <p>I'd agree that for an alternate glyph, it is best not to use the PUA. The situation with Type 1 fonts was a similar conundrum, where characters outside the MAC or WIN standard name-based encodings were given the wrong name just to be included in the font. Any further use of a file that employed such alternates was a PITA.</p>
      <p>With the multiple uses of a (single) text file today, a layout program that has to treat alternate glyphs as different characters -- different objects -- probably just should not have access to them. Font designers should understand that their product is not an end in itself; to have value it needs to be used. For those of us who use type, a certain consistency across fonts is important. The object-attribute model of OpenType helps with this; letting the features code give whatever typographic niceties the font designer wishes to include, while preserving the text file. Font designers shouldn't then take away what that gains us.</p>
