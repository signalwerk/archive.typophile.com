    <p><strong>The international <a href="/wiki/Typo%20Magazine" class="freelinking" rel="nofollow">magazine TYPO</a> dedicated to typography, graphic design and visual communication celebrates fifth anniversary. The first issue of 2008 brings a number of improvements: the content structure changed as well as the size, layout, paper, and, last, but not least, the periodicity: from a bi-monthly, TYPO becomes a quarterly journal.</strong></p>
    <p>The scope of information contained in each issue increased rapidly: just published 31st issue in the new design has 84 pages in 230 × 250 mm, as compared to the original 32 pages. The magazine is now divided in two sections: first features key articles, the second contains short notes, font reviews, columns of editors and contributors, and information about contests and conferences. Instead of the editorial, the table of contents features short annotations of articles. All articles are printed in English and Czech language.</p>
    <p>The 31st issue is dedicated to <strong>Korean design</strong>; articles were written especially for TYPO by top South Korean designers, researchers and lectures in typography and design. The readers will learn about the historic evolution of Korean type, about the present trends in Korean graphic design and its most important representatives, about the Korean calligraphy and the design of Latin fonts designated for setting with Chinese, Japanese and Korean type.</p>
    <p>In the following issues of 2008, the readers may look forward to an overview of contemporary graphic design and typography in Italy, the design in the countries of the Visegrád Group, and the work of Jan Tschichold.</p>
    <p>Sometime this year, the website of the magazine is going to change, too, as the TYPO magazine website will be incorporated into the Typo.cz web server, thus creating an extensive, modern website dedicated to typography, with a number of new features. You may look forward to discussions, online shop, RSS, archives, etc.</p>
    <p>You may subscribe to the TYPO magazine at <a href="http://www.typo.cz/shop" title="www.typo.cz/shop">www.typo.cz/shop</a>, where individual back issues are also sold.</p>
    <p>The schedule for 2008 is as follows:</p>
    <p>31- currently selling<br>
    32 - July<br>
    33 - October<br>
    34 - December<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/typo-cover-31m_5161.jpg"></div><p></p>
