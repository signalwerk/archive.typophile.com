    html: <p>For Hrant I think it isn't an aesthetically related epithet. When he has used the term in the past it had to do with his sense of the intent of the type maker. If the choices ( florid or no ) were in his eyes aimed at better reading then they were craft. If not, artsy as in for personal expression. The modern/Bodoni look is the aesthetic that I have seen Hrant attracted to over time. Fleischmann &amp; Paganini both have it. Hrant, feel free to correct this if it is mistaken.</p>
