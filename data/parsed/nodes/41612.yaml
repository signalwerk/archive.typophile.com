      <p>Hi Alex,</p>
      <p><a href="http://www.global-type.org/Searching.743.0.html" rel="nofollow">Global Type</a> lists a Paganini by A. Butti/R. Bertieri – made before 1935 for Società Nebiolo – and claims there was also a digital version (‘PS’, next to ‘B’ for Blei = lead and ‘F’ for Fototype).</p>
      <p>By the way, it’s not about <a href="http://moorstation.org/typoasis/designers/steffmann/samples/p/paganini.htm" rel="nofollow">this Paganini</a>.</p>
