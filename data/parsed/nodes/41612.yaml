    html: |-
      <p>Hi Alex. The Paganini typeface is featured on most of the Nebiolo specimens I’ve seen. Giangiorgio Fuga has put online some pictures from one of his copies of said specimens, like <a href="http://www.flickr.com/photos/giofuga/1755025881/in/set-72157602712967666/" rel="nofollow">this picture where you can see Paganini quite well</a>. </p>
      <p>According to <cite>20 alfabeti brevemente illustrati</cite> (1933) by Raffaello Bertieri, the typeface was his own creation. He art directed and drew the first preliminar sketches while Alessandro Butti did most of the actual drawing of the typeface itself. It’s a well regarded typeface if you consider that even Giovanni Mardersteig has been known to use it.</p>
