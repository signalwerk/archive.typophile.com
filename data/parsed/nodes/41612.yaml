    html: |-
      <p>Ruano is basically an upright cancelleresca, systematized into a typeface.<br>
      By "black" Antonio means that's pretty heavy in weight, I think, compared to the cancelleresca calligraphy. I have the original specimen of Ruano, and although I don't like so much the lowercase it is undoubtedly an original typeface, even more, considered it was designed in 1926.<br>
      I was incredibly surprised to see some uppercase forms I have incorporated into my old Exegetic are amazingly similar to Ruano (the uppercase R and S, the lowercase S).<br>
      I think - willingly or not - these forms got in the blood of us Italians, even if the faces were maybe not so extensively used (Ruano was not so ubiquitous as Paganini or Semplicità).</p>
