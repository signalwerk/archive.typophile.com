      <p>I don’t think Science generally tries to, or should try to, understand art and design; that’s why many people think “social science” is a misnomer. Science tries to, and can, understand things like our reading “firmware”, noting that this is something essentially impervious to cultural shifts - it has more to do with solar radiation!</p>
      <p>&gt; inventing new kinds of meaning which defy measurement. </p>
      <p>That seems entirely artificial.<br>
      I don’t fight against my kitchen knife.</p>
      <p>&gt; quantum theory puts the mystery back.</p>
      <p>?<br>
      It’s still science, just like Newtonian physics. Just because something is harder to understand for laymen doesn’t mean somebody whose job it is to worry about it professionally should be “mystifed” by it. So for example readers don’t want/need to know how humans read; if they see it as mystical, sure. But a type designer must do more than ooh &amp; aah.</p>
      <p>&gt; I’m afraid I don’t find present state-of-the-art of reading theory very interesting</p>
      <p>I don’t think it’s supposed to be interesting of itself (except to cognitive psychologists). What should be interesting to a craftsman -somebody necessarily interested in the mechanics of reading- is what <strong>can</strong> be discovered through research. And clearly, people like Kevin Larson are making decent progress; they’re <strong>trying</strong> - and we should encourage that.</p>
      <p>&gt; I have a theory that everything you’ve ever read in a particular<br>
      &gt; typeface colours your understanding of what you read in that face.<br>
      &gt; And everything that’s ever been set in a typeface has a bearing<br>
      &gt; on the meaning of text set in it.</p>
      <p>Makes sense.</p>
      <p>hhp</p>
