    <p>In another thread, Carl Crossgrove wrote:</p>
    <p>“<br>
    &gt; and making little machines that leverage notan to create good boumas</p>
    <p>It’s almost like nanotechnology! Ha! Ha!</p>
    <p>Hrant, does achieving this preclude style or expression? Is there only one<br>
    way to achieve it? Also, is there an empirical way to decide what a “good<br>
    bouma” is? Do you have examples? I would think typographic context would<br>
    be a qualifier in each example.<br>
    “</p>
    <p>I think Design must always include style (what I call aesthetics) and<br>
    expression, although in a very different way than in Art - sort of in<br>
    spite of the designer, instead of as a purpose*. I’m talking about text<br>
    fonts here, which I see as qualitatively different than display fonts<br>
    where aesthetics are often at the heart of things. I’d say that a good<br>
    designer tries to balance form and function, style and optimal boumas.<br>
    For example in Patria I’ve made some glyphs “too bulky” for what I see<br>
    as ideal readability, but it was a conscious sacrifice, a gambit, so as<br>
    to give the face a certain masculine style. You can -and should- bend<br>
    both form and function, you just have to know how far you can bend<br>
    them, under what contexts, and with what effects.</p>
    <p>* Anything made by a human cannot avoid expression, and anything made for a human should not. But in design, expressing yourself is not the purpose, it just happens. Design is the artful balance of compromises; Art is basically just expression; although neither ever exists in a pure state, always in an admixture. Or: An artist wants to express himself; a designer wants others to express themselves. An artist creates; a designer serves. Etc. etc. etc.  :-)</p>
    <p>So there can be no “perfectly” readable font - yes, context is everything.<br>
    And style is always there, so that removes the chance of singular solutions.</p>
    <p>Empirical determination: I think it’s possible, when a very narrow<br>
    context is defined. But it’s also extremely difficult; I myself have<br>
    yet to encounter sufficient maturity (and dough!) in the cognitive<br>
    psychology field to really nail down immersive reading.</p>
    <p>Examples? Here’s a really cheap one:<br>
    <a href="http://www.themicrofoundry.com/ss_read1.html">http://www.themicrofoundry.com/ss_read1.html</a></p>
    <p>hhp</p>
