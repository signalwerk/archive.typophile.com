      <p>&gt;So there can be no “perfectly” readable font - yes, context is everything.<br>
      And style is always there, so that removes the chance of singular solutions.</p>
      <p>I would add that art and design create moving targets for science to understand.<br>
      If what defines humanity is that which cannot be reduced to numbers and automated, then it’s our duty to keep redefining ourselves against our technology, by inventing new kinds of meaning which defy measurement. Come to think of it, this applies to pure science as much as to the humanities.</p>
      <p>Examples: the invention of photography drives art into the non-objective; Newtonian physics reduces people to biomechanical status, quantum theory puts the mystery back.</p>
      <p>I’m afraid I don’t find present state-of-the-art of reading theory very interesting, too much based on behavioral lab research. I’d prefer something more theoretical, like cosmological theory.</p>
      <p>I have a theory that everything you’ve ever read in a particular typeface colours your understanding of what you read in that face. And everything that’s ever been set in a typeface has a bearing on the meaning of text set in it. </p>
      <p>If the brain is a quantum computer, the process of reading must be full of quantum effects.</p>
