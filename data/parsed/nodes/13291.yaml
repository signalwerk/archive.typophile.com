      <p>Hrant, I’m relieved that you recognize this inevitable element of design. Design is fundamentally making tools, and the best are the most elegant <em>and</em> the most functional. Now I can make the connection between your frequent mention of notan and boumas, and your affection for Legato. </p>
      <p>Your example reminds me that there are a lot of things that type people know, without being able necessarily to explain or quantify. Recent discussions and papers about reading, legibility, highway signage and the dyslexic have made it clear there is not enough research that takes advantage of the highly unscientific expertise of a type designer or typographer. While Science may be best not trying to understand design, it could use a healthy dose of design awareness. Even very humdrum tests have to be designed.</p>
      <p>Meanwhile I’ve got some notan to wrangle.</p>
