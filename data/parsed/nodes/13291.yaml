      <p>&gt;Examples: the invention of photography drives art into the non-objective; Newtonian physics reduces people to biomechanical status, quantum theory puts the mystery back.</p>
      <p>Nick,</p>
      <p>Quantum theory doesn’t put the mystery back as much as it is mysterious or more to the point, non understandable (to the layman). But to take your example of photography, yes, it had the consequence of driving art into the non-objective but the invention also led to interest in the documentation of historical artifacts, and especially in the mid-nineteenth century, to interest in the Renaissance. Without the camera and this interest, William Morris would never have been inspired to begin his very influential typographic revival efforts. </p>
      <p>Gerald</p>
