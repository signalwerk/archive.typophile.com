      <p>Okay---it started with a "g", but g's, because of their structure, usually don't have much influence on how the rest of a font is designed. Whereas "h", "a" and "c" typically provide key elements.</p>
      <p>Next step: skew that "n" upwards and right-a-ways to make it match the motion of the "g", then make the "n" into an "h", and keep extrapolating from there.</p>
      <p>What you've drawn so far looks similar to a completed font of mine, name undecided;</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/buttered.png"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/elstrange-ocatfood.gif"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/tamyerocks350x210.gif"></div><p></p>
      <p>This one is a Cooperesque display/text hybrid with a heavy cursive influence, designed for packaging and poster work.</p>
      <p>Feel free to assimilate elements and details you feel will be useful---whatever fits in :^)</p>
      <p>j a m e s</p>
