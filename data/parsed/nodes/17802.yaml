      <p>That's cool David. I've been away travelling for a few weeks and only just got back here a day ago, so you're hardly late responding.</p>
      <p>To get some clues about brush dynamics and features, spend a while looking at art brush scripts. Art &amp; Sign fonts, and Letterhead Fonts, make some of the best examples around. My idea is to make your design more specific, and a brush grotesk seems a natural direction to go from this point. A brush grotesk would also be more unique than a typographic grotesk</p>
      <p>j a m e s</p>
