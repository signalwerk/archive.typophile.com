    html: |-
      <p>Keep it going David---it's gradualy taking shape. Once you've designed certain key parts, a font almost designs itself.</p>
      <p>Suggestions:<br>
      * shorten the descenders by 35%<br>
      * slant the stem (right side stroke) of "a" to the right<br>
      * try bending/curving the right side strokes of m, n, h to the left in a sweeping continuous arc, eliminating the curled tips. That will take it in a brushy direction and help make those forms more unique.<br>
      * "s" is interesting but I need to see it in use, as part of a word or two, before making any decisions.</p>
      <p>If you want to turn it into a real font there is a free font making program listed somewhere in the Typowiki.</p>
      <p>j a m e s</p>
