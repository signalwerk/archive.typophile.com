    html: |-
      <p>I am by no means an expert, and will happily class myself as a complete noobie when it comes to the actual task of type design. Though I will offer some constructive criticism which I am only too happy to be taken with a very large grain of salt. (In fact I offer this as an opportunity for myself to learn also and look forward to finding out if I am seeing things that are viewed differently by the experts.)</p>
      <p>Let me begin by saying I really like the feeling that this typeface exudes, its got a great energy and seems like fun!</p>
      <p>Looking at the face as it stands I feel that perhaps the 'a', 'g', and 'e' seem to have a slightly different vertical axis than the rest of the face. These three glyphs feel as though they are 'falling' to the left a little more than the others which lean toward the right.</p>
      <p>Should the counter of the 'g' and 'e' be on a similar axis? Perhaps the 'o' also? The counter of the 'a' perhaps seems a little squished relative to the 'b' &amp; 'd' etc?</p>
      <p>Could the space between the cross bar and counter of the 'f' be loosened?</p>
      <p>I hope some of these thoughts are useful, and look forward to seeing you progress.</p>
      <p>Good luck.<br>
      -nic</p>
