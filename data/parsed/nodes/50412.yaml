    <p>Hey everyone!</p>
    <p>I’m supposed to create a presentation for a course that I’m in and am looking for a nice sans serif font for body text. It needs to be clean, slightly condensed and it should be capable of a some torturous glyph scaling in Indesign.</p>
    <p>the only font i can think of is Vectora but I’ve used that to death. Anyone with any other suggestions?</p>
    <p>thanks for the time!<br>
    arjun</p>
