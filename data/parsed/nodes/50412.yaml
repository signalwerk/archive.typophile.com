      <p>Grotext? Really? I always have trouble thinking anything but “children’s book” when I see it. And call me stupid if you like, but I don’t see the blackletter in there (and folks at my classes have been telling me I see blackletter everywhere).</p>
      <p>Anyway – I’d even try something really blackletter-ish. <a href="http://www.vllg.com/Thirstype/Kaas/mudTyper+Weights/">Kaas</a> comes to mind; see attach, I hope you don’t mind my quick comp. Maybe something lighter, but equally modern, would be very nice too.</p>
      <p>I like how the lettershapes interact with the origami-like shapes of the lamp (Hrant’s quote of the “crystalline flower” is a wonderful way of putting what I probably want to say here :) ), and how they’re oscillating between historical (&amp; “home sweet home” style traditional) and techno aesthetics.</p>
      <p></p><div class="imageWrap"><img src="/files/kaas1_6161.jpg"></div><br>
      <div class="imageWrap"><img src="/files/kaas2_5864.jpg"></div><p></p>
