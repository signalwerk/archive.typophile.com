    html: "<p>I made fonts for MS WEB-TV in 1998. <br> <br>Fonts should have 2 pixel wide features, stems, counters or serifs and spaces between letters. If they are one pixel they will be lost in most cases due to the line scans and blur.  <br> <br>Bigger size and bold is better.  <br>Colours: No pure Black on pure White... causes visable movemnet and noise.  <br> <br>Use Anti-aliasing or anti-flicker filters to smooth out the colours so the gun doesn't cause noise or spikes. ie... going from full OFF to FULL on is bad that's why pure black and pure white are bad.  <br> <br>Our fonts were manually tuned and use Windows CE and Windows anti-aliasing, plus an additional filter for antiflicker.  <br> <br> <br></p>"
    html_clean: "<p>I made fonts for MS WEB-TV in 1998. <br> <br>Fonts should have 2 pixel wide features, stems, counters or serifs and spaces between letters. If they are one pixel they will be lost in most cases due to the line scans and blur.  <br> <br>Bigger size and bold is better.  <br>Colours: No pure Black on pure White... causes visable movemnet and noise.  <br> <br>Use Anti-aliasing or anti-flicker filters to smooth out the colours so the gun doesn't cause noise or spikes. ie... going from full OFF to FULL on is bad that's why pure black and pure white are bad.  <br> <br>Our fonts were manually tuned and use Windows CE and Windows anti-aliasing, plus an additional filter for antiflicker.  <br> <br> <br></p>"
