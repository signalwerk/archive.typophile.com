  html: <p>hi there, <br> <br>i'm currently working on a project for TV.  <br>task is to design a form full of text information. <br>I'm wondering what are the most-suitable typefaces for broadcast. I tried Univers, Helvetica, but its not very good in terms of legebility. Those font that work best on screen dont work on TV. I'm thinking if i should go for FF meta, FF info? whatelse should i try? <br>please name a few... <br> <br>appreciate your help <br> <br> <br></p>
