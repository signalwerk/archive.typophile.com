    html: <p>Some would argue that Tiresias is the only way to go, as it was designed with these very limitations in mind. <br> <br>Joe Clark, the undisputed expert in this particular field, would probably say that the current state of television-font affairs is in an atrocious way (check it all out at joeclark.org). <br> <br>Of course some people will let Helvetica and Univers pass muster for these sorts of jobs--but Tiresias will probably be your best bet.</p>
