    date_raw: 6.Jul.2008 7.43am
    votes: null
    html: |-
      <p>I’ve seen so many references to Sciptina, and not one that didn’t look awkwardly set. I understand why people are attracted to the large open swashes. They look a lot like what a lettering artist like Rob Lueschke might do. But Rob’s fonts set properly. Scriptina doesn’t.<br>
      I used to teach calligraphy classes and one of the most common things students do is over emphasis curves and swashes. Subtlety is needed even when there is a lot of eye candy involved. Like many free fonts, Scriptina is an under developed idea.</p>
