      <p>Scriptina has been around for at least 6 or 7 years, and it has been popular since ’Apostrophe’ first made it available. Free is a big part of its appeal, but the attention it attracts, even when people don’t know what it costs shows that they like the style of it. Whether they <em>should</em> like it is a matter of opinion, but it is eye-catching, graceful and different, and sometimes that’s what the people want.</p>
      <p>- Mike Yanega</p>
