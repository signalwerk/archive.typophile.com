    <p><a href="http://charmaineolivia.com/" title="http://charmaineolivia.com/">http://charmaineolivia.com/</a></p>
    <p>One of my favorite artists.. She does both traditional and digital media, and sells handmade prints of her work in her Etsy store! If you look, she does do a good bit of hand lettered type. Her website is simple, yet effective! I'm really loving the recycling of her sketchbook doodles in her layouts and other work too..</p>
