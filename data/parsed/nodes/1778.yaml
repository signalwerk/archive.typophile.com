    html: <p> thanks so much for the replies <br> <br>Jacques - I don't believe I fully understand what you're saying - but what I think are your ideas are interesting - I'd imagine transposing the 'texture' of this font under a different / more typical screen font could maybe lead to some surprises. <br> <br>the font came from a few different ideas, most prevalent was the old DOS boot-up screen font; I'm pretty sure that has the same 'scanline' look to it.  also old fonts that worked w/ dot matrix printers... anyway there's gotta be at least a few fonts like this already in existence... like rodolfo's ;) <br> <br>found the limitations in making this font to be interesting though, which is pretty much why I made it.. I definitely agree with you stephen about the 'y'... sticks out like a sore thumb actually <br> <br>again thanks very much for your comments and ideas.  it means a lot, I don't know what I'm doing :D <br> <br>- andrew </p>
    html_clean: <p> thanks so much for the replies <br> <br>Jacques - I don't believe I fully understand what you're saying - but what I think are your ideas are interesting - I'd imagine transposing the 'texture' of this font under a different / more typical screen font could maybe lead to some surprises. <br> <br>the font came from a few different ideas, most prevalent was the old DOS boot-up screen font; I'm pretty sure that has the same 'scanline' look to it.  also old fonts that worked w/ dot matrix printers... anyway there's gotta be at least a few fonts like this already in existence... like rodolfo's ;) <br> <br>found the limitations in making this font to be interesting though, which is pretty much why I made it.. I definitely agree with you stephen about the 'y'... sticks out like a sore thumb actually <br> <br>again thanks very much for your comments and ideas.  it means a lot, I don't know what I'm doing :D <br> <br>- andrew </p>
  - id: 13982
    user: 916
    date: 2002-08-05T20:56:00
    date_raw: 5 Aug 2002 — 8:56pm
    votes: null
    html: "<p>Andrew, make Paul Rand with his striped version <br>of City for IBM the first of us. ;)  <br>Your face has merits, mine was an incomplete <br>one-off affair. <br>About the 'y': what's interesting is that you've <br>achieved almost an italic construction in letters <br>like b, g. Quite a feat, considering the <br>constraints. You should try to obtain the same  <br>suppleness in other characters, like the y that's <br>been mentioned. Just as an experiment, I've tried <br>two alternatives to your y: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/1948.gif\" alt=\"temp_ac.gif\"> <br> <br>I've also fiddled with the v and the d (in the word  <br>'traded'). You could try to 'italicize' more your <br>design (italicize, not slant ;) <br> <br> <br>&gt;Rodolfo, what about that font you used for your typographi.ca banner? (V2000?) It looks interesting, like it has *vertical* scanlines, and it's made of two fonts that combine in different colors or something... Wazzat? <br> <br>Hrant, that 'font' was done in fact for print. It <br>was a set of pseudo-bitmaps I designed to use in <br>a poster. The idea was that odd and even \"vertical <br>scanlines\" were differently colored - but with some <br>\"pixels\" out of place according to letter structure <br>(in the case of the typographica banner, *many* <br>pixels). This construction principle allowed different <br>shapes to emerge. I think I have an image of the <br>thing as it was used somewhere. If I find it, I'll <br>post it. V2000 was a codename (the poster was <br>called \"Verão 2000\", which means \"Summer 2000\".)</p>"
    html_clean: "<p>Andrew, make Paul Rand with his striped version <br>of City for IBM the first of us. ;)  <br>Your face has merits, mine was an incomplete <br>one-off affair. <br>About the 'y': what's interesting is that you've <br>achieved almost an italic construction in letters <br>like b, g. Quite a feat, considering the <br>constraints. You should try to obtain the same  <br>suppleness in other characters, like the y that's <br>been mentioned. Just as an experiment, I've tried <br>two alternatives to your y: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/1948.gif\" alt=\"temp_ac.gif\"> <br> <br>I've also fiddled with the v and the d (in the word  <br>'traded'). You could try to 'italicize' more your <br>design (italicize, not slant ;) <br> <br> <br>&gt;Rodolfo, what about that font you used for your typographi.ca banner? (V2000?) It looks interesting, like it has *vertical* scanlines, and it's made of two fonts that combine in different colors or something... Wazzat? <br> <br>Hrant, that 'font' was done in fact for print. It <br>was a set of pseudo-bitmaps I designed to use in <br>a poster. The idea was that odd and even \"vertical <br>scanlines\" were differently colored - but with some <br>\"pixels\" out of place according to letter structure <br>(in the case of the typographica banner, *many* <br>pixels). This construction principle allowed different <br>shapes to emerge. I think I have an image of the <br>thing as it was used somewhere. If I find it, I'll <br>post it. V2000 was a codename (the poster was <br>called \"Verão 2000\", which means \"Summer 2000\".)</p>"
