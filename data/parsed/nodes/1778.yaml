    html: "<p>Nice, Andrew. Interestingly, I've done something <br>very similar some time ago: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/1946.gif\" alt=\"typost.gif\"> <br> <br>In my case, it wasn't exactly a \"scanline\" font, <br>as I used both odd and even lines as I wished. It <br>was made for a small project, and I didn't bother <br>then to design all characters, only letters and <br>numerals. Also, some of these characters weren't <br>really worked up, as they wouldn't be used at all. <br> <br>I like the narrow fit of your characters, and the <br>color is quite even. <br> <br>regards, <br>R</p>"
