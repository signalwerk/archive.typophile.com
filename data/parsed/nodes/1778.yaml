    html: <p> This looks good. Fine work. <br> <br>What I like about the idea, even if it wasn't ment to be, is the way this type becomes a colour (gray) of its own.  <br>Interesting would to combine this with a text type. In which you experiment with the width and the distance between the 'lines'.  <br>You could even try to make a family with for example 9 wheights (10% gray, 20% gray, etc....) <br> <br>Jacques </p>
