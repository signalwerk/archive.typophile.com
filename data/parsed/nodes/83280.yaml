    html: |-
      <p>The blue one looks like it might be a photo of a dirty wall surface that was combined in Photoshop with the illustration (each put on a different Photoshop layer and then combined using blend modes). As vilbel said, textures are widely available. Many sites offer free textures, and commercial sites like iStockPhoto have tons of them for a few bucks apiece (one nice thing about a commercial site like iStockPhoto is their search engine that lets you find textures by description, colors, etc.). And a Google search will turn up many sites devoted to textures techniques.</p>
      <p>The other graphic looks to me that the texture was drawn as part of the illustration, rather than being an unrelated texture that was overlaid.</p>
