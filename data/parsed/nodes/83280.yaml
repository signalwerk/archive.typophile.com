    html: |-
      <p>Well, there's a bit of lettering in one of the images … maybe that counts …</p>
      <p>Is it Illustrator or Photoshop? I wouldn't know, but if I were going to do it, I wouldn't use either. Make the texture using real-world materials and photograph it. I recently did a grunge logo, not by messing with the vectors in Illustrator, but by printing the clean logo, crumpling it, dampening it, stomping on it, rubbing pencil shavings all over it, etc. It looks great. The best way to do this kind of thing is to actually do it.</p>
      <p>The texture in the first image looks like a letterpressed plate. So maybe you should design your image, have it made into plates, print it letterpress on rough paper, and photograph it. Or, better yet, if you're designing for print, let the letterpress piece be your final product.</p>
    html_clean: |-
