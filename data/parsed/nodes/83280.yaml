      <p>Maybe the problem is not with the textures but with the way you're applying them. Can you post an example of a graphic where you applied a texture and didn't like the result?</p>
      <p>(My guess is that you're just using the textures in a subtractive way as a mask to delete or obscure portions of your graphic, but in the examples you posted that you liked they were using textures in both an additive and subtractive way.)</p>
