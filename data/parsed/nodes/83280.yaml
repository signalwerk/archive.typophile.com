    <p>Hi Everyone,</p>
    <p>I'm a really newbie when it comes to design processes and I have yet to figure out the trick to make amazing textures in graphic and illustrative pieces. Pieces like these from Mikey Burton and Dan Cassaro with this gritty, xerox type texture are amazing and something I am trying mimic in a piece I'm working on. </p>
    <p>Does anyone have any tips, suggestion or can point me in the right direction of a tutorial  of how to accomplish this? Is it all photoshop or is there some sort of special transparency trick in illustrator I am missing?</p>
    <p>Thanks!</p>
