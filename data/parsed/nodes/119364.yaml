    html: |-
      <p>This could be the Bitstream version of Handel Gothic, or a typeface based on Handel, called Fourche:<br>
      <a href="http://www.myfonts.com/fonts/bitstream/handel-gothic/" title="http://www.myfonts.com/fonts/bitstream/handel-gothic/">http://www.myfonts.com/fonts/bitstream/handel-gothic/</a><br>
      <a href="http://www.shyfoundry.com/fonts/shareware/sffourche.html" title="http://www.shyfoundry.com/fonts/shareware/sffourche.html">http://www.shyfoundry.com/fonts/shareware/sffourche.html</a></p>
      <p>NOTE: only the Bitstream version of Handel has the straight-legged R and the rounded U--all the others have a curved leg R and/or a U with one straight side. </p>
      <p>TSVOI looks artificially widened, if it is Fourche.</p>
