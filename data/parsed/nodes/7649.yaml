  html: <p>Hello all! <br> <br>I am putting together a project in which I am trying to assess the impact of hand lettering on type design.  In this respect I want to find out what kind of influence styles such as graphiti, 60's psychedelic poster lettering, and more contemporary scrawl have on the modern design of type.  I also want to know what kind of influence calligraphy has on type design at the present time.  I would like to hear any thoughts you have on the subject, as well as tips and tricks for both type design, and hand lettering. <br>The idea is to put together a book encouraging students to study letter forms by drawing them ( the computer seems to have had a negative effect since the days of hand rendering on how students learn about form).</p>
  html_clean: <p>Hello all! <br> <br>I am putting together a project in which I am trying to assess the impact of hand lettering on type design.  In this respect I want to find out what kind of influence styles such as graphiti, 60's psychedelic poster lettering, and more contemporary scrawl have on the modern design of type.  I also want to know what kind of influence calligraphy has on type design at the present time.  I would like to hear any thoughts you have on the subject, as well as tips and tricks for both type design, and hand lettering. <br>The idea is to put together a book encouraging students to study letter forms by drawing them ( the computer seems to have had a negative effect since the days of hand rendering on how students learn about form).</p>
