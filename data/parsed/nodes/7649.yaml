    html: <p>Eric Gill might be a good subject (although out of the range you have described), he saw himself as a stonecarver more than a type designer, but still produced a design which can hold its own against most modern designs. His prowess as a carver and engraver, which in turn gave him a familiarity with pitfalls of letter drawing, were instrumental in the commissions to create typefaces. I have just finished Fiona MacCarthy's biography which is fascinating. <a href="http://www.letraset.com/uk/info/type_gallery/wdewordekeepsake.asp" target="_blank">http://www.letraset.com/uk/info/type_gallery/wdewordekeepsake.asp</a> This has some beautiful drawings (scroll down), I tried the email address to get a copy but have had no reply. I know it's not exactly what you had in mind, but I found it stimulating. <br>Tim</p>
