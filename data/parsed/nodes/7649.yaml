    html: <p>Thanks a lot for all the posts so far!   <br> <br>Your words are extremely helpful in this early stage of researching and collating material for this project in that I can begin to see all the various threads which connect to the subject area of lettering and type. <br>Stone carving and engraving are fascinating subjects, and as important in the development of the letterform as calligraphy, and the other areas I mentioned; the Eric Gill biography sounds like some pleasant reading, I shall certainly make the effort to locate a copy.  It would be fantastic if I could find someone to give me the stonecarver/engravers point of view; I wonder what the difference would be between how a stonecarver looks at letterforms, and how a calligrapher looks at letterforms?  Obviously there are differences in the media, but does this shape the preferences of the practioner; does the aesthetic taste vary depending on the profession?  It is true that there is a difference between the way you shape black/white, and the interface/tool you use.  That remark made me really think about 'shaping', it created a link in my mind between the process of lettering, and sculpture, particularly in relation to the work of Wes Wilson, the psychedelic poster artist.  He, like a sculptor worked from the outside in, from the counters, and counter forms. <br>I've just read the article on House Industries in Grafic magazine (august 2004) and apparently they intend to 'rewrite design history to include overlooked practitioners', which is a sentiment I wholeheartedly agree with.  A lot of design gets overlooked for reasons of fashion, and 'someone elses' taste.  I would love to speak to those guys, but i'm sure they keep very busy; any ideas on how best to approach them?   <br> <br>Thanks again Mr Daly, Mr Papazian, and Mr Berkson.  Hope to speak again soon.</p>
