    html: "<p>A 2001 exhibit in San Francisco was organized around this very topic: Zapfest focused on Hermann and Gudrun Zapf, but also displayed alphabets and type designs by other lettering people (including Michael Harvey). The catalog for the exhibit is still available. It's called Calligraphic Type Design in the Digital Age, by John Prestianni. This book could point you in several directions. I agree that the House Industries boys are also very actively exploring the boundaries between lettering, calligraphy and type, escpecially now with the PLINC resources at their fingertips. Jim Parkinson, who has done lots of custom lettering as well as typefaces, might also be a good person to talk with. There are surely others. <br> <br>Hrant has a good point; people with very different skills can end up designing typefaces: handwriting, calligraphy, pen lettering, brush lettering, signpainting, and punchcutting all provide different ways of producing type forms. These differences might be interesting for your students to explore.  <br> <br>Carl</p>"
