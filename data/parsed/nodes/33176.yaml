      <p>I've updated the first post with a PDF for you guys to peruse. It will be the same PDF that Myfonts uses for their "gallery" image.</p>
      <p>The fonts have a full character set (pretty much everything here sans some of the mathematical characters: <a href="http://www.alanwood.net/demos/macroman.html" title="http://www.alanwood.net/demos/macroman.html">http://www.alanwood.net/demos/macroman.html</a>). The Myfonts character set viewer does not currently support referenced characters in OT fonts, so you won't be able to see the accented characters there yet on their site. But they are there. Myfonts has informed me that it will be a couple of months before that is fixed.</p>
      <p>P.S. I think the lowercase g makes the font also. Be sure to check it out in the PDF.</p>
