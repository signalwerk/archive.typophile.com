    <p></p><div class="imageWrap"><img src="http://typophile.com/files/blog_quantico_3417.gif"></div><p></p>
    <p>I'd like to announce the release of my latest type family, Quantico. Quantico is an angular typeface family that was inspired by old beer packaging and military lettering. It utilizes 30 degree angles and completely straight lines to form unique character shapes. Equally at home in text or display settings, Quantico includes 3 alternate characters as well as several ligatures.</p>
    <p>Buy and preview it now at <a href="http://www.youworkforthem.com/product.php?sku=T0103" rel="nofollow">Youworkforthem</a> and <a href="http://www.myfonts.com/fonts/madtype/quantico" rel="nofollow">Myfonts</a></p>
    <p>And don't forget to stay tuned to my latest efforts via <a href="http://www.madtype.net" title="www.madtype.net">www.madtype.net</a> and my recently implemented blog.</p>
