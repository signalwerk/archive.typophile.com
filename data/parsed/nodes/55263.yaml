    <p>My son, Erik, loves letters!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/type_erikandsign_4416.jpg"></div><p></p>
    <p>He's 18 months old and notices letters everywhere, and yes, his favorite part in movies and cartoons is... the credits! I inherited this trait from my father, and so it's more evidence that love of letters can be genetic.</p>
