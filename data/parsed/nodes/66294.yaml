  html: |-
    <p>Does anyone know what happened to the Tracklist in the own settings? They have shrunk since the last update. Before I had a tracklist which went over one or two pages, now I have only 11 entries. Also haven’t found out how those remaining entries have survived. Some are a few weeks old, others are years old.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/tracklist_5090.png"></div><p></p>
    <p>Is someone having the same problem, or is that just me?</p>
    <p>I hope the postings are not gone. Was easier to find recent postings …</p>
    <p>Sorry if that was discussed before, but haven’t found something alike.</p>
