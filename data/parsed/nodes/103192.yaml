      <p>Jaspert's Type Encyclopedia explains the process:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/NeulandInfo__5996.jpg"></div><br>
      The logo seems bolded, even when one considers the variation in the original. Here is one size from 1923--I am using a fairly large scale image so the details are clear:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/NeulandI@40percent_6731.jpg"></div><br>
      Love the font. Endlessly abused for variations that Koch would find silly, but the originals remain fresh to the modern eye.<br>
      Don<p></p>
