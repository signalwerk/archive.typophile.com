      <p>hmm</p>
      <p>seems to be based on old french font from turn of the century....</p>
      <p><a href="http://www.myfonts.com/fonts/bitstream/typo-upright/" title="http://www.myfonts.com/fonts/bitstream/typo-upright/">http://www.myfonts.com/fonts/bitstream/typo-upright/</a><br>
      A faithful reproduction of the common French Ronde of the nineteenth century; the design originates at the Inland Typefoundry in St. Louis as French Script and was revised by Morris Fuller Benton in 1905 and made popular by ATF under the name Typo Upright. Stephenson Blake also had a version available as Parisian Ronde.</p>
