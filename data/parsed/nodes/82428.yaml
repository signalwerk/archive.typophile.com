    html: |-
      <p>First let's start with the Hebrew body text:<br>
      1. you could actually make it a little smaller if you like.<br>
      2. you could add a bit more letter space (not word space).<br>
      Now for the English body text.<br>
      1. the kerning is a bit rubbish.<br>
      2. I would tighten the tracking.</p>
      <p>the script names look great. Don't touch them!</p>
      <p>Everyone makes (imo) the mistake of trying to match Hebrew and English. Forget it. They are two different languages built differently. Try to get the English to compliment the Hebrew. They don't have to be the same colour. Think of it as trying to put to shapes next to each other which are not the same size. They don't have to be the same colour to look nice. You can have a dark grey shape next to a light grey shape and they will look lovely. But if you try and have two greys that are nearly the same, then it becomes very difficult.</p>
      <p>That's my two cents worth (with British spelling :-) )</p>
