    <p>I have designed an invitation for the celebration of my daughter's bat mitzvah. To match the grey / x-height / etc. between the Hebrew and the English, I went through a few iterations.</p>
    <p>Initially, I was using a script face for both languages; however, I wasn't too happy with the English, so I changed everything but the name(s). Once I spaced the two sides, the Hebrew ended at 9.5/18 and the English at 11.5/18.</p>
    <p>Initial typefaces were Fontbit Egotrip (Hebrew) and Sudtipos Adios Script (English). Those are still the faces of the names. The rest of the text is now Fontbit Hadasa New and Mrs. Eaves.</p>
    <p>Any thoughts on the height of the Hebrew? OK? Too small? I haven't gone through the text to make sure kerning is correct, but I'm happy to take suggestions.</p>
    <p>The sample is attached.</p>
    <p>Thanks!</p>
    <p>Steve</p>
