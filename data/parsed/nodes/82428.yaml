    html: |-
      <p>I think that the Latin-alphabet script typeface is legible, and does not need to be replaced. I can't really comment on the legibility of the Hebrew one, but it doesn't appear to be likely to be unreadable.</p>
      <p>For a formal invitation, it is reasonable to use a Roman typeface with a small x-height. But doing so is what has created the problem with the invitation; the Hebrew takes up a small proportion of the space, and yet it already looks visually larger than the Roman.</p>
      <p>Since using a typeface with a large x-height for the Roman would simply be inappropriate, I think that one has to simply live with this contradiction. Thus, while I would suggest increasing the size of the Hebrew text from what it is in the example, I would suggest only a very slight increase, so that the line widths of the Hebrew text remain somewhat smaller than those of the English text.</p>
