      <p></p><div class="imageWrap"><img src="/files/LabelsN.jpg"></div><br>
      Bear in mind that the resolution of embroidered labels is quite low, around 110 tph (threads per inch) horizontally, and strangely variable in the other direction. So unless your lettering is specifically “pixelized” (see “TORONTO”), fine type will get the jaggies.<p></p>
