      <p>the Hundreds: a frankestein... "the" looks like to come from <a class="freelinking external" href="http://www.myfonts.com/search/brush+script" rel="nofollow">Brush Script</a>, "H" from <a class="freelinking external" href="http://www.myfonts.com/search/rage+italic" rel="nofollow">Rage Italic</a> and "undreds" close to <a class="freelinking external" href="http://typophile.com/node/70274" rel="nofollow">Spoleto/Aktuelle/Athletic Script/Opti Sport Script</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jukebox/fenway-park-jf" rel="nofollow">Fenway Park</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/artistofdesign/az-cut-script" rel="nofollow">Cut Script</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/cubanica/vitrina" rel="nofollow">Vitrina</a><br>
      Undftd: also close to <a class="freelinking external" href="http://typophile.com/node/70274" rel="nofollow">Spoleto/Aktuelle/Athletic Script/Opti Sport Script</a>. More in the same vein: <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/ht-trattoria" rel="nofollow">Trattoria</a>, <a class="freelinking external" href="http://www.dafont.com/team-spirit.font" rel="nofollow">Team Spirit</a>, <a class="freelinking external" href="http://mvbfonts.com/mvb_mascot/mvb_mascot" rel="nofollow">Mascot</a>, <a class="freelinking external" href="http://marketplace.veer.com/font/Varsity-Script-JBT0000052" rel="nofollow">Varsity</a></p>
