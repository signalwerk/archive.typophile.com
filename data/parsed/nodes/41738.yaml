      <p>Contrary to popular belief, White is not a colour. And is never seen as colour. White is achromatic - without hue. The grayscale, achromatic scale, is an amazing thang in itself - but should never be confused or misinterpreted as Colour. I see white and black, as extremes on the grayscale - neutrals. </p>
      <p>Black is understood to be as pure as White. Pure, as in ’complete’. Colours, on the other hand, are a groovy bunch of frequencies each with a long long history. A nice site for colourists is colourlovers dot com.</p>
      <p>When I think of the word ’hygiene’ in terms of colour design and medical profession, I think of a colour in relation to white. But really any colour can also be presented in a relationship with Black, or any other gradation of the achromatic scale for that matter, to also represent ’hygiene’. What kind of cleansing/hygiene are we talking about?</p>
      <p>Religious?<br>
      Fashion?<br>
      Techno?<br>
      Type?<br>
      Architecture?<br>
      Medical?<br>
      Tribal?</p>
