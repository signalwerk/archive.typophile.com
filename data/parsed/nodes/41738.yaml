      <p>Do any of you own a white toothbrush? I’m guessing no. What word is most associated with hygiene in terms of body, IMHO, oral. Oral hygiene. I hear it on the radio, tv, print ads etc. Yet, none of us has a toothbrush that is white. With the advent of the two-shot injection molding process, toothbrushes have gone crazy with color and texture. I find it fascinating that white comes to mind most often as the color associated with hygiene, yet something we place in our own mouth to clean our white (hopefully) teeth is a myriad of colors/textures that don’t necessarily evoke hygiene. Yet when we clean our ears its with a white cotton tip.</p>
      <p>The thoughts that keep me up at night. . .</p>
