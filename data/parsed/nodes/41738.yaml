      <p>Colour does not mean “having a hue”. That’s what the word hue is for :-). It’s the effect of perception of electromagnetic waves via the eye as processed by the brain. White is part of it, as is any other colour.</p>
      <p>White is a bunch of different frequencies (incidentally: _all_ the frequencies human sight cells can process) as are most other colours having a hue (except for the ones in the rainbooow!)</p>
      <p>There is a describable difference between white and any other colour (as is between any two “hueful” colours), but no fundamental one (as there is none between two “colours” as proposed by you).</p>
      <p>White _is_ a colour. Perfect black is one as well. While perfect black is arguably the _lack_ of electromagnetic waves, there exists the perception of this lack via the eyes as processed by the brain; that is the _colour_ black.</p>
