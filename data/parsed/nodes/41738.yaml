      <p>I first thought of white as well. I was reminded of the article written by Luke Williams of Frog Design comparing the iPod to bathroom fixtures.<br>
      <a href="http://www.frogdesign.com/design-mind/articles/early-articles/the-ipod-and-the-bathtub.html" title="www.frogdesign.com/design-mind/articles/early-articles/the-ipod-and-the-bathtub.html">www.frogdesign.com/design-mind/articles/early-articles/the-ipod-and-the-...</a></p>
      <p>I then went the way of dr’s/nurses’ scrubs: powder blue only to find out that the color is called ceil blue. Webster defines ceil as: </p>
      <p>ceil  </p>
      <p>Main Entry: ceil<br>
      Function: transitive verb<br>
      Etymology: Middle English celen, from Medieval Latin celare, caelare, perhaps from Latin caelare to carve, from caelum chisel; akin to Latin caedere to cut<br>
      Date: 15th century<br>
      1 : to furnish (as a wooden ship) with a lining<br>
      2 : to furnish with a ceiling </p>
      <p>To me, it had no real connection to the color blue. I know cielo means sky in Italian. That makes much more sense to me than Webster’s definition. I had never heard of ceil blue before and thought it a color made up by a company making scrubs. Apparently it has transcended that market and made its way into shoes, necklaces, etc. Have any of you heard of ceil blue before and possibly know its origins?</p>
