      <p>OK I thought about this while showering in my nice white bathroom. White makes obvious sense - it’s the color of nurse’s uniforms, porcelain sinks, cleanliness etc. But why the insipid pastels? I think it’s because those are colors that don’t come out of our bodies. Red (blood), yellow (pus, pee), brown (well you know) etc - none of those more natural colors would work to suggest hygiene.</p>
