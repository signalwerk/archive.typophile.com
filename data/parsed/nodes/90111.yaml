      <p>The buy vs build calculation is pretty easy. How much is the license for the rights you need? How much will a custom font cost to develop? Factor in how much do you value exclusivity vs how soon you need the font. If these figures come out to be about the same you can use them to negotiate a better license price from the foundry.</p>
      <p>With respect to the "pay someone to make a clone font" question, unless the original design is in the public domain, very few (if any) self respecting type designers will make a clone for you. </p>
      <p>So don't show the type designer the "original", just write a brief that describes exactly what you want, perhaps with some examples of a range of common typefaces that share some of the characteristics your looking for, eg. we want it to have serifs like... Nine times out of ten the results will be a better fit than the original.</p>
