      <p>There are indeed many variables! So many that it's<br>
      hard to imagine anybody offering a workable formula.</p>
      <p>The math for the raw numbers is easy: for the cost of<br>
      the number of "seats" of the existing font(s) that you<br>
      need, can you get a quality custom solution instead?<br>
      Much harder is quantifying how much exclusivity* is<br>
      worth to you. Concerning which you might consider the<br>
      following useful twist: you can limit your exclusivity to<br>
      a number of years. This nicely lowers the cost without<br>
      overly damaging the brand since time dilutes the novelty<br>
      of a brand anyway.</p>
      <p>* Which requires quite a bit of deviation from<br>
      an original; it might be better to simply start<br>
      from scratch, and only point out specific fonts<br>
      as sources of inspiration.</p>
      <p>Do you already have type designers you like to work with?<br>
      If not, please do consider asking my foundry for a quote:<br>
      hpapazian at gmail dot com</p>
      <p>hhp</p>
