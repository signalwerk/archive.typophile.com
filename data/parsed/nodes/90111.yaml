    <p>From a licensing perspective, at what point does it start to become more cost efficient for a large corporation to commission a proprietary brand typeface over licensing an existing one?  (Of course there are many variables… but any general rules around number of licenses, types of licenses, etc.?)</p>
    <p>And in going about doing so - if an agency wants to commission a new typeface based on an existing typeface, what is the correct way of doing so (to avoid situations like this: <a href="http://typophile.com/node/66761" title="http://typophile.com/node/66761">http://typophile.com/node/66761</a>)? What should the design agency have done in this case (other than not claim the font was "proprietary") ?  I assume the etiquette is to reach out and discuss/work with the original typeface's designer first (if they are still working professionally), adjust the typeface enough so that it is truly unique and worthy of a distinct name/file, and give credit (and/or compensation?) to major influences? </p>
    <p>I've been finding some posts that hint at some of this, but nothing direct. Sorry if this is a repeat question.</p>
