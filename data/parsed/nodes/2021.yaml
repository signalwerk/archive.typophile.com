    html: <p>Now the oil will be labeled a Croatia product but do they actually produce to olives there or somewhere else. You could use a term on the bottle like "Only the finest quality olives from the (blank) region of (country) were used in this first pressed oil." Do you have the company name yet and do they have a logo? A typeface that complimented but was different from the logo would be good. Is this a start up product or do they sell other products and this will be added to the line? I have so many question and so few answers. I'm a marketing based designer. I need alot of info to make smart design decisions. </p>
