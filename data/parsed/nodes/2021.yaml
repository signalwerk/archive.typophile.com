  - id: 16069
    user: 2203
    date: 2003-11-12T05:40:00
    date_raw: 12 Nov 2003 — 5:40am
    votes: null
    html: <p>A few more thoughts (sick of me yet?) Where in the store is your product going to be placed? Is it with the other Olive Oils or a speciality section? In either case I'd get competitive samples so you can make yours stand out. Also consider processes other than printing on a white label. Foil stamp or print on foil. Clear label to show the product and of course die cutting. These are all ways to make your product unique. You might reference the wine industry who does a good job in labeling.  </p>
