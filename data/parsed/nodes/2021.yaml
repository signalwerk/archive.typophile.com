    html: <p>Where is your olive oil being packaged Italy, Spain and what region within the country? Also on the marketing side, what is the target group are you selling to and what is the price point of the product? Where are you going to sell it, Europe, USA elsewhere? Will you have more than one language on the label?  Answering these questions could narrow your font search quite a bit. Dan  </p>
