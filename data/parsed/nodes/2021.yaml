  html: <p>First time on this board, and I must say I'm really impressed by the knowledge of people on this board when it comes to type. <br> <br> <br>I'm designing packaging label for olive oil bottle and I'm stuck with the vast majority of fonts to choose from. <br> <br>At first I thought Optima will suit well for the job, but now I'm not so sure. <br>So, basically im open for any suggestions. <br> <br>Thx, <br> <br>PS. sorry for my bad english.</p>
