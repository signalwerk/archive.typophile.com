  html: <p>I'm creating some period artwork and I want to make sure my type is period accurate. Does anyone have a good resource for determining what year certain fonts were created?</p>
  html_clean: <p>I'm creating some period artwork and I want to make sure my type is period accurate. Does anyone have a good resource for determining what year certain fonts were created?</p>
