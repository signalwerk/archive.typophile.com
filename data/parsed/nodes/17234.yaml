      <p>FontBook<br>
      Published by FontShop International, and due for a new version soon.<br>
      That will give you digital era.</p>
      <p>American Metal Typefaces of the Twentieth Century<br>
      Published by Oak Knoll</p>
      <p>Printing Types<br>
      By Daniel Berkeley Updike<br>
      That will take you right back</p>
