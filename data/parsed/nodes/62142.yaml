      <p>What Riccardo said. In numbers: Kozuka Gothic contains 15.713 glyphs, Myriad a mere 842. By the way, Myriad is not just ‘Latin’, it covers Greek and Cyrillic aswell. And the file size of Kozuka Gothic is not just due to the East-Asian characters (although that makes for most of it). It also holds scads of circled, squared, bracketed and reversed figures and letters, box drawing glyphs, full sets of rotated glyphs and italics, etc.</p>
      <p>@Dave (dtw), I doubt that there’s such a direct link to a ‘stand-alone Latin’ for the Laton part of Mincho, as it is the case with KG and Myriad. If there was any Adobe typeface involved at all, it might have been Utopia.</p>
