      <p><cite>it makes no sense to me why the whopping 5.3 MB is required for a medium weight font that looks similar to a number of others</cite></p>
      <p>Kozuka Gothic is a typeface intended for setting <em>Japanese</em> text. The number of glyphs it contains is at least an order of magnitude bigger than the one for a latin script font like Myriad.</p>
