    html: |-
      <p>Yes, the Latin portions of Kozuka Mincho are based on Adobe Serif MM.</p>
      <p>Instead of creating six separate instances, we created two, for the two weight extremes, using the following parameters:</p>
      <p>ExtraLight  Adobe Serif MM Weight=180 Width=500 Scale=104%<br>
      Heavy       Adobe Serif MM Weight=445 Width=300 Scale=106%</p>
      <p>We then interpolated to get the four intermediate weights, as follows:</p>
      <p>ExtraLight    0<br>
      Light        95<br>
      Regular     200<br>
      Medium      362<br>
      Bold        619<br>
      Heavy      1000</p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
      Adobe Systems Incorporated<br>
      <a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
