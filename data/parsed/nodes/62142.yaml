    html: <p>I agree, Christian, the file size shouldn't be a concern. And I noted that. Still, it makes no sense to me why the whopping 5.3 MB is required for a medium weight font that looks similar to a number of others. For example, thanks to Florian, I see where KozGoPro is a near match with Myriad Pro, yet my open type file for Myriad Pro-Regular requires only 78 KB. I guess what it comes down to is that I'm compulsive about wanting to keep my installed fonts as lean as possible.</p>
