      <p>All six weights of Kozuka Gothic Pro (and Kozuka Mincho Pro for that matter) are based on the Adobe-Japan1-4 character collection, and include 15,444 glyphs. However, the font being discussed is the "Pro-VI" version, which is based on the much larger Adobe-Japan1-6 character collection that includes 23,058 glyphs. (The "Pro-VI" versions have since been replaced with "Pr6N" versions that include the same glyphs, but are JIS2004-savvy.)</p>
      <p>Anyway, about Myriad being used for the Latin glyphs of Kozuka Gothic, that is true. And, I should point out that Myriad MM was used, and in addition to selecting an appropriate instance, the resulting glyphs were also scaled. Below is what we used for each of the six weights:</p>
      <p>ExtraLight  Myriad MM Weight=140 Width=600 Scale=112% (102% vertical)<br>
      Light       Myriad MM Weight=250 Width=580 Scale=113% (102% vertical)<br>
      Regular     Myriad MM Weight=340 Width=560 Scale=113% (102% vertical)<br>
      Medium      Myriad MM Weight=480 Width=530 Scale=114% (102% vertical)<br>
      Bold        Myriad MM Weight=620 Width=500 Scale=114% (102% vertical)<br>
      Heavy       Myriad MM Weight=750 Width=470 Scale=115% (102% vertical)</p>
      <p>But, back to the original question and concern: if you want to use the Latin glyphs in Kozuka Gothic, the easiest path is to simply use Myriad Pro. ;-)</p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
      Adobe Systems Incorporated<br>
      <a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
