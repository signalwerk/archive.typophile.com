    html: <p>If you have FreeHand 10 or 11 (MX) you can open the .ai file generated by Photoshop, with your vector data, scale it accordingly, and copy it direcly in FontLab cells using the "paste special" command of FreeHand with "eps" as the selected option. In FreeHand there's a nice "simplify" command to clean up paths, while Illustrator has another handy command to inversely "add" points for further vector manipulation.</p>
