    html: "<p>Here's how I get from photoshop to fontlab at the correct scale: <br> <br>1. Scan a fat wad of glyphs. <br>2. Fiddle with magic wand settings <br>3. Fiddle with make work path settings <br>4. Export paths to illustrator. <br>5. Open in illustrator. <br>6. Make a compound path <br>7. Fill black <br>8. Scale up (or down) until one glyph take up approx 2/3rds of a letter page <br>9. Save as EPS v.6 <br>10. Open FLAB :-) <br>11. Go to your glyph. <br>12. Import glph from EPS (you can do about 15 or so at a time) <br>13. Once you have the right basline, and scale cut and paste to the right glyphs <br>**** Take a break for Lunch **** <br>14. Now that you know the exact scale for your em square, export one of the new glyphs to EPS. <br>15. Open that back in Illustrator. <br>16. Scale the remaining glyphs to match. <br>17. Repeat the import to FLAB with the remaining glyphs. <br>**** Have a break for Dinner **** <br>18. Buy <a href=\"http://www.typophile.com/forums/messages/4100/27933.html?1079165244\" target=\"_blank\">ScanFont</a> (scroll down for Thomas' helpful info) for FontLab. <br>19. Reduce it one step :-) <br> <br>There's probably a faster way, but I'd guess ScanFont is worth the 99 bucks if you do it a lot! <br> <br>Randy</p>"
    html_clean: "<p>Here's how I get from photoshop to fontlab at the correct scale: <br> <br>1. Scan a fat wad of glyphs. <br>2. Fiddle with magic wand settings <br>3. Fiddle with make work path settings <br>4. Export paths to illustrator. <br>5. Open in illustrator. <br>6. Make a compound path <br>7. Fill black <br>8. Scale up (or down) until one glyph take up approx 2/3rds of a letter page <br>9. Save as EPS v.6 <br>10. Open FLAB :-) <br>11. Go to your glyph. <br>12. Import glph from EPS (you can do about 15 or so at a time) <br>13. Once you have the right basline, and scale cut and paste to the right glyphs <br>**** Take a break for Lunch **** <br>14. Now that you know the exact scale for your em square, export one of the new glyphs to EPS. <br>15. Open that back in Illustrator. <br>16. Scale the remaining glyphs to match. <br>17. Repeat the import to FLAB with the remaining glyphs. <br>**** Have a break for Dinner **** <br>18. Buy <a href=\"http://www.typophile.com/forums/messages/4100/27933.html?1079165244\" target=\"_blank\" class=\"link-lost\">ScanFont</a> (scroll down for Thomas' helpful info) for FontLab. <br>19. Reduce it one step :-) <br> <br>There's probably a faster way, but I'd guess ScanFont is worth the 99 bucks if you do it a lot! <br> <br>Randy</p>"
