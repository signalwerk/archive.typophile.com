    html: "<p>and there goes the weekend huh? ;^) <br>just one problem... i don't have illustrator. <br>i was wondering if i could somehow copy my vector paths and paste them directly into FontLab, more out of curiosity than anything. very interesting to see someone else's method. <br>here's my current method: <br>1 scan glyphs <br>2 run 'em through streamline <br>3 import em into the old demo verison of FLab (the eps won't work with the new version for some reason) <br>4 copy 'em from the old version and paste 'em into the new. <br>and all before lunch! <br>and then comes the cleanup process which for me has been taking several months! ha ha <br>maybe i should look into what scanfont is all about, hmm?</p>"
