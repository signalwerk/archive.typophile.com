    html: <p>This most likely is custom. <a href="http://www.fontshop.com/fontlist/families/ludwig_ot/?&amp;sample_text=GERMANIA" rel="nofollow">Ludwig</a> is a digitally available typeface that is inspired by early German grotesques, and features such a ‘G’ (apart from that, Ludwig is not very similar).</p>
