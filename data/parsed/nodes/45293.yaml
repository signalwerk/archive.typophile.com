  html: |-
    <p>Hi all — I’ve been tasked at my job to come up with a building signage package for a project we’re working on. My type skills are a bit rusty and I could use some thoughts. The only lettering on the building is shown in this photo. It’s cast metal lettering done in the late 1920s. </p>
    <p></p><div class="imageWrap"><img src="/files/Door_6052.jpg"></div><p></p>
    <p>I see it as a sort of middle ground between a serif and a sans-serif, slightly whimsical but clean and modern. The building has very clean lines and few ornaments. Our historican calls it the “half-modern” style.</p>
    <p>My sense is that this type over the door should be singular and all signage should pay respects to this without mimicry. I’ve been looking at modern, clean, sans-serifs for the majority of the signage. Most of the signs will be regulatory and identifying (tenant names, room identification, stairwell identification, etc.) but there may be some lengthier “exhibit” signage which talks about the history of the building. For that, I’ve been considering a serif header with sans-serif body but maybe the reverse would be best.</p>
    <p>In any case, would love some brainstorms on fonts that you feel “go” with this sign.</p>
    <p>thanks,<br>
    Amanda</p>
