    html: "<p>Nick, you should definitely check the \"sharpness\" setting on your new set. A few days ago I got a Blu Ray player and a copy of \"2001: A Space Odyssey\". I was horrified to see the same sort of over-sharpening effect. At first I thought it was the player, because I hadn't really noticed it with DVDs. But there didn't seem to be a setting for it on the Blu Ray player. Then I checked the setting on the HD set and it was cranked almost all the way up. I turned it all the way down and it looks great now. Having the sharpness cranked up also makes the compression artifacts look worse. They're less noticeable now, although not absent. (The type looks much better, too.)</p>"
