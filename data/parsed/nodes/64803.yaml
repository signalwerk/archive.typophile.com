      <p>I've had an HD set for about a year. The compression artifacts bother me, too, although I've gotten used to it. My wife and daughter barely notice them even when I point them out.</p>
      <p>The splotchiness of standard definition broadcasts is the most noticeable. I assume that it's because that type of video was not meant to be seen on a flat screen HD set, that when viewed on a CRT at the intended resolution, the artifacts are there, but they are not visible. CRT TVs are not only lower resolution, but less sharp and brighter. I chalk it up to fundamentally different and not fully compatible display technologies.</p>
      <p>(Type looked very different on CRT TVs, too.)</p>
