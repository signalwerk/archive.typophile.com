    <p>Just bought a flat-screen TV, and can't watch the damn thing.<br>
    In low definition, there are all kinds of artefacts.<br>
    In high def, everything is over-sharpened, so all the type has a line around it, inside and out, and the talking heads have plastic skin with exaggerated blemishes.<br>
    No, I'm not sitting too close.<br>
    Why is cranked up unsharp masking so prevalent?<br>
    It's a lot like the early days of stereo, or worse still, fake stereo.<br>
    Is it just me ("Get used to it, Nick"), or is anyone else bothered by this aggressive display of artifice, this pseudo-hyperreal simulacrum, this voyeurism of exactitude?</p>
