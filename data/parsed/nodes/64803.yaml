      <p>Serious artifacts in low-def? Really? That shouldn't be a problem on an HD set, unless your TV isn't the greatest.</p>
      <p>For HD quality, if you're watching HD television rather than Blu-Ray discs, there are noticeable artifacts from compression that can be more or less awful. They bug me as well, although our particular cable provider seems to have improved noticeably over time. I remember when I first saw it a couple of years ago it was pretty awful.</p>
      <p>As I understand it, cable providers are up against some serious overall bandwidth limitations, so they have to make quality vs channel count tradeoffs, unless fiber optic becomes more widespread.</p>
      <p>Re-reading your note, I wonder if there is some sort of "sharpness" setting you need to turn off on the TV. It may indeed be doing some kind of unsharp masking....</p>
      <p>Regards,</p>
      <p>T</p>
