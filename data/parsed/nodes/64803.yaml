      <p>I just helped my dad buy a new TV the other week. I went into the store and messed with all of the settings on all of the TVs to turn off sharpening, oversaturation, 240Hz motion "enhancement", noise reduction, skintone "enhancement", etc. I actually got the Blu-Ray to look like a real movie, and not some made-for-TV documentary from the 1980s.</p>
