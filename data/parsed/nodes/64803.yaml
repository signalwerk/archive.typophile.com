      <p>For the exact same reasons, I don't like the look of 95% of the LCD TVs - HD or otherwise. I generally prefer my old, clear Sony CRT. The problem I find is that I spend hours and hours in a day staring at a high-quality, sharp but not too sharp, high-res display with reasonable color fidelity, just-right contrast, and more brightness that I need most of the time. It's connected to my computer, and cost a bundle.</p>
      <p>I'm not prepared to spend that much dough on a high-end HD TV (and the bandwidth to support it), so all the options look poor in comparison to what I'm used to - too much contrast, bad viewing angle, awful color, image outlining, grainy movement. If I really, really want to watch something in HD resolution, I'd prefer to buy it, download it in advance, and watch it on my computer. Most of the time, though, normal old school CRT and low-res display is fine, and much more pleasant to watch.</p>
      <p>Then again, I happened to be staying with friends in Dallas while the Beijing olympics were on. They had an excellent screen the size of a moose, and an HD satellite feed. It was spectacular - and probably very expensive.</p>
