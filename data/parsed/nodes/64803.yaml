      <p>"Satellite doesn’t have the severe bandwidth limitations that (coaxial) cable has"</p>
      <p>Yes, it does.</p>
      <p>If you're getting your signal from Cable or Satellite, you're not really getting the best possible picture. Both will use various levels of compression on the channels. Some 'lesser' channels will be compressed to the point of looking like unusable JPGs. Sports and first-run movies tend to get the 'bigger pipes'.</p>
      <p>To fully test if it's your signal or your TV settings, hook up the rabbit ears and tune in your local HD PBS station. OTA HD isn't compressed so would be the 'purest' signal. </p>
      <p>Otherwise, it sounds like you maybe have a bad TV and/or bad settings and/or bad cables. My parents had a Samsung for a year before they discovered that the LCD panel had been 'sandwiched' wrong in manufacturing adding this odd distortion to the picture. (To samsung's credit, they fixed it). </p>
      <p>What bothers me the most is people that get the new big wide-screen TVs and then don't notice that they're still watching their old fuzzy standard def analog cable in stretch-o-vision. Watching Football with my FIL is agonizing. ;)</p>
    html_clean: |-
