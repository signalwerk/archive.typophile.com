    <p>I’m in the process of collecting the content for my Major Final Project for my BA degree in Graphic design currently. It will take the form of a book tackling the subject of minimalism, style and typography.</p>
    <p>Currently I am contacting a number of designers for interviews to answer a short set of questions in regard to my topic. If anyone has any names for designers that might fit in well for my project that would be appreciated. Their geographic location is not really an issue, but London based or such might be a plus. Or if you are a designer who might fit my project and be up for an informal interview of some kind, please contact me, in thread or by email, hello at manhem dot net.</p>
    <p>I have been looking to contact Willi Kunz, (Author of Typography: Macro + Micro Aesthetics, and teacher of Typography at Ohio State University) but without any success of finding any contact details. If anyone knows how to get in contact with him, that would be appreciated.</p>
    <p>Any names or such would be much appreciated. :)</p>
    <p>-Gus</p>
