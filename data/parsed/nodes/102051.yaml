    <p>Hi people,</p>
    <p>Anyone wants to give this a go?</p>
    <p>I have been fascinated with this typeface the moment I saw it. It is used by Malanie Mues in the book design for the Contemporary Artists Series by Phaidon Press. (<a href="http://www.muesdesign.com/html/contemporary.html" title="http://www.muesdesign.com/html/contemporary.html">http://www.muesdesign.com/html/contemporary.html</a>)</p>
    <p>Much thanks in advance :)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Francis_Alys_ Phaidon_Press.jpg"></div><p></p>
