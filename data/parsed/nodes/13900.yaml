    <p>Pronounced like it is spelled, an en is a measurement equal to half the <a href="/node/13761" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Em</a>. An <a href="/node/40385" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">En Dash</a> is a dash the width of the given en. Because “em” and “en” sound so much alike, the en is often referred to as the “nut,” from which the term <a href="/node/add/wiki?edit%5Btitle%5D=nut%20fractions" title="Create node &quot;nut fractions&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">nut fractions</a> is&nbsp;derived.</p>
