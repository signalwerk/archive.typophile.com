    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : En</strong></p>
    <p>Pronounced like it is spelled, an en is a measurement equal to half the <a href="/wiki/em" class="freelinking" rel="nofollow">em</a>. An <a href="/wiki/en%20dash" class="freelinking" rel="nofollow">en dash</a> is a dash the width of the given en. Because "em" and "en" sound so much alike, the en is often referred to as the "nut," from which the term <a href="/wiki/nut%20fractions" class="freelinking" rel="nofollow">nut fractions</a> is derived.</p>
