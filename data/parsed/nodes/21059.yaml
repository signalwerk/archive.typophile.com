      Lining Gothic 545. If you people can recommend any other<br>
      awkward grotesque typefaces, keep them coming!</p>
      <p>Thanks everyone.</p>
  - id: 132386
    user_id: 7479
    user_name: Geoff Riding
    user_path: null
    date_raw: 30 Jun 2006 — 11:28pm
    date: 2006-06-30T23:28:00
    votes: null
    html: <p>Personally, I think these two are just ugly. For the real <cite>charming</cite> stuff, I'd look to <a href="http://www.bertholdtypes.com/bq_library/590030.html" rel="nofollow">Akzidenz Grotesk</a>  and <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories=1&amp;font_categories_search=font_name_search&amp;searchstr=Grotesque+MT+" rel="nofollow">Monotype Grotesque</a> for its <cite>charming</cite> inconsistency throughout weights and <a href="http://www.fontbureau.com/fonts/BureauGrotesque" rel="nofollow">Bureau Grotesque</a> and <a href="http://www.processtypefoundry.com/typefaces/maple/index.html" rel="nofollow">Maple</a> for a <cite>charming</cite> interpretation of the Stephenson Blake grotesques of the late 1800s. For something akin to the <cite>charmingly</cite> fugly ATF old favourite <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LH.106477.0.1&amp;attributes.sampleSize=48&amp;sampleText=FUGLY&amp;sampleSize=96" rel="nofollow">Railroad Gothic</a>, you can’t go wrong with <a href="http://www.fontbureau.com/fonts/TitlingGothicFB" rel="nofollow">Titling Gothic FB</a> and H&amp;FJ's <a href="http://www.typography.com/catalog/champion/index.html" rel="nofollow">Champion  Gothic</a> and the<a href="http://www.typography.com/catalog/knockout/index.html" rel="nofollow"> Knockout Series</a>. :^D</p>
