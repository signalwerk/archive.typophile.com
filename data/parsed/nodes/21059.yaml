    html: <p>Personally, I think these two are just ugly. For the real <cite>charming</cite> stuff, I'd look to <a href="http://www.bertholdtypes.com/bq_library/590030.html">Akzidenz Grotesk</a>  and <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories=1&amp;font_categories_search=font_name_search&amp;searchstr=Grotesque+MT+">Monotype Grotesque</a> for its <cite>charming</cite> inconsistency throughout weights and <a href="http://www.fontbureau.com/fonts/BureauGrotesque">Bureau Grotesque</a> and <a href="http://www.processtypefoundry.com/typefaces/maple/index.html">Maple</a> for a <cite>charming</cite> interpretation of the Stephenson Blake grotesques of the late 1800s. For something akin to the <cite>charmingly</cite> fugly ATF old favourite <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LH.106477.0.1&amp;attributes.sampleSize=48&amp;sampleText=FUGLY&amp;sampleSize=96">Railroad Gothic</a>, you can’t go wrong with <a href="http://www.fontbureau.com/fonts/TitlingGothicFB">Titling Gothic FB</a> and H&amp;FJ's <a href="http://www.typography.com/catalog/champion/index.html">Champion  Gothic</a> and the<a href="http://www.typography.com/catalog/knockout/index.html"> Knockout Series</a>. :^D</p>
