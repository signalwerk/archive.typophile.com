    <p>Does anyone know the proper form of the "apostrophe" in an abbreviation of a year?</p>
    <p>…as in '09. </p>
    <p>I'm getting mixed feedback on this from various applications; InDesign, Word, Text Edit, etc. </p>
    <p>I'm assuming this version is correct:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/09_3989.gif"></div><p></p>
    <p>But, when listed in sequence Word automatically switches it around to an apostrophe, prompting a client to bring this up:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/09-10_6381.gif"></div><p></p>
    <p>I've looked all over and can't seem to find anyone who addresses this in a typographical way. Any feedback would be greatly appreciated!</p>
