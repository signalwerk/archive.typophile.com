      <p>Brian P. Lawler<br>
      Typographic Insomniac</p>
      <p>My favorite graphic designer suggests the following:</p>
      <p>To get the correct apostrophe, type PERIOD-APOSTROPHE-NUMBER, then delete the period.</p>
      <p>NEVER assume that Microsoft Word does anything correctly. It is typographically brain-dead.</p>
