    html: |-
      <p>Word just doesn't have the smarts to tell when you want an apostrophe. All it does is look at what you type immediately before and after the straight-apostrophe key, and if you have white space or nothing-at-all before, it assumes you're starting a quote and turns it into an ‘. If there's text before, it assumes you're either ending a quote or putting an apostrophe in the middle of a word, and turns it into a ’. It just can't cope with the concept of an apostrophe at the start of something, which is why it can't cope with fish ’n' chips either. But ’09 is what you want, not ‘09.<br>
      ______________________________________________<br>
      Ever since I chose to block pop-ups, my toaster's stopped working.</p>
