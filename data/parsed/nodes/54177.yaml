      <p>Well, quite. Personally, I've trained myself to type ALT+0146 as fast as any other typing, and to pre-empt when I'm going to need to. :-D</p>
      <p>I'm looking at Word's built-in keyboard shortcuts: see what you get if you type CTRL+apostrophe, then release the CTRL and press apostrophe again. According to what I can see, that should also give you a hard ’ without invoking Word's "is-this-really-a-quote?" routine.<br>
      ______________________________________________<br>
      Ever since I chose to block pop-ups, my toaster's stopped working.</p>
