    <p><img src="http://www.opentype.info/static/eszett1.jpg"></p>
    <p>With the release of Unicode 5.1 in 2008 the German alphabet got completed and has now a proper replacement for the character ß (called “Eszett” or “sharp s”) when type is set in uppercase letters or small caps. Even in Germany not everyone has ever thought about this missing character, but it usually just takes a couple of minutes to explain, why it is needed. Still, in the typographic community many completely deny the whole idea of this character. In this article I will comment on the typical problems and arguments …</p>
    <p><a href="http://bit.ly/feKYJa" title="http://bit.ly/feKYJa">http://bit.ly/feKYJa</a></p>
