    html: |-
      <p>Ralf, I agree with your arguments and I’m looking forward to seeing more /ẞ/s in the future.</p>
      <p>However, its general acceptance is highly dependent on its shape.<br>
      The ẞ with a straight stem and a top serif, like the one in Rooney and even more in Vesper, seems completely out of place – to me, it always looks like a greek or cyrillic character in a Latin typeface.</p>
      <p>The Spiekermann quote of the ‘Ansamm­lung schöner Buch­staben’ comes to mind …</p>
