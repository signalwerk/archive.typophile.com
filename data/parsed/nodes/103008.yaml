    html: |-
      <p>To me, no font is needed to do such a lettering as it is only made with strokes. You could also easily do the same starting from any pixel/bitmap font of your choice. If you still need something that could quickly do the job, may be having a look to some sections at DaFont would worth a shot: <strong><a class="freelinking external" href="http://www.dafont.com/bitmap.php" rel="nofollow">Bitmap &gt; Pixel, Bitmap</a></strong> and <a class="freelinking external" href="http://www.dafont.com/theme.php?cat=301" rel="nofollow">Techno &gt; Square</a>.<br>
      Some in the same vein: <a class="freelinking external" href="http://www.dafont.com/anascript.font" rel="nofollow">AnaScript</a> ("closing" letters), <a class="freelinking external" href="http://www.dafont.com/sf-square-head.font" rel="nofollow">SF Square Head Extended</a>, <a class="freelinking external" href="http://www.ffonts.net/MGS2-Menu.font" rel="nofollow">MGS2-Menu</a>, <a class="freelinking external" href="http://www.ffonts.net/Low-Gun-Screen-Expanded.font" rel="nofollow">Low Gun Screen Expanded</a>, <a class="freelinking external" href="http://www.youworkforthem.com/font/T0017/ywft-reversion" rel="nofollow">Reversion</a>, <a class="freelinking external" href="http://www.dafont.com/04b-31.font" rel="nofollow">04b-31</a>, <a class="freelinking external" href="http://www.dafont.com/abstract.font" rel="nofollow">Abstract</a>, <a class="freelinking external" href="http://www.fontsforflash.com" rel="nofollow">Fonts For Flash</a>, <a class="freelinking external" href="http://www.miniml.com/fonts/index.html" rel="nofollow">miniml</a></p>
