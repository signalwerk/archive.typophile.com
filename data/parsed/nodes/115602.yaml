    votes: null
    html: <p>Too many copies/rip-off/clones on the market for this one and UltraCondensed Sans Serif is one of them. I guess you could go with Michael Gill's <a class="freelinking external" href="http://www.myfonts.com/fonts/letraset/iris" rel="nofollow">Iris</a> or David Berlow and Kelley Ehrgott-Milligan's <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/empire" rel="nofollow">Empire</a>.</p>
  - id: 575701
    user: 176276
    date: 2014-04-08T07:54:00
    date_raw: 8 Apr 2014 — 7:54am
    votes: null
    html: |-
      <p>You may like:<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Letraset&amp;ffam=Iris%20LET%20-%20Plain&amp;fid=9dea0a69b9da7a09bdd65248850c707e&amp;fsize=60&amp;text=NOPQRSM&amp;fit=1" rel="nofollow">Iris</a></strong> by  Michael Gills [1930] available from Letraset, ITC<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Font-Bureau&amp;ffam=Empire%20-%20Regular&amp;fid=548f10893e9e2d53585aba24c61658fc&amp;fsize=60&amp;text=NOPQRSM&amp;fit=1" rel="nofollow">Empire</a></strong> by Morris Fuller Benton [1937] available from Font Bureau, Tilde, Bitstream, ...</p>
      <p>There are also many clones (under different names) by the usual font forgery companies like Fantazia Concepts, Cambridge Fontworks, Bay Animation, Arts &amp; Letters, etc.</p>
