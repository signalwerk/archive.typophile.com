  html: "<p>Thursday night (11/11/04) marks the gala opening of AIGA's 20th Anniversary California Show.  <br> <br>This year we have combined the competition and show opening with our fall fundraiser, making it the biggest AIGA event of the year.  <br> <br>The result of the collaborative efforts of all four California AIGA chapters, the show features 150 works selected from more than 3,000 entries, and will be attended by the Bay Area's top designers and industry partners. Thursday is the grand opening of the show before it travels to LA, San Diego, Orange County and to the National Design Gallery in New York City. <br> <br>The first 500 attendees will receive a free book from AIGA and Chronicle books, everyone will receive two free drinks with entry, we'll have free food, plenty free shwag from our sponsors, a DJ, and of course the opportunity to mingle with your peers and see some truly exceptional work. <br> <br>You can get full information on our website at: <a href=\"http://www.aigasf.org/grownincalifornia.html\" target=\"_blank\">http://www.aigasf.org/grownincalifornia.html</a> <br> <br> <br>Hope to see you there. <br> <br> <br>Christopher C.H. Simmons <br>president <br>AIGA, San Francisco</p>"
