      <blockquote><p>It seems the last font I created/saved doesn't work at all and loaded as either some other default font or not at all. Something to do with it's size? I'm struggling to figure this stuff out.</p></blockquote>
      <p>What font format do you generate? With what operating system and program do you intend to use the font?</p>
      <p>I am not sure about Windows and MacOS, but in Linux, the most convenient bitmap font format nowadays is TTF. Choose "File" &gt; "Generate Fonts" to create the font file. Choose "No outline font" as the outline format and "(faked) MS bitmap only sfnt (ttf)" as the bitmap format. This will create a TTF file that has no outlines but has the bitmap glyphs included.</p>
