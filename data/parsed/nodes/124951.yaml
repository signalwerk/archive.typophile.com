    <p>Thanks for giving this thread a look.</p>
    <p>So here is my difficulty, though I am somewhat familiar with graphics design programs like gimp, photoshop, inkscape, etc. I am having trouble converting my creations into a 10x10 pixel font file format.</p>
    <p>I am completely new to this field.</p>
    <p>I found this site <a href="http://www.pentacom.jp/pentacom/bitfontmaker2/">http://www.pentacom.jp/pentacom/bitfontmaker2/</a></p>
    <p>...which seems to have the basic design concept simplified enough, but it doesn't look like the end product will be monospace.</p>
    <p>I tried using font forge and made some progress with it, but I don't understand most of it. It seems if I adjust the "bitmap strikes" whatever they are I can create something like what I am looking for, but I am still not sure how to make something of uniform width and height and the numbers I put in don't seem to match up or make sense to me. For example putting in 10 gives me a grid that is 8 tall and 10 wide? I don't quite understand. The terminus.fon file displays in the application I am using in a clean 16x8 pixels (or so the application claims), but loads on font forge on an 11x8 grid but set to 14 pixels in bitmap strikes? These numbers don't seem to add up.</p>
    <p>If anyone knows of a way (preferably free) to create what I am trying to do, I would very much appreciate that information. Or if you can create a font file and post it that would generate a 10x10 pixel font, that would be even better! I am pretty desperate to put my designs into a usable format. My ocd can't stand rectangles over squares!</p>
    <p>Thanks in advance!</p>
