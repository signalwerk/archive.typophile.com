    html: |-
      <p>When you add a 10px bitmap strike in Fontforge, this is what you get:</p>
      <p>Fontforge gives the glyphs a height of 10px and a width of 10px. The height is divided into an upper part (which lies above the baseline) of 8px and a lower part (which lies below the baseline) of 2px. To change this ratio (800:200 by default), go to "Element" &gt; "Font Info" &gt; "General" and modify the "Ascender" and "Descender" values.</p>
      <p>To change the width of the glyphs, select all glyphs in the overview window, go to "Metric" &gt; "Set Width", and choose the width you want.  The font will be monospace if you simply make all glyphs the same width.</p>
