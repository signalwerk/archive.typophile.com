    <p>Hi folks,</p>
    <p>I was currently in such brainstrorming about ideas of thesis/research as communication student. I found phenomenon that constructivism typography are famous and strongly applied among Indonesian proletariat. Due to Indonesia was the third biggest communist nation after Soviet and China, (but now we are adopting American democracy, capitalism and liberalism). Is it having relationship between constructivism and communism as ideology. Does Constructivism art (esp. typography) correlate Communism?</p>
    <p>Thanks,<br>
    Gunarta</p>
