      <p>IIRC this book contains the Constructivist manifesto.<br>
      Semantically, it’s really not at all about “constructing” block-shaped art and letter forms.<br>
      <a href="http://books.google.ca/books/about/Graphic_Design_History.html?id=nvlPV1UNcMkC" title="http://books.google.ca/books/about/Graphic_Design_History.html?id=nvlPV1UNcMkC">http://books.google.ca/books/about/Graphic_Design_History.html?id=nvlPV1...</a></p>
      <p>Architecturally, we have the idea that construction is assembling basic rectilinear components, a Victorian idea—Paxton, rather than Nervi or Gehry.<br>
      <a href="http://vintagetoyadvertisements.com/images/1944/1944%20CONSTRUCTO%20AIRPLANE%20MOTOR.jpg" title="http://vintagetoyadvertisements.com/images/1944/1944%20CONSTRUCTO%20AIRPLANE%20MOTOR.jpg">http://vintagetoyadvertisements.com/images/1944/1944%20CONSTRUCTO%20AIRP...</a></p>
