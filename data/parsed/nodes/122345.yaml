      <p>Gunarta, I'm surprised that you referred to Indonesia as a formerly Communist country. If my history lessons haven't failed me, Indonesia once had a very influential Communist party that very nearly came to power in a coup during the mid 1960s. After that the party was pretty much dismantled and made illegal.</p>
      <p>As for constructivist art and type, yes, it's associated with Communism, but it's simply a stylistic association dating back to the Bolsheviks. The example signs look to me as though they were painted that way mainly because blockish sorts of letters are easier to paint by hand.</p>
