      <p>Maybe you will be interested in El Lissitzky's essay <em><a class="freelinking external" href="http://www.iheartcd.com/ourbook/" rel="nofollow">Our Book</a></em>.</p>
      <p>You could also read Jan Tschichold's preface to <em>The New Typography</em> (<em>The New World View</em>).</p>
      <p>Also Tschichold wrote the essay <em>Wirken sich gesellschaftliche und politische Umstände in der Typographie aus?</em> (<em>Does Political and Social Context Influence Typography?</em>), but, it seems, it is not translated to English.</p>
      <p>Of course, it does.</p>
      <p>Constructivism is connected with communist ideas same way as neoclassicism of 20th century is connected with totalitarianism and fascism, or as romanticism is connected with French Revolution... But it's too general conclusion.</p>
      <p>Could you show some examples of Indonesian constructivism?</p>
