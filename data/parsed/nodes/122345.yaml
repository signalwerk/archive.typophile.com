      <p>The constructivist aesthetic, like communism itself, reflects a sometimes-uneasy relationship between the things people make and the process of making them.</p>
      <p>Constructivist typography celebrated the fact that printing is an industrial process, unlike drawing or painting. The geometry of the constructivist poster is the mirror of the metal type locked up in the bed of the printing press. At the same time, constructivist artists set up a kind of Marxist dialectic by doing things with metal type that it wasn't designed to do, such as setting it on a curved line or a diagonal.</p>
      <p>To my eye, the contemporary Indonesian examples don't look like the constructivist typography of early Communist-era Russia. For example, the Russian constructivists often preferred asymmetrical compositions, but the Indonesian signs are mostly symmetrical. What the Indonesian signs have in common with constructivist posters is:<br>
      (1) The process of making them--in this case, hand-painting--is part of the aesthetic.<br>
      (2) The artists use letterforms as decorative shapes, not just as pieces of words. (<em>Es bir kocok</em> is an especially good example.)</p>
      <p>The individuality and inventiveness of hand-painted signs has all but disappeared from the US, and it's a great loss. I hope that Indonesia doesn't see its vernacular art displaced by the ubiquitous Arial and Comic Sans.</p>
