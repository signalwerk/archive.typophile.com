    html: <p>Yes, It's Luxembourg, sorry. The first time I got this font was also a MAC file back in 95 on the Irreligious Layout (from Moonspell) I'll ask the original designer where did he got it. I have 3 versions of this font, the MAC, the dafont &amp; the Alltype one...</p>
