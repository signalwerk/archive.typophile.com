    html: '<p>Mike, <br>That Dafont version is actually spelled Luxembourg also. <br> <br>I found two other Mac-to-PC conversions (Alltype and <br>Reasonable Solutions) online and <a href="http://www.gsaug.org/DOMextras.html" target="_blank"> here</a> (a bit less than <br>halfway down; Fonts Disk #6) is an offering of a 1995 Mac <br>floppy disk that includes Luxembourg. Perhaps the original? <br> <br>The fonts on those disks bring names like Mike Allard, <br>Marty Bee, Rick Mueller, David Rakowski, Sam Wang, and <br>others to mind. <br><br></p>'
