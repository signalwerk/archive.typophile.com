    html: |-
      <p>There isn't a PMS neon blue that has the same lightness as that RGB blue. </p>
      <p>PMS 305C has a similar tone, and printed on good  stock (read: non absorbant) it is probably also nice and bright. Unfortunately that one isn't neon...</p>
      <p>Otherwise you might have to experiment with a 'custom' ink mix, like Bert Vanderveen already mentioned. Maybe 'lightening up' one of the PMS neon blue's?</p>
