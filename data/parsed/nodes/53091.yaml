    html: |-
      <p>I do not think that you can get the bright RGB cyan in print: RGB colours are made by combining lights (i.e. bright, or 'additive mix' in geek) while printing inks work by reflection/absorption (i.e. darker, or 'subtractive mix').<br>
      prgr</p>
