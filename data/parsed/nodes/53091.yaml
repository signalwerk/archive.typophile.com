    <p>hello,<br>
    i am doing a corporate design with "RGB Colors".<br>
    For print purposes i am using the Pantone neon colors (801-812).<br>
    But i am missing a real RGB "cyan" like RGB:00ffff.</p>
    <p>does anyone know a special color, which could fit for this?<br>
    i didn't find it in Pantone, HKS, nor in RAL.<br>
    (everything i found, was more light blue or mint green.)</p>
