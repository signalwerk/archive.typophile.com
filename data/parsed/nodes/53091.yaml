    html: |-
      <p>Beware: </p>
      <p>In many cases ink companies don’t actually sell a true 801 blue. </p>
      <p>They will make this color from cyan, white, and a touch of green from bases then add optical brightener, a fluorescent agent.</p>
      <p>This is what we call in the ink industry “falsifying color”.</p>
      <p>Also mixing (true) fluorescent inks with <em>any</em> non-fluorescent ink will ruin all the fluorescent effects. Even the most pure  non-fluorescent inks will add “dirt”—another industry term meaning “reduction in chroma”... more grey, less brilliant.</p>
      <p>I suggest you tell your printer you want pantone 305c with optical brightener added. </p>
      <p>Also:</p>
      <p>Use paper the has bluing/fluorescents add— you can test this by dropping a couple of drops of isopropyl alcohol on a sheet of paper. If it does have these properties when the paper dries you should see a pretty indigo halo.</p>
      <p>Between you and me, lexter, most of the audience that will view the result of your project will not have sufficient color memory/perception to even differ amongst these shades of blue.</p>
      <p>If this corporate design of yours will also be used in signage, you must know that fluorescent pigments are not fade resistant to the sun, in fact, the most fugitive of all the the colors.</p>
      <p>You will have to use standard cyan pigments anyway... I recommend pantone 305 with o.b. for indoors and pure cyan outside.</p>
      <p>Mike Diaz :-)</p>
