    html: |-
      <p>I tried to look up some info about the swiss signage font and this is what I found</p>
      <p>"In 2003, the Swiss authorities decided to replace all traffic signs in Switzerland (which used to use the VSS font) with a variant of Frutiger known as ASTRA-Frutiger. All new signs will be in Frutiger and old signs will take around a decade to be completely replaced with Frutiger signs. The reason for this is that Frutiger is considered far more legible than the previous font, which was introduced in the 1960s and 1970s. "</p>
      <p>on this website  <a href="http://frutiger.biography.ms/" title="http://frutiger.biography.ms/">http://frutiger.biography.ms/</a></p>
      <p>So if you´re sure that the Belgian signage font is the same as the swiss, than you have your answer.</p>
