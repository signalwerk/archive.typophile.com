    html: <p>To me, it’s not as ￼<cite>terrible</cite> as to <a href="http://www.typophile.com/node/36352?page=2" rel="nofollow">others</a>. Still, it may feel a little bit uninspired and clumsy. Alternatives? I like <a href="http://www.linotype.com/387/excelsior-family.html" rel="nofollow">Excelsior</a> a lot. Quite robust newspaper face, actually. And have a look what <a href="http://www.myfonts.com/fonts/microsoft/georgia/morelikethis.html" rel="nofollow">MyFonts</a> suggests … there are some fresh beauties among them.</p>
