    html: |-
      <p>Miller by Matthew Carter, the designer of Georgia, has created to the most lovely scotch ever!<br>
      <a href="http://www.fontbureau.com/fonts/Miller" title="http://www.fontbureau.com/fonts/Miller">http://www.fontbureau.com/fonts/Miller</a></p>
      <p>Then there is Vincent also by Matthew Carter- you have to ask Carter and Cone directly about pricing.<br>
      <a href="http://www.carterandcone.com" title="www.carterandcone.com">www.carterandcone.com</a></p>
      <p>The new Chronicle is a very honed interpretation, although in my opinion not as pretty.<br>
      <a href="http://www.typography.com/fonts/font_overview.php?productLineID=100032" title="http://www.typography.com/fonts/font_overview.php?productLineID=100032">http://www.typography.com/fonts/font_overview.php?productLineID=100032</a></p>
      <p>Lorena by Eduardo Manso will be coming out soon and it looks like it fits within the genre.<br>
      <a href="http://www.emtype.net/proceso_5.html" title="http://www.emtype.net/proceso_5.html">http://www.emtype.net/proceso_5.html</a></p>
      <p>Also Scotch FB<br>
      <a href="http://www.fontbureau.com/fonts/ScotchFB" title="http://www.fontbureau.com/fonts/ScotchFB">http://www.fontbureau.com/fonts/ScotchFB</a></p>
