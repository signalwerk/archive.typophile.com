  html: <p><a href="http://www.guardian.co.uk/artanddesign/2010/oct/17/type-letters-typefaces-simon-garfield" rel="nofollow">From easyJet to Facebook, road signs to clothing labels, we are surrounded by a world of type. But what messages do its different kinds convey? In this extract from his new book, Just My Type, Simon Garfield looks at the history of typefaces, the obsessive care taken over their design – and the role they play in shaping our lives.</a></p>
