  html: <p>I came accross your site through a google search and thought id join and post to see if anyone could help me out. I am currently doing a BA (Hons) in Graphic Design and at the moment doing a type and typography project. I have been trying to find information about Geoffrey Lee and the design of his font Impact. I haven't yet found much and would be very grateful if anyone has any info they could pass on. <br> <br>Thanx</p>
