    date_raw: 10 Dec 2004 — 1:31pm
    votes: null
    html: <p><i>What does mean the words under the sample text, e.g. 32 A, 65 a</i> <br> <br>That is the amount of characters per set of one minimum, the smallest amount of type you could buy. The foundries had a list against which you could check how many of each letters would be contained. If there were 7 l/c a, there would have been 10 or so e, 5 s, etc. For international sales, these combinations were different, as languages have different frequencies for each character. <br> <br>I must admit that I cannot remember the name of that font listing; in German it was called a <i>Gie</i></p>
    html_clean: <p><i>What does mean the words under the sample text, e.g. 32 A, 65 a</i> <br> <br>That is the amount of characters per set of one minimum, the smallest amount of type you could buy. The foundries had a list against which you could check how many of each letters would be contained. If there were 7 l/c a, there would have been 10 or so e, 5 s, etc. For international sales, these combinations were different, as languages have different frequencies for each character. <br> <br>I must admit that I cannot remember the name of that font listing; in German it was called a <i>Gie</i></p>
