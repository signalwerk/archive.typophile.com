    html: <p>Cool stuff, thanks! <br> <br>BTW, it's really nice how the hyphen can be flipped depending on if it's for lc or UC use. And the colon can be filed to become a bullet/midpoint! And the alternate "r"* and "J" are just brilliant. BTW, did you notice the slight flaring at the ends of strokes? Most notable in the "t". Lost in the digital version. :-(  Time for a full revival? Somebody should do with Geoffrey what House does with Benguiat. <br> <br>* And from now on if somebody complains about the "r" in Mana I'll tell them S&amp;B thought that shape has "warmth and character".  :-) <br> <br>hhp</p>
