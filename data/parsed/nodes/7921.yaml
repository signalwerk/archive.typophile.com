    html: <p>many thanks for your reply, mr lee. it’s great to have you here. <br><br>you mention  the need for a ‘home grown product’. but surely, even in the 60s, stephenson blake’s catalogue would have been full of british, late <span class="caps">C19</span> / early <span class="caps">C20</span> condensed grots, some of them highly condensed. <br><br>were these old grots still manufactured by then? or was there a feeling that these faces were too out-dated/irregular/inconsistant/’pre-modern’ for display/advertising, and needed updating? (perhaps, after looking at akzidenz grotesk, haas produced helvetica for the same reasons..)  <br><br>how aware, do you think, british foundries / type designers in the 60s were of recent continental sans (helvetica, univers, folio, eurostyle et al)… i would be very interested to hear your perspective on this. i suppose the context eludes me…please forgive the questions. <br><br>by the way, please feel free to post your pdf on this forum. (this can be done by clicking on ‘upload attachment’, and following the instructions). otherwise, i’d be grateful if you could cc me a copy at geraintfranklin_at_yahoo_dot_co_dot_uk <br><br><br>best regards <br><br>geraint</p>
