    html: <p>I don't have any info, but I'm curious as to why you chose "Impact." Do you have a special attatchment to the design? It isn't exactly the "favorite" of many posters here. <br> <br>Here is what little I know about the font &amp; it's design. <br>Both the Linotype and Veer website say that the design is very similar to Helvetica Inserat. <br> <br>MyFonts said that he designed another font recently, named Camden (<a href="http://www.myfonts.com/fonts/geoffreylee/camden/familytree.html" target="_blank">http://www.myfonts.com/fonts/geoffreylee/camden/familytree.html</a>), and that he is now retired. <br> <br>He used to work in advertising (also from MyFonts, <a href="http://www.myfonts.com/person/lee/geoffrey/y/" target="_blank">http://www.myfonts.com/person/lee/geoffrey/y/</a>), and Impact was released by Stephenson Blake. <br> <br>I don't know what has happend to Stephenson Blake. Did anyone buy it? (Monotype Imaging has the rights to all of the old typefaces, I think)</p>
    html_clean: <p>I don't have any info, but I'm curious as to why you chose "Impact." Do you have a special attatchment to the design? It isn't exactly the "favorite" of many posters here. <br> <br>Here is what little I know about the font &amp; it's design. <br>Both the Linotype and Veer website say that the design is very similar to Helvetica Inserat. <br> <br>MyFonts said that he designed another font recently, named Camden (<a href="http://www.myfonts.com/fonts/geoffreylee/camden/familytree.html" target="_blank" class="link-external">http://www.myfonts.com/fonts/geoffreylee/camden/familytree.html</a>), and that he is now retired. <br> <br>He used to work in advertising (also from MyFonts, <a href="http://www.myfonts.com/person/lee/geoffrey/y/" target="_blank" class="link-external">http://www.myfonts.com/person/lee/geoffrey/y/</a>), and Impact was released by Stephenson Blake. <br> <br>I don't know what has happend to Stephenson Blake. Did anyone buy it? (Monotype Imaging has the rights to all of the old typefaces, I think)</p>
