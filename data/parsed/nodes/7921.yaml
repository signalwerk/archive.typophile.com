    html: <p>Hopefully I can answer some of the points raised in this discussion and give Alison some information for her project. <br>	Q. Why design it in the ﬁrst place?  <br>A. In the days of metal typesetting many desirable designs were from foreign foundries, cost of importing was considerable, and in some cases type founts had to be planed down from European height of .928 inch to our .918 inch.and although adsetters could aﬀord to pay the much higher prices, the average British printer could not.  <br>Hence the need for a home-grown product. Eﬀorts were made to&nbsp;get </p>
