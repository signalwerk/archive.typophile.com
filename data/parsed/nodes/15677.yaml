    html: |-
      <p>Tahoma was created as a user interface font. </p>
      <p>It was designed with button text, icon labels and small passages of text in mind (error messages and dialogs) and targeted a small range of type sizes rendered bi-level (not for antialiased rendering or the not-yet invented ClearType). It was hinted to the same level as Verdana. The character set is much larger than Verdana and includes Hebrew, Thai, Arabic, extended Latin and extended Cyrillic</p>
      <p>When we first saw it being used for continuous text on web pages we did cringe but it's use is so prevalent now that I guess everyone has got used to it. Also I think the regular renders pretty well under ClearType (not true for the bold) which helps. </p>
      <p>Cheers, Si</p>
