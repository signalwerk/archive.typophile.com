    html: |-
      <p>Tahoma was first made and was suppose to be used to replace MS Sans in the UI of Windows but wasn't used because of the need to exactly match all the widths of the existing UI font. Then it was decided to use a more expanded font. So Matthew made one a bit more normally spaced and it was made for the Web and not the UI. </p>
      <p>I made the embedded bitmaps for Tahoma and then instructed Tom Rickner a bit what to do to match the widths and shape of the embedded bitmaps. </p>
      <p>Then after that I was told to make another web font so I made Trebuchet. And I was very conscience not to copy the shapes Matthew made (or such as the ascender height (added one pixel) lowercase 'l' (added the hook) the UK 'M' had to add the flares since his was straight and a different LC 'e' and 'g' and basically made different bitmaps at a very low resolution at 9..13 pixels per EM the target screen resolutions. </p>
      <p>So they are all about the same and I had a hand in the developement and hinting of Tahoma, Verdana and Trebuchet but really only get credit for Trebuchet... Oh well got paid in the end anyway.</p>
    html_clean: |-
