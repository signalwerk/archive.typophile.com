  html: |-
    <p>Does anyone use Tahoma, particularly for html text?</p>
    <p>I know it's a slender cousin of Verdana.  What I don't know is why it does not have italics, or at least obliques. I almost prefer its tighter spacing and a narrower footprint than Verdana, although it may be too tight for on-screen use.  Not sure if it translates well in the PC version either -- is it fully hinted?</p>
    <p>I was hoping anyone (sii?) could explain why Microsoft and/or Mr. Carter appear to have left it unfinished.</p>
  html_clean: |-
