  html: |-
    <p>Australian type foundry LETTERBOX is proud to announce the release of two new faces (Brunswick Black + Gordon) along with a re-release of our library. Hope you enjoy them.</p>
    <p>New Fonts<br>
    See Brunswick Black at<br>
    <a href="http://www.letterbox.net.au/brunswick-black" title="http://www.letterbox.net.au/brunswick-black">http://www.letterbox.net.au/brunswick-black</a></p>
    <p>See Gordon at<br>
    <a href="http://www.letterbox.net.au/gordon" title="http://www.letterbox.net.au/gordon">http://www.letterbox.net.au/gordon</a></p>
    <p>Revised Entire Revised Library<br>
    <a href="http://www.letterbox.net.au/section/culture/fonts" title="http://www.letterbox.net.au/section/culture/fonts">http://www.letterbox.net.au/section/culture/fonts</a></p>
