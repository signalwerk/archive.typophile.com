    html: <p>I've always had great respect for Hrant. He's always offered honest, straightforward critiques of my work, and that's exactly what I post my works in progress to receive. Hrant is one of the best things about the critiques section, and I always enjoy reading his discussions and contributions to the other boards as well. His comments are indeed provocative, which in my opinion is the best kind of discussion. <br> <br>I'm not at all sure what happened on the thread between Hrant and Gerald Giampa, but I've noticed that Hrant has been missing from the discussion and critique boards since then. I hope he returns. If not, Typophile.com will have lost a useful voice. <br> <br>David</p>
