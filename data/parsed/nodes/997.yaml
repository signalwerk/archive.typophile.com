    html: <p>I've known Hrant for a couple of years now on the various lists and met him in the real when he enrolled in one of my letterpress classes. I'd like to think we are friends. He is honest, trusting, trustworthy, generous, kind, and forgiving. And quite mild-mannered!!! He is geniunely interested in intellectual effort and a search for truth. There is no ego-centric crap going on with him. He is quite genuine. If he says it, you can take it as his word. <br> <br>Gerald</p>
