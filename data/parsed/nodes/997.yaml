    html: <p>Welcome back, Hrant. <br> <br>As an inexperienced type designer, I'd like to think <br>that I have a lot to learn from everyone on the list, <br>including Hrant H Papazian, Gerald Lange, <br>Gerald Giampa, John Hudson, Erik Spiekermann, <br>Joseph D. Treacy, Jonathan Hoefler, and others <br>far too numerous to name, whether they have <br>70 years of experience or are just starting. <br>I certainly hope more professionals with share <br>their knowledge and experience with us. <br> <br>But for anyone, experienced or not, to say "if x <br>person posts, I won't" seems to me to be a <br>shallow sort of intellectual blackmail. Far too <br>few professionals seem willing to share their <br>knowledge with those of us who are less <br>experienced. I value those who have. Hrant has. <br>John Hudson has. Others have as well. <br> <br>I'm not na</p>
