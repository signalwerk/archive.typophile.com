  - id: 7445
    user: 2094
    date: 2003-08-11T00:24:00
    date_raw: 11.Aug.2003 12.24am
    votes: null
    html: <p>Folks, <br> <br>I heard you chaps don't like my humour. Then you are really going to like this. It's not funny. <br> <br>First of all I think all of us respect and have heard of John Hudson. I am sure he too is sympathetic with your buddy, probably he too thinks I am a little pissed off and you know something. He just might be right about that. <br> <br>But if you think John Hudson and Ross Mills would be involved in type making without my encouragement you are wrong. Does that tell you anything? <br> <br>If Hrant keeps people like Erik Spiekermann, Joseph D. Treacy, Jim Rimmer,  myself and only God knows who else that does not bother to contribute because of his puerile, ego centric, insulting attacks just because they don't believe the unbelievable, you are better off without the clan member. <br> <br>One thing I can assure you all this tear jerking is just a lot of wasted  drama. Hrant does nothing but write in the Forum his two cents on virtually anything, and everything he knows nothing about.  <br> <br> <br>His work is truly boring at best and rest assured that he is thoroughly addicted to this culthood of button pushers that I predict he could never be gone for long enough. <br> <br>His Pascal "fantasy" is crap supported by a letterpress spokesman that could never have ever found gainful employment in a real print shop. His press work is good but it is done, from what I can make of it, on a press that is idiot proof by design. I hope I am wrong, a proof press. I would be much happier if it were something more. <br> <br>He should try a 32 page book forme on a 44 inch semi automatic cylinder press and see how he cuts the mustard, any bets? Believe me, it will quickly separate the men from the boys. He is an enthusiastic hobby printer at best resting on his laurels. He obviously knows nothing about Linotypes, Monotypes, or he would not spout such uninformed material in his teachings to boo hoo Hrant. He knows little to nothing of type cutting which is clearly indicated by his sitting in the bleachers of Hrants cheering section. If he believes what Hrant tells him then he too, is just passing wind. If he believe in the "Pascal Fantasy" the man is an idiot. <br> <br>I put more impressions through my hands in one month that he ever did in his entire life span. He prints mainly by polymer which does not give authentic entitlement of any expertise as a letterpress printer. I know, he has played with a little type in a California job case, maybe printed Christmas cards on a treadle hand fed platen press. Nothing wrong with that. But his preference towards  polymer leans towards what I deem to be low grade material. Or more rudely put, "buyer beware material". <br> <br>Putting it bluntly how many ems per hour can this man set? I know my money would not go on Gerald Lange in a typographical horse race. People you have never heard of outperform and know more than he. Common run of the mill letterpress printers. <br> <br>That been said I think Gerald Lange had a great opportunity. Now, after his tear jerking to comes to pass, if he ever comes to his senses, he will of wished he had been a little more diplomatic in his handling of myself in particular. I am not a nut case belonging in an institute thank you all very much. I have made a tremendous contribution to this industry and further if he considers me to be "a has been" as does his bossum buddy boo hoo Hrant, may I suggest the following, he is "a never has been". So he will never have anything to be "nostalgic about". Get my point. So before it is to late, you cry babies should welcome Jim Rimmer, Joe Treacy, and myself to speak our piece. Gerald Lange should have welcomed us. You know why he did not, he is too busy protecting his pecking order. But is about to miss, taking you with him, a rare opportunity to leap frog your knowledge far beyond what previously has been available to you. <br> <br>The opportunity is passing before your very eyes, an opportunity that will never again show its face because some of us "middle aged" "Honky" "White "Male" punchcutters are going to give up on you all. <br> <br>So do not waste your time with a phoney 60 hr letterpress expert. There is no such thing. <br> <br>I KNOW LITTLE OF THE CULTURE OF THE DELETTANTI  <br> <br></p>
