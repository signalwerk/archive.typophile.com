    <p>Hello,<br>
    I'm currently working on  website for a rock/metal music festival. I was asked to include the following logo in the title of the site.<br>
    <img src="http://i.imgur.com/3JcQWpJ.png"><br>
    Do you have any suggestions for a type that could accompany this logo? I'm hoping to achieve sort of a grungy looking site. </p>
    <p>Any help would be greatly appreciated.<br>
    Thanks in advance.<br>
     :)</p>
