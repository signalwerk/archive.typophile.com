      <p>Hey Katka,</p>
      <p>I love those kind of Metal Logos. Looking Good. But why combine this with a grungy font? Let the logo stay in focus.<br>
      You could try a more clean looking one. Like Proxima Nova or Franklin Gothic could be a very cool choice instead. </p>
      <p>Do you have a typekit account?</p>
      <p>If you really want a grungy font, try fontsquirrel, they have lots of those.</p>
      <p><a href="http://www.fontsquirrel.com/fonts/list/classification/grunge" title="http://www.fontsquirrel.com/fonts/list/classification/grunge">http://www.fontsquirrel.com/fonts/list/classification/grunge</a></p>
      <p>Copystrukt looks fine.</p>
      <p>Regards,<br>
      Florian</p>
