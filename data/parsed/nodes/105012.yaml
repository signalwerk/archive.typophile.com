      <p>Can't recognize this one and doubt actually it could a font, more a Frankenstein with letters borrowed to some classic geometric sans: /o and /v from <a class="freelinking external" href="http://www.myfonts.com/search/futura" rel="nofollow">Futura</a>, /s "à-la-<a class="freelinking external" href="http://www.myfonts.com/search/avant+garde+gothic" rel="nofollow">Avant-Garde Gothic</a>", /a as stated to Bauhaus.<br>
      Many freebies (an endless list actually) are in the same vein too. Having a look to <a class="freelinking external" href="http://www.dafont.com/theme.php?cat=303" rel="nofollow">Techno &gt; Sci-fi</a>, <a class="freelinking external" href="http://www.dafont.com/theme.php?cat=304" rel="nofollow">Techno &gt; Various</a> and <a class="freelinking external" href="http://www.dafont.com/theme.php?cat=501" rel="nofollow">Basic &gt; Sans serif</a> sections at DaFont could be helpful to spot either an alternative or a match.<br>
      Some alternatives to play with: <a class="freelinking external" href="http://www.myfonts.com/fonts/mostardesign/sofia-pro" rel="nofollow">Sofia</a>, <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fountain/dessau_pro" rel="nofollow">Dessau</a></p>
