      <p>Just curious, Paul. Did voters have to be logged in or could any visitor vote? </p>
      <p>Considering that the poll was on the Typophile site, where discussion on EULA are common, I hazard a guess that the results would have been very different if the poll was posted on a typical "Desktop Publishing" forum.</p>
