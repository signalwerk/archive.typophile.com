    html: |-
      <p>Just for the sake of sharing interesting stats, here is the current results on an ongoing poll at <a href="http://desktoppub.about.com/gi/pages/poll.htm?linkback=http://desktoppub.about.com/od/typeclassification/index.htm&amp;poll_id=4211571822&amp;poll=1&amp;submit1=Submit+Vote" target="new" rel="nofollow">About Desktop Publishing</a>:</p>
      <p><strong>Is learning / knowing typeface classifications important?</strong></p>
      <p>Yes, definitely. All designers should know this stuff.<br>
      (99 replies)  63%</p>
      <p>A few basics won't hurt, but in-depth knowledge isn't necessary &nbsp;(43 replies)  27%</p>
      <p>As long as I like the font, I don't care how it's classified &nbsp;<br>
      (13 replies)  8%</p>
      <p>Total Votes: 155</p>
      <p>-------------------<br>
      From these results it seems that most of the general design audience feel that knowing something about type classification is definitely important.  What that ultimately means, I don't know yet. You really need a series of question to be answered before you can make any of the data useful.</p>
