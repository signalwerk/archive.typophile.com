    html: <p>the polling is now closed. It looks like we got a pretty traditional bell curve on this one, how un-scientific it may have been. Interesting that 9% of those who voted didn't know what a <a href="/wiki/EULA" class="freelinking" rel="nofollow">EULA</a> is. hmmm...</p>
  - id: 95560
