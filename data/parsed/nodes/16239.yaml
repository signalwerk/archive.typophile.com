      <p>A question like this was meant to be positioned within a series of "quick" questions which seem rather radom. I would place this about third in a four question survey. You basically don't want to create a pause to ponder in the responder, therefore getting a more candid reply. Perhaps the last choice of this question should be refined slightly.</p>
      <dl>
      <dt>Do you know what a font EULA (End User License Agreement) is?</dt>
      <dd>__ no</dd>
      <dd>__ yes, but never read it</dd>
      <dd>__ yes, and ocassionally read it</dd>
      <dd>__ yes, and always read it</dd>
      <dd>__ yes, but don't comply with it. (or maybe "yes, but don't adhere to it.")</dd>

      </dl>
