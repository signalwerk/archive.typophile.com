  html: |-
    <p>Hello, moved by the curiosity for the recent Flagsmith, I was just practising by playing around with OpenType on a dingbat font and I was trying to have a symbol (called "logo") splitting in its component by adding "-div" behind the name of the logo. So, for instance, "logo-div".<br>
    Given the logo "logo" and its four components:</p>
    <p>logo.alt001<br>
    logo.alt002<br>
    logo.alt003<br>
    logo.alt004</p>
    <p>I was looking at the Flagsmith and I therefore coded in the "liga" feature:</p>
    <p> 	<code><br>
      	sub l' o g o hyphen d i v by logo.alt001;<br>
      	sub logo.alt001 o' g o hyphen d i v by logo.alt002;<br>
      	sub logo.alt001 logo.alt002 g' o hyphen d i v by logo.alt003;<br>
      	sub logo.alt001 logo.alt002 logo.alt003 o' hyphen d i v by f_glyph;<br>
      	sub logo.alt001 logo.alt002 logo.alt003 f_glyph hyphen' d i v by f_glyph;<br>
    	sub logo.alt001 logo.alt002 logo.alt003 f_glyph f_glyph d' i v by f_glyph;<br>
    	sub logo.alt001 logo.alt002 logo.alt003 f_glyph f_glyph f_glyph i' v by f_glyph;<br>
    	sub logo.alt001 logo.alt002 logo.alt003 f_glyph f_glyph f_glyph f_glyph v' by logo.alt004;<br>
    	</code></p>
    <p>and it works. But in this way I can't have</p>
    <p> 	<code><br>
    	sub l o g o by logo;<br>
    	</code></p>
    <p>anymore, in order to also have the chance to insert the entire glyph "logo".<br>
    I already tried to find a solution on my own and I can image that the reason is that the two parts are now conflicting. What could be a good way to solve it?</p>
    <p>Thank you!</p>
