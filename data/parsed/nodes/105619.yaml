    html: |-
      <div class="comment-spam-body"><p>This comes up every few weeks. The "font" is internal to the printer and does not necessarily match a font that you could use on your website.<br>
      That having been said, you might be happy with a web-font semi-bold version of <a href="http://www.myfonts.com/fonts/marksimonson/proxima-nova/<br />
      " rel="nofollow">Proxima Nova</a> by Mark Simonson, which has essentially the same letter forms and numbers. The only obvious difference is the lack of a serif at the base of 1. If you are really observant you will find that the upper tip of 6 dips slightly more an the printer font.<br>
      Don</p>
      </div>
