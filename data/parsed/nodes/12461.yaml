    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indicies" title="Create node &quot;Indicies&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indicies</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: Avenir&nbsp;Next</strong></p>
    <p>Avenir Next was designed by <a href="/node/12118" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adrian Frutiger</a> and <a href="/node/12234" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Akira Kobayashi</a>, and released by <a href="/node/12172" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype Library</a> in 2004. The type family is a complete revision of Frutiger’s <a href="/node/12462" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Avenir</a> (1988), and is part of <a href="/node/12172" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype Library</a>’s <a href="/node/15662" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Platinum Collection</a>.</p>
    <p>Adrian Frutiger designed the original <a href="/node/12462" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Avenir</a> for Linotype in 1988. It is based on an amalgamation of <a href="/node/12494" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Futura</a> and <a href="/node/13675" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erbar</a>. Frutiger had never been happy with the cold, modern appearance of Futura, so he “humanized”&nbsp;it. </p>
    <p>Avenir Next has a better distribution of weight across the family than Avenir did. The fonts also have small caps and old style figures in them. Each weight also has a condensed variant. No true <a href="/node/12463" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Italic</a> styles were made though, just <a href="/node/12475" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Oblique</a> ones. This seems in keeping with most of Frutiger’s other&nbsp;typefaces.</p>
    <p><a href="http://www.linotype.com/90672/avenirnext-family.html">Avenir Next</a><br><a href="http://www.linotype.com/72/avenir-family.html">Avenir</a>.<br><a href="http://www.myfonts.com/fonts/linotype/erbar/lightcondensed/">Erbar</a>.<br><a href="http://www.myfonts.com/fonts/neufville/futura-nd/book/">Futura</a>.</p>
