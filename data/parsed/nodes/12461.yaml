    <p><strong><a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Avenir Next</strong></p>
    <p>Avenir Next was designed by <a href="/wiki/Adrian%20Frutiger" class="freelinking" rel="nofollow">Adrian Frutiger</a> and <a href="/wiki/Akira%20Kobayashi" class="freelinking" rel="nofollow">Akira Kobayashi</a>, and released by <a href="/wiki/Linotype%20Library" class="freelinking" rel="nofollow">Linotype Library</a> in 2004. The type family is a complete revision of Frutiger's <a href="/wiki/Avenir" class="freelinking" rel="nofollow">Avenir</a> (1988), and is part of <a href="/wiki/Linotype%20Library" class="freelinking" rel="nofollow">Linotype Library</a>'s <a href="/wiki/Platinum%20Collection" class="freelinking" rel="nofollow">Platinum Collection</a>.</p>
    <p>Adrian Frutiger designed the original <a href="/wiki/Avenir" class="freelinking" rel="nofollow">Avenir</a> for Linotype in 1988. It is based on an amalgamation of <a href="/wiki/Futura" class="freelinking" rel="nofollow">Futura</a> and <a href="/wiki/Erbar" class="freelinking" rel="nofollow">Erbar</a>. Frutiger had never been happy with the cold, modern appearance of Futura, so he "humanized" it. </p>
    <p>Avenir Next has a better distribution of weight across the family than Avenir did. The fonts also have small caps and old style figures in them. Each weight also has a condensed variant. No true <a href="/wiki/italic" class="freelinking" rel="nofollow">italic</a> styles were made though, just <a href="/wiki/oblique" class="freelinking" rel="nofollow">oblique</a> ones. This seems in keeping with most of Frutiger's other typefaces.</p>
    <p><a href="http://www.linotype.com/90672/avenirnext-family.html" rel="nofollow">Avenir Next</a><br>
    <a href="http://www.linotype.com/72/avenir-family.html" rel="nofollow">Avenir</a>.<br>
    <a href="http://www.myfonts.com/fonts/linotype/erbar/lightcondensed/" rel="nofollow">Erbar</a>.<br>
    <a href="http://www.myfonts.com/fonts/neufville/futura-nd/book/" rel="nofollow">Futura</a>.</p>
