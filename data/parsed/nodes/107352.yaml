      <p>Congratulations Takashi on finding what the rest of us could not find.<br>
      I wonder if "Scotland Italian" was ever released as a typeface?<br>
      Google yields nothing.<br>
      The flash image at the website is very blurry as to who designed the font, although from what I can decipher it was designed for a magazine. The text identifies the former MAAD  students who designed the various fonts in the  “Types We Can Make,” i.e. Andrea Anner, Luke Archer, Florine Bonaventure, Jane Cheng, Yann Pablo Corminboeuf, Philippe Karrer, Haakon Spencer and Matthew Fenton. If you want to purchase the font, or the rights to it, some detective work would be required to find the designer. In the interim here is an enhanced image of the character set:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ScotlandItalian_6029.jpg"></div><br>
      Don<p></p>
