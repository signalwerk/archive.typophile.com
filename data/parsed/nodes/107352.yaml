    votes: null
    html: |-
      <p>You are correct, Johan, the point of interest is the reverse contrast, an idea that dates at least as far back as 1821 with Caslon's Italian <a href="http://typophile.com/node/103389" title="http://typophile.com/node/103389">http://typophile.com/node/103389</a><br>
      I had hoped that someone would find a digital match to the book cover but I see that I am not the only one who tried and failed to find a match.<br>
      So we can speculate as to several possibilites:<br>
      1. This is one of Herb Lubalin's alphabets, perhaps only released in poster form.<br>
      2. This was designed by an ECAL student or teacher -- as Takashi suggests. Could be artwork rather than a font as such.<br>
      To replicate it, perhaps the easiest option is to tinker with Transat to modify some of the letterforms,  then do some vertical bolding and other adjustments. Results of a quick test, that could be further modified for a closer match:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ReverseEmphasis1_3601.jpg"></div><br>
      Don<p></p>
