      <p>M-ga, I'd be glad to help. Here is a preliminary translation:</p>
      <p>잉글랜드 지역 정부사무소</p>
      <p>평등과 다양성</p>
      <p>참여하세요! 자세한 내용은 인트라넷에서 찾으실 수 있습니다.</p>
      <p>Is there an established Korean translation for 'Government Office' in the UK sense? I used '정부사무소' above - a fairly literal rendering of 'Government Office' - but google search revealed other choices such as '지역통합사무소 (Integrated Regional Office)', '정부지역사무소 (Government Regional Office)'. Maybe seeing some other translations, especially Chinese and Japanese, will help.</p>
      <p>Also, since Korean doesn't like to designate plurals, so it isn't immediately clear from the translation that there are not one but several government offices for the English Regions, but that shouldn't be a problem. I'm curious: why intranet? Does the poster target users of a specific intranet?</p>
