      <p>I think my comment was misunderstood to mean that the <em>design</em> of Arial Unicode was suited for the screen. I only had in mind the computer environment where a 'Unicode font' with broad script support would be useful, and I was talking function, not design. Apologies for the confusion.</p>
      <p>Thomas, Arial may be a poor choice for screen display, but the original Latin design is not what I'm talking about. Web pages that use Arial for Latin letters may not look expert, but will not look too unprofessional, either. It's even used by Google and other major sites.</p>
      <p>On the other hand, if a web page were to display Hangul in Arial Unicode, the result will be legible (which is better than having a series of blank squares displayed), but ugly enough to trouble all native Korean eyes, not just the design-savvy ones. I'm guessing the difference is that the original Arial font was designed by actual native readers of the Latin script.</p>
      <p>When I said Arial Unicode was great for screen uses in displaying Korean, the alternative I had in mind was the Hangul not being displayed at all. It's nice to have for the broad coverage of different scripts.</p>
      <p>I've been checking the Arial Unicode Hangul glyphs again at screen sizes, and no, it has no design merits beyond the basic function of displaying mostly legible Hangul letters. The odd, inexpert proportions are if anything magnified and further distorted at 10 points on the screen. They show up fatally deformed, oddly bouncy characters. Ugly as I find the Arial Unicode Hangul at larger sizes, I can imagine it going over the heads of Korean readers who pay little attention to design. Not so with Arial Unicode Hangul at size 10 points; everyone will complain about how unreadable the text is. Using it when there are other Korean fonts available is just perverse.</p>
