      <p>You should at least know what you're getting into with Arial Unicode.</p>
      <p>One day I saw a Powerpoint presentation in Korean, and from the get-go I couldn't get over how weird, unprofessional, and downright ugly the Hangul letterforms were. They were clearly imitating legitimate Korean sans serif designs, but looked like they were put together by people who had no idea what the proportions should be like.</p>
      <p>It took me a while to figure out that because the Powerpoint file was being run on a machine without other Hangul fonts, Arial Unicode was being used.</p>
      <p>Let me say this; Arial Unicode is great for screen uses when you're displaying snippets of text in foreign scripts. It makes you able to read those bits (as opposed to looking at a bunch of squares) without having the support of all the specialist fonts--a useful 'unicode' font, as it was designed to be. But blow up the Hangul at least (I can't speak for the other scripts) for anything approaching display size, and the result is too distractingly ugly to find any uses for it. Let me try a visual analogy:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ArialUnicodeKorean_6733.gif"></div><p></p>
      <p>All this to say, please do not use Arial Unicode for the Korean at least. Use any of the specialist Korean fonts bundled by the major companies, but not Arial Unicode.</p>
    html_clean: |-
