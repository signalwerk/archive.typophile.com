    <p>I'm designing a poster promoting Equality and Diversity in the work place. The key message is short, and I'd like to display it in 10-15 languages, including the major non-Roman scripts and alphabets.</p>
    <p>What's the best way to go about this? I'd like the type to look consistent across all the languages. And I'd rather not buy fonts if I can avoid it!</p>
    <p>Collections I have available: MacOS X and Vista bundles, Adobe CS 2 OpenType bundle, MS Office Mac bundle, Bitstream Type Odyssey 2 (TrueType), Storm design collection (TrueType), Linotype Basics I and II (TrueType), Tankard Bliss (OpenType), URW and Agfa TrueType fonts as bundled with a clip art DVD.</p>
    <p>I'd also appreciate guidance on how to locate the characters in unicode. For example, I got a handwritten Polish translation and there are "a" and "e" characters with squiggles on the end which I'm finding difficult to track down.</p>
