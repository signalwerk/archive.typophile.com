      <p>Making the type look consistent across all scripts will be difficult. The most obvious solution if one only considers the harmony of shapes is to use the most neutral monoline/sans-serif typefaces--preferably the constructed, geometric ones--for each script.</p>
      <p>However, be aware that for each script there is a different set of scribal/typographic traditions that will trigger sometimes unexpected responses in native readers. Even sans serifs for the Roman alphabet, which we may associate with the qualities of being neutral and clean, were labelled 'grotesques' when they were being introduced because they were so different from expectations of what letterforms were meant to look like.</p>
      <p>Having seen numerous posters of this genre--one that comes to mind is a library poster with the word 'read' in various languages--I can easily see how an inconsistency in tone could come about. (By the way,  the designer of the poster evidently lacked a Hangul typeface to set the Korean word for the project, so s/he used what looked like a quick and dirty vectorization of a handwritten sample of the word. It wasn't particularly effective in maintaining consistency with the words in other languages which got the full type treatment.)</p>
      <p>To counter this inconsistency in tone: either choose playful, fun typefaces (like Comic Sans! Woohoo!) for all the scripts or go for the serious, stately typefaces for all of them. A mix is just silly. Considering the content of your poster, I'd say go for the serious tone.</p>
      <p>If you choose a serif face for the Roman, maybe going for those with less contrast in the strokes will help with harmonization with scripts that don't look right with much contrast. Then again, something like the Ge'ez script might not look too serious with diminished contrast...</p>
      <p>If you're including Korean, the new Malgun Gothic that comes with Vista is a great Hangul sans serif face that prints well (when tracked tighter) though it was primarily designed for the screen. If you go the serif route, I'm not sure which Hangul serif faces you have, but the ones that come with your collections should be decent enough for the job (though they won't be my first choice picks, which are unfortunately only available through Korean foundries). Just promise not to use the atrocious Hangul glyphs in Arial Unicode.</p>
      <p>If at all possible, try to get native eyes trained in graphic design to look at your work in progress. If the nature of your work permits, use the Critique section on Typophile.</p>
      <p>As for the Polish letters with ogoneks ą and ę, the hexadecimal unicode values (with decimal values in parentheses) are:</p>
      <p>Ą 	0104 	(0260)<br>
      ą 	0105 	(0261)<br>
      Ę 	0118 	(0280)<br>
      ę 	0119 	(0281)</p>
