      <p>But it was from the description of Canada Type's Jazz Gothic that I learned that it was <em>really</em> Pinto Flare, from Dan Solo and Franklin Photolettering.</p>
      <p>I remember it from another video game - Fred. The Fred Remake is still available from <a class="freelinking external" href="http://www.fzero.co.uk/" rel="nofollow">http://www.fzero.co.uk/</a> for those who may be interested.</p>
