    <p>When I was searching for a new computer case, I came over <a href="http://www.stempel-hauser.de/Bilder/casemodding/V1010W/Window%206.jpg" rel="nofollow">this</a> and <a href="http://www.abload.de/img/bild3414a7mdu.jpg" rel="nofollow">this</a> casemod. Both ones are damn beautiful – except from the black part of the front of the white tower. The modder even lasers <a href="http://www.abload.de/img/v1010wgarage9tl7t.jpg" rel="nofollow">his logo</a> in the metal. I am probably going to buy a Lian-Li V1020B.</p>
    <p>The images were posted in <a href="http://www.overclockingstation.de/mein-tagebuch/4330-lianli-v1010-w-weiss-schwarz-mod.html#post76580" rel="nofollow">this</a> and <a href="http://www.overclockingstation.de/mein-tagebuch/9268-lianli-v1020-y-gelb-schwarz-mod.html" rel="nofollow">this</a> thread.</p>
