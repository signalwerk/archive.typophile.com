    <p>Hey Folks,</p>
    <p>Losing my edge:</p>
    <p><a href="http://www.hbo.com/biglove/video/index.html" title="http://www.hbo.com/biglove/video/index.html">http://www.hbo.com/biglove/video/index.html</a></p>
    <p>Monday Monday promo video... Typeface ID? </p>
    <p>It looks so much like Frutiger, but it isn't. "Pack up the Wives," looks almost like Futura. The "c" terminal edges are canted inward and the "a" and "e" are a strange match to the rest of the characters I think.</p>
    <p>Lost...</p>
    <p>-mike</p>
