    html: |-
      <p>eriks&gt; What you fail realize is that I recognize this user, typopo_80, is totally new here. And possibly new to the world of type in general. Often times it's not just where you go to learn. Its how-to-learn-how-to-learn. How to go about starting the learning process (in type that is).  That's why I said when someone disagrees with the frequent posts, take the criticisms in a didactic manner. The way you suggested can be better for some, but we should not be too quick to judge or place conditions on new people as they get their start. Once you start on Typophile, you don't stop, so I think the rest of what you are talking about will come naturally in the future. </p>
      <p>Also, Typo does have the FontBook but at 1700 pages plus, its understandable that someone who is inexperienced perceiving the nuances of type (Myriad vs. Bliss, Fago vs. Unit)  After pages of Handgloves and abcdefghi... it's not laziness.  So he is doing the right thing coming here. In another post Typo indicated that he attempted using some web resources but he did not understand it. Can you blame him? Type "font information" in Google. See all that 'stuff'. Its a lot to swallow. And Typo is doing the best he knows how.  Its fortunate he is Typophile member so he can learn more from the pros themselves.</p>
      <p>As far ID-er's having fun: I said this because some people questioned his motives for posting the ID's. When in reality it is his business and its not like he's running the white house. We don't need to give Typo the frownies :-( over trivial things like fonts. Insert chill-pill in mouth, chase with water.</p>
      <p>We might have extensive knowledge about whatever subject we hold dear, but we need to take into consideration the skill level and natural ability of others when sharing it. And that requires humility.</p>
      <p>Mike Diaz</p>
