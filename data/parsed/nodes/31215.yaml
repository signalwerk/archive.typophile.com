      <p>typopo_80&gt; No you are not wrong! You are fine. It is advantageous to have a comprehensive catalog of fonts for your own reference as stated. However, often times the types that inspires us are used in such a way that is unexpected. This charms us and we want to know more about the type being used. Sometimes you discover that the font you want to know about is something you have already worked with or are familiar with. Yet you didn't recognize it because it looks so far from your expectations.</p>
      <p>If you post often, I don't think you are lazy. I think you are person who loves type. So you're no problem. If someone disagrees with your frequent posts take the educational value from it but no one knows your situation like you. No one cares about your needs like you. And if you take of you, everyone else can take a long walk off a short pier- right? :-)</p>
      <p>And besides, for a great deal of the people that participate in the Typophile ID's- its a race to who has the correct answer first. Its a fun thing and many people derive pleasure from participating. I don't care how I help the other person- I just care that I help them.</p>
      <p>Regards,</p>
      <p>Mike Diaz ;-)</p>
