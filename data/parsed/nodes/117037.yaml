    html: |-
      <p>The one-button mouse made sense in 1984, because PCs ran DOS, hardly anyone had used a mouse before, so with two buttons, they would have to be told which button to click to do something.</p>
      <p>Of course, making the left button bigger than the other two would have probably worked as well.</p>
      <p>Instead, I criticized the first Mac for not having cursor keys.</p>
      <p>I did sneer at the multicolored iMac, but hey, when you are trying to revive a company that was moribund and cash-strapped at the time, doing something that's easy and will work makes sense. The Macintosh brought the GUI out into the open, and it was a good idea, since that's how everyone uses computers now. Because Apple brought the Macintosh out before the hardware was ready to provide a GUI without compromising the ability of the computer to do real work... it was first, and controlled key patents. So I can't hold the limitations of 128 K of RAM and a 68000 processor against Steve Jobs.</p>
      <p>That you couldn't open it up and upgrade to 512 K of RAM bought from Radio Shack, on the other hand, and scads of similar limitations in Apple products since then, I do hold against him. Monopoly pricing is not in the consumer's interest.</p>
