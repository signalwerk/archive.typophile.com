      <p>On mice buttons, really...? Mountains of evidence, point to one finger smart phonic touchscreen bops, as the user input of choice, and a one button mouse is the retroactive compromise to not having a touch screen. I'm not saying' nothin' else works for nobody, and I used 'em all —&nbsp;just that the mounting evidence for the choices to be on the screen and not on the device, is rather overwhelming. That this form-over-function philosophy, has in fact been there since day one, is rather normal for the Mac. </p>
      <p>Now, if touchscreen-pokers want to tickle to some product manager's fondness for a two finger interface, just for input, never mind gesturing, I'd like to see it first, and then decide. Windows, would need such a thing to disrodentize it's OS, right? How's that coming along?</p>
      <p>"But as Steve said once, "If you don't like it, don't buy it." "</p>
      <p>And privately, I'm sure he and others have known if you don't like it, and won't buy it, who cares why. And even if you don't like it and do buy it, we're no longer talking about even a week's pay.</p>
