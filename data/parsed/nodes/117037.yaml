    <p>Hello guys et gals—</p>
    <p>So Neue Helvetica is the operating system font that replaces Lucida Grande. Let’s hope the Apple Helvetica variant has glyph compatibility with Lucida Grande (similarly extended) and is properly hinted. </p>
    <p>Oh and it would be really nice if Apple made some architectural improvements to the OS type engine too.</p>
    <p>Discuss amongst yourselves, </p>
    <p>Mikey :-)</p>
