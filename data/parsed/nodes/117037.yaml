      <p>Steve Jobs certainly had his idiosyncrasies. Another one was not wanting the noise of a fan in his computers. I had an early iMac die after a few years and was told by the Apple repair guy that a circuit board had overheated, which he called a common iMac problem.</p>
      <p>But as Steve said once, "If you don't like it, don't buy it." There were always plenty of less expensive Windows computers available. </p>
      <p>But I remember how depressed I was years ago when Steve was running Pixar and Next, and an Apple employee I knew told me that Apple was probably going to go bankrupt. In spite of all the idiosyncrasies, I really like Macs.</p>
