      <p>There are some interesting quotes from this year’s WWDC:</p>
      <p><a class="freelinking external" href="http://asciiwwdc.com/2014/sessions/204" rel="nofollow">Session 204: What’s New in Cocoa</a></p>
      <blockquote><p>It’s [Helvetica Neue] been optimized for OS X with metrics similar to Lucida Grande.</p></blockquote>
      <p><a class="freelinking external" href="http://asciiwwdc.com/2014/sessions/102" rel="nofollow">Session 102: Platforms State of the Union</a></p>
      <blockquote><p>So, we hand-tweaked the metrics of the new system font so that they are very, very close to the metrics of the old Lucida Grande font, with a result that strings have almost the same size and usually fit in the space that you've allocated in your UI so far.</p></blockquote>
      <p>The most informative bit is found on <a class="freelinking external" href="http://asciiwwdc.com/2014/sessions/209" rel="nofollow">Session 209: Adapting Your App to the New UI of OS X Yosemite</a>. The segment comparing Lucida Grande and Helvetica Neue starts at 32:45. <a href="/wiki/https%3A/%252Fdeveloper.apple.com/videos/wwdc/2014/%3Fid%3D209" class="freelinking" rel="nofollow">Download the video here</a>.</p>
