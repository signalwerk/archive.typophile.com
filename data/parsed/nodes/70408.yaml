    <p>Hi All -</p>
    <p>I am headed to Reading today and it will be my first time there.  Is there anything unique or important to do or see while I am there?  I have passed through briefly before, however I did not make it far past the station.  Today will be different and I was curious to know if there is anything on offer to see in the town or around the area while I'm there.  Constructive recommendations would be delightfully welcomed.</p>
