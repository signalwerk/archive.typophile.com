    html: |-
      <p>Apart from foundry specimens, old science books are a good source, as they tend to have figures and fractions, math symbols, and often for the natural sciences, species names in small caps or italics. And superiors and footnotes. You get a strong feeling for the personality of a typeface seeing it in real use. Some foundry specimens, such as Linotype, 1923, or Bauer c.1936, have a lot of faux usage (pseudo advertisements, letterheads, etc.), which is almost as good.</p>
      <p>In general, I would say work from actual letterpress originals rather than scans. Why copy a copy? Without seeing how a design works in its intended medium, your education will be missing something.</p>
