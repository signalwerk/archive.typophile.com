  html: |-
    <p>I'm a life long typefan and newly aspiring "font maker" and I was wondering if there were any good sources for online scans of "classic" font faces like Garamond or Caslon. I'm looking to teach myself at least the "mechanics" of font making by creating some nice digitizations of the old classics for release under an Open Source license (probably the LGPL but I haven't decided yet and probably won't until I have an actual preliminary release that someone might want to use and/or help build)</p>
    <p>Ideally the samples should contain a complete set of numbers, letters and punctuation, but seeing as that's not the way they seem to have done things "back in the day", I'd be happy with links to almost anything.</p>
