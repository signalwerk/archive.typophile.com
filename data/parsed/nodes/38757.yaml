      <p>I have a facsimile copy of Caslon's specimen book. I've been fishing around to see what it's worth, and by Googling "caslon 1924" (the year of publication) I got this link <a href="http://www.addisonhall.com/caslon-1924-specimen/" title="http://www.addisonhall.com/caslon-1924-specimen/">http://www.addisonhall.com/caslon-1924-specimen/</a> , which has some useful scans from the book. Have a look at the rest of the site, well worth a visit.</p>
      <p>Not among these scans is the fold out A2 specimen sheet - a facsimile of the original 1734 poster - a quick digital of which I have attached. I can scan it if you would like - too big to post here of course.</p>
      <p>I'm not selling the book by the way, and I do wonder how much Samaritan type Caslon sold - not to mention Syriac!</p><div class="imageWrap"><img src="http://typophile.com/files/Caslon_5996.jpg"></div><p></p>
