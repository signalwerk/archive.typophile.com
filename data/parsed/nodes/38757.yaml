    html: <p>Well the archive.org copy of the ATF catalouge was a "bust", but I did find some quite high-resolution scans on the website of Ghostscript maintainer Raph Levien. He has a nice scan of ATF Garamond (normal only) and a few others up. I think I'm going to try my hand at ATF Venetian, which despite its name, actually seems to be a "Modern" style font a la Bodoni. I figure that since there's already at least one decent FOSS old-style (URW Palladio, an actual Zapf-approved version of Palatino), I might as well start where I'll be forgin new territory... Pictures, PDFs and info will be provided as things progress.</p>
