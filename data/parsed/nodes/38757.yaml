      <p>That's me, and the scans (and a few other things) are at <a href="http://levien.com/type/" rel="nofollow">levien.com/type</a>. The original 2400 dpi versions are also <a href="http://tug.org/levienfonts" rel="nofollow">online at the TUG site</a>.</p>
      <p>But there are also many, many excellent specimen books available at an affordable price. Either the 1934 or 1941 edition of the ATF specimen book is $14 or so from abebooks. Don't forget European founders either. A lot of the ATF fonts have been mined out, especially by Bitstream in the 80s. If you can visit San Francisco, the Grabhorn collection at the SF Public Library has an awesome collection of specimen books, and there are no doubt other similar collections near you (the <a href="http://wally.rit.edu/cary/" rel="nofollow">Cary</a> in Rochester, etc).</p>
      <p>Best of luck in your efforts.</p>
