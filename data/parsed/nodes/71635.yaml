    html: |-
      <p>Using several colours against a grey background will produce some problems as some of the colours will approach the background tonally, just as yellow might against a white background (the more variety in colours the more chance of this happening). I think you have done quite well, though perhaps the grey <em>is</em> just a fraction too dark. Some colours project themselves more than others and this is also an important thing to remember.</p>
      <p>For something similar in typography you might enjoy Theo Van Doesburg and Wim Crouwel.<br>
      For some more ideas about colours and how they project forward and or sit back, maybe <a href="http://upload.wikimedia.org/wikipedia/en/9/9b/Hans_Hofmann%27s_painting_%27The_Gate%27%2C_1959–60.jpg" rel="nofollow">Hans Hoffman.</a></p>
