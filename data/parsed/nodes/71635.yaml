    <p>Hey again,</p>
    <p>I am creating my personal 2010 Graphic design portfolio and I just finished my first page , wich will be quite important , as the style will be repeated partially in the whole book.</p>
    <p>Here's the first two tries:</p>
    <p><a href="http://img42.imageshack.us/i/portfolioone.png/" title="http://img42.imageshack.us/i/portfolioone.png/">http://img42.imageshack.us/i/portfolioone.png/</a></p>
    <p><a href="http://img266.imageshack.us/i/portfoliotwo.png/" title="http://img266.imageshack.us/i/portfoliotwo.png/">http://img266.imageshack.us/i/portfoliotwo.png/</a></p>
    <p>As you can see I just inserted the "portfolio 2010" text , as I want to nail this important element in the page before proceeding with the other elements.</p>
    <p>What do you think of it in general ? Is it legible? Are the colors ok?</p>
    <p>Please let me know your thoughts.</p>
    <p>Pierluigi</p>
