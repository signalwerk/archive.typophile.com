      <p>I agree with 1985. The issue is that some of the colors you are using are approaching the same value as the dark gray...specifically the purple, so visually the purple sections are disappearing. </p>
      <p>Multiple colors are OK but make sure there is a strong value contrast between the colors you are using in the type vs. the background color.</p>
