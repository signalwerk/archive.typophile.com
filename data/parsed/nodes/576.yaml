  html: <p>After TpG's event in Buenos Aires a few guys from here began to think that a foundry project is possible. So, we started a collective foundry. We called it Sudtipos (<a href="http://www.sudtipos.com.ar" target="_blank">http://www.sudtipos.com.ar</a>). We hope you like it. The catalogue includes a beautiful treasure from Mr. Koziupa, a 63-year-old lettering guy that never made a digital font before. <br></p>
  html_clean: <p>After TpG's event in Buenos Aires a few guys from here began to think that a foundry project is possible. So, we started a collective foundry. We called it Sudtipos (<a href="http://www.sudtipos.com.ar" target="_blank" class="link-external">http://www.sudtipos.com.ar</a>). We hope you like it. The catalogue includes a beautiful treasure from Mr. Koziupa, a 63-year-old lettering guy that never made a digital font before. <br></p>
