    html: <p>It feels a little overdone. IMPO I would try to simplify. Maybe get rid of the things that don't necessarily need to be there. I really like the symbol. I wish the symbol worked without the type. I would concentrate on the symbol and then apply the type as a supporting element, right now it feels like the sun needs some breathing room.</p>
