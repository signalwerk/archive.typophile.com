  - id: 41316
    user: 2172
    date: 2004-07-28T09:43:00
    date_raw: 28 Jul 2004 — 9:43am
    votes: null
    html: <p>I agree with David about it being overdone. <br> <br>It would appear that your logo <a href="http://www.solarpathfinder.com/">is already in action</a>. What I gather from their site, is that the device analyses both shade and light. This dark/light interplay could be really nice. You have it a bit in the type colors, but that feels almost coincidental. Also, the shape of the object itself (a reflective dome) could lend itself to some very sharp, clean visuals. The sun is a great idea/object to use as the central image, but the ojbect itself is more unique to this company. <br> <br>It's by no means a bad mark, but it doesn't seem <i>directly</i> related. It's a literal translation of the name, which is certainly logical at face value, but isn't directly relevant to the actual company or its product. <br> <br>Perhaps a merging of a dark field, the glass 'eye' of the device, and some solar streamers could blend the concepts together and simplify the mark. I don't think an image of a path is necessary. The device's shape and the sun's shape are the same. Don't pass up that opportunity too quickly.</p>
