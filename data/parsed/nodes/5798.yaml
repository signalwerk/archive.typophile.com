    html: <p>Hi Brian, <br> <br>what disturbs me is the lacking connection of the circle inside (which seems to be a prefabricated symbol) and the solar streamers around. If you could connect those two you might be able to compensate your overdoing. Maybe also clean up the whitespace between the streamers, they seem to be pretty randomly placed. <br> <br>If I think about it again if you would leave out the streamers you'd get a pretty clean mark. Problem, it suffers from a lack of individuality.  <br> <br>Servus <br> <br>Dominik <br> <br></p>
