    date_raw: 29 Jun 2004 — 1:49pm
    votes: null
    html: "<p>You know, I could swear I posted something on this in another thread, not that long ago. I get this question a lot. <br> <br>It's hard to separate out my own personal tastes. (For instance, I personally really don't like Futura or Helvetica and I'm tired of Gill Sans, but that doesn't mean that a skillful designer couldn't make them work with Whitman, maybe.) So don't take anything I say as gospel. <br> <br>Chris, if you're interested in a bold condensed, then I think the bolder weights of Franklin Gothic Condensed might be worth a look. I've been mostly using both Gotham and Franklin Gothic with Whitman lately. <br> <br>I think Thomas's suggestion of Metro might make an interesting pairing, given the pedigree. But you'd have to try it out. <br> <br>Ah, here's that other thread (Workhorse Serif Suggestions): <br><a href=\"http://www.typophile.com/forums/messages/4100/34037.html\" target=\"_blank\">http://www.typophile.com/forums/messages/4100/34037.html</a>. Scroll down to April 23. <br> <br>But <i>I'm</i> really curious what others think works well. <br> <br>-- K. <br></p>"
