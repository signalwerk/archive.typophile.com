    html: <p>I would not use a neo-grotesque such as Univers or Helvetica. They're from a distinctly later era and feel a little too modern to me. <br> <br>I think a range of things would work, whether Gill Sans, Futura, Metro or Franklin Gothic (just a few possibilities). Metro in particular was a Dwiggins sans serif. <br> <br>Of course, Kent Lew hangs out here, and as the designer of Whitman I'm sure he's thought about this a lot. I'll be curious to hear his take on it. <br> <br>T</p>
