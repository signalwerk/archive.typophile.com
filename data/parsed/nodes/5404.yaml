    html: <p>Thanks for your help everyone. I decided to go with Metro. It's working out pretty nicely. Unfortunately, I don't own some of the suggestions so I couldn't test everything. Franklin Gothic worked nicely...but Metro has a friendlier, less heavy feel that works better for the dry subject matter.</p>
