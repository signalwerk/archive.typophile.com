    html: <p>FF Scala Sans would be a good match -- like Whitman, it's not a revival of a specific face, but a face in a traditional "humanist" style, and the proportions are similar. <br> <br>Giacomo (from Terminal) would perhaps be better -- it has a similar roundness to its curves. </p>
