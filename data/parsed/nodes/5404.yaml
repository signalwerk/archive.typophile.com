    html: <p>You know what's eerie, Tamara? I just dropped into the Design thread to ask the <i>exact same question</i>. I don't mean to hijack your thread, so I'll just observe and contribute what I can to your design problem. <br> <br>My initial thought was to use a strong, clean geometric grotesque like Hoefler's Gotham or a modern sans like Font Bureau's Interstate, but I realized it's the all-caps settings that I'm drawn to with those faces, not necessarily the mixed settings, which is how I'll most likely need to set the heads. Those are also probably my personal preferences coming through, and they may not give the right tone to the setting for a corporate publication. However, I haven</p>
