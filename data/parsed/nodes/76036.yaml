    <p>In an earlie thread<br>
    "A (very) simple question about OpenType Stylistic Sets"<br>
    they were discussing Stylistic set matters.</p>
    <p>I know that some discussions here caused adobe amd microsoft to support some stuff.</p>
    <p>Anyhow, I uses stylistic sets for varios causes.<br>
    in some cases i need to appoint another stylistic set to cancal the effect of the previos because that when using Paragraph Style, you can't just select some words and uncheck the stylistic set, this wil cancal it for thw whole paragraph.</p>
    <p>I would like to see wrather than a static stylistic set (1-20), a dynamic one with the ability of giving it a name in the menu.</p>
    <p>Like this if a font does'nt support any stylistic sets the menu will be grayed.<br>
    if the font supports only 2 stylistic sets the menu will contain only 2 items.<br>
    and if the font supports 200 stylistic sets, the menu will contain 200 items.</p>
    <p>more so, i would like to see sub menus, like this i can group stylistic sets into toics.</p>
    <p>programing a dynamic menu is nothing for adobe, and every thing for a font developer.</p>
    <p>why limit the options?????</p>
    <p>tags should be not ss01, but s001..s999 with a value for subgrouping<br>
    &gt;&gt; Main Feature<br>
    ++&gt;&gt; Sub Feature 1<br>
    ++&gt;&gt; Sub Feature 2<br>
    ++&gt;&gt; Sub Feature 3</p>
    <p>cant this be done?????</p>
