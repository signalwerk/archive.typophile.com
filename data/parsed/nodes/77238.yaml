      <p>I like the logo, it has a understated class to it. The diamond reminds me of a cocktail napkin or coaster in a restaurant setting, which I think is good.</p>
      <p>You could research some 1920's style references for the dividing line maybe, but I like the simple straight line.</p>
      <p>The only issue I could see is restrictions when replicating at smaller sizes e.g on the web, or on a business card. The MCMXCV might become unreadable depending on the size. Is there a reason for the roman numerals being italicised?</p>
