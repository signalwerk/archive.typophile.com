    <p>So ive decided to take it upon myself to re-brand a local restaurant i thought was in need for one, so id like you all to help me out with starting by telling me whats poor and what you might like. thanks</p>
    <p>The restaurant lies in beautiful downtown Claremont Ca. Its location, which was once a printing press in the 1920's, is now home to a mid-scale restaurant sells pricey wines and entrees, also hosts music, there logo is just clip art, so i thought i might attempt to bring some elegance to there already exsistent upscale demeanor.( the roman numerals also imply printings presses origins)</p>
