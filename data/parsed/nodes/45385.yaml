    <p><strong>[Technical Post (not type related)]</strong></p>
    <p>Our office is small usually 3, sometimes 4 people. And I’m the designated IT person, even though I know zilch about it. Anyway, the office continues to plug along, connected locally via routers and ethernet cables and we had to recently buy another external harddrive. </p>
    <p>My questions to the Typophiles are:</p>
    <ol>
    <li>Do any of you have a server for your small office?</li>
    <li> What made you decide to get one?</li>
    <li>Any suggestions/warnings about taking this road?</li>
    </ol>
    <p>I’m not sure if our office even needs a server. But, the network I’ve managed to just patch together, combined with the ever-increasing need for storing/backing up files, makes me think that <em>something</em> needs to be done.</p>
    <p>I’d love to hear your experiences!</p>
    <p>Thanks</p>
