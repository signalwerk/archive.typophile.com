    html: |-
      <p>T = Text<br>
      D = Display<br>
      L = Laserwriter (former core fonts)<br>
      M = Monospaced<br>
      E = Extreme (extremely wide or tight, very small or big sizes)<br>
      P = Poster (extremely large sizes)</p>
