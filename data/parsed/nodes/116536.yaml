    html: |-
      <p>The poster versions are unusual, because the diacritics overlap the capital letters, so they fit for tight headlines. I have seen it used in newspapers sometimes. I can't really see a use for them otherwise.</p>
      <p>From experience the difference between Display and Text are not very big. The display versions are spaced and kerned tighter, the letterforms are usually the same in both cuts (except in Bauer Bodoni, as far as I know)<br>
      The others can not really be compared to optical sizes, because the letterforms are not adjusted to smaller point sizes.</p>
      <p>I would not pay to much attention to it, actually.</p>
