    html: |-
      <p>I actually found an old URW reference for which sizes apply to which designations:</p>
      <p>X000000E<br>
      Extreme: 8pt and smaller</p>
      <p>X000000T<br>
      Text: between 8 and 18pt</p>
      <p>X000000D<br>
      Display: 18pt and larger</p>
      <p>X000000P<br>
      Poster: 48pt and larger</p>
      <p>X000000M<br>
      Monospaced / Typewriter</p>
      <p>X000000L<br>
      LaserWriter / PostScript / Adobe compatible</p>
      <p>X000000I<br>
      Intellifont PCL (5) compatible</p>
