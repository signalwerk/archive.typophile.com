    html: <p>I'm going to be making some suggestions for the typography section of a company styleguide that already includes some URW "D" and "P" fonts, so I wanted get the lowdown on whether I should include instructions for them specifically. The P fonts are definitely thinner than their Text or Display counterparts, with even tighter letterspacing. D appears to be the same characters, just with tighter letterspacing, while the L versions are weird looking to my eye (which makes sense if they were merely going to be subbed out when sent to a printer with embedded fonts).</p>
