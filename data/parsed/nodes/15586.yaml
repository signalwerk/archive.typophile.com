      <p>“I am most worried about the Kepler because it doesn’t seem to be much used, for instance it is not on Linotype body text recommendation list.”</p>
      <p>Kepler has size variants specially designed for text, by Robert Slimbach of Adobe. Linotype’s list is drawn from Linotype’s library exclusively. It is also a very small and conservative selection of faces for text. Certain faces in their list are not really appropriate for extended reading. For instance Metro, Helvetica, and Bell Gothic were never intended for extended reading, and do not perform well in that setting. The list has almost no value except as a sales tool for Linotype.</p>
      <p>In the US, designers follow extremely conservative conventions for the use of text type. New designs, often better engineered for extended reading, are passed over in favor of the safe classics like Garamond and Times. Times itself was designed for letterpress and was not carefully adapted for digital imaging. It is less than comfortable to read at small sizes. </p>
      <p>As long as you are using the text versions of Kepler (or any other design), you should have no problems. An additional benefit is that your documents will have some visual distinction, as the use of newer text designs is still so rare. Please take a look at some new text typefaces; you may discover that they perform better and offer greater flexibility and range than older faces that seem more safe:</p>
      <p>Kepler<br>
      Warnock<br>
      FF Clifford<br>
      Hoefler Text<br>
      Minion<br>
      Bembo Book<br>
      Chaparral<br>
      Mercury<br>
      Freight<br>
      Miller<br>
      Poynter<br>
      Prensa<br>
      Whitman<br>
      Proforma<br>
      Absara<br>
      Maiola<br>
      Parable<br>
      Quadraat<br>
      Dolly<br>
      Merlo</p>
