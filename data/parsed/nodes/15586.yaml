      <p>I think reading this would be more pleasant if the type were 10 or 10.3 points, with a point more leading, and if you selected the “Caption” optical size. That variant probably has looser letterspacing built into it, so you would gain clarity from that. The Light weight might still be a problem; depending on the audience for your book, and on the printing technology, consider using the regular weight as well. For the ultimate test, ask a 70-year-old to read it. </p>
      <p>I don’t mean Linotype is conservative per se, but their list reflects their motive to sell their own fonts. It isn’t a good general guide, as it omits so many useful typefaces.</p>
