    <p>I am in the process of making a book about my father’s art. Some of his art has some reminiscence of renaissance while other more contemporary. Poetry and conveying of feelings are key elements. Hence my goal is to use fontfaces that share some of these characteristics. So far I have,after research both on this forum and other places,ended up with the following: </p>
    <p>Essay 8 pages:<br>
    Main heading Frutiger Lt Std (45 Light 18 pt)<br>
    Caption headings  Frutiger Lt Std (45 Light 12 pt)<br>
    Body text  Kepler Std (Light 11 pt)</p>
    <p>I am most worried about the Kepler because it doesn’t seem to be much used, for instance it is not on Linotype body text recommendation list. I want to be a little different, but still very reader friendly. Also I feel Kepler Std Regular is a bit too black and heavy, however the light version is maybe too light (especially the top of letters a, c and o almost fades away). My desktop printer is very good (Canon i9100) so that should not be a problem.</p>
    <p>Does my Frutiger/Kepler combo make sense or I am doing something very wrong here?</p>
    <p>Example page from essay: <a href="http://talemuseum.com/temp/essay.pdf">example page  (pdf)</a></p>
    <p>3 artwork examples:<br>
    <a href="http://talemuseum.com/temp/contemp.jpg">Art 1</a><br>
    <a href="http://talemuseum.com/temp/drawing.jpg">Art 2</a><br>
    <a href="http://talemuseum.com/temp/watercolor.jpg">Art 3</a></p>
