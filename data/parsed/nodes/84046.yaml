    <p>Hey all,</p>
    <p>Does anyone have any insight as to what typeface this original Kodachome logo is? If not exactly (as it might be custom) something that is close? Knockout and Nobel are pretty similar, but looking for something closer still.</p>
    <p>Thanks!</p>
