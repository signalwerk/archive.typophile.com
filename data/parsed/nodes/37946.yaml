    <p><a href="http://ir.monotypeimaging.com/secfiling.cfm?filingID=1193125-07-197168" title="http://ir.monotypeimaging.com/secfiling.cfm?filingID=1193125-07-197168">http://ir.monotypeimaging.com/secfiling.cfm?filingID=1193125-07-197168</a></p>
    <p>we read about a new "Adobe vs. Linotype" lawsuit:</p>
    <p><cite>"On October 30, 2006, Adobe Systems filed an action in the United States District Court of the Northern District of California against Linotype alleging that Linotype breached its obligations under agreements between Linotype and Adobe by failing to pay all royalties due under those agreements, submitting inaccurate royalty reports, and using the fonts licensed under those agreements improperly and without authorization. Adobe requests unspecified money damages, a declaratory judgment, costs and attorneys’ fees. On March 2, 2007, the court entered an order staying the action. The parties have moved jointly to extend the existing stay until November 15, 2007. We intend to vigorously contest the action."</cite></p>
    <p>Who has more details concerning this new lawsuit?</p>
