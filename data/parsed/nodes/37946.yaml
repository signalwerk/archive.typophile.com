    html: |-
      <p>Other hidden costs: While you don't always see this, anyone running a web store has costs that can change; they might have to migrate to a new server, they might have to completely switch their web merchant software, their server might have raised their prices, the site might have become so busy that the costs to run it are going up. It's a little simplistic to say "making fonts doesn't cost more, so the font prices should never go up". There's the matter of where the type comes from, is it licensed directly or resold? Is the OT version something that was generated automatically, or painstakingly made by a person? Is the PS version actually the same one generated in 1989, or has it been updated several times, improving overall reliability? Have the royalty arrangements changed between foundries? When you buy Minion from Adobe, there have probably been several versions of what appear to be the same exact file. </p>
      <p>I'm not sure why you think price increases like this aren't incremental. If the price actually doubled every year after not changing for a decade, that would be unexpected. From $40 to $42 isn't what I call exhorbitant.</p>
