    html: |-
      <p>Without knowing which fonts you're talking about, Mikey, I couldn't possibly do any historical pricing comparisons. Having worked for several type foundries and distributors in the past decade, I know for a fact that a number of fonts under the Monotype Imaging umbrella have been priced in the $40 range for years. Before I started working in the type business, I managed font libraries and licensed a lot of type for a variety of companies from many different distributors. I'm familiar with pricing from both sides historically speaking, otherwise I wouldn't comment.</p>
      <p>Even some typefaces that are the same design but licensed from different sources can have different pricing. It can get kind of complicated to be a typeface distributor, and I understand that it might be confusing to someone who has no knowledge of the business side of type.</p>
      <p>I see a lot of markets moving quickly in price increases. If one doesn't like the prices at one foundry/distributor, there are myriad other choices. Monotype does not dictate the pricing in the worldwide font sales market - many factors go into determining pricing. With so many type designers and foundries operating independently, I don't think you have to worry that all font prices are going to unilaterally double or triple in the near future. Since you prefer indie type, it seems like you are in good shape.</p>
