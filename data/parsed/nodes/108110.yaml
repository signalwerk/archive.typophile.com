    votes: null
    html: |-
      <p>It looks like they are "Single adjustment positioning"<br>
      <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#6.a" title="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#6.a">http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.htm...</a><br>
      So in .fea file:<br>
      <code><br>
      lookup vpalProportionalAlternateVertic {<br>
        lookupflag 0;<br>
          pos \A &lt;100 100 200 -300&gt;;<br>
      } vpalProportionalAlternateVertic;</code></p>
      <p><code>lookup paltProportionalAlternateMetric {<br>
        lookupflag 0;<br>
          pos \B &lt;-200 -300 0 0&gt;;<br>
      } paltProportionalAlternateMetric;<br>
      </code><br>
      BTW palt is Proportional Alternate Widths not Halfwidths</p>
