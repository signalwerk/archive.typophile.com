    <p>Hello,</p>
    <p>I have been asked to match a font used for an authors name on a previous set of books she has written<br>
    (to keep a consistent style). Problem is I am dealing with a new publisher who doesn't know the previous font used.</p>
    <p>Originally I had designed the cover with the font DTLElzevirTBook and it is quite similar, but not the same.<br>
    Here is a screenshot of the font I am after (in the blue).<br>
    Thanks for any help with can give ;)</p>
    <p>Thanks </p>
    <p>Jason</p>
