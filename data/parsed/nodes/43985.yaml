    date: 2008-04-07T12:43:00
    votes: null
    html: <p>Did you accidently press "Ctrl M" or "Apple M"? This shortcut places the currently selected glyph(s) on your mask. Try "Ctrl K" or "Apple K" this should automatically clear the mask of the selected glyph.</p>
  - id: 271109
    user_id: 5094
    user_name: charles ellertson
    user_path: null
    date_raw: 7 Apr 2008 — 1:06pm
    date: 2008-04-07T13:06:00
    votes: null
    html: <p>Ah, Thanks. Apparently I had hit "Ctrl M". I frequently hit spurious things, including my head on the desk, my hand on my forehead, etc. "Control + K" got rid of it.</p>
