    date: 2008-04-07T12:43:00
    date_raw: 7 Apr 2008 — 12:43pm
    votes: null
    html: <p>Did you accidently press "Ctrl M" or "Apple M"? This shortcut places the currently selected glyph(s) on your mask. Try "Ctrl K" or "Apple K" this should automatically clear the mask of the selected glyph.</p>
    html_clean: <p>Did you accidently press "Ctrl M" or "Apple M"? This shortcut places the currently selected glyph(s) on your mask. Try "Ctrl K" or "Apple K" this should automatically clear the mask of the selected glyph.</p>
  - id: 271109
