    date_raw: 7 Apr 2008 — 1:06pm
    votes: null
    html: <p>Ah, Thanks. Apparently I had hit "Ctrl M". I frequently hit spurious things, including my head on the desk, my hand on my forehead, etc. "Control + K" got rid of it.</p>
