    <p>In an effort to see what the wiki's like, I added entries for <a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a> and <a href="/wiki/schaftstiefelgrotesk" class="freelinking" rel="nofollow">schaftstiefelgrotesk</a> types, as well as filling out the entry for <a href="/wiki/blackletter" class="freelinking" rel="nofollow">blackletter</a>. I have no doubt that others are going to want to rework what I did, as I mostly concentrated on the historical aspects of blackletter I find most interesting, but I thought I'd get the ball rolling.</p>
    <p>Funnily enough, there's not yet a category in the wiki for typefaces.</p>
