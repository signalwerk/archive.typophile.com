      <p>Awesome stuff, good to see others adding stuff. I added an <a href="/wiki/Adrian%20Frutiger" class="freelinking" rel="nofollow">Adrian Frutiger</a> and <a href="/wiki/Eric%20Gill" class="freelinking" rel="nofollow">Eric Gill</a> wiki earlier, and I imagine people will want to rework mine as well.</p>
      <p>But something is better than nothing.</p>
      <p>Re: Blackletter, I have recently wanted to learn more about these types so it was cool to read. I just picked up this book <a href="http://www.amazon.ca/exec/obidos/ASIN/1568981252/qid=1115448806/sr=8-1/ref=sr_8_xs_ap_i1_xgl/701-2948080-2576335" rel="nofollow">Blackletter: Type and National Identity</a> the other day, but have not had a chance to read it yet.</p>
