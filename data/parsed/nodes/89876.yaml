      <p>I'm actually a big fan of smallish (main) capital letters.<br>
      And I don't pretend everybody needs smallcaps all the time;<br>
      for one thing I don't believe smallcaps should come included<br>
      in (most) base fonts: most people will never use them, but<br>
      they're paying for them anyway. I'd rather charge extra for<br>
      them to people who know what they're doing.</p>
      <p>There are however two important points you might be missing:<br>
      - Sometimes caps actually need help standing out. <em>Especially</em><br>
      in technical writing. This is because -unlike in something like a<br>
      novel- the reader often needs to [go back and] <em>scan</em> the text<br>
      for important words, and these words are quite often proper<br>
      nouns (ie capitalized).<br>
      - Immersive reading is not about the reader making choices,<br>
      it's about the designer accomodating the human reading<br>
      mechanism that readers don't know about, and don't need to<br>
      know about. Readers are not "confused" by caps of different<br>
      sizes - they just read. But when caps are the wrong size (they <em>do</em><br>
      need to vary depending on the contexts of density and meaning)<br>
      <em>then</em> they snap out of it, and pay for our avoidance of complexity.</p>
      <p>So: You certainly don't encumber the reader's consciousness<br>
      with rules; but you do try to follow the quite complex "rules"<br>
      of how humans actually read (without them even realizing it).<br>
      Compare this to cars: engines are very complex, because they<br>
      need to be; but simplifying the usability for the driver is of<br>
      critical importance.</p>
      <p>hhp</p>
