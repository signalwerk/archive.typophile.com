      <p>Hrant, it is about communication. A piece can be poorly written, or poorly presented (or both). It is not about eventual comprehension. I belong to another forum where some people have abandoned capitalization, punctuation and spelling. Too much texting, I suppose. I can usually figure out what they're saying, but my tendency is to put them on my "ignore" list so I don't see their posts. </p>
      <p>J. Tillman and Michael Boyer raise an interesting point. A font with a large x-height, and esp. one where full cps aren't as tall as the lower-case ascenders,  minimizes the difference between lower case and full cap letters (and full &amp; small caps). The only question is how well such fonts work with subscripts and superscripts. My initial guess is they can work just fine, but you'd have to do a bit of testing to be sure.</p>
