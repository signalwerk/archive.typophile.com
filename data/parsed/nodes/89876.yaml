    <p>I have some technical text with tons of abbreviations and initialisms. I'm trying to make them look nice, but I'm having some difficulty.</p>
    <p>There are references to "Allentown EMS," which, when EMS is set in small caps, seems inconsistent because Allentown is capitalized. The general rule I came up with to deal with this is to only put non-proper nouns in small caps.  So things like Allentown EMS are capitalized but where EMS appears by itself, it is in small caps.  If Allentown EMS is referred to as "AEMS," that too is in full-height caps because it abbreviates a proper noun.</p>
    <p>Also, I'm having a PhD-like problem. The text is peppered with kHz and MHz. I'm thinking of using the solution proposed <a href="http://typophile.com/node/33815#comment-202926" rel="nofollow">here</a>.</p>
    <p> Does this sound reasonable to people?</p>
