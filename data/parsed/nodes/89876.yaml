      <p>&gt; Just because a reader can eventually figure it out doesn't make it O.K.</p>
      <p>I can buy this.</p>
      <p>Snobbery:<br>
      In the microcosm of type design, the only thing I've seen that can<br>
      be construed as snobbery is something I can actually be accused of:<br>
      seeing text fonts as superior to display fonts; I get flack for that<br>
      sometimes, but I stand by it. Besides that the only mildly offensive<br>
      thing I've seen is better characterized as one-upmanship: "My font<br>
      has 137 more contextual alts than yours!" This is a problem Matthew<br>
      Carter once referred to: people are putting so many bells and whistles<br>
      into their fonts they don't spend the time thinking about the basics.<br>
      This might also be why people like Thomas Huot-Marchand are<br>
      complaining* that there's little real innovation in type these days.<br>
      We'll fix that this year...  :-)</p>
      <p>* See Ruxandra Duru's recent paper:<br>
      <a href="http://www.eina.edu/arxius/docs_2/Duru_Ruxandra.pdf" title="http://www.eina.edu/arxius/docs_2/Duru_Ruxandra.pdf">http://www.eina.edu/arxius/docs_2/Duru_Ruxandra.pdf</a></p>
      <p>What snobbery do you see, specifically?<br>
      I'd like to help you fight it.</p>
      <p>&gt; Times Roman was a pretty good font</p>
      <p>Metal Times with ink gain was/is indeed great. But my main<br>
      point above is that anybody who thinks it's a good idea to<br>
      use Times for everything (even within a given field) really<br>
      does not get visual communication. And by the same token we<br>
      need to not feel so constrained by what readers supposedly<br>
      mind so much that they can't handle any deviation from.</p>
      <p>hhp</p>
