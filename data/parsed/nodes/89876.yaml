      <p>Charles_e, yes I agree with your point. Standards, even if they're just de facto standards, are there for a reason.</p>
      <p>Hrant, you may have jumped the shark here. Your post may haunt you.</p>
      <p>In tech writing, capital letters are all over the place in the middle of sentences: spec acronyms, company names, company acronyms, people names, descriptive letters after names, units of measure, etc.  And how do we  keep the reader from wanting to stop at the capital letters? Answer: we use a typeface that has small capital letters. This is the simple, clear solution.<br>
