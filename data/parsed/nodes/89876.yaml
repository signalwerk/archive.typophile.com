      <p>It's not about simplification; the human brain cannot be<br>
      described as simple. It's about accepting the difference<br>
      between what people think they're looking at versus what<br>
      their brain is actually look at*, and not simply settling<br>
      for the way things have been done so far. Now, Ben might<br>
      like to play it safe in this case, but ignoring how the brain<br>
      works is never safe.</p>
      <p>* For example it's been empirically proven<br>
      that people think sizes above 12 are easier<br>
      to read while in fact there's such a thing<br>
      as text that's too large.</p>
      <p>hhp</p>
