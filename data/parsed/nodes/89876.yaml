      <p>This is a further question about the use of a font with smaller-than-usual capital letters. Hrant said:<br>
          Sometimes caps actually need help standing out. Especially<br>
          in technical writing. This is because -unlike in something like a<br>
          novel- the reader often needs to [go back and] scan the text<br>
          for important words, and these words are quite often proper<br>
          nouns (ie capitalized).</p>
      <p>And this raises the speculative question: How much would a typeface like Gentium interfere with scanning for proper nouns. There are two extreme views. 1. If the capital letters are smaller they're a lot harder to see, so of course there will be a heavy scanning hit. 2. Well, the initial capital letters may be smaller but they're still capital letters, which look different than lowercase letters, and they're higher than the lower case x-height; the reader knows what the letters look like and will still find them.</p>
      <p>Would any speculators offer a gut reaction (brain reaction) as to which way you are leaning?</p>
