      <p>Hrant, this is not a reply to any of your posts here, but I am going to quote you to define what I'm talking about.</p>
      <p>"What are we arguing about here?" Always a good question. The problem we're discussing is the one defined in the original poster's first sentence. "I have some technical text with tons of abbreviations and initialisms." In the link in that same first post Florian Hardwig said: "Recently it was my task to ‘calm down’ a text churned up by all-caps names, acronyms &amp; abbreviations." </p>
      <p>The reader's eye wants to stop when it gets to all these capital letters in the middle of the sentence. That's the problem. And in the internet age, we have all become technical writers and technical readers.</p>
      <p>"and the careful addressing of how smallcaps should be working seems to be overdue." Indeed. After reading numerous posts on small caps in technical writing, I conclude that the "rules" are very complicated. (If you are interested, check out  <a href="http://www.typophile.com/node/84025" title="http://www.typophile.com/node/84025">http://www.typophile.com/node/84025</a> where a bewildering number of options are offered, in the pdf, to be considered.) It seems that for ALL instances of capital letters in the middle of a sentence, the writer (or typesetter) should evaluate each one individually and make a decision:<br>
      -leave it as regular capital letters<br>
      -use small caps<br>
      -use small caps and lower case,as in the link in the original post<br>
      -use the bigger size small caps<br>
      -use the bigger size small caps and lower case<br>
      -try a number of typefaces and reevaluate all the options over and over<br>
      And if the typesetter goes through the book, thesis, or paper and makes a thoughtful decision for every instance of capital letters, is that a success? Do we need the 147 rules of small caps explained in the supplementary book to the Chicago Manual of Style? Or does the reader want a simple standard, that can easily be applied across multiple books in the universe, for easy-to-read technical material?</p>
      <p>Let's be kind to the reader. Let's be kind to the tech writers. Keep it simple and understandable. For technical writing, just use a typeface that has smaller-than-usual capital letters. Michel Boyer kindly demonstrated how effective it is. Forget about any small caps. (This is heresy in this forum, of course.) There are lots of fonts that meet this requirement, in addition to the ones Nina and I have suggested. Just do it.</p>
