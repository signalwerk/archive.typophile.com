  html: |-
    <p>Hello Typophile,</p>
    <p>I trust that, by now, many of you have already seen or read about the release of Elementar by Typotheque:</p>
    <p><img src="http://im.typotheque.com/blog/Elementar_225.png"></p>
    <p><a href="http://typotheque.com/blog/elementar" title="http://typotheque.com/blog/elementar">http://typotheque.com/blog/elementar</a><br>
    <a href="http://typotheque.com/blog/elementar_app" title="http://typotheque.com/blog/elementar_app">http://typotheque.com/blog/elementar_app</a></p>
    <p>I have been working on Elementar for a long time, and Typophile was an important source of information for me in the beginning of the project.</p>
    <p>So, to announce the release, thank Typophile &amp; close the cycle, here is a transcript of a “live critique” chat session from around October/November 2002:</p>
    <p><a href="http://hipertipo.org/stuff/typophile-live-critique.html" title="http://hipertipo.org/stuff/typophile-live-critique.html">http://hipertipo.org/stuff/typophile-live-critique.html</a></p>
    <p>I am more excited than ever about this project and its future developments, and very curious to see what people will build with it. </p>
    <p>The work continues...</p>
    <p>Greetings from Amsterdam,<br>
    Gustavo.</p>
