    <p>Hey everyone,</p>
    <p>I am designing a logo for Prestige Promotions and Limo Hire. They are wanting the brand to be stylish and classy. I am looking for a font that would capture this idea, and was hoping to get some suggestions, the client has a small budget so I wont be able to spend big mony on fonts.</p>
    <p>Below is some added info of the services the company offers</p>
    <p>So basically the business offers 3 services:</p>
    <p>1: Promotional services - The best promotional models available to promote maximum impact for any event.<br>
    2: Luxury Vehicle Hire - Top of the range vehicles to transport you in true star style to any event.<br>
    3. Party Vehicle Hire - The most beautiful models available to host you and your party in our luxury vehicles and accompany you on your special occasion.</p>
    <p>Thanks heaps!!</p>
