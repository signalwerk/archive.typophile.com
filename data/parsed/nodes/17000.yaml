  - id: 101955
    user: 2088
    date: null
    date_raw: null
    votes: null
    html: |-
      <p>I am not so sure that this even started out as DIN, although I admit it would be a pretty good way to fudge it, if you just wanted a resemblance. I looked at ITC Conduit, based on Yves' principle about DIN 'not-quites', but it is even less like the sample.  </p>
      <p>You also realize that the 'a' and 'e' are the same letter flipped over. The counters are not the same in DIN. The tail of the 't' is different, and so on. </p>
      <p>I believe this is a 'mutilated' font, but I can't believe that DIN was where it began. I will keep looking for a bit, to see if something else seems close, but there is also the possibility of a mixed-font origin, put together like Frankenstein's monster from various parts.</p>
      <p>- Mike Yanega</p>
