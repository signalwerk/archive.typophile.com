      <p>I think the length of exclusivity depends very much on the type of organisation you are doing the work for. Some, say publishers, may need only 2 years. Others, like global corporate entities may need much longer ones as implementation throughout the organisation alone can take a year or two. That, and given the fact that a rebrand is unlikely within 8 to 10 years means that they need longer exclusivity.<br>
      Accordingly, you set your pricing.</p>
      <p>For most corporates, the lure of a custom font is not about design (although it is part of the idea) but that it has logistic advantages. They are able to distribute these fonts from their brand site to all their suppliers without having to worry about extra licensing. This is probably one of the major factors why companies go for it. Ease of use!</p>
      <p>Bruno Maag<br>
      Dalton Maag Ltd</p>
