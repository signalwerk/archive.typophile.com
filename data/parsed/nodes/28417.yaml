    <p>Hi all,</p>
    <p>When a company (be it a design bureau or any type of corporation) pays for a custom design, what are the type of licenses available in most cases?</p>
    <p>For instance, I'm aware of:<br>
    _ exclusive usage forever<br>
    _ exclusive for X years<br>
    _ ...</p>
    <p>Can anyone help me on this issue?</p>
    <p>Thx!</p>
