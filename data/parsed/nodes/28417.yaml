      <p>Do you mean a totally non-exclusive license, such that the designer can immediately start selling the font via retail or even sell it as a custom font to another party? That seems like it would be rare - except maybe if the font's main purpose is to solve a particular technical issue, like maybe rendering on a certain low-res device.</p>
      <p>I suspect that in the case of a serious brand the client will want perpetual exclusivity, and probably even outright ownership: they would pay to have a font made for them, and then the designer is out of the picture... unless they need more Unicode coverage or better hinting or...  :-) In fact one thing the designer could do in such cases is stipulate that any future modification/extension has to be done by him (although it's hard to imagine an astute client accepting such a clause).</p>
      <p>hhp</p>
