      <p>The type of license varies with each commission. It depends on the clients needs, and their budget. Custom work that is non-exclusive is priced lower than exclusive work. 2 to 3 year exclusive work is less costly they longer periods. Some clients prefer to pay a yearly fee to maintain their exclusivity.</p>
      <p>As to price, discussing price in a forum such as this can bring the participants into some legal hot water, Price fixing, that sort of thing.</p>
      <p>If you want to get an idea on how much these things cost, why not begin by pricing enterprise licensing from various foundries. How much do they charge per font for a worldwide license? We all have those prices. Then, if you are going to spend that much money for a worldwide license for a font that already exists, and is in use by many, how much is a custom design going to be worth? At least as much as the enterprise solution, no? Most likely a little more.</p>
      <p>James</p>
