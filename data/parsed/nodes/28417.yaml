      <p>My impression is that the most common scheme is exclusivity for 2-3 years. And the reason I think this seems to make sense is that the novelty of a new magazine or newspaper design or re-design is what counts most, and after that time the novelty is deemed to have expired. But of course not every custom job is tied to fashion, and in some cases perpetual exclusivity can make more sense.</p>
      <p>Another thing to consider is redistribution rights: the client of a custom font can purchase the rights to merely use it (and even only within a certain sphere, let's say its US operations) or it can purchase the rights to give it away or sell it.</p>
      <p>hhp</p>
