      <p><cite>because in this type of book, I like to do loose leading.</cite></p>
      <p>Why? because it is all the rage? Spatial relationships all have to work together. That includes intercharacter space, word space, line space, and very important, margins.</p>
      <p>Watched <cite>Bernard and Doris</cite> on HBO the other night, and went &amp; dug out Durden's <cite>The Dukes of Durham</cite>, published in 1975. That book was set Linotype metal. At first, you do notice the old technology a bit, but then you don't &amp; can enjoy the book. A rather timeless design.</p>
      <p>Contrast that to <cite>A Legacy of Ashes: The History of the CIA</cite>, by Tim Weiner. A Pulitzer-Prize winning book. No bottom margin. Top margin too great. Space between running head &amp; text too great. It bothers the hell out of me on every page.</p>
      <p>While I do think it is true that all books reflect the time of their manufacturing, designs that don't try to tart things up too much, that don't slavishly follow the current fashion, fare rather better over time. Not just my opinion, it is also what the likes of Ron Costley &amp; Rich Hendel advise.</p>
