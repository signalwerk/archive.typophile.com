      <p>Try the settings in the justification dialogue box. Another thing is that you HAVE to turn on hyphenation – and use it – if you are ever going to achieve a harmonious page colour and line rhythm.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/justification_4948.png"></div><p></p>
      <p>The word spacing is pretty self explanatory. In the letter spacing section you should only allow a very small value to be added, and the same goes for glyph scaling, as that really can get ugly. Look carefully, adjust with the preview on, print and re-adjust until it's perfect... The rest of the fitting is then good old hand work. Be aware that if you are using the paragraph composer as opposed to the single line composer, you can get in trouble with preceding lines when you make changes by hand.</p>
