    html: |-
      <p>First of all, I don't agree that those lines are too tight. They are not ideal, but that's a different issue.</p>
      <p>The points above on adjusting the space settings are correct -- I've gone into fonts an changed the wordspace value, and it has the same effect as changing the min-ideal-max settings. So, you are left with finding the values you want, and accepting all the compromises.</p>
      <p>Things to think about-- You can get the effect of looser wordspacing with the same values by decreasing the leading. Space is as much relational as absolute. One of the reasons designers went to greater leading was to get the appearance of tighter wordspacing.</p>
      <p>A second option is to slightly increase the space values, and increase the measure. I use different minimum values depending on the measure. If we're setting short measures -- say 18 picas in a double-column text, I'll go way down on the minimum. If it is a longer measure, raise it. Why? Because it is all a compromise. The best way to get text to fit as you want it is to rewrite the text. Usually not an option. But wordpace values, hyphenation, line length, etc. are all compromises you have to make.</p>
      <p>For example, consider the compromises Dowding was willing to make in <cite>Finer points</cite>, in the Wace edition which showed what he really wanted. There are a few lines where there are no word spaces at all, only hair spaces -- his preference in compromise in order to avoid a "loose" line. There are places too, where the natural space between a parenleft and the following letter are greater than the wordspace [eg. "(a"] he uses in the line. Again, a compromise he wanted to make. And I think he was wrong -- not so much in his words per se., as in the compromises he showed he was willing to make.</p>
      <p>Long, long ago, I tried a test. I set a journal article two ways, once with tighter wordspace values, once with looser spacing. Not much, jut a touch. Sent the samples to the publisher. All (yes, all) the designers preferred the tighter setting. All (yes, all) the editors preferred the looser setting.</p>
      <p>As a compositor, you have to get a sense of these things, and consider your several obligations -- e.g., who hired you (usually a designer) versus who's reading the text.</p>
      <p>FWIW</p>
