      <p>Like Charles, I don't feel that the circled line is necessarily too tight. I think the effect is exacerbated by the lines directly above and below it, and by the fifth line, which is looser than I like.</p>
      <p>If you feel that the native value of the word space in Freight is too narrow and is contributing to lines that are too tight, then just messing with the Minimum value won't necessarily yield the results I think you're looking for, because I think the Min/Max values only really affect the outer limits.</p>
      <p>I recommend this approach: </p>
      <p>First, set some sample paragraphs unjustified, flush left/rag right. See how the word spaces feel in this setting. If they are indeed too tight, then adjust the value for Desired word spacing in the Justification dialog until it is more comfortable for you.</p>
      <p>Then adapt your Minimum and Maximum based around this Desired value. Switch to justified setting and fine-tune the Min/Max to taste.</p>
      <p>You might also consider adjusting the slider at the bottom of the Hyphenation settings to allow more hyphens for better spacing. It's hard to tell from just one sample, but it looks to me like allowing a little bit more hyphenation might even things out a bit more.</p>
      <p>-- Kent.</p>
