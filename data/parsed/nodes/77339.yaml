    html: |-
      <p>Mr. Shinn,</p>
      <p>I think I have the same problem as this guy.</p>
      <p>Can you point me to some instructions on how to insert the "subtable;" in the code and where to put it?</p>
      <p>I have a lot of kern pairs in my font (4,262 so far. A lot I know). My font is an opentype-flavored opentype font. Do you think that when it compiles my kerning, it's throwing some of it out, and if I insert enough of those "subtable;" things in the code in the right places, can I cram all of my kerning in there without any of it getting tossed out?</p>
