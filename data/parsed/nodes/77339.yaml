    html: |-
      <p>I say "the kerning on the right side <em>of</em> the A" and I guess you prefer to say "the kerning when the A is on the left side"... same thing.</p>
      <p>Anyway, I don't know how much to trust the features preview in FontLab now. I've tested the font in OpenOffice and it works on both sides, but only the class masters kern. So I guess I ought to take W out of V's kerning class. I don't know how it looks in InDesign yet, because $700 is a lot of money. I am starting to resent OpenType.</p>
  - id: 444708
    user_id: 2462
    user_name: cerulean
    user_path: null
    user_image: /files/pictures/picture-2462.png
    date_raw: 22 Dec 2010 — 11:55am
    date: 2010-12-22T11:55:00
    votes: null
    html: <p>Thank you, Nick, that seems to be doing it. I'm afraid I wouldn't have thought of that, since the one "subtable;" that was already there was right before the AV pair, making it suspicious enough that all I thought to try was to take it out!</p>
