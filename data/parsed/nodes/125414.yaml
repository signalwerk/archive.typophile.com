  html: |-
    <p>I'm rebuilding a logotype that uses this sans serif that looks a lot like futura but differs in some subtle ways:</p>
    <p>* The lower case s upper and lower hooks flow in a more symmetric way and is a bit narrower.<br>
    * The lower case acute accent on the letter i is different in shape with horizontal top and bottom terminations.<br>
    * Round letters are a little bit wider.<br>
    * The counter of the lower case a and p push very deep into the stem.</p>
    <p>I have Linotype's, Adobe's and Bitstream's and they don't look like this. I also googled Futura ND and it doesn't match either.</p>
    <p>Thanks in advance!</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/font-id/Screen%20Shot%202017-01-26%20at%205.11.05%20PM.png" width="784" height="169" alt="Futura like sans serif" title="Futura like sans serif">
