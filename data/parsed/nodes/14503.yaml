    <p>Kia ora folks. I scanned a speciman of what I believe is Polyphilus. I got it from "the Typographic Book" by Stanley Morrison if I remeber correctly. It struck me as having a very nice feel to it, a combination of irregularity and odd character shapes. I know this is a third generation image, but that doesn't worry me. The image I saw in the book was really beautiful. To help understand why it felt so nice as a typeface, I did a quick digitisation by eye (called polyfiller in the pdf) and some print-outs to get the feel. I then drafted a new version (called elegantia, after a pretty word in the speciman copy) based on my observations. </p>
    <p>In elegantia there is a heavy baseline emphasis. The upper serifs have been blunted / triangulated.  I also noticed a subtle right-hand lilt to the original, and have incorporated this subtlety into the serif and stroke treatment. It is only an unhinted draft at this stage. What does it do to your eyeballs? </p>
    <p>Kris.</p>
