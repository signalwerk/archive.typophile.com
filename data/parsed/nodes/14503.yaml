      <p>As Sergei says, this has been digitized by Monotype, who I'm sure have the rights. It was also something of a failed experiment of getting the look of 16th century ink spread into a 20th Century type. The simulated antique look I think has limited appeal. </p>
      <p>The smooth redrawing of Poliphilus as Bembo was wonderful and deservedly successful in metal. The digitization of Bembo was not successful, and Bembo Book has recently been drawn to try to achieve that. But my impression is that it hasn't captured the magic of the metal. Aetna is a version of the original Griffo type that some people have spoken highly of. </p>
      <p>I think that as it stands your digital version, like the Monotype original and digital versions, is uneasily positioned between being a faithful reproduction of an antique--like Founders Caslon--and a modern redrawing, such as Adobe Garamond.</p>
