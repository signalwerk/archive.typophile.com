      <p>I was sure that the image is from a reproduction of the Hypnerotomachia Poliphil, but stand corrected! I am aware of the roots of Polyphilus and Bembo (doesn't Bembo look absolutely fabulous in Edward Tufute's books!). I haven't seen Jack's version of Aetna in print, but heard a lot about it. It is a little uneasy, I agree. It is almost an informal experimant more than anything. I have no real interest in creating a faithful reproduction, I find most simulations a tad contrived. It is the feel and quirkiness that I want! Ahh, contradictions.</p>
      <p>Thanks for your feedback chaps, it is appreciated.</p>
