      <p>Kris, your original specimen is Monotype Poliphilus, not the original Griffo's font used in Hypnerotomachia Poliphili, 1499. Monotype Poliphilus is an experimental replica cut in 1923 under direction of F.H. Pierpont, later digitized and currently sold as Poliphilus MT.<br>
      I think your idea of reinterpreting ink squash (two layers of it!) as intentional features might bring some interesting results. The first verion of Elegantia is encouraging, but I see a conflict between chiseled features of u, z, and unexpectedly slick e and g. Also, your o has an unusual axis not supported by other letters.</p>
