  html: <p>I just have a general question about those of you using FontLab. Do you think its okay to let FontLab add points to your glyphs? Does that help when hinting the font, or is there a general rule that the least amount of points possible in a glyph is the way to go? Are fonts with the least amount of points considered better drawn?</p>
  html_clean: <p>I just have a general question about those of you using FontLab. Do you think its okay to let FontLab add points to your glyphs? Does that help when hinting the font, or is there a general rule that the least amount of points possible in a glyph is the way to go? Are fonts with the least amount of points considered better drawn?</p>
