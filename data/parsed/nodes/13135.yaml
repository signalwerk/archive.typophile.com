    html: |-
      <p>For me its not okay to let anyone add points to my outline! But for most of the automated, traced, trashed stuff around, the automated optimize will help to fight the beast.</p>
      <p>In general a glyph with a fewer amount of points is mostly better than the "same" outline with more points. Type1 Hinting needs points on extremes to be "assigned". Please study well designed &amp; technical well developed types like Myriad Pro. Its shipped with the free Adobe Reader. Look &amp; See!</p>
      <p>In some cases a rough calligraphic touch is needed. In this situation you have to break some rules.</p>
      <p>For dingbats and ornament fonts you should hardly try to stay below 1000 points per gylph. Its not a technical limit, but a speed and screen rendering quality issue.</p>
      <p>--<a href="http://www.astype.de" target="_blank">astype.de</a>--</p>
