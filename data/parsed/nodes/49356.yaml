    <p>hi, i will love to receive some help, naming a complex of 20 luxurious apartments in mexico..</p>
    <p>i'm looking for something original, and in spanish if possible...</p>
    <p>they have a view and are located very near mountains<br>
    and also near important avenues, schools and shopping centers<br>
    each apartment is 250m2<br>
    its target audience is newly weds and young families (25-50 years)<br>
    3 bedrooms and 3.5 bathrooms<br>
    includes green areas, social events area, gym, swimming pool, etc</p>
    <p>thanks in advance!</p>
