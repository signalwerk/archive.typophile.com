      <p>there's quite a bit of pertinent information you aren't sharing ... location, location, location of course. Photos of the area, maps, competitor's names, photos of the apartments, their interiors, background on the company developing the project, the architect, the climate, etc.</p>
      <p>that said, I find it odd that there's an Name This Apartment Complex in Mexico thread at Typophile.<br>
      And I wonder whether you have attempted to do this work yourself. Are you getting paid for this work?</p>
      <p>not trying to be harsh, really, I'm just curious. :D</p>
      <p>here are some starting points:</p>
      <p><a href="http://www.amazon.com/Wordcraft-Turning-Little-Words-Business/dp/1400051045" rel="nofollow">Wordcraft: Get this book and read it cover to cover</a></p>
      <p><a href="http://blog.guykawasaki.com/2006/02/the_name_game.html" rel="nofollow">Kawasaki on Naming</a></p>
      <p><a href="http://www.agency26.com/The_Brand_Gap.pdf" rel="nofollow">Brand Gap pdf primer</a></p>
      <p><a href="http://www.namedevelopment.com/linguistics.html" rel="nofollow">Name Development Basics</a></p>
      <p><a href="http://sethgodin.typepad.com/seths_blog/2005/10/the_new_rules_o.html" rel="nofollow">Seth Godin</a></p>
      <p><a href="http://www.wordlab.com/" rel="nofollow">WordLab</a></p>
