    html: |-
      <p>Sorry, don't know the font (if it is) for the DCP lettering.<br>
      Some possibilities for customization: <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-magda/" rel="nofollow">Magda Clean Black</a> with 4 cuts, <a class="freelinking external" href="http://www.myfonts.com/fonts/volcano/gringo-sans/" rel="nofollow">Gringo Sans Wide Bold</a> (same work as Magda), <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/qtype-pro/" rel="nofollow">Qtype</a> (recreating /d and /p from /o), <a class="freelinking external" href="http://www.myfonts.com/fonts/dsgnhaus/saturn/" rel="nofollow">Saturn</a> (more tweaking needed), <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/trak/" rel="nofollow">Trak</a> (everything starting from /o), <a class="freelinking external" href="http://www.myfonts.com/fonts/talbot/kursk-105/" rel="nofollow">Kursk</a> (same work as Trak)</p>
