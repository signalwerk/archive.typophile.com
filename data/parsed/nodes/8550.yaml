    html: "<p>Angel, <br> <br>I'm digging it. This is sort of a minimalist take <br>on the \"Computer\" or \"MICR\" types. See:  <br><a href=\"http://www.myfonts.com/FontFamily146.html\" target=\"_top\">http://www.myfonts.com/FontFamily146.html</a> <br><a href=\"http://www.myfonts.com/FontFamily693.html\" target=\"_top\">http://www.myfonts.com/FontFamily693.html</a> <br><a href=\"http://www.fontfont.de/packages/locali10461/locali10461.html\" target=\"_top\">http://www.fontfont.de/packages/locali10461/locali10461.html</a> <br> <br>Here are some that take your same route: <br> <br>Ditto on the numerals. See the 'P' and 'R' for  <br>Hrant's meaning.</p>"
