    date_raw: 21 Dec 2001 — 4:30am
    votes: null
    html: "<p> Thank you everyone for your comments. It's been really helpful and nice to see that other people like Quka. It gives me encouragment to work even harder on this face! <br> <br>Hrant: I note down your suggestions. I will give them a try. I was already doubting the UC Q. I have to do something with it. <br> <br>Stephen: Thank you for the links. It is always helpful to study other similar faces and see how the designer has solved the problems. <br> <br>David: Yes, i know, the tilde is not actually a tilde. But i couldn't find a good way to do it. I wouldn't really like to do a traditional curved tilde, but maybe i will have to. <br> <br>I am going to catch a flight to England today, and I will be \"offline\" in lovely Oxford until 2nd January. So Merry Christmas and enjoy yourselves! </p>"
    html_clean: "<p> Thank you everyone for your comments. It's been really helpful and nice to see that other people like Quka. It gives me encouragment to work even harder on this face! <br> <br>Hrant: I note down your suggestions. I will give them a try. I was already doubting the UC Q. I have to do something with it. <br> <br>Stephen: Thank you for the links. It is always helpful to study other similar faces and see how the designer has solved the problems. <br> <br>David: Yes, i know, the tilde is not actually a tilde. But i couldn't find a good way to do it. I wouldn't really like to do a traditional curved tilde, but maybe i will have to. <br> <br>I am going to catch a flight to England today, and I will be \"offline\" in lovely Oxford until 2nd January. So Merry Christmas and enjoy yourselves! </p>"
