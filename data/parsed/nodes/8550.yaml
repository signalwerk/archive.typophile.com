    html: "<p> This is pretty cool! <br>Your lc \"a\" is a form I've actually been thinking about myself: it reduces its minimum vertical space from 5 to 4 units. <br> <br>Some suggestions: <br>1. Try giving the UC \"J\" an upward curl on the left. <br>2. Make the UC \"Q\" more of a \"Q\". <br>3. Make the \"heads\" of the numerals 4 and 9 bigger. <br> <br>I'd love to see this font succeed! <br> <br>hhp </p>"
    html_clean: "<p> This is pretty cool! <br>Your lc \"a\" is a form I've actually been thinking about myself: it reduces its minimum vertical space from 5 to 4 units. <br> <br>Some suggestions: <br>1. Try giving the UC \"J\" an upward curl on the left. <br>2. Make the UC \"Q\" more of a \"Q\". <br>3. Make the \"heads\" of the numerals 4 and 9 bigger. <br> <br>I'd love to see this font succeed! <br> <br>hhp </p>"
