    html: <p> I agree with Hrant and Stephen, especially on the uc "Q". In the word "Quka," the "Q" reads more like a "C". I suspect this would happen in other settings as well. <br> <br>Also, your tilde (~) over the "N" and "n" could easily be confused with a macron (¯). While context would help distinguish the two, and the macron would probably be rarer in use, I still think the tilde needs the swooping curl to distinguish it. <br> <br>Otherwise, I like the forms you've developed. The "@" is great. Also, the distiguishing touches you worked into several of the similar-looking characters (such as "B", "P", "K", "R" and "X"; also "k" and "x") seem to be working effectively. <br> <br>Also, as with Hrant, I like the lc "a" a lot. <br> <br>I, too, would like to see this one succeed. I can already think of some uses for it. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>Good luck! <br> <br>David </p>
