    <p>Are there any good, in-print books on non-calligraphic lettering? I have no trouble finding books about formal calligraphy, but when I look for books on hand lettering what I find are books about arts-and-crafts projects. Is this the sort of thing that I just have to look for on eBay?</p>
    <p>Edit: I already have all of Leslie Cabarga’s pertinent work.</p>
