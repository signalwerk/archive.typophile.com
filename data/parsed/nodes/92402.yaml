  html: |-
    <p>The details are vague, but Typekit is a part of the Adobe Creative Cloud:</p>
    <p>"Add real fonts to your website<br>
    Simplify the process of adding expressive typefaces to your website. Just choose the fonts you need from the Adobe Typekit® collection, without having to worry about browser compatibility or licensing details."</p>
    <p><a href="http://www.adobe.com/products/creativecloud/publish-anywhere.html" title="http://www.adobe.com/products/creativecloud/publish-anywhere.html">http://www.adobe.com/products/creativecloud/publish-anywhere.html</a></p>
    <p>I wonder if the monthly Creative Cloud fee will include access to any of Typekit's paid plans.</p>
