    <p>I need oppinions if it’s a good choice of style, since I want to go a little <em>vintage</em> on his one.</p>
    <p>The play is about hippies and all that crap. I have the concept for the poster already, I just need to execute the idea, and this is the one thing that I’m not sure about. The poster is inspired by blotter art, and will essentially <strong>be</strong> a sheet of blotter with this logotype underneath the blotter (I am planning to take out the pieces of the actuall blotter so you can see the logotype, like a puzzle).</p>
    <p>Oh, and the play is called “The Grateful Alive”, yeah as in “The Grateful Dead”. :)<br>
    I need (with your help I hope) yet to figure out the placement for the “The” and the “Alive”. I’m thinking: “The”—top left, “Alive”—bottom right. But I’m not sure about the style.</p>
    <p>Any help appreciated.</p>
    <p>Edit: Aaargh, stupid SmartyPants ...</p>
