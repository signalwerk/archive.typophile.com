    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Colin Kahn</strong></p>
    <p>Colin Kahn is a design graduate of both <a href="/wiki/Villa_Maria_College" class="freelinking" rel="nofollow">Villa Maria College</a> (AAS) and <a href="/wiki/Daemen_College" class="freelinking" rel="nofollow">Daemen College</a> (BFA) (Buffalo NY). After a brief job as a web designer he was hired by <a href="/wiki/P22" class="freelinking" rel="nofollow">P22 Type Foundry</a> in May 2004.</p>
    <p>Type designs by Colin Kahn: </p>
