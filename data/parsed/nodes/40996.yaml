      <p>Well, who’s it targeting? Aside from colors (which are feminine), I’m getting a very male vibe with the pointy figures and the mudflap girl. I typically would group adult stores into two slightly different demographics: 1) women/married couples and 2) Long Haul Truck Drivers. </p>
      <p>This seems to fit the latter OK, but not the former. If you’re aiming for the former, I’d think a bit softer, maybe even a bit more abstract.</p>
