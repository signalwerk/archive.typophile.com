      <p>It's tough to find something that heavy, but you could start with <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=E.105369.2.4&amp;attributes.sampleSize=48&amp;sampleText=LOVE+HEARTS&amp;sampleSize=48" rel="nofollow">Brothers</a>, <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=ITC.108257.0.9&amp;attributes.sampleSize=48&amp;sampleText=LOVE+HEARTS&amp;sampleSize=45" rel="nofollow">Elan</a>, <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LH.120832.0.9&amp;attributes.sampleSize=48&amp;sampleText=LOVE+HEARTS&amp;sampleSize=42" rel="nofollow">Copperplate</a>, or <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FF.10464.2.9&amp;attributes.sampleSize=48&amp;sampleText=LOVE+HEARTS&amp;sampleSize=46" rel="nofollow">Matinee Gothic</a>.</p>
      <p>Whatever you choose, make sure you are properly licensed to modify it and create a new font.</p>
