    <p>Check out my last realise:</p>
    <p>WOOD_TYPE_COLLECTION:</p>
    <p>Introducing The Wood Type Collection from Mateusz Machalski Borutta. This is a wonderful, warm and weathered hand made set of typefaces designed by Mateusz Machalski. Inspiration for this collection comes from wooden letterpress blocks and other old technologies used for traditional printing techniques. The Wood Type Collection supports 40 different languages and contains over 6,000 glyphs. The family consists of 7 typefaces in 14 different styles, comprising of both regular and italic variations.</p>
    <p><a href="http://www.behance.net/gallery/WOOD_TYPE_COLLECTION/6040197" title="http://www.behance.net/gallery/WOOD_TYPE_COLLECTION/6040197">http://www.behance.net/gallery/WOOD_TYPE_COLLECTION/6040197</a></p>
    <p>you can buy it on:</p>
    <p>http://www.hypefortype.com/wood-type-collection.html</p><div class="imageWrap"><img src="http://typophile.com/files/WTC7_3865.png"></div><p></p>
