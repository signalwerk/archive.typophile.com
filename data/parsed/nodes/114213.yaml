    html: |-
      <p>With more hunting I found <a class="freelinking external" href="http://www.myfonts.com/fonts/latinotype/trend/?refby=bowfin" rel="nofollow">Trend Slab Five</a> from Latinotype. Seems pretty close if you invert the colors. </p>
      <p>Also consider using outline added to a slab style to create a faux inline look. House's <a class="freelinking external" href="http://www.houseind.com/fonts/neutrafaceslab" rel="nofollow">Neutraface Slab</a> comes pretty close with the large counters on the P and R, but you would want the alternate E with middle arm centered, not low middle arm. </p>
      <p>- Mike Yanega</p>
