    <p>"Der Scutt, the architect of Trump Tower, designed the Trump Tower logo. (...) Scutt, however, says he did not consider the typeface’s history when he chose Stymie. 'I couldn’t give a rat’s ass as to the history of it,' he says. 'I chose it because I liked it.' ”</p>
