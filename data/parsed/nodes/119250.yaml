    <p>What, if any, accented characters (i.e., glyphs with diacritical marks such as Aacute or tcaron) are found in combinations that are commonly covered by ligatures? For example, c_t is a somewhat common ligature to include in well-rounded OpenType fonts. Would it also make sense to have c_tcaron or c_tbar? What about L_Aacute in an all-caps font that includes an L_A ligature?</p>
    <p>I am looking for guidance, because I'm just not yet familiar enough with some of the languages that use these diacritics. I would appreciate any help. Pointing out useful references on the topic would be especially helpful.</p>
    <p>Thanks, all.</p>
    <p>Tim</p>
