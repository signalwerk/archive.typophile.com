      <p>Thanks. There's some good discussion there, but it's mostly around handling colliding accents. I'm more interested in ligatures coverage across languages. </p>
      <p>Taking c_t as an example: if I were to include a c_t ligature in a font and also wanted to provide glyphs across the Latin ranges, should I also then include ligatures for ccedilla_t, c_tcaron, c_tbar, etc.? I am not sure what combinations are even possible across all the different languages. I don't think ccedilla_t actually occurs in reality, so there would be no need to include such a ligature. I'm just not sure which combinations are possible.</p>
      <p>Just a few discretionary ligatures lead to a significant range of accented possibilities. Consider: s_t, c_t, o_o, s_p, T_h, L_A, N_N, R_A, T_T, T_Y....</p>
      <p>Tim</p>
