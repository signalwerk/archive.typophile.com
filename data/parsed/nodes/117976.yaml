      <p>I know I've seen it written that ragged-right is strongly recommended because of the danger of distracting large spaces between words. However, if one takes the effort to hyphenate, and the columns are not too narrow, usually full justification can be carried off successfully; after all, typographers have hundreds of years of experience in addressing the issue.</p>
      <p>Thus, instead of telling people they <em>shouldn't</em> justify text, my inclination would be to warn them that justification of text, to be done acceptably (let alone well) will require extra work.</p>
      <p>Yes, the preference for justified text (the <em>perceived</em> preference for justified text?) is perhaps due only to habit and tradition, and thus to an uneducated taste, but I'm a little leery of telling people what they should like.</p>
      <p><cite>You almost make it seem like reading comfort is completely lost. I actually wonder how much impact justified columns have on the reading experience both ways. They might balance each other out when done right.</cite></p>
      <p>While I agree with most of what you have written in that paragraph, I don't go as far as agreeing with its last sentence.</p>
      <p>I do think that it's quite likely that justification of the right margin, when done reasonably well, will not produce a significant negative impact on the reading experience; as long as the columns are not to narrow, if hyphenation is also used, the word spacing should largely remain within acceptable levels.</p>
      <p>However, I still admit two things: that there will be <em>some</em> potential for negative impact on word spacing (some words don't permit themselves to be hyphenated often enough), and that fully-justified columns don't offer a benefit for readability that could in any way offset this. (The benefits are in other areas, such as the aesthetics of the page as a whole.)</p>
      <p>So I wouldn't claim any chance of things fully balancing out - even if I refuse to reject justified columns for that reason, on the basis that readability, while very important, is not so important that avoiding even the slightest impingement on readability trumps all other concerns.</p>
      <p>Had I thought the impact would be more than slight, <em>then</em> I would think it reasonable to put that before such trivial concerns as following tradition and convention.</p>
