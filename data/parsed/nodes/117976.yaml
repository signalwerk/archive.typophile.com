      <p>I guess that's why I'm asking. I tend to justify my text because I feel I can compensate for the things that lead to a less comfortable reading experience enough to justify doing so, but at the art academy there are some people who are of the opinion you should never justify your text. They usually get to that conclusion because they don't know how to fix rivers though, or they think variety in line length will aid in reading. I actually never noticed such an effect on reading comfort. Besides, all novels feature justified texts and I never experienced any difficulties reading for that reason. If I experience difficulties at all, it will be because of the typeface, tight spacing, long lines and small leading.</p>
      <p>I'm not implying since all novels feature justified text it must be the best practice. Rather, the fact that all novels feature justified text and I still find them a comfort to read suggests that if you're a good typographer, justifying your text hardly has any negative effect on reading comfort. In magazines this is probably more damaging at times because they tend to be less conservative in their typographic practices.</p>
      <blockquote><p>That's the thing, readers might feel the greater formality of justified columns, and that's not totally insignificant, but when is it worth sacrificing comfortable reading for that?</p></blockquote>
      <p>You almost make it seem like reading comfort is completely lost. I actually wonder how much impact justified columns have on the reading experience both ways. They might balance each other out when done right.</p>
