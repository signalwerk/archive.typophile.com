      <p><cite>Actually now you've got me thinking: poetry is about regularity – shouldn't it be set fully justified?</cite></p>
      <p>As there were smileys with that, it was of course intended in jest.</p>
      <p>But I could, in all innocence, reply, that poetry <em>is</em> normally set fully justified... but just like any other fully justified text, <em>the last line of any paragraph</em> is not expanded out to the right margin.</p>
      <p>And so you are seeing all these short lines in poems because each one ends in a manual line break, not an automatic one.</p>
      <p>Incidentally, though, I have seen a phonograph record from Japan where the table listing the songs had each title expanded to be of equal width, despite that leaving very great spaces between the characters of some titles. So in some cultures, the equivalent of "fully justified poetry" does exist.</p>
