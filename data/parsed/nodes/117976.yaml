      <blockquote><p>Will a designer take the time? Not in my experience.</p></blockquote>
      <p>A designer will generally lack your insight, but as far as I'm concerned a designer should care about these things.</p>
      <blockquote><p>There is always an element of *tradesman* in typesetting, almost never in design. Tradesmen will take the time. And the aforementioned element of willingness to make compromises, and not agonize over them.</p></blockquote>
      <p>Well, a designer's job is a lot broader and so he wouldn't have the time. You really enlightened me about what a typesetter does, but I don't like the implication of designers not taking their time. I suspect you will be aware they put their time in other relevant things. You have the time to obsess over these details. I tend to (though not to the extent you do), but I could already be considered too much of a perfectionist, taking too much time to get things right which most people won't even notice. I suspect if I were to become a "tradesman" in design, I wouldn't have that job for long. It would simply cost too much time and money. I suppose that's a good thing though. That means the profession of a typesetter will remain a while longer. I'm all for specialized professions like that. I pride myself to be one of the most knowledgeable type geeks at my academy. I feel every design studio should have a designer in their team who is more knowledgeable about type than the general designer but so far this hasn't been the case; at every design studio I worked at so far, I greatly upgraded their typographic practices and replaced their company logo (3 times in a row now).</p>
