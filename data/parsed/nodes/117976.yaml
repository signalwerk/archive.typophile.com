      <p>IMO the biggest impediments to readability (notice that this is not legibility) are (in order):<br>
      Wordspaces that are too large.<br>
      Letterspacing that is too loose.<br>
      Leading that is too tight or loose.</p>
      <p>The first two are hard to avoid in justified text. Ergo: ragged text is better than justified.</p>
      <p>BTW The standard settings of InDesign (and QuarkXPress) are miles of the mark, probably because the US-market generally has had terrible typesetting for ages (in general), eg the stupid practice of using double spaces after a full stop.</p>
