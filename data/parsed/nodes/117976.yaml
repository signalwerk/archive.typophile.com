      <p>I don't buy the merits of justification. Its only advantage is a nice rectangular text block, and its disadvantage is ruining wordspacing and/or letterspacing, hence reading. Almost never a good trade-off in my mind. Yes, rag-right requires more care –sometimes even hyphenation– to avoid occasional distracting patterns, but then justified text has rivers, which are even harder to expunge.</p>
