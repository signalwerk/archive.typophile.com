      <p>I agree with Bert in his comments and also stress that this is a skill issue and there is no magic formula.<br>
      One way is to look at the last lines in a paragraph and make specific line breaks to make sure the last line is neither too short or too long.  Too long does not hint at a paragraph end.  Most often, type set ragged has a blank linespace between paragraphs so knowing the paragraph has ended is not much of a problem.<br>
      On the rare occasions where there is no line break, indentation and careful management of last-line length are quite adequate to signal a paragraph ending.  The writer often helps as well by tidying up the final thought in the wording.</p>
