      <p>This is very interesting to read in conjunction:</p>
      <p><cite>"classicism was foreign in origin, but 300 years ago it was deliberately imported by Peter the Great"</cite><br>
      <cite>"being a “modern italian”[…], I could say that Trajan does look somewhat foreign. In the sense that it appear to belong to a different, definite culture."</cite></p>
      <p>Maybe in this special combination – of Trajanesque lettershapes already being somewhat remote to us culturally (and quite likely, especially so in the fringes of Latin-land), <em>plus</em> Cyrillic already having acquired a strong structural closeness to Latin – the difference isn't quite so big as to really be jarring, or even very noticeable (at least not as jarring as it could be between other scripts). But surely it can't completely disappear? Wouldn't there still be a (if barely noticeable) subliminal tinge of foreign-ness to it, of obviously referring back to a different script/culture?</p>
      <p>And, this:<br>
      <cite>"A lot isn’t cultural, it’s just human."</cite><br>
      …is exactly what I would be arguing against. Surely, different cultures* have different visual expressions of "grandeur"; and while another culture's "grandeur" may well be recognizable as such, the expression of it surely can't be transferred from one culture to the other just by copying its "surface" formal properties. I mean Japanese calligraphy looks "grand" to me too, but when trying to apply the same style to Latin letters, the result would certainly look distinctly <em>foreign</em> long before it will look "grand". </p>
      <p>Now, maybe in the specific context discussed in this thread, this factor of "foreignness" is very small, but that doesn't mean this issue of transferability of style between scripts shouldn't be a basic consideration no matter which scripts we're talking about.</p>
      <p>(* I do see that the whole "cultural" argument is particularly hard, and potentially fishy, to apply to Latin.)</p>
