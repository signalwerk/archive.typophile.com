      <p>&gt; What mood does this convey?<br>
      <a href="http://themicrofoundry.com/ss_trajic.html" title="http://themicrofoundry.com/ss_trajic.html">http://themicrofoundry.com/ss_trajic.html</a></p>
      <p>I was going to say that it conveys the fact that some people have too much time on their hands, but in a web search, I found out that this experimental face is not being offered for sale... and you appear to be the designer responsible for it.</p>
      <p>It's fine to do something to get people to think. Since, however, Russian and Greek have been adapted to Times Roman, I see no problem in allowing people whose language is Russian and Greek to use, in addition to the existing typefaces for their languages, other faces originally designed for the Latin alphabet... Garamond, Baskerville, Cheltenham, Hobo or even Papyrus, if they feel like.</p>
      <p>Cyrillic isn't really much different from Latin in the base formes which it uses; yes, some lowercase letters use "small capital" forms, while others (a and e) use the same lowercase as Latin.</p>
      <p>Greek, unlike Armenian, at least has the same x-height as Latin, but the fact that its lowercase has a cursive basis rather than an uncial basis does mean that translating fonts is much more problematic - except in this case, where the typeface is uppercase only.</p>
      <p>Given the enormous influence of the English-speaking world, though, it's not surprising that typefaces for, say, Japanese have been influenced by display faces designed for the Latin alphabet. Compared to which, translating any Latin typeface to Armenian, Amharic, or even Gujarati - even a blackletter - is small potatoes.</p>
