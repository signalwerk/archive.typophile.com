      <p>&gt; Russia is part of Europe</p>
      <p>So is Armenia, a bit.<br>
      The question is, is Russia enough part of Europe*, and are there so few Russian fonts, that a Cyrillic Trajan is probably your best bet? It seems extremely unlikely that "classy" uses almost exactly the same formal language in Russia than it does in London or Rome.</p>
      <p>* How many years now, BTW? And have you been to places besides Moscow and St Petersburg? Those two contain ~10% of Russia's population; and Novosibirsk (Russia's third-largest city) is very different than Europe.</p>
      <p>&gt; This is just display typography, not a matter of life and death.</p>
      <p>1) Almost nothing in type is that important; but we still do it.<br>
      2) Yes, Russian culture is pretty secure (especially these days). I haven't even gotten into the power of type to forestall cultural assimilation*, I've just focused on Stephen's needs on this project.<br>
      3) Even among those people who think that there <em>is</em> a difference between display and text type, there are many (probably the majority) who think that it <em>still</em> doesn't matter in text either.<br>
      4) Things are quite different display vs text: in the former, formal features actually have <em>more</em> cultural weight**, and -being evaluated consciously- they affect direct cultural development much more than in text type; in contrast text type might have a deeper and longer-lasting cultural effect, but there technical issues take precedence. When you believe that it's a good idea to formally map Trajan over to Cyrillic, you're much more likely to end up making/supporting Cyrillic text type that's Latinized (but not the other way around).</p>
      <p>* Something huge for Armenians for example.</p>
      <p>** In display type matching x-heights to me makes sense for example.</p>
      <p>--</p>
      <p>It's sad to see so many people from cultures that are formerly or currently seen as "backwards" go too far in adopting the values and mores of a culture they see as "superior". Change is good, but don't throw out the baby with the bathwater!</p>
      <p>hhp</p>
