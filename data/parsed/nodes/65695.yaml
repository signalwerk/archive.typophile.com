      <p>Agreed: I don't see how the facts that it's been done, and that there's a demand for it (both of which I won't dispute) negate what I said, and Hrant back in the other thread.<br>
      In Cyrillic, Trajanesque forms cannot possibly have the same "relative" connotations they have in Latin-land – here, they link back to an important/normative/"classic" chapter in the development of our script, whereas in Cyrillic, they'd essentially be mimicking a foreign model, which I'd expect <em>must</em> "feel" different, or give it a different "flavor".<br>
      If I make a font that applies characteristics of classic Chinese fonts to Latin type, even if I am formally successful, it'd be silly to expect the end result to look as inherently classic as the foreign model – it's obviously mostly going to look… foreign-influenced.</p>
