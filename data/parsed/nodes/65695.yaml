      <ul>
      <li><em>One potential problem is that Trajan is inherently Latin, being based on Roman inscriptions; so a Cyrillic font in the same </em>style<em> is presumably not going to have the same </em>feel<em>, or trigger the same associations.</em></li>
      </ul>
      <p> I beg to differ. Historically there have been quite a few attempts, some of them more successful than <a href="http://www.behance.net/pouzeot/frame/215715" rel="nofollow">others</a>, at developing Cyrillic versions of the Trajan letters. The earliest one I know of was Trajanus Kyrillisch (by Hermann Zapf; D.Stempel, 1957). There is a number of Cyrillic digital fonts whose design was inspired by the Roman monumental lettering. The capitals of <a href="http://www.paratype.ru/pstore/fonts/Lazurski.htm" rel="nofollow">Lazurski Roman</a> (by Vladimir Lazurski; VNIIPolygraphMash, 1962) are probably the best-known example. Sergei Egorov who lives in the USA continually explores the <a href="http://www.malgil.com/esl/" rel="nofollow">Trajan legacy</a>. The demand for the definitive Cyrillic version of Adobe Trajan is huge, and it is not likely to go away. Unauthorised Cyrillisations of Carol Twombly’s Trajan abound. Shown below is <a href="http://www.paratype.ru/pstore/fonts/Romul.htm" rel="nofollow">Romul</a>, by Sergey Shanovich (TypeMarket, 1995).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Trajan_Cyr_5723.png"></div><p></p>
