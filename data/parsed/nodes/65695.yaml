      <p>Nina, I know it's intuitive and plausible, but Maxim is telling you that it's also wrong. </p>
      <p>I don't know the history and I don't read any Cyrillic language, but here's my guess: I read on the wikipedia that Peter the Great latinized Cyrillic. When I look at the Cyrillic alphabet I see some characters that look identical to Roman caps. </p>
      <p>And our own lower case was 'romanized' by being retro-fitted with Imperial Capitals as initial letters in the 15th century. </p>
      <p>So both our scripts have some Roman Caps mixed with other alphabets. So it seems to me pretty plausible that they would see the same elegance and authority in these designs. </p>
      <p>Also I would think that the Imperial Caps look elegant and grand, even if you don't read any language with a latin script. You don't have to have lived in ancient times to find the architecture of ancient Rome and Greece grand. A lot isn't cultural, it's just human.</p>
