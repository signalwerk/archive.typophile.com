      <p>I think the parallels with translation are illuminating. No translation is going to evoke exactly the same things as the original. No two languages are exactly alike in the way they express thoughts and feelings. Moreover, the cultural milieu of the audiences are different. These problems are multiplied when it comes to translating literature, especially poetry.</p>
      <p>There have been competing opinions on how to translate literature throughout the ages. One undying debate, very broadly simplified, is between those that would slavishly follow the forms of the source language, and those that would try to make the translation as natural as possible in the target language.</p>
      <p>The latter position is intuitive enough. Who doesn't want a translation to read well, enough to make you forget that it is a translation? However, you might be surprised how many people throughout history argued the former position, even taken to extremes. Vladimir Nabokov declared, "The clumsiest literal translation is a thousand times more useful than the prettiest paraphrase." </p>
      <p>Wouldn't wholesale import of forms foreign to the target language get in the way of enjoying the piece of literature as the original language readers would? And wouldn't the introduction of such unnatural, foreign idioms be detrimental to the purity of the language? Perhaps, but there were those throughout history who saw this as enrichment of the language and broadening of its expressive potential.</p>
      <p>Now, I think we can all agree that it is hopeless to expect a counterpart to Trajan in Cyrillic that evokes exactly the same things as the Latin original; it isn't even clear what it evokes to the Latin audience anymore. The question is what sort of design will be closest—the best translation, if you will, of Trajan in Cyrillic. Those who would copy Trajan's forms slavishly are like those literal translators who have no scruples about introducing foreign forms into the language. They will have language purists crying foul.</p>
      <p>Over time, some of the foreign quirks introduced into the language through such translation become accepted and become a natural part of the language, while others remain stilted and unnatural. I am not a native reader of Cyrillic, but I can certainly imagine it going either way with the forms of monumental Roman capitals adopted into Cyrillic. Or that parts of the Cyrillic readership will feel it is an acceptable and naturalized part of the Cyrillic palette, and perhaps even that they can claim as much cultural ownership to these forms as modern Latin users based on a shared history of idealizing Classical Antiquity; while others deem it too foreign, or worse, a fake reconstruction of a "Classical" Cyrillic that obscures the actual development of classical Cyrillic letter forms. Remember, Cyrillic users are as varied a bunch as the Latin users.</p>
