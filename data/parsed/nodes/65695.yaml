      <ul>
      <li><em>Cyrillic isn’t really much different from Latin in the base formes which it uses</em></li>
      </ul>
      <p>This is true: Cyrillic is indeed related to Greek and Latin—functionally, structurally and aesthetically. This relationship goes back a very long way in history, about twelve centuries. There is a nice <a href="http://bjorn.kiev.ua/librae/LazurskyCV/img/hi/118.jpg" rel="nofollow">visual</a> Lazurski put together to illustrate that deep and complex relationship.</p>
      <ul>
      <li><em>Given the enormous influence of the English-speaking world, though, it’s not surprising that typefaces for, say, Japanese have been influenced by display faces designed for the Latin alphabet. Compared to which, translating any Latin typeface to Armenian, Amharic, or even Gujarati - even a blackletter - is small potatoes</em>.</li>
      </ul>
      <p>Here you are referring to the typographic fashion. However, the design of the typefaces that covers both Latin and Cyrillic scripts is not driven by the fashion considerations only, there is a lot more to its rationale. Nor is the ‘enormous influence of the English-speaking world’, which is a relatively recent phenomenon, a decisive factor. It’s just that in the last 300 years Cyrillic typography developed in synch with Western typography: first, Dutch, then French, then German. The synopses of most types used in Russia and other Cyrillic-using countries used to include both Cyrillic and Latin letters. So do the present-day digital Cyrillic fonts. There is nothing controversial, or perverse to the development, or use, of the Cyrillic versions of Trajan, or Garamond, or Baskerville, etc. It is standard practice.</p>
    html_clean: |-
      <ul>
      <li><em>Cyrillic isn’t really much different from Latin in the base formes which it uses</em></li>
      </ul>
      <p>This is true: Cyrillic is indeed related to Greek and Latin—functionally, structurally and aesthetically. This relationship goes back a very long way in history, about twelve centuries. There is a nice <a href="http://bjorn.kiev.ua/librae/LazurskyCV/img/hi/118.jpg" rel="nofollow">visual</a> Lazurski put together to illustrate that deep and complex relationship.</p>
