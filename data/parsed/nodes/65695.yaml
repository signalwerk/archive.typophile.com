      <p>&gt; Not the way I see things. In fact I think even Polish and English don’t have the same x-height. :-)</p>
      <p>&gt; BTW, Ladislas Mandel has claimed this sort of thing for French vs English.</p>
      <p>While there might be some on this thread who might ridicule you for saying this (but then, you did include a smiley) I do see your point.</p>
      <p>While Cyrillic and Latin letter forms have a great deal in common, it is also true that until recently, they were not using the same typefaces. Russian had a greater tendency to be set in fonts resembling Bodoni or Didot - but with thicker thick strokes.</p>
      <p>And it is true that Caslon (English) and Garamond (French) and Bodoni (Italian) and Weiss Roman (German) don't have the same x-heights - and because of differing frequencies of individual letters and pairs of letters, some typefaces that have flaws when used for one language work beautifully with another one.</p>
      <p>Rather, therefore, than claiming that you don't have a point, I think I will make a different point that won't contradict yours.</p>
      <p>Yes, people with different alphabets - or even people with different languages who use the Latin alphabet - ought to continue to exercise creativity in designing their own typefaces which draw from their own cultural context.</p>
      <p>But because there are only "so many hours in each day" and only so many creative type designers available... this should <em>not</em> be considered an argument against taking advantage of the work of typeface designers working in other cultural spheres so as to have even more typeface choices available.</p>
