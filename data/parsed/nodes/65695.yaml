      <p>It would be useful to take into account that the Latin alphabet is not used by a single homogeneous culture. Various cultures have adopted the Latin alphabet, many of them long before the invention of type and mass literacy homogenized the forms of the alphabet into something we know today. Even a hundred years ago languages such as German and Irish would commonly be printed using different forms of the Latin alphabet from the humanist model we are familiar with.</p>
      <p>What do we mean when we speak of Trajan's connotations in the Latinosphere? Does it mean the same to a modern Italian, born into a culture and surroundings that retain a strong link to classical antiquity through the Renaissance revival; to a German old enough to remember learning to read and write in a model removed from what we have today; or to a Madagascan, for whom his native language was first written in the Latin alphabet during the age of the Moderns and Scotch Romans we have been talking so much about lately? Or to an Uzbek, who is living through an uneven and incomplete transition from Cyrillic to Latin (and whose language has historically been written in a version of the Arabic alphabet)? Is an Uzbek phrase written in the Latin alphabet and rendered in Trajan somehow less problematic than the same phrase written in Cyrillic and rendered in Trajanesque forms?</p>
      <p>There are lots of Latin alphabet users who are at a considerable cultural remove from Classical Rome. And yet, they have presumably been subjected to Trajan through the multitude of Hollywood films they consume. I sometimes wonder whether those of familiar with the history of the Latin letterforms may often be forgetful of the fact that the vast majority of the masses don't ever really consider the historical and cultural context of the forms of the letters they see around them.</p>
