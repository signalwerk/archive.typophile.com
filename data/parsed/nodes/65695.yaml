      <p>(P.S.)</p>
      <p><cite>translation</cite></p>
      <p>I think this is a crucial key word in this context. While a sensitive translation can approximate quite closely, its output will never be «identical» to the input; in much the same way that say a poem cannot be translated between languages without changing very slightly, simply because every language (and here, every script, in terms of its «design space») has its own intricate system of denotations and connotations. Copying the denotative level of the elements is not automagically going to match the connotative level as well, especially when the connotation, as in this case, is actually inherent in the source culture.</p>
