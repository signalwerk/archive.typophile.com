      <p>Good question. But let's start small; long-held theories tend to need to be eroded down over time, not demolished in a second. For example over the past ten years I've slowly built up my beliefs about readability; one study by one scientist will only chip off a small piece of the iceberg at best. An exceptionally good study might cause a good-sized crack; but I can't simply dump all the other evidence from over the years.</p>
      <p>In this case, if somebody did a really good survey and asked Russians (and not Russian designers mind you) to rank a good number of fonts for "classiness" and Trajan came out on top, I would certainly acquire a seed of doubt. Now, doing such a survey is a tall order, I admit; but that's why I said what I said above about "belief systems".</p>
      <p>HOWEVER: Please note again what I wrote about Trajan not necessarily being "classy" in the West now.</p>
      <p>hhp</p>
