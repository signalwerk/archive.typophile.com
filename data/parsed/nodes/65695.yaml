    <p>Hello,</p>
    <p>I am searching for a multilingual alternative to Trajan. It doesnt have to look exactly like Trajan, Im just searching for something with a similar feel and oldstyle proportions. A just uppercase font is enough. But I need an extended latin character set and cyrillic letters as well.</p>
    <p>Thank you very much for suggestions.<br>
    best regards. Steven</p>
