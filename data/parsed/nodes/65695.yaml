      <p>I certainly agree that design is a highly pragmatic endeavor. If you can save time, all else being equal, that's wonderful. I'm a big fan of efficiency (even if often I don't know where it's hiding). But -at least in a text face- I think <em>as a rule</em> important things will go wrong when you transfer formal attributes across scripts.</p>
      <p>Here's a summary of my thoughts on this:<br>
      <a href="http://themicrofoundry.com/ss_rome1.html" title="http://themicrofoundry.com/ss_rome1.html">http://themicrofoundry.com/ss_rome1.html</a><br>
      For the full treatment you might want to find a copy of the 4th issue of Spatium magazine (or the 5th of the Greek journal Hyphen) where I have an article entitled "Latinization: Prevention and Cure".</p>
      <p>BTW, I use my smilies as carefully as I [try to] use my words. That one above was not winking. :-)  A clarification is in order however: when Mandel said that a proper French typeface has a small x-height, he meant it culturally; when I say something along those lines it's generally from a functional perspective.</p>
      <p>hhp</p>
