    html: |-
      <p>The main difference between the outlines is the type of splines and the direction of drawing – I think they're drawn clockwise in TT and counterclockwise in PS.</p>
      <p>As for Windows, it considers a TrueType font to be OpenType if it finds a table named "DSIG" in it, OpenType being a sort-of super-TrueType that can hold either type of outline along with a zoo of positioning and substitution data tables.</p>
