    html: |-
      <p>I agree with Thomas. My first attempts to edit fonts -- with font editors that are long since obsolete -- were with true type and were extremely frustrating. Ps is a dream by comparison. But ps is weak for presentation of very complex designs, so ttf has its advantages. Otf is really just a wrapper for either ps or ttf formats. Either flavor can work fine as otf. Bit of history -- ps was the first really good digital font format, i.e. Adobe etc. Microsoft didn't own it, so promoted the alternative ttf. Even today, fonts packaged with Microsoft products are ttf.<br>
      Don</p>
