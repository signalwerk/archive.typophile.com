  html: |-
    <p>Some early hand sketchs of some type designers have little lines on the outline of the characters, like this one of Jean François-Pochez (<a href="http://farm5.static.flickr.com/4147/5032761184_4c3f907cdc_b.jpg" title="http://farm5.static.flickr.com/4147/5032761184_4c3f907cdc_b.jpg">http://farm5.static.flickr.com/4147/5032761184_4c3f907cdc_b.jpg</a>)</p>
    <p>This little lines become nodes on the scanning process? Or what is the true function of them?</p>
