    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Typeco</strong></p>
    <p><strong>Typeco</strong> is the digital type foundry for the designs of <a href="/wiki/James%20Grieshaber" class="freelinking" rel="nofollow">James Grieshaber</a>. Typeco puts a modern spin on familiar concepts to create bold and versatile font families. Relevant type styles with a significant nod to the past.</p>
    <p>The Typeco retail library includes: <a href="http://www.typeco.com/reenie-beanie.html" rel="nofollow">Reenie Beanie</a>, <a href="http://www.typeco.com/glyphic-neue.html" rel="nofollow">Glyphic Neue</a>, <a href="http://www.typeco.com/chunkfeeder.html" rel="nofollow">Chunkfeeder</a>, <a href="http://www.typeco.com/trapper.html" rel="nofollow">Trapper</a>, <a href="http://www.typeco.com/super-duty.html" rel="nofollow">Super Duty</a>, <a href="http://www.typeco.com/cypher.html" rel="nofollow">Cypher</a>, <a href="http://www.typeco.com/gothic-gothic.html" rel="nofollow">Gothic Gothic</a>, <a href="http://www.typeco.com/cusp.html" rel="nofollow">Cusp</a>, and <a href="http://www.typeco.com/zaftig.html" rel="nofollow">Zaftig</a>.</p>
