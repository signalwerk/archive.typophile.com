      <p>Your letters are waaay too tight. au is almost moulded together... "h" is probably much better but it's hard to tell since "u" is too close to "a". And maybe to "l" as well.</p>
      <p>"m" looks too much like golden arches. You'll have to make inner lines inside it a bit more steep (different angle than outer ones). It will still have correct style but its own distinct look (not recognisable by hamburger fans)...</p>
      <p>I like the middle "a" but upper line is too short and doesn't reflect the style of "e" enough. But it has exactly what I wanted to see: top and bottom line angle match. I like it but I may not be the best judge for it since it was something I wanted to see.</p>
      <p>Can't say about the "o". Too tight letterspacing and no small size. But it may still be just a little bit too wide.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
