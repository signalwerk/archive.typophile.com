    html: |-
      <p>I would make try the shape of top of "a" similar to the bottom of "e". They differ too much. Actually "a" differs too much from other letters style too much.</p>
      <p>Regarding the "m". I'd keep the first one but make it narrower. But just enough. You don't want it squashed and you don't want it too wide either (the way it's now. But as said I would keep the first design. Looks much better and it also matches "v" and matches other letters' style better.</p>
      <p>"h" is too narrow compared to "u". "r" is MAYBE a very small bit too wide. "o" is almost definitely too wide.</p>
      <p>Also "stabilise" "e" a bit more at the bottom, because it looks a bit too much off and is falling.</p>
      <p>When changing "a" I would suggest you make the top and bottom match, but try making the middle line horizontal.</p>
      <p>These are my suggestions.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
