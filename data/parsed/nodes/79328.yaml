    <p>Ok chaps and chapettes, have a look at my logo please for my own website.  I was looking for something simple and dynamic that would reproduce well on just about anything.</p>
    <p>I don't pass myself off as an expert in corporate ID therefore constructive comments welcome, and I will return the favour if I can!!  Thanks. </p>
