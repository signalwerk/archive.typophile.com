  html: |-
    <p>At one point during the four-day-bindery-athon the conversation turned to watermarks.  The 9# vintage, 100% cotton rag onion skin we were using in the Japanese bindery project is watermarked, so, I took the opportunity to talk about watermarks and paper making with my LSU graphic design student assistants.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/nsc_05_5355.16.08.jpg"></div><p></p>
    <p>This example is from my collection, the engraved monogram is one of my own, the paper is vintage from the same mill as the onion skin we used in the bindery project.</p>
    <p>A great website containing a collection of 332 watermarks is:</p>
    <p><a href="http://www.watermarks.info/indexi.htm" title="http://www.watermarks.info/indexi.htm">http://www.watermarks.info/indexi.htm</a></p>
    <p>also, the Robert C. Williams Paper Museum has some interesting information about watermarks and paper in general:</p>
    <p><a href="http://ipst.gatech.edu/amp/collection/index.htm" title="http://ipst.gatech.edu/amp/collection/index.htm">http://ipst.gatech.edu/amp/collection/index.htm</a></p>
