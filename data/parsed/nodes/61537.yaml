      <p>"modern and clean but also has some kind of southern touch to it"</p>
      <p>In architectural terms, that seems a bit like asking for something that is mid-century modern but also log cabin rustic. </p>
      <p>Maybe stick with modern and clean for the type, and consider a secondary element to tie in the regionality (is that a word?) of it. An icon or symbol to go with it. Given that you are architects, the obvious (if maybe a bit cliche) suggestion would be a sketch of a traditional southern covered front porch.</p>
    html_clean: |-
