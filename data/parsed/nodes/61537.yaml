    html: |-
      <p>I think I agree with aluminum; drop the search for the 'southern' font and go with something else that will give an immediate visual trigger for your area.  Maybe not a porch, but a colonnade or portico?  Or maybe an even bigger cliche for your particular area: a stylized fleur-de-lis that could get across your group's mission?  </p>
      <p>You could get quite a bit of mileage out of a slightly watermarked loose sketch of any of these, and going with that option would give the modern look your organization is wanting.</p>
      <p>Good luck!</p>
