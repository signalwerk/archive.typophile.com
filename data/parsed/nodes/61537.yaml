    <p>Hi Everyone!</p>
    <p>I am looking for some suggestions. I am designing a logo for an architectural / nonprofit design build firm called Front Porch. It is based in southern Louisiana.</p>
    <p>Basically they want something that is modern and clean but also has some kind of southern touch to it. Any suggestions for fonts? </p>
    <p>I've been looking at Southern Colonialist by Intellecta, but its just not clean enough for what they want</p>
    <p>Thanks for your help!</p>
