    html: <p>Only an American could relate fascist lettering to the Pac-man logo or Milton Glaser's Baby Teeth. I've already told Mark his Mostra is very nice, but you have to be grown up in Italy to *feel* what the fascist aesthetic was about. The reworking of roman aesthetic was the basis of all this. <br>For the same reason P22's Il Futurismo sucks big time.</p>
