    html: <p>Claudio,  <br> <br>Maybe we missed the poster's point, but politics aside, our job here is usually to try to help someone find a font that is (or resembles) their sample. It's fine for you to say it's Fascist, but they are still letterforms, and as stupid as it sounds the Pacman/Baby Teeth fonts use some very similar shapes.  Larabie's imitation is a better Pac-Man simulation, but the shading was not present in the tree shapes, so I picked a Pac-Man font that was just geometric shapes. It's an exercise for fun, not a reason for polemics.</p>
