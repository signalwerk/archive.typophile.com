  html: |-
    <p>I posted this question 2 days ago on MyFonts/What the font?, but no answer as of yet. I'd like to buy it, use it, and give the designer credit. My pirated copy, but not by me, is called AlchemyGoldA24, version 4.1 (according to SuitcaseFusion). The only references I can find are Czech, and no designer or foundry is mentioned.</p>
    <p>Does anyone have information regarding this font?</p><div class="imageWrap"><img src="http://typophile.com/files/Alchemy_4403.jpg"></div><p></p>
