      <p>Nice choice - always cool to side with an underdog.</p>
      <p>Many years ago an academic requested that I add a letter to one of my Armenian fonts; he was writing a paper about pre-Mashtots Armenian and claimed that we used to have a sound like the Arabic ح (which I'm not sure how to properly describe) that got lost when our alphabet was implemented. According to his research the word for "lion" for example (առիւծ, which sounds like "arrouydz") originally started with that sound instead of an "a" sound (which actually makes sense if you know what ح sounds like :-).</p>
      <p>hhp</p>
