      <p>Unfortunately, such a technical term as "voiceless pharyngeal fricative" fails to have meaning to me; I will have to learn.</p>
      <p>But a Google search got me to</p>
      <p><a class="freelinking external" href="http://en.wikipedia.org/wiki/Heth" rel="nofollow">http://en.wikipedia.org/wiki/Heth</a></p>
      <p>and some other articles, where I see that it is symbolized by ḥ (Hmm.. the "ḥ" in Muḥammad!) or by ħ... and is at least one possible old pronounciation of the Hebrew letter ח .</p>
      <p>If the sound was lost from Armenian before its alphabet was formed, then, unlike the case for the Brahmi family of abugidas, it may be hard to decide what the new letter for Armenian "should" look like.</p>
      <p>Had Armenian been written with the Cyrillic script, then when there is no letter for a given sound in Greek, the practice of turning to Hebrew for inspiration already has a precedent: Ш. Unfortunately, that would imply the new letter would look like П, and that shape happens to already be taken.</p>
