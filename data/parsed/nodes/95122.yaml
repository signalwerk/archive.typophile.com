      <p><em>uch a technical term as "voiceless pharyngeal fricative" fails to have meaning to me</em></p>
      <p>That is why I provided the simple description of how the sound is produced: 'a sound produced by constricting the flow of air with the base of the tongue at the back of the throat'.</p>
      <p>The only way to accurately describe vocalisation is to describe how sounds are produced. The technical name is simply a shorthand for such description. Trying to describe what the sound sounds like isn't helpful, because different people will have a different sense of what is meant by e.g. 'it sounds like the beginning of gradually trying to clear phlegm from your throat'. So one needs to talk about the parts of the vocal system and what is happening to produce a given sound, which can then be reproduced by anyone with a (physiologically normal) vocal system, even if the sound isn't part of his or her language. So, in this case, concentrate on moving the back of the tongue towards the back of the throat to constrict the flow of air, then pick a vowel and try to make a sound. :)</p>
