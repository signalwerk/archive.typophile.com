    html: <p>I am only half-way into the "native" Greek category since my family is from Greece and I was born in the USA but I see what you are saying, Nick.  I was taught both Greek and English from birth but my first few years of life were spent in my grandparents house (where only Greek was spoken) while my father was away at WWII. I attended Greek School up in to high school as well so I was quite familiar with the Greek script.  I have no problem "seeing" and drawing the glyph forms of Greek because they seem quite normal to me.  I don't think it is a question of being "scripty" as much as being familiar.  The Greek theta is a glyph that is not particularly scripty but it is very strange looking to the non-Greek  because it is so very tall and thin compared to any English letter.  I would bet that the biggest problem a non-greek type designer would have was to actually be able to believe the theta was really that narrow.</p>
    html_clean: <p>I am only half-way into the "native" Greek category since my family is from Greece and I was born in the USA but I see what you are saying, Nick.  I was taught both Greek and English from birth but my first few years of life were spent in my grandparents house (where only Greek was spoken) while my father was away at WWII. I attended Greek School up in to high school as well so I was quite familiar with the Greek script.  I have no problem "seeing" and drawing the glyph forms of Greek because they seem quite normal to me.  I don't think it is a question of being "scripty" as much as being familiar.  The Greek theta is a glyph that is not particularly scripty but it is very strange looking to the non-Greek  because it is so very tall and thin compared to any English letter.  I would bet that the biggest problem a non-greek type designer would have was to actually be able to believe the theta was really that narrow.</p>
