      <p>Although I participated in this thread at the time, I did not try to name a favorite letter of my own. I use all 26 of the letters of the Latin alphabet to communicate with, and I just don't relate to them in a way that inspires me to single any one of them out.</p>
      <p>However, just recently, I learned of a lonely orphan letter that needs a little help.</p>
      <p>On <a class="freelinking external" href="http://www.quadibloc.com/comp/kyb04.htm" rel="nofollow">my website</a>, I have a page about various typewriter keyboard arrangements. Recently, I learned of the existence on the web of copies of a book I thought only existed in a lost manuscript. It was a Russian-language book from 1913.</p>
      <p>And, thus, of course, it was in the old orthography, the new orthography only being decreed in 1918. This led to my becoming curious about how the change in orthography affected the Russian typewriter keyboard, and hence I made an addition to the page referenced above.</p>
      <p>Even before this, I had run across claims that one of the letters eliminated from Russian, Ѣ or ѣ, "yat", was not actually identical in pronounciation to the letter currently used for it, at least in some dialects of Russian, and indeed distinguished words distinct in meaning.</p>
      <p>So I think that I will adopt "yat" as my favorite letter, at least at the moment.</p>
