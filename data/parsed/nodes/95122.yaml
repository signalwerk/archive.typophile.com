      <p>I don’t really think of letters in terms of favorites, but there are certain Greek and Cyrillic characters which I often ﬁnd remarkably difﬁcult to draw, and not because I am a native Latin user. </p>
      <p>I suspect it is because with Greek the letters are very “scripty”, and don’t adapt well to more rigid typographic conventions that stem from the Latin typographic tradition. With Cyrillic, it’s the other way around.</p>
      <p>I wonder if native Cyrillic and Greek type designers have a similar experience.</p>
