    html: |-
      <p>I don’t work with truetype hints, so I don’t know the answer. But I can tell you that truetype hinting is a very difficult thing to do. Do you really need to do it by yourself? If so, reading the Fontlab manual (chapter 9) could be a good place to start.</p>
      <p>To download the Mac version press <a href="http://www.fontlab.ch/downloads/manuals/FLS5MacManual.zip" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>.<br>
      To download the PC version press <a href="http://www.fontlab.ch/downloads/manuals/FLS5WinManual.zip" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>.</p>
      <p>Good luck.</p>
