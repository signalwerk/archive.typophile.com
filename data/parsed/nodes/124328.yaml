      <p>I stand corrected, Ryuk (obviously, my eyes aren’t what they used to be).</p>
      <p>To add to your list of options, I’ll add Basic Commercial:<br><a href="http://www.myfonts.com/fonts/linotype/basic-commercial-lt/">http://www.myfonts.com/fonts/linotype/basic-commercial-lt/</a></p>
      <p>With a bit of widening and flattening of the letterforms, and editing the |a|, it comes awfully close.</p>
