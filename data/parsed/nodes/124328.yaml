  - id: 602215
    user: 22675
    date: 2015-04-03T04:21:00
    date_raw: 3 April 2015 - 4:21am
    votes: null
    html: <p>Gotham appears to me only as a very good ready-to-go option but I don't think it's the one. I comes very close for all letters except /a but I assume it would be not so hard to customize it. A geometric sans like ITC <a href="http://www.myfonts.com/fonts/itc/avant-garde-gothic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Avant-Garde Gothic</a> Demi-Bold may work for everything but /a (plus a slight edition on /P). /a is something completely different reminding me of the approach of <a href="http://www.myfonts.com/search/frutiger" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Frutiger</a>'s one. Something like <a href="http://www.myfonts.com/fonts/linotype/neue-frutiger" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Neue Frutiger</a> or <a href="http://www.myfonts.com/fonts/paratype/free-set" title="Click to visit an external URL." class="freelink freelink-external freelink-external">FreeSet</a> could work. My best option here would probably be <a href="http://www.myfonts.com/search/avenir" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Avenir</a> which combines the geometry of AVG and a double storey /a close to Polaroid.</p>
    html_clean: <p>Gotham appears to me only as a very good ready-to-go option but I don't think it's the one. I comes very close for all letters except /a but I assume it would be not so hard to customize it. A geometric sans like ITC <a href="http://www.myfonts.com/fonts/itc/avant-garde-gothic" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">Avant-Garde Gothic</a> Demi-Bold may work for everything but /a (plus a slight edition on /P). /a is something completely different reminding me of the approach of <a href="http://www.myfonts.com/search/frutiger" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">Frutiger</a>'s one. Something like <a href="http://www.myfonts.com/fonts/linotype/neue-frutiger" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">Neue Frutiger</a> or <a href="http://www.myfonts.com/fonts/paratype/free-set" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">FreeSet</a> could work. My best option here would probably be <a href="http://www.myfonts.com/search/avenir" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">Avenir</a> which combines the geometry of AVG and a double storey /a close to Polaroid.</p>
