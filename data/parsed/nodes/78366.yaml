    <p>Hello, i'm a russian blogger and developer. I want to make a review of fonts, targeted for software developers(using it in IDE, editors).<br>
    Due my location, i can't get a good information about best fonts(including proprietary fonts) for my work. Yes, my friends use fonts like Arial, Courier New, Liberation. It's so scary.<br>
    So, i want to find more information in asking of you, of professionals in fonts chosing :)<br>
    Now i'm scanning google in searching of better fonts(like monaco, incosolata etc), but all pages are old. Maybe, you can tell me something new about fonts for development?<br>
    I found alot of proprietary font, but i can't try it in my IDE(Eclipse and emacs). But, if i have a some more information about what fonts need to try - i'll buy it.</p>
    <p>So, can you advise me best monospace fonts(better if it targetted for software developers) you ever seen? No matter how much it costs.</p>
    <p>Requirements to this font are simple:<br>
    It must be monospaced.<br>
    It must have dotted of slashed zero(but if font really awesome, i can ignore it).<br>
    If must have a cyrillic glyphs(not really needs, but it'll be cool due my location).</p>
    <p>Also, i know what font looks different in different OS, but i need fonts for any OS for my review, becouse i'll make a review of fonts on each system(windows, linux, mac os) and i'll choose different fonts for each system.</p>
    <p>Sorry for my "english" -_-</p>
