      <p>I will not embarrass myself by attempting to comment on its typographic merits, but I have personally found a monospaced font called "TI Uni" very pleasing to my eyes when staring at code for hours on end.</p>
      <p>It was used for code snippets in Texas Instruments' graphing calculator manuals for a while (might still be) and they had it as a free download on their site. You can probably find it with a quick google search.</p>
