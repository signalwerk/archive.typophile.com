    html: |-
      <p><em>Isn't that part of the "seen" though?</em></p>
      <p>It is important to understand the kashida as an elongation of a letter, and not as something inserted between letters, although most font technologies have tried to implement kashida in terms of an insertion (and most Arabic justification algorithms sadly presume a flat kashida that can be stretched or multiplied without distortion). As an elongation of the letter, the kashida should affect the positioning of disambiguating dots and other marks.</p>
      <p>This is an area of Arabic typography that is still very problematic. We can get manually inserted U+0640 kashida to work correctly using OpenType Layout:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/otlkashida_3429.png"></div><p></p>
      <p>But automatic kashida insertion as applied in all justification I've looked at happens after OTL processing, and hence will break display of any non-flat Arabic typeface.</p>
    html_clean: |-
