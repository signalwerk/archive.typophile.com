    html: |-
      <p>Tatweel is an Arabic name of kashida (which I believe is a word of Persian origin, though the word commonly used by Arabic calligraphers as well).</p>
      <p>Kashida can be used for many purposes like emphasising, giving room for diacritics in "crowded" situations etc. and when used properly improves the overall appearance of text. Kashida is usually a curvilinear stroke and in traditional fonts too long kasida will look awful when rectangular in shape, yet very few fonts provide curvilinear ones.</p>
      <p>For bismillah it is customary to use kashida before the meem, but unless that meem is extended horizontally (unlike most fonts) it will look bad, and I'd not do that my self. Some fonts might include the bismillah ligature ﷽ (U+FDFD) and if present can be a better choice.</p>
      <p>As for swashes, some fonts have them with 'swsh' feature, but they are too fancy and shouldn't be used for regular text.</p>
