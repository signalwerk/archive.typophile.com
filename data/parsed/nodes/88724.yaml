      <p>There rules are rather aesthetic, and differ slightly from calligraphy master to another, and some styles are more generous in applying tatweel while it is completely prohibited in Ruq‘a for example.</p>
      <p>This article on <a class="freelinking external" href="http://www.tug.org/TUGboat/tb27-2/tb87benatia.pdf" rel="nofollow">Arabic text justification</a> gives a great insight on kashida rules, with detailed rules for Naskh style. There are also the rules used by (some?) <a class="freelinking external" href="http://www.microsoft.com/middleeast/msdn/JustifyingText-CSS.aspx" rel="nofollow">Microsoft applications</a>, though they are simplistic and thus can result in wrong kashidas and the last rule is really bogus.</p>
