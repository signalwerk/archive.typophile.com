    <p>I am working with Illustrator and InDesign ME. Coming from a latin perspective, I want to adjust the "kerning" between characters by extending the line or juncture between letterforms. I see this all the time with Arabic text, but I'm not sure if it is a special font that allows it, or if perhaps there is a glyph in each Arabic font that allows me to extend the line. </p>
    <p>So for example, the bismillah normally begins:<br>
    بسم<br>
    but I would like to extend the line between the "ba" and "sin".<br>
    ب--سم</p>
    <p>I don't see that in the character set. I am using KFGQPC Uthman Taha Naskh. I realize I won't be able to compete with a calligrapher, but I'm trying to replicate what I'm seeing elsewhere.</p>
