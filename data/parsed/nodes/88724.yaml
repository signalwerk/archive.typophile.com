      <p>Thanks to all for appreciating my new Naskh font. </p>
      <p>My Naskh font consists of more than 4000 Arabic glyphs. It supports only Arabic language not Persian, Urdu or any other similar language. The tatweel can be inserted at any position in any word up to three levels. So the user will have full control over the tatweel to insert how much tatweel he wants and where he wants. Tatweel works for every character and it will be the user's choice to insert tatweels where he wants, correctly or incorrectly. </p>
      <p>As far as the Tasmeem for Indesign is concerned that is a software while it is a font but I have worked hard to make it more powerful and more flexible than Tasmeem and to provide the Arabic users and publishers an easy way to use most of the possibilities of Arabic Calligraphy just by using a font like tatweel up to three levels, alternate shapes of reh and zeh in every word, alternate shapes of Alef, alternate shapes of jeem, alternate shapes for meem, alternate shapes for kaf, swashes for all possible words, alternate shapes for diacritical marks, alternate space between words etc. etc.</p>
      <p>For example the word "AR-Rehmaan" in the Basmala. In my font it has 256 or even more possible shapes along with tatweels, swashes, alternate reh and alternate alef etc. I have not counted mark placement in these 256 shapes. Similarly most of the words has several possible shapes.</p>
      <p>I hope this font will be one of its own kind, more like a software. Only some kerning work is remaining and I hope that I will complete it very soon Insha-Allah with two weights Regular and Bold.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Graphic0_6617.jpg"></div><p></p>
