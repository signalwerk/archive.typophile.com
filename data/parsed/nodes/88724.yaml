      <p>@ Finedesign, … Or just never tatweelat?</p>
      <p>So far, All typesetting tools built by M$,Adobe+WinSoft are not SMART enough to handle TATWEEL even for their own linear fonts?! They randomly+indiscriminately distribute TATWEEL beautifying some words and spoiling others. So, TATWEEL is virtually useless.</p>
      <p>So, think of building a SMART Arabic Font by:<br>
      1. Freeing it of any INSANE Kashida.<br>
      2. Killing the right side bearings of ALL Glyphs.<br>
      3. Adjusting SPACE between 222 + 277 points,<br>
      4. Spacing the left side bearings as follows:<br>
      _ for Aif + D and their likes = ½ Space Width,<br>
      _ for WAW = Zero (0)<br>
      _ for R and the likes = Between (-) ¼ + (-) ½ Space Width,then<br>
      5. VOLTing R-Kern.</p>
      <p>When typesetting, do SWM (Space Width Modulation) as follows:<br>
      1. Double the Spaces following the words that end with Aif, WAW + D and the likes,<br>
      2. Tripple the Spaces following the words that end with R and the likes&gt;</p>
      <p>That's how I build + test my fonts, as I suggested in 2006 here:<br>
      <a href="http://typophile.com/node/19348" title="http://typophile.com/node/19348">http://typophile.com/node/19348</a><br>
      And today, thanks to MaryamSoft Arabic Calligrapher + QalamBarter, I am doing Fine Designs.</p>
      <p>Good Luck with FineDesign!</p>
