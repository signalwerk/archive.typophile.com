      <p>I think that what we seek here is to get the best of what we can of aesthetic form of Arabic Calligraphy, but must take into account the technical aspects of the aesthetic for the font before you start, including:<br>
      = What methods invented by calligraphers to improve the format fonts?<br>
      = Kashidas you could put in any place, or a base?</p>
      <p>= Calligraphers invented more than one way to increase the beauty of the<br>
      font and written texts, including:<br>
      - Making different ligatures, some of which extend and some are reduced (ligature alternates).<br>
      - Making various alternates of the same character, some of which extend<br>
      and some are reduced (character alternates).<br>
      - Overlay on top of each letter and gathered together in the form of beautiful (forms).<br>
      - The invention of kashidas.  :)</p>
      <p>= Kashidas is the recent use of it is less beautiful than all of the above, as it is just a plus lengthening between the characters, but to use it must follow certain rules, including:<br>
      - May be placed kashidas between certain characters, and may not be between certain characters.<br>
      - Kashidas have specific lengths, at least not more than.<br>
      - Kashidas affected by the length, the more in length, the greater the concavity and depth.<br>
      - Kashidas often affect the preceding character in it, as well as the next character to it.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/111_4609.JPG"></div><p></p>
      <p>Zuhair, You did a good job and wonderful, and I wish to continue, but I hope to take into account the technical aspects in addition kashidas, and do not fall in the problems of software that allows everything possible in the font like KALK or TASMEEM; because the average user has no ability to choose artistic combinations correct harmonious with each other.</p>
