    <p>I’m working on a new design for a bilingual Spanish/English magazine. We’re switching to a font that includes case-sensitive forms of the opening question and exclamation marks. Since we’re trying to follow Spanish typographic standards, rather than imposing (North American) English norms, I decided to use them.</p>
    <p>My understanding is that in good, pre-digital Spanish typography it was standard to use opening marks that extend from the base-line to cap height before capitals and marks that extend from the descent to the x height before lower case letters. Failure to do this became acceptable with the advent of the typewriter and continued with electronic typesetting, where, originally, case-sensitive forms were available, if at all, in expert sets that most people didn’t have or didn’t care to use. In other words, case-sensitive forms are standard in good typography; not using them is typical of bad typography.</p>
    <p>My manager has been told that this is just not true. "Raised" opening punctuation before capitals should not be used.</p>
    <p>Can anyone confirm either of these positions? (While I have my opinion, I don’t mind being wrong. I’m just looking for clear guidance.)</p>
