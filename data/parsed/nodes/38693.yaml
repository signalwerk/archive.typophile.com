      <p>I've seen present-day Spanish-language newspapers that use raised opening questionmark/exclam with upper and lower case.</p>
      <p>Perhaps the best way to determine the norm would be to get a selection of Spanish daily papers, and see what they do.</p>
      <p>Both Georgia and Verdana have these characters raised as default (and perhaps other MS faces, I haven't checked). It's traditionally incorrect, of course, but one hell of a precedent.</p>
