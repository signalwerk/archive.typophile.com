    html: <p>Closest I can think of is Typodermic's "Mikadan". It doesn't seem to be an exact match but it's pretty darn close. How old is this sample? Mikadan is apparently based on a typeface called "Verona" from 1948, but I can't find any digital versions of that.</p>
