    html: |-
      <p>Tamas is right, and Verona was ATF's adaptation of it. It is shown in Mac McGrew's book on American Metal Typefaces, and it is identical to the type in this sample. Interestingly, he says Bologna was itself a slightly modified version of an older ATF typeface called Humanistic, from 1904, which is also shown in the book.</p>
      <p>However, Mikadan is the only Bologna/Verona digitizaton I know.</p>
      <p>- Mike Yanega</p>
