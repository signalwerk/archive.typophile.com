  html: <p>G'day, <br> <br>I have just been employed as a  <br>graphic designer/signwriter at <br>a place called "Signz 'n Graphix". <br>It seems that I have some at a  <br>fortunate time, as we have decided  <br>to totally redesign, starting from  <br>our internal processes to applied <br>identity. At the moment we design, <br>print (digital xerox and riso), vinyl <br>and photographic signage, large <br>format quality art reproductions. <br>We want to keep it simple and  <br>apply the branding to business <br>cards to outdoor signage. I have <br>chosen Thesis Sans as the main <br>typeface as it appears to work very <br>well from large to small. I am thinking <br>of a pallette of yellow+black, a homage <br>to nz's road signs and blatant visiblity. <br>At the moment the building is a purple <br>colour and promoted as "the purple <br>place". I think it is quite tired (15 years) <br>and dated, as the road signage is pretty <br>much invisible from a distance and  <br>a new building next door blocks the view <br>of our premises from the road. <br> <br>The bottom image shows our current <br>street sign from 50m down the road. <br>I am trying to get the name spelt  <br>'correctly' - signs &amp; graphics instead <br>of signz n' graphix, which is a pain <br>to spell and looks amateurish. <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/42915.gif" alt=""> <br> <br><img src="http://www.typophile.com/forums/messages/29/42916.gif" alt=""></p>
  html_clean: <p>G'day, <br> <br>I have just been employed as a  <br>graphic designer/signwriter at <br>a place called "Signz 'n Graphix". <br>It seems that I have some at a  <br>fortunate time, as we have decided  <br>to totally redesign, starting from  <br>our internal processes to applied <br>identity. At the moment we design, <br>print (digital xerox and riso), vinyl <br>and photographic signage, large <br>format quality art reproductions. <br>We want to keep it simple and  <br>apply the branding to business <br>cards to outdoor signage. I have <br>chosen Thesis Sans as the main <br>typeface as it appears to work very <br>well from large to small. I am thinking <br>of a pallette of yellow+black, a homage <br>to nz's road signs and blatant visiblity. <br>At the moment the building is a purple <br>colour and promoted as "the purple <br>place". I think it is quite tired (15 years) <br>and dated, as the road signage is pretty <br>much invisible from a distance and  <br>a new building next door blocks the view <br>of our premises from the road. <br> <br>The bottom image shows our current <br>street sign from 50m down the road. <br>I am trying to get the name spelt  <br>'correctly' - signs &amp; graphics instead <br>of signz n' graphix, which is a pain <br>to spell and looks amateurish. <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/42915.gif" alt=""> <br> <br><img src="http://www.typophile.com/forums/messages/29/42916.gif" alt=""></p>
