      <p>&gt; “Why ?”<br>
      <em>Not the best analogy, but it’d be like the union hiring a scab.</em></p>
      <p>That was exactly my impression. A turf war.</p>
      <p><em>Would hundreds of accountants (in the hope of being paid) submit completed tax forms for a tax-doing contest? No.</em></p>
      <p>So why do designers?</p>
      <p>This is a bit of an apple to oranges comparison. 10 accountants will produce 10 identical tax returns, while 10 logo designers will produce 10 different concepts. Any work that involves an element of creativity carries a risk that the deliverable will not be what the client wanted. For <em>some</em> clients this is unacceptable (for $ or for timing reasons) and so the spec work presents a viable alternative. </p>
      <p>Why would designers be willing to do their work for free ? Because it's a good exercise, because they really need money, because spec contests provide very low barrier of entry to the professional market. Just few reasons from the top of my head. I flipped through 99designs pages some time ago, and they had entries that were head and shoulders above non-spec sketches that are being posted here now and then. Professional and spot on matching the brief. So seeing the request for a critique denied and a person being (effectively) talked down because he mentioned it was for a spec contest is, frankly, off-putting. The only thing this sort of commentary achieves is it alienates the person asking for help. I really really doubt that it will cause him to withdraw his contest entry and stop participating in any future contests.</p>
