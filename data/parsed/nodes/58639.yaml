      <p>This is a very interesting topic for me, since I too find the ease of participating in sites like crowdSPRING alluring. The arguments offered in this thread against contests and "crowdsourcing" don't support the categorical conclusions that it's always harmful. For instance, it's mentioned that "on Crowdspring, you have a less than 2% chance of getting paid for your work." I can't imagine how you arrive at a probability like this, since the designs aren't picked randomly. It's also not like the clients don't provide input on crowdSOURCE: they rate the entries, comment on them and ask for specific improvements. I doubt describing it as 'spec work' is even accurate. Perhaps only if you submit your work at the last moment.</p>
      <p>Regarding guesswork: even if you're working with a "real" client, you can't read their mind, they might not even know what they want, and so on. You will always be guessing to some extent. It could be called "design malpractice" if all you were doing was shooting in the dark, but contests or crowdSPRING projects usually do provide requirements and some context to go on. It's a clear exaggeration to describe it as simply guessing.</p>
      <p>I do think that there are other better reasons against contests and crowdsourcing, but it's certainly not a black-and-white picture as some here present it.</p>
