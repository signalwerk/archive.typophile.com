      <p>I wholeheartedly agree with jarrod and aluminum. The sole purpose of my comment here is to ask you to withdraw your submission.</p>
      <p>Design contests undermine the entire design profession. Companies that sponsor these contests are taking advantage of designers and disrespecting the amount of time, education, and expense it takes to produce quality design work.</p>
      <p>The more designers that fall for this unscrupulous tactic to get them to work for free, the worse it is for all of us. On Crowdspring, you have a less than 2% chance of getting paid for your work. Please think about the viability of a career in design if all graphic designers worked for free?! We'd all be homeless - and still working 18 hour days!</p>
      <p>Please don't go over to the dark side.</p>
      <p>Please read about it in depth at:<br>
