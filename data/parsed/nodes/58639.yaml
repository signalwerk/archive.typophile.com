      <p>I wouldn't enter a graphic design contest. It's just some a-hole marketing director's way of stealing creative work. Fine art contests aren't as bad. A still life isn't going to be very valuable to a company trying to sell things. I don't do spec work for freelance. I have done it for my agency, but they can usually sell it. </p>
      <p><cite>Here’s what they do: They offer all the applicants a spec job, and then they toss out all the resumes of the designers who actually do the spec job.<cite></cite></cite></p>
      <p>I could see them doing this for a senior designer position, but it seems a bit overboard for an entry-level position. Entry-level designers aren't going to be in professional situations that would require them to make those kinds of decisions anyway. People coming right out of school are going to be overcompensating with extra enthusiasm and drive, especially if they think it will make or break their chances of landing a great job. I can't imagine any entry level candidate refusing to take part in some kind of design test during the interview process of a firm or agency they aspire to work for. By throwing all of those resumes out they could be missing out on some real talent and potential.</p>
