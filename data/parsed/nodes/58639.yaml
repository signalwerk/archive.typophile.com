      <p>Epsilicon, I gather from your comments that you didn't read the links provided here that examine this topic in depth? Is there any way I can persuade you to read further, or have you made up your mind that it's a "turf war"? (Which, by the way, couldn't be further from the truth.)</p>
      <p>Oh, and...</p>
      <p>Ten accountants will definitely produce ten VERY different tax returns! </p>
      <p>Spec work is not, nor ever has been, a way to earn money if a designer "really needs money". The chance is EXTREMELY high that your work will be stolen, replicated and/or built upon by the CEO's assistant or intern, however.</p>
      <p><em>I flipped through 99designs pages some time ago, and they had entries that were head and shoulders above non-spec sketches that are being posted here now and then. Professional and spot on matching the brief.</em></p>
      <p>The work produced by spec designers is not identifiable by the aesthetic or technical quality of the design entries themselves. And anyone who knows how to type can request a critique on Typophile, so I'm not quite sure how you justify this comparison. </p>
      <p><em>Any work that involves an element of creativity carries a risk that the deliverable will not be what the client wanted.</em></p>
      <p>Exactly. This is what separates a skilled, professional designer from the rest of the crowd. <strong>It's precisely the job of a designer to visually communicate EXACTLY what the client wants; that is the essence of good design,</strong> and it's not complete until the design is EXACTLY what the client wants to communicate. This relationship is missing in a spec or contest assignment, and there's no doubt that it cripples the design process. </p>
      <p>Creating effective design is not synonymous with creating beautiful graphics. Not even close. Design is not artistic expression, it's problem solving. In a design contest, designers are throwing logos against a wall hoping one sticks. </p>
      <p>In a professional relationship, a designer identifies trends, researches competition, gets to know the company history, develops a profile of the target market, and then applies all this knowledge to create a design that becomes the voice and face of the company.</p>
