    <p>I'm posting this now cos i just made the deadline for entries. Maybe it would have been a better idea to post it earlier so that any of you reading this could also participate in the competition (if you wanted to). </p>
    <p>But oh well, it's too late to do anything about that. </p>
    <p>I at least thought it post my submission. What do you think? I kinda feel that the style of it doesn't really suit Goal.com, but i had this idea in my head and I wanted to complete that vision. Also it's kinda rushed because I'm currently hard at work on an essay for school which I probably should be working on instead of writing this!</p>
    <p>Any criticisms on what could be better would be much appreciated, for future reference. It's not really that complex but being a newbie it was pretty hard for me to get the G right.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Omar-Ajmal_goal-logo_final_4584.jpg"></div><p></p>
    <p>And I thought it would be nice to post my favourite of all the submissions that I've seen.<br>
