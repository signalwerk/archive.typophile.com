      <p>Nobody who's a career designer/art director will a) take you seriously or b) want anything to do with designers who participate in devaluing the whole profession by participating in contests. </p>
      <p>....in short, because of all the reasons already posted in this thread about why contests undermine the whole design profession. All the reasons are here: <a href="http://www.no-spec.com" title="www.no-spec.com">www.no-spec.com</a></p>
      <p>I learned this the hard way. There was this job I really wanted, so I submitted my portfolio and resume. They replied by asking me to do a spec job. I was young...so I eagerly began working on the project. I submitted the design work under deadline and waited for a reply. </p>
      <p>Silence. </p>
      <p>I kept pestering them. </p>
      <p>Silence.</p>
      <p>Eventually I get a "no thanks" letter in the mail. Two months go by, and I'm at a holiday party with a friend. There's this 40-something woman telling a story about how they vet candidates to find out if they've got the confidence and experience to "make the cut." </p>
      <p>Here's what they do: They offer all the applicants a spec job, and then they toss out all the resumes of the designers who actually do the spec job.</p>
      <p>Yes, it's kinda mean. But I really get why it separates the confident, self-respecting designers from the wannabes. Think about it. Would ANY other professional accept this kind of offer? Would hundreds of accountants (in the hope of being paid) submit completed tax forms for a tax-doing contest? No.</p>
      <p>So why do designers?</p>
