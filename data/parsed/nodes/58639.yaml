      <p><cite>.. I have a bit of a crunch at work, so it may take me few days to type my thoughts on the subject ..</cite></p>
      <p>I have not forgotten about this thread, but I still severely lack time to write a comprehensive response. </p>
      <p>What I was going to ask though was simple. How come AIGA does not advice against using BrandStack (aka IncSpring) ? </p>
      <p>As far as a well-being of the clients goes, the practice of conjuring brands out of thin air is no less "damaging" than letting them pick through a pile of (alleged) spec dung in a search of a pearl that matches their vision of branding. From the client's perspective it is exactly the same situation - they have a brand in mind and they go searching for its implementation, successfully or not.</p>
      <p>Point being is that AIGA's concerns about spec work being damaging <em>to the clients</em> looks very much artificial, borderline hypocritical to me. If they really do mean it, they should've condoned prepackaged brand sales with even more vigor. </p>
      <p>If you take this specific concern out of the picture, what effectively remains is a concern for the damage that cheap competing labor causes to the established professional community. It is perfectly reasonable and there is absolutely nothing wrong with it. But "the spec work is hurting unsuspecting clients" is not a valid argument. Clients get what they want. For some it's Walmart, for some it's Nordstrom.</p>
