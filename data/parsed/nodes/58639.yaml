      <p>First to be fair I'll comment on the logo. The letters are spaced much too close, at smaller sizes they will morph together. The soccer ball seems just stuck on and not really incorporated into the design. My first thought is too suggest that the ball become the dot of dot com but that is probably trite. Soft marshmallow letter forms aren't my cup of tea but they seem to work in this design. I would however like to see some font alternatives for the tag line, I think there can be a better pairing.</p>
      <p>And now to the contest situation. This hit home for me as I'm currently wrestling with this myself. A friend asked if I would submit pieces to a local design contest. At first I said I would and was excited about the project. I knew the prize would not be equal compensation for the work, but the majority of my portfolio is of a niche subject and so I welcomed the opportunity to show some additional facets. I looked at it more as a volunteer project and was ok with that. That is until I re-read the rules and there it was..."All submissions and rights to their use become the property of the SO-and-so Association." So the winner gets a mediocre prize and the losers get nothing AND loose the rights to their designs? I like what I created and where I looked into the history of the organization, their goals and other criteria, the illustrative aspect of the design could have other uses (it's a local landmark) Why would they even want the losing designs? I don't think my friend is trying to cheat artists, probably just went online and copied someone else's form. If it was an online contest I just wouldn't submit but now I have to find a way to tactfully decline.</p>
      <p>I don't think this article was mentioned earlier: <a class="freelinking external" href="http://www.fastcompany.com/node/641740" rel="nofollow">http://www.fastcompany.com/node/641740</a><br>
      I found it helpful.</p>
