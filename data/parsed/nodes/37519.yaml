    html: <p>a lot of South African and australian magazines have a real flair to them. VISI a homes magazine is nice. Real simple is clean very simple. Vogue entertaining is impracticle and beautiful, but more photographic. Wallpaper is good, living etc but now slightly past its best and elle decor uk or south african. Donnay Hay again food, my thing and anothermagazine is delightful to look through. Just look first, see if you like and buy. I bought eye the other day and was bitterly disappointed with the latest mag.</p>
