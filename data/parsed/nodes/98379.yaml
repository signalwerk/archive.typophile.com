    html: |-
      <p>The solution to modular fonts is simple: Don't make them modular. You can limit yourself to so many pieces, but still, for a good result, small changes, optical or not, always have to be made.</p>
      <p>Of course it's easier with a display type such as used here, but I agree that the smoothness is a bit lacking. </p>
      <p>Reading text is simple because of repetition, but that doesn't mean you can't tweak repetition, this is what brings character to your type. Of course it's a very good way to start, with Fontstruct being a very nice stepping tool for a quick experiment before trying it out for real.</p>
      <p>The thing I like about a modular typeface is the creative solutions (at least often enough) within the limited possibilities. Since they quite often play with the relations of the letters within the alphabet to each other instead of just being a copy of what (for instance) the basic latin alphabet is.</p>
