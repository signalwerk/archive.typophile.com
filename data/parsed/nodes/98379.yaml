    date: 2012-11-25T17:55:00
    date_raw: 25 Nov 2012 — 5:55pm
    votes: null
    html: <p>I believe, the trick to making a good modular font is making it immodular. During, or after you've assembled your segments, run tests &amp; make notes. If something looks wrong or feels uncomfortable, it's wrong. Go back an tap those arrow keys until it feels right. Use the force. No measuring allowed. These small adjustments, will in turn make other glyphs look uncomfortable. Spacing should rarely be modular. For example, there's no formula for spacing an L or T. It's likely that the best sidebearings won't land on grid lines. Through repeated testing, note taking and arrow key bopping, your modular font will look balanced and it'll have less of that amateur font appearance everyone probably would prefer to avoid.</p>
    html_clean: <p>I believe, the trick to making a good modular font is making it immodular. During, or after you've assembled your segments, run tests &amp; make notes. If something looks wrong or feels uncomfortable, it's wrong. Go back an tap those arrow keys until it feels right. Use the force. No measuring allowed. These small adjustments, will in turn make other glyphs look uncomfortable. Spacing should rarely be modular. For example, there's no formula for spacing an L or T. It's likely that the best sidebearings won't land on grid lines. Through repeated testing, note taking and arrow key bopping, your modular font will look balanced and it'll have less of that amateur font appearance everyone probably would prefer to avoid.</p>
