    <p>I've seen a lot of rubbish out there about font stacks for web use, so I wanted to see if we could come up with some better ones. It's a matter up for much debate, but I'd like to see what we can come up with.</p>
    <p>Here is my contribution. Feel free to rip it to shreds, and add/delete. Apologies in advance to Linux users.</p>
    <p> "Humanist Sans":<br>
    <code>font-family: "Gill Sans", "Gill Sans MT", "Gill Sans Std", GoudySans, "ITC Goudy Sans Std", "Myriad Pro", "Myriad Web", "Myriad Std", "Bitstream Vera Sans", Verdana, sans-serif;</code></p>
    <p>"Oldstyle":<br>
    <code>font-family: "Adobe Jenson Pro", "Hoefler Text", "Centaur", "Centaur MT", "Garamond Premier Pro", "Stempel Garamond", "Adobe Garamond Pro", "Adobe Garamond",  Garamond, Georgia, serif;</code></p>
    <p>"Geometric Sans": &lt;&lt;- My worst one. Needs help.<br>
    <code>font-family: "Futura", "Century Gothic, "Tw Cen MT", "Gill Sans", "Gill Sans MT", "Gill Sans Std", "URW Gothic L", sans-serif;</code></p>
