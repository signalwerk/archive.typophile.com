    html: |-
      <p>@georgebutler The w.3point7designs article is indeed interesting. It actually helped me justifying my use of Gill Sans in a recent project. The big issue is that some people cannot let go of the fact that many people are going to see different designs, regardless of the designers intent. That's just the way of the web.</p>
      <p>The WORST font stack article was the most recent Sitepoint.com article <a href="http://www.sitepoint.com/article/eight-definitive-font-stacks/" title="http://www.sitepoint.com/article/eight-definitive-font-stacks/">http://www.sitepoint.com/article/eight-definitive-font-stacks/</a></p>
      <p>I felt a lot of bile in my throat as I read that, and it is what has spurred me on to create better, more typographically informed font stacks.</p>
      <p>@litherland<br>
      I don't recall ever seeing that chart. Very nice!</p>
