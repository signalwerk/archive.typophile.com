    <p>1. Information such as the country: USA<br>
    2. Age of the sample 1948<br>
    3. A pdf scan of the user manual can be found at <a href="http://www.kirby.com/consumer-relations/product-manuals/" title="http://www.kirby.com/consumer-relations/product-manuals/">http://www.kirby.com/consumer-relations/product-manuals/</a>  and look for model 508 at the bottom of the page.<br>
    4. I am trying to reproduce the old manual and would like to know the fonts used so I can re-create the manual to be as close to the original one as possible.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/508_Font_Test_6385.jpg"></div><p></p>
