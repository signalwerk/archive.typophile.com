      <p>I think, depending on the proportions of the bottle and box, you might need to develop a stacked version. I preferred the g in the first version as a starting point, the top storey could be smaller while the lower increases in height; I don’t find the w particularly wide but I think you can amend the central stroke by rotating it clockwise to close slightly the righthand opening and, more importantly, open up the lefthand; the strapline is rather small in proportion and seems to have no reason for its position,  currently slightly too low and hanging out to the right.</p>
      <p>Tim</p>
