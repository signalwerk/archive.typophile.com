      <p>OK, here are some revisions I have made. This logotype would be for an entire campaign to include a bottle, box, print collateral etc.</p>
      <p>I have thinned the strokes and made it a little more condensed by reducing the ’k’ and ’w’.<br>
      The ’g’ has been updated to simple include a circular descender. </p>
      <p>I am in two minds about the use of Tarzana for the ’truly natural bodycare’ tagline. I understand Mike’s comments about competition between the logotype and the tag. I have tried setting it in Helvetica and of course, it looks so neutral that it could not be obtrusive. For the purpose of this critique I have left it set in Tarzana as I feel I would prefer to use something that represented the overall identity and message more.</p>
      <p>Let me know what you think.</p>
      <p>Thanks,<br>
      Jay</p>
