      <p>Most curved characters (doesn’t apply to your g as the top right already deals with it) are slightly above and below the x-height and baseline of other characters to compensate for the visual lack of height, probably easier to understand by comparing the characters of an existing typeface, most obvious at the base of the o, but I would add some to the top as well. The comment about the letterspace and word spaces was mostly directed at the strapline although the word space in kiwi glow is a touch wide for the tight kerning, in my opinion.</p>
