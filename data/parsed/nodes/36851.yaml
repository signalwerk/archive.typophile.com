      <p>Hi again :</p>
      <p>I’m not sure what you call it but when certain curves are not antialiased or hinted they look really rough.<br>
      I think but I’m not sure- the k would look better if the angle of the right part of the k was a little more ’open’. This would also mean that the w have to be more compact as well. This is a good thing because it will give the descender on the k more room with the i.</p>
      <p>But there is something else that concerns me... The logo is geometric and extended and so is the “truly natural body care”. I think you should have the logo extended and text normal or condensed. The logo should be funky and the text a neutral sans. I think it would aid in better presentation of what the product does. Right now you might have two things competing with each other.</p>
      <p>Will this be for a bottle, box, or the whole entire campaign?</p>
      <p>All my best,</p>
      <p>Mike Diaz :-)</p>
