      <p>I would ditch the swoosh jumping off from the bottom of the ’k’.  That’s way too much.</p>
      <p>Overall, the letterforms just don’t harmonize very well together.  In a wordmark, either all the letters need to be equal in character or there should be one letter that’s carrying the quirks, with the others supporting it.  You’ve got the ’g’ and the ’w’, and in some sense the ’k’ all fighting with each other for attention, while the ’i’ and ’o’ are bit players.  </p>
      <p>Look at the whole wordmark small as well. The connection between the top and bottom of the ’g’ is almost insignificant and may disappear.  The ’g’ form has potential, but needs some work. Try making the bottom smaller than the top.</p>
    html_clean: |-
