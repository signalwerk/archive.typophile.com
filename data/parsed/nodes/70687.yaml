    <p>Perhaps you could suggest a font for hexadecimal numbers in small sizes (5pt or smaller) in character charts:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/chart-1_6145.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/chart-2_3789.png"></div><p></p>
    <p>The large glyph above each number will be typeset in Bodoni, so the font used for the numbers should match. The examples above show a version of Johnston's font for London Transport, but the narrow ones and wide letters make some numbers look rather strange, and the opening in the four is too small to work at 5pt or smaller. Carrosserie seems a bit more promising, but it is marketed as a display face, so it may not work well at small sizes. I was thinking of something vaguely Art Deco-like, but what really matters is that it is legible at small sizes and that the pairs 8/B and 0/D are clearly distinct.</p>
    <p>The problem of finding a font for hexadecimal numbers is related to an old proposal of encoding the letters A–F separately for use as hexadecimal digits:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hex-letters_4419.png"></div><p></p>
    <p>I do not see it as a requirement that the letters and the decimal digits all have the same width, though.</p>
