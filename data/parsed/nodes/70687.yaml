      <p>I had a similar need for typesetting <a class="freelinking external" href="http://oreilly.com/catalog/9780596514471/" rel="nofollow">"CJKV Information Processing," Second Edition</a> a couple of years ago, and used a custom version of Minion Pro and Myriad Pro that included tabular versions of some characters, such as "A" through "F" (for hexadecimal digits), "U" and "+" (for Unicode Scalar Values, such as "U+4E00"), and lowercase "x" (for hexadecimal digits, when prefixed with "0x"). I needed this because I used hexadecimal digits and Unicode Scalar Values throughout the book, and for the first edition I settled for Courier to get the tabular effect. Note that making the uppercase letters tabular involved not only their shapes in terms of their widths, but also their heights, to match the height of the digits. My colleague, Miguel Sousa, performed the modification. The glyphs were accessed via the 'ss03' GSUB feature, and I set up InDesign tags that invoked it, along with the 'zero' GSUB feature.</p>
      <p><a class="freelinking external" href="http://lundestudio.com/CJKV2E/cjkv2e-p198-t43.png" rel="nofollow">Table 4-3 on Page 198</a> of the book is a good example of these glyphs in use.</p>
    html_clean: |-
