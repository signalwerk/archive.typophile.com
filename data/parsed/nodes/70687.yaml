      <p>Thanks for all your ideas and suggestions!</p>
      <p>To answer some of the questions that have been raised either implicitly or explicitly, I am primarily looking for a font that works well in print at a small size, on-screen performance being less of a concern. Tabular width is not really important at all, but hexadecimal numbers tend to look funny if (some of) the letters are much wider than the digits (or, as Lunde pointed out, if they are of different height).</p>
      <p>Some further thoughts:</p>
      <p>Helvetica and more or less similar fonts have been suggested, but Helvetica has some characteristics which ITC Bodoni 72 does not share. In particular, the lower-left corner of the digit 2 in Helvetica has a characteristic shape quite unlike Bodoni’s angular shape. Univers, Monotype Grotesque (condensed) and Akzidenz Grotesk (not condensed) are better matches from that point of view, but all have quite closed 6s and 9s that could potentially look like 8s at small sizes.</p>
      <p>Many sans serif fonts seem to have digits and capital letters of approximately the same width in their condensed versions, although this is often not the case for their regular versions, as is the case for Monotype Grotesque (whose condensed also equalises letter/digit heights):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/grotesque-1_4403.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/grotesque-2_6111.png"></div><p></p>
      <p>A different sans-serif option is to use a variation on the DIN fonts:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/din_3704.png"></div><p></p>
      <p>The completely different idea of using ITC Bodoni 6 is intriguing, and one that I would like to try, but that would probably require some redesign given that the letters are rather wide compared to the decimal digits. The small capitals do not quite match the x-height of the old-style numerals either.</p>
      <p>Serifs help to make the B and D distinctive, but a plain design is required if the numbers are to appear more or less as part of the grid, thus allowing the large glyphs to stand out, which leads one to think of Egyptians (perhaps better known as slab serifs in some parts of the world). As it turns out, there actually exists a Bodoni-based Egyptian called Bodoni Egyptian which looks like it might work:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bodoni-egyptienne_6600.png"></div><p></p>
