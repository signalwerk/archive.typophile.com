  html: |-
    <p>After designing and setting <a href="http://typophile.com/node/27817" target="_blank" rel="nofollow">Alice's Adventures in Wonderland</a> as an experiment, I would now like to start a second book project. I am looking for a new challenge -- something with different requirements from <em>Alice</em>.</p>
    <p>You are invited to help me choose a the text for the project. This text should be in the public domain and of a reasonable length -- the complete works of Shakespeare or the Bible would, therefore, not be appropriate suggestions. I will consider works for which illustrations in the public domain are available if the illustrations have a different function from the one's in <em>Alice</em>, e.g., if they are an integral part of the text.</p>
  html_clean: |-
