      <p>Thanks a lot for the suggestions -- they're all very welcome.</p>
      <p>I think perhaps <em>Gulliver's Travels</em> wouldn't be different enough in the sense that it's also a romance for about the same demographic (originally, anyway). Poetry might be an interesting challenge; if anyone has other suggestions to make, now is the time. Beowulf and Chaucer are <em>way</em> out of my league, though.</p>
      <p>As for the story you've started to write, make it 25,000 words long and I'll consider it.</p>
