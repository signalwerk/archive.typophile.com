    html: |-
      <p>Poetry would be a different kind of challenge, you could look at Beowulf or a bit of Chaucer if you wanted to make things really tricky.<br>
      Ða wæs on burgum Beowulf Scyldinga,<br>
      leof leodcyning, longe þrage<br>
      folcum gefræge (fæder ellor hwearf,<br>
      aldor of earde), oþþæt him eft onwoc<br>
      heah Healfdene; heold þenden lifde,<br>
      gamol ond guðreouw, glæde Scyldingas. </p>
      <p>Thus swyved was this carpenter’s wyf,<br>
      For al his kepyng and his jalousye;<br>
      And Absolon hath kist hir nether ye;<br>
      And Nicholas is scalded in the towte.<br>
      This tale is doon, and God save al the rowte!</p>
      <p>Tim</p>
