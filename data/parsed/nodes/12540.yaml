    <p>Hi All,</p>
    <p>The Cacharel Logo has probably been created for the Label. But does anyone know a Typeface which comes close to it? We already checked the Bodoni Poster but it feels to heavy and masculine, specially on the endings.</p>
    <p>Bests/<br>
    Philippe</p>
