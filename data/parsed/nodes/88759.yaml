    html: |-
      <p>Even after reading your post, I initially read m-i-n-j. Without the provided info, it could just be read as m-i-j. Separating the 'm' from the 'n' will most certainly help this concept if you intend to continue with it.<br>
      Do be aware that in the UK, reading as minj could give the design certain distracting connotations. The word 'minge' over here is a slang word for (how do I put this tastefully?) a ladies special place.</p>
      <p>That aside, I'm definitely more drawn to the first one. The curves and circular tittle make it much more approachable.<br>
      As you're simulating a real brief, it might be best to delve a little deeper into what Ming is all about. What style of artwork does he/she produce? Is it a graphic style or more of a fine art style? The more you know about the client, the more you can suit the design to them.</p>
