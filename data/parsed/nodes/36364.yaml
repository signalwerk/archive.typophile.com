    <p>I'm doing a sketch for the new flat cut-out aluminum sign design for Frischhertz Electric. They want the sign to display their new logo but...the only artwork they provided me with is a business card, and a scan of a t-shirt. No vectors, no .ttf file/name of typeface used in the logo (big shock, right?). </p>
    <p>Anyway, I've never seen this typeface before and I've searched for hours on the web and- no luck.</p>
    <p>please help me out here, guys!  Someone here knows... :o </p>
    <p>Here are the bitmaps from the scanned t-shirt and the scanned business card:</p>
    <p><a class="freelinking external" href="http://i39.photobucket.com/albums/e197/omgwtfpixplz/Work/FRISCHHERTZ_scan1BW_sized.jpg" rel="nofollow">B&amp;W logo</a></p>
    <p><a class="freelinking external" href="http://i39.photobucket.com/albums/e197/omgwtfpixplz/Work/FRISCH_SCANcolor1.jpg" rel="nofollow">color logo</a></p>
    <p>This is their website address: <a href="http://www.frischhertz.com/" title="http://www.frischhertz.com/">http://www.frischhertz.com/</a></p>
    <p>thanks,<br>
    Amanda</p>
    <p>Send suggestions/files to:<br>
    <a href="mailto:cellardoor504@gmail.com">cellardoor504@gmail.com</a> OR <a href="mailto:pr3ciousroy@mac.com">pr3ciousroy@mac.com</a></p>
