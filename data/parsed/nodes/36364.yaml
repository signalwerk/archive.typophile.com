      <p>If you want another opnion, I agree with Jan -- this looks like it is hand-drawn. The 's' seems too large, and the h's seem not to be exactly identical. The 'r' is an odd style, and I found very few scripts with a printed-but-connected letterform such as this. The original version of Signal had a similar 'r' (shown in the Jaspert 'Encyclopaedia of Type Faces'), but the Berthold digital version of <a href="http://www.myfonts.com/fonts/berthold/signal-bq/" rel="nofollow">Signal</a> does not. In fact, the only script I could find with this sort of 'r' is <a href="http://www.myfonts.com/fonts/linotype/roman-script/" rel="nofollow">Roman Script</a>, and it is a vertical script, with no other resemblance to this sample.</p>
      <p>The 'F' is not like any other script F I can recall.</p>
      <p>The two most similar fonts I found to the look of this sample, and it's just my viewpoint, are Mandate (a.k.a. <a>Freehand 521</a>) and <a href="http://www.myfonts.com/fonts/linotype/monoline-script/" rel="nofollow">Monoline Script</a>.</p>
      <p>- Mike Yanega</p>
