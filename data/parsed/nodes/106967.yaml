    html: |-
      <p>Yes, you should try the font check on the PDF recommended by Ryuk.<br>
      If you are lucky you will get a list of fonts, or font subsets used in the PDF.<br>
      If you get a blank or just a list of common fonts that you know do not match your image, this means that it is not used as a font in the PDF. The PDF might use vector outlines, which you can examine in detail if you use a program like Adobe Illustrator, or images such as jpegs. You can determine if your PDF uses images by increasing the scale. If the quality becomes fuzzy, it uses images. If you can scale without loss of quality, the PDF uses fonts or vector outlines.<br>
      If this is too technical we can try another approach:<br>
      ......Is the PDF on the web? and<br>
      ......Do you have a URL that you can post?<br>
      Don</p>
