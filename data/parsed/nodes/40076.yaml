    <p>Hi guys, I was wondering if anyone had any suggestions for a type to go with a logo design.</p>
    <p>The company is called Setfire Media, they are a web development company, who mainly create and maintain e-commerce sites. They are expanding rapidly and need to recruit both better clients and better staff. The main things they want the logo type to suggest are intelligence as well as a forward-looking attitude, without being boring. Any suggestions for type that would suit this?</p>
    <p>Btw, I know this is fairly vague, but any ideas would be of use I’m sure. </p>
    <p>Cheers,</p>
    <p>Sam</p>
