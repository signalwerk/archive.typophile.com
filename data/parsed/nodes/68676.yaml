    <p><a href="http://www.typesociety.org/" rel="nofollow">The Society of Typographic Aficionados</a> (SOTA) is pleased to announce a new award for young people who have created original work in type design, type history, or other areas related to typography. The award recognizes a person 30 years of age or younger who shows both achievement and future promise in the field of typography. The recipient will attend <a href="http://www.typecon.com/" rel="nofollow">TypeCon2010</a> in Los Angeles and will give a presentation during the conference program.</p>
    <p>The SOTA board of directors hopes that this introduction to a large cross-section of the typographic community will serve as a catalyst in advancing the career of the recipient.</p>
    <p>The award includes main conference and education forum registration fees plus reimbursement of up to $1500 USD for coach travel to/from Los Angeles and standard lodging in the conference hotel while attending TypeCon. Attending TypeCon2010 and giving a presentation are required to receive the award.</p>
    <p><strong>Submission Deadline</strong><br>
    April 30, 2010</p>
    <p><strong>Notification of Award</strong><br>
    May 12, 2010</p>
    <p><strong>Judging</strong><br>
    Entries will be reviewed by a committee of SOTA board members.</p>
    <p><strong>Requirements</strong><br>
    Recipient must have been born in 1980 or later, and must attend TypeCon2010 in Los Angeles and give a 20-minute presentation during the main conference.</p>
    <p>The following materials must be emailed to <a href="mailto:catalyst@typesociety.org" rel="nofollow">catalyst@typesociety.org</a> by the submission deadline:<strong><br>
    </strong>1. A PDF file (may be multiple pages) detailing a specific project or group of related work to be the topic of your presentation<br>
    2. A brief description of the presentation with title (100 words or less)<br>
    3. A letter explaining your involvement in typography (300 words or less)<br>
    4. Optional online links to additional work or background information</p>
    <p>Please place all submission files into a folder and compress into a single archive marked with your name. If your submission is larger than 12 MB, please provide a URL for downloading materials. Use the following as the subject line of your email: 2010 SOTA Catalyst (Your First and Last Name).</p>
    <p><strong>Contact Information</strong><br>
    Include your name, date of birth, physical address, organization or university affiliation if applicable, email address, web URL, and phone number with area code. Applicants from outside the U.S. or Canada should include their country dialing code as well.</p>
