    html: <p>That's quite clearly a beautiful, but custom, design. There are quite a few elaborately ornamented blackletter faces (which look nothing like this one) - google for ornamented blackletter.  Incidentally, the newspaper name is called the Nameplate. The masthead is the list, usually, inside, of the newspaper's owners, publishers, editors, and principal staff members.     - Herb</p>
