  html: |-
    <p>Hello,</p>
    <p>I was wondering if anyone could help us out on i.d'ing the masthead, blackletter-type font of this publication. I have no further information on the font, designers etc. Any help or close matches to this font would be greatly appreciated. I am a student who wants to use something similar in a project. (I am especially fond of the capitals, namely, the lovely 'P').</p>
    <p>Many Thanks,</p>
    <p>Faron G</p>
