    html: |-
      <p>Kristina, it's not likely that you'll find an unaltered font with that j and angled t (Univers and Arial, for instance, have an angled t, but in the opposite direction). </p>
      <p>In addition to Ryuk's very good suggestions, here are a few more fonts that might get you closer:</p>
      <p>Tablet Gothic Wide:<br>
      <a href="http://www.myfonts.com/fonts/type-together/tablet-gothic/wide-extra-bold/" title="http://www.myfonts.com/fonts/type-together/tablet-gothic/wide-extra-bold/">http://www.myfonts.com/fonts/type-together/tablet-gothic/wide-extra-bold/</a></p>
      <p>Corporate S Extra Bold:<br>
      <a href="http://www.myfonts.com/fonts/urw/corporate-s/extra-bold/" title="http://www.myfonts.com/fonts/urw/corporate-s/extra-bold/">http://www.myfonts.com/fonts/urw/corporate-s/extra-bold/</a></p>
      <p>Kropotkin Standard 42 Expanded Black:<br>
      <a href="http://www.myfonts.com/fonts/sugargliderz/kropotkin-std/42-expanded-black/" title="http://www.myfonts.com/fonts/sugargliderz/kropotkin-std/42-expanded-black/">http://www.myfonts.com/fonts/sugargliderz/kropotkin-std/42-expanded-black/</a></p>
