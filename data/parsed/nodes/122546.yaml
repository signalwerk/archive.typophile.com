      <p>|MOON GAS| is Helvetica 93 Ext Black:<br>
      <a href="http://www.myfonts.com/fonts/linotype/neue-helvetica/" title="http://www.myfonts.com/fonts/linotype/neue-helvetica/">http://www.myfonts.com/fonts/linotype/neue-helvetica/</a></p>
      <p>|DICK HYMAN| appears to be Anzeigen Grotesk:<br>
      <a href="http://www.myfonts.com/fonts/linotype/anzeigen-grotesk-lt/" title="http://www.myfonts.com/fonts/linotype/anzeigen-grotesk-lt/">http://www.myfonts.com/fonts/linotype/anzeigen-grotesk-lt/</a></p>
      <p>|MARY MAYO| might be Unit Gothic 717:<br>
      <a href="http://www.myfonts.com/fonts/hwt/hwt-unit-gothic/" title="http://www.myfonts.com/fonts/hwt/hwt-unit-gothic/">http://www.myfonts.com/fonts/hwt/hwt-unit-gothic/</a></p>
      <p>|MGM| is too small for an accurate ID, but Vitesse Sans Bold by Hoefler &amp; Co. or Eurostile Heavy might work.</p>
