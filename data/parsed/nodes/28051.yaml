    <p><strong><a href="/web/20191005164936/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/web/20191005164936/http://www.typophile.com/node/12452" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">FAQ</span>s</a>&nbsp;:&nbsp;Pronunciation</strong></p>
    <p>Following is a list of names and their correct pronunciations (using English&nbsp;orthography).</p>
    <p><strong>This is a wiki: please&nbsp;contribute!</strong></p>
    <p><em>Typefaces:</em></p>
    <p><a href="/web/20191005164936/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Arnold%20Boecklin" title="Create node &quot;Arnold Boecklin&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Arnold Boecklin</a>: <span class="caps">AR</span>-nollt <span class="caps">BOKE</span>-lin [ˈaːnolt bøklˈin]<br><a href="/web/20191005164936/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Antique%20Olive" title="Create node &quot;Antique Olive&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Antique Olive</a>: on-teek uh-<span class="caps">LEEV</span><br><a href="/web/20191005164936/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Cochin" title="Create node &quot;Cochin&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Cochin</a>: co-<span class="caps">SHAN</span> [koˈʃɛ̃ː]<br><a href="/web/20191005164936/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Elena" title="Create node &quot;Elena&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Elena</a>: <span class="caps">EL</span>-en-uh<br><a href="/web/20191005164936/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Eurostile" title="Create node &quot;Eurostile&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Eurostile</a>: æu-ro-<span class="caps">STI</span>-le (true?)<br><a href="/web/20191005164936/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Fenice" title="Create node &quot;Fenice&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Fenice</a>: fe-<span class="caps">NEE</span>-chay<br><a href="/web/20191005164936/http://www.typophile.com/node/12986" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fette Fraktur</a>: <span class="caps">FET</span>-uh <span class="caps">FROK</span>-tour<br><a href="/web/20191005164936/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Forza" title="Create node &quot;Forza&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Forza</a>: fort-zah<br><a href="/web/20191005164936/http://www.typophile.com/node/12494" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Futura</a>: foo-<span class="caps">TOOR</span>-ah<br><a href="/web/20191005164936/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Helvetica%20Neue" title="Create node &quot;Helvetica Neue&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Helvetica Neue</a>: Helvetica noy-a<br><a href="/web/20191005164936/http://www.typophile.com/node/45558" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Klavika</a>: <span class="caps">KLA</span>-vi-kuh<br><a href="/web/20191005164936/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Neutraface" title="Create node &quot;Neutraface&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Neutraface</a>: <span class="caps">NOY</span>-trah <span class="caps">FACE</span><br><a href="/web/20191005164936/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Officina" title="Create node &quot;Officina&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Officina</a>: <span class="caps">OFF</span>-eh-<span class="caps">CHEE</span>-nah<br><a href="/web/20191005164936/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Seravek" title="Create node &quot;Seravek&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Seravek</a>: <span class="caps">SEER</span>-uh-vek<br><a href="/web/20191005164936/http://www.typophile.com/node/13516" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Univers</a>: oo’-nih-<span class="caps">VAIR</span><br><a href="/web/20191005164936/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Verlag" title="Create node &quot;Verlag&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Verlag</a>: fair-log<br><a href="/web/20191005164936/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Vitesse" title="Create node &quot;Vitesse&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Vitesse</a>: vih-<span class="caps">TESS</span> (or v-<span class="caps">TESS</span>)</p>
    <p><em>Typographers:</em></p>
    <p><a href="/web/20191005164936/http://www.typophile.com/node/14231" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Benguiat, Ed</a>: <span class="caps">BEN</span>-gat<br><a href="/web/20191005164936/http://www.typophile.com/node/32001" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Carnase, Tom</a>: car-<span class="caps">NAY</span>-zee<br><a href="/web/20191005164936/http://www.typophile.com/node/12062" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Frere-Jones, Tobias</a>: <span class="caps">FRARE</span>-<span class="caps">JONES</span>.<br><a href="/web/20191005164936/http://www.typophile.com/node/12061" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hoefler, Jonathan</a>: <span class="caps">HEFF</span>-lur<br><a href="/web/20191005164936/http://www.typophile.com/node/12166" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Licko, Zuzana</a>: litch-co<br><a href="/web/20191005164936/http://www.typophile.com/node/63182" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Lubalin, Herb</a>: loo-<span class="caps">BAL</span>-in<br><a href="/web/20191005164936/http://www.typophile.com/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Zapf, Hermann</a>: <span class="caps">HARE</span>-mon <span class="caps">TZOPF</span><br><a href="/web/20191005164936/http://www.typophile.com/node/12609" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Tschichold, Jan</a>: yonn <span class="caps">CHICK</span>-old<br><a href="/web/20191005164936/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Veljovic" title="Create node &quot;Veljovic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Veljovic, Jovica</a>: yo-<span class="caps">VEET</span>-sa <span class="caps">VELL</span>-yoh-vitch’</p>
    <p><em>Typefaces named after&nbsp;typographers:</em></p>
    <p><a href="/web/20191005164936/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Didot" title="Create node &quot;Didot&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Didot</a>: dee-doh<br><a href="/web/20191005164936/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Fournier" title="Create node &quot;Fournier&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Fournier</a>: <span class="caps">FOORN</span>-yay<br><a href="/web/20191005164936/http://www.typophile.com/node/15602" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Sabon</a>: sah-<span class="caps">BO</span>(nh)<br><a href="/web/20191005164936/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Peignot" title="Create node &quot;Peignot&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Peignot</a>: pay-<span class="caps">NYOH</span></p>
