    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/FAQs" class="freelinking" rel="nofollow">FAQs</a> : Pronunciation</strong></p>
    <p>Following is a list of names and their correct pronunciations (using English orthography).</p>
    <p><strong>This is a wiki: please contribute!</strong></p>
    <p><em>Typefaces:</em></p>
    <p><a href="/wiki/Arnold%20Boecklin" class="freelinking" rel="nofollow">Arnold Boecklin</a>: AR-nollt BOKE-lin [ˈaːnolt bøklˈin]<br>
    <a href="/wiki/Antique%20Olive" class="freelinking" rel="nofollow">Antique Olive</a>: on-teek uh-LEEV<br>
    <a href="/wiki/Cochin" class="freelinking" rel="nofollow">Cochin</a>: co-SHAN [koˈʃɛ̃ː]<br>
    <a href="/wiki/Elena" class="freelinking" rel="nofollow">Elena</a>: EL-en-uh<br>
    <a href="/wiki/Eurostile" class="freelinking" rel="nofollow">Eurostile</a>: æu-ro-STI-le (true?)<br>
    <a href="/wiki/Fenice" class="freelinking" rel="nofollow">Fenice</a>: fe-NEE-chay<br>
    <a href="/wiki/Fette%20Fraktur" class="freelinking" rel="nofollow">Fette Fraktur</a>: FET-uh FROK-tour<br>
    <a href="/wiki/Forza" class="freelinking" rel="nofollow">Forza</a>: fort-zah<br>
    <a href="/wiki/Futura" class="freelinking" rel="nofollow">Futura</a>: foo-TOOR-ah<br>
    <a href="/wiki/Helvetica%20Neue" class="freelinking" rel="nofollow">Helvetica Neue</a>: Helvetica noy-a<br>
    <a href="/wiki/Klavika" class="freelinking" rel="nofollow">Klavika</a>: KLA-vi-kuh<br>
    <a href="/wiki/Neutraface" class="freelinking" rel="nofollow">Neutraface</a>: NOY-trah FACE<br>
    <a href="/wiki/Officina" class="freelinking" rel="nofollow">Officina</a>: OFF-eh-CHEE-nah<br>
    <a href="/wiki/Seravek" class="freelinking" rel="nofollow">Seravek</a>: SEER-uh-vek<br>
    <a href="/wiki/Univers" class="freelinking" rel="nofollow">Univers</a>: oo’-nih-VAIR<br>
    <a href="/wiki/Verlag" class="freelinking" rel="nofollow">Verlag</a>: fair-log<br>
    <a href="/wiki/Vitesse" class="freelinking" rel="nofollow">Vitesse</a>: vih-TESS (or v-TESS)</p>
    <p><em>Typographers:</em></p>
    <p><a href="/wiki/Edward%20Benguiat" class="freelinking" rel="nofollow">Benguiat, Ed</a>: BEN-gat<br>
    <a href="/wiki/Tom%20Carnase" class="freelinking" rel="nofollow">Carnase, Tom</a>: car-NAY-zee<br>
    <a href="/wiki/Tobias%20Frere-Jones" class="freelinking" rel="nofollow">Frere-Jones, Tobias</a>: FRARE-JONES.<br>
    <a href="/wiki/Jonathan%20Hoefler" class="freelinking" rel="nofollow">Hoefler, Jonathan</a>: HEFF-lur<br>
    <a href="/wiki/Zuzana%20Licko" class="freelinking" rel="nofollow">Licko, Zuzana</a>: litch-co<br>
    <a href="/wiki/Herb%20Lubalin" class="freelinking" rel="nofollow">Lubalin, Herb</a>: loo-BAL-in<br>
    <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Zapf, Hermann</a>: HARE-mon TZOPF<br>
    <a href="/wiki/Jan%20Tschichold" class="freelinking" rel="nofollow">Tschichold, Jan</a>: yonn CHICK-old<br>
    <a href="/wiki/Veljovic" class="freelinking" rel="nofollow">Veljovic, Jovica</a>: yo-VEET-sa VELL-yoh-vitch’</p>
