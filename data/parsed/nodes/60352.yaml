  html: |-
    <p>Hope someone knows or can check: do the current "pro" open-type releases of classic faces like Bembo or Plantin from Linotype/Monotype kern by class? </p>
    <p>(We need to add a few glyphs like ṇ; it's a simple matter to add the new glyph to a kerning class. Not sure we want to purchase if it's not kerned by class.)</p>
    <p>Thanks, —D.</p>
