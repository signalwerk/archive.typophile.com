    html: <p>Hmmm. Thanks for that point. What does getting that special permission involve? What are the repercussions (practically speaking) for some small fry like myself ignoring the aforesaid restriction, in a friendly spirit of "I need this letter which your font doesn't provide, so I am quietly adding it for my own personal use, no harm intended or offense implied"?</p>
