      <p>I guess one contacts the foundry to get permission: how easy or likely  it is I have no idea. </p>
      <p>If you don't do get permission? ... well, I don't suppose it's likely you'll get caught, but I just don't think it's good to patronize companies that offer terms you don't like: it encourages them. </p>
      <p>It would be nice if you told them that modifications are important to you, and that your buying decisions will be influenced by this.</p>
