    html: |-
      <p>Etah, looks better now. A few things though. Why choose lower case "e" and "c" in your name? Also I would lower the name<br>
      a bit and put you web address at the bottom with the same typeface as the rest of the contact info. Maybe rise that whole<br>
      text a tiny bit from the edge. Changing the "hotmail-address" would also give more respect from clients.</p>
      <p>Wlll, a bit of humour/irony can't hurt?! I often see graphic design as a "good wrapper". For example, if ha book has a terrible content, the client still would like to have a good looking cover. Now either you accept that and make a good cover or you say "no thanks". You (hopefully) have the choice of say no if, it doesn't fit your ideal, moral etc.Also, as a designer you will not be blamed for the content, product etc. You will be judged by your design. right?</p>
      <p>When I worked with advertising, I could very well be judged in a broader sense because I was sometimes involved in the design, strategy, statements etc. And of course in some cases things can't just look good. Getting involved in a logo design means (for me at least) it has to look great, be logical, practical, economic and be able to work in a wide range of environment. </p>
      <p>Cheers<br>
      /Stefan H</p>
