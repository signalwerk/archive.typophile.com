      <p>Hi Etah!</p>
      <p>The basic idea is kind of fun and leisure. However I would use some better typeface for "I do" and the backside of the card.<br>
      The info text (and symbols) in the bottom will scare clients away. Just make it as simple as possible. That would make a good contrast to the fun approach on the front. Had a brief look at your site and I think also that putting a title like "Artist/Graphic designer" would make a true impression. Well just my personal thoughts. Good luck!</p>
      <p>Cheers</p>
