    html: |-
      <p>What would a sans version of Centaur look  like one wonders? IT would have to have a calligraphic influence and a small x-height. Just thinking out loud really. It would have to have old style numerals. </p>
      <p>OK When Bruce Rogers designed Centaur he worked directly with a broad pen over bleached out enlargements of the a 15th century typeface by Nicholas Jenson. So ITC Legacy Sans is also based on Jensons letters perhaps would this be worth trying. It does look a little wide for headlines though. Is it for a magazine?</p>
