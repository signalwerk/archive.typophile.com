    html: <p>I'm not certain FontHaus's Metro is the best. <a href="http://www.linotype.com/215/metroseries.html" rel="nofollow">Linotype's original Metro</a> is probably the most authentic digitization, if that's what you're shooting for. The reason you may have missed it is that its three styles have one word names -- <a href="http://www.fontshop.com/fonts/downloads/linotype/metrolite_no_2_roman/" rel="nofollow">Metrolite</a>, <a href="http://www.fontshop.com/fonts/singles/linotype/metromedium_no_2_roman/" rel="nofollow">Metromedium</a>, and <a href="http://www.fontshop.com/fonts/singles/linotype/metroblack_no_2_roman/" rel="nofollow">Metroblack</a>&nbsp;-- so they don't always appear in searches for "Metro".</p>
    html_clean: <p>I'm not certain FontHaus's Metro is the best. <a href="http://www.linotype.com/215/metroseries.html" rel="nofollow">Linotype's original Metro</a> is probably the most authentic digitization, if that's what you're shooting for. The reason you may have missed it is that its three styles have one word names -- <a href="http://www.fontshop.com/fonts/downloads/linotype/metrolite_no_2_roman/" rel="nofollow">Metrolite</a>, <a href="http://www.fontshop.com/fonts/singles/linotype/metromedium_no_2_roman/" rel="nofollow">Metromedium</a>, and <a href="http://www.fontshop.com/fonts/singles/linotype/metroblack_no_2_roman/" rel="nofollow">Metroblack</a>&nbsp;-- so they don't always appear in searches for "Metro".</p>
