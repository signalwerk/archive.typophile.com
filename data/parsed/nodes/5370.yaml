      <p>Tiffany, John, a little addition: 'yeru' for Ы is obsolete, from Church Slavonic. Now we call it just 'y'. It's a variation for 'и' ('i') in fact. And when 'и' comes after soft consonants, 'ы' is after hard ones.</p>
      <p>To understand the difference you can substitute it with Ъ and Ь — hard and soft signs:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;'рыба' — ryba [rъiba] (hard r),<br>
      &nbsp;&nbsp;&nbsp;&nbsp;'риск' — risk [rьisk] (soft r).</p>
