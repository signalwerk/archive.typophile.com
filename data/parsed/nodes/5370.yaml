      <p>Tiffany, here are the common names for the letters of the modern Russian alphabet. Generally, these indicate the sound represented by the letter. There is also a traditional set of mnemonic letter names, derived from Old Church Slavonic names, but these have not been in everyday use since about 1900. The chart and notes on <a href="http://www.answers.com/main/ntquery?method=4&amp;dsid=2222&amp;dekey=Russian+alphabet&amp;gwp=8&amp;curtab=2222_1&amp;linktext=Russian%20alphabet" rel="nofollow">this page</a> are helpful. Note that transliterations of the names in Latin letters may vary.</p>
      <p>А	а	<em>a</em><br>
      Б	б	<em>be</em><br>
      В	в	<em>ve</em><br>
      Г	г	<em>ghe</em><br>
      Д	д	<em>de</em><br>
      Е	е	<em>ie</em><br>
      Ё	ё	<em>io</em><br>
      Ж	ж	<em>zhe</em><br>
      З	з	<em>ze</em><br>
      И	и	<em>i</em><br>
      Й	й	<em>short i</em><br>
      К	к	<em>ka</em><br>
      Л	л	<em>el</em><br>
      М	м	<em>em</em><br>
      Н	н	<em>en</em><br>
      О	о	<em>o</em><br>
      П	п	<em>pe</em><br>
      Р	р	<em>er</em><br>
      С	с	<em>es</em><br>
      Т	т	<em>te</em><br>
      У	у	<em>u</em><br>
      Ф	ф	<em>ef</em><br>
      Х	х	<em>ha</em><br>
      Ц	ц	<em>tse</em><br>
      Ч	ч	<em>che</em><br>
      Ш	ш	<em>sha</em><br>
      Щ	щ	<em>shcha</em><br>
      Ъ	ъ	<em>hard sign</em><br>
      Ы	ы	<em>yeru</em><br>
      Ь	ь	<em>soft sign</em><br>
      Э	э	<em>e</em><br>
      Ю	ю	<em>yu</em><br>
      Я	я	<em>ya</em></p>
