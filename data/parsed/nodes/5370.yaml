  html: <p>Before I knew "constructivism" existed I was studying Russian in high school... Later, when I began studying design I fell in love with Rodchenko.  <br> <br>So, here it is--some traditional Cyrillic to start--in regular and bold. Followed by some more constructivist inspired stuff in heavier weights and sizes. <br> <br><img src="http://www.typophile.com/forums/messages/29/394.gif" alt="sample"> <br> <br>Your honest feedback is appreciated. <br> <br>//joe</p>
