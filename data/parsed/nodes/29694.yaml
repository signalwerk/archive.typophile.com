      <p><em>Zwei Boxkämpfer jagen Eva quer durch Sylt.</em></p>
      <p>x, q  and y are very rare letters in German. Luckily, there is the name of an island in the North Sea, <em>Sylt</em>. And a word we took from English: <em>boxen</em>, which means to box, and <em>Kämpfer</em> means fighter, so the <em>Boxkämpfer</em> is a boxer (boxing fighter). That also takes care of one Umlaut which is important in creating German-looking text. <em>Quer</em> means across. There are too many l/c e, a and r to make this as efficient as the <em>quick brown fox</em>, but it is a fun sentence and easy to remember. If you're German.<br>
      We have many more that are impossible to translate and difficult to remember, even for us.</p>
