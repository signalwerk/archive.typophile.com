      <p>So roughly it means:<br>
      <cite>Two boxers hunt across the Island of Sylt for Eva?</cite><br>
      Who originally started using the phrase?</p>
      <p>Is it wrong for me to like <strong>STRANGLE strangle</strong>? Originally I just used RSTLNE like on Wheel of Fortune, but I wanted to see an A and a G. Then I wanted a word to arrange them in for my memory. </p>
      <p>(You could use "strängle" if you needed an Umlaut, but then that would be silly.)</p>
