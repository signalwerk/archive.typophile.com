    date: 2008-04-01T08:15:00
    date_raw: 1 Apr 2008 — 8:15am
    votes: null
    html: <p>Consider Henri-Jean Martin's <em>The History and Power of Writing</em> again no maps. The book is a history of the economies related to writing and printing. So it covers printers, scribes, typefounders, printers, publishers, and book sellers, and does a thoroughly good job to explaining the relationships among the persons and technologies involved.</p>
