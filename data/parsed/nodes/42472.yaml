    <p>Does anyone know of a list detailing the spread of printing in Europe between 1450 and 1550? I'm interested to know the names, locations, and dates.</p>
    <p>There is an entry on Wikipedia under 'Spread of Printing', and there are some maps in Elizabeth Eisenstein's 'The Printing Revolution in Early Modern Europe', but I'd like to cross-reference them with alternatives, online or off.</p>
    <p>Thanks<br>
    William</p>
