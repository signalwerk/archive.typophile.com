    html: |-
      <p>Don, I have found further evidence that the Wikipedia list is incomplete, and arguably inaccurate. Ken, I know the Updike tomes, and they are good. Charles, I've ordered your suggestion. Thanks to all of you.</p>
      <p>At present I am going through the British Library record of incunabulae at St Brides. But this will require some padding out I think. The BL record contains all the books they hold, in chronological (and then city) order - but doesn't include anything they don't hold.</p>
      <p>I would welcome any other suggestions.</p>
