    <p>Hello Typophiles,</p>
    <p>We've just posted the following job listing to our Careers page, in case any type-minded graphic designers in the New York area are looking for full-time employment among fellow type folks. (This listing is for a <em>graphic designer,</em> not a typeface designer.)</p>
    <p><a href="http://www.typography.com/ask/showBlog.php?blogID=132" rel="nofollow">Here's a brief intro from our blog</a>, and here's the complete listing:</p>
    <p>----</p>
    <p>Company: <strong>Hoefler &amp; Frere-Jones</strong><br>
    Job Title: <strong>Graphic Designer</strong></p>
    <p>Hoefler &amp; Frere-Jones is looking for an experienced graphic designer to work across all aspects of the customer experience. This position is full-time at our offices in New York.</p>
    <p>First and foremost, this position demands an absolute mastery of typography, and candidates must have experience with (and enthusiasm for) a wide range of media. You will be responsible for designing and executing all visual materials associated with an established, evolving, and highly visible brand, so experience with identity design is a plus.</p>
    <p>Digital projects will include all visuals connected with our website, from the presentation of typefaces to the development of new user interfaces. Print projects will include the design of advertising, catalogs, and type specimens. You will work with our marketing team to conceptualize and execute a wide range of projects, and with a programmer to develop new features and UI improvements for both the front-end and back-end of our website.</p>
    <p>In addition to being problem-solvers with fine communication skills, applicants should have a wide range of interests, and impeccable instincts for what works.</p>
    <p>This is a full-time salaried position with excellent benefits, open to US citizens or those with authorization to work in the US.</p>
    <p>Required Experience:</p>
    <p>     — BS/BA or equivalent<br>
         — 5-10 years professional experience<br>
         — A fanatical, absorbing passion for typography<br>
         — Experience managing print projects from soup to nuts<br>
         — Strong online experience, and a working knowledge of HTML/CSS<br>
         — Proficiency with the Adobe Creative Suite and Mac OS X</p>
    <p>Strong candidates will have:</p>
    <p>     — Experience in brand development or identity design<br>
         — Experience in book or editorial design<br>
         — MFA in design, or other relevant post-graduate experience</p>
    <p>Please submit a cover letter accompanied by a portfolio of relevant work (under 5 mb, please) to Carleen Borsella through the link on this page: <a href="http://www.typography.com/about/careers.php" title="http://www.typography.com/about/careers.php">http://www.typography.com/about/careers.php</a></p>
