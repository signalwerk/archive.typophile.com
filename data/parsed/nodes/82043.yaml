    <p>Someone was asking recently about designs/logos made of stripes where the design was picked out by changes in the stripe thickness. I have in mind a similar, but different effect:</p>
    <p>I've seen designs where the image appears, at first glance (especially when you look at it quite close up) to be <em>just</em> lines, usually diagonal. But then, if you look at it from a little further away, or move your head and the page relative to each other, you see text or a graphic element, subtly hidden. It's not a change in the <em>direction</em> of the lines, nor an immediately noticeable change in the line thickness (unline the previous person's question).</p>
    <p>(a) do you know what I'm talking about?<br>
    (b) if so, has this thing got a name?<br>
    (c) how's it done?</p>
    <p>Cheers</p>
