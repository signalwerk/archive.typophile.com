      <p>Mais alors,</p>
      <p>you can reach no less than three good museums of printing history within half an hour and one hour from your hometown:</p>
      <p>– the <a href="http://www.gutenbergmuseum.ch/" rel="nofollow">Gutenbergmuseum</a> in Fribourg,<br>
      – the <a href="http://www.papiermuseum.ch/" rel="nofollow">Papiermuseum</a> in Basel,<br>
      – <a href="http://www.encreetplomb.ch/" rel="nofollow">La musée encre et plomp</a> in Chavannes.</p>
      <p>I am sure that there you will find enough helpful people who could give you information.</p>
