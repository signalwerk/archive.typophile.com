    <p>I was wondering if somebody had informations about book types being made in switzerland (german or french part).<br>
    Everybody knows about helvetica, frutiger and so on, but before that (16, 17, 18, 19th century) there should have been some punchcutters and type founders or were all types only copies or buyed in france and germany?<br>
    From what i know, basel was a center for printing since it was a religious center but i'm more interested in roman types...</p>
    <p>I'm studying graphic design here in switzerland but all my ressources are french or english books and i can't find lots of information.<br>
    Thanks to anybody who could give me some interesting ways for my researches!</p>
    <p>X-Y</p>
