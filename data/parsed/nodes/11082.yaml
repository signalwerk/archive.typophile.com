    html: "<p>Poynter vs Bureau, in case anybody's interested: <br> <br>Below are a couple of GIFs I put together last year. They show superimpositions of the lightest and darkest grades for each of the two fonts. <br> <br><a href=\"http://www.themicrofoundry.com/other/fb/poynter_1vs4.gif\" target=\"_top\">http://www.themicrofoundry.com/other/fb/poynter_1vs4.gif</a> <br> <br><a href=\"http://www.themicrofoundry.com/other/fb/bureau_0vs4.gif\" target=\"_top\">http://www.themicrofoundry.com/other/fb/bureau_0vs4.gif</a> <br> <br>The most notable difference is the alignment wrt the x-height. But there are also interesting differences of overal color, as well color gradation. <br> <br>As an aside, I would highly recommend the purchase of FontBureau's most recent type specimen book - it's a marvel. <br> <br>hhp</p>"
