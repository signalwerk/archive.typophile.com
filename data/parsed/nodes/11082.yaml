    html: "<p> Well, imagination isn't generally considered the most important thing in newsface design (even though to me innovation is an inherently desirable thing), but my problem with Poynter is that it's too humanist (not that I adore Linotype's brutal Legibility Group fonts). Even Times I find too humanist, except that in its time/medium it came out OK (just not any more). One font that's masterfully balanced is Olympian - there's a great article about it in this obscure Hungarian magazine from the 70s. On the other hand, Poynter is notable for its technical prowess - those four grades really are wonderful. BTW, it's interesting to compare it with the [later] Bureau by FB. Lastly: there's an issue of Critique magazine with a three-person review of Poynter - the one by Keedy is worth reading. <br> <br>I really like Unger's work, not least because it's more cutting-edge than anything else, and than it even lets on (which can be seen as a critical necessity). The only problem I have with his news designs is that they simply look too cute at large sizes - but one could blame the user for that, especially if you believe that small and large sizes have inherent incompatibilities. <br> <br>In terms of headline news designs, my favorite has to be de Groot's Folha - his new Floris (originally called Lucas) is [even] more interesting, but I think not as appropriate to its environment: I feel French type needs to be \"sharper\", like Meridien. <br> <br>hhp </p>"
    html_clean: "<p> Well, imagination isn't generally considered the most important thing in newsface design (even though to me innovation is an inherently desirable thing), but my problem with Poynter is that it's too humanist (not that I adore Linotype's brutal Legibility Group fonts). Even Times I find too humanist, except that in its time/medium it came out OK (just not any more). One font that's masterfully balanced is Olympian - there's a great article about it in this obscure Hungarian magazine from the 70s. On the other hand, Poynter is notable for its technical prowess - those four grades really are wonderful. BTW, it's interesting to compare it with the [later] Bureau by FB. Lastly: there's an issue of Critique magazine with a three-person review of Poynter - the one by Keedy is worth reading. <br> <br>I really like Unger's work, not least because it's more cutting-edge than anything else, and than it even lets on (which can be seen as a critical necessity). The only problem I have with his news designs is that they simply look too cute at large sizes - but one could blame the user for that, especially if you believe that small and large sizes have inherent incompatibilities. <br> <br>In terms of headline news designs, my favorite has to be de Groot's Folha - his new Floris (originally called Lucas) is [even] more interesting, but I think not as appropriate to its environment: I feel French type needs to be \"sharper\", like Meridien. <br> <br>hhp </p>"
