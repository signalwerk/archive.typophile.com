      <p><cite>If I need a monospaced font I tend to use either Anonymous Pro or Consolas.</cite><br>
      There isn't much in the way of monospaced fonts out there, is there?</p>
      <p>My guess is that "M", "W", "m", and "w" are the real troublemakers. I don't see why those four characters should dictate the rest of the font. I don't see why the Cyrillic "м" glyph shouldn't be pressed into service for Latin "m" if it helps save space. And I really don't like the avoidance of straight vertical strokes for "M". As for "w" and "W", I am sure font-makers would find a way to narrow them if forced. I guess the reason monospaced fonts are so fat is really these four characters. Is that right?</p>
