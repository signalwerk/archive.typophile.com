      <p><cite>Any font with tabular lining figures as an OT stylistic set would fulfill your needs.</cite><br>
      Not at all. To give an extreme example, the stroke widths of Times New Roman would be quite unsuitable for my needs here.<br>
      I would have given up and used the American road sign font (no-nonsense, utilitarian, designed for reading at a distance), except that the characters are rather fat, so I chose the German road sign font instead. I also think that the German font is more attractive and maybe a bit more legible. Okay, maybe the American series B or C version would be all right, but it would still have some problems with the letters.<br>
      About the letters: I do not like the "roller-coaster ride" formed by the days of the week in the screenshot I gave. Really, I do not at all like the look of "Fri" in my examples. Partly because "r" and "i" are narrow letters, and partly because proportional fonts in general smash the "r" into the following letter, "Fri" tends to look horrible. On the clock in my kitchen, it looks just like "Fn" with a dot over the "n".<br>
      <cite>You might consider looking for a font that has proportional oldstyle figures, like Museo Sans</cite><br>
      How are oldstyle figures, or proportional figures, even relevant?</p>
