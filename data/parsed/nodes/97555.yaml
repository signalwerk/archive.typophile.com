      <blockquote><p>Also, I don't understand the design of the digits in Arial/Helvetica, and even more, why it is default for spreadsheets.</p></blockquote>
      <p>They are often the default for spreadsheets because of their ubiquity rather than any typographic qualities that would lend themselves to this purpose. The current default for Excel is Calibri, which I personally think works very well in that context and I tend to switch between that and Verdana for spreadsheet work.</p>
      <p>If I need a monospaced font I tend to use either <a class="freelinking external" href="http://www.ms-studio.com/FontSales/anonymouspro.html" rel="nofollow">Anonymous Pro</a> or <a class="freelinking external" href="http://www.lucasfonts.com/case-studies/calibri-consolas/" rel="nofollow">Consolas</a>.</p>
