      <p>Any font with tabular lining figures as an OT stylistic set would fulfill your needs.</p>
      <p>Once upon a time—when a font was one size and one style of a particular typeface, cast in metal—most popular and practical faces had add-on sets of tabular figures, which were purchased separately, as was extended punctuation. So, calendars were assembled by a skilled typographer, backwards and often upside-down. Watching someone hand-set type is a trip, as is watching someone operate a Linotype machine…although neither is as trippy as having a five-inch-long Giant Hissing Cockroach crawl on your hand…</p>
