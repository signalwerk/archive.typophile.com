  html: |-
    <p>Before graduating from MassArt last May, I spent a semester (and then some) working on an experimental wood typeface design / production project. The project was recently selected to be featured in a <a href="http://www.mcla.edu/Gallery51/0703/" target="_blank" rel="nofollow">Contemporary Letterpress</a> exhibition, so I figured it would be a good time to put all my process together for others to see.<br>
    You can read more than you probably ever would want to at <a href="http://www.nicksherman.com/design/Intercut" target="_blank" rel="nofollow">nicksherman.com/design/Intercut</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/print-AOEG_RHN-both-680_6558.jpg"></div><p></p>
