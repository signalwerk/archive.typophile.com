    html: <p>Andrew, <br> <br>Sbo's got the right idea. In the meantime, I'll  <br>speculate... <br> <br>It seems he may have made judicious use of Avant <br>Garde's alternates. As far as I know, URW is the <br>only foundry to distribute these in digital form. <br> <br>Go to <a href="http://www.urwpp.de/english/schrift/wahl0-set.htm" target="_top">http://www.urwpp.de/english/schrift/wahl0-set.htm</a> <br>and search for "Avant Garde". I see the 'v', 'e', <br>and 'c' in the Avant Garde Gothic Alt book. The <br>'t' could be customized with minimal effort.</p>
