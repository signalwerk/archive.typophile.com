    html: <p> It's not unlike what Solotype has done for years with their wood/metal/phototype library. (Of course, they're the ones who, with Dover Press,  put out all those US$6.95 paperback display type specimen books.) <br> <br>For a fee, they will typeset/design anything you want from their VAST collection of old wooden, metal or photo type. They still get a lot of work from the major magazines, as I understand. <br> <br>And yes, they have the full Avant Garde Gothic character set -- after all, it was designed specifically for phototype systems. My bet is that the sample you found is indeed Avant Garde Gothic, and was set by phototype (perhaps even by the folks at Solotype). <br> <br>My second guess, based on the date of publication (1972), is that is could have been hand set by the old Letraset transfer lettering system, which also offered the complete range of Avant Garde Gothic alternates. </p>
    html_clean: <p> It's not unlike what Solotype has done for years with their wood/metal/phototype library. (Of course, they're the ones who, with Dover Press,  put out all those US$6.95 paperback display type specimen books.) <br> <br>For a fee, they will typeset/design anything you want from their VAST collection of old wooden, metal or photo type. They still get a lot of work from the major magazines, as I understand. <br> <br>And yes, they have the full Avant Garde Gothic character set -- after all, it was designed specifically for phototype systems. My bet is that the sample you found is indeed Avant Garde Gothic, and was set by phototype (perhaps even by the folks at Solotype). <br> <br>My second guess, based on the date of publication (1972), is that is could have been hand set by the old Letraset transfer lettering system, which also offered the complete range of Avant Garde Gothic alternates. </p>
