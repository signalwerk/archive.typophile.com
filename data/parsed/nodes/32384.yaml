    html: |-
      <p>Table &gt; cell options &gt; text...</p>
      <p>brings up the dialogue box enabling you to set the text padding values.</p>
      <p>Having once set 50 tables in Quark 6 for a catalogue, I have a soft spot for InDesign’s table tools.</p>
