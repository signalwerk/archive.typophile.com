      <p>In my opinion of all the fonts mentioned so far, the closest matches  might be Deerfield and Matthan Sans. It has _A_ with apex top, _R_ with vertical leg, _S_ with horizontal center stroke, and the a similar 7. Matthan Sans is little more rounded than your image, but you seem to like the rounded aspect.<br>
      Don</p>
