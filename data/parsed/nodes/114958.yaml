    html: |-
      <p>The letters are in an old style called stovepipe. FAIK They are not a font as such. I can offer several fonts that generally match the letterforms shown in the image --_A_ with apex top,  _R_ with vertical leg, _S_ with horizontal center stroke.<br>
      Valuco <a href="http://www.myfonts.com/fonts/aesthetic-apparatus/valuco/" title="http://www.myfonts.com/fonts/aesthetic-apparatus/valuco/">http://www.myfonts.com/fonts/aesthetic-apparatus/valuco/</a><br>
      Gaz <a href="http://www.myfonts.com/fonts/typodermic/gaz/" title="http://www.myfonts.com/fonts/typodermic/gaz/">http://www.myfonts.com/fonts/typodermic/gaz/</a><br>
      Liquor Store <a href="http://www.myfonts.com/fonts/chank/liquorstore/" title="http://www.myfonts.com/fonts/chank/liquorstore/">http://www.myfonts.com/fonts/chank/liquorstore/</a><br>
      Iwan Reschniev <a href="http://www.myfonts.com/fonts/fdi/iwan-reschniev/" title="http://www.myfonts.com/fonts/fdi/iwan-reschniev/">http://www.myfonts.com/fonts/fdi/iwan-reschniev/</a><br>
      Lobby Card JNL <a href="http://www.myfonts.com/fonts/jnlevine/lobby-card/" title="http://www.myfonts.com/fonts/jnlevine/lobby-card/">http://www.myfonts.com/fonts/jnlevine/lobby-card/</a><br>
      There are quite a few that that match the _R_ but not the _S_ and vice versa. Run through the stovepipe tag at Myfonts <a href="http://www.myfonts.com/search/tag%3Agaspipe/fonts/" title="http://www.myfonts.com/search/tag%3Agaspipe/fonts/">http://www.myfonts.com/search/tag%3Agaspipe/fonts/</a> and you will see what I mean.<br>
      All are wider than your letters, although Iwan Reschnie is closer in width than the others.<br>
      Don</p>
