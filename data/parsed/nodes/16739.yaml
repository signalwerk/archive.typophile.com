      <p>Hi Kristina,</p>
      <p>I've found vertical justification useful when typesetting adverts with only one column of text, to fill in that extra space at the bottom (Clients for some reason seem to want every inch of space used up!)</p>
      <p>When setting books, brochures or anything else with more than one page I've found that for consistancy purposes sticking to the baseline is preferable. </p>
      <p>Given the choice (as opposed to client directive) I'd possibly never use it.</p>
      <p>Hopefully this help you in some small way</p>
      <p>Regards</p>
      <p>Shaun</p>
