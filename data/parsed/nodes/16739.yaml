    <p>Wondering what you all think about the vertical justification option in InDesign -- Is it useful, would you use it when typesetting a book, and how do you find it affects the readability?</p>
    <p>Felici mentions vertical justification in The Complete Manual of Typography as a way to compensate for extra space left when fixing widows and orphans, but "The disadvantage to vertical justification of any kind is that it throws the text off any baseline grid in use."</p>
    <p>Opinions and insight would be helpful!</p>
    <p>Thanks,</p>
    <p>Kristina</p>
