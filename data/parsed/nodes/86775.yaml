      <p>Good advice for calculating an hourly fee to charge for work, but totally irrelevant for calculating license fees. </p>
      <p>Perpetual Non-exclusive, and Perpetual Exclusive are two very different things.</p>
      <p>Nick's advice on surveying the market is a good place to start.</p>
      <p>DTF, I think your advice is off-base as well.</p>
