    html: |-
      <p>You should start by coming up with a number that provides you with a living wage. What that is will depend, but typically some formula consisting of the number of hours it'll take you to do the work * your hourly rate (which is a whole other formula).</p>
      <p>That's your baseline. At that price, you'll at least know it was worth your time. You can then raise or lower it from there based on all sorts of other criteria, but at least you'll have a benchmark.</p>
