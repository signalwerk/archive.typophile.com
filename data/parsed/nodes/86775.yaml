    html: |-
      <p>I don't think this is something that you can logically and quickly figure out.<br>
      It's the kind of business evaluation that you have to intuit by familiarity with, and study of, the market, and through experience.<br>
      It's important to have an understanding of your foundry's place in the market, and your client's.<br>
      For starters, take a look at a large number of license agreements from different foundries, to determine what sort of licence will work for you and your client. This should be determined before you quote.<br>
      Particularly, consider "Enterprise" licenses.<br>
      Other than that, I recommend you imagine what a foundry whose work you respect might charge, and double it.</p>
