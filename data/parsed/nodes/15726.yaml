    <p>I couldn't find the previous thread, so I started a new one.</p>
    <p>While waiting for my Bringhurst to arrive in the mail, I have put one of the sections onto the baseline grid and changed the typeface. I am using Warnock Pro for the text body and Trebuchet for headers and side notes.</p>
    <p>I would appreciate any comments on these changes, in particular:<br>
    Do these two typefaces work well together? (I find it looks fresh and clear.)<br>
    Is the 8pt size too small? (I think it's fine, but I don't wear glasses...)</p>
    <p>*Please ignore the first page of the pdf.* </p>
    <p>Thank you so much,<br>
    Kristina</p>
