    html: <p>Very nice separation of information. I would suggest shifting the entire grid to the right (or the outside) so your margins on left and right (inside and outside) are assymetrical or rather balanced on the top, bottom and right (outside). I might also suggest using a different sans, but at least make it bold for more contrast.</p>
