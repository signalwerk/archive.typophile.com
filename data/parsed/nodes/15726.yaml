    html: |-
      <p>Thank you for the encouragement, Tim.</p>
      <p>I find it's better with everything on the grid, but also a little tougher to make things fit -- ensuring that course titles aren't separated from descriptions, for example. I can't edit the content at all -- so can only squeeze stuff in or space it out. I'm finding some pages really tricky to fit.</p>
      <p>Yes, I've been toying with using indents for every paragraph after the first. I never understood why it was set up this way to begin with, but figured there had to be a reason... Even a small indent would do a lot for clarity, I'm sure. Then line spaces to distinguish between major topics.  </p>
      <p>Thanks again, I appreciate the help.<br>
      K.</p>
