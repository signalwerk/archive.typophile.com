      <p>On the pages where you use a single column, the measure is on the wide side, to assist separation of paragraphs you might try an indent on paragraphs after the first of a section(there is a section on Degree Requirements that uses line space after). Also there are several single words on the last line which would look better if you take over words from preceding lines. But overall this is a vast improvement over the Word sample you showed earlier, especially the two column work.<br>
      Tim</p>
