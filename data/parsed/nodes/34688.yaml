      <p>I know that geometrically "S" is ok in the middle but visually it looks broken. Correct that. Its weight also looks heavier as other letters'.</p>
      <p>I like the second one more, but it reminds me of the YOSHO (90560) because of the "Y" style.</p>
      <p>Since it's about seeing. There's a nice "eyes" pattern with "e"s at the end. Add some eyebrows or eyelashes maybe. Try and play.</p>
      <p>But I like the cleanness of it. Very clean very nice. Less is more. Just make it memorable somehow.</p>
