    html: |-
      <p>I would work on reducing the weight in the curved parts of the letters – there is a horizontal weightiness at the top and bottom of most characters, and try a more geometric s based on the shape of the e with a horizontal crossbar. A little bit of overshoot on the curved characters could help the baseline which is dragged down by the y, or you could exaggerate it to make a small feature of it. The transition from vertical to curved in the inside of the y,o,u is a bit abrupt.</p>
      <p>Tim</p>
