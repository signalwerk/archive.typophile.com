    <p>I worked as a designer for a big company for three months.  And then I was let go with a "we'll call you" talk...</p>
    <p>Anyways, someone mentioned unemployment to me recently, and I'm curious if any of you have applied for / gotten it?</p>
    <p>I was technically freelancing, but they the company I was working for took out all the taxes from my weekly paychecks and I worked in house 5 days a week.</p>
    <p>Is this something someone here has done?  Should I pursue it?</p>
    <p>Thanks!</p>
