      <p>I'm not a lawyer but my understanding is:</p>
      <p>If your "employer"* was withholding taxes and you were in-house and they controlled the hours you worked, paid you just for showing up (as opposed to for a particular project) and controlled how the work was done (among other things) then you were most likely an employee by the IRS definition, and probably qualify for unemployment. </p>
      <p>If not, then maybe you were a freelancer by definition, maybe not. If the IRS classifies you as an employee but the employer didn't pay all the taxes and benefits (including unemployment) that they should have, the employer could face fines and penalties. </p>
      <p>The IRS has good information on their website.</p>
      <p>My take is (and this is only MY OPINION): if you really need the unemployment, contact your state labor board or the IRS to ask if you were an employee. (There is a form to file if you need to report the company.) If you prefer to keep the client relationship and can get by without unemployment, don't.</p>
      <p>*Employees have employers, freelancers have clients.</p>
