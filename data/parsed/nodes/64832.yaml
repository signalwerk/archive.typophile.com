      <p>If you qualify for it, you should receive something in the mail. If you don't receive anything in the mail, you can contact/visit your local government employment office to see if you qualify. It is OK to work while on unemployment, you simply need to report your wages/earnings and let them figure out what you qualify for. Of course, the more you make, the less unemployment you will get.</p>
      <p>Also, if you were freelancing, your employer/client might not have been paying for unemployment benefits (in which case, you would have no claim).</p>
