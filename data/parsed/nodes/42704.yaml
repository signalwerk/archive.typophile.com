      <p>From the ATypI list (yesterday) - timing is interesting/related? 100,000 in pize money!</p>
      <p><cite><br>
      Here are two announcements which may interest anyone with an interest in Armenian (or Cyrillic) type design:</cite></p>
      <p>The Ministry of Culture of the Republic of Armenia is sponsoring a new international competition for type design: ‘Granshan 2008’<br>
      (Granshan means ‘character’ in Armenian).<br>
      The deadline for entries is 10th June 2008.<br>
      The competition judging will take place in Yerevan, 21–28 June 2008.</p>
      <p>Categories:<br>
      1. Armenian text type – serif<br>
      2. Armenian text type – sans serif<br>
      3. Armenian traditional text type<br>
      4. Latin text type<br>
      5. Cyrillic text type<br>
      6. Display type</p>
      <p>The competition is open to type designers/producers internationally.<br>
      The first prize is 100 thousand Armenian drams (c. $300).<br>
      The 2nd and 3rd prize winners will receive diplomas and prizes.<br>
      Entries should be sent to the Book Chamber of the Republic of Armenia.<br>
      Address: Yerevan, Gevord Kochari, 21, Armenia.</p>
      <p>Telephone: (010) 51 98 91<br>
      E-mail: <a href="mailto:armtype@xter.net">armtype@xter.net</a></p>
      <p>For more information contact the Chairman of the organizing committee Edik Ghabuzyan (on the above email address). Full details are available in Armenian, English and Russian as pdf files. Announcement of the results of the competition and prizegiving will take place in Yerevan. (The exact date to be confirmed).</p>
      <p>Armenian Type Now – Exhibition in July 2008 In July, the University of Lincoln is hosting three visitors from the Armenian Ministry of Culture, Yerevan, including the aforementioned Edik Ghabuzyan, Head of the Department of Creating and Keeping Armenian fonts of the National Book Chamber.</p>
      <p>We will be creating a small exhibition called ‘Armenian Type Now’ in the Wren Library of Lincoln Cathedral. This will showcase the design of letters for the Armenian alphabet: hand lettering; book design and typeface design (it will feature some of the entries from the Granshan 2008 competition).</p>
      <p>The exhibition will be open to the public from Saturday 5th–Saturday 12 July inclusive (not Sunday) 11am–3pm each day.</p>
      <p>If you are not able to come to Lincoln, I am hoping to make a CD of images and some of the typefaces available to members later in the year.</p>
      <p>The General Assembly of the United Nations has proclaimed 2008 to be the International year of languages to promote ‘Unity in Diversity and Global Understanding’<br>
      – both of these events recognise this United Nations initiative and celebrate the unique Armenian alphabet.</p>
      <p>Carolyn Puzzovio</p>
      <p>University of Lincoln, UK.<br>
      </p>
