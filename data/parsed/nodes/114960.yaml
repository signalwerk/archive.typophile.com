      <p>It might be lettering, at least I have not seen a matching font. So far, I have found four candidates that are roughly a match for the letters, without the extensions.<br>
      If you can edit fonts you could use any of them to make a reasonable imitation.<br>
      Sneaker Script <a href="http://www.myfonts.com/fonts/flat-it/sneaker-script/" title="http://www.myfonts.com/fonts/flat-it/sneaker-script/">http://www.myfonts.com/fonts/flat-it/sneaker-script/</a><br>
      Monoline Script MT  <a href="http://www.myfonts.com/fonts/mti/monoline-script-mt/" title="http://www.myfonts.com/fonts/mti/monoline-script-mt/">http://www.myfonts.com/fonts/mti/monoline-script-mt/</a><br>
      Swing <a href="http://www.myfonts.com/fonts/mti/swing-2/" title="http://www.myfonts.com/fonts/mti/swing-2/">http://www.myfonts.com/fonts/mti/swing-2/</a><br>
      Tribeca Script <a href="http://www.myfonts.com/fonts/pelavin/tribeca-script/" title="http://www.myfonts.com/fonts/pelavin/tribeca-script/">http://www.myfonts.com/fonts/pelavin/tribeca-script/</a><br>
      Don</p>
