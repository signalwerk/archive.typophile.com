      <p>In the interesting <a href="https://web.archive.org/web/20081013182754/http://www.printinghistory.org/htm/journal/articles/31-32-Cost-Benton.pdf">article</a> on the Bentons you refer to, on p. 42 it reads: </p>
      <p>“For example, News Gothic was cut exactly proportional to the pattern plate. Going down in size, the face was actually extended in width but not in height… In the 1940s …the normal practice at Stempel was to produce three sets of patterns for each typeface. Adjustments on the machine itself were only used to widen characters in the very smallest sizes.”</p>
      <p>It seems from this there were different philosophies involved for using the machine. Also the article mentions that they drew a different pattern for each size of their Caslon. </p>
      <p>Did they linearly increase the thickness and width, or was this much more pronounced at 6 point? Did thickness and width increase together or somethat differently?</p>
      <p>Oh, and did they do anything about x-height?</p>
    html_clean: |-
