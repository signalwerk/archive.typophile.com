    <p>I’ve put together a webpage with some images from my study of ATF optical scaling.</p>
    <p><a href="https://web.archive.org/web/20081013182754/http://levien.com/type/atf_bodoni/avg.html" title="http://levien.com/type/atf_bodoni/avg.html">http://levien.com/type/atf_bodoni/avg.html</a></p>
