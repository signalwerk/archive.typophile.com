      <p>hrant asks: <cite>In the image, do you think that might be a trap in the top-right corner of the lower counter?</cite></p>
      <p>No, it doesn’t look like one to me. I assume that by “trap” you mean a wedge taken out of the inner join to create a larger negative space on the inside, as in your <a href="https://web.archive.org/web/20081013182754/http://www.themicrofoundry.com/ss_trapping1.html">trapping article</a>. I see very little evidence for trapping in the ATF oeuvre.</p>
      <p>William: I interpret that passage a bit differently (and am referring to my specimen book for further support).</p>
      <p>Of the News Gothic, only the 36pt was engraved with exactly the same outline as the pattern plate. Smaller sizes were extended and heavier compared with the pattern plate, and larger sizes were condensed and lighter.</p>
      <p>American Caslon, by comparison, is a fairly extended font already - the “o” is pretty close to a perfect circle. From my experimentation, if you extend an already wide font to try to make optical scales for smaller sizes, it looks wrong. And, indeed, if you look at Monotype (metal) Centaur, there’s little or no anamorphic scaling across the size range. They did use different pattern plates (I’ve counted four size ranges, as discussed in more detail in <a href="https://web.archive.org/web/20081013182754/http://typophile.com/node/6592">this thread</a>), and the ’e’ is in fact narrower in the smaller sizes than the larger.</p>
      <p><cite>It seems from this there were different philosophies involved for using the machine. Also the article mentions that they drew a different pattern for each size of their Caslon.</cite></p>
      <p>Yes, there are different philosophies, but there is also a lot of commonality. The smaller sizes of Centaur, drawn from different pattern plates, show evidence of stroke offset-based weight gain (radius of curvature is larger on external corners such as the outer bottom of the ’v’, smaller on internal corners, than in display sizes), just as do the ATF Bodonis, all scaled from a single pattern plate. I think it’s likely that they used the stroke offset adjustments across the size range so that there wouldn’t be a noticeable jump in appearance from the largest size in one range to the smallest size in the next (12pt to 14pt, in the case of Centaur).</p>
      <p>Most of the ATF fonts used a single pattern plate for all sizes, but there certainly are exceptions. The Garamonds used two, one for 6-12, another for 14 and up (more details <a href="https://web.archive.org/web/20081013182754/http://www.typophile.com/node/5901">here</a>). Some of their fonts seem to use many pattern plates. I count at least four in the Baskerville: 6-10, 12, 14-24, and 30-up. Of these, the 12 looks a <em>lot</em> like Stempel (Linotype) Baskerville, the 30 and up is essentially Fry’s Baskerville. The other two are not as good.</p>
      <p>Scotch Roman (pp. 394 and 395 of the <a href="https://web.archive.org/web/20081013182754/http://levien.com/type/atf_1912/">1912 book</a>) also has more than two, but I’m unsure of the exact number (t<!--
