    <p>I’m currently working on getting my physical portfolio updated (it’s been about 5 years and I have a lot of work to go through), but I’m also doing an online version (Behance.net, very easy to use) which I’ve never had. </p>
    <p>So, my question. In this day and age, is having a physical portfolio still important? Can I get away with just an online one? I’m finding that the online one can include things that the physical can’t, including more of my work. However, the physical one is nice to show off some of the more 3-dimensional designs I’ve done, but it’s limited in both size and amount to work to include.</p>
    <p>I’m primarily a print designer with little web experience (but I’d like to expand hopefully). I’m looking for a new job, but I’m getting antsy because I feel really behind with my portfolios. I’m coming across all these great openings I’d like to apply at, but am holding off until I have either one finished (is that wrong?). It’s been a while since I’ve done this and I feel really behind the curve. I’m excited though, this is a chance to get into a place that I’ll love working at! </p>
    <p>Anyway, I’d love to hear opinions for both sides. In the meantime, I’m going to keep working on these portfolios. It’s a lot of work, but I feel certain expectations still apply.</p>
