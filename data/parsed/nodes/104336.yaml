    <p>Hello</p>
    <p>I am looking for an advice, or just your opinion:<br>
    I use the font "Flexo" ( <a href="http://www.myfonts.com/fonts/durotype/flexo/" title="http://www.myfonts.com/fonts/durotype/flexo/">http://www.myfonts.com/fonts/durotype/flexo/</a> ) for all of my business-stuff (print and online), but I'm not completely satisfied with my online-pages look.</p>
    <p>It's there: <a href="http://davidbraun.ch" title="http://davidbraun.ch">http://davidbraun.ch</a> and <a href="http://davidbraun.ch/werkstatt" title="http://davidbraun.ch/werkstatt">http://davidbraun.ch/werkstatt</a></p>
    <p>Should I use a different font for the headlines? or rather the body? (My feeling is that flexo is better kept small...)<br>
    What would you recommend?<br>
    I once was very tempted to use emigre's vendetta, but my designer steered me away of this...<br>
    And a bit later, I stumbled upon a font that was looking very much like flex, but it was a font of its own, and it had an italic-variant... (but totally cannot remember what it was...) </p>
    <p>Thanks very much for your time and insights</p>
    <p>david</p>
