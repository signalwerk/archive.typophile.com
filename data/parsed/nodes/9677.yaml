    html: <p> There are two ways to get high-quality screen rendering. The main one these days is hinting, but you can also embed actual bitmaps into TT fonts. (On MacOS you can also have a bitmap suitcase.) <br> <br>Although most of the industry has taken hinting to heart, I'm still not convinced that it's *always* the way to go. I've been learning VTT, and the one adjective I would use to describe the process of delta-hinting (which is what you really need to match embedded bitmaps in quality) is "unnatural". <br> <br>Also, if you want the ultimate in on-screen rendering you would go with grayscale bitmaps (handmade ones, not those awful ones generated automatically), and at that point hinting becomes *really* painful. <br> <br>hhp </p>
    html_clean: <p> There are two ways to get high-quality screen rendering. The main one these days is hinting, but you can also embed actual bitmaps into TT fonts. (On MacOS you can also have a bitmap suitcase.) <br> <br>Although most of the industry has taken hinting to heart, I'm still not convinced that it's *always* the way to go. I've been learning VTT, and the one adjective I would use to describe the process of delta-hinting (which is what you really need to match embedded bitmaps in quality) is "unnatural". <br> <br>Also, if you want the ultimate in on-screen rendering you would go with grayscale bitmaps (handmade ones, not those awful ones generated automatically), and at that point hinting becomes *really* painful. <br> <br>hhp </p>
