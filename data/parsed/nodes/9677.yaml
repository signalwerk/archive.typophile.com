    html: <p>I've learned, from reading and listening, that one thing that truly makes a font work for the screen is the 'hinting' of the font. I believe that Microsoft (link below) has a section on this. And, if this doesn't help as much, a friend of mine who designed trebuchet and others, could be of more help. Let me know. <br> <br><a href="http://www.microsoft.com/typography/default.asp" target="_top">http://www.microsoft.com/typography/default.asp</a></p>
