      <p>I think you've got the fonts identified.</p>
      <p>Maybe the designers wanted to use Helvetica for the Hanso foundation logo to set it apart from the Futura normally associated with Lost. However, the 'O' in "HANSO" could not be Helvetica because Helvetica's oval-shaped 'O' wouldn't work with the yin-yang-style circular logo, so they reverted back to Futura. Since "FOUNDATION" has two 'O's in it, they may have wanted to use Futura so the 'O's wouldn't look out of place.</p>
      <p>Why is the 'S' heavier than the rest? Only the polar bears know...</p>
      <p> - Lex</p>
      <p><cite>EDIT: I just noticed the 'H' is in Futura as well... this makes it H, AN, S, O in different weights/fonts. What does it mean?</cite></p>
      <p><cite>EDIT 2: FOUNDation - for a show called LOST - coincidence?</cite></p>
      <p><cite>EDIT 3: If you re-arrange the letters in HANSO it spells OSHAN which sounds like ocean - which is where the island is... spooky.</cite></p>
      <p><cite>EDIT 4: I need to get some sleep.</cite></p>
