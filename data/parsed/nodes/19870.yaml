    <p>Ok ABC networks, what kind of font game are you playing?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/10800_5925.jpg"></div><p></p>
    <p>For those who have been tracking <a href="http://typophile.com/node/17398" target="new" rel="nofollow">typefaces and icons on the ABC tv series LOST</a>, we now have a new entity to decipher: <a href="http://www.hansorg.com/" target="new" rel="nofollow">The Hanso Foundation</a></p><div class="imageWrap"><img src="http://typophile.com/files/lost-hansofoundation_3930.jpg"></div><p></p>
    <p>Seems that a series of seemingly inoccuous short tv spots running lately delivering somewhat half "New Age" healthy spirit and beneficial corporate foundation will help the word messages, pointing you to a phone number where no one answers... is just part of ABC's marketing scheme to build greater interest in the show LOST!</p>
    <p>Not only are they playing with the general tv viewers, but they're playing with nerdy typophiles like you and me!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/hansologo2_5888.jpg"></div><br>
    Why mix weights of Helvetica with Helvetica Condensed and Futura all in the same logo? To confuse and intrigue us into watching more episodes of LOST!<p></p>
    <p>Please correct me if I'm wrong about the typefaces (that's why you're reading this in the Type ID section).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/dharmasmall_4742.jpg"></div><p></p>
