    html: |-
      <p>Hi Marcelo,<br>
      I looked at your latest pdf. I'm certainly a beginner as well so feel free to ignore everything I write :)<br>
      The overall effect is very nice, with the shapes and colour pretty consistent and harmonious.<br>
      There are a few things that don't quite look right to my eye. The c looks a bit as if it were modelled on the e, and I think the bottom half could curve in more, as it looks a bit flat. I like e. I'd make the ear of the g heavier (longer and fatter), and perhaps lose some weight off the inside of the upper curve to balance the colour. j looks a little incomplete somehow. I think the diagonal leg of the k could be lighter. r,s and t are especially good. Maybe try stronger serifs on the z?<br>
      As for capitals, the stem of D looks a bit thin compared with the bowl. E and F and nice, but I think the lower bar of E could be too far out. The tail of the J is very heavy and will look weird if next to a C for example. M could be a bit too narrow. Tail on Q is too light I think. S and T look to be different weights.<br>
      I like your numerals. I suspect 1 will need much heavier serifs and its head may need to be wider. 3 and 5 need to harmonise a bit more. 4 looks light. 6 and 9 may be a bit too wide. 9 needs more space. It also still looks rotated!<br>
      Your punctuation is pleasant. I think £ may be out of place and need a base like your E. € could be narrower.<br>
      I hope that's useful, I'm only making suggestions so see what you think and try them out if you like.</p>
