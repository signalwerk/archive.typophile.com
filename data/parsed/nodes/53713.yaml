      <p>I might try more weight on these serifs:<br>
      - top of 'a' (possibly)<br>
      - ear of 'r' (probably)<br>
      - top of 'c' (definitely)</p>
      <p>I also think the two-way standard serifs on the baseline (fhilmnr etc etc) could be a little heavier. You might also want to extend the 'r''s bottom serif on the right even more.</p>
      <p>Because it drops towards the serif, the base of '2' doesn't look like it sits solidly on the baseline.</p>
      <p>'B' and '4' look a little dark to me.</p>
