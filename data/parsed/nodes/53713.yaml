    votes: null
    html: |-
      <p>New version of Novena text, all glyphs adjusted and “equalized”.<br>
      Finally, I guess my 9 stands on itself and all serifs fit.<br>
      As <strong>speter</strong> suggested, dots on i and j are lighter.<br>
      Let's follow with <strong>Bendy</strong> ;-) :</p>
      <ul>
      <li>Actually, the e is modelled on the c; both are modelled on the o. I like them so.</li>
      <li>The g is reshaped. I agree it needed a bolder ear it lost along the development.</li>
      <li>My will on the  j is to keep it simple. Anyway, it has changed a bit.</li>
      <li>The leg of the k is now thinner and variates up to down.</li>
      <li>I adjusted the z based on its capital.</li>
      <li>The bowl of the D is perceptually lightened.</li>
      <li>The E and the F have their bars resized in order to appear proportionally weighted.</li>
      <li>I always thought the tail of the J was heavy. I don't know why I never changed it before.</li>
      <li>May be the M looks a bit narrow yet. Let me think about it.</li>
      <li>The Q has a new tail.</li>
      <li>The S and the s are refined to fit in shape, angles and weight.</li>
      <li>Look at the new 1. I guess it appears more healthy.</li>
      <li>I put hands on 3 and 5. It was a hard task, but I think they're improved.</li>
      <li>My 4 remains (up to your point of view) light, but I don't wanna touch it by now.</li>
      <li>I redesigned 6 and 9.</li>
      <li>You were right: the £ was absolutely wrong in “ductus”.</li>
      <li>I don't like narrow versions of €. Even I consider it a character (not a logo), one must preserve something of the original logo's guidelines.</li>
      </ul>
      <p>Well, here it is Novena revamped (Notice: <a class="freelinking external" href="http://typophile.com/blog/32203" rel="nofollow">the new PDF is in <strong>my blog</strong></a>, as usual, or clicking <a class="freelinking external" href="http://typophile.com/files/Novena_Typophile_0.pdf" rel="nofollow">here</a>):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Novena_Typophile_5174.jpg"></div><p></p>
