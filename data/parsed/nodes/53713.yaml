      <p>Some additional ideas:</p>
      <p>- make B's lower bowl bigger in relation to the top bowl.</p>
      <p>- Where bowls come off stems in the caps (BDPR), consider using the same "cupping" you do for the stem-only serifs. This Goudy sample is an exaggerated version of what I'm talking about:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture_6375.gif"></div><p></p>
      <p>See how the bowl at the top swoops up before it circles down? Without that, your serifs (which are rather long) on the left sides of those letters look bent outwards. </p>
      <p>- K's leg doesn't look as stable as it should.</p>
      <p>- take another look at the humps of m, n, and u. Something's off on the drawing there - I think they thicken too fast coming out of the stem? I think that contributes to the topheavy sense of m and n that I was addressing before by suggesting heavier bottom serifs.</p>
      <p>- your cedilla has an italic slant to it - I'd make it more upright.</p>
      <p>Seek opinions from others on these ideas, too - I'm not an expert.</p>
