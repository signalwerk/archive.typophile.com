    html: <p>Besides Computer Modern, there are many free math fonts available for TeX.  Many of these will also work with other programs.  They can be obtained at <a href="http://ctan.tug.org/" rel="nofollow">CTAN</a>.  Of interest might be this <a href="http://tug.ctan.org/cgi-bin/getFile.py?fn=/info/Free_Math_Font_Survey/en/survey.pdf" rel="nofollow">survey</a> of free math fonts that can be used in TeX.</p>
