    <p>An “aperture” is a constricted opening of a <a href="/node/12748/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Glyph</a>. For example, the lowercase “e” has an aperture at 4 o’clock. This aperture is relatively small in some fonts (such as Avant Garde) and much larger (or more open) in others (such as Frutiger). It is widely believed that a relatively large aperture helps <a href="/node/19563/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">readability</a>.</p>
