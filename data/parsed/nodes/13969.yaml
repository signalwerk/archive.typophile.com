    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Aperture</strong></p>
    <p>An “aperture” is a constricted opening of a <a href="/node/12748" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Glyph</a>. For example, the lowercase “e” has an aperture at 4 o’clock. This aperture is relatively small in some fonts (such as Avant Garde) and much larger (or more open) in others (such as Frutiger). It is widely believed that a relatively large aperture helps <a href="/node/19563" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">readability</a>.</p>
    <p>See also <a href="/node/12050" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Counter</a>.</p>
