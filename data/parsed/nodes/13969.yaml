    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Aperture</strong></p>
    <p>An "aperture" is a constricted opening of a <a href="/wiki/glyph" class="freelinking" rel="nofollow">glyph</a>. For example, the lowercase "e" has an aperture at 4 o'clock. This aperture is relatively small in some fonts (such as Avant Garde) and much larger (or more open) in others (such as Frutiger). It is widely believed that a relatively large aperture helps <a href="/wiki/readability" class="freelinking" rel="nofollow">readability</a>.</p>
    <p>See also <a href="/wiki/Counter" class="freelinking" rel="nofollow">Counter</a>.</p>
