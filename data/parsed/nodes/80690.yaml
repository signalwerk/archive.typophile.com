    <p>Hello old ƒriends.</p>
    <p>A casual conversation in which I made a couple of claims has resulted in a search for evidence to back those claims, and, though I have seen this with my own eyes, I cannot find what I am thinking of. Or rather, what I am thinking oƒ.</p>
    <p>My query is threeƒold:</p>
    <p>1. What is the proper name of ƒ? Windows Character Map calls it "Latin Small Letter F With Hook." That sounds donkey, but I can't come up with a better name. All I can think of is, "You know, the eff you use when you're writing a function in math." </p>
    <p>2. When (90s?) and why (ease of typing? sorting?) did the practice of prefacing or appending folder names with ƒ on Mac OS come into practice, and how widespread was this practice? The latter question leads me to 3.</p>
    <p>3. This is where my conversation got interesting. I feel like the use of this "Fancy F" in wordmarks, particularly those set in Didone, was very trendy somewhere in the early nineties (perhaps coincidental with the nascence of desktop publishing?) But since I don't know how to search for this ƒ, I don't know how to do any research on this topic.</p>
    <p>So, wtƒ is it called?</p>
