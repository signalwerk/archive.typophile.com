    <p>This is the domain address of the (now defunct) 99fonts.com website/blog that specialised in ancient middle eastern/hebrew etc typefaces. I had noticed the guy pulled the site down some time ago, but I thought that he might be coming back...but no, so now this great name is available again !</p>
    <p>It still gets a tonne of legacy traffic (about 5000 Unique Visitors/month), so would be a great domain name for someone either starting up a new design &amp; typography blog/website, or somebody who already has one and is looking for some instant, highly targeted traffic (via 301/302 redirection).</p>
    <p>Check it out here:</p>
    <p><a href="http://cgi.ebay.com.au/99Fonts-COM-Desi" title="http://cgi.ebay.com.au/99Fonts-COM-Desi">http://cgi.ebay.com.au/99Fonts-COM-Desi</a> ... 911.c0.m14</p>
    <p>Cheers,<br>
    Pat</p>
