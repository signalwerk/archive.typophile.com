    html: <p>While I support licensing as much type from each — quality — foundry as possible, I think you limit yourself by trying to choose only one. Especially if you are just starting out. Much better to go to somewhere like FontShop — where they have a huge selection of many foundries — and find some good solid families from different places.</p>
