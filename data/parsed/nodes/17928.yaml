    <p>I am interested in obtaining a font library/collection and would like to hear from some of you the pros/cons of the various choices. Basically, I have the a good many of the workhorse fonts from the Adobe collection, but would like to purchase either it in its entirety, or another better collection. I have looked at the Linotype collection, as many of my friends have it, but am not sure if this is the best choice either. Personally, I am more interested in fonts that are finely tuned design wise, and typesetting wise, for texts, not really display or other applications. I searched the rest of the threads about the font collections, and read what was said, but it seems that nobody ever really discussed the quality of any of these libraries/collections, and how they differ from each other. This is the information that I am interested in. The monetary concerns are not something of focus at this point, for I would merely like to here about the design and quality of the typography and not how much I will have to spend in order to obtain it. Quantity is nice, but quality is always necessary.</p>
