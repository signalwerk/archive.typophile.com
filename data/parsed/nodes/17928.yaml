    html: |-
      <p>While I dislike the company itself,<br>
      Berthold Types (not nice in any way) has some great fonts, always technically advanced and beautiful letters and spacing. When the diatronic was around, the letters/spacing were better than everybody else, but the danged machine hosed almost all users, which really caused their downfall. If postscript were 5 years older, Berthold would still be in Germany. They do not have all these late great (read this SUCKY) flash in the pan fonts, but who has a better font than Formata? Caslon? Berthold Deepdene?<br>
      Oh yeah, the BQ fonta are what you want, not the BE fonts that went with Adobe Library, cause the Kerning is as limp wristed as they come.<br>
      All the best,<br>
      Rodrigue<br>
      The Truth shall set you free</p>
