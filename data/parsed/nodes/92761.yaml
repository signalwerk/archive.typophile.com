      <p>Perhaps the term ‘visualization’ in my initial post was misleading.</p>
      <p>In a 1971 paper Herman Bouma introduced a series of shape descriptions of letters around terms focussing on sidedness, expressedness (disturbed or undisturbed; rectangular or round), aspect (oblique or rectilinear), closure (or the lack of it) , extendedness. He did this with an eye on representation in the parafovea.</p>
      <p>The metamers are not literal images of representation in the periphery, but statistically representative simulations that show to what degree location, aspect, expressedness, closure (or lack of it) and extendedness are compromised in crowded parafoveal vision.</p>
      <p>The  compromise is large enough to inhibit or prevent sufficiently automatic and rapid visual word-form resolution or letter identification to support robust word recognition. </p>
      <p>The other side of the decrement is that what (of expressedness, closure, aspect, etc) is preserved seems to be at just the right level of informativeness to facilitate effective saccade planning, and provide a priming-like preview benefit.</p>
