      <p>By the way, Jeremy Freeman and Eero P. Simoncelli, the writers of the <em>Metamers</em> paper write: “We envision that our model could be used to optimize fonts, letter spacing or line spacing for robustness to crowding effects, potentially improving reading performance.”</p>
      <p>Another dimension of this line of research is that these “seeing sidelong” hypotheses conflict with the conventional interpretations of the results of eye movement studies using the ‘moving window’ and ‘boundary’ technique that claim the reader is gathering <em>letter</em> information in parafoveal preview to facilitate word recognition. Kevin Larson adopted this interpretation to make his case for parallel letter recognition in “The Scince of Word Recognition.” </p>
      <p>The most we could probably say is that the reader is gathering summary statistics pooled over multi-letter patches from parafoveal preview to facilitate word recognition and control eye movements and skipping.</p>
