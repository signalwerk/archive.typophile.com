      <blockquote><p>what the practical implications or applications might be</p></blockquote>
      <p>That is of course the central question. But look what happens to the /y in "myself" and "involuntary" in the top image; I would suggest that if the descender terminal (which is in effect a serif - hint, hint) were heftier you might (at least sometimes) end up with at least a blip in the metamer instance, leading to a better bouma. Ergo: timid extenders are dysfunctional.</p>
      <p>And I have no doubt that there are deeper guidelines to be formulated.</p>
