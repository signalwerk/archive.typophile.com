      <p><em>…accusing Freeman et. al., of homununculism is as misleading as you think the simulations might be…</em></p>
      <p>Homunculism isn’t a danger that might happen, it’s an inescapable paradox of optical science that shows images which map the ﬁeld of vision.</p>
      <p>I criticized Freeman et al.’s images from the perspective of an artist/designer, for being too naturalistic.<br>
      It seems to me that the graphic process/metaphor they have designed/chosen (“feathered” ﬁltering), which processes a high-res typographic image, could be improved upon.</p>
      <p>Their overall premise starts with Lettvin’s remarkable insight that emergent images <em>acquire</em> the quality of form, in which case generating parafoveal representations by distressing <em>already</em> fully realized Garamond is wrong.</p>
      <p>In dealing with type, researchers have an advantage over photographs of natural scenes, because the semantics of typographic imagery are pre-formatted in a manner familiar to test subjects.</p>
      <p>That is why I’m proposing that, rather than the blurry, rainy-window effect, it might be useful to represent peripheral type by something like Arbitrary Sans which looks or is partly or emergently formed, rather than post-facto distressed. </p>
      <p>I get the feeling that there is something fractal happening, in the relationship between categoric shapes as they are perceived in the centre of vision, and the periphery. The design question is, how could parametric typefaces best be used to represent the visual process? (And make no mistake, this research is also graphic design.)</p>
      <p>What are the alternatives to Photoshopping bitmapped Garamond, or simple Beowolf-style data-driven disruption of form?</p>
