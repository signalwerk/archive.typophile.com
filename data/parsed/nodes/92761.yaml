      <p>Nick, what happens at the retinal level may indeed be akin to low resolution bitmapping, but the metamers show what happens in the ‘ventral stream’ (as the title of the metamer paper indicates).</p>
      <p>The ventral stream is the ‘belly’ or bottom part of the brain that includes the visual cortex and what has been dubbed the Visual Word Form Area. (The term Visual Word Form Area is controversial — my working tag for it is Intrinsic Integration Interface — but that's another story).</p>
      <p>There is a ‘cortical magnification factor’ as information travels through the visual cortex, which compounds the issues surrounding the coarseness of the representation at the retinal level*, forcing a ‘pooling’ or ‘compulsory averaging’ of featural and positional statistics. The positional uncertainty and structural ambiguities captured in the metamers are the result of the compulsory averaging and pooling. </p>
      <p>Since researchers are now able to quantify the degree of pooling, accurate simulations of positional uncertainty and structural ambiguities are available using metamers.</p>
      <p>*[adding to clarify] representation at the retinal level is constrained or limited by the lower density of rods and cones than in the fovea.</p>
