      <p>I’ve always thought peripheral vision was quantized, rather than uniformly blurry.<br>
      I don’t believe distress (the “metamer” shown) is an adequate metaphor, either.<br>
      I suggest low res bitmapping.<br>
      Speaking of analogies from technology, how about the way the blind spot is ﬁlled in?<br>
      Just like Photoshop’s clone tool.<br>
      And if one sees the blind spot cloned in that manner, wouldn’t that suggest that there is a huge element of projected meaning shaping the periphery, not just raw interpretation of shapes? So what one “sees” already has a primitive typo-matrix-like form (because the reader is aware of the kind of document being read, so expects a certain kind of text to be in a certain place), assumed to have the fundamental structure of proto-text, not the decayed appearance of processed text.</p>
      <p>And why do we assume that the image seen in the fovea is sharp and fully detailed like a photograph? If non-typographers can’t see the difference between Times and Century, why do we represent what they see by a fully-detailed image? Surely we only see what we recognize.</p>
      <p>Just because light falls on the retina, doesn’t mean that it becomes information which has to be fully processed. There must be some redundancy built in, to predictively turn off rods and cones deemed irrelevant once a certain amount of semantic closure has occurred.</p>
      <p>As Blake observed, if the doors of perception were cleansed, everything would appear as it is—infinite.</p>
