      <p>Nick [S], despite your caveats and comparisons I think the images are telling and the research enlightening. The synthesizing of the images is quantitatively controlled. It would be like controlling the randomization in Beowulf with evidence-based pooling algorithms, and extending this to stroke location and combination.</p>
      <p>The danger of [metaphysical and empirical] homunuculism is always there in theories of representation. This fed the representationalist / anti-representationalist debate in cognitive science sparked by Hubert Dreyfus’s and Tim Van Gelder in the early years of AI. I'm not sure of the current status of the debate, but accusing Freeman et. al., of homununculism is as misleading as you think the simulations might be. </p>
      <p>Here's the cover of a 1999 book on the debate.</p><div class="imageWrap"><img src="http://typophile.com/files/41PNLSn7uTL_4520._SS500_.jpg"></div><p></p>
