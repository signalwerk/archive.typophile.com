      <p>The name Arbitrary Sans is a clue, suggesting that the letter forms are not fully resolved, which is indeed the case.<br>
       </p><div class="imageWrap"><img src="http://typophile.com/files/arbitrary_5605.png"></div><br>
      In the /a for instance, the lower right terminal is decisively rendered, but it appears to be neither quite big enough for a typical curled serif in that position, nor is it the subtle splaying of the vertical stem that is another standard treatment. It is deliberately indecisive with regard to the reader’s expectation. Protean, even.<p></p>
      <p>This form therefore corresponds to Lettvin’s “I don’t exactly know but I’m beginning to get an idea” process of deciphering which underlies the research being discussed.</p>
      <p>With this principle, text in different areas of the ﬁeld of vision could be represented by parametric variants of a typeface, quantitatively deployed.</p>
