      <p>Metamers of Moby Dick — or any other text — in a condensed sans serif font, versus metamers of the same text in a non-condensed version of the same typeface might indicate that patch discriminability is significantly compromised in the condensed, signaling a possible reduced parafoveal preview benefit and a disruption of eye-movement mechanics. Patch discriminability might be compromised, because, for example, the less pronounced obliquity, as in the arms of the x or the legs of the w might make the summary statistics of patches containing these forms less divergent from those that don't, hence less informative.</p>
      <p>The predictions could than be tested in the domain of eye-movement and parafoveal preview benefit research, and the results used to give evidential support to our intuitions about typeface selection for extended texts. It might also become possible to <em>plot</em> the ratio of condensation to the disruption of the parafoveal preview benefit and optimal eye-movement mechanics.</p>
      <p>The effect of serifs on patch discriminability could also be looked at.</p>
      <p>So no direct formula to delineate particularly effective letterforms, but contextual knowledge about what kind of manipulations have what sort of effect, and in what part of the reading process.</p>
      <p>[cross-posted with Hrant's post just above, whose observation is I think correct]</p>
