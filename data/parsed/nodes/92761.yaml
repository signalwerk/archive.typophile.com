      <p>@Peter: <em>…the metamers show what happens in the ‘ventral stream’</em></p>
      <p>But how do they show it? They look like a real image and not enough like a diagram—homunculism. They are a picture impersonating a diagram (or is it vice versa?), and will be interpreted as what peripheral vision “really” looks like.</p>
      <p>They are a piece of graphic design (see the method quoted below) which may be able to simulate experimental results. But are they any less of a metaphor than simple blurring?</p>
      <p>They are misleading, because they are high res. They (and the other grunged-up photos) lend allure to the research, but they are somewhat of a misrepresentation, because even scientists who read and understand the paper will nonetheless think that this is what the retinal ﬁeld of vision looks like, when in fact <em><strong>it doesn’t look like anything!</strong></em></p>
      <blockquote><p>“Synthetic images were then generated by initializing them with samples of Gaussian white noise and iteratively adjusting them (using a variant of gradient descent) until they matched the model responses of the original image (see Online Methods).”</p></blockquote>
      <p>I assume that blurring was also used to bring the noised image back to a consistent resolution across the entire image (why?).</p>
      <p>This is a fairly common Photoshop technique: ﬁrst you distress the image in a rough and graphic manner, then you smooth it so that it looks more naturalistic. A gradient mask blends the ﬁltered selection into the rest of the image. It may be used in retouching skin, for instance, to tone down blemishes.</p>
      <p>There are several deconstructed typefaces, mostly designed in the early 1990s, that might also be considered to represent what happens in the ventral stream, but with a degree of simple formality in their distress. Types such as Arbitrary Sans suggest an alternative en-masse effect to the trope of this research, which reminded me of this from <em>Casablanca</em>: </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Casablanca_4596.jpg"></div><p></p>
