  html: |-
    <p>Hello,<br>
    I am looking for a digital font that is close to this sample, printed from metal letters. The lowercase ‘a’ and ‘g’ are pretty distinctive.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/gothic_3475.gif"></div><br>
    I found <a href="http://www.myfonts.com/fonts/agfa/atgothic-extended/" rel="nofollow">AT Gothic Extended</a> from Agfa/Monotype – which actually is very good. Alas, there seems to be only one single weight available (Extra Light). Do you know a font with a similar appearance that has more styles?<p></p>
    <p>Thank you,<br>
    Florian</p>
    <p>edit: I came across <a href="http://www.myfonts.com/fonts/chank/adrianna/" rel="nofollow">Adrianna</a>. It offers a wider range in weights, but has some disadvantages, too: considerably smaller x-height and some wayward characters: c, e, g for example.<br>
    And I saw <a href="http://www.typophile.com/node/38174" rel="nofollow">this old thread on Splendid Grotesk</a> – Erkki, are you still around?</p>
