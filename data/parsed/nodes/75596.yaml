    <p>Hi everyone,</p>
    <p>i have a question concerning a typeface i'm working on (nothing fancy, still learning and experimenting)</p>
    <p>Sometimes the left/right single quotation marks as well as the double quotation marks just don't work all the time when i try and type them in Indesign, they do work sometimes when i use the alt-option key but not without, well sometimes they work.</p>
    <p>Also a strange thing is that when i type some text in MS word with this same exact font, everything works except when i type the quotation marks it shows default Times New Roman instead of the quotation marks that belong to the typeface. I did check for open contours in fontlab or something like that but couldn't find it. Does annyone please know what this problem could be because i really can't figure it out myself. </p>
    <p>Oh i did check indesigns setting for typographers quotes and all seems ok</p>
    <p>Evie</p>
