    html: "<p>Pre-Unicode legacy. <a href=\"http://en.wikipedia.org/wiki/Code_page_1252\" rel=\"nofollow\">This is the encoding of Latin-1 native to Windows.</a> First of all, the code is in decimal so that it can be entered on the keypad: To get é you type Alt+0233. In Unicode é is Ux00e9, which is hexadecimal for two hundred and thirty-three. Secondly, the quotation marks are in the two rows of characters which don't match up with Unicode at all. In the history of computing there have been dozens of various encodings and changing standards, so in terms of the final fit it could have been a lot worse.</p>"
