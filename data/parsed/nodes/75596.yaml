    html: |-
      <p>How to directly enter Unicode on a Windows platform, with InDesign:</p>
      <p>1. make sure *Num Lock* is on.</p>
      <p>2. Whilst holding down the "alt" key, hit (on the numeric keypad) *plus* then the Unicode numbers. For an alpha character, use the regular keyboard, of course.</p>
      <p>That's all there is to it. No change to the System preferences or anything else.</p>
    html_clean: |-
