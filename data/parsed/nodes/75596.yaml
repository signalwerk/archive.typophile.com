    html: |-
      <p>&gt; i'd like to try it out using the unicode numbers in Indesign, i'm on a mac does annyone know how this could be done please?</p>
      <p>What I do:</p>
      <p>Go to System preferences &gt; Language &amp; Text &gt; Input Sources &gt; activate Unicode Hex Input.</p>
      <p>Now you should see some little flag at the top of the bar in Finder (which flag you see depends on what language your keyboard is). Click it and change it to Unicode Six Input.</p>
      <p>Now, in InDesign: press alt (also called option) while you press any Unicode number you want. It should work everywhere, for example here:</p>
      <p>alt 2018: ‘<br>
      alt 2019: ’<br>
      alt 201c: “<br>
      alt 201d: ”</p>
      <p>Now, how do you do this in Windows?</p>
    html_clean: |-
