    <p>I am working on a big publication project (for school) about Hoefler and Frere-Jones and I’m having trouble finding good photos of the guys. Everything I have is scanned from design magazines, but the dot screen in those magazines is giving me the most horrible moire patterns I’ve ever had to deal with. Does anyone have some good photos of Jonathan and Tobias from conventions?</p>
