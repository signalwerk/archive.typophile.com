    date: 2003-11-26T08:52:00
    votes: null
    html: "<p>Thanks guys! <br> <br>to hhp: could be worse than \"barely\", think of \"pajero\"... <br> <br>to randy: a lot of stuff and very helpful. As soon  as I checked those things you'll hear and see more.  <br> <br>Where does this optical illusion result from, or is it not explainable? <br> <br> <br></p>"
  - id: 17404
    user_id: 618
    user_name: aquatoad
    user_path: null
    date_raw: 26 Nov 2003 — 11:00am
    date: 2003-11-26T11:00:00
    votes: null
    html: '<p>Hi Dominik, <br> <br>Here is another diagram that shows the optical illusion a little better: <br><img src="http://www.typophile.com/forums/messages/29/21352.gif" alt=""> <br>Here is the nature of the optical illusion. The more acute the angle, the more adjustment is needed. A + would need no adjustment! <br><img src="http://www.typophile.com/forums/messages/29/21353.gif" alt=""> <br>Does that answer it? <br>Randy</p>'
