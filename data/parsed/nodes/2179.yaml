    html: |-
      <p>Finally I found time to complete the spacing and do the text setting, which you can see in the attached PDF. <br> <br>After printing out some pages, on my cheap low-res home printer, I felt the color of the face was a little to dark for longer texts. What do you think. <br> <br>I'm not a 100% sure about the Caps. Sometimes I think they're too high, sometimes I feel they're just right. I tried smaller ones but they also didn't satisfy me. <br> <br>I awarwness of legal issues: The typeface resulted from my own sketches. "Nuri" didn't influence the design process  and my ideas nor have seen it before ;-). <br> <br>Servus <br> <br>Dominik <br> <br> <br></p>
