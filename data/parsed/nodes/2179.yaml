    html: "<p>Hi Randy. <br> <br>So it's a human fault. And this is what was meant by : \"typedesign doesn't always follow mathematical correctness\"(vaguely quoted). One of the sentences I could always accept but never really understood fully. <br> <br>Still working on apena. <br> <br>Servus <br> <br>Dominik</p>"
