    date: 2003-11-25T13:52:00
    votes: null
    html: <p>I think you went a bit too far making the head serifs smaller. <br>The new "f", "g" and "t" are very nice. <br> <br>BTW, in Spanish "apenas" means "barely"... <br> <br>hhp <br></p>
  - id: 17402
    user_id: 618
    user_name: aquatoad
    user_path: null
    date_raw: 25 Nov 2003 — 2:34pm
    date: 2003-11-25T14:34:00
    votes: null
    html: "<p>Hi Dominik, <br> <br>This looks nice! <br>I don't think you went too far with the head serifs :-) <br> <br>f: I think it wants the same kind of terminal as your y and r. (Though I'd choose beaks not ball terminals.) Also, it curves too abruptly. Look at the c for more of the flavor. <br> <br>hmn: the h and n are too narrow. The m looks like 2 n's. keep the m, and widen the h and n. <br> <br>r: The arm joins to high (same place as the n). Lower that down for better color. I'd also make it narrower. (and do a beak like the f) <br> <br>s: I'd take a touch of weight out of the curves and put it into the spine. <br> <br>vw: take in the serifs a bit. These letters cause spacing problems as it is. More serifs mean too much white space around the letter. <br> <br>x: looks like he's just kicked a soccer ball. ie, the bottom right should extend below the baseline (too high now). Also, you are in the presence of an optical illusion: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/21279.gif\" alt=\"\"> <br> <br>Sliding the thins left and right does two things: <br>1. Fixes the optical illusion and makes them look like they're connected. <br>2. Helps the shape fit into a trapazoid: <br><img src=\"http://www.typophile.com/forums/messages/29/21280.gif\" alt=\"\"> <br>You want the trapezoid shape so the letters don't feel like they are leaning, and are nicely balanced on the ground. Check your x,s,g,z <br> <br>y: A little wider up top (left) <br> <br>p: decide what you want. I'd put a serif on the left side of the decender too. Keep the form for the q. <br> <br>Keep it up! <br>Randy <br></p>"
  - id: 17403
    user_id: 2323
    user_name: golfomat
