    date_raw: 13 Jan 2004 — 1:01pm
    date: 2004-01-13T13:01:00
    votes: null
    html: "<p>Looking good! Your curves a bit wobbly though (like look at the \"c\" and the \"G\"). The ear of the \"q\" is too clotty. The \"r\" is too wide. <br> <br>Weight: It is slightly dark, even for my tastes. But in any case don't trust low-end printers: they make small text totally different (and darker) than the \"real\" (imagesetter) output. <br> <br>Spacing: A bit tight overall, but too irregular anyway. Look at \"molor\" on your second line for a benchmark of good spacing. <br> <br>Cap size is fine - a bit big even. But the cap structures still need some work. <br> <br>hhp <br></p>"
  - id: 17411
    user_id: 2323
    user_name: golfomat
    user_path: null
    date_raw: 14 Jan 2004 — 12:39am
    date: 2004-01-14T00:39:00
    votes: null
    html: "<p>Thanks for your tips hrant. <br> <br>I'm always astonished when I realize how obvious things are that I don't see by myself. But that's another topic. <br> <br>The spacing issue: This was a first lousy effort now. Something deep inside me told me they're to tight. But then again, thinking of enconmical issues (which I should, with what I know, perhaps leave out right now) I wanted to have it tight, to be able to press as much text on one page as possible.   <br> <br>The relation lc/uc is 2/3. But I think due to the narrowness, as you claimed, I felt the smaller Caps I tried were way to small for Reading. <br> <br>How do you normally fix those small bugs? I mean should there be some, do you always realize it or do they have to be pointed out by someone else? <br> <br>Servus  <br> <br>Dominik <br> <br></p>"
  - id: 17412
    user_id: 1250
