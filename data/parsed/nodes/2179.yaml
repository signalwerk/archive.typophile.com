  date: 2003-11-23T12:30:00
  votes: null
  html: <p>This is the lc of a typeface I design for my personal correspondence. I wanted to approach a mixture between classic and modern. <br>Please tell me where I could do some improvements. <br>(and there are some for sure, look at v,w,y,y,z(I was fighting with these))  <br>My main aim was to have good counterforms.   <br>Nothing further to say about it yet, expect I hope you'll like it.  <br> <br>Dominik <br><img src="http://www.typophile.com/forums/messages/29/21084.gif" alt=""></p>
comments:
  - id: 17399
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 24 Nov 2003 — 10:12am
    date: 2003-11-24T10:12:00
    votes: null
    html: "<p>There are some things I really like (such as the shy top of the \"a\"), but I have two big complaints: <br>- The strong head serifs are pulling the design counter-clockwise (which is not easy to counteract). <br>- The widths are inconsistent, like look at the \"b\" versus the \"h\". <br> <br>Some specific suggestions: <br>- The \"f\" is too soft and big on top. <br>- The \"g\" is too mannered: tame the ear, and make the head smaller. <br>- The \"k\" is wonderful, although in the \"too narrow\" group. <br>- Put a notch in the ear of the \"q\". <br>- Tame the beak of the \"r\". <br>- Make the \"t\" stronger. <br>- I actually like the \"v\" et al. <br>- Open up the \"x\". <br>- The \"z\" is too blocky. <br> <br>BTW, your vertical proportions are right on for use at small sizes (like 9 pt), and the darkish color matches that too. On the other hand, overall it's too narrow for small sizes. <br> <br>hhp <br></p>"
  - id: 17400
    user_id: 2323
    user_name: golfomat
    user_path: null
    date_raw: 25 Nov 2003 — 10:14am
    date: 2003-11-25T10:14:00
    votes: null
    html: "<p>Thanks for your Tips Hrant, they have been very useful. Sometimes somebody else has to open up your eyes. <br> <br>I hope I understood everything in the right way. <br>I decided to change the head serifs for some smaller .  <br>My problem still is the color of \"v et al.\" , as you said, they appear as if they didn't belong to the typeface. <br> <br>I was fighting hard with the g and decided fo a closed version, the other one (you don't see) with the opened tail was way too disturbing for text. <br> <br>Generally I have to thank all who post here at typophile, since I have learned a lot from this thread yet. <br> <br>I also found a nname for it now: \"apena\". It's senseless, but the word looks good if you set in apena. <br> <br>Servus <br> <br>Dominik<img src=\"http://www.typophile.com/forums/messages/29/21228.gif\" alt=\"\"></p>"
  - id: 17401
    user_id: 1250
    user_name: hrant
