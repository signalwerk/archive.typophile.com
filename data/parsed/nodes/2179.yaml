    date: 2003-12-27T06:47:00
    votes: null
    html: <p>I'm back again. <br> <br>I had a long fight with the uppercase. I couldn't really decide about the proportion of these. I didn't like them to have same width all over (as far as this is possible). So I took a base rectangle and tried to construct them.  <br> <br>Further I changed the lc "s" again and made it a bit narrower. I didn't like the look of two wide "ss" standing next to each other. (An "ss" ligature comes to my mind right now, because if the "s" stands alone at the beginning it looks a bit small now) <br> <br>Next thing I'll get done is the spacing. I played arround a bit and had some good results. (I used the summary in "Type &amp; Typography"). <br>But after changing some character widths I quickly used FOG's autop spacing and lost it all again. <br>The optical spacing feature in InDesign wasn't better though, the type seemed like "gesperrt" (I don't know the english term right now). I had to correct it by at least "-50" to get a good result. <br>So I hope I can provide a text setting soon. <br> <br>These were my problems so far. Next on the list are the Itallics. guess I'll have a lot of fun with them, too.  <br> <br> <br>Servus  <br> <br>Dominik <br> <br>  <img src="http://www.typophile.com/forums/messages/29/23018.gif" alt="apena serif"></p>
