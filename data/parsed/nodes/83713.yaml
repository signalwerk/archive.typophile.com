    html: |-
      <p>Your design resembles that of The Guardian newspaper – two colors, all lowercase, no spaces, similar typefaces (by the same co-designer). First-time visitors may have to stop and rescan, involving more context, to understand that this is an entirely different, independent product. While this would all happen very quickly, it's certainly not desirable.</p>
      <p>Since The Guardian's brand awareness is not something you can do anything about, an all new, radically different sketch for your masthead might be worth a try.</p>
