      <p>What would it look like if you did "glasgowguardian.co.uk" all in the same font, then just had the "guardian" part stand out in red? In all honesty, I'm terribly fond of the first masthead, I think it looks nice. I think I would play with the kerning a little bit, it seems like "guardian" is much tighter than the other parts, probably due to the fonts, but it kind of messes with the flow. Definitely tighten up the ".co.uk" part, if anything. Maybe you could play with the black, maybe a gray might look nice? I dunno, I'm just throwing out some ideas.</p>
      <p>In general, my feeling about it is that I prefer the lowercase and sans-serif font. It just looks more modern--your other designs look good to me, but just not really for a student newspaper.</p>
    html_clean: |-
