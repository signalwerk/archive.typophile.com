    html: |-
      <p>A bit of a side point (I'll have another draft up tomorrow for the community's acute verdict) but... Here's the thing: I don't actually like futura. It's just a good G for the purpose. I've tried many ways the last few weeks of using futura to match our new logo, but even for headlines and display text it just doesn't work.</p>
      <p>As soon as you have more than one character of futura it starts getting muddled. Too full of lines, no prose. Upper case words occasionally have so much symmetry that you have to accept and admire the ostentatious clarity, but try doing a lowercase URL or a block of text.</p>
      <p>Right, so in conclusion **** futura. i'll post something else as unfutura as it gets tomorrow. End of rant :)</p>
    html_clean: |-
