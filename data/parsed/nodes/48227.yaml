      <p>Alright, after days of researches and dozens of attempts I finally got that font out of a PDF file that was containing it. By the way, Bell totally missed that part with the PDF which was a documentation about their website design at Bell.ca, and you can find it relatively easy in google... so yeah, I got that PDF and extracted the font from there.</p>
      <p>Now, I know some of you might say that it is stealing and all that, but hey! who is the idiot that is going to use it in commercial purposes? So be careful - for personal and noncommercial use only(!!!) as the font belongs to Bell Company and its designer, Ian Brignell.</p>
      <p>ENJOY!<br><strong>"BellSlim Regular"</strong><br>
      [[ link removed by Admin ]]</p>
      <p>And here is a pic that I made using this font:<br><img src="/web/20191014001231im_/http://www.typophile.com/sites/default/files/old-images/bell font_4334.jpg"><br>
      *Note: The "Bell" font is just "Century Gothic - Bold", not sure if it is the actual one used for the "Bell" logo, but it is very similar...*</p>
      <p>By the way, according to the PDF, there is indeed another version of the "BoldSlim" font in SemiBold, but unfortunately, it was not used in the PDF itself, so I don't have it.</p>
      <p>Cheers,<br>
      osallivan</p>
