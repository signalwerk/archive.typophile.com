      <p>After a bit of detective work I figured out that this is a new typeface called BellSlim designed this year by Canadian type designer <a href="https://web.archive.org/web/20191014001231/http://www.ianbrignellletteringdesign.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Ian Brignell</a>. You can read a small bit about him <a href="https://web.archive.org/web/20191014001231/http://villatype.blogspot.com/2008/04/type-club-review-part-2-ian-brignell.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>. </p>
      <p>There is no reference to BellSlim anywhere online as far as I can gather but here is a link to the <a href="https://web.archive.org/web/20191014001231/http://www.bell.ca/web/flash/bellSlim.swf" title="Click to visit an external URL." class="freelink freelink-external freelink-external">flash route file</a> that the Bell website is using to render the font with (the same sIFR system typophile uses). The specific name of the font being used is BellSlim Regular which might suggest that there are more weights in existence.</p>
    html_clean: |-
