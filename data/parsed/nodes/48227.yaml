    html: |-
      <p>Well, my dad's worked for Bell Canada for longer than I've been alive and I've seen quite a few versions of their identity throughout my life (yes, we have some Bell antiques around the house too)</p>
      <p>I will say that for a company whose main focus is telecommunications, except for the logo just before this re-brand (the spinning-head logo as it was affectionately known), Bell has always had good design in their print materials.</p>
      <p>This logo is a modern take on their logo from the 1970s, which was just the word <em>Bell</em> in a bold Sans.  I don't watch any old-school television (internet television like <em>revision3.com</em> all the way!) so I regretfully haven't seen any of the TV ads, and am bewildered as to why they have chosen to embolden random letters on their website, but I'm sure it makes sense to somebody somewhere.</p>
      <p>I think this re-brand is needed to freshen up the corporate image a little bit, the other one was easily datable as 1990s, and this will obviously be somewhat dated in the future, but I think it has much much more potential and staying power than the one that preceded it.</p>
    html_clean: |-
