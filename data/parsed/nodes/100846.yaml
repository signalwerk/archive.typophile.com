      <p>Such risks come with the territory. And anyway people can copy your idea and do a better job selling it, so it's sort of moot... Plus if you make your idea public you have a weapon against plagiarism, since you can establish a date (although you won't really have Proof).</p>
      <p>What you might do is develop the idea enough to have a big head start, then show it to get feedback.</p>
