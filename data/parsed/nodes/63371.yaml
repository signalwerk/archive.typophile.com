    <p>I came across this today, and thought other type-enthousiasts might enjoy it. It's an applet written in Processing that creates a dynamic typeface.</p>
    <p>source: laikafont.ch</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/laika_5641.gif"></div><p></p>
    <p><em>Type has always been something static.<br>
    In considering type we speak, for example, in terms of bold, thin, grotesque, classical, roman, italic: terms that all describe a defined variant of the font family. Thus we only ever see individual fixed points in what is actually an infinitely wide space of possibilities.</em></p>
    <p>With digitalisation, however, typeface has left its manifest image – cast in lead – behind, and with it all the associated limitations. Computer-based applications, the Internet and new, fluid advertising media allow us to go beyond the existing, static view of typography.</p>
    <p>LAIKA is neither bold nor thin, but swings between these two extremes. Its form is no longer defined statically, but alters dynamically. As well as the font’s weight, the stroke contrast, serif lengths and italic angles of the font all behave dynamically too. All these parameters can be driven and influenced by a range of inputs, in order to create a typeface that changes constantly in real time.</p>
    <p>LAIKA requires a whole new, dynamic understanding of typography.</p>
    <p><a href="http://laikafont.ch/About_eng.html" title="http://laikafont.ch/About_eng.html">http://laikafont.ch/About_eng.html</a><br>
    <a href="http://laikafont.ch/applet/test_eng.html" title="http://laikafont.ch/applet/test_eng.html">http://laikafont.ch/applet/test_eng.html</a></p>
