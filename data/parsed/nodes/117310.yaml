  html: |-
    <p>Hello friendly font-specialists,</p>
    <p>I am looking for the name of this font. It is printed in a youth game-book. The topic are computers and hackers. I tried Identifont and WTF but I could not find the right one. The Stop-font was pretty close but not an exact match. The book is printed in Germany in the year 2011.</p>
    <p>Please excuse the bad picture I can try to take another one if the quality is to bad to identify it.</p>
    <p><a href="http://www.pic-upload.de/view-23579884/fontid.png.html" rel="nofollow"><img src="http://www11.pic-upload.de/thumb/17.06.14/kgoqav1zinbp.png" alt="Bild hochladen"></a></p>
    <p><a href="http://www.pic-upload.de/view-23581245/10422421_812777048734728_6227998616913938149_n.jpg.html" rel="nofollow"><img src="http://www11.pic-upload.de/thumb/17.06.14/tclru3y1z8qh.jpg" alt="Bild hochladen"></a></p>
    <p>Thank you in advance. </p>
    <p>Best regards<br>
    Palme</p>
