  html: |-
    <p>This is not exactly an ID, but I was wondering if anyone knew a typeface that contains alternates like the 'N' in this sample. I know this is HFJ Requiem and only for Nature Conservancy, but I am curious about other available fonts that have elaborate swashes on both sides of the 'N' like this one.</p>
    <p>Thanks in advance for any help!</p>
