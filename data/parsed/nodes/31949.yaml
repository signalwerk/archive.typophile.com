      <p>I have been working with Pageflex for a few years now. The draw back to the system is it's price tag and the fact that you need to create a web application around it if you do not have PageFlex Storefront. Training from PageFlex is minimal and most companies that have even purchased Storefront do not know how to use it and end up shelving the software. So, most companies who have a license and have the knowledge on how to use it are setting up applications to offer a solution to other companies to be able to utilize the capabilitites PF offers without having to purchase their own licenses which can range $100,000 upwards once you add in the additional software and hardware needed for it. I have my own company and we have an online application which does just this. We can set up multiple Accounts with multiple users to be able to utilize the power of Pageflex for variable data and also manage documents, inventory items, Promotional items, PURLs, Landing Pages, etc. We have found that there are other types of softwares that do similar data merging but are more limited than PageFlex. One is XMPie and this works with Adobe's InDesign. </p>
      <p>As companies have become more informed on variable data and marketing techniques utilizing more personalization the need for this type of a software has grown. Most companies realize now more than ever that consumers are getting harder to reach and that their messages need to stand out more to catch the attention of the consumer. Companies want control over their brand marketing and reduce costs. An application set up utilizing PageFlex gives companies an a way to control brand marketing, increase their ROI, and reduce costs, one template can service many users with text, images and even design aspects easily changed on the fly inaccordance to rules set up either based on user profiles or databases.</p>
      <p>I can't tell you much about how Bitstream manages the font licensing or how I think this will effect licensing. Fonts are stored on the Pageflex server which is Windows based. Fonts do need be be able to be embedded into PDFs since this is one of the print output formats. If you think about it, don't companies provide their fonts to vendors every time they package pieces for print now and wouldn't this effect licensing also?</p>
