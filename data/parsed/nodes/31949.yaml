      <p>Indeed.</p>
      <p>I think products like this can (and "can" is the operative word) be very useful in the right circumstance, but I'm not sure I'd recommend using InCopy as-is out of the box.  </p>
      <p>Part of that stems from the defaults, I think: my experience is that unless the InDesign person sets things up so that when the InCopy folks change files, they don't automatically update the InDesign one. I'd set them up to proof the InCopy files the same way I do with Track Changes in Word, so I can see what exactly they've done.  Would be nice if that was the default, but it isn't, and you need a fair bit of knowledge up front to do it.</p>
      <p>(Had one client that insisted on making style changes in a document that they weren't supposed to tinker with, and every time I got the file back from them, I had to reset the styles.  This went on for months....)</p>
