    <p>I've been offered some work with a system called Pageflex, made by Bitstream. Has anyone any experience with this package, or any like it? I'm giving it some thought and wondered if anyone here is uses it or any similar systems (e.g. Quark Server). I'm trying to weigh up whether this system is likely to be in demand or if it will simply vanish whenever Adobe decide to incorporate it into InDesign.</p>
    <p><a href="http://www.bitstream.com/publishing/" title="http://www.bitstream.com/publishing/">http://www.bitstream.com/publishing/</a></p>
    <p>Also I'd also be interested to hear some opinions on how this kind of server technology impacts on font licencing. For example, a font is likely to only be installed on one computer but used by 100s of users to create documents via a web browser. In theory this will eventually lead to the end of large multi-user licences that companies must buy at the moment. Any idea how Bitstream licence their fonts for this?</p>
    <p>By the way, for anyone who can't be bothered to read through Bitstream's rather dull webpage, Pageflex is a server based application whereby all layout files, images, EPSs and fonts are stored on the server and users are able to make low level changes themselves (edit text and images) via a web browser. It can be used for everything from mail merge type usage for letters and business cards at one end of the scale (which currently doesn't require multi-user licencing) to being used by whole marketing departments for the upkeep of corporate literature at the other (currently requiring a multi-user or site licence).</p>
    <p>At the minute its looking like font companies are going to have to change from one-licence-per-CPU to one-licence-per-user licencing.</p>
    <p>Any thoughts?</p>
