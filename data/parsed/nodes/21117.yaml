      <p>Similarly, the longest Danish word attested is <em>landsbyskolelærerenkealderdoms­forsørgelseskasseselskabsbestyrelsesnæstformandssuppleant</em>, which could also easily be expanded even further.</p>
      <p>This word has been used, though. By the local police in Horsens back in the 1940s. As a spirits test. If you were unable to say this word, you were apparently drunk.</p>
      <p>I’m quite glad I didn’t live in Horsens in the 1940s.</p>
      <p>&nbsp;</p>
      <p><cite>«There is a theory, of Noordzij and Saenger that the re-introduction of word spaces by Irish monks in the 8th century enabled silent reading and was a big breakthough. I am wondering whether native speakers of Latin and Greek could read just as quickly without word spaces. I know Latin is highly conjugated, and I’ve heard the same about Greek, so it may be that word endings are easy to recognize.</cite></p>
      <p>My guess is that the reintroduction of word spaces was because the Irish monks’ Latin was not as good as their continental colleagues, so it was more difficult for them to read continuous texts; also they wanted to write Gaelic, which maybe has less end-of-word markers...»</p>
      <p>A few points here.</p>
      <p>Firstly, there are still languages that do not employ spacing in writing—Chinese and Japanese are prime examples, and I believe Thai is completely spaceless, too. It is only familiarity with the language that enables the reader to correctly separate words. Especially in Chinese and Thai, which are both completely analytic languages that do not inflect in any way (this is true of Chinese; my Thai is nonexistent, so I’m not entirely sure here, but I believe it too is purely analytic), this causes confusion and trouble for the foreign learner, but not for the native speaker. Even after nearly six years with Chinese, I still find myself often misreading things because I combine the wrong two characters and form words that make no sense in the context.</p>
      <p>Secondly, by the 7th and 8th centuries, Irish was just coming out of two centuries of heavy linguistic turmoil, wherein the entire language had more or less fallen completely apart and created out of its own ashes an entirely new (and unbelievably complex) grammatical system. Part of this new system was the initial mutations, resulting from apocope of earlier word endings.</p>
      <p>These were, however, not systematically indicated in writing at that time, so I can imagine it would have been quite useful to add spaces, just to know how to pronounce words. Especially since certain cases could be easily misunderstood if not separated; example: <em>accat</em> could mean either ‘at/by a cat’ or ‘their cat’, depending on whether it is separated as <em>ac cat</em> (&nbsp;=&nbsp;Modern Irish <em>ag cat</em>) or <em>a ccat</em> (&nbsp;=&nbsp;Modern Irish <em>a gcat</em>).</p>
      <p>The structure of Old Irish made ambiguities like this one very common, and seem to me a good reason (in addition to your own guesses, which I think are probably also factors) to add spaces.</p>
    html_clean: |-
