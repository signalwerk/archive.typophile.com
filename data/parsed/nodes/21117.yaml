      <p>It started when I was looking for text from foreign languages to test my typeface designs.  I was looking for letter combinations which were not very typical in English.  I started seeing these enormous words in some languages as well as concentrations of either vowels or consonants in other languages. This all made me quite curious why words got to be so big in some languages.  From this thread, I've learned that it is normal in some languages to just combine words without spaces and that everyone is quite comfortable with it.<br>
      I am always on the lookout for intriguing texts to test type with in any language using Latin, Greek, or Cyrillic scripts. I look for subject areas which might match the face I am drawing--music, science, art periods, humor or abstract things like darkness and lightness.</p>
      <p>ChrisL</p>
