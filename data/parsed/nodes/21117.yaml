      <p>@William<br>
      As a drastic example,<br>
      the term "Donaudampfschifffahrtsgesellschaft" - (very badly) translated in "Danubian steamboat-shipping corporation" - has several combined words (and stems) in it.</p>
      <p>Donau (danube), Dampf (steam), Schiff (ship), Fahrt (ride), Gesellschaft (corporation) and "combined words", terms like Dampfschiff ("steamship", steamboat), Schifffahrt (shipping).</p>
      <p>This example is hard to read for native german-speaking people too, but a "normal term" like "The declaration of independence" - "Die Unabhängigkeitserklärung" is easy to read for native germans. It depends how many words and stems are combined in one term... you got to be used to... that's all :)</p>
