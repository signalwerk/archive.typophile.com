      <p>Don't confuse the fact that in German composed words are written in one word and the tendency towards longer words (written in one or not).</p>
      <p>The fact that we write composed words in one word is necessary because the word order is not fixed like in English. Unfortunately, this principle is not followed by everyone anymore.</p>
      <p>Most words are longer because of our naive way of describing things rather than using new words. For example, glove is actually Handschuh (handshoe) in German. This makes texts longer but on the other hand, many technical terms are easier to understand for laymen.</p>
