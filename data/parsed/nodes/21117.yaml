      <p>When I was working on the history of the theory of relativity, I had to read about the velocity of light in three languages. This phrase really give the feel of the three languages. French: velocité de la lumiere. German: lichtfortpflanzungsgeschwindigkeit.</p>
      <p>English: shortest. French: prettiest. German: most exact, but a mouthful.  </p>
      <p>I wonder: are German speakers (and those in other languages with a similar device) slowed down by the aggregation of nouns like this, with no word spacing?</p>
