      <p>You mean, they think slow?&nbsp;&nbsp;;-)</p>
      <p>I don't think so. The long words you found are the exception rather than the rule. As to philosophical or scientific texts -- once you figure out what someone means by a longer word (which has more to do with the interpretation of the text than mere deciphering of a single word), these words become variables which you just recognize. Whether they are shorter or longer doesn't really matter then.<br>
      Today "lichtgeschwindigkeit" is used which is literally the same as the English and French terms. Not that long.</p>
