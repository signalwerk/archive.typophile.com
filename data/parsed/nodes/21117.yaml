      <p>&gt;Not many really long words …</p>
      <p>Yeah but you occassionally get something like wiedererkennbarkeit = recognizable :)  </p>
      <p>The reason I ask is because of a question I have not related to this thread: whether the original absence of word spacing slowed down readers of Latin and Greek. It seems that semitic languages always had word spaces, but that the addition of vowels to the alphabet for Greek and Latin sufficiently reduced ambiguity that word spaces were not as needed. </p>
      <p>There is a theory, of Noordzij and Saenger that the re-introduction of word spaces by Irish monks in the 8th century enabled silent reading and was a big breakthough. I am wondering whether native speakers of Latin and Greek could read just as quickly without word spaces. I know Latin is highly conjugated, and I've heard the same about Greek, so it may be that word endings are easy to recognize.  </p>
      <p>My guess is that the reintroduction of word spaces was because the Irish monks' Latin was not as good as their continental colleagues, so it was more difficult for them to read continuous texts; also they wanted to write Gaelic, which maybe has less end-of-word markers... </p>
      <p>In English we also do aggretated nouns (eg. word spaces), but usually keep the words separate. Does the German practice reduce ambiguity and help readability? Or does the length of words reduce readability? Or is there no difference?  </p>
      <p>I also note that German is much more conjugated than English. Is this a factor?</p>
