      <p>Korean uses spacing between words, but the system is a mess, mainly due to confusion over compound words and general apathy towards correct writing.</p>
      <p>In South Korea, spaces are required at word boundaries (North Korea spacing rules are more lax), but there are a number of confusing exceptions and cases where spaces are optional. Rather than make an effort to understand these rules, far too many people disregard them and sometimes apply ad hoc spacing rules. Those in the legal profession are the worst offenders, especially when they write the names of laws without using spaces, ending up with monsters like this:</p>
      <p>대한민국과아메리카합중국간의상호방위조약제4조에의한시설과구역및대한민국에서의합중국군대의지위에관한협정의실시에따른관세법등의임시특례에관한법률<br>
      (Daehanmingukgwaamerikahapjunggukganuisanghobangwijoyakje4(sa)joeuihansiseolgwaguyeokmitdaehanmingukeseouihapjunggukgundaeeuijiwiegwanhanhyeopjeonguisilsiettareungwansebeopdeunguiimsiteungnyeegwanhanbeomnyul)</p>
      <p>Judging from this and their propensity to use as much <em>hanja</em> (Chinese characters) as possible, they must take perverse pleasure in making law inaccessible to ordinary Koreans. I'm guessing we can blame this on the Japanese.</p>
    html_clean: |-
