  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/oxo_4131.png"></div><p></p>
    <p>This image isn't of the font itself. What I'm looking for is a font I know I've seen recently that mimics this style -- points of light/ink, some of which are brighter/wider than others. A super-simplified bit-map, in other words. Also, I don't recall if this was actually an alphabetic font or not; it may have just been abstract patterns of this style.</p>
    <p>Incidentally, this was a kind of display used in very early mainframe computers (EDSAC, in this case), but searching for it along those lines hasn't yielded anything yet. </p>
    <p>This is just right on the tip of my tongue. </p>
    <p>Any ideas?</p>
