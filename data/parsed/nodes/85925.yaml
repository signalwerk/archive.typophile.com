    html: |-
      <p>Here's an old thread on <a href="http://typophile.com/node/13747" rel="nofollow">Sans Serif Shaded</a>.</p>
      <p>And some info from <a href="//cg.scs.carleton.ca/~luc/stephensonblake.txt" rel="nofollow">"Stephenson Blake: The Last of the Old English Typefounders"</a>:</p>
      <blockquote><p>
      Sans Serif Shaded 1948<br>
      Stephenson Blake Revival of a design engraved by Thorowgood and first shown in 1839.</p>
      <p>Sans Serif Condensed 1885<br>
      Stephenson Blake Mid-19th century sans serif. Reissued 1952
      </p></blockquote>
