    html: <p>He correctly credits Kingsley/ATF as the source. The design is by Morris Fuller Benton in 1920's, according to Mac McGrew's book on American Metal Types. (This explains why Nick Curtis and Red Rooster both produced digitizations of this typeface. Nick used the swash caps, and Red Rooster recently issued a <a href="http://www.veer.com/products/typedetail.aspx?image=RRT0011498" target="_blank">Swash version</a> as well.) <br> <br>Just my Font History bit for today <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
