      <p>Question - Is Pooyesh Energy &amp; Niroo a new company? If not, did they have a logo before? Were they happy with it? Did it just have to be brought into the 21st Century?</p>
      <p>I think you are getting a lot of good advice from the fellow-designers here, but I think we are lacking some of the basics. You say it’s an energy company - what kind of energy? </p>
      <p>Is it a young company with eyes on the future — is it an old steadfast company that has helped a country get to where it is today?</p>
      <p>Is there a way for you to think more about who and what this company is - and then form an idea of a logo?</p>
      <p>Yes, time to go back with pen and paper and work this out. And yes, we all know how difficult it is - but try to design this from the heart - and I think you will get there.</p>
      <p>P.S. Though commercial fonts are fine - some aren’t. Just like not all free fonts are bad… also, remember, not all free fonts are free, when used commercially a fee must be paid.</p>
