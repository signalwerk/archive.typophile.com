      <p>With fonts, you usually get what you pay for. These all <strong>look</strong> like free fonts, and they make the logos look cheap.</p>
      <p>Did you do any sketching by hand before coming up with these? My gut tells me you didn’t. I’d seriously recommend doing some doodling with good old pencil and paper before even sitting down in front of a computer.</p>
      <p>Logo 1: What does the ‘X’ represent? The mark is too simplistic. The typeface choice is absolutely horrendous, and definitely not suitable for a business that wants to be seen as professional.</p>
      <p>Logo 2: This has the least offensive type, but it still doesn’t convey a sense of professionalism. I think I see what you’re trying to do with the mark (a ‘P’ inside an ‘n’) but it doesn’t work - I had to really stare at it for a while, and I’m still not sure that it was intentional.</p>
      <p>Logo 3: The mark is reminiscent of the “Screen Gems” logo, but also something else I can’t put my finger on. The type is a poorly-drawn clone of a real typeface (Compacta), and it shows.</p>
      <p>Logo 4: Again, I don’t see the significance of the mark. The shapes overlap in an awkward manner, and you’re using the same horrible type from logo 1.</p>
      <p>Logo 5: Overall, this is the best of the bunch, but I could swear I’ve seen the mark before. The type is, again, poorly drawn, and the character widths are disproportionate.</p>
      <p>Sorry to sound so harsh, but there’s really nothing in these logos that works very well. I’d suggest scrapping everything and starting from scratch using professionally designed fonts. If cost is an issue for you, go to <a href="http://www.myfonts.com">http://www.myfonts.com</a> or <a href="http://www.fontshop.com">http://www.fontshop.com</a> and use their previews to mock up a logo for the client. When it comes time to create the final logo, the client should pay for the font license.</p>
      <p>Good luck with this, and don’t let the criticism discourage you. Keep posting your progress :)</p>
      <p> - Lex</p>
