    html: |-
      <p>When I think of energy in a visual sense, I think immediately of two things, lightening and potential. Lightning has a long tradition of use as a icon for power plants, power companies and such, and would have a rather dated look without a really innovative approach. Not that thats a bad thing. Potential, on the other hand, I visualize as somthing like a mechanical-looking turbine windmill or pinwheel. Or a battery, and it’s sub images of + and -.</p>
      <p>Swooshes, while they could be worked into any of those shapes, are overused, although I find them still appropriate in sport and exercise related works.</p>
      <p>In energy related stuff, I think Black/Orange, Red/White, Black/Yellow<br>
       are safe choices, or at least a place to start.</p>
      <p>I also wonder, if you want to emphasize the ‘Pooyesh’, you might want to put it in caps on its own line, and Title-case the other words under it, trying the ‘&amp;’ and the ‘and’ to adjust the scale.</p>
      <p>I would look for a more businessy or classic typeface, and let the artwork be the stimulating part.</p>
      <p>If you feel overwhelmed, drop one aspect of the task for now. Maybe build the graphic first, then develop the nameplates for both languages simultaneously after you have a great image. Or, the reverse.</p>
      <p>You might toy with the idea of building the title area to include both English and Arabic in one arrangement.</p>
      <p>Good luck, let us know where this ends up!</p>
