      <p>My recommendation:<br>
      If this is a serious company, choose better typefaces - less quirky, nice and neat, and easier to read.</p>
      <p>For now, I’d stick to a neutral typeface until you can get exited about  a solution for the logo. Ones this is clearer you can look for a typeface to match the character of the mark. But remember, if you want to portrait a serious and trustworthy company you may want to choose one of the classic corporate typefaces.</p>
      <p>Logos:<br>
      1) looks like computer/games/software company<br>
      2) looks like a sign for parking your car<br>
      3) does not look original<br>
      4) I’m not so keen on the overlap<br>
      5) To me this is the best result. I’m not so keen on the fill in the middle. I’d try to separate the 3 elements and try different positions. Try re-shaping these things.</p>
