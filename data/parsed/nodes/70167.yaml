    html: |-
      <p>Some apps don't support class based kerning. So even basic stuff like commas, emdashes, ellipsis, base quotes and smart quotes would end up unkerned in those apps if the class kerning wasn't at least somewhat expanded. For all caps fonts, unexpanded kerning meant the "lowercase" set ended up with no kerning at all. For the first few years of OTF, MyFonts samples didn't display class based kerning. If you didn't expand the kerning, I'd only see the class parents kerned.</p>
      <p>Now, with web embedding, class kerning isn't fully supported so, if I don't expand kerning, it won't kern.</p>
      <p>In earlier OTF times, there was an OS9 app that supported OTF but not kerning classes. I can't remember which one but a few customers mentioned it so I made sure I expanded everything.</p>
      <p>In Windows there was something . . . Corel Draw? I think there was a version that supported OTF but not classes.</p>
