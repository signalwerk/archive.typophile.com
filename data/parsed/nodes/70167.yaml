      <p>If you’re talking about the Mac Roman char set and no kerning classes, then you’re essentially asking what is the average number of kerning pairs in a legacy Postscript Type 1 font.</p>
      <p>Still, it depends. It depends upon the style of the design, the effort put into shaping and spacing to obviate kerns (not necessarily a good or bad thing, just a design intent), whether the design is intended for display or text, and the extent to which a designer chose to go (kerning accented chars or not, which punctuation combinations to give attention to, etc.)</p>
      <p>In the original Whitman text fonts, there were around 1800 individual kern pairs. In the Display, more like 5000.</p>
      <p>I once did an analysis of some rough breakdowns. I can’t find the Whitman analysis; but there is this old thread, with data from a few other fonts:</p>
      <p><a href="http://www.typophile.com/node/459#comment-2948" title="http://www.typophile.com/node/459#comment-2948">http://www.typophile.com/node/459#comment-2948</a></p>
      <p>Unfortunately, many posts from that era end up getting borked in the archive (whenever an accented character occurs) and there is some long post that I made the day before this one that seems to have had some really good information (according to the succeeding comments) but which got truncated. I can’t remember what I must have said.</p>
