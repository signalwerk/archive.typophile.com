    html: <p>My question about how much an automobile costs was not frivolous; the answer is "it all depends." The design of the individual characters will dictate how much kerning will be needed. Oswald Cooper designed his eponymous black face to be cast in metal, without the ability to kern as we know it. Consequently, he designed his letters in such a way that kerning--even if it could be accomplished--was unnecessary.</p>
