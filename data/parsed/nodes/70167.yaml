    html: |-
      <p><cite>what's the technical limit for the number of kerning pairs in an OTF?</cite></p>
      <p>There's no simple number. The format is limited by the size of a subtable (64kb), though we now have the "extension" mechanism to work around that, in newer environments. Some individual applications will start to misbehave if some limit is exceeded, but the nature of that misbehavior and the size of the limit can vary by app and even by app version. Some applications have no limit whatsoever (for example, InDesign).</p>
      <p>Examples of different kinds of misbehavior:</p>
      <p>- only recognizing the first <em>n</em> pairs<br>
      - only recognizing the last <em>n</em> pairs<br>
      - the app crashes<br>
      - the app fails to recognize any kerning in the font</p>
      <p>Generally, Adobe notified all the application developers whose apps they saw misbehaving, about 8-10 years ago. I know that Framemaker and QuarkXPress improved.</p>
      <p>Regards,</p>
      <p>T</p>
