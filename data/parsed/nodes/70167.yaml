    html: "<p>For a sans with upper &amp; lowercase + kerning classes, I tend to hit in the 320-380 range. I hadn't compared or even noticed the number of pairs before. I was surprised to see how the numbers end up pretty close. A square sans is about 220. A superelliptical, like DDT is about 280. My earlier fonts had more pairs, probably because my spacing skills weren't as good. If you eliminate kerning classes, the answer is easy: exactly 2048 pairs. Some all caps fonts come in at less but everything else is 2048.</p>"
