    html: |-
      <p>By the way, the reason there are so many kerns in Williams Caslon is because its glyph set is very large, including CE characters, Bold Italic small caps, swash characters, and 6 styles of figures. You have to do "exceptions" for the accents, and the swash are kerned to both lower case and small caps. So everything explodes exponentially with more characters that need to be kerned with one another.</p>
      <p>Also the italic follows the varied slants of the original (though all is made 3% more upright). I think because of the varied slants, it took a lot more kerning to get the evenness of a modern italic. There are about double the kerns in the italic as the roman. </p>
      <p>Also this follows the FB method of not putting negative side bearings in vwxy, so that they won't touch even if kerning isn't operating. This creates a need for more kerning to get the diagonal characters even in the final.</p>
