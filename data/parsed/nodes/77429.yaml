    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hippie_4124.jpg"></div><p></p>
    <p>This is a free font called LMS Hippy Chick. My boss wants me to do a 1960s-themed layout and had a sample of something pretty close to this, but I need to use figures, and the font I've downloaded is pretty sketchy and has none.</p>
    <p>Any suggestions for fonts like this, or even if I can find a more complete version of this font somewhere? Canada Type's Doobie is close, but a full version of this Hippy Chick font would spare me having to appliqué flowers by hand...</p>
