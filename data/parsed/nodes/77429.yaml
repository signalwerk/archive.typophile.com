    html: |-
      <p>The typeface is Bell Bottom.<br>
      For your own self respect, try to  to evoke the 1960s without piling cliché upon cliché.<br>
      There are many "hippy" fonts that you could work with.<br>
      For instance, why not use Mojo in Illustrator, bending it to resemble a Wes Wilson poster?<br>
      Alternatively, cue up Live Dead, take a couple bong hits, and start drawing.</p>
