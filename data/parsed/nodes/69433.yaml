    html: <p>Fontspring isn’t an entirely new retailer. Fontspring is a web-font oriented sales venue set up by FontHead (Ethan Dumham) out of Delware. Ethan is carefully ramping up the service, tweaking the site, and adding foundries while keeping a low profile.</p>
