      <p>Paul- Is true... Fontspring launched early February with the aim of selling desktop and webfonts together without being hindered by a subscription fee. I don't have Typekit-like funding and therefore progress is a bit slower. We've  signed on a bunch of brave and willing foundries who see the value in serving the customer in this way. </p>
      <p>I'm not sure what else you want to know. Feel free to email me directly ethan [at] fontspring.com...</p>
