    <p>I have Adobe programs on my PC, running Win98 but the fonts don't show up outside of the program.  I haven't installed an ATM because I understand ATM and XP don't get along.  How do I install Post Script fonts on XP without an ATM (or can I) ? Where are the fonts located, what extention are they? <br>Thanks.&lt;/font&gt;</p>
