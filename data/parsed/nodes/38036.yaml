      <p>Thanks for the help, critter. The project is actual joint with my sister who is compiling the text and doing the majority of the editing work on it. The book is really her brain-child. We had a talk this morning about the book and decided to design it with a double column. The margins we are thinking of using are:</p>
      <p>top - 1.5”<br>
      bottom - 1”<br>
      inside - 1.25”<br>
      outside - 1”</p>
      <p>The columns will have a .375” gutter between them. This should provide us with enough space above the text to place photo captions, notes, pronunciation keys, etc. Photos will span either one or both columns.</p>
      <p>The fonts you provided are quite nice. Regula is a little too distressed as you side and Biblon doesn’t quite suit the look we’re going for. Regent is really good though and I’m going to talk to my sister about getting it. I’d still really like to know the name of the other font you were thinking of.</p>
      <p>If anyone else has thoughts I’d love to hear them as well. Thanks guys.</p>
