      <p>Some thoughts. It now is apparent that there will be a lot of images in the book, so you might want to go back to someone else’s early suggestion of a single column of text with larger images that break into the white space.  (I assume one or more pictures on most pages, and these are to be played up ... that is, made relatively large.) </p>
      <p>I would suggest going to the library or a bookstore and browsing through similar types of books, and getting a feel for what you think works best. Sometimes you can see it and know it is perfect, while someone might have given you the specs and that did nothing.</p>
