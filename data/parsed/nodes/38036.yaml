      <p>The problem with selecting margins and text measures is they need to be considered with the typeface, the point size(s), leading, together with the binding (perfect binding generally uses more of the inner margin than stitched). Bringhurst gives good advice on the average number of characters per line and book design. Generally you should aim for an average of between 50-66 characters per line – start with that and work out how much space you have left. For more specific advice try out some settings and post them in the Critique forum. Just for clarity – is the 10.5x9 format landscape or portrait?</p>
      <p>Tim</p>
