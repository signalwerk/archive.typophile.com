    <p>I am designing a short book telling the story of my grandmother’s journey from Poland to Canada during WWII. I am looking for some advice on what to use for the typeface throughout the book. The chapter headings will all be hand-lettered. The dimensions of the book are 10.5x9. I’m still debating whether or not to do it double column or not. Does anyone have any thoughts on what to do about margins on a book of these dimensions? Thanks for the help, guys.</p>
