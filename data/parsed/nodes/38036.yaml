      <p>Hi,</p>
      <p>I am new to these fora and love what I am reading here. I take the liberty of chiming in as I have finished a similar project using Adobe InDesign. The rule of thumb for columns is 1½ lowercase alphabets in whatever font you decide to use, i.e.,</p>
      <p>1 column width = abcdefghijklmnopqrstuvwxyzabcdefghijklm</p>
      <p>This is a font dependent calculation and if using a very narrow font might even yield three columns, or conversely a single column with wide margins for very wide fonts.</p>
      <p>I apologize if this is already assumed and I am merely pointing the blatantly obvious.</p>
      <p>I would add that I use InDesign for any publication longer than one page, i.e, books, Quarterly Reports, MMPs* MOPs*, and presentations.</p>
      <p>*Procedure books for manufacturing.</p>
      <p>alaric</p>
