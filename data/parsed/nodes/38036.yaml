      <p>&gt; <cite>What exactly is TeX live for? </cite></p>
      <p>TeX live is an implementation of TeX (and LaTeX), which is used in the scientific community to typeset texts containing lots of formulas, diagrams and the like, but there are also packages for linguistics, critical text edition, etc.  A tex or latex input file contains commands to tell how the text or the formula should be typeset (it is not “what you see is what you get”). Many scientific journals expect articles to be submitted in latex and provide packages for those wanting to submit, so that they get on their laser printer something resembling the final published text (and comply with the journal editing requirements)</p>
      <p>Michel</p>
