    html: <p>By simplifying the message I didn't mean that the logo should stand alone in a void, but rather pick the main theme/message you are trying to communicate and focus on conveying that message. For example Art vs Technology, or Art in the Digital Media Age, or the Visual Overload one can get from viewing too much Digital Media, or Technology vs. Chaos. I think you are trying to get the logo to say too much and the end result is that the message is unclear. <br> <br>I like that you are using a hand-drawn font to represent art. Although it sounds like you want to communicate Digital Art specifically. The rectangle counters you have subtley allude to digital art but the first impression is 60's rock (very un-digital). You may also want to re-think your font choice for Ache. Or at least how it's postioned. The obvious cliche solution to illustrate overload is to put Ache on top of Pixel. I am not recommending you do this, except as an exersize to play more with the words, letterforms, kerning, placement etc. Playing with these forms will spark more ideas and solutions. <br> <br>Your other visuals are interesting. I get a technological feel from them but it is more organic than chaotic. Your 1's and 0's seem like they are flowing down a river. Not that that is necessarily a bad thing, it just doesn't represent chaos. Or are these screen shots from video and the swirling symbols become more chaotic as the video progresses? <br> <br>Keep working on it I'm looking forward to your next post.</p>
