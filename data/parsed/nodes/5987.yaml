    html: '<p>I think my description about the do-it-yourself attitude and the emotional overload were a bit miss leading in the first place because they are more or less invented after the design was finished. Perhaps another example of do-it-yourself attitude and  even unprofessionality.  <br> <br>Here is how everything went. In year 2002 the input about the festival for me was: audiovisual experiments and creative misuse of technology, DIY lo-fi/hi-fi performances and installations, the art of programming. My intuitive response was this logo:  <br> <br><img src="http://www.typophile.com/forums/messages/29/42523.gif" alt="2002"> <br> <br>The idea was computer made vs. hand made + my vision of ache/</p>'
