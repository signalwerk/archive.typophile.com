  html: "<p>Hello, everybody. I came across this forum recently and since then I have been reading previous critiques and enjoyed them very much.  <br> <br>Two years ago I designed a logo for a media art festival pixelACHE. I am currently writing my thesis to end my studies. Describing how I created the visual identity for this festival is part of my thesis. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/42420.gif\" alt=\"pixelACHE-logo\"> <br> <br>PixelACHE -festival aims to find and expose creativity in the gray zone between art, science and design. Term pixelache means the state of mind when one over consumes screen based media.   <br> <br>For more information and some history about the festival and logo evolution see: <br><a href=\"http://www.pixelache.ac/\" target=\"_blank\">http://www.pixelache.ac/</a> <br><a href=\"http://www.pixelache.ac/2003/\" target=\"_blank\">http://www.pixelache.ac/2003/</a> <br><a href=\"http://www.pixelache.ac/2002/\" target=\"_blank\">http://www.pixelache.ac/2002/</a> <br> <br>The logo consist of two parts. The purpose of word pixel is to mirror strong do-it-yourself attitude and working with computers. The ache part of the logo is ment to mirror the the emotional overload part of the festival. <br> <br>I'd love to hear your critiques, thank you in advance for your comments. <br> <br>juha  <br> <br></p>"
  html_clean: "<p>Hello, everybody. I came across this forum recently and since then I have been reading previous critiques and enjoyed them very much.  <br> <br>Two years ago I designed a logo for a media art festival pixelACHE. I am currently writing my thesis to end my studies. Describing how I created the visual identity for this festival is part of my thesis. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/42420.gif\" alt=\"pixelACHE-logo\"> <br> <br>PixelACHE -festival aims to find and expose creativity in the gray zone between art, science and design. Term pixelache means the state of mind when one over consumes screen based media.   <br> <br>For more information and some history about the festival and logo evolution see: <br><a href=\"http://www.pixelache.ac/\" target=\"_blank\" class=\"link-external\">http://www.pixelache.ac/</a> <br><a href=\"http://www.pixelache.ac/2003/\" target=\"_blank\" class=\"link-external\">http://www.pixelache.ac/2003/</a> <br><a href=\"http://www.pixelache.ac/2002/\" target=\"_blank\" class=\"link-external\">http://www.pixelache.ac/2002/</a> <br> <br>The logo consist of two parts. The purpose of word pixel is to mirror strong do-it-yourself attitude and working with computers. The ache part of the logo is ment to mirror the the emotional overload part of the festival. <br> <br>I'd love to hear your critiques, thank you in advance for your comments. <br> <br>juha  <br> <br></p>"
