    html: <p>Juha, <br> <br>I like that you avoided the cliche of using a word made up of pixels. However, I don't feel the logotype really captures the concept of art, science and technology. The hand drawn font although artistic, it also looks dated, like a 60's rock poster. <br> <br><img src="http://www.typophile.com/forums/messages/29/42644.jpg" alt="hendrix"> <br> <br>And the sans you selected is heavy, but to me, it doesn't convey "emotional overload" nor science/technology.  <br> <br>You are trying to communicate a lot of ideas and complex ideas too. (Computers, Festival, Do-It-Yourself, Art meets Academic meets Commercial, Emotional Overload, All Are Welcome, Encourage Creativity, Fullness/Pain-Ache/Ahky, Control, Standardization, Process vs. Result) Technology can work to your advantage here since a logo designed for the web can metamorphize into many things to help convey ALL of your concepts. But when it comes to print you will need to simplify and focus on one or two primary concepts. There are a lot of interesting visuals from the festival look to them for more inspiration. </p>
