      <p>Hey Guys, this is all a bit hostile and cynical.  As typographers I would have thought you'd have taken a more generous view of what could be an exciting new development.  Ho hum.<br>
      To answer a couple of your points: the Dynatron Mathis font is an alternative cut, so those who feel strongly about the misappropriation of the grave symbol have got it in the original version (and be honest, who with an American / British keyboard uses it more than once in a blue moon?).  Nick Shinn says why not make the 'mis-used'  glyph actually look like 'the'?  Ok, then why not make the ampersand glyph look like 'and'?  Your other objections seem to me to be more personal (against Paul Mathis) than professional.</p>
