      <p><em>There's been much discussion in the UK press about the new Th symbol...</em></p>
      <p>Summer is traditionally known among UK journalists as 'the silly season'. Parliament is in recess, it's too hot to do anything productive, so they publish the silly news off the wire. The only remotely interesting thing about the Mathis story is that he's reportedly sunk so much money into this folly. That's seriously roquert!</p>
      <p>From a technical and typographic perspective, there is no story, other than that of a man who hasn't realised that the relationship of keystrokes to characters to glyphs is <em>n</em> to <em>n</em> to <em>n</em>, and hence his 'invention' doesn't solve any problem that actually exists.</p>
