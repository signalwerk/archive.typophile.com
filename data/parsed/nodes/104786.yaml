      <p>&gt; The point is not that the glyph may already exist but that it is generally adopted as a substitute for 'the' in written English and in an ideal world assigned its own place on the keyboard.</p>
      <p>Well, character, not glyph—and the implementation affects things like what it looks like.</p>
