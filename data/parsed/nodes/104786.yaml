      <p>&gt; If I were to meet all your technical objections - produce a text font with an upper and lower case Th symbol (and Unicode and PC manufacturers could be persuaded to assign it a 'legitimate' place on the keyboard), what then would be your objection to the Th symbol? Why wouldn't you use it?</p>
      <p>What exactly is “the” keyboard? This is a question for OS vendors more than PC vendors.</p>
      <p>But without rat-holing on such details, if these parenthesized events were to happen, and the standard US and UK/international-English keyboards for Windows and Mac OS issued by Microsoft and Apple gained direct support for this as a character, it would probably be reflective of general public demand for the thing. So sure, I would support it. But then, I tend to make fonts with 300-3000 glyphs. As it is visually identical to the Serbian cyrillic letter Tshe, those of us who make Latin+Cyrillic typefaces would have no extra work.</p>
      <p>However, I think you have the cart before the horse. Unless it achieves widespread usage somewhere, by some mechanism, the OS vendors would never go to the trouble of supporting it. The last time a big shift like this happened on English-language fonts and keyboards was for the euro symbol in the late 1990s. Somehow this does not seem quite as strong a motivating force.</p>
      <p>BTW, Keith, you're the one being overly dismissive—of other people’s reactions if they are anything other than enthusiastic support. Anybody who thinks is is not a great idea does not have “an open mind”? That’s not going to win friends and influence people.</p>
