      <p>Sorry, in my haste to respond to thetophus I almost forgot to thank sarang for his/her positive endorsement of the Th symbol for use in word processing.  At last, someone with an open mind!</p>
      <p>Looking back on this strand it seems to me that very few have addressed the utility of the Th symbol as an idea.  Most have focussed on such technicalities as the fact that it already exists as a glyph (in Old Norse or what-have-you) and thus doesn't need to be included in a Latin character set (which rather misses the point).  Others have deliberated over whether or not it will or will not be officially adopted as a Unicode point (God forbid we should transgress there!)  Michel Boyer showed us how you could customize your own keyboard.  (Useful stuff Michel, but to be honest perhaps a little beyond the scope of the average punter).  And still others have criticized my implementation of the character in Dynatron Mathis.</p>
      <p>Fair enough, I don't pretend to be an expert, or even very clever.  I'm open to constructive criticism (as opposed to snide side-swipes).  That was the reason I opened this discussion on Typophile in the first place.</p>
      <p>If I were to meet all your technical objections - produce a text font with an upper and lower case Th symbol (and Unicode and PC manufacturers could be persuaded to assign it a 'legitimate' place on the keyboard), what then would be your objection to the Th symbol?  Why wouldn't you use it?</p>
      <p>Merely to claim that you instinctively know that it is a 'damp squib' is an unsupported opinion, and if you ask me, a pretty arrogant one too.</p>
