      <p>John, type designers are not the arbiters of what is going to be a new development - its a question of necessity being the mother of invention (although you're perfectly entitled to decide its not necessary in your case).</p>
      <p>Nick Shinn wrote: 'Is it cased?'</p>
      <p>Actually I did give quite some thought to a lower case version of Th, and worked up several designs not dissimilar to the one Nick has kindly mocked up.  On reflection I decided that if the ampersand can stand alone so can the Th symbol.  Besides it would have necessitated nobbling another Unicode point, which would no doubt have you throwing your hands up in horror!</p>
      <p>'In your case the design falls short on functionality'</p>
      <p>True, it's a display face and not best suited to texting.  I first learnt about Paul Mathis' proposals when I was completing the design of Dynatron, and thought it would be an idea to include the Th glyph, little suspecting that the wrath of the gods would fall on me for doing so!  I had in mind to work on a text version, but judging by the hostility to Dynatron Mathis I'm beginning to think again.</p>
      <p>PublishingMojo writes: 'Since there has been a familiar glyph for the th sound for thousands of years, I wonder why it was necessary to invent a new one (other than the possibility of making some money by doing so)'.</p>
      <p>The point is not that the glyph may already exist but that it is generally adopted as a substitute for 'the' in written English and in an ideal world assigned its own place on the keyboard.  As to making money, why is everyone so sniffy about it?  Don't we all hope to make a modest income from our typographical efforts?</p>
