      <p>Here is something for the "silly season".</p>
      <p>Above I said what could be done 30 years ago. Today many tools can serve but here is something for OS X 10.8 with a touch and feel you can't beat :)</p>
      <p>Download the <a href="http://www-01.sil.org/computing/catalog/show_software.asp?id=94" rel="nofollow">SIL Ukelele Mac OS X Keyboard Layout Editor</a> (and copy in the Applications folder). Then start Ukelele (on OS X 10.8 you may need to control click the application to bypass a security check), then click <code>File &gt; New From Current Input Source</code>; you will see your normal keyboard appear. Then double click on ` (or another key that you seldom use) and write "the " (without quotes) in the little box that appears and click OK. </p>
      <p><img src="/files/enter-string_5818.png"></p>
      <p>You will now see the modified keyboard; here is what I get from my US Extended layout. </p>
      <p><img src="/files/newlayout_3438.png"></p>
      <p>Then click <code> Keyboard &gt; Set Keyboard Name..</code> and choose the name that will show in the keyboard menu, for instance "Personal". If you want your keyboard to be unicode, select <code>Keyboard &gt; Set Keyboard ID...</code> and choose Unicode. Then <code>File &gt; Save As...</code>; I choose <code>Personal.keylayout</code> and I save it on the Desktop.</p>
      <p>The file needs to be moved to the "Keyboard Layouts" folder in your "Library" but on OS X 10.8, it won't show up as it used to. Instead, open the <code>Terminal</code> application (in <code>Applications folder/Utilities</code>) and then paste the following three lines into the terminal window (instead of typing; you can paste the three lines together):</p>
      <pre>cd ${HOME}/Library/'Keyboard Layouts'
      open .
      mv ${HOME}/Desktop/Personal.keylayout .
      </pre><p>If you see this appear, everything is fine so far</p>
      <p><img src="/files/layouts-folder_6366.png"></p>
      <p> If not, make sure <code>Personal.keylayout</code> is on the desktop and try again. (The same recipe works on 10.7, 10.6 etc but it was easier by then). In fact, once that folder is open, you can also just drag your layout there.</p>
      <p>You now log out and log in, then in <code>System Preferences</code> you double click <code>Language &amp; Text &gt; Input Sources</code>; you will see a list of keyboards appear. I assume you have the box for Australian checked, then maybe also that for US. Extended (or US international - PC) and you now also check the box for Personal, your new keyboard. </p>
      <p><img src="/files/input-sources_4809.png"></p>
      <p>You also check <code>Show Input menu in menu bar</code> at the bottom and you should now see the keyboard menu at in the top right corner of your screen. If I select it, here is what I see. </p>
      <p><img src="/files/keyboards-menu_6290.png"></p>
      <p>I can now select any of those keyboards at my will. When the Personal keyboard is selected, every time I type a backquote, I get "the ". You can also select "Show Keyboard Viewer" and see this appear:</p>
      <p><img src="/files/keyboard-view_5965.png"></p>
      <p>and show it to your friends. You can also switch from one keyboard to the other by typing "command space". </p>
      <p>Such keyboard layouts are handy if you frequently need special characters for edition (or to provide input to the kerning window of some font editing program) and you don't want to copy paste all the time from a cheat sheet; this also shows that there is not a one to one relationship between key hits and characters; usually things are the other way around though; so called dead keys are used to get one unicode character from many keystrokes; for instance to input the single character é (eacute, <code>U+00E9</code>) to  your text file using the US Extended keyboard, you need to  type first "alt e" and then "e". Designing such a keyboard layout with Ukelele is more tricky.</p>
    html_clean: |-
