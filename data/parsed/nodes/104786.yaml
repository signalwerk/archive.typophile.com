      <p>I ﬁnd the design a bit stiff.</p>
      <p>The premise is never going to work precisely and evenly, due to the conﬂict between the tapering effect and the shape of letters.<br>
      /c and /r, for instance, look like they’re falling to the left, whilst symmetrical characters don’t.</p>
      <p>Val Fullard’s <a href="http://www.identifont.com/similar?5IL" rel="nofollow">Science</a> is more successful in this genre, IMO, as its casual slant both helps to disguise the problem, and captures the zany futuristic feel of pulp sci-ﬁ/1950s furniture with which I associate this grandiose and overbearing look.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/books_startling_6447.jpg"></div><p></p>
