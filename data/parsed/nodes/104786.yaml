      <p>With the editor <a href="http://en.wikipedia.org/wiki/Vi" rel="nofollow">vi</a>, that I have been using since the eighties, you can map the character ` to the four letters "the " (why type the space? that is crazy) as follows: you type </p>
      <pre>:map! ` the &lt;CR&gt;
      </pre><p>in command mode, where you type a carriage return in place of &lt;CR&gt;. Then each time you type ` while in input mode, you get "the" with a space in your text. Mapping keys that way proved very handy in the old days to input French accented letters for troff without having to type the long list of required control characters.</p>
      <p>One should not conflate input methods and character sets.</p>
