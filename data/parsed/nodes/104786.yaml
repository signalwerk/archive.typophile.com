      <p>About half the publishers I work for refuse to allow the Th ligature in a number of fonts. That's an design decision (aesthetic) that varies from font to font. Most editors won't allow the ampersand at all, unless it is part of a name, like AT&amp;T or Texas A&amp;M. Personally, I do use the ampersand a fair bit in email &amp; internet posts &amp; other informal communications.</p>
      <p>But: the ampersand has both a long history and a Unicode assignment. It 's use doesn't require mis-encoding. Until Unicode acknowledges a new symbolic abbreviation, no, nothing good to say.</p>
