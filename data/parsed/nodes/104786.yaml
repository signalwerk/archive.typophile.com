      <blockquote><p>Useful stuff Michel, but to be honest perhaps a little beyond the scope of the average punter</p></blockquote>
      <p>Assuming Mathis' character gets a unicode point, in order to use it,  a corresponding keyboard layout will be needed. It is not the average user that  programs such things anyway. </p>
      <p>What happens is that, with a font that would implement the full word "the" as a ligature (with glyph Ћ), a user could not tell the difference between Mathis' new keyboard and  Mathis' unicode Ћ glyph and my keyboard with my font with the "the" Ћ ligature. He would type the same way, and see the same thing on screen. Notice that the composite glyphs in indian scripts that were mentioned above are implemented as ligatures. In a utf-8 file, the word "the" takes 3 bytes. A new unicode codepoint would take at least two bytes, if not three (combining diacritics take three bytes for instance). With file compression, I see no gain there either. </p>
      <p>By the way, writing the 'clig' table to get a ligature for "the" but not with "bathe" or "therefore" is an amusing exercise. And, as a reward, you can read texts with lots of "the" and see them display as Ћ.</p>
