      <p>And ðat's what I think, too. </p>
      <p>BTW -- from Wikipedia:</p>
      <blockquote><p>In Old English, ð (referred to as ðæt by the Anglo-Saxons) was used interchangeably with þ (thorn) to represent either voiced or voiceless dental fricatives. The letter ð was used throughout the Anglo-Saxon era, but gradually fell out of use in Middle English, practically disappearing altogether by 1300;[4] þ survived longer, ultimately being replaced by the modern digraph th.</p></blockquote>
      <p>Another source notes scribes would use one or the other, depending on whim, within a single text (in English). It's amazing how careful current scholars are to preserve just which was used where in a document.</p>
      <p>As for me, I'll probably never use this yet-another-Th symbol, even if it's allowed into Unicode. But I'm a old guy, if the consortium encodes it, I won't squwak.</p>
