  html: |-
    <p>There's been much discussion in the UK press about the new Th symbol proposed by Australian inventor Paul Mathis as a substitute for the definite article (the).  I've included a glyph for this in my latest font - Dynatron - just released on MyFonts.  I've also included a version - Dynatron Mathis - which allows users to access the Th symbol in one stroke using the seldom used grave symbol (`) on the top left hand of the standard American and British keyboards.  What do you guys think?  I'm aware that Dynatron is basically a display face, and the utility of the Th symbol is mainly for texting etc., but you've got to start somewhere!</p>
