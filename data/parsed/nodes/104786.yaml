    html: |-
      <p>@Keith Tricker: As a Th ligature, I quite like the character. Why did you decide to omit any visual reference to the presence of an e? As “The,” it bears such a close visual relationship to “Th” that extending it to “The” is a difficult leap in that it requires your thinking to go from a very literal interpretation, to that one is more abstract. It’s as though I am being lead down a certain path which I understand, and am then asked to radically change directions in an unexpected way (if that makes any sense). If there were a visual cue to the presence of an “e,” I think people would get it instantly. You could also argue the opposite, that if the entire character were more of an abstraction, you may not have competing modes of interpretation.</p>
      <p>I might also recommend a video that takes itself more seriously. The first time I watched it wasn’t sure if it was a spoof of not.</p>
