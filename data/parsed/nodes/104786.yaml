      <p>Sorry, Thomas Phinney, you raise some valid points.  I'll do my best to answer them:</p>
      <p>"Unless it achieves widespread usage somewhere, by some mechanism, the OS vendors would never go to the trouble of supporting it"</p>
      <p>OK, you may be right, but isn't it a bit of a chicken and egg situation?  There is, I believe, a demand for this development and, if it were recognised and implemented it would be taken up.  What has to happen before the technology leads?  Mass rioting in the streets?  When Apple mooted the idea of the iPad everyone thought it would be a dead duck.  Now no-one can do without one!</p>
      <p>"you're the one being overly dismissive—of other people’s reactions if they are anything other than enthusiastic support. Anybody who thinks is is not a great idea does not have “an open mind”? "</p>
      <p>Not at all.  But I've yet to hear a great argument against the adoption of Th.  What's not to like?</p>
      <p>"One could just use one of those letters and you’d have just about all existing retail fonts supporting it right off the bat. I expect you would object to that because you want it to look more like a combo of T and h (or t and h), correct? It might help if you actually responded to this question".</p>
      <p>Yes, I would like it to look more like a combo of T and h (or t and h), mainly because the eth and thorn characters would be alien to most English users.</p>
