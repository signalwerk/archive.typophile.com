      <blockquote><p>Merely to claim that you instinctively know that it is a 'damp squib' is an unsupported opinion, and if you ask me, a pretty arrogant one too.</p></blockquote>
      <p>Nope, didn't ask.</p>
      <p>Odd notion, though. A "squib" is a light load, usually because of a  mistake, and when fired, fails to affect the target. If it's wet, it just won't fire at all, but then, when wet, neither will a regular load. "Damp" is an interesting modifier here. Does it mean the load *may* (or may not) fire, but even if it does, it won't hit the target? </p>
      <p>Personally, I take great pains with my loading, and haven't had a squib in over 25 years.</p>
