      <p>and show it to your friends. You can also switch from one keyboard to the other by typing "command space". </p>
      <p>Such keyboard layouts are handy if you frequently need special characters for edition (or to provide input to the kerning window of some font editing program) and you don't want to copy paste all the time from a cheat sheet; this also shows that there is not a one to one relationship between key hits and characters; usually things are the other way around though; so called dead keys are used to get one unicode character from many keystrokes; for instance to input the single character é (eacute, <code>U+00E9</code>) to  your text file using the US Extended keyboard, you need to  type first "alt e" and then "e". Designing such a keyboard layout with Ukelele is more tricky.</p>
