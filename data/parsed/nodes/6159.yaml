    html: <p>Red Rooster has a number of condensed fonts with oblong O's like this. <a href="http://www.fonts.com/findfonts/detail.asp?pid=408955" target="_blank">Schindler</a> comes in 5 weights. <br><a href="http://www.fonts.com/findfonts/detail.asp?pid=408954" target="_blank"> Raleigh Gothic Condensed</a> comes in 3 weights, but is more squared perhaps than you want. <br><a href="http://www.fonts.com/findfonts/detail.asp?pid=408922" target="_blank">Pall Mall</a> is another in 2 styles &amp; 2 weights. <br><a href="http://www.fonts.com/findfonts/detail.asp?pid=408952" target="_blank">Keyboard</a> comes in 3 weights. <br><a href="http://www.fonts.com/findfonts/detail.asp?pid=408968" target="_blank">Helium</a> comes in 4 weights. <br><a href="http://www.fonts.com/findfonts/detail.asp?pid=408986" target="_blank">Grand Canyon</a> is all upper case but comes in 8 flavors. <br><a href="http://www.fonts.com/findfonts/detail.asp?pid=408905" target="_blank">Europa Grotesque</a> comes in 4 weights. <br><a href="http://www.fonts.com/findfonts/detail.asp?pid=408896" target="_blank">Coliseum</a> has 3 weights. <br><a href="http://www.fonts.com/findfonts/detail.asp?pid=408977" target="_blank">Chamfer Gothic</a> has angled corners, 3 weights and 2 styles (other is Small Caps Expert set). <br>And last but not least is Block Gothic, which comes in <a href="http://www.fonts.com/findfonts/detail.asp?pid=408957" target="_blank">Condensed</a> &amp; <a href="http://www.fonts.com/findfonts/detail.asp?pid=408889" target="_blank">Extra condensed</a>, with 5 weights of each. <br> <br>I just happen to have the Red Rooster fonts and I use these a lot when I want condensed styles.</p>
