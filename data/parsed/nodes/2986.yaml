    html: <p>It looks like some custom-modified type. The C looks hand-drawn (and not very well). The other characters look like they are from <a href="http://www.myfonts.com/fonts/linotype/cochin/italic/testdrive.html?s=ascades&amp;p=48" target="_blank">Cochin Italic</a> or possibly <a href="http://www.myfonts.com/fonts/linotype/snell-roundhand-script/snell-roundhand-script/testdrive.html?s=ascades&amp;p=48" target="_blank">Snell Roundhand</a> (or maybe even a combination of the two) with further modifications, such as the slant. Given the general unevenness of the characters, it may be that it is several generations removed from the original artwork. Either that, or it's just not very well drawn. <br> <br>I think the tag line is actually <a href="http://www.myfonts.com/fonts/urw/casablanca/urw-t-light-condensed/testdrive.html?s=A%a0SERENITY%a0DAY%a0SPA&amp;p=48" target="_blank">Casablanca Condensed</a>, not Bodega Sans.</p>
