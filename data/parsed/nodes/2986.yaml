    html: <p>Mark, it looks like you're right on the tag. The previous agency on this account was using Bodega for all headers, so I assumed that's what it was since they do look close in style. <br> <br>I think you're also correct on the Cascades thing. I finally received an EPS of the logo, and it looks just as bad in its original format as it does in this JPG. <br> <br>Oh well, they're looking to revise their identity soon anyway, hopefully I'll get a shot at it.  <br> <br>Thanks for all your help.</p>
