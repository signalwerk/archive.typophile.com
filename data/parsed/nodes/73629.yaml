    html: |-
      <p>I've looked at a lot of script fonts in the past 40 minutes, and I'm coming to the opinion that this is not a commercial font. There are some poorly drawn letters here, especially the X, P, L and T. Also I seem to notice that the left stroke of the F, H, I and K are nearly identical shapes, and the U, V W and Y all start with a uniform left side. The basic style of the letters I would call a copperplate script (though that may not be the right term), but I can find none of them anywhere with a rounded W like this. This U, V, W, Y looks more like <a href="http://new.myfonts.com/fonts/bitstream/murray-hill/" rel="nofollow">Murray Hill</a> than any copperplate script. </p>
      <p>Looking at the lower case letters, I almost thought they were from a German script like <a href="http://new.myfonts.com/fonts/urw/kunstlerschreibsch/" rel="nofollow">Kunstler Schriebschrift</a>, but the k is wrong, among other differences.</p>
      <p>I think this may be an amateur attempt to create a font, based on some ideas borrowed from various formal pen scripts, and using copied elements to simplify the creation process.</p>
      <p>Where did this sample come from?</p>
      <p>- Mike Yanega</p>
