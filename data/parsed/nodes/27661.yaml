    <p>Hello all,<br>
    I work for a newspaper publishing company.<br>
    My team is having a rough time getting new fonts imported into an old PC-based desktop publishing pagination system, Good News (GN3) built by Tera. The Tera people are working on the issue but haven’t found a solution. I’ve been told the fonts need to run through Fontographer before they work but our IT Director can’t get them to display on screen or print. The fonts are the Mercury family from Hoefler &amp; Frere-Jones. H&amp;FJ say the fonts have worked for others with similar systems. We can get their Whitney font to work just fine.</p>
    <p>Any insight into this or similar problems with using fonts in pagination systems would be great. I love this font and would hate to see us miss the opportunity to use it. </p>
    <p>Thanks,<br>
    -Kris</p>
