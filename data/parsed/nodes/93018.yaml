    html: |-
      <p>Update:<br>
      I have managed to find my complete alphabet samples of this font.<br>
      However it appears Grignani redrew many of the characters for his book cover and may have also changed some of the weight through the stems. I have found out it was originally published by a Swizz photo-setting house and was available as headline setting via typesetters in London under various names. It appears to be a variation of the ECB font designed in 1958 for use on bank cheques. It appears to have disappeared after the typesetting houses went on of business in the late 80's.<br>
      I've drawn up a basic version for what I needed it for but would be interested to find some better samples than the ones I have and find out a little bit more about the font itself - if there were other versions and who should be credited for the original design.</p>
