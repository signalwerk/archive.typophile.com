      <p>Coll_hand  that album cover was post 1990, printed in England,  so you're right - it's very likely available as a font. Somewhere. Between the poster and the album cover, there's just about enough information to use as the basis for a new version l..</p>
      <p> Other similar fonts include:<br>
      AutoMission (Toto)<br>
      Automation (Possibly Filmotype, also available as a renamed version of Otto Mason)<br>
      Otto Mason (Soft Horizons)<br>
      K22GKWComputer (Toto)<br>
      URWDaliD (URW)<br>
      Westminster (Type Solutions)</p>
