    html: |-
      <p>First off : Keep going! Great work on the face, and nice work on the presentation as well.</p>
      <p>I would maybe nudge you to look at the typeface from the angle of evenness of color. Perhaps you could use color as a guide to start introducing optical adjustments to individual characters (and inform the kerning / sidebar situation down the line)</p>
      <p>I wouldn't be afraid to deviate here and there from the geometric ruleset you have in place in order to firm up the <em>appearance</em> of mathematic perfection (never quite one and the same).</p>
      <p>( which I'm sure you're aware of, but I would maybe go even further )</p>
      <p>For instance, the uc M,W, N all pop out to me as darker in that block of uppercase text. There are also cases like the alternate lc a, or the lc b, where the diminishing joint between bowl and stem lightens the color. It thus may be worthwhile to investigate slightly compensating by narrowing the bowls, etc etc.</p>
      <p>I think the way you get from A to Ω would totally be a couple dozen cycles of printing out, tweaking and repeating for this project.</p>
