    <p>Hey guys, </p>
    <p>This is my second-ever type design project and I'd like to get some feedback on it. The attached pdf is a bit of a type specimen I was required to do for the project which hopefully shows most of what you  would need to see to critique it. I obviously have a ton to learn but I'm loving type design thus-far. </p>
    <p>It's meant to be a vertically accented strong geometric slab serif for display. The No7 represents a weight system I plan on implementing, with each font file in the family having a corresponding number value from 0-9.</p>
    <p>I'm also now beginning research on how to get all the diacritical marks/alternate characters to actually work outside of the glyph window, so for the moment they don't work but hopefully will soon.</p>
    <p>For some reason the image won't attach so I'm stuck with the pdf for now.</p>
    <p>Thanks a lot,</p>
    <p>—Brian</p>
