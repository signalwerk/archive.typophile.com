    <p>Colin Banks (1932-2002) co-founder of Banks &amp; Miles, designers and typographers, founded in London in 1958 with partner John Miles. Major clients included the Consumers Association, the Post Office, British Telecom and London Transport, for whom they redesigned Edward Johnston's famous Underground Sans (as New Johnston). Banks would later design a limited edition book for the organisation as a tribute to Johnston.</p>
    <p>An influential designer, his Telecom (T) identity, created for British Telecommunications when it was instituted in 1981, spawned many imitators. Its replacement by Wolff Olin's BT 'piper' was received with much derision in 1991. He received a prestigious RSA/BBC Design Award in 1990, for the paper-saving redesign of the UK's Phonebook. Banks designed the UK Post Office's distinctive 'double-line' alphabet.</p>
    <p>He was married to Caroline Grigson, daughter of the poet Geoffrey Grigson and his first wife.</p>
