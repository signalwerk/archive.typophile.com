      <p>I love Wes Anderson -- even Life Aquatic. And I like Jason Schwartzman pretty much all the time. I actually loved Marie Antoinette and thought JS was very good in it; there was something nicely understated about him there which I thought was appropriate for the part... but my wife disliked that movie and I must say I understand why. I don't even know why I liked it, but I did!</p>
      <p>More trivia: The production designer for the Wes Anderson movies up through Tenenbaums was David Wasco, the brother of Monotype's (and previously Adobe's) Jim Wasco. David Wasco has a great resume, having done production design for all of Quentin Tarantino's movies too.</p>
