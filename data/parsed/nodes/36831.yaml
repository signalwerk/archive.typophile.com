    <p>The master director and writer Wes Anderson has a new movie coming out in November called Darjeeling Limited. But this time Wes (or his team of creatives) have opted to not use Futura as their font. What is this mysterious font? The font seems to perfectly fit with the movie. The movie takes place in India and in India, I have noticed, they use western design and art but with a slight Indian remix, and the font of  Darjeeling Limited does that exactly. Its really nice to see an artist like Wes Andersson have such great understanding of graphic design and typography. Much like another master of film known for his 2001 Odysseus.</p>
    <p><a href="http://www.apple.com/trailers/fox_searchlight/thedarjeelinglimited/" title="http://www.apple.com/trailers/fox_searchlight/thedarjeelinglimited/">http://www.apple.com/trailers/fox_searchlight/thedarjeelinglimited/</a></p>
