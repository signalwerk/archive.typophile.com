      <p>FYI -- From a collection of old metal fonts that a friend pulled samples during the mid-seventies, I have this poor repro showing that the cap "Q" uses the same ornamental treatment as the cap "C" on the top. He called design <em>Antique Initials 2</em> because I don't think he was able to identify it... neither could I.</p>
      <p>It may be due to the point size sample or the poor repro, but it looks like the "crown" ornament on the cap "C" and "Q" are a slight bit more delicate than in your redrawing.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ant_init3.png"></div><br>
      In the specimen above, the "X" was originally upside down which I corrected in Photoshop, but I believe the cap "S" is still upside down.<p></p>
      <p>The sample below was originally posted by Mark Simonson, which shows the same treatment of the cap "Q" that you rendered. Between the two samples you will spot minor variants in drawing like the additional swash on cap "S". Hope this helps to round out your source material.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Koster_Simonson.gif"></div><p></p>
