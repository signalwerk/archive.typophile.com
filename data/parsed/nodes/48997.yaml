  html: |-
    <p>In earlier versions of Minion Cyrillic and Minion Pro, up to and including Font Folio OT, Cyrillic 'u' was distinct from Latin 'y' (slight curve on the tail). However, I have just noticed that in the version of Minion that ships with InDesign CS3, the distinctive Cyrillic sort has gone. One imagines this couldn't have been accidental -- and yet... the current edition of the printed Adobe Type Library Reference Book still illustrates the special Cyrillic variant, as did all previous editions; it is also shown in the downloadable glyph complement pdf. Can anyone cast any light on this?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/minion_cyr_u_4142.jpg"></div><p></p>
