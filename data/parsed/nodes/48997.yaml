    date_raw: 2 Sep 2008 — 2:55pm
    votes: null
    html: <p>George, thanks for bringing this issue to our attention. We were actually not aware of it. The replacement of the Cyrillic ’u’ by the Latin 'y' was unintentional. It might have happened some time ago when support for Vietnamese was added to the family. A bug has been logged and the Cyrillic 'u' (along with the accented versions of it) will be reverted back to the former shape next time the fonts gets revised. Currently there's no estimate of when that will happen. As for the Type Reference Book and the Glyph Complement PDFs, they're certainly using some old version of the fonts.</p>
