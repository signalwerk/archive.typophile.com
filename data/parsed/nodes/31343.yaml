      <p>Salut, Marc. </p>
      <p>Oui, je parle français. Je suis anglophone du “West Island” mais je me suis trouvée, à une jeune age, avec un chum québecois. Disons que j’ai eu l’occasion de pratiquer mon français. Je ne dirais pas que mon français est parfait, mais certainement passable. Mes enfants sont plus bilingues que moi, et me corrigent souvent.</p>
      <p>Je dois, de plus en plus, créer des publications en versions soit bilingue, soit français et anglais séparées. J’ai retiré le PDF par ce que le livre liste les noms des finissants et j’étais mal-à-l’aise de le laisser là une fois la discussion terminée. Si jamais ça t’interesse, je pourrais t’envoyer un exemplaire. Contacte-moi par email.</p>
      <p>Hope it isn’t too bothersome that we prattle on in French. We aren’t communicating state secrets, I promise. ;)</p>
      <p>K.</p>
