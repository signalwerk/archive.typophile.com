    <p>Hi,</p>
    <p>I’am new here and I would like to present my self.</p>
    <p>My name is Marc from Montréal (speak french, would like to apologise about my bad english) I am a freelance Graphic Designer and also a typophile.</p>
    <p>I’am now working (couple of Months) on my fonts who are going to be name Azoumbie</p>
    <p>I’ve been reading this forum for about two days and the atmosphere seen to be very good.</p>
    <p>Take care,<br>
    Marc</p>
