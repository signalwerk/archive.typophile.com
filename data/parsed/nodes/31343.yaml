      <p>Hi everyone and thanks for the welcoming !</p>
      <p>Auricfuzz,<br>
      You will see it today or tomorrow</p>
      <p>Eben,<br>
      Thanks</p>
      <p>CH,<br>
      I dont know about the defenition of typophile here, but for me typophile it’s not someone who made a fonts but someone who love typographie. About me, I do not consider my self like a typograph (someone who make font, because I am a newbie) but I am a typophile for sure</p>
      <p>Kritina,<br>
      HI, yes it’s very cool to see another person of Montréal, do you speak french a little bit ? I saw a threat who you were talking about a bilingual job you done (not sure, I did not understand all) I would loved to see it but you edited the links.</p>
      <p>Ricardo,<br>
      Gracias Sénior ;)</p>
      <p>Ill sans,<br>
      Let’s me explain about the name. Fist I have a lot of wood statue came from Afrika in my house, they all play a role to protect the house (I know, I’am weird ! -LOL-_). Each statue haved a name, like my cie name is Kabouka came from a statue, about Azoumbie her real name is Zoumbie but a put a A in front because I dont want my font figure at they end whit the Z.</p>
      <p>Ok, who are Zoumbie ? Zoumbie is a female warrior whit a lot of caracter, and I desined my font like that, a lot or caractere whit a touch of feminite. I dont know if I succeed that but I hope people are going to tell me about.</p>
      <p>About me, once again I dont consider my self like a typograph, I am realy a newbie and I am a little bit shame about to show you my font, but I will today on black letter uncial (I dont know what mean uncial I look on the dictionnary but didnt find it.</p>
      <p>Have a good one<br>
      Marc</p>
