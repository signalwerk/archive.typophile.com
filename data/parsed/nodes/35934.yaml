    html: |-
      <p>There may be something you have that is close. What weights do you need. Are you using PC or Mac? </p>
      <p>A very nice freeware serif is Tallys:</p>
      <p><a href="http://www.josbuivenga.demon.nl/tallys.html" title="http://www.josbuivenga.demon.nl/tallys.html">http://www.josbuivenga.demon.nl/tallys.html</a></p>
      <p>Also look into a font called Gentium:</p>
      <p><a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium_design" title="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium_design">http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium...</a></p>
      <p>Otherwise, I can't believe you have a business and don't have some kind of choices that came bundled with the programs you own. (always check the CDs)</p>
      <p>If you do a lot of non-profit work, consider the Softmaker XXL cd. It has a ton of fairly decent fonts for a relatively small sum.</p>
