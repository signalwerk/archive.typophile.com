  html: |-
    <p>I am doing a not-for-profit project (aka no budget for extras). We are trying to do a poster and the font they found that they like I identified has Farnham Display. But we can't afford to buy this font. Are there any other more common fonts or cheaper alternatives that will give us the same look?</p>
    <p>Thanks!</p>
    <p>sorry if this is the wrong place, I wasn't sure where to post :)</p>
