  html: |-
    <p>1) I’ve noticed if you add numerals to a font name Fontlab will generate a warning such as ’PS Font Name contains numbers’… but I know that fonts I’ve worked with in the past have contained numbers and they have always worked. Why is this? Is there a real concern with functionality when font names contain numbers? What about underscores or use of punctuation in font naming? Has anyone experimented with unconventional naming means?</p>
    <p>2) I have a font with two main weights let’s say ’Regular’ and ’Bold’  both which use traditional naming conventions… ’Example Regular’ using long name and the short name ’Example Reg’ and ’Example Bold’ long name and ’Example Bld’ short name… </p>
    <p>Now with these two main weights I have a variation on each which brings the total amount of ’weights’ to four. As far as my acutal .vfb file go’s I have them saved as ’Example Regular, Example Regular02, Example Bold, and Example Bold02’ in order to organize the files. The second variation of each is less an actual ’weight’ change but more a stylistic variation.</p>
    <p>I’m curious what happens with what would be the short name… the ’Reg’ and ’Bld’ IF I were to use numbers in the actual end font names to tag these variations… could Example Regular02’s short name be Example Reg02 and still work?</p>
    <p>Meaning is the ’short name’ an application standard that shouldn’t be modified with numerals, underscores or or is there flexibility there?</p>
    <p>Does anyone have any experience with deviations on traditional font naming? I’d like to lean towards tradition and not deviate but I have a situation where the third and fourth weight of my font is really not a weight variation so much as a stylistic variation of the initial two weights in the font family…</p>
    <p>Mike</p>
