  html: "<p>i'm trying to recreate a faux birth certificate for a playing card game i'm working on. card dimensions: 2.5x3.5 in. <br> <br>i need help finding fonts that stylistically match the following graphics, keeping in mind that final output will be quite small in footprint. <br> <br>of important note, is my fruitless search for flourishes that will get me anywhere near those shown below. <br> <br>can anyone make any suggestions? can anyone create one if there are no stock alternatives, in an hour or two? <br> <br>the following graphics are only similar in spirit. i'm going to take the graphics of the vertical graphic and the text info from the horizonal version to create my own graphic. <br> <br>this is just for a prototype version of the card game, so i'm not concerned with polish. just something convincing enought to evoke idea of a certificate. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/52043.jpg\" alt=\"\"> <br> <br> <br><img src=\"http://www.typophile.com/forums/messages/83/52044.jpg\" alt=\"\"></p>"
