      <p>Mark—</p>
      <p>This is probably going to come out harsher than I mean it, but I can’t really figure out much of a way to softpedal it, so here goes.  I hope this feedback is helpful and I wish you the best of success with your assignment.</p>
      <p>I’m not sure the design really communicates the idea of “Design Culture Now” — The heavy-contrast didone italic, bright-color gradients, and light grotesque strike me as being more like elements you’d see in “Design Culture 1975.”  More importantly, the style that you’re putting out in your poster doesn’t match the style of any of the designers you’re plugging, and is in fact the total opposite of Gabellini’s style.</p>
      <p>I think a complete redesign would get you where you need to go faster than trying to adapt what you’ve got here.  I could also go into more detail about the current design if you’d like — what works, what doesn’t work — but I’d recommend researching the work of those four designers and looking to them for inspiration.</p>
      <p>Good luck!</p>
      <p>—Jim K.</p>
      <p>Also, you mistyped M.A.D. as M.S.D. under Erik Adigard’s name.</p>
