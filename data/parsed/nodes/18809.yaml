      <p>Yea sorry,<br>
      Jim pretty much said everything I wanted to. Even the type selection is quite dated. Try a more contemporary sans that hints on geometric forms like Avenir. Also I hate when people use the {} for rhetorical purposes. Its just so overdone. But thats me personally, others might be fine.</p>
      <p>And your line spacing of “cooper-hewiit museum…” at the bottom is too tight. Compositionally, Id like it to be more complex. Right now only the title is somehwat dynamic and the rest are static. Play around with tons of sketches and post those up. I guarantee ur work at the end of tis process is gonna rock.</p>
