      <p>I’m really torn as to what to say so I’ll just say it. The gradient on the @ is horrid and is in contrast to the one used up top. I generally try to stay away from gradients myself, but that’s a personal preference. The leading in the titles and information section is too tight for my liking. Also the hierarchy of the information text seems backwards to me.</p>
      <p>If you’re going for a dated look, try and find a good publication from the early 80’s, or even some ads or posters and see how they treats the type. I don’t mean to be rude about it but there’s too much visual contrasting for my liking. </p>
      <p>Cheers!</p>
