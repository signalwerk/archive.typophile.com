    <p>Hi there!</p>
    <p>I’m going to spend a few days in Rome, Florence, and<br>
    Milan in January... Do any of you have any<br>
    recommendations of manuscript, typography, and/or<br>
    printing museums that I should check out? I’m<br>
    particularly interested in incunabula and illuminated<br>
    manuscripts, but I’d love to visit some contemporary<br>
    print shops as well.</p>
    <p>Thanks so much!<br>
    Grendl.</p>
    <p>p.s. Restaurant recommendations also welcome... and<br>
    apologies for the cross-posting.</p>
