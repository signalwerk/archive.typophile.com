      <p>I suggest the Museo Bodoniano in Parma (120 km from Milan and on the road form Rome to Milan):<br>
      <a href="http://www.mb-museobodoniano.it/museo.htm" title="http://www.mb-museobodoniano.it/museo.htm">http://www.mb-museobodoniano.it/museo.htm</a><br>
      I am sure you know Giambattista Bodoni, anyway here is the wikipedia entry about him:<br>
      <a href="http://www.mb-museobodoniano.it/museo.htm" title="http://www.mb-museobodoniano.it/museo.htm">http://www.mb-museobodoniano.it/museo.htm</a></p>
      <p>Last but not least, Parma is famous for food (Parmigiano Reggiano and Prosciutto (ham) di Parma above all) and there are a lot of nice places where to eat.<br>
      My suggestion for lunch is “Sorelle Picchi” (<a href="http://www.mytravelguide.com/restaurants/profile-79501805-Italy_Parma_Sorelle_Picchi.html" title="http://www.mytravelguide.com/restaurants/profile-79501805-Italy_Parma_Sorelle_Picchi.html">http://www.mytravelguide.com/restaurants/profile-79501805-Italy_Parma_So...</a>) a nice and peculiar place, since the restaurant is in the backroom of a “salumeria” shop.</p>
      <p>e-mail me in private if you need more infos about my town.</p>
      <p>ciao<br>
      andrea</p>
