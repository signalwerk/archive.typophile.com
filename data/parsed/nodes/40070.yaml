      <p>I know January is cold, but that’s no reason to not eat gelato on the streets. ;-) I was a poor college student when I went, so I didn’t eat at any restaurants. However, there is a nice cafe in Scandicci (a suburb of Florence) called Bar Mario (or is it Cafe Mario?). It’s just a coffee bar, really, but it’s good.</p>
      <p>I went in 1999, and that was before I learned much about typography or took any design classes at all. There’s a lot of great art to be found, especially in Florence: The Uffizi, Palazzo Pitti, L’Accademia...</p>
