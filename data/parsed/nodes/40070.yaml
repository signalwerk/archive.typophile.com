      <p>There is a lot to see in Rome at the National Museum of Rome, Baths of Diocletian, which contains the Epigraphical Department. Not all this came from there but a lot of it did.</p>
      <p>I saw this. <a href="http://www.flickr.com/photos/ebensorkin/sets/72157594336113040/" title="http://www.flickr.com/photos/ebensorkin/sets/72157594336113040/">http://www.flickr.com/photos/ebensorkin/sets/72157594336113040/</a></p>
      <p>I would love to see what you find if you can photograph it.</p>
