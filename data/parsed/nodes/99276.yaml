      <p>Font editor drawing tools have a good pedigree.<br>
      Fontographer was the ﬁrst desktop application to include a bezier-drawing tool, in 1986.<br>
      It was published by Altsys, which later released the drawing/layout app FreeHand in 1988, the same year Adobe released Illustrator, shortly before CorelDraw in 1989.<br>
      Freehand was killed when Adobe acquired Macromedia, which had acquired Altsys, so its demise was not a reﬂection of its quality vis-a-vis Illustrator.<br>
      I used Illustrator from 1989 to 1996, when it underwent major changes (v.6) and a degree of bloat that made my skin crawl when I tried to adapt my mental software to handle it. Subsequently, like Jan, I’ve done all my drawing in Fontographer/FontLab, and created almost all other graphics in Quark/InDesign, except for pie charts.</p>
