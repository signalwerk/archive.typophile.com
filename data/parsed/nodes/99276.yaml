      <div class="comment-spam-body"><p>I think just letting people work out what suits them is the best thing.</p>
      <p>I too have used Freehand, CorelDraw and Illustrator. (Freehand was ahead of it's time)</p>
      <p>I always believe that when a program crosses over without two much loss, do it.</p>
      <p>I come from the Toy Industry and you cannot design wildly original fresh Graphics in Quark or InDesign ....or a Font Editor ;-)<br>
      Likewise with some Unique Type Design. You cannot always quickly create original Fonts in FontLab or Fontographer. These programs are too unforgiving. You can't cut, overlay, swap, add, remove, try multiple images next to each other, on top of each other, move art/images around, off pasteboards, or work as quick on many glyphs as you can in a Vector Program like Coreldraw or Illustrator. You guys forget that while the impression is that while Font Editors might be the end result of precision, the Vector based Programs can be the source of freedom, creativity and freshness.</p>
      <p>Some people use a pencil and paper. Some people like the speed and fluidity of Illustrator or Coreldraw to get a start on the final look of a typeface.</p>
      <p>Each to their own. (But if you want to produce a boring Travel Brochure use Quark/InDesign...DON'T do Graphics IN IT...do page layout instead!)</p>
      <p>If you want to set your creativity free, don't go near a Font Editor first!</p>
      </div>
