    date: 2013-01-01T10:30:00
    votes: null
    html: |-
      <p>If you are more familiar with working in Illustrator, it can be an attractive choice. But there are quite a few drawbacks compared to working directly in a font editor:</p>
      <p>- Conversion of outlines from Illustrator's floating point coordinated to integer values in a font editor (which are required by standard font formats) requires careful inspection for rounding errors.<br>
      - More steps involved, compared to drawing directly in a font editor.<br>
      - No way to effectively work on spacing in Illustrator in a way that will carry over to the font editor.<br>
      - Paths from Illustrator often need cleaning up in the font editor.</p>
      <p>In general, it's faster and more efficient to work on a font directly in a font editor. That's what they were made for, whereas Illustrator was not.</p>
      <p>If you do prefer working in Illustrator anyway, ScanFont provides a good, fast way to get the outlines into FontLab from Illustrator, although it's still more work than working in a font editor from the start.</p>
      <p>(This is coming from someone who used to do his drawing in Illustrator.)</p>
