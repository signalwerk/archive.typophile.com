    html: |-
      <p>It is possible to use Illustrator as your original art source if you're more comfortable with that for the time being and to help you get started. FontLab Studio has a pretty high learning curve and takes some getting used to. Just remember to place all your points in Illustrator on integer values and you should be fine -- precision is the key. Do your art so it does not require scaling once it is in FonLab Studio.</p>
      <p>More information about this on proper preparation of Illustrator art for use with FontLab Studio from Adam Twardoch at FontLab can be found here:</p>
      <p><a href="http://forum.fontlab.com/fontlab-studio-tips-and-tricks/" title="http://forum.fontlab.com/fontlab-studio-tips-and-tricks/">http://forum.fontlab.com/fontlab-studio-tips-and-tricks/</a></p>
