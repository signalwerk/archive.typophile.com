    <p>Hi everyone,</p>
    <p>I've been wanting to get into type design for a long time and now that I'm getting more serious about this, I find it kind of hard to actually start off because I don't know  what the recommended workflow is. Are you supposed to create the shape in Fontlab or is it actually common to design the outlines in illustrator or inkscape, for example (these two seem to have a better range of tools for this task)? I've seen a lot of videos where people create the basic shapes in illustrator and export them to Fontlab later on.</p>
    <p>Thanks for your help.</p>
