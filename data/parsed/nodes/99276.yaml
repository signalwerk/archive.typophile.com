      <p>@webfont   sorry for my answer's delay. The problem with icon fonts is to have them sharp in the browser, and only at a certain size or multiples. For instance if you want to use your web-icon in a text of 14px, you have to design it to be sharp at 14px, and of course 28, 42 etc.<br>
      You're obliged to work with a bigger grid, but you first have to calculate your grid spacing according to the base value of a font (UPM= Number of units per em square).</p>
      <p>In brief, it’s easier to draw into a type design software. Personally I use <a href="http://glyphsapp.com" target="_blank" rel="nofollow">Glyphs App</a>. It's very symple and draw tool excellent, compared to Illustrator.<br>
      Here a tutorial about how to calculate the right values.<br>
       <a href="http://glyphsapp.com/blog/pixel-perfection/" target="_blank" rel="nofollow">http://glyphsapp.com/blog/pixel-perfection/</a></p>
