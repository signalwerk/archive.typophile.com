      <p>Monotype’s retail sites are only the largest marketplaces because of all the third parties selling there. Attempting to drop royalty rates would likely result in type designers signing deals with Phil’s Fonts, Fontspring, Font Bros, etc.. Some type designers would likely not even sign a Monotype contract at lower royalty rates. This would rapidly end Monotype’s position as the dominant player in font retail. </p>
      <p>And the job of antitrust regulators is to protect consumers and innovation. They are not tasked with protecting the royalty rates of small business owners who just want to keep the status quo.</p>
