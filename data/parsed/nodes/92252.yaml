      <p><em>…they own the three biggest competitors and the two biggest retailers in the industry, which seems like something the DOJ usually files a lawsuit over.</em></p>
      <p>The DOJ investigated the Bitstream deal and approved it. Owning web sites for selling fonts has not created an anticompetitive situation. Monotype cannot jack up prices just by owning web retailers. Most of the fonts sold through those web sites are owned by third parties, and those third parties set prices, not Monotype. The exception is Fonts.com, where Monotype tried raising prices above what the foundries would charge, but those fonts seem to be selling better elsewhere. Nor can Monotype raise prices on the Lino/Mono/ITC IP. They face stiff competition there from Adobe, URW, Scangraphics, etc., who all sell the same or better digitizations for lower prices. All Monotype’s acquisitions have really done is raise its profit margin by ensuring that it keeps all the revenue from almost all sales of old fonts like Helvetica, Univers, Futura, etc..</p>
