      <p>Monotype doesn't fix prices, but it does determine how big a cut it will take out of its competitors' sales if they want access to the largest marketplaces. The advertised commission at MyFonts is 50%, although some apparently have more attractive arrangements.</p>
      <p>As for Berthold, I added it after Googling Monotype and Berthold and seeing a clutch of headlines from news aggregator Topix about an acquisition. But it turns out those are forum posts, and there's no official word, so I've removed it from the list.</p>
