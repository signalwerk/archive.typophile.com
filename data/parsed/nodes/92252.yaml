    </ul><p>They are also the owners of what remains of former parent corporation Agfa, as well as the vestiges of various smaller companies they've acquired and shuttered. Additionally, they are the creators and sellers of the Adobe Type Collection, but they license those fonts from Adobe.</p>
    <p>Have I forgotten anything? In compiling this list, it strikes me that they own the three biggest competitors and the two biggest retailers in the industry, which seems like something the DOJ usually files a lawsuit over.</p>
