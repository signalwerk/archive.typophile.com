      <p>At the risk of being rude, what's going on with your copy on the Baskerville poster? It reads like text auto-translated from another language.</p>
      <p>"The Baskerville typeface is the result of John Baskerville's intent to improve upon the types of is William Caslon. He increased the contrast between thick and thin strokes, making the each serifs sharper because more tapered, and shifted the axis of rounded letters to a more vertical position. The curved strokes are more circular shape, and the characters."</p>
      <p>The right hand side fares better because it's just a quote from the typowiki, but there's the random phrase "a larger series" in the middle of the italicized text, in roman face.</p>
      <p>Aesthetically, it looks like a reasonable homage to the period, but I agree that the letterspacing could use attention.</p>
      <p>Before you fix anything visually, though, figure out what happened to your text and fix that. A nice-looking poster that presents no useful information isn't a design, it's just a piece of art.</p>
      <p>I was about to point out problems with the copy on the helvetica one too, but then I realized they were both just lifted from wikipedia (although something went weird in your copy/paste for Baskerville). You need to either pick a source with an actual editor or write something yourself that makes sense.</p>
    html_clean: |-
