      <p>no, uppercaseH:</p>
      <p>you make good points. First thing I thought when I saw Baskerville was that there was something up with the title. Then I thought, for a second, "maybe it's just because it's not meant as a header text...maybe it's because I've possibly never seen it so big" but then I snapped out of it. It looks odd, even the stroke weight looks a little off, but that could be me, who knows.</p>
      <p>As for using a quote, even in a poster there should be some reference as to where it came from. I mean this could be a quote from anywhere, you will get more merit if you cite your source when using a quote. (Doesn't have to be full citation of course, but something) I doubt wiki address will get your much merit.</p>
      <p>The design of the Baskerville is coming along, good color. I do like the "Q" in the background, just because it adds some texture, but why is it there? Does it serve a purpose to the poster?</p>
      <p>And a very small thing that is bugging me, near the bottom...the "Jj" looks a lot bigger than the "Aa". I think it might be partially because the J is sticking out. It might help to bring it inland, just a little. I mean 1 or 2 picas. (depending on how big this poster actually is)</p>
      <p>Sorry if this sounds nit picky, but if you have a good start, why not make it a solid piece you can be proud of? :)</p>
      <p>courtney</p>
