      <p>Hi Steve,<br>
      I don’t know. All I can contribute is that there’s <a href="http://www.myfonts.com/fonts/urw/stiletto/" rel="nofollow">Stiletto</a> by URW++ (Designer: Ralph M. Unger) – that looks very similar. And then there’s <a href="http://www.myfonts.com/fonts/bergsland/adieu/" rel="nofollow">Adieu</a> by David Bergsland; also quite close. He claims that “Adieu is an old-fashioned display font traced and modified from a group of Victorian fonts.”</p>
      <p>F</p>
