    html: |-
      <p>David, What you describe was certainly true for Monotype, &amp; I guess Linotype -- obviously you would know.</p>
      <p>But</p>
      <p><cite>This was done to give the small caps wider bodies relative to the shortened height and prevent them from ending up weaker than the lowercase.</cite> </p>
      <p>Doesn't quite work, in that even non-porportional scaling doesn't give the stem weight increase, so they wind up looking weaker anyway.</p>
      <p>You're right about the handwork required -- I've had to do it too many times.</p>
      <p>The other possibility was that with some metal composition, you could always use, say, 8-point full caps mixed in with 10-point U&amp;lc. Leading could be a problem, but there were ways around that, too. Still, that's a *compositors* solution rather than a font property, so he probably didn't meant that.</p>
  - id: 273491
