    html: |-
      <p>My guess is that McGrew was using the two terms to describe the same thing. &amp; that thing is as described by David &amp; Charles: fonts of small capitals drawn &amp; then cut to blend seamlessly with both upper case and lower case sorts of the same face and size. Stem weights, character widths, all proportions were worked to make the smalls "true-cut." </p>
      <p>The term "true-cut" was also used by the Ludlow Typograph Company to describe some of its faces. I think they had a "True-Cut" Caslon and a "True-Cut" Bodoni. Yet another attempt by a typecasting company to claim their faces were closest to the "originals." I'll have to look at my Ludlow books over the weekend to see if those faces had smalls.</p>
      <p>powers</p>
