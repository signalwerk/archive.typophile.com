  html: |-
    <p>On page 75 of <em>American Metal Typefaces</em>, Mac McGrew lists "What's in a font" and includes Small Caps, and later in the list "Typographic Refinements... 'true-cut' small caps." What are these "true-cut small caps" as distinct from the small caps he's already listed?</p>
    <p>(Note that this is about metal type, not computer "faux small caps" a la Microsoft Word.)</p>
comments:
  - id: 273245
    user: 2969
    date: 2008-04-17T04:29:00
    date_raw: 17 Apr 2008 — 4:29am
    votes: null
    html: |-
      <p>I'm not absolutely positive this is how McGrew uses the term, but, it has been possible since the metal age to trace the drawings of the Caps with a machine that would shrink them at different factors in x and y to make small caps, cheaply. This was done to give the small caps wider bodies relative to the shortened height and prevent them from ending up weaker than the lowercase. Today, this can be done by scaling the uppercase by different  factors to create small caps (“faux small caps”).</p>
      <p>But these techniques do not produce the best results which involve handwork, either from the beginning, or after the mechanical scale. It is this work, correcting the diagonals, vertical serifs and more, (much more in an italic),  that produces what I think McGrew calls  ’true-cut’ small caps. Anyone know different?</p>
      <p>Cheers!</p>
