  html: "<p>i'm wrestling with two things here: inexperience, and, inexperience. <br> <br>i have two designs for an upcoming version of MT that aim to make the store more user-friendly and more showcase-efficient. no more flash, just html. <br> <br>the whole idea is to make the site function better as a store. so, the graphic design is quite basic. <br> <br>here's my problem: one design is sort of aggressive, supporting the logo/namesake, but may be a bit confusing to some users navigation-wise. however, this same design may be more appealing to designers as a group, which is my target market. the other design is quite feminine by comparison, and while it is about as intuitive navigation-wise as it gets, i'm not sure the design sends the right image for MT. <br> <br>here's my question: should i cast as wide a net as possible, and go for \"no brainer\" usability? many designers may think this approach a bit cheesy, but i won't lose the segment of designers who could care less about MT's aesthetics and just want concise functionality (in either case, myfonts.com comes to mind). <br> <br>aggressive: <br><a href=\"http://www.meantangerine.com/beta/store03/home07b.png\" target=\"_blank\">latest pixel font page</a> <br><a href=\"http://www.meantangerine.com/beta/store03/home07a.png\" target=\"_blank\">latest photo page</a> <br> <br>playful: <br><a href=\"http://www.meantangerine.com/beta/store03/home09b.png\" target=\"_blank\">latest pixel font page</a> <br><a href=\"http://www.meantangerine.com/beta/store03/home09a.png\" target=\"_blank\">latest photo page</a> <br> <br>please weigh in on this for me, even if you just send one word denoting which design you like better; aggressive or playful. <br> <br>i really need some help on this.</p>"
  html_clean: "<p>i'm wrestling with two things here: inexperience, and, inexperience. <br> <br>i have two designs for an upcoming version of MT that aim to make the store more user-friendly and more showcase-efficient. no more flash, just html. <br> <br>the whole idea is to make the site function better as a store. so, the graphic design is quite basic. <br> <br>here's my problem: one design is sort of aggressive, supporting the logo/namesake, but may be a bit confusing to some users navigation-wise. however, this same design may be more appealing to designers as a group, which is my target market. the other design is quite feminine by comparison, and while it is about as intuitive navigation-wise as it gets, i'm not sure the design sends the right image for MT. <br> <br>here's my question: should i cast as wide a net as possible, and go for \"no brainer\" usability? many designers may think this approach a bit cheesy, but i won't lose the segment of designers who could care less about MT's aesthetics and just want concise functionality (in either case, myfonts.com comes to mind). <br> <br>aggressive: <br><a href=\"http://www.meantangerine.com/beta/store03/home07b.png\" target=\"_blank\" class=\"link-external\">latest pixel font page</a> <br><a href=\"http://www.meantangerine.com/beta/store03/home07a.png\" target=\"_blank\" class=\"link-external\">latest photo page</a> <br> <br>playful: <br><a href=\"http://www.meantangerine.com/beta/store03/home09b.png\" target=\"_blank\" class=\"link-external\">latest pixel font page</a> <br><a href=\"http://www.meantangerine.com/beta/store03/home09a.png\" target=\"_blank\" class=\"link-external\">latest photo page</a> <br> <br>please weigh in on this for me, even if you just send one word denoting which design you like better; aggressive or playful. <br> <br>i really need some help on this.</p>"
