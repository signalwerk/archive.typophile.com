    html: <p>thanks guys, for sharing your feedback with me. the dark version does have rollovers, but the words themselves light up. the buttons could depress when selected, but it gets tough with the three-tier menus. the top and bottom depressions look quite nice. the middle buttons look terrible depressed. <br> <br>each section in this design has its own color, orange for home, purple for pixel fonts, blue for images, etc., as shown in the little logo. <br> <br>in either case Tiffany, it may not be as much user feedback as you're looking for? perhaps i should give that a little more thought.</p>
