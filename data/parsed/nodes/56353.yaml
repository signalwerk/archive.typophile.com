  html: |-
    <p>I’m working on a collection of dingbats specifically for a font that I created. It will include directional devices - arrows and pointing hands. Should I create a cell for each direction (left, right, up, down) for each symbol? Or, is one sufficient and the user can point them wherever they want to? I’ve noticed in other symbol fonts that there were redundant pointers for each direction. </p>
    <p>On the other hand, maybe dingbat fonts are redundant?</p>
    <p>Opinions? Comments? Rude gestures? </p>
    <p>~~~~~~~~~~~~~</p>
    <p><a class="freelinking-external" href="http://www.thefontry.com"><em>...from the Fontry </em></a></p>
