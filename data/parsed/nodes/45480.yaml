      <p>Good question. I thought I was trying to express a subculture and the hardcore commitment that qoes with it. But I blew it.<br>
      The mischief-power of graphic design would be better served by adding more fingers. Mutate reality to accommodate language, not the other way around. In the street-cred department, I think the thumbs should be unambiguously outside the fingers. </p>
      <p>I reworking this thing, fer sure.</p>
