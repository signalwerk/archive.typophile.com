      <p>Dude! Listen to Carl ( Crossgrove ). </p>
      <p>There is no way that your e* would not change shape depending on what letter comes before or after it - especially  when they connect. And when there is no letter either before or after it that would be different too. Look carefully and you will see, context matters - alot! Without contextual variation your font cannot *really* look like handwritting. It will look disjointed - like it does now. If on the other hand you don't want to do opentype &amp; scripting then to make a good looking font you will probably need to start thinking about the font as a script font &amp; not as handwritting.</p>
