    html: |-
      <p>Yes, Listen to Eben!  ;D</p>
      <p>You might get most of your letters to join and only have 2 or 3 troublemakers. Then, OpenType can solve that problem. Maybe you only have to add a few lines of code to change things contextually. You wouldn't need to change everything. You could do it with alternate single letters or with ligatures. </p>
      <p>I do think it is all much easier if your joins are all on the outstroke (right side). Then, if an o or t joined from near the x-height, it could hit the next letter wherever it looked good, even if a or e joins lower. </p>
      <p>Nick points out that not all exit strokes have to join. True! In fact, not all letters have to have an "exit stroke". Look at your writing. If you lift the pen between letters, see if there's a typical place where that happens. I usually lift my pen after a z, p, v, and sometimes other letters if they are right in the middle of a word. Some people's handwriting doesn't join much at all. There are several typefaces out there that are based on handwriting that is really more like printing, and they don't join anywhere. If it gives a realistic effect of something written by hand, then it doesn't matter if things all join the same way. </p>
      <p>Handwriting is really quite difficult to adapt to type. It has to do with how regular, and how joined it is. My handwriting is very loopy and inconsistent, and I've tried to make a typeface out of it. Even with OpenType, I would have a lot of work to get something looking like my handwriting. Not worth it, since it's illegible anyway.</p>
