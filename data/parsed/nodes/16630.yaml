    html: |-
      <p>Yes, Mistral by Roger Excoffon, who relied on his intuitive grasp of<br>
      form but also some fairly rigorous analysis: the study of letter-pair<br>
      frequencies (in French) to help decide the relative vertical placements<br>
      of the glyphs, hence how the joins lay out.</p>
      <p>There's a great article in an old issue of Herbert Spencer's Typographica<br>
      magazine nicely detailing the development of Mistral. It's a mûst.</p>
      <p>hhp</p>
