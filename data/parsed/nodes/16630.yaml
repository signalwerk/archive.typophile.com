    html: |-
      <p>&gt;I suspect that generally makes the exit strokes too long though.</p>
      <p>Well, I don't want to do too much of Phat's work for him, but not all exit stokes have to join, and they can head in different directions to touch the following letter high or low, and not all characters require an exit stroke. Flexibility.</p>
      <p>Mistral rather does it the other way, by having some very pronounced entry strokes.</p>
      <p>Caflisch is a good example of what I'm suggesting.</p>
      <p>However, if a designer really wants to have a joining strategy that uses both entry and exit strokes, here's a technique I developed in Handsome: create a very short "middle of the join" angled stroke to place in the mask layer at both sides of each glyph, bisected by the sidebearing, then make sure every joining stroke overlaps it perfectly -- entry strokes from above, exit strokes from below. I suspect Roger Excoffon did that sort of thing.</p>
