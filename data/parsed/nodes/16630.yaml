    html: |-
      <p>That has made an enormous difference. Smoothed everything out. Now, we can look at single letters or joins that aren't working. There's not much left, good thing this is an informal handwriting face! </p>
      <p>I would re-think T completely, honestly, it looks like an ampersand or a crossed-out C to me. C can be refined to join nicely, as could E, M and U. </p>
      <p>The outstrokes could be longer, so you could have better spacing: everything looks tight, and some of the letters themselves are narrow, so it might help make it more readable to open the spacing, and maybe widen h, m and n. Since b, c, o, p, q and s are so wide, they interrupt the rhythm of words. </p>
      <p>Adjust the weights of the caps to be more even. That is all I see right now.</p>
