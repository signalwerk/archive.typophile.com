    html: <p>The scripting is actually *much* easier than you would think. Don't worry at all! You can search for threads that apply on typophile right here. There is almost certainly somebody who has done something similar already &amp; they may have code to try. But even before you worry about code I recommend that you start by looking at the variations you naturally get as a result of putting one letter or another next to each other. For instance, most people connect an a at the base of the a or an o from the top of the o. Compare how they connect to an r. Compare too how they connect to an l. When you have observed enough you will be able to script in a way that suits your handwritting.</p>
    html_clean: <p>The scripting is actually *much* easier than you would think. Don't worry at all! You can search for threads that apply on typophile right here. There is almost certainly somebody who has done something similar already &amp; they may have code to try. But even before you worry about code I recommend that you start by looking at the variations you naturally get as a result of putting one letter or another next to each other. For instance, most people connect an a at the base of the a or an o from the top of the o. Compare how they connect to an r. Compare too how they connect to an l. When you have observed enough you will be able to script in a way that suits your handwritting.</p>
