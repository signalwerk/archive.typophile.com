      <p>First off, I think you need to decide of you are going to use Open type scripting to make the font look more like real handwritting with variation and context dependence - where a lc l conncect to another l vs. connecting with some other letter vs. staring or finnishing a word for instance. Or if the face isn't going to do that and is going to be more like an older commercial 'script' font like this one.</p>
      <p><a href="http://www.myfonts.com/fonts/linotype/shelley-script/" title="http://www.myfonts.com/fonts/linotype/shelley-script/">http://www.myfonts.com/fonts/linotype/shelley-script/</a></p>
      <p>where the connections are more calculated &amp; less casual. Forst instance, in the second case you would have to redesign your lc 'l' to look less ackward when it connects to other letters.</p>
      <p>There are tons of other observations that could be made but I think they would all assume (falsely) some insight into what you had decided about this first issue.</p>
