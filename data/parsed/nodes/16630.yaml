    html: <p>Though it's true that OpenType can help this font do more things, you can work on the existing outlines to get a more smooth, realistic connecting flow. Note how the instrokes and outstrokes of some letters collide with, or miss other in/outstrokes.Find ways to get the in and out strokes to all fall in the same place, so that letters appear to join. For instance, put a and l together in your FontLab metrics window. See how the blob on the bottom left of l interrupts the apparent flow? If you can change that part of l so it looks like a and l are written together, then you've improved not only the al join, but also anything that joins the same way. Fix the joins of i, j, l, m, n, r, u, and y, and it will improve a lot. you may have to change the spacing of letters to get the joins looking good. Please post updates!</p>
    html_clean: <p>Though it's true that OpenType can help this font do more things, you can work on the existing outlines to get a more smooth, realistic connecting flow. Note how the instrokes and outstrokes of some letters collide with, or miss other in/outstrokes.Find ways to get the in and out strokes to all fall in the same place, so that letters appear to join. For instance, put a and l together in your FontLab metrics window. See how the blob on the bottom left of l interrupts the apparent flow? If you can change that part of l so it looks like a and l are written together, then you've improved not only the al join, but also anything that joins the same way. Fix the joins of i, j, l, m, n, r, u, and y, and it will improve a lot. you may have to change the spacing of letters to get the joins looking good. Please post updates!</p>
