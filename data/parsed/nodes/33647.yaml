    html: |-
      <p>"If one were to invent a new uppercase letter, it would have to stylistically match the Roman uppercase."</p>
      <p>"Besides, isn't it fun to invent a new letter?"</p>
      <p>hmm. It is serious business and usually only taken up in the interest of a large and pressing need, (over 150years since an alphabetic was needed, no?). It will be expensive, and time consuming if we ever have to do it, which I doubt. But if I had a 1/2 hour to spend on it...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/upperSS_5890.png"></div><p></p>
      <p>Make us sweat. Besides, a simpler way to form an s in calligraphic writing, truncated to the lowercase f form in roman type with an s ligated on and then blown up to uppercase proportions is hardly inventive, confusable with existing glyphs and simply not Romanizable enough with it's "one-too-many" moves within the cap ht.</p>
      <p>Cheers</p>
