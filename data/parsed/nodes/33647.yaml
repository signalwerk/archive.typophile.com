      <p><cite> Drawing, you know, is the first refuge of the confused. </cite><br>
      @David: why?</p>
      <p><cite> Beware of people who (want to) make history without knowing it.<br>
      […]If you don’t have a proper understanding of what you are supposed to design, what are you designing then? </cite><br>
      @Karsten: most important remarks. Altaira is also right: see historical precedents, if the form has  in some cases been written in "more uppercase" form (there is no fixed distinction about the two, save the one matured in typographic tradition).</p>
      <p><cite> A great specific example here is the ampersand. It comes from “e” + “t”. Whoop-di-doo. When you take that too seriously you end up with a form that causes reading problems for many people*, like in Poppl Laudatio (which I otherwise adore). A well-designed ampersand is based on what people need; what it used to be is just fodder for pedantic discussion. </cite><br>
      @Hrant: Downright pretentious, because the "and-per-se-and" is, and actually remains an "et".<br>
      I would have had problems to understand its being an [e] just *before* someone told me it was an "et", which – as an Italian – comes as a perfect logical succession, or better as the same thing.<br>
      It has happened some people asked me to change Rotis' "Et" into a more common [&amp;] form, but that's because people in Italy still think of the [&amp;] solely as a "commercial e" (in Italian it's called "e commerciale"), and they do not know it's an "et", out of ignorance.</p>
      <p>Read both these entries:<br>
      <a href="http://it.wikipedia.org/wiki/Ampersand" title="http://it.wikipedia.org/wiki/Ampersand">http://it.wikipedia.org/wiki/Ampersand</a> (Italian)<br>
      <a href="http://en.wikipedia.org/wiki/Ampersand#Usage" title="http://en.wikipedia.org/wiki/Ampersand#Usage">http://en.wikipedia.org/wiki/Ampersand#Usage</a> (English-International)</p>
      <p>As much as Wikipedia is nonsense, these entries show how the evolution happens by a combination of planning and usage, despite all the thinking it may be done before.<br>
      The world may have become "anglocentric" (in terms of shared tongue), but – as you see – this happens out of necessity, otherwise we wouldn't be allowed to be here to talk together in a shared experience…</p>
      <p>Now, my big question (since it is still not clear to me): is the [ß] a simple double s? Of course not, since it's a "sharp" z-sound. So, why people keep using it as a substitute for "ss"?<br>
      Besides, how an "ss" ligature should be drawn?<br>
      And [AE] or [OE]? They are not ligatures, they address sounds, right?</p>
