      <p>Ah yes, the old days when one could bake-n-eat the enemies of Jesus to the sound of the Lord's prayer. Make that a Vienna Sausage and Hrant'll take two — or maybe not. Me, I just think of it as a piece of bread with the butter built in. </p>
      <p>"[Rue Montmartre, Paris]" From the looks of it, in this context, the sign says "Croissant", and assuming Paris is still in France and the French still speak French, (I didn't miss another Franco-German war Monday and Tuesday, did I?), then this sign can stay, thanks. </p>
      <p>But more than that...I pine for the days when people knew how to make new letters: The migration of a lowercase to uppercase form is wrong in this proposal, isn't it? The migration from a long lowercase s, (invented for the lazy and rushed to improve the appearance of a difficult s to scratch), to an Uppercase F, is wrong isn't it? Following "historical precedent" from gravestones, sporadic bits of metal and folks with no apparent historical expertise or typographic experience is wrong in this letter, isn't it?</p>
      <p>Giving righties something sinuous and sexy to draw "from their side", making a letter that looks something remotely like the sound, and following an historically correct path to a new and true uppercase letter — that cannot possibly succeed these days, I know. But making sense never goes out of style does it? </p>
      <p>Cheers!</p>
