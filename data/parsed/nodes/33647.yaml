      <p>Adam says? "The first line shows what the historical origin of ß looks like,"</p>
      <p>The typographic origin, perhaps? but not the original origin...is it?</p>
      <p>Nick says: "Is that a reasonable assessment, David?</p>
      <p>I think we are looking at an engraving here and not calligraphy. So, in an n-step process, it's possible anything could be done, as opposed to a 1-step process like calligraphy, where what you see here would be impractical.</p>
      <p>From the proposal, Ehmcke Antiqua shows a design with 10 uppercase letters as lowercase forms. Is this not an unusual typeface to show when one is trying to make the point they are making? lal.</p>
      <p>The next page of examples, all three designs in the left column show faces with relatively large contrast between the ii space and o counter. I couldn't "prove" in type court that these are uppercase and not alternates or, that the compositions, (which place the specimen letter everywhere but with the uppercase) are showing me uppercase ß now could I? </p>
      <p>All three designs in the left column are hideous as are many of the next set. And as I play the "whole library" ( i.e. everyone's), out on this form, it's a bad scene. Not the doing, though I'm sure that'll be hard for just the German founders, but the designing of some faces where it's just not going to "escape" the B without ugliness against the grain of the design.<br>
      Show me a geometric. Mistral please. Heaven help the font with a bigger top on the S. </p>
      <p>Another example, in Adam's additional attempt, "This alternative treatment is analogical to the alternative treatment of the “J”, which may reside on the baseline or descend below it." </p>
      <p>But why then would not the first stroke descend like the "J" and the second sit like the "S", i.e. the lowercase design? Afterall there is no "S" on this planet with a serif sittin' on the baseline like an "F"...is dare?</p>
      <p>Cheers!</p>
