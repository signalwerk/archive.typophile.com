      <p>I must admit that most of the designs Mark posted look like broken B glyphs or R's with a wayward tail. I think as designers, we work on glyphs and have a knowledge of what is the essence of that glyph since we have been seeing it or drawing it all of our lives. The trouble comes when we define a new glyph that as of yet has no agreed upon essence in form, It is simply not in our repertoire yet. I guess we are a few hundred years late to the game :-) Instead of depicting the essence by giving it form, we are defining the essence without knowing the form. It is like a tailor who knows how to fit a suit of an old customer, having done it many times. He may get a call from a brand new customer but gets no details of size or measurements or taste in fabric or color, he only know that he is a different size than all of his other customers. Would our tailor create the perfect fit sight-unseen on the first try?</p>
      <p>ChrisL</p>
