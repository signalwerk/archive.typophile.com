      <p>Anyway, Hrant thought the following was a good synopsis of the matter, offered here as a contribution to the understanding of how we came to be where we are: wondering what this thing should look like.</p>
      <p><em>A few comments about the proposed uppercase eszett character:</em></p>
      <p>This has been proposed to ISO 10646 (and hence Unicode) by DIN, so the likelihood of it being accepted for encoding is very high. Since it is a German character, with no implications for other languages, no one feels particularly inclined to vote against a DIN proposal. If the Germans determine that they want this character, they can have it.</p>
      <p>So why do they want it? Basically, they want it because at least some people are using it and it is considered better to have an unambiguous encoding distinct from SS. The uppercase eszett is not a new invention: it has been around for at least a hundred years. It has been used on-and-off by some publishers -- notably on the cover of the DDR edition of Duden -- and although it has never been enshrined in the official norms of German orthography it persists. As Asmus Freytag wrote on the Unicode discussion list: it is remarkable that something without official sanction should have persisted so long in such a rule-bound culture.</p>
      <p>There can be little doubt that at least some of the users of the uppercase eszett have employed it in the interests of alphabet reform, i.e. they want to see it become standard. Others may have used it only as a display solution for a particular piece of typography. For whatever reasons, some Germans have found a use or a need for it, in preference to SS.</p>
      <p>And let's be clear that the casing rule ß = SS is really messy for a nominally bicameral alphabet. Although ß began life as a ligature, it has long since ceased to function as one: it has distinct semantics from the sequence of two letters that it used to represent. It is a distinct character. The idea that it can be a distinct character in lowercase but not in uppercase is perverse, and causes major headaches in German text processing. The simple fact that case conversions in German are not roundtripable without dictionary support is crazy. Even if it were decided that the uppercase form of ß should always look<em> like SS, a good argument could be made for encoding this as a distinct uppercase character. However...</em></p>
      <p>...that's not how German is encoded, and the DIN proposal for uppercase ß is explicit that the new character should not interfere with existing standards for German text. So this means that ß still = SS, and the Unicode casing rules for German remain in place. The new uppercase ß character will exist alongside these rules. What this means is that any software performing case mapping between the new uppercase ß and the lowercase ß characters must do so at a level independent of the Unicode character properties. This is quite possible, and if the uppercase ß character starts to become widely used I think we can expect to see it handled in such ways.</p>
      <p>The uppercase ß encoding is an interesting instance of a character being made available outside of the norms of encoding for the language in which it might be used. This might sound silly, but it allows this persistent heterographic letter to function in modern text encoding and display environments, and in so doing puts a lot of control in the hands of users to determine its future. It may fall by the wayside -- one more little used Unicode codepoint -- or it may, in time, become formally recognised and made part of the standard orthography.</p>
      <p>At first glance, it may seem contrary that, on the one hand, the Germans have regularised and simplified the use of ß -- suggesting, at least to Bruno, that it is on the way out --, but on the other hand providing at least some recognition for an uppercase ß. But it is easy to see how these may be complementary moves: providing a distinct uppercase equivalent to a lowercase character regularises an anomaly in a bicameral alphabet and simplifies case conversion.</p>
