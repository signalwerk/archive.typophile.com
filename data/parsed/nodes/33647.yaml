    date: 2007-05-09T18:41:00
    date_raw: 9 May 2007 — 6:41pm
    votes: null
    html: |-
      <p>BTW, in a font, the appropriate glyphname for the uppercase ß would be <code>germandbls.case</code> or <code>germandbls.cap</code> but <em>not</em> <code>Germandbls</code>! Should the character be encoded in Unicode under the proposed codepoint, a better glyphname would be <code>uni1E9E</code>, but I wouldn’t start using that glyphname yet.</p>
      <p>In an OpenType font, you might want to encode the glyph as a "stylistic case variant". To do that, do the following: </p>
      <ol>
      <li>Create an indentical duplicate of the lowercase <code>germandbls</code> glyph named <code>germandbls.ss01</code>. </li>
      <li>Design your uppercase ß and name it <code>germandbls.case</code>. </li>
      <li>In the OpenType Layout feature definition code for the <code>salt</code> and <code>ss01</code> features, include the substitution <code>sub germandbls by germandbls.ss01</code>.</li>
      <li>In the OpenType Layout feature definition code for the <code>case</code> feature, include the substitution <code>sub germandbls.ss01 by germandbls.case</code>. </li>
      </ol>
      <p>If your font contains smallcaps, then in addition: </p>
      <ol>
      <li>Provide a glyph named <code>germandbls.smcp</code> which looks like two smallcap-S letters (the "traditional" way of making a smallcap ß). </li>
      <li>Design your "new" ("true") smallcap-S and name it <code>germandbls.smcp_ss01</code>. </li>
      <li>In the OpenType Layout feature definition code for the <code>smcp</code> feature, include the substitution <code>sub germandbls by germandbls.smcp</code>.</li>
      <li>In the OpenType Layout feature definition code for the <code>salt</code> and <code>ss01</code> features, include the substitution <code>sub germandbls.smcp by germandbls.smcp_ss01</code>.</li>
      <li>Make sure that the feature definitions for <code>salt</code> and <code>ss01</code> are ordered <em>below</em> the definition of <code>smcp</code>.</li>
      <li>If uppercase ß gets encoded in Unicode and your font has a glyph with it named <code>uni1E9E</code>, then in the OpenType Layout feature definition code for the <code>c2sc</code> feature, include the substitution <code>sub uni1E9E by germandbls.smcp_ss01</code>. It that case, you may also consider using the name <code>uni1E9E.smcp</code> instead of <code>germandbls.smcp_ss01</code>. </li></ol>
      <p>It just occured to me that another approach to the uppercase ß might also be feasible (again, sorry for the imperfect color of the strokes):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/germandbls_garamond2_5760.png"></div><p></p>
      <p>This alternative treatment is analogical to the alternative treatment of the "J", which may reside on the baseline or descend below it. </p>
      <p>Adam</p>
