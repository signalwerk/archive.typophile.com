      <p>Hi Paulo. This <a href="/wiki/%5B%5Bhttp%3A/%252Fwww.signographie.de/cms/upload/pdf/Signa9_Formfrage_SZ_2.01.pdf" class="freelinking" rel="nofollow">article</a> from Andreas Stötzner shows samples for script Cap Eszett. You may find two samples at the bottom right of <a class="freelinking external" href="http://www.signographie.de/cms/upload/pdf/SIGNA9_SHARP_S_howto.pdf" rel="nofollow">this PDF</a>.</p>
      <p>Additional sources of research:<br>
      <a class="freelinking external" href="http://www.spiegel.de/kultur/literatur/0,1518,539266,00.html" rel="nofollow">http://www.spiegel.de/kultur/literatur/0,1518,539266,00.html</a><br>
      <a class="freelinking external" href="http://www.signographie.de/cms/front_content.php?idart=136" rel="nofollow">http://www.signographie.de/cms/front_content.php?idart=136</a><br>
      <a class="freelinking external" href="http://www.signographie.de/cms/upload/pdf/Signa9_ZurDresdnerForm_1.0.pdf" rel="nofollow">http://www.signographie.de/cms/upload/pdf/Signa9_ZurDresdnerForm_1.0.pdf</a><br>
      <a class="freelinking external" href="http://www.signographie.de/cms/upload/pdf/Signa9_Kombinatorik_SZ_3.0.pdf" rel="nofollow">http://www.signographie.de/cms/upload/pdf/Signa9_Kombinatorik_SZ_3.0.pdf</a></p>
      <p>All these links are found from Signographie.de. Andreas Stötzner is the great specialist on this character and also the one who proposed it to Unicode. You may also note there are different historical forms according to German region the shape comes from. For me, Dresdner is the most interesting one.</p>
