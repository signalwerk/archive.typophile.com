      <p>&gt;You would expect a greek lowercase letter in an uppercase German proper name!? ;-)</p>
      <p>Why not? Most readers on the planet know neither German nor Greek. Yet we expect them to know the difference between betas and Eszetts. When I was doing corporate design work in Washington, DC, we had to disguise a lot of the companies who we researched. So instead of publishing a report on Acme, Inc., we called them Beta Corporation, or something like that. Readers of our reports knew who we were talking about, but we didn't name names without permission.</p>
      <p>Anyway, the authors I worked with always thought that it would be clever for the first letter of Beta Corporation's name to be an actual beta, rather than a b. But their fonts did not have betas in them, or they didn't know how to input a beta. So they just write ß (ßeta Corporation). Most of them thought that the ß actually was a beta anyway. Good luck trying to educate them to see around that one ;-)</p>
