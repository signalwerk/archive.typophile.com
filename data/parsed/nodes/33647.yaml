      <p>Fortunately, I think, there are organizations around in Germany who make decisions about proper and improper German writing. The Unicode Consortium is not one of these organizations. IIRC, the most recent issue of <em>DUDEN</em> states that ß should be written as SS in strings of capital letters.</p>
      <p>With a cap ß in Unicode, you could program a font to make substitutions like Meißner to MEIßNER <em>(with cap ß… not in this font yet, hehe),</em> but it still would not be correct German. The correct way is still MEISSNER. Now, because software has changed, perhaps a future <em>DUDEN</em> will make a spelling change, too. But it has not yet done so. And I think that they will want to hear from more than just a few concerned typographers, too, before they change the language's rules. Who knows?</p>
      <p>So, when you build your fonts, if you put in a capital ß (who is really going to start doing this? Adobe? Microsoft? Monotype? Linotype? FontFont?), it requires a bit of code, because when the word Meißner is highlighted in InDesign and made all caps, the change should still be to MEISSNER. Since there is no cap ß key on any German keyboard, the cap ß will only have accessible via the glyph pallette or a stylistic set, contextual alternate, etc.</p>
