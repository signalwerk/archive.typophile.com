      <p>ABCDEFGHIJKLMNOPQRSTUVWXYZ pretty clearly expresses itself as dominated by second-side terminal logic. So, when something is expected to be, by the sound unvoiced though it may be in a reader's mind, first-sided terminal logically, I think it is pretty important that it is, just to keep der dear reader downset. That a barless F <em> looks </em>more like an uppercase character than a J, is interesting, and may be appropriate in some places, but maybe just easiest way to make something look uppercase, and is not specific enough. Most who have experimented here have gravitated to serif designs, the ones with little feet things attached which makes it <em> blend in </em> all nice, but... I think in humanist sans, and of the sans experiments here, I think few approach success. So, relying on the stored biological memory of the original, pre-laziness lowercase form, and the space-saving intent of its creators, I go that way — clearly not a B, Beta, F3 ligature, SS, with no confusion at the waist and no gigantic open counter and with first-sided terminal logic.</p>
      <p>Cheers!</p>
