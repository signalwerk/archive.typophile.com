    html: |-
      <p>Three observations on German special glyphs:</p>
      <p>1) fi, fl, ff, ffl, ffi, and st were grandfathered into Unicode as Alphabetic Presentation Forms, but not fz and tz.</p>
      <p>2) German ligatures that aren't: ch and ck.</p>
      <p>3) Ä, Ö and Ü — with lowered accents in many mid-20th century Antiqua fonts.</p>
