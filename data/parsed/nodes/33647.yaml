      <p><em>Perhaps. But people could do those things already (as I did in Hypatia Sans), while I’m not sure there was a good solution to the cap eszett until it got encoded.</em></p>
      <p>True, but foundries will create strange glyphs that are characters in a Unicode group, as a basic font ingredient, before they will add other oddities that aren't Unicoded. The uppercase germandbls is, IMO, much stranger than lowered-umlaut caps and ck, ch and tz digraphs--these may be odd now, but they were much used not so long ago, so have a lot of period flavour. Of course, all that's necessary for ch and ck is for the typographer to kern them, but a discretionary ligature would be more convenient.</p>
      <p><em>Aren’t you the one who was bemoaning that oldstyle figures aren’t encoded separately in Unicode?</em></p>
