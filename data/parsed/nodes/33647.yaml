      <p>I start with the caution that I was not involved in the implementation of the German spelling reform and that I am not an expert in this matter. However, having been a tutor at the German spelling reform publishing house DUDEN for nearly a quarter of a century, I occassionally had discussions with the editors of the spelling reform rule books.</p>
      <p>I am under the impression that both Mr. Twardoch and Mr. Stötzner missed the crucial point concerning the s rules. The "long/short"-vowel rule as stated by Mr. Twardoch does not reflect the full rule, because the full rule distinguishes between surd (voiceless) and sonant (voiced) s sounds, i.e. the spelling depends on whether the s sound is surd or sonant.</p>
      <p>The IPA chart was quoted by me in another context on my website</p>
      <p><a href="http://www.sanskritweb.net/deutsch/ipa_sans.pdf" title="http://www.sanskritweb.net/deutsch/ipa_sans.pdf">http://www.sanskritweb.net/deutsch/ipa_sans.pdf</a></p>
      <p>On page 2 of this PDF, in the top chart "consonants", row "fricatives", the surd s sounds are to the left and the sonant s sounds are to the right.</p>
      <p>In the "alveolar" column, the surd s is "s" as IPA symbol, and the sonant s is "z" as IPA symbol.</p>
      <p>While some languages, e.g. Sanskrit, do not have sonant (voiced) s sounds, German (and also English) have both voiceless and voiced s sounds. Therefore, in such words as e.g. "Ruß" and "Nuß", we must examine two things:</p>
      <p>Firstly, is the preceding vowel sound short or long?<br>
      Secondly, is the following s sound sonant or surd?</p>
      <p>Mr. Twardoch considered the first question and omitted the second question. However the full rule states (I translate "DUDEN", 24th edition 2006, page 94):</p>
      <p>"For the voiceless s sound after long vowel or diphthong, the spelling is "ß", provided that the s sound in all inflectional forms remains voiceless and no other consonant follows."</p>
      <p>Since proper names (see e.g. English "Smith, Smyth") often disregard spelling rules, the matter is highly tricky, and I doubt whether the Unicode committee ever examined what sound (voiceless, voiced) is to be defined by the proposed "uppercase ß", considering that neither Mr. Twardoch nor Mr. Stötzner mention the tricky phonetical implications stated above.</p>
