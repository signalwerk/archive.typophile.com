      <p>Here's how I would do it, using for my examples Garamond Premiere Pro, Bodoni Bold BT and Futura Book BT:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/garamondprpro_4060.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bodoni_5341.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/futura_6288.jpg"></div><p></p>
      <p>My design decisions are based on the following thoughts:</p>
      <p>- I think the cap ß should take its cues from the lowercase ß as much as possible -- they should look like they are related stylistically, since they are part of the same typeface, and people are already familiar with the lowercase form.</p>
      <p>- I don't think the ligated (Tschichold) form can be translated to an uppercase form, as much as I like it in the lowercase form. It's too complex and relies on the space above the s, which caps don't have. This leaves the "B" form. </p>
      <p>- However, I tried to get a hint of the ligated form in the Garamond example.</p>
      <p>- In the lowercase it helps that the ß doesn't look like any other lowercase letters. But, as a capital, I don't think the "B"-ness of the ß can be avoided by introducing novel forms to its construction. My solution, to help distinguish the cap ß from the cap B, is to open up the interior space and make it a bit wider</p>
      <p>- The tail on the bottom right takes a form similar to the lowercase form, but in scale with the other capitals. The terminal on the cap J usually works.</p>
      <p>- I used a corner shape in the upper left because it makes it look more like a cap and to help distinguish it from the beta.</p>
      <p>- Some of the other proposed designs I think look too busy, novel or exotic, calling attention to themselves and failing to harmonize well with the other letters. I also think a lot of them work for some faces better than others. I hope to overcome this by sticking with elements of letters and forms that are already present in the typeface and keeping the general form simple and straightforward.</p>
    html_clean: |-
