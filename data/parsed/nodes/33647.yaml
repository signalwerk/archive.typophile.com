      <p>Not really, because the character should decompose to ß in plain text.</p>
      <p>A problem with "uni1E9E.sc" would occur if:</p>
      <p>1. The original plain text is U&amp;lc, with ß.<br>
      2. This is capitalized in a layout program with an "all caps" command.<br>
      3. Double-S (the capitalization of ß) is manually replaced by uni1E9E.<br>
      4. The text is changed to "All Small Caps", and output to pdf.</p>
      <p>Now, a search will not recognize words which are composed of lower case characters, with uni1E9E mixed in.</p>
      <p>At least, that's my present understanding of the protocol.</p>
    html_clean: |-
