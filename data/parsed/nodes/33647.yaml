      <p>Yes, looks much better. Have you tried the uppercase S's serif instead of the ball?<br>
      In this case, no romance for me. Mr Berlow's post is really great since it highlights a couple of flaws in the arguments pro an uppercase eszett.</p>
      <p>Mr Lozos, as I understand the <a href="http://www.unicode.org/versions/Unicode5.1.0/#Tailored_Casing_Operations" target="_blank" rel="nofollow">unicode.org information</a>, the uppercase eszett is there now but its existence does not change casing rules -- eszett becomes SS in all caps setting. Uppercase eszett is meant for 'special cases'.* Following this, it would be a mistake if features would switch from lowercase to uppercase or smallcap eszett.<br>
      The only thing you might do is<br>
      &nbsp;&nbsp;&nbsp;&nbsp;sub whatever_this_letters_postscript_name_is by germandbls;<br>
      in the c2sc feature.</p>
      <p>* The paragraph from the above-mentioned unicode.org link:<br>
      <cite>In particular, capital sharp s is intended for typographical representations of signage and uppercase titles, and other environments where users require the sharp s to be preserved in uppercase.</cite> Overall, such usage is rare. In contrast, standard German orthography uses the string "SS" as uppercase mapping for small sharp s. Thus, with the default Unicode casing operations, capital sharp s will lowercase to small sharp s, but not the reverse: small sharp s uppercases to "SS". <cite>In those instances where the reverse casing operation is needed,</cite> a tailored operation would be required.<br>
      [non-italics are mine]</p>
