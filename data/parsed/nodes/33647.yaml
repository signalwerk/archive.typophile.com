      <p>Andreas, </p>
      <p>well, I think this body (permament council for geographical names, Ständiger Ausschuss für geographische Namen (StAGN), at the Federal Agency for Cartography and Geodesy) is concerned with uniquely identifable names, so there are no ambiguities. For example, the name of the town I used to live in is officially "Frankfurt (Oder)". In the past, there were various spellings ("Frankfurt (Oder)", "Frankfurt/Oder", "Frankfurt-an-der-Oder", "Frankfurt a.d. Oder" etc.), but it seems that the Germans like to have everything normalized, so, well, they also decided to normalize the geographical names. </p>
      <p>Which I think makes sense. After all, these days geographical names need to be stored in databases, processed digitally etc., so it's useful to have *one official* spelling of a geographical name. </p>
      <p>A.</p>
