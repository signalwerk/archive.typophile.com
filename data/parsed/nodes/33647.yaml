      <p></p><div class="imageWrap"><img src="http://typophile.com/files/490547406_474a61e6b0_5721_4563.jpg"></div><br>
      <em>in which the “long s” part connects to the BOTTOM and not to the top of the following “short s”. </em><p></p>
      <p>I surmise that the "following" short s was (conceptually) written first in the sample you show, That is the reason it connects where it does; -- the writer just had to be sure to leave a long enough width in the entry stroke to accomodate the subsequent long s crossing it.</p>
      <p>By conceptually I mean that the sequence e_s_s was designed as one continuous stroke, at the rough stage, experimenting with a pencil perhaps, and then constructed with shorter pen/graver strokes that were less likely to create difficulties by "pushing" into the medium.</p>
      <p>So I'd say that in formal calligraphy, where design and execution can be separate processes, the left-handed (with suitably adapted nibs) face barely more challenge than the right handed. Once-off handwriting is a different matter.</p>
      <p>Is that a reasonable assessment, David?</p>
    html_clean: |-
