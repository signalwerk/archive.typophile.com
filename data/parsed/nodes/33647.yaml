      <p>&gt; Yes but if I want my C and c to look similar,<br>
      &gt; and my S and s, and my O and o, etc<br>
      &gt; why would I want my U/c ß to be different<br>
      &gt; in design derivation from its lower case counterpart? </p>
      <p>The handwriting practice for ß by contemporary writers allows both "IS" and "I3" structures. The S shape is more flowy, cursive, written in nature than the 3 shape, which is more constructed, drawn. The uppercase-vs-lowercase contrast is exactly about that: drawn vs. written. Pretty much all of Latin uppercase has very simple, basic forms stitched together, which are easy to construct and draw. "S" is the by far most complex form within the basic scheme. </p>
      <p>Combining a complex "long s" skeleton with an equally complex "S" skeleton is an overkill for a letter. It starts looking like a horribly complex character such as "&amp;", which practically no-one can write properly. </p>
      <p>I assert that letters must be simple. Uppercase letters must be simpler in skeleton than lowercase, because that is their very nature. Also, uppercase forms should be solid, strong, monumental in character. </p>
      <p>I believe that the "monumental skeleton" of uppercase ß I propose: </p>
      <p><a href="http://typophile.com/files/germandbls_garamond2_5760.png" title="http://typophile.com/files/germandbls_garamond2_5760.png">http://typophile.com/files/germandbls_garamond2_5760.png</a></p>
      <p>fulfils the criteria better than the "Dresdner skeleton" that Andreas Seidel and Andreas Stötzner prefer: </p>
      <p><a href="http://typophile.com/files/sz_birth_6221.gif" title="http://typophile.com/files/sz_birth_6221.gif">http://typophile.com/files/sz_birth_6221.gif</a></p>
      <p>The Dresdner form lacks something sturdy, defined, at their top-left. It simply looks like it is half-way between uppercase and lowercase.  </p>
      <p>&gt; Is visual dissimilation (between upper and<br>
      &gt; lower cases at least) necessary in a font? </p>
      <p>Of course, within a reasonable range. </p>
      <p>A.</p>
      <p>Ps. Edit: I meant "Dresdner form", not "Leipziger form", i.e. I meant the form that Andreas Stötzner included in his DIN/ISO/Unicode proposal (first link in my first posting).</p>
