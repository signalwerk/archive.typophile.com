    html: |-
      <p>Mark, </p>
      <p>it is not like uppercase forms for fi or fl. The lack of "uppercase ß" means that it is uppercased to "SS", but "ss" is also uppercased to "SS". So "SS" is an ambiguous representation of two different lowercase combinations. This is particularly important in personal names: "Peter Weiß" and "Peter Weiss" are two distinct names and one may not be substituted by the other. But in uppercase, it's only "PETER WEISS" which is ambiguous because it does not exactly tell you what name it actually stands for. </p>
      <p>It is a bit like the French practice of removing accents over vowels when uppercasing. This practice was introduced when typewriters came into use simply because typewriters did not have separate uppercase accented letters. These days, it's a bad ambiguous anachronic practice which is no longer necessary but still practiced by many French people who are used to the typewriter customs and actually think you HAVE TO remove the accents when uppercasing. </p>
      <p>This also reminds me of another practice, i.e. replacing long dashes by single or (perhaps) double hyphens. </p>
      <p>As I have explained, the method of uppercasing "ß" as "SS" is in my eyes an anachronism. It is still the majority practice according to official German spelling rules, but I think this is largely a technological limitation. If well-designed uppercase ß exists in fonts, and there is a Unicode codepoint for it, *and* (at some point) it is mapped to the German keyboard layout in Windows and Mac OS X, some people will *happily* start using it. </p>
      <p>"Popular use" of "ß" in the middle of all-uppercase text suggests that there is an authentic need for that character. I believe we're still years ahead of widespread adoption, but I think type designers should do their best now to come up with appropriate forms, or at least once the character has been officially encoded. </p>
      <p>Besides, isn't it fun to invent a new letter? </p>
      <p>Adam</p>
