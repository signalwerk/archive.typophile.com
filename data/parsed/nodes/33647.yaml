      <p>Adam, I echo Hrant's comment on quality of discussion. I found your writing lucid and really interesting. Thanks for the time you have taken on this. </p>
      <p><em>These days, the lowercase “ß” is typically derived from the ligated form of “ſs”. For visual dissimilation purposes — to strongly set apart the lowercase and the (new) uppercase “ß” I would derive the uppercase “ß” from a ligation of the hypothetical uppercase “ſ” (i.e. “Γ”) and the shape of “the other” origin of “ß”, i.e. of the historical “Z” shape.</em></p>
      <p>In short, I believe that the best graphical rendition of an uppercase “ß” would be be a well-designed ligature that incorporates these shapes: “ΓƷ”</p>
      <p>Yes but if I want my C and c to look similar, and my S and s, and my O and o, etc why would I want my U/c ß to be different in design derivation from its lower case counterpart? i.e. if you're going to use s for derivation of ß then shouldn't you be using S for derivation of u/c ß? Is visual dissimilation (between upper and lower cases at least) necessary in a font? (It probably depends what the font's going to be used for which is a whole different discussion.)</p>
      <p>Andreas: your pdf is excellent. It appeals to me that there are people that are willing to do lots of very hard work and then generously share the results with all for free.</p>
      <p>My personal view is that the Γ approach makes it look like an uppercase character (whatever that looks like - it's very subjective) more so than the long s/inverted U approach. That is not to say that I'll use the Γ approach if it doesn't suit the rest of the font. The u/c ß is certainly not going to be a fundamental character which shapes the rest of the font. </p>
      <p>But nobody's seriously going to tell me <em>which actual design</em> to use in my own font? Are they?</p>
      <p>You've surely got to do what suits the font best and, as with all fonts, there are going to be some u/c ß's which are totally different from others because there are fonts which themselves are totally different. This reflects the diversity of man and the wisdom of his Creator.</p>
      <p>I don't pretend to know anything about the history of type, derivation of characters especially German ones, German pronunciation and the like. Nevertheless, a bigger principle is at stake:</p>
      <p>Individual 'interpretation' of character forms is surely one of the things that makes a font great. That's probably why some of us were so hacked off by being told what the euro symbol should look like - in every font! The thought that a designer must, in any measure, <em>comply</em> is abhorrent to me. </p>
      <p>Provided my font can be 'read' (whatever that word means - one person reads very differently from the next), then it can look like anything I please, can't it? </p>
      <p>I guess the real art is designing a font that can be read well by as many different types of reader. And unfortunately, when it comes to the real art is designing a font, I'm well out of my depth.</p>
