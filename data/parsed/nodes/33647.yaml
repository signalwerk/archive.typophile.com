      <p>Tim, </p>
      <p>handsome work. I like the one that you used in the top row (the one incorporated into the word "großes"). But my favorite is number 2 in the bottom row (the one with the edge on the top): thanks to the edgy roof, there is no way to mistake it for a "B". Also, it's easier and more natural to draw by hand (one-two-three straight strokes plus an S shape). The forms with the half-rounded top are somewhat unnatural and clunky to draw by hand -- the top part requires an "unfinished", "interrupted" hand movement. Also, the form (number 2 in the bottom row) has an unmistakengly "capital" flavor. </p>
      <p>A.</p>
