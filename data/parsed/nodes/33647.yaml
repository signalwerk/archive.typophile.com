      <p>Uli, </p>
      <p>Unicode does not need to deal with phonetics. The uppercase ß character is for people who wish to unmistakengly represent the lowercase ß in an uppercase context. There are defined rules for the use of lowercase ß, and there is no need to explain them in the Unicode standard or anywhere near that context. </p>
      <p>The phonetic rules I described in my original posting are, of course, simplified. I did not deal with "s" that is pronounced like the English "z" (sonor). In fact, I did not mention single "s" at all, because in German, the rules of its use are actually fairly complex. What I wrote about is the difference between "ß" and "ss", which both stand for a voiceless "s" sound. </p>
      <p>A.</p>
