      <p>» the history of “ß” is somewhat surprising. The letter developed in a two-wise way: as a ligation of long s and round (“normal”) s, and as a ligation of long s and z.« (A.Tw.)</p>
      <p>NO! No, no, no.<br>
      We need to distinguish the ORIGIN OF THE CHARACTER from the LETTERSHAPES.<br>
      This has been mixed up by everybody for far too long.</p>
      <p>The origin of the ß *as a character* is: a long s with *some* curl or swash or stroke attached, in order to mark it being not an 'ordinary [long] s'. That attachment became randomly written like the ezh- (or 3-) shape by time (the same we find with other Latin letters for abbr., e.g. q).<br>
      Therefor the letter became named “eszett”, the common mind thus just describing what he sees, regardless of the fact that the letter (the character) was NOT derived from long-s and z functionally or phonetically or in the sense of a typographic ligature. Note that up today “Eszett” is also named “Dreierles-Es” or “Scharfes Es” which indicates the very idea of ß as a character of its own.<br>
      The earliest sample of a “ß” in an upright roman-style printed German text (1667) is definitely no long-s_s nor a longs_z (ezh-shape). It’s something else.</p>
      <p>The “ß is a s_s-ligature” theory was induced by the italic long-s_s ligature later becoming (ab-)used to represent the German ß. Today the glyphs we use in Roman and Italic for ß are actually two different letters (or glyphs) by origin.</p>
      <p>A tricky history, admittedly.</p>
      <p>But thanks Adam, for your elaborate explanations. Sorting out what the capital ß might look like this should be the level to work on it.</p>
      <p>By the way, you’ll find it notable that we (searching for Signa 9) actually testified two medieval examples for the capital long S, one of them Gamma-shaped.</p>
