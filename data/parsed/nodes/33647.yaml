    html: |-
      <p>For more information on the phonetic importance of the letter ß also check out Adam’s post here:<br>
      <a href="http://typophile.com/node/82806#comment-467600" title="http://typophile.com/node/82806#comment-467600">http://typophile.com/node/82806#comment-467600</a></p>
      <p><cite>3) Ä, Ö and Ü — with lowered accents in many mid-20th century Antiqua fonts.</cite></p>
      <p>By the way: The German umlauts had the same development from a lowercase only connection to a full letter of the alphabet. (ß is just a little bit behind, because in blackletter there was no need for it, because blackletter wasn't set in uppercase.)</p>
      <p>Here is a book from 1774. The e had moved on top of a, o, and u:<br>
      <img src="http://www.typografie.info/temp/umlaute2.jpg"><br>
      But there was no uppercase version yet: (Ueberlegenheit instead of Überlegenheit)<br>
      <img src="http://www.typografie.info/temp/umlaute1.jpg"></p>
      <p>This stayed this way for some time, but the uppercase umlauts still emerged, because like Adam said: it’s the only logical thing to do. Now we are at the same point regarding the ß. It just took a little longer.</p>
