      <p><cite>Yet, i don’t think that names are the foremost concern.</cite></p>
      <p>Oh, no, they are! I come from a town called <strong>Pößneck</strong> and we have a battle for decades how it should be pronounced and how it should be written in uppercase texts. It literally splits a whole town.</p>
      <p><cite>Of course it does. Herr ROSSBERG (i.e. Rossberg) is pronounced “rosberg” ... while Herr ROßBERG (i.e. Roßberg) is pronounced “ro:sberg” </cite></p>
      <p>No, the reform of 1996 doesn't apply to names. On my businesscard is says »Roßbach and Herrmann GbR« and it is still (and will always be) pronounced »Rossbach«. </p>
      <p><strong>In our business</strong> the correct spelling of names is the biggest concern in the capital sharp s debate. Just think of all the bibliographies in books. We usually like to set names in small caps, but names have to keep their Eszett, because <strong>Weiß</strong> and <strong>Weiss</strong> are different names. </p>
      <p><strong>For the public</strong> this is a solution for a problem that most of the people aren't even aware of. Again: Herr Roßbach from Pößneck will always write ROßBACH and PÖßNECK to keep the proper names. So now we offer him a way to do it with letters that are typographically correct. </p>
      <p>About the shape:<br>
      I don't think we should define the one and only way of designing the capital sharp s. There are different solutions and over time one will eventually prevail.</p>
