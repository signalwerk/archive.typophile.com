      <p>Note that the Unicode example gylphs are just informative, gylphs in fonts actually might look considerably different.</p>
      <p>1½–2 years ago I posted in a german type forum a shape I personally liked (and for fonts where the Uppercas J has a descender, it's the one I'd ever use in my types; personal preference though):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/typologieundreflexe4sf_3744.gif"></div><p></p>
      <p>I dislike the left part's "turned U" shape in most other versions and prefer the ſ~f&nbsp;—&nbsp;Γ~F analogy. Clearly preferring the З form of Z (mostly used in Fraktur, but sometimes found in Antiqua as well).</p>
      <p>Of the four blue forms I prefer the third.</p>
      <p>I'm just trying to give inspiration, of course, (this is clearly only one option of many), and am hoping that you find it useful or interesting at least. The nicety of type design is, that you can find so many different solutions for a given problem.</p>
