      <p><cite>Only after it feels fully German.</cite></p>
      <p>In the sense that a 'new' glyph should be 'on the team' and not stand out particularly much when used. Then yes. Entirely. In the sense that it should extend naturally from the historical German culture of letters. Again yes.</p>
      <p>In the sense that it's 'Germaness' as an essence needs somehow to measured - then no.  </p>
      <p>Actually, I had been wondering if anybody would confuse my statement as being anti-blackletter. It wasn't. (There is a false but long held historical/cultural dichotomy of Roman/Latin vs. Blackletter/Fraktur) But actually what I meant by Latin was this visual/cultural continuity and the reality of intercultural pentration via loan words etc.</p>
      <p>And in fact one great way to give consideration to a form might be to try to write it out in the various blackletter styles: Textura, Bastarda, Schwabacher, Fraktur, Burgundica, etc, to see what happens. BTW, I am also not suggesting that direct continuity of form from the Sans serif to the Blackletter would be desirable either. Looking at Fette Fraktur's C,L, and S certainly suggest the opposite might be true.</p>
      <p>When I think about this letter it seems like the top 3 purposes would be : </p>
      <p>- Monuments in a Trajanesque mould,<br>
      - Signs in a Sans Serif style,<br>
      - and things like Pickle Jars ( packaging ) </p>
      <p>... Admittedly tattoos and the back windows of pickup trucks might be candidates as well but I am less worried about those applications.</p>
