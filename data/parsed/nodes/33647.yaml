      <p>Actually, I had been wondering if anybody would confuse my statement as being anti-blackletter. It wasn't. (There is a false but long held historical/cultural dichotomy of Roman/Latin vs. Blackletter/Fraktur) But actually what I meant by Latin was this visual/cultural continuity and the reality of intercultural pentration via loan words etc.</p>
