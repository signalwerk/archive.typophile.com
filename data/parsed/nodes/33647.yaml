      <p>Since the character ſ is an alternate form of the lowercaſe S, one could claim that it has no business in an uppercase character at all. And so perhaps the uppercase ß (for use by people who wish to use this character, which traditionally has no uppercase form, and so words that contained ß and which could alternately be spelled with ss, for which ß is, as pointed out, a ſs ligature - and, therefore, in printing, the word Große becomes GROSSE when in all caps, and current Unicode mappings reproduce this - although since no Unicode code point was previously defined for "uppercase ß", this means information is lost, which can cause problems when changing back to lowercase, it's not as if an uppercase ß codepoint just prints as two S glyphs) ought to be derived from SS - just print the two uppercase S's close together and overlapping.</p>
      <p>As long as they're normal curved S shapes from the font in question, and not in any way... runic... a certain disturbing comparison ought not to arise as an issue.</p>
