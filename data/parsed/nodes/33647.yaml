      <p>Thank you Adam for this very elaborate and profound thesis of ways to find a design for a new UC Germandbls. This is the best thread i have read on this topic so far. There are very hot discussions in Germany about wether or not it makes sense to include this character.</p>
      <p>As nice as it would be to *invent* a new character (i am convinced of your examples of the Gamma-S ligature), i find the S-cedilla followed by S solution very plausible.</p>
      <p>My concern is: if the knowledge of the inclusion of an UC Germandbls into Unicode is spread everywhere i fear that some commission will determine what that character has to look like. The S-cedilla proposal is very easy and fast to determine as standard (and it would follow the convention to capitalize *ß* by *SS*). Also there would be no need to update fonts. This could be taken up into the orthography (and the Duden) immediately.</p>
      <p>That’s my pragmatic view. A new character might come up in a disaster as it happened with the Euro (if some commission sets up the design guides) or it will take a very long time until there is a form for the new character that will be widely accepted. I absolutely agree that a new character has to follow the forms and origins of the Roman alphabet (which are the preceding Greek letters).<br>
      It also could all end up in a design competition (hope not!)</p>
      <p>Thank you Andreas for an update of this character’s tricky history.</p>
