      <p><em>I read nothing but Bs even if I try to see a cap Eszett.</em></p>
      <p>I was afraid you'd say that. :-)</p>
      <p>Depending on the font (Georgia's not bad, because of the old style figures), many of these are hard to distinguish without context: Il1, O0o, rnm, 5S, 2Zz. In some cases, the only differences are a little hook or serif or corner instead of a curve or a slight gap or difference in height or width.</p>
      <p>Context helps a lot. Even the current ß, if used in place of a B, reads as a B.</p>
      <p>It's problematic to introduce a new form to the alphabet. Reading depends on familiarity of forms. If a novel form is introduced, it's natural to try to interpret it as a letter we already know. (A lot of logos use this to great effect.) In cases where there are two words, such as große and grobe, it may take more time to get used to, but I suspect that this is an edge case and unusual, and that most words that contain ß do not have such an evil twin and would be interpreted correctly due to context, given time to become familiar with the new form (even mine).</p>
      <p>In any case, as someone who doesn't read German natively, I do feel at a disadvantage with this problem. I'm just trying to apply what I know to the problem and making some observations. Part of my motivation for speaking up is selfish: Some of the proposed designs look very awkward to me and I would hate to have to be the one to adapt them into existing faces.</p>
