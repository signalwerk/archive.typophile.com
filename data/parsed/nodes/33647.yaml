      <p>As a summary:</p>
      <p>(1)&nbsp;&nbsp;There is a new Unicode codepoint for uppercase eszett.<br>
      (2)&nbsp;&nbsp;There are orthographic rules for case mapping. And it is not the Uncode Consortium's business to change these. This means, the eszett-to-SS case mapping is left untouched, as pointed out explicitly in the UC's information. What is allowed is mapping uppercase-eszett to lowercase-eszett.<br>
      (3)&nbsp;&nbsp;<em>If anyone plans to add this letter to fonts,</em> the only questions left are:<br>
      What does it look like? Up to the designer.<br>
      How to name it? Maybe 'uni1E9E'.<br>
      How to deal with it in features? Add "sub uni1E9E by germandbls.sc;"* in 'c2sc' to address the uppercase-to-lowercase mapping mentioned in (2). No coverage in other features though, following current best practice to not substitute encoded glyphs with encoded glyphs.</p>
      <p>This doesn't have much to do with opinion but with currently valid orthography and best practices as regards font production.</p>
      <p>So my question is, what is the point you are trying to make? Of course you can spell and case as you like, but the result would be your "private Sprache", nothing that should concern anyone else.</p>
      <p>Sorry for repeating things already said in previous posts.</p>
      <p>* Or whatever your smallcaps suffix is. If you use two sets of smallcaps (one mapping from lowercase, the other from uppercase) then it would be something like "sub uni1E9E by uni1E9E.c2sc;".</p>
