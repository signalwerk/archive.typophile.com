  html: <p> This is my second typeface attempt and my first attempt at a text face. I began it while at grad school and have been working on it in my spare time. The caps have not been touched since grad school, I have been concentrating on the Lc. I have tried to follow a lot of the critiques here online, but I could use an external opinion. Thanks for any help you can give me. </p>
