    votes: null
    html: <p>David, <br> <br>it's getting better, we all can see. <br> <br>BUT <br> <br>there are still great resemblances between your face and others. I think that the comparison between scala sans and Quotidian (what does that word actually means?) is not quite right. I think you should check out the 'syntax' and the 'foundry sans' at <a href="http://www.thefoundrystudio.co.uk/" target="_top">http://www.thefoundrystudio.co.uk/</a> <br>The capitals looks very much like the Gill Sans, by the way. (Except the Q) <br> <br>I personally think there's not so much sense in designing typefaces, which have been done before. But it's a very good study. <br> <br>Try to make the face more typical. Original accent's etc. otherwise no one will notice the novelty of it. <br> <br>succes</p>
  - id: 619
    user_id: 912
    user_name: David Cabianca
    user_path: null
    user_image: null
    date_raw: 29 Jul 2002 — 7:20am
    date: 2002-07-29T07:20:00
    votes: null
    html: '<p> Matthijs, <br> <br>Thank you for the input. I really appreciate your opinions. Type design and graphic design is basically a self-taught thing for me. I did go to graphic design school, but it is one that did not have classes (Cranbrook). In that respect, I have learned a lot, like I had to reduce the cap height otherwise Uc color was too pale. Something I never noticed about other faces until now... <br> <br>I have been using this typeface as an exercise in trying to "see" the structure of type better. I am not even considering using it on personal projects: You are right, it looks like a lot of other faces that are better designed anyways. <br> <br>BTW, Quotidian means "ordinary," "everyday". <br> <br>Thank you again for your patience. </p>'
  - id: 620
    user_id: 1250
    user_name: hrant
    user_path: null
    user_image: /files/pictures/picture-1250.gif
    date_raw: 29 Jul 2002 — 7:46am
    date: 2002-07-29T07:46:00
    votes: null
    html: "<p> TANGENT (sorry David): <br> <br>&gt; I personally think there's not so much sense in designing typefaces <br> <br>As far as I'm concerned, we're just warming up. <br> <br>The real thing (a craft free of calligraphy, and to a lesser extent lettering - one that can best serve the *reader*) is still in the cocoon. BTW, the reason most type designers -including some of the best- seem to be stuck in a rut these days (I mean from an ideological perspective) is because they're afraid to jump into the analytical aspect of written communication. As a result, we generally see three types of (misguided) directions: stale revivals; artistic ego-trips, often disguised as \"experiments\"; or the current menace: the VERNACULAR! :-/  A rare example of somebody doing it right? Gerard Unger. <br> <br>Look deeper, not sideways. <br> <br>hhp </p>"
  - id: 621
    user_id: 605
    user_name: matthijs
    user_path: null
    user_image: null
    date_raw: 29 Jul 2002 — 11:19am
    date: 2002-07-29T11:19:00
    votes: null
    html: <p> david, <br> <br>the great thing of this site, is that there's room for discussion and a free meaning. <br>I didn't react to criticise your project in a bad way, but to give you food for thought. <br> <br>I think that everybody should do what he think is best. We can all give critique and response but in the end it's your own work and you make your own decisions. <br> <br>I think it's a great exercise to design a typeface like you did. Don't feel bad, see it as a good lesson in class. <br> <br>greetings <br> <br>Beside this i'd like to respond on Hrant's reaction. <br> <br>What I meant with 'I personally think there's not so much sense in designing typefaces, which have been done before.' is the fact that we're not living in the days that stanley morison wrote his 'first principles' and said that "The good type-designer therefore realizes that, for a new fount to be succesful, it has to be so good that only very few recognize its novelty." Type-design is in my eyes not meant to be bearly noticed.  <br> <br>I'm sorry, but I disagree the fact that Gerard Unger is someone who's doing it right in the field of 'the vernacular'. Gerard Unger IS a classicist. &amp; I disagree the fact that most type designers -including some of the best- seem to be stuck in a rut these days. There are a lot of great things going on. <br> <br>Of course typedesign is for a part rooted in a long and cultural-rich history, but for a great part, I'm personaly convinced that type &amp; typography is more part of the present society. Type should be a representation of the age in where it is used. There are no beter or worse times of typography. The present is inspiration for typography. This time is full with inspiration. And...  ...maybe the 'well-known' designers are stuck, but below that layer of celebrities there is a lot of good work being done. <br> <br>Maybe, it's nice to start a discussion about the present typography, where we're heading at, and what typography should be about anno 2002. (Should it be purely functional, or should we try giving it a more social function?) <br> <br>Matthijs <br> <br>(By the way, Hrant; how can you combine anarchie &amp; the monarchie in one person?) </p>
  - id: 622
    user_id: 1250
    user_name: hrant
    user_path: null
    user_image: /files/pictures/picture-1250.gif
    date_raw: 29 Jul 2002 — 2:38pm
    date: 2002-07-29T14:38:00
    votes: null
    html: "<p> Matthijs, I misunderstood you - I guess we agree that imitation sucks? <br> <br>But: <br>&gt; I disagree the fact that Gerard Unger is someone who's doing it right in the field of 'the vernacular'.  <br> <br>OK, here *you* misunderstood *me*! :-)  I was giving Unger as an example of a designer *not* following any of those three (misguided) directions. <br> <br>&gt; Type should be a representation of the age in where it is used. <br> <br>Agreed 100%. But it can/should also push boundaries, no? <br> <br>&gt; There are no beter or worse times of typography.  <br> <br>Well, that type of relativism does contain truth. <br> <br>But it's not crazy to complain, for example, that -in contrast to about a hundred years ago- contemporary type designers don't pay enough attention to readability. They like to think of type design as an \"Art\" (since that's what society values more these days, sadly), and this obstructs analytical design. We have people saying \"anything can be a text face if you read it enough\" - these people should be openly ridiculed by anybody who seriously considers human physiological realities. A [text] font is not a painting - it's not [primarily] a vehicle for self-expression. Art is selfish - Craft is populist. <br> <br>---- <br> <br>Anarchy is the utopia (since society = injustice), but it cannot be achieved. It's nice to keep it in mind (especially as a means to completely destroy existing corrupt systems - which cannot be reformed), but eventually we need something that works. Strangely enough, in the end Monarchy is the least unfair achievable system (and I like reminding people that it worked fine for thousands of years). Communism is the second least unfair system that can be achieved. Democracy (which may have started out with good intentions) is in effect a tool for usurpers, the most effective and poisonous weapon of Capitalism - and the fact that it *seems* fair to the average peon is its darkest feature. BTW, if voting could change anything, it would be illegal. The shocking nefariousness of Democracy is becoming clearer each passing day - *if* you're brave enough to open your eyes and reconsider what your schools have told you, brave enough to doubt the true intentions of your leaders. Bottom line: the people are not qualified to decide matters of state, so they must relinquish governement of their nation to a benign philosopher king/queen. Hard to find one? Sure, but much easier than finding 10 benign capitalists. <br> <br>I've said my part, and I should stop here. If anybody wants to reply, I can't stop you, but I would only consider replying in turn if you bring to the table something I have yet to consider. If I don't reply it's probably because your argument has been considered, it holds no water, and I can shoot it down in five words or less.   :-) <br> <br>hhp </p>"
