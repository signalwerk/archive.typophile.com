    html: "<p> I think that the discussion about Scala sans comes from the fact that I am after the same intention: to work towards a sans face that is humanist, but I did not look at scala sans for inspiration. I have tried to stay away from it, but apparently not enough. I have been looking at a lot of serif typefaces and I guess that's why scala sans comes up. <br> <br>Thanks so far for the input. And yes, that is my real email address. </p>"
