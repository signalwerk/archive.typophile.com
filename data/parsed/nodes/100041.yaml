      <p>Corina Neuenschwander and Simone Koller designed this – including poster, invite etc. for an exhibition at Helmhaus Zurich, on show in spring 2013. The font is indeed Laurenz Brunner's version of Mercator.<br>
      There's also this book, worth checking out, although in german only. <a class="freelinking external" href="http://www.scheidegger-spiess.ch/index.php?page=books&amp;view=co&amp;booktype=order_1_releasedate&amp;subject=1&amp;artist=all&amp;author=all&amp;pd=ss&amp;book=475&amp;lang=de" rel="nofollow">http://www.scheidegger-spiess.ch/index.php?page=books&amp;view=co&amp;booktype=order_1_releasedate&amp;subject=1&amp;artist=all&amp;author=all&amp;pd=ss&amp;book=475&amp;lang=de</a></p>
