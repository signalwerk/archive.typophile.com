      <p>Can't fin anything closer than Atlas Grotesk you've already found. This /t can't lie to me. But you're right, numerals (/2 is even closer to Helvetica actually). Depending on time period of your sample, could be the original Mercator that Atlas Grotesk is based on: <a href="http://typophile.com/node/53257">http://typophile.com/node/53257</a><br>
      This /a reminds me of <a href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Akkurat/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Akkurat</a>.<br>
      Quoted from Atlas Grotesk description text</p>
      <blockquote><p>The aesthetic of Atlas was inspired in large part by the sans serifs of the 1950s, specifically Dick Dooijes’s Mercator, released by the Amsterdam Type Foundry in 1957.</p></blockquote>
