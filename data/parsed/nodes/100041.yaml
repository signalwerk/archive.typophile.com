    <p>I found this Grotesque and thought it must be Atlas from Commercial Type <a href="http://commercialtype.com/typefaces/atlas/grotesk/regular">http://commercialtype.com/typefaces/atlas/grotesk/regular</a><br>
    But the numerals are not. – Any ideas?<br>
    Thanks a lot.</p>
