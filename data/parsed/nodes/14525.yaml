      <p>&gt; Modes: what various modes are there - production and learning</p>
      <p>I guess I would start by just making it simple. I will describe a deluxe version &amp; you should maybe toss out 50% or more of it to create a basic engine. Let me see if I can describe what I think should happen... You get a word: ( random, but the best would be a list which uses the most common words more! ) and you have a case of letters ( in reverse display ) to build the word with. The word should maybe be big-ish. The letter not small but smaller, and small because you need to show all 26X2 + maybe numbers &amp; punctuation.</p>
      <p>So maybe you start with lower case &amp; then go to upper &amp; lower &amp; then numbers &amp; then punctuation too.</p>
      <p>&gt; Interface: what features on the interface - what navigation/means of control</p>
      <p>I think it should be mouse driven in terms of play. And you need ( timer? ) restart, score, high score ( world high score? ) , and quit buttons. The score &amp; the rest of the info on otrher screens might be displayed backwards too.  the game might say 'eybdoog' when you quit for instance... ( with letters reversed of course ).</p>
      <p>&gt;Graphics: roughly what size do the lettrers need to be?</p>
      <p>I think the target word should perhaps be 7-9 characters max and could take up 1/5th of the screen &amp; the letters &amp; other interface UI would take up the rest. The letters etc will size themselves based on what is left I would guess...</p>
      <p>&gt;Layout: what particular layout considerations are there - is the image provided indicitive?</p>
      <p>Not a question for me.</p>
      <p>Take all this with a grain of salt.</p>
