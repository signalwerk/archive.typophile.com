    <p>Thanks for visiting the Typographic Edumacators topic area.</p>
    <p>Following through on simple exercises that might be useful in teaching typography to graphic design students:</p>
    <p>I've been thinking about some of the routine activities some of us old typographers did that helped sharpen our "typographic eye."<br>
    Setting lines of metal type and then putting each character back into the typecase.</p>
    <p>Sounds like the most mundane of activities, but we set lines of copy that was visually upside down and backwards.<br>
    In other words, mind your 'p' and 'q' and 'b' and 'd'.  Eventually reading metal type became easier. At one point I could amaze friends by reading pages aloud quickly from a book held upside down... I have a hard time doing that nowadys.</p>
    <p>Maybe there was something useful in training the mind to quickly differentiate characters regardless of orientation. </p>
    <p>I think I know enough about Flash that I could put together a rough prototype.<br>
    Here is a rough sketch of <a href="http://www.acmedigital.net/Aimages/upside.gif" target="new" rel="nofollow"><strong>Upside Down &amp; Backwards</strong></a>.</p>
    <ul>
    The basic premise is that a word or phrase (typewritter styled letters) would show up in the white window below the "metal" characters.
    <li>All the student has to do is "set" the words by clicking the mouse on each successive character until they complete the line.</li>
    <li>There is no time limit during training, but the game starts with a timer ticking away. Hey... it's a production shop!</li>
    <li>Difficulty variables could be changing the typeface or reducing the point size.
    </li></ul>
    <p>Maybe, even if the excercise had no real value in improving design skills, it might be fun from an historic point of view.</p>
