      <p>True, Eben,I think a ran a little too quickly with concepts (it's fun though).</p>
      <p>Let's go back to the original intent of this topic. The ultimate goal of the project is to help stimulate interest in typography and type design, and to help develop initial skills and sensitivity in those who are interested. The target group is students in general graphic design programs and novices who seek improvement.</p>
      <p>The premise of "Upside down &amp; backwards" is based on simple observations of routine activities done by typesetters/typographers, and the theory is that composing lines of metal type helped to sharpen character recognition. All theory and no evidence that it's a valid premise.</p>
      <p>So, with that as the basis, developing a prototype is more important than visual embellishments at this time. I do agree that outlines would move it along faster.</p>
      <p>As we are convinced that the whole idea is worth developing, then features such as changing "fonts" or even photographic images of type can be debated. I would just be happy to see a skeletal concept piece working.</p>
