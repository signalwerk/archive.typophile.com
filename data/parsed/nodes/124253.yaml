      <p>Handwriting, glad you mentioned it. Cyrillic cursive and italic forms have a number of interesting peculiarities, and among them is that "п" becomes "n". So I meant to flip your "u" as it is, and the resulting "n" with the stem preserved may be the clearest possible solution. What you had was really an "л" with a swash, which is not unheard of. You may get a number of other useful ideas by studying Cyrillic handwriting, and also a thing called vyaz, which is a historic kind of decorative space-filling blackletter.</p>
      <p>As for the Greek "π", it is decipherable, but consider squaring off the top, and perhaps even mirroring it entirely.</p>
