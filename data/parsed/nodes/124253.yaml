      <p>Hi! Thank you for your time and your helpful advice. I utilized most of it as seen here:<img src="/sites/default/files/old-images/Bez&nbsp;tytułu_5470.png"><br>
      I was actually thinking at times about the barred I, but I didn't get to it before. I know this one is a little creepy, but it's the only way I could think of.<br>
      I'm a little unsure about the 'lowercase' omega and lambda. I like them on their own (esp. the omega) but since I don't know Greek I have no idea how they would work among other 'not-so-lowercasey' characters. I can only hope they'd do just like their Latin equivalents. One thing that could be done is further case diversification.<br>
      I'm rather reluctant about the П though. Do you find the Greek pi unrecognizable as well? Whenever a glyph needed an extra stroke to fill in the whites, I seeked inspiration in handwriting, despite the somewhat technical/industrial appearance of the face. I thought it worked well for these two. I'm aware I might be alone in this belief, but wouldn't basing the П on an inverted U make it too easily confused with the capital lambda?</p>
