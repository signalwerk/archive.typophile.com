      <p>Pretty neat. Surprisingly legible.</p>
      <p>There may be some call for the option of a "barred I" for uses that want total monospacing, or for the isolated word "I".</p>
      <p>The stroke weight across the bottom of the ampersand is unusually shallow.</p>
      <p>I might suggest differentiating the zero as a closed loop with an isolated stroke in the middle. And close the loops in the percent too, because really, what are you even hoping to do there.</p>
      <p>Cyrillic П is not likely to be recognized at all. You're better off inverting a U for that.</p>
      <p>Greek is begging for a lowercase omega. Also consider the advantages of a lowercase lambda.</p>
