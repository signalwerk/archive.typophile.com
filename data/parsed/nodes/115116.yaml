    html: |-
      <p>Hi Ryuk, Gravostyle is an interesting choice but to my eye, the _A_ is a little too narrow, the _d_ looks a little too boxy and the tail on the l and t seem a trifle short. Optimo's design note: "Gravostyle is designed after the basic cut of the generic Swiss engraving font system." None of the engraving machine fonts for which I have samples are any closer. Anyway, I doubt anyone would notice if Gravostyle was used as a substitute.<br>
      Don</p>
