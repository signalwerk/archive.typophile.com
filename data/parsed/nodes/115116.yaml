    date_raw: 20 Mar 2014 — 4:32am
    votes: null
    html: |-
      <p>Another one is <a class="freelinking external" href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Typ1451" rel="nofollow">Type 1451 LL</a> but I don't think it matches either (some letters closer, some less). Actually, don't know many 'condensed rounded sans' with such a spurred single storey /a... Which finally could appear to be an alternate glyph...<br>
      It has also an architectural/engineering/Leroy Lettering feeling like <a class="freelinking external" href="http://processtypefoundry.com/fonts/bryant-condensed" rel="nofollow">Bryant Condensed</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/planscribe-nf" rel="nofollow">Planscribe</a>, <a class="freelinking external" href="http://www.dafont.com/tgl-0-16.font" rel="nofollow">TGL 0-16</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/rendering" rel="nofollow">Rendering</a> (no lowercases unfortunately) and so... A good one too is <a class="freelinking external" href="http://www.myfonts.com/fonts/cercurius/simpliciter-sans" rel="nofollow">Simpliciter Sans</a>.</p>
