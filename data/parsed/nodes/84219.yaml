  html: |-
    <p>Version 2011_06_06 of FontForge can be downloaded from: <a href="http://www.geocities.jp/meir000/fontforge/" title="http://www.geocities.jp/meir000/fontforge/">http://www.geocities.jp/meir000/fontforge/</a><br>
    After unzipping fontforge-cygwin_2011_06_06.zip (20MB) we need to download a patch from: <a href="http://www.geocities.jp/meir000/fontforge/xming.html" title="http://www.geocities.jp/meir000/fontforge/xming.html">http://www.geocities.jp/meir000/fontforge/xming.html</a> and add its content to the FF folder:</p><div class="imageWrap"><img src="http://typophile.com/files/FF_6503.png"></div><br>
    doubleclick fontforge-xming.bat<br>
    and:<div class="imageWrap"><img src="http://typophile.com/files/OpenFont_5980.png"></div><br>
    more than 15,000 glyphs?<div class="imageWrap"><img src="http://typophile.com/files/jap_5109.png"></div><br>
    I suppose it is the first info in English! (The link is obfuscated ;)<br>
    Obviously thanks a bunch meir000, good going.<p></p>
  html_clean: |-
