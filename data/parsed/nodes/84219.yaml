    user: 190796
    date: 2012-05-12T22:44:00
    date_raw: 12 May 2012 — 10:44pm
    votes: null
    html: |-
      <p>yes it appears so;</p>
      <p>it is a core2 duo machine (64 bit?) with win7 32 bit; i have win7 available as a dual boot; when i try to run cygwin in win 7 it crashes; simply crashes and a serious error dump happens; otherwise it is stable win7; </p>
      <p>i have an acer 13 2nd generation with win7 64 bit; fontforge runs well there except the issue of inconsistent blinking; </p>
      <p>i did onemore step to identify the issue; i redirected the bat output 2&gt;errorlist (to catch the error starting; because the cmd window is splattered with pangocritical lines and the original output is lost)<br>
      =========<br>
      Copyright (c) 2000-2011 by George Williams.<br>
       Executable based on sources from 12:29 GMT 11-Feb-2011-ML-TtfDb.<br>
       Library based on sources from 01:16 GMT 11-Feb-2011.<br>
      <strong><br>
      (process:2756): Pango-WARNING **: failed to choose a font, expect ugly output. engine-type='PangoRenderFc', script='latin'<br>
      (process:2756): Pango-WARNING **: failed to choose a font, expect ugly output. engine-type='PangoRenderFc', script='common'<br>
      </strong><br>
      (process:2756): Pango-WARNING **: failed to choose a font, expect ugly output. engine-type='PangoRenderFc', script='katakana'<br>
      (process:2756): Pango-WARNING **: failed to choose a font, expect ugly output. engine-type='PangoRenderFc', script='han'<br>
      (process:2756): Pango-WARNING **: failed to choose a font, expect ugly output. engine-type='PangoRenderFc', script='hiragana'<br>
      (process:2756): Pango-WARNING **: failed to choose a font, expect ugly output. engine-type='PangoRenderFc', script='greek'<br>
      (process:2756): Pango-CRITICAL **: pango_xft_render: assertion `PANGO_XFT_IS_FONT (font)' failed<br>
      =====<br>
      i have made the susceptible lines in bold above; i think the engine is linked to (pango-basif-fc-dll); i think it should be PangoRenderFCwin32 (pango-basic-fc-win32.dll)?</p>
      <p>i made Xwin to pass before starting Fontforge and captured its log!  i am enclosing the errorlist for your reference; you can check /compare with yours;<br>
      ===== the key points are:<br>
      <strong><br>
      . . . . . .<br>
      LoadPreferences: /c/FF2012/.XWinrc not found<br>
      LoadPreferences: Loading /etc/X11/system.XWinrc<br>
      . . . . .<br>
      [dix] Could not init font path element /usr/share/fonts/misc/, removing from list!<br>
      [dix] Could not init font path element /usr/share/fonts/TTF/, removing from list!<br>
      [dix] Could not init font path element /usr/share/fonts/OTF/, removing from list!<br>
      [dix] Could not init font path element /usr/share/fonts/Type1/, removing from list!<br>
      [dix] Could not init font path element /usr/share/fonts/100dpi/, removing from list!<br>
      [dix] Could not init font path element /usr/share/fonts/75dpi/, removing from list!<br>
      winPointerWarpCursor - Discarding first warp: 640 400<br>
      . . . . . .<br>
      </strong><br>
      =====<br>
      can you check if you have these font files? (i dont think they are essential; it is essentially an optional list); but what about system.Xwinrc; is your version using the same sample file or is there is XWinrc in the extracted folder?</p>
      <p>regards<br>
      rnkantan</p>
