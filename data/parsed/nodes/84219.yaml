      i have been trying to start fontforge in Windows xp sp3; i initially tried the cygwin-fontforge package; it needs cygwin to be installed first;</p>
      <p>then i came across Mathew Petroff's window (installable/ported) fontforge version; it works but with two limitations; i am not able to close it and re-run it without rebooting the pc; the second time if i run, it is shown in the task manager but the selection window doesnot appear;</p>
      <p>i tried cvywin-mingw shown in this page; i downloaded both 2011 and 2012 versions and also xming.zip. After extracting and running the same i find it is starting; but with a hitch (see the image!) the selection window is present without "suitable fonts!"<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/CaptureWiz_5597.jpg"></div><br>
      i cannot makeout what is the pango xft render critical error? how to overcome?<p></p>
      <p>also any suggestion how to make MathewPetroff's to work second time in the same session?<br>
      regards<br>
      rnkantan</p>
