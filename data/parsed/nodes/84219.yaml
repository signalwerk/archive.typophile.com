      <p>Thank you greatly for bringing us up-to-date, Dave. But when you say the installation process is straightforward on Mac and Linux, I found it to be far from it until I asked for instructions from the FontForge user community. The instructions on <a class="freelinking external" href="http://fontforge.sourceforge.net/source-build.html" rel="nofollow">http://fontforge.sourceforge.net/source-build.html</a> are both confusing and seriously outdated, as are the builds based on the 2011-02-02 tarball provided by the various package managers (e.g.: Homebrew, Fink, Macports, etc.).</p>
