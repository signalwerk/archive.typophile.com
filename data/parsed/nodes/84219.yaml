      <p>in the cygwin/etc/fonts folder  there is a fonts.conf (a configuration file); there is a reference to windows directory for caching;</p>
      <p>==<br>
      !-- Font directory list --&gt;</p>
      <p>	/usr/share/fonts<br>
      	/c/WINDOWS/Fonts<br>
      	/c/WINNT/Fonts<br>
      	~/.fonts<br>
      =====</p>
      <p>my windows directory  doesnot have the default " c:/windows" path;  as i am dual booting i have named them  (XP and win7) while installing as winxppro and WIN7X64;<br>
      so i edited the file as:<br>
      ==<br>
      !-- Font directory list --&gt;</p>
      <p>	/usr/share/fonts<br>
      	/c/WINXPPRO/Fonts<br>
      	/c/WINNT/Fonts<br>
      	~/.fonts<br>
      ====</p>
