    html: |-
      <p>Jason Pagura asked on the FontForge-devel list for someone to comment on the state of FontForge. </p>
      <p>The history page at <a href="http://fontforge.sourceforge.net/ff-history.html" title="http://fontforge.sourceforge.net/ff-history.html">http://fontforge.sourceforge.net/ff-history.html</a> currently stops with my requests for a Cairo canvas, and Pango UI text, and then improvements to the themes code; that was in late 2008 as I recall. </p>
      <p>Since then the main software developer, George Williams, took up running more seriously - he blogs at <a href="http://georgeruns.wordpress.com/" title="http://georgeruns.wordpress.com/">http://georgeruns.wordpress.com/</a> - and his interest in FontForge has waned considerably. </p>
      <p>Today a small group of people contribute small improvements and you can see the changes at <a href="http://fontforge.git.sourceforge.net/git/gitweb.cgi?p=fontforge/fontforge;a=log" title="http://fontforge.git.sourceforge.net/git/gitweb.cgi?p=fontforge/fontforge;a=log">http://fontforge.git.sourceforge.net/git/gitweb.cgi?p=fontforge/fontforg...</a> </p>
      <p>My experience with FontForge over the last 6 years has been that George is interested in working on technically challenging features because those provide a fun way to spend his retirement, and he is not interested in non-technically-challenging features like improvements to the UI. He has designed the UI to make sense to him, and so he has no reason to change it :-)</p>
      <p>Anyway, the points of this thread is about how to install FontForge. I think the best way to install FontForge is to do so directly from this daily Git source code repository. It is straightforward on GNU/Linux, and on Mac OS X with HomeBrew. For Windows, I haven't used it in 10 years and have no idea :-)</p>
    html_clean: |-
