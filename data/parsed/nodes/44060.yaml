      <p>"So what’s the difference between Regent and Regent II?"</p>
      <p>I'm guessing number one wound up in Frankie Storm's waste basket, because his foundry does not offer it...plenty of examples there of reworkings, Pentagramme vs Pentagraf for instance...but whatever FS changed was for the better, because Regent II is a real classic for its look...keystroke-linked and affordable, God bless 'em.</p>
