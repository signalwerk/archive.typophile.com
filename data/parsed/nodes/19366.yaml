      <p>People already pointed out that Helvetica isn't hated for its self, but because it is overexposed. It is successful in being neutral, which is why it was selected to be included in the base PC font set. Jason's question recognizes that people do feel strongly about Helvetica, but it's not necessary or instructive to simply cheer or boo. Hate is too strong a word.</p>
      <p>I do not "hate" Helvetica, of course it's a giant in graphic design of the 20th century. But Univers took the same 19th-century Grotesk style and visibly evolved it into the 20th century, taming some of its more awkward proportions and making it even more useful. Look at the subtle shapes and contrast of Univers compared to Helvetica. Even more, look at how well Univers is spaced, compared to Helvetica.</p>
      <p>Helvetica was essentially a very complete cleanup of an extended family, or even category of typeface that type manufacturers had collected over previous decades. Helvetica systematized and sterilized the Grotesk style, same as Univers, but it didn't go any further. It took the style in a direction away from the proportions (which Ak-G still has) which facilitate reading, and eliminated the flavor, without doing anything to liven it up for the new technology or the new century. So while I appreciate Helvetica for what it can do, and for its flawless regularity and smoothness, I don't feel it's an appropriate typeface for many settings. It may be neutral, but it isn't a book face, or distinctive for logos, or readable on the highway or in bad lighting, etc. etc.</p>
