      <p>This will probably put me in the minority but...</p>
      <p>Helvetica should not be hated.</p>
      <p>Some background:</p>
      <p>- It was designed by Max Miedinger and Edouard Hoffman<br>
      in trying to better Akzidenz Grotesk...</p>
      <p>- Large x-height</p>
      <p>- Its forms were refined for clearer legibility and neutrality...</p>
      <p>Helvetica was intended to provide a neutral tone in order to<br>
      let the content speak, not the other way around. It was designed<br>
      based on a philosophy – Late Modernism/ "International Style"</p>
      <p>Such philosophy may not be appropriate in every circumstance,<br>
      but in the right setting, typefaces such as AK-G, Helvetica, Univers,<br>
      still hold up.</p>
      <p>People hate the big H, but I suspect it has less to do with<br>
      formalities than subjective bias.</p>
      <p>Also keep in mind, these "sterile" faces like Helvetica and<br>
      Univers were designed by the top designers of their generation,<br>
      why should we be so arrogant to dismiss their work without<br>
      appreciating the context in which it was produced?</p>
      <p>p.s. The piece above in the previous post, proves that<br>
      the hatred of H is unjustified.</p>
