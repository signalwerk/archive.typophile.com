      <p>Helvetica, for me, is truly a mystery. It's not just that it is used in so many situations where it is positively inappropriate. What popular type is not? It's rather that there is to my mind no situation at all ever in which some other face would not look and perform <em>better</em>. At best Helvetica is OK. Most of the time it is ... not so OK.</p>
      <p>With most other commonly used typefaces I don't much like--even over-used ones like Gill and Times, even Bookman and Avant Garde--I come across occasional examples where I think, "Hell, yes. Normally not keen on [xxx] but for once it looks perfect." But the only use for which Helvetica seems indispensable is to set samples of Helvetica.</p>
      <p>I experience the extraordinary devotion some people have to Helvetica rather in the way that I think about fetishes that I do not share. I <em>know</em> some people get really excited about dressing up as babies, or sniffing used trainers, or whatever, but I just don't "get" it. If people want to dribble over Helvetica, that's fine. I just wish they would do it where I don't have to watch.</p>
      <p>(Of course I have my own special private typofetishes ...)</p>
