      <p>Let's do both. Type Thesaurus is inspired. But for specific uses where there's no ubiquitous face, it's just recommendations (and maybe explanations). For instance, there's no ubiquitous face for very small text. Conversely, Helvetica is ubiquitous, but not [only] for a specific use. </p>
