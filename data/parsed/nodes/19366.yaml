      <p>I think specifically wayfinding signage and highway or traffic signage need type with more clear, unambiguous shapes than Helvetica. Lots of retail types do that now, and there are even some serif or semi-serif typefaces I would recommend for that. I've seen a reasonably nice campus signage system at a university that used Helvetica, so I don't think it's bad for all signage. But if legibility, or legibility at speed, or clarity is desired, choose something designed for the purpose like Avance, Albertus, Auto, Amasis, Avenir, Amplitude, Uh.... That's just the A's. </p>
      <p>I guess this indicates what I'm saying: There are thousands of typefaces out there. If you're interested enough, do some exploring. For those who just want recommendations, maybe we need to add some sections to the wiki for lists of typefaces appropriate for specific uses. I know we've discussed small sizes, highway signs, newspapers, and low-res uses, shalle we start a list of lists?</p>
