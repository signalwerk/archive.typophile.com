      <p>how about Velvetica? :)</p>
      <p>Seriously, I think Helvetica is a monotone typeface -- no expressivity at all - giving it a great potential for “Cautions” and “Warning” on the back of your fridge. Overused, no real italics, no small caps, no oldstyle figures... and bland as a spiceless meal can be.</p>
