      <p>Helvetica is very unique in that it is so successful (commercially) that it has become reviled. One ingredient in the popular dislike is the fact that it was bundled with every personal computer since 1984, so we're all really tired of seeing it. It's like pancakes for breakfast, lunch, dinner, 7 days a week. Barf!</p>
      <p>One other reason people hate it is that it's used for everything, including fine print, health warnings, wayfinding signage, expensive graphic identities, teeny print in artsy design books, logos, etc. etc. It really does not perform well in any of those settings. For any designer given adequate choices, Helvetica is really only good (by this I mean effective, attractive, functional) in a few settings. All the versions, from original metal right up to the Neue versions, are spaced for display use, which means they look like rotting hell at small sizes. </p>
      <p>Helvetica, spaced tightly the way it is, with its monoline strokes, ambiguous machine shapes, and awkward proportions, presents a very difficult situation for a reader. Essentially, at text sizes it falls apart (or should I say, clumps together). </p>
      <p>In spite of its weaknesses, and you can see there are many, it is used everywhere by everyone for everything, when other typefaces, equally available, could do those jobs so much better. It's something of a thoughtless default, so you could also say that in addition to the neutral Swiss associations it carries, it now carries an association of mindlessness, emptiness, clone-y 80's generic blandness. You've heard the expression, "To not make a choice, is to make a choice"? Helvetica is to not make a choice. Helvetica is to do what is safe, to settle for something not really appropriate but generally accepted. Helvetica is to not care about typography. It's the hospital gown of typefaces.</p>
