      <p>There was a time when makeing typefaces required years of work and propritary machines to output.  That time made peoples choices for type small and they made do.  Today we can have any type at almost any time.  There is no need for yet another generic brand face for Microsoft, Apple, and Adobe to bundle with everything on earth and make the default font.  There is a lot of Helvetica and Times around because most people don't venture beyond the default font in their word processor. We don't need to encourage them to keep doing that by coming up with another font to take Helvetica's place.  It is like having default food at the grocery store, you walk in and get several brown paper bags full of what Safeway has as default food--sounds like fun huh?</p>
      <p>ChrisL</p>
