      <p>Nick has it: Franklin Gothic, and its ilk, really deserve the kind of attention that Helvetica has had. In fact, Franklin Gothic has been there all the time, unobtrusively performing, in many more settings than Helvetica, for more decades. It really deserves to be considered a classic, and a standard. </p>
      <p>One thing that Helvetica has accomplished that is noteworthy: It survived all the technological transitions from its original format (hot metal). I propose that it was able to survive through all that technological degradation BECAUSE of its coarse, wide, klunky shapes and limited character set. Who is pining away for Helvetica Oldstyle Figures? Uh Oh, Type Battle #12?......</p>
      <p>The grotesques it was based on have only recently been given a new appreciation, other contemporary designs (most notably the superior Univers) have not kept their appeal over the same period, and frankly, the design standards for type dropped so low that by the late 80's nobody even knew about the difference between text type and display type. ITC with its buttery ranges of advertising faces fed this ambiguity, so that by simply sitting in one place, not changing, Helvetica found its perfect environment. Now that we know better, we can make better choices of type for books, signage, logos, etc. and we have higher standards (I hope). </p>
      <p>Like Gill Sans, which was indeed superior in its day, Helvetica has been surpassed repeatedly by more subtle, useful, approachable designs, better suited to the media and technology of today, and we ought to recognize the improvements and choices that we can now enjoy. More to the point (is Helvetica saintly or evil?), we ought to be able to recognize a typeface's strengths and weaknesses, and work with them accordingly. If a typeface can't do what we want it to do, we simply choose a different one (and license it fully from the original foundry!).</p>
