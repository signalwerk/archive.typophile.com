      <p>Note that I'm hardly an expert in this area, but my gut feeling is that, while there's nothing wrong with studying other people's code to get an idea of how things are done, pasting your own glyphs over an existing font crosses a line -- even though you've removed the original glyphs you're still basing your work on a copyrighted file made be someone else.</p>
      <p>An alternative which you might consider, though, would be to look at various fonts which have been released under OFL/GPL or some other variant of Open/Free software license. Some of these may even include .vfb or .fea files which would allow you to read their original code rather than FontLab's decompiled version thereof, and open licenses would probably allow you to use that code as a basis for your own code.</p>
      <p>Let me reiterate that this is my 'gut-feeling' reaction rather than a legally or ethically informed opinion.</p>
      <p>André</p>
