      <p>One other thing -- as I mentioned, studying other people's code to get an idea of how things are done seems OK to me, but the emphasis here is on the value which other people's code might have to you gaining an understanding of how OpenType coding works. The approach which you are suggesting in your post isn't one that's going to further your own understanding of the subject since you're essentially taking the entirety of someone else's code, deleting references to nonexistent glyphs, and then keeping your fingers crossed that everything's going to work properly for your glyph set. Without doing your own coding, you're not going to get a good feel for why people include the code they do and how it actually does what it's supposed to do.</p>
      <p>André</p>
