      <p>Okay, I see what you're saying. As regards not actually learning how to code for real, that's one thing I'd actually be okay with not knowing, if I could avoid it. Mainly because there are a lot more things that I'd rather do than sit at my computer writing hundreds or thousands of lines of code. If we continue my equation analogy, it's like saying I'm fine with using the quadratic equation even if I have no idea how to derive it. But I guess as a fontmaker, I'll have to learn this stuff anyhow... such is the life, huh?</p>
      <p>So does anyone have a favorite starting point for learning how to write OpenType code that works? Or is the method basically to scrutinize other fonts' code and figure out what each line means, then do the same things myself?</p>
