    <p>I started by writing the name with a paint pen, scanning it in, and turning it into a vector. My goal is to create something that is upbeat, fresh, and doesn't look homemade. Feel free to critique it in a reverse compliment sandwich. </p>
    <p>Here is a link to the band for comparison. <a href="http://mableyandgreek.bandcamp.com/#zplays" title="http://mableyandgreek.bandcamp.com/#zplays">http://mableyandgreek.bandcamp.com/#zplays</a></p>
    <p>Thanks!<br>
    Jamie</p>
