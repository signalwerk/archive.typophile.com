    <p>I just wanted to pass this along, John and I will be at the Type Director's Club this Thursday evening.</p>
    <p><cite>Hey, everyone,</cite></p>
    <p><cite>I just wanted to let you know that I'll have several paintings hanging at<br>
    the Type Directors Club in New York in February and through March.</cite></p>
    <p><cite>The announcement is attached. The Type Directors Club is at:<br>
    347 West 36 Street      Suite 603       New York, NY 10018<br>
    Contact info: 212-633-8943      e: <a href="mailto:director@tdc.org">director@tdc.org</a><br>
    <a href="http://www.tdc.org" title="http://www.tdc.org">http://www.tdc.org</a></cite></p>
    <p><cite>If you're in the NYC area on Thursday February 4, there'll be a reception<br>
    from 6-8 pm, and I'll be giving a brief talk about my work.</cite></p>
    <p><cite>I hope you get a chance to stop in sometime during those weeks, or maybe I'll see you at the reception!</cite></p>
    <p><cite>John</cite></p>
