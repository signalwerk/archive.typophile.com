      <p><em>...the relationship of lettering and building.</em></p>
      <p>Nicolette Grey makes many architectural allusions in <em>Nineteenth Century Ornamented Typefaces</em>, comparing the type design trends in different decades of the 19th century with contemporary trends in architecture. She benchmarks type design against architecture, more so than art, literature or music.<br>
      Her book is in fact a history of 19th century english type design in general, not just ornamental types. As a cultural analysis of the plastic values of type style, I know of no better work.</p>
    html_clean: |-
