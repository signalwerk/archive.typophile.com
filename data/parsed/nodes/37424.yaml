      <p>I highly recommend Peter Hall's 'Living skins: Architecture as interface':<br>
      <a href="http://www.adobe.com/designcenter/thinktank/livingskins/" title="http://www.adobe.com/designcenter/thinktank/livingskins/">http://www.adobe.com/designcenter/thinktank/livingskins/</a></p>
      <p>In his article are some sophisticated thoughts about the <cite>role</cite> of type in architecture but he does not go into detail about the actual typography. And he is right because his thoughts are independent of the typographic details.</p>
      <p>I also thought about writing my dissertation about typography and architecture and found that this is the main problem: Some people treat the architectural role of type while (rightly) ignoring the details. Others, like those who write about lettering, care about the actual letter shapes but not (or only superficially) about the architectural context. At least, I haven't found anything.</p>
      <p>If you manage to actually <cite>connect</cite> both on a sophisticated level that would be ground breaking and very impressive as far as I am concerned.</p>
