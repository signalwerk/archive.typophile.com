      <p>The landscape architects I work for were involved in a project for the Lowther Children's Centre with large scale lettering in timber. The architects were Patel Taylor who, I believe, specified the type. Looks like a nice for the little ones to run around.<br>
      <a href="http://www.plincke.com/projects/education/primary/lowther-childrens-centre/" title="http://www.plincke.com/projects/education/primary/lowther-childrens-centre/">http://www.plincke.com/projects/education/primary/lowther-childrens-centre/</a><br>
      <a href="http://www.flickr.com/photos/46526683@N03/4271911628/" title="http://www.flickr.com/photos/46526683@N03/4271911628/">http://www.flickr.com/photos/46526683@N03/4271911628/</a></p>
      <p>Reminds me also of the monolithic Arsenal letters at the Emirates Stadium at Ashburton Grove used as a meeting point and creates a sense of welcome.<br>
      <a href="http://www.flickr.com/photos/toxophilite/540204198/" title="http://www.flickr.com/photos/toxophilite/540204198/">http://www.flickr.com/photos/toxophilite/540204198/</a></p>
      <p>The Hackney Empire extension is a great one as the block letters seem to float in the air in front of the south elevation as you view from Mare Street.<br>
