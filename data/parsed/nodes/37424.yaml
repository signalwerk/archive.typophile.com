      <p><a href="http://www.contemporist.com/2009/11/06/torres-de-hercules-by-rafael-de-la-hoz/" rel="nofollow">Torres de Hercules.</a></p>
      <p>It's striking, but I question the decision to make the motto read only horizontally, with the rows offset at random, so that all you can see on the vertical towers from any vantage point is gibberish. I would have used a one-step pattern like so:<br>
      <code><br>
      NONPLUSULTRA<br>
      ONPLUSULTRAN<br>
      NPLUSULTRANO<br>
      PLUSULTRANON<br>
      LUSULTRANONP<br>
      USULTRANONPL<br>
      SULTRANONPLU<br>
      ULTRANONPLUS<br>
      LTRANONPLUSU<br>
      TRANONPLUSUL<br>
      RANONPLUSULT<br>
      ANONPLUSULTR<br>
      </code></p>
