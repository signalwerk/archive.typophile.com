      <p>Hi megmog,</p>
      <p>I have just started my MPhil/PhD by project at the Department of Architecture of the Royal College of Arts and my topic is exactly the same as yours. I call it 'Typotecture: typographic elements applied to architectural design'.</p>
      <p>I started carrying out research on it while I was doing my undergraduate studies in Greece (5 years ago). At that period, I tried to define typotecture, record and analyse its history with emphasis to contemporary examples (using many of the ones listed above) and evaluate it. At the RCA, my intention is to develop it further, especially in practice using current digital tools (scripting, 3d modeling, rapid prototyping).</p>
      <p>In my opinion, one of the 'good examples' of typotecture - maybe the best - is the Marion Cultural Centre in Australia (last picture), where the boundaries between typography and architecture become blurred. It is one of the few cases where a visitor trying to read the name (semantics) of the building ends up reading the structure of it.</p>
      <p>As you have already noticed, the information for this subject is limited and fragmentated, but this should be a reason for you to continue and not be frustrated!</p>
      <p>Keep up the research!!!</p>
      <p>I'll be in touch!</p>
      <p>chrisostomost</p><div class="imageWrap"><img src="http://typophile.com/files/Typotecture_3927.jpg"></div><p></p>
