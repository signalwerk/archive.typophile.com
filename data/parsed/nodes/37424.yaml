    <p>Hi,</p>
    <p>I'm a graphic design university student going into my final year and have chosen to do my dissertation on the use of typography in architecture.</p>
    <p>Most of the resources on this topic focus on signage or wayfinding systems, but I would like to look at buildings where typography is much more integral to the overall design; this could be as part of the actual building (such as the wales millennium centre) or separate but in a way that really adds to the overall impact of the design.</p>
    <p>I'm struggling to find good examples of this, especially in the UK where I stand a better chance of being able to talk to architects/typographers involved in the project – I'm appealing for suggestions please! I know there are a couple of other posts in this forum related to this and I've already checked the references out. REally helpful but I jsut need more examples really</p>
    <p>Any suggestions of buildings that use typogrpahy or related resources would really be appreciated, thanks!</p>
