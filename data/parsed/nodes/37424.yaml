      <p>There is another one  in my surrounding: <a href="http://www.lentos.at" rel="nofollow"> The Lentos</a>, muzeum of Modern Art in Linz. It is a clear concrete building with a glass surface. And in this glass there are hundreds and thousands of little signatures »lentoskunstmuseum« seen, which give the glass structure a translucent feeling. At the empty spaces the word LENTOS is formed. At night the glass is highlighted with different coloured lamps, so the building is shining violet, green and red (if I remember the colours correctly)</p>
