      <p>Another thing that is quite interesting in terms of 'bad examples' is looking at buildings that have changed their use since the type was originally done. There's a department store in Reading that still has 'Heelas', its old name, embedded in the brick. It's an argument against using typography that is more integral to the building perhaps, although in a way it's quite interesting as it shows the building's history...</p>
