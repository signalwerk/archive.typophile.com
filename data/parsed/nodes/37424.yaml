      <p>A friend of mine is an architect whose studio is called <a href="http://www.xarchitekten.at/" rel="nofollow">x architekten</a> in Linz, Austria. In 2001 they built a house for a family in Upper Austria where one of the supporting pillars was formed as a giant x. The copy of the architectural database nextroom says: »… this pillar is simoultaneously sort of a signature of the architects …" and the well-known newspaper Der Standard has seen this also in his architectural essays: »…&nbsp;this X can be read as an architectural label and links to the authors of the house …«</p>
