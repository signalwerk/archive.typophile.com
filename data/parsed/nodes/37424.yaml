    html: |-
      <p>wow, thanks everyone! This is all really useful stuff. It brings up some interesting questions that I've been trying to work out myself too e.g. where does the line come between type that is truly integrated with the building and type that is just an addition? At first I thought I'd just assume that if the type is 'part of the building' e.g. carved into it, then it's integrated, but I think it's more complex than that – loads of old buildings have engraved letters that don't really make much impact on the design and then you'll find a building that has type effectively as a sign stuck onto it, such as Fukutake House suggested by satya, but the type is much more integral to the overall design. Any thoughts?</p>
      <p>If people are interested here are some of the best examples I've found so far:<br>
      OXO tower, Wales Millennium Centre, TVAM building in Camden, Milan Polytechnic College, Graduate House of Toronto University, ESISAR school of engineering in France, South African Constitutional Court. I've also happened across some mentions of Fortunato Depero who seemed to be part of a futurist movement and designed structures/buildings that were entirely type for advertising purposes, but I haven't been able to find much information on him. Does anyone know anything about him?</p>
      <p>The Steingruber Alphabet suggestion is really interesting – I'll definitely be looking into this more! As for Nicolete Gray, I agree; she is definitely the main source of writing on this subject. I've found her book Lettering on Buildings, which I think includes most of the articles Iore mentions, as well as Alan Bartram's Lettering in Architecture and Jock Kinneir's Words and Buildings. A few other books are slightly related but those are the best I've found so far. Does anyone know of any more recent books on the subject? The most recent of these is 1980 and using typography and architecture has become a lot more common in the last few years I think?</p>
      <p>Sorry for the length of this post!</p>
