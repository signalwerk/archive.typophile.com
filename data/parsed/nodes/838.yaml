    date: 2002-05-23T12:12:00
    date_raw: 23 May 2002 — 12:12pm
    votes: null
    html: <p> I didn't much like OSX at first, but I am trying to integrate it into my life little by little. Initially, everything I did was in Classic mode, which is utterly pointless. I think the whole concept of Classic was a big mistake on Apple's part. Like swimming in a mountain lake, the only way to do it is to dive in. All or nothing. Otherwise it's tippy-toe torture, and that's exactly what Classic is. <br> <br>Early on, pretty much all I did was fiddle with the OS for a few moments once or twice a week, but now I have Photoshop, Illustrator, BBEdit and Toast running native. Once FontLab, QXP and Dreamweaver are X'd, I'll use it more often. <br> <br>Besides not having my favorite apps native, the thing that drives me the most nuts about X is saving and opening files from dialog boxes. Sometimes I have no idea how I navigated to a particular volume and folder... Sometimes it seems like the OS won't let me save/open stuff where I want it, and if I do manage, I fear I'll never find it again! In other words, some of the most basic tasks are rendered needlessly complex in X. <br> <br>For the time being, the OS versions mirror the breakdown -- OS9=90% of my time, OSX=10% (at most). <br> <br>- Sean </p>
