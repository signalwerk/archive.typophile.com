    html: <p> Again, John, I need to keep 9.0.4 on there to run the audio editing stuff. It doesn't even run under 9.1, otherwise I could use Classic. And audio editing is very, very dependent upon timing issues, and the main audio software packages (Cubase, Logic, Cakewalk) are only just starting to ship OS X versions. It's apparently very hard to write software to control timing inside OS X. Reason is shipping, which is cool, but I require Cubase for the VST support. (ReWire is the answer to a question nobody asked.) <br> <br>But there will be a G4 or G5 in my future, probably early next year, depending on how business goes, and depending on when Apple finally sorts its G5 fabrication issues. (Or bails and goes with Intel.) <br> <br>Personally, I think they should approach AMD. </p>
