    html: <p> Nine.Two.Two. <br> <br>Have used X since public beta (18 months ago), but basically can't stand it for long as it's buggy and slow. If the UI and speed issues get sorted out I'll make the switch, but it's a long way from there yet. I also don't find it any more stable than 9.x, despite what's claimed. <br> <br>I go through stages of trying X for a week or so, but it quickly wears out its welcome. <br> <br>So, sticking with 9. <br> <br>On the other hand I've just set up a web server using X, and I'm reasonably happy with that - but then there are no user interface issues with a server. <br> <br>We're currently running one web server on 8.6, one on 9.2 and one on X - how's that for consistency. <br> <br>Er... and the networking setup in X isn't flexible enough for my needs. <br> <br>Steve Jobs said at the recent (Apple) World Wide Developers Conference that 1 million people were using X at the beginning of the year, and he hopes for 5 million by the end of the year. Frankly, 1 million is pitiful, and marks what people really think of X despite all the hype - it's around 3% of the installed base. To get to 5 million all Apple has to do is claim that most of the Macs they ship this year are "actively" running X. </p>
