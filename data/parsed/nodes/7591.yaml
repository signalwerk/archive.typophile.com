    html: <p>I know it's not exact, but I think <a href="http://www.myfonts.com/fonts/linotype/stempel-schneidler/?PREFS_SET%5BRenderSize%5D=48&amp;PREFS_SET%5BRenderString%5D=HOMESTEAD" target="_blank">Schneidler</a> was the model for this. The serifs have been redrawn, but I think the underlying letterforms are very similar. The E was my main reason. <br> <br>OK, now it's time for Mark to come in and tell us what it really is. ;-)</p>
