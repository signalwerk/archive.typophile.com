    html: <p>The reason I picked Schneidler has to do with the proportions of the arms on the E. The top two arms are very close in length and the bottom is quite a bit longer. I also noticed the shape of the D, with the underside curve near the stem. Also the serifs on the T move the same directions as those in Schneidler, but appear to have been cut off at the tops. The stroke thickness can easily be doctored in Illustrator, as we know. <br> <br>The E in Monkton doesn't have the same proportions. All three we have mentioned have the same M (along with Trajan and Giovanni, as two more I can name), but I think the resemblance ends there, except with Schneidler. <br> <br>I guess if we are allowing that this font has been modified, debating which is closest is a bit academic, but that's my vote.</p>
