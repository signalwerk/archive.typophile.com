    html: <p>This one kind of stumped me. I thought it might be <a href="http://www.myfonts.com/fonts/bitstream/weiss/bold/testdrive.html?s=HOMESTEAD&amp;p=48" target="_blank">Weiss</a>, but that didn't look right. There's another face called Schniedler Titling (also Bauer Titling) which is closer to the look, but not as bold. <br> <br>The numbers, incidentally, are Goudy Extra Bold. I've seen that "THE" thing somewhere before, too.</p>
