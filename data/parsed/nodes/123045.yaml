    html: |-
      <p>Pretty convinced it has never been a font as it, rather a customization of an existing pre-digital sans.<br>
      Some I like as alternative: FF <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/softsoul" rel="nofollow">Softsoul</a> Black (not bad, some corners needing to be squared and it'd be not so far), <a class="freelinking external" href="http://www.myfonts.com/fonts/positype/sneakers-pro" rel="nofollow">Sneakers</a> (more work), <a class="freelinking external" href="http://www.myfonts.com/fonts/filmotype/mansfield" rel="nofollow">Mansfield</a> (nice too), <a class="freelinking external" href="http://www.myfonts.com/fonts/thinkdust/rika" rel="nofollow">Rika</a> (hardly squooshed but why not), <a class="freelinking external" href="http://www.myfonts.com/fonts/naghachian/iranica" rel="nofollow">Iranica</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/naghachian/nima" rel="nofollow">Nima</a>, <a class="freelinking external" href="http://www.dafont.com/philosophy.font" rel="nofollow">Philosophy</a> (almost perfect), <a class="freelinking external" href="http://www.ffonts.net/LeftOvers-II.font" rel="nofollow">LeftOvers II</a></p>
