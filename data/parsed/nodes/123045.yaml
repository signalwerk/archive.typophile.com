      <div class="comment-spam-body"><p>A little too wide, but otherwise rather close -- except for the squared corners on _C_ and _S_ and the leg on _R_ -- is YWFT Matter <a href="https://www.youworkforthem.com/font/T0264/ywft-matter?affid=109571" title="https://www.youworkforthem.com/font/T0264/ywft-matter?affid=109571">https://www.youworkforthem.com/font/T0264/ywft-matter?affid=109571</a><br>
      The font is a digital version of Information Extra Bold Wide (Breitfett) which was designed by Friedrich Karl Sallwey in 1958 as an addition to the Information family. It is probably best known today from its use in Pablo Ferro’s title sequence for “Bullitt”. [Source Stephen Coles <a href="https://www.flickr.com/photos/stewf/11794966995/in/photostream/" title="https://www.flickr.com/photos/stewf/11794966995/in/photostream/">https://www.flickr.com/photos/stewf/11794966995/in/photostream/</a> ]<br>
      Don</p>
      </div>
