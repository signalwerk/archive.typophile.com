    html: |-
      <div class="comment-spam-body"><p>A dozen suggestions, all in the ball park but unfortunately all are in the outfield. To attempt to duplicate the letters using an existing font could be more than a trivial amount of work, depending on how close a match was desired.<br>
      EDITED TO REMOVE GUESSWORK:<br>
      As for the question of whether this was a photo-lettering era creation rather than hand lettering, about all I can say is that the letters work well together and could make an effective font.</p>
      <p>Don</p>
      </div>
