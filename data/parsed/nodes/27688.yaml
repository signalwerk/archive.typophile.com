  html: |-
    <p>Hi guys, i was directed to this site from another forum for some addvice on a logo i've been working on for a new online magazine that will focus on streetwear, shoes, art, and music. Any feedback or suggstions would be much appreciated. Thanks! </p>
    <p>Here are the latest versions i have:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/format501_4705.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/format502_4916.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/format503_4036.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/format601_6732.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/format602_4978.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/format603_3612.gif"></div><p></p>
    <p>The magazine is called "Format". Since the magazine is focusing on cool stuff inside &amp; out i thought a logo thats looks the same inside &amp; out would fit well, so as you can see it's a mirror image ambigram.</p>
