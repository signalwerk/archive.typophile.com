    html: |-
      <p>I go with shawkash.<br>
      It's one thing to set up a rule and keep strictly to it whether it works or not, and another to make small tweaks so the original intention works well.</p>
      <p>It is still readable backwards. it could, actually nobody does, but it could... And that's the original intention, not to actually read it backwards, but that it *could* be read backwards. It's about the idea, not the practical actual action.<br>
      To specify this: It's the same as with Futura: the idea of a geometrical typeface ist nice, but when creating it the designer comes to the conclusion that things just do not work that way. The trick is to make them work with small tweaks, without dropping the idea as a whole.</p>
      <p>I would also tweak the horizontal bars a bit, making the left part of the "f" slightly shorter, the right longer, and the same thing for the "t", so the characters look more natural.<br>
      And I would stick with the curved lower part of "f" and "t" (the ones from #1 in the original post). They give the "t" it's natural form that is distorted by the upper curve at the moment, and do not bother the f.</p>
      <p>And of course, spacing is not good yet in shawkash's version: "m" and "a" need more space.</p>
      <p>edit: here is a quick scetch (it still needs some finetuning, but the intention should become clear)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/format502_4041.png"></div><p></p>
