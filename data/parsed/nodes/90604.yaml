      <p>I would have thought that, given the name of the currency unit, they should just have taken a British pound sign, but modified it to have three horizontal bars instead of one (or two), instead of going with something completely novel.</p>
      <p>In some subsequent searching, I've found that the form with two crossbars, although sometimes infrequently used for the British pound, was associated with the Italian lira as well, confirming my suggestion that the Turks would need to use three crossbars to have their own unique member of this family.</p>
