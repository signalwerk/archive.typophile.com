      <p>It is NOT a new character. (!) There is the Lira sign existing at codepoint 20A4, typographically a variant of the sterling glyph. End of story. (Note that by annotation it is specified just as LIRA, not as Italian or Turkish Lira per se.) </p>
      <p>Everything else is just nonsense.</p>
      <p>If you wish now to tune the design of 20A4 according to the new turkish briefing, feel free to do so. But I won’t, because it’s rubbish.</p>
      <p>And if ever our turkish friends come to raise the request of a new character before ISO, I will say: 20A4.</p>
