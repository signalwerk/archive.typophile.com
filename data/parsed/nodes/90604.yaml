      <p>I think the whole 'anchor' notion is a red herring. In the press release introducing the symbol, it has all the marks of a post facto interpretation of a design that is clearly based around an uppercase L, a lowercase t -- more on that below --, and the conventions of other major currency symbols. And this is what it is important to remember: it is a currency symbol among currency symbols, not a pictogram of an anchor. The whole point of the exercise is for the Turks to have a symbol for their currency that takes its place among the other internationally recognised currency symbols, so we'd be doing them a disservice if we adopted an approach that makes the sign visually out of synch with other currency symbols and risks exoticisation. As far as I'm concerned, the anchor notion is something to be completely ignored, along with any other external shape correspondences; hence I am neither seeking to make the upturn look like a gondola prow nor fussed if it turns out to suggest that, any more than I care if my uppercase A reminds someone of a Swiss ski chalet. I'm designing a sign within a writing system according to the construction of the other signs in that system and the particular typeface design. As Gill might say at this juncture: a currency symbol is a thing, not a picture of a thing.</p>
      <p>Hrant:</p>
      <blockquote><p>I'm not opposed to a full double serif up top. But: why? For one thing, the need to relieve crowding that John mentioned should possibly be extended to the top = no serifs. Also, numerals don't have head-serifs.</p></blockquote>
      <p>I didn't find any problem with crowding or busyness at the top of the symbol, but then I also didn't place the bars as high as in the official logo sign. Why not? Because that's not the convention of most currency symbols, and I didn't want to make the Turkish lira sign unnecessarily distinct in this regard (although I consider the higher bars a valid alternative that should be considered relative to the shape and size of the upturn terminal, as in Craig's lachrymal example).</p>
      <p>I favoured a double serif at the top because, with few exceptions, <a href="http://www.unicode.org/charts/PDF/U20A0.pdf" rel="nofollow">currency symbols</a> are based on uppercase letters, and the other Cambria currency symbols follow this pattern. Once again, I think it makes sense to follow what one has already done in the other currency symbols in a typeface, in e.g. the yen symbol. Now, that said, it should be obvious that if one has deliberately crafted currency symbols that utilise terminals referencing lowercase forms, maybe for use with oldstyle numerals, then it would make sense to apply the same approach to the Turkish lira sign. In other words, the shape of serifs to be used is not part of a basic construction model, but a design-specific determinant of the general approach to currency symbol design.<br>
      _____</p>
      <p>Most of the discussion so far has focused on the relationship of this symbol to the uppercase L, with some reference to the anchor notion. It may be helpful to consider that the sign also resembles a lowercase t, and this is presumably intentional. This is why I think Craig's 'elephant in the room' is potentially a legitimate variant, although I think it would benefit from longer and slanted bars.</p>
    html_clean: |-
