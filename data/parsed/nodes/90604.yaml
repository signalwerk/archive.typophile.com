    html: "<p>Andreas, while I dislike and see all sorts of design problems with this new Turkish currency symbol, it is clearly not a variant of U+20A4. The fact that both the Italian and Turkish currency units are called lira is beside the point: they are not the same currency, and the symbol represents the currency, not the name of the currency. Different countries may use the same currency symbol to represent different currencies -- e.g. $ which is dollar in some countries and peso in others --, and other countries may use the same names but different symbols (I can't think of one off hand).</p>"
