      <p>OK, everybody, it's time to get your design caps on.</p>
      <p>1) The character will be encoded. No point in arguing about it. Turkey submitted a proposal to encode it, as did I. Mine is <a class="freelinking external" href="http://std.dkuug.dk/jtc1/sc2/wg2/docs/n4258.pdf" rel="nofollow">here</a>.</p>
      <p>2) So far for the ballot, the glyph for the character will be the "official" one as seen at the top of the page here. Now as you know, <a class="freelinking external" href="http://www.unicode.org/charts/PDF/U20A0.pdf" rel="nofollow">in the code charts</a> the more generic shapes (in this case based more or less on Times) are generally used. Now despite the fact that I had proposed to use one of Craig Eliason's forms in my proposal, the UTC felt that it was too early to know how this would be designed and implemented in OS fonts or other fonts. So I said I would come to this forum and ask the wider community for designs so that se might see what sort of consensus there would be. I see John and Bendy have come up with some. It looks a bit like people are turning a P and lopping off part of its bowl. In a serif font, the real questions are, what to do about the top serif (I followed Craig's), what to do about the horizontals, and what sort of finial should go on the anchor's fluke. </p>
      <p>Start designing!</p>
