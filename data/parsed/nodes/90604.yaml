      <p>The symbol was the result of a competition, unfortunately not the best way to get a good design.</p>
      <p>This is a typographic symbol, and yet, like the Euro, it was designed by someone who is not a type designer, and the criteria for judging would not, I assume, have had any mention of scalability, slant, weight variance or screen rendering. </p>
      <p>You know, one line for the crossbar, rather than two, would have been just fine, and would have magicked away all kinds of monstrous type production problems that the double bar will create.</p>
