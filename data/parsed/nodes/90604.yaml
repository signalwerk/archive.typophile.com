      <p>I've just come across a news item announcing that the next release of Unicode has been hastened, due to the urgent need to support the new Turkish lira sign:</p>
      <p><a class="freelinking external" href="http://unicode-inc.blogspot.ca/2012/05/unicode-62-to-support-turkish-lira-sign.html" rel="nofollow">http://unicode-inc.blogspot.ca/2012/05/unicode-62-to-support-turkish-lira-sign.html</a></p>
      <p>Maybe I clicked on the link to it earlier in this thread, in which case this didn't need to be posted,</p>
      <p>(EDIT: It was: Si Daniels' post above.)</p>
      <p>or perhaps it came up in a Google search I conducted for other reasons, in which case this might be useful news.</p>
      <p>So its code point will be U+20B4, and we can all stop waiting.</p>
      <p>EDIT: So now the comments can start about how such a thing can be called "urgent". But despite what opinion one might have about Turkey's adoption of a distinctive symbol for their currency, the fact is that once it has been adopted, Turkish computer users, at least, will want to be able to generate it from their keyboards as easily as U.S. computer users produce the dollar sign "$", and without a standardized Unicode code point, chaos and inconvenience will result from attempts to satisfy that desire.</p>
      <p>Turkey <em>should</em> have been able to just reserve a codepoint before even picking the appearance of the new glyph, in my opinion, so that the moment the winner was announced, standardized implementations could be rolled out without waiting an extra second.</p>
