    html: <p>Craig, I think that construction is a valid option if that's the sort of thing that happens in the typeface design. Note that the closed loop reversal in £ is usually a factor arising from the slant of the descending stroke -- the more vertical the stem, the more likely a simple stop-reversal or corner -- and is specifically a cursive construction, i.e. in ductus terms a result of the pen not ceasing to move. So I can see this form of construction being particularly appropriate in italic fonts that follow cursive ductus models. And, of course, there is no reason why the roman and italic forms of the symbol should have the same construction, just as one might vary the treatment of terminals and stroke transitions between roman and italic £ $ etc.</p>
