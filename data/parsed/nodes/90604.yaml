      <p>Visible language has multiple layers, with different mentalities required for the proper design of each. And when a character has an "official" rendering it gets even more complex. I worry that if somebody produces a very attractive rendering that works well in one style, people will blindly gravitate to that and try to extend it to every other style, and we'll pay the price in the long term.</p>
      <p>What I personally find important right now is the sort of thing John did in his most recent post: try to <em>talk</em> about what the symbol -and its parts- need to be doing. This is parallel to the advantage of performing rough sketches of an idea before actually making things that look final.</p>
      <p>Specifically, the biggest question seems to be: assuming "stroke" contrast, should the bottom be thick or thin? Although it would be OK to go against such a decision in a given case, it's a sort of decision that does have a place, and on a level higher than making glyphs.</p>
      <p>hhp</p>
