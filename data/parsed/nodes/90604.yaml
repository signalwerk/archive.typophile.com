      <p>The following didn't turn out as coherent as I could manage, but I hope it will still serve to temper our -commendable- enthusiasm and provide food for thought.</p>
      <p>Michael, nice to see you spearheading this. But I'm actually surprised that Unicode is proposing to pay attention to what we do "on the ground". Is this usual? Is it that they need to figure out what the actual Times-flavored rendering will be in their codepage renderings? That makes sense (but not much beyond that does).</p>
      <p>And I have to take issue with the first half of Kent's post. Yes, formal harmony in a set of glyphs is important, but I personally always strive for a character to be itself and basing the TL too closely to existing structures risks shortchanging it (pardon the pun). Also, most currency marks are derived from alphabetic structures, but <em>all</em> currency marks end up abutted to numerals... So maybe we need to think in terms of [diverging from?] the numerals, which for example traditionally have thick horizontals.</p>
      <p>Also, as much as I admire Craig's inventive -and polished- work, I think we need to talk about this in the abstract before we resort to renderings. This is one of the biggest responsibilities that Typophilers can have - let's go slow and tread carefully.</p>
      <p>hhp</p>
