      <p>But I wonder if there isn’t some way to retain more of the intention of the quarter circle anchor (as misguided as the specific geometry itself might be) while still referencing an underlying <em>L</em>. To that end, I’m thinking that some kind of simple terminal treatment echoing the leg of the <em>L</em>, where possible and appropriate, might help stave off a truncated <em>D</em> feeling. </p>
      <p>Just musing out loud.</p>
