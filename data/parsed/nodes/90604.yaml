      <p>John, I think you're painting an overly negative picture.<br>
      I wouldn't talk about desperation in the context of Europe<br>
      currently... Somebody said Euro?</p>
      <p>Ayse, maybe your expectations are too high? This is after all<br>
      a politico-bureaucratic thing. Or maybe you wanted something<br>
      more European, less religious? The shape of such a currency<br>
      symbol might improve outside views of Turkey in the short<br>
      term, but all that would do is delay an honest resolution of real<br>
      differences, which have to be overcome internally first. To<br>
      me alluding to the long and glorious Arabic past of Turkish<br>
      writing can only help. You don't have to be religious (I'm not)<br>
      to believe that.</p>
      <p>Also, I would not rely on handwriting, for two reasons:<br>
      - You're going to get regional variations, plus even in a<br>
      given region it's going to take a while for it to stabilize.<br>
      You don't want to wait a couple of decades just to settle on a<br>
      final country-wide symbol, especially since it could be <em>worse</em>.<br>
      - Whatever casual handwriting produces is only elegantly<br>
      typographic by dumb luck; the typeform derived from such<br>
      a model would probably be either ugly or highly divergent.</p>
      <p>Alessandro, what's "altın oran"?<br>
      BTW, I'm feeling a panel discussion about this at ISType 2012<br>
      coming on. :-)  I'm still trying to figure out a way to make it BTW.<br>
      If I can swing a Moscow connection for my Armenia trip the cost<br>
      of a detour to Istanbul seems to be pretty modest. But the timing<br>
      still has to click just right.</p>
      <p>Andreas, national pride can be quite important... but mostly<br>
      for endangered peoples. In the hands of dominant people it's<br>
      sadly mostly used to get the populace to behave contrary to<br>
      its own good, as happened during WWI.</p>
      <p>&gt; therefore it will undergo substantial<br>
      &gt; transformation or it will vanish.</p>
      <p>What's "substantial"? That's not what I feel happened<br>
      to the Euro. What we see in type is clearly a rendering<br>
      of the original idea. It really doesn't matter that the<br>
      original idea was intended* to be implemented strictly.<br>
      And that actually has its place too, like as decoration<br>
      on buildings. In fact it's better to start with something<br>
      formal and let people deviate; the other way is hopeless.</p>
      <p>* Which I'm not sure was the case. There's a<br>
      difference between what politicians say versus<br>
      what they think should happen. And if they had<br>
      said "this is just a suggestion of how it should<br>
      look" <em>then</em> we might have seen some substantial<br>
      changes (and you don't want too much deviation).</p>
      <p>&gt; you can always go and furnish 20A4 with any glyph you like</p>
      <p>Overloading that slot would only confuse. That's almost<br>
      as bad as re-using the sputnik (the generic currency slot).</p>
      <p>&gt; Syria as an Arabic writing country the slot 20A4 is of no interest</p>
      <p>That's an over-simplification - you could be writing about<br>
      the Syrian currency in a Latinate language. And if I'm not<br>
      mistaken the Syrian currency notes have an English side.</p>
      <p>&gt; Is there any political message in this official announcement</p>
      <p>Explicitly: unlikely. Implicitly: definitely. :-)<br>
      Although it's possible that the Armenian Dram's recent<br>
      incorporation into Unicode was a trigger, something like<br>
      this would never get off the ground unless there was a<br>
      political message. And the only message that seems to<br>
      make sense here is "we don't really need Europe"; and<br>
      in that context the new mark pretty much <em>had</em> to have<br>
      a non-Latin skew.</p>
      <p>hhp</p>
