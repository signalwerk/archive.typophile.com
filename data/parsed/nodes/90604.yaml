      <p>The crossbar was parallel to the baseline in the winning entry but revised later by the in-house designers of Central Bank of Turkey.</p>
      <p>Apart from the need to symbolize growth and rising prestige, another motivation for the revision, in my opinion, might be the fear of a resemblance to the Christian cross (which would be even more significant with a single line crossbar).</p>
      <p>It has also been criticized by some to be the rotated copy of the Armenian currency sign (<a href="http://en.wikipedia.org/wiki/Armenian_dram_sign" title="http://en.wikipedia.org/wiki/Armenian_dram_sign">http://en.wikipedia.org/wiki/Armenian_dram_sign</a>).</p>
