      <p>Well, we <em>have</em> increasingly seen some gestures of<br>
      empathy... and even if those are probably mostly<br>
      a ruse to gain Western acceptance (as with the<br>
      switch to the Latin alphabet) the allusion remains.</p>
      <p>Mostly though I think it's too subtle to really be<br>
      actionable by anybody besides extreme nationalists.</p>
      <p>&gt; I suppose using the Arabic script as a source<br>
      &gt; of inspiration is right out for political reasons.</p>
