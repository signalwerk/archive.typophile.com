      <p>Regarding the top serif, it seems to me the primary relation of the sign is to the <em>L</em> for “Lira”, so the top serif treatment might as well follow that.</p>
      <p>I don’t think the starting point for the lower curve should be so much a turned <em>P</em>. Since the official spec derives from the quarter circle, I think you need to look at the “circular” elements in a face, primarily the <em>O</em> — which naturally leads to the <em>D</em>, which is already a half rounded form with a straight left stem. So, I think the lower curve could probably derive from general pattern of the <em>D</em>. </p>
      <p>(Obviously, there is usually a close relation between the <em>P</em> and <em>D</em>. So maybe I’m making a trivial distinction, since neither is usable outright.)</p>
      <p>Now, what happens with the terminal of the truncation — the anchor fluke — that’s where the interesting design happens. And I expect this element will be the most variable, echoing the more salient aspects of any particular design’s “style.” Will it admit of a ball terminal, for instance? There’s an intriguing question.</p>
      <p>I expect the treatment of horizontals will be driven by the proportion of the other elements and the targeted size and display environment.</p>
