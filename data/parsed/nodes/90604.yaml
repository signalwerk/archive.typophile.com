      <p>And who's to say an out of favor currency may not be revived at some point in the future by a regime looking to evoke a more glorious past. Although a bunch of European currencies had a stake thrust through their hearts with the introduction of the euro, who's to say Count Drachma (for example) won't come back from the grave? :-)</p>
