      <blockquote><p>I think we have seen consensus that the top of the vertical bar should have the same serifs as the capital L though.</p></blockquote>
      <p>For argument's sake here's some dissent on that point:</p>
      <p>1) The glyph retains sufficient "L-ness" regardless of the serif treatment there. What that bilateral serif may do most is not lend "L-ness" but lend "capital-ness" to the glyph, but there is no pressing reason to associate the lira symbol with the majuscules, is there?</p>
      <p>2) A unilateral (to the left) serif treatment at the top makes visual room for the rising crossbars, which the original proposal specifies as longer on the right and higher than many of the serif-topped proposals have them.</p>
      <p>3) Settling on the top first may be constraining options as we work out the problems of the other parts of the glyph. The truncated thick stroke at the end of the curve in the John Hudson design perhaps needs some terminal, such as you might find on a /G/, but the busyness of the glyph kept him from using serifs there. Could a different solution on top make serifs possible? If there's no serif on the right side of the stem at the top, the crossbars can be higher and a G-like serif can have more room. At the same time, a unilateral serif means just less ink overall, and less visual clutter with the crossbars right of the stem. And if it is an angled serif on the left, being closer to parallel with the crossbars should also make the glyph less busy. (Though I suppose that angle might vary with the angle [if any] of the ascender serifs in the typeface?)</p>
