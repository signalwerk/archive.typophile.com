    html: |-
      <p>So I did some thinking, and some rough sketching, and came up with:<br>
      - Three ways to do the top.<br>
      - Four "essential" terminal styles.<br>
      - Seven ways to handle the critical bottom-left.<br>
      - Two ways to modulate the bottom.<br>
      - And two ways to connect the bottom to the terminal.</p>
      <p>To narrow down the permutations, here are ideas I'm getting comfortable with:<br>
      - The glyph should be a cross between caps and numerals.<br>
      - The best place to make it look like a capital is the top.<br>
      - The best place to make it belong with the numerals is the terminal.<br>
      - The bottom-left must have a singularity, probably a serif (but not a [closed] loop).<br>
      - The bottom "stroke" should be thin (assuming contrast), not least because I'm a fan of "rationalist" stroke contrast in the numerals anyway.<br>
      - Attaching an up-curving form immediately at the bottom of the stem is no good.<br>
      - The structure should be able to accommodate narrowness.</p>
      <p>I'm starting to see two overall strategies to combine everything:<br>
      - Very conservative, where I'm ending up with something like what John first showed, and Kent just showed. Although it's solid, it also feels like a lost opportunity.<br>
      - Something akin to Craig's "rocker bottom" version, but less flamboyant (and with capital serifs up top). I think curving the bottom might be the key ingredient to making this click.</p>
      <p>If this all sounds too detached from the making of glyphs, sorry, this is how I roll. But now I <em>am</em> ready to make glyphs.</p>
      <p>hhp</p>
