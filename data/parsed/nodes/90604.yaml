      <p>@Andreas:<br>
      <cite>For some good reason the international character set is not intended to present propagandistic logos or whatsoevers launched by governments to illustrate their pride.</cite></p>
      <p>While I can support the <em>sentiment</em>, since pride and vanity are exaggerated in the types of autocratic government I dislike, it's not particularly unusual for any given country to have a distinctive symbol for its currency unit. Many do; others, in the past, have declined to do so because of economic factors.</p>
      <p>Now that type doesn't have to be molded from metal, now that it is "soft", so that a new character which would obsolete a manual typewriter places no one's laser printer in jeopardy - poorer countries, which had to make do with hand-me-down type from other nations want their own symbols finally for their currencies.</p>
      <p>This to me isn't the destructive evil pride of some preening militarist - rather, it is the desperate pride of those who struggle to maintain dignity while in poverty. That's something I am inclined to support rather than deprecate.</p>
