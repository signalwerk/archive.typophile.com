      <p>I agree with Kent regarding the top serifs: this should refer to the L in the same typeface, in the same way that the treatment of the yen symbol refers to the Y.</p>
      <blockquote><p>I don’t think the starting point for the lower curve should be so much a turned P. Since the official spec derives from the quarter circle, I think you need to look at the “circular” elements in a face, primarily the O — which naturally leads to the D, which is already a half rounded form with a straight left stem. So, I think the lower curve could probably derive from general pattern of the D</p></blockquote>
      <p>I think a <em>turned</em> P -- sic, actually inverted -- would be very wrong. What I did for the Cambria signs was to take the lower right portion of the P bowl and modify it to flow into the serif construction of the bottom of the 'L' stem, i.e. actually making it <em>less</em> round. I think making it more of an arc of a circle is a mistake unless the design of the typeface already includes such forms in some way. Kent suggests referencing the D instead of the P, but in my types the D and the P usually reference each other, and the P is proportionally a better match for the Turkish lira sign.</p>
      <p>What I think is important is that the arrangement of stroke modulation in the sign should reflect that of the rest of the typeface, in order to maintain a sense of stability -- surely desirable for a currency --, and that it makes sense to make use of the same construction as used elsewhere in the design in similar situations of transition from horizontal to vertical bowl segments. Because of the bars extending to the right, I also think it is important to keep the terminal of the upturn quite simple and not too high, with a good amount of clearance between it and the bars without the latter being placed too high on the stem. What I did in Cambria is to optically centre the crossing of the two bars on the vertical stem, and to roughly align the top of the upturn with where the lower bar emerges on the left side of the stem. This seems to me to be the sort of handy rule that suggests a general model.</p>
      <p>There will, of course, be plenty of room for more flamboyant designs, as there is for any glyph, especially in display types, but what is needed at this point is a kind of 'basic construction model' that can be applied to as wide a range of styles of type as possible and produce harmonious results that fit well with the other glyphs, especially the numerals. This is the approach that various people took to the euro symbol when it was instroduced:notably Linotype, who had the largest library of fonts in the target market that needed updating, and who produced a euro symbol design guide that we found produced suitable results for all but an idiosyncratic handful of the 500 fonts that we were hired to extend. Indeed, so good was Linotype's basic construction model for the euro symbol that Adam was able to semi-automate the production of new euro symbol glyphs from elements of existing glyphs, which I had only to fine tune. To me it simply makes sense that the best way to ensure that a new sign harmonises with an existing design is to reference the construction of like-elements in that design. It also accords with my belief that once one has established a core set of glyphs with characteristic shapes and constructions, the rest of a typeface should mostly design itself, and my job is careful refinement of proportions and spacing, not endlessly wondering what shape something should be.</p>
