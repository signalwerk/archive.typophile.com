    html: <p>Well, as much as I don't think Rotis (et al) such a good idea ... it might be exactly what you need for this project. Just playing with it I've found all iterations--serif, semi-serif, sans, semi-sans--might really work. The serif structure, or lack of it maybe, in your logo doesn't work with a didone, transitional or mechanic style serif.</p>
