    html: |-
      <p>Gradiate, </p>
      <p>given the limitations described above, a suitable solution for you, of course, would be to use a rendering algorithm that creates circles that snap to those UPM units perfectly. Since 1 UPM unit in the font corresponds to 1 PostScript point in Illustrator/EPS, the halftoning algorithm that you’re using should only render the circles so that they’re 2, 4 6, 8, 10 etc. points wide (in diameter) and their centers should sit exactly on integer coordinates as well. </p>
      <p>A.</p>
