    html: |-
      <p>When Andreas says “1000 points per glyph”, he means “1000 point coordinates”. Point coordinates in outline fonts must be integer, i.e. you can place a point at the coordinate (150,20) or (151,20), but not anywhere in-between. In other words, outline points are always placed on an invisible grid. </p>
      <p>The UPM (units per em) size in Font Info controls the “fineness” of this grid. By default, you get 1000 grid units per glyph, but you can increase it to 2000, 3000, 4000 or even (max.) 16,000 grid units per glyph. </p>
      <p>However, PostScript Type 1 fonts or OpenType PS fonts cannot have the UPM size larger than 4000 (effectively), while TrueType fonts can go up to 16,000. </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
