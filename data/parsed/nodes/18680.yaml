    html: |-
      <p>Todays font technology is not suited to handle such a massive amount of paths. It will slow down every font rendering engine and will turn into mysterious software crashes.</p>
      <p>I would limit the amount of points to 1000 per glyph. </p>
      <p>A.<br>
      1000 points = 250 dots = 15x16 dot matrix (15x16 pixel source bitmap graphic)</p>
      <p>Maybe you can shift this value a bit.</p>
      <p>B.<br>
      1200 points = 300 dots = 15x20 dot matrix (15x20 pixel source bitmap graphic)</p>
      <p>To get more resolution in FontLab you should use an other font UPM size (usualy 1000em). Try 4000,6000 - maximum is round about 16000 or so.</p>
      <p>An other trick is to use more glyph cells for one illustration. So you can enlarge the grid. On example A, two glyphs give you a dot grid of 30x16 (2x(15x16)).</p>
      <p>—<a href="http://www.astype.de" target="_blank">astype.de</a>—</p>
