    <p>Hello</p>
    <p>Found this lovely old masthead font from an archive image of a French invoice apparently dated 1914...<br>
    <a href="http://olddesignshop.com/2012/02/free-vintage-image-french-invoice/" title="http://olddesignshop.com/2012/02/free-vintage-image-french-invoice/">http://olddesignshop.com/2012/02/free-vintage-image-french-invoice/</a></p>
    <p>Interesting detail with the diamond 'Q' tail and the relatively squashed bowl on the 'U'...</p>
    <p>Any clues or references?</p>
    <p>many thanks!</p><div class="imageWrap"><img src="http://typophile.com/files/OldDesignShop_FrenchReceiptAug1914_whole_6727.gif"></div><p></p>
