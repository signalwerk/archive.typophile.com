      <p>The ampersand is the clue here: this is a variation of Copperplate, and as Don said, most likely hand-engraved:<br>
      <a href="http://www.myfonts.com/fonts/linotype/copperplate-gothic/" title="http://www.myfonts.com/fonts/linotype/copperplate-gothic/">http://www.myfonts.com/fonts/linotype/copperplate-gothic/</a></p>
      <p>Widen Engraver’s Gothic a bit, and it might also work (though it has a distinctly different ampersand):<br>
      <a href="http://www.myfonts.com/fonts/paratype/engravers-gothic/" title="http://www.myfonts.com/fonts/paratype/engravers-gothic/">http://www.myfonts.com/fonts/paratype/engravers-gothic/</a></p>
