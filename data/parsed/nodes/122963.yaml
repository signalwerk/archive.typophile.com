  - id: 598653
    user: 205259
    date: 2015-02-01T15:31:00
    date_raw: 1 Feb 2015 — 3:31pm
    votes: null
    html: |-
      <div class="comment-spam-body"><p>Copperplate Gothic was designed by Frederic W. Goudy for ATF in 1901. The condensed versions shown in my 1923 ATF type book are a good match for the digital ones now available from Linotype <a href="https://www.myfonts.com/fonts/linotype/copperplate-gothic/" title="https://www.myfonts.com/fonts/linotype/copperplate-gothic/">https://www.myfonts.com/fonts/linotype/copperplate-gothic/</a><br>
      I have not checked the earlier ATF books, but I expect that the condensed versions were offered before 1914 and would probably have been a familiar face to the French Engraver.<br>
      Clip the mini serifs and Voilà!<br>
      Don</p>
      </div>
