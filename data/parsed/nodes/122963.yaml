      <div class="comment-spam-body"><p>Looks like engraved letters. Most of the documents of this type from the era were not typeset.<br>
      For a substitute, without the special _Q_ think about a squarish  sans serif. Perhaps Meta <a href="https://www.myfonts.com/fonts/fontfont/ff-meta/" title="https://www.myfonts.com/fonts/fontfont/ff-meta/">https://www.myfonts.com/fonts/fontfont/ff-meta/</a><br>
      Don</p>
      </div>
