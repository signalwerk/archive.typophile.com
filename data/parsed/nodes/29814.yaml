      <p>The Juliana used in the book was digitized by David Berlow of the Font Bureau. Please contact the Font Bureau directly concerning their plans to release the font. I can tell you they have done a fine job, and I look forward to seeing it used by discriminating designers. In the meantime, you can see the font at work in the book: copies are still available. </p>
      <p>Best,</p>
      <p>Paul</p>
