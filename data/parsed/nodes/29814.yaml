    <p>Inferno Press is please to announce -- after two years' work -- the publication of <strong>Sem Hartz and the Making of Linotype Juliana</strong>. This is the first book dealing exclusively with the design and development of one of the most elegant -- and overlooked -- typefaces of the twentieth century.</p>
    <p>Frustrated by the dearth of information about Hartz in English, Inferno Press commissioned Mathieu Lommen, a curator at the Special Collections Department at the Amsterdam University Library and friend of Hartz, to write the story of the design of Linotype Juliana. Lommen's text has been laser-printed on archival paper using a newly digitized version of Juliana. In fact, <strong>this will be the inaugural appearance of this font</strong>. Photographic reproductions of Hartz's early drawings for Juliana are tipped in, and the cover is letterpress-printed on a Nepalese Lotka paper (various colours). 8 1/4 by 5 inches. 15 pages. 100 copies. Stitched into soft covers. Price C$40. North American orders add C$5/copy. Elsewhere add $7/copy. Dealer discounts available. For more information, and an image of the cover, please visit Inferno Press's website at <a href="http://infernopress.blogspot.com">http://infernopress.blogspot.com</a>.</p>
    <p>Books may be ordered directly from the Press by email  or by calling 604 731 6365. We accept payment from PayPal accounts, international money orders or (in Canada) personal cheques. Cheques must be made out to Paul Razzell.</p>
    <p>Our address is</p>
    <p>INFERNO PRESS<br>
    1857 West 4th Avenue, No. 227<br>
    Vancouver, B.C., V6J 1M4<br>
    Canada</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/Hartz%20cover.jpg" width="198" height="320" alt="">
