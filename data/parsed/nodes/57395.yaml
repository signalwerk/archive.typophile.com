      <p>@sii - to be honest, i was confused by his post...</p>
      <p>Confused? Well, there is an inverse relationship between the font(s) we think of as highly readable in high resolution text, and the font(s) we are force-fed because they are easy to render at low resolutions.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/frosty2_4480.jpg"></div><br>
      See here? Serif font, traditional sans, simplified sans and seriously simplified sans. The simplified sans, of which we speak, developed in reaction to the middling resolutions of early laser printers. Then, when these fonts worked well enough with 1/2 hinted anti-aliasing for screens, well, there was 'no reason' to consider any more broad design needs from technology. X hints? who needs em, if OSs can get by with one such font. . .  But now, users want hundreds of styles to work at all sizes and resolutions, everywhere. <p></p>
      <p>What to do? Sheep love Trebuchet, Verdana and Lucida anything — wolves roam.</p>
      <p>Cheers!</p>
