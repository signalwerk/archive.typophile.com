    html: |-
      <p>It isn't an error so long as both Unicode characters are appropriate to the glyph. I have plenty of fonts with double-encoded glyphs, and even a few triple-encoded. You should bear in mind that some of FontQA's messages represent the in-house production preferences of a particular font foundry. I prefer Font Validator, which checks against the OT font spec, rather than against particular choices made from among equally valid options.</p>
      <p>The only reason why you would deliberately want to avoid double-encoding is if you were aiming to provide a single path from glyph name to Unicode, which is something that Adobe and some customers like because it enables reconstruction of text strings from raw glyph IDs in PDFs distilled from print streams. But this is a particular application issue, and not a font format requirement.</p>
