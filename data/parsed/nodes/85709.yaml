    <p>I found an error in my font when I tested it with FontQA. It showed me that I had some glyphs that had somehow picked up double unicode names.</p>
    <p>When I click the magic emerald next to the Unicode name field in the rename glyph pop-up window, it actually makes both names appear!</p>
    <p>I can't find any way to fix this problem, or know what has caused it.</p>
    <p>Can anyone please help?</p>
