      <p>@ John - you're right.</p>
      <p>For some reason when I fixed a couple of other errors tonight, this error went away, so aparently FontQA no longer cares if I have double encoding.</p>
      <p>I have now gotten FontQA to come up with no more errors. I feel great.</p>
      <p>I plan on using Font Validator too. As soon as I install Windows on my bootcamp system on my mac.</p>
      <p>Thanks for your help.</p>
