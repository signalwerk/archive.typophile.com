    <p>Hi,</p>
    <p>I'm currently writing an essay which includes some short case studies of typefaces. I would like to include Didot as one of them but I cant seem to find out that much information about its history. </p>
    <p>I already know some bits about the typeface and its designer but I'm struggling for its context really - I dont know anything about what else was happening at the time and  what made both didot and bodoni both design such similar typefaces at similar points in history?</p>
    <p>Thanks for any help, Rick</p>
