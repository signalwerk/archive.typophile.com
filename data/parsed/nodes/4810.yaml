    html: |-
      <p>Indeed; computer screens used a slashed zero back when they used a 5 by 7 dot matrix to display monospaced characters using character generator circuitry. Even when a somewhat higher resolution was used on the IBM PC, zeroes were still slashed in DOS.</p>
      <p>When they instead wrote characters that looked like type on a graphic screen (such as on the Macintosh, and then on PCs with Microsoft Windows, OS/2, GEM Desktop, or GeoWorks Ensemble) then a slashed zero would not be used.</p>
    html_clean: |-
      <p>Indeed; computer screens used a slashed zero back when they used a 5 by 7 dot matrix to display monospaced characters using character generator circuitry. Even when a somewhat higher resolution was used on the IBM PC, zeroes were still slashed in DOS.</p>
      <p>When they instead wrote characters that looked like type on a graphic screen (such as on the Macintosh, and then on PCs with Microsoft Windows, OS/2, GEM Desktop, or GeoWorks Ensemble) then a slashed zero would not be used.</p>
