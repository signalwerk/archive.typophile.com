    html: "<p>&gt; Clearly the Scandinavian lobby won. <br> <br>:-&gt; <br>I'm a sucker for explicit divergence for legibility, but the slashed zero seems too... brutal. <br>And yes, potentially confusable with the O-Slash! So maybe a nestled dot is better. <br> <br>But then there's something else: this is a \"deliberative\" issue, meaning that when there's potential confusion the reader has all the time he needs to figure out if it's an Oh or a Zero. So if you diverge the glyphs in more subtle ways (like through height, width, or squareness) you can really solve the problem 95%, without \"brutality\". <br> <br>A serious problem however is an old-style Zero that's too much like a lc oh. The usual solution -making it a \"perfect\" circle- is just pukey to me. So reversing the stroke contrast (which makes sense in the context of the numerals in general), or giving it weight only on one side, and/or using hybrid nums (taller than x-height) is better, I think. <br> <br>&gt; Georgia? <br> <br>But the <i>original</i> Georgia nums (hybrids), not the later -tamed- ones. <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; Clearly the Scandinavian lobby won. <br> <br>:-&gt; <br>I'm a sucker for explicit divergence for legibility, but the slashed zero seems too... brutal. <br>And yes, potentially confusable with the O-Slash! So maybe a nestled dot is better. <br> <br>But then there's something else: this is a \"deliberative\" issue, meaning that when there's potential confusion the reader has all the time he needs to figure out if it's an Oh or a Zero. So if you diverge the glyphs in more subtle ways (like through height, width, or squareness) you can really solve the problem 95%, without \"brutality\". <br> <br>A serious problem however is an old-style Zero that's too much like a lc oh. The usual solution -making it a \"perfect\" circle- is just pukey to me. So reversing the stroke contrast (which makes sense in the context of the numerals in general), or giving it weight only on one side, and/or using hybrid nums (taller than x-height) is better, I think. <br> <br>&gt; Georgia? <br> <br>But the <i>original</i> Georgia nums (hybrids), not the later -tamed- ones. <br> <br>hhp <br></p>"
