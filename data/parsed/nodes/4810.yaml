  html: <p>Just a quick rant. When was it decided that digital type on a screen would no longer use the "slash-o" to represent a zero? <br> <br>I'd like to petition typographers in general to bring back the slash-o numeral zero. It would save me countless hours trying to decipher passwords and user log-ins. Good typography is usually related clarity. Let's clarify our zeros and ohs! <br> <br>:o)</p>
