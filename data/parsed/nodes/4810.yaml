    html: <p>"So maybe a nestled dot is better." <br> <br>The Scandinavians have a point, and I was actually thinking the same thing, HRANT. Perhaps a dot in the center of the zero is what we need. <br> <br>"you can really solve the problem 95%, without "brutality"." <br> <br>Well, the problem really only manifests itself when you're mixing letters of various cases with numerals. The common places this happens is in URLS (0sil8.org), Password/logins (Hol107L), software serial numbers, and programming languages. So, the problem is primarily online, where the subtle ways may simply not work. <br> <br>The slash-zero was designed specifically for computer use (I think...) and I find it odd that it dissappeared while computer use was actually increasing. <br> <br>Of course, there's also the l/1 issue, but we'll save that for another day...</p>
