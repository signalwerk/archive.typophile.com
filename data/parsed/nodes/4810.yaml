    html: <p>When I worked in a library while in college back in the 1980s, we had a typewriter with a large point size, specifically for making call-number labels for book spines. The 0 (zero) was full height, as were all the digits. The lower-case o was x-height. And the upper-case O had a loop at the top right, as if it were handwritten and was about to be connected to the next letter.</p>
