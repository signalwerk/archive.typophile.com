    html: <p>Could you elaborate on why you don't think it's clear-cut? If someone is due credit aren't they are due compensation? The OP is asking about rote copying. This is not a conversation about homage, influence, reference, or revival (all very different conversations). The question posed was "Is it appropriate to copy someone's work?". Legally, no problem. No one will care. It's such a small project that even if someone did care it wouldn't be worth pursuing. But ethically? Do your own work. Have respect for the work your peers have done and don't copy it.</p>
