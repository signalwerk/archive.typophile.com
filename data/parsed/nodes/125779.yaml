    html: "<p>This isn't about being \"inspired\" by something—the OP is asking about the rote copying of an existing design. As I've already said: \"this is not a conversation about homage, influence, reference, or revival (all very different conversations)\". In my opinion, giving someone credit for something you stole from them is insulting. Would it be okay for me to make a rote copy one of your works as long as I gave you credit somewhere for compensation? Of course not. Can I copy a book design someone already did as long as I give them credit? Of course not. This is a needlessly reductive line of questioning, but I fail to see how you can make an argument for copying another designer's work. To belabor this point: the OP asked (in a post tagged \"ethics\") is it inappropriate to copy someone's work? He is not asking about being inspired by or taking influence or inspiration from. The OP did not read the text and come to similar conclusions as the other designer. The OP has only used the words \"copy\" and \"replicate\" not \"inspiration\", \"influence\", or any other word that might come with a modicum of ambiguity. The words we choose are important. It is not ethical to copy someone's work regardless of credit given.</p>"
