    html: <p>This is terrible advice. I lurk these forums, but this comment (and the implications of the original post) are startling and no one else has spoken up. The original designer was paid by the publisher to do a layout for a specific edition of a book, not the book that you are being paid to layout. Only the rights for the content of the book are reverting back the author—not the rights for anything else (cover, interior layout, etc). Likely, the author never owned the rights for any of that. You are being paid to layout this ebook, not the previous designer. Is it ethical to copy someone else's work? No, of course not. If you had to ask you probably knew this instinctively. Is it ethical to copy someone else's work, get paid for it, and give a credit to the person you copied even though they haven't been consulted or compensated?</p>
