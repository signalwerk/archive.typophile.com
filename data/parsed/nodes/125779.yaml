    <p>I wish Typophile had been revived a year ago when this came up for me, but the question is relevant again.</p>
    <p>I’m doing e-book layout for a series the author is reissuing after rights reversion. Is it inappropriate for me to copy design decisions made by the first-edition typographer, like chapter-heading fonts and section-break fleurons? (With credit, of course; something like, “Typeset by Joel C. Salomon; original layout by Sam Designer”.) The first-edition designer was hired by the (now-defunct) publisher, not the author, if that matters?</p>
    <p>How say you?</p>
