      <p>&gt; the 3,4,5 are not dropped but ascend?</p>
      <p>That's the old-school (19th century) French style, which De Vinne once called "a novelty that failed to catch on". As far as I'm concerned it's worth reviving (or at least thinking about, which too few designers do, even accomplished ones) actually because they fit better with the Cartesian usage of the lowercase; in the conventional alignment scheme you're more likely to end up with a numeral string that seems to sit too low.</p>
      <p>&gt; differentiation might be improved if the 3 and 5 were not so similar in width</p>
      <p>That's a good point.<br>
      And making one ascending and the other descending might be ideal.</p>
      <p>&gt; someone put a couple of 1’s back in the wrong case</p>
      <p>Good eyes! What's interesting though is that the tabulation was maintained aligned. Maybe all (or a bunch) of the IN's fonts had all their numerals of the exact same width - smart, since wrong-sort situations (more probable with numerals than alphabetics) wouldn't throw a wrench into composition.</p>
      <p>hhp</p>
