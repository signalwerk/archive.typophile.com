      <p>For me the general reasoning is to keep the figures from looking out of place either with each-other or with text.<br>
      I tend to agree with Paul on the proportional categories but wonder if this is just a matter of visual adjustment to make them all feel like a set.  Figures like 8 have a lot going on so they can look like a dark spot in a line of text.  That is why they should be widened, not just to fit some classification scheme.  Three should be narrower because it is not closed. The difference in horizontals of 5 and seven is a question of how much is going on in the rest of the figure.  You wouldn't want a wide horizontal on the 5 to make it topple as top heavy where as the 7 needs something to hold that very long diagonal.</p>
      <p>ChrisL</p>
