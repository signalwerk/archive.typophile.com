      <p>I'd say (in order of width) 1, 5, 3, {8, 0}, {6, 9}, {2, 7, 4}. In particular, I like the horizontals of 2, 7 and 4 to be relatively long, and I think the commonest fault is to make 3 and 5 too wide. Especially 3, which often seems to end up much too large. I like the way that in the older typefaces the lower curve on 3 and 5 is distinctly not the same shape as the circular curves on 8, 0, 6 and 9, and the horizontal of the 5 distinctly not the same length as the horizontals on 2, 4 and 7.</p>
      <p>Personally also I like the completely unmodulated 0: the pure circle. I know people find this "stands out", and want to give it some modulation. But it seems to me to be perfectly functional and to have a certain satisfactory symbolic quality.</p>
