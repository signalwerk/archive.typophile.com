      <p>"...what purpose do “old-style” numerals actually serve?"</p>
      <p>Terry,<br>
      Each style of figures has a purpose. Monospaced are needed for tabular uses; proportional lining are good in text where you want numbers to be prominent (phone directories, business cards, etc.). So called "oldstyle" is best for running text where you don't want figures to pop and become obtrusive. What you have to think about when designing a typeface is what your users/customers will require and see as a plus in their purchase decision making. Even if you feel comfortable not using oldstyle in your work, your users probably will.  Remember, people who actually BUY type are more likely to use it at its fullest and want their options open.  This assumes you are talking about a text face.  It is less true for display and not needed for signage.</p>
      <p>BTW, How is life (and work) in San Francisco?</p>
      <p>ChrisL</p>
