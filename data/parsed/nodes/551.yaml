    html: "<p> Thank yo all,first. <br>Indeed some typefaces look nice and appropriate.  Unfortunaytely, I only have Base12 so this was the only one I could actually try out on package and on the brochure...still I don't feel it as belonging there.Out of all, Fago is the most promising,  I like it, just that I don't have it.(to me it looks a lot like Officina, I guess I could try it instead?). <br> <br>P.S. I was perusing my fonts collection and there are two problems raising here: <br>ATM displays an error message  to some of them: \"font files are invalid or corrupt\" is there anything left to do to fix that? <br>and second: I have 38.000 typefaces so far and only a small  percentage of all have eastern european characters. Could I myself add these characters to a T1 font and output it is as a TTF for a client, as long as the client gets  a licence for the T1 font? - ITC Binary is not available with EE encoding... </p>"
