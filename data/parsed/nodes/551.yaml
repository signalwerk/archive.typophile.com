  date_raw: 1 May 2002 — 11:52pm
  votes: null
  html: '<p> Hello you all, <br> <br>This is my second posting here and it has to do with the extent to which I see typefaces of the Thesis family (by Luc(as) de Groot - lucasfonts.com) used worldwide today. A customized version of "The Sans" is the worldwide corporate typeface for Compaq. I have recently seen The Mix used on the website some four design companies... I have also seen typefaces of the family included in the standards manuals of some big universities and colleges in USA. Well, it seems to me Thesis is becoming more and more trendy, following Rotis and Meta... <br> <br>So, as a result, I was wondering what apropriate similar typeface could I suggest to one of my clients, who wants to use a dual typographic scheme The Sans/The Mix ( by similar, I mean: modern yet not lacking the "established" feel, highly legible on several applications, and still retaining a strong personality of its own...). <br> <br>The client is a BackStreme, a software company, producing proprietary software algorithms for data routing and data compression. <br> <br>Thank you all, <br>George </p>'
  html_clean: '<p> Hello you all, <br> <br>This is my second posting here and it has to do with the extent to which I see typefaces of the Thesis family (by Luc(as) de Groot - lucasfonts.com) used worldwide today. A customized version of "The Sans" is the worldwide corporate typeface for Compaq. I have recently seen The Mix used on the website some four design companies... I have also seen typefaces of the family included in the standards manuals of some big universities and colleges in USA. Well, it seems to me Thesis is becoming more and more trendy, following Rotis and Meta... <br> <br>So, as a result, I was wondering what apropriate similar typeface could I suggest to one of my clients, who wants to use a dual typographic scheme The Sans/The Mix ( by similar, I mean: modern yet not lacking the "established" feel, highly legible on several applications, and still retaining a strong personality of its own...). <br> <br>The client is a BackStreme, a software company, producing proprietary software algorithms for data routing and data compression. <br> <br>Thank you all, <br>George </p>'
