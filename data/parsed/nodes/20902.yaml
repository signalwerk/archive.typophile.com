      <p>There’s also a line between process and result. The process honestly followed is always a learning process. If you have faith in yourself the results take care of themselves and are not something to be contemplated or gloated over once done. I try to just let it go and move on to the next process, which for me is the only part that matters.</p>
      <p>The more I know the more I don’t know…</p>
      <p>peace</p>
