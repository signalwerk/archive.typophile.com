      <p>Yeah interesting points about learning processes.</p>
      <p>Perhaps a slight digression ...<br>
      I have reached a stage of my visual design career, where I now feel I HAVE to focus more on the process, the experimentation, the discovery of ideas and solutions that may not have been discovered whilst thinking “we’ve only got THIS time to produce a (e.g) financial report” or “the client has given us examples of what they’d like” - until now I believe my understanding of brief delivery and interpretation has existed within a kind of bubble. It’s bursting that bubble ... I think ... that holds truly good ideas and truly rewarding results for a career I love.</p>
      <p>Basically ... the future is bright, adn bright is exciting.</p>
      <p>:)</p>
      <p>—————<br>
      <strong>Paul Ducco</strong><br>
