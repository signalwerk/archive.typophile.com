      <p>Thinking you know it all is a bad trait in any kind of person. If you cannot question yourself, you are capable of some scary things…</p>
      <p>Deep down I don’t think anyone really thinks that anyway, it’s primarily a defense mechanism for insecuriity. The problem is if you think you know it all you may never realize what the real problem is.</p>
      <p>The ego and insecurity are forever bound…</p>
      <p>To a large degree I think that’s what the dance called design is all about.</p>
      <p>peace</p>
