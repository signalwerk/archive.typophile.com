      <p>My ex-boss is a great example for this thread...<br>
      He used to stretch a Helvetica Black Condened to 200% instead of using Helvetica Black Extended. He used RGB-images at 72 dpi &amp; blew them up to somewhere between 150 &amp; 200% (in Quark, not changing the image size in Photoshop). It’s a miracle the company survived so long ;-)<br>
      At one point, I started keeping a log of all the things he f*cked up, but after only a few days I had to give that up because it was far too time-consuming.<br>
      Oh, and he always used the bold/italic/...-“styles” instead of the proper fonts. Any idea how ugly a bold, italic University Roman looks like?</p>
