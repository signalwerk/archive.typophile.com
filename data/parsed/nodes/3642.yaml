    html: <p>Thanks for the praise, after a week away from it I'm starting to see a clearer conclusion to this one. <br> <br>Anyway, assuming that I am able to successfully finish it as a PSD, do you know of any foundries that work with pixel fonts that are semi-anti-aliased such as this one? </p>
