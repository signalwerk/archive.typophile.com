    html: <p>I was going to say it has vague resemblances to City, in relation to your football comment. Whichever way you choose the letterform are all crafted fairly well.  I guess I would just throw a dart(while peeking through)and use the results to map out the rest. <br><br>As a pixel font, I think it is fairy strong. Unique and just another face created in light of our growing reliance on the web. <br><br>jp</p>
