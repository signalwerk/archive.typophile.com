    html: <p>I think that some of the ligatures you are creating are interesting. I like the "AN" at the top.  The second "N" is my favorite.  This looks like it would be used to reference art deco.  <br> <br>Generally I prefer the versions with a wider character width. In specific the 2nd "N" and "R", the first "K" and "J".  Within it as a whole I think you need to decide on a set of characters that all go together(26 letters, etc.) and post that so we can all see if they are all working together. It is harder to tell when you have a few variations of each. <br> <br>Im undecided about the outline around each. What are your influences for this typeface? <br> <br>jp</p>
  - id: 27827
    user_id: 1956
    user_name: cpalmieri
    user_path: null
    date_raw: 18 Mar 2004 — 8:38pm
    date: 2004-03-18T20:38:00
    votes: null
    html: <p>Thank you for your thoughts.  <br> <br>I guess I was leaning in the opposite direction that you are suggesting, I've personally been leaning towards the narrow width forms (first "R" second "V" 5th "2"). <br> <br>I haven't hammered out a concrete list of influences, but there seems to be this art deco influence, a cheesy romance or whodunnit novel influence, with a dash of disco, and a dash of football jersey. All of these are kind of imagined though, I have not done any formal research.  <br> <br>Of course I want this thing to be well crafted, but I'm not looking to build a "workhorse". I would rather err on the side of quirky and lowbrow. <br> <br>Also, I realize that at this point I'm giving you too many options, but in the end I was expecting to offer the typeface with many alternates, so that users have a lot of flexibility in creating unique word shapes. <br> <br>Below I've greyed out letters that are either unresolved, or which I can't choose which one I like. The dark black ones, are more or less the foundations of the face. <br> <br><img src="http://www.typophile.com/forums/messages/29/28873.gif" alt="second version"></p>
