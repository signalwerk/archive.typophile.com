  html: <p>This is my first post, and first typeface.  <br> <br>I'm still mid-process, but see the design fracturing into a few different directions and was hoping I could get some feedback about which characters are the most successful at this point, so I can use those as models to finish out the face. <br> <br>Thanks in advance for your advice. <br> <br><a href="http://www.iixii.net/type/">Sample here</a></p>
