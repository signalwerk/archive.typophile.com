    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Font%20Retailers" class="freelinking" rel="nofollow">Font Retailers</a>/<a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Village</strong></p>
    <p>Village is based in the East Village of New York City. It is owned and run by <a href="/wiki/Chester%20Jenkins" class="freelinking" rel="nofollow">Chester</a> and <a href="/wiki/Tracy%20Jenkins" class="freelinking" rel="nofollow">Tracy Jenkins</a> who are type and graphic designers, respectively. The first typeface published under the Village label was <a href="/wiki/Galaxie%20Polaris" class="freelinking" rel="nofollow">Galaxie Polaris</a>, a Modernist sans serif family. Village is the 'house brand' and founding member of the type collective, vllg.com.</p>
    <p>Village is a type co-op; the union of eleven young type foundries who have decided to go it alone, together. vllg.com is the information channel and boutique storefront for this group of equals. The members of the co-op hail from <a href="/wiki/Canada" class="freelinking" rel="nofollow">Canada</a>, <a href="/wiki/Finland" class="freelinking" rel="nofollow">Finland</a>, <a href="/wiki/Germany" class="freelinking" rel="nofollow">Germany</a>, <a href="/wiki/Greece" class="freelinking" rel="nofollow">Greece</a>, <a href="/wiki/Italy" class="freelinking" rel="nofollow">Italy</a>, The <a href="/wiki/Netherlands" class="freelinking" rel="nofollow">Netherlands</a>, <a href="/wiki/New%20Zealand" class="freelinking" rel="nofollow">New Zealand</a>, <a href="/wiki/Portugal" class="freelinking" rel="nofollow">Portugal</a>, the <a href="/wiki/United%20Kingdom" class="freelinking" rel="nofollow">United Kingdom</a>, and the <a href="/wiki/United%20States" class="freelinking" rel="nofollow">United States</a>.</p>
    <p><strong><a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> and <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> represented by Village:</strong><br>
    <a href="/wiki/Feliciano%20Type%20Foundry" class="freelinking" rel="nofollow">Feliciano Type Foundry</a> (Mário Feliciano)<br>
    <a href="/wiki/Joshua%20Darden%20Studio" class="freelinking" rel="nofollow">Joshua Darden Studio</a><br>
    <a href="/wiki/Karsten%20Lucke%20Type%20Foundry" class="freelinking" rel="nofollow">Karsten Lücke Type Foundry</a><br>
    <a href="/wiki/Lux%20Typographics" class="freelinking" rel="nofollow">Lux Typographics</a> (<a href="/wiki/Greg%20Lindy" class="freelinking" rel="nofollow">Greg Lindy</a> &amp; <a href="/wiki/Michael%20Rey" class="freelinking" rel="nofollow">Michael Rey</a>)<br>
    <a href="/wiki/Orange%20Italic" class="freelinking" rel="nofollow">Orange Italic</a> (<a href="/wiki/Christian%20Schwartz" class="freelinking" rel="nofollow">Christian Schwartz</a> &amp; <a href="/wiki/Dino%20Sanchez" class="freelinking" rel="nofollow">Dino Sanchez</a>)<br>
    <a href="/wiki/Thirstype" class="freelinking" rel="nofollow">Thirstype</a> (<a href="/wiki/Barry%20Deck" class="freelinking" rel="nofollow">Barry Deck</a>, <a href="/wiki/Chester%20Jenkins" class="freelinking" rel="nofollow">Chester</a>, <a href="/wiki/Claudio%20Piccinini" class="freelinking" rel="nofollow">Claudio Piccinini</a>, <a href="/wiki/Frank%20Ford" class="freelinking" rel="nofollow">Frank Ford</a>, <a href="/wiki/Magnus%20Rakeng" class="freelinking" rel="nofollow">Magnus Rakeng</a>, <a href="/wiki/Patric%20King" class="freelinking" rel="nofollow">Patric King</a>, <a href="/wiki/Patrick%20Giasson" class="freelinking" rel="nofollow">Patrick Giasson</a>, &amp; <a href="/wiki/Rick%20Valicenti" class="freelinking" rel="nofollow">Rick Valicenti</a>)<br>
