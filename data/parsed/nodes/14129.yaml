    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12066" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font Retailers</a>/<a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a>&nbsp;:&nbsp;Village</strong></p>
    <p>Village is based in the East Village of New York City. It is owned and run by <a href="/node/14133" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Chester</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Tracy%20Jenkins" title="Create node &quot;Tracy Jenkins&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Tracy Jenkins</a> who are type and graphic designers, respectively. The first typeface published under the Village label was <a href="/node/add/wiki?edit%5Btitle%5D=Galaxie%20Polaris" title="Create node &quot;Galaxie Polaris&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Galaxie Polaris</a>, a Modernist sans serif family. Village is the ‘house brand’ and founding member of the type collective,&nbsp;vllg.com.</p>
    <p>Village is a type co-op; the union of eleven young type foundries who have decided to go it alone, together. vllg.com is the information channel and boutique storefront for this group of equals. The members of the co-op hail from <a href="/node/19573" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Canada</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Finland" title="Create node &quot;Finland&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Finland</a>, <a href="/node/19574" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Germany</a>, <a href="/node/31984" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Greece</a>, <a href="/node/19599" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Italy</a>, The <a href="/node/19575" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Netherlands</a>, <a href="/node/19704" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">New Zealand</a>, <a href="/node/20069" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Portugal</a>, the <a href="/node/19577" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">United Kingdom</a>, and the <a href="/node/19571" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">United States</a>.</p>
    <p><strong><a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a> and <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a> represented by Village:</strong><br><a href="/node/14115" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Feliciano Type Foundry</a> (Mário Feliciano)<br><a href="/node/19497" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Joshua Darden Studio</a><br><a href="/node/19919" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Karsten Lücke Type Foundry</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Lux%20Typographics" title="Create node &quot;Lux Typographics&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Lux Typographics</a> (<a href="/node/add/wiki?edit%5Btitle%5D=Greg%20Lindy" title="Create node &quot;Greg Lindy&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Greg Lindy</a> <span class="amp">&amp;</span> <a href="/node/add/wiki?edit%5Btitle%5D=Michael%20Rey" title="Create node &quot;Michael Rey&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Michael Rey</a>)<br><a href="/node/12435" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Orange Italic</a> (<a href="/node/13636" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Christian Schwartz</a> <span class="amp">&amp;</span> <a href="/node/add/wiki?edit%5Btitle%5D=Dino%20Sanchez" title="Create node &quot;Dino Sanchez&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Dino Sanchez</a>)<br><a href="/node/14087" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Thirstype</a> (<a href="/node/add/wiki?edit%5Btitle%5D=Barry%20Deck" title="Create node &quot;Barry Deck&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Barry Deck</a>, <a href="/node/14133" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Chester</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Claudio%20Piccinini" title="Create node &quot;Claudio Piccinini&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Claudio Piccinini</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Frank%20Ford" title="Create node &quot;Frank Ford&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Frank Ford</a>, <a href="/node/15373" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Magnus Rakeng</a>, <a href="/node/28027" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Patric King</a>, <a href="/node/42751" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Patrick Giasson</a>, <span class="amp">&amp;</span> <a href="/node/14790" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Rick Valicenti</a>)<br><a href="/node/add/wiki?edit%5Btitle%5D=Type%20Initiative" title="Create node &quot;Type Initiative&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Type Initiative</a> (<a href="/node/30354" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Keith Chi-hang Tam</a> <span class="amp">&amp;</span> <a href="/node/add/wiki?edit%5Btitle%5D=Michail%20Semoglou" title="Create node &quot;Michail Semoglou&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Michail Semoglou</a>)<br><a href="/node/13509" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Underware</a> (<a href="/node/13510" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Akiem Helmling</a>, <a href="/node/13511" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bas Jacobs</a>, <a href="/node/13512" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Sami Kortemaki</a>)<br><a href="/node/15594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">KLIM</span></a> (<a href="/node/15593" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Kris Sowersby</a>)<br><a href="/node/14129" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Village</a> (<a href="/node/14133" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Chester</a> <span class="amp">&amp;</span> <a href="/node/add/wiki?edit%5Btitle%5D=Tracy%20Jenkins" title="Create node &quot;Tracy Jenkins&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Tracy Jenkins</a>).</p>
    <p><span class="caps">URL</span>: <a href="http://www.vllg.com">http://www.vllg.com</a></p>
