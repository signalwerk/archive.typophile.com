    SHE'S NOBODY'S 'POOL</p>
    <p>TALKING about the misery of Iraq on Sky News's Adam Boulton show, Heather Mills McCartney was her usual self.</p>
    <p>Passionate. Committed. Hard as nails. Fake as a nine-bob note.</p>
    <p>How long has Heather had a Liverpool accent? Was it a wedding present?</p>
    <p>Does she have a pre-nuptial agreement with Sir Paul that means she gets custody of the accent in the event of a divorce?</p>
    <p>Maybe this bolt-on accent is sub-conscious, a way of deepening her bond with hubby.</p>
    <p>I do not know.</p>
    <p>But Heather Mills McCartney is the only person I've ever seen who makes Jimmy Tarbuck look like a soft Southern cissy.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/heathernude_6347.jpg"></div><p></p>
