    html: |-
      <p>The kicker here is that the middle point of the M is short and pointed, while the middle point of the W is short and flat--rare to find the mix in one face.</p>
      <p>FF Fago Monospaced is close, but the Y has a bar at the baseline and the sides of the M are flared. </p>
      <p>As for Whatthefont and Whatfontis, they only work if the font is widely and commercially available (i.e., in those sites' respective databases), the sample is pristine, and the font has a lot of distinctive characteristics. Thankfully, there are people on this forum (not me) who have their finger on the typographic pulse, and one of them is bound to recognize it. </p>
      <p>In the meantime, I will keep plodding away....</p>
