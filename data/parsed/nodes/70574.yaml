    <p>I am on a mac and have cs3 illustator<br>
    I have this 2 letter gray and black logo.<br>
    I want to trap it. So the gray is overlapping the black.<br>
    I took it into illustrator ... selected both letters.. went to pathfinder palette... selected trap on side menu....<br>
    pathfinder trap - thickness .25 pts, height - 100%, tint reduction 40% and pressed ok. it did a lil trap but i need a bigger one on the gray letter. what can i do?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_5716.jpg"></div><p></p>
