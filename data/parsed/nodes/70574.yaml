    date: null
    date_raw: null
    votes: null
    html: "<p>Add a stroke to your PMS 486 the size requested by your printer for the trap. (Remember that the stroke is only half hanging off your shape, so double the thickness of the outline, or set the stroke to 'outside'). Then outline the stroke: object&gt;path&gt;outline stroke. Now duplicate your black object, bring it to the top of the stack, use it to divide the outline (just the outline, using the pathfinder tool), and erase the parts that do not overlap the black. Now you have the trap.</p>"
    html_clean: "<p>Add a stroke to your PMS 486 the size requested by your printer for the trap. (Remember that the stroke is only half hanging off your shape, so double the thickness of the outline, or set the stroke to 'outside'). Then outline the stroke: object&gt;path&gt;outline stroke. Now duplicate your black object, bring it to the top of the stack, use it to divide the outline (just the outline, using the pathfinder tool), and erase the parts that do not overlap the black. Now you have the trap.</p>"
