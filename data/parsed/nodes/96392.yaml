    html: |-
      <p>you can find it as <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/3ip/treefrog/" rel="nofollow">Treefrog</a></strong> by  Brian Willson (Three Islands Press, 1994)<br>
      but I think is actually digitized by Dan X. Solo as <strong>Threadneedle</strong> which is very similar but not an exact match.</p>
      <p>It is also available under at least 4 other different names by well known font forgery companies, which I'd rather not mention.</p>
      <p>-----------------------------------------------<br>
      I found it using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
