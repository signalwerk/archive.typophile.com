    <p>I've created a font in Fontstruct, and cleaned it up in Fontlab.<br>
    However when clicking to preview the font (using the spacebar, after highlighting),<br>
    it shows the 'X' and the 'o' to be missing, even though they are there when loaded.</p>
    <p><img src="http://pix-eu.dontstayin.com/4bf430cd-10d7-4ba8-abcd-fe77ce7b4da8.png" width="543" height="515" border="0"></p>
    <p>How can I correct this?</p>
    <p>So far, I have checked all the surrounding glyphs W,X,Y n,o,p<br>
    and there doesn't appear to be anything obviously wrong.<br>
    No spacing issues.<br>
    No Reversed paths.<br>
    No kerning issues. No kerning pairs.<br>
    No double glyphs (on top of each other).</p>
    <p>I'm really baffled.<br>
    Any help would be appreciated.</p>
    <p>I am on Mac using Snow Leopard 6.8</p>
