    html: |-
      <p>Nippa sent me the font for examination. Here are my solutions to his issues:</p>
      <p>The QuickLook glitch was caused by the following:<br>
      No glyph names in the font (only uniXXXX).<br>
      Solved via: Glyph → Glyph Names → Generate Names …</p>
      <p>The missing ‘ABC’ preview in FontBook was caused by a custom preview string stored in the  table.<br>
      (‘Zephyrs …’)<br>
      FL is not able to remove that reliably, buy you can remove the string in a TTX-dump and re-compile the font.</p>
    html_clean: |-
