    html: |-
      <p><a href="http://sourceforge.net/projects/fonttools/" rel="nofollow">TTX</a> is a command line utility, part of ‘FontTools’ by Just van Rossum.<br>
      I believe it is gets installed with Robofab.</p>
      <p>To decompile a font to XML, you just have to do the following:<br>
      ('fontfile.ttf' being a placeholder for any otf or ttf font):</p>
      <p><code> ttx fontfile.ttf </code></p>
      <p>A 'fontfile.ttx' file will be generated alongside the original font file.<br>
      This file can be edited with a text editor.</p>
      <p>To recompile the font, simply do:</p>
      <p><code> ttx fontfile.ttx </code></p>
      <p>You will end up with an exact copy of your original font file, plus/minus the modifications you made in the TTX file.</p>
