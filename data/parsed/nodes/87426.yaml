    html: |-
      <p>This font has many repeating shapes, it looks like the CFF Sub-Routinization is ‘eating up’ some of your glyphs.</p>
      <p>In the preferences, switch off the option ‘Use subroutines to compress outlines in the CFF table’, found at<br>
      ‘Generating OpenType and TrueType’ → ‘OpenType PS (.otf)’</p>
