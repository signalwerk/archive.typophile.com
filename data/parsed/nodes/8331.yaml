  html: <p>Hello. <br> <br>I am about to start designing a newsletter for an Art Therapy association. This association started in the 80's. Art therapy  started in the US &amp; Europe in the 50'/ 60'. the newsletter will be printed in B&amp;W in laser white paper 80gsm. <br> <br>I'd appreciate suggestions for text faces serifed &amp; unserifed meeting the brief. <br> <br>Thanks in advance</p>
