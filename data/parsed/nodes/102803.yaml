  html: |-
    <p>Hi, </p>
    <p>I'm looking for a typeface with a great Y to represent the Yamaha Musical Instrument Company...just NOT the Y that they use in their logo or anything similar. </p>
    <p>Something that communicates Japanese, for the masses, yet still of quality.  Or if not, just a typeface with a really beautiful Y. </p>
    <p>Anyone have any suggestions? </p>
    <p>Thanks!</p>
