    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 1.May.2006 10.02am </div>
      <p>—-Constructivist United!—-<br>
    The P22 Constructivist set was originally designed in 1995 as a system of 5<br>
    fonts that could be mixed and matched to achieve a variety of constructed<br>
    alphabet display font settings. With Opentype, we have unionized the 5 fonts<br>
    plus added many new characters into one “pro” font. More alternates, more<br>
    language support, more circles and squares... Registered users may upgrade<br>
    at a nominal cost.<br>
    <a href="http://www.p22.com/products/constructivist_pro.html" title="http://www.p22.com/products/constructivist_pro.html">http://www.p22.com/products/constructivist_pro.html</a></p>
    <p>—-And in Commemoration—-<br>
    To celebrate this release, we have issued yet another Constructivist Coffee<br>
    Mug. The mug, like the font itself, is bigger and better. It is a 17oz red<br>
    ceramic mug with the phrase “Bigger Coffee For Better Workers”. It is<br>
    available for free to the first 100 purchasers of the Constructivist Pro<br>
    font set.<br>
    <a href="http://www.p22.com/products/mugs.html" title="http://www.p22.com/products/mugs.html">http://www.p22.com/products/mugs.html</a></p>
    <p>—-Hockey Night in Buffalo—-<br>
    Few people are aware of the P22 Hockey Team and its recent sweeping of the<br>
    divisional Championship. To commemorate this event, we have produced a<br>
    limited number of hockey pucks with the aforementioned triumph emblazoned on<br>
    it. $5 a pop, get ’em while you can.<br>
    Also available in very limited quantities are P22 Hockey Jerseys.<br>
    To see the P22 hockey memorabilia and the team over the years, visit<br>
    <a href="http://www.p22.com/products/hockey.html" title="http://www.p22.com/products/hockey.html">http://www.p22.com/products/hockey.html</a></p>
    <p>—-New Typecaster—-<br>
    The P22 Typecaster is now improved for easier font test driving. The new<br>
    MasterCaster combines all 5 divisions of P22 into one convenient font test<br>
    setting tool. Once you type in your sample text, it will remain the sample<br>
    text for every font you try. Once you find just the right font for your<br>
    needs, you can click on “Info” and select “Purchase Options” to go right to<br>
    that font’s page. These new features make it even easier to decide on the<br>
    right font and get it quicker than ever.<br>
    <a href="http://www.p22.com/typecaster/master/caster.html" title="http://www.p22.com/typecaster/master/caster.html">http://www.p22.com/typecaster/master/caster.html</a></p>
    <p>That’s it for this installment.<br>
    Until next time.<br>
    P22 type foundry</p>
