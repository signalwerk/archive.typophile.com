    html: <p>OK, Apologies to Mr Weidemann - its probably not <i>that</i> bad, just a very long way from what would be my choice - too bland for my taste, and I don't like the big lumpy finial on the C. <br>Apologies to Typophiles everywhere for posting a bmp instead of a gif or jpg. Recent browsers seem to happily handle bmps, but maybe its a mime-types thing? Anyway I should have read the instructions properly. <br>Thanks to Yves for such a rapid response.</p>
