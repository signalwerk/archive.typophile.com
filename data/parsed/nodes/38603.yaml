    html: |-
      <p>Confused about the request for every typeface in the mag. You planning to make a mock-Wired for April Fool's? I applaud your early planning.</p>
      <p>There is nothing quite like <a href="http://typographica.org/001103.php#exchange-fonts" rel="nofollow">Exchange</a>. Maybe <a href="http://www.fontshop.com/fonts/downloads/monotype/nimrod/" rel="nofollow">Nimrod</a>. For Vitesse, consider <a href="http://www.fontshop.com/search/?q=Dispatch" rel="nofollow">Dispatch</a>, <a href="http://www.fontshop.com/search/?q=Stainless" rel="nofollow">Stainless</a>, and <a href="http://www.fontshop.com/search/?q=Stratum%20OT" rel="nofollow">Stratum</a>. We've discussed other alternatives <a href="http://www.typophile.com/node/33255" rel="nofollow">here</a>.</p>
