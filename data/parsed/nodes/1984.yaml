    html: "<p>Both your S and s are still suffering from Inverted Trapezoid Syndrom. Scroll down in the following thread to see what I'm talking about: <br> <br><a href=\"http://www.typophile.com/forums/messages/29/21083.html?1072536454\" target=\"_blank\">http://www.typophile.com/forums/messages/29/21083.html?1072536454</a> <br> <br>Bring in the top left, move out the bottom left, bring in the top right. That should provide a wider base than top and stablize the letter. <br> <br>Randy</p>"
    html_clean: "<p>Both your S and s are still suffering from Inverted Trapezoid Syndrom. Scroll down in the following thread to see what I'm talking about: <br> <br><a href=\"http://www.typophile.com/forums/messages/29/21083.html?1072536454\" target=\"_blank\">http://www.typophile.com/forums/messages/29/21083.html?1072536454</a> <br> <br>Bring in the top left, move out the bottom left, bring in the top right. That should provide a wider base than top and stablize the letter. <br> <br>Randy</p>"
