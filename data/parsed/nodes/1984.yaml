    html: <p>I liked the first one better. Of course there are some rough  <br>edges, but it has an original spirit. I think some of the  <br>coolest stuff comes from people who are trying to figure  <br>out what letters are 'supposed' to look like. Once they figure  <br>it out, it looks like everything else. I think that's what  <br>happened here. I think the super short serifs and miniature  <br>ball terminals are great. However, I agree that the terminals  <br>on C and the S from the first version need something.</p>
