    html: <p>Quotes look good. You still need a standard ampersand. <br>I think what Hrant meant by the 'J' is illustrated in <a href="http://www.myfonts.com/fonts/bitstream/century-751/century-751/charmap.html" target="_blank">Primer</a>. <br>Take a look at <a href="http://www.myfonts.com/fonts/bitstream/century-751/century-751/mac-t1/140473/character/0073/CP4/1/" target="_blank">Primer's 's'</a> too. Yours looks wrong because <br>it's too top-heavy. Try shortening the top stroke so it doesn't <br>extend to the width of the belly. Good 'g'.</p>
