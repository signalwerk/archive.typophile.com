    date_raw: 29 Dec 2003 — 9:51am
    votes: null
    html: "<p>The \"J\" is better, but I'd make it narrower, and it does need some kind of terminal. A ball terminal (like in Primer) is one option, and for that I'd look at your \"f\" - although that's more of a \"teardrop\" terminal*. You could also try a serif (like in your \"S\") for a terminal. <br> <br>* Now I'm thinking maybe your \"f\" needs a ball terminal instead. <br> <br>The ampersand in your main character set is OK to me. <br> <br>The new \"g\" is almost there: it just needs to move the stroke weight in its tail to either the bottom or -more unconventionally- to the right. (And I'd avoid the common practice of putting weight in the horizontal part of the join.) <br> <br>The eszet seems too dynamic - try making that curvy part less curvy. <br>And to me a texty eszet benefits from an abrupt shift where the top curve starts going in. <br> <br>hhp <br></p>"
    html_clean: "<p>The \"J\" is better, but I'd make it narrower, and it does need some kind of terminal. A ball terminal (like in Primer) is one option, and for that I'd look at your \"f\" - although that's more of a \"teardrop\" terminal*. You could also try a serif (like in your \"S\") for a terminal. <br> <br>* Now I'm thinking maybe your \"f\" needs a ball terminal instead. <br> <br>The ampersand in your main character set is OK to me. <br> <br>The new \"g\" is almost there: it just needs to move the stroke weight in its tail to either the bottom or -more unconventionally- to the right. (And I'd avoid the common practice of putting weight in the horizontal part of the join.) <br> <br>The eszet seems too dynamic - try making that curvy part less curvy. <br>And to me a texty eszet benefits from an abrupt shift where the top curve starts going in. <br> <br>hhp <br></p>"
