    html: "<p>Hi Graham. <br> <br>I assume some of the unorthodoxy you are metioning is the absence of certain ball terminals. Some unorthodoxy is good. I think you've got some other issues though, mainly stroke modulation and color issues. <br> <br>Caps: <br>Seems like all of the thicks in your round letters could be thicker (they are all light) In the first line, check the CO vs the INRP etc. <br> <br>Your bracketed serifs are making dark spots. Thin them out a bit. Check the Z vs the Y <br> <br>G needs weight on the right side. <br> <br>LowerCase: <br>Again, rounds need more weight. Check out how dark the stem of the p is vs the round. Check all the rounds pqdbaeg etc. <br> <br>t: The weight gets too light too early as you move into the tail. <br> <br>g: Needs weight in the tail.  <br> <br>Overall. It's ok if you don't want the ball terminals, but it leaves you with a problem. The ends of your letters are really weak. For example the sS should be as dark as the other letters. They aren't though. I suppose you could really thicken up the spine and leave off the terminals, but that's why they were put there in the first place. I guess what I'm getting at is: You must solve that problem. Maybe in an unorthodox way</p>"
    html_clean: "<p>Hi Graham. <br> <br>I assume some of the unorthodoxy you are metioning is the absence of certain ball terminals. Some unorthodoxy is good. I think you've got some other issues though, mainly stroke modulation and color issues. <br> <br>Caps: <br>Seems like all of the thicks in your round letters could be thicker (they are all light) In the first line, check the CO vs the INRP etc. <br> <br>Your bracketed serifs are making dark spots. Thin them out a bit. Check the Z vs the Y <br> <br>G needs weight on the right side. <br> <br>LowerCase: <br>Again, rounds need more weight. Check out how dark the stem of the p is vs the round. Check all the rounds pqdbaeg etc. <br> <br>t: The weight gets too light too early as you move into the tail. <br> <br>g: Needs weight in the tail.  <br> <br>Overall. It's ok if you don't want the ball terminals, but it leaves you with a problem. The ends of your letters are really weak. For example the sS should be as dark as the other letters. They aren't though. I suppose you could really thicken up the spine and leave off the terminals, but that's why they were put there in the first place. I guess what I'm getting at is: You must solve that problem. Maybe in an unorthodox way</p>"
