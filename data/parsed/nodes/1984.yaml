    html: "<p>This is looking much more polished, although it's been \"tamed\" as well. It's like a calm, neutral serif face - uncommon. It feels like something in the spirit of Bookman, with an affinity for journalism. <br> <br>The glyphs that stand out: <br>- \"J\": needs a full curl. <br>- \"g\": needs to be more rigid. <br>- \"&amp;\": very cool, but out of character. <br>- \"7\": very nice. <br> <br>Also, you need to decide if this is a text face or a display face. For the former I'd make it a bit darker and lengthen the ascenders; for the latter it's fine as it is. <br> <br>hhp <br></p>"
    html_clean: "<p>This is looking much more polished, although it's been \"tamed\" as well. It's like a calm, neutral serif face - uncommon. It feels like something in the spirit of Bookman, with an affinity for journalism. <br> <br>The glyphs that stand out: <br>- \"J\": needs a full curl. <br>- \"g\": needs to be more rigid. <br>- \"&amp;\": very cool, but out of character. <br>- \"7\": very nice. <br> <br>Also, you need to decide if this is a text face or a display face. For the former I'd make it a bit darker and lengthen the ascenders; for the latter it's fine as it is. <br> <br>hhp <br></p>"
