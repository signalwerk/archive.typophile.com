  html: "<p>I have to typeset a bunch of stuff bilingual in German and English at the moment and have some questions (which weren't entirely answered in <a href=\"http://www.typophile.com/forums/messages/30/20924.html?1069454997\" target=\"_blank\">this thread</a>). All help appreciated. <br> <br>N.B. -- this could be complicated by the fact that the audience is Swiss (Basel), and I understand there are some peculiarities there regarding the use of guillemets instead of the standard German quote marks ... anyway: <br> <br>1) My particular concerns are the citing of the titles of artworks, books etc. In English, I set titles of works, books, films etc. italic, and I set titles of exhibitions, journals, articles etc. in single quotes. <br> <br>Everything (like, everything I mentioned above) in the translated texts I've received seems to be set in double German quotes (with the 'low nines' left and 'high sixes' right), which make the page very gappy. Is it familiar/acceptable to use italics or single quotes for any of these purposes in German? <br> <br>2) With ref to the Swiss thing, I've read that it's common in Switzerland to use guillemets instead of quotes. But would that be the German ones (facing 'inwards') or the French style (facing 'outwards')? And only for speech, or for the things I mentioned above also? I guess the intent is that German, Italian and French texts are set the same way? <br> <br>Sorry to be so dumb. I promise I've ordered a copy of Der Duden (see link above). But it's going to take 4-6 weeks to arrive. <br> <br>Rob</p>"
  html_clean: "<p>I have to typeset a bunch of stuff bilingual in German and English at the moment and have some questions (which weren't entirely answered in <a href=\"http://www.typophile.com/forums/messages/30/20924.html?1069454997\" target=\"_blank\" class=\"link-lost\">this thread</a>). All help appreciated. <br> <br>N.B. -- this could be complicated by the fact that the audience is Swiss (Basel), and I understand there are some peculiarities there regarding the use of guillemets instead of the standard German quote marks ... anyway: <br> <br>1) My particular concerns are the citing of the titles of artworks, books etc. In English, I set titles of works, books, films etc. italic, and I set titles of exhibitions, journals, articles etc. in single quotes. <br> <br>Everything (like, everything I mentioned above) in the translated texts I've received seems to be set in double German quotes (with the 'low nines' left and 'high sixes' right), which make the page very gappy. Is it familiar/acceptable to use italics or single quotes for any of these purposes in German? <br> <br>2) With ref to the Swiss thing, I've read that it's common in Switzerland to use guillemets instead of quotes. But would that be the German ones (facing 'inwards') or the French style (facing 'outwards')? And only for speech, or for the things I mentioned above also? I guess the intent is that German, Italian and French texts are set the same way? <br> <br>Sorry to be so dumb. I promise I've ordered a copy of Der Duden (see link above). But it's going to take 4-6 weeks to arrive. <br> <br>Rob</p>"
