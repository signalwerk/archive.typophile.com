    <p>You’ve all seen them.</p>
    <p>Flowery, swirly, calligraphic vectors used for decorating brochures and generally making anything look awesome.</p>
    <p>I’ve to compose a journal for my placement year to keep my lecturers happy, and I want to make it as outstanding as possible. However, coming across free vectors is like finding gold dust. </p>
    <p>In my moment of despiration, I turn to you typophiles in search of some eclectic vector formats for use in print.</p>
    <p>Regards,</p>
    <p>Paul.</p>
