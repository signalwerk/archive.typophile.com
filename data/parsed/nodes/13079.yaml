    html: |-
      <p>My list includes only typefaces which were constructed/assembled using the forms of existing typefaces (whether actual digital data or redesigned from scratch).<br>
      So original designs like Alembic, Equipoize, Rotis, Maverick, Tema Cantante Traitor or Morphica (which I consider different) are not listed.</p>
      <p>Please forgive my not providing links. I'm in a hurry, but I wished to share this list. This is a selection of what I considered more interesting, or which appeared first. Many of them are already "historical". I did a lot of these lists while I was collecting information on the digital revolution in typography.<br>
      This one was called "Type Surgery"<br>
      If you have other examples you consider worthy, I will add them.</p>
      <p>2RebelsUn (2 Rebels)<br>
      Addmorph (Brian Schorn at Cranbrook, used in Ray Gun)<br>
      BirthRiot (Sacred Nipple)<br>
      Canadian Photographer (GarageFonts)<br>
      CaseSeraSera (Apply Design)<br>
      Entropy (T26)<br>
      Fudoni (Max Kisman/FontShop)<br>
      Futile (GarageFonts)<br>
      Hegemonic (GarageFonts)<br>
      International Disgrace (GarageFonts)<br>
      Konflikt (Linotype)<br>
      Missive (T26)<br>
      Nameless (2 Rebels)<br>
      Neo (T26)<br>
      Not Caslon (Emigre)<br>
      Osprey (T26)<br>
      Prototype (Virus)<br>
      Razzia (2 Rebels)<br>
      Sacred Cow (David Shields at Cranbrook, used in Ray Gun)<br>
      Tex (2 Rebels)<br>
      The Royal Family (Thirstype)<br>
      Time in Hell (T26)<br>
      Zanzibar (Fountain)</p>
