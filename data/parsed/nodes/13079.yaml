      <p>I recall (although memory not always reliable) that FontHaus published a large format magazine a while back with a page that used Missive as a text face, and it looked highly legible, even with, or perhaps because of, the serif on the "o". But perhaps the readability was a result of the inherently virtuous metrics and color of the constituent "parents". </p>
      <p>Wasn't it also used in the US for a major credit card campaign?</p>
