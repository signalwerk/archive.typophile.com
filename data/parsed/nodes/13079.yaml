    html: |-
      <p>Please note that Stephen Farrell's Missive is unique in that selection, since it uses parts of a Garamond, and parts of an earlier beta of Barry Deck's Arbitrary. An historical design collaged with a post-structural, almost contemporary one. It actually does not work so good in text, but the use of classic proportions (the Garamond-like Os) introduced an element of interest.</p>
      <p>Once I designed a set of oldstyle numerals for it, although I never used it.</p>
