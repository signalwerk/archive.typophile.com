    <p><strong>Tor Slotmann</strong> is a danish designer who graduated as a graphic designer from Danmarks Designskole in 2004. He works as a freelance designer with type and identity design. He graduated with <em>integritype</em> – a typeface for signage in a hospital. He is currently developing identities and typefaces for various clients.</p>
    <p><a href="http://www.torslotmann.dk" title="www.torslotmann.dk">www.torslotmann.dk</a></p>
