  html: |-
    <p>Coming down the home stretch on the Moped Script. For the sake of getting it out the door, I’m going to release this, then possibly other weights or versions. </p>
    <p>It features the straight and curl versions, contextual alternates for appropriate joins, and language support covering latin for Europe. Specifically: Afrikaans, Basque, Breton, Catalan, Danish, Dutch, English, Finnish, French, Gaelic, German, Icelandic, Indonesian, Irish, Italian, Norwegian, Portuguese, Sami, Spanish, Swahili, Swedish, Croatian, Czech, Estonian, Hungarian, Latvian, Lithuanian, Polish, Romanian, Serbian, Slovak, Slovenian, and Turkish.</p>
    <p></p><div class="imageWrap"><img src="/files/moped_sample_6566.gif"></div><p></p>
