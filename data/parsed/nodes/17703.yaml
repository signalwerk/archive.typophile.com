      <p>I guess the idea is based on the assumption that there is a subconscious perception and judgement of the aesthetic and character of a typeface while it’s been read.</p>
      <p>This could be too subtle to work in my opinion, it may go unnoticed because when the reader is inmersed in the reading, the natural thing to do is to try to discard visual information and rely on the prediction of the meaning of the text.* When the reader is not inmersed, maybe because he is just looking at a diagram, aproaching the title or (who knows) admiring the type, then he is very aware of visual information.</p>
      <p>It’s not my intention to hijack your thread with an argument about how do reading happens. I just gave an argument of why I think this may be too subtle to actually be notticed (even subconsciously).</p>
      <p>Héctor</p>
      <p>* Frank Smith proposes an interesting view on reading on which the reader actually tries to rely more on the predictive habilities of perception to read the meaning of the text and less on the visual information because the visual system has a severe bottle neck, so the reader would be percieving too little visual information to judge the aesthethic or character of a typeface while reading.</p>
      <p><a href="http://typophile.com/node/9736?from=50&amp;comments_per_page=50" target="blank"> Look for my post about 4/5 of the scroll </a></p>
