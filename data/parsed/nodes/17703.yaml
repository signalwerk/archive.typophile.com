      <p>George, are you looking for a mechanism that works like vocal inflection in speech? If so, you might consider that vocal inflection is heard, without being attentionally focussed-on (unless the vocal inflection pattern is affected).</p>
      <p>From my point of view the question has to be: what does the perceptual processing system do with the kind of variation you are describing? Can the “noisiness” in neurological activation terms it contributes become tagged as emphasis or inflection? I’m reminded of your reference elsewhere to Reuven Tsur. </p>
