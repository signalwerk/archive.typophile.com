    html: <p>Hi James, your sans is wonderful, and the idea of manipulating component ratios sounds a good one. I was really just thinking of introducing these subliminally perceived differences into type made at some stage for my own fiction, so there shouldn’t be too many politico-aesthetic disputes; but maybe, as you’ve hinted, prose style becomes something else, less pure and less traditional, when given typographic backup for its effects. Prose is words, paragraphing and punctuation, and there is something pleasant about that constriction, as in type design the conventional nature of a script’s forms is pleasantly constrictive.</p>
