      <p><em>I’ve been toying with a similar, but different idea: the use of alternate glyphs to represent phonetic values. If my thinking is sound, then an experienced reader of English will be able to read with little or no distraction, because all the letter shapes are quite standard, but a learner will be able to slow down and extract the phonetics from the difference in detail.</em></p>
      <p>I’ve already done that in a display font—-<a href="http://www.myfonts.com/fonts/sentinel/rhodaelian/">Rhodaelian</a>. Instead of putting the phonetic shaping into alternates I put it up front in the default letter set using a consistent scheme that allows the face to be used without the setter having to make any decisions about which glyph to use based on its sound. The main sticking point is “c”. Rhodaelian’s “c” is half soft, half sharp, to cover soft c sounds and hard c sounds. At least 4 alternates are available for fine tuning every letter. I threw in a stack of ligatures too, but no phonetic or philological ligs, eg: “ch”, “ck” etcetera, because I think those kind of ligatures are too silly for words and only distract the reader, thereby reducing readability.</p>
      <p>One day I might look at adding a program to make automatic OT alternate selections based on conventions of spelling and pronunciation.</p>
      <p><em>what’s shizzolation?</em></p>
      <p>Colloquial, dialectic, slang, vulgar vernacular language “Et-cetera, et-cetera!”*</p>
      <p><em>But some visual information retained somehow, even if only in the “icon”, the momentary, unchunked image of what’s been seen, might alter verbal perception. The goal is to manipulate what the reader takes to be purely literary response.</em></p>
      <p>Possibly the concept could work, but again, this idea goes against the notion of transparency. The function of typesetting—-in a novel for example—-is to leave the manuscript and the narrator’s voice untainted, unaltered, unflavoured, unimpeded, to do their thang.</p>
      <p>The “verbal percepton” is embedded in the writing and word-smithing,  and largely determined by the writer. Typography is just a container for teleportation to the reader’s mind. The smoother and more consistant the ride, the more likely the cargo will arrive intact. What the reader makes of it after that...</p>
      <p><em>The author may KNOW where inflection is intended but NOT know how it might be received by an audience unknown to him/her.</em></p>
      <p>Exactly. Its up to the writer and the reader to <strong>decide</strong> how a text reads, how the inflexion varies. And since so many decisions are made by readers, a good deal of ambiguity or “fudge factor” is involved. Besides, the best authors don’t use any kind of visual (typographic) emphasis to modulate their narrator’s voice; they rely on their skill as writers instead. Read Hemingway. The penultimate example is The Old Man and the Sea. Literature doesn’t get any simpler or more direct than that.</p>
      <p>With the deepest respect George, I think you’re wasting your time.</p>
      <p>* Yul Bynner’s brusque, petulant Siamese king from The King and I.</p>
      <p>j a m e s</p>
