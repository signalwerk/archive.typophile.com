      <p><cite>i’m not sure, but i think you’re asking whether or not a writer, who also happens to be the typographer, should use a “slightly” different typeface (almost unnoticeable to the undiscerning reader) as a way of empathizing text, instead of the traditional “italics”.</cite></p>
      <p>Not a “different typeface”, but a different font made as part of a single typeface; not “almost unnoticable”, but actually unnoticable; and not to empathize text (?) but to direct or strengthen the literary response to what are, though now not merely, verbal effects.</p>
      <p>It might be disorientating, I have no idea. But the fonts would be exactly equal in weight and at least vertical proportions, such that there would be no question of the abnormal fonts standing out.</p>
      <p>I assumed that this would be sensible, but have had doubts (on the grounds that, as Bringhurst says, typography is abstract code not raw gesture). These doubts, however, are not shared by a phenomenologist friend of mine who knows far more psychology than I do, and who believes, with me, that it is ludicrous that no author of fiction has yet bothered to learn to design type, for this very purpose.</p>
