      <p>Héctor: [about Frank Smith]</p>
      <p>I’ll certainly look into <em>Understanding Reading: A Psycholinguistic Analysis of Reading and Learning to Read</em>. In preparing for the presentation underlying my <em>Typo#13</em> contribution I read parts of Frank Smith’s 1996 <em>Reading Without Nonsense</em> and the wonderful essay “What’s the use of the Alphabet” in <em>Essays into Literacy : Selected Papers and Some Afterthoughts</em>.</p>
      <p>But I also found <a href="http://www.enneson.com/public_downloads/pe/typophile/fs_psychonosci_1969.pdf">this</a> 1969 paper useful, for its emphasis on “sufficient” processing of “criterial combinations of features” “discriminated simultaneously”; and of “feature discriminability” as “the crucial variable in word identification”, and its non-dependance on a letter by letter approach.</p>
      <p>(It is one of the things that consolidate my misgivings about Hrant’s parafoveal emphasis, while keeping alive the prospects of a view that doesn’t capitulate to a letter-slot pocessing approach to visual wordform resolution. Lateral interference in the paravoveal stream causes the <em>what where</em> of criterial features (role-architecture-level particulars and primitives) to be beyond discrimination.)</p>
