      <p>Thanks Peter!<br>
      <cite>The fact that final or full—for this is closer to what is claimed—signification is endlessly postponed does not leave the text a void, it leaves it open to a continuous and fertile play of signification.</cite><br>
      OK (though a preference for the fertile and playful in deconstruction was a hangover from Barthes and almost forgotten in the grey labyrinth of later Derrida). But the notion of a full signification is philosophically suspect, as the notion of a final signification is not. For what is a partial signification? There is only signification tout court as a mental event - a change of qualities in the substance of mind. As for final signification, the idea that mind is not static is no great revelation.<br>
      <cite>I am not all that familiar with how Foucault has been applied in Lterary Theory</cite><br>
      If you knew what had been done in his name... But Foucault was certainly unreliable in the extreme as a historian of science. His writing on medieval matters, specifically its treatment of madness, is at the level of a Ruskin or a Morris in its disregard for data, and the Laingian view of the madman as a corrupt world’s last innocent, which underlies Foucault’s stuff, has led to innumerable failures to treat schizophrenics. Again, I have personal experience of this.</p>
      <p><cite>Nothing (at least nothing finite) is a Spinozistic substance that exists in itself</cite><br>
      Why not?<br>
      <cite>and is conceived through itself. </cite><br>
      No problem with the second half.<br>
      <cite>They are and they mean only in contexts they neither create nor control.</cite><br>
      I see no reason to doubt that things exist irrespective of all contexts except the existing universe. The contexts in which things signify are those of the brain and the mind (if you don’t like dualism forget the latter; but the context of the brain implies that a number of rules of thumb put forward by psychology now or in the future can best explain in detailed ways the complex relationship between the sign that is held to signify and the signification that is the brain’s response).</p>
      <p><cite>Did Shakespeare really acheive impersonality? Or was his narrative voice large enough to embrace the tug of contradictory perspectives?</cite><br>
      By his impersonality I mean his ability to make plausible his presentations of varying opinions such that one cannot identify his own opinion.<br>
      <cite>Are you acheiving Shakespearean impersonality in your dismiss of post modernism?</cite><br>
      No, and I’m not aiming for it here, I’m arguing (or at least engaging in dogmatics). Such argument leaves me feeling still more strongly the pointlessness of including argument in art. I realise that my very formulations scream “naive” to the sophisticated post-Theory reader, but I have examined these things with care, and found to my real surprise that these plain positions seem to me true.</p>
      <p>Would it be impertinent of me to recommend a book I read a week ago, which proposes much my view of culture? Scruton’s too keen on Leavis and insufficiently staunch in sticking up for aesthetic pleasure for the match to be perfect, but he’s still wonderful: <a href="http://www.amazon.com/gp/product/1890318477/ref=ed_oe_h/002-7878830-8000062?%5Fencoding=UTF8">Modern Culture</a>.</p>
