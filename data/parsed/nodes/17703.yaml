      <p>I’ve been toying with a similar, but different idea: the use of alternate glyphs to represent phonetic values. If my thinking is sound, then an experienced reader of English will be able to read with little or no distraction, because all the letter shapes are quite standard, but a learner will be able to slow down and extract the phonetics from the difference in detail.</p>
      <p>For a taste of the kind of differences I’m talking about, the ’s’ needs voiced and unvoiced variants. Perhaps the voiced variant has sharper bends and more open apertures, so that it bears resemblance to a reversed ’z’.</p>
