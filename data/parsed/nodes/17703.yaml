      <p>Thanks for your clarifications James.</p>
      <p><cite>That scenario could never be practical.</cite><br>
      Naturally it would cause economic meltdown, but I think after the huddled remainder of humanity came out of the caves the the world would be a better place. When I lead an army on London, job number one will be a total and rigid ban on advertising, which would of course have still more disastrous effects, but sunny results for human life. </p>
      <p><cite>Happily that creates the prosperity that allows quality literature to be published on a small scale, to the delight of people like us.</cite><br>
      But the junk - in which I’d gladly include most of our English Faculties’ reading lists - is still read and still noxious. What a contribution to civilisation it would be to destroy all copies, including mental, of, say, ’Lady Chatterley’s Lover’ - imagine hired snipers swinging into the Library of Congress, trained monkeys sorting rapidly through the underground stacks of the Bodleian, the blackmail of publishers and the manipulation of virii. It’d be great.</p>
      <p>You’re right about the ends of art being effects not means; but I think popular views of how really good writing gets done are enormously inaccurate (“no unnecessary words” etc - try that on Wordsworth’s “thoughts that do lie too deep for tears”, in which “do” is crucial). Cognitive effects, including affects, arise from each of the four aspects of verbal art: style as juxtaposition in working memory, structure as association between stylistic effects in long-term memory, narrative as story-sequencing and world-building for its beauties. The holistic effect of a sense of redemption is, I think, a little more closely defined as the imagination of a common culture, in which what it is right to feel (and thus say and do) in situations analogous to some we experience in reality is not in doubt. Such a common culture cannot exist in a consequentialist and agnostic society, but the vision of it provides real consolation. Just as important, though, is immediate pleasure in highly worked writing, which can potentially be intenser than that in invisibly smithed stuff; though I’m very glad to hear that you don’t give a hoot about the “dignity” of simplicity, do you really prefer the experience of reading Hemingway to that of reading Nabokov? Fair enough if you do.</p>
      <p>Finally, you didn’t upset me in the least, I just thought you hadn’t read my initial post.</p>
