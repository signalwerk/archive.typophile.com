      <p><em>Very few, but then very few have the aptitude and discipline to write well. If all authors of fiction were required, if they were to be taken seriously, to make their own text type, one could tell at a glance which of them had sufficient taste, and capacity to embody it, that they might be worth reading; 99% of fiction would become blissfully self-cancelling, a great boon to the book-buying public.</em></p>
      <p>That scenario could never be practical. Publishing doesn’t work that way. Economic realities are involved. Like Hollywood film production where the movies that get made have nothing to do with making good films, but are instead dictated by union quotas for employment of production staff, the box office draw-power of stars, and the popular appeal of high-concept storylines fleshed out in cliché-ridden scripts by bad acting. </p>
      <p>Market appeal and popular demand are the main criteria publishers use for which manuscripts they publish. Book publishing does not thrive on high quality literature, but low quality junk that sells in large numbers. Happily that creates the prosperity that allows quality literature to be published on a small scale, to the delight of people like us.</p>
      <p>Discounting the discipline and craft part of font making for a moment; Judging a person’s ability as a writer by their aesthetic prowess in designing a text font is not realistic. The best writers generally aren’t designers. Would you really judge a writer by his ability as a type designer? Or a classical violinist by his ability to make a beautiful-looking, blissful-sounding violin? The guy is a musician, not a carpenter.</p>
      <p>Backtracking for a moment;</p>
      <p><em>...one could tell at a glance which of them had sufficient taste...</em></p>
      <p>You and I could, but most of the book-buying public couldn’t. Some printers and typesetters have good grasp of which text fonts are beautiful and practical, and some I’ve met haven’t got a clue and don’t care—-they’re only setting type to earn money, not to be good practitioners of the art. Then there’s publishers, the business boffins at the top of the pile who mostly aren’t aesthetes or fans of type design. Their first love is money.</p>
      <p><em>...99% of fiction would become blissfully self-cancelling, a great boon to the book-buying public</em></p>
      <p>That would wipe out 99% of the publishing industry. </p>
      <p><em>I don’t take to be more than cousin to that which Nabokov describes</em></p>
      <p>I’m not quite sure what you mean.</p>
      <p>To clarify, I advocate simplicity of writing technique—-word-smithing—-as the basis or starting point for good writing. I love the simplicity of Hemingway, and equally the complex technical precision of Poe, as well as the deft prose of Philip K. Dick’s mainstream novels, and everything in between, as long as it is artful prose.</p>
      <p><em>...art at its greatest is fantastically deceitful and complex</em></p>
      <p>Some of it, yes. Some art is very simple and direct. Nabokov’s statement focuses on the mechanism of great art, <strong>how</strong> it works its magic on the spectator. But what of the effect of art? In my view, art has redeeming qualities. It makes us and the world whole again thru a process of redemption. Literature without that quality is hack work, not art.</p>
      <p>George, I’m sorry if my comment, “I think you’re wasting your time.” upset you. It’s only my view, only what “I think”. William, Nick and others have expressed their doubts, but with benevolence by adding, Don’t let us discourage you, try it. I’m rather blunt, but a strong believer in relativism. All points of view are valid for the individuals who hold them. So don’t let me put you off either :-)</p>
      <p>Note: some of the words in this post have been used before.</p>
      <p>j a m e s</p>
