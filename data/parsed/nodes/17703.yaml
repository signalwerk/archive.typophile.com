      <p>Héctor, the argument of my last paragraph is that: if Frank Smith is correct about discriminability of features being fundamental to the perceptual processing component of reading, than this poses a challenge to Hrant’s claim that the bulk of recognition happens or can happen parafoveally. This poses a challenge because the ’what feature where’ information is rendered impossible to discriminate or compile, due to lateral interference. (This is not to say that some skipping based on parafoveal preview does not routinely occur.)</p>
      <p>I agree with Frank Smith that grammatical and semantic context knowledge (in the field of discourse relevent to the subject mater of the text) reduces the dependancy on visual processing in reading, to the extent that it allows the probability summation routines underlying recognition to reach sufficient confidence about lexical identity sooner. </p>
      <p>James, I have not read Susan Greenfield’s book, but if my intuition about what axon modelling is, is correct, I’d want to say: it would be nice if axon modelling could penetrate the mechanics of probability summation to the point where is could factor in familiarity of context, and the contributions of lateral interactions at the visual cortex level.</p>
      <p>Axon modelling might also, if it can become sophisticated enough, help George with his search for what level of typographical variation is subliminally discarded as noise, and what is fed forward to the reception system as inflectionally informative. (It might also help decide between my model of perceptual processing in reading and Kevin Larson’s.)</p>
