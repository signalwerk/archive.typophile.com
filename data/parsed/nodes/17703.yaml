      <p>The DaDa poets and the Concrete Poetry people tried to pursue this with what they wrote and the sounds they created. There have also been many typographers (many from the Basel arena) who have worked to visualize meaning through structure and juxtaposition in typography. The texts they used were typically not in the “normal use” vein and therefore don’t quite come off as something you can extrapolate data from. This would still be difficult to do because (like measuring the path of a particle in Quantum mechanics) the act of measuring affects the data. In this case, how do you get someone to differentiate between something gained consciously from something gained supposedly totally unconsciously without making it conscious?<br>
      It may be that people (other than those involved in typography, design, and readability research) just read words. Changes in font help with organization for the reader in “normal” kinds of stuff (books, newspapers, reports, etc.). Using typographic design (a la Basel, DaDa, et al), can have a communication affect in shorter, more persuasive texts or artistic literature, but it seems most of this would be conscious or at least semiconscious.<br>
      I guess what I am saying is that the affect you describe is more a part of who the audience is and their visual literacy level (along with the kind of reading—not immersive) than who the author is.  The author may KNOW where inflection is intended but NOT know how it might be received by an audience unknown to him/her.</p>
      <p>ChrisL</p>
