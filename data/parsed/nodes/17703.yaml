      <p><cite>The water may be rougher going than it’s ever been, but it’s a blast...Our skies are overcast with false certainties.</cite><br>
      Not on English courses, at least in my experience, is it now generally a blast. The range of focus, and of analytical tools, on these courses is astonishingly narrow, and the pressure to confine one’s interests and opinions to what’s on offer very great. Capitalised Literary Theory in all its common forms relies on one psychology of literary production (somewhere in the artist’s head, power puts on the mask of culture) and three of reception (the reader naively assents to, or bravely deconstucts the coded messages of the Foucauldian paranoid; or he finds signification endlessly postponed, leaving the text a void), none of which is remotely convincing. But these “false certainties” are repeated so often, by people who explicitly deny the uses of both argument and evidence against their positions, that they are often believed; and beliefs have force, here for evil. What possible uses does Derrida have? What single paragraph of his have you found good? I’d love to see it.</p>
      <p>Art that needs meta-data is rhetoric not invention, because it relies on high-level, after-the-fact conceptual consideration. Protest art is obviously rhetoric rather than invention. I want arguments laid down with a decent attempt to list premises, explain method and give deductive or inductive arguments; and I want art unburdened with the freight of opinion that will, a few centuries down the line, look hopelessly moth-eaten. Arguments are arguable, so probably (let’s face it) wrong; and error, for me, is both foreign and corrosive to artistic invention. To avoid opinionising altogether - to achieve impersonality - is hard but doable; the trick was pulled off by Shakespeare, who eliminated the narrator’s voice and ensured that all opinions expressed were contradicted elsewhere.</p>
