      <p>Héctor, thanks for bringing up Frank Smith. One can read text at different rates, and complex texts on unfamiliar subjects are read with many more fixations, so the bottleneck cannot be absolute, but I agree that the brain seems to like discarding as much as possible. It might be that altering the visual aspect of words would cause more attention to be paid to the visual, with perhaps disastrous rather than benign consequences for the perception of the verbal. I imagine it’s a question of how much two-way feedback there is between the relevant verbal and visual centres at the stages of processing responsible to affective response - and that kind of question is far from being settled in psychology.</p>
      <p>Tim - you’re right, of course, though these authors have had a while now. But whose prose is sufficiently impressive that work invested in learning to make type would be more valuable than the same work invested in learning to write? Hardly anyone going at the moment: maybe Martin Amis and Don DeLillo, but I read very little contemporary fiction. Certainly not the current rabble of British poets: has anyone here read Andrew Motion?</p>
      <p><cite>From my point of view the question has to be: what does the perceptual processing system do with the kind of variation you are describing? Can the “noisiness” in neurological activation terms it contributes become tagged as emphasis or inflection? I’m reminded of your reference elsewhere to Reuven Tsur. </cite><br>
      Peter: exactly. We need a Tsur to sort this out!</p>
      <p><cite>The DaDa poets and the Concrete Poetry people tried to pursue this with what they wrote and the sounds they created. </cite><br>
      Hi Chris, the DaDa stuff generated no substantial aesthetic response. No human can work up more than the most meagre enthusiasm for that kind of thing in the continuous experience of it, though they may value (God knows) having had the experience. These typographic gimmics have no close, immediately experienced relation with felt words, because the words weren’t felt in the first place.</p>
      <p>It’s true that it’d be almost impossible to test the additional effectiveness of the massaged versus the straight text. That’s annoying.</p>
      <p>Raph, your idea sounds much better than mine! I also love your software - very helpful for splitting letters in particular - but the variety in my samples is too great for the number of classes to be kept at the number of punches. Is there anything I can do to change that?</p>
