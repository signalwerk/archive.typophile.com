      <p>&gt;gets in the way too much, unless that’s the whole point.</p>
      <p>There are two different looks at type when we look a a page. The look at titles, how the pages looks—an orienting look. And here we notice style more. Then there is the immersion, after which the letters disappear, or should. My feeling is that changing the letters in a way that is not noticeable on the orienting look is probably not a good idea. It would be like switching one “crystal goblet” with one slightly different, when the wine drinker is not looking. At most it would be disconcerting. If it is noticeable, then the question, which Nick asks, is what is the point? If it serves a useful purpose, great, if not forget it.</p>
