      <p>“Calligraphy might offer a more immediate means which you could manipulate directly, at will, and a greater range of expression than type.”</p>
      <p>Is that so?  Then for total freedom of expression you can just draw pictures. But if the issue is free but clear expression, e.g. if you wanted to get anything done in business, or court or a thousand other things, before type, you needed a disciplined scribe or no one would be able to read it. Type, on the other hand, in expressing through changing mechanisms and tastes, has taken on a wide range of forms, many of them totally non-Calligraphic, in the successful service of crystal clear expression. And, today that mechanism can use type pretending to be most nearly every style of writing...</p>
