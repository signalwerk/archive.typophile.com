      <p>Some different things:</p>
      <p>Straight text: no articulation, other than standard grammar and punctuation.<br>
      Text with non-standard spelling (eg Runyon/Twain) to indicate accent.<br>
      Text with non-standard spelling (eg Shizzolated) to indicate ... er, shiz!<br>
      Text with extra punctuation!!! ....<br>
      Text with typographic (visual) articulation, eg “emphasis” by italic, bold or caps, to indicate an aside (or Post-modern multiple narratives), or categoric quality (eg book and boat names).<br>
      Text with prosodic articulation, to “spell out” pronunciation less ambiguously.<br>
      Visual poetry (eg Dada) — which is akin to what you’re suggesting.</p>
      <p>So this is a messy business, and all I can say is try your idea.<br>
      I’ve done a fair bit of writing, and sometimes use my own faces, but I’ve never wanted to massage the text as you suggest, it gets in the way too much, unless that’s the whole point.</p>
