      <p><em>Is that so?</em></p>
      <p>David, good point. I got the “greater range of expression” part wrong. I oversold. It was just a thought—-looking for ways George’s idea might be made to work.</p>
      <p><em>But if the issue is free but clear expression...</em></p>
      <p>I’m not certain that is the issue—-or the goal. George’s proposition entails conflicting requirements. Resolving that paradoxical ideal may turn out to be impossible.</p>
      <p>Then again there might be something very valuable burried under layers of conventional widsom and received ideas waiting to be (re)discovered, and since we don’t have a clear definition of that thing...we are in the position of the blind man in the dark room looking for the black cat that may or may not be there.</p>
      <p>I’m trying things, reaching in different directions by way of trial &amp; error, in an effort to find that cat and illuminate it. Nature—-the blind watchmaker—-designed every known plant and animal by trial &amp; error over millions of years. Experimental type design sometimes follows a similar methodology.</p>
      <p><em>Then for total freedom of expression you can just draw pictures.</em></p>
      <p>Calligraphic letters and tyopgraphic designs are, in a sense, very detailed pictures we draw according to an established repertoire of gestures and forms. George is a writer expressing himself in words who seeks a means of infusing subtle nuances of inflection into text type. In that sense he is trying to combine some of the expressive capabilities of pictorial art with text type.</p>
      <p><em>Type, on the other hand, in expressing through changing mechanisms and tastes, has taken on a wide range of forms, many of them totally non-Calligraphic, in the successful service of crystal clear expression.</em></p>
      <p>Certainly. I don’t have a problem with that. At the same time I’m not suggesting calligraphy would do the same unbiased job of clear articulation. Earlier on this thread I was arguing in favour of conventional text types and their inherent clarity. Then, later, I suggested calligraphy as a possibility for George’s pursuit—-rendering his own writing with more expressiveness and subjectivity than conventional text types allow. The application is for George as both the writer and type designer, not for widespread use as a distributed type tool.</p>
      <p><em>And, today that mechanism can use type pretending to be most nearly every style of writing…</em></p>
      <p>Yes. And the stylistic range is growing in ever more fascinating and challenging guises.</p>
      <p>j a m e s</p>
