      <p>James, I meant to say the norm-violations are robust. That is, that some of the norm violations produced through ’concentration on articulation’are keepers from a perceptual processing point of view, they score high on the fitness for enhanced readabillity meter. Robust norm-violations are those that encourage efficient processing at the biophysical or vision science level. Efficiency is at least foundationally a matter of neural computational efficiency <em>at the visual cortex (and earlier) level (as distinct from a lexical access level)</em>.</p>
      <p>Why robust? because the norm-violatios might enhance the saliency—and via that, cue-value—of just those features which in bouma context are criterial to effective visual wordform resolution. We do not know these features beforehand, and a theory of reading does not hand them to us. It just tells us what kinds of things are relevant. Overdetermined saliency maps are relevant. Proper cue value is relevant. Concentrated &amp; ludic ’travaille sur’ articulation is a (the?) search-engine.</p>
      <p>Or so I think.</p><div class="imageWrap"><img src="/files/][img:"></div><p></p>
