      <p>i’m not sure, but i think you’re asking whether or not a writer, who also happens to be the typographer, should use a “slightly” different typeface (almost unnoticeable to the undiscerning reader) as a way of empathizing text, instead of the traditional “italics”.</p>
      <p>if that’s what the question is, i would say no. I have read books that have tried something close to this, but the change is from a serif to a similar-looking san serif typeface, the subtleness was almost confusing at times, as my eyes had to often double-check the empathized text just to make sure it really saw something different.</p>
      <p>i think that something as subliminal as the method you have mention would be disorienting, not to mention it might just make the page look ugly from a typographical standpoint.</p>
      <p>IMO.</p>
