      <p><cite>How many authors have the aptitude to design a text font? How many of those are likely to learn the required discipline to make a text font as good as Jenson?</cite><br>
      Very few, but then very few have the aptitude and discipline to write well. Imagine if all authors of fiction were required, if they were to be taken seriously, to make their own text type: one could then tell at a glance which of them had sufficient taste, and capacity to embody it, that they might be worth reading. 99% of fiction would become blissfully self-cancelling, a great boon to the book-buying public.</p>
      <p>When I said that “simple and direct” is not “best” I was talking about writing too - and, as you say, no doubt oversimplifying your position. But would you say that you do believe in the virtue or dignity of simplicity? In imaginative writing I think that simplicity and directness tend towards just another set of stock rhythms and responses. Currently one sees this in limpid, female novels of middle-class divorce, but Hemingway is full of a manlier version of the same standardised starkness. As Nabokov (who did make an exception for Hemingway’s “lovely one about a fish”) said, ’I automatically gave low marks when a student used the dreadful phrase “sincere and simple” - “Flaubert writes with a style which is always simple and sincere” - under the impression that this was the greatest compliment payable to prose or poetry. When I struck the phrase out, which I did with such rage in my pencil that it ripped the paper, the student complained that this was what teachers had always taught him: “Art is simple, art is sincere.” Someday I must trace this vulgar absurdity to its source. A schoolmarm in Ohio? A progressive a-s-s in New York? Because, of course, art at its greatest is fantastically deceitful and complex.’</p>
