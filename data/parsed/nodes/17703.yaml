      <p>Back to the initial topic. For what it is worth George, I’m offering some design work of mine as a practical suggestion.</p>
      <p>If you started with an antiqua-based model for your main type design, any major changes to the antiqua letter structures will likely distract the reader too much. For example;</p>
      <p>antiqua “y” &gt; cursive (upright) or blackletter “y”<br>
      antiqua “v” &gt; cursive (upright) or blackletter “v”<br>
      double story “a” &gt; cursive monocular “a”<br>
      binocular “g” &gt; cursive monocular “g”</p>
      <p>Ruling out that kind of restructuring leaves a few other axes that might be modulated for subtler changes;</p>
      <p>stressing<br>
      proportion<br>
      component ratios<br>
      weight<br>
      tracking</p>
      <p>Small variations in tracking and weight seem the most promising, while variations in stressing &amp; proportion would have to be strictly limited to avoid messing up readability.</p>
      <p>What the flying fish do I mean by <strong>component ratios</strong>? The size of bowls in relation to stems, ascender and descender lengths, and the bowl size of individual letters in relation to each other.</p>
      <p>This sample shows a sans serif I’m working on—-in a primitive stage of development. Sorry its too wide for the Typophile page.</p>
      <p></p><div class="imageWrap"><img src="/files/one_mans_poison.png"></div><p></p>
      <p>Homely-looking isn’t it? We can forgive that because the font’s ambition is to be a casual text sans, albeit with enhanced readability.</p>
      <p>Pretend it’s an antiqua type with serifs in the usual positions that departs from Griffo’s model in only two areas—-the “g” is monocular rather than binocular, and the “w” is cursive.</p>
      <p>Keep the “g” structure as it is, and pretend the “w” is an angular antiqua model, mmmkay?</p>
      <p>Check the “g”, “p”, “q” and “y”. Those particular letters utilize the principal of ratios to determine their bowl sizes. This is aimed at increasing differentiation between similar letters to create more distinctive word pictures, and in turn increase readability. In one word—-demodularization.</p>
      <p>I wonder if component ratios could be a useful form of modulation for your concept George. Binocular “g” should support variable ratios too, if you were to use that form instead of the monocular form shown here.</p>
      <p>A book roman in a range of fine divisions of weight might have applications for emphasis, but would need high quality printing to make it effective, and tight quality control over a print run to keep it viable; small variations in press gain could defeat subtle variations in weight used in deifferent parts of a book.</p>
      <p>Tracking modulation is already a proven means of emphasis and control of<br>
      r e a d&nbsp; s p e e d, so it wouldn’t hurt to try it again.</p>
      <p>If you can succeed in designing the kind of type system you imagine, the main stumbling block would be the task of convincing publishers to adopt it and print appreciable quantities of books. You also need sympathetic authors to put up works to be frankensteined. Then how do you go about working with these authors to decide exactly how their texts are treated? Getting them interested in typography could be a long and complicated affair with potentially sticky politico-aesthetic disputes. </p>
      <p>Assuming those problems can be solved and don’t interfere with the management and logistics of the publishing process, publishers probably would not care how it all happens as long as the technical process is viable and editions sell in decent quantities.</p>
      <p>j a m e s</p>
