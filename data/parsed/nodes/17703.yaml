      <p>Calligraphers apply a form of this, though more gesture than code.</p>
      <p><em>it is ludicrous that no author of fiction has yet bothered to learn to design type</em><br>
      I suppose that technology has, until recently, been the stumbling block. In Ruari McLean’s <a href="http://www.amazon.co.uk/exec/obidos/ASIN/0393702014/qid=1139053864/sr=1-7/ref=sr_1_2_7/026-4836135-4073226">Typographers On Type</a>, he reproduces a letter from George Bernard Shaw on his development of a house style for his work (for financial as well as aesthetic reasons), explaining why he changed from Caslon to Plantin in his Standard Edition (because the smaller Caslon was troublesome to keep clean). I imagine that he would have involved himself in type design if he could.</p>
      <p>Good luck with this project if you decide it is worth pursuing, it sounds intriguing.</p>
      <p>Tim</p>
