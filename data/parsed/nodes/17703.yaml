      <p><em>This ideal only makes sense when the author is not also the type designer.</em></p>
      <p>How many authors have the aptitude to design a text font? How many of those are likely to learn the required discipline to make a text font as good as Jenson? This “ideal” as you put it is not an ideal. Its a fact of life for almost every writer of prose fiction and non-fiction.</p>
      <p><em>When an author is making type for his own writing he is free to make the type fit verbal style more closely than would otherwise be possible. Should he, then…</em></p>
      <p>If s/he wants to, sure. I’ve got nothing against the idea, but even for a writer who also designs fonts I still think its pointless.</p>
      <p>I don’t write novels or plays, but I have written short stories, and I write advertising and promotional copy for a living. Please don’t let my occupation bias your perception of how well I understand literature and written language, or how much I appreciate good writing.</p>
      <p>When I first started writing with a word processor I discovered typography and all the possibilities of formatting, emphasis etc. Like a kid with a new toy, I partially mistook the medium for the message and began overusing (abusing) typographic emphasis as a means of expression. Then I learned how to write properly and to separate writing from type—-they’re not the same thing. Emphasis and <strong>degrees of emphasis and inflection</strong> which is what  you want, come from the written prose.</p>
      <p><em>And “simple and direct” is not “best”.</em></p>
      <p>I said, “Literature doesn’t get any simpler or more direct than that.” Talking about writing, not typography. I never said “simple and direct” is “best”. That expression was yours and it looks like you’re oversimplifying my view of writing in relation to typography.</p>
      <p>Typography is about clarity, not simplicity. “Direct” is not possible because of the book medium and perception of readers.</p>
      <p>j a m e s</p>
