      <p>The fact that <em>final</em> or <em>full</em>—for this is closer to what is claimed—signification is endlessly postponed does not leave the text a void, it leaves it open to a continuous and fertile play of signification. That Literary Theory sometimes renegs on this is not Derrida or Foucault’s problem. Also, I am not all that familiar with how Foucault has been applied in Lterary Theory, but (for instance) in it’s domain (the history of science) I find Georges Canguilhem’s Foucaultian <em>The Normal and the Pathological</em>, monumentally enlightening.)</p>
      <p>I do not have a Derridaian text ready to hand. It is the force of his  accumulated arguments that I find, at least for the most part, compelling. And this is part of what they add up to: “Nothing (at least nothing finite) is a Spinozistic substance that exists in itself and is conceived through itself. Everything is and is understood through it’s others. The importance of this for cultural theory is that it helps to underscore the radical relativity of everything finite, and thus of all cultural processes and artifacts. They are and they mean only in contexts they neither create nor control. And since these contexts are in continuous historical flux, the being and the meaning of culture and it’s components is never final or finished.” (Merold Westphal in “Deconstruction and Christian Cultural Theory: An Essay on Appropriation”)</p>
      <p>Did Shakespeare really acheive impersonality? Or was his narrative voice large enough to embrace the tug of contradictory perspectives? Are you acheiving Shakespearean impersonality in your dismiss of post modernism?</p>
