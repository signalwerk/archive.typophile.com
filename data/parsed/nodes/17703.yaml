      <p>Again, sometimes but not always. In the hands of certain writers it can happen. They get lazy and stop trying, pressing the keys but no longer articulating. The best analogy I can make is again with movies. Reknowned critic of actors David Shipman once wrote of Charles Bronson, “...Now that he was a star he was no longer required to act.”</p>
      <p>Truely creative and imaginative writers are able to prevent the decay of their prose into stock rhythms and devices. Hemmingway did it with forceful, almost blinding emotional wisdom and clarity of voice in the one about the big fish. Philip K. Dick did it with the uncanny perceptiveness of his characters as they think aloud, combined with neat and skillful control of suggestion, and cinematic, fluid scenery. Dick was unbelievably clever in a philosphical way.</p>
      <p>Note: Some of the words in this post have been used before, but this time I used a thesaurus.</p>
      <p>j a m e s</p>
