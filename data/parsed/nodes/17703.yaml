      <p><em>...norm-violations are robust...enhance the saliency—and...cue-value—of just those features...criterial to effective wordform resolution.</em></p>
      <p>Which makes them noticeable, or memorable. Naturally, higher level abstract cognitive process takes up after word-picture data is read, and gestalt meaning of a text by way of ratiocination. </p>
      <p><em>...biophysical or vision science level...at the visual cortex ...</em></p>
      <p>About the visual cortex. Have you looked at axon modelling as the physical basis for memory and shape recognition? Susan Greenfield’s <em>Brain Story</em> makes me wonder if that specific part of the human brain, using axon modelling, is involved in word shape recognition.</p>
      <p>According to neuroscientists the human brain has a substantially greater capacity for shape recognition than any other primate, and apparently this is linked to, or engineered by our need to recognize the differences between individual human faces—-as a survival skill.</p>
      <p>Anthropologists have taken this up as a way of helping to explain the superiority of Homo Sapiens over Neanderthals, and why Neanderthals died out. For example, if they had difficulty recognizing one individual from another, or the subtleties of facial expression, Neanderthals may also have struggled to detect a lie by reading a face, placing them at a disadvantage. In examination of artefacts like tools and personal items Neanderthals are seen to have less creative ability (they weren’t as good at crafting objects d’art).</p>
      <p>j a m e s</p>
