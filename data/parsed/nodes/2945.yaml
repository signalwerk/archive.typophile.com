  - id: 140479
    user: 108
    date: 2004-02-07T08:29:00
    date_raw: 7 Feb 2004 — 8:29am
    votes: null
    html: <p>Tom, I've been thinking about this, and reading what the others have been saying. It seems to me, that while the illustrative part of this is playful and organic the type is toooo rigid, and I'm not referring to the Vendetta, not necessarily. The rundfunk seems to call so much attention to itself (to me) that the illust. loses it's impact.  <br> <br> <br>What about typefaces with similar bone structure, but without being "fussy"? Nick Shinn's <a href="http://www.myfonts.com/fonts/shinn/eunoia/regular/testdrive.html?s=TRENT%27S%2BPRINT%27S&amp;p=48" target="_blank">Eunoia Regular</a>? It has the same contrast as Rundfunk. You might even think about something without so much contrast.  <br> <br>Just ideas. <br> <br>More spacing in the Vendetta was a good call.  <br> <br>Do you "need" the rule at all? It also seems to drive away from the illustration more than it helps. <br> <br>One more thing. What if you stacked the slogan and made it a little bigger opting for the lighter weight?  <br> <br>Breaking through Autism <br>with Artistic Expression. <br> <br>I think it makes too much of a statement not to be punctuated too.</p>
    html_clean: <p>Tom, I've been thinking about this, and reading what the others have been saying. It seems to me, that while the illustrative part of this is playful and organic the type is toooo rigid, and I'm not referring to the Vendetta, not necessarily. The rundfunk seems to call so much attention to itself (to me) that the illust. loses it's impact.  <br> <br> <br>What about typefaces with similar bone structure, but without being "fussy"? Nick Shinn's <a href="http://www.myfonts.com/fonts/shinn/eunoia/regular/testdrive.html?s=TRENT%27S%2BPRINT%27S&amp;p=48" target="_blank">Eunoia Regular</a>? It has the same contrast as Rundfunk. You might even think about something without so much contrast.  <br> <br>Just ideas. <br> <br>More spacing in the Vendetta was a good call.  <br> <br>Do you "need" the rule at all? It also seems to drive away from the illustration more than it helps. <br> <br>One more thing. What if you stacked the slogan and made it a little bigger opting for the lighter weight?  <br> <br>Breaking through Autism <br>with Artistic Expression. <br> <br>I think it makes too much of a statement not to be punctuated too.</p>
