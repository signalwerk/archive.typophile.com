  html: <p>Two years ago I created a logo for a company called Trent's Prints. The company sells artwork by Trent Altman who also has autism.  <br> <br>The company wants to build a website and make brochures, catelogs, etc. Until now the logo has been on business cards only and before alot of money is put into things I want to make the logo better. <br> <br>The font used is Rundfunk. Adobe Garamond is used as the secondary type. My customer liked Rundfunk because it has an "artsy" feel. The icon is a "T" brushed to give a feel for what the company sells. Pms 262 is the color used for the purple and pms 241 is used for the pink.  <br> <br><img src="http://www.typophile.com/forums/messages/29/25389.gif" alt=""> <br> <br>(The purple appears duller than it really is)</p>
  html_clean: <p>Two years ago I created a logo for a company called Trent's Prints. The company sells artwork by Trent Altman who also has autism.  <br> <br>The company wants to build a website and make brochures, catelogs, etc. Until now the logo has been on business cards only and before alot of money is put into things I want to make the logo better. <br> <br>The font used is Rundfunk. Adobe Garamond is used as the secondary type. My customer liked Rundfunk because it has an "artsy" feel. The icon is a "T" brushed to give a feel for what the company sells. Pms 262 is the color used for the purple and pms 241 is used for the pink.  <br> <br><img src="http://www.typophile.com/forums/messages/29/25389.gif" alt=""> <br> <br>(The purple appears duller than it really is)</p>
