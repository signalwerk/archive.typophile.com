    <p>Hi Typos,<br>
    I think of investing in a humanist sanserif font which I would use as a companion for Minion Pro (among other things), mainly for publications about linguistics. Apart from basic and extended Latin character set I also need Cyrillic and Greek, which limits the possibilities substantially. I am a big fan of <a class="freelinking external" href="http://www.fontfont.com/shop/view_product.ep?id=13665" rel="nofollow">Scala Sans</a> (I know, it would be just imitating Bringhurst, but it really is a great font). Scala Sans doesn't include neither Cyrillic nor Greek, however.<br>
    Right now my favourite choice is <a class="freelinking external" href="http://www.fontfont.com/shop/view_product.ep?id=10110" rel="nofollow">Kievit Pro</a> (I wouldn't know whether to pick <a class="freelinking external" href="http://www.fontfont.com/shop/view_product.ep?id=10994" rel="nofollow">Regular</a> or <a class="freelinking external" href="http://www.fontfont.com/shop/view_product.ep?id=11011" rel="nofollow">Book</a> as my point of departure, though).<br>
    Another option is <a class="freelinking external" href="http://www.stormtype.com/typefaces-fonts-shop/families-84-anselm-sans-pro" rel="nofollow">Stormtype Anselm Sans Pro</a>.<br>
    Bringhurst recommends Syntax with Minion - but as far as I can see, the Cyrillic version of Syntax, <a class="freelinking external" href="http://www.paratype.com/pstore/fonts/Humanist-531.htm" rel="nofollow">Paratype Humanist 531</a>, does not include an italic, which is crucial to my needs. And I don't know if there is a Greek version.<br>
    Suggestions are welcome!<br>
    Cheers,<br>
    Thomas</p>
