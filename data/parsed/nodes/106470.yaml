  html: |-
    <p>New to design!<br>
    I have very little experience and only just started to act on my interest in typography.<br>
    This was mostly a dabbler's interest, until recently.<br>
    I submitted my first font, called Whale, to MyFonts. They promptly rejected it and basically said it was totally unprofessional. It's meant mainly for display, so I don't know why I bothered submitting to them in the first place, but I now have a stronger desire to make this font as good as it can be. Maybe even simplify it for use beyond just displays.<br>
    My feelings will not be hurt. I would greatly appreciate a serious critique of my design so that I can make the next version of Whale far better.<br>
    Thanks for your time.<br>
    - Stigmaa</p>
