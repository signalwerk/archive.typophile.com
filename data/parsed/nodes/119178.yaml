    html: "<p>My hunch: This function might be used by few people, so they’re first moving it to a hard-to-find spot in the interface. If anybody complains that the function is gone, they can say: Look, it’s still there—but of course, the result is that fewer people will be using it. If, after a while, the number of users has decreased even further, they might remove the function without a lot of fuss.</p>"
