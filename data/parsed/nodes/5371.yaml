    html: <p>Thanks for the post. I was dreading that it was a custom creation, but if anyone could give suggestions on a similar design, I'd be more than greatful. <br> <br>there are about 6-7 models of car, with this lettering on each, so i guess it could come down to scanning the badges, and creating a font out of it. while I don't have access to all of the letters, I have most, so i guess it's better than nothing. <br> <br>Cheers, <br>Glen.</p>
