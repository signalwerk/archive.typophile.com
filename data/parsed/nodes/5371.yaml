  html: <p>This is a badge on the back of my car... I've seen a few similarities with other fonts, nothing exceptionally close though... (Autotechnica for one)... it's on the back of many GM cars in Australia, ranging from 1987-1997 (possibly later), I've seen about 6 different models, all with the same lettering... <br> <br>I'm hoping it wasn't made exclusively for them, but god knows... here is the image... any help would be greatly appreciated, <br> <br></p><center> <br> &lt;img&gt; <br></center> <br> <br>Thanks guys, and Cheers, Glen.<p></p>
