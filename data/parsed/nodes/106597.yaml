    <p>Hi,</p>
    <p>I'm looking for a font that is near identical to Gotham Condensed Ultra.  I would purchase this font from Hoefler but do not sell this font on it's own but combine it with the set for £500! Anyway, I would love to hear from someone who could suggest a couple of alternatives.</p>
    <p>Many thanks,</p>
    <p>Colin</p>
