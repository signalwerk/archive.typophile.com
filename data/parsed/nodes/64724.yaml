      <p><em>I found the high-res image posted on a Flickr site</em></p>
      <p>Is it hi-res enough that you can see if there are halftone dots? If so, the person who posted it probably scanned it out of a book. In that case, continue your online research in the hope of finding the publisher, and contact them, because if any copyright records exist, a publisher is the most likely to have them. </p>
      <p><em>What about when someone makes a dingbat font with approximations of famous faces and images in high contrast?</em></p>
      <p>For better or for worse, US copyright law doesn't protect fonts, but it does protect photographs.</p>
      <p><em>if you say I actually have to consult a copyright lawyer (at considerable expense, I’m sure) I will leave those 3 images out.</em></p>
      <p>A worst-case scenario is that you take a chance, publish the picture in the book, and it is seen by a someone who turns out to be a legitimate copyright holder, and he/she successfully sues to have all copies of your book recalled from bookstores at your expense and destroyed, along with all copies in your own inventory, preventing you from earning back any of the money you invested in printing and binding. Now <em>that's</em> a considerable expense. </p>
      <p>The good news is, that's very unlikely to happen with such an old and obscure image. But my advice is, never gamble more than you can afford to lose.</p>
