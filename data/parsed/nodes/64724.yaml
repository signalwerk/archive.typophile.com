      <p>Anything pre-1927 has passed into the public domain. After 1927 things get messy depending on what country you’re in, what country the item was created/copyrighted in, and whether or not the copyrights have been renewed over the years. But there’s a nasty catch—reproductions of the images are copyrighted. For example, you can’t just scan a photo out of a book to reproduce without permission; you would need to photograph or scan a work yourself.</p>
      <p>I would be very careful about reprinting the images from Flickr. Sure they might be posted by someone scanning his antique photos, but they could also be Corbis stock photos that got posted to the internet. If you really need to use them and can’t get clear copies, consult a copyright lawyer before you print them. As for the Mucha images, contact the museum; most museums will sell you their images for very reasonable fees that they very much deserve given the cost and effort of preserving and photographing.</p>
