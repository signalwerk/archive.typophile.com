      <p>Re all remarks about the size of an image not mattering: There is a recognized type of <em>fair use</em> of copyrighted material, eg "quoting" and illustration in certain works. If you do not use illustrations per se, but in the course of an evaluation or such, you may use an image, providing it is not too large (in the sense that the illustration is not the main item on a page, I guess).<br>
      I know this is kind of a gray area, but there are many precedents.</p>
      <p>In your case I would tone down the size of pictures of 'dubious' origin.</p>
      <p><a href="http://en.wikipedia.org/wiki/Fair_use" title="http://en.wikipedia.org/wiki/Fair_use">http://en.wikipedia.org/wiki/Fair_use</a></p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
