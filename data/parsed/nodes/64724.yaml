    <p>This isn't related to type, but some of you must've dealt with this before. THANKS in advance!</p>
    <p>Below is a spread I'd like to include in my book. The topic here is retro costume influences. I'd like to refer to the silent film era and the Art Nouveau classics of Mucha. How do I find out if I'm allowed to use these 100-year-old images?</p>
    <p>On the left is an image of an obscure (in this country) silent film star with the look I wanted. I found the high-res image posted on a Flickr site that was an homage to the era. I asked the owner where this image came from, if it was copyrighted, and could I print it. Got no response, which makes me wonder if it IS copyrighted. </p>
    <p>On the right are Mucha art images I've seen on several websites, but will printing them high-res (in black and white) get me into trouble with the Mucha Museum, for instance?  </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/14-15_6406.jpg"></div><p></p>
  html_clean: |-
