    html: |-
      <p>Assuming that you want to keep the same general look (as opposed to a new logo), I'd keep them tight as one word. Otherwise you just have 3 words set in type rather than a distinctive logo. But you could certainly do something more interesting with it. </p>
      <p>Off the top of my head, one possibility would be to put "Pro" in a lighter weight (since I'd consider it the least important word in the phrase). Make the weight differences enough that the difference is immediately obvious.</p>
      <p>If that font is available in a slightly condensed version, you might see how it looks to slightly condense the whole logo, to reduce the length a tad. (But don't try condensing it manually in Photoshop by reducing the width, as that will distort the height/width ratios of the strokes.)</p>
      <p>Another possibility is to put "Action" in italic.</p>
      <p>By the way, your Photoshop Actions look great. I almost bought it a few years ago when a client wanted me to convert a book cover image into a 3D book, but since the budget was tight I ended up doing it myself. Came out okay but not as good as what your product does.</p>
