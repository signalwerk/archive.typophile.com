  html: |-
    <p>Hey guys,</p>
    <p>Looking for some input regarding my three word logo. This is my own website/product that's been established now since 2005. It's a book cover plugin for Adobe Photoshop.</p>
    <p>Would you combine these three words or make them separate in a logo? "Cover Action Pro".</p>
    <p>I've tried making the word "Action" thinner to create more contrast but it just doesn't look right and giving one of the words color looks strange.</p>
    <p>Any advice?</p>
    <p>Thanks in advance :-)</p>
    <p>-Mark</p>
