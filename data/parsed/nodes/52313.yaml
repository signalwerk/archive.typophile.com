    <p>Hey everyone,</p>
    <p>I’m redesigning a business card for some interior designers. I had already designed their logo (approximately 5 years ago) and they’re still happy with it &amp; so am I. I’m using these business cards as my first step towards the new direction - so it would be great if you can critique the cards along with the overall look.</p>
    <p>I always flexed the use of whitespace along with grey type. I will be staying in this direction.</p>
    <p>One of the new elements I want to introduce (and get your opinion on) is the halftone usage on the left of the cards. My goal was to simulate a snowfall - I didn’t want to put the elements at the top of the card, I found it would be too literal.</p>
    <p>I want to introduce the halftone as embossing, debossing or spot varnish. However, the cards will be uncoated, I’m not sure if I can use a spot varnish. Although I appreciate being subtle with the halftone, I’m wondering if it will show enough.</p>
    <p>Anyways, I appreciate any help or commentary!</p>
    <p>Thanks!</p>
