      <p>Salut!  I second the idea of adding an ’s’ in ’dgn’.  For my I read Igloodugun.  If it were to say <em>igloodsgn</em> I’d have to read it as ’igloo desugun’ which I would interpret as design!</p>
      <p>Looks decent, I believe it needs more contrast to be readable, but instead of toning it up to a black, why not tone it up to that medium blue you see in the shadows of snow.</p>
      <p>If this is about igloos the thing ought to use the same colours as snow anyway right?</p>
