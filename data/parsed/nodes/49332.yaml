      <p>The last police report I filed in Madrid had a mix of Arial, Times New Roman, and, you guessed it, Comic Sans.  I thought they had some too on my tax return but I just checked and it doesn't.  Heh, at least one branch of the government has it right.  My pre-application form for the TED program at UAM also sported it.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
