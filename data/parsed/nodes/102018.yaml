    html: <p>For a webfont, you'll want to see how it renders across different browsers/platforms/sizes. MyFonts used to have browser-screenshots, but they seem to have disappeared... there are <a class="freelinking external" href="http://www.fonts.com/font/canada-type/roos/roman/web-font#browser-preview" rel="nofollow"> a few previews at fonts.com</a>, though they only seem to license webfonts by subscription. (BTW, Roos is <a class="freelinking external" href="http://www.youworkforthem.com/font/T1244/roos" rel="nofollow">currently on sale at YouWorkForThem</a>.)</p>
