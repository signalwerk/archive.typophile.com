      <p>&gt;&gt;You can install webfonts on your machine.&lt;&lt;</p>
      <p>This depends on what the company chooses to deliver as "web fonts". If you only get .eot and .woff files, you can't install them on your machine. Likewise, even if you get .ttf files, some companies manipulate the fonts so that they can't be installed on a computer.</p>
