  html: |-
    <p>So I'm generally a print designer, but I'm rebranding a boutique that also wants a website done. When creating their brand standards, I want a consistent font for body text online and in print. I've found a font that appeals to both the client and myself called "Roos." We're interested in purchasing the entire family (for $149) and we're give the option of OTF or Webfont version.</p>
    <p>I've never implemented a Webfont before, since I don't generally do web design (and we will be using a professional web developer to deal with development of the site.) I've been googling and googling, but I can't seem to find the answer anywhere. This company will need to use the font on the web as well as on print materials such as postcards, business cards, and lookbooks. Will we have to purchase both both the Webfont version and the OTF version to accomplish this? Or will we be able to use a Webfont file in Illustrator, Photoshop, and InDesign?</p>
