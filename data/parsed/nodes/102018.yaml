    html: |-
      <p>Web-fonts and Print-Fonts, in 99% of the cases, are pretty much the same thing just converted from OTF to TTF, Autohinted, and converted again and packed in other formats such as WOFF or EOT. They are sold under different licenses simply to collect more money, under a variety of different arguments (For example: it's a different kind of usage, they are uploaded to the web, etc, etc...). This will piss off a lot of people here, but it's the way it is.</p>
      <p>There are a few notable exceptions, where web-fonts where specially designed/tailored for the web and have key differences compared to their print-version (bigger x-height, wider, open counters, loose spacing, less contrast, etc...) such as the Webtype RE series, H&amp;FJ smart screen fonts, Typoteque Screen fonts, and some other smaller foundries such as Monokrom and Letters From Sweden. There may be others that I'm missing now, but so far very few. (It will be nice if someone can compile a list of "Real web-fonts" vs "automated conversions"). This are the "Real webfonts", and not just plain conventions.</p>
      <p>FontFont Screenfonts are also hand-hinted, but not optimized in x-height, counters, etc.... This ones can work well also. As they where hand-picked from their extensive library for already having such features in a way that look good in the web without adjustments needed.</p>
      <p>At Google Webfonts you will find both kinds. Some are Print-fonts converted for web use, and some are specifically tailored for the web, such as: Open Sans, Source Sans, Merriweather, Domine, Libre Baskerville and a few more. You can also download those and use them for print (but they will not be optimal since they will look bigger than usual). They are all released under a 'Libre' license, so they can also be used for commercial projects.</p>
      <p>In the case of Ross, I guess it's an automated (or maybe semi-automated) conversion. And since the ascenders and descenders are large, my guess is that it will look small on the web if used at standard text sizes. You will need to use it bigger on the web (from 18 to 22px or maybe more) in order to be readable. If that's not a problem for you, it will work fine. It's a very nice font.</p>
