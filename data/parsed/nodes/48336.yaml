  html: |-
    <p>Hello and Shalom.<br>
    my name is yaron from israel.<br>
    i usualy deal with hebrew typography, so this is quite new for me and i would love to get another opinion on this.</p>
    <p>this is a photographer that deals with photojounalism on one side, and artistic nude and foot fetish photography on the other side.<br>
    the key words were "bold, lacks inhibition, but also sophisticated, sexy, and sensous"<br>
    therefor i searched for bold and italic fonts like<br>
    "bauer bodoni black italic" which really gave me that kind of feeling.</p>
    <p>i showed the client a type test with some 50 fonts related to that style, and we agreed on the bauer bodoni combined with the "F" letter of "Benguiat" font.<br>
    along the way i noticed seceral problems like "il" letters and the "fi" ligature, so i tried to work it out.</p>
    <p>i would like to get a critique for a logotype, especially concerning kerning and typo :)<br>
    i can't change the font because of tight schedule, but i would like to hear your opinion on my font choice.</p>
    <p>thanks alot,<br>
    Yaronimus<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/logo sk_5064.png"></div><p></p>
