      <p>Yaron,<br>
      I meant the space between Ilia and Yefimovich, my feeling is that given the tight kerning of the names that space is just too wide.</p>
      <p>As for the logo being too long, it might present a problem – at a small size you might need to look at a more spaced version at the smaller (business card) sizes. I think adding a strap line would give you a hefty block which could be clumsy to work with in a layout. </p>
      <p>Tim</p>
