      <p>ana. </p>
      <p>[ I would say ]  ::  'experimental typography' is the process creating letterforms for the sake of the form itself — not for the purpose of expression or legibility, but for the sole reason of interpreting the alphabetic symbol as a shape with infinite possibilities of positive and negative space. </p>
      <p>That's just my opinion (in a run-on sentence).</p>
      <p>Good luck with your thesis!</p>
