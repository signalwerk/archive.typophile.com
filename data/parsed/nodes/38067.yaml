    <p>Hi,</p>
    <p>I'm in a process of writing my thesis on Typographic Space. I have been struggling to clearly define the meaning of ‘experimental typography’. I think ‘experimental typography’ is a self-reflection; it can never result in the final solution and is primarily intended for theoretical discussion.</p>
    <p>How would you define it?</p>
