    html: <p>Ricardo - In my thesis, I am stating that the use of space in typograohic design by their very nature are dependent on and defined by convetions. I also state that these common patterns have inspired me to use experimental typography in my practical work in order to investigate the use of space in typographic layouts. Now, I need to clearly state what I mean by 'typographic experiment'. There are a lot of definitions made by a lot of designs but none seem to be clear or defined.</p>
