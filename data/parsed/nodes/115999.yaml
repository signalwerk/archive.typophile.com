  html: |-
    <p>When do you all use Optical kerning or do you usually leave it at Metrics?</p>
    <p>Most of the time, switching to Optical looks much better to me and it's usually pretty different, even with Adobe or HF+J fonts. However, I know foundries carefully work out the pairing spacing, so I never know if I'm just wrong when I switch to Optical.</p>
