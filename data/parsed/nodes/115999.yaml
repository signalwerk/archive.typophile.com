    html: |-
      <p>Metrics *should* be the preferred option. Pro fonts have mostly been kerned to near perfection. On the other hand, there are nice looking fonts out there that have worthless kerning and these will benefit from using this Adobe feature (based on a theory of David Kindersley, if I am not mistaken — viz: <a href="http://www.kindersleyworkshop.co.uk/spacing/" title="http://www.kindersleyworkshop.co.uk/spacing/">http://www.kindersleyworkshop.co.uk/spacing/</a> ).</p>
      <p>BTW  I do wish Adobe would include in InDesign etcetera a feature from QuarkXPress (…used to have, maybe, because I left QXP behind when ID 1.5 came out): the opportunity to define global tracking (as Quark called it) for specific sizes. As you should know smaller sizes need more tracking than larger ones.</p>
      <p>More info here: <a href="http://www.graphics.com/article-old/design-fundamentals-kerning-and-tracking" title="http://www.graphics.com/article-old/design-fundamentals-kerning-and-tracking">http://www.graphics.com/article-old/design-fundamentals-kerning-and-trac...</a></p>
