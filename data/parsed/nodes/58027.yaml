    html: |-
      <p>The second version works nicely with the t and g but I think the first version would be more normal. I'd actually suggest making the left arm slightly slightly steeper and the join down slightly below the baseline I think.</p>
      <p>You might need to thin the joins on the bowl and stick letters.</p>
