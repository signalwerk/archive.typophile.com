    <p>CONFERENCE:</p>
    <p>Based on the success of the Granshan non-Latin typeface design competition held each year since 2008, the Granshan 2013 non-Latin conference will travel to Southeast Asia for its second incarnation:<br>
    <a href="http://www.granshan.com/" title="http://www.granshan.com/">http://www.granshan.com/</a></p>
    <p>Organized by Typographische Gesellschaft München (tgm) and its partners*, the core of the event is comprised of four days at the end of July featuring workshops, presentations, exhibitions and a symposium. With presenters and attendees from all corners of the world, Granshan is the only conference focused on non-Latin typefaces. As such, it has itself become a focal point of this rapidly growing and maturing field.</p>
    <p>* <a href="http://www.granshan.com/en/good-ideas-strong-partners" title="http://www.granshan.com/en/good-ideas-strong-partners">http://www.granshan.com/en/good-ideas-strong-partners</a></p>
    <p>--</p>
    <p>COMPETITION:</p>
    <p>Now in its 6th year, the increasingly prestigious Granshan competition has added Chinese to the list of writing systems the jury is qualified to judge.<br>
    <a href="http://www.granshan.org/" title="http://www.granshan.org/">http://www.granshan.org/</a></p>
    <p>Organized by the Ministry of Culture of the Republic of Armenia along with Typographische Gesellschaft München, the competition entry fee is a modest 20 Euro, and a grand prize of 1000 Euro will be awarded. The deadline for entry is the 20th of September.</p>
    <p>hhp</p>
