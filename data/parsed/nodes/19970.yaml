      <p>Ok, here are a few alternative compositions.</p>
      <p>First up, i’ve tried to maintain navigation that is attached to the photo.  It’s hard to accomodate portrait and landscape orientation because unless the whole lot moves around (which is a nav/usability nightmare) the different orientations leave very different whitespace.  So its hard to balance the page.</p>
      <p>Heres the results:<br>
      portrait: <a href="http://www.design839.com/comps/comp_002_portrait.jpg">http://www.design839.com/comps/comp_002_portrait.jpg</a><br>
      landscape: <a href="http://www.design839.com/comps/comp_002_landscape.jpg"> http://www.design839.com/comps/comp_002_landscape.jpg</a></p>
      <p>Needing more flexibility, if I detach the groupings from the actual photos, that means photos can be arranged a bit more elegantly, something like this:</p>
      <p>portrait: <a href="http://www.design839.com/comps/comp_003_portrait.jpg">http://www.design839.com/comps/comp_003_portrait.jpg</a><br>
      landscape: <a href="http://www.design839.com/comps/comp_003_landscape.jpg">http://www.design839.com/comps/comp_003_landscape.jpg</a> </p>
      <p>What do you think (and apologies for getting off topic a bit, i guess we’re talking more about layout than typography now… sorry!)</p>
