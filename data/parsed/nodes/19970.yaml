    html: <p>I find “PORTFOLIO” out of place, and I wonder why it is condensed.</p>
    html_clean: <p>I find “PORTFOLIO” out of place, and I wonder why it is condensed.</p>
  - id: 123791
    user: null
    date: null
    date_raw: null
    votes: null
    html: |-
      <p>Yep, i agree that it is out of place.  Everything else is trying to be organic, and the word “PORTFOLIO” seems a bit to clean or geometric.  I guess it doesnt really add anything.  It just kinda sits there.  Maybe it would be best to leave it out all together?</p>
      <p>As far as being condensed, well there was no particular reason for that.  I’ve noticed that I tend to lean towards condensed faces though, not entirely sure why, maybe because i feel like they have more impact. </p>
      <p>What is the traditional use for condensed faces?  I always thought it stemmed from newsprint where column widths are narrow and the space is expensive, so bold condensed faces are used at hight point sizes than copy to make the biggest impact in the smallest space?</p>
