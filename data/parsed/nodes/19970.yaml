      <p>Given the organic nature of the design I would look at redrawing the tabs so that little nick in the top left doesn’t repeat. As discussed Portfolio is out of place and not really required. I wonder about the overall composition the tabs and the picture select boxes hem in the top and right, if the tabs pulled from the bottom of the image (or under the picture select boxes) and Portfolio was dropped you would be able to show the images at a larger scale and give you room to manoeuvre when it comes to pictures with different proportions. the “stitched edged” type in the background also seems a bit extraneous the point of a portfolio is ultimately to show the work to its best and the neutral oatmeal background is probably enough.<br>
      Tim</p>
