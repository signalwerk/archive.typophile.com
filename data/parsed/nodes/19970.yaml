    <p>Heya everyone,</p>
    <p>I’d really appreciate any feedback you feel like give on this online photographic portfolio.</p>
    <p>So far its been through a few rounds of changes, and i’m starting to feel like it is nearly done.  The client is pretty happy with it, but i’d really like some non-biased critique.  </p>
    <p>Unfortunately i dont have the luxury of an artistic director, so it can be really difficult to recognise potential problems and find ways to make things better.</p>
    <p>Its worth noting that i’ve used raster previews of Relay Regular and Fresco Script from Fontshop and removed the watermarks.  This means i have no tracking/kerning control.  Of course, i’ll buy the faces when i know they’ll definitely be part of the website.</p>
    <p>Cheers for all your input!</p>
    <p>~ Update ~<br>
    Alternative compostitions (refer to post below for explanation)</p>
