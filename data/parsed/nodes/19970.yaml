    html: |-
      <p>Yeah, absolutely re: nicks on the tabs.  At construction time, these will be made unique.</p>
      <p>Good ideas about navigation alterations too.  I think the navigation needs to have proximity to the photo display area otherwise it might start feeling like a regular website with normal menus etc.  I’m not sure about pulling tabs ‘down’ though, it doesnt seem right.  In reality, if you were looking down at a desk, it would be easier/more natural to reach over a photo and pull away from the body as opposed to pulling one towards your body.   Maybe pulling them left to right from behind the image select boxes could work.  It would offer the same sort of flexiblity for different orientation (which i hadn’t even thought about!  What am i going to do with portrait?)</p>
      <p>Hm, this raises many questions…</p>
      <p>I’ll shuffle some things around and post again soon…</p>
      <p>Cheers Tim!</p>
