      Typographers could also use the feature for text setting, if they thought the glyphs were suitable.<br>
      It would also be possible for foundries to include the cap German double-S in such an alternates set, as well as other Germanisms such as the "tz" ligature (see Eichenauer above) and the "ch" where the characters are practically touching. Do these uses require special contextual consideration, eg for Wortfugen?</p>
      <p>It would be good if a German type designer could put together a standard set of specs for such an OpenType feature. It's the kind of thing I would love to include in my OT fonts.</p>
      <p>On second thoughts, not standard, but it would be nice to have a list of the alternate glyphs and where they might be applicable, so non-German type designers could be better informed about what was appropriate to include in their fonts, and how to do it.</p>
