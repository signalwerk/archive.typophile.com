      <p><em>History decides which “affectations” become adopted as part of the canon.</em></p>
      <p>I have a collection of grammars for various languages, many of them dating from the 16th-18th century, and I'd be inclined to argue, based on their content, that most decisions about orthographic practice have been made by grammarians, not by typographers. On the subject of Greek accents, which we have touched on here and spoken of at greater length elsewhere, you will find entire volumes devoted to nothing but their correct placement.</p>
      <p>When a magazine art director decides that 'the requirements of the typographic layout' demand possible ambiguation of text, it seems to me that his is looking at the whole thing backwards. Since when has typographic layout involved 'requirements' that override the integrity of the text? I don't think there are any such requirements, and if one creates such requirements in a layout then it isn't a very good piece of design, no matter how lovely it might look. If you have to abuse the text in order to typeset it, there is a problem.</p>
      <p>But let's assume for a moment that your dictum is correct. It seems to me that history has plainly not accepted as canonical the typographic affectation of Paris Match in the 1960s. No one does this now, and I doubt if anyone else did it then: it was and remains idiosyncratic and hence, I argue, an affectation.</p>
    html_clean: |-
