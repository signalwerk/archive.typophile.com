      <p>Omitting accents from capital letters is rather common, because of the difficulty of finding room for them. Obvious solutions involve apparent leading or shrinking the letter to make room for the accent.</p>
      <p>If this practice, bad though it may seem, is common enough that readers expect it, it doesn't create a serious problem in ambiguity for reading.</p>
