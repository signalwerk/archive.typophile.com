      <p>Tim, I'm going to say (cautiously, at first) that you can probably go ahead on this one.</p>
      <p>Can you upload a scan from your specimen, so that we can see what these letters look like? I'm only vaguely familiar with Chappell's oeuvre, and don't know Eichenauer.</p>
      <p>Here's the deal, as far as I can say (and I am not a lawyer!). It sounds like you are saying that Gustav Eichenauer commissioned this design, no? If he commissioned it, and not a foundry, then only two groups could possibly have rights to the face—Chappell's or Eichenauer's descendants. This is unlikely, but possible via a myriad of channels.</p>
      <p>If this was done for a foundry, then the successor foundry of that foundry could theoretically have a trademark on the name "Eichenauer," but most likely no protection on its design.</p>
