      <p>Yes, certainly there are issues of technology and expediency invloved in accent-dropping.<br>
      But it is also true that there are typographic reasons. In all cap settings, accents are visually over-obtrusive, and get in the way in many kinds of layout.</p>
      <p>I think the Greeks have it right: you don't need accents in all cap setting, because if the reader requires legibility help, the setting should be in U&amp;lc anyway. It seems to me that the retention of accents in all-caps that one finds in practice (eg Canadian French) is the work of attentive editors: I applaud them for their attention to detail, but would suggest that the rules may be eased in certain layout circumstances.</p>
