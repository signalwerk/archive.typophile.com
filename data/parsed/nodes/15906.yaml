      <p>Dan, </p>
      <p>In the European Union, copyright is an unregistered right (unlike patents, registered designs or trade marks). Copyright comes into effect immediately, as soon as something that can be protected is created and fixed in some way, e.g. on paper, on film, via sound recording, as an electronic record on the internet etc. </p>
      <p>As you can draw from the UK Patent Office's description (<a href="https://web.archive.org/web/20150123220403/http://www.patent.gov.uk/copy/definition.htm" title="http://www.patent.gov.uk/copy/definition.htm">http://www.patent.gov.uk/copy/definition.htm</a> ), copyrightable works include original artistic works (paintings, engravings, photographs, sculptures, collages, works of architecture, technical drawings, diagrams, maps, logos), published editions of works (the typographical arrangement of a publication) and other expressions of human creativity. </p>
      <p>In order to to get copyright protection, a work needs to be the result of independent intellectual effort. The UK Patent office gives the example: technical descriptions, catalogues and engineering drawings are all examples of material that qualifies for copyright protection, whatever the subject matter. Previously in some legislations, the material needed to have novelty or aesthetic value but this is no longer the case. So altogether, copyright -- at least in the European Union -- offers broad non-bureaucratic protection for all sorts of intellectual efforts. </p>
      <p>Copyright does not enumerate the kinds of works in any way. Since this does not *exclude* typeface designs in anyway, it includes them. There is no need for any special legislation that offers explicit protection for typeface designs, just like there is no special legislation that explicitly protects literary translations, web graphics or photographic collages. </p>
      <p>In Germany, the situation is a bit peculiar since there is the "Schriftzeichengesetz" ("typeface law") which offers explicit specific "industrial" type of protection for typeface designs. I have spoken to lawyers who explained to me that this law, however, does not automatically exclude typeface designs from general copyright protection but instead, offers additional explicit protection -- which, as such, requires fees and registration. International copyright treaties, esp. the Berne convention, rule that when a work gains copyright protection in one country, the same protection must be awarded in other countries as well that are sides of the treaty. </p>
      <p>Since there is no reason why copyright should not protect typeface designs in the UK, Spain, France or Poland, according to the Berne convention these designs are also copyrighted in Germany -- despite the existence of the Schriftzeichengesetz. </p>
      <p>The Schriftzeichengesetz was a by-product of the Vienna convention that was an effort of ATypI and WIPO in the 1970s. Since the copyright protection was pretty weak back then, ATypI pushed for special legislation. The convention was signed but never went into effect because only two countries ratified it. Germany was the only country that actually implemented the convention in form of the Schriftzeichengesetz. </p>
      <p>Of course, as with any work, the issue whether a *particular work* is copyrightable can be definitely answered only in court, if one side of a conflict claims that a material is copyrighted and the other side challenges that by claiming that the work does not fulfil the criteria of copyright protection (e.g. it's not a result of an individual intellectual effort). </p>
      <p>I'm not aware of any court decisions in Europe that would declare that typeface designs are not copyrightable (it's different in the U.S.). On the other hand, I know of court trials in Poland that ruled that typeface designs have explicit copyright protection. </p>
      <p>The issue of the digital font code is completely different. Fonts are protected in the U.S. as software programs, and in other legislations either as software programs or databases. In some countries, databases have a special legal protection while in others they're protected by general copyright. </p>
      <p>Altogether, both typeface designs and digital fonts enjoy automatic free protection in EU countries. While typeface designs may not have protection in the U.S., one can always sue a distributor in a certain country where the protection applies. As a result, for example, pirated typeface designs can be banned from sales in the European Union while it will be still possible to sell them in the U.S. </p>
      <p>But as I said, in general, typeface designs *are* protected by copyright. </p>
      <p>Best,<br>
      Adam</p>
