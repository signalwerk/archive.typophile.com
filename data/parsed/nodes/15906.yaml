    <p>Warren Chappell designed a font called Eichenauer (for Gustav Eichenauer, who cut the type in lead) in 1955, but it was never manufactured and released. To this day, I don't think there has been a digital version, either.</p>
    <p>I would very much like to do a digital version of this type, but I am not sure how to pursue this. First of all, we're talking about something from the 1950s rather than the 1650s, so there is a question of legal rights. Does someone hold the rights to the design? If so, how can I find out? Can I proceed anyway? Second, I would like to work from original materials as much as possible. A proof from the type is reproduced in Chappell's <em>Short History of the Printed Word</em>, so I figure I can contact the original publisher (Knopf) for more information. Any other ideas?</p>
    <p>I'd appreciate any insights on this. Thanks.</p>
