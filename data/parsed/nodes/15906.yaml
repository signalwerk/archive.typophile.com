      <p><em>Actually, in most languages with accented caps, it’s incorrect to omit them. Including French. And including Canadian French, I presume.</em></p>
      <p>Correct. A lot of French people will tell you that they don't use accents in all-caps, but this is a remnant practice dating from typewriters that didn't have keys for uppercase accents. In quality French publishing, caps have always had their accents.</p>
      <p>Greek is a different matter, and all accents except the dialytika a correctly dropped in all-caps settings. Since this involves some contextual funkiness, I recommend using the  feature for Greek all-caps and smallcaps accent handling. If users do decide that they want the accents on the caps, they can turn off the  feature.</p>
