      <p>Currently, in most countries copyright protection lasts up to 70 years after the author’s death. There are people who believe that typeface designs should be protected through copyright. If you are such a person, I believe it is only morally correct to act *as if* that copyright protection were already in place. </p>
      <p>Wait... Actually, it *is* in place, just not in all countries (e.g. not in the U.S.). So obeying general copyright rules when doing a revival is not only a moral but also a legal obligation -- if you plan to publish the font worldwide. </p>
      <p>Of course you can also do a risk analysis: what is the chance that the widow or the children of a deceased author (typeface designer, painter, writer etc.) will ever sue me if I *don’t* ask permission? If you think that risk is minimal, you are free to go ahead and do whatever you want to do no matter what. But I doubt that such actions would have actual legal standing, or that they would be ethically clean. </p>
      <p>A.</p>
