      <p>Dan, </p>
      <p>the thing with copyright is that you cannot make a generalized statement "copyright protects typeface designs" just like you cannot say "copyright protects music". Music, literary works or graphic creations -- including typeface designs -- are protected by copyright as long as they fulfil the criteria: individuality and originality. This is not a simple question -- many Ph.D. theses have been written on copyrightability criteria. The bottom line is: whenever there is a conflict, a court must decide in an individual case whether something is or is not protected. This is as true for typeface designs as for musical pieces. </p>
      <p>The U.S. law works completely different from European law so forget about any comparisons :) </p>
      <p>Best,<br>
      Adam</p>
