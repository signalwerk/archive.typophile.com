      <p>Well, for anyone out there who cares to follow my efforts on this, things are pretty dry. I have not been able to locate any heirs, nor have I been able to locate any source materials yet. I never received a reply from the Knopf archive staff, but Robert Bringhurst has informed me that the image used in the book was most likely a personal photograph. So, if it exists at all, it would probably not be in the Knopf archive.</p>
      <p>It looks like my last and best hope might be the Waren Chappell Art Collection at Columbia University (<a href="http://www.columbia.edu/cu/lweb/eresources/archives/collections/html/4079660.html" target="_blank" rel="nofollow">http://www.columbia.edu/cu/lweb/eresources/archives/collections/html/4079660.html</a>).</p>
      <p>I guess if I cannot locate anything more on the original design, I might still work from the image in the book and end up with something at least "inspired by" Chappell's Eichenauer.</p>
      <p>Regards,<br>
      tim</p>
