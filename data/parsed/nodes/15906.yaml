      <p>The reason that German can now set three s's in a row has to do with the new writing rules that were completed (sort of) in 1998, and which went into effect (sort of) in August.</p>
      <p>Although I like many of the reforms, they are almost all contoversial. And I suspect that many of them will change. Three letters in a row does not make linguistic sense, even in German. "Schlossstrasse" (Castle Street) may be the proper way to type today,* but that doesn't mean that it is good. Making a capital double-S in my opinion would just be a cop-out way of standardizing too many other peoples' mistakes. I'm sorry if I sound a bit harsh here, but I really dislike this whole capital double-S idea, and I applaud the Unicode Consortium for pointing out that it has no sufficient base in German language, history, or tradition.</p>
      <p>*In the past, Schlossstrasse would have been spelled Schlosstrasse, Schloßstraße, or even Schloszstrasze. Today, a sensitive typographer would put in a space between those two words—which is fully within his right as a designer—and set it as two words: Schloss Strasse (or Schloss Straße… or even Schloss Str.).</p>
      <p>Gosh, this gets me boiling… sorry :(</p>
