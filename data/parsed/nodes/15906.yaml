      <p>1) Essentially I was talking in the abstract (as I'm wont to do) not about specifics.<br>
      2) Copyright after death is only valid if there's somebody there to inherit it.</p>
      <p>But to me more important than the legal aspect (and certainly any clinical commercial "risk analysis") is the ethical aspect: how does one ideally behave in the total, on this planet that we share? So for example in #2 above, it's actually not enough for somebody to inherit the rights, that party actually has to care about it enough as well. I think the human reality is malleable and complex enough that sometimes (though rarely) this can even allow for the unauthorized revival of something by somebody who's still alive. Remember, the French Revoution was illegal.</p>
      <p>hhp</p>
