      &gt; ahead on this one.</p>
      <p>Really? On what basis? </p>
      <p>&gt; only two groups could possibly have rights to<br>
      &gt; the face—Chappell’s or Eichenauer’s descendants.<br>
      &gt; This is unlikely</p>
      <p>Why are you saying that this is unlikely? </p>
      <p>&gt; but most likely no protection on its design.</p>
      <p>No, no, no, no. Even though the *U.S.* copyright office does not consider typeface designs to be copyrightable does not mean that typeface designs are not protected by other legislations. Many European legal systems have copyright protections that do not exclude typeface designs, i.e. in most cases typeface designs are copyrighted by law. In general, copyright protects works 70 years after the author's death. Chappell died in 1991, for God's sake! Of course it is unlikely that somebody will actually file a lawsuit if you do the digital version of the font (because it's an expensive undertaking), but this does not mean that such doing is legal. </p>
      <p>In addition, there are professional ethical standards that should be followed. In the 20th century, companies have been pirating designs from each other, but these were different times and different technologies. This does not mean that such poor ethics should be continued in this century. I strongly believe that the ethical standards of this profession should be *no lesser than* the legal standards. That means that typefaces designed by people who died 70 years ago or later should not be released without a license from the descendants. </p>
      <p>If a previously unknown book by Raymond Chandler is discovered today, does it mean that anybody can publish it only because the author died in 1959? Most certainly not, and this also includes translations into other languages (something that can be seen as an analogy to typeface digitizations). Why should it be different with typefaces? </p>
      <p>Though I realize that you are speaking on your own behalf Dan, it is surprising to me that a person working for Linotype, "The home of the originals", presents such disturbingly "relaxed" views. Hermann Zapf designed Palatino in the 1950s, roughly at the same time as Warren Chappell did Eichenauer. Are you suggesting that it is ethically OK for *anybody* to publish a digitization of Palatino (under a different name perhaps)? Or is the difference that Mr Zapf is alive and can defend his rights, while Mr Chappell cannot? </p>
      <p>Nick Shinn writes:<br>
      &gt; Love those umlauts.</p>
      <p>Note however that the umlauts are viewed as "antiquated" by today's German readers. So it would be unwise to put them as default forms for the German language. I think what you could and should do, however, is map them as titling and stylistic alternates. I suggest mapping them to several features: "titl", "salt" and "ss01". Give the glyphs meaningful names by adding a suffix to the basename. When picking the right suffix, I recommend using OpenType Layout feature name tag that you think best represents the nature of the glyphs. </p>
      <p>If you agree that the primary role of these glyphs is "titling alternates", I suggest using the suffix "titl" (like the analogical feature name). So, the glyph names would be "Adieresis.titl", "Odieresis.titl", "Udieresis.titl". </p>
      <p>The code would be: </p>
      <p>feature titl {<br>
        lookup titl_dieresis {<br>
          sub Adieresis by Adieresis.titl;<br>
          sub Odieresis by Odieresis.titl;<br>
          sub Udieresis by Udieresis.titl;<br>
        } titl_dieresis;<br>
      } titl; </p>
      <p>feature ss01 {<br>
        lookup titl_dieresis;<br>
      } ss01; </p>
      <p>feature salt {<br>
        lookup titl_dieresis;<br>
      } salt; </p>
      <p>Note that in the example above, the subsequent features (ss01, salt) refer to a lookup defined previously in the titl feature. You can do such things whenever you need to perform the same lookup in several features. Just define your lookup in the first occurance, and refer to its name in subsequent occurancies. </p>
      <p>As for ligatures "ch" and "tz", they should be placed in the "dlig" feature (discretionary ligatures) and perhaps "hlig" as well (historical ligatures), but not "liga" (standard ligatures). The practice of setting German digraphs tighter (ch, ck, st, tz etc.) has been phased out in German typesetting some 20-30 years ago. You are right Nick that setting these ligatures requires linguistic sensitivity for compound words so the ligatures need to be activated by the user's discretion -- unless one wants to implement an entire German spelling dictionary inside of an OpenType font. </p>
      <p>Hrant writes:<br>
      &gt; Sure, except language tags are yet to be supported</p>
      <p>Which does not mean that OpenType fonts that are released today should not use them. While I said that it would be unwise to use a language-specific "locl" feature in this particular case, it still makes sense to define it in other cases where a different glyph than the default one is the preferred form for a particular language. </p>
      <p>Nick also writes:<br>
      &gt; There was once no English double-U.</p>
      <p>I'm with you on this Nick. The capital double-S is a patch but not a real solution. </p>
      <p>Dan Reynolds writes:<br>
      &gt; Three letters in a row does not make linguistic sense, even in German. </p>
      <p>You are very wrong on this Dan. </p>
      <p>&gt; “Schlossstrasse” (Castle Street) may be the proper way to type today,</p>
      <p>It is *not* the proper way to type today. "Schlossstraße" is the proper way to type today. </p>
      <p>In fact, the new ß-ss rule introduced in the recent spelling reform is one of the few VERY logical changes. In German, there are two vowel lengths: short and long. While in Czech the long vowels are marked by placing an acute over the vowel letter and in Finnish they are marked by just doubling the vowel letter, the Germans chose a slightly awkward system: to mark the short vowel by doubling the following consonant letter. </p>
      <p>The system works like this -- in a simplified manner: </p>
      <p>1. "mott", "motte": a double consonant letter always means that the preceding single vowel is short;<br>
      2. "moht", "mohte": a "h" following a vowel letter always means that the preceding single vowel is long;<br>
      3. "mote": a single consonant letter followed by another vowel within the same stem always means that the preceding single vowel is long<br>
      4. "mot": a single consonant letter at the end of a stem or followed by a different consonant means that the preceding single vowel is likely to be long but it can also be short. </p>
      <p>It's similar in English but it's more consequently implemented in German. In the last case, whenever you see a single consonant, it is a strong indication that the vowel is long, although e.g. "Kap" is pronounced with a short [a]. Yet for sure, "Kape" would have a long [a:] (as if it were "Kahpe") and "Kappe" would have a short [a]. As I said, it's not 100% logical but it is pretty logical. </p>
      <p>While the principle used to work very well with most consonants, the "s" posed a problem in the old spelling. While the letter "s" always means "a single consonant letter" (in the terms of the rules outlined above), and the letters "ss" always mean "a double consonant letter", the letter "ß" used to be ambiguous. Though historically a ligature of two "s"-es, it used to stand for "a signle consonant letter" or "a double consonant letter" in various cases. In other words, whenever you saw a "ß" in the text, you had no idea whether the preceding vowel should be pronounced long or short unless you memorized the actual word's pronounciation. The mispronounciation of vowels followed by an "s" or "ß" used to be the most common mistake made by foreigners learning German (and I know hundreds of them), and it used to pose the biggest problem for myself as well. </p>
      <p>So it used to be that in "Floß" the [o:] was long but in "Fluß" the [u] was short, in "Gruß" the [u:] was long but in "Muß" the [u] was short. The recent German spelling reform greatly simplified this: in all cases where "ß" followed a short vowel, it was replaced by "ss". This means that "ß" now always represents "a single consonant letter" -- which is good because graphically, it is *one* letter. </p>
      <p>Therefore, the former "Floß" is written "Floß" (and pronounced "[flo:s]), but the former "Fluß" is written "Fluss" (and pronounced [flus]). The former "Gruß" is written "Gruß" (and pronounced [flu:s]) but the former "Muß" is written "Muss" (and pronounced [mus]). (Of course, German "u" is always an [u] sound, short or long, and never a [yu] or [a] or whatever). In other words: whenever you see a "ss", you can be *sure* that the preceding vowel is short, while whenever you see "ß", you can be *sure* that the preceding vowel is long. Since the "castle street" is made out of two words: "Schloss" (with a short [o]) and "Straße" (with a long [a:]), it is written "Schlossstraße" and not "Schlossstrasse" as Dan suggests. "Schlossstrasse" would be pronounced with a short [a]. </p>
      <p>&gt; Today, a sensitive typographer would put in a space between those two words—which is<br>
      &gt; fully within his right as a designer—and set it as two words: Schloss Strasse<br>
      &gt; (or Schloss Straße… or even Schloss Str.).</p>
      <p>This is complete humbug Dan, you should get back to learning German. Compound words are still written as compound words. In some cases, you might put a *hyphen* between the two (Schloss-Straße) but you never write a noun preceded by a noun in apposition as two separate words. </p>
      <p>OK, now let's get to the "triple consonants problem". Let's look at an example where a compound word is made out of two words in which the first word ends with a double consonant and the second word starts with an identical single consonant. E.g. "ship ride" in German would be a compound word made of the word "Schiff" (ship, [shif]) and "Fahrt" (ride, [fa:rt]). In old spelling, in the compound word one of the three identical consecutive consonants had to disappear. So when you add "Schiff"+"fahrt", you had to write "Schiffahrt" instead of "Schifffahrt". </p>
      <p>But given the principles I outlined above, this was confusing. When you pronounce "Schifffahrt", you need to pronounce a short "i" followed by two phonetically distinct "f" sounds: [shif-fa:rt]. But when you look at the word "Schiffahrt", you might either mispronounce it as [shi:f-fa:rt] or, even worse, [shif-a:rt]. Because one "f" was missing. In the new spelling, this situation is simplified: the third consonant letter does not disappear anymore, so "Schiff"+"fahrt" = "Schifffahrt". </p>
      <p>We're slowly approaching the "capital ß problem". As I explained above, the [o:] in "Floß" is long but the [u] in "Fluss" is short, the [u] in "Muss" is short and the [u:] in "Gruß" is long. That's logical and evident. But this handy distinction is lost when we see it in all-caps: "FLOSS", "FLUSS", "MUSS", "GRUSS". This spelling suggests that all the vowels in these words are short. Of course, it's mostly possible to deduct the correct pronounciation since you usually know the mixed-case spelling. But what about people's names? "Hosskammer" is [hoskamer] and "Hoßkammer" is [ho:skamer]. But in all-caps, you only see "HOSSKAMMER". You not only don't know what the correct pronounciation of the name is, you also don't know if it's "Hosskammer" or "Hoßkammer" in mixed-case writing. Since much of lettering on grave stones is all-uppercase, this presents a typical problem. </p>
      <p>The German reader knows that "ß" is a single letter which is different from the single letter "s" and from the double letter "ss". The letter "ß" is not interchangable with the others, performs different functions. With the new spelling, the use of "ß" has been made even more clear and consistent. </p>
      <p>Some might say that the uppercase writing of "ß" is two uppercase letters "S", i.e. "SS". I believe this is an inadequate depiction of the issue. The fact is that the uppercase letter "ß" currently looks like two letters "S". Although not present in the Unicode Standard, I like to think of it as a functionally separate letter that happens to share the form with the uppercase depiction of "ss". </p>
      <p>The problem of writing "RUßPARTIKEL" is not that the uppercase form of "ß" must look like "SS". No. The problem of such writing is that people put a lowercase letter in the middle of an all-uppercase text. Because "ß" is a lowercase letter. The uppercase form of "ß" may in most cases look like "SS" but... </p>
      <p>Yes, then comes the "but". I don't see why a type designer should not distinguish the uppercase form of "ß" from two subsequent uppercase forms of "s". In most cases they may look like "SS" but a type designer could intelligently and carefully design forms that add some differentiation. </p>
      <p>The letter "ß" has grown historically out of a ligature of the long "s" (which looked like an f without the bar*) and the short, final "s" (which looked like a small version of the uppercase "S"). The long-s form is gone now, and there never was a distinct uppercase form of the long-s. Therefore, I believe that deriving the uppercase form of "ß" from the lowercase form is wrong and will not find acceptance among readers. I think the solution should be sought in forms that involve the ligation of two uppercase "S" letters, employ diacritic characters, or both. </p>
      <p>*) In fact, it's the other way around. The letter "f" is a long-s with bar. </p>
      <p>'nuff for today. I'm on a modem connection and need to log out! </p>
      <p>Adam</p>
