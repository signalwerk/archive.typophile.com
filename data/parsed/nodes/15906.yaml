      <p>Despite what a few German type designer might tell you, there is no cap German double-S. The capital form of ß is SS. Some type designers throughout history (but really just a small few) and the GDR (the communist German Democratic Republic) have experimented with changing this, but it never really caught on (thankfully).</p>
      <p>Many German computer users do not know this, so you see typographic errors like "MAßNAHME" alot. This makes me cringe the same way that fake small caps or wrong quotes do. The best thing to do would be to set OpenType setting properly, so that when caps-lock is on, and the user presses the "ß" key, they get "SS" automatically.</p>
      <p>I like seeing special "ch" "ck" and "tz" ligatures, but they fell out of use in German typesetting decades ago.* We can bring them back through OpenType now, but I have a feeling that the ligatures would look odd and dated to the average reader.</p>
      <p>*The exception here is Blackletter faces. Even though many contemporary digital blackletter faces do not have these ligatures included, they should. Although the "rules" for setting Antiqua type changed over the past few decades, they did not for blackletter. It is just that blackletter is hardly ever set, and no one seems to care about it anymore. But any type designer who designs a blackletter font should include all of the historical glyphs in it, I think, because anyone who is actually likely to license a blackletter font is probably going to be more inclined to want to set it properly.</p>
      <p>But even blackletter doesn't use the capital double-s  ;-)</p>
