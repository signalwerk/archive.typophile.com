      <p>Tim: Gustav Eichenauer never worked for Stempel. Chappell's Eichenauer design was never produced. The image you posted from Chappell's book is the only image of it my "Stempel source" has ever seen. (He said it reminded him of Weiss Antiqua…).</p>
      <p>Furthermore, I have heard from my source that Chappell was sort of a consultant to D. Stempel AG for about three years during the 1950s. But aside from a few typefaces that were later converted to Linotype use, the relationship did not seem to be so fruitful.</p>
      <p>So, Eichenauer does not seem to be a Stempel design. This means that you should follow personal tracks now rather than foundry tracks. Adam offers valid ethical input above.</p>
      <p>I'm sure that you should be able to track down Chappell's heirs. I don't know about them, personally. House Industries, with their Neutraface types, have set an excellent example for how a foundry can market a deceased designer's work. They licensed the Neutra name from his family. Maybe something similar could be done here?</p>
      <p>Gustav Eichenauer was very old already by the 1950s. He lost a son during WWII. I don't have any more personal info on him, but I suspect that any copyright on the face was probably kept by Chappell anyway, since the type was never produced or published.</p>
      <p>(Is this sufficient enough feedback, Adam? Would you recommend further ethical steps, or discourage pursuing this design althogether?)</p>
