  html: |-
    <p>In a proportional font with tabular numbers, would you expect other symbols to share the width of the figures? If so, which ones?<br>
    plus, multiply, divide, etc.?<br>
    equal, greaterthan, etc.?<br>
    dollar, sterling, yen, currency, etc.?<br>
    pound?<br>
    asciitilde? logical not?<br>
    percent? perthousand?!</p>
