    html: |-
      <p>There was a thread on this...</p>
      <p>***</p>
      <p>Anyway, I don't think there is any need, and it really compromises the appearance of glyphs, especially the Euro symbol.<br>
      The reason is that figure positioning in columns is now done by tabbing, rather than filling space with quads.</p>
      <p>Having said that, I do try and make the Dollar and Sterling tab figure width.</p>
      <p>Actually, it's a good idea if you're thinking about tab figure width, to consider designing all figures in a family to the same width from the outset -- lining and oldstyle, different weights, roman and italic.</p>
