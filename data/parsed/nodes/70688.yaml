    <p>I am unsure what to do when it comes to this, or if there is even a proper way, but I am sure there is a preferred way to kern these particular glyphs. </p>
    <p>I am setting my journal (yes, I am such a design geek that I write my journal in InDesign) so I would like it to be as well-set as possible. </p>
    <p>The first looks overtly incorrect. Should I simply reduce the tracking of the comma so it is under the h or even further toward the t? The second example looks more correct, but I'm still not sure if it looks just right.</p>
    <p>Opinions?</p>
