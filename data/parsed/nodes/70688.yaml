    html: |-
      <p>Personally, I think that superscript looks bad with hanging or text numerals. It causes the line to jump around and is distracting. </p>
      <p>In the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Ordinal_indicator" rel="nofollow">Wikipedia article on ordinal indicators</a> it claims that superscript was a Victorian practice in English, under the influence of French. I am wondering whether this style came in with the adoption of lining figures. With lining figures, it works, though I don't really see it as an advantage. With old style figures, as I said, it seems to me ugly and distracting.</p>
    html_clean: |-
      <p>Personally, I think that superscript looks bad with hanging or text numerals. It causes the line to jump around and is distracting. </p>
