      <p>In a personal journal you can do whatever you want, of course. </p>
      <p>But as a frame of reference: In formal writing, one would not generally use the ordinal form in a sentence like your inline example above. When a date is written out like that, it is usually expressed as a cardinal number, even if it might get read or pronounced informally as an ordinal.</p>
