    html: |-
      <p>Here is what I did last year in your shoes ;-)</p>
      <p>(not including the Latin groups…)<br>
      One group for all Deva glyphs<br>
      One for all the Deva conjuncts<br>
      One for all the Deva ligatures<br>
      One group for each of the full consonant forms and their derivatives (i.e., one group would include the Ba, the BRa and Bba)<br>
      One group for all the full Vattu forms<br>
      One group for all the half forms<br>
      Another for all the half Vattu forms (I actually did this group twice…)<br>
      Then a group for the above the base marks<br>
      Another for the below the base marks</p>
      <p>I think that is it! But you have my VOLT project file, so you can take a closer look.</p>
