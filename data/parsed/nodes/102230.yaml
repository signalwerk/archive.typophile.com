    <p></p><div class="imageWrap"><img src="http://typophile.com/files/green_lantern_-_teaser_poster_font_-_1a-(already_on_wtf)_3812.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/green_lantern_-_teaser_poster_font_-_2a_6563.png"></div><p></p>
    <p>Hi All!</p>
    <p>This font is from a series of four teaser posters for the Green Lantern movie (2011), designed by Concept Arts.</p>
    <p><a href="http://www.impawards.com/2011/green_lantern.html" rel="nofollow">FULL POSTERS HERE</a></p>
    <p>Is it just a customised version of "MVB Sweet Square"? The I, E, &amp; K seem quite different. I've found a bunch of similar fonts ("Aerotype Durandal Flat", "Piranha" by Nathan Caldecott, "Identikal Rally", "Identikal Rebirth", "FF Aircraft"), but no exact matches.</p>
    <p>Also, how would one classify this font? A "chamfered angular square sans-serif"?</p>
    <p>*** Bonus points if anyone can confirm whether the "2011" on the poster is even in the same font? ***</p>
    <p>Thanks in advance!   :D</p>
