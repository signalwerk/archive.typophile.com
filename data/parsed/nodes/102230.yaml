    html: "<p>What I can say is I was not able to identify it either. It also remains unsolved on <a class=\"freelinking external\" href=\"http://www.myfonts.com/WhatTheFont/forum/?q=lantern\" rel=\"nofollow\">WhatTheFont Forum</a>. So, 2 possibilities: totally hand-drawn from scratch or customization from an existing typeface (what I prefer, less frustrating ;). Sweet Square is also the closest I've found but some details you've already spotted remain off (but not hard to reproduce). It also shares many similarities with <a href=\"/wiki/www.houseind.com/fonts/unitedcollection\" class=\"freelinking\" rel=\"nofollow\">United</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/jnlevine/kp-duty\" rel=\"nofollow\">KP Duty</a> and <a class=\"freelinking external\" href=\"http://www.letterheadfonts.com/fonts/fullblock.php\" rel=\"nofollow\">Full Block</a> but none of these ones are matching either.</p>"
