    html: |-
      <p>So interesting to read about the history of Bell in light of the "net neutrality" issues in the news right now.</p>
      <p>Thanks so much for your info KT.</p>
      <p>*A hilarious site addressing privacy and information in the telephone era:-)<br>
      <a href="http://www.grayflannelsuit.net/blog/saul-bass-att-logo-design-1969" title="http://www.grayflannelsuit.net/blog/saul-bass-att-logo-design-1969">http://www.grayflannelsuit.net/blog/saul-bass-att-logo-design-1969</a></p>
      <p>*Good article:<br>
      <a href="http://omahaworks.net/bell-system---we-history.html" title="http://omahaworks.net/bell-system---we-history.html">http://omahaworks.net/bell-system---we-history.html</a></p>
      <p>The Creator of the Bell and AT&amp;T Logos<br>
      "The [Bass &amp; Yager] design firm had created the famous bell symbol for the nationwide phone monopoly in the late 1960s. This icon--which achieved a remarkable 93 percent recognition rate in the United States [emphasis added] --aspired to the simplicity and directness of a sans serif letterform. In 1984, the familiar bell symbol was transferred to the divested "Baby Bells," and Bass &amp; Yager designed a striated sphere for AT&amp;T, aiming to signify the corporation's international stature and the ascendance of digital communications." </p>
      <p>The AT&amp;T Long Lines Department was responsible for connecting the local Bell companies together to provide long distance telephone communication between each Bell company.  Here are two logos representing the time period between 1939 and 1963 and the time period after 1969.</p>
