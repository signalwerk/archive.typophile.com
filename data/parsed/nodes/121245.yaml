      <p>Nobel would work as well, but the counters on the B aren’t as long/horizontal as the ones on your sample.</p>
      <p>Font Bureau used to sell a typeface called Bonn Caps (designed by Neville Brody) that, save for a pointy |N|, is a very good match to your sample. Unfortunately, I can’t find a legitimate source for it.</p>
