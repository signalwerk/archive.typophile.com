      <p>That version of the Bell System logo was first introduced in 1939, and persisted until Saul Bass created his iconic revision in 1969. </p>
      <p>“Public Telephone” resembles Akzidenz-Grotesk (the |C| especially), but your sample has a much rounder |O| than the one in A-G. Without knowing an approximate date for the sign, it’s hard to pin down the original face.</p>
      <p>These digital typefaces could help you approximate the look:<br>
      <a href="http://www.myfonts.com/fonts/marksimonson/proxima-nova/" title="http://www.myfonts.com/fonts/marksimonson/proxima-nova/">http://www.myfonts.com/fonts/marksimonson/proxima-nova/</a><br>
      <a href="http://www.google.com/fonts/specimen/Raleway" title="http://www.google.com/fonts/specimen/Raleway">http://www.google.com/fonts/specimen/Raleway</a><br>
      <a href="http://www.typography.com/fonts/gotham/overview/" title="http://www.typography.com/fonts/gotham/overview/">http://www.typography.com/fonts/gotham/overview/</a></p>
    html_clean: |-
