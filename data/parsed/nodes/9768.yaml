    html: <p>I don't think it's either <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FK.108372.0.3&amp;attributes.sampleSize=48&amp;sampleText=que+S%C3%B3crates&amp;sampleSize=48" target="_blank">Taz</a> or <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FF.11355.1.9&amp;attributes.sampleSize=48&amp;sampleText=que+S%C3%B3crates&amp;sampleSize=48" target="_blank">Zwo</a>. (Is Tazzer the same as Taz?) The shapes of the q and the t don't match. <br> <br>The q and t do match <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FK.112463.0.11&amp;attributes.sampleSize=48&amp;sampleText=que+S%C3%B3crates&amp;sampleSize=48" target="_blank">Sun</a> and <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FK.112460.0.7&amp;attributes.sampleSize=48&amp;sampleText=que+S%C3%B3crates&amp;sampleSize=48" target="_blank">Corpid</a>, however. The sample definitely looks like the work of Luc(as) de Groot. It's not an exact match though. I'm with Dav(id); Corpid Heavy seems very close. Maybe it's stretched vertically.</p>
