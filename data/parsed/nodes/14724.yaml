    <p>This is not exactly a type-ID, and not exactly a type crit.</p>
    <p>I’ve scanned this rendering of a font (the chop job on the left isn’t my doing) and I’d like people to: take guesses as to who made it and/or when it was made; and give opinions about it (even though there isn’t much there, I admit). If you already know for a fact who made it, don’t spill the beans please, but feel free to opine on it (assuming you can remain objective even though you know who made it*). Just a midsummer night’s puzzle, really.</p>
    <p>* That’s not [necessarily] a hint. But it might very well keep you guessing, and there’s nothing like speculation to get the mental juices flowing!</p>
    <p>hhp</p>
