      <p><cite>If you already know for a fact who made it, don’t spill the beans please, but feel free to opine on it (assuming you can remain objective even though you know who made it*).</cite></p>
      <p>Careful! You’re verging on one of the <a href="http://typophile.com/node/12938">top ten things not to say on Typophile!</a>. In any case, Walter Tracy, in <a href="wiki/Letters of Credit" class="wiki">Letters of Credit</a>, claims that the original upon which this sample is based is “obese and, to my mind, vulgar.” And this version is “superior; not so dark, but dark enough, and with cleaner profiles — the work of a designer familiar with, and respectful of, the letter forms of traditional printing types.” I take this as evidence that Tracy sometimes doesn’t know what he’s talking about. To my mind, this ripoff is not as friendly as the original, and well deserves its lack of popularity.</p>
      <p>Also keep in mind that the metal had a number of alternates and swashes, including a ‘g’ of much more traditional form. These would probably be worth bringing back, at least.</p>
