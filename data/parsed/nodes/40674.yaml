      <p>If you don’t assume the author’s name is in the same typeface, then <a href="http://www.myfonts.com/fonts/linotype/anzeigen-grotesk-lt/">Anzeigen Grotesk</a> could be a candidate (otherwise, it has the wrong ’a’). That type should date back to 1971 or earlier, as a pre-digital design.</p>
      <p>- Mike Yanega</p>
