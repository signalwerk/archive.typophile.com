      <p>I think it's called <strong>OregonUniversity</strong></p>
      <p>You can read the full story here:<br><a href="http://luc.devroye.org/fonts-54070.html">http://luc.devroye.org/fonts-54070.html</a></p>
      <blockquote><p>A strange sports font story out of Oregon. The University of Oregon protects its font and its logo, a watered down version of Handel Gothic (a font by Don Handel, 1965, and Robert Trogman, 1980). A local politician, Gordon Smith, started using an extremely similar font, and is being accused of font theft. Darrel Plant says it's a tempest in a teapot (and I tend to agree).</p></blockquote>
