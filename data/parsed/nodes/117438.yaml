      <p>Dig through the links and we find that the custom font _Belloti Bold_ a.k.a the "Mike Belloti" font was designed by Nike and it actually exists as a font rather than merely as custom letters. <a href="http://www.blueoregon.com/2008/06/the-gordon-smit/">http://www.blueoregon.com/2008/06/the-gordon-smit/</a> As for legal prohibitions on use of the letter designs, I have nothing to add to the Luc Devroye page mentioned by Fivos, except to recommend that for bizzare entertainment at length you follow Luc Devroye's link to "David and Goliath" <a href="http://luc.devroye.org/legal.html">http://luc.devroye.org/legal.html</a><br>
      Don</p>
