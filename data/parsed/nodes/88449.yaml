  html: <p>I have FontLab 5.04 installed on a Windows Vista system, and have had Python 2.7 installed on the same system for a long time. But FontLab has always insisted that "Python is not installed", which obviously is not true. How can I convince FontLab that Python is present? I want to use my licensed RMX tools. Is my Python too new? Do I really have to find an outdated build to make it work with FontLab?</p>
  html_clean: <p>I have FontLab 5.04 installed on a Windows Vista system, and have had Python 2.7 installed on the same system for a long time. But FontLab has always insisted that "Python is not installed", which obviously is not true. How can I convince FontLab that Python is present? I want to use my licensed RMX tools. Is my Python too new? Do I really have to find an outdated build to make it work with FontLab?</p>
