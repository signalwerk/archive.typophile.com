    <p></p><div class="imageWrap"><img src="http://typophile.com/files/natuursteen_4056.png"></div><p></p>
    <p>My company wishes to use the above font in their company logo. Can you people tell me what feeling this font gives you? For example reliable/decent or cheap/outdated? The company makes/sells stone products (anything from monuments to custom made kitchen sinks).</p>
    <p>I'm curious as to what people think about it, I think it's time to go for a new font, but I'd like to know what other people think...</p>
    <p>Tnx!</p>
