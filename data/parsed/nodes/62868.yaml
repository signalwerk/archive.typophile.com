      <p>In response to Kate Dawson,</p>
      <p>Does a company logo sell the product or the service?</p>
      <p>I would not likely approach a salesmen that came across as cold and inflexible. Consequently, I would suggest that this company might benefit from a logo that combines two styles. For example, a warm rounded font might be inset in a rigid and durable boundary or vice versa.</p>
      <p>More to the point, we are deprived of seeing their current logo as it actually appears.</p>
