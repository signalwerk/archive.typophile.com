      <p>don't think it is Hebrew or Sanskrit, nor is it Celtic... so that rules out most formal religious contexts... and I don't think any of the Mayan cultures used symbols such as these. What seems to remain is more occult or fictional language symbols... btw, it's not masonic, either...</p>
