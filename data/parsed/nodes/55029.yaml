      <p>It’s often quite practical and efficient to outsource one’s own design as a designer. One can often lose sight of the big picture when being overly picky with designing for oneself.</p>
      <p>I’ll repeat what I said earlier, but I think, though it’s true, complaining about how it ’cheapens the industry’ really has no sway on anyone that would use a contest to get design created.</p>
      <p>We all know Wal-Mart sells crap, but in the end, people seem fine with crap as long as its cheap.</p>
      <p>I think a better argument to dissuade people from using contests is that logo contests aren’t actually cheap compared to the quality of product you are buying.</p>
      <p>$100 isn’t much, but you’d still get a better product spending $100 for 1 hour of time from a great designer than you’ll get from 20 designers of ’contest caliber’.</p>
