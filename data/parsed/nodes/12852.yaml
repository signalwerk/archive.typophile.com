    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 2.Jun.2005 12.01pm </div>
      <p>SANDY SPRING, MD, June 2, 2005 -- Phil's Fonts and GarageFonts are pleased to announce the release of Joshua Darden's new typeface family Freight.</p>
    <p>Although they appeared more than 150 years apart, the historical types of Johann Michel Fleischmann and Stanley Morison share inherently Dutch sensibilities which have long fascinated Darden. He comments upon what he calls "the elusive balance of warmth, energy, and pragmatism" with his Freight Text, Sans, and Micro -- three integrated yet fundamentally different families.</p>
    <p>Freight's comprehensive range of weights and styles excels in a variety of uses, from train schedules and university catalogues to technical manuals and cookbooks. Freight Sans follows a humanist logic suitable for text, display, and wayfinding. The seriffed Freight Text economically supports extended reading in periodicals and data-intensive documents. Freight Micro departs from slab serif tradition, compensating for the inclement conditions faced by small type onscreen and in print by exaggerating the traits of each character, resulting in a design which also proves to be quite striking at large sizes.</p>
    <p>Each family's five precisely tuned weights feature an extensive character set, comprising roman, italic, small caps, italic small caps, along with old style and tabular figures.</p>
    <p>Freight can be viewed and purchased at <a href="http://www.garagefonts.com" title="www.garagefonts.com">www.garagefonts.com</a> and <a href="http://www.philsfonts.com" title="www.philsfonts.com">www.philsfonts.com</a>.</p>
    <p>Joshua Darden is a typeface designer with a studio in Brooklyn, NY. For more than a decade, he has designed and developed typefaces and lettering for publications, corporations and private clients. His work is comprised of designs for multiple languages and writing systems, with a focus on fonts for specific media. As an avid collector of books and periodicals, he is a keen observer of twentieth-century typographic culture.</p>
    <p>GarageFonts was established in 1993, primarily as a vehicle to distribute some of the first typeface designs created for Raygun magazine. From the beginning, GarageFonts has been on the cutting edge of new typeface design, helping to change a once tiresome selection of typeface designs into a new world of visual excitement. What started as a small library of trend setting designs has now grown to a varied collection of original, accessible text and display typefaces. GarageFonts has something for everyone.</p>
    <p>Phil's Fonts has been in the type business for over 30 years. The company evolved from one of the most well known and respected photolettering studios in the typesetting industry, Phil's Photo. Since 1990 Phil's Fonts has been distributing fonts from large and small foundries. The current selection offers over 35,000 fonts from 75 type foundries worldwide.&nbsp; Phil's Fonts also specializes in creating custom typeface designs. Whether you need fonts for corporate identity, new products, magazine redesigns or for simple or complex licensing, Phil's Fonts can help solve your type issues.</p>
    <p>Phil's Fonts, inc. / GarageFonts<br>
