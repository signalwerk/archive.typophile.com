    <p>I’m doing a redesign of a package for Peppermint bonbons.<br>
    I’m stuck with the choice of typography that will be used for small (5pt) text (product description and list of ingredients and usual stuff ). </p>
    <p>Little bit about design that might help narrow down the list of choices...<br>
    whole design will have *retro* (something like Penguin peppermints) feel. Main headline is set in Neutra and another one with Fayette.</p>
    <p>What i need is good Readability at such small sizes. (I’m must say I prefere san serif face, tho I’m open to suggestions).</p>
    <p>Thanks,</p>
    <p>L.</p>
