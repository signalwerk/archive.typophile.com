      <p>Hi!</p>
      <p>I need similar recommendations.</p>
      <p>I’m looking for a typeface for use with 5pt text on ice cream packages. The problem is, that it needs to support <strong>estonian, latvian, lithuanian, cyrillic, swedish and english</strong>. Actually cyrillic might be from a different typeface but other languages should look the same.</p>
      <p>Currently i’m using an opentype version of Arial [ :( ] , because it’s the only font i’ve found that has all the characters i need. Unfortunately, it’s not very economical. </p>
      <p>Most of the packages are printed using Flexo technology, which means that dot gain is quite big.</p>
      <p>Thanks in advance</p>
