    html: |-
      <p>good start frode</p>
      <p>The K feels too plainly geometric in relation to the other letters, and the waist is rather low slung. You might play with the upper arm perhaps. It might seem too heavy if you move the waist up.</p>
      <p>The squared-off ’a’ is kinda cool, but it doesn’t seem to mesh/match 100 percent with the r-b-n.<br>
      maybe for this zine, that’s a good thing.</p>
      <p>the spacing needs some slight work.</p>
      <p>maybe the a-r and the a-b might need ever-so-slight widening and the b-i slight reduction. (just a hair)</p>
      <p>the r-a pair feels okay small, but larger feels like it needs more air.</p>
      <p>good luck.</p>
