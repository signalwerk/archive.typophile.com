    html: |-
      <p>Erik, I use following procedure to merge single fonts into an OT. This is reliable for large families, not for single fonts.</p>
      <p>1) I analyze the glyphs from the additional fonts. I create a list of glyphs I should add to the basic font from each separate font (OSF, CE, Expert…)<br>
      2) I rename the glyphs to be added to the basic font (one –&gt; one.oldstyle, A –&gt; A.small, at –&gt; at.alt…). I’ve found free Python scripts for easier renaming of the glyphs<br>
      3) I create encoding scheme which only includes the glyphs I need to copy to the basic font<br>
      4) I append new glyphs to the basic font<br>
      5) I save the renaming schemes and encodings to comfortably build all the fonts in a family<br>
      6) I solve problems and irregularities in the fonts (not all Expert fonts in one family share the same number of glyphs, some fonts have missing or wrong characters etc.)<br>
      7) I do the technical stuff (family renaming, setting of proper encodings, building OT naming, adding invisible glyphs etc.)<br>
      8) I generate OT features (I have a collection of scripts doing this automatically according to glyph suffices)<br>
      9) If necessary, I expand kerning to accented glyphs (some fonts contain kerning for pairs with one accented glyph only, they don’t have fonts with two accented glyphs; I have a script doing this in a very smart way)<br>
      10) I export the fonts.</p>
      <p>Some of the steps could be made easier in FL Studio 5 using Merge Fonts feature.</p>
