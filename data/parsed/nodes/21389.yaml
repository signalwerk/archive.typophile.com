    html: "<p>You can indeed convert, in a batch mode, simple PS fonts into OT format. The catch is, that process doesn’t handle substitution code, features, additional kerning, etc; it just translates 1 : 1. For OT Pro or extended character sets, it’s done slowly, one weight at a time, just like you did it, even at the large foundries. For the type of OT font you’re looking for, there is no quick tool for conversion. If someone develops one, please announce it on typophile….  ;)</p>"
