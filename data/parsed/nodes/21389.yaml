    <p>I was recently setting some text in FF Scala Sans (PS1 fonts) in InDesign and was annoyed by the need to constantly switch between, say, Scala Regular and Scala Regular SC in order to get real small caps. So I decided to use FontLab 5 to convert the PS1 fonts into OpenType, starting with the Regular font and adding to it the small caps, lining figures etc from the complementary fonts.</p>
    <p>The idea sounds simple enough, but in order to make the resulting OpenType font do what I wanted in InDesign, I decided to use a native Adobe OS font (Minion) as a template and started copying the glyphs to the same places. So for starters I had to move the proportional text figures from their original place in the Scala Sans Regular font to U+F730 — U+F739 in the new OpenType font, then copy the lining figures to U+0030 — U+0039, then the small caps also to the private use area (but to two different blocks, one for the accented and another for the unaccented glyphs), and so on.</p>
    <p>Then of course I had to create all the substitution classes in FontLab for ligatures, proportional text figures etc etc etc.</p>
    <p>By the time I was done with the new Scala Sans OS, I had all but given up on the idea of doing the same thing all over again for the italic, then the bold, then all the condensed fonts.</p>
    <p>Does anyone know of a simpler way to accomplish this conversion? Isn’t there a nice little tool out there somewhere that lets you choose the source fonts and automatically creates a new OpenType font, transfering the relevant glyphs from the different source fonts to the right places in the new OS font?</p>
