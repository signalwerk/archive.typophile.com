      <p>Thanks for your suggestions.</p>
      <p>Fifty bucks for a single font file may not be prohibitive, but I have quite a few PS1 fonts that I would like to convert to OT (not OS, sorry), so the total investment would quickly run in the thousands. That, to me, is prohibitive, especially because I am based in Brazil, so something that costs my North-American or European colleagues U$ 50 costs me the equivalent of U$ 130 (at least).</p>
      <p>Also, it seems kind of stupid to pay all this money for new bundles of the same glyphs that I already have, just organized in a different way. Sure, some work goes into producing an OT font, but I suspect all foundries have to upgrade their fonts anyway, and they must have automated processes to do this, so I don’t exactly feel a moral duty to pay them all over again. Besides, as far as I know, foundries have nothing to do with the development of OpenType technology; they’re just using it to make their fonts. So I don’t really agree with the Windows Xp/Vista analogy.</p>
      <p>As for EULA issues, I make a distinction between what is legal and what is moral. I can’t see a moral reason in the universe why a type foundry should be able to stop me from rearranging the glyphs I’ve already bought from them anyway I like so I can work more efficiently. If I am free to manually adjust letterfit by kerning, and even convert letterforms to curves and alter them using, say, Illustrator, why should I be forbidden to group glyphs in a different manner and add substitution classes to them. This may not be legal, but it’s certainly not immoral.</p>
      <p>Anyway, my point is not to voice my disagreements with other people’s opinions (which I respect completely) about whether or not digital foundries should be able to make money by selling OT upgrades to their PS1 fonts. My point is that I cannot afford to buy all these new OT fonts, so I was looking for a less expensive solution.</p>
