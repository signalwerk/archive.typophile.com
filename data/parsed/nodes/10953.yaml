    html: <p>Unfortunately my workflow will now require me to do all my drawing in Illustrator on my new X machine with a super crisp monitor and going back to my old 9500 to do all the FOG work on my blurry old monitor. <br> <br>There isn't a decent solution to this other than to repartiiton the X machine or find that bootable Classic hack so I can run both OSs on one machine. <br> <br>I appreciate you taking the time to see what your bro can find out. As I mentioned earlier, it's not so much that I'm resistant to Font Lab, it's just that I can maneuver in FOG so much quicker and I have my workflow based around that application. <br> <br>Please post as soon as you find something out! <br> <br>Stuart :D</p>
