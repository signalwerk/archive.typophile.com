    html: <p>Stuart, I don't understand why you can't boot into OS 9. This facility was not removed in 10.2.5. Unless you bought one of the newest machines which were released just this year, you should be able to do it. Just go to System Preferences &gt; Startup Disk, select the OS 9 System folder and restart. <br> <br>Don't forget that you should use the PPC version of FOG in OS 9.</p>
