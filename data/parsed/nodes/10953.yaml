    html: "<p>Why buying a new computer and switch to X and don't switch to contemporary appl.?* <br> <br>After couple of years with Ikarus, then Ten years of using Fog, I'm not disapointed at all with doing 99% of everything in FL on X. The only limitation I see is interpolation that I continue to do in Fog. That it. Its just a matter of months, as Yuri got it our comments about interpolation. <br> <br>* I don't get the concept. Perhaps to make your life more complicate, its the best thing to do: switching everyday!  ;-) <br> <br>Good luck with the 1996 old appl on 2003 computers! <br></p>"
