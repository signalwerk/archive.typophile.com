  html: <p>After reading a post about trouble with referenced characters in FOG on X in Classic mode I decided to test this myself. <br> <br>Sure enough FOG freezes when I attempt to move a referenced character via arrow keys or mouse. <br> <br>Unfortunately this is detrimental to being able to build fonts and I am at a loss for a workaround. I don't have the ability to boot in Classic mode since I'm at 10.2.5 on my OS X Mac. <br> <br>Joe, can your brother leak that Classic bootable hack that Apple has? <br> <br>Mark, any thoughts? <br> <br>Stuart :D</p>
