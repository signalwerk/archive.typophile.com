    html: <p>I've already discovered from Jim's forum that there isn't a fix for it. I was hoping other folks had alternate workarounds for it. <br> <br>So far I have surmized I could retrofit my machine with the ability to boot in Classic mode by replacing the system software with an older version. <br> <br>OR <br> <br>I could find some way to share the monitor of my new CPU with my old box (ala Remote Desktop) but it's painfully slow. <br> <br>OR <br> <br>Do all my FOG work on my old computer! <br> <br>The problem is due to my time constraints right now, I don't have the time to meet the learning curve of trying to figure out how to do FOG things in Font Lab. My primary reason to jump to OS X was for Font Lab so I'll eventually make the leap. <br> <br>I should have saved my pennies for a new monitor instead of a new computer . . . Sheesh! <br> <br>Stuart :D</p>
    html_clean: <p>I've already discovered from Jim's forum that there isn't a fix for it. I was hoping other folks had alternate workarounds for it. <br> <br>So far I have surmized I could retrofit my machine with the ability to boot in Classic mode by replacing the system software with an older version. <br> <br>OR <br> <br>I could find some way to share the monitor of my new CPU with my old box (ala Remote Desktop) but it's painfully slow. <br> <br>OR <br> <br>Do all my FOG work on my old computer! <br> <br>The problem is due to my time constraints right now, I don't have the time to meet the learning curve of trying to figure out how to do FOG things in Font Lab. My primary reason to jump to OS X was for Font Lab so I'll eventually make the leap. <br> <br>I should have saved my pennies for a new monitor instead of a new computer . . . Sheesh! <br> <br>Stuart :D</p>
