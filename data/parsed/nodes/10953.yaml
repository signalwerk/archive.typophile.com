    html: <p>Hi Stuart, can't you just do all the the regular characters in Classic mode,  <br>and then do the diacritcis and other refence charters on you 9500.  <br>(And maybe get a better monitor, they are cheap these days.) <br>Then move back to Classic to do the final kerning and spacing?. <br>That's the work flow I've been having since I upgraded <br>to OSX in January.   <br> <br>Another tip that I got from this   <br>forum is to speed up fog a little by choosing 1000nds of colors instead of millions. <br> <br>Anyone know more about the OSX robofog that there was romours about? <br></p>
