      <p>I wish I'd get more comments on my font projects too. I have some stuff going on in serif and experimental that hasn't gained much attention.</p>
      <p>What you have here is more of a broken-stroke design than a true stencil. That's fine as a decorative element in a digital font, but stencils are designed with something else in mind. If it's just the decorative impression of a stencil you're going for, this is great, but for a functional stencil you'll need to engineer it a bit more carefully.</p>
      <p> The crossbars on a stencil (that appear as gaps in the letter forms) are structural members of the stencil board. there to suport the parts of the board that would tend to go floppy and break off dure to their narrow attachments or fall out completely from being fully detached otherwise. Graphic appearance is a consideration, but a secondary one. </p>
      <p>Your "K" and "L" are good examples of this principle in action, while the V cut of the "M" looks likely to break or erode with repeated use. </p>
      <p>Those curved cuts in some of your letters are very interesting, but would be unlikely to be used for a stencil other than a die-cut paper one not more than a few inches high.</p>
      <p>Picture, if you will, each of those letter forms cut out from a 6 foot square steel sheet. Think of how you would most simply weld bars across the open letter spaces to hold all the pieces together through repeated handling.</p>
