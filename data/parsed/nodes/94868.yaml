      <p>These derive from Jenson, so you will ﬁnd them in varying degrees in Jenson revivals, such as my Goodchild.<br>
      Double-sided ascender serifs are rare; notably in Koch Antiqua, from which I appropriated the idea for Oneleigh.</p>
