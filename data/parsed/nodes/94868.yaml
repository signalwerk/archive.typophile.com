    <p>Hi all,</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bdhkl_4794.jpg"></div><p></p>
    <p>What term have I seen used here to refer to what kinds of top-serifs are on these letters /b/d/h/k/l/ ?</p>
    <p>For a bonus, please list any fonts you know of (not pictured here) that use 'em.</p>
    <p>THAAAAANKS.</p>
