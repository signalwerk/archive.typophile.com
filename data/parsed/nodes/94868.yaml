      <p>Here is a nice reference to typeface anatomy, but may not help you here. <a href="http://www.typeforge.net/blog/2012/06/22/illustrated-typeface-anatomy-terminology/" title="http://www.typeforge.net/blog/2012/06/22/illustrated-typeface-anatomy-terminology/">http://www.typeforge.net/blog/2012/06/22/illustrated-typeface-anatomy-te...</a></p>
      <p>I have seen such serifs refered to as obtuse serifs I believe.   These at near 45 degree angles on lower case characters are common in "old style" serif fonts.  So if you search for old style fonts you should be able to find what you are looking for.   e.g. <a href="http://www.myfonts.com/search/old+style/fonts/" title="http://www.myfonts.com/search/old+style/fonts/">http://www.myfonts.com/search/old+style/fonts/</a>  There are a few with the double serifs like your example in the results</p>
