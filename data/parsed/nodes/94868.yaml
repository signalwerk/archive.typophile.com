      <p>They're head-serifs, simply angled more than usual. They have an old-fashioned/Jenson vibe. See Schwartz's Houston Chronicle face* for a modern-day application.</p>
      <p>* <a href="http://www.christianschwartz.com/houston.shtml" title="http://www.christianschwartz.com/houston.shtml">http://www.christianschwartz.com/houston.shtml</a></p>
      <p>hhp</p>
