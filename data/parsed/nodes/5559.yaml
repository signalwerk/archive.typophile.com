    html: "<p> I think the es-zett may be a little (or a lot) too wide... I see how you've made it from pieces of \"f\" (well, long \"s\") and \"s,\" but this might be an overly-literal way of approaching the character. <br> <br>The numerals are nice, with the exception that the eight looks a little bottom-heavy (actually, top-light, or \"pinheaded\"). Also, although this is by no means an objective judgement, the \"sideways,\" Stempel-Garamond-esque zero was something I could never get used to. In the context of \"rough\" signage types, though, it might work. <br> <br>Finally: great asterisk! </p>"
