    html: <p> I have to disagree. Sideways zeroes rock. If <br>Adobe Garamond had them, I wouldn't need to <br>bother with Stempel. Fairfield also has them.  <br>They're particularly gorgeous in the heavy <br>weight. <br> <br>Another interesting approach to zeroes can be <br>found in Berthold Bodoni Old Face (not Antiqua). <br> <br>This is a great design. The f-ligs might be <br>built a bit too wide, but I'm not sure unless <br>I see them in a properly kerned run of text. </p>
