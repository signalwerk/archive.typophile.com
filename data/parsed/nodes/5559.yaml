  html: <p><img src="http://www.typophile.com/forums/messages/29/404.jpg" alt="tinhorn.jpg"> <br> <br>This unbracketed slab serif font reminded me of old gambling signage, hence the name. <br> <br>This will probably be the bold weight, as it is a bit heavy for normal text. I hope to produce a book weight and black weight sometime as well. <br> <br>Comments and critique welcome. <br> <br>David Thometz</p>
  html_clean: <p><img src="http://www.typophile.com/forums/messages/29/404.jpg" alt="tinhorn.jpg"> <br> <br>This unbracketed slab serif font reminded me of old gambling signage, hence the name. <br> <br>This will probably be the bold weight, as it is a bit heavy for normal text. I hope to produce a book weight and black weight sometime as well. <br> <br>Comments and critique welcome. <br> <br>David Thometz</p>
