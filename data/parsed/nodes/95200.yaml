      <p>There are many tubies with typographic content. However, these are all more or less experimental exercises, not tutorial ones, I gather.<br>
      What is it exactly what you’d like to learn? To design brochures or books? Websites? Shopfronts … ??<br>
      I am not aware of any video tutorials covering this.<br>
      Maybe, for the first step, you stick to more conventional means and consider going to a library … or a course.</p>
      <p>However, as it happens I did a <a class="freelinking external" href="http://www.schlossgoseck.org/index.php?id=82&amp;tx_ttnews[tt_news]=69&amp;cHash=91bb0927e5b84f3ec9c0f35c317a1c76" rel="nofollow">short video on lettering</a> just recently. If that is of any interest to you.</p>
