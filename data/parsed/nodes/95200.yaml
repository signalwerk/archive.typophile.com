      <p>I just plugged this site in another discussion, but I'll do it again here -- Lynda.com has about 1,500 professionally-made video tutorials on design topics.  I did a quick search for typography courses and found several, including a 7-hour video course on "Choosing and Using Web Fonts", a 6.5 hour video course on "Typography for Web Designers", and a number of tutorials on using type in specific applications, such as InDesign, Dreamweaver, Photoshop, Illustrator, and so forth.  </p>
      <p>The site is mainly focused on "how-to" videos; I don't think they have much in the way of type history or theory, although perhaps they do and I just overlooked them.</p>
      <p>You have to pay a monthly fee to access their videos, but they do have some free samples, and a Google search will often turn up a discount code for a free month or at least a discount.</p>
