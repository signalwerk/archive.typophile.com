      <p>I disagree that the Helvetica process was 'knocking off' and or that it is downplayed by Helvetica Forever. The whole published document shows a continued comparison to AG, there are no attempts to hide these comparisons in this book at least. This is perhaps a myth that you are pumping! I sympathise with the great man idea of history and the title, Helvetica Forever, does lend itself that way, but the actual content continually refers back to AG. It is easy to celebrate Univers independence as a project, and rightly so, but I don't find that this degrades Helvetica, nor Haas Unica for the same reason. For me this celebrates the split-hair nature of the task and makes me less cynical, not more.</p>
      <p>Nick, I believe you have taken on challenges before, after a Typophile thread, which resulted in the drawing of a font? I challenge you to take AG's 'e' and 's' and manually change them with pen, paper, paint or appropriate historical technique, to those of Helvetica. According to your own assessment it should not take too much time away from your much simpler project, the digital Cabotia :-)</p>
