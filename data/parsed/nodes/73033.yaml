      <p><cite>I suppose that Max Miedinger's Neue Haas Grotesk, now known as Helvetica, can be considered to be somewhat illegitimately derived from Berthold's Akzidenz-Grotesk, given that Haas hadn't acquired Berthold at that time or anything like that.</cite></p>
      <p>This notion that Heveltica is somehow a plagiarism of the brilliant Akzidenz Grotesk is a load of rubbish that needs to be hauled off to a landfill. Akzidenz Grotesk was not some work of pure genius that sprang up in 1890s Germany; its design was no more original than Helvetica was. Akzidenz was a collection of similar grots that were derivatives of older grots that were also derivatives of older grots. A Cincinnati Type Foundry specimen from the 1860s at Butler Library shows a font that’s a dead ringer for the regular weight of Akzidenz and I doubt that one was especially original. We need to avoid creating sloppy narratives that try to show type design as a string of genius moments and ripoffs and accept it for the slow, deliberate, and derivative process that it usually is.</p>
