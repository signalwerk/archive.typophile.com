    <p>Hey everyone!</p>
    <p>I have currently been looking for Helvetica knockoffs, and am not entirely sure that I've come upon what I exactly need. </p>
    <p>As we all know, Arial is the obvious villain in this situation. However, other than Arial, what type faces are a direct knockoff of Helvetica? </p>
    <p>I've got: CG Triumvirate, Pragmatica, Swiss 721, Nimbus Sans, Helv/MS Sans Serif, and Newhouse DT. Now, these are all clearly <em>influenced</em> by Helvetica, but are they also considered knockoffs? </p>
    <p>Also, I was told by someone, fleetingly (hence the forgetfulness), that there is another typeface in existence that is also a direct knockoff of Helvetica. Described vaguely as having portions of Helvetica removed to create it. Anyone have an idea as to what it is? </p>
    <p>Thanks in advance. :)</p>
