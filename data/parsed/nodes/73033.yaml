      <p>I suppose that Max Miedinger's Neue Haas Grotesk, now known as Helvetica, can be considered to be somewhat illegitimately derived from Berthold's Akzidenz-Grotesk, given that Haas hadn't acquired Berthold at that time or anything like that.</p>
      <p>However, while it did use Akzidenz-Grotesk as a source of inspiration, while that face brought some new things to sans-serif faces, it was still not that attractive or inspiring. It was just another sans-serif face in a crowded field.</p>
      <p>Helvetica, on the other hand, was beautiful and magical. That's what makes me come down firmly on the side of viewing it as a new creation, not plagiarism. There are many, many typefaces out there - but their existence can't be allowed to prevent the creation of new typefaces, even if almost any new typeface, unless it's a very weird-looking display face, is going to look close to something else out there. Subtleties are not trifles in typography.</p>
