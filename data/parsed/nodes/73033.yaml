      <p><em>...it seems unlikely that several foundries would import horizontal terminals...</em></p>
      <p>Which typefaces are we talking about?<br>
      Akzidenz Grotesk had horizontal terminals in some sizes, prior to Helvetica.<br>
      But again, if one were to pick out a face as model for this feature, surely it would be Univers.</p>
      <p><em>I still don't quite understand why you think Helvetica Forever “is pumping the myth” here.</em></p>
      <p>It follows the "great man" approach to history, which mythologizes famous people (or fonts) as the agents of change, rather than examining the interplay of technology and society, which accords individual agents less importance.</p>
      <p>So the book is named "Helvetica Forever," rather than "Grotesque Forever," simultaneously cashing in on the myth, and reinforcing it. Such is the feedback loop by which myths thrive.</p>
      <p>Another element of myth-making is the marginalization of secondary players.<br>
      With the Helvetica myth, its relationship with the grotesque continuum is minimalized, hence its knocking-off from Akzidenz Grotesk is downplayed. This involves eulogizing Helvetica's color, spacing and refinement as the key qualities of Helvetica's design and success, which is no doubt correct, but does that really constitute enough design to be considered an original typeface? perhaps then, but shouldn't we know better now?</p>
      <p>Excuse me while I get back to working on my latest typeface, Gotham with the terminals straightened out, to be named Cabotia.</p>
