    html: <p>It's hard not to veer too close Helvetica/AG/Arial because they're balanced, conventional and expressionless. <a href="http://www.typodermic.com/221.html">GGX88</a> was designed as text companion to Avant Garde Gothic headings for a set-top box display system. Designing a balanced, somewhat modular sans serif font with a large x-height, not much expression and conventional shapes can bring you really close to Helvetica unless consciously taking measures to avoid it. In the case of  GGX88, my client was interested in sharing some of the characteristics of Avant Garde Gothic while remaining conventional &amp; neutral.</p>
