      <p><em>...and others who issued alternative letters for their typefaces to make the feel more Helvetica after its huge success...</em></p>
      <p> Aren't you just pumping the myth (like <em>Helvetica Forever</em>)?</p>
      <p>There was a technological sea-change in typesetting at the time, as there frequently is, driven by changes in technology and business practice. If a foundry had a grot, and they all did, they reworked it. Cleaning up one's catalog for multiple-device setting -- including the most demanding and non-size-specific, typositor reel -- is something foundries were duty-bound to, not because they were aping Helvetica. AG was a prime candidate, being so very inconsistent between metal sizes. </p>
      <p>Sabon was a cleaned-up, multi-device Garamond, and illustrative of this process, and certainly not a Helvetica me-too.</p>
      <p>Helvetica was still a hodge-podge of metal idiosyncracies between styles (note the spur of "a" at different weights) compared to The System demonstrated by Univers, which was the iconic and intellectual centre of the movement.</p>
      <p>Another driving force was the role of the International Style in modernist corporate identities, with design systems which demanded smoothly variable plastic qualities of a typeface, making that the focus of attention.</p>
      <p>Avant Garde may be considered a simplified Futura, removing its style inconsistencies (e.g. pointy apexes in lighter weights, different "C" form in condensed styles, curve distortions of extra bold weights).</p>
