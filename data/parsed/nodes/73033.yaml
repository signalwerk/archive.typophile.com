      <p>&gt;&gt; Akzidenz-Grotesk (the mother of helvetica), Folio, Maxima, Univers Std, Paralucent</p>
      <p>Calling Akzidenz-Grotesk the mother and a knock-off at the same time is interesting. It was in the form of »Serie 57« and later AG Buch though, but then you'd want to include Monotype Grotesk also and others who issued alternative letters for their typefaces to make the feel more Helvetica after it's huge success, f.e. Norma and Linea.<br>
      Univers and Folio were issued at the same time in 1957 (Univers developed since 1952), so it's hard to call then knock-off's. As I wouldn't call a further developement of the same typeface like Neue Helvetica.</p>
      <p>But there are Aristocrat, Claro, Corvus, Geneva 2, Hamilton, HE, Helios &amp; Helios II, Helv, Helvestar, Helvette, Newton, Nimbus Sans, Megaron, Sans, Spectra, Swiss 721, Switzerland, Vega and Video Spectra. </p>
      <p>Maybe the book <a href="http://www.lars-mueller-publishers.com/en/catalogue-design#helvetica-forever" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Helvetica forever</a> is an interesting read for you.</p>
