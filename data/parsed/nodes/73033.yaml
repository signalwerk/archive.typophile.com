      <p>Here's the Gothic (some other weights are also present) from the Cincinnati type specimen for 1870. Akzidenz Grotesk it isn't, although it has some interesting properties:</p>
      <p><img src="/sites/default/files/old-images/cin70_5312.jpg"></p>
      <p>It clearly is humanistic rather than geometric, and it isn't horribly ugly like many of the older grotesques, so it could indeed be categorized as a neo-grotesque. But it's not clear to me that this is actually all that far ahead of its time, as Franklin Gothic already existed back then.</p>
      <p>Note how capital C and capital U, for example, have varying stroke widths. That's definitely not Akzidenz, but it is very interesting.</p>
      <p>Now, the light weight may look a bit more like Akzidenz, but then the basic letter forms have been around for a long time in handprint...</p>
      <p><img src="/sites/default/files/old-images/cin_ligh_5700.jpg"></p>
      <p>For comparison...</p>
      <p><img src="/sites/default/files/old-images/akzid_3544.jpg"></p>
