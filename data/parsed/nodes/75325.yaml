      <p><cite>why are we not the ones making the rules around how it can be re-used for the greater good- and to this end would a worldwide and uniform system that designers can subscribe to and feel protected by be worth looking into?</cite></p>
      <p>Design is just one of the creative activities that need to be protected among many others (painting, writing, sculpting, etc.), and most of them are covered by the law in different grades in many countries. If some special “worldwide and uniform system” is required specifically for designers, it should not be something you “can subscribe”, but something you MUST follow, whether you like it or not, so it can be “worldwide” and “uniform”. But that is pretty close to something called “law”, and it already exists. Of course the law is perfectible and actually it is feasible to change it, but first you must convince everybody that your system is better than the existing one, and to achieve this is not an easy task: to begin with, IMHO 10 to 15 years is a really short time. I feel more protected by the laws in my country (100 years after my death) and the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Berne_Convention_for_the_Protection_of_Literary_and_Artistic_Works" rel="nofollow">Berne convention</a>.</p>
