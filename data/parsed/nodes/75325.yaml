    <p>I'm curious what the view is within this community regarding copyright.</p>
    <p>How long should it stand as yours, and nobody can use your work without paying for it or gaining written consent? How long are economic benefits ethically able to be gained from the work?</p>
    <p>The main question I want to see responses to- We are all designers in one way or another, we are those making the content that is needing protection- why are we not the ones making the rules around how it can be re-used for the greater good- and to this end would a worldwide and uniform system that designers can subscribe to and feel protected by be worth looking into?</p>
    <p>If there are any resources or interesting articles and examples you have come across, this is the place to put it to add to the discussion.</p>
    <p>&gt;&gt;</p>
    <p>My view is I ought to be able to benefit from the work financially for 10 to 15 years, after which point the work is available to all free of charge to be adapted and copied for whatever use. I personally don't like the idea of holding back others' creativity with my work just because I can. I'll never truly see the fruits of my labours unless I allow it to grow.</p>
