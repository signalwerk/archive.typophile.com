    html: "<p>Rebecca, it probably won't surprise you that experimetal minimalism in type has been attempted by a number of people in the past. But that doesn't mean you shouldn't try your own hand it. In fact I would recommend that you specifically <i>avoid</i> looking at other past attempts at this! This is such an extreme thing that it's necessarily personal, and outside influences can stunt the critical early stage of the process. <br> <br>We could give more advice about specific \"tricks of the trade\" shall we say but it seems to me that's tangential right now. You're not planning on producing a mainstream text face, and trying to absorb too much of the craft too early might actually distract you from the whole point of your effort. I guess the one general thing I myself would recommend though is this: observe the alphabet, in all its incarnations, to try to get at its essence, and thereby the essence of its elements - remembering that the letters are only really themselves in the context of the whole system. <br> <br>So maybe do your own thing, in private, but then do please show us what you got! <br> <br>hhp</p>"
