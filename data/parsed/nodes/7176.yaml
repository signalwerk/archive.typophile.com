  html: <p>Hi, I'm new around here so please be gentle ;)  <br> <br>I am currently writing my own brief for a college project and I've decided to design my own typeface in a minimalist style. As I'm a complete novice I only have limited knowledge of type but I love typograpghy and so I've set myself this task. I'm not asking for my work to be done but any nippets of advice would be greatly appreciated, like things to avoid or whats a good programme to develop my font in. Any help would be fantastic.  <br> <br>Bec</p>
