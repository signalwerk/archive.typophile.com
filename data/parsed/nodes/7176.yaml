    html: <p>I'd recommend fontlab, or it's paired down little brother, typetool available at <a href="http://www.fontlab.com" target="_blank">http://www.fontlab.com</a>. There really isn't another good option. I would also recommend Leslie Cabarga's book Learn Fontlab Fast. Available at the fontlab website. <br> <br>Randy</p>
