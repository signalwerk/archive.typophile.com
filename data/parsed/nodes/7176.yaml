    html: "<p>Leslie Carbarga's other book, <i>The Logo, Font, and Lettering Bible,</i> (<a href=\"http://www.logofontandlettering.com/\" target=\"_blank\">http://www.logofontandlettering.com/</a>) is a great intro about how to begin to draw and design letters and typefaces, and is less technically specific that <i>Learn FontLab Fast,</i> yet still offers some good tips. It is a fantastic book! <br> <br>In terms of advice, the only pieces that I can think of without hearing more about what you would like to do are these: <br>1. Design (draw) entire words first, not single letters. Letters in a typeface don't exist in a vacuum, but rather in context with one another. <br> <br>2. Remember the negative spaces! The spaces inside the letters, and the spacing in between the letters is just as important as the letterforms themselves. Erik Spiekermann wrote that type designers don't design marks on a page, but rather the spaces around those marks (or something like that�). Often, novice designers spend all their time designing the font's glyphs, and then quickly space and kern, or auto-space and kern, and their outputed fonts suffer for that.</p>"
    html_clean: "<p>Leslie Carbarga's other book, <i>The Logo, Font, and Lettering Bible,</i> (<a href=\"http://www.logofontandlettering.com/\" target=\"_blank\" class=\"link-external\">http://www.logofontandlettering.com/</a>) is a great intro about how to begin to draw and design letters and typefaces, and is less technically specific that <i>Learn FontLab Fast,</i> yet still offers some good tips. It is a fantastic book! <br> <br>In terms of advice, the only pieces that I can think of without hearing more about what you would like to do are these: <br>1. Design (draw) entire words first, not single letters. Letters in a typeface don't exist in a vacuum, but rather in context with one another. <br> <br>2. Remember the negative spaces! The spaces inside the letters, and the spacing in between the letters is just as important as the letterforms themselves. Erik Spiekermann wrote that type designers don't design marks on a page, but rather the spaces around those marks (or something like that�). Often, novice designers spend all their time designing the font's glyphs, and then quickly space and kern, or auto-space and kern, and their outputed fonts suffer for that.</p>"
