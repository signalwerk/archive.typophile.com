      <p>Actually, on the same page of the Solotype Catalog (24) as Helven/Helvin is shown Mansard - which has the correct letter widths and middle bar on the E. The <a href="http://abfonts.freehostia.com/solopedia/solopedia-m.htm" target="_blank" rel="nofollow">Solopedia website</a> indicates it exists digitally as Photolettering/Novel.</p>
      <p>Seeing what I can find ...</p>
