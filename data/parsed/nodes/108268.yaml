    html: |-
      <p>This is a reverse weight font, i.e. the strokes are thicker at top &amp; bottom than at the sides, with "Detroit" or "Mansard" serifs. A couple of fonts with a similar but wider design:<br>
      Red Dog Saloon by Font Mesa:<br>
      <a href="http://www.myfonts.com/fonts/fontmesa/red-dog-saloon/" title="http://www.myfonts.com/fonts/fontmesa/red-dog-saloon/">http://www.myfonts.com/fonts/fontmesa/red-dog-saloon/</a><br>
      57 Rodeo by Baseline Fonts:<br>
      <a href="http://www.myfonts.com/fonts/baselinefonts/57-rodeo/" title="http://www.myfonts.com/fonts/baselinefonts/57-rodeo/">http://www.myfonts.com/fonts/baselinefonts/57-rodeo/</a><br>
      I trust that there is also an exact match, but I didn't come across it during my quick check.<br>
      Don</p>
