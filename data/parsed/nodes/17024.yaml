      <p>Thank god for real sc’s an otf. And InDesign, of course.</p>
      <p>I was just thinking about this recently, how InDesign straight up tells you 'Ok, this typeface has small caps, push this button and you're good to go. If the button isn't available then go find another face that does have SC.' In Quark you just have the default Style settings Plain/Bold/Italic/All Caps/All Lowercase/Small Caps etc. and there's no real intuitive way to know if those settings are real or faux. I always use the sub-faces for Italic/Bold etc but you don't have that option for SC. Suggestions for us Quark users?</p>
