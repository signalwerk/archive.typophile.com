      <p>my rule of thumb is as many words as make up the first fragment of the sentence.</p>
      <p>lets try it with: I walked into the bank with a song in my heart and a gun in my hand.</p>
      <p>I WALKED INTO the bank with a song in my heart and a gun in my hand.</p>
      <p>^ too short</p>
      <p>I WALKED INTO THE BANK with a song in my heart and a gun in my hand.</p>
      <p>^ just right</p>
      <p>I WALKED INTO THE BANK WITH A SONG in my heart and a gun in my hand.</p>
      <p>^ too long.</p>
      <p>Think of the part in small caps on it's own. "I walked into" doesn't say enough, "I walked into the bank" says something on it's own, even though the thought isn't done.</p>
      <p>best of luck, I don't think there's a rule per se, but it's tough to pick sometimes.</p>
