      <p>OK... shoot me if you want to, but I use to entice "high-end" designers into purchasing full families of digital type fonts back in the Agfa MCS Digital Imagesetter days...</p>
      <p>Sometime I would use the look of small cap titling and initial paragraph lead-ins by using a combo of type weights and sizes. Here's a test similar to what I did in promoting fonts --</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/JensonSmCp-test2.png"></div><p></p>
      <p>The first line uses true cut small caps which is correct when setting lowercase charaters within the same line. (BTW -- I did not do any correcting of spacing/kerning on any of these tests, I just wanted to display relative character heights.)</p>
      <p>The second example shows the light weight of Jenson in 40 pts and the "small caps" are simulated by using regular weight of Jenson at 32 pts. The combo looks more like a titling weight and to me balances nicely especially when set on its own line without lowercase to jar the x-height.</p>
      <p>I have a pdf if anyone wants a close-up look. I figured that using a type family in this way must have been very similar to how typographers built book plates and titling pages using a combination of hot metal point sizes and family weights. All in all it promoted the purchase of complete type families.</p>
