    html: |-
      <p>The use of all caps, small caps, and even caps with small caps varies greatly in history, from country to country, publisher to publisher, and in context with the subject of the book (novel, poetry, prose, non-fiction, title page, content page, list of bookplates, indices, etc.).</p>
      <p>I had always found these variations interesting, and in the past would emulate, mix-and-match, innovate or knowingly violate the convention. So it's fair to say, there ARE NO RULES, but stylistic preferences.</p>
      <p>Of note, the first word in a poem, whether using large drop cap or not, was frequently in cap-small caps:<br>
      <a href="http://www.hti.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=acs3105.0001.001;didno=ACS3105.0001.001;view=image;seq=7;page=root;size=s;frm=frameset;" target="new" rel="nofollow"><em>The courtship of Miles Standish,: and other poems./ By Henry Wadsworth Longfellow</em></a></p>
      <p>But in this case, the poem starts with a large drop cap followed by caps:<br>
      <a href="http://www.hti.umich.edu/cgi/t/text/pageviewer-idx?c=moa;cc=moa;rgn=full%20text;idno=aqj4170.0001.001;didno=AQJ4170.0001.001;view=image;seq=13;page=root;size=s;frm=frameset;" target="new" rel="nofollow"><em>Ballads of New England,: by John Greenleaf Whittier</em></a></p>
      <p>Interesting style usage of caps and small caps within the context of Dictionary definitions:<br>
      <a>MILITARY DICTIONARY, published by D. Van Nostrand, New York, 1861.</a></p>
      <p>Sometimes I've seen only the first word in caps or caps/small caps, and sometimes I've seen the entire first line done in a combination of all caps followed by cap/small caps.</p>
      <p>I think I've shown this piece I did at Compugraphic in 1981 --<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/CG_48-2.jpg"></div><p></p>
