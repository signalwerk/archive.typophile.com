    date: 2005-12-30T16:15:00
    votes: null
    html: |-
      <p>Whether started with a drop cap (initial) or simply led in with small caps, I follow the style that uses a phrase or a partial statement:</p>
      <p>AT THE OUTSET there was no etc.,<br>
      IN HIS HASTE he dropped a wrench etc.,</p>
      <p>If one sets only the first word in small caps the lead-ins can look inconsistent, like when the first word is ony two letters. Using a two, three, or even four word small cap lead-in tends to give one a little more to work with in setting a consistent look to each chapter.</p>
      <p>It's also very nice to moderately thinspace the small cap lead-in.</p>
      <p>Jim </p>
      <p></p>
