    html: |-
      <p>Of course, with optically scaled typefaces (of which there are gazillions) the Display version may be used for drop caps. And Swash caps also make for interesting drop caps, breaking the grid.</p>
      <p>Many (if not all) of Goudy’s “hand tooled” styles are available as fonts with complete upper and lower case, not just caps.</p>
      <p>I’ve made a few fonts that ﬁt the bill here, Richler Highlight and Walburn Tooled (no lower case), and Bodoni Egyptian Shadow:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Mms_6160.png"></div><p></p>
