    <p>hi everyone i have a question about unicode naming in fontlab</p>
    <p>i noticed that some glyphs i made don't have a unicode assigned to them just "---"<br>
    How do i go about giving them a unicode and where do i for example find out what the unicode name is for ligatures such as f_k &amp; f_h</p>
    <p>anny help is much appreciated</p>
