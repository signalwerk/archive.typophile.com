    html: |-
      <p>You find all Unicode values at: <a href="http://unicode.org/" title="http://unicode.org/">http://unicode.org/</a><br>
      Only some common ligatures have a unicode however. They are accessed by an OpenType feature.<br>
      In addition you might assign a Unicode value from the Private Use Area (PUA), but that is mostly not recommendable.</p>
