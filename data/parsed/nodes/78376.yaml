    html: |-
      <p>Evie,</p>
      <p>Your f_k ligature (and f_b and f_h) are just like other ligatures. Go look at the features code for a font -- say, an Adobe font. Just do the same thing -- add them to your liga list.</p>
      <p>If you are making a Type 1 font, no Unicode is involved. You just name them. And if for older, hard-wired encoding system, you'll have to lie about the name. "product" and "integral" were common. Here's the problem. When you print text using your font, if those names were in the file, everything will look fine. Change fonts, or reuse the text, and that text is no longer correct.</p>
      <p>Unicode and OpentType work together to avoid these problems. Your f_k ligature is so named, and has no unicode number. In the font features file under "liga" you add</p>
      <p>sub f k by f_k</p>
      <p>Any text (Kafka) set using your font will use the f_k ligature, with the single characters f and k preserved in the file.   </p>
      <p>John:</p>
      <p>Let's suppose you make a PDF. Then you extract text. What happens to the characters that were in the Private Use Area? Gone, aren't they. Let's suppose you export XML from a file that had characters in the Private Use area. What happens? Problem, isn't it.</p>
      <p>So yes, there are reasons to use the PUA, but they come with severe compromises. If a ligature is needed for a font, but not a language, as, for example, is the case with all the f-ligatures in English, they should follow the usual convention. Do not put them in PUA, nor given a Unicode number. Even if ligatures are needed for a language, as with Arabic, there are ways to avoid PUA usage. PUA is for *characters* that just do not exist in Unicode, and are not constructions of characters already within the encoding.</p>
