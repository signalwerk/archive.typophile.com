    html: |-
      <p>Basically, from the Unicode point of view, a text consists of letters and no ligatures. A ligature is just a device used by a font to present the text in the traditional appearance people are comfortable with.</p>
      <p>Of course, this assumes that the writing system is sufficiently simple that it is, in fact, reasonable to expect that an algorithm that can be coded inside a font will be sufficient to apply the rules for ligature use. If, instead, the appropriate and reasonable solution is for ligatures to be inserted manually by the typist when they are appropriate - and when preparing texts that are going to be used for printing and display, and not for other types of machine input - then this aspect of the philosophy of Unicode fails.</p>
      <p>In Burmese, for example, the technology required to print Burmese properly using Unicode Burmese as input is not yet standard - so users make do with fonts that have extra characters in unused Unicode positions in the Burmese block, because that is the most convenient thing to do, at least in the short run.</p>
      <p>Certainly, it is at least awkward, using, say, a Unicode Arabic font, to use it to type a table of the glyphs that font can generate. One can't do that simply by typing, with tabs, the characters of those glyphs if some of those glyphs don't exist as characters. Putting every glyph in a font in the Private Use Area solves <em>that</em> particular problem, of course.</p>
