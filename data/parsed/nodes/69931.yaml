    html: <p>I'm definitely no Futura expert, but thought I'd respond. From what I understand, these letters come from a draftsman/architectural perspective. The Gotham typeface was derived from an exploration of these letterforms. Many of these characters are similar to Gotham, but single-join of the K is different. So, since these letterforms were often designed by draftsmen, you may not find an exact match. You might also want to look at Nobel and Agenda.</p>
