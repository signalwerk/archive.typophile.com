    <p>Hi all:</p>
    <p>Here is a sign application that I'm wondering how to match. It's clearly a Futura-inspired face, or simply a different cut of the face than the current Adobe "Futura Std" OpenType version I have. But, I'm not sure.....any Futura history specialists out there?</p>
    <p>Here is the sign with the Adobe Futura as a pink overlay. You can see that the "3" and "S" are more open in aperture in the signage version, the periods are also rectangular instead of round, and the probably most telling, the leg of the "R" doesn't connect the bowl right at the stem intersection...it starts further down the bowl.</p>
    <p>Any help is greatly appreciated!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/SiskEntrySign_withOverlay_4092.jpg"></div><p></p>
