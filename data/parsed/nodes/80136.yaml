    date: 2011-04-23T08:29:00
    votes: null
    html: <p>That's looking lovely. I agree witgh eliason, that you might experiment a bit more with the v, w and k, to bring that curvy character into them. I also think the s can use some work, and the z could use a bit more conrast between the horizontals and the diagonal. Perhaps the hook of the f could use a slightly more pointy terminal? I.e. like the bottom of the j, but not as much.</p>
