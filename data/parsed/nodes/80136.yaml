    <p>Care to critique these lowercase forms? Still working on the /y/, but I'd like some input on the rhythm so far and how it can be improved. Not too happy with that /s/, though. I just saw Sudtipo's newly released <a class="freelinking external" href="http://new.myfonts.com/fonts/sudtipos/fiance/" rel="nofollow">Fiancé</a> which has the same soft-ness I'm going for. It has what I call a baby s...maybe I'll take cues from that.</p>
