    html: |-
      <p>I like it a lot. It's very friendly. I especially like the g and the w.</p>
      <p>The s looks light in the middle. I hate trying to do 's's in fat fonts, but I think it's better to take bulk off of the terminals, rather than the middle.</p>
      <p>You have some general x-height correction to do. When I look really closely, even the x and z don't seem to match, and look at 'ese.'</p>
      <p>The upper right arm of the x looks thinner than the others. It's not that noticeable, but the crossing of it could use some optical correction too.</p>
      <p>That's all I can see right now :)</p>
