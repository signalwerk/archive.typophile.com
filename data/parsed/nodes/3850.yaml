    html: <p> Ricardo, I really like this face a lot. It's as if "Bauhaus" were to grow up. (At least it's a more modern take on it). <br> <br>I have to agree with Stephen a bit here, that some of the letters are filling in--the caps A and M especially. It's starting to take on an over-inked quality, somewhat like FF Blur. <br> <br>In both regular and bold it seems like the lc j is too thick, or perhaps it's the descender that's too curved. Or, perhaps I'm just extra sensitive to Js because I have one at the start of my name. <br> <br>Good luck, <br> <br>joe </p>
    html_clean: <p> Ricardo, I really like this face a lot. It's as if "Bauhaus" were to grow up. (At least it's a more modern take on it). <br> <br>I have to agree with Stephen a bit here, that some of the letters are filling in--the caps A and M especially. It's starting to take on an over-inked quality, somewhat like FF Blur. <br> <br>In both regular and bold it seems like the lc j is too thick, or perhaps it's the descender that's too curved. Or, perhaps I'm just extra sensitive to Js because I have one at the start of my name. <br> <br>Good luck, <br> <br>joe </p>
