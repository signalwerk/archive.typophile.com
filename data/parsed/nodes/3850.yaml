    html: <p>Hello Stephane and sorry about to respond only now. The reson that I prefereded included the old style figures on my Focus presentation was to broked the rigid and all linning visual references. On my original set I had inclued the linning figures, like you can see on this last images to exemplify the idea. Like I said on my explication introduction, this type face derive from other my project "Van", which I tryed to change the felling and give a new apperence to this typography (mix the old and modern abordage). All most my type faces Have linning figures on my principal set and normaly I <br>reserved old style figures  to differents version. I add the exemples on  a image to show you the other figures. <br>Thank's for the questions and the encourage.  <br> <br>Best regards / Ricardo <br> <br><img src="http://www.typophile.com/forums/messages/29/423.jpg" alt="Text Description"></p>
