    html: <p>Another nice one, Ricardo. I like the general letter <br>shapes. They remind me of Haapaaranta's designs... <br><a href="http://209.192.249.179/fonts/fontshow/db.cgi?db=default&amp;uid=default&amp;ID=807&amp;ww=on&amp;view_records=View%2BRecords" target="_top">http://209.192.249.179/fonts/fontshow/db.cgi?db=default&amp;uid=default&amp;ID=807&amp;ww=on&amp;view_records=View+Records</a> <br> <br>and some of the bauhaus faces... <br><a href="http://bowfinprintworks.com/BauhausFaces.html" target="_top">http://bowfinprintworks.com/BauhausFaces.html</a> <br> <br>While I love rounded outside corners (they make <br>me giddy) the bleeding inside corners are a bit  <br>extreme for me (especially in the Regular weight),  <br>but that may be personal preference, rather than a  <br>real problem. Also, are those notches taken out of  <br>the right feet on the Bold 'M' and 'N' and bottom of  <br>the 'V' or is it just the GIF file behaving poorly? <br> <br>Stephen</p>
    html_clean: <p>Another nice one, Ricardo. I like the general letter <br>shapes. They remind me of Haapaaranta's designs... <br><a href="http://209.192.249.179/fonts/fontshow/db.cgi?db=default&amp;uid=default&amp;ID=807&amp;ww=on&amp;view_records=View%2BRecords" target="_top">http://209.192.249.179/fonts/fontshow/db.cgi?db=default&amp;uid=default&amp;ID=807&amp;ww=on&amp;view_records=View+Records</a> <br> <br>and some of the bauhaus faces... <br><a href="http://bowfinprintworks.com/BauhausFaces.html" target="_top">http://bowfinprintworks.com/BauhausFaces.html</a> <br> <br>While I love rounded outside corners (they make <br>me giddy) the bleeding inside corners are a bit  <br>extreme for me (especially in the Regular weight),  <br>but that may be personal preference, rather than a  <br>real problem. Also, are those notches taken out of  <br>the right feet on the Bold 'M' and 'N' and bottom of  <br>the 'V' or is it just the GIF file behaving poorly? <br> <br>Stephen</p>
