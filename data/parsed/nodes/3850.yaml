    html: <p> Hello ruben and thank's to asking for this good pointing. Your pointing is not a problem and of course that I like answer to all kind of questions which give me other vision about this and other works. The reson of the differences betten old style and linnig are because I wanted use the rigid form on linnig figure ( 1 ) without bar. <br>The version with old style figures I prefered used a bar to make a different contrast ( simulate serif) and because this typography starts from a tipical sans-serif and during the time I had been make corrections and change some points that are convencional in this kind of family. And of course that I admired this kind of apperence (with bar) which I had been thinkig to used on future projects on the linning set. Thank's and regards / Ricardo </p>
    html_clean: <p> Hello ruben and thank's to asking for this good pointing. Your pointing is not a problem and of course that I like answer to all kind of questions which give me other vision about this and other works. The reson of the differences betten old style and linnig are because I wanted use the rigid form on linnig figure ( 1 ) without bar. <br>The version with old style figures I prefered used a bar to make a different contrast ( simulate serif) and because this typography starts from a tipical sans-serif and during the time I had been make corrections and change some points that are convencional in this kind of family. And of course that I admired this kind of apperence (with bar) which I had been thinkig to used on future projects on the linning set. Thank's and regards / Ricardo </p>
