      <p>Loremipsum&gt; Thank you again for your suggestions. Although I’m even more sure than ever about going with Merlo, I’m putting Corundum on my shopping list because its also super crisp, very well honed, and is an excellent value.</p>
      <p>Freight is also on my list but not anytime soon.</p>
      <p>Clifford; I love, not crisp, but I love that one too. Akira Kobayashi said he would release an opentype version. I’m waiting for that one.</p>
      <p>I’m waiting for someone to do a serious learned reinterpretation of Kis. I like Tyrnavia very much. I just wish Gabor Kothay would come back to it and refine the kerning and perhaps the lowercase italic w. Also, improve diacritic placement.<br>
      Font Bureau (Studio) has an interpretation of Kis. Very nice, but definitely suited to newspapers it doesn’t have the left handed swashes in the lowercase italics (that I like) that would make it feel more literary.</p>
      <p>Nexus is also on my list. Very crisp and kinda funky.</p>
      <p>But Merlo for sure is happening. Although, I wish it had a bold.</p>
      <p>Thank you all for your responses. This was helpful.</p>
      <p>Mike Diaz :-)</p>
