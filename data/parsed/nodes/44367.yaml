    html: |-
      <p><cite> &gt; (Iowan and Arrus were given them only recently). </cite></p>
      <p>That may or may not be true for Arrus, but Iowan Old Style had oldstyle figures from the very start. Granted, they were not default in the U&amp;lc fonts, being included in the Small Caps fonts instead. But this was a common enough arrangement in the days of its release, along the Adobe Expert model.</p>
      <p>John was very thorough in this design, including many characters that the old formats couldn't adequately accommodate (like Catalan l-dot-l, fully-composed Polish ogonek characters, Croatian dyet) and which all had to be off-loaded to an "extension" font. All available in the 2001 release. John and Dennis were ahead of the curve.</p>
      <p>You may feel that Bitstream is "indifferent" to oldstyle figures, but you can't use Iowan Old Style as an example.</p>
      <p>-- K.</p>
