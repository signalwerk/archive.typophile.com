    html: <p>The Linotype/Adobe Stempel G has oldstyle figures either default-loaded (Linotype) or globally switchable in OpenType (Adobe OT); Bitstream has long been indifferent to oldstyle figures (Iowan and Arrus were given them only recently). That's the clincher for me; I would never use liner figures with any Garamond if I could help it.</p>
