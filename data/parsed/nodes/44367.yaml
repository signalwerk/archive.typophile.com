      <p>Thank you guys for all you comments. Unfortunately after going through all the Stempel Garamonds (and ilk) I found all digitizations  to be poor (Linotype) or incomplete (Bitstream). Most of the fonts I looked at had serious lapses in kerning. My favorite— “ara” as in garamond looks “gar” and “amond”.</p>
      <p>I wanted something designed for text but crisp and “sculptural” enough to be used for occasional light-duty display work. </p>
      <p>I’ve narrowed it down to Merlo, with Rongel and Verdigris also right there. I already have Minion and I’m not a Sabon person.</p>
      <p>Did I miss anything?</p>
      <p>Mikey :-)</p>
