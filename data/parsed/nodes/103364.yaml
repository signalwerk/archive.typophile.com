      <p>I suppose you mean the "Infinity" script at bottom right?<br>
      It is published as <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/grouptype/carpenter/" rel="nofollow">Carpenter Script</a></strong> by James West (GroupType, 1993-06), also published as <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Image-Club-Graphics&amp;ffam=Carpenter%20ICG%20-%20Regular&amp;fid=ed5f15f3d21a6471339c40baed679c07&amp;fsize=60&amp;text=Infinity&amp;fit=1" rel="nofollow">Carpenter ICG</a></strong> by Image Club Graphics and digitized as <strong>Carpenter Script</strong> by Dan X. Solo. (1999, Dover Publications CD)<br>
      It's also available as <strong>OPTICarmella HandScript</strong> (Castcraft Software, Inc. 1990-1991) and cloned under different names by several well-known font forgery companies like NovelFonts, FontBank &amp; SoftMaker.</p>
      <p>I don't know what "sweet paper" is, but some contrast &amp; perspective correction might help somebody else to find out:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/sweet-paper-01_5594.jpg"></div><p></p>
    html_clean: |-
