    html: <p>That's great, Mark. I suppose I'm tipping my typographic hand a bit now. The ligatures certainly add a dimension that I wasn't aware of.  <br> <br>Avant Garde was held up critically next to Futura by one of my professors back in school, with great disdain. She said she'd give us a 'retro-active F' if she caught us using it. In retrospect, she was probably just violently steering us away from using it as a text face...  <br> <br>...now that I look at it, was that the typeface for the movie <i>Alien</i>? Not the one used on the poster, but the one used in the title sequence. Or am I confusing it with <i>Altered States</i> now? <br> <br>My cursory web research reveals that it may be a similar condensed face for <a href="http://www.fox.co.uk/home_ent/i/packshots/alien_boxset_repromo.jpg">Alien 3</a>, but Avant Garde for <a href="http://www.movieactors.com/photos-sf/altered.jpeg">Altered States</a>.</p>
