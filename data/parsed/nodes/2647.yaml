    html: "<p>It's like Avant Garde was designed for home users to create logos. All those ligatures just beg to have logos made for anything and everything. That's probably why its everywhere. <br> <br>As for Ashanti... here's the cover BJ posted about: <a href=\"http://images.amazon.com/images/P/B00009VRDI.01.LZZZZZZZ.jpg\" target=\"_blank\">http://images.amazon.com/images/P/B00009VRDI.01.LZZZZZZZ.jpg</a> <br> <br>The band Travis didn't start using that logotype until their releases surrounding \"The Man Who\" (instead they used the one shown here: <a href=\"http://images.amazon.com/images/P/B000002BZD.01.LZZZZZZZ.gif\" target=\"_blank\">http://images.amazon.com/images/P/B000002BZD.01.LZZZZZZZ.gif</a> ); however, the logo has stuck ever since and I'm pretty sure they're gonna take it to their grave.</p>"
