    html: "<p><a href=\"http://www.cgnyc.com/pages/identity/identity.html\" target=\"_blank\">Chermayeff &amp; Geismar</a> designed the identity for Mobil in 1964, the logo was custom drawn. It does resemble Avant Garde, but there are many subtle differences. They also created a propriatery typeface for Mobil (based on the logo), a full page color example of it can be found in their recently published book <a href=\"http://www.cgnyc.com/pages/about/designing.html\" target=\"_blank\">\"designing:\"</a> <br> <br>Here's a low res b/w image of it: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/23821.gif\" alt=\"mobil\"> <br> <br>� 2003 Chermayeff &amp; Geismar Inc.  <br></p>"
