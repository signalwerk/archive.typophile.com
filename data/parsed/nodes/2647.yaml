    html: <p>&gt;the Vs in the logotype have a vertical left  <br> <br>I think those were actually included in the original Avant Garde release as ligatures. I seem to recall that there was an entire series of cool display ligatures - even for the rub-down letters. But probably not for any digital release. <br> <br>Lubalin's <i>Family Circle</i> logotype comes to mind - although it's not Avant Garde, no doubt, but once again in the same vein.  <br> <br>And surely to god U&amp;lc used Avant Garde back in the day. If there are any issues of that around.</p>
