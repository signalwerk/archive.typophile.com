    html: <p>The font is based on the <i>Avant Garde</i> magazine (hence the name) logotype designed by Herb Lubalin, hence its inferiority to Futura (in my unsolicited opinion). <br> <br>So, it's technically on the cover of <i>Avant Garde</i>, in that its inspiration is there, but they aren't all the same letterforms. For example, the Vs in the logotype have a vertical left extender, rather than an angled one. This would be a fun/ relevant example, at least, if not a strict example.</p>
