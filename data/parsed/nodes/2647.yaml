  html: <p>I need help!! <br>I'm writing an essay on ITC Avant Garde Gothic, and need examples of usage! I know about Adidas and Mobil (does anyone know when these were designed?), but are there anyone else? <br>Hope for a quick reply, as the hand-in date in Monday next. <br>Thanks!</p>
