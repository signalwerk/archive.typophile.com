    <p>Anyone know where I can get hold of a guide to drawing classic military lettering?</p>
    <p>There's a fragment of an good example at Tal Leming's site:</p>
    <p><a href="http://www.typesupply.com/portfolio/typefaces/united/" title="http://www.typesupply.com/portfolio/typefaces/united/">http://www.typesupply.com/portfolio/typefaces/united/</a></p>
    <p>I am sure I have seen a similar spec sheet for the USAAF taht this free font is based on, all done with straight lines, but can't now locate it.</p>
    <p><a href="http://hans.presto.tripod.com/fonts/usaaf.html" title="http://hans.presto.tripod.com/fonts/usaaf.html">http://hans.presto.tripod.com/fonts/usaaf.html</a></p>
    <p>I could probably reverse-engineer but wondered if anyne could help.</p>
