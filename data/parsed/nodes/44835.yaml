      <p>You're welcome, Elliott. I did some more research this morning (anything is better than working), and found an earlier manual that was on the street in 1941, although the available copies are from the 1949 revision. The manual number is TO 07-1-1, "Aircraft Camouflage, Markings, and Insignia," and copies (US$15-$20) can be bought at:</p>
      <p><a href="http://www.eflightmanuals.com/detail/itemList.asp?cID=4528" title="http://www.eflightmanuals.com/detail/itemList.asp?cID=4528">http://www.eflightmanuals.com/detail/itemList.asp?cID=4528</a></p>
      <p><a href="http://www.esscoaircraft.com/product_p/16427.htm" title="http://www.esscoaircraft.com/product_p/16427.htm">http://www.esscoaircraft.com/product_p/16427.htm</a></p>
      <p>There's a book titled "Usaaf Aircraft Markings and Camouflage 1941-1947" that's on <a class="freelinking external" href="http://www.amazon.com/Usaaf-Aircraft-Markings-Camouflage-1941-1947/dp/0764302469" rel="nofollow">Amazon</a>, but it's US$58.</p>
      <p>Wikipedia has <a class="freelinking external" href="http://en.wikipedia.org/wiki/Unit_identification_aircraft_markings" rel="nofollow">an interesting article on WWII aircraft markings</a> (the color bands and unit insignia), but it doesn't cover the lettering.</p>
      <p><a class="freelinking external" href="http://www.tlai.com/med_des/modeling.html" rel="nofollow">This site</a> has a number of geometric aircraft fonts that look pretty authentic.</p>
