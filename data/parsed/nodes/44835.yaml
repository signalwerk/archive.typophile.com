      <p>The current US Air Force spec is TO 1-1-4, Exterior Finishes, Insignia, and Marks Applicable to United States Air Force Aircraft. There's a copy <a class="freelinking external" href="http://www.freeflightdesign.com/pdf/TO_1-1-4.pdf" rel="nofollow">here</a> (5 MB PDF). For Navy and Marine Corps, it's MIL-STD-2161(AS).</p>
      <p>However, USAAF (US Army Air Force) specs would date back to WWII or earlier and might be hard to find. There are probably WWII enthusiast web sites or news groups that could help with those.</p>
    html_clean: |-
