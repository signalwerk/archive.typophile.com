      <p><cite>Lula- thanks but I have all that info in 2 pages of copious notes on exactly those questions and more when I met them..I didn’t think I needed to type it all out here.</cite></p>
      <p>Great! Now, forget all the formal hints. Even the house-like interdiction.<br>
      Blueprints, for instance, are a reference from technical designers to technical designers, this may truncate the type of clients their image attracts.</p>
      <p>Frankly, what I mean is: if you can't use "house" as a concept/figuration, what will you use instead? You've presented many concepts, one proposal for each.</p>
      <p>Sorry for my bad english, hope this helps!</p>
      <p>Cheers!</p>
