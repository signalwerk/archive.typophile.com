      <p>Thanks everyone appreciate all your comments...and I'm feeling a bit better this morning!</p>
      <p>Lula- thanks but I have all that info in 2 pages of copious notes on exactly those questions and more when I met them..I didn't think I needed to type it all out here. </p>
      <p>Mark- yes I see it now- its called delerium and desparation :)</p>
      <p>Geeza- thanks will have a play with that.</p>
      <p>Ratbaggy- in saying avoiding house logos I actually meant a physical house symbol...they actually want to do more residential work- i tried a key type reference(where the "i" is) I tried a doorknob motif somewhere...I just don't know. The clients wanted a blueprint blue- etc because they pride themselves on their superior documentation.<br>
      It's actually L.R.W (initials) I tried some designs that way but client had a strong preference (before i even started designing- they havent seen anything yet) for lowercase which in terms of consistency of their branding/website etc I can see their point. I did try playing with the lrw bit but everything looked old school and not modern- or TOO modern....but you've got me thinking will try some more tonight. Thanks so much.</p>
      <p>M.</p>
