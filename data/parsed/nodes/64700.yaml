      <p>Hello!</p>
      <p>Well, in my humble opinion: none of them.<br>
      And this is for a simple reason: the briefing is too simple.</p>
      <p>- What kind of target-clients are they seeking?<br>
      - Which are the idiosyncrasies of their work? Do they have a particular style?<br>
      - Why would they want to redesign their brand?<br>
      - Which kind of people would seek your client's services?</p>
      <p>When you and your client are not happy with anything, start fresh. And remember: do not show your client anything that you dislike. ;)</p>
      <p>Cheers!</p>
