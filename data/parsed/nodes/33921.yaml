    <p>I know, i know, there have probably been a million posts about typeface formats, but i still get confused by the differences in opentype, postscript, truetype, and whatever else there is. As you can tell, i am not a typeface master, which is why i am here asking you guys what you normally buy. I am getting to the stage where i will soon be investing in typefaces to use as a designer, and i just kind of wanted to see what format everyone seems to mostly buy.</p>
    <p>Also, I am on a PC right now, but in the next year or so, i will most likely be switching over to a mac. </p>
    <p>Any help is greatly appreciated. Thanks!</p>
