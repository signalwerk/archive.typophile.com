      <p>OpenType isn’t quite as bad as Stephen Cole’s pictures indicate. Unlike the Swiss Army knife, you can do real work with it, though like the Swiss Army knife, you do encounter situations where it’s limitations really get in the way.</p>
      <p>I assume you aren’t asking the question “what’s the difference” from a technical point of view. From the practical point of view, you would have to make the decision based on what you actually do with type — what is now called the “workflow.”</p>
      <p>At a deeper level, at some point you will likely have to change to the OpenType format. Type is software now, and what works depends on other software.</p>
