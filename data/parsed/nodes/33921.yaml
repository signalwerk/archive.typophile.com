      <p>&gt; <em>I am getting to the stage where i will soon be investing in typefaces to use as a designer</em></p>
      <p>Try to stay away from Type 1 as much as possible. This is an old-old format (20+ years) that nowadays can’t deliver what is needed. OpenType (TT or CFF) — and TrueType to some extent —, is where you should put your money.</p>
