  html: |-
    <p>I have an .indb file connecting several layout documents into one “book”. The forelast of these doc.s ranges up to page 430 in the actual layout and in the pages palette. But in the .indb list this document conts up to page 440. Hence the numbering of the subsequent doc. commences wrongly with p. 441.</p>
    <p>Has anyone a clue to this?</p>
