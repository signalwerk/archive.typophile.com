    html: |-
      <p><em>maybe there is a reason for that other than poor implementation</em></p>
      <p>Surely. Book feature can be used to achieve a number of multiple document changes.</p>
      <p>For example: you can use it to harmonize styles between several docs, you can build a book just to print, package or preflight dozens of separate files at once, you can synchronize colours, conditional texts and variables or you can just export a group of individual files to a single PDF. In all these situations, page number update may be undesired.</p>
      <p>So, the way Book works is actually adequate to the many goals it can afford.</p>
