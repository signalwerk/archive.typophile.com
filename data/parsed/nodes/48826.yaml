    html: <p>That thread is fabulous. OK - - set all the available versions at 7-9 points and tell me which is the most pleasant to read. I don't want to go out further on a plank here, but, I also think Souvenir has considerable virtues. I know it was the most reviled font of the tasteful '90s, but - - - it fits together with such harmonic felicity - - presents such a gloriously even color - - what other design comes close? I don't want to see it, I don't want to set it, but I do think it has virtues we could all learn from. And seriously - - now that ITC has no clout whatsoever - - we have to rescue its gems from obscurity. What about the Jenson revival - - forgot its name - - Golden Cockerel - - Founders' Caslon - - and of course the one text font that can really be taken seriously by purists, ITC Bodoni.</p>
