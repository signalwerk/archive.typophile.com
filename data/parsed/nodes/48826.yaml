      <p>I stopped using either in the mid '90s, it was time to move on.<br>
      So I don't know how much relevance my experience with them would have today.<br>
      Generally, I used the whole family of Adobe Garamond; with the "Expert" fonts it was my go-to face for all the complexities of traditional typography.<br>
      I think today that kind of usability has been surpassed by faces like Arno, with all its optical sizes and other features and glyph sets, and Atma, with all its small cap options.<br>
      I rarely used the normal width of ITC Garamond, but the Condensed styles were brilliant, especially if you wanted to create an imposing headline and there was too much copy. Not only is it condensed and with a big x-height, but you could squish it even more without that looking too obvious.<br>
      On occasion, I used both Adobe and ITC Garamond Condensed in the same job.</p>
