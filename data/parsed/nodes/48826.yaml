      <p>Oh Hrant, don't make Apple into another windmill. Of course there is much to criticize, but . . . . for heaven's sake, the things they do! Here's something I wrote when I reviewed the 2nd generation G5:</p>
      <p>"When Apple's G5 first came out in June, 2003, a group of design engineers at one of the three largest PC manufacturers took it apart to see what Apple was up to. Providentially, MacDirectory had a fly on the wall at this critical moment. There were murmurers of excitement as each refinement in engineering and manufacturing was discovered. Finally, one of the engineers noticed that where the case turns over at the top, the holes in the case were not elongated. That means they had been drilled after the metal had been turned, an expensive refinement. "But we couldn't build something like this for under six<br>
      thousand dollars!" he said -- and there was a moment of stunned silence."</p>
      <p>On the other hand, Hrant, I take that back. Recently I awarded their 17-inch MacBook Pro but naughtily pointed out that it took Apple something like 8 years longer than Dell to provide 133 dpi screens in a laptop -- and Dell does it at a third of the price. Apple PR hasn't talked to me since. It's always been an obnoxious company, and it gets more so the more successful it is. But when you look at something like Vista, or Word 2007, aren't you glad that Apple exists? That fundamental commitment to intuitive comprehensibility is really wonderful. Go to the MS support site for help. You'll need the patience of a PhD candidate to wade through the inept scribbling. Now go to Apple's support site. Bliss, by comparison! Yes, they're wilful, paranoid, rude, ungenerous, nasty. But it's still a wonderful company.</p>
      <p>To get back to topic, I must say, I still think the only Garamond available that makes beautiful books is Monotype metal. Who cares if it's Jannon? Know what? Jannon's smallest sizes are better than Garamond's. Garamond's greatest genius is in the 18+ point sizes. Meantime, when are we going to get a great digital Plantin? (just as homogenized a Garamond as Tony Stan's ....) What a lot of great books have been printed in the metal . . . .</p>
