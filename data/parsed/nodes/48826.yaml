      <p>I will go to my grave saying that, although ITC Garamond is not a design for purists, it is an incredibly useful, space-saving, generous, incredibly readable typeface. It is especially useful in its wonderful multiple master version from Adobe. A fabulous font to print with when you need a large x-height take on Garamond. </p>
      <p>I love Monotype Garamond, which as we know is not Garamond, but Jannon. The digital version is too light, but you can easily create a darker version by interpolating the regular with the bold or semi-bold in Fontographer or Fontlab. As with all Garamonds, it should be used with its full complement of f-ligatures.</p>
      <p>I've never been convinced by Adobe Garamond -- though it was great at 300 dpi in its day. Look instead at Adobe Garamond Premiere Pro by the same designer, a much more mature design, representing a decade of painstaking work, and with the additional bonus of optical sizes. It was designed to be used as two multiple masters - - one multiple for text, one for display. There was too much design difference to do it as a single multiple master. When will we say it as it was intended to be seen?</p>
