      <p>&gt;Garamond Premier’s development did start as an MM font with an intermediate master (IIRC), but in the end was developed as four separate MMs — one for each of its optical sizes&lt;</p>
      <p>Wow! In the late '90s, it was still only two separate MMs. Four MMs for each of four optical spaces must be a record. However, it is the only way to do it if you want to have perfectly optimized type and the utmost flexibility within each space. The technical icing on the cake would be intermediates within the four separate variable optical spaces?</p>
      <p>So, I assume the ideal human interface would be:</p>
      <p>1. You have the four separate MMs.</p>
      <p>2. The layout program automatically selects which MM is correct and then further adjusts for the exact point size of the text.</p>
      <p>3. You then have convenient sliders in your formatting bar to allow you to select the precise weight you want, or to override the automatic optical selection. There could be a checkbox for 'override automatic selection'. </p>
      <p>The important thing is to conceal the perversely counterintuitive numbering system from 100 to 1000. A slider control does that handily. I don't know why the 100 to 1000 arrangement proved so difficult to deal with, but it did. No matter how familiar you were with it, it never felt comfortable. Strange.</p>
      <p>David, I feel your pain, but all issues of authenticity aside, I think a lot of lovely books have been printed in Monotype Garamond, especially in the jewel-like smaller sizes. Would you like it better if it wasn't called Garamond but Jannon? Monotype has spent nearly 80 years apologizing for the confusion, so I don't see that they should be blamed for it anymore. Also, I can see your objection to ITC as an annoying 70s-ish display face, but I can't say what the problem is as a small text face. The large x-height is also typical of small sizes of most Monotype (and Linotype) metal faces. The major problem with ITC Garamond for me is that it is usually set too light. But if you are lucky enough to have the Adobe MM, you can set any weight you like, even using small weight gradations to get some nice optical effects (i.e. if you 11 point text and 9 point indented quotes, you would simply dial a hair more weight (and width?) for the 9 point text to correct colour. I guess part of ITC Garamond's appeal to me is just that the MM version does, in fact exist - - it's an available tool, so why not use it? Well, and because it's a fun toy. And because it has the distinction of being the first MM offered with an intermediate axis. But I realize I'm beginning to sound too much like a hobbyist. Still, I do think that technical things should be, whenever possible, fun.</p>
    html_clean: |-
