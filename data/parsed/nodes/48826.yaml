      <p>It is indeed a really complicated thread. </p>
      <p>I can only speak to myself, for this kind of answer asks a great deal of subjectivity, but in my humble opinion ITC Garamond is a denatured Garamond, a skilled but very personnal, time / era anchored redesign of the original type, best suited for the advertising age of the seventies and bound to the crazy-large x-height trend which was very fashionable at the time. I can't help but cringe each and every time I see it somewhere. Adobe Garamond, while not the best out there, is far superior, when compared to the original 16th century model. </p>
      <p>This being said, you might also check these ones for they are much closer to the original Garamond: Sabon (by Tschichold, not Porchez' Sabon next, which is really loosely based on Garamond), Stempel Garamond (more harsh and "vintage" looking) - and if you are tempted by the feeling of ye olde printing press, you might also take a look at Tribute (though it's more like a well done joke, but still might be useful). I still have to make my mind about Adobe Garamond Premier. I won't even begin to talk about Monotype Garamond for it is an absolute shame.</p>
      <p>dr</p>
