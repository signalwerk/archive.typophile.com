      <p>&gt; ITC Garamond can only be discussed within its historical context.</p>
      <p>Absolutely. But you could say that of any font. What about a font that does not seem yet to have had a period, such as Steile Futura/Topic? </p>
      <p>&gt;Monotype Garamond, even though it’s a Jannon, is more of a Garamond than that goddam obese cyclops.</p>
      <p>Hrant, I don't worry about whether ITC is a Garamond or not. No modern Garamond is a Garamond. I just think ITC G is a useful font. Like metal Plantin -- also not a Garamond -- but my how many wonderful books were printed with it. Now there's a great design still looking for a decent digital revival. </p>
      <p>Also, Hrant, look at some more metal in really small sizes. Obesity aids legibility at small sizes. And that ain't theory!</p>
      <p>Regarding historical context, that can be technical. For example, Adobe Garamond first release was designed very much with the 300 dpi printer in mind -- as was Hoefler Text. I have dug up some old correspondence with Carol Twombly from 1998 in which it is apparent that Garamond PP in its then-state had only two multiple masters -- with 24 pt being the breakover as I recall.</p>
      <p>When you start talking about four multiple masters for a single font family, I really think what Sumner Stone has figured out for Cycles makes more sense. And you can understand the numbers. That helps!</p>
