    html: <p>Look at the ITC revivals of Bookman, Caslon, Cheltenham (all by Benguiat). It’s all about style. The 50ies were post-war. The 60ies were trying out. The 70ies were starting all new from zero. The most stylish decade of all in that century. The 70ies were idealistic. Utopia (not the font!). They had guts and they failed. ITC Garamond can only be discussed within its historical context.</p>
