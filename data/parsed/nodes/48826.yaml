      <p>The historical context of any work of art is important, but someone once said "It's not great art unless it's timeless."</p>
      <p>Given that, ITC Garamond, like the clothes I wore when I used that face back in the day, will forever be linked to a very short period in which it looked appropriate.</p>
      <p>For a much more attractive version look at Apple's ITC commissioned redesign of their own private version of the face. So many computer companies were using ITC Garamond that Apple wanted their usage to be unique.  (Volkswagen did the same with Futura)</p>
      <p>I used to use Simoncini Garamond quite a bit.  It's a slightly lighter redraw of Italian Garamond from what I can tell. A quick search found this thread here: <a href="http://typophile.com/node/20299" title="http://typophile.com/node/20299">http://typophile.com/node/20299</a></p>
