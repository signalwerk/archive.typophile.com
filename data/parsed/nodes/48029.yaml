    html: <p>A "feature". You need to transfer font.features (a list, transfer items one by one), font.ot_classes (text) and possibly font.classes (list) separately. Karsten</p>
    html_clean: <p>A "feature". You need to transfer font.features (a list, transfer items one by one), font.ot_classes (text) and possibly font.classes (list) separately. Karsten</p>
  - id: 293101
