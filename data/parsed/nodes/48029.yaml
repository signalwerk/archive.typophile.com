    votes: null
    html: |-
      <p>Thanks for the workaround Karsten.</p>
      <p><code>font.classes</code> from the MM font are preserved when using the Add instance method and I can't see a reason why the OT features shouldn't be passed to single master like they do when you are using the Generate Instance menu command. Re-attach them (transfer from MM to the new instance) like you describe works fine though.</p>
