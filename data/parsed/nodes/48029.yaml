  html: |-
    <p>When opening/generating an instance in FL5.0.4 with Python like this:</p>
    <p><code>fl.Add(Font(Font('/foo/bar/font.vfb'), (400, 400)))</code></p>
    <p>all the OT features from the MM VFB are lost. That is not the case if you apply the Generate Instance on an open MM using the menu command. </p>
    <p>Is this a feature or a bug?</p>
