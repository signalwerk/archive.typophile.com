    html: |-
      <p>Those are all custom designs, made specially to suit the newspaper and the particular letters. The <a href="http://typedesign.com/logos/chicago.html" rel="nofollow">Tribune nameplate</a> is by Jim Parkinson, as are many other <a href="http://typedesign.com/contents.html" rel="nofollow">blackletter nameplates</a>. </p>
      <p>For a classic textura (the variety of blackletter most of these nameplates are), my favorite is <a href="http://www.p22.com/lanston/goudytext.html" rel="nofollow">Goudy Text</a>.</p>
