    html: <p>Oops. Meant to post this to Typo-L, but it went to Hugo's mail... <br> <br>Wow, never seen this before. Looks like they took a slightly <br>condensed Helvetica and subjected it to some primitive <br>form of ink/light trapping with the same trap shape used <br>on any problem area, no matter the angle. Odd. Looks like <br>they ran out of steam and forgot to finish the ampersand.</p>
