    html: <p>Yes, I'd seen that before (although I recently misindentified it as NBC36 on Typographi.ca), probably in an issue of Visible Language, but I'm not sure. I have a photocopy of the article somewhere in my "type closet"... Those little dots are basically very crude traps. But apparently they worked well at a certain size, on 70s TV (blurrier than today's TV). Anyway, it's nice to have an on-line reference. <br> <br>hhp <br></p>
