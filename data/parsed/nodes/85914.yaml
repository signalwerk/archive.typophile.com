  html: |-
    <p>I'm trying to find a font (sans or serif, condensed or not) to go with the Mensch typeface<br><a href="http://www.losttype.com/font/?name=mensch">http://www.losttype.com/font/?name=mensch</a></p>
    <p>I use Mensch Thin for a logo.</p>
    <p>1. I'm trying to find a font for a smaller size slogan that goes under the logo<br>
    2. I'm looking for fonts that are on Typekit or Cufon elligible for a website design<br>
    3. It would be nice to find a serif that goes well with Mensch</p>
    <p>If anyone got ideas or examples of works using Mensch with other typefaces please share them :) </p>
    <p>By the way, it's my first post on Typophile so I hope I didn't made any mistake aha</p>
