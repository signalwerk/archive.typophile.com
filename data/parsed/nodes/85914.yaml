    html: <p>I think most serifs, that aren’t too humanist/bookish/friendly in style, work well with Mensch. For screen, try a slab-serif maybe. Kulturista or RePublic would be good matches, or Adelle or Museo Slab or, for smaller sizes too, Teimer (all on typekit).</p>
