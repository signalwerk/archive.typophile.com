    html: |-
      <p>Rebecca Gimenez just wrote me back. Her kind response included some helpful info:</p>
      <p>"The typeface is called Gross and was designed by Mike Gallagher of We Have Photoshop (same person who designed Joseph, the typeface we used in all our ads)." </p>
      <p>Here's a link:<br>
      <a href="http://mikegallagher.org/" title="http://mikegallagher.org/">http://mikegallagher.org/</a></p>
      <p>She said the font is not commercially available, but anyone interested in licensing it should send an inquiry to Mike Gallagher through his site.</p>
      <p>So Reid, you were right.  ;)</p>
