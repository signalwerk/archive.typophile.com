      <p>Marc<br>
      Two books I can't live without - The Elements of Typographic Style by Robert Bringhurst (you mention this one) and Letters of Credit by Walter Tracy. Stop Stealing Sheep is very good, Type &amp; Typography is excellent. The Lupton books are always good. For history and examples the always popular can't live without it type of book, no pun intended, is Jaspert, Berry &amp; Johnson, Encyclopaedia of Type Faces, Blandford, 1993, I hope still in print. I also like About Face - Reviving the rules of typography by David Jury, RotoVision, 2002. Finally, not really, a great one, Language, Culture, Type edited by John Berry, published by ATYpI/Graphis, 2002, and Dutch Type by Jan Middendorp, 010 publishers, Rotterdam, 2004, pricey, but worth it. If I had to pick one from these, stranded on a desert island, it would be the Berry book. As long as I had a writing implement and a piece of parchment with me, and a tropical fruit or two.<br>
      Have fun<br>
      Jordan</p>
