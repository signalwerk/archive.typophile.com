    html: <p><em>The Elements of Typographic Style</em> by Robert Bringhurst really is one of the VERY BEST books you'll ever find on typography and design. It discusses basics, history, page layout, proper terminology, "the rules" of good typography and even has a meaty specimen section in the back. It should be required reading for all designers.</p>
