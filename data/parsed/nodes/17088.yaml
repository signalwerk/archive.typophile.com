    <p>Hi!</p>
    <p>I'm new to the forum, but look forward to participating in it.  I really like the design and way it functions - very different to other boards! :)</p>
    <p>I'd like to ask about books for novices.  I see it's been covered before, but some of the books I mention below (all found on Amazon.com) are relatively new.  Does anyone have any advice as to which of these books (or any others) one should or shouldn't go for?  I'm open to getting more than one (though obviously not too many :)).</p>
    <p>I'm interested in type as it is used today - in advertising, book/magazine/document layout, digitally (on-screen documents, websites, etc.), as an art-form on it's own.  I'm also interested in the history of type, but I'm really looking for a book that offers practical advice on layout and type use.  I'm very interested in design in general, so I'm also open to books that cover type as a part/chapter.</p>
    <p>I've enjoyed reading "The Rules of Typography" and other articles on The Font Site (www. fontsite.com), so a book would similar advice would be nice (if that's recommended).</p>
    <p>The books I've found are:</p>
    <p>Typography<br>
    by Friedrich Friedl</p>
    <p>Typography Workbook: A Real-World Guide to Using Type in Graphic Design<br>
    by Timothy Samara</p>
    <p>Typography: Macro- and Microaesthetics<br>
    by Willi Kunz</p>
    <p>Type &amp; Typography<br>
    by Phil Baines and Andrew Haslam</p>
    <p>Thinking with Type : A Critical Guide for Designers, Writers, Editors, and Students (Design Briefs)<br>
    by Ellen Lupton</p>
    <p>The Elements of Typographic Style<br>
    by Robert Bringhurst</p>
    <p>The Complete Manual of Typography<br>
    by James Felici</p>
    <p>Stop Stealing Sheep &amp; Find Out How Type Works, Second Edition<br>
    by Erik Spiekermann and E.M Ginger</p>
    <p>Making and Breaking the Grid: A Graphic Design Layout Workshop<br>
    by Timothy Samara</p>
    <p>A final note: all the books look interesting, but (a) it's difficult to judge them when you can't flip through them and see what they contain, and (b) I have no idea about the credibility of the authors.</p>
    <p>Any advice would be most appreciated.  I apologise for the long post - particularly seeing as it's my first! :)</p>
