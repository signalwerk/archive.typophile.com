    <p>Can anyone help me to identify this font? It was used on a press in Guatemala in 1774. I have very little knowledge of Spanish faces and would like to know more. I  assume this is a  Spanish design as opposed to English.<br>
    It can be seen at this link<br>
    <a href="http://www.camioux.com/guatemala.jpg" title="http://www.camioux.com/guatemala.jpg">http://www.camioux.com/guatemala.jpg</a></p>
    <p>Muchas gracias!</p>
