    html: |-
      <p>Script fonts can be very expressive. Normally you wouldn't set a book in script, but if it's a series of poems, perhaps it might work if you pick an easy-to-read script and set it large enough. </p>
      <p>Or maybe just start each poem with a large initial cap in script, and the rest in a more conventional font.</p>
      <p>You can also use illustrations and decorative elements to set the mood.</p>
    html_clean: |-
