  html: |-
    <p>Hi,</p>
    <p>I am working on a poetry book titled My Master. I am looking for a sensual font that conveys ideas of submission and devotion.  I'm looking for a font that doesn't stand out too much, that works well with large bodies of text, somehow reminiscent of a Bible. I'm looking at some Caslons and New Caledonias (I like their weight), but would like to have other recommendations, comments. </p>
    <p>I'm pasting an excerpt from a William Blake poem I'm interested in. </p>
    <p>Thank you in advance</p>
