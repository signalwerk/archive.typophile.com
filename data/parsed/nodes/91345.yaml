      <p><cite>I'm looking for a font that doesn't stand out too much, that works well with large bodies of text, somehow reminiscent of a Bible.</cite></p>
      <p><a href="http://www.identifont.com/show?OU" rel="nofollow">ITC Weidemann</a>: Originally called Biblica, it was commissioned in the 15th century by the German Biblical Society for a new German translation of the bible.</p>
      <p>The Cambridge Bible uses <a href="http://www.myfonts.com/WhatTheFont/forum/case/288096/" rel="nofollow">Lexicon nr. 1</a>. </p>
      <p>I remember in my younger times, that many catholic leaflets in Austria in the 1960/1970 years were full of <a href="http://www.identifont.com/show?U8" rel="nofollow">Post Antiqua</a></p>
      <p>And there is always <a href="http://www.identifont.com/show?22F" rel="nofollow">Bible Script</a> …</p>
