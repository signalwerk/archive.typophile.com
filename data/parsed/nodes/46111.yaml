    I purchased ITC Avant Garde Gothic from Adobe a few years ago. I’d love to have the alternates to use with it. Does anyone know of a version of the alternates I can buy that is compatible/drawn to match? Is the Elsner+Flake Avant Garde Gothic Alternates compatible with the Adobe/ITC version, or would I need to buy the entire E+F Avant Garde family?<br>
    (I did do a search of past Typophile  posts about this, but they didn’t seem entirely clear to me)</p>
