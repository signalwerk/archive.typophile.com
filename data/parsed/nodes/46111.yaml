      <p>Unfortunately you’re going to get a slightly different height and weight from the two versions. You need to buy the whole family from one foundry or the other.</p>
      <p>For those who want ease of use, I recommend <a href="http://www.fontshop.com/fonts/downloads/itc/itc_avant_garde_gothic_pro_virtual/">ITC Avant Garde Gothic Pro</a> which has the alternates and ligatures built into a single OpenType font for each weight. For those who want the alts but value <a href="http://typographica.org/001029.php">true italics</a>, the only choice is the <a href="http://www.fontshop.com/search/?q=elsner+flake%20avant%20garde">E+F digitization</a>.</p>
