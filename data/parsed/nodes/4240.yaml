    date_raw: 12.Apr.2004 9.33am
    votes: null
    html: <p>I presume by sans serif Greek you mean a low contrast Greek with sans serif uppercase letters. Serifs are not normal or authentic on Greek lowercase letters. <br> <br>Jon's questions are important. With what other types do you want this Greek to combine?</p>
    html_clean: <p>I presume by sans serif Greek you mean a low contrast Greek with sans serif uppercase letters. Serifs are not normal or authentic on Greek lowercase letters. <br> <br>Jon's questions are important. With what other types do you want this Greek to combine?</p>
