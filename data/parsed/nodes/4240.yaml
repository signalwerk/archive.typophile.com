    html: "<p>This “structural” aspect is indeed the most important factor here. Since the vast majority of Greek fonts that have Latin counterparts are merely derivations from the Latin, they can only really be used in subordinate roles, for example for Greek snippets in a body of English. The other way around (like in Apollonia) is very rare, and of course in that case you couldn’t use the <i>Latin</i> for a lot of text. Rarer still (I personally don’t know of any) would be a Latin and a Greek font that are harmonious at the formal visual level, but still authentic and functional on their own — as a result great for setting two parallel blocks of text in each script. On the other hand, if you ﬁnd a “stand-alone” authentic Greek font it’s possible you can still ﬁnd a compatible Latin font (although you’ll have to be very lucky to closely match the apparent sizes, color, etc.) <br><br>Ideally it would be great to have two separate fonts, each with two parts: one that’s Greek with a subordinate Latin, and one that’s Latin with a subordinate Greek. In this way you can accomodate virtually any typographic structure with great harmony, but without sacriﬁcing authenticity or functionality. There is only one font family like this that I know of… &nbsp;:-) <br><br>hhp <br></p>"
