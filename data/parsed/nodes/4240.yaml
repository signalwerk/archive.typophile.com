    html: '<p>Simon, you’re right, the structure I describe is just for mixing Latin <span class="amp">&amp;</span> X in diﬀerent ways. The “superset” solution is actually like a network — so like if you added a third script, you’d need a new font to render that script authentically, that font would need <i>two</i> subordinate styles, and the two other fonts would need to each get a new subordinate style. Hey, nobody said satisfying diﬀerent cultures was easy… &nbsp;:-/ <br><br>Jonathan, that sample is Adobe Warnock. It’s nice, but still suﬀers from the classic geometric congruence (matching x-height, etc.) issue that goes against the actual needs of non-Latin typesetting. The good thing about <span class="caps">MM</span> fonts though is that you could for example make the Cyrillic slightly larger in point size but compensate on the color with the weight axis, and maybe tweak the width axis too. But these are things that an intelligent multi-script system should just do by default. Adobe’s non-Latin fonts (as well most anybody else’s) also suﬀer from “cognate disease”: having that “a” look exactly the same in Latin and Cyrillic might turn on some Swiss folk, but it’s bad for reading, and bad for cultural diversity. <br><br>Apollonia: it’s available through Cannibal, except their site seems to be down. <br><br>But anyway it sounds like you just need a subordinate Greek, and you should have no trouble at ﬁnding one for Frutiger! &nbsp;:-/ <br><br>hhp <br></p>'
    html_clean: '<p>Simon, you’re right, the structure I describe is just for mixing Latin <span class="amp">&amp;</span> X in diﬀerent ways. The “superset” solution is actually like a network — so like if you added a third script, you’d need a new font to render that script authentically, that font would need <i>two</i> subordinate styles, and the two other fonts would need to each get a new subordinate style. Hey, nobody said satisfying diﬀerent cultures was easy… &nbsp;:-/ <br><br>Jonathan, that sample is Adobe Warnock. It’s nice, but still suﬀers from the classic geometric congruence (matching x-height, etc.) issue that goes against the actual needs of non-Latin typesetting. The good thing about <span class="caps">MM</span> fonts though is that you could for example make the Cyrillic slightly larger in point size but compensate on the color with the weight axis, and maybe tweak the width axis too. But these are things that an intelligent multi-script system should just do by default. Adobe’s non-Latin fonts (as well most anybody else’s) also suﬀer from “cognate disease”: having that “a” look exactly the same in Latin and Cyrillic might turn on some Swiss folk, but it’s bad for reading, and bad for cultural diversity. <br><br>Apollonia: it’s available through Cannibal, except their site seems to be down. <br><br>But anyway it sounds like you just need a subordinate Greek, and you should have no trouble at ﬁnding one for Frutiger! &nbsp;:-/ <br><br>hhp <br></p>'
