    html: <p>Jonathan, <br> <br>Can you be more specific about "other type?" What is it you're working on? Do you require polytonic Greek, or is monotonic sufficient for your purposes? <br> <br>You might begin simply by looking at some samples. If you have a copy of Bringhurst close by, that's a good place to start. <br> <br>Thanks, <br> <br>Jon</p>
