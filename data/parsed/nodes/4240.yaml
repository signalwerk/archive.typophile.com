    html: '<p>If you need something to combine with Frutiger, I can thoroughly recommend Adobe’s Myriad Pro. The Greek designed for this is one of the best ‘sans serifs’ currently available, and Myriad belongs to the same sub-genre of humanistic sans as Frutiger. The design is very authentic, and doesn’t sacriﬁce the inherent liveliness and variety of the Greek script to the more rigid and modular Latin. <br><br>Another, <i>free</i> option would be the Frutiger Linotype fonts that ships with Microsoft’s eBook <a href="http://www.microsoft.com/reader/downloads/pc.asp">Reader</a>. This version of Frutiger includes a new Greek; however, the Greek was not designed by Adrian Frutiger himself, and I think it suﬀers from the rigidity of e.g. the original Helvetica Greek. It is a sadly missed opportunity, and looks about thirty years out of date. Myriad Pro Greek is vastly superior. <br><br>This is what the two faces look like: <br><img src="http://www.typophile.com/forums/messages/30/33321.gif" alt="Greek comparison"></p>'
