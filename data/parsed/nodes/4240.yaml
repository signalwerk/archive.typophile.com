    html: <p>Another question - is the text mostly Greek with a few non-Greek words, or the other way around?  <br> <br>What's the nature of the text? This may be important if you need to choose between a font containing westernized Greek forms vs more traditional forms.  <br> <br>Si <br> <br></p>
