    html: <p>I’ve just been working a lot on Greek lowercase in the last couple of weeks, so this is particularly convenient timing. <br><br>Some of the Frutiger <span class="caps">LT</span> Greek lowercase glyphs seem almost bizarrely geometric for such a humanist face. The gamma, delta, lambda and pi are among those that really leap out as being inappropriate. <br><br>It seems odd to me, because with the Greek lowercase having such strong calligraphic roots, I’d expect the lowercase to be even more humanist than the Latin lowercase, instead of less so. <br><br>The descender shapes on zeta and xi both seem what Robert Slimbach would call “wormy.” I should know, since he has pointed it out in my own work often enough (mostly on the eszett which I can never get right it seems). The ﬁnal sigma seems to do okay though, on the same shape. <br><br>Do you know who did the Greek for Frutiger <span class="caps">LT</span>, btw? <br><br>Cheers, <br><br>T</p>
