  html: |-
    <p>Hello. </p>
    <p>I need to identify the font used in the Chevron 'We Agree' print ads. <a href="http://www.chevron.com/weagree/" title="http://www.chevron.com/weagree/">http://www.chevron.com/weagree/</a> It looks like some kind of Gothic, but I've ruled out Franklin Gothic, Trade Gothic and News Gothic (the G's are wrong). </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/chevron_6401.png"></div><p></p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        Interstate Bold Condensed        </div>
            </div>
    </div>
    <div class="field field-type-userreference field-field-solvedby">
          <div class="field-label">Solved By:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        <a href="/user/175823" title="View user profile.">kthomps5</a>        </div>
            </div>
    </div>
