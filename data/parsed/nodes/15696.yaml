      <p>I also think that the logo in not effective. It forces the eye to jump back and forth from place to place. Logos should do just the opposite: Lead the viewer to focus and remain focused on your design until it becomes imprinted on the brain. Your design creates confusion, not order!  Simplify!!!!!<br>
      D~</p>
