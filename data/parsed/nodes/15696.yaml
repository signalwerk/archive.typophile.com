    html: <p>Are you trying to impress someone or are you really trying to communicate something. As it stands its design for design sake. It has no focus, no direction. As someone suggested it is a made-up word with no meaning and no other communications to explain it. Is it a place? Is it a time? I have no idea. Explain the concept and what its goal is and you will be on your way to a good graphic design.</p>
