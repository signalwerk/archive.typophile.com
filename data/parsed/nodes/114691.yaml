      <p>Can't find anything on it part of these <a class="freelinking external" href="http://www.myfonts.com/WhatTheFont/forum/?q=sports+illustrated" rel="nofollow">4 unsolved discussions at WTF Forum</a> and <a class="freelinking external" href="http://www.quora.com/Typeface-Identification/What-font-is-Sports-Illustrated-using-on-their-2014-Swimsuit-Issue" rel="nofollow">this post</a> at Quora (answered by font expert <a class="freelinking external" href="http://fontsinuse.com" rel="nofollow">Stephen Coles</a> as possibly custom lettering).<br>
      To me, considering this lettering is declined for each model, tt might be a font... or not ;D<br>
      Reminds me of the work of <a class="freelinking external" href="http://www.myfonts.com/person/Manuel_Eduardo_Corradine" rel="nofollow">Manuel Eduardo Corradine</a> and <a class="freelinking external" href="http://www.myfonts.com/person/Maximiliano_Sproviero" rel="nofollow">Maximiliano Sproviero</a> (probably because of the Inline/Plain mix like his <a class="freelinking external" href="http://www.myfonts.com/fonts/argentina-lian-types/brand" rel="nofollow">Brand</a>).<br>
      Some very loosely alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/insigne/olidia" rel="nofollow">Olidia</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/corradine/almibar" rel="nofollow">Almibar</a></p>
