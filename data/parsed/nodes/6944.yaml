    date_raw: null
    votes: null
    html: "<p>Hi romesh, <br> <br>this is a nicely sportive and powerful logo. <br> <br>Instead of going into typographic details (I find, for instance, the <b>G</b> in <i>Germany</i> too light and hence would make its arm longer; I'd also fine tune the letterspacing in <i>Germany</i>), I'll just tell you my first overall impression: the icon itself, being a letter, has a distinctive typographic quality of its own, competing with the equally strong Sagim/Germany typeface. <br> <br>I do clearly see that, striving for typographic integrity, you've designed the <b>S</b> icon as a variation of the Sagim typeface. But, for me, there's still too much \"typographic power\". <br> <br>Since it may be quite subjective, I'd be interested in knowing whether anyone shares this impression of mine. <br> <br>While realizing that another typeface would only add to what I think is a slight typographic overload, I'd possibly like to see <i>Germany</i> in another (more conservative/generic) typeface than <i>Sagim</i>. <br> <br>Regards <br>jpg</p>"
