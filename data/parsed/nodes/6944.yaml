  html: '<p>hello typophiles,  <br> <br>this is my first post at this topic. I have to redesign a logo for a sports-company. the color black/red and the subline "germany" were given. what do you, typophiles think about icon and typo?  <br> <br>ps: the original icon was also a twisted "metal"-band.  <br>the typography is a raw sketch for a first impression. <br> <br>thanks, romesh <br> <br><img src="http://www.typophile.com/forums/messages/29/50212.gif" alt=""></p>'
