    <p><a href="http://fontfeed.com/html/archives/new-fontfonts-ff-dagny-from-tabloid-to-desktop/" rel="nofollow"></a></p><div class="imageWrap"><a href="http://fontfeed.com/html/archives/new-fontfonts-ff-dagny-from-tabloid-to-desktop/" rel="nofollow"><img src="http://typophile.com/files/ff-dagny_sketch2_3713.png"></a></div><br>
    <em>Extensive annotations on a correction sheet during the development of DN Grotesk.</em><p></p>
    <p>In 2002, the Swedish newspaper <a href="http://www.dn.se/" rel="nofollow">Dagens Nyheter</a> changed from broadsheet to tabloid – a change that came along with a major impact on DN’s journalism, editing and design. <a href="http://www.pangeadesign.se/" rel="nofollow">Pangea design</a>’s Creative Director, <a href="http://fontshop.com/fonts/designer/orjan_nordling/" rel="nofollow">Örjan Nordling</a>, had already worked with DN as a design consultant in 1996. In 2000, DN had been redesigned under the leadership of <a href="http://garciamedia.com/blog/articles/all_about_ff_dagny_evolution_of_a_newspaper_type_font" rel="nofollow">Mario Garcia</a>. For the new design Nordling had created <a href="http://www.pangeadesign.se/index.php/en/commissions/client-commissions/23-dagens-nyheter" rel="nofollow">DN Bodoni</a> exclusively for Dagens Nyheter. The change to tabloid called for a more compact setting and Pangea design was commissioned to produce a matching sans serif for Sweden’s largest daily newspaper. This became <a href="http://www.pangeadesign.se/index.php/en/commissions/client-commissions/23-dagens-nyheter" rel="nofollow">DN Grotesk</a> which now has evolved into the <a href="http://www.fontfont.com" rel="nofollow">FontFont Library</a>’s newest sans serif family <a href="http://fontshop.com/fontlist/families/ff_dagny_ot" rel="nofollow"><strong>FF Dagny</strong></a>.</p>
    <p><a href="http://fontfeed.com/html/archives/new-fontfonts-ff-dagny-from-tabloid-to-desktop/" rel="nofollow"></a></p><div class="imageWrap"><a href="http://fontfeed.com/html/archives/new-fontfonts-ff-dagny-from-tabloid-to-desktop/" rel="nofollow"><img src="http://typophile.com/files/ff-dagny_500px_4800.png"></a></div><br>
    <em>Even the [free downloadable] Thin weight works well in short texts</em><p></p>
    <p>For the <a href="http://www.fontfont.com" rel="nofollow">FontFont Library</a> several adjustments were made by Örjan Nordling with assistance from his colleague <a href="http://www.fontshop.com/fonts/designer/goran_soderstrom/" rel="nofollow">Göran Söderström</a>, the contrast in stroke thickness was reduced for even better legibility in small sizes, and characters were redesigned together with the FontFont TypeDepartment. By changing the oblique lowercase “a” to a single storey design, <a href="http://fontshop.com/fontlist/families/ff_dagny_ot" rel="nofollow">FF Dagny</a> now has <a href="http://fontshop.com/fonts/singles/fontfont/ff_dagny_ot_regular_italic/" rel="nofollow">true italics</a>. The family now includes a range of consistent weights from <a href="http://fontshop.com/fonts/singles/fontfont/ff_dagny_ot_thin/" rel="nofollow">Thin</a> to <a href="http://fontshop.com/fonts/singles/fontfont/ff_dagny_ot_black/" rel="nofollow">Black</a>. Furthermore the typeface has been carefully hinted for better screen resolution, making it well suited for use in both analogue and digital applications. The name Dagny is an abbreviation of Dagens Nyheter as well as an old nordic female name meaning “new day”. </p>
    <p>For a limited time, you can try FF Dagny OT Thin for free. To download the font and to get more information on the creation of <a href="http://fontshop.com/fontlist/families/ff_dagny_ot" rel="nofollow"><strong>FF Dagny</strong></a>, which is part of the current <a href="http://www.fontshop.com/blog/?cat=45" rel="nofollow">FontFont Release 49</a>, check the <a href="http://fontfeed.com/html/archives/new-fontfonts-ff-dagny-from-tabloid-to-desktop/" rel="nofollow">The FontFeed</a>.</p>
