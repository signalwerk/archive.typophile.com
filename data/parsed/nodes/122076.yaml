      <div class="comment-spam-body"><p>I agree it's not awful, but definitely not great. But my point is that my expectations for the outcome for these practices are very low. I don't consider it to be a good practice to attach swashes to typefaces that weren't intended to have swashes. If this typeface was intended to have swashes, I think it would have been planned for the swashes better. </p>
      <p>But also, I think the swashes itself in this case are often just not well designed. I find the swash on /y to be horrible, and I would love to modify the swashes in /a and /e as well. I feel the swashes are very much an afterthought, rather than part of the design of the typeface.</p>
      </div>
