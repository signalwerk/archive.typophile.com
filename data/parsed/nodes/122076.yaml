      <p>In the case of Meola Bookman, my opinion is that it took an unattractive text face, and actually gave it a useful reason for existing as a fancy display face.</p>
      <p>Giving Times Roman the same treatment wouldn't "destroy" the typeface, because people would still be free to ignore the modifications, and use the original. If one wants a decorative face with lots of swashes, and there are places where such a thing could be used tastefully, why not start from a good typeface as a basis?</p>
