    html: |-
      <p>The fact remains, whatever its merits or flaws, Endowed Jones never gained traction with graphic designers. I don't think I ever saw in actual use. It was an attempt to exploit the popularity of Bookman Swash. In that it was not unique.* But it flopped in the marketplace, never made it to digital, and only old type geeks like me have even heard of it.</p>
      <p>*You might find this old Typophile discussion of interest: <a href="http://www.typophile.com/node/2833" title="http://www.typophile.com/node/2833">http://www.typophile.com/node/2833</a> Unfortunately, most of the image links are broken. Or fortunately, depending on your point of view.</p>
      <p>Also: I think the swashes in Endowed Jones look like stretched-out chewing gum. Ugh.</p>
