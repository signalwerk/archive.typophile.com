    html: |-
      <div class="comment-spam-body"><blockquote><p>If one wants a decorative face with lots of swashes, and there are places where such a thing could be used tastefully, why not start from a good typeface as a basis?</p></blockquote>
      <p>My feeling is that it's more about the name and reputation of the typeface than it is about the design.<br>
      "This typeface is very popular, but not very decorative. Why not add swashes?"</p>
      <p>Making a new typeface or adding swashes to a lesser known typeface requires more work in marketing. I don't think anyone is adding swashes to any typeface to improve the design, but rather to ride on the success of its name. Why else would Helvetica Flair exist? Certainly not because it's exactly what we were looking for or because it has so much potential.</p>
      </div>
