    <p>The <a href="http://typophile.com/wiki/start" rel="nofollow">Typowiki</a> has been live for 2 weeks and already there are hundreds of entries. Mostly I'm impressed, not just by the quantity, but with the quality and the direction it's moving. Looks like the future is going to be open source.</p>
    <p>Some exemplary posts so far:</p>
    <p><a href="/wiki/Garamond" class="freelinking" rel="nofollow">Garamond</a><br>
    <a href="/wiki/Bembo" class="freelinking" rel="nofollow">Bembo</a><br>
