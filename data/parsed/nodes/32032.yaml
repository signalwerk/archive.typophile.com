    <p>Hola a toda la comunidad hispana, pues sucede que a mi esposa se le ocurrio estudiar diseño gráfico y hora aca me tienen ayudandole un poco con las busquedas de información, y una de las tareas que me encomendó fue si podia encontrar citas ó alguna frase célebre de Robert Besley, Francisco Griffo y Claude Garammond, por mas que busco y busco no he logrado encontrar nada, podria alguien darme algun link ó guiarme al lugar correcto para encontrar este tipo de información, ó tal vez alguien tenga algo al respecto. </p>
    <p>Mil gracias de antemano</p>
    <p>badbye<br>
    Portland Oregon</p>
