    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: Mrs&nbsp;Eaves</strong></p>
    <p>Mrs Eaves was designed by <a href="/node/12166" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Zuzana Licko</a>. The font is named for <a href="/node/14119" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">John Baskerville</a>’s lover, is a mildly stylized <a href="/node/12622" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Baskerville</a> <a href="/node/12425" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">revival</a> known for its profusion of colorful <a href="/node/12055" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Ligature</a>s and “petite caps”, a unique variation on the theme of <a href="/node/12027" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">small caps</a>. Mrs Eaves is a technical tour de force, formerly being accompanied by a program from <a href="/node/14101" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">LettError</a> intended to help designers manage its unwieldy set of ligatures, and was recently converted  by <a href="/node/12417" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">John Butler</a> into an overwhelmingly full-featured <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a> family. Mrs Eaves is beloved by graphic designers but some typographers and type designers question its fitness for use in body text, primarily because of concerns about how the design is spaced.<br>
    To gain a better understanding of the solutions and problems that are associated with Mrs Eaves, one should read <a href="http://emigre.com/EFfeature.php?di=109">Licko’s rationale</a> for designing the font. There are also several threads on Typophile that discuss the <a href="http://typophile.com/node/687">virtues and shortcomings</a> of Mrs Eaves, <a href="http://typophile.com/node/14884">what to pair</a> with this typeface, and <a href="http://typophile.com/node/13084">suitable alternatives</a>.</p>
    <p>Mrs Eaves is available through <a href="/node/12208" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Emigre</a> at <a href="http://www.emigre.com">http://www.emigre.com</a>.</p>
