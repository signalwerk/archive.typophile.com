    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Mrs Eaves</strong></p>
    <p>Mrs Eaves was designed by <a href="/wiki/Zuzana%20Licko" class="freelinking" rel="nofollow">Zuzana Licko</a>. The font is named for <a href="/wiki/John%20Baskerville" class="freelinking" rel="nofollow">John Baskerville</a>'s lover, is a mildly stylized <a href="/wiki/Baskerville" class="freelinking" rel="nofollow">Baskerville</a> <a href="/wiki/revival" class="freelinking" rel="nofollow">revival</a> known for its profusion of colorful <a href="/wiki/ligature" class="freelinking" rel="nofollow">ligature</a>s and "petite caps", a unique variation on the theme of <a href="/wiki/small%20capitals" class="freelinking" rel="nofollow">small caps</a>. Mrs Eaves is a technical tour de force, formerly being accompanied by a program from <a href="/wiki/LettError" class="freelinking" rel="nofollow">LettError</a> intended to help designers manage its unwieldy set of ligatures, and was recently converted  by <a href="/wiki/John%20Butler" class="freelinking" rel="nofollow">John Butler</a> into an overwhelmingly full-featured <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> family. Mrs Eaves is beloved by graphic designers but some typographers and type designers question its fitness for use in body text, primarily because of concerns about how the design is spaced.<br>
    To gain a better understanding of the solutions and problems that are associated with Mrs Eaves, one should read <a href="http://emigre.com/EFfeature.php?di=109" rel="nofollow">Licko's rationale</a> for designing the font. There are also several threads on Typophile that discuss the <a href="http://typophile.com/node/687" rel="nofollow">virtues and shortcomings</a> of Mrs Eaves, <a href="http://typophile.com/node/14884" rel="nofollow">what to pair</a> with this typeface, and <a href="http://typophile.com/node/13084" rel="nofollow">suitable alternatives</a>.</p>
    <p>Mrs Eaves is available through <a href="/wiki/Emigre" class="freelinking" rel="nofollow">Emigre</a> at <a href="http://www.emigre.com" title="http://www.emigre.com">http://www.emigre.com</a>.</p>
