      <p>DC comics has a book <a href="http://www.amazon.com/gp/product/0823010309/ref=as_li_ss_tl?ie=UTF8&amp;tag=onst-20&amp;linkCode=as2&amp;camp=1789&amp;creative=390957&amp;creativeASIN=0823010309" rel="nofollow">Dc Comics Guide to Coloring and Lettering Comics</a>. At least some of the text is by Todd Klein, who is one of the best and most respected comic lettering artists ever. His work on <em>The Sandman</em> and much of the run of <em>Lucifer</em> is one of the pinnacle of comic lettering. </p>
      <p>Rian Hughes is a type designer, lettering artist, comic letterer, comic artist, and writer. Research Rian.</p>
      <p>Another pinnacle of comic lettering is just about anything by P. Craig Russell. When he gets hired to do a comic it's usually something special.</p>
