      <p>Ville,</p>
      <p>Yearly, the Will Eisner Awards (sort of the Oscars for the comics industry) offer an award for best lettering.  </p>
      <p>Here are the nominees for 2011:</p>
      <p>Best Lettering</p>
      <p>- Darwyn Cooke, Richard Stark's Parker: The Outfit (IDW)<br>
      - Dan Clowes, Wilson (Drawn &amp; Quarterly)<br>
      - Jimmy Gownley, Amelia Rules!: True Things (Adults Don't Want Kids to Know), Amelia Rules!: The Tweenage Guide to Not Being Unpopular, by Jimmy Gownley (Atheneum/Simon &amp; Schuster)<br>
      - Todd Klein, Fables, The Unwritten, Joe the Barbarian, iZombie (Vertigo/DC); Tom Strong and the Robots of Doom (WildStorm/DC); SHIELD (Marvel); Driver for the Dead (Radical)<br>
      - Doug TenNapel, Ghostopolis (Scholastic Graphix)<br>
      - Chris Ware, Acme Novelty Library 20: Lint (Drawn &amp; Quarterly)</p>
      <p>I suspect digging around to find the past 20 years of nominees and winners would be a good place to start.  Many of the artists you could approach directly through personal web sites and blogs.</p>
      <p>best of luck and let us know your results.</p>
