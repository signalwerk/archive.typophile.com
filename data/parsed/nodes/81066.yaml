      <p>The one thing I know is that, since word bubbles are often lettered in all caps, the capital I with serifs is to be used only for the personal pronoun. I know I read that rule somewhere. I'll try to get back to you with a source.</p>
      <p>I think an I with serifs might be OK in Roman numerals too, but you'd have to ask your editor about that.</p>
