    <p>I'm going to do my Graphic Design master thesis on comic book typography. The small amount of googling and digging around I've done so far (I just started) in libraries and online databases hasn't resulted in a lot of information. Most how-to books have a chapter on hand lettering but I haven' t been able to find books exclusively dedicated to the subject. </p>
    <p>Any hints on literature, comic book artists who do their own digital typefaces or are especially creative with use of type (Chris Ware and Will Eisner come to mind - who else?) would be greatly appreciated. Name your favorites!</p>
