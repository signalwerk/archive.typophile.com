      <p>Two of my favourites for lettering:</p>
      <p>Charles Schulz</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/schulz_5138.jpg"></div><p></p>
      <p>George Herriman</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Krazy_6397.jpg"></div><p></p>
      <p>I realise these might not count if you are making a strict difference between comic books and newspaper comic strips.<br>
      In the British comics I read in the '70s, which were mainly collections of single page stories, the artists nearly always did their own lettering. Leo Baxendale, Reg Parlett and Ken Reid were particularly good for titles of monster and horror strips. There are lots of examples of these in Rian Hughes' <a class="freelinking external" href="http://www.fiell.com/page/our-books/typography/60s-lettering" rel="nofollow">Custom Lettering of the '60s &amp; '70s</a>.</p>
