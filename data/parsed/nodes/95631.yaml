    html: |-
      <p>Are you looking for technical advice or general suggestions?</p>
      <p>In short: I think the interest would be in what you make of it, to get it done you need a vision and somebody who can design &amp; develop the vision you have. You also need to do some research &amp; see what is already out there and judge where the bar is at and how you can blow it out of the water, make it legendary...</p>
      <p>The idea sounds cool, but you have to own the vision.</p>
      <p>The devils in the details and part of creating something new is deciding what you want others to experience. The tools you use are nearly irrelevant to the purpose, reason and usability of the site. Anything on the web is possible with a lot of different systems. Free &amp; opensource tools are often the best way to go.</p>
