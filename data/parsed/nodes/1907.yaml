    html: <p>hmm... <br> <br>   I don't know what to say. I think maybe you want to  <br>scrap it, and start anew. Do you want to capture the  <br>meaning of the word at all in the letterforms you  <br>design? The geometric shapes work for a construction  <br>company, but not for communications,and not divine. <br> <br>   The forms are looking very randomly generated to me.  <br>The "E" is very squared off. It bothers me the most.  <br>I can almost make it say diving. The "V" and second "I" are  <br>most proportionate, so if you continue, I would work off of  <br>those 2 letters. just duplicate the second "I" for the first.  <br>The "D,N,E" must be condensed. Overall,  <br>#5 shows the most promise. <br> <br>   There is really not enough playing going on. Maybe  <br>draw, scan and trace for a bit before digitizing? <br> <br>Why did you choose the word Divine?  I am also curious.  <br>I'd like to see the final version of any progression  <br>you decide to make. <br> <br>Good Luck, <br> <br>Andrew <br> <br> <br></p>
    html_clean: <p>hmm... <br> <br>   I don't know what to say. I think maybe you want to  <br>scrap it, and start anew. Do you want to capture the  <br>meaning of the word at all in the letterforms you  <br>design? The geometric shapes work for a construction  <br>company, but not for communications,and not divine. <br> <br>   The forms are looking very randomly generated to me.  <br>The "E" is very squared off. It bothers me the most.  <br>I can almost make it say diving. The "V" and second "I" are  <br>most proportionate, so if you continue, I would work off of  <br>those 2 letters. just duplicate the second "I" for the first.  <br>The "D,N,E" must be condensed. Overall,  <br>#5 shows the most promise. <br> <br>   There is really not enough playing going on. Maybe  <br>draw, scan and trace for a bit before digitizing? <br> <br>Why did you choose the word Divine?  I am also curious.  <br>I'd like to see the final version of any progression  <br>you decide to make. <br> <br>Good Luck, <br> <br>Andrew <br> <br> <br></p>
