    html: "<p>Yves: <br> <br>As I mentioned in my first posting and as Andrew confirmed, these letterforms are not yet closely related. It looks like at least three different typefaces have been thrown into the mix. In addition it doesn't look like there has been an attempt to equalize their weight. <br> <br>I agree with Kemie, therefore, I disagree with Andrew regarding the appropriateness of the look. I think the forms, although somewhat unrelated to each other, do a pretty good job capturing the concept of divinity. I think you just need to focus in on one of the forms and make sure the rest work with it. <br> <br>Like Darrel, I mentioned previously that the \"i's\" dots are too light. The squared dots that Adriano illustrated work better, but considering the word you might try finding a dingbat to use as the dots</p>"
    html_clean: "<p>Yves: <br> <br>As I mentioned in my first posting and as Andrew confirmed, these letterforms are not yet closely related. It looks like at least three different typefaces have been thrown into the mix. In addition it doesn't look like there has been an attempt to equalize their weight. <br> <br>I agree with Kemie, therefore, I disagree with Andrew regarding the appropriateness of the look. I think the forms, although somewhat unrelated to each other, do a pretty good job capturing the concept of divinity. I think you just need to focus in on one of the forms and make sure the rest work with it. <br> <br>Like Darrel, I mentioned previously that the \"i's\" dots are too light. The squared dots that Adriano illustrated work better, but considering the word you might try finding a dingbat to use as the dots</p>"
