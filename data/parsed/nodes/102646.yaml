    <p>Here's a font that the Typographia Polyglotta Vaticana used between ~1905 and ~1930.<br>
    I've already asked the people in Rome about this font, but they have no idea what it is.<br>
    Does anyone here recognize it?</p>
    <p>Thanks for Your help<br>
    Joerg Hudelmaier</p>
