    html: <p>The two closest things I have been able to find are Elzevir and French Old Style, both from Monotype, both right for the age of the sample. Q is not right in FOS (but it is in Elzevir), and J is not right in Elzevir. This could be an Italian cut related to these two typefaces?</p>
