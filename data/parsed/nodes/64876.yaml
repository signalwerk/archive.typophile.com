    <p>I need to ID the typeface used in the Saturday Night Live Digital Short splash screen, as seen here:</p>
    <p><a href="http://upload.wikimedia.org/wikipedia/en/2/2d/SNL_Digital_Shorts-title.png" rel="nofollow">http://upload.wikimedia.org/wikipedia/en/2/2d/SNL_Digital_Shorts-title.png</a></p>
    <p>I have searched the forums and scoured the net, and the only near miss that I have found was one Typophile's suggestion of Engraver's 2 or Sackers. I don't think that is correct, however (look at the 'G'!) I could definitely use some pro's help here!</p>
    <p>Many thanks,<br>
    tcvanp3570</p>
