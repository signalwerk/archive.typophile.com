      <p>A couple of days ago, when service to this site was so rudely interrupted (for me at least), I was hunting for this font, searching Parts 11, 12 and 14 of the Script Font ID Guide, AND the printing font samples in the new FontBook, and came to the conclusion that this is possibly a ’personal’ font, made from a printing sample. As our FAQ says, these kinds of fonts are very cheap and easy to make.</p>
      <p>Similar fonts I found during my search <a href="http://www.myfonts.com/fonts/fontfont/ff-erikrighthand/">FF ErikRighthand</a>; a free font called <a href="http://www.dafont.com/font.php?file=kaela">Kaela</a> by Harold Lohner; and another called <a href="http://www.myfonts.com/fonts/fontfont/ff-erikrighthand/">Plz Print Bold Condensed</a>, by Rae Kaiser</p>
      <p>- Mike Yanega</p>
