      <p>I happened to stumble on <a href="http://www.myfonts.com/fonts/typonauten/freakshow/">’Freakshow’</a> and thought it was a good match, although I can see now that it’s not identical. It has essentially four versions of each cap letter, which allows a better simulation of hand lettering. Frankly, If I saw this I would think it was the posted font, unless I could compare each and every letter side by side. Only the stem-less U is an obvious ID style mismatch. To me the rest looks like it could be lettering by the same person who made the posted font.</p>
      <p>- Mike Yanega</p>
