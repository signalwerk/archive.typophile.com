  html: |-
    <p>Lacrima is a typewriter like font family consisting of:</p>
    <p>Lacrima Italic a very lovely swosh like serif typeface with little rounded (ink-) drops at the end of some of the lowercase letters and numbers.</p>
    <p>Lacrima Serif features the uppercase serifs as well as the corresponding drops to some of the italic lowercase letters. </p>
    <p>Lacrima Senza has no drops on any of the lowercase letters and no serifs in all uppercase letters what makes this font very handy for editorial or corporate design.</p>
    <p>‹ZZ_Lacrima› is available in Extended Latin encoding, as Open Type format, offering support for Central European, Baltic and Turkish languages. Including many alternative characters and symbols.</p>
    <p>For further information please visit <a href="http://www.type.xyz.ch/lacrima.html" title="http://www.type.xyz.ch/lacrima.html">http://www.type.xyz.ch/lacrima.html</a><br>
    kind regards,</p>
    <p>Alex</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Lacrima_mini_4925.gif"></div><p></p>
