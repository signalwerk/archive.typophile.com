    <p>Dear Typophiles,</p>
    <p>If you're interested in having your typographic organization, website, foundry, museum, magazine, or academic resource listed in the back matter of the next edition of <a class="freelinking external" href="http://typedeskref.com" rel="nofollow">The Typographic Desk Reference</a>, please feel free to edit the spreadsheets listed below.</p>
    <p>I'll be here on and off if anyone has any questions.</p>
    <p>* The documents will be accessible until April 1st.</p>
    <p>Thank you in advance for your contributions (and corrections!),</p>
    <p>Theo</p>
    <p>Associations, Conferences (Organizations, Clubs, etc.): <a href="/wiki/https%3A/%252Fdocs.google.com/spreadsheet/ccc%3Fkey%3D0Ag335wWzY_4kdElxelNSdjBFZWxFd243aUQ3bWlQbFE" class="freelinking" rel="nofollow">https://docs.google.com/spreadsheet/ccc?key=0Ag335wWzY_4kdElxelNSdjBFZWxFd243aUQ3bWlQbFE</a></p>
