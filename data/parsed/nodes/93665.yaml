  - id: 513267
    user_id: 909
    user_name: Thomas Phinney
    user_path: null
    date_raw: 18 Jun 2012 — 4:42pm
    date: 2012-06-18T16:42:00
    votes: null
    html: |-
      <p>Glyphs are restricted to a double-byte space. Storage of glyphs in a font is by glyph ID, which is independent of encoding. Unicode or other encodings are handled by the cmap table, which maps from Unicode (or other encodings) to glyph ID.</p>
      <p>Unicode has just under a million possible codepoints. Of those about 110,000 are assigned as of Unicode 6.1. A large chunk are reserved for private use, so will never be assigned.</p>
