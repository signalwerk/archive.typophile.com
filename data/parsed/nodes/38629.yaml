    <p>Hello, this will be my very first post at typophile.com. I’ve just recently come across this type community and wish I had found it sooner. </p>
    <p>I’m currently a graphic design student trying to create a personal logo for myself, for use on a business card and other stationary. The logo is an ambigram. </p>
    <p>I won’t tell you want it reads, I’d like to see if it is legible. </p>
    <p>Any feedback, good or bad would be appreciated. </p>
    <p>Excited to hear from you!<br>
    - Melo</p>
