      <p>Marie</p>
      <p>Thanks for the tip. I'll ask around.</p>
      <p>There is already quite a good number of pieces of Goudy's work that had in the first weeks after the fire geen rescued by FWG's opthamologist. The man was also a hobby printer and was given permission by Goudy to go thrugh the burned-out building to collect whatever he wished from the ashes. He found a number of the cardboard working patterns and some sketches etc, which were scorched, but mostly intact. This collection he later willed to the University of Washington Special Collections. I looked through the work a number of years ago, and was thrilled to see what fine things had been saved.</p>
      <p>Thanks again</p>
      <p>Jim</p>
