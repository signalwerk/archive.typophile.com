    html: <p>I don't know whether anyone has explored the site. Forgive me if this is common knowledge---I found on Google that there is another old mill, Gomez House, that is located on the same creek on which Deepdene was located. Dard Hunter lived at Gomez House from 1912 until sometime around 1919 or 1920.  The house is now owned and operated by a non-profit foundation.  I'm wondering whether the folks at the Gomez House know anything.  Their website is <a href="http://gomez.org/" title="http://gomez.org/">http://gomez.org/</a>.</p>
