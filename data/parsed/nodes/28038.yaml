    <p>I have wondered for quite a few years if anyone has ever taken the trouble to explore the site of Goudy's mill building at Marlborough (the workshop that burned back in the early 'forties).</p>
    <p>It has been noted that all of the heavy equipment and other mertal objects tumbled into the ravine and stream bed that ran behind the mill.</p>
    <p>Jim Rimmer</p>
