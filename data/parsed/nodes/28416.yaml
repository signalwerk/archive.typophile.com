    <p>OK, it has a name just because I need to call the file something. I think it could do with a better one.<br>
    So, here's my attempt at a kinda-sorta semiserif font.<br>
    All the cahracters I have so far are inthe PDF. Trying to do it all with off-brand software is taking some getting used to, but it's all I can afford right now.</p>
    <p>-EDIT- OK, there's a revised PDF also attached, but the original is still there for comparison.</p>
    <p>-EDIT- Upon further reflection, this is hardly a semi-serif at all anymore. I might generate a sans version eventually, then I'll have something to work between.</p>
