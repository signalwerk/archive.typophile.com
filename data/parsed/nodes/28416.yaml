    html: |-
      <p>Regarding the lining figures:<br>
      - You need to get right all those overshoots. That /4/ is flying next to /3/ and /5/. /3/ looks short next to /2/.<br>
      - Also, make the thins consistent. /8/ is almost monowidth.<br>
      - The crossbar of /4/ is may be too low.</p>
      <p>Regarding the oldstyle figures:<br>
      - I don't know if that /4/ works. Take the lining /4/ as a reference.<br>
      - Nice /8/ and /3/!<br>
      - /1/ may work, but right now <em>all</em> serifs are too short.</p>
