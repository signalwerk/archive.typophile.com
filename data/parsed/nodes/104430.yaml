      <p>I agree with PublishingMojo that it's hand-lettered, as were almost all book covers from the era, and with his explanation.<br>
      Still, the lettering is interesting. I adjusted the geometric distortion and improved the contrast so we can better see what we are trying to match:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/NancyDrew6_3734.jpg"></div><br>
      We have a mixture of styles so no single font is going to do the trick. The angled slope of O, an "old style" font feature is unlikely to be found in fonts with the boxy structure of the other letters. And note the high-waist K.<br>
      Don<p></p>
