      <p>You're welcome.<br>
      I am assuming the lettering is from the first edition, 1933.<br>
      The Nancy Drew books began in 1930. This one is number 11. Five more in the 1930s. If the publisher,  Grosset &amp; Dunlap, was seeking some consistency in the series, the lettering on at least some of the other 1930s books might in the same style. The lettering would probably be sufficient for a font designer to make a titling font that would have this particular retro flavor. IMHO there is no shortage of people able to use modern font-making tools who are looking for interesting material.<br>
      Don</p>
