      <p>I'm guessing handlettering, based on the evidence of slight variations in the letterforms (e.g., the <strong>T</strong> in <em>locket</em> is wider than the other <strong>T</strong>s). <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/cheltenham/" rel="nofollow">Cheltenham</a> has a similar feel, though you'd have to modify it to get the cockeyed <strong>O</strong> and the high-waisted <strong>K</strong>.</p>
      <p>This example was foil stamped, not printed, so the binder would have had to make a stamping die. In the  1930s this could have been done photographically, so it would have been just as easy to make it from handlettering as from a repro proof of type. Book titles were commonly handlettered in those days when there were far fewer typefaces available in the large sizes needed for book covers and jackets.</p>
