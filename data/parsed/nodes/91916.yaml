      <p>Success!</p>
      <p>The font family seems to have loaded into my system correctly. In FontBook, It shows the name of the font, and under that it shows regular, then italic, then bold, then bold italic, in a submenu shifted to the side a little, like with any other style-linked font.</p>
      <p>Success in Illustrator too. In the font menu, to the right side of the menu, after the name of my font, that familiar arrow is there, and when you hover over my font's name, a little popup window appears to the left, with a list of all of the styles (even though they are all just duplicates of the same weight. I just named them differently and style-linked them according to the instructions of the book.) This is so exciting.</p>
      <p>Is there anything else I can do to test out how solid my style linking and family naming is?</p>
