      <p>From reading "Learn Fontlab Fast", here is what I am going to do. I wanted to ask you guys if I should be doing something else to, but here's what I'm gonna do:</p>
      <p>I'm going to take my font, which is the regular weight, and I'm going to go Save As and rename it "My Font-name Bold", and then I'm going to change it's settings in the Font Info palette to Bold instead or Regular settings. From there I will work on that and turn that into my Bold weight font.</p>
      <p>What I have come to learn is that with OT fonts, you have to create "mini-families" of no more than four fonts each. Each mini-family must contain at least one "regular" font and may also have style-linked Bold, Italic, and Bold Italic fonts. If you have six font weights/styles total, the second mini-family would contain two fonts. This mini-family structure is not required by Mac, but Windows apps.</p>
      <p>When I fill in the "Family Name" field, I use only English upper and lowercase letters, numbers and spaces. Must be less than 32 characters long. All fonts within a family should share the same name i.e. "Palatino". I then set the weight and width settings by choosing the closest correct-sounding entries from the pulldown. I then pick the right italic and bold settings as the book describes. Then I hit the "Build Style Name button… Each Style Name in a family must be unique… Finally I hit the "Build Names" button.</p>
      <p>Then I save and close all fonts.</p>
      <p>I copy my four .vfb files into a new folder and open them in FontLab. Then I go FILE-Font Info-OpenType Specific Names. I click on the Build OpenType names button and repeat this step for all four fonts. </p>
      <p>Then I go back to the Names and Copyright main menu, and for each font, in the Family Name field, enter the name of my mini-family e.g. "Palatino" or "Palatino Condensed." </p>
      <p>In the Style Name, I enter one of the following values: "Regular, Italic, Bold, or Bold Italic" exactly as spelled. I click appropriate Bold or Italic boxes when it's Bold or Italic. </p>
      <p>I guess that's basically it?</p>
      <p>Okay I think I'll be okay now. Hopefully Leslie Carbaga isn't mad for basically plagiarizing his book. I just wanted to show you all what I do know and would like others to please share with me some advice even beyond this. I really want to get this perfect the first time I try it.</p>
      <p>What I'm going to do, is create duplicates of my Regular font, and even though they aren't really bold or bold italic or italic yet, I will name them so and use them as temporary placeholders. I will put them in the same folder, following the procedures above, naming them correctly. My theory is that it shouldn't matter if someone installs my regular font now and one of the others later if I set it up the style-linking on the 3 duplicates of the font correctly. And then when I finish the italic next year I'll follow the same naming procedures, and when they install it, the italic font should appear right next to or right under the regular weight in their app font menus, right? Why would it matter which fonts they install first, whether it's 5 minutes apart or 5 years apart, if I set up this style-linking correctly? Am I wrong?</p>
