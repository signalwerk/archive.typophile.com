      <p>Oh I left out one last step to finalize family naming according to the book. In Studio 5, you are supposed to go to OpenType prefs and under Generating Opentype and TrueType export, you enable "Use OpenType names as menu names on Macintosh" option, (I found this was already that way) and then you select "Append Opentype name record to the..." (again I already had this). Finally under Opentype PS (otf.) enable "Use Postscript Font Name as Full Name" (I already had this too.).</p>
      <p>Now I'm getting ready to test to see if my family naming structure works by generating and installing these fonts. What's the best way to test to see if there's anything wrong with my family naming?</p>
