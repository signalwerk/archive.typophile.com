    <p>Hey all.</p>
    <p>I finally finished my new OT font and even tested it for errors and got rid of those. I haven't programmed the features yet. I'll add those soon.</p>
    <p>Anyway I want to start selling this font pretty soon, and I want to sell it as the single weight that it is right now, before I finish the other wights. It is just the regular weight. I am going to turn this one weight into an entire family over the next couple years, and I was wondering what I need to do to this first weight's family naming structure, in order to prepare it to snap flawlessly into place with the rest of it's family which will be coming out in the future. So that if a user has purchased the font and installed it on their system, and later they buy individual styles like italic, or whatever, or they buy the entire family of 5, which includes the font that they already have installed, what's the best way to set up the family naming structure and naming settings in FontLab to ensure that something weird doesn't happen to the user in that situation in the future?</p>
    <p>Are there any known family naming issues out there that anyone would like to share? I've heard that family naming can be one of the trickiest things about OT font creation, and I don't want to screw it up.</p>
    <p>Thanks everyone.</p>
    <p>PS<br>
    I have seen a Font­Lab Stu­dio 5 Python Script from Cape Arcona type foundry for Font Fam­ily Nam­ing, that is supposed to "change the font names of all opened fonts for the use as font fam­i­lies. The nam­ing method will also split up the fam­ily into single-font-families in the font menu in non-OT-savvy Win­dows applications." I can't really understand exactly what it does yet, but maybe this would be useful to some, or me. It sounds like it helps you properly set up font family-naming? Here is a link to it: <a href="http://www.cape-arcona.com/news/capearcona/opentype-production/" title="http://www.cape-arcona.com/news/capearcona/opentype-production/">http://www.cape-arcona.com/news/capearcona/opentype-production/</a></p>
