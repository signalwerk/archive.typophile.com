    html: |-
      <p>Hi Easton,</p>
      <p>as you might know, <a href="/wiki/Arial" class="freelinking">Arial</a> is a rip-off of <a href="/wiki/Helvetica" class="freelinking">Helvetica</a>, with cloned metrics. Its entire raison d'être is a morally questionable one: avoiding license fees (further reading: <a href="http://www.ms-studio.com/articles.html">The Scourge of Arial</a> by <a href="/wiki/Mark%2520Simonson" class="freelinking">Mark Simonson</a>). The only advantages that Arial acually might have over Helvetica – a huge character set and good screen rendering – is probably irrelevant for your project. Hence, I’d say the best Arial for print is a Helvetica. Which one? Well, opinions do vary. <a href="/wiki/Neue%2520Helvetica" class="freelinking">Neue Helvetica</a> is cleaner, more consistent across the weights. Some prefer the classic Helvetica, just because of its quirks. <a href="http://typophile.com/node/55088#comment-330962">Others, again, praise the URW digitization</a>.</p>
      <p>Times Ten has <a href="/wiki/oldstyle%2520figures" class="freelinking">oldstyle figures</a> and <a href="/wiki/small%2520caps" class="freelinking">small caps</a>, which makes it a more versatile and dapper choice than the system TNR. More information in <a href="http://typophile.com/node/42524">this thread</a>.</p>
      <p>Courier might be the hardest nut. The digital versions of both <a href="/wiki/Courier" class="freelinking">Courier</a> and <a href="/wiki/Courier%2520New" class="freelinking">Courier New</a> don’t perform very well in print (nor on screen), to say the least. There are so many good alternatives – if you really want to go with a typewriter/monospace for ‘extended texts and poetry’.</p>
      <p>Having said that, it is not clear to me if you are looking for the best versions of Arial/Times/Courier that actually go by those names, or rather for good alternatives from the same genres. If the latter is the case, have a look at <a href="http://www.fontshop.com/fontlist/alternatives/">Stephen’s lists</a>:<br>
      <a href="http://www.fontshop.com/fontlist/alternatives/times_new_roman/">Times Alternatives</a><br>
      <a href="http://www.fontshop.com/fontlist/alternatives/helvetica/">Helvetica Alternatives</a><br>
      <a href="http://www.fontshop.com/fontlist/genres/typewriter/">Typewriter</a> and <a href="http://www.fontshop.com/fontlist/genres/monospaced/">Monospaced</a> faces</p>
      <p>Hope this helps.<br>
      F</p>
    html_clean: |-
