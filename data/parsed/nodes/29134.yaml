    <p>So here's the deal:<br>
    I put this together for a wedding guide put out by my publishing company. I had a few hours to design it, and this is what I came up with. I thought I was being clever with the black/white space, and it gave me an opportunity to use Garamond Premier Pro. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/wedding-guide_5667.jpg"></div><p></p>
    <p>Here's the catch:<br>
    Every <cite>guy</cite> who looked at it thought that it was ok. Cool even. But the design was UNIVERSALLY LOATHED by <cite>every woman</cite> who caught sight of it. </p>
    <p>We have a freelancer who also happens to be a wedding photographer, and she shot it down immediately. She said it was not "feminine" enough.</p>
    <p>ARGH! That's what I thought I was making!</p>
    <p>What do you think? How do you make something (more) feminine?</p>
