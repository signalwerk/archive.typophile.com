      <p>A wedding planner should look romantic more than feminine and this just isn't either. I think the font is ok but the photo is all wrong - you can't tell at a glance what's going on and the design is, as Chris said, too corporate. I think you should check out some wedding magazines, Brides or Martha Stewart, to get a sense of what might appeal to women. </p>
      <p>Think FLOWERS. You don't have to go over the top with pink and script, sepia could be quite nice and elegant but you have to soften the design. Lose the hard edges.</p>
      <p>(Even tho I'm a woman, I'm not exactly the target audience since I think romantic is a quick hookup at city hall on your way to the airport for your honeymoon)</p>
