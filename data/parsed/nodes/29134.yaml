      <p>Well, as a hetero woman who's walked down (and back up) the aisle more than once, and to echo others, this is far too "businesslike," but that doesn't mean you need all the mushy-gushy Martha crap either.  </p>
      <p>Yes, some romance would be useful -- even after my experience, I'd like to think most people marry for love and not necessarily for the tax break -- but even making the picture four-colour instead of sepia would be a big improvement.  And if there's only the budget for one colour, go for a one that is well saturated (a rich, dark blue/green/wine/rust). </p>
      <p>Oh, yeah, and a typeface that's a little more casual. Doesn't have to be terribly swishy, y'know: even Optima would be an improvement!</p>
      <p>Linda</p>
