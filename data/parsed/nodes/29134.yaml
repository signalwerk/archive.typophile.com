      <p>I chose that photo precisely because it wasn't a boring old wedding photo. I am certainly kicking myself now over the missing heads, but I thought the basic premise of a woman putting the ring onto the man's hands symbolized the empowered Seattle woman. And I also thought that the older-style dress would appeal to an older re-marrying generation.</p>
