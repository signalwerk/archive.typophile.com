      <p>well... it all depends.</p>
      <p>if yer target audience is gonna be predominantly corporate drones, I would think this appropos. You might as well have a picture of them signing the license. </p>
      <p>but, for regular folks... too design school rigid. What "guys" think borders on the irrelevant... women plan weddings, for the most part. </p>
      <p>and too... consider the sexist stereotype imagery, unfortunately, unavoidable. A man slipping a ring on a womans finger... surrender ('cause he love her so). Reverse it and the woman is claiming her prize. Get rid of the ring thing. </p>
      <p>In fact, get rid of the people altogether. Marriage is an abstract and  is a lot more palatable in the abstract. Consider decorative materials including, yes, flowers. A combination of floral Script caps  and italic. Disperse the 'color'. The image as a whole is bottom heavy. </p>
      <p>Magazines, sure. (What? You dont have a library within a few miles?) But consider that other staple of wedding 'promotional material'; find the classiest wedding invitation and study THAT.</p>
      <p>and avoid listening to advice from dedicated bachelors.</p>
      <p>geo.</p>
      <p>and btw, patty... i like the way you think.</p>
