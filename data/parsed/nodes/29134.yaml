      <p>The tough part with wedding stuff is that weddings are mostly about the brides mother wanting the "perfect wedding" for her daughter.  The father may write the checks but mom, daughter, and her best girlfriends really do the wedding.  Maybe that makes it tough to crack the traditional wedding stuff.  Maybe their thought is just "my pretty daughter in her bride suit."  The guy is just along for the ride.  Talk to mothers-of-the bride types and you may get a real picture of what the audience wants. Maybe they just want it to look like a wedding?</p>
