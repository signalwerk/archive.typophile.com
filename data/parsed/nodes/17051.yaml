    html: <p>Fonts like Papyrus become so popular for a variety of reasons, but in this case, I believe that it's because Papyrus makes it very easy for designers to be lazy and rip off ignorant clients. It's quite easy to take on a cheap design job, slap up Papyrus text, a stock image/illustration, and then ping the client for a couple hours worth of work that really only took fifteen minutes. For the last few years I can't go to any city in the USA and <em>not</em> see Papyrus. Hell, two blocks from this building there's a <em>French</em> restaurant that used Papyrus for its logo! But 99.9% of the uses are drek; just lazy designers using it to fill one of a dozen niches that it doesn't really, but since it's so damned pretty and odd it can pass long enough for the check to clear.</p>
