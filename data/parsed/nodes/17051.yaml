      <p>I remember buying Letraset rub-on type sheets of Papyrus at art supply stores back in the 80's. It is an attractive typeface. Few casual users have any tools to make the digital version of it attractive, much less the knowledge or natural talent to do so. What else can one expect from the average office worker armed only with MS Word?</p>
      <p>I'll second Dezcom's comment about Trajan.</p>
      <p>Trajan is a typeface very over used on movie poster titles by people doing paid creative work. Need a typeface for a movie poster? When in doubt, select Trajan.</p>
      <p>Now that Trajan Pro is bundled in with Photoshop (and other CS2 and Adobe Production Suite applications) it may be threatened to become even more annoying from over use. And that's really too bad since it, like Papyrus, is a beautifully drawn typeface.</p>
