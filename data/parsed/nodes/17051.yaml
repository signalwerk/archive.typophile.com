  html: |-
    <p>Chris Costello's 1983 font Papyrus was a beautiful design and I bought it myself back in the day (when fonts came on 3.5" 1.4 meg discs) it is sad to me that it got so popular as it has no value anymore to me because of the immense saturation. In other words it is good for one thing-blanding.<br>
    Anyone else have any thought on the use of overly used display fonts? </p><div class="imageWrap"><img src="http://typophile.com/files/papyrus.jpg"></div><p></p>
