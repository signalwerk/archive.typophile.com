      <p>&gt; <cite>In a dream world, what fonts would you suggest come installed on consumer desktops?</cite></p>
      <p>Sadly, no matter what you'd pick, it would soon become overused and abused. </p>
      <p>Look at the disdain many people have for Helvetica (or Arial) and Times New Roman because they're so "average" and "boring." They're perfectly fine typefaces on their own. But their oversaturation in daily life has made them bland and meaningless to most people.</p>
      <p>That leads the everyday user to pick other readily-available/system fonts that are illogical choices like Papyrus or Comic Sans just to try to be different or to add an element of "fun." Eventually, the misuse makes those typefaces just as (seemingly) meaningless.</p>
      <p><strong>Edit:</strong><br>
      &gt; <cite>Familiarity breeds contempt, and excessive misuse breeds nausea, tedium and revulsion.</cite></p>
      <p>Yeah, what Nick said! (Sorry for the re-post of the same thought!)</p>
