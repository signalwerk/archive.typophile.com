      <p>&gt;“Ok, so what are the chances of getting Apple and Microsoft to nix abused typefaces from their default installs?”</p>
      <p>For a variety of reasons beginners, bloggers and self-appointed style-guru types, take their pent up fury out on Papyrus, Comic Sans, etc., while the true typorati (such as the regulars on typophile) realize that every bundled font is abused and over-used. </p>
      <p>The answer is not to ban this font or that font, or hide those deemed offensive from users font lists, but to educate, promote and make available fresh designs to casual users – something I think myfonts.com has done a pretty good job at.</p>
