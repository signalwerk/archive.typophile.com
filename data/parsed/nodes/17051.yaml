      <p>The real problem is not that Papyrus or Comic Sans are rotten type designs; quite the contrary, they are both well-drawn and suitable for specific purposes. For that matter, Times New Roman is really an excellent, quite elegant text face.</p>
      <p>The problem is that, because these faces are included with the Windows operating system, a LOT of people who are utterly clueless about design use them because they're <em>kewl</em> (or whatever) excessively and/or in the most inappropriate circumstances. Familiarity breeds contempt, and excessive misuse breeds nausea, tedium and revulsion.</p>
