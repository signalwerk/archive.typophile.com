    html: |-
      <p>It may seem naive to use such a pedestrian display face, but it's equally naive to choose a face simply because of its obscure and essoteric qualities.</p>
      <p>Type should be chosen based on its relevance to the content. Of course, there is a point where the <cite>misuse</cite> of a face is so common that it no longer speaks the visual language it was intended to speak. Papyrus is probably one such face, as are Zapfino and several other faces that come bundled on the Mac.</p>
      <p>For the record, I recently received an Art Director's resume which was set with Papyrus subheads. One glance and it went straight to the trash.</p>
