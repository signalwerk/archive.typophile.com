    html: |-
      <p>Davex,<br>
      There have always been "hot typefaces" but before digital type and bundling, they became hot by getting used by big name design firms and ad agencies and perhaps winning some awards. That flocked a bunch of "me too" users.  In the 80s, U&amp;lc was published and became a very effective showcase for all the ITC faces. Type, even then, was much quicker to come to market as phototype than the old hot metal predecessor. Many of these faces were redesigns of older styles and brought back (albeit with a bigger x-height and tighter spacing). The faces you say "are never heard of again" will be the next decades "retro" and hot again.<br>
      The good stuff (and some not so good) will come back as new. I remember when Tiffany lamps were being junked. Then they were replaced by 50s clunk. Then they came back as elegant antiques. Then the 50s clunk comes back as cool retro. Fads always happened, sometimes for better reasons than others.</p>
      <p>ChrisL</p>
