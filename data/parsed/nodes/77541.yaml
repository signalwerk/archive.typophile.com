      <p><cite>I can do some cut &amp; paste work to show all the lowercase letters. I’ll post it later today.</cite></p>
      <p>Not for me -- I'll take the offset proofs as evidence. The problem with laser printers is as you say, at least when smaller sizes are used. I have no great experience with evaluating larger sizes on a laser printer. </p>
      <p>One thing I have noticed though, is if you optimize character fit at a larger size, it will be wrong for text-size settings. An old friend of mine use to try, occasionally, to get one of the 18-point master Linotype photocomp fonts to work for text. In those days, all you could do with those proprietary fonts was to kern them. Every damn letter pair with one of those 18-point masters.</p>
      <p>As a compositor, I have a lot of experience with laser proofs for text settings. Kerning, fit, even sometimes the characters themselves will be different from the final offset printing. If we're really working over a font, all the work before that first offset book is considered "preliminary."</p>
