      <p>Bill, our laser printers are asked to run upwards of 2 million copies before we spend another $2,000 to outright replace them. Of course, the service work adds to the total cost. Our (older) HP LaserJet 8100 and Xerox Phaser 5500 have both passed that test. The Xante 4G is sitting on the floor, not working . . .</p>
      <p>We stopped photocopying back when it occurred to us we could make all the proof sets as originals just about as cheaply as running one set of lasers, then photocopying them. That meant if a publisher wanted 5 sets of proof, all were run as originals on the laser printer. Much better quality that way, and less labor to boot.</p>
      <p>Now that more and more publishers are asking for PDFs as the only form of proof, I suppose the laser printers will get less use. The reason for the switch to PDFs is shipping costs, of course. Personally, I hate making and dealing with Printers Queries on PDFs.</p>
      <p>R(subscript)t is Total Resolution. It's reciprocal is the sum of the reciprocals of all the elements. You can have one element way up there and the effect on total resolution won't be much. But if it is the right one, it does let you legally advertise a high resolution for a machine.</p>
      <p>* * *</p>
      <p>Christobal, how strongly do you feel about that wide "v"?</p>
      <p>* * *</p>
      <p>1996type -- hang in there. Get your proofs as best you can. We all have a huge number of failures, and some of them come from having to learn how our equipment fools us. Some of us even have to learn the same thing two or three times before it sinks in (blush).</p>
