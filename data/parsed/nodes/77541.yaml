    <p>Hello everybody,</p>
    <p>I'm currently working on a text typeface so I constantly need to make testprints. Problem is: My inkjet printer (not even on high resolution paper) shows enough detail at text size. How do you guys do this? Is the laserprinter from the coffeeshop next corner good enough or is there some other way? Any advice/help is much appreciated.</p>
    <p>Thanks in advance, Jasper</p>
