      <p><cite>most of us don’t have an offset machine at our disposal for every single project, so we must find reliable substitutes – at an affordable price, if it is possible.</cite></p>
      <p>While it would mean a delay in releasing the font, if it is a good text font, I'd bet you could get an book interior designer to specify it for a book. Most would do that for a free license for the font. From that point on, it is straight production right up to the final book. Once F&amp;Gs are approved, the publisher usually has no more use for them; there are your proofs, in an unbound form.</p>
      <p>As you have shown, you can get quite close with laser proofs. If the printing is decent, one book printed offset should let you get the final refinements. I suppose you could even have an early release or a beta version of a font, either at a discounted price, or with the offer to replace it when the final work is done.</p>
      <p>Edit: Chris, I agree about ink jet printers for type. For photos, they are much better than laser printers. We use to have to do a new (ICC) profile for the laser printer once a day to do proofs for images -- or more often, if the damn thing got hot. The ink jet will hold a profile for a long time.</p>
