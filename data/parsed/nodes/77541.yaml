      <p>Bits and pieces . . .</p>
      <p>In point of fact, we have a Xante 1200, but it is just too expensive to operate. There is no non-factory service where we are, so you have to ship it in for service. Factory toner is expensive as well. There were also some curves programmed into the machine which made coming up with ICC profiles difficult, but we did overcome that. Still, if the Xante 1200 works well, and you have no access to offset printing, I suppose these aren't overwhelming obstacles. But I remain unconvinced that any electostatic, powder toner on paper system can approach a *system* (total) resolution of close to 1200 dpi (1/Rt = 1/R1 + 1/R2 + 1/R3  + . . . 1/Rn). </p>
      <p>I've seen short-run books printed both by offset press and digital press where I can tell the difference between offset press and the digital press three feet away, where I can't even read the type. Usually it is cheaper to go offset around 500 copies, but some printers are investing in digital presses because it is easier to get the images right. Talk about the horse and cart!</p>
      <p>* * *</p>
      <p>Yes, if you don't have both a roman and an italic in pretty good shape, it will be hard to talk a designer into using your fonts for a book.</p>
      <p>* * *</p>
      <p>I am going to mention Espinosa Nova to a couple of our clients who do a number of books on Mexican history. University press budgets are terribly constrained just now, but I think it would be a useful purchase for them.</p>
