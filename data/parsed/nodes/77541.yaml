      <p><cite>Christobal, how strongly do you feel about that wide "v"?</cite></p>
      <p>Very strong. I mean, though I had a lot of other projects in the meantime, Espinosa took me nine years to develop. I could continue moving nodes for all eternity, but at some point I decided to stop so I could release it and move on to the next project. I am pretty sure that some details won’t please everyone and, as a matter of fact, other persons have mentioned me other letters they don’t like. But so far the balance of the comments has been very very positive (and obtained two certificates of excellence this year!), so I must think very well if a change is really required.</p>
      <p>At some point I am going to add more diacritics, tweak some minor things and probably add a couple of new tricks, but changing the “v” is not in my list. However, I am always open to make this kind of customization work if a client asks for it. And my EULA also gives to the user the permission to make this sort of changes by himself or by third parties, if they contact me in advance.</p>
