      <p>* * *</p>
      <p>Yes, if you don't have both a roman and an italic in pretty good shape, it will be hard to talk a designer into using your fonts for a book.</p>
      <p>* * *</p>
      <p>I am going to mention Espinosa Nova to a couple of our clients who do a number of books on Mexican history. University press budgets are terribly constrained just now, but I think it would be a useful purchase for them.</p>
