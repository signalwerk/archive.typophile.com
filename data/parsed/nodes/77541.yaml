      <p>Definitely get a laser printer. Even a cheap one with 600 dpi will do the trick, but you can get some 1200 dpi printers for not too much money and are far better: as an alternative to my <a class="freelinking external" href="http://h10010.www1.hp.com/wwpc/us/en/sm/WF05a/18972-18972-3328059-14638-3328068-1137934.html" rel="nofollow">HP LaserJet 5200</a>, that I love but was expensive, for my other place I got a much cheaper <a class="freelinking external" href="http://www.brother-usa.com/Printer/modeldetail.aspx?PRODUCTID=hl5370dw" rel="nofollow">Brother HL-5370DW</a> (249 USD) which is not great, but works fine for my purposes (printing proofs for text typefaces).</p>
      <p>If you need more information about what brands, characteristics and models are better, you can consult some old threads <a class="freelinking external" href="http://www.google.com.mx/search?hl=es&amp;client=firefox-a&amp;hs=5yy&amp;rls=org.mozilla%3Aen-US%3Aofficial&amp;q=site%3Atypophile.com+laser+printer&amp;aq=f&amp;aqi=&amp;aql=&amp;oq=&amp;gs_rfai=" rel="nofollow">here.</a></p>
