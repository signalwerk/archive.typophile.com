      <p><cite>One thing I have noticed though, is if you optimize character fit at a larger size, it will be wrong for text-size settings.</cite></p>
      <p>Absolutely right. So I tend to start with smaller sizes for the general fitting and the first kerning proofs, and then I move back and forth to larger sizes just to be sure I am not dealing with false problems derived from the limited printer capabilities when it comes to smaller point sizes.</p>
      <p><cite>Kerning, fit, even sometimes the characters themselves will be different from the final offset printing.</cite></p>
      <p>Absolutely right again. Anyway, most of us don’t have an offset machine at our disposal for every single project, so we must find reliable substitutes – at an affordable price, if it is possible.</p>
