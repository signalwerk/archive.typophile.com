      <p><cite>if it is a good text font, I'd bet you could get an book interior designer to specify it for a book</cite></p>
      <p>Right again. Actually, the offset image that I posted is from a book set with a trial font of the Regular (and a primitive version of the Italic, not shown in the image). But the result of the Regular was good enough for me, so I decided not to do any change, while the Italic was at an early stage so it was not so useful after all for identifying “final improvements”. Probably my problem is that I want to finish* the Regular weight before I start with the Italic, and only when I have both the Regular and the Italic I go for bolder weights, so if I ask for someone to use my Regular trial font I don’t even have a working small family to offer by then (well, you can always propose substitutes for the missing fonts, but this is not ideal). So, while I think it is a very valuable resource if it is available (as it happened with Fondo, a custom font that I made some years ago for a publishing house with his own press), I find that I would need this kind of offset trials more often than my speed to get projects <em>ad hoc</em> but, as I said, this is probably because of my not-so-efficient workflow.</p>
      <p>*This is just a way of talking, of course.</p>
