    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Kabel</strong></p>
    <p>Begun by <a href="/node/12125" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Rudolf Koch</a> in 1927 for the <a href="/node/12147" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Klingspor</a> foundry. The typeface family was expanded and changed over the decades by <a href="/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel <span class="caps">AG</span></a> and <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>.</p>
    <p>Kabel is a geometric sans serif, similar to <a href="/node/12494" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Futura</a>, <a href="/node/13675" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erbar</a>, and <a href="/node/add/wiki?edit%5Btitle%5D=Nobel" title="Create node &quot;Nobel&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Nobel</a>. It is best characterized by its angular stroke endings, its Venetian e, and its distinctive g (similar to the lowercase g used in many Koch designs, including <a href="/node/add/wiki?edit%5Btitle%5D=Koch%20Antiqua" title="Create node &quot;Koch Antiqua&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Koch Antiqua</a> and <a href="/node/13150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Wallau</a>).</p>
    <p><a href="/node/13498" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Walter Tracy</a> wrote about Kabel in the Rudolf Koch chapter of his <a href="/node/41912" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Letters of Credit</a>. The Beatles used Kabel in for the film titling in their 1960s animated classic, <em>Yellow Submarine</em>.</p>
    <p><a href="/node/add/wiki?edit%5Btitle%5D=Victor%20Caruso" title="Create node &quot;Victor Caruso&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Victor Caruso</a> designed a version of Kabel for <a href="/node/13402" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">ITC</span></a> in the 1970s, named <a href="/node/15665" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">ITC</span> Kabel</a>, which is not faithful to the original design. Similar to <a href="/node/15664" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">ITC</span> Garamond</a>, <span class="caps">ITC</span> Kabel has an excessively large x-height, created to please New York advertising tastes of the&nbsp;day.</p>
    <p>An <a href="http://www.linotype.com/892/kabel-family.html">overview of the Kabel type family</a> is available on the <a href="http://www.linotype.com">Linotype website</a>.</p>
