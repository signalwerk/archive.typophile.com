    <p>Kabel is a geometric sans serif, similar to <a href="/node/12494/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Futura</a>, <a href="/node/13675/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Erbar</a>, and <a href="/node/add/wiki?edit%5Btitle%5D=Nobel" title="Create node &quot;Nobel&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Nobel</a>. It is best characterized by its angular stroke endings, its Venetian e, and its distinctive g (similar to the lowercase g used in many Koch designs, including <a href="/node/add/wiki?edit%5Btitle%5D=Koch%20Antiqua" title="Create node &quot;Koch Antiqua&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Koch Antiqua</a> and <a href="/node/13150/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Wallau</a>).</p>
