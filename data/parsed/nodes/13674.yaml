    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Kabel</strong></p>
    <p>Begun by <a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a> in 1927 for the <a href="/wiki/Klingspor" class="freelinking" rel="nofollow">Klingspor</a> foundry. The typeface family was expanded and changed over the decades by <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a> and <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>.</p>
    <p>Kabel is a geometric sans serif, similar to <a href="/wiki/Futura" class="freelinking" rel="nofollow">Futura</a>, <a href="/wiki/Erbar" class="freelinking" rel="nofollow">Erbar</a>, and <a href="/wiki/Nobel" class="freelinking" rel="nofollow">Nobel</a>. It is best characterized by its angular stroke endings, its Venetian e, and its distinctive g (similar to the lowercase g used in many Koch designs, including <a href="/wiki/Koch%20Antiqua" class="freelinking" rel="nofollow">Koch Antiqua</a> and <a href="/wiki/Wallau" class="freelinking" rel="nofollow">Wallau</a>).</p>
    <p><a href="/wiki/Walter%20Tracy" class="freelinking" rel="nofollow">Walter Tracy</a> wrote about Kabel in the Rudolf Koch chapter of his <a href="/wiki/Letters%20of%20Credit" class="freelinking" rel="nofollow">Letters of Credit</a>. The Beatles used Kabel in for the film titling in their 1960s animated classic, <em>Yellow Submarine</em>.</p>
    <p><a href="/wiki/Victor%20Caruso" class="freelinking" rel="nofollow">Victor Caruso</a> designed a version of Kabel for <a href="/wiki/ITC" class="freelinking" rel="nofollow">ITC</a> in the 1970s, named <a href="/wiki/ITC%20Kabel" class="freelinking" rel="nofollow">ITC Kabel</a>, which is not faithful to the original design. Similar to <a href="/wiki/ITC%20Garamond" class="freelinking" rel="nofollow">ITC Garamond</a>, ITC Kabel has an excessively large x-height, created to please New York advertising tastes of the day.</p>
    <p>An <a href="http://www.linotype.com/892/kabel-family.html" rel="nofollow">overview of the Kabel type family</a> is available on the <a href="http://www.linotype.com" rel="nofollow">Linotype website</a>.</p>
