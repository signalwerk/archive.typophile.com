    <p><a href="/node/add/wiki?edit%5Btitle%5D=Victor%20Caruso" title="Create node &quot;Victor Caruso&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Victor Caruso</a> designed a version of Kabel for <a href="/node/13402/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept"><span class="caps">ITC</span></a> in the 1970s, named <a href="/node/15665/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept"><span class="caps">ITC</span> Kabel</a>, which is not faithful to the original design. Similar to <a href="/node/15664/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept"><span class="caps">ITC</span> Garamond</a>, <span class="caps">ITC</span> Kabel has an excessively large x-height, created to please New York advertising tastes of the&nbsp;day.</p>
    <p>An <a href="http://www.linotype.com/892/kabel-family.html" class="link-external">overview of the Kabel type family</a> is available on the <a href="http://www.linotype.com" class="link-external">Linotype website</a>.</p>
