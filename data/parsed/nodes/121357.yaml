  html: |-
    <p>Hi, I'm designing a cook book and it needs to have a "home made" feel so using a handwritten font for tips and explanations ... I have used Quickpen (<a href="https://www.myfonts.com/fonts/trial-by-cupcakes/quickpen/" title="https://www.myfonts.com/fonts/trial-by-cupcakes/quickpen/">https://www.myfonts.com/fonts/trial-by-cupcakes/quickpen/</a>) which I love but the client has decided they want something that they think is more readable. Just wondering if anyone has any suggestions? I like the shape and flow of quickpen - would love something with a similar feel and welcome any feedback from here.<br>
    Thanks!</p>
