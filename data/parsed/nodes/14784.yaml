    html: "<p>The glyph window only jumps around if you size it smaller than the glyph set you have selected: ‘alternates to selection’, ‘numerals’ ‘all characters’ etc. The highlighted character has to default somewhere, I guess; what do you suggest? The current highlight at least has the merit of confirming to you what character you will be replacing. Maybe Adobe will change it if you have a better idea. I find the most useful feature is the ‘alternatives to selection’ choice of palate. This gives you a relatively small, relevant set of options.</p>"
