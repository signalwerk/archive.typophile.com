  html: |-
    <p>Is there a way to turn off the “move job case to selected text” annoyance?<br>
    I mean, if you’re hunting the glyph pallete and you find a slug you want,<br>
    when you go to select the text it is to replace, your job case jumps from the good<br>
    slug, to the selected slug… What’sat good for?</p>
