    <p></p><div class="imageWrap"><img src="http://typophile.com/files/gothic_round-480_3940.png"></div><p></p>
    <p>HWT Gothic Round is the newest release from the Hamilton Wood Type Foundry. Gothic Round was first introduced as wood type by the George Nesbitt Co. in 1838. The font is a softened variation of a standard heavy Gothic typeface. The style evokes a much more recent history of the 1960s and 70s and can be seen in such places as donut shops and on children's toys as well as inspiration for such fonts as VAG Rounded. </p>
    <p>Gothic Round has not previously been available as a digital font until now. The font was digitized by Miguel Sousa from a wide variety of historical sources, including visits to the Cary Collection at RIT (Rochester, NY), WNY Book Arts Center (Buffalo, NY) and the Hamilton Wood Type Museum (Two Rivers, WI). The result is a very solid and contemporary font with a 175 year history.</p>
    <p>Different versions of Gothic Round were originally offered by several different wood type manufacturers, dating back to the George Nesbit design of 1838. Each design had their own quirks and defining characteristics. After Hamilton bought out Page, Wells and Morgan &amp; Wilcox, they briefly offered the various cuts from their former competitors before standardizing.</p>
    <p>Designer Miguel Sousa of Adobe considered many sources for the digitization project. The initial source material was found in the print studio of the Western New York Book Arts Center (WNYBAC), where lower case letters were only found for two of the four different sizes in the collection. However, in settling on which version would best inform this new digitization, Miguel also looked at specimens from the Massey Library (University of Toronto), Newberry Library in Chicago and wood type from the Cary Collection at RIT. In addition to WNYBAC, where he also printed, he also visited the Hamilton Wood Type Museum to become fully immersed in this project.</p>
    <p>Ultimately, Miguel settled upon the use exemplars from multiple cuts to create a more pleasing hybrid. The uppercase, the figures, and the punctuation were based on 8-line print samples of the Heber Wells version (WNYBAC collection), while the lowercase was sourced from pictures of 4-line type of the Wm. Page version (Cary collection).</p>
    <p>Visit P22's <a href="http://www.behance.net/gallery/HWT-Gothic-Round-Wood-Type-Digitization/11158977" rel="nofollow">Behance</a> page for photos and more background info on the development of this font from wood type to digital.</p>
    <p>For more information regarding this release, check out the Hamilton Wood Type <a href="http://www.hamiltonwoodtype.com/gothicround.html" rel="nofollow">website</a>.</p>
    <p><a href="http://www.hamiltonwoodtype.com/gothicround.html" rel="nofollow">HWT Gothic Round</a>  is available at an introductory discount through October 31st.</p>
