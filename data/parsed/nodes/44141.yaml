      <p><cite>How about it Adobe? How about picking up the slack here and giving a bit back to the Internet community that made you the powerhouse you are today?</cite></p>
      <p>I missed this somehow the first time. But I agree wholeheartedly with Ralf. Further, for that to work, the OS vendors have to actually be interested in bundling your fonts....</p>
      <p>But that really doesn’t solve the problem faced by Web designers. What most of them really want is not just to have a few more good fonts, but to be able to use essentially arbitrary fonts - well, actually, the fonts already being used in the visual identity for the person/group/organization the site is for.</p>
      <p>Plus, as we see more mobile devices used for surfing the Web, you get even more vendors in play, and it becomes less practical to bundle gobs of fonts with the device/OS.</p>
      <p>Which brings us back to font embedding/linking.</p>
      <p>(Side note: although the Internet may be the engine of Adobe’s growth today, IMO it’s not what made Adobe a “powerhouse.”)</p>
      <p>Cheers,</p>
      <p>T</p>
