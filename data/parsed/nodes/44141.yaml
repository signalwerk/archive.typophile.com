    <p>OK, I’ve been hearing about Web 2.0 and AJAX and Ruby on Rails and Amazon web services etc for too long now. And every one of these new sites I view all still use Arial and Verdana and Times and Georgia to display their text. Boring. These are the same fonts that were around at the <a href="http://www.google.com/search?hl=en&amp;q=Internet%20Tidal%20Wave%20memo" target="_blank">start of the web</a> (or very soon after). Microsoft released their suite of core web fonts and that was it. No more progress on the typography front.</p>
    <p>I’m not saying Microsoft has to step up again. In fact it’s unlikely they will. They’ve got some <a href="http://www.ascendercorp.com/ctfonts.html">beautiful new fonts</a> that shipped with Vista (and to the consternation of the Vista product managers, the latest version of Office as well). But while one can <a href="http://www.microsoft.com/downloads/details.aspx?familyid=048DC840-14E1-467D-8DCA-19D2A8FD7485&amp;displaylang=en">get these fonts freely on the web</a>, they will never be widely licensed for distribution.</p>
    <p>But what I don’t understand is why others haven’t picked up the slack here. There are some really nice free fonts out there (many of which have been featured on <a href="http://www.smashingmagazine.com/category/fonts/" target="_blank">Smashing Magazine</a>) that could easily be included in the Firefox distribution—like <a href="http://www.kpao.org/2007/12/best-free-fonts.html" target="_blank">these for example</a>.</p>
    <p>Or how about Adobe? They have amazing reach with both Flash and Acrobat Reader, and they also have <a href="http://www.adobe.com/type/" target="_blank">an amazing library of typefaces</a>. How about it Adobe? How about picking up the slack here and giving a bit back to the Internet community that made you the powerhouse you are today?</p>
    <p>Or Google? They licensed the <a href="http://www.ascendercorp.com/pr/pr2007_11_12.html" target="_blank">Droid fonts</a> for their Android phone platform. How about extending use of these fonts to computers as well? They’ve got plenty of client installs (Google Desktop, Toolbar, Talk, Pack...) they could bundle fonts with.Ah well, I’m not holding my breath. I’m still going to use <a href="http://novemberborn.net/sifr3" target="_blank">SIFR</a> for my designs. And for the love of everything that is beautifully designed, I encourage you all too as well.</p>
    <p><em><a href="http://www.kpao.org/2008/04/where-are-the-web-20-fonts.html">Originally posted here</a>.</em></p>
