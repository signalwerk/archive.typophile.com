    html: |-
      <p>With FontForge, if instead of opening in the standard way you open with the following script (in the FontForge script window)</p>
      <p>import fontforge<br>
      fnam=fontforge.openFilename("Open font file:")<br>
      f=fontforge.open(fnam,4)</p>
      <p>you get all the glyphs. I could not find in the preferences the equivalent of the "4" flag to open .ttc files (and I found that flag only  in the old FontForge native scripting documentation).</p>
