    html: "<p>I just tried AFDKO's <code>otc2otf</code> on the Iowan ttc font and got ttf fonts as output. To compare with the fonts extracted with  <code>ttc2ttf.py</code> (that I modified a bit to get the same ttf file names as those given by <code>otc2otf</code>), I used ttx on each ttf file and then compared with the  <code>diff</code> command: the ttx files obtained from the ttf files produced by <code>otc2otf</code> and <code>ttc2ttf.py</code> are  identical. On the other hand, if I split with Apple's <code>ftxsplitter</code>, the modification date and the checksum differ in the generated ttx, but aside from that the ttx files generated are still the same.</p>"
    html_clean: "<p>I just tried AFDKO's <code>otc2otf</code> on the Iowan ttc font and got ttf fonts as output. To compare with the fonts extracted with  <code>ttc2ttf.py</code> (that I modified a bit to get the same ttf file names as those given by <code>otc2otf</code>), I used ttx on each ttf file and then compared with the  <code>diff</code> command: the ttx files obtained from the ttf files produced by <code>otc2otf</code> and <code>ttc2ttf.py</code> are  identical. On the other hand, if I split with Apple's <code>ftxsplitter</code>, the modification date and the checksum differ in the generated ttx, but aside from that the ttx files generated are still the same.</p>"
