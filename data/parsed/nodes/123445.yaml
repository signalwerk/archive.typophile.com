    html: |-
      <p>Here is a more useful script that lists not only the tags but their associated scripts and languages and that can be used to check for consistency.</p>
      <p>#!/usr/bin/env python</p>
      <p>import fontforge,sys<br>
      filename=sys.argv[1].decode('utf-8')<br>
      lstfonts = fontforge.fontsInFile(filename)</p>
      <p>def languages(ll):<br>
        return '; '.join("%s{%s}" % (s[0], \<br>
                    ', '.join(l for l in s[1])) \<br>
                for s in ll)</p>
      <p>def disptable(fnt):<br>
        for t in ['gsub', 'gpos']:<br>
          print "  %s:" % (t)<br>
          lkp = eval("fnt.%s_lookups" % (t))<br>
          for p in lkp:<br>
            v = fnt.getLookupInfo(p)[2]<br>
            if v:<br>
              print "    %s: %s" % \<br>
                   ((v[0][0]), languages(v[0][1]))</p>
      <p>for f in lstfonts:<br>
        print "-----\n%s\n-----" %(f)<br>
        fnt=fontforge.open("%s(%s)" % (filename,f))<br>
        disptable(fnt)</p>
      <p>Let us now come back to what can be done and what may be done.</p>
      <p>Importing into the Regular the GSUB features of the black should take a few seconds. Since the black does not contain the Greek alphabet or cyrillic characters, the features (smallcaps, proportional figures etc) would work only for the latin script; getting more than that requires more than a few minutes.</p>
      <p>Iowan Old Style is however a Bitstream font and <a href="https://www.fontshop.com/foundries/bitstream/eulas/bitstream-typefaces">Bitstream's EULA</a> says</p>
      <blockquote><p>
      No Modifications.<br>
      You may not modify, adapt, translate, reverse engineer, decompile, disassemble, or create derivative works based on the Bitstream Product without Bitstream's prior written consent.
      </p></blockquote>
