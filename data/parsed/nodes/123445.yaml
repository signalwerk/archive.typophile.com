    <p>Hello, all<br>
    I’ve always been a big fan of John Downer’s work, so I was overjoyed when<br>
    I discovered that his wonderful Iowan Old Style was included in Yosemite<br>
    — in a “.ttc” format, which I don’t quite understand, but with small caps and<br>
    old style figures, which were lacking from my old Bitstream PS version.<br>
    Unfortunately, these features don’t seem to work in InDesign: the glyphs are<br>
    visible in the ‘Glyphs’ window, but can’t be used unless you double-click on<br>
    the ones you need to typeset… Does anyone know what all this is about?<br>
    Thank you very much.</p>
