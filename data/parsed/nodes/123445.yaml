      <p>I am still on OS X 10.9 where Seravek is an opentype font. As for Iowan Old Style, it has no lookup except kern. Bangla MN is AAT. I have no tool to check all .ttc files in batch and get statistics.</p>
      <p>Correction: Iowan Old Style Black has the following opentype tables: aalt, salt, ornm, smcp, c2sc, onum, pnum, tnum, liga, ordn, frac, sups, sinf, numr, dnom, subs, kern</p>
      <p>Iowan Old Style Black Italic and Iowan Old Style Titling also have useful GSUB opentype tables. It is only the four standard fonts that are left with only a kern table. </p>
      <p>More precisely, here is the script I executed:</p>
      <p>#!/usr/bin/env python<br>
      # -*- coding: utf-8 -*-</p>
      <p>import fontforge,sys</p>
      <p>filename=sys.argv[1].decode('utf-8')</p>
      <p>def disptable(fnt):<br>
        for t in ['gsub', 'gpos']:<br>
           lkp = eval("fnt.%s_lookups" % (t))<br>
           print("&amp;nbsp;&amp;nbsp;%s: %s" % \<br>
             (t, ', '.join(["%s" % (p[0:6]) for p in lkp])))</p>
      <p>lstfonts = fontforge.fontsInFile(filename)<br>
      for f in lstfonts:<br>
        print "&lt;strong&gt;%s&lt;/strong&gt;" %(f)<br>
        fnt=fontforge.open("%s(%s)" % (filename,f))<br>
        disptable(fnt)</p>
      <p>and here is a copy paste of the trace of execution<br><code><br>
      % lsttables 'Iowan Old Style.ttc' 2&gt;/dev/null<br><strong>Iowan Old Style Black</strong><br>
      &nbsp;&nbsp;gsub: 'aalt', 'salt', 'ornm', 'smcp', 'c2sc', 'onum', 'pnum', 'tnum', 'liga', 'liga', Single, 'ordn', Single, Single, Single, 'frac', 'sups', 'sinf', 'numr', 'dnom'<br>
      &nbsp;&nbsp;gpos: 'subs', 'kern'<br><strong>Iowan Old Style Black Italic</strong><br>
      &nbsp;&nbsp;gsub: 'aalt', 'salt', 'ornm', 'smcp', 'c2sc', 'onum', 'pnum', 'tnum', 'liga', 'liga', Single, 'ordn', Single, Single, Single, 'frac', Single, 'sups', 'sinf', 'numr', 'dnom'<br>
      &nbsp;&nbsp;gpos: 'subs', 'kern'<br><strong>Iowan Old Style Bold</strong><br>
      &nbsp;&nbsp;gsub:<br>
      &nbsp;&nbsp;gpos: 'kern'<br><strong>Iowan Old Style Bold Italic</strong><br>
      &nbsp;&nbsp;gsub:<br>
      &nbsp;&nbsp;gpos: 'kern'<br><strong>Iowan Old Style Italic</strong><br>
      &nbsp;&nbsp;gsub:<br>
      &nbsp;&nbsp;gpos: 'kern'<br><strong>Iowan Old Style Roman</strong><br>
      &nbsp;&nbsp;gsub:<br>
      &nbsp;&nbsp;gpos: 'kern'<br><strong>Iowan Old Style Titling</strong><br>
      &nbsp;&nbsp;gsub: 'aalt', 'salt', 'ornm', 'tnum', 'pnum', 'frac', Single, 'sups'<br>
      &nbsp;&nbsp;gpos: 'kern'<br></code><br>
      where <code>Single</code> corresponds to a some bare single substitution table.</p>
