    html: |-
      <p>Here is a more useful script that lists not only the tags but their associated scripts and languages and that can be used to check for consistency.</p>
      <pre>#!/usr/bin/env python

      import fontforge,sys
      filename=sys.argv[1].decode('utf-8')
      lstfonts = fontforge.fontsInFile(filename)

      def languages(ll):
        return '; '.join("%s{%s}" % (s[0], \
                    ', '.join(l for l in s[1])) \
                for s in ll)

      def disptable(fnt):
        for t in ['gsub', 'gpos']:
          print "  %s:" % (t)
          lkp = eval("fnt.%s_lookups" % (t))
          for p in lkp:
            v = fnt.getLookupInfo(p)[2]
            if v:
              print "    %s: %s" % \
                   ((v[0][0]), languages(v[0][1]))

      for f in lstfonts:
        print "-----\n%s\n-----" %(f)
        fnt=fontforge.open("%s(%s)" % (filename,f))
        disptable(fnt)
      </pre><p>Let us now come back to what can be done and what may be done.</p>
      <p>Importing into the Regular the GSUB features of the black should take a few seconds. Since the black does not contain the Greek alphabet or cyrillic characters, the features (smallcaps, proportional figures etc) would work only for the latin script; getting more than that requires more than a few minutes.</p>
      <p>Iowan Old Style is however a Bitstream font and <a href="https://www.fontshop.com/foundries/bitstream/eulas/bitstream-typefaces" rel="nofollow">Bitstream's EULA</a> says</p>
      <blockquote><p>
      No Modifications.<br>
      You may not modify, adapt, translate, reverse engineer, decompile, disassemble, or create derivative works based on the Bitstream Product without Bitstream's prior written consent.
      </p></blockquote>
