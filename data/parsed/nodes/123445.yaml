      <p>Let me be more precise: the roman .ttf font as saved by the 2011 PC version of FontForge contains 1859 glyphs; I get the same count with my Macports 2012 version of FontForge. I am far from my computer with the last version of the github  Fontforge but I would expect the same count; the Roman .ttf given by ftxsplitter contains 2229 glyphs (in fact I counted glyph names).</p>
