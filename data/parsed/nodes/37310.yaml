      <p>Peter, Popper has a whole chapter hammering 'essentialism'--the method of searching for definitions to capture essences of something. This approach is based on the Aristotelian concepts of essence and accident, and has been abandoned by modern science. Poppers argues, rightly I think, that it predictably decays into verbal disputes. So I don't want to argue about essences, which I think is fruitless. </p>
      <p>My basic point here is that type designers systematically altered hand writing in ways to please the eye. And those alterations are missing in Noordzij's account of the history, and so the account in my eyes omits one important dimension of the history of type design, a dimension not ruled by the stroke of the pen.</p>
