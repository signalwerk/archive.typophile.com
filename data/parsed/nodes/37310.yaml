      <p>&gt;Question: if Caslon was an “ad hoc kind of guy,” is the pattern of Caslon that there is no pattern? Or that the copying was indiscriminate?</p>
      <p>Caslon is mysterious. To describe his style is a kind of Rorschach test, because there is so much variation. But in spite of copying and varying, it all mysteriously comes out Caslon. </p>
      <p>It reminds of a concert I saw with the great rock guitarist Chuck Berry. That time he played a lot of guitar, and played different kinds of music, like calypso, show tunes, etc. I don't remember what the different songs were. But what was striking is that they all sounded like Chuck Berry. He has such a strong and individual style, it just stamps everything he touches.</p>
