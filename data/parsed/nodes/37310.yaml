      <p>First of all, just to be clear, I am not disparaging the accomplishments of scribes. There were over 3000 years of scribes writing alphabetic scripts and now something over 500 years of type. The scribes already did a great deal to make writing readable, including not only letter proportions, but also key matters of layout, such as amount of letter and word spacing, line measure, space between lines, and margins. And these, as Giampa points out, are also keys to readability. The scribes had already worked out much of the rules of readable text that we still follow.  </p>
      <p>However, there is a remaining area of difference of opinion I have with John and Peter, unless I have won Peter over in a discussion off-line. I think that evenness of spacing and color provides a relatively neutral framework or grid, within which the differences between letters are easily detected by the eye. When color or spacing is uneven, or there are other extraneous variations, this constitutes 'noise' that interferes with the detection of the 'signal' of letter differences. </p>
      <p>That is why I still think that good type, well set, is more readable than good writing. Good writing still has more inherent 'noise' in it than good type, because of greater variability. The dimension of readability I have in mind here is how cognitively taxing it is to read text. This aspect of readability has not yet been tested, to my knowledge, but I have several times advocated such testing here on Typophile. I think that when good writing in familiar styles easily decoded by us--eg not Fraktur for most of us--is read it will prove more taxing than good printed text. And the more florid writing, with extraneous swashes etc, the more taxing it will be. </p>
      <p>If this is a general psychological principle, we can reasonable apply it to readers in the 16th century, who didn't have greatly different DNA than we do. </p>
      <p>This is also not to say that writing is less beautiful. In the hands of a superb calligrapher, it can be more beautiful--though less serviceable for long passages of text.</p>
