      <p>As for the writing master triumphing over the traditional punchcutter, I think the splendid pen strokes in Baskerville's Q (from the <em>Virgil</em>, 1757) say it all :</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Baskerville GP Virgil det 4 b 350D - 500_4433.jpg"></div><p></p>
      <p>Caslon seems to be struggling away from old models toward something rounder and more calligraphic in his 2-lines Great Primer (the 36 pt), one of his types that is not based on a recognizable older type – but he would never have done anything like this.</p>
