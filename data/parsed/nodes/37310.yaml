      <p>Bill, I will acknowledge that Gerrit Noordzij likes to make stark, compact, unqualified, arresting, and superficially outlandish, often playful but serious-at-the-same-time statements.</p>
      <p>In the section that you quote, Noordzij also says “there is much more to say about Western Civilization,” adding “but nothing could be more precise and concise than the simple statement of the first sentence; writing is the cultural paradigm.”</p>
      <p>To get part of what this means, let’s emphasize <em>is</em> and <strong><em>the</em></strong>. Writing <em>is</em> <strong><em>the</em></strong> cultural paradigm. Isn't the core of what this says that what happens in writing — that is, to the stroke — is pre-eminantly representative of what happens in a culture? </p>
      <p>For example, isn't romanticism an intensification of the polarities existing in Neoclassicism, exactly like Bodoni represents an intensification of the contrast of Baskerville, while retaining the model it is based on?</p>
      <p>This reading is supported by Noordzij saying in the second to last sentence, “Here again the paradigm of writing offers a suitable model for social processes, the development of science included…” He says this after suggesting ‘increased articulation’ “represents the trend to formalized establishment,” and this process “provokes the informal reactions which want to be formalized again in a new establishment."</p>
      <p>Do you think Noordzij’s making the stroke of writing paradigmatic represents an intention to ask us to see it as causatively originary across each and every board?</p>
      <p>I‘ll ask if I'm allowed to post my pdf of the paper.</p>
