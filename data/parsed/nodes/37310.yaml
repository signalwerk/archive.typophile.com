      <p>Nick, the typical performance curves that come out of the labs show a steep climb followed by a wide plateau and than a gradual decline. The plateau means our "psychological apparatus" can handle variation inside a certain range. The plateau also provides inventors room to set up their heavy equipment and designers room to play.</p>
      <p>Science doesn't need to come up with the creative. All it needs to do is document this. </p>
      <p>Designers come up with the creative, contingent on how they read what the situation requires. </p>
      <p>The creative varies over time, depending on the path the designer choses within or at the edges of the ranges. Playing at the edges has intrinsic risks, and going over them like David Carson did, has it uses. But these efforts wouldn't have their force if the plateaus don't exist and there is simply a level playing field extending indefinitely in every direction.</p>
