      <p>It seems to me here you are agreeing that ideas about proportion and the previous model of roman typefaces and their readability principles, are among the prime drivers of the process leading to Baskerville. It wasn't not simply writing or even other hand lettering. That has been my main point all along. </p>
      <p>Given the evidence from Dürer, I think it is clear that these ideals existed well before the pointed pen, and were driving these efforts. Is it possible that even the adoption of pointed flexible nib was to emulate the more dramatic thick-thin contrast that already existed in engraving? </p>
      <p>I didn't know how much the neo-Classical forms had been developed before Baskerville; so thanks for explaining that and posting the examples. And thanks to James for his explanations and examples as well.</p>
