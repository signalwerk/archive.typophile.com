      <p>Bill: <em>I like this description, because I think it captures something I was trying to say above—that Caslon was a starting point, and even though there was a lot of change, you can still see the ’memory’ of it in some ways.</em></p>
      <p>It's with the notion of Caslon as 'a starting point' that I have most trouble with your position. I see Caslon's types as a kind of mid-way and perpendicular development to the thread that connects Baskerville's types so clearly to the letters derived by people like George Shelley earlier in the century. Earlier, that is, than both Baskerville <em>and</em> Caslon. What I now see in Caslon is an attempt to merge two sets of influences: the imported Dutch models that provided the specific context of typography in England, and the general context provided by neo-classicism, particularly as explored and expressed in the work of the writing masters. To visualise this, you need to put alongside your big <em>C</em> and <em>m</em> images from Caslon and Baskerville the same letters from Shelley's 'French Cannon' of 1715. Baskerville's types are, of course, much closer overall to Shelley's forms than Caslon's, but I think the comparison suggests that Caslon was trying to introduce elements of the new neo-classical letterforms into his types while still staying true to his Dutch models. Indeed, I suspect that this observation might explain many of the apparent inconsistencies in Caslon's types. Again referring back to Baskerville's comments re. Caslon, one might define the 'room for improvement' as all the remaining traces of the Dutch oldstyle in Caslon's types. That he didn't dismiss Caslon's types completely indicates that he recognised the interposed neo-classical features among the oldstyle; but he surely also recognised where those neo-classical features came from: George Shelley and the other early century writing masters.</p>
      <p>[By the way, I don't think ITC New Baskerville is a good basis for making observations about Baskerville's types.]</p>
