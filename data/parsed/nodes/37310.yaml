      <p>Hello Gerald!</p>
      <p><em>I wonder how many digital type designers draw first?</em></p>
      <p>In 2006 I saw Luc de Groot (Graphika) and Cyrus Highsmith (TypeCon) give presentations in which they showed pages from their sketchbooks -- with both an almost diary-like habit -- which included cartoons, writing, and sketches for typeface ideas.</p>
      <p>I suspect that a lot of typed designers today do rough sketches, but I wouldn't like to bet.<br>
      I also don't believe that the absence of extant rough sketches by Caslon, Baskerville et al is any proof that they didn't do them.<br>
