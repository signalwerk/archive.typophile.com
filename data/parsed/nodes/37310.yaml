      <p>I've also asked before how much of ’ease’ is conditioning, and how much affordance. So that to has to be factored in.</p>
      <p>And I've tried to say that while the results of genuinely optical-grammatically motivated adjustments sometimes have precedants in writing, this isn't ever or always the whole story. These optical-grammatically motivated adjustments might in other instances reflect other disciplines, like deliberate figure / ground gauging or form counterform experimentation as in the cases of Frutiger and Bloemsma's Legato.</p>
      <p>The computer <em>is</em> a mechanical device, but it's parametrization is algorized, which is where the math comes in. Parameterized design can't make optical-grammatical adjustments, because it can't predict where they might be needed; but these are the essence of what it takes to make glyphs ‘work’ together and well in the conditions of use they're destined for. So that's where the blood sweat and tears in type will always lie.</p>
      <p>And finally, microtypographical adjustments are not inconsequential quirks, but if they are functional, deliberate, historical and systematic, they can be described in ‘quirk-notes’ because they are particulare to the individual glyph-set or style.</p>
