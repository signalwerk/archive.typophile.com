      <p>Bill, other pressures are making it important that I back off.</p>
      <p>You say you gather that I reject your claim that good type, well set, is more readable for lengthy text than is the best handwriting. </p>
      <p>I said I have number of issues with the making of this kind of statement, and would rather make a statement of a somewhat different kind, than be forced to choose for or against such a claim. To say that good type well set is more readable than the best handwriting is in fact derogatory, because it diminishes just how well the best writing does afford sustained reading of lengthy texts for those for whom it was the norm. And derogation is not fair.</p>
      <p>I would rather try and describe affordance ranges and thresholds and plateaus for different types in different conditions of use, than make simple binary across the board judgements of more or less. </p>
      <p>I'm expressing a measure of discomfort with the adequacy of the language that has been used in typography for a long time. So I'm asking myself, in a kind of Kantian way, what kind of a statement is a judgement of readability and legibility? And I try and punder perceptual psychology and other design traditions to find some tighter terms. The risk is  distinctions that are somehow more demanding, but also maybe more servicable. </p>
      <p>The more important thing is to communicate my discomfort. Maybe that's just me making a mountain of a mole-hill. Maybe it's not widely shared. I don't know. And I'm not sure how I can take this further. I'll have to let it sit.</p>
