      <p>I would think that in England the innovations came from writing, because of the monopoly on book printing exercised by the Company of Stationers, and government restrictions on newspaper and pamphlet publishing by means of repressive taxation. Surely these restrictive practices would have created and maintained an intensely conservative type culture, which certainly seems to be the case prior to changes in the copyright law in 1774 -- opening up book publishing, and the reduction of newspaper tax in 1836.</p>
      <p>This is not to discount the influence of innovators, but such people would be few and far between, outsiders of sufficient committment and wealth to work independently, John Baskerville, for instance. And what success did he have? Outside of notoriety, precious little, except perhaps in France. Other typographic outsiders were at work in the 18th century in Scotland, where, notably, the law, in 1727(?) reduced copyright to a few years, not perpetual as in England, and book culture consequently was not so turgid as in England.</p>
      <p>The invention of lithography and its vogue in the early 19th century contributed to a loosening up of the lettering arts in general, as can be seen from the fashion for illustrations of lettering made out of rustic briars etc.</p>
