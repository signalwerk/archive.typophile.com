      <p>What Dürer and other letter-constructors were trying to do was to establish a geometric basis for the classical roman capitals. That is, they were taking something that already existed, and trying to map it to various kinds of geometries to see how well it fit and to iron out suspected non-rational inconsistencies. I think the committee and draughtmen responsible for the famous engraved Roman du Roi plates were engaged in the same kind of exercise: taking the kind of letters being written by master scribes like Nicolas Jarry -- employed in the service of the same king as the makers of the Roman du Roi --, fitting them within a grid, and imposing geometries on the construction of details. In the process, they rationalised many aspects of the construction. What is interesting, of course, and oft remarked on, is that Grandjean's actual type does not follow these engraved plates. It is, in fact, very close to Jarry's 'calligraphie'. Why? <em>Because that's the contemporary text culture.</em></p>
