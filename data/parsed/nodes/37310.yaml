      <p>Peter, I like your analysis of how the inherent consistency of type--the same 'n' etc. everywhere--causes irregularities to protrude, which might otherwise be submerged in the general variability of hand writing. And thus the producers of type, as opposed to writing, needed to deal with details even more exactly than the scribes did. The care with spacing (in justification of matrices) is probably also a consequence. </p>
      <p>The regularity of type may also may make the dimension of evenness or unevenness of color stand out. To deal with it, by the time of Garamond, anyway, we have a *contradiction* of the broad pen in systematic ways, including, as I mentioned, the thinning of 'thick' diagonals and the expansion of vertical rounds compared to stems. But it goes way beyond this, and includes the weight of terminals, the shapes of letters, their relative widths etc.  </p>
      <p>You won't see these kinds of modification of vertical arches or thinner diagonals on the Trajan Column, or in hand writing with the broad pen, so far as I know. How you want to label this designing for the eye--'essential' to type 'genotypical' or whatever--doesn't matter. I do know that it is type-specific, systematic, and not derived from the broad pen. For type design, it is an equally or perhaps even more important part of the story as the that story of original basis of the letters in pen-drawn shapes, a story that Noordzij has shined new light on.</p>
