      <p>This "which came first?" argument is so chicken/egg.</p>
      <p>Different forms of letter are easier to execute in different media.<br>
      Sure, writing masters and engravers could do stiff, discrete, regular lettering that looked like type, and dress it up with fine details that typographers had difficulty matching. But it was a laborious and awkward process to make it look slick.</p>
      <p>And sure, type founders could incorporate the graceful finesse of lettering and engraving into their work, and add a cool mechanical gloss (Baskerville's innovations with paper and ink technology certainly helped) that calligraphers had difficulty matching, but it was a laborious and awkward process to make it look slick.</p>
      <p>Each medium provided a challenge and a stimulus to the virtuosos of the other, and it was only natural that those accomplished at both should, at the conceptual level of design, elide distinctions—if they wanted to; it seems a bit derogatory to assume that those excellent artisans and creative geniuses weren't aware of and actively engaged with the issues involving the various media of their day, and only worked intuitively in a state of subject technological determinism.</p>
