      <p>Bill: <em>And in addition to not following rules of any real broad pen of fixed width, many strokes also violate the rule of sticking to translation. The bottom of the stems in Garamond often widen out symmetrically before reaching the bracketing of the serif; that broadening is an expansion, violating the fixed width of a pen.</em></p>
      <p>No, that's not expansion, that's the typical pattern of writing formal roman letters with a broad nib (or a brush for that matter: you see the same thing in the Trajan letter). What it indicates is a double stroke: the pen comes down and then out towards one serif, then is lifted and placed back on the stem and brought down and out towards the other serif. In the process, it is typical for the stem to flare, since the transition to the serif is not sharp. Pretty much any calligraphy text book will illustrate this.</p>
      <p>Not only is this flaring not indicative of expansion, with an expansion tool you typically get a much more abrupt transition to the serif, because you are releasing pressure at the bottom of the stem. Hence the flat serifs in most Didot and Bodoni revivals.</p>
      <p><em>I have said I like [Peter's] ideas that irregularities that pass in handwriting will become problematic in type.</em></p>
      <p>Yes, I like this too, and it makes a lot of sense: writing is a more forgiving medium precisely because it is inconsistent so 'mistakes' are not repeated every time a letter is made. When you 'write with prefabricated letters' to use Noordzij's phrase, you want them to be at their best.</p>
      <p>Your point about adjustments in larger sizes of type is well made, but I think we find a similar approach to 'optical correction' in larger sizes of drawn letters too, e.g. in mediaeval versal letters. Writing is very size specific in that most styles are based on a relationship of letter proportion to the size of the writing implement. [This is explicit in the teaching of the traditional Arabic styles: everything is related to the width of the reed nib.] So we can expect that there will be more adjustment of letterforms based on writing styles such as the Italian humanist book hand at sizes below and above those normally written in that style by the scribe. And I think this is observable: at smaller sizes, adjustments are made to improve legibility of text, and at larger sizes adjustments are made to improve the balance or beauty of individual letters, such as those seen in Garamond's gros canon. The closer you are to the typical size of the written style, the less important either kind of adjustment is going to be, because the writing was tailored to that size to begin with.</p>
