      <p>John Hudson wrote<br>
      <cite>"There are no exceptions to laws, in the nicely precise sense that Noordzij uses the term, there are only exceptions to rules. Something that disproves a law — i.e. the circumstance that renders a law false —, is not an exception, it is the basis on which you reformulate the law so that it is no longer false."</cite><br>
      which hits the mark. Noordzij's notion of Law is very close to the Peirceian notion of law/thirdness. (Also: Dewey, Fleck, Popper, &amp; al.) Very nice.</p>
      <p>As to dogmatism:<br>
      I think in the bigger picture, it of no relevance whether an author is dogmatic (Tschichold) or self-critical and open for discussion (Noordzij). Both may, or may not, provoke discussion nevertheless. If Tschichold does not criticise himself, others will do it for him.<br>
      Science / scientific attitude is more than questioning one's own beliefs. So it is not required that an author be self-critical, or not be a dogmatist. It seems that in science, quite many participants are rather dogmatic. What makes this business "democratic" is that there are many many of them, who try to support their own points of view and falsify the other ones'. This ensures criticism or reflexion on the level of community rather than of the individual.<br>
      It would have been interesting to compare Tschichold and Renner in this respect, the former representing Rules, the latter Laws. And, what does it mean that Tschichold is popular to day while Renner's writings on typography were almost forgotten, "rediscovered" only in recent years? Which turns attention toward ...</p>
      <p>"The role of the reader"<br>
      The "problem" possibly is not authors but readers/followers. <cite>Even if</cite> Tschichold himself was a typographic dictator, one may still read him with a smile and ask for his motivation, for the paths which led him to his conclusions or beliefs in this or that. (At least that's how I read any text.) Amusingly, Mr Noordzij who, in my reading, keeps an ironic distance to his own writings seems to have followers who read him the dogmatic way. Maybe not so much as regards the theories but more in terms of "applied interpretation" -- I think of the existence of so many "The Hague style" typefaces, from within the school and outside. Sometimes it is hard to figure out whether this or that typeface is the result of "dialog" with (or re-interpretation of) the The Hague understanding of type design, or a mere imitation of the tangible results of this understanding.&nbsp;&nbsp;;-)</p>
