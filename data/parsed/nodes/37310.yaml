      <p>[Bill] “[…] cutting their punches to conform to models that were in their heads […].</p>
      <p>When you adjust the contrast or the weight of storkes in the letters you design, do you do it because of a model in your head or because something is wrong in optical-grammatical terms and / or “gestural-atmospheric force” terms? I believe Jenson and Griffo’s innovations were the result of the characteristic featural play or exploration afforded by cutting punches. The ‘end’ of this is not evident at the start. The formalized result of exploration articulates a model only after play has resulted in something worth keeping.</p>
      <p>To answer my own first question on this thread, perhaps when the changes are the result of the <em>characteristic</em> featural play or exploration <em>afforded by cutting punches</em>, writing becomes more typographic. But what keeps writing writing is writing.</p>
