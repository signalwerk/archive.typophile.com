      <p>I think this and the other things you write are right Bill. A Noordzijian analytic of type design helps you see what is paraphrase and what escape, and helps you gauge the direction of the escape, and through that how it is paradigmatic of the culture it reflects.</p>
      <p>Yet, other analytics of type design exist and have value. And where Noordzij’s stops they might take over. Or it can work the other way. I’ve always liked the one implicit in Douglas Hofstadter's response to Donald Knuth's concept of a Metafont (Visible Language, Volume XVI #4 (Autumn 1982). Others might like others.</p>
