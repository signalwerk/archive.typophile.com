      <p>Bill: <em>The movement away from what is natural in writing starts even with scribes. When people write naturally, they write in more cursive, flowing styles, with slant. Scribes were producing text for reading, and made hands that are more unnatural to write—being more upright for example—but easier to read.</em></p>
      <p>Natural? You seem to assume that writing that is cursive, attached, with slant is somehow more 'natural' than writing that is formal, unconnected and upright. This has nothing to do with one form being more 'natural' than the other: it is simply a question of speed. Almost all mature manuscript text cultures produce two main styles of lettering: a formal book hand that is written slowly, often employing a greater number of strokes to form each letter, and a faster cursive hand in which the pen is lifted less often; slant and horizontal compression are results of increased speed. To my knowledge, the more slowly written formal book hand <em>always</em> precedes the cursive hand chronologically. If you study palaeography, this is one of the first things you notice, and you see it repeated again and again in different cultures and scripts. Speed, far from being more natural, only comes with experience.</p>
      <p><em>In the case of Baskerville, we see a strong tendency to more simple geometrical shapes. He is not just increasing contrast, but having more circular arches in the mn, for example. That these are more circular reflects the neo-Classical arch—as Bringhurst notes—and not only writing influences.</em></p>
      <p>But the round arch and the more circular forms of e.g. Shelley's capitals are part of the same neo-classical moment. There is a whole intellectual and artistic culture converging in ideas about classical proportion and beauty, and this is shaping the particular text culture and creating the need for neo-classical types. What is interesting is that this need is first met by the writing masters, who are essentially 'writing typefaces' up to four decades before Baskerville is having them cut in metal. Why are they doing this? Because the typeface for the emerging text culture does not exist yet, so they have to write it.</p>
      <p>I don't think there can, in fact, be any question that Baskerville's inspiration was the kind of formal letter being written by his fellow writing masters. Indeed, these letters are basically the spec for his types. The interesting question is not whether Baskerville looked to Caslon, but what typefaces someone like George Shelley was looking at, since Caslon had not made his types when Shelley was writing the shapes that Baskerville would translate into metal. One can assume that Shelley and other writing masters were familiar with the imported types that inspired Caslon, but it seems to me that they're not so much responding to specific typefaces as they are to an idea of typographical letterforms -- formal, regular, adaptable to a range of sizes -- and then creating what they think the neo-classical form of those letters should look like. I don't think it would have made much difference to the result if they had looked at Griffo's types, Garamond's or de Walpergen's, because the same basic qualities of 'typeness' can be derived from any of them: what matters is how to embody those qualities in letters that reflect the neo-classical text culture. This is what George Shelley does as early as 1709, and by the time John Handy cuts Baskerville's types at mid-century, the style has become part of the standard repertoire of the English scribe.</p>
      <p><em>It may well reflect also a search from before the time of Dürer for ’ideal’ shapes and proportions. Since Baskerville says specifically that his goal is “true proportions”—a phrase reminiscent of Dürer’s “just shaping of letters”—I also think it likely that his shapes are influenced by this concept of a certain ideal, not derived from writing, but to which writing can aspire, and type more successfully achieve.</em></p>
      <p>Again, this is part-and-parcel of the neo-classical moment.</p>
