      <p>Firstly hello Nick.</p>
      <p>Nick: “The only time I have recently put pen to paper for a type design was to write the “script” version of Panoptica.</p>
      <p>Nonetheless, I have produced 5” high pen and ink finished art for types, in the 1980s."</p>
      <p>That comment is interesting. I would bet Jim Rimmer still draws his type face first. You don’t want to bet do you? So there seems to be an agreement that there are "several approaches to the same problem". The results one would expect to be influenced by the methods used. My rule is to work in methods that give comfort. I think we all try to do that. I wonder how many digital type designers draw first?</p>
      <p>Nick: "I surmise that Caslon et al would have had an idea of what they wanted to do, made that idea a reality in metal, and checked it out in a “smoke” proof. Does that seem reasonable?”</p>
      <p>That is what the Caslon Foundery expressed.</p>
      <p>Also “Smoke proofs were instant and clean”. Smoke proofs were an established function of the punch cutting industry by the time Caslon began his work. Even the Lanston Monotype Machine Company of Philadelphia used smoke proofs in the initial punch cutting process.</p>
