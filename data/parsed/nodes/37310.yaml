      <p>Bill: <em>It seems to me here you are agreeing that ideas about proportion and the previous model of roman typefaces and their readability principles, are among the prime drivers of the process leading to Baskerville. It wasn’t not simply writing or even other hand lettering. That has been my main point all along.</em></p>
      <p>But it was the translation of those ideas into <em>written</em> forms that provides the very obvious model for Baskerville's types. That is 'the process leading to Baskerville'. And that translation involves devising ways to create formal roman letters with the primary writing tool of the day such as will harmonise with the other script styles in contemporary use. That it took the better part of half a century for those letters to find their way in to type is testimony to the relative conservatism of the printing and typography trades. You can make a case that Caslon was also exploring these ideas of neo-classical proportion, but it seems to me very difficult to separate out such a notion from the basic inheritance of his Dutch models and from the many inconsistencies of his types. Writing masters like Shelley did a much more convincing job of giving form to these ideas, and that surely consistutes the 'room for improvement' that Baskerville saw.</p>
      <p>And I'm not agreeing about 'readability principles' because I'm not convinced that there is a significant difference in readability between type and a carefully written formal book hand -- including those many models of formal book hand in various scripts that were not adapted to typography -- that is ascribable to anything other than regularity. The adaptations and modifications found in typographic letterforms are explainable relative to scale and the physics of impression. It is easier to make small text with type than with a pen, and hence more economical in material terms (it uses less paper), and these letters benefit from modications to proportions and details that make them legible at these small sizes. So you can say that small type is easier to read than an equivalent size of written text, but can you say the same thing about type that is the same size as typical manuscript text? There doesn't seem to be evidence that small text is easier to read than larger text. Baskerville's text, of course, tends to be quite large and I'd much rather read his Milton than any number of typical modern editions.</p>
      <p>Between Dürer and neo-classicism is the wide expanse of the mannerist, baroque and rococo periods. The obsession with proportion in the neo-classical movement was not a direct continuation of the renaissance investigations of people like Dürer, but a starting again.</p>
