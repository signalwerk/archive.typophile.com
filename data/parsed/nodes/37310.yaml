      <p>I don't have time to respond to Gerald's interesting comments right now, nor to Peter and Bill's latest posts. But here are some more images that I 'had in the oven'.</p>
      <p>First, here is an example of 'written type' from George Shelleys <em>Natural Writing in all the Hands, with Variety of Ornament</em> of 1709. The titles of these writing manuals, which were really forms of advertising for the services or tuition of the writing master, often give a good indication of how the writers thought of what they produced. Given Bill's comment above about 'natural' writing, Shelley's title is particularly apposite. He is demonstrating his facility with 'all the hands', and clearly he counts the formal, pseudo-typographic letters to be among the contemporary hands that are expected to be written 'naturally' by a man of his profession.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Shelley1709a_4739.jpg"></div><p></p>
      <p>And here is a detail. It is worth relating his back to Shelley's 'French Cannon' (approx. 48pt) as illustrated by James earlier in this thread, about which it was suggested, reasonably, that these were 'built up' or drawn letters, rather than written. In this image you see the same forms as written, at about 15pt I think (I've lost my point rule).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Shelley1709b_4107.jpg"></div><p></p>
