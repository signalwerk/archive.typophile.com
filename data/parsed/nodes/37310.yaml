      <p>Bill, the two-stroke serif formation I described is typical of writing formal capitals with a broad tool. It is the method Catich describes for the classical roman capitals painted with a brush. It is what every calligraphy text book teaches for creating this kind of serif. As you observe, the serif in the typical humanist miniscule hand is different, and that type makers adopted the symetrical serif of the roman capitals as their model. Which, as you imply, is significant. But my basic point remains: the swelling of the stem in this construction is not indicative of an expansion stroke, as you suggested, but is the normal characteristic of this kind of serif as produced with a translation tool.</p>
      <p>The distinction between written and 'built-up' letters tends to get blurred in the most formal styles of any script. The nature of formal, as distinct from cursive, writing involves the pen leaving the paper more often, and sometimes addition of non-fundamental strokes to complete a particular shape associated with the style. In some classical Arabic styles, for instance, certain shapes are augmented with the corner of the pen and then filled; this despite the fact that the overall appearance looks very fluid and Arabic writing is frequently referred to as 'cursive' on account of its connectivity. Writing is a very varied and complex phenomenon, and it is a mistake to associate it only with the characteristics of e.g. modern handwriting.</p>
      <p>Peter: <em>I think what John might be highlighting, Bill, is that not only does the pen provide the foundational contrast template, but it also can provide a partial grammer of the kinds of modifications or adjustments that might be introduced.</em></p>
      <p>Yes, thank you, that expresses it very well.</p>
