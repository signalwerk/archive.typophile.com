      <p>John, if you allow built-up letters, then any shape can be done by the broad pen.</p>
      <p>Theoretically, the humanist script could have been written the way you say, lifting the pen for the bottom right serif, and starting a new stroke from above in the stem. But it doesn't seem to have been done this way in reality. Instead, the pen is moved to the left for a shorter left serif, and then moved directly across to the right in a straight line, for a longer right serif. </p>
      <p>This is way of making serifs is reflected in the humanist script you posted on 23 September, and every one I've seen, though I've only seen samples here and there. I did see an actual page of Alcuin's magnificent Carolingian Miniscule recently at an exhibition at the Smithsonian here, and it was done this way. </p>
      <p>This asymmetrical shape of humanist writing is shown schematically on p. 97 of Gerrit Noordzij's Letterletter. He notes the difference between the way the humanist script was written and the more symmetric serifs of early type. Noordzij refers to Jenson's Roman as having the symmetrical serifs, which I think is a mistake--it's Griffo who introduced the symmetry. If you want to see a clear digital example of following the broad pen way of doing serifs, see Trinite, at TEFF.nl </p>
      <p>Griffo's symmetrical serifs in my view are typographic rather than chirographic--following what the eye wants, not the convenience of the hand. The tapering that Garamond does is also, I would think, not the way the hand would do it with a broad pen, even if the letter were stroked this way. His tapers start relatively far up the stem, not near the bottom. To my eyes they are carefully designed for even color, and for aesthetic reasons. The branch joining the n, h, etc adds weight, and the stems are thinner there. The slight additional weight on the lower stem evens out the look. </p>
      <p>If Garamond were already influenced by a more flexible pen, you would have an argument for his shapes being influenced by writing. But with the broad pen and humanist scripts, I don't think the argument is cogent. </p>
      <p>Noordzij notes that symmetrical serifs are not chirographic, and attempts to account for this. He says that "Jenson could have copied this [assymetrical lozenge] shape faithfully in his punches, but the extra work would not have paid. ...rectangular footings are much more easily cut than lozenges." This argument doesn't hold water, because in fact Jenson did serifs that more resemble humanist writing, and then Griffo moved further away.  </p>
      <p>He goes on to note other differences of type from writing but argues to minimize or dismiss them. John, you, being more holy than Pope Gerrit, even deny the differences. But that denial doesn't stand up to the reality of the record, I think. The influences were not simply the hand, but also the eye and ideals of aesthetics and ease of reading. </p>
      <p>Noordzij is keen to controvert "the time when everybody was eager to hear stories about a typography which could be independent of handwriting." He is right of course about the strong influence of the pen, and his important contributions have established that. But to say that other considerations are not key parts of the story is to go to the other extreme. That is understandable in a pioneering and corrective effort, but also wrong. In my view there is a dialectic between the hand and the eye in the development of type, and the eye often leads, and sometimes contradicts what the hand would write.</p>
