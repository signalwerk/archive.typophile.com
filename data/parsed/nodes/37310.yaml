      <p>Peter: <em>So to me this says the greater feature-manipulational flexibility in punchcutting, could initiate a consolidation of the readability affordances of writing beyond writing...</em></p>
      <p>This is better stated and doubtless more accurate than my attempt to get at this idea by looking at feature manipulation as an extension of the stroke logic inherited from writing. I like this idea of consolidation of a process that is already taking place in writing. It fits well with examples from a number of different scripts, in which one sees formal styles of writing develop that begin, sometimes in individual features or letters, to break with 'the single track of a tool'. [It is because of such instances that I don't fully agree with a definition of writing that completely rules out occasional stroke repetition, build up or outline.]</p>
      <p>...<em>though not without a cost. The cost is growing distance from the readability and character of first-rate scribal writing, especially when you factor in the unfamiliarity of the foreign or earlier mother tongue.</em></p>
      <p>This is an observable cost, and it also has parallels within typography as in e.g. the loss of ability of many people to read fraktur with any ease or comfort. I wrote earlier in this discussion that we could not say whether e.g. Griffo's types were significantly more readable than the scribal book hand <em>for people who were used to reading that hand,</em> i.e. the contemporary audience for both kinds of books. Type could make consistently readable text at smaller sizes, and hence had an economical advantage, but at equivalent sizes I'm not convinced that there was any significant gain in readability. The 'consolidation of the readability affordances' were expressed in a reduction in the size of text. I wonder if any records survive indicating a rise in the number of lense grinders working in Venice at the same time?</p>
