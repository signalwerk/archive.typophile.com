      <p>John, I am aware of the method of drawing capitals that you have illustrated. And indeed I referred to it above in answering you. </p>
      <p>But also I wrote that that is <em>not</em> what is going on in the Garamond lower case letters I posted. The difference is subtle, but crucial, and indeed illustrates the main point that I have been arguing. </p>
      <p>Catich’s illustration shows how to draw capitals with an extra stroke for one side of a fairly symmetrical serif. Catich I believe says that these were painted with a brush, and I think it is a stretch it to say that the style of monumental capitals on the Trajan column and other stone carving is a copy of handwriting. But that is not essential to my argument. </p>
      <p>What is essential is that your illustration shows exactly what I said is the difference between Garamond and this way of writing or painting a capital. The Catich illustration has a *straight* stem, with an added flair at the bottom.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Garamond Gros Canon n_4217.gif"></div> <p></p>
      <p>The Garamond letters above do not have straight stems. As the attached ‘n’ from Garamond’s Gros Cannon shows, the stems swell gradually beginning just below the join of the branch. This swelling is an <em>expansion</em> of the shape as it descends below the join. You could get such expansion by deliberate building but you will not get it simply by a stroke of the broad pen to add a serif at the bottom of the letter. Just to blend the serif into the stroke smoothly you do not need to go that high on the stem, and then sharply change the curvature of the stroke as you go down. And as you conceded, the humanist script lower case in any case was not written with such two stroke serifs at the bottom. </p>
      <p>The difference between handwriting and built up letters is crucial here. I am pointing out that that Garamond is doing built-up lettering or, more precisely, sculpted letters--and these consciously and systematically depart from the stroke of the pen when writing letters by hand. </p>
      <p>Just to be clear about the difference, Noordzij writes very emphatically that built-up letter shapes not do not count as handwriting (p. 9 of  <em>The Stroke</em>):</p>
      <p>“The first, initial, fundamental shape is the single track of a tool. Only handwriting preserves the characteristics of the single stroke. <em>Handwriting</em> is single-stroke writing. <em>Lettering</em> is writing with built-up shapes. In lettering the shapes are more patient than in handwriting, as they accept retouching strokes that may gradually improve (or impair) the quality of the shapes. Lettering is independent of the tool, but this freedom is only available at the expense of character: in writing composed of overlapping strokes the shapes of single strokes get lost...”</p>
      <p>I have been arguing all along that type deliberately and systematically departs from handwriting, even though it is strongly influenced by it. It departs to serve both aesthetics and readability. And there are traditions in which the departures of earlier type designers influence later type designers. </p>
      <p>Here in Garamond’s lower case we have one such departure and tradition. I do not see this ‘waisted’ stroke in the humanist writing you posted, or other humanist writing. I do see it in Garamond, and then in later type designs, such as those of Caslon, two centuries later. And that is because there are type traditions, traditions that contradict the natural stroke of the pen. Fred Smeijers, author of <em>Counter Punch</em>, Smeijers sees punch-cutting as an essential influence on typeface design. And not co-incidentally, he uses the punch-cutter’s sculptured stem waist in some of his types. </p>
      <p>Punch-cutting is the sculpting of letters, not writing. And that difference, as Noordzij notes, gives a freedom that the pen lacks, for good or ill. The putting of ‘waists’ into lower case characters, I believe for reasons of even color as well as aesthetics, is one example of how punch-cutters took advantage of that freedom to create shapes that contradicted the written line of the broad pen of fixed width.  </p>
      <p>Punch-cutting, and not only writing, is an important influence on design. Here I think Harry Carter and Fred Smeijers have good points to make.  </p>
      <p>Now I recognize that there is some ambiguity here. At what point do overlapped strokes, which occur naturally in writing, become built-up shapes? I would submit that when you systematically alter a shape that was never drawn that way for lower case letters, and differently even what would be done for Caps, and in a way not called for by smooth shapes, then you are building letters, not writing. It is just Noordzij’s deep analysis of handwriting that has helped me to see what is not handwriting, but sculpture. </p>
      <p>Type wasn’t written, it was punch cut, and that is a key fact that changed type design. It didn’t remove the powerful influence of the pen, but it did enable other influences to be expressed and other goals to be served, in ways that were not only different, but sometimes even contradicted the stroke of the broad pen.</p>
