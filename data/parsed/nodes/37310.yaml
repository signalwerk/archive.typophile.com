      <p>Peter, there are two kinds of rotation:</p>
      <p>Rotation between strokes, in which the angle of the hand is changed while the pen is lifted from the page.</p>
      <p>Rotation within strokes, in which the angle of the hand is changed while the pen is moving in contact with the page.</p>
      <p>One finds the first kind of rotation in all kinds of scripts, styles and periods, and this is what produces letters with variable axes. It is, for example, an essential component of the Byzantine cursive Greek miniscule, which always displays some variation in ductus.</p>
      <p>Rotation within stroke is much less common, but this is the characteristic of mannerist writing with a broad nib that Noordzij has analysed so well in the work of Jan van den Velde. It is a virtuoso method: very difficult to learn but stunning when done well. So far as I can tell, it was not applied to 'roman' letterforms, though, and it's influence in type, beyond civilité, seems minimal and limited to some features in italics.</p>
      <p>The kind of rotation you point to in Bringhurst's illustration is the first kind: rotation between strokes creating letters with varying ductus. But the ductus within the individual letters does not vary significantly. I suppose the implied slight rotation in the exit stroke of the e in some styles might be significant, but it could just as easily be a paratypographic feature of 'type design'.</p>
