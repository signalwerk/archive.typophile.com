      <p>Bill, I don't see why my or Gerrit Noordzij’s saying thst the contrast native to the flexible-nibbed pointed pen set the pattern and was responsible for fundamental change, should be taken as suggesting the pen is driving everything, or that the type designer is a prisoner of the history of the pen or that nothing else matters.</p>
      <p>Ultimately we don't know what drove the change besides an understanding of the logic and a proliferation of things that expressed this logic, either artificially or by the choice of tool. All we know for sure is that fundamental — epochal — change happened and in what direction. And that it became a basis for more dramatic modulation in the direction of the change, some if it pushing toward a stall- or breaking-point. And that there is a kind of fit with other elements inside the culture whose character it co-defined amd whose strictures ultimately became oppressive. And that there is a fit between how far intensification of contrast was pushed, and what it became possible to hold in print.</p>
