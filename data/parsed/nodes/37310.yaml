      <p>Bill, if reading affordance is a plateau with thresholds and ranges and heights, I might even become compelled to concede that not only ranges and thresholds but also heights are susceptible to adjustment beyond writing.</p>
      <p>But I'll only accept ranking comparisons if they acknowledge: 1) that over time, type has probably re-tuned our internal maps so that we've become separated from the readability of writing to a degree; 2) (if they acknowledge) that through the broad-nibbed pen applied to a carolinian separated script, western writing had, by the time type arrived, carved out for its script a criterion-level or benchmark-level affordances plateau; 3) (if they acknowledge) that readability, or affordance in reading, is not a simple equation but a densely multifacted, delicately balanced thing. </p>
      <p>The delicate balance thing is shown by the fact that removing noise in the optical-grammatical part of the equation might depress character in the gestural-atmospheric part of the equation. It might even be the case that some noise is necessary for the eyes to become and stay locked-on in visual terms to text, or for visual wordform resolution to stay robust, even though noise has a computational cost. Beyond a certain point, transparency might be a counter-productive chimera.</p>
