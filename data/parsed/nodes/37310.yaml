      <p>William: "Also, just to be clear, I am not saying that all decisions that historical creators of type made were based on readability. What I am saying is that some of them have been, and those concerning even color and good rhythm resulted in type being more readable than handwriting.</p>
      <p>And that is not because type creators they were any better workmen or artists than the scribes. It is because the medium offered greater control over outlines, and in a more limited way, spacing. And some superb type creators, such as Garamond, were able to take advantage of this greater control."</p>
      <p>As we all know, control over outlines does not always result in superior outlines. Look at the state of type design today.</p>
      <p>Many think that type well set is of minor importance compared to type design in the determination of readability. I care to differ. I could take Garamond and make it very difficult to read even at 12 point printed crisply. No, I do not mean by removing anyone's reading glasses.</p>
      <p>Also, some pain from "unreadable type faces", such as Bodoni, can be eased by careful setting.</p>
      <p>Quickly handwriting became more of a "hangover and not so much a model for type design".</p>
      <p>Tools do affect outlines, not to mention right handed people have dominated left handed. Counter punches compared to gravures, the two schools of thought? Now the cold mechanical feeling of digital type. This could be a lengthy discussion but I am going to spare us all.</p>
      <p>The church found Gutenberg's Bible of minor importance compared to the lavish financial profits from the indulgences he printed. The business of printing dictated many different objectives. As I mentioned much earlier, Aldus Manutius invented the pocket book. There was great interest in making types readable in smaller sizes. This saved not only paper but allowed for more pages in the chase thus reducing press time.</p>
      <p>Is handwriting more readable/legible, or even possible at six point than type? I think not! I predict, if it is possible to handwrite that small, (avoiding an embarrassing surprise) it must be hard to read at all. Besides I don't think they made a goose feather small enough. For the record, I believe the smallest hand set type ever made was 2 1/2 point, probably commissioned by an unscrupulous lawyer.</p>
      <p>You may have noticed in an eye examination letters are used. Well, they aren't in Finland. Still, keep in mind the conspiracy between French eye glass manufactures and printers. They both had much to gain by smaller type sizes. Not to mention, the consumer was advantaged financially. Well, they all were.</p>
