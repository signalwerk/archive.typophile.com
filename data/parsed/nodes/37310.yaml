      <p>Bill, as Peter says, no one is claiming that the pen, per se, drives everything. But in the area of text creation, within cultures in which large amounts of documents were being written rather than typeset, writing tended to set the aesthetic agenda for text because it has the advantages of speed and economy, i.e. writing could respond to and express changes in fashion and cultural tastes more quickly than typography. I think James' point about the importance of manuscript document production to the imperial project of 18th Century England creating a situation in which the writing masters could directly influence the direction of the typographic culture is well made. [How's that for an unpunctuated sentence!]</p>
      <p>It is quite typical for aesthetic movements to become increasingly virtuoso and extreme in their expressions, eventually prompting reaction and either revolutionary developments or revivals of previous aesthetic. Both revolution and revival happened in response to the decline of neo-classicism into the hackneyed art of the academy and the decreasing quality of industrial production. In painting, for example, the reaction was largely revolutionary -- impressionism, pos-impressionism, cubism --, excepting the Preraphaelites (who were, of course, associated with William Morris); in the text culture the reaction was revivalist and, as you note yourself, it involved equivalent revivals in both writing and typography, as both returned to renaissance models.</p>
      <p>The Caslon revival of the mid-19th Century is a kind of odd blip: a sign of dissatisfaction with what was happening in the increasingly high-contrast types, but not a wholesale programme of reform of the text culture as undertaken at the end of the century by Johnston, Morris, Cobden Sanderson, et al (which also, of course, had equivalents in other countries around the same time, indicating a much broader cultural shift than printing some books in Caslon). Much Victorian typography continued to be bad after 1844, and the so-called Caslon revival doesn't seem to me to have been particularly broad. I recently read a novel published in the 1870s with two narrow columns of justified 9pt scotch roman on each page.</p>
      <p>Speaking of the Caslon revival, which was begun by Charles Whittingham's Chiswick Press, you should try to find something printed in Caslon by the Chiswick Press from the first few years of the 20th century. The type is a large Caslon heavily overinked and sunk deeply into thick rag paper in emulation of the new styles made popular by the Kelmscott and Ashendene presses.</p>
      <p>By the way, yes you can cut the shape of a pointed split nib in a feather quill, but it won't last very long. The fibres of the feather are nicely flexible, but they don't rebound well and the finer they are cut the weaker they become: the two sides of the split will splay and the pen will be useless. Steel provides the ideal combination of flexibility, strength and durability.</p>
