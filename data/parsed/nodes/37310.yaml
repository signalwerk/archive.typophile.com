      <p>John: <em>Rotation within stroke is much less common, </em></p>
      <p>But very common for finishing strokes. If you wish to create a terminal at a different angle to the angle of stress, you must rotate as you finish the stroke.<br>
      With a broad pen, if you incorporate removing one side of the pen before the other into the motion, you can create a perpendicular serif. But that is easier than rotating while holding the nib flat to the paper, because the rotation serves to lift one side of the nib off the paper. Dragging the dry corner of the nib, the build up of ink behind the nib is eased and tails off as it clings after the diminishing area of contact.</p>
      <p>So that is how the top serif in this letter is formed, as the pen moves from right to left, rotates counter-clockwise, and the right side of the nib lifts off the paper, while the left corner eventually drags down vertically.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/C_5429.jpg"></div><p></p>
