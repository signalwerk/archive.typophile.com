      <p>There is no “process leading to Baskerville”. Baskerville, like anyone else, is an intersection or meeting place of many things. When I did my work on Henk Krijger’s Raffia Initials, I needed seven ‘referential frames' to say what needed saying about them. Some of them related to construction, some to curve structure, some to contrast, some to organic form.</p>
      <p>Some of the things that Baskerville is a meeting place for are:<br>
      1) awareness of the contrast type native to writing with the flexible-nibbed pointed pen;<br>
      2) awareness of how the contrast type native to the broad-nibbed pen was formalized in the  first roman types<br>
      3) awareness of what was done with traditional contrast by the mannersists and proto-baroque;<br>
      4) a preference for 'classical'  or ‘just’ proportions.</p>
      <p>But the point is, or so it seems to me, that the foundational ‘norm-violation” of the baskerville, fournier, didot and bodoni types is the reliance of their contrast styling on a new and fundamentally different contrast scheme. That contrast scheme is characterized by expansion, and it is native to writing with the flexible-nibbed pointed pen, whatever the actual historical details of it's transition or fine tuning in roman letters.  And the contrast is in a way, written over the older contrast type. (Foundational, in this context means: what makes these types genotypically distinct. These types were ‘strong departures’ from what came before.)</p>
      <p>Also, how Baskerville came to his application of the contrast scheme (that he came to know from the inside out, through writing) to the latin roman, might have been mediated by engravings in the model books (which might also have a complicated relation to actual writing).</p>
      <p>I don't think Noordzij’s bald statement is intended to obliterate these complexities.</p>
      <p>And, finally, I wonder if you mean to suggest that Baskerville worked from ‘readability principles,‘ that is, from a set of tacit rules (in the Noordzijian sense)?</p>
