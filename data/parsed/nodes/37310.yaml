      <p>The analogy to the picture does help. The idea he explains there is that the picture of his father is more representative than his interests and books. </p>
      <p>That clarifies in what sense Noordzij thing that "writing is the cultural paradigm." It is a representative, and reveals essential characteristics of a culture--rather than creating them. </p>
      <p>That may be true, but I still have a problem with writing being "the" cultural paradigm. Confucius said something like: "Show me the dance and music of a culture, and I will tell you its character."  And he was right. </p>
      <p>The larger point is that the current cultural products of a society at any given time to a remarkable extent share the same 'DNA'. In the visual arts, for example, you see a resonance between architecture and letters. </p>
      <p>It is true that some cultural products are most characteristic of a culture at a given time. In this respect, if you wanted to have a graphic representative of Europe in 1500, I think it would not be scribal hand writing, but a printed page of Aldus. And the departures of type from hand writing would be a small but not insignificant part of that paradigm.</p>
