      <p>There have been brushes in use for thousands of years, notably in China. Varied pressure and speed of movement causes thick and this lines. Also, the Trajan column letters and other Roman inscriptions were layed out using brush lettering long before the 17th century.  The broadnib pen you speak of was the slotted version. Reed pens were in use in ancient Greece. They were not as efficient t holding ink though so you got dry spots at the end of strokes.</p>
