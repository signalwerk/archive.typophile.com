      <p>Nick: <em>When I was teaching, I tried to avoid the kind of creative antagonism where the teacher says “this is how it’s done”, preferring the approach of “there are many ways to do this, let’s find what works for you”.</em></p>
      <p>Sheesh. Did you actually read the Noordzij article, Nick? He doesn't walk into a classroom and say 'This is how it's done', and his criticism of Tschichold is that the latter did indeed take that approach. Noordzij walks in and says 'Here is a law, is it true?'</p>
      <p>If I were a student whose teacher walked in and said 'There are many ways to do this, let’s find what works for you', I would walk out. I can find out for myself what works for me.</p>
