      <p><em>I’m pretty sure that Baskerville’s design process consisted of sitting down and writing the style of letters that he wanted, and John Handy translated the written forms into type.</em></p>
      <p>Surely his roman capitals are too carefully constructed for that.<br>
      He must have drawn, constructing them in the manner of the large letters in the George Shelley specimen.<br>
      After all, he started out doing gravestones, and would have drawn those outlines before he started chiselling.<br>
      He was a precocious letterer and no doubt a multiple threat, like many a talented letter designer.<br>
      As a writing master early in his career, I suspect he would have used a fine nib to draw large exemplary letters, filling in the thick strokes.<br>
      Look at the line weight of the flourishes in the Shelley specimen -- would not Shelley have used the same pen to outline the large letters?</p>
      <p>Was Baskerville also an artist/illustrator? Did he design the images for his Japanning business? It's a very graphic medium.<br>
      I recall reading that he also had flash livery on his coach, which one would assume he also designed.<br>
      Why would he limit himself to writing the models for Handy, and not sketch?</p>
      <p><em>we also don’t see them creating types based on other potential models when these are not provided by the writing masters</em></p>
      <p>Would they have been familiar with the geometrically constructed forms of the Roman du Roi?</p>
