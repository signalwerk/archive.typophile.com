      <p>That's fascinating. Conjectural laws, rather than authoritarian rules--very nice.</p>
      <p>In the related interview with Noordzij that is linked, he says,</p>
      <p>"When he gave a lecture, Tschichold - the old Tschichold, as well as the new Tschichold - always said on the invitation card: 'no discussion afterwards'."  </p>
      <p>The interesting thing about Tschichold is that his extreme dogmatism did not prevent him from doing brilliant work, nor from changing his mind. It just made him on occassion very annoying :) </p>
      <p>I really look forward to reading the new Christopher Burke book on Tschichold.</p>
      <p>ps. on the 'law' of maximum line length for legibility, Bill Hill of Microsoft mentioned a basis for the law in his Typecon talk: At normal reading distances, if a line is longer, the reader has to turn his or her head, instead of just the eyes, which slows down the process.</p>
