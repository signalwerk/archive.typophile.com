      <p>&gt;There is no “process leading to Baskerville”</p>
      <p>I don't understand what you are objecting to here. I only meant to refer to a sequence of events and a variety of influences on Baskerville, such as you list.  </p>
      <p>&gt;written over the older contrast type. </p>
      <p>I like this description, because I think it captures something I was trying to say above--that Caslon was a starting point, and even though there was a lot of change, you can still see the 'memory' of it in some ways. </p>
      <p>&gt;native to writing with the flexible-nibbed pointed pen</p>
      <p>Well this is true, but I can't totally buy the flexible pen as having a dominant influence on the the shapes, as they do in the cursive. Here, for example, is a comparison of Caslon and Baskerville. The top are scans from Caslon's larger sizes--from James Mosley's facsimile edition and commentary on the 1766 specimen booklet. Below is ITC New Caslon.  </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Baskerville and Caslon_6601.gif"></div><p></p>
      <p>As to the difference between the two C's I really don't see that Baskerville is that different, particularly as far as how the curves are handled. The arches on the m are to me the decisive difference, but here it seems that the desire for high contrast and the circular arches (inside and out) may be as much an influence as the ductus of the pointed pen. If you tried to draw this letter with a broad pen held vertically, you could pretty much get it, I am guessing, except for the left part of the arch. But these tapers in joins are in any case generally handled in type differently than the broad pen, including in Caslon. And even Baskerville's m has a gradual taper, which is more traditional than the long fairly uniform curvy thin strokes, as in the Bickham N above. </p>
      <p>So did having the pointed pen to work out the shape help it? Yes. But the neo-classic aesthetic taste and keeping close to 'typographic' rules for the roman seem to be just as important influences.  </p>
      <p>&gt;And, finally, I wonder if you mean to suggest that Baskerville worked from ‘readability principles,‘ that is, from a set of tacit rules (in the Noordzijian sense)?</p>
      <p>I suspect Baskerville was was mainly driven by aesthetics. I think he wanted it to look like type, and part of roman type is that it is highly readable, so there might have been a tacit influence there.  But mainly he was striving for a much cleaner, more elegant look than Caslon. As you know, he was an innovator in inks, paper and printing in an effort to get the cleaner look. The type face was only part of the story.</p>
