      <p>Bill: <em>This process of understanding the underlying writing, but actually sculpting outlines, I think reflects the reality of type—that it is modified handwriting. Both the fact that it has a base of handwriting and the modifications are essential. But the much of the work of type design is in sculpting the outlines.</em></p>
      <p>Yes, I agree with that. I also have been thinking, today, about how this discussion relates to practice and, particularly, to my own practice. I'm trying to account for the fact that the typefaces I make are full of the kind of modifications to which you refer -- that is, they are evident in what I create -- and at the same time they don't seem to me very significant in terms of this discussion. And I think what it comes down to is that, for the most part, these modifications are something that I apply in the manufacturing stage to make individual glyphs 'work', rather than something central to my thinking about letterforms.</p>
