      <p>&gt;basis for judging those details are largely a matter of aesthetic taste, but practical rules set the boundaries </p>
      <p>As you say there are two factors: One is aesthetics. The other is the set constraints put on by our perceptual apparatus as to what is more readable. This is a matter of physiology and psychology, and includes things like line length. Actually, I think that details can also affect readability, so text type can be critiqued from that point of view.   </p>
      <p>Gerrit Noordzij claims in this essay that if "If we ask for the intentions of the type designers, we find that their work reflected their attitude to writing with little regard for previous solutions." </p>
      <p>I think this very wide of the mark. After Jenson, all type designers that I know of were very influenced by previous *type* designs. Griffo had and worked with Jenson's type IIRC, and his efforts take Jenson's ideas and push them in a more typographic direction, for example, *not* a direction more influenced by writing. </p>
      <p>Caslon was directly interpreting Dutch typeface models in his own way. And that Baskerville was heavily influenced by Caslon's work, as well as by the steel pen. In turn Bodoni and Didot were influenced by what Baskerville did, not only the pen. And today an original work like Scala I don't think was influenced by changes in writing, but by other concerns relating to digital production, and the need for sans and serif designs that go together.</p>
