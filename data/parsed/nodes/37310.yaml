      <p>John, it's not just adjustments for small size. The Gros Canon of Garamond, above is pretty big. Canon is 48 pt, so I supposed 'Gros' Canon is bigger, a display size. And in addition to not following rules of any real broad pen of fixed width, many strokes also violate the rule of sticking to translation. The bottom of the stems in Garamond often widen out symmetrically before reaching the bracketing of the serif; that broadening is an expansion, violating the fixed width of a pen. </p>
      <p>I haven't been writing here only about changes in style, but also in readability. But in any case Garamond, it seems to me, is a significantly different style from humanist hand writing. If you put the Gros Canon and your post of humanist hand writing side by side, I think most typophiles would say that there is a marked stylistic difference. And that difference in style was doesn't seem to have been driven by changes in hand writing.</p>
