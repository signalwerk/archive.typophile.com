      <p>John, don't you think that Mannerist and Baroques romans — a better set of names for the romans traditionally dubbed transitional — or what Robert Bringhurst also dubs the proto-Baroque letters of the later sixteent century begining with the mature work of Robert Granjon and passing through the garamonds and on into Caslon, <em>do</em> show the influence or awareness of rotation? All these letters show a variable stroke axis as the illustration from Robert Bringhurst “fuelleton in honour of John Dreyfus” <em>Shovels, Shoes  and the Slow Rotation of Letters</em> makes plain. And the axis of the  'o' becomes typically vertical as if to anticipate what becomes formalized across the board in the Didonis on the basis of expansion.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/rb_sssrl_3563.jpg"></div><p></p>
      <p>This movement of the stress axis of the ‘o’ to vertical might also further explicate Baskerville's ‘debt’ to Caslon.</p>
