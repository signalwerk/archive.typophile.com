      <p><em>if by ’noise’ we include not only variation in letterforms or spacing but all those other factors that diminished the quality of so much printing then the manuscripts are by far the cleaner product.</em></p>
      <p>True, a good manuscript page is then cleaner than a bad printed page. But that kind of cleanliness isn't really relevant to the superiority of the typographic effect as described by Bill. If the benefit of type is to present more text on a page, within the grasp of an eye's scan, and less "noise", i.e. irregularity, then type has the edge, for two reasons.</p>
      <p>Firstly, type forms have shorter extenders and are more compactly line-spaced.<br>
      Secondly, scribes introduce much irregularity with contextual forms and flourishes (even modest ones).</p>
      <p>Of course, scribes CAN produce stilted work which is as mechanically uniform and succint as type, but that is not their professional raison d'être vis-a-vis the printing trade. Their added value is in handmade grace, which goes against typographic readability-value as defined by Bill in mechanical terms of maximizing quantity and uniformity of text.</p>
      <p>However, while accepting Bill's explanation for the superior readability of type <em>in one respect,</em> I don't believe that readability is quite so one-dimensional. It's not something that can be reduced to scientific or mechanistic proportions. That's fast food.</p>
