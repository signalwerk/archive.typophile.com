      <p>James: <em>If the 18th-century ‘English’ style became a force to be reckoned with in the history of writing and type generally it was because of the increasing strength of British industrial power at home and the creation of a new maritime empire, based on trade, and held together with a web of paper documents, bills of lading, letters of credit, and so on, that needed to be clearly, accurately and impressively written. Hence the rise of the English writing masters, and sooner or later, their power to influence print.</em></p>
      <p>I think this statement should be read and re-read, because it neatly summarises the particular British context of the influence of the writing masters on typography. And here is an image that very nicely illustrates all of the points that James makes. I think one could base an entire lecture around this one image and what it tells us about the place of writing in British imperialism. [<a href="http://www.tiro.com/John/Brooks1717b.jpg" rel="nofollow">Click here for a larger version.</a>]</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Brooks1717a_5341.jpg"></div><p></p>
      <p>This is from William Brooks' wonderfully titled <em>A Delightful Recreation for the Industrious</em> -- was there ever a better description of type design? -- of 1717. This, and the images from George Shelley's earlier publication, are reproduced in J.I. Whalley's <em>English Handwriting 1540-1853</em> (V&amp;A, 1969). Whalley comments on this piece: 'A form of self-promotion: Brooks displays his virtuosity by the variety of hands shown in his advertisement. It also gives an indication of the number of style still current at this period, before the overriding demands of commerce swamped the less practical ones.'</p>
