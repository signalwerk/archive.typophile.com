      <p>David: <em>So, doesn’t this imply that greek could not so easily go through the transitional needle as Latin could?</em></p>
      <p>I mentioned this discussion to Robert Bringhurst, who suggests that Baskerville's Greek is not so novel as is generally regarded, but that it has earlier precedence in the 16th century types of Stefano Niccolini da Sabbio, with which I am unfamiliar, and Simon de Coline's augustin Greeks, which I must have seen but can't recall.</p>
      <p>Bickham includes a Greek plate at the end of <em>The Universal Penman</em>, in which the conventional shapes, including ligatures, of the old Byzantine cursive style are written with a split nib pen. Minus most of the ligatures, and with greater regularity of proportion, this approach is the basis for the Didot, Bodoni and Leipzig Greek types.</p>
      <p>[Bickham also has a highly entertaining Arabic, in which the horizontal strokes must have been written from left-to-right because you can't push a pointed split-nib pen. It's almost the invention of a new style of Arabic script, but it doesn't quite work, despite some very beautiful individual shapes.]</p>
