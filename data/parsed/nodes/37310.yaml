      <p>Nick, the import of my question was: doesn't practical problem solving benefit from knowing laws: laws of vision, laws of perceptual processing in reading, 'laws of the letter,' that is, how letters behave, and how effortlessly they are processed as a unit when placed beside each other in words, or when formed in certain ways.</p>
      <p>I distinguish between "laws of" that, in our attempts to encapsulate them in words, have conjectural validity, and the dictates of expert practitioners that institutionalize personal ways of working with or around those laws.</p>
      <p>Line length might not be a problem in your example, but I think the word spacing, relative to letter-spacing, in the justifed block of text is.</p>
