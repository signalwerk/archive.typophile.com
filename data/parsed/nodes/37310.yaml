      <p>The point is, Peter, the violations are systematic, and being pushed by different goals, or a different 'paradigm', if you will. In that sense, yes, they are changing the paradigm in a fundamental and systematic way.</p>
      <p>The broad pen remains an "underlying force" (van Krimpen) in Garamond, but is contradicted by another force: the greater freedom of the punch cutter to please the reading eye more than the moving broad pen was able to. I never said the pen wasn't a force, just that there were other forces pushing away from its lines. You say that the changes are "critical", "strategic", but "non-essential". I think you are getting into a distinction without a difference here. If they modify and contradict the rules of the pen in a systematic way, I don't see how they can be anything but an essential change. </p>
      <p>Another way you can look at this is that there are two forces or paradigms at work: one the pattern set by the pen, and the other what pleases the reading eye. Noordzij rightly highlights the importance of one, but not the other, in the historical evolution of type design. You need both to get the full picture, I think. </p>
      <p>And later on in history you get a desire to meet some aesthetic standards that even make text type less readable. Even there it is those aesthetic ideals, and not the pen alone that is driving the process. Eg making the lower case wider, and the caps more even width, doesn't come from the pen.</p>
