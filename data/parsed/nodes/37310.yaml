      <p>Bill: <em>I really wonder how long the humanist script—with the lower case mimicking Roman capitals—would have lasted had not printing come along.</em></p>
      <p>A good question. On the one hand, one can guess that a major change in script style might not have occured until it did in fact occur with the influence of a new writing tool, but prior to the invention of type the scripts of Europe were constantly evolving and subject to alterations in compression, proportion, etc., and of course there were important regional scripts that gradually disappeared with the standardisation of roman types. Noordzij turns Bill's question on its head, wondering what might have happened if type had not frozen formal writing into those particular forms: "A stop of 500 years in the development of text scripts is long enough to make one look upon formal writing as static. Against a continuous tradition of 5000 years, however, the interruption has been merely incidental.'</p>
      <p><em>And my impression is that even in formal documents, such as contracts, writing quickly became more cursive after the introduction of printing. Is this right?</em></p>
      <p>In Italy, chancery writing tended to be cursive anyway, but also highly elaborated with swashes and ornamental devices: so cursive in form, but without the characteristic speed of writing we associate with that term. The humanist roman was specifically a book hand, intended for literary, theological and scientific texts. The quickly written cursive, without elaboration, which is the mother of italic type, was a kind of note hand, often found in manuscripts copied for their content by individual scholars rather than by professional scribes (such manuscripts seem to me the very model for Aldus' small format books in italic type).</p>
      <p>In England and some other parts of northern Europe, blackletter remained the norm for chancery documents for a long period, only to be replaced by the split nib scripts.</p>
