      <p>“not a different variable”</p>
      <p>Bill, ‘readability’ is not ‘a’ variable in any well-specified and scientifically tractable or historiographically and pedagogically productive sense, and judgements of readability, though important, are anecdotal experiential reports that involve a cluster of partially isolatible, but interrelated factors, which we might make ourselves aware of. Some have to do with realities of structuration on the object side, and some have to do with realities of conditioning and bias on the subject side. I’d love if you could affirm this, but than I’d want to ask why you won’t let this temper your broad generalizations in ways that I and maybe others might find them easier to embrace.</p>
      <p>In my book rhythm and even colour, as well as form / counterform logic and figure / ground control are optical-grammatical issues that have a lot to do with structuration on the object side. And the affordances that I am interested in are perceptual discrimination offordances and visual wordform resolutional affordances. Solving optical grammatical issues in one way might be productive or counterproductive when it comes to consolidating affordances. A type might become too regular. But these things aren't so easily decidable just by direct optical-grammatical gauging. I think all type-involved people should push beyond simple, conditioned statements to that level of awareness.  </p>
      <p>Perceptual discrimination has to do with how well the eye can make out the criterial parts of letters in the context of the word, sentence and text-block wholes these parts are part of; wordform resolution has to do with how easily and resiliently these parts in their relation form letters that gel well into stable, unitary, robust word-objects, because of the way they are open to and relate to other letters.</p>
      <p>I mean by consolidation and extension of affordances, that the types became more resistant to visual wordform resolutional collapse in tougher and a wider range of contexts of use. This comes out as readable in smaller sizes, or readable under greater print degredation. But I don't want to draw from these specifics that type is intrinsically more readable than writing, or one type than the other, on some absolute readability measure. All I think it is warranted to say is that affordance structures differ from type to type: some are deep and broad, others are pointed, rich but narrow. I would be happier to talk about readability or affordance profiles, using my kind of distinctions, than I am about readability as such in a kind of winner take all scheme.</p>
      <p>Given that the experience of comfort in reading is distinctly and complexly multifactorial in the ways I try to describe, to make broad ‘ranking’ statements using ‘readability’ as a measure is a strategy whose productive, pedagogic, and ‘fairness’ value I don't fully see.</p>
      <p>But maybe I've banged this gong enough for now, and should move on to other things.</p>
