      <p>Bill: <em>I think this very wide of the mark. After Jenson, all type designers that I know of were very influenced by previous *type* designs. Griffo had and worked with Jenson’s type IIRC, and his efforts take Jenson’s ideas and push them in a more typographic direction, for example, *not* a direction more influenced by writing.</em></p>
      <p>I used to think this too, but then I spent a lot more time looking at contemporary manuscript books, and Griffo's innovations are pretty minor and well within the influence of the formal humanist book hand. Between Jenson and Griffo, not a lot happens in terms of that book hand, so we should not expect any significant evolution in type styles. As typographers, we have established a history in which something like making the bar of the lowercase e horizontal instead of slanted is suddenly significant, but in the overall context of renaissance text manufacture -- both chirographic and typographic -- it is not significant at all. Griffo's types, like Jensons, are thoroughly wedded to the humanist book hand.</p>
      <p>What Noordzij has drawn our attention to is the phenomenon of very significant changes in type styles over the following centuries that correspond to and trail changes in writing. There is a tendency to think of a pre-Gutenberg scribal culture and a post-Gutenberg print culture, a kind of revolutionary media rupture of the kind that excites modern cultural theorists. But the fact is that the scribal culture persisted in various ways well into the 19th century, until the invention of mechanical typesetting, and in some areas of life until the popularisation of the typewriter. The production of manuscript books gradually dwindled to almost nothing in the 150 or so years after Gutenberg, but formal writing continued to be the means of producing many other kinds of documents, and it continued to provide the aesthetic and cultural context for the design of new typefaces. This does not imply that typographic letterforms simple copied written letterforms: obviously they did not. But they did import the characteristics of the popular written forms, most notably in stroke contrast and axis, i.e. the two characteristics by which we most often classify types.</p>
      <p>Regarding your final points, of course designers of type are responding to other types as well as to writing, but for most of the history of type they have been doing so in a context in which a large amount of the text that readers encounter everyday is written by hand. Writing is more dynamic than type, so evolves more quickly and shows more immediately changes in tools and taste. </p>
      <p>I really don't see any influence of Caslon in Baskerville's types. Baskerville is responding to neo-classicism and looking for a form that reflects the aesthetics of his culture. His models are not writing directly, but the increasingly important engraved image of writing, which itself is importing characteristics from writing as informed by the larger movement in architecture and art. These forms are a hybrid of written and constructed forms. In Bodoni's case, the direct influence of writing is explicitly acknowledged. Most of the 'history' of type design has been written without reference to a larger business of manufacturing texts, and so presents a purely typographical narrative in which the only possible influence on the development of new types is old types, or occasionally inscriptional lettering. This leads to fantastical notions such as the 'Transitional' classification of type, as if Baskerville were somehow anticipating Bodoni and designing his own as an interpolation between the 'Oldstyle' and the as-yet-non-existent 'Modern'.</p>
      <p><em>And today an original work like Scala I don’t think was influenced by changes in writing, but by other concerns relating to digital production, and the need for sans and serif designs that go together.</em></p>
      <p>Today, all bets are off on the influence of writing because there simply isn't any. Formal writing in the west is dead, and I don't consider 'calligraphers' significant. Calligraphers produce calligraphy, not texts. Type design has therefore lost its historical context. This isn't necessarily a bad thing, in terms of what may be produced as we look for new contexts to respond to and new paradigms for typography, but I think it makes it all the more important to understand that historical context and the relationship that has existed between writing and type in periods and places where formal writing and a scribal culture persisted alongside typography. Apart from anything else, it will make us sensitive to the perceptions of typography in those few places in the world where a scribal culture still exists and still influences taste and opinion of typographic forms.</p>
    html_clean: |-
