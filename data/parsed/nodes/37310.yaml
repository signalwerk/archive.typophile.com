      <p>Bill: <em>My guess, which may well be wrong, is that the letters such as the Shelly letters James showed us are constructed, not written. By that I mean that they look carefully built up of many strokes, not truly ’written’, with a continuously moving front.</em></p>
      <p>But what you said was that you didn't see the influence of the split nib in the neo-classical roman types. The point that both Peter and I have made is that the influence is in the distinctive stroke contrast pattern. The fact that Shelley likely drew his c. 48pt letters (split nibs are notoriously difficult to use to write letters this large), or that Baskerville might have drawn rather than written his models for John Handy or used some mix of writing and drawing, doesn't alter the fact that what is employed in the shapes is a contrast pattern that is distinctive and based on that of the split nib pen. And for obvious reasons: the goal was to make harmonious letters at a range of sizes, all in keeping with the dominant text aesthetic (the social and economic background of which James has nicely encapsulated). So Shelley and other writing masters write at the sizes at which they can write, and draw at the sizes at which they can't write, but maintaining a harmony of style that is based on the characteristic contrast template -- to use Peter's term -- of the writing that is, after all, the more common.</p>
