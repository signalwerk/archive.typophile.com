      <p>“systematically altered hand writing in ways to please the eye” [Bill]</p>
      <p>I would put it differently.</p>
      <p>Type designers systematically introduced alterations to what the first transpositions of writing into type produced. And they did so along several axis. </p>
      <p>The first axis, I'll call the <em>optical-grammatical problem-solving</em> axis.<br>
      It's not problems reading scribal writing that provoked the alterations, it's things that appear when the small variations introduced by the human hand and physical tool are resolved into a workable amount of  standardized and co-ordinated widths, standardized heights (x-height, cap height, ascender height, descender depth) and standardized stroke proportions. This sets up a type-internal dynamic. And I think that's what you miss in Noordzij. The ‘o’ overshoot problem is of this sort, as is the incremental widening across the board of certain strokes.</p>
      <p>Small variation in pressure, rotation, proportion is a thing of the hand, and over the space of a text produces a consistent texture. Constraining variations to absolute values — which the new technology presupposes — allows optical issues of uneven colour and optical irregularities — <em>which aren't spontaneously evoked in an environment of random, small-incremental variation</em> — to assert themselves or obtrude.</p>
      <p>(The second axis I've tried to call the <em>gestural-atmospheric-force inflection</em> axis.)</p>
      <p>Norm-violations along the optical-grammatical problem-solving axis aren’t generally stroke-paradigm changing, but they can (help) push the paradigm to a breaking point.</p>
