      <p>I am largely but not totally in agreement with your last post. </p>
      <p>I don't know the history of handwritten scripts, but my impression is that after type and printed books become widespread, people generally didn't take pains to write the formal, more readable upright humanist script. They were writing slanted, cursive hands that had less to do with the formal, highly readable upright script. Type was more readable than any script, so if you really wanted maximum readability you could just have it printed. If I'm right about that, then it would seem to me natural that designers of text types looked less to handwriting than to previous type designs. </p>
      <p>&gt;I’m not into guessing intentions, but I am interested in what one can deduce from looking at the product. </p>
      <p>You don't have to guess: Baskerville told us what his goals were, and the fact that he was influenced by Caslon. If I am trying to do accurate history, I'm not going to ignore what the originator himself said, even if I don't have to take it fully at face value. In using the word 'emulation,' he was acknowledging a debt. I agree with you that the debt is less than for most designers, as he was one of the more original designers in type history. But there are signs of that debt, as I noted. </p>
      <p>Baskerville had been a writing master, and if he wanted to write about his debt to other writing masters he could have. He chose instead to write about his debt to Caslon, which I see as a significant choice. I agree about the influence of the contemporary pen and writing on contrast, but all the other stuff I don't see as a writing influence. That why I think it is reasonable to conclude that the bigger part of his problem-situation was type, rather than writing. </p>
      <p>On Jenson and Griffo. You say that hand scripts had not changed much between the two, which would indicate that Griffo's inspiration was not from hand written script. However, you go on to minimize the diferences between the two. </p>
      <p>I think the differences are more significant, and move in a more typographic direction. For example Griffo's ascenders I believe lean a bit less to the right, his serifs are more symmetrical, and the crossbar on the e is horizontal. All of these features are more unnatural in writing, and they move further from the examples of the humanist script. That is why I conclude that Griffo was looking more at Jenson's type, and less at hand writing. </p>
      <p>Jenson made the biggest leap, in my view, in making his type more upright and more even in color than hand writing, and so strikingly more readable.</p>
      <p>Still, I don't think that Stanley Morrison was just blowing smoke and advertising when he wrote that Griffo's types were more clearly modern and decisively set the pattern for later roman types. </p>
      <p>I hesitate to say that Griffo's type was more readable than Jenson's, as the breakthrough was really Jenson, and the differences may well be more aesthetic than in readability. Still, I have the feeling that Griffo does have a slight edge in readability, and I suspect it may have to do with more even color as well as the other features. But I haven't studied it enough to really have any firm opinion.   </p>
      <p>ps on Caslon himself. You write:</p>
      <p>&gt;Caslon’s types were the end of the line for the Dutch oldstyle; in fact, they are primarily of interest because they were made in England and so came to play an important role in Anglo-American typography: if they’d been made in the Netherlands, we probably wouldn’t pay any attention to them.</p>
      <p>I agree that Caslon's place in history--and being the first old style to be revived--has a lot to do with the attention paid to his designs. But I do think he had he own sensibility about proportion and color that was admirable and highly readable. And that I, for one, think is worth trying to emulate in modern type. I am convinced that for all his vagaries, Caslon always proofed his characters between other characters, and had a very strong sense of what worked and didn't work. He didn't care so much about uniformity, but he had a very strong sense of what was readable, and it showed in his types.</p>
