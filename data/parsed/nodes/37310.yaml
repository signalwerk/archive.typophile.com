      <p>Bill: <em>To be sure, different designers handle the thick to thin curves differently, but isn’t that a design decision rather than any ’template’ dictated by the pen?</em></p>
      <p>Who are these 'designers'? What was their process of design?</p>
      <p>I'm not sure who the first person was to describe himself as a 'type designer' or when, but I suspect it was quite late, and reflects a process of design within an industrial type manufacturing setting. As I wrote earlier, I'm pretty sure that Baskerville's design process consisted of sitting down and writing the style of letters that he wanted, and John Handy translated the written forms into type.</p>
      <p>We know that, earlier, renaissance printers hired writing masters to produce models for italic types and or modeled their types on the writing of specific scribes, whose names are known to us.</p>
      <p>And I wonder what Griffo's design process was for the Aldine roman types? Obviously there is an evaluation of Jenson's types involved, but how did he -- and many future generations of 'designers' -- actually visualise the letters to be cut in the end of the bits of metal? It is very unlikely that he worked directly in the metal without a model -- the fact that Rudolf Koch did this was notably unconventional --, so what did the model look like, and how did he create it? I think we can be reasonably sure that he did not produce draughtsman's englarged drawings of a kind that only became necessary with the introduction of mechanism punchcutting. I think it is overwhelmingly likely that he used a broad nib pen and carefully wrote the forms he intended to translate into type, because of course he was not only a punchcutter, he was also a writer, just like every other literate person of his time. He may not have been a great calligrapher or a professional writing master, but he knew how to handle a pen just as he knew, as a punchcutter, how to translate those written models into metal and what adjustments to make for scale and technical limitations.</p>
      <p>Interestingly, Arrighi's italic types seem to have required fewer ligatures than Griffo's, suggesting that the professional writing master had better insights into how to adapt letters to the technology, while Griffo tried to follow a particular written model that obliged him to use more ligatures.</p>
    html_clean: |-
      <p>Bill: <em>To be sure, different designers handle the thick to thin curves differently, but isn’t that a design decision rather than any ’template’ dictated by the pen?</em></p>
      <p>Who are these 'designers'? What was their process of design?</p>
      <p>I'm not sure who the first person was to describe himself as a 'type designer' or when, but I suspect it was quite late, and reflects a process of design within an industrial type manufacturing setting. As I wrote earlier, I'm pretty sure that Baskerville's design process consisted of sitting down and writing the style of letters that he wanted, and John Handy translated the written forms into type.</p>
      <p>We know that, earlier, renaissance printers hired writing masters to produce models for italic types and or modeled their types on the writing of specific scribes, whose names are known to us.</p>
      <p>And I wonder what Griffo's design process was for the Aldine roman types? Obviously there is an evaluation of Jenson's types involved, but how did he -- and many future generations of 'designers' -- actually visualise the letters to be cut in the end of the bits of metal? It is very unlikely that he worked directly in the metal without a model -- the fact that Rudolf Koch did this was notably unconventional --, so what did the model look like, and how did he create it? I think we can be reasonably sure that he did not produce draughtsman's englarged drawings of a kind that only became necessary with the introduction of mechanism punchcutting. I think it is overwhelmingly likely that he used a broad nib pen and carefully wrote the forms he intended to translate into type, because of course he was not only a punchcutter, he was also a writer, just like every other literate person of his time. He may not have been a great calligrapher or a professional writing master, but he knew how to handle a pen just as he knew, as a punchcutter, how to translate those written models into metal and what adjustments to make for scale and technical limitations.</p>
      <p>Interestingly, Arrighi's italic types seem to have required fewer ligatures than Griffo's, suggesting that the professional writing master had better insights into how to adapt letters to the technology, while Griffo tried to follow a particular written model that obliged him to use more ligatures.</p>
