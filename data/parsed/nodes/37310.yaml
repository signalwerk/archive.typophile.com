      <p>Bill: <em>Thus Baskerville didn’t just violate the broad pen, he violated it in a way that is characteristic of the pointed, flexible pen.</em></p>
      <p>It seems to me that saying that Baskerville 'violated the broad pen' implies a relationship to that implement that is absent not only from Baskerville's own work, as both a writing master and as a typographer/printer, but also absent -- with the exception of blackletter -- from the contemporary text creation culture. It makes almost as little sense as saying that he violated the Chinese brush or the Burmese stylus: the broad nib as a tool for the creation of text was alien to his culture and hadn't been widely used since before Baskerville's birth. And even if you want to say that he violated the latent, inherited translation stroke pattern in typographic letters, that still implies a relationship that I think is contradicted by the evidence.</p>
      <p>Now I think we need to look at what happens when a script is reduced to typography. Gerald already commented on some implications of this, including the typical loss of regional scripts (although this had already begun in the manuscript culture as early as Charlemagne's time, and some regional scripts either survived or were later revived, e.g. the Irish insular hand). But there is a more general case to be observed, which is that the norm for typographic letters derives from the canons of the contemporary formal book hand, but in the new medium undergoes a secondary canonisation. That is, the normative manuscript hand of a particular text culture becomes the normative typographic letter of <em>subsequent</em> text cultures. So in renaissance Italy, the humanist formal book hand and later the cursive hand become the normative forms of humanist typography, which eventually becomes <em>the</em> normative typographic form of Latin letters, supplanting previous styles such as the various blackletter and regional hands and admitting new styles derived from contemporary writing, such as Civilité, only as supplementary fashions. So the process of type design becomes the process of creating these normative letterforms in new ways, with different proportions, contrast and detailing, rather than the process of creating new styles of writing. But in the meantime, new styles of writing are being invented by writing masters and professional scribes, who are producing significant quantities of text in various kinds of documents, who are teaching new styles of fashionable handwriting to both children and adults, and who are publishing copy books and exemplars, all in response to broader developments in intellectual and cultural life. Meanwhile, in comparison, the norms of typographic letterforms develop hardly at all: they are locked in their original Italian humanist form. To the type designer and typographic historian, there is a rich development in the treatment of proportions, weights, serif treatment, etc. and the important development of the canon of typographic articulation through supplementary styles, italics, smallcaps, etc. But compared to the range of different writing styles developed during the same period, Latin typography remains largely static and the basic underlying forms of the letters remains frozen and continues to be frozen today. Indeed, we now associate the normative forms not only of our typography but of our alphabet with these particular historical shapes. We admit some variation in the forms of e.g. a and g, but most of the rest of the historical and regional variety of the Latin script is unknown to most people.</p>
      <p>What happens in the 18th century is that these typographic norms are re-intepreted in light of the principle tool of contemporary writing and its distinctive stroke pattern. This is done by writing masters first, and only some decades later by a 'type designer'. In stylistic terms, everything Baskerville needed to create his types is already there in Shelley's exemplars of 1709 and 1715. By the 1750s, this kind of 'typographic writing', i.e. the normative typographic letterforms as written with a pen, has become part of the standard repertoire of the writing masters, and taking the next step of making it into a typeface is largely a financial and manufacturing issue. There are particular design considerations relating to the size of individual fonts, but that has been the case in typography since at least Griffo's time: the style of the new types was developed by writing them, as the documentary evidence shows. This may be a unique phenomenon in the history of typography: the development of a significant new style within the overall canon of typographic letterforms, i.e. not a new style of writing but a new way of making typographic shapes in a contemporary way, developed independently of the manufacture of type (something similar is happening in France at around the same time, but can probably be considered part of the same phenomenon, especially if one takes into account Fournier's enthusiasm for Baskerville's types).</p>
