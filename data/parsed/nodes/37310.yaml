      <p>Gerald: <em>Printers influence generated a “general improvement” on the craftsmanship of scribes.</em></p>
      <p>As I wrote near the beginning of this discussion: there was a flowering of renaissance manuscript production after the introduction of printing. But this is characterised by a conscious effort to improve quality and beauty: the form of the letters used is the same humanist formal book hand on which the Jenson and Griffo types were based. Competition from print inspired the scribes to do better work, to write more carefully and to show off just how legible and regular their letters could be, but the form of those letters was still the same <em>lettera antica</em> that they had been writing for half a century before the invention of type casting and which had shaped the contemporary Italian text culture. The early printers stepped into that text culture, and their presence changed it in numerous ways, but their influence on letter shapes seems the most minimal.</p>
