      <p>Bill, I really think you are arguing against yourself. As you say, punchcutting and engraving technically permit high contrast, fine hairlines, etc. And yet the normative model of typographic letterforms from the 15th to the mid-18th century remained based on the translation contrast pattern of the broad-nib pen. It was not until after the development of the split-nib pen and its associated writing styles, based on an expansion contrast pattern, that type founders began to make types that were modeled on that pattern. The fact that it would have been technically possible to cut such types at an earlier date is notable precisely because no one chose to do so: the technology precedes the writing, but the writing precedes the application of the technology to those forms.</p>
      <p>It is also interesting to note that between the translation model of the renaissance broad nib and the flourishing of the expansion model of the split nib in the 18th century, one finds the rotation model of the mannerist and early baroque writing masters. And yet one sees almost no influence of this different technique and, hence, different contrast pattern, in the roman text types of this period, which stick pretty doggedly to the translation model. The obvious explanation for this is that the mannerist writing masters did not provide a model for such types: they did not apply the new writing techniques to those kinds of letters. You do find some evidence of rotation in italics, though, and in the civilité types which were modeled on the popular writing style of the time. In the 18th century, by contrast, we have writing masters such as Shelley explicitly providing models for typographic roman letterforms produced with the preferred tool of the day according to the preferred techniques of the day.</p>
      <p>So not only do we have the evidence of type founders creating types that follow trends and models set by writing masters, we also <em>don't</em> see them creating types based on other potential models when these are not provided by the writing masters, despite the technical ability to make any shape that the cutting, punching and casting processes would permit. Overall, typography prior to the 20th century comes across as a very conservative field, following behind the much more dynamic development of new formal writing styles. There are good economic reasons for this: making type was a costly and time consuming business, while a writing master needed only a pen, some ink and some paper to develop and practice a new style.</p>
      <p><em>I can see the influence of the pointed nib on loopy scripts like Bickham, but not on romans.</em></p>
      <p>Then you're blind. Sorry, but there's no polite way to put it. From Baskerville to Didot to Bodoni the expansion contrast pattern is the defining basis of the new styles (much more than axis, by the way, which actually varied a lot more than the popular revivals indicate). Not only is it possible to emulate all these styles of types using a split nib pen, it is impossible to emulate them with any other kind of pen (presuming one is writing the strokes and not drawing the letter).</p>
      <p>The lower contrast, sans serif letters were based on a different but still contemporary style of <em>drawn</em> lettering (see James' <em>The Nymph and the Grot</em>. No one is claiming that the split nib was the only tool used during this period, or that the styles of writing associated with it were the only styles of lettering either popular or invented during the period. But it was the only tool used for the principle styles of formal writing, and evidence of the broad nib is only found in the gothick.</p>
