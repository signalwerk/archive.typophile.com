      <p>William: "It reminds of a concert I saw with the great rock guitarist Chuck Berry. That time he played a lot of guitar, and played different kinds of music, like calypso, show tunes, etc. I don’t remember what the different songs were. But what was striking is that they all sounded like Chuck Berry. He has such a strong and individual style, it just stamps everything he touches."</p>
      <p>A valuable comparison to the "sound" of Caslon's work.</p>
      <p>Caslon did not cut punches from patterns. Patterns were used in the much later mechanical punch cutting innovations, not by hand punch cutters. Drawings were, "but not always" used by punch cutters. Let me compare my own approach to typographical design to that of Jim Rimmer's. Jim would draw his page with the very spirit and feeling of his finished product. I never used drawings (layouts) I designed in the type stick, or with fleurons on a galley. If I do say myself, and I do, typographical compositions found in my stick were "not too shabby"</p>
      <p>It is unknown, some even have doubts, including myself, that Caslon began with drawings. In fact the Caslon Foundry, or Foundery, if you prefer, which I do, survived into the twentieth century with punches and matrices intact. But no sign of drawings to my knowledge, and I asked the Caslon Foundery. They offered this very theory.</p>
      <p>That is important hear-say evidence drawing me towards significant doubt that Caslon worked from master drawings.</p>
      <p>Also, Caslon was not so much cutting a "type face" as he was a "type size". Caslon had a very natural gift for intuitive optical scaling. Some characters, Italic "&amp;" show great departures. One may also note the upper-case "A" changing in design in the original Caslon. Then start looking closely at the other characters.</p>
      <p>However all sizes, represent the work of Caslon. All have the same sound, but no two sizes are identical.</p>
      <p>By the way, I believe Baskervilled was greatly influenced by Caslon. However the reasons for "non slavish imitation" has yet to be discussed.</p>
      <p>In 1723 Baskervill taught writing and became a skilled engraver of tombstones. Caslon was a gun lock engraver, and importantly a bookbinding tool stamping engraver. In other words Caslon was a skilled punchcutter before beginning his business endeavor. Although Baskerville and Caslon were engaged in remotely similar industries they possessed very different disciplines. So one should anticipate notable differences in spite of Baskerville's stated emulation.</p>
      <p>Which brings me to the word "emulate" mentioned previously, the one that both John and William have sparred with.</p>
      <p>One of the early definitions of emulation is to: (Oxford) "Try to equal or excel; rival;". </p>
      <p>A further consideration is the two distinctly different personalities,</p>
      <p>Baskerville: "He invented his own lustrous, uniquely black, opaque ink; he was the first to exploit commercially James Whatman’s invention of wove paper, which was much smoother than the traditional laid paper; and he modified the printing process by using heated copper cylinders to dry the ink before it had time to soak too far into the paper. All of these innovations enabled Baskerville to produce printed work of an elegance, crispness and clarity never seen before."</p>
      <p>Baskerville was a very inventive book printer not so much a type founder. Baskerville did not emulated Caslon's business model. While Baskerville's workmanship was excellent "the trade not so excellent", or should I say "fussy". The trade had "work to do" and whiskey to drink. </p>
      <p>Caslon was a type founder selling to the trade, and sell he did. His foundery produced Caslon Old Face for well over two hundred years. I sold and set tons of Caslon Oldstyle over the years, not a pound or a setting of Baskerville although I offered both.</p>
      <p>Baskerville I find more of a curio typeface and compare it with my interest with souvenir spoons. I hate souvenir spoons.</p>
