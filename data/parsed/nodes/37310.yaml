      <p>By setting a Law and pointing to it, we set up the challenge to find something false in its logic. By doing this, we do more to kindle debate and get at what might be truth than if we never have a Law to ponder. Rules are meant to be broken and Laws are meant to be debated by the supreme court.<br>
      It has been a number of years since I taught but I used to throw out a "Law" or even a rule just to see what it prompted from my students. It was a worthwhile exercise.</p>
      <p>ChrisL</p>
