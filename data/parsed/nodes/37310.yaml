      <p>James: <em>To my mind he means rules are akin to formulas which offer a guaranteed result by stipulating how a thing is to be done, without deviation from the given formula (rule). Rules are orthodox in their nature. By contrast, laws are more akin to principles upon which (in this discussion typographic) design rests—-by and large—-but which are subject to ongoing testing by practitioners to prove or disprove their validity.</em></p>
      <p>Yes, but Noordzij being Noordzij, he expresses this in a provocative formulation:</p>
      <p><em>The rule promises paradise, but in obedient submission. The law promises the wilderness, but in freedom.</em></p>
      <p>I think it would be remiss not to acknowledge the religious references in this dual metaphor, something that Noordzij employs quite often in his writing. There's a, presumably, Dutch Calvinist frame of reference that Noordzij plays with, in this case offsetting the Judaeo-Christian wilderness against a fairly transparent reference to Islam ('submission').</p>
      <p>One of the reasons I enjoy reading Noordzij so much is that he is seldom just talking about design. The same is true of Bringhurst, although in a very different way.</p>
