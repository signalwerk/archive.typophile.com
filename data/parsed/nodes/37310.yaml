      <p>John, thinking through letterforms in figure / ground (Frutiger / Modernistic[?]) or form / counterform (Bloemsma in Legato / Postmodern[?]) terms can also illuminate ‘escapes’ from “specific-contrast-type” keyed paraphrase in the sense I suggested above.</p>
      <p>Furthermore, I think Wim Crouwel's New Alphabet still has the structure of paraphrase in important ways, as do Douglas Hofstadter and his gang's Letter Spirit alphabets. The paraphrase / escape dynamic here is not in terms of contrast styling but in terms of construction, or what I've called role architecture. </p>
      <p>Each paraphrase is an escape, but the only way to escape paraphrase is to switch to an unwritten script.</p>
