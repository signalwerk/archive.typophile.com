      <p>&gt;But none of this is to suggest that type designers have not been influenced by other type designers, and I don’t think Noordzij is suggesting this either.</p>
      <p>John, it seems to me you are dismissing compelling evidence. </p>
      <p>I'll repeat the Noordzij quote a third time, and perhaps you can explain how I am misinterpreting it:</p>
      <p>“If we ask for the intentions of the type designers, we find that their work reflected their attitude to writing with little regard for previous solutions.”</p>
      <p>By "previous solutions" he means, as I read him, the designs of other type designers. That is what I am reacting against. And by the way Noordzij is on occasion given to extreme, interesting, thought-provoking statements, so this is quite in character. </p>
      <p>Let us go with the case of Baskerville further. I do not find your dismissal of Baskerville's explicit statement of debt to Caslon convincing. There are a hundred ways he could have praised his predecessor without directly saying he emulated him, but he didn't choose any of those hundred. So why would he feel compelled to lie outright, which he has to be doing for Noordzij to be right? </p>
      <p>Also, I have been working on history of ideas in one way and another for a long time, and I have found that what an innovator says about his or her predecessors is extremely revealing, and is worth paying careful attention to. These statements are usually very brief, and as a rule more accurate and revealing than anything else that has been written since. </p>
      <p>In Baskerville's case, I think that only one of a number of changes he made to Caslon is directly attributable to writing. </p>
      <p>Again, more of what Baskerville actually said:</p>
      <p>"I formed to my self ideas of greater accuracy than had yet appeared, and have endeavored to produce a Set of Types according to what I conceived to be their true proportions."</p>
      <p>Let us take 'proportions' first. As you note, handwriting is generally oblique. And it tends to narrower n's h's etc. than roman letters. And the counters in the o, n, m, etc are more assymetrical with the outsides. And this remains true in 18th century writing, such as that of Bickham. I don't know if Bickham has wider arches than earlier scripts, but if so it would be influenced by neo-classical taste, rather than any result of the mechanics of the pen or of writing.</p>
      <p>Baskerville's nm etc have lovely neo-classical arches, and to achieve these are wider than previous letters, and the arches are more symmetrical and circular than earlier types. The vertical stress of Baskerville takes what Caslon (and earlier the Dutch) had done with the O and o, and apply it across the board. All of these features *contradict* writing, and are more likely influenced by neo-classical architecture and other design than by 18th century writing in particular. </p>
      <p>As to 'accuracy', if you look at Caslon's original types, you see that in some sizes eg the m's and n's have quite different curves, and there is a lot of variation in x height, ascender height, stem width etc. And the relative proportions of letters sometimes vary greatly from size to size. So Baskerville set out in reaction against Caslon to have strict consistency in these matters. But again, this is not a feature of writing. The extreme consistency and accuracy is not possible or even desirable in writing, but it is in type. </p>
      <p>Baskerville it seems to me was influenced by Caslon as much by reaction against him as in following him. But that makes it no less an influence: he was looking at *type*, contrary to Noordzij. I haven't made a comparative study of the two types, but my impression is that there remain some similarities in structure. The x-heights and extenders are, IIRC, similar in proportion. And the way the diagonal letters are handled (formation of k, W, M) is similar. And the caps are fairly heavy in relation to the lower case. They are somewhat less than Caslon, but much more than eg. Garamond, showing the enduring influence of Caslon.   </p>
      <p>And by reaction, Baskerville gives the letters greater contrast, more vertical stress, and wider and more symmetrical letters. The high contrast is the one thing in this that is likely an influence of the steel pen, but that's about it. </p>
      <p>Again I have gotten long, so more later...</p>
