      <p>Nick: <em>Is there no escape? Is it all about chirography?!</em></p>
      <p>I think Wim Crouwel's new alphabet definitely escapes the chirographic. But that's the kind of radical approach necessary to sever the connection.</p>
      <p>I think as long as one is considering letter construction at all in terms of strokes, then the chirographic isn't far away. And bear in mind what I wrote today in response to Bill: our concept of writing shouldn't be limited by experience of Anglo-American handwriting, i.e. chirography implies all textual marks directly made with the hand and a tool, and that includes styles in which strokes are built up, or outlined and filled, as found in various writing traditions around the world.</p>
      <p>In order to get away from chirographic models or influences, you need to come up with a different conception of what the glyph is, i.e. something other than a collection of strokes. There are designers who have done this. I don't take Crouwel's approach very seriously, since the result doesn't actually work for text, but the idea of a glyph as a geometrically circumscribed space is, for better or for worse, a genuine break with chirography. It is different also from the attempts at geometric letter construction as proposed by Dürer, Feliciano et al, because they were trying to discover a geometric basis for letters that were already being written, while Crouwel was using geometry to discover new letters.</p>
      <p>More interesting, though, is the approach to the glyph as a figure-ground relationship, as seen in much of Frutiger's work and in Evert Bloemsma's types.</p>
