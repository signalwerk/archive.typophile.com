      <p>From Gerrit Noordzij's essay: <em>The rule promises paradise, but in obedient submission. The law promises the wilderness, but in freedom.</em></p>
      <p>To my mind he means rules are akin to formulas which offer a guaranteed result by stipulating how a thing is to be done, without deviation from the given formula (rule). Rules are orthodox in their nature. By contrast, laws are more akin to principles upon which (in this discussion typographic) design rests---by and large---but which are subject to ongoing testing by practitioners to prove or disprove their validity.</p>
      <p>Also from Noordzij's essay: <em>Students are frightened by freedom as soon as they understand that freedom leaves them alone with their own judgement.</em></p>
      <p>That's so true, not only of design students; the majority of practising designers seem almost terrified of taking risks. Realistic practitioners accept that there can be no art or new design without risk. </p>
      <p>"Freedom is a scary thing. Not many people really want it" ---from the song Statue of Liberty, on Laurie Anderson's recent album Life on a String.</p>
      <p><em>The body of science is that which can not be disproven.</em></p>
      <p>The body of science is that which is destined to be disproven. The whole history of science is a succession of theories or laws disproven by experiment and observation, and supplanted by new theories which in turn are disproven and replaced by subsequent laws or theories, on and on.</p>
      <p>The Day the Universe Changed, by Professor Sir James Burke, narrates this history of science and scientific revolution with immense clarity and insight. Nothing is what it seems. Not even laws are what we think they are. Each view attained by each phase of culture and society is just another view---a reading of the world that attempts to make sense of it.</p>
      <p>Some psychologists view human consciousness as a kind of dreaming, in the sense that we dream in an illusory fashion in order to percieve the world around is.</p>
      <p><em>Most design is banal and predictable precisely because it is undertaken as problem solving.</em></p>
      <p>I couldn't agree more John.</p>
      <p>j a m e s</p>
