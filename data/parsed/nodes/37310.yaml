      <p>&gt;Forget your idea of starting points</p>
      <p>Yes, I mean that he was looking at different types, possibly from different hands, at different sizes. How exactly Caslon went about his work is not that important to me, but if I did want to look into this I don't see why I would want to forget the actual types--in metal or on paper--that Caslon was looking at. It isn't only the general theory or design principle, but actual individual letters that matter. Caslon was a very ad hoc kind of guy, and his different sizes not only have different contrasts, different serifs, and different widths, but are sometimes different in their structure--eg small sizes of the C having no barb on the lower arm, but large sizes having the two barbs. That might have been a concept, but it also might have been just copying other types.</p>
