      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Durer C_3592.gif"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Durer D_3897.gif"></div><p></p>
      <p>Here Dürer does both vertically stressed characters and 'old style'. And he is quite conscious that the first, vertical stress letters violate the models of the broad pen. He writes in the description of the second 'C', "and, as though made with a pen, let the descending stroke be heavier than the ascending."</p>
      <p>Note that the serifs are also more pointed than in any pen script, and they are also, in the H, I, etc, symmetrical. </p>
      <p>Now Dürer did these engravings in 1525, so that is long before the flexible pointed nib was generally used. My own conclusion is that Harry Carter is right about there being a freedom to pursue new ideals not derived from writing. And those explorations eventually to the Romain du Roi and to Baskerville's work. </p>
      <p>As a coda to this, let me return to the typographic engravings of Bickham. The fact that these drawings do not display very prominently some of the characteristic uses of the flexible pointed nib shown in the cursive writing indicates to me that these drawings are heavily influenced by type. Nevertheless, the  p in the top picture, for example, shows the presence of the flexible pointed pen in the fairly uniform, fine line arching into the stem above and below. However, in Baskerville, (at least in modern interpretations, and I think I see the same in the small sample above) there is more tapering, characteristic of earlier type, including Caslon, rather than writing. </p>
      <p>These engravings of pen made roman letters are not so much writing as careful drawings that show the marked influence of type, and which try to work out ideas that go back to Dürer, and probably earlier. This is not to deny that pointed nib makes a contribution by facilitating the exploration, but there is a lot besides writing going on. </p>
      <p>Tomorrow: conclusions.</p>
