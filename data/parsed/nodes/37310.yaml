      <p>&gt;contrast template</p>
      <p>The problem is that the contrast template was already there, from the broad-nibbed pen and modifications by type designers. Having vertical stress and greater contrast didn't change the basic rules--rules like thick verticals and thin horizontals, alternating thick thin on the W, or the tapering of strokes at joins of curve to straight. </p>
      <p>I can see the influence of the pointed nib on loopy scripts like Bickham, but not on romans. </p>
      <p>And with sans, later, you have a *reduction* in contrast, even when the pointed steel pen is most flourishing.</p>
      <p>The 'contrast template' of the pointed Chinese brush is, in comparison, radically different. Put any two characters from Griffo and from Bodoni side by side. Then put both beside a brushed Chinese character.</p>
