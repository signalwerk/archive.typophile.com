      <p><em>What your sample ignores is that disproportionate word spacing overwhelms the proper salience of the interior whites, disrupting rapid automatic visual wordform resolution and hence disturbing smooth sense-following—the essence of reading. </em></p>
      <p>I disagree. Your notion of "proper" word space is entirely subjective, culturally specific in fact. As I argued, readers at that time would have had no problem with the large word spaces, and readers generally make allowances for "display" typography that is set with some style.</p>
      <p>To change the example from wordspace to leading, consider this, set by Yale University in 1936 for Stanley Morison's text. With it's bumping extenders, it pays homage to many centuries of solid leading. No doubt the rules people will say this is a no-no, and I'm sure it would be possible to prove it's inefficient in a laboratory test, but hey, don't let that language go extinct. In a similar vein, but paying homage to Raygun more like, the decks in Step magazine employ reverse leading. A trend perhaps, but nothing to do with an intellectual appraisal of rules, and the kind of thing where an art director let's the hand and eye do the thinking, while playing around with the variables in a layout program.<br>
