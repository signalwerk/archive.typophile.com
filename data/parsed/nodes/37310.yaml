      <p>&gt;not all of them effected fundamental differences in the basic shape-logic of the strokes.</p>
      <p>Yes, but what drove that change? In the discussion of Mannerist writing Gerrit Noordzij says in Letterletter that the mannerist pen was broad, but flexible. I'm guessing that this was a step to the pointed, flexible pen. From what I read, it seems one could make all of these--broad, mannerist and pointed--from a goose feather and a pen knife. So there wasn't any technical limitation as to why people didn't create and use this kind of pen earlier. Did they modify the pens because they wanted a more florid, dramatic style? Was this related to changes in the decorative arts generally? I would guess 'yes'. </p>
      <p>And if the pen is driving everything, why was there was a reaction against the high-contrast vertical stress types toward the end of the nineteenth century? It is said that the publication of Lady Willoughby's Diary, the first revival of Caslon, and of any type, was a sensation in 1844. Many people found it more readable than the high contrast types that had come to dominate printing. and by the end of the century in English speaking countries there was a tide of 'old styles' that continued into the 1930s. </p>
      <p>And you had Edward Johnston taking up the broad pen in England, IIRC, and doing old, pre-flexible pen writing. And you had Morris reviving Jenson, or trying to. Was everyone suddenly forced to write with a broad pen and then designers helplessly followed? No. But society was changing--first the industrial revolution, and then reaction to its bad side.  </p>
      <p>The pen was an important part of the story, but was type design a prisoner of the history of the pen? I really don't think that's tenable, because writing is part of a broader culture--visual, technological, social, and the change in writing instruments are themselves part of that. </p>
      <p>For example, one of the technical changes was Baskerville's improvements of inks and printing methods. Again, I don't know, but I would guess that this did help inspire Bodoni and Didot to do what they did *in type*. For the pen's ductus didn't change between Baskerville and Bodoni, so far as I have heard--and I'm sure John will correct me if I'm wrong!</p>
