      <p>&gt;the point is</p>
      <p>But *my* point is that Aldus's page shifted the paradigm, as Harry Carter, Morrison and others have said. And it was shifted away from the stroke of the scribal hand, as it violated the rules of that hand--if as I suspect the type resembles latter type in the tricks to get more even rhythm and color. </p>
      <p>Gerrit Noordzij in Letterletter does acknowledge some change in Jenson from the scribal hand. However, he ascribes this to what is cut "more easily" in a punch (p. 96).  Here is the nub of my disagreement. I suspect that was was going on, at least by the time of Griffo, is deliberate changes to achieve a purpose of higher readability than what the scribes achieved. Furthermore, this movement away from writing continued, I suspect, up to at least Garamond. </p>
      <p>In order to make this case I will have to get high resolution scans, which I don't have time to do now. However, that movement away from the scribal hand is where I suspect Noordzij's story--and John Hudson's has an important missing theme. </p>
      <p>By the way, I broke down and picked up a pointed, flexible steel pen and dipped it in ink and tried to draw an approximation of a Baskerville 'n'. I was taken aback that the pen did drew pretty much exactly Baskerville's line. </p>
      <p>The source of my blunder on this is that I was thinking of the pointed pen as the 'generalized pen' that Noordzij describes, with translation, rotation and expansion in any direction. But the pointed pen is more restricted in how it draws on up strokes and side strokes. So it has a characteristic stroke that I wasn't aware of. Or as John Hudson put it--rather ungenerously--that I was 'blind' to. Thus Baskerville didn't just violate the broad pen, he violated it in a way that is characteristic of the pointed, flexible pen.</p>
