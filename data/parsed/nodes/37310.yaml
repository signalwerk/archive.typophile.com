      <p>The conclusion of my version of the story is that printers type is both derivative of writing, and a deliberate departure from writing in an effort to increase readability. </p>
      <p>The movement away from what is natural in writing starts even with scribes. When people write naturally, they write in more cursive, flowing styles, with slant. Scribes were producing text for reading, and made hands that are more unnatural to write--being more upright for example--but easier to read. </p>
      <p>The creators of the printer's type that became dominant in latin script--Jenson and Griffo--took this process a step further. They not only made the letters more upright and more symmetrical, but were willing to violate the rules of the broad pen, and change relative weights and the nature of joins to get more even color and higher readability. </p>
      <p>In the case of Baskerville, we see a strong tendency to more simple geometrical shapes. He is not just increasing contrast, but having more circular arches in the mn, for example. That these are more circular reflects the neo-Classical arch--as Bringhurst notes--and not only writing influences. It may well reflect also a search from before the time of Dürer for 'ideal' shapes and proportions. Since Baskerville says specifically that his goal is "true proportions"--a phrase reminiscent of Dürer's "just shaping of letters"--I also think it likely that his shapes are influenced by this concept of a certain ideal, not derived from writing, but to which writing can aspire, and type more successfully achieve.   </p>
      <p>If we look at the C from Bickham (taken from above), Baskerville (from the Prayer book image) and Caslon (scanned from Caslon's Great Primer), we have some of the story:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bickham, Baskerville, Caslon_5009.gif"></div><p></p>
      <p>What I see here is Baskerville being influenced by both: following the greater contrast from the writing (actually engraving), but also following the geometrically more simple, rigid and symmetrical form taken from type, and specifically Caslon. (Had I scanned a larger size of Caslon, you would see more higher contrast and closer resemblance to Baskerville.) We also see a formal balance that seems to owe a lot to pushing toward an imagined ideal architype of letters, and not one that simply follows and regularizes writing--even the most typographic of writing. </p>
      <p>&gt;The fact remains that you can’t produce Baskerville’s letters using any other writing implement but a split nib.</p>
      <p>You can't produce them by the pointed nib either, and can only come close laboriously. You can produce them by drawing, or by cutting them in punches, which is how they were in fact produced. The question is whether the inspiration was simply writing, or also type and ideal shapes.</p>
