      <p>Peter, I think I cross-posted with your previous post. Your most recent post I have great difficulty in understanding, so let me respond primarily to the previous one. </p>
      <p>I gather that you reject my claim that good type, well set, is more readable for lengthy text than is the best handwriting. </p>
      <p>Yes, this is a generalization, and I may well be wrong. I thought you approved of Noordzij's tentative 'laws', rather than authoritarian rules. My proposal is a tentative or conjectural 'law' if you will, not an authoritarian demand that I am imposing on anybody. </p>
      <p>Also I'm not accusing anybody of incompetence, bad intentions, or bad actions, so I don't understand what 'fair' or 'unfair' have do with it. I am right or mistaken, that's all. </p>
      <p>Also, just to be clear, I am not saying that all decisions that historical creators of type made were based on readability. What I am saying is that some of them have been, and those concerning even color and good rhythm resulted in type being more readable than handwriting.</p>
      <p>And that is not because type creators they were any better workmen or artists than the scribes. It is because the medium offered greater control over outlines, and in a more limited way, spacing. And some superb type creators, such as Garamond, were able to take advantage of this greater control. </p>
      <p>Readability, or ease of reading with good comprehension is not a scientifically well defined and proven concept. But I'm not writing a scientific paper, just expressing my opinion in language that has been used in typography for a long time. I cannot prove that my impression of greater readability is not simply due to habituation and familiarity, and rather than an inherent advantage of type. However I think there is reason to believe that regularity in rhythm and even color do ease reading. And the fact is that handwriting is almost never used for extended text, even though technically it could be written, photographed and printed in just as many copies as any typeset text.</p>
