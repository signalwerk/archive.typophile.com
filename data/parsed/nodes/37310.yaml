      <p>Of course Baskerville knew Caslon's types and of course he was aware, intimately, of the ways in which his own were similar to or different from them. What matters -- why we care about Baskerville and why his types were so widely emulated -- is the ways in which they were different and the reasons why they were different. Caslon's types were the end of the line for the Dutch oldstyle; in fact, they are primarily of interest because they were made in England and so came to play an important role in Anglo-American typography: if they'd been made in the Netherlands, we probably wouldn't pay any attention to them. Baskerville's types were the beginning of something, and they came to be seen as reflecting their cultural context better than the oldstyle types could.</p>
      <p>Here is a mental exercise that I recommend: imagine that you are a typesetter/printer in the later 18th century. Imagine that you are typesetting a new book, say James Harris' <em>Hermes, or a philosophical inquiry concerning universal gramma</em> (fascinating book, by the way), and you have before you the manuscript copy from which you are composing the type. Picture that manuscript copy. Now try to feel the cultural discomfort, the disconnection between that manuscript and the late renaissance or mannerist typeface that you have in your font of type. Today, we live in a typographic world full of revivals of historical models and a great diversity of styles, and because we don't very often encounter handwritten copy and because there is no culture of formal writing, we don't generally experience anything like this cultural disconnection between written and typographic forms that would have been very evident and awkward to earlier generations (the closest we come is when we see a piece of text set in what seems an inappropriate typeface). Indeed, one can argue that most of the history of innovation in type design has been in reaction to such disconnections, and should be seen in terms of correction and the bringing of typographic forms into line with the broader text culture, itself part of a larger intellectual and artistic culture. We see this even in the very beginnings of our 'roman' typographic forms, where a disconnection between the available blackletter types and the culture of Italian humanism prompted the invention of new styles of type based on the formal Italian book hand.</p>
