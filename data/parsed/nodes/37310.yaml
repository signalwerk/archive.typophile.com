      I've done this kind of thing, and it's very difficult to leave exactly the right amount of space between flourishes to accomodate future passes of the pen.<br>
      Probably used an erasable medium, like graphite. What kind of eraser?</p>
      <p>And how would the engraver have transferred the image to plate, before engraving?<br>
      One way would be to draw on the back with graphite, and then rub that onto the plate.<br>
      So a light box (or window) would come in handy.<br>
      You couldn't just lay a "carbon black" sheet between the drawing and the plate, and go over the writing with a hard implement, because the image needs to be reversed onto the plate.</p>
