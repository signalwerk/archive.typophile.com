      <p>Interesting link.</p>
      <p>I wonder, when type criticism doesn't explicitly state the laws guiding it, whether it would constitute another example of this rule-based presumptuousness from Noordzij's (or anybody else's) perspective. </p>
      <p>Take for example this sentence: "There are wayward details in some letters: the shortened bar in f, the inadequate ear on r, the cropped head of a..." What is the <em>basis</em> for asserting that an r's ear is inadequate—an unspoken law? an obnoxious rule? or is this sort of criticism understood to be acceptable as a matter of taste, different from something like Tschichold's rules about line length?</p>
