      <p>&gt;the logic of the pen</p>
      <p>The logic of which pen? If we are talking about one broad pen, with a fixed width held at a constant angle--which I gather is the story through Garamond--then what I have described are contradictions to that pen. </p>
      <p>Sure, if you change to a different pen of different width when you do a diagonal, or somehow rotate the pen at weird angles while writing the letter--you might get those uniform or thinner diagonals, though probably if you kept the pen on the paper it would mess up the stroke at vertexes while you rotate. And you'd have to switch or rotate the pen to get the wider arches too. Switching pens for heavier caps makes some sense, but not in the middle of a lower case letter, I think. </p>
      <p>A theoretical pen is irrelevant to causation in history, because it didn't exist and it didn't drive the historical development. </p>
      <p>I find Peter's analysis persuasive--that the inherent uniformity of repeating the same letter forms pushed type creators to make the changes I have written about. That way they were able to achieve better rhythm in letter widths and spacing, and more uniform color, enhancing easy and comfortable reading. And by the way not all were able to do it. As Harry Carter illustrates, W. de Spira's roman type failed to achieve that good typographic rhythm, and Jenson succeeded. And he thereby became a model for Griffo. There are typographic solutions to typographic problems, and these are not trivial, and not simply derivative from writing.  </p>
      <p>Earlier in this thread, having before my mind's eye Noordzij's theoretical pen--that can do translation, rotation, and expansion--caused me not to see Baskerville's arches as guided by the ductus of the pointed pen. The pointed pen is, however, a real pen and doesn't act the same way in down stroke, upstroke, and moving sideways, and so is decisively different from that theoretical pen. I only really fully understood that then when I picked up a pointed pen and wrote with it. Now I think you are making a different mistake, but due to the same cause--assuming a theoretical pen that didn't exist and didn't influence history.</p>
      <p>The changes in pens did influence letter forms, as Noordzij explains. But other forces also influenced the evolution of type.</p>
