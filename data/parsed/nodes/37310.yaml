      <p>Neville Brody faced the same situation.<br>
      He did his own thing, but everyone cloned his style, rather than doing <em>their</em> own thing.<br>
      The penalty of leadership.</p>
      <p><em>That first line had word-spacing you can drive a truck thru.</em></p>
      <p>It doesn't bother me at first read, but I do like to read old stuff. I don't think it would have concerned readers at the time.<br>
      On analysis, it becomes apparent that the typographer has opened out the word spacing in the first paragraph, and amply spaced the "ellipsis", to enable that paragraph to be squared off without leaving too big hole in front of E. Keble Chatterton. What would you have done to maintain the squared-off style, Steve? Bear in mind that in those days (the 1930s) raggedness was bad grooming, and more objectionable than big word spacing.</p>
      <p>In general, the consensus on appropriate word spacing today is that it should be a lot tighter than it was in the past. I would say that greater flexibility and control of kerning and H&amp;J parameters enables this effect, and there is also a greater incidence of rag right copy, which has less wordspace overall than comparable justified text. </p>
      <p>Consider the beginning of sentences. With sentences in English often beginning with the letter T, Y, or W, when there was no kerning for a following lower case letter, a narrow preceeding wordspace positioned the Intial in the middle of a fair amount of white space, too close to the end of the previous sentence. The solution to this design problem was to have a larger space between sentences -- but in order to not have this stand out too much, the normal word space was larger. An airier look altogether. </p>
      <p>I believe that had the same "readership efficiency" test of acceptable word spacing been conducted then and now, the results would be different. People are more comfortable with what they're used to. Any laws of perceptual processing must be culturally specific: place, time, demographics.</p>
