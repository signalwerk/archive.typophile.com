      <p>&gt;optical-grammatical imperatives and gestural atmospheric wants ...are important by bringing up matters of the consolidation and extension of affordances, as a kind of epiphenomenal benefit or gift. Is there more that must be said that this doesn’t say?</p>
      <p>Well I may misunderstand you, as without concrete examples to illustrate your statements I find it hard to be sure what you mean. </p>
      <p>I take it by 'consolidation and extension of affordances' you mean that the type becomes more readable. I don't think this is a by-product or "gift" of the sense that type designers have of something being 'not right' and feeling a need to adjust proportions of a glyph or weights of parts to make it 'work', as John put it. </p>
      <p>My feeling is that a big part of the sense of something not being right relates to good rhythm and even color in the type. These are the <em>same thing</em> as what promotes readability, and indeed makes good text types more readable than handwriting. So a large part of 'working' and 'being right' is readability--not a different variable of which has the consequence of helping readability. </p>
      <p>So if you mean by 'epiphenomenon' a by-product, then I don't agree. But if you mean that the sense of rightness includes good color and rhythm, which are part of readability, then I agree.</p>
      <p>&gt;[Changes came about] because of perceived or intrinsic difficulties reading benchmark writing, or dissatisfactions with how writing looked. That just seems to me to be a damaging, derogatory and unhistorical way of conceptualizing the changes that took place.</p>
      <p>I did not mean to imply that type designers were dissatisfied with the way writing looked. As I said above, I liked your analysis that the regularity of type gave rise to a new standard. Variations that would have been submerged in the general variability of handwriting became obtrusive because of repetition of the same characters over and over again in type. But the net effect of being hit with what looks 'wrong' and the new ability in punch cutting to control outlines to a finer degree of tolerance had the result--through the eyes and hands and imagination of great designers--of type that surpassed the readability of handwriting.</p>
