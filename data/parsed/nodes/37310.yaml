      <p>John:</p>
      <p>"I don’t think Baskerville’s types are at all curios in the context of English neo-classical book design; indeed, it is hard to imagine such design without them, and all the other types of the style — Bell and Bulmer, for instance — are heavily indebted to Baskerville even if they are, in many respects, more useful typefaces."</p>
      <p>–</p>
      <p>"English neo-classical book design;"––pseudoclassical/neo-classical, I consider that movement "faux", don't you?</p>
      <p>–</p>
      <p>"it is hard to imagine such design without them,"––That would have been a good thing.</p>
      <p>–</p>
      <p>Look–I have used Bodoni which is even more extreme, but in my opinion, a far superior work to the others. Fleurons were not employed, rules were, printed on Carlyle Japan a bright white paper. The second colour after black was out–of–the–ink–pot warm red.</p>
      <p>I was out of my elements other than craftsmanship and a vague idea about design. I was not embarrassed by the design but was not encouraged by the type face enough to chew cud. Although I am responsible for Bodoni 26.</p>
      <p>What faces do I lean toward? Well I don't mind Pastonchi, Cochin, Garamond and many Goudy faces. I was known as the typographer that made Goudy look good. I thought Goudy made me look good. In my hot metal days I would have happily employed some of Jim Rimmer's faces. But the most beautiful face, in my opinion, is Centaur.</p>
      <p>Bruce Rogers, come to think of it, was pretty handy with fleurons in his own book designs. Did I mention–Caslon cut ornaments for book binders before he became a typefounder.</p>
      <p>Your observations on my work has made me ponder. There was harmony in my work, however somewhat accidental if taste is not counted. I was using Caslon long before I discovered fleurons. I easily recognized my gift with ornaments, possibly a genetic one from my great–grandfather who was the King's weaver. I don't care about Kings, but appreciate excellent weaving.</p>
      <p>I think Baskerville would have kept me awake at night wondering what to use in the way of fleurons, but call me crazy, I think Bodoni would work with art-deco ornaments. Perhaps I should give it a try.</p>
      <p>Sorry that I don't like what I don't like.</p>
      <p>Chris, hello to you. I think of you every time I cook saganaki.</p>
