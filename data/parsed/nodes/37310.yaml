      <p>Peter, at the moment I only have Harry Carter's book, which doesn't have large pictures of Jenson and Griffo's type. However, he does have a big picture of Garamond's type, which I think will suffice to make my point. Here it is, a fresh printing type made from Garamond's original matrices of the Gros Canon size:</p>
      <p> </p><div class="imageWrap"><img src="http://typophile.com/files/Garamond Gros Canon 595 px_3923.gif"></div><p></p>
      <p>What we can see here is the kind of optical correction that is <a class="freelinking external" href="http://briem.ismennt.is/2/2.3.2a/2.3.2.06.illusion.htm" rel="nofollow">documented here</a> by Briem. The O overshoots compared to the H. That might have been done by scribes, but not the increase in the weight of the vertical curve of the D compared to the stem of the D. If it were drawn by a pen of fixed width, the horizontal width of the D curve would be the same as the stem. </p>
      <p>Also the diagonals don't follow 'pen' rules. If the pen were held at a fixed angle, corresponding to the slope of the head serifs, then the diagonals would be thicker. But the fat diagonal on the x is about the same as the vertical of the h, not thicker. (That's not documented by Briem, but is common in type.) And the Z and z have the stress reversed from what a written Z would have with the pen held at a constant angle--a thick, not a thin. The bottom curve on the c and c look thicker than the horizontal at mid-height, but it they are actually the same, not thicker. They rely on optical illusion to get the appearance of thickness. </p>
      <p>Furthermore, the small, delicate the serifs also may not follow what can be done with the pen, but are rescaled because of the designer's ideas, not the pen. </p>
      <p>Also Noordzij himself notes that Garamond may have occasionally curved his outside corners in larger sizes, and that may have been "intended to look like enlargings of the <em>printed</em> small sizes." (Noordzij's emphasis)</p>
      <p>Garamond may have been influenced by the rising mannerist tide, though Bringhurst, at least, categorizes him as "high Renaissance," not mannerist. </p>
      <p>Peter, you may call this "regularization" and may debate whether it was done for aesthetic or readability reasons. My point is that whatever the reason it violates pen rules, and is a critical departure from the pen, in favor of the eye. </p>
      <p>Another important factor here is spacing and width of characters. If you look at the example of formal humanist writing that John posted on Sept. 23, above, you will see that the spacing and the width of characters varies continually. If you look at Jenson or Griffo, as well as Garamond, there is a strikingly different rhythm. Part of this was no doubt that they had to decide on one width for all the 'n's, for example. And in general there had to be sufficient space to put one piece of type next to the other, with a wide enough 'beard' to keep the type physically strong. But these physical constraints I think pushed them to creatively think: what are the best proportions and spacing for the lower case? And here they came up with a pattern that was not an imitation of writing but decisively different and more readable. </p>
      <p>My overall point here is not that Noordzij is wrong about the huge influence of the pen. I acknowledged his innovative insights at the beginning, and now I see he is even more right than I realized earlier. However, he does neglect another important part of the story, which is specifically typographic, and is different from or actually contradicts the patterns of the pen writing. These I have sketched a little bit of here.</p>
