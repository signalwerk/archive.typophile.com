      <p>I wonder if I can offer my own view of some of these topics without disrupting the thread (as sometimes seems to happen).</p>
      <p>A long time ago I put together an argument and some images under the title ‘English vernacular', and I returned to the theme this year in <em>Forum</em>, the journal of Letter Exchange, and in papers at Bologna and at ATypI in Brighton.</p>
      <p>The title is ironic, since ‘English' refers to the round hand script of 1700 and after that was called English in France and other countries (<em>l'écriture anglaise</em>), but derives from French, Dutch and, above all, Italian models. My hero then, as now, is the calligrapher Giovan Francesco Cresci, who introduced flowing writing using the flexible pointed pen in about 1560, and changed the shape of Western writing and typography.</p>
      <p>The common charge against the new calligraphy is that it was not only unnatural (since Nature had ordained the broad pen) but that it was a perverse attempt to copy the brilliant work of copper plate engravers. That is only to say that the new generation of Italian (then Dutch and French) copy books was indeed engraved on copper and that the style was increasingly used in the lettering of maps and prints. I think stylish and brilliant copperplate models are to some extent responsible for the increasing contrast between thick and thin that appears in the bigger types of the 17th century (these have been noted in this thread), and I would add to this the tendency of their serifs to become thinner, the appearance of ‘fish hook' serifs in the C, G and S of Dutch types like Van Dijck's (and their adoption in England) and the appearance of the calligraphic double-curve to the tail of capital R that can be seen in several 17th-century English types.</p>
      <p>If the 18th-century ‘English' style became a force to be reckoned with in the history of writing and type generally it was because of the increasing strength of British industrial power at home and the creation of a new maritime empire, based on trade, and held together with a web of paper documents, bills of lading, letters of credit, and so on, that needed to be clearly, accurately and impressively written. Hence the rise of the English writing masters, and sooner or later, their power to influence print. It is symbolic that this was achieved by a writing master who became a successful self-made industrialist in the boom town of Birmingham, miles from the tightly-knit, conservative book trade of London. Caslon, a Midlander like Baskerville, chose to join this conservative world and did very well for himself by catering for it competently, whereas Baskerville was notoriously seen by many Londoners as a strange being from outer space.</p>
      <p>Incidentally, Nick, the notion of British ‘perpetual copyright' was not so much changed by law in 1774 as be discovered to be non-existent – but you are right in pointing to the legal case of this year as a key event which decided the matter. It generated a boom in competing editions of the same text for which new types and new wove paper were used as promotional features. And this opening up of the market for books, which fed off the rise of a new rich middle class, generated a demand for the new, distinctive, ‘modern cut', types of the 1780s and after.</p>
      <p>If I can marshal these arguments effectively, I shall do my best to use them in a new text of ‘English vernacular'. And I shall be delighted to go on reading debates like this one that will help me to get things right.</p>
