      <p>Gerrit Noordzij was kind enough to e-mail me scans of a piece of hand written calligraphy from 1605 and an engraving of the same piece. [I have reduced their size to fit in the Typophile window.] </p>
      <p>Here is the original handwriting of Jan van den Velde, </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Velde  manuscript copy_4545.gif"></div><p></p>
      <p>and the here is an engraving of it by Frysius.  </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Frsius  engraving copy_6139.gif"></div><p></p>
      <p>As is obvious, these are extremely close. </p>
      <p>He also refers me to his last chapters in Letterletter, where he discusses Mannerist writers and the engraving of their writing. Both he and scholar Amy N. Worthen, whom he quotes at length, argue, convincingly, that engraving did not influence writing, but the other way around. </p>
      <p>The question of whether changes in aesthetic ideals were driving changes in writing and writing instruments is still an open one, at least for me. </p>
      <p>As to the specific issue of the influence of the flexible, pointed pen on Baskerville, as I have said, I am now convinced my initial idea about Baskerville in this thread was wrong. Furthermore, Gerald Giampa makes a good point that Baskerville may have meant by 'emulate' that he was trying to equal or excel Caslon, not that he was imitating him.  </p>
      <p>As to the influence of the typographic ideal on Baskerville, I do think that this is still sound. I don't think that the typographic writing of Shelley and Bickham posted by John could have ever been done had not Jenson and Griffo earlier established a specifically typographic look for roman type. This includes the uprightness, regularity of design, and violation of broad pen rules for the sake of greater evenness of color.  </p>
      <p>Baskerville does use the pointed pen line in his arches and round to stem joins, but he introduces these changes in line with restraint, and in the service of a very rigid, upright design that breathes the spirit of past roman type. John and James may not like the term 'transitional', and it is in a way unfair to Baskerville as he was not fumbling toward a different solution, but realizing his own coherent ideas. Nevertheless, compared to Didot and Bodoni, the use of the pointed pen line--changes in expansion largely independent from direction--Baskerville is a lot more restrained and limited. In that sense it seem to me fair to say that Baskerville is a transition to those who used the expansion-contraction line more fully in their types.</p>
