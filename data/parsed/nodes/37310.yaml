      <p>I'm having a little trouble letting this thing sit just yet, so I'll give it another go.</p>
      <p>After some more reflection, here is what I see now through my ‘perceptual processing in reading’ lens. (It probably brings me closer to what you, Bill, feel to be the case, but this way of framing it eases my reluctance.)</p>
      <p>I'll start with this: Gerrit Noordzij sees the middle ages as the period of the consolidation of the word.</p>
      <p>In writing with the broad-nibbed pen the consolidation of affordances approached a kind of stall-point or highpoint or limit around the time type made its entrance. In type the consolidation dynamic could continue apace concurrently or be productively resumed because of the less constrained feature manipulation it allowed. Feature manipulation overtly addresses optical-grammatical (‘look’) issues (like regularity, or evenness of colour) and gestural-atmospheric (‘feel’) wants (like, greater angularity or cursivity or varied stress), all the while — just under the surface of conscious awareness — re-mapping visual-wordform resolutional affordances, quietly adjusting its thresholds and ranges, and basis.</p>
      <p>Because it re-tunes the basis, it requires a small-incremental reconditioning of it’s victims (a pick-up phrase originating in some other context from some of my conversations with Noordzij). But the re-tuning of the thresholds and ranges are real readability gains. </p>
      <p>So to me this says the greater feature-manipulational flexibility in punchcutting, could initiate a consolidation of the readability affordances of writing beyond writing, though not without a cost. The cost is growing distance from the readability and character of first-rate scribal writing, especially when you factor in the unfamiliarity of the foreign or earlier mother tongue.</p>
