      <p>I've been busy repenting on Yom Kippur, so I couldn't post. Looks like you guys should have been repenting too :) </p>
      <p>1. For a theory to have scientific status it should, according to Popper, be *potentially* refutable. That is, they should exclude some events about which we can actually check whether they happen or have happened under the specified conditions. </p>
      <p>For example the simple claim 'birth stars influence character' is not refutable, and so not scientific. (It may be true--or not--but that's another issue.) The claim that normal human conception involves an egg and a sperm is testable. You can look with a microscope and see whether the little creatures are there, and indeed they are. </p>
      <p>For a theory to be testable is not only a matter of logical form. Scientists also have to want to check by observation and experiment, and not try to weasel out of refutation by equivocation about meaning of terms, etc. As Karsten notes, Popper emphasized that the this process is a feature of science as a social institution, not just the attitude of a particular researcher. </p>
      <p>Nick and John, strictly speaking Newton's law of gravitation has been refuted. That's what Eddington's 1921 observation of a solar eclipse was about, testing Einstein vs Newton. Of course Newton's laws are approximately true and good enough in most circumstances. But that's not good enough. Einstein's theory  survived those tests better than Newton's.   </p>
      <p>2. Noordzij's use of the terms 'law' and 'rule' is a little idiosyncratic, but his point I thought was pretty clear, and sound: conjecturing scientific laws of perception in reading is a healthy open-minded process, whereas demanding conformity to rules based simply on one's own authority is pretty ridiculous, however accomplished the person. </p>
      <p>3. Nick, the laws of human perception do limit print legibility. Print black on black and it's hard to read because of low contrast. Print it at 3 point, and people will have an extremely hard time reading it because of size. Now such issues as spacing the science is much more complicated and confused. But that's because the science is not that good yet, not because scientific results are in principle irrelevant.</p>
      <p>4. On the influence of changes in writing technology and practice on type design. Noordzij's theory is very interesting, and may indeed be one influence. </p>
      <p>But here Noordzij starts sounding like Tschichold, and makes his theory the one and only influence, which I think is absurd. To repeat, Noordzij wrote; "If we ask for the intentions of the type designers, we find that their work reflected their attitude to writing with little regard for previous solutions.”</p>
      <p>That type designers weren't looking at previous type and influenced by it is to me a ridiculous theory.   </p>
      <p>Let me start with my idea that Baskerville had studied Caslon carefully and was heavily influenced by his *type*. You say: "I really don’t see any influence of Caslon in Baskerville’s types."</p>
      <p>Ok, here's what Baskerville said:</p>
      <p>"Mr. Caslon is an Artist, to whom the Republic of Learning has great obligations; his ingenuity has left a fairer copy <em>for my emulation</em> than any other master. In his great variety of Characters I intend not to follow him, the Roman and Italic are all that I have hitherto attempted; if in these he has left room for improvement, it is probably more owing to that variety which divided his attention, than to any other cause." </p>
      <p>That as quoted by Alexander Lawson, Anatomy of a Typeface, p. 187, my emphasis. </p>
      <p>Now that sounds to me like a type designer. It is well aware of what the previous generation did, and takes that as his point of departure. He also puts in a dig that Caslon was sloppy because he turned out so much work (true). Baskerville changed a lot about Caslon, but for sure he was looking at *type* and not writing only.  </p>
      <p>I will discuss writing vs type further another time, and answer Peter's question, but this post is long already.</p>
