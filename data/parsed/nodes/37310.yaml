      <p>Bill, in the Garamond lower case you show above, the <em>pattern</em> of contrast is massively set by the translation <em>paradigm</em>. This does not depend on each and every characteristic of the Garamond type being executable to the finest detail by the tool it's contrast <em>type</em> derives from.</p>
      <p>The norm violations are incidental and — I think — progressive, i.e., in the direction of optimizing affordances, not relative — oppositionally — to writing, but inside the domain of the specific letter set they were creating.</p>
      <p>Writing set the spacing paradigm of rhythmic coherence between the interior and exterior forms of letters within words, and a break from this in the spaces between the words. Type designers devised their own ways of consolidating this as well.</p>
      <p>If the type designers asked themselves anything, it was probably: how can I keep spacing rhythmic in the new environment of rectangular sorts. What do I need to do to proportions and widths, and, with widths also — and in consequence — weights?</p>
