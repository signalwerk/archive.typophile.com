      <p><cite> And if by ’noise’ we include not only variation in letterforms or spacing but all those other factors that diminished the quality of so much printing then the manuscripts are by far the cleaner product. </cite></p>
      <p>If you get the objects themselves in front of you you will quickly see just how very true this is. And compared even to the vast majority of modern day printing this is still true. The level of detail possible is absolutely huge. </p>
      <p><cite> I don’t think even spacing and color forces a designer to iron out variation in shapes. Indeed variation in shape is often needed to achieve even color, because of the very different shapes of different letters. </cite><br>
      Very true. When I talk to people about contextual alternatives in text they often bring up the fear that it might produce a textuta-like over regularity of form. But I don't think that is remotely likely for the reasons similar to those that Bill gives above. A well tailored custom fit for 'Notan' will produce increased clarity re: the differentiation between letter shapes. Like an adjustment, an overshoot for example you have to have some judgement about it to achieve that effect, but like Bill I think equating an search for even color with literal regularity is  a false or at best a misleading idea.</p>
