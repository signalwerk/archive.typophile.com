      <p>[Bill] “[…] vertical stress seems more natural with the pointed pen.”</p>
      <p>The <em>only</em> tool that an expansion consistently perpendicular to the direction of the stroke and symmetrical relative to the “heartline” (Gerrit Noordzij) <em>is native to</em> is the pointed flexible pen.</p>
      <p>Or to say it in a less contorted way: The <em>only</em> tool that western expansion <em>is native to</em> is the pointed flexible pen. By ‘western‘ expansion I mean: an expansion consistently perpendicular to the direction of the stroke and symmetrical relative to the “heartline” (Gerrit Noordzij)</p>
