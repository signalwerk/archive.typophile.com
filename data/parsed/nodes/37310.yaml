      <p>Nick, this is precisely what I do in my practice. But the mind does not go blank.</p>
      <p>What I put forward in my statements has nothing to do with an "intellectual appraisal of rules." I made a statement about <em>disproportionate</em> word-spacing and <em>proper salience</em>. Proper salience, means the relative salience letter parts amd counters need if the words they comprise are to be read accurately and without difficulty. My statement was about what happens; how salience works. I can see what happens. I can see what my manipulations do, optical-grammatically, perceptual-psychophysically and gestural-atmospherically. </p>
      <p>The way salience works in vision has nothing to do with me personally, but everything to do with how the species I am part of functions or responds when confronted by letters in separated scripts at text sizes. Optical-grammatically and perceptual-psychophysically there are realities with ranges and thresholds. I can try to state what I see in words and sentences and make my observations more widely available. Is that what you mean by "intellectual appraisal of rules?" I can make predictions about the effect of my manipulations on various things that are foundational to reading, like visual wordform resolution and sense-following. I can test my predictions to see if they are right.</p>
      <p>My statement was about what happens. I have no issue with using my attunements to the effect of manipulating or modulating spacing on rapid automatic visual word form resolution in order to put in place typographic structures that arrest the reader, slow him or her down in certain contexts, focus attention, or make an over-familiar text strange (aka ostrananie), that is to use my awarenes of the laws of vision to effect my or my clients communicative needs or ends.</p>
