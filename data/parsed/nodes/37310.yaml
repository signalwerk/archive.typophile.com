    <p>That's the title of a “sharply critical” Gerrit Noordzij essay Robin Kinross has recently put up on his Hyphen Press site to accompany its recent realease of the Christopher Burke book on Jan Tschichold. You can find the essay <a href="http://hyphenpress.co.uk/journal/2007/09/15/rule_or_law" rel="nofollow">here</a></p>
    <p>As Kinross says, it “tells a large truth about how teaching can happen, and how learning can happen.” It probably also has something important to say about what typophiles might   strive for.</p>
    <p>Peter Enneson</p>
