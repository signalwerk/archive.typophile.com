      <p>This is an interesting discussion to me, if slightly esoteric. I've ranted, on and off, for a few months now—not in these environs—about, for want of a better term, <em>Tschichold to excess.</em></p>
      <p>One thing I want to point out concerns the sample brochure above. In a lot of ways, it's an attractive piece, judging from the small amount of it we see. But as enne_son rightly points out, the word-spacing is a problem. That first line had word-spacing you can drive a truck thru.</p>
      <p>Granted, working in as many books as often as I do, that's a particularly annoying issue for me. And I don't care which software I use—Quark, InDy, formerly PageMaker, vaguely remembering FrameMaker—I need to go thru line-by-line of every page to make sure I like the looks of all lines and their word-spacing. (Letter-spacing isn't even an issue; just goes without saying.)</p>
      <p>So what I'm saying is, this is a nice theoretical discussion, but it still comes down to how type on the page looks. Each and every time.</p>
