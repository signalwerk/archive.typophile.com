      <p>Bill, the fact that Baskerville's types display only <em>some</em> of the contrast patterns that may be produced with the split nib is not an indication that the split nib, via the lettering of the contemporary writing masters -- including Baskerville himself! -- is not the primary influence. One also doesn't see the kind of parallel strokes of different contrast in the formal roman letters written by those writing masters, as seen in the illustrations I provided above, only in their cursive 'script' styles. The reason you don't see it in the roman letters is that such parallel strokes are not a part of the letterform.</p>
      <p>The fact remains that you can't produce Baserville's letters using any other writing implement but a split nib. The fact remains that Baskerville was a master of writing with the split nib. The fact remains that English writing masters were producing roman letters in his style several decades before his first types were cut. The fact remains, that other than blackletter, all the styles produced by these writing masters were based on the dynamics of the split nib.</p>
      <p>By the way, the example of large letters produced by George Shelley, presented by Beatrice Warde in her <em>Monotype Recorder</em> article on Baskerville and reproduced by James above, is dated 1715. Today I found an example of much smaller roman letters written by Shelley (about the size of the main body type of Baskerville's Milton) in 1709. If you didn't realise it was written and not type, and someone asked you to name the typeface, you would say Baskerville. I'll post a photo shortly.</p>
      <p>*   *   *</p>
      <p>If you are going to introduce the Roman du Roi, then I would say that we have to start paying attention to French writing masters as well as English ones. Just as you can't ignore what English writing masters were producing in the decades before Baskerville's types, you can't triumphantly point to the precedence of the Roman du Roi without taking into account what French writing masters were producing in the decades before it was devised. Thankfully, we happen to have one of the the foremost authorities on the Roman du Roi reading this discussion. Thankfully, also, I happen to have his book. Page 32 shows 'Devises pour les tapisseries du Roi, 1668.... la calligraphie est vraisemblablement de Jarry'. Do I need to say that it shows essentially the style of the Roman du Roi type, written with a split nib pen, thirty years before the cutting of the typeface?</p>
      <p>*   *   *</p>
      <p>Pace Harry Carter, Dürer's constructed letters, like the numerous other renaissance exercises in attempting to devise or prove a geometric basis for roman capitals, exist entirely outside the mainstream of text production. They have nothing to do with the making of text, either in manuscript or in type. </p>
      <p><em>As Harry Carter argues in the earlier passage I quoted, the effort to find a geometrical ’true’ paradigm for the letters freed punch cutters to change their types from what the scribes had done.</em></p>
      <p>It's a nice idea, but I don't think there is visual evidence to back it up. Punchcutters are providing types to produce text, within text cultures. The theoretical and conceptual exercises of artists, accountants, and varied other people who dabbled in the geometric construction of letters seems to me to have had remarkably little influence on the development of typographic letters. This isn't surprising, because such exercises had remarkably little impact on the contemporary text culture.</p>
      <p>What Dürer and other letter-constructors were trying to do was to establish a geometric basis for the classical roman capitals. That is, they were taking something that already existed, and trying to map it to various kinds of geometries to see how well it fit and to iron out suspected non-rational inconsistencies. I think the committee and draughtmen responsible for the famous engraved Roman du Roi plates were engaged in the same kind of exercise: taking the kind of letters being written by master scribes like Nicolas Jarry -- employed in the service of the same king as the makers of the Roman du Roi --, fitting them within a grid, and imposing geometries on the construction of details. In the process, they rationalised many aspects of the construction. What is interesting, of course, and oft remarked on, is that Grandjean's actual type does not follow these engraved plates. It is, in fact, very close to Jarry's 'calligraphie'. Why? <em>Because that's the contemporary text culture.</em></p>
    html_clean: |-
