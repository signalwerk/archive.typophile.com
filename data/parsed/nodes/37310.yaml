      <p>Thanks for that Peter, the ascent/descent of type. To the point of how much more objective we can be about the history of our craft than the "average" historian, I think it goes on and on until we test the flexibility of the exact kinds of tines they made to be sure of 90% of what we think we know.</p>
      <p>I also like James' introduction of the relationship between the text type they were setting and the display type they were drawing or engraving to accompany it. I am comfortable setting or recommending the setting of text (8-10.99 pt) in oldstyle even if a transitional or a modern is set above it in the display size. Starting at 11 or 12 pt. a mix such as this becomes dicey. But I am very uncomfortable setting or recommending an oldstyle above a modern at any size. </p>
      <p>So I'm assuming these effects on form in visual wordform resolutional include our desire to see things more handwritten the smaller they are, (probably to a point) in the same way we are more comfortable with wood upon stone rather than the opposite, which gives me the creeps, worse even than oldstyle display above modern text.</p>
      <p>Cheers!</p>
