      <p>&gt;Writing is neither unreadable, nor is it ugly.</p>
      <p>Writing can be beautiful or ugly, just like type. Perhaps I should have said for 'stylistic reasons'. The point is that you might want to modify a glyph in a way that is further from writing to get the look you want. To take a clear-cut example, the Futura lower case 'a' was an attempt to be geometrical and have no trace of the movement of the pen in it. </p>
      <p>As to readability, I accept the old notion that extended text is most readable when set in a lower case serifed roman, and every departure from that decreases ease of reading, and possibly speed. Certainly I think hand writing can be quite readable, but as a rule in extended text it is much less easy to read than printing. The formal hands were partly an attempt at regularity that helps reading, but I don't think even the best of the formal hands is as easy to read as good type, well set. </p>
      <p>&gt;The poor quality of Metafont font’s isn’t really that a product of the fact that it was pen-influenced, but that a mechanically tractable parametrization of a mechanical pen’s enabled behaviours and dimensions can’t respond effectively to the optical-grammatical issues adjusting values over those parameters evokes.</p>
      <p>I think you mean "mathematically" rather than "mechanically", as what is involved here are equations, not a physical device.</p>
      <p>In any case the problem is not, I think, finding the mathematics to express each desirable modification. It is that you'd have to have modifications for each letter of each font, so it is quicker just to design the damn outline. </p>
      <p>To put it another way the modifications are just do specific, and the what pleases the eye too complex and unknown as yet to produce a general mathematical model what would cover all cases, give a relatively small set of 'quirk-notes', as Hofstedter calls them.</p>
      <p>For example, the stem on the B is often reduced by a few units relative to the H, which helps even color, as the bowls of the B will otherwise make the stem look a little fat. And so sometimes is the last, thick stem of the M reduced. Again, you have some visual crowding with all those diagonals in a small space, and lightening the thing helps. Question: What is the rule for how much you should reduce the M, given the B? Answer: there isn't any rule. For the eye, it will probably depend on the contrast, boldness, serif if any, width of the glyph, optical size, etc. etc. </p>
      <p>And different people will make different decisions. Matthew Carter will make good decisions. Some others won't. Carter's font will read well, and look good, and another's might not. Still others will make good decisions different from Carter's. Type design, as has been often noted by such experienced designers as G. Briem, is a series of thousands of decisions--at least one or two for each glyph, in each style, and sometimes in each weight.</p>
      <p>Now the thing about those decisions, such as on the stems of the B and the M, is that they are <em>type design</em> decisions, not <em>writing</em> decisions. They concern details that are at a level of precision that is generally not possible in writing, but is possible, and indeed demanded by a professional quality text font. </p>
      <p>It is because I am right now wrestling every day with these demands of a quality text font that I am so insistent that very many of these decisions are not writing decisions, and that they do make an important difference. Perhaps Noordzij was unimpressed by the 'quirk notes' idea for similar reasons. They aren't quirks, they are type design.  </p>
      <p>Of course you could say with some justice that all type designers are quirky, but that's what it takes :)</p>
