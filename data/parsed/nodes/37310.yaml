      <p>Peter, I have always acknowledged that humanist formal writing is the starting point of type, and has remained an "unlying force" in type--even in Bodoni etc. </p>
      <p>What drives changes? I have said I like your ideas that irregularities that pass in handwriting will become problematic in type. </p>
      <p>Whether the creators of type thought 'that doesn't look right' or 'that is distracting' or 'that isn't so smooth for reading' or whatever, I don't know. I think there is an intuitive reaction of 'rightness' that reflects how our visual apparatus works, and that was at work in their minds, as it is in ours. </p>
      <p>It think also that aesthetic fashions were huge influences. I would guess that these drove both the adoption of the pointed, flexible pen nib, and the development of high contrast type--the same forces behind both, though the particular line of the pointed pen also influenced Baskerville.</p>
