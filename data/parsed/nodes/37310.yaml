      <p>Bill, because I don't know how to take the sentence in the abstract that you quote from, I've re-read the essay you refer to. </p>
      <p>To find out what Noordzij means when he says “design shapes human life,” or “a civiliztion is a mode of design” you have to look at what he does. </p>
      <p>What Noordzij does is define civiliztions, the cultures that exist within them, their beginings and endings, by attending to what happens in it's writing, that is, what happens to the stroke. So for instance ‘his’ “Middle Ages” “begin in the 7th century when an Irish scribe invented the word,” and he defines the Middle Ages as the period of increasing contrast. </p>
      <p>According to Noordzij, “the new unit of writing could be strengthened by reducing the white shapes between the letters which demanded a corresponding reduction of the white shapes within the letters. During the Middle Ages the size of the letters in respect to the width of the pen was gradually reduced.” He continues: “I have never found something like a mediaeval mood which fosters this process. It is more sensible to understand <em>Middle Ages</em> as the name of this process.</p>
      <p>Noordzij does the same kind of thing for other epochs as well, up until the 20th century. And he begins to show that what happened with contrast through the space of the period is representative of what happened, or paradigmatic. </p>
      <p><em>Middle Ages</em> as the name of this process. That is all that is claimed. And that is all design ‘shaping’ human life should be taken to mean, or so, at least I think. </p>
      <p>The statements are all about identity, definition and paradigmaticity; <em>his</em> Middle Ages, Mannerism, Classicism. Baroque. There is nothing about causation, or a driving force. And <em>his</em> may not correspond exactly to yours or that of the others.</p>
