      <p>It's a task of writers and scientists to explain what artists and designers do, and perhaps offer them guidelines.<br>
      (And Guide is a word I prefer to Rule or Law.)<br>
      But ultimately art, design, language and maths have different ways of thought, and in as much as language and science continually attempt to define and proscribe art and design, art and design are always evolving their territory to render the map obsolete.</p>
      <p>I find it strange that there is an expectation that typography should be subject to simple objective rules or laws about such things as line length. So while I agree with Noordzij's notion of "conjectural laws" of typography, I'd have to say that any "law" I have come across has nevertheless only ever been a generalization or best practice, and exceptions which disprove such theories are not difficult to produce in number.</p>
