      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bickham sample_3478.gif"></div><p></p>
      <p>I see here several things different form the broad pen type of writing, beyond greater contast. First, in the O we see that the pointed, flexible pen is able to get strokes in the same direction and same angle of different thicknesses. These are cleverly used a 'echo' shapes of different weights. Second, instead of the 'twisted ribbon' look of a broad pen changing direction, we have a gradual, sweeping swelling and diminishing of the stroke, and an ability to change angle without changing width (the left stroke of the N). . </p>
      <p>By contrast, if we look at the typographic letters of Shelly, above, or at Baskerville, see more vertical stress, and greater contrast, but not the kinds violation of the broad pen as in the pointed pen script. Here is Baskerville:</p>
