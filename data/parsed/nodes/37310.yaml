      <p>Bill: <em>I don’t know the history of handwritten scripts, but my impression is that after type and printed books become widespread, people generally didn’t take pains to write the formal, more readable upright humanist script. They were writing slanted, cursive hands that had less to do with the formal, highly readable upright script. Type was more readable than any script, so if you really wanted maximum readability you could just have it printed.</em></p>
      <p>Who says that 'type was more readable than any (handwritten) script'? This is a totally untestable supposition. Printed texts were quicker and more economical to produce, and they enabled text to be cleanly reproduced at smaller sizes than are comfortable to write, again making type more economical than manuscript. These factors alone account for the spread of printing. I've looked at a heck of a lot of manuscripts, and I don't think you can make a general case that type is more legible than writing: much depends on the quality of the individual production, whether the result of a better or worse scribe or a better or worse printer. Frankly, an awful lot of early printing was very bad, which we tend to forget because only the best stuff became famous and gets reproduced in histories of typography. The types got worn very quickly because the metal mixes were not right. The inking is uneven and the pressure is inconsistent. A lot of contemporary manuscripts were better, not least because the renaissance scribes realised that they were in competition with the new technology and needed to show just how good manuscript books could be. There was a late flowering of the European manuscript book tradition after the advent of printing; in the end it wasn't sufficient to counter the financial advantages of print publishing, but it produced some extraordinarily beautiful books that were specifically made to compete with print on the grounds of quality, including readability. I strongly recommend Jonathan Alexander's <em>The painted page: Italian renaissance book illumination, 1450-1550</em> for a well-illustrated overview of this period (it also deals with illumination of printed book).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/humanist_3920.jpg"></div><p></p>
      <p>I don't think it is possible to look at a manuscript like this and make a claim like this:</p>
      <p><em>Jenson made the biggest leap, in my view, in making his type more upright and more even in color than hand writing, and so strikingly more readable.</em></p>
      <p>Jenson's biggest leap was to render the culturally acceptable form of humanist letters in type, so that the new technology would be accepted for the production of the kind of texts that the Italian renaissance readership (all of whom, as Bringhurst has drawn attention to in various places in the past few years, were not only readers but also writers). Sweynheym and Pannartz had begun this process at Subiaco and Rome, but never really got away from the blackletter. Jenson was more comfortable with the humanist script, so knew better how to cut letters to that model.</p>
      <p>It shouldn't be necessary to point out that people are still making text faces based on those writing models, e.g. Adobe's new Arno Pro.</p>
      <p><em>On Jenson and Griffo. You say that hand scripts had not changed much between the two, which would indicate that Griffo’s inspiration was not from hand written script.</em></p>
      <p>What I actually said was that the characteristics of both Jenson and Griffo's type are found in the larger context of Italian humanist text creation that includes manuscript hands. Like Peter, I'm not sure I know what it means to say that Griffo's letters were 'more typographic', other than perhaps more regular. It shouldn't surprise us is that there is greater variety in the many individual manuscript hands than there is in the relatively small number of typefaces -- some of which are merely copies of other printers types: that sort of 'emulation' has always been with us --, and that the types represent only a subset of the ideas and forms found in the former.</p>
      <p>I'll agree with you that Noordzij sometimes overstates the case for writing -- which is why I prefer to draw attention to the overall phenomenon of text creation in which there isn't a compartmentalisation of writing and type, but only a single activity of making texts for people to read --, but Noordzij's overstatement is nothing compared to the uniquely typocentric view presented in most histories of typography, many of which completely ignore or gloss over the role of writing in the contemporary text creation cultures.</p>
