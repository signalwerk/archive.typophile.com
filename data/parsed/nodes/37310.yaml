      <p>Bill: <em>If they modify and contradict the rules of the pen in a systematic way, I don’t see how they can be anything but an essential change.</em></p>
      <p>Because they dont contradict the rules of the <em>stroke?</em> I think Peter, and almost certainly Noordzij, consider the stroke pattern as the essential characteristic, and the various parachirographic tactics that modify weight and otherwise adjust the arrangement and relationship of strokes do not change the paradigm established by the stroke pattern. So, for instance, Garamond's D includes certain adjustments to stroke weight that contradict the rules (characteristics) of the broad nib pen, but the strokes remain describable in terms of translation and rotation (the latter showing the mannerist influence).</p>
