      <p>Stefan, that's a higher resolution scan of the same page as above, from Harry Carter's <em>A View of Early Typography</em>. If you are interested in history of type, it's one of the best books, and it's in paperback, not too expensive. </p>
      <p>Thanks, John. I am not sure how best to characterize the departures of type from handwriting. To investigate it properly would involve taking good scans of Jenson, Griffo, and Garamond, blowing them up and writing over them with a broad pen. That would be very interesting, but not something I'm likely to do any time soon.  </p>
      <p>&gt;I’ve always liked the [analysis of letter shapes] implicit in Douglas Hofstadter’s response to Donald Knuth’s concept of a Metafont (Visible Language, Volume XVI #4 (Autumn 1982). Others might like others. ...But in my discussions with Noordzij about Hofstadter’s he seems to see it as antithetical to his.</p>
      <p>Peter, I think the failure of Knuth's Metafont as a way of creating letters is very interesting and perhaps revealing of the differences between handwriting and type. I believe Knuth's ideas appeared in print at about the same time as Noordzij's, and have some striking similarities, along with differences. Noordzij writes of a moving shape--tip of the pen--and its rotation and expansion. Knuth I believe has a single line, and rules of expansion of that line. </p>
      <p>Can you briefly summarize Hofstedter's view? Does Noordzij object to Knuth, or Hofstedter, or both?</p>
      <p>John has, as I remember, explained that in developing non-latin fonts he sometimes uses the pen to understand the ductus of a non-latin script. But then for creating a font he "sculpts" digital outlines, like almost everybody else these days. </p>
      <p>This process of understanding the underlying writing, but actually sculpting outlines, I think reflects the reality of type--that it is modified handwriting. Both the fact that it has a base of handwriting and the modifications are essential. But the much of the work of type design is in sculpting the outlines. </p>
      <p>The fact is that we could use digital pens to produce fonts, but in general we don't. And the more pen-influenced approach of Metafont resulted in poor-looking fonts, according to Richard Southall in his book 'Printers Types in the 20th Century'. </p>
      <p>So I'm thinking that the departures from writing, both for readability and aesthetics, may be a quite large percentage of what is involved in type design.</p>
