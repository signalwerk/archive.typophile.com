      <p>Bill, I'm talking about the translation stroke pattern, in which the angle of the moving front -- the broad nib -- is constant throughout the stroke. Note: not necessarily constant across every stroke in every letter, but within each individual stroke. And my point is that where e.g. Garamond's letterforms differ from the scribal model on which the roman types were based they do so in ways that are consistent with the translation stroke pattern. This is why I say they are transcending the pen, not contradicting it: the logic of the stroke pattern is extended and applied independently of the model, but the strokes remain informed by the translation pattern, not by some other pattern.</p>
      <p><em>A theoretical pen is irrelevant to causation in history, because it didn’t exist and it didn’t drive the historical development.</em></p>
      <p>Well a theoretical pen exists as soon as one thinks of it, so you can't say it did or didn't exist without knowing how the punchcutters thought about letterforms. But I don't think a theoretical pen, i.e. a theoretical understanding of the moving front such as Noordzij has developed, is necessary to applying the stroke pattern of particular writing implements systematically and independently of that pen. Type designers do this all the time, and stonecutters and woodblock cutters have been doing it much longer: you get a feel for a stroke model and how to apply it and, yes, also how to manipulate and transcend it.</p>
      <p><em>There are typographic solutions to typographic problems, and these are not trivial, and not simply derivative from writing.</em></p>
      <p>Absolutely. In this I completely agree with you, and much earlier in this discussion I referred to some of those specifically typographic problems that are associated with scale. But when we are talking about the development of styles of type and typography -- as we are when we start talking about what distinguishes Baskerville's types from Caslon's --, then we need to incorporate in our view a much broader text creation culture, and not limit ourselves to 'type history'.</p>
