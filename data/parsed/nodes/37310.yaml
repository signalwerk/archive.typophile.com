      <p>“Furthermore, this movement away from writing continued, I suspect, up to at least Garamond.” [Bill]</p>
      <p>Is the movement in Griffo away from “translation,” the contrast type charactersistic of the broad-nibbed pen? Are the norm-violations ‘essential,’ and ‘genotypical’? Or do they represent feature-manipulational adjustments upon a translational frame.</p>
      <p>So if the translation model for apportioning contrast is retained — and that, I think is the definition of the old characterization Old Style or <em>Ancienne</em> — is it right to speak of a movement away from writing in any essential sense?</p>
      <p>I wonder if, in other words, the characterization “away from writing” and “toward readability” is, to use Nick’s term derogatory and probably insensitive to our own conditioning.</p>
