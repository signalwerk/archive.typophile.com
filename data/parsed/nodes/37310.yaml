      <p>Peter: <em>The direction of the change is not anti-chirographic, though structurally the norm violation is dramatic when seen against the translational contrast paradigm.</em></p>
      <p>Only if you are presuming that the translation stroke paradigm does not permit rotation <em>between</em> strokes. But this is clearly not a requirement of the stroke paradigm, as the Byzantine Greek cursive style demonstrates: it is a matter of application of the paradigm to particular ways of writing. So what is violated in the z is the norm of the humanist bookhand way of writing (although I wonder if a sufficiently broad and deep search might reveal a precursor to this apparently typographic innovation?), not the translation stroke paradigm. What the possibility of rotation between strokes implies, of course, is that there is no such thing as a translational <em>contrast paradigm,</em> only translational contrast conventions of particular styles. Now, any style of writing based around the use of a broad tool is likely to make full use of contrast, i.e. it is unlikely to involve rotation such that contrast is eliminated. But nowhere does the translation stroke model imply a consistent angle or, hence, a consistent contrast pattern. The stroke model is a description of what happens <em>within the stroke.</em> What happens between the strokes, or on top of the strokes, is all application.</p>
