      <p>Nick: <em>Well OK, let’s say that some of Newton’s laws have stood the test of time.</em></p>
      <p>You mean that have been a reliable basis for prediction and have not been disproven by contrary evidence? Sure, but what makes them laws in the scientific sense is that they are disprovable. The fact that they have not been disproven to date and may never be disproven neither contributes to nor detracts from their classification as laws. What makes for a scientific law is falsifiability, and that is an inherent property of the formulation of the law, not something that is determined by time.</p>
