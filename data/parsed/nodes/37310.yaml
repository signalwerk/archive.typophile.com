      <p>John, you write "no one is claiming that the pen, per se, drives everything."</p>
      <p>That may be an exaggeration of Gerrit Noordzij's view, but is only a slight exaggeration. His view is clearest in a summary article, "The Shape of the Stroke", which Peter was kind enough to send me some time ago. It contains information also in Noordzij's book "The Stroke", which as you know Peter translated--thanks Peter! It is particularly concise in expressing Noordzij's views. Here is the abstract:</p>
      <p>**<br>
      1. Design Shapes Human Life.<br>
      2. A civilization is a mode of design.<br>
      3. The primitive artifact (the 'DNA' of a civilization) is the single stroke of writing.<br>
      4. The stroke is a shape.<br>
      5. It is defined by a description of its two dimensions.<br>
      ** </p>
      <p>The first sentence of the first section: </p>
      <p><em>"Western civilization is the cultural society which is communicating in Western writing."</em> (Italics are Noordzij's.) And then at the end of that paragraph he repeats: "Writing is the cultural paradigm." And note that writing and print are not the same thing for Noordzij. </p>
      <p>My reading of this, which I think is a reasonable interpretation, is that western civilization hangs on the stroke of the pen. This is reinforced by Noordzij's dark forebodings that Western civilization is threatened by not teaching children handwriting. </p>
      <p>This is what I am objecting to as exaggerated. I think that since the introduction of printing, and the achievements of Jenson and Griffo in readability of type, changes in handwriting have been stylistic changes that have reflected, rather than fundamentally changed the culture. Printing has been central to Western culture since then, and writing important, but increasingly less so since the introduction of the typewriter. Notice "type" writer. </p>
      <p>To take the analogy of the dog wagging the tail, not the other way around: Changes in writing have been the tail of the dog of larger cultural changes. The tail of writing styles have not been wagging the dog of culture. This is not true of printing: printing was and is the dog, changing civilization. And now printing (not writing!) on the screen is a new cultural force. </p>
      <p>So John, do you think I am misreading Noordzij? Do you agree with everything he writes above as not exaggerating the importance of hand writing?</p>
