      <p>Nick, you say laws of perceptual processing are culturally specific. I would say they are species and domain specific (species: humans; domain: alphabetic writing). Nevertheless, what is done on the basis of knowing how letters in combination and words in sequence work, varies. And it varies with time and place, conditions of production, individual skill sets and attunements, as well as 'positioning' requirements. Practices are culturally specific, and when they become shared have a rule-structure.</p>
      <p>I have no problem though with the fact that new and effective situationally-responsive 'variations' become 'attractors' for an entire generation of skilled practitioners.</p>
      <p>What your sample ignores is that disproportionate word spacing overwhelms the proper salience of the interior whites, disrupting rapid automatic visual wordform resolution and hence disturbing smooth sense-following--the essence of reading. This is not so bad in short stretches, but probably detectable, and no doubt problematic over the long haul.</p>
