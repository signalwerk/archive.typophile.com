      <p>Bill, does it help for me to say that what is at issue is not of the order of phenotypical similarity, but of genotypical change?</p>
      <p>Mimicry of the pen, or making letters that look like pen-formed letters is not at issue, but the contrast type the flexible-nibbed pointed pen teaches <em>is</em>. With this lesson in hand, and looking back to Caslon one see a kind of proto-expension in some of the forms, which Baskerville perhaps realized. What is incidental, piecemeal and approximate in Caslon in phenotypical terms — and due to a kind of rotation — becomes, through knowledge of expansion, genotypical, fully realized across the letter set, and a ‘logic’ in Neoclassical and Romantic type.</p>
      <p>As well, the counter in the ‘n’ of the top example is more regular in geometric terms than that of the lower specimen.</p>
