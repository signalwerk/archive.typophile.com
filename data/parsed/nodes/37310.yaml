      <p>“there is a dialectic between the hand and the eye in the development of type” [Bill]</p>
      <p>This converation exists also in the developement of scribal writing, and with equal force: if the pen is the hammer, the eye is the anvil in paleographic change.</p>
      <p>How does the eye lead? How does this dialectic proceed? Only by the eye reacting. And it doesn't react in type design to what the hand might write, but what a specific paraphrase of such writing in a new medium puts in place or presents us with. That's why I like to think of the modifications as para-paraphrastic, rather than anti- or non- or contra-chirographic: the fundamental thing is that the relation of type to writing is foundationally or originally that of paraphrase. And that paraphrastic relationship is never not in some way always ever there.</p>
      <p>I think what John might be highlighting, Bill, is that not only does the pen provide the foundational contrast template, but it also can provide a partial grammer of the kinds of modifications or adjustments that might be introduced. What John is describing is shown by Noordzij in <em>Letterletter</em> on page 144 in relation to the Burgundian Bastarda.</p>
