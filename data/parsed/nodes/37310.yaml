      <p>Gerald: <em>Baskerville I find more of a curio typeface...</em></p>
      <p>I don't think Baskerville's types are at all curios in the context of English neo-classical book design; indeed, it is hard to imagine such design without them, and all the other types of the style -- Bell and Bulmer, for instance -- are heavily indebted to Baskerville even if they are, in many respects, more useful typefaces.</p>
      <p>I think 'Baskerville', as a revival, becomes a curio, or worse, when taken out of that design context. I'm almost always disappointed when I pick up a book to read and discover that it is set in ITC New Baskerville, because it is usually about 11pt, on a fairly wide measure, with tight linespacing. In other words, generic modern book production, into which Baskerville has been inserted without any regards for the particular character of the typeface: typography as random font selection.</p>
      <p>I wonder, Gerald, if a customer had come to you asking for something to be set in Baskerville, how would you have approached the design? It seems to me that you had a real mastery with Caslon, and given your interests in pattern and ornament I suspect your tastes and methods tend naturally toward the baroque. How do you think using Baskerville might have affected your approach to the design? There is, I think, enough of the oldstyle in Caslon to be married convincingly with Granjon's fleurons, for example, but I doubt if that style of ornamentation would work at all well alongside Baskerville, because they belong to entirely different aesthetics.</p>
