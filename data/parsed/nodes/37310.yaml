      <p>Nick: <em>So while I agree with Noordzij’s notion of “conjectural laws” of typography, I’d have to say that any “law” I have come across has nevertheless only ever been a generalization or best practice, and exceptions which disprove such theories are not difficult to produce in number.</em></p>
      <p>There are no exceptions to laws, in the nicely precise sense that Noordzij uses the term, there are only exceptions to rules. Something that disproves a law -- i.e. the circumstance that renders a law false --,  is not an exception, it is the basis on which you reformulate the law so that it is no longer false. This is the very heart of the distinction that Noordzij is making between rules and laws. As soon as you say </p>
      <p><em>And Guide is a word I prefer to Rule or Law.</em></p>
      <p>you are missing the whole point of what Noorzij is saying. He is not looking for guides or offering laws as guides, he is offering laws to prompt creative antagonism and discussion. Fundamentally, it is a scientific approach, based on putting things to the test. His objection to rules is that they cannot be put to the test, they can only be obeyed or broken.</p>
