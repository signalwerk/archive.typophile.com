      <p>Nick: <em>Yes, I was opining that the notion of law is not applicable to typography, and that any laws I have come across are not really laws, but as I noted, “laws”.</em></p>
      <p>But you still seem to be conflating 'laws' with 'rules'. Indeed, you wrote</p>
      <p><em>I find it strange that there is an expectation that typography should be subject to simple objective rules or laws about such things as line length</em></p>
      <p>which may indeed be an expectation that some people have, and they may share your lack of distinction between rules and laws, but that is not what Noordzij is saying and to him the distinction is very important. Why is it important? Because he is using 'law' in the scientific sense, i.e. an analytic statement of fact that, by definition, may be disproved by contradictory evidence, forcing a reformulation of the law.</p>
      <p>You are using 'law' as a synonym for 'rule', which, as I say, is to completely miss Noordzij's point. You can't say that 'any laws I have come across are not really laws', in the scientific sense, on the grounds that you can come up with exceptions to them, because it is a given of scientific laws that they are disprovable.</p>
