      <p>Bill: <em>To deal with it, by the time of Garamond, anyway, we have a *contradiction* of the broad pen in systematic ways...</em></p>
      <p>My basic point here is that type designers systematically altered hand writing in ways to please the eye. And those alterations are missing in Noordzij’s account of the history...</p>
      <p>But not, I think, from his account of the stroke. The alterations take place within the logic of the stroke model, even as they sometimes transcend what the actual pen is capable of in a single stroke or in a consistent ductus (and bear in mind that consistent ductus is a feature only of some writing systems and styles). Consider what Peter identifies as a 'dramatic' example of such alteration, the contrast pattern of the Garamond z, which becomes the normative pattern for the typographic letter: clearly the implied ductus of the strokes is inconsistent with the other letters, <em>but the stroke model is still analysable in terms of translation.</em> Likewise the other alterations in renaissance types that you have identified: they transcend the pen by extending the logic of the pen, not, as you suggest, by contradicting it. They are, to use a term Peter introduced on the ATypI discussion list, 'parachirographic'.</p>
