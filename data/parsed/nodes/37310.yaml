      <p>John: "There are certainly individual examples of scribes directly copying type, as there are of scribes attempting, painstakingly, to emulate the regularity of type. But these examples are notable precisely because they were not the norm, and because in text cultures in which manuscript and typography exist side-by-side the writing has the advantages of immediacy and economy in the innovation of new styles."</p>
      <p>In spite of what you say "of the advantages of immediacy and economy in the innovation of new styles." the influence of typography on the work of scribes is greater than you may think. </p>
      <p>Scribes became very competitive before the demise of their industry. Competing technologies often inspire better work, and often imitative work, as you could observe when letterpress competed with litho.</p>
      <p>Printers influence generated a "general improvement" on the craftsmanship of scribes.</p>
      <p>Also Printers abandoned lavish imitation of scribes work including many aspects of page design, there are examples of scribes imitating printers typographical design sensibilities.</p>
      <p>On the other hand printers departured from tradition by adding features such as the mathematical combinations of fleurons.</p>
      <p>That said it would be foolish to pretend printers did not owe great debt to the work of scribes.</p>
