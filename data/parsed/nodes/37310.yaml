      <p>Bill: <em>Now such issues as spacing the science is much more complicated and confused. But that’s because the science is not that good yet, not because scientific results are in principle irrelevant.</em></p>
      <p>Why would science be relevant to spacing?<br>
      It could measure what is effective and come up with general principles -- rather like the marketing survey or sales results for an advertisement -- but that is a snapshot in time, after the fact. Science can't come up with the creative, and what works now will not be as effective tomorrow. </p>
      <p>Peter: <em>I can make predictions about the effect of my manipulations on various things that are foundational to reading, like visual wordform resolution and sense-following.</em></p>
      <p>That may be true if you are making a sequel. But brains get bored, and society evolves. Typographic culture changes, and typographers should be at least partly agents of change, and respond to change. </p>
      <p>Ottmar Mergenthaler developed a system of justification in the early 20th century, which inserted extra spacing between characters as well as words (which is what Quark etc made something of a standard from around 1990). But at the time, everyone thought it looked horrible, so Linotype stuck with justification only using word spaces. This is one more reason that leads me to conclude that our physiological apparatus can handle all kinds of different spacing models, and it is cultural and technological contingencies which determine which are more effective, not biology. So the science of reading is more of a social science, further from engineering.</p>
