      <p>Nick"––"But surely the Americans can’t be faulted for developing their own type culture and types, especially the Scotch romans of such as the Bruce foundry in the mid 19th century.</p>
      <p>Surely you jest, "Scotch American"? I'll have what you are having, pour me a glass!</p>
      <p>I am in agreement with Norbert Florendo––"Linotype refers to Scotch Roman designs first cut by Englishman Richard Austin and cast by the Scottish typefounder Alexander Wilson and Son in Glasgow."</p>
      <p>Maybe I have sadly lived under delusions but am comfortable that you, as usual, will enjoy setting me straight. I thank now before I forget.</p>
      <p>Kidding aside––</p>
      <p>I am under the impression that you think "American superior type culture" displaced Caslon. Perhaps you may entertain the following suggestions.</p>
      <p>American founders were "non to pleased with  the longevity of Caslon's popularity". They wanted to impose an "import protection act". The problem was that lead, and lead products were tariff free. The weasel factor came into play, the founders claimed that "Caslon types were not lead", that is why their type was so hard, not to mention, superior to American type products, therefore, "subject to tariff". In order for the Caslon Foundery to dispute this they had to demonstrate that their alloy was mainly composed of lead and "disclose the alloy"</p>
      <p>Naturally the Caslon Foundery's alloy was a closely guarded secret.</p>
      <p>So you see, it was a win win for the American founderies. One way they would discover the alloy, the other they would have a greater financial advantage in price for inferior products.</p>
      <p>Eventually Caslon tried to get around this by licensing the typeface supplying punches for strikes. In my day, ATF was able to readily supply an exact duplicate from these strikes, not to mention that eventually the punches in one size were lent to the Lanston Monotype Machine Company of Philadelphia.</p>
      <p>Remember, you heard it here first.</p>
      <p>Giampa</p>
