      <p>Bill: <em>Also, if I understand Noordzij’s views rightly—and they are the topic of this thread—he would not count shapes carefully built up from multiple strokes as ’writing’.</em></p>
      <p>As Peter notes, Noordzij shows exactly this phenomenon in the context of Burgundian miniscule, in which overalapping strokes are essential creating the letters. Of course this is writing, just as it is writing when an Arabic scribe deftly outlines and fills the top of the isolated or initial ayn in the context of creating naskh text: that is <em>how</em> that script is written. Are you saying that no one, ever in history, has 'written' Classical roman capitals because the way to write them involves going back over the stem to create the second serif? It seems to me that you have a very limited notion of what constitutes writing.</p>
      <p>Below is Fr Catich's illustration of how to write the Trajan letters with a broad brush (sorry it is out of focus: it's too late for natural light here and I don't like the flash). The same technique is shown in any calligraphy manual treating the writing of the Roman capitals with a broad nib. These letters are one way of writing the Latin alphabet. The technique they use is non-cursive, i.e. the pen leaves the page during the construction of the letters, which is the crucial distinction between formal (formata) and cursive (corsiva) styles of writing. Whether the pen comes back down and goes over an existing stroke or comes down and makes an entirely separate stroke depends on the form of the individual letter and the conventions of the individual style.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/catichstrokes_6517.jpg"></div><p></p>
      <p><em>If you allow built up shapes as ’strokes’, then everything is allowed...</em></p>
      <p>I didn't say I allowed built up shapes as strokes, I allow them as <em>writing.</em> I also consider cuneiform text made by pressing a stylus into soft clay writing: the direct result of hand and tool, with a distinctive pattern of shapes resulting from the movement of the hand and the nature of the tool. There is plenty of writing in the world that is not stroke based in its creation. In the case of the Roman capitals written with a broad brush or nib, though, we are definitely talking about stroke based writing, and the fact that bits of strokes are written on top of other strokes doesn't alter the fact, any more than it does for the Burgundian miniscule.</p>
      <p>Now, insofar as some methods of writing might be said to contravene a stroke method -- the treatment of the top of the ayn in naskh certainly does, and the outlined and filled mediaeval versals are a good example of a style that many people might have trouble classifying as 'writing' --, exactly the same questions may be asked about them as we have been asking about typographic letters, i.e. to what degree are they 'paraphrase' of the stroke and to what degree are they 'escape'. Note: note paraphrase or escape writing, but paraphrase or escape the stroke. What this means, of course, is that in this aspect too of text creation typography doesn't really introduce anything wholly new under the sun.</p>
