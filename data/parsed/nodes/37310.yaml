      <p>John, you have a good point about the messiness of early printing. In looking at some 18th century printing in Caslon I was struck by how much of a mess it is, and painful to read by comparison to printing post-Baskerville, when inks and press techniques were improved. Unfortunately, the 'modern' high contrast types that became popular had their own problems with readability, in my view. </p>
      <p>The benefits of the finer control that the designers introduced was only fully realized later. Still, the breakthroughs were made then. </p>
      <p>Peter, I don't think even spacing and color forces a designer to iron out variation in shapes. Indeed variation in shape is often needed to achieve even color, because of the very different shapes of different letters. For example, the tapering of diagonals prevents clotted joins, contributing to even color, but it also creates more lively, varied shapes in the alphabet. Accomplishing both liveliness and relatively little 'noise' is what makes great text faces great.</p>
