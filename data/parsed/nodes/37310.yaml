      <p>Bill: <em>If you can assume that Baskerville was lying about being influenced by Caslon...</em></p>
      <p>I don't think he was lying: I don't think he said it at all. I've read and re-read the statement, especially now that James has provided it in its original state, and I don't see anything in it that suggests that Baskerville is saying that the form of his types is influenced by Caslon's. He says that Caslon left a 'fairer copy for his emulation than any other master' (which seems intentionally ironic given that Baskerville was the (writing) master and his types are so clearly modeled the styles developed by his fellow writing masters), but does not say that he in fact emulated this copy. All he says he has done is to produce roman and italic types, in contrast to the great variety of types that Caslon was producing. There is something in it of the brash but nervous new competitor paying tribute to an established, monopolistic firm: 'Yes, of course Microsoft Windows is great and the world owes Bill Gates a great obligation, and we've personally learned a lot from Microsoft. But we do feel that they perhaps try to do too much in their operating system, and there is plenty of room in the market for a smaller, faster system. So here is what we've made. It doesn't do everything that Windows does, but what it does do we think it does better. We're not setting out to compete directly with Microsoft; indeed, we only seek a small share of the reputation (and market), from an area of software development that proves accidentally to have been the object of our mutual pursuit (please don't crush us).'</p>
