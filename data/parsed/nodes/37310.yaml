      <p>Peter: <em>But in the typographical instatiations of the carolinian minuscule isn’t the emulation of between-stroke rotation by the mannerists an innovation beyond their typographical predecessors?</em></p>
      <p>I'm going to say yes, so long as one is only considering the instantiations of the caroline miniscule by those typographical predecessors. Obviously, if one also consider their instantiations of the Byzantine cursive miniscule, there is typographical precedence for the idea of between-stroke rotation. But the fact that this rotation only gets applied to roman letters at the time when rotation, both between-stroke and in-stroke, has become a feature of Latin script writing seems significant.</p>
