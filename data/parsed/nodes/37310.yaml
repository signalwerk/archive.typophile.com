      <p>&gt;writing and typography of other scripts.</p>
      <p>Ever eager to test my hunches, I was looking over the Rabbi's shoulder this morning as he was chanting the Torah portion today. I've got to admit that the script--a now rare instance of handwriting of extended text by a professional scribe--was admirably lucid and readable, as well as quite beautiful. </p>
      <p>My feeling is that the problems of getting even color in Hebrew script are a lot less, because of it being a square script. The problem in latin script is the presence of diagonal and round strokes, and their connections to stems. And the problem is bigger in lower case humanist script than caps.  When it is done well it is marvelously clear, as you have greater differentiation between letter shapes than in Hebrew or even roman caps. </p>
      <p>I really wonder how long the humanist script--with the lower case mimicking Roman capitals--would have lasted had not printing come along. Did the Carolingian miniscule last very long the first time around? I have the feeling that it is quite difficult to write well and quickly. And my impression is that even in formal documents, such as contracts, writing quickly became more cursive after the introduction of printing. Is this right?</p>
