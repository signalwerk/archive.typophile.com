      <p>Bill, you are still mixing up what the pen can do with the contrast styling paradigm that is native to it and it offers. The contrast type native to the broad-nibbed pen becomes the basis of a paraphrase of it in the typographical medium. The paraphrase is not exact. But the contrast styling paradigm visibly and emphatically persists there — right through a whole series of beyond-paraphrastic (para-paraphrastic) adjustments — before it gets replaced. The beyond-paraphrastic adjustments don't really care about what the pen can or cannot do, though they are mindful of what it’s done. The systematicity of the ajustments can only be seen from the perspective of the scheme.</p>
      <p>You want to know what drives them. You want to say: concerns about readability. I tried to say the readability of writing in any normal everyday experiential sense was not a / the problem. I've tried to circumscribe ‘what drive’ in terms of optical-grammatic pressures and gestural-atmospheric likes. And, my thinking is that, as a kind of epiphenomenal gift, affordances were consolidated or enhanced. Where I say affordances, you might want to substitute your 'readability.' And that is your prerogative. By my sense is that the term is inadequate as an historical explanatory concept.</p>
