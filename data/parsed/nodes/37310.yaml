      <p>John: "The early printers stepped into that text culture, and their presence changed it in numerous ways, but their influence on letter shapes seems the most minimal."</p>
      <p>It would surprise me otherwise with the following exceptions.</p>
      <p>Printing spread letterforms to "countries unfamiliar". National hands became oppressed.</p>
      <p>Also printing exploded the use of letterforms which were economical in space. Paper was very expensive. Mass reproduction by printers put great pressure on papermakers. One copy of a book produced by a scribe was negligible compared the hundreds produced by a printer of the same text. Economical letterforms became very important. In that sense printers influence was not so minimal. Consider that Aldus Manutius was the inventor of the pocket book. </p>
      <p>"The Aldine Press revolutionized the production, accessibility, and use of the book. Founded by Aldus Manutius (ca 1452-1515), the press introduced a number of innovations that helped shape the development of the modern book, including italic type and the smaller, pocket-sized volume. By putting the Greek and Latin classics in a form that everyone could afford, it revolutionized scholarship: the uniform Aldine texts made comparison and collation universally available, and they were used in schools."</p>
      <p>But yes, as I said, printers owed great debt to the previous work of scribes.</p>
