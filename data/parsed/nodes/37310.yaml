      <p>&gt;disrupting the thread</p>
      <p>Are you kidding? I would much rather read your knowledgeable analysis than my guessing. </p>
      <p>I have made no pretense of knowing the history of writing here. What I did react against was what seemed to me an exaggerated claim of Noordzij, that later type designers disregarded what earlier type designers did, and only looked to writing. Having spent recently a lot of time designing letters, I just don't find that plausible. I may have misinterpreted Noordzij, but my impression from reading both <em>Letter Letter</em> and <em>The Stroke</em> (translated by Peter) is that he has brilliant new insights on the development of letters, but that he at times claims they are the whole story rather than part of the story. </p>
      <p>&gt;you are arguing against yourself. </p>
      <p>Well, yes, after Peter's argument I said I thought I was wrong, but then had second--or third--thoughts about that as I looked a little more into the history. Now that James confirms my guess that there <em>was</em> an influence of engraving on the adoption of the pointed, flexible pen, I am thinking now that the story is one of <em>interaction</em> between the crafting of letters in different media. </p>
      <p>&gt;Then you’re blind. Sorry, but there’s no polite way to put it.  </p>
      <p>You are, um, jumping to conclusions. My guess, which may well be wrong, is that the letters such as the Shelly letters James showed us are constructed, not written. By that I mean that they look carefully built up of many strokes, not truly 'written', with a continuously moving front. I see that Nick also has the same feeling. And if I read him rightly, David also sees them this way. Can you tell us more about how these letters were made, James?</p>
      <p>Reading the Wikipedia article about the pointed nib, I see that you can't do a thick upstroke with the pointed nib, but have great control on the down strokes. I think I can see affects of that in the cursive styles, which are more written, but the Roman look to me constructed, and keeping largely to the earlier rules of where contrast should fall--but just made more vertical.  </p>
      <p>Peter wrote that there was an 'expansion contrast template'. Thinking about it further, I do see that the vertical stress would be more natural with the pointed nib, as you could bear down on the vertical down strokes, and in that sense he is right. However, you also have the tradition of 'constructed' letters, from the 15th century on. I see an example of a vertical stress letter from the Romain du Roi, and I am wondering how early vertical stress 'constructed' letters exist--do they exist before the pointed pen? </p>
      <p>So I would concede to Peter and you at this point that the vertical stress seems more natural with the pointed pen. But I am wondering whether the point pen is following design ideas from earlier, with constructed letters, and letters created in other media: punch-cut, painted, stone carved, engraved. </p>
      <p>&gt;I’m not sure who the first person was to describe himself as a ’type designer’ or when, but I suspect it was quite late</p>
      <p>I know that applying the term 'type designer' to Jenson is anachronistic, but I don't think it is misleading. As Harry Carter pointed out in the passage I quoted above, the earlier creators of printers type such as Jenson and Griffo were not simply copying writing, but were cutting their punches to conform to models that were in their heads. In that sense they were designers, whatever medium they used to create letters. </p>
      <p>I suspect that the 'rotation of the pen' in Dutch typefaces is an example of such interaction. You can get the vertical stress of the 'o' by changing the pen angle from the 'e'. But the question is, why would you bother to do this, which takes extra trouble in writing? It seems to me you would do this if you wanted to conform to a different design idea that you were trying to produce on paper.    </p>
      <p>And just for the record, when I write for publication, I thoroughly study the history of what I am writing about, unlike my guessing and rambling here on Typophile.</p>
