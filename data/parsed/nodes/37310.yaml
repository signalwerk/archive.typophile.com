      <p>“the departures from writing, both for readability and aesthetics” [Bill]</p>
      <p>How can I explain to you why I object to this way of putting things? </p>
      <p>Writing is neither unreadable, nor is it ugly. The departures are not ‘for’ readability and aesthetics in the sense that there are or were readability and aesthetic problems with writing in its benchmark instantiations or as a category, that type as a category tries in a progressively ascending way to solve or address. </p>
      <p>The problems that departures from the specifics of specific writing conventions try to solve or address are, as I tried to say, problems generated by what happens optical-grammatically when a specific convention of writing is paraphrased in sculpted forms on the ends of recangular blocks of metal, which force them a certain distance apart and to rigorously conform to a carefully structure height / width grid. Paraphrase is what sculpting has to be or do, if it is to continue using the communcation convention that was sparked and shaped by direct mark-making.</p>
      <p>Departures from writing are not essential, but feature manipulation in the context of paraphrastic stratagies is unavoidable, characteristic of type design, and can be productive.</p>
      <p>About the Douglas Hofstadter response to Donald Knuth and how what Donald Knuth proposed relates to Noordzij I’ll transcribe a section from Hofstader’s Abstract, and point you to the Epilogue of Noordzij's RIDT paper as a start. The first sentence of Hofstadter's extract reads: “It is argued that readers are likely to carry away from Donald Knuth's article “The concept of a Meta-Font” a falsely optimisitc view of the extent to which the design of typefaces and letterforms can be mechanized through an approach depending on describing letterforms by specifying the settings of a large number of parameters.”</p>
      <p>In this context Hofstadter outlines a way to letterform descritption using ‘quirk-notes’ to define how in a specific font, ‘roles’ across the alphabet are filled. For example the ‘stem’ role or the ‘bowl’ role, or the ‘ascender’ role, and how the roles relate, that is, the styles of their joining.</p>
