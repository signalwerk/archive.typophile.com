      <p>Bill, as I wrote earlier, I'd rather have an argument or discussion between you and me than have you arguing with Noordzij through me. When I wrote 'no one is making the claim...' I meant no one actively participating in this discussion.</p>
      <p>I'm going to step aside from the recent topics of discussion here and talk about something that I think might put Noordzij's typically provocative comments into a proper perspective. Ironically, this takes us right back to the original topic of this thread, because, in his critique of Tschichold, Noordzij comes straight out and describes his pedagogical method: which is to present seemingly absolute statements (laws) as a starting point for exploration and discussion. The aside I want to make is to drag in Plato, Popper and Gadamer. Popper considers Plato one of the primary enemies of the open society, because he reads <em>The Republic</em>, as many others have done, as a sociopolitical programme. That is, he reads it as a philosophical treatise on government, akin to many subsequent treatises in the history of western political thought. Gadamer, though, teaching classical philology during the Nazi period because it was safer than philosophy, comes to the realisation that the Platonic dialogues have to be seen in the context of the Platonic academy, i.e. not as treatises but as teaching aids, as works that were composed as a basis for discussion. Plato isn't laying out a programme of ideal government, he's teaching, by example of dialogue, how to talk about government. Similarly, I don't think Noordzij's writings should be separated from Noordzij's teaching, and should also be seen in the context of his pedagogical method. I have little doubt that Noordzij considers teaching more important that writing (in the authorial sense), and the books and essays only exist as teaching aids.</p>
