      <p>Nick: <em>Um, isn’t it usually the other way round?</em></p>
      <p>No. A scientific law is by its nature disprovable. It is taken to be true until disproved, but if it a priori could not be disproved it would not be a scientific law. Science only deals with that which can be disproven.</p>
      <p><em>Design is a practical process of problem solving.</em></p>
      <p>Is that a law? It looks like one. I hope it isn't a rule.</p>
      <p>I regard it as an ideological statement, and one that is uncritically repeated by thousands of designers and design teachers. Perhaps the most refreshing statement I have heard in 13 years in type design was something Peter Biľak said during his presentation at TypeCon in Minneapolis: he explicitly rejected the view of 'design as problem solving' and suggested instead a view of 'design as a kind of reading'. And he showed a short film he had made imposing punctuation on a cityscape seen from a moving train, to make clear that what he was reading, as a designer, was the world around him. This is very much where my 'affections' -- to use Noordzij's term -- lie, with design as a process of engagement and response, understanding and interpretation. Within this process there is definitely a place for laws, i.e. for analytical formulations that enable a critical engagement.</p>
      <p>Most design is banal and predictable precisely because it is undertaken as problem solving.</p>
