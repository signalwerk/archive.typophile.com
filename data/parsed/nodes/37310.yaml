      <p>Nick, from the point of view of the writing hand that spawned it, every font is at one and the same time a paraphrase and an escape. That a secondary chirographic reference or a geometrical principle — like inversion or the perfect circle, the square and the equilateral triangle — can illuminate the escape doesn't matter. It just helps you get a handle on the nature of the change. What's important is the extent, pattern and force of the mutations.</p>
      <p>I guess I'm more inclined to ask where it's headed than to speculate about if it's fighting against — except perhaps with the moderns where a fight against becomes explicit, and in some way self-defeating. I guess it's a question of what's a more fruitful way to think about what's going on.</p>
      <p>In the old-style the flouting is always subtended by a more foundational embrace. But the escapes are cumulative. In the Roman de la Roi the escapes are modulated by the dictates of an superimposed grid. It's not always a chirographic principle that structures the mutations. Still the child is always father to the man.</p>
      <p>Bill's right about other pressures.</p>
