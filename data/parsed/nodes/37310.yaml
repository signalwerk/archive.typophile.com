      <p>&gt;does it help for me to say that what is at issue is not of the order of phenotypical similarity, but of genotypical change?</p>
      <p>Well, yes. Since the same type of modulation of the stroke is in not only the mnhr but also the bdpq, and it is modulation more independent of change of direction in stroke, the pointed pen is more critical than I have conceded so far. The modulation of stroke in earlier type also violated the rules of the broad pen in its joins, but I admit not in the same way. </p>
      <p>John I think a lot of inconsistency in Caslon was, as Baskerville implies, because he was in a rush to get masses of work out the door. Here by 'inconsistency' am referring to things like variation in ascender height and x-height within the same face, and of variation in the relation of characters to one another--some wider or narrower in relation to others in different sizes. However, if Caslon could come on Typophile, I suspect he would defend himself by saying "If it looks right it is right." I think he had a self confidence that even if it was not consistent, if it looked harmonious in his eyes, it was excellent. Now I don't think that is a full justification, as he has characters which are just bad. Still, I find it remarkable that he was able to make quite different characters in different sizes, and somehow they all look Caslon, and are impressive in spite of their inconsistencies. And in may be that inconsistency with harmony that helps give them their warmth and charm--and part of the difficulty in capturing their spirit in revivals. </p>
      <p>By the way, another source of inconsistency, including in design, not only execution, may be that he had different models of type as a starting point for his types in different sizes. This James Mosley seems to indicate in his commentary on the specimen book of 1766. </p>
      <p>I remain unrepentant that Caslon was an important influence on Baskerville, but it would take a lot of work to try to prove it, scanning and comparing letter forms, and I won't be doing that.</p>
