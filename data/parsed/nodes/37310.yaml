      <p>Bill, I think Baskerville was being polite to his highly respected countryman and his celebrated types, presenting his own work as if it were an 'emulation'. This isn't an entirely uncommon phenomenon: an innovator courting acceptance for his work by downplaying its innovativeness. Remember, innovation has only recently been seen as an entirely positive thing, and we know that Baskerville had trouble getting his types accepted by conservative readers who knew-what-they-liked-and-they-liked-Caslon-thank-you-very-much.</p>
      <p>If you actually look at the types you have to acknowledge that Baskerville is doing something very different. The change from an oblique to a vertical axis alone is a radical difference (one that prompts every type classification scheme I'm aware of to put Caslon's types and Baskerville's in separate categories). The change in contrast, weight and proportions are also significant. And these changes are all mirrored in contemporary developments in formal writing brought about by the increasing use of the split nib. Baskerville's genius was to take the stroke logic of written and engraved lettering, which was most often oblique, and apply it to roman forms.</p>
      <p>Baskerville's Greek type is also worth looking at in this regard, I think: this is not a typeface designed by a man who cared what anyone else had done before him. It is weird and probably must be considered a failure, but it owes nothing to Caslon or any other type designer. Baskerville may have felt some need to publicly claim that he was a humble follower in Caslon's footsteps, but the work tells a different story. Baskerville was an unconventional man (he lived with a woman who was not his wife for many years at a time when this was seriously scandalous), and I doubt if he had any illusion that he was not, in fact, the finest printer England had every produced.</p>
      <p>But none of this is to suggest that type designers have not been influenced by other type designers, and I don't think Noordzij is suggesting this either. What I am saying, at least, is that such influence takes place within a wider context of text creation that is only partially, if increasingly, typographic, and it is developments in this wider context that produce radical changes in the styles of type. In an important sense, I would say it doesn't matter whether a particular type designer of the past was more influenced by writing or by type, because what he was actually influenced by was a text culture within which writing and typography were not as compartmentalised as we have come to think of them.</p>
