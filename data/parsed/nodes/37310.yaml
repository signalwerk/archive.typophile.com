      <p>Bill: <em>So did having the pointed pen to work out the shape help it? Yes. But the neo-classic aesthetic taste and keeping close to ’typographic’ rules for the roman seem to be just as important influences.</em></p>
      <p>You still seem to be looking at the type and ignoring the fact that those neo-classical aesthetics and conformance to 'typographic' rules for the roman were worked out <em>first</em> with the pointed pen, which was the primary lettershaping tool of the neo-classical text culture. We don't know what neo-classical letters might have looked like if the pointed pen had not existed: you don't get very far trying to write letters with a vertical axis with a broad nib pen. What we do know is that the text culture would have looked very different, and so would the typefaces that came, belatedly, to form part of that culture. What I'm pretty sure would <em>not</em> have happened is the development of Baskerville's types, or even the neo-classical elements lurking in Caslon's types, without the specific models that the contemporary writing masters produced with those pointed pens. There are concepts of proportion that one might derive from neo-classical treatises on art and architecture, but those don't lead you to the specific forms of Baskerville's types.</p>
