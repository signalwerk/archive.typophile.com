      <p>I don't either, as I tried to make clear above. I was just referring to where type has excelled. There are a lot of things that contribute to easy readability of a typeface. Also the merits of a highly readable face can be totally subverted by bad setting. </p>
      <p>An example of another factor in readability is darkness of the face. In the testing of Clearview as I remember they found that a medium weight sans was better than a bold for legibility in signs. I think there is also a sweet spot (or range) for text as far as darkness. But darkness is complicated, as perceived darkness is not simply a matter of sheer density. Reabability is quite complicated, I think, and not that well understood. I am not talking here about the obvious, like bad handwriting that you can't decipher to save your life, but rather readability at the high end--readable vs highly readable.</p>
