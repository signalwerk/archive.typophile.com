      <p>I said: “I like to think of the modifications as para-paraphrastic, rather than anti- or non- or contra-chirographic.”</p>
      <p>Let me illustrate this with the oblique stroke in the z.</p>
      <p>A direct paraphrase of writing puts in place a thin oblique stroke in the z. At a certain point in type this oblique is brought into harmony with other obliques inclined in the opposite direction in the alphabet. This is done because it's lightness is obtrusive. The adjustment is in the direction of what a direct paraphrase of writing introduces in other key obliques. So it is only anti-chirographic in a very limited sense.</p>
      <p>The source is other obliques. I don't know if there is a historical precedent in writing. The <em>direction</em> of the change is not anti-chirographic, though <em>structurally</em> the norm violation is dramatic when seen against the translational contrast paradigm.</p>
