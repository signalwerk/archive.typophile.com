      <p>&gt;Are the norm-violations ‘essential,’ and ‘genotypical’? </p>
      <p>I think 'yes'. </p>
      <p>I would have to get a broad pen and try to write over Garamond to test it out properly. But I don't see how you can get a wider vertical arch on the D than the stem of the D by translation, and no rotation or expansion. You will have to do rotation, at the very least, and then the question would be, why are you doing it, when they didn't before? Optically a fatter arch balances better with a vertical stem. Why ignore that as a driving factor? It also ends up with more even color as a result, which, carried through systematically, is better for readability. </p>
      <p>But the spacing issues don't have to do with the 'ductus' anyway. The point is, Noordzij's categories of 'ductus' aren't sufficient to capture important features of the development of type design. Visual features concerning optical balance, even color, spacing and rhythm are different variables, and are critical.</p>
      <p>Noordzij does have interesting insights into optical effects, but he doesn't integrate these into his history, so far as I remember.</p>
