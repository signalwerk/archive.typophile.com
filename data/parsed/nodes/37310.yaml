      <p>Popper's 'Conjectures and Refutations' (his best book) is in Monotype Baskerville, I think. It is a somewhat larger format book, and the width of the Baskerville helps with the wider measure. I always thought it looked quite nice. </p>
      <p>I try to separate personal taste from what is better and worse design. Personally, I don't particularly like modernist taste, but I recognize that there are good modernist designs and bad. Same with Victorian. </p>
      <p>With neoclassical, Baskerville is one of the good ones if you ask me. It is really beautifully thought through and executed. I do think it's a tiny bit wider than ideal as far as readability, but that may be just prejudice on my part.</p>
