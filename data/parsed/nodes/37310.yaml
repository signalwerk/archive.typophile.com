      <p>Bill: <em>However, the similarities in structure of Baskerville and Caslon leave me convinced that Caslon was an important influence.</em></p>
      <p>An influence on what? I don't think you can claim that they were an influence on the new style of type, because the styles are so different and, in any case, Baskerville's types are in essentials identical to the George Shelley's alphabet of 1715 as shown in the plate that James provides. Some letters are different -- the Q, thanfully -- but they are also different from Caslon's and I suspect if one dug through enough exemplars from the writing masters one would find a model for every form in Baskerville's types. Why? Because the forms can all be worked out with a split nib pen -- even if a typical typographic contrast pattern sometimes requires rotation of the pen, which was not unheard of as Bodoni's swash letters make plain -- , and these guys had been doing this for decades. I doubt if there was any workable shape that had not been fully explored with a pen by the time Baskerville came to cast it in type.</p>
      <p>The trouble with trying to make a structural link between Baskerville's types and Caslon's evidence of influence or emulation is that you should first remove from the equation the structural similarities that are common to &gt;90% of Latin text faces, that are accounted for by adjustments proper to the scale of the letters. Baskerville may have looked at Caslon's types to gain an understanding of what makes type work, because they were the most readily available samples, but he may well have relied on John Handy's expertise to provide that understanding. It is important to bear this in mind, because when we say that Baskerville 'designed' these types we run the risk of imagining an anachronistic industrial design process. Handy would have cut punches according to the knowledge of his craft, based on some form of model provided by Baskerville. This model would not have been 'drawings', of the kind that we are familiar with from much later, mechanical punch cutting processes. What were they? I think they were almost certainly pen-written letters of the kind shown in Shelley and Bickham's writing manuals, which Baskerville, as a writing master, would have been able to produce with ease and speed. Handy would have interpreted the letters to make them work at the sizes of type specified by Baskerville (just as, two centuries later, August Rosenberger interpreted in metal the written and drawn letters provided by Hermann Zapf).</p>
      <p>Baskerville did emulate Caslon, but primarily in the still novel notion of making original types in England, rather than importing them from the continent, as had been the norm for almost three hundred years. But Caslon based his types on the style of those imported types, while Baskerville based his on indigenous lettering styles.</p>
      <p>When Baskerville speaks of Caslon 'leaving room for improvement', I don't think he is referring merely to certain technical deficiencies such as poor vertical alignment and inconsistent serif weight, but also to the inappropriateness of Caslon's types to the neo-classical text aesthetic. The room for improvement was the gulf between the text culture of Holland a hundred years previous and the text culture of contemporary Britain.</p>
