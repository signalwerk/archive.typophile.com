      <p>Gerald: <em>In fact, scribes did imitate type. (Trittenheim)</em></p>
      <p>Trittenheim?</p>
      <p>There are certainly individual examples of scribes directly copying type, as there are of scribes attempting, painstakingly, to emulate the regularity of type. But these examples are notable precisely because they were not the norm, and because in text cultures in which manuscript and typography exist side-by-side the writing has the advantages of immediacy and economy in the innovation of new styles. [Which is not to say that writing-centric text cultures are necessarily innovative: The naskh style of Arabic script has remained the basic book hand for more than five hundred years.]</p>
