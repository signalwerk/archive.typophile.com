      <p>Bill: <em>You are assuming that ’text creation culture’ excludes printing and printer’s types...</em></p>
      <p>No, I'm not assuming that at all. I began my part in this discussion about Baskerville by insisting that printer's types be seen in the larger context of text creation that, in cultures with significant manuscript document production, has certain observable characteristics and influences that argue against the accuracy of any typocentric history. This isn't a statement only about 18th century England, but what happened there is particularly interesting because the model for the new types is so clearly established in a different medium, writing, prior to being implemented in type, and we have such good documentary evidence of this because of the social and economic importance of writing and the production so many copy books and exemplars.</p>
      <p>Yes, the broad pen, i.e. the translation stroke pattern, is there in the imported printing types and in Caslon's types (although I think you did an admirable job, earlier in this discussion, of demonstrating influences of neo-classicism in some of Caslon's forms, whether that was your intention or not), but my point made earlier was that this left typography increasingly at odds with and out of step with the aesthetics of the text creation culture dominated by written, engraved and inscribed forms that were based on very different stroke patterns. And the strongest evidence of this domination is that there is, during half a century or more, no counter influence of these old fashioned types on any other area of text creation. That seems to me very significant.</p>
      <p>So when you say that Baskerville 'violated the broad pen', i.e. broke with the translation stroke pattern, I think you are still imposing a typocentric view that doesn't fit with the evidence. The evidence suggests that Baskerville spent his whole life writing with a flexible split nib steel pen, that he became a writing master and practitioner of the various styles of writing and lettering associated with that pen, and that he later had two of these styles cut in type by John Handy. In order to 'violate the broad pen' he would have had to have had some engagement with the broad pen, and I just don't see it and I don't count reading books set in Caslon's types to constitute such an engagement.</p>
      <p>You could argue reasonably, I think, that the first person or persons to write the normative typographic forms of Latin letters with a split nib 'violated the broad pen'. But that wasn't Baskerville, and you are unjustifiably privileging the act of cutting those letters in metal if you imply that Baskerville or Handy's achievement constitutes such violation but not George Shelley's, <em>four decades earlier.</em></p>
    html_clean: |-
      <p>Bill: <em>You are assuming that ’text creation culture’ excludes printing and printer’s types...</em></p>
      <p>No, I'm not assuming that at all. I began my part in this discussion about Baskerville by insisting that printer's types be seen in the larger context of text creation that, in cultures with significant manuscript document production, has certain observable characteristics and influences that argue against the accuracy of any typocentric history. This isn't a statement only about 18th century England, but what happened there is particularly interesting because the model for the new types is so clearly established in a different medium, writing, prior to being implemented in type, and we have such good documentary evidence of this because of the social and economic importance of writing and the production so many copy books and exemplars.</p>
      <p>Yes, the broad pen, i.e. the translation stroke pattern, is there in the imported printing types and in Caslon's types (although I think you did an admirable job, earlier in this discussion, of demonstrating influences of neo-classicism in some of Caslon's forms, whether that was your intention or not), but my point made earlier was that this left typography increasingly at odds with and out of step with the aesthetics of the text creation culture dominated by written, engraved and inscribed forms that were based on very different stroke patterns. And the strongest evidence of this domination is that there is, during half a century or more, no counter influence of these old fashioned types on any other area of text creation. That seems to me very significant.</p>
      <p>So when you say that Baskerville 'violated the broad pen', i.e. broke with the translation stroke pattern, I think you are still imposing a typocentric view that doesn't fit with the evidence. The evidence suggests that Baskerville spent his whole life writing with a flexible split nib steel pen, that he became a writing master and practitioner of the various styles of writing and lettering associated with that pen, and that he later had two of these styles cut in type by John Handy. In order to 'violate the broad pen' he would have had to have had some engagement with the broad pen, and I just don't see it and I don't count reading books set in Caslon's types to constitute such an engagement.</p>
      <p>You could argue reasonably, I think, that the first person or persons to write the normative typographic forms of Latin letters with a split nib 'violated the broad pen'. But that wasn't Baskerville, and you are unjustifiably privileging the act of cutting those letters in metal if you imply that Baskerville or Handy's achievement constitutes such violation but not George Shelley's, <em>four decades earlier.</em></p>
