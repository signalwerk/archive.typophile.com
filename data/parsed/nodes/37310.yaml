      <p>Peter, I take Gerrit Noordzij here as using the word 'paradigm' in the sense introduced by Thomas Kuhn, a sense which is now very widespread. A 'paradigm' in this Kuhn's sense is a model that is applied to many other situations, and hence help to generate new results. It is a causative factor, not simply a representative. </p>
      <p>I think the fact that Noordzij starts this abstract by saying that "design *shapes* life" indicates that he sees writing and writing styles as driving forces in civilization.</p>
