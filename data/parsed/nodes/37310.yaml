      <p>Bill: <em>I think there are a number of other factors involved, but that being able to get rid of noise is where type has the edge over handwriting. In other areas probably the best scribes were probably just as good for readability.</em></p>
      <p>Again, I think we have to take text size into account here. Where type has the most obvious edge over handwriting is in being able to produce smaller text with the same regularity and evenness of colour and spacing as a good scribe could produce at typically larger sizes.* This is a much more obvious advantage of type than the notion of type getting rid of noise, which I find very problematic, especially if we're comparing the textual culture of the first 100 years of printing from moveable metal type in Europe. The fact is that the vast majority of early printing was not very good: a lot of type was either over-inked or under-inked, the impressions were uneven (even on the same page), the metal alloys were not well developed and the type wore quickly, there is often a lot of extra-textual noise from ink spots. Even some of the most well-respected names in typographic history produced a lot of poorly printed books -- I know, I own some of them --, not just the justly admired masterpieces that get reproduced in books on type history. By comparison, the scribes -- seeking to compete in quality where they could not compete in quantity or economy -- were doing their best work during the same period, using highly prepared parchments and papers, well-maintained reeds and quills, carefully prepared inks. And if by 'noise' we include not only variation in letterforms or spacing but all those other factors that diminished the quality of so much printing then the manuscripts are by far the cleaner product.</p>
      <p>[The preparation of the writing surface in the Islamic scribal tradition is particularly important, because the reed pen is pushed so often when writing Arabic, and the sized papers they use are generally smoother than anything produced for either manuscript or print in Europe. The cleanest, sharpest letters I have ever seen were handwritten Arabic script.]</p>
      <p>* There are traditions of very small writing -- micrography -- in some scripts, notably Arabic and Hebrew. These are most often employed in decorative ways: you see a picture or a pattern, look at it more closely and you see that it contains a text in tiny letters. The Arabic term for such writing is <em>ghubar</em> -- literally 'dust' --, and a special style of writing was developed for it. The typical alif height of ghubar is less than 2mm; sometimes as small as 1.3mm. Because ghubar was sometimes used to write Qur'anic passages, legibility was, of course, extremely important.</p>
