  html: |-
    <p>Aloha! Veteran Sign Painter Pierre Tardif and Lettering Artist Charles Borges de Oliveria have teamed up to bring you these fun to use brush fonts. Aloha Script comes in two flavors: Aloha Script and Aloha Script Casual. Both fonts contain the same lowercase, alternates, and ligatures – the difference is in the capitals. By mixing both fonts you can create a variety of unique logos. Aloha Scripts Casual can be set in all caps for greater emphasis on captions. Both fonts contains over 100 alternate characters, as well as an assortment of ligatures, swashes and underlines. With over a year and a half in development, Aloha is bound to please. Great for logo design, signs, posters, culinary food packaging and so much more. Aloha Script and Aloha Script Casual are $49.95 each – or you can purchase both fonts for a discounted price of $79. Aloha!</p>
    <p><img src="/sites/default/files/old-images/Aloha-Script-sample-1_3894.png"><br><img src="/sites/default/files/old-images/Aloha-Script-sample-2_3884.png"><br><img src="/sites/default/files/old-images/Sinatra-Microphones_4728.png"><br><img src="/sites/default/files/old-images/Aloha-Script-sample-3_4866.png"><br>
    Available at <a href="http://www.letterheadfonts.com/fonts/alohascript.php">http://www.letterheadfonts.com/fonts/alohascript.php</a><br>
    Coming soon to all major Font retailers :)</p>
