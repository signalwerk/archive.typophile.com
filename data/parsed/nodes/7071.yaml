  html: <p>Zone Opaque is its name, and <a href="http://www.zone-opaque.org" target="_blank">http://www.zone-opaque.org</a> is its website. <br>Founded by young letterpress printers, typedesigners and woodcutters, Zone Opaque established itself in Montreuil, near Paris, France. Our aim is to promote letterpress printing through a non-commercial use. We create, co-edit &amp; publish artists books, posters, typefaces, illustrations and so on, with quality as goal, using traditionnal, experimental and digital printing techniques. <br>For people hanging around France during october 16th &amp; 17th, we would gladly welcome you in our workshop as part of the "Montreuil's Artists workshops open doors day" (If my english is correct). Address on the site. <br>The website is still in French (sorry Folks), but any further question is welcomed at <a href="mailto:info@zone-opaque.org">info@zone-opaque.org</a></p>
