    html: |-
      <p>Agreed, you should test it first. Agreed even more that Bodoni is a pretty poor choice for a newspaper face. There's a reason that newspaper typefaces have tended towards low-contrast rather than high-contrast for the past 75 years or so.</p>
      <p>Generally given the curve of rate-of-change in optical scaling, the 12-pt would theoretically be closer, but due to the high contrast of Bodoni, I'd probably prefer the 6-pt (which will have noticeably less contrast). But the more correct answer is likely "neither."</p>
      <p>Cheers,</p>
      <p>T</p>
