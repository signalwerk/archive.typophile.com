    <p>Hi All,</p>
    <p>Im setting a newspaper in Bodoni. Ill probably set columns of newsprint in aobut 9 or 10pt with footnotes in 7pt. Should I buy ITC Bodoni optomized for six or for 12 pt???</p>
    <p>Not sure which will be most effective or if it will even make very much difference!</p>
    <p>Thanks :)</p>
