    <p>You know I thought I had it but now I am second guessing myself. <br> <br>I am working on a huge project.   <br>The main components are worksheets to collect personal information. Some journals, calendars and instruction materials will also need created. <br>This require a very friendly easy to read combination of typefaces. Something that anyone between the ages of 30 to 60 would be comforatable with. <br>It is for a product geared towards women. <br> <br>Franklin Gothic is my definite san serif choice.  <br> <br>I was thinking leawood for the serif because of its legibility and the fact that it has a very "pretty" italic. But now I am second guessing that choice.  <br> <br>I would love to know what all you think! <br> <br>Thanks in advance  <br> <br>Cathy</p>
