      <p>Thank you, dear Ashok, for your insightful inputs. The links you provided are very useful indeed, as is the awareness that most of Devanagari Typographical Research is not online.</p>
      <p>While indigenous solutions do provide facilities that are good enough for the most complex tasks (after all, leading industries in India and abroad do make use of them), they lack compatibility with each other.</p>
      <p>Most of you will be familiar with the frustrations that plague exporting/importing documents between products of a single company (between Adobe’s Illustrator and InDesign, for instance), let alone among products spanning a range of manufacturers (between Microsoft’s Word, Adobe’s InDesign and Corel’s Paint Shop Pro). These are apparent even to those who type in Roman scripted languages like English. But to one who depends on proprietary “hack” fonts, the nightmares are trebled.</p>
      <p>Out of all the muck and confusion rose the shining star of hope that would set things right: Unicode. A standard, not ill-designed, that is redolent of Tolkien:<br>
      <cite>One Code to rule them all, One Code to find them;<br>
      One Code to bring them all, and in the Encoding bind them.</cite></p>
      <p>This promised to make life easier for a freelance, who knows not what sort of software will be encountered next. I am simply the designer, the layer-outer. I depend on people to print my creations. Some of them use Corel. Some use PageMaker (yes, that old one). Some use Quark. Even if my work is in the virtually-universal PDF, Unicode poses new problems.</p>
      <p>My life has just begun, and hence I can afford to indulge in the luxury of free thought and principles. Once I am really dependent on designing for my bread and (if I’m lucky) butter, I will no longer be able to. Hence, I am using this chance to motivate those with power and ability to take this responsibility and achieve this goal. If they do not, than a powerless and unable man will try to do it, and that’ll just be too bad.</p>
      <p>Unicode <strong>is</strong> the future. Please don’t fight it.</p>
