      <p>Most of the publication houses in India uses Non-Unicode based typefaces for their Indic requirements. And the local applications like Shree-Lipi(From <a class="freelinking-external" href="http://www.modular-infotech.com/html/index.html">Modular Infotech</a>), Indica(From <a class="freelinking-external" href="http://www.summitindia.com/Default.asp">Summit Infotech</a>) and <a class="freelinking-external" href="http://www.cybershoppee.com/">MaayBoli</a> are quite popular in newspapers and other publication sectors. Also there are some converters like <a class="freelinking-external" href="http://www.fontsuvidha.com/">FontSuvidha,</a> which can convert your one type of data into various other layouts. </p>
      <p>Quark Express offers an Indian version called <a class="freelinking-external" href="http://www.quark.com/products/xpress/indian.html">QuarkXPress Mudra</a> which supports Devanagari as well.</p>
      <p>But typographically you cant really do much with all these applications.<br>
      Adobe, please do something!</p>
