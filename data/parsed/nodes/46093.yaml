      <p>Tuhinanshu,<br>
      This is actually quite a real problem. As you have found, Indic script shaping is currently only widely available in Windows. The shaping in the programs you’ve named is dependent on OpenType scripting as part of the font programming and Uniscribe, a text processor that that interprets the OpenType information to provide script shaping for complex scripts such as Devanagari.<br>
      I think we can expect Adobe to provide Indic support for some of its applications in the near-ish future (maybe within the next couple years?). I say this because some of their recent public statements have indicated that they are currently devising means to implement support for Indic scripts. Perhaps Thomas Phinney could fill us in more on this?<br>
      Besides these two big players: Microsoft and Adobe, I’m not sure many other software developers will readily implement Indic support. Perhaps there are some design applications that utilize Uniscribe that I am not aware of. If so, I would like to hear of these.<br>
      The other option is to use “hack” fonts or proprietary typesetting systems, the first is not recommended for keeping the integrity of the text intact and the second option would be very pricey and may in fact rely on “hack” fonts to work correctly.<br>
      We can only hope that this condition improves in the near future. In the mean time, I’m afraid we’ll just have to muddle through...</p>
