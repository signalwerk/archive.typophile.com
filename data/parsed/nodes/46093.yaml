      <p>Tuhinanshu,</p>
      <p>When it comes to development in Indic technologies, there are many competent solutions available, albeit not so many for unicode. This does not mean that the other solutions are not good enough, I would suggest you try the indigenously developed solutions, like Shreelipi, Indica etc. I am sure you would find them adequate for your needs.</p>
      <p>Another trait that you should be aware of; is the fact that there is a quite lot of work done in the area of Indic type design and typesetting which has not been put online. So you would seldom find sites or information relating to it on the internet. </p>
      <p>If you really are keen on type design and typesetting issues, and solutions. I’d suggest you contact organizations such as Modular and  Summit Infotech. These are the more commercial organizations; if you are keen on academic use, development or research, the following people / organizations might be able to help you: </p>
      <p>Mahendra Patel from NID. Now working with leaf design. (<a href="http://www.theleafdesign.com/" title="http://www.theleafdesign.com/">http://www.theleafdesign.com/</a>)</p>
      <p>There is some work being done in Indic typography in IDC at IIT Bombay (<a href="http://www.idc.iitb.ac.in" title="www.idc.iitb.ac.in">www.idc.iitb.ac.in</a>). One of the students over there is doing his PhD in Devanagari typography (<a href="http://www.idc.iitb.ac.in/students/phd.htm" title="http://www.idc.iitb.ac.in/students/phd.htm">http://www.idc.iitb.ac.in/students/phd.htm</a>)</p>
      <p>The C-DAC team (they also send a free CD of Devanagari fonts and related software, under the Ministry of Information Technology)(<a href="http://www.cdac.in/html/mlingual.asp" title="http://www.cdac.in/html/mlingual.asp">http://www.cdac.in/html/mlingual.asp</a>) and (<a href="http://www.mit.gov.in" title="www.mit.gov.in">www.mit.gov.in</a>)</p>
      <p>Hope this helps your needs.</p>
