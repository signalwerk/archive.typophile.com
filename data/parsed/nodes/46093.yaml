      <p>Note that very simple things can also been done on Mac OS X. Bundled with Mac OS X is an AAT-formated version of Monotype Devanagari (I believe in regular and bold weights).</p>
      <p>Mac OS X does not support OpenType features for Devanagari. But the system and Apple applications do support AAT Devanagari. So, if you limit yourself to the Monotype Devanagari fonts that come with the OS, you can copy text from the Internet and paste it into TextEdit or Pages, or open Word files up in Pages, provided that you switch the font after you open the document. Text integrity should normally be assured. But the Mac versions of non-Apple apps like the Adobe Creative suite don’t support AAT, so you still can’t do any real design work this way either.</p>
      <p>As far as I know, Monotype Devanagari is the only AAT-formated Devanagari font available.</p>
      <p>Also as far as I know, most Indian graphic designers who work on the Mac or with Adobe products make use of the work-arounds that Paul mentions above. Sorry to not have a better solution on hand for you!</p>
