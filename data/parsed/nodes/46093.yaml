    <p>Hi everybody. This is my first blog here. I just discovered Typophile, and I must say I’m impressed.</p>
    <p>Most of my typographical wanderings have been limited to digitizing scripts for Indian Classical Music. Right from the 100-year-old <em>Bhatkhande</em>, <em>Paluskar</em> and <em>Misrabani</em> scripts, to the modern <em><a class="freelinking-external" href="http://omenad.net">Omenad</a></em> one, my job is to make fonts for all of them.</p>
    <p>Recently though I’ve been working on a publication in Hindi. All of it was written in MS Word using the unicode font Sanskrit 2003 (one of the best I’ve seen), and the Indic IME v5.1 downloaded from <a class="freelinking-external" href="http://www.bhashaindia.com">Microsoft’s BhashaIndia.com</a>.</p>
    <p>Whenever I try importing stuff from Word, the text is split up. Hindi is a complex script, so a single character like क्ष (kSha) is actually made up of three unicode code points: क् (k + halant) + ष (Sha). When I type this <strong>anywhere</strong> in Windows, it works fine, including Internet Explorer, filenames, notepad and of course, Word. However, I haven’t been successfully able to get it to work in ANY design application, including the stables of Adobe and Corel.</p>
    <p>Can somebody please tell me if this is possible? Or whether I’ll have to switch to an MS product like Publisher?</p>
    <p>I’ll be glad for any support!</p>
