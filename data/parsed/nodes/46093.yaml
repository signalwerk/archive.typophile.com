      <p>Dear Satya,<br>
      Quark Express has given me nightmares in its time (not its fault, but my weakness of course). I was aware of the non-unicode locally implemented typefaces, but I’m afraid none of them gives me the range of glyphs provided by Sanskrit 2003 (about 3000). And, being an international standard, I expected (in my naivity) that it would be better supported by international players.</p>
      <p>Another reason for my choosing the medium I did was because the primary work of writing was done using word processors like MS Word and Open Office Writer, which use the Indic IME beautifully. In any case, I am stuck for now.</p>
