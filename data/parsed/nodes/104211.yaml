    <p>Hello everyone,</p>
    <p>I'm looking for a font that appears to be flattened or squished, as if a big boulder were sitting on top of it.</p>
    <p>Does anyone know of a font that achieves this look?</p>
    <p>Thanks in advance to anyone who replies!</p>
