      <p>It is too easy for people to bond by attacking an easy target. Ever hear old men hate on Hillary? People can be on the same team if they can identify a common enemy. It is just a social nervousness. </p>
      <p>Everything is a tool. The second something is perceived as useless or wrong it gains some power. That power can be useful. Our industry tends to be very derivative, with set concepts of what is good. If you can cut against the grain and make something undeniable in its appeal that is off trend, you may find you have created a new trend.</p>
