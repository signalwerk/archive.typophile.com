    <p>Hi,</p>
    <p>So I'm a young designer, about two years out of school. I still run into a lot of people my age that LOVE to talk about their hate of Sand and Curlz. My first guess is that they love the sound of their own voice. My second guess is that they love to sound pretentious. I guess this may be a little juvenile to talk about, given the contributors here at typophile, but I always had it in the back of my mind that perhaps a good typographer could make lead look like gold. I have a gut feeling that as awful as some of these typefaces turned out, the designer must have known what they were doing.</p>
    <p>Do people really have a right to pan these fonts wherever they appear, or do they have places in which they actually work? Has anyone here been forced by a client to use one of these "forbidden" fonts? Why were they created in the first place?</p>
    <p>I would love to see a "bad" font validated. I know "bad" font is somewhat vague, and in the eye of the beholder, but I think we all know all the preloaded/bundled display fonts I'm talking about.</p>
