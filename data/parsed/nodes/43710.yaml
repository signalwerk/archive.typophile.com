      <p><cite>. . . I always had it in the back of my mind that perhaps a good typographer could make lead look like gold.</cite></p>
      <p>I think you've been answered well here, but a little addition on this point. I don't think so. A good typographer can sometimes allow an appreciation of lead. But it is touchy, the same as using a visual pun that many readers won't get. Successfully tarting something up has to follow the first rule of medicine: do no harm. If you can achieve that and add to the enjoyment of those when appreciate your pun -- or use of lead -- you're a good typographer.</p>
