    html: <p>Avante Garde is a good example of a typeface that was verboten when I was in school, but recently found a revival by those who discovered its excellent alternates and unique ligatures set. It went from being a bad substitute for Futura, to being a dynamic display face (as was intended). It's now a trendy typeface that pops up all over. I'm not sure that Papyrus will ever get to that point, but who knows? Sometimes it takes one clever designer to help the rest of us to see with unbiased eyes. Another example is Dave Eggers' <em>McSweeney's</em> using Times New Roman on its cover in an intriguingly complex design. TNR isn't bad, just often abused and as common as dirt. And now that design aesthetic has been reproduced by other designers.</p>
