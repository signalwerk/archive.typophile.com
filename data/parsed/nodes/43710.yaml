      <p>I think that ubiquity of misuse can cause a typeface to be bad in any context. It is impossible to see typefaces like Sand and Curlz in almost any context without naturally making the connection with flyers for barbeques and things like that.</p>
      <p>What I'm more interested in is whether typefaces that are not novelty faces but are still considered bad, like Arial, have any sort of effective use.</p>
