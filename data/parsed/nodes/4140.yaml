    date: 2004-04-06T09:16:00
    date_raw: 6.Apr.2004 9.16am
    votes: null
    html: <p><a href="http://www.myfonts.com/fonts/linotype/goudy-modern-mt/modern-mt/testdrive.html?s=THE%a0PRAGUE%a0POST&amp;p=48" target="_blank">Goudy Modern</a> is in the ballpark. There are some differences, but the overall feel and some of the characters are very close. The long tail on an R is almost always a customization and not a difficult one. There are a few fonts with an R like this, but such a font will not likely match the style in the Prague Post masthead.</p>
    html_clean: <p><a href="http://www.myfonts.com/fonts/linotype/goudy-modern-mt/modern-mt/testdrive.html?s=THE%a0PRAGUE%a0POST&amp;p=48" target="_blank" class="link-external">Goudy Modern</a> is in the ballpark. There are some differences, but the overall feel and some of the characters are very close. The long tail on an R is almost always a customization and not a difficult one. There are a few fonts with an R like this, but such a font will not likely match the style in the Prague Post masthead.</p>
