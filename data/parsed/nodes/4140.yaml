    html: <p>The "TopPharm" logo doesn't look exactly the same, Steven. <br>The serif at the apex of the "A" is missing and its cross-bar is  <br>positioned higher. Also, the tail of the "R" moves away from the  <br>stem at a greater angle in the "TopPharm" logo than in the mast  <br>head. The contrast between thick and thin strokes and the angle  <br>don't match neither.</p>
