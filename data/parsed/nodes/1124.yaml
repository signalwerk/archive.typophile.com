  html: "<p>This is Bitmuni, based on San Francisco MUNI train windows. I've seen this font done in vector form, but I've not seen it in 2-color bitmap, hence my version: <br> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/15227.gif\" alt=\"bitmuni\"> <br> <br>Would love to hear your thoughts. Certainly the original designer of the letter template had to work to get all the letters of the alphabet to work within the constraints. Is this the best solution? I wonder if we at Typophile could come up with a better \"binary\" way of displaying the alphabet... Anyone want to take a crack at it? <br></p>"
  html_clean: "<p>This is Bitmuni, based on San Francisco MUNI train windows. I've seen this font done in vector form, but I've not seen it in 2-color bitmap, hence my version: <br> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/15227.gif\" alt=\"bitmuni\"> <br> <br>Would love to hear your thoughts. Certainly the original designer of the letter template had to work to get all the letters of the alphabet to work within the constraints. Is this the best solution? I wonder if we at Typophile could come up with a better \"binary\" way of displaying the alphabet... Anyone want to take a crack at it? <br></p>"
