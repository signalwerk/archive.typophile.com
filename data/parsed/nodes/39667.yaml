      <p>Hej Petter,</p>
      <p><cite>a font were the lettter E has round corners</cite></p>
      <p><a href="http://www.fontshop.com/fonts/downloads/creative_alliance/jocelyn/?sample_text=CONNECT&amp;sample_size=60" rel="nofollow">Jocelyn</a> by Creative Alliance<br>
      <a href="http://www.fontshop.com/search/?q=FF+Droids+Sans&amp;site=d&amp;sample_text=CONNECT&amp;sample_size=36" rel="nofollow">FF Droids Sans</a>by Donald Beekman<br>
      <a href="http://www.identifont.com/show?4XY" rel="nofollow">Digitalis</a> by Nick Cooke</p>
      <p>I second Kevin, Handel Gothic is a classic in this field, and so is <a href="http://www.fontshop.com/search/?q=bauhaus&amp;site=d&amp;sample_text=CONNECT&amp;sample_size=48" rel="nofollow">Bauhaus</a>. Though they both indeed feel dated, they still might provide a starting point for your logo design.  </p>
      <p><cite>a font that feels like software and safety at the same time</cite></p>
      <p>I’m not sure about this requirement.<br>
      <a href="http://www.primetype.com/faces_info.php?fid=34" rel="nofollow">PTL Notes (Soft/Style)</a> has a technical and modern connotation, to me.<br>
      F</p>
