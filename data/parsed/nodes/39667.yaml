    <p>Im looking for a font were the lettter E has round corners, like the one in the Sony Connect logo (attached). Im working on a logo for a home alarm and software company that doesn't really know which leg to lean on, the alarm leg or the software leg and I shall try to combine theese two into one logo and still keep the message clear. So, if you have an idea of a font that feels like software and safety at the same time I would be happy to read your suggestions. Thank you.<br>
    Petter</p>
