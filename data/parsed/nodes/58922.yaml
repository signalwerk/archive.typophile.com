    html: |-
      <p>@Richard<br>
      <em>Compression as a second step is inherently less efficient, for most, probably inconvenient, and is, in many cases, simply beyond the author’s authority to implement on the web server.</em></p>
      <p>And from your earlier post:<br>
      <em> ... plus the size of each OTF can easily make web authors very, very leery. Every extra second of download time can cost you visitors.</em></p>
      <p>Compression as a second step to what?</p>
      <p>If you are referring to compression that is applied after a simple obfuscation proposed by Ascender, then its compression efficiency is going to be exactly the same as if you applied compression to an original (un-obfuscated) TTF or OTF font.</p>
      <p>If you refer to compression as a second obfuscation step - then the overall obfuscation results will be a lot more efficient as well - the simple obfuscation proposed by Ascender can be easily reversed by hand using any available binary file editor. Using compression as obfuscation is not bulletproof - I am sure there will be an application available on the net that people can download and use to decompress the font file, but there are certain risks involved in doing this and I doubt that many people will actually do it.</p>
      <p>The bottom line - targeted font compression will benefit both authors and web users, and can also benefit font vendors as an additional step in obfuscation mechanism. More so, there are quite a few people who are against applying any sort of obfuscation for fonts but they do agree that font compression is valuable.</p>
      <p>Regarding the author's ability to implement it on a web server – correct me if I am wrong but in this particular case I think we should be considering these possible options:<br>
      1) authors use raw fonts – they create the content and the CSS file that references the fonts and font files to be hosted by a server;<br>
      2) authors create the content and the CSS file that references the fonts and font files but use fonts obfuscated according to the algorithm Ascender has proposed (assuming using readily available tools or web-based service that does it for the author), then they provide obfuscated fonts to be hosted on a server;<br>
      3) same as option 2, but the fonts are also compressed (either by the same tool that obfuscates them or by the same web-based service (e.g. similar to what Ascender offers today for EOT conversion)<br>
      4) same as option 3, but you only compress the fonts before placing them on a server.</p>
      <p>What’s the difference between these options that could possibly affect the author’s authority to implement either one of them on the web server?<br>
      I do agree with you on your second statement I quoted when you say that every second will cost you visitors (and I should also add that every second spent downloading a font will also cost you money – you pay for the bandwidth). This opinion is also shared by many on the CSS list, here are some of them:</p>
      <p>“Yup, good compression/subsetting is a valuable feature in any web-font format, because many of the world's non-European descended languages have very large character sets that overlap little to not at all with English characters.”<br>
      (from <a href="http://lists.w3.org/Archives/Public/www-style/2009Jun/0236.html" title="http://lists.w3.org/Archives/Public/www-style/2009Jun/0236.html">http://lists.w3.org/Archives/Public/www-style/2009Jun/0236.html</a>)</p>
      <p>“Indeed, and there are some attractive technical benefits to EOT, or something similar to it. If you can definitely confirm Monotype's commitment to offer a fully GPL-compatible patent license, ideally with at least draft text of such a potential license (so that others can independently evaluate the issue of license compatibility), then I think the chance of persuading non-MS browser developers to consider adding EOT support will be considerably improved.</p>
      <p>&gt; The solution that is *only* suitable for free fonts is not a good solution.</p>
      <p>Certainly. And even for free fonts, the compression possibilities of EOT could still be very worthwhile.”<br>
      (from <a href="http://lists.w3.org/Archives/Public/www-style/2009Jun/0309.html" title="http://lists.w3.org/Archives/Public/www-style/2009Jun/0309.html">http://lists.w3.org/Archives/Public/www-style/2009Jun/0309.html</a>)</p>
      <p>Regards,<br>
      Vlad</p>
