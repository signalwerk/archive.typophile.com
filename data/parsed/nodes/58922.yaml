      <p>Well, it is essentially defense against the laziest person. Anyone motivated will get at anything without issue, but a lot of people won't bother to go looking for a decryption program or download the files via a torrent, they'll just shrug and drop the encrypted file in the trash. </p>
      <p>It is like those sites that prevent you from directly taking images. If you're motivated enough to take a screenshot and cut it up yourself, you've got your image, but it will stop folk who try to just save image as or drag it from the browser.</p>
      <p>In the internet age, DRM only exists as a challenge for someone to break. Someone will figure out a way to reverse-engineer any file format created and create a perfect copy of the original file, but a modicum of security makes foundries feel better that their fonts cannot be outright stolen and will prevent the lowest level users from just taking.</p>
