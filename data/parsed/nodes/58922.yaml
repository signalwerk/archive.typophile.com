    html: |-
      <p><cite>This new format addresses the needs of web designers, ... </cite></p>
      <p>Web designer just want webfonts and by the end of this year they will be able to deliver them to the majority of users. The web designers don't want URL-binding, obfuscating, same-origin rescriction et cetera. They just don't care about that. </p>
      <p>This new format would even mean more trouble for the web designers, because since current browser versions don't support it, web designers would have to link EOT, TT or OTF and(!) the new OTW fonts. Phew!</p>
      <p><cite>... the desires of the free font community</cite></p>
      <p>In which way?</p>
      <p><cite> the concerns of commercial font vendors </cite></p>
      <p>I'm not sure about that. It will probably take some years to be included in all the browsers, but since you would publicly announce how the fonts are obfuscated, removing this "protection" will be a piece of cake. </p>
      <p><cite>There are five aspects to the proposed web-specific font format:<br>
      -Same-origin restrictions</cite></p>
      <p>What's the connection between a same-origin restriction and the OTW proposal. This can be included for EOT and TT/OT as well (as done in Firefox). No need for a new format here. And it can also be enforced on the server side (e.g. with .htaccess files)</p>
      <p><cite>-Subsetting</cite></p>
      <p>EOT/TT/OTF can be subsetted. What's different with OTW?</p>
      <p><cite>I always rather liked .wtf </cite><br>
      Which most people would probably understand as »What the f***«.</p>
