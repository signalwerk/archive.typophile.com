    html: |-
      <p>I'll support this. There's definitely a need for a new format. EOT was almost the one but it didn't catch on for reasons already pointed out in Bill's article.</p>
      <p>I don't need a format that prevents the determined and skilled from getting at parts of my fonts. I just want to make sure they can't easily grab perfect copies of my fonts in their entirety directly from a URL. I've always liked EOT and found it to be secure enough. I've seen demonstrations of fonts ripped from EOT and they're okay but there's always something missing: complete kerning, copyright info, family naming, several glyphs. It's not the real font. It's like taping a song off the radio. Subsetting is very important to me.</p>
      <p>I played around with EOT about a decade ago and I liked it but the early tools were buggy and there was no Netscape support. I was really disappointed when Safari did the @font-face thing. I want to sell fonts for web use but that was a big step backwards. Every few days I get an email from someone asking me if they can use my fonts for @font-face. I hate saying no, but . . . I don't think people realize that they're really asking, "can I post your fonts on the web with no EULA so anyone with the URL can download a perfect copy?"</p>
      <p>I really hope the OTW format takes off. From the description it has exactly what I've been looking for in a new web format.</p>
