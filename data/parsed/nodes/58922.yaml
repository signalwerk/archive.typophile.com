      <p>@Richard<br>
      <em>... someone commented that MTX compression is under Patent and either can’t be freed up or won’t be freed up by Monotype in a manner suitable to the W3C guidelines so as to be included in a spec, should it come to that.<br>
      True? Is that commenter correct?</em></p>
      <p>Nothing can be further from the truth!<br>
      MTX is a patented technology, however, Monotype Imaging has disclosed this fact and, as a member of W3C, made a commitment to make the IP availbale under W3C Royalty-free policy. These statements are included as part of the original EOT submission: <a href="http://www.w3.org/Submission/2008/01/" title="http://www.w3.org/Submission/2008/01/">http://www.w3.org/Submission/2008/01/</a></p>
      <p>Mozilla complained that the W3C patent policy has a provision known as a "field of use restriction" that makes it incompatible with some open-source licenses. This issue has also been recently clarified, see <a href="http://lists.w3.org/Archives/Public/www-style/2009Jun/0228.html" title="http://lists.w3.org/Archives/Public/www-style/2009Jun/0228.html">http://lists.w3.org/Archives/Public/www-style/2009Jun/0228.html</a></p>
      <p>Regards,<br>
