      Yes, it can. I ran a quick and simple experiment with one of the Monotype fonts – same typeface that is represented in TTF font format uses 66 KB of data, and the OTF font file size is 30 KB (again, mostly due to differences in outline representation and hinting). Compressed OTF (using WinZIP) brought the file size down to 18 KB. I also tried Adobe MinionPro (regular) – OTF size=201 KB, WinZIP=130 KB.</p>
      <p><em> One of the virtues of EOT is that it does quite well at compressing TTF’s down to conscionable levels.</em></p>
      <p>Yes, it does. MTX compression (which is part of EOT, <a href="http://www.w3.org/Submission/2008/SUBM-MTX-20080305/" title="http://www.w3.org/Submission/2008/SUBM-MTX-20080305/" class="link-external">http://www.w3.org/Submission/2008/SUBM-MTX-20080305/</a>) is a two-step process – first stage converts TTF file to minimize/eliminate the redundancy in font data and to subdivide it in separate data blocks that are likely to have similar (repetitive) data patterns; these are likely to produce better compression results when entropy coding is applied at the second stage. The decompressor reverses the process and re-creates TTF font from the compressed dataset. I ran a quick and simple test using WinZIP (at maximum compression level), WEFT and Windows fonts Times NR, Arial, Georgia and Verdana with no subsetting. Here are the results (in KB):<br>
      [font]   [uncompressed]  [WinZIP]  [WEFT]<br>
      Times NR    316          181       142<br>
      Arial       267          148       113<br>
      Georgia     140          90        67<br>
      Verdana     137          81        59</p>
      <p>As can be seen, ZIP file size is on average ~30% larger than EOT size. Please note that OTF fonts share the same table structure as TTF fonts – the only difference between them are TTF and CFF outline tables. Therefore, MTX compression can be easily modified to be applied for OTF fonts - separately compress CFF table and apply the same optimization and compression algorithm for all other tables in a font. I am confident that the OTF compression results will be better with MTX than with generic ZIP.</p>
      <p><em> … Much better the OTW file itself be as small as possible</em><br>
      Yes, I agree. Ascender proposal addresses only a light-weight obfuscation part of the overall solution – but if combined with the same-origin restrictions (e.g. CORS)  and efficient compression it would  become a viable alternative to EOT solution.</p>
      <p>Vlad</p>
