    html: |-
      <p>Hmm, I'm a bit late to this discussion, but anyway:</p>
      <p>@billdavis: "WEFT does not change the order of glyph IDs when subsetting a font. The OpenType Layout tables are not re-written. But the data for the glyphs IDs that are not part of the subset are removed."</p>
      <p>If I'm understanding correctly that it doesn't modify those tables at all, then that doesn't seem like an ideal solution - many fonts have tens or hundreds of kilobytes of data in their GSUB/GPOS tables, almost all of which can be deleted if you're not using all the glyphs, giving a significant space saving.</p>
      <p>It's quite possible to rewrite those tables, and to automatically keep just the extra glyphs that result from substitutions of glyphs in the subset - the (open source) code behind <a href="http://fonts.philip.html5.org/" title="http://fonts.philip.html5.org/">http://fonts.philip.html5.org/</a> does that. (It's kind of complex, and it's certainly not bug-free, but it's worked in all the fonts I've tested so far.)</p>
    html_clean: |-
