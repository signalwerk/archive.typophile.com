      <p>Whatever the merits of EOT, its time has come and gone.<br>
      Several formats once seemed promising, e.g. Multiple Master, GX.<br>
      So OTW stands a better chance now.<br>
      Although it does seem a bit close to the suffix ".otf"--that might be confusing.</p>
      <p>I have a hard time understanding all the technicalities about "embedding bits" etc.<br>
      I would like to be able to make ".otw" fonts for web licensing, with FontLab.<br>
      If OTW could be added to the short list of font formats in the Fontlab "Generate font" dialog, that would open up the market for foundries.<br>
      And similarly, it would appear as an option at font reseller sites. </p>
      <p>We really do need a specific format with suffix, otherwise customers will be wondering whether the .otf or .ttf fonts they have licensed may be used on the web or not, and they are not going to go looking in the EULA.</p>
      <p>So I can see myself licensing an enterprise font solution to a corporation, that contains both .otf and .otw versions of the same font, so they are covered for both web and print use.</p>
