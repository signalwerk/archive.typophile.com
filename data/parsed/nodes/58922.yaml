      <p>I always rather liked .wtf as the format name (web typeface) as referenced in this article: <a href="http://talleming.com/2009/04/21/web-fonts/" title="http://talleming.com/2009/04/21/web-fonts/">http://talleming.com/2009/04/21/web-fonts/</a></p>
      <p>There's been a number of font proposals for a third format, but none of them have really caught on and I think the browser manufactures have essentially ignored them — Microsoft has EOT already and is happy with it, Firefox &amp; Safari are pushing @font-face without any security. So Darrel's comment is particularly pointed. Foundries are important, but without the browser developer's help, it isn't going anywhere. Even Linotype/Monotype/ITC's updated EULA to allow EOT embedding doesn't seem to have made Firefox or Safari reconsider — at least publicly.</p>
