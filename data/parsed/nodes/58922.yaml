      <p>Richard: <cite>"CT fonts are exceptionally good for body text at smaller sizes - and that seems to be the trickiest and costliest of things to make happen in a screen font."</cite></p>
      <p>At small sizes, the number of possibilities for good original body text faces for the web that can be clearly distinguished from each other must be limited by screen resolution. Even with hi-resolution screens and clever things like CT instructions there must be a finite number of ways you can squeeze the letters of the Latin alphabet into pixels available on screen at small sizes and have them remain pleasing, clear, legible and easy to read -yet distinctive and consistent in style.  </p>
      <p>Sure you can always tweak round the edges, but to me there seems little point in trying to produce more and more of these "screen fonts" if they are all going to look pretty much the same at the sizes they are used as those we already have. </p>
      <p>While there still may be some room left for a few more original and useful screen fonts, are we ever going to need (or be able to differentiate between) more than two or three times the number we already have?</p>
