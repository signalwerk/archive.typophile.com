      <p>Whatever the format (EOT or OTW), more embedding bits in the original TTF/ OTF fonts would be nice so that when these web fonts are created - or fonts are embedded in files, <em>whether or not the user actually read the license</em>, they could get a clear indication of exactly <em>what</em> forms of embedding /linking are allowed, and just <em>where</em> this embedding / linking is permitted. The current set of embedding bits are too coarse and generic, being used to cover too many different scenarios.</p>
      <p>For a start, separate sets of flags to indicate whether the font can be embedded e.g. in PDF files, in editable (word processor) documents, on web sites, in e-books, (...) - and at what level for each - would be useful.   </p>
      <p>Of course any browser enabled to download embedded/linked fonts needs to have some easy means of displaying the font the license &amp; copyright fields  - and any embedded links to license, designer and vendor in the original TTF / OTF font files -to the client downloading the fonts.</p>
      <p>- C</p>
