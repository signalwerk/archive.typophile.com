    html: |-
      <p>@dberlow</p>
      <p>Right now, when you specify a font-family using CSS in a web page, you play a game of probabilities. The question being, how probable is it that a particular font-family exists on the user's machine?<br>
      In fact, on another thread here on Typophile named CSS Font Stacks Article, Frode Hellend (frode frank), has put together an excellent table that deals with these probabilities.<br>
      Today, web designers can comfortably rely on a handful of "Web Safe" fonts that approach 100% penetration on both Windows and Mac. They can specify these font-families with confidence that what they design will be pretty much what the user sees. These fonts also provide kind of a safety net of "fallback" choices in lengthier "font stacks". (There is much info on the web about this.)<br>
      Apple licenses the "web safe" fonts from Microsoft because having a baseline like this from which to work seems to work out as a good thing for all concerned. Apple's customers certainly benefit.<br>
      Licensing the ClearType fonts is just an extension of the idea. The CT fonts are excellent. Top quality. They are present in the majority of Windows machines and will inevitably approach 100% propagation among Winows installations as older Windows XP installations without Office 2007, are abandoned. (It's a waiting game of attrition. Like waiting for certain browser versions to disappear. Which is, among web designers, the universal professional pastime.)<br>
      With Apple on board, it wouldn't be long before the ClearType fonts could be counted on by web designers with the same degree of confidence as fonts like Georgia or Tahoma. Result: A more <a href="http://www.readableweb.com">readable web</a>.<br>
      I'm not alone in the opinion. The <a href="http://readableweb.com/apple-and-microsoft-in-talks-on-web-font-protections/">article</a> also cites Joe Clark's post on the subject from four years ago. Joe had it right on the money from the start. IMHO.<br>
      Is it that costly for Apple to give us this, I wonder?<br>
      Or is support for @font-face in Safari an attempted end-run around it? (Stay tuned for part 2 of this saga at readableweb.com)<br>
      Ahh, the tangled web we weave!</p>
      <p>cheers back,</p>
      <p>rich</p>
