      <p>The biggest hurdles to introducing this will be getting the foundries and designers to support another new format, and perhaps biggest of all, the browsers too, which could take a while until the format is widely accepted and used. My gut is that time will be the biggest factor, and it isn't on the side of introducing something new. The next year will be very interesting for webfonts. While the new format might be superior and ideal, I think whatever happens with existing technologies will happen much faster, and if those take hold in a large way, I don't know that something new will have a place.</p>
      <p>Speaking as a web designer, I don't care where my fonts come from, either hosted on my site or by a third party. All I want is for the designers and foundries to get paid well for their work and for it to be a sustainable setup. Then we can tackle the problem of most typefaces being bastardized by browser rendering engines at all but display sizes :)</p>
