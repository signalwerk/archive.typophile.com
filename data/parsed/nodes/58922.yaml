      <p>"San Francisco, Calif. — June 24, 2009 — Small Batch Inc. announced today that they have secured a round of equity funding from a group of investors led by San Francisco-based True Ventures. Small Batch is developing Typekit, a service enabling designers to build sites with web-native typography.</p>
