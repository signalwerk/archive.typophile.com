      <p>@vlad<br>
      &gt;"<em>Aside from this, there are two steps that would be required to implement:<br>
      - on authoring side: an original font will be processed by a tool that obfuscates a font according to the algorithm proposed by Ascender, compresses the data and stores it in a web font wrapper format on a server (something like what WEFT used to do, only easier to use and author-friendly). Authors will then be able to reference this file from CSS stylesheet, and there will be no need for authors to implement special handling of fonts for different browsers.<br>
      - on browser side: a browser unwraps downloaded font file (which would include decompression and de-obfuscation) and processes it the same way raw fonts would be processed.</em>"</p>
      <p>This is very clear and simple. Thanks. We ARE talking about the same thing.</p>
      <p>The only concern I have is with this phrase:<br>
      "<strong>compresses the data and stores it in a web font wrapper format on a server</strong>"<br>
      This seems to me to skip a step and possibly create the wrong impression.<br>
      It makes it sound like the web author who uses the tool to create an OTW file somehow doesn't control the file in the same way he or she controls a gif or a jpg or the OTF of a free font. As if there's some weird requirement that the file exist only on a server from the moment of its creation.<br>
      To clear this up: As a web author, I would use a Weft-like tool to create an OTW file. I would then place it on my web server. I would then use the font by linking to it via @font-face rules in the CSS.<br>
      Correct?</p>
      <p>Further: Regarding the same-domain restriction, I am concerned about pages that are saved by users to their local hard drives. Will the fonts be available?<br>
      I'm also very, very concerned about HTML pages that are a part of E-books created along the lines of the E-Pub specification.<br>
      In those instances, there is no http domain to speak of.<br>
      Now, the Weft tool allows you to specify drive letters like C:, D:, E:, etc... for this purpose. You can also specify sub-folders like C:\mybooks, D:\mybooks\janeaustin, etc...<br>
      Therefore, I don't foresee any objections to "off-line" usage of this kind.<br>
      The OTW file is still uninstallable as it is. It is no less or more protected than if I had peeked at the CSS and specifically downloaded the OTW on it's own.</p>
      <p>However, I think this very much needs to be clarified. I don't want the browser to balk just because the OTW is being called from the local hard drive and not a web server. If a visitor to my site decides to save a page and then, when they open it up for re-reading, my formatting blows up because the font is no longer available <em>to that page</em>, I've got a big problem. That's a bad scenario.<br>
      (And by the way, it's not unusual for a web designer or developer to work with a page this way - displayed off a local drive, independent of a locally running http server like Apache or IIS.)</p>
      <p>Within E-Books, it's even more critical that formatting be preserved.* </p>
      <p>Thoughts from anyone about this?</p>
      <p>*When all this font-embedding business finally gets worked out, it will take a few years but there actually <strong>will</strong> be such a thing as font-based web design. Just like, uh, books and magazines. Remember them? Talk about potential.</p>
