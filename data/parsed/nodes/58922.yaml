      <p>What about using subsetting? I mean: just like with PDF, embedding a subset font that contains only the glyphs that are actually used. That way, if you try to rip off the font, you hardly ever get a complete font.<br>
      The downside would be to know in advance what chars you're going to use, which is no problem for a static page, but might be complicated if your content is pulled from a database.</p>
