      <p>And with no disrespect to Richard Fink, our proposal has nothing to do with the Microsoft web font collection. Sorry to burst your conspiracy theory bubble… :)</p>
      <p>Ascender distributes these fonts under license and would be glad to license them to Apple if they wanted them – we have licensed them to a variety of software &amp; hardware developers. </p>
      <p>The Ascender proposal is focused on the vast collection of commercial fonts in the market that web designers cannot use with @font-face to design web sites. I am glad Richard noted Chris Wilson’s comments “A solution that only works for freeware fonts is not a solution. Is that too much to ask?” That clearly summarizes what we hope to achieve: a cross platform, cross browser solution that includes both freeware and commercial fonts. </p>
      <p>As Typophile readers may know, Ascender is a supporter of EOT, but this proposal did not achieve the support of the W3C. So here we are today with a plethora of techniques to ‘embed’ fonts into web pages, none of which have achieved the broad support of the web design or font design communities.</p>
      <p>Again, I will ask the question (that so far only Ray Larabie has answered): </p>
      <p>Who in the commercial type design/font foundry community supports the idea of a .OTW web font format?</p>
