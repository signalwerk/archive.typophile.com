    html: "<p>@John: This difference just came up today <a href=\"http://lists.w3.org/Archives/Public/www-style/2009Jun/0159.html\" rel=\"nofollow\">on the W3C www-style mailing list</a>: Same-origin restrictions are not the same as root strings; the latter are a way to label the website(s) which the font has been licensed for, and require browsers to not render the font if the URL is not on the label. One effect of this is that other sites can not \"cross link\" to your site's fonts - a same-origin restriction. But a same origin restriction can be put in place without any information in the fonts; its just a standard feature of web servers and web browsers, useful for lots of different kinds of web assets, such as Javascript files (where <a href=\"http://en.wikipedia.org/wiki/Cross-site_scripting\" title=\"http://en.wikipedia.org/wiki/Cross-site_scripting\">http://en.wikipedia.org/wiki/Cross-site_scripting</a> is a security issue.)</p>"
