      <p>@Richard:<em>Please clarify: are you are asking for an up-and-down, take-it-or-leave-it vote? Or will serious and constructive questions and suggestions be entertained?</em><br>
      We would prefer to hear a vote for and against - and for those who don't like it, why not? So yes, we would like comments/suggestions. This discussion has been going on for some time, and with raw TTF and OTF support being added by browsers, we believe this issue is quickly gaining urgency. Thus the time for discussion needs evolve into time for action.</p>
      <p>And thanks for driving home the question poised to everyone in the font community reading this - what do you think of the proposal?</p>
      <p>@Outrasfonts:<em>My question is: Is this new webfont format going to be secure enough to prevent a conversion of OTW to OTF/TTF back again?</em><br>
      No. The best analogy is one others have use that OTW is a small fence to prevent people from walking into your property. It is not a tall barbed wire fence with security cameras. Because the OTW spec will be publicly available, and certainly tools and/or SDKs will be published to help developers implement OTW, someone could easily write a program for end-users to convert OTW fonts back to TTF/OTF.</p>
      <p>But what OTW does accomplish is clearly communicate that the font is intended for web use, vs. TTF and OTF which have been licensed for years by commercial font vendors for desktop use only.</p>
      <p>@cfynn: <em>Is the utility for creating OTW fonts going to go through &amp; re-write the OpenType lookup tables when subsetting a font?</em><br>
      The best way to answer this is to consider how EOT subsets fonts. WEFT does not change the order of glyph IDs when subsetting a font. The OpenType Layout tables are not re-written. But the data for the glyphs IDs that are not part of the subset are removed.</p>
      <p>@Thomas Lord: Thanks for your comments and suggestions. As I stated above, my hope is that we can get some momentum building here around a solution for web fonts.</p>
