    date: 2009-06-17T12:56:00
    date_raw: 17 Jun 2009 — 12:56pm
    votes: null
    html: |-
      <p>John (Mr. Hudson), you wrote: "They want to use their custom typefaces on their websites, but not compromise the exclusivity that is a core value of the investment."</p>
      <p>I agree with Christopher Slye that that's an excellent point.  The web does a very good job of messing up the traditional boundaries between "performance" of a work and "distribution" of the work.  From what little I'm beginning to understand about font maker history this isn't exactly new (e.g, Zapf copies) but the web raises the stakes to a whole new level.</p>
      <p>Hopefully without being too discursive I would note that other media are facing similar problems.  Newspaper content migrates to blogs and search engines which become the primary means of consumption, often depriving the makers of revenue.  Music recordings suffer similarly.  Video content has the same problems.  All of those other industries have been thrashing, for years, in search of a solution to the loss of traditional money-making models.   The battles have reached absurd extremes - for example, the "net neutrality" debate in legislatures and regulatory offices around the world are fueled, in no small extent, by motivations and suspicions of motivations about various parties trying claw back a more traditional notion of walled-garden "performance" of works on the web as distinct from distribution.  The very concept of "DRM" comes from the same efforts.</p>
      <p>Font makers have a rough road ahead.  I guess that's another thing everyone knows but that is worth saying out loud - putting it plainly and frankly on the table.  The problem is that digital fonts are "naturally" (that is, technologically) non-rival.  Copies inevitably propagate.  Mediation in the form of regulation and law enforcement is not absolutely pointless but, to a first approximation, is quite pointless.  (That's "pointless" in the sense of "not going to work".)</p>
      <p>What does work, I think, is concentrating on the commercial world - on commercial uses of fonts as contrasted with private or personal use.  The law still functions, almost even slightly efficiently in that area.  For example:</p>
      <p>Suppose that we have a font whose public licensing information states "no commercial use without consent".  Well, even if a million random bloggers use the font on their non-commercial pages, still, Amazon won't use it on Kindle absent consent (or if they do they can be called to account and they'll settle quickly).  You won't see the font on Google's home page unless an arrangement has been made.  And if you spot it on some paid advertisement from an unauthorized third party - it's easy enough to bring an action against the advertiser, even it's a dinky "Joe's Bait, Tackle, and Beer Shoppe".  Where there are legal revenue streams attached to the use of a font, there is still the chance of enforcing restrictions.</p>
      <p>The commercial world, with its formalities, is the place where exclusivity can still reign.  And I say that as a big proponent of libre fonts!</p>
      <p>Now there are some challenges for the font industry - challenges the video and audio industries have been wrestling with for a few years.  Key among these is "private policing".</p>
      <p>"Private policing" is the activity of privately paying up front for snoops to go and find, on the big Internet, instances of unauthorized commercial use of copyrighted material.  To give you some sense of how far that game is advanced in audio and video recordings:  there is a substantial market for software programs that do things like study all of the videos on YouTube to "listen" for cases of soundtracks that make unauthorized use of restricted-license song recordings.  So if, say, the group Metallica complains that one of their songs is being used in impermissible ways on YouTube, one of these programs can go and automagically find all the videos that seem to use that song and flag them for review and/or removal.</p>
      <p>I think that fonts are going to have to go a similar direction.  The already wide-spread unauthorized use of restricted-license fonts will grow but there is still opportunity to constrain commercial use of fonts.  That opportunity, however, requires a private investment in policing and that investment requires careful thought about costs and benefits.</p>
      <p>To bring this full circle (and thanks for reading this far, if you have):  the "wrapper format" refinement or counter-proposal or however you wish to describe it... the essence is to foreclose the purely innocent but unauthorized conveyance of fonts by creating a uniform and ubiquitous mechanism for, by default, always conveying licensing information along with fonts.  Whether you are in the legal game to protect the status of your libre font or in the game to protect your restricted license you have a hook to hang your hat on if you find a use of your font that either lacks the wrapped licensing information or is a use in violation of that licensing information.  </p>
      <p>I think that that's as much as you can hope for in the digital wonderland / Internet age but I also think it's not such a bad arrangement.  My hope is to see it come to pass for fonts quickly, simply, and agreeably to all stakeholders.</p>
      <p>One last thing:</p>
      <p>I think that there is hope beyond "exclusivity" in this way:</p>
      <p>"Design" taken in a very broad sense is inherently rival, even on the web.  The design of a web presentation is a situated thing, not a file that can be copied.  Fonts are an element of design.  Thus, I foresee a future in which there is a much larger emphasis on bespoke font design as an element of larger design projects.   The downside here is loss of royalties - loss of premium fees.  There will be talented font makers who agree to work, basically, for an hourly rate to create non-rival or less-rival fonts and they will come to dominate the market.  The "font publisher" industry will dry up but individual font-makers can still make a living.  A few real super-stars can make a handsome living.   At least by analogy, that's the pattern taking place in the software development world and I don't see any essential difference between that and the font world that would prevent the pattern from repeating itself.   So perhaps the thing to do is embrace that and work on preparing for it....</p>
      <p>-t</p>
