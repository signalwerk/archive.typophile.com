    html: |-
      <p>“They want to use their custom typefaces on their websites, but not compromise the exclusivity that is a core value of the investment.”</p>
      <p>Yes obviously — we started with this idea more than a couple of years ago, but it's got legs limited by a small number interested in proprietary font exclusivity (founders and custom font IP owners). </p>
      <p>More broadly, we think 'they' want to use 'their' combinations of faces, proprietary or not, that (along with other more and less unique elements like logo and colors) give them a unique visual ID. This is the core value, the entity ID, not the font(s).</p>
      <p>This brings the numbers of potentially interested parties up into the 100's of millions, but also brings the need for rigorous policing of extensively detailed permissions on the part of all kinds of font IP owners. </p>
      <p>And it's hard to imagine, just another wrapper, alone, fixing visual identity theft. ;) </p>
      <p>Cheers!</p>
