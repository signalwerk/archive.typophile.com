    html: <p>Thomas, foundries and their clients have two distinct concerns with regard to web-linked fonts. The first is unlicensed use of fonts to display online text, which your wrapper proposal addresses. The second is web fonts becoming an open distribution mechanism for unlicensed fonts, i.e. people grabbing web-linked fonts off servers and making use of them in other media such as print design. While browser makers can make the wrapped fonts concept work by only displaying text in either a) linked wrapped fonts or b) fonts on the local system, i.e. not unwrapped linked fonts, do you think the wrapper mechanism can be made robust enough to prevent unwrapping of the font?</p>
