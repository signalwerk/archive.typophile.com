    html: |-
      <p>@Richard<br>
      <em>To clear this up: As a web author, I would use a Weft-like tool to create an OTW file. I would then place it on my web server. I would then use the font by linking to it via @font-face rules in the CSS.<br>
      Correct?</em></p>
      <p>Yes, I thought it would be self-evident and skipped it for brevity. And by "a web font wrapper format" I meant OTW or whatever format/extension we might adopt in the future.</p>
      <p><em>Further: Regarding the same-domain restriction, I am concerned about pages that are saved by users to their local hard drives. Will the fonts be available?</em></p>
      <p>I would like to make what I believe is an important distinction: "same-domain" vs. "same-origin" restriction. I mentioned the latter, which should work just fine with saved or cached content - since the fonts do come from the same origin. The same should be true for any content on your local drive, E-book, etc.</p>
      <p>Cheers,<br>
      Vlad</p>
