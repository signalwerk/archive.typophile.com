      <p>@billdavis and all...</p>
      <p><strong>Compression And Reduction Of File Sizes</strong><br>
      I am confused/concerned about this only. As will be many web developers. Sub-setting, of course, can reduce the file size drastically. However, I've yet to get a definitive answer about compression. I have it from Thomas Phinney that OTF CFF provides a high degree of compression on it's own. But can it be improved? Also, TTF's are going to be around for a long while. One of the virtues of EOT is that it does quite well at compressing TTF's down to conscionable levels.<br>
      Even when sub-setted, calling a font-family's regular, italic, and bold faces takes three separate calls to the server. That, plus the size of each OTF can easily make web authors very, very leery. Every extra second of download time can cost you visitors.<br>
      Yes, it's possible a standard compression mechanism like gzip can be brought into play. But that's very much a "server side" thing that many authors have no familiarity with. Plus, many if not most, don't have access to the server configuration files required to make that happen.<br>
      Much better the OTW file itself be as small as possible.</p>
      <p>I don't have any skin in this game right now except as an informed commentator on <a href="http://www.readableweb.com" rel="nofollow">Readable Web</a> where I'll be following closely the successes and failures as font-linking is actually deployed. (<em>Wink:</em> Might be worth an <a href="http://readableweb.com/feed/" rel="nofollow">RSS feed</a>.)</p>
      <p>I vote yes, go for it, and don't let go. In my humble opinion, developers aren't going to be too happy 24 months from now. Bloated pages with little to show for it.</p>
      <p>This is going to be a long show. There will be an intermission AND a 2nd act. But at least, finally, the curtain is going up.</p>
