      <p>Thanks James, Richard, and John.  And John, I owe you some answers!  So here:</p>
      <p>You ask the difference between "root strings" and "same-origin restrictions".  The difference concerns who is enforcing what.</p>
      <p>Root strings are the notion that a font file ought to contain meta-data which says "this font is intended only for use to display web pages from legit.example.com" - and the browser is expected to enforce this.  In the case of a seemingly unauthorized use of the font, the browser has the font and has a page from illegit.example.com (or from the local disk).  The browser is perfectly capable, technologically speaking, of rendering the page using the font - but the root string proposals are that to be conforming to standards, the browser must not render the page.</p>
      <p>The problem with root strings is that a user who is already in possession of the page from illegit.example.com and already in possession of the font may be doing something perfectly legal, perhaps even life critical.  If the browser refuses to permit this, it has a bug.  A W3C recommendation should not require browsers to have bugs, especially bugs that can be harmful in a life-critical situation.   I have a slightly longer form of this argument here: <a href="http://noeot.com/shoulda-woulda-coulda.html" title="http://noeot.com/shoulda-woulda-coulda.html">http://noeot.com/shoulda-woulda-coulda.html</a>  That other version focuses on the sometimes eye-splitting use of formal language in standards, though.</p>
      <p>In contrast, the "same origin" restriction works this way:  suppose that a properly functioning browser loads a page from illegit.example.com and that page links to a font from legit.example.com.  When the browser requests the font for download, the request includes a declaration from the browser: "Hey, server, I would like font X because it is linked from a page on illegit.example.com".   If the operator of legit.example.com has configured his server in a certain way, the server will say "I can't give you that font."   (If the browser had said "I need this font for a page from legit.example.com" then the server would provide the font.  The browser could lie to the server and perhaps get the font, but no standards-conforming browser would do so.)</p>
      <p>In the "same origin" scheme, restricted font licenses would require those who use them on the web to configure their servers to enforce same-origin restrictions.   "I'm allowed to put this font on the Web but only if I configure my server to not serve it up other than for requests based on links from authorized pages."</p>
      <p>Same-origin restrictions are not a bug, in and of themselves.  It is important for many reasons that the operators of servers be able to configure their servers to refuse requests for materials linked from certain other sites.   There is the possibility that a particular use of same-origin restrictions could be an abuse of that feature and could cause life-critical problems and could be called a bug.  Nevertheless, nothing about a recommendation to use same-origin restrictions for some fonts would force people into such abuses and so a W3C recommendation along those lines would not be "mandating a bug".</p>
      <p>Your other question is "can wrapping be implemented so as to prevent unwrapping"?  That is, can't someone download a wrapped font, unwrap it, and then (assuming the font is restrictively licensed) be in possession of an unauthorized yet fully functional copy of the font?</p>
      <p>No, my proposal can not prevent unwrapping fonts that way.  I don't think that that property is unique to my proposal, though: all web font proposals (including the original EOT strawman) share the same property.</p>
      <p>I think this is as much as anyone can hope for: "unwrapping" a font in that way requires one of two things.  On the one hand, "unwrapping" may happen because a user knows, or ought to know that they are circumventing copyright and licensing restrictions.   On the other hand, "unwrapping" may happen because a user innocently uses a software feature that was designed to circumvent copyright protection.   In the first case, culpability is easier to attribute to the user after the fact.  In the second case, culpability can be attributed to the author of the program the innocent user used.</p>
      <p>Unwrapping, origin restrictions, and so forth are always going to be "leaky" solutions.  That is a fact of the nature of the technology.</p>
      <p>I think that what font vendors interested in restricted licensing have to be aware of and thoughtful about is the "RIAA trap".  If the vendors hope ultimately to track down and stop every violator of their licenses they will certainly wind up reaching levels of absurdity, bad behavior, and ill repute like those of some in the music publishing industry.  The basic reality is that unauthorized use of fonts happens, will happen more in the future, and stopping it is not only impossible but damaging to those who work to hard at trying.</p>
      <p>Rather, I think the vendors need to concentrate on mechanisms that help keep honest and lawful players lawful and honest.   </p>
      <p>The idea of a wrapper format for all media types helps to create a medium in which honest players conveniently and automatically receive, perceive, preserve, and propagate licensing information as they obtain, use, and further distribute fonts.   The idea is to simply keep honest players fully informed and let them make their own choices, using a simple, effective, and simple technological solution.</p>
      <p>-t</p>
