    html: |-
      <p>@dberlow<br>
      <em>Vlad, can you please list the main steps from where we are, to where EOT is deployed to all?</em></p>
      <p>David, sorry for a delay in answering your questions, I’ve been swamped.</p>
      <p>The proposal that is currently being considered by W3C has evolved from the original EOT solution and includes the following aspects:<br>
      - same-origin restriction (which can be lifted by access control headers on a server side), and<br>
      - simple obfuscation + targeted font compression.</p>
      <p>Same-origin restriction and access control are intended to restrict other websites from using fonts on your server (and would work very similar to what Ralf Hermann described in one of his posts).</p>
      <p>Aside from this, there are two steps that would be required to implement:<br>
      - on authoring side: an original font will be processed by a tool that obfuscates a font according to the algorithm proposed by Ascender, compresses the data and stores it in a web font wrapper format on a server (something like what WEFT used to do, only easier to use and author-friendly). Authors will then be able to reference this file from CSS stylesheet, and there will be no need for authors to implement special handling of fonts for different browsers.<br>
      - on browser side: a browser unwraps downloaded font file (which would include decompression and de-obfuscation) and processes it the same way raw fonts would be processed.</p>
      <p>The benefits of this solution:<br>
      - Simple and unified workflow for web authors, universally supported by all browsers (at least, this is the goal);<br>
      - Font files that are placed on a server are wrapped in a web-specific format. The font data is compressed which will reduce the download time.<br>
      - Simple pre-processing on browser side, compatibility with the existing and already implemented raw TrueType workflow.</p>
      <p>Wrapped fonts cannot be downloaded and installed as a system font, one would have to use a software tool to unwrap and decompress a font first. I am sure someone will come up with such tool, and it’s impossible to completely prevent font piracy, but such actions would mean willful act of piracy and I doubt many people would want to do it.<br>
      To the contrary, having raw fonts on a server means that anybody can download and install a font as is, and people may likely to consider this as appropriate action (simply because font is on a server, unprotected and easy to grab).</p>
      <p>I cannot give you any exact estimate of risk reduction afforded by the font wrapper solution, but, as an analogy, I see this solution like a small padlock on the door – something that is easy to put in place, will not stop a burglar but will deliver a clear message: “do not enter”.</p>
      <p>Regards,<br>
      Vlad</p>
