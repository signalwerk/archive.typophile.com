      <p>Richard, <a class="freelinking external" href="http://www.adobe.com/type/opentype/qna.html" rel="nofollow">this blurb</a> from an Adobe type FAQ helps a little:</p>
      <p><cite> All OpenType fonts with PostScript outlines (.otf) use Compact Font Format (CFF, or Type 2) for considerable size reduction. Although CFF is not strictly compression, since the outlines do not have to be decompressed to be rendered, the result is still more compact than Type 1. Adobe’s OpenType fonts also use subroutinization for additional size reduction. OpenType fonts with TrueType outlines (.ttf) have the option of using compression technology licensed by Microsoft.</cite></p>
      <p>It seems we might have specific numbers somewhere, but I'll have to look around. Can it be improved? I don't really know the answer, but my gut feeling is that -- like other lossless compression like TIFF or FLAC -- it's probably about as compressed as it's going to get. As Thomas pointed out, there is some benefit to compressing the layout tables, especially when they're large, but you'll probably find that ZIP-ing CFF-OTFs doesn't do too much.</p>
