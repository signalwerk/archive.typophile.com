    <p>All:</p>
    <p>I need to arrange a sizeable number of ornaments and would like to use BorderMaker.</p>
    <p>I am away from home base — where I have a G3 Mac running System 9.2 and System 8.6 — and with me at the moment I have only my aluminum PowerBook, which runs Sys 10.3.9 and Classic.</p>
    <p>I have the BorderMaker folder on a b/u CD from my G3, so I drag-copied it onto the PowerBook, initiated the app by double-clicking it, Classic started up, and the splash screen appeared for BorderMaker. But now the app hangs and will not present a menu.</p>
    <p>I started by posting a note asking if anyone is still using BorderMaker. Now I am broadening this to ask help from anyone who can suggest how to troubleshoot the running of a Pre-Cambrian application on Classic.</p>
    <p>Any tips very gratefully received! I can do this in Quark but it sure would be nice to use Bordermaker.</p>
    <p>Bruce</p>
