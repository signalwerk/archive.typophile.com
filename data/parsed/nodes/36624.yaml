    html: <p>I used to do this when I had a problem. I would shut off all but basic fonts and see if that works. If so find which font is crashing. 2nd I would take half the extensions out of the extension folder. If it works I would put half of the extensions that I removed back if it crashes I know its in that group etc. Most of the time it was a font sometimes it was an extension. Sometimes it’s a conflict with another app running.</p>
