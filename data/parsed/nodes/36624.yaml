      <p>68K vs. PowerMac?</p>
      <p>I kept my Quadra 800 (68K processor) until around 2001, when it finally gave up the ghost. And the last time I used BorderMaker was probably before 2001. Maybe whatever work I did in BorderMaker was done on *that* computer, and therefore the application is not PowerMac friendly?</p>
      <p>Other apps in the Sys 9 folder seem to boot up just fine under Classic.</p>
      <p>The creation date on the BorderMaker app is November 1994.</p>
      <p>Bruce</p>
