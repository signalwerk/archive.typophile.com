      <p>One of my favorite fonts is Gentium from<br>
      <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=FontDownloads" title="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=FontDownloads">http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=FontDownloads</a><br>
      It comes in Regular, Italic, Bold, Bold Italic -- plus a huge character set. There are two versions: Gentium and Gentium Plus.  Both are free, with an Open Source License.</p>
      <p>If you like it, be sure and use the one from the SIL website for print; there is a webfont version available through Google fonts.</p>
