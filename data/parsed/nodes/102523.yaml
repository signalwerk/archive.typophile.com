    <p>Hi,</p>
    <p>I'm not actually writing a bachelor thesis about typography but I do want it to look nice, and above all easy to read.</p>
    <p>What do you think about Merriweather set at 10 / 16 with an appropriate column width. <a href="http://www.google.com/fonts/specimen/Merriweather" title="http://www.google.com/fonts/specimen/Merriweather">http://www.google.com/fonts/specimen/Merriweather</a></p>
    <p>Also I'm looking for a cool sans-serif font that combines well with Merriweather for the chapter titles. I might use all caps. Any ideas?</p>
    <p>Thank,</p>
    <p>Tim</p>
