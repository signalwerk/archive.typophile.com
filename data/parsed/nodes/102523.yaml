    html: |-
      <p>According to the designer, Eben Sorkin:<br>
      "Merriweather was designed to be a text face that is pleasant to read on screens."</p>
      <p>I would not consider using a font designed to display properly on a screen for printing on paper regardless of the printing method. It may not look as it should; in fact, it probably won't.</p>
      <p>Also, it is a design commissioned by Google; they paid rock-bottom prices to the designers so I would not want to depend upon their quality.</p>
