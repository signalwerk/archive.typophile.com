      <p>Is this for screen or print? Your "10/16" makes me think it's the latter.</p>
      <p>Merriweather is heavily optimized for onscreen text - its x-height is pretty massive. In print such proportions are suited for very small text - nothing close to sizes good for extended reading. Plus it doesn't have an Italic (at least not yet).</p>
      <p>Trying to think of typefaces in that genre... Maybe one of these:<br>
      <a href="http://www.myfonts.com/person/Dieter_Hofrichter/" title="http://www.myfonts.com/person/Dieter_Hofrichter/">http://www.myfonts.com/person/Dieter_Hofrichter/</a></p>
      <p>hhp</p>
