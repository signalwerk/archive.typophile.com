      <p>I've just posted version 0.2, which includes 198 kanji including all 80 of the Grade One "daily use" kanji from the Japanese school curriculum.  There's still a long way to go, but some progress has been made.</p>
      <p><img src="http://ansuz.sooke.bc.ca/fonts/tsuku-fontchip.png"></p>
      <p>The distribution (ZIP file containing four OTFs, documentation, and source code for those and the rest of the fonts) is at <a class="freelinking external" href="http://ansuz.sooke.bc.ca/page/fonts#tsukurimashou" rel="nofollow">http://ansuz.sooke.bc.ca/page/fonts#tsukurimashou</a> (English) and <a class="freelinking external" href="http://ansuz.sooke.bc.ca/page/fonts-jp/_1#tsukurimashou" rel="nofollow">http://ansuz.sooke.bc.ca/page/fonts-jp/_1#tsukurimashou</a> (日本語).  A PDF demonstrating the different styles (for those who don't want to download the whole package) is at <a class="freelinking external" href="http://ansuz.sooke.bc.ca/fonts/tsuku-demo.pdf" rel="nofollow">http://ansuz.sooke.bc.ca/fonts/tsuku-demo.pdf</a></p>
      <p>The new version includes proportional spacing and kerning in addition to the monospace fonts.  That makes the documentation (which is in English and typeset using the package's own fonts) a lot pleasanter to read.  I still intend these fonts primarily for Japanese, but it's now possible to use them for nontrivial English text as well.  There's also a new Autotools-based build system included.</p>
