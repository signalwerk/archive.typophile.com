    html: <p> The problem I had with this article- the author of the article talks about how designers are more and more using "non-font" solutions. Isnt that what good designers do anyway? But what I've noticed is more and more designers turning to uncreative font solutions- like the person who designed this spread. You're designing a spread about not using fonts, AND THEN YOU GO AHEAD AND MAKE A BORING SPREAD USING A COUPLE ORDINARY FONTS THAT WERE NOT EVEN KERNED. damn this mag sucks. It reeks of amateur hell. </p>
