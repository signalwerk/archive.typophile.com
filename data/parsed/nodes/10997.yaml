    html: <p> I don't have a problem with using type to communicate a story about not using type. It might be fairly literal to use handwriting/rubberstamps/chickenfeet/whatever, but that doesn't make it clever, or necessarily appropriate. Presumably there were illustrations which served to communicate the process of non-font design? </p>
