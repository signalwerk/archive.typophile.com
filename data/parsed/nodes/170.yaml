    html: '<p>If anybody is interested I have written an applescript that allow polygonal shape to be scale up or down in the (leonardo da pisa) fibonaci serie. <br> <br>It works with illustrator 10 in osX, in the past I have used it to define the thickness of some initial and logo... <br> <br>It can also be use to build different successive generations of whorled shapes: fibonnacci whorl, whorled pentagon, etc. <br> <br>Inside the script 1+sqrt5/2 = phi can be easily change to root 2, 3 or 5 series: <br> <br><a href="http://www3.telus.net/~martinga/goldensection.sit" target="_blank">http://www3.telus.net/~martinga/goldensection.sit</a> <br> <br>and if you find the subject fascinating like i do then those 2 books are very enlighting: <br> <br>from a mathematical mind: gnomon, from pharaohs to fractals (princeton) <br> <br>from a designer mind: geometry of design (princeton) <br></p>'
    html_clean: '<p>If anybody is interested I have written an applescript that allow polygonal shape to be scale up or down in the (leonardo da pisa) fibonaci serie. <br> <br>It works with illustrator 10 in osX, in the past I have used it to define the thickness of some initial and logo... <br> <br>It can also be use to build different successive generations of whorled shapes: fibonnacci whorl, whorled pentagon, etc. <br> <br>Inside the script 1+sqrt5/2 = phi can be easily change to root 2, 3 or 5 series: <br> <br><a href="http://www3.telus.net/~martinga/goldensection.sit" target="_blank" class="link-external">http://www3.telus.net/~martinga/goldensection.sit</a> <br> <br>and if you find the subject fascinating like i do then those 2 books are very enlighting: <br> <br>from a mathematical mind: gnomon, from pharaohs to fractals (princeton) <br> <br>from a designer mind: geometry of design (princeton) <br></p>'
