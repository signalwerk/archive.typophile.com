    html: <p>Back when ITC released their Bodoni, their <i>U&amp;lc</i> magazine ran a feature on what various type designers thought made a typeface 'timeless' (or was it 'classic'). I recall that Carol Twombly mentioned that the golden section had a tendency to pop up all over many of the typefaces that we consider classic. An obvious place to start looking is in the proportion of x-height to ascender or cap height. <br> <br>I don't think Carol made it clear whether this frequent occurence of the golden section in type design was due to intention or simply to a good designer's natural feel for pleasing proportions.</p>
