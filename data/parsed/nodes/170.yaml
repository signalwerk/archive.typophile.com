    html: "<p>I have a little booklet from Underware which shows a diagram of Dolly's proportions and explains that  <br> <br><i>\"De x-hoogte verhoudt zich tot de stokhoogte als de Gulden Snede; a : b = b : (a+b).\"</i> <br> <br>I don't know a stitch of Dutch, but I'm guessing a rough translation would be \"The relation of the x-height to the ascenders in the Golden Mean.\" Which, upon measuring, indeed it is -- approximately 1.618. The relation to the descender is not quite f, being only 1.6. <br> <br>-- K. <br></p>"
    html_clean: "<p>I have a little booklet from Underware which shows a diagram of Dolly's proportions and explains that  <br> <br><i>\"De x-hoogte verhoudt zich tot de stokhoogte als de Gulden Snede; a : b = b : (a+b).\"</i> <br> <br>I don't know a stitch of Dutch, but I'm guessing a rough translation would be \"The relation of the x-height to the ascenders in the Golden Mean.\" Which, upon measuring, indeed it is -- approximately 1.618. The relation to the descender is not quite f, being only 1.6. <br> <br>-- K. <br></p>"
