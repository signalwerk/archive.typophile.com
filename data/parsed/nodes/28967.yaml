      <p>My guess is some kind of <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;startrow=1&amp;records=20&amp;currpage=1&amp;totalrecords=58&amp;searchby=&amp;searchID=&amp;searchletter=&amp;searchstr=caslon&amp;font_categories_checkbox=font_name_search&amp;fontRendererText=A+Series+of+Unfortunate+events"> caslon </a> perhaps 540?</p>
      <p>I was difficult with my crappy amazon sample, you would be able to judge better with the book in front of you; I looked at the capital T, the lowercase g, the capital O and the lowercase t mainly.</p>
