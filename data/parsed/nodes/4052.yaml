    html: "<p>Might it have been a way for people with imperfect lettering skills (probably 90% of us...) to save money on typesetting? I think at the very least the difficulty of getting good setting for cheap was a catalyst for giving it such a \"hand-made-font\" look. Saving money and creativity often go hand-in-hand. Frankling was wrong: it's not necessity that's the mother of invention, it's laziness! And greed is its father. <br> <br>One interesting thing in my sample above is that Courier's bad spacing (being a monospaced font) has been reproduced exactly! It seems like the author used tracing paper directly over laserprinted settings of Courier... In the 70s, maybe they used font specimen books that way? <br> <br>hhp <br></p>"
    html_clean: "<p>Might it have been a way for people with imperfect lettering skills (probably 90% of us...) to save money on typesetting? I think at the very least the difficulty of getting good setting for cheap was a catalyst for giving it such a \"hand-made-font\" look. Saving money and creativity often go hand-in-hand. Frankling was wrong: it's not necessity that's the mother of invention, it's laziness! And greed is its father. <br> <br>One interesting thing in my sample above is that Courier's bad spacing (being a monospaced font) has been reproduced exactly! It seems like the author used tracing paper directly over laserprinted settings of Courier... In the 70s, maybe they used font specimen books that way? <br> <br>hhp <br></p>"
