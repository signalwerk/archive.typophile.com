    html: <p>Yes, in the 70s we used to comp headlines for rough layouts by tracing over specimen books. The layout paper pads were not tracing paper, but high-quality rag paper, with enough transparency to do this (or trace over one's previous sketches, or a photocopy blow-up, whatever). <br> <br>So, back then, "the preposterous google" represents a "rough layout" look that was being used as finished artwork. (After all, illustrators would have been familiar with receiving "tight comp" layouts with this kind of lettering, from art directors, for positioning their illustrations.)  <br> <br>Now, the traced Courier appears to be about humanizing technology, and also represents the present-day myth that stuff for kids should look crudely formed, like they did it.  <br> <br>That is really ••••••• stupid, IMHO -- not the way to educate children at all. Just because kids can't do sophisticated handwriting, doesn't mean they can't appreciate or understand it. Besides, Adults can't write any better either! <br> <br>Sure, Dr Seuss had wacky wonky lettering on his book covers, but it was beautifully drawn (unlike the recent travesty of his lettering in the Myers movie which was carried over into his re-released books), and inside his books the youngsters got Garamond and Century. No wonder boomers are so much smarter than subsequent generations -- we grew up reading decent typography!</p>
    html_clean: <p>Yes, in the 70s we used to comp headlines for rough layouts by tracing over specimen books. The layout paper pads were not tracing paper, but high-quality rag paper, with enough transparency to do this (or trace over one's previous sketches, or a photocopy blow-up, whatever). <br> <br>So, back then, "the preposterous google" represents a "rough layout" look that was being used as finished artwork. (After all, illustrators would have been familiar with receiving "tight comp" layouts with this kind of lettering, from art directors, for positioning their illustrations.)  <br> <br>Now, the traced Courier appears to be about humanizing technology, and also represents the present-day myth that stuff for kids should look crudely formed, like they did it.  <br> <br>That is really ••••••• stupid, IMHO -- not the way to educate children at all. Just because kids can't do sophisticated handwriting, doesn't mean they can't appreciate or understand it. Besides, Adults can't write any better either! <br> <br>Sure, Dr Seuss had wacky wonky lettering on his book covers, but it was beautifully drawn (unlike the recent travesty of his lettering in the Myers movie which was carried over into his re-released books), and inside his books the youngsters got Garamond and Century. No wonder boomers are so much smarter than subsequent generations -- we grew up reading decent typography!</p>
