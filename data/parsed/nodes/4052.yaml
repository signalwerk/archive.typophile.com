  html: "<p>I saw a children's book where the text is a hand-rendering of a font - Courier: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/32396.gif\" alt=\"unCourier\"> <br> <br>It's like the opposite of a handwriting font! <br> <br>Any other examples of this you guys know of? Particularly where it's not a self-conscious act. When the writer is explicitly trying to make a point about the reversal, it's a lot less interesting [to me]. <br> <br>hhp <br></p>"
