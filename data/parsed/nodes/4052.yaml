    html: "<p>I think that playing with the choice of face and how it's set adds a lot to kid's picture books. Here's another good one that also uses a drawn version of Courier. \"Click, Clack, Moo - Cows That Type\" by Doreen Cronin. It was a favorite of my youngest daughter. <br> <br>There's an inside spread on Amazon's webpage: <a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0689832133/qid=1080865706/sr=1-1/ref=sr_1_1/002-3647610-0932843?v=glance&amp;s=books\" target=\"_blank\">http://www.amazon.com/exec/obidos/tg/detail/-/0689832133/qid=1080865706/sr=1-1/ref=sr_1_1/002-3647610-0932843?v=glance&amp;s=books</a></p>"
