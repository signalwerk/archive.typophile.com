    html: |-
      <p>There are a fair number of budget hotels in the downtown area, some of them are even more-or-less walking distance from the Crowne Plaza.</p>
      <p>For instance, the Kings Inn on 5th Ave apparently starts at $59/night and is walking distance (9 blocks, 0.7 miles).</p>
      <p>See for instance:<br>
      <a href="http://www.all-hotels.com/usa/washington/seattle/central__downtown_c1.htm" title="http://www.all-hotels.com/usa/washington/seattle/central__downtown_c1.htm">http://www.all-hotels.com/usa/washington/seattle/central__downtown_c1.htm</a></p>
      <p>The Travelodge by the Space Needle and the Quality Inn at 225 Aurora Ave N are both about 1.2 miles from the Crowne Plaza. The Eighth Avenue Inn is about 0.9 miles.</p>
      <p>Downtown Seattle has pretty good public transit to most areas, so if you want to stay a little further afield and bus in that's also an option.</p>
      <p>Cheers,</p>
      <p>T</p>
