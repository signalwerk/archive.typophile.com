  html: <p>Who's going to TypeCon? I'm happy to help hook up roommates at the conference hotel and answer any questions. I can't wait to see everyone! I'll arrive Saturday, July 28. A little group of us are driving up to Seattle from the Bay Area - I hope we can find a way to brand the SOTA van without angering the rental card gods... I'm looking forward to this little road trip - properly documented with photos taken of signage all along the way, of course!</p>
