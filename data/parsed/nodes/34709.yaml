      <p>OK, weird, the first time I've ever had a double post. It's terrifying!</p>
      <p>So I'll just mention that early bird has been extended through midnight Pacific, July 5. That's this Thursday! Some of the workshops are full now, so hurry up if you want to take one.</p>
      <p>And this thing we call TypeCon - it's August 1-5 in Seattle! A feast of typographic goodness. <a href="http://www.typecon.com" title="http://www.typecon.com">http://www.typecon.com</a></p>
