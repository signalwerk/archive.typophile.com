  html: |-
    <p>I began this font 15 years ago on the study of the document "Biblia poliglota complutense".<br>
    I decided to reconsider this font because of the ask of a publishing house to design layouts for Bibles.<br>
    It will be available in roman, italic and bold with small capitals and oldstyle figures.<br>
    Available on March 2011 on <a href="http://www.editions205.fr" title="http://www.editions205.fr">http://www.editions205.fr</a><br>
