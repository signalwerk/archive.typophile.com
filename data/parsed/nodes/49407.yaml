    html: <p>I believe this is <a href="/wiki/Jan%20van%20Krimpen" class="freelinking" rel="nofollow">Jan van Krimpen</a>'s Lutetia. Never been digitized. My friend lucked upon a font of metal Lutetia last year at a press's fire sale. The shapes have remained in my head ever since. Doyald Young wrote an article about the face and you can download it at <a href="http://typeculture.com/academic_resource/articles_essays/" rel="nofollow">Type Culture</a>.</p>
