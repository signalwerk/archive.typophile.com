  html: |-
    <p>Hello</p>
    <p>I have just discovered the site. What a great resource. Anyway..<br>
    Just wondering whats the preferred way of setting c.  ?<br>
    Im using text figures. Is it a lowercase c or a latin small c?<br>
    I read in a book that its better if you use text figures with<br>
    lower case and titling figures with upper case.<br>
    Should the c. be the same size as the numerals?<br>
    Is this the general rule that everyone uses?<br>
    I have seen some books with titling numerals with lowercase,<br>
    and to be honest it looks odd. Some of the books are well designed<br>
    some of them not (these are the ones I don't trust)</p>
    <p>D.</p>
