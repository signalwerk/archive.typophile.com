    html: |-
      <p><em>I would stick with a lowercase c. (with a period) especially if you have e.g. and i.e. in the document.</em></p>
      <p>Tim, you're welcome to do it your way; however, <em>The Chicago Manual of Style</em> recommends: "Common Latin abbreviations such as 'etc,' 'eg,' 'ie,' are set in roman type without punctuation." This includes <strong>c</strong> for <strong>circa</strong>; <strong>c.</strong> is commonly used as an abbreviation for <strong>century</strong>. So, "circa 16th century" would translate as "c 16th c." Or not...</p>
    html_clean: |-
      <p><em>I would stick with a lowercase c. (with a period) especially if you have e.g. and i.e. in the document.</em></p>
      <p>Tim, you're welcome to do it your way; however, <em>The Chicago Manual of Style</em> recommends: "Common Latin abbreviations such as 'etc,' 'eg,' 'ie,' are set in roman type without punctuation." This includes <strong>c</strong> for <strong>circa</strong>; <strong>c.</strong> is commonly used as an abbreviation for <strong>century</strong>. So, "circa 16th century" would translate as "c 16th c." Or not...</p>
