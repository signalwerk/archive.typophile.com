    html: |-
      <p>Perhaps one of the reasons that the "no period" version doesn't look as logical as it used to is that we come across a lot of mixed alpha-numeric "words" these days, eg (ha!) in passwords.</p>
      <p>However, as the abbreviation for software versions is " v4.3" rather than v.4.3, and being a minimalist, I would stick with Chicago.</p>
      <p>Also, Bringhurst is in the tradition of "anti-unnecessary marks", which he characterizes as filling text with grapeshot (or something similar, can't remember exactly).</p>
