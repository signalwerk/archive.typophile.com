    html: |-
      <p>In CMS, possibly, however I would use punctuation for etc. e.g. i.e., the abbreviation for century commonly used in UK is C. The Oxford house style and Hart's Rules suggest any abbreviation that has the first and last letter needn't be punctuated whereas any other lowercase abbreviation should be. </p>
      <p>c. 16th C (or c. C16) is how I would set circa 16th century.</p>
      <p>{edit Bringhurst's quote is "birdshot and wormholes"}</p>
      <p>Tim</p>
