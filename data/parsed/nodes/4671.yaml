    html: '<p>Thank you for the link to Genitum...I had noticed it before and thought that it looked very interesting and complete, but I was concerned that it was not postscript. I always feel a little leary of TrueType... <br> <br>I have also found the following fonts for IPA: <br> <br>Newton from Paratype <br>&lt;<a href="http://www.paratype.com/welcome_e.htm" target="_blank">http://www.paratype.com/welcome_e.htm</a>&gt; <br> <br>And Le Monde journal IPA <br>&lt;<a href="http://www.typofonderie.com/alphabets/view/lemondejournalipa" target="_blank">http://www.typofonderie.com/alphabets/view/lemondejournalipa</a>&gt; <br> <br>Also, a thread here at typophile from Peter Bilak mentioned an IPA version of Federa; will that be available commercialy however? (I do hope so!)</p>'
