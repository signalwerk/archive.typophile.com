    <p>Howdy Typophiles,</p>
    <p>I was referred here by Mike Yanega, Bowfin Printworks.</p>
    <p>In early 2005 I designed a website for a client using<br>
    a PC running windows 2000.  In the interim I have learned a<br>
    valuable lesson in web design - always document your<br>
    color schemes and font choices.</p>
    <p>Recently I was forced to upgrade my OS to XP and<br>
    failed to document my collection of Fonts.  Then of<br>
    course the customer called out of the blue requesting<br>
    a site change... DOH!</p>
    <p>So my dilemma is, I have searched high and low all<br>
    over the net and have not been able to find the font<br>
    used at <a href="http://www.jimsweetwater.com" title="http://www.jimsweetwater.com">http://www.jimsweetwater.com</a> </p>
    <p>The font is used all over the home-landing page and is<br>
    also employed as the font for the text buttons and<br>
    headers on the sub pages.</p>
    <p>The font is characterized by open (unclosed) lower<br>
    case a, b, d, e, g, &amp; p.</p>
    <p>If you can help ID this font I’d be truly grateful.<br>
    I need to create new text buttons and without this font I’ll<br>
    have to recreate every button on the site.</p>
    <p>Thanks!</p>
    <p>Treblemaker<br>
    SF, CA<br>
    <a href="http://www.WorldWideTed" title="http://www.WorldWideTed">http://www.WorldWideTed</a></p>
