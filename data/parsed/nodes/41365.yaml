      <p><cite> But please explain how measuring the “whatever-ability” of a group of items does NOT result in an index/table of their relative merit?</cite> This is pretty vague.</p>
      <p><cite> If typeface A has bigger serifs than typeface B, how do you know it is serif size and not some other difference you are measuring? </cite> Serifs are particularly complicated. I won't say they can't be studied though. There are lots of aspects to break down if you were so inclined.</p>
      <p><cite> If all that’s different is one article of vocabulary, such as serif style, it’s the same typeface.</cite> Not the same. Very closely related.</p>
      <p><cite>I’d say you need at least two or three co-variant themes of a typeface to be different from one type to another, for it to be considered an original design.</cite> Ah yes. But that isn't how you build up a strong case for something scientifically. Science would be better off not making a new design - that's your job. Instead science must take little baby steps. And at last with many many tests perhaps enough data is collected &amp; interpreted so as to be useful to you. Maybe a whole matrix of these co-variant themes could be built up... </p>
      <p><cite> Sorry Eben, that is the point. </cite>I think it isn't so much <cite>the</cite> point so much as it's your favorite bugbear. Maybe after I read more about scientistic typefaces &amp; the marketing of them I will get more worried. But even if I do it won't make me think you can always save people or committees from seeking false security in scientism. You can try. But it isn't going to work every time. I will also doubt that can you always save them from marketing hype. And even if you could; neither goal is advanced by demonizing science's potential participation in type. Instead it is the thinness of the claims that is to be pointed out, and counter examples offered and criticisms made - ideally both humanities and science based.</p>
      <p>I am interested not in listing the hot type for a all purposes but in understanding how to design better fonts for a particular purpose, in a particular environment for a given group of folks etc. But I think that willfully leaving the potential benefit/information that science might offer out my bag of tricks is simply nutty. There are aspects of type design that I would just assume not even ask a scientist about because my sense is they are not interesting questions. On the other hand I bet there are some aspects of type that have eluded the best efforts of the humanities to grip that might be better plumbed using scientific techniques. To reiterate; I am not proposing that we worship science in our design process', and nobody here is that I can tell. But I do think there is room for them to help or collaborate with us.</p>
