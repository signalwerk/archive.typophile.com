      <p>David: <em>But then the reader, again, by making use of less or more than a letter, is not using your atom of reading.</em></p>
      <p>Unless the information gained from what I characterised as subatomic and molecular levels were used precisely for the purpose of identifying letters and, hence, recognising words. That seems to me at least as viable a model as proceeding directly to word recognition from the sub-word and/or inter-word information.</p>
      <p>Let's say that the atom is, <em>by definition,</em> what you need to be able to identify in order to recognise the larger semantic building block, the word. [Furthering the metaphor: words are the complex molecules, the DNA of text.] That's the main value of the general hypothesis, and I'm specifically questioning what constitutes the atom in different scripts, and suggesting that it might vary even within a script depending on the writing style: i.e. that how we read is not a generalised process independent of what we read.</p>
