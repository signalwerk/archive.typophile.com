      <p>I am not anti-science, I am "anti-scientism", because I dislike all forms of totalitarian-ism.</p>
      <p><em>which he still believes and which still inspires this CT effort, I think. </em></p>
      <p>Well, if the folks in the Microsoft typography department want to stay busy and keep their jobs, they have to have something to develop. The boss will fund projects with measurable results; he is an engineer and runs a large-volume, small margin business, so that's understandable. Having a scientific readability component in a type-development project, one that is able to produce a result such as "5% faster", does the trick. This much I gleaned from the CT documentary video that MS published. </p>
