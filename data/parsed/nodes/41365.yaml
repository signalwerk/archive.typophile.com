      <p>Nick: "So, in reading studies that focus on types with discrete letter forms, the outcome of letters-as-atoms would be expected."</p>
      <p>Yes, and perhaps unexpected, when a discrete letter is studied. An example is the study of letters, including zeros, where a lone character, shorn via isolation, i.e. mis-atomized, is graded for legibility by the subjects. Their results, as I recall, showed that 9 of 10 subjects could not identify the zero of a popular font  of the CT collection correctly. I recall the number of correct subject responses was high (1 in10), only because the subjects did not know they could guess that the zero could also be misread under such circumstances as a degree sign, a ring accent, or a dehydrated spittle mark, if it had the right stuff in it to begin with. </p>
      <p>Eben: "None of us has an issue with this. Correct?"<br>
      I only have issues with the tests and the results Eben. Otherwise, I think James and his crew have done a remarkable job of designing &amp; selling the concept. </p>
