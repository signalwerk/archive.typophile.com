      <p>Bill, I think you are glossing over what is an essential difference. The objective neural reaction to smelling saffron isn't the smell. The molecules involved in sensing saffron are not the smell. The smell is a subjective* experience. This distinction isn't the same thing as the specific derived from the general. Obviously these things are not unrelated. Far from it. The smell is not the main thing from which descends the specifics. There isn't a hierarchy. These things are aspects. Aspects with differences.</p>
      <p>I admit a smell is not a good pure analogue to reading. Reading is more complicated. But it has aspects too. Some aspects can be studied well with science. Science is in effect a good tool. And some of them - not so much.</p>
      <p>* A reportable experience. But it's not the experience collected then. It's the report of the experience.</p>
