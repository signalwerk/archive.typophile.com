      <p>Optometrists and reading psychologists have been measuring aspects of reading performance for quite a while. This recent paper by a team of optometrists and reading psychologists uses a variety of methodologies: reading speed, distance threshold, preference, and eye strain reports. In this paper they aren’t testing fonts, only different versions of ClearType rendering:</p>
      <p>Sheedy, J., Y.-C. Tai, et al. (2008). "ClearType sub-pixel text rendering: Preference, legibility and reading performance." Displays 29(2): 138-151.</p>
      <p>Mary Dyson tells me that she is planning on using this paper in a typeface design seminar at the University of Reading because it is a nice introduction to different testing methods.</p>
      <p>While optometrists and reading psychologists come from a different academic background than typographers, I don’t think it’s useful to describe them as the Borg. There is a common goal of providing a good reading experience and everyone stands to gain from cooperation.</p>
      <p>Cheers, Kevin</p>
      <p>p.s. Since I work for Microsoft I am expecting Borg jokes. I’m ready.</p>
