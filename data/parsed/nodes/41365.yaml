      <p>Bill, perhaps what I should have said is “[w]hat is being resisted is an <em>inferential judgement</em> of the form: : ‘x or y is actually objectively more readible <em>since</em> reading using x or y is faster [more accurate], or less tiring.’”</p>
      <p>Whether it is or not depends on the definition, and a definition is a social contract. What you propose is, it seems to me, a proto-scientific formalization which I think confuses <em>what something is a function of</em> with <em>ways in which it manifests itself</em>. Science needs formalizations to get its investigations going. Ole Lund in his Reading PhD dissertation on legibility research rasied issues of ‘construct validity’ and characterized the kind of formalization you propose as ‘easy operationalism.’</p>
      <p>The definition I might propose defines readible text as text in which rapid automatic visual word-form resolution is not obstructed, but actively afforded. (This presupposes of course that something denominatable as ‘visual wordform resolution’ in fact exists.) I think that when type designers talk about readability, this way of tying it down for investigative cross-examination is more representative of what they're after and more cognitive-scientifically sound. That it is closer to the intentions of typographical practioners is reflected by the orientation to making optico-grammatically integral words rather than simply nice letters.</p>
      <p>In any case science shouldn't be making the kinds of inferential judgements I described until it has a relatively accurate idea of what in actual functional terms is going on.</p><div class="imageWrap"><img src="http://typophile.com/files/][img:"></div><p></p>
