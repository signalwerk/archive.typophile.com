      <p>Eben, I'm okay with Bill’s remarks about the way I present my ideas. I try to formulate compact stand-alone and all-inclusive  one-sentence definitions, but recognize they're often not good prose or easily navigatable. And than I don’t generally give readers what they need to unpack them. That’s not right, even though I think readers should be able to find their way into my ideas by exploring the ordinary-language and dictionary usage of my terms. </p>
      <p>I make myself and my ideas vulnerable to readers throwing up their hands, thinking sooner or later readers will come around to my thickish brew.</p>
      <p>In a personal not to Bill I wrote: “just so you know, 'visual word-form resolution' is my name for the visual or perceptual processing component in word recognition. Word recognition also has a cognitive processing component which has to do with connecting with meaning. Word recognition is also used in connection with contacting items in a 'mental lexicon' — basically a database of spellings. Contacting items in the mental lexicon is a grey area in theories of word recognition. It isn't really thought of in perceptual processing or cognitive processing terms. It's regarded as a post-perceptual, neural-computational thing. This use is very widespread. I feel the need to distantiate what I am talking about from it.”</p>
