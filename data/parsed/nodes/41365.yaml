      <p>I hope readers of this thread will allow me another addition to this thread, just in case it is of use.</p>
      <p>I could simplify my definition somewhat by saying “readible text is text in which holistic processing, efficient saccade planning  and robust sense-following are not disrupted or obstructed by the particularities of type-design or the specifics of the typesetting, but effectively afforded and epiphenomenally enhanced.”</p>
      <p>(Legible writing then, is writing in which the discrimination affordances necessary for accurate wholistic processing and sufficient for reliable analytic processing are not compromised by peculiarites in or degredations of letterform or the mis-management of letter-form-design parameters. The discrimination affordance will need to be perceptual, and of cue-providing role-architectural information)</p>
      <p>Holistic processing in this complex has to be thought of in ‘bouma shape’ and ‘form resolutional’ terms, rather than ‘envelope structural’ and ‘lexical access‘ terms.</p>
      <p>The reason to insist on more challenging definitions is because I believe this leads to the search for and the emergence of more discriminating tests of value. New tests to gauge for value might be in the realm of testing for the robustness of the word superiority effect, or in the realm of attentional effort, or in the realm of gauging sustainability of immersion with comprehension and delight. Perhaps Kevin‘s corrugator muscle and eye-fatigue research relates to the second one of these.</p>
