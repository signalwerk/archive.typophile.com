      <p><em>and oldstyle zero for Constantia!</em></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Timeso0_6497.jpg"></div><br>
      Left: Times "o", right: Times oldstyle zero.<p></p>
      <p>Oldstyle vs. Oldstyle, Times may still have "disadvantaged" Constantia, as its oldstyle zero is both taller than x-height, and is monolinear rather than stressed. </p>
      <p>The issue raised: is it better to have disambiguation to take care of extremely *rare* problems, or live with some ambiguity, for a better *normal* experience (the decision John made with Constantia's oldstyle zero). And how do the designers of reading tests decide on what's normal?</p>
