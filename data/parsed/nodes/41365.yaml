      <p>Bill, here is my reaction to your talk of factors, and to your question about whether your proposal tests readibility:</p>
      <p>Suppose we agree readability simply means it can be read. That that which can be read, can be read with comfort, speed and understanding, indicates that comfort speed and understanding are affordance-related, but not affordance-constitutive. Specifically, your proposed test tests "how the sustainability of immersion with comprehension is modulated (if at all) in tightly line-spaced settings by the presence or abscence of serifs of a certain dimension at the terminations of strokes.” That, literally, is what it tests. The readability is assumed. It doesn't anymore require testing, but the experience of reading can be enhanced. In this sense there is more to readibility than just that it can be read. But let's be pointed and specific about what it tests</p>
      <p>The results of your test will tell us about exactly the same thing: how the sustainability of immersion with comprehension is modulated (if at all) in tightly line-spaced settings by the presence or abscence of serifs of a certain dimension at the terminations of strokes. This tells us about how affordances can presumably be enhanced.</p>
      <p>If we want to know why, we will have to entertain hypothesis about how perceptual processing in reading works, and part of the reason why, might very well be that there is more to perceptual processing in reading than simple recognition of individual letters.</p>
      <p>Unlike comfort, speed and understanding, criterial cue-values and proper salience of role architectural parts and their evoked forms <em>are</em> affordance-constitutive. Criterial cue-values and proper salience are the very things that make it possible to make out the identity of the letters. </p>
      <p>I guess we are all trying here to find a language that is comfortable for us all. I'm not sure though that we are advancing in leaps and bounds. A way of speaking about or in a certain domain is in part a social contract. Maybe I've ridden my own little pony long enough.</p>
