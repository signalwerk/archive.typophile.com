      <p>Eben: <em>But you seem to be saying that a built up picture made from many tests cannot help a font designer. Am I reading into what you are saying accurately?</em></p>
      <p>No, I don't think I every said that. What I'm saying is that this gradually built, imperfect, incomplete picture, insofar as it is useful in making decisions about type design, has to be made up of a lot more than what specifically scientific methodologies provide. This is what I mean when I say that <em>at the point of usefulness</em> scientific data and other kinds of information are basically at par, i.e. I think it would be a mistake to privilege new scientific data in the context of a humanistic craft with a developed wisdom of several hundred years. Instead, one would need to interpret that data within a hermeneutic of continuity with that wisdom, which means putting the scientific data and anecdotal data and experience and inspiration -- and everything else that makes up typographic wisdom -- into the same bucket and giving it a good stir to see what floats to the top.</p>
      <p><em>We are talking about what might happen in the future. What might be possible.</em>.</p>
      <p>We are? I'm not big on speculation, so I'd rather look at where we are now and consider what might be likely, not what might be only possible. Of course, I'm always ready to revise my analysis....</p>
      <p>The way I see it now: reading science is providing some good insight into how we read, but I'm looking for a lot more, especially with regard to readerability, i.e. insight into why we're so darned good at reading such a diversity of systems, styles, etc. and what the tolerances or limits are. I don't yet see a complete description of how we read, and that makes me very wary about trying to draw practical conclusions in terms of 'doing things differently' in type design, which is what we're all concerned about isn't it? If the science ends up confirming everything that we're already doing, that's interesting and reassuring, but it doesn't have a positive impact on the development of new type design. The tantalising notion is that the science might one day give us a clue how to make type better, and that's what makes it sexy or scary depending on one's proclivities. At the moment, I don't see anything in the science that is being done that suggests I should be doing anything different. Put another way, if you put today's science into the bucket with accumulated typographic wisdom it just gets absorbed: it isn't significant enough to contribute to the mix.</p>
      <p>There are narrowly defined areas in which scientific study is presently useful, e.g. reading at low resolution, but the same limitations that make scientific study useful make type design correspondingly less significant. The science is more useful for rendering engine developers, screen manufacturers and document creators than for type designers.</p>
