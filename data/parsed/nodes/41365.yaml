      <p>Bill your first test tells us how the sustainability of immersion with comprehension is modulated (if at all) in tightly line-spaced settings by the presence or abscence of serifs of a certain dimension at the terminations of strokes.</p>
      <p>I like information about how sustainability of immersion with comprehension is modulated by type-related parametric change. What this does is pin-point something quite specific. What I think it tells me is that type-related parametric change has a “perceptual processing in reading” effect.</p>
      <p>My question than is: what, in perceptual processing terms, do serifs really do. Saying they make a thing more readable doesn’t tell me about what I think I want to know. Do they increase the distinctive cue-value of the features they are part of? Do they make counters and the spaces between letters more tractible and riveting for the eye by encapsulating them more fully so that they acquire a cue value of their own? Do they blur the letter-assignments of individual letter parts so that the bouma-integrity of the word as a whole asserts itself more strongly than each letter by itself? Do they mask variations in interletter spacing so that these variations don't become disruptive to the kind of perceptual processing that needs to happen?</p>
      <p>I think this kind of progressive and highly instructive interrogation is pre-empted by moving quickly to the conclusion that one thing is more readable than the other, and that this can be known by applying your test, meanwhile leaving behind a more specific awareness of what we have come to know. Having discovered what I have come to see, I don't any longer have any great urge to generalize this into a statement about the broad experintial reality we've come to call readability. </p>
      <p>If I were asked to comment about readability, my strategy might be to answer indirectly and state in specific terms a few of the things I've found. All I'd really want to say is: serifs, depending on their prominence and extent can have a very beneficially value, and without them, the pressure on interline and interletter spacing for acheiving satisfactory perceptual processing results is greater.</p>
      <p>Stated this way, does my resistance to the heavy reliance on the rhetoric of legibility and readability in type-analytic contexts make any sense to you at all?</p>
