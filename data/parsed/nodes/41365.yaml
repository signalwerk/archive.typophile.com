      <p>&gt;I think you you should cut him some slack Bill. He is getting the ideas together. </p>
      <p>I'm already a big fan of Peter's ideas, which I think have a good chance of being correct. In this case my criticism of his rhetoric comes from my valuing his ideas. I've never met Peter, but I also admire many of his qualities in our discussions: open-mindedness, independence of thought, hard work, and insight.   </p>
      <p>&gt;Besides, a lovely lucidly explained mistaken theory is no more accurate for it’s being lucid.</p>
      <p>Ah, here you've come to the heart of the matter. </p>
      <p>A lucidly explained mistaken theory is just as false as an obscurely explained mistaken theory. There is, however, an all-important difference: the flaws in the lucidly explained are much easier to detect and correct. </p>
      <p>In Popper's view the power of scientific method results from scientific theories being formulated in a testable way--they can be checked against observation and experiment. The result is that errors are detected and corrected, and knowledge grows by creative dialog and research informing that dialog. </p>
      <p>More generally, any kind of critical discussion, including of politics and art, is furthered by clarity. Clarity enables people to correct and build upon the ideas developed by others. That's why clarity is a fundamental virtue in the critical tradition, a tradition that began with the ancient Greeks. </p>
      <p>Popper rarely, and maybe never in print, discussed those he regarded as obscurantists, such as Heidegger. The reason is that he thought they had abandoned the critical tradition--a fundamental betrayal of science and of liberty in his view. He so despised them for the betrayal that he wouldn't honor them by criticizing them, or even mentioning them. I don't think his policy was wise, but I do think he was right about the importance of clarity to the growth of knowledge.   </p>
      <p>Often obscurity is a shield against criticism, and sometimes it's even a way to bamboozle people into thinking that your ideas are much deeper than they are. --That's what Popper thought about Heidegger. But even in the most innocent case, obscurity deters criticism. And that is not a merit but a liability for the growth of knowledge and the further enlightenment of humanity.</p>
    html_clean: |-
      <p>&gt;I think you you should cut him some slack Bill. He is getting the ideas together. </p>
      <p>I'm already a big fan of Peter's ideas, which I think have a good chance of being correct. In this case my criticism of his rhetoric comes from my valuing his ideas. I've never met Peter, but I also admire many of his qualities in our discussions: open-mindedness, independence of thought, hard work, and insight.   </p>
      <p>&gt;Besides, a lovely lucidly explained mistaken theory is no more accurate for it’s being lucid.</p>
      <p>Ah, here you've come to the heart of the matter. </p>
      <p>A lucidly explained mistaken theory is just as false as an obscurely explained mistaken theory. There is, however, an all-important difference: the flaws in the lucidly explained are much easier to detect and correct. </p>
      <p>In Popper's view the power of scientific method results from scientific theories being formulated in a testable way--they can be checked against observation and experiment. The result is that errors are detected and corrected, and knowledge grows by creative dialog and research informing that dialog. </p>
      <p>More generally, any kind of critical discussion, including of politics and art, is furthered by clarity. Clarity enables people to correct and build upon the ideas developed by others. That's why clarity is a fundamental virtue in the critical tradition, a tradition that began with the ancient Greeks. </p>
      <p>Popper rarely, and maybe never in print, discussed those he regarded as obscurantists, such as Heidegger. The reason is that he thought they had abandoned the critical tradition--a fundamental betrayal of science and of liberty in his view. He so despised them for the betrayal that he wouldn't honor them by criticizing them, or even mentioning them. I don't think his policy was wise, but I do think he was right about the importance of clarity to the growth of knowledge.   </p>
      <p>Often obscurity is a shield against criticism, and sometimes it's even a way to bamboozle people into thinking that your ideas are much deeper than they are. --That's what Popper thought about Heidegger. But even in the most innocent case, obscurity deters criticism. And that is not a merit but a liability for the growth of knowledge and the further enlightenment of humanity.</p>
