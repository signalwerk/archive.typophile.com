      <p>I'm back, so some responses:</p>
      <p>&gt;Bill, reading is not an ailment.</p>
      <p>I didn't say it was. That's a red herring. But there are indeed reading ailments, known as dyslexia. Your view here seems to be that scientists should not research reading, because their work is never going to be of help. And that I think that any restriction on scientific research--except for ethical issues of ill treatment of human research subjects, etc.--is a bad idea. It is opposed to the growth of knowledge, which can help us all. </p>
      <p>&gt;How much is the bet?</p>
      <p>David, I would say a good 'stakes' would be a good lunch for all the participants of this thread at a type conference five years from now. And say Eben could be the referee on whether there has been any significant advance on readability. </p>
      <p>I personally doubt that future discoveries in reading are going to discover that classic type faces, printed on paper at the usual sizes, have something fundamentally wrong with them. However, I do think that the progress will be able to tell us more about the limits of readable type: what screen resolution is needed, what spacing becomes dysfunctional, and so on. So I do think they will be able to guide the creation of new type faces, though more than readability will always be involved. </p>
      <p>&gt;manipulating salience and cue values is a game of tiny incremental adjustments in conformity with the laws of gestalt vision. </p>
      <p>I very much like Peter's phrase here "the laws of gestalt vision". We are able to "resolve", as he puts it, marks on paper into meaningful words, and I am sure there is law-like process in our brain  that good theory can describe and good testing reveal in the future. My bet, as I said is five years. We'll see.</p>
