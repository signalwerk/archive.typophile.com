      <p>Nick what was behind my claim is that there is a relationship between (1) perceptual discrimination affordance at the granularity of letter parts and (2) rapid, automatic visual word-form resolution affordance at the granularity of word wholes. I relate the first to legibility, and the second to readability. </p>
      <p>What I think I get from your descriptions is that, in your way of thinking, legibility has to do restrictively with the perceptual processing factors. And readibility has to do with the total picture, or rather, specifically with all those other ‘look’ dimensions that go beyond these, but aren’t really directly touched by them. </p>
      <p>Readibility in this scheme doesn't have it's own distinct perceptual processing component. It is totally a matter of humanistic virtues: aesthetics, optical-grammatical integrity, expression, historical reference, transparency to information rank, contextual propriety. </p>
      <p>I say it is these too, but also has a distinct and foundational perceptual processing component. And I’d say this perceptual processing component is sensitive to things like spacing, counter size, relative proportion of ascenders and descenders to x-height. Because it’s a good deal more than that means that gauges of the sensitivity of this percptual processing component to spacing, counter size, etc will always fall too short as reliable indicaters of the total picture. </p>
      <p>You go on to try to show that countersize is style and nothing more, but I say it also has a perceptual discrimination affordance component.</p>
