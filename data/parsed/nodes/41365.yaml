      <p>&gt;Which is to say that there are too many cultural variables: typographic, environmental, demographic and textual.</p>
      <p>Um, we are talking about type here. Yes, one can write unreadable prose, but we are talking about the contribution of type. Good experimentation separates the influence of different variables. The idea you seem to be assuming--that in principle the influence of different variables can't be separated--is just wrong. It isn't easy, but it it is done all the time in science. If you couldn't separate the influence of different variables there would be no successful scientific research, which is clearly not the case. </p>
      <p>&gt;while comprehension and retention of anything other than simple grammar and facts is the preserve of the humanities, is it not?</p>
      <p>No, it's not, in so far as typography is also an influence. You can have a text book on a difficult subject, and a good typeface and good typography can help make it more readable. Of course, how well the writer writes is critical. </p>
      <p>Eben's analogy to the influence of science on cooking is superb: science helps the cook, but isn't going to make a mediocre home cook a great chef. It can help both, though. For example, Julia Child turned to food scientist <a class="freelinking external" href="http://en.wikipedia.org/wiki/Shirley_Corriher" rel="nofollow">Shirley Corriher</a>. And I  cook a little better because of her science-based advice also. </p>
      <p>Same with advances in readability of type and typography. It would help the amateur and the expert, but not turn one into the other, because so much more is involved.</p>
