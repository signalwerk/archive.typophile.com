      <p>Neural networks may be developed to simulate a reader, in which case a piece of text in a particular setting might be run through a software application to measure its readability.</p>
      <p>Compare with recent developments in the shampoo industry. It so happens that CGI has become so proficient at rendering the effect of moving hair (thanks to Hollywood money)--at a microscopic resolution--that it is now possible for chemists to apply a virtual shampooing of a chemical formula to a virtual hair type, and see how it will effect body and lustre. </p>
      <p>Ultimately, this kind of virtuality will be great for product development (laboratory animals especially), but would be problematic if an "independent" organization used software to grade products by chemical formula. IMO, that's a bit too virtual, but I guess it's coming.</p>
