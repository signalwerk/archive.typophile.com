      <p>&gt;If comfort, speed and comprehension are your standards for “Readability” then you face some problems. You have to define comfort. You have to define how you calculate speed. You have to define how you gauge comprehension. This is atomizing**. It’s not common sense. But then it isn’t meant to be. It’s meant to be a reproducible scientific test.</p>
      <p>Eben, I don't understand what is bothering you about 'atomizing'. When you have subcategories of a general category, the general category doesn't vanish. Because people can be 'atomized' into male and female do human beings become impossible to study scientifically? You can't study feet scientifically because there are male feet and female feet? No, you study both, the similarities and differences. But they're still feet, and you can study them with observation and experiment. </p>
      <p>Similarly, because you can distinguish different aspects of readability, and characteristics of type that are more readable in different circumstances, it doesn't invalidate the concept of readability or make it only possible to study 'humanistically'. You just study the different aspects.  </p>
      <p>Comfort, speed, and comprehension can and have been already be measured scientifically. </p>
      <p>I would get at "comfort" first of all by self-report. In Kevin's report at ATypi I believe he said Sheedy had a number of questions, such as complaints of eyes burning, blurring, etc. as discomfort. Then he has identifies physiological analogues he can measure that correlate with these. I would be looking more at mental fatigue, but there have been reports like that also--that people are tired of reading and don't want to go on, etc. Any study of perception and cognition is going to have to start with self-report, but that doesn't make it invalid.  </p>
      <p>Any such study is a process of refining, but it doesn't erase the concept of comfort, it just makes it more clear and precise for testing. Again, I don't see that problem. Comfort is not gone, and the whole thing is conceptually pretty straight forward. Finding good questions and good measures requires creativity, but scientists, including Kevin and his colleagues, have already started. And the tests are all described in a way that they can be reproduced. No impossibility. </p>
      <p>On reading speed, this is words per minute. What is your problem about this? How do words per minute become only 'humanistic'? Doyouthinkicantmaketextthatslowsyoudown? Or speeds you up? Is that not objective and repeatable?</p>
      <p>On comprehension, there are oodles of standardized tests of comprehension. Conceptually, they you just ask questions about the content, and how many answers are right or wrong. People will do better and worse, and under different conditions. Standardizing the difficulty of tests is tricky, but it's been done including in SAT reading tests. </p>
      <p>So comfort, speed and comprehension can all be measured by objective, reproducible tests. The test I proposed is scientific--how good it is is another question. </p>
      <p>Peter, you are saying that 'affordance' is a better focus for research. I would say that 'affordance' is a concept to help explain better and worse readability--and other aspects of reading. And it may be a very useful concept, in which case we should use it. </p>
      <p>But readability shouldn't then become a taboo word. You design text that is more rather than less readable as one of your goals, I'm sure. And I am trying to do the same for a typeface. </p>
      <p>Science attempts to explain the world as we experience it. In the process it refines the concepts, but it doesn't vanish our experience. Because Newton distinguished weight and mass doesn't mean that we no longer experience gravity. The refinements in terminology can help, but they are no reason to say that we can't use ordinary English concepts, or to say that gravity or readability can only be studied 'humanistically'. So I don't think there is any need to avoid the word 'readability', and *only* use technical terms like 'affordance'. </p>
      <p>But in any case, I think we are in agreement that greater and lesser ease of reading is something that scientific research can shed light on.</p>
