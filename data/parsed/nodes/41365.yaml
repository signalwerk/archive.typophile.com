      <p>Here is a general point in relation to the subject of this thread:</p>
      <p>A full discussion of readibility and legibility can’t only focus on the parameters of type and writing such as stroke contrast, letterform construction, length of ascenders, leading, size of counters, and how these interact and to what effect. These are items on what might be called the object- or stimulus-side of the equation. </p>
      <p>Also such a discussion can’t only focus on speed, comfort and comprehension or what causes them to fluctuate. These are items on the response- or subject-side of the equation, even though they can be relatively effectively operationalized and thereby, in some sense 'measured.'</p>
      <p>To make the discussion preductive, we also also need to sort out and talk about the real functional or structural components of the physical act of reading, such as saccade management and the contetious area of ‘holistic processing’ — if that’s a good term —, or ‘rapid, automatic visual word-form resolution’ — if that can be made to be less opaque. Once this is done an understanding of readability that moves beyond the approximations implicit in ordinary usage or the vagaries in it’s sophisticated ‘received’ sense might emerge.</p>
