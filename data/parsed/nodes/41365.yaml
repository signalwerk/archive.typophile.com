      <p>&gt;too many variables</p>
      <p>Nick, that amounts to the same thing. The point is that with good experimentation you can get the influence of one variable. Blood is incredibly complex--probably as complex as reading--but medical testing regularly isolates different components to detect and diagnose illness.</p>
      <p>&gt;OK, here comes an analogy: manners.<br>
      Science can study manners—anthropology or sociology —but it’s not its job to offer etiquette tips.</p>
      <p>It may not be its job, but it can help those who want to be polite or to offer etiquette tips. For example, the book <a class="freelinking external" href="http://www.amazon.com/Questions-Politeness-Strtgs-Cambridge-Anthropology/dp/0521292506/ref=sr_1_1?ie=UTF8&amp;s=books&amp;qid=1202150325&amp;sr=8-1" rel="nofollow">Questions and Politeness</a> points out that there is a conflict between being clear, as is a priority in debate for the growth of knowledge, and politeness. The goal in politeness is avoid embarrassment to anybody in the conversation. For that reason vague, open-ended questions, such as 'How do you do', are standard polite questions. Pointed, personal, close-ended questions, like "How much money did you make last month?" and "When did you have last have sex with your wife?" are rude. </p>
      <p>I think the lessons for etiquette tips are pretty obvious. As is the challenge of trying to have a debate for the sake of better understanding--such as this one--while maintaining politeness.</p>
      <p>As Kant said "There is nothing so practical as a good theory." A good theory is true, and therefore has practical applications. I have no doubt the same would be true for advances in the scientific study of readability.</p>
