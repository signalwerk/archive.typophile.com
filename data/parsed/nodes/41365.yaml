      <p>Peter, you wrote, "What is being resisted is an explanation of the form: 'x or y is actually objectively more readable because reading using x or y is faster or less tiring.'" </p>
      <p>That's not an explanation, that's a definition, the meaning of readability. Highly readable *means* that people can read it with relatively good speed, comfort and comprehension. Less readable *means* people can read it with less comfort, speed and comprehension.  </p>
      <p>Speed and comprehension can be objectively measured, though comfort is more dicey as of yet. So what a scientific theory of readability should be looking for is theories that would explain why some texts are more readable than others. Part of the challenge of that development and testing is to objectively distinguish the more and less readable texts. So you are going to need objective measures that will reflect the fact that, eg. people prefer to read extended text in print rather than on screen. Of course there will be individual variation, and this needs to be taken into account in the measures--eg that over 45 are generally going to have more problems handling small type. </p>
      <p>Then the theory is going to have to explain why those measures turn up the way they do. The theory may be about the reading process in general, and not specifically readability, but it will need to have logical consequences that predict the differences in the objective measures of readability. </p>
      <p>In principle, so far as I can see there nothing scientifically objectionable in the testing I described. It would only need to be better specified to carry out the tests. The theory of reading would need to explain whatever the results are.</p>
