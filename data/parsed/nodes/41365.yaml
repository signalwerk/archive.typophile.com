      <p>"Phooey."?<br>
      I was at an early publication of the latest mass discontinuity between test type and user: first the dreamer gave his ideas, then the scientist gave his scientifically studied presentation, then the type designer showed how simple it was going to be to make fonts, and then the typographer showed beautiful stuff a bit too far away to see. Kevin, before he was Kevlar, gave the scientific explaination for reading, which he still believes and which still inspires this CT effort, I think. It revolves around letters, not sylables, words, or lines — people read letters. I got close to him at Typecon, not just because I like him, but also to make sure he would say it three times while I was right there. "Chinese?" "No," "the word 'a'?", "NO," "youth vs expertise?" "Noooooo, people read letters one saccade at a time!</p>
      <p>So, unless 'Ready Rendering Skills' lead science to bad reading science, and influenced type design decisions, an unthinkable thing, then Science did it. ;)  By, ready rendering skills, in this case I mean the ability, for better or for worse, to cleave the resolution into components, not triple the resolution, as is so often claimed. Read the MS 'white paper' on anti-aliasing type, which 'scientifically' led this off. It measures, prods and pokes around the solution without ever mentioning type, or typography. This last study, if Sheedy only lets MS change the filter, (and not the oil or driver;), it is not going to change the fundamentally saccade-hiccupic nature in low resolution text across the Windows universe. This is not my fault, who ever let that French guy name this bluddy eye movement? it's their fault. </p>
      <p>" I’m just a bit slow:"<br>
      Me too, has something to do in my case, with having to ceaselessly pry into the seemingly endless 'overlays' upon the concept of text for readability. I'd give up, but that each overlay leaves such fertile ground for custom work...I'm just a busy bunch of monkeys in the orchestra of type.</p>
      <p>"...is what the rendering engines do, in fact, based on reading science? I don’t think it is."<br>
      I great question, No, in the strictest sense rendering engines do not do anything based on reading science, they are non-sentient e-world objects. But, who, or what, are these scientific studies of CT done for, if not for the engineering staff(s) who render rendering engines? Kevlar just said, 5 filterings were tested in their scientific study, and 2 filterings were released to the developing public. Maybe he knows then? Is what the rendering engines do, in fact, based on reading science? Or, are the renderings which are released, released based on reading science?</p>
      <p>Cheers!</p>
