      <p><em>Highly readable *means* that people can read it with relatively good speed, comfort and comprehension.</em></p>
      <p>That's not how I would describe readability.<br>
      I'd say it *means* people find the combination of content plus presentation interesting enough to start reading, and meaningful enough to continue. Limiting "meaningful" to the kind of comprehension that concerns deciphering words from letters and recognizing grammatical structures that look logical enough to not cause too many regressive saccades -- that's a pretty basic concept of meaning. Surely there's more to it than that?</p>
