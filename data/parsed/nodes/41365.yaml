      <p>&gt;How can the size of typeface counters be measured?</p>
      <p>By the total area of white within the counter. You do have to decide for a letter C how far to go out, but you can make a choice and see whether it turns out to be informative. </p>
      <p>You can also measure area within the black in the serifs, the extension from the stem, etc. Actually David Kindersley already did a version of such measurements. </p>
      <p>I don't know what's going to be important, but you are quite wrong about the impossibility of measuring this kind of stuff. That's actually the easy part. </p>
      <p>I am not opposed to any argument against bad science. I am just looking at the wonderful expose by Gary Taubes of bad science in the field of obesity prevention. It is a truly horrifying story, and seems quite true. </p>
      <p>While I agree with you that there there is a great deal of bad science out there, including in the field of reading, it doesn't justify opposing all science. For good science can be a boon to humanity, including artists.</p>
      <p>&gt;saying that it’s too artistic.</p>
      <p>No, I'm saying you're mixing up artistic and scientific goals, and wrongly applying standards from one to the other.</p>
