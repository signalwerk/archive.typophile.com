      <p><cite> Unless the information gained from what I characterised as subatomic and molecular levels were used precisely for the purpose of identifying letters and, hence, recognising words. </cite></p>
      <p>The striking thing about these ideas is that with just a pinch of magic cleverness they spring into really really complex theoretical structures. See above. My feeling ( and this is all gut - sorry ) is that the notion of the atom may not be useful because it's creation stems from the human urge to simplify. It's not a bad urge at all. It's a hugely useful one when you can make it work. This is why scientists cherish the simple equations that actually work - they are like refuges from what is ordinarily a torrent of complexity. So if the "atom" turns out to be an apt metaphor then that's great. But my guess is that reading is more like weather with everything impacting everything else and making prediction better done by hugely complex modeling than by equation or any other simpler model. Still, we don't know and that's the persistent reality.</p>
      <p>Bill, it sounds like we agree now for the most part. But it isn't key to my regard for you or Nick or anybody else that we do. The main thing I wanted to accomplish ( why <cite>did</cite> I write so many posts?)  was to combat what sounded like the all too common morbid fear of science is in our culture. I don't think it's healthy - in lots and lots of ways. And that is why I have asserted as you have, that there is no inherent barrier to a deeper understanding of Type/fonts/scripts etc via science. And that this science need not be a threat to the work typographers do; and quite importantly, that it is certainly no substitute for it either.</p>
