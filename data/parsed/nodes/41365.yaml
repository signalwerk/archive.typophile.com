      <p>Carl, great post. </p>
      <p>Nick you said. <cite> Eventually, the ergonomic project bogs down in demographics. </cite></p>
      <p> You are asserting that demographic &amp; regional differences might be significant?</p>
      <p><cite> you have to target a sector </cite></p>
      <p>What sectors would those be do you suppose?</p>
      <p>I agree that this might be so, I would even guess that it is, but I am not aware of anything that shows that it is. It would be all too easy to mistake regional taste for one style or another with an objective test of what they read best. They might overlap in practice - but I think they are not the same thing.</p>
      <p>I don't think that reducing things to simply "trust the craftman (or artist)" &amp; waving hands helps us. Sorry, that's probably too much rhetorical flourish - but I hope you see what I mean. Obviously the craft has gotten plenty far already. But being luddite re: Science seem counter productive to me. </p>
      <p>Your sense that science is bought off by the big guys and is in their camp; ( unless I have you wrong ) may be so. In fact it seems probable. But I think that is a separate cultural issue and should be dealt with as such. Put another way; intellectually I don't like to see them conflated. And I think it would be disingenuous to deny that science has anything to offer just because I don't stand to benefit from the admission. Or maybe I will... depending on what researchers and their employers ( or universities) decide to do.</p>
      <p>I have faith that the best ideas for improving type will come from type makers be they indie or otherwise, and with or without research to inspire or gird their results. Maybe in that sense I agree with you. And maybe if people (type makers and scientists alike) notice useful stuff they will share that useful stuff. I plan to. You have. ( Thanks BTW! ) I think it's very promising.</p>
      <p>And lastly I think that Fonts will probably always get their the vast majority of the economic value from their style. The utility differences are a kind of economic sideshow for the most part even if I think that culturally it is important enough to spend time on. Do you agree or not so much?</p>
