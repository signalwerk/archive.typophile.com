      <p>[reacting to Bill’s] "Any of the alternative description you put forward may win out…" </p>
      <p>I don't see them as alternative descriptions but functional-specification proposals. And the issue for me isn’t which wins out but what gets looked at, and how what gets looked at is named. They all need to acknowledged for what they are, and explored for how they function. My prefered genral category to describe the domain I’m in is perceptual processing in reading.</p>
      <p>The danger with designating a science of legibility or readability as the research goal is the danger, in the case of readability, of turning a value into a number, and in the case of legibility, af creating a reliance on threshold statistics (in the domain of perceptual discrimination affordance) for relevant information about functionality at a plateau (in the domain of visual wordform resolution). </p>
      <p>That being said, I'm all for constructing legibility quotients and readability profiles. I'm just sensitive to how they are constructed and used. If concerns for readability and legibility are included in the brief, these shouldn't be a threat. And they shouldn't be all there is to consider.</p>
