      <p><em> Either you can measure something or you can’t, so ’describing something imperfectly’ isn’t really science</em></p>
      <p>Seems to me like Eben's talking about a kind of "proxy" measurement. For example, there's no clear way to measure the effectiveness of my teaching directly, but one could make inferences about it from evaluating student evaluations of it. The assumption is that there is some reasonable (albeit "imperfect") correlation between the student evaluations and my unmeasurable (but not ipso facto nonexistent) teaching effectiveness.</p>
