      <p>&gt;index of readability </p>
      <p>Nick, I never mentioned anything about an index of readability. You are arguing against a straw man. </p>
      <p>I argued that there would be scientific progress in understanding readability. </p>
      <p>Your options are so primitive that you must think scientists are required to be stupid, which is not the case. You might just as well argue that we can't prescribe corrective lenses because there are so many different ways we can see badly, and so many causes of bad vision. But they do measure these many variables, and prescribe successfully.  </p>
      <p>As any one who studies typography at all knows, the different factors of type face, leading, spacing etc. interact to produce a product which is more or less readable. </p>
      <p>Scientists can test for a combinations of these variables, or for other variables which they might be able to isolate. </p>
      <p>For example Bill Hill of Microsoft mentioned at TypeCon that the reason for the 65 character line width of a single book column being ideal, and more than 75 a problem is that at normal reading distances we have to turn our heads, and not just our eyes for longer measures. I believe the argument was that we are less efficient at moving along the line or to the next line, This is a kind of thing you can actually check by seeing how the readers' eyes move, and their change in reading speed. </p>
      <p>I don't know whether this has been tested, but according to you it would be pointless and worthless, I gather, because it is 'readability research'--it tests how measure affects readability.</p>
