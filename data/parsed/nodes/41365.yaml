      <p>To shift the debate into what I would guess might be more useful territory let me ask: What specifically would you be interested in having studied? Serif shapes? Contrast? Rendering schemes? What ( if any) studies if any have been most influential on you?</p>
      <p>And to move away from dubious gladiatorial battles between fonts that we all seem to agree are not to the point - let me see if we agree instead to something else: That if something about type is to studied via a scientific process that the best idea is to take a single typeface as a control and then make a specific micro typographic adjustments to a version of it. A study could be serif oriented, or contrast or a whole variety of things. This would be a way of reducing variables massively but obviously not completely. But most important it would be a way of doing science useful to typographers. And not coincidentally it paralelels the way a type designer works. Of course it would be prudent/useful not note the variables you think are still in play as well, demographics for instance.</p>
      <p>In a way I was a little hesitant to even mention the idea -it is no doubt the obvious thing. In fact I can well imagine Peter or Kevin rolling their eyes. Still, I am interested to hear if you do or don't agree.</p>
      <p>Personally I would be interested in seeing individual examples contextual alternatives tested in this way because I am guessing that holds special promise to increase comfort. What do you think?</p>
