      <p>Bill, there isn't a taboo. I don't *only* want to use my terms. </p>
      <p>‘Legibility’ and ‘readibility’ have a well-established and perfectly acceptable use within the public sphere and the type domain. But they’re are poly-valent and multi-referential, and their usefulness in the public sphere and type domain is in a large part dependant on their not being tied too tightly to specific measures in distinct functional domains. This doesn’t make these judgements crude or inexact. The eyes of a capable typographer are more discriminating than the tests.</p>
      <p>Sometimes science fails to honour this.</p>
      <p>Yet, when I am rummaging around in distinct functional domains I do feel better served with new hand-crafted constructs. That’s all.</p>
      <p>We need a transcendental critique of judgements of legibility and readability, a sustainable and typographically attuned theory of perceptual processing in reading, measures of performance that are geared to thresholds and ranges in specific contexts of use, relative to a range of measures, and a theory about how to put this information into practice.</p>
