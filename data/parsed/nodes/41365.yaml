      <p>I've always been somewhat puzzled by Blake's great picture of Newton. It is supposedly a critique--as the comments point out, the scroll he is measuring comes from his own head, not nature. Yet the initial impression is Heroic, with the great strength and intelligence of the figure. I'd like to know more about Blake's view of it...</p>
      <p>The most important anti-scientific Romantic was Goethe in his early years. He not only criticized the 'grey world of Newton', but tried to develop an alternative romantic way of doing science. And in particular he had a new and different theory of color. This in turn inspired the German Naturphilosophen, Fichte, Hegel and Schelling. The most interesting fact about this effort is that it was an abject failure, a failure of romanticism to produce an alternative version of science that actually could have predictive power in observation and experiment. This story, if I remember correctly, is in Emil Meyerson's book De l'Explication dans les Sciences.  </p>
      <p>In the next generation, the great Helmholtz made important discoveries in the physiology and psychology of vision, including color. Inspired by the discoveries that shadows are actually colored and that the eye sees sharply only at the center of vision, the Impressionists developed their new style of painting. </p>
      <p>This kind of healthy interaction between science and art, exemplified by Helmholtz on one side, and Renoir and Degas, and so on on the other, is I think the right model. I expect the same kind of fruitful interaction between advances in the science of reading and type design and graphic design.</p>
