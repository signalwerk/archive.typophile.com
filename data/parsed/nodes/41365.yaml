      --With high or low IQ?<br>
      --For serif or sans faces?</p>
      <p>Is 10 pt leading more readable than 12 pt leading?<br>
      --With old style or modern faces?<br>
      --With 8 picas line length or 28 picas?<br>
      --Ragged or justified?</p>
      <p>Is Perpetua more readable than Times?<br>
      --On the bus to work, in bed, or in a reading lab?<br>
      --In bright daylight or poor artificial light?<br>
      --On newsprint or coated stock?</p>
      <p>Is sans more readable than serif?<br>
      --for a novel or a technical manual?<br>
      --for paper or lcd monitor (and at what setting)?<br>
      --for short or long paragraphs?</p>
      <p>And so on.</p>
