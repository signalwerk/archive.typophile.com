      <p>David, the 1/2 test doesn't prove anything about how we normally read: it only proves that we're able to recognise letters from parts of letters. It doesn't tell us anything about the significance of that ability to reading: just because we can recognise letters from partial information doesn't mean that we use such partial information during reading, and if we do -- as seems likely to me* -- is it a direct contribution to word recognition or indirect via letter recognition. Being able to recognise a pair of letters from two halves and the space in between them doesn't mean that the basic unit of reading is not, still, the letters. Being able to recognise fragments of letters in sequence doesn't imply that we build up to word recognition through recognising half letter + space + half letter sequences; it implies only that we can recognise more than one letter at a time in a fixation, which everyone knows and no one contests.</p>
      <p>* You skipped a key aspect of my (first) hypothesis, which is that while the letter may be the atom, we make free use of both subatomic particles and molecules as we need during reading. But the atom sits in the middle and is what is built up to and built up from. I think the letter plays that role in typical typographic Latin text.</p>
      <p>But I don't think we should generalise from such text. If I consider all the other writing systems I know about, it seems to me that the atom is what we make it, when we write or set type or create text in any other way. There are too many writing systems in which the individual identity of the letter is subsumed into a graphical molecule for the letter to be considered always the atomic unit. I think we make it the atomic unit by disconnecting it from adjacent letters and giving it a static form: we emphasise its atomicity.</p>
