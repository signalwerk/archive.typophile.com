      <p>”…has no impact…”?</p>
      <p>Science does more than measure. In my reading I encounter terms like “salience,” “response bias,” and “cue value,” and because I am unhappy with the cognitive processing connotations of the term “word recognition” I propose “visual wordform resolution” to describe the perceptual processing component in reading.</p>
      <p>My aim in doing this is to give type designers new and useful ways of seeing what they are doing when they manipulate proportions, contrast, weight and construction. That is, I want to expand the repertoire of constructs by which we channel our actions, or according to which we make our assessments. What I think we are doing (when we say we are improving legibility or enhancing readability) is manipulating cue-values, strengthening response bias, managing salience, improving perceptual discrimination affordances in such a way that the ease and automaticity of visual wordform resolution is enhanced. I want to expand — or diversify beyond the conventional, rather contentious ones we use — the repertoire of personal constructs we use to channel are actions or make our assessments. Metanoia</p>
      <p>(I am also interest in “crowding” and “interfacilitation” because they seem to hold a key, but that’s anther story.)</p>
      <p>I think of type design as both a fine art and an exact science. It is an exact science because, beyond the simple requirement of making a recognizable letter ”m,” manipulating salience and cue values is a game of tiny incremental adjustments in conformity with the laws of gestalt vision. The fine art is in knowing where to make the adjustments.</p>
