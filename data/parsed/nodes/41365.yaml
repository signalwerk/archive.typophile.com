      <p>Nick, the Oxford concise gives two definitions: "1. Able to read; legible. 2. interesting or pleasant to read."</p>
      <p>The first definition clearly refers to the visual aspect of reading. The second has to do with the quality of the writing. Of course "there is more to it," as the reader's overall experience will involve both. But with a little cleverness we should be able to study the typographical dimension on its own. </p>
      <p>Within typography a sophisticated but still pre-scientific definition of readability I quoted earlier: "the ease with which the eye can absorb the message and move along the line."  </p>
      <p>"Absorbing the message" clearly refers to comprehension, to understanding meaning. And 'ease' is some kind of comfort, or lack of resistance. Since we can decipher nearly illegible writing by slowing down, I think an idea that we can have some speed along with comprehenseion is implied or understood.  </p>
      <p>Yes, there's more to it, but the first, narrower typographic meaning is worthy of scientific study in my opinion. </p>
      <p>Peter, I don't see that I am making much of any inference here about the underlying mechanisms of reading--of how we go from the printed page or screen to understanding. The only thing I pointed out is that two aspects have been operationalized: speed and comprehension. The third, comfort, has not been operationalized successfully yet. I suggested two possible measurable correlates of the subjective experience of discomfort or difficulty with the visual aspect of reading: reduction in comprehension with time and decline in proof-reading accuracy. One would have to test to see whether either of these is any good. I have proposed no short-cut or 'easy operationalization' here. It's difficult, but if achieved would be enlightening. </p>
      <p>Then once you have such measures, you have the challenge of explaining their behavior in different circumstance. But at least you have something measurable, beyond the general self-report of comfort or discomfort. That I think would be a plus for further research. </p>
      <p>As you know, I think that technical terms should be introduced only when necessary, and then with clear definitions. When you write your definition of readability as "readable text as text in which rapid automatic visual word-form resolution is not obstructed, but actively afforded," your technical terms smuggle in assumptions that may not be correct. </p>
      <p>1. It may be that part of good readability, is having short words, such as<br>
      a, an, the, that have sufficient markers that the brain is able to skip and never read them. The meaning may be derived from a sub-set of words in many sentences.</p>
      <p>2. Secondly, it might be that we can go directly from letters to meanings of whole phrases--the 'bouma' extends over multiple words. I don't think this is true, but your terminology assumes it rather than investigating it.</p>
      <p>3. Finally when you nominalize and use the term 'affordance' you are creating something that seems to be a single variable that may turn out to have a number of independent processes going on, and the single term is not useful. I greatly respect your insights into the reading process, as you know, but I do think that introducing technical terms quickly is a serious obstacle to communication and may even muddy the waters conceptually . </p>
      <p>You may object that 'readability' also implies a single variable, but that's not the case, because it is not being used as a technical term. As a general rule, terms that emerge out of peoples' experience represent something real, and that's why science would do well to respect them as a starting point, and only replace them with a very good reason.</p>
