      <p><em>I don’t believe that concepts are there to be balkanized; in other words they don’t necessarily belong exclusively to one area of information or study rather than another.</em></p>
      <p>Phrenology, graphology, the ego and the id have been banished from the scientific sphere, as has the study of race and intelligence. </p>
      <p>By the same token, realism lost its credibility in art long ago. Art students don't study life drawing any more, or even drawing. Representation is the preserve of photography. </p>
      <p><em>scientizing typography isn’t going to happen. I am fairly certain that’s a straw dog.</em></p>
      <p>OK, how do you implement a disability policy that provides access for the reading challenged to important documents? Do you pass a Legibility Act that stipulates only certified typographic practitioners may produce such reading material, or one that stipulates certain physical criteria for typography? </p>
      <p>The latter is what's happening, and, as has already been pointed out, scientific claims have been made in the marketing pitch for faces such as Read Right and Tiresias, which do not stand close scrutiny.</p>
      <p>With regard to the food analogy, this is something I've considered, but I wish you guys would stop making analogies, there's nothing like type! </p>
      <p><em>Good experimentation separates the influence of different variables. The idea you seem to be assuming—that in principle the influence of different variables can’t be separated—is just wrong.</em></p>
      <p>You're assuming I'm assuming. What I actually said was there are too many variables. As Peter put it "...a decontextualized descision based soley on simple or generic affordance micro-advantages [is] short-sighted."</p>
      <p>And again, I would ask you to make the distinction between studying reading, and studying readability.<br>
      Certainly, the variables can be limited in tests that are designed to address particular aspects of the reading process.<br>
      However, the putative study of typeface readability is impossible, because there are too many extraneous factors which skew the results. </p>
      <p>OK, here comes an analogy: manners.<br>
      Science can study manners--anthropology or sociology --but it's not its job to offer etiquette tips.<br>
      Readability is like manners, typographers use certain types and "style sheets" for different kinds of publication.<br>
      If the wrong typespec is used, readability will tank.<br>
      How can science assign a particular typeface a readability quotient when it is good manners to use it in one kind of periodical, but a faux pas in another? Sure, you isolate the variable and say, THIS quotient IF these circumstances. And so on, as you take account of all the variables--the reader's education and eyesight, where they're reading, what the writing is, and so on, not to mention the typographic variables of size, leading, line length, and paper stock. Do you really believe that the appropriateness of typefaces doesn't vary drastically against one another as such circumstances change?</p>
