      <p><em>That could be anecdotal or scientifically measured.</em></p>
      <p>Practically, I think the science, at least what I have seen to date, is itself anecdotal. That is, the only way to relate the science to design is to treat it as further anecdotal data, to combine with existing practices. It is, perhaps, a matter of how we interpret the data: in a hermeneutic of continuity, in which scientific knowledge of reading is interpreted in combination with typographic experience and practice, or in a hermeneutic of rupture, in which scientific knowledge of reading is interpreted as overthrowing and replacing typographic experience and practice.</p>
      <p>Peter Enneson's comments in the legibility and comfort thread are worth reading again. Peter has probably read more of the actual science than the rest of us, with the exception of Kevin, and I think he has a good handle on the limitations of generalising from the data.</p>
      <p><em>Also, what do you make of my point about many small specific tests potentially building up an incomplete but maybe still very useful picture of a font’s potential performance?</em></p>
      <p>I think that's what typography is. If you can quantify the data, I suppose you have a mechanism to help non-typographers do typography or, rather, to do a kind of typography minus inspiration. That's not a bad thing, because a lot of text is being produced by non-typographers these days, and if it can be made more pleasant to read with some help from data collection and quantification that's welcome. But that's not the same thing as turning a non-typographer into a typographer.</p>
