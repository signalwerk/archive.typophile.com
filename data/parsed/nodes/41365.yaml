      <p>…ease…</p>
      <p>The problem with studying readability under your definition is, the researcher has to propose an understanding of ease in order to isolate and investigate. Is ease to be thought of as the sustainability of immersion with comprehension over large periods of time, or is it to be thought of in terms of the lightness of the computational load in neurological processing terms, or is it to be thought of in terms of the rapidness or automaticity of visual wordform resolution, or is it to be thought of in terms of perceptual attentional demands, or is it to be thought of in terms of the abscence of physiological stress. </p>
      <p>All these are somewhat more tractable than ease, and probably related, but none of them really covers all we mean in ordinary, everyday terms, by ease, so a result derived from only one of it's more quantifiable dimensions can't bring us to where we want to be. And there is a naturally tendency for that to happen.</p>
      <p>[added “with studying readability under your definition” at the begining later]</p>
