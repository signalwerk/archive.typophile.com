      <p>John, I have a similar understanding as your wave and particle theories. </p>
      <p>I would also compare the past to non-latin scripts, although we can't go back and test how we used to read.</p>
      <p><em>I think it isn’t so much the point so much as it’s your favorite bugbear.</em></p>
      <p>I thought bashing bundling and Helvetica were supposed to be my "favorite bugbears".</p>
      <p><em>[Nick]: If all that’s different is one article of vocabulary, such as serif style, it’s the same typeface. [Eben]: Not the same. Very closely related.</em></p>
      <p>If it's not the same typeface, but as close as that, someone's plagiarising (or there's a "revival" going on).</p>
      <p><em>But I think that willfully leaving the potential benefit/information that science might offer out my bag of tricks is simply nutty. </em></p>
      <p>As I've repeatedly said, I'm not proposing ceasing readability research, and behavioral testing may be very useful in product development. But I don't believe that performance rankings of the factors involved in typography will ever be any use to graphic designers and typographers.</p>
      <p><em>You assume or assert that scientific method is helpless in such situations, and as I repeatedly have pointed out, it’s not.</em></p>
      <p>I've given many examples of such situations and asked how the variables would be separated. You've beaten about the bush, generalized and analogized, and stated that scientists would use creative test-building. That's wishful thinking.</p>
      <p>Let's return to Eben's example of making a study serif-oriented, and my rebutal. I do not consider it possible to isolate the variable of "serifness" from that of "typeface". </p>
      <p>It would be possible to vary the serif of a typeface (Penumbra comes to mind) and test that, but testing, for instance, the "readability" of slab serifs versus bracketed serifs by testing Clarendon against Times makes no sense, as the test may be measuring the performance of angle of stress, or degree of stroke contrast, or something else, or combination thereof.</p>
      <p>I doubt that a definition of slab serif is even possible, as may be infered from looking at the FontBook.</p>
      <p>Another variable that effects the quality of serifness is inking/gain/raster mode. So for instance, you decide to test serifness against ink gain, varying Didot serif thickness (or length?) at 9 pt, on a particular stock, printed on a particular press, varying gain. With a certain class of readers, and a certain kind of text content.  Let's assume you do this by modifying Bauer Bodoni. Well, I doubt the result would even hold for Berthold Bodoni. And what use would such information be to a designer, when all the variables of a particular job are different from those that weren't varied in the test scenario? Isn't there a scientific principle related to the "isolatability" of multi-variant phenomena? What do meteorological theorists call it? The science is getting soft, so rather than hard outcomes, probabilities.</p>
      <p>I suspect that if the massive task of testing all the variables of reading against one another, for individual typefaces, were done, the best that may be said would be that there is a 30% probability that ITC Garamond is more readable than Adobe Garamond.</p>
