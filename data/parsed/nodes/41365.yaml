      <p>"We all contribute a paragraph of gobbledygook type-speak strung together into nearly incomprehensible sentences"</p>
      <p>See above. </p>
      <p>"The people who post questions like Ryan’s at Typophile aren’t paranoid, they want numbers that can be used to reassure clients (or themselves) about typeface choices."</p>
      <p>Now we're in upside-down land. You're reiterating what I said days ago. WTF? I'm not talking about Ryan.</p>
      <p>You are the one who is presupposing all kinds of unrealistic, irrelevant and detached scientific processes in the discussion, which was originally about assessing the legibility of a typeface or some typefaces, and not, as you say above, about applying readability standards to typefaces, or measuring random micro features of letters, or isolating single words in artificial reading scenarios, or giving all typefaces ratings or rankings of some kind. Seeing all that as inevitable, as you seem to, is what I'm calling paranoid. You seem to be saying that the testing done to date proves that there is nothing useful to be learned by additional testing, because it also seems that you're saying that there is no possibility that there will ever be tests that account for the variables that we've all identified...... Even though we're here virtually designing just such tests.</p>
