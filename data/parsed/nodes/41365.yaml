      <p><em>To shift the debate into what I would guess might be more useful territory let me ask: What specifically would you be interested in having studied?</em></p>
      <p>Reading is a human activity carried out every day by millions of people who speak and think in many hundreds of languages and who read and write in dozens of different writing systems. This suggests to me that any understanding of the mechanics of reading that does not involve empirical data from multiple scripts and languages is not really an understanding of reading per se, it is only an understanding of reading a particular script (and most likely a particular language written in that script, given the limitations of most studies). So what I would like to see is studies that are designed to produce comparable data for reading in multiple writing systems.</p>
      <p>I have an hypothesis, which is that word or phrase recognition is built up from recognition of the base distinct 'atoms' of any given writing system, with the latter recognition involving sub-atomic role architecture and/or molecular (multi-atom) compounds <em>as needed by the individual reader encountering a given text</em>.</p>
      <p>The interesting aspects of this hypothesis, I think, is that for some writing systems I don't think we know yet what constitutes an atom. For the typical typographic Latin script I'm pretty sure the atom is the letter, and studies seem to confirm this. But what is the atom in Chinese? The ideograph or the radical? What is the atom in Hindi? The letter or the syllable? What is the atom in Arabic? The letter or the segment? And, for that matter, does the atom of the Latin script change depending on whether one is reading disconnected typographic letters or connected script?</p>
      <p>I have another, contradictory hypothesis, which is that there are no atoms, there are only waves, and what we make use of in reading varies all the time depending on a large variety of in-textual and extra-textual factors.</p>
