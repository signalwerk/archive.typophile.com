      <p>Nick, in fairness I think you have climbed down slightly from your original doom and gloom outlook on all science/font nexus'.</p>
      <p><cite> I’m not designing tests </cite></p>
      <p>Not designing them soup to nuts - no. But you have begun to state what might start to look like a reasonable set of parameters to be considered if you were attempting to examine one face vs another. You wrote<cite>All in all, for an index of typeface readability to be meaningful and useful, a standards manual would have to be published in the form of a type specimen, showing the exact setting which had been tested.</cite> </p>
      <p>When you say <cite> No, I don’t believe that it’s possible to account for all, or even very many of the variables; typographic, demographic, and textual. </cite> I can help but think that okay not at once... but in small steps, bit by bit a picture might emerge of what is going on &amp; eventually testing methodologies can get better &amp; better, and meaningfully include more &amp; more variables ( typographic, demographic, and textual and others too perhaps). This might sound like I am building to the dramatic "all" of your statement but I am not. Instead it's the bit by bit aspect of building an increasingly cogent but always incomplete view over time that matters. That is why an absolute/authoritative list can't really be drawn up by scientists or anyone. Opinions we can always have though! And how much better to have them be increasingly informed opinions?</p>
      <p>I don't think that anybody would disagree with your notion that type outside of the context of use cannot be considered fully/properly.  That said I don't think that you have to test the full battery of possible uses &amp; possible demographics etc ( which is infinite ) to notice meaningful things. If you did you could never do meaningful research.</p>
      <p>So instead of saying "readability is an inherent quality of typefaces" which is a bit too 2-d for reality (I agree) you might well do better to admit "readability is a potential quality of typefaces which could be described albeit imperfectly with some decent scientific tests". No? </p>
      <p>Dan you wrote <cite> “What typeface and Why, and How to effectively convince your client” </cite>  Would you make the book you describe given a 1k advance? 5k? 10k? In other words; "what price self respect?". ;-)</p>
