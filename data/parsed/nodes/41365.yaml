      <p><cite> But I don’t believe that readability is a scientific concept. </cite></p>
      <p>I don't believe that concepts are there to be balkanized; in other words they don't necessarily belong exclusively to one area of information or study rather than another.</p>
      <p>I am unclear on what you mean by Scientizing but it does sound catastrophic. Even without know yet I suspect that scientizing typography isn't going to happen. I am fairly certain that's a straw dog. </p>
      <p>Instead; if we are lucky we typographers &amp; type makers might have a situation a bit more like another deeply human and sensorially rich activity: cooking. For the cook there are nutrtionists, agonomists, biologists, and culinary anthopologists. None of which stop me from cooking any way I like. On the other hand I do draw on their observations from time to time. How is food any less complex than Typography? Moreover there is no rush to displace cooks from their jobs by the dreaded white coats... </p>
      <p>As you know I don't think that Science is all good all the time. It can be used for "bad stuff" the same way Typography can. So I am happy to point out the obvious counter-argument of all the heavily processed food made with the help of "food scientists". It's a hell of an counter example. Maybe this is the kind of thing you mean when you say Scientizing.</p>
