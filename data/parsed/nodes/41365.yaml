      <p><cite> I guess I misunderstood you then. </cite> Maybe. Go back &amp; look at what Peter wrote about Readability. I thought it was very helpful. </p>
      <p>And here is an analogy while I am at it. Peter, Kevin, feel free to ding this up if you like... </p>
      <p>Suppose you wanted to study Cuteness scientifically. You can't say scientifically what Cute is right off the bat so how do you study it? Are you blocked forever? No way! What can yo do? </p>
      <p>You could create an objective set of criteria describing perhaps not even the thing that was meant to be cute or not cute but the reactions you thought were indicative of a person coming into contact with the "Cute". Get the right reactions ( whatever you have decided they are ) and you know what is cute. Bring subject &amp; target together and report what you get. What is you are looking at? Reactions. </p>
      <p>Or you could expose people to stimuli designed by you and ask them to report what was cute and so test hypotheses about what is needed for say a human face, or dog, or cartoon to be cute. Now it's reported reactions.</p>
      <p>Or you could track eye movements. Whatever.</p>
      <p>No matter how much you test you will not describe the whole phenomena! But you could start to figure out things about the impact of eye to mouth &amp; eye to nose ratios ( or whatever objective phenomena you choose) on what people are willing or not willing to report as cute. Not too bad really.</p>
      <p>Doing this you yourself could report that in a rough and casual manner "I am studying cute". You wouldn't be lying exactly. On the other hand you wouldn't be completely accurate either. You would be fudging because on some deeper level it is the atomized stand-ins for cuteness, the objective* phenomena to gauge that are being studied.</p>
      <p>But back to Readability. If comfort, speed and comprehension are your standards for "Readability" then you face some problems. You have to define comfort. You have to define how you calculate speed. You have to define how you gauge comprehension. This is atomizing**. It's not common sense. But then it isn't meant to be. It's meant to be a reproducible scientific test. </p>
      <p>This is what I mean by indirect. This is what I man by "contribute to". It isn't that there cannot be a relationship. It's that it has to be a certain kind of relationship. Not a bad kind. Just a different kind. </p>
      <p>So this not lying thing is tricky. Nick wants to spin things one way so he says simply " You cannot study readability with Science". It's sort of true. In a specific way. But he is leaving out some important stuff in a statement like that. You can say "You can study readability with Science" and you are doing the same thing. Leaving out something.</p>
      <p>Obviously we can't get into infinite detail all day so we fudge like this about lots of stuff. And most of the time it's okay. But on a thread like this it makes for a very long thread and talk about hobby horses.</p>
      <p>So it isn't so much that what you described before was unscientific perhaps; but that it was under-scientific. </p>
      <p>Also, I &amp; Nick ( I think...) are not saying these is no such thing as Readability. (Or if Nick is he may be the only one.) </p>
      <p>I hope this is helpful.</p>
      <p>* As objective as you can imperfectly make them.<br>
      ** Atomizing sounds a bit like all the life has gone out of it but I don't think thats accurate either.</p>
