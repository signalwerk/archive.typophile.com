      <p><em>Also I reject the idea that you could do “Bill Style” research on two Typefaces.</em></p>
      <p>Doesn't that mean it's impossible, as I have said all along, to measure the effectiveness of typefaces?</p>
      <p><em>You would need to have a standard ( control) and a variant or a series of variants. Otherwise you have no basis for looking at a typographic feature.</em></p>
      <p>Of course. That's why, as I've argued somewhere above, with regard to serifs, it would make more sense to "control" the typeface. But say you pick Meta, aren't there many, many ways that serifs could be "added" to it, e.g. slab, bracket, etc.--as in the Panose list?</p>
      <p>And just suppose you want to measure Speed, Comfort and Comprehension as they relate to counter size, what model are you going to use for varying counter size? </p>
      <p>You can't just willy nilly vary counter size and leave other parameters unchanged, because that defeats the whole purpose of having diffent counter sizes. Consider these three Slimbach faces. I've equalized x-height. When the size of the enclosed counter on the e is varied, other proportions in the typeface must also vary for optimum what-ever-it-is-you-want-to-measure. So these must be altered too: the size of the aperture to the lower counter, and the relative size of the capitals and their counters, and even the genre of the type, for a large upper counter on an e is not good for an oldstyle. The size of the e's counter is not a measurement, it's a style.</p>
