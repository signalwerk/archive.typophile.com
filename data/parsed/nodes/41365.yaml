      <p>Maybe you mean that saying that Science has not unlocked the question of readability. And that claims to the contrary are bogus. You might even say that Science alone isn't enough to do so*. All of that that I could agree with!</p>
      <p>* Or even that it can't on purely Semantic grounds. Peter's point that Science isn't going to concern itself with the concept of Readability per se because as a concept is too imprecise, that is to say insufficiently atomized to match phenomena is also great point. Maybe that's what you are referring to. </p>
      <p>But what I haven't heard you say yet is that Scientific study of reading; using the terms and conceptual frameworks appropriate, might over time contribute to our understanding reading. And that this work might contribute to font design. That it might inform the way we look at Readability in the humanities. These are not contradictory or clever dodges. The opposite is also true, insight from the humanities will necessarily be applied in Scientific theories.</p>
