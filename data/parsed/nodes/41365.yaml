      <p>Right John, <em>text</em> (content) is a variable that influences readability, so add that to <em>demographics</em> (who's doing the reading) and <em>typography</em> (how the typeface is positioned and scaled on the page), as factors that effect readability, as well as <em>typeface.</em></p>
      <p>The effect of text on readability has been measured, as mentioned earlier, in the Flesch index.</p>
      <p>I don't think typographers, in designing a page, consider those four in isolation from one another, so my primary objection to readability research is that it does. Kevin is doing the right thing in trying to introduce typeface as a variable in reading theory, but my concern is that an Index of Readability for typefaces that doesn't factor in, especially, typographic variables, will be used by the communications industry as if it does. So the client will tell the designer that they must use the "most readable" typeface. Or will foundries have to apply to a standards body to have their types tested and categorized by readability grade?</p>
      <p>Pardon me for dragging this out, I've spent too much time on the 'phile today!</p>
