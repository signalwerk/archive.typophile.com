      <p>Ironically, almost all modern readers encounter Blake's 'writings' in typeset form, rather than the etched illustrated form that he intended. Doubtless the typeset text is more legible/readable than Blake's deliberately naïve etched writing, but the latter demonstrates nicely the irreducibility of 'a good reading experience' to a set of legibility metrics. This is not to say that the scientific study of reading as phenomena (not phenomenon) is without value, but there is no typography without text and text is anything but uniform.</p>
