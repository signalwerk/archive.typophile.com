      <p>Well for what it's worth, here's on the word 'readable'. It originally and still generally means "easily read", as you quote, Scalfin. It could refer to something well written, or it could mean that the printed page is visually easy on the eyes. Among those who have written about typography, readability came to be distinguished from legibility, because these writers thought that there was more to making a text block easy to read than having the letters clear and distinguishable from one another. This specialized meaning evolved by the 1960s, but I wouldn't be surprised if it were much earlier. Whether this is a distinction without a difference is still debatable. </p>
      <p>Nick and I agree that there is more to readability than the clarity of individual letters. Where we don't agree is whether this difference is worthwhile investigating scientifically. I agree with Eben that there's not more to be said on it at this point. The research will happen or it won't.</p>
