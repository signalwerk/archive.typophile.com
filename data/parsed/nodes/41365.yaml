      <p><em>Your view here seems to be that scientists should not research reading, because their work is never going to be of help.</em></p>
      <p>I'm all for the science of reading, and for incorporating typographic expertise into that research.<br>
      But I don't believe that readability is a scientific concept.<br>
      It's too soft. Which is to say that there are too many cultural variables: typographic, environmental, demographic and textual.<br>
      There is also the issue of what yardstick to use: speed is too trite, while comprehension and retention of anything other than simple grammar and facts is the preserve of the humanities, is it not?</p>
      <p>Scientizing typography will do more harm than good: it's a job for designers, not technicians.</p>
