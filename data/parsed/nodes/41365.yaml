      <p>If those doing the research don't refer to and include other relevant specializationst, it all can get to be a bit like those blind sages trying to describe an elephant (It's like a tree. No, it's like a snake...) (Why didn't they just ask the mahout?)</p>
      <p>It might be difficult to design a font that is completely illegible and still include identifiable letters, and it's true, the most legible font in the world can be mangled by bad typography. The fact there is bad typography though, suggests that starting with a highly legible typeface should mitigate the awfulness somewhat. But, what's a legible typeface 'sposed to look like? </p>
      <p>The rules of what make a legible typeface are in my opinion are quite simple and straightforward and allow for a great deal of flexibility. I don't think is is even possible to design a definitively "most legible" typeface. I think in any fare test of comparable fonts, you'll find that differences in performance can be so slight as not to matter.  </p>
      <p>I really don't think legibility standards need to be anything to get knickers in a twist about. It's mostly common sense to anyone with some expertise in typography. I think where that kind of standardization would apply would be on wayfinding signage, medicine bottles, captioning on TV, operating instructions that come with power tools and the TV guide in the newspaper. (OK that last one is personal, but Really! Would it be possible to make it worse?) and things like government and public transit websites and other printed materials, where accessibility is a right that these organization should make honest efforts to honour. </p>
      <p>This sort of graphic work seldom actually gets designed in any real way. The objective in producing a set of instructions may turn out to be "How many tiny black words can I fit onto this tiny piece of paper that will be packaged with these potentially deadly drugs" instead of what percentage of people who should read these instructions will not be able to?". Even if the designer conscientiously designed this sheet to be as readable as possible, he or she would have no way of telling you what percent of people could read it. That should be something that could be determined. At the very least, there should be some set of guidelines that can be referred to, that are a bit more sophisticated than, "use Arial and make it big" (the real purpose of such a spec is to keep people who know less than the spec writer from using some crazy Spenserian script, and Arial is a font they can name.)</p>
      <p>Taking the example of Erik Spiekermann's work for the Financial times, where he improved the legibility of their typeface by cleaning up the shapes somewhat, increasing tracking and leading and (counter intuitively to most) slightly decreasing the font size. </p>
      <p>I think that the form such "standards" might take need not be unreasonably restricting at all and would have no impact on what the vast majority of designers do. </p>
      <p>Hellbox, email me (russ.mcg at gmail.com), and I'll tell some of what I've done to test legibility. It was for signage, but some of it might apply to what you are doing.</p>
      <p>-=®=-</p>
