      <p><em>Nick are you really against developing something to help test this properly? Or do you think it can’t be done properly?</em></p>
      <p>I'm against the productization of readability and the hyping of such type products with scientific or statistical terminology.<br>
      The effect of this is to derogate the acumen of type designers and typographers, by replacing their subtle creativity and design skills with principles that are simplistic and banal. So the client doesn't defer to the typographer's judgement, but wants hard proof. That would be nice, but typographic design, whether of typefaces or page layouts, doesn't work like that. Typography is design. Glyphs are drawn by hand.</p>
      <p>Linotype was the Borg of the newspaper industry in the mid 20th century. The Legibility Series of types it developed played a significant role in making newspaper typography the stagnant backwater of the graphic design world, until the advent of DTP.</p>
      <p>**</p>
      <p>There's scientific research, which should test how people read. And there's product development, which tests how products perform. The efficacy of a design cannot be determined before it is marketed, and in many cases it creates its own demand (hence innovation and progress).</p>
      <p>About a century ago, some clever people began applying scientific principles to advertising (Daniel Starch, for instance, and Claude Hopkins). But the furthest they have ever gotten down that road (apart from the subliminal detour) is market research. For actually coming up with creative, you want Kirk on the job, not One of Nine.</p>
      <p><em>There is a common goal of providing a good reading experience and everyone stands to gain from cooperation.</em></p>
      <p>Some however may resist such platitudes, prefering to be independent and not become assimilated into the optimum reading experience. </p>
      <p>Performance principles do have a place in typography (for road signage and special needs accessibility), but typefaces should not be tagged with readability standards, which is where this is leading.</p>
