      <p>On account of my reading of the literature on ‘crowding’ I’ve come to think of affordance as a curve with an initial steep climb, than a wide plateau and eventually a gradual decline. Proposing that affordance is a curve with a distinct shape is more useful than thinking of readability as a simple equation of more versus less. And it is a perspective that has it's source in science.</p>
      <p>Where, in terms of type-size the climb begins or the plateau sits; how wide the plateau is are issues involving thresholds and ranges and vary from type to type. I suspect an analysis of variance will show that, for most standard text fonts the thresholds and ranges don't vary dramatically under normal conditions of use or covary linearly. In other words, a change that affects a threshold positively might have a negative effect on where the plateau sits. Perhaps the styles of termination, or types of contrast can be an example. But thresholds and ranges do nevertheless, I think we'll find, interact with the traditional typographical parameters. And I suspect they do so in demonstrably more complicated ways than we have seen codified so far.</p>
      <p>Simple affordance has to be balanced with issues of comfort in large texts, with concerns about heirarchical transparency, surveyability and navigability in instructional manuals, and with the cultural-historical positioning or affiliation statements a document has to make. Comfort in large texts, positioning, and the demands for heirarchical transparency, surveyability and navigability can exert countervailing pressures on the choice of type. This makes a decontextualized descision based soley on simple or generic affordance micro-advantages short-sighted. </p>
      <p>Many clients groups are aware of these subtlities in how affordance works and of countervailing pressures. Many others willingly learn. What seems to count is explicit evidence of well-motivated and knowledge-based decision-making.</p>
