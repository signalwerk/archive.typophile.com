      <p><em>Seeing all that as inevitable, as you seem to, is what I’m calling paranoid. </em></p>
      <p>If I'm paranoid, you're naive. </p>
      <p><em>it also seems that you’re saying that there is no possibility that there will ever be tests that account for the variables that we’ve all identified...... Even though we’re here virtually designing just such tests.</em></p>
      <p>Who's this "we"? I'm not designing tests. Are you working on any such projects as a typographic consultant, or are any other typographers? </p>
      <p>No, I don't believe that it's possible to account for all, or even very many of the variables; typographic, demographic, and textual.</p>
      <p>I agree with you that it is better to at least have some typographic intelligence in reading research, but that's not my bone of contention. It's the absurd notion that readability is an inherent quality of typefaces, which can be measured. IMO, readability does not begin to exist until the graphic designer, art director or typographer begins to work on a layout. For analogy (this is for William and Eben), as Maria Muldaur once put it, "It ain't the meat it's the motion".</p>
