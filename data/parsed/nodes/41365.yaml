      <p><em>So should we just assume that a type is more legible because god destined it to be so?</em></p>
      <p>Legibility is not the issue, it's readability.<br>
      IMO, readability is something which science is unable to address -- "that's not even a question".<br>
      We're talking about the readability of a holistic design--a page at the least--and seeing if we can pre-determine its readability based on data about its components. Or vice versa--seeing if we can predict the readability of a type design independent of the layout, or of the layout independent of the type design. Science can't do that, there are too many inter-related variables that will interfer with the predictable readability of anything but the most standard, clichéd formats.<br>
      It would be like trying to determine the liveability of a building or the driveability of a car, just from knowledge of the components. </p>
