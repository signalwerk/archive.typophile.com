      <p>&gt;But please explain how measuring the “whatever-ability” of a group of items does NOT result in an index/table of their relative merit?</p>
      <p>Since multiple factors are involved in readability, I would not expect a single index that applies to all situations. But I would expect an indication of what is more readable in specific conditions when other variables are controlled.</p>
      <p>For example, I would not expect differences to show between headlines of a few words in serif vs sans serif, when there is similar x-height, stem weight, width and spacing. However, a common view is that sans work less well for extended reading at text sizes, and specifically they require more leading to work decently. So if you control for x height and weight, I expect that serif type will be more readable at normal text sizes with tight leading. When we have good measures of readability this kind of difference will be detectable. One simple test will be whether the eye loses the line more often with tight leading in a sans that is otherwise similar to a serif. Also I have already suggested that testing the decline of comprehension of extended text, with time, might be another way to get at it. Another is to test for people's ability to catch errors in proof reading. </p>
      <p>Also legibility is one factor in readability. I think that the tests of Clearview did show that they were more legible and more readable at distances under night conditions, particularly for older drivers. It doesn't mean they will be more readable in extended text at small sizes. </p>
      <p>&gt;What’s your point, Bill?<br>
      My point is that scientists will control for some variables to test others. In your post, you seemed to overlook that this possibility, a standard thing to do in scientific testing. The ability to control for some and detect others requires creativity. You assume or assert that scientific method is helpless in such situations, and as I repeatedly have pointed out, it's not.</p>
