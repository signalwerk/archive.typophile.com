      <p><em>Science isn’t going to concern itself with the concept of Readability per se because as a concept is too imprecise, that is to say insufficiently atomized to match phenomena is also great point. Maybe that’s what you are referring to.</em></p>
      <p>That's what I've been saying all along. "Too many (unrelated) variables".</p>
      <p><em>this work might contribute to font design.</em></p>
      <p>It's all grist for the mill.<br>
      Samuel Coleridge used to attend Humphrey Davey's lectures "to replenish [his] stock of metaphors".</p>
      <p>Take a look at the effect of scientific knowledge of the reading process so far, on type design.<br>
      To begin with, the very short descenders of Cheltenham (because the top part of letters were discovered to be more significant in the reading process). </p>
      <p>Century Schoolbook was supposedly developed using reading research data, but I've never come across anything further about this. It certainly looks like an easy to read face, and has been much used in childrens' literature (the name helps!); but so has Garamond; both were favorites of Theodore Giesel (Dr. Seuss).</p>
      <p>Lintotype's "Legibility" news fonts of the 1920s and 30s were concerned with opening up the counters: certainly the results produced a cleaner image, and the mantra has since always been in favour of open counters--but there is no scientific evidence that this actually improves reading! As John has suggested, let's consider non-latin scripts, and in Chinese and Japanese there are closed counters galore. </p>
      <p>I think that closed counters may improve readability. For instance, consider the sequence "i_n", which may be confused with "m".<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/inmin_5726.jpg"></div><p></p>
      <p>Saccadic scanning has been common knowledge since the 1940s -- there were <em>Life</em> magazine articles with call-outs on a photograph, showing "where men and women looked subconsciously" -- all very Freudian. I'm not sure whether that knowledge has ever informed a typeface design.</p>
      <p>Claude Hopkins' work in the 1920s (he wrote <em>Scientific Advertising</em>, and developed split-run direct marketing as a means of testing the relative merit of different copy and layouts, measured in sales) was a great influence on David Ogilvy, who disseminated some of the successful readability principles in several of his How-To books. But not really much hardcore science there, more market research using statistical techniques.</p>
      <p>Cyril Burt's <em> A Psychological Study of Typography</em> (with foreword by Stanley Morison) was noted in its time, but all Sir Cyril's oeuvre has been tarnished by his reputation for falsifying.</p>
      <p>It's not as if scientific knowledge about how we read hasn't been available in the past. But has this been any use to the designers of the most-read faces, other than giving them a lever to create something new and different--has it produced more "readable" typefaces and typography?</p>
      <p>Why are you, Eben and Bill, assuming things will be different soon? Isn't this the modernist fallacy which believes that the present age is the only high-tech era, and all previous eras were pre-modern? The blind faith in science, technology and progress that believes we are always on the threshold of discovering the way things REALLY work.</p>
