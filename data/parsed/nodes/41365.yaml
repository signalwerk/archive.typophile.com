      <p>Eben: <em>“readability is a potential quality of typefaces which could be described albeit imperfectly with some decent scientific tests”. No?</em></p>
      <p>Either you can measure something or you can't, so 'describing something imperfectly' isn't really science, although it may be anecdotally useful (and the plural of anecdote is data). I think legibility is probably an inherent quality of a typeface, determined by the legibility of individual glyphs, as individual forms and as distinct from each other. But readability is a measure of a document: we read typesetting, not typefaces. Choice of typeface is one variable in the readability of a document. If one were able to isolate and make equivalent all the other variables, then perhaps one could measure the degree to which the typeface contributes to the overall readability of the document. But this would still be something other than a readability index for the typeface, because I'm pretty sure that if the other variables were different, even though equal for the purposes of comparison, the contribution of the typeface to readability would also vary. For example, typeface X might be determined to be more readable than typeface Y in a document set in 12pt, but typeface Y might be determined to be more readable than typeface X in a document set at 8pt. Isolating the other variables in a single document only indicates which typeface is more readable in the context of those variables, not which typeface is inherently more readable.</p>
    html_clean: |-
