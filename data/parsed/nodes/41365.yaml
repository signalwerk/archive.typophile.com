      <p>Describing something incompletely is might be said to be imperfect. Incompletely &amp; precisely are not at odds. For instance I can measure very precisely the lumens a light bulb gives off. This doesn't mean I have perfectly described the light bulb. Or even the light. So how about "readability is a potential quality of typefaces which could be described albeit <strong>incompletely</strong> with some decent scientific tests”? </p>
      <p><cite>  Isolating the other variables in a single document only indicates which typeface is more readable in the context of those variables, not which typeface is inherently more readable. </cite></p>
      <p>Yes. Absolutely. But, what if you do a wide range of tests? You could see trends. Or maybe not I suppose depending on the shape of reality. But I bet you would; and it would be the shape of those trends across a wide enough range of variables that would start to show what works better &amp; in what contexts. Sort of like digital photo is made up of layers of RGB or CMYK color. One dot is pretty meaningless. 12 megapixels may not be. </p>
      <p>So while I agree it is stupid or perhaps more charitably overly simple to say in a blanket way one face has better potential readability than the other, it would not be nearly so silly to describe a pattern of relatively greater or lesser success in a series of specific contexts and then interpret the data to help choose a type face for some project or purpose ( say way finding signage or a novel ) or to take conclusions away in order to try to design a better font for contexts tested.  </p>
      <p>John your post suggest that you doubt that data you would get back could be meaningfully interpreted. Is that correct? Also, is this formulation at odds with your legibility/readability distinction? I don't think it is but I am interested to hear what you would say.</p>
      <p>If you can test cars &amp; cameras and draw meaningful but specific conclusions you can take things a few steps further and test a typeface.</p>
