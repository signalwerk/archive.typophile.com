      <p>Francis Bacon said: "Knowledge is power." Scientific knowledge is power that can be used for good or ill. It is up to us to use it wisely. </p>
      <p>The romantic reactionary view of science always points to the misuse of science to oppose or limit science. Science is misused, but I don't think that's an argument against scientific research, unless humanity is hopeless at managing the added power that comes with science, and science-based technology. It is a serious question whether we can manage scientific knowledge for the good, but I don't see a lot of volunteers to become subsistence farmers. </p>
      <p>I would like to see an effort to use science responsibly rather than abandon research. </p>
      <p>Incidentally 'scientistic' according to the wikipedia article can mean pseudo-science or the misuse of science, and it can also mean the view that the methods of the physical science apply elsewhere, such as in the social sciences. </p>
      <p>How far the methods of the physical sciences can be applied beyond their origins is an interesting question*, but in the case of cognition and perception I think the evidence is clear that it is possible to develop testable theories and test them. </p>
      <p>*You can access my article on the subject <a class="freelinking external" href="http://pos.sagepub.com/cgi/reprint/19/2/157" rel="nofollow">here</a> if you are interested.</p>
