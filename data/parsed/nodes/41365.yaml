      <p><cite> Doesn’t that mean it’s impossible, as I have said all along, to measure the effectiveness of typefaces? </cite></p>
      <p>I have answered this in detail before. In redux: If you mean as of now; in a scientific way; then yes; we haven't done the research. If you mean in an absolute sense - then yes. Absolute isn't on the menu. If you mean that you couldn't maybe do billions ( or however many)  of tests &amp; then maybe come up with something interesting &amp; useful then - no. You can't know that. </p>
      <p>But what I meant by this is that focusing on font vs font is not a useful way of thinking about this. That's why I reject it.</p>
      <p>That said; it's also true that people make subjective choices about this all the time &amp; will. Thinking "Does this seem more readable to me - or this?" is sometimes a part of font choice and isn't going away.</p>
      <p>And in addition they might even make experimentally flawed tests to justify those choices. Wanna stop em? Try it. Good Luck!</p>
      <p>It's also true that you can plunk two typefaces into MS Word with default settings ( size+leading ); set a nice long text and then test some factor such as speed with or with comprehension. Will that tell you which face is "better" or "more readable"? No. Of course not. Will it tell you something? Yes! Obviously something about that set of variables. But a very fuzzy something. That is of course not nothing. But it ain't much either. You would have to do many thousands of additional tests to get somewhere that way. That would be expensive and inefficient. And I guess that you would end up with a data set that is too murky to be useful. So again. Impossible No. Very unlikely? Yes. </p>
      <p><cite> You can’t just willy nilly vary counter size and leave other parameters unchanged</cite> You know that I agree. But you also know, or should by now that this is a yet another straw man at this point. </p>
      <p>Unless you are willing to grip specifics in one sense or another you get nowhere. Which is where this thread is now going - fast.</p>
