      <p>Bill, I don't have rough and ready explanations for all the words I use. Some are of my own creation. Often they are cobbled together from terms I meet in things I read. They form because of things in my reading that resonate with my awareness of science and my knowledge of type and type-making. This resonance often has to do as much with the everyday ordinary meaning of these words, as it has to do with their assigned meaning in the specific contexts in which they appear</p>
      <p>I don't choose them just to be obscure, but because I find them to be descriptive and precise. I guess I depend on the fact that the same resonance will occur in the minds of my readers. Perhaps I am foolharding in expecting that it might, and too undiscipline to not let them out until I can give a full account of what they mean.</p>
      <p>Scattered throughout my posts on these subjects are various attempts at explanation of why and how I use my terms. I don't pretend what I write is easy to understand, and I try to be as lucid as I can without ressorting to formulations I'm uncomfortable with, or writing longer dissertations.</p>
      <p>My only hope is some things will get through, and that the things that do won't be fool’s gold, but have legs.</p>
