      <p>Arguing against studying readability scientifically is to me like arguing against studying disease scientifically. You can make the same arguments, and they will be just as wrong-headed and against the progress of humanity.</p>
      <p>For example, the issue of text size has an obvious and measurable affect on readability. You can make text small enough that people can't read it. And you can measure how small that is, how it varies with age and acuity, and so on. There is no reason to think that less obvious things can't be studied also, with sufficient imagination in theorizing and sufficient cleverness in experimentation. </p>
      <p>That doesn't mean that everything to do with readability, particularly the aesthetic side, is likely to be measured soon or ever. But to just wave aside scientific study is highly misguided. </p>
      <p>As Peter explains, a successful science of readability is likely to come up with theories that are as complex and subtle as we know reading to be. And such insights may well help us to improve reading on screens, to help those with limited vision, with forms of dyslexia, and so on.</p>
