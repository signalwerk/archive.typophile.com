      <p><em>Some however may resist such platitudes</em></p>
      <p>The vast majority of reading research is devoted to understanding how people read, and is entirely agnostic to the concerns of typography. There are several conferences and journals devoted to understanding word recognition, reading acquisition, dyslexia, and reading comprehension where type is not considered an interesting variable. The researchers at all of these conferences find it perfectly acceptable to use Courier as their main typeface. That’s what we’ve achieved by resisting cooperation.</p>
