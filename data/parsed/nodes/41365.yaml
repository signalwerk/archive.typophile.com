      <p>Nick, your points would go down so much better at this point if you would stop using this term "readability". </p>
      <p>Also I reject the idea that you could do "Bill Style" research on two Typefaces. You would need to have a standard ( control) and a variant or a series of variants. Otherwise you have no basis for looking at a typographic feature.</p>
      <p>Of course if you want to just do a speed test of one font vs the other you could do that but as you point out you would have to do them again &amp; again with multiple leadings etc to find their "sweet spot". And basically the data you got out of that would probably not be easy for most people to take in or make use of. If you did a simple X inches wide 10/12 test - easy by comparrision you would be testing in a typographically naive way.  </p>
      <p>If you wanted to look at opening/appature sizes you would ( I think) want to look at them in the context of interior sizes vs interletter spaces as a sequence of ratios - not as simple interior measurements to see if the Noordzij model for that which seems so "bang-on" bears out. Peter even has a name for this and some theory built up as well. And NO, it isn't going to give you the picture. Nobody would claim that it would.</p>
