      <p>Eben, I felt the need to say something in this thread, but this reply will have to suffice for the time being.</p>
      <p>[Affordance] (I explained it elswhere some time ago on typophile — I think it was the rule or law thread — affordance is the relationship between an object or artifact and what we choose to do with it or use it for): legible writing affords or promotes or lends itself to effective perceptual processing in reading, so ease of reading is an affordance of legible writing or its typographical correlatives or surrogates.</p>
      <p>[Expanding / giving some context] I'll have to ask you to think about how styles of termination, or the presence or abscence of contrast, or wider spacing, or the sizes of counters affect performance at thresholds of size or distance, versus how they effect performance at normal type sizes and distances where reading speed and comfort are at a plateau.</p>
