      <p>Aren't you rather begging the question of "advances" in the science of reading?</p>
      <p>They first have to be winnowed from the chaff.</p>
      <p>Newton had a lot of dubious ideas (he was a religious fundamentalist whose biggest interest was mathematically interpreting the Bible), so a lot of his theories are in the dustbin.</p>
      <p>He was a powerful man (and presented by Blake as such) who used his power to have his adversaries (counterfieters: his income came from being head of the Royal Mint) hung, drawn, and quartered. He was, like Blake, an intensely religious person, but of a quite different stripe.</p>
      <p>Today, "Why most published research findings are false" is an issue.</p>
      <p>So I think it's quite reasonable to question the limits of science, as I am doing, without being painted as a romantic, anti-social, anti-rational luddite. I don't have a problem with scientists studying reading, and they can study the occult mysteries of readability if they wish. But IMO it's so much phlogiston.</p>
