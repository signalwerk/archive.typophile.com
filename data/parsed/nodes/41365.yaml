      <p>Bill, as accessible and ready-to-hand labels for broad experiential categories of affordance the terms readability and legibility have a relatively transparent, legitimate, even important, and stable use. As sharp and focused denominators of or designations for discrete and incisively differentiated areas of functionality the terms fall short. They lack specificity and bite.</p>
      <p>Science by plotting thresholds and ranges of affordance in actual conditions of use, or looking closely at cognitively isolated dimensions of perceptual processing in reading does a service. It broadens and deepens this experiential knowldge of affordance with diverse and specific knowledge of actual functioning.</p>
      <p>I think we all want to avoid the insidious typographic equivalent of racial profiling, thinking perhaps it might be evidence based. Nick is right in insisting it isn't warranted, either on humanitarian or on scientific grounds.</p>
