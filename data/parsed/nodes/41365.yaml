    html: |-
      <p>The "readability" of *texts* can be measured by the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Flesch-Kincaid_Readability_Test" rel="nofollow">Flesch index.</a> This is, on the face of it, a "common-sense" approach to decoding text. But any count of words per line and characters per word, while appearing to be objective analysis, can be "gamed" by a writer who is trying to increase readability.</p>
      <p>Imagine how typographic/marketing/design decisions could be "justified" (no pun intended) by calibrating such seemingly objective features as length of descenders, character count, stroke weight contrast, etc., then tossing in a couple of constants and passing the whole thing off as objective "analysis."</p>
      <p>Designers already invoke such visual characteristics as "greater x-height" or "serifs" as primary signifiers of legibility. But, at what point will a further increase in x-height begin to *reduce* legibility? How long can a serif be, before it *interferes* with the reading process? Perhaps the latest fashion trend in fonts (popularity) is a more reliable predictor of legibility than any structural element inherent to the characters themselves; if it is read more often, mustn't it be more legible? Legibility of printed instructions would seem to vary more in direct proportion to time available for reading, as well as the visual acuity and emotional state of the reader, not unlike many other forms of perception.</p>
