      <p>Is there something about the instructions that requires speed reading? Conventional typefaces like Times, Minion, Garamond, Charter, Georgia, Dante, Clifford, Hoefler Text, Constantia, Galliard, Electra, Goudy Oldstyle, etc. are all adequate for instructions, tests, forms,  etc. as long as they aren't mangled (negative tracking, inadequate linespacing, light inking, artificially condensed). There are better ones and of course much worse ones (Helvetica, Bodoni, display typefaces), but is there some critical reason the typefaces have to have some legibility rating? What kind of texts are you preparing? </p>
      <p>I ask because there is no such standard test; it's a huge bugaboo in the type and typography world, and unfortunately it's all decided ad hoc. your best bet right now is actually to make a "safe" or conventional choice and not mess with the type too much; set it well. If you want assistance in choosing highly legible typefaces, be prepared either for a cacophonous disagreement, or else very subjective choices from whoever you ask. </p>
      <p>You may have to design the test yourself, if this information is required. Contact me offline for suggestions.</p>
