      <p>Nick I am glad to see your argument is starting firm up. I am also struck at, and also unsurprised by your ability to imagine testing scenarios - which is great. There is something to the idea that you could as both a scientist and a typographer talk about types in a soft way or perhaps in an informed manner ( informed differently ) rather than a stiff, absolute, list oriented manner. If the reality is complex this is the only accurate way to talk about them. This doesn't preclude having meaningful things to say. It's just that these things will be rich/complex. This, as opposed to, and in a sense as a substitute for what hellbox was originally after.</p>
      <p>It may be that you have acquired a 3rd bugbear. If 2, why not 3? I am with you for all 3 as far as I can see. I just don't stamp my foot as hard, and in the case of the most recent one I have a substitute in mind. It is starting to look as if you might too.</p>
      <p>Peter, Thanks. I agree that "a table of comparative measures can’t be where we end up" is right. For one thing that simply isn't how the science would be done. Each experiment will have multiple ways in which it is out of sync with others. But what you can say is that if a variety of scientists run a variety of tests geared to a given hypothesis what you would be looking for is for the series to begin to accumulate support for or begin to undermine that hypothesis. This is a simple scenario. More complicated ones exist! You would be hoping to be able to say this hypothesis seems to hold some water or it doesn't. Sometime the hypothesis itself or the methodology was ill conceived and you don't get to say either thing. And there is room to disagree about these things. So the reason you cannot have a list is that Science ( and most fields of inquiry)  is more complicated than a list or matrix can describe. Peter, Kevin, is this sort of fair so far?</p>
      <p>But if you have successful experiments for a given question and you go on to do another series and another after a long building on those experiments that seem to actually show something useful you can begin to have a picture emerge of what seems to be going on. Do enough of this and a theory can start to look pretty solid. A theory like evolution for instance.</p>
      <p>It will be a very very long time before all the variables of reading have hypothesis' and have been tested out meaningfully. And before you can attempt that you have to have a theory about what those might be etc. So at our current rate of burn the mere possibility of doing a meaningful ITC Garamond vs. Adobe Garamond "readability" test must be 1000s of years away. It's an awful lot of work for a pretty banal question. That's why I think that targeted testing of what seems like an interesting or useful variable that is hard to crack by other humanistic means has to be where it's at.</p>
      <p>That is why I would agree that isolating the variable of “serifness” is probably not that interesting or useful. On the other hand I do think it would be interesting to craft experiments towards a better understanding of what is going on with serifs and different serif designs and so on. There are many ways of looking at that.</p>
      <p>John, I think Robert is probably correct.</p>
