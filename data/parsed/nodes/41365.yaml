      <p>if you’re attempting to isolate the effect of things like serif size or weight on <strong>speed</strong>...</p>
      <p>The obvious next question to ask is what targets might you reasonably go for: Serifs strike me as especially complicated. The white space between letters vs that held in counters might be a great one. It would require an explicit formula though. David Kindesley made a device to do this that wasn't perfect but was decent. Adobe has one they call 'optical' that similarly isn't perfect. But these, or a new one might be used. Descender length is probably low hanging fruit. The key thing would be to use a face &amp; then make modifications to it so as to isolate the variables as much as possible.</p>
      <p>I should also point out that plenty of perfectly good research is done which doesn't isolate EVERY variable but which notes the ones that have not been isolated along with the ones that have &amp; how they isolated the ones they think they got. Obviously the more the better but...</p>
