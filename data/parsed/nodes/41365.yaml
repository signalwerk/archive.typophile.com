      <p>"I do think that trying to make a science of legibility is pretty pointless. No doubt someone with a BSc will concoct a grand scientific method. However, I suggest that a better test is the reader’s opinion (and your own, if you trust it). Typography is an art, not a science; and I’m much more interested in the opinions of good typographers, than even the most informed opinions of the world’s most eminent scientists."</p>
      <p>I think the proposition is that "the world's most eminent scientists" would build their tests around.... The Reader's Opinion. Determining which existing typefaces are more legible has less to do with scientists vapidly collecting abstract metrics, and more to do with testing typefaces in use: reading speed, comprehension, comfort over long reading times, eye fatigue. It doesn't presuppose dissecting or destroying anything, and it isn't necessarily divorced from what typographers "know" about type. The trick is to get typographers involved in designing tests. That's what Kevin is on to. One of the most frustrating flaws in research to date is wretchedly bad typeface selection. Courier, Curlz, Arial Condensed, Helveeta, etc. are not appropriate for testing in extended reading.</p>
