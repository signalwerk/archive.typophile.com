      <p>Bill, reading is not an ailment.<br>
      I'm wary of analogies used in discussing type and reading, because there's nothing quite like it.<br>
      (I'm sure I use analogies though from time to time, it's hard to avoid.)<br>
      So I won't develop your health analogy by going into the perils of big pharma.</p>
      <p><em>And you can measure how small that is, how it varies with age and acuity, and so on.</em></p>
      <p>You can measure text size, but not as a scientific absolute, in the way that an object's dimensions or mass may be determined.<br>
      Size is a nominal value, determined by the foundry.<br>
      Don't you recall the thread here last year on the definition of the em square?!</p>
      <p>A typeface does not have size.<br>
      A scientific parallel would be fractals, as in "how long is the perimeter of the Jenson "a"?<br>
      It would depend on which particular "a" one chose to measure, the resolution of the medium in which it's set, and the resolution of the measuring device.</p>
      <p>Of course, it's possible to take a particular setting of a particular typeface, vary its size, and see how the variations perform with different age groups.</p>
      <p>Whatever knowledge this reveals, as Peter says, "a decontextualized descision based soley on simple or generic affordance micro-advantages [is] short-sighted."</p>
      <p>Consider these specimens from <em>The Designer's Guide to Text Type</em> (King and Esposito, Van Nostrand Rheinhold).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Janson_4018.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Kennerley_4280.jpg"></div><br>
      I put it to you that the readability of Janson and Kennerley will vary against one another according to leading, amongst other factors.<br>
      Also consider paper stock and, of course, tracking (this book was published in 1980, and man, is that 8 pt. type tight!)<br>
      Then there is line length and paragraph length. And might not one type perform better for rag right setting, the other for justified? And how would they fare when one varies the Flesch index? Would Janson's readability index be better for longer words?<p></p>
      <p>All in all, for an index of typeface readability to be meaningful and useful, a standards manual would have to be published in the form of a type specimen, showing the exact setting which had been tested. For online use, the monitor and operating system would have to be specified, as well as pixel-height and application or file format (hinting varies).</p>
      <p>However, AFAIK, reading tests in laboratories are not conducted using "real" text. For instance, the Moving Window technique restricts the amount of text that is visible to a certain number of letter around a fixation point, and replaces all of the other letters on the page with the letter x. </p>
      <p>I don't believe there would be anything particularly scientific about indexing the readability of typefaces. It would be a simple form of market research. Investigating how reading works is one thing, and of course I support it, but applying readability standards to typefaces (the subject of this thread) is something else.</p>
