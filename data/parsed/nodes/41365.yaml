      <p>John: "For the typical typographic Latin script I’m pretty sure the atom is the letter..."<br>
      Boooooo-ooo-oo-o. See these things at the end of each sentence? . . . that is three atoms separated by two atoms, when . isn't an atom sitting beneath another atom or a molecule ! ? Ooopah, there's them now. When we read we swing along on things that are not letters. Else, the analogy fails any next step along the atomic analogy path, as we've seen, when applied to Latin text, as de-atomized by ClearType and displayed on lower screen resolutions. </p>
      <p>Place a piece of paper, or, another window, over the lower 1/2 of the x-height of this Latin, and read on. There are few atoms you need that disappear, . being one of them. Then, think the 1/2 test again, the other way though — is the letter, horizontally as a unit, and as part of a text, more important, than a unit that begins at the mathematical center of one letter, and ends horizontally in the mathematical center of the next letter? These two units, a whole letter and it's space, and 1/2 of two adjacent letters and the space in between, are of equal value.</p>
      <p>Kevlar: "..all [filtering] options that have been available in MS Reader for many years..."<br>
      Yes but you've seen as well as the rest of us, that it's not your reader running on the average Windows platform that makes a long a read a swing.  How many exodus' need to be executed from the MS environment for higher resolution devices, before a study is done of why the tizzy over text so fizzy? </p>
      <p>John: "Bringhurst wonders if people read differently when all literate people were writers as well as readers"<br>
      There is testament to important literate people who were only readers. But even then, 'History' of anything, is so funny! It makes one seem like an idiot until one states clearly, who one is, then what one's calling people, places and things, of a particular time or span of time, with time being measured in a particular way, along with defining everything else one wants to measure in such a History. We can't do it now...understand how people read, that is, so wondering back...is not completely unlike seeking a black dog on a moonless summer night...in glacier goggles...with a bag overhead and no bacon. But thanks, the unknowable history of readability, makes what some are doing today, more possible to imagine. </p>
      <p>Cheers!</p>
