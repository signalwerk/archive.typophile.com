      <p>Nick, under your definition of Scientism it appears that you might be as "guilty" as I of this "ism" because you appear to appreciate Peter's work -as do I. This is in part because as provided the definition itself is more charged than clear. </p>
      <p>Certainly if by Scientism you mean that the investigative methods of the physical sciences are to be considered not merely potentially applicable; but further that they are priviliged; then I am am as ready as you are to condemn Scientism. Usually an "ism" supposes a privileged position for the thing being mentioned before the "ism". "Ism"s are just dogma, not theory; and they offer false certainty and stunt curiosity. </p>
      <p>This is ( I think what peter is talking about when he says <cite> Perhaps a better way to describe what we should oppose is the illusory belief or expectation that adequate or fitting decisions about the right or best course of action can or should be based principally or exclusively on naked evidential knowledge of cause and effect.</cite>. Peter please disabuse me if I am wrong.</p>
      <p>What worries me almost as much as Scientism though; is is reactionary Anti-scientism. It's no better.   </p>
      <p>Although I am no doubt flogging a dead horse by now I will say again: It isn't necessary that "the investigative methods of the physical sciences" be either subservient, equal or superior. What needed is mutual respect, curiosity and interest among the various "modes of inquiry" as they used to say back at my college during the 80's. All this bristling and fuming at "Science"* in the thread does nothing to help that along. Still from what I have read I wonder if we don't agree agree on far more than we disagree on. We both have significant respect for the caprices of the eye when making fonts for instance. </p>
      <p>Perhaps what is left is mostly a question of how relatively worried or unworried we are about threats from faux-science being wielded by marketing.</p>
      <p>* I am using quotes here because as often as not it wasn't Science per se but the claim that it was.</p>
      <p>John, Bill &amp; Peter thanks for your interesting posts!</p>
