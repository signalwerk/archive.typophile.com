      <p>&gt;And put them together intuitively. That’s design, and it shouldn’t be reduced to a formula.</p>
      <p>Yes, that's design, but its not science. Both can be wonderful in their own way. I think this gap between our views is because you are applying standards of art to science, and so finding science wanting--for the wrong reasons. </p>
      <p>As Peter says, there is a core of truth in what you are thinking, but my view is that your application of that truth is misdirected.</p>
      <p>Art is interested in the whole experience. If a novel reads like a clinical study of a mental problem, it is a failure. The goal of literary works is to convey a whole way of looking at experience, not to analyze particular problems in a way you can act on. Science, by contrast, is focused on specific truths. If these truths cover a wider range of phenomena, all the better, but it's not necessary. The main thing is that you can measure and test empirically whatever you assert.  </p>
      <p>Similarly to art, a good design needs to work holistically, and it's not important to identify or even understand all the ingredients that go into that experience. Much of the creative process is unconscious and intuitive, as you say--and almost all of the reader's. The important thing is the whole experience of the reader. And I agree that it is not a realistic goal for science to understand that whole experience, at least for a very long time to come. </p>
      <p>It is not that either the artistic or the scientific approach is flawed, but rather that each has its strengths and limitations. And as I said, they can learn from each other. I already gave the example of Helmholtz and the Impressionists. But it also goes the other way around. Dostoevsky's novels portrayed emotionally distressed people as thinking in black and white: I am a hero, or no, maybe a villain. I am magnificant, or no, maybe a worm. You are my best friend, or no, my worst enemy. This pattern was picked up by psychologists Freud and Adler, and it seems to have survived into today's cognitive clinical psychology as a marker of distressed thinking. </p>
      <p>So we can honor and learn from both approaches without seeing one as a threat to the other. Yes Newton analyzed gravity, but that doesn't stop people from dancing.</p>
