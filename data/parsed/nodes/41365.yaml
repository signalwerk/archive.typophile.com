      <p><cite>...but typefaces should not be tagged with readability standards, which is where this is leading.</cite></p>
      <p>Exactly. The day scientists hijack typography, then all is lost. There is something rather noble sounding in a scientific method for testing type; however, ultimately such a system would only do a disservice to type and to readers. This scene came to me in a dream:</p>
      <p>The year is 2025. My client proposes that we go with WhatevernextSuperLegible Sans because it has a 5-star legibility rating. Cut to me, pan right as I slit my throat with a rusty razor blade. The End.</p>
      <p>The problem I have with the whole science and type thing is that legibility is just one part of the equation. A good typographer (in fact, even an average one) knows whether a text is legible (and whether the typography is an aid to readability). We don't need science to confirm what we already know. Do we?</p>
      <p><cite>I think the proposition is that “the world’s most eminent scientists” would build their tests around.... The Reader’s Opinion.</cite></p>
      <p>But that doesn't sound like good science. 10,000 subjective opinions does not sum to universal truth; so, either a falsifiable theory of legibility is proposed; or, we simply do as we have done for the past 500 years.</p>
      <p>I'm reminded of those TV commercials for shampoo and skin care treatments: "clinically proven", "scientifically tested", et al. The day a typeface is accompanied by something similar, I'll be reaching for that razor blade.</p>
