      <p>I do think that trying to make a science of legibility is pretty pointless. No doubt someone with a BSc will concoct a grand scientific method. However, I suggest that a better test is the reader's opinion (and your own, if you trust it). Typography is an art, not a science; and I'm much more interested in the opinions of good typographers, than even the most informed opinions of the world's most eminent scientists.</p>
