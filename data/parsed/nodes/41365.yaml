      <p>The definition I am using is the one from my late Uncle J. Ben Lieberman's book ‘Types of Typefaces,’ from 1967:</p>
      <p>“'Legibility' is based on the ease with which one letter can be told from the other. 'Readability' is the ease with which the eye can absorb the message and move along the line."</p>
      <p>Generally as there is progress in science, there is refinement in the meaning of terms, such as the distinction between 'mass' and 'weight' that came in with Newtonian physics. So I'm sure there will be further clarification and refinement in the meaning of 'readability' as more is understood of the reading process. What I am claiming is that there is more to readability than the ease of distinguishing one letter from another. These additional aspects of readability is what I hope and expect there will be progress on. </p>
      <p>Any of the alternative description you put forward may win out, but they will all be about 'readability' in the sense that they involve more than ease of individual letter identification.</p>
