    html: |-
      <p>Nick I think you make some great points about the culture of type and business.</p>
      <p>Despite that I think it would be great if really useful thorough research was done. It could be useful for Scientists, useful for Users, and useful for font makers. I think all of that &amp; more could definitely be done if there was funds and a will. But I am not holding my breath! I am happy and in a way grateful that there is position at MS for Kevin! Were that there were more!</p>
      <p>But the reality is that doing this research isn't a big priority in our Civ. We are very rich civilization and we could be doing much much much more. But we don't. This is party because we already seem to have an embarrassment of riches when it comes to fonts - and it's snowballing! And partly because the purpose of one font vs. the other is, so much of the time that of sensibility &amp; tone served with the usual portion of utility; rather than sheer utility or with utility coming as a first or dominant priority. And because of that I think that the Nick Shinns of the world need not fear too much. Maybe this is a mistaken impression. Maybe there is more pressure as regards utility than I know. Feel free to correct me. </p>
      <p><cite> The efficacy of a design cannot be determined before it is marketed </cite></p>
      <p>This seems mistaken to me. You can learn things ahead of release of a font about it's utility. What you can't know is how well a face is going to sell. Which thing are you getting at here?</p>
      <p><cite> Some however may resist such platitudes, etc...</cite></p>
      <p>I agree that being assimilated into "group thought" would be a bad plan. But that isn't science. The conflation of Marketing &amp; Science isn't helpful, even if one thing may trail on shortly after the other. Once Kevin's work published is in a peer reviewed scientific journal it is cooperative. And when MS decides that Kevin is allowed publish MS funded research then; to that extent, they are genuinely cooperating and contributing to the common good. The key word being extent.</p>
      <p>Also in fairness to Kevin you can't expect his boss' priorities to be the general welfare of western civ or civ in general much as they might like to spin it that way – and have. If it can't be used for competitive advantage then it might not be worth it for them. They need to justify what they do in service to MS. Maybe there can be a bit of overlap as regards the world but that has to be secondary. By the same token you can't expect Nick to point to a competitor's typeface on Typophile. Obviously sheer scale means that it isn't the same. But I think it's the same kind of thing.</p>
      <p>I also think there is also always going to be a cultural/experiential overlay to the results despite even an ideal testing process*. Data collected in OH might be different from NYC might be different from Germany &amp; so on. So it may (or may not be) that you can get solid usable results but the practical application is questionable. </p>
      <p>I feel am not contradicting myself here. Or shading things grey. I am just attempting to parcel things out.</p>
      <p><cite> For actually coming up with creative... </cite></p>
      <p>I think "Creative" isn't for the purposes of this discussion one thing. It is at least two. It is sensibility &amp; tone rather and utility.** Obviously you are right when it comes to selecting for sensibility &amp; tone. But utility is a different animal. It is true that if you can know the purpose a font will be put to, LCD screens or Newsprint or whatever you can use your eyes and go with your educated impression. And that works very well. If it didn't we wouldn't see the advances we have. What I reject in the abstract is the idea that Science can't be effectively added to the team as it were. The "unfair" advantage is simply that MS can afford the services of a scientist. But compared to dropping fonts into the market for free I suspect this is a minor advantage.</p>
      <p><cite> hyping of such type products with scientific or statistical terminology </cite></p>
      <p>Here I agree. Anybody can come up with a list of the most readable fonts ( or a best font) &amp; then drop a white paper that is supposed to prove it. Okay not anybody. But is done in many industries and constantly. You have to be skeptical. And people are, more &amp; more. But being critical <strong>is</strong> science. What sucks is when they decide that it's a good plan to pitch science along with it's superficial trappings. Don't conflate scientific process &amp; hype. Hype doesn't have to attend Science. And when it does they can be separated. It isn't fun, but it can be done.</p>
      <p>Also from what I can tell people have been less &amp; less inclined to accept hype with re: to fonts. I don't think that the reception given to ClearType has been rapturous. It wasn't as bad as the din about Vista but still... </p>
      <p><cite> I agree that it reduces too much, too simplistically, but it would sometimes be handy to be able to point to something easy for non-specialists to understand. </cite></p>
      <p>Science is complicated and grey much of the time. It is really really rare and wonderful when real science can be presented as something easy to understand. Like "you need enough vitamin C to avoid Scurvey so get this citrus in your diet". I don't have much hope that this "something" will be produced for use with clients. And I am even less ceratin that they would make good use of it. I am much more hopeful that many small somethings might be available to type designers*** to make use of. And that we could be more effective at marketing.</p>
      <p><cite>And yet this happens anyway</cite></p>
      <p>"There is one born every Minute" comes to mind. This is why Marketing exists. I agree with Carl. I think you have to shrug it off basically. His "what to do" is certainly more pithy!</p>
      <p>* Assuming such a thing could exist which it cannot.<br>
      ** Maybe you don't mean to include utility but given the context of your use of it it seemed like you did.<br>
      *** Or type making companies</p>
      <p>For those of you that made it this far - sorry about this overly long post.</p>
