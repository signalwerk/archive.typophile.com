  html: "<p>I've been looking for the designer(s) who put together \"The Daily Prophet\" paper for the Harry Potter movies. I'm sure I'm not the first to ask this. I know these guys made the typefaces: <a href=\"http://www.crazydiamond.co.uk/\" title=\"http://www.crazydiamond.co.uk/\">http://www.crazydiamond.co.uk/</a>. That's as far as I could find though.</p>"
