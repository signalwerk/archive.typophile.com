    html: <p>@omashuisje or maybe Turido, what do you think? (now let's start playing with names for finding one more appropriated... :) ) i'm avoiding Tourido or Torido, because it may sound like 'bull' on iberic/latinamerican languages... (and i wanted to avoid this similarity, since i'm against bullfights, and i really don't want to see my typeface used on bullfight posters just because its name... ;) ) - anyway, suggestions for the name are welcome! :)</p>
