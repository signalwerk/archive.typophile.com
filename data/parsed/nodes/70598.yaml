      <p>Great start. Some quick thoughts: </p>
      <p>a-the top arm seems a bit short<br>
      g-the bottom seems a little out of character with the rest. It probably shouldn’t turn back upwards, but level out instead, before going down.<br>
      r-the arm should start a bit lower on the stem<br>
      t-I would extend the cross bar a little to the right</p>
