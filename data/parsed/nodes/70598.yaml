      <p>@omashuisje yes, my english is not that good - my idea were to relate a special kind of bird, very common on the neibourhood on all places i lived which were a reference to its proportions, as well for having part of 'Didone' on its name: <a href="http://www.google.pt/images?um=1&amp;hl=pt-PT&amp;client=ubuntu&amp;channel=cs&amp;tbs=isch:1&amp;sa=1&amp;q=turdido+bird&amp;aq=f&amp;aqi=&amp;aql=&amp;oq=&amp;gs_rfai=" title="http://www.google.pt/images?um=1&amp;hl=pt-PT&amp;client=ubuntu&amp;channel=cs&amp;tbs=isch:1&amp;sa=1&amp;q=turdido+bird&amp;aq=f&amp;aqi=&amp;aql=&amp;oq=&amp;gs_rfai=">http://www.google.pt/images?um=1&amp;hl=pt-PT&amp;client=ubuntu&amp;channel=cs&amp;tbs=i...</a> - well, maybe i can disguise this name enough if i rename it to 'Tourdido' ?</p>
      <p>@traviskochel , @StevenAcres - thank you both! :) - anyway i fixed 'a' and 'g' indeed, and i'll show it later here. On 'a' i really wanted a short arm (like some carolingian calligraphy) and a narrow bowl height (like Garamond), and i'm also sensible that it looks weird and dissonant among the whole, and what i'm trying to do is doing small changes could increase some harmony, and it seems having an horizontal (orthogonal as almost everything else, as needed on that 'g' tail turnback) upper bowl stroke. And thanks about those 't' and 'r' issues i didn't notice about.</p>
    html_clean: |-
