  html: |-
    <p>Hi,</p>
    <p>Are you a pro with sketches/doodles lying around you wouldn't mind sharing/selling? A budding type designer with a promising font, but not wanting to take the time to digitize it and take it to market?</p>
    <p>I'm getting started in digitizing files for DIY type patterns/projects/scrapbooking etc to be sold online. Files do NOT have to be rendered as vector or be an actual working font. </p>
    <p>I cannot pay much as I'm just getting started, but would love to get a conversation going with interested artists. Please include samples of your work and what you're expecting in terms of payment and licensing allowances.</p>
    <p>Love to hear from you!</p>
    <p>You can email me at <a href="mailto:chgotom23@aol.com">chgotom23@aol.com</a>.</p>
    <p>`Tommaso</p>
