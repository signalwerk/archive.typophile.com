  html: "<p>type.co.uk newsletter // may 2003 <br> <br>- NEW RELEASES FROM ALIAS <br>Six brand new families have just been added to the wonderfully diverse Alias Library, home to favourites such as 'Elephant', 'Sister' and 'Metsys'. All fonts are available to view and buy online by following these links: <br>Perla, a display typeface derived from Didot: <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/x013320000\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/x013320000</a> <br>Aminta, an eclectic slab serif in five weights: <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/x013317000\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/x013317000</a> <br>plus italics: <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/x013318000\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/x013318000</a> <br>Intimo, a monospaced dot-matrix font in two variations: <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/x008372000\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/x008372000</a> <br>Civility, a monoline script derived from copperplate calligraphy and handwriting: <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/x013319000\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/x013319000</a> <br>Key, a wedge serif in three weights with dynamic form: <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/x008373000\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/x008373000</a> <br>Sylvia, a rounded sans in five weights with italics: <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/x013322000\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/x013322000</a> <br> <br>In addition to these fonts we have added a new Alias Collection PDF to our download area: <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/fwks/info/pdf\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/fwks/info/pdf</a> <br> <br>- AMAZING DIGITAL CAMERA OFFER: 129 GBP ex. VAT &amp; carriage <br>Buy the MegaPix V4 digital camera for a price that puts cameras of a similar spec (4x digital zoom, 4.0 M resolution interpolation, USB etc) into the shade. Perhaps you'd like to buy a few to offer as incentives or bundle it with other products of your own. To purchase and view a full spec follow this link: <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/fwks/products/camera\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/fwks/products/camera</a> <br> <br>- NEW VIRUS ALERT! <br>No, not that sort of virus, we're talking about Jon Barnbrook's Virus foundry and his latest typographical masterpiece called 'Infidel'. Says Barnbrook: \"Infidel is a font based on letterforms found in Christian illuminated manuscripts and bibles from the Middle Ages. These idiosyncratic forms, some beautiful, some ugly, have been redrawn in a contemporary way that we hope you find interesting.\" Infidel is available as a package of four different versions which can be mixed together. Buy and download now. <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/x013406000\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/x013406000</a> <br> <br>- CHEVIN ITALICS NOW AVAILABLE <br>G-Type's new rounded sans 'Chevin' now has accompanying italics in all six weights to boost its appeal still further. A truly wonderful blend of elegance and functionality. Download the updated PDF and purchase the family online: <br><a href=\"http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/x013307000\" target=\"_blank\">http://www.fontworks1.type.co.uk/cgi-bin/fontworks2/x013307000</a> <br>Chevin PDF download: <br><a href=\"http://www.fontworks1.type.co.uk/fontworks2/downloads/chevin.pdf\" target=\"_blank\">http://www.fontworks1.type.co.uk/fontworks2/downloads/chevin.pdf</a> <br> <br>- UNDT TYPEFAECES: MORE THAN A PLAY ON WORDS <br>Introducing our latest signing, </p>"
