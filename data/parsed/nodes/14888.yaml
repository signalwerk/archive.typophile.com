    html: |-
      <p>Apex is very good. If you have not yet compared to other squared-off sans, you want to compare these:</p>
      <p><a href="http://fontbureau.com/fonts/Stainless" rel="nofollow">Stainless</a>, which has a big variety of widths and weights for magazine work. </p>
      <p><a href="http://www.processtypefoundry.com/typefaces/klavika/index.html" rel="nofollow">Kalvika</a>, my favorite at the moment,</p>
      <p><a href="http://houseindustries.com/index.php?page=showfont&amp;id=24&amp;subpage=viewfonts" rel="nofollow">Simian</a>, which is very well done but rather wide</p>
      <p>and the new <a href="http://www.stormtype.com/elektra.html" rel="nofollow">Elektra</a></p>
      <p>also Sophisto at <a href="http://www.macrhino.com/" title="http://www.macrhino.com/">http://www.macrhino.com/</a>.</p>
      <p>I know you can get PDFs at the sites for Stainless, Klavika and Elektra and Sophisto at the sites, and I'm sure more from all the foundries. </p>
      <p>I'd be interested in your choice and why you made it.</p>
