    <p>Just looking for a few quick opinions and critiques on this. It's a logotype for a diving school and is aimed at beginner scuba divers. The project is a very small web project for which the client needed an identity too. Budget is tiny (mainly for web part), so have no room for multiple iterations and variants.</p>
    <p>Thanks in advance!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/aquaman-diving-logo_3725.jpg"></div><p></p>
