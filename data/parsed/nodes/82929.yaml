    html: |-
      <p>I got the helmet thing, which made me feel like it was a bit more serious diving, rather than casual/leisure diving, but the name seems playful enough to go the other way.</p>
      <p>Maybe it is my taste, but I often like to see the subtitle in a complimentary font, in this case simpler sans a bit smaller, but still echoing the overall structure of the main font.  </p>
      <p>As for the bubbles, they feel too geometric or something.  Have you tried to make the bubbles form the counter of the Q?  or even just try them as solid circles instead of outlined?  Not sure, but you are close to something very nice considering the time and budget.  Good stuff!</p>
    html_clean: |-
