    html: |-
      <p>I have a composite management script that Ben Kiel wrote for us. It dumps and fuses composite glyph data to and from a semicolon-separated text list, of the format</p>
      <p>[glyph name];[width];[base component];[x offset];[y offset];[2nd component];[x offset];[y offset];...</p>
      <p>e.g.</p>
      <p>aacute;1465;a;0;0;acutecomb;1435;0</p>
      <p>[I now always use zero-width 'comb' accents for composites, not spacing accents, as the composites then match mark postioning offsets and can be leveraged to build GPOS data.]</p>
      <p>Being able to dump and fuse composite info in this format makes it easy to define or edit composite glyphs in a spreadsheet.</p>
      <p>We paid Ben for the development of this script, but it is released under the GNU open source license. Contact Ben for more info: <a href="http://benkiel.com/" title="http://benkiel.com/">http://benkiel.com/</a></p>
