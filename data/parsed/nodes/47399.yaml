      <p>Just create the lowercase and caps and the diacritics. Then type the string of names of each glyph seperated by a space in the "Generate Glyph" window and hit return.</p>
      <p>Also, for smallcaps, you can use this (if you named all your smallcaps witha ".sc" suffix:</p>
      <p>A.sc+|acute=Aacute.sc A.sc+|breve=Abreve.sc A.sc+|circumflex=Acircumflex.sc A.sc+|dieresis=Adieresis.sc A.sc+|grave=Agrave.sc A.sc+|macron=Amacron.sc A.sc+|ogonek=Aogonek.sc A.sc+|ring=Aring.sc A.sc+|tilde=Atilde.sc C.sc+|acute=Cacute.sc C.sc+|caron=Ccaron.sc C.sc+|cedilla=Ccedilla.sc D.sc+|caron=Dcaron.sc E.sc+|acute=Eacute.sc E.sc+|breve=Ebreve.sc E.sc+|caron=Ecaron.sc E.sc+|circumflex=Ecircumflex.sc E.sc+|dieresis=Edieresis.sc E.sc+|dotaccent=Edotaccent.sc E.sc+|grave=Egrave.sc E.sc+|macron=Emacron.sc E.sc+|ogonek=Eogonek.sc G.sc+|commaaccent=Gcommaaccent.sc I.sc+|acute=Iacute.sc I.sc+|circumflex=Icircumflex.sc I.sc+|dieresis=Idieresis.sc I.sc+|grave=Igrave.sc I.sc+|macron=Imacron.sc I.sc+|ogonek=Iogonek.sc K.sc+|commaaccent=Kcommaaccent.sc L.sc+|acute=Lacute.sc L.sc+|caron=Lcaron.sc L.sc+|commaaccent=Lcommaaccent.sc N.sc+|acute=Nacute.sc N.sc+|caron=Ncaron.sc N.sc+|commaaccent=Ncommaaccent.sc N.sc+|tilde=Ntilde.sc O.sc+|acute=Oacute.sc O.sc+|circumflex=Ocircumflex.sc O.sc+|dieresis=Odieresis.sc O.sc+|grave=Ograve.sc O.sc+|hungarumlaut=Ohungarumlaut.sc O.sc+|macron=Omacron.sc O.sc+|tilde=Otilde.sc R.sc+|acute=Racute.sc R.sc+|caron=Rcaron.sc R.sc+|commaaccent=Rcommaaccent.sc S.sc+|acute=Sacute.sc S.sc+|caron=Scaron.sc S.sc+|commaaccent=Scommaaccent.sc T.sc+|caron=Tcaron.sc T.sc+|commaaccent=Tcommaaccent.sc U.sc+|acute=Uacute.sc U.sc+|circumflex=Ucircumflex.sc U.sc+|dieresis=Udieresis.sc U.sc+|grave=Ugrave.sc U.sc+|hungarumlaut=Uhungarumlaut.sc U.sc+|macron=Umacron.sc U.sc+|ogonek=Uogonek.sc U.sc+|ring=Uring.sc Y.sc+|acute=Yacute.sc Y.sc+|dieresis=Ydieresis.sc Z.sc+|acute=Zacute.sc Z.sc+|caron=Zcaron.sc Z.sc+|dotaccent=Zdotaccent.sc C.sc+|circumflex=Ccircumflex.sc C.sc+|dotaccent=Cdotaccent.sc G.sc+|circumflex=Gcircumflex.sc G.sc+|breve=Gbreve.sc G.sc+|dotaccent=Gdotaccent.sc H.sc+|circumflex=Hcircumflex.sc I.sc+|tilde=Itilde.sc I.sc+|breve=Ibreve.sc I.sc+|dotaccent=Idotaccent.sc J.sc+|circumflex=Jcircumflex.sc L.sc+|dotaccent=Ldotaccent.sc O.sc+|breve=Obreve.sc S.sc+|circumflex=Scircumflex.sc U.sc+|tilde=Utilde.sc U.sc+|breve=Ubreve.sc W.sc+|circumflex=Wcircumflex.sc Y.sc+|circumflex=Ycircumflex.sc S.sc+|cedilla=Scedilla.sc</p>
