    html: |-
      <p>You can also use Python which is more powerful and flexible.<br>
      The following script sets anchors and places caps and small letters diacritics in the right position. It is very simple to make changes in the anchors positions.</p>
      <p>With Robofab and Font Tools installed:</p>
      <p># Building Accented Glyphs for PS1 font</p>
      <p>from robofab.world import CurrentFont</p>
      <p># accentBuilder lives in robofab.tools<br>
      from robofab.tools.accentBuilder import AccentTools</p>
      <p>font = CurrentFont()</p>
      <p># a list of accented glyphs that you want to build<br>
      myList=['Ntilde','ntilde','aacute', 'agrave', 'acircumflex', 'adieresis', 'atilde', 'aring', 'eacute', 'egrave', 'ecircumflex', 'edieresis', 'iacute', 'igrave', 'icircumflex', 'idieresis', 'oacute', 'ograve', 'ocircumflex', 'odieresis', 'otilde', 'uacute', 'ugrave', 'ucircumflex', 'udieresis', 'Adieresis', 'Aring', 'Agrave', 'Atilde', 'Acircumflex', 'Aacute', 'Eacute', 'Ecircumflex', 'Edieresis', 'Egrave', 'Iacute', 'Icircumflex', 'Idieresis', 'Igrave', 'Odieresis', 'Otilde', 'Oacute', 'Ocircumflex', 'Ograve', 'Udieresis', 'Uacute', 'Ucircumflex', 'Ugrave', 'Scaron', 'scaron', 'Yacute', 'yacute', 'Zcaron', 'zcaron', 'ydieresis', 'Ydieresis']</p>
      <p># start the class<br>
      at=AccentTools(font, myList)</p>
      <p># clear away any anchors that exist (this is optional)<br>
      at.clearAnchors()</p>
      <p># add necessary anchors if you want to<br>
      at.buildAnchors(ucXOffset=20, ucYOffset=40, lcXOffset=15, lcYOffset=30)</p>
      <p># print a report of any errors that occured<br>
      at.printAnchorErrors()</p>
      <p># build the accented glyphs if you want to<br>
      at.buildAccents()</p>
      <p># print a report of any errors that occured<br>
      at.printAccentErrors()</p>
    html_clean: |-
