    <h2><a href="/node/50375" title="No.1">No.1</a></h2>   <p>Hi everyone! My name is Ngoc, and as of this week I’m the newest member to the Typophile/Punchcut team. I’m really excited about working here and just as excited about posting to the Typophile blog. I’m looking forward to sharing with everyone interesting typography, graphic imagery, and stories I’ll come across on the internet or around San Francisco. There’s plenty of great work and ideas to be shared, and I think the Typophile community is a great place to do it.</p>
    <p></p><div class="imageWrap"><img src="/files/hello_blog_3999.gif"></div><p></p>
