      <p>It will probably be very hard to find topical display fonts with extensive open-type features.  They're most often used for posters or advertising or headers and such, with little need for alternates or even most punctuation.</p>
      <p>In a paintbrush style, the closest I've seen is Norwegian Cruise Lines' proprietary "Freestyle" (no longer used), which had some alternates and ligatures. I don't believe that they were incorporated as open-type features; for example, an alternate 't' was in the single dagger position.</p>
      <p> - Herb</p>
