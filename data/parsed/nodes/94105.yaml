    <p>I'm looking for a heavy, hand-painted brush style font. </p>
    <p>The best I've come across so far is <a class="freelinking external" href="https://web.archive.org/web/20141123082843/http://www.myfonts.com/fonts/hanoded/plakkaat" rel="nofollow">Plaakkat</a></p>
    <p>The problem with this font is that there are not contextual alternates. This has obvious limitations if an organic hand made look is desired. </p>
    <p>Any font suggestions would be more than welcome.</p>
    <p>Cheers,</p>
    <p>J.</p>
