      <p>You found NCL's Freestyle 2.0, which is nothing like their original Freestyle!<br>
      Here's a small sample of the original:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/NCLFreestyle_3904.jpg"></div><br>
      The alternates in that font are:<br>
      M, d, f, h, i, k, l, m, n, o, r, s(2), t, u(2)<br>
      and ligatures:<br>
      th er oo<br>
      Unfortunately, I doubt that it would be publicly available, but it never hurts to ask.<p></p>
