      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/schizotype/pastiche-brush/" rel="nofollow">Pastiche Brush</a> might be a bit too lively for text setting, but depending on how out-there you want it too look, could be a good choice. It has plenty of alternates, and start and end forms too. Just make sure contextual alternates are on. They don't show correctly on the MyFonts testdrive unfortunately but they do work. Honest.<br>
      Thanks for looking,<br>
      Dave</p>
