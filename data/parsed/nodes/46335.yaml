      <p>KNOWLEDGE-IN-ACTION<br>
    A graphic design research symposium</p>
    <p>Wednesday 17 September 2008<br>
    1.30pm–5.00pm</p>
    <p>The symposium has two main aims:<br>
    (a) to demystify the process of embarking on a research degree;<br>
    (b) to encourage PhD level research in graphic design, and its related<br>
    subject areas.<br>
    The event presents an opportunity to hear from speakers who have<br>
    developed a<br>
    career in research, education and practice, since completing their PhD.<br>
    Reﬂecting on their experience, they will discuss a range of academic and<br>
    non-academic issues, talking informally about topics such as: the impact of<br>
    doctoral study on their career; the integration of research, education and<br>
    practice; developing research initiatives; and the balance between<br>
    deliberate and intuitive practice.</p>
    <p>WHO WILL THIS BE OF INTEREST TO?<br>
    Those interested in pursuing a career in research; final year and<br>
    post-graduate students in graphic design and related fields of interest;<br>
    supervisors and potential supervisors; managers in Higher Education;<br>
    practising researchers and designers.</p>
    <p>ADMISSION IS FREE<br>
    But all attendees will need to register their intention to come before<br>
    Monday 8 September—numbers will be limited.&lt;<!--
