      <p>“<cite>Need</cite>” have a solid understanding of grammar? Probably not, but editors and designers both make mistakes. Having a basic idea of what the other guy’s job is about can help keep them to a minimum. Having a CMS on hand is even better. Knowing it intimately is better still.</p>
      <p>And that being said, watch out for egos. No one likes to hear that they’ve contributed errors, even if there’s still time to fix them.</p>
