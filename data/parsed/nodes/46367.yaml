    <p>Does a typographer <em>need</em> to have a solid understanding of grammar?</p>
    <p>I think so. I used to work as an editorial assistant for a number of magazines, and now that I am doing graphic design, I am seeing the importance of marrying my knowledge of these two “elitist” trades.</p>
    <p>I am not a grammar pro, and I know I have lots to learn in regards to type; still I think that applying these knowledge bases in tandem makes one a better type user.</p>
    <p>What do you think??</p>
    <p>Evan<br>
    <a href="https://web.archive.org/web/20080907012623/http://evanmade.com/">evanmade.com</a></p>
