  html: "<p>Eben's thread on <a href=\"http://typophile.com/node/28777\" rel=\"nofollow\">ligatures &amp; readability</a> got me to thinking. It seems (correct me if I'm wrong) that there is little reliable research on the mechanics of reading and hardly anything exhaustive. My question is what is needed to provide such research (besides money)? I'm thinking a custom built suite of typefaces that allows researchers to isolate particular variables as best as possible. And of course reading environment is a factor. What environments should reading be tested in? What are the questions that need to be addressed? But before putting the cart before the horse, i guess i should go back to: what are the proposed goals of reading research? what are the pressing issues that need to be covered? why do we need research on reading? A lot of questions, hopefully we can get some answers here (and i'm sure a whole other set of questions...) In short, I guess i'm wanting to hear your proposals about the aims and methods of a reading research regimen.</p>"
  html_clean: "<p>Eben's thread on <a href=\"/node/28777/\" rel=\"nofollow\">ligatures &amp; readability</a> got me to thinking. It seems (correct me if I'm wrong) that there is little reliable research on the mechanics of reading and hardly anything exhaustive. My question is what is needed to provide such research (besides money)? I'm thinking a custom built suite of typefaces that allows researchers to isolate particular variables as best as possible. And of course reading environment is a factor. What environments should reading be tested in? What are the questions that need to be addressed? But before putting the cart before the horse, i guess i should go back to: what are the proposed goals of reading research? what are the pressing issues that need to be covered? why do we need research on reading? A lot of questions, hopefully we can get some answers here (and i'm sure a whole other set of questions...) In short, I guess i'm wanting to hear your proposals about the aims and methods of a reading research regimen.</p>"
