      <p>[there are too many things to address in previous post, and I like a lot of what is said in many of them, including those of the 'new' voices]</p>
      <p>[Chris] 2 sets of variables to test</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/map_of_reading_4174.jpg"></div><p></p>
      <p>Eric I am suggesting approaching the field with my type-craft-generated attunements and biases, and elaborating them in perceptual processing terms to the point where I can test if the need to be rejected. </p>
      <p>Nick, the important part of science is not the numerical analysis, but what conclusions are drawn from it. As you insist, there are many things that can't be effectively quantified (comprehension; gestural atmospheric import; readability), but you can gauge--sometimes numerically--some of their manifestations, or some of their determinants. The manifestations have to be indicative of something, so we abstract and study possible determinants.</p>
      <p>Eben, I think plain old reading speed is too crude a metric for gauging the effects of manipulating typographical micro-variables, even it over the space of a large text read in one sitting my manipulation reduces the time it takes to get through the passage. I have no way of telling whether all the other possible things that contribute to reading speed have been controlled. The types of tests I'm trying to get a bead on involve fourier transforms, gauging the advantage to speed of recognition of various kinds of 'priming', assessing the impact of various manipulations on the magnitude of the Word Superiority Effect, ideal observer modeling of neuromechanical flow-through where lateral interference is represented and slot processing is allowed or prohibited.</p>
      <p>The best measures of typographical success are probably anecdotal. Other than that all we can do is try and pinpoint what part of the map of reading varying this or that addresses.<br>
      ____________________</p>
      <p>Comments about my graphic:<br>
      1) The competant reader has abilities at every level<br>
      2) Some levels are more impacted by culture, education, familiarity and sensitivity than others<br>
      3) Variations at every level affect all the others in some degree over some extent, and they affect the sustainability and satisfactoriness of our engagement with the text over time.</p>
      <p>When we say x improves readability I want to know what is meant in functional anatomical or perceptual-mechanical or gestural atmospheric terms.</p>
