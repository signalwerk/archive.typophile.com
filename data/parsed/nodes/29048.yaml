      <p>Chris: I don't "remove meaning from the act of perception of forms". The graphic merely isolates relevant areas of functioning. I claim that encapsulated with the neural code for the visual wordform "x" is a meaning, or 'node' in our personal construct system, as well as a spelling and a phonetic signature. At each visual wordform resolutional event a node or meaning is directly accessed and placed (as it were) within the sense-following stream.</p>
