      <p><em>The idea here would be to develop an understanding of the perceptual and neuro-physical mechanics of reading that is detailed enough to make plain why the things that typographers and type designers know are critical or worth attending to, are indeed critical and worth attending to, like spacing.</em></p>
      <p>That makes a lot of sense, but perhaps the question should be framed differently: one should be completely open to the possibility that "the things that typographers and type designers know are critical" may not be critical after all. It's difficult enough to conduct good research without biases; it's almost impossible if the researcher is bent on proving his beliefs to be true.</p>
      <p><em>But what has intrigued me most about this thread is not the pure theory or the atomization of type factors - it’s the ideas people have had about alternatives to pure speed for measuring type success.</em></p>
      <p>Efficiency and effectiveness (or efficacy) are different things, but I've been wondering how effectiveness can be measured. Surely measures of comprehension and retention have a lot more to do with the reader's familiarity with the subject and all sorts of cognitive processes unrelated to visual processing?</p>
      <p><em>I don’t believe that a physiological understanding of reading has more than a very oblique theoretical relevance to type design. Numerical method is most useful in product development and testing, ie technology, not in providing general scientific principles that will improve or validate the process of everyday typography or type design.</em></p>
      <p>What method, then, would be appropriate for such an investigation? Ethnography? Wouldn't the goal be to arrive at universal conclusions? In the end, if the goal is to produce generalizable conclusions, one cannot run from statistics and numbers.</p>
      <p><em>it should be type designers (experienced, thorough, open-minded ones), not students, brain scientists or linguists who develop them.</em></p>
      <p>But perhaps brain scientists and/or linguists should be allowed to test them? Type designers would certainly be better equipped to choose what factors should be isolated and tested. But scientists from other fields would perhaps be in a better position to analyse how those factors actually affect reading.</p>
