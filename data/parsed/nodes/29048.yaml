      <p><cite>decipher the letterforms and words (reading) or an inability to understand what the author is trying to say</cite></p>
      <p>Chris, that's a really interesting idea. William, nice list!</p>
      <p>Here are some more possible variables </p>
      <p>- paper &amp; ink combinations ( how is that for exponential factors? - actually there aught to be a way of contrasting things without going too crazy )<br>
      - Serif shape<br>
      - contrast with ground/paper<br>
      - Reverse color ( white on black )</p>
      <p>Nick had some solid ideas about this ina thread I connot seem to dig up now. Anybody else know where it is? </p>
      <p>Ultimately though I do think that there is some purpose ( efficency if nothing else) in doing tests which are designed to see what kind of meta theory might be best at describing the mechanisms at work in reading. It seems to me that david berlow said something to the effect that whatever theory is used to desribe what happens in reading latin characters had better have some way of dealing with arabic &amp; chinese too or it was going to be sub-standard. I tend to agree. ( ...If that's an acceptable paraphrasing and my memory isn't fooling me utterly that is.) I would for instance, like it very much if some of Peter's theories could be tested.</p>
      <p>Ultimately what I am personally curious about is if small subtle contextual variations in lettershape and spacing might be helpful. Erik Van Blockland made a typeface that varied randomly called Kosmik. Of course because Kosmic is psudorandom or even super-random in that it avoids the sameness that randomizing can produce. So.... it *is* contextual. But the contextual I am interested in is variation to be sure but based on attempting to get better Notan &amp; letter relationship rather than variation for it's own sake. Sometime soon I will start a thread about this again. I am assembling lots of bits &amp; pieces at the moment! All of this is to say I would like this idea tested one day too.</p>
      <p>But what has intrigued me most about this thread is not the pure theory or the atomization of type factors - it's the ideas people have had about alternatives to pure speed for measuring type success. In my view, that question is probably the richest vein to be mined of all.</p>
      <p>Luca(as) where are you?</p>
