      <p>All the inquiry into fonts would do is create substantiated, predictable facets to use when designing fonts. NO harm in having that in my toolbox, when I glue something together around the house, I appreciate science leading to a consistent range of dry-times based on the environment.</p>
      <p>So much of these proposed scientific inquiries are based on legibility=speed=succes. This suggests a hunt for "the one true font". Yuck-that explains some of the designer resistince. There are a lot of other factors we all might be intersted in. Do certian existing fonts lend themselves to increased comprehension of exact data? Of overall comprehension and recall? People often visualize words to recall spellings, dates, etc. What fonts do the mind use? Are there fonts that purposely slow down reading speed and does that have a use? Is kerning simply aesthetic, or can it alternate kerning profiles predictably change the meaning of a message?</p>
      <p>Do people learn to write foreign laguages better in certain typefaces? Can they? Some faces are inappropriate for body text, while similar ones are great. Is there exact calculatable figure predicting where the change is?</p>
      <p>Then there is the idea of letterforms themselves. Would a font where each letter contextually joined to the "starting spot" of the next letter help? Arrowed serifs, non-baseline oriented fonts? These all sound like wacky ideas, but without numbers to confirm that we run on gut.</p>
      <p>There are dozens more of ideas, and new ones will spawn from research. Sounds like something for a University to have fun with. For a long time. Remember, we still down even know much about a cat's purr.</p>
