      <p>&gt;Theoretically, improved type design and paragraph layout should have the same impact on easy or difficult text. </p>
      <p>Yes, this seems reasonable to me. However, what I am thinking of is a threshold kind of effect may be operating. I had suggested that one might measure reading comfort (actually discomfort) by decline in comprehension with time. My suspicion is that what John Hudson calls 'readerability' can compensate a for a lot of less than optimal conditions by an increased investment of mental effort. </p>
      <p>Thus less than optimal type design or layout would barely show up or not at all in a short test--it would be wiped out by increased mental effort of the subject. But if the person were pushed by reading relatively difficult content for a longer period, then you would see a sharp decline of comprehension--and perhaps speed as well--at markedly different times for better and worse conditions, when mental fatigue set in. </p>
      <p>Do you see what I am getting at Kevin? Does it make sense?</p>
