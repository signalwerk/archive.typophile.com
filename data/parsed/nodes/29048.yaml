      <p>Chris asked:<br>
      “My question is, how do we know when saccades are duplicated or regression occurs if this is due to inability to decipher the letterforms and words (reading) or an inability to understand what the author is trying to say. I hope Kevin can clarify what he said because I may not have gotten it right.”</p>
      <p>There is a lot of ongoing research investigating the cause of saccades, including developing models trying to predict when they are going to occur. Some regressive saccades are caused by content problems. For example, if I read “The horse raced past the barn fell”, I can guarantee a regressive saccade after reading the word fell. It’s less likely to happen if I write “The horse that was raced past the barn fell” and even less likely if I precede it with a story about two horses that were raced down different paths, one near a barn. Other regressive saccades are likely caused by word level problems. In some of our eye tracking studies looking at ClearType versus b/w rendering we have seen reductions in regressive saccades indicating that letter quality can improve the mechanics of reading.</p>
      <p>Cheers, Kevin</p>
