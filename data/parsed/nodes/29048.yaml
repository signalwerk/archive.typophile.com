      <p>Chris (&amp; everyone else),</p>
      <p>You make the point that Stradivari was a master craftsmen that achieved near-perfection not by mathematical calculations or by reading scientific treatises on violin engineering. He just "played it by ear", quite literally.</p>
      <p>First of all, I would remark that his method (according to you -- I don't really know anything about Stradivari) is used even in computer science. Some problems, particularly complex systems (<a href="http://typophile.com/node/28777/164470" title="http://typophile.com/node/28777/164470">http://typophile.com/node/28777/164470</a>), have so many variables that they cannot be solved by means of equations -- or at least not without ridiculous amounts of time and processing power. Or the variables may be known, but exactly how they interact (i.e. the equations) is not known.</p>
      <p>In such cases, solutions may be worked out by trial and error: knock, carve, knock. For instance, when the equations used by a certain encryption method are very complex and too many variables (such as the original characters) are unknown, the computer may try to crack a password by attempting different combinations sequentially.</p>
      <p>Another approach in computer science is to use <a href="http://www.cs.berkeley.edu/~russell/aima1e/chapter02.pdf" target="_blank" rel="nofollow">swarms of "intelligent" agents</a>: each agent, which in a way represents a variable in a complex system, is programmed to behave in a certain way; the agents are left to fend for themselves, and the results are recorded.</p>
      <p>The reason, then, that almost no things human -- such as reading -- can be solved or controlled through "pure science" is because there are too many variables and equations, many of them unknown. What the master craftsman does is use his experience -- those missing variables and equations -- and the trial-and-error methodology to create solutions. This is a task that can probably never be accomplished through "pure science", simply because all the variables and equations known by all master craftsmen (and women) will probably never be recorded and codified in a usable way.</p>
      <p>However, the knowledge and experience of the master craftsman has limitations, in the sense that those variables and equations in his brain are specific to his culture, habits etc. While scientific research is no substitute for the master craftsman and woman, it can certainly help them make better decisions and judgements, and even try different solutions that go against their personal beliefs.</p>
      <p>Is this more or less what you were saying?</p>
