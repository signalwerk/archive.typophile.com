      <p>Q: Is it better to conduct studies with easy or challenging content?</p>
      <p>Theoretically, improved type design and paragraph layout should have the same impact on easy or difficult text. Improved type design and paragraph layout work to improve the word recognition process, and easy word recognition is beneficial no matter what the content. If you were interested in organizational factors like providing good headings, then this is certainly more relevant to the more challenging text.</p>
      <p>In practice it’s difficult to find appropriate content difficulty. If you use content that is too challenging (i.e. having an expert in literature read a physics textbook) then you’ll find that the time to read will increase dramatically, and reading speed differences will be determined more by the number of times a person needed to reread long passages than by any typographic differences. If content is too easy (i.e. having a professor of physics read a high school physics textbook) then the reader is likely to scan the text rather than truly read it.</p>
      <p>Another challenge is that reading performance differs from person to person, so I prefer to have the same person read text from each of the typographic conditions being examined. This means that more than one sample of content is necessary, and it’s desirable to have them of equal difficulty so it doesn’t impact the results (though counterbalancing the passages reduced this problem).</p>
      <p>Every study is open to criticism, so I think it’s best to do something that’s good enough and document what you did.</p>
      <p>Cheers, Kevin</p>
