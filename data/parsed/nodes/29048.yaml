      <p>My first question would be: Is there a problem with reading? Maybe there isn't?</p>
      <p>The difficulty is separating the reading part from the comprehension part. Kevin Larson said in a recent post that he thinks the longest delay in reading is the comprehension part. My question is, how do we know when saccades are duplicated or regression occurs if this is due to inability to decipher the letterforms and words (reading) or an inability to understand what the author is trying to say.  I hope Kevin can clarify what he said because I may not have gotten it right.</p>
      <p>ChrisL</p>
