      <p>Scientists have been studying the Stradivarius violin for decades, trying to figure out why it sounds so good and to see if modern technology can replicate the instrument design using all the modern marvels we have available.  So far, they have failed.<br>
      The technology used by Stradaveri was knocking on wood—literally. He would carve a basic shape with simple hand tools and knock on the wood in various places, listening for that certain sound that his ears could recognize as "correct".  He would carve and knock, carve and knock at his slab of wood until it was right. Scans and X-rays instruments reveal that no two are alike in modulation of thickness.  The assumption is that each piece of wood needed its own variation in thickness to resonate sound properly. Stradaveri used his ears and knuckles in the same way that punch cutters used their eyes and smoke tests.  Tinker a bit then look then tinker some more.  The human mind and senses are just incredible. Sometimes we might just have to say, in this hi-tech world, that humans have abilities which are not reproducible by machine and this is "OK"!<br>
      Should scientists close up shop? Absolutely not! But once in a graet great, it is OK to just cry "uncle".</p>
      <p>ChrisL</p>
