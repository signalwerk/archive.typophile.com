      <p>I don't think the problem is so much what to test, so much has having good measures to test them. Stuff that seems obvious to typographers and type designers it seems is difficult to test for. So what is needed are measures in addition to reading speed, which will more readily and sharply discriminate better and worse readability. I have proposed a measure of reading comfort: how fast comprehension decreases with time. Kevin says he is proposing another new measure--I guess in the new Typo article. What is it? </p>
      <p>Another way of improving testing besides new measures is to make better use of marginal readers, such as those learning to read, and those with reading difficulties, or 'dyslexia', and compare these to expert readers. Here what is important is to have good theories of the learning-to-read process and of kinds of reading difficulties. That will help define good tests. The variations in good and bad type may be magnified for these marginal readers, though the relationships may be complex and not straightforward. </p>
      <p>As to what to test, some factors that come to mind are:</p>
      <p>1. Type size--as defined by x height. 2. Weight--percentage of black to white 3. Serifs--presence or absence. 4. Extenders--effect of various heights. 5. Leading--amount of leading at a given x-height (and influence of serifs, extenders). 6. Letter spacing--amount, evenness. 7. Measure or line length. 8. Counter size--and ratio of counter size to spacing. 9 Word spacing 10. How these factors vary with optical size.</p>
      <p>These all interact, so you would also have to test for combinations.</p>
