      <p>Chris,</p>
      <p>Not a problem with reading; a problem with our understanding of what makes reading happen. We want to know so we can influence the meaningful variables. </p>
      <p>As Bill points out, the many variables interact, so it's a very big project to try to separate them. I do think a new suite of fonts should be developed, but let's all chant together: it should be type designers (experienced, thorough, open-minded ones), not students, brain scientists or linguists who develop them. The complexity of assembling a team of appropriate experts, asking the right questions, testing thoroughly, and finding meaningful results is a tall order. So, Paul, I would say, no, there isn't anything even approaching exhaustive or even complete research out there. It hasn't even been tried.</p>
