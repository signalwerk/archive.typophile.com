      <p>Erik,<br>
      I think you have said pretty much what I was trying to say. Thank you for your elaboration. Like you and William, I feel the need for collaboration between science and craft (and whatever you would call human abilities to interpret, solve, and create). I do feel there is a danger from both the arenas though. Humans interpret data; humans set up testing procedures; humans define criteria and devise theories to prove or disprove.  All of these things can involve human error and provide a sense of being "correct" just because it was science. The other side is human hubris and self assurance that "it is my art, therefore it must be great". Neither art nor science should be accepted without question. We always need to be humble enough to listen to other voices even if what we hear does not fit our own theory or our own ego. </p>
      <p>Peter,<br>
      I much like your model! You at least seem to have included the meat of the issues.  The dilemma is sorting out the interaction of effects.  If I say reading is a function of all of your variables, I still have the hard job of measuring how they interact.  I might look at one variable sometimes a\nd the cumulative effect of all of them at other times.  Making the quantum leap to what to extrapolate from it is the devil of it all. I still don't see how we can remove deriving meaning from the act of perception of forms and decoding signs.<br>
      ChrisL</p>
