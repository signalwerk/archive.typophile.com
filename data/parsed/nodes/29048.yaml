      <p>Perhaps we need to distinguish between "brute' and 'fine' issues. Brute issues are issues of size and leading and line length and consistency of spacing and choice of <em>type</em> of type that measurably affect the <em>sustainability</em> (with good comprehension and enjoyment) <em>of the perceptual-attentional connection</em> with the text. We could call these: perceptual text-navigational processing issues and develop measures for them.</p>
      <p>Fine issues relate to adjustments or manipulations of contrast, construction, spacing that may be minor or hard to detect in perceptual text-navigational processing (base-level readability) terms but show an advantage in visual word-form resolutional terms, because they reduce superfluous spikes in the retinal and neural receptive field.<br>
