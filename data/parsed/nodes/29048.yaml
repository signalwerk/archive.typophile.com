      <p>&gt;Is there a problem with reading? Maybe there isn’t?</p>
      <p>That is a really good question, Chris. I think the answer is that sometimes we know there is a problem. </p>
      <p>For example a friend of mine was talking about the requirements for grant proposals for NSF. They are required to be a single column of 10 point Times New Roman, single spaced on letter sized paper. This makes the measure way too long, and my friend was saying that it really makes ploughing through piles of grant applications a chore for the reviewers.</p>
      <p>Another example I think are screen fonts, which in that low resolution environment are fatiguing enough that most people don't want to read extended text--only read text in snippets.</p>
      <p>So we know there is a range of more and less readable text. Now you can reasonably question is whether it is possible to improve on the best typefaces--such as Baskerville, Garamond, etc.--set at a size, measure and spacing we know are excellent. Maybe the limits are difficulties of comprehension, as you say, and not of perceptual processing. </p>
      <p>Personally, I think there may be only small improvements in readability possible in typeface design, though I think these are possible. The main thing for text design about knowing scientifically what is better and worse  is that it would give guidance so the new design would be at least as good as the best out there now. And maybe slightly better. </p>
      <p>But the benefits could be great in other areas. For example if the scientific testing showed that long measures were bad, the NSF wouldn't specify them. Forms would not have type too small or crowded. And screen manufacturers and font designers would know what realistically to shoot for. </p>
      <p>But the fruits of research will be more marked in other areas. first of all in lay-out, if we knew how type size, based on x height, and leading relates to ideal line length, it would help avoid blunders in in newsletters, magazines, newspapers, the internet, etc. And similarly for many other variables. </p>
      <p>In addition, there may be benefits for teaching reading and helping dyslexics--we don't know. </p>
      <p>Over all the justification for research into perceptual processing in reading is what Benjamin Franklin said. When asked of what use were his electrical researches--which then yielded only amusing gadgets, he said: "Of what use is a new born baby?" Of course later he invented the lightning rod, and then our whole modern economy became based on electricity. Reading research is still in the 'newborn baby' stage, I think. But there is plenty of reason to hope for helpful results.</p>
    html_clean: |-
      <p>&gt;Is there a problem with reading? Maybe there isn’t?</p>
      <p>That is a really good question, Chris. I think the answer is that sometimes we know there is a problem. </p>
      <p>For example a friend of mine was talking about the requirements for grant proposals for NSF. They are required to be a single column of 10 point Times New Roman, single spaced on letter sized paper. This makes the measure way too long, and my friend was saying that it really makes ploughing through piles of grant applications a chore for the reviewers.</p>
      <p>Another example I think are screen fonts, which in that low resolution environment are fatiguing enough that most people don't want to read extended text--only read text in snippets.</p>
      <p>So we know there is a range of more and less readable text. Now you can reasonably question is whether it is possible to improve on the best typefaces--such as Baskerville, Garamond, etc.--set at a size, measure and spacing we know are excellent. Maybe the limits are difficulties of comprehension, as you say, and not of perceptual processing. </p>
