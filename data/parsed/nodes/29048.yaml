      <p>What I'd like to see is a Research Institute for the Scientific Study of Perceptual Processing in Reading, existing under the institutional umbrella of a School of Typography or Design.</p>
      <p>The idea here would be to go beyond developing new measures of readability; or developing new proofs of readerability; or devising comparative tests that show a more sophisitcated understanding of the stimulus material used in these tests (i.e., type), though this last concern is certainly a priority. The idea here would be to develop an understanding of the perceptual and neuro-physical mechanics of reading that is detailed enough to make plain why the things that typographers and type designers <em>know</em> are critical or worth attending to,  <em>are</em> indeed critical and worth attending to, like spacing.</p>
      <p>Currently the <em>perceptual</em> mechanics of reading are massively under explored by students of reading and reading problems. And currently pivotal dimensions of processing (like, for instance, lateral interference) are not well integrated into the picture. A good deal is known about perceptual mechanics, neural behaviour in the multi-layered visual cortex, perceptual learning and object recognition that <em>hasn't</em> been effectively applied and tested in the domain of what I call 'visual wordform resolution'. The Design / Typography School umbrella would gaurantee the data currently available is (re)viewed with eyes sensitized by typographical craft knowledge, and that the tests are designed in a way that reflects expert knowledge of the stimulus material and trenchant intuitions about their functioning in conditions of use. Eyes sensitized by typographical craft wisdom might predispose the researcher to introduce relevant but overlooked perspectives that integrate a greater range of observations and in doing this redirect the field.</p>
      <p>So there is a benefit to the typographical community <em>and</em> to the field of reading research.</p>
