      <p>I see your point, Thomas. I've given up the mostly-mono-width ideal. Perhaps I was simply looking for a more open font—for instance, the height and width of the "O" being roughly equal rather than somewhat condensed. Good suggestion on Hypatia Sans, by the way. I like its flexibility—the fact that it includes all the features you've mentioned is indeed a very big draw. I also like that it is, as you say, relatively monoline. Oddly enough, its capitals are strikingly similar to Topaz Inline, which, I've decided, is probably the look I'm going for (in terms of caps, because it sadly doesn't offer lowercase). I just find Topaz Inline so elegant and well-proportioned. To me, its perfect geometry, and yet its yielding departure from overregularity, make for a unique and unsurpassable combination. Now if only H&amp;FJ would offer the flexibility of Hypatia or even Gotham (adding lowercase glyphs would be a start)...</p>
