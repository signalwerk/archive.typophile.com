    <p>I've been trying to create a website for my software design company and, at least for some of its functions, I think a unicase sans-serif font would look good. I used some font creation software to create a unicase version of Myriad Pro, but it's nothing polished—I'm only an amateur at typography. It represents the basic look of the unicase font I'd like to see, but do you know of any already-created fonts that might bear some resemblance to it? I included in the title of my post the phrase, "the new standard", because I feel as if some of the existing unicase fonts aren't quite up to par with the "classics" of Helvetica, Myriad, Frutiger, etc.</p>
    <p>Oh, and by the way, I've already visited <a class="freelinking external" href="http://typophile.com/node/15035" rel="nofollow">this page</a> about unicase fonts on Typophile. It was helpful, but didn't really cause me to come to a decision about any particular font.</p>
    <p>Working title—Myriad Miniscule (yes, I understand there are copyright laws involved; it's just a concept) :<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Image_6468.png"></div><p></p>
    <p>Thanks for your help.</p>
