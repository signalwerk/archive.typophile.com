    html: |-
      <p>If you have designed a typeface for a foundry, and suggested an upgrade, there are many possible responses, eg:</p>
      <p>1. No.<br>
      2. Yes, please go ahead, we will pay you for the work.<br>
      3. Yes, go ahead, we won't pay, but will publish the upgrade<br>
      4. Thanks, we will implement your suggested changes.<br>
      5. Can we renegotiate the contract? </p>
      <p>I am always busy, but never too busy to reply to an email that seems legitimate.<br>
      Therefore I expect a professional signature (name, business, title, address, etc.)<br>
      If I get an email and the signature is "Joe" and that's all, I usually ignore it.</p>
