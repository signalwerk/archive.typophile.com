    html: |-
      <p>Great suggestion, nina. I really like ITC Franklin, and I'd forgotten that it now has unicase alternates. Thing is, I don't much like the "r" or the "t" (in the unicase)—they seem not to be geometric enough. Then again, that's just a personal preference. I like the rest, though.</p>
      <p>Nick, I really like your Avenir spinoff—I'd say it comes the closest to what I'm looking for out of any unicase font I've seen (except perhaps my own, but yours has things like pair kerning and correct metrics and such, I'm sure). The dotted "i" is a distinctive touch. I actually appreciate the numerals drawn wide—they look like they belong with the rest of the font, rather than as afterthoughts.</p>
      <p>I look forward to more replies in this thread (and appreciate the existing ones), but something tells me I'm going to have to commission a new font. I have too specific an idea of what I'm looking for. Essentially it would have these qualities:</p>
      <p>—Unicase<br>
      —The width-to-height ratio of the "x" (and by extension, that of most other letters) would be 1:1, or square<br>
      —No variation in stroke width—for instance, an "o" would appear as two equally proportioned, intersecting shapes (as in Helvetica Neue Ultra Light)<br>
      —A blend of geometric and humanistic—minimal differentiation between letters, but some freedoms (e.g., the slanting on Myriad's "M", and its careful tuning of the rounded part of the "P")<br>
      —Minimal differentiation between letter width—most letters should appear roughly x-width; of course, "i" and "j" are notable exceptions<br>
      —Likely, numerals would be roughly x-width or slightly thinner, as in the example given above by Nick Shinn<br>
      —Possibility of a one-story "a", but not certain<br>
      —The tail on the "Q" would be straight, directed roughly 30 degrees below baseline</p>
      <p>Even as I make this list, it sounds as if I'm heading in the direction of font commissioning. How expensive is it to commission one? Or is the price, by nature of it being commission-based, highly variable?</p>
