    html: |-
      <p>Um ... er ... many questions:</p>
      <p>- Does your licence cover that conversion?<br>
      - What format did you start with?<br>
      - Are you aware that you can use OT fonts on both platforms (PC/Mac)?<br>
      - Are you aware that the endash is not a "small hyphen"?<br>
      - What dash exactly is missing?<br>
      - In what application did you miss the dash in question?<br>
      - Does that app. make use of automatic character substitution?<br>
      - FOG 4.7.2 sounds like Apple Mac - what name and unicode nr did your dash have in the first place?<br>
      - What TT options _did_ you use?<br>
      - Did you notice you're in the wrong forum?<br>
      - What experience do you have in font conversion?<br>
      - Are you sure [Y/N]</p>
