    html: <p>thanks for the cached link john <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>personally tufte leaves me with mixed opinions. i applaud his approach of getting information design out to the masses, and his books are beautifully produced (i have them all).  <br> <br>but his methods and opinions often leave my jaw dragging on the floor! i was very excited in atypi 99 in boston to see him give the keynote, as i had never had the opportunity before. it *was* interesting, but i felt i was expected to stand up and shout 'right on' and punch the air after every point he made. <br> <br>god, i'm such a cynic...</p>
