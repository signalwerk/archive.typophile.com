      <p>Thank you for the response Grafenburg.</p>
      <p>In answer to your question, I'm interested in US fonts in common use in 1948 and more specific ones! (Please excuse the long explanation below...)</p>
      <p>My focus on '48 is that it dates the coining of the word 'beat' by Kerouac and thus the start if the 'beat' movement. (Not to be confused with the later manufactured, madison avenue 'beatnik' trends of the mid 50's to early 60's!).  Thus, early fifties fonts would also work I think.</p>
      <p> I'm looking to put selected phrases/words used by Kerouac/Burroughs/ Ginsberg etc into typefaces that fit the period/style. I selected the above 'he walked at night' font as these gents used typewriters but I'm interested in other serifed/ stylized fonts too!</p>
      <p>Have established that 'palatino' was created in '48 but that's about as far as I've got so any other suggestions/ thoughts would be very gratefully received!</p>
      <p>Thanks in advance for your help</p>
      <p>Steve</p>
