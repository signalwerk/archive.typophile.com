      <p>I’d definitely agree with hrant that it’s more important to embody the era than to strictly stick to fonts from that time. </p>
      <p>Many fonts look back, some look forwards. As a result many that were in use at the time won’t convey the era to the modern viewer, no matter how true they actually are to it.</p>
