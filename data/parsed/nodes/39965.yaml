      <p>“to me, “the tools available at the time” *are* the technology, realistically.”<br>
      That’s a reasonable late adapter’s viewpoint, but ’realistically’, where is the future in that attitude? Illustrator and a text editor were not PostScript the technology. Royal-T (the original Truetype hint and contour editor), was not TrueType the technology. </p>
      <p>“Type 1 would be just another font format if it were not for Fontographer.”<br>
      That’s a nice typocentric thought. If Type 1 wasn’t the high quality font format of PostScript, and PostScript wasn’t by far the dominating force in Type 1’s rise, it’d be true. Besides which, Fontographer came first, a published Type 1 specification came second.</p>
      <p>“GX Variations are long forgotten...”<br>
      You’d have to redefine long and forgotten, or say Hi to Ian! and then there’s Erik’s work, which thankfully took long by my definition and forgot nothing, so far as I can find... but there’s always time. ;)</p>
      <p>”...the tools to make fonts in that format were awkward.”<br>
      I don’t find this to be the case at all. Can you compare and contrast Superpolator and Mutator from experience please? </p>
      <p>“GX Variations had the concept of “start at the middle and imagine the ends””<br>
      That nothing in the past, or now, can ’imagine’ ends, is certain. One actually draws the middle and may or may not draw ends in GX variations, or in Superpolator. But without at least a middle and one end (as one can probably imagine), there is no space for in-between, or for extrapolation outside.</p>
      <p>Contrasting this with MM, and reaching a clear understanding in a proper framework of open-mindedness, typographic knowledge and with the aid of visuals, is obviously needed. I’ll try to do a skit of something at Typo, which seems to have all those capabilities in a conference environment :-)</p>
      <p>The important things for designers of type to know, is that Superpolator has all of the advantages of GX Variations, a fabulous interface, it is OS current, it can make MMs like a slicer makes bread, or make Superpolations like MMs if a slice that is a whole loaf of bread is what one wants... and it is ufo compliant.</p>
      <p>Cheers! and considering the time of year, additional Cheers!</p>
