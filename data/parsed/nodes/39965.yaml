      <p>Thanks for the explanations, everyone. Looks like it would be more of a trinagle, then.</p>
      <p>In order to get my semibold cocktail I could also introduce a second, vertical “trueness” axis. The extralight and extrabold would be at the ends of the weight axis at trueness 0, and the true regular would be placed somewhere around the middle of the weight axis but on trueness 1 (middle top of the diagram). This is how I used to sketch it on paper. </p>
