      <p>Tim:<br>
      <cite>do you know how arbitrary mixing of masters in Superpolator works? How is it edited? And how is it connected to the input methods described in the screencast?<br>
      If all I want is simply to mix my semibold out of -20% extralight, 80% regular and 40% extrabold, how would that be achieved? I cannot imagine any quadrangle doing that.<br>
      </cite></p>
      <p>in order to mix masters the way you describe, in Superpolator, or GX, you need to set up a separate axis for each, then pick values along each to get to the shape you want.</p>
      <p>ExtraLightAxis: 1 master at 1000<br>
      ExtraBoldAxis: 1 master at 1000<br>
      I’d put the Regular at the origin of both axes. Then you can add or reduce the influence of all 3 masters.</p>
      <p>As Adam points out, you can do the same thing with RoboFab’s glyphMath (in fact, that’s what Sp uses alot). You don’t even have to have Superpolator:<br>
      <code><br>
      # suppose a font with 3 interpolatable glyphs on A, B, C<br>
      # calculate D based on 3 factors.<br>
      from robofab.world import CurrentFont<br>
      f = CurrentFont()<br>
      xl = f['A']<br>
      rg = f['B']<br>
      xb = f['C']<br>
      new = -0.2 * xl + .8 * rg + 0.4 * xb<br>
      if 'D' not in f:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;f.newGlyph('D')<br>
      f['D'].clear()<br>
      f['D'].appendGlyph(new)<br>
      f['D'].update()<br>
      </code></p>
      <p>Using Superpolator it would be a matter of exploring the design space to find the right combination of factors. If you already know what you want, it’s just as easy to use a glyphMath transformation.</p>
