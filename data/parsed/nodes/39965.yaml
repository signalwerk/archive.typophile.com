      <p>&gt; Oh I see. None the the advantages of GX with all the limitations. :-o</p>
      <p>Two huge advantages over GX: </p>
      <p>* there are actual usable shipping applications that allow people to draw fonts in MM space</p>
      <p>* designers actually understand what is going on in MM so that the Carters don’t need to hire the Berlows to “implement” their designs :D </p>
      <p>BTW, even Erik van Blokland’s Superpolator uses the same principle, i.e. one set of outline points and a number of locations (masters). The difference between MM and Superpolator is that in MM, the masters are located at the ends of the design space, and that the number of masters must be a power of two. In Superpolator, masters can be inserted at any place within the design space (but they still need to be “compatible”). Actually, an extended version of MM did support intermediate masters (so you could slice an axis by inserting extra masters in the middle) but this extended MM is not implemented in FontLab Studio. </p>
      <p>Simplicity is often a virtue. </p>
      <p>Cheers,<br>
      Adam</p>
