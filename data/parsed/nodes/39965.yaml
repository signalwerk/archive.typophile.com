    <p>I have tried to solve this on myself, but it seems impossible.</p>
    <p>For interpolation to be correct, the nodes positions must be representing the same “area” of the glyph. I’m all fine with that. But sometimes, some small error has occured and the node on one master represent a wrong “node position”. For instance, the top left nod of an “I” of one master is on the right bottom on the other master, making interpolation wrong.</p>
    <p>Is there a way to solve this without having to redraw the outline? Similar to change start-point, or something? Sort of tell the glyph: This node is supposed to be here?</p>
    <p>Thanks in advance.</p>
