      <p>if i understand the problem correctly, this is my solution. if i seem coming from nowhere, then i misread the problem, but here goes:</p>
      <p>make a new blank font. from the glyph window select one master and copy it. paste into a glyph window in your new font. fix the starting points to match the master that was not copied. copy your fixed glyph. paste into the mask layer of the multiple master glyph. copy mask to master. voila! it should work now.</p>
