      <p><cite>is not implemented in FontLab Studio</cite></p>
      <p>Intermediate masters are not implemented in FL – but they are supported, in a way. You just have to use an MM font with four masters to take up your extralight, regular and extrabold masters. That results to one redundant master, of course, so you have two identical masters. I have written a very small macro that simply updates that ’dead’ master from the other so that is not a big deal. This is how I have been designing and producing my font families for years.<br>
      The advantage of having three weights in an MM font is that you can mix you cocktail out of the three masters at any arbitrary ratio. For example, you can mix your semibold out of  -20% extralight, 80% regular and 40% extrabold. I explained over in the other thread (<a href="http://typophile.com/node/39376" title="http://typophile.com/node/39376">http://typophile.com/node/39376</a>) why this makes sense. Don’t know whether this concept, combining the principles of interpolation and extrapolation, is possible in Superpolator.</p>
