      <p>David, </p>
      <p>by saying “to me, “the tools available at the time” *are* the technology, realistically,” I meant that the today’s current support in tools is the primary aspect of judging the value of a technology. Of course, every now and then, I gladly take out the glass ball from my drawer and play the visionary, and do some speculations and, hm, extrapolations. But realistically, if Fontographer had not been as brilliant as it was, and Royal T had been better (at the time), TrueType might have outdistanced Type 1 long time ago. If the market had 1000s of quality TrueType fonts and only a handful Type 1s, Adobe would have implemented proper TrueType support in PostScript earlier (and yet, they did, after all, anyway). </p>
      <p>Royal T was free, and still, you told me that you preferred Fontographer Q. </p>
      <p>&gt; Can you compare and contrast Superpolator and Mutator from experience please? </p>
      <p>I can’t. I’ve never seen Mutator and I was not allowed to obtain a copy of Superpolator 2 when it was released. But from what EvB said last week I gather he thinks Superpolator is better than the old GX Variations drawing tools (I presume that was Mutator). </p>
      <p>&gt;&gt; GX Variations are long forgotten...<br>
      &gt; You’d have to redefine long and forgotten, </p>
      <p>Dan Fenwick, currently one of the principal engineers on Apple’s text engines, says: “As I explained at the last WWDC, ATSUI is actually a very old technology that is getting very difficult to shim new technology into so we are strongly advocating developers use Cocoa and/or CoreText moving forward.” and “CoreText also has nearly all the support for AAT table layout that ATSUI has (only the very obscure AAT stuff is missing that nearly no one notices)” [1]</p>
      <p>CoreText does use other GX/AAT aspects like the morx tables, allowing the use of small-caps, swashes, old-style numerals etc. — but not Variations. GX Variations (“the sliders”, gvar table) work in ATSUI but they never worked in AppKit or CoreText. So my guess is that the Variations are one of the things that the Apple engineer described as “very obscure AAT stuff that nearly no one notices”. </p>
      <p>TextEdit used AppKit and in 10.5 uses CoreText, and I believe Keynote still uses AppKit. Apple once made an alternative to TextEdit called WorldText which used ATSUI, allowing the use of GX Variations. The app was included on the Developer disk up to Mac OS X 10.3 but was dropped since 10.4 on, and the older versions of WorldText crash when one tries to run them on 10.4 or 10.5. </p>
      <p>Apple is actively advocating people to move away from ATSUI, the only environment that supports GX Variations. They no longer ship apps that use GX Variations (even for demo purposes). So, Variations are supported in the sense of “yeah, it will still somehow work if you know what you’re doing” but not in the sense of “here’s a technology, use it, we’ll tell you how”. </p>
      <p>Maybe I was too harsh saying “long forgotten”. I should have said “GX Variations started to sink some considerable time ago, there is nothing to stop it but they haven’t touched the bottom yet.”</p>
      <p>On the other hand, thumbs up for Superpolator. I’m glad to see that some of the Variations concepts resurfaced there, though obviously not in the same implementation details. </p>
      <p>Best,<br>
      Adam</p>
      <p>[1] <a href="http://lists.apple.com/archives/carbon-dev/2007/Nov/msg00014.html" title="http://lists.apple.com/archives/carbon-dev/2007/Nov/msg00014.html">http://lists.apple.com/archives/carbon-dev/2007/Nov/msg00014.html</a></p>
