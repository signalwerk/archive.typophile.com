      <p><cite>MM had the concept of “start at the ends and imagine the middle”</cite></p>
      <p>That may have been the concept but it is not how you have to use it. You can simply start designing a regular and then extend the design space only to one side, by adding a bold, for example. This would be “starting in the middle and extending towards one end”, without having to imagine anything. It is my impression that many, if not most designers work in that way.</p>
