      <p>Contrasting this with MM, and reaching a clear understanding in a proper framework of open-mindedness, typographic knowledge and with the aid of visuals, is obviously needed. I’ll try to do a skit of something at Typo, which seems to have all those capabilities in a conference environment :-)</p>
      <p>The important things for designers of type to know, is that Superpolator has all of the advantages of GX Variations, a fabulous interface, it is OS current, it can make MMs like a slicer makes bread, or make Superpolations like MMs if a slice that is a whole loaf of bread is what one wants... and it is ufo compliant.</p>
      <p>Cheers! and considering the time of year, additional Cheers!</p>
