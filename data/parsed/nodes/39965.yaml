      <p>Adam, “Royal T was free, and still, you told me that you preferred Fontographer Q.”<br>
      Better Yet! Royal-T was free and I paid 1,000s to have Fog-Q developed! Drawing native TT and Generating TT point-accurate in my native application with my nice UI, was a priceless thing not so much a preference thing.</p>
      <p>Adam, “...if Fontographer had not been []brilliant[], and Royal T had been better (at the time), TrueType might have outdistanced Type 1 long time ago...” </p>
      <p>:——) If Adobe had exhibited grace, instead of fearmongering at TT ..., if Apple and Adobe had (right then,1990) finished their respective integrations of TT and T1... if MS had completed its cooperation with Apple on TT, to this day...and, if Jobs had not come home and rearranged the furniture, maybe...but that’s a lot of ifs. I’m sad to have to tell you, you having been in school for the first 1/2 of this, that slowing, de-standardizing and dumbing down TT as it rose into popular use took a rather broad and semi-disconcerted effort that Fontographer had little to do with in general, (and from day 1 of FOG’s generation of TT...FOG was a non-factor in keeping TT down).</p>
      <p>But, regardless of how dumb TT has got for the end user, (and TT’s only a single dimension worth of hints away from dumb-as-T1, but lighter, for billions of PC users, with Mac users employing around 98% dumb-as-T1 type, but darker), how dumb should the general Type Designer’s tools be at recording variations of a design? I guess the answer is a firm and general, dumb as T1 MM 1.0. </p>
      <p>Cheers!</p>
