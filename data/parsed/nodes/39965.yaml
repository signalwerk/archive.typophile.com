      <p>Try this:</p>
      <p>1. Clear the Mask layer<br>
      2. Copy the glyph to the Mask layer<br>
      3. Switch to the Mask layer<br>
      4. Do Tools &gt; Multiple Master &gt; Expand Master<br>
      5. Correct the outline(s)<br>
      6. Switch to the Outline layer<br>
      7. Do Tools &gt; Multiple Master &gt; Mask to Master</p>
      <p>The key step in this procedure is the “Expand Master” operation. What it does is it breaks the compatibility links between masters and lets you adjust the outlines freely. I used to do what Paul described until I found this method.</p>
    html_clean: |-
