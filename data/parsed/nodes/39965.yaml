      <p>David, </p>
      <p>Who’s picking on Erik? Not I, my Lord. </p>
      <p>Just last week I met with Erik in Bad Homburg where he was doing presentations of Superpolator 2 and LetterSetter (developed by Erik) as well as MetricsMachine, FeatureProof and Prepolator (developed by Tal Leming). I was very impressed with all the tools. </p>
      <p>I actually was picking on GX — because I think GX Variations was “too much”. I have heard from several people that designing GX Variantions fonts was hardly a practical process. With Superpolator, it is different, because Superpolator does not follow the GX way (one master and a bunch of deltas) but is more of a mix between the GX process and the MM process. Superpolator is flexible on one hand but it still manages to be visual and intuitive. I think the task of finding the right balance between technical flexibility and UI feasibility is the hardest task in software design. </p>
      <p>William, </p>
      <p>indeed, with two masters, the results between MM and Superpolation should be identical. However, the next step in Superpolation is that you can add just a 3rd master while in the FontLab MM implementation, you need to add two more (ending up with four). </p>
      <p>With Superpolator, you can have 5, 7, or 13 masters but of course also 4, 8 or 16 masters — and they can be in different locations on the design space. </p>
      <p>For example, 4 masters in Superpolator can visually form an arbitrary quadrangle while in MM they have to form a rectangle. </p>
      <p>A.</p>
