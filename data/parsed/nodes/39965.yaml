      <p>A good way of understanding MM is NOT to think of the masters as being collections of points that are somehow “linked together” across masters. In MM, every glyph is made of just ONE set of nodes, but each of those nodes have several different POSITIONS (coordinate locations) – different on each master. So if you add or delete a node, you just add or delete a node from that one set of nodes that there is. </p>
      <p>It’s like having 10 employees — let’s assume that each of them works in a different office each day of the week. If you fire one, then you have one employee less — on all days of the week. And if you hire one, you have one employee more — on all days of the week. On Monday, Jim can be at the office on the 42nd Street and on Tuesday, he can be at the office on 7th Avenue, but it is still one and the same Jim :D </p>
      <p>Adam</p>
