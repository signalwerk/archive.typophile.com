      <p>David, </p>
      <p>to me, “the tools available at the time” *are* the technology, realistically. </p>
      <p>Type 1 would be just another font format if it were not for Fontographer. </p>
      <p>And, dare I say, Multiple Master would completely sink in forgotenness since Adobe dropped it 8 years ago if it were not for FontLab Studio that allowed it to resurface as a font development technology (far from perfect, but good enough for many designers). </p>
      <p>GX Variations are long forgotten (they don’t even work properly anymore in Mac OS X’s up-to-date text engine, CoreText that is) because the tools to make fonts in that format were awkward. </p>
      <p>GX had support for rich typography and complex scripts long before OpenType, but it was OpenType that gained momentum, because (among others) there were tools that allowed people to make fonts in that format. </p>
      <p>MM had the concept of “start at the ends and imagine the middle” and GX Variations had the concept of “start at the middle and imagine the ends”. That is my understanding. I don’t think either of those was really practical from a designer’s perspective. </p>
      <p>Superpolator is neither, as far as I can tell. It has the concept of “start anywhere and put masters anywhere”, which is flexible though tough to visualize. Superpolator IS very promising and I’m keeping my fingers crossed. </p>
      <p>&gt; Don’t have superpolator? Not designed a GX font, but ya’ know “several people”<br>
      &gt; who have? lol, riiight. </p>
      <p>When TrueType GX was introduced, I was in high school. Until 2000 or so, the only cases where I have seen a Mac was from a distance (which is not really surprising given that Microsoft localized their OS and applications into my native language very early on, and Apple did not seem to care.) </p>
      <p>EvB told me he did a GX variations face once, at some point I did figure about the state table stuff, and about two years ago, I spent a whole afternoon with Dave Opstad, and he explained me GX Variations and other aspects GX. That was the first time I developed a grasp of that — after all, I’m just a moderately intelligent person, one a crack who can “get it” from just reading the specs. </p>
      <p>I’ve never seen any GX tools, any GX applications. I’ve spoken to people at Linotype who had all but good things to say about GX. </p>
      <p>I’m not sure what you mean by “lol, riiight” here, but I’m sure you have fun and you are right. :) </p>
      <p>Adam</p>
