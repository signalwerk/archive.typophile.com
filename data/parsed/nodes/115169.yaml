      <p>Thanks Ahmadkhan12 for the link with sprinkles of Rose Water.<br>
      Does <a href="http://quranacademylive.com/" title="http://quranacademylive.com/">http://quranacademylive.com/</a>  have a clear-cut answer to verse 7 of chapter 3 that ends with these lines:<br>
      [ But no one knows its (Quran) interpretation except Allah and those firmly grounded in knowledge; they say, We believe in it; all of it is from our Lord. And none takes admonition except those who possess intellect]</p>
      <p>Q: Which reading is correct: A or B?<br>
      ______________________A______________________<br>
      But no one knows its (Quran) interpretation except Allah [a must-stop].<br>
      And those firmly grounded in knowledge say, We believe in it; all of it is from our Lord.<br>
      ______________________B______________________<br>
      But no one knows its (Quran) interpretation except Allah and those firmly grounded in knowledge;<br>
      And they (those firmly grounded in knowledge say) say, We believe in it; all of it is from our Lord.<br>
      _____________________________________________<br>
      If A is correct,<br>
      1. Why did Allah send down the Glorious Quran if no one save He Knows it?!<br>
      2. What do the rest of  Muslims say? If as those firmly grounded in knowledge say, then<br>
      3. What distinguishes those firmly grounded in knowledge? </p>
      <p>If B is correct, who are  those firmly grounded in knowledge?<br>
      _____________________________________________<br>
      Excuse me if out of topic.</p>
