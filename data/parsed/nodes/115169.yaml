    html: |-
      <p>Glancing at this, it seems to me that the criticism of the Aziz is valid, but the Reyhan is a bit too small. Looking at images on the Web of copies of the Qur'an, it indeed appears that existing ones do tend to look like the Reyhan, but with significantly larger Ayat numbers than that example, although still smaller than the Aziz.</p>
      <p>I know I'm hardly qualified to comment on such a matter, but it seems like no benefit to the reader is gained by attempting to increase or decrease the size of Ayat numbers from current conventional practice to the extent shown.</p>
      <p>This is a picture of a copy the Qur'an</p>
      <p><a class="freelinking external" href="http://www.islamichappiness.com/quran.png" rel="nofollow">http://www.islamichappiness.com/quran.png</a></p>
      <p>similar to others I have found on the Web, so I presume the relative size of the Ayat numerals is conventional there.</p>
