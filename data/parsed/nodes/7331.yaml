    html: <p>It's a question of context. Important is an adjective, importantly an adverb. <br> <br>"Of all the reasons for war, the most important is...." (important is an adjective modifying reasons) <br> <br>"Why did we go to war? Most importantly, we went because the President said...." (importantly is an adverb, modifying went) <br> <br>Note that in the second sentence it would not be unusual to leave out the verb phrase "we went," yet it would still be implied. <br> <br>Leastways, that's my understanding. But it's been many years since I made my living as an editor. <br> <br>Cheers, <br> <br>T <br> <br>Cheers, <br> <br>T</p>
