    html: <p>Gina, as Tom has explained, it depends whether what is 'most important' is a noun or a verb. At the beginning of a sentence, it depends what follows, e.g. <br> <br>'Most importantly, we should CONSIDER [verb] whether the phrase applies to a noun or to a verb.' <br> <br>'Most important, in our consideration, is the QUESTION [noun] whether the phrase applies to a noun or to a verb.'</p>
