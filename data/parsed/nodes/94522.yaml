      <p>@ Frank and Neil: In the early 90s, you used to see a lot of wide letterspacing used with condensed fonts. Quark xPress was everybody's new toy, and they were letterspacing because Quark made it easy, not because it was the best design solution. At the time, I hated it. I thought making the type skinny and then putting wide spaces in it was like running the air conditioner with the windows open.</p>
      <p>I guess I've mellowed with the passing years. Now I look at a book jacket like this and think, "That's not how I would have done it, but you know, it works."</p>
