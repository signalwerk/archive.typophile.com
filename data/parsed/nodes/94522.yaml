    html: |-
      <p>That’s not true.<br>
      The design of the cover gives the reader important cues as to what sort of a book is inside.<br>
      When I was working for Harlequin, I discovered that there were many sub-genres of women’s ﬁction, e.g. Historical, Humorous, Erotic, Chicklit, etc., and these each had a corresponding style of cover.<br>
      Whether the author’s name or the title is more prominent tells you how well known the author is.<br>
      How “clever” the concept is counts too.<br>
      When working for Jim Lorimer, he would set up prospective book covers on a pseudo-bookstore shelf, and see what they looked like from afar: not thumbnails per se, but a corresponding angle of vision. The book had to make a good ﬁrst impression, across a crowded store, and get noticed enough for someone to pick it up and read the blurb, and perhaps open it and read the contents page or a few paragraphs.</p>
      <p>I’m surprised the brilliant Mr Kidd designed this dreary, unimaginative cover, though it is well-crafted and presumably on the money. (Perhaps he designed a really cool concept, but the client would have none of it?)</p>
