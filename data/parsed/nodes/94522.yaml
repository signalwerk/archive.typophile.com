  html: |-
    <p>I admire this book jacket by Chip Kidd. The layout and typeface, Corvinus Skyline by Imre Renner, convey a sense of power in restraint that perfectly suits this work by Supreme Court Justice Stephen Breyer. The letters march in a pace that is measured but by no means static. The jacket is a gem.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/breyerbkjacksm_5196.jpg"></div><p></p>
