    html: <p>Nick, I'm not debating that a cover can provide useful information, especially when part of a differentiated series from a publisher, as in the Harlequin example you give. What I am saying is that thumbnails of designs are not a worthwhile subject of <em>design critique,</em> especially not at the level of type stroke contrast as was happening in this discussion (the hairlines of the type in the image are greying out, whereas in the real object they would have the same stroke density as the main stems). I suppose one can make some general comments about concept and layout, but even there is is difficult to judge the real impact of the physical object from a small, low-res pixelated image.</p>
