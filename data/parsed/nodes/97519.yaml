  html: |-
    <p>My neighbor wrote an add and paste it above the building entrance. Man I love his handwriting. I mean check out what an effort he puts into writing a single sentence. He is an older man and is offering to repair washing machines and stoves. I love the numbers! :) I decided to collect these kinda pics whenever I see something like this.</p>
