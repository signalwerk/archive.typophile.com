    <p>It is events such as this that cause one to pause and ponder the fact that as designers, especially those whom are involved in product design, we do have the responsibility to be involved and to educate. Perhaps I am blowing things out of proportion, but in this instance I doubt it. <br> <br>Quoted from an e-mail sent by Francois-Xavier Nsenga <br> <br><br>
    </p><blockquote>
    <hr size="0"><!---quote-!--><b>quote:</b>
    <p> <br> <br>Dear Colleagues, <br> <br>Several hundreds of ex-patients in hip surgical wards in Quebec <br>hospitals are soon being recalled for investigation of an eventual <br>contamination by HIV and other infectious diseases, due to a badly <br>sterilized surgical instrument. The whistle was recently blown by an <br>employee in one hospital sterilization department, signaling that the <br>particular instrument is currently not being properly sterilized, <br>simply because it is not, as it should normally be, completely <br>disassembled after use. <br> <br>One of the interviewed PR medical doctors showed us last evening in <br>public media the incriminated instrument, and <br>declared: "...obviously,  there is no way one could know that this <br>head - of the instrument - is detachable ..." <br> <br>The employee in the sterilization department found out, by chance,  <br>probably through routine manipulation, that the head of the <br>instrument could be removed, and all components thoroughly sterilized <br>separately. <br> <br>One is thenn tempted to conclude that no competent design work was <br>done at the successive life phases of the instrument use, "from the <br>cradle to the ...". Quite obviously there has been incomplete design <br>input in the early briefing phase and at the drawing board or <br>software designing phases. One could add also that no full design <br>supervision has been ensured during the manufacturing process of the <br>instrument, and definitely no design intervention at the time of <br>multiple government inspections and approval procedures. Had research <br>and practice designers been adequately trained to "sell" their <br>expertise to medical equipment vendors and government approval <br>officials, to hospital purchasing agents and medical personnel <br>training teams, most probably the whole present mess would have been <br>avoided, or at least the damage greatly limited. <br> <br>We are told the surgical instrument has been in use for a couple of <br>years without proper sterilization, and it is believed it has been <br>sold and used not only here in Quebec but surely elsewhere in Canada <br>and in other countries. One of the expected outcomes is the financial <br>disbursement that will be estimated in millions of dollars after <br>legal responsibilities and indemnification will be ascribed. But <br>there also are inestimable social effects (increasingly diminished <br>confidence of citizens in public institutions) and emotional <br>catastrophes resulting from the agonizing anguish of all those <br>individuals who might have been (or not!) infected and having (or <br>fear of!) spread the deadly diseases to loved ones. <br> <br>Another case for reflection by all of us, each from our respective <br>sub-fields of design involvement. <br><!---/quote-!--><br>
    </p><hr size="0"><!--!-/quote-!--><p></p><!--!-quote-!--></blockquote>
    <p></p>
