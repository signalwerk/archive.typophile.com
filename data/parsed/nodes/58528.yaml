      <p>Mike, you are misunderstanding the point of my post.</p>
      <p>I'm not questioning your font identification. I knew what the font was based on when I began my original post. See how I mention that the logo is "Linotype's liberty font without the serifs". That's me saying the logo is based on Liberty, that Liberty is owned by Linotype, but that the logo uses an altered version "without the serifs".</p>
      <p>I'm going to assume that there is no font available and I'll look into purchasing font alteration from Linotype if I my creative team wants to pay the fees.</p>
      <p>Thanks,</p>
      <p>Kristin</p>
