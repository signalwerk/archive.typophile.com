      <p>The use of the em-dash to signify a pause or trailing off at the end of a sentence may be an American phenomenon. Emily Dickinson used dashes everywhere in her handwritten manuscripts, and in some editions, editors left the poems that way rather than substituting more conventional punctuation.<br>
      When you're writing with a pen or pencil, it's often easier to make a dash than to choose between a comma, semicolon, or ellipses. I don't know if Harper Lee wrote <em>To Kill a Mockingbird</em> on a typewriter or not, but if she wrote in longhand, she may have simply defaulted to dashes, and her editor chose not to change them.<br>
      I was always taught that in type, em-dashes should be "tight," but that may be discretionary, like the spacing after a period.</p>
