      <p>Maybe this helps:</p>
      <p><cite>"An ellipsis may also imply an unstated alternative indicated by context. For example, when Count Dracula says "I never drink … wine", the implication is that he does drink something else, which in the context would be blood. In such usage the ellipsis is stronger than a mere dash, where for example "I never drink—wine" might only indicate that the Count, not a native English speaker, was pausing to get the correct word."</cite>
      </p><ul><a href="http://en.wikipedia.org/wiki/Ellipsis" rel="nofollow">Wikipedia Article</a></ul>
      <p></p><p><em></em><em></em><br>
