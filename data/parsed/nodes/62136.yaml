    <p><strong>There was something about them, no matter how much they cussed and drank and gambled and chewed; no matter how undelectable they were, there was something about them that I instinctively liked … they weren’t—<br>
    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;“Hypocrites, Mrs. Perkins, born hypocrites,” Mrs. Merriweather was saying.</strong></p>
    <p>Can anyone more familiar with the language enlighten me on this?</p>
