      <p>The use of the em dash in this manner was far more common a couple generations ago than today. For some reason, this style of punctuating has fallen out of favor.</p>
      <p>But <em>The Chicago Manual of Style,</em> 15th ed., still covers this usage:</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; §6.90 <em>Indicating sudden breaks.</em> An em dash or a pair of em dashes<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; may indicate a sudden break in thought or sentence structure or an<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; interruption in dialogue. (Ellipsis points may also serve this purpose;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; see 11.45.)</p>
