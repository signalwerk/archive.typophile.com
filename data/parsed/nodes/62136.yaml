    html: '<p>When I worked in a sociolinguistics project on a large-scale corpus of spoken French in Ottawa-Hull in the mid-80s, we had a transcription convention no doubt derived from the "interruption" function of the em dash: a "false start", where the speaker would start and then stop and restart their thought, was signalled by a double hyphen (our closest approximation at that time, when the Macintosh 128 was the new gizmo on the block).</p>'
