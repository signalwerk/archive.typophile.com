    <p>I came across something I haven't seen before while reading <em>To Kill a Mockingbird.</em> It seems the writer – or perhaps editor – are using the em-dash as some kind of ellipsis. Here are two examples, the second one make use of both an em-dash and an ellipsis (and I think there should have been a space before the em, as in the first example).</p>
    <p><strong>“Mayella Violet Ewell —!”</strong> (Calling the witness to stand.)</p>
    <p><strong>There was something about them, no matter how much they cussed and drank and gambled and chewed; no matter how undelectable they were, there was something about them that I instinctively liked … they weren’t—<br>
    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;“Hypocrites, Mrs. Perkins, born hypocrites,” Mrs. Merriweather was saying.</strong></p>
    <p>Can anyone more familiar with the language enlighten me on this?</p>
