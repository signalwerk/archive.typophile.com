    date: 2005-01-26T10:28:00
    date_raw: 26 Jan 2005 — 10:28am
    votes: null
    html: <p>Jacob, first off, I'd ditch 3a-4b. I've seen this design a million times and it doesn't say 'landscaping' to me. <br> <br>Right now, I'd say 1a and 1b are stronger, as they are, than 2a and 2b. Only because the grass in the 2 versions looks more like hair to me. Otherwise, I prefer the visual concept in the 2s. Push the grass more towards blades, rather than spikes. <br> <br>I think 1a and 1b are a bit generic, but workable. Try to make the type and leaf feel like more of a unit, rather than type and a leaf. Also, the central vein in a leaf is just an extension of the stem, so you should draw them as one central curve. It's the 'spine' of the leaf, so be conscious of that when you draw it. <br> <br>And finally, ask the client how they want to be perceived. Right now you've got a heavy bias towards modern, clean type, which makes me think that's what you're shooting for, but that will help the other decisions fall into place. <br> <br>Oh, and that secondary green/screen is too light. <br> <br>Generally, the 1-2 ideas aren't bad, they're just not great. Keep refining.</p>
    html_clean: <p>Jacob, first off, I'd ditch 3a-4b. I've seen this design a million times and it doesn't say 'landscaping' to me. <br> <br>Right now, I'd say 1a and 1b are stronger, as they are, than 2a and 2b. Only because the grass in the 2 versions looks more like hair to me. Otherwise, I prefer the visual concept in the 2s. Push the grass more towards blades, rather than spikes. <br> <br>I think 1a and 1b are a bit generic, but workable. Try to make the type and leaf feel like more of a unit, rather than type and a leaf. Also, the central vein in a leaf is just an extension of the stem, so you should draw them as one central curve. It's the 'spine' of the leaf, so be conscious of that when you draw it. <br> <br>And finally, ask the client how they want to be perceived. Right now you've got a heavy bias towards modern, clean type, which makes me think that's what you're shooting for, but that will help the other decisions fall into place. <br> <br>Oh, and that secondary green/screen is too light. <br> <br>Generally, the 1-2 ideas aren't bad, they're just not great. Keep refining.</p>
