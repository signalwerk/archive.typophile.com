    html: <p>Jacob, I agree with you that the grass looks unkempt. Also, it still reads as hair to me in 1a, 1b, and 2. Check out <a href="http://homepage.mac.com/rush723/school/home1.html">this image</a> to see what I mean by a blade of grass. Grass is essentially just long, narrow leaves. Like leaves, they start thin, swell, and come to a point. Your grass starts thick and comes to a point, more like a hair. The curve in 4 looks more like grass to me than the grass does. <br> <br>As Daniel pointed out, landscaping is not just about plants, but about <i>shaping</i> the land and the plant life on it. It's design as well, so more overt rhythm and pattern are probably ok as long as the forms feel natural. I'd pull away from your specific ideas and return to sketching and research for a bit.</p>
    html_clean: <p>Jacob, I agree with you that the grass looks unkempt. Also, it still reads as hair to me in 1a, 1b, and 2. Check out <a href="http://homepage.mac.com/rush723/school/home1.html" class="link-external">this image</a> to see what I mean by a blade of grass. Grass is essentially just long, narrow leaves. Like leaves, they start thin, swell, and come to a point. Your grass starts thick and comes to a point, more like a hair. The curve in 4 looks more like grass to me than the grass does. <br> <br>As Daniel pointed out, landscaping is not just about plants, but about <i>shaping</i> the land and the plant life on it. It's design as well, so more overt rhythm and pattern are probably ok as long as the forms feel natural. I'd pull away from your specific ideas and return to sketching and research for a bit.</p>
