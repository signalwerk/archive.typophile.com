    votes: null
    html: <p>Hello Andreas, <br> <br>It makes me happy to see people your age interested in font design! Is this done for a school project or just for fun? <br> <br>Your font is hard to critique because I'm not sure what you are trying to accomplish with it. There are a lot of geometric sans out there, and I have difficulty seeing what makes yours unique. The cap "S" is probably the most interesting letter simply because of its irregularities. Perhaps you could shake up the other characters as well?  <br> <br>Sometimes it helps to "file" a font and begin with a new one. Then you can return to the old one with a different perspective. <br> <br>Don't abandon it though. You just need to figure out what makes it unique. <br> <br> <br></p>
