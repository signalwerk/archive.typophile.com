    html: <p>This is a personal little project, just for fun. A friend of mine called Peter started studying typography at school and as soon as he told me about all the serif's, ligatures and so on I was hooked. <br> <br>At first i didn't really have any goals with magma more than to design my own first typeface and make it look good. It's really entertaining tho, so I'll keep developing typefaces. <br> <br>I'll try to make it a bit more unique.</p>
