    <p><a href="http://www.brandtags.net/" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.brandtags.net/" rel="nofollow"><img src="http://typophile.com/files/brand-tags_4158.png"></a></div><p></p>
    <p>The basic idea of <a href="http://www.brandtags.net/" rel="nofollow">Brand Tags</a> is that a brand exists entirely in people's heads. Therefore, whatever it is they say a brand is, is what it is.</p>
    <p>Try it out. You'll find it's very addicting. And it's even more interesting to see what tags emerge for companies like <a href="http://www.brandtags.net/browse.php?id=423" rel="nofollow">Barbie</a> or <a href="http://www.brandtags.net/browse.php?id=94" rel="nofollow">Volkswagen</a>.</p>
