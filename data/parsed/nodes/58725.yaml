      <p>@ Mr. Stötzner:<br>
      Sir, you're a master of your craft, for sure! I feel honored having met you in Dublin.</p>
      <p>Having said that, if the IPA version of Andron is álso to be used for copy text, I believe, that italic a won't work. Given, that quite often IPA is used quite interspersed in text (giving pronunciation of individual words) rather than whole passages (e.g. transcription of a recording), I believe something ought to be done about the a (but I might have missed arguments from previous discussions). — Not that I wouldn't love the outline of that italic a, it's beautiful — for some display or "fancy" font. [Yes, yes, IPA ís fancy..., I know].</p>
      <p>I actually reading about the back close approximant, I wanted to post a comment not to forget the connection between j and ɟ, however I see Peter picked up the issue already.</p>
      <p>I cannot share his view about the ɪ to be rather designed Turkish ı-like: his major concern is the ﬁ. However, an IPA specialist font should néver use glyph shapes for f, or for any character as a matter of fact, that need ligation. (Slight contextual shaping might be ok). The reason is clearly the abundance, alas, sprawling and spawning of diacritics in phonetic works. Best to use an f with a narrow ascender, as it has been already explored in 19th, 20th century metal type. </p>
      <p>Szabolcs</p>
