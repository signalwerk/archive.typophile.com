      <p>Peter: <em>What, in principle, would be the difference between a Reversed Open E designed with the IPA in mind, and a Cyrillic lowercase Ze?</em></p>
      <p>I don't think there is a difference ‘in principle’, but there may be a difference in the context of specific typefaces. Since most of the typefaces I design include both Latin and Cyrillic support, my usual approach to the reversed open e is to make it a composite of the lowercase Cyrillic ze, and then to test it alongside the other extended Latin letters and look at it relative to the open e. In many designs, this approach will work fine, but not in all.</p>
      <p>The treatment of terminals is such that the reversed open e is not, in fact, a flipped open e, even in a typeface with a vertical axis. The Cyrillic ze normatively has a serif terminal at the top in roman types (but not in italics) and a ball or similarly heavy terminal at the bottom <em>or a flourish terminal</em> (the latter is definitely not a candidate for the IPA letter). The presence of the serif at the top is useful in the IPA letter, since it helps make the distinction between the reversed open e and the turned open e (U+1D08). Here are the three forms in the Brill type, in which the reversed open e is (currently) a direct composite of the Cyrillic ze:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bropene_5389.jpg"></div><p></p>
