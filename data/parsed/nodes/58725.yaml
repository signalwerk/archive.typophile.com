    <p>Continuation from:<br>
    <a href="http://typophile.com/node/58118" title="http://typophile.com/node/58118">http://typophile.com/node/58118</a><br>
    <a href="http://typophile.com/node/58195" title="http://typophile.com/node/58195">http://typophile.com/node/58195</a></p>
    <p>Let me draft some conclusion from the two recent discussions.</p>
    <p>Aiming to meet <a href="/wiki/International%20Phonetic%20Alphabet" class="freelinking" rel="nofollow">IPA</a> font requirements the designer faces a range of particular challenges in terms of character coverage and glyph shaping. A special difficulty lies in the need to solve some Regular/Italics issues simultaneously with some Latin/Greek issues. Discussions revealed that obviously no entirely satisfying IPA typeface is known so far but we want to put meditation upon IPA misconceptions aside here and try to be pragmatic.</p>
    <p>Although I still find this kind of ghettoism not really good I announce the forthcoming release of a special Andron-IPA. This is how the glyphs discussed may appear in the two fonts:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Andron_ipa_glyphs_5347.jpg"></div><p></p>
    <p>(the depicted sequence is: /a/_/ae/_\0250\0251\0252/_/b\03B2/p/_/f/_\0192/_/g/_\0261/_\03B8/v/\03BD\028B\03C5/_\0278/phi1/phi/x\03C7 ; /_ is just a small space for optical reasons)</p>
    <p>I plan to include the entire Latin char. repertoire (except Vietnamese) and the basic Greek lowercase alphabet, alongside with Spacing Mod. Letters, Comb. Diacritical Marks and the 1DC0-block.</p>
    <p>A few questions remain:<br>
    1. Do you think the UPA blocks should be covered too?<br>
    2. Is there a need for Bold, Bold Italics and Small capitals (in extra fonts)?<br>
    3. The changed glyph for a (0061) causes repercussion for a number of precomposed characters, such as ä, å, à and the like. Are users aware of this?<br>
    4. Any further suggestions?</p>
