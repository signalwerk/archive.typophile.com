      <p>John, the 'turned m with right leg' should follow the same form as the 'turned m' in my opinion. It's because the sounds they represent are actually related, although that's hard to tell from the phonetic description alone.</p>
      <p>The 'turned m with right leg' is the symbol frequently used for a semivowel in Korean, the first component of 의, that corresponds to the close vowel represented by the 'turned m', 으. This is like the relationship between 'j' and 'i', or between 'w' and 'u' in IPA. Technically, these 'semivowels' behave as consonants and are called approximants to distinguish from 'true' semivowels, hence the phonetic description that obscures the relationship to the vowel sound.</p>
      <p>I agree that the 'turned m' should use a double-u form, as that's exactly how I think of it. The Korean vowel that is represented by that symbol is most often romanized with a variation of 'u', such as 'ŭ' or 'eu'.</p>
