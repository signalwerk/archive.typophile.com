      <p>I need to return to the a-problem. There are some statements about how to deal with the italic a-diacritics: </p>
      <p>Jongseong: <cite>”an IPA-specific font will only be used for IPA and orthographies based on the IPA. For the IPA, you don’t need to worry about ä, å, à, etc. since they are not part of the IPA.“</cite></p>
      <p>Peter Farago: <cite>”The remapping of italic characters will make an IPA-specific version of Andron useless for body text, so you would only need to worry about the IPA diacritics, and could safely ignore the extended Latin variants of the letter a.“</cite></p>
      <p>Theunis de Jong: <cite>”A-ring is not an IPA character, but you should be prepared to have any amount […] of diacritics attached.“</cite></p>
      <p>There seem two concepts competing unconciously: a) an IPA-font has to be seen as an ”IPA-only-font“, ignore anything not IPA-specific. b) Provide as much characters as you can to add value to the font.</p>
      <p>In my opinion it is reprehensible to dwell on the ”Splendid-isolation“ concept for IPA fonts. The IPA character set is genetically connected to Latin, some glyphs are related to Greek and Cyrillic, a selection is used in proprietary mixtures for certain orthographies …  Following that scenario the font designer shall aim to accomodate any of the possible uses of the font, of which IPA use is *one only*.<br>
      So, how to deal best with the italic a diacritics?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Andron_aaa_italic_5561.jpg"></div><p></p>
