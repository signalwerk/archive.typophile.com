      <p><em>Is that really important? It could be changed too but it would not look good. There is *a reason* for this detail. Maybe you’re not used to it, but would it really do harm in this form?</em></p>
      <p>There are basically two ways to look at this. As Charles said in the previous thread, the rotated characters were originally simply sorts that had been physically rotated 180°. As such, they would have the serif structure of the original glyphs from which they were derived. An approach faithful to the original use of metal type would probably do the same thing, but in this case I don't think that nostalgic verisimilitude would have any broad appeal.</p>
      <p>The seemingly rotationally symmetric letters in our latin script (p/d, b/q, n/u, and to some extent f/j, s, x, z) are of course not actually symmetric - their serif structure changes to reflect their historically hand-drawn forms, and give a since of orientation and gravity to the face. Victor Gaultney applied these principles to the turned glyphs in Gentium to good effect. I think the same reasoning could be applied to a more traditional typeface like Andron. (Maybe Matthew will show you his take on the issue in Corunna.)</p>
      <p>Redrawing the glyphs would be a lot of work, the effort unlikely to be noticed by the average linguist, and would be largely without precedent among current IPA faces. Aesthetically, however, it's the right thing to do.</p>
