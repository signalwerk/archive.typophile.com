      <p>I've tried a variety of different styles for the rotated letters (for example, finishing the rotate a with the same stroke as an e/c, or the rotate a, or more similar to the top of the c or r) before settling on that one.  I don't really consider any solution perfect yet, obviously, these are characters that haven't gone through the millions of iterations that the rest of the alphabet has to "fit" in the alphabet, so I'm not trying to push my solution as "the" solution, just one of many.  While Theunis finds the double-u form weird, I've generally found the rotated form weirder (though the flat top-left serifs on brill make it much less distracting)</p>
      <p>I'm somewhat of the opinion that the reason many of these rotated shapes have been canonized is in large part due to there not being a major linguist who is also greatly interested in typography who sat down and looked at things as in depth as, say, Knuth did with mathematics and essentially defined the standard.  For that reason I think most linguists would be quite open to seeing different designs -- the problem is until very recently not many people have tried.  Many will be willing to help out time-permitting, I've been consulting with a few including some who have been happily sending me pages of IPA text to test out newer versions.</p>
