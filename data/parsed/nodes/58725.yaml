      <p>1. I do not know any practicing Uralicists, so I can't say. I have a healthy-sized overview of the Uralic language family written by various authors, and each seems to use a fairly ad-hoc system of notation. I could provide you an overview of each author's conventions, but I don't know how representative it is of the field and don't want to give you any wrong impressions.</p>
      <p>2a. Bold is the canonical way of emphasizing IPA text. Its inclusion is important.<br>
      2b. Bold Italic would be a nice thing to have; I have occasionally had use for it.<br>
      2c. There is no tradition of setting IPA in caps, and to do so would be extraordinarily challenging. This is probably best avoided.</p>
      <p>3. The remapping of italic characters will make an IPA-specific version of Andron useless for body text, so you would only need to worry about the IPA diacritics, and could safely ignore the extended Latin variants of the letter a.</p>
      <p>4. Some of your character shapes remain problematic. The right-facing serif on italic b is potentially confusable with ɓ. The bottom serif on ɑ should match d; likewise the top serif of ɒ should match p. I am still not sold on the shape your italic a - you mentioned that you found it in a medievalist scribal variation. Have you considered looking for double-story as in modern chancery hands?</p>
