    html: <p>A trick for the open e.  Take the c and redraw the curves so that there is no extrema on the left hand side (eg, you have points at 12o'clock and 6 o'clock, with the terminals at 1-2 o'clock and 4-5 o'clock).  Now you can "squash" the c by simply moving the bottom part up and the curve will almost perfectly maintain its weight.  Repeat and drop it and come up with a nice middle section.  You'll need to tweak it a bit still probably, but it gets 95% of the work done quickly.</p>
