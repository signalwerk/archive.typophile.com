    html: <p>The serifed upper terminal seems to be more characteristic of uppercase forms (compare latin C with c). Since most of the Cyrillic lowercase is just a scaled-down version of the uppercase, with the uppercase serif structure intact, and since the IPA is meant to harmonize with the latin lowercase (with the above-noted exception of the small cap letters), I really do wonder what the appropriate structure is. Should the upper terminal resemble the arm of a lowercase a? Should the lower terminal resemble the arm of the lowercase script g? Should the upper terminal be undecorated with a ball terminal on the bottom, to resemble a turned c? Or does the Cyrillic form just look right in the lowercase latin context?</p>
