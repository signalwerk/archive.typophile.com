      <p>So far unmentioned, but I think your IPA chars are <em>beautifully</em> drawn. There.</p>
      <p>I'm having some reservations on the italic 'a' -- I like it, but the authors I work with are a fussy lot.</p>
      <p><cite>3. The changed glyph for a (0061) causes repercussion for a number of precomposed characters, such as ä, å, à and the like. Are users aware of this?</cite></p>
      <p>Probably not. To differentiate unambiguously between regular 'a' and the script one ('alpha'), they simply expect a slanted 'a', even in combos such as 'æ'. A-ring is not an IPA character, but you should be prepared to have any amount (sane or insane) of diacritics attached.<br>
      (Extending up to the 'ɨ' -- the 'stroked i'. Create one without the dot.)</p>
      <p>I'm with Charles, I've never seen the IPA character set in use as small caps. It wouldn't work -- there is a number of IPA glyphs that are already used as small caps. Unfortunately, writers HAVE discovered the benefits of bold and bold italics.</p>
      <p>Do you have any insights on creating a glottal stop? It probably should use the '?' glyph as a base form, and it occurs both mirrored and vertically swapped -- all 4 orientations.</p>
