      <p>None of what follows is really a font designers problem, but those of us who set type are apt to run into all sorts of strange constructions, requiring "accents" in all sorts of places, and over all sorts of characters, including IPA characters.</p>
      <p>One that comes to mind, dimly, and with pain, was an issue of <cite>Poetics Today</cite>, where authors were trying to analyze sounds, metrics, rhythm patters, perhaps in new ways, and all mixed together. Best I could tell, they borrowed from every font file they could think of, to come up with symbols &amp; accents that 'sort of' represented what they were talking about.</p>
      <p>This one became an exception to our policy that all issues of a journal are charged at the same rate. And a little flag to me that you can never have too many characters in a font . . .</p>
