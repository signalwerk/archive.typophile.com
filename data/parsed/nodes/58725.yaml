      <p>One thing to remember about phonetic characters "borrowed" for other uses -- such as the written form for languages that historically never had a written form -- is that acute, grave, and macron are often used to signal tone, rising, falling, and the macron sometimes used for either no tone, or, perversely, a hard vowel. If you're going to do an IPA version, it might be well to include the accents, too.</p>
      <p>* * *</p>
      <p>I agree it is a beautiful font, and worth the money. Unfortunately, these days my customers (1) won't use a font they don't have on their computer, and (2) seemingly won't buy anything over US $39.95. For example, I bought Trinite to set some books for Richard Eckersley; unfortunately, while many current designers admire the font, none will buy it &amp; it sits primarily unused, unless I do the design as well as the composition for a book.</p>
