      <p>That's spot on for the problem with a lot of the IPA set: although the turned 'm' technically is based on the 'u', it has historically been represented by ... a turned 'm'. No doubt for the simple reason that could be done pre-outlined-fonts with some cut-and-paste (or, in extremis, by re-inserting the paper upside down into your typewriter and typing an 'm').</p>
      <p>"IPA symbol is a turned letter m, although given its relation to the sound represented by the letter u, it can be considered a u with an extra "bowl"." (<a class="freelinking external" href="http://en.wikipedia.org/wiki/Close_back_unrounded_vowel" rel="nofollow">http://en.wikipedia.org/wiki/Close_back_unrounded_vowel</a>)</p>
      <p>So in a typographic and technical sense, Matt (Guifa) is right to draw a double 'u', but alas ... it looks weird, and the fussy lot I referred to earlier will surely <em>demand</em> their usual 'm'.</p>
