      <p>To address an as-yet unanswered question:<br>
      <em>Do you have any insights on creating a glottal stop? It probably should use the ’?’ glyph as a base form, and it occurs both mirrored and vertically swapped — all 4 orientations.</em></p>
      <p>Predictably, its not necessarily as simple as that. It depends on what language, what orthography, is being supported.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/huronia_glottals_6594.png"></div><p></p>
      <p>Here are a few of the options. In this case, somewhat Americanist-centric (that is, these are glottals used for American orthographies) and may exclude some. There are a couple of major distinctions; glottalization of a base character, usually with a comma accent. Non-diacritic glottals are various and sundry. Of those shown, only the last two have no encoding, not withstanding potential smallcap forms. Of course, regional preferences may influence particular modifications, which may or may not mean using a differently encoded form, or stylistic alternate (eg. whether or not a lowercase glottal has a serif on the bottom or not in a otherwise seriffed font).</p>
