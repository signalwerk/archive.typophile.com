      <p>Jongseong:</p>
      <p><em>...the fussy lot I referred to earlier will surely demand their usual ’m’.</em></p>
      <p>My concern is that the change in detail might imperceptively hinder the identification of the symbol for those who think of it as an upside-down r.</p>
      <p>Really, I wouldn't worry too much. It makes sense for an editor to be fussy about preserving meaningful contrasts in letter shape (like a vs. ɑ, and v vs. ʋ vs. u), and it makes sense for a typographer to worry about making the Greek characters harmonize with the Latin, but I don't think any editor is likely to be bothered by altering the serif structure, which is not by itself meaningful, and the harmonization of serif structure on the turned letters is generally pleasing.</p>
      <p>So, I vote for the modified r series. The same goes especially for ɟ and ʄ, which should really be based on a stroked dotless j and not a turned f, and for ʌ, whose vertex ought to mirror capital A, not lowercase v. Not quite sure what to do about the ascender on ʎ, though, since nothing else in the lowercase alphabet has a diagonal ascender. Should it resemble the ascender on f? The ascender on ð? Should it keep its turned-y form?</p>
      <p>The one exception is the small cap letters, as you point out. I had a long think about what the best way to deal with them is, and I fully agree that they must retain the serif structure of their uppercase counterparts. Various authors have substituted the Turkish undotted i (ı) or a latinized iota (which usually looks something like a short, uncrossed t) for IPA [ɪ]. Pullum and Ladusaw say that the latin iota is obsolete in the Phonetic Symbol Guide, and undotted i presents obvious problems for fonts which need fi ligatures which are frankly too irritating to deal with. (There is part of me that still wants to see what ʙ, ɢ, ʛ, ʜ, ɪ, ɴ, ɶ, ʀ, ʁ, and ʏ look like in a parallel universe where they lived as minuscules their whole lives. I do realize that this is a ridiculous premise, though. Their shapes look horrible sandwiched between the baseline and x-height. The International Phonetic Association is made of phoneticians, not typographers.)</p>
      <p><em>On Open E</em></p>
      <p>Does anyone think that that stealing Cyrillic Small Letter Ze (з) for Latin Small Letter Reversed Open E (ɜ) is a reasonable course of action?</p>
      <p>[Edit: Apologies for posting weirdness: I edited my post and I think it became reordered with respect to Charles reply]</p>
