      <p>Andreas, an IPA-specific font will only be used for IPA and orthographies based on the IPA. For the IPA, you don't need to worry about ä, å, à, etc. since they are not part of the IPA.</p>
      <p>There are cases in African orthographies for example that distinguish a and ɑ, and it is conceivable that diacritics may be used for such purposes as marking tones. In that case, you would need separate a with acute accent, ɑ with acute accent, etc. I doubt that any orthography that distinguishes a and ɑ also needs the combining ring diacritic above for either of them, but who knows.</p>
      <p>The point that Peter makes is that not counting these very specialist uses, no one will use an IPA-specific font for the body text in any language that normally prefers a single-storey a for the italic, so you don't normally have to worry about ä, å, à, etc.</p>
