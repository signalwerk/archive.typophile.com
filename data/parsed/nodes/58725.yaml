    html: "<p>In roman type there are typically two kinds of termination to horizontal strokes or curves: a vertical serif terminal and some form of heavier terminal (lacrymal, ball, wedge, etc.). Both are used in lowercase letters, with the serif terminal typically found in the lowercase s <em>regardless of which terminal form is found elsewhere in a, c, etc..</em> Hence, I don't find the vertical serif at the top of the reversed open e to be alien to the Latin lowercase.</p>"
