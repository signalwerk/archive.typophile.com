    <p>Dear Typophiles,</p>
    <p>We are looking for a font to be used in a film.  This film "stars" a computer operating system of the future.</p>
    <p>We're looking for a font that we can use for subtitles etc,  that gives the right feel - futuristic and computery, and that is also easy to read as there will be quite a lot of text. </p>
    <p>Can anyone recommend a font please?</p>
    <p>Look forward to hearing from you.</p>
    <p>Kind regards<br>
    Neil</p>
