      <p><a href="http://www.kontrapunkt.dk/" rel="nofollow">Kontrapunkt</a>.</p>
      <p>Probably not the actual standard for the next hundred years, but it should look right for today's audience, which is what you need. Clean and sophisticated geometry, not the... traditional concept of a futuristic look, based on brutish screen fonts of yesteryear (I believe this paradox is also what Cuttlefish had in mind).</p>
