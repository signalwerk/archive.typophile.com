    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Olida-Poster_4804.png"></div><p></p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/insigne/olidia/" rel="nofollow">Olidia</a> is a script with tall sweeping ascenders packed with alternates and ligatures.</p>
    <p>Olidia Pro includes over 40 alternate characters and 20 ligatures. This allows designers to mix and match characters to create luxurious and graceful custom logotypes and headlines in OpenType capable applications such as Adobe‚s CS suite or QuarkXpress.</p>
    <p>These alternates are also available in limited preset fonts that are available separately. Olidia Alternate One is highly ornamental, with plenty of sweeping ascenders and descenders, while Olidia Alternate Two is much more restrained and can be used for body copy. The Third strikes a balance between the two sets.</p>
    <p>Olidia Pro OpenType features include ending swashes, ornaments, ligatures, discretionary ligatures, titling alternates, contextual alternates, style sets and stylistic alternates. See the sample .pdf as a reference to quickly access desired alternate sets.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Biscuit-Boodle-Poster_5790.png"></div><p></p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/insigne/biscuit-boodle-ornaments/" rel="nofollow">Biscuit Boodle Ornaments</a> are the ornament complement to <a class="freelinking external" href="http://new.myfonts.com/fonts/insigne/biscuit-boodle/" rel="nofollow">Biscuit Boodle</a>, a fun and uplifting brush-drawn script.</p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/insigne/biscuit-boodle-ornaments/" rel="nofollow">Biscuit Boodle Ornaments</a> offer a total of 72 vignettes, crests, fleurons, frames and many other useful ornaments. These ornaments were brush-drawn by Portland Studios‚ Illustrator Justin Gerard and have just a slight amount of natural texture. These energetic and lively ornaments can be resized and rotated easily without any loss of quality and can easily be converted to outlines and modified.</p>
    <p>Combine them to form unique compositions or insert them into text to add some excitement to your designs. Please see the sample .pdf to see all 72 ornaments in action.</p>
