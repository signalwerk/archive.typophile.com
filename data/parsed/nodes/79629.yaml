    html: <p>Might well be one of many helvetica/standard derivates used by printshops that never made it digital... Better bet is to go for something close, and see if you can modify it accordingly. There are so many of these fonts out there, thats it's very hard to find exactly this one. But good luck if you want to keep trying... Try searching MyFonts or Identifont for similar fonts to Helvetica condensed. And remind yourself that this is from the sxties, so you can exlude a lot of younger helveticans.</p>
