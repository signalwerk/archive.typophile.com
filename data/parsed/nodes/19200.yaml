      <p>It would be helpful to know also which fonts are you using – font files, not typeface design – because the problem could be the compatibility with the application.<br>
      There's also a different encoding problem. Traditional Chinese is mainly using a BIG5 encoding while simplified characters use the GB2312, but there are some font sets available in GB2312 that include also traditional character. Using those might be simpler because you can switch between the two just selecting a different font.</p>
      <p>InDesign is more problematic because it works very well only with few fonts otherwise you need a plug-in (InChinese – <a href="http://www.inchinese.com/eng/index.html" title="http://www.inchinese.com/eng/index.html">http://www.inchinese.com/eng/index.html</a>) and there still problems in pre-press. Keep in mind that most of mainland China still stuck on OS9 and Pagemaker 6.5 Chinese version.</p>
