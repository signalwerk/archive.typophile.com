      <p>Interesting. Thanks.</p>
      <p>Actually, part of the problem is also that I've found a specific, stylized font that best suits the job, and marries well stylistically and historically with the latin alphabet I have chosen. The job is setting film title credits, the key being that they have to be both in Chinese AND english.</p>
      <p>So, basically, I'm trying to make a "less-than-ideally-functional" font function, for the sake of the style that we found, and sold the client on. It looks great. Hopefully I can make it work. It looks like we may have to create a few select characters from scratch. No big deal. I just have learn some Chinese.</p>
