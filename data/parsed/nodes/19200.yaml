      <p>If you want to waste some time reading about Chinese characters encoding standards this might interests you:<br>
      <a href="http://www.foundertype.com/english/web/standard/index.htm" title="http://www.foundertype.com/english/web/standard/index.htm">http://www.foundertype.com/english/web/standard/index.htm</a></p>
      <p>Nice work you're doing. Matching roman characters with asian ideograms is always a challenge, especially when it comes to Chinese since compared to what we're used for western language, there's an absolute lack of type design (I know I often cry about this, but it can be really frustrating).<br>
      And if to be uselessly picky historically the two design are separated by at least a thousand years, for sure there's a interesting link since the Chinese design you're using seems to recall the old bone scripts, used to cast oracles and write prophecies...</p>
