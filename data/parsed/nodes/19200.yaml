      <p>It's tough. Even to chinese speaker, chinese character seems to have a lot of repeating elements. But when implementing into a font, they all display small differences. And it's hard to go over thousands of glyph and audit it one by one, leave alone hint them. It seems all chinese/kanji fonts are concentrated only on variations of a few existing styles. And those style to me, dont do justice to a language belongs to the inventor of the printing press. I guess they just lack the willingness to venture to new styles.<br>
      P.S. The font you have chosen is a typeface originated in Japan.</p>
