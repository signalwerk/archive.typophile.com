    <p>Help!</p>
    <p>I have (at least) a couple of issues I need help with, regarding the use of Chinese fonts, and Adobe software.</p>
    <p>1. I am having a hell of a time simply getting Chinese fonts to display in both/either Traditional and simplified, and once I get them, keeping them displayed.</p>
    <p>2. While I am typesetting these fonts in Illustrator, My Mac eventually wants to stop letting me use keyboard shortcuts - in any Adobe software that Ii have running at the time. I can't get the use of them back until I quit and re-start the software, assuming I'm not re-opening a file with that particular Chinese font in it.</p>
    <p>Any help is greatly appreciated.</p>
    <p>-Breck</p>
    <p>p.s. for the record, I don't speak or read the language.</p>
