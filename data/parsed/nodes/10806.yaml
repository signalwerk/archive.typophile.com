  html: <p>Not to distract too much from the other quizzes going on, I thought this might be fun as a serial pop quiz. Like the others, the person who ids correctly gets to post the next id. The point of this id quiz is to show a detail of one character and see who can correctly identify both the letter and the typeface. Given that it's only a detail, I think WhatTheFont will be baffled; ergo, you gotta know it to id it. This is probably an easy one, but I thought I'd get the ball rolling. <br> <br><img src="http://www.typophile.com/forums/messages/83/7877.gif" alt="popquiz"> <br> <br>In other news, I miss Yves. But he's on a break, so you up-and-comers have a good shot at it.</p>
