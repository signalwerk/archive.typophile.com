    date_raw: 21 Mar 2003 — 11:06am
    votes: null
    html: "<p>Ha! Yes, no offense to the estimable John Hudson, but I draw no distinction between admitted guesses and unadmitted guesses. It's kind of like the fundamentalist-Christian friend I had in high school who, every time he wanted to cuss, said, \"Bleepity-bleep-bleep-bleep.\" (This was before <i>The Simpsons</i>, mind you.) I used to respond, \"Dwayne, you know the actual cuss words are floating around in your head. You think God only hears what you actually say?\" <br> <br>Since we're all here to share and learn from each other, we have to make guesses and sometimes be wrong; otherwise, we're not learning anything. Better to admit the guess than to pretend to knowledge one doesn't have, no? <br> <br>So the long answer to your short question is: yes, all guesses are welcome. The more the merrier.</p>"
