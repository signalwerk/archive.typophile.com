  html: "<p>I'm now into my second year of a visual communications degree, and a particular question (although probably a very old, tired one) has been eating away at me since day one. It is: <br> <br>Does anyone outside of a relatively small (tiny, even) group: typographers, type/design students, type nuts, and so on, <i>notice</i> or <i>care</i> about good, mediocre, or even bad type? <br> <br>Personally, I know that two or three years ago I never noticed smart quotes, I preferred Arial to Helvetica, and if anyone suggested the idea of an aesthetically pleasing rag to me, I would've laughed at them. Thoughts?</p>"
  html_clean: "<p>I'm now into my second year of a visual communications degree, and a particular question (although probably a very old, tired one) has been eating away at me since day one. It is: <br> <br>Does anyone outside of a relatively small (tiny, even) group: typographers, type/design students, type nuts, and so on, <i>notice</i> or <i>care</i> about good, mediocre, or even bad type? <br> <br>Personally, I know that two or three years ago I never noticed smart quotes, I preferred Arial to Helvetica, and if anyone suggested the idea of an aesthetically pleasing rag to me, I would've laughed at them. Thoughts?</p>"
