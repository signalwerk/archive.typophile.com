    html: "<p>Does anyone outside of a relatively small (tiny, even) group: typographers, type/design students, type nuts, and so on, notice or care about good, mediocre, or even bad type? <br> <br>Type is funny. It is one of the things that essentially have to <br>embody form and function in order to be. It even performs <br>at it's worst - most typefaces/typography can usually be  <br>understood when employed terribly. I really think that this <br>quote is suitable whenever this sort of question comes up: <br> <br> \"The graphic signs called letters are so completely blended with the stream of written thought that their presence therein is as unperceived as the ticking of a clock in the measurement of time. Only by an effort of attention does the layman discover that they exist at all. It comes to him as a surprise that these signs should be a matter of concern to any one of the crafts of men. <br> <br> But to be concerned with the shapes of letters is to work in an ancient and fundamental material. The qualities of letter forms at their best are the qualities of a classic time: order, simplicity, grace. To try to learn and repeat their excellence is to put oneself under training in the most severe school of design.\" <br> <br></p>"
