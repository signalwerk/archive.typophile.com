    html: <p>&gt; <i>Personally, I know that two or three years ago I never noticed smart quotes, I preferred Arial to Helvetica, and if anyone suggested the idea of an aesthetically pleasing rag to me, I would've laughed at them. Thoughts? </i> <br> <br>The essence of discrimination lies in education. Although a couple of years ago straight quotes wouldn't have bothered you, you would probably find them distracting today. Similarly, a copy editor soon becomes put off by previously unnoticed "mistakes" in using "which" and "that." To Westerners Chinese painting at first all looks alike, but one comes to recognize and appreciate Northern Song landscapes. Possible examples are endless. <br> <br>With the scandalous decline in education in this country (the U.S.) any sort of discrimination on any subject (with the possible exception of pro wrestling) is less and less likely. But there will still be people who notice, and care. <br></p>
