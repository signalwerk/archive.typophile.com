    html: "<p>No one notices, at least not to the point that  they know they notice. Things can be taken too far and perfected to please the in-crowd, but I think readability is mostly subliminal. <br> <br>Just for example, a magazine I've seen for years did a slight redesign a few months back. There was just a little more leading in the body copy, same font, same point size. I noticed it because they had also changed the headline font and some rules along the sides of the body copy. I showed it to my wife and she said she had particularly enjoyed that issue and read it more thoroughly than usual, and felt it was easier reading somehow but couldn't put her finger on it. So small things can make a difference without being highly noticeable. <br> <br>Here's a short answer: obviously no one cares as evidenced by the amount of comic sans being used anywhere and everywhere.</p>"
    html_clean: "<p>No one notices, at least not to the point that  they know they notice. Things can be taken too far and perfected to please the in-crowd, but I think readability is mostly subliminal. <br> <br>Just for example, a magazine I've seen for years did a slight redesign a few months back. There was just a little more leading in the body copy, same font, same point size. I noticed it because they had also changed the headline font and some rules along the sides of the body copy. I showed it to my wife and she said she had particularly enjoyed that issue and read it more thoroughly than usual, and felt it was easier reading somehow but couldn't put her finger on it. So small things can make a difference without being highly noticeable. <br> <br>Here's a short answer: obviously no one cares as evidenced by the amount of comic sans being used anywhere and everywhere.</p>"
