    html: "<p>Interestingly, if you continue the WAD essay quoted by Kris, you'll find he goes on to say: <br> <br>\"By a remarkable paradox the one person who should not be called upon to perceive the fine qualities of the shapes of letters is the person who reads them. The person who reads printing should not be conscious that the page he reads is made up of letters. If any single character presents itself to his attention <i>as</i> a single character, the process of reading is disturbed. <br> <br>\"The kind of letter to which a reader is accustomed is the best kind of letter for the reader. But this fact must not be allowed to limit the effort of the designer toward better design. If the reader is used to bad design, he must be led to accustom himself to better design. It is at this point that the printer enters the equation.[*] However little attention the reader needs to pay to the design of letters, it is obviously most necessary that the person who makes printing should be able to criticise and assess the qualities of letter forms.\" <br> <br>* Keep in mind that when this was written (1919), there wasn't yet a clearly distinct profession of \"graphic designer\" separate from the printer/compositor. In fact, it wasn't until a few years later that Dwiggins coined the term \"graphic design\". <br> <br>-- K. <br></p>"
