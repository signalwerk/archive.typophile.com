    html: <p>I agree.  Most may not care/know what it is but they certainly notice something, be it readability or gimmickry.  <br> <br>And they're certainly intrigued enough with fonts. You don't have to look far to find fliers, etc. crammed with 15 different, cutesy display faces. "Oooh! I like that, that and that!"  <br> <br>The end result may be a trainwreck but it's obvious somebody must've noticed something or else the whole thing would've been set in Times. <br> <br>Either way, once you become aware of good typography, there's no going back. Bad typography is as grating to the eye as mangled grammar is to the ear.</p>
