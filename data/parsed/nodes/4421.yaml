    html: "<p>Well, I guess in turn I could be misinterpreting Warde; but from what I gather the \"must not\" comes from the \"cannot\": the supposition is that a text font that tries to be expressive is no longer a text font. In the superficial, conscious meaning of \"expressive\" I might actually agree, but I can't be so dismissive of the receptiveness of the subconscious to visual stimuli. For example, I believe the shapes of the serifs in Charter versus Times make a difference in the mood they convey, but certainly Warde and company would consider both text faces. In truth, to me Times is actually less of a text face! But Warde (and maybe even Morison) could never see that. <br> <br>Then there's the issue of whether a human being can totally avoid expressing himself - in whatever small way. Sure, formalizing the expression and making it explicit leads away from Craft and towards Art, but when the creator and the consumer of something are both human, how can expression not be an ingredient? <br> <br>hhp <br></p>"
