    <p>I have been the Senior Graphic Design Lecturer for the Commercial Arts Training College on the Gold Coast (Queensland Australia), for the last 6 years. CATC has just been acquired by Think Education in the past 12 months.</p>
    <p>I am craving any feed back regarding your experiences with our companies,<br>
    possible suggestions for new curriculum</p>
    <p>Any comments welcome</p>
    <p> CATC is going through rebrand, I will post the stages of development, Stay tuned.</p>
    <p>Shane Blackwell</p>
