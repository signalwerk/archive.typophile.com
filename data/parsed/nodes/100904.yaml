    <p>Hi there, I would like to share the link to the online version of the "Centro di Documentazione sul Progetto Grafico" by AIAP, Italy's main graphic design association. It features a saucerful of stuff - from book covers to type specimens - from some of the greatest XX century graphic designers and type/graphic industries and agency (click on the links on the left to browse the single collections):</p>
    <p><a href="http://www.aiap.it/cdpg?IDsubarea=169" title="http://www.aiap.it/cdpg?IDsubarea=169">http://www.aiap.it/cdpg?IDsubarea=169</a></p>
    <p>The real archive is located in Milan and can be visited on request.</p>
