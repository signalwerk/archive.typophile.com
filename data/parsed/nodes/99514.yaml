    html: |-
      <p>Most graphic designers would agree with Fred Goudy that letterspacing is wack.<br>
      But turn a blind eye to its use in justiﬁcation.<br>
      Tolbert Lanston initially invented a method of justiﬁcation by letterspacing, for the Monotype, but the look of it was rejected by typographers.<br>
      However, when Quark and InDesign introduced justiﬁcation with letterspacing in the default, there was no such outcry, so we’re stuck with it as a norm.<br>
      It’s especially inappropriate for oldstyle revivals, which are the ones that have the fancy ligatures (see sample above).</p>
