    html: '<p>Agree with Darrel. Definitely hand-drawn. This kind of type treatment is known as "interlock". Having a look to fonts <a class="freelinking external" href="http://www.myfonts.com/search/tag%3Ainterlock" rel="nofollow">tagged as it</a> at MyFonts might be helpful: Sinzano, Mister Sirloin, Darkheart, Master of Poster, Croteau...</p>'
