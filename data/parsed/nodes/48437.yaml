    html: <p>Renner himself in his 1922 book "Typografie als Kunst." Before he did the first drawing for what would become Futura he said that all of European writing is based on Roman versals, that were themselves defined by the most basic and distinct of graphic forms; the circle, the square, and the triangle. Covered in my thesis. <a href="http://typophile.com/node/18165" title="http://typophile.com/node/18165">http://typophile.com/node/18165</a></p>
