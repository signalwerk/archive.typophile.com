    html: <p>Yes. Titillium is a similar nice replacement for your needs. I also would suggest Ubuntu. <a href="http://font.ubuntu.com/" title="http://font.ubuntu.com/">http://font.ubuntu.com/</a> or Oblik Bold (free) <a href="http://www.fontspring.com/fonts/tour-de-force/oblik" title="http://www.fontspring.com/fonts/tour-de-force/oblik">http://www.fontspring.com/fonts/tour-de-force/oblik</a> <a href="http://new.myfonts.com/fonts/tdf/oblik/" title="http://new.myfonts.com/fonts/tdf/oblik/">http://new.myfonts.com/fonts/tdf/oblik/</a> that are also very professional and with complete character sets.</p>
