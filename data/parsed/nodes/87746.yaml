  html: |-
    <p>I'm currently working at a public service office, and up until now we've been using the Neo Sans font for posters, brochures etc. But we've decided it's best to open up for most of the employers to use font stated as our official font (from the graphic profile). And for now the budgets don't work well with buying license for Neo Sans for hundreds of people.</p>
    <p>So my question is this. Is there a font similar to Neo Sans (including letters like æ, ø and å) that is free of use available?</p>
