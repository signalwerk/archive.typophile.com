  html: |-
    <p>hello folks,</p>
    <p>i'm building a font with a lot of alternative glyphs. i wrote a custom encoding file, with a list of alternative glyphs, each with a name suffix, e.g. Ccedilla.gt or Eogonek.ro.</p>
    <p>however, when i select this encoding in the font window, in few cases, it shows the default glyphs in places where the alternatives should be. even when i actually create the alternative glyph, it still remains out of place. have anyone experienced this? does anyone know any solution?</p>
    <p>thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screen shot 2012-10-16 at 17_5423.05.30.png"></div><p></p>
