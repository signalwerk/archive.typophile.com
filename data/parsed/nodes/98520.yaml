      <p>I'm not an expert, but Perpetua seems right to me.</p>
      <p>There is also <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Bitstream&amp;ffam=Lapidary333%20BT%20-%20Bold&amp;fid=c91cc79296cc0e8a156a18caad42cc74&amp;fsize=48&amp;text=What%20does%20possesion%20mean%20to%20you%3F&amp;wrap=2" rel="nofollow">Lapidary 333 BT (Bold)</a></strong> by Eric Gill (available from Bitstream) which looks like a Perpetua's clone.<br>
      I think this belongs to the "name copyright game" played by Bitstream, Monotype, Adobe etc. before Bistream &amp; Monotype unified into the big monopoly they are now.</p>
