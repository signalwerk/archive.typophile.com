  html: |-
    <p>The international Encore Magazine combines art, design and film. The editorial team from around Germany together with freelancers and scouts from all over the globe track down attractive events, innovative products, trends and artists to present them each month in an informative, entertaining and inspirational way.</p>
    <p>Encore Magazine is published using the Macromedia Flash format. Multimedia elements like videos and sounds are included with interactivity and animations.</p>
    <p>Co-founder and co-publisher:<br>
    Daniel Harrington and Pascal Jeschke </p>
    <p>The Team:<br>
    Thorsten Konrad, Lars Lehner, Simon Schories and Patrick Marc Sommer</p>
    <p><a href="http://www.encore-mag.com/" title="http://www.encore-mag.com/">http://www.encore-mag.com/</a></p>
