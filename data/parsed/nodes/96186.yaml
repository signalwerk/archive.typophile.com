  html: |-
    <p>Hi, I have searched the web and New Bodoni DT-Book is the closest I have come to solving this riddle: all of MK's books, when under his control,  seem to be set in the same typefacte. Also, in his critical work Testaments betrayed, he mentions how critical typeface should be for an author, and how Kafka's express wishes for a tall typeface were ignored by publishers seeking to cram as many words onto the page as possible.</p>
    <p>Cheers and thanks for helping!</p>
    <p>Bill</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Capture_4491.JPG"></div><p></p>
