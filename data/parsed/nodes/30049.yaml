    votes: null
    html: <p>I'm from Texas, and I would say UNT (University of North Texas) would be your best bet. It's one of the strongest design schools in Texas. If you ask me, a lot of their work can be very expected and redundant, but the type is usually handled very well. It's in Denton, a small town near Dallas, which has a very strong design community. Not too terribly far from Austin. Good luck!</p>
