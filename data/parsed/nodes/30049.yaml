    html: <p>I realize this was almost one year ago, but I live in Louisiana and hear good things about University of North Texas from time to time. I attend Northwestern State University of Louisiana, and can't <em>not</em> recommend it enough. Not that the professors are bad, but the rest of the faculty is simply out-and-out useless if you ever have a problem that it is their job to solve (which you will, because they are completely inept.)</p>
