    <p>Does anyone know of and recommend any schools with typography programs in Texas? </p>
    <p>I live in Austin, TX and my addiction to type design grows stronger every day. Problem is, I have no formal education on the subject. Books have been a lot of help, but I would really like to take some classes or in some way learn from someone more learned than I.</p>
    <p>Also, are there any Texas based type foundries or studios that perhaps I could look into?</p>
    <p>Thanks for any information you can provide,</p>
    <p>Duncan</p>
