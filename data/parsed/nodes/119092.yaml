    html: |-
      <p>If you're talking about the space between those squares of color, 12 or 13 pts might work fine. But I'd use more for the outer margins, and I'd normally like to see more between columns of text.</p>
      <p>Grids are fine, but as Riccardo mentioned they are more for larger projects, like pages of text or several documents that need to look similar. For a small project like this I'd just space things to look attractive.</p>
