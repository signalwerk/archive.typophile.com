    html: |-
      <p>&gt; the gray and the black are so close in value</p>
      <p>Exactly. When two colors are very close but don't quite match, it looks like a mistake. Either make them the same or definitely different.</p>
      <p>Same thing when 2 objects almost align but not quite, or 2 lines of adjacent type are just a tiny bit different in size. There are exceptions, but in general it looks like a mistake.</p>
