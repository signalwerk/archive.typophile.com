    html: |-
      <p>In print, underlying grids serve as an invisible framework against which elements can be positioned to impart unity and cohesiveness to the design.</p>
      <p>In web design, the 960 and other similar grids do much the same thing, but they also serve a different purpose. In essence, they're prebuilt frameworks where the CSS is already thought through and can be applied to a grid structure that can reconfigure itself in response to various display resolutions.</p>
      <p>How this is relevant to the sketch you posted, I'm not quite sure.</p>
    html_clean: |-
