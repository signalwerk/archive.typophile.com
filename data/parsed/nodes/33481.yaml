    I have "lurked" on this board for a long time. You are all so knowledgeable!</p>
    <p>I was wondering if you have any feedback on this logo for Sprinkles Cupcakes. It looks like it was a font that was just created, but I thought some of you might know if it was based on an actual font.</p>
