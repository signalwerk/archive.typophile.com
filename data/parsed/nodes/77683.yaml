      <p>Resolute and Kabel are both pretty close. I did some more hunting and found one that has a similar open feel and curved diagonals, but it doesn't have the nice pointed intersects on the M V A &amp; N like Resolute, Kabel and the hand painted signs have.</p>
      <p>FF Megano Black<br>
      <a href="http://www.fonts.com/findfonts/detail.htm?productId=552040" title="http://www.fonts.com/findfonts/detail.htm?productId=552040">http://www.fonts.com/findfonts/detail.htm?productId=552040</a></p>
      <p>If someone mixed FF Megano Black and Kabel Bold, plus an up-curve to the leg of the R, I'd basically have it :)</p>
      <p>thanks</p>
