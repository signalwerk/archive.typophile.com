    <p>Went camping in October and really enjoyed the hand-lettering on all the park signs. Can anyone tell if this was based off a typeface that has been digitized? Obviously it's all hand-painted, but thought there was probably some sort of stencil used.</p>
    <p>Love the subtle curvature of the letter forms like A, V and N.</p>
    <p>- Tristan</p>
