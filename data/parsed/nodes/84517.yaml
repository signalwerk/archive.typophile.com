    <p>Hi everyone !</p>
    <p>I am creating a brochure for a renewable energy agency called "Natural Power" that focuses it's business on Solar Panels.</p>
    <p>The goal of this brochure is explaining the whole process of how a photovoltaic system works and the economic advantage of installing one in your home. This ain't a easy task as there are lots of information and laws that the reader has to digest so we thought about making a really user friendly design, a simple visual approach to try to make everything smooth and understandable from anyone. Unfortunetly, I don't have much knowledge about typography so I would kindly like to know what do the experts think of the sample pages(they are in the wrong order, but you get the concept):</p>
    <p><a href="http://imageshack.us/g/217/tp5.png/" title="http://imageshack.us/g/217/tp5.png/">http://imageshack.us/g/217/tp5.png/</a> </p>
    <p>What do you think? Do you think the type is legible enough ? Does this body and head line work together correctly?</p>
    <p>I'd love to have your opinion, let me know please</p>
    <p>Pierluigi</p>
