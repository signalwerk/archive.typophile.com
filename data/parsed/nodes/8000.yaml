    html: <p>Hah! I've seen that before, Hrant, very interesting work! With the "trajic" thing I was not so much naming it as I was worrying about killing it; more of a thread title. But then to others i am, and that is what I really had to consider. ;-) <br> <br>Bugger, i didn't spot the 'shifting baseline'. That was an accident. <br> <br>Perhaps I should have spent a little more time developing this before posting. My flatmate just got an iMac G5 (beautiful!) and i've been designing pixel fonts on it over the last week constantly. <br> <br>I'm quite eager to pursue the pixel font thing as I think it really has value. Hinting seems to be what will really make the difference in the long run, however. I was inspired to make some pixel fonts when looking at the horrible pixel fonts used in video games. <br> <br>Well, I've got a varied stroke weight version that needs some work. I'll have a fiddle. I'll be posting a few other things I've been working on, perhaps, as well. <br> <br>I agree with your idea of abandoning the initial concept, though for me as an amateur I'm sort of "finding" my feet. Exploring and what-not. I'm quite in to the roman proportions and produced a sans serif based on them for a university project a short time ago. <br> <br>Outlines for pixel fonts? Hmm. I have access to fontlab, so I'll try maybe turning emigre's Lorez into my own design. <br> <br>Thanks for the feedback, people! Its always a great way to learn. <br> <br>- Chris</p>
