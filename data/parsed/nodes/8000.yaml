    html: "<p>First: <br>The name \"Trajic\" is taken, sorry: <br><a href=\"http://www.themicrofoundry.com/ss_trajic.html\" target=\"_blank\">http://www.themicrofoundry.com/ss_trajic.html</a> <br>:-) <br> <br>Have you tried giving this stroke contrast? That's a hallmark of the Roman inscriptions after all. <br> <br>For the \"X\", one way to unravel it might be to make it non-laterally-symmetrical - offset the top-right and bottom-left arms from the \"main\" stroke. <br> <br>As for actually delivering bitmap fonts, the only really robust way is outline pixelfonts. <br> <br>Lastly, if you make an editor, Flash would actually be better (even though I'm a Director guy myself). <br> <br>hhp</p>"
    html_clean: "<p>First: <br>The name \"Trajic\" is taken, sorry: <br><a href=\"http://www.themicrofoundry.com/ss_trajic.html\" target=\"_blank\" class=\"link-external\">http://www.themicrofoundry.com/ss_trajic.html</a> <br>:-) <br> <br>Have you tried giving this stroke contrast? That's a hallmark of the Roman inscriptions after all. <br> <br>For the \"X\", one way to unravel it might be to make it non-laterally-symmetrical - offset the top-right and bottom-left arms from the \"main\" stroke. <br> <br>As for actually delivering bitmap fonts, the only really robust way is outline pixelfonts. <br> <br>Lastly, if you make an editor, Flash would actually be better (even though I'm a Director guy myself). <br> <br>hhp</p>"
  - id: 53844
    user: 2139
    date: 2004-12-04T19:51:00
    date_raw: 4 Dec 2004 — 7:51pm
    votes: null
    html: "<p>christopher, <br> <br>you are not alone in your admiration for miguel's work. i should think it a complement that others are so inspired by his fonts, that they should pick up the discipline of pixel-fonting at all. <br> <br>these larger 1 pixel stemmed fonts are perhaps the most elegant of pixel fonts overall--so long as the letter forms are perfect. if they are flawed or inconsistent across the set, then to me, they show their weaknesses more glaringly than their thicker or smaller relatives. <br> <br>my suggestion is to abandon your initial conception of your project. it has its own momentum now, and since miguel has nailed his roman/trajan so well, you really don't stand to gain much unless you can improve upon his set. this, as many will point out, would be extremely hard to do. <br> <br>so, play around with the aspecct ratios of the letters, and especially the serifs--to me, they interrupt the grace of your otherwise elegant character lines. the UC N is a good example there. <br> <br>there is also an optical problem with your uc O &amp; Q when seen next to the other upright characters. i think the serifs aggrivate the illusion, making the circular characters look one pixel too short. <br> <br>just to clarify myself, i do not mean that by abandoning your original vision of this font there is any implication of failure. i simply mean that allowing yourself the flexibility to follow the letter forms that inspire you is the first step to creating new and exciting character sets as a whole. <br> <br>as it stands, the unbalanced serifs, slightly shifting baseline, and wide degree of character widths create many directions for experimentation, and therefore many combinations of those experiments. <br> <br>as an example: uc AY in \"fridays\". the A really looks like a semiserif. the y looks like a formal serif. what would happen if you tried to give the entire font a more gentle, subtle semiserif look as you did with the A? <br> <br>anyhow, i like this font a lot, and look forward to seeing how you finish it up.</p>"
