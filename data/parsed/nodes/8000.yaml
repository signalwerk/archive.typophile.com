  html: "<p>Hello! <br> <br>I can't possibly begin this thread without acknowledging my inspiration in doing this: <br> <br>Miguel Hernandez's beautiful \"Garadot\". <br><a href=\"http://www.typophile.com/forums/messages/29/4451.html?1059520395\" target=\"_blank\">http://www.typophile.com/forums/messages/29/4451.html?1059520395</a> <br> <br>I loved what he did so I decided to jump on and try my hand at a bitmap version of Trajan. Well, here it is. What do you think? I have tried not to \"borrow\" any letterforms, but it may very well be that I arrived at similar conclusions (I went through a terrible time just before graduating where someone had used a typeface that looked almost exactly like a creation of my own. I thought they had stolen it! argh!). Either way, it's just for fun. <br> <br>Also, could anyone point me some information on the creation of bitmap fonts? I am thinking of developing my own composition software in Macomedia Director. <br> <br>- Chris</p>"
  html_clean: "<p>Hello! <br> <br>I can't possibly begin this thread without acknowledging my inspiration in doing this: <br> <br>Miguel Hernandez's beautiful \"Garadot\". <br><a href=\"http://www.typophile.com/forums/messages/29/4451.html?1059520395\" target=\"_blank\" class=\"link-lost\">http://www.typophile.com/forums/messages/29/4451.html?1059520395</a> <br> <br>I loved what he did so I decided to jump on and try my hand at a bitmap version of Trajan. Well, here it is. What do you think? I have tried not to \"borrow\" any letterforms, but it may very well be that I arrived at similar conclusions (I went through a terrible time just before graduating where someone had used a typeface that looked almost exactly like a creation of my own. I thought they had stolen it! argh!). Either way, it's just for fun. <br> <br>Also, could anyone point me some information on the creation of bitmap fonts? I am thinking of developing my own composition software in Macomedia Director. <br> <br>- Chris</p>"
