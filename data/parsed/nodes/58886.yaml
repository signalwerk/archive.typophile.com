      <p>&gt;According to Hermann Zapf it’s actually lettering by John Edward Benson.<br>
      &gt;I’m not sure who Benson is or if he sourced Optima in his design.</p>
      <p>Huh? According to Hermann Zapf where and when? In Linotype’s brochure for Optima nova, there is a photo of the Vietnam Veterans Memorial lettering, because it is done in Optima. For the same reason, in at least one of Hermann Zapf’s books, a picture of a rubbing from the wall appears as well.</p>
      <p>You should know who John Benson is… aside from being a type designer in his own right, he ran the John Stevens Shop in Newport, RI for decades, and undertook a number of prominent lettering commissions in Washington, DC (and elsewhere). His son Nick runs the business now as far as I know. I’m sure that David Berlow could fill in more details.</p>
      <p>The story that I had been told was that Maya Lin spoke with him about the lettering. It would have been too labor intensive to letter all of those names by hand, so a typeface was used instead. Apparently, Benson suggested Optima to her, and it was used.</p>
