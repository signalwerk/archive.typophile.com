      <p>Being a VietNam vet and living 4 miles from Tyson’s Corner, this is not an issue of who owns all caps Optima lists. This is VERY clearly a take off on the Memorial. Anyone who thinks otherwise has not seen it. I am as fond as anyone of the visual pun but this is just insulting and in very bad taste. I hated the war then, I hate the war now, I hated being there and seeing a country being strangled by bloodshed there while another country, mine, was being strangled by lies and losses of its own. Whatever you think of that time in our history, the people who died there needlessly deserve better than this mockery.<br>
      Imagine if Bloomingdales’s or Macy’s in New York would place posters in the New York subways depicting people jumping out of windows of the WTC holding signs with the names of the various department store locations? This isn’t just a coincidental use of Optima, it is done on purpose. I can’t imagine the conversation at the presentation of those ads to the client. Sick bastards!</p>
      <p>Like Dan said above, everybody who lives around here knows damn well what that is!</p>
      <p>ChrisL</p>
