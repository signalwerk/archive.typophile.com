      <p>I don’t know about any other athletic events, but the Star Spangled Banner was first sung before a Baseball World Series game during WWI. The song wasn’t even the US national anthem yet… that happened later, in the 1930s. But the resonance of this song before that baseball game went over so well that it was quickly incorporated as a feature in ALL major league baseball games, not just World Series Games.</p>
      <p>Of course, like every World Series game—save the few in which the Toronto Blue Jays played—both teams competing hailed from US cities. But hey…</p>
