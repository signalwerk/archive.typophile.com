    <p>Hi wondering if anyone can help with this one....</p>
    <p>I'm trying to find a typeface similar to the sample. This is a unreleased font from a logo designer.<br>
    I love the e,s,o characters and have searched all my resources for a font that has a similar aesthetic.</p>
    <p>Ideally I'm looking for a font with a slight change in thickness through certain characters like the e and c in the Tectone example. (I posted this example the other week but no one could id it)</p>
    <p>Also included is a sample pic of some more typography that has the same qualities, 'factory shop' (apologies for the terrible picture quality its the best I could find) and 'slim fast' logotype</p>
    <p>Any help would be greatly appreciated<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/miona1_4408.png"></div><div class="imageWrap"><img src="http://typophile.com/files/tica_4598.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/37475_429618747056_691087056_5154956_2324708_n_5538.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/optima_5169.jpeg"></div><p></p>
