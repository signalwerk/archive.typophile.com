    html: "<p>Open the font in FontLab. Open the space glyph (Unicode: 0020). Go to View / Lock Layers / Glyph Metrics and turn the lock oﬀ. Change the width of the glyph by moving the right sidebearing line or use Tools / Transform / Metrics / Set width.  <br>Adam&nbsp;Twardoch</p>"
