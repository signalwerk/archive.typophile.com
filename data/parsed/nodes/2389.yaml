  html: <p>Hello, <br> <br>I want to get more space between words in a nice font called Digital Sans. Standartly it`s have too small space between words, so it`s bad readalbe. How can I change this in Fontlab? Thank you. <br> <br>Wadim Kahlkopf</p>
