    html: |-
      <p>I agree with Quenteau, this doesn't work for several reasons. The colors you've chosen combined with the unnecessary outlines look like a kids sports team - oh, and Quenteau is also right about working strictly in black &amp; white before adding color. It's the only way to flush out a solid design. </p>
      <p>Aside from all the technical/visual missteps, it doesn't convey <em>security</em> at all, and as a result, it doesn't inspire potential users to trust the application. IMHO, this is a huge problem for security software. Look around at the big names in security (not just software; look at banks, law enforcement, alarm companies, etc.) and learn from their success. </p>
      <p>If you chose Museo simply because you like it, well, that's the wrong reason to choose a font. Make at least a dozen draft logos - each one a fresh idea wholly different from the last - before you focus in for refinements. Unless you do that, you'll waste a lot of time trying to force something to work based on something emotional like loving a great font. A logo is not a font showcase, it's the voice of your product. What does your product want to tell its potential customers? Does Museo say that? I love Museo...but I don't think it works for your product. Can you convince me otherwise?</p>
