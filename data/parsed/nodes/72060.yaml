      <p>I'd suggest looking at bank logos. They tend to look solid (at least they used to).</p>
      <p>Try to define what the logo has to communicate then try to say that with images. Maybe try to mix two concepts together (a safe and a computer pop into my mind [although maybe it's a little obvious]). Think about different concepts, so you'll end up with lots of choices. and then we can pitch in and guide you in the right direction.</p>
      <p>Hope this helps and good luck!</p>
