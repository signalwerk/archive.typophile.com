    html: <p>What does the motto <em>beautiful security</em> refer to? The qualities people generally value in security are strength, reliability, comprehensiveness, and ease of use--not beauty. Since you're using beauty to differentiate your product from other security applications, think about what attributes of your product a user would find beautiful, and make a logo that visually embodies those attributes.</p>
