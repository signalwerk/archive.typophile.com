    <p>I have designed a simple logo for an open source security application I'm currently developing.<br>
    The font in use is <a class="freelinking external" href="http://www.josbuivenga.demon.nl/museo.html" rel="nofollow">Museo by ExLjbris Font Foundry</a> (the free weight), with some character merging applied by me.<br>
    While I like the "ALMA" part, I'm not satisfied with the "beautiful security" <a class="freelinking external" href="http://en.wikipedia.org/wiki/Motto" rel="nofollow">motto</a> below.</p>
    <p>Any suggestion will be appreciated.</p>
    <p>A.</p>
