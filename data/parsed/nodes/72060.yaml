      <p>I think this doesn't work too well for several reasons. The ligatures you created make the word ALMA hard to read, as the L becomes an I. The Beautiful Security is unevenly spaced, and there is a huge gap between the words. My advice would be to try to work on the logo and typography first in black only, as it makes it easier to judge if the shapes and proportions are allright. Also try many different versions, placements etc and print them out big. Pin these on a wall and leave it there for a while. After this you can start looking at the colour scheme.</p>
      <p>Good luck</p>
