      <p>Here's something that I always wondered.<br>
      It seems, from their inception and until rather recently, drop caps almost invariably followed this convention: When a drop cap began a word, the first line moved closer then all subsequent ones. Bottom Picture. Was the practice abandoned or deemed impractical at some point, as most modern examples I see treat the lines uniformly. Top picture.</p>
      <p><img src="/sites/default/files/old-images/dropcap_5774.png"></p>
