  html: |-
    <p>Hi everyone,</p>
    <p>I have a small question regarding Drop caps, is it like ok to use them or is it smarter to try and avoid them as much as possible...reason why I'm asking is that I'm trying something out with drop caps but no mater how much i experiment with it it never looks quite alright.</p>
    <p>So is it like a no-no when it comes to good typography?</p>
    <p>Also are there like some unwritten rules for the kerning between the drop cap and the letters that follow...</p>
    <p>Also do you actually use the spacing function or kerning function in Indesign when trying to make your drop cap float nicely with the text. </p>
    <p>Could someone maybe provide some examples/links on the web with good use of drop caps, that would be really useful to see how it should be done.</p>
    <p>thnx for the help everyone!</p>
