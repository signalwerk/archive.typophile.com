      <p>Drop caps are fine, at least in the right kind of work. Not a no-no at all. That being said, if they're not working for you, it may be that they are out of place in that particular piece. It would be helpful/interesting to see the context in which they are not working for you, including the typefaces.</p>
      <p>Regards,</p>
      <p>T</p>
