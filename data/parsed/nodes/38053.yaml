    <p>Hi,</p>
    <p>I am interested in <a href="https://web.archive.org/web/20081013100750/http://www.myfonts.com/PurchaseOptions?familyid=18851">Digital Sans</a> by Elsner + Flake.</p>
    <p>There are three different variants of the family available on myfonts...</p>
    <p>EFOP<br>
    EFCEOP<br>
    EFTUOP</p>
    <p>They are all the same price... I am guessing the EFCEOP version has central euro figures, but I haven’t a clue what the EFTUOP family variant could be.</p>
    <p>Are they all exclusive character sets, or is there one of these that contains all of the others? I expect that by buying the EFOP version I’ll be wasting my money?</p>
    <p>Any help/advise much appreciated.</p>
    <p>Steve</p>
