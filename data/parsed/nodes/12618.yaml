      <p>Herbert, it appears to me that you're making a lot of sassy comments without even knowing what I'm talking about. Let me clarify a few things:</p>
      <p>I live in Belgium. We don't have an FDA that spells out how Nutrition Facts should look like. I wasn't aware of these standardisations and frankly I don't even <em>need</em> to be, as they only apply in the USA. It's up to the designer to make this information as clear and legible as possible within the limited space available on food packaging (I realise this amount of freedom may sound terifying for someone like you, but it really isn't). I achieved this by carefully selecting a typeface, and a before-and-after comparison with several similar food packages proved that ours was by far the clearest and easiest to read. Unlike what you are trying to imply, Herbert, this process took me a couple of minutes at the most, as I do know my type and usually can predict what the effect will be. Setting a simple box with legible type is not "trying make it look like a flyer for a techno party".</p>
      <p><em>Are you trying to say creativity is automatically achieved when you do something off the norm everytime you do something? Wouldn’t that be a new norm on it’s own?</em></p>
      <p>I didn't say nor imply this <em>in any way</em>, that's just your imagination talking. But when the norm here seems to be way too small <em>all caps Futura Condensed</em>, you might understand that sticking to the norm is not very user-friendly. If trying to improve on that is bad design, than I'll happily be a bad designer. These were diet products for diabetics, so I wanted to make sure that the consumer would have no trouble at all reading this crucial information. So conformism was absolutely not the way to go in this pecific case. Don't worry, if the norm works, I'll stick to it.</p>
      <p><em>No offense to the person who designed it with Solex, but if I was your art director I hadn’t let it out…</em></p>
      <p>Judging from your photo you aren’t even that young.</p>
      <p>Oh well I shouldn’t waste my time with people like you, so bye.</p>
      <p>So you haven’t realized yet that you aren’t designing for the client, but for the client’s client?</p>
      <p>How long are you in the business, kid?</p>
      <p>And you tell me you are surprised that you "stirred up a lot of attitude"? After making such demeaning statements? I don't mind a well-informed opinion and a healthy debate, but I do take offense at mean-spirited comments and plain rudeness. Just listen to yourself! You don't know me, and you went way out of line, several times in a row. Who do you think you are, and frankly, what makes you think you'd ever be in a position to be my art director?</p>
