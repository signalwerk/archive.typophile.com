      <p>Wait a minute…</p>
      <p>I don't want to mandate any typeface for anything, but I think that the real beauty of the American Nutrition Labels in that they are relatively homogenous. </p>
      <p>These labels were conceived to be the same across the board. They are not subject to branding. They allow consumers to quickly identify ingredients, and compare products based on their nature and not on their package design. Sometimes, this get a little silly. I remember the first time that I saw this label on a bottle of water (Dasani, from Coca-Cola); its label had a zero next to everything. That was funny. It was also sad, I thought, that it was now necessary to put ingredient information on water…</p>
      <p>Anyway, I think that it is a service to the customer (the viewer, reader, etc) that these all look nearly identical. That is the whole point of the labels. Living in Germany now, I actually miss these labels quite a bit. Ingredients here are usually listed in the tiniest of type, at the very bottom of the package. That is illegible and does not help anyone do anything. The manufacturers here probably just put those on a package because they have to. The American standard is much better, I think, because at least it is clear and legible.</p>
      <p>Whether the spec recommends Helvetica, Franklin Gothic, Solex, or Remedy is sort of irrelevant to me. I think that this "lack-of-design" is good.</p>
      <p>Didn't the AIGA declare these labels to be the best piece of design produced in the US during the entire 1990s? There is some truth there. They are good info. design…</p>
      <p>__<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
