      <p>Hehehe, I recently designed some chocolate wrappers, chocolate peanuts bags and jam labels, and I set the nutrition facts all in <a href="http://www.emigre.com/Volume.php?p=UPEMSOLFM" target="new" rel="nofollow">Solex</a>. It's very economic and stays perfectly readable at very small point sizes. I just hope I won't get arrested by the food label police. :-P</p>
      <p>I think it's all to do with the tired myth that <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a> is the best readable typeface -- which is total and utter bollocks, pardon my French -- and also due to laziness of the "designers" involved. It doesn't take a lot of thinking to just pick the most obvious and overused face in your font menu. In a perfect world professional pride should prohibit you from neglecting even the tiniest details on stuff you design, so the most trivial and mundane piece of information should get the same kind of attention as the cover or headline.</p>
      <p>There <em>are</em> clients who notice and appreciate that.</p>
