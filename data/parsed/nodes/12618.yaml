      <p>You could compare this (Nutrition labeling - how readable is the 'standard'?) to the way cigarette packaging has to show a health warning (speaking about The Netherlands). The size of those warnings has been set in regulations, but the producers use very condensed and extremely tight type, so these warnings turn into ornaments, being almost unreadable.</p>
      <p>Maybe the US Nutrition labeling has just became that: a token gesture, turned into a ornament, just as the UPC barcode... So there is a just reason for questioning the validity of the present practice. Imagine redesigning those tables to convey some REAL information, eg the fact that a product provides all of the Vitamin C needed in just one dose. Or making clear that there is a dangerous dose of salt in it. (Designers could go crazy...) In any case: making them more readable. By readable I don't mean just legible, but also INFORMATIVE. </p>
      <p>On another note: I have been in Forums for quite a few years now, even moderated a few in the days they were in BBS's and not on the Internet, and I think one should disregard obnoxious, irritating, etc. posts if they occur occasionaly (everyone has bad days). On the other hand: someone who is a constant heckling presence should be banned.<br>
