      <p>I don't know... I think nutrition labels are pretty darn usable because they're universal and generally large enough. But, if we put nutrition labels and cigarette warning labels on a spectrum it would fall something like this (in order of most readable to least):</p>
      <p>Nutrition Labels (generous size, consistent placement)<br>
      Video Game Rating labels (sizable enough, generally consistent placement)<br>
      MPAA Movie Ratings (very tiny, inconsistent placement)<br>
      Cigarette Warning Labels (condensed sans, all caps, but large and prominent)<br>
      Drug Warning labels (wrapped in tiny text on small bottles or boxes)<br>
      Movie Poster Credits (extremely condensed, thin, all caps)*</p>
      <p>(*Okay I threw that in there for laughs. This info may be harmful but it's not life threatening.)</p>
      <p>(This is not to say nutrition labels could not be improved by any means. Just trying to illustrate that they function well compared to some other informational labels.)</p>
