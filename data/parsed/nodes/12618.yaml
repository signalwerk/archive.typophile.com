    html: <p>Actually, in the US the FDA mandates the nutrition panel information, which must follow certain guidlines to maintain uniformity across diverse brands and products. This was done within the last ten years in order to make the nutrition panel more uniform and easier to understand for most consumers (before it was a mess!). Typefaces are not mandated but certain typefaces are recommended (Helvetica Black, Franklin Gothic Heavy) which is probably why Helvetica is used everywhere. Check <strong><a href="http://www.cfsan.fda.gov/~dms/labtr.html" target="new" rel="nofollow">here</a></strong> and <strong><a href="http://www.cfsan.fda.gov/~dms/flg-5-1.html" traget="new" rel="nofollow">here</a></strong> for specific typeface and other design guidelines on the "Nutrition Facts" panel. It also specifies leading, size of horizontal rules, etc.</p>
