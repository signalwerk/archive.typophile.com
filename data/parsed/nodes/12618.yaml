    <p>What font is used on the food label of products which indicates the information of <strong>Nutrition Facts</strong>? Saddened, I have no image. This piece of information appears on the label of all the products. It gives to the consumers of the information onto Calories, Fat, Carbonhydrate, and so on.</p>
    <p>To me, it seems to be Helvetica condensed or Trade Gothic but I'am really not sure.</p>
    <p>Thanks in advance</p>
