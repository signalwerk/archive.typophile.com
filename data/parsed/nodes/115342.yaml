      <p>You're right that sometimes I'm unduly aggressive in my speculation. It might be a desperate compensation for the fact that many people who harbor much more animosity towards plagiarism (really, among type designers I'm a moderate in that respect) have simply given up on Typophile, at least in terms of promoting moral behavior. Which is a shame. Also, part of me hopes that I can simply raise a red flag and people who are better than me at nailing down the exact source of plagiarism can pick up the baton. But I have to admit that very rarely actually happens...</p>
      <p>Perhaps a better avenue is not voicing vague suspicions, quietly trying to gather evidence of plagiarism, and then crashing a thread with a bang. I'm just not the sneaky type. Plus it's a lot more work.  :-/</p>
      <p>But I will try to take your balanced argumentation to heart.</p>
      <p>hhp</p>
