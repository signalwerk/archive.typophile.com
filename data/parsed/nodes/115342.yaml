    html: "<p>That sounds like some twisted reasoning to me: Based on a flaw that demonstrably also appears in commercial fonts, a free font is declared badly made. When it proves to be not so badly made, after all, its maker is accused of plagiarism instead—without any factual basis except for the fact that he has not released any crap in the past. Come on! Even in court, you are innocent until proven guilty. I am in favour of speaking out against plagiarism (which is rampant in free fonts, I know), but I am against random suspicion, just because something is better than many a commercial font. ‘Paranoia’ indeed seems to be the right term for that.</p>"
