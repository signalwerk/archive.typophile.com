    html: "<p>I understand your wish to err on the side of caution and, like you, I don’t want to use fonts that are re-using the work of others without their permission. But: being cautious about using or recommending fonts that give you a bad gut feeling is—to my mind—worlds apart from insinuating publicly that a font might be based on plagiarism. The latter, I think, is unfair and unwarranted unless you have fairly solid evidence. A general correlation between price and quality that you claim does not seem nearly enough to me. You might be aware of the saying ‘Audacter calumniare, semper aliquid haeret’ (Slander boldly, something always sticks). If you make (unfounded or poorly founded) accusations and these are eventually proven wrong, this can still result in damaging an honest type designer’s reputation. Why? Because somebody might misread your ‘trenchant questions’ as facts and wrongly associate an untarnished name with plagiarism. That’s not the way the world should be, but the list of careers that were ruined by false allegations is probably even longer than the list of free fonts based on plagiarism.</p>"
