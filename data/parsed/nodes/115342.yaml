      <p>Oddly enough, we just bought Sirba last Friday to use for a customer, and I've had a quick look. I assume the advocate of "professionalism" living in Southern California will pay me $50 for every flat-out error I've found in the font? (I've only checked the roman so far.)</p>
      <p>Mis-coded characeters, that sort of thing? Or does a grave really run this way / when it is below a character, rather than, say, \ ??? </p>
      <p>And is the <strong>spacing modifier</strong> (aka raised comma or apostrophe) found at U+02BC really (1) small, like the comma accent, as one would expect at 0313, and (2) zero width? Esp. when there is no comma accent at 0313? </p>
      <p>And shouldn't the combining diacritics all be zero width (regardless of where one places them in that setwidth)?</p>
      <p>And o335-0336 should be positioned to work as Unicode intended, mid-plane (as well as needing to be zero width), regardless of how useful they may have been to the designer in constructing the font via scripts.</p>
      <p>Don't get me wrong, I think Sirba is gong to be a real nice typeface, and if it sets as well as like I think it will, I'll have no hesitation recommending it to other customers. Things happen, though. I know, because I've done them too. It takes, perhaps, oddballs like me to "finish the proofing." I've no doubt that when these are pointed out to the designer, they will either be fixed, or an explanation offered as to why they are correct, in spite of what someone might expect.</p>
      <p>Best of all though, Hrant's going to owe me enough to offset the purchase price of the whole font family!</p>
      <p>@R -- You've been around typophile long enough to know that Hrant, in spite of his numerous posts, has a smallish litany of advice for people, not always, but usually:  (1) What you want to do isn't legal. (2) If it is legal, it isn't morally right. (3) Even when it is legal (&amp; maybe morally acceptable), you don't have the skill. (4) if it's free, it's no good. All leading to (5) What's you budget?</p>
