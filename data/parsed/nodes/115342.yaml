      <p>Troublesome overlap...</p>
      <p>The two easiest approaches:<br>
      1. Use a font editor to modify the affected glyphs ('N' and accented 'N's) or<br>
      2. use the TTF files instead of the OTFs. TTF is less sensitive to this phenomenon.</p>
      <p>I, being me, took the hard way. I dumped it to FontForge's SFD format and hand-hacked that.</p>
      <pre>StartChar: N
      Encoding: 78 78 8
      Width: 775
      Flags: MW
      HStem: 0 21G&lt;50 50 50 297 595 595 598 598 598 657&gt; 673 20G&lt;50 186 127 241 186 186 241 241 500 735 735 735&gt;
      VStem: 120 67&lt;101 592&gt; 590 67&lt;189 572 572 601&gt;
      LayerCount: 2
      Fore
      SplineSet
      50 0 m 1
       44 39 l 1
       118 52 120 62 120 101 c 2
       120 592 l 2
       120 631 118 641 44 654 c 1
       50 693 l 1
