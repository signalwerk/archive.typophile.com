      <p>From <a href="https://www.behance.net/zar_nicolas20" title="https://www.behance.net/zar_nicolas20">https://www.behance.net/zar_nicolas20</a></p>
      <blockquote><p>
      Nicolás Silva is an award-winning graphic and typeface designer based in Monterey, California. He has received national and international recognition for his work, including a Bronze Cannes Lion for his collaboration on the graphic production of a campaign directed by JWT Buenos Aires.</p>
      <p>Nicolás graduated with honors from the University of the Andes in Venezuela with a BA in graphic design. Later, he received a postgraduate certificate in typeface design from the University of Buenos Aires in Argentina. For his final project, he created the font Poly, which was selected for display at the Ibero American Design Biennale and listed as one of the Behance Most Appreciated Projects of 2012.
      </p></blockquote>
      <p>And from the font itself</p>
      <blockquote><p>
      Poly is a medium contrast condensed serif font. However unlike many serif fonts, it has very short ascenders and a very high x hight. Poly is very efficient in small sizes. Thanks to its careful balance between the x height and the glyph width, it allows more economy and legibility than standard web serifs, even in small sizes. This font was originally designed to compose texts in agglutinative languages, which contain very long words. The goal was to develop a typeface that would tolerate cramped tracking and that would increase the number of letters that enter in a single line.
      </p></blockquote>
