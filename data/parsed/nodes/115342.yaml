    html: |-
      <p>To me anybody who feels he can afford a professional font should not risk the potential headaches of using a free font (except if it has a good pedigree). Things can go wrong way after it's too late to change the font choice. BTW incremental fixes don't really convey much confidence that the current version is good enough...</p>
      <p>Furthermore, in the case of Poly (as with a great many free fonts, frankly) I'm personally getting a bad vibe in terms of it having been made from scratch* (although it could be my paranoia again :-) and I myself wouldn't want to support –even inadvertently– such an approach.</p>
      <p>* One trenchant question: what other fonts has that designer previously made?</p>
      <p>hhp</p>
