      <p>BTW, one instance does not make a rule, but here's something telling that I once experienced: a font house representative showed me a Latin+Armenian font and asked if they should carry it. It was designed by somebody I personally know, and actually like as a person. But within five minutes of looking at it I got a bad vibe... and then spotted –inconclusive– indications of plagiarism (the trapping across scripts was suspiciously inconsistent). The representative (an "inspiration liberal", if you know what I mean) thought that wasn't enough grounds to reject it. Maybe he was right. But on a whim I looked at other fonts from that designer, and traced the path: the font in question was a "some-serif" based directly on the outlines of a previous sans typeface... owned by a rival font house. :-/ I opined that –even though it was the same designer– publishing the font would not be OK unless that other font house were aware, and approved. I don't know what ended up happening.</p>
      <p>hhp</p>
