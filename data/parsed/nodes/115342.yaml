    html: |-
      <p>Polly is a very good and well made font.<br>
      You should use the TTF, since that is the official "released" version where the contours are merged and does not have any overlaps. The OTF files included in the "src" folder are part of the "source files", and thus not merged in order to make future edits easier.</p>
      <p>The Google Fonts version does not have this bug. I guess you are using the FontSquirrel version, for some reason they are giving you the source OTF instead of the final TTF.</p>
      <p>FWIW, the Times New Roman that comes with the Mac also have a similar problem in /Hbar<br>
      <img src="http://cl.ly/image/0W0s053m2W2T/MacTimesHbar.png"></p>
