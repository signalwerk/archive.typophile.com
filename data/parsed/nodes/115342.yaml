      <p>Sorry I didn't address your questions. Having a question I consider better (from the perspective of my own needs, admittedly) is not a sufficient reason; however trying to manage one's time is.  :-)</p>
      <p>And here's a question <em>I'm</em> apparently having to re-ask: what other fonts has Nicolás Silva produced, in particular before Poly?</p>
      <blockquote><p>should overlapping references always be unreferenced and merged?</p></blockquote>
      <p>Yes; that's the only way to maximally reduce unpleasant surprises. Sort of how using an EM of 1000 for PS and 2048 for TT is <em>still</em> a Good Idea (barring force majeure).</p>
      <p>Now, if it's a <em>production</em> file that's meant to be easy to modify: it must be made crystal clear that it's not supposed to be deployed as-is; and one would expect <em>all</em> glyphs with potential overlaps (like the "M") to feature separated contours (otherwise it's probably just sloppiness).</p>
      <p>hhp</p>
