      <p>Thanks for taking my point into consideration.</p>
      <p>I agree that there must be ways to avoid unnecessary roadkill on the way to a better type design world without being on plagiarism patrol full time. If you encounter a typeface that you think is based on plagiarism, you could privately alert others to it and see if any of them can shed light on the matter. You could additionally approach the designers of suspicious typefaces themselves and see what they have to say in their defence. And: Is there any type design forum with restricted access that is not indexed by search engines? If so, that might be a place to discuss such cases. Typophile, I think, ranks fairly high on Google &amp; Co. and a thread on plagiarism is not what you want on the first page of results as a young type designer—particularly if you did not plagiarise. Also, I suggest to let go cases in which you cannot substantiate your instinct. I understand (and support) your inclination to name and shame actual offenders, but I think there is less to be gained from each copycat exposed than to be lost when rashly publishing allegations that have to be dismissed eventually (or, even worse, go unchallenged and keep on floating about).</p>
