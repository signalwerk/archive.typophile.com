      <p>Low point: realizing at 2am that I've got to wake at 4am for a 6am flight. Still recovering from that one.</p>
      <p>High point: Seeing <a href="/node/add/wiki?edit%5Btitle%5D=Donald%20Beekman" title="Create node &quot;Donald Beekman&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Donald Beekman</a> on the turntables. That guy can spin!</p>
      <p>Funniest point: <a href="/node/add/wiki?edit%5Btitle%5D=Christoph%20Winkler" title="Create node &quot;Christoph Winkler&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Christoph Winkler</a> (technical guru at <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>) telling us to stop playing records backwards and to just play some classic rock! Christoph, no hard feelings, but you've got to be more specific. I assumed that since you're German you'd appreciate some techno. Cheers mate.</p>
      <p>Epiphany: Speculating with <a href="/node/add/wiki?edit%5Btitle%5D=Simon%20Daniels" title="Create node &quot;Simon Daniels&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Si</a> about why <a href="/node/add/wiki?edit%5Btitle%5D=Apple" title="Create node &quot;Apple&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Apple</a> doesn't make it to these conferences. If they're really a design oriented company, where are they in the type world? (They're only at <a href="/node/13403" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">ATypI</a> it seems).</p>
      <p>Realization: Contrasting how nice <a href="/node/add/wiki?edit%5Btitle%5D=Paula%20Scher" title="Create node &quot;Paula Scher&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Paula Scher</a> is in person to... someone else.</p>
      <p>Realization: Re-remembering how much I love <a href="/node/14164" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Cyrillic</a>.</p>
      <p>Realization: San Francisco weather really is the best weather in the whole friggin' world.</p>
