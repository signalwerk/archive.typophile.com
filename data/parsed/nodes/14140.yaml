    html: <p>Seeing Ed Rondthaler so sharp at age 100 was amazing. So much wisdom, I can’t imagine all the things he’s seen in his lifetime. Getting my type critiqued by Matthew Carter, John Downer, Akira Kobiyashi, and Erik Spiekermann was a dream come true. I met a lot of neat people and in contrast to the fields I was previously involved in (entertainment and the arts) everyone I met seemed very down to earth.</p>
