    html: |-
      <p>This conference was a wonderful experience for me. Various highlights:</p>
      <p>1. Discussing my efforts in type design with some experienced type designers. Like Terry, I was overjoyed that you can actually get the best in the world to discuss your work, and found it tremendously stimulating and thought-provoking.  </p>
      <p>2. The chance to meet Typophiles in the flesh and blood. Typophile is great, but meeting in person way better. </p>
      <p>3. Presentations: Paula Sher's exciting typography. Mario Feliciano's wonderful revivals of Spanish types. Yves Peters courageous criticism of corporate type pirates--and his amazing dancing.</p>
      <p>4. The 'Subway Blues' workshop, which I moderated. It was great that Tamye was willing to put it on the program and find space to talk about NYC transport signage. And it was terrific to have such a stellar panel all agree to be on the round table: Neysa Pranger of Straphangers.org, Eric Spiekermann, James Montalbano, Terry Biddle, and John Berry. All had really interesting and different points to make. I will post more to the thread on it. </p>
      <p>5. I was sad that in arranging the round table and getting critiques I missed: Nick Shinn's workshop on Open type, John Downer on 'Paperback' and the Graffiti presentation. </p>
      <p>Ok, Ok I know, too many superlatives. But this was in fact hands down the best experience for me at a conference, ever!</p>
    html_clean: |-
