    votes: null
    html: |-
      <p>Low point: realizing at 2am that I’ve got to wake at 4am for a 6am flight. Still recovering from that one.</p>
      <p>High point: Seeing <a href="/web/20080829190410/http://typophile.com/wiki/Donald%252BBeekman" class="wiki-create">Donald Beekman</a> on the turntables. That guy can spin!</p>
      <p>Funniest point: <a href="/web/20080829190410/http://typophile.com/wiki/Christoph%252BWinkler" class="wiki-create">Christoph Winkler</a> (technical guru at <a href="/web/20080829190410/http://typophile.com/wiki/Linotype" class="wiki">Linotype</a>) telling us to stop playing records backwards and to just play some classic rock! Christoph, no hard feelings, but you’ve got to be more specific. I assumed that since you’re German you’d appreciate some techno. Cheers mate.</p>
      <p>Epiphany: Speculating with <a href="/web/20080829190410/http://typophile.com/wiki/Simon%252BDaniels" class="wiki-create">Si</a> about why <a href="/web/20080829190410/http://typophile.com/wiki/Apple" class="wiki-create">Apple</a> doesn’t make it to these conferences. If they’re really a design oriented company, where are they in the type world? (They’re only at <a href="/web/20080829190410/http://typophile.com/wiki/ATypI" class="wiki">ATypI</a> it seems).</p>
      <p>Realization: Contrasting how nice <a href="/web/20080829190410/http://typophile.com/wiki/Paula%252BScher" class="wiki-create">Paula Scher</a> is in person to... someone else.</p>
      <p>Realization: Re-remembering how much I love <a href="/web/20080829190410/http://typophile.com/wiki/Cyrillic" class="wiki">Cyrillic</a>.</p>
      <p>Realization: San Francisco weather really is the best weather in the whole friggin’ world.</p>
