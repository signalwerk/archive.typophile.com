      <p>Ed Rondthaler was amazing to watch. I really like his alphabet song and he impressed the heck out of me with his memory – never missed a beat when it came to remembering a name or date. Alessio Leonardi gave a very entertaining talk, and sweating with everyone at Roger Black’s lovely sauna was also quite memorable. The duck at Les Halles was brilliant and juicy. There are so many wonderful experiences that I could write a book, but overall I was very inspired by the people I met and everything that I learned from them.</p>
      <p>Photos to come soon on <a href="https://web.archive.org/web/20080829190410/http://flickr.com/photos/zara">my Flickr page</a>– don’t forget about the <a href="https://web.archive.org/web/20080829190410/http://flickr.com/groups/typecon/pool/">TypeCon Flickr pool</a>!</p>
