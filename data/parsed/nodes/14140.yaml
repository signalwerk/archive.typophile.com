      <p>For those of you who wish for a tricky way to add your photos to the <a href="http://www.flickr.com/groups/typecon/">TypeCon Flickr Group</a> and wish to do it more quickly than one at a time:</p>
      <p>(1) Make sure you've joined the group<br>
      (2) Go into the <strong>Organizer</strong><br>
      (3) Click on the <strong>Your Groups</strong> tab<br>
      (4) Select <strong>TypeCon</strong><br>
      (4) One at a time, patience is key, hold the <strong>a key</strong> down and click on the photos you wish to add.</p>
      <p>Flickr is down at the moment, but I'll double check this in a while. <em>These instructions are courtesy of Quasistoic, Flickr Maestro and Zen Master.</em></p>
    html_clean: |-
