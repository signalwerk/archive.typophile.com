  html: |-
    <p>typotherapy+design, Keep Six Contemporary Gallery and the Festival of<br>
    Architecture and Design invite you to</p>
    <p>MyType: An exhibit of limited-edition, new modernist posters by graphic design genius Noel Nanton.</p>
    <p>Exhibition dates: May 2- May 18th. 2008</p>
    <p>Featuring new fonts designed by typotherapy, eye-popping popsicle colours, bold abstract shapes,<br>
    and a very new take on classic modernist typography.</p>
    <p>Starting with the premise that typefaces are as expressive as the words they form, typotherapy<br>
    has created a series of large-format posters that explore the relationship between positive and negative<br>
    space. Letters speak, and if you remove them from the constraints of sentences and even words, they<br>
    have a language of their own. </p>
    <p>MyType uses the craft of typography to find new ways of speaking<br>
    using fonts famous and unknown including Helvetica, Avant Garde and<br>
    typotherapy creations like Tomeri and VWmobile.</p>
    <p>For more information visit: </p>
