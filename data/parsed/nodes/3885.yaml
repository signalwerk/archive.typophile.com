    html: "<p> Todd - Kudos for crafting something special for this craft-related job.  <br> <br>A few things you might look at: <br> <br>* the connectors coming off the u, d and l seem too different from each other. The 'itti' works nicely because the connectors are uniform.  <br> <br>* You might omit the connection between the 'p' and the 'i' and also consider omitting the connector between the d and l. <br> <br>* the g on the middle design is sweet, but the other g fits in better. <br> <br>* You might look at the inconsistent height  of the ascenders on the 'ddl'   <br> <br>* if your ascenders, descenders looped, it might look more...more homespun. <br> <br>* The initial cap 'C' looks too large in relation to the 'K' <br> <br>* Can any knitting tools be incorporated...can the descenders become loose thread? <br> <br>hope this helps. good luck. <br> <br>a few fonts that might work if the client suggests revisions -- P22 has a Needlepoint font, Dave Bastian has a font called Noodle Script, and My Fonts sells Coquette by Mark Simonson. <br> <br> <br>bj </p>"
    html_clean: "<p> Todd - Kudos for crafting something special for this craft-related job.  <br> <br>A few things you might look at: <br> <br>* the connectors coming off the u, d and l seem too different from each other. The 'itti' works nicely because the connectors are uniform.  <br> <br>* You might omit the connection between the 'p' and the 'i' and also consider omitting the connector between the d and l. <br> <br>* the g on the middle design is sweet, but the other g fits in better. <br> <br>* You might look at the inconsistent height  of the ascenders on the 'ddl'   <br> <br>* if your ascenders, descenders looped, it might look more...more homespun. <br> <br>* The initial cap 'C' looks too large in relation to the 'K' <br> <br>* Can any knitting tools be incorporated...can the descenders become loose thread? <br> <br>hope this helps. good luck. <br> <br>a few fonts that might work if the client suggests revisions -- P22 has a Needlepoint font, Dave Bastian has a font called Noodle Script, and My Fonts sells Coquette by Mark Simonson. <br> <br> <br>bj </p>"
