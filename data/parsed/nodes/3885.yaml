    html: <p>Thanks for the comments everyone. <br>I see now that the first stroke of the u looks a bit too much like its owned by the C. But I dont want to detatch it, i like it connected. Im going to take a look and see how other script fonts finish their C's. <br>Ill work on trying out some variations on the l and tt. Ill post the results. Keep m coming though. <br></p>
