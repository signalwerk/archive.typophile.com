    html: <p> I guess since this is a logo for a website, I was going for cutesey, with a dab of tech. Which ended up making it a little more vertical/rigid than fluid. <br> <br>Yeah, I am going to tweak this logo a bit after the holiday here and post some new versions. Thanks for the feedback everyone. </p>
