    html: <p>The thicker style looks a lot better and taking the connector off the p looks nice as well. <br> <br>I was liking the uneven ascenders on the d and l -- have you tried making the t's uneven? Crossing the t's at a slant if you do might help it not look so rigid/techy <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
