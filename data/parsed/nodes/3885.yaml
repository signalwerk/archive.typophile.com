    html: "<p>It took me a while to get back to this logo, but by sorting and absorbing  <br>all the comments above Ive come up with these three variations. Its actually  <br>more of a progression. <br>The first one: is similar to the originals except thicker, more yarn-like,  <br>and I removed the connector on the p. The second: I started to make the  <br>connectors and shape of the n's and u more uniform while leaving the varying  <br>heights of the d's and l alone. I also added some breathing room. Third: I  <br>just finished making the connectors and heights more uniform. What do you  <br>think?  Todd <br><img src=\"http://www.typophile.com/forums/messages/29/4148.gif\" alt=\"Cuddlepie logo2\"></p>"
    html_clean: "<p>It took me a while to get back to this logo, but by sorting and absorbing  <br>all the comments above Ive come up with these three variations. Its actually  <br>more of a progression. <br>The first one: is similar to the originals except thicker, more yarn-like,  <br>and I removed the connector on the p. The second: I started to make the  <br>connectors and shape of the n's and u more uniform while leaving the varying  <br>heights of the d's and l alone. I also added some breathing room. Third: I  <br>just finished making the connectors and heights more uniform. What do you  <br>think?  Todd <br><img src=\"http://www.typophile.com/forums/messages/29/4148.gif\" alt=\"Cuddlepie logo2\"></p>"
