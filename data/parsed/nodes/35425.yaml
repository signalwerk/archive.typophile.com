  html: |-
    <p>I am looking for fonts that have a curved Y like myriad. Any suggestions to help expediate my search is appreciated. I'm working on a logo that ends with "y" and starts with "c" and I would like to somewhat mimic the curve of the "c" with the curve of the "y" at the end</p>
    <p>Example of the y:<br>
    <a href="http://www.imgdumb.com/images/536124Myriad-y.gif" title="http://www.imgdumb.com/images/536124Myriad-y.gif">http://www.imgdumb.com/images/536124Myriad-y.gif</a></p>
