      <p>We've noticed the alignment zone issue with Minion. (Nobody's perfect!) The beauty of web fonts is that fixes can propagated everywhere very quickly. We'll see what we can do...</p>
      <p>Note that the old "Web Type" fonts had the old basic Type 1 character set. These new fonts on Typekit are the "Pro" versions and support the same languages and scripts as their desktop counterparts.</p>
