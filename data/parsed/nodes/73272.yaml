      <p>It's true we did put quite a lot of time into getting these web fonts ready -- but those who are asking "what took you so long?" can probably begin to appreciate that, in striking a balance between visual perfection and actually shipping a product, things slip through the cracks. We appreciate any feedback anyone wants to provide here or elsewhere.</p>
      <p>I wrote: <cite> Still, some Typekit fonts (Myriad, Minion) share the language and script coverage of their full "desktop" versions -- such as Greek and Cyrillic.</cite></p>
      <p>I'm re-reading this and something got lost. (TypeCon sleep deprivation setting in, obviously.) I think what I was trying to say is that some fonts that shipped in the old Web Type package now have <em>more</em> coverage than they did before (such as with Myriad and Minion's Greek and Cyrillic).</p>
