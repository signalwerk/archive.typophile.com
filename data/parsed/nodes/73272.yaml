      <p>thanks for the reply Christopher. I was curious as I had read on Webmonkey the following comments</p>
      <p>&gt;&gt;&gt;Adobe is a little late to the party — the company is one of the last major font foundries to partner with Typekit — but Typekit President and co-founder Bryan Mason tells Webmonkey that the reason for the delay is a heavy attention to detail. </p>
      <p>&gt;&gt;&gt;“Adobe has been working on the hinting and screen rendering of these (and others to follow) for months,” says Mason, “[that] means a character-by-character, weight-by-weight review of each font family.”</p>
      <p>I have noticed a few of the other fonts that have problems with hinting, Myriad Pro Bold for instance at text sizes, has filed in counters on lowercase e, so I just wondered if these types of issues were going to be addressed.</p>
