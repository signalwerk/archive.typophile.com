  html: <p> A while ago I made this thing which tries to show the caps of a font in a cool way. It rhymes the last names of font personalities with a word that kinda relates to the person - see if you can figure out all the "jokes"! (Some of them are pretty weak, though.) <br> <br>(BTW, I was keeping this to myself to use for some grand occasion, but figured to share it here instead. So feel free to use it or abuse it.) <br> <br>---- <br> <br>Aicher's Bunkers <br>Caflisch's Dervishes <br>Excoffon's Francophones <br>Goudy's Hotties <br>Igarashi's Jabberwockies <br>Kis's Luscious <br>Mandel's Nouvelles <br>Ovink's Probings <br>Quay's Rays <br>Sassoun's Typhoons <br>Unger's Vectors <br>Weingart's X-heights <br>Yarmola's Zamboucas <br> <br>hhp </p>
