      <p>I came across a German magazine of that era recently, can't remember the title, but it was a very classy job, and one article in particular struck me, about the autobahn. The photos were gorgeous, but they looked like stage sets, as there were no cars in them. The typography combined Futura Light all cap settings with blackletter in a modern, though symmetrical, layout.</p>
      <p>So I don't think you will find a typographic monoculture on either side of the fence -- witness the communist John Heartfield's use of both blackletter and roman.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/fingers_6119.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/shortage_4638.jpg"></div><p></p>
      <p>With regards to the demise of the blackletter, Naziism played little role in it -- many northern European countries such as Poland, Denmark and Norway used it in the 19th century, and moved to roman before Germany did -- it had long been on the way out.</p>
      <p>The great philologist Jakob Grimm published his work in roman type, and Goethe wasn't too keen on it either, so there was a long-standing tradition of German progressives moving away from blackletter.</p>
