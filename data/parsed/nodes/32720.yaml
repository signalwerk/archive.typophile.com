    <p>Hello!</p>
    <p>I’m designing a book jacket on Nazi WWII propaganda and would like to use type that accurately represents the period. Does anyone have any suggestions?</p>
    <p>I’m particularly confused about whether or not to use a blackletter typeface. I’ve found a lot of information explaining that Nazi’s rejected blackletter typefaces in the early 1940’s. However, most propaganda pieces I’ve found online use some variation of blackletter.</p>
    <p>My other idea was to use Frutiger because that is the typeface of the current Bundeswehr (<a href="http://users.ncrvnet.nl/mstol/bundeswehr.html" title="http://users.ncrvnet.nl/mstol/bundeswehr.html">http://users.ncrvnet.nl/mstol/bundeswehr.html</a>).</p>
    <p>Thanks in advance for your help!</p>
