      <p>"the German copy is set in Fraktur, the typeface used for setting German and other northern languages since Gutenberg. If it hadn’t been for the Nazis misusing these faces for their sinister purposes, we would still be reading Fraktur. It is the typeface of Goethe, Martin Luther, Karl Marx and Hegel. And it is perfectly suited to set our long words and interminable sentences, still evoking Gothic cathedrals and narrow streets with timbered houses. The one used is called Wittenberg Fraktur, after the town where Luther nailed his theses on a church door in 1517."<br>
      Erik Spiekermann<br>
      <a href="http://www.spiekermann.com/mten/2004/03/" title="http://www.spiekermann.com/mten/2004/03/">http://www.spiekermann.com/mten/2004/03/</a></p>
