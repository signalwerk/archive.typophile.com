    <p>Chorus Typeface<br>
    In music Chorus means a collective effort to sing in unison. Harmony and uniformity are it's key characteristics, the same has been integrated in this typeface. Every letterform has been designed so as to reflect harmony and uniformity when used together to form a letter,<br>
    sentence or paragraph.</p>
    <p>Available for purchase on:<br>
    <a href="http://www.myfonts.com/fonts/soneri/chorus/" rel="nofollow">MyFonts.com</a><br>
    <a href="https://www.fontspring.com/fonts/soneri/chorus" rel="nofollow">FontSpring.com</a><br>
