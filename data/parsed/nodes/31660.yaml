      <p>Is the bronze being cast/cut/etched or printed on? Characters in relief or incised will require more space than etching or printing, because of the cutting process you will need more space than you would necessarily use for printing on paper.<br>
      The best answer is to question the manufacturer and look at some of their samples (and to think twice about justifying).</p>
      <p>Tim</p>
