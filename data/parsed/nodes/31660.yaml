    <p>2 questions.</p>
    <p>1. i am in the process of typesetting a bronze plaque and am looking for recommendations on types to use, any suggestions?</p>
    <p>2. I was wondering if you could guide me in the right direction on how to find a rough estimate to use when working with Justification.<br>
    I believe that I understand this much so far:<br>
                    1 em = 1000 units<br>
                    12 pt type = 12 pt em or X pt type = X pt em<br>
                    If an em is 1000 units then:<br>
                    em/2 = 500 units = 50%<br>
                    em/3 = 333.3 units = 33.3%<br>
                    em/4 = 250 units = 25%<br>
                    em/5 = 200 units = 20%</p>
    <p>(Bringhurst, v.3.1 pg 26)   “For example: the word space native to the font used here (Minion Pro) is 227 units wide, or 227 thousandths of an em. The typesetting software is instructed to allow, in the main text, a minimum word space of 85%. That is 193 units: just under a fifth of an em. The maximum word space is set to 150%, which is 340 units: just over a third of an em.”</p>
    <p>How do I figure out the native units of a specific typeface? Are the native units based on line length of individual fonts or are they arbitrary (which I refuse to believe)?<br>
    I am looking for an equation of some kind that will allow me to solve for the native units of a typeface so that I can determine what minimum and maximum percentages to use in order to control my justification?</p>
    <p>HELP!</p>
