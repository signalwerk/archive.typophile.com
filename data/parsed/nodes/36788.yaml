    html: <p>I like it without the lines connecting the balls. The lines hold those elements static whereas the lack of them has movement. I don’t like the blurred drop shadow but it makes me think light shadows for the balls would be cool. Love the “press play” under the name. I don’t think the T F E and WWW in pink is needed.</p>
