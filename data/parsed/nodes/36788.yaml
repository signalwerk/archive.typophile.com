      <p>Hi<br>
      Yes. I love the idea of a circle... it also could be interesting if you could add a cube or a triangle or an oval. Games are all dimensional... and it comes in all shapes and sizes. Colors are ok. maybe try tertiary colors instead of primary or mustard, lilac or olive combo.. layout is clean. How about embossing.../or a cut out?<br>
      Maybe have the type in the middle and have the shapes over the information like a juggler? as another alternative?</p>
      <p>AD-Shamiko</p>
