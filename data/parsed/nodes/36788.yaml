      <p>i think the chemical compound look comes from the connecting rods between the balls. like a high school chemistry model.<br>
      i think the image works a lot better in its usage on the back, w/o the lines. if you wanted a small change, i would suggest moving them around a little so they aren’t so balanced. i know that loses the “play” reference, but it’s more dynamic. you might establish the triangle another way...</p>
