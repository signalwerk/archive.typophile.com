    html: <p>Don't know any official version of Ronda ITC that comes with this alternate /A, not even the <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/ronda/pro/glyphs.html" rel="nofollow">Pro version</a>. If you need to reproduce it exactly, I guess the only option you have is to recreate it (and from /U, should be quite easy).</p>
