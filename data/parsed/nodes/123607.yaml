      <p>If the |A| is what make you think it's not Ronda, depending on the age of the sample, it could well be a non digitised alternate glyph.</p>
      <p>Edit: confirmed here: <a href="http://fontsinuse.com/uses/8676/official-california-visitor-map" title="http://fontsinuse.com/uses/8676/official-california-visitor-map">http://fontsinuse.com/uses/8676/official-california-visitor-map</a><br>
      It looks that, like many 1970s' typefaces, there were plenty of variations that never made it to digital: <a href="http://fontsinuse.com/typefaces/10234/itc-ronda" title="http://fontsinuse.com/typefaces/10234/itc-ronda">http://fontsinuse.com/typefaces/10234/itc-ronda</a></p>
