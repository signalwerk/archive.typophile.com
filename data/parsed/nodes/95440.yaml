      <p>Thanks, Ryuk. </p>
      <p>I'm most concerned with finding a condensed Bodoni or Didot typeface that would be good at display sizes. I really love the "Dangling Man" one. I especially like the curved serifs on the n and a. Does anyone know of any others like that? All the similar ones I'm seeing have curved serifs only on the italics.</p>
      <p>(Note: I meant to say "recommend" not "request" in the original post)</p>
