      <p>"A Novel by": don't know anything, even loosely similar<br>
      "SAUL BELLOW": can't find a match. /S is very "<a class="freelinking external" href="http://www.myfonts.com/search/scotch+roman/fonts/" rel="nofollow">Scotch Roman</a>", serifs are "<a class="freelinking external" href="http://www.myfonts.com/search/BODONI/" rel="nofollow">Bodoni</a>" (flat, thin, straight and horizontal or may be because of scan quality/blurry effect/perspective distortion). A <a class="freelinking external" href="http://www.myfonts.com/search/bauer+bodoni" rel="nofollow">Bauer Bodoni</a> would have been fine but /B, /E and W are off. /L, /E right finals and /W, /E are close to <a class="freelinking external" href="http://www.myfonts.com/search/baskerville" rel="nofollow">Baskerville</a> but all (flat) serifs are off... Definitely not an answer...</p>
