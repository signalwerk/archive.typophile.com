    html: |-
      <p>Generally, Adobe's "Std" fonts lack the extended language support that you find in their "Pro" fonts.</p>
      <p>Nevertheless, they are not necessarily limited to a small glyph set. Depending on the font, they may have many glyphs more than you'd expect: for example, Poetica is a "Std" face, but has a great number of alternate glyphs, Kepler is Std, but has ornaments, small caps and swashes.</p>
