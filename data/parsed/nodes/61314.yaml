      <p>Most of the Flag Waving and many of the comic heroes grew out of the two World Wars. Later, advertisers wanted to grab a piece of the action and put the flag waving stuff in everything they wanted to sell. It was a legitimate part of American culture then but is more than half a century past its era. Today, it just looks like right-wing American extremist hogwash when used out of its element. I know  I am very anti-nationalism of all kinds because the "WE are great" rhetoric can sometimes lead to armed conflict. The type can still be used skillfully with the right subject matter and a twinge of humor. Let's hope that is what happens.</p>
      <p>ChrisL</p>
