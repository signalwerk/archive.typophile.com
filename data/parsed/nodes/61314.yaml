      <p><em>From the designer:</em>  They weren't always red, white and blue and full of stars. The American Patriot fonts were originally designed and tested and kerned to within an en-space of their lives minus any patriotic effects, all to ensure their viability as normal, healthy, functional faces. Thought it might be interesing for everyone to see a few of the earliest test layouts to that end. The "over the top" layouts were just icing on the proverbial cake, intended to point heavily at their vintage origins, the three styles ranging in time from the 1940s to the 1970s. </p>
