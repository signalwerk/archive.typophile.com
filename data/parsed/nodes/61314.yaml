      <p><em>Interesting theory...</em></p>
      <p>My "gripe" is with jingoism. But that's just me, and I don't know how it would affect graphic designers in general.<br>
      The productization and marketing of this typeface is another issue.<br>
      If you have a product with broad applications (i.e. the basic typeface), why name and market it with a feature that has narrow application? Sure, it gives it a high profile, but as a result the chances are that people would not consider the basic design for non-patriotic duties.</p>
