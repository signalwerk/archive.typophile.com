      <p>johnnydib: Fortunately or unfortunately, the layers are not opentype features. Each layer is a font style - italic, bold, and bold italic. The PDF specimen explains the layering in detail.</p>
      <p>James: Thanks and thanks for the tip.</p>
      <p>Does anyone here besides James and myself read comic books? Personally, I will probably never use the layed effects. I don't do much for political campaigns or July 4th sale ads. I certainly will not have a hand in promotional material for the upcoming Captain America movie (more is the pity.) However, I will have lots of applications for the basic fonts because the letterforms are bold and make some very interesting negative space - especially for logo work. </p>
