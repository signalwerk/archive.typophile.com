      <p>I definitely agree with the above statements, especially regarding hierarchy. I think you're missing a comma. Right now it reads "A t-bone steak cheese, eggs &amp; welch's grapes." Need a comma after "steak." </p>
      <p>The font choices are pretty nice, but what is the context of this? Why is this semi-thug looking guy ordering breakfast? Would a thuggish man speak in a matter that inspires a curlycue A?</p>
