      <p><em>Steak</em> is the main attraction, but right now my eye goes first to <em>cheese</em> and <em>eggs</em>, because of the yellow color and the egg glyphs. Maybe make <em>steak</em> red?</p>
      <p>I find the swash <em>A</em> distracting. I like the swash because it harmonizes with the ampersand and the decorative flourish at the upper right, and I like the thinness of the letter in contrast to the heavy slab serif for <em>steak</em>. But <em>A</em> isn't information--it's just the indefinite article. Is there a swash <em>T</em> in that font that you could use for the <em>T</em> in <em>T-bone</em>?</p>
      <p>Can you find a swirly ampersand with greater contrast between thick &amp; thin strokes, so it looks more like the initial letter at the upper left?</p>
      <p>Unless this is an ad for Welch's Grape Juice, <em>Welch's Grape</em> is getting way too much emphasis here. (Of course, I wouldn't order grape juice anyway. Depending on the time of day, I'd wash this meal down with a big mug of black coffee or a nice cold beer.)</p>
      <p>Returning to our original topic (typography, if I recall), I'd play down <em>Welch's Grape</em>, and use a font that works better with the rest of your design. Try something along the Bodoni/Century line, not too bold. And maybe make it purple.</p>
      <p>I kind of like the sketchy style of the face, but he looks too angry. I would look happier if I were about to eat this meal.</p>
