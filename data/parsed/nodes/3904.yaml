    html: "<p>* THE VOTING BOOTH IS OPEN! * <br> <br>Between now and December 14th, cast your votes for the second Typophile Tee (\"Popular Vote\").  <br> <br>Each individual may submit only ONE (1) ballot, but you get three votes, so make them count! You may cast them all toward one favorite design, or you can distribute them as you wish among 2 or 3 shirt designs. <br> <br>Our top 20 finalists were chosen by Joe and I, based on comments and critiques posted by you throughout the contest, with our own personal favorites thrown in for good measure. <br> <br>Vote at: <a href=\"http://www.typophile.com/vote/\" target=\"_blank\">http://www.typophile.com/vote/</a> <br> <br>We'll announce the winner on December 15th, and then it's off to the screen shop!  <br> <br>jb</p>"
