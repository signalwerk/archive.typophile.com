  html: "<p>Ladies and Gentlemen,  <br> <br>It gives us great joy to announce the long-anticipated winner of the first annual Typophile Tee contest. But first let's thank our judges, Rich Roat (House), Jonathan Hoefler (HTF), Erik van Blokland (Letterror), Carlos Segura (T26) and Cyrus Highsmith (Font Bureau), who gave of their time to help us select the winner today. <br> <br>We'll thank our judges by sending them copies of the winning tee for themselves and their staff. <br> <br>Without further ado, our winner was: shirt # 29.006, submitted by Mark Simonson! <br> <br><img src=\"http://www.typophile.com/forums/messages/72/3095.gif\" alt=\"29006front\"> <br><img src=\"http://www.typophile.com/forums/messages/72/3096.gif\" alt=\"29006back\"> <br> <br>Mark will receive the $250 prize donated by Los Angeles-based <a href=\"http://www.apollo26.com\" target=\"_top\">Apollo26</a> and three shirts to share with his loved ones. Typophile thanks Apollo26 for their support during this contest. <br> <br>The race was a close one! Here are the runners-up, in order: <br> <br>1st runner up: <a href=\"http://www.typophile.com/forums/messages/1662/1792.gif\" target=\"_blank\">05.003</a> by \"etherbrian\" (USA) <br>2nd runner up: <a href=\"http://www.typophile.com/forums/messages/1662/2357.gif\" target=\"_blank\">38.019</a> by Christopher Simmons (USA) <br>3rd runner up: <a href=\"http://www.typophile.com/forums/messages/1662/2064.gif\" target=\"_blank\">18.007</a> by James Grieshaber (USA) <br>4th runner up: <a href=\"http://www.typophile.com/forums/messages/1662/2451.gif\" target=\"_blank\">43.015</a> by Jmeno Obluda (USA) <br>5th runner up: <a href=\"http://www.typophile.com/forums/messages/1662/2498.gif\" target=\"_blank\">45.011</a> by Carlos Moreno (Spain) <br> <br>Other designs that received votes in the final round include: <br> <br><a href=\"http://www.typophile.com/forums/messages/1662/1825.gif\" target=\"_blank\">09.003</a> by Tommi Kortesniemi  <br><a href=\"http://www.typophile.com/forums/messages/1662/2061.gif\" target=\"_blank\">18.002</a> by Allon Kaye (England) <br><a href=\"http://www.typophile.com/forums/messages/1662/2053.gif\" target=\"_blank\">23.009</a> by Joe Pemberton (USA) <br><a href=\"http://www.typophile.com/forums/messages/1662/2114.gif\" target=\"_blank\">26.005</a> by Peter Freedman (USA) <br><a href=\"http://www.typophile.com/forums/messages/1662/2312.gif\" target=\"_blank\">37.005</a> by Heinrich Lischka (Germany) <br><a href=\"http://www.typophile.com/forums/messages/1662/2355.gif\" target=\"_blank\">38.018</a> by Christopher Simmons (USA) <br><a href=\"http://www.typophile.com/forums/messages/1662/2359.gif\" target=\"_blank\">38.020</a> by Christopher Simmons (USA) <br><a href=\"http://www.typophile.com/forums/messages/1662/2486.gif\" target=\"_blank\">45.002</a> by Dave Bruck (USA) <br><a href=\"http://www.typophile.com/forums/messages/1662/2589.gif\" target=\"_blank\">46.010</a> by Dave Chau (USA) <br> <br>Congratulations to all our participants! <br> <br> <br>* * * * * <br>BY POPULAR DEMAND, we've decided to print a second shirt, and we'll choose it by popular vote from a selected group of the top entries. Details to follow, stay tuned. We're prepping the HTML as we speak. <br>* * * * * <br> <br>Finally, for those of you who went out and bought jugs of milk and now have unruly, hairy, green, gelatinous  masses, our sincere apologies <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\">  You can throw them out now.</p>"
  html_clean: "<p>Ladies and Gentlemen,  <br> <br>It gives us great joy to announce the long-anticipated winner of the first annual Typophile Tee contest. But first let's thank our judges, Rich Roat (House), Jonathan Hoefler (HTF), Erik van Blokland (Letterror), Carlos Segura (T26) and Cyrus Highsmith (Font Bureau), who gave of their time to help us select the winner today. <br> <br>We'll thank our judges by sending them copies of the winning tee for themselves and their staff. <br> <br>Without further ado, our winner was: shirt # 29.006, submitted by Mark Simonson! <br> <br><img src=\"http://www.typophile.com/forums/messages/72/3095.gif\" alt=\"29006front\"> <br><img src=\"http://www.typophile.com/forums/messages/72/3096.gif\" alt=\"29006back\"> <br> <br>Mark will receive the $250 prize donated by Los Angeles-based <a href=\"http://www.apollo26.com\" target=\"_top\" class=\"link-external\">Apollo26</a> and three shirts to share with his loved ones. Typophile thanks Apollo26 for their support during this contest. <br> <br>The race was a close one! Here are the runners-up, in order: <br> <br>1st runner up: <a href=\"http://www.typophile.com/forums/messages/1662/1792.gif\" target=\"_blank\" class=\"link-lost\">05.003</a> by \"etherbrian\" (USA) <br>2nd runner up: <a href=\"http://www.typophile.com/forums/messages/1662/2357.gif\" target=\"_blank\" class=\"link-lost\">38.019</a> by Christopher Simmons (USA) <br>3rd runner up: <a href=\"http://www.typophile.com/forums/messages/1662/2064.gif\" target=\"_blank\" class=\"link-lost\">18.007</a> by James Grieshaber (USA) <br>4th runner up: <a href=\"http://www.typophile.com/forums/messages/1662/2451.gif\" target=\"_blank\" class=\"link-lost\">43.015</a> by Jmeno Obluda (USA) <br>5th runner up: <a href=\"http://www.typophile.com/forums/messages/1662/2498.gif\" target=\"_blank\" class=\"link-lost\">45.011</a> by Carlos Moreno (Spain) <br> <br>Other designs that received votes in the final round include: <br> <br><a href=\"http://www.typophile.com/forums/messages/1662/1825.gif\" target=\"_blank\" class=\"link-lost\">09.003</a> by Tommi Kortesniemi  <br><a href=\"http://www.typophile.com/forums/messages/1662/2061.gif\" target=\"_blank\" class=\"link-lost\">18.002</a> by Allon Kaye (England) <br><a href=\"http://www.typophile.com/forums/messages/1662/2053.gif\" target=\"_blank\" class=\"link-lost\">23.009</a> by Joe Pemberton (USA) <br><a href=\"http://www.typophile.com/forums/messages/1662/2114.gif\" target=\"_blank\" class=\"link-lost\">26.005</a> by Peter Freedman (USA) <br><a href=\"http://www.typophile.com/forums/messages/1662/2312.gif\" target=\"_blank\" class=\"link-lost\">37.005</a> by Heinrich Lischka (Germany) <br><a href=\"http://www.typophile.com/forums/messages/1662/2355.gif\" target=\"_blank\" class=\"link-lost\">38.018</a> by Christopher Simmons (USA) <br><a href=\"http://www.typophile.com/forums/messages/1662/2359.gif\" target=\"_blank\" class=\"link-lost\">38.020</a> by Christopher Simmons (USA) <br><a href=\"http://www.typophile.com/forums/messages/1662/2486.gif\" target=\"_blank\" class=\"link-lost\">45.002</a> by Dave Bruck (USA) <br><a href=\"http://www.typophile.com/forums/messages/1662/2589.gif\" target=\"_blank\" class=\"link-lost\">46.010</a> by Dave Chau (USA) <br> <br>Congratulations to all our participants! <br> <br> <br>* * * * * <br>BY POPULAR DEMAND, we've decided to print a second shirt, and we'll choose it by popular vote from a selected group of the top entries. Details to follow, stay tuned. We're prepping the HTML as we speak. <br>* * * * * <br> <br>Finally, for those of you who went out and bought jugs of milk and now have unruly, hairy, green, gelatinous  masses, our sincere apologies <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\">  You can throw them out now.</p>"
