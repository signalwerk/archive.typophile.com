  html: |-
    <p>I am currently designing a logotype for a center for children. The logo the client wants is the word "HOPE" with the letter "O" representing a small pictorial scene. I need a typeface that has a nearly-perfect circular "O," but Futura doesn't exactly scream "kid-friendly."</p>
    <p>Does anyone have any suggestions for another typeface with an almost perfectly circular letter "O" that is a little more inviting than Futura?</p>
    <p>EDIT: And, please, for the love that is all good and holy, do not suggest Gotham. While a lovely typeface, it's been used to death, clearly.</p>
  html_clean: |-
