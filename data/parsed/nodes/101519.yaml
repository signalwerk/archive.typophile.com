      <p>This one is the original version of <a class="freelinking external" href="http://www.logodesignlove.com/saul-bass-logos" rel="nofollow">Kleenex logo designed by Saul Bass</a> in the 80's (later modified in 2008 by <a class="freelinking external" href="http://www.sterlingbrands.com" rel="nofollow">Sterling Brands</a>).<br>
      Some suggestions for (very) loosely similars: <a class="freelinking external" href="http://www.myfonts.com/foundry/Hubert_Jocham_Type" rel="nofollow">Hubert Jocham Type</a> (Schoko, Susa, Drop, Jocham...), <a class="freelinking external" href="http://www.myfonts.com/fonts/mika-melvas/santeli" rel="nofollow">Santeli</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/profonts/northport" rel="nofollow">Northport</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/profonts/energia-pro" rel="nofollow">Energia</a></p>
