  html: |-
    <p>I have just started with this project and would love to hear feedback from other designers.<br>
    Designing for the agricultural industry is always a challenge.</p>
    <p>The client has selected these two logos as his preferences so far.<br>
    The logo to the left - Client would like to see JD style bolder (Any recommendations for a bolder style / I’m thinking more masculine?)<br>
    The logo to the right - Client sees a crown / I was going for more of an abstract wheat / arrow / agriculture + technology (moving forward)</p>
    <p>I am limited to the yellow / green colors. The company is a seller of John Deere equipment plus other industrial brands.</p>
    <p>Ag stands for the agriculture customer base the customer serves and tech is for the technology that is a key part of their products and services they offer.</p>
