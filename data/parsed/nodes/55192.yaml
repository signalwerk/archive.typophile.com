    html: <p>Looks like the client is trying to become John Deere through the color choices and initials! As far as fonts go...hmmm. Univers Black? Perhaps Frutiger? Helvetica Neue? Those would provide kind of a masculine feel while also hinting at technology without being too overbearing if used carefully.</p>
