  - id: 332025
    user: 18563
    date: 2009-02-27T13:27:00
    date_raw: 27 Feb 2009 — 1:27pm
    votes: null
    html: <p>I'd also see if you could perhaps steer the client away from the painfully obvious John Deere colors. It just seems too - copy-cattish? Try to find some different color schemes. Also as far as agricultural imagery go, your leaf/crown is a bit too sharp - makes it seem unfriendly. Try to add some curves to it, make it less angular. Anyway, that's my thoughts. I'm sure I'll have more.</p>
