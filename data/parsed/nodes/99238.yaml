      <p><cite>there is a unicode for euro.smcp, or dollar.smcp, etc, ...</cite></p>
      <p>Really? Where? Aside from private use, that is. Generally, small caps are not separate characters in Unicode (except for phonetics), and receive no Unicode index. That some give them a private use number is a private matter between consenting adults.</p>
