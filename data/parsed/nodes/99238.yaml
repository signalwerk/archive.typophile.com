      <p>Charles is correct.</p>
      <p>All these small cap glyphs are accessed as alternates, generally by means of small cap formatting, which in turn applies an appropriate layout feature. You need to be sure to hook them up to the 'smcp' feature. There is rarely any strong reason to encode them.</p>
