    <p>Hi all,</p>
    <p>It seems that, although there is a unicode for euro.smcp, or dollar.smcp, etc, there isn't one for rupee.smcp. Am I wrong? The rupee sign itself has a unicode, so it seems odd to exclude a smallcap rupee from the list. Is there any way of solvinf this, or are we simply to wait for a unicode upgrade?</p>
    <p>Cheers, jasper</p>
