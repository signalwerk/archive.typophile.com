      <p>&gt; definitions of masculine and feminine are bound to time</p>
      <p>Fashion, styles, etc. change over time (clothing, hair, appropriate occupations, etc), and they also vary in different parts of the world. But if you're designing for a modern audience, it shouldn't be too hard to figure out what is considered masculine and feminine by most folks in that country. Look at magazines sold for men and those sold for women and look at the stylistic differences.</p>
