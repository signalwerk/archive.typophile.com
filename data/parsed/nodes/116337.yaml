      <p>Other typeface families that are like Sense and Sensibility — in the way that the family is constituted along “cultural” design axes, rather than the traditional qualities of weight, horizontal scale, and slant:</p>
      <p>Chalet (1960, 1970, 1980)<br>
      Hypatia (humanist &amp; modern stylistic sets)<br>
      Leitura (both slab and high-contrast Bolds)<br>
      Mr Eaves (Sans and Modern)</p>
      <p>&amp;c.</p>
