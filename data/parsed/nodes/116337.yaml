      <p><em>Austin's novel is irrelevant – the fonts Sense and Sensibility do in fact express different degrees of testosterone. :-)</em></p>
      <p>I’m afraid that’s an interpretation that doesn’t jibe with the facts!</p>
      <p>The “clean” version, Sense®, which could be interpreted as the no-nonsense masculine, was meant for news headlines in feature articles, in which the head was part of specially designed page layouts, accompanying pictures, and thus required to be understated and play second ﬁddle to the other graphic elements.</p>
      <p>The busier version, Sensibility, which could be interpreted as the frilly feminine, was meant for basic news heads in default layouts, often without pictures, in which the headlines were required to carry more visual interest.</p>
      <p>What they express, as a pair, is their relative function in the document for which they were designed.</p>
      <p>I named them Sense and Sensibility after a search of name pairs, looking for two that would appear next to one another in font menus.</p>
      <p>I decided to name the reductive version Sense because it has fewer letters, not because the typeface looks more masculine, and the busy version Sensibility, because it is a busier-looking word, with all those extenders.</p>
