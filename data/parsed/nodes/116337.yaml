      <p>I’m not in favor of applying sexual stereotypes to typefaces or their names.<br>
      (Unless it’s really clever, like Mrs &amp; Mr Eaves.)<br>
      For instance, it could perhaps be assumed that my <a href="http://origin.myfonts.net/s/aw/original/88/0/45280.pdf" rel="nofollow">Sense &amp; Sensibility</a> represent a polarization of sexual qualities—but it’s worth remembering that in Austen’s novel both these attitudes were represented by female characters.</p>
