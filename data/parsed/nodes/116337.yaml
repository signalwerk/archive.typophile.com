      <p>It can also be argued that roman = male and italic = female. But the definition of a proper counter pair is always dependent of the definition of the scope. When one leaves out italic, one may also come to this conclusion: <a href="https://www.flickr.com/photos/albert-jan_pool/8222620523/in/set-72157632109598583" title="https://www.flickr.com/photos/albert-jan_pool/8222620523/in/set-72157632109598583">https://www.flickr.com/photos/albert-jan_pool/8222620523/in/set-72157632...</a><br>
      Or when you stick to sans serif, you may find this combination here appropriate: <a href="https://www.flickr.com/photos/albert-jan_pool/8223240451/" title="https://www.flickr.com/photos/albert-jan_pool/8223240451/">https://www.flickr.com/photos/albert-jan_pool/8223240451/</a> It has to be considered though, that in schemes like these, our perception on wether the counter pairs have been defined properly, is also dependent on the selection of the counter pairs for a specific diagram.</p>
