    <p>When using small caps to represent numbers what is the rule for a representing a phrase like "5-day forecast"? Would just the "5" be in small caps or would "5-day" be in them?</p>
    <p>Thoughts? A resource to direct me to? I checked The Elements of Typographic Style but couldn't find a specific answer to this.</p>
