      <p>I am having problems with the concept of small caps and numbers. Do you mean old style numbers? Small caps are, by definition, letters only. </p>
      <p>Generally you will use old style numerals when you are using small caps. If the word DAY was in capitals otherwise, you would put it into small caps. If it was not, you would leave it lower case. What you want to avoid is a large group of consecutive full capital letters, which create a dark spot in the color of the page.</p>
      <p>BTW, this question would have fit into the General discussion forum, and you might want to repost it there. By now it would have had 100 responses, instead of my lonely, late one. This forum is more used for educational (think schools) issues, and rarely visited.</p>
