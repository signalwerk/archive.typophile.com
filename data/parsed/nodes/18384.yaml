  html: |-
    <p>I am creating a PDF specimen which I would like to open in full screen mode when people download the file.<br>
    Despite specifying this in Acrobat, when the file icon is double-clicked, it still opens in the OS X "Preview" application, with menu palettes. That's because the OS X default for viewing PDFs is Preview, damnit (I also detest the default that "opens" PDFs accessed online in Safari).</p>
    <p>I have tried specifying Acrobat as the opening application, by using the "get info" dialog, but it only permits one Acrobat version to be specified, not Acrobat in general.</p>
    <p>Is there a way around this?</p>
  html_clean: |-
    <p>I am creating a PDF specimen which I would like to open in full screen mode when people download the file.<br>
    Despite specifying this in Acrobat, when the file icon is double-clicked, it still opens in the OS X "Preview" application, with menu palettes. That's because the OS X default for viewing PDFs is Preview, damnit (I also detest the default that "opens" PDFs accessed online in Safari).</p>
    <p>I have tried specifying Acrobat as the opening application, by using the "get info" dialog, but it only permits one Acrobat version to be specified, not Acrobat in general.</p>
    <p>Is there a way around this?</p>
