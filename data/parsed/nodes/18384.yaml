      <p>I wouldn't expect to be able to control how Mac (or any) users view a PDF file. I assume that any feature like this would be strictly opt-in, but I don't think there's any way to force a full-screen mode.<br>
      On the Mac, there's just a lot of software diversity, both with whatever browser the person has, and the way they chose to view PDFs.</p>
