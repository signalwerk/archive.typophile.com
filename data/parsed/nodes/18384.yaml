    html: <p>If I recall correctly, the first 3 versions of OS X supported the "open in full screen" feature that could be built into an Acrobat file, because double-clicked Acrobat files were opened in Acrobat (makes sense, eh?!) But with "Tiger", Preview, which does not support that feature, has pre-empted Acrobat.</p>
