    html: |-
      <p>Nick,</p>
      <p>You might try to delete the preference file for Preview. Under your home directory, visit the library folder/preferences and delete the com.apple.preview.plist file. Empty your trash and try and double click on that PDF. Sometimes the poor Mac OS is a little selfish when it comes to giving up ownership. Hope it works and if I can think of anything else, I'll gladly repost. Best,<br>
      Daphne</p>
