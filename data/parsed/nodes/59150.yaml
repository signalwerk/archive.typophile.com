      <p>&gt;I’ve been working on my font Mint and <strong>my company</strong></p>
      <p>If you're under contract they may already have certain rights around work you do, even if you do it in your own time. So I would be inclined to not play hardball with them. Why not provide the logo outlined? That might avoid all the complicated licensing effort.</p>
