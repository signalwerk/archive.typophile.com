      <p>Looks like we have decided to go with Bryant (ah well, sure I'll be able to use Mint for something soon). The agency thought that was the best for the job so I'm going with their judgment. I think also it will be more useable since there are four weights that can be used for supporting documents. Mint is not at that stage of readiness yet. </p>
      <p>So now I'm using Bryant for titles and stuff, can anyone recommend a companion body face for it? Currently I'm using Minion which doesn't quite look right. I'll have to have a dig around but if anyone has paired it with a serif before I'd love to hear which.</p>
