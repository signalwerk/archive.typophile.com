  html: |-
    <p>Dear Typophiles,</p>
    <p>I've been working on my font <a class="freelinking external" href="http://www.typophile.com/node/55891" rel="nofollow">Mint</a> and my company is interested in licensing a beta version of it for the logo, so only a small subset of the glyphs will be used. My company is paying a design agency to create the whole logo including graphics and text. If we ask the agency to use Mint, I have two questions.</p>
    <p>1   Am I licensing the font to the agency or to my company? Should I charge?</p>
    <p>2   What sort of licence would be best? I haven't written one before so I just want something very quick and easy. I want them to use it <strong>only for this logo</strong> as the font is still being tweaked and is not yet released. I guess I can write any kind of licence I want?</p>
    <p>All advice gratefully welcomed.</p>
    <p>Thanks :)</p>
  html_clean: |-
