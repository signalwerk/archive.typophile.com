    html: |-
      <p>In 1930 a font was something made of metal (or wood) and intended for putting ink on paper. Any large lettering on an irregular surface (like a boat) would have been hand-painted.<br>
      Try searching for Dutch signs from that period (shops, bars, restaurants, hotels, etc.) and you'll probably find the sort of lettering you would have seen on boats.</p>
