  html: |-
    <p>I understand that "Nodes at Extremes" are a necessary part of hinting. </p>
    <p>And though I do NOT understand the subtleties of hinting (I just click F7) putting nodes at extremes has broadly become the way I  draw most curves anyway.</p>
    <p>When my glyph has a broad curves at the extremes or corners that turn at the extremes, everything is honky dory...</p>
    <p>But things don't always work out that way:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/nodes01_4376.gif"></div><p></p>
    <p>When I put nodes at the extremes of tiny curves (like in A,V and W glyphs with diagonals that have rounded edges) the curve gets wobbly.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/nodes02_6458.gif"></div><p></p>
    <p>Do I need to turn my UPM up to 2000 to handle the fidelity for these fine curves? </p>
    <p>Or can I just not worry about it and let my nodes just be really close to the extremes in those few cases?</p>
    <p>I DO plan to generate both OT type 1 and Truetype eventually...</p>
