      <p><cite>However, the letter that looks like an eszet seems to be something new.</cite></p>
      <p>I think you are referring to the в (v), which rises to ascender height in some Cyrillic cursive forms so that it looks like modern forms of the Greek beta without a descender. This form also shows up outside of Bulgaria.</p>
      <p>Thanks for linking to the newspaper examples, Miguel. Most of them seem to be using a mix of different styles of Cyrillic typefaces—traditional, Bulgarian, and just standard Cyrillic cursive forms.</p>
      <p>By standard Cyrillic cursive forms, I just mean that the forms used in the typical Cyrillic cursive have been adopted for the upright letters. Look at the <em>Труд (Trud)</em> example to see what I mean. Bulgarian forms go further and add ascenders on some of these letters, which I personally have a hard time liking. I get the need to break up the monotony of all the letters confined to the x height, but an ascender on the ю (yu) just seems illogical.</p>
