    html: |-
      <p>The D that looks like a lowercase g, and the I that looks like a lowercase u, are indeed standard Cyrillic italic/cursive forms, found in Russian-language italic fonts. So is a T that looks like a lowercase m, or the P that looks like a lowercase n, or the G that looks like a backwards s.</p>
      <p>However, the letter that looks like an eszet seems to be something new.</p>
