      <p>The AAUP show is one interesting cross-section, as would be the AIGA 50 (which Linotype used to tout in their marketing in the 1940s &amp; 50s). But these are winning book designs from a large pool of submissions, and I don't think the type choices in the winners is necessarily representative of the majority. (I say this as one of the judges of last year's AAUP show).</p>
      <p>And Nick is right: anything we come up with here is likely to be highly anecdotal and not necessarily any accurate representation.</p>
      <p>That said, several years ago, in preparation for a talk I gave to the Vermont Book Publishers Association, I did an informal survey by going to my local library and poring over the two stacks of new fiction and nonfiction titles and tallying the text typefaces. I thought that would constitute a good random sampling. (Not everything newly acquired at my library is necessarily newly published.)</p>
      <p>The sample was 313 books. There were 56 different typefaces (and I think there were only one or two that I wasn't able to identify without later checking a resource). Half of these appeared in only 1 or 2 books. Here is the list of typefaces that appeared in 10 or more books:</p>
      <p>34 Sabon<br>
      28 Bembo<br>
      27 Times New Roman<br>
      18 Adobe Garamond<br>
      16 Baskerville [I didn't distinguish which source(s)]<br>
      15 Minion<br>
      15 Janson<br>
      12 Garamond (Jannon) [probably a combination of Mono &amp; Lino No. 3; I don't think I was distinguishing between them]<br>
      10 Fournier<br>
      10 Centaur</p>
      <p>This was probably 2002 or 2003. </p>
      <p>If I were to do this exercise again now, I would expect Minion to rise slightly, AGaramond to drop slightly perhaps, Fournier might rise slightly, Janson would probably drop off this top, and Centaur might drop off also. Trends come and go. But I would not be surprised if the top three did not change.</p>
      <p>FWIW</p>
      <p>-- Kent.</p>
