      <p>For what it's worth, when I was discussing the development of Adobe Jenson with Fred Brady, sometime around 1995, he said that one of the main reasons Adobe was doing the typeface was because of the large amounts of prize-winning books done in Centaur. (some book design prize or another, forget which one)</p>
      <p>I then asked him how many copies of Jenson Adobe expected to sell. 10,000? 20,000?</p>
      <p>He said, 'We'd be very happy to sell a thousand.'</p>
      <p>It was one of the most depressing days of my life!</p>
      <p>(Also for what it's worth, when I did a short piece, brilliantly illustrated by Jeff Level, on Monotype Centaur, after it first came out in PS, for the Ziff magazine PC Sources, it sold 200 copies for Monotype. I thought that was nothing, but Monotype was ecstatic -- they'd never sold so many copies of a retail PC font before. Alas, that's not a feat that can be repeated anymore!) </p>
      <p>(Straying a little further: around 1996, I or my editor at DTPJ, Linda Lee, had heard that Adobe was on the point of axing the entire type department. It's difficult to imagine today, when we have so many more designers and foundries, what a blow that would have been. So we cooked up the idea of giving an extravagant four pages over to the the new Jenson, on the theory that the type department needed all the good press it could get. I didn't like Jenson, and didn't entirely conceal that, but managed to say a great number of extremely nice things about Adobe type. Whether it made any difference to the fate of the type department, I can't say. There was a point somewhat later when I heard that Warnock confirmed his unqualified support of the type department. Some bean counter or another wanted to get rid of it. It certainly wasn't lucky with its managers in those days. Things are much better now.)</p>
