      <p>Eben: For an historical perspective (or maybe just a long-term recency illusion), see if you can find a good archive of the old "Monotype Recorder," the house publication of Monotype. They used to run an annual tally of faces used in Britain. I think this was, as the AAUP show Charles &amp; Kent mentioned, based on a design competition. I'm speaking here of the 1950s and 1960s, so hot-metal. I'm not sure how long it was published.</p>
      <p>The 1979 and 1983 AAUP catalogs (the earliest ones I have here at work) do not have typeface use indexed. By 1987 the type index was included. &amp; in 1987 there's a face called "Meleor." </p>
      <p>I'd be willing to photocopy the face indexes from the 17 AAUP catalogs I have (if you give me some time and a mail address).</p>
      <p>Also historically you could look at the AIGA 50 Books of the Year catalogs (for some time this showing was separate from the regular AIGA design competition). I don't know if they had tallies, but in most years the faces are listed with the showing of each book.</p>
      <p>powers</p>
