    <p>Is there good data on what the most frequently chosen type faces are for novels, histories, lit, humor poetry etc; ( books set on matte paper without color? ) </p>
    <p>My flatpmate, Julia here at Reading showed me this:<br>
    <a href="http://www.museum-der-arbeit.de/Service/Schrift+Typografie/" title="http://www.museum-der-arbeit.de/Service/Schrift+Typografie/">http://www.museum-der-arbeit.de/Service/Schrift+Typografie/</a></p>
    <p>...but this is just for one publisher if I understand correctly.</p>
    <p>So I was wondering what else the collective brain here may have run across before or simply knows. </p>
    <p>Thanks!</p>
