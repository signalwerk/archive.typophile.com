      <p>The <cite>AAUP Book, Jacket and Journal Show</cite> indexes several things, including typefaces used. For the books &amp; jackets selected in the 2007 show, there were 95 faces used. For the selections in the 1992 show, there were 19 faces used.</p>
      <p>The index doesn't sort between text and display fonts, or fonts used only on the jacket. As a rough guess, there were 25 different fonts used for text in 2007, 15 in 1994.</p>
      <p>In 2007, for (maybe) text, Arnhem had 3, Bembo 4, Caslon 4, Electra 3, Fournier 3, Garamond 7, Minion 6, New Baskerville 5, and Scala 8. The rest were one or two instance. Fonts that had 2 uses add Schoolbook, and Trinite. See the comment below about jackets.</p>
      <p>In 1997 for text, Bembo 6, Galliard 5, Joanna 3, and Sabon 11. Fonts that had two uses, Aldus, Baskerville, Bodoni, Garamond No. 3, and Palatino.</p>
      <p>About 50 books were selected in 1992 and 51 in 2007. However, the numbers of fonts selected does include the jackets only category, and obviously, text fonts also appear on jackets. As an observation, there is less tendency to use the font "of the book" on the jacket in 2007 than there was in 1992, and that skews the data.</p>
      <p>The perception that the Association of American University Presses show includes only scholarly monographs would be wrong. Only about 25% fit that category. </p>
      <p>FWIW</p>
