    html: |-
      <p>Mr Deux,</p>
      <p>I think you are way off the mark. Your cover does not need to contain "flashiness" or "repetition".</p>
      <p>Minion is primarily a test face. Perhaps it is not the ideal font to use in this design. </p>
      <p>There are a lot of ways for you to solve this typographic design without resorting over wrought design devices.</p>
      <p>How about taking the basic information you have to communicate and compose it in a simple and straight forward manner, paying attention to line breaks and logical clusters of information? Use scale, contrast and white space to create a bit tension on the page.</p>
      <p>This isn't brain surgery. (Although it might be a bit of rocket science).</p>
