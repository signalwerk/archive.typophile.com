    html: |-
      <p>Hey all. Thanks a bunch for the feedback! I have two new specs. They will probably need some additional tidying, but they carry the idea successfully. (That is to say, they continue my thinking.) Links in first post!</p>
      <p>Fontgrube: Even though I wanted "Student Concerns Report" to stand out, I reasoned that removing those words from the block of text was more or less unnecessary. The title is repeated several times. EVENTUALLY, one way or another, the audience will be able to tell what the publication is.</p>
      <p>William: I've streamlined the text. Now, the reader must begin where all good English texts start—from the top (of the text).</p>
      <p>Terminal: I've gotten rid of the negative indent in one example, so I don't think a change in size is necessary. I have increased the weight in both instances, as you'll see.</p>
      <p>Oprion: Amen. The logo is fine given that the wavy look could be reasoned as the designer's "intention." The text is unsalvageable. But changing the logo is not in my purview at this moment.</p>
