    html: |-
      <p>I am attempting to make a visually appealing cover with just typography.</p>
      <p>It does require a little bit of flashiness for success. It isn't intuitive per se; the repetition does not support the meaning, only the design. The guiding light for the project has been "credibility" and as a designer, I have taken this to mean a cover that includes a type of minimal elegance using what is already present—in this case, typography.</p>
      <p>I am reconsidering it though. I am straddling a fine line between boring and over-designed. I am trying hard to make purposive design, but it sits dully on the page and who will that serve but unresponsive conventions?</p>
      <p>Still, a great much to consider.</p>
      <p>Thank you all!</p>
