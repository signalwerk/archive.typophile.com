      <p>It took a minute for me to see exactly what you were doing. At first, I was distracted by the random inclusion/omission of "The" when I decided to just read it from top to bottom. Then I saw your trick.</p>
      <p>I think a solution would be to have fewer styles. Don't do the italic <em>and</em> the negative indent. Keeping one weight and style throughout will probably do a better job in showing your layout idea as well as keeping it readable.</p>
      <p>Lastly, the proportion of the copy to the page feels a little large and unwieldy.</p>
      <p>Minion's not a bad choice for this, but let see how it evolves after more feedback...</p>
