    <p>Hello all, or at least those who’re interested. </p>
    <p>I’m interested in finding at least a little history on many random fonts i come across, but short of buying many individual books, does someone know of a website that is a database of type history information. </p>
    <p>I know a bit about the more famous and well known types, but for example today i have come across ’Egyptian505SH’ which i know nothing about but wondered if it had a particular historical antecedant (is that the correct use of that word?) other than just being a slab serif?</p>
    <p>Sorry if this seems a little confused and disjunct, but i’m eating thai curry and trying to do work at the same time.</p>
    <p>Thanks in advance for any help.</p>
    <p>G</p>
