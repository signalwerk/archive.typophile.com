      <p>Tiffany knows!</p>
      <p>Text from – <a href="http://www.linotype.com/43348/egyptian505-family.html">http://www.linotype.com/43348/egyptian505-family.html</a><br>
      <em>André Gürtler created the typeface family Egyptian 505 in 1967, together with his lettering class at the Kunstgewerbeschule in Basel. In fact, the number “505” in the typeface family’s name refers to the school’s classroom number 505, where the work was done. </em></p><em>
      <p>Egyptian 505 is a slab serif style family; during the 19th Century, slab serif types were commonly referred to as “Egyptian”-style faces. Gürtler designed Egyptian 505 in the strain of Adrian Frutiger’s famous Egyptienne typeface; Gürtler and Frutiger worked together on many occasions during their careers. </p>
      <p>The type family is well suited for many uses, including magazines, brochures, text composition, business cards, newspaper advertising, book jackets, slides, menus, slides, posters, manuals and catalogues. </p>
      </em><p><em>Egyptian 505 won the first Visual Graphics Corporation (VGC) type competition.</em></p>
