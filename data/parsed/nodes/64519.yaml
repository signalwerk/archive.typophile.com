    html: |-
      <p>I thought this might be a free font called <a class="freelinking external" href="http://www.dafont.com/font.php?file=caviar_dreams&amp;page=1&amp;nb_ppp_old=10&amp;text=SHOES+AND+BOOTS+M+W&amp;nb_ppp=10&amp;psize=m&amp;classt=alpha" rel="nofollow">Caviar Dreams</a>. Some letters are very similar but others are way off, plus your sample is probably thinner than the thin weight.</p>
      <p>It also looks like a simple, geometric alphabet I have in a traditional British signpainting manual from the '80s that was meant to be drawn with large-size compass and set square. I'll find the name of that which might help if you need to draw something like this yourself.</p>
