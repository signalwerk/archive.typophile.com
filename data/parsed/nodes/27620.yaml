    html: |-
      <p>I think partly the problem is that star has a perspective wheras rising doesn’t, the mixture of case is also contributing to the unreadability I can only read S and G comfortably, since you have an uppercase R in star I think you need to develop that for rising. The N reminds me of A from <a href="http://www.myfonts.com/fonts/linotype/stop/">Stop</a>. Overall I think you need to start with a more <a href="http://www.myfonts.com/search?search%5Btext%5D=constructivist">constructivist typeface</a> or draw the characters based on something similar, to two equal rectangles, then create the perspective, if you are using Illustrator or similar it is easy to distort, then mend the damage done by the distort, it should help get the weights of the strokes more realistic.<br>
      Tim</p>
    html_clean: |-
