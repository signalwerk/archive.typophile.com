    <p>Hi there,</p>
    <p>I am designing a title for an awards show and the segment I am doing is “Rising Star”<br>
    I have attatched my design for it,I doubt the word “rising” is even legible,but with my other solutions it seems to drift off from the original star shape.</p>
    <p>just wondering if you guys have any tips,or could recomend a triangular font I can base my letter forms off that would be cool as.</p>
    <p>Thanks Al</p>
