      <p>It’s nice looking and stylish, but quite unreadable in its current state.</p>
      <p>Make no mistake: readability is the first priority for a graphic designer. The very first. Make your logo so “that he may run who is reading it”. If you don’t have readability, you don’t have anything. Make it readable, then make it beautiful.</p>
