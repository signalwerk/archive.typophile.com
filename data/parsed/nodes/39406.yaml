      <p>I’d be happy to comment on the logo, but I think I’m quite removed from your context. I’ll just point out a few things that are not very clear to me looking at your logo.  </p>
      <p>At first look, the language and composition of the logo look rather like a radio station. Is that intentional?  In spite of all that we say about thinking out-of-the-box, in my experience, most categories of business have fairly well defined looks. It could be a little disorientating for your audiences if it is very diferent from the visual language of others in this category.</p>
      <p>I’m not sure what FPS mean (Film Production Services?). Again unless its universally known in your line of work, I’d prefer to have a clearer descriptor. Also what exactly is teh name of your business: is it Production 24, FPS or Production 24 FPS?</p>
      <p>Is Countdown the one on the moon mission? If yes, is that reference relevant to what you want to communicate?</p>
      <p>The metallic effect is quite well-rendered. But if you’re going to do most of your printing on your office printer, then better substitute it with flat tones. Unless again, it has a key resonance that I’m not seeing. </p>
      <p>Will the logo always have the same blue background in exactly the same proportions, or have you also created a straight version (on white background)?  On a letterhead, for instance, the latter may carry greater impact.</p>
      <p>The background colour itself looks a little muddy, at least on my not-so-state-of-art monitor. Try taking a print and check whether you want to tweak the CMYK values to make it a cleaner, crisper blue. I think cutting down on the Yellow would make it better. </p>
      <p>I think that’s enough for now; I hope you’ve learnt your lesson not to ask strangers to nitpick on your work ;)</p>
