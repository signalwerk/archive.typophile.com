      <p>Hi Fellas,</p>
      <p>Indeed that is what “fps” means. It is a cinema term, I understand when you say it could lead to some confusion but in the two years I had my company I think I never met anybody who didn’t have a big question mark above their heads once I introduce myself and my company name. </p>
      <p>The good thing is that it allows me to quickly teach them something, a real ice breaker. The question mark is usually replaced by a smile.</p>
      <p>I do have the logo on a white background, it is this one that I use in my documents. Here it is:</p>
      <p></p><div class="imageWrap"><img src="/files/logo blanc_5441.JPG"></div><p></p>
      <p>Mind you this is not final, obviously some outlines will have to be added as the word “production” doesn’t really stick out.</p>
      <p>As for the muddy effect I don’t think is has anything to do with your monitor, it is probably the low-res jpeg version I use to upload in this post.</p>
      <p>When I say the inspiration was the old countdown I meant this:</p>
      <p></p><div class="imageWrap"><img src="/files/countdown_5343.jpg"></div><p></p>
      <p>I didn’t learn any lesson Arun I think everything you said was pertinent and well-founded. It is not my work but my designer’s. I deal with moving images not stills :)</p>
      <p>Anything you want to add feel free to do so, by the way a link to some of your work would interest me very much.</p>
      <p>Thank you for your time, </p>
      <p>Phil</p>
