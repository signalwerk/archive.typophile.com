      <p>Glad if it is useful to you :)</p>
      <p>By applications I meant things on which the logo would appear - a brochure, a website, a poster etc.</p>
      <p>For business corresondence there’s no reason why Klavika shouldn’t work. </p>
      <p>However, if you need to make a lot of powerpoint or html pages, then there probably is some wisdom in choosing a typeface that comes default with Windows. For instance, Trebuchet. </p>
      <p>This is because such applications typically may have to be viewed in computers other than your’s where something like Klavika may not be installed.</p>
