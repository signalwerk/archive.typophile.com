      <p>It's a good choice. I think it's a horrid identity. Other than the squooshed N and A, I don't understand what the lone rotated M is trying to communicate. I can see their attempt for wildness, but the execution is poor.</p>
      <p>As for the project improvement, it's not executed very well either. The lines are not smooth and appear jagged, especially on the elephant's trunk. You should read up on bezier curves and optimal node placements, to get the understanding of how bezier curves (with Illustrator's pen tool) work. Also, try adding a secondary colour to add some dimensionality.</p>
      <p>What typeface are you going to use for the Animal Planet logotype?</p>
