      <p>Well, for some constructive advice...</p>
      <p>The value of the green and blue is almost identical. When that happens, it becomes difficult to discern the forms. I'd consider trying a much lighter blue.</p>
      <p>Some of the details in the mark seem a bit too subtle and maybe a bit random. The highlight seems to neither indicate the mark is 3-D nor does it seem to refer to anything specific. Perhaps that is superfluous.</p>
      <p>The lower left of the globe outline, where its pinched, seems random as well (maybe it's not, but that's my gut reaction).</p>
      <p>The type is OK, but you really need to keep in mind where this logo will be used most of the time: in the lower right of the TV channel on a TV.</p>
      <p>As such, I find the details of the typeface and the gradient are going to be totally lost in that particular medium.</p>
      <p>Finally, look at the relationship between the size of the letterforms and the mark. Seems that the type could much larger.</p>
      <p>While I think there's definitely a lot that can be improved with the Planet Green logo, I think that's something to look at. Note how it's a very simple form and works quite well on TV.</p>
      <p>I do really like the concept of the 'earth, air, water' thing. I'd maybe think about that conceptually a bit more as well and see if you can build some other illustrations off of that idea. </p>
      <p>HTH!</p>
