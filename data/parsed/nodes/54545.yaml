      <p>Here goes...</p>
      <p>Your lines are too sharp, they don't look like land masses. The birds are obviously copied and flipped, need some variation. The huge open space between the trunk(?) and the seal(?) is too obvious. The gradients are too subtle to make an impact, either tweak them or lose them altogether. The green stroke around the whole planet takes away from that "planet" look and meeting a the 2 points on the left looks weird. The green and blue you've chosen are too similar values, needs more contrast. The text and graphic aren't centered with each other. The font looks like some woodland-fairytale serif. I think the programming on Animal Planet is a lot more varied than that.</p>
