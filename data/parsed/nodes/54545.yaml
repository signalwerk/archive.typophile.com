      <p>It might be a good inspiration to look at some of those old pictorial maps; there are also some modern examples (just don't copy these):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/humorous_diplomatic_atlas_6387.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/animalisland_crab_4778.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/animalisland_fox_6241.jpg"></div><p></p>
      <p>The first image is "A Humorous Diplomatic Atlas of Europe and Asia" (detail) by Kisaburo Ohara, 1904. The two "Imaginary Animal Maps" were designed by Mitsuharu Yamaoka, Japanese Geographical Survey Institute, 1999. </p>
      <p>I recommend Katharine Harmon's beautiful book "You Are Here: Personal Geographies and Other Maps of the Imagination" (from which the above pictures were quickly snapped), as well as the <a href="http://strangemaps.wordpress.com/" rel="nofollow">Strange Maps</a> blog.</p>
