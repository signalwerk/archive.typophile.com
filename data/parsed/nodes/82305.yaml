      <p><em>did you really (I suspect) whip this out in 11 days or less? </em></p>
      <p>You suspect correctly; the task was lightened by the fact that this particular design required only a small number (338) of kerning pairs, even including kerning caps following lowercase letters because of variant letterforms in the lowercase positions.</p>
