    date: 2012-12-18T03:48:00
    date_raw: 18 Dec 2012 — 3:48am
    votes: null
    html: <p>Bear in mind, this isn't the first Windows update to fix security bugs in its font-handling code, apparently it's just the first one to break functionality. And from what I can gather, this latest vulnerability <a class="freelinking external" href="http://technet.microsoft.com/en-us/security/bulletin/ms12-078" rel="nofollow">affects TrueType fonts as well</a>; the update only breaks OTF fonts since they typically use a different system rasterizer and API call. But the overall threat does seem more serious now that every major browser supports webfonts, so simply visiting a website could load a malicious font.</p>
    html_clean: <p>Bear in mind, this isn't the first Windows update to fix security bugs in its font-handling code, apparently it's just the first one to break functionality. And from what I can gather, this latest vulnerability <a class="freelinking external link-external" href="http://technet.microsoft.com/en-us/security/bulletin/ms12-078" rel="nofollow">affects TrueType fonts as well</a>; the update only breaks OTF fonts since they typically use a different system rasterizer and API call. But the overall threat does seem more serious now that every major browser supports webfonts, so simply visiting a website could load a malicious font.</p>
