    date: 2012-12-18T05:48:00
    date_raw: 18 December 2012 - 5:48am
    votes: 0
    html: <p>Bear in mind, this isn't the first Windows update to fix security bugs in its font-handling code, apparently it's just the first one to break functionality. And from what I can gather, this latest vulnerability <a href="http://technet.microsoft.com/en-us/security/bulletin/ms12-078" title="Click to visit an external URL." class="freelink freelink-external freelink-external">affects TrueType fonts as well</a>; the update only breaks OTF fonts since they typically use a different system rasterizer and API call. But the overall threat does seem more serious now that every major browser supports webfonts, so simply visiting a website could load a malicious font.</p>
    html_clean: <p>Bear in mind, this isn't the first Windows update to fix security bugs in its font-handling code, apparently it's just the first one to break functionality. And from what I can gather, this latest vulnerability <a href="http://technet.microsoft.com/en-us/security/bulletin/ms12-078" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">affects TrueType fonts as well</a>; the update only breaks OTF fonts since they typically use a different system rasterizer and API call. But the overall threat does seem more serious now that every major browser supports webfonts, so simply visiting a website could load a malicious font.</p>
