    html: <p>I see it more as which letters need therapy. C drowns in low self-esteem, it's missing its other half, and has always wanted to be an O. And u is just an ungainly thing, half an m but upside down. You'd think there would be some spiritual "cup" metaphor since it looks up to the sky and is theoretically collecting rain, but it can't compete with n, the lower case n, which although being the u upside down still has nice feet, very nice feet, and is connected to the earth.</p>
