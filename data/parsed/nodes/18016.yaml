      <p>Among basic alphabetic characters, none of the Latin letters have been as troublesome for me as the lowercase Greek delta and the lowercase Cyrillic be. But then again, the hardest letters are actually my favorites in some ways. When I get them right after much fiddling with them I feel like I've learned something and am improving my craftsmanship. Not an experience I often have with the letter "O."</p>
      <p>(Some of the extended Latin and extended Cyrillic letters with vertical and horizontal bars across them can be really challenging... particularly in heavier weights, and especially combining that with a low-contrast sans serif design.)</p>
      <p>T</p>
