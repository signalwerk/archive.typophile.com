      <p><cite>These four letters come at the end of the alphabet. They are the most difficult, I think</cite></p>
      <p>Are you kidding? W is just a double V (slightly altered), Y is a spliced V &amp; I, and easy to balance (symmetry), Z comes from E, and is also easy! X is slightly more difficult, a bit of optical correction there, but essentially straight-forward.</p>
      <p>Now, if you had moaned about a bold italic 's' or italic '8' then I'd have to agree…</p>
      <p>—K</p>
