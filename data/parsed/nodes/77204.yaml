    <p>My recent project of helping to start up a non-profit book arts center and community letterpress printshop has evolved a bit into coming up with methods of self sufficiency, One of which is via our Etsy site offering items produced on premises using our collection as raw material. We have had great feedback regarding our printing of specimen sheets from some of our wood type dating back to the mid 1800s</p>
    <p>Pardon the sales pitch, but these DO make great gifts for typophiles!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/il_570xN_4679.186721816.jpg"></div><p></p>
    <p>All proceeds of sales help support the programs of the WNY Book Arts Center. Thank you.<br>
    <a href="http://www.etsy.com/shop/wnybac?section_id=6165159" title="http://www.etsy.com/shop/wnybac?section_id=6165159">http://www.etsy.com/shop/wnybac?section_id=6165159</a></p>
