    html: |-
      <p>Hi, Emel.</p>
      <p>I have found that uppercase stem widths should be a little wider than lowercase. And I think maybe also in the contrast areas. But you will have to judge by eye how much difference in thickness is best.<br>
      I think the difference in your example is too big, but that's just my opinion.</p>
      <p>mksg</p>
