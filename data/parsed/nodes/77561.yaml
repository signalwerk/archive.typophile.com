      <p>I have some critique on the logo if you're still open to it:</p>
      <p>Your x-height seems a bit on the low side.  I realize that it's part of the look you're going for but I'd consider moving your cap-height down a bit so that the ascenders don't break up the flow of the word so much. It would also help with that very large space you have in your C (which feels a bit awkward to me) and the somewhat narrow appearance of your 4. Other than that, the t doesn't typically extend (or at least doesn't have to) to the cap-height, so you might consider bringing that down a bit, which should help with the flow.</p>
      <p>As for the Corporate face, are you looking for something that's going to forward that 60's cocktail vibe, or something a bit more neutral?</p>
      <p>Mad Men is on AMC  by the way</p>
