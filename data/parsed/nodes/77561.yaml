    <p>A friend of mine started a new business called Cocktails 4 U. He gives cocktail workshops and serves as entertainment on company parties and such.</p>
    <p>For creation of the logo I wanted to stay away from the cliché cocktail logo's. Instead I tried to find an appropriate typographical solution. (look attachment) </p>
    <p>This is the look and feel that I was aiming for:</p>
    <p>- 60ties cocktail vibe<br>
    - classy but not too chic<br>
    - red, black and white<br>
    (think NBC's show Mad Men)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_cocktails4u_zwart_4340.jpg"></div><p></p>
    <p>Now with the logo more or less done I am looking for a sans serif corporate typeface.</p>
    <p>Gill Sans Light (Condensed)<br>
    Frutiger Light (Condensed)<br>
    .....<br>
    ...</p>
    <p>More/better suggestions?</p>
    <p>Feedback on the logo is also very welcome. ;-)</p>
