      <p>Hello there!</p>
      <p>I have the same feeling as Kazyole concerning the "C". It somehow appears to be to slim compared to the rest. At the same time the 4 could have a bigger "body" by lowering the horizontal line even further to get this kind of vintage look.</p>
      <p>Maybe Neutraface would also be a possible choice for the corporate font, not just because the name's more «neutral». ;)</p>
