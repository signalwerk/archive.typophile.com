      <p>Nice work. I especially like your 's' and 'a'. I think the 'f' is much better in the latest version.<br>
      Word does not use any kerning-data at all unless you tell it to, however your interpunction needs to be kerned as well, like the 'y' followed by a comma.<br>
      It looks to me that the 'e' is a bit thin on the top, but I'm not experienced enough to tell if that is really a problem. And it looks like the spaces are somewhat large? Especially noticable after a comma.</p>
      <p>Maybe you can use something like InDesign to make a specimen the next time, so it is kerned?</p>
      <p>Keep it up.</p>
