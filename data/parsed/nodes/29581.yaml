      <p>This is just a very quick response but from the graphic sample my eye immediately got stuck on the bottom half of the "e"; it feels, forgive me, "lumpy." And the terminal on the "f" seems a bit harsh. Dots over "i" and "j" look dark. And the arm/leg of the "k" are out of whack (the leg looks stunted). Also, the second section of "m" looks noticably narrower than the first section; that is, it looks like an "n" with a narrower "n" tacked on, rather than one unified and balanced glyph.</p>
      <p>On another note, and this isn't necessarily a negative, I get the strangest sensation that the feet of "h", "m", etc., are actually <em>moving</em>. I know, this is crazy, but I swear I can see them stepping to the right. It's only those with multiple serifed feet, but they're moving, I swear...</p>
