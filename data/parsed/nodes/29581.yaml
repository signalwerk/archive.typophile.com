    html: |-
      <p>I'm still seeing an imbalance in the "m" in the PDF; I believe you that the two sections are the same width, and that's the problem: they're metrically balanced, but not optically. The top serif on the left leg gives that side of the glyph more weight, thus it appears more substantial, therefore the right side appears less substantial. To compensate the right leg needs to be moved slighly further right. This will create a metric imbalance, but the glyph will look optically "correct."</p>
      <p>As for that "f", you're right, it's not just the hard stroke of the terminal, but the arm itself is hanging out too far. I'm not sure if this will help, but I like the strength of the tail on the "j"; can you lend the "f" some of the control found in the "j"?</p>
      <p>Part of the reason the "e" feels chunky at the bottom is that the crossbar might be a tiny bit too light. Maybe try adding a tiny bit of weight to that bar.</p>
      <p>The bottom of the "c" is suffering from the same chunkiness that the "e" has.</p>
      <p>Good, strong commas. I like that.</p>
      <p>Like mondo I love the "x", but I'm tripping up on it in the PDF. It's a bit of an attention hog.</p>
      <p>Perhaps the "t" could be slightly taller?</p>
      <p>I'm assuming you haven't kerned the font yet, but in case you have here's a quick gathering of pairs that look awkward:</p>
      <p>an at ay<br>
      ch<br>
      ly<br>
      me mu my<br>
      nt nu<br>
      pi pt<br>
      tl<br>
      ub<br>
      vi<br>
      ye</p>
      <p>"fi" &amp; "ff" ligs?</p>
      <p>Overall I like the face a lot. I use Fedra a fair bit, and you have a nice blending of that and Dolly with maybe some Warnock thrown in. There's still work to be done, but you're building something quite nice.</p>
    html_clean: |-
