      <p>i may be a lil' late on commenting. but look at the spacing between the r and a and the spacing between the b and i. they aren't equal. just compare the spacing in between and make sure that it looks natural. so that it reads easier and doesn't look broken up or awkward. the type is to work as a family, tight family. </p>
