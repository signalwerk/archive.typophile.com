      <p>Tylor: basically the goal of kerning is just getting an even optical distance between letterforms. There is no mathematical way of doing it, it must be optical. Basically its a process of printing it out and tweaking it. So your opinion is just as good as anyone's. The most important thing to kern appropriately to the shape of the letter hence HH &lt; needs mores space than &gt; OO .</p>
      <p>To me the R and the A seem tight. The G seems abit loose.</p>
