    html: <p>I hunted through the Jaspert "Encyclopaedia" and about the only typeface that made me look twice at it was <a href="http://www.myfonts.com/fonts/linotype/albertus/" target="_blank">Albertus</a>, and it's not too close. I guess if I had to try to re-create this, that might be where I would start. The high-centered M with straight sides is not very common at all in serif fonts.</p>
