    <p>Audi recently introduced its new <a href="http://fontfeed.com/archives/typographic-relaunch-for-audi/">Audi Type</a>, as did Toyota their Dalton-Maag designed <a href="http://www.daltonmaag.com/news/106.html">custom typeface</a> in January. I know <a href="http://www.daltonmaag.com/about/commissioning/case_studies/bmw.html">BMW</a>, <a href="http://www.daltonmaag.com/about/commissioning/case_studies/skoda.html">Skoda</a> and <a href="http://www.daltonmaag.com/browse/custom/clients/mini">Mini</a> also use exclusive Dalton-Maag designs, Opel’s was drawn by <a href="http://www.monotype.co.uk/DynamicPage/View.cfm?pagename=opel1">Robin Nicholas</a> for Monotype Custom Fonts Solutions, Volvo has <a href="http://typophile.com/node/3875">Volvo Broad</a>, Jaguar has its eponymous corporate faces by <a href="http://www.clubtype.co.uk/fonts/sas/aboutawd_2.html">Adrian Williams</a>, Volkswagen uses a <a href="http://spiekermann.com/en/futura-the-perfect-geometric-typeface/">custom version of Futura</a> art directed by Spiekermann and designed by Luc(as de Groot for MetaDesign, and Mitsubishi Motors Europe acquired exclusive license for <a href="http://lineto.com/">Alpha Headline</a> fonts until the end of 2012.</p>
    <p>Does anyone know of fairly recent examples of custom typefaces used by car companies? Citroën’s looks custom to me, but I haven't found any information on that one yet.</p>
    <p>Conversely does anyone know of car brands that use commercially available typefaces to great effect? I saw a car brand consistently use Klavika not so long ago but can't seem to remember which one it was. And I thought Ford used Trade Gothic Extended, but either I'm wrong or they switched to Helvetica Extended.</p>
  html_clean: |-
    <p>Audi recently introduced its new <a href="http://fontfeed.com/archives/typographic-relaunch-for-audi/" class="link-external">Audi Type</a>, as did Toyota their Dalton-Maag designed <a href="http://www.daltonmaag.com/news/106.html" class="link-external">custom typeface</a> in January. I know <a href="http://www.daltonmaag.com/about/commissioning/case_studies/bmw.html" class="link-external">BMW</a>, <a href="http://www.daltonmaag.com/about/commissioning/case_studies/skoda.html" class="link-external">Skoda</a> and <a href="http://www.daltonmaag.com/browse/custom/clients/mini" class="link-external">Mini</a> also use exclusive Dalton-Maag designs, Opel’s was drawn by <a href="http://www.monotype.co.uk/DynamicPage/View.cfm?pagename=opel1" class="link-external">Robin Nicholas</a> for Monotype Custom Fonts Solutions, Volvo has <a href="/node/3875/" class="link-kept">Volvo Broad</a>, Jaguar has its eponymous corporate faces by <a href="http://www.clubtype.co.uk/fonts/sas/aboutawd_2.html" class="link-external">Adrian Williams</a>, Volkswagen uses a <a href="http://spiekermann.com/en/futura-the-perfect-geometric-typeface/" class="link-external">custom version of Futura</a> art directed by Spiekermann and designed by Luc(as de Groot for MetaDesign, and Mitsubishi Motors Europe acquired exclusive license for <a href="http://lineto.com/" class="link-external">Alpha Headline</a> fonts until the end of 2012.</p>
    <p>Does anyone know of fairly recent examples of custom typefaces used by car companies? Citroën’s looks custom to me, but I haven't found any information on that one yet.</p>
    <p>Conversely does anyone know of car brands that use commercially available typefaces to great effect? I saw a car brand consistently use Klavika not so long ago but can't seem to remember which one it was. And I thought Ford used Trade Gothic Extended, but either I'm wrong or they switched to Helvetica Extended.</p>
