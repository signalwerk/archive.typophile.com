    html: <p>The Daimler-Benz corporate typeface is called Corporate A·S·E. It was designed by Kurt Weidemann in close collaboration with URW. A stands for Antiqua (roman serif), S for Serifenlos (sans serif) and E stands for Egyptienne (slab serif). The slab serif is rarely (if at all) used. Corporate A·S·E started as an exclusive corporate typeface, but a part of the deal with URW was that this restriction would only last several years. That’s why it is generally available for licensing.</p>
