    <p>Okay, you’re at your computer working on Glyphs or Designing something and you’ve just had your 12th cup of coffee and nothing is going right. Stop. Push yourself away from the computer get your field glasses and head to Central Park. Go to the Ramble and look for the Fall Warbler Migration. From about the beginning of August to mid October the Warblers will be coming through Manhattan with the peak in mid to late September.</p>
