    html: |-
      <p>I should note that I’m asking about Chrome on Mac (Snow Leopard 10.6.8), according to <a href="http://www.w3.org/TR/css3-fonts/" title="http://www.w3.org/TR/css3-fonts/">http://www.w3.org/TR/css3-fonts/</a> it states that:</p>
      <blockquote><p>Rendering complex scripts that use contextual shaping such as Thai, Arabic and Devanagari requires features present only in OpenType or AAT fonts. Currently, complex script rendering is supported on Windows and Linux using OpenType font features while AAT font features are used under Mac OS X. Apple has indicated it intends to support complex script rendering using OpenType font features in the future.</p></blockquote>
      <p>It seems that to get the functionality I want, I might need to actually upgrade to Lion or Mountain Lion. :^(</p>
