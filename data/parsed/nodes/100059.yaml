  html: |-
    <p>Hi. So I'm trying to change the default Devanagari font in chrome by specifying Adobe Devanagari as the default font in chrome. So my CSS code I have is:</p>
    <p><code>@font-face {<br>
      font-family: sans-serif;<br>
      src: local("AdobeDevanagari-Regular");<br>
      unicode-range: U+900-97F;<br>
    }</code></p>
    <p>Now this will work to swap out the family, but then the OpenType features do not work. Is there anyway to get Chrome to apply the Indic OT features from the font?</p>
  html_clean: |-
    <p>Hi. So I'm trying to change the default Devanagari font in chrome by specifying Adobe Devanagari as the default font in chrome. So my CSS code I have is:</p>
    <p><code>@font-face {<br>
      font-family: sans-serif;<br>
      src: local("AdobeDevanagari-Regular");<br>
      unicode-range: U+900-97F;<br>
    }</code></p>
    <p>Now this will work to swap out the family, but then the OpenType features do not work. Is there anyway to get Chrome to apply the Indic OT features from the font?</p>
