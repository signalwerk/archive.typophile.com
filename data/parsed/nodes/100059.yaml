      <p>I just tested this; it seems to work in Mountain Lion.<br>
      I am using Chromium 24.0.1312.57 (178923) on OS 10.8.2, and managed to substitute the default Devanagari font with Adobe Devanagari. OT features work.<br>
      Paul is happy.</p>
