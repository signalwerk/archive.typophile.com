  html: |-
    <p>Hi,</p>
    <p>We are creating a free, font-based creative app for the iPhone / iPad where we let people create images with fonts, then share them with friends and re-edit others' pictures.</p>
    <p>I was wondering if you guys would be interested in checking out our app as we are just about to start our beta testing phase. We would like to hear what you miss from the app, what you like and dislike about it. We would like to make it an easy to use and fun tool to express yourselves.</p>
    <p>If you are interested, you can simply visit <a href="http://www.fontify.it" title="http://www.fontify.it">http://www.fontify.it</a> and fill the sign-up form, we will contact you as soon as the beta starts (within a few days).</p>
    <p>Thanks!</p>
    <p>Cheers,</p>
    <p>Gabor Furedi</p>
