  html: <p>Hola amigos typophiles, <br><br>this is my ﬁrst non latin greyscale pixel font. The challenge was to develope a Yummy bold caps font for titling, who can work well for Japanese language readers. <br><br>If anyone can read or recognize if this ﬁrst designs sketches works, maybe someone who know about Katakana or Hiragana, can make some critiques here..every help is welcome! <br><br>Muchas gracias, <br><br>mh <br><img src="http://www.typophile.com/forums/messages/29/28090.gif" alt=""></p>
