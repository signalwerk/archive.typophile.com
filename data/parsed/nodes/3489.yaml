    html: <p>&gt;In my understanding, and to use your own terms, it’s ‘socially unacceptable’ to publish something all-Kana. But not only because of ‘social’ issues…  <br><br>&gt;It’s complicated. There are words, for example, that have proper Kanji spellings, but that most people spell/write using only Hiragana (‘arigatou’ is a common example, and Katakana is mostly used for foreign words).  <br><br>I think so too. <br>In the case of a packaging design, Sometime, a brand name and company name may be displayed in kana. A font of only kana is popular. <br><br>There are some fonts of only kana. <br>for example… <br>GrayGraphics(FreeFont 1byte) <br><a href="http://www.orange.ne.jp/~den7/index.html" target="_blank">http://www.orange.ne.jp/~den7/index.html</a> <br><br>Almost all the fonts in this site consist of only kana. <br>It is used as a display font. I use often. <br><br>While, There is also a kana font which replaces full set Japanesefont’s kana. <br>For example, Adobe’s Ryo is. <br><br>Adobe Ryo (<span class="caps">PDF</span>) <br><a href="http://www.adobe.co.jp/products/fontfolio/pdfs/ryo.pdf" target="_blank">http://www.adobe.co.jp/products/fontfolio/pdfs/ryo.pdf</a> <br>This textsetting replaced Kozuka Mincho’s kana with Ryo. <br><br>&gt;One more thing.. any kerning text or  <br>&gt;Pangram to start to write in japanese?  <br><br>Kana may adjoin all characters. So, a huge quantity of a kerning pair is needed. It is inﬁnitely. <br>It is better to have been able to set without depending on kerning as much as possible. Therefore, in this case, it is better to equalize character width of this font. <br></p>
