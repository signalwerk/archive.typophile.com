    html: "<p>It's nice, Miguel, but there's too much 'stylistic' divergence between the Latin font and the Japanese fonts. The Latin font is squarish, geometric, clean, 'cool'. The Japanese fonts, as Kunihiko said, look handwritten, maybe a bit 'childish' too. <br> <br>I'd try to make the Japanese fonts more squarish and geometric like the Latin, but that's a personal preference. They're still nice fonts in itself. <br> <br>* * * * * <br> <br>I mostly agree with Okano's post, of course. <br>And I'd like to add that: <br>- 'N' (h) is too short, make it taller; <br>- 'KA' (k) is not just the 'KA' (h) without the little stroke, the hiragana should be rounder/softer ; <br>- the descending strokes of 'KO', 'RO' and 'YO' (k) are too long; <br>- 'A', 'WA' (h), and 'TA' (k) are too big; <br>- 'YA' (both h and k) is too small; <br>- 'RU' and 'RO' (k) are too exaggerated. <br>(h=hiragana, k=katakana)</p>"
