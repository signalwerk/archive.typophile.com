    html: <p>&gt; 1) Where did you get the template - is it complete? <br> <br>Well, you can get this kind of template in any Japanese 'learning' book. I think this template is complete, yes. <br> <br> <br>&gt; 2) Is Kanji really not needed? <br> <br>What do you mean? <br>I guess this face is intended for some sort of 'small-size-display' (like interface buttons or something), and in this case you can choose to work only with Kana. I'd say that when you have single words or pairs of words, you can use only Kana. But when you have a whole paragraph or sentence, you should use Kanji too. <br>Both Kana alphabets are phonetic, so you can write anything (that you'd write with Kanji) with them.</p>
