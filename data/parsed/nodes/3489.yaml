    html: <p>Hi, Miguel. <br> <br>I'm Japanese. It is a very pretty nice font. Is the resource of this font the sketch of the handwriting style? <br>The font of the handwriting style is in fashion in Japan. <br> <br>Well, There are some wrong points. <br> <br>"SU", "SE", "SO". The right-hand side upper part point (Its name is "DAKU-TEN")  is unnecessary. <br>Not "ZU", "ZE", "ZO". <br> <br>"HO", The top of right-hand side does not cross. It is not "MA." <br> <br>And as my opinion, <br> <br>I cannot distinguish "SO" from "N". <br>Note that angle of stroke. Right-hand stroke of "SO" moves top to bottom, the other, stroke of "N" moves bottom to top. <br>Although, Japanese people sometimes mistake. <br> <br>Distinction of "SHI" and "TSU" is good! <br>Japanese people sometimes mistake too. <br> <br>"NU" and "ME" are too wide. <br> <br>"GA", Upper double point "DAKU-TEN" should be most in right-hand side. <br> <br>from KYA,KYU,KYO to HYA,HYU,HYO <br>Right-hand side character is too large. <br> <br> <br>I am looking forward to completion of this font. <br> <br></p>
    html_clean: <p>Hi, Miguel. <br> <br>I'm Japanese. It is a very pretty nice font. Is the resource of this font the sketch of the handwriting style? <br>The font of the handwriting style is in fashion in Japan. <br> <br>Well, There are some wrong points. <br> <br>"SU", "SE", "SO". The right-hand side upper part point (Its name is "DAKU-TEN")  is unnecessary. <br>Not "ZU", "ZE", "ZO". <br> <br>"HO", The top of right-hand side does not cross. It is not "MA." <br> <br>And as my opinion, <br> <br>I cannot distinguish "SO" from "N". <br>Note that angle of stroke. Right-hand stroke of "SO" moves top to bottom, the other, stroke of "N" moves bottom to top. <br>Although, Japanese people sometimes mistake. <br> <br>Distinction of "SHI" and "TSU" is good! <br>Japanese people sometimes mistake too. <br> <br>"NU" and "ME" are too wide. <br> <br>"GA", Upper double point "DAKU-TEN" should be most in right-hand side. <br> <br>from KYA,KYU,KYO to HYA,HYU,HYO <br>Right-hand side character is too large. <br> <br> <br>I am looking forward to completion of this font. <br> <br></p>
