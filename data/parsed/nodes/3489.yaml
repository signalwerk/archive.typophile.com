    html: <p>I’m not sure about it, really. Kunihiko certainly knows better. <br>In my understanding, and to use your own terms, it’s ‘socially unacceptable’ to publish something all-Kana. But not only because of ‘social’ issues… <br><br>It’s complicated. There are words, for example, that have proper Kanji spellings, but that most people spell/write using only Hiragana (‘arigatou’ is a common example, and Katakana is mostly used for foreign&nbsp;words). </p>
