    html: <p>Hi, Miguel. <br><br>I’m Japanese. It is a very pretty nice font. Is the resource of this font the sketch of the handwriting style? <br>The font of the handwriting style is in fashion in Japan. <br><br>Well, There are some wrong points. <br><br>“<span class="caps">SU</span>”, “<span class="caps">SE</span>”, “<span class="caps">SO</span>”. The right-hand side upper part point (Its name is “<span class="caps">DAKU</span>-<span class="caps">TEN</span>”)  is unnecessary. <br>Not “<span class="caps">ZU</span>”, “<span class="caps">ZE</span>”, “<span class="caps">ZO</span>”. <br><br>“<span class="caps">HO</span>”, The top of right-hand side does not cross. It is not “<span class="caps">MA</span>.” <br><br>And as my opinion, <br><br>I cannot distinguish “<span class="caps">SO</span>” from “N”. <br>Note that angle of stroke. Right-hand stroke of “<span class="caps">SO</span>” moves top to bottom, the other, stroke of “N” moves bottom to top. <br>Although, Japanese people sometimes mistake. <br><br>Distinction of “<span class="caps">SHI</span>” and “<span class="caps">TSU</span>” is good! <br>Japanese people sometimes mistake too. <br><br>“<span class="caps">NU</span>” and “<span class="caps">ME</span>” are too wide. <br><br>“<span class="caps">GA</span>”, Upper double point “<span class="caps">DAKU</span>-<span class="caps">TEN</span>” should be most in right-hand side. <br><br>from <span class="caps">KYA</span>,<span class="caps">KYU</span>,<span class="caps">KYO</span> to <span class="caps">HYA</span>,<span class="caps">HYU</span>,<span class="caps">HYO</span> <br>Right-hand side character is too large. <br><br><br>I am looking forward to completion of this font. <br><br></p>
