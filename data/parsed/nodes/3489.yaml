    html: '<p>It’s nice, Miguel, but there’s too much ‘stylistic’ divergence between the Latin font and the Japanese fonts. The Latin font is squarish, geometric, clean, ‘cool’. The Japanese fonts, as Kunihiko said, look handwritten, maybe a bit ‘childish’ too. <br><br>I’d try to make the Japanese fonts more squarish and geometric like the Latin, but that’s a personal preference. They’re still nice fonts in itself. <br><br>* * * * * <br><br>I mostly agree with Okano’s post, of course. <br>And I’d like to add that: <br>- ‘N’ (h) is too short, make it taller; <br>- ‘<span class="caps">KA</span>’ (k) is not just the ‘<span class="caps">KA</span>’ (h) without the little stroke, the hiragana should be rounder/softer&nbsp;; <br>- the descending strokes of ‘<span class="caps">KO</span>’, ‘<span class="caps">RO</span>’ and ‘<span class="caps">YO</span>’ (k) are too long; <br>- ‘A’, ‘<span class="caps">WA</span>’ (h), and ‘<span class="caps">TA</span>’ (k) are too big; <br>- ‘<span class="caps">YA</span>’ (both h and k) is too small; <br>- ‘<span class="caps">RU</span>’ and ‘<span class="caps">RO</span>’ (k) are too exaggerated. <br>(h=hiragana,&nbsp;k=katakana)</p>'
    html_clean: '<p>It’s nice, Miguel, but there’s too much ‘stylistic’ divergence between the Latin font and the Japanese fonts. The Latin font is squarish, geometric, clean, ‘cool’. The Japanese fonts, as Kunihiko said, look handwritten, maybe a bit ‘childish’ too. <br><br>I’d try to make the Japanese fonts more squarish and geometric like the Latin, but that’s a personal preference. They’re still nice fonts in itself. <br><br>* * * * * <br><br>I mostly agree with Okano’s post, of course. <br>And I’d like to add that: <br>- ‘N’ (h) is too short, make it taller; <br>- ‘<span class="caps">KA</span>’ (k) is not just the ‘<span class="caps">KA</span>’ (h) without the little stroke, the hiragana should be rounder/softer&nbsp;; <br>- the descending strokes of ‘<span class="caps">KO</span>’, ‘<span class="caps">RO</span>’ and ‘<span class="caps">YO</span>’ (k) are too long; <br>- ‘A’, ‘<span class="caps">WA</span>’ (h), and ‘<span class="caps">TA</span>’ (k) are too big; <br>- ‘<span class="caps">YA</span>’ (both h and k) is too small; <br>- ‘<span class="caps">RU</span>’ and ‘<span class="caps">RO</span>’ (k) are too exaggerated. <br>(h=hiragana,&nbsp;k=katakana)</p>'
