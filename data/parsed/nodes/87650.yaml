    <p>I'm trying to identify two typefaces for a project. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/corporate_6197.jpg"></div><p></p>
    <p>This one might be a corporate font. I don't know which one exactly. It is being used by Telefónica for their advertising communication.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sumate-al-cambio2_4976.jpg"></div><p></p>
    <p>This other seems to be Frutiger. If so, I'm not sure which cut of Frutiger it is.</p>
    <p>I would be very happy if you have any suggestion of similar fonts that might work as well on screen as these two. Thanks everyone.</p>
