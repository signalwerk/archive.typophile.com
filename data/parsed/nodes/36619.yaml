    html: <p>I've had to troubleshoot a lot of font related computer problems, and I can say that platform level bugs are the worst. This is because one by necessity must assume that the probability of their existence is small or everyone would know about it. In the case of the premier foundries, the actual specifications and feature support are being tested at the OS level. I sometimes define whether a font is "good" or "functional" based on whether it works in basic applications like Notepad.exe or TextEdit.app. So, it's not insane to be skeptical about OS bug complaints. It's also possible that the "bug" lies in some nebulous region that is better described as "compatibility". If only a couple fonts fail, the platform vendor could simply describe the problem as a lack of support for a particular feature. BTW, P22 London Underground, Arno Pro, and Mac OS are all things I would like to use if possible.</p>
