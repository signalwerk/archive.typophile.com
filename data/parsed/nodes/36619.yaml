      <p><em>I vote for they just want three times the money...I do call BS it being an OS limitation.</em></p>
      <p>No, actually it is three times the work to separate them out since all of the fonts are available as sub-families. The end price of the full font system is the same as originally planned. If someone wants just one script, they will actually be paying LESS. Because of stylistic variants increasing the glyph count to over 5000, there are problems with earlier OS behavior. This is not a marketing scheme or gimmick. Unless we demand all of customers have the latest OS, there are some issues. It has nothing to do with application support of OT features. The fairest workaround for the widest customer usage ended up being splitting each script up. If anyone has made 5000+ glyph fonts and has a better solution, please let us know. And if there are further question, please do email us directly.</p>
      <p>The P22 blog post was an honest explanation without going into excruciatingly boring detail.</p>
      <p>Thank you Miguel for not sugar coating it :)</p>
