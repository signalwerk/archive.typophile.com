    html: |-
      <p>Miguel is correct that CID-keyed fonts avoid the problem. Specifically, because they have no glyph names (they are "CID-keyed" rather than "name-keyed").</p>
      <p>In our fonts, we ran into the problem for the first time right around 3000 glyphs. It would be an odd font with 2000 or fewer glyphs that would trigger the problem.</p>
      <p>Interestingly, it turned out we'd come *really* close several times before, and just hadn't quite gone over the OS X string limit prior to Arno. It was really hard to debug, too, because there was nothing wrong with the font and the trigger was not at all obvious. We did eventually figure out it was at the OS level and Apple helped sort out the exact issue.</p>
      <p>Cheers,</p>
      <p>T</p>
