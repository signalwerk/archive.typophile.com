      <p>Given the nature of that font, I can't imagine that there's anything OpenType-related difference in operating systems that could cause a problem.  Especially since it would really be the font renderer, not the OS, that would have problems with OpenType-ness, right?  Unless maybe there's something odd about the font file that causes the default font managers to have some trouble, but that sounds a bit fishy.</p>
      <p>I vote for they just want three times the money.  It makes sense though, as they say it's their largest font by glyph count, and the average Western European will just be using the Latin script.  While he might only use that, he'd still be getting three times more than he'll use, and so if they didn't split the font into three version, they'd rightfully charge two or three times more for their font.  So, perhaps it's being nice to those users who only need one of the three.  </p>
      <p>That's just a guess though.  I do call BS it being an OS limitation.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
