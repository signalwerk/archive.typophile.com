    html: |-
      <p>If I recall correctly, this bug only affects name-keyed OpenType CFF fonts in Mac OSX 10.4.8 and earlier. (CID-keyed OT CFF fonts go through a different "pipeline", I think)</p>
      <p>Both MakeOTF and CompareFamily — available in the <a href="/wiki/AFDKO" class="freelinking" rel="nofollow">AFDKO</a> — have a test to assess the fonts and will output an error/warning.</p>
      <p>To calculate it "by hand", do the following:</p>
      <p>1. Open <em>Terminal</em> (Mac) or <em>Command Prompt</em> (Windows), and type<br>
      <code>tx -dcf –1 My_Font.otf  &gt; output.txt</code><br>
      <strong>tx</strong> is also available in the AFDKO. The kit contains the document <strong>CommandLineHowTo.pdf</strong> as well.</p>
      <p>2. Open "output.txt" in a text editor and search for "### String INDEX". You should find something like this<br>
      <code>### String INDEX (000012b3-000074f2)<br>
      count  =2823</code></p>
      <p>3. Startup Python and type (Use your own values; I'm using the values above)<br>
      <code>2*2823 + (0x74f2 - 0x12b3)</code></p>
      <p>4. A number will be output — in the case above is 30797. If this number is equal or greater than 32768 (32K), then the font will trigger the bug.</p>
      <p>In sum, the problem happens if<br>
      <code>(2*count + String Index table size)  &gt;= 32768</code><br>
      One way of reducing the number is by shortening the glyph names*. Other strings such as the font's Full Name and the Copyright may also contribute to the size of this number.</p>
      <p>*Keep in mind that glyph naming rules still apply. In Arno Pro, we managed to get away from the problem by using <strong>uniXXXX</strong> names for most base glyphs, and <strong>uXXXX.x</strong> for most alternate glyphs.</p>
