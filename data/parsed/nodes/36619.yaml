      <p>I'd say it's probably a mental slip, and they meant "application limitations".<br>
      For instance, Quark 6.5 or earlier.<br>
      That app no longer works on OS X since Mac switched to Intel and there's no "Classic mode".<br>
      And in Quark 6.5, although OpenType fonts do work, there is no feature support, which is what the "Pro" designation is all about.<br>
      So in a sense it's an OS limitation, in that OS X doesn't support older Quark.</p>
