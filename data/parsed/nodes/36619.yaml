      <p><em>Would a 1500-glyph font encounter problems?</em></p>
      <p>it all has to do with a portion of the font file that lists all the glyph names, if this list is over a certain size, Mac OS will encounter problems including crashing of the system. The only way to test to see if you're in the safe range (that i know of) is to build (or test building) your font with the AFDKO tools.<br>
      Unless you're using really wacky long names, i think 1500 <em>should</em> be safe.</p>
