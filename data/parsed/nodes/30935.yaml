    <p>Hi everybody,</p>
    <p>I just need some help in a website design. In the site we have a lot of text, because the site publishes tales, so I’d like some help and advice in my choices.</p>
    <p>A text example is here: <a href="http://vitoregia.googlepages.com/cap2.html" title="http://vitoregia.googlepages.com/cap2.html">http://vitoregia.googlepages.com/cap2.html</a> (it’s all in Portuguese, but I think it won’t be a problem).</p>
    <p>In the site, i used Trebuchet MS, a line-height (or leading) of 1.7 em, a less than 50% of width column for the principal text and a dark gray color for the text (#696969).</p>
    <p>Tahnk for the attention, folks!</p>
