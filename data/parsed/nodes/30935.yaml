    html: <p>Trebuchet isn’t the most readable web font — its quirks are distracting at screen resolution. The best 5 are Lucida Grande (Lucida Sans Unicode on Windows), Georgia, Verdana, Arial, Helvetica. Give them all a try in Maratz’s <a href="http://typetester.maratz.com/">Typetester</a>.</p>
