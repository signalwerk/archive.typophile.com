      <p>good to have you back, hrant! and thanks for the encouraging words. i've had to rethink my strategy (a glyph a day) but it was fun to think i could do it for a while. anyhow i've roughed out the basic gist of the lc, and taken this in a different direction than i chose for my first w. i wanted the characters to be a little more "inkey" and "gooey" but i still want it to be pretty clean. the character with the best "polish" in the following example would definately be the a (the short one) i've worked a bit on the n and the u by straightening out the verticals, but they need a lot more attention. anyhow, i guess right now i wanna find out if i'm going in the right direction. whaddya think? hope to hear from somebody... anybody... <br></p>
