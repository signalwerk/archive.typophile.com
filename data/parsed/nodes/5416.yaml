    html: <p>I was in Vienna last week, and while I was walking around somewhere, I saw this old Pokemon thing that said "Pikachu, I choose you!" I just broke out laughing, because I thought "Oh man, Pikachu is so yesterday!"* <br> <br>Then I immediately thought, I need to change my typophile icon to Pikachu. Can't explain why, but I couldn't get the idea out of my head for the rest of the vacation. <br> <br>Rest assured, I will change it in the not too distant future. <br> <br>How is Adam coming along? <br> <br> * Being so yesterday made this a perfect match for Viennna. I've never been in a city that was so about yesterday in my whole life. I don't think that Vienna could fake contemporary to save its life. This was sadly the most boring vacation destination I ever chose <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"></p>
