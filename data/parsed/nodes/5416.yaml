      <p>Hrant, I assume that <a href="/wiki/Kaas" class="freelinking" rel="nofollow">Kaas</a> is being primarially marketed to Latin users and as a Latin typeface. Inasmuch, it isn't a "Hebrew" typeface, per se. Although I'm sure that you can set excellent Hebrew display strings with it (disclaimer, I cannot weigh in pro or against the design of these Hebrew glyphs. I know too little about the writing system :-(  ).</p>
      <p>It is just like I wouldn't call <a href="/wiki/Helvetica%20Linotype" class="freelinking" rel="nofollow">Helvetica Linotype</a> a Hebrew typeface, even though John Hudson included Hebrew into its character set. Helvetica Linotype is a Latin face that can also set Greek, Cyrillic, Hebrew, and Arabic. Or maybe it is a global face that can set Latin (even Vietnamese!), Greek, Cyrillic, Hebrew, and Arabic. But the main focus &amp; audience of the font isn't Hebrew (disclaimer, I cannot weigh in pro or against the design of these Hebrew glyphs. I know too little about the writing system :-(  ).</p>
      <p>Yes, I must have posted somewhere that I find the idea of Hebrew blackletter distasteful. I love Blackletter, and I love Hebrew, but I wouldn't ever mix the two, personally. Maybe there is someone who can pull that off—maybe Kaas does it—but the "idea" just doesn't sit well with me. I'd rather not go there.</p>
