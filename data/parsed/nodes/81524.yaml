  html: '<p>Veronika Burian and Jose Scaglioné are teaching a 4-day workshop on type design and FontLab here in Portland in mid-July. Sign up this month to ensure it actually takes place! Details here: <a href="http://www.thomasphinney.com/2011/04/type-design-fontlab/" title="http://www.thomasphinney.com/2011/04/type-design-fontlab/">http://www.thomasphinney.com/2011/04/type-design-fontlab/</a></p>'
