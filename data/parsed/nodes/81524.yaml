      <p>We are grateful to The PNCA (Pacific Northwest College of Art) and Portland Type Company for the invitation. Some basic info:</p>
      <p>The workshop is split in two parts; the first providing basic methodology and theoretical knowledge about typeface design techniques and best practices, and the second focusing more on advanced techniques for typeface design and post-production of font families. </p>
      <p>More information here:<br>
      <a href="http://secure.pnca.edu/ce/reg/detail.php?c_id=SUCED0425-1&amp;sem_year=Summer2011&amp;program=1" title="http://secure.pnca.edu/ce/reg/detail.php?c_id=SUCED0425-1&amp;sem_year=Summer2011&amp;program=1">http://secure.pnca.edu/ce/reg/detail.php?c_id=SUCED0425-1&amp;sem_year=Summe...</a></p>
