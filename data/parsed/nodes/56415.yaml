    date: 2009-03-30T22:18:00
    date_raw: 30 Mar 2009 — 10:18pm
    votes: null
    html: |-
      <p>How much one kerns varies a good deal by what kind of work one does and what fonts one does it with. I tend to stick with fonts by foundries that are known for getting the spacing right for the intended use to begin with and I don’t believe that logos should be kerned/tracked in just for the hell of it, so I really only need to kern big headlines. I suspect that if I did book covers or advertising kerning would eat up much more time.</p>
      <p>In the fonts I’m developing I try to avoid too many kerning pairs. It would be nice if I could find a database of pairs and what language they appear in so that I can feel comfortable ignoring pairs that are really only needed for phonetic transliteration of Chinese and other things that nobody would do with my fonts.</p>
