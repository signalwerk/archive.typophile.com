    html: |-
      <p>When I did page layout and magazine work, I made Illustrator files saves as outlines of mastheads/banners etc. I tweaked them to fit eachother by kerning and outline adjustment. For typical text that does not repeat, I rarely kerned anything at text sizes but almost always kerned larger headlines. If I was lucky enough to be using a well fitted font, this was easy. Some clients had to use some fonts that were not well crafted and they took more work. The truth is, the deadline wasthe master, if I didn't have time, I overlookd the less objectionable stuff. Granted, this was a few years back when the only thing available were type 1 fonts. Type quality is better now, at least by all the good designers.</p>
      <p>ChrisL</p>
