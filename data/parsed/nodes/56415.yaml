    html: <p>Re reading this thread I see that the orthodox view has not been clearly stated even if it has been suggested.. That view is the vast vast majority of a design should work without kerning. Good spacing should come from good side bearings and from forms that fit well together. Of course you will need some kerning, but it will be only for exceptionally difficult combinations. Also Caps should be spaced to combine with lowercase, and Small caps with other small caps. Kerning should be done at the very end of the design process.</p>
