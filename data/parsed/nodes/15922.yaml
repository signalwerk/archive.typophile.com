    <p>Hey all,<br>
    Long time lurker, first time poster..</p>
    <p>I've attached a small extract from a textbook I'm currently working on. I'm pretty unsure about the type design, in particular the justification of all the copy. The client is adamant that he wants justified type because it looks 'neater', but I'm unsure as it's quite a type-heavy book. To me the justified type looks a little rigid and uninviting, particularly when the book is aimed at the lay-person.</p>
    <p>The copy is set in Syntax 9.5pt/14pt and headings &amp; captions are set in Conduit. Page size is 23.0 x 28.5 cm. Blank boxes indicated image and diagram placement.</p>
    <p>Any comments would be much appreciated.</p>
    <p>Cheers,<br>
    George</p>
