    html: |-
      <p>The horns of your dilemma –<br>
      Justified – reference/technical manuals often contain long/unusual* terms and hyphenating them will slow reading/comprehension.<br>
      Ragged Right – for the above reason the ragged right margin might be too ragged and will certainly require turnovers and/or takebacks to achieve a good looking page.<br>
      I think that your measure will accommodate both and as the text is in shortish paragraphs I see no reason that you shouldn't use either, that said, the bullet points probably should be set ragged right and maybe indented.<br>
      I'm not sure about using Conduit for the captions and headings in the text, it has a soft outline and, in my view, its nature conflicts with Syntax it works fine as a headline choice though.<br>
      *terms that the reader may not necessarily have come across or in this context.<br>
      Tim</p>
