      <p>Thanks for the comments guys. Overall I agree, ragged right is definitely the way too go.</p>
      <p>Kris, I think it would be used more as a reference. As it's for novices I can't image too many people would read this all the way through &amp; be able to retain much of the information. Also, with the division of chapters the sections of text are generally short to medium length.</p>
      <p>Dezcom, any thoughts as too how much more I should open up the leading? </p>
      <p>- George</p>
