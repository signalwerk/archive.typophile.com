      <p>TIME TO DECIDE: </p>
      <p>Justifed—tell the client that it looks neater, but looks un-human &amp; reads much worse. Your word-spacing is too fluid for this sort of thing. At least hyphenate, even liberally. (I don't subscribe to anti-hyphenation, I prefer my word spaces to be as even as possible.)</p>
      <p>Ragged Right—tell the client that this is the preferred option of the discerning professional, like yourself, and you wouldn't presume to tell him/her the "the distance between the proposed house and sewer junction" for his/her house! Or something similar.</p>
      <p>Typeface—sans or serif: syntax would be somewhat agreeable for short to medium lengths. Is this the sort of thing to be read in one go, or for reference?</p>
    html_clean: |-
