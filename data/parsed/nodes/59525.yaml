      <p>Stephen, </p>
      <p>I’d like to echo Richard Fink’s point that existing font licenses aren’t as easy to understand as they need to be - nor are all fonts licensed in the same way. </p>
      <p>Many existing licenses support @font-face. Others don’t.</p>
      <p>Kernest is only interested in offering the fonts that do.</p>
