    html: |-
      <p>Good. Thank you Ray and Garrick.</p>
      <p>@stephen coles<br>
      A part of what Garrick has done with Kernest is simply to take those fonts that are available for web use with @font-face and collate them, organize them, and categorize them. Along with the source of each font and it’s licensing information.<br>
      Bone simple grunt work.<br>
      All of this stuff was out there for the taking by anybody. Kernest just brings it all together and then also gives you the ability to preview the font “live in your browser” and, if you find it convenient, use the font in your web pages via a link to Kernest’s server.</p>
      <p>There are others who have announced that they, too, will be competing in this new “font services” arena.</p>
      <p>In this way, we are seeing, for the first time, a real-world hashing out of how @font-face works and how these fonts look and behave in different browsers.</p>
      <p>If there is anything to fear, it’s that there <strong>are</strong> quite a lot of “free” fonts. And they <strong>might</strong> look a little too good for comfort!</p>
      <p>But soon, anybody with a browser can see for themselves, with their own eyes.<br>
      Without knowing a lick of HTML or CSS.<br>
      Now, <strong>that’s</strong> progress, no?</p>
