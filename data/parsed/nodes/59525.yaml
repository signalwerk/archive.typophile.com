      <p>@stephen coles<br>
      &gt;From what I’ve read on his site, he doesn’t seem to have a &gt;deep enough understanding of type design to grasp the &gt;licensing/IP issues involved.</p>
      <p>Say what? Type design is type design. Licensing/IP issues are quite separate and apart from that. Two different fields of knowledge.<br>
      One of the problems I’ve run into personally, is that it sometimes seems as if I have to be both a mind-reader because I can’t even find the EULA for a font, and when I do, I need a lawyer to understand it. (Bad sentence, that’s two problems, isn’t it?)<br>
      Anyway, as someone who’s done a lot of: download, test, download, test, download, test; of many fonts with “open” licenses, what I am licensed to do or not do is easy to grasp.<br>
      When it comes to retail fonts, if the licensing issues are such that only an “expert” can understand them, then everybody loses. And, IMHO, it fosters non-licensed use.</p>
      <p>BTW - Garrick Van Buren of Kernest has consented to an interview to be published on <a href="http://readableweb.com">Readable Web</a> shortly. I’ll make sure he’s questioned about your concerns, as I understand them to be.</p>
      <p>Cheers,</p>
      <p>rich</p>
