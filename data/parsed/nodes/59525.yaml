    <p>Through a twitter by Ralf Herrmann, I got wind of a new web font service by developer Garrick Van Buren.<br>
    Got a sneak peak at it, and it’s for real. A nice job of it, too.<br>
    Focuses on free fonts, of course.<br>
    For those looking to tap into the web market when the file format issues finally get worked out (I’m an optimist, it’s a failing, I know), Kernest is slated for public release on the 16th of July and you’ll be able to check out your “free” competition.<br>
    I’ll be taking a close look.</p>
    <p><a href="http://readableweb.com/a-web-font-service-for-real-a-sneak-peek-at-kernest/">A Web Font Service For Real, A Sneak Peek At Kernest</a></p>
