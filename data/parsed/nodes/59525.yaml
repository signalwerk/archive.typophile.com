    html: |-
      <p>Stephen,</p>
      <p>“<cite>From what I’ve read on his site, he doesn’t seem to have a deep enough understanding of type design to grasp the licensing/IP issues involved.</cite>”</p>
      <p>that there’s some hype and investors around TypeKit, does not imply that they have this understanding of type and licensing. Whether they have or not — they have their own interests for running such a business which may or may not coincide with type designers’ or foundries’ interests.</p>
      <p>There’s very telling wording <a href="http://blog.typekit.com/2009/05/27/introducing-typekit/" target="_blank">on their blog</a>:</p>
      <p>“<cite>As a Typekit user, you’ll have access to our library of high-quality fonts.</cite>”</p>
      <p>This indicates: They offer an infrastructure service around font access/licensing. For this to be of any value they need your and others’ “content” or “commodities” — typefaces. And they consider these typefaces already as “<em>our</em> library”. (Imagine the Monotype or Linotype machine without any typeface available.)</p>
      <p>An additional remark:<br>
      The amazing thing is that such a business model can exist only because some browser developers have an aversion against supporting EOT as only allowed format for @font-face.* If they would do, font embedding/linking were pretty straightforward and relatively safe, without need for additional “services”.</p>
      <p>* Like Mozilla’s John Daggett on the www-font list says,<br>
      “<cite>Obfuscated/compression schemes are fine but not if it implies that we make things harder rather than easier for some users.</cite>”<br>
      Well. What, other than that, would TypeKit do?</p>
      <p>Karsten</p>
