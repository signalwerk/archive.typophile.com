    <p>Dear Type Technicians,</p>
    <p>I have posted a little piece of software in your favorite script language that you can use to hack your OpenType features into your fonts.<br>
    <em>Dancing Shoes</em> does not invent the features for you. But it takes care that they are put out in the correct order and syntax, and works around some possible bugs with FontLab’s built-in FDK compiler that should work according to the manual. For instance some <em>script</em> and <em>language</em> tags must not be preceded by others, although that should not be important according to the manual.</p>
    <p><em>Dancing Shoes</em> is especially useful if you generate feature code with multiple scripts, languages and lookupflags within one feature.<br>
    But it can also ease the recurring task of applying features to all your fonts. Because you’ll most likely always use the same naming scheme for your glyphs (<em>.sc</em> for SmallCaps etc), you can keep these in a separate, hard-coded file, and re-apply them with one click or from within another script.</p>
    <p>You initialize the DancingShoes object:<br>
    <code><strong><br>
    from dancingshoes import DancingShoes<br>
    shoes = DancingShoes(glyphs, features)</strong></code><br>
    <em>glyphs</em> is a list of your font’s glyph names and <em>features</em> your hard-coded and ordered list of feature names.</p>
    <p>Then you can add substitutions like this:<br>
    <code><strong>shoes.AddSubstitution('liga', 'f i', 'fi')</strong></code></p>
    <p>or, more complicated:<br>
    <code><strong>shoes.AddSubstitution('rlig', 'afii57457 afii57455', 'uniFC61', 'arab', '', 'RightToLeft,IgnoreBaseGlyphs', 'ARABIC LIGATURE SHADDA WITH DAMMA ISOLATED FORM')</strong></code></p>
    <p>You can then print the feature code like this:<br>
    <code><strong>print shoes.GetFDKCode()</strong></code></p>
    <p>or, in case of a FontLab font object, use the helper funtion (<em>font</em> being your FontLab’s font object:<br>
    <code><strong><br>
    from dancingshoes.helpers import AssignFeatureCodeToFontLabFont<br>
    AssignFeatureCodeToFontLabFont(font, shoes)<br>
    </strong></code></p>
    <p>For now, only substitutions and positioning lookups (Type 1 and 2) are supported. Which should be enough for most use scenarios. Other lookup types (like mark positioning) will be added later.</p>
    <p>You’ll find it here, along with documentation:<br>
    <a class="freelinking external" href="http://www.yanone.de/typedesign/code/dancingshoes/" rel="nofollow">http://www.yanone.de/typedesign/code/dancingshoes/</a></p>
    <p>It’s free.<br>
    But as always: Should you use it for production of your professional fonts, a donation is highly appreciated.</p>
