    html: |-
      <p>Write to Sandoll directly and explain why you need the font for free. I'm serious. If you make your case convincingly, they might be open to granting you the licence for free. I know Sandoll has done promotions of this sort where they encourage those who can't afford their library, like cash-strapped NGOs for example, to explain why they need Sandoll fonts, and selected entrants can get the fonts for free.</p>
      <p>I've heard an anecdote about a penniless graphic designer writing to Process Type Foundry with a similar request, and he was also granted the fonts for free.</p>
      <p>I hope this helps. If this doesn't work, and you absolutely need Sandoll Gothic, then be prepared to pay for it, because it's a commercial product that some people spent years developing, and they are well within their rights to charge people for the licence to use it.</p>
