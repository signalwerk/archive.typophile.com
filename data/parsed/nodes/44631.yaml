      <p>Sunil, I'm pretty sure that the EULA of Sandoll Gothic prevents one from sending it to someone else who hasn't bought the licence. In general, you can't just ask someone to send you a commercial font.</p>
      <p>If you are not willing to pay for commercial fonts, then try to look for free alternatives, at least. Here is a link where you can download two quality free fonts, including Nanum Gothic, also from Sandoll:</p>
      <p><a href="http://hangeul.naver.com/index.nhn?goto=fonts#fonts" title="http://hangeul.naver.com/index.nhn?goto=fonts#fonts">http://hangeul.naver.com/index.nhn?goto=fonts#fonts</a></p>
