      <p>The link for Sandoll Gothic is here: <a href="https://www.sandoll.co.kr/SandollWeb/shop/product_down_read.asp?idx=187&amp;listType=2" rel="nofollow">https://www.sandoll.co.kr/SandollWeb/shop/product_down_read.asp?idx=187&amp;listType=2</a></p>
      <p>However, purchasing the font is extremely convoluted for a non-Korean, mainly because the site is only available in Korean. You have to become a member, which requires you to e-mail or fax them a copy of your passport or driver's licence unless you're Korean and have a national identification number. Unless you have a working knowledge of Korean, you'll need a Korean speaker to guide you through the steps. The situation will be similar with other Korean foundries. You have South Korea's excessive regulation of internet commerce to thank...</p>
      <p>There is a vendor I found whose page is in English offering mostly Yoon Design fonts: <a href="http://asiasoft.com/bin/category/?mainCatID=2&amp;subCatID=9" rel="nofollow">http://asiasoft.com/bin/category/?mainCatID=2&amp;subCatID=9</a></p>
      <p>Alternatively, if you have $1585 to spare, <a href="http://asiasoft.com/bin/product/?itemCode=ADDW2K&amp;search=" rel="nofollow">the Korean version of Adobe InDesign CS2</a> comes bundled with an impressive range of releases by all the major Korean foundries...</p>
