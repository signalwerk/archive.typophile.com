    html: "<p>Hi Tiffany: <br> <br>I was working the Graphic Artists Guild booth at Macworld last week and we had several conversations over the course of an afternoon with graphic designers from the far northern reaches of California. I think the college in Arcata tends to foster better design sense than you might expect from a small city. I know some folks who've finished design degrees at Humboldt State as well. It may be a place to start. <br> <br>Joe <br>also in northern CA, but not that far north <br><a href=\"http://www.joevanderbos.com\" target=\"_blank\">www.joevanderbos.com</a></p>"
