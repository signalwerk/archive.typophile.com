    html: |-
      <p>Well, I obviously support perm. It is the first 21st-century meta-data subfile for any media type and whether generally accepted or not, it is what users and developers really want —  teaching not busting, updatable, upgradeable, and likably linkable, machine/human-readable, user-interface-able at every level from founder to end user. Please support it, or Harry Parker will shoot my dog Mutton.</p>
      <p>&gt;Many foundries have expressed support for Tal Leming’s web font proposal on Twitter</p>
      <p>I wish the list my best. Developing web fonts is even more informative then reading, say, 1,000 entries such as this, maybe a million. Or... what would founder X on that list be charging for such a Tal font order? Tal what are you going to charge for fonts in your format to; a previous licensee for print, a new licensee for print, and new licensee for both? We have business and development plans all the way out to 'delivery', with PERM, or no PERM, or PERM Sooner, or PERM later. In case you are interested though, I am only permitted to make legitimate offers. </p>
      <p>Furthermore, if these listed foundries really want potential protections for all their font licensing activities, the perm table is retroactively listing fields for licensing and other activities we've needed bits for, for years. What does Tal's proposal have to say about OEM bundling? about modification rights? about transferability? Isn't it time for not-entirely web-related permissions and recommendations to be stated inside fonts? Isn't it time to move backwards and forwards a little, get a complete grip, and then take off in whatever format they decide on... already perm-ed?</p>
      <p>Then there is Tal's list of fields which repeats much of what is already in the font, adding a little to the education of users, but e.g reinforcing the idea that answering the question of 'who designed the font?' is more important than say, how well it is suited to blinking, setting at 9 ppm or on a curved baseline?  Is this really how the font designers want our view of 'what's important' to be viewed?</p>
      <p>Is "text describing the font" supposed to handle all this? Where it the machine-readability in that? In the end, about compression? In the short term, (i.e. before broadened bandwidth makes font file sizes irrelevant in seeking instant movie downloads), compression is needed to be solved in the presence of the font, the use and the document, and not before, (if you're the protective kinda typophile). </p>
      <p>I'd also be sickened and disgusted by the divisive processes of uncooperative proposal and counter proposal ;) and tired by 350 hours of community service since spring (without being convicted of anything, much less pleading guilty), but in about 30 seconds, I'm on the first day of a two week vacation. </p>
      <p>The last thing that was added to the OT spec in this area, was the DSIG table<em>... is it our turn yet?</em></p>
      <p>Cheers and Laters!</p>
