  html: |-
    <p><a href="http://typegirl.tumblr.com/post/142912558/most-of-the-important-foundries-are-supporting-webfont" rel="nofollow">Many foundries have expressed support for Tal Leming's web font proposal on Twitter</a> in the last few days, and so have some influential web pundits like <a href="http://daringfireball.net/linked/2009/07/15/leming-van-blokland" rel="nofollow">Gruber</a>. Its an impressive list, to be sure, and may become the web font format for all browsers in the future.</p>
    <p>Meanwhile, <a href="http://typophile.com/node/60006" rel="nofollow">Typotheque</a> and <a href="http://www.flickr.com/photos/veen/3572372312/" rel="nofollow">TypeKit</a> (EDIT: and <a href="http://kernest.com/" rel="nofollow">Kernest</a>) are doing a good job of bringing web fonts to 99% of browsers <strong>today</strong>. </p>
    <p>But little has been said about <a href="http://www.fontbureau.com/otpermtable/" rel="nofollow">David Berlow's PERM table proposal</a>, published Wednesday - <a href="http://www.fontbureau.com/otpermtable/" rel="nofollow">www.fontbureau.com/otpermtable/</a> - which<br>
    he <a href="http://www.fontbureau.com/news/2009-07-15" rel="nofollow">introduces on the FB blog</a>.</p>
    <p>So I thought I'd start a thread here. </p>
    <p>Who supports the PERM table? :-)</p>
