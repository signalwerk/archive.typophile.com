      <p>I think I´ll stick to that "a", and maybe have a one-storey a as an alternate. It is, as you say Nick, the signature character. After all there are quite a few faces with an ordinary a to choose from. I guess some will like like it and some not. And I don´t think there´s anything wrong with the shape, neither logically nor calligraphically (look at Galliard), one´s just not used to it..<br>
      Yeah, the spacing is too tight for text, but that´s fairly easy to fix, lowering the descender is somewhat more complicated...lots of characters resting on it. Maybe I could raise the bowl on g instead..<br>
      I agree the Medium is more like a Regular, is just didn´t want a predetermined standard weight. I think it works fine with the Bold (check out new pdf).<br>
      About the questionmark, I found this shape to be the least space consuming one.<br>
      I´m not sure about the black ampersand falling backwards, I think the crossbar keeps it on its feet... but I´ll look at it!</p>
