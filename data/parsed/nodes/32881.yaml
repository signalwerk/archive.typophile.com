      <p><cite>the caps feel like sign painter’s letters.</cite></p>
      <p>Yes, handpainted signs was an inspiration, and old, bold letterpress stuff like those modelling for FB Rhode and HTF Champion. I guess I wanted to make a more contemporary version, with some of my own personality in it too. First I thought of it as mainly a headline face (it was then consisting of three bold weights), but then I tried expanding it to lighter weights, and found it worked quite well.</p>
