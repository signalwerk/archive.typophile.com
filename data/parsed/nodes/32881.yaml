      <p>I think it's a wonderful type family. I will however echo some of the previous comments; the descenders are indeed a little too short for my liking and I'd be concerned about them getting lost on some presses, especially on newsprint. It might be a lot of work, but at this stage where you've already committed so much time a little more might be worth it when shopping this around to vendors.</p>
      <p>The regular 'a' is a bit different and I'm not sure I like it. The idea of having an alternate in OT would be nice. It's like the '@' symbol in DIN it's unique but every job I've worked at and we've used DIN for a client we've had to sub out the symbol with one from another font. I'd hate for that to be the case here.</p>
