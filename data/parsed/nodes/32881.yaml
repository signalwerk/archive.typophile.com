    html: <p>Well, that doesn't really bother me that much. Innovation is wày overrated. For every single thing, there can only be 1 pioneer &amp; by now, pretty much everything has been done before at least once. The only thing left for us to do is to make a good collection from all the things we like &amp; try to add some personal flavour &amp; I for one think Toby's done a hell of a job with his Zai font. An alternative "a" may be a good compromise (especially for larger type), but I'd leave the original in. Set in texts in regular size for reading it doen't even stand out that much.</p>
