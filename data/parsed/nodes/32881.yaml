      <p>It's a very good contrast. Thanks for the illustration. Does the black work in the same way as the Bold? Not that it has to, but if you are genuinely offering a non-prescriptive naming structure then IMO you need a weight that will bold up(?) well with the light and the thin too. Plus a suitable bold weight of a font is often two weights away from its lighter counterpart.</p>
