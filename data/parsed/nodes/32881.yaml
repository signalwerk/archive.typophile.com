      <p>Toby: <em>I agree the Medium is more like a Regular, I just didn´t want a predetermined standard weight.</em> </p>
      <p>I'm just not sure if medium is the right name.</p>
      <p>Stephen: <em>Some anglo types have much wider ‘C’s, but those of other types, particularly in Germany, are much more narrow.</em></p>
