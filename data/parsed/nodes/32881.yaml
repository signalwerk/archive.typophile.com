    html: |-
      <p>I think it takes real courage to post a font on Typophile, Toby. I think it's excellent. Stephen's right; fine work. </p>
      <p>Here are my comments for what it's worth:</p>
      <p>I wonder if the five weights fall in the right position on the scale. I think you can afford a medium (in between the current medium and bold). The current medium looks like more like a regular to me. I also think your bold might need to be a touch heavier to work with the existing medium. I'd like to see a regular and bold together.</p>
      <p>You may consider that the 'a' is Zai's signature character but it is an stumbling block for me (Am I alone?) I wonder if it will cost you sales or generate sales (you may not care about income). Maybe it is worth including more than one as an OpenType alternate. The fact that it looks like it is an inverted 'e' could be contrived/gimmicky? I'm sure someone else with more experience might care to comment on this.</p>
      <p>Suppose you go with the existing 'a', is it me or does the centrestroke look optically steeper than that of the 'e'? Maybe that doesn't bother you.</p>
      <p>The tail of the 'g' appears to get shorter as the font gets bolder. Put the thin 'g' next to the black 'g' - I am not sure if they are alike enough?</p>
      <p>Are the 'C'/'c' and 'K'/'k' too narrow?</p>
      <p>To me the '4' appears to slope backwards because the upper left stroke seems too upright and perhaps needs to echo the angular downstroke on the '7' more.</p>
      <p>The question mark '?' looks out of place when put next to '3', '5' and '8' (not that it has to be like these numerals but I imagine you're trying to get commonality where possible).</p>
      <p>I think the centrestroke of the ampersand should perhaps extend more towards the 't' part of the glyph. The Black ampersand looks to be falling backwards.</p>
      <p>Sorry if I sound negative, not meant to be so.</p>
