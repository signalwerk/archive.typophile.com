      <p>Fine work, especially in the black weight. You must be getting some formal training?</p>
      <p>The spacing is too tight if you intend this to be used for text setting (which it really can do, despite it's buoyant character).</p>
      <p>I dig your effort to keep things compact, but consider giving the descenders just a little more room. The 'g' is distractingly cramped anywhere near 10 pt.</p>
      <p>It doesn't serve the Black weight well to show it at 10 pt. as it's really best for display use.</p>
      <p>The angled strokes really shine on the italics.</p>
