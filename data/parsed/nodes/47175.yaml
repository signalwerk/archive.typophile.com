    <p></p><div class="imageWrap"><img src="http://typophile.com/files/realwear_3575.png"></div><p></p>
    <p>hello.<br>
    i am working on a logo for a company which will distribute and sell the carhartt clothes (both work and street) via online shop in slovakia.<br>
    i made this bunch of logotypes and now i can't decide which one fits best for this kind of company.<br>
    i drew all the letters myself except of the version L - that is avenir.</p>
    <p>which one would you choose?</p>
    <p>thank you.</p>
