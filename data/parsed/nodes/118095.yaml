      <p>You've obviously rushed that, as it's not very well aligned.<br>
      The typefaces should be the same weight or at least complimentary styles.<br>
      I also think for a Geelong football logo the font should have a stronger, bolder, more masculine feel.</p>
      <p>The words Geelong follows (badly) the oval shape in a fan shape, where as the Football Association (also badly aligned with the curve of the ball) follows the vertical Arch shape.</p>
      <p>Also the 4 lines are not equal distance from the out edge of the ball.<br>
      This is very sloppy, and really shows a lack of care. In future look at every aspect of what you design.<br>
      As a tip to see if it's balanced, you should also check it out in a mirror.</p>
      <p>I'd say you've still got a long way to go yet, but you can do it.</p>
      <p>What about a stylised whistle in outline, have you tried anything like that yet.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/logo-02_6641.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Screen shot 2014-07-24 at 09_5755.33.15.png"></div><br>
      Or do the umpires have any special clothing, or hand signals, or extra gear?<p></p>
      <p>Here's one you can have from me. It's got the whistle shape, the Gee, and the 4 football stripes. :)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Screen shot 2014-07-24 at 09_3734.37.15.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Screen shot 2014-07-24 at 09_5248.38.47.png"></div><p></p>
