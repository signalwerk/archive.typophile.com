      <p>A logo should always work in one colour, and at multiple sizes.<br>
      Your choice of fonts is very cartoon like.<br>
      The whistle doesn't indicate what game the Geelong Football Umpires' actually umpire.<br>
      I would try to incorporate some aspect of the game.<br>
      Also your whistle is very cartoonish.<br>
      Umpires are professional people who do a serious job.<br>
      You need to use cleaner less frivolous fonts, and more stylish adult artwork.<br>
      With less 'garish' colours. The cyan you've used is way too loud.</p>
      <p>I did a quick search in Google for 'umpire logos'</p>
      <p>These were my favourites.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/SEJ_UMPIRING_LOGO-1_6273.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/PBUC_400px_splash_4561.gif"></div><p></p>
      <p>and the football teams themselves seem to use an clean illustrative style, like these.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/North_Melbourne_Football_Club_Logo_6109.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/url_5393.jpg"></div><p></p>
      <p>Perhaps you could develop something along a similar line so it fits in with the games overall branding style.</p>
