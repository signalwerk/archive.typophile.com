      <p>Yes, yes, yes, thank you, Hrant. We all love how positive you became over your hiatus. You’re so much less infuriating than before. Though not quite at the zero point yet.</p>
      <p><strong>Recap.</strong> It’s a conflict of interest if one:</p>
      <ul>
      <li>runs a commercial Web site (this site is commercial; it solicits money and runs ads) <em>and</em></li>
      <li>accepts pay from a company that is in the same industry and is an occasional advertiser</li>
      </ul>
      <p>None of the other cases listed in comments above meets those criteria. </p>
      <p>A really attentive reader, if there is one, which I doubt, will have noticed I did not set out any remedies, nor claim that the conflict of interest was (for example) deliberate, egregious, or untenable. Any number of options are available to rectify the matter. Two that aren’t available are doing nothing and denying a conflict of interest exists.</p>
