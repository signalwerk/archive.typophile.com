      <p>Joe, I think you're the one deliberately avoiding the glaringly obvious problem: No matter how correct or authoritative your suggestions, your attitude and manner, conveyed in nearly every post, is one of disdain, condescension, disrespect and hostility. Go back and look at what you write. Witty, yes, but also highly repellent. It's more distressing to me that you often have a good point, and yet can't articulate it in any positive or civilized way, than it would be if you were just a tiresome and ignorant complainer. </p>
      <p>Many have pointed this out: you have valuable input, and it's always coated in bile. You insult and belittle others on this board relentlessly, then cry hurt kitten paws when you perceive a slight or discredit (as in the Toronto subway font thread, among others). If you are unaware of this hypocrisy, please make yourself cognizant. Meanwhile you have no business lecturing us that we're ignoring the plentiful flaws in Typophile. Those problems are acknowledged. </p>
      <p>You push others away with your negative and hostile approach. This is not irrelevant to your argument; it colors and impedes it. This is the sticking point, not a mass denial about mechanical problems with Typophile. This is not an evasion of the more pressing problem of non-compliant code. Your sour attitude is an unnecessary and unwelcome ingredient in every discussion you join. Stop pretending to be so offended and stop being so offensive. Stop sidestepping what must by now be a leitmotif of your correspondence. Nobody else brings as much judgement or bitterness to discussions here.</p>
      <p>It has been noted that some of your suggested changes would deaden or scramble discussions here. Since discussions are the lifeblood of Typophile, and you clearly have only web standards compliance on your mind, who has the conflict of interest?</p>
