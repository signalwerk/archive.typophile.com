  html: |-
    <p>The December edition of the Metal Type newsletter is now out.</p>
    <p>There has been plenty of new stuff added to the site during the month of November. The site's Christmas decorations are now on display - Cooper Black this year!</p>
    <p>To take a look at this month's video newsletter (now available in HD), click this link:<br>
    <a href="http://www.metaltype.co.uk/rail/clicks/click.php?id=17" title="http://www.metaltype.co.uk/rail/clicks/click.php?id=17">http://www.metaltype.co.uk/rail/clicks/click.php?id=17</a></p>
    <p>I'm carrying on the "vehicles" theme at the end of the video, this month we take a look at the "Scott Sociable," a very unusual car.</p>
    <p>Why not subscribe to the Metal Type monthly newsletter?<br>
    Click the link below to enter your details:<br>
    <a href="http://j.mp/n3wkjc" title="http://j.mp/n3wkjc">http://j.mp/n3wkjc</a><br>
    Just one email per month, usually on the first.</p>
    <p>All the Best<br>
    Dave Hughes<br>
    York, UK</p>
