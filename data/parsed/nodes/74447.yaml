    <p>Hi all,</p>
    <p>I was looking for a foundry/ face that has a very organic, eroded feel to it. I've been searching around and ran across a few, but I would like to see what some other trained eyes could suggest. I really like a few of the characters in <a class="freelinking external" href="http://www.dafont.com/santos-dumont.font" rel="nofollow">Santos DuMont</a> set, but the overall set isn't what I was looking for. Thanks for any suggestions!!</p>
    <p>L</p>
