  html: |-
    <p>Hi all,<br>
      I'm currently doing a bit of research on the history of the Latin alphabet and I was wondering if anyone knew of helpful resources, academic or otherwise, that could help me along. Specifically I'm looking for info on the early development of the characters of the alphabet, particularly the onset of lowercase letters. </p>
    <p>I've already got Bringhurst's ETS, Allan Haley's Alphabet and am skimming through David Sacks' Letter Perfect.</p>
    <p>Thanks in advance,</p>
    <p>jr</p>
