  html: <p>I found a font on TinyPrints.com that I like. They call it "Deco Sans." I'd like to find it on-line and download it for use. However, there seems to be more than one style of "Deco Sans" (e.g. <a href="http://new.myfonts.com/fonts/alan-ronn/deco-sans/" title="http://new.myfonts.com/fonts/alan-ronn/deco-sans/">http://new.myfonts.com/fonts/alan-ronn/deco-sans/</a>) Is this a generic name used for a particular style in the world of typography?</p>
  html_clean: <p>I found a font on TinyPrints.com that I like. They call it "Deco Sans." I'd like to find it on-line and download it for use. However, there seems to be more than one style of "Deco Sans" (e.g. <a href="http://new.myfonts.com/fonts/alan-ronn/deco-sans/" title="http://new.myfonts.com/fonts/alan-ronn/deco-sans/" class="link-external">http://new.myfonts.com/fonts/alan-ronn/deco-sans/</a>) Is this a generic name used for a particular style in the world of typography?</p>
