      <p>Most respected: I’m not crazy enough to start that flame-fest.</p>
      <p>Best selling: If licensed fonts count, I think Monotype wins for all the sales of Arial, Times New Roman, and Verdana that are packaged with Windows/MS Office.</p>
      <p>For direct sales? Probably Monotype, at least now that Monotype has purchased Linotype and has a Brobdingnagian portfolio to sell.</p>
