  html: |-
    <p>Found the following at Garrick Van Buren's "Kernest" and figured Garrick might have better luck with an answer here at Typophile:</p>
    <p><cite>Many of the assets browsers understand have specific MIME types to provide hints to the web browser (and email clients) on how to process them. Everything from images to javascripts to Microsoft Word docs have a corresponding MIME type.</cite></p>
    <p><cite>A basic example of this: PDFs might be rendered via a browser plugin or the browser might hand it over to Preview.app.</cite></p>
    <p><cite>With the adoption of @font-face and the corresponding proliferation of embedded fonts - is a font-specific MIME type needed?</cite></p>
    <p><cite><a href="http://annevankesteren.nl/2008/08/font-mime-types" rel="nofollow">Anne van Kesteren asked this question back in 2008</a> - and the closest answer I can find is ‘application/octet-stream‘ might be fine (since it already exists) but it definitely doesn’t feel clean.</cite></p>
    <p>From: <a href="http://kernest.com/blog/archive/font-face-and-font-mime-types" title="http://kernest.com/blog/archive/font-face-and-font-mime-types">http://kernest.com/blog/archive/font-face-and-font-mime-types</a></p>
