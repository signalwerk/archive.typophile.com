    html: "<p> Stuart, thanks for the feedback and great ideas. <br> <br>Just to clarify, the DEFCON interface is going to pop-up from the DESIGN KITS portion of the Apollo 26 site, which is still being constructed. <br> <br>A few things: the collector's tin packaging is going to be screened with a red UPC/stars logo (its one of the first images in the intro), but we haven't taken the product shots. The spongy lining is a good idea. Actually, the closest thing to one of those cool boxes is a photographer's box. The lowest wholesale price we saw was $18.00. Out of our price range, but our Made In Japan Design Kit is going to come in an old school metal lunchbox. <br> <br>Yeah, we're going to outline everything that people get...on the PDF and Goodies pages. I disabled those because they are incomplete. We're a ways off, but thought I'd get some initial feedback. July 26 is actually too soon. <br> <br>Any suggestions on pricing? And the 199 figure? <br> <br>bj </p>"
