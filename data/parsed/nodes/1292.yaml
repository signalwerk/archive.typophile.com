  html: <p>Here's a Typophile-only link to check out a sneak peek of DEFCON, our first retail release. The actual release won't happen for about a month. <br> <br>www.apollo26.com/DEFKON/index.html <br> <br>The link is not to be reposted anywhere permanent because it's going to expire at 2 a.m. PST. <br>The goodies, PDF, pricing and buy links have been disabled. We are going to be using KAGI for e-commerce. <br> <br>I'd love to hear feedback, but what I really WANT is criticism. Yes. This sneak preview is only here at Typophile so please be critical. This will help IMPROVE the final product. If you miss it today, email me <a href="mailto:bjharvey@apollo26.com">bjharvey@apollo26.com</a> and I can give you a fresh link. <br> <br>I've already shown this to some people and received a lot of questions, so I'll just answer a few. <br> <br>WHAT'S A DESIGN KIT? <br>This is answered in the intro. Essentially, a Design Kit is a collection of Digital Elements. <br> <br>WHO IS THIS FOR? WHO'S GOING TO BUY THIS STUFF? <br>We have in mind a bunch of different demographics that could use our Design Elements and we will target those people within the next month, at least to make them aware of our product. Having worked in and around the Action Sports Industry (surf, skate, moto, etc), this promises to be our most interested demographic. But we realize that this stuff is not for everyone. We are at work on several more Design Kits, including Musica Electronica, Bad Ass Mofo, and Made in Japan. Our niche is a counter-culture niche. <br> <br>WHERE DID YOU GET THE PICTURES? <br>We took them. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> Now what to do with all these gasmasks? The vector art was created from scratch as were the fonts. A third vector technician has also joined us and is working on some of the other Design Kits. <br> <br>WHY ONLY 199 DESIGN KITS? <br>We'd like to make them 1) available and 2) scarce. <br> <br>HOW MUCH IS IT GOING TO COST? <br>We have a pricing structure in mind, but we'd love to hear suggestions.  <br> <br>WHAT EXACTLY IS INCLUDED? <br>Everything you see plus some more stuff, and sounds that we created on our Korg synth. <br>We'll have a complete list intact when we launch Apollo 26. <br> <br> <br>WHY ALL THE FLASH MOTION? <br>We could show everything static but we didn't want tiny gifs. I don't know how rampant piracy is, but we wanted to give the copycats a moving target. The Flash movies aren't exactly Mike Cina quality, but they are a start. <br> <br>THE FLASH MOVIES RUN REALLY SLOW OR REALLY FAST ON MY MACHINE <br>We are trying to find a happy medium. For computers with processors &gt;500 mhz, the Flash movies go to0 fast. We need to space out some areas where the text appears too fast. If you have anything below an iMac, I'd love to hear how your computer handles the Flash. We haven't yet tested in an OSX platform, but I would guess that it would speed it up. It actually was built on a Mac, but runs better on Windows. <br> <br>ARE THE FONTS GOING to feature a full character set? <br>Yes. <br> <br>DOES THIS HAVE SOMETHING TO DO WITH 9/11? <br>There are no specific 9/11 references, it's more our Elemental take on the state of our world. <br> <br>WHAT DOES THE WORD 'DEFCON' REFER TO? <br>Defcon is the Defense Condition of our country, referred to in numbers ranging from 1 to 5. <br> <br>IS THIS A NEGATIVE TAKE? <br>We couldn't be more positive that it's not intended to be negative, these are just design elements and we happen to be very positive people, with occasional visions of bad things. <br> <br> <br>bj <br> <br> <br>By the way, as you can see we are keeping the name. CS was nice and wished us good luck.</p>
