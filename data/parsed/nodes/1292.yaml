    html: <p> Hey BJ, <br> <br>It's really a very engaging interface and a great way to present your design kit. Since you're looking for critique, here's my take . . . <br> <br>For the average consumer who doesn't have the benefit of your post to read, you never actually come out and 'show' or explain the whole kit which I can imagine is an impressive gathering. <br> <br>I'd like to see the design kit sold in a metal spy or military suitcase with a black spongy foam lining that has holes cut out for a CD case, the shrink wrapped tee with the biohazard sticker sealing the bag, and a printed laminated 'manual' just to name a few . . . <br> <br>The entire demonstration is great but it lacks real call to action that would get people to make a purchase. Show 'em the entire kit, explain the pieces, present the price, make sure you spell out in the animation before you show any elements that this kit comes with 'X' clip art elements, THEN show the clip art . . . <br> <br>Check out www.houseind.com - they show the kit, the tee, the vector art, the fonts and engage you to place an order, that's ideally what you would want to present to your audience to make some sales. . . <br> <br>The only long term problem I forsee is you will still need a uniquly branded Apollo26.com website that features AND promotes each design kit. You DO want your audience to know that DEFCON is the name of one of your products, NOT your company . . . <br> <br>Otherwise, I can't wait to see the final release! Good work so far! <br>Stuart :D </p>
