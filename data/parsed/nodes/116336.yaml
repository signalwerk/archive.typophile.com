      <p>Interesting, I try to test code below, and it work corect.<br>
      When I change the order, it work like in Your example.</p>
      <p><code><br>
      lookup smcp {<br>
       lookupflag 0;<br>
        sub \n by \n.smcp;<br>
      } smcp;</code></p>
      <p>lookup swshLiga {<br>
       lookupflag 0;<br>
        sub \n \g  by \n_g.swsh;<br>
      } swshLiga;</p>
      <p>lookup swshSub {<br>
       lookupflag 0;<br>
        sub \n by \n.swsh;<br>
      } swshSub;</p>
      <p>feature smcp {<br>
       script DFLT;<br>
        language dflt;<br>
        lookup smcp;<br>
       script latn;<br>
        language dflt;<br>
        lookup smcp;<br>
      } smcp;</p>
      <p>feature swsh {<br>
       script DFLT;<br>
        language dflt;<br>
         lookup swshLiga;<br>
         lookup swshSub;<br>
       script latn;<br>
        language dflt;<br>
         lookup swshLiga;<br>
         lookup swshSub;<br>
      } swsh;<br>
      </p>
