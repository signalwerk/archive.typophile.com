    <p>I have created c2sc, smcp and swsh features which all work as they should. However, when applying the smcp together with the swsh, the two ligatures for n_g.swsh and h_y.swsh appear instead of N, G, H and Y small caps. How can I have the two features together and somehow override the ligatures?</p>
    <p>Here's the code:<br>
    feature swsh {<br>
        sub @swsh1 by @swsh2;<br>
        sub N i by N_i.swsh;<br>
        sub h y by h_y.swsh;<br>
        sub n g by n_g.swsh;<br>
        sub n y by n_y.swsh;<br>
        sub r h by r_h.swsh;<br>
        sub r i by r_i.swsh;<br>
        sub r j by r_j.swsh;<br>
        sub r k by r_k.swsh;<br>
        sub r t by r_t.swsh;<br>
        sub r.swsh' @fligs by r;<br>
        sub @swsh3 by @swsh4;<br>
    } swsh;</p>
    <p>I've been messing about with it for so long I can't think straight.</p>
    <p>Any help gratefully received.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/featuresgrab_4746.png"></div><p></p>
