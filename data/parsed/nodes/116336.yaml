    html: |-
      <p>Hi Nick</p>
      <p>Having a guess at what is happen here, it could be that the 'swsh' feature may be happening before 'smcp' and/or 'c2sc'. You probably want all the standard replacements to happen first - then have the swash ligatures lookups act on what's there after.<br>
      Also if changing text with swash ligs into small caps, you may need to decompose the swash ligs back to standard glyphs in a separate lookup before applying smcp lookups.</p>
