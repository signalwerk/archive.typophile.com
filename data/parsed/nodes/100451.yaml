    <p>Having coughed up a large sum for the Creative Suite Master Collection, on the principle that although I would never use a lot of the apps, it’s always good to be prepared, I was rather disappointed that when such a situation recently arose, it didn’t have what I needed.</p>
    <p>In particular, I was expecting some designer-friendly alternative to PowerPoint. Up to now, I’ve always used PDFs, made in InDesign, to create a “slide show”, but now I want to include sound, movies, and dissolves. </p>
    <p>Anyway, $20 for Keynote is OK. The canned transitions are a bit cheesy but should be ﬁne used with discretion, and simpler than Flash, Fireworks or After Effects.</p>
    <p>However, there is one HUGE problem (for a typophile): unless I’m mistaken it doesn’t support font kerning metrics! </p>
    <p>I have several options:</p>
    <ol>
    <li>Use Keynote, but import bitmapped kerned text blocks made in InDesign or Photoshop.</li>
    <li>Use Keynote, manually kerning the most obvious letter combinations.</li>
    <li>Do the whole thing in InDesign.</li>
    <li>Use a monospaced font.</li>
    <li>Some other application.</li>
    </ol>
    <p>What do you recommend?</p>
