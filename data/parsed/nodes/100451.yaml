      <p>PPT does have some basic kerning / tracking controls, on the PC side at least. Be aware that the PC and Mac versions of PPT will vary quite a bit in features, but more-so in interface and controls. In PPT 2010 you can find some basic options by selecting your text or text frame and clicking the tiny little box / arrow underneath the character color icon (in the Font section of the ribbon). This will open up the "Font" window, which has some more "advanced" type features, the second tab of which is kerning / tracking. Also bear in mind that in general, PPT does not play well with OTF fonts. </p>
      <p>As a matter of fact MS just released a service pack a few weeks ago that made OTF fonts disappear when you put the presentation in "present" mode. They have since fixed the issue I believe. Not 100% sure, as I had to roll back my system.</p>
