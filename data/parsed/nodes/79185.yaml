  html: |-
    <p>i think its really interesting to know what typeface designers use on their CV, it's almost like asking what typeface are you?</p>
    <p>I use Adobe Caslon in mine.</p>
    <p>I was asked to redesign a CV for a friend(a very interesting project by the way, it was actually quite difficult and very fun), and I thought of using Officina because she works in a bank and I expect her cv will always be printed on some cheap laser printer, I think Officina looks good no matter how cheap the printer is.</p>
    <p>what about you?</p>
