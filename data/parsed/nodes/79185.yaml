    html: |-
      <p>I am a fan of humanistic sans, which I find maybe for most of designers here already a bit dated, but in a non-designer environment still a fresh appearance. Therefore I make us of Frutiger. The MS rip-off “Segoe UI” is sufficient too. The new Office font Calibri is too “bundled” and round. Most people I know use Arial.<br>
      As a serif font I read the recommendations of Georgia, Palatino and especially for conservative business Century Schoolbook.<br>
      Personally I find with a serif, it should not be too decorative and I prefere a large x-height, as a size of 10 point (not smaller than 9 I would say) should still be readable. Good candidates to fit this brief are in my opinion Droid Serif and Utopia.</p>
