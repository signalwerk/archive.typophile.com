    date: 2011-02-21T09:44:00
    date_raw: 21 Feb 2011 — 9:44am
    votes: null
    html: <p>One problem I have often run into is when s/he want’s to update it themselves in the future when I’m not around and they don’t have your fonts or software. It’s possible to pull it using Times and Arial in Word. It's not the font, it’s how you use it. While presentation counts and you want a salient typographic hierarchy that is congruent with the informational hierarchy, there is a law of diminishing returns when it comes to pushing type around on a page for a document such as a CV. At the end of the day, content is more important than form. &lt; /soap_box &gt;</p>
    html_clean: <p>One problem I have often run into is when s/he want’s to update it themselves in the future when I’m not around and they don’t have your fonts or software. It’s possible to pull it using Times and Arial in Word. It's not the font, it’s how you use it. While presentation counts and you want a salient typographic hierarchy that is congruent with the informational hierarchy, there is a law of diminishing returns when it comes to pushing type around on a page for a document such as a CV. At the end of the day, content is more important than form. &lt; /soap_box &gt;</p>
