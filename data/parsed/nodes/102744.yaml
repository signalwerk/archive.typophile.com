      <p>Commando Group website uses <a class="freelinking external" href="http://www.myfonts.com/fonts/p22/underground-basic" rel="nofollow">P22 Underground</a>. By switching to the <a class="freelinking external" href="http://www.myfonts.com/fonts/p22/underground-pro" rel="nofollow">Pro version</a>, you could get the <a class="freelinking external" href="http://www.myfonts.com/fonts/p22/underground-pro/p22-underground-pro-book/glyphs.html#glyphs/385020/998" rel="nofollow">single storey /a</a> available as stylistic alternate through OpenType features.<br>
      More in the same vein: <a class="freelinking external" href="http://lineto.com/The%20Fonts/Font%20Categories/Text%20Fonts/Brown" rel="nofollow">Brown</a>, <a class="freelinking external" href="http://www.radimpesko.com/fonts/fugue" rel="nofollow">Fugue</a>, <a class="freelinking external" href="http://www.colophon-foundry.org/fonts/relative" rel="nofollow">Relative</a>, <a class="freelinking external" href="http://www.colophon-foundry.org/fonts/value/sans" rel="nofollow">Value Sans</a></p>
