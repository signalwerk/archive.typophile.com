      <p>Just because an image looks like letters of the alphabet doesn't mean that it's a font. In this case, the image is most likely a custom designed logo. (I can't even tell if it's supposed to be qb or gb). </p>
      <p>There is a font with vaguely similar letters called <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code>.  Also <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code>, and a couple of others.</p>
      <p> - Herb</p>
