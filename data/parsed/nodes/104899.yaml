    html: |-
      <p>I've always thought Excelsior is a very nice mid-century modern serif style.<br>
      More recent version in the same ballpark is Font Bureau’s Belizio (based on Novarese’s Egizio).<br>
      More recent still, House Industries’ Eames.<br>
      To exploit the Victorian roots of modern type, Shinntype’s Scotch Modern.</p>
