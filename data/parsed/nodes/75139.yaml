    <p>Hi Typophiles,<br>
    it was great meeting many of you in Dublin last month.</p>
    <p>I have completed a series of blog posts about this year’s ATypI conference for MyFonts.de –&nbsp;in German language, but with lots of images. Here are the links:</p>
    <ul>
    <li><a href="http://www.myfonts.de/2010/09/atypi-dublin/" rel="nofollow">The Word – ATypI 2010 in Dublin (announcement and overview)</a></li>
    <li><a href="http://www.myfonts.de/2010/09/letters-from-dublin/" rel="nofollow">Letter(s) from Dublin / Paradox Alg(i)er(s)</a></li>
    <li><a href="http://www.myfonts.de/2010/09/bunte-tuete/" rel="nofollow">Inspection of the conference bag</a></li>
    <li><a href="http://www.myfonts.de/2010/09/preface/" rel="nofollow">PreFace: Legibility, webfonts and Jim Rimmer</a></li>
    <li><a href="http://www.myfonts.de/2010/09/atypi-tag-1/" rel="nofollow">Day 1: Greco-Irish typography</a></li>
    <li><a href="http://www.myfonts.de/2010/09/atypi-tag-2/" rel="nofollow">Day 2: Flowers, beer &amp; cross-border coöperation</a></li>
    <li><a href="http://www.myfonts.de/2010/10/atypi-tag-3/" rel="nofollow">Day 3: Language issues &amp; Lettering Walk</a></li>
    </ul>
    <p>More blog articles are available from <a href="http://www.typographe.com/article/1174/atypi-2011-reykjavik" rel="nofollow">Martin Majoor</a>, <a href="http://www.typographe.com/article/1174/atypi-2011-reykjavik" rel="nofollow">Jean François Porchez</a>, <a href="http://conkennedy.wordpress.com/2010/09/25/atypi-conference-dublin/" rel="nofollow">Con Kennedy</a>, <a href="http://blog.extensis.com/fonts/atypi-2010-web-fonts.php" rel="nofollow">Tom Phinney</a> on Extensis, <a href="http://www.typeoff.de/?p=1302" rel="nofollow">Dan Reynolds</a> on TypeOff and <a href="http://fontfeed.com/archives/atypi-2010-dublin-the-word-keynote-addresses/" rel="nofollow">Yves ‘Bald Condensed’ Peters</a> on The FontFeed. </p>
    <p>You can also read an ATypI recap in the upcoming issue of <a href="http://www.typo.cz/en/magazine/current-issue/" rel="nofollow">TYPO</a> (in English and Czech).</p>
    <p>Bye-bye ATypI, see you next year in <a href="http://www.atypi.org/news_tool/news_html?newsid=587&amp;from=/" rel="nofollow">in Reykjavík</a>!</p>
