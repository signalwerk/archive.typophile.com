    date_raw: 19 Nov 2008 — 11:59am
    votes: null
    html: <p>Try to balance the visual weight of the two scripts, rather than height or other proportions. In the case of something like signage, you may find that this means using different relative sizes at different scales, and dependent also on the text. This sort of thing often freaks out signage designers, because they tend to like grids and want to be able to spec sizes that can be applied across a system to arbitrary texts. But if you are working with a small amount of known text, then it is easier to work in this way (similar to the way in which a stonecutter or calligrapher will lay out and balance a design).</p>
