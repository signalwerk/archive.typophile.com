      <p>Whatever you do, don't try to make the two scripts appear comparable in size. Sure, you shouldn't exacerbate the issue by using a Latin font with a huge x-height and/or a particularly delicate Arabic font, but the two scripts use the Cartesian area very differently, so if you think you've managed to make the Arabic appear almost as large as the Latin, that means you've probably ruined the Arabic.  :-/</p>
      <p>hhp</p>
    html_clean: |-
