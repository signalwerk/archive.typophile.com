    <p>I am a information designer in the UK and obviously know about using English typefaces on wayfinding and signage, but I know very little about using <a href="/wiki/Arabic" class="freelinking" rel="nofollow">Arabic</a> Typography.</p>
    <p>I have a project coming up in Doha where bilingual signage will be used and wondered if anybody had any advice on using Arabic Type on signage?  What are good font's to use?  How to kern Arabic type?  General rules of thumb?</p>
    <p>Thanks</p>
    <p>HB</p>
