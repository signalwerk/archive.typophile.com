      <p>That's the thing, there's nothing like an x-height (and trying to force one has been the undoing of countless "Latin-matching" efforts). Furthermore, the ascenders and descenders don't always end horizontally. You really have to eyeball it. And to help things along you should allow the Arabic to take up more vertical space than the Latin, and maybe even allow it a darker weight than the Latin.</p>
      <p>hhp</p>
