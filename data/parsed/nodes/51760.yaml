      <p>Hi,<br>
      I would recommend a few things:<br>
      . decide in the first step on the hierarchy (which is more important or are they equal?)<br>
      . regarding kerning, the typeface will have that in it; if you meant tracking so as to space it out, you can insert kashidas (horizontal strips) but the place where you can add them depends on the words themselves.<br>
      . I find it much better if the Arabic is on top of the Latin or on its left<br>
      (if you look at the icon of my Frutiger Arabic you'll see what I mean)</p>
      <p>I hope this helps :)</p>
      <p>cheers,<br>
      Nadine</p>
