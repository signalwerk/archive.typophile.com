      <p>In Marrakech nearly everything was bilingual French and Arabic with an attempt to give the two equal weight</p>
      <p>Often the French was done in a monoline (or close enough to one).  The Arabic had a much larger height, but resulted in the horizontal stroke of the Arabic to be actually slight thinner in general than the thickness of the Latin strokes.  I thought it was odd but it matched okay.  I should have taken more pictures but I didn't but I'll post later an example</p>
      <p>Oddly in the airport they had the Arabic on the right and French/English on the left, both aigned rather unnaturally, with the French/English right aligned and the Arabic left aligned =\  </p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
