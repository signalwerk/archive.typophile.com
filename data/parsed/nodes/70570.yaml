    <p>Hello,</p>
    <p>Recently I was approached by an artist to draw a custom lettering based on the NEWMAN logo for an installation. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/newman_5952.gif"></div><p></p>
    <p>I decided to check if someone drew a typeface based on the original logo design from Mr. Loewy but couldn't find any reference.<br>
    If someone could help me locate a similar looking typeface, I'd appreciate, thanks.</p>
    <p>Best, M</p>
