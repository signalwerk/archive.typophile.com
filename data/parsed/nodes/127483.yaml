  html: |-
    <p>Penguin books are without a doubt one of my favorite companies that work in the print industry.<br>
    So I keep a keen eye on their work and study their type/layout that sort of thing.<br>
    Noticed a recent tendency for a use of Leading that to me seems odd. I assume it is being done deliberately as they don't miss a trick.<br>
    But is it good/done for a reason/what am I missing? I am honestly interested in other views as perhaps my own opinion is a bit outdated/wrong.</p>
