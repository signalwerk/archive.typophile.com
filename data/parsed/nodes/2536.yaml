    html: <p>This looks like Greco Bold, from samples in the Solotype Catalog and Jaspert's 'Encyclopaedia of Type Faces'. I am not sure if I can find an online sample, but I think that's your type here.</p>
    html_clean: <p>This looks like Greco Bold, from samples in the Solotype Catalog and Jaspert's 'Encyclopaedia of Type Faces'. I am not sure if I can find an online sample, but I think that's your type here.</p>
  - id: 20331
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>BTW, the <a href="http://www.fontfinder.ws/search.html?search=Greco" target="_blank">Agfa-Monotype version</a> is not quite the same, and is all-caps. For some reason their own sample is not available for viewing right now. I will try to scan the Jaspert sample to show you.</p>
    html_clean: <p>BTW, the <a href="http://www.fontfinder.ws/search.html?search=Greco" target="_blank">Agfa-Monotype version</a> is not quite the same, and is all-caps. For some reason their own sample is not available for viewing right now. I will try to scan the Jaspert sample to show you.</p>
  - id: 20332
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>Here's a scan from the Jaspert book of Greco (or Bristol) from a Gans 1925 typeface. You can see the A and C are like the sample, and the lower case matches as well, in as many common characters as are shown. Unfortunately this sample doesn't show the entire character set, but I think it shows enough to make the case. Note that the stroke  of the right leg of the A is simpler than the Agfa-Monotype 'Greco' from the link I gave previously. Apparently the newer Monotype/Linotype versions exaggerated that feature, or else developed a solid version of the Adornado face that is not the same as Greco Bold. (The Linotype version was called Vulcan, but looks almost identical.) <br><img src="http://www.typophile.com/forums/messages/83/23090.gif" alt="Greco Samples"></p>
    html_clean: <p>Here's a scan from the Jaspert book of Greco (or Bristol) from a Gans 1925 typeface. You can see the A and C are like the sample, and the lower case matches as well, in as many common characters as are shown. Unfortunately this sample doesn't show the entire character set, but I think it shows enough to make the case. Note that the stroke  of the right leg of the A is simpler than the Agfa-Monotype 'Greco' from the link I gave previously. Apparently the newer Monotype/Linotype versions exaggerated that feature, or else developed a solid version of the Adornado face that is not the same as Greco Bold. (The Linotype version was called Vulcan, but looks almost identical.) <br><img src="http://www.typophile.com/forums/messages/83/23090.gif" alt="Greco Samples"></p>
  - id: 20333
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>It is Greco Bold, but the e's have been tilted slightly. I know this for a fact because I have worked with the original artwork files for the logo and happen to know the designer who did it. The artwork, incidentally, was created by scanning from a type specimen book, not with an electronic version of the font.</p>
