  - id: 20334
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>Mark, thanks for the confirmation. Do you know if the original face was ever digitized? The FontHaus versions that Agfa sells are just versions of the Adornado design, and are all-caps.</p>
    html_clean: <p>Mark, thanks for the confirmation. Do you know if the original face was ever digitized? The FontHaus versions that Agfa sells are just versions of the Adornado design, and are all-caps.</p>
  - id: 20335
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>I think FontHaus has (or had) all of them, but they were not very well done. I don't know of any others. There was also at one time a Linotype face called Vulcan which was probably a knock-off of Greco. It looks more or less the same, but with differences in detail. It's different enough, though, that it would not match the PHC logo.</p>
