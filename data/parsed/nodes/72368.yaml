      <p>"I know you’ve carefully considered the notches, but they don’t appear to follow any logic or system. " They do. The notches are placed at places where two strokes cross and one of the strokes continues in both directions past the gap. In the n the stem continues in two directions past the place of the notch. In the v, it would only continue in one direction, so there is no gap there.</p>
      <p>The 'e' has only one possible place for a notch, the x has two. To create more unity I limited it to one notch per glyph. I had to make an exception to this in the m. If I follow the rule in the y, it should have a gap. I think I'll make the y without a gap an alternate. Here's a pict of the y with a gap. Any suggestions?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ypict_6709.jpg"></div><p></p>
