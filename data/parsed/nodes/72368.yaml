    html: |-
      <p>Looking very good! The font is very interesting in larger sizes, but the breaks seem to basically dissolve at text sizes. I think your upper- and lowercase S need some work - letters like a, p, q, and so on are very smooth, in a way reminiscent of Myriad, but the S's seem to have slightly harsher curves, with proportions a little closer to FF Meta. The line also doesn't appear quite consistent (the spine needs to be a bit thicker....). I still think the r doesn't quite match with the font. It just sticks out. Maybe if you made it join the stem lower still, that would help. This would also help it to appear a little more even in text.</p>
      <p>The breaks in you letters are also a bit inconsistent in that, while some of the letters break in some places, and other letters break in other places, most seem to only have one break. The m sticks out a bit because of the two breaks - what would it look like if the middle join smoothly? The lowercase w has a break, but the uppercase W doesn't? The line thickness of the W needs work too I think...</p>
      <p>The lining numeral 2 is also needs need some work I think....</p>
      <p>Keep up the good work!</p>
