      <p>Caps are usually fatter, but only fractional. This applies to all strokes and curves, horizontal, vertical and diagonal. It has to do with even colour. Compare capital and lowercase i and o in another font. To start, make all vertical strokes the same thickness, then adjust to create a more even colour if needed.<br>
      I'd try making all vertical strokes just a bit thinner so optically they have the same thickness as the bowls.</p>
