    <p>Hello,</p>
    <p>I'm 14 and I've been interested in type since I was 10. I've designed a typeface called expletus sans. Since I'm only 14 I don't have any educational background about typedesign.  This typeface is meant as a project to learn from so any comments, good or bad, are welcome. To judge it properly I suggest you download and print the pdf, so you won't make any misjudgements because of rendering issues. On flickr I've already had a lot help from Alexei Vanyshin, so special thanks to you Alexei! </p>
    <p>Thanks a lot in advance,</p>
    <p>Jasper de Waard<br>
