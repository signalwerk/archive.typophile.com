      <p>This is really nice. I only have a few comments (take these all with a grain of salt -- they're purely my opinion):</p>
      <p>• The curve at the bottom of the bowl of the "d" is a lot sharper than other letters. Maybe see what it looks like if it's more like the "b"</p>
      <p>• the hook on the bottom of the "j" might be a little long (i.e. too far to the left). This seems more of an issue on the lightest weight.</p>
      <p>•&nbsp;the way the righthand stroke on the "y" gets thinner at the top seems out of place</p>
      <p>• the right half of the "m" seems narrower than the left. This could just be an optical illusion, but even so, you might need to widen that half to make it look more balanced.</p>
      <p>You might be better off really perfecting one weight before moving on to the others. It's very tempting to do (I've done it myself), but it can create a lot of extra work, and all the changes can be hard to keep track of.</p>
      <p>nice job!</p>
