    date_raw: 6 Oct 2010 — 12:20pm
    votes: null
    html: <p>Well, to be intirely honest, expletus was not intended for something untill half a year ago. When I started the first designs (which are absolutely horrible), I thought that the concept of the gap itself would be enough to make it a bestseller. I was 10 years old. As I grew older and more experienced I learned that there was still A LOT to learn for me and perfection doesn't exist. It wasn't untill half a year ago that I took my time to think about what it's actually supposed to be used for. I decided it was mainly for print, but, like most display typefaces, could also be used at large (24+) sizes in websites or other screen usage. It also wasn't untill then, that I decided to view expletus as a project to learn from, instead of a rush for gold. It seemed important to me, to understand what happens to a design when you print it at a smaller size. To make expletus an even bigger challenge, I decided to make it reasonably legible at smaller sizes (9+) though not a real text face. "I assumed your font must be at least intended for text somewhat, because of the large blocks of text in your PDF&gt;" Yes, you could say that it was somewhat, not intirely, intended for text.</p>
