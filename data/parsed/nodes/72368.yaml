      <p>First off Kudos to you. That is great work!<br>
      I think the look you're going for really shines in the lowercase 't' and uppercase 'F'.<br>
      It really creates a look of dimension in the negative space.<br>
      In places such as the lowercase q and p. the curve at the end seems a bit forced.<br>
      Obviously there will be difficulties in that area because your dealing with a curve that needs to flow into another. That styling cue works well with all straight lines but all curved lines seem to have the same fault. </p>
      <p>Again, great work, i'm so impressed.</p>
