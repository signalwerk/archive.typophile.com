      <p>"The font is very interesting in larger sizes, but the breaks seem to basically dissolve at text sizes." True. It's a display face, but it can be used as a text-face, though it's not optimilazied for that. "I think your upper- and lowercase S need some work - letters like a, p, q, and so on are very smooth, in a way reminiscent of Myriad, but the S's seem to have slightly harsher curves, with proportions a little closer to FF Meta." I hadn't noticed that. I'll see what I can do about it. "I still think the r doesn't quite match with the font. It just sticks out. Maybe if you made it join the stem lower still, that would help. This would also help it to appear a little more even in text." Working on it. "The breaks in you letters are also a bit inconsistent in that, while some of the letters break in some places, and other letters break in other places, most seem to only have one break." True, but for every glyph I have carefully considered where to put the gaps for a very long time. It might not be very 'logical', but the gaps never seem out of place to me. "The m sticks out a bit because of the two breaks - what would it look like if the middle join smoothly?" I've tried that. Horrible. "The lowercase w has a break, but the uppercase W doesn't?" The W doesn't because it looks a bit out of place compared to the M, I'll have another look at it though. It used to be with a gap in a very early stage. "The line thickness of the W needs work too I think..." That could well be. I think I need a short break from the caps, to get my mind back to blank. "The lining numeral 2 is also needs need some work I think...." True.</p>
      <p>Thanks your help!</p>
