      <p>I will qualify my observations by saying that I am not very experienced with designing typefaces as the lovely folks who already gave suggestions.  I hope it is helpful anyway!</p>
      <p>There seems to be a couple different concepts in terms of how the breaks read:</p>
      <p>- Shadow/depth like A, X, w, x.  I really like the dimensional quality of the cut.<br>
      - Hand written stroke feel like B, D, P, a, b, d.  Maybe like overgrown ink traps.  The stroke is sort of trailing off to a taper.</p>
      <p>I think the difference has a lot to do with how the curved/tapered end of the cut off stroke relates to the straight piece it is approaching.  I personally love the ones that give a 3D effect, and miss it in the rest.</p>
      <p>Hope that helps!</p>
