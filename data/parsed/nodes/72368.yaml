      <p>The curve in the d is indeed sharper than other letters, but I don't cinsider it TO sharp. It can certainly not be like the d because that way the gap between the bottom of the bowl and the stem would become to small. Thanks for telling me this though. Maybe I should have another look at it.</p>
      <p>I already changed the j, but it seems a bit useless to upload a new picture for one thing.</p>
      <p>You're probably right about the y, so I'll have to find another way of getting the right colour. There has to be a contrast within that stroke. Any suggestions?</p>
      <p>The right half of the m is indeed smaller. I thought the differnece was to small to make a difference, but while working on Expletus Serif I realized it does make a difference. In the w the left part is clearly narrower, but the gap creates whitespace, although I'm not sure if that's enough. I think I'll move the left and right part in the w apart and make the stroke that 'creates' the gap longer.</p>
