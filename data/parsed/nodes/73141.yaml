      <p>Probably not, but only because I think you're asking the wrong question for this audience.</p>
      <p>It looks really nice; creative, well-executed, etc, but we'd be more likely to make our own than to buy one. Your sales target is of people who are less likely to have the talent or know-how to do create a card themselves. Maybe a more appropriate question would be "Is this worth selling on etsy?".</p>
      <p>Yes. Definitely.</p>
