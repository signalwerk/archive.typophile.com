    <p>This is a birthday greeting card I have recently designed for my sisters birthday. After it's success in my family I have decided to screen print copies in black and red as below, possibly variations using other colours too, which I will then put up for sale on <a href="http://www.etsy.com" title="www.etsy.com">www.etsy.com</a> at a price of £4.00 or there about.</p>
    <p>Before I do this though I wanted to get your opinions, would you buy this greeting card for a friend or family? (The small type in the corner of this card would not be included as it was specific to my sister's birthday only).</p>
    <p>Let me know what you think :)</p>
    <p>(Note: the small tear on this card would not happen when silk screened, it was due to hand crafting the red using masking tape and acrylic)</p>
