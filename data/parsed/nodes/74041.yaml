    html: |-
      <p>When I think of ginger, I think it's pretty organic--not in the fluid art nouveau line sense, but it does grow in a way that doesn't remind me of the latest stuff.</p>
      <p>It's also textured and bumpy, and has rings along its root sort of like a bamboo stalk does.</p>
      <p>Either way the client wants what they want--but I can imagine modern simplistic still being organic, instead of  almost so industrial as to use the square as you have in the latest example...which is why I think the leaf seems like so much of an after thought (its forms don't at all correspond to the letters').</p>
