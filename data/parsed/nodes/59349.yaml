      <p>I think people generally have this strange idea:</p>
      <p>“These IT/ softwares companies (Microsoft, Apple and “the likes”) as well as those in the entertainment industry (Music, movies, Hollywood and the celebrities) make tons of money anyway, so it won’t harm them if I don’t spend an extra $150 to download their product. What’s wrong with rich people like them to spare a poor guy like me?”</p>
      <p>Unfortunately, people also wrongly identify the font design industry as one of those who makes tons of money, since most people don’t have a clue about font design business and they think that anything to do with IT business make lots of money. </p>
      <p>I know at least that is the mentality of many who lives in this part of the world- ASIA, where piracy are rampant!</p>
      <p>Legal enforcement and education from the government sometimes help in my country. </p>
      <p>weng</p>
