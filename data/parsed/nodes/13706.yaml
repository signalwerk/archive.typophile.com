    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Nicholas&nbsp;Jenson</strong></p>
    <p>Typefounder, born <a href="/node/add/wiki?edit%5Btitle%5D=1420" title="Create node &quot;1420&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1420</a> in <a href="/node/19576" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">France</a>.</p>
    <p>During the <a href="/node/add/wiki?edit%5Btitle%5D=1450s" title="Create node &quot;1450s&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1450s</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Charles%20VII" title="Create node &quot;Charles VII&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Charles <span class="caps">VII</span></a> sent Nicholas Jenson to <a href="/node/20912" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mainz</a>, <a href="/node/19574" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Germany</a> to learn the art of printing. There he became an apprentice to <a href="/node/13707" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Johann Gutenberg</a>.</p>
    <p>After a nasty civil war in <a href="/node/add/wiki?edit%5Btitle%5D=1462" title="Create node &quot;1462&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1462</a>, most of Mainz’s printers left the city. Many of them travelled to <a href="/node/19599" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Italy</a>, including Jenson—who ended up in <a href="/node/add/wiki?edit%5Btitle%5D=Venice" title="Create node &quot;Venice&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Venice</a> before <a href="/node/add/wiki?edit%5Btitle%5D=1470" title="Create node &quot;1470&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1470</a>. There, he cast his famous type, which might be the first non-<a href="/node/12128" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Blackletter</a> type ever cast in the&nbsp;west.</p>
    <p>Jenson died in <a href="/node/add/wiki?edit%5Btitle%5D=Rome" title="Create node &quot;Rome&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Rome</a> in <a href="/node/add/wiki?edit%5Btitle%5D=1480" title="Create node &quot;1480&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1480</a>.</p>
    <p>Most typefaces that are named after Jenson bear little or no relation to his work. However, <a href="/node/16736" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bruce Rogers</a>’ <a href="/node/add/wiki?edit%5Btitle%5D=Centaur" title="Create node &quot;Centaur&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Centaur</a> comes very close to capturing its&nbsp;spirit.</p>
