    <p>Jenson died in <a href="/node/add/wiki?edit%5Btitle%5D=Rome" title="Create node &quot;Rome&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Rome</a> in <a href="/node/add/wiki?edit%5Btitle%5D=1480" title="Create node &quot;1480&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">1480</a>.</p>
    <p>Most typefaces that are named after Jenson bear little or no relation to his work. However, <a href="/node/16736/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Bruce Rogers</a>’ <a href="/node/add/wiki?edit%5Btitle%5D=Centaur" title="Create node &quot;Centaur&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Centaur</a> comes very close to capturing its&nbsp;spirit.</p>
