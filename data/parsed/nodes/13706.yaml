    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Nicholas Jenson</strong></p>
    <p>Typefounder, born <a href="/wiki/1420" class="freelinking" rel="nofollow">1420</a> in <a href="/wiki/France" class="freelinking" rel="nofollow">France</a>.</p>
    <p>During the <a href="/wiki/1450s" class="freelinking" rel="nofollow">1450s</a>, <a href="/wiki/Charles%20VII" class="freelinking" rel="nofollow">Charles VII</a> sent Nicholas Jenson to <a href="/wiki/Mainz" class="freelinking" rel="nofollow">Mainz</a>, <a href="/wiki/Germany" class="freelinking" rel="nofollow">Germany</a> to learn the art of printing. There he became an apprentice to <a href="/wiki/Johann%20Gutenberg" class="freelinking" rel="nofollow">Johann Gutenberg</a>.</p>
    <p>After a nasty civil war in <a href="/wiki/1462" class="freelinking" rel="nofollow">1462</a>, most of Mainz's printers left the city. Many of them travelled to <a href="/wiki/Italy" class="freelinking" rel="nofollow">Italy</a>, including Jenson—who ended up in <a href="/wiki/Venice" class="freelinking" rel="nofollow">Venice</a> before <a href="/wiki/1470" class="freelinking" rel="nofollow">1470</a>. There, he cast his famous type, which might be the first non-<a href="/wiki/blackletter" class="freelinking" rel="nofollow">blackletter</a> type ever cast in the west.</p>
    <p>Jenson died in <a href="/wiki/Rome" class="freelinking" rel="nofollow">Rome</a> in <a href="/wiki/1480" class="freelinking" rel="nofollow">1480</a>.</p>
    <p>Most typefaces that are named after Jenson bear little or no relation to his work. However, <a href="/wiki/Bruce%20Rogers" class="freelinking" rel="nofollow">Bruce Rogers</a>' <a href="/wiki/Centaur" class="freelinking" rel="nofollow">Centaur</a> comes very close to capturing its spirit.</p>
