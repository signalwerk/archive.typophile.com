      <p>Of the currently posted logos, I think the last works best. The inverted V looks rather roof-like. But you could drop the dots on the i's and lower that graphic element in its place. Make it sub in for the dots a little. Then it will be more integral to the logo, feel more stable, and will look less like a face.</p>
