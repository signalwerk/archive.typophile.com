    html: |-
      <p>Of course the triangle is playing on the initial "v". But your job as a designer isn't primarily to make up rationalizations for your designs, but to try and strip your eye naked and see if the shapes themselves work, and what kind of effect they have on a subconscious level. Inverted triangles are unstable shapes pointing downwards, and they're going to exude that – even if they're just supposed to be "v"s. :)</p>
      <p>For the record, I actually really like the skyline in the inverted triangle – it'd make a cool t-shirt motif or something, or a nice stencil :-&gt;. Nice urban feel. I'm just not sure that for this logo, it communicates what you need it to communicate. (Maybe I'm wrong, but right now in the housing market, wouldn't stability and reliability be super-important qualities to communicate?)</p>
    html_clean: |-
