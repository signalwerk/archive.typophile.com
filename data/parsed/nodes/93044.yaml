      <p>blokland — I generally avoid upgrading unless I absolutely have to, especially if I have a stable workflow figured out. It's my own fault that I upgraded Glyphs without waiting to see if anyone had issues with the latest version, but it's a relatively new application with a small user base. Next time I will ask first.</p>
      <p>mekka — I might end up going that route. Plus I'd rather support developers directly. I did delete the preferences. In fact, I deleted everything Glyphs related and reinstalled from scratch. I'm still wondering if updating the application to 64-bit is for some reason causing problems for me. I'm on an old(er) iMac but the specs should be supported. I'll try setting up another user account to see if that helps. Thanks.</p>
