    html: |-
      <p>It can help in these cases to have multiple operating systems on your system, so that if something does not work on a particular system, you can try another one. Personally I prefer virtual systems under <em>VMware Fusion</em>, <em>Parallels Desktop</em>, and <em>VirtualBox</em>. Virtual systems provide an easy way to run different (versions of) operating systems for speciﬁc tasks and, of course, for testing. If a system is compromised, one throws it away and makes a copy of a clean basis again for further development. The server versions of Mac OS X work ﬁne under forenamed applications, as do Linux distros and Windows versions.</p>
      <p>Another option is to add an external 1TB hard disk, to make for instance four partitions on it, and to install an OS X version on one of the partitions. A program like <em>SuperDuper</em> can be used then to make a bit-for-bit copy from the clean base version on the other partitions for speciﬁc tasks. You can select a partition as start-up disk then. If a partition is compromised, the clean basis can be copied to it again. As far as I know, this is allowed by the OS X EULA.<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;I would be a bit careful with running applications from other partitions though, because I encountered problems with some frameworks in the past.</p>
      <p>To be honest, I never underst00d why people per se want to update their systems to the latest version. If things work ﬁne, leave them as they are. If there is speciﬁc stuff only available for a new operating system, install it for instance on an external drive, like described above. If one buys new hardware and one’s workﬂow functions ﬁne on the older system, keep the older system besides the new one. If an older app is not up-to-date anymore for speciﬁc tasks, look for a program that can add this functionality to the workﬂow. If there is older software running faultlessly on older hardware, buy this hardware second-hand, because it doesn’t cost much. There is no tax on the number of computers one owns (not yet, that is), you know.</p>
      <p>Communications between older and newer systems can sometimes ask for some inventive solutions though, especially when support for older protocols like AppleTalk is dumped.</p>
      <p>FEB</p>
