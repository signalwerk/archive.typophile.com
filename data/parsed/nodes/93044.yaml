      <p>A problem with the App Store is that updates take quite some time, i.e. until Apple approves it. That’s why I suggest buying Glyphs directly from Georg. Send him an e-mail, explain your woes and ask him if you can crossgrade for free to a regular (i.e. non-AppStore) license.</p>
      <p>About the crashes: Weird. I haven't had such problems. Tried deleting the preferences or running it in a different user?</p>
