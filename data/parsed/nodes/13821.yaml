    <p><strong><a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Geofroy Tory</strong></p>
    <p>(also Geoffroy Tory)<br>
    French. 1480-1533</p>
    <p>Geofroy was a illustrator, type designer, printer, and author in France during the Renaissance. He was heavily influenced by Italian designers and helped bring their Roman letterforms and design sensibilites to France. He worked in the printing offices of Henri Estienne and Simon de Colines.<br>
    Tory gained much acclaim with his popular design of a set of adornate capital initials with intricate floral patterns. He wrote and illustrated <cite>Champ Fleury</cite>, a monumental work first published in 1529. The three volume book described the history of roman letters, their proportional relationship to the human figure (like the writings of <a href="/wiki/Albrecht%20Durer" class="freelinking" rel="nofollow">Albrecht Durer</a> which he dismisses as the work of a <em>painter</em>), and a geometric system for their construction. In 1530, he was named the official printer to the king by Francis I.</p>
