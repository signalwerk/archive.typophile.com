    html: |-
      <p>That's it Bob! The rubber stamps Harold Lohner used for Artistamp Medium<br>
      <a href="http://www.identifont.com/similar?KHJ" title="http://www.identifont.com/similar?KHJ">http://www.identifont.com/similar?KHJ</a><br>
      look like they were based on a condensed version of the circa 1900 De Vinne design, with the R and Q edited to be less floppy.<br>
      For a digital variation of condensed De Vinne with smooth letters see Hawthorne:<br>
       <a href="http://www.identifont.com/similar?6EF" title="http://www.identifont.com/similar?6EF">http://www.identifont.com/similar?6EF</a><br>
      A regular width version of DeVinne was recently digitized by Jeff Levine as Publication:  <a href="http://www.myfonts.com/fonts/jnlevine/publication/" title="http://www.myfonts.com/fonts/jnlevine/publication/">http://www.myfonts.com/fonts/jnlevine/publication/</a><br>
      Also De Vinne from wooden type fonts:<br>
      <a href="http://www.myfonts.com/fonts/woodentypefonts/de-vinne/" title="http://www.myfonts.com/fonts/woodentypefonts/de-vinne/">http://www.myfonts.com/fonts/woodentypefonts/de-vinne/</a><br>
      For a rubber stamp treatment of the wider width of De Vinne see Harold Lohner's Hand Stamped JNL:<br>
      <a href="http://www.myfonts.com/fonts/jnlevine/hand-stamped/" title="http://www.myfonts.com/fonts/jnlevine/hand-stamped/">http://www.myfonts.com/fonts/jnlevine/hand-stamped/</a><br>
      The De  Vinne typeface has been discussed many times before at typophile, most recently at:<br>
      <a href="http://typophile.com/node/104584" title="http://typophile.com/node/104584">http://typophile.com/node/104584</a><br>
      Don</p>
