      <p>Just a note that <a href="http://fontsinuse.com/typefaces/7888/de-vinne" rel="nofollow">De Vinne</a> had an alternate ‘R’ without a descending leg. Here are both forms in the <a href="https://archive.org/stream/1923AmericanTypeFoundersSpecimenBookCatalogue/1923ATFSpecimenBook#page/n351/mode/2up" rel="nofollow">1923 ATF catalog</a>:</p>
