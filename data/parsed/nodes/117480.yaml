    html: |-
      <p>I spent a lot of time searching for this. I searched Dafont and AbstractFonts - no luck. None of the usual ID tools came even close, and keyword searches at MyFonts came up with some similar ones, but no matches. Similar, but not quite as random-looking: <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/paquita-pro/?refby=bowfin" rel="nofollow">Paquita</a>; <a class="freelinking external" href="http://www.myfonts.com/fonts/hipopotam/mrs-ant/?refby=bowfin" rel="nofollow">Mrs Ant</a>; and <a class="freelinking external" href="http://www.myfonts.com/fonts/tart-workshop/bookeyed-martin/?refby=bowfin" rel="nofollow">Bookeyed Martin</a>.</p>
      <p>My guess is that this may be a custom made font, which anyone with no lettering skill and about $10 could create.</p>
      <p>- Mike Yanega</p>
