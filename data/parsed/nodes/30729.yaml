      <p>"why not make my design out of TNR or Arial because they are “free.”?</p>
      <p>It's a valid question.</p>
      <p>In the end, the typeface is an integral part of their visual identity. If they value that, then they should be able to accept the typeface as part of the overall package.</p>
      <p>"Would I purchase a simple liscense to use a face for a logo? And then have to purchase multiple liscenses for each respective employee to use for the designed stationary, etc.?"</p>
      <p>You'd have your own license to create the logo. Once created, however, the logo is then just a piece of art that anyone in the company should be able to use.</p>
      <p>If you are using a specific typeface for the stationery other than the logo, then yes, whoever is in charge of creating and updating the stationery would also need a license of the typeface.</p>
