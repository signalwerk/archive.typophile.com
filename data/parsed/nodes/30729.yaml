    <p>So ive started on two major identity projects. (major on my scale, which is probably small). . . </p>
    <p>Im well versed on the design process, etc. But my real question comes to typeface choice. Ive built a good collection of fonts purchased from various vendors, however there are cases when I just dont have something that fits. My clients know nothing of fonts, or the importance of them. I have tried to explain liscensing and the general design and language of typefaces all to no avail. Both client have simply said why not make my design out of TNR or Arial because they are "free." </p>
    <p>I sample various fonts from vendors and the clients are displeased with the quality and leave the conversation with an "I dont know" show me something high quality. . . Pain.</p>
    <p>Any tips on how to convince a client about selecting a nicely fitting and desinged face?<br>
    Am I barking up the wrong tree and should I bite the bullet in the name of good design, and hope that Ill have a client willing to explore next time?</p>
    <p>My final question is regarding the purchase of a face for an identity. </p>
    <p>Would I purchase a simple liscense to use a face for a logo? And then have to purchase multiple liscenses for each respective employee to use for the designed stationary, etc.?</p>
    <p>Cheers</p>
    <p>James</p>
