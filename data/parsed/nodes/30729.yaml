      <p>Now, now, here's how you do it.</p>
      <p>First, you do <em>exactly</em> what the client wanted.</p>
      <p>Second, do a second design: your take on it. Go the extra mile. Make it amazing.</p>
      <p>When presentation time comes, present the former design first, then the latter. Finally, compare and contrast the two, in which you'll present a persusive reasoning on how the second design will work better for the client than the first.</p>
      <p>Most of the times, it takes a bad design to make the good one shine.</p>
      <p>Good luck!</p>
