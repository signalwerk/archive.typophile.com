      <p>Try pointing out, in the most diplomatic way possible, that they hired you to give their corporation a distinct identity and that, as Patty has pointed out, there is nothing distinct about TNR or Arial. If this doesn't work you can follow up with something along the lines of “Well, since you clearly have concluded that you don't want an identity, there's nothing more I can do for you, so I'll be keeping my deposit and ceasing work on this contract.” At least you can if your contract allows for that and if you got a deposit.</p>
      <p>Also, have you tried putting together a Paul Rand style book that shows the type, the logo, and the colors, all with a flowing written explanation? You'll have a lot more luck that way, because then they'll feel like they're reading this stuff, learning, and coming to a conclusion on their own, as opposed to just being told what to think. I just got a copy of the book Rand did for NEXT, if you want I'll scan it for you.</p>
