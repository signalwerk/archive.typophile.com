      <p>TNR and Arial are not just favored because they come pre-installed on every Windows and Mac PC, they also perform well on screen at small sizes, and have huge international character sets. Replicating the hinting quality and char set in a commercial or even custom font is difficult and expensive. I've heard stories of several very large international companies balking at the cost of extending their shiny new corporate fonts to the required char set and level of hinting required by their "peons". </p>
      <p>So rather than fight the system work with it. Look at the commonly installed fonts say the Web fonts - Georgia is nice ;-) - or maybe Palatino Linotype, and build a logo and identity that works with them.</p>
