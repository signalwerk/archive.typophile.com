      <p>I'm guessing you're still a little green because presenting "too may options" is a rookie mistake. :) Lord knows I've made it. Don't overplay your hand.</p>
      <p>Lastly, piggybacking off Joe's comment. I <strong>highly</strong> recommend changing the name of this thread. All your employers have to do is Google your name and they can find this thread.</p>
