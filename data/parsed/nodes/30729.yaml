      <p><em>TNR and Arial are not just favored because they come pre-installed on every Windows and Mac PC, they also perform well on screen at small sizes, and have huge international character sets.</em></p>
      <p>Simon, I know you're biased, but let's get real here. There is <em>nothing</em> unique about system fonts. When a font becomes a system font, it becomes the very opposite of the word, because <strong>everyone</strong> has it. This has nothing to do with the care, skill or design that has gone into it. The above examples also have the honor of being overused in the corporate world.</p>
      <p>James, one way to convice them is to design your logo with whatever typeface you want and then show it to them using Comic Sans, Sand (or any other typeface that is completely different) and see how they react. They'll probably realize they notice type more than they thought.</p>
