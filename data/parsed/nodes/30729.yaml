      <p>You could start by not calling them peons. (We've been asked to remove posts from designers who's clients didn't like what was being said about them.)</p>
      <p>Instead of groaning and moaning just remember that you're part designer and part salesman (salesman of your ideas). The design process is work, no matter who your client is. Design savvy clients require just as much, if not a lot more, work than unsophisticated clients. The end result with a savvy client usually ends up being a lot better work, however. </p>
      <p>Portfolio counts, especially when you're starting out, but what will reward you in the long run is happy clients. So, you've got to gently educate them, without belittling them. Explain that you're upgrading them from Men's Wearhouse to Macy's or from Hyundai to Honda, or whatever anology works. And if you must go with a *free font, don't give in to TNR, Arial or Comic Sans.</p>
      <p>* These fonts aren't free, they're just licensed, subsidized, by the big OS makers.</p>
    html_clean: |-
