      <p>James,</p>
      <p>I'm with Joe. But I feel your pain, particularly since it's hard to spec fonts when you don't own them. Sometimes it's a matter of having a sit-down with them and explaining the reason for using a non-typical font. It's hard to make someone care about the finer points of fonts, so know your battle before you go into it and be armed with a solid reason. Make it matter to them. Don't explain historical models, explain direct benefits: saving space, market disctinction, legibility, reader impact.</p>
      <p>Maybe this is all repetition of stuff you know. I find that large samples printed from the font testers that most foundries offer work the best. Select three, create a compelling 20-second explanation of the benefits of each, get their reaction. Then, repeat with a more narrowly selected bunch. You have the power to control what fonts they see and the power to shape their understanding. Don't worry about showing them extensive text settings. Sell them on what YOU know, not what THEY see. If need be, try to find a PDF with a high-res sample to supplement.</p>
      <p>At least, this is how I go about it.</p>
      <p>Oh, also consider differentiating between internal memos and external communications. Sometimes only the marketing group/designers need the unique font, allowing them to use a font from the default set for the majority of their users.</p>
    html_clean: |-
