      <p>So here's some advice that may sound weird and not so fun. I think you might need to lay low. A creative person stepping into a lion's den with business executives is almost always going to have the chips stacked against them. You should think about playing their game— print a memo with a well crafted explanation and/or examples to illustrate your point. If you try to rock the boat too early, you may come off like a newbie who is not realistic and doesn't understand the game.</p>
      <p>I'm guessing you're still a little green because presenting "too may options" is a rookie mistake. :) Lord knows I've made it. Don't overplay your hand.</p>
      <p>Lastly, piggybacking off Joe's comment. I <strong>highly</strong> recommend changing the name of this thread. All your employers have to do is Google your name and they can find this thread.</p>
