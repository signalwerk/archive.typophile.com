    <p>This font is based upon early 20th century "Business Penmanship." Since there are few monoline, semi-casual, connected scripts out there I believe this font could fill a gap.</p>
    <p>The lowercase is still rough, but so far it is looking promising.</p>
    <p>I'm planning on including OpenType features such as ligatures, swashes, and alternates.</p>
    <p>Any comments?</p>
