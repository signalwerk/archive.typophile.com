      <p>It looks good! But as you might experienced it's very difficult to connect letters with round terminals without overlap. With the use of ligatures you can both avoid this problems and add a more idiosyncratic look to the typeface.</p>
      <p>Just an idea.</p>
      <p>Dino</p>
