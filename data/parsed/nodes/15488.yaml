    <p><a href="http://www.typesociety.org" target="new" rel="nofollow">The Society of Typographic Aficionados</a> (SOTA) will present its eighth annual conference in Beantown next summer. There will be a <a href="http://www.typecon.com" target="new" rel="nofollow">TypeCon2006</a> planning meeting on Tuesday, October 11, 2005, in the Boston area (Woburn). Join us for a big brainstorm, and to make fun of how a Left Coaster pronounces Worcester and Gloucester.</p>
    <p>MEETING DETAILS:<br>
    <strong>Tuesday, October 11, 2005 / 7 pm</strong></p>
    <p>Monotype Imaging<br>
    500 Unicorn Park Drive, Second Floor<br>
    Woburn, MA 01801</p>
    <p><a href="http://maps.google.com/maps?q=500+Unicorn+Park+Drive,+Woburn,+MA+01801&amp;spn=0.029224,0.060828&amp;hl=en" target="new" rel="nofollow">Google Marks the Spot!</a></p>
    <p>Exit 36 (Montvale Ave.) off Route 93<br>
    Unicorn Park Drive is the first street east of Route 93<br>
    500 Unicorn Park is the last building before the Marriott Hotel</p>
    <p><em>Refreshments will be served!</em></p>
    <p>Feel free to invite friends and colleagues in the Boston area who might be interested. Please email <em>info /at/ typesociety.org</em> to chat about TypeCon2006, and to RSVP to the meeting (we need to know how many cookies to buy).</p>
    <p>If you can't make it to this meeting, but would like to be involved, send an email.</p>
