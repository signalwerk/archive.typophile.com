      <p><em>did he realize this was not a film about a typeface, but about a commentary about the design and cultural landscape we live in (and that we are products of)?</em></p>
      <p>i'm sure Gary could answer for himself, but from what I got out of his Q&amp;A here in Buffalo, he meant for this film to be a survey of the last 50 years of graphic design, and Helvetica happened to be the vehicle to tell this story. quite ingenious, i think: more interesting than a film only about a single typeface.</p>
