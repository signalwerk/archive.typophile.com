    html: |-
      <p>Good question.<br>
      My case will not be typical, since I never had a formal introduction<br>
      to Helvomi... uh, Helvee... uh, Helvetica. In fact it's interesting<br>
      that I had any reaction to it at all, since the first time I consciously<br>
      thought about its [de]merits I really had a weak grasp of typography.<br>
      But over time my feelings haven't changed in essence: starting out<br>
      with an intuitive unease about it, I've now elaborated my opinions<br>
      with a more studious grasp of what's wrong with it.</p>
      <p>BTW, I was also very pleasantly surprised by the movie.<br>
      Gary has done an amazing job conveying a balanced but<br>
      nonetheless passionate story.</p>
      <p>hhp</p>
