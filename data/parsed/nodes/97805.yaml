    html: |-
      <blockquote><p>For some reason Typophile is adding its own URL and wiki address</p></blockquote>
      <p>Herb — IIRC, your original link (which you’ve now deleted, it appears) used the shortcut method, but without an “http://” protocol expressly included. Without that, the shortcut algorithm assumes it’s an internal link. And when it doesn’t find anything, it appends the string to a generic Wiki address.</p>
      <p>By giving the address as plain text in your second post, the system picks up on the “www” and automatically converts this to an external link, adding the protocol as needed.</p>
      <p>HTH.</p>
