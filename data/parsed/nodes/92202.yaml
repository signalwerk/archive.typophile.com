      <p>Thank you nick.<br>
      My approach is more in terms of  understanding the construction (and evolution) of type specimens in different periods, not the types themselves.<br>
      The article  <a class="freelinking external" href="http://blog.eyemagazine.com/?p=5202" rel="nofollow">Specimaniac. In praise of type specimens, old and new, with Veer’s Joe Newton</a>  is good, but not to deep...</p>
      <p>For example, the actual type specimens:<br>
      show off all of the characters in the set, and OT features, the typeface set in a realistic way somewhere so we can see how it will look like when they go to use it in "real world" setting, etc. </p>
      <p>Or even the Internet typessetters software as type specimens  ...</p>
      <p>What different types of type specimens can we see during History...</p>
      <p>António</p>
