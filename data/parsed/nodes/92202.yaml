    <p>Hi everyone!</p>
    <p>I'm doing a research about the importance of typeface specimens for designers throughout History.<br>
    I found some books (like <a class="freelinking external" href="http://books.google.pt/books?id=AHq-uK6F-PUC&amp;printsec=frontcover&amp;hl=pt-PT&amp;source=gbs_ge_summary_r&amp;cad=0#v=onepage&amp;q&amp;f=false" rel="nofollow">Typographic Specimens: The Great Typefaces</a> ) and articles (like <a class="freelinking external" href="http://www.alistapart.com/articles/real-web-type-in-real-web-context/" rel="nofollow">Real Web Type in Real Web Context</a>) and some posts here in Typophile like:<br>
    <a class="freelinking external" href="http://typophile.com/node/27291" rel="nofollow">http://typophile.com/node/27291</a><br>
    <a class="freelinking external" href="http://typophile.com/node/52442" rel="nofollow">http://typophile.com/node/52442</a></p>
    <p>But, can anyone point out some more?<br>
    Thank you in advance.<br>
    António.</p>
