    html: |-
      <p>Because specimens generally accord equal status to all a foundry’s products.<br>
      And because extant specimens do not represent all foundries.<br>
      The types that are most culturally signiﬁcant, being most representative of a time and place, i.e. those which were most popular, do not necessarily correspond to what one ﬁnds in the specimens in libraries.</p>
      <p>It’s much harder to write a type history from commercially produced documents (trade set), because it requires much forensic expertise and effort in identifying the types.<br>
      As an aside, here is the earliest trade use of a sans of which I am aware:<br>
      <a href="http://pinterest.com/pin/49539664621179232/" title="http://pinterest.com/pin/49539664621179232/">http://pinterest.com/pin/49539664621179232/</a><br>
      Compare with the best-known ﬁrst sans, the 1816 Caslon, which has never been seen “in the wild”.</p>
