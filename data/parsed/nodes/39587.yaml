    <p>Hi everyone,</p>
    <p>I know this is going to sound completely ridiculous, but I have lost and forgotten the typeface I use for my own logo on my website. Yes, yes I know, more organization is in order. I have started cataloging all my fonts since, but I cannot remember what the name of this font is called. It was a free font, and I believe I got it from dafont.com, but after search for about an hour I could not find it again.</p>
    <p>Does anyone happen to know the name of this font. It's characteristic is that it has those square boxes below some of the letters.</p>
    <p>Thanks,</p>
    <p>James</p>
    <p>Edit: It seems I'm having issues uploading my 3kb gif, so here is a direct link to the font reference I am speaking of:</p>
