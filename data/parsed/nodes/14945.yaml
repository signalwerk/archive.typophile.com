      <p>Tim, your suggestion of Macrame Super Triline from Blue Vinyl Fonts is pretty darn close.</p>
      <p>I had glanced through a few samples I have from Photolettering, Inc., VGC and Solotype. All had offered many variants on the Prisma/Prism/Prismatic style of multiple inlines, tri-lines, etc.</p>
      <p>None of them were an EXACT match.</p>
