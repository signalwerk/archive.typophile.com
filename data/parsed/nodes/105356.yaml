      <p>Should be <a class="freelinking external" href="http://www.myfonts.com/WhatTheFont/forum/case/304329" rel="nofollow">Marriott Bold</a>, Marriott Hotels &amp; Resorts <a class="freelinking external" href="http://www.myfonts.com/WhatTheFont/forum/case/16926" rel="nofollow">exclusive typeface</a>.<br>
      Other alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/ocean-sans-mt" rel="nofollow">Ocean Sans</a> (Extended Bold comes very close), <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/cronos" rel="nofollow">Cronos</a> (Display Bold)</p>
