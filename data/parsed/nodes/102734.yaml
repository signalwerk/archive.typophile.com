      <p>Sorry, can't identify them, possibly even hand-drawn to me. Some alternatives though.<br>
      CLARK &amp; CO.'S: part of oblique cut terminals, reminds me of <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/trade-gothic" rel="nofollow">Trade Gothic Condensed</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/urw/alternate-gothic" rel="nofollow">Alternate Gothic</a>. Some I like: <a class="freelinking external" href="http://www.myfonts.com/fonts/fontboutique/noga" rel="nofollow">Noga</a> (/C to be customized), <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/din-next" rel="nofollow">DIN Next Condensed</a> (/S off), <a class="freelinking external" href="http://www.myfonts.com/fonts/parachute/pf-din-text-comp-std" rel="nofollow">DIN Text Compressed</a> (/S off), <a class="freelinking external" href="http://www.myfonts.com/fonts/fsd/pragmata-pro" rel="nofollow">Pragmata</a> (/A, /R and /K off but not hard to customized), CA <a class="freelinking external" href="http://www.myfonts.com/fonts/capearcona/ca-geheimagent" rel="nofollow">Geheimagent</a> (too squared but nice vintage feeling), <a class="freelinking external" href="http://www.myfonts.com/fonts/capearcona/ca-bnd" rel="nofollow">BND</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/capearcona/ca-no-dr" rel="nofollow">No Dr.</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/capearcona/ca-cula" rel="nofollow">Cula</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/capearcona/ca-airespro" rel="nofollow">Aires</a><br>
      SEWING COTTON: <a class="freelinking external" href="http://www.myfonts.com/fonts/scriptorium/hamilton" rel="nofollow">Hamilton</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/baselinefonts/antimony" rel="nofollow">Antinomy</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/juan-jose-lopez/ultramarina" rel="nofollow">Ultramarina</a></p>
