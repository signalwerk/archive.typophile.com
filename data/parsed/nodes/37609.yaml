  html: |-
    <p>I'm currently working on a project in the natural health industry. My client is really in love with the font Papyrus. I'm hesitant to use this typeface because I feel like it has been overused in this industry. Can anyone think of any alternatives that share a similiar  essence of this font?</p>
    <p>Thanks,<br>
    Baskervillebold</p>
