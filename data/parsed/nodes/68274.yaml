  html: |-
    <p>Can anyone help me identify this beautiful VU Magazine cover font? Looks like Parisine, but I think it's other font...</p>
    <p>Beautiful swashes on the "U", "M" and "A" letters! Note also the inktrap on that "M"!</p>
    <p>Does anyone know?</p>
    <p>The link for the photo is this:<br>
    <a href="http://www.lastfile.com/wp-content/uploads/2008/06/couv_home.jpg" title="http://www.lastfile.com/wp-content/uploads/2008/06/couv_home.jpg">http://www.lastfile.com/wp-content/uploads/2008/06/couv_home.jpg</a></p>
    <p>Thank you!</p>
