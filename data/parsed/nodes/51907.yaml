  html: |-
    <p>Hey Gang,</p>
    <p>Fontalicious is finally back up on the interweb thanks to the boys at Font Bros.</p>
    <p>Over the next few months, we'll be rolling out a cornucopia of delicious new typefaces for you to enjoy! Come check out the latest batch today. Some are free, some not so free!</p>
    <p>Here's a little list to get you started:</p>
    <p>Wordsworth- Is it handdrawn? Is it vintage? Is it free? These questions can be answered by clicking on the font link!</p>
    <p>Blonk is fat and trendy, Blingo is the closest thing to owning millions of dollars worth of blood diamonds, except for without the blood and without the diamonds!</p>
    <p>Gringo is a chubby little squatty cartoony body, and Brute is just like it sounds- rugged and smooth.</p>
    <p>Kravitz Rounded is a newer, rounder version of Kravitz family, hence the name.</p>
    <p>Der Weiner Stentzel is a new twist on an old fave- GO FOR IT!</p>
    <p>A few other new fonts to be introduced in the next few days, just getting all the curtains dusted off first.</p>
    <p><a href="http://www.fontalicious.com" title="http://www.fontalicious.com">http://www.fontalicious.com</a></p>
    <p>Welcome back!<br>
    Ben</p>
