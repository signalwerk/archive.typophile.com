    html: |-
      <p>More praise for condoms:</p>
      <p>Condoms reduce the risk of infections, even in monogamous relationships.</p>
      <p>Condoms are the most effective method of family planning. Family planning reduces the drudgery of parents, and increases the life expectancy of women, many of whom would otherwise die of complications from pregnancy or childbirth.</p>
      <p>Large families were worth that risk in the past when infant mortality was higher, but not now.</p>
      <p>Contraception in marriage reduces the danger to mothers of childbirth, and is also more humane than the rhythm method. Even if carefully practised, the rhythm method fails 20% of the time, as ovulation is too variable to predict accurately. Most dangerous, eggs fertilized at the extremities of the fertile period of the menstrual cycle — which is most likely when the method fails — are more prone to non-viable pregnancies, resulting in natural abortion of the foetus. So using condoms is less dangerous. In fact, surgically aborting “condom failures” results in less aborted foetuses than the rhythm method.</p>
      <p>Condoms are also safer than the birth control pill, which has significant side effects.</p>
      <p>Of course, these are statistical arguments based on human behaviour as it mostly is, rather than the way fundamentalists would like us to be.</p>
      <p>BTW, nice font...<br>
      </p><div class="imageWrap"><img src="/files/durex_6445.png"></div><p></p>
