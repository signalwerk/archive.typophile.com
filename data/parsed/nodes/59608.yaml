    <p>"dumbest-moments-in-business"  - <a href="http://finance.yahoo.com/career-work/article/107261/dumbest-moments-in-business-2009-midyear-edition.html?mod=career-leadership" title="http://finance.yahoo.com/career-work/article/107261/dumbest-moments-in-business-2009-midyear-edition.html?mod=career-leadership">http://finance.yahoo.com/career-work/article/107261/dumbest-moments-in-b...</a></p>
    <p>Out of 10, the Tropicana redesign was #2!!</p>
    <p>&gt;&gt;2. Tropicana's Botched Redesign</p>
    <p>Tropicana drinkers, it turns out, are as passionate about packaging as they are about pulp. That's why they rebelled when parent company PepsiCo and consultancy Arnell overhauled the juice line's packaging in January as part of a $35 million branding campaign called "Squeeze." </p>
    <p>Tropicana fans said the simplicity of the new design reminded them of store-brand generics. And who wants to be mistaken for a generic consumer? </p>
    <p>Within a month, the public's flogging by e-mail, phone, and blogs forced PepsiCo to bring back the old straw-in-an-orange cartons. Other parts of the campaign remain, but PepsiCo will probably think twice before it tries updating this icon again.&lt;&lt;</p>
    <p>I'm not so sure I agree. While I understand the connection between the sparser design looking more like generic products, I think generic products are becoming the freeway for cleaner design. Also, if it harkens a generic counterpart, wouldn't you prefer feeling like you've purchased the cheaper product?</p>
    <p>Just a thought.</p>
    <p><a href="http://www.avoision.com/portnoy/images/2009/february/redlineAds_3.jpg" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.avoision.com/portnoy/images/2009/february/redlineAds_3.jpg" rel="nofollow"><img src="http://typophile.com/files/tropicana_6548.jpg"></a></div><p></p>
