  html: <p>Although I've embedded every version of TNR available on my machine in Acrobat-Pro9, it's clear that that PDF representation of TNR 10pt lacks the same solidity/density that it has in MSWord. Tildes, for instance, appear broken, losing the delicate curve. Suggestions?</p>
