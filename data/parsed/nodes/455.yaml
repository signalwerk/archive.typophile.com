  html: '<p>Digital Type Design <br>Summer Institute of Graphic Design <br>Rhode Island School of Design <br> <br>Mondays-Fridays, July 8-19 <br>9am-5pm / 10 Sessions <br> <br>This course is for students and professionals alike who are interested in learning how to create typefaces. Participants learn about the principles of spacing, legibility and letter drawing by creating their own typefaces. The course is taught by Cyrus Highsmith, senior designer at Font Bureau. <br> <br>For more info go to:  <br><a href="http://www.risd.edu/sigds.cfm" target="_top">http://www.risd.edu/sigds.cfm</a></p>'
