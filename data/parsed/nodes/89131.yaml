      <p>Perhaps what Andreas is trying to say is that the research question includes an assumption (the transition) rather than a hard fact. A better question might be: "What was the influence of the cultural and technological changes upon typography from ... to ..."</p>
      <p>A transition over such a huge timespan is a very vague notion. Why not try to be more specific, perhaps by narrowing your focus to a specific region (like Germany or northern Italy) or a narrower timeframe. To make a clean sweep across the whole typographic history seems to invite generalisation, whilst missing the interesting details. Perhaps in your early research you will find such a focus point which interests you in particular.</p>
