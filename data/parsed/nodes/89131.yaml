      <p>Jasper, here is my take on the emergence of the humanist type style:</p>
      <p>“The Italian humanist scholars of the Renaissance cherished the old manuscripts that preserved the classics of ancient Greece and Rome. The grace and legibility of the 9th century Carolingian miniscule hand were especially evident to them, appearing superior to the angular, condensed blackletter that had been, in various forms (quadratus, rotunda, bâtarde), prevalent throughout Europe for several centuries. The scholar-scribes imitated the Carolingian lettera antica in their own writing, calling it the lettera umanistica. The humanist script of Poggio, developed in the early 1400s, was seminal, and a large part of the style that Nicolas Jenson immortalized in his definitive type of 1470. </p>
      <p>“The northern quadratus was the model for the first fifteen years of typography, in Mainz, but it did not survive the trip across the Alps. In Italy, types based on both the rotunda and umanistica were cut, the latter style prevailing under the name “Roman”.<br>
      Although the blackletter had been employed by all Europe, not just in the Germanic north, it came to be known as Gothic because its use continued there long after the rest of Europe had adopted the Roman style.”</p>
      <p>Look at the types of Sweynheym and Pannartz, the “Montane” romans, as these were the first attempts by the new-tech guys from Germany to make type for Italians, a transitional stepping-stone as it were, between Rotunda and Roman.</p>
      <p>Check out the Ratdolt specimen to see examples of the Rotunda style of blackletter.</p>
