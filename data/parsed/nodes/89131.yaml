    <p>Dear typophiles,</p>
    <p>I have to write a history paper for school, on any subject I like. I was thinking to do something typography related, since I think my teacher wil like this, I'm personally interested, and I think it is an underestimated indicator of culture and technology. The paper needs to be very close to the level that is expected at university (footnotes with sources, detailed info, etc.), so I need to pick a topic that has enough available information, in books or on the web. I would like to know what you think of the topics underneath, regarding availability of info and interest. I have to have a focus question eventually, so if anything particular jumps into mind, feel free to share :-)</p>
    <p>- The transition from blackletter to humanist typography.<br>
    - The connection between blackletter typography and germany.<br>
    - The transition (at least partial) from serif to sans-serif.<br>
    - Nazi typography<br>
    - The differences betweem Italian, French, Dutch and English typography during the Renaissance.<br>
    - Any other suggestions?</p>
    <p>I'm not asking you to do my work. I'm merely interested to see if you find any topic particularly suitable for my project. I will also try to publish it on a typography blog, once it's finished.</p>
    <p>Many thanks in advance,<br>
    Jasper de Waard</p>
