      <p><em>Is there such a thing as “the transition from blackletter to humanist typography”? The phrase pretends to be a question, but is in fact an unprooved claim. </em></p>
      <p>It’s a well-known fact.</p>
      <p>Typography in many countries began with blackletter, then changed to roman. Some did it early on in printing history (e.g. England), others later, most notably Germany. For instance, mass-market publications in Germany before WWII generally had fraktur (blackletter) body text. Now they have roman (humanist). Surely you’re not disputing that?</p>
