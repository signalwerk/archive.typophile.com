      <p>'Nazi Typography' is an interesting, if very slippery subject. The highly speculative, and often plain crazy ideas about the choice of letterform might be an interesting subject, although I don't know if there are any proper sources.</p>
      <p>I think an interesting theme might be the social movement of modernism in the period between the wars, combined with the ideas behind the new typography (as proposed by Tschichold), Bauhaus ideals, Futura. This is also interesting as the Netherlands played quite an important part in this, with De Stijl amongst others. I think quite a lot of books are published around this theme.</p>
