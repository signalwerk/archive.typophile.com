      <p>Some help for you <em>1996type</em>, checking where you live and knowing most of the collections of academic libraries in the Netherlands: The easiest way to get Quærendo is the KB in the Hague, since they don't have it in the collection of the Erasmus. They have all writings from Carter, Updike and Morison as well (for Morison about blackletters you should check out his essay collection)</p>
      <p>It isn't for free though and requires a membership, and many of the works are in the protected collection which of course can't be checked out. The membership fee however is extremely low for what is offered, you can pull some long nights there.</p>
      <p>Still, if you want to do research into type, a membership of the KB is mandatory, since they have copies of almost everything (and a lovely reproduction section!)</p>
      <p>But of course that all depends on how much time you can spend on it. The research into the history of printing types can be pretty abstract for those grading a non-academic paper. So a good starting point is probably writing down what you want to research and reflect it to something more graspable (as you said, cultural changes e.g.)</p>
      <p>Good luck!</p>
