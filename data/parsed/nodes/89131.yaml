      <p>“The transition from blackletter to humanist typography” would make the best subject, as there is plenty of reference material about the Incunabula, and you could also determine when the Scandinavian countries, not just Germany, moved from blacklettter to “antiqua”.</p>
      <p>Certain early 19th century Germans, such as Goethe and Grimm (the linguist) favored the antiqua, as well as the Dane Kierkegaard (I discovered this at the ATypI conference in København in 2001). So during the early industrial/revolutionary era in the 19th century there was a progressive trend in “blackletter” Europe—international, intellectual, scientific—that adopted the antiqua.</p>
      <p>You would be able to come to a conclusion with manageable material (and timelines), which I doubt you would with the “Nazi type” meme, which wouldn’t really lead anywhere—the topic of nationalist typography never does, as the conclusion will always be some form of qualified “yes, but…” —in other wordds, you will discover that types have no inherent nationalistic, political, or ideological qualities, these are only acquired by use and association, which is likely to be incidental and caused by non-ideological factors.</p>
      <p>It’s a disappointment to conspiracy theorists and those who believe that biology is destiny, but there is no fascist gene in blackletter.</p>
