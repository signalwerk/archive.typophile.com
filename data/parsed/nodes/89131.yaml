      <p>Jasper, Harry Carter's <em>A View of Early Typography Up To About 1600</em> should be a good start if you are looking for information about the transition from blackletter to serif type styles, especially in 16th century France. Hyphen Press released a new edition in 2002, and it is quite easy to get.</p>
      <p>Since your writing an academic paper, it would also be good to go back and look at what D.B. Updike had to say in <em>Printing Types</em>. While the book can be polemic in many places, it can still be seen as a "foundational text" about the history of of typography. So it should still be consulted, even if certain facts put forward in it have been refuted by later authors and their research.</p>
      <p>I'd put Stanley Morison's writing about blackletter into a similar category. Carter may even reference Morison in his book; I do not have a copy nearby at the moment. But Cambridge has published a two-volume set of most of Morison's writing, so it should not take long to glance through that and see where blackletter comes up. These books are probably available in several Dutch libraries, and you should be able to get them via interlibrary loan.</p>
      <p>Of course, you should also look at what Dutch writers have to say about the matter, too. Noordzij has written about Fraktur in English, in both <em>the Stroke</em> and <em>LetterLetter;</em> I'd assume he's written even more about the matter in the Dutch language. You should also look at the writings of Carter, Morison and Updike's Dutch contemporaries, which include Jan van Krimpen, among many others.</p>
      <p>Getting into a nearby research or University library that has all of the back issues of <em>Quarendo</em> should also be of a big help to you – <a href="http://www.brill.nl/quaerendo" title="http://www.brill.nl/quaerendo">http://www.brill.nl/quaerendo</a></p>
      <p>As a Dutch pupil, I hope that you can use all of these resources for free, even if the Uni libraries might not let you check books out for use outside of their libraries. Good luck!</p>
    html_clean: |-
