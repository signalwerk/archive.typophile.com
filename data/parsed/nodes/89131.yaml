      <p>Thanks a lot Nick! Ever since I've joined typophile, I've enjoyed your ever so accurate typographic essays here. "The transition from blackletter to roman type" was the first on my list for a reason, and you just confirmed my gut feeling. You're completely right on the nazi/nationality thing. I found that it's much harder to come up with a clear (and answerable) focus question for those topics, so that only confirms what you said.</p>
      <p>Even though I instantly believe you when you say there's a lot of info on the incunabula, a quick google search does not really give me what I'm looking for. Let me try to explain:</p>
      <p>Whenever there's a change in typography, I expect a gradual (or sudden with clear cause) change in culture, technology, and/or ideology to be the cause (or effect) of that. Different tools, the getting to know of a new culture, or a mindshift like we saw in the renaissance, for example. These are the things that would make it an interesting topic, not just for me, but for non-typo historians as well. Most webpages simply show a picture of blackletter type, a picture of roman type, a discription of the differences, and the date people started using roman type, without suggesting possible causes/effects, an intermediate style (if there was one?), or more nuanced information on how this new typography spread. I expect to do some of the connecting between typographic info and general historic (culture, technology, etc.) info myself, but it would be really hard without some book, person or work to guide me.</p>
      <p>In other words, do you know a source that describes the TRANSITION (sorry for that) of blackletter to roman typography in a broad way? If a source is simply your memory and historic insight, that would also be great! :-)</p>
      <p>Many thanks! jasper</p>
      <p>ohh btw. I have to confirm with my teacher before I can actually start the project, so don't put too much time in helping me. It might be wasted :-(</p>
