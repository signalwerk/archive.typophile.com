      <p>On "blackletter": this is a very generic name, which is easily misunderstood. There are many different forms, like Schwabacher, Rotunda, Textura. They have different origins, and historically also different uses. </p>
      <p>It was used in Germany longer than anywhere else, but this predates Nazis or Hitler, though of course they also adopted it (being a conservative movement based on germanness). It has more to do with the wave of nationalism that originated in the 19th century. Only here the idea of Blackletter as related to german identity was developed. This culminated in the Nazi period of course, but it isn't something they invented. Hence the term Nazi-Typography is very simplified. </p>
      <p>That Blackletter is now associated with Nazism, as well as hooliganism is to a certain extent true, but this does not mean that Blackletter = Nazi Type. Hitler probably said something on Blackletter (I believe the nazis switched to Antiqua at some time, as the idea came that the blackletter forms might come from the Hebrew letter... So even here the story is not so simple). </p>
      <p>It might still be an interesting topic, but try to be subtle rather than sensational!</p>
