      <p>Nazi typography is still quite interesting, especially seeing the conflicts in aesthetics while the Nazi government was in power. Modern art and sans-serifs were branded un-German, while Hitler disliked blackletter because it didn't fit into his new age. </p>
      <p>However, sans-serifs were not accepted, but still used, especially in the earlier days of the Nazi party. Blackletters were also broadly used until they were called of Jewish origin and banned. Although less research into letterforms, this is an interesting research subject on the use of type in an early visual language. (Which the Nazi's mastered to the extreme by stealing iconic images)</p>
      <p>It also requires less aesthetic knowledge, making the research more accessible for your school (I think at least)</p>
      <p>I believe in Christopher Burke's book about Paul Renner are some nice bits about these issues.</p>
