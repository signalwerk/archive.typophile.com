      <p>@Khaled Hosny:<br>
      <cite>So you think a country where some random guy can take a site down without going to court is a civilised country? pretty barbaric to me.</cite><br>
      While the term "civilized country" was actually being used somewhat in jest, this isn't really vigilante justice.<br>
      In the Western industrialized countries, copyright laws are strictly enforced. Individuals who intentionally violate them are potentially subject to severe legal penalties.<br>
      Internet Service Providers are not held responsible for every web site which they host, because it would be unreasonable for them to inspect each web site for copyright violations. However, they are legally obligated not to be a party to a copyright infringement.<br>
      So it is possible - in the United States, there is a formalized procedure, the DMCA takedown notice, for this - for a copyright owner to advise an ISP that a site which it hosts is infringing one of its copyrights.<br>
      In the United States, under this formal model, the ISP is obligated to pull the site, unless it is willing to accept responsibility itself that the content is not infringing, but the site owner can then deny the infringement. Because of this, there are legal penalties for a false DMCA takedown notice.<br>
      Even where this doesn't exist, normally, one notifies the ISP, they will investigate on their own to ensure the complaint is not frivolous, and if the site is ignoring copyrights, as they are understood in the ISP's country, they will pull it so as not to be a party to an illegality.</p>
