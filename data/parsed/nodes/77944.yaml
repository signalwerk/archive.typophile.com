    <p>I was recently made aware that my single best-selling font, Satisfaction, is being offered as a free download by a site called ffonts.net. Turns out there have been almost 15,000 downloads of it, and I only became aware because one of those people bothered to write and ask if it was okay to use it for free.</p>
    <p>I've tried to contact the people who run the site and ask them to remove it as a free download — it's never been a free font — but they have not responded to multiple emails. Contact and identifying information on their website is very sparse. Does anyone here know anything about the site, and/or know how I can contact them? I hate to get a lawyer involved, but Satisfaction is my main font and I can't afford to watch another 15,000 copies given away for free. My copyright statement is part of the font info, but no one at the website and none of the other thousands of downloaders ever bothered to contact me about it before.</p>
    <p>Aaaargh!</p>
