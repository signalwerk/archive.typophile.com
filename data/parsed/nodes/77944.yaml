      <p>Khaled, you made me remember an eternal question there is in Hermeneutics. Some say that a really clear and obvious rule does not need to be interpreted. But other reply that to judge a rule clear and obvious is already an interpretation –and thus there are no rules immune to interpretation.</p>
      <p>I partially agree with this and, logically, also partially agree with your arguments. Final word must come from legal authorities and ISPs aren't them. But I still think that some situations can (and must) receive immediate solution.</p>
      <p>A simple example: drugs based on isotretinoin can cause severe damage in fetuses and are sold under close control in many countries. Let's say I am an ISP and a site hosted by me is announcing direct sales of isotretinoin, without Physician prescription nor any kind of origin control. Someone notice me about this and I verify this is true -it's published on the site. Must I wait for a judge manifestation or is prefereable to shutdown the site immediately?</p>
      <p>This is a situation I call indisputed and clear.</p>
      <p>Or let's say a site hosted by me is delivering free fonts. Someone notice me one of the fonts is his property and cannot be freely distributed. I verify the font available as free download is identical to that on sale in MyFonts, whose author is the person who noticed me. The font contract does not permit its free distribution. I call the site responsible to remove the font in 24h. He doesn't do that and I shutdown the site.</p>
      <p>This is also a situation I call indisputed and clear.</p>
      <p>But let's say the site owner answer me arguing the commercial version of this font is actually a renamed copy from another one, developed under GPL by a group of Ubuntu users and freely distributed by them. I report this to the claimer, who explains he was a member of this user group and did permit them to use his font under given circumstances. He later left the group and now sustain his permission did not include free distribution of the font. To avoid confusion, he changed the font name and also added some small improvements.</p>
      <p>Well, <em>here</em> you have a situation which cannot be handled by nodoby except a legal authority. Is not to the ISP evaluate how true are these allegations nor if the font can or can not be freely distributed.</p>
      <p>In a simple statement, undisputed and clear situations relate to undisputed facts and clear rules.</p>
