    html: <p>They've never responded to my requests either. Most free font sites will respond to removal requests but once in a while you have to shut a site down. In my experience its been really easy to get a font site shut down. I never used a lawyer for this. Usually the host has a policy for dealing with pirated materials. The form for removal may seem like such a pain to fill out. Being a hater of paperwork, I cut a few corners and it was just as effective. The ISP will attempt to contact the site. If, after a few days they haven't responded, they'll kill the site. That's been my experience and one of the sites was In Germany.</p>
