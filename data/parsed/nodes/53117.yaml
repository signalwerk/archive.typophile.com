      <p>With Christmas and New Years and long weekends, it can get slow around here. But to answer your question...</p>
      <p>You can't just paste art into separate masters in a multiple master FontLab vfb file. It doesn't work that way, unfortunately. </p>
      <p>What you need to do is put your Illustrator art into separate FontLab vfb files, as if you were making two separate fonts. Make sure that the two fonts have exactly the same characters/glyphs present and that each glyph has exactly the same number of paths and nodes as its corresponding glyph in the other font. The corresponding paths in the two fonts should also each have the same starting nodes and path directions.</p>
      <p>Important: Save both fonts before proceeding in case it doesn't work the way you expect. Some of these procedures don't have "Undo" and you may need to "Revert to Saved" to undo the damage.</p>
      <p>With both fonts open in FontLab, make the lighter weight font's Font window the active window. Choose "Tools &gt; Multiple Master &gt; Define New Axis...", and choose "Weight" for type of axis (this is the default if it's the first axis you are defining). Then choose "Tools &gt; Multiple Master &gt; Assign Master...". In the dialog box that comes up, select Wt1 for the master and choose your bold font from the list, ignore the check boxes for now, and hit "Okay".</p>
      <p>If all goes well, you will have your multiple master font with the art for your two weights set up as masters. If not, do "Revert to Saved" and try different options in the "Assign Master" dialog or check your outlines in the source fonts.</p>
      <p>(Disclaimer: This is not how I make MM fonts myself--I do all my drawing in FontLab. It should work, but if you run into problems with this method, I may not know the answers. On the other hand, there are probably others here who have worked this way and may be able to help. Assuming they are back from the holidays.)</p>
