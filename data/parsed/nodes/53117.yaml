    <p>Hello!, i have a problem...</p>
    <p>I usually design in illustrator and import the letter forms in fontlab.<br>
    I have finished the bold version of a font, and started designing the light version in illustrator so as to create a multiple master between those weights. The problem is that i cannot paste or anyhow alter one of the weights in the defined multiple master inside a glyph, in fontlab, when i do... the other instance is effected and when i paste the light letterform, automatically fontlab receives it as a separate object. Is there a way to create a multiple master by merging the final light and bold fonts, or is there a way to paste the light letterform as part of the bold's multiple master..?</p>
    <p>Andreas Kalpakidis</p>
