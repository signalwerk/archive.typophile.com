    <p>I occasionally use Microsoft's Bing search engine. Coming up on the 1 year anniversary, I finally couldn't stand looking at the typographic travesty that is their logo. So I designed my own, and it's a solid, aesthetic replacement, if perhaps a bit bland.</p>
    <p>I put together <a class="freelinking external" href="http://userscripts.org/scripts/show/74838" rel="nofollow">this GreaseMonkey script</a> that replaces the logo (and favicon) on bing.com and discoverbing.com. I hope you find it useful.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/better-bing-logo_4015.png"></div><p></p>
