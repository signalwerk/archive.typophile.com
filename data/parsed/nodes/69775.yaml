      <p>That would be so apt, except:</p>
      <p>1) Most of the people criticizing have in fact designed typefaces. I've done about 18,000 glyphs for Adobe, albeit all in one typeface.</p>
      <p>2) It's like you went into the arena for the first time, and some experienced boxers watching pointed out afterwards that you need to actually punch with your left as well as your right. This is really basic stuff in type design that you haven't learned yet.</p>
      <p>I've recently been designing some commercial logos for my employer, in collaboration with our lead in-house graphic designer. It's been a great experience, because she has some fine ideas and we work together at that level, but she lacks any experience with exactly these sorts of optical correction issues, so I fix all those things along the way, and avoid at least one kind of complete logo failure that I see in the logos for, say, Bing and Nook.</p>
      <p>By the way, another very specific point which I see in your re-design of Bing, as well as (for instance) the Nook logo: in order for your logo to *look* monoline (that is, the lines are all the same thickness), you need to make the horizontal parts slightly thinner than the vertical parts. This applies to the top and bottom of round shapes compared to the sides, as well. Even 5% difference may do the trick.</p>
      <p>Cheers,</p>
      <p>T</p>
