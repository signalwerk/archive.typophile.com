    <p>I couldn't find another thread that covered this topic in detail… There seems to be several schools of wisdom on approaching typesetting  ragged right copy:</p>
    <p>• Sort widows and orphans, no hyphenation, turn over all overhanging small words – and smoothing out heavily ragged text (this creates shapes that this article frowns on <a href="http://www.fonts.com/aboutfonts/articles/finetypography/ragswidowsorphans.htm" title="http://www.fonts.com/aboutfonts/articles/finetypography/ragswidowsorphans.htm">http://www.fonts.com/aboutfonts/articles/finetypography/ragswidowsorphan...</a>)</p>
    <p>• Have a balanced rag, not turning over small words etc, sort areas where optical shapes are created in the margin – as described in the link above.</p>
    <p>• Sort widows and orphans – leave everything else.</p>
    <p>• Little or no typesetting of the rag itself and possible use of hyphenation, see Grid Systems in Graphic Design by JMB-Brockmann.</p>
    <p>I'd be interested to know what the typophile conventional wisdom is on this subject. It's not covered at any length by Bringhurst I don't think.</p>
    <p>Thanks</p>
