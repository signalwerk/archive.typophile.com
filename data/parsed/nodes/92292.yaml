      <p>This too is a question of style, and related to the job at hand.<br>
      You might want to give the impression that you don’t care about the shape of the rag, to the extent that you take pains to deliberately make it gnarly.<br>
      Or you might want to make it sweet and smooth.<br>
      Or you might want to relate it to, or echo, another graphic element on the page, a picture for instance, or the shape of a headline or an adjacent column.<br>
      Or you might break it prosodically, or according to the meaning of the text. </p>
      <p>How the page looks and reads is important (which is, after all, Brighurst’s ﬁrst point), not making sure that procedures conform to disembodied standards that do not take into account the text or the page layout.</p>
