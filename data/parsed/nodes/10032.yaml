  html: <p>OK--this is off the wall--but at a design conference I saw someone wearing a "I partied last night with Zapf Chancery" shirt that would be a great gift. <br> <br>Stupid, yes--but you'd have to know them. <br> <br>Anyway, figure this is a 1-in-1000 shot to see if anyone knows where this shirt comes from.  But if anyone would know--wouldn't it be the typophile forum? <br> <br>Thanks for tolerating my (idiotic?) request...</p>
