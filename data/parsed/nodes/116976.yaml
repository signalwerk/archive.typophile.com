    <p>Hey. We’re having a little <a href="/wiki/Typostammtisch" class="freelinking" rel="nofollow">Typostammtisch</a> in Oslo Norway this Saturday. Information follows in Norwegian:</p>
    <p>Skrifttegnere og skriftinteresserte inviteres herved til en uformell samling på Kafé Liebling førstkommende lørdag, fra kl. 19.00 og utover kvelden.</p>
    <p>Det finnes ingen presis norsk oversettelse av det tyske begrepet «Typostammtisch». Kort sagt, betyr det en jevnlig sammenkost (gjerne på en bar, eller en kafé) hvor man diskuterer typografi og skrift.</p>
    <p>Til tidenes første Bokstavelig talt er ambisjonene lave: Vi kan ikke friste med annet enn (mer eller mindre interessante) samtaler om optiske illusjoner, obskure diakritiske tegn, kvadratiske eller kubiske Beziér-kurver og intenste debatter om korrekt plassering av aksent aigu, men det pleier til gjengjeld å være veldig koselig. Dessuten serverer Liebling godt øl.</p>
    <p>Gros Canon!</p>
    <p>• <a href="https://www.facebook.com/events/467549950045859/" rel="nofollow">Facebook-event</a></p>
