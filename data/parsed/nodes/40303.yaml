      <p>I don't believe Carter &amp; Cone (CC) Galliard is commercially available in OpenType. There are a number of characters available in the C&amp;C fonts that likely (i.e., weren't in the past) available in the ITC fonts, like tabular old-style numbers. Also, there is a "Swedish" version available from C&amp;C that has  lower-case "f" which works better with umlaut-accented vowels.</p>
      <p>I don't think C&amp;C would object to your making an OpenType version of Galliard for your own use -- That would be worth checking. If you don't try to go hog-wild with the features, it is pretty easy, and in passing, you can include some kerning pairs not in any of the Galliards available.</p>
      <p>C&amp;C Galliard is available only in roman &amp; italic; for the bolds &amp; blacks you have to buy ITC fonts. But the roman &amp; italic cover the text, and that's where the refinements of C&amp;C Galliard really show.</p>
      <p>FWIW</p>
