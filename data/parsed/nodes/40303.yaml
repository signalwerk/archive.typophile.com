      <p>To me Galliard without oldstyle figures for all fonts is unthinkable, so I was very pleased when ITC recently issued its OpenType version with oldstyles for all the fonts and weights in the family, plus plenty of other glyphs. They say that their font versions were approved by Matthew Carter before issue, which is enough for me. When I checked awhile back, the Carter &amp; Cone versions only give oldstyles for the base-weight roman and italic--they seemed to think you only need oldstyles for stationery! So for me, the ITC OpenType is the only one to get. </p>
      <p>Do NOT get the Adobe OpenType version of Galliard, which did not even TRY to extend glyph coverage beyond the old PS1 version, which I denounced as fraudulent on another thread. ITC, however, is making landmark efforts to bring full glyphs, including oldstyle figures, to many older issues, including, for instance, ITC Franklin Gothic, which never offered oldstyles before. This is very encouraging for the future.</p>
