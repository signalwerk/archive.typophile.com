      <p>Hi Scott,<br>
      check out <a href="http://typophile.com/node/6833" rel="nofollow">this thread </a> and, in particular, <a href="http://www.typophile.com/node/31219 " rel="nofollow">this one</a>.</p>
      <p>In the latter I wrote:<br>
      <cite>Most ligatures and swash alternatives [of the ITC Galliard CC version] were incorporated in the [ITC] OT Pro version, others are missing (among them: alternative ampersand, 2-storey g, long-tailed Q, fj/fr/us/as/is-Lig, end swash forms for d, m, e) [edit: there actually <em>are</em> end swash forms for a, e, h, n, r, t in the OT Pro Roman] or look different (ij-Lig). Ornaments also only with ITC Galliard CC […].<br>
      Then, with ITC Galliard Pro you’d get one font with all the extra stuff comfortably accessible, not to mention all the foreign language diacritics.</cite></p>
      <p>Stewf wrote:<br>
      <cite>It’s difficult to know, because the previews on itcfonts.com and fonts.com don’t seem to show all the glyphs in an OT font.</cite></p>
      <p>Yeah, missing glyph tables on foundries’ (or distributors’) websites are annoying! Once more, kudos to Fontshop.com for being so groundbreaking in this point.<br>
      Linotype once used to show the Galliard Pro glyphs, but they seem to have gone.</p>
      <p>For better comparison, here are all glyphs of ITC’s Galliard Pro OpenType:<br>
      Roman has 634 glyphs, Italic ‘only’ 512.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/itc-galliard-pro-roman_5130.gif"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/itc-galliard-pro-italic_4703.gif"></div><p></p>
      <p>&nbsp;</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/figures-linking_6512.gif"></div>In addition to the other advantages of OpenType, like linked figures (see above), small-caps etc., there is something special to Galliard Pro OT: a stylistic subset with slightly longer descenders:<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/itc-galliard-pro-descenders_5227.gif"></div>In InDesign, you can select this option via the OpenType palette, or, for a wider application, via paragraph styles.<p></p>
      <p>mondoB wrote:<br>
      <cite>Do NOT get the Adobe OpenType version of Galliard, which did not even TRY to extend glyph coverage beyond the old PS1 version, which I denounced as fraudulent on another thread.</cite></p>
      <p>John, you refer to <a href="http://www.typophile.com/node/29567" rel="nofollow">this thread</a>. However, it seems you haven’t really read it. Several people, Thomas and Miguel among them, have explained why Adobe <em>can’t</em> extend those fonts: they are only licensed, Adobe is not authorized to add additional glyphs to them.<br>
      So, you have a point in claiming that Adobe Galliard OT is not the best Galliard one can get. But please stop accusing others of being ‘fraudulent’, okay?</p>
      <p>F</p>
