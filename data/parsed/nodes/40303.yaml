    <p>I'm trying to work out what the deal is with opentype vs mac postscript fonts and how ligatures and alternates work.</p>
    <p>Apparently Opentype fonts can have automatic insertion of old style figures, ligatures and small caps (last para <a href="http://www.itcfonts.com/Fonts/NewFonts/2006/May2006.htm" title="http://www.itcfonts.com/Fonts/NewFonts/2006/May2006.htm">http://www.itcfonts.com/Fonts/NewFonts/2006/May2006.htm</a>) .. wtf? rad. Does this work in CS3?</p>
    <p>Does that mean if you were using a MAC postscript font you'd have to insert your alternates and ligatures manually?</p>
    <p>I'm looking at buying ITC Galliard for the sexy alternates and ligatures. </p>
    <p>OpenType (does this come with the same characters as MAC postscript below??)<br>
    <a href="http://www.itcfonts.com/fonts/font/pid/427686/ITC+Galliard+Pro+Italic/detail&amp;grab_id=0&amp;page_id=55631&amp;query=galliard%20pro&amp;SCOPE=ITCFonts" title="http://www.itcfonts.com/fonts/font/pid/427686/ITC+Galliard+Pro+Italic/detail&amp;grab_id=0&amp;page_id=55631&amp;query=galliard%20pro&amp;SCOPE=ITCFonts">http://www.itcfonts.com/fonts/font/pid/427686/ITC+Galliard+Pro+Italic/de...</a></p>
    <p>Mac Postscript<br>
    <a href="http://www.fontshop.com/fonts/singles/carter_cone/itc_galliard_roman_italic_alternates_cc/" title="http://www.fontshop.com/fonts/singles/carter_cone/itc_galliard_roman_italic_alternates_cc/">http://www.fontshop.com/fonts/singles/carter_cone/itc_galliard_roman_ita...</a></p>
    <p>Should I just go old school and buy the MAC postscript?</p>
