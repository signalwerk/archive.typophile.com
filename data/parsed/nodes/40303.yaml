      <p><cite>Cos that’s still ITC... but from what I gather that version is the most extensive in terms of characters. Am I right?</cite></p>
      <p>Well, yes, and no. I don't know the exact timeline of Galliard; Carter may have cut it when still working for Linotype. At some point, it got sold to ITC, and at that point, ITC owned the name. This has happened to more than one type designer . . . Sumner Stone cut at least part of the "Stone" clan when working for Adobe. It got sold ("licensed") to ITC. When Stone started up his own foundry, he had to pay ITC for the right to offer his own fonts -- which he did, refining them some in the Stone foundry version.</p>
      <p>Anybody who releases an ITC font is suppose to stick pretty much to the same font. The trick here is the "pretty much." I liken it to the notion that if the font was used in printing newspapers, then if you changed from one foundry to another for an ITC font, you shouldn't have to change your settings in the composition program (size, kerning, etc.) and most of your readers wouldn't notice the difference.</p>
      <p>But most of us frequenting this site aren't printing newspapers, and we like to think our use of type is a little better than with newspapers, and our audiences a little more attuned to detail.</p>
      <p>So, in my somewhat less than humble opinion, the C&amp;C versions of ITC Galliard are a little more refined than the Bitstream (also a Carter company). He fixed some things that bothered him. The kerning is a little more refined too, but a user of type always has to do his/her own tinkering with the kerning. It is the letterforms themselves that are better with C&amp;C.</p>
      <p>Keep in mind that even the C&amp;C Galliard was rendered before direct-to-plate printing, and some feel the balance of the letterforms is a bit off, a bit <cite>thin</cite> when printed CTP. But I doubt Carter will refine Galliard yet again, so the C&amp;C version is probably the last version we'll get.</p>
      <p>It is still a wonderful font if you pay attention to the setting size; has great balance when you get the size just right.</p>
      <p>Whenever I buy one of Matthew Carter's fonts nowadays, I always call Cherie Cone first. I figure they make a little more money with no intermediary. </p>
      <p>FWIW</p>
