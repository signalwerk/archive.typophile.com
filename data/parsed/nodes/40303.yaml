      <p>I considered it fraudulent when Adobe's sales copy for the OpenType library CD, consulted in Nov '06, promised a new world of enhanced glyph coverage across the board for all OpenType issues, NO EXCEPTIONS NOTED. Then, the customer who paid thousands for this CD is shocked to find just how many text families in OpenType actually offer nothing new for their glyphs versus the PS1 format. </p>
      <p>We all understand the licensing problem, but that was not the point for customers who, unable to research precise glyph coverage for each of 2,300 fonts, feel victimized. Perhaps because of our widely-read discussion of this discrepancy, Adobe sales copy now says "most" but not all fonts offer extended glyphs, a helpful qualification. But I also made many constructive suggestions about addressing the glyph shortfall family by family, creative collaborations with license-owners that would have demonstrated Adobe's leadership instead of their current passive indifference to their customers' needs. Now that ITC has released their enhanced OpenType Galliard, perhaps they are ready to re-license it to Adobe so Adobe can replace their now worthless version. But that's another thread.</p>
