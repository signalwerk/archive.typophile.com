      <p>&gt; OpenType (does this come with the same characters as MAC postscript below??)</p>
      <p>It's difficult to know, because the previews on itcfonts.com and fonts.com don't seem to show all the glyphs in an OT font. I would contact ITC and ask them.</p>
      <p>Normally, I would recommend the OpenType version of any font, because small caps, ligs, figures, and alternates are indeed much easier to use in that format. But <em><a href="http://www.fontshop.com/fonts/downloads/carter_cone/itc_galliard_cc/" rel="nofollow">ITC Galliard CC</a> is a different set of fonts than ITC Galliard</em>. They were created by Matthew Carter after the ITC release, so the two families may not be comparable. <a href="/wiki/Carter%20and%20Cone" class="freelinking" rel="nofollow">Carter and Cone</a> have not released an OT version of ITC Galliard CC, but you could contact them or FontShop to create one for you.</p>
