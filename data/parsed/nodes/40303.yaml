      <p>Just so you know, the CC Galliard Roman and Italic match the other weights of the Bitstream version -- if you need the other weights (I have never used them). To my knowledge, these weights have only the standard character set, none of the extras shown in the Pro version above.</p>
      <p>I asked Cherie Cone a couple of years ago if they would be producing an OpenType version. She told me that I was the first person to ask, and that they would consider it if there was a demand.</p>
      <p>The Pro version above seems to have just about everything needed to set good type. Unless you really need an fj (which you can easily make yourself), I don't see why you can't make do with the Adobe Pro Galliard. The CC version does contain both fitted and non-fitted numerals, both in lining and hanging, plus a few extra swash characters (dangerous).</p>
      <p>I like the CC version, and have used it for years. It is in serious need of an update to OT. If enough people ask for this, I'm sure CC will respond accordingly.</p>
