      <p>This logo is a shame.</p>
      <p>OK, it is beautiful, nicely done and quite good on colours (although it suffers when used in B&amp;W). But the worst is it's a plagiarism.</p>
      <p>The dancing circle can be seen in William Blake's <em>Oberon, Titania and Puck</em>, from 1786, which served as reference to Matisse's <em>Dance</em> in 1910. The dancing circle is worldwide known and was already used in Telluride Foundation logo. This logo was itself also copied in 2004, in a Bahia's carnival mark.</p>
      <p>I'm pretty sure the creators of Rio 2016 (Tátil agency) know these references and former usage of a dancing circle, especially Matisse's paint and Bahia's logo. In their site, they claim to have done a very elaborated and highly creative work (!). No mention was made about all these antecedents.</p>
      <p>Besides the plagiarism, there is also the "friendly" overused idea. As Babs pointed, there is a kind of obsession to picture Brazil as a paradise of friendship in sunny beaches. This is a bad tendence that our own designers like to propagate, producing a quite sterile and repeating aesthetics.</p>
      <p>And one cannot forget that Olympic Games actually have almost nothing to do with friendship between nations. It's plain competition. Coubertin advocated it as an oportunity to fair, edifying disputes between men in order to achieve longer, stronger and taller results, always within high spirits. But even he did not conceived the Games as a love and pace apotheosis. So, the idea behind this logo is also unreal and maladjusted.</p>
