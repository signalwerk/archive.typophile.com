      <p>I'm not going to add to the stream of arguments for or against the logo, but just want to add that even though many of us might like to see a purely typographical logo (like your modification, Tomi from Suomi), the current IOC rules regarding olympic emblems make it very hard to differ much from the concept we have seen for so many years now (logo on top of city name and year on top of olympic rings)... </p>
      <p>The city name has to be included, it has to make clear reference to the host city/country, the rings must not occupy more than 30% of the logo area and must not be modified, and the logo cannot consist of the city name alone. On top of that, certain symbols like the olympic flame/torch must not be used (as Chicago learned during their bidding process). etc. etc. </p>
      <p>(and in a way this even makes me appreciate the London logo a little more, it must have been a real fight getting it approved by the IOC)</p>
    html_clean: |-
