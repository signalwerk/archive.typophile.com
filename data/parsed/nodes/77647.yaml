      <p>The logo definitely loses a lot when printed in black &amp; white.</p>
      <p>But these days many graphic designers &amp; their clients aren't as concerned about how logos look in black and white, because they communicate to their clients primarily by color media such as the internet, television,  etc, and when they need printed pieces they print in color.  If their logo looks crummy on a fax or xerox, it's not a big deal to them since that's not how most consumers will see their logo.</p>
      <p>I'm not saying it's a good thing (I'm old school and believe a logo should always work well in black and white), but it's definitely a trend these days.</p>
