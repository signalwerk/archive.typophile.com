      <p>Among the most common uses for this logo will be in stitched appliques and screen prints on clothing, which are pretty low-fidelity media. This logo, as shown above would likely be mangled unmercifully when reproduced as an applique on a hat or a jacket.</p>
      <p>However, I do think this design could easily be tailored to create versions that will work for hats and tee-shirts as well as for black &amp; white &amp; low-res requirements such as the cardboard boxes the merchandise is shipped in and for faxes. It would be surprising if this hasn't been taken into consideration already.</p>
      <p>That said... What were they thinking?</p>
      <p>:o)</p>
