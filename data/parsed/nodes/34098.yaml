    <p>We are glad to present our first 4 fonts families at Tipo. Latin American type foundry with an ambitious objective: to supply digital types of high quality to everybody.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/tipo_4fonts_6073.jpg"></div><p></p>
    <p>Estamos felices de anunciarles el lanzamiento de las primeras 4 familias tipográficas de Tipo, fundidora latinoamericana, que tiene un ambicioso objetivo: surtir de tipos digitales de alta calidad a todo el mundo.</p>
    <p>More Information:<br>
    <a href="http://www.tipo.net.ar" title="www.tipo.net.ar">www.tipo.net.ar</a></p>
