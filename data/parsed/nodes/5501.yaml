      <p>This 2004 forum thread is new to me. I'm surprised no one cited "All The President's Men" with Robert Redford and Dustin Hoffman, where the opening credits sequence is an extreme closeup of typewriter keys smashing onto paper and the closing shot is a teletype printout confirming Richard Nixon's resignation:</p>
