    votes: null
    html: |-
      <p>Excellent. I should've picked up the Baskerville header type—that swashy T should have given it away. (Hits head repeatedly on desk.)</p>
      <p>I'd never heard of DeVinne, though. Century wasn't too far off, apparently:<br>
      <cite>This revival of the Bruce Foundry’s No. 11 is typical of the nineteenth century types derived from the work of Didot and Bodoni; the face remains popular with lawyers and government printers. In fact, Theodore Low De Vinne opposed this kind of design as hard to print and read; he had Century designed to replace it.</cite><br>
      (From the MyFonts description.)</p>
      <p>Thanks, Patty!</p>
