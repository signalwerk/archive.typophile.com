      <p>This is the feature I wrote:</p>
      <p><code><br>
      feature liga {<br>
      # Latin<br>
      	sub C @set1' by @set2;<br>
      	sub E @set1' by @set2;<br>
      	sub J @set1' by @set2;<br>
      	sub S @set1' by @set2;<br>
      	sub Z @set1' by @set2;<br>
      	sub c @set2' by @set1;<br>
      	sub e @set2' by @set1;<br>
      	sub j @set2' by @set1;<br>
      	sub s @set2' by @set1;<br>
      	sub z @set2' by @set1;<br>
      	sub @set2 @set1' by @set2;<br>
      	sub @set1 @set2' by @set1;<br>
      } liga;<br>
      </code></p>
      <p>Pieter</p>
