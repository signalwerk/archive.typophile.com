    html: |-
      <p>The main problem is that the trigger glyphs were in the classes you were switching. Try this:</p>
      <p>feature CALT {</p>
      <p>@set1 = [A B D F G H I K L M N O P Q R T U V W X Y];<br>
      @set2 = [a b d f g h i k l m n o p q r t u v w x y];<br>
      @trip1 = [C E J S Z];<br>
      @trip2 = [c e j s z];</p>
      <p>sub @trip1 @set1' by @set2;<br>
      sub @trip1 @set2 @set1' by @set2;<br>
      sub @set2 @set2 @set1' by @set2;<br>
      sub @set2 @set2 @trip1' by @trip2;</p>
      <p>sub @trip2 @set2' by @set1;<br>
      sub @trip2 @set1 @set2' by @set1;<br>
      sub @set1 @set1 @set2' by @set1;<br>
      sub @set1 @set1 @trip2' by @trip1;</p>
      <p>} CALT;</p>
