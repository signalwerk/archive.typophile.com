  html: |-
    <p>Hi all,</p>
    <p>I'm working on a typeface with two versions of each character. I made two sets and called them @set1 and @set2. Every set has five characters after which I like to 'swap' to the other set. The characters are C E J S Z and c e j s z.<br>
    For example. I like to go like this: ABCdeFGHIJklmnopqrsTUVWXYZabcDE etc<br>
    I can't get the code working, can somebody help me?<br>
    Thanks!</p>
    <p>Pieter</p>
