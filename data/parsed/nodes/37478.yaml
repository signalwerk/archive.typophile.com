      <p>Funny to find this thread, desperately seeking font-pairing advice for Trajan, for a KU academic poster. Sticking with a cohesive feeling with the new logo, I’m using Trajan for the title and subtitles now I just need to figure out what font to use for the copy.<br>
      Any advice is welcome.</p>
      <p>My $.02 is that the entire logo redesign, while not a complete design failure, is a perfect example of how bureaucracy can muddle up anything. Spend too much on an unnecessary redesign that you can’t afford to change all of the media. It was probably someone at KU who just saw Troy, and said “Wow! I want our logo to look that cool!” and just kept insisting on it.<br>
      __________________________<br>
      <a href="http://DesignerScott.com" title="http://DesignerScott.com">http://DesignerScott.com</a></p>
