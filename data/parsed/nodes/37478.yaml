    <p><a class="freelinking-external" href="http://trajansucks.com/">TRJAN SUCKS</a></p>
    <p>No offense to Mrs. Twombly but <a class="freelinking-external" href="http://www.jocksnitch.com/images/big/JNI2243.jpg">this</a> is quite atrocious. While I do think that Trajan is a well crafted typeface, It is completely wrong for KU basketball jerseys or any sports jersey for that matter. As a KU alumni, it’s just sad to see this happen.</p>
    <p>see also: <a class="freelinking-external" href="http://www2.kusports.com/news/2007/jul/19/uniforms_tweaked_again/">http://www2.kusports.com/news/2007/jul/19/uniforms_tweaked_again/</a></p>
