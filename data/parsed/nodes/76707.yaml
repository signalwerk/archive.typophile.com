  html: |-
    <p>I am curious to find if there is a style available for Photoshop<br>
    that allows a blank colored layer to be 'erased' by type to reveal (eg. a photo in this case) layer underneath?</p>
    <p>I did a quick example but I had to merge the text and blank layer together then magic wand the black text and delete, leaving rough edges so it then had to be blurred.</p>
    <p>Any input would be helpful!</p>
