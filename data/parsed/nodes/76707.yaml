    html: |-
      <p>I might not be understanding what you're trying to do, but if you want text filled with a photo over a background, you can keep the text editable by making the text into a mask layer, like this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture_2_4421.png"></div><p></p>
      <p>The key is to option-click on the line dividing the text from the photo. That'll indent the photo (Layer 3) and mask it to the text.</p>
      <p>I probably have my terminology wrong.</p>
