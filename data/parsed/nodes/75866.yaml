    <p>Hello all,</p>
    <p>I'd like to work on my design writing and researching skills, and while fishing around for topics I thought about trying to find some competitions with interesting briefs that might provide a good starting point. I found <a class="freelinking external" href="http://www.aiga.org/content.cfm/content.cfm/writing-awards " rel="nofollow"> this one</a> run by AIGA, but it's only open to US residents, and doesn't propose its own topics or titles. </p>
    <p>Does anyone know if any current magazines, professional associations or publishers for example run a regular scheme?</p>
    <p>Cheers<br>
    Anthony.</p>
