      <p>There are “legal” hyphenation points in a given word (according to whatever dictionary/standard is being used — American and British conventions differ, as has been noted); and then there are “preferable” hyphenation points — those that seem most natural, like between compounds or only at distinct prefixes and suffixes. The latter is a subset of the former, and probably more what your client is looking for.</p>
      <p>If you move the slider in the H&amp;J dialog to the right, “Fewer Hyphens,” it will encourage InDesign to use only the more preferable hyphenation points. It won’t stop “bad breaks” altogether, but it will give greater penalty to the less desirable hyphenation points. (Of course, no dictionary will be able to read your publisher’s mind ;-)</p>
      <p>I would not necessarily recommend limiting the before/after character fields to 4, unless those cases are completely unacceptable in all situations. Doing so will take away InDesign’s option to hyphenate a word with a three-letter prefix, of which there are many (like “pre-”, for example) and which should be a completely acceptable break point for your client, since these are considered by most to be natural and logical points.</p>
      <p>The fewer options the H&amp;J engine has to work with, the harder it is to get good settings.</p>
      <p>Good luck.</p>
