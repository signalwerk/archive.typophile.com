      <p>You’re going to have to strike a compromise between end-of-line hyphenation and word/letter-spacing. That’s the nature of justification.</p>
      <p>Can you tell us what settings you’re using and what, specifically, the client is finding objectionable about the hyphenation?</p>
      <p>The number of consecutive hyphens can be controlled. The number of letters before or after a hyphen can be controlled. The relative penalty for hyphenating can also be controlled (with the slider at the bottom of the H&amp;J dialog). Beyond that, there’s always custom-editing the hyphenation dictionary for repeated unacceptable breaks.</p>
