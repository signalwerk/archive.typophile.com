      <p>I don't understand why this is a problem.<br>
      You've got 60+ characters on a line, which is plenty for adequate justification.<br>
      Does this "classic author" use really long words?<br>
      I suspect your client is a ragophile, or a bibliophile who feels claustrophobic with the tight fit of digital text.</p>
      <p>I do think 12 pt type, even Garamond, is a bit big though.</p>
      <p>One thing you might try is increasing the number of letters before and after hyphenation to 4 or 5, and setting word space to 100/100/200. This will give a more "old school", metal type look, very open, and IMO quite apropos for an oldstyle face like Garamond in a justified book setting. And turn off the kerning while you're at it!</p>
      <p>I've done tests trying to duplicate Monotype metal setting in InDesign, and discovered that the word spacing is waaaaay, way more than the digital defaults of today. One thing you have to be careful with in emulating the classic mid-20th century letterpress look is the last line of a paragraph, though, as it always sets to the tight default, which can look out of place.</p>
