      <p>Which is exactly the end-of-line problem? Too many hyphens or wrong syllabication?</p>
      <p>I'm not an English native speaking so may I be missing something here. But as long as I know, there are many words with five and six letters in English which had syllabication (as total, tribal, yellow, pillow, under, other, etc.).</p>
      <p>Thus I believe your settings are not optimal when you define a minimun of seven letters to hyphenation. The same with three as the limit before and after. To use 5/2/2 must produce better results.</p>
      <p>Hyphenation zone does not applies to justified text, so the value you put here does not matters.</p>
      <p>I like to use no hyphen limit (0) and set the slider to maximum better spacing. ID tries to keep as few hyphens as possible, so you will hardly gets a hyphen cascade.</p>
      <p>Another resource you must consider is optical alignment. It produces a much more regular verticial margin.</p>
      <p>The settings I use to English texts (sample text block with 27p width):</p>
