    <p>I've inherited an InDesign file for a journal based on works from a classic author. The size of the journal is 6"w x 9"h, line measure is 27p4.5, body typeface is Adobe Garamond Pro regular, 12/14.5. Client wants justified type throughout. Previous designer used ID's default h&amp;j settings, but client wasn't happy with the hyphenation that resulted. </p>
    <p>I've showed a few new sample settings but client wasn't satisfied with end-of-line hyphenations, though word and letter spacing looked fine.</p>
    <p>My question is: can someone suggest h&amp;j settings that would work well with typeface and line measure? </p>
    <p>P.S. Client is resistant to any change to template.</p>
    <p>Thank you.</p>
