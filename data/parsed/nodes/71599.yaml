      <p>&gt; Client's objections were to syllabication...<br>
      &gt; Not sure that she really knows what she wants</p>
      <p>I've had clients who simply didn't like any hyphenation. They thought that breaking words at the end of lines was unattractive and disruptive.</p>
      <p>If you can't convince them otherwise, the solution is pretty simple -- just minimize the number of hyphens. Set the hyphenation preferences to have at least 4 characters before and after a hyphen, move that slider to "fewer hyphens", etc.  As Nick said, with 60+ characters per line, you should be okay as long as there aren't a large number of unusually long words.</p>
