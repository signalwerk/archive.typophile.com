      <p>&gt;Client's objections were to syllabication</p>
      <p>Why we always use a custom dictionary -- with InDesign, or any other layout program. InDesign makes it tough, though. It will always revert to the Proximity Dictionary (algorithm) settings when a word is not in the exception dictionary. The only solution is to have all the words in the text in the exception dictionary. Even here there can be differences with some words where, for example, an apostrophe occurs. Further, there are issues with using the "document" dictionary, but other issues if you don't. Controlling hyphenation with InDesign is a nightmare. So too is justification -- the Single Line composer doesn't work like any other single line composer I've ever used, and the Adobe Paragraph Composer, under certain circumstances, will not always make the same line-ending decisions, even though there was no change to the text in a paragraph. Finding that out cost us $4,000 to reprint a book for a customer (we split the cost, they didn't catch the problem at F&amp;G's). We now run a PDF to PDF comparison of the entire book at each proof stage to make sure nothing changed.</p>
      <p>BTW, technically speaking, InDesign's dictionary is a plug-in. By now, there may be others out there. We quit looking &amp; developed our own.</p>
