    html: |-
      <p>See this wonderful site [<a href="http://www.alanwood.net/unicode/utilities_fonts_macosx.html">link</a>].<br>
      Mostly all information you need to produce Unicode keyboard layout for your language is there.<br>
      Big thanks goes to Mr. Alan Wood... :-)<br>
      I suggest using Google to find information about your language usage on computers before. May be it’s already done for OS X ...</p>
      <p>From this page:<br>
      “Ukelele provides a graphical interface for creating or modifying Unicode keyboard layout files for Mac OS X 10.2 onwards. It allows you to start from scratch, or to modify an existing keyboard. Characters can be dragged from the Character Palette, or from other programs that can display the characters that you want to use.”</p>
