    <p>Hi.<br>
    It was easy to prepare keyboard layout for Windows using Microsoft Keyboard Layout Creator (theres no abkhazian language and keyboard layout in system). But now I want to prepare the same Unicode OT fonts for Mac, but cant find the tool to create layout. What to do? IS there any application like MKLC but for MAC.<br>
    Thanks</p>
