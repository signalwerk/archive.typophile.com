      <p>I imagine James Montalbano at Terminal Design might be able to help you out in that department. When I saw James deliver a really interesting and informative talk in Toronto about Clearview he had a very detailed presentation with photos, samples, and some comparisons between the features and attributes of other typefaces also being used for highway signage applications. Although I think a fair bit of thatt info might be on the Clearview website. Afterwards James was kind enough to leave the PDF on my laptop which was used for the presentation. I'd post it but I think I'd have to get permission from James first, I think he posts on Typophile if I am not mistaken.</p>
      <p>Unfortunately I have none of my own photos of Clearview in use.</p>
