      <p>There is a number of "roadgeek" websites where ClearviewHwy can be seen in use along highways in places like Texas.</p>
      <p>Eric Stuve maintains the OKRoads website at <a href="http://www.okroads.com" title="http://www.okroads.com">http://www.okroads.com</a>. He also maintains some other roadgeek related websites. His road trips cover a really big portion of the Interstate Highway system, including many roads in Texas. He recently posted photos of a West Texas and New Mexico road trip made during April of 2006 at this link:<br>
      <a href="http://www.okroads.com/roadtrips/wtexas.html" title="http://www.okroads.com/roadtrips/wtexas.html">http://www.okroads.com/roadtrips/wtexas.html</a></p>
      <p>He hasn't yet organized the trip photos into an easy to navigate page (he's working on it). If you click on the Lubbock to Oklahoma City link you'll find a parent directory featuring lots of photos, many of which feature roadway signs along the entire length of Interstate 27. Much of the northern half of that Interstate's signs have been entirely replaced with new ones featuring ClearviewHwy legends. Most of the big green signs in Amarillo are set in Clearview. He has other photos in the El Paso area where ClearviewHwy appears sporatically on new signs mixed in with old ones. The posted photos are not high resolution, but one can easily ID the ones set in Clearview.</p>
      <p>Other roadway signs in Texas are kind of a pot-luck thing regarding ClearviewHwy. Older signs and storm damaged signs are replaced bearing the new typeface. It seems like the Texas Panhandle is getting the most aggressive treatment on ClearviewHwy-based roadway sign installations. It's even appearing on little street name signs in small blink-and-you-miss-them sized towns.</p>
      <p>You might also want to visit <a href="http://www.houstonfreeways.com" title="www.houstonfreeways.com">www.houstonfreeways.com</a>. Erik Slotboom has lots of high resolution photos of super-highways across Texas, some of which feature ClearviewHwy-based signs. His new photo essay of the Marsha Sharp crosstown freeway in Lubbock has a couple decent shots of signs set in CV-5WR</p>
