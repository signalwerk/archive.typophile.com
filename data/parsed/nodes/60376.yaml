    html: |-
      <p>Just make alts and name them accordingly and put in a stylistic set. </p>
      <p>feature ss01 { # big asterisk<br>
        sub asterisk by asterisk.alt_big;<br>
      } ss01;</p>
      <p>Best to keep such eccentricities optional, in my opinion.</p>
