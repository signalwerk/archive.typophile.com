      <p>I think that you couldn't make two version because in start this is not really a logo. Printed it would look like a black/grey stain or smudge of colors. You have a mark that is not actually a mark, it is free floating graphics/visual and it is too large in relating to type. So you wouldn't really benefit in the end. </p>
      <p>Second tought is to start again, from scratch making a simple logo or on other hand creating something that has same idea - set of visuals that later combines with wordmark and thus applying it to business cards, memorandums and then banner and so on.<br>
      Sorry, I cannot remember now of identities of extended visuals combined with wordmark.</p>
      <p>Define your problem at first, and then decide what to create and which way to go. Music and festivals are great projects to work for.</p>
      <p>Good luck.<br>
      _</p>
      <p>Sandro</p>
