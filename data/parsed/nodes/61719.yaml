    <p>I am working on a logo for a music festival.<br>
    I am trying to decide the right typeface<br>
    for this festival. It seems like egyptienne<br>
    a slab serif typeface is heading in the<br>
    right direction. The didot logo appears<br>
    to be too "high class." I need to make it<br>
    feel more youthful, without using a sans<br>
    serif typeface. </p>
    <p>I still have some kering issues and<br>
    composition problems, but I really need<br>
    to decide on a primary Logotype.</p>
    <p>I would like to hear your reactions on the logo,<br>
    and suggestions on the typography.</p>
    <p>Thanks,</p>
    <p>Derrick</p>
