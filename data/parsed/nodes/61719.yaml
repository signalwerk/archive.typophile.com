      <p>I think it's probably too modern. One nice thing about Archer is that it has small caps, which would be nice for this. But I went over to the HTF website and tried it - just felt a bit modern to me. I also tried Giza over at MyFonts.com and almost liked it - that's more the direction I was thinking of.</p>
      <p>One thing I have learned from doing exactly what you're doing right now (asking others for their opinions) is that it can get very confusing. So I hope that doesn't happen, ultimately you need to execute YOUR vision, not mine.</p>
      <p>All that being said, I think something a bit retro and irregular would work better.</p>
      <p>BTW - I've done a few logos for music festivals and I ended up drawing all of them. It also helps when someone cannot easily imitate the trademark for an event.</p>
      <p>pbc</p>
