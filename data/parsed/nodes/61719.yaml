      <p>Paul is right that this is too "modern" for folk music. Also these lines and visuals are also maybe too modern for folk music. Try to explore folk music, folk art maybe, try to find visuals, patterns, try to find its identity, try to find everything about Presque isle regarding the folk music. Sans or serif, it is all up too you, depends on feel and how do you want to communicate. </p>
      <p>I see that you cut the type part of your visuals but again, this cannot go into logotype/wordmark box:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/logotype_4433_4989.jpg"></div><p></p>
      <p>Think of ratios of all elements that you combine. Year, place, these thin lines and shapes are all too small, and you are going into decoration with all these elements. Design is not just formalism and technicality.</p>
      <p>Other thoughts are that you could go with primary, secondary and maybe tertiary versions of logo. Adding place and date in secondary versions or in tertiary. </p>
      <p><a href="http://gapersblock.com/transmission/pitchfork-music-festival.jpg" title="http://gapersblock.com/transmission/pitchfork-music-festival.jpg">http://gapersblock.com/transmission/pitchfork-music-festival.jpg</a></p>
      <p>This logo communicates, good example is combining the year that is differentiated from name with color.</p>
      <p>p.s Animal please when you type don't use forced lined brake with enter, it gets very hard to read what you have written. Thanks</p>
      <p>_</p>
      <p>Sandro</p>
