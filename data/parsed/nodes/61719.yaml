      <p>Besides being apparently youthful, what kind of music is it? And why the ban on sans? That slab you're using looks clean, but it's not exactly youthful... And that "Q" is lame; it's meant for setting multiple lines of caps (and not having them crash) so you might like to replace the tail with something more... youthful. :-)  Maybe make it curl backwards into the space between the two words below. And why keep the "2010" in Didot? You could use a different font, but the Didot is clashing with the Egyptian.</p>
      <p>BTW, that island illustration is beautiful, but the first thing that popped into my head is making the island outline look like it's emanating sound waves - you know, vibrating out. Or is that what you've already done? Because it looks more like a typical topographic map - maybe too literal for a place that's not actually an island (at least not geographically :-).</p>
      <p>hhp</p>
