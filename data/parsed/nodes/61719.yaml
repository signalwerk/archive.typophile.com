      <p>It will be very hard to use these graphics you made as a logo. Try applying it to business card, memorandum etc. in small sizes, and you will see your mistake. First example will work poorly in black and white situations for example and in small sizes. Second example has problem that first also has - too many details that will loose eventually when applied, especially, again, small sizes.<br>
      Have you tried printing them?</p>
      <p>Again, you could use these as visuals or graphics on banners, flags, other print material in big sizes but using festival's wordmark as a logo. You are trailing yourself a good path creating identity - identity that doesn't relies only on logo but on some kind of wordmark and set of graphics, visuals, illustrations (how do you want to call them).</p>
      <p>Hope it is clearer now.</p>
      <p>_</p>
      <p>Sandro</p>
