    html: |-
      <p>Someone asks for a “classic modern” (or was it ‘modern classic’?) – and we don’t realise what she is actually looking for.</p>
      <p>– Why?</p>
      <p>Because we lack an appropriate terminology to accurately describe a face’s characteristic. This is really a mess: for type users who can’t quite find what they look for; for type providers who have no tool to market fonts precisely. </p>
      <p>Has anyone a clue about what has been achieved in type classification so far?</p>
