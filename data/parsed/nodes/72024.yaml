    <p>You know when you have looked at so many faces for a tad too long you find it hard to see clearly. Well, I would love some advice, or tips rather. I'm looking for what I'm sure many have heard as a request numerous times; a classical modern typeface.<br>
    I will use it white on black, both online and print, this is for a brand that are new but wish to look slightly 'mature', not trendy.</p>
    <p>Hope you all a good rest of the day, remember to use the watercooler, I know this office feels like a sauna right now..</p>
    <p>-Marjo</p>
