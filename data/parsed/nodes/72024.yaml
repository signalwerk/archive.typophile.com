      <p>Alright I think first I need to make sure that I understand you.</p>
      <p>"mondern" can have different meanings. From the perspective of philosophy, history and social sciences it would describe the Age or Reason and Rationalism, form the enlightenment onwards, and traces can be found in the way people think up to the 1960s. (Some actually argue, that the deathly system of the Nazis was rationalism in extreme, Adorno for example) Generally speeking you can summarize the "long" 19th century as the main time of modernity. </p>
      <p>As people here are familiar with history of ideas, you got two answers so far, which interpreted your "modern" as "19th century type". Giving you answers related to the Didone types and other modern typefaces. </p>
      <p>I assume you mean "contemporary".</p>
      <p>With classical I guess you refer to something like "traditional", "old-school" and "established"? This would be probably every mainstream text typeface from the renaissance, to old style, to then actually modern(!) (Scotch, Didone, Bodoni) and Transitional.</p>
      <p>Based on the assumption that you want a contemporary but still traditional typeface, I would recommend you:</p>
      <p>Some more rare:<br>
      <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fontfont/ff_maiola_ot/" rel="nofollow">Maiola</a><br>
      <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fontfont/ff_yoga_pro/" rel="nofollow">FF Yoga</a><br>
      <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/fontfont/ff_tisa_pro_regular/?sample_text=TDC%20Certificate%20of%20Excellence%202007&amp;sample_size=24" rel="nofollow">FF Tisa</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/tipo/lineare/" rel="nofollow">Linare</a><br>
      <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/emtype/relato_family/" rel="nofollow">Relato</a><br>
      <a class="freelinking external" href="http://www.fontshop.com/search/?q=Fresco%20OT" rel="nofollow">Fresco</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/nonpareille/stuart-pro/" rel="nofollow">Stuart</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/typefolio/adriane-text/" rel="nofollow">Adriane</a><br>
      <a class="freelinking external" href="http://www.typography.net/type/enigma" rel="nofollow">Enigma</a></p>
      <p><a class="freelinking external" href="http://www.teff.nl/index-type.html" rel="nofollow">Enschedé Font Foundry</a> has some gems</p>
      <p>The usual suspects - for a good reason:<br>
      <a class="freelinking external" href="http://www.fontbureau.com/fonts/Whitman/" rel="nofollow">Whitman</a><br>
      <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/garagefonts/freight_text/" rel="nofollow">Freight</a><br>
      <a class="freelinking external" href="http://www.fontshop.com/search/?q=Swift" rel="nofollow">Swift</a><br>
      <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100016" rel="nofollow">Mercury</a><br>
      <a class="freelinking external" href="http://www.fontbureau.com/fonts/Prensa/" rel="nofollow">Prensa</a><br>
      <a class="freelinking external" href="http://www.typeculture.com/foundry/font_collection/font.php?ID=FNT09_01" rel="nofollow">Expo Serif</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/fontbureau/farnham/" rel="nofollow">farnham</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/warnock/" rel="nofollow">Warnock</a></p>
      <p>More in the traditional corner:<br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/brassfonts/girando-pro/" rel="nofollow">Girande</a><br>
      <a class="freelinking external" href="http://www.veer.com/products/typedetail.aspx?image=CTT0000007" rel="nofollow">Borges</a><br>
      <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/carter_cone/itc_galliard_cc/" rel="nofollow">Galliard</a><br>
      <a class="freelinking external" href="http://www.linotype.com/5831/malabar.html" rel="nofollow">Malabar</a><br>
      <a class="freelinking external" href="http://revision.ru/work/16908/" rel="nofollow">Leksa</a></p>
      <p>I guess this list is a good start. </p>
      <p>Although <strong>if</strong> you actually meant a modern kind of typeface (19th century) in a contemporary reinterpretation, then I think Nick Shinn is quite the expert here. With the mentioned Bodoni Egyptian and his </p>
      <p><a class="freelinking external" href="http://www.shinntype.com/" rel="nofollow">Scotch Modern</a>. </p>
      <p>You might then like as well:</p>
      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/fontbureau/miller/" rel="nofollow">Miller</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/typejockeys/ingeborg/" rel="nofollow">Ingeborg</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/fontbureau/escrow/" rel="nofollow">Escrow</a></p>
      <p>Alright, I hope this will give you something to work with ;)</p>
      <p>best</p>
