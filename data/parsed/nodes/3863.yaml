    date_raw: 5 Dec 2002 — 5:05pm
    votes: null
    html: <p> Thanks for the feedback. Although I have some experience in sign painting, and have been doodling with letterforms for many years now, Sotoflame is my first completed digital font.  <br> <br>!!Thanks to bj harvey for font-making tutorials!! <br> <br>Anthony </p>
  - id: 28939
    user: 641
    date: 2002-12-05T17:31:00
    date_raw: 5 Dec 2002 — 5:31pm
    votes: null
    html: <p> Hi Anthony, <br> <br>did you do graffiti? I can see certain characteristics in this font. The D,E,G,P,R &amp; S look 'piece' like ;) <br>I was a graf artist years ago and still love the medium. I think thats where my love for type came from. <br> <br>Bren </p>
