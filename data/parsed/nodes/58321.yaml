    <p>Greater Albion Typefounders have just released further previews of the Clementhorpe family on our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.  This is intended to be one of our major releases for mid-year, offering a substantial family of different faces and weights, aimed at text and display use.</p>
    <p>Look out for the detailed .pdf preview at the ottom of the log post.</p>
