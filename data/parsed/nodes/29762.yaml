    html: |-
      <p>Maybe we could sit out on the Steyne Gardens all night under ’protective police custody’ and make letterforms with our confiscated bootlaces... just like in the good old days.</p>
      <p>(Er, I hate to mention it, but what is typographic about Brighton is it was the birthplace of A.E.R. Gill.) That still doesn’t mean I know why AtypI choose it, other than it’s presumably cheap off-season.</p>
      <p>’Punch &amp; Judy’ might make a good theme. Or ’Brighton Rock’.</p>
