      <p>Appears to be created from several typefaces.</p>
      <p>The P is from Lucy Script:<br><a href="http://www.dafont.com/lucy-script.font?text=P&amp;psize=l">http://www.dafont.com/lucy-script.font?text=P&amp;psize=l</a></p>
      <p>The a, i, and n appear might be from Doris Day:<br><a href="http://www.dafont.com/doris-day.font?text=alin&amp;psize=l">http://www.dafont.com/doris-day.font?text=alin&amp;psize=l</a></p>
      <p>The r vaguely resembles Zest, and the l I've had no luck pinning down....</p>
