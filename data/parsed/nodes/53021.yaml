    <p>Braxia is a fine piece of fun inspired by the spirit of the 1930's, and has just been released on Myfonts.com</p>
    <p>For the moment the family consists of two styles, regular:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Braxia_5609.gif"></div><p></p>
    <p>and Embossed:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Braxia_Embossed_5855.gif"></div><p></p>
    <p>I see this as useful in posters and designing logos, particularly where an Art Deco flavour is wanted.</p>
