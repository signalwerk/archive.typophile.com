    date: 2004-01-07T17:04:00
    date_raw: 7 Jan 2004 — 5:04pm
    votes: null
    html: <p>I'm not aware of any cases of illicit font use that have gone to court. Generally speaking, if caught using an unlicensed font, a company will promptly pay the appropriate license fee, since this is very much cheaper than contesting the charge. Also, companies often cannot account for all the fonts on individual computers or networks, so they may not realise that the font they are using has not been correctly licensed. Companies, especially big ones with a large installation base, are beginning to realise that having unlicensed fonts exposes them legally. Recently, Agfa Monotype introduced a <a href="http://www.fontwise.com/">font licensing management tool</a> that helps companies keep track of their font licenses. It presupposes that most companies want to do the right thing and just need help doing it.</p>
