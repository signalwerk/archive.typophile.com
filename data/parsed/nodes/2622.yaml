  html: <p>Does anyone have any stories of font abuse where someone has been prosecuted? For instance, a design house using a font and not buying the license etc.. Has anyone had experience with this? <br> <br>I never really hear of anything like it in type, it sometimes seems like people can get away with it.. (or can they?) <br> <br>I found <a href="http://decisions.fct-cf.gc.ca/fct/2001/2001fct1170.html" target="_blank">this</a> in the archives.</p>
