    html: <p>On the othe hand, during ATypI-Rome RvL told me that the Apostrophe case was a very rare instance (quite possibly the <i>only</i> instance) that Emigre has gone to court (although they were also involved in the SSI thing as well). And since the Apostrophe case ended with a whimper, it might very well be that Emigre has also never <i>won</i> a court case! On the other hand, they have used the <i>threat</i> of lawsuits to some effect. Although that has also turned off some otherwise benevolent font people. On the other hand, I think it's fair to say that Emigre (and others) have now grown out of that "obsessive" phase, and hopefully will now start producing more mature <i>fonts</i> as well. <br> <br>Besides Apostrophe and SSI, I remember a big case with Linotype in Europe, but I don't know much about that one. <br> <br>hhp <br></p>
