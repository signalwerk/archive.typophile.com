    html: |-
      <p>I still think it is a valuable book even though it was born in Modernist tradition. It is more an Ulm system kind of design but the principles are still good. The thing is, it was written prior to computers so now so much of this kind of thing can be automated that it does not seem to have the intrigue it did back when it was written. The danger is that people might use it as a means without an end, making lovely progressions without meaning in communication of the message. There was "form follows function" but in this case it may be Form follows Process regardless of function. It is for the user to make it work well, not the technique to dominate.</p>
      <p>ChrisL</p>
