      <p>This is just great. Somebody posts pictures where you can't make out a damn thing, then somebody else identifies the exact font by name.</p>
      <p>Just a few things to consider:</p>
      <ul>
      <li>"Schreibmaschinen-Schriften" is just German for "typewriter faces", thus hardly a distinguishing name.</li>
      <li>Contrary to popular belief, most typewriter faces weren't specific to certain typewriter models. You could have different fonts on one model, just like today on your computer, only the changing of the font was a bit more difficult (it would have included soldering, so you chose one font when purchasing the machine and then were basically stuck with it). As far as I know though, Olivetti <em>did</em> have some exclusive typefaces on some of their machines.</li>
      <li>The Linotype "Schreibmaschine Regular" cannot possibly be the face in question, because Linotype produced composing machines, not typewriters. At best they would have some makebelieve typewriter faces on their machines to mimick a hand-typed letter.</li>
      <li>Linotype's "Schreibmaschine Regular" probably came to their Library via Berthold's "Schreibmaschinenschrift BQ" which looks identical. Berthold also didn't produce typewriters, so go figure if it's a real typewriter face ...</li>
      </ul>
      <p>Why do I bother at all? When it comes to typewriter faces, I just can't help it ... now does anybody have a <em>recognizable</em> picture of the typeface in question ... you really got me interested ;)</p>
      <p>Cheers<br>
      Jens</p>
