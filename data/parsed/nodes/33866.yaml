      <p>It looks similar to the Porsche logotype. Can’t be too hard to redraw this.</p>
      <p>If fonts are offered free, and quite a few vendors do, what’s wrong abot using them? </p>
      <p>I really feeel it should be appreciated that in markets less affluent then the west, purchasing fonts at Western prices is just beyond the economics of most graphic design projects. </p>
      <p>Let me clarify that I’m not condoning use of pirated fonts here. Or undervaluing the type designers work.</p>
