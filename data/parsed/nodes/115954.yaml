    html: <p>To me, the design DNA of Times New Roman is a quite pronounced backward leaning stress (old style stress) in the lower case, especially on the c and e, combined with high contrast and lapidary serifs. Those are the very sharp serifs one sees in stone carving. I don't think any of the examples you give really have that DNA.</p>
