      <p>I'm not saying that people shouldn't <em>use</em> Starling; I would have thought the idiomatic meaning of the title of my post was clear: here is something that even further predates Times Roman and yet looks like it.</p>
      <p>Except, of course, 1904 came before 1911... so this mistake on my part obscures what I was thinking. However, whatever sources Morison may have had, this face is presumably an independent development from Caslon, in no way influenced by the submission from W. B. Starling to Lanston Monotype.</p>
