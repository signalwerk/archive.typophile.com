    <p>This typeface, displayed in a book by Henry Taylor Wyse from 1911,</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/los5_sb_4898.jpg"></div><p></p>
    <p>looks oddly familiar. Actually, though, what with Times Roman being derived from Plantin, and Caslon being based upon the Dutch types that were popular before it, a modernized Caslon, such as Recut Caslon and New Caslon from ATF, is bound to resemble Times Roman at least a little.</p>
