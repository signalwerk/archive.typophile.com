    html: |-
      <p><cite>I'm only privy to what you've written, not what you're thinking.</cite></p>
      <p>Well, of course. However, writing is a tool used to express thought. And thoughts are sometimes expressed in writing in a fashion that, although indirect, is still transparent.</p>
      <p>Sometimes, of course, attempts at subtlety fall flat.</p>
      <p><cite>Caslon worked so long before anyone in this story, I'm not sure how he could *not* have had an effect on Morrison, Burgess, Wyse, S&amp;B, Monotype, Times, and Starling.</cite></p>
      <p>Oh, indeed. And, of course, Times New Roman, Caslon, and even Bembo and Eusebius all express the same twenty-six letters.</p>
      <p>As we do remember, though, William Burgess Starling is said to have designed a typeface in 1904 that eerily anticipates Times Roman. Some unfortunate problems involving asbestos have interfered with examining some of the evidence for that claim.</p>
      <p>Since Times Roman is basically a sharpened-up Plantin, and Plantin was a revival, as its name indicates, of course it did not spring without precedent from the brow of Zeus. Even Venus had Franklin Gothic before it...</p>
      <p>Even so, because Caslon, very much like Times Roman, was a typeface that enjoyed great popularity because it was sharp, and it was an English typeface designed in a milieu of widespread usage of the Dutch types which included the prototype for Plantin, the various modifications and imitations of Caslon are a naturally likely spot to look in to see if someone, before Starling, anticipated Times Roman just as closely. And more publicly.</p>
      <p>This might, or might not, free Stanley Morison from the charge of plagiarism. But it would have at least some impact on the question of whether Starling was the "real" inventor of Times Roman.</p>
      <p><cite>I don't think any of the examples you give really have that DNA.</cite></p>
      <p>As a point of clarification, just in case: Antique Roman, Antique Old Style and Old Style Antique were presented for comparison with <em>Bookman</em>. Only Lining Old Style No. 5, presented in two of the examples, was intended for comparison with Times Roman.</p>
      <p>The letters b, c, d, p and q have some slight reverse stress, now that you mention it, but that might be nothing new; and o, for example, certainly doesn't have any.</p>
