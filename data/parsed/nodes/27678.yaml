    <p>Hi guys!</p>
    <p>The past week I've been working on my very first font made from scratch. What started off as 10 custom letters for an illustration I was working on quickly became a 3-piece fontset (so far) including all possible accents I could find &amp; a complete DIY-construction dingbat. I'm still working on everything, but since I won't be having any time the next few days, I thought It'd be a good time to post it here for some professional comments &amp; advice. Please be gentle though seeing as this is my first time &amp; I don't have any typographic background. I'm just a simple admirer whose real roots lie in illustration.<br>
    I've tried to make a handwritten font with a monotype attitude. It's not a real monotype, but all characters are based on the same lines &amp; I've made sure that the "baseline curves" are always vertically aligned so you won't get a messy "scale effect". Having put aesthetics before comfort, this adds a little to its legibility, but it's still not the kind of font you'd want to use for more than a paragraph. The dingbat follows the same thread as to be beeing semi-monotype &amp; interacts perfectly with the typeface. I'm still working on some more plants, hills &amp; critters to enable the user to create his very own "candyland" of sweet flavoured things.<br>
    A full character map might follow some day, but in the meantime requests &amp; suggestions will be kindly appreciated ;-)<br>
    Hope you all like it!</p>
