      <p>No, I hadn't even thought about that, but I wanted to make the letterjoints the same curve as the letters themselves so if you type a shorter letter on a different line at the same height, the curves will still be vertically aligned. If I'd make the joints shorter, I would either have to make a real monotype font òr settle for a scale-like effect.<br>
      Might be nice for a more legible alternative though (one in which I could make a regularly stemmed m &amp; n as well ;-) ).<br>
      I haven't had much time to work on it the past few days (just a few extra dingbats), but I have been thinking about adding less decorative caps as well that I could also use in a segment (which doesn't look good &amp; not at all legible now).<br>
      Don't know how far I really want to take this since I originally only wanted to make 10 custom letters, but there's still lots of things I can experiment with.</p>
