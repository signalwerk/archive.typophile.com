      <p>Actually, the m was the first letter I made ;-)<br>
      I've kind of grown fond of its handwritten look &amp; although I hàve considered taking a bowl off of the m &amp; n for legibility, I just didn't have the heart to change them.<br>
      I have also considered an italic version, but that would screw up the entire "baseline wave" &amp; is probably way too advanced for me.<br>
      I might do a bolder outline version (with the current strokes in white centered in thicker black strokes to obtain 3 equally thick optical strokes).<br>
      I have no intentions of putting this up for sale, but it's nice to have options ;-)<br>
      Besides, I also included a simplified version of Tim Biskup's (<a href="http://www.timbiskup.com/" title="http://www.timbiskup.com/">http://www.timbiskup.com/</a>) "helper" &amp; San Rio's "hello kitty" (which -with a slight alteration in the second word- makes a fun combination with the turd in the 3rd row ;-p ) for personnal use. I'll try to contact them both to make sure they don't object to this (I'll leave out the turd part though).</p>
