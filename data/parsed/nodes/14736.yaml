      <p>And Seb, if like me you're using InDesign in it's French version:</p>
      <p>InDesign Menu:<br>
      Texte &gt; Insérer une espace &gt; Insérer une espace fine</p>
      <p>Tu peux aussi utiliser l'espace mi-fine dans certains contextes, mon choix à ce niveau dépend surtout de la taille de caractères ou du dessin de la typo.</p>
      <p>Non-breaking in French = Insécable</p>
      <p>ciao ciao</p>
