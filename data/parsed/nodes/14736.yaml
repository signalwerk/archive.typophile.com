    <p>Hi,</p>
    <p>I've been using InDesign for some time now, but there are a few things I still don't get. Can anyone tell me what are <em><a href="/wiki/figure%20space" class="freelinking" rel="nofollow">figure space</a>, <a href="/wiki/flush%20space" class="freelinking" rel="nofollow">flush space</a>, <a href="/wiki/punctuation%20space" class="freelinking" rel="nofollow">punctuation space</a></em> and how to use them. </p>
    <p>I work mostly in French and according to a french typography guide I need to use a <em>non-breaking hair </em>and/or<em> thin space</em>. But that doesn't seem to come standard with InDesign. Has anyone got an idea to how I can achieve this?</p>
    <p>Cheers</p>
    <p>Seb</p>
  html_clean: |-
