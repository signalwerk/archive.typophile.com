      <p>Seb, regarding the non-breaking thin/hair spaces (which I don't believe exist) you can always use a hack such as inserting a non-breaking (word) space and reducing its width in the Character palette. I had to do something similar a while back when I was setting a book with a lot of dashes: I wanted to use thin-spaced en-dashes, but InDesign does very strange things with this sort of combination, so instead I used word-spaced em-dashes and condensed the width of the 3-part string to 65%. Normally I would never recommend glyph scaling, but in this case we're talking about characters that will not be visually distorted by doing so (blank spaces, dashes).</p>
      <p>This is, as Hrant often says, an inelegant solution, but a solution nonetheless.</p>
