    html: |-
      <p>A figure space has the width same with as the lining numbers.<br>
      Punctuation space has the width of a period.<br>
      Flush space is a variable-width space that will change its width to fill the last line in a justified paragraph, while keeping the other spaces normal. The ID help has an example, look for "flush space".</p>
      <p>The thin space is under Insert -&gt; White space. So is the normal non-breaking space. Non-breaking means the two words separated by such a space won't be split in different lines.</p>
      <p>Hope that helps!</p>
