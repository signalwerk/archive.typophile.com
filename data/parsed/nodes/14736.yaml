    html: <p>Sebastian, in InDesign CS, under 'type' you will find the option 'insert white space', and listed are em space, en space, flush space, hair space, nonbreaking space, thin space, figure space, and punctuation space. (I have the ME version, but I don't think this makes a difference.) I don't know if it depends on the font what is available--InDesign may have default widths--but in Adobe Jenson, which I am using now, there are keyboard short cuts to insert most of these spaces also.</p>
