      <p>Seb, one can include a large number of spaces into one's OpenType fonts. (I do, because it's very easy to do so, and they may be called on by people such as yourself.) The relevant Unicode page is here:<br>
      <a href="http://www.unicode.org/charts/PDF/U2000.pdf" title="http://www.unicode.org/charts/PDF/U2000.pdf">http://www.unicode.org/charts/PDF/U2000.pdf</a></p>
      <p>Page three describes the various spaces, most of which travel with an accompanying dash. </p>
      <p>The figure space should be the width of the tabular numerals in the font: useful when setting tables.<br>
      The punctuation space should be the width of basic punctuation. (In a well-built font, this means the period, comma, colon, and semicolon.)</p>
      <p>As you mention, French setting requires a thin space preceeding "tall" punctuation: colon, semicolon, question, exclamation, etc.</p>
      <p>How you can achieve this in InDesign, I cannot say. It would be great to have a Stylistic Set which adds that spacing for you. (This is not a difficult task.)</p>
