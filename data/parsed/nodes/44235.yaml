      <p>Looking at Cthulhu puts weird stuff like that in one’s head. </p>
      <p>And since it came up, that’s the coolest promo piece I’ve seen in a long while. Whoever designed that thing and got a client to sign off now has more nerd cred than anyone save Bill Gates. Of course, maybe I’m not the best judge seeing as how I named my thesis typeface after a character in <em>The Dunwich Horror</em>.</p>
