    html: "<p>Welcome to Typophile, Don! <br> <br>I certainly agree with you that Blackletter is a rich, and varied medium, which can be used just like any other tool for the right purpose. However, I disagree with two other things that you mentioned in your post. <br> <br>First, the second world war has everything to do with the decline of blackletter as a used typeface style(s). Blackletter today serves a number of decorative roles in design and society. But pre-1930, it was used for a wider scope of design roles. Today, most Germans avoid Blackletter like the plague, because they associate it with Nazism (and people's assumptions are often more powerful and convincing that the truth). This reaction is especially true in younger Germans, in my experience, even among graphic designers (who should know their type history better).  <br> <br>Books just aren't printed with Blackletter types anymore, neither in Germany nor elsewhere. Blackletter may still be seen the world over (even in Germany, especially on things that are supposed to look old, or on beer labels), but it has been relegated to a much less significant, and more superficial place. <br> <br>Secondly, it wasn't Claude Garamond in c.1540 who struck the death-blow to Blackletter as text in non-Germanic countries, but rather the duo of German printers and Italian patrons in the 1460s and 70s. Especially Nicholas Jenson (okay, he wasn't really German, but he was a Gutenberg apprentice in Mainz, I think). <br> <br>The Italians never embraced Blackletter printing. Even their more-native Rotunda hands didn't get much press. The Renaissance Humanists wanted \"Roman\" looking letters. They actually got Frankish letters, but they couldn't tell the difference <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  <br> <br>They never took to Textura or Schwabacher, like patrons in Germany (and Holland, England, Scandinavia, etc) were doing. And by the time that the Holy Roman Emperor commissioned the design of Fraktur, there was a stylistic split across Europe which would soon become ideological: Luther's works were solely printed with Schwabacher and Fraktur types, making them \"Protestant\" type. A southern Catholic would have used those letters for his books at his peril.</p>"
