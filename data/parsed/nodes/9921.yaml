    html: "<p>Here's a theory: Blackletter was a trendy face worldwide (as part of the Arts &amp; Crafts movement that was such a force in the first mass media) at the time of the Mexican Revolution. Perhaps that association has imbued it with a Mexican-ness.</p>"
