    html: <p>In my above post, I generalized with the term "southern Catholic." I really meant the countries south of Germany, from 1517 onward. <br> <br>I should point out as an additional aside that, in Southern (i.e., Catholic) Germany, Textura was still used during the Reformation and Counterreformation to set religious texts in Latin, and that was OK. After a certain point (I can't put a date on this), there wouldn't have been any "Protestant" stigma attached to any sort of lettering style within the German-speaking countries; I suspect that this was after the Catholic Church in Germany felt comfortable enough with the relative success of their Counterreformation. <br> <br>However, were I a printer in Rome in the 1600s, I would not have tried printing anything for the Pope with Fraktur</p>
    html_clean: <p>In my above post, I generalized with the term "southern Catholic." I really meant the countries south of Germany, from 1517 onward. <br> <br>I should point out as an additional aside that, in Southern (i.e., Catholic) Germany, Textura was still used during the Reformation and Counterreformation to set religious texts in Latin, and that was OK. After a certain point (I can't put a date on this), there wouldn't have been any "Protestant" stigma attached to any sort of lettering style within the German-speaking countries; I suspect that this was after the Catholic Church in Germany felt comfortable enough with the relative success of their Counterreformation. <br> <br>However, were I a printer in Rome in the 1600s, I would not have tried printing anything for the Pope with Fraktur</p>
