    html: "<p>Looking at that Reebok site, I got this idea: why not marry a revival of blackletter with all-lc setting? This might make sense on a number of levels: blackletter UC is (traditionally) illegible (to those who only know the Roman structures); German text has too many caps (at least many Germans think so); one reform will keep the other company, so to speak*. Noting that Otl Aicher set the German text in his Typographie in all-lc. &lt;preempt&gt;Yes, and in Rotis too...&lt;/preempt&gt; <br> <br>* Although I'm personally a huge fan of mixed-case text; I'm just thinking of an angle to break the ice (faster). <br> <br>hhp</p>"
    html_clean: "<p>Looking at that Reebok site, I got this idea: why not marry a revival of blackletter with all-lc setting? This might make sense on a number of levels: blackletter UC is (traditionally) illegible (to those who only know the Roman structures); German text has too many caps (at least many Germans think so); one reform will keep the other company, so to speak*. Noting that Otl Aicher set the German text in his Typographie in all-lc. &lt;preempt&gt;Yes, and in Rotis too...&lt;/preempt&gt; <br> <br>* Although I'm personally a huge fan of mixed-case text; I'm just thinking of an angle to break the ice (faster). <br> <br>hhp</p>"
  - id: 63172
    user: 6331
    date: 2005-04-06T09:00:00
    date_raw: 6 Apr 2005 — 9:00am
    votes: null
    html: "<p>As a mexican graphic and type designer I have to attest to the amazing multiplicity of blackletter in the country. The diversity and originality of the shapes and how they are used is quite inspiring.  <br>It is used everywhere: bars, meat vendors, markets, clothing shops, ice cream or hot dog carts, street snacks, taxis, buses, restaurants, etc. etc.  <br>I made quite an extensive photographic research, trying to figure out the exact meaning of it, like what exactly it is conveying, elegance? tradition? heat? but everytime I found an instance defying convention. I think it is something engraved in the Mexican subconscius. <br>Furthermore, the sign painters have not stayed stuck to the traditional model, of course. There are places where truly original designs are evolving (more jungle-like, funky, luscious) <br>It is so fun! <br>d <br> <br>ah!, another funny thing. Corona's logo (the famous beer) is made with blackletter in Mexico, but not in europe (?) <br> <br><img src=\"http://www.typophile.com/forums/messages/30/68975.jpg\" alt=\"mexican gothic lettering\"></p>"
    html_clean: "<p>As a mexican graphic and type designer I have to attest to the amazing multiplicity of blackletter in the country. The diversity and originality of the shapes and how they are used is quite inspiring.  <br>It is used everywhere: bars, meat vendors, markets, clothing shops, ice cream or hot dog carts, street snacks, taxis, buses, restaurants, etc. etc.  <br>I made quite an extensive photographic research, trying to figure out the exact meaning of it, like what exactly it is conveying, elegance? tradition? heat? but everytime I found an instance defying convention. I think it is something engraved in the Mexican subconscius. <br>Furthermore, the sign painters have not stayed stuck to the traditional model, of course. There are places where truly original designs are evolving (more jungle-like, funky, luscious) <br>It is so fun! <br>d <br> <br>ah!, another funny thing. Corona's logo (the famous beer) is made with blackletter in Mexico, but not in europe (?) <br> <br><img src=\"http://www.typophile.com/forums/messages/30/68975.jpg\" alt=\"mexican gothic lettering\"></p>"
