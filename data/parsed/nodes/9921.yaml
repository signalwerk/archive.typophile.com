mperor commissioned the design of Fraktur, there was a stylistic split across Europe which would soon become ideological: Luther's works were solely printed with Schwabacher and Fraktur types, making them \"Protestant\" type. A southern Catholic would have used those letters for his books at his peril.</p>"
