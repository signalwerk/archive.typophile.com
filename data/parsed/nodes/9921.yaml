  html: |-
    <p>Hey,</p>
    <p>I am wondering what <a href="/wiki/blackletter" class="freelinking" rel="nofollow">blackletter</a> faces are usually used for. I should mention that I am from <a href="/wiki/New%20Zealand" class="freelinking" rel="nofollow">New Zealand</a>, which is a very, very young country. The only time I see blackletter faces around here are for fashion labels (on the goth bandwagon) and heavy metal record covers. Or not-heavy-metal-record-covers that are being ironic. The covers are mostly foreign (i.e. American, British) anyway.</p>
    <p>Oh right, and on newspaper titles.</p>
    <p>So, where else arethey be used?</p>
    <p>- Chris</p>
  html_clean: |-
