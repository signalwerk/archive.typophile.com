    html: <p>Actually, a fixed pen angle is not required in "Western calligraphy" at all, although it does tend to be a norm in most hands from what I can tell. The three parameters are translation (movement in the Cartesian plane), rotation (of the pen) and pressure (which releases more ink, with the correct type of pen). In fact, even in hands that are based on a fixed angle you get the occasional exception (depending on the letter "skeleton" - think of the "z"), to avoid ungainly results. <br> <br>BTW, there's quite an uncanny similarity between certain Celtic manuscript motifs and certain Armenian ones, including the famed knotwork... And from what I understand there are at least two scholars working to figure this out. <br> <br>hhp</p>
