    html: |-
      <p>Hi,<br>
      As I just recently stumbled about this forum, I hope there is still someone...<br>
      Now my Question:<br>
      I am doing now the final project in my graphic design studies and my theme is treating the<br>
      recognition and usage of blackletter typefaces in our times.<br>
      As I am german it is pretty clear to me how it is in the german speaking area.<br>
      What I am more interested in is how other cultures see and "feel" those typefaces.<br>
      What associations are made and so on...</p>
      <p>So, I am really interested in other points of you, far from the beer and nationalist cliché.</p>
      <p>@diego m: Maybe I could contact you to get to know the latino point of view?</p>
      <p>I am happy about all replys, Thank you</p>
