    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Design%20Firms" class="freelinking" rel="nofollow">Design Firms</a> : Atelier télescopique</strong></p>
    <p><a href="/wiki/Stephane%20Meurice" class="freelinking" rel="nofollow">Stéphane Meurice</a>, <a href="/wiki/Sebastien%20Delobel" class="freelinking" rel="nofollow">Sébastien Delobel</a>, <a href="/wiki/Xavier%20Meurice" class="freelinking" rel="nofollow">Xavier Meurice</a>, <a href="/wiki/Guillaume%20Berry" class="freelinking" rel="nofollow">Guillaume Berry</a> and <a href="/wiki/Baptiste%20Servais" class="freelinking" rel="nofollow">Baptiste Servais</a> comprise l'<strong>Atelier télescopique</strong> and it's companion type foundry, <strong><a href="/wiki/AinsiFont" class="freelinking" rel="nofollow">AinsiFont</a></strong>.<br>
    This closely knit team of designers based in Lille, <a href="/wiki/France" class="freelinking" rel="nofollow">France</a> opened its studio in <a href="/wiki/1998" class="freelinking" rel="nofollow">1998</a>.</p>
    <p>URL: <a href="http://www.ateliertelescopique.com" rel="nofollow">Atelier télescopique</a> (studio website).</p>
