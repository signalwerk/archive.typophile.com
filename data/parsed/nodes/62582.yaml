    <p>I am looking for a good serif font to use for headlines in a newspaper. I will pick the font for the body based on the headline font so that is not an issue.</p>
    <p>I like Le Monde journal, if you can recommend fonts that are similar to that one - that would be great.</p>
    <p>Thanks in advance.</p>
