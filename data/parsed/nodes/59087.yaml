    <p>Even though I have two other fonts 'in development' (<a class="freelinking external" href="http://typophile.com/node/57716" rel="nofollow">here</a> and <a class="freelinking external" href="http://typophile.com/node/36588" rel="nofollow">here</a>), I just really enjoy drawing characters and I wanted to share the outcome of a recent doodling session with you.</p>
    <p>A hard high contrast script that takes inspiration from <a class="freelinking external" href="http://www.identifont.com/samples/linotype/BuckinghamFraktur.gif" rel="nofollow">cursive frakturs</a>, <a class="freelinking external" href="http://www.ameshistoricalsociety.org/images/dictionary_penmanship3.jpg" rel="nofollow">old penmanship</a> -- but with a sharp twist. Which, in turn might have been influenced by Underwares take on blacklettering with <a class="freelinking external" href="http://www.underware.nl/site2/index.php?id1=fakir&amp;id2=overview" rel="nofollow">Fakir</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/flatscript1_4965.png"></div><p></p>
    <p>a-z + ß<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/flatscript2_3498.png"></div><p></p>
