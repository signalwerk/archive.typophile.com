    date: 2009-09-23T06:49:00
    date_raw: 23 Sep 2009 — 6:49am
    votes: null
    html: |-
      <p>Sorry, I hadn't noticed someone replied here.</p>
      <p>Thank you for the comments.<br>
      I agree that the hairlines should become a bit thicker, which might also help the 'c' and 'a' become more easily recognizable as such.</p>
      <p>The difference between the 'h' and 'n' is due to the 'm'. The 'm' doesn't work with the inward bend on the last stroke, so I tried and outward bend there. Then the 'n' had to be a close match to the 'm', so got the same outward bend. That whole outward ebnd might not be working very well, because it is only used in 'n' and 'm' as outward, while on other characters 'a', 'u', etc. it is used as inward. Which might confuse the reader.</p>
      <p>I find it hard to proceed with this script, though. Especially because of the right-tilted brush-stroke. If anyone knows of any examples of scripts with a right-tilted brush-stroke, please let me know.</p>
