    html: |-
      <p>Very fascinating script. There's a very appealing irregural rhythm to it.</p>
      <p>I think there could be a bit too much stress on the upright strokes, though. There's not much distinction between 'a' and 'u', for example. The loop of the 'e' and the curve of the 'c' are also a bit difficult to see.</p>
      <p>Why are the 'h' and 'n' different in structure? I would prefer a similar arc in the latter as in the former.</p>
      <p>I realize a part of the visual appeal of the script is in its stroke-contrast, but it could be a bit more readable if the hairlines were a touch thicker. (I don't mean as thick as in Gneisenauette, though.)</p>
