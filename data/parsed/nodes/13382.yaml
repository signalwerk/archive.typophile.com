      <p>I would like to see the M working with a non-symmetrical ornament, or rather, less symmetrical than the one you have. The colour of the type is overwhelming the gradation. Have you looked at using the ornament and M as the focus and have the name of the business below as completely subordinate. The tagline has too much tracking and should use small caps as the W is way too heavy for the rest of the line. And the ME in MEMORY could do with a touch more space and to align the top serif with the lefthand serif of the M. Having said that it does present a strong concept.<br>
      Tim</p>
