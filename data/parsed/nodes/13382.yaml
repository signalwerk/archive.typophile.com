    <p>Hi everyone! I’m so excited to have found you finally. Someplace to direct my typeface fetish, shh…</p>
    <p>Anyway, first order of business:<br>
    A Logo for an online Scrapbooking supply store called The Memory Loft.<br>
    The basic idea is classic, but not stuffy.<br>
    Clean but detailed.<br>
    Controlled, but also indulgent.<br>
    Something to aspire to and be inspired by.<br>
    Design elements pastiche from roman, gothic, victorian architecture.</p>
    <p>Here is the design I have been tweaking on for a while:</p>
