      <p>I would second crugens comments.  I read it as The M Memory Loft.</p>
      <p>I also think, you are losing some of the core aspects of a scrap book, which is the idea of “made by hand”.  I guess you are touching on that with the script face, but when I think of scrap books I think of tape, glue, torn edges, and lots of handwriting.</p>
      <p>That said, I like the classic aspect you are working into this.  Sort of like if Tolleson were making a scrapbook (i.e. reference the classic, and refine it to a diamond.)</p>
      <p>not into the gradient so much.  neither the capitol small cap W, not needed really.</p>
      <p>I’d also think of some kind of frame for this.  think old books, old scrapbooks.  They always have such cool frames around their titles.</p>
      <p>anyways…</p>
