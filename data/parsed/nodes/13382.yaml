      <p>I am sorry for lateing to answere this. I was busy and not connecting the Typophile forum. </p>
      <p><em>shawkash, I’m having trouble finding an M with a smoother/higher charge that also flows with the rest of the design. Any suggestions for a typeface?</em></p>
      <p>My own advice for you, is to go for a Calligraphic form, which is clean and readable. May be like Roman Calligraphy because Roman is reflecting the old times and classic, also because it is still gives 2 aspects of calligraphy and some type feeling.</p>
      <p>You may also open it in your vector editor (Freehand or illustrator or any ) and begin to convert your fonts to paths, and draw a dynamic relation between M and other 2 words beside it.</p>
      <p>This is my own suggestion, I think it will save your time rather than going to branch ideas like the 3 expriment you sent here. Btw, good jo b at expriment 3. I just found the orienment is not the same quality like the first.</p>
