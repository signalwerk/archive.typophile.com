      <p>James, I like the mark as a mark. It’s visually diverse and grabs my eye. But the moment I try to get something more from it, it’s a 4-way traffic jam. If I had final say, I’d say “drop the ‘memory’ part”, but it’s ‘The Memory Loft’, not ‘The M Loft’ (which I kind of like more, but that’s irrelevant here). It works if you don’t try to read it. The visual scale shifts too dramatically from element to element, particularly since they are meant to be read in a line.</p>
      <p>I’d suggest either figuring out which elements to eliminate/visually supress, or let this beautiful and florid creature go. I’m in love with the M and the ornament, but love doesn’t make a good logo, unfortunately. Also, ditch the full cap ‘W’ in the tagline, or use full initial caps on every word. The ‘W’ disrupts the symmetry.l</p>
      <p>Perhaps if you shrink and track the word ‘memory’ it’ll work, as shawkash suggested? Make ‘memory’ as out-of-the-way as you can, since the viewer only needs it once to decipher the meaning of the ‘M’. This may backfire at small sizes, though. This all hinges on how happy the client is with the idea that they’ll almost inevitably end up ‘The M Loft’ in people’s minds. It’s a great start, but you may need to backpedal.</p>
    html_clean: |-
