    <p>I’ve been looking a typeface lately for a prodject, and was wondering if anyone knew of a suitable subsitute for HFJ’s Gotham. I realy like the forms, but I’m not interested in purchasing the entire family, maybe just 2 or 3 weights. Does anyone know of a typeface that would give the same mood thats available à la carte?</p>
    <p>Thanks in advance!</p>
