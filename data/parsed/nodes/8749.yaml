    votes: null
    html: <p>Well Mark, that suggestion was supposed to make it simpler for you use your OWN judgement about which fonts were similar enough to meet your needs, rather than have me guess. Those portions of the Guide are not big, and you only need to see related styles instead of looking at all scripts. <br> <br>Since you can't spare the time (unlike us, apparently), I would suggest Orion Script (on one of the Dover font CD's with Solotype fonts) or <a href="http://www.fonts.com/findfonts/detail.asp?pid=206358" target="_blank">Saxony Script</a>, or else my original suggestion of buying the Mac version. <br> <br>Sorry to keep you waiting.</p>
