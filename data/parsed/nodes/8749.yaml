    html: <p>I have numerous Mac fonts, and I would love to be able to use one I already own. Can anyone suggest a similar-looking Mac font?</p>
    html_clean: <p>I have numerous Mac fonts, and I would love to be able to use one I already own. Can anyone suggest a similar-looking Mac font?</p>
  - id: 57449
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>Mark, asking us to guess which similar Mac fonts you might have is a bit difficult. Almost any commercial font is available in Mac &amp; PC formats, it's  'freeware' that is often only available in one format.  <br> <br>My suggestion is to search through the <a href="http://bowfinprintworks.com/ScriptIDGuide.html" target="_blank">Script Font ID Guide</a>, Parts 1, 2, 7 and 8, and see which fonts resemble Vladimir to your eye, and see if you have them in your collection.</p>
    html_clean: <p>Mark, asking us to guess which similar Mac fonts you might have is a bit difficult. Almost any commercial font is available in Mac &amp; PC formats, it's  'freeware' that is often only available in one format.  <br> <br>My suggestion is to search through the <a href="http://bowfinprintworks.com/ScriptIDGuide.html" target="_blank" class="link-external">Script Font ID Guide</a>, Parts 1, 2, 7 and 8, and see which fonts resemble Vladimir to your eye, and see if you have them in your collection.</p>
  - id: 57450
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>I've had pretty good luck using FontAgent Pro on Mac OS X to use PC TTF fonts. This utility is produced by Insider Software. You just copy the font file over and use it directly; you don't need to convert it or anything. <br> <br>If you send me the font I can test it out for you. <img src="http://www.typophile.com/forums/clipart/blush.gif" border="0"> Just kidding! Actually, I already have Vladimir. I don't need or want a pirated copy. <br> <br>Seriously, I recommend using FontAgent Pro since it avoids file conversion, and it seems to be able to use most PC TTF fonts directly.</p>
