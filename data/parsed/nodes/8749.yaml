    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>As a die-hard OS 9 user, I was hoping there was someone who could eyeball the font and say, akin to Arial or Univers or Swiss, "Use Helvetica on the Mac." <br> <br>Once I have Quark OS X (on the way), these issues will go away--I assume I'll just use the PC font in its native .TTF file format. <br> <br>I always assumed this board was created so that designers wouldn't HAVE to use "the Script Font ID Guide, Parts 1, 2, 7 and 8, and see which fonts resemble Vladimir to your eye".</p>
