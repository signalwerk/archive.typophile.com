    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 14.May.2008 3.04am </div>
      <p>Howdy Friends,</p>
    <p>We are pleased to announce the arrival of many great new and exclusive releases this month at Font Bros!</p>
    <p>Fontalicious - Looking for one of those rare gems from the Fontalicious library and can't find it? Look no further my friend! Many of these classic fonts have been regenerated in OpenType (postscript) format from the original font files! We call them Fontalicious Classics and with more added every month, you'll call 'em SWEET! Check 'em out at: <a href="http://www.fontbros.com/fontalicious.php" title="http://www.fontbros.com/fontalicious.php">http://www.fontbros.com/fontalicious.php</a></p>
    <p>Fonthead - InfoBits is a two-font system of dingbats with a strong technology theme. The complete family has 188 icons. Check it out at: <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=FODE-IBCO" title="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=FODE-IBCO">http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=FODE-IBCO</a></p>
    <p>Harold's Fonts - YES! a genuine new typable Monogram font from Harold! Pen Script Monograms was inspired by 1940s department store lettering in some old newspaper advertising I found. Use it to create custom 3-letter monograms in a calligraphic with a choice of frames. Check it out at: <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=HAFO-PSMO" title="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=HAFO-PSMO">http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=HAFO-PSMO</a></p>
    <p>Outside-the-Line - TWO great new dingbat faces this month for your pleasure! Home Sweet Home Dingbats is a 30 dingbat font of home things. Use them as dingbats or enlarge the small pictures and use them as clipart. Silhouettes include several lamps, clock, chaise, chairs, sofa, nightstand, chest, TV &amp; remote, tables, stool, steps, beds, mirror, art, a fireplace and even a baby grand piano. Check it out at: <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=OUTL-HSHD" title="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=OUTL-HSHD">http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=OUTL-HSHD</a></p>
    <p>Food Doodles Too - Food Doodles Too is a 31-picture clipart font of food. Use them as dingbats or enlarge the small pictures and use them as clipart. Lots to choose from...from soup to nuts – OK, no nuts. But there is pizza, pasta, soup, eggs, sushi, sandwich, hot dog, hamburger, fish, kabobs, toast, breads, cheese, pickles, shrimp, soufflé, and desserts galore...cake, pie, cookie, cupcake, trifle, sundae, banana split, milk, tea and more. Check 'em out at: <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=OUTL-FOD2" title="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=OUTL-FOD2">http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=OUTL-FOD2</a></p>
    <p>Sideshow - FOUR BRAND NEW FONTS! - Sideshow has been busy as ever and you're sure to find a sweet new font from this hip retro foundry!</p>
    <p>Coffee Service - Whether you prefer Drip or Automatic, there is nothing quite like quality Coffee Service! This speedy retro script has a generous x-height and is Chock Full 'o OpenType automatic ligatures so it sets perfectly every time! One sip and you'll agree, there's nothing finer than Coffee Service!</p>
    <p>Goofball and Goofball Alternate - Goofball is yet another wacky decorative typeface from Squid and Sideshow. As with most of his art and font design, Goofball is derived from Squid's cluttered childhood recollections of greeting card and advertising lettering. Somehow it got all mushed together in his noggin and out came Goofball!</p>
    <p>Goofball and Goofball Alternate each contain their own totally unique lowercase characters and can be intermixed to create a unique look! Buy both as part of the Goofball Family and save a buck 'er two! Check 'em out at: <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=SIDE-GOOF" title="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=SIDE-GOOF">http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=SIDE-GOOF</a> and <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=SIDE-GOAL" title="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=SIDE-GOAL">http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=SIDE-GOAL</a></p>
    <p>Savage Hipsters - Savage Hipsters was designed by German pinstriper Tom Plate for Sideshow and all you little retro kustom beatniks. Put some bebop in your art - use standard for melody, caps lock for rhythm. Comes with Regular and Way Out caps. Go Crazy Daddio! Check out Savage Hipsters here: <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=SIDE-SAHI" title="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=SIDE-SAHI">http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=SIDE-SAHI</a></p>
    <p>With so man new fonts this month, you're sure to find plenty that tickle your innards! And as always, if you see something you like, tell a friend you saw it at Font Bros! <a href="http://www.fontbros.com" title="http://www.fontbros.com">http://www.fontbros.com</a></p>
    <p>Warmly,<br>
    Mike &amp; Stuart<br>
    The Font Bros</p>
