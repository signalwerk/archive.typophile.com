    <p>Hi Folks, </p>
    <p>This old movie title type is eluding me. The closest I found was Nick Curtis' version of the Saturday Evening Post type that he called "Saturday Morning Toast". It's at least from a typeface older than the movie, but it's not a great match. The rounded tops of the R and B should be good earmarks, but this may never have been digitized. I looked in the McGrew book, skimmed the Solotype Catalog, and even looked in a Photo-Lettering catalog.</p>
    <p>Anyone have any ideas?</p>
    <p>Thanks,<br>
    - Mike</p><div class="imageWrap"><img src="http://typophile.com/files/RebelGirls_6137.gif"></div><p></p>
