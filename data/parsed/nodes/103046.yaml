      <p>The tops of the R and B are similar to <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/perpetua/?refby=bowfin" rel="nofollow">Perpetua</a>, but that's almost all that seems similar. I think that's why I thought this looked familiar at first, but clearly not the same type.</p>
