      <p>It’s LSC Book, which used to be part of the ITC library. There’s no authorized digital version as far as I know.</p>
      <p>Now, LSC Book wasn’t released until around 1970, so you might think that would rule it out. However, the film was originally titled <em>Cuban Rebel Girls</em> when it was released. In a later reissue of the film, the title was changed to <em>Assault of the Rebel Girls</em>. I don’t have a date for that, but judging by the type it was after 1970. (More info <a href="http://www.imdb.com/title/tt0052717/releaseinfo?ref_=tt_dt_dt#akas" rel="nofollow">here</a> and <a href="http://www.scoopy.com/cubanrebelgirls.htm" rel="nofollow">here</a>.)</p>
