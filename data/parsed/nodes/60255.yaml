      <p>For free script fonts, check Dafont.com. If you want brandname (commercial) fonts, you need to license them. Period.</p>
      <p>Your photobucket link doesn’t take me to any picture. I think you need to isolate the image you want to show us.</p>
      <p>The GARAGE font looks like some of the House Industries “Shag” stuff, which also means it may be like some of their Benguiat fonts. This is a sort of late 60’s look, I think, and it seems to be coming back. Jason Walcott at Veer also has done some revivals of fonts from this era.</p>
      <p> - Mike Yanega</p>
