    <p>First of all, I’m looking for Bistro Script and Monterey, or any other similar retro-cursivey one! If anyone can drop me the name of a free one that might be out there, it’d me much appreciated.</p>
    <p>Second, I’d love the font used in this flier:<br>
    <a href="http://img.photobucket.com/albums/v249/isa-ma-bel/dangerous.jpg" title="http://img.photobucket.com/albums/v249/isa-ma-bel/dangerous.jpg">http://img.photobucket.com/albums/v249/isa-ma-bel/dangerous.jpg</a></p>
    <p>or the font used to spell ’garage’ on this album cover:<br>
    <a href="http://www.sundazed.com/shop/images/SC11139-300.jpg" title="http://www.sundazed.com/shop/images/SC11139-300.jpg">http://www.sundazed.com/shop/images/SC11139-300.jpg</a></p>
    <p>or any other font that may carry the same characteristics.</p>
    <p>Thanks so much to anyone who can help me out!</p>
    <p>-Isabel</p>
