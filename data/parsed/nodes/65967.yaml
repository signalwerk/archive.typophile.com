    <p></p><div class="imageWrap"><img src="http://typophile.com/files/4fonts_january2010_4060.png"></div><p></p>
    <p>Every two months, we offer a font discovery pack at a very affordable price compared to regular prices when purchased with the rest of a family. From € 98. You save approximately 30%. <a class="freelinking external" href="http://allumi.typofonderie.com/" rel="nofollow">Allumi PTF is included!</a></p>
    <p>If not interested by such offers, at least you can still <a class="freelinking external" href="http://allumi.typofonderie.com/free-dingbats-font" rel="nofollow">download the free Allumi PTF Dingbats fonts from here.</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/4fonts_a_january2010_5935.png"></div><p></p>
    <p>This new Font Discoveries pack is a good way to discover our fonts at an affordable price. <a class="freelinking external" href="http://www.typofonderie.com/alphabets/fontdiscoveries/fonts_january2010 " rel="nofollow">Jump on the January 2010 Font Discoveries</a> for more info about the 4 fonts included: Allumi PTF Demi, Ambroise Std Bold, Le Monde Sans Std Italic, Anisette Std Petite Black. <a class="freelinking external" href="http://www.typofonderie.com/icono/alphabets/pdf/FontDiscoveriesJanuary2010.pdf" rel="nofollow">The available pdf present the 4 fonts(January 2010 Font Discoveries pdf specimen</a> in various contexts, samples in use, glyph sets and and so on.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/FontDiscoveriesJanuary2010__4416.png"></div><p></p>
    <p><a class="freelinking external" href="http://www.typofonderie.com/alphabets/special_offers/fontdiscoveries" rel="nofollow">Font Discoveries page</a><br>
    <a class="freelinking external" href="http://www.typofonderie.com/alphabets/special_offers/fontdiscoveriesjanu2010" rel="nofollow">Font Discoveries January 2010</a><br>
    <a class="freelinking external" href="http://www.typofonderie.com/icono/alphabets/pdf/FontDiscoveriesJanuary2010.pdf" rel="nofollow">Font Discoveries January 2010 pdf specimen</a><br>
    <a class="freelinking external" href="http://www.porchez.com/article/577/font-discoveries-january-2010-in-use-samples" rel="nofollow">Font Discoveries January 2010: in use samples</a></p>
    <p><a class="freelinking external" href="http://issuu.com/typofonderie/docs/fontdiscoveriesjanuary2010" rel="nofollow">Font Discoveries January 2010 via Issuu.com</a></p>
    <p>Each offer is normally available for 2 months only. But because of the new year, we bring back to you <a class="freelinking external" href="http://www.typofonderie.com/gazette/hot_news/?id=415" rel="nofollow">the four Font Discoveries packs for a limited time: Available until the 29 January 2010.</a> So, don’t miss this unique opportunity to recreate some families at very affordable price (you save approximately 30% on usual prices).</p>
    <p>→ <a class="freelinking external" href="http://www.typofonderie.com/alphabets/special_offers/fontdiscoveries" rel="nofollow">All available for a limited time.</a></p>
    <p>Font Discoveries January 2010: Allumi PTF Demi, Ambroise Std Bold, Le Monde Sans Std Italic, Anisette Std Petite Black<br>
    Font Discoveries September 2009: Costa PTF Italic, Anisette Std Petite Thin, Apolline Std Regular, Parisine Std Bold Italic.<br>
    Font Discoveries July 2009: Le Monde Sans PTF Light, Ambroise Std Firmin Demi, Anisette Std Black, Angie Sans Std Bold Italic.<br>
    Font Discoveries May 2009:Parisine Plus Sombre PTF Bold Italic, Angie Sans Std Regular, Le Monde Livre Classic Std Swashes, Apolline Std Demi.</p>
    <p>January 2010 in use samples:</p>
