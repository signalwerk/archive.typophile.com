    html: |-
      <p>The settings for "Indents and Spacing" can be changed in the Paragraph panel. Your description is a bit unclear, but I think it would suffice to select the indenting paragraphs and set their left/right/first line/last line values to zero. Do this for each occurrence.</p>
      <p>Normally I'd recommend changing this in the paragraph style for your lists, but judging by your 'clear overrides' problem, these haven't been used. If you (or original file creator) had used styles, you'd only had to change it once.</p>
