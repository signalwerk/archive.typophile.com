  html: |-
    <p>I'm using a preformatted template in Indesign. </p>
    <p>When it comes to the lists, they indent on the right side and don't line up with the rest of the left justified content (loosing precious space).</p>
    <p>When I right click (on a PC) and choose "clear all overrides", the problem is resolved, however the text is all befuddled and must be reformatted (font, size, and color)</p>
    <p>Any suggestions as to what is causing this problem?  I would like to deal with this issue without reformatting the entire document.</p>
    <p>Thanks for any suggestions.</p>
