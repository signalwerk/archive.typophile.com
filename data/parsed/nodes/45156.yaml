      <p>An academic audience is me :)  Design is a hobby, but I study Spanish literature at uni with personal interest in (socio-)linguistic issues.  In the sample issue (3.2 if I remember correctly) I noticed on one article that it started out using curly quotes and finished up with angular quotes.  But in terms of spacing, etc., it seemed fine to me.  Nice clean presentation of the data in the articles that had them, too.</p>
      <p>I hadn't heard of this particular journal before, the articles are definitely interesting my kind of article, unfortunately my library doesn't subscribe to it :(</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
