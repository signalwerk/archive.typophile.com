      <p>For what it's worth, in "The Elements of Typographic Style", Bringhurst states:</p>
      <p>For Spanish, one kerns the combinations '¿ and "¿.</p>
      <p>He also references "Harts Rules for Compositors" (39th ed. 1983), which "includes a good, brief guide to hyphenation and punctuation rules for several European languages."</p>
      <p>Tad</p>
