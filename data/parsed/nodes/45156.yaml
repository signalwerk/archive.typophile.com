      <p>Theunis, if I may ask, which journal do you typeset?  </p>
      <p>Honestly the differences between English and Spanish typesetting are pretty minimal (of course here I assume the primary language is English), the main one being the quotation marks which is only marginally followed in Latin America (which I think those users from or working out of there can attest to; here in Spain it depends, the more formal, there more likely it's angular); and that punctuation goes outside of the quotation mark, which is a practice that is gaining traction in the English world, no doubt due to various factors including scientific and IT publication where having a comma in or out of a quotation may make a big difference, or just out of habit from programming, as well as influence from non-native writers publishing following the more logical system of other languages.</p>
      <p>Another kern pair to watch out for in Spanish, depending on the descenders in a font is ¡y and ¡j (and possibly ¡g).  These might need a little more space.  Another interesting thing that doesn't come up much... the Spanish !? or ¿¡ would be simple opening with one and closing the other, the order depending on the meaning and intended delivery of the sentence.  No need for interrobang! </p>
      <p>One other caveat that gets some typesetters: one used to never put accents (acute or diaeresis) on capital letters.  This is now considered unstandard and discouraged by the RAE and so they should always have their accents (the Ñ was never effected by this).  The main reason was due to line and character height, so with the tilde you see some interesting ways to smash it into the line hieght.  With modern typography being almost entirely computer based, there's no real technical limitation to putting the accents at full height.</p>
      <p>And if you want to be oldfashioned radical, search and replace all the eñes with n-macrons (esp in sans text).  (half joke)</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
