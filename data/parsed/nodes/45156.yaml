      <p>Wow. As the typesetter of an academic journal <em>on</em> Spanish, I sure appreciate this wealth of information!</p>
      <p>There are always a lot of quotations in this journal (in Spanish -- figures...), and other than setting the hyphenation language, I paid no heed to any special rules. Consider this rectified from now on.</p>
