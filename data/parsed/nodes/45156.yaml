      <p>In Spanish you do not use extra spacing like in French.  Here's the rules for the most common marks.</p>
      <p>For quotation marks:  Las comillas se escriben pegadas a la primera y la última palabra del período que enmarcan, y separadas por un espacio de las palabras o signos que las preceden o las siguen; pero si lo que sigue a las comillas de cierre es un signo de puntuación, no se deja espacio entre ambos.  [Quotation marks are written attached to the first and last word of the marked text, and separated by a space between the words or signs that precede or follow them; but if what follows the closing quotation mark is a punctuation mark, no space is left between them].  (Source: DPD "comillas" 1)</p>
      <p>Also, please note, the prefered order for quotation marks is first angular «», then curly double “”, and then curly simple ‘’.  (So many programs seem to figure out that in French it’s «»&nbsp;and in German it’s „“ but they don’t get that in Spanish it should be «» as well ... ugh)</p>
      <p>For periods: Se escribe sin separación de la palabra que lo precede y separado por un espacio de la palabra o el signo que lo sigue [Written without separation from the word which precedes it, and separated by a space from the word or sign which follows it] (Source. DPD "punto" 1). El punto se escribirá siempre detrás de las comillas, los paréntesis y las rayas de cierre [The period is written always after quotation marks, parentheses, and closing dashes] (Source: DPD "punto" 3.1).  Si el punto de una abreviatura coincide con el punto de cierre del enunciado, solo debe escribirse un punto, nunca dos [If the period of an abbreviation coincides with a period closing a declarative statement, only one period should be written, never two] (Source: DPD "punto" 3.3).</p>
      <p>For semicolons: Se escribe pegado a la palabra o el signo que lo precede, y separado por un espacio de la palabra o el signo que lo sigue [Written attached to the word or sign which precedes it, and separated by a space from the word or sign which follows it] (Source: DPD "punto y coma" 1)</p>
      <p>There is no simple recommendation on the use of the hyphen, except that all examples have it pegged to the word before and after it (where there is a word before or after it, of course).</p>
      <p>For dashes: Cuando se usan dos rayas (una de apertura y otra de cierre) para introducir un inciso dentro de un período más extenso, estas se escriben pegadas a la primera y a la última palabra del período que enmarcan, y separadas por un espacio de la palabra o signo que las precede o las sigue; pero si lo que sigue a la raya de cierre es otro signo de puntuación, no se deja espacio entre ambos [When two dashes are used (one opening and one closing) to introduce an aside within a larger stretch of text, they are written attached to the first and last word in the phrase which they mark, and separated by a space from the word or signs which precede or follow them; but if what follows a closing dash is another punctuation sign, no space is left between the two] (Source. DPD "raya" 1).  There are some complicated exceptions, but basically, when used a list, it has a space and then the items.  In scripts, it's NAME.—Dialogue with no space on either side (and name in small caps)</p>
      <p>For parenthesis: Los paréntesis se escriben pegados a la primera y la última palabra del período que enmarcan, y  separados por un espacio de las palabras que los preceden o los siguen (hay algunas excepciones); pero si lo que sigue al signo de cierre de paréntesis es un signo de puntuación, no se deja espacio entre ambos [Parentheses are written attached to the first and lat word of the phrase they mark, and separated by a space from the words which precede or follow them (there are some exceptions); but if what follows the closing parenthesis is a punctuation mark, no space is left between them] (Source: "paréntesis" 1).   EXCEPTIONS: Para introducir opciones en un texto. [...] los paréntesis que añaden segmentos van pegados a la palabra a la que se refieren. En este uso, el paréntesis puede alternar con la barra. [In order introduce options in a text … parentheses that add word fragments are attached to the word which they refer to.  In this use, the slash may be used instead of the parenthesis] (Source: "paréntesis" 2.c). Para desarrollar las abreviaturas o reconstruir las palabras incompletas del texto original cuando se reproducen o transcriben textos, códices o inscripciones. Los elementos que se añaden van entre paréntesis y sin espacios de separación: Imp(eratori) Caes(ari). En estos casos se recomienda utilizar con preferencia los corchetes. [In order to explain abbreviations or reconstitute incomplete words from an original text when reproducing or transcribing texts, codices, or inscriptions.  The added elements go between parentheses and with separating spaces: Imp(eratori) Caes(ari).  In these cases, brackets are preferably used instead.]&nbsp;(Source: DPD "paréntesis" 2.d)</p>
      <p>The slash has a variety of uses and depending on that use is either written with or without spaces:</p>
      <p>Without: preposition substitution (1.a), multiple word options (1.b), certain abbreviations (1.c), dates (1.d), phonemic transcriptions (1.e), mathematics (1.i), and IT delimiters (1.j).<br>
      With: line breaks in quoted texts (1.f and 1.g), niche orthography uses (1.h)<br>
      (Source: DPD "barra" 1)</p>
      <p>All other bars and slashes (collectively called "barras" in Spanish, and include \, |, ||, and //) use a single space on each side EXCEPT:<br>
      When marking a page break, space before the // with the number or folio attached to the double slash.<br>
      When separating a protocol from its address, there are no spaces with the double slash //<br>
      When used in computer systems, the backslash is used without spaces.</p>
      <p>For the bracket: Los corchetes se escriben pegados a la primera y la última palabra del período que enmarcan, y separados por un espacio de las palabras o signos que los preceden o los siguen (hay algunas excepciones); pero si lo que sigue al corchete de cierre es un signo de puntuación, no se deja espacio entre ambos. [Brackets are written attached to the first and last word of the phrase they mark, and are separated by a space from the words or signs which precede or follow them (there are some exceptions); but if what follows the bracket is a punctuation mark, no space is written between them.] (Source: DPD "corchete" 1). Al desarrollar abreviaturas, no se deja espacio de separación ante los corchetes de apertura [In explaining abbreviations, no space is left before the opening brackets] (Source: DPD "corchete" 2.c).</p>
      <p>For the comma: Se escribe pegada a la palabra o el signo que la precede y separada por un espacio de la palabra o el signo que la sigue [Written attached to the word or sign which precedes, and separated by a space from the word or sign which follows it]&nbsp;(Source: DPD "coma").</p>
      <p>That's all the marks I can think of off the top of my head.  </p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
