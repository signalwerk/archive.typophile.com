    <p>Hello,</p>
    <p>I'm currently working on a project which involves spanish texts.</p>
    <p>In typesetting French we use spacing before/after punctuation marks (for example a thin space before a ! ? », one after «). Anyone know if the same rules apply to spanish texts?</p>
    <p>Thanks!</p>
