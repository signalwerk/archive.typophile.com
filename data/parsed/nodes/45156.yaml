      <p>The journal is called <a class="freelinking external" href="http://www.benjamins.com/cgi-bin/t_seriesview.cgi?series=SiC" rel="nofollow">Spanish in Context</a>.</p>
      <p>Free samples of a few articles are available, but before you're going to read those for fun, I think I should warn you: its target audience is a highly academic one. The only article I remember thinking of interesting was about the translation of Marx Brothers movies ("Los Hermanos Marx").</p>
