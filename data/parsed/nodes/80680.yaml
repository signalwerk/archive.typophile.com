      <p>Quentin, welcome on Typophile.</p>
      <p>It seems you mean it :-)</p>
      <p>Besides studying typefaces like Helvetica or Futura it might be worth exploring a Bembo or Garamond the same way, or even the engraved lettering of some <a class="freelinking external" href="http://mediendesignkurs.de/Projekte/Schriftgeschichte/kapitale.gif" rel="nofollow">old Roman inscription</a>. </p>
      <p>Wondering why I recommend those?<br>
      Observe e.g. the *skeleton* of the classical Roman R with your pencil, and then compare it to the skeleton of Helvetica’s or Futura’s R.<br>
      – Then you’ll probably see why.</p>
