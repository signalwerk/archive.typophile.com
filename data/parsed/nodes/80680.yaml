    <p>Hey there Typophiles!<br>
    I've been interested in type for some years now but never really tried myself at this discipline.</p>
    <p>I recently started thinking about a simple sans-serif font, based on my natural way of drawing letters. So I opened a <a class="freelinking external" href="http://typetip.tumblr.com/" rel="nofollow">Tumblr</a> to document my creation process and share some studies on well known sans-serif fonts (mainly Helvetica, Futura and Century Gothic). What you'll find now is pictures of some of my very first drafts and visual studies of those fonts (comparing sizes, angles and so on, trying to understand their logic). And hopefully you'll find in some weeks/months/years a final OTF file for you to download.</p>
    <p>Here's <a class="freelinking external" href="http://typetip.tumblr.com/" rel="nofollow">the site</a>!</p>
    <p>I'm well aware that this kind of process can be long and hard so I don't really know where I'll end, but for now I feel enthusiastic and am looking for feedback if you have some!</p>
    <p>Thanks in advance.</p>
