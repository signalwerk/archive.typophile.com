      <p>Andreas your statements are very reactionary. I have learned plenty from both Helvetica and the constructed alphabets mentioned above. Even it is as simple as learning from shortcomings. There is plenty to observe in Helvetica, if you bother to look, it does not matter that it does not <em>please</em> you. Look at Akzidenz too, because it will tell you something about Helvetica, some nuance that escapes you until you really chase it down. If you are serious about designing alphabets you will look at <em>all</em> type/lettering with an open mind and will be continually reevaluating designs (including why they don't appeal to you or why they are problematic), else you are just repeating tropes. </p>
      <p>In short you will learn more by looking at Helvetica than by not looking at it, so long as it doesn't beguile you.</p>
      <p>I'd look at the original drawings of Futura and Helvetica (or "adaptation of drawings", Nick Shinn, if you pick up this thread ;-)) and not at the digital files. The digital outlines are full of red herrings - I mean about the placement of points and handles etc. The intention of the designer is much clearer in the drawings, if not as measurable.</p>
