    html: |-
      <p><em>I have to work on the lowercase hairlines beforehand, right?</em></p>
      <p>This is up to you really - working from hairlines helps in a small way as you fix the archetypal shape in your head, however drawing this shape with two contours, not one line, is quite a different experience. I personally work from a central line for my sans serif drawings but a lot of the Typophilers don't believe in it :-) Also this is not the same as a hairline - imagine the central line for a bold font - the bowls won't touch the baseline as they will in your hairline drawing.</p>
    html_clean: |-
