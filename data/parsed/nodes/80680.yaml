      <p>I posted a comment! Here’s one in general: Century Gothic is IMO a rather poor “me-too” geometric inspired by Futura (particulary Twentieth Century) &amp; Avant Garde. If you are going to compare sans-serifs, I would rather pick a humanist. That way you can compare differences in grotesques (Helvetica), geometrics (Futura) and humanists (x). It might also be wise to consider a more pure grotesque like Akzidenz Grotesk. Helvetica is more of a neo grotesque (not a real classification per se, but a <em>humanistification</em> of the grotesque genre).</p>
      <p>The most typical humanist sans serif I can think of is Frutiger.</p>
