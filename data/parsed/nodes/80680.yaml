    html: "<p>Even in a monoline sans serif you usually need some variations in upstroke and downstroke. We are apparently hard geared to expect diagonal downstrokes to be sightly heavier. I don't know. It just looks wrong :) The bowl of P and R look like stretched D's, while B's bowls are more square. B has it's own problems: where the two bowls meet you need some thinning of the strokes. The point where the curve starts also needs some polishing. It has a telltale kink in both contours.</p>"
    html_clean: "<p>Even in a monoline sans serif you usually need some variations in upstroke and downstroke. We are apparently hard geared to expect diagonal downstrokes to be sightly heavier. I don't know. It just looks wrong :) The bowl of P and R look like stretched D's, while B's bowls are more square. B has it's own problems: where the two bowls meet you need some thinning of the strokes. The point where the curve starts also needs some polishing. It has a telltale kink in both contours.</p>"
