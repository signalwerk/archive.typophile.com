      <p>Riccardo, now please forgive me.</p>
      <p>Quentin: FORGET about the „construction of letters“. F O R G E T T  i t ! ! </p>
      <p>This idea is but a long-lasting misunderstanding, imposed by the constructivist’s mind upon a matter he doesn’t understand. All those pretty Pacioli- and Dürer-drawings of Latin capitals, getting their serifs tickeld by tiny little Bauhaus circles – are plain kitsch. Nice to look at, but silly.</p>
      <p>A letter is not a construct. Let’s get to the bottom of it. </p>
      <p>A letter is a <cite>written shape</cite>. It is a graph, and a graph in the true sense is the trail of a tool’s movement (a pen, a brush). The origin of all letters of all writing systems is the moving human hand. A letter by its very nature is the result of a hand’s physical movement, its characteristic rendering dependant of tool and material. It is not the result of any construction process.</p>
      <p>One may compare (!) an A to a triangle and an O to a circle. But that is not to establish a kind of equation.</p>
