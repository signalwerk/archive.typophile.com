    <p>Next year will be the 100th year commemoration of composer Edvard Grieg's death, and my agency has designed a logo and a visual profile. The logo consists of latin letters with the letter «I» turned into an exclamation mark symbolizing Grieg's own voice; his musical and ideological message.</p>
    <p>The logo will be used by Royal Norwegian Embassies worldwide. The Norwegian embassy of Japan has requested a Japanese version of the logo, but I am not sure how to make one.</p>
    <p>Do you think they mean a logo using Japanese letters? Is it possible to still use the exclamation mark as a part of the logo?</p>
    <p>I'm sure there are someone out there who can help me. I will be very grateful if somebody could give me some advices.</p>
    <p><a href="http://www.grieg07.com" title="http://www.grieg07.com">http://www.grieg07.com</a></p>
    <p>Thank you in advance.</p>
    <p>Best regards,<br>
    Per<br>
    Bergen, Norway</p>
