    html: <p>The custom is to transliterate foreign words and names into Katakana, but due to the sound-poor nature of the Japanese syllabary, you will get something to the extent of "GU RI — GU". The exclamation point is recognized but not standard Japanese punctuation. You can use it, but I don't think it can be incorporated a sone of the letters. I could be mistaken, as I'm out of practice with Katakana.</p>
  - id: 162262
    user: 13991
    date: 2006-10-12T15:42:00
    date_raw: 12 Oct 2006 — 3:42pm
    votes: null
    html: |-
      <p>It might be simplest to keep the existing logo and simply add the katakana reading (グリーグ) in smaller type.  Perhaps above the name, to balance the 2007.  The combination of Latin logo with subsidiary Japanese reading seems to be fairly common in Japanese design.</p>
      <p>(The exclamation mark is perfectly standard punctuation in modern Japanese, but there isn't an obvious place to incorporate it in the kana. I doubt they want the logo completely redone in Japanese, though.)</p>
