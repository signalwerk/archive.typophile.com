    user_id: 2663
    user_name: speter
    user_path: null
    date_raw: 23 Nov 2004 — 5:03pm
    date: 2004-11-23T17:03:00
    votes: null
    html: "<p>To answer the other question, ATSUI stands for Apple Type Services for Unicode Imaging. There's a page with more information at ADC: <a href=\"http://developer.apple.com/intl/atsui.html\" target=\"_blank\">http://developer.apple.com/intl/atsui.html</a>.</p>"
