    html: <p>It sounds like a typical problem with permissions. So rebuild the whole disc. It's something you should do every now and then on OSX. <br> <br>You could also try to de-install Fontlab and thrash the prefrence file, then re-install Fontlab again. <br> <br>I ahve no Idea what ATSUI is. <br> <br>I had a similar problem with another software before &amp; rewritting permissions helped.</p>
  - id: 52845
    user_id: 1133
    user_name: twardoch
    user_path: null
    date_raw: 23 Nov 2004 — 7:17am
    date: 2004-11-23T07:17:00
    votes: null
    html: <p>Zoe,  <br> <br>since FontLab crashes os "caching ATSUI fonts", this is an indication that your system has some activated fonts that are causing FontLab to crash. We recommend installing a font manager such as Suitcase or Font Agent, or using the built-in FontBook and disable some fonts.  <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd.</p>
