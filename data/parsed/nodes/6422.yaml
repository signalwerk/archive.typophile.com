    html: <p> Actually, the c is almost there. It's square. I think I like it that way. It is like the opposite of humanizing a san-serif face. It is a dehumanized serif. The c just needs a little thinner thins. the e is still yawning a little, but I like it that way. It needs to yawn a little to be properly matched to the unnatural squareness of the other letters. Maybe. <br> <br>The whole thing is unnatural, kind of uncomfortable. It feels like it should be really organic, because it's calligraphic, but it's so rigid it's almost mono-spaced. </p>
