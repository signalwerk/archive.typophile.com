    html: <p> It's the w, v, and y. I need to change them  to fit the face. They are too calligraphic. I like them too much though. I might have to do a different face to match them. One thing, I found out, though, is that in a body of text, the w, v, y don't stand out so much, as they aren't usually together like that. They kind of add some spice. Maybe I can find a way to keep the spice and still match. I definitely agree on the ball serifs. They need some serious work. <br> <br>And the s! I can never figure out appropriate terminals. I need to do some serious s research. I'm getting to where I can control the bez-curves, though. (yay, this one didn't take me half as long as some of the others). <br> <br>I have to cite hermann as an influence for this face. He does some funky cool stuff with squared serifed faces. Zaph eliptical is one of the coolest things I've seen, it just lacks some flavor. </p>
