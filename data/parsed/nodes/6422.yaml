    html: "<p> Very pretty. I'm purplexed by this type. First <br>it seemed very steady and solid, but then it <br>became calligraphic. It looks great in either <br>respect, but looks incongruous. Also, it's 4 A.M.  <br>MST. and I just put my milk in the cupbaord and <br>cereal in the fridge. <br> <br>I like the squarish shape and the left beaks. <br>Every glyph that sports a one is stellar (\"u\", \"w\"). <br> <br>Some of the ball terminals seem out of place, <br>though. I'm not sure what can be done. Maybe too <br>heavy (\"f\",\"r\")? <br> <br>The \"e\" looks like it's in the middle of a yawn. <br>Is it finished? Maybe turn the \"a\" upside-down? <br> <br>The \"s\" is nice, but also looks like it's from <br>another font. Serifs too large? <br> <br>You, me, Thometz, Benson (at heart)... <br>Utahns of the world: unite and take over. <br> <br>Stephen </p>"
