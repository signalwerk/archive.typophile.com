  - id: 145235
    user: 1203
    date: 2001-11-08T00:07:00
    date_raw: 8 Nov 2001 — 12:07am
    votes: null
    html: <p> Actually, I think the lc "v", "w" and "y" are some of the strongest glyphs of the font. Rather than changing them to fit the face, I'd love to see you change more of the glyphs to fit the characteristics of these three, without changing the "Pill Gothic" structures upon which they were based. <br> <br>Also, of the two lc "x"s, I prefer the one with half-serifs. Perhaps several of the other glyphs could get by with half-serifs worked in instead of completely relying on the more classic full-serifs. <br> <br>I also think that the "a" and the "w" work well enough together; I think it's the "h", "m", "n", "r", and (perhaps, but definitely to a lesser degree) "u", "p", and "q" that are throwing off the balance by looking too conservative. (Must be the Utah connection, no? ;) ) Judicious use of half-serifs in addition to your serious "s" research ( :D ) may help pull the font back into cohesiveness. <br> <br>As for that "s", have you tried applying the same logic that worked so well with the "a"? That diagonal stroke is really a winner. It might even be interesting applied to the "g". <br> <br>As for the "f" and "r", do you need the ball terminals at all? The abruptness of the "j" and "t" terminals seems to be working well, and may work just as well on the other characters with similar form. <br> <br>Finally, I don't at all mind that Pill Gothic is solid and monolinear, while this one (Pill Aberration) has stroke modulation. The two structures work harmoniously for the FF Scala family, and it looks to me as though they will work equally well for this family. <br> <br>Keep it up -- I'd love to be able to use these someday! <br> <br>David </p>
