    <p>I’ve realized that, for the most part, Fontlab is a pretty useless job skill. Nothing screws up a design job interview like the following:</p>
    <p>“Do you know Flash?”</p>
    <p><em>Nope.</em></p>
    <p>“Dreamweaver?”</p>
    <p><em>No.</em></p>
    <p>“Javascript?”</p>
    <p><em>Nada.</em></p>
    <p>“So aside from Indesign and Photoshop, what software are you good at?”</p>
    <p><em>Fontlab.</em></p>
    <p>“Fontlab? Ummmm…right.”</p>
    <p>On the upside, I guess this keeps out of dead-end web production jobs.</p>
