      <p>""There might have been a PS version of Kosmik once that worked like Beowulf, but I don’t know for sure."</p>
      <p>Yes there was, and I have it. It was simpler in implementation than Beowolf, because I think there were three versions of each (or certain) letter(s), and it rotated them as they appeared in the printing. It doesn't do it on-screen, as I recall.</p>
      <p>- Mike Yanega</p>
