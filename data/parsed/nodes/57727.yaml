    html: |-
      <p>Being not all that familiar with programming and stuff it was the first time I realized that fonts on a computer are software when I came across Beowulf. There is a randomness built into the font that makes a glyph look slightly different every time it appears in a text when being printed - this to achieve an analog touch.</p>
      <p>from LettError:<br>
      <em>PostScript allows the designer to build a font program that modifies, changes or switches letterforms. Beowolf is the first font (1989) we build with a randomisation routine. All points on the contour of a (fairly) normal typeface are given a space in which they can freely move. So instead of each letter having one fixed form, the shapes move and wobble. Every single letter this typeface will print will be unique. If characters are repeated in a text they will have different shapes.</em></p>
      <p>Kosmik works different – with contextual alternates (OpenType). Read about it -<a href="http://www.letterror.com/foundry/kosmik/index.html">here</a>-.</p>
      <p>There might have been a PS version of Kosmik once that worked like Beowulf, but I don’t know for sure.</p>
