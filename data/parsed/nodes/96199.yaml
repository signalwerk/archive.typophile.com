    html: |-
      <p>Already solved in another thread posted by same person.</p>
      <p>The design of this board -- which encourages people to post in the solved section, and when they don't get any response, encourages them to post again and again in hopes of having their post noticed -- is multiplying human labor on several fronts.</p>
      <p>It's not the fault of the people who post, obviously. It's the product of a faulty design, which "teaches" people (visually) to post in the top section.</p>
      <p>Is there any way to simply MOVE the entire top of the main board (Type ID FAQ, Type ID Pop Quiz, Solved IDs) to the BOTTOM of the page? </p>
      <p>And increase the size of "Post new forum topic"?</p>
      <p>That would put the meat and potatoes -- asking the questions -- front and center, and make it tough to post in the wrong place.</p>
      <p>That would solve 95 percent of the misposting, I'd reckon.</p>
