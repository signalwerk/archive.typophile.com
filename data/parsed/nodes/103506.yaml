      <p><em>How would you encourage readers to slow down without making the text more difficult to read?</em></p>
      <p>Speed/slowness and ease/difﬁculty are not the parameters I use for typeface design or typographic design. I prefer not play the game according to those rules.</p>
      <p>The following example isn’t “text type” per se, which is what some say should be optimally decoded at rapid speed prior to comprehension, but poetry, where the idea is to savour the words. That principle applies to prose, too, although to a lesser extent.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Poem4_4132.png"></div><br>
      Verlaine: <em>«À la Princesse Roukine», Parallèlement.</em> Paris, Ambroise Vollard, 1900<p></p>
