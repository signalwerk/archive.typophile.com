      <p>Am I correct that the test consisted of just 1 slide? </p>
      <p>I can see how slowing down might increase comprehension when dealing with a few sentences. But would the same result happen when reading a whole book, or would people (like Thomas mentioned) simply give up?</p>
      <p>A real-world example: If someone sends me a handwritten "thank you" note, I'll take the time to decipher the writing. But a few years ago someone showed me a handwritten 1800s diary of our church history. Even though the subject interested me, I gave up after a couple of pages because reading the handwriting was just too slow and difficult.</p>
