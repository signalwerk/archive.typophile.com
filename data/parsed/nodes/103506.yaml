      <p>A quick review for those who don’t have database access (or don’t want to pay $40.USD to download it).</p>
      <p>For starters, the authour’s and those who administered the tests are middle-school teachers, not research scientists.</p>
      <p><strong>Subjects (Ss)</strong><br>
      275 students in Years 9–11 (age range= 13–16 years).<br>
      Mean and standard deviation not reported.<br>
      Ss were previously grouped into four “bands” by Middle Years Information System tests.<br>
      Some were diagnosed with Dyslexya, but there was no agreed upon definition, nor were they diagnosed by the same person with the same methods. Uncontrolled.</p>
      <p><strong>Experimental design</strong><br>
      Between Ss. Each group of Ss only received one condition (font—Arial or Monotype Corsiva).</p>
      <p><strong>Methods</strong><br>
      Double blind study. Neither the experimenter (a teacher) nor Ss knew what condition they were about to administer/receive. During a 40 minute lesson of students copying material from the blackboard and answering questions from a textbook Ss were stopped, and shown a powerpoint slide. It contained the following text:</p>
      <blockquote><p>The white dwarf star Amethyst is in the constellation Cassiopeia. It is half the mass of the Sun but has a diameter one hundred times less than the Sun. On its surface it has a temperature of twelve thousand Kelvin. It is mostly made up of carbon. Currently, we have found three planets orbiting<br>
      around it.</p></blockquote>
      <p>The line-breaks can not be discerned from the figure presented in the paper.</p>
      <p>Ss were given 90 seconds to read the text in silence. The lesson continued. Approximately 35 minutes later, they were administered the following questions:</p>
      <blockquote><p>1) What is the name of the star?<br>
      Amethyst/Amey/Myethyst/Alpha-Centauri</p>
      <p>2) In which constellation is it?<br>
      Cassiopeia/Cancer/Capricorn/Pavo</p>
      <p>3) What type of star is it?<br>
      White Dwarf/Red Dwarf/Red Giant/White Giant</p>
      <p>4) How many times the mass of the Sun is it?<br>
      Half/Double/Ten Times/Five Times</p>
      <p>5) What is the temperature on its surface?<br>
      Twelve Kelvin/Twelve Thousand Kelvin/Twelve Thousand Centigrade/Three Thousand Kelvin</p>
      <p>6) What is it mostly made up of?<br>
      Carbon/Helium/Iron/Cadmium</p>
      <p>7) Have we found planets orbiting it?<br>
      Yes/No</p></blockquote>
      <p>They were on paper. Their typographic design is not reported.<br>
      121 Ss saw Arial, 154 saw Monotype Corsiva.<br>
      Ss were grouped into two groups by random balanced assignment—random assignment followed by re-grouping Ss to ensure that each group had a similar percentage of Ss from all bands, including readers with Dyslexia.</p>
      <p><strong>Results</strong><br>
      Across bands, and including dyslexic readers,  Ss who saw Monotype Corsiva scored 12.8% higher. This was statistically significant.<br>
      Within bands, excluding dyslexic readers, the mean difference between Arial and Monotype Corsiva was 11.5%. This was statistically significant.</p>
      <p><strong>The interesting part of the results</strong><br>
      Across bands, the difference between Arial and Monotype Corsiva was 12.8%. Within bands, the mean difference was 11.5%. However, when looking at <em>only</em> readers with dyslexia, the difference between Arial and Monotype Corsiva was 19%. While arithmetically different from the overall difference, it was not statiscically significant.</p>
      <p><strong>In one sentence</strong><br>
      When students with Dyslexia saw a slide with a passage of text set in Monotype Corsiva compared to Arial , they performed significantly better on a short comprehension test, but the <em>difference</em> between their scores was not significantly greater than the difference between the scores of  students without Dyslexia.</p>
      <p><strong>In conclusion</strong><br>
      A nice short and easy to read article. however, it is full of confounds and impossible to reproduce from the paper. In the concluding remarks of Diemand-Yauman et al. (2010, pp 4), they state “The potential for improving educational practices through cognitive interventions is immense. If a simple change of font can significantly increase student performance, one can only imagine the number of beneficial cognitive interventions waiting to be discovered. Fluency demonstrates how small interventions have the potential to make big improvements in the performance of our students and education system as a whole.”</p>
      <p>This is an great example of non-scientists testing disfluency theory, and a testament at how easy it may be to implement these techniques in real-world settings, for which they should be applauded.</p>
