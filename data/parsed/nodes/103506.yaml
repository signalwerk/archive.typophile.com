    html: |-
      <p><em>What do you mean by “Was the setting skewed towards an outcome that supported disﬂuency theory?”</em></p>
      <p>In the sample I posted, one typeface was set large, bold and solid, to represent “typical”, and the other small, italic and screened, to represent “hard to read”. So, it was not typefaces that were being compared, but settings, according to the prejudices of the researchers, who rigged the experiment to set one typeface so that it was “harder to read” than the other.</p>
      <p>Without seeing the slides involved here, I can nonetheless state that the Arial setting will look really boring, just the kind of thing that would make students’ eyes glaze over and their minds wander, while the Corsiva setting will have a degree of novelty that warrants more attention.</p>
      <p>As I pointed out in a previous thread, what is being compared is not, as the researchers believe, difficulty of typeface, but appropriateness of type choice and type specs, about which they are somewhat ignorant, because that ain’t their bailiwick.</p>
      <p>So congratulations, they have discovered typography!</p>
      <p>The researchers here are victims of the Beer Test phenomenon: <em><strong>a small amount of something unusual</strong></em> will have immediate highlight appeal, but is not the kind of thing for prolonged consumption. Display Beer, as Hrant termed it.</p>
