      <p>That Arial is easy and Monotype Corsiva is hard to read is just an assumption the teachers did make. Maybe Corsiva is more readable because it's an italic, maybe because the letter forms are more differentiated than in Arial. The same results could be argued to just prove the opposite, that Corsiva is more readable and thus the pupils' comprehension was better.</p>
      <p>This study doesn't really hold up to scientific standards.</p>
