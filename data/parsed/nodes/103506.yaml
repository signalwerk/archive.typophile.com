      <p>There are no accurate visual representations or descriptions of the slides in the paper regarding size, dimensions, leading, visual angle, &amp;c.</p>
      <p>What do you mean by “Was the setting skewed towards an outcome that supported disﬂuency theory?”</p>
      <p>As reported, it was a double blind study, and Ss were assigned to two different groups via random balanced assignment in an effort to ensure that the populations of the experimental and control groups weren’t unbalanced in any direction according to ability.</p>
      <p>From my perspective, confounds aside, there was no deliberate attempt to skew the results via text setting.</p>
