    html: <p>That’s pathetic—did they hire the branding firm of the living dead for that boring, trite, dated nonsense? Given the requirements any branding person with half a brain should have just developed the dragon into an avatar and dumped that static mark concept entirely. Does anyone else feel that projects like this one have a lot to do with why designers still have to justify everything we do to so many clients?</p>
