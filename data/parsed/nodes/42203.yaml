      <p>Bland crap - doesn’t say ’City’. It says “I’m a designer who can’t be bothered to think of anything, but this idea is in at the moment so  I’ll do this, so as not to waste any precious brain cells”.</p>
      <p>Circles in perspective (I’m sure there’s a proper name for it) are the new ’arch thing’ (I’m sure there was a name for that also).</p>
      <p>Why are logotypes designed with built-in obsolescence nowadays? That is going to look so dated very quickly. In fact it will probably look dated by the time I post this comment.</p>
      <p>45K? Nice work if you can get it.</p>
      <p>Nick Cooke</p>
