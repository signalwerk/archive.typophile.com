      <p>That's Luigi, a specific typeface designed for "Speed Limits" exhibition by <a class="freelinking external" href="http://projectprojects.com/speed-limits/" rel="nofollow">Project Projects</a>.<br>
      As previously suggested by speter, <a class="freelinking external" href="http://new.myfonts.com/fonts/ef/radiant/" rel="nofollow">Radiant Display Condensed</a> (no2 or no3) is not so far. With some little changes, you could get pretty close.</p>
