    html: <p>One of the very few benefits derived from youthful indiscretions (otherwise known as taking psychoiactive drugs in the 60s) was a realization of the primacy of <strong>pattern recognition</strong> in human cognition. I doubt that anyone who hasn't been there (either through drug use or psychosis) can fully appreciate the flood of sensory impressions that we receive every conscious second; the only way we can really navigate through this riot of sights, sounds, tastesm smells and touches is by employing pattern recognition to select useful, important or just familiar stimuli, and discard the rest. Reading isn't any different.</p>
