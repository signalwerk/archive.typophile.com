      <p>Highway signage is a special case.  Even street name signs have a different function. For me they require more character to define the "place".  There seems like a long blurry path from highway to street to pedestrian to storefront to inside-building and so on down to the name on an office cubicle.  The difference for me is communication vs. legibility. At 100 kilometers per hour on a strange highway at night just reading it quickly is the issue. While walking around a pedestrian shopping/dining area seeing the sights brings in more of the communication angle.  I don't think there is a formula, I just think designers have to approach way-finding as a much broader problem than just the readability of road signs at highway speeds.</p>
      <p>ChrisL</p>
