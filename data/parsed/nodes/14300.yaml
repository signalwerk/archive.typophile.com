      <p>"what do you know/think about Kindersley’s road signage efforts?"</p>
      <p>I am definitely not in favor of ever using an all capitals system for wayfinding signage. Incorporating a small caps system might be possible, but I think all caps is not a good idea. To me, all capitals forces the reader to actually recognize each individual character rather than read a full word. I think it lengthens reaction time. </p>
      <p>Based on what I've read and experimented with, word shapes are important in immediate word recognition. Since we most frequently read mixed case words, it seems most appropriate to use mixed case words on signage.</p>
    html_clean: |-
