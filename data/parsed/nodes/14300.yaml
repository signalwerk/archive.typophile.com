    html: |-
      <p>Yep, v=d/t (not sure if it was Einstein though - wasn't he E=mc²?)</p>
      <p>Since recognition of words, once you can view them clearly, is virtually instantaneous, the <em>earlier</em> you can do it, the better. In this case, speed of approach does not affect time taken to decipher anywhere near as much as the actual design of the characters on the sign, which is why ClearviewHwy and Transport are so good. You can "read" (recognise/scan/whatever...) them from much further away than their predecessors, so you have more time to make your decision.</p>
      <p>In theory, the further away a sign is the less your speed affects the reading process (i.e. if you have a very big sign on the horizon, it's going to be a lot easier to read than a little sign nearby that is moving quickly realtive to your car where your mind has to cope with the speed as well as the deciphering.</p>
      <p>So, if you have to slow down to read a sign, there are several possibilities. Either:<br>
      - you're not really concentrating<br>
      - you're breaking the law<br>
      - the sign was positioned badly<br>
      - the sign was designed badly (and maybe the typeface used was badly designed)</p>
      <p>In the case of UK roadsigns which are very clear and usually very well positioned, you were probably caning it or napping.</p>
    html_clean: |-
