    date_raw: 2 Aug 2005 — 11:33am
    votes: null
    html: <p>I'm with Terry, asking why there are such conventions around which kinds of typefaces are deemed legible for signage. To me, axioms like "Sans serif is best for signs" and "Serif type is more readable than Sans" are just parroted assumptions, not empirically true. Clearview is an enormous improvement over the original, engineered faces, but I have an idea that there is more yet to be discovered about which typefaces are most clear, useful, quickly read, etc. in wayfinding situations. In fact, my theory depends on ignoring, destroying or transcending the perceived opposition between serif and sans. I will prepare some test characters soon and post them.</p>
