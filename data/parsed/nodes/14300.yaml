      <p>"What makes you think people don’t read signs?"</p>
      <p>There's a good amount evidence supporting this, its been documented. (See: Wayfinding: People, Signs and Architecture for one example). The other comes from basic observation. Most of the time when I ask people questions about signs, or information on them, most of the time they say: "oh, I didn't see that." </p>
      <p>Most people I think just grab the bits of information they need and move on. Signs are short for a reason and don't usually consist of several lines of text. Attention span, and the ability to absorb info quickly is why I feel signs aren't read. The action of "reading" is quite different in nature.</p>
