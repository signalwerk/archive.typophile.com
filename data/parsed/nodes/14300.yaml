      <p>What makes you think people don't read signs? "Scan" is a term better left to describe the activity of looking for something specific among a mass of objects. In text, this is usually when you look for a name or number. So for scanning, fonts with prominent capitals and numerals help; leading is less important; what else?</p>
      <p>Admittedly, on a highway very often a driver is "scanning" a sign for a street name he knows is there - he just wants to know where to exit. I think that just speeds up recognition at a distance - without affecting the <strong>nature</strong> of the recognition. But maybe it's more complex than that.</p>
      <p>hhp</p>
