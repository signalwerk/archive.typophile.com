      <p>But there must be a reason people worry about speed of decipherment. Otherwise switching to Clearview for example (or switching at all) is pretty hard to justify. And I think the reason is that in "boundary conditions", like bad weather combined with being in an unfamiliar part of town/the_country, recognition time does matter; if you're trying to decide to get into the exit lane or not, switching between reading the signs and minding the (non-confused) local traffic whizz by you, a fraction of a second can make or break it; you might hit somebody passing you on the right, or miss your exit and get frustrated (ie more likely to hit something).</p>
      <p>And this is in fact quite similar to "regular" reading: you're not always in a hurry to finish something you're reading, but sometimes, yes you are. It's just that the chance of dying is somewhat less.  :-)</p>
      <p>hhp</p>
