      <p>When you read text, you deal with whole words at a time. You don't break words down to work out each word from its constituent characters (unless it's new to you), you recognise words because of their shape. Ascenders and descenders help this part of the process. First and last characters of words are also important. Finally the rest of the characters in the word are needed if the other two criteria have not proved decisive. So you don't "read" individual words as such, you only "recognise" them. "Reading" then is an overall process of "recognising" and "piecing together" multiple words/phrases and then transferring them into sensible thoughts.</p>
      <p>On signs, you don't "read" a destination in the same way as you read a paragraph of text, you merely perform the initial stage of the process, the "recognising" a word firstly from its shape, secondly from its first and last characters*, thirdly from the rest of the characters. It is an important distinction to make because, on a sign, you are not really concerned with the "piecing together" part of the reading process and far more concerned with making the individual words (and occasionally phrases) recognisable to the user. </p>
      <p>The theory that upper and lower case is more helpful is based on the assumption that words are easier to recognise by their shape than by their constituent characters. There is however an argument that says upper case only is better because individual upper case letters are more distinctive. However, I would suggest that word shape is higher in the batting order than individual character distinctiveness.</p>
      <p>__________________________________________________________</p>
      <p>*On the subject of first and last characters in words, you may have seen this:</p>
      <p><em>Aoccdrnig to a rseerach stduy at Cmabrigde Uinervtisy, it deosn't mttaer in waht oredr the ltteers in a wrod are, the olny iprmoatnt tihng is taht the frist and lsat ltteer be at the rghit pclae. The rset can be a total mses and you can sitll raed it wouthit porbelm. Tihs is bcuseae the huamn mnid deos not raed ervey lteter by istlef, but the wrod as a wlohe.</em></p>
      <p>I don't know if this was a real Cambridge University study but it's interesting.</p>
