      <p>&gt;can anyone share pictures of unique or flavorful local signage systems they’ve seen? </p>
      <p>Unfortunately, I don't have pictures, but I found the El Paso airport signage really charming and distinctive. It was done in <a href="http://fontbureau.com/fonts/Eagle" rel="nofollow">Eagle</a>. </p>
      <p>This type is really strong, and has an interesting history. Morris Fuller Benton designed it as all caps for Roosevelt's National Recovery Association, and David Berlow drew a lower case for it and revived it for Fount Bureau. </p>
      <p>At the airport they used both the U &amp; lc, in a heavy weight, bold or black. In spite of the distorted outlines and small counters of the heavy weights, it is quite readable. And, because of the setting on the Mexican border the heavy lettering seemed somehow very Tex-Mex in that setting. </p>
      <p>To me this example says a few things about signage. </p>
      <p>1. Outside the highway setting, where split seconds matter a lot, many types can work as signage. </p>
      <p>2. Aesthetics and branding are often very important and valuable in a signage system. </p>
      <p>I think Nick Shinn made both these points in an earlier thread about signage, but the use of Eagle is a striking example, because it is really not what one would think of first for signage, but it works admirably. It is a small airport, so wayfinding is not a huge matter, I must admit.</p>
