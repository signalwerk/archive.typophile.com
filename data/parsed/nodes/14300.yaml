      <p>David Kindersley was convinced that upper case serif was easier to read on a sign than upper and lower case sans serif. Have a look at this article by Kindersley:</p>
      <p><a href="http://www.cbrd.co.uk/histories/wartoworboys/4.shtml" title="http://www.cbrd.co.uk/histories/wartoworboys/4.shtml">http://www.cbrd.co.uk/histories/wartoworboys/4.shtml</a></p>
      <p>The impression I get from Kindersley is that Transport, the sans serif u&amp;lc font, was chosen because it was trendy at the time to use "Swiss-looking" sans serifs (hence Transport is an iteration of Akzidenz Gtotesk with occasional alterations to aid legibility) and not because of any inherent legibility qualities in the font itself. However, if you'd just had your font rejected by people who didn't really understand your craft and someone else's work was going to appear on the signs across the nation, you might want to push your point a bit. I guess as an apprentice to Eric Gill, and a lover of stone cutting, he probably thought that a 'grotesque' solution was just that.</p>
      <p>For reference, the Transport fonts (Kinneir/Calvert) used in the United Kingdom can be found here:<br>
      <a href="http://www.dft.gov.uk/stellent/groups/dft_control/documents/contentservertemplate/dft_index.hcst?n=9430&amp;l=3" title="http://www.dft.gov.uk/stellent/groups/dft_control/documents/contentservertemplate/dft_index.hcst?n=9430&amp;l=3">http://www.dft.gov.uk/stellent/groups/dft_control/documents/contentserve...</a></p>
      <p>As far as legibility testing itself is concerned, it can ultimately only solve the problem of finding which of two <em>existing</em> fonts is more legible. It doesn't necessarily point you in the right direction for the optimum. So font <em>A</em> may be more legible than font <em>B</em>, but font <em>C</em> (yet to be designed) may <em>look</em> completely different from <em>A</em> and <em>B</em> but perform much better under controlled testing conditions. Unfortunately testing didn't really help your endeavour to devise font <em>C</em>. I assume you want to design the optimum font rather than simply establish which is the best existing font. Testing may not help.</p>
