      <p>I certainly agree that signs are not immersive reading. But I think "scan" is the wrong idea. When somebody "doesn't see" something, it just means his subconscious didn't think it was important enough to bring to consciousness's attention. But when it <strong>is</strong> brought to attention, it is "read", not "scanned". At least the way I use the terms.</p>
      <p>BTW, I feel that in immersive reading as well people "grab the bits of information they need". It's just that book text has a lot less redundacy, so you have to read -almost- everything. However, this heuristic nature does nicely explain why the parafovea (which is quite lo-res) is so useful in immersive reading, and why boumas exist.</p>
      <p>hhp</p>
