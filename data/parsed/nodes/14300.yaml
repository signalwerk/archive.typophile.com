      <p>Hrant,</p>
      <p>What research can you point us toward re: reading/legibility in these wayfinding situations? Nick brings up something interesting: On a highway, movement is much more a factor. Other factors come into play in a train station, or inside a train.</p>
      <p>I heard from a friend who visited Japan that they've used those silly blinking LED sticks to good effect in the subway: When the train goes by, the images they generate are stretched out and revealed, not by the viewer's waggling head, but by the speed of the train. So riders get pictures flashed at them. Unfortunately I don't think the pictures are very compelling, but it's interesting to think about how to make a signal/sign/image appear clearly to someone in a moving vehicle.</p>
