      <p>There also seem to be different schools of thought on signage legibility:<br>
      1) All wayfinding signage should be sans serif<br>
      2) Wayfinding signage can use any "reasonably legible" typeface<br>
      3) Larger x-heights increase legibility<br>
      4) The best sans serifs for wayfinding signage actually incorporate serifs or pseudo-serifs (see: Vialog (Linotype), FF Info Display, Jock Kinneir's Transport, Clearview Highway)<br>
      5) True sans serifs (no previously mentioned features) are sufficient enough</p>
      <p>As you can see those are definitely conflicting details. What do you all think?</p>
