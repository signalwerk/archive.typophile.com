      <p>Terry, I'm the biggest word-silhouette-matters guy around, so I certainly agree that mixed-case is far superior for "normal" reading. What makes me open to the idea that all-caps might be better for highway signage is the issue of visibility (they're bigger in the same surface area) versus familiarity (where proper names don't benefit much). I'm just unsure. It's interesting that signage has its own particular complexities compared to immersive reading - it's not as obvious as it might first seem, while the appreciation of immersive reading gets complex <strong>fast</strong>. But I do have to admit that James is pretty convincing.</p>
