      <p>Nick, some people -especially these days- have stopped believing the "whole word" theory of reading; they've come to put -misguided- faith in what's called the parallel-letterwise model, where words are indeed compiled (although not sequentially) through their constituent letters exclusively.</p>
      <p>My own -admittedly ongoing- research has arrived at the conculsion that we read what I've come to call "bouma"s: these are sometimes whole whole words (ones that are very frequent and short), sometimes individual letters (in the fovea), but generally, they are <strong>clusters of letters</strong>. When you look at all the empirical data, take into account anecdotal evidence, and throw in beliefs about human cognition, it's the only thing that makes sense - to me at least.</p>
      <p>hhp</p>
