    html: "<p>FWIW: I've been working with signage for some time; wayfinding and room identification in educational and office buildings. I'm a bit skeptic about \"proof\" that some typeface is better suited for signage that another. Testing and research always implies in limiting a problem to certain conditions; you can proof that something works better than another thing, but only under certain conditions. The good thing about scientific studies, though, is that we can use them as reference, being most useful when discussing a project with a colleague or a client.</p>"
