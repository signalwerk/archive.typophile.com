    html: <p>Time is the critical element. I was saying speed isn't a factor since the sign is not zipping by. You are closing in on the decision point. The sign is in your field of view. The farther away you can read it the better. Sometimes when people discuss this topic they make it sound like all of these signs are zipping by them and they have to turn their heads to read they as they go flashing by. That is not how it works. Distance from the sign, how far away can you read it, that is all that matters. So legibility distances and recongnition distances are what the research tries to measure. The Clearview stuff is legible and more recognizable from farther away, that is why the switch is on.</p>
