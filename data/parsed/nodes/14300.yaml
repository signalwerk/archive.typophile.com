  html: <p>Legbility. Is it a taboo subject? The word is tossed around, but has it actually ever been proven by any studies or analysis? Is it all up to individual preference, or are there truly typefaces that are "most legible" on signs? Is there any proof supporting any claims aside from our eyes? Clearview Highway is the only typeface that I know of that was actually tested and supported by research. Any others?</p>
