      <p>I think you should look a little forward and capitalize on the fact that many state and local municipalities are looking into <a href="http://www.usroads.com/journals/p/rej/9709/re970903.htm" tagert="new" rel="nofollow"><strong>CMSs (Changeable Message Signs)</strong></a>.</p>
      <p>More than likely, if money is to be spent on upgrading road and traffic signage, the bureaucrats will look to the latest accepted studies, and frankly, changing letterforms on static signage is nowhere near the top. <a href="http://www.library.unt.edu/gpo/ota/tech/safety/ap12.html" target="new" rel="nofollow"><em>Guidelines on the use of Changeable Message Signs</em></a> and <em>Summary Report</em> have already been drafted and accepted by the U.S. Department of Transportation Federal Highway Administration. I strongly suggest that if you want to contribute to signage legibility/readability in the very near future, you should begin contacting the manufactures of CMSs.</p>
      <p>If you think about it, more than likely these signs will be controlled centrally at transportation centers using computer consoles. I'm sure loading in new type fonts is no more difficult than on the Mac or Pc.</p>
      <p>On the subject of Wayfinding systems, I am in contact with many architects in the Boston area. From time to time I notice projects that they have recently completed and some that are "on the boards."</p>
      <p>It is these large architectural firms around the country and world who are getting contracts on projects which have some element of environmental graphics and wayfinding systems. If you really want to see something materialize you should also start contacting architects as well.</p>
