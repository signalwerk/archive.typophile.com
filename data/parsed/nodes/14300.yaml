      <p>Originally, when I was involved in the NPS stuff, Don Meeker and I proposed that the Park Service use Syntax instead of the Clarendon for their highway signature face. We also proposed using it in place of all the Helvetica Bold they were using throughout their wayfinding and publications systems. I even drew a version of Syntax to match the weight and x-height to cap proportion of their Helvetica Bold (so maybe they wouldn't notice!)</p>
      <p>Well after what felt like a 12 hour meeting they rejected Syntax in all its forms because it was too "Quirky". I beleieve that was the word they used. They just couldn't get past the splayed M and the angular terminals (and there were designers making these comments). They chose instead Sabon. The Sabon was a non-starter as a highway face, so that began my process of designing the Rawlinson Roadway as a way of satisfying their desire to have an "Oldstyle" type of face for their signature, that would also work well as a highway signage face. Reseach showed that the final version of the design performed 11% or so better than the Clarendon. It also took up less space. </p>
      <p>I was going to do a presentation on this process at TypeCon in San Francisco, but my summer got bogged down with other things and I had to put it off.</p>
