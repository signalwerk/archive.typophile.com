      <p>Maybe the word is "recognise". After all you can only recognise a face in a crowd if you "see" it. You may or may not have been deliberately looking for it but if you see it, chances are you'll recognise it (if it's a face you "know").</p>
      <p>The first thing signage has to do then is be recognisable as such. You need to "know" it's a sign or it's just another face in a crowd. Wayfinding is all about feeling secure. Nothing does that quite like seeing someone or something you know.</p>
