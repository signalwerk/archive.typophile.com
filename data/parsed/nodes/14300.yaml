      <p>Optimal legibility only really applies on highways, where you don't have much time to read. Otherwise, given responsible typographic handling (as well as an awareness of environmental "wear and tear"), most typefaces may be used for signage.</p>
      <p>(However, train station names could be done in really long signs with hyperextended fonts, so you can read them when you're whizzing through at high speed. I've never seen this, but surely somewhere in the world has done it?)</p>
      <p>Otherwise, I believe it's more important to get some brand differentiation going with your signage. Like, this is a unique place, not just another mall/town full of franchises. And for wayfinding, unless it's on a university campus, signage is going to be competing for eyespace with commercial signage, so why not use a different kind of type to what appears there? This is the same principle that periodical art directors often use, so that their editorial pages don't look like ads.</p>
      <p>One of the pleasures of relocating to Norwich has been the street signs here, which are cast iron, in a Victorian sans serif.</p>
