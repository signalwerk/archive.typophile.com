      <p>&gt; you can read them when you’re whizzing through at high speed</p>
      <p>Note that vision behaves very differently depending on whether the subject is moving or not: when looking at a mass of stationary objects, we saccade; but when looking at something that's moving, the eyes "track" it smoothly. Yes, Science, sorry. However, how this affects reading I don't know for sure. But I have a hunch we're not attuned to reading moving things well; I suspect we switch between saccading and tracking, not getting good info to "process".</p>
      <p>BTW, I'm talking about lateral movement here: driving directly towards a highway sign is saccade-based, although I suspect as parallax increases reading starts breaking down. In fact James has equated highway fonts with text fonts; personally, although I see some similarities, the difference I think is that true immersive reading uses the parafovea. And I personally prefer to use my parafovea for spotting cops using on-ramps.  :-)</p>
      <p>hhp</p>
