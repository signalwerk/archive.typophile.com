      <p>James has gained enormous ground and credibility in demonstrating that yes, a type designer can get you a better, more functional typeface than a bunch of engineers with compasses. </p>
      <p>Nick asks if any solutions we might propose could scare away committees of highway planners. I think anything that looks different will scare away these kinds of viewers. James' experience demonstrates this. It makes sense: Why should they appropriate millions in funds to change something unless there's a real benefit? The design has to be tested (as has been done with Clearview), and the results showing specific benefits are the real bargaining chip. Beyond that, I think the design has to be superficially conventional in style, something familiar and safe, to satisfy the committee urge to please everyone in the world.</p>
      <p><a href="http://www.terrestrialdesign.com/TransitTest01.gif" rel="nofollow">This test</a> is meant to push the possibilites of early recognition and reduce ambiguity as much as possible. In the current context, it would never be shown to a highway commission. Still, I'm intrigued that we might discover something new about what features or qualities improve recognition most, in special cases like highways and subway systems. This design, or something derived from it, could easily be proposed to a local transit agency because the eventual style of it could fit into an identity program. Oddly enough the caps in this sample are not unlike what Kindersley proposed. I discovered this after making the test shapes. It's about function.</p>
    html_clean: |-
