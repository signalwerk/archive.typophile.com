    html: <p>Also, to pick up Norberto's point, if we're going to talk about wayfinding in general, not just driving, I think we have to sort of shift gears and talk about screen fonts. More and more of the information needed to get around airports, train stations, and bus stations is only available from computerized displays, and leaving aside horrible interface designs (which abound), most of the time Frutiger or Helvetica would be a huge improvement over what's actually getting used. Even Arial or Comic Sans would be an improvement (well, OK, given the quality of the displays, maybe not). Airport displays are one of the few environments more hostile to type than the Web, I'd say.</p>
