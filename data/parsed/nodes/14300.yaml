      <p>I'm in the midst of a conundrum here. A couple months ago, I spent a couple weeks bumming around some of the US's finer national parks (Yellowstone, Grand Tetons, and Rocky Mountain) and was really heavily into all the Clarendon signage everywhere. As has been <a href="http://www.typophile.com/forums/messages/30/70242.html" rel="nofollow">documented elsewhere</a> on Typophile, I'm obsessed with Clarendon, but even still, white on brown Clarendon is both aesthetically appealing to the grown-up type nerd and sentimentally appealing to the grown-up kid who spent a lot of his childhood in national parks.</p>
      <p>That said, it's not terribly easy to read, especially when it's dim or raining. The Clarendon used by the NPS isn't blessed with an especially tremendous x-height, and the quirky details that make it so appealing up close can make it hard to read from a distance. My girlfriend and I missed a bunch of turnoffs because we didn't see the signs we needed in time (although the type was only part of the reason for that, which points to Terry's larger point that wayfinding is about a lot more than type). By any reasonable yardstick NPS Roadway's a big improvement. I'm glad they stuck with a serif typeface, as much as I love Syntax and its descendants, because moving to a modern humanist sans would have been a major shock. That said, I'll be sad to see Clarendon go. In some ways, it <em>is</em> the National Park System to me.</p>
      <p>As a side note, it's fun to see how long it takes to find out where the name "Grand Tetons" originates inside the official park brochures and maps. Talk about burying the lead...</p>
