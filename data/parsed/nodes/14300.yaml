      <p>I think wayfinding often has very little to do with reading. Hrant, I think the approach you're taking is purely typographic. What Carl was talking about I think is that symbols play a necessary role in wayfinding as well as typography. What I'm trying to approach (although I don't know how possible) is to create a wayfinding system that is as universal (multilingual) as possible without typography confusing the issue. Words in context, mean more than words individually. For example since we've been using this word frequently:</p>
