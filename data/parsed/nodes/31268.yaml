      <p>I'm very happy with the new CT rendering. It is light and can be exquisitely crisp compared to the ad hoc-only and heavy rendering of Quartz or the "let us beat the type nearly to death with greys" of CoolType. We now have a full spectrum of digital ink; Cooltype colors pixels that are 100% outside of the glyph outline on one end, and you need to try real hard to make sure there are no drop out pixels in CT on the other. :)</p>
      <p>"and the new fonts."<br>
      I have not had time to put them through a total pacing from 11 to 72, but this weekend, I'll have a full report. ;)</p>
