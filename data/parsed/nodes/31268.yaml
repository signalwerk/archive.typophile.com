      <p>I've fixed all my Vista related issues when running on an Alienware Area-51M 766. </p>
      <p>I had to upgrade Ipswich WS_FTP to Pro but that was good since it supports SSH. </p>
      <p>Main problem was the Nvidia driver, the upgrade needed an updated .ini file that tells the installer that the driver supports my video card.</p>
      <p><a href="http://vinceconnare.wordpress.com/" title="http://vinceconnare.wordpress.com/">http://vinceconnare.wordpress.com/</a></p>
      <p>once I fixed the video driver it was fine. The only thing I find now is Haupaugge's WinTV (which is a bit rubbish) doesn't work with the new Media Centre, WinTV boots on start-up and locks it from being used in Media Centre. But that's not a big deal.</p>
      <p>It depends on what you want to do. I would think only in some very specific cases will you have issues with Vista.</p>
      <p>I like using MS Visual Studio 2003 for a lot things like webpages and some Python but 2003 isn't supported so I do my work on XP.</p>
      <p>The other is I wanted to use a MacBook Pro as my main PC and Vista is too weird on that so WinXP works fine and that is what I had to put on that. But this is also not a normal requirement.</p>
