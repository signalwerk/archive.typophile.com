      <p>&gt; Has anyone here moved to Vista yet?<br>
      I have upgraded and it's worth it. The system fonts, the default browser fonts, and reader fonts all look the same or better with Vista's CT. Since all I do on windows though is look at fonts, and use them, it's easy to do the upgrade. ;)</p>
      <p>&gt; I’m very interested to hear what type users are experiencing with it, and the<br>
      &gt; new fonts.<br>
      I'm pleased l that the browser (IE.X?) still lets the user have control of the font calls, (via "fonts" "Accessibility" in the "internet options"). So, if you set the browser font to a C-font, and "don't let web pages spec fonts" all of them look about as good as each other, but much better than the defaults set by most html or browser settings.</p>
      <p>&gt;I’m Mac and wont use windows, but I’d like to try their fonts.<br>
      Aside from the legal issues, you'll find that they are less Mac-adapted in their current form than Georgia or Verdana were, so, set Quartz to 6 for best results. The optimum size, though I only checked one, is likely to be "13" on the Mac. Otherwise, (i.e. Scaling up), they behave like any other unhinted TT in Quartz.</p>
