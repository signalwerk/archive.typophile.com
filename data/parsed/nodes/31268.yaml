    html: |-
      <p>XP works fine on bootcamp/MacBook Pro. But...</p>
      <p>Vista is not backwards compatible and probably won't work on anything but new. (very Apple System 7 like)</p>
      <p>- Apple's Sigma Tel audio drivers don't work in Vista (Sigma Tel doesn't support drivers or consumers)<br>
      - Apple's Bluetooth drivers don't work in Vista<br>
      - Apple's Startup disk in Control Panel doesn't work in Vista (you use the alt key on restart to select boot device).<br>
      - Netgear's WG511v1.1 wireless network card don't work in Vista<br>
      - Microsoft's Visual Studio .net 2003 doesn't install on Vista and isn't supported.<br>
      - the SSH Client 3.2.9 non-commercial from <a href="http://www.ssh.com/" title="http://www.ssh.com/">http://www.ssh.com/</a> doesn't work<br>
      - Ipswich WS_FTP you need the commercial version with SSH support and the Vista upgrade for it to work.<br>
      - FontLab 4.6 may not install on Vista (I couldn't get it to install but 5.0.2 is fine)<br>
      - MS Font Validator works fine as long as you have .net 1.1 framework installed.</p>
      <p>that's the list so far....</p>
    html_clean: |-
