      <p>Wow I tried Parallel.. and tried to use my WinXP but the mouse died... So I wiped out the Bootcamp partition and started over with Parallel. Used Custom because first time the auto install only gives you 512mb RAM and a small amount of maximum disk space. You can set up 1.5gig of RAM and 50gig of disk space. </p>
      <p>Vista works and the drivers work. You might need to install them manually within Parallel. </p>
      <p>It's pretty good so far since you can flip to and from the Mac OS, it's better than the old VirtualPC of the 90s.</p>
      <p>The only noticable thing missing is Aero, the new 3D modelling, so there are no see through windows. The Fridgettes work so you can have your prayer clock handy.</p>
      <p>oops iSight camera isn't supported apparently oh well.</p>
