    date: 2002-11-04T14:03:00
    date_raw: 4 Nov 2002 — 2:03pm
    votes: null
    html: <p>Karen -- <br> <br>Bernd Möllensädt's <a href="http://www.bertholdtypes.com/adobe_lib/080218000.html" target="_blank"> Formata</a> is a nice sans and has OsF available. They're in the <a href="http://www.bertholdtypes.com/adobe_lib/080337000.html" target="_blank"> expert set</a>, so you'll either have to keep swapping or use a font editor to rearrange your own OsF version. These used to be marketed by Adobe, but I think you can only get them through Berthold now. <br> <br>A couple of the Font Bureau's sans serif fonts have OsF available -- Benton Gothic, Berlin Sans, and Petr van Blokland's <a href="http://www.fontbureau.com/fonts/font_frames.tpl?cart=1036447081260870&amp;fontname=Productus" target="_blank"> Productus</a>. I think the last one comes with OsF standard. The others you may have to request specially. But if you find TheSans too costly, these may not be in your price range either. <br> <br>-- K.</p>
    html_clean: <p>Karen -- <br> <br>Bernd Möllensädt's <a href="http://www.bertholdtypes.com/adobe_lib/080218000.html" target="_blank" class="link-external"> Formata</a> is a nice sans and has OsF available. They're in the <a href="http://www.bertholdtypes.com/adobe_lib/080337000.html" target="_blank" class="link-external"> expert set</a>, so you'll either have to keep swapping or use a font editor to rearrange your own OsF version. These used to be marketed by Adobe, but I think you can only get them through Berthold now. <br> <br>A couple of the Font Bureau's sans serif fonts have OsF available -- Benton Gothic, Berlin Sans, and Petr van Blokland's <a href="http://www.fontbureau.com/fonts/font_frames.tpl?cart=1036447081260870&amp;fontname=Productus" target="_blank" class="link-external"> Productus</a>. I think the last one comes with OsF standard. The others you may have to request specially. But if you find TheSans too costly, these may not be in your price range either. <br> <br>-- K.</p>
