    html: <p> &gt; why do fonts with OSF always put them together with the Small Caps or something? <br> <br>Not always, but usually, yes; because the "default" style of a font generally has to appeal to the lowest common denominator, and the LCD is comfy with the numerals lining up tidily. Since you're not there to explain to each user why they should prefer OS figs, you eventually end up with lower sales... <br> <br>hhp </p>
