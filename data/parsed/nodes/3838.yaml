  html: "<p> Can anyone recommend a font with Old Style Figures as part of the regular weight? Eg: Goudy. <br> <br>And why do fonts with OSF always put them together with the Small Caps or something? Anyone know why? <br> <br>Also what other sans serif font, aside from The Sans comes with OSF? <br> <br>Thanks </p>"
