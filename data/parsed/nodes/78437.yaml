      <p>It's hard to recommend specific fonts without knowing more about the style you're trying to project and so forth.</p>
      <p>&gt; Currently we have a theme and each editor<br>
      &gt; for each section applies that theme in their own method</p>
      <p>Not sure if you're using "theme" to mean a visual look, or something more in the editorial/philosophical sense. But if you're concerned that the sections will look unrelated, one way to add some visual harmony is to create a selection of fonts and colors, and then ask each editor to pick and choose what they want from those groups. Each editor retains some creative freedom and can lay out the pages in their section as they wish, but the common elements add some overall harmony.</p>
