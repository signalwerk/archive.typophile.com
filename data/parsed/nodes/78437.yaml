  html: <p>So I'm taking over our Yearbook next year here at Newbury Park High School. I know it's early, but I'm working on mockups for next year because I'm reorganizing the whole thing. Currently we have a theme and each editor for each section applies that theme in their own method. This year it's digitized. I know. TERRIBLE. So next year, we're having a standard design. My co-editor Shanti and I have basic layouts done, but we're looking for the perfect fonts. We're a school, so we don't have a large budget for fonts. We need a title font (or as many as you want to name) and a body font. What has kept us stuck is pairing the two. Any ideas? Much Love, Christoph &amp; Shanti!</p>
