      <p>&gt; That sounds really good actually as not seeming<br>
      &gt; so "this is how it is" and authoritarian and stuff. </p>
      <p>Yeah, if you give people a nice range of choices it doesn't seem as constraining to them. </p>
      <p>Just be sure that the choices go together reasonably well; for example choose a palette of colors that work together well rather than a bunch of random colors. (That's something your art teacher could help you with if you're not knowledeable about color theory.)</p>
      <p>Another approach that's even looser is to specify one font family and 1 color (maybe a school color) that each editor must use somewhere on their pages, but they are free to also add any other fonts or colors. The result would be less harmonious than my previous suggestion, but would create a least a little bit of relationship between sections.</p>
