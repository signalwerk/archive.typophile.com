    <p>I'm trying to classify <a href="http://www.fontsmith.com/fonts/fs-albert.cfm?tab=overview" rel="nofollow">FS Albert.</a></p>
    <p>I think it's a (Neo)-grotesque font, but then it doesn't have tight apertures and 'g' you might expect.</p>
    <p>Anybody got any suggestions?</p>
