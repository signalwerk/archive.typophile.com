    html: <p>Taking the large apertures in account, I think FT Albert could also be classified as a rounded humanist sans serif. Also, its interrupted construction is more common to the humanist sans serif as to the modern sans. Compare the join of the horizontal curved stroke of ‘n’ in Syntax, a typical humanist sans, with Univers, a typical modern sans / neo-grotesque.</p>
