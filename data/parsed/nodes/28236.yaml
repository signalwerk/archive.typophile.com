      <p>&gt; elegant ... the top being slighty, to greatly smaller than the bottom.</p>
      <p>I agree, coupled with a sufficiently narrow width* (the two things being also related structurally, like in the “B”). But if the top is too small I think the glyph starts becoming less elegant (maybe because it becomes a caricature of an “S”, and nobody wants to do the Waltz with a clown).</p>
      <p>* Narrowness/tallness being the prime attribute of “elegance” in my mind.</p>
      <p>&gt; that was impossible, isn’t it?</p>
      <p>I guess you mean the very small <cite>loopy</cite> top of the script “s”. Maybe it can be possible if you loosened the topological requirements of what an “s” is, and put a strategic gap somewhere in the stroke of the loop? I’d have to flesh that out...</p>
      <p>&gt; Weiss Initials look like the top is bigger than the bottom</p>
      <p>But in the Weiss lc the top actually <cite>is</cite> larger, so I’d think the Titling probably has the same spirit (if not geometry) intentionally.</p>
      <p>—</p>
      <p>BTW, I think we’ve been missing the (typographically) obvious solution to your logo: find a font with a really nice section mark! Any suggestions on that guys?</p>
      <p>hhp</p>
