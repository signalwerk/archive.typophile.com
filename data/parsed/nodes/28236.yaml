    html: |-
      <p>“I suspect this optical effect is because the narrowed top in a physical object makes it more stabile”</p>
      <p>That may be true because the effect begins historically before the advent of lowercase. But, if you excercise the issue visually, you can produce all caps with less difference between top and bottom that look better in that specific use, and normal caps with a difference tuned to the l.c., i.e. a bigger difference than normal for a small x-ht, and a smaller difference for a big x-ht., and see that the best caps for all uses are somewhere in between those two versions. So, in effect, if you decide to compromise the S and s for low resolution, you are, in effect either incompetent, or led by someone of similar abilities, but you are in no way actually helping the user, much.</p>
