    html: |-
      <p>On the top of the ’S’ being smaller. Stanley Hess, in ’On the Modification of Letter Forms’ says that as a general rule, any vertically divided letter tends to have the top half narrowed. </p>
      <p>Thus the top half of the B and S are generally smaller, the top arm of the E shorter, the top arm of the a shorter, etc. I think the rule is more general. In furniture, the classic ’highboy’ or ’chest on chest’ of drawers has the top half narrowed. Otherwise the top looks ’overweighted’. Similarly often with buildings (not Bauhaus though). </p>
      <p>I suspect this optical effect is because the narrowed top in a physical object makes it more stabile. The roman letters, resting on a base line, we view to some extent as objects having weight. Perhaps with scripts, the ’marks on paper’ aspect is more prominent and the illusion of an object with weight holds less. This might explain the reversal...  </p>
      <p>On the shape of the s curves, there is something complicated going on, which I don’t understand, but we respond to the swan’s neck etc as being ’right’ and graceful.</p>
    html_clean: |-
