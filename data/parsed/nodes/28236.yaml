      <p>I’ve been thinking about the S recently, actually, and I think the definition of elegant is bound up in the delicate relationship between the top and bottom bowls, with the top being slighty, to greatly smaller than the bottom. Many modern fonts, in the pursuit of regulation, serve a tiny difference between top and bottom, and thus approach the geometric associated with a nazified doubling of the letter.</p>
      <p>I also mused on the possible relationship between the smaller top, and the very small top of S’s l.c. script version, but then, I realized that was impossible, isn’t it?</p>
    html_clean: |-
