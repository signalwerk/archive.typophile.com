      <p>Both for classic-looking Ss (that have a larger bottom bowl) and their possible arrangements, I would recommend the Dover facsimile publications on <a href="http://www.amazon.com/Decorative-Monograms-Artists-Craftspeople-Pictorial/dp/0486429792/sr=1-1/qid=1158297829/ref=pd_bbs_1/002-1701602-4475220?ie=UTF8&amp;s=books" class="link-external">Monograms.</a> Link will not be the first or the last among us to be asked to make a logo out of repeated letterforms.</p>
