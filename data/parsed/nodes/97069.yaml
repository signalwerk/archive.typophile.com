    <p>Dear all,</p>
    <p>Since years, Arabic fonts used in Mathematics, Physics and Chemistry for elementary - preparatory school's level are used locally in Arab countries.</p>
    <p>However, Dr. Lazrak and his team  (UCAM, Morocco) presented some interesting reviews for different used systems through the Arab World and, I think, they applied it to LaTex.</p>
    <p>Currently, with STIX fonts arriving to good maturity, I think it is time to work on this project and we, @ Aratypo, welcome any person who would like to share with us thoughts and efforts in order to realize this font.</p>
    <p>Thanking you in advance.</p>
    <p>About STIX: <a href="http://www.stixfonts.org/">http://www.stixfonts.org/</a></p>
