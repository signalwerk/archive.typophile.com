      <p>Oh dear, oh dear! Some people will never learn - and it seems to be turning into my life's mission to inform the general public about the dangers of this stuff.</p>
      <p><strong>This as a Public Information Message</strong>.</p>
      <p>NB: Both Bike and Hessian are dangerously close approximations, but please BEWARE - the actual font you are seeking has NEVER been made available to the general public. </p>
      <p>FYI: HELLS ANGELS and the winged deaths head logo (R) are trademarks owned by Hells Angels Motorcycle Corporation, registered in the USA and in many other countries. All logos and designs of Hells Angels are trademark-protected (TM) and protected according to international law. Copying and other use is not allowed. </p>
      <p>You really should have a damn good reason to be even thinking about using it, but if you're really brave you could just walk into your local 81 clubhouse and ask advice from members of the Big Red Machine. Believe me, being sued by these guys for copyright infringement would be the very least of your worries. </p>
      <p>For your own sake - take this information in the spirit it is intended - from one who knows (and no I'm not a member!) </p>
      <p>SUPPORT YOUR LOCAL 81</p>
      <p>Oh yeah! If you want a really good Tuscan Spurred font you should stop messing around with all those nasty Bosox/Tiffany variants and check this out:</p>
      <p><a href="http://www.letterheadfonts.com/fonts/bostonballpark.php">http://www.letterheadfonts.com/fonts/bostonballpark.php</a></p>
      <p>Rare and Unique Fonts.</p>
