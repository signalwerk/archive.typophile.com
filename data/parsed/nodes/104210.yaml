      <p>Seems to be an exact match in <a href="http://www.fontalicious.com/project/bike/">Bike</a> by Fontalicious. Love the explanation:<br>
      ---start quote---<br>
      When I was working on a project one day, I went a-lookin’ for the Hell’s Angels font. Not only did I not find it, but along the way I bumped into the information that they don’t give that font out, it’s in their secret files. Really guys?? I guess now we all know one more thing about the infamously bad ass biker gang…they pilfer cool fonts. Well, I went ahead and made it, that’s how I roll. Last time I checked, no other designers were putting their life on the line making fonts. You’re welcome.<br>
      ---end quote---<br>
      How close? decide for yourself:<br><img src="/sites/default/files/old-images/Bike_5867.jpg"><br>
      Don</p>
