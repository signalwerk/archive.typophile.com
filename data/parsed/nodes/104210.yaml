    html: "<p>As usual with Tuscan, very frustrating as I couldn't get a match or a name. This one reminds me of those used in the embroidery industry mainly for baseball team purpose. Some suggestions for similars: <a class=\"freelinking external\" href=\"http://www.dafont.com/bosox.font\" rel=\"nofollow\">Bosox</a> (Boston Red Sox fan font), <a class=\"freelinking external\" href=\"http://fr.ffonts.net/Stahls-Tiffany-2000.font\" rel=\"nofollow\">Stahl's Tiffany</a>, <a class=\"freelinking external\" href=\"http://www.dafont.com/mlb-tuscan.font\" rel=\"nofollow\">MLB Tuscan</a> (Major League Baseball fan font), <a class=\"freelinking external\" href=\"http://www.dafont.com/akaposse.font\" rel=\"nofollow\">akaPosse</a>, <a class=\"freelinking external\" href=\"http://www.dafont.com/high-on-fire.font\" rel=\"nofollow\">High On Fire</a>, <a class=\"freelinking external\" href=\"http://www.dafont.com/ifc-los-banditos.font\" rel=\"nofollow\">Los Banditos</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/hydro74/h74-warriors\" rel=\"nofollow\">Warriors</a></p>"
