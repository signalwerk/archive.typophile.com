      <p>Early 19th century type category called Tuscan had these split &amp; curled ends -- like a "bad hair" day. Were various photo-composition era versions that could have been used for the logo. Digital versions usually are dumped in various unrelated categories like western, circus, and as in the case of Hessian, biker/motor cycle.So far found nothing closer than Hessian.<br>
      Don</p>
