      <p>AFAIK the Hells Angels patch and logo are protected under copyright. So  if you find a pirate copy of a digital file that was originated by Hells Angels be careful not to break the law by using it, or that's not all that might be broken:) However, seems to be no LEGAL problem [at least in USA]  with creating a new digital design that matches an image provided it has a name that will not infringe.<br>
      Don</p>
