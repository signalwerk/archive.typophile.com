      <p>&gt; <em>why not 20, was #19 unmentionable?</em></p>
      <p>To be completely honest, we only featured 18 top typefaces, because our thumbnail display grid is divisible by 6. It makes for a tidier presentation. I suppose we could have bumped it up to the top 24 faces, but then it would open up the discussion to ’what happened to number 25?’</p>
      <p>&gt; <em>They don’t account for any multiplicity in the licensing when they do the stats?</em></p>
      <p>Our stats do not include additional licensing numbers. The top seller lists that we publish include only unit sales, not multi-seat or multi-device licensing.</p>
