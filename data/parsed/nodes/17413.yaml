    <p><a href="http://www.veer.com/products/gallery.aspx?gallery=264" target="new"></a></p><div class="imageWrap"><a href="http://www.veer.com/products/gallery.aspx?gallery=264" target="new"><img src="/files/veer2006type.jpg"></a></div><p></p>
    <p>Veer posted it’s Top Type for 2005 which shows the 18 “<a href="http://www.veer.com/products/gallery.aspx?gallery=264" target="new">hottest faces</a>” selected by its customers.</p>
    <p>Even Veer humorously notes that a few aren’t even scripts.</p>
    <p>All in all, I feel it’s always good to give your customer base feedback like this. Holding up the mirror to your shoppers and letting them know what most of them (I assume) bought does in fact reshape the mindset for the next purchase. Some will jump on the bandwagon and buy a script, some will jump off and try another typestyle next time. </p>
    <p>Remember, <em>Top</em> doesn’t necessarily mean <em>best</em> when merchandising, and it’s ALWAYS nice to have some top sellers.</p>
