      <p>Here are Linotype’s current top sellers.<br>
      <a href="http://www.linotype.com/8-37-8/fontcharts.html">http://www.linotype.com/8-37-8/fontcharts.html</a><br>
      These lists are based on real data. There are two categories of 20, text and headline. At least 16 of the headline fonts are scripts (and if Papyrus and Old English can be considered script fonts, that 18 of 20 are scripts). I wouldn’t say that Linotype’s customers visit the website only looking for sans serif fonts, or even for serious fonts at all. How different is the headline top 20 from a list at Veer? Maybe Veer’s fonts were designed more recently, and maybe Veer’s customers go in for a more grungy look. I’d be interested to know where Veer’s customers come from, too, i.e., what percentage of the customer base is North American versus other continents and countries. I’d bet the the “rough look” is more in at certain places than others.</p>
      <p>Compare the current top seller list with another Linotype Feature: 2005’s favorites<br>
      <a href="http://www.linotype.com/8-2628-8/favouritefonts2005.html">http://www.linotype.com/8-2628-8/favouritefonts2005.html</a><br>
      Year round rather than up-to-the minute. The “business fonts” don’t differ too much, but the “casual” ones do. Not as many scripts here. At other parts of the year, it seems that other types of display type were popular, too. Which fonts sell most when might have something to do with what fonts are marketed when. I bet that MyFonts.com would witness similar trends.</p>
      <p>Speaking of MyFonts.com, here is their best seller list, which is updated daily:<br>
      <a href="http://www.myfonts.com/bestsellers.html">http://www.myfonts.com/bestsellers.html</a><br>
      What better way to get instant feedback on who is buying which fonts. Like Linotype.com, two Linotype fonts top this list as well, Zapfino and Neue Helvetica. From today’s top-50, 22 are scripts, 18 are sans serifs, 5 are serif faces, 3 are “other” (sorry for the over-generalization here), and two are ornaments/symbol fonts. The sans serifs licensed here are not so different from the sans serifs licensed at Linotype.com</p>
      <p>FontShop keeps charts as well. I like these, because FontShops operate locally. It isn’t easy to visit another country’s FontShop, i.e., if you are in Germany, you have to enter in a FontShop USA’s URL twice before the site will even open, because of automatic re-direct.<br>
      Here is FontShop Germany’s Top 25:<br>
      <a href="http://www.fontshop.de/sukr.php3?ch=%2Fprodtips.php3%3Fns%3D10%26sns%3D1%3Cbr%20/%3E">http://www.fontshop.de/sukr.php3?ch=%2Fprodtips.php3%3Fns%3D10%26sns%3D1%3Cbr%20/%3E</a><br>
      Of the 25, only four are scripts—exactly the bottom four (the best, P22 Cezanne, comes in at place 22). Only 2 serif faces on this list. Of the top 25, 7 come from FontShop Internation or Font Shop (one is only labeled “FontShop”; I thought that all FontShop fonts were from FontShop Internation (FSI)?). 17 are from other foundry’s. Like I already said, I really like this list, because it seems to say a lot. Namely, Germans who license fonts from FontShop like sans serifs. They don’t necessarially prefer FSI’s own typefaces, but they still buy from FontShop, rather than going to another site like Linotype’s or Monotype’s or MyFonts, where many fonts are even cheaper because of exchange rates and taxes and other things. Does the lack of script strength say anything about German tastes? Maybe Germans don’t like script fonts as much as Americans do? Maybe they do like them, but get them at Veer, or for free from Free Font download sites?</p>
      <p>Does the SF site, FontShop.com, have a top seller list, too? They have really pretty e-mail newsletters.</p>
      <p>Monotype’s Fonts.com website has a Top Ten:<br>
      <a href="http://www.fonts.com/FindFonts/Top10.htm">http://www.fonts.com/FindFonts/Top10.htm</a><br>
      Of these 10, there are no scripts, just 9 sans serifs and 1 serif.</p>
