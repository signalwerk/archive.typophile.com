      <p><em>But then how does that jive with the top-N lists of some<br>
      other font houses consisting mostly of neutral sans faces?</em></p>
      <p>It depends how you calculate a sale, I think.</p>
      <p>For instance, say that Foundry X has a standard EULA, which is good for 10 workstations. Foundry X only has two fonts in its library, Script Face 123 and Grotesque 567. Foundry X sells 100 transactions of Script Face 123 and 50 transactions of Grotesque 567 per month via its online store.</p>
      <p>Technically, Script Face 123 is the foundry’s best seller, right? Not necessarily. Lets say that all of the Script Face 123 transactions were with the standard, 10 user license. But half of the Grotesque 567 transactions were for more workstations… anywhere from 11 to 11,000.</p>
      <p>Now Grotesk 567 is the foundry’s best seller, because it licensed the most workstations in a single month, even though it had less single transactions via the store.</p>
      <p>You should always ask yourself which numbers you’re looking at in top-N lists.</p>
