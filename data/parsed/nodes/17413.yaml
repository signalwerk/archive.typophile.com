      <p>Best seller lists are more revealing about single-font trends, and scripts tend to be single.</p>
      <p>For instance, at Myfonts, a single sale of a large font family to a multi-user licence would not register on the top 50, but if they did things by dollar value, or multiplied the number of fonts in the package by the number of licences users, then it probably would.</p>
      <p>Veer promoted my new typeface Nicholas last year, with a full page in their catalog, and with a front-page main banner ad online. It’s a serif design (the category trailing scripts and sans), and I think we’re both happy with the resulting sales, although it didn’t make the top 18 (BTW, why not 20, was #19 unmentionable?)</p>
