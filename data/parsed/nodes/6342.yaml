  html: <p>Hi Guys <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>I created this mock up type treatment for a logo. It's only really for practice in letterform construction, but I'd really appreciate your feedback on it, so as to tighten it up. Looking at it now, I'm starting to think the 'a' is optically a little narrow. What do you think? <br> <br>thanks!<img src="http://www.typophile.com/forums/messages/29/47436.jpg" alt="logotype"></p>
  html_clean: <p>Hi Guys <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>I created this mock up type treatment for a logo. It's only really for practice in letterform construction, but I'd really appreciate your feedback on it, so as to tighten it up. Looking at it now, I'm starting to think the 'a' is optically a little narrow. What do you think? <br> <br>thanks!<img src="http://www.typophile.com/forums/messages/29/47436.jpg" alt="logotype"></p>
