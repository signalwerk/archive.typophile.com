    html: "<p>hey luke, <br>i always hafta start with a disclaimer when i critique <br>so here it is: i'm no expert so take all advice with a grain of salt. <br>that said, i think you've got a good start here. <br>very clean, crips letter forms. i find the a is particularly interesting. <br>one thing i noticed: the modulation on the e and s is not as well done as the a, n and r. <br>put a bit more stress on those letters and perhaps in the crook of the f.</p>"
