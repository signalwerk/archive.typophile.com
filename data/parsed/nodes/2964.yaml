    html: "<p>I think it's mostly a matter of taste, or maybe in the degree of letterwise divergence desired. <br> <br>There is a different \"dynamic\" in the two letters, though: <br>In the \"B\" the width of the glyph is proportional to the lopsidedness of the two bowls: the smaller the top, the more the bottom can extend to the right (without looking stretched). And in the \"E\" the height of the waist is limited by the \"empty look\" you mention. <br> <br>hhp <br></p>"
