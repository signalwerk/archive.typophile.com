  html: <p>I have been looking at the relationship between a serif capital B and a serif capital E.  I noticed that in some faces, the waist of the B is higher than the central arm of the E. Why is this? It mostly happens in Venetian and Old Roman typefaces (i.e., Monotype Centaur, Adobe Garamond) that have an almost circular capital O and oldstyle proporations. Perhaps it's easier to keep the lobes of the B circular  when differences between the top and bottom are a little more exagerrated.. but why not then just adjust the E as well? Does that make the bottom of the E too light? Or is it just a matter of personal preference? </p>
  html_clean: <p>I have been looking at the relationship between a serif capital B and a serif capital E.  I noticed that in some faces, the waist of the B is higher than the central arm of the E. Why is this? It mostly happens in Venetian and Old Roman typefaces (i.e., Monotype Centaur, Adobe Garamond) that have an almost circular capital O and oldstyle proporations. Perhaps it's easier to keep the lobes of the B circular  when differences between the top and bottom are a little more exagerrated.. but why not then just adjust the E as well? Does that make the bottom of the E too light? Or is it just a matter of personal preference? </p>
