    html: |-
      <p>Well I think #2 has the most harmony.  The type and mark relate well, but do tend to look a little plain.</p>
      <p>4 has some potential.  I would echo the comments on making the splats more random.  I would also echo the humanist serif idea.</p>
      <p>This is a guild, right.  Perhaps one mark can show one pottery element made of different pieces, illustrating the guild aspect.</p>
      <p>I also can’t help but thinking about how this type would look blind embossed into some clay.  Perhaps thinking along those lines might open up another creative direction for you.  Go to a china shop, or a japanese cookware store and look at the bottoms of the pieces.  You are bound to get some ideas from that.</p>
