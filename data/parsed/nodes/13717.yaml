    html: |-
      <p>I prefer 4 and 5, but the type (particularly the ‘clinton’ and ‘guild’) is flat and dead next to the mark. Try a serif with more humanist features and softening elements; more quirk!</p>
      <p>This assumes you’re going for&nbsp;a softer image. Your designs span a wide range of looks: hand-done, creative, stoic, professional, modern/contemporary. Clarifying that may help you pick which to show.</p>
      <p>Never show a logo you don’t want them to choose (if you have a choice). I usually never show more than 3 major variations (sometimes I include sub-variations). If I can, I show 1.</p>
