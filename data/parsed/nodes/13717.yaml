    html: |-
      <p>“Ceramics are handmade. I think the typeface should reflect that.”</p>
      <p>I might disagree with that. When I think ‘ceramics shop’ I think of the truly handmade crap you see in every semi-artsy tourist town. Usually a gallery with hundreds of sloppily made mugs and ash trays with glaze slapped all over it.</p>
      <p>As such, I’d try to distance this company, which is ‘high end’ away from that. When I think high-end, I tend to think much more refined forms. And while the forms may be organic, I think a more ‘high end’ feel to the type wouldn’t hurt.</p>
