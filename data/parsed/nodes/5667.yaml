    html: <p>Nice start.  colors look good together. Dots have been done a lot in the dot com boom, but I have not seen them done exactly in this sequence/composition. I am not sure, but perhaps a bit dated? I still like it. "ti" seem a little small. bowl on "a" a bit large with respect to negatiev space above bowl. "o"'s a bit small, should usually reach a bit above and below x-height. perhaps most characters are same width, they need to be optically adjusted. As is "n"s and "u" seem toog big as the negative space within the characters open it up too much. Try to un-focus your eyes as you look at this and you will notice these characters stand out from rest. <br>I personally like when letters with long verticals align, but this is not always possible. </p>
