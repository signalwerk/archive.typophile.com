  html: <p>Hi everyone, <br> <br>I am extremely glad I stumbled across this forum. I've read a great deal of posts, and am extremely impressed by the quantity and quality of feedback. <br> <br>Maybe I could ask for your help. I designed this logo for my own freelancing business, but I think it could use an update.  <br> <br>I want to emphasize the notion of sequentiality, building, and progression in the logo. <br> <br>My second goal is to use a more modern design and (especially) typeface. I don't think I really like this font as much as I did when I designed the logo a while ago. <br> <br>Thanks for any assistance rendered! <br> <br><img src="http://www.typophile.com/forums/messages/29/40873.jpg" alt="Sequential Communications Logo"></p>
