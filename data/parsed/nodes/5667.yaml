    html: <p>Ole, <br> <br>Thanks for the tips about the font. I think that a complete change might be in order. Do you have any suggestions/names? <br> <br>Daniel, <br> <br>Sequential was only chosen because I liked the name. As I mentioned above, I like the connotation of progression and building. As for a tagline, I suppose I left one out because I was concerned about overcrowding the visual space. Even so, I'm not sure what to add. I don't really specialize in anything and I almost feel like adding a tagline would be redundant... <br> <br>Thanks for the comments so far!</p>
