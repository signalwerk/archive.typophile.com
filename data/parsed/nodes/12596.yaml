    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12011" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Education</a>&nbsp;: Art Center College of&nbsp;Design</strong></p>
    <p>Art Center College of Design is an art and design school in <a href="/node/33148" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Pasadena</a>, <a href="/node/20056" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">California</a> recognized for the strong portfolios of its students and its pricey&nbsp;tuition.</p>
    <p>Students learn a mixture of skills in design, media, and material fabrication. Strong programs at Art Center include transportation design, industrial design, illustration and graphic design. Notable faculty in graphic design include Anne Burdick, Lisa Nugent, and Simon&nbsp;Johnston.</p>
