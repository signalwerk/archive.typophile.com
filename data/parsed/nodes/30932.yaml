      <p>hend it?</p>
      <p>I've never liked that b.<br>
      The alternative script form of b, which keeps going in a counter-clockwise rotation at the bottom of the main stroke, and then connects to the next letter from a little ball at one o'clock, is far less ambiguous, and has a great deal of historical precedent -- though perhaps not totally authentic vis-à-vis Mr Bickham.</p>
