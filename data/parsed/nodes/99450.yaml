      <p>I just saw this thanks to your other thread...</p>
      <p>This is probably too little, too late, but some thoughts and ideas:<br>
      - Gerry Leonidas is in fact somebody you should definitely contact.<br>
      - For a very different perspective also contact Panos Vassiliou.<br>
      - For the musical angle there's one name that stands high above the rest: Frank Blokland.<br>
      - Typophile is the best place to find discussions (especially involving yours truly :-) concerning calligraphy's severe limitations with respect to type. To me calligraphy fails to promote -and in fact essentially opposes- functional or cultural progress in type design.</p>
      <p>hhp</p>
