    html: |-
      <blockquote><p>It occurred to me that indeed typography may influences our behavior and choices for example during political campaigns.</p></blockquote>
      <p>The clearest example that comes to mind, that of Obama and Gotham has always struck me (in the limited extent to which I have given it any thought) as parasitic, rather than inherently or obviously complimentary. I think Gotham could just as easily have lent itself to any party and any campaign, given the right typographic perspective. Others will no doubt disagree and as other threads here will demonstrate have given it considerably more thought. That said, the nature of typography as used in political campaigns probably merits some study and could generate some worthwhile insights into both the nature of political branding and the contrast between the intent of the designer (where any exists) and the use of that type in the wider world.</p>
      <p>If this is something that you choose to pursue you will no doubt get some perspective or insight on using content from Typophile as source material from <a href="http://typophile.com/readthetype" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Christopher Timothy Dean</a>, the forum's eminent Typographic Cognitive Psychologist.</p>
