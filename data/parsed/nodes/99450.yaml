      <p>Thank you, Karl. </p>
      <p>I studied piano when I was little, but it never occurred to me that there is a special typography department for music. Giovanni Murolo made quite a great job in designing typefaces for notes. I am not so advanced in typography. Actually, I am just entering its world. My thesis should include research written in 10.000 words. The practical part will be introduced next year. </p>
      <p>When I asked about the connection of typography and music I was thinking of the words of R. Bringhurst from "The Elements of Typographic Style" where he relates quite often typography with music:<br>
      "Like music, it (typography) can be used to manipulate behavior and emotions.", or " [...] the practice of typography is like playing the piano - an instrument quite different from the human voice."</p>
      <p>It occurred to me that indeed typography may influence our behavior and choices, for example, during political campaigns. I was wondering: based on which factors politicians are choosing their campaign font? Is it related to their political beliefs? Specific fonts are used from right wings and other fonts from left wings? etc. And how these fonts are affecting people's voting...</p>
