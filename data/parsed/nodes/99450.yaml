      <p>If you are seriously considering looking at Greek fonts and typography I cannot recommend highly enough reaching out to Gerry Leonidas. He is not only an expert in this area but on type in general and also head of the Typography Department at the University of Reading.</p>
      <p>There is a great deal of expertise amongst the contributors on this site and most would be willing to give you pointers (myself included) where it seems constructive and relevant. However, if you specify the topic and start any new threads I would suggest being very clear about what you are doing and at what level.</p>
