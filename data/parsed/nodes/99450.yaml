      <p>Hello, Karl!</p>
      <p>Since you are the only one interested in my subject (in some way), this is what I was thinking reading the "typophile" blog.<br>
      There is a lack of Greek fonts in Greece today. Those who are designing them in most cases are foreigners and not Greeks.<br>
      How anyone begins to design a Greek font? Based on which criteria? Which are the needs of Greek graphic designers today? Should it be based on Latin alphabet (which is a worldwide debate between typographers) or purely on Greek one? </p>
      <p>P.S. my adviser told me that since I am not going to specialize in politics, maybe it's not worthy to lose my time on such a research. He has a point...</p>
