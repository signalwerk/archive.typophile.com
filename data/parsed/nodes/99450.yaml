    <p>Hello!</p>
    <p>I am a Graphic Design student and I am making my 3rd attempt to write a thesis. By writing here, I consider myself desperate, because I cannot find a topic for my thesis. The only thing I clarified for myself is that I am interested in typography and calligraphy. And writing a thesis on these topics could help me to use what I've learned in my future projects.<br>
    Although I am reading everywhere in attempt to find something which would excite me, I am at a dead end.<br>
    So I am asking for your help. </p>
    <p>I have in mind some questions, but I am wondering if they could evolve into a thesis argument: </p>
    <p>1. Which are the limits of calligraphy?<br>
    2. What's the connection between typography/calligraphy and music?<br>
    3. Serif fonts are suitable for books (long reading), sans serif - for numbers. Excluding the aesthetic factor,<br>
        what's the purpose of semi serif fonts? </p>
    <p>I need some hints so I could move on in developing a thesis argument.</p>
    <p>Thank you!</p>
