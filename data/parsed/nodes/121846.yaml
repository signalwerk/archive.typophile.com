    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ts_page2_6360.jpg"></div><p></p>
    <p>This typeface looked a lot like Century Expanded, but the capital J that goes below the line eliminates that.</p>
    <p>The italic capital Q eliminates Baskerville or Bulmer. I'm pretty sure this isn't Imprint, because it doesn't look at all like Caslon. (Similarly, it isn't the Phemister Old Style.)</p>
    <p>I think I should be able to recognize this typeface immediately, but I'm embarassed to admit that I can't.</p>
    <p>Also, I see that it is not Number Twenty-One from Linotype; that doesn't have a descending J, and it has a different type of Q in the italic.</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
