      <p>Although I haven't been able to fully verify this, as the page with Baskerville on it isn't in the preview of "The Type Specimen Book" by V&amp;M Typographical on Google Books, and Baskerville isn't in "The Linotype Manual", looking at <em>Intertype</em> Baskerville on <a class="freelinking external" href="http://www.urbancottageindustries.com/blog/print-library/intertype-faces/baskerville-font/" rel="nofollow">this page</a> leaves me little doubt that you're absolutely right.</p>
      <p>Ah, the Linotype specimen in question is online <a class="freelinking external" href="http://www.linotypesetting.com/html/content/mats.php" rel="nofollow">here</a>.</p>
