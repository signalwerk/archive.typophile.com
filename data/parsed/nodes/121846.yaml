      <p>Looking at the Baskerville types in Mac McGrew's book "American Metal Typefaces of the Twentieth Century", this looks like the Linotype version of Baskerville. The italic 'k' is I think the key to separate it from the Monotype and ATF versions. It also has that unusually long J, and the italic Q seems to match.</p>
      <p>- Mike Yanega</p>
