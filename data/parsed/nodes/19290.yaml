    html: |-
      <p>here’s a little birthday ditty we used to sing to the birthday kids in class at <a href="/wiki/BYU" class="wiki">BYU</a>:</p>
      <p>Пусть бегут неуклюже<br>
      Пешеходы по лужам,<br>
      А вода — по асфальту рекой.<br>
      И неясно прохожим<br>
      В этот день непогожий,<br>
      Почему я веселый такой.</p>
      <p>Я играю на гармошке<br>
      У прохожих на виду…<br>
      К сожаленью, день рожденья<br>
      Только раз в году.</p>
      <p>Прилетит вдруг волшебник<br>
      В голубом вертолете<br>
      И бесплатно покажет кино.<br>
      С днем рожденья поздравит<br>
      И, наверно, оставит<br>
      Мне в подарок пятьсот «эскимо».</p>
      <p>Я играю на гармошке<br>
      У прохожих на виду…<br>
      К сожаленью, день рожденья<br>
      Только раз в году.</p>
      <p></p><div class="imageWrap"><img src="/files/cd093.gif"></div><p></p>
