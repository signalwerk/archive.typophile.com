    <p>Hey yo,<br>
    I'm looking for some contemporary serif typefaces with interesting italics to be used for pullquotes and headers in a women's magazine.</p>
    <p>The sort of thing I'm looking for:<br>
    <a href="http://www.psyops.com/html/spec_oxtail.html" rel="nofollow">Oxtail</a><br>
    <a href="http://www.psyops.com/html/spec_remon.html" rel="nofollow">Remontoire</a><br>
    (straight from typophile's very own Stefan Hattenbach!)</p>
    <p>Faces like <a href="http://www.paratype.com/fstore/default.asp?fcode=248&amp;search=Kursivschrift" rel="nofollow">Kursivschrift</a> are right up the same alley as well, if not perhaps a bit overused.</p>
    <p>Any thoughts you guys might have on this would be greatly appreciated.</p>
