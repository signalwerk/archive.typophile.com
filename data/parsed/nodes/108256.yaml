    date: 2014-01-15T06:17:00
    date_raw: 15 Jan 2014 — 6:17am
    votes: null
    html: |-
      <p>Can't agree more with you, Mike. Never thought Ronna Penner could have plagiarized or even been inspired by Vistula. I'm pretty convinced 'Psalter' is set using Vistula. What I'm worrying about is, as you confirmed, SummitType/SummitSoft is well-known for its illegal activity. But unfortunately, I was not able to find the possible origin font for Vistula...<br>
      They have actually 3 different names for the same font: Vistula, <a class="freelinking external" href="http://summittype.com/fonts/16603/muranso.html" rel="nofollow">Muranso</a> and <a class="freelinking external" href="http://www.whatfontis.com/Vandyke.font" rel="nofollow">Vandyke</a><br>
      Another one is <a class="freelinking external" href="http://www.myfonts.com/fonts/baselinefonts/bobbi-bee" rel="nofollow">Bobbi Bee</a> by Baseline Fonts.</p>
