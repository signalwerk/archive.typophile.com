  - id: 569331
    user: 3368
    date: 2014-01-15T05:43:00
    date_raw: 15 Jan 2014 — 5:43am
    votes: null
    html: |-
      <p>Yikes, Ryuk ... that place offers tons of extremely amateurish fonts. The few fancy script fonts I checked seem to be very crude remakes of existing fonts - with lots of generated variants. See Virtuoso (Ariston) for example. Adriattica is clearly derived from Present - again, very crudely.</p>
      <p>I'll definitely be giving the benefit of the doubt to Ronna Penner of Typadelic.</p>
