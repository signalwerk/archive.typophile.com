  html: |-
    <p>GT Walsheim is a geometric sans serif inspired by the historic lithography poster lettering of Otto Baumberger.</p>
    <p>We just released the final version of GT Walsheim on our website. It is now available in 16 styles (eight weights and fitting obliques). It features SmallCaps, automatic fractions, alternate Umlauts and support for over 70 languages, with a character set slightly shy of 700 glyphs. We are now also releasing trial versions of all typefaces with this kind of complete glyphset.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/GT-Walsheim-Teaser_6576.png"></div><p></p>
    <p><a href="http://www.grillitype.com/typefaces/walsheim#trial" rel="nofollow">Get your free trial version of all 16 GT Walsheim styles. It contains the basic character set, but no kerning pairs.</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/GT-Walsheim-Features_6519.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/GT-Walsheim-Overview_4916.png"></div><p></p>
    <p><a href="http://www.grillitype.com/typefaces/walsheim" title="www.grillitype.com/typefaces/walsheim">www.grillitype.com/typefaces/walsheim</a></p>
    <p>(I previously posted about GT Walsheim <a href="http://typophile.com/node/79053" rel="nofollow">here</a>)</p>
