    html: |-
      <p>glad they’re sticking with the classic yellow logotype from the book. brand loyalty !<br>
      agree that the perspective type above seems off somehow. could have gone straight across the top.</p>
      <p>generally striking, though. as a fan of the book i’m looking forward to this. so far the visual identity of the movie looks very impressive, with some layouts matched faithfully from the original drawings. </p>
      <p>B+ for poster design, A- for brand identity.</p>
