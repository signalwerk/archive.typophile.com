    date_raw: 23.Oct.2008 2.07pm
    votes: null
    html: <p>It’s interesting how teaser posters tend to be more interesting than the final one-sheets. This is a pretty striking and compelling design that really hints at the content of the film. But I’ll bet a pitcher of Delerium Tremens that when this film is in theaters the one-sheet will just be the title, disclaimers, credits, and a few headshots poorly Photoshopped together.</p>
