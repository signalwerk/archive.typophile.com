    <p>Hello typophiles, I'm glad to tell you Cocijotype has released Zipolite, a condensed sans serif in seven weights, inspired in the ambient of a beach with the same name. I hope you like it! <a href="http://new.myfonts.com/fonts/cocijotype/zipolite/" title="http://new.myfonts.com/fonts/cocijotype/zipolite/">http://new.myfonts.com/fonts/cocijotype/zipolite/</a><br>
    Sorry I could not attach or insert images, the site doesn't allow me.<br>
    Regards!</p>
