    <p>Hello - apologies if this a stupid or often-asked question, but I've managed to blag my way into designing a magazine (210mm x 260mm) and am studying like mad to get it professional and stylish looking. I'm going for a pre-war british Gill-inspired new-retro faded aesthetic but am having problems with my main text serif font. I'd like it to look 20s - 50s era London, but it is far far more important that it is readable and well balanced as everything else on the page will give the main style I'm thinking. After comparing some big name fonts I'm thinking of going for Sabon Next - although Mercury looks okay and I'm yet to have a good look at Whitman. Some pages are newspaper style - four columns no space, and some more bookish - two column loads of space, so I need an allrounder and I figured Sabon to be, not wow-beautiful, but serviceable for my needs. I'm not into Garamond (too delicate) or Times (too stiff). Any thoughts?</p>
    <p>What I really need to know though is the optimum font size and leading for the whole thing. I'm thinking of 9.5 Sabon, but what would the best leading be? My attempts so far - despite following some really good tutorials, being fairly proficient in InDesign, making a neat baseline grid, etc look horribly clunky (e.g. nothing as neat and crisp as these - <a class="freelinking external" href="http://http://speckyboy.com/2008/06/15/32-inspirational-examples-of-amazing-layout-and-typography/" rel="nofollow">http://http://speckyboy.com/2008/06/15/32-inspirational-examples-of-amazing-layout-and-typography/</a>) Basically what's an optimum all-round newspaper-magazine classy brit-style font-leading ratio? After going through these good forums I've found Mr Bringhurst, so he'll probably be able to answer all my questions when he pops through the letterbox, but in the meantime, any thoughts welcomed gratefully.</p>
    <p>And sorry again if all that sounds "gawd, not again"</p>
    <p>Kindess,</p>
    <p>Dron</p>
