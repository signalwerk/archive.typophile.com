      <p>Hi Jabez, thanks for replying. The magazine is an illustrated retro utopian newspaper, its about love and death in these extraordinary times, the audience is everyone who feels a love or a yearning for something they can't quite name, the content is spoof news articles, neo-regency agony aunts giving subversive advice about shoes and sex, guides to world history and staggeringly beautiful retro-style adverts for sweet nothing. Average length of articles between 300 and 3000 and if you can somehow blend what you've just read, with the information I've given above about what I know, what I need (body text - titling and so on is sorted) and a desire to create a Johnston-Gill style pre-war London aesthetic then I shall take my HAT OFF to you!</p>
      <p>Anyrate, your basic advice - obvious as it may sound to others - is relatively new to my ears and clearly sound - and I thank you for it. Make proofs, take a look and feel in my heart for the balance of white and text, etc... The reason I posted is that the 10pt Sabon Next on a 12pt baseline grid that I decided on after a first proof and print now suddenly looks so clunky to me and I can't work out why. (Obviously you'd need to see the thing, but that's not poss right now alas).</p>
