      <p>My cup runneth over!</p>
      <p>What I have finally gone for is Minion Pro and Gill Sans Pro. Minion was the tough one - Plantin, Baskerville and others had elegance and Englishness, but I just couldn't get anything to look as good as Minion 10pt on 12pt leading - which I copied from Bringhurst. Maybe when I get more experienced with this business I can somehow make other fonts look as well balanced, stately and readable, but for now it will have to be this. A few things about Minion don't work for me, tad angular, horrible capital Q, etc. But looks gorgeous on the page and that's that.</p>
      <p>I'm so grateful for all this help - I've learnt a lot. Particularly excited about Athelas and MVB Verdigris... maybe next time.</p>
      <p>Thanks again chaps.</p>
