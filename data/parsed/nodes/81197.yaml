      <p>Get hold of some Punch magazines from the era.<br>
      The editorial style is Victorian, but the ads will give you a good idea of the traditional conservative aesthetic of the era (less continental, less American than other trends of the era, therefore more British).<br>
      Most of them are set in Monotype faces.<br>
      Plantin would be a good choice for the text face.</p>
      <p><a href="http://cgi.ebay.com/PUNCH-MAGAZINE-25-ISSUES-1953-and-1954-LONDON-HUMOR-/330543226723?_trksid=p4340.m263&amp;_trkparms=algo%3DSIC%26its%3DI%252BC%26itu%3DUCI%252BIA%252BUA%252BFICS%252BUFI%26otn%3D10%26pmod%3D230595139224%26ps%3D63%26clkid%3D8464928459967936173#ht_4239wt_813" title="http://cgi.ebay.com/PUNCH-MAGAZINE-25-ISSUES-1953-and-1954-LONDON-HUMOR-/330543226723?_trksid=p4340.m263&amp;_trkparms=algo%3DSIC%26its%3DI%252BC%26itu%3DUCI%252BIA%252BUA%252BFICS%252BUFI%26otn%3D10%26pmod%3D230595139224%26ps%3D63%26clkid%3D8464928459967936173#ht_4239wt_813">http://cgi.ebay.com/PUNCH-MAGAZINE-25-ISSUES-1953-and-1954-LONDON-HUMOR-...</a></p>
