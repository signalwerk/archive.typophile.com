      <p>All this information is so valuable, so interesting. Thank you.</p>
      <p>BUT - Lord its tough - and I'd love anyone's thoughts on this one. On the one hand, utopia and sabon are so friendly on the eye, meaning, I suppose, they give subliminal ease of reading - they're 'transparent' - right? (again apologies for my unschooled descriptive fumblings here) Whereas Baskerville, Plantin and company, more attractive, but a TAD more difficult to read? Perhaps only because they're a TAD more unfamiliar?</p>
      <p>Yesterday I was all for utopia, but the commas and the capital R just make me sick, like I'm in a 1980's Madison boardroom.  </p>
      <p>Sigh. Striking a balance between practicality and pulchritude - I suppose this is ever the work of the smith.</p>
