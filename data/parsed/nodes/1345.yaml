  html: "<p>I am designing a logo for a company that does farming, farming ops, &amp; excavation. They all have United in the name and I'm going to use Barmeno for that. But would like to come up with some samples that use another font for the division names. They are looking for a logo that implies modern, up-to-date, reliable and efficient, but conservative enough for those old time farmers. It will be used for stencils and decals to go on equipment and vehicles as well as the usual print pieces. Does anyone have any suggestions of a font that would work well with Barmeno? I've never used this font before and just wanted to get some outside input as I work on my own. <br> <br>Example: United Agriculture <br> <br>Thanks to anyone willing to give me suggetions.</p>"
