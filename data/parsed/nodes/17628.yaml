    <p>Typophiles, I ask you for some advice.</p>
    <p>Over the past two years or so, I've been working on a new digitization of the <a href="/wiki/Centaur" class="freelinking" rel="nofollow">Centaur</a> types of <a href="/wiki/Bruce%20Rogers" class="freelinking" rel="nofollow">Bruce Rogers</a>. I've publicly posted images of the 60pt caps (visible on my "<a href="http://levien.com/type/myfonts/" rel="nofollow">fonts in progress</a>" page under "Museum Caps"), but have since drawn 60pt lowercase and a moderately complete 14pt optical scale.</p>
    <p>My feeling was that <a href="/wiki/Monotype%20Imaging" class="freelinking" rel="nofollow">Monotype Imaging</a>, the foundry with clear lineage from the <a href="/wiki/Monotype" class="freelinking" rel="nofollow">Monotype</a> that did the first wide release of this font, should get first dibs. However, I've just received a definite "no" from them, so I'm in a bit of a quandary about what to do with the outlines I've created so far.</p>
    <p>My choices include:</p>
    <p>1. Give it up entirely.</p>
    <p>2. Finish what I have, which is an extremely faithful reproduction of the Monotype metal version, and release it with my own naming (I like "Museum") on, say, MyFonts.</p>
    <p>3. Adapt it so that it's still very clearly Centaur, but less slavish to the Monotype metal. There are plenty other sources to draw on, including the original handset Centaur, its predecessor Montaigne, and of course Jenson's original.</p>
    <p>4. Start over on my own Jenson revival, with a similar design brief: a calligraphic interpretation with the same letter architecture and proportions as the Jenson Eusebius. A danger here, though, is that if I "clean up" the outlines too much, I might end up with something very close to Adobe Jenson.</p>
    <p>5. Go after a different 20th Century metal Jenson revival entirely. I'm intrigued with Mardersteig's Zeno, but haven't been able to get my hands on a really high quality sample (there's a middling reproduction in <a href="/wiki/Anatomy%20of%20a%20Typeface" class="freelinking" rel="nofollow">Anatomy of a Typeface</a>).</p>
    <p>Lastly, is there any problem with posting a PDF of what I've done so far? I'm really trying to balance the ethical questions of rights and the like with my strong sense that making a really high quality version of Centaur available is the right thing to do.</p>
