      <p>This is excellent, I think options 2 and 4 sound like particularly good ideas - a genuinely calligraphic, maximally elegant version of Jenson would be a very good thing to have, and it could look very different to Centaur if you wanted it to.</p>
      <p><cite>My feeling was that Monotype Imaging, the foundry with clear lineage from the Monotype that did the first wide release of this font, should get first dibs. However, I’ve just received a definite “no” from them.</cite><br>
      Fools! Who's been making the decisions at Monotype and Linotype since the end of the metal era? One can understand their not bothering with optical adjustment for photosetting, when it would have complicated the system and when there was always letterpress for serious work, but it beggars belief how much they've not only thrown away in digitisation but seem here to be actively suppressing.</p>
      <p>I think that what the world needs and hasn't got right now is a broad palette of text types of the excellence of Centaur, offering separate fonts for each point size rather than just Text and Display variants. The early twentieth century's work of recovery, in often inspired reinterpretations, in which Rogers took part and which Morison oversaw for Monotype, needs to be done again. </p>
      <p>How does your Centaur compare to LTC Metropolitan?</p>
      <p>(Edited to remove irrelevance)</p>
