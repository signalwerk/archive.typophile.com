      <p>Thanks for the feedback and encouragement.</p>
      <p>William wrote: <cite>if I remember correctly, the x height may be just too small for usual book text sizes.</cite> This is certainly true for the standard Centaur, but there was also a Bible Centaur, cut specifically for the Oxford Lectern Bible. It has a higher x-height, and is also nice and strong. I have a copy of "An Account of the Making of the Oxford Lectern Bible", put out by Monotype as a promotional item, and it's a nice sample of the 18pt Bible Centaur printed on fairly rough paper, as Rogers has stated is optimal for the font.</p>
      <p>George asked: <cite>How does your Centaur compare to LTC Metropolitan?</cite></p>
      <p>There's not much real difference between LTC Metropolitan and Monotype Centaur. They seem to be digitized from the same source (pattern plates for the 12pt, but without any gain added, so the overall strength is somewhere intermediate between metal 14 and 60 pt sizes). The LTC has less "touching-up" of the original eccentricity of the font (the sharp edges on the bowl of the "a" is the most visible such modification by Monotype), but its outlines are also pretty sloppy. Neither version has anything approaching real optical scaling - that's one of the most important aspects of this project, and of course a major part of Adobe Jenson.</p>
      <p>I still haven't decided what to do, but have sketched out a handful of lowercase letters of my own, along the lines of (4) above.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cecco.png"></div><p></p>
      <p>These are still fairly rough, but I'm encouraged. I took a closer look at Adobe Jenson, and I'm no longer particularly worried about ending up with a clone of it. There are clearly some major decisions I would make very differently.</p>
