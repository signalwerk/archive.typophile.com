      <p>Here is the current problem with Centaur:</p>
      <p><a href="http://www.textism.com/textfaces/index.html?id=12" title="http://www.textism.com/textfaces/index.html?id=12">http://www.textism.com/textfaces/index.html?id=12</a></p>
      <p>Have a look at all of Textism's Twenty Faces, and you'll understand why the Classics have had a rough time in their translation to digital type.</p>
      <p>Meanwhile, here's Dean Allen's lucid and sobering take on the Centaur we have now. I might as well reproduce it for all to see. </p>
      <p>Centaur</p>
      <p>Bruce Rogers<br>
      1929</p>
      <p>Like Bembo, released for the Monotype machine the same year, Centaur was an exceptionally beautiful and eminently readable revival of Renaissance type.</p>
      <p>Unfortunately, the producers of the digital version made a common mistake: the shapes are based on the most basic starting point of Bruce Rogers’ designs. These designs were intended for metal type that would press into paper, the ink spreading as it absorbed into the fibre. The resulting printed shapes had a good deal more visual force than the original designs. The process was total: design anticipating application.</p>
      <p>This version of Centaur suffers from the perfection of the process of digital design and offset printing: the original shape is printed coldly intact, and thus it’s very difficult to set a well-made page in Centaur.</p>
    html_clean: |-
      <p>Here is the current problem with Centaur:</p>
      <p><a href="http://www.textism.com/textfaces/index.html?id=12" title="http://www.textism.com/textfaces/index.html?id=12" class="link-external">http://www.textism.com/textfaces/index.html?id=12</a></p>
      <p>Have a look at all of Textism's Twenty Faces, and you'll understand why the Classics have had a rough time in their translation to digital type.</p>
      <p>Meanwhile, here's Dean Allen's lucid and sobering take on the Centaur we have now. I might as well reproduce it for all to see. </p>
      <p>Centaur</p>
      <p>Bruce Rogers<br>
      1929</p>
      <p>Like Bembo, released for the Monotype machine the same year, Centaur was an exceptionally beautiful and eminently readable revival of Renaissance type.</p>
      <p>Unfortunately, the producers of the digital version made a common mistake: the shapes are based on the most basic starting point of Bruce Rogers’ designs. These designs were intended for metal type that would press into paper, the ink spreading as it absorbed into the fibre. The resulting printed shapes had a good deal more visual force than the original designs. The process was total: design anticipating application.</p>
      <p>This version of Centaur suffers from the perfection of the process of digital design and offset printing: the original shape is printed coldly intact, and thus it’s very difficult to set a well-made page in Centaur.</p>
