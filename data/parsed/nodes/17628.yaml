      <p>Raph, leaving aside the legal question, the main question I think you should ask yourself is what you intend this to be used for. </p>
      <p>Centaur looks fabulous in large sizes, but even the metal looked anemic in small sizes, and if I remember correctly, the x height may be just too small for usual book text sizes. So if you want to make it usable at 9-11 pt, it is definitely a non-trivial exercise. If you can pull it off it would be great. And it would be a different animal either from the original or Monotype's versions. Because it is your hand and eye, it won't turn into Adobe Jenson, unless you copy it, which of course you shouldn't do. </p>
      <p>Centaur has a feel of its own, and I don't know if you can ever capture it well for smaller optical sizes. But if you could that would be a worthy goal. Whether it makes any sense for you to spend the time on it is another question.  </p>
      <p>If you only want a version that works better at large sizes that is an easier job that you have already started. The question is, who will use it, and do you want to produce it for them.</p>
