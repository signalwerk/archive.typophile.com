    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Expert Set Font</strong></p>
    <p>The "Expert Set" is a character set invented by Adobe around 1990, which includes Latin <a href="/wiki/small%20caps" class="freelinking" rel="nofollow">small caps</a>, oldstyle <a href="/wiki/figures" class="freelinking" rel="nofollow">figure</a>, a set of five f <a href="/wiki/ligature" class="freelinking" rel="nofollow">ligatures</a> (fi, fl, ff, ffi, ffl), fractions and superiors. In the original meaning, an "Expert Set font" has exactly these characters, and supplements a "regular" character set font.</p>
    <p>Expert Set fonts from other type foundries usually have the same standard character set, but some foundries have used the phrase to denote other  specialized charater sets, which may or may not have some overlap with the standardized "expert set."</p>
    <p>Expert set fonts are becoming less common with advent of <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> which allows for these extras to be included in the same font that contains the default glyphs, accessed more easily, and inserted into a layout without damaging the underlying text.</p>
