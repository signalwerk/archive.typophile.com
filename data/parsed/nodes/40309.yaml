    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;: Expert Set&nbsp;Font</strong></p>
    <p>The “Expert Set” is a character set invented by Adobe around 1990, which includes Latin <a href="/node/12584" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">small caps</a>, oldstyle <a href="/node/14569" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">figure</a>, a set of five f <a href="/node/12055" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">ligatures</a> (fi, fl, ff, ffi, ffl), fractions and superiors. In the original meaning, an “Expert Set font” has exactly these characters, and supplements a “regular” character set&nbsp;font.</p>
    <p>Expert Set fonts from other type foundries usually have the same standard character set, but some foundries have used the phrase to denote other  specialized charater sets, which may or may not have some overlap with the standardized “expert&nbsp;set.”</p>
    <p>Expert set fonts are becoming less common with advent of <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a> which allows for these extras to be included in the same font that contains the default glyphs, accessed more easily, and inserted into a layout without damaging the underlying&nbsp;text.</p>
