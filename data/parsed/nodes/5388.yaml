  html: <p>This is a project I am working on for a Chrsitan ministry . . . WOW is an acronym for Words Of Wisdom--a weekly editorial that is biblically based and designed to be encouraging and motivational.  <br> <br>The top logo is the original logo, the bottom two are revised editions I have created. I was originally asked to stay within the same concept of the original logo -- the client is now wondering if the concept is outdated and is open to new ideas . . .  <br> <br>Any input would be greatly appreciated! Thanks! <br> <br><img src="http://www.typophile.com/forums/messages/29/39447.gif" alt=""></p>
