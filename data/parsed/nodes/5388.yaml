    html: <p>I think the concept of Resurrection is evident, and the sunrise is very effective.  <br> <br>I would go with 2. the saturation of 3's orange is making the w's and jesus very heavy.  <br> <br>Also it seems Jesus is pulling himself out of a deep hole. I don't think I like this, since it shows incompletion, as if he still struggles to get out. </p>
