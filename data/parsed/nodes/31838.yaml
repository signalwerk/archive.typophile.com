      <p>I haven’t seen the book. I did visit the link.</p>
      <p>Perhaps there is some meaning in the choice and sequencing of type? (If the choice of type used for a book communicates something, cannot multiple such choices say something?) Perhaps this ties in with the arrangement and choice of numbers?</p>
      <p>In crude terms, there is about 10-20 bits of information content per font choice and a similar amount for the layout and choice of numbers. Not a huge amount of explicit information content for a book, but perhaps it’s simply well-compressed with a wealth of implicit information lying in wait for those who choose to seek it out.</p>
