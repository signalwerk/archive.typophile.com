      <p>Must be one of those “artsy” things where Ellery wants us to contemplate the meanings of “87” and perhaps it’s metaphysical ramifications on our lives. </p>
      <p>I don’t think your missing anything Stephen...this book appears to be exactly what you said. A gallery of numbers from different typefaces.</p>
      <p>Look for the exciting sequel to Johnathan Ellery’s “87” entitled “69” due out this summer.</p>
