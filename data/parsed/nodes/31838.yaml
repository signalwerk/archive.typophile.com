    <p>Was browsing the wonderful work of Browns Design today and came across what must either be a silly joke or designer masturbation at its finest.</p>
    <p>Can someone explain to me how Johnathan Ellery’s book <a href="http://www.brownsdesign.com/work/?id=23&amp;subcat=&amp;cat=41&amp;i=118">“87”</a> is not simply a gallery of numerals designed by other artists (type designers)? I find the <a href="http://www.brownsdesign.com/work/?id=23&amp;subcat=&amp;cat=41&amp;i=110">copyright page</a> particularly amusing, given that it seems none of the content is original. Please tell me I’m missing something.</p>
