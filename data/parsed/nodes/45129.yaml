    <p>Hi there,</p>
    <p>I’ve used Pill Gothic OTF for a customer last year (who has bought the font from Veer) with InDesign CS2 and had no problems with Small Caps. Now making a new project for this particular customer, the Opentype Small Caps function in InDesign CS3 won’t work. InDesign doesn’t react in any way. What’s really strange is that the document from last year opens correctly with OTF Small Caps. Does anyone know of a bug in InDesign CS3 within Small Caps? Thanks in advance.<br>
    (Mac, 10.5.2, Indesign CS3, Preferences deleted without effect)</p>
