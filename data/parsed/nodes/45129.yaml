      <p>I saw this happen to an old version of Minion Pro. When I changed the <em>language</em> to anything else than English, small caps and a few other niceties failed.<br>
      It took me several years to find out. I discovered that in that version of Minion, there were definitions for a lot of OpenType options as well as sub-definitions for a few languages. The creator forgot to include all OpenType features for all languages ...</p>
      <p>You can try if setting the language to “[None]” in ID solves it. If <!--
