      <p>Each font embedded inside of a PDF consists of two "parts": a font dictionary and a font program. </p>
      <p>My understanding is — but this is just me reading the spec — that in general, PDF allows the following font dictionaries and programs (Program Key / Program Subtype / Dictionary Subtype): </p>
      <ul>
      <li><code>FontFile/—/Type1</code>: name-keyed Type 1 font, uncompressed (PDF 1.0)
      </li>
      <li><code>FontFile/—/MMType1</code>: name-keyed Multiple Master font, uncompressed (PDF 1.0)
      </li>
      <li><code>FontFile2/—/TrueType</code>: GID-keyed TrueType font (PDF 1.1)
      </li>
      <li><code>FontFile3/Type1C/Type1</code>: name-keyed Type 1-based CFF font (PDF 1.2)
      </li>
      <li><code>FontFile3/Type1C/MMType1</code>: name-keyed Multiple Master-based CFF font (PDF 1.2)
      </li>
      <li><code>FontFile2/—/CIDFontType2</code>: CID-keyed TrueType-based font (PDF 1.3)
      </li>
      <li><code>FontFile3/CIDFontType0C/CIDFontType0</code>: CID-keyed Type 1-based CFF font (PDF 1.3)
      </li>
      <li><code>FontFile3/OpenType/Type1</code>: name-keyed Type 1-based CFF font with OpenType tables (PDF 1.6)
      </li>
      <li><code>FontFile3/OpenType/CIDFontType0</code>: CID-keyed Type 1-based CFF font with OpenType tables (PDF 1.6)
      </li>
      <li><code>FontFile3/OpenType/TrueType</code>: GID-keyed TrueType font with OpenType tables (PDF 1.6)
      </li>
      <li><code>FontFile3/OpenType/CIDFontType2</code>: CID-keyed TrueType-based font with OpenType tables (PDF 1.6)
      </li>
      </ul>
      <p>Most font types should also include <code>/ToUnicode</code> and <code>/CMap</code> structures. <code>CIDFontType2</code> font should also include a <code>/CIDToGIDMap</code> structure. <code>FontFile3/OpenType</code> font types should instead include the OpenType <code>"cmap"</code> table. </p>
      <ul>
      <li>Type 1 fonts are typically converted into a CFF structure, either name-keyed or CID-keyed.
      </li>
      <li>OpenType TT (.ttf) and TrueType fonts are typically represented as a TrueType structure, either without conversion (GID-keyed) or converted into a CID-keyed form.
      </li>
      <li>For OpenType PS (.otf) fonts, there is a substantial difference: older PDF formats (from 1.2) only allowed the embedding of the CFF structure that is part of the OpenType font, without the additional OpenType tables. PDF 1.6 allows embedding of entire OpenType PS (.otf) fonts, with the <code>"CFF " table as well as other tables (<code>"cmap"</code> etc., but also <code>"GSUB"</code>, <code>"GPOS"</code> etc.). This latter form can also be used to embed OpenType TT (.ttf) fonts.</code></li>
      </ul>
      <p>So, for PDF 1.2 and above, you can embed Type 1 and OpenType PS (.otf) fonts as font dictionaries in the name-keyed CFF format or in the CID-keyed <code>CIDFontType0</code> CFF format, and in addition as font programs in the <code>FontFile3/Type1C</code> name-keyed CFF format or in the <code>FontFile3/CIDFontType0C</code> CID-keyed CFF format. For PDF 1.6 and above, you can also embed the entire OpenType PS (.otf) fonts as <code>FontFile3/OpenType</code> programs. </p>
      <p>Analogously, for PDF 1.2 and above, you can embed OpenType TT (.ttf) and TrueType fonts as font dictionaries in the GID-keyed TrueType form or the CID-keyed <code>CIDFontType2</code> form, and in addition as form programs in the <code>FontFile2</code> GID-based or CID-based TrueType-based form. For PDF 1.6 and above, you can also embed the entire OpenType TT (.ttf) fonts as <code>FontFile2/OpenType</code> fonts. </p>
      <p>The choice which format to choose is basically: which minimal PDF format you want to support. The easiest thing to do would be to go with <code>FontFile3/OpenType programs, but that only gives you support for PDF 1.6 and above, which is pretty recent. For older PDF formats (1.2 and above would be most sensible), you should deal with the whole mess of various formats available. </code></p>
      <p>I would say that the most sensible thing would be to always try to use the simplest format available. For example, if the font is a non-CJK OpenType PS (.otf) for or a Type 1 font, I'd embed it as <code>FontFile3/Type1C/Type1</code> (which is PDF 1.2), or perhaps as <code>FontFile3/CIDFontType0C/CIDFontType0</code> (which is PDF 1.3). If the font is an OpenType TT (.ttf) or TrueType font, I'd embed it as <code>FontFile2/—/TrueType</code> (which is PDF 1.1) or perhaps as <code>FontFile2/—/CIDFontType2</code> (which is PDF 1.3). </p>
      <p>Sorry, I wish it all were simpler :) </p>
      <p>Best,<br>
      Adam</p>
