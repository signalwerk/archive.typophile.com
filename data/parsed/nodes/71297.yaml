      <p>Hey Adam,</p>
      <p>thanks a lot for the very detailed answer.</p>
      <p>As I said above, I'm targeting PDF 1.3 so full OTF is unfortunately not an option.</p>
      <p>I read the specs more-or-less in similar way, except for a few details:</p>
      <p>/ToUnicode - is there only to support copy-and-paste of the text from PDF but is not really needed for font program to work</p>
      <p>/CIDToGIDMap - this is especially confusing, since its requirement varies from spec version to version. The very last version says, it's optional</p>
      <p>/CMap - the most important field for this topic - I was thinking that I could write "/Encoding/Identity-H" and "/Ordering (Identity)" basically saying that I will be setting the text not in Unicode code points but in the form of position indexes of the glyphs in font program. For example, to write "ABC" I wont write "ABC" or "\x61\x62\x63" or (whatever the notation is), but "\1\2\3\" if "a" was the first glyph in the font, "b" the second, ... In such way /CMap is not needed, as well. But I'm not sure I understood the specs well.</p>
      <p>To rephrase my question, if I have OTF font which I want to embed in PDF 1.3, is it ok to drop all but the above mentioned tables, effectively converting OTF to, say, TTF and hence making it suitable for embedding in PDF 1.3? Do the above tables depend on other tables or not? If I use, say, just plain Latin 1, I find the glyph indexes in font's cmap, right? And everything needed for the glyphs to draw is in "glyf" table... And if I use, say, ligatures I somehow query the font and search for the indexes again, so for "fi" I will write "\73456", instead of "\66\69", am I right? So no other tables should be needed?</p>
      <p>It all seems to me rather complicated (off-topic: *), the most simple way out, in my eyes, is to use "FontFile2/-/CIDFontType2" and "FontFile3/CIDFontType0C/CIDFontType0" but I'm not sure how to prepare a font file for embedding so it remains intact...</p>
      <p>* is there even small chance that one day there will be widespread support for XML fonts? Or completely new, non-legacy font format?</p>
