      <p>Ps. Please note that all of my recommendations apply to non-CJK fonts. For CJK (Chinese/Japanese/Korean) fonts, you'll be best to always embed them as CID-based fonts, but you'll need to make sure that the appropriate standard /CMap is selected whenever possible, to avoid duplication of data. </p>
      <p>Yet another issue I haven't mentioned is subsetting. Embedding fonts as FontFile3/OpenType/* or FontFile2/—/TrueType makes sense mostly if you're embedding entire fonts. Otherwise, especially for FontFile3/OpenType/*, subsetting is quite challenging. Again, in this case, using CID-based fonts (FontFile3/CIDFontType0C/CIDFontType0 and FontFile2/—/CIDFontType2) may be the easiest — and these are probably the two formats you should "get right" first. </p>
      <p>Remember that between FontFile3/CIDFontType0C/CIDFontType0 and FontFile2/—/CIDFontType2 there is a *fundamental* difference: FontFile3/CIDFontType0C/CIDFontType0 basically embeds just the "CFF" portion of the font, without any other tables. On top of that, a /ToUnicode CMap is recommended. </p>
      <p>FontFile2/—/CIDFontType2 embeds the *entire* sfnt font structure (some tables may be removed, but they also may be kept), and then you need to add a /CIDToGIDMap "Identity" structure and also a /ToUnicode CMap that basically duplicates the TrueType font's "cmap" table. At least this is how I understand it. </p>
      <p>At least this is how I understand it :)</p>
