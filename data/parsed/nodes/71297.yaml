    <p>Hello,</p>
    <p>I'm trying to embed a OTF font into PDF 1.3. From what I understood the best way is to use Composite Type0 Fonts, i.e. CID-keyed fonts, either with TrueType or PS fonts.</p>
    <p>My question is, may I just drop, i.e. simply not copy, certain tables from original font to the PDF while embedding? In other words, PDF specs says, one only needs "head", "hhea", "loca", "maxp", "cvt", "prep", "glyf", "hmtx", "fpgm" - if I type a text in PDF using just glyph indexes (Type0) - is the font going to work even if I drop all the other tables, including "cmap", "GLYF", "GPOS", ..? Sane for TrueType and CFF? Of course I update its checksum and Offset Table and Table Record entries accordingly.</p>
