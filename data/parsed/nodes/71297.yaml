      <p>Tuom, </p>
      <p>&gt; What do you mean by this? "Required Tables" + "CFF"?</p>
      <p>No, the story goes like this: at the beginning, there was Type 1, and the CID-keyed Type 1-based fonts. Then Adobe invented the CFF structure to represent both these font types in a compressed font. And when OpenType was developed by Microsoft as TrueType Open, Adobe thought that the easiest way to put PostScript glyph descriptions inside of an OpenType font (i.e. an "sfnt" structure) is to put the entire CFF structure as a new table named "CFF " (with a trailing space). </p>
      <p>So we have two basic structures:<br>
      * the CFF structure which is a compressed form of any PostScript font, and basically only lives inside of PDF files<br>
      * the sfnt structure which is used in TrueType and OpenType fonts, where the glyphs are stored as a "glyf" table (for TrueType-based fonts) and as a "CFF " table (for PostScript-based fonts). This structure can live inside of a PDF file, and then it has Adobe's PDF requirements as to which tables are necessary, or it can live as a standalone desktop font (with the .ttf or .otf file extension), and is then subject to the OpenType spec's requirements. The tables required by the PDF spec and the tables required by the OpenType spec are not the same requirements. </p>
      <p><strong>TrueType</strong>-based fonts: <code>FontFile2/—/TrueType</code>, <code>FontFile2/—/CIDFontType2</code>, <code>FontFile3/OpenType/TrueType</code> and <code>FontFile3/OpenType/CIDFontType2</code> all contain the <strong>sfnt structure with a "glyf" table, and additional tables.  </strong></p>
      <p><strong>PostScript</strong>-based fonts: <code>FontFile3/Type1C/Type1</code> and <code>FontFile3/CIDFontType0C/CIDFontType0</code> only contain the <strong>"bare" CFF structure</strong>, not the sfnt structure. So there is no way to put "other tables" there, because the concept of "tables" applies to the sfnt structure. On the other hand, <code>FontFile3/OpenType/Type1</code> and <code>FontFile3/OpenType/CIDFontType0</code> all contain the <strong>sfnt structure with a "CFF " table</strong>, and additional tables. The "CFF " table is identical to the CFF structure, but wrapped inside of the sfnt structure which allows room for other tables. </p>
      <p>Again: the PDF spec lists the "required" tables within that structure (separately for those with a "glyf" table and for those with the "CFF " table), but this is not the same list of tables as the tables required when the sfnt structure is a standalone desktop font with the .ttf or .otf file extension (then it is subject to OpenType spec's requirements).</p>
      <p>As for your other questions, it's a bit beyond my expertise, but I've alerted some Adobe people to have a look at this thread, so hopefully they can tune in in the coming days. </p>
      <p>Best,<br>
      Adam</p>
