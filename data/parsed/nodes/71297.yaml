      <p>As Adam pointed out, font embedding in PDF is somewhat (or extraordinarily, depending on your point of view) complex, which is why we developed libraries to do this work.</p>
      <p>I can make a couple of comments.</p>
      <p>/CIDToGIDMap is useful only for CID-keyed fonts, and its purpose is to map CIDs (used by /ToUnicode) to GIDs in the embedded font.</p>
      <p>One should never embed an entire CID-keyed font, due to size. For example, even if the user specifies that 100% of the glyphs in a font are to be embedded, the font-embedding functions of our PDF libraries will subset, including only the glyphs for the characters that are referenced in the document, then embed. This is for reasons of practicality. Name-keyed fonts, of course, will have all of their glyphs embedded if the user specifies 100%.</p>
      <p>With regard to computing StemV, I think that it'd simply be taken from the /StdVW value of the embedded font's hint dictionary.</p>
