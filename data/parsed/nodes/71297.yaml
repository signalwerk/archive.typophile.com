      <p><strong>PostScript</strong>-based fonts: <code>FontFile3/Type1C/Type1</code> and <code>FontFile3/CIDFontType0C/CIDFontType0</code> only contain the <strong>"bare" CFF structure</strong>, not the sfnt structure. So there is no way to put "other tables" there, because the concept of "tables" applies to the sfnt structure. On the other hand, <code>FontFile3/OpenType/Type1</code> and <code>FontFile3/OpenType/CIDFontType0</code> all contain the <strong>sfnt structure with a "CFF " table</strong>, and additional tables. The "CFF " table is identical to the CFF structure, but wrapped inside of the sfnt structure which allows room for other tables. </p>
      <p>Again: the PDF spec lists the "required" tables within that structure (separately for those with a "glyf" table and for those with the "CFF " table), but this is not the same list of tables as the tables required when the sfnt structure is a standalone desktop font with the .ttf or .otf file extension (then it is subject to OpenType spec's requirements).</p>
      <p>As for your other questions, it's a bit beyond my expertise, but I've alerted some Adobe people to have a look at this thread, so hopefully they can tune in in the coming days. </p>
      <p>Best,<br>
      Adam</p>
