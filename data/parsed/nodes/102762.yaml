      <p>No, they are not the same, technically or otherwise.</p>
      <p>Franklin Gothic originated as a foundry typeface first produced by American Type Founders (ATF) in the early 20th century. It only had one weight (fairly bold) with four different widths, some with italics.</p>
      <p>ITC Franklin Gothic was a reworking of Franklin Gothic as a multi-weight family first released in 1980 by International Typeface Corporation (ITC). Besides having several weights, from Book to Heavy, it has a larger x-height and other design differences which had the effect of making it look more “contemporary” at the time it was released. A condensed width was added a bit later. More styles were added by Font Bureau more recently.</p>
