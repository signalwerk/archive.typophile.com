    <p>Hi,</p>
    <p>I had a client yesterday with a number of issues in their MS office 2008 and 2011 installed on a current MacBookPro ( so OS 10.8).<br>
    The letterhead template had been built for them (a Solicitor) some years ao using ITC Franklin Gothic, and checking  the text info in the letterhead template, this was what is still specified, although in Font Book variants named Franklin Gothic are listed. </p>
    <p>Problems arose after getting the new MBP and installing Office 2011. THe size of the Company Name in the letterhead form the template was larger , but also inconsistent. Inconsistencies were (presumably) fixed by some hard drive error repairs a,d flushing all caches ( using Onyx).</p>
    <p>The residual problem is that there is a noticeable difference between the shape of the capital letter 'C'  as printed from there old MBP, and that printed from their new MBP. The old version  is less rounded and the gap between the 'jaws' of the letter C are quite different.  My familiarity with fonts and such are extremely limited ( as is probably apparent), being a database developer. </p>
    <p>I checked MS office site, and there appears to have been different 'versions' of the Franklin Gothic in office 2008 and later, but can not find equivalent info for 2011.  However, I am assuming  the diference in character (glyph?) shape(s) is something to do with versions of the Font. Is this correct?</p>
    <p>I have checked the font info using the text in the template , in the old and new MBP; the sizes, kerning etc are the same.<br>
    Can the subtleties of the original  font be re-implemented? If this means purchasing a 3rd part copy of the required software this is no problem. The client is keen to maintain precise continuity of the appearance of there letterheads etc.</p>
    <p>Is ITC Franklin Gothic technically the same as Franklin Gothic? </p>
    <p>thanks for any suggestions</p>
