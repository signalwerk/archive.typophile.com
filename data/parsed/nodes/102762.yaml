      <p>I had a look on the Linotype site, and the original letterhead ( i.e. from old MBP) looks like Condensed Book, while the current output (new MBP/Office 2011) looks like Book variant.</p>
      <p>What I don't yet understand is that the listed Franklin Gothic fonts are the same on both systems ( i.e. MacBooks), and that Fontbook lists Franklin Gothic, yet the Word template indicates ITC Franklin Gothic Book.</p>
      <p>If it were just a matter of the template specifying ITC Franklin Gothic, and the system substituting Franklin Gothic as that is all it had, then the output should be the same on both computers.</p>
