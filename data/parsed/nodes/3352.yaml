    html: "<p>Kyle, as I hinted at above, my true feeling about consumers is not a mistrustful one. I do not really think that pdf font extracting is a widespread phenomenon. <br> <br>The reason I posted the question is really pretty embarrassing. I posted the pdf because I was afraid that the site design might be too click-heavy for potential buyers to view the larger portion of the font library. This, of course, points to poor site design in regards to the ultimate purpose of the site: to sell products. <br> <br>I saw that 180 users had looked at all of my pixel fonts at a glance. Embarrasing fact number two: I was dismayed that so many people could see the wide variety of decorative styles and not make a single purchase. <br> <br>Such was the faith I had in my untested (in the market place) products. I'm still excited about the site and its launch. I'm simply getting an education. Necessary, I know, but no less awkward for me in the interim.</p>"
