    html: <p>Tyler, <br> <br>The amount of visitors, or PDF downloads has nothing to do with what's going on. Dude, you gotta show the fonts man! The only reason people are downloading the PDFs is becuase they're sick of clicking just to see the fonts. <br> <br>Your ability with Flash is great and all, but c'mon 6 clicks to see a preview of a specimen showing is just too much work for anybody to see a mini preview of your fonts. <br> <br>You're not selling your ability to make Flash animations, you're selling fonts and if we can't see 'em, we're not gonna buy 'em. You need to make it easier for a potential buyer to buy. <br> <br>As suggested above, you could certainly take a cue from Atomicmedia.net in the way the fonts are shown on the home page as larger easier to get to previews with a price and a buy now button. You MUST make your fonts appear buyable, your execution hinders this greatly and as a result your sales will continue as they currently are. <br> <br>I sincerely hope my advice it taken as constructive criticism and not as anything other than that. I'm all for new foundry's being successful but I see some obvious flaws in your marketing execution that will hinder your success especially since you've probably invested in a secure cert, a shopping cart and a merchant account. <br> <br>Good Luck! <br> <br>Stuart :D</p>
