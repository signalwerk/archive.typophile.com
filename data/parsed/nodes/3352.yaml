  html: "<p>I've launched a new pixel font foundry. I'm new to many aspects of the game, and don't know what to make of the site's initial performance. <br> <br>Last eleven hours: approximately 450 unique visitors, 180 downloads of the font collection pdf, and zero sales. <br> <br>When I published my pdf, I tried breaking the fonts into outlines. It didn't display as well, nor did it print as well as embedding the fonts. I'm puzzled as to why. So I published the embedded font version. <br> <br>My question: is font exctraction from pdf widespread? I wouldn't think it is, but what do I know? <br> <br>My products could simply not be as appealing to flash designers as I thought. I'd like to think that it's too soon to say, but, the initial stats have me concerned.</p>"
  html_clean: "<p>I've launched a new pixel font foundry. I'm new to many aspects of the game, and don't know what to make of the site's initial performance. <br> <br>Last eleven hours: approximately 450 unique visitors, 180 downloads of the font collection pdf, and zero sales. <br> <br>When I published my pdf, I tried breaking the fonts into outlines. It didn't display as well, nor did it print as well as embedding the fonts. I'm puzzled as to why. So I published the embedded font version. <br> <br>My question: is font exctraction from pdf widespread? I wouldn't think it is, but what do I know? <br> <br>My products could simply not be as appealing to flash designers as I thought. I'd like to think that it's too soon to say, but, the initial stats have me concerned.</p>"
