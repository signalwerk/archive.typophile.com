      <p>Dear Miss Tiffany,<br>
      thanks for this post. Such a web resource would be great. Two points : one great resource actually available in terms of book history, is the Bibliothèque Nationale de France (BNF), whose on line site <a href="http://gallica.bnf.fr" title="http://gallica.bnf.fr">http://gallica.bnf.fr</a> is a real treasure trove. I am using some pdfs of Aldus Manutius volumes in my editorial design course, and I regularly search the BNF database for relevant material which my students can gain access to. One great feature is that this collection is truly open access, something that cannot be said for many major libraries. It would be marvellous to sift through this collection, to highlight books of particular typographic interest.</p>
      <p>Sadly many key works regarding the history of type design in France have not been digitized. I cannot believe this, but it is sadly true.</p>
      <p>Second, I believe that Jan Middendorp wanted to develop an on-line database which would serve as the knowledge base for Dutch Type second edition, <a href="http://www.dutchtype.org/dtintro.html" title="http://www.dutchtype.org/dtintro.html">http://www.dutchtype.org/dtintro.html</a></p>
      <p>I might ask you directly whether there exists on typophile a list of links to libraries with on-line digital collections relating to the history of type and book design ???</p>
      <p>best wishes,</p>
      <p>pete</p>
