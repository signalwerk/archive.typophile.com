      <p>Thanks for your note. I know that Jaques André, formerly of the Imprimerie Nationale (if I remember correctly) has a kind of web list of on-line resources, and I should get back in touch with him about that. I am permanently enraged by online collections which are reserved to university access, and permanently delighted by open access initiatives. However, if we could book-mark open access initiatives, it would save many people a great deal of time, and it might eventually enable some of us to "curate" so that we would know which books/resources are available. Now my students would love that, and it would also help to spread typographic knowledge, which would also be laudable !!</p>
      <p>pete</p>
