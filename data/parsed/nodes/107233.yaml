  html: |-
    <p>Hello,</p>
    <p>I have a bizarre client who wants a new type family to use across all communications. She likes futura but doesn't want to use it, she wants something like futura. She's a strange lady. </p>
    <p>Can anyone recommend a family with range of weights, all with italics and condensed &amp; bold condensed for display? It's a big client so budget isn't a problem.</p>
    <p>I like Super Grotesk but no italics unfortunately!</p>
    <p>Love to hear some ideas.</p>
