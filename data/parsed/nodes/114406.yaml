    votes: null
    html: <p>What a tragedy. Peter was a long-standing member of our community, both at Typophile and type design at large. He'll be terribly missed. Our hearts go out to his wife and kids at this sad, sad time.</p>
    html_clean: <p>What a tragedy. Peter was a long-standing member of our community, both at Typophile and type design at large. He'll be terribly missed. Our hearts go out to his wife and kids at this sad, sad time.</p>
  - id: 572170
