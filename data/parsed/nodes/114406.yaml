    date: 2014-02-24T14:54:00
    date_raw: 24 Feb 2014 — 2:54pm
    votes: null
    html: <p>Peter was not a self-promoter, so his influence reaches further than most know. Much of his work was in making other people’s work better. He was also a close friend. <a href="http://typographica.org/on-typography/peter-bruhn-1969-2014/" rel="nofollow">I posted a tribute at Typographica.</a></p>
