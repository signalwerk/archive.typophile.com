    <p>Hi There</p>
    <p>I'm looking for some help designing a logo for the family business which is a string quartet. I've been studying graphic design for a couple of years now but I feel like I've hardly dipped my toe into the world of type!</p>
    <p>Basically the quartets uniqueness comes from the amount of experience it has (over 25yrs) and the range of music it plays from<br>
    classical to pop and film soundtracks. I'm after a font which is nice and modern, but also has a feeling of experience and many years under its belt. Mostly playing for weddings, it has to fit into the classy image the couples are looking for.</p>
    <p>Any advice would be greatly appreciated<br>
    J</p>
