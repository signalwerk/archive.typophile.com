      <p>As I understand it, the assignment you've been given is to take one typeface, break it down into elements, and then reassemble it to form a new typeface.</p>
      <p>Perhaps what's needed is a wider definition of "elements", and looser rules about how to reassemble them. For instance, you seem to have forbidden yourself even to rotate your puzzle pieces. And you've made life even harder for yourself by choosing pieces that are hard to use graphically. The rectangle and a quarter ellipse are just not from the same world as the subtle curves on the s stroke and the finnicky little sprig on the small stroke.</p>
      <p>I must second Marty's point: every typeface needs a system! If some characters have big round serifs and others don't, why?</p>
      <p>Finally, before you decide you've arrived at a workable system, make sure you have dealt with the characters h a m b u r g e f o n t s i and v. If your system deals with these well, it will probably make it through the rest of the lower case.</p>
      <p>Best of luck!</p>
      <p>Dan</p>
