      <p>The font you've created is not legible yet. A good font is designed for maximum legibility and one of the ways that happens is through simpliciation of forms. There are too many things happening in your design. My suggestion is; if you're going to take this approach of changing an existing font, start over and make only subtle tweaks. Every modification here that's distracting is essentially a point against legibility. </p>
      <p>Keep working!</p>
      <p>-_- Marty</p>
