      <p>Ok, I think this is much better already, but there are still two ideas in this design: triangle and rounded endings.</p>
      <p>"abcdegjosuvwy" are consistent.<br>
      "fhiklmnrtx" are still schizophrenic, i'd get rid of the rounded endings, but cut them straight. This works, because the other characters do have straight lines by themselves.<br>
      Don't try to overstress your concept. in "s" and "t", there's a too much of elements, maybe as well in "v" and "w".<br>
      "x" is still strange, i would simplify it.<br>
      get rid of the right triangle in the "m".<br>
      Try to avoid "chinese-calligraphic style" in the t-bar.</p>
      <p>Sebilar</p>
