      <p>I'd love to give you lots of specifics but it's hard to get a feel for your concept or even the visual language you're seeking. The important thing now is to focus on the problems that you can identify and begin experimenting on tracing paper until you find a good solution. Stay away from working in the computer right now because it will only kill your progress. No computer is faster than the pencil. </p>
      <p>Keep asking yourself this...</p>
      <p>What's making this illegible?</p>
      <p>I would suggest rethinking the size and shape of your counter-spaces. The negative space within letters (like d and g) feels too busy and narrow. Perhaps get rid of the flat mantelpieces on the bottom left of each counter and just create a curve to round them out. The top part of your counter-spaces works ok because you've got the same thing happening in your other letters like "n". But again, they're not an identical match in proportion. Is there a reason why they're different? Copy and paste your path. The "r" and "s" need more attention. They feel chunkier than everything else and visually they need to look less like distant cousins and more like immediate family.</p>
      <p>Create a system!</p>
      <p>Create consistency. I'd get rid of the little random chunks at the bottom of the "a" and "e". On your "g" and "y", i'd make the descenders align to the grid and consider having them be the exact same shape with only enough variation to differenciate between them. You'll have to go back to the sketch pad for that. </p>
      <p>Hope my opinions help!</p>
      <p>-_- Marty</p>
