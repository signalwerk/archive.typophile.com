    html: <p>It sure is a funky logo and would definitely look sexy in neon. The word ’electric’ looks, well, electric. ’ladyland’ however seems hidden; my guess would be that the high connection between the ’l’ and the a’s obstruct the word shape and thus make it a puzzle... I love the bubbles though.</p>
