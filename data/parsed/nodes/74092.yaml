    date: 2010-09-11T15:28:00
    date_raw: 11 Sep 2010 — 3:28pm
    votes: null
    html: <p>It’s because for it to work the bowls of letters like p and b would need to be perfect circles, and that would look like circles tacked on to slanted letters. But for the o to work it has to relate to them, so it has to slant like them.</p>
    html_clean: <p>It’s because for it to work the bowls of letters like p and b would need to be perfect circles, and that would look like circles tacked on to slanted letters. But for the o to work it has to relate to them, so it has to slant like them.</p>
