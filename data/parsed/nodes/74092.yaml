    date: 2010-09-11T17:43:00
    date_raw: 11 Sep 2010 — 5:43pm
    votes: null
    html: <p>The convention with italic is that the letters all lean to the right. You could imagine that an italic geometric "O" could lean to the right simply by rolling or rotating, but there would be no way to distinguish it from upright. The usual solution to this is to design it as a tilted ellipse, which has the advantage that you can see which way it's leaning, and that it <em>is</em> leaning.</p>
    html_clean: <p>The convention with italic is that the letters all lean to the right. You could imagine that an italic geometric "O" could lean to the right simply by rolling or rotating, but there would be no way to distinguish it from upright. The usual solution to this is to design it as a tilted ellipse, which has the advantage that you can see which way it's leaning, and that it <em>is</em> leaning.</p>
