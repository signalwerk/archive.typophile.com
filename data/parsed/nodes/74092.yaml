  - id: 429231
    user: 3135
    date: 2010-09-11T16:11:00
    date_raw: 11 Sep 2010 — 4:11pm
    votes: null
    html: <p>A circle as geometry has the same visual angle upright or when rotated. But slanting a geometric figure yields a change in all geometric forms creating an ellipse of the circle.  This is in  keeping with the system of italics.  To keep the O as a circle just makes it look out of place to most readers. What would happen if you slanted say the "H" in an upright roman face? It would call undue attention to itself and give the reader a reason to be confused.</p>
    html_clean: <p>A circle as geometry has the same visual angle upright or when rotated. But slanting a geometric figure yields a change in all geometric forms creating an ellipse of the circle.  This is in  keeping with the system of italics.  To keep the O as a circle just makes it look out of place to most readers. What would happen if you slanted say the "H" in an upright roman face? It would call undue attention to itself and give the reader a reason to be confused.</p>
