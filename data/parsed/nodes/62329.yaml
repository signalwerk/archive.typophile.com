      <p>Linotype was faster and cheaper than Monotype, and, in consequence, it was much more popular. In fact, as I type these words, "Monotype", but not "Linotype", is underlined in red, indicating that whatever spell checking my browser is using did not even recognize the word.</p>
      <p>Newspapers, paperback books, and magazines were set almost exclusively on the Linotype, and I believe that a great many hardcover books may have been set in that fashion as well.</p>
      <p>Why, then, did the Monotype even exist?</p>
      <p>Well, the main reason is that the Monotype was more flexible than the Linotype. Since Linotype produced a line of text as one elongated slug, it was absolutely limited to the setting of straight text matter.</p>
      <p>Newspapers, of course, have headlines. It isn't impossible to mix foundry type - or Ludlow - with Linotype, and indeed that was standard practice. However, there were limits to how intimately Linotype could be mixed with other kinds of type. That one solid slug was a big part of it.</p>
      <p>Another was the fact that while the point size of foundry type (and Monotype type) is 0.013837", just under the nominal 1/72", the point size of Linotype is 0.014".</p>
      <p>So casting a short line of type in Linotype and then putting something in foundry type on the same line would be difficult. This wouldn't be needed to insert sorts - Linotype had such matrices - but for things like equations it would be painful.</p>
      <p>Also, with Linotype, the regular and italic versions of a typeface had to have the same widths, character for character. This was a noticeable aesthetic limitation.</p>
      <p>Monotype, on the other hand, fit perfectly with the use of foundry types - and, indeed, because it produced individual type slugs, it would normally make it unnecessary to use foundry type even for the most demanding typography.</p>
      <p>Also, Monotype had, as has already been noted in this thread, a separate keyboard and caster. This meant that multiple keyboarders could prepare paper tapes that could brought to a single caster working at full efficiency.</p>
      <p>Originally for newspapers with special fonts, but later for all Linotype users, this particular advantage was eventually matched by Linotype thanks to TTS perforators. They created paper tapes that controlled a machine that would operate a Linotype machine. The perforators calculated where each line would end. At first, this was done by designing newspaper fonts to fit the same 18-unit system as a Monotype caster had. Later, the Multifont perforator used a 32-unit system internally; this was fine enough that line breaks could be calculated properly even though the perforator calculated on the basis of character widths that were rounded into those units, not exactly matching the actual widths of the Linotype characters.</p>
      <p>However, since a TTS perforator had a keyboard almost like that of a typewriter - while a Monotype keyboard was big and complicated, just as a Linotype keyboard was - it is possible that there were union-related issues connected with the use of TTS to eliminate the gap with Monotype in this area.</p>
