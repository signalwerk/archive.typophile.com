      <p>Linotype was excellent for newspapers and simple books. However, for scholarly books, where you needed complex math equations and the like, Linotype was less than ideal. Monotype could run circles around it in the ability to create multi-level math equations (think college Calculus). And it could also do straight text well, so for those users who needed even occasional math setting, Monotype was the way to go.</p>
      <p>There is another bit that might interest you. Some years after the Linotype was invented, a machine called the Intertype was developed that used many of the same features as the Linotype (just different enough to avoid patent issues, I guess). You might want to look into it in your research.</p>
