    <p>Hello all, </p>
    <p>I recently had an email exchange with a group of people and I believe there are some here that may be able to provide more insight on this discussion.</p>
    <p>It begins with...</p>
    <p><cite>On Sep 22, 2009, at 4:11 PM, Todd Childers wrote:</cite></p>
    <p>Hello All:</p>
    <p>A few weeks ago in my Graphic Design History course we studied the Linotype versus the Monotype Hot lead casting techniques that were used in the 19th and muchj of the 20th century for printing and setting type.<br>
    After all of the studying it dawned on me, Linotype seems to be so superior to Monotype that I can't figure out why Monotype came into existence one year after the creation of Linotype 1886 - 1887.</p>
    <p>The only clue that I have is that Wikipedia says that  Linotype was faster because its set a line of type at a time. While Monotype was better for "fine" printing because it set in singular blocks (one letter per block) it allowed for the easier correction for misspellings.</p>
    <p>I don't fully trust Wikipedia. So I have to ask is this true? And were there other differences that made Monotype worthwhile in the first place?</p>
    <p>Thanks</p>
    <p>Todd</p>
    <p>———————————————————————————————————-</p>
    <p></p>
    <p><cite>Charles Spontelli<br>
    Associate Professor, VCT-Tech Education, Bowling Green State University<br>
    had this to say about Linotype vs Monotype</cite></p>
    <p>"I've worked on a Linotype in my career.<br>
    I guess that makes me old. I'm pretty sure the machine<br>
    still runs at Star Calendar and Printing Co. in Cleveland.<br>
    I would agree with Wikipedia and add that my understanding<br>
    is that the Monotype was used more for financial printing<br>
    – financial reports and the like. If there was an error<br>
    or if the numbers changed after the type was set,<br>
    corrections could be made to individual figures<br>
    without resetting the entire body of work.<br>
    I also understood that it was easier to do tabular columns<br>
    – (common in financial work) but I really don't know exactly why,<br>
    so I can't verify that. It's interesting – so I'll pass this on<br>
    to some people I know."<br>
    -----------------------------------------------------------------------</p>
    <p><cite>Patrick Schreiber, University of Cincinnati Professor AIGA Cincinnati President<br>
    and my old room mate in Havana, Cuba last Fall for the AIGA XCD Sharing Dreams<br>
    Expedition had this to say about Linotype vs Monotype</cite></p>
    <p>"For anyone who has had the experience of composing significant<br>
    quantities of 'hand-set' type, the ability to quickly make a change<br>
    without having to completely recompose a galley is significant. While<br>
    Linotype does indeed set type on a predefined measure would from the<br>
    outset appears to be a significant time-saver, typesetters were<br>
    restricted to the mechanical process; letter spacing (tracking) was<br>
    possible, but craft issues such as the ability to kern (remember the<br>
    kern is actually the sawing away of the cast lead that allowed the<br>
    the descender of a 'y' to overlap the previous character and slug)<br>
    weren't easily accomplished. It is also easier and faster to replace a<br>
    single letter than to compose an entire new line when a keystroke<br>
    error was made."</p>
    <p>-----------------------------------------------------------------------<br><cite>Wikipedia had this to say about the Linotype vs. Monotype question<br>
    in an article on the Lanston Monotype Machine Company</cite></p>
    <p>"The original Monotype machine used "hot metal" to form individual letters.<br>
    Thus spelling mistakes could be corrected by adding or removing individual letters.<br>
    This was particularly useful for "quality" printing - such as books.<br>
    In contrast the Linotype machine formed a complete line of type in one bar.<br>
    Editing these required replacing an entire line (and if the replacement ran on to another line,<br>
    the rest of the paragraph). But Linotype slugs were easier to handle if moving<br>
    a complete section of text around a page. This was more useful for "quick" printing<br>
    - such as newspapers."</p>
    <p>Finally There several videos on You Tube and other sites that show Linotype and Monotype printing processes.</p>
    <p><a href="http://www.archive.org/details/Printing1947">http://www.archive.org/details/Printing1947</a></p>
    <p><a href="http://www.youtube.com/watch?v=PRYxOs1oCRY">http://www.youtube.com/watch?v=PRYxOs1oCRY</a></p>
    <p>Thanks for putting up with my incessant e-mails!</p>
    <p>Todd</p>
