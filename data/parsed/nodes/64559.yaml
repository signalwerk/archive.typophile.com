    <p>Hi,</p>
    <p>I was wondering if fellow Typophiles could recommend a typeface that would go with the image below and keywords like: culture &amp; cross-cultural, diversity, education, social, playful, universal. I'd like it to be rather bold, mainly for display purposes - titles, headings and shorter texts but a body text weight for longer descriptions would be nice too.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/forum-logo_6512.jpg"></div><p></p>
    <p>Thank you.</p>
    <p>________<br>
    Aleksander<br>
    <a href="http://www.culturepicture.com" title="www.culturepicture.com">www.culturepicture.com</a></p>
