      <p>&gt; Except that non—power-of-2 values:<br>
      &gt; 1) Can cause a slight loss in rendering performance.</p>
      <p>Well, yeah. But these days, the only thing that significantly impacts rendering performance is the number and depth of lookups in an OpenType font, esp. those associated with features that are on by default, such as "calt". Fonts with extensive contextual features such as Zapfino Extra LT Pro or Bickham Script Pro take seriously more time to render in InDesign or even Notepad if you use them to typeset 50 or 100 pages of continuous text. </p>
      <p>&gt; BTW, I thought the file extension (“.ttf”<br>
      &gt; versus “.otf”) is actually no indication<br>
      &gt; of what flavor of OpenType is in there.</p>
      <p>OpenType PS fonts must have the ".otf" extension. OpenType TT fonts may either have the ".ttf" or the ".otf" extension but the vast majority has the ".ttf" extension since OpenType TT fonts with the ".otf" extension will not work on Windows 95/98. All FontLab products generate OpenType TT fonts with the ".ttf" extension and OpenType PS fonts with the ".otf" extension. </p>
      <p>So, strictly speaking, you are right. Very strictly speaking, you are even more right because nothing prevents an OpenType font from having a ".jpg" extension. It may even work in some operating systems ;) </p>
      <p>Adam</p>
