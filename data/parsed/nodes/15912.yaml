      <p>Hi Christian.</p>
      <p>I do sometimes do a variation on what you're talking about.<br>
      Instead of drawing with curves though, I hash things out with straight lines. This allows me to very quickly block in the shape that I want. Once I have it looking like a Pressig type, then I use FLabs line segment to curve tool to sculpt in the curves.</p>
      <p>I guess more than anything, I think it's refreshing to mix up your technique. If you do it the same way all the time, your type will start looking the same, because it will be a result of the technique as much as your brain. I recently went out and bought linolium block print stuff. I've been carving into that for some ideas on a poster. My spouse comments that the results don't *look* like my designs. This makes me happy, and it's really fun to dig away at the lino. Much more fun than tweaking beziers!</p>
      <p>My problem: too MUCH experimentation, not enough production work. Sooo many single font types on my hardrive missing uppercase, or numbers, or monetary symbols, etc because another idea came along.</p>
      <p>Randy</p>
