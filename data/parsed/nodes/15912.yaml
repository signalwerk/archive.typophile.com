      <p>I have been trying to think about beziers differently. I've noticed with my recent stuff how much the traditional placement of the node points has been influencing my work. I've been experimenting drawing letters  'free form' without the nodes at the extremes and it's producing some interesting things. Maybe I'll insert all of the proper nodes at the extrema when it's time to export the font.</p>
      <p>One of the other things I've been doing is forcing myself to insert extra points. I learned to use as few points as possible when I was first learning because it was hard to keep the letters from becoming lumpy. Now I want them to be a little lumpy, because I can control the curves a little better. Here's an example. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ns.png"></div><p></p>
      <p>Notice that the curve on the top-right of the n on the right is impossible with just the two points at the extremes. The third anchor with control points at 45 degrees allows an interesting and less common curve.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture 2_2.png"></div><p></p>
