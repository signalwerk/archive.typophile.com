      <p>You can get away with an absence of extremum points on short curve segments in PS fonts, as in Miguel's example from Minion Pro, but even if you are not using them to define curves they should be added to any major bowls or arches because they are needed for reliable hinting.</p>
      <p>In TrueType fonts, the format is more demanding of points on extremes, especially at the outer edges of a glyph. If they are missing, it messes up bounding box calculations and has an impact on hinting. I had some short, shallow curves in my Ethiopic typeface that did not have nodes at extremes, and Tom Rickner sent it back to me requesting that they be added before he started hinting.</p>
      <p>The CFF specification allows for PS fonts with a non-1000 UPM, and I've been using larger UPMs for most recent projects (including one design with a UPM of 4096). This makes it easier to add extreme points on shallow curves without distorting the design. With a higher UPM, you can make much more finely detailed designs; this is particularly useful, of course, for display types that will be used at sizes that reveal such detail.</p>
    html_clean: |-
