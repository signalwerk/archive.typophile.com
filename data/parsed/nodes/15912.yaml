      <p>Yes, the file size will be larger if you use a larger UPM, and the greater the number of glyphs in the font the larger the impact of the UPM size will be (this is why some early CJK fonts had very small UPM values). I made a couple of tests:</p>
      <p>CFF outline font with 202 glyphs<br>
      1000 UPM = 27.7 KB (100%)<br>
      2000 UPM = 29.6 KB (106.9%)<br>
      4000 UPM = 32.0 KB (115.5%)<br>
      8000 UPM = 34.5 KB (124.5%)</p>
      <p>CFF outline font with 1,808 glyphs<br>
      1024 UPM = 194 KB (100%)<br>
      2048 UPM = 209 KB (107.7%)<br>
      4096 UPM = 223 KB (114.9%)<br>
      8192 UPM = 243 KB (125.3%)</p>
      <p>I suspect you would find similar patterns for fonts with different numbers of glyphs: approx. 7-10% increase in size each time you double the UPM size and scale the outlines.</p>
