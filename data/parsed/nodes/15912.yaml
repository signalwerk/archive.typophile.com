      <p>I should have posted the <em>a</em> with it's unconventional curves. The <em>n</em>'s, of course have points at their extremes. I just wanted to show that placing four curves at the corners of your glyph can be really limiting. Here is the <em>a</em> showing the anchor and control points:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture 6_cr.png"></div><p></p>
      <p>&gt; <em>the dark side of his medium.</em></p>
      <p>Ha ha. That's funny. Most designers think about the curves this way - as a necessary evil. I'm fascinated by them. They are powerful because they are constrained. That's why they were invented: because there is a limited set of possibilities for every curve, it's easy to create smooth (limited) curves. They make curved lines as rational as straight lines. </p>
      <p>&gt; <em>with pencil &amp; paper, beziers will have a lesser influence. </em></p>
      <p>That may be true, but I like the influence of the beziers in my work. For one thing, my hands are really shaky :) Whether people realize it or not, the limitations in the curves have influenced type design, I think in a good way. With the curves I often make shapes that I wouldn't have thought of if I were drawing by hand, but to your point, the converse is also true. The limitations in the curves make each one beautiful (string them together and it's another story). They can also be boring.</p>
      <p>I've also started trying to draw with quadratic beziers. Because they are even more constrained than cubic curves, you have to string them together. The are a lot harder to manage, but they force me to think about the curves differently, and their tendency to get lumpy faster in some ways makes them more flexible.</p>
