    html: |-
      <p>OpenType TT fonts (.ttf) can have any UPM size from (I think) 1 to 16,000. Values such as 1000, 2000, 2048, 4000, 4096 etc. all work well. There are no known limitations or side-effects. </p>
      <p>OpenType PS fonts (.otf) typically have the UPM size of 1000 but other values are possible as well. There are some side-effects for fonts with non-1000 UPM sizes. One is that *certain components* of some Adobe applications such as InDesign CS (there may be others, I haven't checked extensively) *assume* that an OpenType PS font has the UPM size of 1000. Precisely: a non-1000 OTPS font will show and print fine in InDesign CS but the *text cursor* will always be 1000 units high. So if your font has the UPM size of 2000, the text cursor while you edit the text in InDesign will be only half-size of the type. I'd say it's a cosmetic bug but it is one. </p>
      <p>There may be other problems as well. Unfortunately, since Adobe does not make non-1000 OTPS fonts, they do not test their applications with such cases. Therefore, I encourage everybody to build non-1000 OTPS fonts, test them in all environments that are available to you, and file bug reports to the respective companies. You can always cc adam at fontlab dot com, I'd like to known about the problems you discover. </p>
      <p>Adam</p>
    html_clean: |-
      <p>OpenType TT fonts (.ttf) can have any UPM size from (I think) 1 to 16,000. Values such as 1000, 2000, 2048, 4000, 4096 etc. all work well. There are no known limitations or side-effects. </p>
      <p>OpenType PS fonts (.otf) typically have the UPM size of 1000 but other values are possible as well. There are some side-effects for fonts with non-1000 UPM sizes. One is that *certain components* of some Adobe applications such as InDesign CS (there may be others, I haven't checked extensively) *assume* that an OpenType PS font has the UPM size of 1000. Precisely: a non-1000 OTPS font will show and print fine in InDesign CS but the *text cursor* will always be 1000 units high. So if your font has the UPM size of 2000, the text cursor while you edit the text in InDesign will be only half-size of the type. I'd say it's a cosmetic bug but it is one. </p>
      <p>There may be other problems as well. Unfortunately, since Adobe does not make non-1000 OTPS fonts, they do not test their applications with such cases. Therefore, I encourage everybody to build non-1000 OTPS fonts, test them in all environments that are available to you, and file bug reports to the respective companies. You can always cc adam at fontlab dot com, I'd like to known about the problems you discover. </p>
      <p>Adam</p>
