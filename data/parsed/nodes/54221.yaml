    html: |-
      <p>I feel a bit like Frode about this. It looks so polished that it's hard to see where there might be some room for work – especially for a beginner like myself.<br>
      It's quite impressive! Though I do agree about the "mechanical" look; it feels very "cool", and could maybe be more distinctive. I must say I'm impressed with this, but it doesn't excite me on a deeper level, or feel like something I've never seen before. Though I guess that's not the worst thing that can be said about a newspaper face.</p>
      <p>One thing I've been wondering about is some of the proportions (and bear in mind this is coming from someone working on her first font – so take with a big grain of salt).<br>
      Specifically, the "n" (&amp; thus, the "h") looks a hair narrow to me when compared to say the "o" and "bdpq". Actually, the "n" even seems narrow compared to the "m" and the "u", the "m" looking like it's about 2 units short of being a perfect duplication of the "n", and the "u" almost exactly equal in width to the "n". Is that intentional?</p>
      <p>Speaking of the "u", its bottom left might be a tad heavy/lumpy (the same is true for the analogous curve in the "n"). And the (unparalleled?) upwards motion of the "u" serifs feels odd – but I think I have a personal problem understanding "u" serifs. ;-)</p>
      <p>And I dare hardly say this, but the "9" still feels a bit unbalanced, though I can't really say why.</p>
      <p>Apart from that, I don't think I can offer much helpful input. I wonder where the experts are?</p>
