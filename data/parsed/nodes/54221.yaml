      <p>I'm sorry there's so little critique on this one. I've seen it posted several times now and it's definitly good enough to get some attention. It's a lovely typeface, but there's really nothing about it that strikes me. </p>
      <p>The terminal on lc "a" could be more exciting. The same goes for the ear on lc "g". The ear also forms a dark spot which you might want to correct optically. The leftmost stroke in uc "Æ" should lean that much, in my opinion. The letter is a bit wide. I love the lc "t". Lc "x" has some problems with the serifs on the thick diagonal.</p>
      <p>All in all, I'm bothered by the lack of human details despite the leaning stress. It feels very mechanical.</p>
