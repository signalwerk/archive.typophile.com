    html: |-
      <p>Wow! I'm really shocked by your latest comments, at the point I feel myself strange and confused —I cannot blame anybody for that.</p>
      <p>After reading, I put hands on work trying to correct what I did bad and... oops! I forgot to backup the original version so I made a disaster. Fortunately I recovered it from the OT font, though I missed a lot of stuff like masks, guidelines and so.</p>
      <p>Nevertheless, it did not discourage me: curiously I love to hear critiques and start over again and again —even when I lose an entire font file ;-)</p>
      <p><strong>Nina:</strong> <em>Actually, the “n” even seems narrow compared to the “m” and the “u”, the “m” looking like it’s about 2 units short of being a perfect duplication of the “n”, and the “u” almost exactly equal in width to the “n”. Is that intentional?</em></p>
      <p>1. Look at these four pictures, where I compare proportions of the pair “m-n” on Novena (before I broke it) and Georgia (quite different, I guess) by placing the “n” within the mask:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/m1_5374.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/m2_6489.jpg"></div><p></p>
      <p>2. Almost the same happens by turning the “n” upside down and comparing against the “u” (the “n” is within the mask space again):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/u1_5343.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/u2_6678.jpg"></div><p></p>
      <p>3. I loved your newborn Ernestina at a first glance (I'll make my comments later).</p>
      <p>Huh! I think that <strong>there</strong> is the reason by which you friends find the face so “mechanical”: in my obsessive search of matching the propper measurements and proportions, I missed the fact that type design —design as a whole— is the triumph of sensitivity over given rules to create its own rules.</p>
      <p>Well, it's late now to deal with philosophy, and I must face a hard work on that wretched font.<br>
      Thank you.</p>
      <p><strong>MarS</strong></p>
