      <p>Marcelo,</p>
      <p>I'm sorry if I came across too harsh. I honestly think this is an impressive, and already very polished, font, which could maybe just use a little treatment with the diamond file here and there :-). And since you seemed quite desperate to get more feed-back on it, I figured I'd note some things that struck me – but like I said:<br>
      You really shouldn't follow *my* opinion to the letter! (Ignore the bad pun.)</p>
      <p><em>forgot to backup the original version so I made a disaster</em><br>
      :-{<br>
      Get a backup strategy. I've been there, &amp; since then I've become quite religious about doing daily backups of all the stuff I'm working on. (Also, keeping multiple [dated] versions is a good idea.)</p>
      <p>Re the "m" and "n", I guess we're looking at different fonts for guidance/input ;-). Here's Swift and Constantia:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/swift-mn_5270.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/constantia_mn_4170.png"></div><p></p>
      <p>--</p>
      <p>Don't worry so much. :-)</p>
      <p>—Nina</p>
