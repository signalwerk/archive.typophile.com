    <p>After considering several opinions on my newspaper aimed typeface <a class="freelinking external" href="http://typophile.com/node/54211" rel="nofollow">Novena text</a> I released a <a class="freelinking external" href="http://typophile.com/node/54211" rel="nofollow">new beta version</a>, completely renewed in its details.<br>
    In the meanwhile, I won the attention of some locale publisher who looked at sketches and a couple of hardcopies I left under a table, so the encouraged me to work in order to apply Novena in their publications.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Novena_Typophile_5841.jpg"></div><br>
    There is an attachment for printing: a light-weight 4 pages PDF that better demonstrates how it actually prints, that's its main target.<br>
    So, next steps are finishing my regular text version and accelerating the work on the rest of the family.<br>
    I hope not to disappoint expectations and, for that reason, I need a lot of critique from Typophiles.<p></p>
    <p><strong>MarS</strong></p>
