      <p>BTW, I remembered a good thought from Carl Jung  I had forgotten:</p>
      <p><em>"The creation of something new is not accomplished by the intellect but by the play instinct acting from inner necessity.<br>
      The creative mind plays with the objects it loves."</em></p>
      <p>Though I am not a Jung supporter, I believe he is quite right in this matter.</p>
      <p><strong>MarS</strong></p>
