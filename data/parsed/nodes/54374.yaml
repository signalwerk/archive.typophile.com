    html: |-
      <p>Can't say I do a lot of this stuff these days, but some quick advice/thoughts:</p>
      <p>- the flourishes feel forced and a little stiff right now<br>
      - don't do this digitally from the get go, start on paper<br>
      - see if you can grab a copy of Dangerous Curves by Doyald Young, great reference.<br>
      - if there is a good tattoo parlor in your area, talk to the artists there</p>
      <p>A good tattoo artist will take your initial sketch and make it work that much better when it's placed onto a curved surface. There's a wonderful tradition of hand lettering alphabets being handed down from artist to artist in the their craft.</p>
      <p>Good luck</p>
