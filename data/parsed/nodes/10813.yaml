    html: |-
      <p>I don't understand why you've chosen this way for your promotional card.</p>
      <p>Why have you made a 'crafted' version of your logo (with such techniques as plasma cutting) ?</p>
      <p>I mean why spending time and money to make something 'big' and 'real' (which is something cool in this 2.0 world) if it's to put it so small in a corner of your card with so much effects ?</p>
      <p>I'm sorry, but I don't get it. if I were you, I'd just put a big photo of your real-life logo with a kind of motto saying something like "here at Design Alchemy, we're giving life to typography" or "we make it big", etc.</p>
      <p>Hope you'll understand what I mean and that I'm not out of the subject.</p>
      <p>Anyway, I wish you the best.</p>
