  html: <p>Here is the Design Alchemy logo , which is a modified "A" from RXC' s Spanner typeface. It weighs in at about 230 lbs and is fabricated to spec by Rubicon Design + Fabrication in solid 4" steel using plasma cutting technique. It was then distressed with torch and hammer. <br>I had it photographed by Robin Bartholick (bartholick.com) . We shot 5 rolls of 4x5 and then scanned the best pictures at 360 meg files with a Nikon 8000 film scanner. We did a couple of rolls experimenting with fire by applying rubber cement and ligthing it on fire.  <br>I have yet to finish up these as they take lots of time due to difficulty of creating realistic masks around fire. <br>I am currently going through ideas and comps for a co-promotion of Psyops/Design Alchemy. I will post this as it comes into final stages. <br><img src="http://www.typophile.com/forums/messages/29/798.jpg" alt="Metal A .jpg"></p>
  html_clean: <p>Here is the Design Alchemy logo , which is a modified "A" from RXC' s Spanner typeface. It weighs in at about 230 lbs and is fabricated to spec by Rubicon Design + Fabrication in solid 4" steel using plasma cutting technique. It was then distressed with torch and hammer. <br>I had it photographed by Robin Bartholick (bartholick.com) . We shot 5 rolls of 4x5 and then scanned the best pictures at 360 meg files with a Nikon 8000 film scanner. We did a couple of rolls experimenting with fire by applying rubber cement and ligthing it on fire.  <br>I have yet to finish up these as they take lots of time due to difficulty of creating realistic masks around fire. <br>I am currently going through ideas and comps for a co-promotion of Psyops/Design Alchemy. I will post this as it comes into final stages. <br><img src="http://www.typophile.com/forums/messages/29/798.jpg" alt="Metal A .jpg"></p>
