    <p>I'm looking for some sans fonts with thick (bold/black), wide, low x-height capital letters. Some ideas I've tried already are Neutra Display, Agenda Black, Nevis... along those lines. I often see these fonts with wide kerning as subtext in logos.</p>
    <p>I know this is only one letter, but very similar to Rokkans R: <a href="http://rokkan.com/imgs/rokkan_logo_header.png" title="http://rokkan.com/imgs/rokkan_logo_header.png">http://rokkan.com/imgs/rokkan_logo_header.png</a><br>
    (If anyone knows that specific R that would be great too)</p>
    <p>I will find some more examples. Sorry if this is the wrong thread to post in.</p>
