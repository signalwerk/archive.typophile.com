    html: |-
      <p>When you say "low x-height capital letters" I presume you mean low-waisted, where the crossbars are below the midline of the letter. (x-height refers to the lower case letters, specifically the height of 'x', as compared to the height of upper case letters and ascenders. <a href="http://new.myfonts.com/fonts/adobe/bernhard-modern/" rel="nofollow">Bernhard Modern</a> is an example of a low-x-height typeface, i would say).</p>
      <p>You might consider fonts from the <a href="http://new.myfonts.com/search/aviano/fonts/" rel="nofollow">Aviano</a> family. Or Blair or Flatiron or Engravers Gothic. These often show up in places like you described. If you want more 'techno', such as Klavika, then look for <a href="http://new.myfonts.com/search/squarish+futuristic/fonts/" rel="nofollow">squarish futuristic</a> fonts.</p>
      <p>- Mike Yanega</p>
