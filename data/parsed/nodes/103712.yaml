      <p>This is a commercial font, from Mecanorma. Their current standard license is quite explicit about disallowing any such modifications:</p>
      <p>"Licensee may not modify, make error corrections" ... "add or subtract any glyphs, symbols or accents, or any other derivative works based on the electronic font software in this product in whole or in part, whatsoever."</p>
      <p>The license section in question is a seven-line sentence fragment. I imagine it would still hold up in court, and the intent is clear enough, but grammatically it is horrendous.</p>
      <p>Anyway, so the right thing to do would be to contact the foundry.</p>
      <p>+1 (610) 584-7233<br>
      <a href="mailto:support@houseoftype.com">support@houseoftype.com</a></p>
