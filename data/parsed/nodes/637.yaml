    html: <p>You are right.  <br> <br>The other thing is the naming convention for styles. Sometimes font - usualy named Italic - is named Regular Italic (which looks more lined up in the list of styles). Extra Bold is sometimes ExtraBold. I try to use only names which are in the list of styles in FL. <br> <br> <br>Another problem is using Character Styles in application like InDesign. For one font the style "Italic" works fine, for other font, there must be separated style "Book Italic", for other one "Regular Italic", "Rg Italic". Not to mention fonts with styles named "ThreeOne", "HongKongEighty" or "45 Light". I accept the reason for this kind of style naming, but sometimes it is not so easy to work with it - for example if you have to different fonts in one book and both fonts use different names for italic. <br> <br>On the other hand, I like Frutiger's idea to use numbers to describe the style. Unfortunately almost nobody followed him. And finaly, the new revised Linotype Next uses 3-digit naming convention...</p>
