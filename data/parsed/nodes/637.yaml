    html: "<p>I did several large OpenType families using FontLab. There is a limitation in Windows OS: type family should contain only four styles: Regular, Bold, Italic, Bold Italic. If you create crossplatform OpenType font, you have to devide the type family in several sub-families: <br>Font OT Regular <br>Font OT Italic <br>Font ExtraBold OT Regular <br>Font ExtraBold OT Italic <br>Font Light Condensed OT  <br>etc. <br>But because I want all the styles of one family to be displayed together, I fill in OpenType Specific names in Font Info window. I fill it manualy: the first line is the same for all styles in a family. The second line is the style name, for example \"ExtraBold\". To have all styles sorted by weight, select appropriate weight in the Basic set of font names window. The name of the weight shouldn't match the style name. Imporant is the number of the weight, which appears after selecting the weihght from the list.</p>"
    html_clean: "<p>I did several large OpenType families using FontLab. There is a limitation in Windows OS: type family should contain only four styles: Regular, Bold, Italic, Bold Italic. If you create crossplatform OpenType font, you have to devide the type family in several sub-families: <br>Font OT Regular <br>Font OT Italic <br>Font ExtraBold OT Regular <br>Font ExtraBold OT Italic <br>Font Light Condensed OT  <br>etc. <br>But because I want all the styles of one family to be displayed together, I fill in OpenType Specific names in Font Info window. I fill it manualy: the first line is the same for all styles in a family. The second line is the style name, for example \"ExtraBold\". To have all styles sorted by weight, select appropriate weight in the Basic set of font names window. The name of the weight shouldn't match the style name. Imporant is the number of the weight, which appears after selecting the weihght from the list.</p>"
