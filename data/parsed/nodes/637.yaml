    html: <p>Filip, <br> <br>after dealing with the generation of the General family which has a letter 2 number identification system (C30 through G70) i can safely say that Frutigeresque models don't really make naming easier -- I ended up making each font its own family and using opentype to unite it into one listing. <br> <br>The one thing that bugs me, though, is that either a) Fontlab doesn't generate the files the same way as the Adobe Tools or b) I am an idiot. <br> <br>Why? Because I followed the naming scheme that Thomas followed on Myriad Pro and although 90% of the applications I tested with made it act the same way as Myriad, I still had a set of seperate fonts in TextEdit whereas Myriad showed up as a single family. <br> <br>I'm going to have to guess that Fontlab messes up -- the way Thomas explained it to me using the Additional Opentype table probably doesn't have that problem, though I'll have to find some time to test that method.</p>
