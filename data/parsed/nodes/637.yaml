    html: "<p>The name in the \"weight\" field does not directly correspond to anything that appears in font menus. <br> <br>It isn't quite right to say that OpenType uses TrueType naming, only. OpenType names are a superset of TrueType names. They add two things: <br> <br>- ability to specify family and style in a way that allows more than four members per family (this is in addition to the usual Windows four-member families) <br> <br>- ability to specify a Classic Mac OS menu name (in a Mac TrueType font this would not be part of the data fork) <br> <br>These extra bits live in name IDs 16, 17 and 18, and are in their own little panel in the FontLab Font Info dialogs. <br> <br>Adobe has long realized the amount of confusion out there over naming, style-linking and weight issues, which is why we often incorporate tutorials on this in our OpenType production workshops. However, in the past these have focused on how one controls names when using our own FDK tools. Clearly it would be invaluable to write up a clear explanation on how these things work in FontLab. I suppose I will add it to my to-do list.... <br> <br>T</p>"
    html_clean: "<p>The name in the \"weight\" field does not directly correspond to anything that appears in font menus. <br> <br>It isn't quite right to say that OpenType uses TrueType naming, only. OpenType names are a superset of TrueType names. They add two things: <br> <br>- ability to specify family and style in a way that allows more than four members per family (this is in addition to the usual Windows four-member families) <br> <br>- ability to specify a Classic Mac OS menu name (in a Mac TrueType font this would not be part of the data fork) <br> <br>These extra bits live in name IDs 16, 17 and 18, and are in their own little panel in the FontLab Font Info dialogs. <br> <br>Adobe has long realized the amount of confusion out there over naming, style-linking and weight issues, which is why we often incorporate tutorials on this in our OpenType production workshops. However, in the past these have focused on how one controls names when using our own FDK tools. Clearly it would be invaluable to write up a clear explanation on how these things work in FontLab. I suppose I will add it to my to-do list.... <br> <br>T</p>"
