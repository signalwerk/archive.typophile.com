    html: "<p>And the thread wakes up.... <br> <br>I originally posted this because of the incredible lack of documentation on the naming schemes. <br> <br>Also, the 'magical green diamond' in Fontlab's naming section generates some interesting results that we, right up to the point where I posted this, thought were correct. <br> <br>But they werent. <br> <br>For instance: The Open Type Mac name should be The two other opentype names combined, seperated by a space, correct? Then why does Fontlab put the FOND name in there in stead when you hit the 'diamond' (auto-generate names) field? <br> <br>In the end, thanks to Thomas's great help, we figured it out, but honestly, unless i\"m reading the wrong literature, naming is a field that could use a FAQ (or book) or two.</p>"
