    date: 2003-08-05T18:45:00
    date_raw: 5 Aug 2003 — 6:45pm
    votes: null
    html: "<p>I'm sure Rob explained this to me correctly either in this thread or offline, but I just had an \"aha!\" experience so I can now solve the problem. <br> <br>Here's the breakdown of what apps use to determine family and menu name info. NOTE the OS X Fonts Panel apps entry at the end.... <br> <br> <br>most Adobe apps, other cross-platform apps: <br> <br>name ID 16 and 17, Windows platform <br> <br> <br>usual Windows apps: <br> <br>name ID 1, Windows platform <br>(+ name ID 2 and style bits for style linking) <br> <br>usual Mac Classic apps, and OS X apps not using Fonts Panel: <br> <br>name ID 18, Mac platform <br>(fall back to name ID 1 if 18 is not present) <br> <br>Mac OS X apps using Fonts Panel: <br>name ID 1 and 2, Mac platform <br> <br>So, the difference in the default behaviors between the FDK and FontLab is that the FDK makes the Mac versions of NameID 1 and 2 equal to the Win versions of NameID 16 and 17.  So apps using the Mac OS X Fonts Panel get the same behavior as Adobe's cross-platform apps. However, FontLab assumes that NameID 1 and 2 should be the same for Mac as they are for Windows, so by default it uses those values. <br> <br>As I had suspected in my earlier discussion with Rob (before I knew the precise problem), this can be worked around by using the \"Additional OpenType Names\" panel to make the Mac and Win entries differ for NameID 1 and 2. <br> <br>I will suggest to Yuri that he change the default behavior for FontLab 4.6, so that it behaves more like the FDK in this particular regard. <br> <br>I hope this helps, <br> <br>T</p>"
    html_clean: "<p>I'm sure Rob explained this to me correctly either in this thread or offline, but I just had an \"aha!\" experience so I can now solve the problem. <br> <br>Here's the breakdown of what apps use to determine family and menu name info. NOTE the OS X Fonts Panel apps entry at the end.... <br> <br> <br>most Adobe apps, other cross-platform apps: <br> <br>name ID 16 and 17, Windows platform <br> <br> <br>usual Windows apps: <br> <br>name ID 1, Windows platform <br>(+ name ID 2 and style bits for style linking) <br> <br>usual Mac Classic apps, and OS X apps not using Fonts Panel: <br> <br>name ID 18, Mac platform <br>(fall back to name ID 1 if 18 is not present) <br> <br>Mac OS X apps using Fonts Panel: <br>name ID 1 and 2, Mac platform <br> <br>So, the difference in the default behaviors between the FDK and FontLab is that the FDK makes the Mac versions of NameID 1 and 2 equal to the Win versions of NameID 16 and 17.  So apps using the Mac OS X Fonts Panel get the same behavior as Adobe's cross-platform apps. However, FontLab assumes that NameID 1 and 2 should be the same for Mac as they are for Windows, so by default it uses those values. <br> <br>As I had suspected in my earlier discussion with Rob (before I knew the precise problem), this can be worked around by using the \"Additional OpenType Names\" panel to make the Mac and Win entries differ for NameID 1 and 2. <br> <br>I will suggest to Yuri that he change the default behavior for FontLab 4.6, so that it behaves more like the FDK in this particular regard. <br> <br>I hope this helps, <br> <br>T</p>"
