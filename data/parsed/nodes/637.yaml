  html: "<p>I'm currently breaking my head over naming conventions in OpenType. Having mostly used Fontlab to auto-generate OpenType and other Name fields (FOND, menu, etc) I've been bumping into problems with that wonderful platform known as Windows. <br> <br>I've studied the naming convention that Adobe used in Myriad Pro, which was cunning and complex at the same time... as well as Underware's Unibody font release. <br> <br>Both use distinctly different schemes... How should I be naming things? <br> <br>To illustrate I'll give some examples of the kind of issues I'm having with the following kind of situations: <br> <br>- Unconventional names -- Fnord Broken vs Fnord Regular, Fnord Bold, etcetera. as well as 'fantasy' weight names like 'C30' through 'E70'. <br> <br>- Big familes -- ranging from Fnord ExtraLightItalic to ExtraBold. Not all weights show on Windows. <br> <br>The fonts I create work fine on OS X, but when using them in Adobe applications on a Windows machine I end up with 5 weights at most, 1 weight regular. ATM for Windows Light sees only one weight. <br> <br>How do people here set up their naming info? When does one use OpenType names, and when not? Is the Adobe Pro way the most common way?</p>"
  html_clean: "<p>I'm currently breaking my head over naming conventions in OpenType. Having mostly used Fontlab to auto-generate OpenType and other Name fields (FOND, menu, etc) I've been bumping into problems with that wonderful platform known as Windows. <br> <br>I've studied the naming convention that Adobe used in Myriad Pro, which was cunning and complex at the same time... as well as Underware's Unibody font release. <br> <br>Both use distinctly different schemes... How should I be naming things? <br> <br>To illustrate I'll give some examples of the kind of issues I'm having with the following kind of situations: <br> <br>- Unconventional names -- Fnord Broken vs Fnord Regular, Fnord Bold, etcetera. as well as 'fantasy' weight names like 'C30' through 'E70'. <br> <br>- Big familes -- ranging from Fnord ExtraLightItalic to ExtraBold. Not all weights show on Windows. <br> <br>The fonts I create work fine on OS X, but when using them in Adobe applications on a Windows machine I end up with 5 weights at most, 1 weight regular. ATM for Windows Light sees only one weight. <br> <br>How do people here set up their naming info? When does one use OpenType names, and when not? Is the Adobe Pro way the most common way?</p>"
