  html: |-
    <p>Two designers quoted the Middle Age era in the lower case "g":<br>
    1. Jan Van Krimpen with the italics of <em>Lutetia, Romanée, Haarlemmer, Spectrum</em><br>
    2. Eric Gill with the italics of <em>Perpetua, Golden Cockerel, Joanna, Aries</em></p>
    <p>.</p>
    <p>¶ Do you know who's started this italic "g" trend?</p>
    <p>.</p>
    <p>PS: I've noticed the medieval "g" in the italics of <em>ITC Galliard</em> and <em>ITC Esprit</em>.</p>
