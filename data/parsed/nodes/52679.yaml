    <p>Here is a curiosity I've discovered last week while visiting my grandmother in the countryside. On the bottom of an ashtray that lied in the kitchen since the 80's (I remember seeing it there even when I was a little kid) there was a rosetta decoration that resembles quite a lot the BP Helios mark.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/bpashtray_3999.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/bplogo_4245.jpg"></div><p></p>
    <p>I asked my grandmother if she remembered anybody from Landor coming to visit her and showing interest in that ashtray, but she couldn't.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/generalashtray_5805.jpg"></div><br>
    The orange stuff in the back is a delicious pumpkin pie.<p></p>
