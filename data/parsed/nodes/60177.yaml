  html: |-
    <p>I've been working on the latest addition to my Aviano family for a few weeks now. Aviano Modern is a Didone. It is supposed to convey "luxurious power" and is intended for titling and logotypes. The letterforms widths are based on a classical model, unlike most Didones, to fit with the rest of the Aviano family. I am planning five weights. You see three in the preview below, thin, regular and black. </p>
    <p>Prior members of the Aviano series here: <a href="http://new.myfonts.com/search/aviano/fonts/" title="http://new.myfonts.com/search/aviano/fonts/">http://new.myfonts.com/search/aviano/fonts/</a></p>
    <p>What are your thoughts on the name? I've always thought of these as Moderns but Didone seems more popular these days. Is the average designer familiar with that term or is modern still more recognizable?</p>
    <p>Thank you for your comments,</p>
    <p>JDooley</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/avmodern_4780.png"></div><p></p>
