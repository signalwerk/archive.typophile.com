    html: |-
      <p>I think I will go with Aviano Didone. Thank you all for your opinions. Truly, it doesn't roll off the tongue, but it should work well enough. Also, Aviano Modern might cause some confusion with some extensions to the line I plan in the future.</p>
      <p>Ben, you are right on the m. I didn't initially think so, but I played with it a bit and found you are correct. The new M is about 5-10% less in width. I made an alternate for the J that doesn't descend at all. The J has a very sharp ending to have it conform with other characters. I experimented with a few options, but I like this the best. There will be a ball terminal alt for it.</p>
      <p>Barry, great suggestion. I considered as I like the feeling it invokes it but it would break my naming scheme.</p>
      <p>I've got some more coming, including 50 ligatures and alternates. I've got some ball terminal alternates for all glyphs that can accept them, art deco inspired alternates, and some swash descender alts. Just putting on a few final touches, but I wanted to thank you all for your input. Any more suggestions or comments on the overall design?</p>
      <p>Thank you,</p>
      <p>Jeremy Dooley<br>
      <a href="http://www.insignedesign.com" title="www.insignedesign.com">www.insignedesign.com</a></p>
