    html: |-
      <p>While Vibe probably was using Vibration Gothic from Font Bureau at the time that cover was printed, I think the logo/flag* is/was a custom design based on Helvetica or a more recent sans. Vibration Gothic, like Titling Gothic, has the feel of an older, Akzidenz Grotesk-like sans.</p>
      <p>*We magazine designers prefer that to "masthead," which is the listing of the staff/contributors.</p>
