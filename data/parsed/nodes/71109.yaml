    <p>Hi, I´m trying to identify the typeface for the letters "JFK" and the prhase "The American School of Querétaro".</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo 45_5666.gif"></div><p></p>
    <p>The type on the prhase seems to be futura but the terminals on the "e" "c" "S" are horizontal. ¿Could this be a mix of Avant Garde and Futura?</p>
    <p>Also I have tried to identify the letters for "JFK" but the only sans serif typeface I can find with the hook "J" is Vibration Gothic.</p>
    <p>Thanks in advance.</p>
