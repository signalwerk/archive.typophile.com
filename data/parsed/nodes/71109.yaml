    html: |-
      <p>There could be a number of funny things going on here. The initials in the bottom line may be Futura, but the lower case could be Avant Garde Gothic (AGG).</p>
      <p>The J may have had its outline tweaked to raise and level off the upstroke of the 'jaw' (could have been done easily with AGG's J).</p>
      <p>Notice that the legs of the K are not even in JFK -- possibly more outline tweaking?</p>
      <p>Why some of these customizations were done is not easy to explain, but it would be my guess that Futura and AGG were both used and customized in this piece.</p>
      <p>- Mike Yanega</p>
