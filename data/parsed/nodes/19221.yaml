    <p>Hi there!! : )</p>
    <p>I'd like your opinions (always valuable) on this new typeface FH After. It's still on development... I would say more on a finalization/fine tuning design step of the process.</p>
    <p>My main objective is to create a very distinctive display, with an "international style" quality. To be used by innovative companies, no matter where...</p>
    <p>It's design also provide some nice experimentation on some daring ligatures that I wish to work on a little deep.</p>
    <p>Anyway, what's your point of view??</p>
    <p>check out at:<br>
    <a href="http://www.focodesign.art.br/others/After_01.pdf" title="www.focodesign.art.br/others/After_01.pdf">www.focodesign.art.br/others/After_01.pdf</a><br>
    <a href="http://www.focodesign.art.br/others/After_02.pdf" title="www.focodesign.art.br/others/After_02.pdf">www.focodesign.art.br/others/After_02.pdf</a></p>
    <p>Many regards from sunny brazil!!!</p>
    <p>Fabio Haag</p>
