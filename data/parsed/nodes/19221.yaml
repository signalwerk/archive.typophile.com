      <p>It's got a lot of character, in a good way!</p>
      <p>Getting the spacing seems difficult, it may indeed help to make some of the characters narrower.</p>
      <p>The gamma-like r is a bit odd, but I'd be reluctant to normalize it too much.  I don't like the clockwise @-sign. It's extremely bulky and self-conscious. Also, consider getting rid of the serif-like protrusion on the stem of the ß, it seems out of place in this typeface.</p>
