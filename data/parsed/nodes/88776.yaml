    html: <p>I guess it's a custom job for Disney. Some people tried to identify it on <a class="freelinking external" href="http://new.myfonts.com/WhatTheFont/forum/?q=carol" rel="nofollow">WTF Forum</a>. No perfect match, only a similar <a class="freelinking external" href="http://www.fontspace.com/fz/navidad" rel="nofollow">Navidad</a> by Franco Fernbandez (which could even be a digitization attempt to reproduce the "A Christmas Carol" woodmark).</p>
