      <p>For years before the advent of the personal computer I kept a journal of quotations. Most of them are on typography, but there are some verging on theory, that are about, or applicable to, magazine art direction and design.</p>
      <p>The first is embedded in this quotation [ see the bold ]: “The word <em>magazine</em> comes from the old Spanish <em>magacen</em> (meaning: a store-house); which comes form the Arabic <em>makhazin</em>; which is the plural of <em>makhazan</em>; which, logically enough, means “to store up.” // At the begining of the eighteenth century the term <em>magazine</em> was applied, first, not to periodicals, but to a special kind of book, a book not willing to stick to one subject only, but rambling all over the lot: a storehouse of all kinds of knowledge; a <strong>repository of miscellanea</strong>. // Today “Magazine” means a <em>magazine</em> only in English-speaking countries; in the rest of the world the term <em>magazine</em> is mostly used in it’s original meaning of repository. In Russian <em>magazine</em> means a store or a shop; in Germany — a cartridge-holding part of the rifle; in France <em>magasin</em> is either a department store or (as in the slangy expression, “magasin de blanc”) a house which serves as a repository for young ladies of more charm than virtue. // The periodicals of our time, all over the world, and regardless of what they are called, are true <em>magazines</em>: that is, storehouses. [From M. F. Agha, “Reprise: On Magazines,” in <em>AIGA, Journal of Graphic Design</em>. VIII, #3, 1985. Reprinted from the catalogue of <em>Magazines USA</em> for the AIGA show of 1968.</p>
      <p>When I taught continuing education courses in Magazine Design at Ryerson in Toronto in the 1990s I liked to play with the metaphorical possibilities of the more colourful alternate meanings in relation to the magazine design scene of the day.</p>
      <p>I also liked to quote Raymond Hawkey’s “Graphic Design in Newspapers” (1960s; Penrose Annual): “The newspaper graphic designer has to be able to understand and respect <strong>the essential journalistic function</strong> of what he [pe: or she] is asked to do.”</p>
      <p>From the great illustrator Marshall Arisman [“Art of the Printed Page,” <em>,ID </em>, March / April 1988] I lifted: “Art directors, meantime must be willing to regard artists as contributors rather than as handy human drawing tools.” Marshall Arisman was a great advocate of the illustrator's “ability to visually report, observe and reflect upon a wide range of social, psychological and intellectual issues.”</p>
      <p>This ethos was in the air at the time Barry Blitt of <em>New Yorker</em> and <em>New York Times</em> fame — and illustrator of my typophile avatar — was honing his skills on the pages of magazines I was working on.</p>
      <p>One of the most important precepts I tried to convey is from Jan V. White, who wrote <em>Editing by Design</em> and <em>Designing for Magazines</em>,” both: Bowker, 1982. For a Folio Show Conference seminar description he wrote “Assembling your magazine is like making a film; it is a arrangement of impressions presented in sequence and revealed over time — page by page or spread by spread.” This is explored in some detail in Chapter 2 of <em>Editing by Design</em> under the chapter heading “The Magazine: Object in Three Dimensions.” The books’ examples are quite dated, but the precepts still hold.</p>
      <p>We talked about the use of grids; working with the editorial structure of the magazine; typographical palettes or liveries, navigational and tagging concerns to keep the reader oriented; following strict formats in departments and exercising greater freedom in the feature well; addressing the browsing reader, and graphically and typographically facilitating sustained engagement with the story once he or she becomes immersed.</p>
      <p>Peter</p>
