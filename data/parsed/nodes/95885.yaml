      <p><a href="http://www.indexbook.com/libro/typomag-typography-in-magazines-2nd-edition-1077/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">&lt;em&gt;TypoMag - Typography in Magazines&lt;/em&gt;</a> by Laura Meseguer looks interesting, though I only looked through it quickly in a bookshop the other day.</p>
      <p>I have had <a href="http://www.thamesandhudson.com/9780500515730.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">&lt;em&gt;The Art Director's Handbook of Professional Magazine Design&lt;/em&gt;</a> by Horst Moser (2003 edition) for many years and always found it a useful reference, though my edition is somewhat dated now and I do not know if there are any updates in this release.</p>
      <p>These would be good starting points but with the range of magazine's available today and the approaches being taken, looking at a range of current editions, particularly in graphic design, fashion and politics, can offer the most revealing insight.</p>
      <p>Additionally many magazines now produce digital editions as well as complimentary digital content. The website for Purple Fashion hosts a digital edition of the magazine as well as other text, photographic and video content. Monocle has developed a boutique commercial side, selling clothing, accessories and even a bicycle to compliment its specific target audience.</p>
      <p>You may also find the <a href="http://magculture.com/blog/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">magculture</a> blog interesting.</p>
