      <p>Participants in my class had to go to the best magazine <em>magasin</em> in town after the first class, which was then Lichtmans, and select two magazines: one they were familiar with, and a second they weren’t aware of but found intriguing. They were asked to buy the current copies each time they came out. At the end of the year they had to write and deliver a report for each on every aspect of magazine design we had discussed. This included figuring out the typographic grid, identifying the type-faces used — and their creators, as well as the circumstances for the creation of the fonts — determining the sizes and leading for each section of the magazine, determining the editorial structure of the magazine, how illustration, information graphics and photography were used, how departments and features were treated, etc. Participants also had to devise a multi-page feature layout the fit the design parameters of one of their magazines and were mindful of the Jan White, Raymond Hawkey, etc. precepts I had taught.</p>
      <p>Almost all of students used the time between sessions to pace themselves, using the topic that had been discussed the previous week, and raised their questions at the beginning of the following sessions. Some students even called the art directors to get information first-hand.</p>
      <p>I thought of the course as a course in magazine design <em>literacy</em>. My experience was that there were plenty of good designers, but most entry-level people didn’t understand magazines.</p>
