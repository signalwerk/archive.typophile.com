    html: |-
      <p>There are a few areas in a TrueType font that are used in 'tagging' a font and showing its style.</p>
      <p>All the 'name' table fields should be consistent and correct. </p>
      <p>'fsSelection' in the 'OS/2' table is also used for 'style'<br>
      <a href="http://www.microsoft.com/typography/otspec/os2.htm#fss" title="http://www.microsoft.com/typography/otspec/os2.htm#fss">http://www.microsoft.com/typography/otspec/os2.htm#fss</a></p>
      <p>Also Weight is marked in 'fsWeight' in the OS/2 table<br>
      <a href="http://www.microsoft.com/typography/otspec/os2.htm" title="http://www.microsoft.com/typography/otspec/os2.htm">http://www.microsoft.com/typography/otspec/os2.htm</a><br>
      Any value greater than 400 will be seen as a Bold font.</p>
      <p>These are the main three areas, there are other values in 'head' and Panose values that have weight values or style but these don't usually cause problems on Windows.</p>
      <p>Quickly looking at the fonts the Bold name table is incorrect. The PostScript name is incorrectly formatted and the Weight is set to Regular in both the Bold and Bold Italic which is wrong and could cause confusion in Windows.</p>
      <p>The Unicode and Code Page coverage are wrong. And the Panose is wrong. But your main problems are the name tables are wrong and the weights are wrong.</p>
