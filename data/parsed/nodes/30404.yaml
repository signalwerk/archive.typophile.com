      <p>Assuming that your fonts are o.k., try a tool like <a href="http://homepage.mac.com/mdouma46/fontfinagler/">FontFinagler</a> to delete your OSX's font cache files which seem to be corrupted.<br>
      After re-booting -- but before opening any CS application -- delete the "AdobeFnt*.lst" files. Do <cite>not</cite> files ending with ".db" suffix, see Thomas Phinney's <a href="http://blogs.adobe.com/typblography/2006/11/adobefntdb_and.html">article</a>.</p>
