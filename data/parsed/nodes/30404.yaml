      <p>I rebuilt all the tables, or deleted them, then recompiled. Installed the 8 fonts (!CC x4 and !CC Outline x4) on the two computers. All 4 of the Outline styles still work on both computers, but Computer #1 showed only Regular and Bold-Italic of the solid style. The Computer showed only Bold, of the solid style. So... I went and deleted the adobefn*.* files (with Phinney's exceptions) on Computer #2. Problem solved on Computer #2!</p>
      <p>Computer #1, which I had previously deleted the same files, still not working right. Searched again for stray adbefnt lists, emptied the recycler. Still not working right. So, there must indeed be some sort of font cache error on my computer somewhere. But the problem seems to no longer be with the fonts.</p>
