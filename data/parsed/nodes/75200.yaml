      <p>The site doesn't seem to offer options to purchase <em>any</em> of the fonts displayed there, although there are some dingbats for free download. Presumably, therefore, his fonts are sold through some other supplier; I'm going to see what MyFonts does.</p>
      <p>A search for "Gemena" popped up three font sites that don't have it. I don't know how they fooled Google.</p>
      <p>But a search on the typographer's name turned up some of his faces that were on MyFonts - and those faces are available through the Swedish type foundry T4:</p>
      <p><a class="freelinking external" href="http://www.t4.se/" rel="nofollow">http://www.t4.se/</a></p>
