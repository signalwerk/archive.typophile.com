    <p>I would like to use Doves Type in a book I am preparing (a new edition of The Meditations of Marcus Aurelius), and I have tried to track it down without success.</p>
    <p>I have found a sample, and discovered that a digital version was created by Tjörbjörn Olsson <a href="http://home.swipnet.se/~w-10011/Tobbe/Tobbe.html" title="http://home.swipnet.se/~w-10011/Tobbe/Tobbe.html">http://home.swipnet.se/~w-10011/Tobbe/Tobbe.html</a>, but there is no option to purchase. Emails to his address are not delivered.</p>
