    <p>They are depicted in columns 2 ("Kurrent") and 3 ("Sütterlin") <a class="freelinking external link-external" href="http://www.kurrentschrift.eu/index.php?s=alphabet&amp;l=abisg&amp;r=kur1" rel="nofollow">here</a>. (On the right one can click oneself through to see the letters H-Z as well.)</p>
    <p>I tried the fonts "1880 Kurrentshrift Normal" [misspelled!] and "Suetterlin" from MyFonts.com, but these fonts turned out to not quite be what I expected: Upon closer inspection, the connections between letters are not perfectly continuous or not even correct (for example, the d-e connection, which ought to appear as shown <a class="freelinking external link-external" href="http://www.kurrent.de/_html/schreibschrift.htm" rel="nofollow">here</a>). (I inspected the OpenType versions of these fonts, and OpenType is powerful enough a format to have such issues addressed correctly. So an expert I asked suggested that OpenType might have been used merely as a wrapper for a simpler format in these cases. In any case, these fonts are not satisfactory.) Then, <a class="freelinking external link-external" href="http://www.schriftarten-fonts.de/fonts/13035/s__tterlin_font.html" rel="nofollow">another free font I found on the web</a> doesn't have the long-s/short-s (ſ/s) distinction that is required in these styles of writing.</p>
    <p>I am looking for a professional font that gets all these things right.</p>
