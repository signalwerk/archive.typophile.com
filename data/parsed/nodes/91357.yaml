    date_raw: 15 Apr 2012 — 11:08pm
    votes: null
    html: <p>Thanks for the feedback. This confirms my expectations/suspicions. However, most of the fonts that I looked at do at least offer glyphs both for the long and the short s, and the inclusion of a set of ligatures is common as well. You have to input the exceptions manually, or rely on some converter. The problem is that these alternates are not properly encoded and not accessible via OpenType features. I guess this genre is just too obscure and unprofitable to attract the attention of professional typeface designers.</p>
