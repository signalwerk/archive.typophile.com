    html: |-
      <p>Many thanks for all replies!</p>
      <p>I have checked all pointers. Without wanting to name specific foundries, I found that all fonts I have seen have one or more of the following issues:</p>
      <li>Short-s characters are rendered as long-s glyphs; there is no long-short s distinction.
      </li><li>The fonts are designed to avoid the high-low connector distinction. I would certainly like to see a font that makes such a distinction (pay attention to the connection after "b"/"d"/"r"/"t").
      </li><li>The letter connections aren't perfectly smooth. Seemingly all fonts I looked at suffered from this problem, so I guess this really is hard to solve.
      </li><li>Kerning isn't always quite right.
      </li><li>The fonts are Type 1 fonts (instead of for instance OpenType) with a homemade encoding.
      <p>If a font got only the latter two points not right, I'd take it, but each font I explored suffered from at least one of the first two points.</p>
      <p>In summary, none of the fonts I explored were to my satisfaction. Nonetheless thanks for your help! I think handwriting fonts are especially tricky to get right.</p>
      </li>
