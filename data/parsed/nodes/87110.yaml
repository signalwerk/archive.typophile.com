  html: <p>Unicode points 2090–2094 are described as subscript a, e, o, x and schwa. The official Unicode chart says nothing about the usage of those glyphs, and I can't seem to find information on them elsewhere. Can anyone shed some light on this?</p>
  html_clean: <p>Unicode points 2090–2094 are described as subscript a, e, o, x and schwa. The official Unicode chart says nothing about the usage of those glyphs, and I can't seem to find information on them elsewhere. Can anyone shed some light on this?</p>
