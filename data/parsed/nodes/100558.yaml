  html: |-
    <p>We're trying out several new automatic spam prevention tools. It's quite possible that you won't notice a thing. However, as we fine-tune how sensitive to make the filters, legitimate content might accidentally get flagged as spam. If so, bear with us. Once we've dialed it in, it will run smoothly behind the scenes and your Typophile experience will remain spam-free.</p>
    <p>Contact me if questions.</p>
    <p>//jared</p>
