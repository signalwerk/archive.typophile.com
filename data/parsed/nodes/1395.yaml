    html: "<p>Hello. <br> <br>This is hip! I like it.  A few thoughts: <br>-The terminals on the g, j, and y all look like a cut-and-paste job. It belongs on the g. The others need there own terminals. <br>- The g is top heavy (should be a little less than the o) and leaning right (because of the tail where the modulation is wrong ... more in the horizontal less in the curve) <br>- v &amp; w: you are right to make them extend below the baseline, but a little less than they are now. They are very wide at the bottom (not points) so they don't need that much overshoot. <br> <br>Cheers, <br>Randy</p>"
    html_clean: "<p>Hello. <br> <br>This is hip! I like it.  A few thoughts: <br>-The terminals on the g, j, and y all look like a cut-and-paste job. It belongs on the g. The others need there own terminals. <br>- The g is top heavy (should be a little less than the o) and leaning right (because of the tail where the modulation is wrong ... more in the horizontal less in the curve) <br>- v &amp; w: you are right to make them extend below the baseline, but a little less than they are now. They are very wide at the bottom (not points) so they don't need that much overshoot. <br> <br>Cheers, <br>Randy</p>"
