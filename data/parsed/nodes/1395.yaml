    html: "<p>Wow, pretty amazing presentation. Some wonderful comparisons (especially the \"negative space\" stuff), and great support material (like the classification and glossary). Very serious effort. <br> <br>In trying to figure out if you've hit the mark in balancing your design for the intended size usage, the primary factors are: vertical proportions; color; and spacing. Each has to make sense in the context of the others. A good \"bad example\" is Mrs Eaves: x-height is ideal for large setting, color is ideal for midrange setting, and spacing is ideal for small setting: three-way mismatch. Chucara is balanced much better, but I'd say that: <br>- The \"text\" cut is a bit loose. <br>- The \"small\" cut is a bit light. <br> <br>On the other hand, if the target is newspapers, the ink gain could shift things notably. <br> <br>-- <br> <br>I'm very interested in comparisons of typeface economy, and I'll be taking a close look at page 21. <br> <br>-- <br> <br>Could you please provide a translation of the explanatory text on page 19? <br> <br>hhp <br></p>"
    html_clean: "<p>Wow, pretty amazing presentation. Some wonderful comparisons (especially the \"negative space\" stuff), and great support material (like the classification and glossary). Very serious effort. <br> <br>In trying to figure out if you've hit the mark in balancing your design for the intended size usage, the primary factors are: vertical proportions; color; and spacing. Each has to make sense in the context of the others. A good \"bad example\" is Mrs Eaves: x-height is ideal for large setting, color is ideal for midrange setting, and spacing is ideal for small setting: three-way mismatch. Chucara is balanced much better, but I'd say that: <br>- The \"text\" cut is a bit loose. <br>- The \"small\" cut is a bit light. <br> <br>On the other hand, if the target is newspapers, the ink gain could shift things notably. <br> <br>-- <br> <br>I'm very interested in comparisons of typeface economy, and I'll be taking a close look at page 21. <br> <br>-- <br> <br>Could you please provide a translation of the explanatory text on page 19? <br> <br>hhp <br></p>"
