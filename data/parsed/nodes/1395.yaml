    html: "<p>Thanks! <br>But I'm still confused: it seems to me that the first two columns are set at the same size with different leading, and the last two columns are set another size (but the same between them) and different leading. Am I going blind? <br> <br>-- <br> <br>Juan Pablo, I took a close look at your page 21, and I'm seeing a classic problem that shows up in efforts to compare economy. <br> <br>Given a set of fonts (and a given setwidth), the two factors you can control are point size and leading (tracking is bad). The results you're looking for are a balance of readability and economy (and not simply a total preservation of the former at maximal economy). Readability is of course nearly impossible to measure (while economy is very easy), so it's best to match the various settings in outward appearance (very different than true functionality), see which ones are how economical, and try to subjectively balance that against an informal evaluation of readability. (I'm not sure I'm explaining this well...) <br> <br>Anyway, the tricky technical part is making the outward appearance consistent across the different fonts. We already know that apparent size is what counts and not point size, but there's also the issue of apparent <i>leading</i>. A reader's \"appreciation\" of a setting is firstly based on how big the type is, but secondly also based on the ease of doing a return from the end of one line to the beginning of the next - and this depends on apparent leading. <br> <br>So for example let's look at the middle four columns (page 21), ignoring Chucara Text and Bell Centennial.The apparent size between them is mostly fine (just Clifford is smallish), except for Times, which is much smaller. But the apparent leading is way off: Chucara Small has very little, then there's a gap toClifford, a bigger gap to Celeste, and then bigger one to Times. So I think you have to play with the point/leading of each to get them to really match in outward appearance, <i>then</i> you can really compare economy versus readability. <br> <br>It gets even trickier afterwards though! Once you have those matched, you need to feel your way between what appears more readable (while in fact that's <i>legibility</i>) versus what is in fact more readable. For example, Clifford has a smaller x-height than Chucara, which means it has longer extenders however: depending on the usage size and the type of setting, this can be an advantage, even though Chucara will always seem more <i>legible</i>. <br> <br>There's also another issue: when you're comparing fonts with a wide span of widths (like Times versus Clifford), you need to worry about the proportion of linebreaks in your test text, because design widths affects economy much more depending on that. <br> <br>hhp <br></p>"
