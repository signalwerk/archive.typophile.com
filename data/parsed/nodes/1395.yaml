    html: "<p>OK, now p19 makes sense! <br> <br>I would say that in the first comparison the \"Small\" style seems slightly larger on the body than the \"Text\" (even though it's set 0.4 pt smaller), but it also has less \"apparent leading\". While in the 2nd one the apparent sizes are very well matched, but the \"Small\" still has less apparent leading. <br> <br>-- <br> <br>Setting the leading solid for everything won't work for the same reason that mainaining the same point size across the different fonts won't work: the proportions of the face on the Em affects everything. It's well known for example that fonts with larger x-heights need more leading. <br> <br>So I think you have to 1) match the apparent sizes, then 2) match the apparent leadings, then 3) compare the economy, then 4) balance it against readability. And always remembering that you can sometimes gain readability by <i>reducing</i> the apparent size. <br> <br>hhp <br></p>"
    html_clean: "<p>OK, now p19 makes sense! <br> <br>I would say that in the first comparison the \"Small\" style seems slightly larger on the body than the \"Text\" (even though it's set 0.4 pt smaller), but it also has less \"apparent leading\". While in the 2nd one the apparent sizes are very well matched, but the \"Small\" still has less apparent leading. <br> <br>-- <br> <br>Setting the leading solid for everything won't work for the same reason that mainaining the same point size across the different fonts won't work: the proportions of the face on the Em affects everything. It's well known for example that fonts with larger x-heights need more leading. <br> <br>So I think you have to 1) match the apparent sizes, then 2) match the apparent leadings, then 3) compare the economy, then 4) balance it against readability. And always remembering that you can sometimes gain readability by <i>reducing</i> the apparent size. <br> <br>hhp <br></p>"
