  html: |-
    <p>A client of mine uses one of my typefaces in text work under Windows 7, in Regular and Bold.</p>
    <p>He complained about being not able to actually spot the difference between the two fonts on screen, when working with a usual display scaling of his document (Word, I suppose).</p>
    <p>Alright, the Bold is actually a modestly weighted Semibold. So far so good, it works on other Win versions appearently well, and on the Mac of course. I never heard that issue reported before.</p>
    <p>What is it? What could be possibly done?<br>
    Thanks for your thoughts in advance.</p>
