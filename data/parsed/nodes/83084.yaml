    html: <p>This issue is old, it's a standard challenge for all Windows Cleartype. Verdana and Georgia are examples of the solution, bolder, and wider than usual bold. See also the RE fonts at webtype.com. Windows bold fonts that do not work so well include Trebuchet and the CT collection whose bolds are made for print or something.</p>
