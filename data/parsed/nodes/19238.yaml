  html: |-
    <p>Please can somebody help me for the Melissa font set. Ulrich Stiehl told me that he has already checked that neither Linotype/Monotype/FontShop nor <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a> nor <a href="http://www.myfonts.com" title="www.myfonts.com">www.myfonts.com</a> supply this font, but perhaps a small typefoundry has digitized the font Melissa and sells it under another name.<br>
    I'm looking for a special occassion to the "Melissa Inline von Letragraphica LG2320" from 1977 designed by Douglas Sheldrake </p>
    <p>Please look to the inserted image for the right Melissa font.<br>
    Maybe there are other fonts with the same name "Melissa", because there are also other completely different fonts also called "Melissa". For example, Compugraphic called its forgery of Zapf's Melior as "Melissa".</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/melissa.jpg"></div><p></p>
    <p>Its no problem to buy the fontset. Please let me know if somebody can help me.</p>
    <p>Thanks for your concerns.</p>
    <p>Best Regards,</p>
    <p>Louis van der Veer<br>
    Netherlands</p>
