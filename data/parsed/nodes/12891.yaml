      <p>I like the look of your typeface.</p>
      <p>However I second Hrant on the 'r' and 'g'.<br>
      The 'r' seems too wide and maybe the arm should join the stem lower.<br>
      The 'g' looks very top heavy. </p>
      <p>Also the 'a' is unbalanced to me. Looks like it is tilting a tad to the left. Maybe if the bottom of the bowl extended a little more to the left it would balance better.</p>
      <p>The 's' and 'S' are also a bit unbalanced right now. They are not resting properly. The top part should probably be a little bit smaller than it is now. Both s's also looks too thin on the middle part.</p>
      <p>Aside from that I think it looks like a nice typeface. I like the beginning and ending strokes of the letters. The diagonal cut.</p>
      <p>I can't really say anything about the cyrillic letters.</p>
      <p>MKSG</p>
