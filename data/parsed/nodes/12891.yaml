      <p>I forgot something:<br>
      Although I can't properly judge the character-wise structural [de]merits of your Cyrillic, I do have the following belief* concerning multi-script font systems, and it applies stongly to Latin+Cyrillic efforts: the vertical proportions cannot be "normalized" blindly across scripts. In the case of Cyrillic for example, the "x-height" needs to be higher; and that's just for starters. For a full elaboration of this "complexity" please see my article in issue #4 of Spatium magazine.</p>
      <p>* Something Maxim -and many others- disagree with.</p>
      <p>hhp</p>
