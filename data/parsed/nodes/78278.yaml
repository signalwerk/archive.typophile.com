    html: |-
      <p>Ryuk, it looks similar to billy argel font, but notice the sharp tips inside the "e" are on the left side typically where youd start the stroke and you'd continue that flow to the end of the character. the "argel" font has a style that is similar but almost backwards in the sense it starts at the same point and loops around the hook of the e and then reverses direction and flows to the end of the character.</p>
      <p>SE piel script is actually quite different.</p>
      <p>Justin_ch, at first i didn't think it(my screenshot) was custom but looking over it again the e's are identical, but the a's are not. the first a has a slight tip on the left edge of it where the 2nd a doesn't and also seems slightly elongated.</p>
      <p>I almost feel like the chars were cut/pasted from other peoples work and combined together.<br>
      some chars have very similar components when compared to this image <a href="http://maxx242.com/images/typography3t.jpg" title="http://maxx242.com/images/typography3t.jpg">http://maxx242.com/images/typography3t.jpg</a><br>
      especially the h(except for the bottom swirl) and the top tips of some of the letters (h, b, etc).</p>
      <p>So im thinking the girl who said she drew this by hand is lying, and just butchered some other designers works and put them together with some other swirls to make the logo/typeface.</p>
      <p>:/</p>
      <p>ps. thanks for the help.</p>
