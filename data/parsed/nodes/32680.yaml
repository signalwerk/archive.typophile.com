      <p>According to James Mosley's notes to the reprint of Caslon's 1766 specimen book, most of the large sizes were done by Caslon I, though some are by others. </p>
      <p>Of course Big Caslon has a lot of Matthew Carter in it also. Another take on the large sizes is Caslon 540, originally from ATF. Do you dislike that as well?</p>
      <p>Caslon I has much more logic to his alphabets and different sizes than is obvious; it has only taken me a couple of years full time to figure this out :) </p>
      <p>I don't agree with your assessment of Adobe Caslon, and in particular that it does well at large sizes. Carol Twombly herself said it shouldn't be used at large sizes. For starters, at large sizes the flat-top serifs on the Roman have a 'bone effect' that I find unattractive.</p>
