      <p>&gt; it is not in the male nature to create an invisible work of art</p>
      <p>This is a very interesting point, but there are a problem and a paradox. The problem is that any face (even a text face) also needs to <cite>not</cite> be transparent in some ways; and the paradox is that, in some ways besides transparency, the male nature seems more conducive to type design - and this I feel is a big reason why we have such a huge disproportion in gender (although social/conditioning issues are always a huge reason too). The same is true in philosophy (noting that there has been only one notable female philosopher, and quite interestingly she was not heterosexual) and possibly stand-up comedy (where it seems a disproportionate proportion of female performers are not heterosexual).</p>
      <p>Hmmm, so maybe the Ideal Type Designer is bisexual!  :-)</p>
