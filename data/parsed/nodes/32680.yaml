      <p>Hmm. Intresting to hear, as a newcomer to the forum, where I am most likely lacking some designer qualities because of my gender... Although I am happy to realise, that should I ever want to better my performance, I could consider lesbianism or bisexuality. :) (This is the year 2007, isn't it?)</p>
      <p>Just wait and see, we are not in a status quo. The more evolved the society, the more there will be women in traditionally male occupations and vice versa. And the differences talked about will not be those between sexes, but those between individuals. The latter part should be true already, but unfortunately isn't, since people seem to love the stereotypes to great extent.</p>
      <p>Hrant, having followed a little bit the brain research and also the studies on what constructs a gender, I can affirm that – despite the efforts – there has not been any findings to support what you are hinting (about the differences between sexes due to brain or other factors). The current paradigm is that one's intrest and talent in engineering, mathematics, painting, typography, graphic design, or what ever else has been mentioned, are for the most part due to culture and upbringing, that is socialisation. Not to brains, hormones or even genetics. Any other paradigms remain to be proven.</p>
      <p>And this was first concluded in 1949 by the famous French philosopher Simone de Beauvoir.</p>
