      <p><em>Regarding the toponymic Greek verb lesbiazein "to perform ****," Krenkel is misled (p. 207) by the prejudice, as old as Hesychius, that the verb etymologically means "to act like a woman from Lesbos," while the ancient testimonia rather indicate that the euphemism rather means to act like "a person (i.e. either man or woman, indiscriminately) from Lesbos." A small point, true, but perhaps one that may throw light both of the verb itself as well as potential biasses in the glosses of Hesychius. On the next page, Krenkel also incorrectly states that the Greek verb phoinikizein (etymologically, "to act like a Phoenician") also means "to perform ****," when it actually means "to perform ****." Again, a point like this matters, not only for lexicographers who collect such things, but because it bears on the interpretation of literary texts; thus, for instance, when we find that a prostitute in Plautus' Pseudolus is named "Phoenicium," (Phoinik-ion) her name does not really imply "Miss Suckly" (as once suggested by W. M. Calder III in CP 70 [1975] p. 147, and quoted with approval by Krenkel p. 208 n. 8), and thereby indicate that **** is the special services which she performs for her clients; Plautus is rather openly and constantly advertising the predilections of her rival clients Calidorus (cf. his snivelling in Scene 1) and the Macedonian soldier ("dentatus" [!], v. 1040), and the privileges for which they are all too happy to pay her. (One could perhaps compare the famous fresco from the apodyterium of the terme suburbane in Pompeii, reproduced as fig. 14 in Antonio Varone's Erotica Pompeiana [Rome, 1994], p. 207.)</em></p>
      <p>So there you have it: Lesbos wasn't known for its lesbians, but notorious for its fellatalists of both sexes.</p>
      <p>[I've only skimmed this long and bizarre thread, and I still don't quite understand how Sappho and the Lesbians/lesbians got involved!]</p>
