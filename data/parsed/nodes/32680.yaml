      <p>There was enough from Sappho that I remember being impressed in my college poetry class. It seems that the complete works were extant for many hundreds of years, until they were ordered to be burned by a series of Popes. [Edit: the wikipedia article linked below says that this story does not have historical foundation.]</p>
      <p>I found the one I remember on the internet, as translated by Julia Dubnoff:</p>
      <p>Some say an army of horsemen,<br>
      some of footsoldiers, some of ships,<br>
      is the fairest thing on the black earth,<br>
      but I say it is what one loves.</p>
      <p>It’s very easy to make this clear<br>
      to everyone, for Helen,<br>
      by far surpassing mortals in beauty,<br>
      left the best of all husbands</p>
      <p>and sailed to Troy,<br>
      mindful of neither her child<br>
      nor her dear parents, but<br>
      with one glimpse she was seduced by</p>
      <p>Aphrodite. For easily bent...<br>
      and nimbly...[missing text]...<br>
      has reminded me now<br>
      of Anactoria who is not here;</p>
      <p>I would much prefer to see the lovely<br>
      way she walks and the radiant glance of her face<br>
      than the war-chariots of the Lydians or<br>
      their footsoldiers in arms.</p>
