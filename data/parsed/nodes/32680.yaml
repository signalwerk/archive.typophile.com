    html: |-
      <p>The last I heard about Carol was that she wasn't married but had a steady and had gone off to Nevada or somewhere like that to weave. She liked skiing. She hated working at Adobe. She was knowledgeable about type but obviously wasn't interested in it by the time I was spending time with her between 1996 and 1998. It's a little cruel to say, but anybody who thinks she made, on her own, an important contribution to type design simply doesn't know anything about Carol Twombley other than the public relations puffery that Adobe put out about her. At Adobe she was hemmed in by powerful figures like Slimbach and Stone, and never had a chance to express anything particularly original. I don't think she had any interest in doing so. If she had, we would have heard something from her in all the years after. Or perhaps her decades of corporate warfare at Adobe had bludgeoned the creativity out of her. Type wasn't a happy story Carol and she got out as soon as she could. For the gory details, assuming they would talk, and I don't think they will, E.M. Ginger in Oakdale or Linnea Lundquist were (and I imagine still are) good friends. When all is said and done, Adobe Caslon is a fabulous typeface, perhaps the best text typeface Adobe ever produced in the Originals series. How much of it was Carol's and how much of it was Sumner Stone's? ? ? ? Sumner was, after all, the art director, and Sumner knows a lot about type . . . . . . . That last big family she did -- what name was it called? named after some sort of desert grass -- was misconceived in my opinion. Carol's story at Adobe is a classic and ugly and common tale of male subjugation. Was she particularly vulnerable? Why did she put up with it for as long as she did? Was there a happy ending? Lots of interesting questions.</p>
      <p>There definitely was a mystique attached to her. How much that was the creation of Adobe's brilliant PR people and how much due to Carol's own talent and innate glamour, is not immediately apparent. But it was there. I know a type-besotted fellow who, when he was a teen, had a poster of Carol in his bedroom. You can imagine the rest. Of course he also believes in UFOs, but then lots of people do. </p>
      <p>What I'm trying to say is that the little that is known about Carol Twombley (does her name have an e or not?) is the result of a carefully constructed PR edifice. Arriving at the truth of what happened with her and type will bring you to some completely different places.</p>
