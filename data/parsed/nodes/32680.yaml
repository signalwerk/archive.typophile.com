      <p>Poland <strong>is</strong> in the geographical centre of the European continent. This is largely due to the fact that the European part of Russia is quite large (though of course it's nothing compared to the Asian part of Russia). </p>
      <p>If you look at this map (which correctly shows the European part of Russia) then Poland really looks like being very much in the middle (along with Germany):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/mapeurope_6227.gif"></div><p></p>
      <p>This is the reason why the Polish (along with the Czechs, Slovaks and Hungarians) like to insist that they're "Central European" and not "East European" countries. I believe after the extension of the EU this distinction is actually bearing some sense — one can reserve the term "East European" for Cyrillic-written countries such as Russia, Ukraine or Belarus, while the Central European ones are those that used to be Eastern, aspire to be Western but aren't quite there yet. </p>
      <p>Of course, if you exclude Russia from Europe completely, and disregard the notion of "Central" Europe, then even Hamburg is an Eastern European city. ;)</p>
      <p>A.</p>
