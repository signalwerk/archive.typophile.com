    html: |-
      <p>&gt;but today (when looking for FontStudio software)</p>
      <p>If you're looking for FontStudio, you're looking in the wrong place. You want the latest beta, the PPC/FPU version if you're on a reasonably modern Mac. Works fine last time I tried it. I got my copy from Harold Grey when he was still the bootblack at ITC and passed it on to Lucas de Groot . . . and Carol Twombly. </p>
      <p>I don't think I like the metrics editing, which I admit I can't figure out, but I love the fact that if a point is selected, tab/shift-tab brings you to the next/previous handle, node -- it's much more useful than what we now have in Flab, and of course far more useful than Fog in this respect. This is a beautiful fine tuning tool. You're on a handle, you adjust with the cursor; you tab over to the next handle on the path, adjust, tab to that next node, adjust, tab to its handles, tab to the next node's handles . . . . etc. What an exquisite way to fine-tune an outline, and you never have to do something so inane and cumbersome and time consuming, and interruptive of your creative flow as look for your mouse cursor, fiddle with it, etc. etc. This is how it should be. It is creative heaven, provided by machines. Yuri, instead of having tab (a character whose significance you too often ignore) move you from handle to node to handle, and back again, it would be wonderful if you let tab take you to the next node, just as FontStudio does. This tab action, of course, will only take place when a node is selected, and it will only, as so elegantly implemented in Font Studio, work for selected nodes. You have what seems to me rather a wrong thing going on, which is that handles can't be edited while several nodes are selected, since navigating to a handle automatically deselects the selection. Why is that? FontStudio doesn't seem to have a problem with it. And by the way, am I the only person who thinks that the use of Tab in the Flab glyph window when nothing is selected -- turning on and off the rudimentary and useless character selection panel -- is a waste of a good control character?</p>
    html_clean: |-
