      <p>&gt;Most of all though, it’s notable here that Twombly could only be assigned a very small part of the blame - she was pretty much following orders (although the fact that her bosses were male seems circumstantial).</p>
      <p>That is the key motif that runs through Carol's history as a designer.</p>
      <p>Now change the word blame to credit. Is the statement still true? </p>
      <p>One would wish not. Let's put it this way: it _is_ true, in the view of most of the  men she worked with. That view may be sullied. How can we ever know the truth? It was never Carol's way to speak out.</p>
      <p>Tiffany, I can promise you faithfully that the very last thing in the world Carol would ever do is (a) either read typophile or (b) contribute any kind of response to it. She's in another world. This is absolutely meaningless to her. I really do know her well enough to say that. </p>
      <p>Finally, I would offer the thought that the reason her Caslon is so good is precisely because she is exactly who she is. It is the the particular combination of strength in some areas, weakness in others, that led her to succeed in creating an enduring and much-used typeface where more talented and egostistical brother designers have failed. No true egotist can ever create a truly functional typeface. A successful typeface (by which I mean one which provides the most benefit and pleasure to the most number of readers) is by definition an object for the community and it must in some real sense be of the community and by the community. To go out on a limb here, it is not in the male nature to create an invisible work of art -- and a truly functional typeface _is_ invisible on some important level. It is at least conceivable for an oppressed person (who could be a woman or who could be an oppressed for a hundred other causes) to conceive, happily, an invisible work. There are those, other than Carol, who insist that they are responsible for what is good in the design. I accept that this is true, but I also accept that it is absolutely Carol's design and could not have come about unless she were exactly who she is. A painful birth!</p>
      <p>I admire Adobe Caslon more every day. It is one of the very few typefaces that does not annoy me and I am constantly recommending it to people looking for something special. This is cruel but it is true: Carol does not like to annoy; it is entirely in her nature to create a typeface that does not annoy. What the rest of us have so much difficulty in realizing is that this is perhaps the most desirable feature a text typeface can have. </p>
      <p>By the way -- in all Carol's letters to me -- it was always Caslon she used! I am sure it is her favourite.</p>
