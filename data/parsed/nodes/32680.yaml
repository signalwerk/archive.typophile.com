      <p>BTW, something interesting to contemplate here is how "lesbian" possibly became derived from the name of her island. If her work was so ill-preserved, and the references to lesbianism in it so indirect, how could it have prompted the derivation? It's not like she invented it! And for one thing, the Ancient Greeks were much more open to homosexuality than even we are today, so that aspect of her work couldn't have been so extremely in focus. On the other hand, maybe her spoken efforts (a mainstray of Ancient Greek philosophy) were what did it (especially if she travelled a lot), and the paucity of lesbian references in what has survived from her work is just the tip of the iceberg. But I think more probable is that the island of Lesbos had over the centuries or at least decades become a hub of lesbian activity and thought, and Sappho herself was a product of that. She was educated and drawn to compose poetry, so she became the transcriber of sorts. In this scenario, the derivation of "lesbian" would predate (or at least supercede) Sappho.</p>
      <p>hhp</p>
