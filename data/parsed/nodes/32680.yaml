      <p>William, analyzing Minion over its many permutations would require thousands of words. A nice use of one version of it is the shown in the hardcover edition of Sereny's Speer/Struggle with Truth. The heavy flat paper thickens everything up a necessary trifle. But it is noteworthy that the extremely careful book designer turned kerning off, because using Minion with kerning can create more problems than it solves. It is nice that the typeface is being constantly improved. I have not spoken to Robert Slimbach in almost ten years but when last I did he disliked the face. </p>
      <p>I have reached a point where I am not really interested in studying anything but the finest work. For me that constitutes Zapf, Frutiger, Carter, Stone, Berlow. Of these five, only the last three know much about actual typeface design implementation, and they each know a very great deal. Outside of these people I find a lot of interesting and lovely work, but it is all too problemmatical for me to get too involved in it. I must say, in the end, that I think a tyepface can only be properly evaluated when used for the kind of purpose it is intended, a book or a magazine. Of course I am only talking about text type. </p>
      <p>I don't think it's right to say that Robert is 'free' from multiple masters. The last I heard, fairly recently, all of his work internally is designed in MM format, and he believes that the format is going to come back, as well it should. However, it is true that, without some sort of substantial intermediate technology, and even that has some limitations, it is seldom possible to do the entire optical range justice with simple interpolation. For that reason Garamond Pro is designed as a multiple master that goes from 6 to 18 points, and another multiple master that goes from 24 to 72. I know that Sumner Stone has worked in even finer gradients. I have never been able to identify a theory in Robert's work. I think he is less intellectual, more intuitive, than people would like to think. I don't like him although I once did very much, and I have yet to find a single person who does like him. But I admire him for pursuing a lot of projects -- such as Garamond Pro -- that he has had to do in his spare time. It is not commonly known, but a lot of big projects that have come out of Adobe have been created in the teeth of managerial opposition. One shudders to think what he is actually obliged to do in working hours -- the things he doesn't want to be working on. Carol wasn't the only person to have problems at Adobe. </p>
      <p>You can isolate a single letter and study it and identify good things and bad things in different implementations. But I don't think this is a good way to look at a type. You have to look at it in its totality, and that takes a lot of time. Well, you have to do both. And more!</p>
      <p>Does Robert have a theory? I don't really think so. Does anyone, really? Look at the way Carter's spacing evolved from Galliard to Miller. But I'm sorry, I'm just blathering. You've asked for something serious that I just can't give right now. </p>
      <p>I _am_ glad Carol got her Caflisch moment!</p>
