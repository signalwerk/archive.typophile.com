      <p><em>i’m quite certain that Nick’s Bulgarian Cyrillics will be well-informed, and he’ll probably be the first western type designer to even take Bulgarian preferences into consideration!</em></p>
      <p>No not the first. Luc(as) de Groot has holidayed in Bulgaria and I believe has incorporated Bulgarian variant forms into some of his fonts.</p>
      <p>More interestingly, although contentiously, there is some evidence that those Bulgarian preferences were actually invented by a western type designer. Albert Kapr, from the Hochschule in Leipzig, was very involved with the development of design education in Bulgaria in the 1960s, and according to Maxim there is some evidence that at least some of the Bulgarian variant letterforms originate in Kapr's ideas. Some, like the ascending lowercase zhe, are also found in certain styles of Russian script types, but the application of these features to all styles of type, as in Bulgaria, seems to be a novelty.</p>
