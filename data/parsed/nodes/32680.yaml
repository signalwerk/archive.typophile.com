      <p>Wow, the thread that wouldn't die gets yet more surreal.</p>
      <p>The thing that tends to get overlooked when scientists discover a natural cause for a particular sexual attraction or predilection, as with observation of the occurrence of various kinds of sexual activity among other species, is that natural cause doesn't imply anything about morality. There's a romantic tendency to assume that everything that is 'natural' is morally good or at least morally neutral, which misses the point that morality can only be connected to nature via metaphysics, e.g. through a theology of creation; without such a metaphysics, morality is confined to the human social realm. The fact that some people appear to be genetically predisposed to be attracted to the same sex doesn't imply that sex between people of the same sex is moral, any more than the fact that very large numbers of men are apparently genetically disposed to be attracted to dozens women in the course of the average day (presuming they live in a sufficiently large urban evironment) doesn't imply that promiscuity is moral. Nor does the fact that homosexual behaviour is observable among other species mean that it is morally neutral: gang rape and necrophilia are also observed among other species. Which is <em>not</em> to equate these things, only to point out the fallaciousness of making moral arguments from nature.</p>
