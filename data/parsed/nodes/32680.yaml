    html: <p>Berthold had the same concerns about the PS conversions of their full-res Ikarus data, and their concerns were essentially laid to rest. Adapting type designs to fit an 18 or 24 unit system is a problem; 1000 units really isn't all that shabby. And, as has been pointed out, you're welcome to work at any scale you want. Keep the data and see what happens. I just think that whatever design you come up with, fitting the curve elements onto a 1000-unit grid is not much of a compromise. It's simply one of the challenges of the current format, and given all the other advantages we have (wild kerns, contextual substitution, excruciating precision, huge character sets, limitless design options, overlapping shapes), it's not a deal-breaker.</p>
