      <p>Calling yourself a philosopher is easy*. Getting like-minded people to call you a philosopher isn't too hard either. Heck, I've been called all kinds of nice things by people who agree with my more "rousing" ideas - but I have to suspect they're essentially seeing what they want to see, and what I really am will be (or much more likely not be) remembered far into the future. Because what's hard to pull off is being called a philosopher a couple of millennia after you're dead. Of those, the only female we seem to have is Sappho.</p>
      <p>* <a href="http://www.flickr.com/photos/48413419@N00/416819792/" title="http://www.flickr.com/photos/48413419@N00/416819792/">http://www.flickr.com/photos/48413419@N00/416819792/</a></p>
      <p>Anyway I didn't say there were no women philosophers. I was leading off from Bill's interesting view that men are inferior text face designers and implied (among other things) that the degree to which a woman becomes a <cite>timeless</cite>* philosopher might be tied to her sexual orientation. Of course, I have no Proof.</p>
      <p>* Practically speaking, since nothing really is.</p>
      <p>&gt; I am not really interested in studying anything but the finest work.</p>
      <p>Fine, but from what I've seen of you Bill you're too conservative, too cynical when it comes to the possibility (I myself would even say unavoidability) of fundamental improvement over precedent. You think that dropping the lefthand bar in the "f" and "t" (à la Vafflard) is a big deal (and in this you are very much like Slimbach, William, and many others), while I think it's cosmetic. If I ask you to study Bloemsma's Legato and see the pivotal virgin territory it forges into, you would surely balk. But consider that in nicely stating that "you have to look at [a type] in its totality", you should take that far enough to see that everybody is sill making bunches of glyphs that get shoved together, and the really good stuff has yet to be designed.</p>
      <p>hhp</p>
