      <p>Nicole, I think what does no one any favors is refusing to think; in this case about the relevance of gender. One thing that seems impossible to refute to me is that physical differences exist (including in the brain's structure). What do those differences translate into? I don't pretend to really know myself, although I can be sure that we are better at different things. In any case I refuse to avoid thinking. It's what actions you take with your thoughts that counts. And political correctness is for politicians.</p>
      <p>On the other hand I do realize now that "woman-killer" was<br>
      way too strong; better would have been... woman-slower-downer.  :-)</p>
      <p>BTW, from the enrollees in my typeface design class I certainly know that women very much want to be type designers - in fact they seem to outnumber men in that now (although part of it must be a "fallout" from the much greater proportion of women in graphic design as a whole, and the general perception that type design is a subset of graphic design).</p>
      <p>&gt; I think we can take it as a given that this reflects<br>
      &gt; social pressures, not their “feminine nature”.</p>
      <p>Certainly (and I mentioned that myself previously). Like I happen to know that as of a few years ago there were only two women tow-truck drivers in the state of California*, and social expectation must be like 90% of the reason.</p>
      <p>* BTW, I discovered this because one of them was Armenian.  :-)</p>
      <p>&gt; I do like the simplicity of an optical axis going evenly from 8 to 72</p>
      <p>But -as you used to say, and I've come to realize- the desirability of that depends on the nature of the design at hand. Think of making even a moderately faithful revival of Caslon in MM, which naturally includes optical scaling - especially in things like the italic "Q": <a href="http://themicrofoundry.com/other/caslon_q.gif" title="http://themicrofoundry.com/other/caslon_q.gif">http://themicrofoundry.com/other/caslon_q.gif</a> _<br>
      It's not only non-linear, but actually exhibits a -sensical- topological difference!</p>
      <p>hhp</p>
