      <p>Sorry, Nicole, I'm speaking historically. Those women are all most unfortunately now dead (the great drawing office ladies of the 20s and 30s) and they were all called girls in the manner of the day, even though some were far from young. </p>
      <p>The problem with getting to the bottom of anything at Monotype with regard to the women is that they were not the only class of people treated like dirt. Morison hated all the engineers. It is terribly sad but we are all thirty or forty years too late in trying to get at this history. At least with David and Pat Saunders, we can learn something about the practices of the 40s and 50s -- but that's not what we really want to know. </p>
      <p>Speaking of girls and fitting, I think Carol did all her fitting by eye, and believe me she knows what she's doing. Robert, however, has a more scientific way of doing it, especially the italics -- and Carol was the one who wrote up his method -- at my request. It's a method of using slanted guidelines not unknown to others, which Fontlab somewhat facilitates. I believe that until the end, Carol used FontStudio for her work. </p>
      <p>I didn't know that Garamond Pro or Extra Fancy or whatever it's now called had got to the point of constituting four separate multiple masters. Doesn't that kind of indicate that you might just as well design each optical size separately, as Stone does most of the time? It's the only way to free yourself . . . . that said, I do like the simplicity of an optical axis going evenly from 8 to 72, and I do think it can be accomplished with something pretty close to perfection. Perhaps I am deluding myself however. </p>
      <p>Ultimately I don't think it's gender that's important in type, I think it's teamwork.</p>
