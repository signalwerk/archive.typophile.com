      <p>William, you are on thin ground here, and I doubt you have really read (why should you?) what I wrote or asked yourself how I could possibly be saying what I was saying. Very little of what I am saying is my opinion. How could it be? I make clear that to the extent I knew Carol at all, it was during her last couple of years at Adobe. So where does all of this come from? Well, obviously, from the people who were there at the time. Each one of course tells a different story. And I thought I was being terribly discreet at not going into any detail about who said what and what their possible motives might be. So who have I talked about Carol with? First of all with Carol. Second of all with Robert Slimbach, with Fred Brady, with Sumner Stone, with EM Ginger, with David Lemon, and with a lot of other people. They were all there; they each have a different story. I make a deduction when I say that Carol was a victim of the predominantly male culture in her environment, but I think it would be a safe deduction to make on far fewer facts. I don't think there's anything nasty in talking about it. It's simply what happened. I know perfectly well that Carol wasn't interested in doing type at the end, because she often spoke of it to me, and her wish to try out managerial projects instead --one of which was art directing me. I know there was a lot of tension. People really were saying, 'so-and-so is trying to stab me in the back -- please don't repeat this -- and don't think you can ever trust him/her/it --ever.' Good heavens, it was a viper's nest! On the tangential question of originality, you could learn much though far from all by digging through the archives of the type design list, which is where I think John Downer published a lengthy and I think quite convincing expose of the process that led to the creation of Trajan -- several years ago. An excellent piece of research on his part.</p>
      <p>By the way, I have some reason to believe that some of my conversations with Carol were taped. Perhaps they still exist in some corporate archive? </p>
      <p>The funniest remark she made is one I regret having made public, but since I have already long since done so, there's no harm in repeating it here. I had drawn her attention to the remarkable similarity between Robert's Cronos and Volker Kuester's celebrated Today Sans Serif. </p>
      <p>'Not again!' said Carol. </p>
      <p>Foolishly, I didn't ask her what she particularly meant by that. I really don't have the makings of a proper journalist. </p>
      <p>Nobody has asked me what my personal feelings are in any of this. They're very simple. I was disappointed that Carol left Adobe without sorting out my project in the way she had promised, from the start, she would, if there was a problem. (She foresaw intractable problems from the start, and had candidly warned me that it was likely to end in tears, as it did.) On the one hand, I thought it was unnecessarily chicken-hearted of her. But by then I knew too much about what she was up against. It was impossible to blame her. I wasn't an angel myself at all times. There was an incident, when I was doing one of the first stories on OpenType, when Adobe PR wasn't I thought doing its job, and I exploded in a vile manner at one of the PR minions or product managers who I knew was a good friend of Carol's. Everyone was very polite about it -- they wanted a good story after all -- but I sensed I had done something awful not just to this woman but to all of her friends in similar positions there. I had taken unfair advantage of my position not just as a journalist but quite simply as a male, and it wasn't a good thing. Carol had to put up with this sort of thing for more than ten years. For me, being exposed to it for two or three years, part-time, and at the presumably safe distance of 3000 miles, was enough to wash me out for a decade as far as type was concerned. Carol tactfully put up with far worse for much longer. I have enormous sympathy with that. </p>
      <p>And no, I don't think these are things that, like cancer decades ago, should 'never be talked about'.  Air it all out, I say!</p>
