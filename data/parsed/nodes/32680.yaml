      <p>But Hrant, who are these people who think of Sappho as a philosopher rather than as a poet? I simply have not come across this view before. It seems to me both highly unlikely and unsupported by a) the relatively few and fragmentary surviving writings by her and b) her reputation in classical Greece. Her writing is lyrical poetry mainly concerned with love. Hence, she is known as a lyrical poet. And a very fine one. This isn't in any way do dismiss her wisdom, which Aristotle acknowledged, but the ancients made a distinction between philosophy and wisdom literature that our language doesn't reflect very well.</p>
