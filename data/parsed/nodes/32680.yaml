      <p>James, weren't some of the TM Caflisch pieces in English? For example, the one on George Abrams's Venetian? I have a copy of that he gave me and I'm sure it was in English. Neither  my German nor French is good enough to remember as much as I do of it. </p>
      <p>Hrant, it is totally demented to say there are no woman philosophers. Perhaps not until the 20th century but good heavens, in France there is a whole school, in America -- are you mad? You really should read Avital Ronell's The Test Drive which as far as I am concerned is the most important book on philosophy written since Der Fall Wagner. There is a wonderful passage where Ronell suggests, in a play on Jenseits von Gut und Boese, that we are finally Jenseits von Mann und Frau. I think she is right. And she is by the way rather famously not that way inclined, or at least has been.</p>
      <p>William, the historical problem with Adobe's optical axes was that they were implemented such that a 72-point master would be printable, without dropout, at six points, and a six point master would be usable at 72.  There is a valid commercial reason for this, but it led to mediocre designs. This was an intractable source of friction between me and the type group when I worked with them in 1996-8 or whenever it was. Happily, as shown in some recent work, they have acknowledged that I was right, and their optical axes have finally improved in some of the 'opticals' released after the catastrophic decision to end the multiple master format. (Just look at any street map of London, and you'll see at once that it is a design problem crying out for multiple master fonts and a program such as Lari Software's LightningDraw that knew how to let users work with MMs.) But Adobe's optical work still fails to approach the heights scaled by the Mono/Lino designers of the 1920s and 1930s, or the work of such contemporary designers as Stone and Berlow or, of course,  to the extent he works with them, Matthew Carter. Stone's work, as Matthew Carter so generously says, is in a category of its own. I'm sorry if I'm still speaking in generalities; I don't want to cop out of this, but I don't have time right now to show in detail what is right and what is wrong about these typefaces. I have been hoping for some time to write a book about type that would go into these issues. It has got to the point where I have a willing publisher and a willing co-author, but it is still a long way away. In the meantime, just look at a lot of type. I learn something every time I look at a good book published between 1920 and 1970. Just take the example of a government usage guide printed in Monotype 12 point Baskerville with long quotations in 10 point Baskerville. The only way you could even approach the perfection of color in digital is by using Stone's Cycles. By the way, I owe the existence of the offer to write this book to Carol Twombly. She was approached by Godine in the mid-90s for ideas on someone who could write something he envisaged as a successor to Talley of Types. Carol suggested me, and I have not been writing the book ever since, but we try to keep the flame alive. </p>
      <p>Hrant, regarding the theme of women in type design, don't forget the hundreds of drawing office girls. Were they mere, low executants, or did they have creative input? I have been trying to test the theory for years that some unsung woman is the true hero(ine) behind the perfection of Monotype metal Bembo. I haven't got very far, though I have identified a possible candidate, thanks to David Saunders. The next clues would lie in the initials on the original drawings. But it is already clear that nobody will ever know who really designed this typeface. </p>
      <p>I must discuss the matter with Saunders again, but my hopes for any revelations are not great. David and Pat Saunders know more than anyone else living what actually took place in the Monotype drawing offices, but they came much later, after the War, and they don't know in any real detail what actually happened in the interwar period.</p>
