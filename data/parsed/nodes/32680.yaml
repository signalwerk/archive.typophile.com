      <p>&gt;Karsten, what magazine is ‘TM’? I’d like to read that review</p>
      <p>Bill, TM is the short title of the Swiss journal <em>Typographische Monatsblätter</em>. In 2003, shortly before he died, Max Caflisch put together many articles from the excellent long series on type history and modern revivals that he had contributed to this journal over many years in a two-volume edition that he designed himself (beautifully), with the title <em>Schriftanalysen: Untersuchungen zur Geschichte typographischer Schriften</em> (St Gallen: Typotron, 2003). They are all in German, but well worth looking out for the illustrations alone. The Adobe Caslon piece is on pages 200–214 of volume 2, and it is followed by one on Carter's Big Caslon.</p>
