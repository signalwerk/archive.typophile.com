      <p>&gt;&gt;&gt; I was looking at concrete systemic reasons<br>
      &gt;&gt;&gt; Yes, I know, that’s always the problem.</p>
      <p>Lol. So you're suggesting intuition, gut instinct, or a message from the Virgin Mary as better methods? </p>
      <p>The subject of what drives people to make the choices they do, or be interested in particular pursuits/careers/hobbies is so wide, deep, and encompassing that I am certain we will not be able to reduce it to either social pressure or innate, gender-determined preferences to the exclusion of other motivating factors. Nor will we arrive at a definitive conclusion in this thread. People are a helluva lot more complex than that--women too. Arguing for or against either position is just ridiculous, ignorant, or playing devil's advocat. Oh wait! Or men being typically (naturally?) pig-headed. (oops, did I say that out loud?) ;)</p>
      <p>C'mon! Give it up already. </p>
      <p>I find, going back to the original post, that the whole concept of wanting to know if a type designer is married or has children somewhat suspect to begin with. Who cares? Is it really pertinent to the validity or success of the typeface, or to the designer's ability? Not so much. Incidental, environmental. Ok sure, we could say some things about overcoming obstacles and the demands of raising a family or the sacrifices required by certain social situations. We could also draw some very nebulous conclusions about soft lines and sweet bezier curves or hard angular lines and gender preference, we could even get into the length of the descender, the shape of the bowls and counters... but would you really reduce a person's professional achievements to such inanities? And if so, they must be equally pertinent when looking at male designers, although I would suspect in their case, the family/gender/sexuality issue is generally entirely ignored.</p>
      <p>Start first by looking at the artist's art, not at the artist. </p>
      <p>The things that make me tick, you would never entirely -- not even largely -- deduce from my gender. The reasons I have made the choices, had the successes, had the failures that I have in my life are far too varied and layered to be reduced to merely my gender or my social environment. To suggest that they might be somehow dulls the human experience, don't you think? </p>
      <p>Discussing gender theory, identity, sexual politics, and societal-gender factors is great, but let's not confuse it with making sweeping generalizations about either sex based on feelings or impressions. Perhaps we could even discuss it for what it is, without using our generalizations, assumptions and hearsay to draw conclusions about a specific person.</p>
      <p>/grumbles off to bed.</p>
