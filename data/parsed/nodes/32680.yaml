      <p>But it's a deceptively dangerous precision, since when you generate a font it all gets rounded to integers anyway. If you want more precision you use a larger EM, but that limits you to TT fonts, in which case your precision is toast if you draw in cubic beziers (since they get converted, not supremely faithfully, to quadratics).</p>
