      <p>Hannah Arendt (<a href="http://en.wikipedia.org/wiki/Hannah_Arendt" title="http://en.wikipedia.org/wiki/Hannah_Arendt">http://en.wikipedia.org/wiki/Hannah_Arendt</a>), despite her disavowal of the term, was nevertheless one of the greatest twentieth-century philosophers. Thanks to her work in Eichmann in Jerusalem: A Report on the Banality of Evil, she was a household name for a while, but even better is her work in Between Past and Future: Six Exercises in Political Thought and in The Human Condition. A few samples:</p>
      <p>"But it could be that we, who are earthbound creatures and have begun to act as though we were dwellers of the universe, will forever be unable to understand, that is, to think and speak about the things which nevertheless we are able to do."</p>
      <p>"Modern politics is at war with truth."</p>
      <p>“The aim of totalitarian education has never been to instill conviction but to destroy the capacity to form any.”</p>
      <p>“It is as though mankind had divided itself between those who believe in human omnipotence (who think that everything is possible if one knows how to organize masses for it) and those for whom powerlessness has become the major experience of their lives.”</p>
      <p>. . . just to do my part in aiding and abetting the thread that would not die . . .</p>
