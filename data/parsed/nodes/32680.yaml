      <p>&gt;Didn’t FontStudio fade away into oblivion years ago?</p>
      <p>There are those who still use it. The main reason is that there is NOTHING that will let you gracefully flit from point to point, handle handle, using just the tab keys and cursor keys, while you perfect your curves. It is one of the most powerful creative experiences the computer allows. If you are really interested in perfecting your letter shapes, FontStudio's mechanism is glorious. Yuri, is there any reason not to put this into Fontlab?</p>
      <p>Also nice is the 800% zoom. Not even FontLab has that, though Fog5 went to 3200% and I sometimes wished it would do more. </p>
      <p>The main limitation of FontStudio for me, for the project that I would most have liked to use it, was that it only worked in integer point units and I wanted the extra precision that Fog 4/5 (or Ikarus/whatever DTL calls it now) allow. </p>
      <p>Carol used to say she could not bear to draw in anything else. </p>
      <p>I believe the code is owned by Adobe now . . . . which swallowed up the brilliant engineers who did that (and Chameleon, etc. etc.) and were never heard of again -- was Russ McCann the lead? Yes, see <a href="http://www.ucmsds.com/company/who_officers.cfm" title="http://www.ucmsds.com/company/who_officers.cfm">http://www.ucmsds.com/company/who_officers.cfm</a> for what has become of him. I wonder who actually does own the code still? But I'm pretty sure it's Adobe. Hey, does anyone have a Chameleon beta 2?</p>
