      <p>I think you go too far. Have you read any biography of anyone published in the last 30 years? Or indeed any good biography published after 'Eminent Victorians' which I take as the gold standard for modern biography? There is a dose of behind the scenes truth in what I wrote but it is hardly salacious. There is no point in pretending that Carol's life in type was some sort of idyll. If it had been, she wouldn't have quit it. The original poster did ask for some biographical information. I provided some. What is your sense of biography and what it should provide? Let us say you're going to treat a type designer seriously. You want to know what motivated them to work in the first place, what kept them there, how their career evolved. When the career ends quite prematurely, you want to know why. There is certainly an inextricable link between anyone's personal life and private life, and anyone whose achievements are in the least substantial is fair game for biography. And let's face it: when a career does end prematurely, there is usually to some extent a tragic explanation. What exactly are you looking for? Could we have your theory of biography? What biographers do you most admire? What is it you like about the way they cover their subjects? Precisely what do you think a biographer should not cover, and why?</p>
