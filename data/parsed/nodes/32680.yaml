      <p>&gt;What do you complaining gentlemen want?</p>
      <p>Well, that you and others not say negative things about other people, *particularly in a public forum*, unless there is a compelling reason to do so. </p>
      <p>By the way, the same concept that it is wrong to disparage others, even if what you say is true, is also present in Buddhist ethics. So if I am being sanctimonious, at least it is in two religions! </p>
      <p>Now what is a 'compelling reason' is, I admit, not always so easy to figure out. A lot of office gossip is prudent self-defense. But your comments about lack of originality are clearly to a big extent personal opinion--others in fact disagree--so that is not revealing helpful facts, but simply disparaging opinion and so is out of bounds by these standards. </p>
      <p>I know there are arguments on the other side of this issue. Somerset Maughm said with his usual wit that an ideal friend has "a heart that is kind, a hand that is generous, and a tongue that is neither." But the reality is that toward the end of his life by following these standards he alienated and embittered his daughter and all his friends. Admittedly he was dotty by then, but still it clearly shows you what this kind of thing does.</p>
