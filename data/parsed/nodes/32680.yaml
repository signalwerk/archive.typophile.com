      <p>This thread was one of the longest and most fascinating and delightful threads I've ever read at Typophile.</p>
      <p>Most of the topics are rightly about the  minutiae of type design and the finer points of typography, layout, design, readability, and legibility. And there are the inevitable poseurs and posturers that come out of the woodwork (my font, idea, opinion, my [fill in the blank_____] can beat up yours, was there first, etc.).</p>
