      <p>&gt;BTW, it’s quite interesting that nobody seems to mind Bill’s view concerning the inferiority of men in designing text faces - which I actually think has some validity</p>
      <p>Well thanks Hrant for the compliment of elevating anything I might innocently say into a 'view'. I'm much too impulsive to have views by and large. I do think men tend to be more egocentric than women, less able to share achievement (though obviously not, for example, Japanese men) . . . . and I think type is best done co-operatively. That really is a view. It has been evolving for a long, long, time. Yet Matthew Carter criticizes me for what he regards as my excessive dependence on other peoples' opinions. 'When are you going to learn to fly solo?' he asked me -- twelve years ago. I have only gotten more neurotic since. </p>
      <p>I really also sense that we are on the verge of true changes in gender equality. I do think that women growing up now -- many of them -- will be able to think and do as well as men -- and perhaps men growing up now will be able to do likewise? </p>
      <p>Again I really do recommend Ronell's 'The Test Drive' as a foundational thought provoking book for this era. </p>
      <p>One thing I would like to point out about Adobe is that Carol had problems, and some of them had to do with the fact that she was a woman and had been trained to be compliant. However, the men had their problems too, and some of them were the same problems. So to a certain extent, it's unfair to bring gender into it, yet you certainly can't leave it out either. It's the corporate control structure that was the cause of all these problems. Yet without the corporate control structure, and all that entailed, you would not have had these designers working in a somewhat collaborative environment, which is good. Apparently there are no right answers. So maybe I've been asking the wrong questions?</p>
