      <p>"Nicole, I think what does no one any favors is refusing to think"</p>
      <p>I couldn't agree more. But, sometimes people think out loud before they have something useful to say (that's not a dig, just a comment...). </p>
      <p>Discussions around women's achievements too often include wild (WILD!) speculation about why women are or aren't involved. I don't discount gender difference, but prefer to see it is just one of many factors that go into someone/anyone choosing type design as a career. It's important to look at a number of factors (notably the system through which typefaces get created and published and how a career in type design is formed) and not just what inner qualities women may or may not possess.</p>
