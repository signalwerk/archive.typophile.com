      <p>You're missing the point, Hrant. How type gets processed today is a temporary thing; PostScript and TrueType weren't the first digital systems for processing type, and they won't be the last. There are designers who are unhappy about the current limitations of PS and TT. (Just think about a sans Z -- you may want it raised it 1/2 or 3/4 of a unit off the baseline; you don't want it by a full unit, to give a very simple example; you may take that if it's all you can get, but you know it's not the ideal.). Just ask Bitstream if they're going to throw away their master data at 15,000 units just because an inferior system has sway for this decade and last decade, but certainly not the next, or the one after that, unless it gains a little more precision. You want the satisfaction of knowing that, however you output your type today, you can design it to higher resolution and you can confidently hope that one day it will be possible for it to be outputted at higher resolution.</p>
      <p>The other overwhelming reason for higher precision is to avoid the round-off errors that often occur during transformation operations. Serioius Fontlab and Robofab users now have some facility for doing this, but it all seems kludgy.</p>
      <p>Chris, I am running FontStudio 2.02 Beta 1 Plus under Classic on OS 10.4.8, and don't seem to notice any problems. All this and the code is just over 1MB.</p>
