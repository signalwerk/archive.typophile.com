    html: <p>These sanctimonious comments concern me. What do you complaining gentlemen want? The gospel according to the PR department? Is that where your heads are? In my view one should be glad, truly glad, to have done anything that warrants being talked about at all. My purpose here -- and it is a serious purpose -- was only to point out that anyone who wants to learn anything substantive about Carol will not find, in the sophomoric fantasies produced by PR scribes, anything that even tangentially approaches the truth. You cannot start with commercial material expressly designed to conceal a reality that almost rises to tragedy. Surely so much as that is evident? There is some sociologist of the 1940s or 1950s who wrote of persons who had important roles projected upon them -- for example, Marian Anderson, who wished to be a successful singer, not an ambassador for her race. Anderson nevertheless accepted this role when it was thrust upon her. In her way, I think Carol belongs to this type. The role of the successful, female, happy, fulfilled typeface designer was projected upon her because it was necessary for reasons of sentiment and commerce. It wasn't just Adobe that needed it -- so did the rest of us. Carol opted out. The reasons why are interesting and worth discussing; it would be a lovely subject for an above-average master's thesis.</p>
