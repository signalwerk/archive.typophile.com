    html: "<p>Hi Colin, <br> <br>There was a long discussion about Futura and its alternate characters and about  Berthold Univers BQ here: <br> <br><a href=\"http://www.typophile.com/forums/messages/30/4651.html\"> http://www.typophile.com/forums/messages/30/4651.html</a> <br> <br>As I state in my post about halfway down the page, with the type sample, I purchased the Foundry versions of Futura for the alternative characters, but what I've been most impressed by and use most often are the f-ligatures. <br> <br>I've also always loved Futura's oldstyle figures. I've purchased the complete Berthold Futura in order to have these in all the various weights. I've found the Berthold version to be excellent. <br> <br>Also check out the link from Tiffany: <br> <br><a href=\"http://www.d.umn.edu/~jkmetz/GDH/04-24-01_3.html\"> http://www.d.umn.edu/~jkmetz/GDH/04-24-01_3.html</a> <br> <br>- Paul</p>"
