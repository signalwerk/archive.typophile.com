    html: |-
      <p>There was an ATF typeface called Lining Gothic (shown in Jaspert’s “Encyclopaedia of Type Faces”) that seems very similar. In fact, there were a large variety of Grotesques/Gothics with numbers which seem to include many that are at least similar. Each foundry had their own ’flavors’ of these sans serif workhorses, and film types had a spectrum of widths and weights and stylistic variations, which could be further varied by using lenses. I think this may be very hard to pin down exactly.</p>
      <p>- Mike Yanega</p>
