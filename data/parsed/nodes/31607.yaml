    html: |-
      <p>Well, better late than never!</p>
      <p>I’ve been doing an assignment (or whatever you might call it) on Matthew Carter (you know, Snell Roundhand, Charter, Galliard, Tahoma, Verdana, Georgia...) and I saw this thread just now... well, he designed a typeface in 1970 that was to be used on the – at the time – new terminal of Heathrow Airport. I’ve never actually seen it, but the timing makes sense and the influences of the design too. They didn’t actually name it, but I’ve seen sources where people refer to it as Airport.</p>
      <p>If I’m not mistaken, it was never produced as a usable font, not even then... I remember reading it was pasted up on the signage from Photostats, although I don’t even really know what those are.</p>
      <p>ruD</p>
