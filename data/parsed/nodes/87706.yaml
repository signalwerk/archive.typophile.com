      <p>@HVB - Hallmark has an amazing library of proprietary fonts they created over the years for their use in greeting cards and other products they develop. And as you pointed out, they did in fact license a small set of fonts for use with a Hallmark greeting card software application targeted at consumers and home users.</p>
      <p>It has been an honor for us to have partnered with Hallmark to bring a selection of these fonts to market at <a class="freelinking external" href="http://www.ascenderfonts.com/foundry/hallmark/" rel="nofollow">AscenderFonts</a> (and also at <a class="freelinking external" href="http://wwww.Fonts.com" rel="nofollow">Fonts.com</a> and <a class="freelinking external" href="http://wwww.Linotype.com" rel="nofollow">Linotype.com</a>).</p>
      <p>As pointed out, one of the significant differences is that these new commercial versions of the Hallmark fonts are sold with a traditional commercial font license that designers typically expect. </p>
      <p>Another key difference is that the talented type designers at Hallmark extended the character sets to full Latin 1 (codepage 1252), and produced both TrueType and OpenType (.otf) versions.</p>
      <p>Thus, these new versions of the Hallmark fonts are much more suitable to creative professionals. And as to the "ridiculous pricing", I would counter that these new commercial versions are a bargain when you consider the effort that went in to crafting them, along with their range of creative and expressive personalities.</p>
