    <p>What's wrong with this picture?</p>
    <p>I just noticed that AscenderCorporation is selling a large number of Hallmark's HMK fonts - at $29.99 each. Dozens of these fonts are included with each of Hallmark's Greeting Card programs - which retail at about $25! A small example - Hallmark's Card Studio 2011 sells for $25 and includes 20 HMK fonts. Purchasing those fonts from Ascender would cost $600, and you wouldn't even get the card-making application.</p>
    <p> - Herb</p>
