    date: 2004-10-13T07:02:00
    date_raw: 13 Oct 2004 — 7:02am
    votes: null
    html: <p>Thank you! Troover Roman is the exact match. <br>There is also a font called Trooper Roman available from CastleType, <a href="http://www.castletype.com/browse_classic.html" target="_blank">http://www.castletype.com/browse_classic.html</a> - but it is not the condensed version which trades under the name Troover by ParaType. <br>Very interesting indeed. I had a hunch that this font might be designed by Tom Carnase, who designed Tom's Roman. I have not found any information anywhere as to who designed it originally. Any clues?</p>
