    html: <p>That typeface is Trooper Roman. <br>There is a digitized version from Paratype called <a href="http://www.paratype.com/pstore/fonts/Troover.htm" target="_top">Troover Roman</a>. Watch out, the "y" and "g" of your sample are alternates characters, and Troover looks that has them (228, 243). <br>There is another Bitstream's font called <a href="http://www.myfonts.com/fonts/bitstream/itc-toms-roman/" target="_top">Tom's Roman</a> "sharing the style of Trooper" but to me doesn't look as close as Troover.</p>
