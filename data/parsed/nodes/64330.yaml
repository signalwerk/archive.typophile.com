      <p>I'm surprised this thread went on this long without someone noting that not only are computers bad for type design, but so is the pantograph. Fonts should be designed by punch-cutting!</p>
      <p>That battle, though, I think, has been lost. The general public, whatever one might think of its standards of taste, is much too used to the slickness of today's typefaces to accept the results of punch-cutting by hand. They will accept that Aldus' Hypnerotomachia Poliphilii was an improvement on what came before, but even while acknowledging its beauty, they will still resolutely prefer, say, Times Roman for normal use.</p>
      <p>That being said, though, it does seem to me that computer type design is in its infancy. I would prefer to draw letters on paper, and then measure them, and locate reference points in the letters I create by number, at least in some cases, than try to design a font by drawing directly on the computer screen with a mouse. And the fact that all the major outline font standards restrict one to using only spline curves rather than (at least for classic Roman fonts) being able to explicitly demand a conic section (never mind Melior, based on Piet Hein's superellipse) is a problem as well.</p>
