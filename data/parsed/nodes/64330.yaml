  html: |-
    <p>Hi guys, I am currently working on a typography project and desperately seeking inspiration. This quote by the great Milton Glaser 'Computers are to design as microwaves are to cooking' is my starting point and I am to create a typeface to enhance the semantic meaning of the words and create emotion. I am to consider the shape and form of each letterform as well as what materials to use to express my chosen quote. The brief encourages to use either/or all hand drawn, hand made, illustrated, painted, scratched, sewn, constructed, three dimensional type. We may combine the type with images but allow the letterforms to focus on the design. Overall broaden the sense of meaning of the words.</p>
    <p>So research has taken me to obvious ideas and food for thought so far, like - radiation as the typeface / use of computer and microwave food related typefaces and symbols / microwave parts and components / Milton Glaser typefaces like stencil / microwave food packaging / circuit boards and computer parts / using the computer desktop or/and icons / using blur-motion to create speed / even microwaving computers and parts!....</p>
    <p>I haven't hit the nail on the head yet but would very much welcome any input any one might have on this topic?!</p>
