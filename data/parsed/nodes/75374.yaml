    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2010 Old Spice Orlando logo_4075.jpg"></div><p></p>
    <p>I'm 99% sure the "Classic" is some kind of Arial, right now I'm using Arial with the Bold adjustment by Photoshop and it appears to match.</p>
    <p>The Old Spice on its own though I can't seem to find in my collection... I could totally use some help. It's for my birthday cake this weekend.</p>
    <p>Thanks so much!</p>
    <p>Matt.</p>
