      <p>Hi JP.</p>
      <p>zowel in de regular alsook in de bold/black, zijn de binnenvormen erg belangrijk. Nu heb je in de vette welliswaar alles vetter gemaakt, maar ten koste van de binnenvormen. Het contrast (verschil dik/dun) zal in de lichtere gewichten afwijken van de vettere, maar als het ritme en de structuur overeind blijft wordt het er beter van.</p>
      <p>Wat de spatiëring betreft, zou je moeten beginnen met woorden als 'minimum, noon, honolulu' etc. Met andere woorden, je begint met de basisvormen zoals onder meer de n, o, l en i. Pas als de onderkast goed loopt, zou ik met de kapitalen beginnen. Dit moet een tekstletter worden. Dus de kapitalen moeten bij de onderkast passen qua spatiëring. Vermoedelijk zullen de kapitalen iets ruimer staan dan de onderkast. In jouw voorbeeld van de linkerwaarde van de 'H'(100), dan zal de linkerwaarde van de 'n' een stuk krapper staan (bv. 80). En de linkerwaarde van de 'h' dan weer iets krapper (bv. 70). Dus stap voor stap een basis maken, waarop je de rest baseert.</p>
      <p>Je mag altijd mailen.</p>
      <p>Mvg,<br>
      Jacques</p>
