      <p>The spacing isn't too wide or too narrow, really, although you may want to space it out just a hair for text use. I have taken a closer look at this. (Though it still may be a safe bet to take what I say with a grain of salt.) The sidebearings, I think, look like they could be adjusted better - without the use of kerning as yet. The RSB on letters such as /P/B/R/ could be a little tighter, and the difference in spacing may be a bit too great between the round- and straight-sided letters, but only in some cases, as in some of the words, the spacing is literally less between the straight-sided letters than the round-sided. The sidebearings for harder-to-space letters like /x/g/s/a/e/ seem also to be either too tight or too loose in most cases, where they could be much better with sidebearings alone. The other "problem" is that, the counters of the round-sided letters are much more open than the straight-sided ones in the lighter weights, but the opposite is true of the heavier weights. The mid-weight seems to get it about right though. I'm not sure how far you'll want to go adjusting something like that, but in the lightest weight the rounded bowls seem much wider than the rest of the letters. I don't know if you have started kerning or not, but you probably need to focus on the sidebearings, and in a few cases, adjusting some of the letters a little.</p>
      <p>Hope that makes sense.</p>
