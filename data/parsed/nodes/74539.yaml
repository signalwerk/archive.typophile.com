      <p>Thanks for your responses guys!</p>
      <p>I'm an amateur type designer myself and don't have much experience either. I was never educated in type design, but ever since I saw fonts being drawn during my academy years, I was fascinated. After getting my diploma (I designed a phonetic alphabet in Futura as part of my exam) my dean wanted me to continue in type design (2nd phase study). I talked to people like Petr van Blokland, Just van Rossum and their students and drew inspiration from them. However, I didn't like the idea of spending another year in the academy, so I opted out.</p>
      <p>I claim to understand the basics about type design and can see if a font is designed well or not. But I feel I do miss the knowledge to finish the design, to release it, which I really want, but only if it's up to standard. Things like spacing, kerning and hinting I have absolutely no experience with. I'm sure the FontLab manual will tell me all about the technical aspects, but that does leave me with practical and design decisions to be made (things like "Should I incorporate SC in the OT or make it a seperate font?".</p>
      <p>I know I am asking a lot but perhaps I can make it easier. How about I send you guys updates by e-mail and you comment on that? You'd be of great help.</p>
      <p>@Brian: you said the spacing needs work, is it too wide, too narrow or just irregular?</p>
      <p>@Frode: you said I'm not there yet, and I agree. What are your thoughts?</p>
      <p>@William: there *is* an ultrablack weight already, though not complete. See the latest PDF.</p>
