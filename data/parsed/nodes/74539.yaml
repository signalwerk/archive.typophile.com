    <p>I know that most of you typophiles are experts and comments from you all are more then welcome, but I'm at a bit of a loss at the moment. So, I'm hoping there's someone among you who's willing to spend some time for the next four weeks (there's a selfproclaimed deadline) close guiding me.<br>
    In short: I'm looking for personal contact by e-mail or forum with someone who is willing and able to guide me through (what I hope to be) the final stages of designing, kerning and hinting my type design <a class="freelinking external" href="http://typophile.com/node/73658" rel="nofollow">Aubaine</a>.</p>
    <p>Any takers?</p>
