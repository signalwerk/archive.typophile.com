      <p>Jean Paul,</p>
      <p>I'm not the one to help you in kerning as I still did not reach this stage. Anyway, you can write me about T1 hinting and sidebar issues so we can at least try to find solutions. I'm pretty busy to follow your tight schedule, but some help is always possible.</p>
      <p>About you project, let me add two little suggestions.</p>
      <p>First, you may find useful to add other characters (numbers, punctuation, special characters, currencies etc.) before going to refine sidebars and doing kerning. Without the complete set of glyphs, your kerning will need to be expanded later. Tests with spacing are also more rich with all glyphs available.</p>
      <p>Second, it's interesting to play with anchors before doing accented characters. After creating anchors, you can build very easily all characters with diacritics (see FL's manual about this, it's well explained).</p>
      <p>I think these two procedures must be made before kerning to achieve a optimal workflow.</p>
