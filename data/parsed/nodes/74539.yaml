    html: |-
      <p>Jean Paul, just check the spacing of successful humanist fonts like Frutiger and Myriad, and see for yourself. And test your own font looser and tighter and see what you like. As Briem expains, much of type design is testing variations, and picking the one you like best.   </p>
      <p>&gt;But I don't want to just copy, I need to understand.</p>
      <p>Don't worry about copying. You already have your own sensibility on type. What you need to learn is the craft, and that is there in other fonts. You need to look at what different designers do, not one, and that should re-assure you about copying too much. And even copying the sidebearings from a font with similar character widths as a start is ok to learn—and then adjust. Metrics are not copyrightable. The goal is to look good. Similarly, seeing how different designers handle different weights will help you decide what you want to do.  </p>
      <p>I would not go to ikern before you have spaced your font. Spacing and glyph design are really one process, because you may want to widen or narrow glyphs, as well as changing their sidebearings, to get the best rhythm and look in your font. You may even want to change some of their designs to get them to space better. </p>
      <p>After you've designed and spaced it, you could go to ikern, though frankly I think it is beneficial to learn kerning the first time around, as unpleasant as it is, particularly before you get fast at it. The point is that doing it yourself the first time trains your eye. </p>
      <p>Ps. If you read Noordzij's The Stroke—and you can read it in the original!—you will gain some insight on the relation between white space in counters and sidebearings.</p>
