    html: |-
      <p>On spacing, my impression is that everything is more loosely spaced than most sans are—too loosely IMHO.  </p>
      <p>Your "bolding" is problematic in places. The white space within the lower case letters of the black weight should be visually more equal. For example, the white in the counters in the a and e and g are too small. So is the top of the A, and bands of white in the E. The white space in the m is too narrow compared to the n, etc.</p>
      <p>You have a very nice feel for letter shapes; I think the thing you are not "getting" yet is how to handle the white space, and how it relates to side bearings and to the white space in other letters. </p>
      <p>Have you read Tracy's Letters of Credit? Briem's site on type design? </p>
      <p>The best school, other than critiques by masters, is opening in FontLab fonts you admire that are similar to yours in some way, and studying them in detail. To understand both spacing and weights better, open a really well crafted humanist sans—so in the same "design space" as yours—say Myriad by Robert Slimbach. Make the same words in the "metrics window" in both yours and Slimbach's and put them side by side, in the same weights. Do this for two different weights. Compare the spacing. Then copy and paste his weights over one another. Copy and paste your weights over one another. Compare the results, and what he did.  </p>
      <p>Most of the work in learning in any case is self-instruction, though the guidance of masters can be invaluable. And be warned, type design is a lot of work. After you've done the above, if I were you I'd take my work to some of the masters and ask for a critique. Since you are living there in "scriptonia" where you have a lot of great type designers in a small country, I'd think you'd find some people who'd give you 15 minutes, which is all it would take for an initial critique. Or if you want to come to New Orleans next summer, sign up and get a critique at TypeCon from Matthew Carter, Akira Kobayashi, and John Downer (that's the usual crew). Or go to one of the European type conferences and ask some of the designers you admire to critique your work, and offer to buy them a drink or lunch.</p>
