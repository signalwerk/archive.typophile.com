    <p></p><div class="imageWrap"><img src="http://typophile.com/files/republicgothic-press-sm_6058.png"></div><p></p>
    <p>The Republic Gothic series was among the last original wood type designs manufactured by Hamilton Manufacturing Co. It was first shown in Hamilton's New Gothic Faces in Wood Type (c. 1920). The design features a sans-serif style reminiscent of brush-formed letters popular with sign painters of the era.</p>
    <p>Originally issued in 6 different widths and in both outline and solid versions, this digital release features the "Extended" width known as Hamilton Republic Gothic series 775 &amp; 776. The pair of outline and solid is designed as 'chromatics' that can be printed one over the other to achieve multiple color effects or individually as stylistic alternatives. This release features the first ever digitization of Republic Gothic. The two fonts are carefully aligned and kerned to allow for multicolor overlayment in any digital design program. It features a full Western and Central European Character set. </p>
    <p>Digitized by Richard Kegler and Miranda Roth</p>
    <p>For  a more detailed information regarding this release, visit the <a href="http://www.hamiltonwoodtype.com/republic.html" rel="nofollow">Hamilton Wood Type Foundry</a> site.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/starornaments-sm_5650.png"></div><p></p>
    <p>Star Ornaments are seen as a long standing companion to many wood type poster layouts. Various manufacturers managed to derive many variations of the five pointed star motif and offered them as a ubiquitous ornament option in almost all of their catalogs. Manufacturers such as Wm. H Page, Morgans &amp; Wilcox, Tubbs Mfg. Co. and of course, Hamilton Wood Type each had their own slight variations. This digital font features almost 100 glyphs of mostly stars, but it also features a unique star border that can create boxes just like the modular offerings of the 19th century. The twist on this digital version is the inclusion of additional connection options that become a unique lettering 'kit' that can create typography or maze-like connections using a limited set of component parts.</p>
    <p>Digitized by Richard Kegler.</p>
    <p>For  a more detailed information regarding this release, visit the <a href="http://www.hamiltonwoodtype.com/starornaments.html" rel="nofollow">Hamilton Wood Type Foundry</a> site.</p>
