  html: |-
    <p>From one to the other moment it seems something very strange happened to my vfb files. Since today I cannot install the OpenType fonts on my Windows XP system which I'm problemless generating in FontLab Studio 5. It says (somewhat translated from Dutch): "can't install the typeface (OpenType). Perhaps the font file is damaged. Aks a new one from your vendor." Going back to a vfb file from a few days ago and again generate a font without any problem does allow me to install the font. It seems a bug or something the like has invisibly nestled in my working files.</p>
    <p>Clearing/Deleting windows' font cache as well as rebooting certain times didn't help. Using the .bak files either. Any thoughts?</p>
    <p>Fingers crossed...</p>
