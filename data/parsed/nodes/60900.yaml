    date_raw: 17 Aug 2009 — 6:44pm
    votes: null
    html: <p>I have found sometimes that FontLab files acquire bad juju which shows up when you try to generate OpenType fonts. Sometimes, generating a PS Type 1 font, then opening it up in FontLab takes care of the problem, but sometimes it doesn't. In such cases, if I generate a TrueType font and open it, the problem goes away, but then you have to change the curves back to OpenType curves and, occasionally, some losses occur...</p>
