    <p>Hey there,</p>
    <p>Welcome to my first post. Been lurking for a long while now but am now taking the plunge.</p>
    <p>It's rare that sport and typography come together but these new Australian soccer jerseys have been a talking point amongst even typographic novices. What is the face used in the names and numbers? Weirdly, there are many dying to know.</p>
    <p>Thanks in advance.</p>
    <p><a href="http://www.ccmariners.com.au/_content/image/00003902-image.jpg" title="http://www.ccmariners.com.au/_content/image/00003902-image.jpg">http://www.ccmariners.com.au/_content/image/00003902-image.jpg</a></p>
    <p><a href="http://www.geocities.com/sydneyfc06/brosque2b.jpg" title="http://www.geocities.com/sydneyfc06/brosque2b.jpg">http://www.geocities.com/sydneyfc06/brosque2b.jpg</a></p>
