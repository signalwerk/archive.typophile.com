      <p>Hi Phormic,<br>
      it is more like: when sports and money collide. Almost all big sportsbrands now have their custom designed typefaces to keep the merchandising money in the pocket. </p>
      <p>So, as a start, have a look at <a href="http://www.metro-sport.com/" rel="nofollow">this website</a> for example, to see how many leagues are playing with licenced typefaces.</p>
