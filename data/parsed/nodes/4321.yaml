  html: <p>This sample was sent to me by someone who says this was produced for them years ago, and they want to expand the product line, but don't know the typeface used. I thought it looked very familiar, but I can't place it. I've searched T-26, Alias, Device, Psy/Ops and books where I thought it might be shown, without any luck. <br> <br>Anyone have any ideas? <br><img src="http://www.typophile.com/forums/messages/83/33652.gif" alt="salsatribe sample"></p>
