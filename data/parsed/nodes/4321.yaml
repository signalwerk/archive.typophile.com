    html: <p><img src="http://www.typophile.com/forums/messages/83/33707.gif" alt="salsatribee"> <br> <br>In this sample it looks the "a" is the "e" and the "e" is the "a"...  <br> <br><a href="http://www.myfonts.com/fonts/fontfont/ff-amoeba/regular/testdrive.html?s=salsatribe&amp;p=72" target="_top">Amoeba</a> has kind of the same style ... and a cool <a href="http://www.myfonts.com/fonts/fontfont/ff-amoeba/regular/index.html?s=ABCDEFGHIJKLMN%D1OPQRSTUVWXYZ" target="_top">uppercase</a>. <br> <br>Hope this helps Mike. <br></p>
