      <p>Yeah, military intelligence – orthodoxy’s moron, hunh hunh hunh. But leaving the plop plop fizz fizz (cheap bromides, get it? hunh hunh hunh) aside….</p>
      <p>First, my creds: I was in the U.S. Army for eight years. I’ve done some unusual things, but I wouldn’t have to kill you if I told you. We have people for that. I’m a technical writer and editor, not a typographer or graphic designer. From the latter points of view, I’m an aesthetic naïf, and I’m sure the poster’s semiotics are giggling as they vault right over my head.</p>
      <p>Having said that, the poster just doesn’t say ‘military’ to me. The green and black color scheme strikes me as invoking an “old school” that never was. The text is basically an Ishihara color blindness test, and the green is nowhere near real olive drab. Despite the SWAT crap you see on TV, real soldiers don’t wear black in combat; it’s too visible, even at night. Why not use a modern desert tan or urban camo or other break-up pattern? Overall, the poster seems flat, enervated, and simplisme, but perhaps that’s part of the in-joke.</p>
      <p>Considering the wide variety of military weapons, why repeat the same few weapons over and over? Here again, the items are old school big iron: planes (yes, even the F-117), tanks, and are those submarines or blimps? Think what you will about military intelligence, the fact is that modern armed forces run on information. It’s called network-centric warfare. Why not use GPS or intel satellites, computers, UAVs, etc., etc., as design elements? And make the font something futuristic and high-tech, not tired old GI stenciling.</p>
      <p>Instead of the head, how about a helmet with night vision goggles? You could make the lenses purple or magenta or dichromatic, something that really pops and gets across the idea of surveillance and reconnaissance (black helicopters, if you prefer). Or go to the Natick website and see what’s up with body armor and exoskeletons.</p>
      <p>If you simply can’t live without the visual “pun” (otherwise empty head with big boy toys floating around) on military intelligence, OK, I have a suggestion for that, too. I’m a fan of Polish posters. While I don’t like the specific subgenre, they sure do have a way with bloody, bruised, mangled, exploded, and otherwise abused human heads. Why not go to a site like <a href="http://www.theartofposter.com" title="http://www.theartofposter.com">http://www.theartofposter.com</a> (my favorite) or <a href="http://www.polish-poster.com" title="http://www.polish-poster.com">http://www.polish-poster.com</a> and check out the work of artists such as Jan Lenica, Wieslaw Walkuski, Waldemar Swierzy, Wiktor Sadowski, and Andrzej Pagowski?</p>
    html_clean: |-
