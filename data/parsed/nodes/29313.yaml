      <p>ER: This is a beautiful editorial illustration, and I don't see any reason for it to be torn apart. I particularly like the strong line work in the face, the way you did the texture of the background, and the restraint you showed in the limited color palette. The composition is simple and strong; here is an artist who knows what she or he wants to say! Many posters are indecipherable at even a short distance. This one puts its meaning across. There's a history of this kind of social and political poster, and my guess is that the artist knows that tradition. There's a respect for the form in it. My gut tells me that this is someone who's going to continue to do great work.</p>
      <p>If I had to choose one area for more experimentation, it would be the headline type. Get ready for my harshest criticism. Here it comes: at the moment, the type is not quite up to the level of the illo. Whew, that's it. (Of course the illo is very good, so you've set the bar high!) When I'm choosing type, there's always the temptation to make the choice "overly literal." For example: an article on France gets an Art Nouveau typeface, a poster for Berlin gets a blackletter, and the African film festival gets Lithos -- you get the idea. When the subject is war, then, the first (and most literal) choice might be a stencil font. In fact, so many people have made that choice, that stencil lettering, when the subject is war, has become something of a visual cliche. So on the type, I'd keep pushing it, trying other kinds of typefaces, even some that are completely unexpected and "wrong" for the subject matter. It's in that strange, ever-so-slightly wrong arena that really memorable type happens.</p>
      <p>That's my two cents (probably worth only one). Please keep up the great work!</p>
      <p>Skylar</p>
      <p>P.S. I'm a sign painter in New Orleans.</p>
