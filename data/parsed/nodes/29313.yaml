    <p>I did this drawing for an Op-Ed page in the New York Times a while back.  I've now designed this poster with the drawing.<br>
    I'm trying to work on my design and communication skills, just wondering what you think of it.  There is no client, it's just a statement.  I may print some posters myself and submit it to a poster contest at some point, depends how badly it gets torn apart here...</p>
