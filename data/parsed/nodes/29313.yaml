      <p>The "medulla oblongata" is the anatomical name for that portion of the brain where ER has put the drawing of the Thinker. The ironic thing is that the medulla oblongata sends messages to the rest of the body (things like telling the lungs to breathe and the heart to pump) as opposed to doing any decision making.  In other words, Edel has put the thinking as after the fact and too late to do any good! Quite clever actually!<br>
      Also, "crapper" is a slang English term for a toilet. My joke was trying to say that military inteligence is like thinking like Sh*t.</p>
      <p>Does that clarify it enough for you Aziz? :-)</p>
      <p>ChrisL</p>
