      <p>I really like your use of colour, subtle green and black works really nice together. and the face is fantastically simply rendered. Agree with prev. comments about the font. </p>
      <p>If I can ask one question: what does this poster say? Are you saying the military's intelligence amounts to thinking about tanks and bombs? And from that, that it's not really intelligence at all? My concern is that there is nothing in this poster to convince you that war/military is dumb unless you already think that war/military is dumb (and you only need to see the tools of war to reconfirm your already existing opinon). </p>
      <p>My advice, for what it is worth, is to find a way to persuade, inform, argue, demonstrate some kind of point about war or the military or something...a question mark just isn't enough; it amounts to asking something like: "Is the military really intelligent with its guns and tanks and helicopters?" which to me just poses another question "is it smart to fight?", the reality is that many people think that sometimes it is smart to fight wars (I'm not necessarily saying this) so the question has to be, how will your poster convince this person to think again? what extra information will your poster provide to argue the point?<br>
      hope this helps, disregard any or all at your own discretion :)</p>
      <p>Nick</p>
