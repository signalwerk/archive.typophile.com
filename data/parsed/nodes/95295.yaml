    <p>I am trying to identify the attached font image. The font appears to be a san serif font, but has some almost<br>
    serif-like characteristics, like the curve to the right of the "u". Note that the bottom of the "g" is curled, but open; and the top of the lowercase characters are chiseled/angled (most obvious e.g. the "i").</p>
    <p>Thanks for any help in advance,<br>
    Prefix</p>
