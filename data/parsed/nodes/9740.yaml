    html: <p>Thanks to one and all. I should have come here 2 weeks ago, instead of googling my head against a wall. <br> <br>It was actually a fun experiment, looking at hundreds of glyphs, and trying to decipher what was important and what was not. I can see similarities, duplications and variations in the stokes that compose the characters, but I have no idea whether the variations are artistic license or meaningful. One of my first guesses for "ai" actually means "thick black hair"... which is pretty funny, 'cause that's what my friend has. <br> <br>W/ the help of John's suggestion I came up w/ a graphic similar to Forrest's ... except that I didn't figure out the archaic version, which would have helped a lot because the caligraphy samples I was using as a guide all used the old version. <br> <br>Hrant, I'm thinking about abusing the characters to create a logo, but I had to find out where the starting point is ... plus I need to make sure I don't morph the characters into a different meaning. <br> <br>Kinda fun, now that I'm making progress. Thanks again.</p>
