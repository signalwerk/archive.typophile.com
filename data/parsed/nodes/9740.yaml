    html: "<p>According to Japanese teachers, there are 200-something \"radicals\" that can be composed to create kanji. In fact, unless you're looking at very simple characters, just about every kanji can be broken down into constituent components. These parts sometimes are themselves characters, which can provide clues to the meaning of the kanji in which they're included, but there's no necessary correlation between a set of radicals and a character's meaning. Kanji are the end product of 2,600 years' worth of random evolution, gradual refinement, and premeditated simplification, so it's safe to say that all of the strokes in a character, and the spatial relationship between those strokes, are all important. <br> <br>That's why I included the kaku / gothic version of each word: that's pretty much the barest letterform you can have and still get the essential meaning across, unless you're an actual Japanese typographer and know which rules you can break (translation: I myself have absolutely no idea, and my grasp of Japanese is rudimentary at best). <br> <br>(When studying Japanese writing and type, all kinds of blarney gets shoveled your way about the importance of stroke order, direction, and formation in Japanese handwriting. Some or all of that might have been true back when people wrote primarily with brushes, but these days, everyone uses ballpoints, and Japanese handwriting is just as rapid and sketchy as most laptop-using Europeans'. Quite frankly I have no idea how most Japanese people read each others' handwriting at all.) <br> <br>Anyway, good luck with your logo project, which sounds fun, but be careful! Remember all those Japanese T-shirts saying \"Let's lucky alligator!\" and the like: hapless mistranslation is charming on a 17-year-old girl in Harajuku, not so cute on a big, expensive boat.</p>"
