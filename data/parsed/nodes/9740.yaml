    html: <p>It's almost certainly the product of Japanese language reform, yes. The Japanese government looooves language reform. I think they just finished another round, in fact.  <br> <br>But both spellings are in the dictionary, so I thought I'd include them both. My character dictionary merely says the alternate form is "nonstandard for [standard form for "ki":spirit, which discus won't let me insert]" without any further etymology. I don't have a <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0804820368">New Nelson</a> or an actual Japanese kanji dictionary, so I don't know any more about its provenance.</p>
