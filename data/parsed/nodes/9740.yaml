    html: <p>"aiki" also means "favorite plane, camera, or other machine", and is the name of a city in China near the Russian border, but all three (the two aforementioned and "belch") are all spelled differently than the aiki in aikido. I'm not really such a pedant most of the time, but Japanese is full of homophones, and I thought I ought to clarify when I said "aiki" isn't a word, I meant, aiki spelled as it is above. Sorry, should have said so in the first place.</p>
