    html: <p>Also, if you're using a Mac, there's <a href="http://jedict.com/">JEDict</a>, which is mostly a program for the decipherment of kanji, but which can also be set up to be a pretty good Japanese-English dictionary (I use it a lot when surfing Japanese sites). <br> <br>There are two spellings in Japanese for aikido, according to JEDict, and they use different characters for "ki". I've appended a GIF of both spellings set in Hiragino Kaku (a sans serif equivalent) and Hiragino Mincho (the "serif", or semi-calligraphic equivalent); if you want some of the calligraphic equivalents (as in true Japanese / Chinese calligraphy, as seen in classical Asian art), <a href="http://www.amazon.com/exec/obidos/ASIN/0844284343">this book</a> has them. You could browse it in a store, but figuring out how to use kanji dictionaries takes time, even ones as well-designed (for Westerners) as the dictionaries John and I mention. <br> <br>It's worth pointing out that "aiki" on its own isn't a word in Japanese, at least not in the dictionaries I have. I've highlighted the characters for "ai" and "ki" in vermillion, and left the "dou" black. The top spelling is probably the one you want to use; the bottom is antiquated. <br> <br><img src="http://www.typophile.com/forums/messages/30/67282.gif" alt=""> <br> <br>The ideogram for "ai" has a Unicode number of 5408, and the first alternate for "ki" has a Unicode number of 6C17. The second alternate is 6C23. Good luck!</p>
    html_clean: <p>Also, if you're using a Mac, there's <a href="http://jedict.com/" class="link-external">JEDict</a>, which is mostly a program for the decipherment of kanji, but which can also be set up to be a pretty good Japanese-English dictionary (I use it a lot when surfing Japanese sites). <br> <br>There are two spellings in Japanese for aikido, according to JEDict, and they use different characters for "ki". I've appended a GIF of both spellings set in Hiragino Kaku (a sans serif equivalent) and Hiragino Mincho (the "serif", or semi-calligraphic equivalent); if you want some of the calligraphic equivalents (as in true Japanese / Chinese calligraphy, as seen in classical Asian art), <a href="http://www.amazon.com/exec/obidos/ASIN/0844284343" class="link-external">this book</a> has them. You could browse it in a store, but figuring out how to use kanji dictionaries takes time, even ones as well-designed (for Westerners) as the dictionaries John and I mention. <br> <br>It's worth pointing out that "aiki" on its own isn't a word in Japanese, at least not in the dictionaries I have. I've highlighted the characters for "ai" and "ki" in vermillion, and left the "dou" black. The top spelling is probably the one you want to use; the bottom is antiquated. <br> <br><img src="http://www.typophile.com/forums/messages/30/67282.gif" alt=""> <br> <br>The ideogram for "ai" has a Unicode number of 5408, and the first alternate for "ki" has a Unicode number of 6C17. The second alternate is 6C23. Good luck!</p>
