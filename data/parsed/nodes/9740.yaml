  html: <p>A friend has a new boat, and he wants to call it "Aiki" which is the first two characters in "Aikido" and means something like "in balance with the energy of the universe." <br> <br>I promised him a logo for the boat (back when he wanted to call it "Phoenix") so I have to figure out what, exactly, the characters "Ai" and "Ki" look like. I have  a bunch of caligraphed samples, but they vary quite a bit and I don't have a good feeling for what is essential and what is ornament. I tried a search the UniHan database, and go 1816 hits for "Ai"... none of which looked like the samples I have. (There was one character that was close, but the definition listed was "bushy black hair", which my friend has, but I doubt he wants that put on his boat.) <br> <br>Can any of you help me out of this mess? I'm in way over my head. Thx.</p>
