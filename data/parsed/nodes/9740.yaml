    html: <p>A few things to consider. The Unicode UniHan databse is, as the name implies, a unified Han database, which means that you need to be aware that the reference glyphs in the Unicode Standard may not be appropriate as a model for specifically Japanese use. What you need to do is get your hands on a Japanese dictionary. I use <a href="http://www.amazon.com/exec/obidos/tg/detail/-/4770028555">this one</a>, which has the benefit of including a Unicode reference for every character.</p>
