    html: <p>According to the <a href="http://www.csse.monash.edu.au/~jwb/wwwjdic.html">wwwjdic</a>, "aiki" means "belch". But "aiki" is also used as part of "aikikai", which is the Aikido World Association, and also <a href="http://www.aikinews.com/">aikinews</a>, so I think you're actually OK. The wwwjdic is the ideal tool for this kind of search, because you can click on "Examine the kanji in a selected compound" and get further details. The two versions of "ki" are indeed the result of simplification.</p>
