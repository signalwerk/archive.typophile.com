  html: <p>Just wondering if you're familiar with <a href="http://www.method.com?" target="_blank">www.method.com?</a>  I'm fascinated by their style and am looking to cultivate it myself. <br> <br>I'm wondering if anyone know of who else I can study to get inspiration.  I'm also particularly interested in their type choices -- which for the most part seem to be European but I would love it if someone could point me in the right direction for more on this style. <br> <br>Sativo</p>
