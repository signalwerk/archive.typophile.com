    html: <p>Method was founded by some folks that left MetaDesign. That version of Method's site was launched in the Fall of 2001 (If my memory serves me). It was, at the time, on the forefront of that 'undesigned' style (it's lack of style has since become a style).  <br> <br>Meta kind of had an identity crisis (when everybody else was just having a regular crisis). I'm glad they seem to be back in the saddle. Their recent Adobe packaging and interface design is rock solid. <br> <br>Here are some of what I'd call 'super-rational' sites. (Some call it 'default systems design' which might apply to some of these, but I don't like the ring of that label.) <br> <br><a href="http://www.metadesign.com/" target="_blank">http://www.metadesign.com/</a> <br>Simple, but with some nice polish. <br> <br><a href="http://www.pentagram.com/" target="_blank">http://www.pentagram.com/</a>  <br>Can't decide if I love or hate this, but I can't deny how the browser becomes as important to the design as the white space. <br> <br><a href="http://www.typedifferent.com/" target="_blank">http://www.typedifferent.com/</a> <br>Büro Destruct's type collection. <br> <br><a href="http://www.testpilotcollective.com/" target="_blank">http://www.testpilotcollective.com/</a> <br>Once you get past the splash page the site has this undesigned quality.</p>
