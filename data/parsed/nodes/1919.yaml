    html: <p>Eric, <br> <br>It's not the uniqueness that attracted me, but more the signature style.  I think Jon is right in that it has a Swiss International design style influence. <br> <br>The thing I like about it is that it's simple, elegant (not over stated), and very functional (using clean and obvious grid patterns). <br> <br>It's also a style that MetaDesign and perhaps a handful of other shops use (all in there own way). <br> <br>As such, I find it less ubiquitous overall and therefore more refreshing when done right. <br> <br>Besides, I've been a generalist for all of my career, so I'm ready to make a move into another direction.  I think this could be a good way to explore design on a deeper level. <br> <br>But Jon,  I wasn't able to find any information on Total Design?  What is that? <br> <br>Sativo <br></p>
