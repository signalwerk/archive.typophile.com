    html: <p>I saw method make metion to some typographers a long time ago on an earlier version of their site. Must have been like 4 years now. I can't find that mention any more. <br> <br>Some of the guys are from MetaDesign SF and their desire to do large design programs reinforce that idea.  <br> <br>Method seems pretty modernist to me so I think that studying Swiss International design and also the work of Total Design would yeild some clues too. They have designed type themselves for CI. <br> <br>Read all the pages at Method including the profiles in the leadership pages and other stuff for all the clues you can. <br> <br>Jon</p>
