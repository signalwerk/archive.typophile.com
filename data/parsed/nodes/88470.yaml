    <p>After three years it’s finally done:<br>
    The »Fliegenprobe« – probably one of the last letterpress specimens – was released in<br>
    a limited edition, consisting of two volumes and an accompanying box with large format prints.</p>
    <p>The project was started under the appeal »bitte setzen!« in summer 2008 by Munich Designschool (<a href="http://www.designschule-muenchen.de" title="www.designschule-muenchen.de">www.designschule-muenchen.de</a>) in collaboration with the letterpress printshop »Fliegenkopf« (<a href="http://www.fliegenkopf-muenchen.de" title="www.fliegenkopf-muenchen.de">www.fliegenkopf-muenchen.de</a>). The ambitious goal was to create a specimen of the approximately 170 different typefaces of the workshop.</p>
    <p>For photos and further information, take a look at this pdf:<br>
    <a href="http://www.lazydogs.de/files/specimen/bitte-setzen_E.pdf" title="http://www.lazydogs.de/files/specimen/bitte-setzen_E.pdf">http://www.lazydogs.de/files/specimen/bitte-setzen_E.pdf</a></p>
