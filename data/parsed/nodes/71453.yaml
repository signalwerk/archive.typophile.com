  html: |-
    <p>One of the designers here at Megacorp has created outlines for a new font based on a free font that Roger White posted on his <a class="freelinking external" href="http://www.rogersfonts.org.uk/index.html" rel="nofollow">website</a>. I have e-mailed Roger but received no reply. Perhaps it's the futbol? Is England closed? Roger lists a snail mail address as: 1, Owens Close, Rugeley, Staffs, WS15 2YH. U.K </p>
    <p>If anyone reading this message knows Roger White and how to get in touch with him, please let me know. I can be reached at my work e-mail kristin(dot)dooley (at) target.com.</p>
    <p>I've tried contacting Roger at the e-mail address indicated on the website and in the EULA for permission to use the font commercially. I've also asked permission to pay for and alter the outlines (the existing EULA expressly forbids this).  We are willing to do the font work ourselves and pay a fair price for his original outlines. </p>
    <p>Thanks!</p>
    <p>Kristin</p>
