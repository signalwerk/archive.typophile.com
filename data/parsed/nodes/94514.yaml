      <p>This style, it's called 'shadow', right?  Or was it 'shaded'?</p>
      <p>@fvilanakis – You bellowed?</p>
      <p>Edit: (To) bellow = (to) shout loudly / (a) bellow = loud shout or roar. It's kinda surprising how often Anglophones muggle up below and bellow. 'Eck, there are some that habitually write 'allot' when they mean 'a lot'.</p>
