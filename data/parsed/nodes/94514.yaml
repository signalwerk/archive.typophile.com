    <p>I have seen a font that I want to use for a business card.  I have searched various websites for hours but have not found it - although it is not especially novel. </p>
    <p>I think the easiest way to describe it is as follows: the left side of the characters (I am only using caps) is not included. So an "E" looks like three horizontal lines. And a D looks like a backwards C.  And a P looks like a small backwards C, raised up off the bottom line.  And an N looks like a tilted V. </p>
    <p>Does anyone know what this is called, or where I can find it? </p>
    <p>THANKS</p>
