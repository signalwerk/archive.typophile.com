    <p>Could you please give a brief assessment of logo (see the link below).<br>
    It is a new brand for Saare County (26 islands of the Baltic Sea, including the 2nd biggest Saaremaa). In order to outline it with “one word” we came up with a finding to outline the strategy - SEAWISE.</p>
    <p>Please note that this brand is not created to mark Saaremaa as a tourist destination only. It equally focuses onto the local habitants, investors, enterpreneurs.</p>
    <p><a href="http://www.kiirasoosaar.ee/SB_3m.jpg" title="http://www.kiirasoosaar.ee/SB_3m.jpg">http://www.kiirasoosaar.ee/SB_3m.jpg</a></p>
    <p>Thank you very much.</p>
    <p>Best Regards,</p>
    <p>Ott</p>
