    date: 2003-06-29T17:31:00
    votes: null
    html: <p>I like Helvetica Neue, the top logo is my favorite, I would however suggest moving the (stranded)  "L" a bit close to the rest. If you are going simply with a typographic identity, change something to make it more unique especially if using a common (but nice) font like Helvetica. In the end all that matters is what the client chooses, and since he/she chose the bottom version I would still suggest doing something about the stranded L.</p>
