  html: <p>Hi all! I'm working on this logo, and was wondering what you thought. One element I would like to incorporate is to link two letters together with a stroke or some other element, but the name of the company doesn't lend itself to this kind of treatment. If you have any ideas that would be greatly appreciated.  <br> <br>I have a feeling someone will cringe at the use of Helvetica Neue, but I don't have a very large type selection. <br> <br>Thanks! <br> <br>t1mmy<img src="http://www.typophile.com/forums/messages/29/12225.gif" alt="stephenson"></p>
