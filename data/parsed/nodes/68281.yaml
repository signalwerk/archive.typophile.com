    html: |-
      <p>The ideal way is that you register on Microsoft list (I think),</p>
      <p>however, you could append manually your code to the vendor.dat file:<br>
      Macintosh HD/Library/Application\ Support/FontLab/Data/vendor.dat </p>
      <p>Or put it by Python:<br>
      <code><br>
      from robofab.world import CurrentFont<br>
      f = CurrentFont()<br>
      f.info.openTypeOS2VendorID = "CODE"<br>
      f.update()<br>
      </code></p>
      <p>em.</p>
