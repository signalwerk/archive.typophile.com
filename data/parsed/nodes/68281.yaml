    html: <p>Registering it with Microsoft is a good idea. FontLab periodically updates the alias.dat from the Microsoft <a href="http://www.microsoft.com/typography/links/VendorList.aspx" rel="nofollow">master list</a>, and so do vendors of font managing applications. If you register, other apps will at some point "know" what your Vendor ID stands for.</p>
