    <p>Teeline Fonts is proud to announce the the arrival of Ambicase Modern.</p>
    <p>Ambicase Modern takes the next step in unicase font design, offering not "either/or", but rather "both/and". Each letter in Ambicase Modern is a combination of its traditional upper- and lowercase forms, in a modern (didone) style. The inventive, hybrid forms that result are intriguing and handsome. </p>
    <p>Ambicase Modern stands out as a carefully crafted experimental font: its eccentric forms do not hinder its readability. It is suitable for high-style display settings.</p>
    <p>Ambicase Modern offers a large character set and extensive OpenType features. Most notably, in modern OpenType-aware applications, Ambicase Modern can be set in swash mode, which features sophisticated decorative flourishes that differ depending on whether the letter is at the beginning, middle, or end of a word. </p>
    <p>Ambicase Modern is available in two optical sizes: Regular and Poster. At very large sizes, the Poster cut, with its finer details, is recommended. An attractively-priced set of both cuts is available.</p>
    <p>Ambicase Modern is available in .otf and .ttf format for purchase and download at <a href="http://new.myfonts.com/fonts/teeline/ambicase-modern/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">MyFonts</a> or  <a href="http://www.fontshop.com/fonts/downloads/teeline_fonts/ambicase_modern_set_ot/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">FontShop</a>.</p>
    <p>Follow <a href="http://twitter.com/#!/teelinefonts" title="Click to visit an external URL." class="freelink freelink-external freelink-external">@teelinefonts</a> on Twitter.</p>
    <p>Like <a href="http://www.facebook.com/pages/Teeline-Fonts/138571842838257" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Teeline Fonts</a> on Facebook.</p>
    <p>Learn more about Teeline Fonts at <a href="http://new.myfonts.com/foundry/Teeline_Fonts/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">MyFonts</a> or <a href="http://www.fontshop.com/fonts/foundry/teeline_fonts/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">FontShop</a>.</p>
