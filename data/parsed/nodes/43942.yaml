    html: |-
      <p>I had a lovely pork lion at a restaurant once.  The sauce had quite a bite.</p>
      <p>I heard about the Typo Eradication Assistance League a couple of weeks ago on NPR.  I wanted to go along for the ride.</p>
      <p>I can't help but spot typos in anything and everything I read.  It's enough to make me stop reading a book, when I find too many typos.  </p>
      <p>But it's hilarious when businesses get their own phone numbers and email addresses wrong.  When looking around for editing work, I've gotten return emails declining my services, even though their text is chock full o' typos.</p>
      <p>By the way, I'm new to this site.  Your forum gave me a great answer when I was looking for the right way to abbreviate "circa."  I couldn't find the answer in my paper <em>Chicago</em> style manual, but your member oldnick could.  Thanks and hello.</p>
      <p>Roberta</p>
      <p><em>I know a lot about art, but I don't know what I like.</em></p>
