    <p>Road Scholar Copyedits America<br>
    <a href="http://abcnews.go.com/Travel/BusinessTravel/story?id=4593597" title="http://abcnews.go.com/Travel/BusinessTravel/story?id=4593597">http://abcnews.go.com/Travel/BusinessTravel/story?id=4593597</a></p>
    <p>“ Some of the littlest things are big to Jeff Deck, who is traveling the country in search of mistakes. ‘I have always been aware of typos wherever I go,’ he said dryly. ‘I figured that it was a national problem.’  So far he has put 5,000 miles on his 1997 Nissan Sentra.  Friends come along for a few weeks at a time.  It's all documented on his website for The Typo Eradication Assistance League (Teal) :<br>
    <a href="http://www.jeffdeck.com/teal/blog/" title="http://www.jeffdeck.com/teal/blog/">http://www.jeffdeck.com/teal/blog/</a> ”</p>
