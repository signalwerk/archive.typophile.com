      <p></p><div class="imageWrap"><img src="http://typophile.com/files/fahr1_5874.jpg"></div>This is gonna give Hrant a lotta "cause"'... but anyway.<p></p>
      <p>This is a close approximation I think. It's called "Barney" from Bright Ideas which apparently used to be a magazine in Carlsbad CA which apparently went out of business and left no forwarding address. They apparently issued some 500 fonts over time* .</p>
      <p>What is the status of abandonware? Is that such a term? Does it mean anything here?</p>
      <p>While Dafont has a group of Bright Ideas designs(!), there is no apparent supplier for this specific font. I can't recommend its use but am curious.</p>
