      <p>yeah, the "on" is quite nasalized (does this word exist? :))</p>
      <p>the "iger"/digger-thing is correct, believe me. swiss german is like very old german in many ways, and when speaking, we use LOTS of ä, ö and ü, and mixed versions of äe and so on - there's no correct way of writing swiss german, thus no correct way of speaking it. but a swiss person would pronounce the "er" in frutiger like "är" or sometimes "ör" (corresponding to their accents of swiss german), as in digger.. (and after all, frutiger is a swiss, so using the swiss pronounciation is more correct than the "high german" (thats what we swiss call the "german german"))</p>
      <p>for sure this is not exactly the same sound - but its pretty near. i will for sure upload samples of sounds when i get a headset in the next days.</p>
