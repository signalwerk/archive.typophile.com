      <p>Thanks 'kesh'. </p>
      <p>On how to do a non-English 'r' I just say forget about it, as it sounds too foreign in English. (Also the American r is different from the English r, and on top of that the English often drop the r entirely.)</p>
      <p>This raises the whole issue of how accurate to a foreign language you should be in English. For example the English go for an English pronounciation of 'Quixote,' but Americans approximate the Spanish. English make a sort of pathetic stab at the French way of saying 'ant' in restaurant, whereas the Americans end it with an 'ont' as in 'font'.</p>
      <p>Thanks on the d in Tshichold. </p>
      <p>'iger' in Frutiger cannot be like digger in German - or French - because the sound of er in father or digger doesn't exist in either German or French. </p>
      <p>Oh, and on the ond in Garamond, if French drop the d they must nasalize with the distinctive french 'on', no? --so 'gah - rah - MON', with the nasalized 'on'</p>
