    html: |-
      <p>As for pronunciation of proper names, I will always try to pronounce it the way person or people who were close to that person would say it. As for people in history, it's really is a guessing game.</p>
      <p>Was Beatrice Warde called <em>BEE-tris</em> or <em>BEE-a-tris</em>?</p>
      <p>I never had the opportunity to meet Herb Lubalin. I had mostly heard it as <em>"Loo-BAL-in"</em>, but Ed Benguiat would always say <em>LOOB-a-lynn</em>... so I still don't know how Herb actually pronounced his name.</p>
      <p>Funny though, Ephram Benguiat always answers to <em>BEN-ghat</em> (like "hat"). But when we were on a speakers tour of Spain, they knew him well and treated him as a hero -- since in Spain his family name is moreno and is pronounced <em>Ben-gee-yaht</em> ("gee" with a hard "g").</p>
