    <p>Long-time lurker, first-time poster...</p>
    <p>Having lived most of my life thus far in isolation from type fiends, and getting most of my typographical education from books, I'm stuck on a few names that I just have no idea which way to pronounce.  Help a brother out?</p>
    <p>The ones I'm confused on are:<br>
    Frutiger<br>
    Deepdene<br>
    Garamond<br>
    Tschichold</p>
    <p>I'm sure there are others, but for some reason I can't recall them off the top of my head right now.</p>
    <p>Thanks,<br>
    Jim</p>
