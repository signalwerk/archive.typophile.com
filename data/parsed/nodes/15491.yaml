      <p>There are some slight intonation differences I've heard with pronouncing <em>Frutiger</em> but they are all relatively close.</p>
      <p>I had the pleasure of meeting Adrian Frutiger at the banquet held in his honor when he received the TDC Medal in 1987. (I'm trying to recall which Forum members might have been there... maybe Maxim Zhukov, David Berlow, Allan Haley).</p>
      <p>Most eveyone there said <em>FROO-te-gurr</em> (close to "digger") or <em>Froo-tee-ghair</em> which was closer to what I heard typographers and designer in Switzerland pronounce.</p>
