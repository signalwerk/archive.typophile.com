      <p>william, you're doing quite well with "tschichold". i dont have a micro here, otherwhise i'd record it so you could listen (im swiss, thus having no problem pronouncing swiss names :))</p>
      <p>- the fru in frutiger could be pronounced like the beginning of (japanese) "fujiama" or something, just with an r in between. frujiama.. :D<br>
      then, "tiger" isnt pronounced like the animal, but:<br>
      - the "t" like in semanTics (a strong t)<br>
      - iger probably like "digger", but without the double g.. so less strong g..</p>
      <p>garamond in french would be gar like in "garanty" but the a like in car, then again an a like in car. in "mond", you wont pronounce the "d", so probably the mon in "monthly" would fit, but stretch the "on" ALOT. on probably makes about a third of the length of the whole word when pronouncing..</p>
      <p>when i finally get a headset for using skype, i will make recordings of all the german and french names in typography (helvetica neue, univers, garamond, frutiger, tschichold, joseph müller-brockmann, etc..).</p>
      <p>EDIT: the D in tschichold will SURELY not be pronounced like a t, its a soft ending.</p>
