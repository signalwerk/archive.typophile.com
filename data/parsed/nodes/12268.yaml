      <p>Ellen Shapiro, author of the book "Clients and Designers" says Massimo Vignelli helped coin the word "Information Architect". However, according to what I've heard around and read on the web,the word "Information Architecture" seems to have been coined by Architect and consequentially lauded graphic designer, Richard Saul Wurman.</p>
      <p>Take care while selecting your books as IA is usually specific to the medium and technology it is meant to be applied to.</p>
      <p>Here are a few classics suggested by Ellen Shapiro on grid design for print, which follows closely the principles of IA for print.</p>
      <p>Grid: A Modular System for the Design and Production of Newspapers, Magazines and Books. By Alan Hurlburt.</p>
      <p>Grid Systems in Graphic Design: A Visual COmmunication Manual. By Josef Muller-Brockmann.</p>
      <p>I haven't read either, so do let me know how you fond them incase you do! :D</p>
