      <p>What is Information Design?<br>
      One of the most satisfactory definition I found so far, is the one proposed by Nathan Shedroff <a href="http://www.nathan.com/ed/glossary/" title="http://www.nathan.com/ed/glossary/">http://www.nathan.com/ed/glossary/</a></p>
      <p><strong>Information Design</strong><br>
      <cite>Information Design is a field and approach to designing clear, understandable communications by giving care to structure, context, and presentation of data and information. As a field, its principles relate to all communications products and experiences, regardless of medium (print, broadcast, digital, online, etc.). Information Design is, primarily, concerned with clarity (instead of simplicity) and understanding.</cite></p>
      <p>A good introductory book is: Information Graphics by Michael Burke and Peter Wildbur.<br>
      <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0500280770/qid=1117683542/sr=8-12/ref=sr_8_xs_ap_i3_xgl14/103-2719709-2604642?v=glance&amp;s=books&amp;n=507846" title="http://www.amazon.com/exec/obidos/tg/detail/-/0500280770/qid=1117683542/sr=8-12/ref=sr_8_xs_ap_i3_xgl14/103-2719709-2604642?v=glance&amp;s=books&amp;n=507846">http://www.amazon.com/exec/obidos/tg/detail/-/0500280770/qid=1117683542/...</a></p>
