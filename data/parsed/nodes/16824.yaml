    html: |-
      <p>Let's see if I can walk you through it.</p>
      <p>On the main item page, right to the picture, <strong>Huidig bod:</strong> means <em>Current bid</em>. Right underneath the current bid amount, the button says <strong>Bod plaatsen &gt;</strong> which means <em>Place bid</em>. Click it.</p>
      <p>On the next page, in the right hand column, fill in your <strong>Gebruikersnaam</strong> <em>(User name)</em> and <strong>Wachtwoord</strong> <em>(Password)</em> and log in by clicking the button <strong>Veilig inloggen &gt;</strong>.<br>
      (If you are not yet registered to eBay, I suggest you do that on the English-language website. That'll save you a lot of trouble.)</p>
      <p>On the next page, you can place your bid where it says <strong>	Je maximumbod:</strong> <em>(Your maximum bid)</em> and then click the button <strong>Doorgaan &gt;</strong> to continue.</p>
      <p>On the next page you confirm your bid by clicking the button <strong>Bod bevestigen</strong>.</p>
      <p>Good luck -- you've got one day and 14 hours left.</p>
