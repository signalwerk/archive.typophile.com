  html: |-
    <p><a href="/wiki/Typographer.org" class="freelinking" rel="nofollow">Typographer.org</a> produced a keepsake booklet for <a href="http://www.typecon.com/" rel="nofollow">TypeCon2005</a>, featuring exclusive pre-release reviews by <a href="/wiki/Yves%20Peters" class="freelinking" rel="nofollow">Yves Peters</a> (Bald Condensed) of 11 new type designs. Each of those are designed with the actual typefaces, so you see the fonts in use as you read the reviews. The signed and numbered collector’s item — produced in a limited edition of 200 copies, with a cover designed and silk-screened by <a href="/wiki/David%20John%20Earls" class="freelinking" rel="nofollow">David John Earls</a> — were distributed at the conference.</p>
    <p>Number 200 travelled to New York City and Helsinki, and then all over Europe to collect the signatures of all the type designers who participated in this project. The names featured on its front page range from young up-and-comers to card carrying type design celebrities: Stefan Hattenbach, Jean François Porchez, Tomáš Brousil, Nick Shinn, {ths}, Rian Hughes, Randy Jones, Mark Simonson, Peter Bil’ak, Eduardo Manso and David Berlow.</p>
    <p>The money raised by this auction will be split in half and donated to both the <a href="/wiki/SOTA" class="freelinking" rel="nofollow">SOTA</a> and <a href="/wiki/ATypI" class="freelinking" rel="nofollow">ATypI</a> organisations. The auction ends on Christmas Eve.</p>
    <p>Description of contents on <a href="http://typographi.com/001024.php" rel="nofollow">Typographica</a>.</p>
    <p>Picture in <a href="http://typophile.com/node/16039" rel="nofollow">General Discussions thread</a>.</p>
    <p>Bid generously on <a href="http://cgi.benl.ebay.be/ws/eBayISAPI.dll?ViewItem&amp;item=6589225869" rel="nofollow">eBay</a>.</p>
