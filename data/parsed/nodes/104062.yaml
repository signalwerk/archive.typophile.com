    html: |-
      <p>As for the A with the "v" shaped crossbar, it was used in the 19th century for various fonts* but did not have a specific name. In his patent for a font with this feature in 1881 Heyer merely said that the cross-line was "bent down in the center."  It's most familar use in modern fonts is for heavy decorated fonts such as Algerian and Gold Fever.<br>
      I like this font as an elegant and restrained design which should be effective for formal communication with a touch of individuality. Unfortunately, I don't recognize it.</p>
      <p>Don<br>
      *list available on request.</p>
