    html: |-
      <p>You're both correct, the original Palatino and the Windows shipping Palatino Linotype both include old-style figures and small caps (I use the latter regularly). The problem is they only come in their regular and bold weights. Every Medium weight I've come across so far has only ever included the default lining figures. This is what I'm after.</p>
      <p>My own attempt in Illustrator was actually done by average the regular and bold weighted versions. Probably a major typography no-no! Of course this makes the hunt for a legitimate copy even more important! :D</p>
