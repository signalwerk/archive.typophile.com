    <p>Just wondering if there is any foundry that produces Palatino (or a close enough typeface that could masquerade as it) in a medium weight and includes old-style figures (and preferably true small caps)?</p>
    <p>I require them for a few samples of light on dark text. I have actually created my own versions of the figures in Illustrator, but have never created a font before and don't want to put in all the work for this project if I don't have to.</p>
    <p>Thanks!</p>
    <p>Edit: I'm guessing Palatino nova will be the closest find, any others?</p>
