    html: |-
      <p>If I was preparing your second image to redraw in Illustrator I would rotate the scan clockwise to help keep more of the bezier handles on the vertical and horizontal. I would suggest that your S is rather wide, adjusting it will mean your last flourish will also have to be amended. I would also look at the usual stresses of the middle of an S.<br>
      Tim</p>
