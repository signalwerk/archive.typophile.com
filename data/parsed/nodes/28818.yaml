    html: |-
      <p>You will need thicker strokes on the U’s, C and B. I would also look at a narrower B and broader Fs and Ts. You might also add some overshoot on the curved letters. This might give you some direction for the S middle stroke, think of it as drawing it with a broad nib.<br>
      <a href="http://www.myfonts.com/fonts/urw/britannic/">http://www.myfonts.com/fonts/urw/britannic/</a></p>
      <p>Tim</p>
