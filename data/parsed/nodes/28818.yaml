    <p>Hey Typophiles,</p>
    <p>So I am working on a treatment for a high-scale catering company and just did some quick sketches  (well not so quick for me…)</p>
    <p>Here is the question: should I use existing fonts and then apply the ornaments or try to draw cleaner versions and then trace in illustrator….</p>
    <p>I think for sure i’ll have to trace the ornaments in illustrator, but what about the fonts? should I use existing ones? any recommendations? </p>
    <p>Any other suggestions or feedback are appreciated…</p>
    <p>* I am not lazy, it’s just my caligraphic skills are very poor…. **</p>
    <p>Thanks so much!!<br>
    -p</p>
