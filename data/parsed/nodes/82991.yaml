  html: |-
    <p>So I just read in Bringhurst's <em>Elements</em> that <a href="http://www.retinart.net/wp-content/uploads/media/images/marksunknown/marks_hedera.gif" title="See an example" rel="nofollow">the hedera</a> is one of the oldest typographic ornaments, "present in early Greek inscriptions" (p. 311).</p>
    <p>By any chance, can anyone point me to a photo of the hedera in one of these ancient Greek inscriptions? I would love to see it's use in the wild.</p>
