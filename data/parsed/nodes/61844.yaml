    html: |-
      <p>Alright, here is how it goes: You definetly need <strong>emWin: FontConverter</strong> which costs ridiciously $2,750.00. Finally i installed a Windows on my iMac with <em>VirtualBox</em>. In that environment i edited the Unicodes i needed in FontConverter and copy/pasted the previously generated characters in a text editor (if you are not very careful with the correct coding you easily mess the file up). The whole thing is about getting a .c file that can be read out properly on displays. </p>
      <p>{ /* code 0041 */<br>
        _XXX____,<br>
        X___X___,<br>
        X___X___,<br>
        XXXXX___,<br>
        X___X___,<br>
        X___X___,<br>
        ________,<br>
        ________};</p>
