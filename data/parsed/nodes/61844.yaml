    <p>Hello Everybody,<br>
    i need to open, edit and save font file formats with the suffix “<strong>.c</strong>”.<br>
    They seem to have been generated with <strong>FontConverter</strong> on PC.<br>
    The Apps <em>FontFlasher, TransType</em>  and even <em>BitFonter</em> DEMOs couldn’t open this file format in OSX. Is there any chance/program i can work with these font files under OSX at all, or do i need to get a PC?<br>
    Thanks for any hint in advance,<br>
    Jum</p>
