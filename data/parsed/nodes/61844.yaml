    html: <p>Is there a chance that someone accidentally renamed the document format? I've found sometimes that changing the format suffix can make the file workable (or at least when it comes to .tif, .jpg, .pdf, etc). Try duplicating the file, and renaming the suffix to a common format, and it may magically work. I've never heard of a single character format suffix.</p>
