    <p>Being that it doesn’t rain enough over here, and being that said celestial aqua clearly has some impact on quality font development (how else to explain that Adobe and MS live there?) I’ve decided to take a trip up to Seattle, imminently. Actually my reasons are largely non-typographic, but of course any significant travel calls for the rousing of the local font freaks, so I’m hoping that some of you... Seattlenos are game. I will be free* at least this coming Friday night, probably Sunday morning, as well as possibly late Saturday night. And just maybe Thursday night, if you promise not to overly frighten the non—type-geeks (non-type—geeks?) I’ll be hanging out with at that time. Right. As you were.</p>
    <p>* Requisite asterisk.</p>
    <p>hhp</p>
