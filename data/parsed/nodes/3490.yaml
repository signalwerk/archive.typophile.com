  html: <p> I’m trying to comp something with <span class="caps">MS</span> Sans Serif, but I’m working on a Mac.  I’ve looked everywhere, but can’t seem to ﬁnd a reliable conversion (most screw up the kerning excessively).   <br><br>It doesn’t need to be an *exact* match, but does anyone have a Mac version that’s close? <br><br>Thanks in&nbsp;advance…. </p>
