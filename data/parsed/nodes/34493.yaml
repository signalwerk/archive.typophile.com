    <p>Hi,</p>
    <p>here goes another rookie question, hope it doesn´t sound silly :)</p>
    <p>I was wondering if there is a good and longer dummy text to use in font samples like "Humburgefonstiv" or "lorem ipsum..." that i could use in print samples, to test vertical/horizontal spacing and character proportions.</p>
    <p>If anyone could point me out a good one, it would be great</p>
    <p>thanks in advance<br>
    regards</p>
