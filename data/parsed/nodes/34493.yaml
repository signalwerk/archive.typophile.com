    html: |-
      <p>There is this method by Walter Tracy, for determining the sidebearings and also testing it afterwards. It was published in the book <em>Letters of Credit: A View of Type Design.</em> Emil Ruder also used a similar method, published in the book <em>Typography, a Textbook of Design.</em><br>
      They are both also in <em>Designing Type</em> by Karen Cheng. Very useful for testing especially horizontal spacing.<br>
      Miguel Sousa made  <a href="http://www.adhesiontext.com/" rel="nofollow">Adhesiontext</a>, which generates dummy text with a given string of characters. Can also be of use.</p>
    html_clean: |-
