    html: <p>Hi, <br> <br>I found out that this was just a Quark 6 problem. Actually, Font book and Suitcase were okay (the ligs just weren't in the sample text shown)  <br> <br>It's still a problem in Quark 6--but not the OS. Hope that helps!</p>
