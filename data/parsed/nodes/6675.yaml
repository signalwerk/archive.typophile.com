    html: <p>I'm having this same problem with Freehand MX and Spectrum Expert. The ligatures within the "regular" font show up fine, but ff, ffl, and ffi don't show up. InDesign shows them just fine. <br> <br>I'm also using Mac OS 10.3.5.</p>
