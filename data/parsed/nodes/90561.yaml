    <p>Adobe Opentype Univers has some dodgy Ligatures when set to metrics – see the "f T"</p>
    <p><a href="http://store2.adobe.com/cfusion/store/html/index.cfm?pid=930349&amp;code=1272&amp;store=OLS-UK&amp;nr=0&amp;event=displayFontPackage&amp;newsample=of+Tex&amp;view=View" title="http://store2.adobe.com/cfusion/store/html/index.cfm?pid=930349&amp;code=1272&amp;store=OLS-UK&amp;nr=0&amp;event=displayFontPackage&amp;newsample=of+Tex&amp;view=View">http://store2.adobe.com/cfusion/store/html/index.cfm?pid=930349&amp;code=127...</a></p>
    <p>The inverted quote marks seem to be off too. They look fine set to Optical kerning, but I wouldn't want to use that setting for text?</p>
    <p>Any ideas what's going on? Think it has something to do with opentype?</p>
    <p>Help greatly appreciated.</p>
    <p>Stephen</p>
