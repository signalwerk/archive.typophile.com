    html: |-
      <p>POC:<br>
      lookup kern1 {<br>
          pos \s  \f' 200 \t' 100 \period ;<br>
      } kern1;<br>
      feature kern {<br>
        script DFLT;<br>
           language dflt ;<br>
            lookup kern1;<br>
      } kern;<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Font_3424.jpg"></div><br>
      Update: "start" and "end" groups aren't mandatory. You can do something like this:<br>
      pos \a' &lt;100 0 200 0&gt; \b' &lt;100 0 200 0&gt; \c' &lt;100 0 200 0&gt; \d' &lt;100 0 200 0&gt;;<br>
      at every occurrence of the string "abcd" the letters "a b c d" are extra spaced (in this example no matter what is before and after).<br>
      (tested in FireFox 14.0.1; pair kerning is still additive)<p></p>
