  - id: 500519
    user: 5094
    date: 2012-03-20T19:23:00
    date_raw: 20 Mar 2012 — 7:23pm
    votes: null
    html: |-
      <p><cite>I might not be getting something here, but this doesn't need a fancy three-letter super kern if the 2 pairs are present... This kind of thing is precisely why I'd argue it's a Good Idea™ to kern things like f/space and space/T. </cite></p>
      <p>It's a bad idea. If you're going to use kerns with spaces, as Nick says, you need three letters. You can never anticipate what will fall together. One of my test words in my test-text checks "f_space_J" as with "of Jewish" You use a pull-back kerning with the f, and the space can disappear.</p>
      <p>Or look at Adobe Jenson, with the f_space _quotedblleft. Again, the space disappears -- really, it usually looks like it falls after the qutedblleft...</p>
      <p>Better to use an alternate f when followed by a space. Take part of the space out of terminal of the f, and add a little to the sidebearing.</p>
      <p>A lot also depends on how tightly you set type. If it's set as tightly as Kinross's books, you'll find all sorts of oddities with the spaceband. In Hochuli's book, <cite>Detail in Typography</cite>, he argues for a certain generosity with the sidebearing space around parenthesis, quote marks, brackets, etc. (p.  37) . Good point. But with tight setting, you'll find that space sometimes greater than the wordspace. There isn't an example in the text of <cite>DT</cite>, but you can find plenty in Dowding's <cite>Finer points</cite>.</p>
      <p>Remember, back in the days of foundry type, the comp just didn't add space -- or as much space, when optical considerations were made, when driving out the line to justify. To get a computer do have the same effect is a lot of work. If it's ever published, I spent a good bit of time on this in my chapter of Rich Hendel's new book. Everyone is encouraged to buy a copy (Shameles plug) (Hey, Kent has a chapter in it, too)  (if it's ever published). (Except Hrant, who insists he'll get it from the library.) (And no, I get no royalties -- it's Rich's book).</p>
    html_clean: |-
