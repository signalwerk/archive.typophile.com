    html: |-
      <p>Bill, you didn’t show the setting with no kerning.<br>
      My preference for historic designs is with historic kerning (if not set with “original” instruments!)<br>
      For instance, I see no reason to kern T-a quite so much as you have — there is plenty of space between A and T, and T and w, so that a larger space between T and a would not look out of place, and those letters would not suffer the forced proximity caused by the prominent serif of T, the design of which mitigates gappiness in the first place.</p>
      <p>By the same token, I prefer h&amp;js with no adjustment to letterspacing.</p>
      <p>This wasn’t always my preference, no doubt it is an acquired taste.</p>
