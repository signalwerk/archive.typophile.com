      <p>I like Bill's solution.</p>
      <p>I also note that there are some OpenType engines that break the glyph run (the unit of OpenType feature processing) at the space. In these engines, layout that requires something like 'calt' to work across spaces won't work.  :(  Presumably kerning triplets across spaces won't work in these either.</p>
      <p>Two environments I know have this limitation are Adobe Flash and Mozilla Firefox.</p>
