    html: |-
      <p>In #3, the f T is not bad, but you have to turn off the left kerning only, which I don't think you can do, or at least without using CALT and an alternatively kerned T. The A T in #3 is a little too wide—there the negative kerning of the space T in the top line shows to advantage. So to me the top is still the best of these. </p>
      <p>There may be a still better way to do this, but my main point is that #2 is a problem. And you are going to get that with a long-nosed f and if you do negative kerning of space T and do no CALT tricks. I think there is a minor word image or 'bouma' problem when you get something like the middle situation. That's because you might have to look twice—your eyes have to regress—to distinguish the two words.</p>
      <p>I don't think any of this is a big problem, but I think there is a slight gain in readability if you avoid the middle situation.</p>
