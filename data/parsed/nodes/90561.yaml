    html: |-
      <p>I don't agree, Hrant. I think it is preferable to keep the word spaces uniform looking, and I'm supposing you agree. Violation of that was what disturbed Stephen K, who started this thread. </p>
      <p>The original of Caslon does have a very long-nosed f, and I preserved that as the default, as I liked it. I tested all of the options, and it looked to me best to slightly shorten the nose before a space; I also extended the crossbar a bit to the right, so there is less of a 'hole' before the space. </p>
      <p>The hole under the T is why it is preferable to kern it with a space before. But then you really get into trouble with an 'f' before. So that has a still shorter nose substituted. If I have time I'll put up a picture later...</p>
