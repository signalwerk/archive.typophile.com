    votes: null
    html: |-
      <p>Hrant: 'what happens to regular (double) kern values that might also be specified?'</p>
      <p>"Contextual positioning rules must be in a different lookup than pair positioning rules, since the rules are of different lookup types. Because each lookup is applied independently of the other lookup(s) over the entire text stream, the positioning change specified in a pair kerning rule will be added to the positioning change specified in a contextual kerning rule, whenever the two rules match the same glyph pair in the text stream."<br>
      [ <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#6.h" title="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#6.h">http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.htm...</a> ]</p>
      <p>Hrant: 'In a triplet, is the value applied between the last two?'<br>
      examples from cited site:<br>
      <code>position quoteleft T' &lt;0 0 20 0 &gt; quoteright;</code><br>
      This form shows a full value record which allows you to alter both the (x,y) coordinates of the origin and the (x,y) coordinates of the advance width. So in this example the advance width of "T" will increase by 20 (the origin remain unaltered).</p>
      <p><code>position quoteleft T' 20 quoteright;</code><br>
      The simple form of the value record which specifies a value for only a change to the (x) value of the advance width."<br>
      So it is your choice: you can shift the glyph and/or change its advance width.</p>
      <p>And the Contextual Kerning is not limited to two or three glyphs:<br>
      <code>position s f' 10 t period;</code></p>
    html_clean: |-
