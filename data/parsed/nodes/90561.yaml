    html: |-
      <p>HaHa! Got it! You can do it with probably many glyphs/classes, as far as you keep them in three groups and one glyph/class (middle) is affected:<br>
      <code>pos o f space' T w o 300;</code><br>
      or even more than one glyph/class:<br>
      <code>position s f'10 t' -5 period;</code><br>
      where in sequence s-f-t-. the x-advance of f is increased by 10, and the x-advance of t is decreased by 5.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/kern19_4762.jpg"></div><br>
      The upper text matches the rule, the lower not, so only first space is wider.<br>
      [support in AFDKO added Jan 2009]<p></p>
      <p>[edit]<br>
      "pos o f space' T w o 300;" is not correct, at least now. It ought to be:<br>
      position f o space' 300 T w o;</p>
