    html: <p>I might not be getting something here, but this doesn't need a fancy three-letter super kern if the 2 pairs are present... This kind of thing is precisely why I'd argue it's a Good Idea™ to kern things like f/space and space/T. And maybe Q/space and space/J, depending on the design. Overhanging glyph parts that optically diminish the space. Even if an f/space combination isn't met with yet another overhanging thing on the other side of the space (a not-too-unlikely worst-case scenario), it can still optically make the space appear smaller than it should be.</p>
