      <p>LL Circular works great, but it’s the choice of NYT Sunday Magazine (after all Lyon is commissioned by NYT Sunday). If you don’t mind using the same style as a magazine that is read by millions of people, use it.</p>
      <p>Lyon is modern, humble, scientifically apt, elegant and legible. It has a certain style and asserts a statement that is not so strong. So you could either go with plain Neo-Grotesks to knock it down (LL Circular/Akkurat/Brown/) or go with warm humanists to honor its style (Scala Sans/Kievit/Whitney/Mercury/Ideal Sans). Or you could even risk some slab serifs like Chaparral or well-done Clarendons like Sentinel.</p>
