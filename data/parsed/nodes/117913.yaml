    <p>Hey all, I'm currently revamping the typography for a text-heavy site. It's currently using Freight Sans and Freight Text, which are nice fonts but Text has some readability issues and Sans' style isn't exactly what I'm looking for—it's a bit too 'whimsical':</p>
    <p><img src="http://i.imgur.com/XUYGFjn.png"></p>
    <p>I'm looking to replace it with <a class="freelinking external" href="http://carvalho-bernau.com/lyon/" rel="nofollow">Lyon Text</a>, which is a very clean and readable serif:</p>
    <p><img src="http://i.imgur.com/7J3ykxM.gif"></p>
    <p>I'm not sure, however, about what typeface (sans-serif, preferably) to pair this with. Helvetica Neue used to be a go-to, but it looks rather generic now. The designer of Lyon has an anonymous-feeling Grotesk named <a class="freelinking external" href="http://carvalho-bernau.com/atlas/" rel="nofollow">Atlas</a> that looks interesting, and other options like <a href="/wiki/https%3A/%252Fcommercialtype.com/typefaces/graphik" class="freelinking" rel="nofollow">Graphik</a> are catching my eye as well.</p>
    <p>I'm looking for a modern, slightly 'opinionated' but mostly neutral sans-serif face that is pretty versatile, that would match well with the clean-cut face of Lyon. I'd appreciate some help on this front—thanks in advance for your suggestions.</p>
