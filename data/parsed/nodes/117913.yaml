      <p>If you want something a bit more neutral, the designer of Lyon has also made a font for that: <a href="https://www.typotheque.com/fonts/neutral" title="https://www.typotheque.com/fonts/neutral">https://www.typotheque.com/fonts/neutral</a><br>
      I think it has a bit more character than Helvetica (and most importantly, isn’t Helvetica) but is more quiet than others mentioned in this thread – most of which (LL Circular, Graphik, LL Brown, maybe also Founders Grot) I would find too constructed and cold to pair with a clean but still warm/“bookish” font like Lyon.</p>
