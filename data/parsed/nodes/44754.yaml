  html: <p>hi everyone. forgive me if i am missing a thread that would have answered this question already, but i am designing a series of brochures for a church arts camp. the camp is designed for children ages 5-11 and they will be doing photography, clay,  painting, and theater. i'm looking for a font that is fun, but not one of those sloppy "looks-like-a-kid-drew-it" ones. ideas? favorites?</p>
