      <p>you mentioned you wanted a;</p>
      <p>"sloppy “looks-like-a-kid-drew-it” ones."????</p>
      <p>This is possibly in the worst genre of typefaces ever to be created.</p>
      <p>My advise is to keep away fro any fonts along these lines. They're all disgusting.</p>
      <p>If you want that sloppy look, write the word yourself and scan it in, that would hold so much more purpose, and look way better.</p>
