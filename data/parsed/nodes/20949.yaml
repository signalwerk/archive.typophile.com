    html: <p>I agree that it is perfectly fair to show work you’ve done while employed, as long as you’re clear what your role was in the project (i.e. not taking creative credit for someone else’s work) and who the client was.</p>
    html_clean: <p>I agree that it is perfectly fair to show work you’ve done while employed, as long as you’re clear what your role was in the project (i.e. not taking creative credit for someone else’s work) and who the client was.</p>
