      <p>It really depends on the company, the clients, the nature of the work. I’m in book publishing and it’s totally ok to take credit for books designed - in fact the books carry a credit. But I know that isn’t the case with other types of clients.</p>
      <p>Good luck with your own business. Striking out on my own was the best decision I’ve ever made for myself but I gotta warn you, while you may not have to deal with interoffice powerplays and politics you get a whole other set of issues and you have to make nicey nice to a lot of people you wish you could tell to eat s**t. Unless you hire an assistant for that...</p>
