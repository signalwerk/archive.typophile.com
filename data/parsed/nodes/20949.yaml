    html: |-
      <p>I work for both my own clients and as a subcontractor for advertising agencies. If I have a meeting with a potential client I show in addition of work for my own clients, some of the subcontracted work (unless forbidden, like with medical companies), and always state both my client and their client and what my part in the project was. I also try to avoid any conflict with my agency clients, i.e. I won’t steal their customers.</p>
      <p>If you were to look for a new job, you would show work you’ve done whilst working for your current employer. I don’t think setting up your own company is much different a situation.</p>
