      <p>If the work has been produced and used by the client(s), then it is no longer under lock and key. Meaning it’s safe to show publically without ruining any marketing plans or strategies.</p>
      <p>With that said, you should be okay to use work you’ve produced even if it’s from another company you worked for. So long as you provide credits to the company and the creative/art director, you should probably be safe.</p>
      <p>Like others have said, oftentimes it’s a good idea to consult a lawyer about these things.</p>
      <p>+<br>
      Ryan Ford</p>
