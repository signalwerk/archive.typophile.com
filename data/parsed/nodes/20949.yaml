    <p>Hi there. </p>
    <p>I am not sure if something like this has been posted before, I dont think so so here goes.</p>
    <p>I have been working as a graphic designer for around 7 years now and although the job I have is secure and brings in some good clients, due to the size of the company and the clients it has the creative part can be very frustrating. To cut a long story short, which I am sure many of you are aware of, projects can easily become more about the politics and strategic grounding behind a project which can sometimes lead to the creative part becomming less important. </p>
    <p>I am now thinking of trying to set up something of my own and although I know what this entails and what hard work, but worth while work it can be there is one thing that I am a little unsure of. </p>
    <p>I have always been employed by someone and although I have done many freelance projects along the way, most of my work has been done whilst employed.</p>
    <p>My question is, is when I create my folio for my future company is it ok to use the work I have done whilst employed, as long as I credit it to the company I was with at the time. </p>
    <p>Has anyone else been in this situation in the past whilst setting their own company up and if so how did you go about it?</p>
    <p>Matt</p>
