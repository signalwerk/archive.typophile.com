    <p>I've heard you guys are the best for this kinda stuff, been looking on databases for hours to no avail so this is kinda my last resort...</p>
    <p>Anyhow, I'm trying to identify the font that was used in Nike's "Challenge Court" line of clothing logo back in the 90's (it was Andre Agassi's stuff).</p>
    <p>Here's a reference picture from one of my tees:</p>
    <p><a href="http://img856.imageshack.us/img856/4688/challengecourtfont.png">http://img856.imageshack.us/img856/4688/challengecourtfont.png</a></p>
    <p><img src="/sites/default/files/old-images/ChallengeCourtfont_5536.PNG"></p>
    <p>The font is approximately from 1991~1992 and looks an awful lot like the "Silhouette LP" one, however the "R" and "N" don't quite match seeing as the former's gotten a sort of upper-left serif and the latter is completely different.</p>
