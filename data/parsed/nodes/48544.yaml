    html: |-
      <p>Craig</p>
      <p>I think the melding of letter arts, from the calligraphic to the typographic (and everything in between), has created a bit of conflict in terminology.</p>
      <p>As Graham, above, and many of my peers in the calligraphic field will attest, minuscule and majuscule are the accepted terms in our field (whether it is correct or not by French standards [talk to the British... their calligraphic books over the last century are replete with these references]). Caps and lowercase are used by us when the conversation turns to type (I would say those terms are antiquated but I don't want to see what they come up with to replace them). As to the hand-drawn issue it is as futile as the argument about whether calligraphy is art or craft. In my work and the majority of others our type IS hand drawn, it has just made the transition from paper and ink to digital form.I often see the term hand drawn lettering on this site. That is redundant. I also see the term lettering applied to buildings, typefaces used in titling etc. That is sign painting or whatever it is called these days and the other is type, pure and simple.</p>
      <p>As to your contention that hand drawn... I agree with you. I think it is, in essence, a useless and ill informed modifier. At some stage it may have been lettering but by the time it is in digital form it is type, as long as they are repeatable forms and not a scanned title.</p>
      <p>I giggle at the term glyph. To me it has, and will always be, a carved form whether it is in stone or clay (from the Greek, glyphein, to carve). I will continue to create letters or characters in my fonts.</p>
      <p>Not a scholar but this stuff bothers me.</p>
      <p>Michael, One of those John Does</p>
