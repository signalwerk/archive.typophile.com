      <p>My point in showing the Dwiggins example was to pose a counterargument to James's contention that "hand-drawn typography" is a useless term. I think it's potentially useful for describing hand-drawn illustrations that mimic typography, which is how my eyes see Dwiggins's work. I think it's an especially interesting case, because it reverses the usual type-designers-emulating-lettering process.</p>
