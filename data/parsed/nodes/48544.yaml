      <p>In English at least, "capital" came from the "head" of the words, predating printing cases - OED cites a 14th-century Chaucer use of "lettres capitals."</p>
      <p>According to the OED, looks like within typography "capital" and "majuscule" are interchangeable, but within paleography capital letters are a subset of majuscule letters, which would also include large uncials.</p>
