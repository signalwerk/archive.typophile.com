    html: |-
      <p>Majuscule/minuscule may sound a little pretentious when used for describing plain upper- and lowercase in printed running text.<br>
      But when it comes to non-typographic letters, be it lettering or writing, the terms UC and lc are just inappropriate, imho.</p>
      <p>You could use ‘cap(ital)s’, too. More prevalent. I don’t know if there’s such a generally valid equivalent for the ‘small’ letters in English.<br>
      In German, there’s ‘die Versalie’ vs. ‘der Gemeine’ (‘the common’, latter mostly used in plural form). ‘Klein- und Großbuchstaben’ are the most widely used terms – but they’re not very adept. ;-)<br>
      F</p>
