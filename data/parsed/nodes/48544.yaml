    html: |-
      <p>Hello there</p>
      <p>I am not absolutely aware of any english-specific use of these words, but being french myself, I have to say that there is a huge difference between a "capitale" and a "majuscule": a majuscule is the first capital letter of a word (at the beginning of a sentence, in a family name, etc) - and that's it, period. To name every other capital letter in a sentence a majuscule is basically a mistake. Don't worry though: 99,9 % of John Does out there are making this mistake. Only the die-hard typophiles know about that... And that's a shame. In french typography, we also use the term "bas de casse" to describe a minuscule, for these were placed (as you know) at the bottom of the typographer's furniture (the "casse", "case" in english). The word "capitale" comes from the fact that these letters were placed at the top of the furniture, metaphorically called the "head", in latin: "capitalis".</p>
      <p>This being said, I think that the use of "uppercase" and "lowercase" is strongly inappropriate since the disappearing of the case. As a typophile, I'd rather use "capital", "majuscule" and "minuscule" when I speak (in english) with someone who has a minimum typographic knowledge.</p>
      <p>Hope I brought some interesting info here,<br>
      dr</p>
