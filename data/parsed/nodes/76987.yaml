    <p>Hey again everyone!</p>
    <p>I am back with a logo for a renewable energy agency wich sells solar panels and other sustainable energy systems.<br>
    The logo must convey the message that we're talking about ENERGY. As you can see down, the logo has a hidden "energy spine".<br>
    The problem is that the company name is ECO, but in the logo with the switched "C" position to create the hidden spine you read "EDO".</p>
    <p><a href="http://img508.imageshack.us/img508/9362/ecologo.png" title="http://img508.imageshack.us/img508/9362/ecologo.png">http://img508.imageshack.us/img508/9362/ecologo.png</a></p>
    <p>How could I solve this legibility problem, make it more clear that it's a reversed "C" and not a "D"?  I tried them all and I'm quite stucked now on this one</p>
    <p>Thank you very much,</p>
    <p>Pierluigi</p>
