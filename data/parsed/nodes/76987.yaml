      <p>I can clearly see the electrical plug and I think you have ended up with some clumsy letters just to keep the plug so obvious. The middle bar of E is too heavy &amp; even if that C was the right way round it needs a closer relationship with the O.</p>
      <p>Try versions where the C itself is the body of the plug, rather than just the counter. You might then be able to do that with the C the right way round.</p>
      <p>Another thought is have the C the right way round but with two slices through the left so C's counter is the plug and E is the socket. It might be going a bit too far with the imagery, but you could have something sun-like going on with O's counter, a little slice through its left side to be a cable going to C.</p>
