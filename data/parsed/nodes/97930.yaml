      <p>Here's what I submitted:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2012-11-13 at 10_6519.02.18 AM.png"></div><p></p>
      <p>And here's what I said:<br>
      I had the great fortune of living in New York City this past summer while I studied type at Cooper Union's Type@Cooper program. Like many people, the city is full of my friends and family. When I think about Hurricane Sandy, I am brought to the idea of 'balance.' It has affected the balance of so many people's lives and daily routines. And, the hurricane itself was brought on by a great imbalance in our climate. Many of those affected will return to their 'normal' quickly, while others will have to find a completely new balance. My asterisk was based off of an 'unbalanced' rectangle, repeated 6 times.</p>
