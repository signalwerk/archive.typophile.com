    html: |-
      <p>My contribution:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/MLA_DisAsterRisk_6127.jpg"></div> *DisAsterRisk*<p></p>
      <p>Right-wing ideology and its aggressive defence of capitalist modes of production are complicit in the systemic cause of climate change. Indeed, these regimes are not only contributing to the increase and amplification of natural disasters, but seek to profit from them also. However, these actions have made explicit the hierarchical structures, and so provide an opportunity to challenge and transform their destructive modes of production and distribution.</p>
      <p>My contribution represents the manner in which certain forces tear structures apart but in so doing enable new allegiances to form. That is, a situation which is presented as singular is shown to be multiple. However, this multiplicity is a series of differences that share certain commonalities. A duality is revealed. Arrows can be discerned in the design – a clash between a collectivised left and a individualistic right that confront each other in an agonistic struggle over how society is governed.</p>
      <p>In their abstraction, the dots can also be understood as representations of communication technologies, and computational ones in particular. For the binary background presents a dramatic change in how politics is practiced and introduces new techniques for profiteering (e.g. high-frequency trading).</p>
    html_clean: |-
