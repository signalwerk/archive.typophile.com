    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fontaid-vi-horizontal-500x120_6522.gif"></div><p></p>
    <p>The Society of Typographic Aficionados is organizing <a href="http://typesociety.org/fontaid/" rel="nofollow">Font Aid VI: Aster Affects</a> — a project uniting the typographic and design communities to raise funds for <a href="http://www.redcross.org/" rel="nofollow">Red Cross</a> relief efforts after the events of Hurricane Sandy.</p>
    <p>The project theme will be represented in a typeface consisting entirely of asterisks.</p>
    <p><strong>Why the asterisk?</strong></p>
    <p>An asterisk can denote something that requires attention — and an event of this magnitude and impact certainly deserves some attention. The asterisk can also provide *emphasis* to important information amidst fields of plain text. The root of the word comes from the Greek astēr or “star” - signifying hope and light. In computer terms, it’s a wildcard character … and hurricanes are certainly wild and unpredictable.</p>
    <p>This submission deadline is <strong>Saturday, November 17th, 2012</strong>.</p>
    <p>See the <a href="http://www.typesociety.org/fontaid/" rel="nofollow">submission guidelines</a> for more information.</p>
    <p>Thanks in advance for your help.</p>
    <p>— Grant</p>
