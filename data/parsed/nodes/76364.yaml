      <p>Rather than the operating system level, the font engine level should be possible through SIL's Graphite application.  The SignWriting data format works differently that other scripts, so it will require a significant investment to implement correctly.  Maybe in a few years.</p>
      <p>Application level is possible today with the current standards.  The script encoding model has been relatively stable for the past 5 years.  The symbol set has been improved and stabilized.  The character encoding model has been optimized for faster processing and smaller size.  All of our user generated data can be converted to the latest standards.  I believe the combination of the International SignWriting Alphabet 2010 along with Binary SignWriting revision 3 draft C will be the standard for years to come.</p>
      <p>The data can be stored as PUA Unicode on plane 15 or a custom hex string of equivalent or smaller size.  Here's a hex example of BSW 3C: _0fa_1eb_38d_392_15d_38d_39a_376_38c_392_0fc_79c_7be_2f7_38c_392_78c_7b7_15a_38d_39a_776_77f_1eb_38d_392_782_781_22b_38c_396_78a_797_30a_38c_392_778_753_353_38c_392_778_753</p>
      <p>I'll have the standards implemented in my application SignPuddle before the end of this year.  I'll have the standards fully documented and ready for early adopters by 2011 Q1.</p>
