      <p>The International SignWriting Alphabet 2010 is available under the Open Font License.  All of the glyphs of SignWriting organized in an HTML reference:<br>
      <a href="http://www.signbank.org/iswa" title="http://www.signbank.org/iswa">http://www.signbank.org/iswa</a> (view online)<br>
      <a href="http://www.signbank.org/iswa.zip" title="http://www.signbank.org/iswa.zip">http://www.signbank.org/iswa.zip</a> (download)</p>
      <p>The Unicode proposal is maturing nicely.  A 2 stage process will be used.  The first will encode the glyphs only and will ignore layout design.  Michael Everson has reviewed the proposal documents.  He believes he can help write a refined proposal and successfully present to the Unicode Consortium.  We're hoping to accomplish this in 2011.</p>
      <p>A rough draft of the general Unicode proposal is on my site:<br>
      <a href="http://www.signpuddle.net/mediawiki/index.php/Unicode" title="http://www.signpuddle.net/mediawiki/index.php/Unicode">http://www.signpuddle.net/mediawiki/index.php/Unicode</a></p>
      <p>The detailed encoding for each SignWriting symbol is documented:<br>
      <a href="http://signpuddle.net/sw_unicode/" title="http://signpuddle.net/sw_unicode/">http://signpuddle.net/sw_unicode/</a></p>
      <p>The second stage will propose characters needed for text layout and collation.  This proposal will have to wait until 2012.</p>
      <p>I am currently writing an Internet Draft for the ISWA 2010.  This will fully document the standard and include an appendix with my practical script encoding model called Binary SignWriting.<br>
      <a href="http://signpuddle.org/draft-slevinski-iswa-2010-00.html" title="http://signpuddle.org/draft-slevinski-iswa-2010-00.html">http://signpuddle.org/draft-slevinski-iswa-2010-00.html</a><br>
      <a href="http://signpuddle.org/draft-slevinski-iswa-2010-00.txt" title="http://signpuddle.org/draft-slevinski-iswa-2010-00.txt">http://signpuddle.org/draft-slevinski-iswa-2010-00.txt</a></p>
      <p>I'm currently converting SignPuddle Online from the ISWA 2008 to the ISWA 2010.  Then I'll finish the Internet Draft to document the standard.  Then I'll update the SignWriting Image Server GPL software:<br>
      <a href="http://www.signbank.org/swis" title="http://www.signbank.org/swis">http://www.signbank.org/swis</a></p>
      <p>So, we're making progress.  Almost off of the bleeding edge.</p>
