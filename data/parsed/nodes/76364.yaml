    <p>Hello gals et guys:</p>
    <p>As of recently I have been acquainting myself with persons of the deaf community. There is a real need to have hand sign fonts included with the operating system. I would like to know if these glyphs have been added to the Unicode repertoire. Windows? Mac OS X?</p>
    <p>Also, is there any progress on adding SignWriting to the Unicode specification and what can be done to speed its adoption. (I wonder if Sign Writing is copyrighted so that it cannot be designed by other developers)</p>
    <p>I would like understand more of the issue as it relates to design &amp; implementation from the perspective of the deaf, hearing, operating system and application programmers.</p>
    <p>Mike Diaz :-)</p>
