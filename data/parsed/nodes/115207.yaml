    <p>ReType Foundry proudly introduces Laski Slab, a comprehensive suite of 20 fonts conceived for editorial purposes. The type family was designed by Paula Mastrangelo, an Art Director with extensive experience in editorial design specialized in corporate communication. Originally developed for an online children’s magazine, Laski was expanded into a multipurpose type family with the technical assistance of Ramiro Espinoza.</p>
    <p>Belying the intrinsic robustness of the slab serif genre, Laski’s humanistic construction and subtle calligraphic details lend it a friendly appearance. Round, open letter forms and generous horizontal proportions make it easy to read. The regular weights perform impeccably in text sizes, while the bolder versions produce expressive and very effective subheadings and headlines. Two idiosyncratic stencil variants considerably expand Laski’s creative potential.</p>
    <p>Laski Slab is a suite of feature-rich OpenType fonts fully equipped to tackle complex, professional typography. The character set includes 5 sets of numerals, small caps, fractions, alternate characters and case-sensitive forms. Besides standard Latin its extensive character set supports Central European, Baltic and Turkish languages.</p>
    <p>Laski Slab received a “Certificate of Excellence” at the 2014 Tipos Latinos Biennale.</p>
    <p><a class="freelinking external" href="http://www.re-type.com" rel="nofollow">Visit Laski Slab at ReType</a></p>
