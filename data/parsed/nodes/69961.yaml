    <p>Hello Experts! :D</p>
    <p>I am working on a Journal of Science booklet and I am having some issues with some math equations. In their Word document they used Cambria Math to do their math equations. I have my body copy set in Adobe Garamond Pro. The math equations are not showing up. </p>
    <p>Is there anything out of the Adobe Library 11 that will map the same as Cambria Math. I don't have Cambria Math on my computer to substitute what I am currently using. </p>
    <p>Thanks for the help.</p>
