    html: |-
      <p>I like your idea of "famous fonts".</p>
      <p>By focusing on fonts that were honored and acclaimed (rather than just being used a lot), it narrows the field to fonts that were well-respected and discussed, and which had something of a story and aesthetic theory attached to them, and whose designers may even have been known by name, in the professional fields of graphic design and typography.</p>
      <p>It also means fonts that were used by typographers and designers to create layouts, not merely being used by readers (end-users).</p>
      <p>You may have to say something about fame vs. notoriety.<br>
      Certain typefaces which were much discussed were more vilified than respected, e.g. Souvenir, ITC Garamond, Comic Sans and Papyrus.</p>
      <p>Certainly Helvetica and Univers were central to design theory, as practised and taught in the late 20th century.<br>
      And Futura (although designed in the 1920s).</p>
      <p>That raises a good benchmark: did a typeface have a book written about it, or its designer?<br>
      (Renner, by Christopher Burke, centres on Futura).</p>
      <p>Some of the best-known typefaces were well-known because their foundries were great publicists, or because their designers were well-known.</p>
      <p>For instance, in the 1990s, Emigre magazine, published by Emigre foundry, was the focus of an intellectual movement, in which faces like Barry Deck's Template and Zuzana Lickpo's Matrix became iconic. Dead History was also quite famous, theoretically, although little used.</p>
      <p>Neville Brody's Industria was symbolic, in many ways, of design in the 1980s and 1990s, first as the face of the influential magazine he art directed (The Face), then as one of the most-used early DTP faces. "The Graphic Language of Neville Brody" was a best-selling graphic design book, further cementing the fame of Industria and its designer.</p>
      <p>Similarly, Avant Garde was famous because of the iconic (that word again), eponymous magazine, and its much-awarded designer, Herb Lubalin.</p>
      <p>And Meta, by Erik Spiekermann, perhaps owes something of its fame (quite apart from its popularity in use) to its designer's career and celebrity as a graphic designer, author, conference speaker, and founder of FontShop.</p>
