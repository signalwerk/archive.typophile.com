      <p>As there is no way to verify exactly the 10 (or 20, or 100) most used fonts, it's safer to say "10 of the most important and used fonts for this period". Trying to keep an eye in printed materials also from '60s, '70s and '80s, I think the list is:</p>
      <p>Times New Roman<br>
      Helvetica (Arial as a variant introduced with Windows dissemination)<br>
      Courier New<br>
      Palatino<br>
      Bookman<br>
      Souvenir<br>
      Futura<br>
      Frutiger<br>
      Copperplate Gothic<br>
      Garamond (in its many variations of weight and style)</p>
      <p>Other relevant ones: Century Schoolbook, Century OldStyle, Sabon, Commercial Script, Minion, Avant Garde, Brush Script, Caslon, Eras, Bembo, Gill Sans and Univers.</p>
      <p>(My perception is based on Latin America, US and UK printed materials.)</p>
