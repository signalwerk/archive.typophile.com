    html: <p>Georgia and Verdana are landmark typefaces, IMHO. These were a concerted effort to address mostly screen use, the Web, and across the board interoperability. Something out of the Emigre fold is also landmark. Add to that Garamond, Caslon, Bodoni, and Baskerville, which were all quite a bit older but workhorse types used for quite a bit.  Bodoni more for display than text. I would also add OCR, Times and Futura</p>
