      <p>Basic structure similar to Rockwell <a href="http://www.identifont.com/find?font=rockwell&amp;q=Go">http://www.identifont.com/find?font=rockwell&amp;q=Go</a> but there are significant differences in detail, not least of which is the big ball terminal on r -- an unusual feature in a slab serif.<br>
      Might be a bespoke font for the map company.<br>
      In any case, perhaps another font detective recognizes this one.<br>
      don</p>
