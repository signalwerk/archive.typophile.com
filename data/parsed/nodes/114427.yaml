      <p>Examining the fonts in the map pix, Adobe Reader identifies Arial and several unknowns. The main unknown has a flat top 3 [banker's 3] and other differences from Arial. Some of the other font detectives are much better than I am in recognizing modern sans serif fonts, so here is the subset of the Bold for them to demonstrate their superior font matching skills<br><img src="/sites/default/files/old-images/UnknownSansAirChart_6732.jpg"><br>
      As in the case of the serif I previously posted, this might be bespoke for the company.<br>
      Don</p>
