    <p>Hi All<br>
    I am trying to know which font is used on popular Jeppesen charts, used in aeronautical world</p>
    <p>Example for JFK Airport:</p>
    <p><a href="http://www.fly-sea.com/charts/KJFK.pdf">http://www.fly-sea.com/charts/KJFK.pdf</a></p>
    <p>I am looking for the font on the charts, not the one on the first 'general info' page.</p>
    <p>Another sample:</p>
    <p><a href="http://va-transaero.ru/files/charts/mhtg.pdf">http://va-transaero.ru/files/charts/mhtg.pdf</a></p>
    <p>Thanks for the help !</p>
    <p>Dave</p>
