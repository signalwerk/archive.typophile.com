      <p><em>there is an aesc, and also an ethel and eszett., but not a yogh. </em></p>
      <p>The yogh is old Latin / old medieval English. It looks like a 3 and some consider it a variant of the ezh. It has no Unicode number as far as I know and is encoded as an ezh — 0x01B7. For more info see Everson's remarks concerning it below.</p>
