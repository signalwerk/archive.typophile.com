      <p>Probably too late to be of any use to Percival, but here goes:</p>
      <p>The Greek text in the Penguin Milton's Complete Poems is something very like <a class="freelinking external" href="http://image.linotype.com/samples/hirespdf/9177.pdf" rel="nofollow">Linotype Baskerville Greek</a>, an upright, serifed Greek with a very roman feel to most of the letters (what is effectively an inverted ‘y’ standing in for lambda, for example). It has nothing - typographically - to do with the surrounding English and Latin text in Ehrhardt.</p>
      <p>The forms of the Old and Middle English characters thorn, yogh, and eth, often found in company with Monotype Ehrhardt in Oxford University Press books (and particularly in editions published by them for the Early English Text Society), are, as far as I am aware, custom sorts from outside the main font (Ehrhardt), inserted into the text when called for. Some confirmation that this is the case can be had by glancing at a book like Michael Lapidge's <a class="freelinking external" href="http://www.oup.com/uk/catalogue/?ci=9780198131830" rel="nofollow">The Cult of St Swithun</a>, (OUP, 2003), which, although set throughout in Monotype Bembo, uses versions of thorn and yogh in setting Middle English which are identical to those found alongside Ehrhardt elsewhere. </p>
      <p>As far as I'm aware, the only easily obtainable (for a considerable price, though you do get a dictionary thrown in) typefaces to contain these ‘signature’ OUP forms of thorn, eth, yogh (and also wyn and the insular flat-topped ‘g’) are those <a class="freelinking external" href="http://www.oup.co.uk/ep/cdroms/ors/" rel="nofollow">versions of Plantin bundled with the electronic version of the OED</a>.</p>
      <p>Another commercial font which contains yogh is Adobe <a class="freelinking external" href="http://store1.adobe.com/type/browser/pdfs/GRPP/GaramondPremrPro.pdf" rel="nofollow">Garamond Premier Pro</a>, which also contains thorn and eth (albeit these last two in their more rounded and familiar Icelandic forms). Free fonts containing these characters include SIL's <a class="freelinking external" href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium" rel="nofollow">Gentium</a> and <a class="freelinking external" href="http://junicode.sourceforge.net/" rel="nofollow">Peter Baker's Junicode</a>. This last is of particular interest, as it is intended entirely as a font for medievalists, and contains the distinctively insular versions of thorn, eth, yogh, wyn, &amp;c, which are not far removed from those found in OUP books.  </p>
      <p>Finally, it should be noted that yogh should no longer be subject to any typographical confusion with ezh (although a flat-topped ezh is still often used in scholarly editions to represent yogh). Unicode now encodes yogh separately at codes U+021C and U+021D.</p>
