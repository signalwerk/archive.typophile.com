    <p>Greetings.</p>
    <p>I was wondering whether anyone here has got the font Monotype Ehrhardt.  If so, may I ask where you got it, and whether your version has a full set of characters with diacritics and uncommon characters, especially characters no longer used for writing English (ash, thorn, eth, yogh)?  I have a few books that are in Monotype Ehrhardt that do include such characters, but I have seen no downloadable versions of this font that do.  Perhaps I have not looked hard or carefully enough, though.</p>
    <p>I also wonder whether there is a Monotype Ehrhardt font for the Greek alphabet, complete with breathings, accents and other diacritics as well as older Greek characters used as numbers (the digamma, for instance).  The Penguin Edition of John Milton’s Complete Poems uses Monotype Ehrhardt for Milton’s English, Italian and Latin poems, and uses what appears to be Monotype Ehrhardt Greek characters for Milton’s Greek poems.  This is probably my favourite Greek font.</p>
    <p>Any information would be much appreciated.</p>
  html_clean: |-
