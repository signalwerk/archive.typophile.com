      <p>Bowfinpw: The shape of the characters.  For certain capital-letter forms that both the Roman and Greek alphabets share (A, B, E, Z, H, I, K, M, N, O, P, T, Y), the Greek characters in my book look (to me) exactly like their Roman counterparts in Ehrhardt.  However, when I look now, I do see some small differences, so it may very well not be Ehrhardt at all.  If you like, I can scan a page and show it to you.</p>
      <p>The book states in its imprint that the book is set in Monotype Ehrhardt.  No other font is mentioned, so I assumed that the Greek characters were part of the same font.</p>
