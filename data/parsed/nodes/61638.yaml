  html: <p>Greater Albion Typefounders have just posted the first preview of their next release, Brosse on their <a class="freelinking external" href="http://gatf.wordpress.com/ "> blog</a>.  Brosse is a lively slabserif face that emphasises simple geometric curves.</p>
