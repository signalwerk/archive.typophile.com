      <p>Brosse is now released <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/brosse/overview.html "> here</a> on Myfonts.com.  </p>
      <p>A fully licensed, but reduced (in terms of character set) face is offered along with the eight other members of the family.  We've also posted some examples of Brosse in use on our <a class="freelinking external" href="http://gatf.wordpress.com "> blog</a>.</p>
