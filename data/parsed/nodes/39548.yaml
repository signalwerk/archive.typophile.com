    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 28.Nov.2007 3.43pm </div>
      <p>Greetings Friends!</p>
    <p>We’ve been super busy at the Font Diner these days getting ready for the holidays and jammin’ out some great new fonts for your consumption!</p>
    <p>Weather you prefer the ultra cool trumpet of Miles Davis or the smooth rhythms of Donald Fagan tickling the ivories, there is all kinds of amazing jazz to sink your teeth into! And what better way to celebrate it than with the latest in our signature font series, Fontdinerdotcom Jazz Light and Fontdinerdotcom Jazz Dark! Both unmistakably our own inspired by our own Fontdinerdotcom Loungy font and highly caffienated with a jumpy leaky fountain pen for added effect! So load up a stack of wax on the turntable and head on over to the Vend-O-Matic for some tasty licks at: <a href="http://www.fontdiner.com/silver.html" title="http://www.fontdiner.com/silver.html">http://www.fontdiner.com/silver.html</a></p>
    <p>If that weren’t enough to tempt you, you’ll have kittens when you see the newest commercial fonts we’ve created with our friend, talented lettering artist, illustrator, and fine art painter Sam Gambino! They’re called Blackcat and Blackcat Fever! These playful and spooky retro brush scripts were inspired by the creepy comic books of the 1950’s and they’re only available at Font Bros. Check ’em out here: <a href="http://www.fontbros.com/sideshow.php" title="http://www.fontbros.com/sideshow.php">http://www.fontbros.com/sideshow.php</a></p>
    <p>It seems you’ve also been busy and have helped us add a bunch of great new Homemade Specialties to the Diner so check out some specialties people have created using our fonts! If you’ve created some nice stuff using our fonts, let us know, we’d love to hear from you!</p>
    <p>All this plus plenty of news about our shiny new diner and our feature in a new book about vintage type!</p>
    <p>See you there: <a href="http://www.fontdiner.com" title="http://www.fontdiner.com">http://www.fontdiner.com</a></p>
    <p>Warmly,<br>
    Stuart :D</p>
