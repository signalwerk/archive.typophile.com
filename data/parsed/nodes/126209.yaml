  html: |-
    <p>The attached PNG is from a sanned page out of a Teletype (r) service manual that was originally printed in the 1930-1940s It is one of the pages that is a list of parts. The font is different then that used in the main body of the manual. My guess printed from punch cards, and if so could be IBM.<br>
    Unique attributes are for example the number 8 has a flat line at around 10 degrees from the top. The base of the numbers varies<br>
    The 1, 2, 6, 8, 0 are at the character base<br>
    The 3, 4, 5, 7, 9 descend below<br>
    Again the 8 is very unique</p>
    <p>The serif on the lower case y really stands out, and well as the lower case g<br>
    I don't think they match any of the fonts used by Teletype for their printers.</p>
    <p>-pete</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/font-id/V-10.png" width="1275" height="1648" alt="">
