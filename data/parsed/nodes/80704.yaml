    html: <p>i like riccard0's suggestion. currently they don't create a continuous feel. on the lines of riccard0's suggestion, wonder if you created space between conti---nuous and tied the 'i' and 'n' in someway. would that create the feeling of continuous i wonder. just a thought.</p>
