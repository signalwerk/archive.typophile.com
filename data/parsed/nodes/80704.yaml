    <p>Hey Typophiles, </p>
    <p>I'm after a some feedback on an identity I'm working on. </p>
    <p>It's for a Brand Identity / Design / Digital practice. </p>
    <p>I want the identity to be strong and simple. </p>
    <p>The direction I want to reference is minimalism / modernism / bauhaus / grids.  </p>
    <p>Keywords:<br>
    Approachable<br>
    First class business<br>
    Confident<br>
    Considered<br>
    Forward thinking<br>
    Creative problem solvers<br>
    Strategic in thought<br>
    Simple</p>
    <p>I've included an image below that has Competitors identities that I feel work in one way or another.<br>
    I'm leaning more towards the bold end (right) of the graph.  </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/continuousbrand_logo_competitors_6334.jpg"></div><p></p>
    <p>Here is the identity I've been working on. </p>
    <p>Any criticism is welcome!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/continuousbrand_logo_2_4913.jpg"></div><p></p>
