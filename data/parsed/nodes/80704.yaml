      <p>I like the second one best, but I'm reading "continvous". This is because you are trying to connect u to o and s from the top of the stem, but this is the conventional point for connecting from v. In some very rounded scripts that connection is the only thing to differentiate u from v.</p>
      <p>Also the connection from n to u in the second one does not work as well as that connection in 3 and 4.</p>
