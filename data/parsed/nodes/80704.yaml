    html: |-
      <p>1. All variants with interconnected letters don't work. I can relate them to some handy crafts business (stitch stuff). And it definitely doesn't work as an ad agency logo. The last one is very nice and clean but the connection between /co/ and /us/ should be removed. letters themselves are very nice, clean and I can relate them to advertising. Majority of agencies use simple and clean sans serifs.</p>
      <p>2. I second riccard0's idea. but instead of just connecting them with a sort of line or something you could use ellipsis which we relate (at least I do) to a pause and thinking.</p>
      <p>like: conti...nuous</p>
      <p>In general I like the idea of having simple and clean type with some kind of continuation. Think of things that pop up when you think of words: "continue", "continuation", etc. Maybe one of the associations will give you an idea of how to make the continuation in your logo.</p>
