    <p></p><div class="imageWrap"><img src="http://typophile.com/files/DynatypePushbutton_6391.png"></div><br>
    Alphabet Soup Type Founders and Michael Doret are proud to announce the release of “Dynatype” on MyFonts.<br>
    <div class="imageWrap"><img src="http://typophile.com/files/SuddenlyWorld_6534.png"></div><br>
    Suddenly...it’s the World of Tomorrow! With the push of a button Dynatype automates your typesetting experience. Dynatype is actually '''Two fonts in One'''–without switching fonts you can instantly change from Dynatype’s “regular” style to its alternate connecting version with the simple push of a button…just press the “Stylistic Alternates” button in the OpenType palette.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2in1_6410.png"></div><br>
    What is Dynatype? Dynatype is the upright, slightly more formal cousin of Dynascript [link]. It shares many of the characteristics of it’s slightly older relation, but is drawn entirely from scratch and has it’s own unique character.<br>
    <div class="imageWrap"><img src="http://typophile.com/files/Johnies-Sky1_4268.jpg"></div><br>
    To some these fonts may be reminiscent of various mid-century neon signage, and of sign writing, Speedball alphabets and even baseball scripts. The design of the Dyna-fonts also takes some cues from a historical typographic curiosity that began in Germany in the ‘20s and which lasted into the ‘60s—when Photo-Lettering gave it the name "Zip-Top". Basically it was believed to be the wave of the future—that by weighting an alphabet heavier in its top half, one could increase legibility and reading speed. The jury’s still out on whether or not there’s any validity to this notion, but I think you’ll agree that in the context of this design, the heavier weighting at the top of the letters helps to create some uniquely pleasing forms, and two unusual fonts.<br>
    <div class="imageWrap"><img src="http://typophile.com/files/Dynatype_Dynascript_6328.png"></div><br>
    Although Dynatype and Dynascript were originally intended to be released together as a two font family, it seemed to make more sense to give each of them their own name to avoid confusion.<br>
    <div class="imageWrap"><img src="http://typophile.com/files/Global-1_6512.png"></div><br>
    Typesetters across the planet will be able to set copy in their language of choice.<br>
    <div class="imageWrap"><img src="http://typophile.com/files/Dynat_ChSet_6585.png"></div><br>
    Dynatype’s 677 glyphs can be used to set copy in: Albanian, Basque, Catalan, Cornish, Croatian, Czech, Danish, Dutch, Esperanto, Estonian, Faroese, Finnish, French, Galician, German, Hungarian, Icelandic, Indonesian, Irish, Italian, Kalaallisut, Latvian, Lithuanian, Malay, Maltese, Manx, Norwegian Bokmål, Norwegian Nynorsk, Oromo, Polish, Portuguese, Slovak, Slovenian, Somali, Spanish, Swahili, Swedish, Turkish, and Welsh—and of course English. Sorry! Languages of the Lunar Colonies not yet supported.<br>
    <div class="imageWrap"><img src="http://typophile.com/files/DynaCopy-1_4260.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/DynaCopy-2_3433.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/OpeningDoor_4501.png"></div><br>
