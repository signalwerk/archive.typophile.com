    <p>I know Gill did display cuts of Gill Sans, and metal type in general (also sans serifs) had to be molded/drawn for specific sizes. Do any contemporary sans serifs take opticals sizes into account?</p>
    <p>I've been thinking about working it into an ongoing project – opening the letterforms, simplyfying details, adding inktraps and lowering the x-height for smaller sizes.</p>
