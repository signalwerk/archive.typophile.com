      <p>Many metal typefaces had an increased x-height in smaller sizes. In many of the examples I have studied the variation of the descender length is literally the only change that was made to the letter shapes.<br>
      The interesting thing is that in some cases the descenders are longer in large text sizes than they are in very small fonts but they get shorter again in the display sizes, having a maximum at around 14 pt or so. This makes sense, of course: making the x-height as big as possible in small sizes on one hand, and making the vertical proportions more "compact" in the display sizes to allow for tighter headline setting.</p>
      <p>Given that adjusting the descender height is not much effort, especially in the digital world, I think including different options would make sense and give the typographer more flexibility – you may want super-tight newspaper-style headlines, or an airy layout with elegant long extenders and more generous leading. I think using an OpenType feature such as titling alternates would make things easier, you wouldn't need separate fonts.</p>
