      <p>*Maybe*. On the other hand, there were those who decried Standard Alignment when it was first adopted.</p>
      <p>Updike states the case thus: "There are mechanical advantages inherent in this scheme, but they are attained at the expense of the correct proportion of certain letters. . . . This disregard for proportionate length of descenders of types of different sizes pervades the whole scheme; and consequently no size of type (excepting possibly 7-point and 11-point) which is cast on Standard Line can have descenders of adequate length." [D. B. Updike, <cite>Printing Types</cite> Vol 1, p.35. Cambridge: Belknap Press, 1922]</p>
      <p>When Updike starts ranting, you have to take it with a grain of salt; but this makes me question just how much Standard Line conformed to traditionally accepted optimum proportions for sizes.</p>
