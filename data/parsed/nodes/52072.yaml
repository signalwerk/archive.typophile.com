    html: <p>IMO it's the lack of distinct characters and the subtlety, dare one say blandness, of the face that provide its personality.</p>
    html_clean: <p>IMO it's the lack of distinct characters and the subtlety, dare one say blandness, of the face that provide its personality.</p>
  - id: 314732
    user: 14722
    date: 2008-11-25T14:58:00
    date_raw: 25 Nov 2008 — 2:58pm
    votes: null
    html: <p>It’s not simply the blandness of the face, but the way that lack of distinction combines with the generous proportions of the forms and counterforms. Frutiger is a very airy typeface with huge counters and wide letterspacing; its black weight could pass for bold in some families. So it also lends itself to great readability in many circumstances.</p>
