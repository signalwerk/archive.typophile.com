    <p>Hi!<br>
    I'm doing a little research on the typeface Frutiger.<br>
    I've read plenty about Adrian himself unfortunately for me I need information about the typeface<br>
    He doesnt mention the face Frutiger much, though I have found some information about the typeface he designed for the airport in France called; Roissy which is i think Frutiger but it doesnt say much.</p>
    <p>I need a little information on how to distict this typeface (Frutiger) with popular typefaces like Helvetica, Univers(Adrian again), etc. etc. </p>
    <p>Or maybe something about its personality.<br>
    I found a few little companies that use Frutiger on the corporate identity.<br>
    However i'm sure a lot of companies use Frutiger for many things.</p>
    <p>Any help will be appreciated, thank you type lovers.</p>
