    html: |-
      <p>I've seen excerpts of the film, which seems to be very interesting – I'd love to see the whole thing.</p>
      <p>Re examples of usage: The <a href="http://www.post.ch/en/index.htm" rel="nofollow">Swiss Post</a> has used Frutiger in its branding for as long as I can remember; in fact, every time I see Frutiger Bold, I think mail (which is how I indentify Frutiger!). Unfortunately, they don't have a lot of branded PDFs or anything online; <a href="http://de.wikipedia.org/w/index.php?title=Bild:Swiss-post.svg&amp;filetimestamp=20080131220237" rel="nofollow">here</a> is their logo, which has actually just recently been tweaked a little, departing from the classic Frutiger lettershapes. I think their web site still has the old one though.</p>
      <p>German Wikipedia lists a whole slew of companies that use Frutiger <a href="http://de.wikipedia.org/wiki/Frutiger#Verwendung" rel="nofollow">here</a> – ranging from the <a href="http://de.wikipedia.org/w/index.php?title=Bild:Bundeswehr_Logo.svg&amp;filetimestamp=20060916190808" rel="nofollow">German Army</a> (Bundeswehr) to <a href="http://www.ubs.com/" rel="nofollow">a certain failed Swiss Bank</a> (which combines it with Walbaum in their printed matters) as well as <a href="http://de.wikipedia.org/wiki/Bild:Ver_di.svg" rel="nofollow">Germany's largest (I think) trade union</a>.<br>
      English Wikipedia also lists <a href="http://en.wikipedia.org/wiki/Frutiger#Frutiger_in_Branding" rel="nofollow">a few</a>.</p>
