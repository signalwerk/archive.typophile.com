      <p>@HVP, First of all, I just want to think out of the box a teeny bit. We like to think of this as the information age.  Well, we now have better ways to store and convey little packets of information - such as car registration numbers, than on the stamped and enameled metal plates with bad typography  we've been using for over a hundred years now.</p>
      <p><cite>I don't know how many children have been saved by the public's being aware of Amber alerts and id'ing vehicles. </cite><br>
      I think the significance of that is somewhat exaggerated. I doubt that publishing plate #s leads to many criminals being identified unless we're talking about a kind of citizen "surveillance", where someone spots a car based on a description and confirms their suspicion by recording the plate number.</p>
