      <p>The point should perhaps be made explicit that the random sequences of letters on a license plate don't have a "bouma" - an overall shape that distinguishes a word in lowercase due to its pattern of ascenders and descenders.</p>
      <p>Thus, uppercase wins out as absent this factor, it's equivalent to lowercase with an x-height of 100%.</p>
      <p>I don't expect license plates in American Uncial any time soon.</p>
