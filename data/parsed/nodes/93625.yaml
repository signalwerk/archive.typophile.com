      <p>Electronic License Plates In Your Future?</p>
      <p><a href="http://tinyurl.com/cx9lcwo" title="http://tinyurl.com/cx9lcwo">http://tinyurl.com/cx9lcwo</a></p>
      <p>"California bill, SB 1453, which passed without a dissenting vote on May 28, 2010, authorizes the DMV to partner with innovation companies for the purpose of researching, developing and implementing new DELP technology at no additional cost to the DMV or the State ... </p>
      <p>"Senator Price argues that adoption of this emerging technology could potentially bring significant benefits to the State of California and its taxpayers by realizing significant cost savings by using digital electronic license plate technology to streamline distribution, activation, and registration of license plates. The technology could also be used to broadcast critical real-time traffic and public information such as Amber alerts and emergency traffic updates to drivers</p>
      <p>"But it is its potential to generate revenue from advertising that could provide the real financial boon for the state. If approved the DMV would be able to charge private vehicle owners for the right to display commercial advertising or other images that would take personalized number plates into the 21st Century by displaying the insignia of a favorite sports team, for example..."</p>
