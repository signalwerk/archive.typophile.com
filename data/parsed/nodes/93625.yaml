      <p><em>Alphanumerics and random strings of characters are hard to read and to remember</em></p>
      <p>That’s rather odd: once upon a time, telephone numbers had mnemonics for their exchanges—32 became Davis, 36 became Emerson, 84 became Victor, and so forth. Davis 7-1751 was a lot easier to remember than its eventual successor, 214-327-1571.</p>
      <p>In any event, using lowercase letters would probably clear up the most obvious source of equivocal reading, which is quickly distinguishing between D, O and zero; otherwise, all caps works fine, so if it ain’t broke…</p>
