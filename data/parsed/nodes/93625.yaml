      <p>White space, Schmnite space. Some good typography could allow a reduced letter size and improved readability at the same time, although I don’t think readability is the whole problem. Alphanumerics and random strings of characters are hard to read and to remember. Making plates the size the back of a car wouldn't help me with  something like “B396 BWT”. When I re-read this this post, my eyes come to a dead stop at that made-up license #. </p>
      <p>Don't tell the cops this 'cause I don't actually like the idea, but in name of efficiency, they could reduce the text size of the plate number by about 25% (&amp; why not use upper and lower case), then put a machine readable bar code on the plate.</p>
