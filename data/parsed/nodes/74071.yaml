    html: |-
      <p><cite>As I recall the font was designed on Arial's metrics, which probably puts it in the "unusual" category. Probably not what you're looking for but Liberation Sans, Ascender Sans and Albany had the same constraint.</cite></p>
      <p>Only the Office version of DB Sans used Arial's metrics, and this was added almost a year after the rest was completed. I really wanted them to get a Mono instead, which looked cool but was a bit too eccentric for intra-corporate correspondence...</p>
      <p>DB Sans shares some DNA with FF Unit, which started as an earlier attempt by Erik Spiekermann and I at the DB corporate face. Fred Smeijers's wonderful Fresco Sans has a similar eccentricity in the terminals, (but not to quite the sale level of weirdness) and the underlying structure is much rounder.</p>
