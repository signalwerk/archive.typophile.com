    <p>Hi all,<br>
    I love the work Eden Spiekermann did with the DB house font (<a href="http://edenspiekermann.com/en/work/projects/deutsche-bahn" title="http://edenspiekermann.com/en/work/projects/deutsche-bahn">http://edenspiekermann.com/en/work/projects/deutsche-bahn</a>). One might even go as far to say that I would travel to Germany just to see it in use. But I was wondering whether there were any "alternatives" (specifically to the sans-serif face)? By "alternatives" I don't mean copies, but rather faces that follow a similar set of principles. For instance, I would consider Forza (<a href="http://www.typography.com/fonts/font_overview.php?productLineID=100041" title="http://www.typography.com/fonts/font_overview.php?productLineID=100041">http://www.typography.com/fonts/font_overview.php?productLineID=100041</a>) by Hoefler &amp; Frere-Jones to be along similar lines... it's refined, quite "square", the wonderful way that strokes meet vertical strokes by thinning etc etc.</p>
    <p>Is there anything that springs to mind?</p>
    <p>Many thanks.</p>
