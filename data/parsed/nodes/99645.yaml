      <p>Maybe the serifs are more evident in the flesh than in the image Nick — given the poor image quality this could be Copperplate* or something similar; tiny serifs of that kind are well known for disappearing at very small sizes or with poor reproduction.</p>
      <p>*<strong>cosmopolitan</strong>, it’s not Copperplate, just using it as an example.</p>
