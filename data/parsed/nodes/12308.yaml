    html: |-
      <p>Yes. I saw the ad in the latest HOW and laughed out loud. Although, seeing him--John Downer--in the flesh and posing a some sort of type designing Fabio was not a surprise, as he always finds an excuse, or reason, to show off his water-polo-exercised body to the masses. ::wink:: ::grin::</p>
      <p>That said, I'd like to add that <a href="http://www.houseind.com/index.php?page=showfont&amp;id=171&amp;subpage=viewfontspecimens" rel="nofollow">Paperback</a> looks amazing and the italic is gorgeous.</p>
