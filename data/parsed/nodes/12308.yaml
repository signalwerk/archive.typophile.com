    html: <p>A fact that I totally missed is that <a href="/wiki/John%20Downer" class="freelinking" rel="nofollow">John Downer</a> designed it. Fitting that they're promoting it with his <a href="http://www.houseind.com/include/getimage.php?id=1521" rel="nofollow">bare chested likeness</a>. Hilarious. Bravo House!</p>
