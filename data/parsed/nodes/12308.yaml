  html: <p>So, you thought <a href="http://www.houseind.com" rel="nofollow">House Industries</a> (ahem, <em>Mister</em> House Industries) was all grown up, having added the Neutraface and Benguiat families in recent years. Well, they just upped the ante with <a href="http://www.houseind.com/index.php?page=showfont&amp;id=171&amp;subpage=viewfonts" rel="nofollow">Paperback</a>, a serious text face with optically sized masters, patterns, alternate figures, dingbats, et cetera. Everything you'd want if  you're designing for, well a paperback, or maybe for newsprint.</p>
