      <p><em>&gt; Mostly I'm impressed with Audree's [dimensional] scale and/or -presumed- parametricism. </em></p>
      <p><strong>This</strong> is the whole idea of using strokes.  It is very easy to parameterize chirography (note how their difference between strong/weak contrast is just about strokes with slants like | or \ ).  Very few people have a clue how to properly parameterize “two-sided” strips of paint…</p>
      <p>One exception I know is <a href="https://web.archive.org/web/20150124083130/http://www.typophile.com/node/73827" title="http://www.typophile.com/node/73827">http://www.typophile.com/node/73827</a>.</p>
