      <p>Hmmm, so what proportion is lower: the number of people who make parametric fonts liminographically versus chirographically, or the number of people who make fonts versus who don't? :-)  One is tempted to conclude that not making fonts "makes much more sense"... Anyway progress is pretty much never about following the herd.</p>
      <p>About chiroliminography (that thread): I think most people got my drift (even if few of them saw much practical use in it). John Hudson for example tried to help me explain to Michael "Two Coats" Clark that there's a fundamental difference between the work of Salden and Okano. In fact here's some evidence -please read my comment there- that people got my drift even before I said it: <a href="https://web.archive.org/web/20150124083130/http://typographica.org/typeface-reviews/quintet/" title="http://typographica.org/typeface-reviews/quintet/">http://typographica.org/typeface-reviews/quintet/</a></p>
      <p>hhp</p>
