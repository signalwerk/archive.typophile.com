    html: |-
      <p>[My apologies for hijacking the thread…]</p>
      <p>&gt; <em>In fact here's some evidence -please read my comment there- that people got my drift even before I said it: http://typographica.org/typeface-reviews/quintet/</em></p>
      <p>Fascinating!  You giving (explicit or explicit) positive remarks about <strong>two</strong> chirography fonts — in one thread!</p>
      <p>Quintet is very impressive — and I’m very interested in its provenance w.r.t. <a href="https://web.archive.org/web/20150124083130/http://typophile.com/node/31095" title="http://typophile.com/node/31095">http://typophile.com/node/31095</a> — but it is clearly pure chirography.  A glyph consists of two parts: a flourish, which is a single chirographic line; and the skeleton, which (according to my very cursory inspection) is an algorithmic expansion of the character's spine (so it is also chirographic).  (I find it very helpful to imagine that what you see in the skeleton is two edges of a 3D band going about the spine and twisting as needed.  Of course, after you can see it as this, it is very easy to describe the transformation as a 2D operation too.  This 3Dness is somewhat similar to one of <a href="/web/20150124083130/http://typophile.com/wiki/Calypso%20PF%20free%20download" class="freelinking" rel="nofollow">Calypso</a>.)</p>
      <p>&gt; <em>Hmmm, so what proportion is lower: the number of people who make parametric fonts liminographically versus chirographically, or the number of people who make fonts versus who don't?</em></p>
      <p>I do not know.  Anyway, I find it completely irrelevant.</p>
      <p>&gt; <em>You want easy? Don't make fonts. :-)</em></p>
      <p>I do not want it easy — unless it <strong>can</strong> be done algorithmically.  What I want is results, and results yesterday.</p>
      <p>While it is obvious that designing one edge of a stroke separately from the other edge of a stroke allows one more freedom, it is also obvious that this more or less prohibits parametrization.  And where I live, optical scaling is a must; other types of parametrization are also of great use.  So unless you design your font for the audience used to the character repertoire of a non-IBM typewriter, you will not have resources to manually design separate flavors.</p>
      <p>Also, I cannot omit that in certain endeavours, more freedom gives worse results than less freedom.  Remember: when people have an especially  complicated message to transmit, sometimes they choose verses and not prose.  (Same happens in math: for many topics, a free-style discourse turns out to be less comprehensible than a strictly formal one — I wrote something on this tune <a class="freelinking external" href="https://web.archive.org/web/20150124083130/http://ilyaz.org/interview" rel="nofollow">here</a>.  But, frankly speaking, I know no typographic examples of this.)</p>
