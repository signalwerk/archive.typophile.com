    html: <p>I prefer fuller families to leaner ones when it comes to type. Something like italic <span class="caps">SC</span> isn’t a make-or-break, but it’s reassuring to know I <i>could</i> use it. Some families have ‘all your bases covered’ and I like that. <br><br>Usually, I am careful to pick a font that doesn’t lack feature I’ll need (when I’m freelancing). But, there are deﬁnitely times when I’ve avoided a font based on what it <i>doesn’t</i> have, particularly for larger projects that’ll span materials I can’t foresee. <br><br>That being said, I haven’t needed italic <span class="caps">SC</span>&nbsp;yet.</p>
