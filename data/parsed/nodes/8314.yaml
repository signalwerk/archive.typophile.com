    html: <p>Chris, I would say that the <i>availability</i> of smallcaps is a selling point. But bundling a niche thing with a mainstream thing and selling them at one low price (because you couldn’t sell enough of them at a high price) is just bad business. Whatever price you sell the main font at, you should sell an extra that people who care would buy for about the same amount, without having to raise the price of something with an extra that most people will never use. It’s just sensitive tiering. <br><br>&gt; italic all-caps are rare and generally frowned upon <br><br>Doesn’t that apply only to swashy ones? <br><br>hhp</p>
