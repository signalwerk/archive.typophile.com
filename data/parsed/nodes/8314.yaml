    html: <p><i>Doesn’t that apply only to swashy ones? </i> <br><br>Especially to swashy ones. Italic all-caps start showing up fairly commonly in title-pages in the 18th century, but seldom in any other context. I think typographers should generally ask themselves, when considering setting something in all-caps italics, whether there is any reason not to use roman all-caps instead. One can imagine, for instance, a title in all-caps that includes a non-naturalised foreign word; this might be a good reason to use all-cap italics. On the whole, though, I don’t think there are many good&nbsp;reasons.</p>
