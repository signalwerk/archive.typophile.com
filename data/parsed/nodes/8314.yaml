    html: <p>I recall seeing some nice title pages done which included small cap italics.  As long as the italic capitals are not too ﬂourished, smallcap italics make sense.  True, most users won’t use them but those users are not the ones who buy lots of fonts (they stick with the free fonts that come with other software).  People with a great interest in typography do though and they are more likely to want smallcaps.  This then becomes a selling feature. <br><br>ChrisL</p>
