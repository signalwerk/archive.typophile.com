    html: <p>Although Italic Small Caps were made in only a few isolated case by Merganthaler Linotype and Lanston Monotype, they do have a certain amount of historic legitimacy. <br><br>I can’t think of too many instances where I would use them myself, but i have made it a habit to add them to all of the text fonts that I have designed and produced for my own small font collection. <br><br>They do no harm, and I think it’s better that they are available rather than have designers “make” them up for a speciﬁc piece of typesetting. It’s simple enough to ignore them. <br><br>Jim&nbsp;Rimmer</p>
