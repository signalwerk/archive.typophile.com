    html: '<p>I’m reading Peter Burnhill’s _Type spaces: in-house norms in the typography of Aldus Manutius_. It is an interesting study of the typographic work based on a few of the earliest of the Aldine books. The primary examples are those books showing the typographic treatment of a small roman cap with italic lowercase are predominant. <br><br>I’m ﬁnding this a diﬃcult read but from what I can tell Burnhill is assuming the treatment is a single typeface design. <br><br>From my work on an extensive book detailing the <span class="caps">UCLA</span> collection, _The Aldine Press_, on which Nicolas Barker and Matthew Carter were collaborators, it is my understanding that the small x-height cap font and the italic font are two diﬀerent typefaces, and were combined, partly because there was precedent (similar treatments can be found in earlier manuscript books), but mainly out of expediency, the matching italic caps had not been cast. I recall Barker correcting one of the bibliographers in this regard. <br><br>While I do not know of any Aldine treatments of italic small caps or all italic cap settings (just to stay on topic!), I was wondering if anyone had further information on this, as it seems some of the weight of Burnhill’s argument may be based on an erroneous assumption. <br><br>Though I do like his speculation that size names for typefaces may have sprung from the Aldine attempt at standardization. <br><br>Gerald&nbsp;Lange</p>'
    html_clean: '<p>I’m reading Peter Burnhill’s _Type spaces: in-house norms in the typography of Aldus Manutius_. It is an interesting study of the typographic work based on a few of the earliest of the Aldine books. The primary examples are those books showing the typographic treatment of a small roman cap with italic lowercase are predominant. <br><br>I’m ﬁnding this a diﬃcult read but from what I can tell Burnhill is assuming the treatment is a single typeface design. <br><br>From my work on an extensive book detailing the <span class="caps">UCLA</span> collection, _The Aldine Press_, on which Nicolas Barker and Matthew Carter were collaborators, it is my understanding that the small x-height cap font and the italic font are two diﬀerent typefaces, and were combined, partly because there was precedent (similar treatments can be found in earlier manuscript books), but mainly out of expediency, the matching italic caps had not been cast. I recall Barker correcting one of the bibliographers in this regard. <br><br>While I do not know of any Aldine treatments of italic small caps or all italic cap settings (just to stay on topic!), I was wondering if anyone had further information on this, as it seems some of the weight of Burnhill’s argument may be based on an erroneous assumption. <br><br>Though I do like his speculation that size names for typefaces may have sprung from the Aldine attempt at standardization. <br><br>Gerald&nbsp;Lange</p>'
