    html: '<p>I can’t remember if I’ve ever used an italic smallcap: I suspect not. I use roman smallcaps a lot, so its not as if I wouldn’t use the italics if I could think of a use for them. It should also be noted that italic all-caps are rare and generally frowned upon by typographic tradition, which explains why smallcap counterparts are as rare or rarer. <br><br>The new <span class="caps">MS</span> ClearType fonts all contain smallcaps for all four styles (regular, bold, italic, bold italic), but <span class="caps">MS</span> have, um, special users, who complain if one style of a font doesn’t behave in Powerpoint exactly the same way as the other&nbsp;styles.</p>'
