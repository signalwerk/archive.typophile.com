    html: <p>You need to order your GPOS lookups so that mark positioning comes after cursive attachment lookups. The recommended order for GPOS feature lookups is kern, curs, mark, mkmk. If the mark lookups precede the curs lookups, the marks will not be positioned relative to the curs shifted bases.</p>
