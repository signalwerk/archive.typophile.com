  html: "<p>============================================================ <br>LinoLetter 12/04 - Experience Zapfino�s New Possibilities!      <br>============================================================ <br> <br>! Welcome to the December issue of LinoLetter ! <br> <br>INTRODUCTION: <br>Creating unique typographic possibilities is our company�s  <br>mission and goal. This month we are pleased to present our  <br>most innovative OpenType font to date: the new Zapfino  <br>Extra Pro, with Contextual OpenType Features. This  <br>update of one of our best-selling families elevates the  <br>Zapfino experience to a whole new level. And speaking of  <br>old favorites, we have chosen December to roll out another  <br>classic Linotype collection: Type before Gutenberg. This  <br>finely drawn compilation of our best calligraphic  <br>typefaces offers a flourish of lettering spanning several  <br>historical epochs. Finally, we�d like to draw your  <br>attention to three of our favorite places on the Linotype  <br>website: we�ll take a second look at the script face  <br>Expectation as well as drop by our \"New Font Releases\" <br>and \"Bookshop\" sections. <br> <br>Have fonts of fun! <br> <br> <br>------------------------------------------------------------ <br> <br>IN THIS ISSUE:  <br> <br>1.  Zapfino Extra: Experience Zapfino�s New Possibilities! <br> <br>2.  Type before Gutenberg 1�3: Three compilations of  <br>    yesteryear�s calligraphic designs for today�s  <br>    typographers <br> <br>3.  Brand new fonts from Linotype Library <br> <br>4.  The Expectation Family: Two trendy fonts with a  <br>    handwritten feel <br> <br>5.  The Linotype.com Bookshop: Books on type and typography <br> <br>____________________________________________________________ <br> <br>1.  Zapfino Extra: Experience Zapfino�s New Possibilities!  <br>____________________________________________________________  <br> <br>Zapfino Extra Pro elevates the Zapfino experience to a whole  <br>new level. Our latest update to this contemporary classic  <br>includes an extensive set of OpenType features - simplifying  <br>text setting with Zapfino and allowing the user to quickly  <br>achieve stunning results. <br> <br>When used in modern layout applications which support  <br>OpenType features (such as Adobe InDesign CS or Adobe  <br>Illustrator CS), Zapfino Extra Pro simulates a natural <br>calligraphic flow. A sophisticated system of contextual  <br>substitutions embedded in the font automatically chooses  <br>different stylistic variants of the alphabetic characters.  <br>And this happens as you type, without needing to select any  <br>options! <br> <br>Are you ready for the ultimate e-calligraphic experience?  <br>Dive into the world of the new Zapfino: <br>- <a href=\"http://www.linotype.com/6-2326-6/zapfinoextra.html\" target=\"_blank\">http://www.linotype.com/6-2326-6/zapfinoextra.html</a>     <br> <br> <br>____________________________________________________________ <br> <br>2.  Type before Gutenberg 1�3: Three compilations of  <br>    yesteryear�s calligraphic designs for today�s  <br>    typographers <br>____________________________________________________________ <br> <br>In the late 1980s and early 1990s, several well-known  <br>calligraphers were invited to design original  <br>interpretations of historical handwriting styles �  <br>especially for use in modern typesetting. Under the banner  <br>\"Type before Gutenberg,\" three compilations of these  <br>typefaces are now available. Each \"Type before Gutenberg\"  <br>pack contains fonts from the different historical ages  <br>leading up to Gutenberg�s invention of the printing press  <br>at around 1450. <br> <br>Included in these packages are our beloved Herculanum and  <br>Omnia from Adrian Frutiger, Gottfried Pott�s  <br>Carolingian-style Carolina, and the extravagantly elegant  <br>Notre Dame, Beneta and San Marco from Karlgeorg Hoefer! <br> <br>Take a trip back in time with Type before Gutenberg 1-3: <br>- <a href=\"http://www.linotype.com/6-2166-6/typebeforegutenberg.html\" target=\"_blank\">http://www.linotype.com/6-2166-6/typebeforegutenberg.html</a> <br> <br> <br>____________________________________________________________ <br> <br>3.  Brand new fonts from Linotype Library   <br>____________________________________________________________ <br> <br>In order to keep you informed about the latest releases in  <br>our ever-expanding Font Library, we have created a new  <br>section in our Font Finder entitled \"New Font Releases.\"  <br>Take a look at our new faces, intended for use in trendy to  <br>top-notch settings. Best of all, these new fonts will equal  <br>or surpass the technical quality of your old favorites. <br> <br>Check it out here: <br>- <a href=\"http://www.linotype.com/5-2297-5/newfontreleases.html\" target=\"_blank\">http://www.linotype.com/5-2297-5/newfontreleases.html</a> <br> <br> <br>____________________________________________________________ <br> <br>4.  The Expectation Family: Two trendy fonts with a  <br>    handwritten feel <br>____________________________________________________________ <br> <br>Making a Christmas card takes a lot of work! Finding the  <br>right typeface can be tough, too. Have you ever spent hours  <br>searching for just the right one? Well, back in 2003,  <br>instead of spending hours searching, German designer Guido  <br>Bittner made up his own. This delicate series of letters  <br>maintains a handwritten feel, in part because it began as a <br>digitalization of Bittner's own handwriting. Expectation  <br>Swash includes additional swash letters, which can be paired  <br>with regular version characters of Expectation to create  <br>superior effects. The Expectation font family was a winner  <br>in the Linotype Library 2003 International Type Design  <br>Contest. <br> <br>Let these fonts exceed your expectations and spark your  <br>inspiration: <br>- <a href=\"http://www.linotype.com/7-2278-7/vsexpectation.html\" target=\"_blank\">http://www.linotype.com/7-2278-7/vsexpectation.html</a> <br> <br>  <br>____________________________________________________________ <br> <br>5.  The Linotype.com Bookshop: Books on type and typography <br>____________________________________________________________ <br> <br>New service: Linotype Library has gathered together some of  <br>the best books on type and typography, including works from  <br>such type legends as Jan Tschichold, Paul Renner, Sumner  <br>Stone, and Gottfied Pott. Other selected books include  <br>titles no self-respecting type designer can afford to live  <br>without! We are proud to bring this bookshop to you in  <br>association with Amazon.com. <br> <br>Detailed descriptions of all available books can be found  <br>here: <br>- <a href=\"http://www.linotype.com/7-2262-7/bookshop.html\" target=\"_blank\">http://www.linotype.com/7-2262-7/bookshop.html</a> <br> <br> <br> <br>------------------------------------------------------------ <br> <br>Don�t Forget! <br> <br>Linotype.com offers a wide variety of possibilities to help  <br>you find the right typeface or font package, as well as the  <br>chance to try the fonts out and also make a purchase. This  <br>month, we would like to remind you of our award-winning font  <br>search application, FontExplorer, and our most up-to-date  <br>special offers. <br> <br>Fontexplorer <br>Take this little application for a spin � with FontExplorer,  <br>you can easily search our 6,000+ font database, specifying  <br>exactly which features should be highlighted in the process  <br>(including design features and subjective key words). <br>- <a href=\"http://www.linotype.com/5-18-5/fontexplorer.html\" target=\"_blank\">http://www.linotype.com/5-18-5/fontexplorer.html</a> <br> <br>Special Offers <br>Font Packs for all needs at the lowest prices! Selected  <br>packs are available for both beginners and professionals. <br>- <a href=\"http://www.linotype.com/5-2163-5/specialoffers.html\" target=\"_blank\">http://www.linotype.com/5-2163-5/specialoffers.html</a> <br> <br> <br>************************************************************ <br> <br>We hope you found this issue of LinoLetter informative and  <br>useful. We would highly appreciate your feedback at  <br><a href=\"mailto:info@linotype.com\">info@linotype.com</a> <br> <br>The next issue of this newsletter will be published and  <br>dropped in your mailbox at the beginning of January. <br> <br>Your Linotype Library Online Team <br> <br> <br>------------------------------------------------------------ <br>Publisher: <br>Linotype Library GmbH <br>Du-Pont-Stra�e 1 <br>61352 Bad Homburg / Germany <br> <br>Website: <a href=\"http://www.linotype.com\" target=\"_blank\">www.linotype.com</a> <br>Contact: <a href=\"mailto:info@linotype.com\">info@linotype.com</a> <br>Phone +49 6172 484-418 <br>Fax   +49 6172 484-429   <br>------------------------------------------------------------ <br> <br>(c) 2004  Linotype Library GmbH</p>"
