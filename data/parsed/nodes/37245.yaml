    <p>I am probably going to be setting some text for ghost/paranormal stories some time in the next 3 months in a new Lit journal so I thought I would start looking for a suitable text face for it. What I have come up with so far is Stormtype’s Walbaum. It feels victorian and the words ’ghost’ &amp; ’scream’ look great in it. </p>
    <p><a href="http://www.stormtype.com/typefaces-fonts-shop/families-52-walbaum-text" title="http://www.stormtype.com/typefaces-fonts-shop/families-52-walbaum-text">http://www.stormtype.com/typefaces-fonts-shop/families-52-walbaum-text</a></p>
    <p>It’s early days yet and I feel far from stumped - but still, I thought it would be a fun thread: What would you use &amp; why?</p>
