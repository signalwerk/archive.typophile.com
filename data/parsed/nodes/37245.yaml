    votes: null
    html: "<p>If they’re good ghost stories, they’ll be plenty scary without any help from the typeface—-so I think it’s best to keep the effect of the text face subtle. Caslon, Storm’s Walbaum, Trump Mediaeval, I think they’d all work. Baskerville too. I might even try Elysium to see the effect. It’s a little heavier and edgier than many text faces. I once used it to set a novel about the ultimate solution to bad drivers: nail them to crosses overlooking the Don Valley Parkway.</p>"
