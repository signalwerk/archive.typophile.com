    html: <p>Post Mediaeval—-there’s another possibility, although I find the l.c. “a” is slightly distracting in text settings and hence have only ever used it for semi-display text and titling. The typeface certainly has character (kind of makes me think of old castles) but, except for that darned “a”, is not too far out for extended text. It doesn’t have oldstyle numerals, however, the numerals are less than cap height and are kind of semi-oldstyle; they blend in quite well.</p>
