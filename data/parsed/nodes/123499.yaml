      <p>Thanks for the good info guys ;-)</p>
      <p>Maybe the magazine font is an actual handwritten text. Nevertheless thanks for the similar fonts catalog and extra suggestions you sent me. It is always nice to have a really nice "look and fell" handwritten font. Not an easy task.</p>
      <p>Nella Sue is nice but it would be great if could be a little bit more bold for contrast, don't you think?<br>
      <a href="http://www.dafont.com/nella-sue.font" title="http://www.dafont.com/nella-sue.font">http://www.dafont.com/nella-sue.font</a></p>
      <p>Suomi Hand Script<br>
      <a href="https://www.fontshop.com/families/suomi-hand-script/buy" title="https://www.fontshop.com/families/suomi-hand-script/buy">https://www.fontshop.com/families/suomi-hand-script/buy</a></p>
      <p>looks really nice and has some extra "personality" added too. </p>
      <p>Cheers,</p>
