    <p>Designed by Daniel Hernández</p>
    <p>A fresh, curly &amp; delicious sans serif.Merced is a sans serif font that can be given different uses for its wide variety of alternate types. Its main virtue is the endless number of possibilities that the font gives to write a word, text or paragraph.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/news_april_11typophile1_6052.jpg"></div><p></p>
    <p>Available in:<br>
    <a href="http://new.myfonts.com/fonts/latinotype/merced/" title="http://new.myfonts.com/fonts/latinotype/merced/">http://new.myfonts.com/fonts/latinotype/merced/</a></p>
    <p>Languages include: Basic Latin, Western European, Euro, Catalan, Baltic, Turkish, Central European, Romania, Pan African Latin.</p><div class="imageWrap"><img src="http://typophile.com/files/news_april_11typophile_6387.jpg"></div><p></p>
