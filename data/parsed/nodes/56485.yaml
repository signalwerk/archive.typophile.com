    html: <p>You might want to consider putting together a proofing file for whatever encoding you plan to be using in the near future. Mine currently shows a variety of juxtapositions of almost every glyph in the font against every other organized into sections for easy printing. I’m actually about to add more pages that only show common kerning pairs. It’s also worthwhile to run a paragraph of text in every language the font supports; just get copy from the Universal Declaration of Human Rights web site.</p>
