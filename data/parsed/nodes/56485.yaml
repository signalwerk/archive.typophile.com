      <p>Besides these two good things to do, as mentioned above, these are som basic hands-on logical tests you also can do just make sure everything is working fine.</p>
      <p>• Make a full set of characters (every one of them) to see if every character is visible in a layout application.</p>
      <p>• Make outlines of all character in InDesign or Illustrator to see that everything is OK.</p>
      <p>• Install the font on a PC and a Mac and try the fonts in all available applications you might have (both professional apps and everyone-have-apps like Word, Powerpoint etc) . You could try all the different install methods available also when installing the fonts.</p>
      <p>• Make sure the font is appaering in the font menus with the proper name in the applications.</p>
      <p>• Put them in Suitcase/Linotype Font Explorer to see how they look there. Does it activate properly etc, is the font info looking OK?</p>
      <p>• Print from different applications.</p>
