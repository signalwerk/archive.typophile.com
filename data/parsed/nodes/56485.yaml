      <p><em>So, if your kern all those ’non-sense’ words you are right to go ? :)</em></p>
      <p>I think that the more tests you do, the better. Kern King is a file <a href="http://www.lesliecabarga.com/">Cabarga</a> made to test kerning pairs, but notice that it doesn't contain too many punctuation symbols. Quotation marks need to be kerned, too, and Kern King only has a few apostrophes (single quotes) in it. Ideally, you need to test every possible kerning pair, including punctuation.</p>
      <p>Also, Kern King is not a substitute for the tools James Puckett, Tim Ahrens, nettoo, and j. hadley linked to earlier.</p>
