      <p>For more "technical" (I hate that term but everyone seems to know what I'm talking about) testing:</p>
      <p>I would recommend Microsoft Font Validator, but it's hard to do that effectively these days as it does not appear to be readily link-able anymore. Perhaps sii or Sergey or someone at MS can post a current download link (and while we're at it: any news on an updated version being released anytime soon?). Font Validator is mainly geared towards TrueType-based fonts, but still provides useful feedback for CFF-based fonts.</p>
      <p>I would also recommend 'compareFamily' in the Adobe Font Development Kit for OpenType: <a href="http://www.adobe.com/devnet/opentype/afdko/" title="http://www.adobe.com/devnet/opentype/afdko/">http://www.adobe.com/devnet/opentype/afdko/</a> ; bit of a different approach than FontValidator (and suffers from an even worse signal-to-noise ratio), but can help spot major problems.</p>
    html_clean: |-
