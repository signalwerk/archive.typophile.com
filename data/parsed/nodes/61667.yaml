      <p>It appears to be a variation of <a href="http://new.myfonts.com/search/park+avenue/fonts/?testdrive=custom%3D0%26seed%3D26%26dock%3D0%26size%3D72%26w%3D600%26src%3Dcustom%26text%3DPrimarily%26fg%3D000000%26bg%3Dffffff%26goodies%3Dot.liga" rel="nofollow">Park Avenue</a> with alterations to "r" and "y".</p>
      <p>After more research it appears a little closer to <a href="http://www.webpagepublicity.com/free-fonts-p.html" rel="nofollow">Park Place</a> which has softer curves on the "y".</p>
