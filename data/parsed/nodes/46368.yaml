    <p>I’d love some help from you guys.</p>
    <p>I’m doing a letterpressed wedding invitation. The event itself is casual with a pig roast immediately afterward, so I’m thinking that the tone of the invite should be relaxed and entertaining, too.</p>
    <p>I’m creating an oversized (8Wx12H) “poster” for the invite that I want to be typography only. I’m thinking that I’d like to use classic typefaces that will vary from large to small, much like old letterpress posters/announcements or type specimen from old metal and wood type.</p>
    <p>It will be letterpressed on cotton paper, some thick stuff that has some tooth.</p>
    <p>It’ll probably be black type (maybe a spot color, too) on white paper.</p>
    <p>The style will be anti-formal wedding letterpress, and more in the throw-me-together-a-quick-poster-on-your-letterpress-in-1945 zone.</p>
    <p>I’d love to get some suggestions on typefaces to use for this style.</p>
    <p>Think BIG small BIG small BIG NUMBERS small, mostly centered.</p>
    <p>I’d like to include an old gothic or grotesque of some sort- Franklin seems too mean looking. Trade and News don’t have quite enough character.</p>
    <p>I’d like to find three typefaces that really feel nice together- and one that has a nice set of numbers for the date/time, etc. </p>
    <p>I have included some samples of a couple of cheap letterpress posters from 50+ years ago- both use Cheltenham, but are a bit different with the headline faces.</p>
    <p>Any suggestions or pointers toward other examples of this type of style is greatly appreciated...</p><div class="imageWrap"><img src="/web/20081013103304im_/http://www.typophile.com/files/img002_5660.jpg"></div><div class="imageWrap"><img src="/web/20081013103304im_/http://www.typophile.com/files/img003_3606.jpg"></div><div class="imageWrap"><img src="/web/20081013103304im_/http://www.typophile.com/files/img009_6221.jpg"></div><div class="imageWrap"><img src="/web/20081013103304im_/http://www.typophile.com/files/img010_6411.jpg"></div><p></p>
