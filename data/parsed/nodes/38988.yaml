      <p>Kent: "I would be one of those who thinks it looks dated"</p>
      <p>I have always found that in typography "dated" is a troubling concept. Except, at othe times I find it laughable. Everything is dated, even if it is-up-to-date unless there is an expiry date. Type is "not" a perishable product. We are not dealing with radishes and turnips. Typography is an evolution and if anyone has learned anything it is that if you break the rules of typography what do you get? Bad typography?</p>
      <p>Goudy Oldstyle has not broken any rules yet it is "original".</p>
      <p>One of the most revealing of Updikes errors was his back handed criticism of Goudy, He said, "truth is the daughter of time". Well, obviously Updike did not have a nose for the truth because Goudy is a valuable typographical asset. It is plain to see that many in the forum like Goudy oldstyle.</p>
      <p>It would be wise to another peek at Goudy Oldstyle.</p>
      <p>Giampa</p>
