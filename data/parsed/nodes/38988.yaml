      <p>It is definitely dated, but there's something about the smoothness and elegance of the letterforms, especially the capitals, that I find appealing: Fred definitely knew how to make majuscules that evoke Imperial Rome's grandeur.</p>
      <p>One thing I'm actually struck by now after having looked at his designs in depth is how much I "recognized" Goudy Old Style when I just looked it up, despite not having seen a sample of it in a while. There's no mistaking a Goudy typeface for someone else's, which does mean that it's a bit hard to use. However, some of his less-known faces I find to be surprisingly contemporary; check out Goudy Sans, Goudy Modern, Goudy Heavyface, Kaatskill, Goudy Ornate, and Goudy Text, all on <a href="http://www.p22.com/lanston" rel="nofollow">Lanston</a>. I was especially surprised when I came across Goudy Sans, as I could see someone releasing it today, albeit as a sans-serif "riff" on the early 20th century and Art Nouveau. But maybe that's just a function of the new hairline weight, which I'd love to use someday.</p>
