      <p>Goudy was great, and his typefaces will be used a hundred years from now, as they are now, 60 years after his death. Goudy Oldstyle was overused at one point, though it is still used widely. The Lanston version has the longer descenders that Goudy actually wanted. Various versions of his Californian are used a lot today in publications. Both Font Bureau's Californian and ITC Berkeley are widely used, and perhaps also Lanston's version, I don't know. </p>
      <p>In general--except for Copperplate Gothic--they have a handmade feel and a very human warmth. Some people don't like this aesthetic, and some even hate it. But tastes are diverse enough that I think that such type will always have a place. </p>
      <p>Goudy did repeat himself a lot, and some of his stuff looks sloppy. With the later stuff, I put this down to his cutting his own faces, and not having outside critics, and especially not adjusting his faces for optical size. </p>
      <p>&gt;I haven’t been able to find a good version that has been given a little more weight for offset work.</p>
      <p>Goudy Catalogue is a version of Goudy Old Style cut by Morris Fuller Benton, and is a little heavier for smaller text. You might like that for some uses where you would find Goudy Old Style too light.</p>
