      <p>"Hate" comes fairly close to it for me. </p>
      <p>In the early and middle 1980s I was a partner in a letterpress book printing shop. One year we had a contract for a quarterly journal set in Goudy Modern [metal Monotype]. The typeface's quirks were getting to us, so one day I went into the office, got a copy of one or the other volume of Updike, and my partner &amp; I took a solemn oath never again to use a Goudy face for text.</p>
      <p>Next thing I know I'm an ad type director in Minneapolis, and something like 70% of the serif type specified by art directors at that agency was Goudy Old Style. Dang! I could not get away from it. I had to immerse myself in a study of the type and learn how to show art directors and typesetters how to make it look good. This was with Compugraphic's version, which, like most others, was too light for text sizes. I learned how to get the face set right, but I never did learn to love it. It is indeed too idiosyncratic for my taste in book work. When I have the choice of types, I will not use any Goudy faces. If I HAD to use a Goudy face nowadays, I'd take a look at some of the Lanston versions. Or I might just agree to be shot in the head.</p>
      <p>&amp; I agree with Kent: I see little work set in GOS that appears to have been carefully done. </p>
      <p>I also feel the same way about most of Zapf's faces.</p>
      <p>powers</p>
      <p>PS: I had some great November turnips from my Iowa cousin's garden last night. Really tasty. Good turnips have a bit of a tang to them, and that can remind me of some of the  flourishes seen in Goudy's types. They are OK in turnips, but not in types.</p>
