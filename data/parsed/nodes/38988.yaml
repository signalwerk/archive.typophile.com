    <p>After reading some about <a href="/wiki/Frederic%20W.%20Goudy" class="freelinking" rel="nofollow">Frederic Goudy</a>, I was struck by how prolific he was, how he had a tough breaks with fires destroying his workplaces, how he seemed to have a 21st century kind of knack for promotion, and how he was really disliked for this last. So I began to take a closer look at his types and decided I really like <a href="/wiki/Goudy%20Old%20Style" class="freelinking" rel="nofollow">Goudy Old Style</a>. I mentioned it on <a href="http://tianodesign.com/blog/?p=83" rel="nofollow"> <strong>my blog</strong></a>. I was surprised by one particular response I got from someone I respect who really  came down on Goudy Old Style. Is it really such an awful, dated face?</p>
    <p>I was actually thinking of filing it away and looking for a project I could use it on, but now I’m wondering now how far off the mark I am when I look at it and like it.</p>
    <p>Stephen Tiano, Book Designer, Page Compositor &amp; Layout Artist</p>
