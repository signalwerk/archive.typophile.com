      <p>Goudy Old Style, like all of Goudy's typefaces, is distinctive and idiosyncratic. Even though we're all so used to it that it looks familiar, it's still a very peculiar typeface. </p>
      <p>But the problem with Goudy Old Style isn't that. The problem is that there is no digital version that isn't much too light. Take a look at printed samples of the original metal type: there's nothing spindly about it. Yet digital versions (and before them photo versions) are nearly unusable because they don't take into account the ink spread that comes with letterpress printing. (And perhaps because they're based on too large a size of original; I'm not sure whether that happened with Goudy Old Style, but it certainly happened with other photo versions of popular metal typefaces.) Add to this the tendency of phototypesetters and digital typesetters to scrunch out the space between letters, and you end up with something more like a thicket of infinitesimal twigs than like black, readable type.</p>
      <p>Goudy Catalog is a darker alternate, but it's not the same typeface.</p>
