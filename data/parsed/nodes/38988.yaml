      <p>I like Goudy Oldstyle and don't find it "dated"---though it is a typeface you definitely wouldn't use for just anything. If it suits your subject matter, use it. My main beef with Goudy OS is that I haven't been able to find a good version that has been given a little more weight for offset work. Also, the fi and fl ligatures are too tight---don't use them.</p>
      <p>For a long time Canadian govenment topographic maps used Goudy Oldstyle for the names of lakes and rivers, which were usually in italic. Goudy OS italic is wide and very legible.</p>
