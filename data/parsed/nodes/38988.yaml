      <p>My late Uncle Ben Lieberman in his book "Types of Typefaces" had a category called "Personal" style, as  opposed to a more 'invisible' one, epitomized by Morris Fuller Benton. He put Goudy and Zapf (who is an admirer of Goudy) in that 'personal' category. He also put Dwiggins and Van Krimpen there, but I am doubtful that they really belong in the same way. </p>
      <p>At any rate, Goudy Old Style and Palatino both have a lot of 'flavor'. The only problem is that you many not like the flavor. Personally I like them both, but I can see why some don't.</p>
