      <p>At small sizes GOS looks better than I would expect, given how ugly it looks to me close up. But there are better Goudy types, especially if you're prepared to do a little editing. LTC/P22 Kaatskill, for instance, seems to me fundamentally better, but like most Goudy types it has its flaws. I tweaked eight glyphs in the roman that I thought could be improved, and the result is almost a workhorse. P22 allow editing, by the way.<br>
      (My tweaks were taking off the left part of the stroke on Q, redrawing the right leg on R, giving W a symmetrical cross-over, thickening the bars on f and t, slightly re-balancing the lower bowl on g, lightening the join on r, and pulling fractionally rightwards and lightening the bulb of y's descender. I originally made other changes, such as normalizing the asymmetrical o, which turned out not to be improvements.)</p>
