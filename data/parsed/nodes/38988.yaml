      <p>My thanks to everyone for taking the time to answer. And thanks, Florian, for giving a good link. I sometimes forget that when I type fast, my touch grows lighter in spots and I create typos despite actually touching the correct keys.</p>
      <p>I’m pleased that others like Goudy Old Style to any extent. Goudy himself appears not to be as well thought of as he deserves, and that is a shame. Not simply because he was prolific, but—as in the case of his Old Style—because he did some really fine work that doesn’t seem to have been appreciated.</p>
      <p>For myself, it’s not as if I need validation to my taste, as I’m entitled to bad taste, if that’s what it is. But I do care that my judgment of it’s potential usefulness today in a book isn’t way off the mark. I agree, however, that—as with pretty much any typeface—it is important to match it with an appropriate setting, with subject matter that is a good fit.</p>
