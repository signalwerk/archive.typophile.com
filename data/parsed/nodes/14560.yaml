      <p>John Hudson asked:</p>
      <p><cite>What’s the business model?</cite></p>
      <p>I've been thinking about free fonts for a while, and have come to a slightly different conclusion than yours. I believe that many people miss that <em>learning</em> is one of the most powerful motivations to do free software development. There is no reason why this can't apply to fonts as well.</p>
      <p>If one follows this theory, then the ingredients for a successful free font community include:</p>
      <ul>
      <li>Mentoring by more skilled type people, particularly constructive critique.
      </li><li>A two-way communication with an appreciative user base. It's much more fun to meet a specific need than to draw yet another crappy font to be added to the zillions already available at dafont and related sites.
      </li><li>An attractive presentation of the results. Good organization, test settings, maybe even an interactive preview. Feature the "good stuff" prominently to avoid getting bogged down too much by <a href="https://web.archive.org/web/20140827180846/http://en.wikipedia.org/wiki/Sturgeon%27s_law" rel="nofollow">Sturgeon's Law</a>.
      </li></ul>
      <p>I personally don't think the choice of tools matters all that much. Hardcore free software folk (as well as starving students) will probably go for FontForge, while others will want to use commercial tools. I'm working on my own tools which I think will be especially useful for beginners, so I'd hate to see lock-in to particular tools.</p>
      <p>As for the business / ethics / etc. issues, I'm still mulling all this over, which is one reason I haven't pushed harder on free fonts myself. I'm personally inclined to think that a body of extremely high quality free fonts is a net good for society, but I also respect arguments to the contrary.</p>
