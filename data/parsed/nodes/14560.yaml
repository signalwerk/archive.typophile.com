    <p>Would there be any interest in an online tool for collaborative font design of open source fonts?</p>
    <p>I have been trying for a while to work a way to combine my love of type design and passion for creating beautifully useful websites. After a drunken chat with a developer friend we have come up with a few ideas for a way of building a tool for fostering a community based font design collective that would release final products as Open Source fonts.</p>
    <p>Before I go into how this might work how much interest would there be in such a tool?</p>
