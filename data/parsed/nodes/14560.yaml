      <p><em>’m personally inclined to think that a body of extremely high quality free fonts is a net good for society...</em></p>
      <p>I think so too, which is why I'm happy making fonts such as the SBL collection which are available under free license to individuals (but not  open source). I have no complaint at all against fonts being made freely available, so long as the people who make the fonts are adequately rewarded (usually with money, but not necessarily so). Type design is a profession, and people shouldn't be doing it for nothing: that just undermines the marketability of our skills.</p>
