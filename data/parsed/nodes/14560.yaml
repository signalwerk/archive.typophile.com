      <p>What's the business model? Open source software is great, but it is generally based on something other than volunteerism, usually involving the possibility of making money from service contracts. So you make the software, give it away, and then get people to pay you to help them use it, customise it, support it, etc. This is the typical business model for open source development. The huge open source industry is not made possible by a bunch of well meaning programmers working for nothing.</p>
      <p>The problem of a viable business model for open source fonts has been around for a while now, and no one has come up with a really good solution to it. This is why there are so few open source fonts. If you want the quality of professional font development, you generally need to figure out some way for professionals to make money.</p>
