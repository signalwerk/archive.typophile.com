      <p>OK now for the technical bit.</p>
      <p>What format would be best for the editing? I have an idea of how it might work but it is obviously based around the software that I use to build my fonts, and also the process is based on my methods too.</p>
      <p>The way I see the process working is something like this;</p>
      <dl>
      <dt><strong>1. Direction</strong></dt>
      <dd>Discussion based starting point where the style and purpose of the font is set out. This will result in the basic brief and outline of the fonts specs.</dd>
      <dt><strong>2. Grid</strong></dt>
      <dd>From the initial discussion we should be able to design a grid which will form the template for all charecters.</dd>
      <dt><strong>3. Template characters</strong></dt>
      <dd>An initial group of characters would be created to set the tone and style of the font. </dd>
      <dt><strong>4. Character set</strong></dt>
      <dd>We now move into covering the full Character set. There will be a navigation page that has a whole for all full ASCII set,  each one will hold alternatives for each character for discussion, any of which can be downloaded, edited, and uploaded.</dd>
      <dt><strong>5. Creating the font</strong></dt>
      <dd>Once all the characters have been created a font can be created from the outlines by the font admin. This font can only be edited by one user at a time and must be signed out and in whenever anyone makes the change. OpenType is my preferred format.</dd>
      <dt><strong>6. Version tracking</strong></dt>
      <dd>The obvious advantage to this kind of development is that the font can evolve and improve endlessly. Missing characters can be added, languages covered. And issues dealt with</dd>
      <p>How does all that sound as start?</p>
      </dl>
