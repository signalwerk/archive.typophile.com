      <p>I am fully aware of the ethical issues of projects like these and would hate to see the type industry damaged in any way. Opening a project up to designers and technicians from different backgrounds and cultures in an open non profit way always results in something that is at the very least interesting and at best brilliant.</p>
      <p>There are ways around ethical and quality issues with considered rules and guidance from a well informed steering group. There are also well developed legal presidents for similar projects that cover the designers, the project and the end user. For example <a href="https://web.archive.org/web/20140827180846/http://creativecommons.org/" rel="nofollow">Creative Commons</a> offers a way to openly copyright work.</p>
      <p>I think there should be a central pot where the project can collect donations from people using fonts for profit. I do this on a regular basis when using open source products and always openly tell clients that part of their fee is going to the community that helped make the framework possible to develop their sites.</p>
      <p>I think the first step is probably to discuss how people would like to see this working and any ideas that you may have to make it live up to the potential i think it has. There is a lot of work to do to make something like this happen and would appreciate as much help as anyone can give :)</p>
