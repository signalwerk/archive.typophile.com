      <p><em>I'm certain I've seen Garamond sign work with an anchor &amp; fish but I can't find it anywhere.</em></p>
      <p>The <a href="http://m1.ikiwq.com/img/xl/TuiLnK7ZddJFiZ8pbOSM5a.JPG" rel="nofollow">anchor and dolphin</a> is the mark of Aldus Manutius and his heirs, not Garamond.</p>
      <p>Another famous printer/publisher mark is that employed by the ‘Stephani’, i.e. Robert Estiennes and his heirs, a woodcut depicting a man standing beneath an olive tree from which branches are falling, draped with the motto <a href="http://2.bp.blogspot.com/_sG8sCbFmYUU/ShMAVumSK-I/AAAAAAAAAEw/l0eLvLCy_jg/s400/colophon1559.woodcut.png" rel="nofollow"><em>altum sapere noli</em> (<em>sed time</em>)</a>.</p>
      <p>Project Gutenberg have produced an online version of Roberts’ <em><a href="http://www.gutenberg.org/files/25663/25663-h/25663-h.htm" rel="nofollow">Printers’ Marks</a>.</em> As you will see from perusing the table of contents, such marks fell out of fashion after the 16th Century, and did not reappear until the fashion for things mediaeval and renaissance in the later 19th Century.</p>
