    <p>Hi all,<br>
    I'm tying to find a good handful of typographer's marks<br>
    I have Jenson's mark<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/NicolasJenson_6329.png"></div><br>
    and I'm certain I've seen Garamond sign work with an anchor &amp; fish but I can't find it anywhere.<br>
    Did Baskerville have a personal mark? The Didot lineage, Pietro Bembo, Pierre Simon Fournier?<p></p>
    <p>There is no start date and no end date to bookend my request. But I guess I'm looking for the legends of serf development.</p>
    <p>Thanks,<br>
    Matt</p>
