    date_raw: 25 May 2014 — 2:10pm
    votes: null
    html: |-
      <p>Not all of these applications are equal. The "Crisp" setting in that Character panel only has use for text in Photoshop -- and then only when the text gets rasterized.</p>
      <p>But yes: it <em>would</em> have been nice if all of Adobe's inter-application teams decided on some common panels, instead of treating themselves as islands, convinced of having The Definite Answer all on their own.</p>
      <p>As for plug-ins: sure. There are two options. Design new panels that only have the options available to all three main programs (.. perhaps 4, I'm not sure about FrameMaker's OT caps), or add the missing feature sets to the software that doesn't have it. That latter option needs not only a new interface but also a new document format, which may make it incompatible with previous versions.</p>
  - id: 579147
