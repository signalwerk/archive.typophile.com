    <p><img src="https://d13yacurqjgara.cloudfront.net/users/27262/screenshots/1555731/opentypeui.png"><br>
    I’d love to have same feature set in InDesign and Illustrator. I’d love to have the ease of use of Stylistic Sets, Character Variants, OT Dropcaps, Historical Forms, Historical Ligatures, OT Unicase and Nut Fractions. I’ve made this rather raw and quick mockup and I want to share it with you, fellow typophiles. I’m not affiliated with Adobe, these are just my thoughts on how to UI could work.</p>
    <p>Maybe you have some other ideas? Firefox Nightly and some other browsers for example, supports almost all OT features by font-feature-settings: "xxxx";. So this support could be done. Maybe it’s possible to convince other software developers to support more OT features?</p>
