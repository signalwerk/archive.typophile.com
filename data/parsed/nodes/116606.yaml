    date: 2014-05-16T18:32:00
    date_raw: 16 May 2014 — 6:32pm
    votes: null
    html: <p>I think what was most revealing about Adobe’s implementation of OpenType was that for years, when InDesign was the upstart application challenging Quark Xpress, and with an aggressive marketing campaign aimed at getting users to switch, they mentioned many reasons, but not once OpenType support, despite the fact that Quark did not support OT features, whereas InD did. At that point I decided that one should be greatful for small mercies, and the fact that MicroSoft and Adobe had managed to make this awesome functionality a practical reality. Sure, it could be better supported, and perhaps one day it will be.</p>
