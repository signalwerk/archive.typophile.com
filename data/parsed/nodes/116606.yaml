    html: |-
      <p>How about a custom script/panel that offers the options indesign has now, but in a less cluttered way. Stylistic Sets in particular is terrible to work with now, I think. Paragraph Styles are definately the way to work for normal documents, but for short bursts of text, flyers and display typography with swashes and alternates a better interface would be awesome.</p>
      <p>And while we are at it: is there not a way to implement a glyphs panel in photoshop. This is a feature I use all the time in InD and Illu, and I miss it everytime I use PS...</p>
