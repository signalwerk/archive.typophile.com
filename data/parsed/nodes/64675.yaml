      <p>&gt; So, I was correct: neither is the original Helvetica.</p>
      <p>I did not speak of "the original Helvetica". I spoke of "the original" as opposed to "a clone". For instance, if someone places a banknote on a color copier and make a color copy of the banknote, then, in my terminology, the banknote is "the original" and the result of the copying process is "the copy".</p>
      <p>For instance, in my terminology, "Nimbus Sans" is a copy (= clone) of "Helvetica", and "Nimbus Sans Novus" is a copy (= clone) of "Neue Helvetica".</p>
      <p>In my terminology, "the original Helvetica" would be the very first design made by Max Miedinger in ca. 1957, just like "the original work" is the first edition or editio princeps of a literary or other work.</p>
