      <p>&gt;...  “the original Helvetica” would be the very first design made by Max Miedinger... just like “the original work” is the first edition or editio princeps of a literary or other work.</p>
      <p>The original work of a first edition comes from a single manuscript made into a number of copies usually intended to be identical. </p>
      <p>The "original" of a metal type face intended for text and display, is not "one thing" to begin with so, it could not or cannot be copied to one clone. </p>
      <p>Cheers!</p>
