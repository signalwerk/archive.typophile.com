  html: |-
    <p>So I was looking at my TV screen the other day and what my Playstation was showing there and noticed how really nice <a class="freelinking external" href="http://typophile.com/files/ps3-menu-font_4772.jpg">its menu font</a> was. After a bit of tracking and <a class="freelinking external" href="http://typophile.com/node/64596">with help of akira1975</a> the font happened to be <a class="freelinking external" href="http://www.fontworks.co.jp/typography/family/rodin">Rodin</a> by the Japanese foundry, Fontworks.</p>
    <p>It is really pricey, over $200 for a single weight. Plus shipping and handling as the CD is the only delivery method. Plus it quite understandably includes hieroglyphics, which I do not see using in any foreseeable future. </p>
    <p>All this doesn't make its Roman letters any less nicer. So I had this rather dumb thought to try and create my version of Rodin. </p>
    <p>I fully realize how utterly unqualified I am for the task, and how monumental the task itself is, but (a) I am really curious to give it a try (b) one can't learn without trying (c) I am in no rush and have no other incentive except for the curiosity.</p>
    <p>The question I have though is this. How "OK" is it to try and replicate an existing type ? Not pixel by pixel or curve by curve, of course, but more of having an ultimate goal of creating a similarly looking type. </p>
    <p>I am asking because on one hand there is Swiss 721/Pragmatica/etc siblings of Helvetica, and Rodin itself seems to be borrowing extensively from Akzidenz-Grotesk, but on the other hand there is <a class="freelinking external" href="http://typophile.com/node/56010">Great MyFonts Purge</a> thread.</p>
    <p>My apologies for the "noob" question, but I would really appreciate any insight where does the line go between copied/cloned and inspired/derived types.</p>
    <p>---</p>
    <p>PS. Typophile.com guys, are you reading the feedback emails ? I tried using it to ask about changing the account name several days ago, but never heard anything back.</p>
