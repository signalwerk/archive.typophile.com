    <p>Hi<br>
    I'm in the process of turning my font Journal into OTF.<br>
    In doing so my good old Garage Fonts "Basic Kerning ŢexŢ" file doesn't cut the cheese.<br>
    There is a whole bunch of eastern European glyphs missing.<br>
    Does any one have a kerning text file that comply with the Linotype Extended European Character set (LEEC)?</p>
    <p>Or any other tips?</p>
    <p>I'm working in Fontographer 5.1</p>
    <p>Cheers</p>
    <p>Hans g</p>
