    html: |-
      <p>George, interesting, thanks. </p>
      <p>By “Ronaldson conversion characters” you obviously refer to the occasional capitals that have the little tick marks on the line ends for the characters &amp; numbers you list.<br>
      As for, “Whoever typeset it was pretty sloppy with their use of the Ronaldson conversion characters …”, Yes: jilting to read – over and above the fact that whole paragraphs are set in all caps. </p>
      <p>But, I believe you may have solved the mystery of: Why did the publishing organization revert back to the first edition’s typeface (Century Schoolbook) for the Third Edition? They would have wanted to put the mish-mash that came out in this Second Edition behind them as soon as possible. I believe this also accounts for the Second Edition’s rarity – no desire for second or more imprints.</p>
      <p>As for “Ronaldson conversion”, Google of “Linotype Ronaldson conversion Old Style” returned a link to: </p>
      <p><a href="http://www.typophile.com/node/19769" title="http://www.typophile.com/node/19769">http://www.typophile.com/node/19769</a></p>
      <p>Which pointed to a bit of a history lesson here:</p>
      <p><a href="http://www.myfonts.com/fonts/canadatype/ronaldson/" title="http://www.myfonts.com/fonts/canadatype/ronaldson/">http://www.myfonts.com/fonts/canadatype/ronaldson/</a></p>
      <p>Thanks again,<br>
      Paul</p>
