    <p>HB book, English, printed USA 1950, 2nd Ed </p>
    <p>1st, 3rd  &amp; 4th ED were set in pre-digital Century School book; 2nd Ed is different</p>
    <p>Presenting 4 scanned pages, one set all caps (ugh); has “Q.” </p>
    <p>Pages scanned 300 DPI; page measures 9 1/8” tall</p>
    <p>Please identify typeface, also point size (if possible).</p>
    <p>Book has 300+ pages. Let me know if you want more scans particular letters (upper / lower case.</p>
    <p>If you need 600 or 1200 dpi scans, it will take a month to get since book is in a library in another city. But I will get them if you need them.</p>
