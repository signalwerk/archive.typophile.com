    html: |-
      <p>The font used in the samples is Linotype's hot metal Old Style No. 1 with Ronaldson conversion. I measured the type and think it is 10 pt.</p>
      <p>FYI, the Ronaldson conversion characters are /C /E /F /G /L /S /T /AE /OE and /ct in the Roman, Small Caps and Italic. In addition, in the Roman are these:  /3 /5 /6 /7 /9 and  /.  /:</p>
      <p>Whoever typeset it was pretty sloppy with their use of the Ronaldson conversion characters, mixing the normal characters and Ronaldson conversion characters, sometimes in the same word. This probably happened because the conversion characters got mixed into the font's magazine by mistake.</p>
