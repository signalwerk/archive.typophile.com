      <p>I like the red Dunlop Tortex picks myself. I recently picked up some of <a href="//www.musiciansfriend.com/product/Dunlop-474R-STUBBY-JAZZ-PICKS?sku=110080" rel="nofollow">these Dunlop stubbys</a>, and though they take some time to get used to, they're quite nice. Takes a fairly different style of playing though.</p>
