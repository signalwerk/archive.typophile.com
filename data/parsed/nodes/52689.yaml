      <p>Here's what the "real" one looks like:</p>
      <p><img src="/sites/default/files/old-images/hoverboard_3878.jpg"></p>
      <p>The lettering on the replica on Gizmodo is pretty close, but not identical. In both cases the lettering is just crudely drawn, not any typeface I've ever seen. It's sort of similar to Korinna, but it's hard to tell if that was on purpose. </p>
      <p>I would recommend tracing from the video frame. Short of getting hold of the prop, that's about as close as you're going to get.</p>
