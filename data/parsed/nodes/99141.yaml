      <blockquote><p>nay on fonts.</p></blockquote>
      <p>I wonder if this is a bug or a feature... And if it's the latter, is it to make Illustrator more valuable, or to forestall bad typography (like how ID doesn't force-Italics, or at least makes it harder)?</p>
      <blockquote><p>is someone gonna come along and say ....</p></blockquote>
      <p>Glad to see agreement on this.<br>
      BTW Charles, if you intend to never break a EULA I think the first step when you want to modify a font with a no-mod clause is to ask the font house for permission; especially if it's a very gentle, across-the-board mod they might be pretty likely to say yes. On the other hand modifying a font is much more time-consuming (read: expensive) than the sort of solution you seem to be looking for, so maybe that's a non-starter.</p>
      <p>One thing to note here BTW is that the latest version of FL has inherited Fontographer's weight-change algorithm, which means it's much improved.</p>
      <blockquote><p>FB have many of our families in this state</p></blockquote>
      <p>Impressive.</p>
      <p>hhp</p>
