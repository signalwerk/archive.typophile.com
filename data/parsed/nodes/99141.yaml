    html: |-
      <p><cite>Ruin</cite> a typeface? Usually I'm trying to save one.</p>
      <p>Sure, I can edit the beziers, but some licenses forbid that. When you have to use one of those silly fonts, what to do? Fortunately, we're fast approaching the point where you can do most of the things in a layout program that you can do in a font editor. Even better, looking only at the print edition, who could tell  where the work was done?</p>
      <p>But aside from that, lightening might be useful when, say, the font was drawn using a 12-pont master, and you need to set 42-point display. Not as good as starting over and drawing up a set of glyphs designed to work at that size, but (maybe) better than nothing.</p>
      <p>Remember that post by the person who complained that at a large size needed for the title page, Trump looked too heavy? A .02 point or so reduction in stroke would help a fair bit, I'd think.</p>
