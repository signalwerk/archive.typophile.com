      <p>Trying is wonderful. Succeeding isn't half bad either. Suffice it to say that type designers (even the -generally- low-end "open" variety) don't derive weights* [exclusively] through algorithms**, and any algorithms they might use aren't as brutish as stroking. Are they wasting their time?</p>
      <p>* Even super-subtle "grades", like at FB.</p>
      <p>** <a href="http://www.typophile.com/node/81774" title="http://www.typophile.com/node/81774">http://www.typophile.com/node/81774</a></p>
      <p>Concerning what to do about EULAs: I've always advised ignoring unreasonable clauses at will, while remaining prepared to pay for getting caught. Just like I can't advise people to take the "nothing must be hanging from the rear-view mirror" traffic law seriously. So: go ahead and modify any font, just make dead-sure it doesn't leave your drive. Unless there's an ethical impediment, which might cost you.</p>
      <p>The things at play here are quality, ethics (not violating a EULA) and economy (not commissioning a custom weight). Everybody will find a different balance, but I for one class the first highest (unless my own ethics happen to coincide with the font house's).</p>
      <blockquote><p>we're fast approaching the point where you can do most of the things in a layout program that you can do in a font editor.</p></blockquote>
      <p>If you mean what one can do manually: no way. If you mean what one can do algorithmically: even in font editors it's not good enough.</p>
      <blockquote><p>looking only at the print edition, who could tell where the work was done?</p></blockquote>
      <p>It's not just about what a reader's conscious eye notices; stuff happens -and goes wrong- way deeper than that. To be fair though if we're talking about minute amounts it's generally OK (although it does depend on the font in question).</p>
      <blockquote><p>(maybe) better than nothing.</p></blockquote>
      <p>That would be one massive Maybe.</p>
      <p>hhp</p>
