      <p>"...I'm really doing is exploring the always-legal ways to modify the appearance of font using a layout program..."</p>
      <p>So, it's a font. Is the designer alive?</p>
      <p>Reason I ask, is I would not use InDesign to stroke a font lighter for a couple of reasons. First, it seems that all other stroke-able objects allow one to specify where the stroke is going, (inside, outside or on the contour), but nay on fonts.  And second, as you see in an <a href="http://twitpic.com/bpunnc/full" rel="nofollow">"Illustrator vs InDesign"</a> comparison, InDesign (CS3) cannot seem to stroke simple postscript curves. Both treatments contain identical specs for a .5 pt white line, same color background, same font, same glyphs. (Look at InDesign's take on the tails of /h and /i!? (Maybe it doesn't print this way, but I'd check every glyph I was stroking with ID.)</p>
      <p>So, (and I remember Toronto as a lamb-chop-bone to my throat between courses forcing a promise of either Pilgrim or Juliana, and then dessert... thanks) — old school says adjust the process, doesn't it? New school may or may not say change the font, but if it's important enough to one, get on with it... or is someone gonna come along and say, "Hey, That's my font, but it's so light? I'm gonna get you! " No. ;)</p>
      <p>I wish we had variation technology in the OSs. FB have many of our families in this state, ready willing and able to deliver size masters, weights, widths, grades and animations. But the Janitors are scared of extending what was designed as extendable, (the SFNT font format). "Adding tables would break every single application on the face of planet earth." (And then they add tables and wrappers useless to users, that break no new ground, but apps still have to rewrite to use 'em.) </p>
      <p>What can you do, 'cept go underground:)</p>
