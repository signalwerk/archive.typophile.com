      <p>Pity the poor artist or customer service person who is trying to match what you did four years earlier in reducing the weight of a headline, who isn't aware of such a technique and has just spent an hour or more going through type catalogs trying to find the vendor that made that particular weight because the one he/she has on hand is <em>slightly</em> heavier, and the boss and/or customer insists it has to be an exact match.</p>
      <p>Perhaps I'm just too old-school, but I have a strong aversion to modifying types from their original look.</p>
