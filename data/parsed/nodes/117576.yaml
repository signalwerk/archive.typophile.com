      <p>There are nine AW Conqueror fonts. They are indeed free. If you do not already have a Typofondrie account you need to create one. You want the AW Conqueror Didot Light. The swash letters are called A.alt etc.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AWConquerorDidotSwashLetters_6452.jpg"></div><br>
      I have no information on an outline version.<br>
      Don<p></p>
