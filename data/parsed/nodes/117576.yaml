      <p>I found the custom printer in Syracuse, NY, who created these letterpress invitations, and their inspiration gallery features another invitation that uses the same typeface:</p>
      <p><a href="http://www.bellafigura.com/letterpress-inspiration/" title="http://www.bellafigura.com/letterpress-inspiration/">http://www.bellafigura.com/letterpress-inspiration/</a></p>
      <p>It appears to be an outline version of AW Conquerer (italic glyphs) designed by Jean François Porchez. It is available (seemingly for free) at typofonderie.com.</p>
