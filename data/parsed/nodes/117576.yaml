      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AWConquerorDidotInlineG_4485.jpg"></div><br>
      Here is G in the style of the outline font used in the invitation.<br>
      The recipe is to use a parallel lines feature in a program that can manipulate fonts, set the lines at 10 points in and 10 out, and edit to delete unneeded lines. To make the tangle of lines easier to handle, I did it in three stages: 1. 10 points out; 2. 10 points in for the fill; 3. paste the cleaned up fill from 2. into the cleaned up outline from 1. I  used Fontlab. There are other tools.<br>
      Don<p></p>
