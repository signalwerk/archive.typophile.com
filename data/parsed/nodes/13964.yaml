    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Hinting</strong></p>
    <p>Hinting, more accurately called instructing, is a method of specifying how <a href="/wiki/digital%20font" class="freelinking" rel="nofollow">digital fonts</a> display at small sizes on low-resolution devices, usually for on-screen usage. This is accomplished by providing instructions in the font file that define which pixels are turned on when producing <a href="/wiki/bitmap" class="freelinking" rel="nofollow">bitmap</a> images.</p>
    <p><strong>Discussion:</strong><br>
    <a href="31317" rel="nofollow">Generating TT OpenType Fonts</a><br>
    <a href="27444" rel="nofollow">Wonky hinting</a><br>
    <a href="15436" rel="nofollow">To autohint, or NOT to autohint...</a><br>
    <a href="31448" rel="nofollow">Hints, good or bad? Is it really needed?</a><br>
    <a href="15812" rel="nofollow">When is the better time to hint?</a><br>
    <a href="60633" rel="nofollow">Legend of Raster: Glyph's Quest for Pixel Solace</a><br>
    <a href="57993" rel="nofollow">Who else wants to understand hinting?</a></p>
    <p><strong>Technical Discussion:</strong><br>
    <a href="69902#comment-410009" rel="nofollow">John Hudson on autohinting TTF fonts from FontLab <em>in</em> Trying out Typekit</a></p>
