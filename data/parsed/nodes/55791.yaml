      <p>I think your typography has improved in the most recent post. </p>
      <p>All the copy doesn't need to be, and probably shouldn't be, the same size. </p>
      <p>You really need to make the colors you choose match the country on the poster (Italy-green/red, America-red/blue, etc.). </p>
      <p>I think the Colosseum and the Sydney Opera house silhouettes looked good, they just needed to be incorporated better with the type and color schemes. </p>
      <p>Try making "Explore Italy" the biggest type, add the Colosseum illo back in, put the supporting type in 1/2 or 1/3 the size of your "headline" and incorporate the green/white/red color scheme.</p>
