      <p>I think before thinking about gradients and color, you should sort out your typography. I still agree with bemerx that "you want people to read it and not feel they were yelled at", which was also what I was trying to get at in my first reply to this.<br>
      That said, your most recent mixed-case variation yells less, but looks a bit like you haven't spent a lot of time playing with different typefaces, font sizes, arrangements, with the leading and the line lengths, and the placement of the illustration (which might also benefit from a more refined treatment).<br>
      You've got so many variables at your disposal – already in the "purely graphical" realm, i.e. before you reach color. Play with them! :-)</p>
