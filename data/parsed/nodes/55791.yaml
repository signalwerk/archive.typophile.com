    html: <p>Maybe choose a bit more of an airy color scheme? Something that suggests air-travel and freedom. Light blues. Maybe some dark blues, suggesting ocean. And if you pair it with a nice, clean sans-serif - upper and lower case as you want people to read it and not feel they were yelled at - you may be able to convince people that these flights are economical which may be a key selling point in these economic times. Maybe also throw in a flat, silhouette illustration of something unique and easily recognizable to the destination being served - but be careful that the illustration item is not too cliché (I'm specifically thinking of kangaroos).</p>
