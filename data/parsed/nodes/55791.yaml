    html: |-
      <p>Well the last image is the best yet but Nina's suggestions are spot-on. Think about what you're communicating and think of the "tone" and "feeling" that you want to communicate. Play with your typefaces and find a family (or two) that help capture that. Then use 1 or 2 fonts from those families in such a way that you capture that feeling while balancing it with the layout. </p>
      <p>Design is about problem solving with multiple variables all which need to be balanced successfully. It's challenging yet very fulfilling. Advertising is design but with a focus on wish fulfilling. What's the wish? How will BA fulfill it? And I think it's less about "cheap flights" and more about "good value and excellent service".</p>
      <p>You might want to check out ads in say, National Geographic or in some traveling magazine, and see how other designers solve similar problems. Look at the type that they use and see if it helps invoke feelings appropriate to the message.</p>
      <p>And finally, don't get frustrated. Stop and take a break by doing something completely unrelated to this project (or even design in general). Then come back to it later.</p>
    html_clean: |-
