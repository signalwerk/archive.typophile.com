      <p>A few quick comments:<br>
      1) That uppercase bold sans speaks pretty dam loud, but then it takes a long time to read. Maybe consider a mixed-case setting?<br>
      2) The color scheme says France to me, not Italy. I'd change the blue to green. If you need the blue for CI reasons, I wouldn't use it on the word "Italy".<br>
      3) The colosseum in the corner, while I like its graphical treatment, looks a bit like an excuse to squoosh in an image after all. You might try making it more prominent and exploring ways the type can interact with the image.<br>
      4) On the detail level, there's some kerning to work out ("AIRW A YS").</p>
