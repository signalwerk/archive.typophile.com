      <p>I like where you started with the very first poster. While it's not perfect, it has more interest than the watered down versions.</p>
      <p>While the all caps does look like yelling, perhaps de-emphasizing some of the less important words would make it more readable. </p>
      <p>with our<br>
      HUGE DISCOUNTS<br>
      there has never been a<br>
      better TIME TO<br>
      EXPLORE ITALY<br>
      with BRITISH AIRWAYS</p>
      <p>...or something like that. Needs work, but the idea is get the consumer to see a more direct message right away.</p>
      <p>Also, I like the graphic of the colusseum and the opera house. It has a nice negative/positive space feel to it - it just needs to be worked into the design better.</p>
      <p>hope that helps.</p>
