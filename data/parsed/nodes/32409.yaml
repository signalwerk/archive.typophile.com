    html: <p>Aaux has a problem with tiny counters in the heavy weights. It looks like there was some corners cut in the extrapolation process. For more info, read about the <a href="http://vllg.com/Thirstype/ApexNew/Example+About/" rel="nofollow">improved Apex</a>, which might not be a bad alternative itself.</p>
