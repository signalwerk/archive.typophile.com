  html: |-
    <p>I am currently replacing the current typeface for a publication that was previously using “Swiss” for the body copy. We would like to have a Humanist sans family that is large like Aaux Pro <a href="http://www.typetrust.com/fonts/font.php?id=MzE5" title="http://www.typetrust.com/fonts/font.php?id=MzE5">http://www.typetrust.com/fonts/font.php?id=MzE5</a> The reason why we are not using Aaux Pro is because our sister magazine is now using it. I did find Joshua Darden’s font Freight Sans to be quite nice as well <a href="http://www.joshuadarden.com/shop/freightsans.php" title="http://www.joshuadarden.com/shop/freightsans.php">http://www.joshuadarden.com/shop/freightsans.php</a> it just needs the H&amp;JS to be loosend up a bit. If you could give me your opinion on these two that would be fantastic. and if you have any suggestions of other fonts that would be much appreciated.<br>
    The fonts I was previously looking at were:<br>
    Alber<br>
    Corisande<br>
    Depot<br>
    Flama<br>
    FF Meta<br>
    FF Scala Sans<br>
    lisboa<br>
    Mundo Sans<br>
    Vista Sans<br>
    Whitney</p>
