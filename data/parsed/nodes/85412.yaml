      <p>In Lion,  Hoefler regular, italic, bold and bold italic are in a .ttc file, and the ornaments are in a separate font file "Hoefler Text Ornaments.ttf", and moreover they  are in the PUA and the character viewer does not display the glyphs in the PUA. Here is the best I found: you can  insert them in Pages by clicking on the character with the right unicode number in the character "viewer" even if it is not displayed (after selecting the Hoefler Text Ornaments font). Here are the numbers:</p>
