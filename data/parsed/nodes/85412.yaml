  html: |-
    <p>Hello All:</p>
    <p>It seems Apple took a step backward with the new character palette with Mac OS X Lion.</p>
    <p>I’m trying to access the ornaments in Hoefler Text for use within Pages and the only typeface the Character Palette is showing is Lucida.</p>
    <p>Does anyone know how to help with this one?</p>
    <p>Thank you in advance,</p>
    <p>Mike Diaz :-)</p>
