    html: |-
      <p>I think there is probably no one who can see why Apple decided to do away with the very useful general ability to view/input all the glyphs in a font which was found in previous versions of Character Viewer (View = Glyph).  Let them know you want it back here:</p>
      <p><a href="http://www.apple.com/feedback/macosx.html" title="http://www.apple.com/feedback/macosx.html">http://www.apple.com/feedback/macosx.html</a></p>
      <p>The Dingbats category is the only one where you can select a font.  If they had not provided that, I think it would be essentially impossible to use any of those 4 fonts in many apps.</p>
