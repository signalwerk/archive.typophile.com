      <p>I agree, the S needs more “horizontality”.<br>
      I think that the top should be somehow closer to the C for example, and remember to keep the waistline quite low, like you did on the 5.<br>
      I'm also not very sure about the 6, the bottom part seems a bit awkward I reckon. I might be wrong, but I think it needs to be a bit wider.</p>
