      <p>Hi Reid. Great job so far. This looks like a fun project! It is very cool that you're basing your design on this pre-existing vintage signage.</p>
      <p>Something doesn't feel right with the S. I wonder if you could try to bring some of the top-heaviness consistent with the rest of the alphabet into the S. You might do well to depart from the S that is given in the signage.</p>
