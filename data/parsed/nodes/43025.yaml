    html: "<p>Don't use Dolly: yes, it's charming, but it lacks a bold italic, which you will need sooner or later, and the base weight is a little too heavy, esp if your paper stock is slick. Zingha, Proforma, Bitstream Iowan (available with OSFs as a separate bundle), and especially Esta (which is also inexpensive) have appeal similar to Dolly with no problems. Poynter Text Roman One, ITC Bodoni 12, Filosofia, Warnock, Quadraat, Scala, and Celeste each have a very distinctive appeal, but without problems or missing fonts. Take a peek.</p>"
    html_clean: "<p>Don't use Dolly: yes, it's charming, but it lacks a bold italic, which you will need sooner or later, and the base weight is a little too heavy, esp if your paper stock is slick. Zingha, Proforma, Bitstream Iowan (available with OSFs as a separate bundle), and especially Esta (which is also inexpensive) have appeal similar to Dolly with no problems. Poynter Text Roman One, ITC Bodoni 12, Filosofia, Warnock, Quadraat, Scala, and Celeste each have a very distinctive appeal, but without problems or missing fonts. Take a peek.</p>"
