    <p>Hey all, first post, although I've been lurking for a long time :)</p>
    <p>I need to make a 6-page spread for the internet TV station Diggnation.</p>
    <p>I would very much enjoy using 'Sauna' by Underware as the Title typeface. (<a class="freelinking external" href="http://www.underware.nl/site2/index.php3?id1=sauna&amp;id2=overview" rel="nofollow">Underware's Sauna here...</a>)</p>
    <p>What do you people recommend me to use for the body copy itself?</p>
    <p>I'm a little new at this thing and I just don't have the typographic sensitivity (yet) that you guys have!</p>
    <p>Thanks a ton for your input,<br>
    innovati!</p>
