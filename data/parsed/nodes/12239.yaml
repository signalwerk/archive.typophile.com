      <p>&gt; Nazi use of Blackletter failed to make it taboo in the way it did the swastika.</p>
      <p>Not to the same extent certainly but the ill feeling is most<br>
      definitely still with us. Sometimes quite explicitly, like in<br>
      the writing of Heller. There's really no denying this.</p>
      <p>&gt; anti-defamation league and similar groups have not objected to Blackletter</p>
      <p>And what do they say about fonts in general? Nothing. If fonts<br>
      became an overt PR tool, you bet they'd chime in against it.</p>
      <p>&gt; As for the swastika, I agree with Hrant, it is not worth the bother.</p>
      <p>It's not worth the bother <cite>nominally for a typophile</cite> because we have bigger fish to fry. If I were a symbologist, or even just a graphic designer, I would try to bother. At the very least, even as a layman, I would be -and in fact am- opposed to the continued demonization of the swastika to the point of preventing uninvolved cultures from using it. What I'm getting at is that things like this shouldn't happen: <a href="http://news.bbc.co.uk/2/hi/europe/5268950.stm" title="http://news.bbc.co.uk/2/hi/europe/5268950.stm">http://news.bbc.co.uk/2/hi/europe/5268950.stm</a></p>
      <p>hhp</p>
