    <p>I know <a href="/wiki/blackletter" class="freelinking" rel="nofollow">blackletter</a> gets talked about all the time on here, and i'm sorry to bring it up again but i've just been doing some Steven Heller research on his writings on the swastika and blackletter ('Swastika chic' 'designing hate' and 'Hitler's children: Nazi iconography in contemporary design') and i'd like to know if anyone knows of any resources; books or online that provide an opposing view.</p>
    <p>I'm also looking into the possibility of blackletter becoming fashionable due to a decorative revival, if anyone knows of any resources or has any opinions then i'd love to hear them.</p>
    <p>Thankyou.</p>
