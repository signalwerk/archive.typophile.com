      <p>&gt; That would require explaining the root of the<br>
      &gt; symbol and how the Nazis changed/misused it.</p>
      <p>I don't think that's how terminology works, or at least can work. Partly from my own experience (with "bouma" and "notan") my impression is that you can make quite a lot of headway -even all the way into the mainstream- simply by bullishly using a new term (especially if it's not really totally new) but spending a good deal of time explaining. Here's what I think would be a typical exchange:</p>
      <p>You: The Nazis ... blah blah blah ... using the Hakenkreuz to ... blah blah blah.<br>
      Layman: What's a Hakenkreuz?<br>
      You: It's the Nazi version of the swastika.<br>
      Layman, version 1: Huh.</p>
      <p>Layman, version 2: Why not just call it a swastika?<br>
      You version 1: A few reasons. One is that the swastika was actually an ancient symbol for <cite>good</cite> in many cultures, and we should try to clarify the difference. It's just good terminological practice. (Optional: And we should try to fix every single thing the Nazis ruined.)</p>
      <p>Layman, version 1: You're trying to minimize the Holocaust aren't you?!<br>
      You: NEXT!</p>
      <p>Layman, version 2: Huh.<br>
      You: Tell you what, let me show you some fraktur type...<br>
      Layman: Huh?</p>
      <p>hhp</p>
