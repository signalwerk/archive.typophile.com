      <p>You can find a pile of useful books on the subject by doing an Amazon search for Swastika. As for the fashion of reviving Blackletter, the topic has come up before, and it usually seems to end up with people realizing that Nazi use of Blackletter failed to make it taboo in the way it did the swastika. As someone else pointed out to me in a previous thread, the anti-defamation league and similar groups have not objected to Blackletter, so I think it’s safe to say the world does not care.</p>
      <p>As for the swastika, I agree with Hrant, it is not worth the bother.</p>
