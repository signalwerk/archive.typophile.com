      <p>I think the decorative revival theory is valid. Practically all of my ambigram clients want blackletter. They don't know what it's called, but they describe it as "fancy" and "sophisticated". I know this is in part because they think ambigrams have to look like the ones in Angels &amp; Demons, but more importantly, I think they see <em>value</em>, and therefore <em>class</em>, in the decorative appearance of blackletter.</p>
      <p>I think this accounts for the rapper usage too. Look at street culture's "bling" fixation. My guess is that their intention is not so much to choose an "evil-looking" font to look badass, but to choose a "fancy" font to indicate their wealth, just like all the gold chains, Cadillacs, and those flamboyant pimp clothes.</p>
