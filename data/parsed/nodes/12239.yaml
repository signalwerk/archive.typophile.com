      <p><cite>One nice thing about this article is that it gives me an idea of how the swastika could embark on the (long) road to redemption: we could simply start calling the Nazi one Hakenkreuz.</cite></p>
      <p>Redeeming the swastika by changing the name is sort of a lost cause. That would require explaining the root of the symbol and how the Nazis changed/misused it. By the time I get halfway through that lecture most people have stopped listening. Better to just let sleeping dogs lie and stick with the thousands upon thousands of symbols that aren't verboten in the Europe and North America.</p>
