    html: |-
      <p>Thanks Mike, that label is exactly what I'm referring too—I guess I didn't search hard enough on the museum website for an example to pull.</p>
      <p>It was the lowercase 'w' and 't' that really caught my attention in the museum. In the regular Documenta Sans, neither seems to match, but the capital 'W' and the smallcaps 'w' do match the one from the museum. The lowercase 't' from the museum has a more aggressive upward flair to the tail. In fact, as I'm flipping back and forth between the label sample and the Documenta Sans sample I feel like the museum sample is slightly more angular and aggressive in general whereas Documenta carries more roundness—I'm seeing this in the connections for the 'n', 'm', and 'r'. But then other forms like the '8', 'g', and italic 'f' seem to be spot on.</p>
      <p>I guess I was wrong that I felt like I should recognize the type, which is a relief then to my pride since I couldn't. Of course, now my curiosity is in full strength and I absolutely have to know what they use.</p>
    html_clean: |-
