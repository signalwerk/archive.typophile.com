      <p>If this is the lettering you mean, it seems very close to Documenta Sans from the <a class="freelinking external" href="http://www.dutchtypelibrary.nl/" rel="nofollow">Dutch Type Library</a>. Look at the numerals, especially the 8, and the italic letters. The only disconnect seems to be the W, which looked like the legs crossed fully in the Museum sample. For some reason, the idea of further customizing what is already a very expensive font, seem like gilding the lily, but there must be some money there I'd guess.</p>
      <p>Can anyone find a better match?</p>
      <p>- Mike Yanega</p>
