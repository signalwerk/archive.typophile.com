    <p>I visited the MCA the other day and was perplexed by the type they were using on the walls for their gallery descriptions. It looked distinct enough that I felt I should recognize it, but was unable to come up with a name. I have also been unable to find it in my rather limited collection.</p>
    <p>I wasn't able to snap an example, but I'm hoping maybe someone out there is familiar enough with the museum to know.</p>
    <p>Thanks.</p>
