      <p>Jason, the longer I look at the sample and the font, I agree there are differences, but I can't come up with anything closer. I also looked closely at Haarlemmer Sans, also from DTL, which is quite similar in some respects, including the 't', which seems to match the sample better. However, Haarlemmer's italic is quite different. </p>
      <p>It's a mystery so far, and I love these kinds of challenges. I have written to the Museum via their web site to see if someone would tell us what typeface they used for their labeling. I will let you know if I get a reply.</p>
      <p>- Mike Yanega</p>
