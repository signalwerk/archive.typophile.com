    <p>Six weeks away from graduation, and I am redoing yet another résumé. I have really focused a lot on typography through my studies, and am planning on furthering my education into grad school. Essentially, I do need this to look good, and be typeset well. Below are the specifications and the details about the design.</p>
    <p>Size= 7.25 x 10.25<br>
    Typeface Indetification-<br>
    Name and Footer= Meridien Roman<br>
    All other= Kepler</p>
    <p>My main concerns are:<br>
    1) That the hierarchy is clear, easy to follow, and understandable.<br>
    2) It has been brought to my attention that I have used a category to seperate my “Technical Qualifications”, where as I have not included categories for “Education” and “Experience” for it would ruin my hierarchy. It is my opinion that these two categories are not needed, as the first two things on a résumé are typically your education and your previous experience. The question of flow is really the one posed, as some seem to feel that this omission causes an interruption.<br>
    3) I have utilized small caps in the sentence fragements where necessary, however, the term “OSX” baffles me. Should this be set in standard magiscules, or do they cause an interruption in the typography?<br>
    4) At this point, I have not yet decided how exactly I am going to orient the text block on the page, wether it be justified left with a larger right margin, centered, or what have you. If you have an opinion on this as well, I am more than open to hearing what you have to say. </p>
    <p>I really appreciate any suggestions and criticism, and the harsher the better. A dilutted opinion is one less valueable to my goal. Thanks.</p>
