      <p>I have always been told that n-dashes are preferred, as opposed to a standard hyphen. An m-dash does seem rather obtrusive in length for the use in dates, at least with Kepler. I suppose I could just substitute a glyph from one of the condensed weights to remedy this however. Perhaps you can recommend a font that has well proportioned m and n-dashes that I could view to gain a better understanding of just what a well proportioned dash should look like, width wise.</p>
      <p>I also avoided periods upon another recommendation. I felt, as others did, that since I have avoided using complete senteces, that puntuation was not necessary. Additionally, I chose the word “comprise” based on the recommendation of Strunk and White. Their definition relates that this term literally translates to “embrace”. I don’t mind changing the word though, it is really not a big loss either way, although I would prefer to correct it so that I position the writing to affect the middle 80% of the population whom have the average understanding of grammar and spelling. This seems to be the best tactic, as the bottom 10% and the top 10% of designers are clearly not where I am aiming as of just yet, being not a seasoned designer myself.</p>
      <p>Thank you for your suggestions, they are appreciated.</p>
