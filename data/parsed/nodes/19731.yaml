      <p>In my opinion, as far as I can gather from a quick glance.</p>
      <p><strong>Dash issues:</strong><br>
      I’d question your use of n-dashes instead of hyphens in your body text;<br>
      I’d also question your use of n-dashes instead of m-dashes in your dates.</p>
      <p>I have neither Meridien nor Kepler. Their respective hyphens may be longer than usual (it seems so), nevertheless I’d use m-dashes for your dates.</p>
      <p><strong>Grammar issues:</strong><br>
      I’d question your omission of full-stops (periods to the American English folk).<br>
      I’d hyphenate the words “print” and “based” to read “print-based”.<br>
      Things are “comprised of” other things.</p>
      <p>Hope this helps.</p>
