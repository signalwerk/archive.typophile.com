    html: |-
      <p>No, don’t do that mad_grab. I have had some many different résumé’s at this point, so, its not like I don’t understand where you are coming from. I did not really set out to break any standards, and I typically do prefer to set well proportioned, fully justified text than to have ragged, unbalanced lines of type. I do do both, but on this occasion, I felt it better to keep it simple, the old KISS principle. The lack of character might be bad, but really, I aimed at again,  easy readability. I was surprised to hear Prakash Nair comment on the length, as its far shorter than any other résumé I have done in the past, its not even on a full 8.5 x 11 sheet. Also, I should point out that the character comes through the paper based on the stock that I have chosen to print with. I ran across it really on accident, its a laid text weight from Neenah, that is actually a light blue, you can view a sample <a href="http://www.neenahpaper.com/itemlisting/index.asp?ft=Home&amp;s=Laidc&amp;b=05&amp;c=CBL">here</a>. I think that this lends enough character, plus the odd size, to set me apart. </p>
      <p>I agreed although about my name and contact info, I will make those items more prominent. After all, those are rather important items of information.</p>
