      <p>Hello PDM,</p>
      <p>welcome to Typophile.<br>
      I recommend you reading the 2-epsiode introduction to the <a href="http://www.fontshop.be/details.php?entry=230">work of a typedesigner</a> by <a href="/wiki/Yves%252BPeters" class="wiki">Yves Peters</a>, and <a href="http://www.letterror.com/content/value/index.html">The Value of Type</a> by <a href="/wiki/Erik%252Bvan%252BBlokland" class="wiki-create">Erik van Blokland</a>. Furthermore, have a look at the <a href="/wiki/FAQ%252BFree" class="wiki">FAQ Free</a>.</p>
      <p>Microsoft Windows comes with a handsome sans-serif font family by <a href="/wiki/Joshua%252BDarden" class="wiki">Joshua Darden</a>, the designer of Freight. <a href="/wiki/Corbel" class="wiki-create">Corbel</a> has four weights, very wide language support (including Cyrillic and Greek), small-caps, various figure styles and more. Note that Corbel is <a href="http://typophile.com/node/38272">not a free font</a>.</p>
      <p>BTW, here’s a link to <a href="http://www.dardenstudio.com/typefaces/freight_sans">Freight Sans</a>.<br>
      F</p>
