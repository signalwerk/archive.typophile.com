      <p>I've finished the character set with the exception of glyphs based on others (such as diacritical variations). I've made a number of changes to the existing glyphs, added many new ones, and finally given up on the Bell Gothic issue. No more pseudo-serifs on the /I/. That one was just a matter of time.</p>
      <p>Lastly, bear in mind that this font is still devoid of metrics and is currently relying solely on Illustrator's optical kerning. Each typeface has the same sidebearings of 35.</p>
