      <p>Thanks very much!</p>
      <p>I tried horizontal cuts, and it had some benefits, but ultimately it looked less event (since the negative space was only being applied to one axis) and made consistency across the entire set of glyphs more difficult. With a few intuitive exceptions, the traps always come in at the halfway point of the angle of the intersection, which gives them a logical direction I can easily apply to any case.</p>
      <p>Here are two new PDFs, one with a plain character set and another with a pangram. Still no metrics. And of course, this is a display face intended mostly for titling, but I consider a big block of body text (for which it's most certainly not intended) a good way to vet it.</p>
