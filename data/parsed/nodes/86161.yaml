      <p>• Adding ink traps helped, but it's still not good enough. They differ in size compared to bigger, "normal" ink traps. Or try a variant with straight cuts, something like this:</p><div class="imageWrap"><img src="http://typophile.com/files/E_4207.PNG"></div><br>
      Also: <div class="imageWrap"><img src="http://typophile.com/files/B_3751.PNG"></div><p></p>
      <p>• "Ultra-minimal" optical correction is the one where horizontals and verticals appear to have the same thickness. It's the required minimum. Forget math. What only matters is how it <strong>looks.</strong> (I know there was correction - I used a ruler).</p>
      <p>• /I/ serifs <strong>have</strong> to be either removed OR made as thick as stems. Because current thickness aren't used anywhere (see #1 rule of typeface design above). It doesn't feel right at all, it's a stylistic alien.</p>
