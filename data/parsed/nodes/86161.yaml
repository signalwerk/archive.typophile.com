    user: 23823
    date: 2011-10-18T00:25:00
    date_raw: 18 Oct 2011 — 12:25am
    votes: null
    html: |-
      <p>I've finished the character set and given it what I consider "good enough" metrics and kerning. The spacing isn't going to win me any awards, but I think it's more or less on par with the typefaces that inspired it (Trade Gothic Bold, Univers Condensed Bold, etc.)</p>
      <p>I'd like to get some feedback on how it seems to perform before I move on to releasing it for general consumption, so I've uploaded a beta version here:</p>
      <p><a href="http://www.alexvaranese.com/transfer/amv-antechamber_beta_zero.ttf" title="http://www.alexvaranese.com/transfer/amv-antechamber_beta_zero.ttf">http://www.alexvaranese.com/transfer/amv-antechamber_beta_zero.ttf</a></p>
      <p>I've also added the lowercase set, which is actually a collection of alternate uppercase letters with heavy fills inside counters and between strokes. This particular feature ties directly into the video piece it's being created for, so it might make sense to ignore these entirely for the purpose of testing. The typeface is pretty conventional aside from the loweracse alts, and that's where I'm looking to vet it as thoroughly as possible. The alts are just a bonus for people like me that have specific use for them.</p>
      <p>As a display face, I want it to be solid, reliable and usable, but it of course doesn't need all the nuanced perfection of a text face, especially since its intended application (titles in a video piece) tend to be hand-kerned a little anyway. But I'd like to make sure it doesn't strike anyone as a total mess.</p>
      <p>The final version will be free, of course, so I'm not looking to "protect" anything here, but this beta has "BETA ZERO" written into the zero and letter O characters just to make sure anyone who helps me test this doesn't accidentally leave a potentially unfinished font installed.</p>
      <p>Any feedback would be great. Thanks!</p>
