      <p>First of all, letters with ink traps look like from one font, letters without - from second, and /I/ - from third different font.<br>
      Font with ink traps would be interesting, while the one without is quite generic.</p>
      <p>Make all horizontals narrower for optical correction. Look at /T/ or /L/.<br>
      Get rid of /I/ serifs.<br>
      Try to apply ink traps whenever possible. For 90° connections, maybe cutting in at 45° angles would work.</p>
      <p>Style unity in the typeface is the most important thing. What this one here doesn't have yet.</p>
