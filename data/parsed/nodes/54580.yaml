    html: <p>When I first started interning as a designer (all of three years ago) I was shocked that the design office was a desk with a computer and a scanner. I’ll never forget my summer at an ad agency when I drove people nuts by showing up at concept meetings with piles of sketched ideas. I prefer working at home because I have my big drawing board right there, and even though you’ll never see anything drawn by hand in my work, I’ll be damned if I’m ever going to stop working with triangles, brushes, and Micron pens. And I get really confused that so many other young designers don’t want to work at a drawing board.</p>
