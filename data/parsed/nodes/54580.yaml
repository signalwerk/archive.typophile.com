      <p>Some of us are extremely lucky we have the backgrounds we do in the graphic arts. I remember computers (MACs) coming on the scene in NY in 1988. I had a type shop and was the second or third to have a MAC "research &amp; development" area in the shop. I remember telling my customers (mostly book publishers - when they were still independently owned) that the computer was only one more tool - like a t-square and rubber cement were.</p>
      <p>It became so much more than that. So many of us lost our incomes and lives (and not necessarily in that order). Funny how times change... Now everyone can be unemployed - LOL</p>
