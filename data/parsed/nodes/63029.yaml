      <p>I like the idea behind this, but find the same problem with the lc t as Bemerx25.  I also find that arcing problem in the bottom section of the numeral 2.  Also, the p and the q don't seem to work.  It may be that the curve of the descender is too weak.  I'd agree about the lc s and find the ss glyph too perfunctory, as if you have tried to compromise between too much of a difference in size and no difference whatsoever. </p>
      <p>Finally, I find the exclamation mark really jumps from the different text samples because it is very, very heavy. </p>
      <p>That said, I'd love to see the next generation[s].</p>
      <p>mgk</p>
