    html: |-
      <p>Lower case "s" top seems a bit dark and compressed (like it got squooshed by a weight falling on its head). The LC "t" is interesting but perhaps its top is a bit too thin - the left crossbar seems to interact with the curve up to the terminal in a not so nice way - too abrupt perhaps? Maybe ease up on it by lowering the "t" ascender? Overall feel of the typeface is nice enough - it feels like a "Victorian-styled" Courier. Perhaps the comma tail could be extended just a bit more as right now it can be easily mistaken for a period.</p>
      <p>Hope this helps, take with a grain of salt, and ultimately you will need to decide what works best with what you envision for this typeface.</p>
