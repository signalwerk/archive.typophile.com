    html: |-
      <p>I think you obviously need to kern in the M closer to the o and the o closer to the l. Or conversely kern out the l further from the l and the l further from the y. All the letterforms should visually have the same amount of white space between them. The colored counter will alter that a bit but not by much.</p>
      <p>Gerald</p>
