    html: |-
      <p>Hi,</p>
      <p>thank you all for the replies and the great advices. </p>
      <p>@timaarts  @cdunitz @JamesM<br>
      thanks for the advises on the colors, you are definitely right about the orange/red combo and the cold grays, i will try to fix that. About the color/content issue, this is a WordPress theme, not a website for an actual client so the contents will vary, so I will offer more than a color combo to choose from. This one will be the primary one, so thanks for the good advices.</p>
      <p>@Luma Vine<br>
      the circular graphic is a stylized rendition of the paint "The Thinker" by François-Auguste-René Rodin. As I said, this being a theme, the buyers will definitively change the logo with their own, so it is intended to be a placeholder. I will try to render it better anyway. </p>
      <p>@Cristopher<br>
      you are right, here it comes a bit of background: this is not a client website, but a commercial WordPress theme. This theme is conceived for single/multi author weblogs (the version I have posted here is the multi author one, with author pics and info on each article and on the home page, the single author version is very similar except for a text box with author name and some additional info about the article in place of the pic).  My goal with the design was to mix contemporary and classic suggestions to appeal to an audience that produce authoritative and/or in depth content but don't want to appear too academic/dry. Being a WordPress theme obviously I can't have an idea of which the readership will be. Anyway this theme is intended to be a niche one, without the thousands options you often see on commercial themes, totally focused on the actual content , so it's not intended to appeal to the masses.</p>
