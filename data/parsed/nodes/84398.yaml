      <p>@giulianovelli: In an effort to help the group provide you with more meaningful feedback as compared to subjective aesthetic response, perhaps you can tell us a bit about the context: Who is it for? What do they do? Who is the audience? What is their goal? Who will be managing it? What are their resources (time, budget &amp;c). Good design is about fitness for purpose. To do something <em>by design</em> means to make informed decisions based upon an objective understanding of the context.</p>
      <p>In addition, is this personal, professional, or academic?</p>
