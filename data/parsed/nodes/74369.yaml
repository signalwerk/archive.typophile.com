    <p>Greetings.</p>
    <p>I was given the assignment of creating a 'typographic offspring' of two existing fonts. I chose Eurostile &amp; Eames Century Modern to create a sort of 'Americana-Thick-Meets-Outer-Space-Clean' kind of display face. If you could give me any suggestions or critique for what I've got so far, that would be great!</p>
