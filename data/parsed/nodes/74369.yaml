    html: <p>Hmm. Well, it's kind of all over the place and still clearly a chimera. Problems of weight distribution aren't applied consistently. I think if you started with a lighter weight, like medium, you would have more success blending the features together. It would give you room to exhibit the squareness of Eurostile in letters like n where there is no room to do so now.</p>
