    html: <p>Thought it could have been a custom based on <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/garage-gothic/" rel="nofollow">Garage Gothic</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/driver-gothic/" rel="nofollow">Driver Gothic</a> but looks like <a class="freelinking external" href="http://www.ffonts.net/Cargo-Two-SF.font" rel="nofollow">Cargo Two</a> / <a class="freelinking external" href="http://www.dafont.com/kraftfahrzeugkennzeichen.font" rel="nofollow">Kraftfahrzeugkennzeichen</a> (the closest considering the /A's top) / <a class="freelinking external" href="http://www.ffonts.net/GL-Nummernschild-Eng.font" rel="nofollow">GL-Nummernschild-Eng</a> are pretty close. There's also <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/fountain/sauerkrauto_pro/" rel="nofollow">Sauerkrauto</a>, possibly the only version that could be considered as legal.</p>
    html_clean: <p>Thought it could have been a custom based on <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/garage-gothic/" rel="nofollow">Garage Gothic</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/driver-gothic/" rel="nofollow">Driver Gothic</a> but looks like <a class="freelinking external" href="http://www.ffonts.net/Cargo-Two-SF.font" rel="nofollow">Cargo Two</a> / <a class="freelinking external" href="http://www.dafont.com/kraftfahrzeugkennzeichen.font" rel="nofollow">Kraftfahrzeugkennzeichen</a> (the closest considering the /A's top) / <a class="freelinking external" href="http://www.ffonts.net/GL-Nummernschild-Eng.font" rel="nofollow">GL-Nummernschild-Eng</a> are pretty close. There's also <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/fountain/sauerkrauto_pro/" rel="nofollow">Sauerkrauto</a>, possibly the only version that could be considered as legal.</p>
