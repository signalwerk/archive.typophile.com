      <p>Syntax was the typeface I used the first time I got to design a publication on my own. Self taught as a designer I knew relatively little about typefaces then. Syntax just looked the most appropriate of available choices.</p>
      <p>Today, slightly better informed about typography, it feels really special to greet Hans Eduard Meier, the man who designed Syntax, on his birthday.  Many happy returns of the day sir!</p>
      <p>Btw, nearly a decade down that booklet continues to be in use, still doing its job rather well:</p>
