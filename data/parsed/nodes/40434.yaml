    <p>I would like to announce Hans Eduard Meier’s 85th birthday on 30th December 2007. He still is in very good shape and works on his PC (Windows) daily from 6 till 11 am.</p>
    <p>There are different birth dates of Hans in type history and also different spelling (Meyer) due to a mistake in the birth certificate (!). Anyway, the above infos are totally correct.</p>
    <p><a href="/wiki/Hans%252BEduard%252BMeier" class="wiki">Hans Eduard Meier</a> designed <a href="/wiki/Syntax" class="wiki">Syntax</a> Antiqua (hot metal type at Stempel foundry 1968–72), and for the Federal Technical Institute in Zurich Barbedor, Syndor, Oberon, Barbetwo. Meier designed for <a href="http://www.linotype.com/1443/hanseduardmeier.html">Linotype</a> LT Syntax, Letter, and Lapidar. Elysa is a type for <a href="http://www.elsner-flake.de/">E+F</a>, they also worked with Hans on a new ‘Schulschrift’ [School script] for primary schools in Switzerland (<a href="http://www.schulschrift.ch/">www.Schulschrift.ch</a>). The fonts ABC are available at <a href="http://www.elsner-flake.de/">E+F</a>.<br>
    Meier wrote his standard work ‘Development of Script and Type’ (reprint by Syndor Press, now available at <a href="http://www.niggli.ch/">Niggli</a>).</p>
    <p>Hans has always been less known than other Swiss type designers. I’m sure he will be pleased receiving some greetings from one or the other from this list.<br>
    His address is:<br>
    H E M<br>
    Unterkirchen<br>
    8875 Obstalden<br>
    Switzerland<br>
    hem[ät]freesurf[dot]ch</p>
    <p>Thankyou, and good wishes for a great New Year,</p>
    <p>Erich Alb<br>
    Typographer<br>
    Cham/Switzerland</p>
    <p>—<br>
    Hans Eduard Meier’s fonts at <a href="http://www.fontshop.com/fonts/designer/hans_eduard_meier/">FontShop</a> and <a href="http://www.myfonts.com/browse/person/meier/hans-eduard/">MyFonts</a></p>
