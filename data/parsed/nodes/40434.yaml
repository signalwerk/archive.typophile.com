    html: <p>Hans Eduard Meier was walking ahead of me towards the venue for the Linotype Typotechnica in Heidelberg. I drew level with him as he paused at a red light, and together we observed the early morning road, devoid of any traffic whatsoever. I’d noticed in the preceding days that the Germans seemed very respectful of red lights, and never crossed the road against the light, so I thought I’d better wait for the light to change. Hans Eduard, the canny Swiss, turned to me and said ’Come on, we’re not children’, and headed off across the street. For the rest of the walk to the venue, we had a lovely chat about type design and FontLab, which he was just beginning to use. He’s a lovely man, and an admirable jaywalker.</p>
