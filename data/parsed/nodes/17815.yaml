  html: |-
    <p>I have expanded the <a href="/wiki/Diacritics%20Project" class="freelinking" rel="nofollow">Project Diacritics</a> website. Now you can easily attach pictures to particular languages and diacritical marks. We welcome your submissions of fine examples of correct accents. Let's help other designers to create accents for Latin, Greek, Cyrillic, and other scripts.</p>
    <p>Diacritics project is a free on-line database of knowledge and<br>
    experience - how to design correct diacritics (what size, shape and position<br>
    an accent should have). Text concerning the history, use, languages, and<br>
    also some technical information is related to each diacritical mark. The<br>
    project is on-line at <a href="http://diacritics.typo.cz" title="http://diacritics.typo.cz">http://diacritics.typo.cz</a>.</p>
    <p>Everyone is invited to check it. If you would like to edit<br>
    the text, simply Register and Login - every page can be edited, corrected or<br>
    enhanced with pictures by anyone (Wikipedia model).</p>
    <p>Filip Blažek<br>
    info(at)typo(dot)cz</p>
