    <p>Hello all interested readers,</p>
    <p>I would like to inform you about the next MAC application:</p>
    <p><a class="freelinking external" href="http://www.haagseletters.nl/Typecontroller_Haagseletters.zip" rel="nofollow">Download here</a>,</p>
    <p>It's an application based on <a href="http://www.haagseletters.nl" title="www.haagseletters.nl">www.haagseletters.nl</a></p>
    <p>The standalone application features export to PDF, so you can play with the output and use it in other software. The PDF files will be exported to the folder: PDF in your HD root.</p>
    <p>Hope you will enjoy this release.</p>
    <p>I am currently scripting PDF output for the webversion  (<a href="http://www.haagseletters.nl" title="www.haagseletters.nl">www.haagseletters.nl</a>)</p>
