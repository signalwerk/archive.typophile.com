    <p>Hi all! </p>
    <p>I'm doing a website for my favorite pizzeria, and requested one of their old menus for typeface ideas. They came through and gave me this: <a href="http://alecquig.com/roccosMenu1951.jpg" title="http://alecquig.com/roccosMenu1951.jpg">http://alecquig.com/roccosMenu1951.jpg</a>. Can anyone ID any of the four fonts on this menu? </p>
    <p>Thank you for your knowledge! </p>
    <p>Alec</p>
  html_clean: |-
