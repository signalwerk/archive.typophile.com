    html: |-
      <p>You can simplify the feature code more by intesive use of classes:</p>
      <p><code></code></p>
      <pre>feature xxxx {
        @source  = [m n x];
        @target  = [m.alt m.alt m.alt];
        @context = [s a c e o];

        sub @source' @context by @target;
      } xxxx;
      </pre><p></p>
