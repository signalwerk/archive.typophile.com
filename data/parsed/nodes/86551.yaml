    <p>Hello, </p>
    <p>I use the "calt" function for character substitution, and I have a lot of similar glyph lists which are sometimes hard do maintain.</p>
    <p>For example, I have:<br>
    sub m' [s a c e o] by m.alt;<br>
    sub n' [s a c e o] by n.alt;<br>
    sub x' [s a c e o] by x.alt;<br>
    etc.</p>
    <p>My question is can I define a glyph list that I can use for every instance?</p>
    <p>Can I say:</p>
    <p>my list_s = [s a c e o];<br>
    sub m' [list_s] by m.alt;<br>
    sub n' [list_s] by m.alt;<br>
    sub x' [list_s] by m.alt;</p>
    <p>So I if I want to add a character to that list I have to do it in one place, instead of, say 10</p>
