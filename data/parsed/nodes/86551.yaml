    html: |-
      <p>AFDKO syntax is described at</p>
      <p><a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html" title="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html">http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html</a></p>
      <p>I'd actually recommend you *not* think of this as a programming language, per se, but rather simply as the syntax for specifying the structure of OpenType tables. When I first started coding OpenType features I ran into a bunch of problems which were caused by viewing it as a programming language and assuming that lookups behave similar to functions, which is in various respects a poor analogy.</p>
      <p>For example, consider the following hypothetical piece of code:</p>
      <p>lookup A {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;DoSomeStuff;<br>
      } A;</p>
      <p>lookup B {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;DoSomeOtherStuff;<br>
      } B;</p>
      <p>feature xxxx {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;lookup A;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;lookup B;<br>
      } xxxx;</p>
      <p>feature yyyy {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;lookup B;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;lookup A;<br>
      } yyyy;</p>
      <p>In this example, feature xxxx and yyyy *must* behave identically because lookups, unlike functions, are not called. Rather, they exist within the GSUB table in a particular order and will either be processed by the application or not. This order is determined by the order in which lookups are declared rather than the order which they are referred to in the features. Thus, B will operate on the output of A even in feature yyyy where they are mentioned in reverse order.</p>
      <p>Programs operate over data. OpenType tables, on the other hand, are static data which is processed by a text engine.</p>
      <p>André</p>
