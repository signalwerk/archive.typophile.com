    html: |-
      <p>It sounds like you want to replace inline classes (glyph lists) with predefined classes. Your pseudo-code is already close, just ditch the 'my' and use the prefix '@'...</p>
      <pre>@list_s = [s a c e o];
      sub m' @s by m.alt;
      # etc.
      </pre><p>
      In order for the class to work across features (not just for <code>calt</code>), the definition should be made globally, i.e. in the lower section of FontLab's OpenType panel, or in the Classes panel, or somewhere near the top of an external features file.</p>
      <p>It's also possible to nest classes, so if you needed to add an additional glyph to the predefined class for a particular rule, you could do something like...</p>
      <pre>sub m' [@s u] by m.alt;
      </pre><p>
      ...which would include 'u' in the class for just that rule.</p>
