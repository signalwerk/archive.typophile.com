    html: <p>The Frick Collection here in New York uses it for their publications. Works there because the paper stock is dull-coated; as another poster notes, its fine strokes are too spindly to work reliably on uncoated stock, which leaves out book design use under 12 pt. Also, the oldstyle figures are sequestered the old, tedious way in an Expert folder, and it also lacks bold and bold italic. I wish somebody would re-think it the way Josh Darden re-thought Fournier, which also never had bold and bold italic.</p>
