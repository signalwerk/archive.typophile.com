    html: |-
      <p>Van Dijck was a wonderful metal face. The great thing about it was that it was one of the few metal Monotype faces that were made in large composition sizes. That meant that one could do an entire oversized limited edition book and have the thing composed on the machine, without all that hand setting. Of course, good limited edition printers then worked over the lines by hand, adjusting word and letter spacing.</p>
      <p>It sure made gorgeous pages. I did an edition of Robert Kelly's long poem "Mulberry Women" using machine-set 18-point Van Dijck. The type printed beautifully. </p>
      <p>Monotype made some other faces for large composition also. Centaur was available maybe up to 20 or 22 point for machine composition. I cannot recall which others.</p>
      <p>I will not go near Centaur or van Dijck for text setting on the computer. For all the reasons noted above, and more. OK for display.</p>
      <p>powers</p>
