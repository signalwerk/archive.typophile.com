    html: <p>I've seen van Dijck used in books to good effect, but I think it's too light, aside from whatever other technical deficiencies it might have, and it seems to me that Monotype had it (or maybe it was just the expert set) bundled with another typeface, which would turn off purchasers who just wanted one.</p>
