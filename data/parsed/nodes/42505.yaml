      <p>Here's a historical tidbit for you. </p>
      <p>It is often repeated that Matthew Carter is the only living type designer to have worked professionally in every type technology -- from punch-cutting to machine-cast to phototype to digital (and including wood type now). Well, he never cut an entire font in punches, but one of the few punch-cutting projects he did undertake was to cut a set of numerals to go with the Monotype Van Dijck. </p>
      <p>-- K.</p>
