    <p>I've been here a little while now and have noticed that no one appears to give out any love for Monotype Van Dijck. So, I'd like to know what you guys think. Is it irremediably uninteresting or does it just need a little bit of spacing therapy?</p>
    <p>(A confession: I've had it for years but have never found the perfect use for it. I fear I may be handling it wrong.)</p>
