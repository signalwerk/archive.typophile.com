    html: |-
      <p>Like so many fonts from the metal era, when it was released as a Type 1 font -- &amp; probably as photocomp font -- no care was taken to get the glyphs to lay down ink in offset printing like they did with metal. In other words, it is thin &amp; spindly.</p>
      <p>I've used it for display (i.e, in large sizes) when wanting an older feel, and using Janson as a text font. And yes, I had to redo the Janson, too. Just too much work to also rework Van Dijck.</p>
      <p>I used it for <cite>Inside Picture Books</cite> by Ellen Handler Spitz -- see</p>
      <p><a href="http://books.google.com/books?id=EwWb829rP0IC&amp;dq=inside+picture+books&amp;pg=PP1&amp;ots=mhIELomxsb&amp;sig=iiMdi1fgVyYk5rk_Spbv5w8gDOU&amp;hl=en&amp;prev=http://www.google.com/search?hl=en&amp;client=firefox-a&amp;channel=s&amp;rls=org.mozilla:en-US:official&amp;hs=hYr&amp;sa=X&amp;oi=spell&amp;resnum=0&amp;ct=result&amp;cd=1&amp;q=Inside+picture+books&amp;spell=1&amp;oi=print&amp;ct=title&amp;cad=one-book-with-thumbnail" title="http://books.google.com/books?id=EwWb829rP0IC&amp;dq=inside+picture+books&amp;pg=PP1&amp;ots=mhIELomxsb&amp;sig=iiMdi1fgVyYk5rk_Spbv5w8gDOU&amp;hl=en&amp;prev=http://www.google.com/search?hl=en&amp;client=firefox-a&amp;channel=s&amp;rls=org.mozilla:en-US:official&amp;hs=hYr&amp;sa=X&amp;oi=spell&amp;resnum=0&amp;ct=result&amp;cd=1&amp;q=Inside+picture+books&amp;spell=1&amp;oi=print&amp;ct=title&amp;cad=one-book-with-thumbnail">http://books.google.com/books?id=EwWb829rP0IC&amp;dq=inside+picture+books&amp;pg...</a></p>
      <p>for a sample -- but the sample was scanned from the printed book, &amp; apparently not too well. Worse, the NB edition was itself scanned from the original -- we didn't set the NB edition. It has to be this way, because we ran out repro for the original printing, so there was no PDF file.</p>
      <p>Of course, this many generations downstream, the type appears too heavy. </p>
      <p>FWIW</p>
