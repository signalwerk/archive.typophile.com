      <p>Hi Theunis.</p>
      <p>Nice. I screwed up the spec. (1) should read "there should be at least two *characters*," not two *letters.* That way, A1 would qualify, but a single cap -- I, A, O -- wouldn't. And (2) wouldn't be redundant . . .</p>
      <p>BTW, do you think this useful? OK to say no.</p>
