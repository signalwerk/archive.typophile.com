      <p>Ah, the wonders of GREP styles -- how did I ever work without them?</p>
      <p>Let's see -- the following GREP style will find any run of the following characters, with at least two uppercase characters anywhere (not consecutively): Capitals, digits, hyphen, period, open and close single and double curly quotes, and round parentheses.</p>
      <p>It will match "123A456B" but not "(...A1...)" (only one capital); 'word' delimiters are all possible kinds of white space, plus begin/end of string.</p>
      <p>It works like this: to the left of the starting point there should not be NOT a space (I cannot use the regular \b boundary here, because it seems some non-whitespace characters also define a word boundary; in addition, I cannot use "to the left <em>should be</em> white space, because then it will fail at the start of a paragraph). Then, from the start, there should be any number of allowed characters, excluding uppercase, followed by an uppercase, followed by again any number of allowed characters and again at least a single uppercase. That's to fulfill the requirement "1. There must be at least two letters" (which, incidentally, is repeated in "2. At least one cap" and "3. No lowercase letters"). If the previous check matches, all characters are allowed up to NOT a non-space at the right.</p>
      <p><code>(?&lt;!\S)(?=[\d\-\./~[~{~}~]()]*\u[\d\-\./~{~[~]~}()]*\u)[\u\d\-\./~{~[~]~}()]+(?!\S)</code></p>
      <p>To test, you can set up a character style with a fat colored underline, so you can see what it picks up and what gets ignored:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/grepstyle_3612.png"></div><p></p>
      <p>The great thing about GREP styles in InDesign is that they are entirely <em>live</em>, so you can type text and see the result immediately!</p>
