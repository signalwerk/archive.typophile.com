      <p>Okay ... this needs a slightly different approach, then:</p>
      <p><code>(?&lt;!\S)(?=\S*\u)([\u\d~[~]~{~}.()]){2,}(?![^\s[:punct:]])</code></p>
      <p>This needs at least a sequence of non-spaces followed by an uppercase (the (?=\S*\u) part), then the same characters as above may get repeated, at least two times and as much as possible.</p>
      <p>I also changed the "end" condition slightly. Rather than a space character -- or, as I said before, "not <em>not</em> a space character --, it also needs to check for regular punctuation. My previous try also failed on "... A1, .." (a single comma right after a 'good' expression).</p>
      <p><cite>BTW, do you think this useful? OK to say no.</cite></p>
      <p>"Jugdement call. Ask a real human." (Quoted freely from -- I think -- a Terry Pratchett novel.)</p>
      <p>As you can see with a highlight style applied, it picks up everything mildly applicably and <em>relentlessly</em>. GREP Styles are the Terminators of InDesign -- They Will Not Stop. You cannot manually override a GREP style, unless you make another one with every attribute set to the exact opposite. The Highlight style, for example, needs one with Underline forcibly switched Off. Worse is that you have to apply them manually as well.</p>
      <p>I'd have to see a run of the text you intend to apply it to, because it may well be it works as intended ... So <em>do</em> try out with a Highlighting Style, so at least you can see where it gets applied.</p>
      <p>Here's one I missed so far: since it also includes the parentheses, the closing ones in your short list of examples get picked up. It's virtually impossible to force "matching parentheses" in a GREP style ...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/grepstyle2_4003.png"></div><p></p>
