    html: <p>&gt; <i>You can leave the UniqueID number blank, and should</i> <br>&gt; <i>do so. Adobe, who invented UniqueIDs, no longer uses</i> <br>&gt; <i>them in new fonts.</i> <br> <br>Note that if you happen to put a value in this slot that is greater than the recommended range of Unique ID numbers (4,000,000 to 4,999,999) you will not be able to Distill any PostScript files containing references to your font. <br> <br>All the more reason to leave it blank.</p>
