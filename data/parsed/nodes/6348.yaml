    html: <p>You can invent your own vendor code, but you have to leave it lowercase unless it's registered. It's either Apple or Microsoft who does vendor code registrations. <br> <br>You can leave the UniqueID number blank, and should do so. Adobe, who invented UniqueIDs, no longer uses them in new fonts. There is a successor, the XUID, which we also mostly no longer use in new fonts. <br> <br>Regards, <br> <br>T&lt;/font&gt;&lt;/font&gt;</p>
