  html: "<p>1. who's the vendor \"pyrs\" (lc NOT uc)? And why I ask that: <br>We are doing now simple work (by simple I mean just few letters, titles-movies etc etc ), an original work. <br> <br>Each time - when we open the Font ID dialog box - we have : \"TrueType vendor code: pyrs\".  <br> <br> <br>2. Do I/we have to, or need to \"Type 1 Unique number\"?  Or how do I know that there's no problem with Adobe/PS printers? <br>Or - just leave 0?</p>"
  html_clean: "<p>1. who's the vendor \"pyrs\" (lc NOT uc)? And why I ask that: <br>We are doing now simple work (by simple I mean just few letters, titles-movies etc etc ), an original work. <br> <br>Each time - when we open the Font ID dialog box - we have : \"TrueType vendor code: pyrs\".  <br> <br> <br>2. Do I/we have to, or need to \"Type 1 Unique number\"?  Or how do I know that there's no problem with Adobe/PS printers? <br>Or - just leave 0?</p>"
