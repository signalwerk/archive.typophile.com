    html: '<p>"pyrs" stands for Pyrus, the former company name of the FontLab distributor. Pyrus never made any commercial fonts, so fonts with the "pyrs" vendor code are probably fonts where the real vendor did not replace the default value with a custom one. The vendor codes can be registered with Microsoft: <a href="http://www.microsoft.com/typography/links/VendorList.aspx" target="_blank">http://www.microsoft.com/typography/links/VendorList.aspx</a>  <br> <br>Adam</p>'
