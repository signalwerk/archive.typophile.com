    html: |-
      <p><cite>My first editing instructor, who we all referred to as “The Goddess of Words,” always suggested going with Chicago when in doubt</cite></p>
      <p>The emphasis here should be "when in doubt." Slavishly following the Chicago Manual doesn't even make you a genius, let alone a Goddess.</p>
      <p>For what it is worth, the Chicago manual gets worse and worse the farther removed they get from editing and the closer to typography. When we were writing the <cite>Glossary of Typesetting Terms,</cite> which Chicago published, they kept pointing out that some of our definitions &amp; comments ran counter to what was in the manual. We had to keep pointing out that the manual was wrong.</p>
      <p>I have profound respect and gratitude for Chicago's editors for improving the writing, and for establishing a good style for citation. I don't have much respect for their understanding of typography. Unfortunately, The University of Chicago Press is one of those publishing houses where the editorial department gets final say on design matters. A strong case, well presented, will occasionally sway the editors -- during his tenure as Design &amp; Production manager at Chicago, Cameron Poulter was sometimes able to do this -- but anything less falls on ears disinclined to listen. This attitude removes a channel of information &amp; correction between typographers and editors, and it isn't found only at Chicago.</p>
      <p>I would have expected more concern for typography on a site dedicated to type.</p>
      <p>And by the way, this is the first time I have ever seen anyone recommend small caps and (full) lining figures.</p>
