    <p>I'm doing a brochure for my theatre company, and I'm finally using a full-featured typeface. In certain places, we have copy including series codes:</p>
    <p><cite>Choose series D3, F1, or F4.</cite></p>
    <p>Given that I'm using OSF in copy throughout, how should I set these series codes?</p>
    <p>1. cap letter + lining figure</p>
    <p>2. small cap letter + OSF</p>
    <p>3. some other way (please detail)</p>
    <p>Thanks!</p>
