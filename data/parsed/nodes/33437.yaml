    html: <p>In some ways, it might depend on the theater company -- using small caps with oldstyle numbers has a certain look -- more literary. Full caps with lining figures looks more like the social sciences, or accounting. If this isn't a financial statement, I'd go with sc/os figs. In short, think about what the audience might expect or appreciate.</p>
