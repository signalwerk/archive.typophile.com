    <p>Hello typophiles!</p>
    <p>I am planning on attending TypeCon this year for the second time, and I'm looking for a roommate to make the trip affordable.  I'm a 24-year-old female graphic designer passionate about all things typography.  </p>
    <p>I did my thesis project on educating people about typography through three books I wrote and designed about the ampersand, and an interactive ampersand installation.</p>
    <p>My preference would be for a female roommate, but I am open to anyone would might be a good fit.  I am open to staying at the Royal Sonesta, a nearby hotel (maybe cheaper), or even a hostel.</p>
    <p>You can check out my personal website here: <a href="http://mollymcleod.com" title="http://mollymcleod.com">http://mollymcleod.com</a>, and email me at <a href="mailto:molly.ampersand@gmail.com">molly.ampersand@gmail.com</a> if you or anyone you know is looking for a roommate!</p>
    <p>thanks,<br>
    Molly</p>
    <p>(Note: I would have posted this in the TypeCon forum, but it seems very inactive, so I was worried it wouldn't get seen).</p>
