      <p>Typofiles!</p>
      <p>I am attending TypeCon this year in New Orleans and I'm looking for a roommate to save a bit of money. I am a 47 year old male graphic designer, type designer, typographer/educator. I plan to stay at the Royal Sonesta, but I am open to a nearby hotel (cheaper).</p>
      <p>I currently live in Bowling Green, Ohio, but I grew up in the South, attended Grad school at CalArts and I am currently researching the relationships between Heroic Modernism and Popular graphics in the 60s and 70s.</p>
      <p>If sharing a room with me sounds like a potential fit let me know asap!</p>
      <p><a href="mailto:btoddch@gmail.com">btoddch@gmail.com</a></p>
      <p>Thanks!</p>
      <p>Todd</p>
