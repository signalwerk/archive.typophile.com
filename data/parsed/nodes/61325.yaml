      <p>REALLY TYPOPHILES?</p>
      <p>6 days and no answers?</p>
      <p>All those people posting font pairing questions without even a semblance of what the job description is or how it will be used, all those times people ask "what looks GOOD with what?" "What's the perfect font for that?"</p>
      <p>So here I present relevant information for my choices. And although I'm 90% sure Caecilia will be the right thing to do--a budding typographer could use some reassurance or critique on his methods &amp; choices.</p>
