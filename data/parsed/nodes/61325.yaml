      <p>I couldn't agree more about there being no right solution. We're trained to have multiple solutions. Though, sometimes, some things seem more or less correct--in the subjective, personal sense where one says to oneself, "Yes! THIS is perfect. This is the right one."</p>
      <p>This is a case where on opposite days I think one is better than another. Then I revert my opinion. Repeat. At the very least, hopefully they could both work, and I've given the option that if Caecilia is rejected on grounds that it's a little quirky--I've got a backup in the other direction.</p>
