      <p>Reassurance comes after doing... :-)</p>
      <p>The thing with design problems is that there never really is a "right" answer - just a range of possibilities. It's the nature of design problems. So enjoy the journey and pick something that will solve the problem at hand, knowing that there might be other solutions that could work just as well (and sometimes better) depending on the context...</p>
      <p>But I think Caecilia will work just fine.</p>
