    <p>I am looking for some feedback on a companion font.</p>
    <p>I'm going to be designing a "brochure" of sorts for my company. It'll be somewhere in the area of 9"x11"--so more like a magazine format, but it will basically explain everything it is that my company does.</p>
    <p>We're one of the leading builders in the nation of residential modular homes. These are really good quality homes. We offer just about every type of house you could imagine, from basic ones that are pretty cheap, to traditional homes with really nice interior styling, to urban-chic modern homes, and we can add the latest green features to any of these homes. Giving the customer anything they want means it's a little hard to position our style--but we do want to come across as smart and up-to-date. Our corporate font is Myriad--not anything I chose but I can't really change it.</p>
    <p>Here's a few things I'm also thinking about:<br>
    1) At first, I thought of combining our corporate face, Myriad, with Diverda Serif for the long copy that will be in this brochure/magazine. But I'm also considering PMN Caecilia. I like how some of the characters in Diverda matched with those of Myriad, yet, at text size, the large X-height of Caecilia seemed more inviting. The latter was created 14 years earlier than the former. I want to use a text face that is modern and friendly, and geometric like Myriad. All these faces are based on Roman proportions. I admit 14 years, typographically speaking, isn't much difference. I thought the slab-serif was a nice touch for a company that builds modularly (each piece of a house is basically a slab, although we end up combining them in beautiful ways). I'm leaning towards Caecilia--but I wondered what others thought about their companionship.</p>
    <p>Here are type specimens: (sorry the PDFs were too large)<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Large_4609.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Small_5188.jpg"></div><p></p>
