    <p>When I saw this book cover at baubauhaus.com my attention was immediately drawn to the B of Bones. I know this lettering is hand-drawn and not actually a font, but could anyone help me find some fonts with a B like that?</p>
    <p>I've been trying to produce something like that but modifying Erato Light. If you want to take a look at it and give your opinion, click <a class="freelinking external" href="http://typophile.com/node/89442" rel="nofollow">here</a>.</p>
    <p>Thanks in advance!</p>
    <p><a href="http://tinypic.com?ref=2uei2dz" target="_blank" rel="nofollow"><img src="http://i41.tinypic.com/2uei2dz.jpg" border="0" alt="Image and video hosting by TinyPic"></a></p>
