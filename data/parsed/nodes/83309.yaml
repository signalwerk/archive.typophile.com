    <p>Hi,</p>
    <p>Just joined at the suggestion of a friend who is a regular contributor.</p>
    <p>I'm in the process of designing a few logo's as a company is building me a website as a portal with a few distinct business' steaming from it, I'd like to have each one having its own identity.</p>
    <p>I am self taught and therefore not the polished article. I would just like to court the expertise of a number of professional eyes.</p>
    <p>Here are two of the companies and various logo's I've been playing with, I would really appreciate it if you'd maybe pass a critical eye over them and make some suggestions with respect to the design or colour schemes.</p>
    <p>I would really appreciate some input, critique, warnings or suggestions to carry me forward. Feel free to post whatever, I have a thick skin.</p>
    <p>The first is ScotBath DIRECT, taps, showers, bathroom suites, towel radiators, etc.</p>
    <p>The idea is its a stylised Saltire (Scottish National Flag), I tried to introduce the waves (evoking water) with the flag (as if it was blowing in the wind with folds) but still reasonably geometrical and regimented.</p>
    <p><a href="http://s1208.photobucket.com/albums/cc365/scameron77/Scottish-Home/?action=view&amp;current=ScotBathLogo.jpg" target="_blank" rel="nofollow"><img src="http://i1208.photobucket.com/albums/cc365/scameron77/Scottish-Home/ScotBathLogo.jpg" border="0" alt="Photobucket"></a></p>
    <p><a href="http://s1208.photobucket.com/albums/cc365/scameron77/Scottish-Home/?action=view&amp;current=ScotBathLogov2.jpg" target="_blank" rel="nofollow"><img src="http://i1208.photobucket.com/albums/cc365/scameron77/Scottish-Home/ScotBathLogov2.jpg" border="0" alt="Photobucket"></a></p>
    <p>The other one in question is Q Gardens. I have tended towards a script font in this one as they naturally seem to lend themselves to this business, however I am open to alternatives as discussed.</p>
    <p><a href="http://s1208.photobucket.com/albums/cc365/scameron77/Scottish-Home/?action=view&amp;current=QGardensLogo-1.jpg" target="_blank" rel="nofollow"><img src="http://i1208.photobucket.com/albums/cc365/scameron77/Scottish-Home/QGardensLogo-1.jpg" border="0" alt="Photobucket"></a></p>
