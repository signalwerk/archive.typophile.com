    html: |-
      <p>Welcome to Typophile.</p>
      <p>If you want your work critiqued, put it in the appropriate place:<br>
      Home » Forums » Critique » Logos / Corporate ID Design<br>
      (Seeking an 'appraisal' is odd. Fishing for compliments won't make a design better.)</p>
      <p>Upload images that aren't too wide for Typophile. I think 580 pixels is the max...</p>
      <p>Don't post low quality JPEGs that are CMYK. In my browser (Safari 5 on OS X) the images appear with wildly incorrect color (the whites are black, the greens are purple) because you didn't save them properly. I had to open the images in Photoshop to see the correct color, and then I saw blurry, aliased images.</p>
      <p>None of the ScotBath variations suggest the Scottish Saltire to me. I am American, don't know the history of heraldry, but a quick Google search shows me that a green saltire isn't really Scottish. So why have the logo be in green if you want it to evoke the flag of Scotland? Blue on teal is unreadable.</p>
      <p>I don't see the diagonal/cross of the flag in your waves. At best it makes the overall shape look woven, but it doesn't do what you want it to. It doesn't communicate water or flag to me.</p>
      <p>The type choices are lame. Both are boring. Like aluminum says, keep exploring.</p>
      <p>This all needs more refinement. You want help to "carry [you] forward" and part of that is getting honest critiques. I think Typophile can be an immensely rewarding community if you take the time to read and research all the information posted throughout the site. Take a look at the Typowiki and Resources link at the top. Lurk before you post. </p>
      <p>All of that said, I look forward to seeing your next iteration.</p>
      <p>(No comments on Q Gardens, because it is easier to critique it separately. Don't force two topics into the same thread)</p>
