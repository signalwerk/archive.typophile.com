    html: |-
      <p>An easy way to separate the amateurs from the professionals* is to gauge their reaction to criticism. You admit you are amateur, so I don't think we can fault you for that reaction to James' comment. But note that it wasn't particular mean. Just blunt. As professionals, most of us** much prefer honest and blunt critique over sugar coated half-assed praises disguised as critique.</p>
      <p>So, point being, welcome to your first lesson on receiving critiques: Don't take them personally...it's a comment on the work, not you as a person.</p>
      <p>Also, IMHO, I find the best design solution isn't always apparent in a vacuum. Often just one little idea from a critique can take the project into a whole other (and better) direction. </p>
      <p>That out of the way, I have to second JamesM...no need to post 36 copies of one logo. Post one, and let us focus on that.</p>
      <p>To offer some hopefully useful feedback, the first thing that jumps out at me on all your logos is the double-outline. It's very jarring and adds nothing but complexity to the forms. I suggest as a start that you strip out all of the outlines.</p>
      <p>Secondly, explore a bit more. Do some sketching. Play with some type. A big part of logo design is brainstorming ideas and exploring them to see where they take you. Figure for every hour of drawing the logo there are 5-10 hours of sketches and brainstorms.</p>
      <p>* Granted, in this industry, even some of our celebrity designers can be thin skinned Prima Donnas. </p>
      <p>** OK, maybe I'm wishful thinking there. I *hope* most of us, as professionals, prefer the honest, even if blunt, critiques over the "well, that's pretty good..." fluff.</p>
