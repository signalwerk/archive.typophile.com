      <p>&gt;  JPEGs that are CMYK</p>
      <p>I meant to mention that also; I had to switch browsers to view them properly. You might try using Photoshop's "save for web" feature (File &gt; Save for Web and Devices) when preparing a graphic to post. It saves a copy of your graphic as a 72 dpi RGB JPEG that has a much smaller file size than the original; perfect for posting on the web. Once you learn how to use it, it's a quick and easy way to make JPEGs to post. </p>
      <p>&gt; I don't think we can fault you for that reaction to James' comment</p>
      <p>As a newcomer you might not know he's referring to Dunwich Type, who like me is named James. :)</p>
