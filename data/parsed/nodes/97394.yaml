      <p>I would assume that this is a custom expansion of the <a href="http://commercialtype.com/typefaces/publico" rel="nofollow">Publico</a> family. The Banner Ultra Italic cut comes reasonably close to the non-swash letters of your sample, but has a little less contrast.</p>
      <p>PS: Browsing through your past postings, I noticed that you regularly ask for Type IDs without bothering to give any feedback to those who reply. I think it would be nice if you would break that habit and let us know if our reactions were helpful.</p>
