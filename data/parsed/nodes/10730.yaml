    html: <p>Yes, but the general look -- not the actual content -- of something that resembles futurist work can be described and replicated easily. To create something that is more futurist, by virtue of it's reflection of futurist typographic ideals and dogma, the designer reflects the legacy of the movement, but the designer is then author. <br> <br>And if you want to be truly futurist, use after effects. </p>
