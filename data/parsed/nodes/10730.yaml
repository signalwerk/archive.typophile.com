    html: "<p><i>...you'd do well to just set each word in a different face. And not respect baselines.</i> <br> <br>But not randomly. Futurist typography was all about reflecting the meaning of the words in the choice of colours, fonts, weights etc. It was also an attack on the norms of punctuation. <br> <br><i>... the Futurist's typographic goals included overall disruption of a page and a sense of unease.</i> <br> <br>Disruption of \"the bestial, nauseating idea of the book\" where the <i>mise en page</i> did not do justice to the emotional language of the text:  <br> <br><i>My revolution is aimed at the so-called typographical harmony of the page, which is contrary to the flux and reflux, the leaps and bursts of style that run through the page. On the same page, therefore, we will use three or four colours of ink, or even twenty different typefaces if necessary. For example: italics for a series of similar or swift sensations, boldface for violent onomatopoeias, and so on. With this typographical revolution and this multicoloured variety in the letters I mean to redouble the expressive force of words.</i>  <br> <br>From Marinetti's <i><b>Destruction of Syntax - Imagination without Strings - Words-in-Freedom</b></i>,1913. </p>"
    html_clean: "<p><i>...you'd do well to just set each word in a different face. And not respect baselines.</i> <br> <br>But not randomly. Futurist typography was all about reflecting the meaning of the words in the choice of colours, fonts, weights etc. It was also an attack on the norms of punctuation. <br> <br><i>... the Futurist's typographic goals included overall disruption of a page and a sense of unease.</i> <br> <br>Disruption of \"the bestial, nauseating idea of the book\" where the <i>mise en page</i> did not do justice to the emotional language of the text:  <br> <br><i>My revolution is aimed at the so-called typographical harmony of the page, which is contrary to the flux and reflux, the leaps and bursts of style that run through the page. On the same page, therefore, we will use three or four colours of ink, or even twenty different typefaces if necessary. For example: italics for a series of similar or swift sensations, boldface for violent onomatopoeias, and so on. With this typographical revolution and this multicoloured variety in the letters I mean to redouble the expressive force of words.</i>  <br> <br>From Marinetti's <i><b>Destruction of Syntax - Imagination without Strings - Words-in-Freedom</b></i>,1913. </p>"
