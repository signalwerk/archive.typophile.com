  html: |-
    <p>I've seen this font used in AMC's self-promotion on air and on their website. It's similar to Rockwell or Aachen but different. In particular, the upper-case "R" has a curl in the leg that points up. I can't find an example of that but perhaps that will help in the identification. You can visit AMCtv.com for more examples of usage. I've attached one with the most characters visible here.</p>
    <p><a href="http://typophile.com/files/Picture" title="http://typophile.com/files/Picture">http://typophile.com/files/Picture</a> 1_39.jpg</p>
    <p>Thanks in advance!</p>
    <p>Jenkin</p>
