      <p>The curly decorative Q seems to say everything *but* IT. I think it'd be appropriate for interior design, hair styling--something targeting more of a feminine, luxury type of product or service. </p>
      <p>Given that your company appears to be doing a wide range of things, I'd lean towards a simpler solution. Pick a sturdy typeface. Set it inside a block of color. Call it good.</p>
