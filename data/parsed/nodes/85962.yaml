    html: |-
      <p>What does your company do? What kind of audience are you trying to target? What kind of emotion/style are you going for?</p>
      <p>From a purely structural perspective, some comments:</p>
      <p> - lots of kerning needs to be done here (loo at that gap between the U and A for instance)<br>
       - why the rigid red lines for the crossbars but the sloppy, thick brush stroke on the Q (it's causing some dissonance)<br>
       - Consider if you even need the red elements (is the uniqueness of the 'Q' enough personality?<br>
       - The Q is sitting funny. It's not on the baseline, nor is it dropping enough to seem intentional.<br>
       - The scale between the logo and the tagline is too much. There's no way to shrink this down without making the tagline illegible.<br>
       - the underscore seems unnecessary</p>
      <p>Hope that helps!</p>
