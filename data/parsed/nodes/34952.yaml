      <p>First, I think "oldstyle figures" is a bad term. "Text figures" is more accurate and clear. But that's a discussion for another thread.</p>
      <p>There are literally hundreds of sans families with text figures (if you have Adobe CS, you've got Myriad), but those in the gothic genre are less common perhaps because types like Trade Gothic weren't meant for long text. <a href="http://www.fontshop.com/fonts/downloads/urw/corporate_s/" rel="nofollow">Corporate S</a> is about as close to Benton/Trade as you'll get. </p>
      <p>Would you settle for a more modern humanist sans? Paul listed a few great options. Here are more:</p>
      <p><a href="http://www.fontshop.com/search/?q=Unit" rel="nofollow">FF Unit</a><br>
      <a href="http://www.fontshop.com/search/?q=Legato" rel="nofollow">FF Legato</a><br>
      <a href="http://www.fontshop.com/search/?q=Clan" rel="nofollow">FF Clan</a><br>
      <a href="http://www.fontshop.com/search/?q=Fago" rel="nofollow">FF Fago</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_good/" rel="nofollow">FF Good</a><br>
      <a href="http://www.fontshop.com/search/?q=Kievit" rel="nofollow">FF Kievit</a><br>
      <a href="http://www.fontshop.com/search/?q=Zwo" rel="nofollow">FF Zwo</a><br>
      <a href="http://www.fontshop.com/search/?q=Milo" rel="nofollow">FF Milo</a><br>
      <a href="http://www.fontshop.com/search/?q=FF%20Plus" rel="nofollow">FF Plus</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_strada_text/" rel="nofollow">FF Strada Text</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_page_sans/" rel="nofollow">FF Page Sans</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_profile/" rel="nofollow">FF Profile</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_super_grotesk/" rel="nofollow">FF Super Grotesk</a> (a geometric, but the "B" variant has double-story 'a's and 'g's)<br>
      <a href="http://www.fontshop.com/search/?q=Sanuk" rel="nofollow">FF Sanuk</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/primetype/ptl_golary_red_combi_upright/" rel="nofollow">Golary Red</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/primetype/ptl_maurea_complete/" rel="nofollow">Maurea</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/linotype/vialog_virtual/" rel="nofollow">Vialog</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/typotheque/fedra_sans_20/" rel="nofollow">Fedra Sans</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/itc/charlotte_sans/" rel="nofollow">ITC Charlotte Sans</a><br>
      <a href="http://www.fontshop.com/search/?q=fresco%20sans" rel="nofollow">Fresco Sans</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/linotype/linotype_finnegan_virtual/" rel="nofollow">Finnegan</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/monotype/mahsuri_sans/" rel="nofollow">Mahsuri Sans</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/process/klavika/" rel="nofollow">Klavika</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/underware/auto_1_ot/" rel="nofollow">Auto</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/linotype/praxis_virtual/" rel="nofollow">Praxis</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/itc/itc_stone_sans/" rel="nofollow">ITC Stone Sans</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/lucasfonts/sun_ii/" rel="nofollow">Sun</a><br>
      <a href="http://www.fontshop.com/search/?q=Solex" rel="nofollow">Solex</a><br>
      <a href="http://www.fontshop.com/search/?q=Today" rel="nofollow">Today</a></p>
      <p>As you can see, most of these are fairly recent designs. Only in the last 10 years have text figs in sanses become commonplace, a trend due, in part, to the standard set by Spiekermann at <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FSI</a>: all text FontFonts come with OSF as the standard figure style.</p>
      <p>There are a few grotesques with OSF:<br>
      <a href="http://www.fontshop.com/search/?q=Bau" rel="nofollow">FF Bau</a><br>
      <a href="http://vllg.com/Village/GalaxiePolaris/mudTyper+Weights/" rel="nofollow">Galaxie Polaris</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/arstype/region/" rel="nofollow">ARS Region</a></p>
