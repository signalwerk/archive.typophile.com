      <p>1. The orientation difference of horizontal dominance and vertical dominance.</p>
      <p>Latin letterforms are printed, and therefore are individual units where the distinction between letters are its dominant vertical bars.</p>
      <p>Non-Latim letterforms are scribed, and therefore are much like joined units where the joining-like effect are the dominant horizontal strokes.</p>
      <p>If a Latin face has alternatively dominant horizontal strokes, it looks odd. Conversely, if a non-Latin face has alternatively dominant vertical strokes, it looks odd.</p>
      <p>What are we gonna do?</p>
      <p>Well, this is each group's nature. Change here is unnatural, even perverse.</p>
      <p>The way to overcome the natural diversity is found in its bigger picture.</p>
      <p>Somewhat like the saying about seeing the tree and missing  the forest, here it's the very opposite: ignore the tree and see the forest.</p>
      <p>What does this mean in our context?</p>
      <p>Every configuration of text on a page creates a color, a ratio of black to white in a given space.</p>
      <p>To merge English with Hebrew requires a similar and compatible, even complimentary, color ratio of black to white in a given space. The greatest completion of English with Hebrew is total submission, where each blends in together. While compability is only a merger which makes due.</p>
