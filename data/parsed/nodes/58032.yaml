      <p>Is it possible to place an English font text with vertical dominant bars, like in Minion, alongside a Hebrew font text with horizontal dominant strokes? Seems impossible, ayh?</p>
      <p>Won't the Hebrew look radically different from the English, and vice versa, in both structure and relative black-white ratio per inch. The Hebrew letterforms will look darker, wider, shorter,compared to the English letterforms, besides the obvious design differences in orientation.</p>
      <p>So, the differences are four-fold:<br>
      1. Hebrew is horizontal stroke dominant, while English is vertical stroke dominant;<br>
      2. Hebrew seems darker, while English seems balanced in color distribution;<br>
      3. Hebrew letterforms are proportionately wider in relationship to English letterforms;<br>
      4. Hebrew are proportionately shorter in relationship to English letterforms; see Microsoft's poor renditions of popular Hebrew typefaces, often matching by error the single case Hebrew to the lowercase of English. Clearly, a non-Hebrew reader did this, as to most every Hebrew reader, this looks too small for the type size, rendering it ridiculous like a clown wear long pants that are too short for his legs.</p>
      <p>How can these 4 challenges be overcome?</p>
