      <p>I don't think he pulled the typeface out of a hat. I think he studied many manuscripts and had a instinct as to what the form of the letter should be. I think he then started to draw letters which he put into Yona. After setting the chapter, he started to turn it into a digital font. I don't think Koren ever claimed he was a genius and I certainly have never made such a claim. You have said he was a genius, these are not my words. There was a study done on the differences between the Siddur font and the Tanakh font by Simon Prais. If you don't like the font, why don't you say that you don't like the font. Why talk about genius and other typographers. If I am critiquing your typeface, I don't prove my point by saying that some other type designer is a friend of mine on facebook. I critique the font based on my opinion.</p>
      <p>Who said he only made one face? He made 2 Koren faces, the Tanakh and the Siddur which are quite different (not just the aleph), 3 Rashi faces, and a sans serif face. He also worked on a number of different faces too, but remember what Koren brought to the world wasn't just a few typefaces, but rather his Tanakh which is considered to be the most accurate in the world and his siddurim which again are world-acclaimed for their accuracy. I think you really don't understand what Koren is about.</p>
      <p>Please do find the drawing, just for me. Thanks :-)</p>
