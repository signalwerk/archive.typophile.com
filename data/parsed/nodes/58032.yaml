      <p>On the subject of merging Hebrew and English...</p>
      <p>After Charlemagne originated the notion of using the Latin alphabet with capital letters based on Roman monumental script, and lowercase letters based on the uncial, this practice was spread to the Greek language - and Armenian and Cyrillic also have upper and lower case.</p>
      <p>I came across this article a while back,</p>
      <p><a class="freelinking external" href="http://onthemainline.blogspot.com/2006/02/hebrew-alphabet-reform_13.html" rel="nofollow">http://onthemainline.blogspot.com/2006/02/hebrew-alphabet-reform_13.html</a></p>
      <p>about a bizarre proposal to give Hebrew a lower case. I would think that there's a much simpler way to make a Hebrew with a lower case, without having to redraw the letters in a foreign style, if anyone wanted it.</p>
      <p>Just make the conventional square script the upper case, and the ancient forms of the letters - in the Paleo Mesha style, where the ascenders and descenders are pronounced - the lowercase!</p>
      <p>There was even Eric Gill's odd attempt at making Hebrew look more like the Latin alphabet. While giving Gujarati that treatment might produce interesting results, and this is no worse than many other cute display faces, the serifs point the wrong way.</p>
      <p>Ah, and here's another interesting article:</p>
      <p><a class="freelinking external" href="http://stbride.org/friends/conference/badtype/aleph-x.html" rel="nofollow">http://stbride.org/friends/conference/badtype/aleph-x.html</a></p>
    html_clean: |-
