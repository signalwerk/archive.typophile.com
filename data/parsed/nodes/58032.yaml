      <p>My view on this is that when the normative forms of two different scripts rely on distinct stroke contrast patterns, one must seek to harmonise the overall impact of the type on the page, rather than do violence to either script trying to distort it to match the other. Harmonising the weights of the two scripts so that they produce a similar texture on the page is not as simple as harmonising stroke weights, regardless of contrast patterns, because one needs to take into account also the characteristic shapes and letter densities of the two scripts. In this respect, Hebrew and Latin types are in some ways easier to harmonise than Latin and scripts with greater density, e.g. Korean or Chinese.</p>
      <p>I've noticed that in Israeli typography, it is common for the Hebrew letters to correspond to the x-height of a matched Latin design. Whereas in European scholarly publishing it is usual for the Hebrew letters to stand taller, between the Latin x-height and cap-height. Either approach can be made to work if compensations are made in other ways for the stroke weight and density.</p>
