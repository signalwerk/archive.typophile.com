      <p>2. Hebrew seems darker, while English seems balanced in color distribution;</p>
      <p>Since the eye is tricked by the different orientation, and Hebrew verticasl strokes are often heavier than English vertical bars, the result is that the Hebrew text seems darker than the English.</p>
      <p>The way to overcome this is by adjusting the letterspacing, or better the side bars, slightly, so the Hebrew text seems lighter to look at, and better match the English.'</p>
      <p>3. Hebrew letterforms are proportionately wider in relationship to English letterforms;</p>
      <p>Hebrew is meant to be understood and concentrated upon. Therefore it's wider than English.</p>
      <p>English is made to be read speedily. Therefore, it's narrower than Hebrew.</p>
      <p>In general, as any Hebrew thinker knows, thinking in English is more superficial, because its letterforms are more narrow. Thinking in Hebrew is much deeper and meaningful, because its letterforms are wider. Broadmindedness versus shallowness. This is why Israeli intelligence supercedes even American intelligence.</p>
      <p>Arabic and Iranian etc. thinking and intelligence will be discussed later.</p>
      <p>To compensate for this awkward sense when English and Hebrew is combined in the same sentence or paragraph etc., and the way to merge English and Hebrew successfully, is to raise the height of the Hebrew letters to a little below the height of the English uppercase, and well above the height of the English lowercase.</p>
      <p>In general, the height and the inter-letterspacing is adjusted carefully to create the illusion of compatibility or completion between the languages.</p>
