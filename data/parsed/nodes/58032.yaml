      <p>There is another factor which I am not listing. Each language's text or book font must be silent, not show-offish, and conducive to blending.</p>
      <p>For example, Gorkin's version of Narkiss is blendable. Frank's modification of Vilna is blendable. Even Itamar David's very popular David blends in with a subtle falair.</p>
      <p>Eliyahu Koren's clown-like Koren is not a good text typeface, because it's most every letter shouts "look at me; I'm a star". Don't get me wrong it's a beautiful design as display or decorative, but it's not for text.</p>
      <p>Eliyahu Koren typeset the Bible and the Jewish prayerbook with the Koren typeface for decades. It became a default standard book font, but it's is really not at all. Study its design and just admit it.</p>
