      <p>&gt; Either approach can be made to work.</p>
      <p>I both agree and disagree. Imo it depends on the situation. The most correct approach for most situations is to, as Israel pointed out, align the Hebrew body height somewhere between the Latin cap- and x-height. This works best with Latin upper- &amp; lowercase. With the somewhat rare, but feasible, lowercase-only situation, then the Hebrew body height can be correctly scaled to x-height. With all-cap Latin, the Hebrew body height should be scaled to cap-height.</p>
