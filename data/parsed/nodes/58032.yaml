      <p>There is another avenue to make the English letters match the Hebrew letters.</p>
      <p>If the type design matches the English horizontal stroke width to the Hebrew vertical stroke width, then yet another dynamic is created, reducing the need for extra inner-letterspacing. Less increasing of the inner-letterspacing is necessary, because the overall color of the Hebrew is much less darker than the overall color of the English.</p>
      <p>The following pages cite visual demonstrations of the above discussed concepts.</p>
