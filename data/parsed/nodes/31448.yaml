      <p>Hmm, I guees it’s a matter of opinion here after all. Hinting is all about choosing between to have a crisp sharp appearance on screen that will be somewhat distorted in its letterform OR keep the letterform but settle for a less sharp crispiness. Isn’t it?</p>
      <p>Instead of celebrating Valentines Day like I really should, I have now inspected some fonts I (the ad agency I’m working for) have. They all suffer the same problem. Sometimes its more obvious and sometimes less. It depends on the shapes of the letterforms.</p>
      <p>They are all hinted, and they all change a little bit in proportions of the letterform depending on which size I display the font on, on the screen. A one-point-size-change can sometimes almost don’t do any difference at all (the letter is hinted to the nearest pixel or something?).</p>
      <p>Some other times, the font makes a bigger step visually in font size (I guess it then stick to the next "grid") even though I only change the size one point as before.</p>
      <p>Letters like v and w – sometimes they go a little bit too far below the baseline compared to the other letters, and sometimes they jump up to it’s right position.</p>
      <p>Is this what hinting is about? In that case I guess it’s up to the font developer to decide which to choose. Both a hinted font and an unhinted have "issues". None of them are perfect.</p>
      <p>Of course it also depends on how the letterforms itself are created?<br>
      If that is true, then I understand what happened to my font (as shown above) because I really tried to display the font with small, small changes in size – comparing it to the un-hinted above, and then there was a certain moment when this big distorsion appeared (last example).</p>
      <p>Or are there someone out there that believes hinting could be done perfect without ANY of these distorsions? Is it even possible?</p>
      <p>Sorry if my thought sounds a bit stupid, but I also having some problems expressing myself on english :)</p>
