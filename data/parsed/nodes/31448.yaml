      <p>Hinting is a transitional problem, only useful as long as we have low resolution displays. It shares this characteristic with 8-bit color palettes, something people used to spend a lot of time fiddling and tweaking.</p>
      <p>Since almost nobody today actually has high-res displays, whether hinting is worth doing depends on what the font will be used for. If it's going to be used as a UI font or as the primary reading font in an app like a Web browser, then yeah, you need to hint. If it's primarily used for print, or only in display sizes, or you only care about computers shipping after the year 2012, then nah, don't bother.</p>
      <p>If you do hint, you need to choose between TrueType and Type1 (CFF) flavors. The former gives the font creator a <em>lot</em> more control, but also requires more deep programming magic.</p>
