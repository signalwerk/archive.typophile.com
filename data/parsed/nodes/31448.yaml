      <p>&gt; <em>Letters like v and w – sometimes they go a little bit too far below the baseline compared to the other letters, and sometimes they jump up to it’s right position.</em></p>
      <p>This might have to do with the <a href="/wiki/BlueScale" class="freelinking" rel="nofollow">BlueScale</a> value.</p>
      <p>The [...] BlueScale [...] controls the point size at which overshoot suppression ceases.</p>
      <ul>
      <li>For point sizes that occupy fewer device pixels than the BlueScale value results in for a given device, overshoot suppression is performed. All features falling in an alignment zone are rendered at the same pixel height.</li>
      <li>For point sizes that occupy the same number or a greater number of device pixels than the BlueScale value results in, overshoot suppression is turned off, thus allowing overshoots to occur. (This behavior may be modified by the optional <a href="/wiki/BlueShift" class="freelinking" rel="nofollow">BlueShift</a> setting)</li>
      </ul>
      <p>In, <a href="http://partners.adobe.com/public/developer/en/font/T1_SPEC.PDF" rel="nofollow">Adobe Type 1 Font Format</a> (PDF file), page 39.</p>
      <p>I agree that <a href="/wiki/hinting" class="freelinking" rel="nofollow">hinting</a> is not an easy subject, and that little documentation about it is available. I've been struggling with these things as well.</p>
