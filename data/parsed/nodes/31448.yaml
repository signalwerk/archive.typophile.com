      <p>Goran asked: <cite>Is this, generally speaking, how it works with hints? Is it a compromise where you choose crispy looking letters on screen before letterforms that stay proportional (as they do if you don’t hint them).</cite></p>
      <p>Yes. That is, the whole purpose of hints is to distort the letterforms in favor of some higher purposes such as stroke consistency or legibility or what-have-you.</p>
      <p>If you experiment with BlueScale a bit, you'll soon find that with pretty much every typeface, there will be some specific ppem size (or range of sizes) for which it looks bad if you allow overshoot, and it looks bad if you suppress overshoot, and you just have to decide which is worse.</p>
      <p>Of course, with rendering technologies and screens having improved, it is at least plausible to think about foregoing hinting altogether. There was a time when that was not the case.</p>
      <p>Raph wrote: <cite>Hinting is a transitional problem, only useful as long as we have low resolution displays.</cite></p>
      <p>Agreed. Once displays get up around 400+ dpi, hinting will become pretty unimportant. Even 200 or 250 dpi will make hinting a lot less critical. Mind you, I wonder if really basic displays on newly-enabled devices will get those resolutions as soon as our computers and cell phones: will your fridge, toaster, range and microwave all have high-res displays? If not, hinting may be with us for longer than we think, just important on a different class of devices.</p>
      <p>Guifa wrote: <cite>Sometimes OS X’s hinting can be somewhat shoddy.</cite></p>
      <p>OS X is doing rasterizing (rendering), not hinting. Hinting is what goes into the font, and rasterizing is the process of taking that hinted font and turning it into a pattern of pixels on screen or dots in print.</p>
      <p>Sorry for being picky about the terminology, but this stuff is plenty complicated even when we're using the right terms for things!</p>
      <p>Cheers,</p>
      <p>T</p>
