      <p>Sometimes OS X's hinting can be somewhat shoddy.  Especially if a glyph contains multiple shapes.  Compare a single grave à with a double grave ȁ.  The double grave almost doesn't even register at 12pt and is less than a hairline at even 18-24 pt.  But the larger the font size gets, the more the two acutes look the same.  It seems to happen more with negative sloped forms (compare double acute a̋ to double grave ȁ) or those whose looser curve is above a tighter curve (compare breve ă inverted breve ȃ).  But I've even run into it causing problems with the Cyrillic ы in one of the fonts I'm working on.  </p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos.» (La Luz Oscura, por Javier Guerrero)</em></p>
