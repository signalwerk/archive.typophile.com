    <p>I am currently starting to try dig in a little bit deeper into the hinting process of fonts. Actually I would lie if I said I understand it completely, but slowly getting there perhaps.</p>
    <p>Here is one interesting issue I noticed, however,  which makes me wonder if hints really are that good. It could also be that I am missing something very important here, but everybody tells me that Autohinting with Adobes AFDK 2.0 is quite good.<br>
    What I have done here is to make one font with hints and one without. The standard stem values are the same and also the Alignment zones have the exact same value.</p>
    <p>Now look what happens when I use the font in InDesign. The funny thing is that, the bigger size the worse hinting.</p>
    <p>In the last example the letters are really distorted as you see.</p>
    <p>Any thought on this? Thanks in advance.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hintsornotwhat_4501.png"></div><p></p>
