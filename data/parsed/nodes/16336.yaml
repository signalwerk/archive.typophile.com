      <p>You’re starting to push things to the edge at random locations and it’s creating awkward tension by design. You’ve approached the edge at some points but design wise you’re still straddling the line and it gives your attempts a lack of confidence I’m not sure you want.</p>
      <p>Out of your three type choices for the title the third, Avant Garde?, seems to be the best. The modern aspect of the second doesn’t work well with the big, blocky simple style you’re going for. The first face is too funky and ‘fun’ if you will.</p>
      <p>BTW if you upgrade to Flash Player 8 you can now Insert Images into your post, thus you would be able to add this into your old thread.</p>
      <p>-Dave</p>
