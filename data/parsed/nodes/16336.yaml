      <p>It seems that your k’s are being read as 7, you could try the k shape that Eben suggested from the P22 constructivist set (the simple rectangle with a triangle removed from the righthand side). When I think of Russian propaganda art I see the heros (worker and soldier) gazing, off right, to a new future. If you divided the width of your logo into three unequal parts and used that k shape overlapped in red, white and black (or whatever colour order you want) and have as the right hand area a simple rectangle, you could create a stong legible image that would work on its own and with the strapline.<br>
      Tim</p>
