    html: <p>I just spent some time going through 23 pages of hand-printed fonts , and concluded that this is not one of the 500 or more fonts I looked at. My 'rule' about hand-printed fonts, is that if you can't quickly find the exact one, then find something close and use that. <br> <br>The reason for that 'rule' is that these kinds of fonts can be made for as cheap as FREE, and anyone who can print can have one made, so the odds that this designer used a font you can find (even if it is available anywhere) is extremely small and usually not worth the effort. <br> <br>The closest fonts as far as stroke, did not match the letterforms, but I don't know what there is about this font (it IS a font, because the 'n''s are identical) that you particularly like, but if you look through <a href="http://bowfinprintworks.com/Script11Pg1.html" target="_blank">Part 11 of the Script Font ID Guide</a> (Everyday Hand Printing), you might find something that has the same quality you like about this font.  You could also use MyFonts and search on 'handwriting' and get to look at 482 fonts with many duplicates and other sorts of 'handwriting' that are nothing like this style.</p>
