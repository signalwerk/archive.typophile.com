      <p>Good match, except for the beaks at the end of the arms on T.<br>
      I checked my copy of the font &amp; it does not include this T as an alternate. Nor is it in the ATF design [I checked the 1923 specimen book] on which the digital font is based. Perhaps this is a Caslon 540 modified by the designer to get a slick effect?<br>
      Don</p>
