      <p>Each person has their own reasons and methods. They may not be universally accepted or even appreciated by some others but that should not prevent them from choosing their own path. Weingart has spent his life as a teacher and has been successful at it with the methods he chose.  Others may be successful teachers doing quite the opposite.  That is the beauty of the human mind. It does not have to be confined by the opinions of others. There are plenty of things he has done which I might look at and say "that is crazy". I am still glad he did them, otherwise how would I know what would have been?</p>
      <p>ChrisL</p>
