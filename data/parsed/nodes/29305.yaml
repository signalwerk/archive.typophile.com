      <p>I found him to be a very good teacher, and visually very perceptive.  He was much more open than I thought he would be.  He is also a lot of fun.  Like any teacher, learn from him what you can in your short time together but don't be afraid to question what he says. He is open to that and the dialogue which follows is a very good thing for both of you.<br>
      He is not a type designer, he is a skiiled and creative type user who pushes the boundries of visual syntax purely with type--and a very limited palette of it.  Think of it like reducing the number of variables in a scientific experiment. It is easier to focus on the manipulated variables if you control as many of the others as possible.</p>
      <p>ChrisL</p>
