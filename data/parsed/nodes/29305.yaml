      <p>I don't think that he has a homepage, Aziz. But he is/was a great typography professor in Basel, Switzerland.</p>
      <p>Satya, I had the opportunity to spend an afternoon with him a few years ago. He has great stories to tell. Personally, I'd like to know what he thinks about the new avant garde in Swiss graphic design… it is very different from the movement he helped create back in the 1970s. I'm talking about teams like Lineto, Büro Destrukt, Optimo, Norm, and all these great students making new (but often illegible) grid- and system-based typefaces.</p>
