    html: <p>I had the unbeatable pleasure of studying with Weingart this summer—an amazing teacher and a very generous individual. And he loves being asked questions, is alarmed when students exhibit no curiosity, especially curiosity about the past, about history. So do pose questions. You could ask about his approach to teaching, the years with Armin Hoffman. Also, you could talk about what he sees as the difference between laying out by hand as opposed to laying out on a computer, about the disappearance of manual work in typography. If you really want to get him going, you could ask about his views on grids...</p>
