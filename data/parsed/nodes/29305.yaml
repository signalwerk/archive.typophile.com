      <p>sorry all. i was a bit busy in academic issues and thus couldnt reply.</p>
      <p>Chris..weingart couldnt recall this crazy Greek guy's name but yeah he told me that he had a short two weeks typography class there. </p>
      <p>Linda, i told him abt you and yeah he knows you. he told me to say hi to you :)</p>
      <p>Dan, I aslo spoken abt you. He said that he went there at Linotype office but i think it was not one which is in bad hamburger. where did you met him?</p>
      <p>While dinner he asked me that how do u I know a lot abt him..as I was the only one who asked maximum questions in the session. I told him that am a member of typophile and we've already discussed you there. and i think he knows abt this forum.</p>
      <p>i really liked him what said in the session. he said we dont need much typefaces now. As he said in his book that only four typefaces can address any typographic problem. He discussed his book..I asked him abt his round compositions. </p>
      <p>When I asked him abt his experience with hoffmann and ruder, he showed us a picture taken in NID when he, hoffmann and ruder visited NID in early 60s(sorry I couldn't recall the exact year of visit). he was around 20 at that time.</p>
      <p>He made me shut by saying that its a different story when i asked what he thinks abt Helvetica. :)</p>
      <p>he discussed hot metal, and he showed some of his works. </p>
      <p>For now he has no plan to write any other book..But i told him that plz make it lighter this time( he laughed)..its too heavy to hold;)</p>
