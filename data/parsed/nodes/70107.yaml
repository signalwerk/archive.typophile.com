    <p>Hey fellow Typophiles! This is my first post here, as well as my first logo.  I would love your input on it!</p>
    <p>I have two versions, a black and white one for purposes of evaluating form (of the utmost importance), and one that puts the logo on a simple background with a slight drop shadow (just for fun).  Please let me know the following:</p>
    <p>     First impressions</p>
    <p>     Readability</p>
    <p>     What comes to mind when looking at it</p>
    <p>     How it reads</p>
    <p>     If it is directly infringing on anything (I hope not)</p>
    <p>     Recommendations, critiques, ideas</p>
    <p>And so here they are:</p>
    <p>Form:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MW-logopond_5641.png"></div><p></p>
    <p>Just for fun:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MW-logopond-color-small_6653.png"></div><p></p>
    <p>Also it should be noted that I will be integrating the word GRIFFIN underneath the logo.  I'm thinking of designing my own font to keep it in keeping with the logo, but if you have any suggestions for typesets that would be awesome!  Thanks!</p>
