      <p>WM in a monogram form from the top post -- I saw the exact same logo (<em>ex-act</em>, down to the rounded corners) in use here in Vancouver. Cannot quite place it, but it had to do with construction, most likely demolition or waste management. I will try and snap a photo of it next time I see it.</p>
      <p>Which brings me to my point - I saw that logo, I liked it for its geometrical construction and then immediately forgot what it was for. Remembered the MW, but it didn't connect to the actual branding subject. And that's the problem - the design is nice, but it is sterile and it exists in isolation just for the sake of itself. If you are to scribble MW with your left hand, that would probably make a more identifiable logo.</p>
