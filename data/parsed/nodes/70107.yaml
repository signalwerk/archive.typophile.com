      <p>I don't know what it's supposed to communicate. What will it be used for, what kind of business? I think I'm a bit underwhelmed by it, it's not very spectacular. I think the use of type under the logo will be very important for the logo. Start working on that.</p>
      <p>And be careful creating nice shaded, gradient silvery versions of the logo before you get the shape as you want it. It's better to work in simple black and white, as it will give you the clearest picture.</p>
      <p>Define what the logo is for, is there a target group, what are competitors in the same field doing. Is it recognisable? Does it jump out? What associations is it supposed to convey? etc. Don't jump the gun in trying to make it look like a final version and try out several ideas before settling on one to finalize. Process is everything!</p>
      <p>Good luck</p>
