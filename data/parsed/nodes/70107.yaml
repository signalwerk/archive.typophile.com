      <p>@mwgriffin: For more meaningful feedback, it would help if you gave a bit of context. Such as:</p>
      <p>1. What do you do?<br>
      3. Who are your (desired) clients?<br>
      4. What/who is GRIFFIN?<br>
      5. What is your greatest strength?<br>
      6. Is this personal, professional or academic?</p>
      <p>Good design is based upon informed decisions and fitness for purpose, not simply aesthetics. Without context all one can do is make subjective comments such as “my favorite colour is blue” which at the end of the day just pushes you (and your clients’ time and money) around in a circle.</p>
