      <p>Hey thanks everyone for your comments!</p>
      <p>@riccard0, Justin_Ch   I was worried about that.  People had no problem identifying the logo as MW when it was just MW, but now most people I've asked think it looks like MIG.  I have thought about what I should do to address this issue and the only solution I can come up with is to separate the letters into their individual entities.  I really like the incorporated look, but I think it just cannot work in terms of readability.</p>
      <p>@frode frank I think I know what you are talking about.  I had someone point that out to me on logopond.  It's the Wiesinger Music logo: <a href="http://logopond.com/gallery/detail/40832" rel="nofollow">Wiesinger Music</a></p>
      <p>@Christopher Dean Hey thanks Christopher for reminding me.  I answered most of those questions in my post just above my most recent one.  To reiterate what I said before and directly answer your questions:</p>
      <p>1. I do some web development, lots of 3D work, and starting back at ceramic sculpture work.<br>
      2. Where's 2?<br>
      3. Because this will be used on my personal website I will not have any clients.  However I do want it to say something about myself.  I do not know why I want it to be this way, but I have a strong feeling that I want it to be simple and bold.  I am a fairly complex person, with many talents, so it may be that I am striving for some simplicity.<br>
      4. Griffin is my last name.  The logo is my initials.  I think I should incorporate my full name somewhere, but I have no clue where to start on that...  Any tips would be great.<br>
      5. It is personal.  I am very tech oriented and logical, while still manage to maintain creative on my 3D cgi and sculptural fronts.  I am a very 3D oriented person, so I sometimes find it hard to work in 2 dimensions and I am in a transitional point in my life.  So please forgive me if I do not operate with complete certainty on this logo.  I was thinking about designing my personal logo around the theme of a griffin (the mythological beast) but I think I've psyched myself out of that on the basis that I have so little experience designing in 2D compared to my 3D endeavors.  Hope that answers your questions!  What do you think?</p>
      <p>Here's an update!  I separated all of the letters so it is actually readable as MWG.  What do you think?  Any suggestions on where I should go from here?</p>
      <p><img src="http://files.mwgriffin.com/MWG-03-Small-01.png"></p>
