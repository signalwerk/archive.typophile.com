    html: "<p>Thanks everyone!  I figured I didn't want to bias your opinion by telling you what it was for, as I wanted to get an idea of what you thought it meant.  Here's some background information:  This is going to be a personal logo, that will represent myself and my website.  The site will be a mixture of a portfolio, and a blog.  I will be marketing myself as a webdesigner and 3D artist, that will (in three years) be an environmental scientist.  I wont really be stressing the environmental scientist part, as that is not what I will be trying to sell myself as, although I may want to incorporate that in somehow.  In some of my drafts I considered angling the logo and doing a 3d extrude, but I decided against it, for two reasons: first was that I just didn't like the feeling as much, it made it feel like I was a game designer or something along those lines.  And second is that when it was at an angle, it could almost be perceived as two letter E's (like the Enron logo) which I obviously didn't want to go for.  I wanted it's shape to be simple, but I agree I would like it to be attention grabbing as well.  And the type face will most assuredly have to fit the feel of the logo.  Thanks again!</p>"
    html_clean: "<p>Thanks everyone!  I figured I didn't want to bias your opinion by telling you what it was for, as I wanted to get an idea of what you thought it meant.  Here's some background information:  This is going to be a personal logo, that will represent myself and my website.  The site will be a mixture of a portfolio, and a blog.  I will be marketing myself as a webdesigner and 3D artist, that will (in three years) be an environmental scientist.  I wont really be stressing the environmental scientist part, as that is not what I will be trying to sell myself as, although I may want to incorporate that in somehow.  In some of my drafts I considered angling the logo and doing a 3d extrude, but I decided against it, for two reasons: first was that I just didn't like the feeling as much, it made it feel like I was a game designer or something along those lines.  And second is that when it was at an angle, it could almost be perceived as two letter E's (like the Enron logo) which I obviously didn't want to go for.  I wanted it's shape to be simple, but I agree I would like it to be attention grabbing as well.  And the type face will most assuredly have to fit the feel of the logo.  Thanks again!</p>"
