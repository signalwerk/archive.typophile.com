      <p>Hey thanks so much for your feedback everyone!  Your promptness and depth of your feedback astounded me.</p>
      <p>@omashuisje  I want it to read MW so I'm glad that was your first perception.  It never even occurred to me that it could read MU, so I am now pondering what I can do to make it really read as MW.  I feel like it should be clear. I wanted to incorporate the letters, to play off of their inverse relationship, along with giving it a singular form that speaks as a unified symbol.  I agree that the corners on the outside could be a tad more rounded (they are currently the same radius as the inner rounded parts).  I played with increasing the width of the inside lines, and I personally like this amount the best.  I tried sizing it down, to a business card logo size, and even smaller to a favicon size and they both worked out and retained the form.  The original version I had made had much narrower counters and not did not have the feeling I wanted, but also barely worked in a small form.</p>
      <p>@Queneau  I appreciate your critique!  It always helps to receive feedback that gives you ideas on how to improve a piece.  I will work on integrating the word GRIFFIN underneath it, simply adding it, without any thought to font etc, made the logo really seem to have more information.  I have to admit I am most assuredly an individual that likes to play around with many different versions of a creation, so at least I have that under control.  In reference to jumping the gun, I do that quite a bit.  Even if I know its not done, it's just so tempting to play around with it.  I am working on taking a much methodical and linear approach to my work, e.g. get the form down, then move onto other stuff, instead of form, color, other stuff, form, color etc.  So I really appreciate your feedback!  Do you think that integration of the type would make the logo less underwhelming?  Once I have the type underneath it in place and the actual form completed I think I will play around with the negative space, and use it to help convey what I want my logo to say.  I think it will be useful to write down attributes that I want it to convey.</p>
      <p>@bert_vanderveen What did it say to you?  After reading your comment I can only come to the conclusion that you read it as MU (It's supposed to read as a merged MW).  Is that the case?  If so I'm really going to have to think about some things...  </p>
      <p>So thank you again people!  More comments or critiques are always wanted!  I will have another update for you in the coming weeks.</p>
