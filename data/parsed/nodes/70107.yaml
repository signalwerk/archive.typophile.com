      <p>It would help us in giving critique to tell us some more about the why and how of the logo. It might be an okay logo for a construction company but completely unfit for a church... if you catch my drift.</p>
      <p>As for the shape itself: If they are supposed to be letters it reads MW to me. It somehow reminds me of the Enron and Caterpillar (CAT) logos somehow (I'm not saying that this is necessarily a bad thing) I feel like the shape is not great because it's too simple and unrefined. There is no tension in the shape because it's all straight lines and these lines are all of equal thickness. Tension can be created for instances by optical illusion, diagonals, etc. There is no one way to do this. You can also look at letter shapes to see how tension is created within a shape.</p>
      <p>The combination of type and logo will make it more complete, but they have to be a good match, these two elements have to be good in themselves and have to work well together.</p>
      <p>And keep showing us your progress, to see how you're getting on.</p>
