    <p>As far as I know, I have this font on my computer, but I haven't been able to find it now that I'm looking. I searched through a couple of font viewer programs on my computer, but still can't find it. I created this in Inkscape, copied the image to another file and then didn't save the image (d'oh!). I've done all the online font identifying I could figure out how to do, you're my last hope. Thanks for your help!</p>
