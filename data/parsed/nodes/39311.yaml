    html: "<p>#4 IMO has the best potential. With a few more tweeks I think you might have a winner. #1,2 and 3 are nice, but feel a bit in the moment. This is what I like about #4: readability (I'm not feeling the font choice though), the two wing feather vs three and letter spacing. You might want to try the font used in 3 and let it breath a little more and instead of the three wings use two. just some thoughts.</p>"
