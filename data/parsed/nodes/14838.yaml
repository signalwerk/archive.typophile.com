    <p>Blessings of the Masses<br>
    Blessings of the State<br>
    .<br>
    .<br>
    .</p>
    <p>Respect In Kind to the Typographic Intelligent Individuals here in these hallowed forums.</p>
    <p>I wish to ask for your help in identifying an new unknown. </p>
    <p>The following link is to a new VIRAL marketing campaign site for the upcoming Microsoft Game Console.</p>
    <p>There are surely very few instances in which the VIDEOGAME industry has done anything of typographical note;</p>
    <p>however please take note of the COUNTDOWN CLOCK NUMERALS in the background of this page :</p>
    <p><a href="https://web.archive.org/web/20170626074733/http://www.origenxbox360.com/">http://www.origenxbox360.com/</a></p>
    <p>: : : : : : : </p>
    <p>Might anyone be able to positively ID what typeface is in use ?</p>
    <p>It's reminiscent of a classic form but updated with a polygonal composition. </p>
    <p>.<br>
    .<br>
    .</p>
    <p>PLEASE LEND YOUR EXPERT OPINIONS + SUPPORT </p>
    <p>_ _ _ _ _  _ _ _ _ _  _ _ _ _ _ </p>
    <p>YOUNG PRAE,</p>
    <p>Aerosyn-Lex M.</p>
    <p>PEACE BE WITH YOU</p>
