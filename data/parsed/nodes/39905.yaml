    <p>Going through another thread: typophile.com/node/39632 brought up the thought of typography and the future.</p>
    <p>Films; Hollywood ones in particular, make projections from time to time on how the world might look in the future (eg. Minority Report)</p>
    <p>Does anyone know of similar exercises with type. </p>
    <p>I know of all those typefaces that were inspired by 60s and 70s sci-fi. But anything that draws from more recent paradigms in science/technology? Ideas more evolved than say Blur or the many pixel-fonts.</p>
