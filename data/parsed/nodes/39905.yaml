      <p>I get the impression that futurism in the visual creative fields is sort of fading out in the same way it has done so in science fiction. So many of the twentieth century’s preconceptions of the future just turned out to be dead wrong because people imagined the twenty-first century all of the wrong: genetically engineered people flying through space staring at CRT screens and only important people had anything resembling a cell phone. I think that the same sort of holds true of futurism and type; people assumed that type would reflect computers of the time, instead type fit to computers has become anachronism and all the old notions of type are being revived. I expect that in a few more decades screen resolution will have increased pretty dramatically (e-readers are already in the 120-160 dpi range) and there may not be any reason for type to have strayed too far from the path its on now.</p>
      <p>One could argue that there are futurist tendencies in the orthographic reforms proposed by Bayer and Crouwell, but that could simply be an impression ingrained in our minds by the people who used those types to seem futuristic because they were unfamiliar.</p>
