    <p>Hello,</p>
    <p>My questions would probably appear quite obvious to you, but I have failed to find any answer around Google or in the AFDKO specs (perhaps because I'm not using the good keywords?)</p>
    <p>I'm using a spanish OTF font with (Lua)Latex which shows some minor problems for my language (french, namely) and, for example, comes with very tight-kerned apostrophe. I use a .fea file in Latex to add some space around it, and fix some exotic glyph combinations. </p>
    <p>First, I have very few specific problems with the italic variant, and would like to create a my-kerning-it.fea which, first, loads my standard file (namely my-kerning-rm.fea) to apply it to the italics, and, 2nd, adds one or two more positionning lines specificaly made for italics, instead of having to copy and paste from one file to another each time I'm tuning the standard roman .fea file. Is it possible to do so?</p>
    <p>Second problem, when I'm writing my file, I'm trying to cover any possible variants of a character, and uses long lists of glyphs, like:</p>
    <blockquote><p>pos L quoteright' 10 [A Aacute Abreve Acircumflex Adieresis Agrave Amacron Aogonek Aring Aringacute Atilde];</p></blockquote>
    <p>Is there any glyph class by default, eg. <em>@A_&amp;_variants</em> like the <em>@smallcaps</em> one cited in the 2.g.ii. part of the <a href="http://web.archive.org/web/20081207035530/http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#2.g" title="Click to visit an external URL." class="freelink freelink-external freelink-external">AFDKO file syntax help</a> from Adobe? (Note I'm using an old one, for compatibily reason in Latex.)</p>
    <p>Thanks for attention,</p>
    <p>PC</p>
