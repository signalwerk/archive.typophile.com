      <p>All names used for classes in the <code>.fea</code> file are lost when the <code>.otf</code> font is generated. I can see no way  to  access those classes from a <code>.fea</code> file to be used with LuaLaTeX.</p>
      <p>If I understand well the other question, you would like a way to include a generic <code>.fea</code> file in other <code>.fea</code> files instead of copying its content for each. According to your reference, there is indeed an  <a href="http://web.archive.org/web/20081207035530/http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#3">include command</a>  that should do exactly that but I don't know if LuaTeX implements it or not.</p>
