      <p>I am still not sure I understand what you want. If you simply want to use <code>\textit</code> to switch font and get the proper features, the <code>fontspec</code> package already allows you to do that. You can specify in <code>\setmainfont</code> not only the features for the italic but even the font you want to use as the italic when calling <code>\textit{}</code>. Here is an example where I asked for an c_t ligature in the regular and an s_t ligature in the italic:</p>
      <p>\documentclass[12pt]{article}<br>
      \usepackage{fontspec}</p>
      <p>\setmainfont[<br>
       UprightFeatures = {FeatureFile = garreg.fea},<br>
       ItalicFont = Garamond Premier Pro Italic,<br>
       ItalicFeatures = {FeatureFile = garit.fea}]{Garamond Premier Pro}</p>
      <p>\begin{document}<br>
      Action station \textit{action station}<br>
      \end{document} </p>
      <p>And the output is:<br><img src="/sites/default/files/old-images/ligs_5294.png"><br>
      As you can see the c_t ligature is active only for the regular and the s_t ligature is active only for the italic, all that with standard LaTeX commands to switch fonts, provided you properly specified your choices in  <code>\setmainfont</code> (there are also commands to modify your choices).</p>
