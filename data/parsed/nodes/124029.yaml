      <p>Hi Michel and thanks for your answer.</p>
      <p>For the first question, I have found something that help me a little, an <a href="https://github.com/georgd/EB-Garamond/blob/master/featurefiles/Regular/classes.fea">.fea class file</a> from another Latex package, Eb Garamond, with a lot of class definitions.</p>
      <p>The <em>include</em> command works fine, so the files are linked as I wished. The problem is now how to switch from one variant to another in Luatex without using each time an huge custom command like:<br><em>\setmainfont{Fontname}[FeatureFile={my-kerning-it.fea}]</em><br>
      instead ot the standard <em>/textit{}</em> one.</p>
      <p>It seems like a problem that could be solved from the .fea file with an <em>Ifdef</em> command, as I see in <a href="http://get-software.net/fonts/amiri/sources/amiri.fea">that one</a>:<br><em>ifdef ITALIC<br>
      include "italic.fea"<br>
      endif</em></p>
      <p>But it's not working for me, and I can't find any documentation about that <em>Ifdef italic</em> command in the AFDKO reference file. I think I'm gonna let the italics standard kerning for now, until I find a way to use it the standard way in Luatex.</p>
