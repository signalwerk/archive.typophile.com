      <p>Kind of depends on the context, but here are some I recall being popular (some more unique to the Eighties than others):</p>
      <p>Van Dijk<br>
      ITC Garamond<br>
      Univers Condensed<br>
      Onyx<br>
      The LaserWriter 35<br>
      Century Old Style<br>
      ITC Franklin<br>
      Crillee<br>
      Bernhard Modern<br>
      Benguiat<br>
      Enviro<br>
      Transmission<br>
      Scanner<br>
      Frankfurter<br>
      Freestyle Script<br>
      Radiant<br>
      Corvinus Skyline<br>
      Neville Brody's Adobe fonts<br>
      Early Emigre fonts<br>
      Bodoni<br>
      Early Adobe release (ITC Baskerville, Futura, Trump Medaeval, etc.)<br>
      ITC Fenice<br>
      Palatino<br>
      Goudy Old Style</p>
