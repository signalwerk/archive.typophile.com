    <p>Greetings all. A friend of mine is working on a design project meant to bring to mind the 1980s, and has asked me for some font recommendations. He recognizes an '80s font when he sees one, but he can't remember font names to save his life. When I think of '80s typography, the first thing that comes to mind is Remedy. Arquitectura and Lithos, though technically '90s fonts, also make me think of the Reagan administration. Does anyone have any recommendations I can pass on? He'd really appreciate it.</p>
    <p>AHL</p>
