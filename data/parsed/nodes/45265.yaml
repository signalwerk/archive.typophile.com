      <p>You can also use '1980s' in the search window at sites like MyFonts and FontShop. Some results seem questionable (at first glance), but many are correct, even if some typefaces were renamed to avoid revival copyright issues. </p>
      <p>Another place to look would be the ever-popular Phil's Photo book "Homage to the Alphabet" from 1985. Those are film types, but many have been digitized.</p>
      <p>- Mike Yanega</p>
