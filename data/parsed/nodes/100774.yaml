    html: |-
      <p>Rules of typography to consider: </p>
      <p>1. Lines should be 60-90 characters wide.<br>
      2. If your font size is 10, leading should be at least 4, more if your font is condensed.<br>
      3. On top, it seems you are trying to use a "newspaper" layout, and you can make it work if you use proper fonts. Right now your mix of fonts don't really work. They are almost similar. You want to choose fonts that compliment each other yet have contrast. Like an Jenson pro and a medium weight condensed avant garde. If you don't have experience mixing fonts, use typefaces from a similar family. </p>
      <p>Look at templates and research good typography, then apply it to your layout. </p>
      <p>Good luck.</p>
