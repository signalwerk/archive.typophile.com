    html: |-
      <p>I don't look at many résumés, but I'll give an opinion anyway.</p>
      <p>The top of the résumé has left aligned, right aligned and centered copy. For me, this is too much. I would prefer the top to be left aligned, just like the body.</p>
      <p>Too much font variation: The worst case is on the job title line, for instance, the one that begins "IT Project Manager". This line is half empty but there are four different font variations! First it's very bold, then its a less bold italic, then its a smaller italic with small numbers, then a slightly bolder roman with large numbers. On one line! This is two or three variations too much. The Adelle font looks nice in the body, though. </p>
      <p>Re: the "Almost PMP certified..." part at the type. To my eye this font doesn't go with any thing else. It's un-needed variation. What is the significance of the gray type throughout? Is this the more important stuff, or less important? It seems a little arbitrary.</p>
      <p>It's all just my opinion.</p>
