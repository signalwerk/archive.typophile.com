      <p>Layout:</p>
      <p>A bit too much going on here, try to have a minimum of 25% white space.  The paragraphs looks may be a bit too wide I think, try reducing the width (45-65 characters is often though of as the optimal). I can't say I'm an expert on résumés, but how about making it 2 pages to get the whitespace I suggested.</p>
      <p>How would the email-, twitter- and linkedin-links look as a single line on the bottom? </p>
      <p>And as J.Tillman said, too much font variation. </p>
      <p>Just some suggestions here :)</p>
