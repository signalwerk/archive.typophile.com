    html: |-
      <p>Besides what J said, the side margins are too small, and the line length is so long it's painful to read (around 100 characters--75 would be more comfortable). The type can be smaller, and the main headings can hang out into the left margin. But I'd avoid going onto a second page; nobody reads the second page of a resume, unless you're applying to be the chief brain surgeon at a big university hospital.</p>
      <p>This has nothing to do with typography, but if you have a college degree, you would be wise to include it (unless it's in something completely unrelated, like flower arranging). </p>
      <p>To me the word "exposure" sounds like "this is stuff that happened to me," when what you want to say is "this is stuff I accomplished." Could you replace it with something like "software skills"?</p>
      <p>In the same vein, it doesn't make a good first impression to have the very first word of your resume be "almost." I'd say something like "Project manager and entrepreneur known for successfully leading high-profile development projects through focused user-centered design. Currently enrolled in course for PMP certification." Also, you need a hyphen in "high-profile" for the same reason you need one in "user-centered." And avoid breaking a hyphenated phrase at the end of a line.</p>
