      <p>Actually, it's quite the opposite. In metal type terminology, a font is a set of letters of a particular style, in a particular size: e.g., 10 pt. Clarendon Bold. 12 pt Clarendon Bold would be another font. Since the digital versions can render the typeface in a very wide variety of different sizes, "font" simply doesn't work...</p>
