    html: |-
      <p>Nothing new in type snobbery.<br>
      Type culture, and design culture in general, has long looked down its nose at "trade".<br>
      For the longest time, book types have held the privileged position.<br>
      For instance, 19 th century sans serif (and other commercial genres) were omitted from type histories until quite recently.<br>
      Similarly, the historicist movement of the early 20th century, which completely dominated graphic design, has played second fiddle in most design narratives to modernism, which was rarely seen in mass media.</p>
    html_clean: |-
