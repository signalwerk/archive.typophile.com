    html: <p>The saturation of type snobbery is overblown by the general public. "Fonts" are a universal humor shorthand for "stuff that doesn't matter." Having any opinions at all about type makes you a type snob. It <em>offends</em> people that someone thinks about typefaces. People who readily acknowledge a common understanding of what is good or bad taste in music, and who will pick apart the slightest deviations from their ideals in a person's physical appearance, will deliberately use "hated" fonts "just to piss off hipsters."</p>
