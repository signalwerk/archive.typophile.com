    html: <p>Speaking for myself, I am always going to regard "typeface" as a practical description for a design family of raised mechanical letters that press or strike directly against paper. The term is useful and correct as it relates to letterpress or typewriter printing, but it is not more educated or professional than "font" when applied to photo or digital typography.</p>
