    html: |-
      <blockquote><p>what is your point? Fonts are the product.</p></blockquote>
      <p>I get that. But my point is that ordinary people see the word "font" much more than "typeface", and that's even true when they look at the names of the places selling type. "Font" is also much more common than "typeface" on computer user interfaces and in application menus. Microsoft Word doesn't have a "Typeface" menu, it has a "Font" menu.</p>
      <p>I'm not saying it's not an important distinction, just that "typeface" has become somewhat marginalized compared to "font", whether we like it or not, and that it's probably too late to do anything about it.</p>
      <p>By the way, I don't think the word "type" is in the same danger.</p>
