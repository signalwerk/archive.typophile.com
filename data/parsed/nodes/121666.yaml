    <p>Gentlemen,</p>
    <p>I am requesting your advice...</p>
    <p>I have been coding our company website and I'm having a hard time choosing fonts. Initially we had Google Fonts but they weren't doing it for me. I have very little experience and don't see typography in the same way you guys do.</p>
    <p>I purchased Proxima Nova (Thin, Regular, Bold) and Baskerville (Medium Bold). My intention was to make Baskerville the heading font and Proxima Nova the body but it just doesn't look right to me. </p>
    <p>Brief background about company: Established 1987 in New York City. I am a wholesale supplier of Men's designer tailored clothing and Women's contemporary. Our logo which was professionally designed is in Baskerville.</p>
    <p>Question: Please help me with making a decision on the following:</p>
    <p>Choices - Proxima Nova (Thin, Regular, Bold) including "A" and "S"<br>
    Baskerville (Medium Bold)</p>
    <p>Heading Font?<br>
    Body Font?<br>
    Heading font size?<br>
    Body Font size?<br>
    Line height for Heading?<br>
    Line height for Body?<br>
    Letter spacing for Heading?<br>
    Letter spacing for Body?</p>
    <p>I REALLY appreciate your time. I'm stuck and keep changing my mind due to inexperience.</p>
    <p>-Mike</p>
