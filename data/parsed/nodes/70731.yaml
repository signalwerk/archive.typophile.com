    <p>Hi guys,</p>
    <p>Any idea what a font like this could be?</p>
    <p><a href="http://yfrog.com/74lenz1j">http://yfrog.com/74lenz1j</a></p>
    <p>I am doing a poster and placing some supposed Scientific Illustration in it. Could you give me some suggestion of what font could i use? Do you know of any free font available for this test?</p>
    <p>By the way, this is a design question. Should small caps be used in this way? I find them a bit heavy<br><a href="http://yfrog.com/7esmallcapsj">http://yfrog.com/7esmallcapsj</a></p>
    <p>Thanks for any info!</p>
    <p>Cheers,<br>
    Sebastian</p>
