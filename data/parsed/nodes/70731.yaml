      <p>Hi Sebastian,<br>
      this is not a font, but handwriting. This style is called Kurrentschrift, it was popular in Germany until the 1940s.<br>
      Your sample reads ‘Junger Fliegenschwamm’ [young fly agaric].</p>
      <p>See these older threads for more information:<br>
      <a href="http://typophile.com/node/67004" rel="nofollow">German script on "Das weiße Band" movie poster</a><br>
      <a href="http://typophile.com/node/65337" rel="nofollow">Beautiful handwritten cookbook</a></p>
      <p>There are not a lot digital Kurrent fonts. DS-Kurrent, the font mentioned in the first thread, will bring you only somewhat close. If you need something more commonly readable, try <a href="/wiki/Viktor%20Solt-Bittner" class="freelinking" rel="nofollow">Viktor Solt-Bittner</a>’s <a href="http://new.myfonts.com/fonts/adobe/voluta-script/?testdrive=dock%3Dfalse%26size%3D87%26w%3D720%26src%3Dcustom%26text%3DJunger%2520Fliegen-Schwamm%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%252Cot.liga%26seed%3D27?refby=mfde" rel="nofollow">Voluta Script</a>.<br>
      F</p>
