    html: "<p>Just checking: did you finalize the SPACING of the font before starting the kerning process?  That's the way to do it. Even if you did, kerning is a time-consuming process. It's not easy to think of every possible combination. It helps to have text files handy so you can test everything visually (like in InDesign).</p>"
