    <p>Hi all, I have recently designed my 2nd typeface, and was looking for some feed back, and any suggestions on issues to watch out for in the future… I know that my characters in both fonts have too thin of a stroke, and I’m heaving kerning issues, it takes me as much time to kern as it does to do everything else, is that normal?</p>
