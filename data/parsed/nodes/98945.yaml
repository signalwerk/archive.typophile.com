      <p>Thanks all! </p>
      <p>I think Canada would have had its own textbook industry, as cross border trade was much less then. Also, the influence of the UK was still quite strong, especially culturally. As textbook design is both industrial and cultural, with the former influence by the US and the latter by the UK, it really is an interesting question.</p>
      <p>I was thinking more about university level texts, specifically economics textbooks. I believe that in Canada these would have been more likely to be US American. I remember looking at some old textbooks and their design was very different compared to the design of contemporary textbooks. I'm delivering a lecture on economics and have to design some PP slides of it. I thought I'd try to replicate the design feel of those old textbooks, hence my question.</p>
      <p>Thanks again for this and any additional info you can offer.</p>
