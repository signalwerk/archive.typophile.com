      <p>In the 1950s in the US, there were well-established textbook publishers that published for a national market, so there probably few differences between one part of the US and another. If you're interested in geographical variations between the US and other countries, I'm afraid I'm not familiar with what textbooks outside the US looked like.</p>
      <p>Did Canada have its own home-grown textbook industry at that time? If not, was Canada importing textbooks from the UK? Most US book typesetting in the 1950s was done on the Linotype, but in the UK, Monotype was the standard. </p>
      <p>The US textbook publisher Ginn and Co. (long since absorbed by Pearson Education) commissioned Morris Fuller Benton to design Century Schoolbook. American Type Founders released it in 1919 and later licensed it to other major manufacturers of typesetting machines, including Linotype. It was widely used in the US for textbooks for kindergarten through Grade 8.</p>
      <p>It's possible that you're asking about secondary textbooks (Grades 9-12 in the US) or college textbooks. In the 1950s, these looked very different from elementary (Grades K-8) textbooks. They used fewer illustrations and little or no color. They looked more like the trade books of the era, and would have used the same Linotype faces commonly used for trade books at the time, such as W.A. Dwiggins' Caledonia. </p>
      <p>Linotype casts a whole line of type on one metal slug, but Monotype casts each character as a separate piece. This makes Monotype much better for complex equations, fractions, and tabular matter, so even in the US, mathematics texts were often set on the Monotype.</p>
