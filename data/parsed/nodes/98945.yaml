      <p>Here's something else to factor in. In the 1950s, a full set of Linotype matrices suitable for the demands of textbooks (roman, italic, bold, and in 8, 9, 10, 11, and 12 point) cost around 2 thousand dollars (in 1950 dollars). </p>
      <p>In other words, about the same cost as a new car.</p>
      <p>The result was most printers didn't have that many *text* fonts. Secondly, the more complex the material (in terms of fonts required), the more magazines needed, and more expensive the Linotype machine. You could use a typical machine &amp; change magazines, but that cost, too. </p>
      <p>Also, printing more than about 5,000 copies meant using stereo plates and the presses needed to run them. The cast type wouldn't hold up for more than about 5,000 impressions. (Monotype was harder, but was still limited to about 7,000 impressions.)</p>
      <p>So, the types used were in some measure limited by what was available from your favorite long-run printer. They weren't going to add a font family to satisfy some designer's whim. </p>
      <p>As I remember, favorite typefaces of that day for adult reading were versions of Janson, Baskerville, Garamond, Caledomia (or an equivalent Monotype Scotch), Times Roman, etc. Some modern fonts like Bodoni were making inroads, but not, probably, in many textbooks.</p>
