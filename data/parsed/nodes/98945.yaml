      <p>One thing is that after Century Schoolbook, some textbook publishers would have specified Caslon, because that typeface was, to some extent, felt to embody the canonical form, the abstract ideal, of the Latin script - at least in some quarters.</p>
      <p>Caslon... and nondescript Scotch Roman faces... were, at least, what one would see in nineteenth-century textbooks.</p>
      <p>Sadly, my copy of Smith, Muzzey. and Lloyd isn't immediately at hand.</p>
