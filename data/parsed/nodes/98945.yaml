    html: <p>The textbooks used for introductory English at my schools in Japan are interesting.  They use a large neo-grotesque type (very similar to Helvetica but with a single-story 'a') for the first 1/3 or so of the first year text.  Then they abruptly change over to using Century Schoolbook, in gradually decreasing point size, through to the end of the third and final year.</p>
