    date: 2002-04-20T12:34:00
    date_raw: 20 Apr 2002 — 12:34pm
    votes: null
    html: <p> I don't know if a logo necessarily needs a concept. A logo is like a vessel -- fill it up with great branding and you have a great logo. Fill it up with bad branding or no branding and you have a bad logo. <br> <br>One might as well want to know the concept behind the Nike swoosh. It's one of the most recognizable symbols in the world and it's just a curved line. </p>
  - id: 2422
    user: 1250
    date: 2002-04-20T13:12:00
    date_raw: 20 Apr 2002 — 1:12pm
    votes: null
    html: <p> But the more a log makes sense, the more it will ellicit a positive reaction, and the more it will be remembered. <br> <br>Not all successful logos make sense (look at Citicorp), but it certainly helps. <br> <br>hhp </p>
  - id: 2423
    user: 1226
    date: 2002-04-20T13:39:00
    date_raw: 20 Apr 2002 — 1:39pm
    votes: null
    html: <p> I absolutely disagree with John . . . <br> <br>A peice of art can be good and not have a concept. An amazing peice of art is a good peice of art with a concept. <br> <br>I've seen poorly executed art that with a concept that is far better than exceptionally executed art with little or no concept. <br> <br>It's impossible to have a great brand without some purpose to it even if it's minimal. Brands and logos stem from something more than "becuase it just appeals to me" else they fail miserably as a platform to expand the identity of a company. <br> <br>And how could you possibly market a company based on nothing more than a look without a purpose? <br> <br>Stuart :D </p>
