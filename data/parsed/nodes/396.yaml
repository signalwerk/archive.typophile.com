    html: "<p>&gt;It's impossible to have a great brand without some purpose to it even if it's minimal. Brands and logos stem from something more than \"because it just appeals to me\" else they fail miserably as a platform to expand the identity of a company. <br> <br>I couldn't have said this better myself. I recently took a job for a non-profit lit/arts journal here in Minneapolis. I was given the prospectus to review, and it seemed like it would be a really fun job. The magazine made it seem like a real cutting-edge, modern, no holds barred, breaking all the rules publication. I was all set to start planning this really modern looking site, and you can imagine my disappointment when i received this: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/1210.gif\" alt=\"achelogo\"> <br> <br>Maybe it's just me, but Apple Chancery just doesn't do the great idea of this wonderful magazine justice. And what is the purpose of that rounded square, you ask. I asked the designer the same thing. The answer I got was \"well, I think it looks nice, and the calligraphic type is representative of 'writing'.\"   <br> <br>I offered to create something, for free even, but the editors thought it was too late. It's really too bad.</p>"
