      <p>Hi Andy;<br>
      What you see in the glyph palette in InDesign is the possible features the glyph could be a part of. I just generated Tabular Lining, Proportional Lining, Proportional Onum and Tab Onum.<br>
      I wrote the features:<br>
      feature tnum {<br>
        sub @linfig by @tablinfig;<br>
        sub @onum by @tabonum;<br>
      } tnum;</p>
      <p>&amp;<br>
      feature onum {<br>
        sub @linfig by @onum;<br>
      } onum;</p>
      <p>if I choose Tabular Oldstyle in InDesign I get it, even if I have Proportional Lining Figure.<br>
      When I mouse over the glyph palette I see possible actions between existing glyphs with names similar to my features and after adding Old Style figures the choise tab onum is no longer listed by the Lining Fig as you have it. But now I see pnum by proportional oldstyle though its actually in tnum feature and lnum by Lining Figures though its actually in the onum feature. So its the same naming, but not the feature on and off, it's the action.<br>
      And then until you have defined that default is lining you can get tabular figures by both tab Oldstyle and tab lining</p>
