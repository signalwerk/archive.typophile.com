      <p>That's whack, Andy. What does Text Edit see?<br>
      Did you know that you can access OT features using Text Edit. Here's how:<br>
      Type some text.<br>
      Select it.<br>
      Hit Command-T for the Font Palette.<br>
      Change the font to your OT font.<br>
      Click and hold the little "Tool" cog icon button in the bottom left corner of the Font Palette.<br>
      Select Typography...<br>
      A new palette will pop up which gives you access to your font's features. (Even SSes!)</p>
