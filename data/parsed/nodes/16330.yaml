      <p>About the ".lnum_tnum" naming, I was following Adam Twardoch's suggestions from <a href="http://groups.msn.com/fontlab/general.msnw?action=get_message&amp;mview=0&amp;ID_Message=4966&amp;LastModified=4675540745632224845" rel="nofollow">this Fontlab Forum thread</a>, he breaks things down pretty well for building a font that's going to take advantage of all four figure substitution possibilities, but that's not a concern with this font.</p>
      <p>His explanation is good (and I'll respond to that thread with this question when I've been approved to be added to the FontlabForum) in explaining that "tnum" isn't Lining or Oldstyle specific. I'm sure that InDesign just sees that a class can be switched from any kind of proportional to any kind of tabular and just assumes that the glyphs within could belong to either or both.</p>
      <p>I'm wondering if anyone else has tried to build an OTF with Prop and Tab Lining figures and see what comes up?</p>
      <p>Here's what InDesign shows for a glyph that is only in the tnum class and feature:<br>
      <a href="http://www.andyclymer.com/temp/featurepopup.gif" rel="nofollow">indesign feature popup image</a></p>
