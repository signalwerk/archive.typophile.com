      <p>So there probably isn't a problem with the way I'm building the features for this font, it's just because there's no way to describe to InDesign that in this font the tabular figures are always lining and never oldstyle?</p>
      <p>I'm curious though, the only figure related feature in this font is tnum but in the glyph palette when I mouse over a glyph from the tnum feature it says that the glyph is <a href="http://www.andyclymer.com/temp/featurepopup.gif" rel="nofollow">"Tabular Figures (tnum) + Oldstyle Figures (onum)"</a>, but why wouldn't it also assume that the glyph could be Tabular and Lining? If there isn't even an onum feature in the font I don't think we should be seeing "Oldstyle Figures (onum)" here, do you agree?</p>
      <p>Much appreciated,<br>
      -- Andy</p>
