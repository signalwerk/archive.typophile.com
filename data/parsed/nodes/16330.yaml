      <p>Well, I just wrote a whole lot, which got eaten by the site. :-(</p>
      <p>Your Default Figures (DF) being Lining Proportional (LP) might be confusing InDesign, as most fonts have Lining Tabular (LT) as default.</p>
      <p>Here's what you need to have as your feature:</p>
      <p>feature tnum { # Tabular Figures<br>
       # Latin<br>
          sub @classDF by @classLT;<br>
      } tnum;</p>
      <p>And this should be in your classes:</p>
      <p>@classDF = [zero one two three four five six seven eight nine];<br>
      @classLT = [zero.LT one.LT two.LT three.LT four.LT five.LT six.LT seven.LT eight.LT nine.LT];</p>
