      <p>Chris L writes:<br>
      &gt; A series of check boxes would do the trick.</p>
      <p>No, it would not. If you have a selection between two options (proportional vs. tabular, old-style vs. lining) or even a selection between four different versions (proportional old-style, proportional lining, tabular old-style, tabular lining), checkboxes are the worst UI implementation you could choose. </p>
      <p>Karsten writes:<br>
      &gt; (1) In which way are figure styles offered in TextEdit/10.4?</p>
      <p>Two groups of radio buttons, one for the proportion (tabular vs. proportional), and the other for alignment (lining vs. old-style).  </p>
      <p>&gt; (2) And, even more interesting, in what about<br>
      &gt; Windows Vista applications?</p>
      <p>That depends on how you write your XAML file. </p>
      <p>A.</p>
