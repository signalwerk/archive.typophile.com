      <p>Chester, </p>
      <p>As for the glyph name suffixes, they are fully arbitrary. You can call your lining tabular one "one.LT", "one.lftf", "one.ltf, "one.lnum_tnum", "one.liningtabular", "one.mylefteyebrow" etc. What is important is the use of the period and the suffixes. </p>
      <p>At Fontlab Ltd., we recommend using four-letter suffix parts that are derived from OpenType feature names due to consistency. The glyph name suffixes are not standardized in any way but the OpenType Layout feature tags are (lnum, onum, smcp). The only way you can have industry-wide consistency is to use consistent suffixes, and the only way to do it is to use suffixes based on standardized strings -- that being the OpenType Layout feature tags. So a small-caps A should be "A.smcp", but it can also be "A.sc" or "A.small" or whatever, but not "Asmall" (since there is no period and no suffix). </p>
      <p>Whenever there is a suffix where a glyph is accessed through a combination of features (like onum+tnum), we recommend sorting the suffix parts alphabetically and concatenating the suffix parts using underscore (e.g. "one.pnum_smcp" and "one.smcp_tnum"). </p>
      <p>But really, the only advantage of this approach is that it's systematic. If you don't care for being systematic, you can use any glyph suffixes you want. </p>
      <p>Andy, </p>
      <p>something is probably wrong with your OpenType Layout feature code. The glyph naming doesn't really matter so much. Contact Fontlab Ltd. support at <a href="http://www.fontlab.com/problem/" title="http://www.fontlab.com/problem/">http://www.fontlab.com/problem/</a> for that and we'll take a look. </p>
      <p>Regards,<br>
      Adam</p>
