      <p>Mr Clymer,</p>
      <p>&gt; I’m currently developing an OpenType font that<br>
      &gt; contains two sets of figures — Lining Proportional<br>
      &gt; figures as the default and Lining Tabular figures<br>
      &gt; activated with the “tnum” feature.</p>
      <p>So, your figures are all lining, and the distinction<br>
      is tabular vs proportional only.<br>
      Which means, you decide which set of figures shall<br>
      be the standard figures (say, tabular ones) and name<br>
      them zero one two three ... plus according class.<br>
      The other ones will be proportional, with appendix<br>
      .pnum (or whatever else, I confess my appendices<br>
      are quite arbitrary too) plus according class.</p>
      <p>The tnum feature now substitutes zero.pnum one.pnum<br>
      two.pnum three.pnum ... by zero one two three ...<br>
      The pnum feature replaces zero one two three ... by<br>
      zero.pnum one.pnum two.pnum three.pnum ... </p>
      <p>As long as you would not add oldstyle figures, you<br>
      don't need lnum (lining) and onum (oldstlye) features<br>
      at all.</p>
      <p>Chester -- DF/scotch as default is a VERY nice<br>
      solution!<br>
      (And the I-hate-doing-figures me says, oh dear, one<br>
      more set of figures ...)</p>
      <p>Mr Phinney --</p>
      <p>&gt; One option would be for InDesign to go to a model<br>
      &gt; where you set oldstyle vs. lining with one toggle<br>
      &gt; and tabular vs. proportional with another.</p>
      <p>... which would closer resemble how the features work ...</p>
      <p>&gt; But for most cases that would mean two trips to the<br>
      &gt; menu where today one gets by with one. So it’s not<br>
      &gt; an attractive option with the current UI.</p>
      <p>... which is true. And now I am curious:<br>
      (1) In which way are figure styles offered in TextEdit/10.4?<br>
      (2) And, even more interesting, in what about Windows<br>
      Vista applications?</p>
      <p>Karsten</p>
