      <p>On the TextEdit thing, note that OS X OpenType feature support requires OS X 10.4 or later. I'll bet Andy is using an older version of OS X.</p>
      <p>As for InDesign and the features, this is essentially a limitation of the way InDesign's UI is set up to access the figure styles in pairs: one of [lining, oldstyle] and one of [tabular, proportional]. If you have even one of the two features in the pair, InDesign will give people the option of turning on both features. The reasons for this have to do with InDesign not knowing what your default figure type is, and the fact that you might have one but not both features of one of the pairs, even though you are in fact supporting the desired result.</p>
      <p>One option would be for InDesign to go to a model where you set oldstyle vs. lining with one toggle and tabular vs. proportional with another. But for most cases that would mean two trips to the menu where today one gets by with one. So it's not an attractive option with the current UI. If some day InDesign gets a palette approach like Illustrator, it might be a little easier to go down that path.</p>
      <p>Regards,</p>
      <p>T</p>
