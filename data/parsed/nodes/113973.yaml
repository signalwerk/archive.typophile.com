      <p>Happy you found it. FYI this is a Classic Tuscan. Oldest version available as digital is Figgins Tuscan <a href="http://www.myfonts.com/fonts/hihretrofonts/figgins-tuscan/" title="http://www.myfonts.com/fonts/hihretrofonts/figgins-tuscan/">http://www.myfonts.com/fonts/hihretrofonts/figgins-tuscan/</a>  Other well made versions include  Michael Hagemann's Miss Scarlett Plain <a href="http://www.myfonts.com/fonts/fontmesa/miss-scarlett/" title="http://www.myfonts.com/fonts/fontmesa/miss-scarlett/">http://www.myfonts.com/fonts/fontmesa/miss-scarlett/</a> Another similar is Muskitos Caps <a href="http://www.identifont.com/show?9CZ" title="http://www.identifont.com/show?9CZ">http://www.identifont.com/show?9CZ</a><br>
      Don</p>
