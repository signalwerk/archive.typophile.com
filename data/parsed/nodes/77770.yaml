    html: |-
      <p>In my web search, I found <a class="freelinking external" href="http://www.360east.com/?p=30" rel="nofollow">Ahmad</a>, which may be just what you're looking for. Baseet and Jumeirah by <a class="freelinking external" href="http://lebrecord.com/?p=940" rel="nofollow">Pascal Zoghbi</a> may also be good choices.</p>
      <p>Of course, if I were trying simply to match all three languages, I'd probably start with the hardest one to deal with. Given that traditional Arabic faces tend to have a calligraphic appearance, I'd try to match David (as the Hebrew face) and Verona or something like that as the Latin face.</p>
