      <p>In my web search, I found <a href="http://Ahmad" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Ahmad</a>, which may be just what you're looking for. Baseet and Jumeirah by <a href="http://Pascal Zoghbi" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Pascal Zoghbi</a> may also be good choices.</p>
      <p>Of course, if I were trying simply to match all three languages, I'd probably start with the hardest one to deal with. Given that traditional Arabic faces tend to have a calligraphic appearance, I'd try to match David (as the Hebrew face) and Verona or something like that as the Latin face.</p>
