  html: "<p>Being a current fine arts student, I completely agree with David Cabianca's view of typography in that it is completely \"undervalued, misused and misunderstood.\" It seems, in my recent years of college (design), that the trends for learning the necessities of basic design, like typography, are all but prehistoric. It seems the educational goals for some schools has shifted or become influenced by strict economic goals. <br> <br>So, in my recent educational withdraw from learning the basic necessities of typography, I created a Typeface Survey to understand the expressive behaviors and ability to distinguish similar typefaces (serif vs. sans serif) of typefaces for my thesis, and anyone who would like to view the results. While researching a thesis topic last year, I became interested in cultural and social perceptions of typefaces. <br> <br>Please check out my basic survey and add to my collection of data:  <br> <br><a href=\"http://www.typemisconception.com\" target=\"_blank\">http://www.typemisconception.com</a></p>"
