    html: <p>I just went with the most frequently typed word for a script (from this study) when I put that text up. If anything, I have noticed that people have a hardtime coming up with single word, especially when multiple sans serif / serifs are presented. The door is essentially open for any input. Thank you I will reevaluate that line! - Brett</p>
