  html: |-
    <p>Hi, </p>
    <p>just wanted to let you all know about Type Camp; Type Camp conducts seminars and workshops aimed at enriching the typographic- and design-related knowledge of students, amateurs, and professionals. All events take place in a variety of countries worldwide and are led by some of the foremost typographers in the industry.</p>
    <p>The next event, Type Camp Galiano is taking place on Galiano Island BC from August 12-17. Instructors include Marian Bantjes, Shelley Gruendler and Ross Mills. Visit <a href="http://www.typecamp.org" title="www.typecamp.org">www.typecamp.org</a> for more information.</p>
    <p>Hope to see you there!</p>
