    <p><a href="http://upio.com/dev/example" rel="nofollow"></a></p><div class="imageWrap"><a href="http://upio.com/dev/example" rel="nofollow"><img src="http://typophile.com/files/book_6559.png"></a></div><br>
    <a href="http://upio.com/dev/example" rel="nofollow"><div class="imageWrap"><img src="http://typophile.com/files/book2_4958.png"></div></a><p></p>
    <p>Pictured above is a <a href="http://upio.com/dev/example" rel="nofollow"><strong>working prototype</strong></a> that makes reading articles and longer works on the internet more like reading a book. Its content (the entire article, or chapter, or book) is loaded from a database and the front end presents it as pages in a spread.<br>
    This started out as an experiment using baseline grids on the web; then on-screen readability. Over the past couple holed-up weeks here at home I dirtied my hands on the emergent technologies of the new internet, specifically HTML5's canvas element, CSS3, javascript libraries such as Mootools and jQuery, and RSS.</p>
