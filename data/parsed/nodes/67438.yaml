    html: <p>I see this project potentially plugging into Google Reader, or competing with it. I haven't yet determined how the layout engine will handle image scaling, cropping and placement, but I'd like to integrate an algorithm that produces interesting grid-based results, and allow for human input and correction of the design. One feature I'm considering that could appeal to designers is output to PDF in imposed signatures, to create booklets.</p>
