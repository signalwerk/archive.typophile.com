      <p><em>I have a few old catalogs (1969 &amp; 72) but the copyright prevents me from using them in a collage illustration.</em></p>
      <p>eduardo recife at <a href="/wiki/misprinted%252Btype" class="wiki">misprinted type</a> works with similar images for his collages; almost every one has a 50s/60s theme to it. presumably as they’re not being used in a ’commercial’ sense they’re ok to be used in this way, or perhaps copyright laws are different in brazil?</p>
