      <p>I contacted the holder of copyright and got a quick refusal, I’d guess because it is simpler to say no. Anyway, yes. I like Eduardo’s work and have always come back to collage as a form. Here I’m interested in the subtle communication of the time we (Pam and I) are from—the convergence of the pre-digital with the contemporary. We are both a bit old school maybe.</p>
      <p>So I’m just going to shoot this as I much prefer an SX-70 as a head.</p>
      <p>Thanks all. Off to thrift!</p>
