  html: |-
    <p>Hey everyone,<br>
    I am new to this forum.<br>
    A freshman you could say.<br>
    I am also quite fresh and ripe to typography as well.<br>
    I have shaken Bringhurst's hand and spoken to erik spiekermann.<br>
    I have not yet however read The Elements of Typographic Style to completion.</p>
    <p>I would very much like to find a Baroque or Renaissance face to pair with a very contemporary sans serif.</p>
    <p>Would you be able to lend me some advice?</p>
    <p>Thank you very much.</p>
    <p>Jaz Halloran</p>
