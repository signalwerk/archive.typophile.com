      <p>hey thanks a lot for getting back to me,<br>
      Ok, well the audience is 20 — 60 year olds.<br>
      (wide audience, yes, but let me explain.)</p>
      <p>It is an exhibition catalogue of 64 pages with vibrant colour images.<br>
      Check out the website: www. paintingsbelowzero.com</p>
      <p>The artist used cutting edge refrigeration technology to install paintings into a 400 year old church as part of a fortress in the mountains of Northern Italy.</p>
      <p>I would like to achieve a face to represent the history of the project as well as one to symbolize new technology.</p>
      <p>We are producing this catalogue to sell at two installations the artist will do January 2007. The purpose of this catalogue is also to send out to galleries and institutions in hopes that they will comission the artist to install his works in their space.</p>
      <p>Ok,<br>
      there you go, what is your response,<br>
      and thanks,</p>
      <p>J P H</p>
