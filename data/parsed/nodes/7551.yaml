    html: "<p>Itay K, <br> <br>Not sure I can agree on your letter choices. To my (male) way of thinking, \"masculine\" letters are more straight and \"feminine\" letters are more curved. <br> <br>Q, S , O, J, C, U - Feminine <br>M, N, F, E, L - Masculine <br> <br>Finally, the truth about why curved letters are more difficult for me to draw: I do not understand women (sorry dear). I'd love to hear the ladies register their thoughts on M vs. F letters. Not sure we are helping the project though. <br> <br>A game anyone? <br> <br><b>For the project:</b> <br>Masculine <i>is to</i> John Deer <br><i>as</i> <br>Feminine <i>is to</i> ___________.  <br> <br><b>For the typophiles:</b> <br>Feminine <i>is to</i> Ligature <br><i>as</i> <br>Masculine <i>is to</i> ___________. <br> <br>Masculine <i>is to</i> Pilcrow <br><i>as</i> <br>Feminine <i>is to</i> ___________.  <br> <br>What have I done? <br>Randy <br> <br><b>For the British:</b> <br>Masculine <i>is to</i> Randy <br><i>as</i> <br>Feminine <i>is to</i> ___________.  <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br></p>"
