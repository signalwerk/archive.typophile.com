  html: "<p>I am a senior graphic design major at the University of Wisconsin-Stout and am currently in my researching phase of a project. I need to collect information for a survey/brainstorm activity for my final senior project and need some input from a wide range of ages and equally distributed genders. Here are my instructions: <br> <br>DIRECTIONS: Brainstorm any imagery, objects, gender stereotypes, references to body parts, slang, assumptions, physicalities, personality traits, behavior, etc. associated with men and women throughout time and today. Once you list one for one column, try to list the opposite in the other column. PLEASE DON'T CENSOR YOURSELF. BE AS OPEN AS POSSIBLE! OBJECTS AND STEREOTYPES ARE WELCOMED IN THIS CASE! (ex. women-nurse men-doctor; women-emotional men-insensitive) <br> <br> <br> <br> <br>WOMEN           VS.          MEN</p>"
  html_clean: "<p>I am a senior graphic design major at the University of Wisconsin-Stout and am currently in my researching phase of a project. I need to collect information for a survey/brainstorm activity for my final senior project and need some input from a wide range of ages and equally distributed genders. Here are my instructions: <br> <br>DIRECTIONS: Brainstorm any imagery, objects, gender stereotypes, references to body parts, slang, assumptions, physicalities, personality traits, behavior, etc. associated with men and women throughout time and today. Once you list one for one column, try to list the opposite in the other column. PLEASE DON'T CENSOR YOURSELF. BE AS OPEN AS POSSIBLE! OBJECTS AND STEREOTYPES ARE WELCOMED IN THIS CASE! (ex. women-nurse men-doctor; women-emotional men-insensitive) <br> <br> <br> <br> <br>WOMEN           VS.          MEN</p>"
