    html: "<p>Not awake enough for a game but... on masculine and feminine letters... <br> <br>Masculine: R, G, H, D, B, P, N (not so sure about the curve thing) <br> <br>Femine: M, V, A, Y,  <br> <br>Just a feeling about them, I suppose... also, many Serifs are feminine (Goudy, however, feels like a \"boy\" to me, tho) ; many Sans are masculine...  <br> <br>What about numbers? As a little girl, I used to have definite feelings about certain numbers' genders and personalities... For instance, 9 is a girl and a bit of a bitch... 5, a very kind girl, 7 an irresponsible boy...</p>"
