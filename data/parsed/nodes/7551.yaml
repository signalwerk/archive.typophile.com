    html: "<p>Feminine: Fluidity, Petite  <br>Masculine: Rigidity, Massive  <br>  <br>For the project:   <br>Masculine is to John Deer   <br>as   <br>Feminine is to <b>Martha Stewart</b>.    <br>   <br>For the typophiles:   <br>Feminine is to Ligature   <br>as    <br>Masculine is to <b>dipthong</b>. Or are dipthongs considered ligatures? Hmmm. In that case I'll also have to say <b><i>punctuation</i></b>. <br>   <br>Masculine is to Pilcrow   <br>as   <br>Feminine is to <b>ampersand</b>.    <br> <br>######   <br>   <br>I'm not British, and I'm sure my answer isn't correct, but I couldn't resist.  <br>  <br>For the British:   <br>Masculine is to Randy   <br>as   <br>Feminine is to <b>Romantic</b>.   </p>"
