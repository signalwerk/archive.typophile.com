    <p></p><div class="imageWrap"><img src="http://typophile.com/files/coranto2plusHeadline_5859.gif"></div><br>
    The new and improved version of Gerard Unger’s masterpiece now features three new styles that have been engineered specifically for headline use. Coranto 2 makes the most of current newspaper printing technologies delivering clean, economic and highly legible text blocks combined with striking headlines. Coranto 2 introduces the addition of over 250 glyphs for a wider language support, redesign of most accents, new ligatures, 4 sets of numerals, arbitrary fractions, superiors/inferiors and more.<p></p>
    <p><a class="freelinking external" href="http://www.type-together.com/Coranto%202" rel="nofollow">More information on our website</a></p>
