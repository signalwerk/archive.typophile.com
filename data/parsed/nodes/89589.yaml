    <p>Hi, </p>
    <p>I am not an expert designer and actually learning designing. I have Psd template of a website and converting it to the Html format. In I have code almost everything well but i am getting issue in Navigation menu. I am using an image at the background of anchor text in the navigation bar. Image is of 25px height and it supposed to be shown on the hover. But i check after applying the css i can see the hover picture with 25px but instead background is stick with the size of actual size of text size of anchor text. Can anyone please help me in this? Thanks in advance.</p>
