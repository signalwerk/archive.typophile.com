    <p>I read today that Hackney council are going to remove all of Banksy’s Graffiti in the borough. Considering that his ’work’ goes for up to a million nowadays, (the price that Brangelina supposedly paid for one of his pieces), it would be a shame. The council should be encouraging people to go on a ’Banksy trail’ walking tour, not obliterating these works of art. It adds interest to an otherwise not very interesting area.</p>
    <p>Here’s a witty bit of vandalism I spotted last time I was in The Smoke.</p>
    <p></p><div class="imageWrap"><img src="/files/Vandalism_4637.jpg"></div><p></p>
