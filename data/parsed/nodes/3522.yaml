    html: <p>I think this may be lettering. Considering how common this type of lettering is, it's surprising there are not more typefaces in this style. Flange is close but it doesn't seem quite right to me. Nick Shinn's <a href="http://www.myfonts.com/fonts/shinn/beaufort/bold/testdrive.html?s=PAPPADEAUX&amp;p=48" target="_blank">Beaufort</a> and Jim Parkinson's <a href="http://www.myfonts.com/fonts/parkinson/modesto/lite-regular/testdrive.html?s=PAPPADEAUX&amp;p=48" target="_blank">Modesto</a> are also similar. There is also an older font called Weiss Gothic that's similar, but it doesn't seem to be available in digital format.</p>
