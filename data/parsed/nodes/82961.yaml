    <p>How often do you? Adventures in everyday identification.</p>
    <p>Please answer any portion of the questions below if you are so inclined. </p>
    <p>What ratio of good type usage vs. poor type usage do you encounter on a daily basis (outside of work)?</p>
    <p>Of the typefaces that you see and read everyday (outside of work), what percentage can you identify in a few seconds? For how long have you worked in your field?</p>
    <p>What were the first few typefaces you could identify instantly?</p>
    <p>Do you have any typography specific pet peeves?</p>
    <p>If you are a type designer, what do you think, how do you feel, when you see your work out in the world?</p>
    <p>If you could redesign traits of a specific character from a specific typeface which would it be?</p>
    <p>How often do you find yourself identifying the typefaces that you see used in everyday life situations. </p>
    <p>Examples; </p>
    <p>Signs<br>
    Adverts<br>
    Books<br>
    Television ads<br>
    Movie titles<br>
    Manuals<br>
    Government Forms<br>
    Brochures<br>
    Annual reports<br>
    Pharmaceutical Packaging<br>
    Toy Packaging<br>
    Food Packaging<br>
    Other</p>
