  html: <p> ok. so i have made some pixelfonts in my days.  <br>but i still need to know one thing. <br>mac can use bitmap fonts without the vector curves. but can windows do the same? <br>so far, i believe not, but i'm a mac person. <br>i need to listen to a pc expert. <br>this time around, i didn't bother to make the curves, only the pixels. (and it works just fine in mac) <br>and now people now want me to make a pc version. <br>is it really necessary to make the curves, or is there a way around this problem? <br>maybe i ought to make curves anyway to make it flash compatible, but that is another discussion. <br>-martin (core) </p>
