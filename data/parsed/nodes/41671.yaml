      <p>Jay Rutherford<br>
      Yes, yes, Type90 was indeed a milestone. My first big design conference was Design87 in Amsterdam, where Erik Spiekermann gave his "Sex and Type and Rock 'n' Roll" talk. I had attended a few local or national (Canadian) things, but Type90 was a revelation. The city of Oxford was nice (I bought lots of marmelade and had it mailed home at great expense), the Type90 post cards and such from Jonathan Hoefler were very special (commissioned by Roger Black, I believe). Susanne Licko's talk was brave, thumbing her nose at the old guys in a nice blue miniskirt, I seem to remember. She and Rudy noticed my early Emigre globe T-shirt in the lunch hall. I think Rhonda Rubenstein was there, as were many other luminaries. The Type90 T-shirts really sucked though -- a cotton-poly mix -- too thin, too cheap. Adam Twardoch had his on a few years ago (in Helsinki, I think) -- I don't know how it survived the years. Mine shrunk up to fit my 5-year-old son after two washings (maybe Adam has never washed his). </p>
      <p>[jr]</p>
  - id: 304216
    user: 2263
    date: 2008-10-01T12:08:00
    date_raw: 1 Oct 2008 — 12:08pm
    votes: null
    html: '<p>I was there. It was my first UK trip, my first type conference, and it all happened just before I started at RIT. I only heard about it when I met Mike Parker in Boston, maybe a month previous. It was an amazing turning point for me, discovering "famous" type people like Berlow, Carter and Spiekermann, plus other young designers like Jonathan. I made some wonderful friends I still keep in touch with. Fun memory: sneaking back into the bedroom window of the hostel after a late Type90 event. I believe I still have the conference program.</p>'
