      <p>Of course I remember Type90. It was the first big, wide-open ATypI conference (although Type87 in New York, which I couldn't make it to, was a precursor). Type90 was my first type conference, but I already recognized the social patterns, from conferences and conventions in other fields. It was exhilarating. I recall how startled everyone was at Zuzana Licko's talk, in an old Oxford hall, when she did an animated presentation in HyperCard and played loud music as a soundtrack. </p>
      <p>The prime mover of Type90, Roger Black, is spearheading the 2009 ATypI conference, in Mexico City, which we are in the midst of planning now. This year's conference, in September, is in St. Petersburg, Russia. </p>
      <p><a href="http://www.atypi.org/05_Petersburg" title="http://www.atypi.org/05_Petersburg">http://www.atypi.org/05_Petersburg</a></p>
