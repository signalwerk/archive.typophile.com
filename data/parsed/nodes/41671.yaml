    html: |-
      <p>There was Jeff Level's wine tasting/label crit where everyone went way past where they should have gone.</p>
      <p>Then there was the "Share a beer with Ed Benguiat" event, and Ed never showed up.</p>
      <p>I remember Mark Jamra bumming GItanes off of me in the lounge, and having to catch a cab to the outdoor festivities when I missed the bus. I met Bruno Maag there and he was excited to be moving to the States to work for Monotype.</p>
      <p>I remember the Linton Lodge where we stayed on the outskirts of town, the Jolly Farmers pub, and some chinese restaurant that claimed it served dim sum to the empress of japan.</p>
      <p>The pound sterling was trading at $2.</p>
