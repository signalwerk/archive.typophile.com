      <p>Now you folks are making me feel bad all over again, these many years later. I was so broke in 1990 that I could not have attended a type conference even if the only transit I had to pay for was a cross-town bus.</p>
      <p>But I am very glad to have met so many of you since then at other conferences. Something will have to go terribly wrong in my life or in the world to keep me from being at ATypI in Mexico City next year.</p>
      <p>powers</p>
