    votes: null
    html: '<p>I was there. It was my first UK trip, my first type conference, and it all happened just before I started at RIT. I only heard about it when I met Mike Parker in Boston, maybe a month previous. It was an amazing turning point for me, discovering "famous" type people like Berlow, Carter and Spiekermann, plus other young designers like Jonathan. I made some wonderful friends I still keep in touch with. Fun memory: sneaking back into the bedroom window of the hostel after a late Type90 event. I believe I still have the conference program.</p>'
