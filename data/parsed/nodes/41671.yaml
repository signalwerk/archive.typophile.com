    <p>I grow old. I grow old.</p>
    <p>And so I fear. Does anyone recall Type 90?</p>
    <p>The trauma of digital type – the pain of Beowolf eating your Helvetica - and is that in the movie?</p>
    <p>the beauty of "the type fight" purist vs digitist</p>
    <p>Please - if you remember, if you were there, admit it.</p>
