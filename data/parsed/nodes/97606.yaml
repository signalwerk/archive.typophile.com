      <p>@epiktet, Cool website and you should consider including the following books in your fonts 101 section.<br>
      <a href="http://www.amazon.com/Designing-Type-Karen-Cheng/dp/0300111509/" rel="nofollow">Designing type by Karen Cheng,</a><br>
      <a href="http://www.amazon.com/The-Stroke-Writing-Gerrit-Noordzij/dp/0907259308/" rel="nofollow">The Stroke: Theory of Writing by Gerrit Noordzij</a><br>
      and also <a href="http://www.amazon.com/Elements-Typographic-Style-Robert-Bringhurst/dp/0881792063/" rel="nofollow"> The Elements of Typographic Style by Robert Bringhurst</a></p>
      <p>And as far as which characters to start, i find it more easy to start with Uppercase and in uppercase start with letters with flat edges( H and N) , then go the ones with Slanting edges like V, W, X and then go to the ones with curved edges like C , O and R. For the typeface I am currently working on, I drew all the characters on paper but unfortunately the design I finally got is different from the original one( it's better, so no qualms). As far as lower case is concerned , follow what hrant said, though i would keep g and s characters for the last.</p>
    html_clean: |-
