      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Fontesques_4306.png"></div><br>
      This is the ﬁrst digital type I made. Admittedly I did have some professional experience at drawing and (rough) lettering for comps, but then again, Tobias Frere-Jones’ ﬁrst typeface, <a href="http://www.identifont.com/similar?J0" rel="nofollow">Dolores</a>, was along similar loosey goosey lines, and he was in art school at the time he designed it.<p></p>
      <p>Things were a bit more experimental 20 years ago, but nonetheless, I don’t see why the same approach isn’t valid today. You don’t have to create a meticulously subtle and professional masterpiece at your ﬁrst attempt.</p>
      <p>The advantage of basing your design on your own drawing or writing is authenticity. Cut and paste is a terribly banal thing if used without discretion, and discretion is something that must be acquired. There are a lot of hand-drawn types, of varying degrees of ﬁnish, that are quite popular and useful. Some of them have an idea about letterform, such as those skinny affairs where the lower case descenders don’t.</p>
    html_clean: |-
