    <p>Hi,</p>
    <p>I'm not a graphic designer by trade but I have decided to create my own font. I have been doing some research and initial drawing (see <a class="freelinking external" href="http://www.doppel-n.com" rel="nofollow">http://www.doppel-n.com</a>) but I was wondering what letters I should start with in terms of "setting up" the alphabet. I imagine if certain shapes are settled they can be reused for similar letters. Help is very much appreciated.</p>
    <p>HP</p>
