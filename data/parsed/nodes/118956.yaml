    html: |-
      <div class="comment-spam-body"><p>I typically use space before because that is how I was trained in the days of minicomputer typesetting so that's how my mind continues to work. However one does it, today it is very important to maintain consistency of use because different apps may treat before and after differently. That could really mess up a job if for some reason the job was moved between apps and there was a mixture of the two ways in the job.</p>
      </div>
