    html: |-
      <p>One important use of paired space before and after is to maintain perfecting text in running texts which include headings and sub-headings as it allows even fractional line spacings to be matched so that the first line of the subsequent paragraph falls perfectly on the standard text grid.</p>
      <p>You might for instance drop 5 lines of standard text for an A heading - use two of the line spaces for the enlarged heading itself with two and half  lines of space above and half a line below to ensure that the main text restarts on the grid and the pages of running text continue to perfect.</p>
      <p>Maintaining perfecting of running text with  a variety of inserted materials and absolute control of proportions of space around elements would seem to me to be the primary practical justification for this feature.</p>
