  html: |-
    <p>Some would say space before and after a paragraph is a  "you say tomato, I say tomato" kind of thing. </p>
    <p>I run into situations where we have added space before and space after that accumulates and gets very confusing especially when one is designing a template of a complex document. </p>
    <p>Bullets and numbered bullets are the worst. </p>
    <p>Generally speaking is there a "proper use" for before spacing and for after spacing? I imagine if only one was needed, only one would have been provided.</p>
    <p>JW</p>
