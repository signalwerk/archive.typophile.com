    html: <p>Personally, I'm not sure that the Bauhaus-esque face you are using suggests the "friendly, easy, kind, affable" because of it's intensely rigid structure. Humanist typefaces are what this is about. <br> <br>THe typeface you have used for the top 3 ideas is simple and clean, but lacks a human touch. <br> <br>As far as a good typeface to use, i will have to have a think about that, and figure out what "domotic" means.</p>
