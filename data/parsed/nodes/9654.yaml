    html: "<p>I prefer the type in the first set, but just the type in 'domotica' (both types). The second set seems too soft and overly-humanistic to me. <br> <br>But more importantly, the images you're using don't seem related enough to domotics and their purpose/benefits. I can see the connections you're making, but without the explanation they don't read quickly for me. Perhaps you could use something like the <a href=\"http://www.aiwaz.net/Leonardo/vitruvianman/\">Vitruvian man</a>. The idea of the human being central in a system, and having their abilities extended. Or perhaps you could emphasize the harmony between the person and their home (enabled by domotics). That would lead towards icons representing home. <br> <br>Also, I think the image of a remote is a negative, unless the remote is very unique and recognizable. (But maybe that's just me: I've got about 7 remotes at home, I don't want another one.)</p>"
