    html: <p>Domotic is dom(icile aut)o(ma)tic, I believe. I think that anyone considering that would prefer to use a company that represents itself in a hi-tech manner, therefore the bauhaus/chalet is more appropriate. The icon is another matter, your first icon represents to me a broadcast, whereas your last posts are a bit martial arts, I like the network/molecular structure of your fourth icon you could develop it for a more user-friendly, human feel, alternatively you could use a hand-in-control icon (whether as a click of the fingers or hand holding remote - heavily simplified) or use type to illustrate, your third logo is approaching this if the L was using the O as a button, although the radiating curves need work. <br>Tim</p>
    html_clean: <p>Domotic is dom(icile aut)o(ma)tic, I believe. I think that anyone considering that would prefer to use a company that represents itself in a hi-tech manner, therefore the bauhaus/chalet is more appropriate. The icon is another matter, your first icon represents to me a broadcast, whereas your last posts are a bit martial arts, I like the network/molecular structure of your fourth icon you could develop it for a more user-friendly, human feel, alternatively you could use a hand-in-control icon (whether as a click of the fingers or hand holding remote - heavily simplified) or use type to illustrate, your third logo is approaching this if the L was using the O as a button, although the radiating curves need work. <br>Tim</p>
