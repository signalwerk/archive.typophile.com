  html: <p>Hi again. been long time since last time. <br> <br>I've been asked to create a logo for a new domotic company. The owner basically want an image of friendly, easy, kind, affable, to surmount the idea of domotic = complexity, difficult, unaccesible...etc <br> <br>I've done few sketches in that way <br><img src="http://www.typophile.com/forums/messages/29/66885.jpg" alt="domo1"> <br><img src="http://www.typophile.com/forums/messages/29/66886.gif" alt="d2"> <br>The second is maybe more technological and less toy, more serious. <br><img src="http://www.typophile.com/forums/messages/29/66887.gif" alt="d3"> <br>More simple. <br> <br>Just wanted to try an alternative way, more conceptual of domotic as central access and management and interconection, intelligence,etc.. <br>I know it's distant from what's asked for, but what do you think about showing also this? Doesn't it keep the idea of simplicity and cleaness? <br><img src="http://www.typophile.com/forums/messages/29/66888.jpg" alt="d4"> <br> <br>thanks</p>
  html_clean: <p>Hi again. been long time since last time. <br> <br>I've been asked to create a logo for a new domotic company. The owner basically want an image of friendly, easy, kind, affable, to surmount the idea of domotic = complexity, difficult, unaccesible...etc <br> <br>I've done few sketches in that way <br><img src="http://www.typophile.com/forums/messages/29/66885.jpg" alt="domo1"> <br><img src="http://www.typophile.com/forums/messages/29/66886.gif" alt="d2"> <br>The second is maybe more technological and less toy, more serious. <br><img src="http://www.typophile.com/forums/messages/29/66887.gif" alt="d3"> <br>More simple. <br> <br>Just wanted to try an alternative way, more conceptual of domotic as central access and management and interconection, intelligence,etc.. <br>I know it's distant from what's asked for, but what do you think about showing also this? Doesn't it keep the idea of simplicity and cleaness? <br><img src="http://www.typophile.com/forums/messages/29/66888.jpg" alt="d4"> <br> <br>thanks</p>
