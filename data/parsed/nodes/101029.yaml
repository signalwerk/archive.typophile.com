      <p>Hrant: " ...some people (like the Kingsley boys before they called it quits*, and Vincent Connare) have actually used hinting to that effect!"</p>
      <p>Not likely. TT has no provision for using points in calculations, as in, "this is 9 point so do something special." We, and others make assumptions based on pixels per em, but 18 of them could be 6 pt, 12 pt or 18 and the hints would never know.</p>
