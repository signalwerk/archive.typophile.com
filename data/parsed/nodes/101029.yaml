    html: <p>The existing OpenType 'size' feature is a hack, and its no surprise that after fifteen years there is still almost no software that supports it. It involves co-opting the data structure of the GPOS table to store non-GPOS data about intended size range of a font. It requires a layout engine to access this odd GPOS feature prior to font selection; whereas normally GPOS features are the last things applied in layout. Everyone I've spoken to at Microsoft and Adobe agrees that this feature is a non-starter; what I've yet to get them to agree on is what should replace it.</p>
