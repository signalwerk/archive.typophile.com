    <p>So, this might have been discussed before, or it might be really far out there, but I thought about it and thought I'd get some input. </p>
    <p>In the era of metal type different sizes had different qualities. Especially didot-faces were adjusted between sizes, something that poses some difficulties using digital didot amongst sizes. When Monokrom launched their foundry, their catalogue had both Satyr and Faunus, which is the same face made for different uses. Text size and medium size. Would this be possible to implement in a font technology? Or would it just be a huge pain in the ass for type designers, not worth it, technically impossible etc? I'm talking about an automated process where the form of the font would adjust to the size set in the software. So, if I chose satyr in 10/12pt it would display as satyr and if I increased the size to 18/20 it would switch to what Monokrom calls faunus?</p>
    <p>Just a thought ;)</p>
    <p><a href="https://monokrom.no/catalogue" title="https://monokrom.no/catalogue">https://monokrom.no/catalogue</a></p>
