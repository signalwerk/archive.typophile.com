      <p>Clearly. </p>
      <p>As for automating the selection of size masters within a family, I think it should also be made clear that most font families released with discrete size masters, are a compromise subset of a font that contains, or contained, indiscreet outlines, gx variations, plain matching masters, multiple masters, whatever was used to capture a range of sizes, widths, weights or contrasts. </p>
      <p>Font publishers like myself would rather not publish a font for each and every point size, weight, width or PX size to satisfy the needs of e.g. print or responsive media. and, i think apps and font formats won't make way. Understanding all the intelligence in and around the use of a size range of typecases is simply too much for modern engineering.</p>
