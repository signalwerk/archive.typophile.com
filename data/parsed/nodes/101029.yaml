      <p><cite>Would this be possible to implement in a font technology? </cite></p>
      <p>It already is. There is an OpenType feature called SIZE that is supposed to select a font from a family based on the type size. </p>
      <p><cite>So, if I chose satyr in 10/12pt it would display as satyr and if I increased the size to 18/20 it would switch to what Monokrom calls faunus?</cite></p>
      <p>This describes, why the SIZE feature never caught on. There is little advantage for word processing and layout apps, where people make many conscious decisions about the typeface and their appearance anyway. Why not let them make that choice? It saves one click. So what? It might even lead to results the user doesn't want or doesn't expect. </p>
      <p>Such features might make more use when text is displayed on electronic devices in various formats and sizes. But there it is also already possible. On my blog I use a display typeface for headlines, but when the size of the screen is small (like on mobile phones) I use CSS media queries to replace the display font with a more robust typeface. Same idea. But doesn't need the SIZE feature or any other new technology.</p>
