      <p>TeX uses "optical sizes", and it attempts to make it resolution-independent by asking the user to input a scale factor. Something complicated, such as "give me 10pt size characters, for an intended output of 125%".<br>
      That can never work with fonts <em>alone</em> -- the rasterizer needs not only know the pixel size but also the intended "output" size -- the Zoom factor. And on top of that an optional output scale as well.</p>
      <p>Nick, your equalized stem widths for different font sizes sounds really great, but indeed there is (at current) no way to have software decide what size to use.</p>
