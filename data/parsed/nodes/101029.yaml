      <p><cite>I'm not sure if you're for or against the idea</cite></p>
      <p>Depends. When a family has display and body styles, the user can just select them. I don't see much benefit in automating this step. In the same way as I don't expect my app to automatically switch to old-style figures in copy text and tabular figures when I type in a table. These kind of automatic changes would probably be more confusing than helpful.<br>
      On the other hand: When I think of the Adobe type families where different weights &amp; widths are multiplied with up to 4 optical sizes, then this can create simply too much choice for the regular font user. Here an automatic style change or maybe simply a different style menu could help. But then again, such type families are so rare, I don't think it’s worth to push such possibilities just for a few font families.</p>
