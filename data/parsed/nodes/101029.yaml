      <p>Indeed it depends. For example to me it actually makes sense to automate the selection of a display versus a text cut of a typeface, for most people; but for "power users" (usually graphic designers well versed in typography) let them deviate from the default method (or even change the default behavior). Also, I would say there are changes that are subtle enough (such as an increase in stroke contrast for a display cut) to be worth quietly automating, versus more structural changes (like OS versus lining numerals) that are indeed risky to automate.</p>
      <p>hhp</p>
