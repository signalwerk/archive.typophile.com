    <p>New site offers a single source for desktop and Web fonts </p>
    <p>---View webcast at <a href="http://vimeo.com/41331573" title="http://vimeo.com/41331573">http://vimeo.com/41331573</a></p>
    <p>---View public beta at <a href="http://new.fonts.com/" title="http://new.fonts.com/">http://new.fonts.com/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/apr2012-main-graphic_3815.png"></div><p></p>
    <p>Monotype Imaging Holdings Inc., a leading provider of typefaces, technology and expertise for creative applications and consumer devices, has redesigned Fonts.com, launched today as a public beta release. Among its enhancements, the new Fonts.com debuts as the only site to offer typefaces both through a Web font service and as desktop fonts. The site has been given an aesthetic overhaul and now features many prominent showings aimed at inspiring designers and other type enthusiasts. </p>
    <p>The redesign was led by Happy Cog — a Web development agency founded by noted Web standards advocate, Jeffrey Zeldman. </p>
    <p>"We turned to Happy Cog for their ability to build websites that look amazing yet are highly functional," said Chris Roberts, vice president and general manager of Monotype Imaging's Creative Professional e-commerce group. "The new Fonts.com greatly enhances the experience of finding the right typeface." </p>
    <p>"As the owner of the largest repository of fonts available anywhere, Monotype Imaging needed Fonts.com to feel more intimate, intuitive and informed," said Christopher Cashdollar, creative director at Happy Cog. "Who out there knows more about the type industry than Monotype Imaging? This is an important differentiator. Now, not only can you come to Fonts.com to painlessly purchase fonts, you can learn about the history and evolution of type from some of the thought leaders in the industry." </p>
    <p>Among the site's features: </p>
    <p>Home page stage: A massive billboard area featuring inspirational typographic "hero images." The stage premiers with showcases of the Massif™ typeface, a newly expanded design by Monotype Imaging's Steve Matteson. The stage, which will be updated frequently to include inspiring new imagery from graphic designers and typeface designers, also debuts with showings from the Akko™, Gibson™ and Salvo™ Sans families. </p>
    <p>Integrated search and browse control: A control that allows users to perform keyword searches, or browse or identify fonts without leaving the home page. </p>
    <p>Enhanced search tools: Filter search results by language, format, availability as a Web font, or sort results by popularity or release date. </p>
    <p>Web fonts: All text on the new site is set in the Neue Frutiger® and Frutiger Serif typeface families. Both have been hand-tuned by Monotype Imaging's font experts. </p>
    <p>Family pages: Learn the history and view hand-built showings of prominent typeface families. </p>
    <p>Best sellers pages: View the overall best selling families as well as the best selling recent releases. </p>
    <p>FontGazer™ Adobe® InDesign® Plug-in: Monotype Imaging's new free tool that enables you to browse, try and buy fonts from Fonts.com directly from InDesign. </p>
    <p>The new Fonts.com can be accessed by clicking the link on the Fonts.com home page or by visiting new.fonts.com. Fonts.com Web Fonts subscribers can manage their Web fonts projects on the new site or continue to use the existing portal (webfonts.fonts.com) which will remain active indefinitely. New enhancements will continue to be made throughout the beta phase. Visitors can suggest new features, offer feedback or support suggestions from others through the Fonts.com Feedback Forum which can be accessed by clicking the ‘Feedback' button found on every page of new.fonts.com. </p>
    <p>A webcast that demonstrates the new Fonts.com is available at <a href="http://vimeo.com/41331573" title="http://vimeo.com/41331573">http://vimeo.com/41331573</a>. </p>
    <p>About Monotype Imaging </p>
    <p>Monotype Imaging is a leading provider of typefaces, technology and expertise that enable the best user experience and ensure brand integrity. Based in Woburn, Mass., Monotype Imaging provides customers worldwide with typeface solutions for a broad range of creative applications and consumer devices. The company's library and e-commerce sites are home to many of the most widely used typefaces — including the Helvetica®, Frutiger® and Univers® families — as well as the next generation of type designs. Further information is available at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Massif and FontGazer are trademarks of Monotype Imaging Inc. and may be registered in certain jurisdictions. Helvetica and Frutiger are trademarks of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. Univers is a trademark of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain other jurisdictions. Akko is a trademark of Linotype Corp. and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. Gibson is a trademark of Canada Type. Salvo is a trademark of its designer and The Font Bureau, Inc. Adobe and InDesign are trademarks or registered trademarks of Adobe Systems Inc. in the U.S. and/or other countries. All other trademarks are the property of their respective owners. © 2012 Monotype Imaging Inc. All rights reserved. </p>
