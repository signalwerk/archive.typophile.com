  html: |-
    <p>I am planning to do a type &amp; graphic design e-newsletter, distributed by e-mail to subscribers.<br>
    The content will be :
    </p><ul>
    <li>type tips and tricks</li>
    <li>tidbits from the type &amp; design world</li>
    <li>updates and new releases of Alphabet Design fonts</li>
    </ul>
    <p>I already have an e-newsletter called <em>alfaBITS</em> geared towards the general business audience with tips on marketing, managing, etc.</p>
    <p>The winning entry will receive a collection of Alphabet Design fonts worth $100. Two runners-up will each receive a single font.</p>
    <p>Please visit <a href="https://web.archive.org/web/20080908090640/http://www.alphabet-design.com/" title="www.alphabet-design.com">www.alphabet-design.com</a></p>
    <p>Thanks!</p>
