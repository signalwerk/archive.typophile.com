    html: |-
      <p>Since its lettering on a racecar, there may be some variation from the original font. The closest I can find is <a href="//www.myfonts.com/fonts/linotype/congress/black/" rel="nofollow">Congress Black</a> Designed by Adrian Williams published by Linotype in 1980.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/CongressBlack_5263.jpg"></div><br>
      The counters aka bowls in Congress Black have a more rounded appearance than your lettering, which has something of boxy or squarish effect. I also note that your lettering is wider than Congress Black.<br>
      Don<p></p>
