    html: <p>Though theft and borrowing was fairly rampant among nineteenth century foundries, I doubt the Cleveland version is based on the MS&amp;J. Bit more happening with the former. They usually don't clean up this well. Could very well be the inverse. Hate to call any of this stuff Victorian. What actually is that? I think you need to look at late eighteenth century French foundry specimen books to find the origins of many of the Anglo-American nineteenth century display faces.</p>
    html_clean: <p>Though theft and borrowing was fairly rampant among nineteenth century foundries, I doubt the Cleveland version is based on the MS&amp;J. Bit more happening with the former. They usually don't clean up this well. Could very well be the inverse. Hate to call any of this stuff Victorian. What actually is that? I think you need to look at late eighteenth century French foundry specimen books to find the origins of many of the Anglo-American nineteenth century display faces.</p>
