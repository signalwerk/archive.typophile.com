      <p>The swash characters from Mark's specimen matches a specimen from a friend's personal collection of metal and Ludlow type. This was back in the mid 70s and I think he used to buy old type cases from out of business printers. His sample is marked Antique Initials No. 2, which was probably a drawer separated from the regular complement. It looks like a 48 pt. sample.</p>
