    html: "<p>Here's a better scan from a larger sample: <br> <br><img src=\"https://web.archive.org/web/20141113205919im_/http://www.typophile.com/forums/messages/30/13956.gif\" alt=\"kosterb2\"> <br> <br>Both samples are from old photo display face specimen books. I've only ever seen Koster in that form.  <br> <br>I remember it was part of the type library at a magazine publisher I once worked for. I could never figure out why it was chosen. I think some of the people in the typesetting department had different tastes than the art directors. We thought it was kind of a joke. I don't think anyone ever used it.</p>"
