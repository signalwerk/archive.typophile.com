    html: <p>Hrant <br> <br>The specimen Mark showed are indeed the Koster Initials as orginally designed by William J Jackson for MacKellar Smiths &amp; Jordan. Patent design 1888. <br> <br>This means that the initials you are asking about, with the Cleveland pinmark, are misidentified. <br> <br>Cleveland Type Foundry went from 1875 to 1892 when they were absorbed by ATF. Several catalogs were issued during this time period. <br> <br>In looking through the Bidwell book on the acquisitions of ATF I would guess, based on a showing of very similar initials from Cleveland that these are actually called the Euclid Series. But without the face in front of me I can't be sure. <br> <br>Gerald</p>
    html_clean: <p>Hrant <br> <br>The specimen Mark showed are indeed the Koster Initials as orginally designed by William J Jackson for MacKellar Smiths &amp; Jordan. Patent design 1888. <br> <br>This means that the initials you are asking about, with the Cleveland pinmark, are misidentified. <br> <br>Cleveland Type Foundry went from 1875 to 1892 when they were absorbed by ATF. Several catalogs were issued during this time period. <br> <br>In looking through the Bidwell book on the acquisitions of ATF I would guess, based on a showing of very similar initials from Cleveland that these are actually called the Euclid Series. But without the face in front of me I can't be sure. <br> <br>Gerald</p>
