    html: "<p>Mark, interesting. \"Your\" Koster seems to be a tamed (yes!) version of \"mine\": <br> <br><a href=\"https://web.archive.org/web/20141113205919/http://www.themicrofoundry.com/other/koster_b.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/koster_b.gif</a> <br> <br>It's 72 point, and you can see the bottom 12 point span has been mortised to allow another 60 point font to start setting nestled! <br> <br>BTW, I wouldn't call it Victorian, more Art Nouveau. Although it's a mix of rigidity and organicity (is that a word?), so it doesn't fit very well in any category I know. <br> <br>hhp <br></p>"
    html_clean: "<p>Mark, interesting. \"Your\" Koster seems to be a tamed (yes!) version of \"mine\": <br> <br><a href=\"https://web.archive.org/web/20141113205919/http://www.themicrofoundry.com/other/koster_b.gif\" target=\"_blank\" class=\"link-external\">http://www.themicrofoundry.com/other/koster_b.gif</a> <br> <br>It's 72 point, and you can see the bottom 12 point span has been mortised to allow another 60 point font to start setting nestled! <br> <br>BTW, I wouldn't call it Victorian, more Art Nouveau. Although it's a mix of rigidity and organicity (is that a word?), so it doesn't fit very well in any category I know. <br> <br>hhp <br></p>"
