    html: <p>So Gerald showed me this book of "lost" American metal faces (I forgot the title, but it was edited by Alexander Lawson, and published in 1981) and Marks' Koster was in there, as was... a face called Euclid (like Gerald said) by the Cleveland foundry which matches the font in question! It actually has a full alphabet with lc, and the stuff I've seen is the swash caps. <br> <br>However, I'm still looking for info on this font (so Euclid, not Koster) like <br>who made it, was there an earlier version, etc. Thanks for any leads! <br> <br>hhp <br></p>
