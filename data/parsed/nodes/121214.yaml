      <p>Corporate enterprise licenses, depending on ultimate use, generally go for somewhere between $9000 and $20,000 per font or more. Questions to ask: Desktop only? Web fonts" Applications? Commercial embedding? The more answers yes to these questions the higher the license fee. </p>
      <p>Good luck noob.</p>
