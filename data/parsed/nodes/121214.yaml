    <p>Hi all,</p>
    <p>I'm a font making noob, if you will, and I've designed a font which I sell on my website for only $10 (personal or commercial use). A very large corporation has contacted me with interest in licensing the font from me. I sell primarily to individual users so I'm at a loss for how to structure the pricing. </p>
    <p>My EULA specifies that there must be a separate license purchased for each individual user but that wouldn't work for such a large company. They said they own several fonts from larger foundries and they license it to them for a flat fee based on their usage.</p>
    <p>I know it's a personal decision but I don't want to grossly over or undercharge. Is there an average industry standard or at least a ballpark that is fair? Thanks in advance for any insight.</p>
