      <p><em>Given how often Trajan is used and how few good alternates (let alone alternates with a bit more character)</em></p>
      <p>Meow-miow! Trajan is a major cliché. The Trajan inscription may be the finest example of Roman inscriptional capitals, but it is far from representative of the vast bulk of carved lettering left behind by the Romans. It's stereotypical only.</p>
      <p>I've seen some recent TV documentaries with pictures of incriptional capitals left by the Romans in Northern Africa, and the forms are quite different to the Trajan things. The Northern African inscriptions are remarkably close to Bodoni/Didone capitals, but with angled stressing instead of Bodoni's vertical stressing. I'm not kidding. Fat strokes and stems with hairline serifs. The hairline serifs aren't hairline as we know it, but somehow they managed to carve quite thin lines in stone. 'mazing.</p>
      <p><em>Perhaps some of that fancy Roman Numeral opentype coding that is oft rumored?</em></p>
      <p>Yes, do it dude. Roman numerals are a bitch for maths, but they're fun to contemplate. A real blast from the past. I'm impressed by your grasp of ancient history Dan.</p>
      <p><em>So here’s a question, do you think if I fixed it up nice and pretty I could sell it? Or, is it just the kind of thing that I should just mark up to “practice” and give it away?</em></p>
      <p>Check with the creators / owners of the original typeface first. They're the best people to ask. Certainly you can chalk this one up to practice, but don't give it away for zero cash outlay without first ascertaining if the people who matter have any objections. Play it safe.</p>
      <p>j a m e s</p>
