    html: |-
      <p>Mr Schwartz drew my attention to this thread. </p>
      <p>The original lettering for the ‘Closer’ album was taken from ‘The Development of Writing’ by Hans Eduard Meier, which I believe was first published in the late 1950s and then in the late 1960s. The later reissue no longer shows this piece of lettering, though you can find it here <a href="http://www.textism.com/writing/?id=6" title="http://www.textism.com/writing/?id=6">http://www.textism.com/writing/?id=6</a>. Its a very nice piece of work, even though the letter J is a little unconvincing. Perhaps its unfamiliarity makes it more appealing than the ubiquitous Trajan</p>
      <p>Saville then made PMTs of the lettering and then composed all of the lines. The use of Roman numerals on ‘Closer’ is a give away that Saville could not draw letters (or numerals). In the 1990s Tobias Frere Jones was interested in making a digital revival, but nothing came of it I understand. A digital version was made I believe for the reissues.</p>
      <p>I hope this clears up the confusion.</p>
