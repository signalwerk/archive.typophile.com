      <p>@James: Basically, the Closer lettering is lettering, not a typeface.<br>
      Thus, it would be nice to notify the lettering designer if DanGayle decides to commercialize his digital typeface, but in strict sense, here we have someone turning lettering into a digital typeface, which is quite different from copying a contemporary, pre-existing typeface.</p>
