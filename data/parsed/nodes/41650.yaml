      <p>@Jens Kutilek: <em>Anyway, typeface designs are not protected by copyright in most countries. And most surely not if they are just an accurate rendition of something conceived 2000 years ago.</em></p>
      <p>Dude, it's a matter of ethical conduct and moral obligation to respect the design work of others, especially your contemporaries. Just because typeface designs are not protected by copyright in most countries does not make distributing a copy of an existing type design right. Dan has copied the work of contemporary designers who <strong>based</strong> their typeface on Roman letters from 200 years ago. The Joy Divison Closer type is <strong>not</strong> an accurate rendition of something conceived 2000 years ago.</p>
      <p>You really, really piss me off man (Jens). Don't come here and tell falsehoods or misconstrue the letter of the law. I will drive you away. You need lessons in ethics. You need to wake up to yourself and your misanthropy.</p>
      <p>Why is it so often Germans who harp on technicalities? Because they're a technically-minded people. That's not a racist comment or a personal attack. It's an accurate observation with no overtones or negative implication. All you get me on this one is the straight dope.</p>
      <p>j a m e s</p>
