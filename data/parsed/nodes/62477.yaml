      <p>Florentine goes back farther than that. The Phil's Photo "Homage to the Alphabet" book from 1985 shows Florentine as a film type. Looking further, it also shows up in Mac McGrew's book on "American Metal Typefaces of the 20th Century" as an ATF typeface from the late 1890's called Florentine Oldstyle.</p>
      <p>- Mike Yanega</p>
