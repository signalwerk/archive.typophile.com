    html: |-
      <p>Years ago I read that comparison studies had been done that compared reading speed and comprehension, but I don't have links to them.</p>
      <p>I think most graphic designers believe that sentences set in all caps are harder to read. It's not significant if you're just dealing with a few words (like a headline), but a paragraph in all caps is harder to read. </p>
      <p>In fact a trick that designers occasionally do is that if you've got some text that must be included but your client DOESN'T want people to actually read it  -- like some bad news in an annual report -- you put it in justified block paragraphs in all caps.  You'd think that all caps would draw more attention to it, but lots of folks will give up reading after the first few sentences of all caps.</p>
