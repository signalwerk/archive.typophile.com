      <p>I just re-read 'A prayer for Owen Meany' by John Irwing. Unfortunately my paperback was set in Melior, and that meant that italics were very hard to distinguish from roman text.</p>
      <p>But my point is that Owens' part is written in UPPERCASE, because of his unusual voice. And in my personal opinion, READING UPPER CASE JUST TOOK ME LONGER than lower case with the rest of the book. And that was the point for using UPPER CASE.</p>
      <p>Upper case is made for headlines, and lower case is for reading. I believe history has shown it.</p>
      <p>But you can always do a Litmus test: set any text with upper and lower case and pick your favourite.</p>
