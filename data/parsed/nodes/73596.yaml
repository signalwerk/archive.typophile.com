      <p>We can agree that lowercase is easier to read than all caps. The question is why. Two basic themes: A) Our optical neural wiring processes lowercase better (in the same way that our optical wiring is more sensitive to motion than color) or B) we read more lowercase and we're acclimated to it. That's not an issue of cognitive physiology / psychology, just an issue of habit.</p>
      <p>@Christopher Dean</p>
      <p>I am writing about the legibility of lowercase vs. all caps and one of my editors asked whether "word shape" was an accepted cognitive science theory, and pointed to this</p>
      <p><a href="http://www.microsoft.com/typography/ctfonts/WordRecognition.aspx" title="http://www.microsoft.com/typography/ctfonts/WordRecognition.aspx">http://www.microsoft.com/typography/ctfonts/WordRecognition.aspx</a></p>
      <p>I understand that the only thing two cognitive psychologists are going to agree on is what the third one is doing wrong. But I was curious as to the currency of the theory.</p>
