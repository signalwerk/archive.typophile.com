      <p><cite>These days, how accepted is this theory?</cite></p>
      <p>Very.</p>
      <p><cite>Has there been recent empirical cognitive research that tends to support it or refute it?</cite></p>
      <p>People who can barely read never seem to have much trouble with the tiny, tightly-spaced, all-caps text in comic books, which suggests to me that all-caps is quite easy to read. Design pundits make a big deal about the differences in legibility and readability of lowercase and all-caps settings, but the differences are measured in fractions of a second. So if you aren’t typesetting long copy, highway signage, or wayfinding systems then the difference is probably irrelevant. Of course one still needs to consider that many typefaces and a great deal of content will look like crap in all caps no matter how well one typesets it.</p>
