      <p>@Dunwich Type</p>
      <p><em>People who can barely read never seem to have much trouble with the tiny, tightly-spaced, all-caps text in comic books, which suggests to me that all-caps is quite easy to read.</em></p>
      <p>I suspect it has more to do with conserving space within speech balloons: with the exception of Q, uppercase letters have no descenders, so you can pack a lot more dialogue into a smaller space with all caps. Plus, this approach eliminates having to make decisions about which words should be capitalized, and which need not. And, finally, there's no equivocation about whether or mot a single vertical stroke represents an L or an I...</p>
