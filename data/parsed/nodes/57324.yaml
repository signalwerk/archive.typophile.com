      <p>It seems very similar to some of Luc(as) de Groot’s work, such as <a class="freelinking-external" href="http://new.myfonts.com/fonts/lucasfonts/lf-corpid-iii/">Corpid</a>. It looks slightly more condensed than Corpid, and the stem on the ’u’ seems bent, but I think the b is a de Groot shape.</p>
      <p>- Mike Yanega</p>
