    html: <p>I'm thinking about doing something a bit like this Didot <em>v</em> in my Brill Italic typeface. The style is derived -- more directly than most types -- from 18th century formal cursive writing, but I'm forced to make a pointed rather than a rounded <em>v</em> because the rounded form is a separate letter in IPA and some orthographies. My default <em>v</em> is quite similar to the Didot initial form, which of course causes spacing or collision problems when following some other letters. I probably won't use the variant form after every letter, though, only after those in which problems occur.</p>
