    <p>This is from an essay by Firmin Didot published in 1783 and set in his Cicero italic (12 point) - a text where, supposedly, Firmin shows his mother the peculiarities of the typeface. There's an interesting treatment of the lowercase v - when paired with a, like in the word "avez", it gets a different shape. Like this:</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/didot_italic01_5394.jpg"></div><p></p>
    <p>The v in "vous" is the standard shape; the one in "avez" is the contextual glyph, narrower and without the left top tail. The reason seems to be having an homogeneous kerning. I wonder if other typographers ever applied such a trick. Below is attached the full page from the Italic essay.</p>
