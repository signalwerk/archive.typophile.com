    html: |-
      <p>When I was talking to the late Kay Amert, she said that I should look at the italics of Simon de Colines because they were full of contextual and alternative glyphs.  I have yet to do this but I expect that she is right about this. However I will be looking at them quite soon to see if they bear on my work.</p>
      <p>In the meantime here are my contextual v shapes from my not yet released Reading MATD type - Arrotino.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/v_4203.gif"></div><p></p>
      <p>The blue portion at the serifs is the portion contextually removed. The middle one has a bit of both sides removed because it has two diagonal neighbors and the ones on the left and right just the the side next to a diagonal letter. All the diagonals in Arrotino roman have this behaviour when set against a fellow diagonal (y, v, w and x). The idea is to be able to present the letter optimally in all contexts. The example shown is unlikely to be a final solution for this letter as it was put together fairly quickly - more in order to test the code to control it than as a matter of highly deliberate letter design. Still, could a little thing like that make a difference? I think it can - yes.</p>
