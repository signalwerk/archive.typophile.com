    html: <p>There are no reasons to make web fonts that fit the pixel grid perfectly. But to make things that are aware of the pixel grid makes a great deal of sense. This does not need to result in boring or repetitive fonts. Take a very close look at what FF and Font Bureau have done recently. Compare this to verdana and Georgia and the C* fonts like Cambria and Corbel.</p>
