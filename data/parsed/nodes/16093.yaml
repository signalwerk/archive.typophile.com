      <p>John Sans was designed to go with John Baskerville. It is an attempt at a sans serif version of JB.</p>
      <p>Although I have not used either of those faces, from what I can tell from some samples, they'd both look very good together. Given the fact that Storm designed them *and* meant to have them used together, I'd bet my Requiem that you wouldn't go wrong with that pairing.</p>
      <p>You could even ask Storm directly for some .pdf samples or something to show the pair in use.</p>
