      <p>I know that Storm designed them to be complementary, and I generally have a high opinion of his work (I've spent a small fortune on Storm type this year), I just wanted to see if anyone had hands-on experience using the two together.</p>
      <p>Hrant: I honestly don't have a gut sense of whether you're right or not about Baskerville's being most itself at Great Primer sizes. I have come to see "Baskerville the typeface" as being linked with "Baskerville the element in John Baskerville's notion of the well-printed book", and I've seen some books printed in 2-column long primer Baskerville according to Baskerville's methods that look gorgeous. The project I have in mind is most likely going to be tightly spaced, tightly leaded, and multi-column, and in that context I think 8-point or 9-point text makes the most sense. John Baskerville Text seems like it would work well at that size, but until I pony up for it I won't know for sure.</p>
      <p>Thanks for your input, folks.</p>
