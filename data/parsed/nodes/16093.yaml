    <p>I'm about to start a new project which I've decided would look best in Baskerville, which got sort of stuck in my head after reading Ari Rafaeli's <cite>Book Typography</cite>. I'm going for kind of a retrofuturistic look, and I intend to be using semi-narrow columns, long stretches of text and the brutally tight word spacing that Rafaeli prefers, just to see how everything works out. I've really been digging Storm's typefaces all year (although I'm still trying to wrap my head around his and <a href="/wiki/Jan%20Solpera" class="freelinking" rel="nofollow">Jan Solpera</a>'s new Areplos), and the book weights of Storm's John Baskerville are the only digital versions of any Baskerville that seem to be right for extended text.</p>
    <p>Anyway, I was wondering if any of you have ever done any larger projects using John Baskerville with John Sans as a complementary sans face, and if so, what you thought of the results. It seems to me like the faces could go together well, or they could be just similar enough to clash violently on the page. Also, does anyone have any thoughts, pro and con, on the letter spacing in either typeface? Does it need any adjustment to work well?</p>
    <p>Thanks for your thoughts!</p>
