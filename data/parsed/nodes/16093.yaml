    html: <p>I would call Storm's typefaces "characteristic" rather than "funky". I've spent a lot of time studying his various Czech digitizations (Solpera, Metron, Juvenis, Preissig -- although it's hard to see much of anyone other than Preissig in Preissig) and Farao, so I've become sensitized to the quirks he puts in his fonts. There's a lot of 18th century English wood types in his faces -- just look at the foots on his 'b's or the taper of the arches over a lot of his counters -- but I think he does a good job of modulating them on his body faces. There's just a hint of the goofiness of Farao in John Baskerville, the former of which is just taking the characteristics of other Clarendons to their logical extreme. I dunno, I don't think his faces are excessively weird. His fonts aren't as characterless as, say, Porchez's or Hoefler's, but they're not wildly extravagant either.</p>
