      <p>"I don’t think that the problem is the PDF format. The problem is that Acrobat Professional is one of the worst-designed pieces of publishing software on the market."</p>
      <p>I tend to not discern between the two. ;0)</p>
      <p>To be fair, PDF as a rather static 'end of life' format for paper document archiving is fine. But the whole concept of 'interactive PDF' just seems both dated and pointless in this day and age. Combine that with the atrocity that is the Acrobat UI and it's just scary.</p>
      <p>*If* a custom front end were to be used (anything other than Acrobat...perhaps a web interface) then maybe. Otherwise, let them use software they know/understand, and have that save off the PDFs.</p>
