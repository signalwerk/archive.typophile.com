      <p>When you first create a text field in Acrobat, you can only assign one font to the entire field. You can, however, set up the field to allow detailed editing of the field after it's been created:</p>
      <p>1. When you create or edit the text field in Acrobat and have the Text Field Properties dialog open, click the Options tab. Check the Allow Rich Text Formatting box.</p>
      <p>2. Now, when you're in either Acrobat or Reader, do one of two things:</p>
      <p>A. Type some text in the field and then, on the keyboard, press CTRL+e. You'll get a floating Form Field Text Properties toolbar. (Actually, you can press CTRL+e at any time, but the toolbar will be greyed out unless the cursor is in a text field with the Rich Text Formatting permission applied to it.) Select the text you want to modify and click the appropriate button on the toolbar (font, font color, point size, alignment, bold, italic, underline, strikeout, superscript, subscript). If you click More... and then Font, you get some of the same options, but if you click on Paragraph, you can adjust paragraph alignment, indents, and spacing (leading).</p>
      <p>B. To modify a blank field, simply put your cursor anywhere in the field and press CTRL+e. You get the same floating Form Field Text Properties toolbar.</p>
      <p>3. When selecting text in a field, you can select just the characters or words you want to modify.</p>
