    <p>Good afternoon, my name is Teunis and this is my first post.</p>
    <p>I have been asked to submit an "interactive" PDF to a client. Basically, the client will personalize each PDF for a specific customer. The tests that I have run so far have not faired well. When using the advanced text tools and editing the copy this way the text is not wrapping properly and in the end the PDF looks terrible.</p>
    <p>I am wondering if there is a specific way to build my Quark file and/or export my .ps file so that this copy can be personalized and as editable as possible? Do I need to exempt this text box from the Quark file and build it directly in Acrobat Professional?</p>
    <p>Thank you for your time and help. It is grealty appreciated.</p>
    <p>_teunis</p>
