      <p>lizmay</p>
      <p>You are asking about links from the 1920s and 1930s to now but then you introduce Tschichold as enfant terrible. Are you just interested in European Modernism and not the Anglo-American Typographic Revival? Tschichold is linked with both.</p>
      <p>In some very realistic terms, economic and political upturn/turmoil have far more to do with type production from this period than with any specific individual or movement. This can be verified by foundry output.</p>
      <p>If we have inherited anything from this period, and we have, it is the basic compositional standards reiterated by any and every typography primer. This is Tschichold's contribution, and his alone. And it is a significant one.</p>
      <p>Gerald</p>
      <p>The Bieler Press<br>
      <a href="http://BielerPress.blogspot.com" title="http://BielerPress.blogspot.com">http://BielerPress.blogspot.com</a></p>
