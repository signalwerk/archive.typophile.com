      <p>"New Typography" has never been popular, not then, not now, not once.</p>
      <p>It is an obscure part of design culture practised by few.<br>
      Subsequently, and to this day, the common practice continues to be either symmetry or sloppy, unstructured typographic layout which people think looks up to date, but lacks the pure principle. Just filling up space, not dynamically organizing it.<br>
      There's more to it than rag right setting.<br>
      Sure, there is an elaborate design history which records modernist typography, and it has a small niche in design publications -- our own little metaculture -- but it is rare in the mainstream of graphic design: magazines, newspapers, advertisements, posters, catalogs, flyers, etc.</p>
