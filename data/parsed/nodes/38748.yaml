      <p>&gt; <cite>The New Typography is ... still adhered to in a lot of contemporary design.</cite></p>
      <p>Maybe where you come from, Mr. Vanderveen...yes. And maybe you, too, Ms. Lizmay...in my limited European experiences I've always been impressed with the much higher regard for art than what we have here in the United States of Wal-Mart. The worst part about coming back to the states is the overall cultural ignorance and lack of respect for art in general. But then, I don't live in a very culturally advanced part of the country.</p>
      <p>Nevermind that... Tschichold = well ordered information and less ornamentation. I very rarely see that practiced. I can think of one corporation off the top of my head...Apple. That's about it. Okay, maybe a few magazines...The Economist, sort of...though I think they could push it a little further...hey, that's a Euro-based pub! Imagine that. Surely there are more. As stated, I'm a little out of touch. My neighbors are Amish farmers (and I love 'em).</p>
