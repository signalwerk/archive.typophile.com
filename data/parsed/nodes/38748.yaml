    <p>Hi!</p>
    <p>I'm currently working on a project to investigate 1920s and 1930s typography. Part of the brief is to explore the links between then and now. </p>
    <p>I was reading a post about Tschichold's 'The New Typography' from August (<a href="http://www.typophile.com/node/36098" title="http://www.typophile.com/node/36098">http://www.typophile.com/node/36098</a>) which gave me a few ideas, as (from my understanding anyway) people seemed to be suggesting that whereas a lot of what Tschichold wrote about isn't all that radical now and a lot of it is just common practice, when you consider it in its historical context it was revolutionary. So this would seem to me to be a link - that is that Tschichold's ideas in the 1920s have now become common in contemporary typography. I should point out that I haven't read The New Typography yet, but I have a basic idea of what it's about from researching. I'll be getting it in the library tomorrow!</p>
    <p>I was just wondering if anyone had any thoughts on this or any other links?</p>
    <p>Thanks :)</p>
    <p>PS I'm new here, great site, happened to come across it when researching.</p>
