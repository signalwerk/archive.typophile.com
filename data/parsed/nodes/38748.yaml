      <p>I'm admittedly not completely hip to what's going on in the world of typography, but my general impression (which would be much the same as the average joe's), is that the philosophy laid down by Tschichold in The New Typography is not so much in practice in the 21st century. Lots of design magazines I see celebrate a whole lot of chaos and overphotoshopped schlock. It was my understanding from Tschichold that good graphic design begins with good typograhy, as I'm sure many typophiles would concur. However, what I see today makes me think that Adobe's got everyone bamboozled, believing that good design begins in Photoshop.</p>
      <p>Being in Dublin, you may or may not want to explore American Typography, but if you're talking 1920-1930, I think there's some consensus that ATF's 1923 type specimen book is something of a masterpiece from that era. Both that book and The New Typography embrace elements of simplicity and order...something only the best designers of the 21st century understand (which includes a lot of designers, but most definitely not the majority of designers).</p>
