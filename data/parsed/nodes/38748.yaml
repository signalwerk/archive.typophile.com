      <p>I feel that a lot of what Iwan wrote and practiced in The New Typography is still valid AND still adhered to in a lot of contemporary design. The reason is that one has to take ‘New’ with a few grains of salt — there are a lot of underlying fundamentals in the dynamic and asymmetric design he proposed that have foundations in history.<br>
      People always act kind of perplexed about Tschicholds ‘turnaround’ after WW2, when he ‘went back to traditional symmetric design’, but I think that he didn’t change that much, he just choose to be less dogmatic.<br>
      (OK, that’s simplified —&nbsp;I am not really in the mood to write extensively about this…)</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
