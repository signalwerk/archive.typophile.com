  html: <p><i>First of all, sorry, if this may not be suitable for a public forum, but anyway.:</i> <br> <br>So, Ive signed up for FontShops KeyWording Project, a few weeks ago; Ive keyworded <br>around 51 Fonts, to try the whole keywording system, and then I contacted FontShop <br>( Two times, by now ) to ask for my 'Reward', a single FontFont, free of charge, <br>like they state, wherever they advertise and 'recruit' for their project, and, Nothing.. <br>No response, no reaction, and, certainly, no reward.. <br><i>( Maybe it just takes some time, for them, but no reaction, at all, within the last weeks, <br>is not quite what I expected.. )</i> <br> <br>Anybody else experienced any problems with keywording typefaces for FontShop, <br>and / or 'exchanging' their services for FontFonts.? <br> <br><i>( If any Typophile Admin has a problem with me posting this in here, please feel free to delete / move / remove this thread.. Thanks, and, Hmm, Sorry.. )</i></p>
