      <p>How about Huronia, by Ross Mills? It doesn't get any more "Northwest Indian"</p>
      <p><a href="http://www.tiro.com/fonts.html" title="http://www.tiro.com/fonts.html">http://www.tiro.com/fonts.html</a></p>
      <p>I don't believe all the planned special characters are available, but I see the standard font has been released. If there is a bit of time in the schedule, you could get up with Ross about any few special characters needed.</p>
