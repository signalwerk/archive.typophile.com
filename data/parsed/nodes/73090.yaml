    html: |-
      <p>There are some typefaces based on Maori art that are in that realm. </p>
      <p><a href="http://new.myfonts.com/fonts/churchward/maori/" title="http://new.myfonts.com/fonts/churchward/maori/">http://new.myfonts.com/fonts/churchward/maori/</a></p>
      <p>Alas, the Maori are on the opposite side of the world, so that would be culturally misleading if it's meant to mimic the PAC NW.</p>
      <p>Perhaps this is a reason to work on a new face.</p>
