    <p>Hello<br>
    I'm looking for a font that evokes the traditional visual motifs of Pacific Northwest Indians. (I'm attaching some visual references/examples).</p>
    <p>The closest thing I've been able to find is Malamondo, by Fenotype<br>
    <a href="http://new.myfonts.com/fonts/fenotype/malamondo/" title="http://new.myfonts.com/fonts/fenotype/malamondo/">http://new.myfonts.com/fonts/fenotype/malamondo/</a><br>
    I do really like this font, but it seems a little too 1950s Beatnik-ish for this purpose.</p>
    <p>Thanks for any suggestions you have!</p>
    <p>-Rob</p><div class="imageWrap"><img src="http://typophile.com/files/beavertattoo_small_5526.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/na_pnw_raven_art_5097.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/223_6365.jpg"></div><p></p>
