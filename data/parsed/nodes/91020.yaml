    html: |-
      <p>John, Amble was designed by <a href="/wiki/Punchcut" class="freelinking" rel="nofollow">Punchcut</a>. In 2010 Sun licensed it for inclusion in the JavaFX SDK for mobile handsets. Thanks for pointing out the FontSquirrel link. Any similarity to <a href="/wiki/Droid" class="freelinking" rel="nofollow">Droid</a> stems from a similar creative brief over at <a href="/wiki/Ascender%20Corp" class="freelinking" rel="nofollow">Ascender Corp</a>.</p>
      <p>We use a web optimized version of Amble on <a href="http://www.punchcut.com" rel="nofollow">our site</a> as well, but it's not available in the SDK.</p>
