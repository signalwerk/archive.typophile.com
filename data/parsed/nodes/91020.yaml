  html: |-
    <p>I was surprised to see that Punchcut has a typeface available through Font Squirrel: <a class="freelinking external" href="http://www.fontsquirrel.com/fonts/amble" rel="nofollow">Amble</a>.</p>
    <p>I say surprised because I had not seen any discussion of it here at Typophile, which – as they say – is a Punchcut gig.</p>
    <p>Amble looks similar to <a class="freelinking external" href="http://www.ascenderfonts.com/font/droid-sans-pro-mono.aspx" rel="nofollow">Droid</a>, doesn't it?</p>
    <p>I'm curious: has anyone seen a release notice for Amble or a critique of the typeface?</p>
