    <p>Just released: New Cuisine.<br>
    From MyFonts description:<br>
    New Cuisine is a departure from formal, handwriting, and retro scripts. Influenced by the DIY lettering generation New Cuisine is a joyful looking script with all the right moves. It’s bold graphic presence makes it ideal for packaging, online journals and blogs, signage, logos, and menus.<br>
    Under the hood of New Cuisine lie precise connections, unique ligatures and alternates, and OpenType programming to orchestrate it all. Because of this, typesetting turns into a simple and playful experience. Also included are a simple fraction feature as well as Central European language support.<br>
    <a href="http://www.myfonts.com/fonts/stephen-rapp/new-cuisine/" title="http://www.myfonts.com/fonts/stephen-rapp/new-cuisine/">http://www.myfonts.com/fonts/stephen-rapp/new-cuisine/</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/NewCuisine_3_3690.png"></div><p></p>
