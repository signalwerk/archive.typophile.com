    <p>Hello All:</p>
    <p>Custom type is irksome to the person (like myself) that wants access to it all. But don’t we love the results. </p>
    <p>Here is a refined Century Italic to enjoy:</p>
    <p></p><div class="imageWrap"><img src="/web/20080905085635im_/http://www.typophile.com/files/Unknown_5109.png"></div><p></p>
    <p>I also like the slabs they have added to the romans. Hmm... moderns and slabs mixed together—has this even been done before?</p>
    <p></p><div class="imageWrap"><img src="/web/20080905085635im_/http://www.typophile.com/files/Picture1_6689.png"></div><p></p>
    <p>Don’t get me started on the IKEA Futura too. Love that too.</p>
    <p>Mikey :-)</p>
