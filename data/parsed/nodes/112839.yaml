    html: |-
      <p>It must be <strong>DSBroadBrush</strong> by Dubina Nikolay [D-Studio, 1999]<br>
      More on D-Studio fonts:<br>
      <a href="http://luc.devroye.org/fonts-26598.html" title="http://luc.devroye.org/fonts-26598.html">http://luc.devroye.org/fonts-26598.html</a></p>
      <p>There is also a font which matches (at least ) the latin subset which is named <strong>ft18</strong> by FT Content Provider.<br>
      More on FT Content Provider:<br>
      <a href="http://luc.devroye.org/fonts-42785.html" title="http://luc.devroye.org/fonts-42785.html">http://luc.devroye.org/fonts-42785.html</a></p>
      <p>Chances are that <strong>DSBroadBrush</strong> is the original and <strong>ft18</strong> is a non legitimate clone, so please take care on using/licensing.</p>
