    <p>Hi,</p>
    <p>I am little curious about font name string:</p>
    <p>1. Is it possible to show font name in local string(e.g. Arabic) in font menu?</p>
    <p>2. Some fonts names in font menu in MS. Word has attached local string (ابجد ھوز) and some not. Examples are Arabic Transparent and Arial respectively? How can I attach this local string to my font?</p>
    <p>3. Is it possible to customize this local string (ابجد ھوز)?</p>
    <p>Best regards,<br>
    Atif</p>
