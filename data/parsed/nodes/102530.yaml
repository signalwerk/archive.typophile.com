    html: <p>Agree with Renko. Looks like they started from Helvetica Neue Bold and customized /a to make a single storey /a (original /a spur looks to have been kept, better look <a class="freelinking external" href="http://www.camdenartscentre.org/assets/layout/logo.png" rel="nofollow">here</a>). A better way would probably be to switch for <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/helvetica/helveticatextbook-bold" rel="nofollow">Helvetica Textbook Bold</a> to get such a single storey /a.</p>
