    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : James Craig</strong></p>
    <p>James Craig is the author of a number of books on graphic design and typography. Among the better known titles are <a href="/wiki/Designing%20with%20Type" class="freelinking" rel="nofollow">Designing with Type: A Basic Course in Typography</a>, <a href="/wiki/Production%20for%20the%20Graphic%20Designer" class="freelinking" rel="nofollow">Production for the Graphic Designer</a>, <a href="/wiki/Thirty%20Centuries%20of%20Graphic%20Design" class="freelinking" rel="nofollow">Thirty Centuries of Graphic Design</a>, and <a href="/wiki/Graphic%20Design%20Career%20Guide" class="freelinking" rel="nofollow">Graphic Design Career Guide</a>.</p>
    <p>He teaches typography at the <a href="/wiki/Cooper%20Union%20School%20of%20Art" class="freelinking" rel="nofollow">Cooper Union School of Art</a>.</p>
