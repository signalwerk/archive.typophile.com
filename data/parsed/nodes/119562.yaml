    html: |-
      <p>I am not sure about what you mean by balance but there are script which give useful data and comparison as Yanone Autopsy for Fontlab <a href="https://github.com/davelab6/autopsy" rel="nofollow"> https://github.com/davelab6/autopsy</a> and Glyphs <a href="https://github.com/schriftgestalt/Autopsy-Plugin" rel="nofollow">https://github.com/schriftgestalt/Autopsy-Plugin</a> or Font Inspector for FontLab and Robofont <a href="http://urtd.net/projects/fontinspector/" rel="nofollow">http://urtd.net/projects/fontinspector/</a>.<br>
      The same Yanone as also a useful tools to check visually the balance of beziers curves. It’s SpeedPunk for Robofont and Glyphs <a href="http://www.yanone.de/typedesign/code/speedpunk/" rel="nofollow">http://www.yanone.de/typedesign/code/speedpunk/</a>.<br>
      I hope this is useful for you.</p>
