    <p>im Indonesian.Im not rich and im not poor (im ordinary).</p>
    <p>I love typography a lot. I want to learn typography much more. I want to go to university and there is no specific typography university in Indonesia even in Asia. But, it seems so hard to find the proper university that provide scholarship. I prefer to go to Netherlands, Germany, France, Italy, USA, Aus, and Other countries (except England and Japan -- coz the currency with IDR is extremely yaa.. you know) </p>
    <p>I want your suggestion please... and please keep sharing if your are the one who studies in typography institute. All about typography institute in that mentioned countries.</p>
    <p>Additional: What is the best Typography institute?</p>
    <p>Thanks.<br>
    regard<br>
    Gunarta :)</p>
