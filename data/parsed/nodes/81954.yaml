      <p>eliason’s link is a good place to start. </p>
      <p>I don’t know a lot about typeface design programs. I focus on how typography influences human performance such as reading comprehension. Before you decide where you want to spend your time and money, you really need to focus on your area of interest. Letterforms, history, technology, human performance… Who would you like to employ you, and for what, when you are complete?</p>
      <p>Answer these questions and your choice will present itself.</p>
