      <p>@Gunarta: If you are interested in starting a school, then you will require many skills. Sadly, the top of the list will most likely be business, management, and administration. Next, you will require knowledge of pedagogy (in an educational context). Rhetoric and semiotics can’t hurt either. THEN, you can start focusing on subject matter. </p>
      <p>You need to ask yourself what do you want your school to teach? And you can’t answer “typography.” That’s about as broad as saying “art” which could mean:</p>
      <p>painting<br>
      drawing<br>
      film<br>
      photography<br>
      sculpture<br>
      wood working<br>
      metal working<br>
      foundry<br>
      jewelry<br>
      holloware<br>
      textiles<br>
      fashion<br>
      sculpture<br>
      pottery<br>
      stone working<br>
      print making<br>
      screen printing<br>
      interactive media<br>
      performance<br>
      installation<br>
      interpretive dance<br>
      history…</p>
      <p>Start small. </p>
      <p><strong>If you were to teach just <em>one</em> course at someone else’s school, what would it be</strong>?</p>
