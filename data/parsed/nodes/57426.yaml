    html: |-
      <p>I’m pretty sure in most style guides used in the English speaking world it would go like this:</p>
      <p>Name of play: italic or underline<br>
      Role in play: initial-cap or (maybe) small-caps<br>
      Name of group: title-cap or italic<br>
      Name of program: title-cap or italic<br>
      Citations: quotation marks<br>
      Irony: quotation marks<br>
      Foreign language: italic</p>
      <p>The Compañía Comarcal de Danza demonstrated its <em>chef d’œuvre</em> in 1978 when the <em>Endless Performance</em>, an annual show consisting of <em>The Nutcracker</em> and <em>The Swan Princess</em> followed by an immense flamenco show, according to dance historian Juan Doj, “brought the house down, both literally and figuratively.”  The Princess was interpreted by Ivana Humpalot, and the Evil Rat King was portrayed by the “graceful” Sancho Panza.</p>
