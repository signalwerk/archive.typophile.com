  html: |-
    <p>Hello,<br>
    I am designing the book about a theater.<br>
    The text I am given contains a huge number of quotation marks: </p>
    <p>– names of plays<br>
    – role in the play<br>
    – names of artistic groups<br>
    – names of programs<br>
    – citations<br>
    – «ironic» meanings or metaphors,<br>
    – foreign language words </p>
    <p>I am trying to make all this emphases less obtrusive by changing all names of theater plays and foreign language words to Italic.<br>
    How legitimate this approach is? </p>
    <p>thank you!</p>
