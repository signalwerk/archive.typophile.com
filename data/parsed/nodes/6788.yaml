    date_raw: 28.Sep.2004 2.20pm
    votes: null
    html: <p>I would definitely look at Meta. I know it is over-used. But for the sort of thing you are talking about (lots of information at small sizes) it really does shine, and it's got plenty of weights, different kind of figures and so on. It's not as if you are going to be using it for masses of text, or for "corporate identity" purposes or anything. I use it a lot for purposes like yours, and have had positive typographic feedback from colleagues who don't normally notice fonts at all, of the "What is that nice font" sort. That might be a bad sign, of course, but at least they don't think its Arial. <br> <br>I haven't ever paired it with Charter, but i don't see why it shouldn't work pretty well, and it might be better than Franklin (which is hardly an under-used type itself).</p>
