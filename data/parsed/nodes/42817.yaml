    <p>I’m attempting to track down this geometric monoline display face (or something similar). Given it’s simplicity, I have a hunch that it’s a custom job built from outlines. It’s currently being used by for product branding by Zoom, a Japanese music accessory manufacturer.</p>
    <p><a href="https://web.archive.org/web/20080905020035/http://www.zoom.co.jp/english/" title="http://www.zoom.co.jp/english/">http://www.zoom.co.jp/english/</a></p>
    <p></p><div class="imageWrap"><img src="/web/20080905020035im_/http://www.typophile.com/files/Untitled-2_5550.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="/web/20080905020035im_/http://www.typophile.com/files/2310273735_9f4b225591_4004.jpg"></div><p></p>
    <p>Any help would be appreciated.</p>
    <p>g.</p>
