    <p>A new version of DTL OTMaster (OTM), the highly sophisticated tool for reviewing, editing, and altering tables and glyphs of fonts with a SFNT-ﬁle structure, has become available since today. OTM is a must-have for professional font developers. To quote Adam Twardoch, product and marketing manager at Fontlab Ltd.: ‘<em>OTMaster works with surgical precision: it will only modify the portions of the font that the developer wishes, leaving all other structures unchanged. This makes OTMaster a great companion to any font editor and an indespensable element even in the most complex OpenType font production workﬂow.</em>’</p>
    <p><img src="/sites/default/files/old-images/OTM_5_illu_1_5180.jpg"></p>
    <p>Version 5.0 contains a range of additional functionality, among which:</p>
    <p>— New powerful <em>Text Viewer</em>, which includes Harfbuzz for the interpretation of OpenType Layout features. It contains a nice three-state features selector (on / default / off).<br>
    — Support for all the competing color OpenType font extensions: Microsoft’s ‘COLR’/‘CPAL’, Adobe’s ‘SVG’, Apple’s ‘sbix’, and Google’s ‘CBDT’/‘CBLC’.<br>
    — Updated <em>Font Viewer</em>, containing now a search ﬁeld for glyphs, unicodes...<br>
    — Updated <em>Side by Side Viewer</em>, which contains among other new options, a ‘Winding ﬁll’ as opposed to the standard ﬁll option.<br>
    — Enhanced and now fully mature <em>Glyph Editor</em> (basically a compact version of DTL FontMaster), with improved guideline and grid functionality, improved measurement options, new clipboard with support for multiple entries, etcetera, etcetera.</p>
    <p><img src="/sites/default/files/old-images/OTM_5_illu_2_6342.jpg"></p>
    <p>DTL OTMaster 5.0 is available for Mac OS X, Windows and Linux. Please note that because of the inclusion of Harfbuzz the lowest supported Mac OS X version is Lion (instead of Snow Leopard in case of version 3.7) now.</p>
    <p><img src="/sites/default/files/old-images/OTM_5_illu_3_3571.jpg"></p>
    <p>From today on until the 6th of January 2015, OTM 5.0 can be purchased with a special 25% <em>Christmas-holiday</em> discount. Current 3.7 licensees are eligible for an upgrade against € 7.50 administration and handling costs. FontLab Ltd. customers can do this via FL Ltd.’s <a href="http://www.fontlab.com/content/view/319/191/">website</a> and DTL customers  can apply for this via DTL’s <a href="http://www.fontmaster.nl/Shops/FM_Shop/index1.html">FontTools shop</a>. Registered users owning any other previous versions can upgrade for € 50.</p>
    <p><img src="/sites/default/files/old-images/OTM_5_illu_4_5953.jpg"></p>
    <p>DTL OTMaster can be purchased directly from FontLab Ltd. and DTL’s FontTools shop (web adresses are mentioned above).</p>
