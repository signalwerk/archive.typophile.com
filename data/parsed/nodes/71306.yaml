    html: |-
      <p>More "Caslonish" to me (adding an outline stroke and reworked to make it very contrasted)... Very close to <a class="freelinking external" href="http://typography.com/fonts/font_overview.php?productLineID=100020" rel="nofollow">Requiem (Fine Roman)</a> by Hoefler &amp; Frere Jones.<br>
      Here are also some "similars":<br>
      - <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/monotype/perpetua_titling_roman" rel="nofollow">MT Perpetua Titling</a> by Eric Gill<br>
      - <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/carter_cone/big_caslon_cc" rel="nofollow">Big Caslon</a> by Matthew Carter (Carter &amp; Cone)<br>
      - <a class="freelinking external" href="http://www.dardenstudio.com/typefaces/freight_big" rel="nofollow">Freight Big</a> by Joshua Darden<br>
      - <a class="freelinking external" href="http://typography.com/fonts/font_overview.php?productLineID=100031" rel="nofollow">Chronicle (Display Extra-Light</a> by Hoefler &amp; Frere Jones</p>
