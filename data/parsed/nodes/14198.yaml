    <p>Hello,</p>
    <p>My name is David Bailey, I will be a junior at Drexel University in Philadelphia this fall, majoring in Graphic Design. The reason for this post is regarding a two term co-op experience that I will have this coming fall/winter (approx. Sept. 20th to the middle of March).  Drexel has counselors that will help us find co-ops next quarter but I'm starting my own search to hopefully land an interesting/good co-op job for the begining of the close approaching academic year. Drexel's Graphic Design program focuses mainly on the print side of the buisness (logo design, branding, page layout, poster/ad design, book cover design and product packaging).</p>
    <p>I'm quite in love with my major and the work I do every day in class and for that reason would love to find an opportunity to spend my co-op at a buisness in NYC, a main hub of design these days. My work has been praised and won awards so I'm confident in my abilities, this is why I'm reaching for the best jobs out there. So far I've been in contact with RCA Records but I won't know if I have an interview for another couple weeks, which is cutting it dangerously close. I've attempted contacting a few smaller firms with no response yet. I'm about to just start calling the bigger names in the city (Poulin&amp;Morris, Pentagram, etc.) to either get a yes or no about interns because I don't want to be stuck without a job. I'm quite aware of this being a Typography board but I'm spreading the word however I can. Please respond here if you have any sort of connections or work in the cit or even have your own buisness there! (or shoot me an email through the forums!) Regarding work I've done up to this point in school and on my own you can visit this link: <a href="http://www.dsinelab.net/dave/index.html" title="http://www.dsinelab.net/dave/index.html">http://www.dsinelab.net/dave/index.html</a>  Best regards and thank you for taking time to read this. I'm aware this is only my second post here, but all the people I met at TypeCon were so friendly and I'm sure there are a plethora of designers here that might be able to help!</p>
    <p>Attached are two photos of my latest work to entice some help!</p>
