      <p>David, finding an internship in NYC can be as daunting as finding an empty cab on a rainy day. There are many interns from many local schools that get placed through their schools in the better firms. At Pentagram, for example, we have interns lined up for the next six months and we look for them much in advance and we usually do it through schools – also, interns are by "team" not as a whole, meaning that each partner is responsible for hiring their own interns, it is not an office wide initiative. </p>
      <p>Other firms may be open to getting interns from independent initiatives like yours but it's usually easier when there is backing from a school program.</p>
      <p>In the end, the best thing you can do is to call as many design firms as you can, get them to see you regardless of them having an opening or not (portfolio critiques can be extremely helpful and you will find that they will serve you better than awards or your work being praised). Try going through Workbook's directory, <a href="http://www.workbook.com/phonebook/" title="http://www.workbook.com/phonebook/">http://www.workbook.com/phonebook/</a> it's a great resource for all firms in Manhattan.</p>
      <p>If you don't want to do web design, don't take an internship where you will be asked to do web stuff. You won't enjoy it and your employer will not get the best from you. If you like print, find a print internship, don't settle for anything you are not passionate about.</p>
      <p>And remember that it's very competitive. </p>
      <p>Oh, and yes, you will make lots of copies, mount many presentations and stay late working on making more copies and mounting many more presentations. Don't let that deter you, it's a very formative experience.</p>
