      <p>Pretty much. Those big academic / professional conferences that I've worked at - the American Sociological Association's annual meeting and, one year, MLA - realized, I think, that the goodwill and camaraderie generated by allowing friends / kids / spouses into the meetings and not insisting on some kind of badge at the door was far more valuable than the few bucks lost (I mean really, how many of those people are going to buy a badge anyway?). This happened at MLA, of course, where the registration was close to $700, and at regional Sociological association meetings with about 1000 registrants, where most folks paid about $60 registration, so I don't think price is the thing.</p>
      <p>From what I understood from talking to those kids at the door, it was more Parsons just being very serious about security, and not a SoTA thing anyway. Besides, that's so not the character of the organization, but I could very much see it as being the character of the school.</p>
      <p>Anyway, wayyy off topic. David, how do you feel about working for the dark side (and by that I mean advertising)? I know a coupla people who might be able to help you.</p>
