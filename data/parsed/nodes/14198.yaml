    html: <p>David, you will have more luck after Labor Day. What happens in the business world is the budgets have been spent by Memorial Day (in general) and a lot of decision makers go on vacation during the summer months (kids out of school). A lot of agencies actually give staff members Fridays off during the summer. The approach I think you need to take is, research your potential targets and get an e-mail or something in print that arrives just after the Labor Day weekend. Don't get discourged and don't give up.</p>
