      <p>For what it's worth, email is much better than a phone call. It's much easier for me to follow a link in an email (or look at a PDF in an email) and make an assessment, than to screen someone over the phone and decide whether to have them come in. Unsolicited post cards and small portfolios are also great. The days of the giant book drop off are gone, and for good reason.</p>
