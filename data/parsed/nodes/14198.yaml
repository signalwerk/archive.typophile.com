    html: |-
      <p>Hey guys, I've just (well...a few hours ago) recieved an email from RCA Records and they want to interview me based upon my samples. I'll be heading into the city this week to do that. Wish me luck!</p>
      <p>Armin:</p>
      <p>It's funny cause Drexel stresses how awesome their co-op program is, yet their out of Philly contacts are limited or none (only surrounding PA really and it's even worse for designers) I heard nothing but mediocre reactions from my classmates who are using the system, two other girls in my major who are ver skilled are working at Comcast and Aetna but I want to find a more diverse/creative company. I guess I'm being picky but I have a vision and I'm doing my damndest to be where I want to be (NYC) and get what I want (some sort of creative print co-op). Understood about Pentagram, I figured that they would already have a system set up. I have a list of more people I would like to contact the beginning of next week from talking with JLT and by doing my own research/talking with John Langdon.</p>
      <p>Thanks for the link, I'll check that out...the hardest part is going to be finding a place to stay for 6 months in the city, probably by myself.</p>
      <p>The competative nature doesn't bother me, I'm going to talk to a few professors before I go to my interview next week and have them help me out. I'm very confident in my work like stated in my first post, but not overly confident that I'm not open for suggestion (after all I've only been doing this for barely two years!)</p>
      <p>I'm not asking to be lead designer or anything but I'd like to get something constructive out of this co-op, paid or not paid, I can afford to work somewhere that isn't paid if the time is worth it! I'm out to learn because I love what I do and if that isn't good enough reason to strive for the best then I don't know what is! One of the seniors who just graduated got me in contact with RCA. She said her experience was awesome, she got real work to do, the people were nice to work with and she got to meet some bands, which can't be complained about!</p>
      <p>Anyways I'll let everyone know how it goes at RCA. I'm still going to be contacting other people as backup even though this job is exactly what I'm looking for! I'll go bananas if I get it! :D</p>
      <p>-Dave</p>
