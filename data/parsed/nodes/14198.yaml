      <p>Hi all, I didn't want to bump this quite yet but seeing as how you're interested! I had my interview at RCA Records in Times Square on Thursday and it went EXTREMELY well! They hadn't interviewed anyone else and really liked my work. They'll let me know this week if I got it! It was a surprisingly small office for such a large company. I interviewed with the Creative and Video Manager then there are 2 ADs, 2 Freelance Designers and interns. The woman who I interviewed with was really laid back and easy to talk to. She asked how many days I wanted to work and told me what I'd be doing for work, 90% design and 10% administrative but that they wouldn't make me do anything that they wouldn't do. No office bitch work ;) I asked questions about what went on in the office, who handled certain tasks, how many jobs they had going at once and about the record label in general. I was told that they would give me as much work as I could handle so that's exciting. If this fails for some odd reason I'll be pursuing your help more in the next week or so!</p>
      <p>-Dave</p>
