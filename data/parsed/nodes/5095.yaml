    date: 2002-02-05T15:17:00
    date_raw: 5 Feb 2002 — 3:17pm
    votes: null
    html: "<p>Thanks a lot for all your comments and consultings! <br>  I've changed the Uc V and W cause it was not intentional (thanks David!) and it works better like this; and made a wide version of the Uc. <br>  I work on kerning settings now because fixed letterspacing doesn't work. <br>  The five last chars VWXYZ are really refractory to the grid constraints so they seems strange in the reg and wide version: I'm waiting for a pixel miracle. <br><img src=\"http://www.typophile.com/forums/messages/29/754.gif\" alt=\"ok\"></p>"
