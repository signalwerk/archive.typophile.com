    html: <p> Pretty cool idea! The only problem I see is that the diagonals are too light. BTW, you might consider making a filled-in version of the font, so that people can layer the patterned one over it, in different colors. <br> <br>hhp </p>
  - id: 37066
    user: 1020
    date: 2001-09-17T14:53:00
    date_raw: 17 Sep 2001 — 2:53pm
    votes: null
    html: <p>Reminds me of old American cross-stitching! Great. <br> <br>I also like Hrant's idea. That could prove very interesting at larger scales (200%, 300%, etc.) <br> <br>//joe</p>
  - id: 37067
    user: 617
    date: 2001-09-17T20:03:00
    date_raw: 17 Sep 2001 — 8:03pm
    votes: null
    html: <p> Superb work. Very original. I'm not a fan of the trend towards teeny tiny fonts on web pages, but this one proves that it's possible to make something beautiful out of just a handfull of pixels. <br>Now that it has been pointed out, those V and W stresses look wrong to me, and I think I'd prefer it done the normal way. </p>
  - id: 143321
    user: 3
    date: 2001-09-17T11:57:00
    date_raw: 17 Sep 2001 — 11:57am
    votes: null
    html: <p> It's so great to see something as fresh and original as this, with definate historical roots. I don't think I've seen anything like it in the bitmap stuff being designed these days... </p>
  - id: 143322
    user: 1203
    date: 2001-09-17T19:53:00
    date_raw: 17 Sep 2001 — 7:53pm
    votes: null
    html: <p> Wow, that's a beauty! <br> <br>The only other comment I'll make is that the u&amp;lc V and W (and to a lesser extent, uc Y) look backward in their stress. Was that intensional, to have the heavier strokes on the right side as opposed to the more traditional left side? <br> <br>It does add an interesting quirk, so I'm not entirely sure that it's a bad thing. </p>
