    html: |-
      <p>Sorry for the double post, but I just realized that this isn't Myriad Light... It's a Helvetica, the closest I can get to it is with a Helvetica Neue LT Std using the '35 thin'-variant at a 41,64 pt. Then a 164% vertical scale and 135% horizontal scale. Tracking at 20 and small caps. That's what I use instead of the sample and it looks like <a class="freelinking external" href="http://www.chalk-webdesign.nl/headertxt.gif" rel="nofollow">this</a>.</p>
      <p>Robin</p>
