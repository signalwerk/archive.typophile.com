      <p>The sample you submitted is not Helvetica—it’s Myriad. Lets take a look at some of the details.</p>
      <p>This one is yours:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Picture5_6161.png"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/mcad_5753.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/helv_5137.png"></div><p></p>
      <p>The first of my samples is a slightly more extended version of Myriad. The second is Helvetica Neue. </p>
      <p>Pay special attention the capital G, C, S, the @ symbol and even the capital B and K.</p>
      <p>Do you now agree that your submitted is Myriad?</p>
      <p>Mikey :-)</p>
