      <p>Here is Harry Carter's scheme from <cite>Fournier on Typefounding</cite>, his translation of Fournier's <cite>Manuel Typographique</cite>, Volume 3, pp. 236–37 (originally published in 1930; my source is the 1995 Darmstadt facsimile).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/HCarterFournier_p236-37_5442.png"></div><p></p>
      <p>&nbsp;<br>
      Note that this has no real correspondence to Fournier's scheme, which was for French and for 100,000 letters [<em>"Police de cents milliers de lettres"</em>], and not by weight as was the later practice. I assume Carter's scheme is based on some 1930s standard.</p>
      <p>James Mosley wrote the introduction and notes for my edition. Perhaps he will wander by here and offer some additional insight on traditional font schemes.</p>
