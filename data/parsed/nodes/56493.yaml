      <p>In his translation of Fournier's <cite>Manuel Typographique</cite>, Harry Carter gives a scheme for English for 500 lbs. Roman (12-pt. Old Style). I'm not inclined to try to transcribe it here. But maybe later I can scan the charts and post.</p>
      <p>-- Kent.</p>
