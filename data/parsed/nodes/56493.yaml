    votes: null
    html: <p>I don’t think that there was standard for this, it’s one of those things that was determined by manufacturers and would vary dramatically around the world based on the local language. Metal type was also sold by weight, and in the 1912 ATF catalog the scheme is broken down by the weight in pounds and ounces of each letter included in a 100 lb. font—which suggest that the number of each sort would vary based on individual sort weights.</p>
