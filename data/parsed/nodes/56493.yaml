    html: |-
      <p>There were / are several standard schemes for assembling fonts at foundries or Monotype houses. Unfortunately, I don't have any info on fonting schemes here at my office, so I'm no help.</p>
      <p>You might check with some current Monotype shops that still sell fonts. M&amp;H Type in San Francisco or Quaker City Type Foundry in Honey Brook, Pennsylvania. Or Sterling Type in Indiana. Or Bell Type &amp; Rule in Los Angeles. Or Hill &amp; Dale Foundry in West Virginia.</p>
      <p>Some Monotype houses would also make custom fonting schemes. Or sell 6-inch lines of individual sorts. Depending on what a printer needed.</p>
      <p>Foundries and Monotype houses also sold "weight fonts," extensions of the standard fonting schemes in larger quantities.</p>
      <p>Let us know what you find out.</p>
      <p>powers</p>
