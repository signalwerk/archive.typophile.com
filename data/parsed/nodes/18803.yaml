      <p>nice! thanks for the link!</p>
      <p>i’m glad there are still directors out there that care about the opening credits sequence. long gone are the good old days of Saul Bass and the like, but at least we still get a few of these nuggets each year.</p>
      <p>another recent great opening title sequence was in Kiss Kiss, Bang Bang, which had a very Catch Me If You Can meets Saul Bass-esque quality to it, while still being unique enough to be something of it’s own. <a href="https://web.archive.org/web/20080821141326/http://www.sixteentwenty.tv/movies/qt_kkbb.html">check it out here</a>.</p>
