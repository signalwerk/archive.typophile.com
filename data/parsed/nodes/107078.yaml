      <p>I would recommend an old style sans serif.<br>
      Sans, because the consistency of line weight and lack of serifs connotes mechanical efﬁciency, and old-style (a.k.a. humanist) to connote custom attention to detail.</p>
      <p>My effort in this genre is <a href="http://www.myfonts.com/fonts/shinn/sensibility/" rel="nofollow">Sensibility</a>.<br>
      You can use “old style”, “humanist” and “sans” as keyword searches at font sites to ﬁnd others.</p>
