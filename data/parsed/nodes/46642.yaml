    <p>...their printed works at least...<br>
    As a special addition to the TypeCon series of events in Buffalo, The Western NY Book Arts Collaborative in cooperation with the Rare Book Room at the Buffalo and Erie County Public Library presents a special exhibition of Typographic classics. Rarities that TypeCon attendees can see in person include Aldine and Jenson books, a Gutenberg bible leaf, The Doves bible and many classic presses and printers including Kelmscott, Grabhorn and Bruce Rogers.</p>
    <p>In addition the library is currently exhibiting: <em>The American Vandal Abroad: Mark Twain’s Travel Writing 1866-1897</em> in the Mark Twain Room of the Central library. The Twain room features the original manuscript of Huckleberry Finn and Twain letters and publications from around the world.</p>
    <p>The exhibits will be on display throughout July during regular library hours.</p>
    <p>Also inside the Central Library is Fables Café, a popular lunch spot adjacent to the Encore Editions bookshop where deaccessioned library materials are offered for sale.</p>
    <p>The library is located at 1 Lafayette Square just blocks from the Hyatt Hotel.</p>
