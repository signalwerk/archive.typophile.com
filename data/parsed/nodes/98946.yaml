    html: <p>If it were English quotes “ ”, my answer might be different, but fortunately, guillemets lack identifying qualities that would match or mismatch other glyphs of a typeface. As long as you are careful to apply them consistently, it should work fine. To edit a document littered with brief font changes requires you to be mindful, lest you find you've accidentally set one whole sentence in Bembo.</p>
