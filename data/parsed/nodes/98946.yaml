    <p>I'am a new user, and an absolute newbie in typesetting.<br>
    I am now typesetting a scholar critical edition of baroque music (I am using InDesign) and I wish to ask a question to the esperts.<br>
    I am using Adobe Garamond Premiere as the general font for the edition. It's a font I like very much, but there is a single glyph I don't like (well, two, in fact), the typographical quotes « ». I find they take too much of horizontal space, and I would like to use for them the Bembo Book quotes, which I like more.<br>
    So the question is: is it considered acceptable for a professional typesetting to mix two text fonts, so that the text is in Adobe Garamond Premiere and only the quotes in Bembo Book?</p>
    <p>Thanks in advance.</p>
