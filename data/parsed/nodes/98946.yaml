      <p>To accomplish this sort of mixing, you might be best served by establishing a special character stylesheet for Bembo Book and using this for a GREP style within your basal text paragraph stylesheet to restyle all (and only) guillemets on the fly. </p>
      <p>You should be aware that in mixing two faces like this, you will lose any kerning pairs between guillemets and adjacent letters, since the boundary will now be across fonts. Typically, the guillemets are kerned slightly with the top-heavy capitals, at the least. So, for instance, in a sequence like <em>«Telemann»</em> the first guillemet might not tuck so nicely in with the <em>T</em> as it might if set all in a single font. Depending upon the fitting of these two fonts, this may or may not present any actual visual detriment.</p>
