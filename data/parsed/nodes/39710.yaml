    <p>Good day, could you please help me with coupla fonts? this one is similar to futura but b and d have distinct features. Looks similar to <a class="freelinking-external" href="http://www.myfonts.com/fonts/urw/standup/d-regular/">Standup</a> but again not exactly.</p>
    <p>Second one having strange 1, different from other letters, otherwise looking like <a class="freelinking-external" href="http://www.itcfonts.com/fonts/detail.htm?pid=242991">Compacta</a> or HelveticaCond.</p>
    <p>Sorry if i messed up with something, thank you.</p>
