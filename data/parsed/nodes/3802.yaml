    html: <p>Thomas is right, I have been trying to remember what Chameleon blends were like, and it is true that you would never get these effects. I wish we could all play with Chameleon again, I shall have to set up a Win95/98 machine or something. It's amazing how tasteful the results are -- and how ultimately useless. Does anyone remember if Chameleon 2 was ever released, with ascender/descender control? I don't think I ever had that version. So could this be the result of a simple PS blend? Perpetua and Modern? (grasping at straws) -- or what about some of the neat built-in and programmable effects in Fontlab 2/2.5?</p>
