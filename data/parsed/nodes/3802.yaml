    html: |-
      <p>Thread drift!</p>
      <p>I am not sure about Chameleon 2... I might be confusing it in my head with 1.5 which was definitely released. That's the version which added italics support. But neither David nor I remembers a later version of the retail product being on the market.</p>
      <p>(Side note: internally in the Chameleon editor the way the italics worked was kinda whack. They were actually edited in upright form, and then slanted at the last minute. This was pretty workable for trying to make an italic that imitated an existing "normal" font because you'd start by unslanting it and sticking it in the background. But if you wanted to use Chameleon as a means of creating a new design, well, it was a pretty bizarre way to work with your italics.)</p>
      <p>T</p>
