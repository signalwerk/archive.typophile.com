    html: |-
      <p>I remember the "Expresiv Fonts" collections from the mid-90s. They were at least two, and perhaps three or more, all of pretty poor quality as I recall (and certainly this one bears that out). I have a vague recollection of examining them for a project I was considering in late 1994 or early 1995 involving cataloging knockoffs. (Which I abandoned for several reasons, including that such information could be used for evil as well as good.)</p>
      <p>A little checking shows that FontChameleon 1.0 was getting reviewed in May 1994, so dates seem about right. However, in the sample shown above, the lack of overshoot, the exaggerated serif length, the serif shapes, and the "jiggly" tops of certain letters are all inconsistent with the results of using FontChameleon in the process of creating the font. Remember, FontChameleon would blend *all* the features at the elemental/particulate level, not just take some features from each of the two fonts. This is much more like the latter approach.</p>
      <p>Some of the features could have been done by taking something output from FontChameleon and then doing lots of editing... but you wouldn't likely lose the overshoots of the rounds that way. So, I think it's just a badly executed font. (Not that the concept was necessarily bad... can't remember if this sort of thing had already been done to death back then.)</p>
      <p>I must get to sleep now.</p>
      <p>Cheers,</p>
      <p>T</p>
