    html: <p>For some reason I thought I still had this problem before I changed the numbers to go above 1000, but I changed it and it seems to work fine. The PostScript OTF version ordered correctly right away. The TrueType OTF version was still messed up, but upon closing Illustrator, deleting and re-installing the font, and then opening Illustrator again everything came out fine. Not sure what that was all about, but the end result seems to work. Thanks!</p>
