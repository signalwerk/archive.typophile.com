  html: |-
    <p>I'm in the midst of building a font family in FontLab and am having some trouble getting the fonts to display in the correct order in font drop-down menus when I finally install them. Sometimes they work, but sometimes they are out of order, which makes it all the more baffling to me.</p>
    <p>This family has nine weights, and all the weight names and numbers are pretty standard. I've checked and double-checked and it doesn't seem like I've done anything wrong.</p>
    <p>The data for the weights I've entered into FontLab are as follows:</p>
    <p>Light (300)<br>
    Book (400)<br>
    Roman (500)<br>
    Medium (600)<br>
    Semibold (700)<br>
    Bold (800)<br>
    Heavy (900)<br>
    Black (1000)<br>
    Ultra (1100)</p>
    <p>However, in the Illustrator "style" dropdown menu for this font, the weights display in the order "Black, Light, Book, Roman, Medium, Semibold, Bold, Heavy, Ultra". Is there something besides the numbers I should be checking for? The rest of the naming scheme also seems to be correct, but for some reason the ordering of the weights continues to be finnicky.</p>
    <p>Thanks!</p>
