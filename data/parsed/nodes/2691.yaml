    html: <p>Steve, I hope I haven't got this backwards. It's my understanding that text faces of the 19th century in most western countries were mainly moderns, which had lining figures. <br> <br>However, there's no way to prove this without statistical analysis!  <br> <br>I'm assuming that the popularity of OSF is related to the popularity of old style faces. <br> <br>So when the moderns, scotches, and romans of the 19th century held sway, this drastically reduced the amount of OSF in use. <br> <br>For the 20th century, Linotype setups that were "Typeface + Italic + small caps" only occasionally had OSF (even for old style faces), so I believe that this resulted in a lack of OSF during the Linotype era.  <br> <br></p>
