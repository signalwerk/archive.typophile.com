    html: "<p>Yes, I was annoyed to find recently that the majority of people use ranging as a synonym for lining, when I'd been using it as a synonym for 'oldstyle' figures. I still think the latter makes much more sense: the figures don't stay coralled in a fixed height, they range like cattle on the wide open prairie of the extender length. <br> <br>Another term for oldstyle figures is 'hanging', although this isn't very satisfactory as only some of them typically hang (3 4 5 7 9), others sit (0 1 2), and others stand (6 8) -- ignoring for now that fact that some French figures are more upstanding than their cousins in other nations. <br> <br>How about 'extending figures'?</p>"
    html_clean: "<p>Yes, I was annoyed to find recently that the majority of people use ranging as a synonym for lining, when I'd been using it as a synonym for 'oldstyle' figures. I still think the latter makes much more sense: the figures don't stay coralled in a fixed height, they range like cattle on the wide open prairie of the extender length. <br> <br>Another term for oldstyle figures is 'hanging', although this isn't very satisfactory as only some of them typically hang (3 4 5 7 9), others sit (0 1 2), and others stand (6 8) -- ignoring for now that fact that some French figures are more upstanding than their cousins in other nations. <br> <br>How about 'extending figures'?</p>"
