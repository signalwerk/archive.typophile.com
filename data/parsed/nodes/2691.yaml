    html: <p>Bringhurst dates the first lining figures to Richard Austin at the Bell foundry, 1788. <br> <br>He also believes that it was commercial usage that prompted the movement towards lining figures. <br> <br>To some extent, however, I believe it is more likely to have been part of the general modernization of typography c.1800 -- in particular, caused by people finding the roman numerals that had been used for numbers in all cap settings (because old-style figures looked so mismatched) to be archaic, long-winded, and complicated.</p>
