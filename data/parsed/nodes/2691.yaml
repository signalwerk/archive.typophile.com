    html: <p>Gerald, <br> <br>Yes, it's OK now, but back in the early 1990s, when one bought a typeface like Adobe Garamond or Palatino, the Regular Roman had lining figures, and there was also an "Expert" font that had a "standard" of Uppercase, Small Caps, Old Style Figures.  <br> <br>So, if one had a long piece of text in those problem typefaces, where one wanted to use OSF, one had to change fonts every time a figure was used.  <br> <br>Also, if one wanted to set "Caps with Small Caps" in Adobe Garamond, one had to change fonts for every Cap! <br> <br>So obviously Emigre and FontFont had a much better idea, first by making the OSF the standard figures for the roman U&amp;lc font. <br> <br>However, there were also introduced in the early nineties Linotype fonts such as Electra, that had alternate U&amp;lc fonts, both "Regular" (with lining figures) and "OSF". </p>
