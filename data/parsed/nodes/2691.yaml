    html: <p>Old style figures were the norm until around 1800, when they were almost wholly replaced by lining figures. <br> <br>When the historical revival occurred around 1900, old style figures again became available, but as a little used option, mainly for quality book publishing.  <br> <br>The "definitive" digital face, Licko's Matrix (1985) featured OSF as standard. This set the tone. <br> <br>Two FontFont faces, Scala and Meta, can also be credited with popularizing OSF again. <br> <br>When these faces were introduced c.1990, they had OSF as the standard figures, and Lining figures as the alternates.  <br> <br>This was a radical idea at the time (for instance, Adobe and Monotype followed the standard practice of creating "Expert" fonts, which grouped Small Caps and Old Style Figures on an alternate font, often named "SC/OSF"). <br> <br>However, Matrix, Scala and Meta did not take the next step, which was to also make the OS figures tabular. <br> <br>I reason that if one is designing a typeface from scratch today, it makes sense to have the standard figures as tabular, and oldstyle. This is what I have done with many of my designs -- Oneleigh, Merlin, Fontesque Sans, Bodoni Egyptian, Preface.  <br> <br>An exception to the trend towards OSF seems to be for newspaper fonts, where OSF tends to look too "bookish".</p>
    html_clean: <p>Old style figures were the norm until around 1800, when they were almost wholly replaced by lining figures. <br> <br>When the historical revival occurred around 1900, old style figures again became available, but as a little used option, mainly for quality book publishing.  <br> <br>The "definitive" digital face, Licko's Matrix (1985) featured OSF as standard. This set the tone. <br> <br>Two FontFont faces, Scala and Meta, can also be credited with popularizing OSF again. <br> <br>When these faces were introduced c.1990, they had OSF as the standard figures, and Lining figures as the alternates.  <br> <br>This was a radical idea at the time (for instance, Adobe and Monotype followed the standard practice of creating "Expert" fonts, which grouped Small Caps and Old Style Figures on an alternate font, often named "SC/OSF"). <br> <br>However, Matrix, Scala and Meta did not take the next step, which was to also make the OS figures tabular. <br> <br>I reason that if one is designing a typeface from scratch today, it makes sense to have the standard figures as tabular, and oldstyle. This is what I have done with many of my designs -- Oneleigh, Merlin, Fontesque Sans, Bodoni Egyptian, Preface.  <br> <br>An exception to the trend towards OSF seems to be for newspaper fonts, where OSF tends to look too "bookish".</p>
