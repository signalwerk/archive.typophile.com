    html: <p><i>&gt;Did the original Bodoni have oldstyle figs? </i> <br> <br>Thomas, I just took a quick spin through my <a href="http://www.octavo.com/collections/projects/bodtip/index.html" target="_blank"> Octavo copy</a> of the Bodoni <i>Manuale Tipografico.</i> The type specimens themselves to not generally show numerals. But the figures used in the introduction are indeed "oldstyle".  <br> <br>Note that Bodoni used the standing 3 and 5 (as opposed to the more common hanging form). I usually think of these as "French style" -- but I would be curious now to know who was the first to raise those two. Perhaps one of the Didots? <br> <br>-- Kent. <br> <br>P.S. I also always tend to think of "ranging" figures as oldstyle for precisely the same reason that John described.</p>
