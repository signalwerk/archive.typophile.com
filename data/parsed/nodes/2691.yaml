    html: <p>Rodolfo, Grazia Bodoni is shown in Allan Haley's <i>Hot Designers Make Cool Fonts.</i> The numerals follow the traditional OsF pattern. <br> <br>I don't know if Bodoni was consistent with the standing 3 and 5 in all of his fonts. The <i>Manuale Tipografico</i> does not generally show figures with the specimens for each size. Also, I have not done an exhaustive search of the work. But the numerals within the introduction are all "French style." Same with the page numbers and the index and the numbers identifying his catalog of ornaments. And there are two pages toward the end which show large numerals (I can't tell what size, but display sizes) which have a standing 3, 5, <i>and</i> 7, but short 0, 1, and 2, and a hanging 9. <br> <br>Looking quickly through Updike, I notice that the Romain du Roi (as cut by Grandjean, c. 1700) appears to have had the standard pattern of OsF. Same with Luce's fonts (c. 1770s). The standing 3 and 5 show up with the Didots (c. 1780s). <br> <br>However, I notice at least one instance of Baskerville cutting a standing 3 and 5! In figure 272 (Vol. II, opposite pg. 115), a notice of sale of some of Baskerville's types in Paris, c. 1789, (set, of course, in one of Baskerville's fonts) shows a standing 3 and 5.  <br> <br>The standing 3 is also seen in figure 165 (Vol I), which is an example of Voltaire's <i>La Pucelle</i> printed in France in 1789 using one of Baskerville's types.    <br> <br>Baskerville died in 1775. So, it seems conceivable to me that the "French style" of OsF may, in fact, have originated in a Baskerville experiment. <br> <br>-- Kent. <br></p>
    html_clean: <p>Rodolfo, Grazia Bodoni is shown in Allan Haley's <i>Hot Designers Make Cool Fonts.</i> The numerals follow the traditional OsF pattern. <br> <br>I don't know if Bodoni was consistent with the standing 3 and 5 in all of his fonts. The <i>Manuale Tipografico</i> does not generally show figures with the specimens for each size. Also, I have not done an exhaustive search of the work. But the numerals within the introduction are all "French style." Same with the page numbers and the index and the numbers identifying his catalog of ornaments. And there are two pages toward the end which show large numerals (I can't tell what size, but display sizes) which have a standing 3, 5, <i>and</i> 7, but short 0, 1, and 2, and a hanging 9. <br> <br>Looking quickly through Updike, I notice that the Romain du Roi (as cut by Grandjean, c. 1700) appears to have had the standard pattern of OsF. Same with Luce's fonts (c. 1770s). The standing 3 and 5 show up with the Didots (c. 1780s). <br> <br>However, I notice at least one instance of Baskerville cutting a standing 3 and 5! In figure 272 (Vol. II, opposite pg. 115), a notice of sale of some of Baskerville's types in Paris, c. 1789, (set, of course, in one of Baskerville's fonts) shows a standing 3 and 5.  <br> <br>The standing 3 is also seen in figure 165 (Vol I), which is an example of Voltaire's <i>La Pucelle</i> printed in France in 1789 using one of Baskerville's types.    <br> <br>Baskerville died in 1775. So, it seems conceivable to me that the "French style" of OsF may, in fact, have originated in a Baskerville experiment. <br> <br>-- Kent. <br></p>
