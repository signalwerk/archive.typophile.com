    html: <p>Lanston Type Company was first to offer old style (hanging)  figures in PostScript, full set of ligatures, drawn small caps, and tied letters. <br> <br>Naturally  we also offered lining figures with these fonts. There was never need to order expert fonts. <br> <br>Also first to offer both long and short descenders, swash italic and a full set of quaints, (long s with ligatures) Also with long and short descenders. Not to mention first with the questionable merits of italic small caps. <br> <br>Plus our Keycap arrangement for Caps, small caps and oldstyle figures became industry standard. I believe that my conversation  with Linotype in that regard was helpful.</p>
