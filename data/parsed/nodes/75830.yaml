    html: <p>Chris be aware that you are not allowed to modify the design's of Mário Feliciano unless he expressly permits it. It's called 'droit morale' or moral rights, and they protect all creative expressions from misrepresentation (the author's right to integrity). Droit morale covers the EU of which both Ireland and Portugal are members. Further I can see that Mario has already designed the relevant glyphs for Polish.</p>
