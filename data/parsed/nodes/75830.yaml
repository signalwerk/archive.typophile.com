    html: |-
      <p>Chris, </p>
      <p>1. In FontLab Studio's Font Window, switch to Names mode, and from the encoding dropdown list, choose "Type 1 World Microsoft" / "MS Windows 1250 Central European".<br>
      2. In Font Info / Encoding and Unicode / Microsoft Character Set, you may need to choose "Central (Eastern) European". Generate the font as Type 1 -- that would be the standards-compliant way (the font will have a custom encoding, marked as "CE).<br>
      3. If your system does not recognize non-Western Type 1 fonts (which is possible), choose "Bitstream font set" in Font Info / Encoding and Unicode / Microsoft Character Set instead (this way, the font will have a custom encoding but marked as "Western"). </p>
      <p>(Damn, I already started thinking about removing the non-Unicode font generation options, but it seems they're still being used by some folks. :) ).</p>
