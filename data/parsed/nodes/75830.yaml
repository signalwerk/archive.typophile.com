    html: |-
      <p>Fortunately, the CE codepages and encoding files in FontLab should contain all the Polish and Czech diacritics, so you won't have to make separate font files for each of those two languages.</p>
      <p>As for the font identification, I wish I could say that I had been sitting in a pub in Dublin, and that I reached over and glanced at the newspaper, recognizing the fonts instantly! Instead, I got a PDF and looked at that.</p>
      <p>At newseum.com, there is a daily collection of PDFs of front pages of newspapers from around the world. I looked at today's European papers, and was glad to see the Irish Times there. I downloaded the PDF, opened it up in Acrobat, and looked at the embedded fonts in the document's preferences. Then I went over to Mário's website to find the fonts, and make sure that nothing had gone wrong with the PDF.</p>
      <p><a href="http://www.newseum.org/todaysfrontpages/" title="http://www.newseum.org/todaysfrontpages/">http://www.newseum.org/todaysfrontpages/</a></p>
