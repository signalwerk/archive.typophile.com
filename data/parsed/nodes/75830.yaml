    <p>Hi there,</p>
    <p>ok, you'll have excuse the language I might use, no it's not rude, but I am relatively new to type design. I've been asked by my company, a national newspaper in Ireland to create Polish versions of the typefaces we use. At the moment our typefaces have no Polish characters. I can draw the required characters no problem in Fontlab, I found an excellent article online on how to do this but when it comes to generating the actual font I'm running into difficulties.</p>
    <p>Our publishing system ONLY allows Windows postscript fonts which have a character limit of 255. My new glyphs are not showing up in the generated font. So my question is, how do can I achieve this? Many thanks.</p>
    <p>regards, Chris</p>
  html_clean: |-
