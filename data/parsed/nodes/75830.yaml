    html: |-
      <p>If you need to create a Windows PostScript font, you can just use a different codepage for the font. This will give you the slots that you need for Polish (and a number of other Eastern European languages). You can switch between different codepages or different encoding files in FontLab.</p>
      <p>What is the typeface that your newspaper uses? You might be able to license a Central European version of the font in Windows PostScript. (At Linotype, for instance, we still have thousands of fonts in this format, but only for fonts made before about 2004).</p>
