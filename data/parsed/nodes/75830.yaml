    html: <p>Chris, I see that the Irish Times uses the Flama and Expresso typefaces. These are both from Mário Feliciano in Portugal (<a href="http://www.felicianotypefoundry.com" title="http://www.felicianotypefoundry.com">http://www.felicianotypefoundry.com</a>). It would be best just to contact him directly. He probably has versions of the fonts that meet your language and software requirements that you can use, saving you the trouble of having to create them yourself. Or, he could whip them up in a jiffy.</p>
