    html: <p>Although I go too far to say "no consequence", I don't find the result surprising. Obviously, humans have to have the capacity or else we would not be able to read. We know therefore that our ancestors had the capacity also where we have evidence of writing. When the capacity arose does not seem to be interesting to me. It especially does not seem to be interesting if it is not being put to use for writing and reading. I suspect that the ability to recognise permutations must be more necessary for vision than may have been thought. I think that we underestimate the cognitive abilities of animals. I am utterly convinced that I have heard birds talking to each other. It is a secret language that they do not sing out loud and use very quietly. We only need to know one case of when a bird or animal has been able to speak to us, as a trained African grey parrot, that they would tell us that they want freedom if only they could. I saw the parrot on television say that it didn't want to do any more tests and wanted to be let out, but the experimenter told the parrot in reply that it had to do the tests.</p>
