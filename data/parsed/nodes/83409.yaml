      <p><em>What would matter more is that the baboons could discover the patterns themselves on their own initiative, without being shown them by rewards.</em></p>
      <p>What possible criteria could the baboons have to discover such patterns on their own? <em>They don't speak English.</em> The baboons have to be given a basis for distinguishing the patterns of English orthography from non-word letter sequences, and that basis is provided by the reward that they receive during the training. You can't say to a baboon 'This one is an English word and this one isn't'; you have to communicate the distinction via something that the baboon understands and finds motivational.</p>
      <p><em>...the baboons would only have been identifying sets of letters that satisfied the patterns that they were trained to detect rather than by whether the sets were words...</em></p>
      <p>No. The baboons were trained to distinguish words from non-words. They were not presented with sets of letters but with words and non-words, and they were rewarded for identifying the words by pressing a particular button, and then for identifying non-words by pressing a different button. So the training and  subsequent testing is of word selection vs non-word selection, not for learning particular sequences of letters. The testers are not somehow telling the baboons that what they need to do is memorise certain letter sequences: they are presenting two kinds of objects, and teaching the baboons that some of these correspond to one button and some to another. Then the baboons are shown different sets of objects, that they have not seen before, and have to try to decide which correspond to which button. The fact that they are able to do so correctly demonstrates a) that they are able to distinguish different orders of letters (since that is, in fact, what distinguishes the two kinds of object), b) have understood that this is the criteria by which to distinguish the objects, and c) can extrapolate ordering principles from one set of objects to another set. That is pretty darned remarkable, especially when you consider that baboons are not considered among the most intelligent of primates and that they are not in the hominid line. The latter point is most interesting to me, because it means that if the cognitive mechanism by which the baboons are able to do these things is the same mechanism by which humans can, then it must have evolved before the split between Cercopithecidae and Hominidae, and that implies some time in the Miocene period, probably between nine and fourteen million years ago.</p>
