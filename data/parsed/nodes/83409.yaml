      <p>Personally, while I think that leaving the hard sign off the ends of the words is still a good idea, the Russians should bring back the letters they threw away with the new orthography under the Soviets. It would help in transliterating Greek words.</p>
      <p>But then I'm not familiar enough with the subject to even imagine what "damage" Peter the Great did to Russian. The current alphabet is phonetic for the language, and so going all the way back to Old Church Slavonic wouldn't seem to be an improvement.</p>
      <p>And while "outrage" probably isn't the right reaction to a proposed reform of Latin script, I would expect you would be met by an even more resolute hostile reaction: apathy.</p>
      <p>Even, say, the Hebrew alphabet - some of the letters of which are hard to distinguish for outsiders - isn't likely to get changed to suit them any time soon. Nor are Chinese characters going anywhere, despite the challenges they clearly pose to education for the Chinese people.</p>
      <p>Once people have an effective means of communication that they can use with facility, the thought of undergoing a painful learning curve merely to regain what they once had - with perhaps some gains which are minute in comparison - will be rejected out of hand as unreasonable and irrational. This seems to me to be an entirely sensible reaction, even if it <em>is</em> also an obstacle to potentially useful progress.</p>
