      <p>@dudfellow:<br>
      You raise an interesting question.</p>
      <p>Some objections to the specific <em>form</em> in which it was put can be raised, though.</p>
      <p>If people make fonts for Arabic that provide high-quality calligraphic features, that won't mean that there is now a danger that when someone takes all their computers away, they won't be able to go back to using Linotype machines and typewriters, because they will no longer accept the inferior output from them.</p>
      <p>There's no reason to expect that level of dependency would be created by the computer when it didn't exist originally - when the pen was frequently resorted to. Nor is there a real threat of the Islamic world being decomputerized.</p>
      <p>On the other hand, while I think many people will object to this as well, it <strong>is</strong> legitimate to question if a society has its priorities straight when its esthetic preferences for its writing system are allowed to get in the way of mass literacy and technical progress.</p>
      <p>Given the wide acceptance of the Yakout typeface in Arabic newspapers, for example, however, the Arab world does not seem to be nearly as much a case of this as China and Japan.</p>
      <p>Typewriter faces with only two forms of each letter have been well enough accepted in the Arab world, and the additional complexity of two forms of each letter does not to me seem sufficient as to be a major obstacle to Arabic participation in the computer revolution.</p>
