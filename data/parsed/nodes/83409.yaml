      <p>I think we basically agree then about what the baboons were trained to do: to recognise the orthographic patterns of English spelling such that they could henceforth recognise English words and to distinguish them from non-words. Yes?</p>
      <p>I find your comments about the experimental results having 'no consequences unless the baboons show the ability to formulate orthographic rules of their own volition, without artificial rewards' simply bizarre though. Consequences for whom? The results demonstrate not only that baboons have the capacity for orthographic processing but that this capacity is independent of language knowledge (obviously). The experiment tells us things about that capacity, not about the consequences of that capacity. Obviously what humans have done with that capacity is very different from what other primates have done with it, yet the fact that the capacity seems to be shared suggests very interesting things about our shared evolution. It suggests, among other things, that core perceptual and cognitive functions that enable the mechanics of reading are very, very old. I'd long assumed that these functions preceded the invention of writing by some long period, but this experiment indicates that they may have evolved long before human beings became such. What the baboons have done, might do or will do with this demonstrated capacity is beside the point: the experiment has consequences for our understanding of ourselves. What is consequential in the study is what it tells us about the capacity, and the fact that baboons have not, apparently, exploited to capacity to create writing and reading 'of their own volition' is neither here not there; since the capacity likely predates human written language by some millions of years, of more interest is the question of why it might have been evolutionarily selected for or to what selected-for trait it was a free rider.</p>
