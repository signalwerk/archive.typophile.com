      <p>Don't you understand the conditional "If they were trained only to recognise patterns of orthography"? </p>
      <p>By "patterns" and the context of your comment "No, they were trained to recognise patterns in letter order" in reply to mine "It seems that the baboons were trained to recognise words by their spelling ", I assumed you meant orthographic patterns. Unless the word orthography means something different to me than to others, it is a consequence of the allowed permutations of letters in the spelling of words, for a particular language and system of writing. It is not possible to have orthography without spelling. In an abstract way, one might suppose a hypothetical system of orthographic rules, but these could only be conveyed by actual permutations in sample words. Visually, words are nothing more than permutations of letters that become allowed. Hence, in order for the baboons to have been trained to identify orthographic patterns, they had to recognise spelling, which is nothing more than permutation of letters. In summary, the baboons could not have only been taught to recognise orthographic patterns, they had to be able to recognise spelling as a prerequisite.</p>
      <p>It is a personal opinion of mine that the result of the experiment has no consequence unless the baboons show the ability to formulate orthographic rules of their own volition, without artificial rewards. The baboons were trained to recognise the patterns. More important would be to observe the baboons using this ability in a natural setting, without using trials. That is not likely to happen unless we see baboons suddenly picking up implements and writing their own letters. (This is not as improbable as it sounds. I have read before in a book a myth about how a certain system of writing in Africa was in origin imparted to humans from baboons that approached humans around their fires.)</p>
