      <p>John Hudson: "trained to recognise patterns in letter order that are found in English words vs patterns that are not"</p>
      <p>If they were trained to recognise the patterns, then I don't see the point of the experiment. What would matter more is that the baboons could discover the patterns themselves on their own initiative, without being shown them by rewards. If they were trained only to recognise patterns of orthography, which have a vestigial underlying phonological basis despite irregular spelling, somehow without at the same time being trained to recognise words by their spelling, then in the prospective test, the baboons would only have been identifying sets of letters that satisfied the patterns that they were trained to detect rather than by whether the sets were words, with the exception of any mistakes (that is to say, not doing what the experimenters want them to do) that the baboons would make occasionally. If, on the other hand, the baboons had failed the test, we could only say that they were too dim-witted to catch on to the training.</p>
