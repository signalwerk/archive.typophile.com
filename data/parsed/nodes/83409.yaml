      <p>AzizMostafa: "The Glorious Holy Quran Confirms that particular cognitive ability ANIMALS use for a very specialised cultural activity?!"</p>
      <p>There is an incident in the Bible, in the book Numbers, Chapter 22 verses 28 to 30 involving a speaking donkey.</p>
      <p>I recall reading an article that appeared in the Economist, issue July 10th 2010, pages 73 to 74, titled: "The Da Vinci code" subtitled: "Reading may involve unlearning an older skill" relevant to some of the work of researchers such as Stanislas Dehaene and Mark Changizi. I had taken an interest in it at the time, because it was suggested that baboons have build-in specific areas of the brain for detecting certain graphical features that occur in letters. As far as I recall, the article discussed whether learning to read could hijack parts of the brain that would otherwise have been used for skills that are necessary for social interaction, such as recognition of faces. I wonder whether conditions such as Asperger's syndrome could be improved by discouraging too much reading, or whether some systems of writing would have a greater tendency to hinder socialisation, and to what extent the amount of morphography versus phonography in the writing affects this, if at all. </p>
      <p>The table that is included with my post of 7 Jul 2011 — 9:35am in this node also can be consulted as Figure 135, page 175 of the book "Sign, Symbol and Script" by author Hans Jensen, published by George Allen &amp; Unwin Ltd., 1970.</p>
