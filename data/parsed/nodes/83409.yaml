      <p>When cultures "prefer" the old ways and have reverence for the work of the pen and calligraphy instead of embracing newer means of mass-producing texts, how much are they kidding themselves because their system or style of writing prevents them from adapting? Westerners have respect for handwriting and hard-copy paper, but you cannot deny that we are using keyboards right now. Arabic society may have suffered a delayed flourishing and advancement of literary exchange because of reluctance to adopt the mechanical printing press.</p>
