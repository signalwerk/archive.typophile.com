    html: |-
      <p>A distinction should be made between </p>
      <p>a) cursive writing, which results in connections between individual letters based on minimising the number of times the pen leaves the page (e.g. English running hand or connected italic);</p>
      <p>b) connected formal writing, in which the connection between letters is constructed from independent strokes rather than cursively written (e.g. Devanagari); and</p>
      <p>c) morphographical scripts, in which the strokes connecting letters replaces strokes of the independent letters, thereby changing their shape (e.g. Arabic).</p>
      <p>____</p>
      <p>Hieratic isn't cursive, it is a formal book hand. Demotic is informal and shows more elements of cursive. In order to determine whether a script style is cursive, you need to analyse the individual sign forms and determine how frequently the pen needs to leave the writing surface in order to write them. Cursive is all about speed and about minimising the number of times the pen has to be lifted and put down again.</p>
      <p>All mature scribal cultures develop both formal book hands and informal or secretarial (chancery) hands. Cursive connection is one typical feature of the latter, but they also tend to display other characteristics derived from speed: abbreviation, compression and slant. Latin informal hands don't employ much abbreviation, but do display compression and slant. An Arabic informal hand such as ruqah displays considerable abbreviation, particular in losing the teeth of seen; it can be contrasted with the formal hands such as thuluth and naskh. [Nastaliq is interesting in that it functions as both a formal book hand and as an informal hand, especially in the Perso-Indic tradition, with the difference mainly in the care/speed with which it is written in different circumstances.]</p>
      <p>It isn't sufficient to describe Arabic as ‘cursive’. It is morphographical, which means that the shape of the letters is determined by adjacency. This is why, unlike Latin, you can't just remove the connections between cursively written letters and still get something readable; in Arabic the connections are part of the letters, not separable linking strokes.</p>
