      <p>Cursive is bad. It was Akhenaten's fault. Before that, everything in Egypt was done in boxes.</p>
      <p>The value of cursive is that it makes writing quicker. You might say that cursive writing is more beautiful. However, the most beautiful calligraphy takes ages to write, so the conveyance of flow wherein the beauty resides is deception. Cursive style in handwriting is not good for legibility. Many people prefer to read a printed text of disjoint letters. I find the ink blot effect of brushwork Chinese characters off-putting and crude. I see refinement in conformity, the majesty of logical order and practicality. Cursive writing is not good for certain kinds of execution and writing media, such as carving on hard surfaces. Systems with distinct letters are better for printing and electronic display.</p>
      <p>A system of writing that has a cursive foundation is unsound and crumbles towards the top.</p>
      <p>Arabic calligraphic works of art are amazing though.</p>
