      <p>AzizMostafa: &gt;Crumbles towards the top or bottom?!</p>
      <p>hrant: &gt;But not for [immersive] reading.<br>
      Which however does not mean calligraphy is good for type.</p>
      <p>Because of the equipment involved, printing with moveable type is technologically more advanced than drawing with pigment on sheets.</p>
      <p>Primitive modular electronic display such as on pocket calculators is technologically more advanced than printing with moveable type, because of the equipment involved.</p>
      <p>Non-cursive script is more suitable for printing with moveable type and modular electronic display than cursive script.</p>
      <p>In that sense, cursive scripts crumble towards advanced applications.</p>
      <p>There are even more advanced applications than printing and electronic display. Information storage and transmission may be relevant to this argument. Segmental as opposed to morphological script allows combinatorial construction from a smaller set of characters. Morphological characters hardly combine combinatorially except at the word formation level. Segmental letters, on the other hand, combine at the level within the word as well as by permutations of words and morphemes. Hence, segmental systems of writing are inherently better adapted to information technology.</p>
      <p>Anyway, cursive scripts crumble towards the bottom as well, as they are not suitable for scratching on hard surfaces, for example if you find yourself on a desert island with no paper or ink pens. Reasons similar to this may be why the Roman alphabet has been promulgated so well.</p>
      <p>I'm sticking to the claim that cursive script is less legible. People can argue that morphographic cues aid faster reading. But segmental letters can provide morphographic cues too, albeit in a less spatially compact fashion. But since morphographic scripts take longer to learn, any benefit of rapid reading in the end is counter-balanced.</p>
      <p>Cursive script can be okay for type if you are clever enough to design it well.</p>
      <p>That said, I don't have anything against cursive script per se, it is against systems of writing that are based on cursive origins and which cannot be written segmentally whereas segmental letters can be written in both ways.</p>
