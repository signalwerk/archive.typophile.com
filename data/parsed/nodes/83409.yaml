      <p>This thread has been veering somewhat off course from its original topic, for which I apologise as I seem to have been responsible.</p>
      <p>If we look on the bright side and try to see the advantages, perhaps retrospectively, at least I have at the earliest stage disclosed biases I have that may undermine serious scholarship.</p>
      <p>This is particularly important as there is evidently a risk of selecting the definition of "cursive" to suit our intentions.</p>
      <p>So let us address the original topic:</p>
      <p>Gunarta:<br>
      &gt;Is Arabic the first cursive writing?<br>
      &gt;I think Arabic is the first Cursive, because its cursive is modified into formal writing in its writing system.</p>
      <p>In concordance with John Hudson, 4.Jul.2011 10.41am: </p>
      <p>&gt;a) cursive writing, which results in connections between individual letters based on minimising the number of times the pen leaves the page (e.g. English running hand or connected italic)</p>
      <p>I take the definition of cursive to mean graphical features that minimize the times that the implement of writing is lifted from the surface medium in order to increase the speed of execution. By cursive I do not necessarily mean a stenographic script of disjoint marks, such as Tironian short hand or scribal notation. Nor do I accept simple connection of letters, as<br>
      Gunarta suggested 3.Jul.2011 2.00am:</p>
      <p>&gt;I defined cursive as connected letters</p>
      <p>as otherwise we could say that the Ogham script, which consists of nothing other than straight lines, is cursive. I do not accept, as riccard0 3.Jul.2011 1.09am suggested, that a script can be cursive just because it is written by hand:</p>
      <p>&gt;Any script had or have a cursive form of some sort, in the exact moment in which it’s written by hand</p>
      <p>otherwise we could say that the Futhark runes were cursive.</p>
      <p>The term cursive can be applied to scripts that predate its coinage, because we are using it as an academic categorisation for morphology or form rather than phylogeny. In contrast to others, I would not say that cursive applies only between letters or other glottographic segments that correspond to temporal acoustic segments. Cursive also applies within letters or morphograms. We can describe a script as cursive if it possesses any significant amount of cursivity, and there are degrees to which scripts are cursive, so that some are more cursive than others. Cursive and morphographical are not mutually exclusive terms; a script can be cursive and nevertheless morphographical.</p>
      <p>Take, for example, the case of Chinese characters. Even though there may not be cursive connections between characters in a particular Chinese script style, we may still say that the script is cursive if there are cursive features within the characters. This may be compared to cursive handwriting of the Roman alphabet, where there are cursive features within and between letters but not conventionally between words. Since the Chinese character corresponds to morphemes and often to whole words, the amount of cursivity is capable of being similar for the Chinese and Roman scripts.</p>
      <p>As a second example, consider Arabic calligraphic script. Yes, there are morphographical traits on account of the likes of initial, medial and final forms, but this does not negate the fact that this Islamic script is predominantly cursive. If we were to say that Arabic script is not cursive, because it is morphographical, then by a similar argument we could claim that running handwriting in the English language written with the Roman alphabet is not cursive because of the morphographical attributes imparted by irregular spelling.</p>
      <p>Thus, we acknowledge that there are cursive forms of Chinese script. A cursive variant or style of Chinese character script had evolved by at least as early as about 200 BC. There really are cursive features within those Chinese characters. This is well before the earliest remaining examples that we have of cursive Arabic, dating from about the 4th century AD. Therefore, we can definitely say, on the basis of the evidence available to us, that Arabic is not the first cursive script.</p>
      <p>I think it is fair to say that Literary Hieratic is a more cursive form than the monumental Hieroglyphic. Hieratic must be older than the cursive Chinese script. That Hieratic may be the oldest cursive was pointed out by riccard0 3.Jul.2011 4.07am. But John Hudson 4.Jul.2011 10.41am says:</p>
      <p>&gt;Hieratic isn't cursive, it is a formal book hand.</p>
      <p>To return to the statement in the opening post:</p>
      <p>&gt;I think Arabic is the first Cursive, because its cursive is modified into formal writing in its writing system.</p>
      <p>Perhaps I do not understand correctly, but I do not see why the formal form of the script has to be cursive in order for the writing to be the earliest cursive. This may be relevant to the question of whether Literary Hieratic is cursive even though it is a formal book hand. Cursive does not necessarily imply informal, and formal does not necessarily imply non-cursive. It seems that this may be a case of choosing the definition to suit ones purposes.</p>
      <p>So, I think that the question has been answered already. I would like to continue the argument on the merits of cursive script, as you can see how I have been able to highlight how it might be related to the reasons for our choices of definitions of cursive, perhaps in a new discussion if this has not been done before.</p><div class="imageWrap"><img src="http://typophile.com/files/StevenRogerFischerpage171JEPG_5171.JPG"></div><p></p>
