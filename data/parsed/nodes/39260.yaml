      <p>Check some slab serif faces – PMN Caecilia or TheSerif. Or <a href="http://www.fontshop.com/search/?q=FF+Olsen&amp;site=d&amp;btnG=Go" target="_blank" rel="nofollow">FF Olsen</a>.<br>
      And something from Gerard Unger comes in my mind also, maybe <a href="http://www.myfonts.com/fonts/bitstream/oranda/" target="_blank" rel="nofollow">Oranda BT</a> – which is quite cheap – if you don't need OSF.</p>
      <p>I would not mix FF Din with another Sans, could cause problems with contrast …</p>
