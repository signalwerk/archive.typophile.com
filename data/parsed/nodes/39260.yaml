  html: |-
    <p>Is there anyone that knows what font I could combine with DIN? I'm looking for a classy serif font. It will be used in longer texts. DIN will be used for headlines and lead.</p>
    <p>Alternative it would also be nice to have a sans serif font that is very legible in long texts. Depending on the clients wish I'll offer both alternatives for him to choose from.</p>
    <p>Thnx,<br>
    ®ené</p>
