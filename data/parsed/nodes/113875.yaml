      <p>Enchanting, futuristic and stylish Art Deco script lettering that would make a very appealing font. I doubt that it was a font at the time, although someone might have subsequently made a font based on the letters.<br>
      I can give you some leads to similar type faces, which I offer in no particular order.<br>
      1. Free Fonts<br>
      Eduardo Tunni: Warnes <a href="http://www.fontspace.com/eduardo-tunni/warnes" title="http://www.fontspace.com/eduardo-tunni/warnes">http://www.fontspace.com/eduardo-tunni/warnes</a><br>
      Nick Curtis: Uppen Arms NF <a href="http://www.fontspace.com/nicks-fonts/uppen-arms-nf" title="http://www.fontspace.com/nicks-fonts/uppen-arms-nf">http://www.fontspace.com/nicks-fonts/uppen-arms-nf</a>, Dymaxian Script <a href="http://www.fontspace.com/nicks-fonts/dymaxion-script" title="http://www.fontspace.com/nicks-fonts/dymaxion-script">http://www.fontspace.com/nicks-fonts/dymaxion-script</a><br>
      Tup Wanders: Remarcle <a href="http://www.fontspace.com/tup-wanders/remarcle" title="http://www.fontspace.com/tup-wanders/remarcle">http://www.fontspace.com/tup-wanders/remarcle</a><br>
      Shy Foundry: SF Americana Dreams <a href="http://www.fontspace.com/shyfoundry/sf-americana-dreams" title="http://www.fontspace.com/shyfoundry/sf-americana-dreams">http://www.fontspace.com/shyfoundry/sf-americana-dreams</a><br>
      Font Mesa: Ferro Rosso <a href="http://www.fontspace.com/fontmesa/ferro-rosso" title="http://www.fontspace.com/fontmesa/ferro-rosso">http://www.fontspace.com/fontmesa/ferro-rosso</a><br>
