    <p>Hello - can anyone identify the name of the typeface used on the nameplates of certain Packard automobiles made in the very late 1930's and early 1940's?  A few samples are attached.  Would also appreciate hearing about any similar typefaces.  I did search the Typophile forums prior to posting, and hope I didn't miss anything.  Much thanks for any guidance. Kevin<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/One Sixty nameplate - 2_3669.jpg"></div><p></p>
