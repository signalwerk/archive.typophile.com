    <p>Looking for a typeface to compliment Chalet 1970 (which is being used for the headers). The font will be used for body text in promotional material, and on the website (if it is a Google web font). Any recommendations? </p>
    <p>Bit of background to the project is that it is for a fitness brand, which has lower case Chalet 1970 in it's logo.</p>
