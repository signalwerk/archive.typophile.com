      <p>Thanks for the reply. Is a lovely font, however I was looking for a san serif font. Should have put that in my first post! I am definitely looking for something with high readability though. </p>
      <p>I feel that a typeface where there isn't a top hook (sorry for the lack of correct terminology!) on the letter a. I believe that would go well with the circular and geometric feel of Chalet.</p>
