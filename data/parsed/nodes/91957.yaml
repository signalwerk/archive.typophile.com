      <p>We call that the "monocular", "single-story" or "infant" form (I prefer the first). The problem is fonts with such an "a" are rarely suitable for long text.</p>
      <p>What about going in another direction in terms of geometry?<br>
      <a href="https://www.fontfont.com/fonts/cube" title="https://www.fontfont.com/fonts/cube">https://www.fontfont.com/fonts/cube</a></p>
      <p>Or there's this:<br>
      <a href="http://www.fontshop.com/fonts/downloads/sweet/sweet_sans_package_1_ot/" title="http://www.fontshop.com/fonts/downloads/sweet/sweet_sans_package_1_ot/">http://www.fontshop.com/fonts/downloads/sweet/sweet_sans_package_1_ot/</a><br>
      Although I don't know about its webfont performance.</p>
      <p>hhp</p>
