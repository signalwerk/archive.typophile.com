    html: |-
      <p>Given the lack of detail in your image, to my eye the closest available digital font is Vonnes Light Compressed </p><div class="imageWrap"><img src="http://typophile.com/files/VonnesLightCompressed InUse_5845.jpg"></div> <a href="http://www.fontbureau.com/fonts/Vonness/" title="http://www.fontbureau.com/fonts/Vonness/">http://www.fontbureau.com/fonts/Vonness/</a><br>
      David Berlow designed Vonness based on Bauer’s Venus of 1907-10 and expanded it to 56 fonts.<br>
      This weight existed as a metal font under the name Venus Light Condensed.<br>
      I don't know if it is possible to purchase a single font.<br>
      As for your 1968 font all I can observe is that this was the era of photo lettering and fonts for advertising and packaging were aften the result of considerable changes in width, height and weight.<br>
      Don<br>
      p.s. I am not really certain whether this is the compressed or condensed, but this specimen shows the narrower of the two.<p></p>
