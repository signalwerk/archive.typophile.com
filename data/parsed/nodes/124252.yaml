  html: |-
    <p>typogrid is a smart tool for typographers and graphic designers helps them to create typography letters and pixel arts based on the grids system.</p>
    <p>In 2011, I developed the first version of this web application under "Square Kufi / Kufi Murabba" name. The concept of the app was to help users create one kind of arabic calligraphy which is Square Kufi using pen and eraser tools.</p>
    <p>At the end of 2014, and after feedback and further development of my vision, I developed a lot of concepts to created an advanced and smart tool for typographers and graphic designers which would help them to create typography letters and pixel arts based on the grids system, in a much more faster way. Thus, this web application has now emerged as something more than a tool to create Kufi arabic calligraphy - it has become a TypoGrid.</p>
    <p>Technical Features:<br>
    - User-friendly interface<br>
    - Export as SVG and PNG<br>
    - Import SVG files<br>
    - Compatible on iPad, Tablets and smart phones</p>
    <p><a href="http://qcalligraphy.com/typogrid1.0/">http://qcalligraphy.com/typogrid1.0/</a></p>
    <p><a href="http://player.vimeo.com/video/121028665">http://player.vimeo.com/video/121028665</a><br><a href="http://player.vimeo.com/video/121029805">http://player.vimeo.com/video/121029805</a></p>
    <p><img src="/sites/default/files/old-images/small_typogrid_01_6299.gif"></p>
