    html: <p>I think your letters look dated in this context. It has the feel of a tech logos from the 1990s that used futuristic typefaces to imply their technology. I don’t think that approach is appropriate for medical technology, which could benefit from a responsible blue-chip feel that says “Our stuff won’t kill patients.” These letters also don’t connect with the style of art in the ellipse/doctor, and the colors you’ve chosen feel very dull.</p>
