      <p>It’s that lowercase r that is really bugging the hell out of me. I don’t mind this typeface since you it does an effective job at making the point that this is a medical technology company, but there is that huge white space under that r, specifically in the first logo, that is just making my eye not want to look at it anymore. </p>
      <p>I think tying the oval doctor logo (which is also awful, but since you can’t change it I’ll skip my rant) in more with the Tagline or the company name would definitely give this logo a much tighter and precise looking quality. Maybe try something other than a completely linear looking logo, make the oval work for you, rather work for it. </p>
      <p>Good luck!</p>
