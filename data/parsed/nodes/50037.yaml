    html: |-
      <p>The unicase/lower case mix of the new typeface is peculiar, some of the glyphs don’t appear to be designed to be together. The B sits well with the e and r but not with the K, l or y. I share the same misgivings about the “techno”-quality of the type, for the reasons that it is already dated by some standards and will not age well. The relationship between icon and type isn’t working yet, they just aren’t tied together whether this can be sorted is a tricky problem since you have two strong directions – horizontal and diagonal, this is especially evident in the centred versions. The next area to look at is the sub, you have a long line to work with and used at a small size (business card for example) it might be just too small to read easily, but as noted the lines in the icon will also need consideration if they aren’t going to fill in at small size – so, given that it cannot be altered, that minimum safe size is going to dictate, to some extent, the form of the logo.</p>
      <p>The website has that web 2.0 emboss, highlight effect that some web designers feel free to throw at every carefully designed (or not) logo – not pertinent to your project, just something that really annoys me, especially when I am forced to comply with poorly constructed guidelines.</p>
      <p>I don’t see the sexism in the icon, it doesn’t seem to have a specific gender, maybe that’s just me.</p>
      <p>Tim</p>
