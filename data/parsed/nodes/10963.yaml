    html: <p>Hrant said... <br><i>For screen use I've found that humanist slab serifs with <br>large x-heights work very well. Like Caecilia...</i> <br> <br>as a big fan of Caecilia's functionality, I recently set my  <br>PDF portfolio in it's entirety in this little workhorse. I  <br>very much enjoyed the results (very readable with a  <br>touch of character) and have received complements  <br>from some of the few firms who received it thus far.  <br>the availability of text figures in the standard font (ie,  <br>no search&amp;replace for numerals) and well proportioned  <br>small caps is a big part of the appeal for me.</p>
