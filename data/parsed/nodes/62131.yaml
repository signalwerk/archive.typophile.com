    html: <p>Pixelfonts are mainly used in Flash applications, and Flash does not support Opentype. That’s a bummer. It looks nice, but there’s not much to add to this genre (though the language support might be very useful to someone!). I’d rather go down the road of subpixel rendering and optical sizes for screen use –&nbsp;which really is some sort of hinting when I come to think of it.</p>
