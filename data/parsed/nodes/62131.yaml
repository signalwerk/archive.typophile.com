  html: |-
    <p><strong>CosmeticBit</strong> is a pixel font I’m working on for the last 3 years (yeah! pretty slow). What make it different (or try to), from other pixel fonts is make it have OpenType features, such as subscripts, superscripts, ligatures and, at least, have all European alphabet characters. If you want to have a go, drop me a line:<br>
    felipe [at] sugarcaned.com.</p>
    <p></p><div class="imageWrap"><img src="/files/cosmeticbit-regular_4334.gif"></div><br>
    <div class="imageWrap"><img src="/files/cosmeticbit-bold_6651.gif"></div><br>
    <div class="imageWrap"><img src="/files/cosmetic-features_5298.gif"></div><p></p>
