    <p>Hi Everyone;<br>
    I am having a really hard time with a combination of typefaces. </p>
    <p>Here is the problem:</p>
    <p>I'm doing a website for a client (photographer).</p>
    <p>Logo for client is in Engravers gothic (similar to the Marc Jacobs logo) - it has a fairly strong presence on the page. The overall look for the site is clean and elegant. Lots of white space with some image-heavy sections.</p>
    <p>So I need to lay out the navigation and text for the site - but I'm having a hard time figuring out what typeface will work on the page with the strong presence of Engravers Gothic. This is an impossible typefact to work around!</p>
    <p>Does anyone have a suggestion for navigation and body copy text that won't clash with the somewhat extended look of the Engravers font - without actually setting the nav items and copy in an extended typeface? (I think a whole paragraph in an extended face - or all set in Engravers (which is all caps) would look awful.)</p>
    <p>I'm not adverse to using serif - just think a san serif look on the web is cleaner and more readable.</p>
    <p>I mean, can I use Helvetica? Will something like Helvetica completely wreck the elegance of Engravers Gothic?</p>
    <p>I'm confounded.</p>
    <p>Thanks.</p>
