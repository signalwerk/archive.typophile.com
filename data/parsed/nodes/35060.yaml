    html: <p>I would avoid the serif. They just don't work well on the web. Helvetica is also better in print than on the web, IMO. You could test with both Verdana and Trebuchet to see which of these designed for the web fonts work best. Manlio is correct in that you are limited in options ... many people will not have Helvetica on their system, and might get Times as a default on an HTML page. The two fonts I mention are options not for their beauty, but because they are on pretty much everyone's system.</p>
