      <p>I have an issue with the marriage of the 2, both symbol and typography. It would seem that the smooth curvaceous lines of the whales, mixed with the stern upright and sharp typography, present an uncomfortable match. </p>
      <p>Perhaps one way of unifying the two would be to add some treatment to the crossbars of the 'H' and 'A' to bring some of them smooth abstract lines in to the typography to have more of a unity between the two.</p>
      <p>That said, it certainly has the potential to be a good marque.</p>
