      <p>Quick question: when folks are saying "humanist" type, are they thinking more modern sans type, or traditional, Venetian serif?  If they mean the latter, I agree; if they mean the former, I don't.  The mark needs to communicate a sense of time-honored craft, which fits more with the Venetian-style humanist fonts, if you ask me.  Any opinions?</p>
      <p>--<br>
      Nick Hladek</p>
