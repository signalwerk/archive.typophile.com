      <p>Humanist is usually in reference to a looser, more natural, almost hand-drawn look to a font. Closely associated with humanist sans-serifs which are different than the rigid, mechanical forms of Geometric and Grotesque Sans-Serifs.</p>
      <p>In this instance, they're probably referring to a font that has more personality, than the cold, mechanical face you've used. While the face you choose does retain at timely classical, almost regal style, it's not very personable.</p>
