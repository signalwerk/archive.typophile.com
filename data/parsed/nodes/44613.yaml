    html: "<p>First off, thank you everyone for your very helpful comments.</p>

      <p>@eeblet:  Your advice for working with line weights is well taken.  I started from a sketch, but midway through the digital process I did sense that humpback whales might be better and if this direction turned out to be garbage, I didn't want to have spent precious time fine-tuning lines for a direction I would ultimately abandon.  Also, the whale : Whelan link is coincidental; should I steer the client away from what may possibly come across as a hackneyed phonemic association?</p>

      <p>@Paul, BigWave: Basically, the client really likes whales, and he's kind of a crunchy, Grateful Dead type of guy.  I think it suits his personality well, and since partly he's selling himself with this logo, I think it fits.  His shop is in Northern California (about 2 hours north of San Francisco) and there is a considerable amount of whale-watching in the coastal part of the county, so I think the whales make sense geographically as well.</p>

      <p>@ellason: \x10Yeah, I notice the goofy smile, too.  If you ask me, that's the problem with these damned porpoises; (to me, at least) they all look like that have a stupid grin.  Again, another reason to try out a humpback whale, since they have less of a scoopy, smiley thing going on up front.</p>

      <p>I'll return once I integrate and elaborate.</p>

      <p>--<br>

      Nick Hladek</p>"
