    html: <p>You might want to put "Borderlands" right on the edge of the card (the border, you might say), maybe even let a little get cut off. Make it nice and big.  <br> <br>You might also want to play with putting the 4 names along the various diagonal axes suggested by the illustration.  <br> <br>And while I presume there will be more complete information on the other side of the card, it wouldn't hurt to put the place and maybe the dates right on the front. Maybe somebody will post it on their door, and you want the reader to know where to go!</p>
