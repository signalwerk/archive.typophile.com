    <p>I would be delighted if i can get some feedback on this design. It is a postcard to announce an upcoming sculpture exhibit that focuses on landscape/building. The design is approved but i think the forum can make it better.  The idea is to suggest spatial depth, implied movement, transgression of boundaries or edges. Thanks!</p>
