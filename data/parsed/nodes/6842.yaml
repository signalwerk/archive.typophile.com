    html: <p>I guess this would have gone to press now, but was this a two spot colour job? Judging by the PDF, the type and cream background was produced using two spot inks, but the gradient was CMYK process, which would add four extra plates I assume hadn't been costed for. I'd guess the printer's problem wasn't a technical one. <br> <br>To acheive that effect, you'd need at least three plates/inks (black, brown and yellow). You would have to overprint a black gradient over the brown solid. <br> <br>Oh, and I personally prefer the type size and positioning they chose.</p>
