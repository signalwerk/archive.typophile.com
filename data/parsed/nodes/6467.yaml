    html: "<p>\"True\" bitmap fonts (either stand-alone like FON or NFNT, or embedded like in a TT font) have sort of become bastard children, especially on the Mac side. Your best bet is to make what are called pixelfonts: outline fonts that mimic a bitmap font when used at a certain single point size. They contain blocky paths that snap to the \"intended grid\", causing the outlines to render out exactly as the bitmaps would be. They're supported better than true bitmap fonts because the OSes can't tell they're anything besides outline fonts and hence can't discriminate against them. <br> <br>Note: another option is to use hinting to get an outline font to render well onscreen, but that's a lot more work, although it allows a single font file to address more than one size. <br> <br>-- <br> <br>If your application is narrow enough to accomodate true bitmap fonts however, you can either use BitFonter to generate a FON* file (Adam, is that a supported format?), or if you're stuck with Fontographer you can generate a BDF, embed it into a dummy (or even legit) TrueType font using the SBIT utility (free from MS), and use that TT file. <br> <br>* There are cheaper options to do this than BitFonter (possibly including other Pyrus products), but BF is the most complete, powerful true bitmap font product out there. <br> <br>If you get stuck, and you have a budget for consulting, give me a ring, since I'm in LA too.  :-&gt; <br>818.507.6907 <br> <br>hhp</p>"
