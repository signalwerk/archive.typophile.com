    html: <p>What's Fontographer?  <br> <br>If at all, BitFonter should probably be your choice for bitmap fonts (<a href="http://www.fontlab.com/html/bitfonter.html" target="_blank">http://www.fontlab.com/html/bitfonter.html</a> ) as it supports the widest range of bitmap font formats. However, I think most bitmap fonts work on screen, but not necessarily in print.  <br> <br>Adam</p>
