  html: "<p>Hey there! <br> <br>Forgive any noobie questions, but I'm at a bit of a loss and I don't know where to turn... Here's my situation: <br> <br>I work for a book publishing company. We've set up a system where researchers enter information into an online database which we can then export, import into Quark, run some formatting programs, and have a fully-formatted book. The only thing that's holding us up is handling icons.  <br> <br>Currently, we have to hand-place icons in the book. I would like to fully-automate the process by creating a custom font that has these icons in it. Then all I'd have to do is have the database spit out a string of letters and the row of icons would pop up, correctly spaced and formatted. <br> <br>If the icons were vector, I don't think I'd have any troubles. However, since the icons are hand drawn and do not lend themselves to vector design, I need to do them as bitmaps. Here's where I'm running into troubles. <br> <br>I'm using Fontographer, and I've figured out how to create the necessary bitmap version of the icons, but whenever I export the font and try to use it, the bitmap doesn't show up. It's as if the program is looking for a vector version of the font that doesn't exist and won't see the bitmap version. <br> <br>So basically my question is: is there any way to create a bitmap-only font using Fontographer? <br> <br>Thanks very much! <br> <br>--eric</p>"
  html_clean: "<p>Hey there! <br> <br>Forgive any noobie questions, but I'm at a bit of a loss and I don't know where to turn... Here's my situation: <br> <br>I work for a book publishing company. We've set up a system where researchers enter information into an online database which we can then export, import into Quark, run some formatting programs, and have a fully-formatted book. The only thing that's holding us up is handling icons.  <br> <br>Currently, we have to hand-place icons in the book. I would like to fully-automate the process by creating a custom font that has these icons in it. Then all I'd have to do is have the database spit out a string of letters and the row of icons would pop up, correctly spaced and formatted. <br> <br>If the icons were vector, I don't think I'd have any troubles. However, since the icons are hand drawn and do not lend themselves to vector design, I need to do them as bitmaps. Here's where I'm running into troubles. <br> <br>I'm using Fontographer, and I've figured out how to create the necessary bitmap version of the icons, but whenever I export the font and try to use it, the bitmap doesn't show up. It's as if the program is looking for a vector version of the font that doesn't exist and won't see the bitmap version. <br> <br>So basically my question is: is there any way to create a bitmap-only font using Fontographer? <br> <br>Thanks very much! <br> <br>--eric</p>"
