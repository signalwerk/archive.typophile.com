      <p>SPECIALS does look a lot like Helvetica Inserrat. Bear in mind this is pre-digital (I have that album on vinyl!)</p>
      <p><a href="http://www.myfonts.com/fonts/linotype/helvetica-inserat/" title="http://www.myfonts.com/fonts/linotype/helvetica-inserat/">http://www.myfonts.com/fonts/linotype/helvetica-inserat/</a></p>
      <p>TROJAN reminds me of Fashion Didot but it's not an exact match. There are a lot of fonts like that in the original Solotype and Photolettering catalogs - but many not digitized.</p>
      <p><a href="http://www.myfonts.com/fonts/bagraphics/fashion-didot/" title="http://www.myfonts.com/fonts/bagraphics/fashion-didot/">http://www.myfonts.com/fonts/bagraphics/fashion-didot/</a></p>
