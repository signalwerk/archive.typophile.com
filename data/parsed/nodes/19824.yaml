      <p>Atlantic: looks hand drawn for sure</p>
      <p>2 Tone could be Helvetica Inserrat or another Helvetica (the Specials part, but not the 2 Tone part - that is not a Helvetica 2)</p>
      <p>Trojan - I think also hand drawn - RECORDS is more condensed than TROJAN and that R has been customized for sure.</p>
