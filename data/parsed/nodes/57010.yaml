    <p></p><div class="imageWrap"><img src="http://typophile.com/files/singularity_4065.png"></div><br>
    <em>Shown above: Singularity and Singularity Ligatures</em><p></p>
    <p>I'm finally pulling the trigger on something I've been working on in my spare moments. What can I say? I love a gnarly ink trap. </p>
    <p>It's a free download from Fontstruct. Here are the links:</p>
    <p><a href="http://fontstruct.fontshop.com/fontstructions/show/155435" rel="nofollow">Singularity</a> - Base font; 206 characters<br>
    <a href="http://fontstruct.fontshop.com/fontstructions/show/167412" rel="nofollow">Singularity Ligatures</a> - 120+ Ligatures<br>
    <a href="http://fontstruct.fontshop.com/fontstructions/show/167071" rel="nofollow">Singularity Chunk</a> - with even gnarlier ink traps; 206 characters</p>
    <p>Enjoy! Let me know what you think.</p>
