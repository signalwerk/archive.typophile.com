    <p>I'd like to print out samples of all the fonts in my local collection so I can throw them up on a wall. Ideally I would have control over what the sample text is and how many fonts are displayed on a single page.  </p>
    <p>Is there any OSX software that has this feature or a stand-alone utility that does this?</p>
    <p>Thanks ahead of time.</p>
