    <p><a href="http://www.typedesign.info" target="_blank" rel="nofollow">The Type Design Directory</a></p>
    <p>A steadily growing directory and 'linkfarm' of (European) typography and type design related sites. Foundries, Designers, Distributors and much, much more.</p>
    <p><em> &gt; <a href="http://www.typedesign.info" target="_blank" rel="nofollow">www.typedesign.info</a></em></p>
    <p>( 'Shameless Self Promotion', but maybe worth a visit. 'The TypeDesign.eu Directory' is a project I recently started, collecting links to European type related sites. I am pretty sure that there still are quite a few sites missing, so if you notice / find a site that should be in there, please let me know. Site submissions are more than welcome. :)</p>
