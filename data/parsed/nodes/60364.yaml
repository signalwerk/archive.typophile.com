    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 27.Jul.2009 2.58pm </div>
      <p>This gorgeous font family, designed by Pilar Cano, is a gentle typeface, humanistic in concept yet with a contemporary feel, where softness and fluidity play a very important role. Originally intended for art, design and architecture books, Edita can graciously work alongside photographs and images alike, producing an amazing synergy. Furthermore, Edita is a legibility workhorse, whether it is used in a few paragraphs or in a 600-page novel.</p>
    <p>Available exclusively at our online store. (<a href="http://www.type-together.com/urlParser.php?word=Edita" title="http://www.type-together.com/urlParser.php?word=Edita">http://www.type-together.com/urlParser.php?word=Edita</a>)</p>
    <p></p><div class="imageWrap"><img src="/files/edita_5047.gif"></div><p></p>
