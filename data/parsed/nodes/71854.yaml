    <p>Hey there,</p>
    <p>First of all, sorry if this is not in the correct forum. I figured it to be the most appropriate place..</p>
    <p>I love the British Airways font (Mylius). Naturally, it's not available to license. I wondered if anybody has any ideas of a similar font that I can purchase?</p>
    <p>Thanks in advance for any suggestions!</p>
    <p>Best,<br>
    Asif</p>
