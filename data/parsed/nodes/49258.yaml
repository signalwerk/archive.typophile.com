    <div class="info">Submitted by <a href="/user/110" title="View user profile.">Bald Condensed</a> : 9.Sep.2008 6.10am </div>
      <p>For Immediate Release<br>
    San Francisco, USA - September 9th, 2008</p>
    <p>From the mind of internationally renowned type personality <a href="/wiki/Erik%252BSpiekermann" class="wiki">Erik Spiekermann</a> comes the new and improved <a href="http://fontfeed.com/archives/welcome-to-the-fontfeed/">FontFeed</a>. Once a part of the FontShop.com website, the revamped font blog will now be a separate entity with its own website and address. It combines the creative forces of original FontFeed author and <a href="http://typographica.org">Typographica</a> editor <a href="/wiki/Stephen%252BColes" class="wiki">Stephen Coles</a>, prominent design writer <a href="/wiki/J%2525C3%2525BCrgen%252BSiebert" class="wiki">Jürgen Siebert</a> of <a href="http://www.fontblog.de/">Fontblog.de</a>, and <a href="/wiki/Yves%252BPeters" class="wiki">Yves Peters</a> of <a href="http://www.fontshop.be/">Unzipped</a> and <a href="http://www.typographer.org/">Typographer.org</a>.</p>
    <p>In early 2008, Erik Spiekermann had a vision – gather a number of heavyweight type bloggers and start up an “überblog” squarely focused on typography and related subjects. Lending the type community a powerful voice, the outlet will bridge the gap between font users and font suppliers. Content will include typography tips and tutorials, recommended fonts, type reviews and bits of (typo)graphic design from across the globe. The articles should spark discussions and initiate a valuable and lasting discourse between type enthusiasts and professionals. Sponsored by FontShop International, it will nonetheless be an independent voice, free of any commercial restraints.</p>
    <p>Spiekermann didn’t need to look far for his contributors. FontShop.com already hosted the original FontFeed, edited by Stephen Coles. Coles rose to prominence through Typophile, the online community of type enthusiasts, and as editor of Typographica.org, the influential journal of typography featuring news, observations, and open commentary on fonts and typographic design.</p>
    <p>The second contributor is even closer to home. Jürgen Siebert – co-founder of German graphic arts magazine PAGE – edits Fontblog.de, an online journal of design, typography and media which recently entered the Top 20 in the German blog charts. The final piece of the puzzle is Yves Peters, who writes his Bald Condensed type reviews on Typographer.org (listed in UK magazine MacUser’s “Secret Mac sites — 50 hottest web links that will keep you ahead of the crowd”)  and edits Unzipped, the blog on the FontShop BeNeLux home page (<a href="http://www.fontshop.nl" title="www.fontshop.nl">www.fontshop.nl</a> or <a href="http://www.fontshop.be" title="www.fontshop.be">www.fontshop.be</a>).</p>
    <p>The new FontFeed can be found at its new address: <a href="http://www.fontfeed.com">www.fontfeed.com</a>. It will feature stand-alone articles and recurring topics from Stephen Coles and Yves Peters, with English translations of selected posts by Jürgen Siebert, effectively joining three top type bloggers on one single online journal.</p>
    <p><strong>About Erik Spiekermann</strong><br>
    <em>Prof. Dr. Erik Spiekermann is an information designer, type designer and author of books and articles on type and typography. In 1979 he founded MetaDesign and built it into Europe’s largest design studio until his departure in 2001. In 1989 he started FontShop/FSI, a company for production and distribution of electronic fonts. With his partners at SpiekermannPartners (offices in Berlin, London and San Francisco), he works for major international clients including Bosch, Deutsche Bahn (German Railways), Pioneer Investment, Messe Frankfurt, Nokia, Birkhäuser Verlag Basel.</em></p>
    <p><strong>About Stephen Coles</strong><br>
    <em>Stephen Coles is Type Director at FontShop USA. Besides editing The FontFeed, he also writes copy, designs typeface showings, initiates and maintains foundry partnerships, provides clients with font selection and identification research, art directs web interfaces, and plans marketing strategy. He contributed to the most recent edition of FontBook, adding 4,000+ cross-references to the digital typeface compendium.</em></p>
    <p><strong>About Jürgen Siebert</strong><br>
    <em>Chief Marketing Officer of FontShop AG Jürgen Siebert is co-editor of FontBook – dubbed the Bible of digital typefaces – and a member of the FontFont Typeboard. Since 1997 he has been responsible for FontShop Germany’s TYPO Berlin, arguably the largest annual design conference in Europe.</em></p>
    <p><strong>About Yves Peters</strong><br>
    <em>Last month Yves Peters put his graphic design career on the back burner, freeing him to concentrate on his writing and related activities in the digital type business. Yves also is an accomplished drummer with British/Belgian pop/rock band Troubleman. He added the remaining 3,000+ cross-references to the most recent edition of FontBook.</em></p>
    <p><strong>About FontShop International</strong><br>
    <em>Founded by Erik Spiekermann and Neville Brody in 1989, FSI FontShop International is an international developer and licensor of electronic type fonts under its FontFont Library brand (<a href="http://www.fontfont.com" title="www.fontfont.com">www.fontfont.com</a>) which includes more than 4,000 digital fonts created by more than 150 type designers. As well as its FontFont Library, FSI also distributes over 100,000 fonts from more than 65 other foundries at www.fontshop.com.</em></p>
    <p>FSI Fonts and Software USA, Inc<br>
    149 Ninth Street<br>
    3rd Floor, Suite 302<br>
    San Francisco, CA 94103<br>
    USA<br>
    <a href="mailto:info@fontshop.com">info@fontshop.com</a></p>
