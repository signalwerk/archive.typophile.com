    <p>How I do it? And What is its message?<br>
    This is my Icon, it says QASSIM HAIDER in Arabic language. However, it is based on an old arabic calligraphy, which is (Koffi Morabbat). It is really very old, but the appearance of it looks like the modern arts. Overall, I love this style of typefaces, and I beleive it is so close to my personality.</p>
