      <p>skyfein, there is an easier way to check for duplicates:<br>
      click on  username on top (i.e. Posted by "username") and check the recent activity of the user profile.<br>
      The duplicate posts are usually located one after each other.</p>
      <p>I agree that the forum design is faulty. I already proposed, if the forum-software allows specific permissions per user group, to forbid  normal users (non admins) to post new topics in the FAQ &amp; Solved sections and allow them only in the main Type ID Board.<br>
      Posting a reply to an existing topic should be allowed for all, and admins off course will have full access on posting both new topics and new replies in any category/forum.</p>
      <p>I don't know if this can be done with the current forum software, but it will save a lot of energy of many people.</p>
