    html: <p>That looks lovely, Mark, but I wonder how well such a form would adapt to other contrast models? With a translation (broad-nib) model, you would get a lot more heavy strokes through the loops. As a form in this particular style, I think your 'rough sketch' is exemplary, but I'm left wondering what forms would be appropriate for e.g. a renaissance oldstyle type, a neo-grotesque sans serif, etc.</p>
