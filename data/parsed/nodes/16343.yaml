    html: |-
      <p>You have to consider the ease of writing these symbols; obviously if the symbol is harder to write than the acronym, then it wouldn't be widely used. Usually this means one continous motion going in one direction (left loop, left to right) and can't be too different than how language (Western) is written. For LOL, i would suspect two quick loops, punctuated with a dot to close. For WTF, 3 spikes, with a quick line and a dot; i was also thinking perhaps the dot would go away altogether after a while and just have a single bar at top of the "w".</p>
      <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150316235441im_/http://typophile.com/files/lol_wtf.gif"></div><p></p>
    html_clean: |-
