    html: <p>I think it's not supposed to be a ligature so much as a kind of evolved, abstract shorthand symbol that has become a sign distinct from the letters from which it is derived. The at sign comes from English (I think) and the ampersand from Latin, so language would not necessarily be relevant for such a thing. It's all rather academic, anyway. If one tried to introduce the at symbol or the ampersand now I don't imagine that it would catch on.</p>
