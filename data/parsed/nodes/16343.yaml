    html: |-
      <p>Hello guys, I am just discovering this great forum and already want to apologize for my bad english (sorry if I make mistakes).<br>
       I am french and have been practicing calligraphy for 5 years but using computers for only 2 years (!). I simply don't know WTF to do to make pictures appear in my message, I almost tried everything &amp; hope you'll get them.</p>
      <p> This WTF exercise is particularly interesting and funny.<br>
       Here is what I would propose:</p>
      <p> - first, an exercise of simplifying the form into one single line, then drawing it faster and faster until it becomes something new...<br>
      <img src="http://i34.photobucket.com/albums/d133/Damidoux/Whatzeuf.jpg" alt="Image hosted by Photobucket.com"><br>
       <a href="http://i34.photobucket.com/albums/d133/Damidoux/Whatzeuf.jpg" title="http://i34.photobucket.com/albums/d133/Damidoux/Whatzeuf.jpg">http://i34.photobucket.com/albums/d133/Damidoux/Whatzeuf.jpg</a></p>
      <p>The final sign looks like a D if rotated clockwise! Calligraphy on a computer is something strange because feelings are lost, but this first experience is pretty amusing.</p>
      <p> - then, a kind of logo work done in happy orange to go with the meaning:<br>
      <img src="http://i34.photobucket.com/albums/d133/Damidoux/Whatzeuf2.jpg" alt="Image hosted by Photobucket.com"><br>
      <a href="http://i34.photobucket.com/albums/d133/Damidoux/Whatzeuf2.jpg" title="http://i34.photobucket.com/albums/d133/Damidoux/Whatzeuf2.jpg">http://i34.photobucket.com/albums/d133/Damidoux/Whatzeuf2.jpg</a></p>
      <p>Please tell me which you like the most (my favourite tend to be number 3)</p>
      <p>Hope you'll enjoy &amp; even if my culture in modern typography is poor, I truly appreciate letterworks.</p>
      <p>Thanks for reading.</p>
    html_clean: |-
