    html: |-
      <p>What is the Unicode index for a www ligature? </p>
      <p>This was waaaaaaay back in 1999, when we used to use those random glyph slots for ligatures and other fun stuff, instead of random mathematical symbols: ∑ ∏ ∂ ∆ ¬ Ω √ ∫ ◊</p>
      <p>Thanks to pop culture, we habitually included the π - thanks to Darren Aronofsky's film - and the µ - thanks to the early breakbeat of µ-ziq - in our types. If some hot rapper comes up named "Ωman", I'm sure that we'll start to see the Omega everywhere.</p>
      <p>In a general purpose font - read: created for graphic designers doing general design work, not specialists setting math textbooks, which require far more specialised glyphs than those listed above - it seemed perfectly reasonable to fill those slots with something fun and potentially useful. And the design of the "w" lent itself to this treatment.</p>
      <p>A couple of the Thirstype fonts from this same period featured the glyph then being used by Prince as his name.</p>
