    html: |-
      <p>Part of my thinking is that it would be like the at sign, which for a long time had pretty much only one model based on the 19th century modern style. The at sign has that hairline loop in the early model which leads to varying solutions when type designers try to adapt it to other styles. In some cases, like adapting the Euro to older face, you get to rewrite history in a sense, and try to imagine how it would have been done had it existed. The ampersand is a good example of the range of solutions which are possible, not all of which are fully embraced by type users (e.g., the original and later Univers ampersand).</p>
      <p>Just for fun, here's a Jenson-like variation:</p>
      <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150316235441im_/http://typophile.com/files/wtf-os.png"></div><p></p>
    html_clean: |-
