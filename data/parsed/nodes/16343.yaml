  html: '<p>Hey all. I had this weird thought: If, in some bizarre alternate history, chatspeak abbreviations like "LOL" had become popular long before there were computers and character sets, they might have, over time, become new symbols, like "et" became "&amp;" and "at" became "@". What might they look like?</p>'
