      <p>It's a funny exercise, because a good end result might not be identifiable in its evolved state. That's why I was throwing up some samples of early ideas, thinking they would be refined through collaboration. </p>
      <p>Mark's work is very refined, and the balance is off in that the W anchors his character like the A anchors the @.</p>
      <p>These would make funny t-shirts.</p>
