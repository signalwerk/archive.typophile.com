      <p>Pardon my pedantry, but it seems that every time people talk about a face working well with another they say "compliment", when it should be "complement".</p>
      <p>***</p>
      <p>It's a tall order to ask any face, especially a sans serif, to work as text with medium and bold weights of LG, without being overpowered. Perhaps Antique Olive or Eras.</p>
