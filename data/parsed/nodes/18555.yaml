    html: <p>FWIW, I don't think it's the large x-height that makes AG and LG harder to read, it's the monotonous geometry. The other problem is the high contrast between the size of the counters to the size of the sidebearings. LG fares a bit better because the serifs push the characters apart some.</p>
    html_clean: <p>FWIW, I don't think it's the large x-height that makes AG and LG harder to read, it's the monotonous geometry. The other problem is the high contrast between the size of the counters to the size of the sidebearings. LG fares a bit better because the serifs push the characters apart some.</p>
