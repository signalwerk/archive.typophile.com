    <p>Hello,</p>
    <p>A friend is working with an architect to restore a train station. The original signage is circa 1906. (The EXIT sign at the bottom is from a renovation, circa 2000.) The closest match I've found is Anziano Pro. With the understanding that an *exact* match is highly unlikely, do you have any other suggestions for a match? Thanks in advance.</p><div class="imageWrap"><img src="http://typophile.com/files/Signs_5225.jpg"></div><p></p>
