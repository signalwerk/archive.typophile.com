    html: <p>Yes, you won't find anything very similar because these were made by hand or with molds that were not based on any printed typeface and thus not digitized as a font available today. Your best bets are in the "<a href="http://www.fontshop.com/fontlist/alternatives/trajan/?affid=99346" rel="nofollow">inscriptional</a>" or "<a href="http://www.fontshop.com/fontlist/genres/titling_thorn_serif/?affid=99346" rel="nofollow">glyphic</a>" categories. <a href="http://www.fontshop.com/fonts/downloads/shinntype/beaufort_pro_family/?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=96&amp;sample_text=KING%20ST&amp;affid=99346" rel="nofollow">Beaufort</a> may be closest.</p>
