      <p>Neil,</p>
      <p>One of the big differences is that whereas the various weights of Helvetica were drawn by different type designers at different times, Helevetica Neue was conceived as a large family from the get-go (it also has more weights than Helvetica), and has consistent variations from one weight to the next. The series of weights are named and organized in a manner similar to the Univers family; that is, using two-digit numbers (i.e., 55=Roman, 65=Medium, 75=Bold, etc. Numbers ending in 5 are upright weights; those ending in 6 are Italics; numbers ending in 7 are Condensed; numbers ending in 3 are Extended).</p>
      <p>More info here...<br>
      <a href="http://www.myfonts.com/fonts/linotype/neue-helvetica/" title="http://www.myfonts.com/fonts/linotype/neue-helvetica/">http://www.myfonts.com/fonts/linotype/neue-helvetica/</a></p>
      <p>...and here:<br>
      <a href="http://en.wikipedia.org/wiki/Helvetica" title="http://en.wikipedia.org/wiki/Helvetica">http://en.wikipedia.org/wiki/Helvetica</a></p>
