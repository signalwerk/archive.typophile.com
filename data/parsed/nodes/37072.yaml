    <p>Hello Typophiles,</p>
    <p>We have numerous enquiries from customers who are using old style Helvetica.  They in turn are then advised by their design agency's to use Neue Helvetica instead, but then they always ask the question about what are the differences?  I am sure to the untrained eye the fonts do look very similar, but I am hoping that the Typographic community here can expand further.</p>
    <p>What I am particularly interested in is</p>
    <p>Difference in character shapes<br>
    Any difference in kerning<br>
    Any pro's/cons of upgrading to Neue Helvetica.</p>
    <p>I have searched the web for answers, but I would feel more confident in the information that I can receive here.</p>
    <p>I thank you for your time.</p>
    <p>Kind regards<br>
    Neil</p>
