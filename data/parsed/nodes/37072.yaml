      <p>&gt; the various weights of Helvetica were <strong>drawn</strong></p>
      <p>The various weights of "new" Helvetica were not "drawn", but generated mechanically. You can trace this mechanical generation by the foot serif of the right stem of the capital R, comparing them with obtuse and petering foot serifs of old Helvetica.</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/r.gif" title="http://www.sanskritweb.net/temporary/r.gif">http://www.sanskritweb.net/temporary/r.gif</a></p>
      <p>The expression "new" Helvetica was a publicity stunt.<br>
      The "new" Helvetica was definitely not a new design.</p>
