    html: |-
      <p><cite>“Neue” means “new”.</cite></p>
      <p>The only important question is this one:</p>
      <p>Was "Neue Helvetica" ("New" Helvetica) registered as as "new" design at the German design office?</p>
      <p>As only "new" ("neue") designs are eligible for registration, it is forbidden and punishable to cheat the design office by registering a non-new design as "new" design.</p>
      <p><strong>PS added:</strong> I now found out whether the German design office was cheated, but Typophiles prefer publicity (<a href="http://www.helveticafilm.com" title="www.helveticafilm.com">www.helveticafilm.com</a>) to facts.</p>
