      <p>Hi there Neil.</p>
      <p>Linotype had updated the Helvetica family to with the width and weights similar to Univers by Adrian Frutiger.</p>
      <p>There are slight differences between the shapes and Neue always seems to be slightly more rounded with p d q b.</p>
      <p>The tail in t for Neue is slightly longer.</p>
      <p>With your other two queries its probably better someone else handles them.</p>
      <p>David.</p>
