    html: |-
      <p>For me the $100 has been very useful in marketing and promoting my work more than anything else.  For the fee you are able to post your identity work in their galleries and then work posted in a given time period is considered for inclusion in LogoLounge books.  I have work in both of the first volumes.  Art directors, creative directors and potential clients have used the site and books to find their way to me.  The text content is good - but for me that alone would not be enough for me to be a subscriber.</p>
      <p>Jeff Fisher :: Engineer of Creative Identity<br>
      <a href="http://tinyurl.com/5y8bm" rel="nofollow">Jeff Fisher LogoMotives</a></p>
      <p>Author: <a href="http://tinyurl.com/5o7ud" rel="nofollow">Savvy Designer's Guide to Success</a> from HOW Design Books</p>
