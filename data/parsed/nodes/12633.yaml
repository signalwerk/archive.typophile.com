    <p>Are there any Typophiles who are members (past/present) of LogoLounge.com? Have you found the content useful? Is/was it worth the $100 yearly membership?</p>
    <p>I'm an experienced publication designer who's interested in doing more corporate ID work, and wonder if the site would provide useful feedback and inspiration.</p>
