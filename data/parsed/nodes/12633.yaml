      <p>I feel as if I need to clarify a little more.</p>
      <p>If my business were only based upon business identities I would pay to have access to the site. It would be something that I would feel compelled to stay on top of in that way. However, as I find the book to be enough for what I do, I don't pay the subscription. I would, of course, read it if it were free, but sadly it isn't so I have to make a choice.</p>
