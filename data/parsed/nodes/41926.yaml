    <p>So if a person wanted to create a truly authentic spacing setup as was used up until our modern time, how would you go about doing so? For instance, Caslon. An authentic Caslon would never have been kerned, so how would you set up a document so that the <em>spacing</em> was authentic, not just the letterforms?</p>
    <p>Or, what kind of metrics settings would a type designer build into a typeface to do the same thing?</p>
