      <p><cite>So the idea of spaced all caps came about because of spacing issues? That’s an interesting observation.</cite></p>
      <p>Actually it may be a re-invention of the wheel as much as anything. Actual Roman Roman caps were often spaced widely. Jan Tschichold was a big advocate. See </p>
      <p><a href="http://briem.ismennt.is/2/2.3.5a/2.3.5.01.spacing.htm" title="http://briem.ismennt.is/2/2.3.5a/2.3.5.01.spacing.htm">http://briem.ismennt.is/2/2.3.5a/2.3.5.01.spacing.htm</a></p>
      <p>Actually, the old carved letters also had a wider variety of widths than do Caps in the period you are talking about. Look at an E</p>
      <p><a href="http://www.flickr.com/photos/canadianveggie/172779789/in/pool-visible_words" title="http://www.flickr.com/photos/canadianveggie/172779789/in/pool-visible_words">http://www.flickr.com/photos/canadianveggie/172779789/in/pool-visible_words</a></p>
      <p>I think this variance helped to make them read more readily ( more distinctive) when "set" as text. Making Caps whose widths were more similar probably came about as a result of their new use with the miniscule. Which makes me wonder if small cap designs aught to vary their widths more than they usually do...</p>
      <p>What do you think?</p>
