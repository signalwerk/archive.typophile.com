      <p>As the WALTER photo shows, metal type could indeed be "kerned". We spent many an hour with saw and file undercutting parts of metal types so, for instance, that W could rest nicely on the shoulder of the A.</p>
      <p>The cutting had to be precise so the pieces fit together sweetly, lest the kerned part break off during the press run, possibly fouling other parts of the forme.</p>
      <p>A clever Monotype keyboard operator could get the same thing to happen right on the machine, no sawing necessary. I forget how that was done, but I do know that few keyboarders knew the trick.</p>
      <p>Take a look at books designed and printed by Leonard Baskin at Gehenna Press. He'd set dense lines of all caps with never a thought about the wide spaces that come with WA, etc. And I seem to recall that he used the Bembo long-tail R in those settings, too. That's about as "authentic" as you could get. </p>
      <p>powers</p>
