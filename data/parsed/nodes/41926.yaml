      <p>That's my point. If I wanted to create an authentic 17th century newspaper *look*, would simply setting all of the kerning to zero work? </p>
      <p>Possibly for upright Roman faces, but not for italics, since modern metrics have the right sidebearings within the letterform itself. Obviously, except in the cases as mentioned above, NOT something that would have happened on a letter cut into a physical block of metal.</p>
      <p>The sidebearings would have to be bumped to the edges of the letterform itself, NOT something that a modern type designer would want by default in all cases. Hence, the idea of a stylistic set that only effects the spacing, using composite glyphs that vary only in the change of sidebearings and kerning.</p>
