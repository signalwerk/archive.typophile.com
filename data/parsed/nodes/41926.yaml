      <p>&gt;&gt;  I believe that italic hotmetal was cast on oblique type slugs. I think it is the Ludlow machine I see in my mind.</p>
      <p>You are sort of right, Don. The slugs themselves are not oblique. The slug, the underpinning of the line of type cast on a Ludlow, is no different than for roman type. Slugs are 6 or 12 points thick, and they all look the same. So it is not correct to say that the slugs for italic type on the Ludlow are oblique.</p>
      <p>The matrices for italic type are angled, to accommodate the "slant" of the letterforms. All Ludlow italic mats are angled to the same degree. I am not sure if this could allow for varying degrees of slant amongst faces; I never really looked at that.</p>
      <p>There are two ways to set italic. If you are setting a line in all italic, you get out the "italic stick." The ends of the stick are angled the same as the matrices. You place mats in the stick the same as roman mats or dingbat mats, lock the stick, slide it in the machine, click the trigger and get a slug with italic type.</p>
      <p>If you wish to inert an italic word within a roman line—say, a book title or a cuss word—you insert an italic word space fore and aft of the italic. These are "triangular" word spacers. The "flat" side snugs tight with the roman mat ahead of it, and the following edge slants to receive the ital mat. Just the opposite at the other end of the ital sorts. Sometimes this makes for odd word spacing. Sometimes I'd cast two of such a slug and cut the italic out of each, then with the saw adjust the space either side of the ital, generally reducing it, and re-assemble the line.</p>
      <p>Angled mats give Ludlow lines the impression of kerns: look at the italic f in Ludlow Garamond (the basis for Font Bureau's Garamond].</p>
