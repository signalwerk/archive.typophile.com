      <p>The old punchcutters did have kerned parts in their letters. Where do you get the idea that they didn't? 17th century Dutch type had kerning. The 15th and 16th century Italians had it, too, IIRC.</p>
      <p>The Linotype machine didn't really have it, but I think that the Monotype machine did. There came much later anyway.</p>
      <p>Kerning may have been *used* less in the 17th century than it is today (lots of unkerned cap Vs and Ws back then, I think). But kerning wasn't a foreign practice. It was just hard to do, not impossible.</p>
