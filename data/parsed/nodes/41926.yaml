      <p>Personally I think that authenticity in revivals is not a goal worth the effort, and you are going to fall short anyway, as every other 'authentic' revival has. What is worth it is to revive what you find good in a old type, and suit it for modern printing, or the screen, as the case may be. </p>
      <p>On spacing, I don't see any charm in having, eg, your italic caps look like they are in another county from the rest of the word they go with--something you can see in old books. </p>
      <p>Kerning in digital type is a good thing, as Martha would say.</p>
