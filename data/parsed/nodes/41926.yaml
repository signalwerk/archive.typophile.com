      <p>"My reasoning is this: If you’re gonna make a revival typeface, why not recreate the whole thing?"</p>
      <p>"I’d be happy to chat here about other Ludlow questions: we’ve gotten a bit off topic..."</p>
      <p>Not really. You are representing the knowledge Dan's 100% revival would require to properly use such a face.<br>
      So, if you make a face, recreate the whole thing, as metal would have allowed, then one had better recreate the users who could make the best out of it.</p>
      <p>"The sidebearings would have to be bumped to the edges of the letterform itself,..."<br>
      Metal does allow some kerning to occur, you know. It might not last long under tough printing conditions, but letters did and do 'bleed' off the body.</p>
      <p>Cheers!</p>
