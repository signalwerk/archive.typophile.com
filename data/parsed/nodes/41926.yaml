      <p>Thanks, Dan, very much, for giving us that photo. You're better at the web than I.</p>
      <p>What you show here is more than just an italic Ludlow stick. This is an italic LONG stick. There is also a long stick for roman work.</p>
      <p>First the "italic" part. You can see how the ends of the stick are angled so the angled italic mats fit into it. I wrote about that last night.</p>
      <p>Now for the "long" part. Take note of those notches on the upper edge of the stick, and of the pairs of diagonal lines on the bottom edge. Most Ludlow machines were built to cast slugs 22.5 picas long. A few were made to cast 30-pica slugs (American picas). This points to its dominance in news and ad work. But obviously a newspaper will often need heds longer than 22.5 or 30 picas. When that happens, the comp resorts to the long stick. He sets the entire headline, up to about 66 picas in this stick, I think. At those notches he sticks a special spacer, maybe about 5 picas wide. This spacer can go between words or letters, no matter. The spacers allow the comp to insert that stick full of mats into the stick holder 3 times in succession, each time at the "regular" length of 22.5 picas. Once, twice, thrice. Each slug is then 22.5 picas long, and they can then be butted together to set the full-measure hed. At the end of each slug the type is "kerned" (for lack of a better word) out over the end of the slug, and at the beginning of the next slug is empty space to the exact width of the kern, so the join is seamless and not noticeable in the printed line.</p>
      <p>I'd be happy to chat here about other Ludlow questions: we've gotten a bit off topic. If someone wants to start a Ludlow session, do so. &amp; I'd encourage any others who once used Ludlows to join in. I hope I'm not the only one who has used this sweet gizmo.</p>
      <p>SPACED CAPS. I think spacing of all caps (and small caps) came about for two reasons. One is that the massed rectangle of all caps, especially when there are more vertical strokes than rounds or diagonals, is easier to read when some air is introduced. We do this today by adding overall tracking, as when a book's running head is set in spaced smalls. We also can automatically space lines of all-cap or all-smalls on Monotype machines that have a "unit adder" (that ain't a kind of snake). The second reason is aesthetic. Those spaced lines, Monotype or computer, look better if some of the letterspaces are varied a bit so they appear to be equal. With Leonard Baskin, un-spaced all caps was part of his type vision.</p>
      <p>powers</p>
