      <p><cite> &gt; For instance, if you wanted an AW sequence that didn’t have a year’s worth of space between them, you’d have to use a physically different sort, i.e., a logotype or ligature to make up the space between them.</cite></p>
      <p>No, Dan, you'd have to cut some of the body metal away so that the A and W would overlap. (As seen from the link Florian posted.) </p>
      <p>That is, in fact, the original meaning of 'kern' -- a part of the type that extended beyond the body and overlapped with the sort beside it. The verb "to kern" meant to cut away some metal (producing a "kerning" element).</p>
      <p>Some foundry sorts might have been cast with a kern -- e.g., the f might often have a projecting terminal. Linotype could not accommodate any kerned elements, thus the infamous Linotype non-kerning f. Monotype casting, however, could accommodate kerned sorts. </p>
      <p>Naturally, kerned elements could be fragile. And manual kerning (with a kern saw) was time-consuming. So it kerning was employed sparingly.</p>
      <p>But it's not correct to say that it didn't exist.</p>
      <p>-- K.</p>
