      <p>Dan [Gayle] -- Sorry, didn't mean to imply that there were no ligated sorts (or, properly, logotypes). But that was mostly only for Linotype, because the nature of the linecasting technology is such that it cannot accommodate kerns at all. (Since an entire line is cast at once, you can't very well cut kerns manually either.)</p>
      <p>Monotype casts individual sorts and automatically sets them up in a line, and the casting technology could accommodate kerning (although, as Will pointed out, this might take some clever finagling). So generally speaking, logotypes were not provided for the kind of combinations you're talking about. Same for foundry type, I believe.</p>
      <p>There were certain faces in foundry (I don't know about Mono) that would offer special logotype and ligatured sorts, but that was usually for decorative faces, not so much with workhorse text faces. This is not the same as the AW VA AW kind you're talking about.</p>
      <p>Starting around the beginning of the 20th century, Linotype acquired the lion's share of newspaper text market. So, you won't see any kerning in newspaper type. I doubt any of them ever bothered to use logotype or ligatured sorts -- too much hassle on newspaper deadlines. Also, as a consequence, the kind of AW or WA logotypes you're referring to weren't provided for newspaper faces, mostly only some book faces.</p>
      <p><cite> &gt; In any case, I can’t seem to recall where I saw it, but didn’t metal sorts have width sizes for standardization purposes? </cite></p>
      <p>I think you're recalling that Monotype designs were constrained to a unitized width system -- initially 18 units, later 54 units -- where widths were restricted to certain increments of the em.</p>
      <p>Not true of Linotype or foundry type.</p>
      <p>There was a system of "quick-set" types developed by ATF with very restricted, modular widths, and promoted as easier to justify quickly because of the modular nature of line lengths. But I don't think that was very widely embraced.</p>
      <p>-- K.</p>
