    <p><a href="https://www.flickr.com/photos/turetsky-lukyan/14396284564" title="Kalyna_1440x720_02 by Lukyan Turetsky, on Flickr" rel="nofollow"><img src="https://farm3.staticflickr.com/2917/14396284564_855b9e99d8_z.jpg" width="640" height="320" alt="Kalyna_1440x720_02"></a> </p>
    <p>The Kalyna font is interesting with its stylistic implementation through asymmetrical serif. Such design is characteristic for the Ukrainian style. The drawing of the font is based on the sketches of a famous Ukrainian graphic artist of early 20th century Heorhiy Narbut. His work set the whole school in the Ukrainian graphic art and is still very influential nowadays. The font is capital and also includes a set of ornaments in addition the standard set of symbols.</p>
    <p>Buy on <a class="freelinking external" href="http://www.myfonts.com/fonts/2d-typo/kalyna/" rel="nofollow">MyFonts</a> </p>
