    html: |-
      <p>I digitized that a few years ago for some design group or other, I can’t remember who.</p>
      <p>As the original artwork had been lost long ago, I was given a clothing tag which was so degraded, it looked like a 20th generation photocopy. I had to interpret this into something sharp. From this I made an upper case typeface with the logo built-in as 2 keystrokes.</p>
      <p>I know the peak of the A extends up way too far, I couldn’t see the logic of it myself, but the client knows best. So it wasn’t a ’hand job’ after all.</p>
      <p>BTW - Hi Diederik, how you doin’</p>
      <p>Nick Cooke</p>
