  html: |-
    <p>It's been over 10 years now that I have been making and selling my fonts. In celebration of this anniversary, I have created a catalog of my complete retail font library. </p>
    <p>This is no normal type specimen book, though. I wrote a completely original pangram for nearly every font in the catalog. This makes for some interesting reading, so please enjoy!</p>
    <p>I would like to give thanks to Mark Simonson for creating the <a href="http://ms-studio.com/Animation/pangrammerhelper.html" target="new" rel="nofollow">Pangrammer Helper</a> that I used to make my pangrams.</p>
    <p><a href="http://www.madtype.net/pdf/2007_MADType_Catalog.pdf" rel="nofollow">Download the MADType 2007 Anniversary Catalog Here</a>. (PDF, 744 KB)</p>
    <p>Or for more information, please visit <a href="http://www.madtype.net" title="http://www.madtype.net">http://www.madtype.net</a></p>
