      <p>The playful illustration – arguably the strongest part of this logo&nbsp;– is being dominated by a boring "all" sitting on its head. A plain looking "all" doesn't deserve to sit on "out's" head...yet. You could really push this further.</p>
      <p>Try illustrating different people doing activities inside the word "all" as well. Then try it all on one line and see what happens.</p>
