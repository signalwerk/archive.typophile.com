  html: |-
    <p>Hi again, I'm working on an experience company for my final major prject in my current college course, the company offers a wide range of crazy experiences ranging from helicopter flights to bungee jumping, you get the idea.</p>
    <p>After alot of tweaking and playing around with the letters and overal logo I have come up with this design. I know you will probaly say the figures on the letters are too small, where I kind of agree I also think you can make out what they are doing. The colour choice of green is to show the idea of being outdoors and free, I originally used blue but it gave the impression that the company just offeres water or cold base activities.</p>
    <p>Any comments, critisms would be greatly appriciated :)</p>
