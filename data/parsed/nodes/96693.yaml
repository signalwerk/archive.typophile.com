    <p>I am not a typographer, though I've always admired type use from afar. Next week I am going to take one long day to devote to exploring the world of fonts and typography. So, I'm looking for help in making this day a well-spent one. Can anyone offer some essential content, websites, old/new ideas to focus on? (other than this one, or ilovetypography.com)</p>
    <p>If you had one day to explore and discover as much great stuff as possible....</p>
    <p>Thanks!</p>
