      <p>Great idea Carol.</p>
      <p>If I were you I'd start from the ground up: hit the streets. The weather in your parts is looking decent for next week. Get to the largest city within a short drive or train ride (maybe even Buffalo, which once hosted a TypeCon, for a reason) and just roam around (maybe even getting lost for a while) in sponge mode (plus camera). And pick some small local newspapers while you're at it.</p>
      <p>hhp</p>
