      <p>Well, this may be the first day of many spent appreciating type, but this first one is a single-day project I'm doing for work. (We each have been given a mission to take a day, do/learn/experience something we've always wanted to, and then report back on it the next day to our colleagues.) Yes, very good employer.</p>
