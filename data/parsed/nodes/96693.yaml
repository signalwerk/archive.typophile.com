      <p>Read a book.</p>
      <p>Bringhurst, R. (2004). <em>The Elements of Typographic Style</em>. Point Roberts,WA: Hartley &amp; Marks.</p>
      <p>Wandering the streets will probably just bombard you with crappy (and trendy) vernacular typography. Typographers are notorious for taking “ooo, look at the rough type I just saw” pictures. Myself included: (they came from a lecture in Chicago, and my friend’s farm in Nova Scotia).</p>
      <p><a href="http://readthetype.com/look/" title="http://readthetype.com/look/">http://readthetype.com/look/</a></p>
      <p>You might find some other readings of interest in the Literature section of my “website,” but it has a scientific slant:</p>
      <p><a href="http://readthetype.com/literature/" title="http://readthetype.com/literature/">http://readthetype.com/literature/</a></p>
    html_clean: |-
