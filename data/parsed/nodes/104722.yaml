      <p>Decided to treat the 2 fonts separately, look too different for me.<br>
      Milano: close are <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/neuzeit-grotesk" rel="nofollow">(DIN) Neuzeit Grotesk</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/geometric-706" rel="nofollow">Geometric 706</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/proxima-nova" rel="nofollow">Proxima Nova</a> Extra Condensed (playing with versions to get the single storey /a)<br>
      PIANTA * MAP * PLAN (and the rest except MILANO): can't find a font that could match both lower and uppercases. Here are some you may find interesting though: <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/gestalten/planeta_ot/ot_ps" rel="nofollow">Planeta</a> (Plakat, /M and /I off), <a class="freelinking external" href="http://www.railfonts.com/cgi-bin/font_shop/fontshop.cgi?ACTION=enter&amp;thispage=page10.html" rel="nofollow">CityOf</a> (no lowercases), <a class="freelinking external" href="http://www.myfonts.com/search/erbar" rel="nofollow">Erbar</a> (Neo Mini but /a off), <a class="freelinking external" href="http://www.myfonts.com/search/monod" rel="nofollow">Monod</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/talbot/kessel-105" rel="nofollow">Kessel 105</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/neuzeit-grotesk" rel="nofollow">(DIN) Neuzeit Grotesk</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/geometric-706" rel="nofollow">Geometric 706</a> (not enough naive but family could work for both "Milano" and "PIANTA..."), <a class="freelinking external" href="http://www.typographyserved.com/gallery/ZIAMIMI-DAMIER-Free-Font/4154989" rel="nofollow">Ziamimi</a> (no lowercases), <a class="freelinking external" href="http://www.myfonts.com/fonts/thinkdust/nanami" rel="nofollow">Nanami</a> (/M off), <a class="freelinking external" href="http://www.myfonts.com/fonts/i-can-be-your-type/damian" rel="nofollow">Damian</a> (/I and /G off mainly), <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/ealing" rel="nofollow">Ealing</a> (/M off), <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/report-school" rel="nofollow">Report School</a> (/M and /I off), <a class="freelinking external" href="http://www.tendollarfonts.com/alumia" rel="nofollow">Alumia</a> (no lowercases), <a class="freelinking external" href="http://www.behance.net/gallery/Throne-Gothic-Typeface/8841207" rel="nofollow">Throne Gothic</a> (no lowercases, used to be sold at <a class="freelinking external" href="http://www.tendollarfonts.com" rel="nofollow">Ten Dollar Fonts</a>), <a class="freelinking external" href="http://www.myfonts.com/fonts/hvdfonts/diamonds" rel="nofollow">Diamonds</a> (no lowercases), <a class="freelinking external" href="http://www.myfonts.com/fonts/words-pictures/dupe" rel="nofollow">Dupe</a>, <a class="freelinking external" href="http://www.tendollarfonts.com/leberkaas-grotesk-typeface" rel="nofollow">Leberka</a> (/G off), <a class="freelinking external" href="http://www.myfonts.com/fonts/quadrat/toronto-subway" rel="nofollow">Toronto Subway</a> (/M and /G off), <a class="freelinking external" href="http://swisstypefaces.com/fonts/euclid-bp/all-styles" rel="nofollow">Euclid</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/gautier/maax" rel="nofollow">Maax</a> (playing with alternates /<a class="freelinking external" href="http://www.myfonts.com/fonts/gautier/maax/black/glyphs.html#glyphs/556264/353" rel="nofollow">A</a>, /<a class="freelinking external" href="http://www.myfonts.com/fonts/gautier/maax/black/glyphs.html#glyphs/556264/362" rel="nofollow">M</a> and/<a class="freelinking external" href="http://www.myfonts.com/fonts/gautier/maax/black/glyphs.html#glyphs/556264/373" rel="nofollow">a</a>, /G still off)</p>
