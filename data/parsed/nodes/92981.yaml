      <p>Today I would like to introduce my newest typeface, it is called »Fiorentina«. The name implies flowery as well as Florence. I designed it after buying one of those incredible Florentine wrapping papers at my favourite paper-shop in Munich.  </p>
      <p>The font turned out to be an ecstatic, abundant, embellished script in the Renaissance tradition. It could have been made for the Medicis or Sforzas. I designed it completely new. </p>
      <p>I gave it many different swashes and understrokes, alternate upper- and lowercase characters, 659 glyphs in all! The font has all letters and accents for for basic English, the Central European languages, Baltic, Roumanian and Turkish.  </p>
      <p>Fiorentina is one of the most beautiful typefaces I ever designed. Your designer of beautiful typefaces Gert Wiescher</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Amore_6032.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Benvenuti a Firenze_5311.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Fiorentina_3598.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Saluti di Firenze_4571.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Tuscany_6269.jpg"></div><p></p>
