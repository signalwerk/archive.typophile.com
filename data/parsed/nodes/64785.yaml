      <p>James you’re not correct at all-Scanfont (nor indeed any scanning software) was not involved in the construction of Adantine, nor has it been involved in the vast majority of Greater Albion’s faces. In fact the only ones where a measure of Automatic tracing of curves was used (not unedited) were ’Tectura’ and the holiday dinbats where we was looking for a deliberately hand drawn look, and this in conjunction with my own artwork worked best as a way to achieve it.  Greater Albion has no interest in sticking a typeface specimen in a scanner and calling the result a font.</p>
      <p></p><div class="imageWrap"><img src="/files/Hand Drawn_4031.png"></div><p></p>
