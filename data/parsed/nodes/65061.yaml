  html: |-
    <p>Is anyone able to identify what the model might be for this typeface is? It comes from the “Doctrina Christiana” published in 1593 in Manila, the Philippines. The book was a bilingual primer of Catholic doctrine in Spanish and Tagalog in this typeface, and Tagalog in the indigenous Baybayin script. The printing was done not with moveable type but with woodblocks in the Chinese style, cut by a Chinese convert. I assume the Latin typeface used here – or typefaces, since there are also decorative black letter caps set off from the main text – must be based on something from Spain or perhaps from Italy. Any ideas? </p>
    <p>Here’s a link to the Project Gutenberg online book:</p>
    <p>http://www.gutenberg.org/etext/16119</p><div class="imageWrap"><img src="/files/dc020_6385.gif"></div><p></p>
