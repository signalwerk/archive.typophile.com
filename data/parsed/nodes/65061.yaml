    html: <p>Thanks, Michael, for the pointer. On a hunch, I found illustrations online of Mexican versions of the Doctrina, with similar, but not identical typefaces (done in movable type). The Mexican versions are somewhat more broken and rectilinear than the forms of the Philippine Doctrina, whose letterforms are more humanist in appearance.</p>
