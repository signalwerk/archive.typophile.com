      <p><cite>If you do have side bearings on em-dash than it’s far more easy and probably more right to kern the dash after a previous one to get rid of the space between.</cite></p>
      <p>Well, that’s why they race horses, I guess. But to me, they are different characters. Consider that a 3-em dash in a bibliography starts flush left. But you’re not going to kern an em-dash with a .125 em sidebearing flush left, at least, in InDesign.  I’d rather use a different dash that starts without a left sidebearing, measures a full three ems, and, since it is usually followed by a period or comma, doesn’t have a .125 em right sidebearing. Bet on the gray if you want.</p>
      <p>The two- and three-em dashes have various uses, such as to replace a persons name (e.g., Mrs.——), but all the uses I know of are different than the use of the em-dash.</p>
      <p>Usually, the em-dash both separates and joins two somewhat related thoughts. Whether you think of it as “separating” or “joining” is at some level a word game, but graphically, the British word-spaced en dash follows the “separating” notion; the American closed-up em dash is in line with the “joining.” Some British designers who have worked in the States for a while, like Richard Eckersley, began to favor the 3/4-em dash in the full em space, and from this thread, it seems that Matthew Carter also signed on.</p>
      <p>Another way of looking at an em-dash is that it replaces a pair of parentheses for expressing a thought that is related, but not grammatically connected to a sentence.</p>
