      <p>As Bill pointed out, for an em dash, the tradition in metal was a full em wide with the dash generally extending to the edges (i.e., zero sidebearings). Typesetters had different conventions (in conjunction with Editorial standards) of spacing these dashes. In the U.S., the most popular style is “closed” — that is, without space on either side. However, careful compositors would often insert a thin space to hold the dash away from rounds.</p>
      <p>Nowadays approaches vary among type designers. I’ve outlined the thinking behind my approach in the notes of the <a href="http://www.kentlew.com/Type/WhitmanSpecimen.pdf" target="new">Whitman PDF specimen</a> at my site.</p>
      <p>If you choose to outfit your em dash with positive sidebearings, then I recommend the kern that Bill mentioned above (at least for any serious text face). In bibliographies, it is common practice to use a 3-to-em dash to signify a repeated author entry, and this is usually set (not surprisingly) as 3 consecutive em dashes. If an emdash-emdash kern pair is not present, your unfortunate designer will find herself with a “dotted” 3-to-em dash (and will likely incur the wrath of the editors).</p>
      <p>— K.</p>
