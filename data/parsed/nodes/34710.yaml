      <p>The question of the appropriate side bearings of the em dash has been discussed here several times. Traditionally, at least in the US I believe it was as near to a full em as the metal type would allow, and was set with no additional spacing. Nowadays I believe it is usually designed with say 5% space on either side. Just checking one face, Minion has a em dash that is totals 922 units, including side bearings 50 either side—this is on a 1000 unit em. Thus the dash is about 90% of the advance width, with 5% side bearings on either side. </p>
      <p>Kent Lew has explained that Matthew Carter favors an em dash that is 75% of the em, with the side bearings taking up the rest of the em. Kent has followed this practice, also negatively kerning the em dash with itself, so that a line of em dashes will form a continuous line. Note that Minion’s em dash is actually 822.</p>
      <p>Carter’s practice makes a compromise between the British and American practices for parenthetical dashes. The British practice is to use en dashes with thin spaces either side. The American practice has been a full em with no extra spacing. Bringhurst rails against the American practice, decrying it as a relic of bad Victorian typography. Whatever the merit of this complaint, the current American practice moves toward the European style.</p>
