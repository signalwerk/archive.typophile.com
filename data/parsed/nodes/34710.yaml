      <p>It shouldn’t be specific to a general and abstract editing principal, or a “good for all typefaces” great-man dictate, but depends on the typeface being used.</p>
      <p>A high contrast serif face needs different dashing than a bold sans.</p>
      <p>So this is certainly something that type designers can take care of, and typographers should be aware of how much “breathing room” the type designer/foundry has decided to include in the dash characters.</p>
