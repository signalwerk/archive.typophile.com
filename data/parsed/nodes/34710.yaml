      <p>I’ve been using a 3/4 em dash on an em body (or dash 75% of the em width, with the rest of the space as sebearings) as long as Fontographer existed. I also make up a “twoemdash” and a “threeemdash” character with no sidebearings, so that I can get any length dash (2,3,4,5 ... n). In Type 1 fonts, you had to be able to write a custom encoding vector to use them, but if you could, it was a character assignment well spent.</p>
      <p>With OpenType, you simply add them to your liga feature.</p>
      <p>sub emdash emdash emdash by threeemdash<br>
      sub emdash emdash by twoemdash</p>
      <p>When you think about it, the tradition of no sidebearings came about, at least in part, so you could set a two- or three-em dash. The large “case” of OpenType has changed that.</p>
      <p>With the endash, you might want to give it the same sidebearings as the hyphen. While endashes are used more with numbers, both the hyphen and endash are used with both letters and numbers, and your kerning work is eased if they have the same sidebearings. In truth, you can make the sidebearings on the en about 5 to 10 units greater than the hyphen &amp; still use the same kerning values; I think the overall fit with this is a bit better.</p>
      <p>As for hyphen sidebearings, I make them to work with n m h etc. and use kerning for the fit with other letters. If your overall spacing of letters makes words with a certain characteristic (lose, tight), you will want that same characteristic with the hyphen.</p>
      <p>FWIW</p>
