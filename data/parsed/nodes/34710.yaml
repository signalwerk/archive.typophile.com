    html: <p>In InDesign (CS1) I will if necessary kern an em dash (or other character) that I want “flusher” left, into a preceding space. Has to be at the beginning of a new paragraph or after a forced line break, so works fine for bibliographies. I suppose a kern pair could be made in the font itself of space-em dash, though this would foul things up if putting a space-em dash somewhere else. Choice in a font of both em dash with no side bearings and em dash with them would be my desire.</p>
