    <p>Hello fellow typophiles.<br>
    I really need some help specifying a typeface for a publishing project.<br>
    Here is an outline of the brief:<br>
    We are compiling a book on British graffiti art for a UK publisher predominately for the European market, I want the design to be subtle, sophisticated and demonstrate a good understanding of type.<br>
    As the content is very elaborate and of course about typography in its most abstracted sense.<br>
    They layout and structure for the book is essentially like an art book.<br>
    So I ’m NOT interested in ’urban’ or funky typefaces.<br>
    The intention is not to over-design the publication merely frame the content in a serious and respectful manner.</p>
    <p>The book is about 2 thirds photos to copy, it requires section starts, subheads, captions, pull quotes and body. </p>
    <p>Neither do I require it to be quintessentially British, so no Gill or Futura [although the pun was nice]</p>
    <p>I do like the idea of referencing the NY subway system [as it is the origin of modern graffiti] Akziden Grotesque is the closest I could find to ’Standard Medium’ it looks o.k for heading and subheads but not too hot for body or figures.</p>
    <p>So far I have tried ’univers’ not helvetica [as I think never use it, I hate the uppercase R.<br>
    I have looked at the foundries below to no avail.</p>
    <p>Process<br>
    Village<br>
    Alias<br>
    Lineto<br>
    The foundry<br>
    FontSmith</p>
    <p>Also it may be worth mentioning to you guys over the pon</p>
