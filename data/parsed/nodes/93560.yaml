    <p>The June edition of the Metal Type newsletter is now out.</p>
    <p>This month's vehicle is "Bauxite No2" a steam locomotive that was built 10 years before the Linotype was invented.</p>
    <p>Click here to take a look at this month's video:<br>
    <a href="http://www.metaltype.co.uk/rail/clicks/click.php?id=17" title="http://www.metaltype.co.uk/rail/clicks/click.php?id=17">http://www.metaltype.co.uk/rail/clicks/click.php?id=17</a></p>
    <p>There were plenty of interesting articles posted onto the forum, one I'd particularly like to highlight is Help Restore the Oldest Newspaper Press in Britain.</p>
    <p><a href="http://www.metaltype.co.uk/rail/clicks/click.php?id=12" title="http://www.metaltype.co.uk/rail/clicks/click.php?id=12">http://www.metaltype.co.uk/rail/clicks/click.php?id=12</a></p>
    <p>There's a chance to see video of this magnificent press's last ever run, and details of how to donate money to help restore the press back into working condition.</p>
    <p> Also on the forum, a half-hour promotional film for the "Newsday" newspaper, Long Island, USA called Dateline Long Island. Made in 1964, the film is a good trip down memory lane, with plenty of hot metal newspaper action thrown in for good measure!<br>
    <a href="http://www.metaltype.co.uk/rail/clicks/click.php?id=18" title="http://www.metaltype.co.uk/rail/clicks/click.php?id=18">http://www.metaltype.co.uk/rail/clicks/click.php?id=18</a></p>
    <p>All the Best</p>
    <p>Dave Hughes</p>
    <p>York, UK</p>
