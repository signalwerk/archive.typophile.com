    <div class="info">Submitted by <a href="/user/3095" title="View user profile.">billdavis</a> : 31.Mar.2007 7.37pm </div>
      <p>APRIL 1, 2007 – The view of picturesque Half Dome, in Yosemite National Park, was obscured this week by the mysterious appearance of a lowercase ‘e’. Other popular landmarks across the Sierra Nevada – often called the ‘range of light’ – experienced the strange effects of being encased in bezier curves. </p>
    <p>“This typo-geological effect is a rare occurrence” said officials at the U.S. Geological Survey. “It’s not often that typefaces take root in such an organic source.” Experts in the field noted that this particular typeface’s angular tension and smooth curves recalled the craggy formations of granite polished smooth by glacial activity found all over the Sierra Nevada. </p>
    <p>One hiker on the scene remarked: “The designer’s obvious intent was to impart organic character to letter forms while retaining crisp readability. It could be the effects of altitude, snow-blindness or even poorly-fitted boots, but the effect is quite striking and could make for good reading.” </p>
    <p>Rumour has it that the typeface will be named “Massif”. It is expected that the typeface will leave no trace once all of its family members are released to the public.</p>
    <p>More information can be found here:<br>
    <a href="http://www.ascendercorp.com/Ascender_fonts.html#massif" title="http://www.ascendercorp.com/Ascender_fonts.html#massif">http://www.ascendercorp.com/Ascender_fonts.html#massif</a></p>
