      <p>1000 unit em, generating OTPS font from FontLab. I'm drawing the outlines in Illustrator on the 1000 unit grid and, yes, I have everything set to snap to that grid. Then I've copied/pasted the glyphs into FontLab and fine-tuned them there. Here is a JPG to avoid rendering differences: the top is the outline as drawn with three BCPs, the bottom is the same foot as rendered in InDesign using the OTPS font.</p>
      <p>As mentioned in my last post, though, removing the middle BCP from the feet and top serifs seems to fix the problem, so the font is now rendering properly.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/wave_5321.jpg"></div><p></p>
