    <p>Outlines drawn in Illustrator show bottom of feet as intended: a smooth concave curve. Outline brought into FontLab, all is well: the curve is still right. On generating OT font, however, the curve turns into a kind of wave. When the glyph is set in InDesign, there's the odd wave. But when I convert that glyph to outlines in InDesign, the wave converts back to the proper concave curve. PDF attached. Any ideas?</p>
