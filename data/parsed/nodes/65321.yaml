    html: |-
      <p>I think it's a hinting problem. That could explain the different display in Preview and Adobe Reader (OS X Preview ignores hints, Adobe Reader interprets them for display). When you convert the font to outlines in InDesign, hinting is discarded and the outline looks good again.</p>
      <p>What do your hints look like in FontLab Studio?</p>
