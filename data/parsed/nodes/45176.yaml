      <p>Typography: from brain to media<br>
    Beatrice Warde Memorial Lecture<br>
    ===============================</p>
    <p>Thursday 15 May 2008, 6.30pm in the Bridewell Hall<br>
    Entry to the lecture is free and all are welcome</p>
    <p>. . . . .</p>
    <p>Designers think for a living, but nobody is interested in our thoughts.<br>
    All they want is the physical manifestations of our thought process.<br>
    Sketches, dummies, layouts, mark-ups, pilots, presentations, print-outs,<br>
    soft proofs, touch-and-feel, wireframes – whatever it takes to show what<br>
    the ‘real’ piece may look like.</p>
    <p>As a typographer in the 60s and 70s, we had to prepare our ideas for<br>
    other people: typesetters, printers, programmers, colleagues, client.<br>
    Exact instructions, pasted-up elements or ‘original art’ were our final<br>
    product.</p>
    <p>This will be a trip down memory lane and onto the shop floor of<br>
    forgotten techniques and technology that may offer insights in how we<br>
    work and what could perhaps be improved. And an attempt at suggesting<br>
    how to use our brains better – still the most powerful tool around.</p>
    <p>Erik Spiekermann is author, information designer and typographer. He<br>
    founded MetaDesign and FontShop, is Honorary Professor at the University<br>
    of the Arts in Bremen and has an honorary doctorship from<!--
