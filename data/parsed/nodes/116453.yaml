      <p>I agree that designers should be sensitive to client needs and wishes, and there's always some give-and-take. </p>
      <p>But a designer is a professional who brings their expertise and personal style to their jobs. Clients should pick a designer whose style they like.</p>
      <p>If you needed an architect or interior designer, you'd pick one whose style you liked. Same thing with graphic design.</p>
      <p>Regarding money, most clients are businesses and we expect to get paid well, just as they pay their accountants, lawyers, etc. </p>
      <p>That doesn't mean we don't love design, or do occasional free jobs for charities, but it's a business. It's the way we pay our bills and support our families.</p>
      <p>Getting back to Vignelli, he had a style that some folks liked and some didn't. That's true with most designers. But regardless of whether you liked him or not, he was a highly influential designer.</p>
