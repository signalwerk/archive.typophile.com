      <div class="comment-spam-body"><p>It's not about Helvetica though. It's about the notion that 10 typefaces is enough for all your projects. At my art academy about half the people use DIN by default for their projects and presentations. I wouldn't call that design. What do you need to study graphic design for if you can apply the same formula to all your projects? A designer needs to consider what typeface works best for each project individually. Expressions like "When in doubt, use Helvetica" goes against the very principle of what a graphic designer should do. Such expressions are for non-designers.</p>
      <blockquote><p>And to the helvetica haters, keep in mind that he died at age 83 and much of his famous work was done decades ago when helvetica was popular and loved by many designers.</p></blockquote>
      <p>Perhaps times have changed, but these days Gotham is loved by many designers; if you're going to use Gotham by default because everyone likes it, I just can't take you seriously as a designer.</p>
      </div>
