      <p>&gt; It's not about Helvetica though.<br>
      &gt; It's about the notion that 10 typefaces<br>
      &gt; is enough for all your projects. </p>
      <p>Helvetica is trashed rather often at Typophile. </p>
      <p>I agree that 10 isn't enough for all situations, but most designers have favorite fonts they use regularly. And Vignelli was primarily focused on conservative corporate clients. </p>
      <p>Generally speaking you don't make money in design by having a huge range of clients and using different fonts for each, you make money by having regular clients who send you one job after another, and you generally stick with certain fonts for each client. He had many clients but that was over a lifetime.</p>
      <p>Plus his general style was clear. You need to get a good fit between client and designer. Folks who didn't like his style hired someone else.</p>
