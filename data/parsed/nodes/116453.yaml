    <p>Legendary designer Massimo Vignelli is seriously ill and is "spending his last days at home".  His son says that Massimo would be happy to get good wishes from people he has known or influenced, and has given this address:</p>
    <p>Massimo Vignelli<br>
    130 East 67 Street<br>
    New York, NY 10021<br>
    USA</p>
    <p>(I know there are some folks at Typophile who don't care for his work, but this is for those who do.)</p>
