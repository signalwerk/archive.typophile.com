    html: |-
      <div class="comment-spam-body"><blockquote><p>Of course he was using pre-digital Helvetica:</p></blockquote>
      <p>You misunderstood to some extent. My point was that from the works I've seen from him in recent years, I always see the digital Helvetica. You say Neue Haas Grotesk is more faithful to the pre-digital Helvetica but what I've seen is what is now the digitized Helvetica. I haven't actually seen Helvetica the way it's presented as Neue Haas Grotesk now. I would argue Neue Haas Grotesk is not necessarily more faithful to the original Helvetica, but what Helvetica was supposed to look like all along. The Helvetica Vignelli loves (digitized or not) is very different.</p>
      <p>Also, if the pre-Helvetica, digitized Helvetica and Neue Haas Grotesk are all the same to him, I can't take his philosophy seriously anymore (okay, I already didn't, but this adds to it). How are 10 typefaces in the world enough when 3 of them are Helvetica? Actually, he argues there are half a dozen to a dozen typefaces which should be used and he uses 3 or 4. Obviously I understand he meant different ones and not different renditions of Helvetica, but the very existence of Neue Haas Grotesk seems to go against his design philosophy. Also, do we actually know what he thinks about Neue Haas Grotesk? I feel it's quite arrogant to impose this typeface on him just because it's supposedly a more faithful rendition of Helvetica. I don't think he has ever used Neue Haas Grotesk, but he has used Helvetica prominently.</p>
      </div>
