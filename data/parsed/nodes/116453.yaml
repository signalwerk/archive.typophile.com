      <p>James, like Martin I don't see much relevance to the popularity of a font at a given time; in fact a font that's too popular has a diluted voice. And I don't think Vignelli cared about popular opinion, because he still loved Helvetica after it fell out of favor. The problem is, loving –or overly relying on– a perceived "safe" font choice is not good design.</p>
      <blockquote><p>Folks who didn't like his style hired someone else.</p></blockquote>
      <p>To me Design is essentially about servitude (and certainly not simply about making money) so the ideal designer adapts to <em>any</em> type of client, instead of settling for a predictable routine.</p>
      <p>Vignelli was an artist more than a designer.</p>
      <p>hhp</p>
