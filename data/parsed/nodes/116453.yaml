      <p>Style, yes. I also admit different clients have different requirements, but if I were a client I would expect the designer to do something that caters to the exact needs of my product. If you're going to use Helvetica by default, you haven't done any research into the needs of my products. What happens here is that essentially the client did his research on what he likes and Vignelli gives exactly that. Where does the research of the designer come into play? Perhaps I shouldn't imply he doesn't do research, but what good is the research if you're not going to base certain design decisions on that research? </p>
      <p>Also, you say a client should pick a designer they like and of course I agree with that, but I submit that many clients don't actually understand what they need. There is a big difference between what they want and what they need. With Vignelli, they "need" his style and they get it. I don't think it should be a matter of needing a style and getting that style exactly. As a client, supposedly I haven't studied design; there's a reason I'm hiring a designer to do the job. If the designer doesn't stop to think about what your product actually needs and just puts his brand on it, I submit it could be a good business because you're using a big name, but it's not optimal design. It's almost more of a marketing play. Not to undermine what Vignelli did, because it's not like I think his work isn't good. He just starts with very wrong premises. As Hrant said, he's an artist more than a designer in that aspect.</p>
      <p>If you're not going to do any research into the needs of the clients and just cater to what the client thinks he needs, there's a high potential of you failing as a graphic designer.</p>
      <blockquote><p>If you needed an architect or interior designer</p></blockquote>
      <p>I think this is somewhat different anyway, as graphic design inherently should communicate a message to many people. When it comes to architecture and interior design, personal taste seems more important. There are typefaces I find ugly but which I would find absolutely perfect for certain projects. Initially I greatly disliked Gill Sans, yet I used it anyway because it fit the project perfectly, and within the context of the project Gill Sans didn't look ugly. I eventually grew to love Gill Sans (though I'm very hesitant about using it at all), but that's a different matter. I find it very hard to imagine these kind of principles are also at play when it comes to architecture and interior design as they don't have to communicate a message as such. Besides, if I hire an architecture and he will give me a proposal which is a recycling of one of his other designs, I'm going to tell him he's nuts for thinking he can get away with that. I'm paying for a custom job, not a clone of a different building. I would hire him for his style and vision, not to repeat himself to the extent Vignelli did. I wouldn't hire an architect who's only vision is to design archs. But perhaps that's where the problem starts, the notion that some clients would gladly hire this kind of architect.</p>
      <blockquote><p>Regarding money, most clients are businesses and we expect to get paid well, just as they pay their accountants, lawyers, etc.</p></blockquote>
      <p>I never denied its importance, but this shouldn't come into play when considering optimal design. I'm talking about ideals here and not to make your business work. Let's assume there is an infinite budget so we can talk about optimal design and not have this conversation clouded with business talk.</p>
      <blockquote><p>But regardless of whether you liked him or not, he was a highly influential designer.</p></blockquote>
      <p>I feel you keep talking past me somewhat. I never said I didn't like his work, nor did I deny he was an influential designer. What I do say is that he's an artist doing a graphic design job and doesn't adhere to what graphic design entails. It should cater to the needs of the product, not to put your brand on it so it sells automatically.</p>
      </div>
