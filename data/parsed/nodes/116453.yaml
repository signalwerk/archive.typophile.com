      <div class="comment-spam-body"><blockquote><p>I don't think this discussion is "clouded" by business talk. Graphic design is a business.</p></blockquote>
      <p>Yes, but when talking about ideals in design and aesthetics the consideration of making money only gets in the way. It's part of a different discussion.</p>
      <blockquote><p>Vignelli was highly successful over a long career, which indicates to me that most of his clients were pleased with his work</p></blockquote>
      <p>Again, there's a big difference between client satisfaction and getting the most potential out of your product because of the design. I feel as designers we tend to listen way too much to what the client wants and thinks he needs. I hate the phrase "client is king". I will listen to what the client wants and I will take his ideas into consideration. I will make compromises here and there, but I certainly won't execute the client's very vision just because he's paying for the design, nor would I enforce my own vision due to personal preferences. Actually, I tend to do that more when I do illustrations but I'm an artist in that context and not a graphic designer. My illustration work is more personal and I don't do it for anyone just because they're paying. I'm much more selective in the clients I choose to work for when it comes to illustrations because my name is on it. When it comes to graphic design, I should remain invisible in the work itself.</p>
      </div>
