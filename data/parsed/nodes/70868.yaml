    html: |-
      <p>@skosch: Thanks for feedback! I will definitely apply your advice on the u/v problem. The Z has the same curve as E, S or any other letter since the elements are copied.<br>
      As for the wireframe I didn't draw any. I based it on metrics and serifs:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/cath_5704.png"></div><p></p>
      <p>Lower right descending corner of a stem is always horned, lower left is always cut. Obtuse angles of strokes are rounded (bottom part always, upper one only if it's an element such as in S or Z). Hope I explained it clearly enough.<br>
      As I said, it's gonna be free - so whatever you want to use it for, either personal or commercial project, you can without informing anyone or paying anything. You can use it for whatever you want for free as long as you don't claim to be the author or sell the font or modify and redistribute it without my consent.<br>
      I will finish Cathedrale this week I think (all capitalics, some diacritics and basic punctuation) and include the license in the package.</p>
