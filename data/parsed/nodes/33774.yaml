      <p>Yes, unfortunately only a handful of typefaces are common across mac and pc systems. If you’re looking for something outside of verdana, arial, etc. you’ll need to make it a gif or jpeg.</p>
      <p>You could also try something like <a href="https://web.archive.org/web/20080821140339/http://www.mikeindustries.com/sifr/">sIFR</a></p>
