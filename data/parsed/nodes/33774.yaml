    <p>Hi!<br>
    I have chosen a font for my logotype (on my website) which apparently isn’t that common and I’ve been told that it has to be “converted” into an image in Photoshop or else one won’t be able to see it in most computers. (?!) Is this true and how do I go about doing that? This might be completely obvious to most people but I am new to this so I don’t have a clue.  :-)</p>
    <p>Charlotta</p>
