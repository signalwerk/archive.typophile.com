    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Writers" class="freelinking" rel="nofollow">Writers</a> : Tamye Riggs</strong></p>
    <p>Tamye Riggs is a writer, editor, typographer, designer, and event planner specializing in typography and the related arts.</p>
    <p>The self-titled type geek began her career by working as a typesetter and production artist throughout high school and college. After stints at big ad agencies, an entertainment news weekly, an oil and gas company, a trendy watch manufacturer, and a host of design studios in Dallas, Texas, Riggs moved to the typographic side of life. She has worked in creative, marketing, and management areas for Maryland-based <a href="/wiki/Phils%20Fonts" class="freelinking" rel="nofollow">Phil's Fonts</a>/<a href="/wiki/GarageFonts" class="freelinking" rel="nofollow">GarageFonts</a> and <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a> San Francisco (including the editing of FSSF's recently-revived <em><a href="/wiki/Font" class="freelinking" rel="nofollow">Font</a></em> magazine). </p>
    <p>For more than a decade, Riggs served as volunteer, founding board member, then Executive Director of the non-profit <a href="/wiki/SOTA" class="freelinking" rel="nofollow">The Society of Typographic Aficionados (SOTA)</a>, which presents <a href="/wiki/TypeCon" class="freelinking" rel="nofollow">TypeCon</a> annually. She is co-editor of SOTA's publication <em><a href="/wiki/Interrobang" class="freelinking" rel="nofollow">Interrobang</a></em> with <a href="/wiki/Stephen%20Coles" class="freelinking" rel="nofollow">Stephen Coles</a>.</p>
    <p>Under the brand TypeLife, Riggs consults for a number of foundries and type distributors and writes for design publications such as <em><a href="/wiki/HOW" class="freelinking" rel="nofollow">HOW</a></em> and <em>Computer Arts UK</em>. She has authored seven books on type and motion graphics, including the acclaimed <em><a href="/wiki/Indie%20Fonts" class="freelinking" rel="nofollow">Indie Fonts</a></em> series with <a href="/wiki/Richard%20Kegler" class="freelinking" rel="nofollow">Richard Kegler</a> and <a href="/wiki/James%20Grieshaber" class="freelinking" rel="nofollow">James Grieshaber</a>.</p>
    <p>A musician since childhood, Riggs has fronted several bands in Dallas and Washington, DC. A native Oregonian, Riggs now lives and works on the island of Alameda, just across the bay from San Francisco.</p>
