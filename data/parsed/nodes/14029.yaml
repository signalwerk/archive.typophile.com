    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/31465" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Writers</a>&nbsp;: Tamye&nbsp;Riggs</strong></p>
    <p>Tamye Riggs is a writer, editor, typographer, designer, and event planner specializing in typography and the related&nbsp;arts.</p>
    <p>The self-titled type geek began her career by working as a typesetter and production artist throughout high school and college. After stints at big ad agencies, an entertainment news weekly, an oil and gas company, a trendy watch manufacturer, and a host of design studios in Dallas, Texas, Riggs moved to the typographic side of life. She has worked in creative, marketing, and management areas for Maryland-based <a href="/node/13437" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Phil’s Fonts</a>/<a href="/node/13945" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">GarageFonts</a> and <a href="/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop</a> San Francisco (including the editing of <span class="caps">FSSF</span>’s recently-revived <em><a href="/node/13544" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font</a></em> magazine). </p>
    <p>For more than a decade, Riggs served as volunteer, founding board member, then Executive Director of the non-profit <a href="/node/12153" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">The Society of Typographic Aficionados (<span class="caps">SOTA</span>)</a>, which presents <a href="/node/12014" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TypeCon</a> annually. She is co-editor of <span class="caps">SOTA</span>’s publication <em><a href="/node/13045" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Interrobang</a></em> with <a href="/node/12036" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Stephen Coles</a>.</p>
    <p>Under the brand TypeLife, Riggs consults for a number of foundries and type distributors and writes for design publications such as <em><a href="/node/44712" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">How</a></em> and <em>Computer Arts <span class="caps">UK</span></em>. She has authored seven books on type and motion graphics, including the acclaimed <em><a href="/node/12108" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Indie Fonts</a></em> series with <a href="/node/12323" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Richard Kegler</a> and <a href="/node/12316" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">James Grieshaber</a>.</p>
    <p>A musician since childhood, Riggs has fronted several bands in Dallas and Washington, <span class="caps">DC</span>. A native Oregonian, Riggs now lives and works on the island of Alameda, just across the bay from San&nbsp;Francisco.</p>
