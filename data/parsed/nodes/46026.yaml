      <p>Hi George,</p>
      <p><cite>The Goldman Sachs logo was designed in 1970 by Lippincott &amp; Margulies. The colour is blue (Pantone 652). Goldman Sachs uses the typefaces Univers and Sabon.</cite></p>
      <p><a href="http://users.ncrvnet.nl/mstol/gs.html">Hans Stol’s Website about Corporate Identity</a></p>
      <p>Here’s a bigger version, by the way:<br><img src="/sites/default/files/old-images/gs_5028.png"></p>
      <p>Similar fonts? <a href="http://www.myfonts.com/fonts/urw/britannic/familytree.html">Britannic</a>, maybe?<br>
      F</p>
