    <p>Hi all,</p>
    <p>I have a client who insists that I find the font used in the Goldman Sachs logo. It seems at first like a modern typeface but lacks most of the serifs ... so maybe a transitional?...</p>
    <p>Anyhow, I have so far drawn a blank. I realize that parts of the GS logo have probably been hand-tweaked, but if such a font exists that matches "oldman" and "achs", I will be in much better shape than I am right now.</p>
    <p>I really appreciate your all of your expertise and assistance.</p>
    <p>Cheers!<br>
    - George</p>
    <p><img src="/sites/default/files/old-images/GS_4752.jpeg"></p>
