      <p>I find the <em>RightThumb.com</em> font very hard to read, and the drop shadow doesn’t help. I get a kind of Rastafarian vibe from the red-yellow-green color scheme, but maybe that’s just me. Or maybe that’s intentional.</p>
      <p>Those are just opinions. These are not opinions:</p>
      <li>The lowercase <strong>a</strong> in <em>Boats and Jets</em> is correct.</li>
      <li>Therefore, the capital <strong>I</strong> in <em>Rides In Cars</em> is incorrect. So are the capital <strong>A</strong> and <strong>T</strong> in <em>And The People</em>.</li>
      <li>Ellipses consist of <em>three</em> periods with word spaces between them, like this:</li>
      <p></p><div class="imageWrap"><img src="/files/ellipses_5736.jpg"></div><p></p>
