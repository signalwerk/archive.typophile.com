    html: <p>Great lead Don, Full sample character sets are shown in "American Metal Typefaces of the 20th Century" by Mac McGrew, Oak Knoll Books 1993 - The font was designed in 1928 and issued in 1929 but did not last long enough to appear in the 1934 ATF catalog. The Bulldog Foundry version seems to be the only digital one.</p>
