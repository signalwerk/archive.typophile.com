    html: <p>Morris Fuller Benton designed a font called Louvaine for ATF in 1929  - three weights plus an italic but I can not find a specimen or sample to see if this is it - not in my ATF catalogs from the 30s of 40s. The Bulldog font I have seen is also close but is much heavier and only close.</p>
