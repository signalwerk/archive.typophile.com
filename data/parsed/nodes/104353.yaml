      <p>More from Jaspert: "...designed by M.F. Benton, based on a Bodoni model, but with the peculiarity found in a number of modernistic types of making the thicks and thins meet at an angle. This is especially noticeable in the O and the S. The g and y have cursive tails. The italic is the roman inclined, except for a, which has a flat-foot serif, v and w. There are three weights, the light being the colour of a normal book type."<br>
      Don</p>
