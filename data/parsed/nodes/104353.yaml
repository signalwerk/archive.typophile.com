    html: |-
      <p>Louvaine is shown in Jaspert's Enclyopedia of Typefaces, 1970 ed., with the three weights. The letter-forms match the Solocat image. The weight of the strokes and serifs for all three is a little lighter than shown in the Solocat image. Jaspert was unable to find a full character set for any of the three.<br>
      As for the Solocat entry, the relative thickness is explained by the source. Dan X. Solo scoured the U.S. for used typefaces. The impression of such typefaces could be expected to be heavier than the carefully controlled impression of new type in a foundry's specimen, or even for the material provided to Jaspert.<br>
      Don</p>
