    html: |-
      <p>McGrew: "LOUVAINE series was designed by Morris F. Benton for ATF in 1928. It is an adaptation of Bodoni (the working title was Modern Bodoni), and many of the characters are identical. Only g and y are basically different; otherwise the distinction is in the more abrupt transition from thick to thin strokes in this series. In this respect, Ultra Bodoni has more affinity to Louvaine than to the other Bodoni weights. The three weights of Louvaine correspond to Bodoni Book, regular, and Bold. This series did not last long enough to appear in the 1934 ATF specimen book, the next complete one after its introduction. "<br>
      Yes, McGrew has full character sets.<br>
      Don</p>
