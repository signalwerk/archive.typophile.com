  html: <p>Seems like everyone's going with FontLab, and I've seen quite a few negative comments about Fontographer.  I'm looking to obtain one of these but know nothing about either of them.  I'm mostly interested in TrueType fonts--can Fontographer handle this or no (money is an issue for me, and Fontographer is cheaper).  What's the word?</p>
  html_clean: <p>Seems like everyone's going with FontLab, and I've seen quite a few negative comments about Fontographer.  I'm looking to obtain one of these but know nothing about either of them.  I'm mostly interested in TrueType fonts--can Fontographer handle this or no (money is an issue for me, and Fontographer is cheaper).  What's the word?</p>
comments:
  - id: 28379
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>Fontographer has not been updated for more than five years and is unlikely ever to be updated again. It is not in development, and is becoming more obsolete all the time. It makes reasonably good -- although far from perfect -- Type 1 PS fonts, but the quality of its TrueType fonts is not very good, and you have very little control (it exports TT fonts as conversions, only letting you work in a PS outline and hinting environments). <br> <br>If you are looking for a less expensive option, check out TypeTool from the makers of FontLab. It is a stripped down version of FontLab that is better for TT development than Fontographer.</p>
