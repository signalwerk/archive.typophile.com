    html: <p>I understand all of the complaints re Fontographer, crummy manual, no updates, no plans to revise, but it was the program of choice for thousands?hundreds of designers and millions or maybe just thousands of fonts were created using it. Yes, a pity that it is not updated, but I still use it, though am getting Type Tool2 now.</p>
