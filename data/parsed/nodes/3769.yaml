    html: <p>What the other guys said. <br> <br>Plus, it's just such a striking difference between an app that has huge bugs and hasn't had even a bug fix in about 6-7 years, versus one that gets constant updates and is really responsive to user needs and requests. <br> <br>FontLab/TypeTool are harder to learn, but they are far more capable, while Fontographer seems like an all-but-dead product. <br> <br>T</p>
