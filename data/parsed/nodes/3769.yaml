    html: <p>There was another program around in the mid 80s, Ikarus, and it was expensive although it was very good. The Dutch Type Library includes it as a part of the current DTL FontMaster which operates using Mac OS Classic and Windows. Yes, Type Tool 2 is a very good choice. I believe the Windows version of Fontographer first appeared in 1992 or so, after the Mac version.</p>
