    html: |-
      <p>My first reaction was, "Wow, I didn't expect something called 'Town Center Wine &amp; Spirits' to have such a nice logo!"   A minute later, I do have some criticisms:</p>
      <p>The whole thing seems a bit too wide - the "Town" and "Center" bugs me for being so loosely tracked.  The wine bottle seems pixelated on the edge, and the white label flattens it out unpleasantly - perhaps get rid of the label or making it 20% transparency?  The sections of type below could both move a bit towards the grape vine, allowing the town and center to have slightly tighter spacing without ruining the balance.</p>
      <p>Good luck!</p>
    html_clean: |-
      <p>My first reaction was, "Wow, I didn't expect something called 'Town Center Wine &amp; Spirits' to have such a nice logo!"   A minute later, I do have some criticisms:</p>
