  html: <p>This is a pretty haggard font, also because I put a gradient map over the text to make it more visible. It is not hand drawn or handset as it appears to be. I've seen this graphic designer use it many times. It looks expensive, something like YouWorkForThem would showcase. Any ideas? -thanks<br><a href="http://tinypic.com?ref=35mmgy9" target="_blank"></a></p>
