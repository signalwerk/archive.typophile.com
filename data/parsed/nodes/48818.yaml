    <p></p><div class="imageWrap"><img src="http://typophile.com/files/tl_2008_5571.jpg"></div><br>
    Tipos Latinos 2008 en Santiago y en Concepción<p></p>
    <p>La Bienal Tipos Latinos 2008 en Chile es organizada por la Unión de los Tipógrafos</p>
    <p>Es coordinada paralelamente en Santiago y Concepción para presentar la Bienal Tipos Latinos 2008 y otras actividades en ambas ciudades.</p>
    <p>Concepción</p>
    <p>Exposición desde el 27 de Agosto al 6 de septiembre<br>
    Galería de la Historia en el Parque Ecuador - Entrada Liberada</p>
    <p>Jueves 28 de agosto (inauguración)</p>
    <p>nuevo lugar  Sala 2 Teatro Universidad de Concepción</p>
    <p>18.00: Presentación BTL2008 (sedes latinoamericanas) -<br>
    Resumen BTL2008-Chile sede SCL</p>
    <p>18.30 hrs: Presentación tipografías seleccionadas (Unión de los Tipógrafos)</p>
    <p>19.00 hrs: Charla 1: Mauricio Amster/Jko Contreras</p>
    <p>Viernes 29 de agosto</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ams_3998.gif"></div><p></p>
    <p>9.30: Inscripción</p>
    <p>10.00/13.00 hrs: Workshops </p>
    <p>WS1: Diseñando tipografías Modulares<br>
    Daniel Hernandez y Miguel Hernández<br>
    Lugar por Confirmar</p>
    <p>WS2: Diseñando tipografías para Branding<br>
    Cristián González + Dany Berczeller<br>
    DUOC UC</p>
    <p>WS3: Diseñando tipografías Display<br>
    Jko Contreras + Luciano Vergara<br>
    Lugar por confirmar</p>
    <p>WS7: Diseñando Modulos Tipografícos Fluorecentes (nuevo)<br>
    Nolo Chacón + Felipe Pimentel + Javier quintana<br>
    Lugar Sorpresa</p>
    <p>13.00/15.00 hrs:  A L M U E R Z O</p>
    <p>Sala 2:<br>
    15.00Presentación tipografías seleccionadas (x2)</p>
    <p>15.30 Charla 2: Tipografía y branding/ Cristian González</p>
    <p>16.15: cofee break</p>
    <p>16.30: Lanzamiento Latinotype</p>
    <p>17.00/17.45 hrs: Charla 3: Tipografía y diarios/ Dany Berczeller</p>
    <p>17.45/18.30 hrs: Mesa redonda (ciclo de preguntas)</p>
    <p>18.30/20.00 hrs: Documental Helvética</p>
    <p>Sábado 30 de agosto<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ws1_4665.gif"></div><p></p>
    <p>9.30 hrs: Inscripción</p>
    <p>10.00 hrs: Workshops</p>
    <p>WS4: Artes y oficios. Caligrafía<br>
    Francisco Gálvez y Felipe Cáceres<br>
    Universidad San Sebastián</p>
    <p>WS5: Artes y oficios. Diagramación<br>
    Eduardo Castillo y Mariana Muñoz<br>
    Universidad del Desarrollo</p>
    <p>WS6: Artes y oficios. Xilografía<br>
    Cristina Dobbs y Guísela Mendoza<br>
    Lugar por confirmar</p>
    <p>WS8: Diseñando Fanzines (nuevo)<br>
    Gonzalo Osorio + jko Contreras<br>
    INACAP</p>
    <p>13.00/15.00 hrs: ALMUERZO</p>
    <p>Santo Tomas:<br>
    Prat esquina Carrera</p>
    <p>15.00: Presentación tipografías seleccionadas (x2)</p>
    <p>15.30 hrs: Charla 4: Diseño y tipografía en Chile/ Eduardo Castillo</p>
    <p>16.15 hrs: cofee break</p>
    <p>16.30 hrs: Lanzamiento Tipos Unidos</p>
    <p>17.00/17:45 hrs: Charla 5: Educación y tipografía en Chile/ Francisco Gálvez</p>
    <p>17.45/18:30 hrs: Mesa redonda (ciclo de preguntas)<br>
    (cierre con todos los invitados: Eduardo Castillo, Francisco Gálvez, Cristián González, Jko Contreras, Luciano Vergara, Miguel Hernández)</p>
    <p>18.30 hrs: CIERRE<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Tipos-&amp;-Tipas-2_4318.gif"></div><p></p>
    <p>22.00 hrs: FIESTA (Almendra)</p>
