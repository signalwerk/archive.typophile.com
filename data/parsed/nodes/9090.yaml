    html: <p>One of my favourites is in Brewer Street, off Wardour Street in Soho (green paintwork, adult section downstairs). Also I've been recommended to Collinge &amp; Clark, 13 Leigh Street, WC1, but I haven't been there yet. <br>Tim</p>
