    html: "<p>For contemporary graphic design <br>Magma Books has two locations: <br><a href=\"http://www.magmabooks.com/\" target=\"_blank\">http://www.magmabooks.com/</a> <br> <br>Waterstones in picadilly circus has a small but useful typography section. <br> <br>The V&amp;A museum contains the National Art Library which allows you to photocopy (at a premium cost).  <br><a href=\"http://www.vam.ac.uk/nal/index.html\" target=\"_blank\">http://www.vam.ac.uk/nal/index.html</a> <br> <br>Whether you're looking for a certain issue of graphis from 1944 or a victorian lettering catalouge. The NAL is better than any bookshop. <br>online catalogue: <br><a href=\"http://ipac.nal.vam.ac.uk\" target=\"_blank\">http://ipac.nal.vam.ac.uk</a></p>"
