    date: 2005-02-05T15:26:00
    date_raw: 5 Feb 2005 — 3:26pm
    votes: null
    html: <p>Collinge &amp; Clark is splendid if you are interested in private press books and more scholarly works on typography. If you are looking for graphic design books, then the design bookshop on Charing Cross Road (east side, block-and-a-half south of Cambridge Circus) is a better bet.</p>
    html_clean: <p>Collinge &amp; Clark is splendid if you are interested in private press books and more scholarly works on typography. If you are looking for graphic design books, then the design bookshop on Charing Cross Road (east side, block-and-a-half south of Cambridge Circus) is a better bet.</p>
