  html: <p>Some time ago there was a great thread about bookshops in London a typophile should visit. I am going to London this Monday and can't find it. Can anyone remind me at least some of them? <br>Thanks in advance <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
