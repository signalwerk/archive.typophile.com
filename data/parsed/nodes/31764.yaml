  html: |-
    <p>The printer asked for a second file with the emboss area.<br>
    The shape i wish to have embossed at the printer, do i need to make it slightly bigger than the original shape on screen?</p>
    <p>I'm asking because this is going to get embossed OUTward and the shape has a cover, will this not effect on screen shape a bit? knowing that its going to nudge it outwards</p>
