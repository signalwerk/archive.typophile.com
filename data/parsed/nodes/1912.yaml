    html: <p>Kyle, <br> <br>I like the mark as well, although I must admit that I thought it was a paper company. Perhaps some sort of pattern integrated into the mark or background to allude to fabric/textiles? Also, I believe textiles are commonly distributed in round or flat rolls (imagine rolling up many many feet of fabric around something flat, like a yardstick). Just something to think about. <br> <br>In regards to the typography/layout/colors. While I like Faceplate sans, I'm not sure its the best choice for a company that does textiles. To me this face is a little too modern/techie/impersonal for the purpose. I would say the same about the color scheme -- the muted blue is okay, but I feel that the gray is does not work. What about something a bit warmer -- more natural fiber looking? Something from the off-white to medium brown range? <br> <br>Just some top-of-mind feedback for what it's worth. <br> <br> -t</p>
    html_clean: <p>Kyle, <br> <br>I like the mark as well, although I must admit that I thought it was a paper company. Perhaps some sort of pattern integrated into the mark or background to allude to fabric/textiles? Also, I believe textiles are commonly distributed in round or flat rolls (imagine rolling up many many feet of fabric around something flat, like a yardstick). Just something to think about. <br> <br>In regards to the typography/layout/colors. While I like Faceplate sans, I'm not sure its the best choice for a company that does textiles. To me this face is a little too modern/techie/impersonal for the purpose. I would say the same about the color scheme -- the muted blue is okay, but I feel that the gray is does not work. What about something a bit warmer -- more natural fiber looking? Something from the off-white to medium brown range? <br> <br>Just some top-of-mind feedback for what it's worth. <br> <br> -t</p>
