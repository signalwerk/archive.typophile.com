    <p>Hey guys, that past few months have been tough (creatively), and this is not helping <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>I'm gonna pass this by you all, and see what you think. <br> <br>I very happy with the mark, we did that a short while back. It's the layout of the card I'm having trouble with. <br> <br>The card is two color, PMS 7542 (a muted blue)is used in the mark, in 100%, 80%, and 60%. The other color is a very dark gray. Faceplate sans (two points to whoever points this out from an earlier 'rejected' logo) <br> <br>I should ad, Sogno (pronounced sone-yo) is a textile import company, similar to IKEA but, more focused in the 'bedroom' side of the business. <br> <br>So feedback would be helpfull. <br> <br>Hildebrant. <br> <br></p>
