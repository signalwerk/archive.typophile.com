    html: "<p>Kyle, I like this. <br> <br>I kind of like Faceplate because it's kind of quirky and friendly but feels refined and modern enough. <br> <br>The mark is good, and I think you should stick with it. Pillows, rugs, curtains, and tablecloths? <br> <br>Tim's suggestion about the grey makes sense, but I haven't ever seen their range of product. A warmer grey almost brown could be pretty nice. Especially with the blue. Dark brown suit and a nice blue shirt.  Maybe they're too cool for brown. <br> <br>You may have tried all this stuff already so take it for what it's worth: <br> <br>What happens when you layout the card horizontally? Could you hang the mark in the left corner and stack info underneath the  sogno logotype aligned with the s? <br> <br>If you stay vertical what about aligning the information text with the imaginary centerline of the logo? <br> <br>Hang in there. Let us know what goes on. <br> <br>Jon</p>"
