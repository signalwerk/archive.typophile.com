    html: <p>It's not very visually interesting.  The "explosion" doesn't seem to come from any particular point, and the red/orange divide will be almost impossible to see at any smaller size.  Typographically speaking, Times New Roman has been used over and over again by every non-designer on the planet, and it's lost any sense of uniqueness it once had.  I can't say I'm a big fan of letterspaced small caps, either.  Do some sketches by hand and see what you can do to make it a little less staid.</p>
