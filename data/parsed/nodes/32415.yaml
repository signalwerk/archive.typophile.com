    <p>Hi,</p>
    <p>I have to recent logos here that I made about four months ago. I'd like some feedback on them. The first one is finished but changes can be made, haven't finihsed the website yet and just started making the businesscards.</p>
    <p>Deadline Visual Arts (great name)</p>
    <p>This is for a production company, founded by a friend of mine. I'm also part of the company, making dvd covers and stuff. Anyway the idea is to portray the company as serious and poweful, with a little hint of humor maybe. They make very low budget movies but we make everything look like it's with a little bigger budget :)</p>
    <p><a href="http://www.petergranfors.com/layout/deadline_logo_big.jpg" title="http://www.petergranfors.com/layout/deadline_logo_big.jpg">http://www.petergranfors.com/layout/deadline_logo_big.jpg</a></p>
    <p>Dina IST 2006</p>
    <p>This project is over and done. It was a mobile TV project displayed at the Helsinki IST fair last year that lasted for three days. Dina is our schools tv channel. The logo aint perfect but and I'd like some pointers on this one as to what I could've done diffrently and improvment suggestions.</p>
    <p><a href="http://www.petergranfors.com/layout/dinaist_logo_big.jpg" title="http://www.petergranfors.com/layout/dinaist_logo_big.jpg">http://www.petergranfors.com/layout/dinaist_logo_big.jpg</a></p>
    <p>PS. I'm pretty new to typography. I don't have much knowledge about it and I just ordered a typography book to get a little more insight into the world of typography and design in general.</p>
    <p>thanks<br>
    peter</p>
