    date: 2013-02-24T13:32:00
    date_raw: 24 Feb 2013 — 1:32pm
    votes: null
    html: "<p>I l and 1 end up looking very similar in many sans serif types because the designer is looking for a particular clean aesthetic in the appearance of text, which is disrupted by the introduction of features that would differentiate these letters, such as putting a tail on the l or bars on the I. [BTW, I've come to the conclusion that the latter is entirely legitimate in a sans serif design, and the bars do not consitute serifs: the barred form of I is an ancient variant of this letter found in many forms of writing independent of the presence or absence of serifs.]</p>"
