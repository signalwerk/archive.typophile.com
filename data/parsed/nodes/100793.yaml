  - id: 544479
    user: 11578
    date: 2013-02-23T23:07:00
    date_raw: 23 Feb 2013 — 11:07pm
    votes: null
    html: |-
      <p>Many typewriters didn't have a numeral 'one' or an exclamation mark. You used the lower case "L" for one, and and apostrophe-backspace-period for an exclamation mark. Zero-Oh is an ongoing problem, as are all ambiguities for keyboarding programming languages, where the difference between the right and wrong character is the difference between success and failure. But as stated before, in plain text the ambiguities are usually self-evident from the context, and the type designers don't have to downplay their aesthetics.</p>
      <p>But overall, you're absolutely right. It's a stupid idea to have different characters have the same glyphs!</p>
