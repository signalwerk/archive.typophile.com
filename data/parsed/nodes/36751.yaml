      <p>The concern I have with most of the last roughs you posted, is that they look very crammed (like the 2nd from the left in the middle row). As in; there is, in my opinion, too much going on. There are the graphic images, the wordmark, and then you incorporated some of the parts of the images into the wordmark as well. <em>And</em> then there is also the tagline.<br>
      I would stick with a wordmark plus the image, and don't put any more doodles around it.<br>
      You might find a solution for the tagline, but check if you really need it. You can always put that tagline in another way on your stationary (or whatever you will put it on).</p>
