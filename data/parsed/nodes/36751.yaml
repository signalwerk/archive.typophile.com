    <p>Hi,</p>
    <p>I wondered if you might have some ideas on this rough BW logo design i've done. I need to align and tidy up, but wanted to find out what you all thought. I work in print mainly these days, however when I registered the name I was doing more new media.</p>
    <p>I wanted to reflect the following key words:</p>
    <p>professional<br>
    forward moving<br>
    Clean<br>
    Works black and white and colour<br>
    fluid<br>
    timeless<br>
    fresh<br>
    solid<br>
    print and new media</p>
    <p>I've keep the play symbol small as I don't want to reflect new media too much more a balance. Although the font is 1970's est I think it does give a modern feel. Do you think there is a better way to go, more symbolistic way, using more of the play button logo.</p>
    <p>Cheers for your thoughts</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/logoMPD_6538.jpg"></div><p></p>
