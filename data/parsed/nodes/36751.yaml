      <a href="http://www.die-gestalten.de/fonts/detail/?id=be0db8100b6598b2010bf2f39a980049" title="http://www.die-gestalten.de/fonts/detail/?id=be0db8100b6598b2010bf2f39a980049">http://www.die-gestalten.de/fonts/detail/?id=be0db8100b6598b2010bf2f39a9...</a></p>
      <p>insignia<br>
      <a href="http://www.linotype.com/872/insignia-family.html" title="http://www.linotype.com/872/insignia-family.html">http://www.linotype.com/872/insignia-family.html</a></p>
      <p>ff super grotesk<br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_super_grotesk/" title="http://www.fontshop.com/fonts/downloads/fontfont/ff_super_grotesk/">http://www.fontshop.com/fonts/downloads/fontfont/ff_super_grotesk/</a></p>
