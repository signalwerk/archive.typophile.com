      <p>I like the fact that it has an idea behind it. Honestly, I've seen controls such as play, pause, ff, etc., used many, many times, but the fact your logo is something more than just a typeface counts for a lot in my book.</p>
      <p>Personally, and this is totally subjective, I think the font looks dated and sorta stale. But that's just me. What matters most is if you like it and can live with it.</p>
      <p>I am assuming you will tidy up the kerning, expecially that l/a combination.</p>
      <p>Finally, the small strapline is going to get lost when the logo comes down to a smaller size. I think this small tagline is important because without it your name strikes me as more of a technology than a service provider.</p>
      <p>Nice idea.</p>
