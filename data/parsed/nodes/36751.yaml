      <p>There is this other topic in the forum: <a href="http://typophile.com/node/36338" rel="nofollow">wordmark for visual artist</a></p>
      <p>The designer wrote:</p>
      <p><cite>Key words are, empowerement, luxury, contemporary, approachability and possibly subtly suggest her asian influence (specifically japanese).</cite></p>
      <p>And my reply was:</p>
      <p><cite>Anyway, I think you’re aiming *way* too high — five “keywords” which appear to be contradictory with each other to the common sense. I wouldn’t even know how to unify “empowerment” with “luxury”, or “luxury” with “approachability” — I’d say “luxury” pretty much negates the other two.</cite></p>
      <p><cite>If anyone actually pulls it off to deliver something that echoes all your five “keywords” to the majority of the audience, I’d call him a grandmaster of design without any hesitance.</cite></p>
      <p>What you're trying to do reminds me strongly of that -- particularly your reaching for "fluid" and "solid" at the same time.</p>
