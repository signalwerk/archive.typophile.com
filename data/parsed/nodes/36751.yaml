    html: <p>Just another point. Do you really need the 'ltd' in your stapline? As far as I'm aware, at least in New Zealand, you don't need to have the 'ltd' in your branding – it's just part of your trading name. Just having 'mediaplay design' will look much nicer, and you'll avoid readability issues mallbright mentioned when scaled down. If you stick with that composition, you can make 'design' larger, with the extra room and I'd suggest trying setting 'design' in all caps to make it more snug in there and get rid of any awkward spaces you're generating in there with the ascenders of the lower case.</p>
    html_clean: <p>Just another point. Do you really need the 'ltd' in your stapline? As far as I'm aware, at least in New Zealand, you don't need to have the 'ltd' in your branding – it's just part of your trading name. Just having 'mediaplay design' will look much nicer, and you'll avoid readability issues mallbright mentioned when scaled down. If you stick with that composition, you can make 'design' larger, with the extra room and I'd suggest trying setting 'design' in all caps to make it more snug in there and get rid of any awkward spaces you're generating in there with the ascenders of the lower case.</p>
