      <p>Wow. That's a big question. I think that the search is one of the big joys of typographic design!</p>
      <p>Here's what I suggest. Visit some of the foundries and see what YOU think.</p>
      <p>Go to:</p>
      <p>Sudtipos<br>
      Foundrytypes<br>
      Veer<br>
      FontShop<br>
      MyFonts<br>
      Die-Gestalten<br>
      etc.</p>
      <p>Then, start poking around Typophile and look at the font IDs. There are lots of treasures to be found and the beauty is you get to see them in use. Tip: Search Typophile using Google as opposed to the built-in search function. You'll get more results. Instructions on how to google site specifically lie elsewhere on the site.</p>
      <p>Make printouts of all the fonts you like. Put them on the wall. Then, walk away for a few days and see how you feel when you get back.</p>
      <p>We expect a full report!</p>
