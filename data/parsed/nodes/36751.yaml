      <p>I've been working away, looking through loads of fonts and have come up with a list to go on my wall to look at. The resources here are fantastic, apart from reading elements of typography and general looking at fonts in sample books and books I really haven't had a clue about what fonts to use and how to go about them best. I feel looking through the site I made a little process in visually understanding it all a bit more. I worked out that I wanted to go with a more fluid, open and clean font rather than the constricted one I was looking at. I went with fonts with short accenders and decenders as there are quite a few, and this makes it more neat and compact. It gave it a dial like feel which worked well with the play element. I ended up not liking my previous effort. I thought my efforts were amateurish. </p>
      <p>the contenders (again drawn to the 1970s)</p>
      <p>chalet tokyo<br>
      New york and paris 1970</p>
