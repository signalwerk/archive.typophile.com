    html: |-
      <p>When I mentioned resemblance to the Big Mac, I actually meant the "m" you had there. Obviously I didn't communicate that clearly enough, since you're still keeping it.</p>
      <p>Also, the rounded corners of the triangle should be much more visible -- with significantly larger rounding radius.</p>
      <p>Now, allow me to suggest the following concept:</p>
      <p>1. Create a rectangle with rounded corners -- thick white outline, no fill;<br>
      2. Add a vertical stroke in the middle and erase the bottom side -- now you have a "m" which is symmetrical and without double swing;<br>
      3. Put a triangle with rounded corners around the "m" -- black fill, one angle pointing downwards;<br>
      4. Rotate the whole thing, which should still be left-right-symmetrical until this point, 30 degree clockwise.</p>
