      <p>Once i've made up my mind, its to the drawing board to work on the logo.<br>
      I want to incorporate a play symbol in a circle somewhere as a graphic. My tagline will be something like switched on design or forward thinking</p>
      <p>Any thoughts on these fonts above would be gratefully received</p>
