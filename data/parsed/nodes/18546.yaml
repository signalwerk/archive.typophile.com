      <p>The Greenlandic kra is a lowercase letter with no uppercase form. It should conform to the proportions of the lowercase letters and be x-height tall. The serif treatment of the top of the left stem is best harmonised with that of the corresponding serif on the lowercase u (note that this is often flatter than the serif on the n to which Paul refers). The right side may be identical to that of the k, but if the latter is particularly jaunty you may want something more stable for the kra, as in Minion Pro:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ikrak.png"></div><br>
      The Kalaallisut orthography was reformed in the 1970s, and kra is now considered obsolete. However, it may occur in older documents whose spelling needs to be preserved when digitised, so the character remains useful. Also, it is quite easy and hence fun to make.<p></p>
    html_clean: |-
