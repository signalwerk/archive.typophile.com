    <p>Is it usefull to use a common small cap letter K for the glyph "<a href="/node/36936" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">kgreenlandic</a>" (uni0138)? Due to the fact most small caps are a bit higher than the common x-high, should this K have the same x-high? </p>
    <p>Have anyone real world examples of the usage of this glyph? Is it used on the beginnigs of words only?</p>
    <p><a href="http://www.fileformat.info/info/unicode/char/0138/index.htm">http://www.fileformat.info/info/unicode/char/0138/index.htm</a> -<br><a href="http://www.eki.ee/letter/chardata.cgi?ucode=0138">http://www.eki.ee/letter/chardata.cgi?ucode=0138</a></p>
