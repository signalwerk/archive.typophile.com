      <p>Thomas,</p>
      <p>I do page layouts all day long in the States. I deal with one art director in Paris who wants everything done in Illustrator. I'm sorry, but when one is laying out a 40 page brochure -- and page 6 is being moved to page 13, and 21 is half left on 21 and the other half moved to page 30 and followed by page 30 is now 31 and toss 31... one who is aware of production and production time stays within a page layout program.</p>
