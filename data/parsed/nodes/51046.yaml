    <div class="info">Submitted by <a href="/user/1794" title="View user profile.">Ralf Herrmann</a> : 29.Oct.2008 1.50am </div>
      <p>In 1930 Jan Tschichold describes a new typeface in the publication “Börsenblatt für den Deutschen Buchhandels”, that “can be drawn by everyone without typographic knowledge”. Sebastian Nagel from Austria extended the original drawing to 7 weights (black, extrabold, bold, semibold, regular, semilight and light), with full coverage of the Latin 1 character set. All fonts include small caps and alternate characters.</p>
    <p>More information can be found at:<br>
    <a href="http://www.fonts.info" title="http://www.fonts.info">http://www.fonts.info</a></p>
