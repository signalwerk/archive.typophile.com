    html: <p>I like the wording of the "accent", that is in the last example of mine - but seems like people don't (it's hard to get rid off this feeling since everyone is trying to suggest yet another variant). So what's wrong with mine? :D Just tell me straight. Is it too plain and simple? Not really expressive? Dull?... <br> <br>What bothers me is the type treatment of the "accent" - thus a bigger rendering. Also, I would like to hear more about the usage of secondary typeface (ITC Legacy Sans, as already mentioned) for the "hr solutions" phrase. I normally try to stay with one typeface throughout a logotype, but in this case I find using the same typeface for the smaller lettering a bit weak - it looks poor, I would even say badly legible. (Seems, like I am critisizing myself even more, than the others :D ). <br> <br>Anyway, these two points bother me. And as this seems to be a really quick job (that is - next week the client has to have stationery and a bilingual website running), I think it's a high time deciding on a logo. <br> <br>Not that I am in a hurry, but... you know...</p>
