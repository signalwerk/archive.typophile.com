    date_raw: 19 Nov 2003 — 8:43pm
    votes: null
    html: "<p>Hi Alex, <br> <br>Don't know where you are with this job right now. Too late for feedback? <br> <br>Why did you choose the e for the accent? Just curious. Kinda makes me want to put the emphAsis on the wrong sylAble. What if it was on the a? I prefer #2 of your examples. It is more visually dynamic. <br> <br>Also, I'm not crazy about Melior. It's a fine typeface, but in this case seems to lack personality. Try this (it might help with your design slump too :-) Print it out the word set in Melior nice and big. Get out some translucent paper (tracing etc) and work over the letters with a pencil. Alter the letterforms a bit, make it more like a bodoni, make it more like a slab serif, try a more even weight, try a sans serif Melior.  Move quick and use lots of paper. <br> <br>Oh, can it just be Accent HR? That rolls so much better. Words like solutions in a logo don't really add much IMHO. But clients will be clients. </p>"
