    html: "<p>I am unadequate lately and I might have misunderstood some comments here, so I'll keep that to me. Thanks for input in any case. <br>Here is the next portion (portion? I hope this one IS the last one) - and I accidently found something new. How do you like it? It's a human resources company, if you remember. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/21091.gif\" alt=\"\"> <br> <br>As you see, I also tried the accent intrusion - doesn't really work very well. \"Comet\" thing is better, slicker, I would say. And then a human comes. How \"bad\" is that? <br>To the typefaces. I have access to Adobe FontFolio, the pre-latest version, I think. I miss some fonts, but that's ok. My choice is basically limited to the Adobe type. If the type is chosen and approved, I go to myfonts.com and buy it. Yes, FontFolio cost me $3 for a cd in my motherland, but I do buy typefaces and tell the client, that he *needs* to buy one (normally, a family), if he doesn't want any problems. Nobody - nobody - wants. Just interested - how would you try a FF font or Linotpye font (I miss those so much), if you don't have one on your harddrive? Just curious. <br>Also, why do I keep using Legacy throughout the designs? I do not know, how good or bad it is to use the same face in the logo and stationery and everywhere. Normally, a logo would be one font and corporate work horse would be something different. This time Legacy caught my heart, when I saw it in a letter. I do not know why I am trying to apply it for a logotype. Maybe I am wrong at this point. <br>So, that's why so many different faces. The client will definitely see less. <br>Now you turn. I hope, the last round for this job. <br> <br>Best regards to this board, <br>Alex <br> <br>ps. upper row: Legacy Sans; middle row: Delta and Stone Sans; lower row: Legacy and Stone</p>"
