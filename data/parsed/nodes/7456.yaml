    html: <p>John, <br> <br>I had a look at FF Unit and it seems as though it would sit quite well against Proforma. DTL Prokyon, I'm not so sure about that one - just worried about the letterforms grabbing too much attention sometimes. <br> <br>Hrant, <br> <br>Managed to have a look at FB Amplitude and printed out the PDF samples. I just don't like the letterforms of groteques? and find the optical/printing adjustment of the stroke junctions to be distracting. <br> <br>I do agree with your point regarding Lexicon and feel that Proforma would be more appropriate. <br> <br>Thanks, <br> <br>Grant</p>
