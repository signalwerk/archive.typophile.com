    html: <p>Jason, <br> <br>Thank you for suggestion about FB Amplitude. I have tried to take a look at the FB site a couple of times this morning and it seems to be offline - I will persist. <br> <br>John, <br> <br>With regards to contrast and harmony, that's a tricky one. It is easier (I think) to develop a harmonious solution, especially with pairing Proforma with Productus. But it may be a touch too close (brother/sister!), perhaps a cousin or strange aunt/uncle would be more interesting! <br> <br>Contrast? Much harder to well and with a degree of subtlety and consideration. Have looked at Process Types Locator/Locator Display - but not sure how well that one works... <br> <br>My apologies to the forum moderator for the multiple post - received error messages and re-posted. Please delete the redundant posts. <br> <br>Thanks, <br> <br>Grant</p>
