  html: <p>Long time lurker, first-time poster! <br> <br>I have been asked to provide some input on font selection and overall design for a prospectus-type publication for an architecture &amp; design research centre. <br> <br>The preferred text faces are either TEFF's Lexicon No. 2 or Font Bureau's Proforma, the main challenge now is to make a choice regarding the selection of a suitable font for the 'secondary' text elements (headings, subs, captions etc...) - preferably a sans-serif.  <br> <br>Images and graphic materials will form a large component of the overall content, although there will also be substantial bodies of text. The proposed size is around A5-ish, to enable easy and economical postage, and as a result some of the text blocks may be set at quite small sizes (6-7pt). <br> <br>Any suggestions with regard to either text or sans/display fonts would be most welcome (although the preferences for Lexicon and Proforma come from above!). <br> <br>Please excuse the mangling of the typographic language for I am just a simple architect - but a passionate typophile! <br> <br>Thanks, <br> <br>Grant Dunlop</p>
  html_clean: <p>Long time lurker, first-time poster! <br> <br>I have been asked to provide some input on font selection and overall design for a prospectus-type publication for an architecture &amp; design research centre. <br> <br>The preferred text faces are either TEFF's Lexicon No. 2 or Font Bureau's Proforma, the main challenge now is to make a choice regarding the selection of a suitable font for the 'secondary' text elements (headings, subs, captions etc...) - preferably a sans-serif.  <br> <br>Images and graphic materials will form a large component of the overall content, although there will also be substantial bodies of text. The proposed size is around A5-ish, to enable easy and economical postage, and as a result some of the text blocks may be set at quite small sizes (6-7pt). <br> <br>Any suggestions with regard to either text or sans/display fonts would be most welcome (although the preferences for Lexicon and Proforma come from above!). <br> <br>Please excuse the mangling of the typographic language for I am just a simple architect - but a passionate typophile! <br> <br>Thanks, <br> <br>Grant Dunlop</p>
