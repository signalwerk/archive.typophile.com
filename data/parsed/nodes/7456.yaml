    html: <p>One question you'll have to ask yourself is whether you want harmony or contrast from your pairings. <br>If harmony, Productus is the sans Petr Van Blockland designed as a companion for Proforma.</p>
    html_clean: <p>One question you'll have to ask yourself is whether you want harmony or contrast from your pairings. <br>If harmony, Productus is the sans Petr Van Blockland designed as a companion for Proforma.</p>
