      <p>I didn’t mean a mimicry of Arabic calligraphy, that would be totally ridiculous :)</p>
      <p>I am suggesting that maybe there exists a roman designed for Turkish which is not based on Western historical forms. Or you could take the no-holds-barred approach of using something postmodern / unusual. Then there’s the ’when in doubt, use something Swiss’ approach which usually works for just about anything, though robs it of personality. A neutral position using a neutral typeface from a neutral country. So your choices in this instance would be a typeface from :</p>
      <p>Switzerland<br>
      Sweden<br>
      Finland<br>
      Austria<br>
      Mexico<br>
      Ireland</p>
      <p>I don’t know whether Liechtenstein, Costa Rica and Turkmenistan have the graphic design scene (or population) necessary to produce fonts for international sale. But the countries listed above do, the first three definitely have active type foundries (Optimo, MAC Rhino, Suomi, Psy-Ops, Fountain...) </p>
      <p>Perhaps this is a direction you could try to keep things objective. And good old Helvetica fits this criterion. The Swedish type foundries in particular are prolific.</p>
