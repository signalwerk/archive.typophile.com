    <p>I would welcome any opinions. I’m looking at type for an expanded exhibition catalogue featuring contemporary Iraqi book art. There will be several essays—maybe 76 pages or so of largely unillustrated text. Some footnotes, probably to be set as endnotes.</p>
    <p>My thinking is that most faces appropriate for setting medium length texts carry a western baggage that doesn’t add much to the idea of the book. I’ve found a few solutions on my own, but I don’t want to color the discussion yet.</p>
    <p>There are 17 featured artists. Here is a sample cover image of one of the books by Mohammed al-Shammerey.<br>
    </p><div class="imageWrap"><img src="/files/15C_6345.jpg"></div><p></p>
