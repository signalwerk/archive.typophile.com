    html: |-
      <p>Not so much an Eastern feel. I don’t think mimicry of Arab script is right on this.</p>
      <p>I think the international feel is the direction I’m looking. I don’t want the type bound to a particular period in Western typographic history that has zero resonance with the subject. That rules out most of the pure classics. Some of the very neutral sans faces could work in that they might avoid offending, but they may not be right for the length of the combined texts. The texts (at least the early versions) are fairly politically charged. That makes any playful lightness in a face look comical.</p>
      <p>I’ve almost been seduced a few times so far, and have almost settled in. I was looking for someone to shake me up one more time. Thanks for reviving the thread BTW.</p>
