    <p>I'm designing a logo right now and wanting to be typographically correct. The tag line of the logo is kerned large to fit under the name of the company. There is a comma and period in the tag line. Should the comma and period be kerned the same amount as the letters?</p>
    <p>Here is my an example of what I'm trying to explain.</p>
    <p>M A N A G E M E N T  C O M P A N Y ,  I N C .</p>
    <p>or...</p>
    <p>M A N A G E M E N T  C O M P A N Y,  I N C.</p>
    <p>Thanks.</p>
