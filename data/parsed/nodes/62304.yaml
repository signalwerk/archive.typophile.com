      <p><cite> &gt; I’m using spaces between the words... I have no idea why it’s not displaying on the post.</cite></p>
      <p>The Smarty Pants routine on Typophile automatically closes up multiple spaces. If you want to indicate extra spaces you'll need to hard-code in a &amp;nbsp; or two.</p>
      <p>Don't track the punctuation as fully as the rest of the caps. But don't have them fitted tight either. They shouldn't stand out on their own by having too much space; nor should they cause a darkened spot by being unnaturally close in.</p>
    html_clean: |-
