      <p>Any particular reason why you are including 'Inc'.?</p>
      <p>I understand it's the formal name of the company but I'm a big believer in not including 'INC.' 'LLC', 'LLP', or 'CORPORATION' in logo design. No where does it say you need to spell out the full legal name of a company in their mark.</p>
      <p>Take a look at Fortune 500 company logos and you never see them. Below are just a few.</p>
      <p>Nike, Inc.<br>
      PepsiCo, Inc.<br>
      McDonald's Corporation<br>
      Adobe Systems Incorporated<br>
      Apple, Inc.<br>
      Yahoo, Inc.<br>
      Microsoft Corporation<br>
      IBM Corporation<br>
      Hewlett-Packard Development Company, L.P.</p>
