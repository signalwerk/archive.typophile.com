      <p>My thoughts would be that if you're not going to use any spacing in the line at all between words or punctuation, then you should kern them the same as the letters (the top example).  This way they don't get lost and aid legibility.</p>
      <p>Is there any particular reason why you're not using spaces in the line?</p>
