    html: <p>The descriptive inc is dependent on company condition and location. For example, the UK equivalent might be ltd or plc. Consequently, if your client anticipates that they might change size, or that they might one day operate in new locations, or that government regulations might one day be revised - then maybe they are obliged to drop the inc from their logo?</p>
