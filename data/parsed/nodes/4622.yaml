  html: <p>Discuss some of the features of typeface that may have been lost in the transitions from metal to photosetting to digital ypesetting. what is being done in current font technology to remedy this loss?</p>
  html_clean: <p>Discuss some of the features of typeface that may have been lost in the transitions from metal to photosetting to digital ypesetting. what is being done in current font technology to remedy this loss?</p>
