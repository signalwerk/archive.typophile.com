    html: "<p>\"I can certainly tell a difference between digital Bembo and the metal Monotype version in a copy of Fine Print (or one of Mr. Tufte's books) and I prefer the metal.\" <br> <br>Addison <br> <br>You should be able to tell a difference as the digital typeface that was optimized and printed letterpress in Fine Print was Minion MM, not Bembo. Interestingly, none of the readers of Fine Print saw the difference in the typefaces until the publisher informed them in the next issue. <br> <br>FYI: An interesting anomaly with the digitized Bembo and Centaur is that when they are converted and printed letterpress with photopolymer plates, they have a great deal more structural strength than they ever had as metal faces. We were always ordering lowercase e sorts for Bembo because they wore out so fast. Not so with the dissimilar substructural integrity of photopolymer. <br> <br>Gerald Lange <br> <br> <br> <br></p>"
