    html: "<p>Probably the biggest loss that comes to mind is optical scaling. In metal, each size was inherently different anyway, but when automatic scaling was introduced (way before phototype - I'm talking about the Benton pantograph) the desire to save money overpowered quality. The good news is that some designers are slowly coming back to optical scaling. <br> <br>Another thing that was lost is the softness of the border between black and white. I think this might actually be the main reason letterpress is more readable (when done really well). I have a hunch that offset is simply too crisp, and our perceptive system cannot become very comfortable with such stark borders. I can think of one way to address this issue: unfocus the laser in an imagesetter (but microscopically). As an aside, I don't think either the randomness or the relief effect of letterpress are really important/positive. Randomness is lack of information, and we don't read with our fingers (unless it's Braille). <br> <br>And a third thing is trapping. In the metal days: a size couldn't be used larger, so traps would never become obvious/distracting; and bleed was greater, so trapping was more necessary. In digital, traps are still necessary much of the time, but not enough to \"register\" in the mind of most designers. Interestingly, phototype was really hazy so they actually used a lot of traps - and they even used thorns: the sharp protrusions at corners to help them keep their sharpness. Virtually nobody does thorns in digital type.  <br> <br>-- <br> <br>But we've also gained a lot. Most of all <i>potential</i>, even though it remains largely unrealized. <br> <br>hhp <br></p>"
    html_clean: "<p>Probably the biggest loss that comes to mind is optical scaling. In metal, each size was inherently different anyway, but when automatic scaling was introduced (way before phototype - I'm talking about the Benton pantograph) the desire to save money overpowered quality. The good news is that some designers are slowly coming back to optical scaling. <br> <br>Another thing that was lost is the softness of the border between black and white. I think this might actually be the main reason letterpress is more readable (when done really well). I have a hunch that offset is simply too crisp, and our perceptive system cannot become very comfortable with such stark borders. I can think of one way to address this issue: unfocus the laser in an imagesetter (but microscopically). As an aside, I don't think either the randomness or the relief effect of letterpress are really important/positive. Randomness is lack of information, and we don't read with our fingers (unless it's Braille). <br> <br>And a third thing is trapping. In the metal days: a size couldn't be used larger, so traps would never become obvious/distracting; and bleed was greater, so trapping was more necessary. In digital, traps are still necessary much of the time, but not enough to \"register\" in the mind of most designers. Interestingly, phototype was really hazy so they actually used a lot of traps - and they even used thorns: the sharp protrusions at corners to help them keep their sharpness. Virtually nobody does thorns in digital type.  <br> <br>-- <br> <br>But we've also gained a lot. Most of all <i>potential</i>, even though it remains largely unrealized. <br> <br>hhp <br></p>"
