    html: '<p>"Frederic Goudy cut his own type, right? Did he anticipate the finer execution of printing..." <br> <br>Addison <br> <br>Goudy did cut punches from certain of his designs and cast, but not for production. Most of his commercial designs were cut and cast by foundries. Nevertheless he was not often happy with the cuttings and reworkings. <br> <br>On the other hand, despite what he occasionally wrote about "quality," Goudy is notorious for not really caring about the quality of the setting of his typefaces, just how well the foundries were able to render his designs. If you look closely at the typesetting of some of the books he printed you will notice they are often set far too tight. Not a fellow who was concerned with readability as much as a deligent follower of the Morris ethos. <br> <br>Some other items of possible interest here: <br> <br>He felt optical scaling of typefaces was not a crucial consideration and was not interested in the effort involved in the creation of multiple master drawings. <br> <br>He welcomed photofilm typesetting with open arms  (most typographers did actually) even if it was to result in a decline in quality. <br> <br> <br>Sorry to damage the myth. <br> <br>Gerald Lange</p>'
