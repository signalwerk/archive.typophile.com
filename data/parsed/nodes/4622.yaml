    html: <p>Hrant <br> <br>I've always been amazed by the lack of optical sizing in digital fonts. Not so much by the failure of most foundries to provide it, but in the failure of typographers to incorporate it in their routine design, especially so since the tools for creating even a basic rendering of optical scale by ranking weights was available quite early on. Fontographer was the most long lived of these, followed now by FontLab. <br> <br>In regard to letterpress, hey!!! The relief effect is much more cherished today than it was during most of the history of printing. Printers would do anything to get rid of it, calendaring the paper after printing, dampening the paper afterward, etc. But on randomness I will have to disagree. You are speaking of distortion caused during printing I assume.  <br> <br>Don't know if you knew this though. It has long been thought that randomness was deliberately incorporated into many of the typefaces of the early printers, up until the beginning of the type foundry and the standardization of casting production. New evidence on the DK-Type, attributed to Gutenberg, suggests that it is possible that the single letterforms may have been composites of variant letterform pieces put together in punch form and cast that way to mimick the natural variance of handwritten letterforms. <br> <br>Does this effect readability? Certainly the earliest printers must have thought it crucial to the potential readers (buyers) of their time to simulate as much as possible the handwritten word. I don't want to go Emigre on you but... <br> <br>Gerald</p>
