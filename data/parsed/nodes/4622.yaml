    html: <p>Hrant <br> <br>The 5% I was talking about was not during the letterpress printing process, but a gain from neg to plate during the platemaking process. I read a technical report where it was suggested as 5%. This would be across the board and have nothing to do with the type size, but rather WHATEVER imaging was being transformed. <br> <br>Which brings up a question that perhaps both Nick and you can help me with. Since the film negative is photoexposed on to the plate material, would not a properly configured letterpress face not only have a weight reduction in its main strokes, stems, etc, the inclusion of ink traps, but but but, thorns as well? Or did the photofilm process require thorns because of camera distortion, different kind of lighting exposure, etc.? <br> <br> <br>Gerald</p>
