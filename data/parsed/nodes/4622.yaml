    html: <p>Some argue that digitizations have been created from the metal types themselves instead of from the page on which they have been printed, resulting in a more fragile form. Types such as Monotype Bembo, Spectrum, and Centaur are victims of this (so I've read). <br> <br>Also, in letterpress no two letters looked exactly alike because of the ink impression. <a href="http://www.letterror.com/foundry/beowolf/index.html">Beowolf</a> from LettError is a response to that. The font is "programmed" to produce variations of the same letter in a sequence. <br> <br>These are just a couple of things off the top of my head. I'm sure others here can give some good insight. <br> <br>-Addison</p>
