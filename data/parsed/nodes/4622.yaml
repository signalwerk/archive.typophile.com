    html: <p>During the revival period I believe many metal faces were redrawn from printed specimens sheets, but many, if not most, of the faces that are associated with the metal type libraries of Linotype, Monotype, Ludlow, have actually been digitized from photofilm versions. Um, with the notable exception of Lanston. And brilliant that was Gerald G. <br> <br>I know of a few exceptions with Monotype Typography as well. The digital Dante and, most likely the Pastonchi, were redrawn from master patterns of the metal type. <br> <br>I believe that at one point Ludlow UK was quite intent on buying up old Ludlow film from a source in Canada for their digitizations. <br> <br>But to get more to the original question. You would not actually want to preserve a metal face per se for digital as you would not have wanted to for photofilm. The printing technologies associated with these type technologies have/had different needs and require/d different approaches. <br> <br>Reversing the situation, printing digital type letterpress, is a whole other animal. There, yes, the considerations of the how and why of the design of a metal type face are quite crucial, and not easily replicated with the available tools. <br> <br>Gerald</p>
    html_clean: <p>During the revival period I believe many metal faces were redrawn from printed specimens sheets, but many, if not most, of the faces that are associated with the metal type libraries of Linotype, Monotype, Ludlow, have actually been digitized from photofilm versions. Um, with the notable exception of Lanston. And brilliant that was Gerald G. <br> <br>I know of a few exceptions with Monotype Typography as well. The digital Dante and, most likely the Pastonchi, were redrawn from master patterns of the metal type. <br> <br>I believe that at one point Ludlow UK was quite intent on buying up old Ludlow film from a source in Canada for their digitizations. <br> <br>But to get more to the original question. You would not actually want to preserve a metal face per se for digital as you would not have wanted to for photofilm. The printing technologies associated with these type technologies have/had different needs and require/d different approaches. <br> <br>Reversing the situation, printing digital type letterpress, is a whole other animal. There, yes, the considerations of the how and why of the design of a metal type face are quite crucial, and not easily replicated with the available tools. <br> <br>Gerald</p>
