    html: <p>Since processers are so much faster and memory so much cheaper than 20 years ago, Postscript Level 4 will have an option to consider supplied font outlines as metal punches and model the transfer of ink from punch to paper. It will be able to produce randomly distinct variations for each instance of a character on a page (optionally, since this is slower) and will have parameters corresponding (at least) to pressure and viscosity, while<i>where is that horrible beeping noise coming from oh hell is it morning already?</i> <br></p>
