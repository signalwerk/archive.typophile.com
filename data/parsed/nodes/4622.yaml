    html: <p>Mr. Giampa, <br> <br>Thanks for linking to that article--I had looked for it to link in my post. <br> <br>I'm not sure where I stand on the inkspread issue, but I've found it interesting. Perhaps it's personal preference, but I can certainly tell a difference between digital Bembo and the metal Monotype version in a copy of Fine Print (or one of Mr. Tufte's books) and I prefer the metal. Many foundries are now creating optical sizes, or at least text and display, as opposed to one homogenized font--a great improvment. <br> <br>I have a printed copy of your Caslon specimen and a copy of the 1924 G.W. Jones Caslon specimen. I'll have to take a closer look and compare the digital to metal. (Your Caslon specimen is very lovely, by the way.) <br> <br>Tell me this, Mr. Giampa. Frederic Goudy cut his own type, right? Did he anticipate the finer execution of printing that you expect? In other words, do you feel your digital versions of his types live up to his (Goudy's) expectations of his metal types? And please, this is no attack--I just want to know your opinion. <br> <br>Thanks, <br>Addison</p>
