    html: "<p>Among the things lost: <br> <br>1. Poorly fitted slug-cast italics, and non-kerning f. <br> <br>2. Uncomfortable letterspacing caused by the very limited ability to kern letters easily, especially noticable at large sizes. <br> <br>3. The inordinate expense of purchasing a full font of type, and consequent limitation to a very limited range of text faces, resulting in over-use of a few faces. (Every generation has its Times / Helvetica / Gill Sans [insert your favourite bugbear here].) <br> <br>4. The frequent absence of decent heavy or bold designs for most typefaces (resulting in weird mixtures of incompatible typefaces long into the twentieth century). <br> <br>5. The high expense of cutting fonts at different sizes with the result that many fonts were available only at a restricted range of sizes, sometimes a very restricted range. <br> <br>6. A rich array of printing errors -- type that drops out, damaged type, inverted type, type with blocks around it, filled counters, warn type, overimpression. <br> <br>RIP</p>"
