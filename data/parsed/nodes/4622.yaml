    html: <p><i>&gt;I put both thorns and traps in Worldwide, a newspaper text face. </i> <br> <br>And well done, too, Nick.  <br> <br>My implied point still stands; for the most part, thorns in phototype were a compensation for a photo problem. That problem no longer exists, so the general need for thorns in digital type also no longer exists. (Hrant seems to be implying, above, that today's digital designers are somehow lazier than their forebears for not including thorns in their designs. Perhaps this is not what he meant.) <br> <br>Nevertheless, there are specialized circumstances where they may still be of some value. <br> <br><i>&gt;&gt; How did they save money?  <br>&gt;By making one (or at least fewer*) set of drawings, of course. </i> <br> <br>It should be noted that the initial impetus for the creation of the pantographic punchcutter was not to circumvent the process of optical scaling, as one might surmise from Hrant's rant. <br> <br>The primary reason for the development of the pantographic punchcutter was to allow a person who was not necessarily trained or skilled at punchcutting, to cut a punch by directly following a [much larger] drawing. The device reduced the artistic and mechanical skills that were previously required to interpret a designer's design and cut it very small on the end of a piece of metal. This opened the doors to increased productivity in converting paper designs into metal fonts.  <br> <br>The fact that one could cut different sizes from the same master was a corollary efficiency that some foundries leapt at, while others did not. Linotype, for instance, created separate drawings for every size. M. F. Benton sometimes made different drawings for different sizes of certain letters -- those that could not be optically adapted by adjusting different parameters of the pantograph (or so I understand from conversations with Mike Parker, who studied Benton's drawings at the Smithsonian). <br> <br>So although the demise of optical sizes can be traced to the invention of the pantographic cutter, that was not the goal of its invention. <br> <br>-- K. <br></p>
