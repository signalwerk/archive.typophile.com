    html: "<p>&gt; I believe that all renditions of Californian do not offer optical sizes? <br> <br>Hey, you're \"Mr Lanston\"! So you tell me (I honestly don't know): Did the original metal Californian have optical scaling or not? Obviously I wasn't talking about the digital/photo derivatives. You said \"If you don't like ours, you don't like Californian\", and I'm trying to see if this makes sense or not. <br> <br>If your stuff doesn't have optical scaling and you don't want to admit it, well don't get angry at me. Blame the paucity of the retail font market - that would be understandable. <br> <br>-- <br> <br>It's common knowledge that many digitizations of metal faces are too thin. Bembo is such a case; digital Bembo printed \"normally\" (offset) is anorexic compared to metal Bembo printed \"normally\" (letterpress). I'm not sure what Knuth was talking about, but if you really do believe that people should be listened to in proportion to the quality of the fonts they've actually produced, then all you have to do is look at Computer Modern to totally ignore Knuth. (But as I've said, I don't believe that myself.) <br> <br>hhp <br></p>"
