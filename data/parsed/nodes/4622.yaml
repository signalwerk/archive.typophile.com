    html: <p>Paul <br> <br>Indeed, and much more. Which is why digital type rendered letterpress with the photopolymer process was some form of divine grace. <br> <br>But even with all these things you mention, a significant attribute of letterpress, WAS the hands on aspect. In the right hands, these problems can be dealt with or sidestepped, and in the right hands, the work, and the beauty of the letterpress printed page, can not be matched by any successive process. <br> <br>It ain't dead yet, in fact, with the current revival, one could say letterpress is in a state of remission. <br> <br>Gerald</p>
