    html: "<p>&gt;thorns in phototype were a compensation for a photo problem. <br> <br>You're right, Kent, and in fact thorns are very tiny \"ticks\" of a specific size that will disappear during the photo-reproduction process of photo-typesetting, leaving a sharp corner that would have otherwise become slightly rounded. <br> <br>The point I was making about Worldwide as a news text face was that a similar erosion of detail occurs in the printing process, especially on newsprint, and can be mitigated by type design features that are similar to phototype thorns. <br> <br>Ultimately, there is \"visual bleed\" in the act of seeing, hence serifs.  <br> <br>Thorns on serif type: kinda fractal, and on the back burner is a face with serifs on serifs on serifs... <br> <br>FYI, here are some scans of a phototype character (one high-contrast, the other showing the white opaque used to make negative thorns/ink-traps), artwork for N from Shinn Sans, which I did for Typsettra c.1985. It was used to make both a Diatronic font, and for 2\" phototypositor filmstrip. As you can see there is a thorn on the ink-trap! When Steve Jackaman digitized the face in 1992, he removed all the thorns and ink traps. <br><img src=\"http://www.typophile.com/forums/messages/30/35096.jpg\" alt=\"ShinnN\"> <br><img src=\"http://www.typophile.com/forums/messages/30/35097.jpg\" alt=\"ShinnNcu\"></p>"
