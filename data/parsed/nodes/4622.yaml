    html: "<p>Kent, I did try to sort of hint that the Benton boys were great. And I'm a big fan of \"intent\". But to me the main relevance of the pantograph is its cultural \"contribution\": the de facto reduction of optical fidelity. I think the pantograph was a success because of its scaling more than anything else. The font houses that <i>didn't</i> use the pantograph's money-saving scaling went under [first]. <br> <br>&gt; Hrant seems to be implying, above, that today's digital <br>&gt; designers are somehow lazier than their forebears <br> <br>Well, I don't know if that would be fair to say of the overall, but certainly contemporary designers seem to <i>push the available potential</i> less. <br> <br>-- <br> <br>&gt; a digital face will increase roughly 5% <br> <br>Only for a specific size (12?), because the gain is actually <i>absolute</i> (and typically on the order of one mil = 1/1000 inch). <br> <br>-- <br> <br>&gt; FB Californian has 3 optical sizes <br> <br>Huh. <br>GG, what about yours? <br> <br>BTW, Addison, this is just a little campfire - don't worry. <br> <br>-- <br> <br>&gt; when did [trapping] start? <br> <br>Well, I can tell you about the earliest one I [think I've] seen: in an \"R\" by Guillaume Le Be II. <br>I saw it in a promotional booklet done by a Famous Type Designer, but when I asked him if he could provide me with the original scan/source of the image -because I was interested in the history of trapping- he refused on the grounds that I was seeing things. Unsurprisingly, this FTD doesn't put traps in his fonts, and is against the practice. Maybe he didn't want me to find out that his original model used traps but his \"revival\" didn't? Or maybe I <i>was</i> seeing things. He could have just shown me the original so we could figure it all out. Anyway, I'll find out eventually. <br> <br>-- <br> <br>Paul: Right on! But photopolymer letterpress is sweeeet. <br> <br>-- <br> <br>Nick: U da man. <br> <br>&gt; serifs on serifs on serifs <br> <br>Scriptorium did an April Fools joke like that once. <br> <br>hhp <br></p>"
