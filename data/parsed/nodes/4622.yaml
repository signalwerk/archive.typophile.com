    html: <p>Knuth illustrated a curious tendacy of type technologies replicating earlier type technologies. For reasons of no merit the new technologies never returned to source. The film fonts were bolder than letterpress, the digital fonts, bolder than film fonts. <br> <br>The digital rendition I believe was the work of Autologic. The typface was Janson.  <br> <br>I later noticed that even letterpress typefounders blackened their imitations of other founders typefaces. The Caslon Foundry blackened their own letterpress Caslon Oldstyle in the refitting in 1924(?). <br> <br>Modern typographers would make great balloon blowers at childrens birthday parties. Eventually I predict type will be so inflated paper will be black. <br> <br>Thankfully Gerald Lange and myself have avoided this disease by keeping several ounces of black ink under our fingernails. <br> <br>Most people never wish to shake our blackened hands which allows us great freedom in opinion, such as, "light is bright, bold is black", "Lead is not dead" and that is why "letterpress printers rock". <br> <br>I hope I made my point?</p>
