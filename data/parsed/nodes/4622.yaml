    html: "<p>&gt; randomness was deliberately incorporated <br> <br>Sure, but only to closely mimic handwriting (which we're hopefully beyond now), not to improve readability. You could say the readers of that time were used to reading handwriting, so that would in fact make it more readable, but: <br>1) This is no longer the case now. <br>2) I would argue that immersive reading ignores such conscious factors, and randomness (at least true randomness) can only decrease functionality. <br> <br>Thorns: they're <i>less</i> necessary now, but still not useless. (Nick, great \"news\"! :-) <br> <br>&gt; How did they save money? <br> <br>By making one (or at least fewer*) set of drawings, of course. The pantograph didn't <i>force</i> you to reduce quality, but in the context of capitalism it certainly encouraged it! To be fair, the Benton boys actually tried to get people to keep minding optical scaling (and their own scaling -like in ATF Garamond- is stratospheric), but it's always very hard to convince other people to not save money... Just ask PBS. <br> <br>* Monotype typically made four, I think. <br> <br>hhp <br></p>"
