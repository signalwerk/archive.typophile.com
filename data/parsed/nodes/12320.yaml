    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Ute&nbsp;Harder</strong></p>
    <p>Ute Harder, aka Frau Jenson, moved to Hamburg, <a href="/node/19574" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Germany</a> for university studies after unsatisfying jobs with a pharmacy and then a paper manufacturer. Another year followed with a variety of jobs including the great experience as a scenery assistant at the ‘Ohnsorg Theater’ in Hamburg. In 1994 she studied <a href="/node/add/wiki?edit%5Btitle%5D=Illustration" title="Create node &quot;Illustration&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Illustration</a> and Communication design at the University of Applied Science in Hamburg. In the typography classes of <a href="/node/add/wiki?edit%5Btitle%5D=Jovica%20Veljovic" title="Create node &quot;Jovica Veljovic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Jovica Veljovic</a> she ‘got infected by the typevirus’. In 1999 she digitized ‘<a href="/node/add/wiki?edit%5Btitle%5D=Marathon" title="Create node &quot;Marathon&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Marathon</a>’, a hot metal typeface originally designed by <a href="/node/12125" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Rudolf Koch</a> which received special mention at ‘Kurt Christians Förderpreis’-Contest. Marathon is licensed to the <a href="/node/12172" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype Library</a> GmbH. Frau Jenson graduated with the ‘Diplom-Designer <span class="caps">FH</span>’ in 2002 and since she is working as a freelance graphic designer, collaborating on diverse projects for Linotype and developing her own fonts. Frau Jenson lives and works in&nbsp;Hamburg.</p>
    <p>Type designs by Ute Harder: <a href="http://www.linotype.com/58042/marathon-family.html">Marathon</a>, <a href="http://www.p22.com/ihof/alphainitials.html">Alpha Initials</a>, <a href="http://www.p22.com/ihof/cilati.html">Cilati</a>, <a href="http://www.p22.com/ihof/fjpeople.html">Frau Jenson People</a>, <a href="http://www.p22.com/ihof/tulda.html">Tulda</a>, <a href="http://www.p22.com/ihof/font.asp?font=bastyan&amp;face=bastyan">Bastyan</a>, <a href="http://www.p22.com/ihof/font.asp?font=alpharoman&amp;face=alpharomanpro">Alpha&nbsp;Roman</a></p>
