    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Ute Harder</strong></p>
    <p>Ute Harder, aka Frau Jenson, moved to Hamburg, <a href="/wiki/Germany" class="freelinking" rel="nofollow">Germany</a> for university studies after unsatisfying jobs with a pharmacy and then a paper manufacturer. Another year followed with a variety of jobs including the great experience as a scenery assistant at the 'Ohnsorg Theater' in Hamburg. In 1994 she studied <a href="/wiki/Illustration" class="freelinking" rel="nofollow">Illustration</a> and Communication design at the University of Applied Science in Hamburg. In the typography classes of <a href="/wiki/Jovica%20Veljovic" class="freelinking" rel="nofollow">Jovica Veljovic</a> she 'got infected by the typevirus'. In 1999 she digitized '<a href="/wiki/Marathon" class="freelinking" rel="nofollow">Marathon</a>', a hot metal typeface originally designed by <a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a> which received special mention at 'Kurt Christians Förderpreis'-Contest. Marathon is licensed to the <a href="/wiki/Linotype%20Library" class="freelinking" rel="nofollow">Linotype Library</a> GmbH. Frau Jenson graduated with the 'Diplom-Designer FH' in 2002 and since she is working as a freelance graphic designer, collaborating on diverse projects for Linotype and developing her own fonts. Frau Jenson lives and works in Hamburg.</p>
    <p>Type designs by Ute Harder: <a href="http://www.linotype.com/58042/marathon-family.html" rel="nofollow">Marathon</a>, <a href="http://www.p22.com/ihof/alphainitials.html" rel="nofollow">Alpha Initials</a>, <a href="http://www.p22.com/ihof/cilati.html" rel="nofollow">Cilati</a>, <a href="http://www.p22.com/ihof/fjpeople.html" rel="nofollow">Frau Jenson People</a>, <a href="http://www.p22.com/ihof/tulda.html" rel="nofollow">Tulda</a>, <a href="http://www.p22.com/ihof/font.asp?font=bastyan&amp;face=bastyan" rel="nofollow">Bastyan</a>, <a href="http://www.p22.com/ihof/font.asp?font=alpharoman&amp;face=alpharomanpro" rel="nofollow">Alpha Roman</a></p>
