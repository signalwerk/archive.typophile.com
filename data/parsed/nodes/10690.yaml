    date_raw: 11 Mar 2003 — 9:56am
    votes: null
    html: "<p>I've used both VTT and FontLab for hinting. Leaving aside the fact that one is free and the other is not, here are the main differences: <br> <br>FontLab hinting is relatively easy to learn, the interface and visual tools are fairly intuitive, and the manual is pretty good on this topic. FontLab's tools provide access to the most common subset of things that one would want to do with TT hinting, so it is my tool of choice for most jobs. <br> <br>VTT was written by a text rendering engineer and has a very unfriendly user interface and progressively messy visual controls (the word 'spaghetti' is frequently used to describe the links in VTT). Although there is some documentation available, VTT presumes that you know a certain amount about TT hinting before you start (so even if you intend to use VTT, it is a good idea to download the FontLab manual PDF and read the hinting section). Despite these drawbacks, however, VTT is much more powerful than FontLab since it exposes the entirety of the TT hinting model. As an example of the difference between VTT and FontLab, the latter only permits deltas of up to one pixel, while VTT can be set to apply deltas of up to eight pixels. The number of times in your life when you will want to apply a delta of more than one pixel is probably pretty small, but it's nice to have this ability in VTT in case you ever need it. VTT can be used in three different ways: visual tools, TypeMan talk (a 'high level' hinting language), or directly on the TT code itself (recommended only for real experts). Again, you are unlikely to need this extra power.</p>"
