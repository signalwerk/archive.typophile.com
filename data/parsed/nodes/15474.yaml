    <p>Hi..I'm working on a project where I am imitating the theme of the kids books "I Spy."</p>
    <p>Could someone help me identify the fonts used on the cover, and perhaps recommend something similar (doesn't need to be exact, the words wont be 'I Spy').</p>
    <p>Here's an image of said cover<br>
    <a href="http://buy.overstock.com/images/products/bnt/FC0590462954.JPG" title="http://buy.overstock.com/images/products/bnt/FC0590462954.JPG">http://buy.overstock.com/images/products/bnt/FC0590462954.JPG</a></p>
    <p>Any help is appreciated, thank you</p>
