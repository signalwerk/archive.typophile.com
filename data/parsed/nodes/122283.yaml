      <p>Sorry to bump an old thread but if you're wanting to clean it up i'd personally remove the grey decorative stuff from the logotype and maybe simplify and reduce the flourishes on the capital letters. Neaten up the curves of all the letters and maybe try increasing the contrast between stroke widths.</p>
      <p>The 'n's look very gaelic rather than germanic in the original example. Maybe have a search for some contemporary celtic / gaelic uncial type for some inspiration.</p>
