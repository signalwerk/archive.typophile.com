      <p>Thanks for the feedback, and to answer your questions about tone and theme, I think we are wanting to move in a more "modern" and "sophisticated" direction, while maintaining a tie to the pseudo-Victorian flavor, since we specialize in antique jewelry.</p>
      <p>I attempted to examine the House Luxury typefaces for a possible replacement, but their licensing seems to be a bit... difficult, considering this will be going on ring boxes, bags, identity stationery, and signage at least. I even looked at generic solutions to just increase legibility at a distance with engraving-based type, which instead of making it look more refined, only served to make it look pedestrian. </p>
      <p>At any rate, thanks very much, I will wrestle with this some more, and if anyone has any more suggestions, they will all be accepted thankfully and thoughtfully. </p>
      <p>Thanks,<br>
      A Letter-Err-er</p>
