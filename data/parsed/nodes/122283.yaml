      <blockquote><p>I am a fairly competent graphic designer</p></blockquote>
      <p>I’m afraid here calligraphy and lettering skills are needed first.<br>
      Adding to what was already said, I think the mark needs to be redrawn, regardless of if or how much you want to “modernise” it. If anything the curves on the initials need to be cleaned up (or, if deemed appropriate, given a proper quill/brush rough effect), and the repeating letters need to be harmonised.<br>
      That said, I like the overall lombardic feel of it, and think that, if you restrain its swirls a bit, the |A| would make a very nice mark/punch for jewellery.</p>
