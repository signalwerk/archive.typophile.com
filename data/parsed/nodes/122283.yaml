    <p>Good day everyone,</p>
    <p>I have been considering a realign of my families brand for a few years, and the legibility of the current logo has recently been discussed and not being ready for moving into a larger market, which we are considering. </p>
    <p>I am an amateur at this, and before I go stumbling through this process, I was wondering if you all had any suggestions on where to start. </p>
    <p>This is what I am starting with: <a href="http://i.imgur.com/gsk45Dz.jpg" title="http://i.imgur.com/gsk45Dz.jpg">http://i.imgur.com/gsk45Dz.jpg</a></p>
    <p>For some background, this was hand lettered by a calligrapher friend of my Mother's about 20 years ago, and I was put in charge of digitizing it for advertising. I made a vector version in Illustrator 3, and stayed as true to the original as possible, even the uneven curves. As we have moved to the web, and billboards, the vector version has been updated to be a bit more legible, lightening the accent lines, and bringing a bit of depth into the main letterforms at the request of my family members (I like it just flat black). </p>
    <p>What I am looking for is a typographic direction to move in to retain the character, but increase legibility and refresh the brand a bit. There are some bits that seem based on the Blackletter Rotunda style, with a heavy Uncial primary character, but I am at a loss for what I should be looking for to replace it or at least to clean it up.</p>
    <p>I have considered replacing it entirely, and just finding a good pseudo-Uncial to work with, or modernizing it and making a nice and clean logotype without the baggage, so to speak. There are a lot of people I know of and respect on these boards, and I am just looking for a bit of guidance before it hit the big-bad dark forest alone. </p>
    <p>Thanks very much in advance,<br>
    A type-piker.</p>
