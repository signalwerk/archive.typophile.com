      <div class="comment-spam-body"><p>You might want to back up a step or two and ask yourself what personality your business has, what personality you want it to have and what audience you're targeting.</p>
      <p>Not knowing anything about your your jewelry business, I really can't say what's appropriate. Your existing logo, however, is complicated and nostalgic. I hope this doesn't come out wrong, but it doesn't say jewelry to me as much as it suggests old-fashioned confectionaries, sarsaparillas, horseless carriages and my great grandfather's antique pocket watch.</p>
      <p>If that's the look that you want and feel is most appropriate for your business, great; it's probably time to think about cleaning up the lettering a bit. On the other hand, if the business might benefit from something a bit more contemporary and more apt to appeal to a younger target audience, you might want to consider a more fundamental redesign.</p>
      <p>Would an old-fashioned look be most appropriate, or should it be a bit more modern? Should it be sleek and svelte or elegant and elaborate? Should it appeal to wealthy 50-somethings or style-conscious, but not-quite-so-wealthy 30-year-olds? I guess what I'm saying is that it generally helps to decide on a destination before changing one's clothes.</p>
      </div>
