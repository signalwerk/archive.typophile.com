    html: |-
      <p>For the sake of clarity, I would flop the vertical stroke of K so that it is straight on the outside.<br>
      Pinching Z in the middle seems like a good idea. S would not hold up to that, but as it is, it obviously doesn't belong.<br>
      Really, all the C, G, S terminals may best be changed to something different. Perhaps this is where you bring in a cue from the numerals.<br>
      I would expect something more interesting from the Q tail, but I should note for full disclosure that I find myself saying that to a lot of people.</p>
