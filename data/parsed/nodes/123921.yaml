      <p>Thank you both for sharing opinion, its good to hear your doubts. Probably I'll change terminals to rounded although I am afraid of blob fonts. Previously I tried to use my basic shape for numerals but it wasn't successful so I decided to match only other attributes and make them less flourished.<br>
      I'll post the changes soon.</p>
