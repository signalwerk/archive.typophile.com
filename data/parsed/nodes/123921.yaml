  html: |-
    <p>Hello,</p>
    <p>Here's my first attempt to font design. I am an architect,<br>
    and letters are constructed, same round parts and same corners mixed.<br>
    Set of capitals only. I hope it can work as a title text for a magazine. </p>
    <p>What do you think about the lack of the stroke contrast at Z &amp; S glyphs?<br>
    Numbers are a little bit lower than letters, but now I am not sure about that decision (?)<br>
    2, 3, 5, 7 are also narrow and I like it, but maybe I should try to match it with the rest ?<br>
    7 probably isn't balanced but I can't find better angle now,<br>
    its hard to play with S stroke and avoid kinks ughhh</p>
    <p>thank you</p>
    <p>(sample 2 - with no final spacing)</p>
