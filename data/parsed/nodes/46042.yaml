  html: |-
    <p>Hi, </p>
    <p>I'm looking for a typeface to work with Apex new (<a href="http://www.vllg.com" title="www.vllg.com">www.vllg.com</a>).<br>
    Apex will be used for body copy and i need a title face to go with it. It is being used for a major Sporting Stadium currently under construction. The typeface will be used primarily to number sections of the stadium and key wayfinding signage. The typeface needs to be highly ledgible, and reproduce well in a large format.  </p>
    <p>Some suggestions i have had are DIN, and a custom version of DIN with rounded corners. Neither of which i think are suitable. </p>
    <p>I look forward to some suggestions!<br>
    Thanks in advance. </p>
    <p>Thomas.</p>
