    html: <p>karl, I don't know from where you are but the fact that Hess designed Capitalis Pirata should not bother you. <br>In fact Hess used many letters from german (I think) commercial logos and it would be really nice if everyone, from various countries, would produce a national version of Capitalis Pirata. <br> <br>After all we might end up having the most world-recognizable set of letters from commercial logos. Capitalis Pirata is pretty close, but some letters and numbers are obscure to me. <br> <br>Needless to say that probably it's legal until you give it away for free, or as a gift with another typeface at best.</p>
