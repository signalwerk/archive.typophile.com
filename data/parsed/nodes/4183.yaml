    html: <p> actually I don't think its all that illegal. I think you need to get permission from alot of people but - FUSE or Fontek (can't remember) someone anyway puts together sets such as this - military symbols, cartographic, commercial (visa, MC ect.) and international association logotype sets. <br> <br>The tricky part would be in selling it - Why would any such firm or designer need these logos? whats the motivation? either they already have them as a client or they aren't needing them. </p>
