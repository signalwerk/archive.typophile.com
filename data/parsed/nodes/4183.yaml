    <p>This is my first post to the forum. I've been interested in type design for a while now, but I just found this site. Recently as a project I was working on I thought it would be interesting to create a font using exclusively logo pieces. Consider this a modern day version of "The ABCs." I doubt this is legal to do, but feedback would be appreciated nevertheless. <br> <br><img src="http://www.typophile.com/forums/messages/29/3294.gif" alt="spect.gif"></p>
