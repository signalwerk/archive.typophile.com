    <p>In my typography class, we have to “Comp” a paragraph.. (it’s like finding out how many words/characters there are before Microsoft Word was invented LOL) </p>
    <p>ANyway, is there a good tutorial on how to do this on the net somewhere? </p>
    <p>Perhaps with pictures.. easy to understand.. </p>
    <p>My book doesnt explain it very well, and my class is hybrid format and i dont really have a teacher.. </p>
    <p>Here’s what the assignment says..</p>
    <p>“Comping - Due- April 2 </p>
    <p>Line Length = 36 picas<br>
    Comp Garamond; 60 pts; uppercase<br>
    Comp the paragraph on Page 28 as 12/18” </p>
    <p>we got some tracing paper and this transparency-ruler thing with points, inches, and picas on it... </p>
    <p>and this part in my book says...<br>
    “When comping text type, you need only suggest the lines of type, not render each individual word.. “</p>
    <p>and then for Comping Display Type... it says..<br>
    “When comping display type, you must carefully trace each letter so the copy is readable and the typeface is recognizable.. “</p>
    <p>It’s apparently an old way of doing something that became obsolite after computers were invented.. </p>
    <p>but i cant find ANY info about it on the net at all &gt;_&lt;</p>
    <p>Thanks ^^</p>
