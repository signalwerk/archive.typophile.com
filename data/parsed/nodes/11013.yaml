    html: "<p>&gt;It took me little time to type up \"Or its original source, TodaySans.\" and hit the button. <br> <br>Ah, yes, hitting the button is easy. But there is more than one ethical issue here.  <br> <br>One is the question you consider: proper acknowledgement of inspiration for your work. When and where should you do this? I think it should be done, but if it has been, then repeating it in advertising material it seems to me is asking too much. <br> <br>The other ethical issue is: when it is legitimate to disparage another person's character? This is regarded as a grave sin in both Buddhist and Rabbinic ethics, even when what you are saying is true. In Rabbinic ethics, it is especially a problem when a person's professional reputation is being potentially stained. There are, however, occassions on which a compelling reason overrides this prohibition, such as that another person will be cheated if you don't speak, or a serious injustice will be perpetuated.  <br> <br>Ethically, people are really in a different category than typefaces when it comes to criticism. </p>"
