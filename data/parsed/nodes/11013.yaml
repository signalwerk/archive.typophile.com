    html: <p><i>But I would say that innovation is the main ingredient...</i> <br> <br>That's a Romantic view of culture. Without denying the role and importance of innovation, and the kind of individual genius that usually produces it, a Classical view would reject the idea that such innovation is the main ingredient. Rather the aggregate of human activity defines culture, and the most important element is not innovation but tradition, not individual genius but collective engagement (civitas). As Ezra Pound said, in a rare moment of lucidity, 'Civilisation is not a one man job'. <br> <br>I don't think it is possible to describe a typeface as 'culturally significant' if no one is using it. And, yes, this does mean that Arial is a culturally significant typeface, proving that not all culture is good culture and that culture can exist because of commercial or technological accident rather than creative inspiration.</p>
