    html: "<p>I was browsing at a magazine store yesterday, and I saw Cronos used in Mac Design as a text face. The display face is Trebuchet... Cronos reads really well as a text face, owing to its 'humanist' characteristics (!). Cronos is also used for the brochure the publishing courses at Simon Fraser University in Vancouver. <br> <br>Cronos does work quite well with other Simbach's types. For my slab-serif paper I used Warnock with it. I got the Type Classics for Learning pack while I was still a student. It's terribly good value for some excellent types. A great way for a student to start up a really useful type library. <br> <br>Never thought Todays Sans was the source for Cronos, but now that you've mentioned it, I do see the similarities. Hrant: just how does one measure the 'cultural significance' of a typeface? I think it would probably take years for any type to become 'culturally significant'... Cronos is still pretty young. So Todays Sans is culturally significant you say? Didn't realize that...</p>"
