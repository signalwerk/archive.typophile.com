    html: "<p><i>Ok, let set up a rule (perhaps a game in fact): For each new typeface, list ALL influences (including thoses you suppose others will imagine too as influence) you can have on the specimen showing.</i> <br> <br>If ATypI goes to Prague next year, as has been suggested, I have in mind to propose a presentation entitled 'Closely Watched Type' (an allusion to a famous Czech novel and film, Bohumil Hrabal's _Closely Watched Trains_), in which I would, glyph-by-glyph exhaustively identify all the influences and inspirations from other typefaces, works of art, dreams, etc. I would also animate some outlines, to show the development of a glyph and how, during its design, some initial influences disappeared and can no longer be detected, even though they remain in the mind of the designer.</p>"
