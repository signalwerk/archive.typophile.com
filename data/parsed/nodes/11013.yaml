    html: <p>I think Cronos is different enough to make it too small of a fish to fry - there are some narwhals out there. But it does have some telltale signs of  <i>structural</i> plagiarism, and it would have been nice if they would just give due credit. That's all. <br> <br>&gt; annoying ink traps <br> <br>TodaySans's ink traps are pretty subtle, and this benefits any text face. Looking at a text face at 200 pt is something a <i>reader</i> would never do. Don't believe those who say traps are unnecessary. All the <i>really</i> good designers use them (when needed). Not using them might be economically smart for certain markets (in the same way I think making smallcaps is largely pointless for most users, economically), but never technically so. <br> <br>&gt; superior <br> <br>I think in a vacuum Cronos could be seen as superior. Certainly its MM axes make (or used to make) it more versatile. But it is also less pure, and less original - less culturally significant. Which is what people remember. <br> <br>hhp <br></p>
