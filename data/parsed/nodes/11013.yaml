  html: <p>Well you learn something <a href="http://cgm.cs.mcgill.ca/~luc/cronos.html">new</a> every day.  <br> <br>To me, Cronos looks substantially different to Today Sans, unmistakably a Slimbach design (check out the lower counter of the 'g', similar to his Garamond, Warnock and Minion). The angled brushed-like ends of strokes, stronger modulation of stroke width, and abscence of annoying ink traps make Cronos the superior of the two in my book, and set it far enough apart to clear it of the above-linked charges.</p>
  html_clean: <p>Well you learn something <a href="http://cgm.cs.mcgill.ca/~luc/cronos.html" class="link-external">new</a> every day.  <br> <br>To me, Cronos looks substantially different to Today Sans, unmistakably a Slimbach design (check out the lower counter of the 'g', similar to his Garamond, Warnock and Minion). The angled brushed-like ends of strokes, stronger modulation of stroke width, and abscence of annoying ink traps make Cronos the superior of the two in my book, and set it far enough apart to clear it of the above-linked charges.</p>
