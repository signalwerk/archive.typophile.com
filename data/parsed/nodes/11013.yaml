    html: '<p>Ok, let set up a rule (perhaps a game in fact): For each new typeface, list ALL influences (including thoses you suppose others will imagine too as influence) you can have on the specimen showing. And ask to put it at the end of the publisher catalog too. At the end theses lists will take more space than the fonts showing themselves. <br> <br>And some people will start a new topic on typophile.com and discussing why all typefaces showing are nowadays so small in catalogs and start to complain about them, for whatever reasons. <br> <br>More later, couple of years after, some old guys (the same who have very very long list of influence) will tell young guys why all theses small showing started to became more and more smaller. all of this came from a 2003 topic about how two different typefaces can be related each others. <br> <br>In same time, during some annual type conference, the type designers with the most long list of influencers will be honored by a prize (given only every three years), perhaps called "Cronos prize" in memory of the good old days of catalogs with big typeface showing perhaps? <br> <br>In reality this is not funny at all. <br>So, my new problem is why Comic Sans is so influence by Souvenir? I hope to have a good pdf comparison ready for next 1st april 2004. <br> <br>Bonne nuit.</p>'
