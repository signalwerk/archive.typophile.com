    html: <p>&gt; just how does one measure the 'cultural significance' of a typeface? <br> <br>Who knows! <br>But I would say that innovation is the main ingredient, although it does have to be tempered with usability, because real-world usage -hence exposure- is very important in type culture. <br> <br>My opinions on Today-Sans are frankly derived in large part from those of Bill Troop (who tends to get very passionate about plagiarism, especially the covert kind). Although my own historical insight is limited, I do see certain innovative traits, and in combination they make Today-Sans highly unique. <br> <br>hhp <br></p>
