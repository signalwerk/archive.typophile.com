    html: "<p>&gt;more significant than such a minimal sample is the mistrust that an... etc. <br> <br>The problem is not the guys who post the samples, but the fonts and the designers themselves. No? <br> <br>And as, from the first day I looked at these two fonts, there is NO relationship between them. I see more relation between Today and Syntax than in Chronos and Today. I see more relationship between Chronos and all other Slimbach typefaces than any others. Just look at the figures structure in Adobe Garamond and Chronos. Same applies with his Minion compared to Chronos. <br> <br>That it, its a plain Slimbach typeface. Chronos is not a first type attempt from a young guy, it came after already many very good key typefaces. I really don't understand why a guy like Slimbach will lost his time to make a copy of Today, when he have the skills he have. Designing a typeface from scratch for Slimbach is matter of minutes, hours for a quite perfect result (for other eyes, not for him, as any others artists, its why he continue to design typefaces after all), as any master in this art. <br> <br>I clearly see the philosophy of RS on Chronos: How to emulate handriting roots in a Sans, as we can do in a Serif typeface. His answer is Chronos. Handwriting his the key of all (special cases are Adobe Garamond 1989 and Myriad 1992 for good reasons) of his typefaces. Little like Zapf in some aspects, but in different results. I see more influence from Zapf and Schneider and others master calligrapher in Slimbach typefaces than anything else. If the people who kept going stupid accusation such TodayChronos don't understand than basic fact, they really not in position to understand anything in typeface design philosophy, and all the hours, us typeface designers when spend in front of our designs. <br> <br>As usual, some people seems to close their eyes, stop to built their own analyse and lost their \"bon sens\" in front a of problem. They prefer to listen any stupid BIG words without any senses from people who just have a jealousy problem, as its with Trajan drama or some others typefaces with good reputation. <br> <br>Built your own thinking rather than built it from others fake comments without any feelings and open eyes on the typeforms themselves. <br> <br>Or, quickly you finally to put in same basket Slimbach and others with Mr King and others. This is dangerous and, its too me, what behind this eternal stupid accusation. <br> <br>Joyeuses P</p>"
