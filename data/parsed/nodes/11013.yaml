    html: <p>To my amateur typofile eyes, the italic of Cronos in the posted sample has a quite different structure than Today Sans. The roman is similar, but for example the bent tops of the 'r' and 'n' stems is also in Meta, which I think is earlier than TodaySans.   <br> <br>The larger question here is this. R.G. Collingwood, in his book 'What is Art?' points out that the periods when the greatest work has been done, such as Shakespear in literature or the Renaissance in visual arts, the people took from each other pretty freely. The community is helping even the best people to be better. At the same time, people do need to get credit and earn money for what they have produced. How do you serve both these goals?  </p>
