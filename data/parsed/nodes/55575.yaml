    <p>Greater Albion's latest release is Absinette,which takes us straight back to 19th century France. Its a decorative family of Roman faces in three widths as well as a more elaborate inline style, ideal for posters with an Edwardian or Victorian theme.  Here's a quick preview image:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Absinette_5822.png"></div><p></p>
    <p>More samples of Absinette in action can be seen at <a class="freelinking external" href="http://gatf.wordpress.com/ " rel="nofollow"> Greater Albion's blog</a></p>
    <p>Absinette released via <a class="freelinking external" href="http://www.myfonts.com/fonts/gatf/absinette/ " rel="nofollow"> MyFonts.com</a>.</p>
