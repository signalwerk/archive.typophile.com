      <p>You mean <a href="http://www.linotype.com/359/ehrhardt-family.html">Ehrhardt</a> from Linotype?<br>
      For use in a report, if you use a larger size for headlines instead of a bold (no need for a bold in a serious document), you get away with only two styles: Regular and Italic. Say, for use on Win or OSX you choose the TTF version — only about Euro 50 total. I bet you will write more reports in future, and have some written correspondence too. How many DVDs or CDs do you buy each month?&nbsp;&nbsp;;-)</p>
      <p>Karsten</p>
