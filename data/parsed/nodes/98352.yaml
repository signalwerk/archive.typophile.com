      <p>I would dare to disagree - there are a large number of wars where "one sick looney" was all it needed. Just think of the Conquest of England in 1066 - William II was the one and only reason for all of it. Or think of the Napoleonic wars - it was Napoleon who caused it, and he was the one who gave the orders. And so on.</p>
