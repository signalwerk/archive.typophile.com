    html: <p>Letterforms are products of a people's culture, just like clothes and music. When a regime wants to suppress a group, one of the weapons it uses is banning that group's cultural expressions (some examples are France's ban of the burqa and Taliban-era Afghanistan's ban of most secular music). Fraktur types were widely used in Germany until the Third Reich banned them in 1941 because it believed these faces had Jewish origins.</p>
