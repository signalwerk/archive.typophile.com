    <p>This time it's political. I have just ‘blacked out' <a href="http://www.100types.com" rel="nofollow">100types</a> in protest over the coming legislation here – the ‘draconian’ s92A Copyright Amendment Act. If you know or deal with any New Zealanders online (<em>especially</em> the creative ones), remind them to sign the petition at <a href="http://www.creativefreedom.org.nz" rel="nofollow">The Creative Freedom Foundation</a> and write to their MPs this week. </p>
    <p>For evil to triumph, good men and women need do nothing* – but if guilt upon accusation and the subsequent summary disconnection of one's online activities bothers you in any way – join the protest.</p>
    <p>*misattributed to Edmund Burke, apparently.</p>
    <p>[Edit] just in at midnight our time... <em>"The Creative Freedom Foundation are celebrating tonight after National's announcement this afternoon that Section 92A will be scrapped, and that they will work towards finding an alternative."</em></p>
    <p>Normal service has been resumed; please do not adjust your set.</p>
