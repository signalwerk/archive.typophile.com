    html: |-
      <p>Thank you a lot for your feedback and proposals.</p>
      <p>I agree on <strong>awkward letterforms</strong> as well as on <strong>too subtle to grasp</strong> and so I decided to think about the whole concept again. I once wrote that I like the morph because it represents the word "simplicious" as a whole without seperating the two parts of it too much. But after some kind of an "internal monologue" I realized that the word "simplicious" will alwyas be presented as a whole because of the fact it's the word that's written down and so <strong>the "morph" is too unspectacular</strong> too make an obvious distinction of the two parts.</p>
      <p>That's about the time where all your feedback (also from other forums) came in and offered me some kind of playground to experiment with the concept.</p>
      <p>The latest version again consists of <strong>Univers</strong> for the "simple"-part but this time I choose the <strong>65</strong> typeface. For the "delicious"-part I've tried some very different typefaces. I ended up with <strong>Bauer Bodoni</strong> which I'm very comfortable with. The italic typeface has such a <strong>nice rounding</strong> which -- in my opinion -- transports the content very well. This combination of a bold typeface and a regular italic one creates a nice distinction concerning the <strong>grey value </strong> which I really like a lot.</p>
      <p>All in all the new version is more "logo" than the first one. It still works at very small sizes which was the major problem of the first version because of it's subtlety which was gone as soon as it was smaller. It only looked awkward because of the customized letters and their quality of execution which was far away from the quality of the original letterforms of Univers and Sabon.</p>
      <p>I hope you can give me such a <strong>constructive feedback</strong> on the new version as you have given me on the old one. I am really looking forward to your professional critiques.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/uni-baubod_logo_5205.png"></div><p></p>
      <p><cite><strong>p.s.</strong> I hope I got the kerning right. I'm not too sure about the "ci"<br>
      and the "ou" but maybe you can help me with this.</cite></p>
