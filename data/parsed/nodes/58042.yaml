    html: <p>I would disagree with the direction of the abrupt typeface change. Based on your brief, this doesn't reinforce the name nor the concept of the company. I believe the concept can be done in it's original form, but maybe the typefaces are not the right fit for this particular process. I'd explore sticking to two of the same type of typefaces, instead of going from a sans-serif to a serif. You might want to play with the idea of taking one serif, and then create a metamorphosis into a more exaggerated serif typeface. I think that might help with the reduction of awkward letterforms.</p>
