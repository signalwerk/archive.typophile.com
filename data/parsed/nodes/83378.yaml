  - id: 469727
    user: 8260
    date: null
    date_raw: null
    votes: null
    html: <p>Lettering can be handmade OR produced on a computer. The real difference is that a piece of lettering is produced as a one off solution to a specific problem, whereas a font is made to work as well as possible in a large number of unknown applications.</p>
    html_clean: <p>Lettering can be handmade OR produced on a computer. The real difference is that a piece of lettering is produced as a one off solution to a specific problem, whereas a font is made to work as well as possible in a large number of unknown applications.</p>
