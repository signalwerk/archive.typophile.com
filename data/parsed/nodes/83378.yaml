    date: null
    date_raw: null
    votes: null
    html: <p>A font is a program that renders a typeface (design) on a computer; lettering is when words are created individually by hand.</p>
    html_clean: <p>A font is a program that renders a typeface (design) on a computer; lettering is when words are created individually by hand.</p>
