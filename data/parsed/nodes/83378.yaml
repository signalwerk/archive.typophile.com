      <p>Do you mean you're drawing the letters on paper or drawing them digitally and creating a font that you can use on the computer?</p>
      <p>And what are the fonts you have found? Are these on your machine? Or printed specimens? </p>
      <p>And what are you doing with the resulting typefaces? If you're selling someone else's design without acknowledgement that's not good.</p>
      <p>And are you copying faithfully or interpreting/extrapolating from the source designs?</p>
