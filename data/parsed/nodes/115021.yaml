      <p>Can't find a match and kind of tricky too... Some letters seems to have alternate(s): 2 /W, 2 /B, 3 /R... You best chance is probably asking directly <a class="freelinking external" href="http://www.onlysunwoodworks.com/about" rel="nofollow">Matthew Brown</a> and if he answers, drop the answer here. But, I'd be no surprised it'd be a custom job.<br>
      Adding <a class="freelinking external" href="http://www.dafont.com/biko.font" rel="nofollow">Biko</a>, <a class="freelinking external" href="http://tenbytwenty.com/?xxxx_posts=nevis" rel="nofollow">Nevis</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/hvdfonts/brandon-grotesque" rel="nofollow">Brandon Grotesque</a> and <a class="freelinking external" href="http://www.swisstypefaces.com/fonts/euclid-flex" rel="nofollow">Euclid</a> to the list.</p>
