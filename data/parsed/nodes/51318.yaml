    <p>hey all, this is my first post on the forms, i use to pop by the site for information now and again but as im a bit stuck on my dissertation at the moment i thought i would ask if any of you kind people would help.</p>
    <p>Im writing my dissertation on Helvetica and its impact from release to modern day and im currently writing about the the early days when the Internation Typographic Style cam to use and with it helvetica. im struggling for physical examples of its impact on publications and mainly corporate idents and visual communication system and was wondering if anyone could give me some good examples of pre and post war material from the same source. i have plenty of random pieces but neither are from the same original source such as Coca Cola. </p>
    <p>im also struggling to find any companies that switched from x typeface to helvetica in the 60's</p>
    <p>also if anyone has any other pointers about things i should included in the essay they will be well received as tbh im am awful at writing essays.</p>
    <p>Thanks :)</p>
    <p>Matt</p>
