      <p>@crazyreaper: When asking for help on a bulletin board for something as important as a dissertation, be sure to cite it properly, lest your committee bust you for plagiarism. According to APA 6.0 the proper way to do this is:</p>
      <p>Dean, C. (2012, October 24). Re: Thread title (Online forum comment). Retrieved from <a href="http://url" title="http://url">http://url</a> of the thread</p>
      <p>In this case, replace my name and date with the time and person who answered your question.</p>
