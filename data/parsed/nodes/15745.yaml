      <p>Kristina—</p>
      <p>I'm using Myriad for the body copy and Trajan and Edwardian Script for other, with Porcelain (freely available from <a href="http://www.misprintedtype.com" rel="nofollow">Eduardo Recife</a>) for the caps on the Edwardian.</p>
      <p>I will definitely add in the clarification for first and last name and the expiry date, and also keep working with the "Invite you" section on the far left panel on page 2. I'm not terribly happy with it as-is and may be scrapping that typesetting for something better if I can come up with any decent ideas.</p>
      <p>T</p>
