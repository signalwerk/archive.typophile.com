      <p>Hi, </p>
      <p>I find it pleasing to look at and mostly well-spaced. You might consider leaving more space above the signature lines. My signature would not fit length or height wise in the space provided. </p>
      <p>Likewise, It might be useful on the "name(s)" line to specify first and last, especially if someone is going to be entering this information into a database. It can often be difficult to figure out which is the first/last name and many people write them inverted. </p>
      <p>I find that the "Y" of "Invite you" nearly obscures the word "patron" which I think might be something you'd like highlighted. Perhaps consider moving "to become a patron and supporter" down a bit or shifting things left/right so that the y overlaps "become" or "and" rather than "patron".</p>
      <p>Another suggestion -- where you ask for expiry date -- maybe consider stating m/y -- again, for clarity. (Think: 06/07 or 07/06?)</p>
      <p>What typeface are you using?</p>
      <p>Kristina.</p>
