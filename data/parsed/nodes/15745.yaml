      <p>The Clear English Campaign has some guidelines on form design, some of which should be taken with a pinch of salt because they don't really get into the technicalities of using fonts. They recommend 12 or 14 pt (which they call friendly) without any consideration of x-heights etc, but then it is a guide for non-typographers. There's some useful advice about use of language though, and structure and pattern which could be of some help.</p>
      <p><a href="http://www.plainenglish.co.uk/forms.html" title="http://www.plainenglish.co.uk/forms.html">http://www.plainenglish.co.uk/forms.html</a></p>
      <p>Anthony</p>
