    <p>Hello. </p>
    <p>I'm just posting to ask if anyone has any suggestions or critiques for the form section of a trifold I'm putting together for my university:</p>
    <p><a href="http://www.bleasedesign.com/junk/medici-trifold-051019-d.pdf" title="http://www.bleasedesign.com/junk/medici-trifold-051019-d.pdf">http://www.bleasedesign.com/junk/medici-trifold-051019-d.pdf</a></p>
    <p>I'm incredibly interested in typography, but the majority of the information I've read in books and seen online deals more with setting type for display and body copy—not necessarily forms meant to be filled out by end users. If you know of any information online about setting type for forms or good books, I'd definitely appreciate it if you could share.</p>
    <p>Thanks.</p>
