  html: |-
    <p>Hello!<br>
    I must say that I'm total newby when it comes to OpenType fonts. I use fonts to create wedding invitations in Latvian language. As most of free fonts available do not have glyphs that are in my language (such as ĀĒĪČŠ etc), I used HighLogic FontCreator to add missing glyphs and everything went well for me. (I never resell or redistribute fonts).<br>
    But now I have an OpenType font that is missing just one glyph - Imacron. As the FontCreator does not allow me to save edited OTF font back to its original OpenType and I do love the OpenType features, I had to search for other software.<br>
    I purchased the FontLab 5 software, generated my missing glyph and assigned it with unicode 012A. When I test font using the softwares Quick Test As feature, it writes my letter Ī perfectly, but when I generate font and install it, it does not show my created Ī.<br>
    I would greately appreciate any help on this, because I already suspect that the solution probabbly is something very simple...</p>
    <p>Thanks in advance,<br>
    Liva</p>
