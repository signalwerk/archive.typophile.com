      <p>One hires a postcard designer from the small pool of competent ones available locally, without committing the crime of discriminating by sex.</p>
      <p>One chooses a typeface from the thousands that are passively available, with no law prohibiting the sex of the designer from being taken into account.</p>
      <p>One has no choice about living in the real world.</p>
      <p>...ah, now I see how I am being too harsh. If the postcard is to reflect feminism, admitting a female influence into the project only in a way that does not give any woman any direct creative input into the project, yes, that does raise a bit of a question. One that <em>perhaps</em> can't be entirely waved away by citing short deadlines.</p>
      <p>I'm not convinced the issue is really ethical, not knowing the details of the situation, but upon reflection I see your point is much more legitimate than it first seemed to me.</p>
