      <p>"Serif" was what was requested...<br>
      But they seemed to like MVB Verdigris, so I guess it's something Garalde. It would have to perform well on screen, while not letting too much x-height make it too modern like a slab or a Clarendon (after all the user it represents are a collaborative union of an illustrator and a letterpress printer). It should have a certain style and asserts a clean and independent attitude (to accompany the theme of principled feminism), as opposed to highly functional typefaces designed just to look legible at 12 points, or to some Neo-Grotesque lacking any emotion and feeling.</p>
