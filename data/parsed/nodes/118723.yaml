      <p>Perhaps hypocrite was the wrong term, and tokenism or double standard would be more accurate.<br>
      Why should you be offended if my presumptions are incorrrect?<br>
      I made no presumptions about the gender of your client, for instance.<br>
      We are discussing ethics, how would you have phrased my inquiry?</p>
      <p>At any rate, I was querying whether your design process was hypocritical. If the project had been finished and I were “passing judgement”, that would have been different.</p>
      <p>It seems logical to me that if a client wants a job with gender-specific design, that if one is the wrong gender, the thing to do would be to decline in favor of a designer of the appropriate gender.</p>
      <p>How is this different than if the designer is expensive or busy? Wouldn’t the designer say to the client, you would be better off with a designer who charges less and can do the job quickly? </p>
      <p>In which case, the comparison is with charging more for one’s time and working with inexpensive materials. If that is a legitimate modus operandi, perhaps then tokenism is not so bad, and we need another word for it, such as empowerment? Just asking.</p>
