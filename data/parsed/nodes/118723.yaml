      <p>I think some very interesting points have been raised regarding consistency and purity of concept, though I have to agree when one says there is nothing inherently contradictory about a male designer working on a project about feminism.</p>
      <p>However, in what way does using a typeface designed by a female become anything about feminism? I think the notion that a female couldn't be found to do the job GrubStreet is doing makes the gender imbalance in the industry only more obvious. If this project is all about hidden symbolism, I would argue it's inconsistent hidden symbolism.</p>
      <p>Would you say if everything is designed by males the project becomes about male empowerment? I think not. I'm really annoyed with the fact that people think female exclusivity equates to feminism. You're not even verifying in what conditions these women made these typefaces.</p>
      <p>I think it's absolutely ridiculous restrictions have been set on the gender. Why wouldn't you select the typeface that works best for this project regardless of gender? Is someone going to say "Yes, this project could have been better, but we put a restriction on the gender". How is that feminist? It's ludicrous.</p>
      <p>Feminism is about equality, not exclusivity. You're leaning towards gender discrimination in the opposite direction.</p>
