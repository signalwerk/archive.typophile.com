    <p>Hi all, I'm looking for a serif (better not be slab or anything too modern) that is designed by a woman. Or at least its design process should include a woman.</p>
    <p>Currently I have found Mrs. Eaves (which we don't want for its poor on-screen performance), JAF Garamond (co-designed by Shoko Mugikara and Tim Ahrens, but it is, alas, unreleased), and MVB Verdigris (designed by a male, and the font file is produced by a woman). Any suggestions?</p>
