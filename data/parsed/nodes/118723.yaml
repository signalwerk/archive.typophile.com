      <p>Needlessly inserting myself into the argument seems unwise, but since there's little to lose...</p>
      <p>Online discussions lack verbal intonation and body language, so there's a heightened risk of misinterpretation. I'm assuming that's what's happened here. With that said, Nick did bring up an interesting issue regarding the contradictions and inconsistencies in a male making artistic decisions on a project about women artists.</p>
      <p>I don't think the issue rises to the level of questioning ethics, honesty or suggesting possible hypocrisy. But it does point out some interesting kinks in how far to go in maintaining purity of concept when the issue in question lacks inherent purity. We're a single species, and attempts to draw immutable dividing lines between our component parts is not only unwise, it's an effort in futility.</p>
      <p>A project about feminism (or masculinity) is fine, and I like GrubStreet's idea of using typography designed by a woman; it's a clever behind-the-scenes extra. The fact that he's a male points back to my previous paragraph about how, in reality, we're all one and that our differences don't preclude the commonalities that make us inseparable and dependent upon one another. In other words, I see no problem with his participation in this feminist project.</p>
