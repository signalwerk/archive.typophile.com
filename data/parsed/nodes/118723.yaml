      Your message is rather interestingly strange to me. It seems that you believe in some form of gender-specificism that would define a male designer as morally wrong if he ever taps into the females' design affairs (and probably vice versa?) – or, probably not morally wrong, but morally indecent. I disagree with this view; it seems to be a guise for imprudently extreme feminism. Yet I do not wish to elaborate my counterargument, since you have not clearly stated that you are with such views.</p>
      <p>I would like to emphasize that I have not participated in any of the work process of this series. My intern boss and her friend asked me if I have any ideas on an on-screen typeface that would replace their original choice, Mrs. Eaves, and I agreed to help them. There are only a few demands: beautiful, legible on screen, and designed by a female. And then off I went.<br>
      Then it all goes back to my previous post: is it morally wrong (or indecent?) to accept their request simply because I am not a female and I have no right to participate in their design judgments?</p>
      <p>I said that I felt offended after I read your first reply in which you said without any other elaborated arguments that I am a hypocrite. I am not saying that I am offended by your wrong presumptions, although wrong presumptions can certainly bring out negative effects. </p>
      <p>---</p>
      <p>Tokenism:<br></p><blockquote>the practice of making only a perfunctory or symbolic effort to do a particular thing, esp. by recruiting a small number of people from underrepresented groups in order to give the appearance of sexual or racial equality within a workforce.</blockquote>
      <p>How does tokenism even come into this conversation?</p>
