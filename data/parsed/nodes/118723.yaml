      <p>@Nick Shinn: I guess it is time that I am impelled to reveal some more background information.<br>
      I am a university student majoring in design. Now I work as a summer <em>intern</em> for a local letterpress artist who collaborates with her friend – an illustrator – to produce postcards, posters, etc.. These two women <em>decided themselves</em> that their work should be on the subject of feminism. As they both have inferior knowledge about on-screen typography (while superior about print typography), I decided to help them by providing advice.</p>
      <p>To be honest, as long as the typeface is beautiful and appropriate, I personally won't care if it is designed by a female or a male. But since it is a project about feminism, it's good to have a little secret: "see, not only the physical objects are produced by women, even the typefaces are!"</p>
      <p>---</p>
      <p>The problem here, @Nick Shinn, is that you presumed that a) I am hired to do design work, and b) my clients are supposedly (hypocritical) male who wants the work look feminine. Undoubted, but only in that case would I see the hypocrites in the situation. If I were you, I probably would be more cautious about my presumptions before using vocabulary of moral condemnation like "hypocritical."</p>
