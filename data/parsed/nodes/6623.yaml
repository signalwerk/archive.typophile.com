    date_raw: 10.Sep.2004 9.20am
    votes: null
    html: <p>The difficulty of making good design increases exponentially with the number of fonts used. So to me it's not that you have to use few fonts*, it's that you have to know your limits. We see few good designs that use many fonts not because there's something inherently wrong with that, but because there are very few people who can pull it off, and almost as few projects that benefit from it. <br> <br>* That's too Modernist, too simple. <br> <br>hhp</p>
