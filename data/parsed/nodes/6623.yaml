    <p>I have always gone with "less is more" when it comes to the number of fonts used on a website.  Somewhere in one of my books there is a "rule of thumb" that would be helpful if I could locate it but it seems to escape my attempts ... would you be so kind to share your knowledge and expertise on the number of fonts used and why less is more. <br>Thanks, linda</p>
