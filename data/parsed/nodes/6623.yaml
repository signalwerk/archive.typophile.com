  - id: 46471
    user: 3135
    date: 2004-09-10T15:30:00
    date_raw: 10.Sep.2004 3.30pm
    votes: null
    html: <p>I guess I have always wondered when it was that a "Rule of Thumb" mutates into "Rule of Thumbscrew." It is easy to forget what brought the "rule" into being and remember only the rigid absolute number.  Rules of thumb are perhaps meant for those who are not yet capable of deciding out of experience and are in search of guidence.   <br>A good designer can do a good job without any such "rules." A bad designer or perhaps a non-designer would be lucky to achieve mediochre results using such rules as opposed to bad results without them. <br>There is no "number"-- Let the problem speak to you and let your eyes be the judge.  The worst that can happen is that you made a bad design.  Don't worry, you would not be alone.  The world is filled with bad design. <br> <br>ChrisL</p>
