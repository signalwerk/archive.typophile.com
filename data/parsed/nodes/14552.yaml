      <p>Hi Daniel,</p>
      <p>I know that you are excited about your new font release. But posting a notice in three different forums at the same time isn’t exactly necessary. Nick is correct: this information really belongs in release only. However, you could also post a NEWS article (especially because of your sale price).</p>
      <p>The way one posts NEWS articles on the new Typophile site isn’t so clear. If you (in the future) go to the the page, you’ll notice that (for now) all posts have been posted by moderators. Just click on one of their names, and send them your text. We’ll post it for you.</p>
      <p>I’m not going to delete this thread, for three reasons:<br>
      1. I’m a new moderator, and don’t want to go willy-nilly deleting threads, just because I can.</p>
      <p>2. Discussion has cropped up on this thread. I’m always for discussion, even if it starts off on a less than perfect foot.</p>
      <p>3. You are new to posting here, as Dav correctly points out. I’d like you to stick around, so I’m going to give you the benefit of the doubt.</p>
      <p>BUT, I am going to delete your post in the DESIGN section. No one needs three posts to say the same thing.</p>
      <p>Good luck with the type sales, Daniel!</p>
