      <p>I don’t really see this as “taking a wack”, really. I did not attack our first time poster at all, I just commented on the typeface he so eagerly advertised in three areas of Typophile at once*. <em>Open discussion forum</em> implies we all can voice our personal opinion, even if it is less favourable and not to everyone’s liking.</p>
      <p>I won’t be getting into a fight over this, so if anyone thinks I went out of line, let me know and I’ll apologise. This is not worth staining my already dodgy reputation. :^/</p>
      <p><em>*If I *had* attacked him personally, I might’ve commented we don’t take spam-like posts lightly at Typophile. Which I didn’t. Admire the restraint.</em> ;^P</p>
