    <p>Hi all,</p>
    <p>I just wanted to let everyone know about my new font ‘Aurelie’ available at MyFonts.com. For this month there’s a 25% discount off the regular price. Previews are available on the site. The font is available in TrueType PC, TrueType MAC and OpenType format. If you’d like to have a look just follow the link below.</p>
    <p><a href="http://www.myfonts.com/fonts/danielkeithbale/aurelie/">http://www.myfonts.com/fonts/danielkeithbale/aurelie/</a></p>
    <p>Daniel Keith Bale<br>
    Graphic Designer / Occasional font designer</p>
