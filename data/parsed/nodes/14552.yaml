      <p>Hi everyone,</p>
      <p>I’m sorry if my post upset some people, that wasn’t my intention at all. Was I trying to advertise my font? Yes, I’m not denying that. If I did that in the wrong place and too many times then I’m sorry for that also. I was simply trying to self-promote myself, and my font, and I apologise if that came across as being arrogant. This is not an easy game to play, after all; there are hundreds of thousands of fonts and it’s difficult to make ‘one’ stand out. Thank you to everyone for your comments and critiques.</p>
      <p>Sincerely,</p>
      <p>Daniel Keith Bale</p>
