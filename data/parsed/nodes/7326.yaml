  html: <p>We are looking to do some final testing on a desktop font utility for Mac OS/X. This product will be free to use, no charge will be made for the finished program. If anyone is interested in trying out the program then have a look at the description here <br><a href="http://www.dtptypes.com/FontAware" target="_blank">http://www.dtptypes.com/FontAware</a> <br>and drop me an email, I will send you the final beta version.</p>
