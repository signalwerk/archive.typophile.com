      <p>I like Absara because Scala is being over done these days. Scala's presentaion is art-deco meets industrial europe- like DIN. Absara is geometric too but more subtle. However, I recommend you choose the one you like.</p>
      <p>Also think about Amor from Storm Type Foundry:<br>
      <a href="http://www.stormtype.com/typefaces-fonts-shop/pdf.php?pdf=F58" title="http://www.stormtype.com/typefaces-fonts-shop/pdf.php?pdf=F58">http://www.stormtype.com/typefaces-fonts-shop/pdf.php?pdf=F58</a></p>
      <p>Its maybe to soft for your project though... but check out the PDF to see if you like it.</p>
      <p>All my best,</p>
      <p>Mikey</p>
