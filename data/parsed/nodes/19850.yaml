    <p>Hi guys!</p>
    <p>I am designing a four page brochure for a Medical University. </p>
    <p>The fonts I have picked for the project are</p>
    <p>Sans – Headline	Serif – Body Text</p>
    <p>FF Scala Sans and Serif or<br>
    FF Nexus Sans and Serif or<br>
    FF Absara Sans and Serif</p>
    <p>I wanted to use Gill Sans initially, but I think it is overused and besides there is no Gill Serif to go with it. IMHO these fonts though resemble it, are actually better.</p>
    <p>If you guys were to pick 2 pairs among these what would it be? Better if anyone of you can tell me what the actual difference between them is and which to go for.</p>
    <p>Please help me with your expertise in this regard. I would be grateful for the same.</p>
    <p>Regards,</p>
    <p>lordkv</p>
    <p>P.S - I have attached the preview versions of all three in order of Scala (Left), Nexus (Right) and Absara (Below)</p>
