      <p><cite>...and besides there is no Gill Serif to go with it.</cite></p>
      <p>Actually, there sort of is a "Gill Serif." <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=M.125983.0.0" rel="nofollow">Joanna</a>, which is designed by Eric Gill is often used as Gill Sans' serifed counterpart.</p>
      <p>You might also find that Gill Sans/Joanna have much in common with Scala Sans/Scala. From what I understand, Martin Majoor closely studied Gill's designs when creating the Scala family.</p>
      <p>As for Gill Sans being overused, I don't think anyone can justly fault you if you use it well.</p>
