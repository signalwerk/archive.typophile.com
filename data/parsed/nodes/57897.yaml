  html: |-
    <p>Something strange happens to me. I have this simple structure:</p>
    <p>MikeFontThn.otf ---&gt; MikeFont -- Thin (menu appareance)<br>
    MikeFontRegular.otf ---&gt; MikeFont -- Regular (menu appareance)<br>
    MikeFontBold.otf ---&gt; MikeFont -- Bold (menu appareance)</p>
    <p>When I test them all together, there is no problem at menu name in Illustrator, Photoshop, Word, etc.<br>
    But when I only install only one of them, (for example, the regular) the menu appear like my font is:</p>
    <p>MikeFontRegular.otf ---&gt; Regular -- Regular (menu appareance)</p>
    <p>Whats going on here?</p>
    <p>Thanks a lot guys!</p>
