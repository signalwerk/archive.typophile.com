    <p>Hi Folks,<br>
    Anyone recognize this rather strange serif font, with a really bizarre g?  The book was published in 1978. The typeface also has an italic, shown on the back cover text. I have only scanned the front cover, because I would think these are sufficiently weird, that if you had seen it you would know it. Notice the 'fang serifs' on the c and e, and the baseline serif on the odd t.</p>
    <p>Thanks for any help. I want to add this to the Serif Guide.</p>
    <p>- Mike Yanega</p><div class="imageWrap"><img src="https://web.archive.org/web/20141113223727im_/http://typophile.com/files/Cacciato001_4491.gif"></div><p></p>
