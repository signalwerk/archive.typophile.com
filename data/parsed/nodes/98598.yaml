      <p>Fivos, thanks. I have written to Carlos Segura of T-26 to see what he can tell me about this font. Luc's information is generally accurate and thorough, so I believe that it was a T-26 font. I have T-26 catalogs from years ago, and have some that bracket the font number (T0488) that Luc listed, but I could not find the one showing "Indispose". It is certainly the sort of non-mainstream design that T-26 is known for.</p>
      <p>Hrant, I am curious why you categorized this as a 'swipe-n-hack' job. It seems like an original, if not attractive, font design. I suspect it may have been removed because the designer left T-26.</p>
      <p>- Mike Yanega</p>
