    html: |-
      <p>Just to close this out, although I am probably the only one who still cares, I heard back yesterday night from Alan Dague-Greene, the font designer. He said it is "not commercially available anywhere, and really shouldn't be." He said he didn't know why T-26 withdrew it from their collection, but he didn't mind that they did.</p>
      <p>When I told him I wanted to include it in the <a class="freelinking external" href="https://web.archive.org/web/20141113223727/http://www.bowfinprintworks.com/SerifGuide/intro.php" rel="nofollow">Serif Font ID Guide</a> he said "If you want to list it, I can't stop you, but boy is it awful."</p>
      <p>So it seems Hrant's speculation was right.</p>
      <p>- Mike Yanega</p>
