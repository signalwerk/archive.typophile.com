      <p>Hrant, you may be right. The font seemed quite complete, as I have found that it came in 3 weights, with SC, ligatures and italics for all weights, but he may have decided in view of later work, that it was not the quality he wanted to represent his work. He is the same designer who did FF Atma Serif three years later, and it has some similar features to Indispose. I have written to the designer, but have not heard from him yet, or from Carlos Segura of T-26.</p>
      <p>- Mike Yanega</p>
