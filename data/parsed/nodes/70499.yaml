    html: <p>Thnx John. My problem is solved using "Jalt" Justification Alternate. What i did it is that I let nastaleeq ligatures "rlig" correspond to their kasheeda alternates in the "jalt" table. Doing so creates "auto-kashida" in indesign cs5 when Kashidas and Naskh Alignment is checked :)</p>
