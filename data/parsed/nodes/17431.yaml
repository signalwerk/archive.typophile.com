      <p><em>Was fraktur generally printed at somewhat larger sizes than roman? I seem to remember old German books having bigger type…</em></p>
      <p>No. Frakturs can be small, and not break apart. I recently had a chance to photograph a bunch of old specimens, mostly from Frankfurt c. 1680. There are quite a few fraktur types there that are six to eight point, and very clear. Unfortunately, I can't show any of these images before March.</p>
      <p>Small Frakturs just have less stroke contrast, probably like all small type, I guess.</p>
      <p>Schwabachers were also made in quite small sizes, incidentally. But I wonder if Texturas ever really were. Gutenberg and his successors in Mainz printed with type that I find to be quite large.</p>
      <p>None of this is scientific. I've never done any real studies on this, but this is all a gut feeling.</p>
